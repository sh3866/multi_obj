<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Alpine Rush: Velocity</title>
<style>
    :root {
        --c-ui-bg: rgba(15, 23, 42, 0.6);
        --c-ui-border: rgba(255, 255, 255, 0.15);
        --c-accent: #38BDF8;
        --c-danger: #F43F5E;
        --c-success: #4ADE80;
        --c-text: #F8FAFC;
        --font-stack: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }

    body, html {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background-color: #020617;
        font-family: var(--font-stack);
        color: var(--c-text);
    }

    /* --- CANVAS LAYER --- */
    #gameCanvas {
        display: block;
        width: 100%; height: 100%;
    }

    /* --- UI LAYER --- */
    #ui-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        display: flex; flex-direction: column; justify-content: space-between;
    }

    /* --- HUD: TOP BAR --- */
    .hud-top {
        display: flex; justify-content: space-between; align-items: flex-start;
        padding: 24px;
        position: relative;
        z-index: 10;
        background: linear-gradient(to bottom, rgba(2, 6, 23, 0.8), transparent);
    }

    .panel {
        background: var(--c-ui-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--c-ui-border);
        border-left: 4px solid var(--c-accent); /* Tech accent */
        border-radius: 4px;
        padding: 6px 12px;
        display: flex; flex-direction: row; align-items: center; gap: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        transform: skewX(-10deg); /* Aggressive angle */
    }

    .panel-content {
        transform: skewX(10deg); /* Counter skew text */
        display: flex; flex-direction: column;
    }

    .label {
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--c-accent);
        font-weight: 700;
        margin-bottom: 1px;
    }

    .value {
        font-size: 18px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* Progress Bar (Top Edge) */
    .progress-track {
        position: absolute; top: 0; left: 0; width: 100%; height: 3px;
        background: rgba(0,0,0,0.3);
        z-index: 20;
    }
    .progress-fill {
        height: 100%; background: var(--c-success);
        width: 0%; transition: width 0.1s linear;
        box-shadow: 0 0 10px var(--c-success);
    }

    /* --- CONTROLS: BOTTOM --- */
    .hud-bottom {
        padding: 24px;
        display: flex; justify-content: space-between; align-items: flex-end;
        z-index: 10;
        background: linear-gradient(to top, rgba(2, 6, 23, 0.9), transparent);
        padding-bottom: 40px;
    }

    .controls-area {
        display: flex; gap: 16px;
        pointer-events: auto;
    }

    /* Large Tactile Buttons */
    .btn-control {
        width: 80px; height: 80px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-bottom: 4px solid rgba(255, 255, 255, 0.1); /* 3D effect */
        border-radius: 16px;
        display: flex; justify-content: center; align-items: center;
        cursor: pointer;
        transition: all 0.1s ease;
        color: rgba(255,255,255,0.7);
        backdrop-filter: blur(4px);
    }
    
    .btn-control:active, .btn-control.pressed {
        background: rgba(56, 189, 248, 0.2);
        border-color: var(--c-accent);
        border-bottom-width: 0px;
        transform: translateY(4px);
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        color: white;
    }
    
    .btn-control svg { width: 40px; height: 40px; fill: currentColor; }

    .stats-area {
        display: flex; align-items: flex-end; gap: 10px;
        pointer-events: none;
    }

    /* Speedometer - Integrated Bottom Right */
    .speedometer {
        display: flex; align-items: flex-end; justify-content: flex-end;
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.4));
        backdrop-filter: blur(12px);
        border: 1px solid var(--c-ui-border);
        border-right: 4px solid var(--c-accent);
        padding: 8px 16px;
        border-radius: 12px 0 12px 0;
        transform: skewX(-10deg);
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    
    .speed-val {
        font-size: 48px; font-weight: 900; font-style: italic;
        color: white;
        margin-right: 2px;
        line-height: 1;
        text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        transform: skewX(10deg);
        letter-spacing: -1px;
    }
    .speed-unit { 
        font-size: 12px; font-weight: 700; color: var(--c-accent); 
        letter-spacing: 1px; margin-bottom: 4px; transform: skewX(10deg);
    }

    /* Shake Effect Class */
    .shake { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake {
        10%, 90% { transform: translate3d(-2px, 1px, 0); }
        20%, 80% { transform: translate3d(3px, -1px, 0); }
        30%, 50%, 70% { transform: translate3d(-4px, 2px, 0); }
        40%, 60% { transform: translate3d(4px, -1px, 0); }
    }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
    <!-- Progress Bar -->
    <div class="progress-track">
        <div class="progress-fill" id="progressBar"></div>
    </div>

    <!-- Top HUD -->
    <div class="hud-top">
        <div class="panel">
            <div class="panel-content">
                <div class="label">Distance</div>
                <div class="value" id="distVal">0<span>m</span></div>
            </div>
        </div>
        <div class="panel" style="border-left-color: var(--c-text);">
            <div class="panel-content">
                <div class="label">Time</div>
                <div class="value" id="timeVal">00:00</div>
            </div>
        </div>
    </div>

    <!-- Bottom Controls & Stats -->
    <div class="hud-bottom">
        <div class="controls-area">
            <div class="btn-control" id="btnLeft">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </div>
            <div class="btn-control" id="btnRight">
                <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </div>
        </div>

        <div class="stats-area">
            <div class="speedometer">
                <div class="speed-val" id="speedVal">0</div>
                <div class="speed-unit">KM/H</div>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * ALPINE RUSH: VELOCITY
 * Revised Design: Focus on smooth textures, high contrast gates, and atmospheric depth.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

// --- Configuration ---
const CFG = {
    segmentLength: 120, // Slightly shorter for smoother curves
    roadWidth: 2000,
    drawDistance: 500, 
    cameraHeight: 1100,
    cameraDepth: 0.84, 
    maxSpeed: 450, 
    accel: 120,
    decel: 80,
    offRoadDecel: 300,
    offRoadLimit: 1.4
};

// --- State ---
let width, height;
let frame = 0;
let speed = 0;
let playerX = 0; 
let playerTilt = 0;
let distance = 0;
let startTime = Date.now();
let shakeIntensity = 0;
let particles = [];

// --- World Data ---
let segments = [];
let mountains = []; 

// --- UI Elements ---
const uiSpeed = document.getElementById('speedVal');
const uiDist = document.getElementById('distVal');
const uiTime = document.getElementById('timeVal');
const uiProgress = document.getElementById('progressBar');
const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');

// --- Resize Handling ---
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    generateMountains(); 
}
window.addEventListener('resize', resize);
resize();

// --- Input Handling ---
let inputLeft = false;
let inputRight = false;

const handleInput = (dir, active) => {
    if(dir === 'left') inputLeft = active;
    if(dir === 'right') inputRight = active;
    
    const btn = dir === 'left' ? btnLeft : btnRight;
    if(active) btn.classList.add('pressed');
    else btn.classList.remove('pressed');
};

const addInputListeners = (el, dir) => {
    el.addEventListener('mousedown', () => handleInput(dir, true));
    el.addEventListener('mouseup', () => handleInput(dir, false));
    el.addEventListener('mouseleave', () => handleInput(dir, false));
    el.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(dir, true); });
    el.addEventListener('touchend', (e) => { e.preventDefault(); handleInput(dir, false); });
};
addInputListeners(btnLeft, 'left');
addInputListeners(btnRight, 'right');

window.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowLeft') handleInput('left', true);
    if(e.key === 'ArrowRight') handleInput('right', true);
});
window.addEventListener('keyup', (e) => {
    if(e.key === 'ArrowLeft') handleInput('left', false);
    if(e.key === 'ArrowRight') handleInput('right', false);
});

// --- 3D Math Helpers ---
function project(p, cameraX, cameraY, cameraZ, cameraDepth) {
    const scale = cameraDepth / (p.z - cameraZ);
    const x = (1 + scale * (p.x - cameraX)) * width / 2;
    const y = (1 - scale * (p.y - cameraY)) * height / 2;
    const w = scale * CFG.roadWidth * width / 2;
    return { x, y, scale, w };
}

// --- World Generation ---
function generateMountains() {
    mountains = [];
    // Layer 1: Far
    let pts = [];
    for(let i=0; i<=width+100; i+=50) {
        pts.push({x: i, y: height/2 - 150 + Math.sin(i*0.003)*100 + Math.random()*40});
    }
    mountains.push({color: '#0F172A', points: pts, offset: 0, speed: 0.05});
    
    // Layer 2: Mid
    pts = [];
    for(let i=0; i<=width+100; i+=40) {
        pts.push({x: i, y: height/2 + 50 + Math.sin(i*0.007 + 50)*120 + Math.random()*50});
    }
    mountains.push({color: '#020617', points: pts, offset: 0, speed: 0.15});
}

function createRoad() {
    segments = [];
    const totalSegments = 4000; 
    
    for (let i = 0; i < totalSegments; i++) {
        // Smoother curves
        const curve = (Math.sin(i * 0.002) * 4) + (Math.sin(i * 0.015) * 3);
        // Hills
        const y = Math.sin(i * 0.008) * 1800 + (Math.sin(i * 0.002) * 1500);
        
        segments.push({
            index: i,
            p: { x: 0, y: y, z: i * CFG.segmentLength },
            curve: curve,
            // Alternating colors removed for smooth gradient look
            objects: []
        });

        // Procedural Objects
        if (i > 60) {
            // Trees
            if (i % 3 === 0) {
                const side = Math.random() > 0.5 ? 1 : -1;
                segments[i].objects.push({ 
                    type: 'tree', 
                    offset: side * (1.5 + Math.random() * 2.0),
                    height: 1.0 + Math.random() * 1.5,
                    color: Math.random() > 0.5 ? '#064E3B' : '#047857'
                });
            }
            // Rocks
            if (i % 25 === 0) {
                const lane = (Math.random() * 1.2) - 0.6;
                segments[i].objects.push({ type: 'rock', offset: lane });
            }
            // Gates (High Contrast Targets)
            if (i % 150 === 0 && i > 100) {
                segments[i].objects.push({ type: 'gate', offset: 0 });
            }
        }
    }
}
createRoad();

// --- Rendering Helpers ---
function drawPolygon(ctx, x1, y1, x2, y2, x3, y3, x4, y4, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.lineTo(x4, y4);
    ctx.closePath();
    ctx.fill();
}

// --- Particle System ---
function updateParticles() {
    // Spawn based on speed
    const spawnCount = Math.floor(speed / 20);
    for(let k=0; k<spawnCount; k++) {
        if (particles.length < 300) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                speed: Math.random() * 30 + 10,
                len: Math.random() * 1.0 + 0.5,
                type: Math.random() > 0.85 ? 'snow' : 'streak'
            });
        }
    }
    
    ctx.lineCap = 'round';
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        
        // Move down screen
        p.y += p.speed + (speed * 0.5); 
        // Parallax sideways
        p.x -= (playerX * 15); 

        if (p.y > height) {
            p.y = -20;
            p.x = Math.random() * width;
        }
        
        if (p.type === 'streak') {
            // Wind streaks (Sparse and Fast)
            const alpha = Math.min(0.6, (speed / 150) * 0.4);
            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x - (playerX*15), p.y - (p.len * 40 * (speed/80)));
            ctx.stroke();
        } else {
            // Snow
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.6 + 0.2})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, Math.random() * 2 + 1, 0, Math.PI*2);
            ctx.fill();
        }
    }
}

// --- Object Drawing Functions ---

function drawTree(ctx, x, y, scale, typeData) {
    const h = 2000 * scale * typeData.height;
    const w = 700 * scale;
    
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(x, y, w*0.8, w*0.3, 0, 0, Math.PI*2);
    ctx.fill();

    // Trunk
    ctx.fillStyle = '#1C1917'; 
    ctx.fillRect(x - w/10, y - h/6, w/5, h/6);
    
    // Leaves
    ctx.fillStyle = typeData.color;
    ctx.beginPath();
    ctx.moveTo(x, y - h);
    ctx.lineTo(x - w, y - h/2.5);
    ctx.lineTo(x + w, y - h/2.5);
    ctx.fill();
    
    // Snow Cap
    ctx.fillStyle = '#F1F5F9';
    ctx.beginPath();
    ctx.moveTo(x, y - h);
    ctx.lineTo(x - w/3, y - h*0.85);
    ctx.lineTo(x + w/3, y - h*0.85);
    ctx.fill();
}

function drawRock(ctx, x, y, scale) {
    const size = 600 * scale;
    ctx.fillStyle = '#334155';
    ctx.beginPath();
    ctx.moveTo(x - size/2, y);
    ctx.lineTo(x - size/2, y - size/2);
    ctx.lineTo(x, y - size);
    ctx.lineTo(x + size/2, y - size/1.5);
    ctx.lineTo(x + size/2, y);
    ctx.fill();
    
    // Snow on top
    ctx.fillStyle = '#E2E8F0';
    ctx.beginPath();
    ctx.moveTo(x, y - size);
    ctx.lineTo(x + size/2, y - size/1.5);
    ctx.lineTo(x, y - size/2);
    ctx.fill();
}

function drawGate(ctx, x, y, scale) {
    const w = 2400 * scale;
    const h = 900 * scale;
    const barW = 40 * scale;
    
    // Poles
    ctx.fillStyle = '#B91C1C'; // Deep Red
    ctx.fillRect(x - w/2, y - h, barW, h);
    ctx.fillRect(x + w/2 - barW, y - h, barW, h);
    
    // Arch Bar
    ctx.fillStyle = '#F8FAFC'; // Bright White
    ctx.beginPath();
    ctx.roundRect(x - w/2, y - h, w, barW * 1.5, 10 * scale);
    ctx.fill();
    
    // "GO" Text
    ctx.fillStyle = '#B91C1C';
    ctx.font = `900 ${55*scale}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText("GO", x, y - h + (barW*0.75));
}

// --- Main Loop ---
let cameraZ = 0;

function update(dt) {
    // Acceleration logic
    if (speed < CFG.maxSpeed) speed += CFG.accel * dt;
    else if (speed > CFG.maxSpeed) speed -= CFG.decel * dt;
    
    // Off-road penalty
    if (Math.abs(playerX) > CFG.offRoadLimit) {
        if (speed > 60) speed -= CFG.offRoadDecel * dt;
        shakeIntensity = 25; 
    }

    // Movement
    const speedMeters = speed * 1.2; 
    cameraZ += speedMeters * 2; 
    distance += speedMeters * dt;
    
    // Steering
    const steerSpeed = 3.5 * dt;
    if (inputLeft) {
        playerX -= steerSpeed;
        playerTilt = Math.max(playerTilt - 14*dt, -1.0);
    } else if (inputRight) {
        playerX += steerSpeed;
        playerTilt = Math.min(playerTilt + 14*dt, 1.0);
    } else {
        playerTilt *= 0.8; // Return to center
    }
    playerX = Math.max(-3.5, Math.min(3.5, playerX));

    // Shake Decay
    if(shakeIntensity > 0) shakeIntensity -= 45 * dt;
    if(shakeIntensity < 0) shakeIntensity = 0;

    // UI Updates
    uiSpeed.innerText = Math.floor(speed);
    uiDist.innerHTML = Math.floor(distance) + '<span>m</span>';
    
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const min = Math.floor(elapsed / 60).toString().padStart(2, '0');
    const sec = (elapsed % 60).toString().padStart(2, '0');
    uiTime.innerText = `${min}:${sec}`;
    
    // Progress Bar
    const progress = (distance % 10000) / 100;
    uiProgress.style.width = `${progress}%`;
}

function render() {
    // 1. Sky Gradient (Dawn/Dusk)
    const gradient = ctx.createLinearGradient(0, 0, 0, height);
    gradient.addColorStop(0, '#0F172A'); // Top
    gradient.addColorStop(0.5, '#1E293B'); // Mid
    gradient.addColorStop(1, '#38BDF8'); // Horizon
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);
    
    // 2. Shake Application
    let shakeX = 0, shakeY = 0;
    if (shakeIntensity > 0) {
        shakeX = (Math.random() - 0.5) * shakeIntensity;
        shakeY = (Math.random() - 0.5) * shakeIntensity;
        ctx.save();
        ctx.translate(shakeX, shakeY);
    }

    // 3. Parallax Mountains
    mountains.forEach(m => {
        ctx.fillStyle = m.color;
        ctx.beginPath();
        ctx.moveTo(0, height);
        m.points.forEach(p => {
            const x = p.x - (playerX * 80 * m.speed); 
            ctx.lineTo(x, p.y);
        });
        ctx.lineTo(width, height);
        ctx.fill();
    });

    // 4. Camera Math
    const baseSegmentIndex = Math.floor(cameraZ / CFG.segmentLength);
    const basePercent = (cameraZ % CFG.segmentLength) / CFG.segmentLength;
    
    const playerSegment = segments[baseSegmentIndex % segments.length];
    const playerY = playerSegment.p.y;

    let maxY = height;
    let curveX = 0;
    let dx = 0; 

    // 5. Draw Road (Painter's Algorithm)
    for(let n = 0; n < CFG.drawDistance; n++) {
        const index = (baseSegmentIndex + n) % segments.length;
        const segment = segments[index];
        
        let z = (n * CFG.segmentLength) - (basePercent * CFG.segmentLength);
        if (z <= 10) continue;

        dx += segment.curve;
        
        // Project points
        const p = project({ x: segment.p.x - (dx * 120), y: segment.p.y, z: z }, 
                          playerX * CFG.roadWidth, 
                          playerY + CFG.cameraHeight, 
                          0, 
                          CFG.cameraDepth);
        
        const nextIndex = (index + 1) % segments.length;
        const nextSegment = segments[nextIndex];
        const nextZ = z + CFG.segmentLength;
        const pNext = project({ x: nextSegment.p.x - ((dx + nextSegment.curve) * 120), y: nextSegment.p.y, z: nextZ }, 
                              playerX * CFG.roadWidth, 
                              playerY + CFG.cameraHeight, 
                              0, 
                              CFG.cameraDepth);

        if (p.y >= maxY) continue;
        
        // --- Draw Ground/Snow ---
        // Use subtle gradient instead of harsh checkerboard
        const w1 = p.w * 5.0; 
        const w2 = pNext.w * 5.0;
        
        // Smooth gradient simulation by varying brightness slightly based on index
        const brightness = (index % 20 < 10) ? '#E2E8F0' : '#CBD5E1';
        drawPolygon(ctx, p.x - w1, p.y, p.x + w1, p.y, pNext.x + w2, pNext.y, pNext.x - w2, pNext.y, brightness);
        
        // --- Draw Ice Track ---
        const rw1 = p.w;
        const rw2 = pNext.w;
        
        // Ice Gradient (Light Blue to White)
        // We simulate the gradient by drawing a base and then a lighter overlay in the center
        const iceColor = '#7DD3FC'; // Base Ice
        drawPolygon(ctx, p.x - rw1, p.y, p.x + rw1, p.y, pNext.x + rw2, pNext.y, pNext.x - rw2, pNext.y, iceColor);
        
        // Center Highlight (The "Glossy" path)
        const rw1_in = rw1 * 0.6;
        const rw2_in = rw2 * 0.6;
        drawPolygon(ctx, p.x - rw1_in, p.y, p.x + rw1_in, p.y, pNext.x + rw2_in, pNext.y, pNext.x - rw2_in, pNext.y, '#BAE6FD');
        
        // Lane Markers (Dashed)
        if (index % 4 < 2) {
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            const lw1 = rw1 * 0.02;
            const lw2 = rw2 * 0.02;
            // Center Line
            drawPolygon(ctx, p.x - lw1, p.y, p.x + lw1, p.y, pNext.x + lw2, pNext.y, pNext.x - lw2, pNext.y, 'rgba(255,255,255,0.9)');
        }

        // --- Draw Objects ---
        for(let obj of segment.objects) {
            const objX = p.x + (obj.offset * p.w);
            if (obj.type === 'tree') drawTree(ctx, objX, p.y, p.scale, obj);
            if (obj.type === 'rock') drawRock(ctx, objX, p.y, p.scale);
            if (obj.type === 'gate') drawGate(ctx, objX, p.y, p.scale);
        }

        maxY = p.y;
    }

    // 6. Draw Player (Rider)
    const playerScreenX = width / 2;
    const playerScreenY = height - 140; 
    
    ctx.save();
    ctx.translate(playerScreenX, playerScreenY);
    ctx.rotate(playerTilt);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(0, 55, 80, 20, 0, 0, Math.PI*2);
    ctx.fill();

    // --- Stylized Skier ---
    
    // Skis (Long, sleek)
    ctx.fillStyle = '#0F172A'; 
    // Left Ski
    ctx.save();
    ctx.translate(-35, 50);
    ctx.rotate(-0.15);
    ctx.beginPath();
    ctx.roundRect(-5, 0, 10, 110, 5);
    ctx.fill();
    // Ski Tip
    ctx.fillStyle = '#38BDF8'; // Cyan tip
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    
    // Right Ski
    ctx.fillStyle = '#0F172A';
    ctx.save();
    ctx.translate(35, 50);
    ctx.rotate(0.15);
    ctx.beginPath();
    ctx.roundRect(-5, 0, 10, 110, 5);
    ctx.fill();
    ctx.fillStyle = '#38BDF8';
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // Body (Aerodynamic Suit)
    ctx.fillStyle = '#DC2626'; 
    ctx.beginPath();
    ctx.moveTo(-25, 30);
    ctx.quadraticCurveTo(0, -20, 25, 30); // Shoulders
    ctx.lineTo(15, 60);
    ctx.quadraticCurveTo(0, 70, -15, 60); // Knees
    ctx.fill();
    
    // Arms (Poles)
    ctx.strokeStyle = '#94A3B8';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-30, 20); ctx.lineTo(-70, 40); // Left Pole
    ctx.moveTo(30, 20); ctx.lineTo(70, 40); // Right Pole
    ctx.stroke();

    // Head/Helmet
    ctx.fillStyle = '#1E293B'; // Dark Helmet
    ctx.beginPath();
    ctx.arc(0, -35, 28, 0, Math.PI*2);
    ctx.fill();
    
    // Goggles
    ctx.fillStyle = '#38BDF8';
    ctx.beginPath();
    ctx.roundRect(-18, -40, 36, 14, 6);
    ctx.fill();
    // Reflection
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.ellipse(-10, -36, 4, 2, 0, 0, Math.PI*2);
    ctx.fill();

    // 7. Atmosphere
    updateParticles();
    
    // Reset Shake
    if (shakeIntensity > 0) ctx.restore();
}

// --- Game Loop ---
let lastTime = 0;
function loop(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.1); 
    lastTime = time;

    update(dt);
    render();
    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>
</body>
