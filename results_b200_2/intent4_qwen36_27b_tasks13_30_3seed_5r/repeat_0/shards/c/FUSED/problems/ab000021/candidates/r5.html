<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Architecture Schematic</title>
    <style>
        :root {
            /* Palette - Technical Blueprint */
            --bg-color: #0b1120;
            --grid-line: #1e293b;
            
            --component-bg: #0f172a;
            --component-stroke: #334155;
            
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;

            /* Signal Colors - Muted Technical */
            --col-data: #38bdf8;      /* Sky Blue */
            --col-instr: #fb923c;     /* Orange */
            --col-control: #4ade80;   /* Green */

            /* Typography */
            --font-mono: "Menlo", "Consolas", "Monaco", "Courier New", monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-primary);
            font-family: var(--font-mono);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* Header & Legend */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 100;
            pointer-events: none;
        }

        .header-content {
            pointer-events: auto;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--text-primary);
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .subtitle {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Legend */
        .legend {
            display: flex;
            gap: 1.5rem;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--component-stroke);
            padding: 0.75rem 1.25rem;
            backdrop-filter: blur(4px);
            pointer-events: auto;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
        }

        .swatch {
            width: 30px;
            height: 2px;
            position: relative;
        }
        
        .swatch-data { background: var(--col-data); }
        
        .swatch-instr {
            background: repeating-linear-gradient(90deg, var(--col-instr) 0, var(--col-instr) 4px, transparent 4px, transparent 8px);
        }

        .swatch-control {
            background: repeating-linear-gradient(90deg, var(--col-control) 0, var(--col-control) 1px, transparent 1px, transparent 5px);
        }

        /* Main Canvas */
        main {
            width: 100%;
            height: 100%;
            position: relative;
            display: grid;
            /* 3x3 Grid for Layout */
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
        }

        /* SVG Layer */
        svg#diagram {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* Component Styling */
        .component {
            position: absolute;
            background: var(--component-bg);
            border: 1px solid var(--component-stroke);
            width: 160px;
            height: 110px;
            display: flex;
            flex-direction: column;
            z-index: 10;
            /* Removed transition for snappier feel */
        }

        .component-header {
            background: rgba(30, 41, 59, 0.5);
            border-bottom: 1px solid var(--component-stroke);
            padding: 0.4rem 0.6rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .component-title {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--text-muted);
        }

        .component-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
        }

        .icon-container {
            width: 32px;
            height: 32px;
            margin-bottom: 0.5rem;
        }

        .icon-container svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: var(--text-secondary);
            stroke-width: 1.5;
            stroke-linecap: square;
            stroke-linejoin: miter;
        }

        .component-desc {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Specific Positioning via CSS Grid Logic mapped to Absolute */
        /* CPU: Center */
        #cpu { 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            width: 200px; height: 140px;
            border: 1px solid var(--text-secondary); /* Emphasis via border color, not white */
            background: #0f172a; /* Slightly lighter tint */
        }
        #cpu .component-title { color: #fff; }
        #cpu .icon-container { width: 48px; height: 48px; }
        #cpu .icon-container svg { stroke: #fff; }

        /* Memory: Top Center */
        #ram { top: 15%; left: 50%; transform: translate(-50%, -50%); }
        
        /* Storage: Bottom Center */
        #storage { top: 85%; left: 50%; transform: translate(-50%, -50%); }
        
        /* Input: Top Left */
        #input { top: 15%; left: 15%; transform: translate(-50%, -50%); }
        
        /* Network: Bottom Left */
        #network { top: 85%; left: 15%; transform: translate(-50%, -50%); }
        
        /* GPU: Top Right */
        #gpu { top: 15%; left: 85%; transform: translate(-50%, -50%); }
        
        /* Output: Bottom Right */
        #output { top: 85%; left: 85%; transform: translate(-50%, -50%); }

        /* Connector Styles */
        .connector-bg {
            fill: none;
            stroke: var(--component-stroke);
            stroke-width: 4;
            stroke-linejoin: miter;
            stroke-linecap: square;
            opacity: 0.5;
        }

        .connector-path {
            fill: none;
            stroke-width: 2;
            stroke-linejoin: miter;
            stroke-linecap: square;
        }

        /* Animation & Line Types */
        @keyframes flow-solid { to { stroke-dashoffset: 0; } }
        @keyframes flow-dashed { to { stroke-dashoffset: -24; } }
        @keyframes flow-dotted { to { stroke-dashoffset: -12; } }

        .type-data {
            stroke: var(--col-data);
            stroke-dasharray: 12 12; 
            animation: flow-solid 1s linear infinite;
        }

        .type-instr {
            stroke: var(--col-instr);
            stroke-dasharray: 6 6;
            animation: flow-dashed 1.5s linear infinite;
        }

        .type-control {
            stroke: var(--col-control);
            stroke-dasharray: 2 4;
            animation: flow-dotted 1s linear infinite;
        }

    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <h1>System Architecture</h1>
            <div class="subtitle">Data Flow & Signal Routing</div>
        </div>
        <div class="legend">
            <div class="legend-item">
                <div class="swatch swatch-data"></div> Data
            </div>
            <div class="legend-item">
                <div class="swatch swatch-instr"></div> Instructions
            </div>
            <div class="legend-item">
                <div class="swatch swatch-control"></div> Control
            </div>
        </div>
    </header>

    <main>
        <!-- SVG Layer -->
        <svg id="diagram" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Arrow Markers -->
                <marker id="arrow-data" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="var(--col-data)" />
                </marker>
                <marker id="arrow-control" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="var(--col-control)" />
                </marker>
                <marker id="arrow-instr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="var(--col-instr)" />
                </marker>
            </defs>
            <g id="connections"></g>
        </svg>

        <!-- Components -->

        <!-- CPU -->
        <div id="cpu" class="component">
            <div class="component-header">
                <span class="component-title">Processor</span>
                <div class="status-dot" style="background: var(--text-primary)"></div>
            </div>
            <div class="component-body">
                <div class="icon-container">
                    <svg viewBox="0 0 24 24">
                        <rect x="4" y="4" width="16" height="16" rx="1"></rect>
                        <rect x="8" y="8" width="8" height="8"></rect>
                        <line x1="9" y1="1" x2="9" y2="4"></line>
                        <line x1="12" y1="1" x2="12" y2="4"></line>
                        <line x1="15" y1="1" x2="15" y2="4"></line>
                        <line x1="9" y1="20" x2="9" y2="23"></line>
                        <line x1="12" y1="20" x2="12" y2="23"></line>
                        <line x1="15" y1="20" x2="15" y2="23"></line>
                        <line x1="20" y1="9" x2="23" y2="9"></line>
                        <line x1="20" y1="12" x2="23" y2="12"></line>
                        <line x1="20" y1="15" x2="23" y2="15"></line>
                        <line x1="1" y1="9" x2="4" y2="9"></line>
                        <line x1="1" y1="12" x2="4" y2="12"></line>
                        <line x1="1" y1="15" x2="4" y2="15"></line>
                    </svg>
                </div>
                <span class="component-desc">Central Logic Unit</span>
            </div>
        </div>

        <!-- RAM -->
        <div id="ram" class="component">
            <div class="component-header">
                <span class="component-title">Memory</span>
                <div class="status-dot" style="background: var(--col-instr)"></div>
            </div>
            <div class="component-body">
                <div class="icon-container">
                    <svg viewBox="0 0 24 24">
                        <rect x="2" y="6" width="20" height="12" rx="1"></rect>
                        <line x1="6" y1="10" x2="6" y2="14"></line>
                        <line x1="10" y1="10" x2="10" y2="14"></line>
                        <line x1="14" y1="10" x2="14" y2="14"></line>
                        <line x1="18" y1="10" x2="18" y2="14"></line>
                    </svg>
                </div>
                <span class="component-desc">Main Memory (RAM)</span>
            </div>
        </div>

        <!-- GPU -->
        <div id="gpu" class="component">
            <div class="component-header">
                <span class="component-title">Graphics</span>
                <div class="status-dot" style="background: var(--col-control)"></div>
            </div>
            <div class="component-body">
                <div class="icon-container">
                    <svg viewBox="0 0 24 24">
                        <rect x="2" y="4" width="20" height="16" rx="1"></rect>
                        <rect x="6" y="8" width="12" height="8"></rect>
                        <line x1="12" y1="2" x2="12" y2="4"></line>
                        <line x1="12" y1="20" x2="12" y2="22"></line>
                        <line x1="2" y1="12" x2="4" y2="12"></line>
                        <line x1="20" y1="12" x2="22" y2="12"></line>
                    </svg>
                </div>
                <span class="component-desc">Parallel Processor</span>
            </div>
        </div>

        <!-- Storage -->
        <div id="storage" class="component">
            <div class="component-header">
                <span class="component-title">Storage</span>
                <div class="status-dot" style="background: var(--col-data)"></div>
            </div>
            <div class="component-body">
                <div class="icon-container">
                    <svg viewBox="0 0 24 24">
                        <!-- Cylinder/Database look -->
                        <path d="M4 4h16v4h-16z"></path>
                        <path d="M4 4v12c0 2.2 3.6 4 8 4s8-1.8 8-4v-12"></path>
                        <path d="M4 8c0 2.2 3.6 4 8 4s8-1.8 8-4"></path>
                        <path d="M4 12c0 2.2 3.6 4 8 4s8-1.8 8-4"></path>
                    </svg>
                </div>
                <span class="component-desc">Persistent Disk</span>
            </div>
        </div>

        <!-- Input -->
        <div id="input" class="component">
            <div class="component-header">
                <span class="component-title">Input</span>
                <div class="status-dot"></div>
            </div>
            <div class="component-body">
                <div class="icon-container">
                    <svg viewBox="0 0 24 24">
                        <rect x="2" y="6" width="20" height="12" rx="1"></rect>
                        <line x1="6" y1="10" x2="6" y2="10" stroke-width="2"></line>
                        <line x1="10" y1="10" x2="10" y2="10" stroke-width="2"></line>
                        <line x1="14" y1="10" x2="14" y2="10" stroke-width="2"></line>
                        <line x1="18" y1="10" x2="18" y2="10" stroke-width="2"></line>
                        <line x1="6" y1="14" x2="6" y2="14" stroke-width="2"></line>
                        <line x1="10" y1="14" x2="10" y2="14" stroke-width="2"></line>
                        <line x1="14" y1="14" x2="14" y2="14" stroke-width="2"></line>
                        <line x1="18" y1="14" x2="18" y2="14" stroke-width="2"></line>
                    </svg>
                </div>
                <span class="component-desc">User Interface</span>
            </div>
        </div>

        <!-- Network -->
        <div id="network" class="component">
            <div class="component-header">
                <span class="component-title">Network</span>
                <div class="status-dot"></div>
            </div>
            <div class="component-body">
                <div class="icon-container">
                    <svg viewBox="0 0 24 24">
                        <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                        <circle cx="8" cy="8" r="2"></circle>
                        <line x1="8" y1="10" x2="8" y2="16"></line>
                        <line x1="8" y1="16" x2="16" y2="16"></line>
                        <circle cx="16" cy="8" r="2"></circle>
                    </svg>
                </div>
                <span class="component-desc">External I/O</span>
            </div>
        </div>

        <!-- Output -->
        <div id="output" class="component">
            <div class="component-header">
                <span class="component-title">Display</span>
                <div class="status-dot" style="background: var(--col-data)"></div>
            </div>
            <div class="component-body">
                <div class="icon-container">
                    <svg viewBox="0 0 24 24">
                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                        <line x1="8" y1="21" x2="16" y2="21"></line>
                        <line x1="12" y1="17" x2="12" y2="21"></line>
                    </svg>
                </div>
                <span class="component-desc">Monitor Output</span>
            </div>
        </div>

    </main>

    <script>
        // Configuration for connections - Updated Logic per Critique
        const connections = [
            // 1. Input -> CPU (Data)
            { from: 'input', to: 'cpu', type: 'data' },
            
            // 2. Network -> CPU (Data)
            { from: 'network', to: 'cpu', type: 'data' },

            // 3. Storage -> CPU (Data)
            { from: 'storage', to: 'cpu', type: 'data' },

            // 4. Memory -> CPU (Instructions)
            { from: 'ram', to: 'cpu', type: 'instr' },
            // 5. Memory -> CPU (Data) - Separate path logic handled by visual stacking
            { from: 'ram', to: 'cpu', type: 'data', offset: 1 }, 

            // 6. CPU -> Memory (Control)
            { from: 'cpu', to: 'ram', type: 'control' },

            // 7. CPU -> Storage (Control)
            { from: 'cpu', to: 'storage', type: 'control' },

            // 8. CPU -> GPU (Control)
            { from: 'cpu', to: 'gpu', type: 'control' },

            // 9. GPU -> Output (Data)
            { from: 'gpu', to: 'output', type: 'data' }
        ];

        const svg = document.getElementById('diagram');
        const g = document.getElementById('connections');

        function getCenter(element) {
            const rect = element.getBoundingClientRect();
            const mainRect = document.querySelector('main').getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2 - mainRect.left,
                y: rect.top + rect.height / 2 - mainRect.top,
                w: rect.width,
                h: rect.height
            };
        }

        // Calculate intersection with the box border
        function getEdgePoint(center, target) {
            const dx = target.x - center.x;
            const dy = target.y - center.y;
            
            // Avoid division by zero
            if (dx === 0 && dy === 0) return { x: center.x, y: center.y };

            const aspect = center.w / center.h;
            
            // Normalize target vector relative to box dimensions
            const normX = dx / (center.w / 2);
            const normY = dy / (center.h / 2);

            // Determine which edge is hit first
            if (Math.abs(normX) > Math.abs(normY) * aspect) {
                // Hit Left or Right
                const sign = Math.sign(dx);
                return {
                    x: center.x + (center.w / 2) * sign,
                    y: center.y + dy * (center.w / 2) / Math.abs(dx)
                };
            } else {
                // Hit Top or Bottom
                const sign = Math.sign(dy);
                return {
                    x: center.x + dx * (center.h / 2) / Math.abs(dy),
                    y: center.y + (center.h / 2) * sign
                };
            }
        }

        function drawConnections() {
            g.innerHTML = '';

            connections.forEach(conn => {
                const startEl = document.getElementById(conn.from);
                const endEl = document.getElementById(conn.to);
                
                if (!startEl || !endEl) return;

                const startCenter = getCenter(startEl);
                const endCenter = getCenter(endEl);

                const startPt = getEdgePoint(startCenter, endCenter);
                const endPt = getEdgePoint(endCenter, startCenter);

                // Orthogonal Routing Logic (Manhattan distance)
                // Bias: Vertical first if vertical distance is larger, else Horizontal
                const dx = endPt.x - startPt.x;
                const dy = endPt.y - startPt.y;
                
                let d = '';
                let midX, midY;

                if (Math.abs(dy) > Math.abs(dx)) {
                    // Vertical dominant: Go Vertical then Horizontal
                    midX = startPt.x;
                    midY = endPt.y;
                    d = `M ${startPt.x} ${startPt.y} L ${midX} ${midY} L ${endPt.x} ${endPt.y}`;
                } else {
                    // Horizontal dominant: Go Horizontal then Vertical
                    midX = endPt.x;
                    midY = startPt.y;
                    d = `M ${startPt.x} ${startPt.y} L ${midX} ${midY} L ${endPt.x} ${endPt.y}`;
                }

                // Create Background Track (Faint, Thick)
                const trackPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
                trackPath.setAttribute("d", d);
                trackPath.setAttribute("class", "connector-bg");
                g.appendChild(trackPath);

                // Create Active Flow Line (Glowing, Thin)
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", d);
                path.setAttribute("class", `connector-path type-${conn.type}`);
                
                // Add Arrowhead
                path.setAttribute("marker-end", `url(#arrow-${conn.type})`);
                
                g.appendChild(path);
            });
        }

        // Initial Draw
        window.addEventListener('load', drawConnections);
        // Redraw on Resize
        window.addEventListener('resize', drawConnections);

    </script>
</body>
</html>
