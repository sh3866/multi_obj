<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Architecture Schematic</title>
    <style>
        :root {
            /* Palette - Dark Technical Flat */
            --bg-color: #0f172a; /* Slate 900 */
            --component-bg: #1e293b; /* Slate 800 */
            --component-border: #334155; /* Slate 700 */
            --component-header: #0f172a;
            
            --text-primary: #f8fafc; /* Slate 50 */
            --text-secondary: #94a3b8; /* Slate 400 */
            --text-accent: #e2e8f0; /* Slate 200 */

            /* Signal Colors - High Contrast */
            --col-data: #38bdf8;      /* Sky Blue - Solid */
            --col-instr: #fb923c;     /* Orange - Dashed */
            --col-control: #4ade80;   /* Green - Dotted */

            /* Typography */
            --font-mono: "SF Mono", "Consolas", "Monaco", "Courier New", monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-mono);
            height: 100vh;
            overflow: hidden;
            position: relative;
            /* No grid background per critique */
        }

        /* Header & Legend Container */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 100;
            pointer-events: none;
        }

        .header-content {
            pointer-events: auto;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: var(--text-primary);
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Legend - Prominent & Distinct */
        .legend {
            display: flex;
            gap: 2rem;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--component-border);
            padding: 1rem 1.5rem;
            border-radius: 2px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Legend Swatches */
        .swatch {
            width: 40px;
            height: 2px;
            position: relative;
        }
        
        /* Data: Solid Blue */
        .swatch-data {
            background: var(--col-data);
            box-shadow: 0 0 8px var(--col-data);
        }
        
        /* Instructions: Dashed Orange */
        .swatch-instr {
            background: repeating-linear-gradient(90deg, var(--col-instr) 0, var(--col-instr) 8px, transparent 8px, transparent 12px);
            box-shadow: 0 0 4px var(--col-instr);
        }

        /* Control: Dotted Green */
        .swatch-control {
            background: repeating-linear-gradient(90deg, var(--col-control) 0, var(--col-control) 2px, transparent 2px, transparent 6px);
            box-shadow: 0 0 4px var(--col-control);
        }

        /* Main Canvas Area */
        main {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* SVG Layer for Connections */
        svg#diagram {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Component Styling - Flat, Geometric Blocks */
        .component {
            position: absolute;
            background: var(--component-bg);
            border: 1px solid var(--component-border);
            width: 160px;
            height: 120px;
            display: flex;
            flex-direction: column;
            z-index: 10;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .component:hover {
            transform: translateY(-2px);
            border-color: var(--text-secondary);
        }

        /* Clean Header */
        .component-header {
            background: var(--component-header);
            border-bottom: 1px solid var(--component-border);
            padding: 0.5rem 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .component-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Component Body */
        .component-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
        }

        .icon-container {
            width: 40px;
            height: 40px;
            margin-bottom: 0.75rem;
        }

        .icon-container svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: var(--text-secondary);
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .component-desc {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.3;
        }

        /* CPU Specific Styling - The Anchor */
        #cpu {
            width: 220px;
            height: 160px;
            border: 2px solid var(--text-primary);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
            z-index: 20;
        }

        #cpu .component-title {
            font-size: 0.9rem;
            color: var(--text-accent);
        }

        #cpu .icon-container {
            width: 56px;
            height: 56px;
        }
        
        #cpu .icon-container svg {
            stroke: var(--text-primary);
        }

        /* Positioning - Orthogonal Grid */
        #cpu { top: 50%; left: 50%; transform: translate(-50%, -50%); }
        
        /* Inner Ring */
        #ram { top: 20%; left: 50%; transform: translate(-50%, -50%); }
        #gpu { top: 50%; left: 75%; transform: translate(-50%, -50%); }
        #storage { top: 80%; left: 50%; transform: translate(-50%, -50%); }
        
        /* Outer Ring */
        #input { top: 20%; left: 25%; transform: translate(-50%, -50%); }
        #network { top: 50%; left: 25%; transform: translate(-50%, -50%); }
        #output { top: 80%; left: 75%; transform: translate(-50%, -50%); }

        /* Connector Styles */
        .connector-bg {
            fill: none;
            stroke: var(--component-border);
            stroke-width: 6;
            stroke-linejoin: miter;
            stroke-linecap: square;
        }

        .connector-path {
            fill: none;
            stroke-width: 2.5;
            stroke-linejoin: miter;
            stroke-linecap: square;
        }

        /* Animations */
        @keyframes flow-solid { to { stroke-dashoffset: 0; } }
        @keyframes flow-dashed { to { stroke-dashoffset: -24; } }
        @keyframes flow-dotted { to { stroke-dashoffset: -12; } }

        /* Data: Solid Blue */
        .type-data {
            stroke: var(--col-data);
            stroke-dasharray: 15 15; 
            animation: flow-solid 1.5s linear infinite;
            filter: drop-shadow(0 0 4px var(--col-data));
        }

        /* Instructions: Dashed Orange */
        .type-instr {
            stroke: var(--col-instr);
            stroke-dasharray: 8 8;
            animation: flow-dashed 2s linear infinite;
            filter: drop-shadow(0 0 4px var(--col-instr));
        }

        /* Control: Dotted Green */
        .type-control {
            stroke: var(--col-control);
            stroke-dasharray: 2 4;
            animation: flow-dotted 2s linear infinite;
            filter: drop-shadow(0 0 4px var(--col-control));
        }

    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <h1>System Architecture</h1>
            <div class="subtitle">Data Flow & Signal Routing</div>
        </div>
        <div class="legend">
            <div class="legend-item" style="color: var(--col-data)">
                <div class="swatch swatch-data"></div> Data Stream
            </div>
            <div class="legend-item" style="color: var(--col-instr)">
                <div class="swatch swatch-instr"></div> Instructions
            </div>
            <div class="legend-item" style="color: var(--col-control)">
                <div class="swatch swatch-control"></div> Control Signal
            </div>
        </div>
    </header>

    <main>
        <!-- SVG Layer -->
        <svg id="diagram" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Arrow Markers - High Contrast -->
                <marker id="arrow-data" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="var(--col-data)" />
                </marker>
                <marker id="arrow-control" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="var(--col-control)" />
                </marker>
                <marker id="arrow-instr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="var(--col-instr)" />
                </marker>
            </defs>
            <g id="connections"></g>
        </svg>

        <!-- HTML Nodes -->
        
        <!-- CPU -->
        <div id="cpu" class="component">
            <div class="component-header">
                <span class="component-title">Processor</span>
            </div>
            <div class="component-body">
                <div class="icon-container">
                    <svg viewBox="0 0 24 24">
                        <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
                        <rect x="9" y="9" width="6" height="6"></rect>
                        <line x1="9" y1="1" x2="9" y2="4"></line>
                        <line x1="15" y1="1" x2="15" y2="4"></line>
                        <line x1="9" y1="20" x2="9" y2="23"></line>
                        <line x1="15" y1="20" x2="15" y2="23"></line>
                        <line x1="20" y1="9" x2="23" y2="9"></line>
                        <line x1="20" y1="14" x2="23" y2="14"></line>
                        <line x1="1" y1="9" x2="4" y2="9"></line>
                        <line x1="1" y1="14" x2="4" y2="14"></line>
                    </svg>
                </div>
                <span class="component-desc">Central Unit</span>
            </div>
        </div>

        <!-- RAM -->
        <div id="ram" class="component">
            <div class="component-header">
                <span class="component-title">Memory</span>
            </div>
            <div class="component-body">
                <div class="icon-container">
                    <svg viewBox="0 0 24 24">
                        <rect x="2" y="6" width="20" height="12" rx="1"></rect>
                        <line x1="6" y1="10" x2="6" y2="14"></line>
                        <line x1="10" y1="10" x2="10" y2="14"></line>
                        <line x1="14" y1="10" x2="14" y2="14"></line>
                        <line x1="18" y1="10" x2="18" y2="14"></line>
                    </svg>
                </div>
                <span class="component-desc">Volatile Storage</span>
            </div>
        </div>

        <!-- GPU -->
        <div id="gpu" class="component">
            <div class="component-header">
                <span class="component-title">Graphics</span>
            </div>
            <div class="component-body">
                <div class="icon-container">
                    <svg viewBox="0 0 24 24">
                        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 8v-4"></path>
                        <path d="M12 20v-4"></path>
                        <path d="M8 12H4"></path>
                        <path d="M20 12h-4"></path>
                    </svg>
                </div>
                <span class="component-desc">Parallel Compute</span>
            </div>
        </div>

        <!-- Storage -->
        <div id="storage" class="component">
            <div class="component-header">
                <span class="component-title">Storage</span>
            </div>
            <div class="component-body">
                <div class="icon-container">
                    <svg viewBox="0 0 24 24">
                        <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M12 15v3"></path>
                        <path d="M9 9l3-3 3 3"></path>
                    </svg>
                </div>
                <span class="component-desc">Persistent Data</span>
            </div>
        </div>

        <!-- Input -->
        <div id="input" class="component">
            <div class="component-header">
                <span class="component-title">Input</span>
            </div>
            <div class="component-body">
                <div class="icon-container">
                    <svg viewBox="0 0 24 24">
                        <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                        <line x1="6" y1="10" x2="6" y2="10"></line>
                        <line x1="10" y1="10" x2="10" y2="10"></line>
                        <line x1="14" y1="10" x2="14" y2="10"></line>
                        <line x1="18" y1="10" x2="18" y2="10"></line>
                        <line x1="6" y1="14" x2="6" y2="14"></line>
                        <line x1="10" y1="14" x2="10" y2="14"></line>
                        <line x1="14" y1="14" x2="14" y2="14"></line>
                        <line x1="18" y1="14" x2="18" y2="14"></line>
                    </svg>
                </div>
                <span class="component-desc">Keyboard / Mouse</span>
            </div>
        </div>

        <!-- Network -->
        <div id="network" class="component">
            <div class="component-header">
                <span class="component-title">Network</span>
            </div>
            <div class="component-body">
                <div class="icon-container">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    </svg>
                </div>
                <span class="component-desc">External I/O</span>
            </div>
        </div>

        <!-- Output -->
        <div id="output" class="component">
            <div class="component-header">
                <span class="component-title">Display</span>
            </div>
            <div class="component-body">
                <div class="icon-container">
                    <svg viewBox="0 0 24 24">
                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                        <line x1="8" y1="21" x2="16" y2="21"></line>
                        <line x1="12" y1="17" x2="12" y2="21"></line>
                        <line x1="7" y1="8" x2="17" y2="8"></line>
                    </svg>
                </div>
                <span class="component-desc">Monitor</span>
            </div>
        </div>

    </main>

    <script>
        // Configuration for connections
        // Priorities: 
        // 1. Orthogonal Topology (Right angles)
        // 2. Legend Consistency (Solid=Data, Dashed=Instr, Dotted=Control)
        const connections = [
            // CPU <-> Memory (Core Loop)
            { from: 'ram', to: 'cpu', type: 'instr', label: 'Fetch' },
            { from: 'cpu', to: 'ram', type: 'control', label: 'Write' },
            
            // CPU <-> Storage
            { from: 'storage', to: 'cpu', type: 'data', label: 'Load' },
            { from: 'cpu', to: 'storage', type: 'control', label: 'Save' },
            
            // CPU <-> GPU (Processing)
            { from: 'cpu', to: 'gpu', type: 'data', label: 'Render Cmd' },
            
            // GPU <-> Output (Display Path)
            { from: 'gpu', to: 'output', type: 'data', label: 'Video' },
            
            // Peripherals <-> CPU
            { from: 'input', to: 'cpu', type: 'control', label: 'Interrupt' },
            { from: 'network', to: 'cpu', type: 'data', label: 'Packet In' },
            { from: 'cpu', to: 'network', type: 'data', label: 'Packet Out' }
        ];

        const svg = document.getElementById('diagram');
        const g = document.getElementById('connections');

        function getCenter(element) {
            const rect = element.getBoundingClientRect();
            const mainRect = document.querySelector('main').getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2 - mainRect.left,
                y: rect.top + rect.height / 2 - mainRect.top,
                w: rect.width,
                h: rect.height
            };
        }

        // Helper to find the edge of a box towards a target point
        function getEdgePoint(center, target) {
            const dx = target.x - center.x;
            const dy = target.y - center.y;
            
            // Aspect ratio of the box
            const aspect = center.w / center.h;
            
            // Normalize target vector
            const normX = dx / (center.w / 2);
            const normY = dy / (center.h / 2);

            // Determine which edge is hit first
            if (Math.abs(normX) > Math.abs(normY) * aspect) {
                // Hit Left or Right
                const sign = Math.sign(dx);
                return {
                    x: center.x + (center.w / 2) * sign,
                    y: center.y + dy * (center.w / 2) / Math.abs(dx)
                };
            } else {
                // Hit Top or Bottom
                const sign = Math.sign(dy);
                return {
                    x: center.x + dx * (center.h / 2) / Math.abs(dy),
                    y: center.y + (center.h / 2) * sign
                };
            }
        }

        function drawConnections() {
            // Clear existing paths
            g.innerHTML = '';

            connections.forEach(conn => {
                const startEl = document.getElementById(conn.from);
                const endEl = document.getElementById(conn.to);
                
                if (!startEl || !endEl) return;

                const startCenter = getCenter(startEl);
                const endCenter = getCenter(endEl);

                // Calculate entry/exit points on the boxes
                const startPt = getEdgePoint(startCenter, endCenter);
                const endPt = getEdgePoint(endCenter, startCenter);

                // Orthogonal Routing Logic
                const dx = endPt.x - startPt.x;
                const dy = endPt.y - startPt.y;
                
                let d = '';
                
                // Bias towards horizontal moves first if close to equal, 
                // otherwise use dominant axis.
                if (Math.abs(dx) > Math.abs(dy)) {
                    // Horizontal dominant: Right angle turn
                    d = `M ${startPt.x} ${startPt.y} 
                         L ${endPt.x} ${startPt.y} 
                         L ${endPt.x} ${endPt.y}`;
                } else {
                    // Vertical dominant: Right angle turn
                    d = `M ${startPt.x} ${startPt.y} 
                         L ${startPt.x} ${endPt.y} 
                         L ${endPt.x} ${endPt.y}`;
                }

                // Create Background Track (Faint, Thick)
                const trackPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
                trackPath.setAttribute("d", d);
                trackPath.setAttribute("class", "connector-bg");
                g.appendChild(trackPath);

                // Create Active Flow Line (Glowing, Thin)
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", d);
                path.setAttribute("class", `connector-path type-${conn.type}`);
                
                // Add Arrowhead
                path.setAttribute("marker-end", `url(#arrow-${conn.type})`);
                
                g.appendChild(path);
            });
        }

        // Handle Resize
        window.addEventListener('resize', drawConnections);
        // Initial Draw
        setTimeout(drawConnections, 50);

    </script>
</body>
</html>
