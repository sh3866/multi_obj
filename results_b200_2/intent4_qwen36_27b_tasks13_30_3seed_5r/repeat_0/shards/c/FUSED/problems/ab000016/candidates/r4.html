<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON DESERT RUNNER // V2</title>
    <style>
        :root {
            --bg-deep: #050508;
            --accent-primary: #FF3D00; /* Electric Orange */
            --accent-secondary: #00E5FF; /* Cyan */
            --text-white: #ffffff;
            --text-muted: #6e6e80;
            --font-pixel: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-white);
            font-family: var(--font-pixel);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CRT Effect Overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.6;
        }
        
        /* Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* Main Game Container */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1400px;
            max-height: 700px;
            background: linear-gradient(to bottom, #0a0a12 0%, #181824 100%);
            overflow: hidden;
            box-shadow: 0 0 150px rgba(0,0,0,0.8);
        }

        /* HUD Layer */
        .hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 20;
            pointer-events: none;
        }

        .hud-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .label {
            font-size: 11px;
            letter-spacing: 4px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(110, 110, 128, 0.3);
        }

        .score-display {
            font-size: 52px;
            font-weight: 900;
            color: var(--text-white);
            text-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            line-height: 1;
            font-family: var(--font-pixel);
            font-variant-numeric: tabular-nums;
        }

        .high-score {
            color: var(--accent-secondary);
            font-size: 16px;
            margin-top: 4px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
        }

        /* Speed Indicator Redesign */
        .speed-indicator {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .speed-val {
            font-size: 32px;
            font-weight: 900;
            color: var(--accent-primary);
            font-family: var(--font-pixel);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            font-variant-numeric: tabular-nums;
        }

        .speed-gauge {
            width: 140px;
            height: 10px;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .speed-fill {
            height: 100%;
            background: var(--accent-primary);
            width: 10%;
            box-shadow: 0 0 15px var(--accent-primary);
            transition: width 0.1s linear;
        }

        /* Canvas Layer */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Instructions Overlay */
        .instruction-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 15;
            pointer-events: none;
            transition: opacity 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .instruction-overlay.hidden {
            opacity: 0;
        }

        .start-prompt {
            font-size: 20px;
            color: var(--text-white);
            text-transform: uppercase;
            letter-spacing: 6px;
            font-weight: 900;
            opacity: 0.8;
            background: rgba(5, 5, 8, 0.4);
            padding: 10px 25px;
            border-radius: 4px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,255,255,0.1);
            animation: pulse 3s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); border-color: var(--accent-primary); }
        }

        /* Game Over Panel */
        .game-over-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 5, 8, 0.9);
            border: 1px solid var(--accent-primary);
            padding: 40px 80px;
            text-align: center;
            display: none;
            z-index: 30;
            box-shadow: 0 0 50px rgba(255, 61, 0, 0.2);
            backdrop-filter: blur(5px);
        }

        .game-over-title {
            color: var(--accent-primary);
            font-size: 48px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 8px;
            font-weight: 900;
            text-shadow: 0 0 15px rgba(255, 61, 0, 0.5);
        }

        .restart-hint {
            color: var(--text-white);
            font-size: 14px;
            letter-spacing: 3px;
            opacity: 0.8;
            font-weight: bold;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div id="game-container">
        <!-- HUD -->
        <div class="hud-layer">
            <div class="hud-group">
                <div class="label">Current Score</div>
                <div class="score-display"><span id="score">00000</span></div>
                <div class="high-score">HI: <span id="high-score">00000</span></div>
            </div>
            <div class="hud-group speed-indicator">
                <div class="label">Velocity</div>
                <div class="speed-val" id="speed-val">1.0x</div>
                <div class="speed-gauge">
                    <div class="speed-fill" id="speed-fill"></div>
                </div>
            </div>
        </div>

        <!-- Instructions -->
        <div class="instruction-overlay" id="instructions">
            <div class="start-prompt">Press Space to Run</div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Game Over -->
        <div class="game-over-panel" id="game-over">
            <div class="game-over-title">CRASHED</div>
            <div class="restart-hint">PRESS SPACE TO RESTART</div>
        </div>
    </div>

<script>
    /**
     * DESIGN SYSTEM & CONSTANTS
     * Palette: Deep Night, Electric Orange, Cyan, Pure White
     */
    const COLORS = {
        bgTop: '#0a0a12',
        bgBottom: '#181824',
        sun: '#FF3D00', // Electric Orange
        sunGlow: 'rgba(255, 61, 0, 0.15)',
        groundBase: '#0f0f15', // Dark Slate
        groundLine: '#FF3D00', // Electric Orange
        groundNoise: '#1a1a24',
        player: '#ffffff', // High Contrast White
        obstacle: '#FF3D00', // Orange Silhouette
        obstacleBird: '#00E5FF', // Cyan Silhouette for contrast
        hillFar: '#12121c',
        hillMid: '#1c1c2b'
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const speedValEl = document.getElementById('speed-val');
    const speedFillEl = document.getElementById('speed-fill');
    const gameOverPanel = document.getElementById('game-over');
    const instructionsEl = document.getElementById('instructions');

    let animationFrameId;
    let gameSpeed = 10; // Starting speed
    let score = 0;
    let highScore = 0;
    let frame = 0;
    let isGameOver = false;
    let isPlaying = false;

    // Physics Constants
    const GRAVITY = 0.7;
    const JUMP_FORCE = -16; // Snappier jump
    const GROUND_HEIGHT = 150; // Substantial ground

    /**
     * ENTITIES
     */
    
    class Player {
        constructor() {
            // 2x Scale as requested
            this.width = 100; 
            this.height = 100;
            this.x = 80;
            this.y = canvas.height - GROUND_HEIGHT - this.height;
            this.dy = 0;
            this.originalY = canvas.height - GROUND_HEIGHT - this.height;
            this.isGrounded = true;
            this.runFrame = 0;
        }

        jump() {
            if (this.isGrounded) {
                this.dy = JUMP_FORCE;
                this.isGrounded = false;
                createParticles(this.x + this.width/2, this.y + this.height, 12, COLORS.groundLine);
            }
        }

        update() {
            this.dy += GRAVITY;
            this.y += this.dy;

            if (this.y + this.height > canvas.height - GROUND_HEIGHT) {
                this.y = canvas.height - GROUND_HEIGHT - this.height;
                this.dy = 0;
                this.isGrounded = true;
            } else {
                this.isGrounded = false;
            }

            if (this.isGrounded) {
                this.runFrame += 0.3;
            } else {
                this.runFrame = 0; // Freeze pose in air
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);

            // Silhouette style
            ctx.fillStyle = COLORS.player;
            // Subtle glow for the hero
            ctx.shadowColor = 'rgba(255,255,255,0.2)';
            ctx.shadowBlur = 20;

            // Vector Dino Construction (Rex-like, larger)
            // Head
            ctx.fillRect(35, 0, 65, 45);
            // Eye (Negative space)
            ctx.fillStyle = COLORS.bgBottom; // Match BG
            ctx.fillRect(75, 10, 15, 15);
            // Jaw
            ctx.fillStyle = COLORS.player;
            ctx.fillRect(65, 35, 35, 10);
            
            // Neck
            ctx.fillRect(35, 45, 25, 20);
            // Body
            ctx.fillRect(0, 45, 60, 40);
            // Tail
            ctx.fillRect(-20, 50, 30, 25);

            // Legs (Animated)
            const legOffset = Math.sin(this.runFrame) * 20;
            
            // Back Leg
            ctx.fillRect(10, 85, 20, 20 + (this.isGrounded ? legOffset : 0));
            // Front Leg
            ctx.fillRect(40, 85, 20, 20 + (this.isGrounded ? -legOffset : 0));
            
            // Arms (Small but visible)
            ctx.fillRect(60, 55, 25, 12);

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type;
            this.markedForDeletion = false;
            
            if (type === 'cactus') {
                // Cluster Cactus
                this.width = 60 + Math.random() * 40;
                this.height = 80 + Math.random() * 30;
                this.x = canvas.width + this.width;
                this.y = canvas.height - GROUND_HEIGHT - this.height;
                this.variant = Math.floor(Math.random() * 3); // Visual variant
            } else {
                // Pterodactyl
                this.width = 80;
                this.height = 50;
                this.x = canvas.width + this.width;
                // Heights: Low, Mid, High
                const heights = [60, 110, 160];
                const chosenHeight = heights[Math.floor(Math.random() * heights.length)];
                this.y = canvas.height - GROUND_HEIGHT - chosenHeight;
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= gameSpeed;
            if (this.x + this.width < 0) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.15;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);

            if (this.type === 'cactus') {
                ctx.fillStyle = COLORS.obstacle;
                ctx.shadowColor = 'rgba(255, 61, 0, 0.4)';
                ctx.shadowBlur = 15;
                
                // Draw Cactus Cluster
                // Main Stem
                ctx.beginPath();
                ctx.roundRect(this.width/3, 0, this.width/3, this.height, 8);
                ctx.fill();

                // Left Arm
                if (this.width > 70) {
                    ctx.beginPath();
                    ctx.roundRect(0, this.height * 0.4, 25, 15, 5); 
                    ctx.roundRect(0, this.height * 0.2, 15, 40, 5); 
                    ctx.fill();
                }

                // Right Arm
                ctx.beginPath();
                ctx.roundRect(this.width - 25, this.height * 0.5, 25, 15, 5); 
                ctx.roundRect(this.width - 15, this.height * 0.3, 15, 40, 5); 
                ctx.fill();

            } else {
                // Bird
                ctx.fillStyle = COLORS.obstacleBird;
                ctx.shadowColor = 'rgba(0, 229, 255, 0.5)';
                ctx.shadowBlur = 15;

                // Body
                ctx.beginPath();
                ctx.ellipse(40, 25, 30, 15, 0, 0, Math.PI * 2);
                ctx.fill();

                // Beak
                ctx.beginPath();
                ctx.moveTo(65, 25);
                ctx.lineTo(85, 30);
                ctx.lineTo(65, 35);
                ctx.fill();

                // Wings (Flapping)
                const wingY = Math.sin(this.wingFrame) * 30;
                
                ctx.beginPath();
                ctx.moveTo(30, 25);
                ctx.lineTo(10, 0 + wingY);
                ctx.lineTo(55, 25);
                ctx.fill();
                
                // Tail
                ctx.beginPath();
                ctx.moveTo(10, 25);
                ctx.lineTo(-20, 15);
                ctx.lineTo(10, 35);
                ctx.fill();
            }

            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 6 + 3; 
            this.speedX = Math.random() * 8 - 4;
            this.speedY = Math.random() * 8 - 4;
            this.color = color;
            this.life = 1.0;
        }
        update() {
            this.x -= gameSpeed * 0.8; // Move with world slightly
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.04;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    class BackgroundLayer {
        constructor(speedMod, color, heightVar, yOffset, jaggedness) {
            this.speedMod = speedMod;
            this.color = color;
            this.x = 0;
            this.width = 300; 
            this.heightVar = heightVar;
            this.yOffset = yOffset;
            this.jaggedness = jaggedness;
            this.points = [];
            
            // Initialize points
            for(let i=0; i < canvas.width / this.width + 4; i++) {
                this.points.push(Math.random() * this.heightVar);
            }
        }

        update() {
            this.x -= gameSpeed * this.speedMod;
            if (this.x <= -this.width) {
                this.x += this.width;
                this.points.shift();
                this.points.push(Math.random() * this.heightVar);
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            let startX = this.x % this.width;
            
            for (let i = 0; i < this.points.length; i++) {
                let px = startX + (i * this.width);
                let py = canvas.height - GROUND_HEIGHT - this.yOffset - this.points[i];
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            // Close shape at bottom
            ctx.lineTo(canvas.width + 100, canvas.height);
            ctx.lineTo(-100, canvas.height);
            ctx.fill();
        }
    }

    /**
     * GAME STATE
     */
    let player;
    let obstacles = [];
    let particles = [];
    let bgLayers = [];
    let spawnTimer = 0;
    let spawnInterval = 100;

    function init() {
        resize();
        player = new Player();
        // Layered ground system
        bgLayers = [
            new BackgroundLayer(0.1, COLORS.hillFar, 200, 250, 0.5), // Far mountains
            new BackgroundLayer(0.25, COLORS.hillMid, 120, 150, 0.8)  // Mid hills
        ];
        
        // Populate Scene Immediately (Critique Point 1)
        // Add a cactus cluster right off-screen to appear quickly
        let cactus = new Obstacle('cactus');
        cactus.x = canvas.width + 100;
        obstacles.push(cactus);
        
        // Add a bird in the mid-air zone
        let bird = new Obstacle('bird');
        bird.x = canvas.width + 400;
        bird.y = canvas.height - GROUND_HEIGHT - 110; // Mid height
        obstacles.push(bird);

        loop();
    }

    function createParticles(x, y, count, color) {
        for (let i = 0; i < count; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    function spawnObstacle() {
        spawnTimer--;
        if (spawnTimer <= 0) {
            // Ensure rhythm: mix of cacti and birds
            const type = Math.random() > 0.7 ? 'bird' : 'cactus';
            obstacles.push(new Obstacle(type));
            
            // Rhythmic spacing logic
            spawnInterval = Math.max(50, 100 - (gameSpeed * 2)); 
            spawnTimer = spawnInterval + Math.random() * 40;
            
            // Slowly increase speed
            gameSpeed += 0.003;
        }
    }

    function checkCollisions() {
        for (let obs of obstacles) {
            // Hitbox padding to be forgiving
            const pPadding = 15;
            const oPadding = 10;

            if (
                player.x + pPadding < obs.x + obs.width - oPadding &&
                player.x + player.width - pPadding > obs.x + oPadding &&
                player.y + pPadding < obs.y + obs.height - oPadding &&
                player.y + player.height - pPadding > obs.y + oPadding
            ) {
                gameOver();
            }
        }
    }

    function gameOver() {
        isGameOver = true;
        isPlaying = false;
        gameOverPanel.style.display = 'block';
        instructionsEl.classList.add('hidden');
        
        if (score > highScore) {
            highScore = Math.floor(score);
            highScoreEl.innerText = highScore.toString().padStart(5, '0');
        }
    }

    function resetGame() {
        isGameOver = false;
        player = new Player();
        obstacles = [];
        particles = [];
        score = 0;
        gameSpeed = 10;
        spawnInterval = 100;
        spawnTimer = 0;
        gameOverPanel.style.display = 'none';
        isPlaying = true;
        instructionsEl.classList.add('hidden');
        
        // Repopulate initial scene
        let cactus = new Obstacle('cactus');
        cactus.x = canvas.width + 100;
        obstacles.push(cactus);
    }

    function update() {
        if (!isPlaying) return;

        frame++;
        score += 0.1;
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
        
        let speedMultiplier = (gameSpeed / 10).toFixed(1);
        speedValEl.innerText = speedMultiplier + 'x';
        let fillPercent = Math.min((gameSpeed - 10) / 15 * 100, 100);
        speedFillEl.style.width = Math.max(fillPercent, 5) + '%';

        player.update();
        bgLayers.forEach(layer => layer.update());

        spawnObstacle();
        obstacles.forEach((obs, index) => {
            obs.update();
            if (obs.markedForDeletion) obstacles.splice(index, 1);
        });

        particles.forEach((p, index) => {
            p.update();
            if (p.life <= 0) particles.splice(index, 1);
        });

        checkCollisions();
    }

    function draw() {
        // Clear
        ctx.fillStyle = COLORS.bgTop;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Sun (Atmosphere)
        const sunY = canvas.height - GROUND_HEIGHT - 150;
        const sunX = canvas.width * 0.75;
        
        // Sun Glow
        const gradient = ctx.createRadialGradient(sunX, sunY, 20, sunX, sunY, 150);
        gradient.addColorStop(0, COLORS.sunGlow);
        gradient.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Sun Body
        ctx.fillStyle = COLORS.sun;
        ctx.shadowColor = COLORS.sun;
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.arc(sunX, sunY, 60, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0; // Reset shadow

        // Draw Backgrounds (Hills)
        bgLayers.forEach(layer => layer.draw());

        // Draw Ground Layer - SOLID TEXTURED PLANE (Critique Point 2)
        // Base Ground
        ctx.fillStyle = COLORS.groundBase;
        ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, GROUND_HEIGHT);
        
        // Top Line (The Horizon) - Electric Orange
        ctx.fillStyle = COLORS.groundLine;
        ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, 6);

        // Add noise/texture to ground (Moving dashes for speed feel)
        ctx.fillStyle = COLORS.groundNoise;
        const offset = (frame * gameSpeed) % 80;
        
        // Draw multiple rows of texture for depth
        for(let i = -80; i < canvas.width; i+=80) {
            ctx.fillRect(i - offset, canvas.height - GROUND_HEIGHT + 20, 25, 4);
            ctx.fillRect(i - offset + 40, canvas.height - GROUND_HEIGHT + 60, 12, 4);
            ctx.fillRect(i - offset + 15, canvas.height - GROUND_HEIGHT + 100, 35, 5);
        }

        // Draw Entities
        player.draw();
        obstacles.forEach(obs => obs.draw());
        particles.forEach(p => p.draw());
    }

    function loop() {
        update();
        draw();
        animationFrameId = requestAnimationFrame(loop);
    }

    function resize() {
        canvas.width = document.getElementById('game-container').offsetWidth;
        canvas.height = document.getElementById('game-container').offsetHeight;
        // Re-init player Y if resizing
        if(player) player.originalY = canvas.height - GROUND_HEIGHT - player.height;
    }

    // Input Handling
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            if (isGameOver) {
                resetGame();
            } else if (!isPlaying) {
                isPlaying = true;
                instructionsEl.classList.add('hidden');
            } else {
                player.jump();
            }
        }
    });

    window.addEventListener('resize', resize);
    
    window.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (isGameOver) {
            resetGame();
        } else if (!isPlaying) {
            isPlaying = true;
            instructionsEl.classList.add('hidden');
        } else {
            player.jump();
        }
    }, {passive: false});

    // Start
    init();

</script>
</body>
</html>
