<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESERT RUNNER // REDESIGNED</title>
    <style>
        :root {
            --bg-deep: #0f0c15;
            --accent-sand: #e6c288;
            --accent-gold: #ffd700;
            --text-white: #ffffff;
            --text-muted: #8a849b;
            --font-pixel: 'Courier New', Courier, monospace; /* Fallback for system pixel font */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-white);
            font-family: var(--font-pixel);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CRT Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.15) 50%,
                rgba(0,0,0,0.15)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.6;
        }

        /* Main Game Container */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 650px;
            background: linear-gradient(to bottom, #14101c 0%, #251f30 100%);
            overflow: hidden;
            box-shadow: 0 0 100px rgba(0,0,0,0.5);
        }

        /* HUD Layer */
        .hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 20;
            pointer-events: none;
        }

        .hud-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .label {
            font-size: 12px;
            letter-spacing: 3px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: bold;
            opacity: 0.9;
        }

        .score-display {
            font-size: 48px;
            font-weight: 900;
            color: var(--text-white);
            text-shadow: 4px 4px 0px rgba(0,0,0,0.3);
            line-height: 1;
            font-family: var(--font-pixel);
        }

        .score-value {
            font-variant-numeric: tabular-nums;
        }

        .high-score {
            color: var(--accent-gold); /* Muted Gold per critique */
            font-size: 18px;
            margin-top: 6px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
        }

        .speed-indicator {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .speed-val {
            font-size: 28px;
            font-weight: 900;
            color: var(--accent-sand);
            font-family: var(--font-pixel);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
        }

        .speed-bar {
            width: 120px;
            height: 6px;
            background: rgba(0,0,0,0.3);
            margin-top: 10px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .speed-fill {
            height: 100%;
            background: var(--accent-sand);
            width: 10%;
            box-shadow: 0 0 10px var(--accent-sand);
            transition: width 0.1s linear;
        }

        /* Canvas Layer */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Instructions Overlay */
        .instruction-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 15;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .instruction-overlay.hidden {
            opacity: 0;
        }

        .start-prompt {
            font-size: 28px;
            color: var(--text-white);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 900;
            /* Glowing Pill Background per critique */
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 30px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(2px);
            animation: pulse 2s infinite;
        }

        .key-hint {
            margin-top: 15px;
            font-size: 12px;
            color: var(--accent-sand);
            letter-spacing: 2px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); border-color: rgba(255,255,255,0.2); }
            50% { transform: scale(1.02); border-color: rgba(255,255,255,0.5); box-shadow: 0 0 30px rgba(255,255,255,0.1); }
        }

        /* Game Over Panel */
        .game-over-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 12, 21, 0.95);
            border: 2px solid var(--accent-sand);
            padding: 50px 100px;
            text-align: center;
            display: none;
            z-index: 30;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }

        .game-over-title {
            color: var(--accent-sand);
            font-size: 42px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 6px;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(230, 194, 136, 0.4);
        }

        .restart-hint {
            color: var(--text-white);
            font-size: 16px;
            letter-spacing: 3px;
            opacity: 0.9;
            font-weight: bold;
        }

    </style>
</head>
<body>

    <div class="scanlines"></div>

    <div id="game-container">
        <!-- HUD -->
        <div class="hud-layer">
            <div class="hud-group">
                <div class="label">Score</div>
                <div class="score-display"><span id="score" class="score-value">00000</span></div>
                <div class="high-score">HI: <span id="high-score">00000</span></div>
            </div>
            <div class="hud-group speed-indicator">
                <div class="label">Velocity</div>
                <div class="speed-val" id="speed-val">1.0x</div>
                <div class="speed-bar"><div class="speed-fill" id="speed-fill"></div></div>
            </div>
        </div>

        <!-- Instructions -->
        <div class="instruction-overlay" id="instructions">
            <div class="start-prompt">Press Space to Run</div>
            <div class="key-hint">[ SPACE ] TO JUMP</div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Game Over -->
        <div class="game-over-panel" id="game-over">
            <div class="game-over-title">CRASHED</div>
            <div class="restart-hint">PRESS SPACE TO RESTART</div>
        </div>
    </div>

<script>
    /**
     * DESIGN SYSTEM & CONSTANTS
     * Palette: Deep Night Sky, Sand Accents, High Contrast White Player
     */
    const COLORS = {
        bgTop: '#14101c',
        bgBottom: '#251f30',
        sun: '#ff9e00',
        sunGlow: 'rgba(255, 158, 0, 0.3)',
        groundBase: '#2a2438', // Dark Purple-Grey base
        groundLine: '#e6c288', // Sand color
        groundNoise: '#1a1625',
        player: '#ffffff',
        obstacle: '#e6c288', // Sand/Gold obstacles for contrast
        obstacleBird: '#ffffff',
        hillFar: '#1e192b',
        hillMid: '#241e34'
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const speedValEl = document.getElementById('speed-val');
    const speedFillEl = document.getElementById('speed-fill');
    const gameOverPanel = document.getElementById('game-over');
    const instructionsEl = document.getElementById('instructions');

    let animationFrameId;
    let gameSpeed = 8; // Slightly faster start
    let score = 0;
    let highScore = 0;
    let frame = 0;
    let isGameOver = false;
    let isPlaying = false;

    // Physics Constants
    const GRAVITY = 0.6;
    const JUMP_FORCE = -14;
    const GROUND_HEIGHT = 120; // Increased ground presence

    /**
     * ENTITIES
     */
    
    class Player {
        constructor() {
            this.width = 60; // Scaled up
            this.height = 60;
            this.x = 80;
            this.y = canvas.height - GROUND_HEIGHT - this.height;
            this.dy = 0;
            this.originalY = canvas.height - GROUND_HEIGHT - this.height;
            this.isGrounded = true;
            this.runFrame = 0;
        }

        jump() {
            if (this.isGrounded) {
                this.dy = JUMP_FORCE;
                this.isGrounded = false;
                createParticles(this.x + this.width/2, this.y + this.height, 10, COLORS.groundLine);
            }
        }

        update() {
            this.dy += GRAVITY;
            this.y += this.dy;

            if (this.y + this.height > canvas.height - GROUND_HEIGHT) {
                this.y = canvas.height - GROUND_HEIGHT - this.height;
                this.dy = 0;
                this.isGrounded = true;
            } else {
                this.isGrounded = false;
            }

            if (this.isGrounded) {
                this.runFrame += 0.25;
            } else {
                this.runFrame = 0; // Freeze pose in air
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);

            // High Contrast Silhouette with Drop Shadow
            ctx.fillStyle = COLORS.player;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetX = 5;
            ctx.shadowOffsetY = 5;

            // Vector Dino Construction (Rex-like)
            // Head
            ctx.fillRect(25, 0, 35, 25);
            // Eye (Negative space)
            ctx.fillStyle = COLORS.bgBottom; // Match BG
            ctx.fillRect(45, 5, 8, 8);
            // Jaw
            ctx.fillStyle = COLORS.player;
            ctx.fillRect(40, 20, 20, 5);
            
            // Neck
            ctx.fillRect(25, 25, 15, 10);
            // Body
            ctx.fillRect(0, 25, 40, 20);
            // Tail
            ctx.fillRect(-10, 28, 15, 12);

            // Legs (Animated)
            const legOffset = Math.sin(this.runFrame) * 12;
            
            // Back Leg
            ctx.fillRect(5, 45, 10, 15 + (this.isGrounded ? legOffset : 0));
            // Front Leg
            ctx.fillRect(25, 45, 10, 15 + (this.isGrounded ? -legOffset : 0));
            
            // Arms (Small)
            ctx.fillRect(35, 30, 12, 6);

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type;
            this.markedForDeletion = false;
            
            if (type === 'cactus') {
                // Cluster Cactus
                this.width = 40 + Math.random() * 30;
                this.height = 55 + Math.random() * 25;
                this.x = canvas.width + this.width;
                this.y = canvas.height - GROUND_HEIGHT - this.height;
                this.variant = Math.floor(Math.random() * 3); // Visual variant
            } else {
                // Pterodactyl
                this.width = 50;
                this.height = 35;
                this.x = canvas.width + this.width;
                // Heights: Low, Mid, High
                const heights = [50, 90, 140];
                const chosenHeight = heights[Math.floor(Math.random() * heights.length)];
                this.y = canvas.height - GROUND_HEIGHT - chosenHeight;
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= gameSpeed;
            if (this.x + this.width < 0) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.15;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);

            if (this.type === 'cactus') {
                ctx.fillStyle = COLORS.obstacle;
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 5;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;
                
                // Draw Cactus Cluster
                // Main Stem
                ctx.beginPath();
                ctx.roundRect(this.width/3, 0, this.width/3, this.height, 5);
                ctx.fill();

                // Left Arm
                if (this.width > 50) {
                    ctx.beginPath();
                    ctx.roundRect(0, this.height * 0.4, 15, 10, 3); 
                    ctx.roundRect(0, this.height * 0.2, 10, 30, 3); 
                    ctx.fill();
                }

                // Right Arm
                ctx.beginPath();
                ctx.roundRect(this.width - 15, this.height * 0.5, 15, 10, 3); 
                ctx.roundRect(this.width - 10, this.height * 0.3, 10, 30, 3); 
                ctx.fill();

            } else {
                // Bird
                ctx.fillStyle = COLORS.obstacleBird;
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetX = 3;
                ctx.shadowOffsetY = 3;

                // Body
                ctx.beginPath();
                ctx.ellipse(25, 18, 20, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                // Beak
                ctx.beginPath();
                ctx.moveTo(40, 18);
                ctx.lineTo(55, 22);
                ctx.lineTo(40, 24);
                ctx.fill();

                // Wings (Flapping)
                const wingY = Math.sin(this.wingFrame) * 20;
                
                ctx.beginPath();
                ctx.moveTo(20, 18);
                ctx.lineTo(5, 0 + wingY);
                ctx.lineTo(35, 18);
                ctx.fill();
                
                // Tail
                ctx.beginPath();
                ctx.moveTo(5, 18);
                ctx.lineTo(-10, 12);
                ctx.lineTo(5, 24);
                ctx.fill();
            }

            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 4 + 2; // Bigger particles
            this.speedX = Math.random() * 6 - 3;
            this.speedY = Math.random() * 6 - 3;
            this.color = color;
            this.life = 1.0;
        }
        update() {
            this.x -= gameSpeed * 0.8; // Move with world slightly
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.03;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    class BackgroundLayer {
        constructor(speedMod, color, heightVar, yOffset, jaggedness) {
            this.speedMod = speedMod;
            this.color = color;
            this.x = 0;
            this.width = 200; 
            this.heightVar = heightVar;
            this.yOffset = yOffset;
            this.jaggedness = jaggedness;
            this.points = [];
            
            // Initialize points
            for(let i=0; i < canvas.width / this.width + 4; i++) {
                this.points.push(Math.random() * this.heightVar);
            }
        }

        update() {
            this.x -= gameSpeed * this.speedMod;
            if (this.x <= -this.width) {
                this.x += this.width;
                this.points.shift();
                this.points.push(Math.random() * this.heightVar);
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            let startX = this.x % this.width;
            
            for (let i = 0; i < this.points.length; i++) {
                let px = startX + (i * this.width);
                let py = canvas.height - GROUND_HEIGHT - this.yOffset - this.points[i];
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            // Close shape at bottom
            ctx.lineTo(canvas.width + 100, canvas.height);
            ctx.lineTo(-100, canvas.height);
            ctx.fill();
        }
    }

    /**
     * GAME STATE
     */
    let player;
    let obstacles = [];
    let particles = [];
    let bgLayers = [];
    let spawnTimer = 0;
    let spawnInterval = 80;

    function init() {
        resize();
        player = new Player();
        // Layered ground system
        bgLayers = [
            new BackgroundLayer(0.1, COLORS.hillFar, 150, 200, 0.5), // Far mountains
            new BackgroundLayer(0.25, COLORS.hillMid, 80, 100, 0.8)  // Mid hills
        ];
        loop();
    }

    function createParticles(x, y, count, color) {
        for (let i = 0; i < count; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    function spawnObstacle() {
        spawnTimer--;
        if (spawnTimer <= 0) {
            // Ensure rhythm: mix of cacti and birds
            const type = Math.random() > 0.7 ? 'bird' : 'cactus';
            obstacles.push(new Obstacle(type));
            
            // Rhythmic spacing logic
            spawnInterval = Math.max(45, 90 - (gameSpeed * 2)); 
            spawnTimer = spawnInterval + Math.random() * 40;
            
            // Slowly increase speed
            gameSpeed += 0.002;
        }
    }

    function checkCollisions() {
        for (let obs of obstacles) {
            // Hitbox padding to be forgiving
            const pPadding = 12;
            const oPadding = 8;

            if (
                player.x + pPadding < obs.x + obs.width - oPadding &&
                player.x + player.width - pPadding > obs.x + oPadding &&
                player.y + pPadding < obs.y + obs.height - oPadding &&
                player.y + player.height - pPadding > obs.y + oPadding
            ) {
                gameOver();
            }
        }
    }

    function gameOver() {
        isGameOver = true;
        isPlaying = false;
        gameOverPanel.style.display = 'block';
        instructionsEl.classList.add('hidden');
        
        if (score > highScore) {
            highScore = Math.floor(score);
            highScoreEl.innerText = highScore.toString().padStart(5, '0');
        }
    }

    function resetGame() {
        isGameOver = false;
        player = new Player();
        obstacles = [];
        particles = [];
        score = 0;
        gameSpeed = 8;
        spawnInterval = 80;
        spawnTimer = 0;
        gameOverPanel.style.display = 'none';
        isPlaying = true;
        instructionsEl.classList.add('hidden');
    }

    function update() {
        if (!isPlaying) return;

        frame++;
        score += 0.1;
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
        
        let speedMultiplier = (gameSpeed / 8).toFixed(1);
        speedValEl.innerText = speedMultiplier + 'x';
        let fillPercent = Math.min((gameSpeed - 8) / 15 * 100, 100);
        speedFillEl.style.width = Math.max(fillPercent, 5) + '%';

        player.update();
        bgLayers.forEach(layer => layer.update());

        spawnObstacle();
        obstacles.forEach((obs, index) => {
            obs.update();
            if (obs.markedForDeletion) obstacles.splice(index, 1);
        });

        particles.forEach((p, index) => {
            p.update();
            if (p.life <= 0) particles.splice(index, 1);
        });

        checkCollisions();
    }

    function draw() {
        // Clear
        ctx.fillStyle = COLORS.bgTop;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Sun (Atmosphere)
        const sunY = canvas.height - GROUND_HEIGHT - 150;
        const sunX = canvas.width * 0.75;
        
        // Sun Glow
        const gradient = ctx.createRadialGradient(sunX, sunY, 20, sunX, sunY, 150);
        gradient.addColorStop(0, COLORS.sunGlow);
        gradient.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Sun Body
        ctx.fillStyle = COLORS.sun;
        ctx.beginPath();
        ctx.arc(sunX, sunY, 40, 0, Math.PI * 2);
        ctx.fill();

        // Draw Backgrounds (Hills)
        bgLayers.forEach(layer => layer.draw());

        // Draw Ground Layer - SOLID TEXTURED PLANE
        // Base Ground
        ctx.fillStyle = COLORS.groundBase;
        ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, GROUND_HEIGHT);
        
        // Top Line (The Horizon)
        ctx.fillStyle = COLORS.groundLine;
        ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, 4);

        // Add noise/texture to ground (Moving dashes for speed feel)
        ctx.fillStyle = COLORS.groundNoise;
        const offset = (frame * gameSpeed) % 50;
        
        // Draw multiple rows of texture for depth
        for(let i = -50; i < canvas.width; i+=50) {
            ctx.fillRect(i - offset, canvas.height - GROUND_HEIGHT + 15, 15, 2);
            ctx.fillRect(i - offset + 25, canvas.height - GROUND_HEIGHT + 40, 8, 2);
            ctx.fillRect(i - offset + 10, canvas.height - GROUND_HEIGHT + 70, 20, 3);
        }

        // Draw Entities
        player.draw();
        obstacles.forEach(obs => obs.draw());
        particles.forEach(p => p.draw());
    }

    function loop() {
        update();
        draw();
        animationFrameId = requestAnimationFrame(loop);
    }

    function resize() {
        canvas.width = document.getElementById('game-container').offsetWidth;
        canvas.height = document.getElementById('game-container').offsetHeight;
        // Re-init player Y if resizing
        if(player) player.originalY = canvas.height - GROUND_HEIGHT - player.height;
    }

    // Input Handling
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            if (isGameOver) {
                resetGame();
            } else if (!isPlaying) {
                isPlaying = true;
                instructionsEl.classList.add('hidden');
            } else {
                player.jump();
            }
        }
    });

    window.addEventListener('resize', resize);
    
    window.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (isGameOver) {
            resetGame();
        } else if (!isPlaying) {
            isPlaying = true;
            instructionsEl.classList.add('hidden');
        } else {
            player.jump();
        }
    }, {passive: false});

    // Start
    init();

</script>
</body>
</html>
