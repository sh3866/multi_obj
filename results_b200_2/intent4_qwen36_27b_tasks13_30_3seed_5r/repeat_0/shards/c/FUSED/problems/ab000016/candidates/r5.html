<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RETRO SUNSET RUNNER</title>
    <style>
        :root {
            --bg-deep: #0f0508;
            --accent-primary: #ff5e00; /* Sunset Orange */
            --accent-secondary: #ffcc00; /* Golden Yellow */
            --accent-tertiary: #9d00ff; /* Deep Purple contrast */
            --text-white: #fffdf5; /* Warm White */
            --text-muted: #8a7575;
            --font-retro: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body {
            background-color: #000;
            color: var(--text-white);
            font-family: var(--font-retro);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CRT Overlay for Retro Feel */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.6;
        }
        
        /* Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* Main Game Container */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1200px; /* Wider aspect ratio */
            max-height: 600px;
            background-color: var(--bg-deep);
            overflow: hidden;
            box-shadow: 0 0 100px rgba(255, 94, 0, 0.15);
        }

        /* HUD Layer */
        .hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 20;
            pointer-events: none;
        }

        .hud-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .label {
            font-size: 10px;
            letter-spacing: 3px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: bold;
        }

        .score-display {
            font-size: 48px;
            font-weight: 900;
            color: var(--text-white);
            line-height: 1;
            letter-spacing: -2px;
            text-shadow: 2px 2px 0px var(--accent-primary);
            font-variant-numeric: tabular-nums;
        }

        .high-score {
            color: var(--accent-secondary);
            font-size: 14px;
            margin-top: 4px;
            font-weight: bold;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        /* Speed Indicator - Minimalist */
        .speed-indicator {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .speed-val {
            font-size: 20px;
            font-weight: 900;
            color: var(--accent-secondary);
            font-variant-numeric: tabular-nums;
        }

        /* Instructions - Floating World Text */
        .instruction-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 15;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .instruction-overlay.hidden {
            opacity: 0;
        }

        .start-prompt {
            font-size: 16px;
            color: var(--text-white);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 900;
            opacity: 0.7;
            background: rgba(0,0,0,0.3);
            padding: 8px 16px;
            border-radius: 2px;
            border: 1px solid rgba(255,255,255,0.1);
            animation: float 3s infinite ease-in-out;
            backdrop-filter: blur(2px);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); opacity: 0.5; }
            50% { transform: translateY(-5px); opacity: 1; border-color: var(--accent-secondary); }
        }

        /* Game Over */
        .game-over-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 5, 8, 0.95);
            border: 2px solid var(--accent-primary);
            padding: 30px 60px;
            text-align: center;
            display: none;
            z-index: 30;
            box-shadow: 0 0 60px rgba(255, 94, 0, 0.3);
        }

        .game-over-title {
            color: var(--accent-primary);
            font-size: 42px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 6px;
            font-weight: 900;
            text-shadow: 0 0 10px var(--accent-primary);
        }

        .restart-hint {
            color: var(--text-white);
            font-size: 12px;
            letter-spacing: 2px;
            opacity: 0.8;
            font-weight: bold;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div id="game-container">
        <!-- HUD -->
        <div class="hud-layer">
            <div class="hud-left">
                <div class="label">Score</div>
                <div class="score-display"><span id="score">00000</span></div>
                <div class="high-score">BEST: <span id="high-score">00000</span></div>
            </div>
            <div class="speed-indicator">
                <div class="label">Speed</div>
                <div class="speed-val" id="speed-val">1.0x</div>
            </div>
        </div>

        <!-- Instructions -->
        <div class="instruction-overlay" id="instructions">
            <div class="start-prompt">Press Space to Run</div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Game Over -->
        <div class="game-over-panel" id="game-over">
            <div class="game-over-title">CRASHED</div>
            <div class="restart-hint">PRESS SPACE TO RETRY</div>
        </div>
    </div>

<script>
    /**
     * DESIGN SYSTEM & CONSTANTS
     * Palette: Deep Night, Sunset Orange, Golden Yellow
     */
    const COLORS = {
        skyTop: '#1a0b14',
        skyBottom: '#4a1520',
        sun: '#ffcc00',
        sunGlow: 'rgba(255, 204, 0, 0.2)',
        groundBase: '#12060a',
        groundTop: '#ff5e00', // Orange horizon line
        groundDetail: '#2d0f16',
        player: '#fffdf5', // Warm white
        obstacle: '#ff5e00', // Orange Silhouette
        obstacleBird: '#ffcc00', // Yellow Silhouette
        hillFar: '#2b0e16',
        hillMid: '#3d121d'
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const speedValEl = document.getElementById('speed-val');
    const gameOverPanel = document.getElementById('game-over');
    const instructionsEl = document.getElementById('instructions');

    let animationFrameId;
    let gameSpeed = 8; 
    let score = 0;
    let highScore = 0;
    let frame = 0;
    let isGameOver = false;
    let isPlaying = false;

    // Physics Constants
    const GRAVITY = 0.6;
    const JUMP_FORCE = -14;
    const GROUND_HEIGHT = 120;

    /**
     * SPRITE DATA (Binary Maps for Pixel Art)
     * 1 = pixel, 0 = transparent
     */
    const SPRITES = {
        dinoStand: [
            "00000011111100",
            "00000011111111",
            "00000011111111",
            "00000011111111",
            "00000011111100",
            "00000011111000",
            "00000011111000",
            "00000111111000",
            "00000111111000",
            "00000111111000",
            "00001111111000",
            "00001111111000",
            "00001111111000",
            "00001111111000",
            "00001111111000",
            "00001100111000",
            "00001100111000"
        ],
        dinoRun2: [
            "00000011111100",
            "00000011111111",
            "00000011111111",
            "00000011111111",
            "00000011111100",
            "00000011111000",
            "00000011111000",
            "00000111111000",
            "00000111111000",
            "00000111111000",
            "00001111111000",
            "00001111111000",
            "00001111111000",
            "00001111111000",
            "00001111111000",
            "00000000111000",
            "00000000111000"
        ],
        dinoJump: [
            "00000011111100",
            "00000011111111",
            "00000011111111",
            "00000011111111",
            "00000011111100",
            "00000011111000",
            "00000011111000",
            "00000111111000",
            "00000111111000",
            "00000111111000",
            "00001111111000",
            "00001111111000",
            "00001111111000",
            "00001111111000",
            "00001111111000",
            "00001100110000",
            "00001100110000"
        ],
        cactusSmall: [
            "00100",
            "00100",
            "00100",
            "10100",
            "10100",
            "10110",
            "10110",
            "10110",
            "00110",
            "00110",
            "00100",
            "00100"
        ],
        cactusLarge: [
            "001000",
            "001000",
            "001000",
            "001000",
            "101000",
            "101000",
            "101010",
            "101010",
            "001010",
            "001010",
            "001000",
            "001000"
        ],
        bird1: [
            "0000000111110000",
            "0000011111110000",
            "0000111111110000",
            "0001111111110000",
            "0011111111110000",
            "0111111111110000",
            "1111111111111111",
            "0111111111111110",
            "0011111111111100",
            "0001111111111000"
        ],
        bird2: [
            "0000000111110000",
            "0000011111110000",
            "0000111111110000",
            "0001111111110000",
            "0011111111110000",
            "0111111111110000",
            "0000000111110000",
            "0000000111110000",
            "0000000111110000",
            "0000000111110000"
        ]
    };

    /**
     * UTILS
     */
    function drawSprite(ctx, map, x, y, size, color) {
        ctx.fillStyle = color;
        for (let r = 0; r < map.length; r++) {
            for (let c = 0; c < map[r].length; c++) {
                if (map[r][c] === '1') {
                    ctx.fillRect(x + c * size, y + r * size, size, size);
                }
            }
        }
    }

    /**
     * ENTITIES
     */
    
    class Player {
        constructor() {
            this.scale = 4; // Pixel scale
            this.width = 16 * this.scale; 
            this.height = 17 * this.scale;
            this.x = 80;
            this.y = canvas.height - GROUND_HEIGHT - this.height;
            this.dy = 0;
            this.originalY = canvas.height - GROUND_HEIGHT - this.height;
            this.isGrounded = true;
            this.runFrame = 0;
        }

        jump() {
            if (this.isGrounded) {
                this.dy = JUMP_FORCE;
                this.isGrounded = false;
                createParticles(this.x + this.width/2, this.y + this.height, 8, COLORS.groundTop);
            }
        }

        update() {
            this.dy += GRAVITY;
            this.y += this.dy;

            if (this.y + this.height > canvas.height - GROUND_HEIGHT) {
                this.y = canvas.height - GROUND_HEIGHT - this.height;
                this.dy = 0;
                this.isGrounded = true;
            } else {
                this.isGrounded = false;
            }

            if (this.isGrounded) {
                this.runFrame += 0.2;
            }
        }

        draw() {
            ctx.save();
            // Determine Sprite
            let spriteMap = SPRITES.dinoStand;
            if (!this.isGrounded) {
                spriteMap = SPRITES.dinoJump;
            } else {
                // Simple toggle for running
                spriteMap = (Math.floor(this.runFrame) % 2 === 0) ? SPRITES.dinoStand : SPRITES.dinoRun2;
            }

            // Draw crisp pixel art
            drawSprite(ctx, spriteMap, this.x, this.y, this.scale, COLORS.player);
            
            // Subtle outline for readability
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.lineWidth = 1;
            ctx.strokeRect(this.x, this.y, this.width, this.height); // Rough bounding box debug? No, just art.
            
            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type;
            this.markedForDeletion = false;
            this.scale = 4;
            
            if (type === 'cactus') {
                const variant = Math.random() > 0.5 ? 'cactusLarge' : 'cactusSmall';
                this.map = SPRITES[variant];
                this.width = this.map[0].length * this.scale;
                this.height = this.map.length * this.scale;
                this.x = canvas.width + this.width;
                this.y = canvas.height - GROUND_HEIGHT - this.height;
                this.color = COLORS.obstacle;
            } else {
                // Pterodactyl
                this.map1 = SPRITES.bird1;
                this.map2 = SPRITES.bird2;
                this.width = 16 * this.scale;
                this.height = 10 * this.scale;
                this.x = canvas.width + this.width;
                // Heights: Low (jumpable), Mid (duckable - though we don't have duck), High (safe)
                // Let's do Low and Mid to force jumps or near misses
                const heights = [canvas.height - GROUND_HEIGHT - 50, canvas.height - GROUND_HEIGHT - 90];
                this.y = heights[Math.floor(Math.random() * heights.length)];
                this.wingFrame = 0;
                this.color = COLORS.obstacleBird;
            }
        }

        update() {
            this.x -= gameSpeed;
            if (this.x + this.width < -50) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.1;
        }

        draw() {
            ctx.save();
            if (this.type === 'cactus') {
                drawSprite(ctx, this.map, this.x, this.y, this.scale, this.color);
            } else {
                // Flapping animation
                const map = (Math.floor(this.wingFrame) % 2 === 0) ? this.map1 : this.map2;
                drawSprite(ctx, map, this.x, this.y, this.scale, this.color);
            }
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 4 + 2; 
            this.speedX = Math.random() * 4 - 2;
            this.speedY = Math.random() * 4 - 2;
            this.color = color;
            this.life = 1.0;
        }
        update() {
            this.x -= gameSpeed * 0.8; // Move with world
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.05;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    class BackgroundLayer {
        constructor(speedMod, color, yOffset, jaggedness) {
            this.speedMod = speedMod;
            this.color = color;
            this.x = 0;
            this.yOffset = yOffset;
            this.jaggedness = jaggedness;
            this.points = [];
            // Generate smooth noise points
            const step = 100;
            const count = Math.ceil(canvas.width / step) + 2;
            for(let i=0; i<count; i++) {
                this.points.push(Math.random() * jaggedness);
            }
        }

        update() {
            this.x -= gameSpeed * this.speedMod;
            // Simple infinite scroll logic for points
            if (this.x <= -100) {
                this.x += 100;
                this.points.shift();
                this.points.push(Math.random() * this.jaggedness);
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height); // Bottom left
            
            let currentX = this.x;
            for (let i = 0; i < this.points.length; i++) {
                // Catmull-Rom or simple quadratic curves could be used, but straight lines with random height work for "silhouette"
                ctx.lineTo(currentX, canvas.height - GROUND_HEIGHT - this.yOffset - (this.points[i] * 100));
                currentX += 100;
            }
            
            ctx.lineTo(canvas.width + 100, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();
        }
    }

    /**
     * GAME STATE
     */
    let player;
    let obstacles = [];
    let particles = [];
    let bgLayers = [];
    let spawnTimer = 0;
    let spawnInterval = 90;

    function init() {
        resize();
        player = new Player();
        
        bgLayers = [
            new BackgroundLayer(0.1, COLORS.hillFar, 180, 0.5), // Far mountains
            new BackgroundLayer(0.2, COLORS.hillMid, 100, 0.8)  // Mid hills
        ];
        
        loop();
    }

    function createParticles(x, y, count, color) {
        for (let i = 0; i < count; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    function spawnObstacle() {
        spawnTimer--;
        if (spawnTimer <= 0) {
            const type = Math.random() > 0.7 ? 'bird' : 'cactus';
            obstacles.push(new Obstacle(type));
            
            // Rhythmic spacing: faster speed = tighter spawns, but minimum gap enforced
            spawnInterval = Math.max(45, 100 - (gameSpeed * 1.5)); 
            spawnTimer = spawnInterval + Math.random() * 30;
            
            // Slowly increase speed
            gameSpeed += 0.005;
        }
    }

    function checkCollisions() {
        for (let obs of obstacles) {
            // Hitbox padding (make hitboxes smaller than sprites for fairness)
            const pPad = 10; 
            const oPad = 8;

            if (
                player.x + pPad < obs.x + obs.width - oPad &&
                player.x + player.width - pPad > obs.x + oPad &&
                player.y + pPad < obs.y + obs.height - oPad &&
                player.y + player.height - pPad > obs.y + oPad
            ) {
                gameOver();
            }
        }
    }

    function gameOver() {
        isGameOver = true;
        isPlaying = false;
        gameOverPanel.style.display = 'block';
        instructionsEl.classList.add('hidden');
        
        if (score > highScore) {
            highScore = Math.floor(score);
            highScoreEl.innerText = highScore.toString().padStart(5, '0');
        }
    }

    function resetGame() {
        isGameOver = false;
        player = new Player();
        obstacles = [];
        particles = [];
        score = 0;
        gameSpeed = 8;
        spawnInterval = 90;
        spawnTimer = 0;
        gameOverPanel.style.display = 'none';
        isPlaying = true;
        instructionsEl.classList.add('hidden');
    }

    function update() {
        if (!isPlaying) return;

        frame++;
        score += 0.1;
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
        
        let speedMultiplier = (gameSpeed / 8).toFixed(1);
        speedValEl.innerText = speedMultiplier + 'x';

        player.update();
        bgLayers.forEach(layer => layer.update());

        spawnObstacle();
        obstacles.forEach((obs, index) => {
            obs.update();
            if (obs.markedForDeletion) obstacles.splice(index, 1);
        });

        particles.forEach((p, index) => {
            p.update();
            if (p.life <= 0) particles.splice(index, 1);
        });

        checkCollisions();
    }

    function draw() {
        // 1. Sky Gradient
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, COLORS.skyTop);
        gradient.addColorStop(1, COLORS.skyBottom);
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. Sun
        const sunY = canvas.height - GROUND_HEIGHT - 100;
        const sunX = canvas.width * 0.75;
        
        // Sun Glow
        const glowGrad = ctx.createRadialGradient(sunX, sunY, 20, sunX, sunY, 200);
        glowGrad.addColorStop(0, COLORS.sunGlow);
        glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glowGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Sun Body (Retro stripes effect)
        ctx.fillStyle = COLORS.sun;
        ctx.beginPath();
        ctx.arc(sunX, sunY, 50, 0, Math.PI * 2);
        ctx.fill();
        
        // Retro horizontal lines cutting through sun
        ctx.fillStyle = COLORS.skyBottom; // Cut out using bg color
        for(let i=0; i<10; i++) {
            let lineH = 2 + i * 1.5;
            let yPos = sunY - 40 + (i * 12);
            ctx.fillRect(sunX - 60, yPos, 120, lineH);
        }

        // 3. Background Hills
        bgLayers.forEach(layer => layer.draw());

        // 4. Ground
        ctx.fillStyle = COLORS.groundBase;
        ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, GROUND_HEIGHT);
        
        // Top Line (Horizon)
        ctx.fillStyle = COLORS.groundTop;
        ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, 4);

        // Moving Ground Texture
        ctx.fillStyle = COLORS.groundDetail;
        const offset = (frame * gameSpeed) % 100;
        for(let i = -100; i < canvas.width; i+=100) {
            // Draw some random "rocks" or texture
            ctx.fillRect(i - offset, canvas.height - GROUND_HEIGHT + 20, 40, 4);
            ctx.fillRect(i - offset + 60, canvas.height - GROUND_HEIGHT + 50, 20, 4);
        }

        // 5. Entities
        player.draw();
        obstacles.forEach(obs => obs.draw());
        particles.forEach(p => p.draw());
    }

    function loop() {
        update();
        draw();
        animationFrameId = requestAnimationFrame(loop);
    }

    function resize() {
        canvas.width = document.getElementById('game-container').offsetWidth;
        canvas.height = document.getElementById('game-container').offsetHeight;
        if(player) player.originalY = canvas.height - GROUND_HEIGHT - player.height;
    }

    // Input Handling
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            if (isGameOver) {
                resetGame();
            } else if (!isPlaying) {
                isPlaying = true;
                instructionsEl.classList.add('hidden');
            } else {
                player.jump();
            }
        }
    });

    window.addEventListener('resize', resize);
    
    window.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (isGameOver) {
            resetGame();
        } else if (!isPlaying) {
            isPlaying = true;
            instructionsEl.classList.add('hidden');
        } else {
            player.jump();
        }
    }, {passive: false});

    // Start
    init();

</script>
</body>
</html>
