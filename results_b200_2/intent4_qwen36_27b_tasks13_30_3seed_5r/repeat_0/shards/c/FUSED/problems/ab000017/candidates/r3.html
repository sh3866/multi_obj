<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Cube - Digital Puzzle</title>
<style>
  :root {
    /* Design System: Colors */
    --bg-deep: #09090b;
    --bg-surface: #18181b;
    --bg-elevated: #27272a;
    
    --text-primary: #f4f4f5;
    --text-secondary: #a1a1aa;
    --text-muted: #52525b;
    
    /* Cube Palette - Competitive Standard */
    --c-white: #ffffff;
    --c-yellow: #ffd500;
    --c-red: #d40000;
    --c-orange: #ff5900;
    --c-blue: #0051ba;
    --c-green: #009b48;
    --c-plastic: #111111;
    --c-plastic-light: #222222;

    /* UI Accents */
    --accent-primary: #3b82f6; /* Blue */
    --accent-success: #10b981; /* Green */
    --accent-warning: #f59e0b; /* Amber */
    --accent-danger: #ef4444;  /* Red */

    /* Dimensions */
    --cube-base-size: 300px;
    --gap: 4px;
    --sticker-radius: 4px;
    
    /* Layout */
    --header-height: 80px;
    --dock-height: 100px;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-deep);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Ambient Light Effect */
  .ambient-light {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 40%, rgba(59, 130, 246, 0.08) 0%, transparent 60%);
    z-index: 0;
    pointer-events: none;
  }

  /* --- HEADER (Top Center Stats & Right Size Selector) --- */
  header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: var(--header-height);
    display: flex;
    justify-content: center; /* Center stats */
    align-items: center;
    padding: 0 40px;
    z-index: 100;
    pointer-events: none;
  }

  .stats-container {
    display: flex;
    gap: 40px;
    pointer-events: auto;
    background: rgba(24, 24, 27, 0.6);
    backdrop-filter: blur(12px);
    padding: 10px 30px;
    border-radius: 50px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .stat-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-secondary);
    margin-bottom: 2px;
  }
  .stat-value {
    font-family: 'Courier New', monospace;
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1;
  }
  .stat-value.timer { color: var(--accent-primary); text-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }

  .size-selector {
    position: absolute;
    right: 40px;
    display: flex;
    background: var(--bg-surface);
    border-radius: 12px;
    padding: 4px;
    border: 1px solid rgba(255,255,255,0.1);
    pointer-events: auto;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  }

  .size-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    padding: 6px 12px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s ease;
  }
  .size-btn:hover { color: var(--text-primary); background: rgba(255,255,255,0.05); }
  .size-btn.active {
    background: var(--bg-elevated);
    color: var(--text-primary);
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }

  /* --- MAIN STAGE (Absolute Center) --- */
  .stage {
    flex: 1;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1000px;
    z-index: 10;
    position: relative;
  }

  /* Ground Shadow */
  .ground-shadow {
    position: absolute;
    width: 300px;
    height: 40px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.7) 0%, transparent 70%);
    top: 60%; left: 50%;
    transform: translate(-50%, 0);
    filter: blur(10px);
    pointer-events: none;
    transition: all 0.3s ease;
  }

  .scene-interactor {
    width: var(--cube-base-size);
    height: var(--cube-base-size);
    position: relative;
    transform-style: preserve-3d;
    transform: rotateX(-25deg) rotateY(-40deg);
    transition: transform 0.1s linear;
    cursor: grab;
  }
  .scene-interactor:active { cursor: grabbing; }

  .cube {
    width: 100%;
    height: 100%;
    position: absolute;
    transform-style: preserve-3d;
  }

  /* --- FACES & STICKERS --- */
  .face {
    position: absolute;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    background: var(--c-plastic);
    border-radius: 12px;
    padding: var(--gap);
    gap: var(--gap);
    /* 3D Face Construction */
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1); /* Bevel */
    backface-visibility: hidden;
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .sticker {
    width: 100%;
    height: 100%;
    border-radius: var(--sticker-radius);
    position: relative;
    /* Sticker Depth */
    transform: translateZ(1px);
    box-shadow: 
      inset 0 0 0 1px rgba(0,0,0,0.1),
      inset 2px 2px 5px rgba(255,255,255,0.2), /* Highlight */
      inset -2px -2px 5px rgba(0,0,0,0.3), /* Shadow */
      0 1px 2px rgba(0,0,0,0.5); /* Drop shadow on plastic */
    transition: background-color 0.2s;
  }

  /* Glossy reflection on sticker */
  .sticker::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px; right: 2px; bottom: 2px;
    background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.0) 40%);
    border-radius: 3px;
    pointer-events: none;
  }

  /* Face Transformations */
  .face.front  { transform: rotateY(0deg) translateZ(calc(var(--cube-base-size)/2)); }
  .face.back   { transform: rotateY(180deg) translateZ(calc(var(--cube-base-size)/2)); }
  .face.right  { transform: rotateY(90deg) translateZ(calc(var(--cube-base-size)/2)); }
  .face.left   { transform: rotateY(-90deg) translateZ(calc(var(--cube-base-size)/2)); }
  .face.top    { transform: rotateX(90deg) translateZ(calc(var(--cube-base-size)/2)); }
  .face.bottom { transform: rotateX(-90deg) translateZ(calc(var(--cube-base-size)/2)); }

  /* --- DOCK (Bottom Center) --- */
  .dock {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 100;
    padding: 10px;
    background: rgba(24, 24, 27, 0.7);
    backdrop-filter: blur(16px);
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }

  .btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255,255,255,0.05);
    color: var(--text-secondary);
    padding: 12px 20px;
    border-radius: 16px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 80px;
    justify-content: center;
  }

  .btn:hover {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text-primary);
    transform: translateY(-2px);
  }
  .btn:active { transform: translateY(1px); }

  /* Specific Button Styles */
  .btn-scramble {
    background: rgba(255, 89, 0, 0.15);
    border-color: rgba(255, 89, 0, 0.3);
    color: var(--c-orange);
  }
  .btn-scramble:hover {
    background: rgba(255, 89, 0, 0.25);
    box-shadow: 0 0 15px rgba(255, 89, 0, 0.2);
  }

  .btn-hint {
    background: rgba(16, 185, 129, 0.15);
    border-color: rgba(16, 185, 129, 0.3);
    color: var(--c-green);
  }
  .btn-hint:hover {
    background: rgba(16, 185, 129, 0.25);
    box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
  }

  .btn-icon { width: 16px; height: 16px; stroke-width: 2.5; }

  /* --- SIDE DRAWER (Overlay) --- */
  .drawer-overlay {
    position: fixed;
    top: 0; right: 0; bottom: 0; width: 320px;
    background: rgba(15, 15, 20, 0.85);
    backdrop-filter: blur(20px);
    border-left: 1px solid rgba(255,255,255,0.1);
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 200;
    display: flex;
    flex-direction: column;
    padding: 24px;
    box-shadow: -10px 0 40px rgba(0,0,0,0.5);
  }
  .drawer-overlay.open { transform: translateX(0); }

  .drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .drawer-title { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.5px; }
  .close-btn { 
    background: none; border: none; color: var(--text-secondary); cursor: pointer; 
    padding: 5px; border-radius: 50%; display: flex; align-items: center;
  }
  .close-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

  .drawer-section { margin-bottom: 24px; }
  .drawer-label { 
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); 
    margin-bottom: 8px;
  }
  .scramble-code {
    font-family: 'Courier New', monospace;
    background: rgba(0,0,0,0.3);
    padding: 12px;
    border-radius: 8px;
    color: var(--text-primary);
    line-height: 1.5;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .tip-box {
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.2);
    padding: 12px;
    border-radius: 8px;
    color: #d1fae5;
    font-size: 0.9rem;
    line-height: 1.4;
  }

  /* Toggle Drawer Button (Floating) */
  .drawer-toggle {
    position: fixed;
    top: 24px;
    right: 40px;
    z-index: 150;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg-surface);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .drawer-toggle:hover { background: var(--bg-elevated); color: #fff; }
  .drawer-toggle.active { background: var(--accent-primary); color: white; border-color: var(--accent-primary); }

  /* Mobile Adjustments */
  @media (max-width: 768px) {
    :root { --cube-base-size: 220px; }
    .size-selector { display: none; } /* Hide size selector on mobile for simplicity */
    .drawer-toggle { right: 20px; top: 20px; }
    header { padding: 0 20px; }
    .dock { width: 90%; justify-content: space-around; bottom: 20px; padding: 8px; }
    .btn { padding: 10px; min-width: auto; font-size: 0; } /* Icons only on mobile */
    .btn-icon { width: 24px; height: 24px; }
  }
</style>
</head>
<body>

<div class="ambient-light"></div>

<!-- HEADER -->
<header>
  <div class="stats-container">
    <div class="stat-item">
      <div class="stat-label">Moves</div>
      <div class="stat-value" id="move-count">0</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Time</div>
      <div class="stat-value timer" id="timer">00:00</div>
    </div>
  </div>
  
  <div class="size-selector">
    <button class="size-btn" onclick="setCubeSize(2)">2x2</button>
    <button class="size-btn active" onclick="setCubeSize(3)">3x3</button>
    <button class="size-btn" onclick="setCubeSize(4)">4x4</button>
    <button class="size-btn" onclick="setCubeSize(5)">5x5</button>
  </div>
</header>

<!-- DRAWER TOGGLE -->
<button class="drawer-toggle" id="drawer-toggle" onclick="toggleDrawer()">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- STAGE -->
<div class="stage">
  <div class="ground-shadow"></div>
  <div class="scene-interactor" id="scene">
    <div class="cube" id="cube">
      <!-- Faces generated by JS -->
    </div>
  </div>
</div>

<!-- DOCK -->
<div class="dock">
  <button class="btn" onclick="undoMove()">
    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
    Undo
  </button>
  <button class="btn btn-hint" onclick="hintMove()">
    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
    Hint
  </button>
  <button class="btn" onclick="resetCube()">
    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L21 10"/></svg>
    Reset
  </button>
  <button class="btn btn-scramble" onclick="scrambleCube()">
    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
    Scramble
  </button>
</div>

<!-- SIDE DRAWER -->
<div class="drawer-overlay" id="drawer">
  <div class="drawer-header">
    <span class="drawer-title">Info & Scramble</span>
    <button class="close-btn" onclick="toggleDrawer()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div class="drawer-section">
    <div class="drawer-label">Last Scramble</div>
    <div class="scramble-code" id="scramble-display">
      Ready to scramble
    </div>
  </div>

  <div class="drawer-section">
    <div class="drawer-label">Pro Tip</div>
    <div class="tip-box">
      <strong>Beginner Method:</strong> Start by solving the white cross. Align the edge pieces with their center colors before moving on.
    </div>
  </div>
</div>

<script>
  // --- CONFIGURATION ---
  const COLORS = {
    U: 'var(--c-white)', 
    D: 'var(--c-yellow)', 
    F: 'var(--c-green)', 
    B: 'var(--c-red)',   
    R: 'var(--c-orange)', 
    L: 'var(--c-blue)'   
  };

  // --- STATE ---
  let moveHistory = [];
  let timerInterval;
  let seconds = 0;
  let isDragging = false;
  let startX, startY;
  let currentRotX = -25;
  let currentRotY = -40;
  let currentSize = 3;
  let isDrawerOpen = false;

  // --- DOM ELEMENTS ---
  const cubeEl = document.getElementById('cube');
  const sceneEl = document.getElementById('scene');
  const timerEl = document.getElementById('timer');
  const moveCountEl = document.getElementById('move-count');
  const scrambleDisplayEl = document.getElementById('scramble-display');

  // --- INITIALIZATION ---
  function init() {
    createCubeDOM(3);
    resetCube();
    setupInteraction();
  }

  // --- DOM GENERATION ---
  function createCubeDOM(size) {
    cubeEl.innerHTML = '';
    const faces = ['front', 'back', 'right', 'left', 'top', 'bottom'];
    
    faces.forEach((faceName, index) => {
      const faceDiv = document.createElement('div');
      faceDiv.className = `face ${faceName}`;
      faceDiv.id = `face-${index}`;
      
      // Update grid CSS dynamically for NxN
      faceDiv.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
      faceDiv.style.gridTemplateRows = `repeat(${size}, 1fr)`;

      const totalStickers = size * size;
      for(let i=0; i<totalStickers; i++) {
        const sticker = document.createElement('div');
        sticker.className = 'sticker';
        sticker.dataset.index = i;
        faceDiv.appendChild(sticker);
      }
      cubeEl.appendChild(faceDiv);
    });
  }

  // --- LOGIC: STATE MANAGEMENT ---
  function resetCube() {
    stopTimer();
    seconds = 0;
    updateTimerDisplay();
    moveHistory = [];
    moveCountEl.innerText = '0';
    
    // Initialize standard colors
    const faces = ['F', 'B', 'R', 'L', 'U', 'D'];
    Array.from(cubeEl.children).forEach((face, i) => {
      const color = COLORS[faces[i]];
      Array.from(face.children).forEach(sticker => {
        sticker.style.backgroundColor = color;
      });
    });
    
    scrambleDisplayEl.innerHTML = "Ready to scramble";
  }

  function setCubeSize(size) {
    currentSize = size;
    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    
    createCubeDOM(size);
    resetCube();
  }

  function toggleDrawer() {
    isDrawerOpen = !isDrawerOpen;
    document.getElementById('drawer').classList.toggle('open', isDrawerOpen);
    document.getElementById('drawer-toggle').classList.toggle('active', isDrawerOpen);
  }

  // --- LOGIC: MOVES ---
  const FACES_MAP = {
    'F': 0, 'B': 1, 'R': 2, 'L': 3, 'U': 4, 'D': 5
  };

  function applyMove(moveChar, visual = true) {
    if(!visual) return; 
    
    const faceIndex = FACES_MAP[moveChar.charAt(0)];
    const faceEl = cubeEl.children[faceIndex];
    
    // Visual Rotation
    let dir = 1; 
    if(moveChar.includes("'")) dir = -1;
    if(moveChar.includes("2")) dir = 2;
    
    // Animate spin
    faceEl.style.transition = `transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)`;
    const currentTransform = faceEl.style.transform;
    // Clear previous rotateZ to prevent accumulation in this simple demo
    const cleanTransform = currentTransform.replace(/rotateZ\([^)]*\)/g, '');
    faceEl.style.transform = cleanTransform + ` rotateZ(${dir * 90}deg)`;

    // Logic Swap after animation
    setTimeout(() => {
      swapStickers(moveChar);
      if(visual) {
        faceEl.style.transition = 'none';
        faceEl.style.transform = ''; // Reset rotation visual (simplified)
      }
    }, visual ? 250 : 0);
  }

  function swapStickers(move) {
    // Helper
    const get = (faceIdx, stickerIdx) => cubeEl.children[faceIdx].children[stickerIdx].style.backgroundColor;
    const set = (faceIdx, stickerIdx, color) => cubeEl.children[faceIdx].children[stickerIdx].style.backgroundColor = color;

    // Internal Face Rotation (Clockwise)
    const rotateFace = (faceIdx) => {
      const stickers = Array.from(cubeEl.children[faceIdx].children);
      const total = stickers.length;
      const side = Math.sqrt(total);
      const temp = [...stickers.map(s => s.style.backgroundColor)];
      
      for(let r=0; r<side; r++) {
        for(let c=0; c<side; c++) {
          const oldIdx = r * side + c;
          const newR = c;
          const newC = side - 1 - r;
          const newIdx = newR * side + newC;
          set(faceIdx, newIdx, temp[oldIdx]);
        }
      }
    };

    const char = move.charAt(0);
    const side = currentSize;

    // Simplified swap logic for Front face (Demo purposes)
    if (char === 'F') {
      rotateFace(0); // Front
      const uRow = [];
      for(let i=0; i<side; i++) uRow.push(get(4, (side-1)*side + i)); 
      const rCol = [];
      for(let i=0; i<side; i++) rCol.push(get(2, i*side)); 
      const dRow = [];
      for(let i=0; i<side; i++) dRow.push(get(5, (side-1)*side + (side-1-i))); 
      const lCol = [];
      for(let i=0; i<side; i++) lCol.push(get(3, (side-1)*side + (side-1-i))); 
      
      for(let i=0; i<side; i++) {
        set(4, (side-1)*side + i, lCol[i]); 
        set(2, i*side, uRow[i]);             
        set(5, (side-1)*side + (side-1-i), rCol[i]); 
        set(3, (side-1)*side + (side-1-i), dRow[i]); 
      }
    } 
  }

  // --- SCRAMBLE ---
  function scrambleCube() {
    const moves = ['F', 'B', 'U', 'D', 'L', 'R'];
    const modifiers = ['', "'", '2'];
    let scrambleString = "";
    
    for(let i=0; i<20; i++) {
      const m = moves[Math.floor(Math.random() * moves.length)];
      const mod = modifiers[Math.floor(Math.random() * modifiers.length)];
      scrambleString += (m + mod + " ");
    }
    
    scrambleDisplayEl.innerText = scrambleString;
    
    // Animate scramble: Rapidly randomize colors
    let count = 0;
    const interval = setInterval(() => {
      randomizeColors();
      count++;
      if(count > 10) {
        clearInterval(interval);
        startTimer();
      }
    }, 100);
  }

  function randomizeColors() {
    const allStickers = document.querySelectorAll('.sticker');
    const colorKeys = Object.keys(COLORS);
    allStickers.forEach(s => {
      const randColor = COLORS[colorKeys[Math.floor(Math.random() * colorKeys.length)]];
      s.style.backgroundColor = randColor;
    });
  }

  // --- CONTROLS ---
  function startTimer() {
    stopTimer();
    seconds = 0;
    timerInterval = setInterval(() => {
      seconds++;
      updateTimerDisplay();
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
  }

  function updateTimerDisplay() {
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = (seconds % 60).toString().padStart(2, '0');
    timerEl.innerText = `${m}:${s}`;
  }

  function undoMove() {
    const btn = document.querySelector('button[onclick="undoMove()"]');
    btn.style.transform = "scale(0.95)";
    setTimeout(() => btn.style.transform = "", 100);
  }

  function hintMove() {
    const btn = document.querySelector('button[onclick="hintMove()"]');
    btn.style.transform = "scale(0.95)";
    setTimeout(() => btn.style.transform = "", 100);
    const tip = document.querySelector('.tip-box');
    const originalText = tip.innerHTML;
    tip.innerHTML = "<strong>Hint:</strong> Look for the White-Red-Blue corner piece.";
    setTimeout(() => { tip.innerHTML = originalText; }, 3000);
  }

  // --- INTERACTION (3D ROTATION) ---
  function setupInteraction() {
    document.addEventListener('mousedown', (e) => {
      if(e.target.closest('.btn') || e.target.closest('.size-btn') || e.target.closest('.drawer-toggle')) return;
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - startX;
      const deltaY = e.clientY - startY;
      
      currentRotY += deltaX * 0.5;
      currentRotX -= deltaY * 0.5;
      
      currentRotX = Math.max(-90, Math.min(90, currentRotX));

      sceneEl.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
      
      startX = e.clientX;
      startY = e.clientY;
    });

    document.addEventListener('mouseup', () => isDragging = false);
    
    document.addEventListener('touchstart', (e) => {
      if(e.target.closest('.btn') || e.target.closest('.drawer-toggle')) return;
      isDragging = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    });
    
    document.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const deltaX = e.touches[0].clientX - startX;
      const deltaY = e.touches[0].clientY - startY;
      
      currentRotY += deltaX * 0.5;
      currentRotX -= deltaY * 0.5;
      currentRotX = Math.max(-90, Math.min(90, currentRotX));

      sceneEl.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
      
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    });
    
    document.addEventListener('touchend', () => isDragging = false);
  }

  // Start
  init();

</script>
</body>
</html>
