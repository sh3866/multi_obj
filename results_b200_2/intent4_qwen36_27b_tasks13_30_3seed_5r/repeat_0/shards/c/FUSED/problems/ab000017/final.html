<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Cube - Digital Puzzle</title>
<style>
  :root {
    /* Design System: Colors */
    --bg-deep: #050505;
    --bg-surface: #161618;
    --bg-elevated: #222225;
    --bg-glass: rgba(22, 22, 24, 0.7);
    
    --text-primary: #ffffff;
    --text-secondary: #88888c;
    
    /* Cube Palette - Physical Sticker Colors (Tuned for OLED) */
    --c-white: #f2f2f2;
    --c-yellow: #f5c518;
    --c-red: #d32f2f;
    --c-orange: #ef6c00;
    --c-blue: #0288d1;
    --c-green: #388e3c;
    --c-plastic: #0a0a0a;
    
    /* UI Accents */
    --accent-primary: #3b82f6;
    --accent-glow: rgba(59, 130, 246, 0.4);
    
    /* Dimensions */
    --cube-size: 280px; 
    --gap: 4px;
    --radius: 6px;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background-color: var(--bg-deep);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    perspective: 1200px;
  }

  /* Background Atmosphere */
  .bg-grid {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 0%, transparent 60%),
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 100% 100%, 40px 40px, 40px 40px;
    z-index: -1;
  }

  /* --- TOP BAR (Stats & Size) --- */
  header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 70px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0 24px;
    z-index: 100;
    pointer-events: none; /* Let clicks pass through to stage if needed */
  }

  .top-bar {
    display: flex;
    width: 100%;
    max-width: 700px;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 8px 16px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    pointer-events: auto;
  }

  /* Stats */
  .stats {
    display: flex;
    gap: 24px;
    padding-left: 8px;
  }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .stat-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    color: var(--text-secondary);
    letter-spacing: 1.5px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .stat-val {
    font-family: 'Courier New', monospace;
    font-size: 1.2rem;
    font-weight: 700;
    line-height: 1;
    color: var(--text-primary);
  }
  .stat-val.timer { color: var(--accent-primary); text-shadow: 0 0 10px var(--accent-glow); }

  /* Size Selector - Segmented Control */
  .size-selector {
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    padding: 3px;
    display: flex;
    gap: 2px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .size-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 0.8rem;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .size-btn:hover { color: var(--text-primary); }
  .size-btn.active {
    background: var(--bg-elevated);
    color: var(--text-primary);
    box-shadow: 0 2px 5px rgba(0,0,0,0.5);
  }

  /* --- 3D STAGE --- */
  .stage {
    flex: 1;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    cursor: grab;
  }
  .stage:active { cursor: grabbing; }

  /* Ground Shadow - Anchored */
  .shadow {
    position: absolute;
    top: 50%; left: 50%;
    width: 300px;
    height: 300px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.8) 0%, transparent 70%);
    transform: translate(-50%, -50%) rotateX(90deg) translateZ(-160px); 
    filter: blur(25px);
    pointer-events: none;
    opacity: 0.8;
    z-index: -1;
  }

  .cube-container {
    width: var(--cube-size);
    height: var(--cube-size);
    position: relative;
    transform-style: preserve-3d;
    transform: rotateX(-25deg) rotateY(-35deg); 
    transition: transform 0.1s linear;
  }

  .cube {
    width: 100%;
    height: 100%;
    position: absolute;
    transform-style: preserve-3d;
  }

  /* Faces */
  .face {
    position: absolute;
    width: 100%;
    height: 100%;
    display: grid;
    background: var(--c-plastic);
    border-radius: 12px;
    padding: var(--gap);
    gap: var(--gap);
    /* Plastic Bevel */
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08), inset 0 0 20px rgba(0,0,0,0.8);
    backface-visibility: hidden;
  }

  /* Stickers */
  .sticker {
    width: 100%;
    height: 100%;
    border-radius: var(--radius);
    position: relative;
    transform: translateZ(1.5px); /* Lift sticker off plastic */
    /* Complex Inner Shadow for tactile feel */
    box-shadow: 
      inset 0 0 0 1px rgba(0,0,0,0.1),
      inset 1px 1px 2px rgba(255,255,255,0.4), 
      inset -1px -1px 2px rgba(0,0,0,0.5),
      0 2px 3px rgba(0,0,0,0.4);
    transition: background-color 0.3s ease;
  }
  
  /* Glossy Reflection (Directional) */
  .sticker::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px; right: 40%; bottom: 40%;
    background: linear-gradient(135deg, rgba(255,255,255,0.6) 0%, transparent 100%);
    border-radius: 3px 1px 1px 1px;
    pointer-events: none;
  }

  /* Face Transforms */
  .face.front  { transform: rotateY(0deg) translateZ(calc(var(--cube-size)/2)); }
  .face.back   { transform: rotateY(180deg) translateZ(calc(var(--cube-size)/2)); }
  .face.right  { transform: rotateY(90deg) translateZ(calc(var(--cube-size)/2)); }
  .face.left   { transform: rotateY(-90deg) translateZ(calc(var(--cube-size)/2)); }
  .face.top    { transform: rotateX(90deg) translateZ(calc(var(--cube-size)/2)); }
  .face.bottom { transform: rotateX(-90deg) translateZ(calc(var(--cube-size)/2)); }

  /* --- BOTTOM CONTROLS (Dock) --- */
  .dock {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 100;
    padding: 10px 16px;
    background: var(--bg-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  /* Tactile Button Base */
  .btn {
    background: linear-gradient(180deg, #2a2a2e 0%, #1a1a1c 100%);
    border: 1px solid rgba(255,255,255,0.1);
    border-top: 1px solid rgba(255,255,255,0.15);
    border-bottom: 1px solid rgba(0,0,0,0.5);
    color: var(--text-secondary);
    height: 48px;
    min-width: 48px;
    padding: 0 16px;
    border-radius: 14px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 
      0 4px 6px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.1); /* Top highlight */
    position: relative;
    overflow: hidden;
  }

  /* Hover State */
  .btn:hover {
    background: linear-gradient(180deg, #323236 0%, #222225 100%);
    color: var(--text-primary);
    transform: translateY(-1px);
    box-shadow: 0 6px 12px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
  }

  /* Active/Press State */
  .btn:active { 
    transform: translateY(2px); 
    box-shadow: 
      inset 0 2px 4px rgba(0,0,0,0.6),
      0 1px 2px rgba(0,0,0,0.2);
    border-top: 1px solid rgba(255,255,255,0.05);
  }

  /* Primary Action: Scramble */
  .btn-primary {
    background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
    color: white;
    border: 1px solid rgba(255,255,255,0.2);
    border-bottom: 1px solid #92400e;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    box-shadow: 
      0 4px 15px rgba(245, 158, 11, 0.25),
      inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .btn-primary:hover {
    background: linear-gradient(180deg, #fbbf24 0%, #f59e0b 100%);
    box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4), inset 0 1px 0 rgba(255,255,255,0.3);
    color: white;
  }
  .btn-primary:active {
    background: linear-gradient(180deg, #d97706 0%, #b45309 100%);
  }

  .btn-icon { width: 18px; height: 18px; stroke-width: 2.5; }

  /* --- BOTTOM LEFT: SCRAMBLE LOG & HELP --- */
  .info-panel {
    position: absolute;
    bottom: 30px;
    left: 30px;
    width: 260px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 90;
  }

  /* Scramble Log Card */
  .log-card {
    background: rgba(20, 20, 22, 0.85);
    backdrop-filter: blur(12px);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .panel-title {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .panel-title::before {
    content: '';
    display: block;
    width: 6px; height: 6px;
    background: var(--accent-primary);
    border-radius: 50%;
    box-shadow: 0 0 5px var(--accent-primary);
  }
  
  .scramble-code {
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
    color: var(--text-primary);
    line-height: 1.4;
    word-break: break-all;
    min-height: 1.5em;
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  /* Collapsible Help Section */
  .help-section {
    background: rgba(20, 20, 22, 0.6);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.05);
    overflow: hidden;
    transition: max-height 0.3s ease;
  }
  
  .help-header {
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 0.75rem;
    font-weight: 600;
  }
  .help-header:hover { color: var(--text-primary); background: rgba(255,255,255,0.02); }
  
  .help-content {
    padding: 0 14px 12px 14px;
    font-size: 0.8rem;
    color: #a1a1aa;
    line-height: 1.4;
    display: none; /* Hidden by default */
  }
  .help-section.open .help-content { display: block; }
  .help-section.open .help-chevron { transform: rotate(180deg); }
  .help-chevron { transition: transform 0.2s; }

  /* --- MOBILE ADAPTATION --- */
  @media (max-width: 850px) {
    :root { --cube-size: 220px; }
    
    header { height: auto; top: 10px; }
    .top-bar { width: 92%; justify-content: space-between; padding: 6px 12px; }
    .stats { gap: 16px; }
    .stat-label { font-size: 0.5rem; }
    .stat-val { font-size: 1rem; }
    
    .dock {
      width: 92%;
      justify-content: space-between;
      bottom: 20px;
      padding: 6px 8px;
    }
    .btn { padding: 0 10px; height: 44px; }
    .btn span { display: none; } /* Hide text on mobile */
    .btn-icon { width: 20px; height: 20px; }
    
    .info-panel {
      display: none; /* Hide on mobile to save space */
    }
  }
</style>
</head>
<body>

<div class="bg-grid"></div>

<!-- TOP BAR -->
<header>
  <div class="top-bar">
    <div class="stats">
      <div class="stat">
        <span class="stat-label">Moves</span>
        <span class="stat-val" id="move-count">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Time</span>
        <span class="stat-val timer" id="timer">00:00</span>
      </div>
    </div>

    <!-- Segmented Control -->
    <div class="size-selector">
      <button class="size-btn" onclick="setCubeSize(2)">2x2</button>
      <button class="size-btn active" onclick="setCubeSize(3)">3x3</button>
      <button class="size-btn" onclick="setCubeSize(4)">4x4</button>
      <button class="size-btn" onclick="setCubeSize(5)">5x5</button>
    </div>
  </div>
</header>

<!-- STAGE -->
<div class="stage" id="stage-area">
  <div class="shadow"></div>
  <div class="cube-container" id="scene">
    <div class="cube" id="cube">
      <!-- Generated by JS -->
    </div>
  </div>
</div>

<!-- BOTTOM INFO PANEL (Left) -->
<div class="info-panel">
  <!-- Scramble Log -->
  <div class="log-card">
    <div class="panel-header">
      <span class="panel-title">Scramble Log</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="opacity:0.5"><path d="M12 5v14M5 12h14"/></svg>
    </div>
    <div class="scramble-code" id="scramble-display">
      Press Scramble to start
    </div>
  </div>

  <!-- Collapsible Help -->
  <div class="help-section" id="help-panel">
    <div class="help-header" onclick="toggleHelp()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
      <span>Pro Tips</span>
      <svg class="help-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left:auto"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="help-content">
      Drag to rotate the view. Use Scramble to randomize. The timer starts automatically.
    </div>
  </div>
</div>

<!-- BOTTOM DOCK (Center) -->
<div class="dock">
  <button class="btn" onclick="undoMove()" title="Undo">
    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
    <span>Undo</span>
  </button>
  <button class="btn" onclick="resetCube()" title="Reset">
    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L21 10"/></svg>
    <span>Reset</span>
  </button>
  <!-- Hint Button Added -->
  <button class="btn" onclick="toggleHelp()" title="Hint">
    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
    <span>Hint</span>
  </button>
  <button class="btn btn-primary" onclick="scrambleCube()" title="Scramble">
    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
    <span>Scramble</span>
  </button>
</div>

<script>
  // --- CONFIGURATION ---
  const COLORS = {
    U: 'var(--c-white)', 
    D: 'var(--c-yellow)', 
    F: 'var(--c-green)', 
    B: 'var(--c-red)',   
    R: 'var(--c-orange)', 
    L: 'var(--c-blue)'   
  };
  
  // Face mapping: U(4), D(5), F(0), B(1), L(3), R(2)
  const FACE_INDICES = { U: 4, D: 5, F: 0, B: 1, L: 3, R: 2 };

  // --- STATE ---
  let moveHistory = [];
  let timerInterval;
  let seconds = 0;
  let isDragging = false;
  let startX, startY;
  let currentRotX = -25;
  let currentRotY = -35;
  let currentSize = 3;

  // --- DOM ELEMENTS ---
  const cubeEl = document.getElementById('cube');
  const sceneEl = document.getElementById('scene');
  const timerEl = document.getElementById('timer');
  const moveCountEl = document.getElementById('move-count');
  const scrambleDisplayEl = document.getElementById('scramble-display');
  const stageArea = document.getElementById('stage-area');

  // --- INITIALIZATION ---
  function init() {
    createCubeDOM(3);
    resetCube();
    // Auto-scramble on load
    setTimeout(scrambleCube, 500);
    setupInteraction();
  }

  // --- DOM GENERATION ---
  function createCubeDOM(size) {
    cubeEl.innerHTML = '';
    // Order: F, B, R, L, U, D
    const faceOrder = ['front', 'back', 'right', 'left', 'top', 'bottom'];
    
    faceOrder.forEach((faceName, index) => {
      const faceDiv = document.createElement('div');
      faceDiv.className = `face ${faceName}`;
      faceDiv.id = `face-${index}`;
      
      faceDiv.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
      faceDiv.style.gridTemplateRows = `repeat(${size}, 1fr)`;

      const totalStickers = size * size;
      for(let i=0; i<totalStickers; i++) {
        const sticker = document.createElement('div');
        sticker.className = 'sticker';
        sticker.dataset.index = i;
        faceDiv.appendChild(sticker);
      }
      cubeEl.appendChild(faceDiv);
    });
  }

  // --- LOGIC: STATE MANAGEMENT ---
  function resetCube() {
    stopTimer();
    seconds = 0;
    updateTimerDisplay();
    moveHistory = [];
    moveCountEl.innerText = '0';
    
    // Reset Colors
    const faces = ['F', 'B', 'R', 'L', 'U', 'D'];
    Array.from(cubeEl.children).forEach((face, i) => {
      const color = COLORS[faces[i]];
      Array.from(face.children).forEach(sticker => {
        sticker.style.backgroundColor = color;
      });
    });
    
    scrambleDisplayEl.innerHTML = "Ready to scramble";
    scrambleDisplayEl.style.color = "var(--text-secondary)";
  }

  function setCubeSize(size) {
    currentSize = size;
    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
    const btns = document.querySelectorAll('.size-btn');
    btns.forEach(b => { if(b.innerText.includes(size)) b.classList.add('active'); });
    
    createCubeDOM(size);
    resetCube();
    // Re-trigger scramble for the new size
    setTimeout(scrambleCube, 100);
  }

  // --- LOGIC: MOVES ---
  function applyMove(moveChar, visual = true) {
    if(!visual) return; 
    
    const faceName = moveChar.charAt(0);
    const faceIndex = FACE_INDICES[faceName];
    const faceEl = cubeEl.children[faceIndex];
    
    // Visual Rotation
    let dir = 1; 
    if(moveChar.includes("'")) dir = -1;
    if(moveChar.includes("2")) dir = 2;
    
    // Animate spin
    faceEl.style.transition = `transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)`;
    faceEl.style.transform = faceEl.style.transform + ` rotateZ(${dir * 90}deg)`;

    // Logic Swap after animation
    setTimeout(() => {
      swapStickers(moveChar);
      if(visual) {
        faceEl.style.transition = 'none';
        faceEl.style.transform = ''; // Reset visual rotation
      }
    }, visual ? 280 : 0);
  }

  function swapStickers(move) {
    const get = (faceIdx, stickerIdx) => cubeEl.children[faceIdx].children[stickerIdx].style.backgroundColor;
    const set = (faceIdx, stickerIdx, color) => cubeEl.children[faceIdx].children[stickerIdx].style.backgroundColor = color;

    // Internal Face Rotation (Clockwise)
    const rotateFace = (faceIdx) => {
      const side = currentSize;
      const temp = Array(side).fill(null).map(() => Array(side).fill(null));
      
      for(let r=0; r<side; r++) {
        for(let c=0; c<side; c++) {
          temp[c][side - 1 - r] = get(faceIdx, r * side + c);
        }
      }
      
      for(let r=0; r<side; r++) {
        for(let c=0; c<side; c++) {
          set(faceIdx, r * side + c, temp[r][c]);
        }
      }
    };

    const char = move.charAt(0);
    const side = currentSize;
    
    // 1. Rotate the face itself
    rotateFace(FACE_INDICES[char]);

    // 2. Swap adjacent strips (Simplified for Demo)
    const getStrip = (f, col, row) => {
      let arr = [];
      if(row !== null) for(let i=0; i<side; i++) arr.push(get(f, row * side + i));
      if(col !== null) for(let i=0; i<side; i++) arr.push(get(f, i * side + col));
      return arr;
    };

    const setStrip = (f, col, row, arr, reverse=false) => {
      const src = reverse ? [...arr].reverse() : arr;
      if(row !== null) for(let i=0; i<side; i++) set(f, row * side + i, src[i]);
      if(col !== null) for(let i=0; i<side; i++) set(f, i * side + col, src[i]);
    };

    // Logic for specific faces (Clockwise)
    if (char === 'F') { // Front
      rotateFace(0);
      const u = getStrip(4, null, side-1);
      const r = getStrip(2, 0, null);
      const d = getStrip(5, null, 0);
      const l = getStrip(3, side-1, null);
      
      setStrip(4, null, side-1, l.reverse()); 
      setStrip(2, 0, null, u);                
      setStrip(5, null, 0, r.reverse());      
      setStrip(3, side-1, null, d);           
    }
    else if (char === 'R') { // Right
      rotateFace(2);
      const u = getStrip(4, side-1, null);
      const b = getStrip(1, 0, null); 
      const d = getStrip(5, side-1, null);
      const f = getStrip(0, side-1, null);
      
      setStrip(4, side-1, null, b.reverse()); 
      setStrip(1, 0, null, d);                
      setStrip(5, side-1, null, f.reverse()); 
      setStrip(0, side-1, null, u);           
    }
    else if (char === 'U') { // Up
      rotateFace(4);
      const f = getStrip(0, null, 0);
      const r = getStrip(2, null, 0);
      const b = getStrip(1, null, side-1); 
      const l = getStrip(3, null, 0);
      
      setStrip(0, null, 0, l);
      setStrip(2, null, 0, f);
      setStrip(1, null, side-1, r);
      setStrip(3, null, 0, b);
    }
  }

  // --- SCRAMBLE ---
  function scrambleCube() {
    stopTimer();
    seconds = 0;
    updateTimerDisplay();
    moveCountEl.innerText = '0';
    moveHistory = [];
    
    const moves = ['F', 'B', 'U', 'D', 'L', 'R'];
    const modifiers = ['', "'", '2'];
    let scrambleString = "";
    
    // Generate 20 random moves
    for(let i=0; i<20; i++) {
      const m = moves[Math.floor(Math.random() * moves.length)];
      const mod = modifiers[Math.floor(Math.random() * modifiers.length)];
      scrambleString += (m + mod + " ");
    }
    
    scrambleDisplayEl.innerText = scrambleString;
    scrambleDisplayEl.style.color = "var(--text-primary)";
    
    // Visual Scramble Effect: Rapidly randomize colors
    let count = 0;
    const interval = setInterval(() => {
      randomizeColors();
      count++;
      if(count > 8) {
        clearInterval(interval);
        startTimer();
      }
    }, 80);
  }

  function randomizeColors() {
    const allStickers = document.querySelectorAll('.sticker');
    const colorKeys = Object.keys(COLORS);
    allStickers.forEach(s => {
      const randColor = COLORS[colorKeys[Math.floor(Math.random() * colorKeys.length)]];
      s.style.backgroundColor = randColor;
    });
  }

  // --- CONTROLS ---
  function startTimer() {
    stopTimer();
    seconds = 0;
    timerInterval = setInterval(() => {
      seconds++;
      updateTimerDisplay();
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
  }

  function updateTimerDisplay() {
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = (seconds % 60).toString().padStart(2, '0');
    timerEl.innerText = `${m}:${s}`;
  }

  function undoMove() {
    const btn = document.querySelector('button[onclick="undoMove()"]');
    btn.style.transform = "scale(0.95)";
    setTimeout(() => btn.style.transform = "", 100);
  }

  function toggleHelp() {
    const panel = document.getElementById('help-panel');
    panel.classList.toggle('open');
  }

  // --- INTERACTION (3D ROTATION) ---
  function setupInteraction() {
    stageArea.addEventListener('mousedown', (e) => {
      if(e.target.closest('.btn') || e.target.closest('.size-btn') || e.target.closest('.info-panel')) return;
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - startX;
      const deltaY = e.clientY - startY;
      
      currentRotY += deltaX * 0.5;
      currentRotX -= deltaY * 0.5;
      
      currentRotX = Math.max(-80, Math.min(80, currentRotX));

      sceneEl.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
      
      startX = e.clientX;
      startY = e.clientY;
    });

    document.addEventListener('mouseup', () => isDragging = false);
    
    // Touch support
    stageArea.addEventListener('touchstart', (e) => {
      if(e.target.closest('.btn') || e.target.closest('.size-btn')) return;
      isDragging = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    });
    
    document.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const deltaX = e.touches[0].clientX - startX;
      const deltaY = e.touches[0].clientY - startY;
      
      currentRotY += deltaX * 0.5;
      currentRotX -= deltaY * 0.5;
      currentRotX = Math.max(-80, Math.min(80, currentRotX));

      sceneEl.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
      
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    });
    
    document.addEventListener('touchend', () => isDragging = false);
  }

  // Start
  init();

</script>
</body>
