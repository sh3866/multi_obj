<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMONO — Asanoha Collection</title>
    <style>
        :root {
            /* Palette: 'Sumi' (Ink) & 'Ochre' */
            --bg-color: #EBE6DF; /* Washi Paper tone */
            --kimono-base: #1C2E35; /* Deep Teal/Ink */
            --kimono-shadow: #0F1A1E;
            --obi-base: #D4AF37; /* Muted Gold */
            --obi-shadow: #8A7018;
            --obi-accent: #2C2C2C; /* Dark contrast for obi */
            --pattern-color: #2A4049;
            --text-color: #2C2C2C;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            font-family: "Times New Roman", "Georgia", serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: var(--text-color);
            transition: background-color 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Subtle Grain Texture */
        .texture {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.4;
            z-index: 5;
            mix-blend-mode: multiply;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Layout */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Typography */
        .typography {
            position: absolute;
            top: 6vh;
            left: 6vw;
            z-index: 10;
            pointer-events: none;
        }

        h1 {
            font-size: 5rem;
            font-weight: 400;
            line-height: 0.9;
            letter-spacing: -0.04em;
            margin-bottom: 0.5rem;
            color: var(--kimono-base);
            mix-blend-mode: exclusion; /* Artistic blend */
        }

        .subtitle {
            font-family: "Helvetica Neue", sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--kimono-base);
            border-top: 1px solid var(--kimono-base);
            padding-top: 0.5rem;
            display: inline-block;
            opacity: 0.8;
        }

        .controls {
            position: absolute;
            bottom: 5vh;
            right: 5vw;
            display: flex;
            gap: 1rem;
            z-index: 10;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--kimono-base);
            padding: 0.8rem 1.8rem;
            font-family: "Helvetica Neue", sans-serif;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            cursor: pointer;
            transition: all 0.4s ease;
            color: var(--kimono-base);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 0%; height: 100%;
            background: var(--kimono-base);
            transition: width 0.3s ease;
            z-index: -1;
        }

        .btn:hover {
            color: var(--bg-color);
        }
        
        .btn:hover::before {
            width: 100%;
        }

        /* SVG Container */
        #kimono-svg {
            height: 92vh;
            width: auto;
            /* Soft realistic shadow */
            filter: drop-shadow(0 30px 50px rgba(0,0,0,0.25));
            transition: transform 0.2s ease-out;
            will-change: transform;
        }

        /* SVG Styles */
        .fabric-fill { fill: var(--kimono-base); transition: fill 0.6s ease; }
        .fabric-dark { fill: var(--kimono-shadow); transition: fill 0.6s ease; }
        .pattern-fill { fill: var(--pattern-color); transition: fill 0.6s ease; }
        
        /* Animations */
        @keyframes breathe {
            0% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.005) translateY(-5px); }
            100% { transform: scale(1) translateY(0); }
        }

        .anim-group {
            animation: breathe 8s infinite ease-in-out;
            transform-origin: 50% 10%;
        }

    </style>
</head>
<body>

    <div class="texture"></div>

    <div class="typography">
        <h1>KIMONO</h1>
        <span class="subtitle">Asanoha • Hemp Leaf Motif</span>
    </div>

    <main>
        <div class="stage">
            <!-- Wider ViewBox to accommodate T-Sleeves -->
            <svg id="kimono-svg" viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg" class="anim-group">
                <defs>
                    <!-- 1. Main Fabric Gradient (Soft drape) -->
                    <linearGradient id="fabric-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="var(--kimono-shadow)" />
                        <stop offset="20%" stop-color="var(--kimono-base)" />
                        <stop offset="80%" stop-color="var(--kimono-base)" />
                        <stop offset="100%" stop-color="var(--kimono-shadow)" />
                    </linearGradient>

                    <!-- 2. Obi Gradient (Rich Gold) -->
                    <linearGradient id="obi-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#F2D06B" />
                        <stop offset="40%" stop-color="var(--obi-base)" />
                        <stop offset="100%" stop-color="var(--obi-shadow)" />
                    </linearGradient>

                    <!-- 3. Asanoha (Hemp Leaf) Pattern -->
                    <!-- A geometric tiling representing hemp leaves, symbolizing healthy growth -->
                    <pattern id="asanoha-pattern" x="0" y="0" width="60" height="104" patternUnits="userSpaceOnUse" patternTransform="scale(0.8)">
                        <path d="M30,0 L60,52 L30,104 L0,52 Z" fill="none" stroke="var(--pattern-color)" stroke-width="2" opacity="0.3"/>
                        <path d="M30,10 L55,52 L30,94 L5,52 Z" fill="var(--pattern-color)" opacity="0.15"/>
                        <path d="M30,20 L50,52 L30,84 L10,52 Z" fill="none" stroke="var(--pattern-color)" stroke-width="1" opacity="0.4"/>
                        <!-- Interlocking secondary shapes -->
                        <path d="M0,52 L30,0 L60,52 L30,104" fill="none" stroke="var(--pattern-color)" stroke-width="0.5" opacity="0.2"/>
                    </pattern>

                    <!-- 4. Fabric Shadow Filter (Inner Glow) -->
                    <filter id="fold-shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
                        <feOffset dx="0" dy="10" result="offsetBlur"/>
                        <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
                    </filter>
                </defs>

                <g id="kimono-structure">
                    
                    <!-- LEFT SLEEVE (T-Suzure) -->
                    <!-- Wide, rectangular, organic drape -->
                    <path class="fabric-fill" fill="url(#fabric-grad)" d="
                        M 280,200 
                        C 250,180 180,180 150,180 
                        L 100,180 
                        L 100,350 
                        C 100,380 150,380 160,360 
                        L 220,280 
                        C 240,250 260,240 280,220 
                        Z" />
                    <!-- Left Sleeve Pattern -->
                    <path class="pattern-fill" fill="url(#asanoha-pattern)" d="M 280,200 C 250,180 180,180 150,180 L 100,180 L 100,350 C 100,380 150,380 160,360 L 220,280 C 240,250 260,240 280,220 Z" opacity="0.6" style="mix-blend-mode: overlay;" />

                    <!-- RIGHT SLEEVE (T-Suzure) -->
                    <path class="fabric-fill" fill="url(#fabric-grad)" d="
                        M 520,200 
                        C 550,180 620,180 650,180 
                        L 700,180 
                        L 700,350 
                        C 700,380 650,380 640,360 
                        L 580,280 
                        C 560,250 540,240 520,220 
                        Z" />
                    <!-- Right Sleeve Pattern -->
                    <path class="pattern-fill" fill="url(#asanoha-pattern)" d="M 520,200 C 550,180 620,180 650,180 L 700,180 L 700,350 C 700,380 650,380 640,360 L 580,280 C 560,250 540,240 520,220 Z" opacity="0.6" style="mix-blend-mode: overlay;" />

                    <!-- MAIN BODY -->
                    <!-- Wider silhouette, tapered at hem -->
                    <path class="fabric-fill" fill="url(#fabric-grad)" d="
                        M 280,150 
                        C 300,120 500,120 520,150 
                        L 540,850 
                        C 540,880 260,880 260,850 
                        Z" />
                    
                    <!-- Body Pattern Overlay -->
                    <path class="pattern-fill" fill="url(#asanoha-pattern)" d="M 280,150 C 300,120 500,120 520,150 L 540,850 C 540,880 260,880 260,850 Z" opacity="0.6" style="mix-blend-mode: overlay;" />

                    <!-- DRAPING & FOLDS -->
                    <!-- Center Shadow (creates the V-neck illusion) -->
                    <path fill="var(--kimono-shadow)" opacity="0.6" d="
                        M 380,150 
                        L 400,120 
                        L 420,150 
                        L 420,860 
                        L 380,860 
                        Z" />

                    <!-- Collar (Eri) - Left (Under) -->
                    <path fill="var(--kimono-shadow)" d="
                        M 380,150 
                        L 280,150 
                        L 270,860 
                        L 380,860 
                        Z" />
                    
                    <!-- Collar (Eri) - Right (Over) - The defining V-shape -->
                    <path fill="var(--kimono-base)" d="
                        M 380,150 
                        L 520,150 
                        L 530,860 
                        L 380,860 
                        Z" />
                    
                    <!-- Collar Edge Highlight -->
                    <path stroke="#ffffff" stroke-width="1" opacity="0.1" fill="none" d="M 380,150 L 520,150 L 530,860" />
                    <path stroke="#ffffff" stroke-width="1" opacity="0.1" fill="none" d="M 380,150 L 280,150 L 270,860" />

                    <!-- Vertical Drape Lines (Sutae) -->
                    <path stroke="var(--kimono-shadow)" stroke-width="3" opacity="0.3" fill="none" d="M 380,500 Q 370,650 380,860" />
                    <path stroke="var(--kimono-shadow)" stroke-width="3" opacity="0.3" fill="none" d="M 420,500 Q 430,650 420,860" />

                    <!-- OBI (Sash) - Taiko Musubi Knot -->
                    <g id="obi-group" transform="translate(0, 480)">
                        
                        <!-- Obi Wrap (Back & Front) -->
                        <path fill="url(#obi-grad)" d="
                            M 260,0 
                            C 350,30 450,30 540,0 
                            L 545,100 
                            C 450,130 350,130 255,100 
                            Z" />
                        
                        <!-- Obi Pattern (Gold on Gold) -->
                        <path fill="url(#asanoha-pattern)" d="M 260,0 C 350,30 450,30 540,0 L 545,100 C 450,130 350,130 255,100 Z" opacity="0.5" style="mix-blend-mode: color-burn;" />

                        <!-- TAIKO MUSUBI (Drum Knot) -->
                        <!-- Back Shadow -->
                        <ellipse cx="400" cy="50" rx="70" ry="80" fill="rgba(0,0,0,0.2)" filter="blur(10px)"/>

                        <!-- The Drum Body -->
                        <path fill="url(#obi-grad)" d="
                            M 330,0 
                            C 320,50 320,80 330,100 
                            L 470,100 
                            C 480,80 480,50 470,0 
                            C 440,-20 360,-20 330,0 Z" 
                            stroke="var(--obi-shadow)" stroke-width="2"/>

                        <!-- Knot Details (Folds) -->
                        <path stroke="var(--obi-shadow)" stroke-width="2" fill="none" opacity="0.5" d="M 330,20 Q 400,30 470,20" />
                        <path stroke="var(--obi-shadow)" stroke-width="2" fill="none" opacity="0.5" d="M 325,50 Q 400,60 475,50" />
                        <path stroke="var(--obi-shadow)" stroke-width="2" fill="none" opacity="0.5" d="M 330,80 Q 400,90 470,80" />
                        
                        <!-- Obi Age (The scarf tucked inside) -->
                        <path fill="var(--kimono-shadow)" d="M 340,0 L 350,-20 L 380,-20 L 390,0 Z" />
                        <path fill="var(--kimono-shadow)" d="M 460,0 L 450,-20 L 420,-20 L 410,0 Z" />

                        <!-- Nodosashi (Cords hanging down) -->
                        <path fill="var(--obi-accent)" d="M 360,100 L 360,180 L 365,180 L 365,100 Z" />
                        <path fill="var(--obi-accent)" d="M 440,100 L 440,180 L 445,180 L 445,100 Z" />
                        
                    </g>

                </g>
            </svg>
        </div>
    </main>

    <div class="controls">
        <button class="btn" onclick="togglePalette()">Invert Palette</button>
        <button class="btn" onclick="togglePattern()">Toggle Pattern</button>
    </div>

    <script>
        const svg = document.getElementById('kimono-svg');
        const patternPaths = document.querySelectorAll('.pattern-fill');
        let isDark = false;
        let showPattern = true;

        // Subtle Parallax Effect
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 60;
            const y = (window.innerHeight / 2 - e.pageY) / 60;
            // Apply transform to the group inside SVG for smoother rendering
            svg.style.transform = `translate(${x}px, ${y}px)`;
        });

        function togglePalette() {
            const root = document.documentElement;
            isDark = !isDark;
            
            if (isDark) {
                // Dark Mode: Cream Kimono, Deep Indigo Obi
                root.style.setProperty('--bg-color', '#1a1a1a');
                root.style.setProperty('--kimono-base', '#E8E4D9'); // Cream/Ivory
                root.style.setProperty('--kimono-shadow', '#C4BEB0');
                root.style.setProperty('--obi-base', '#1C2E35'); // Deep Indigo
                root.style.setProperty('--obi-shadow', '#0F1A1E');
                root.style.setProperty('--obi-accent', '#D4AF37'); // Gold accent
                root.style.setProperty('--pattern-color', '#D0CCC0'); // Subtle cream pattern
                root.style.setProperty('--text-color', '#EBE6DF');
            } else {
                // Light Mode: Ink Kimono, Gold Obi
                root.style.setProperty('--bg-color', '#EBE6DF');
                root.style.setProperty('--kimono-base', '#1C2E35');
                root.style.setProperty('--kimono-shadow', '#0F1A1E');
                root.style.setProperty('--obi-base', '#D4AF37');
                root.style.setProperty('--obi-shadow', '#8A7018');
                root.style.setProperty('--obi-accent', '#2C2C2C');
                root.style.setProperty('--pattern-color', '#2A4049');
                root.style.setProperty('--text-color', '#2C2C2C');
            }
        }

        function togglePattern() {
            showPattern = !showPattern;
            const opacity = showPattern ? '0.6' : '0';
            patternPaths.forEach(path => {
                path.style.opacity = opacity;
            });
        }
    </script>
</body>
</html>
