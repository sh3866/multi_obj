<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMONO — Asanoha Collection</title>
    <style>
        :root {
            /* Palette: 'Sumi' (Ink) & 'Kin' (Gold) */
            --bg-color: #EAE6DA; /* Warm Washi */
            --kimono-base: #1A1D23; /* Deep Ink */
            --kimono-shadow: #0D0F12;
            --kimono-highlight: #2C313A;
            --obi-base: #D4AF37; /* Muted Gold */
            --obi-shadow: #8A6E18;
            --obi-highlight: #F2D06B;
            --obi-jime: #8B0000; /* Vermilion Cord */
            --pattern-fill: #2C333D;
            --pattern-stroke: #4A5466; /* Visible Gold/Blue Outline */
            --text-color: #1A1D23;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            font-family: "Times New Roman", "Georgia", serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: var(--text-color);
            transition: background-color 0.8s ease;
        }

        /* Texture: Reduced opacity to stop competing */
        .texture {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.15; /* Reduced from 0.5 */
            z-index: 5;
            mix-blend-mode: multiply;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Layout */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        /* Typography */
        .typography {
            position: absolute;
            top: 6vh;
            left: 6vw;
            z-index: 10;
            pointer-events: none;
        }

        h1 {
            font-size: 5rem;
            font-weight: 400;
            line-height: 0.9;
            letter-spacing: -0.03em;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            color: var(--text-color);
            transition: color 0.8s ease;
        }

        .subtitle {
            font-family: "Helvetica Neue", "Arial", sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0.8;
            color: var(--text-color);
            transition: color 0.8s ease;
        }
        
        .subtitle::before {
            content: '';
            display: block;
            width: 40px;
            height: 1px;
            background: currentColor;
        }

        .controls {
            position: absolute;
            bottom: 5vh;
            right: 5vw;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            z-index: 10;
            text-align: right;
        }

        .label {
            font-family: "Helvetica Neue", sans-serif;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.6;
            margin-bottom: -0.5rem;
            color: var(--text-color);
        }

        .btn {
            background: transparent;
            border: 1px solid var(--text-color);
            padding: 0.7rem 1.8rem;
            font-family: "Helvetica Neue", sans-serif;
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-color);
            align-self: flex-end;
        }

        .btn:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        /* SVG Container */
        #kimono-svg {
            height: 92vh;
            width: auto;
            /* Stronger shadow for depth */
            filter: drop-shadow(0 30px 60px rgba(0,0,0,0.25));
            transition: transform 0.1s linear;
            will-change: transform;
        }

        /* SVG Classes */
        .fabric-fill { fill: var(--kimono-base); transition: fill 0.6s ease; }
        .fabric-dark { fill: var(--kimono-shadow); transition: fill 0.6s ease; }
        
        .pattern-fill { fill: var(--pattern-fill); transition: fill 0.6s ease; }
        .pattern-stroke { stroke: var(--pattern-stroke); transition: stroke 0.6s ease; }

        .obi-fill { fill: var(--obi-base); transition: fill 0.6s ease; }
        .obi-dark { fill: var(--obi-shadow); transition: fill 0.6s ease; }
        .obi-light { fill: var(--obi-highlight); transition: fill 0.6s ease; }
        .obi-jime-fill { fill: var(--obi-jime); transition: fill 0.6s ease; }

    </style>
</head>
<body>

    <div class="texture"></div>

    <div class="typography">
        <h1>Kimono</h1>
        <span class="subtitle">Asanoha • Traditional Hemp Motif</span>
    </div>

    <main>
        <div class="stage">
            <!-- ViewBox adjusted for vertical balance -->
            <svg id="kimono-svg" viewBox="0 0 800 950" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- 1. Main Fabric Gradient (Vertical for gravity) -->
                    <linearGradient id="fabric-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="var(--kimono-highlight)" /> <!-- Shoulders -->
                        <stop offset="40%" stop-color="var(--kimono-base)" />
                        <stop offset="100%" stop-color="var(--kimono-shadow)" /> <!-- Hem -->
                    </linearGradient>
                    
                    <!-- 2. Collar Gradient (Depth at neck) -->
                    <linearGradient id="collar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="var(--kimono-shadow)" />
                        <stop offset="100%" stop-color="var(--kimono-base)" />
                    </linearGradient>

                    <!-- 3. Obi Gradient (Silk sheen) -->
                    <linearGradient id="obi-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="var(--obi-highlight)" />
                        <stop offset="50%" stop-color="var(--obi-base)" />
                        <stop offset="100%" stop-color="var(--obi-shadow)" />
                    </linearGradient>

                    <!-- 4. Knot Gradient (3D volume) -->
                    <radialGradient id="knot-grad" cx="50%" cy="30%" r="70%">
                        <stop offset="0%" stop-color="var(--obi-highlight)" />
                        <stop offset="60%" stop-color="var(--obi-base)" />
                        <stop offset="100%" stop-color="var(--obi-shadow)" />
                    </radialGradient>

                    <!-- 5. Asanoha (Hemp Leaf) Pattern -->
                    <!-- Refined with gold/lighter stroke for contrast -->
                    <pattern id="asanoha-pattern" x="0" y="0" width="60" height="103.923" patternUnits="userSpaceOnUse" patternTransform="scale(0.9)">
                        <!-- Background Hex Outline -->
                        <path d="M30,0 L60,17.32 L60,51.96 L30,69.28 L0,51.96 L0,17.32 Z" fill="none" stroke="var(--pattern-stroke)" stroke-width="1.5" opacity="0.6"/>
                        <!-- Inner Diamond (The "Leaf") -->
                        <path d="M30,12 L46,21 L46,42 L30,51 L14,42 L14,21 Z" fill="var(--pattern-fill)" opacity="0.8" />
                        <!-- Connecting lines to center -->
                        <path d="M30,12 L30,51 M14,21 L46,42 M46,21 L14,42" stroke="var(--pattern-stroke)" stroke-width="1" opacity="0.6"/>
                        
                        <!-- Secondary Row Offset Logic handled by Pattern Tiling -->
                        <path d="M0,51.96 L30,69.28 L60,51.96" fill="none" stroke="var(--pattern-stroke)" stroke-width="1.5" opacity="0.6"/>
                    </pattern>
                </defs>

                <g id="kimono-structure">
                    
                    <!-- === BODY (T-SHAPED BASE) === -->
                    <!-- Curved hem and shoulders for natural drape -->
                    <path class="fabric-fill" fill="url(#fabric-grad)" d="
                        M 320,160 
                        Q 400,170 480,160 
                        L 520,880 
                        C 520,900 280,900 280,880 
                        Z" />
                    
                    <!-- Body Pattern Overlay -->
                    <path fill="url(#asanoha-pattern)" d="M 320,160 Q 400,170 480,160 L 520,880 C 520,900 280,900 280,880 Z" opacity="0.9" />

                    <!-- === SLEEVES (T-SUZURE) === -->
                    <!-- Left Sleeve: Connected to shoulder line, curved bottom (Furisode style) -->
                    <path class="fabric-fill" fill="url(#fabric-grad)" d="
                        M 320,160 
                        Q 250,170 180,190 
                        L 150,420 
                        C 145,440 165,445 185,430 
                        L 280,320 
                        Z" />
                    <path fill="url(#asanoha-pattern)" d="M 320,160 Q 250,170 180,190 L 150,420 C 145,440 165,445 185,430 L 280,320 Z" opacity="0.9" />

                    <!-- Right Sleeve -->
                    <path class="fabric-fill" fill="url(#fabric-grad)" d="
                        M 480,160 
                        Q 550,170 620,190 
                        L 650,420 
                        C 655,440 635,445 615,430 
                        L 520,320 
                        Z" />
                    <path fill="url(#asanoha-pattern)" d="M 480,160 Q 550,170 620,190 L 650,420 C 655,440 635,445 615,430 L 520,320 Z" opacity="0.9" />

                    <!-- === COLLAR (ERI) === -->
                    <!-- The V-Neck construction: Left side overlaps Right side (Left over Right) -->
                    
                    <!-- Right Collar (Underneath) -->
                    <path class="fabric-fill" fill="var(--kimono-shadow)" d="
                        M 400,165 
                        L 480,160 
                        L 480,230 
                        L 400,230 
                        Z" />

                    <!-- Left Collar (Overlapping - The defining V) -->
                    <!-- Starts at right shoulder, crosses center, goes to left shoulder -->
                    <path class="fabric-fill" fill="url(#collar-grad)" d="
                        M 480,160 
                        L 400,230 
                        L 320,160 
                        L 320,175 
                        L 400,245 
                        L 480,175 
                        Z" />

                    <!-- Collar Edge (Suri Komon style border) -->
                    <path stroke="#ffffff" stroke-width="1" opacity="0.2" fill="none" d="M 480,160 L 400,230 L 320,160" />

                    <!-- === FOLDS & DRAPING (Volume) === -->
                    <!-- Vertical shadows to simulate gravity and fabric weight -->
                    <!-- Center Shadow (The "Hikigawari" split area) -->
                    <path fill="var(--kimono-shadow)" opacity="0.5" d="M 400,240 L 400,880 L 385,880 L 385,240 Z" /> 
                    
                    <!-- Side Shadow (Left) -->
                    <path fill="var(--kimono-shadow)" opacity="0.3" d="M 320,160 L 320,880 L 340,880 L 340,160 Z" />
                    
                    <!-- Side Shadow (Right) -->
                    <path fill="var(--kimono-shadow)" opacity="0.3" d="M 480,160 L 480,880 L 460,880 L 460,160 Z" />

                    <!-- Sleeve Folds -->
                    <path stroke="var(--kimono-shadow)" stroke-width="2" opacity="0.4" fill="none" d="M 280,320 Q 240,350 200,380" />
                    <path stroke="var(--kimono-shadow)" stroke-width="2" opacity="0.4" fill="none" d="M 520,320 Q 560,350 600,380" />

                    <!-- === OBI (SASH) === -->
                    <!-- Positioned at waist, high contrast -->
                    <g id="obi-group" transform="translate(0, 560)">
                        
                        <!-- The Wrap (Front) - Curved for body shape -->
                        <path class="obi-fill" fill="url(#obi-grad)" d="
                            M 280,0 
                            C 350,35 450,35 520,0 
                            L 525,130 
                            C 450,160 350,160 275,130 
                            Z" />
                        
                        <!-- Obi Pattern (Subtle geometric on gold) -->
                        <path fill="url(#asanoha-pattern)" d="M 280,0 C 350,35 450,35 520,0 L 525,130 C 450,160 350,160 275,130 Z" opacity="0.4" style="mix-blend-mode: multiply;" />

                        <!-- === TAIKO MUSUBI (DRUM KNOT) === -->
                        <!-- Centered on the back, visible from front as a block -->
                        <g id="obi-knot">
                            <!-- Shadow behind knot (creates depth) -->
                            <ellipse cx="400" cy="65" rx="90" ry="90" fill="rgba(0,0,0,0.4)" filter="blur(10px)"/>

                            <!-- The Drum Body -->
                            <path class="obi-fill" fill="url(#knot-grad)" d="
                                M 310,0 
                                C 300,65 300,100 310,130 
                                L 490,130 
                                C 500,100 500,65 490,0 
                                C 440,-25 360,-25 310,0 Z" 
                                stroke="var(--obi-shadow)" stroke-width="1"/>

                            <!-- Horizontal Folds on the Knot (Volume) -->
                            <path stroke="var(--obi-shadow)" stroke-width="1.5" fill="none" opacity="0.5" d="M 310,20 Q 400,35 490,20" />
                            <path stroke="var(--obi-shadow)" stroke-width="1.5" fill="none" opacity="0.5" d="M 305,50 Q 400,65 495,50" />
                            <path stroke="var(--obi-shadow)" stroke-width="1.5" fill="none" opacity="0.5" d="M 310,80 Q 400,95 490,80" />
                            
                            <!-- Obi Age (Scarf peeking out) -->
                            <path fill="var(--kimono-base)" d="M 330,0 L 340,-20 L 380,-20 L 390,0 Z" />
                            <path fill="var(--kimono-base)" d="M 470,0 L 460,-20 L 420,-20 L 410,0 Z" />
                        </g>

                        <!-- Obi Jime (The Cord) - Wrapped around the knot -->
                        <g class="obi-jime-fill">
                            <!-- Main loop -->
                            <rect x="305" y="45" width="190" height="12" rx="6" />
                            <!-- Knot of the cord -->
                            <circle cx="400" cy="51" r="10" />
                            <!-- Hanging tails -->
                            <path d="M 390,63 L 390,110 L 396,110 L 396,63 Z" />
                            <path d="M 410,63 L 410,110 L 416,110 L 416,63 Z" />
                        </g>

                    </g>

                </g>
            </svg>
        </div>
    </main>

    <div class="controls">
        <span class="label">Presentation</span>
        <button class="btn" onclick="togglePalette()">Invert Mode</button>
        <button class="btn" onclick="togglePattern()">Hide Pattern</button>
    </div>

    <script>
        const svg = document.getElementById('kimono-svg');
        const patternPaths = document.querySelectorAll('path[fill*="asanoha"]');
        let isDark = false;
        let showPattern = true;

        // Refined Parallax Effect
        // Calculates distance from center to rotate the kimono slightly
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 80;
            const y = (window.innerHeight / 2 - e.pageY) / 80;
            // Subtle rotation and translation
            svg.style.transform = `translate(${x}px, ${y}px) rotate(${x * 0.05}deg)`;
        });

        function togglePalette() {
            const root = document.documentElement;
            isDark = !isDark;
            
            if (isDark) {
                // Dark Mode: Cream Kimono, Deep Indigo Obi
                root.style.setProperty('--bg-color', '#121212');
                root.style.setProperty('--kimono-base', '#E8E4D9'); // Cream/Ivory
                root.style.setProperty('--kimono-shadow', '#C4BEB0');
                root.style.setProperty('--kimono-highlight', '#F5F2EA');
                root.style.setProperty('--obi-base', '#1C2E35'); // Deep Indigo
                root.style.setProperty('--obi-shadow', '#0F1A1E');
                root.style.setProperty('--obi-highlight', '#2C4049');
                root.style.setProperty('--obi-jime', '#8B0000');
                root.style.setProperty('--pattern-fill', '#D0CCC0'); // Subtle cream pattern
                root.style.setProperty('--pattern-stroke', '#B8B3A5');
                root.style.setProperty('--text-color', '#F2F0E9');
            } else {
                // Light Mode: Ink Kimono, Gold Obi
                root.style.setProperty('--bg-color', '#EAE6DA');
                root.style.setProperty('--kimono-base', '#1A1D23');
                root.style.setProperty('--kimono-shadow', '#0D0F12');
                root.style.setProperty('--kimono-highlight', '#2C313A');
                root.style.setProperty('--obi-base', '#D4AF37');
                root.style.setProperty('--obi-shadow', '#8A6E18');
                root.style.setProperty('--obi-highlight', '#F2D06B');
                root.style.setProperty('--obi-jime', '#8B0000');
                root.style.setProperty('--pattern-fill', '#2C333D');
                root.style.setProperty('--pattern-stroke', '#4A5466');
                root.style.setProperty('--text-color', '#1A1D23');
            }
        }

        function togglePattern() {
            showPattern = !showPattern;
            const opacity = showPattern ? '0.9' : '0';
            patternPaths.forEach(path => {
                path.style.opacity = opacity;
            });
        }
    </script>
</body>
</html>
