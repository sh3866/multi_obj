<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Rickshaw Vector Showcase — Re-imagined</title>
<style>
  :root {
    --bg-dark: #1a1a1a;
    --bg-accent: #ff9800;
    --text-main: #f0f0f0;
    --text-muted: #a0a0a0;
    --glass-panel: rgba(20, 20, 20, 0.85);
    --glass-border: rgba(255, 255, 255, 0.15);
    
    /* Rickshaw Palette */
    --yellow-main: #FFC107;
    --yellow-light: #FFD54F;
    --yellow-dark: #FF8F00;
    --red-main: #D32F2F;
    --chrome-light: #ffffff;
    --chrome-mid: #cfd8dc;
    --chrome-dark: #90a4ae;
    --tire-black: #212121;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Background Atmosphere */
  .atmosphere {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: -1;
    background: radial-gradient(circle at 50% 30%, #4a4a4a 0%, #1a1a1a 70%);
  }
  
  .noise-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0.08;
    pointer-events: none;
    z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* Layout Grid */
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 1.2fr 1fr;
    grid-template-rows: auto 1fr auto;
    padding: 2rem;
    align-items: center;
    justify-items: center;
  }

  /* Header */
  header {
    grid-column: 1 / -1;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 1rem;
    border-bottom: 1px solid var(--glass-border);
    padding-bottom: 1rem;
  }

  h1 {
    font-size: 2.5rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    background: linear-gradient(90deg, #fff, #bbb);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .meta-header {
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    color: var(--text-muted);
    text-align: right;
    line-height: 1.4;
  }

  /* Dashboard UI (Specs) */
  .dashboard-panel {
    position: absolute;
    right: 5%;
    top: 50%;
    transform: translateY(-50%);
    width: 280px;
    background: var(--glass-panel);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    z-index: 10;
  }

  .dash-header {
    font-family: 'Courier New', monospace;
    color: var(--bg-accent);
    font-weight: bold;
    font-size: 0.9rem;
    margin-bottom: 1rem;
    text-transform: uppercase;
    border-bottom: 1px solid var(--glass-border);
    padding-bottom: 0.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .status-dot {
    width: 8px; height: 8px; background: #00e676; border-radius: 50%;
    box-shadow: 0 0 5px #00e676;
  }

  .spec-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 0.8rem;
    font-size: 0.85rem;
  }

  .spec-label { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .spec-val { font-weight: 600; color: #fff; }

  /* SVG Container */
  #rickshaw-stage {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1000px;
    position: relative;
  }

  #rickshaw-svg {
    width: 100%;
    max-width: 900px;
    height: auto;
    transition: transform 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    filter: drop-shadow(0px 15px 25px rgba(0,0,0,0.4));
  }

  /* Interactive Hotspots */
  .hotspot { cursor: pointer; }
  .hotspot-circle {
    fill: var(--bg-accent);
    stroke: #fff;
    stroke-width: 2;
    transition: all 0.3s ease;
  }
  .hotspot:hover .hotspot-circle {
    r: 10;
    fill: #fff;
    stroke: var(--bg-accent);
  }
  .hotspot-tooltip {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    fill: #fff;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  .hotspot:hover .hotspot-tooltip { opacity: 1; }

  /* Footer */
  footer {
    grid-column: 1 / -1;
    width: 100%;
    display: flex;
    justify-content: space-between;
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    color: #666;
    border-top: 1px solid var(--glass-border);
    padding-top: 1rem;
  }

</style>
</head>
<body>

<div class="atmosphere"></div>
<div class="noise-overlay"></div>

<main>
  <header>
    <div>
      <h1>Auto Rickshaw</h1>
      <div style="color: var(--bg-accent); font-weight: 700; font-size: 0.9rem; letter-spacing: 1px; margin-top: 5px;">THE URBAN TUK-TUK</div>
    </div>
    <div class="meta-header">
      ORIGIN: INDIA<br>
      CLASS: 3-WHEELER
    </div>
  </header>

  <!-- Integrated Dashboard Panel -->
  <div class="dashboard-panel">
    <div class="dash-header">
      <span>Vehicle Specs</span>
      <div class="status-dot"></div>
    </div>
    <div class="spec-row">
      <span class="spec-label">Engine</span>
      <span class="spec-val">125cc Single</span>
    </div>
    <div class="spec-row">
      <span class="spec-label">Transmission</span>
      <span class="spec-val">4-Speed Manual</span>
    </div>
    <div class="spec-row">
      <span class="spec-label">Payload</span>
      <span class="spec-val">4 Passengers</span>
    </div>
    <div class="spec-row">
      <span class="spec-label">Top Speed</span>
      <span class="spec-val">~60 km/h</span>
    </div>
    <div class="spec-row" style="margin-top: 1.5rem; border-top: 1px dashed #444; padding-top: 1rem;">
      <span class="spec-label">Paint Job</span>
      <span class="spec-val">Saffron / Chrome</span>
    </div>
  </div>

  <div id="rickshaw-stage">
    <!-- SVG DRAWING START -->
    <svg id="rickshaw-svg" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gradients for Depth -->
        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FFE082" /> <!-- Highlight -->
          <stop offset="40%" stop-color="#FFC107" /> <!-- Main Yellow -->
          <stop offset="100%" stop-color="#FF8F00" /> <!-- Shadow -->
        </linearGradient>

        <linearGradient id="bodySideGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#FFC107" />
          <stop offset="80%" stop-color="#FFA000" />
          <stop offset="100%" stop-color="#E65100" /> <!-- Deep Shadow -->
        </linearGradient>

        <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fff" />
          <stop offset="40%" stop-color="#eceff1" />
          <stop offset="100%" stop-color="#78909c" />
        </linearGradient>

        <linearGradient id="tireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#424242" />
          <stop offset="50%" stop-color="#212121" />
          <stop offset="100%" stop-color="#000" />
        </linearGradient>

        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#b3e5fc" stop-opacity="0.7" />
          <stop offset="50%" stop-color="#4fc3f7" stop-opacity="0.4" />
          <stop offset="100%" stop-color="#0288d1" stop-opacity="0.8" />
        </linearGradient>

        <linearGradient id="metalDark" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#546e7a" />
          <stop offset="100%" stop-color="#263238" />
        </linearGradient>

        <!-- Patterns -->
        <pattern id="stripePattern" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="10" height="20" fill="#D32F2F" />
          <rect x="10" width="10" height="20" fill="#212121" />
        </pattern>

        <!-- Filters -->
        <filter id="glow">
          <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- Ground Shadow -->
      <ellipse cx="400" cy="510" rx="280" ry="30" fill="rgba(0,0,0,0.6)" filter="blur(10px)"/>

      <!-- ================= REAR ASSEMBLY ================= -->
      <g id="rear-axle">
        <!-- Axle Bar -->
        <line x1="250" y1="460" x2="550" y2="460" stroke="#333" stroke-width="12" stroke-linecap="round"/>
        
        <!-- Rear Left Wheel (Visible) -->
        <g transform="translate(250, 460)">
          <!-- Tire -->
          <circle cx="0" cy="0" r="55" fill="url(#tireGrad)" />
          <!-- Rim -->
          <circle cx="0" cy="0" r="35" fill="url(#chromeGrad)" />
          <!-- Spokes -->
          <path d="M0,-35 L0,35 M-35,0 L35,0 M-25,-25 L25,25 M-25,25 L25,-25" stroke="#aaa" stroke-width="4"/>
          <!-- Hub -->
          <circle cx="0" cy="0" r="12" fill="#111" />
        </g>

        <!-- Rear Right Wheel (Partially Hidden) -->
        <g transform="translate(550, 460)">
          <circle cx="0" cy="0" r="55" fill="url(#tireGrad)" opacity="0.8" />
          <circle cx="0" cy="0" r="35" fill="url(#chromeGrad)" opacity="0.8" />
          <circle cx="0" cy="0" r="12" fill="#111" opacity="0.8" />
        </g>
      </g>

      <!-- ================= CABIN BODY ================= -->
      <g id="cabin">
        <!-- Floor Base -->
        <path d="M 230 460 L 570 460 L 620 500 L 180 500 Z" fill="#222"/>

        <!-- Back Wall -->
        <path d="M 230 240 L 570 240 L 570 460 L 230 460 Z" fill="url(#bodyGrad)"/>
        
        <!-- Back Window -->
        <path d="M 250 260 L 550 260 L 550 380 L 250 380 Z" fill="url(#glassGrad)" stroke="#333" stroke-width="3"/>
        <!-- Window Glare -->
        <path d="M 260 270 L 300 270 L 260 380 Z" fill="rgba(255,255,255,0.3)"/>

        <!-- Right Side Wall (3/4 View) -->
        <path d="M 570 240 L 620 280 L 620 500 L 570 460 Z" fill="url(#bodySideGrad)"/>
        
        <!-- Right Side Window -->
        <path d="M 575 255 L 615 285 L 615 430 L 575 400 Z" fill="url(#glassGrad)" stroke="#333" stroke-width="2"/>
        
        <!-- Door Panel (Lower) -->
        <path d="M 575 400 L 615 430 L 615 490 L 575 460 Z" fill="#D32F2F" stroke="#333" stroke-width="2"/>
        <!-- Decorative Stripe on Door -->
        <path d="M 575 420 L 615 450 L 615 460 L 575 430 Z" fill="url(#stripePattern)"/>

        <!-- Seat Backrest -->
        <path d="M 260 300 L 540 300 L 540 440 L 260 440 Z" fill="#333" stroke="#222" stroke-width="4"/>
        <!-- Seat Pattern -->
        <path d="M 270 310 L 530 310 L 530 430 L 270 430 Z" fill="url(#stripePattern)" opacity="0.6"/>
      </g>

      <!-- ================= FRONT ASSEMBLY ================= -->
      <g id="front-assembly">
        <!-- Engine Block -->
        <path d="M 360 420 L 440 420 L 420 500 L 380 500 Z" fill="#444" stroke="#222" stroke-width="2"/>
        <!-- Engine Fins -->
        <line x1="370" y1="440" x2="430" y2="440" stroke="#222" stroke-width="3"/>
        <line x1="368" y1="460" x2="432" y2="460" stroke="#222" stroke-width="3"/>
        <line x1="366" y1="480" x2="434" y2="480" stroke="#222" stroke-width="3"/>

        <!-- Fork -->
        <path d="M 400 480 L 400 530" stroke="#222" stroke-width="10" stroke-linecap="round"/>
        <path d="M 400 480 L 380 530 M 400 480 L 420 530" stroke="#222" stroke-width="8" stroke-linecap="round"/>

        <!-- Front Wheel -->
        <g transform="translate(400, 530)">
          <circle cx="0" cy="0" r="55" fill="url(#tireGrad)" />
          <circle cx="0" cy="0" r="35" fill="url(#chromeGrad)" />
          <!-- Spokes -->
          <path d="M0,-35 L0,35 M-35,0 L35,0 M-25,-25 L25,25 M-25,25 L25,-25" stroke="#aaa" stroke-width="4"/>
          <circle cx="0" cy="0" r="12" fill="#111" />
        </g>

        <!-- Front Mudguard -->
        <path d="M 350 530 A 55 55 0 0 1 450 530" fill="none" stroke="var(--yellow-main)" stroke-width="14" stroke-linecap="round"/>
        <path d="M 350 530 A 55 55 0 0 1 450 530" fill="none" stroke="#D32F2F" stroke-width="4" stroke-linecap="round"/>
      </g>

      <!-- ================= DRIVER AREA ================= -->
      <g id="driver-area">
        <!-- Handlebars -->
        <path d="M 360 400 Q 400 370 440 400" fill="none" stroke="#222" stroke-width="10" stroke-linecap="round"/>
        <path d="M 360 400 Q 400 370 440 400" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round" stroke-dasharray="3,3"/> <!-- Grip -->
        
        <!-- Right Mirror -->
        <path d="M 440 400 L 460 360" stroke="#222" stroke-width="4"/>
        <ellipse cx="465" cy="355" rx="8" ry="15" fill="#333" transform="rotate(20 465 355)"/>
        <ellipse cx="465" cy="355" rx="5" ry="12" fill="#81d4fa" transform="rotate(20 465 355)"/>

        <!-- Windshield Frame -->
        <path d="M 280 260 L 520 260 L 520 420 L 280 420 Z" fill="none" stroke="#111" stroke-width="8"/>
        <!-- Windshield Glass -->
        <path d="M 285 265 L 515 265 L 515 415 L 285 415 Z" fill="url(#glassGrad)"/>
        <!-- Glare -->
        <path d="M 290 270 L 350 270 L 290 350 Z" fill="rgba(255,255,255,0.4)"/>

        <!-- Headlamp -->
        <circle cx="400" cy="350" r="22" fill="url(#chromeGrad)" />
        <circle cx="400" cy="350" r="16" fill="#FFF" filter="url(#glow)"/>
        <circle cx="400" cy="350" r="10" fill="#FFF9C4" />
        
        <!-- Driver Silhouette (Simplified) -->
        <circle cx="400" cy="310" r="16" fill="#1a1a1a"/>
        <path d="M 385 330 L 415 330 L 420 400 L 380 400 Z" fill="#1a1a1a"/>
      </g>

      <!-- ================= ROOF ================= -->
      <g id="roof">
        <!-- Main Canopy (Curved for volume) -->
        <path d="M 220 240 L 580 240 L 630 280 L 220 280 Z" fill="url(#chromeGrad)" stroke="#222" stroke-width="2"/>
        <!-- Roof Trim -->
        <path d="M 220 240 L 580 240 L 585 245 L 225 245 Z" fill="#D32F2F"/>
        <!-- Roof Rack -->
        <path d="M 220 240 L 220 220 L 580 220 L 580 240" fill="none" stroke="#222" stroke-width="4"/>
        <line x1="270" y1="220" x2="270" y2="240" stroke="#222" stroke-width="3"/>
        <line x1="320" y1="220" x2="320" y2="240" stroke="#222" stroke-width="3"/>
        <line x1="370" y1="220" x2="370" y2="240" stroke="#222" stroke-width="3"/>
        <line x1="420" y1="220" x2="420" y2="240" stroke="#222" stroke-width="3"/>
        <line x1="470" y1="220" x2="470" y2="240" stroke="#222" stroke-width="3"/>
        <line x1="520" y1="220" x2="520" y2="240" stroke="#222" stroke-width="3"/>
      </g>

      <!-- ================= ORNAMENTS ================= -->
      <g id="ornaments">
        <!-- "GOD" Sticker -->
        <g transform="translate(590, 460) rotate(10)">
          <rect x="-12" y="-12" width="24" height="24" rx="3" fill="#FFEB3B" stroke="#F57F17" stroke-width="1.5"/>
          <text x="0" y="4" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="9" fill="#D32F2F">GOD</text>
        </g>
        
        <!-- Exhaust -->
        <path d="M 380 480 Q 340 520 290 520" fill="none" stroke="#555" stroke-width="5" stroke-linecap="round"/>
        
        <!-- Decorative Lights -->
        <circle cx="560" cy="260" r="5" fill="#FFF" stroke="#D32F2F" stroke-width="2"/>
        <circle cx="240" cy="260" r="5" fill="#FFF" stroke="#D32F2F" stroke-width="2"/>
      </g>

      <!-- ================= HOTSPOTS ================= -->
      <g class="hotspot" transform="translate(400, 350)">
        <circle class="hotspot-circle" r="5" />
        <text x="30" y="5" class="hotspot-tooltip">Halogen Headlamp</text>
      </g>
      <g class="hotspot" transform="translate(465, 355)">
        <circle class="hotspot-circle" r="5" />
        <text x="15" y="5" class="hotspot-tooltip">Side Mirror</text>
      </g>
      <g class="hotspot" transform="translate(400, 530)">
        <circle class="hotspot-circle" r="5" />
        <text x="15" y="5" class="hotspot-tooltip">Front Steering</text>
      </g>
      <g class="hotspot" transform="translate(590, 460)">
        <circle class="hotspot-circle" r="5" />
        <text x="-30" y="5" class="hotspot-tooltip" text-anchor="end">Cultural Decal</text>
      </g>

    </svg>
  </div>

  <footer>
    <div>
      Design System v4.0<br>
      Vector Craft
    </div>
    <div>
      INTERACTIVE SHOWCASE
    </div>
  </footer>
</main>

<script>
  // Subtle parallax effect
  const container = document.querySelector('main');
  const svg = document.getElementById('rickshaw-svg');
  const dashboard = document.querySelector('.dashboard-panel');

  let targetRotateX = 0;
  let targetRotateY = 0;
  let currentRotateX = 0;
  let currentRotateY = 0;

  container.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth) - 0.5;
    const y = (e.clientY / window.innerHeight) - 0.5;
    
    targetRotateY = x * 10; 
    targetRotateX = -y * 5; 
  });

  container.addEventListener('mouseleave', () => {
    targetRotateX = 0;
    targetRotateY = 0;
  });

  function animate() {
    currentRotateX += (targetRotateX - currentRotateX) * 0.05;
    currentRotateY += (targetRotateY - currentRotateY) * 0.05;

    svg.style.transform = `perspective(1200px) rotateX(${currentRotateX}deg) rotateY(${currentRotateY}deg)`;
    
    // Parallax for dashboard panel
    dashboard.style.transform = `translateY(-50%) translateX(${currentRotateY * 2}px)`;
    
    requestAnimationFrame(animate);
  }

  animate();
</script>

</body>
</html>
