<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Urban Tuk-Tuk — Vector Showcase</title>
<style>
  :root {
    --color-saffron: #FF9933;
    --color-saffron-dark: #E65100;
    --color-white: #FFFFFF;
    --color-green: #138808;
    --color-chrome-light: #FFFFFF;
    --color-chrome-mid: #B0BEC5;
    --color-chrome-dark: #546E7A;
    --color-black: #1A1A1A;
    --color-glass: rgba(255, 255, 255, 0.1);
    --font-main: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --font-mono: 'Courier New', Courier, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: #0f0c29;
    color: var(--color-white);
    font-family: var(--font-main);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* Background Atmosphere: Deep Urban Night */
  .atmosphere {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: -2;
    background: radial-gradient(circle at 20% 30%, #4a3b69, #1a1a2e 60%, #000000 100%);
  }

  /* Noise Texture for Street Vibe */
  .noise-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0.06;
    pointer-events: none;
    z-index: -1;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* Main Container */
  main {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr;
    position: relative;
    perspective: 1500px;
  }

  /* SVG Stage */
  #rickshaw-stage {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  #rickshaw-svg {
    width: 120%;
    height: auto;
    max-height: 90vh;
    overflow: visible;
    filter: drop-shadow(0px 30px 60px rgba(0,0,0,0.8));
    transition: transform 0.1s linear;
  }

  /* Floating Specs Placard - Redesigned */
  .specs-placard {
    position: absolute;
    bottom: 40px;
    right: 40px;
    width: 280px;
    background: rgba(20, 20, 30, 0.65);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    padding: 1.5rem;
    color: #eee;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    z-index: 10;
    transform-style: preserve-3d;
    transition: transform 0.1s linear;
  }

  /* Callout Lines for Placard */
  .callout-line {
    position: absolute;
    background: rgba(255,255,255,0.2);
    height: 1px;
    transform-origin: left center;
  }
  .specs-placard::before {
    content: '';
    position: absolute;
    left: -100px;
    top: 20px;
    width: 100px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,153,51,0.5));
    transform: rotate(10deg);
  }
  .specs-placard::after {
    content: '';
    position: absolute;
    left: -100px;
    top: 20px;
    width: 6px;
    height: 6px;
    background: var(--color-saffron);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--color-saffron);
  }

  .placard-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 1.2rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 0.8rem;
  }

  .placard-title {
    font-size: 1rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--color-saffron);
    text-shadow: 0 0 10px rgba(255,153,51,0.4);
  }

  .placard-model {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: #888;
    letter-spacing: 1px;
  }

  .spec-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.2rem;
  }

  .spec-item {
    display: flex;
    flex-direction: column;
  }

  .spec-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    color: #aaa;
    margin-bottom: 0.3rem;
    letter-spacing: 1px;
  }

  .spec-value {
    font-size: 0.9rem;
    font-weight: 600;
    color: #fff;
  }

  /* Title Overlay */
  .title-overlay {
    position: absolute;
    top: 6%;
    left: 6%;
    z-index: 5;
    pointer-events: none;
  }

  .title-overlay h1 {
    font-size: 3.5rem;
    line-height: 0.9;
    font-weight: 900;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
    text-shadow: 0 10px 30px rgba(0,0,0,0.5);
    mix-blend-mode: overlay;
  }
  
  .title-overlay p {
    font-family: var(--font-mono);
    color: var(--color-saffron);
    margin-top: 0.5rem;
    font-weight: bold;
    letter-spacing: 2px;
    font-size: 0.9rem;
  }

  /* Hotspot Styles */
  .hotspot { cursor: pointer; }
  .hotspot-dot {
    fill: var(--color-saffron);
    stroke: white;
    stroke-width: 2px;
    filter: drop-shadow(0 0 4px rgba(255, 153, 51, 0.8));
    transition: r 0.2s ease;
  }
  .hotspot:hover .hotspot-dot {
    r: 7;
    fill: #fff;
    stroke: var(--color-saffron);
  }
  .hotspot-ring {
    fill: none;
    stroke: var(--color-saffron);
    stroke-width: 1px;
    opacity: 0;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { r: 5; opacity: 0.8; }
    100% { r: 20; opacity: 0; }
  }
  
  .hotspot-text {
    font-family: var(--font-mono);
    font-size: 11px;
    fill: white;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
  }

</style>
</head>
<body>

<div class="atmosphere"></div>
<div class="noise-overlay"></div>

<div class="title-overlay">
  <h1>Indian<br>Auto<br>Rickshaw</h1>
  <p>THE TUK-TUK SHOWCASE</p>
</div>

<main id="main-container">
  
  <div id="rickshaw-stage">
    <!-- 
      REVISED SVG:
      - 3/4 Perspective (Front Left / Side Right visible)
      - Richer Gradients (Saffron/Chrome)
      - Detailed Ornamentation
    -->
    <svg id="rickshaw-svg" viewBox="0 0 900 750" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Saffron Body Gradient (Front) -->
        <linearGradient id="saffronBody" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FFB74D" />
          <stop offset="30%" stop-color="#FF9800" />
          <stop offset="80%" stop-color="#F57C00" />
          <stop offset="100%" stop-color="#E65100" />
        </linearGradient>

        <!-- Side Panel Gradient (Right Side - Darker) -->
        <linearGradient id="saffronSide" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#FF9800" />
          <stop offset="50%" stop-color="#F57C00" />
          <stop offset="100%" stop-color="#D84315" />
        </linearGradient>

        <!-- Chrome/Metal Gradient -->
        <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="30%" stop-color="#CFD8DC" />
          <stop offset="50%" stop-color="#90A4AE" />
          <stop offset="80%" stop-color="#546E7A" />
          <stop offset="100%" stop-color="#37474F" />
        </linearGradient>

        <!-- Tire Gradient -->
        <linearGradient id="tire" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#424242" />
          <stop offset="40%" stop-color="#212121" />
          <stop offset="100%" stop-color="#000000" />
        </linearGradient>

        <!-- Glass Gradient -->
        <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#81D4FA" stop-opacity="0.6" />
          <stop offset="40%" stop-color="#29B6F6" stop-opacity="0.3" />
          <stop offset="100%" stop-color="#0277BD" stop-opacity="0.8" />
        </linearGradient>

        <!-- Glow Filter -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="8" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- Shadow Filter -->
        <filter id="shadowBlur">
          <feGaussianBlur stdDeviation="20" />
        </filter>

        <!-- Decorative Pattern -->
        <pattern id="floralBorder" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M0,20 Q10,0 20,20 T40,20" fill="none" stroke="#138808" stroke-width="2" opacity="0.8"/>
          <path d="M0,20 Q10,40 20,20 T40,20" fill="none" stroke="#138808" stroke-width="2" opacity="0.8"/>
        </pattern>
      </defs>

      <!-- Ground Shadow -->
      <ellipse cx="450" cy="620" rx="380" ry="50" fill="#000" opacity="0.7" filter="url(#shadowBlur)"/>

      <!-- ================= REAR AXLE & WHEELS ================= -->
      <g id="rear-assembly" transform="translate(0, 20)">
        <!-- Axle Bar -->
        <rect x="200" y="480" width="460" height="16" rx="4" fill="#333" />
        <rect x="200" y="480" width="460" height="4" rx="2" fill="#555" /> 

        <!-- Rear Right Wheel (Visible - 3/4 View) -->
        <g transform="translate(600, 540)">
          <!-- Tire -->
          <circle cx="0" cy="0" r="65" fill="url(#tire)" />
          <!-- Rim -->
          <circle cx="0" cy="0" r="45" fill="url(#chrome)" />
          <!-- Spokes -->
          <path d="M0,-45 L0,45 M-45,0 L45,0 M-32,-32 L32,32 M-32,32 L32,-32" stroke="#78909c" stroke-width="6" stroke-linecap="round"/>
          <!-- Hub -->
          <circle cx="0" cy="0" r="15" fill="#263238" stroke="#111" stroke-width="2"/>
          <circle cx="0" cy="0" r="5" fill="#111"/>
        </g>

        <!-- Rear Left Wheel (Hidden/Further back) -->
        <g transform="translate(280, 530)">
          <circle cx="0" cy="0" r="65" fill="url(#tire)" opacity="0.9" />
          <circle cx="0" cy="0" r="45" fill="url(#chrome)" opacity="0.9" />
          <path d="M0,-45 L0,45 M-45,0 L45,0" stroke="#78909c" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
          <circle cx="0" cy="0" r="15" fill="#263238" stroke="#111" stroke-width="2" opacity="0.9"/>
        </g>
      </g>

      <!-- ================= CABIN BODY ================= -->
      <g id="cabin-structure">
        <!-- Floor Base -->
        <path d="M 250 500 L 650 500 L 720 550 L 220 550 Z" fill="#222" />

        <!-- Back Wall (Visible due to angle) -->
        <path d="M 260 300 L 660 300 L 660 500 L 260 500 Z" fill="url(#saffronBody)" />
        
        <!-- Back Wall Trim -->
        <rect x="260" y="300" width="400" height="10" fill="url(#chrome)" />
        <rect x="260" y="490" width="400" height="10" fill="#333" />

        <!-- Right Side Wall (The "3/4" depth) -->
        <path d="M 660 300 L 720 340 L 720 550 L 660 500 Z" fill="url(#saffronSide)" />
        <path d="M 660 300 L 720 340" stroke="#E65100" stroke-width="4" /> 

        <!-- Side Window -->
        <path d="M 670 315 L 710 345 L 710 480 L 670 450 Z" fill="url(#glass)" stroke="#333" stroke-width="2"/>
        
        <!-- Side Window Decorative Stripe -->
        <path d="M 660 460 L 720 500" stroke="#138808" stroke-width="4" />
        <path d="M 660 470 L 720 510" stroke="#FF9800" stroke-width="2" />

        <!-- Back Window -->
        <path d="M 280 320 L 640 320 L 640 440 L 280 440 Z" fill="url(#glass)" stroke="#111" stroke-width="4"/>
        <!-- Back Window Glare -->
        <path d="M 290 330 L 350 330 L 290 400 Z" fill="rgba(255,255,255,0.4)"/>
        
        <!-- Seat Backrest (Inside) -->
        <path d="M 290 360 L 630 360 L 630 430 L 290 430 Z" fill="#333" stroke="#111" stroke-width="2"/>
        <!-- Seat Pattern (Simple stripes) -->
        <path d="M 300 370 L 620 370 M 300 390 L 620 390 M 300 410 L 620 410" stroke="#138808" stroke-width="2" stroke-dasharray="10,5"/>
      </g>

      <!-- ================= FRONT ASSEMBLY ================= -->
      <g id="front-assembly">
        <!-- Engine Block -->
        <path d="M 380 480 L 460 480 L 440 550 L 400 550 Z" fill="#444" stroke="#222" stroke-width="2"/>
        <!-- Engine Fins -->
        <line x1="390" y1="500" x2="450" y2="500" stroke="#222" stroke-width="4"/>
        <line x1="388" y1="520" x2="452" y2="520" stroke="#222" stroke-width="4"/>
        <line x1="386" y1="540" x2="454" y2="540" stroke="#222" stroke-width="4"/>

        <!-- Front Fork -->
        <path d="M 420 520 L 420 580" stroke="#222" stroke-width="14" stroke-linecap="round"/>
        <path d="M 420 520 L 400 580 M 420 520 L 440 580" stroke="#222" stroke-width="10" stroke-linecap="round"/>

        <!-- Front Wheel -->
        <g transform="translate(420, 580)">
          <circle cx="0" cy="0" r="65" fill="url(#tire)" />
          <circle cx="0" cy="0" r="45" fill="url(#chrome)" />
          <path d="M0,-45 L0,45 M-45,0 L45,0 M-32,-32 L32,32 M-32,32 L32,-32" stroke="#78909c" stroke-width="6" stroke-linecap="round"/>
          <circle cx="0" cy="0" r="15" fill="#263238" stroke="#111" stroke-width="2"/>
        </g>

        <!-- Front Mudguard -->
        <path d="M 350 580 A 70 70 0 0 1 490 580" fill="none" stroke="url(#saffronBody)" stroke-width="16" stroke-linecap="round"/>
        <path d="M 350 580 A 70 70 0 0 1 490 580" fill="none" stroke="#D84315" stroke-width="4" stroke-linecap="round"/> 
      </g>

      <!-- ================= DRIVER AREA ================= -->
      <g id="driver-area">
        <!-- Handlebars -->
        <path d="M 370 450 Q 420 420 470 450" fill="none" stroke="#222" stroke-width="12" stroke-linecap="round"/>
        <path d="M 370 450 Q 420 420 470 450" fill="none" stroke="#555" stroke-width="8" stroke-linecap="round" stroke-dasharray="4,4"/> 

        <!-- Right Mirror -->
        <path d="M 470 450 L 500 400" stroke="#222" stroke-width="5"/>
        <ellipse cx="505" cy="395" rx="10" ry="18" fill="#333" transform="rotate(20 505 395)"/>
        <ellipse cx="505" cy="395" rx="7" ry="14" fill="#81d4fa" transform="rotate(20 505 395)"/>

        <!-- Windshield Frame -->
        <path d="M 300 300 L 540 300 L 540 450 L 300 450 Z" fill="none" stroke="#111" stroke-width="10" stroke-linejoin="round"/>
        <!-- Windshield Glass -->
        <path d="M 305 305 L 535 305 L 535 445 L 305 445 Z" fill="url(#glass)"/>
        <!-- Glare -->
        <path d="M 310 310 L 380 310 L 310 400 Z" fill="rgba(255,255,255,0.5)"/>

        <!-- Headlamp (Round & Glowing) -->
        <g transform="translate(420, 380)">
          <circle cx="0" cy="0" r="28" fill="url(#chrome)" />
          <circle cx="0" cy="0" r="22" fill="#FFF" filter="url(#glow)"/>
          <circle cx="0" cy="0" r="12" fill="#FFF9C4" />
          <!-- Reflector Detail -->
          <path d="M -10 -10 L 10 10 M -10 10 L 10 -10" stroke="#ddd" stroke-width="1" opacity="0.5"/>
        </g>
        
        <!-- Driver Silhouette (Simplified) -->
        <g transform="translate(420, 350)">
          <circle cx="0" cy="0" r="20" fill="#1a1a1a"/> 
          <path d="M -15 20 L 15 20 L 20 90 L -20 90 Z" fill="#1a1a1a"/> 
          <path d="M -20 20 Q 0 30 20 20" fill="none" stroke="#1a1a1a" stroke-width="10"/> 
        </g>
      </g>

      <!-- ================= ROOF ================= -->
      <g id="roof">
        <!-- Main Canopy -->
        <path d="M 240 300 L 680 300 L 740 340 L 240 340 Z" fill="url(#chrome)" stroke="#222" stroke-width="2"/>
        <!-- Roof Highlight -->
        <path d="M 240 300 L 680 300 L 740 340 L 240 340 Z" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4"/>
        
        <!-- Roof Trim (Red) -->
        <path d="M 240 300 L 680 300 L 685 305 L 245 305 Z" fill="#D32F2F"/>
        
        <!-- Roof Rack -->
        <path d="M 240 300 L 240 280 L 680 280 L 680 300" fill="none" stroke="#222" stroke-width="4"/>
        <!-- Rack Crossbars -->
        <line x1="290" y1="280" x2="290" y2="300" stroke="#222" stroke-width="3"/>
        <line x1="340" y1="280" x2="340" y2="300" stroke="#222" stroke-width="3"/>
        <line x1="390" y1="280" x2="390" y2="300" stroke="#222" stroke-width="3"/>
        <line x1="440" y1="280" x2="440" y2="300" stroke="#222" stroke-width="3"/>
        <line x1="490" y1="280" x2="490" y2="300" stroke="#222" stroke-width="3"/>
        <line x1="540" y1="280" x2="540" y2="300" stroke="#222" stroke-width="3"/>
        <line x1="590" y1="280" x2="590" y2="300" stroke="#222" stroke-width="3"/>
        <line x1="640" y1="280" x2="640" y2="300" stroke="#222" stroke-width="3"/>
      </g>

      <!-- ================= ORNAMENTS ================= -->
      <g id="ornaments">
        <!-- "GOD" Sticker (Front Right Corner) -->
        <g transform="translate(690, 500) rotate(10)">
          <rect x="-15" y="-15" width="30" height="30" rx="4" fill="#FFEB3B" stroke="#F57F17" stroke-width="2"/>
          <text x="0" y="5" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="12" fill="#D32F2F">GOD</text>
        </g>
        
        <!-- Decorative Floral Border (Bottom Right) -->
        <path d="M 680 500 L 720 530 L 720 550" fill="none" stroke="url(#floralBorder)" stroke-width="10"/>

        <!-- Exhaust Pipe -->
        <path d="M 400 540 Q 360 580 300 580" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round"/>
        <circle cx="300" cy="580" r="4" fill="#222"/>

        <!-- Decorative Lights -->
        <circle cx="660" cy="320" r="6" fill="#FFF" stroke="#D32F2F" stroke-width="2"/>
        <circle cx="280" cy="320" r="6" fill="#FFF" stroke="#D32F2F" stroke-width="2"/>
      </g>

      <!-- ================= INTERACTIVE HOTSPOTS ================= -->
      <g class="hotspot" transform="translate(420, 380)">
        <circle class="hotspot-ring" r="5" />
        <circle class="hotspot-dot" r="5" />
        <text class="hotspot-text" x="20" y="5">Halogen Headlamp</text>
      </g>
      
      <g class="hotspot" transform="translate(420, 580)">
        <circle class="hotspot-ring" r="5" />
        <circle class="hotspot-dot" r="5" />
        <text class="hotspot-text" x="20" y="5">Front Steering</text>
      </g>

      <g class="hotspot" transform="translate(690, 500)">
        <circle class="hotspot-ring" r="5" />
        <circle class="hotspot-dot" r="5" />
        <text class="hotspot-text" x="-60" y="5" text-anchor="end">Cultural Decal</text>
      </g>

    </svg>
  </div>

  <!-- Floating Specs Placard -->
  <div class="specs-placard">
    <div class="placard-header">
      <span class="placard-title">Vehicle Specs</span>
      <span class="placard-model">MODEL: PIAGGIO APE</span>
    </div>
    <div class="spec-grid">
      <div class="spec-item">
        <span class="spec-label">Engine</span>
        <span class="spec-value">125cc Single</span>
      </div>
      <div class="spec-item">
        <span class="spec-label">Transmission</span>
        <span class="spec-value">4-Speed Manual</span>
      </div>
      <div class="spec-item">
        <span class="spec-label">Payload</span>
        <span class="spec-value">4 Passengers</span>
      </div>
      <div class="spec-item">
        <span class="spec-label">Top Speed</span>
        <span class="spec-value">~60 km/h</span>
      </div>
      <div class="spec-item" style="grid-column: span 2; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 0.5rem; margin-top: 0.5rem;">
        <span class="spec-label">Finish</span>
        <span class="spec-value" style="color: var(--color-saffron);">Saffron / Chrome</span>
      </div>
    </div>
  </div>

</main>

<script>
  // Interactive Parallax & Hotspot Logic
  const container = document.querySelector('main');
  const svg = document.getElementById('rickshaw-svg');
  const placard = document.querySelector('.specs-placard');
  const title = document.querySelector('.title-overlay');

  let targetRotateX = 0;
  let targetRotateY = 0;
  let currentRotateX = 0;
  let currentRotateY = 0;

  // Mouse Move Handler
  container.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth) - 0.5;
    const y = (e.clientY / window.innerHeight) - 0.5;
    
    // Subtle rotation limits
    targetRotateY = x * 15; 
    targetRotateX = -y * 10; 
  });

  container.addEventListener('mouseleave', () => {
    targetRotateX = 0;
    targetRotateY = 0;
  });

  // Animation Loop
  function animate() {
    // Smooth interpolation (Lerp)
    currentRotateX += (targetRotateX - currentRotateX) * 0.05;
    currentRotateY += (targetRotateY - currentRotateY) * 0.05;

    // Apply transform to SVG
    svg.style.transform = `perspective(1200px) rotateX(${currentRotateX}deg) rotateY(${currentRotateY}deg)`;
    
    // Parallax for UI elements (move opposite to mouse for depth)
    placard.style.transform = `translateX(${currentRotateY * -3}px) translateY(${currentRotateX * -3}px)`;
    title.style.transform = `translateX(${currentRotateY * -1.5}px) translateY(${currentRotateX * -1.5}px)`;
    
    requestAnimationFrame(animate);
  }

  animate();

  // Hotspot Hover Logic
  const hotspots = document.querySelectorAll('.hotspot');
  hotspots.forEach(spot => {
    spot.addEventListener('mouseenter', () => {
      const text = spot.querySelector('.hotspot-text');
      if(text) text.style.opacity = 1;
    });
    spot.addEventListener('mouseleave', () => {
      const text = spot.querySelector('.hotspot-text');
      if(text) text.style.opacity = 0;
    });
  });

</script>

</body>
</html>
