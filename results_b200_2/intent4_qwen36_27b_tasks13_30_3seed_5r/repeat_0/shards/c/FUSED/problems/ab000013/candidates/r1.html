<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Classic Auto — Vector Showcase</title>
<style>
  :root {
    --bg: #f4f1ea;
    --text: #1a1a1a;
    --accent: #ff6600;
    --accent-dark: #cc5200;
    --rickshaw-yellow: #FFD700;
    --rickshaw-yellow-light: #FFF066;
    --rickshaw-yellow-shadow: #D4AF37;
    --metal: #8c9299;
    --metal-dark: #4a5056;
    --chrome: #eef2f5;
    --chrome-shadow: #bdc3c7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* Background Texture */
  .noise {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0.3;
    pointer-events: none;
    z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.5'/%3E%3C/svg%3E");
  }

  /* Layout */
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 1.2fr 1fr;
    grid-template-rows: auto 1fr auto;
    padding: 2rem;
    max-width: 1600px;
  }

  /* Typography & HUD */
  header {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 2rem;
    border-bottom: 2px solid var(--text);
    padding-bottom: 1rem;
  }

  h1 {
    font-size: 3rem;
    line-height: 0.9;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    font-weight: 800;
  }

  .subtitle {
    font-family: 'Courier New', Courier, monospace;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
  }

  /* The Stage */
  .stage {
    grid-column: 1 / -1;
    grid-row: 2 / 3;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* SVG Container */
  #rickshaw-container {
    width: 100%;
    max-width: 1000px;
    height: auto;
    /* Shadow applied via SVG for precision with the new perspective */
    transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    cursor: pointer;
  }

  #rickshaw-container:hover {
    transform: scale(1.02);
  }

  /* Decorative Elements */
  .specs {
    position: absolute;
    right: 5%;
    top: 50%;
    transform: translateY(-50%);
    text-align: right;
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    line-height: 1.6;
    color: #555;
    max-width: 220px;
    background: rgba(255,255,255,0.8);
    padding: 1rem;
    border: 1px solid rgba(0,0,0,0.1);
  }

  .specs strong { color: var(--text); display: block; margin-bottom: 0.2rem; font-size: 0.75rem;}

  .specs::before {
    content: '';
    display: block;
    width: 40px;
    height: 4px;
    background: var(--accent);
    margin-bottom: 1rem;
    margin-left: auto;
  }

  /* Interactive Dots */
  .hotspot-group { cursor: pointer; }
  .hotspot {
    fill: var(--accent);
    stroke: white;
    stroke-width: 2;
    transition: r 0.2s;
  }
  .hotspot-group:hover .hotspot { r: 7; }
  .hotspot-label {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    fill: var(--text);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    font-weight: bold;
  }
  .hotspot-group:hover .hotspot-label { opacity: 1; }

  /* Footer */
  footer {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    margin-top: auto;
  }
</style>
</head>
<body>

<div class="noise"></div>

<main>
  <header>
    <div>
      <div class="subtitle">Vehicle ID: TUK-TUK-01</div>
      <h1>The Urban<br>Auto Rickshaw</h1>
    </div>
    <div class="subtitle">
      Origin: India<br>
      Type: 3-Wheeler
    </div>
  </header>

  <div class="stage">
    <div class="specs">
      <p><strong>CHASSIS</strong>Open Steel Tubular</p>
      <p><strong>ENGINE</strong>125cc Single Cylinder</p>
      <p><strong>PAINT</strong>Industrial Yellow</p>
      <p><strong>STATUS</strong>Active</p>
    </div>

    <!-- SVG DRAWING START -->
    <svg id="rickshaw-container" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gradients -->
        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:var(--rickshaw-yellow-light);stop-opacity:1" />
          <stop offset="40%" style="stop-color:var(--rickshaw-yellow);stop-opacity:1" />
          <stop offset="100%" style="stop-color:var(--rickshaw-yellow-shadow);stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="sidePanelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:var(--rickshaw-yellow);stop-opacity:1" />
          <stop offset="80%" style="stop-color:var(--rickshaw-yellow-shadow);stop-opacity:1" />
          <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:var(--chrome);stop-opacity:1" />
          <stop offset="50%" style="stop-color:var(--chrome-shadow);stop-opacity:1" />
          <stop offset="100%" style="stop-color:var(--metal);stop-opacity:1" />
        </linearGradient>

        <linearGradient id="chromeRim" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#ddd;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#999;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:0.7" />
          <stop offset="40%" style="stop-color:#4682B4;stop-opacity:0.5" />
          <stop offset="100%" style="stop-color:#191970;stop-opacity:0.8" />
        </linearGradient>

        <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" style="stop-color:#FFF;stop-opacity:1" />
          <stop offset="30%" style="stop-color:#FFF9C4;stop-opacity:0.9" />
          <stop offset="100%" style="stop-color:#FFC107;stop-opacity:0" />
        </radialGradient>

        <pattern id="seatPattern" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
          <rect width="8" height="8" fill="#333"/>
          <rect width="4" height="8" fill="#222"/>
        </pattern>
        
        <!-- Filters -->
        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
          <feOffset dx="10" dy="20" result="offsetblur" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.3" />
          </feComponentTransfer>
          <feMerge>
            <feMergeNode />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <!-- GROUND SHADOW (Matching Perspective) -->
      <path d="M 150 480 Q 450 520 750 480" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="30" stroke-linecap="round" filter="blur(5px)"/>

      <!-- REAR AXLE AREA (Visible underneath) -->
      <rect x="200" y="450" width="400" height="20" rx="10" fill="#222" />
      
      <!-- REAR WHEEL (Left/Back) -->
      <g transform="translate(220, 450)">
        <ellipse cx="0" cy="0" rx="55" ry="15" fill="#222" /> <!-- Tire -->
        <ellipse cx="0" cy="0" rx="45" ry="10" fill="url(#chromeRim)" /> <!-- Rim -->
        <ellipse cx="0" cy="0" rx="10" ry="3" fill="#111" /> <!-- Hub -->
        <!-- Mudguard -->
        <path d="M-60,10 A 60 15 0 0 1 60,10" fill="none" stroke="var(--rickshaw-yellow-shadow)" stroke-width="12" />
      </g>

      <!-- REAR WHEEL (Right/Front) -->
      <g transform="translate(680, 450)">
        <ellipse cx="0" cy="0" rx="60" ry="18" fill="#111" /> <!-- Tire -->
        <ellipse cx="0" cy="0" rx="50" ry="13" fill="url(#chromeRim)" /> <!-- Rim -->
        <ellipse cx="0" cy="0" rx="12" ry="4" fill="#111" /> <!-- Hub -->
        <!-- Spokes (Perspective) -->
        <path d="M0,0 L40,10 M0,0 L-30,8 M0,0 L0,-5" stroke="#555" stroke-width="2" />
        <!-- Mudguard -->
        <path d="M-65,10 A 65 18 0 0 1 65,10" fill="none" stroke="var(--rickshaw-yellow)" stroke-width="14" />
      </g>

      <!-- FRAME / CHASSIS -->
      <path d="M 220 450 L 260 300 L 680 450" fill="none" stroke="#333" stroke-width="12" stroke-linejoin="round"/>

      <!-- ENGINE AREA (Under Driver) -->
      <path d="M 380 300 L 460 300 L 440 440 L 360 440 Z" fill="#444" />
      <rect x="385" y="320" width="50" height="80" fill="#222" rx="4" /> <!-- Engine Block -->
      <path d="M 380 320 L 435 320 L 435 420 L 380 420" fill="none" stroke="#111" stroke-width="2"/>

      <!-- FRONT WHEEL (Center) -->
      <g transform="translate(450, 460)">
        <ellipse cx="0" cy="0" rx="50" ry="16" fill="#111" />
        <ellipse cx="0" cy="0" rx="40" ry="12" fill="url(#chromeRim)" />
        <ellipse cx="0" cy="0" rx="10" ry="3" fill="#111" />
        <!-- Spokes -->
        <path d="M0,0 L35,8 M0,0 L-25,7 M0,0 L0,-4" stroke="#555" stroke-width="2" />
        <!-- Front Mudguard -->
        <path d="M-55,5 A 55 16 0 0 1 55,5" fill="none" stroke="var(--rickshaw-yellow)" stroke-width="12" />
      </g>

      <!-- FRONT ASSEMBLY (Fork, Handlebars) -->
      <!-- Fork -->
      <path d="M 450 300 L 450 460" stroke="#333" stroke-width="10" />
      
      <!-- Handlebars -->
      <path d="M 410 280 Q 450 260 490 280" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round" />
      <circle cx="410" cy="280" r="6" fill="#222" /> <!-- Grip -->
      <circle cx="490" cy="280" r="6" fill="#222" /> <!-- Grip -->
      
      <!-- Mirrors -->
      <path d="M 410 280 L 390 250" fill="none" stroke="#333" stroke-width="3" />
      <ellipse cx="385" cy="245" rx="8" ry="12" fill="#333" transform="rotate(-20 385 245)" />
      <path d="M 490 280 L 510 250" fill="none" stroke="#333" stroke-width="3" />
      <ellipse cx="515" cy="245" rx="8" ry="12" fill="#333" transform="rotate(20 515 245)" />

      <!-- HEADLAMP -->
      <circle cx="450" cy="330" r="20" fill="url(#lampGlow)" />
      <circle cx="450" cy="330" r="14" fill="#222" stroke="url(#chromeRim)" stroke-width="3" />
      <circle cx="450" cy="330" r="8" fill="#FFF" />

      <!-- CABIN (Passenger Area) - True 3/4 Perspective -->
      <g id="cabin" filter="url(#dropShadow)">
        <!-- Back Wall (Inside) -->
        <path d="M 260 300 L 550 300 L 550 180 L 260 180 Z" fill="#E6BE00" />
        
        <!-- Side Wall (Right/Foreground) - Trapezoid for perspective -->
        <path d="M 550 180 L 550 300 L 650 300 L 650 180 Z" fill="url(#sidePanelGrad)" />
        
        <!-- Door Frame (Right) -->
        <path d="M 550 300 L 550 180 L 650 180 L 650 300" fill="none" stroke="#333" stroke-width="5" />
        
        <!-- Windows (Right Side) -->
        <path d="M 555 185 L 645 185 L 645 230 L 555 230 Z" fill="url(#glassGrad)" stroke="#333" stroke-width="2" />
        
        <!-- Decorative Stripe -->
        <path d="M 550 250 L 650 250 L 650 260 L 550 260 Z" fill="var(--accent-dark)" />

        <!-- Roof Canopy -->
        <path d="M 250 180 L 540 180 L 660 180 L 660 190 L 540 190 L 250 190 Z" fill="var(--metal)" />
        <path d="M 250 180 L 540 180 L 540 185 L 250 185 Z" fill="#555" /> <!-- Roof Shadow -->
        
        <!-- Roof Rack -->
        <path d="M 250 180 L 250 170 L 540 170 L 540 180" fill="none" stroke="#333" stroke-width="4" />
        <line x1="280" y1="170" x2="280" y2="180" stroke="#333" stroke-width="2" />
        <line x1="350" y1="170" x2="350" y2="180" stroke="#333" stroke-width="2" />
        <line x1="420" y1="170" x2="420" y2="180" stroke="#333" stroke-width="2" />
        <line x1="500" y1="170" x2="500" y2="180" stroke="#333" stroke-width="2" />
        
        <!-- Windshield (Front) -->
        <path d="M 260 300 L 550 300 L 520 180 L 290 180 Z" fill="url(#glassGrad)" stroke="#333" stroke-width="4" />
        <line x1="400" y1="300" x2="400" y2="180" stroke="#333" stroke-width="4" /> <!-- Windshield Divider -->
        <line x1="325" y1="240" x2="475" y2="240" stroke="#333" stroke-width="2" /> <!-- Wiper -->
      </g>

      <!-- DRIVER AREA (Inside Windshield) -->
      <!-- Driver Seat -->
      <path d="M 380 300 L 420 300 L 420 260 L 380 260 Z" fill="#222" />
      
      <!-- Driver Silhouette -->
      <circle cx="400" cy="240" r="12" fill="#333" />
      <path d="M 390 250 L 410 250 L 410 280 L 390 280 Z" fill="#333" />

      <!-- INTERACTIVE HOTSPOTS -->
      <g class="hotspot-group">
        <circle cx="450" cy="330" r="4" class="hotspot" />
        <text x="470" y="335" class="hotspot-label">Headlamp</text>
      </g>
      <g class="hotspot-group">
        <circle cx="600" cy="210" r="4" class="hotspot" />
        <text x="620" y="215" class="hotspot-label">Passenger Window</text>
      </g>
      <g class="hotspot-group">
        <circle cx="450" cy="460" r="4" class="hotspot" />
        <text x="470" y="465" class="hotspot-label">Front Wheel</text>
      </g>

    </svg>
    <!-- SVG DRAWING END -->
  </div>

  <footer>
    <div>
      Designed for Urban Mobility<br>
      Vector Craft v2.0
    </div>
    <div>
      [ SCROLL FOR MORE ]
    </div>
  </footer>
</main>

<script>
  // Simple interaction to tilt the SVG based on mouse position
  const container = document.querySelector('main');
  const svg = document.getElementById('rickshaw-container');

  container.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth) - 0.5;
    const y = (e.clientY / window.innerHeight) - 0.5;

    // Subtle parallax effect
    svg.style.transform = `perspective(1000px) rotateY(${x * 5}deg) rotateX(${-y * 5}deg) scale(1.02)`;
  });

  container.addEventListener('mouseleave', () => {
    svg.style.transform = `perspective(1000px) rotateY(0deg) rotateX(0deg) scale(1)`;
  });
</script>

</body>
</html>
