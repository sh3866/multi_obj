<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Classic Auto — Vector Showcase</title>
<style>
  :root {
    --bg: #f0f2f5;
    --text: #1a1a1a;
    --accent: #d32f2f; /* Vibrant Red */
    --accent-light: #ff6659;
    --rickshaw-yellow: #FFC107; /* Deep Saturated Yellow */
    --rickshaw-yellow-light: #FFD54F;
    --rickshaw-yellow-dark: #FF8F00;
    --metal: #90a4ae;
    --metal-dark: #546e7a;
    --chrome: #eceff1;
    --chrome-shadow: #b0bec5;
    --glass: #81d4fa;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Subtle Noise Texture */
  .noise {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.5'/%3E%3C/svg%3E");
  }

  /* Layout */
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 1.5fr 1fr;
    grid-template-rows: auto 1fr auto;
    padding: 2rem;
    max-width: 1800px;
  }

  /* Typography & HUD */
  header {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 1rem;
    padding-bottom: 1rem;
    border-bottom: 2px solid #ddd;
  }

  h1 {
    font-size: 3.5rem;
    line-height: 0.9;
    text-transform: uppercase;
    letter-spacing: -0.03em;
    font-weight: 900;
    color: var(--text);
  }

  .subtitle {
    font-family: 'Courier New', Courier, monospace;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    color: #666;
  }

  /* The Stage */
  .stage {
    grid-column: 1 / -1;
    grid-row: 2 / 3;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* SVG Container */
  #rickshaw-container {
    width: 100%;
    max-width: 1100px;
    height: auto;
    transition: transform 0.1s linear;
    filter: drop-shadow(0px 20px 30px rgba(0,0,0,0.2));
  }

  /* Specs Panel */
  .specs {
    position: absolute;
    right: 5%;
    top: 50%;
    transform: translateY(-50%);
    text-align: right;
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    line-height: 1.6;
    color: #555;
    width: 200px;
    background: rgba(255,255,255,0.9);
    padding: 1.5rem;
    border: 1px solid #ccc;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
  }

  .specs strong { color: var(--accent); display: block; margin-bottom: 0.2rem; font-size: 0.7rem; letter-spacing: 1px;}

  /* Interactive Dots */
  .hotspot-group { cursor: pointer; }
  .hotspot {
    fill: var(--accent);
    stroke: white;
    stroke-width: 2;
    transition: r 0.2s, fill 0.2s;
  }
  .hotspot-group:hover .hotspot { r: 7; fill: var(--accent-light); }
  .hotspot-label {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    fill: var(--text);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    font-weight: bold;
    text-shadow: 0 0 3px white;
  }
  .hotspot-group:hover .hotspot-label { opacity: 1; }

  /* Footer */
  footer {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    color: #888;
    margin-top: auto;
  }
</style>
</head>
<body>

<div class="noise"></div>

<main>
  <header>
    <div>
      <div class="subtitle">Vehicle ID: TUK-TUK-01</div>
      <h1>The Urban<br>Auto Rickshaw</h1>
    </div>
    <div class="subtitle">
      Origin: India<br>
      Type: 3-Wheeler
    </div>
  </header>

  <div class="stage">
    <div class="specs">
      <p><strong>CHASSIS</strong>Open Steel Tubular</p>
      <p><strong>ENGINE</strong>125cc Single Cylinder</p>
      <p><strong>PAINT</strong>Saffron Yellow / Red</p>
      <p><strong>STATUS</strong>Active</p>
    </div>

    <!-- SVG DRAWING START -->
    <svg id="rickshaw-container" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Body Gradients -->
        <linearGradient id="bodyMain" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:var(--rickshaw-yellow-light);stop-opacity:1" />
          <stop offset="30%" style="stop-color:var(--rickshaw-yellow);stop-opacity:1" />
          <stop offset="100%" style="stop-color:var(--rickshaw-yellow-dark);stop-opacity:1" />
        </linearGradient>

        <linearGradient id="bodySide" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:var(--rickshaw-yellow);stop-opacity:1" />
          <stop offset="70%" style="stop-color:var(--rickshaw-yellow-dark);stop-opacity:1" />
          <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
        </linearGradient>

        <!-- Metal & Chrome -->
        <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#b0bec5;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#78909c;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#455a64;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="chromeRim" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
          <stop offset="40%" style="stop-color:#cfd8dc;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#90a4ae;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="chromeBar" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#e0e0e0;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#bdbdbd;stop-opacity:1" />
        </linearGradient>

        <!-- Glass -->
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#e1f5fe;stop-opacity:0.6" />
          <stop offset="30%" style="stop-color:#81d4fa;stop-opacity:0.4" />
          <stop offset="100%" style="stop-color:#0288d1;stop-opacity:0.7" />
        </linearGradient>

        <!-- Rubber -->
        <linearGradient id="tireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#212121;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#424242;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#212121;stop-opacity:1" />
        </linearGradient>

        <!-- Lamp Glow -->
        <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" style="stop-color:#FFF;stop-opacity:1" />
          <stop offset="20%" style="stop-color:#FFF9C4;stop-opacity:0.9" />
          <stop offset="100%" style="stop-color:#FFC107;stop-opacity:0" />
        </radialGradient>

        <!-- Patterns -->
        <pattern id="seatPattern" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
          <rect width="10" height="10" fill="#333"/>
          <path d="M0,10 L10,0" stroke="#222" stroke-width="2"/>
        </pattern>
        
        <pattern id="stripePattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
           <rect width="10" height="20" fill="var(--accent)" />
           <rect x="10" width="10" height="20" fill="#1a1a1a" />
        </pattern>

        <!-- Filters -->
        <filter id="innerShadow">
          <feOffset dx="0" dy="4"/>
          <feGaussianBlur stdDeviation="3" result="offset-blur"/>
          <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
          <feFlood flood-color="black" flood-opacity="0.5" result="color"/>
          <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
          <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
        </filter>
      </defs>

      <!-- Ground Shadow -->
      <ellipse cx="500" cy="580" rx="350" ry="40" fill="rgba(0,0,0,0.15)" filter="blur(8px)"/>

      <!-- ================= REAR ASSEMBLY ================= -->
      <g id="rear-axle">
        <!-- Rear Axle Tube -->
        <path d="M 220 520 L 780 520" stroke="#333" stroke-width="16" stroke-linecap="round"/>
        
        <!-- Suspension -->
        <path d="M 280 520 L 280 480 M 720 520 L 720 480" stroke="#111" stroke-width="8"/>
        <path d="M 280 480 Q 270 490 280 500 T 280 520" fill="none" stroke="#555" stroke-width="4"/>
        <path d="M 720 480 Q 730 490 720 500 T 720 520" fill="none" stroke="#555" stroke-width="4"/>

        <!-- Rear Wheel Left (Background) -->
        <g transform="translate(250, 520)">
          <circle cx="0" cy="0" r="60" fill="url(#tireGrad)" />
          <circle cx="0" cy="0" r="35" fill="url(#chromeRim)" />
          <circle cx="0" cy="0" r="15" fill="#111" />
          <circle cx="0" cy="0" r="5" fill="#888" />
        </g>

        <!-- Rear Wheel Right (Foreground) -->
        <g transform="translate(750, 520)">
          <circle cx="0" cy="0" r="70" fill="url(#tireGrad)" />
          <circle cx="0" cy="0" r="45" fill="url(#chromeRim)" />
          <!-- Spokes -->
          <path d="M0,-45 L0,45 M-45,0 L45,0 M-32,-32 L32,32 M-32,32 L32,-32" stroke="#aaa" stroke-width="3"/>
          <circle cx="0" cy="0" r="18" fill="#111" />
          <circle cx="0" cy="0" r="6" fill="#888" />
        </g>
      </g>

      <!-- ================= CABIN STRUCTURE ================= -->
      <g id="cabin-structure">
        <!-- Floor Base -->
        <path d="M 260 480 L 740 480 L 820 540 L 180 540 Z" fill="#222"/>
        
        <!-- Back Wall -->
        <path d="M 260 250 L 740 250 L 740 480 L 260 480 Z" fill="url(#bodyMain)"/>
        
        <!-- Back Window -->
        <path d="M 280 270 L 720 270 L 720 400 L 280 400 Z" fill="url(#glassGrad)" stroke="#333" stroke-width="2"/>
        <path d="M 350 270 L 350 400 M 450 270 L 450 400 M 550 270 L 550 400" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>

        <!-- Side Wall (Right) -->
        <path d="M 740 250 L 820 300 L 820 540 L 740 480 Z" fill="url(#bodySide)" filter="url(#innerShadow)"/>
        
        <!-- Side Window -->
        <path d="M 745 260 L 810 305 L 810 440 L 745 390 Z" fill="url(#glassGrad)" stroke="#333" stroke-width="2"/>
        
        <!-- Door Panel (Lower) -->
        <path d="M 745 390 L 810 440 L 810 530 L 745 480 Z" fill="var(--accent)" stroke="#333" stroke-width="2"/>
        <path d="M 750 400 L 805 445 L 805 520 L 750 475 Z" fill="url(#stripePattern)"/>

        <!-- Front Wall (Driver Area Back) -->
        <path d="M 260 250 L 500 250 L 500 480 L 260 480 Z" fill="url(#bodyMain)" opacity="0.9"/>
        
        <!-- Seat Backrest -->
        <path d="M 280 300 L 480 300 L 480 450 L 280 450 Z" fill="url(#seatPattern)" stroke="#333" stroke-width="3" rx="5"/>
      </g>

      <!-- ================= FRONT ASSEMBLY ================= -->
      <g id="front-assembly">
        <!-- Engine Block -->
        <path d="M 380 400 L 460 400 L 440 520 L 360 520 Z" fill="#444" stroke="#222" stroke-width="2"/>
        <path d="M 390 410 L 450 410 L 430 510 L 370 510 Z" fill="url(#metalGrad)"/>
        <!-- Engine Fins -->
        <line x1="395" y1="420" x2="445" y2="420" stroke="#222" stroke-width="2"/>
        <line x1="392" y1="440" x2="442" y2="440" stroke="#222" stroke-width="2"/>
        <line x1="389" y1="460" x2="439" y2="460" stroke="#222" stroke-width="2"/>
        <line x1="386" y1="480" x2="436" y2="480" stroke="#222" stroke-width="2"/>

        <!-- Fork (Connecting to Wheel) -->
        <path d="M 430 480 L 500 580 M 470 480 L 500 580" stroke="#222" stroke-width="12" stroke-linecap="round"/>

        <!-- Front Wheel -->
        <g transform="translate(500, 580)">
          <circle cx="0" cy="0" r="65" fill="url(#tireGrad)" />
          <circle cx="0" cy="0" r="40" fill="url(#chromeRim)" />
          <!-- Spokes -->
          <path d="M0,-40 L0,40 M-40,0 L40,0 M-28,-28 L28,28 M-28,28 L28,-28" stroke="#aaa" stroke-width="3"/>
          <circle cx="0" cy="0" r="15" fill="#111" />
        </g>
        
        <!-- Front Mudguard (Yellow, curved) -->
        <path d="M 440 580 A 65 65 0 0 1 560 580" fill="none" stroke="var(--rickshaw-yellow)" stroke-width="18" stroke-linecap="round"/>
        <path d="M 440 580 A 65 65 0 0 1 560 580" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" opacity="0.8"/> <!-- Stripe -->
      </g>

      <!-- ================= DRIVER AREA ================= -->
      <g id="driver-area">
        <!-- Driver Seat -->
        <path d="M 380 400 L 440 400 L 440 440 L 380 440 Z" fill="#222"/>
        <path d="M 380 400 L 390 360 L 430 360 L 440 400 Z" fill="#333"/>
        
        <!-- Handlebars -->
        <path d="M 450 380 Q 500 350 550 380" fill="none" stroke="#222" stroke-width="10" stroke-linecap="round"/>
        <path d="M 450 380 Q 500 350 550 380" fill="none" stroke="#444" stroke-width="6" stroke-linecap="round" stroke-dasharray="2,2"/> <!-- Grip texture -->
        
        <!-- Mirrors -->
        <!-- Left Mirror (Hidden/Behind mostly) -->
        <!-- Right Mirror (Visible) -->
        <path d="M 550 380 L 570 340" stroke="#222" stroke-width="4"/>
        <ellipse cx="575" cy="335" rx="10" ry="18" fill="#333" transform="rotate(30 575 335)"/>
        <ellipse cx="575" cy="335" rx="6" ry="14" fill="#81d4fa" transform="rotate(30 575 335)"/>

        <!-- Windshield Frame -->
        <path d="M 280 260 L 500 260 L 500 400 L 280 400 Z" fill="none" stroke="#222" stroke-width="6"/>
        <!-- Windshield Glass -->
        <path d="M 283 263 L 497 263 L 497 397 L 283 397 Z" fill="url(#glassGrad)"/>
        <path d="M 283 263 L 497 263 L 497 265 L 283 265 Z" fill="rgba(255,255,255,0.5)"/> <!-- Glare -->

        <!-- Wipers -->
        <path d="M 390 397 L 360 340" stroke="#111" stroke-width="3" stroke-linecap="round"/>
        <path d="M 390 397 L 420 340" stroke="#111" stroke-width="3" stroke-linecap="round"/>

        <!-- Headlamp -->
        <circle cx="390" cy="350" r="25" fill="url(#lampGlow)" />
        <circle cx="390" cy="350" r="18" fill="#222" stroke="url(#chromeBar)" stroke-width="3" />
        <circle cx="390" cy="350" r="10" fill="#FFF" />
        <circle cx="395" cy="345" r="3" fill="#FFF" opacity="0.8"/> <!-- Reflection -->

        <!-- Driver Silhouette (Visible through windshield) -->
        <circle cx="400" cy="300" r="14" fill="#1a1a1a"/>
        <path d="M 385 320 L 415 320 L 420 380 L 380 380 Z" fill="#1a1a1a"/>
      </g>

      <!-- ================= ROOF ================= -->
      <g id="roof">
        <!-- Main Canopy -->
        <path d="M 250 250 L 750 250 L 830 300 L 250 300 Z" fill="url(#metalGrad)" stroke="#222" stroke-width="2"/>
        <!-- Roof Trim -->
        <path d="M 250 250 L 750 250 L 755 255 L 255 255 Z" fill="var(--accent)"/>
        <!-- Roof Rack -->
        <path d="M 250 250 L 250 230 L 750 230 L 750 250" fill="none" stroke="#222" stroke-width="4"/>
        <line x1="300" y1="230" x2="300" y2="250" stroke="#222" stroke-width="3"/>
        <line x1="350" y1="230" x2="350" y2="250" stroke="#222" stroke-width="3"/>
        <line x1="400" y1="230" x2="400" y2="250" stroke="#222" stroke-width="3"/>
        <line x1="450" y1="230" x2="450" y2="250" stroke="#222" stroke-width="3"/>
        <line x1="500" y1="230" x2="500" y2="250" stroke="#222" stroke-width="3"/>
        <line x1="550" y1="230" x2="550" y2="250" stroke="#222" stroke-width="3"/>
        <line x1="600" y1="230" x2="600" y2="250" stroke="#222" stroke-width="3"/>
        <line x1="650" y1="230" x2="650" y2="250" stroke="#222" stroke-width="3"/>
        <line x1="700" y1="230" x2="700" y2="250" stroke="#222" stroke-width="3"/>
      </g>

      <!-- ================= ORNAMENTS ================= -->
      <g id="ornaments">
        <!-- Sticker on Side -->
        <g transform="translate(780, 460) rotate(15)">
          <rect x="-15" y="-15" width="30" height="30" rx="4" fill="#FFEB3B" stroke="#F57F17" stroke-width="2"/>
          <text x="0" y="5" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="10" fill="#d32f2f">GOD</text>
        </g>
        
        <!-- Decorative Lights -->
        <circle cx="760" cy="270" r="4" fill="#FFEB3B" stroke="#F57F17" stroke-width="1"/>
        <circle cx="260" cy="270" r="4" fill="#FFEB3B" stroke="#F57F17" stroke-width="1"/>
        
        <!-- Exhaust Pipe -->
        <path d="M 380 500 Q 350 550 300 550" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round"/>
      </g>

      <!-- ================= HOTSPOTS ================= -->
      <g class="hotspot-group">
        <circle cx="390" cy="350" r="4" class="hotspot" />
        <text x="340" y="355" class="hotspot-label" text-anchor="end">Halogen Lamp</text>
      </g>
      <g class="hotspot-group">
        <circle cx="575" cy="335" r="4" class="hotspot" />
        <text x="600" y="335" class="hotspot-label">Side Mirror</text>
      </g>
      <g class="hotspot-group">
        <circle cx="780" cy="460" r="4" class="hotspot" />
        <text x="740" y="460" class="hotspot-label" text-anchor="end">Cultural Sticker</text>
      </g>
      <g class="hotspot-group">
        <circle cx="500" cy="580" r="4" class="hotspot" />
        <text x="520" y="585" class="hotspot-label">Steering Wheel</text>
      </g>

    </svg>
    <!-- SVG DRAWING END -->
  </div>

  <footer>
    <div>
      Designed for Urban Mobility<br>
      Vector Craft v3.0
    </div>
    <div>
      [ SCROLL FOR MORE ]
    </div>
  </footer>
</main>

<script>
  // Interaction logic for parallax effect
  const container = document.querySelector('main');
  const svg = document.getElementById('rickshaw-container');

  // Use requestAnimationFrame for smooth performance
  let targetRotateX = 0;
  let targetRotateY = 0;
  let currentRotateX = 0;
  let currentRotateY = 0;

  container.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth) - 0.5;
    const y = (e.clientY / window.innerHeight) - 0.5;
    
    // Calculate target rotation
    targetRotateY = x * 8; // Max 4 degrees
    targetRotateX = -y * 5; // Max 2.5 degrees
  });

  container.addEventListener('mouseleave', () => {
    targetRotateX = 0;
    targetRotateY = 0;
  });

  function animate() {
    // Linear interpolation (Lerp) for smooth easing
    currentRotateX += (targetRotateX - currentRotateX) * 0.1;
    currentRotateY += (targetRotateY - currentRotateY) * 0.1;

    svg.style.transform = `perspective(1200px) rotateX(${currentRotateX}deg) rotateY(${currentRotateY}deg)`;
    
    requestAnimationFrame(animate);
  }

  animate();
</script>

</body>
</html>
