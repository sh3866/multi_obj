<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crossy Road: Visual Redesign</title>
    <style>
        :root {
            --ui-primary: rgba(255, 255, 255, 0.85);
            --ui-text: #2d3436;
            --ui-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            --ui-accent-green: #00b894;
            --ui-accent-blue: #0984e3;
            --ui-accent-red: #d63031;
            --ui-accent-yellow: #fdcb6e;
            --ui-border: rgba(255, 255, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #87CEEB;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* HUD: Enhanced with semi-transparent backgrounds */
        .hud-top {
            display: flex;
            justify-content: space-between;
            padding: 24px;
            z-index: 10;
        }

        .score-box {
            background: var(--ui-primary);
            color: var(--ui-text);
            padding: 12px 24px;
            border-radius: 20px;
            box-shadow: var(--ui-shadow);
            font-weight: 800;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 110px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--ui-border);
            transition: transform 0.1s;
        }
        
        .score-box:active {
            transform: scale(0.98);
        }

        .score-box .label {
            font-size: 12px;
            text-transform: uppercase;
            color: #636e72;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .score-box .value {
            font-size: 28px;
            line-height: 1;
            font-weight: 900;
            color: var(--ui-text);
        }

        /* Controls: Compact & Tactile */
        .controls-area {
            padding: 30px;
            pointer-events: none;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            margin-bottom: 20px;
        }

        .d-pad {
            pointer-events: auto;
            width: 160px;
            height: 160px;
            position: relative;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            backdrop-filter: blur(4px);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .d-btn {
            border: none;
            cursor: pointer;
            position: relative;
            transition: transform 0.1s, background 0.2s, box-shadow 0.2s;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 6px 0 rgba(0,0,0,0.1), 0 10px 10px rgba(0,0,0,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .d-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 rgba(0,0,0,0.1), inset 0 2px 5px rgba(0,0,0,0.1);
            background: #fff;
        }

        /* D-Pad Layout */
        .d-up { grid-column: 2; grid-row: 1; }
        .d-left { grid-column: 1; grid-row: 2; }
        .d-right { grid-column: 3; grid-row: 2; }
        .d-down { grid-column: 2; grid-row: 3; }
        .d-center { grid-column: 2; grid-row: 2; pointer-events: none; }

        /* Arrows */
        .d-btn svg {
            width: 28px;
            height: 28px;
            fill: #2d3436;
            filter: drop-shadow(0 1px 0 rgba(255,255,255,0.8));
        }

        @media (max-width: 600px) {
            .d-pad { width: 140px; height: 140px; }
            .controls-area { justify-content: center; padding: 20px; }
            .hud-top { padding: 15px; }
            .score-box { padding: 8px 16px; min-width: 90px; }
            .score-box .value { font-size: 22px; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div class="hud-top">
            <div class="score-box">
                <span class="label">Best</span>
                <span class="value" id="best-score">142</span>
            </div>
            <div class="score-box">
                <span class="label">Score</span>
                <span class="value" id="current-score">0</span>
            </div>
        </div>

        <div class="controls-area">
            <div class="d-pad">
                <button class="d-btn d-up" data-dir="up">
                    <svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
                </button>
                <button class="d-btn d-left" data-dir="left">
                    <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z"/></svg>
                </button>
                <div class="d-center"></div>
                <button class="d-btn d-right" data-dir="right">
                    <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
                </button>
                <button class="d-btn d-down" data-dir="down">
                    <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * CROSSY ROAD REDESIGN
 * 
 * Visual Design Updates:
 * 1. Player: Cute low-poly chicken with comb, beak, and distinct limbs.
 * 2. Terrain: Blue water lanes, Green grass, Grey roads.
 * 3. Depth: Soft drop shadows on all objects (cars, logs, player).
 * 4. Vehicles: Detailed with windows and attached wheels.
 * 5. HUD: Glassmorphism style for better readability.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- CONFIGURATION ---
const CONFIG = {
    fov: 800,            // Field of view
    cameraHeight: 280,   // Camera height
    cameraDist: 140,     // Distance behind player
    laneSize: 100,       // Tile size
    laneHeight: 40,      // Block thickness
    colors: {
        skyTop: '#48dbfb',
        skyBottom: '#c7ecee',
        // Grass Palette
        grassTop: '#55efc4',
        grassSide: '#00b894',
        grassDarkTop: '#00cec9',
        grassDarkSide: '#006266',
        // Road Palette
        roadTop: '#636e72',
        roadSide: '#2d3436',
        // Water Palette (Distinct Blue)
        waterTop: '#74b9ff',
        waterSide: '#0984e3',
        // Wood Palette
        woodTop: '#e1b12c',
        woodSide: '#d35400',
        woodFront: '#f39c12'
    }
};

// --- STATE ---
let state = {
    width: 0,
    height: 0,
    centerX: 0,
    centerY: 0,
    playerZ: 0,
    lanes: [],
    score: 0
};

// --- UTILS ---

// Core 3D Projection
function project(worldX, worldY, worldZ) {
    const camZ = state.playerZ - CONFIG.cameraDist;
    const camY = CONFIG.cameraHeight; 
    
    const relZ = worldZ - camZ;
    
    if (relZ <= 10) return null; // Don't draw behind camera
    
    const scale = CONFIG.fov / relZ;
    
    const screenX = state.centerX + (worldX * scale);
    // Camera is high, ground is Y=0.
    // Screen Y calculation: Center + (Ground - CameraHeight) * scale
    const screenY = state.centerY + (0 - camY) * scale + (worldY * scale);
    
    return { x: screenX, y: screenY, scale: scale, z: relZ };
}

function darken(hex, amount) {
    let col = parseInt(hex.replace("#",""), 16);
    let r = (col >> 16) - amount;
    let g = ((col >> 8) & 0x00FF) - amount;
    let b = (col & 0x0000FF) - amount;
    r = Math.max(0, r); g = Math.max(0, g); b = Math.max(0, b);
    return `rgb(${r},${g},${b})`;
}

// --- CLASSES ---

class Lane {
    constructor(zIndex) {
        this.zIndex = zIndex;
        this.z = zIndex * CONFIG.laneSize;
        this.type = this.determineType(zIndex);
        this.traffic = [];
        this.logs = [];
        
        if (this.type === 'road') {
            this.speed = (Math.random() > 0.5 ? 1 : -1) * (5 + Math.random() * 4);
            const count = 1 + Math.floor(Math.random() * 2);
            for(let i=0; i<count; i++) {
                const offset = i * 250 + (Math.random() * 100);
                this.traffic.push({
                    x: (Math.random() * 800) - 400,
                    z: offset,
                    width: 75,
                    height: 55,
                    depth: 110,
                    color: ['#ff6b6b', '#feca57', '#54a0ff', '#a29bfe', '#ff9ff3'][Math.floor(Math.random()*5)],
                    type: 'car'
                });
            }
        } else if (this.type === 'water') {
            this.speed = 4;
            const count = 2;
            for(let i=0; i<count; i++) {
                this.logs.push({
                    x: (Math.random() * 700) - 350,
                    z: i * 220,
                    width: 75,
                    depth: 150
                });
            }
        }
    }

    determineType(z) {
        if (z < 0) return 'grass'; 
        const mod = z % 7;
        if (mod < 2) return 'grass';
        if (mod < 4) return 'road';
        if (mod < 5) return 'water';
        return 'grass';
    }

    update() {
        if (this.type === 'road') {
            this.traffic.forEach(car => {
                car.x += this.speed;
                if (this.speed > 0 && car.x > 600) car.x = -600;
                if (this.speed < 0 && car.x < -600) car.x = 600;
            });
        } else if (this.type === 'water') {
            this.logs.forEach(log => {
                log.x += this.speed;
                if (log.x > 600) log.x = -600;
            });
        }
    }

    draw() {
        const leftX = -600;
        const rightX = 600;
        
        // Project corners of the lane slab
        const pFrontLeft = project(leftX, 0, this.z);
        const pFrontRight = project(rightX, 0, this.z);
        const pBackLeft = project(leftX, 0, this.z + CONFIG.laneSize);
        const pBackRight = project(rightX, 0, this.z + CONFIG.laneSize);
        
        const pBotFrontLeft = project(leftX, -CONFIG.laneHeight, this.z);
        const pBotFrontRight = project(rightX, -CONFIG.laneHeight, this.z);
        const pBotBackLeft = project(leftX, -CONFIG.laneHeight, this.z + CONFIG.laneSize);
        const pBotBackRight = project(rightX, -CONFIG.laneHeight, this.z + CONFIG.laneSize);

        if (!pFrontLeft || !pBackLeft) return;

        // 1. Side Face (Depth)
        ctx.beginPath();
        ctx.moveTo(pFrontLeft.x, pFrontLeft.y);
        ctx.lineTo(pFrontRight.x, pFrontRight.y);
        ctx.lineTo(pBotFrontRight.x, pBotFrontRight.y);
        ctx.lineTo(pBotFrontLeft.x, pBotFrontLeft.y);
        ctx.closePath();
        
        let sideColor, topColor;
        if (this.type === 'grass') {
            const isDark = Math.floor(this.zIndex) % 2 !== 0;
            sideColor = isDark ? CONFIG.colors.grassDarkSide : CONFIG.colors.grassSide;
            topColor = isDark ? CONFIG.colors.grassDarkTop : CONFIG.colors.grassTop;
        } else if (this.type === 'road') {
            sideColor = CONFIG.colors.roadSide;
            topColor = CONFIG.colors.roadTop;
        } else {
            sideColor = CONFIG.colors.waterSide;
            topColor = CONFIG.colors.waterTop;
        }
        
        ctx.fillStyle = sideColor;
        ctx.fill();

        // 2. Top Face
        ctx.beginPath();
        ctx.moveTo(pFrontLeft.x, pFrontLeft.y);
        ctx.lineTo(pFrontRight.x, pFrontRight.y);
        ctx.lineTo(pBackRight.x, pBackRight.y);
        ctx.lineTo(pBackLeft.x, pBackLeft.y);
        ctx.closePath();
        ctx.fillStyle = topColor;
        ctx.fill();

        // Details
        if (this.type === 'road') {
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 4 * pFrontLeft.scale;
            ctx.setLineDash([30 * pFrontLeft.scale, 40 * pFrontLeft.scale]);
            ctx.beginPath();
            const midYFront = (pFrontLeft.y + pFrontRight.y)/2;
            const midXFront = (pFrontLeft.x + pFrontRight.x)/2;
            const midYBack = (pBackLeft.y + pBackRight.y)/2;
            const midXBack = (pBackLeft.x + pBackRight.x)/2;
            ctx.moveTo(midXFront, midYFront);
            ctx.lineTo(midXBack, midYBack);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // Draw Objects
        if (this.type === 'road') this.traffic.forEach(car => this.drawCar(car, pFrontLeft.scale));
        if (this.type === 'water') this.logs.forEach(log => this.drawLog(log, pFrontLeft.scale));
    }

    drawCar(car, scale) {
        const cx = car.x;
        const cz = this.z + car.z;
        const w = car.width;
        const h = car.height;
        const d = car.depth;
        const p = (x, y, z) => project(x, y, z);

        // Vertices
        // Base (y=0)
        const bfl = p(cx - w/2, 0, cz);
        const bfr = p(cx + w/2, 0, cz);
        const bbr = p(cx + w/2, 0, cz + d);
        const bbl = p(cx - w/2, 0, cz + d);
        // Top (y=h)
        const tfl = p(cx - w/2, h, cz);
        const tfr = p(cx + w/2, h, cz);
        const tbr = p(cx + w/2, h, cz + d);
        const tbl = p(cx - w/2, h, cz + d);

        if (!bfl) return;

        // 1. Shadow (Grounded)
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.moveTo(bfl.x, bfl.y); ctx.lineTo(bfr.x, bfr.y);
        ctx.lineTo(bbr.x, bbr.y); ctx.lineTo(bbl.x, bbl.y);
        ctx.fill();

        // Draw Car Body
        // Top
        ctx.fillStyle = car.color;
        ctx.beginPath();
        ctx.moveTo(tfl.x, tfl.y); ctx.lineTo(tfr.x, tfr.y);
        ctx.lineTo(tbr.x, tbr.y); ctx.lineTo(tbl.x, tbl.y);
        ctx.fill();

        // Right Side
        ctx.fillStyle = darken(car.color, 40);
        ctx.beginPath();
        ctx.moveTo(bfr.x, bfr.y); ctx.lineTo(bbr.x, bbr.y);
        ctx.lineTo(tbr.x, tbr.y); ctx.lineTo(tfr.x, tfr.y);
        ctx.fill();

        // Left Side
        ctx.fillStyle = darken(car.color, 60);
        ctx.beginPath();
        ctx.moveTo(bfl.x, bfl.y); ctx.lineTo(bbl.x, bbl.y);
        ctx.lineTo(tbl.x, tbl.y); ctx.lineTo(tfl.x, tfl.y);
        ctx.fill();

        // Front
        ctx.fillStyle = darken(car.color, 20);
        ctx.beginPath();
        ctx.moveTo(bfl.x, bfl.y); ctx.lineTo(bfr.x, bfr.y);
        ctx.lineTo(tfr.x, tfr.y); ctx.lineTo(tfl.x, tfl.y);
        ctx.fill();

        // Details: Windows (Windshield)
        ctx.fillStyle = 'rgba(223, 230, 233, 0.8)';
        ctx.beginPath();
        const winMargin = 10 * scale;
        ctx.moveTo(tfl.x + winMargin, tfl.y + winMargin);
        ctx.lineTo(tfr.x - winMargin, tfr.y + winMargin);
        ctx.lineTo(tbr.x - winMargin, tbr.y + winMargin);
        ctx.lineTo(tbl.x + winMargin, tbl.y + winMargin);
        ctx.fill();

        // Details: Wheels (Attached to sides)
        ctx.fillStyle = '#1e272e';
        const wheelW = 18 * scale;
        const wheelD = 22 * scale;
        const wheelOffsetY = 5 * scale; // Slightly raised
        
        // Front Left
        ctx.fillRect(bfl.x - wheelW/2, bfl.y - wheelD/2 + wheelOffsetY, wheelW, wheelD);
        // Back Left
        ctx.fillRect(bbl.x - wheelW/2, bbl.y - wheelD/2 + wheelOffsetY, wheelW, wheelD);
        // Front Right
        ctx.fillRect(bfr.x - wheelW/2, bfr.y - wheelD/2 + wheelOffsetY, wheelW, wheelD);
        // Back Right
        ctx.fillRect(bbr.x - wheelW/2, bbr.y - wheelD/2 + wheelOffsetY, wheelW, wheelD);
    }

    drawLog(log, scale) {
        const cx = log.x;
        const cz = this.z + log.z;
        const w = log.width;
        const d = log.depth;
        const h = 25; 

        const p = (x, y, z) => project(x, y, z);
        
        const bfl = p(cx - w/2, 0, cz);
        const bfr = p(cx + w/2, 0, cz);
        const bbr = p(cx + w/2, 0, cz + d);
        const bbl = p(cx - w/2, 0, cz + d);
        
        const tfl = p(cx - w/2, h, cz);
        const tfr = p(cx + w/2, h, cz);
        const tbr = p(cx + w/2, h, cz + d);
        const tbl = p(cx - w/2, h, cz + d);

        if (!bfl) return;

        // Shadow on water
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.moveTo(bfl.x, bfl.y); ctx.lineTo(bfr.x, bfr.y);
        ctx.lineTo(bbr.x, bbr.y); ctx.lineTo(bbl.x, bbl.y);
        ctx.fill();

        // Log Body
        // Left Side
        ctx.fillStyle = '#8c623d'; 
        ctx.beginPath();
        ctx.moveTo(bfl.x, bfl.y); ctx.lineTo(bbl.x, bbl.y);
        ctx.lineTo(tbl.x, tbl.y); ctx.lineTo(tfl.x, tfl.y);
        ctx.fill();

        // Right Side
        ctx.fillStyle = '#b07c4e'; 
        ctx.beginPath();
        ctx.moveTo(bfr.x, bfr.y); ctx.lineTo(bbr.x, bbr.y);
        ctx.lineTo(tbr.x, tbr.y); ctx.lineTo(tfr.x, tfr.y);
        ctx.fill();

        // Top
        ctx.fillStyle = '#c9935d'; 
        ctx.beginPath();
        ctx.moveTo(tfl.x, tfl.y); ctx.lineTo(tfr.x, tfr.y);
        ctx.lineTo(tbr.x, tbr.y); ctx.lineTo(tbl.x, tbl.y);
        ctx.fill();

        // Bark Texture
        ctx.strokeStyle = 'rgba(0,0,0,0.1)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(tfl.x, tfl.y); ctx.lineTo(tbl.x, tbl.y);
        ctx.stroke();
    }
}

class Player {
    constructor() {
        this.x = 0;
        this.z = 0;
        this.targetX = 0;
        this.targetZ = 0;
        this.hopY = 0;
        this.hopVel = 0;
        this.isHopping = false;
        this.rotation = 0; // 0: up, 1: right, 2: down, 3: left
    }

    move(dx, dy) {
        if (this.isHopping) return;
        
        this.targetX += dx * CONFIG.laneSize; 
        this.targetZ += dy * CONFIG.laneSize; 
        
        if (dy > 0) this.rotation = 0; 
        if (dy < 0) this.rotation = 2; 
        if (dx > 0) this.rotation = 1; 
        if (dx < 0) this.rotation = 3;
        
        this.isHopping = true;
        this.hopVel = 16; 
        
        if (dy > 0) {
            state.score++;
            document.getElementById('current-score').innerText = state.score;
        }
    }

    update() {
        const speed = 0.25;
        this.x += (this.targetX - this.x) * speed;
        this.z += (this.targetZ - this.z) * speed;

        if (this.isHopping) {
            this.hopY += this.hopVel;
            this.hopVel -= 1.2; 
            
            if (this.hopY <= 0) {
                this.hopY = 0;
                this.isHopping = false;
                this.x = this.targetX;
                this.z = this.targetZ;
                state.playerZ = this.z; 
            }
        }
    }

    draw() {
        const x = this.x;
        const y = this.hopY;
        const z = this.z;

        // 1. Shadow (Always on ground, shrinks when hopping)
        const sP = project(x, 0, z);
        if (sP) {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            const shadowScale = Math.max(0.5, 1 - (this.hopY / 100));
            ctx.ellipse(sP.x, sP.y, 22 * sP.scale * shadowScale, 12 * sP.scale * shadowScale, 0, 0, Math.PI*2);
            ctx.fill();
        }

        // Helper for relative projection
        const p = (dx, dy, dz) => project(x + dx, y + dy, z + dz);

        // --- DRAW CHICKEN ---
        
        const bodySize = 28;
        const bodyH = 35;

        // Vertices
        const b0 = p(-bodySize, 0, -bodySize); 
        const b1 = p(bodySize, 0, -bodySize);  
        const b2 = p(bodySize, 0, bodySize);   
        const b3 = p(-bodySize, 0, bodySize);  
        const t0 = p(-bodySize, bodyH, -bodySize); 
        const t1 = p(bodySize, bodyH, -bodySize);  
        const t2 = p(bodySize, bodyH, bodySize);   
        const t3 = p(-bodySize, bodyH, bodySize);  

        if (!b0) return;

        // Legs
        ctx.strokeStyle = '#ff9f43';
        ctx.lineWidth = 6 * sP.scale;
        ctx.lineCap = 'round';
        const legL = p(-10, 0, 10);
        const legR = p(10, 0, 10);
        const footL = p(-10, -12, 18);
        const footR = p(10, -12, 18);
        
        if(legL && legR && footL && footR) {
            ctx.beginPath(); ctx.moveTo(legL.x, legL.y); ctx.lineTo(footL.x, footL.y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(legR.x, legR.y); ctx.lineTo(footR.x, footR.y); ctx.stroke();
        }

        // Body Faces
        // Top
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(t0.x, t0.y); ctx.lineTo(t1.x, t1.y);
        ctx.lineTo(t2.x, t2.y); ctx.lineTo(t3.x, t3.y);
        ctx.fill();

        // Right Side
        ctx.fillStyle = '#dfe6e9';
        ctx.beginPath();
        ctx.moveTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y);
        ctx.lineTo(t2.x, t2.y); ctx.lineTo(t1.x, t1.y);
        ctx.fill();

        // Front Face
        ctx.fillStyle = '#f5f6fa';
        ctx.beginPath();
        ctx.moveTo(b0.x, b0.y); ctx.lineTo(b1.x, b1.y);
        ctx.lineTo(t1.x, t1.y); ctx.lineTo(t0.x, t0.y);
        ctx.fill();

        // Head
        const headY = bodyH - 5;
        const headZ = -22; 
        const headR = 20;
        
        const headP = project(x, y + headY, z + headZ);
        
        // Comb
        const combP = project(x, y + headY + 16, z + headZ);
        const combL = project(x - 8, y + headY + 6, z + headZ);
        const combR = project(x + 8, y + headY + 6, z + headZ);
        
        if(combP && combL && combR) {
            ctx.fillStyle = '#ff4757';
            ctx.beginPath();
            ctx.moveTo(combP.x, combP.y);
            ctx.lineTo(combL.x, combL.y);
            ctx.lineTo(combR.x, combR.y);
            ctx.fill();
        }

        // Head Circle
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(headP.x, headP.y, headR * headP.scale, 0, Math.PI*2);
        ctx.fill();

        // Beak
        let beakDx = 0, beakDz = -28;
        if (this.rotation === 1) { beakDx = 22; beakDz = -12; }
        if (this.rotation === 3) { beakDx = -22; beakDz = -12; }
        if (this.rotation === 2) { beakDx = 0; beakDz = 28; }

        const beakTip = project(x + beakDx, y + headY - 4, z + headZ + beakDz);
        const beakBaseL = project(x + beakDx - 7, y + headY - 4, z + headZ + (beakDz > 0 ? 8 : -8));
        const beakBaseR = project(x + beakDx + 7, y + headY - 4, z + headZ + (beakDz > 0 ? 8 : -8));
        
        if(beakTip && beakBaseL) {
            ctx.fillStyle = '#ff9f43';
            ctx.beginPath();
            ctx.moveTo(beakTip.x, beakTip.y);
            ctx.lineTo(beakBaseL.x, beakBaseL.y);
            ctx.lineTo(beakBaseR.x, beakBaseR.y);
            ctx.fill();
        }

        // Eyes
        ctx.fillStyle = '#2d3436';
        const eyeOffset = 9;
        let e1x = x - eyeOffset, e2x = x + eyeOffset;
        let e1z = headZ - 16;
        
        if (this.rotation === 1) { e1x = x; e2x = x + 4; } 
        if (this.rotation === 3) { e1x = x - 4; e2x = x; } 
        if (this.rotation === 2) { e1z = headZ + 16; } 

        const eyeP1 = project(e1x, y + headY - 5, z + e1z);
        const eyeP2 = project(e2x, y + headY - 5, z + e1z);
        
        if(eyeP1 && eyeP2) {
            ctx.beginPath(); ctx.arc(eyeP1.x, eyeP1.y, 3.5*headP.scale, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(eyeP2.x, eyeP2.y, 3.5*headP.scale, 0, Math.PI*2); ctx.fill();
        }
    }
}

// --- INITIALIZATION ---

const player = new Player();

function init() {
    resize();
    window.addEventListener('resize', resize);
    
    for (let i = -5; i < 25; i++) {
        state.lanes.push(new Lane(i));
    }

    window.addEventListener('keydown', (e) => {
        switch(e.key) {
            case 'ArrowUp': case 'w': player.move(0, 1); break;
            case 'ArrowDown': case 's': player.move(0, -1); break;
            case 'ArrowLeft': case 'a': player.move(-1, 0); break;
            case 'ArrowRight': case 'd': player.move(1, 0); break;
        }
    });

    document.querySelectorAll('.d-btn').forEach(btn => {
        const handleInput = (e) => {
            if(e.cancelable) e.preventDefault();
            const dir = btn.getAttribute('data-dir');
            if (dir === 'up') player.move(0, 1);
            if (dir === 'down') player.move(0, -1);
            if (dir === 'left') player.move(-1, 0);
            if (dir === 'right') player.move(1, 0);
        };
        btn.addEventListener('mousedown', handleInput);
        btn.addEventListener('touchstart', handleInput);
    });

    loop();
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    state.width = canvas.width;
    state.height = canvas.height;
    state.centerX = state.width / 2;
    state.centerY = state.height / 2 + 60; 
}

// --- GAME LOOP ---

function loop() {
    const grad = ctx.createLinearGradient(0, 0, 0, state.height);
    grad.addColorStop(0, CONFIG.colors.skyTop);
    grad.addColorStop(1, CONFIG.colors.skyBottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, state.width, state.height);

    player.update();
    state.lanes.forEach(lane => lane.update());

    const playerLaneIndex = Math.floor(player.z / CONFIG.laneSize);
    
    if (state.lanes[0].zIndex < playerLaneIndex - 5) {
        state.lanes.shift();
        const lastZ = state.lanes[state.lanes.length-1].zIndex;
        state.lanes.push(new Lane(lastZ + 1));
    }

    // Draw Lanes (Painter's Algorithm)
    for (let i = state.lanes.length - 1; i >= 0; i--) {
        const lane = state.lanes[i];
        if (lane.z < state.playerZ - CONFIG.cameraDist) continue;
        lane.draw();
    }

    // Draw Player
    player.draw();

    requestAnimationFrame(loop);
}

// Start
init();

</script>
