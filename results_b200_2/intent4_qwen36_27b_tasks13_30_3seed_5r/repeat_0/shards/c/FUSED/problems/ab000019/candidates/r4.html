<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactical AI Visualizer</title>
<style>
  :root {
    --bg-dark: #05070a;
    --grid-line: rgba(56, 189, 248, 0.05);
    
    --text-main: #e2e8f0;
    --text-muted: #64748b;
    
    --c-patrol: #0ea5e9;
    --c-alert: #fbbf24;
    --c-chase: #ef4444;
    --c-attack: #ffffff;
    --c-player: #10b981;
    
    --glass-bg: rgba(15, 23, 42, 0.6);
    --glass-border: rgba(255, 255, 255, 0.08);
    --font-mono: "SF Mono", "Menlo", "Consolas", "Monaco", monospace;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    margin: 0;
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: var(--font-ui);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
  }

  /* Tactical Grid Background */
  .grid-bg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 0;
    pointer-events: none;
  }
  
  /* Scanline Overlay for Tactical Feel */
  .scanlines {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
    background-size: 100% 4px;
    z-index: 5;
    pointer-events: none;
    opacity: 0.6;
  }

  canvas {
    position: absolute;
    top: 0; left: 0;
    z-index: 1;
    cursor: crosshair;
  }

  /* UI Overlay */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 20px;
    box-sizing: border-box;
  }

  /* Header & Branding */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    padding: 10px 16px;
    border-radius: 6px;
    border: 1px solid var(--glass-border);
    border-left: 3px solid var(--c-patrol);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  .brand-icon {
    color: var(--c-patrol);
  }

  .brand-text h1 {
    font-size: 13px; font-weight: 800; letter-spacing: 1px;
    text-transform: uppercase; margin: 0; color: #fff;
    font-family: var(--font-mono);
  }
  .brand-text p {
    font-size: 10px; color: var(--text-muted); margin: 0;
    font-family: var(--font-mono);
  }

  /* Compact Panels */
  .panel {
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 6px;
    padding: 12px;
    pointer-events: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .panel-title {
    font-size: 9px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--text-muted);
    margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
    font-family: var(--font-mono);
  }
  .panel-title::before {
    content: ''; display: block; width: 6px; height: 1px;
    background: var(--text-muted);
  }

  /* Legend */
  .legend-panel {
    display: flex; flex-direction: column; gap: 4px;
    min-width: 160px;
  }

  .legend-item {
    display: flex; align-items: center; gap: 10px;
    font-size: 11px; font-weight: 600; color: var(--text-main);
    padding: 4px 8px; border-radius: 4px;
    font-family: var(--font-mono);
    transition: background 0.2s;
  }
  .legend-item:hover { background: rgba(255,255,255,0.05); }

  .legend-icon {
    width: 12px; height: 12px; position: relative;
  }
  
  .li-patrol .legend-icon { border: 1px dashed var(--c-patrol); border-radius: 50%; }
  .li-alert .legend-icon { 
    background: transparent; color: var(--c-alert);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 14px; line-height: 10px;
  }
  .li-chase .legend-icon { 
    border: 1px solid var(--c-chase); transform: rotate(45deg); 
    border-radius: 2px; 
  }
  .li-attack .legend-icon { background: var(--c-attack); border-radius: 2px; box-shadow: 0 0 5px var(--c-attack); }

  /* Inspector */
  .inspector-panel {
    width: 260px;
    display: flex; flex-direction: column; gap: 12px;
  }

  .stat-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 4px;
  }

  .stat-label { 
    font-size: 10px; color: var(--text-muted); font-weight: 600; 
    text-transform: uppercase; letter-spacing: 0.5px; 
    font-family: var(--font-mono);
  }
  
  .stat-value { 
    font-family: var(--font-mono); font-weight: 700; 
    color: #fff; font-size: 13px; 
  }

  /* Bars */
  .bar-container {
    width: 100%; height: 3px; background: rgba(255,255,255,0.1);
    border-radius: 2px; overflow: hidden; margin-top: 2px;
  }
  .bar-fill {
    height: 100%; width: 100%; transition: width 0.2s linear, background-color 0.2s;
  }

  /* Pulse Animation for Critical */
  @keyframes pulse-text {
    0% { opacity: 1; text-shadow: 0 0 5px currentColor; }
    50% { opacity: 0.5; text-shadow: 0 0 0px currentColor; }
    100% { opacity: 1; text-shadow: 0 0 5px currentColor; }
  }
  
  .text-critical {
    color: var(--c-chase);
    animation: pulse-text 1s infinite;
  }

  /* Controls */
  .controls { display: flex; gap: 8px; margin-top: 4px; }
  .btn {
    flex: 1; background: rgba(255,255,255,0.03);
    border: 1px solid var(--glass-border); color: var(--text-muted);
    padding: 6px; font-size: 9px; font-weight: 700; text-transform: uppercase;
    cursor: pointer; transition: all 0.2s; text-align: center;
    border-radius: 4px; letter-spacing: 0.5px;
    font-family: var(--font-mono);
  }
  .btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .btn.active { border-color: var(--c-patrol); color: var(--c-patrol); background: rgba(14, 165, 233, 0.05); }
  .btn-reset:hover { border-color: var(--c-chase); color: var(--c-chase); }

  /* Instructions */
  .instructions {
    position: absolute; bottom: 20px; right: 20px;
    text-align: right; font-size: 10px; color: var(--text-muted);
    pointer-events: none;
    background: var(--glass-bg); padding: 10px 14px;
    border-radius: 4px; border: 1px solid var(--glass-border);
    font-family: var(--font-mono);
  }
  .key {
    display: inline-block; background: rgba(255,255,255,0.1);
    padding: 1px 4px; border-radius: 2px; margin: 0 1px;
    color: #fff; font-weight: bold; font-size: 9px; border-bottom: 1px solid rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

  <div class="grid-bg"></div>
  <div class="scanlines"></div>
  <canvas id="arena"></canvas>

  <div class="ui-layer">
    <header>
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Neural Tactics</h1>
          <p>AI Behavior Simulation v2.0</p>
        </div>
      </div>

      <div class="panel legend-panel">
        <div class="panel-title">AI State Legend</div>
        
        <div class="legend-item li-patrol">
          <div class="legend-icon"></div>
          <span style="color: var(--c-patrol)">PATROL</span>
        </div>
        <div class="legend-item li-alert">
          <div class="legend-icon">!</div>
          <span style="color: var(--c-alert)">ALERT</span>
        </div>
        <div class="legend-item li-chase">
          <div class="legend-icon"></div>
          <span style="color: var(--c-chase)">CHASE</span>
        </div>
        <div class="legend-item li-attack">
          <div class="legend-icon"></div>
          <span style="color: #fff">ATTACK</span>
        </div>
      </div>
    </header>

    <div style="display:flex; justify-content:space-between; align-items:flex-end;">
      <div class="panel inspector-panel">
        <div class="panel-title">Player Status</div>
        
        <div class="stat-row">
          <span class="stat-label">Integrity</span>
          <span class="stat-value" id="hp-val">100%</span>
        </div>
        <div class="bar-container">
          <div class="bar-fill" id="hp-bar" style="background-color: var(--c-player);"></div>
        </div>

        <div class="stat-row" style="margin-top: 8px;">
          <span class="stat-label">Threat Level</span>
          <span class="stat-value" id="threat-val" style="color: var(--c-patrol)">LOW</span>
        </div>
        <div class="bar-container">
          <div class="bar-fill" id="threat-bar" style="width: 0%; background-color: var(--c-patrol);"></div>
        </div>

        <div class="controls">
          <div class="btn active">WASD Move</div>
          <div class="btn btn-reset" id="btn-reset">Reset Sim</div>
        </div>
      </div>

      <div class="instructions">
        Use <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> to move<br>
        Observe AI state transitions
      </div>
    </div>
  </div>

<script>
/**
 * ENGINE & LOGIC
 */
const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d');
const ui = {
  hpVal: document.getElementById('hp-val'),
  hpBar: document.getElementById('hp-bar'),
  threatVal: document.getElementById('threat-val'),
  threatBar: document.getElementById('threat-bar'),
  resetBtn: document.getElementById('btn-reset')
};

// Configuration
const COLORS = {
  PATROL: '#0ea5e9',
  ALERT: '#fbbf24',
  CHASE: '#ef4444',
  ATTACK: '#ffffff',
  PLAYER: '#10b981',
  WALL: '#1e293b',
  WALL_BORDER: '#334155'
};

const STATES = {
  PATROL: 'PATROL',
  ALERT: 'ALERT',
  CHASE: 'CHASE',
  ATTACK: 'ATTACK'
};

// Game State
let width, height;
let player = { x: 0, y: 0, radius: 12, hp: 100, speed: 4 };
let enemies = [];
let walls = [];
let keys = {};
let time = 0;

// Initialize
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  initWorld();
}

function initWorld() {
  player.x = width * 0.2;
  player.y = height * 0.5;
  player.hp = 100;

  // Walls
  walls = [
    { x: width * 0.4, y: height * 0.2, w: 20, h: height * 0.3 },
    { x: width * 0.6, y: height * 0.5, w: 20, h: height * 0.3 },
    { x: width * 0.5, y: height * 0.5, w: 150, h: 20 },
    { x: width * 0.2, y: height * 0.2, w: 100, h: 100 }, 
    { x: width * 0.75, y: height * 0.2, w: 100, h: 100 }, 
  ];

  // Enemies - Enforcing specific states for demo
  enemies = [
    new Enemy(player.x + 60, player.y + 20, STATES.ATTACK),
    new Enemy(player.x - 150, player.y - 100, STATES.CHASE),
    new Enemy(player.x + 250, player.y - 150, STATES.ALERT),
    new Enemy(width * 0.8, height * 0.8, STATES.PATROL),
    new Enemy(width * 0.5, height * 0.9, STATES.PATROL),
  ];
}

class Enemy {
  constructor(x, y, state) {
    this.x = x;
    this.y = y;
    this.radius = 10;
    this.angle = Math.atan2(player.y - y, player.x - x);
    this.state = state;
    this.speed = 2.5;
    
    this.patrolPath = this.generatePatrolPath(x, y);
    this.currentWaypointIdx = 1;
    
    this.alertTimer = 0;
    this.attackCooldown = 0;
    this.sonarPulse = 0;
  }

  generatePatrolPath(x, y) {
    return [
      {x: x, y: y},
      {x: x + (Math.random() * 200 - 100), y: y + (Math.random() * 200 - 100)},
      {x: x + (Math.random() * 200 - 100), y: y + (Math.random() * 200 - 100)},
    ].map(p => ({
        x: Math.max(50, Math.min(width - 50, p.x)),
        y: Math.max(50, Math.min(height - 50, p.y))
    }));
  }

  update() {
    const distToPlayer = Math.hypot(player.x - this.x, player.y - this.y);
    const angleToPlayer = Math.atan2(player.y - this.y, player.x - this.x);
    
    // Raycasting for Vision
    let canSeePlayer = false;
    if (distToPlayer < 250) {
      let angleDiff = angleToPlayer - this.angle;
      while (angleDiff <= -Math.PI) angleDiff += Math.PI*2;
      while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
      
      if (Math.abs(angleDiff) < Math.PI / 3) {
        canSeePlayer = !checkWallCollision(this.x, this.y, player.x, player.y);
      }
    }

    // State Machine
    switch(this.state) {
      case STATES.PATROL:
        const targetWP = this.patrolPath[this.currentWaypointIdx];
        this.angle = Math.atan2(targetWP.y - this.y, targetWP.x - this.x);
        this.moveTowards(targetWP.x, targetWP.y);
        
        if (distToPlayer < 250 && canSeePlayer) {
          this.state = STATES.ALERT;
          this.alertTimer = 60; 
        } else if (Math.hypot(targetWP.x - this.x, targetWP.y - this.y) < 5) {
          this.currentWaypointIdx = (this.currentWaypointIdx + 1) % this.patrolPath.length;
        }
        break;

      case STATES.ALERT:
        this.angle = angleToPlayer;
        this.alertTimer--;
        if (this.alertTimer <= 0) {
          if (canSeePlayer) this.state = STATES.CHASE;
          else this.state = STATES.PATROL;
        }
        break;

      case STATES.CHASE:
        this.angle = angleToPlayer;
        if (canSeePlayer) {
          if (distToPlayer < 40) this.state = STATES.ATTACK;
          else this.moveTowards(player.x, player.y);
        } else {
          this.state = STATES.ALERT;
          this.alertTimer = 60;
        }
        break;

      case STATES.ATTACK:
        this.angle = angleToPlayer;
        this.attackCooldown--;
        this.sonarPulse++; 
        if (this.attackCooldown <= 0) {
          player.hp -= 5;
          this.attackCooldown = 60;
          createParticle(player.x, player.y, COLORS.ATTACK);
        }
        if (distToPlayer > 150) this.state = STATES.CHASE;
        break;
    }
  }

  moveTowards(tx, ty) {
    const dx = tx - this.x;
    const dy = ty - this.y;
    const dist = Math.hypot(dx, dy);
    
    if (dist > 0) {
      let nx = (dx / dist) * this.speed;
      let ny = (dy / dist) * this.speed;
      
      if (!checkCircleWallCollision(this.x + nx, this.y + ny, this.radius)) {
        this.x += nx;
        this.y += ny;
      } else {
        if (!checkCircleWallCollision(this.x + nx, this.y, this.radius)) this.x += nx;
        else if (!checkCircleWallCollision(this.x, this.y + ny, this.radius)) this.y += ny;
      }
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // --- VISUAL SYSTEM REFINEMENTS ---

    // 1. ATTACK RANGE: Dashed Red Line (Critique Fix #2)
    if (this.state === STATES.ATTACK) {
        ctx.save();
        ctx.translate(-this.x, -this.y); // World space
        
        // Pulsing ring
        const pulseSize = (this.sonarPulse % 30); // 0 to 30
        ctx.beginPath();
        ctx.arc(this.x, this.y, 40 + pulseSize, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 255, 255, ${0.8 - (pulseSize/30)})`;
        ctx.lineWidth = 1;
        ctx.stroke();

        // Static Dashed Attack Range
        ctx.beginPath();
        ctx.arc(this.x, this.y, 40, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(239, 68, 68, 0.8)`;
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
    }

    // 2. DETECTION CONES: Gradient Fade & Lower Opacity (Critique Fix #2)
    if (this.state !== STATES.PATROL) {
      ctx.save();
      ctx.rotate(this.angle);
      
      const isAttacking = this.state === STATES.ATTACK;
      const isChasing = this.state === STATES.CHASE;
      
      // Define Colors
      const mainColor = isAttacking ? '239, 68, 68' : (isChasing ? '239, 68, 68' : '251, 191, 36');
      
      // Create Radial Gradient for Fade
      const grad = ctx.createRadialGradient(0, 0, 10, 0, 0, 250);
      grad.addColorStop(0, `rgba(${mainColor}, 0.3)`); // 30% Opacity Center
      grad.addColorStop(0.7, `rgba(${mainColor}, 0.15)`);
      grad.addColorStop(1, `rgba(${mainColor}, 0)`); // 0% Opacity Edge
      
      ctx.fillStyle = grad;
      
      // Draw Cone
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, 250, -Math.PI/4, Math.PI/4);
      ctx.lineTo(0, 0);
      ctx.fill();
      ctx.restore();
    }

    // 3. PATROL PATH
    if (this.state === STATES.PATROL) {
        ctx.save();
        ctx.translate(-this.x, -this.y);
        ctx.strokeStyle = COLORS.PATROL;
        ctx.lineWidth = 2;
        ctx.lineDashOffset = -time * 2; 
        ctx.setLineDash([6, 6]);
        ctx.globalAlpha = 0.5;
        
        ctx.beginPath();
        this.patrolPath.forEach((p, i) => {
            if(i === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        });
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
    }

    // 4. CHASE LINE
    if (this.state === STATES.CHASE) {
        ctx.save();
        ctx.translate(-this.x, -this.y);
        ctx.strokeStyle = COLORS.CHASE;
        ctx.lineWidth = 2;
        ctx.lineDashOffset = -time * 4;
        ctx.setLineDash([8, 8]);
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(player.x, player.y);
        ctx.stroke();
        ctx.restore();
    }

    // Rotate Entity
    ctx.rotate(this.angle);

    // Body Shape
    ctx.fillStyle = this.getColor();
    ctx.shadowColor = this.getColor();
    ctx.shadowBlur = 10;
    
    ctx.beginPath();
    if (this.state === STATES.CHASE || this.state === STATES.ATTACK) {
        // Triangle
        ctx.moveTo(12, 0);
        ctx.lineTo(-8, 8);
        ctx.lineTo(-5, 0);
        ctx.lineTo(-8, -8);
    } else if (this.state === STATES.ALERT) {
        // Diamond
        ctx.moveTo(10, 0);
        ctx.lineTo(0, 8);
        ctx.lineTo(-10, 0);
        ctx.lineTo(0, -8);
    } else {
        // Circle
        ctx.arc(0, 0, 8, 0, Math.PI*2);
    }
    ctx.closePath();
    ctx.fill();

    // ALERT SPECIFIC: Exclamation Mark (Critique Fix #1)
    if (this.state === STATES.ALERT) {
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.moveTo(-1, -4);
        ctx.lineTo(1, -4);
        ctx.lineTo(1, 2);
        ctx.lineTo(-1, 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 5, 1.5, 0, Math.PI*2);
        ctx.fill();
    }

    ctx.restore();

    // 5. STATE LABELS: Monospace & High Visibility (Critique Fix #5)
    ctx.save();
    ctx.shadowBlur = 0;
    ctx.font = 'bold 10px "SF Mono", "Menlo", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    const label = this.state;
    const textWidth = ctx.measureText(label).width;
    
    // Background pill
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.beginPath();
    ctx.roundRect(this.x - textWidth/2 - 4, this.y - 24, textWidth + 8, 14, 2);
    ctx.fill();
    
    // Text
    ctx.fillStyle = this.getColor();
    ctx.fillText(label, this.x, this.y - 17);
    ctx.restore();
  }

  getColor() {
    switch(this.state) {
      case STATES.PATROL: return COLORS.PATROL;
      case STATES.ALERT: return COLORS.ALERT;
      case STATES.CHASE: return COLORS.CHASE;
      case STATES.ATTACK: return COLORS.ATTACK;
      default: return '#fff';
    }
  }
}

// Helpers
function checkWallCollision(x1, y1, x2, y2) {
  for (let w of walls) {
    if (x1 < w.x + w.w && x2 > w.x && y1 < w.y + w.h && y2 > w.y) return true;
    if (x2 < w.x + w.w && x1 > w.x && y2 < w.y + w.h && y1 > w.y) return true;
  }
  return false;
}

function checkCircleWallCollision(x, y, r) {
  for (let w of walls) {
    let testX = x;
    let testY = y;
    if (x < w.x) testX = w.x;
    else if (x > w.x + w.w) testX = w.x + w.w;
    if (y < w.y) testY = w.y;
    else if (y > w.y + w.h) testY = w.y + w.h;
    let distX = x - testX;
    let distY = y - testY;
    let distance = Math.sqrt((distX*distX) + (distY*distY));
    if (distance <= r) return true;
  }
  return false;
}

let particles = [];
function createParticle(x, y, color) {
  particles.push({x, y, color, life: 20, size: 4});
}

// Input Handling
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('resize', resize);
ui.resetBtn.addEventListener('click', initWorld);

// Main Loop
function loop() {
  time++;
  ctx.clearRect(0, 0, width, height);

  // Update Player
  let dx = 0, dy = 0;
  if (keys['w']) dy = -1;
  if (keys['s']) dy = 1;
  if (keys['a']) dx = -1;
  if (keys['d']) dx = 1;

  if (dx !== 0 || dy !== 0) {
    let len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    let nextX = player.x + dx * player.speed;
    let nextY = player.y + dy * player.speed;
    if (!checkCircleWallCollision(nextX, player.y, player.radius)) player.x = nextX;
    if (!checkCircleWallCollision(player.x, nextY, player.radius)) player.y = nextY;
  }

  // Draw Walls (Critique Fix #4: Inner Shadow/Depth)
  for (let w of walls) {
    ctx.fillStyle = COLORS.WALL;
    ctx.fillRect(w.x, w.y, w.w, w.h);
    
    // Inner Highlight (Top/Left)
    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.fillRect(w.x, w.y, w.w, 2);
    ctx.fillRect(w.x, w.y, 2, w.h);
    
    // Inner Shadow (Bottom/Right)
    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.fillRect(w.x, w.y + w.h - 2, w.w, 2);
    ctx.fillRect(w.x + w.w - 2, w.y, 2, w.h);
    
    // Border
    ctx.strokeStyle = COLORS.WALL_BORDER;
    ctx.lineWidth = 1;
    ctx.strokeRect(w.x, w.y, w.w, w.h);
  }

  // Update & Draw Enemies
  let threatScore = 0;
  for (let e of enemies) {
    e.update();
    e.draw();
    if (e.state === STATES.ATTACK) threatScore += 40;
    else if (e.state === STATES.CHASE) threatScore += 20;
    else if (e.state === STATES.ALERT) threatScore += 10;
  }

  // Draw Player (Critique Fix #3: Triangle Icon)
  ctx.save();
  ctx.translate(player.x, player.y);
  // Calculate facing direction based on movement or last movement
  if (dx !== 0 || dy !== 0) {
      ctx.rotate(Math.atan2(dy, dx));
  }
  
  ctx.shadowColor = COLORS.PLAYER;
  ctx.shadowBlur = 15;
  ctx.fillStyle = COLORS.PLAYER;
  
  ctx.beginPath();
  // Triangle pointing right
  ctx.moveTo(12, 0);
  ctx.lineTo(-8, 8);
  ctx.lineTo(-4, 0);
  ctx.lineTo(-8, -8);
  ctx.closePath();
  ctx.fill();
  
  // Inner detail
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, 0, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 20;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (20 - p.life), 0, Math.PI * 2);
    ctx.fill();
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  ctx.globalAlpha = 1;

  // Update UI
  ui.hpVal.textContent = Math.max(0, player.hp) + '%';
  ui.hpBar.style.width = Math.max(0, player.hp) + '%';
  
  if (player.hp < 30) {
      ui.hpBar.style.backgroundColor = COLORS.CHASE;
      ui.hpVal.classList.add('text-critical');
  } else {
      ui.hpBar.style.backgroundColor = COLORS.PLAYER;
      ui.hpVal.classList.remove('text-critical');
  }

  // Update Threat UI
  const threatPct = Math.min(100, Math.max(0, threatScore));
  ui.threatBar.style.width = threatPct + '%';
  
  if (threatPct > 60) {
      ui.threatVal.textContent = "CRITICAL";
      ui.threatVal.style.color = COLORS.ATTACK;
      ui.threatBar.style.backgroundColor = COLORS.ATTACK;
      ui.threatVal.classList.add('text-critical');
  } else {
      ui.threatVal.classList.remove('text-critical');
      if (threatPct > 30) {
          ui.threatVal.textContent = "HIGH";
          ui.threatVal.style.color = COLORS.CHASE;
          ui.threatBar.style.backgroundColor = COLORS.CHASE;
      } else if (threatPct > 0) {
          ui.threatVal.textContent = "MODERATE";
          ui.threatVal.style.color = COLORS.ALERT;
          ui.threatBar.style.backgroundColor = COLORS.ALERT;
      } else {
          ui.threatVal.textContent = "LOW";
          ui.threatVal.style.color = COLORS.PATROL;
          ui.threatBar.style.backgroundColor = COLORS.PATROL;
      }
  }

  requestAnimationFrame(loop);
}

// Start
resize();
loop();

</script>
</body>
