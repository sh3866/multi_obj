<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactical AI Behavior Visualizer</title>
<style>
  :root {
    --bg-dark: #05080a;
    --grid-line: #151e24;
    --text-main: #aebac5;
    --text-dim: #4b5c67;
    --accent-blue: #3b82f6;
    --accent-green: #10b981;
    --accent-amber: #f59e0b;
    --accent-red: #ef4444;
    --panel-bg: rgba(10, 15, 20, 0.85);
    --border-color: rgba(255, 255, 255, 0.08);
  }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
  }

  /* Background Grid Pattern */
  .grid-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
    pointer-events: none;
  }

  /* Canvas Layer */
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
    cursor: crosshair;
  }

  /* UI Overlay Container */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none; /* Let clicks pass to canvas */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 20px;
    box-sizing: border-box;
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: auto;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-icon {
    width: 32px;
    height: 32px;
    background: var(--accent-blue);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
  }

  .brand-text h1 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 0;
    color: #fff;
  }

  .brand-text p {
    font-size: 10px;
    color: var(--text-dim);
    margin: 0;
    letter-spacing: 0.5px;
  }

  /* Panels */
  .panel {
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 16px;
    pointer-events: auto;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  /* Legend Panel (Top Right) */
  .legend-panel {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 180px;
  }

  .panel-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 8px;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 4px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    font-weight: 500;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  /* Inspector Panel (Bottom Left) */
  .inspector-panel {
    width: 280px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
  }

  .stat-label { color: var(--text-dim); }
  .stat-value { font-family: 'Courier New', monospace; font-weight: bold; color: #fff; }

  .health-bar-container {
    width: 100%;
    height: 6px;
    background: #1a2026;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 4px;
  }

  .health-fill {
    height: 100%;
    background: var(--accent-green);
    width: 100%;
    transition: width 0.3s ease, background-color 0.3s ease;
    box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
  }

  .controls {
    margin-top: 8px;
    display: flex;
    gap: 8px;
  }

  .btn {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 6px;
    font-size: 11px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .btn:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.2);
    color: #fff;
  }

  .btn.active {
    background: var(--accent-blue);
    border-color: var(--accent-blue);
    color: #fff;
    box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
  }

  /* Instructions */
  .instructions {
    position: absolute;
    bottom: 20px;
    right: 20px;
    text-align: right;
    font-size: 11px;
    color: var(--text-dim);
    pointer-events: none;
  }
  .key {
    display: inline-block;
    background: rgba(255,255,255,0.1);
    padding: 2px 6px;
    border-radius: 3px;
    margin: 0 2px;
    color: #fff;
    font-weight: bold;
  }

</style>
</head>
<body>

  <div class="grid-bg"></div>
  <canvas id="arena"></canvas>

  <div class="ui-layer">
    <header>
      <div class="brand">
        <div class="brand-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Neural Tactics</h1>
          <p>AI Behavior State Visualization</p>
        </div>
      </div>

      <div class="panel legend-panel">
        <div class="panel-title">AI States</div>
        <div class="legend-item"><div class="dot" style="background:var(--accent-blue)"></div>Patrol</div>
        <div class="legend-item"><div class="dot" style="background:var(--accent-amber)"></div>Alert</div>
        <div class="legend-item"><div class="dot" style="background:var(--accent-red)"></div>Chase</div>
        <div class="legend-item"><div class="dot" style="background:#fff; box-shadow:0 0 5px #fff"></div>Attack</div>
      </div>
    </header>

    <div style="display:flex; justify-content:space-between; align-items:flex-end;">
      <div class="panel inspector-panel">
        <div class="panel-title">Player Inspector</div>
        
        <div class="stat-row">
          <span class="stat-label">Health</span>
          <span class="stat-value" id="hp-val">100%</span>
        </div>
        <div class="health-bar-container">
          <div class="health-fill" id="hp-bar"></div>
        </div>

        <div class="stat-row">
          <span class="stat-label">Position</span>
          <span class="stat-value" id="pos-val">0, 0</span>
        </div>

        <div class="stat-row">
          <span class="stat-label">Velocity</span>
          <span class="stat-value" id="vel-val">0.0</span>
        </div>

        <div class="controls">
          <div class="btn active" id="btn-move">Move (WASD)</div>
          <div class="btn" id="btn-reset">Reset</div>
        </div>
      </div>

      <div class="instructions">
        Use <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> to move player<br>
        Observe AI state transitions
      </div>
    </div>
  </div>

<script>
/**
 * ENGINE & LOGIC
 */
const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d');
const ui = {
  hpVal: document.getElementById('hp-val'),
  hpBar: document.getElementById('hp-bar'),
  posVal: document.getElementById('pos-val'),
  velVal: document.getElementById('vel-val'),
  resetBtn: document.getElementById('btn-reset')
};

// Configuration
const COLORS = {
  PATROL: '#3b82f6',
  ALERT: '#f59e0b',
  CHASE: '#ef4444',
  ATTACK: '#ffffff',
  PLAYER: '#10b981',
  WALL: '#1e293b',
  WALL_BORDER: '#334155'
};

const STATES = {
  PATROL: 'PATROL',
  ALERT: 'ALERT',
  CHASE: 'CHASE',
  ATTACK: 'ATTACK'
};

// Game State
let width, height;
let player = { x: 0, y: 0, radius: 12, hp: 100, speed: 4 };
let enemies = [];
let walls = [];
let keys = {};

// Initialize
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  initWorld();
}

function initWorld() {
  // Player start
  player.x = width * 0.2;
  player.y = height * 0.5;
  player.hp = 100;

  // Walls
  walls = [
    { x: width * 0.4, y: height * 0.2, w: 20, h: height * 0.3 },
    { x: width * 0.6, y: height * 0.5, w: 20, h: height * 0.3 },
    { x: width * 0.5, y: height * 0.5, w: 150, h: 20 },
    { x: width * 0.2, y: height * 0.2, w: 100, h: 100 }, // Box
    { x: width * 0.75, y: height * 0.2, w: 100, h: 100 }, // Box
  ];

  // Enemies
  enemies = [
    new Enemy(width * 0.5, height * 0.1, STATES.PATROL),
    new Enemy(width * 0.8, height * 0.8, STATES.PATROL),
    new Enemy(width * 0.85, height * 0.2, STATES.PATROL),
    new Enemy(width * 0.15, height * 0.8, STATES.PATROL),
    new Enemy(width * 0.5, height * 0.9, STATES.PATROL),
  ];
}

class Enemy {
  constructor(x, y, state) {
    this.x = x;
    this.y = y;
    this.radius = 10;
    this.angle = 0;
    this.state = state;
    this.speed = 2.5;
    
    // Patrol Logic
    this.patrolTarget = this.getRandomPatrolPoint();
    this.patrolTimer = 0;
    
    // Alert Logic
    this.alertTimer = 0;
    this.alertPos = {x: 0, y: 0};

    // Attack Logic
    this.attackCooldown = 0;
  }

  getRandomPatrolPoint() {
    return {
      x: Math.random() * (width - 100) + 50,
      y: Math.random() * (height - 100) + 50
    };
  }

  update() {
    const distToPlayer = Math.hypot(player.x - this.x, player.y - this.y);
    const angleToPlayer = Math.atan2(player.y - this.y, player.x - this.x);
    
    // Raycasting for Vision
    let canSeePlayer = false;
    if (distToPlayer < 250) {
      // Check if within FOV (90 degrees)
      let angleDiff = angleToPlayer - this.angle;
      // Normalize angle
      while (angleDiff <= -Math.PI) angleDiff += Math.PI*2;
      while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
      
      if (Math.abs(angleDiff) < Math.PI / 3) {
        // Check walls
        canSeePlayer = !checkWallCollision(this.x, this.y, player.x, player.y);
      }
    }

    // State Machine
    switch(this.state) {
      case STATES.PATROL:
        this.angle = Math.atan2(this.patrolTarget.y - this.y, this.patrolTarget.x - this.x);
        this.moveTowards(this.patrolTarget.x, this.patrolTarget.y);
        
        if (distToPlayer < 250 && canSeePlayer) {
          this.state = STATES.ALERT;
          this.alertTimer = 60; // Frames to wait
          this.alertPos = {x: player.x, y: player.y};
        } else if (Math.hypot(this.patrolTarget.x - this.x, this.patrolTarget.y - this.y) < 5) {
          this.patrolTarget = this.getRandomPatrolPoint();
        }
        break;

      case STATES.ALERT:
        this.angle = angleToPlayer;
        this.alertTimer--;
        if (this.alertTimer <= 0) {
          if (canSeePlayer) this.state = STATES.CHASE;
          else this.state = STATES.PATROL;
        }
        break;

      case STATES.CHASE:
        this.angle = angleToPlayer;
        if (canSeePlayer) {
          if (distToPlayer < 40) {
            this.state = STATES.ATTACK;
          } else {
            this.moveTowards(player.x, player.y);
          }
        } else {
          this.state = STATES.ALERT;
          this.alertTimer = 60;
        }
        break;

      case STATES.ATTACK:
        this.angle = angleToPlayer;
        this.attackCooldown--;
        if (this.attackCooldown <= 0) {
          player.hp -= 10;
          this.attackCooldown = 60;
          // Visual pulse
          createParticle(player.x, player.y, COLORS.ATTACK);
        }
        if (distToPlayer > 150) {
          this.state = STATES.CHASE;
        }
        break;
    }
  }

  moveTowards(tx, ty) {
    const dx = tx - this.x;
    const dy = ty - this.y;
    const dist = Math.hypot(dx, dy);
    
    if (dist > 0) {
      // Simple collision avoidance
      let nx = (dx / dist) * this.speed;
      let ny = (dy / dist) * this.speed;
      
      // Wall Collision Check (Very simple)
      if (!checkCircleWallCollision(this.x + nx, this.y + ny, this.radius)) {
        this.x += nx;
        this.y += ny;
      } else {
        // Slide along wall
        if (!checkCircleWallCollision(this.x + nx, this.y, this.radius)) this.x += nx;
        else if (!checkCircleWallCollision(this.x, this.y + ny, this.radius)) this.y += ny;
      }
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Draw Detection Cone
    if (this.state !== STATES.PATROL) {
      ctx.fillStyle = this.state === STATES.CHASE ? 'rgba(239, 68, 68, 0.2)' : 'rgba(245, 158, 11, 0.2)';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, 250, this.angle - Math.PI/3, this.angle + Math.PI/3);
      ctx.lineTo(0, 0);
      ctx.fill();
    }

    // Rotate entity
    ctx.rotate(this.angle);

    // Body
    ctx.fillStyle = this.getColor();
    ctx.beginPath();
    ctx.moveTo(10, 0);
    ctx.lineTo(-8, 7);
    ctx.lineTo(-5, 0);
    ctx.lineTo(-8, -7);
    ctx.closePath();
    ctx.fill();
    
    // Glow
    ctx.shadowColor = this.getColor();
    ctx.shadowBlur = 15;
    ctx.fill();

    ctx.restore();

    // Draw State Label
    ctx.fillStyle = this.getColor();
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(this.state, this.x, this.y - 20);
  }

  getColor() {
    switch(this.state) {
      case STATES.PATROL: return COLORS.PATROL;
      case STATES.ALERT: return COLORS.ALERT;
      case STATES.CHASE: return COLORS.CHASE;
      case STATES.ATTACK: return COLORS.ATTACK;
      default: return '#fff';
    }
  }
}

// Helpers
function checkWallCollision(x1, y1, x2, y2) {
  for (let w of walls) {
    // Simple line vs AABB
    // (Simplified for demo: check if line passes through wall rect bounds)
    if (x1 < w.x + w.w && x2 > w.x && y1 < w.y + w.h && y2 > w.y) return true;
    // Reverse check
    if (x2 < w.x + w.w && x1 > w.x && y2 < w.y + w.h && y1 > w.y) return true;
  }
  return false;
}

function checkCircleWallCollision(x, y, r) {
  for (let w of walls) {
    // Closest point on rect to circle center
    let testX = x;
    let testY = y;

    if (x < w.x) testX = w.x;
    else if (x > w.x + w.w) testX = w.x + w.w;

    if (y < w.y) testY = w.y;
    else if (y > w.y + w.h) testY = w.y + w.h;

    let distX = x - testX;
    let distY = y - testY;
    let distance = Math.sqrt((distX*distX) + (distY*distY));

    if (distance <= r) return true;
  }
  return false;
}

let particles = [];
function createParticle(x, y, color) {
  particles.push({x, y, color, life: 20, size: 5});
}

// Input Handling
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('resize', resize);
ui.resetBtn.addEventListener('click', initWorld);

// Main Loop
function loop() {
  ctx.clearRect(0, 0, width, height);

  // Update Player
  let dx = 0, dy = 0;
  if (keys['w']) dy = -1;
  if (keys['s']) dy = 1;
  if (keys['a']) dx = -1;
  if (keys['d']) dx = 1;

  // Normalize
  if (dx !== 0 || dy !== 0) {
    let len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    
    let nextX = player.x + dx * player.speed;
    let nextY = player.y + dy * player.speed;
    
    if (!checkCircleWallCollision(nextX, player.y, player.radius)) player.x = nextX;
    if (!checkCircleWallCollision(player.x, nextY, player.radius)) player.y = nextY;
  }

  // Draw Walls
  ctx.fillStyle = COLORS.WALL;
  ctx.strokeStyle = COLORS.WALL_BORDER;
  ctx.lineWidth = 2;
  for (let w of walls) {
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeRect(w.x, w.y, w.w, w.h);
  }

  // Update & Draw Enemies
  for (let e of enemies) {
    e.update();
    e.draw();
  }

  // Draw Player
  ctx.save();
  ctx.translate(player.x, player.y);
  
  // Player Glow
  ctx.shadowColor = COLORS.PLAYER;
  ctx.shadowBlur = 20;
  
  ctx.fillStyle = COLORS.PLAYER;
  ctx.beginPath();
  ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
  ctx.fill();
  
  // Inner detail
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, 0, player.radius * 0.4, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.restore();

  // Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 20;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (20 - p.life), 0, Math.PI * 2);
    ctx.fill();
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  ctx.globalAlpha = 1;

  // Update UI
  ui.posVal.textContent = `${Math.round(player.x)}, ${Math.round(player.y)}`;
  let speed = Math.hypot(keys['w']?1:0 + (keys['s']?1:0), keys['a']?1:0 + (keys['d']?1:0));
  ui.velVal.textContent = (speed * player.speed).toFixed(1);
  
  ui.hpVal.textContent = Math.max(0, player.hp) + '%';
  ui.hpBar.style.width = Math.max(0, player.hp) + '%';
  if (player.hp < 30) ui.hpBar.style.backgroundColor = COLORS.CHASE;
  else ui.hpBar.style.backgroundColor = COLORS.PLAYER;

  requestAnimationFrame(loop);
}

// Start
resize();
loop();

</script>
</body>
</html>
