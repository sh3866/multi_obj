<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactical AI Behavior Visualizer</title>
<style>
  :root {
    --bg-dark: #020406;
    --bg-panel: rgba(8, 12, 16, 0.85);
    --grid-line: rgba(30, 41, 59, 0.6);
    --grid-accent: rgba(56, 189, 248, 0.1);
    
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --text-dim: #475569;
    
    --accent-blue: #38bdf8;   /* Patrol */
    --accent-amber: #fbbf24;  /* Alert */
    --accent-red: #f43f5e;    /* Chase/Attack */
    --accent-green: #10b981;  /* Player */
    --accent-white: #ffffff;  /* Attack Focus */
    
    --border-light: rgba(255, 255, 255, 0.1);
    --border-glow: rgba(56, 189, 248, 0.3);
    
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Menlo", "Monaco", "Courier New", monospace;
  }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: var(--font-ui);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
  }

  /* Multi-layer Grid Background */
  .grid-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
    pointer-events: none;
  }
  
  .grid-bg::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at center, transparent 0%, var(--bg-dark) 90%);
    z-index: 1;
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
    cursor: crosshair;
  }

  /* UI Overlay */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px;
    box-sizing: border-box;
  }

  /* Header & Branding */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--bg-panel);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 12px 20px;
    border-radius: 8px;
    border: 1px solid var(--border-light);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  .brand-icon {
    width: 40px;
    height: 40px;
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid var(--accent-blue);
    color: var(--accent-blue);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
  }

  .brand-text h1 {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 0;
    color: #fff;
  }

  .brand-text p {
    font-size: 12px;
    color: var(--text-muted);
    margin: 2px 0 0 0;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* Panels Generic */
  .panel {
    background: var(--bg-panel);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 16px;
    pointer-events: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .panel-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .panel-title::before {
    content: '';
    display: block;
    width: 6px;
    height: 6px;
    background: var(--accent-blue);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent-blue);
  }

  /* Legend Panel */
  .legend-panel {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 220px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-main);
    padding: 6px 8px;
    border-radius: 6px;
    transition: background 0.2s;
  }
  
  .legend-item:hover {
    background: rgba(255,255,255,0.05);
  }

  /* Unified Legend Icons */
  .legend-icon {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  
  .legend-icon::after {
    content: '';
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 8px currentColor;
  }

  /* Inspector Panel */
  .inspector-panel {
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .stat-label { 
    font-size: 12px; 
    color: var(--text-muted); 
    font-weight: 500; 
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  
  .stat-value { 
    font-family: var(--font-mono); 
    font-weight: 700; 
    color: #fff; 
    font-size: 14px;
    letter-spacing: 0.5px;
  }

  .health-bar-container {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 6px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
  }

  .health-fill {
    height: 100%;
    background: var(--accent-green);
    width: 100%;
    transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s ease;
    box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
  }

  .controls {
    margin-top: 4px;
    display: flex;
    gap: 10px;
  }

  .btn {
    flex: 1;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border-light);
    color: var(--text-muted);
    padding: 10px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    border-radius: 6px;
    letter-spacing: 0.5px;
  }

  .btn:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.3);
    color: #fff;
  }

  .btn.active {
    background: rgba(56, 189, 248, 0.1);
    border-color: var(--accent-blue);
    color: var(--accent-blue);
    box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
  }

  .btn-reset {
    border-color: rgba(244, 63, 94, 0.3);
    color: var(--accent-red);
  }
  .btn-reset:hover {
    background: rgba(244, 63, 94, 0.15);
    border-color: var(--accent-red);
    box-shadow: 0 0 15px rgba(244, 63, 94, 0.2);
  }

  /* Instructions */
  .instructions {
    position: absolute;
    bottom: 24px;
    right: 24px;
    text-align: right;
    font-size: 12px;
    color: var(--text-muted);
    pointer-events: none;
    background: var(--bg-panel);
    padding: 10px 14px;
    border-radius: 6px;
    border: 1px solid var(--border-light);
    backdrop-filter: blur(8px);
  }
  .key {
    display: inline-block;
    background: rgba(255,255,255,0.1);
    padding: 3px 6px;
    border-radius: 4px;
    margin: 0 2px;
    color: #fff;
    font-family: var(--font-mono);
    font-weight: bold;
    font-size: 10px;
    border-bottom: 2px solid rgba(0,0,0,0.3);
  }

</style>
</head>
<body>

  <div class="grid-bg"></div>
  <canvas id="arena"></canvas>

  <div class="ui-layer">
    <header>
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Neural Tactics</h1>
          <p>Behavioral State Simulator</p>
        </div>
      </div>

      <div class="panel legend-panel">
        <div class="panel-title">AI States Legend</div>
        
        <div class="legend-item">
          <div class="legend-icon" style="color: var(--accent-blue)"></div>
          <span style="color: var(--accent-blue)">Patrol</span>
        </div>
        <div class="legend-item">
          <div class="legend-icon" style="color: var(--accent-amber)"></div>
          <span style="color: var(--accent-amber)">Alert</span>
        </div>
        <div class="legend-item">
          <div class="legend-icon" style="color: var(--accent-red)"></div>
          <span style="color: var(--accent-red)">Chase</span>
        </div>
        <div class="legend-item">
          <div class="legend-icon" style="color: var(--accent-white)"></div>
          <span style="color: #fff; text-shadow: 0 0 5px rgba(255,255,255,0.5);">Attack</span>
        </div>
      </div>
    </header>

    <div style="display:flex; justify-content:space-between; align-items:flex-end;">
      <div class="panel inspector-panel">
        <div class="panel-title">Player Inspector</div>
        
        <div class="stat-row">
          <span class="stat-label">Health</span>
          <span class="stat-value" id="hp-val">100%</span>
        </div>
        <div class="health-bar-container">
          <div class="health-fill" id="hp-bar"></div>
        </div>

        <div class="stat-row">
          <span class="stat-label">Position</span>
          <span class="stat-value" id="pos-val">0, 0</span>
        </div>

        <div class="stat-row">
          <span class="stat-label">Velocity</span>
          <span class="stat-value" id="vel-val">0.0</span>
        </div>

        <div class="controls">
          <div class="btn active">Move (WASD)</div>
          <div class="btn btn-reset" id="btn-reset">Reset Sim</div>
        </div>
      </div>

      <div class="instructions">
        Use <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> to move player<br>
        Observe AI state transitions
      </div>
    </div>
  </div>

<script>
/**
 * ENGINE & LOGIC
 */
const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d');
const ui = {
  hpVal: document.getElementById('hp-val'),
  hpBar: document.getElementById('hp-bar'),
  posVal: document.getElementById('pos-val'),
  velVal: document.getElementById('vel-val'),
  resetBtn: document.getElementById('btn-reset')
};

// Configuration
const COLORS = {
  PATROL: '#38bdf8',
  ALERT: '#fbbf24',
  CHASE: '#f43f5e',
  ATTACK: '#ffffff',
  PLAYER: '#10b981',
  WALL: '#1e293b',
  WALL_BORDER: '#475569',
  PATH: '#38bdf8', // Brighter path
  VISION_CONE: 'rgba(251, 191, 36, 0.15)', // Amber semi-transparent
  ATTACK_RANGE: 'rgba(244, 63, 94, 0.15)'  // Red semi-transparent
};

const STATES = {
  PATROL: 'PATROL',
  ALERT: 'ALERT',
  CHASE: 'CHASE',
  ATTACK: 'ATTACK'
};

// Game State
let width, height;
let player = { x: 0, y: 0, radius: 14, hp: 100, speed: 5 };
let enemies = [];
let walls = [];
let keys = {};

// Initialize
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  initWorld();
}

function initWorld() {
  // Player start
  player.x = width * 0.2;
  player.y = height * 0.5;
  player.hp = 100;

  // Walls
  walls = [
    { x: width * 0.4, y: height * 0.2, w: 20, h: height * 0.3 },
    { x: width * 0.6, y: height * 0.5, w: 20, h: height * 0.3 },
    { x: width * 0.5, y: height * 0.5, w: 150, h: 20 },
    { x: width * 0.2, y: height * 0.2, w: 100, h: 100 }, 
    { x: width * 0.75, y: height * 0.2, w: 100, h: 100 }, 
  ];

  // CRITIQUE FIX: Diversify states for demonstration
  // 1. Enemy in ALERT (facing player)
  // 2. Enemy in CHASE (path to player)
  // 3. Enemy in ATTACK (close to player)
  // 4. Others in PATROL
  
  // Setup specific positions relative to player to demonstrate states
  enemies = [
    // Enemy 1: ATTACK (Close to player)
    new Enemy(player.x + 60, player.y + 20, STATES.ATTACK),
    
    // Enemy 2: CHASE (Medium distance, line of sight)
    new Enemy(player.x - 150, player.y - 100, STATES.CHASE),
    
    // Enemy 3: ALERT (Farther, looking at player)
    new Enemy(player.x + 250, player.y - 150, STATES.ALERT),
    
    // Enemy 4: PATROL (Background)
    new Enemy(width * 0.8, height * 0.8, STATES.PATROL),
    
    // Enemy 5: PATROL (Background)
    new Enemy(width * 0.5, height * 0.9, STATES.PATROL),
  ];
}

class Enemy {
  constructor(x, y, state) {
    this.x = x;
    this.y = y;
    this.radius = 10;
    this.angle = Math.atan2(player.y - y, player.x - x); // Face player initially
    this.state = state;
    this.speed = 3;
    
    // Patrol Logic
    this.patrolPath = this.generatePatrolPath(x, y);
    this.currentWaypointIdx = 1;
    
    // Alert Logic
    this.alertTimer = 0;
    this.alertPos = {x: player.x, y: player.y};

    // Attack Logic
    this.attackCooldown = 0;
  }

  generatePatrolPath(x, y) {
    return [
      {x: x, y: y},
      {x: x + (Math.random() * 200 - 100), y: y + (Math.random() * 200 - 100)},
      {x: x + (Math.random() * 200 - 100), y: y + (Math.random() * 200 - 100)},
    ].map(p => ({
        x: Math.max(50, Math.min(width - 50, p.x)),
        y: Math.max(50, Math.min(height - 50, p.y))
    }));
  }

  update() {
    const distToPlayer = Math.hypot(player.x - this.x, player.y - this.y);
    const angleToPlayer = Math.atan2(player.y - this.y, player.x - this.x);
    
    // Raycasting for Vision
    let canSeePlayer = false;
    if (distToPlayer < 250) {
      let angleDiff = angleToPlayer - this.angle;
      while (angleDiff <= -Math.PI) angleDiff += Math.PI*2;
      while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
      
      if (Math.abs(angleDiff) < Math.PI / 3) {
        canSeePlayer = !checkWallCollision(this.x, this.y, player.x, player.y);
      }
    }

    // State Machine
    switch(this.state) {
      case STATES.PATROL:
        const targetWP = this.patrolPath[this.currentWaypointIdx];
        this.angle = Math.atan2(targetWP.y - this.y, targetWP.x - this.x);
        this.moveTowards(targetWP.x, targetWP.y);
        
        if (distToPlayer < 250 && canSeePlayer) {
          this.state = STATES.ALERT;
          this.alertTimer = 60; 
          this.alertPos = {x: player.x, y: player.y};
        } else if (Math.hypot(targetWP.x - this.x, targetWP.y - this.y) < 5) {
          this.currentWaypointIdx = (this.currentWaypointIdx + 1) % this.patrolPath.length;
        }
        break;

      case STATES.ALERT:
        this.angle = angleToPlayer;
        this.alertTimer--;
        if (this.alertTimer <= 0) {
          if (canSeePlayer) this.state = STATES.CHASE;
          else {
             this.state = STATES.PATROL;
          }
        }
        break;

      case STATES.CHASE:
        this.angle = angleToPlayer;
        if (canSeePlayer) {
          if (distToPlayer < 40) {
            this.state = STATES.ATTACK;
          } else {
            this.moveTowards(player.x, player.y);
          }
        } else {
          this.state = STATES.ALERT;
          this.alertTimer = 60;
        }
        break;

      case STATES.ATTACK:
        this.angle = angleToPlayer;
        this.attackCooldown--;
        if (this.attackCooldown <= 0) {
          player.hp -= 10;
          this.attackCooldown = 60;
          createParticle(player.x, player.y, COLORS.ATTACK);
        }
        if (distToPlayer > 150) {
          this.state = STATES.CHASE;
        }
        break;
    }
  }

  moveTowards(tx, ty) {
    const dx = tx - this.x;
    const dy = ty - this.y;
    const dist = Math.hypot(dx, dy);
    
    if (dist > 0) {
      let nx = (dx / dist) * this.speed;
      let ny = (dy / dist) * this.speed;
      
      if (!checkCircleWallCollision(this.x + nx, this.y + ny, this.radius)) {
        this.x += nx;
        this.y += ny;
      } else {
        if (!checkCircleWallCollision(this.x + nx, this.y, this.radius)) this.x += nx;
        else if (!checkCircleWallCollision(this.x, this.y + ny, this.radius)) this.y += ny;
      }
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // 1. VISUAL MECHANICS: Attack Range Circle (Critique Fix #1)
    if (this.state === STATES.ATTACK) {
        ctx.save();
        ctx.translate(-this.x, -this.y); // Draw in world space
        ctx.beginPath();
        ctx.arc(this.x, this.y, 40, 0, Math.PI * 2);
        ctx.fillStyle = COLORS.ATTACK_RANGE;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.restore();
    }

    // 2. VISUAL MECHANICS: Detection Cone (Critique Fix #1)
    if (this.state !== STATES.PATROL) {
      ctx.save();
      ctx.rotate(this.angle);
      
      // Cone styling based on state
      const isChasing = this.state === STATES.CHASE;
      const coneColor = isChasing ? 'rgba(244, 63, 94, 0.15)' : 'rgba(251, 191, 36, 0.15)';
      const coneBorder = isChasing ? 'rgba(244, 63, 94, 0.6)' : 'rgba(251, 191, 36, 0.6)';
      
      ctx.fillStyle = coneColor;
      ctx.strokeStyle = coneBorder;
      ctx.lineWidth = 2;
      ctx.setLineDash([]); 
      
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, 250, -Math.PI/4, Math.PI/4);
      ctx.lineTo(0, 0);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // 3. VISUAL MECHANICS: Chase Path Line (Critique Fix #2 & #3)
    if (this.state === STATES.CHASE) {
        ctx.save();
        ctx.translate(-this.x, -this.y); // World space
        ctx.strokeStyle = COLORS.CHASE;
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 4]);
        ctx.globalAlpha = 0.6;
        
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(player.x, player.y);
        ctx.stroke();
        ctx.restore();
    }

    // 4. VISUAL MECHANICS: Patrol Path (Critique Fix #3 - Increased Opacity)
    if (this.state === STATES.PATROL) {
        ctx.save();
        ctx.translate(-this.x, -this.y); // World space
        ctx.strokeStyle = COLORS.PATH;
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.globalAlpha = 0.7; // Brighter
        
        ctx.beginPath();
        this.patrolPath.forEach((p, i) => {
            if(i === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        });
        ctx.closePath();
        ctx.stroke();
        
        // Waypoints
        this.patrolPath.forEach(p => {
            ctx.fillStyle = 'rgba(56, 189, 248, 0.8)';
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
            ctx.fill();
        });
        ctx.restore();
    }

    // Rotate entity
    ctx.rotate(this.angle);

    // Body Shape
    ctx.fillStyle = this.getColor();
    ctx.shadowColor = this.getColor();
    ctx.shadowBlur = 15;
    
    ctx.beginPath();
    // Triangle for aggressive states, Circle for passive
    if (this.state === STATES.CHASE || this.state === STATES.ATTACK) {
        ctx.moveTo(12, 0);
        ctx.lineTo(-8, 8);
        ctx.lineTo(-5, 0);
        ctx.lineTo(-8, -8);
    } else {
        ctx.arc(0, 0, 9, 0, Math.PI*2);
    }
    ctx.closePath();
    ctx.fill();

    ctx.restore();

    // 5. UI: State Labels with Background (Critique Fix #3)
    ctx.save();
    ctx.shadowBlur = 0;
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    const label = this.state;
    const textWidth = ctx.measureText(label).width;
    
    // Background pill
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.beginPath();
    ctx.roundRect(this.x - textWidth/2 - 4, this.y - 26, textWidth + 8, 16, 4);
    ctx.fill();
    
    // Text
    ctx.fillStyle = this.getColor();
    ctx.fillText(label, this.x, this.y - 18);
    ctx.restore();
  }

  getColor() {
    switch(this.state) {
      case STATES.PATROL: return COLORS.PATROL;
      case STATES.ALERT: return COLORS.ALERT;
      case STATES.CHASE: return COLORS.CHASE;
      case STATES.ATTACK: return COLORS.ATTACK;
      default: return '#fff';
    }
  }
}

// Helpers
function checkWallCollision(x1, y1, x2, y2) {
  for (let w of walls) {
    if (x1 < w.x + w.w && x2 > w.x && y1 < w.y + w.h && y2 > w.y) return true;
    if (x2 < w.x + w.w && x1 > w.x && y2 < w.y + w.h && y1 > w.y) return true;
  }
  return false;
}

function checkCircleWallCollision(x, y, r) {
  for (let w of walls) {
    let testX = x;
    let testY = y;
    if (x < w.x) testX = w.x;
    else if (x > w.x + w.w) testX = w.x + w.w;
    if (y < w.y) testY = w.y;
    else if (y > w.y + w.h) testY = w.y + w.h;
    let distX = x - testX;
    let distY = y - testY;
    let distance = Math.sqrt((distX*distX) + (distY*distY));
    if (distance <= r) return true;
  }
  return false;
}

let particles = [];
function createParticle(x, y, color) {
  particles.push({x, y, color, life: 20, size: 5});
}

// Input Handling
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('resize', resize);
ui.resetBtn.addEventListener('click', initWorld);

// Main Loop
function loop() {
  ctx.clearRect(0, 0, width, height);

  // Update Player
  let dx = 0, dy = 0;
  if (keys['w']) dy = -1;
  if (keys['s']) dy = 1;
  if (keys['a']) dx = -1;
  if (keys['d']) dx = 1;

  if (dx !== 0 || dy !== 0) {
    let len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    let nextX = player.x + dx * player.speed;
    let nextY = player.y + dy * player.speed;
    if (!checkCircleWallCollision(nextX, player.y, player.radius)) player.x = nextX;
    if (!checkCircleWallCollision(player.x, nextY, player.radius)) player.y = nextY;
  }

  // Draw Walls
  ctx.fillStyle = COLORS.WALL;
  ctx.strokeStyle = COLORS.WALL_BORDER;
  ctx.lineWidth = 2;
  for (let w of walls) {
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeRect(w.x, w.y, w.w, w.h);
  }

  // Update & Draw Enemies
  for (let e of enemies) {
    e.update();
    e.draw();
  }

  // Draw Player
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.shadowColor = COLORS.PLAYER;
  ctx.shadowBlur = 25; // Stronger glow (Critique Fix #3)
  ctx.fillStyle = COLORS.PLAYER;
  ctx.beginPath();
  ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, 0, player.radius * 0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 20;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (20 - p.life), 0, Math.PI * 2);
    ctx.fill();
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  ctx.globalAlpha = 1;

  // Update UI
  ui.posVal.textContent = `${Math.round(player.x)}, ${Math.round(player.y)}`;
  let speed = Math.hypot(keys['w']?1:0 + (keys['s']?1:0), keys['a']?1:0 + (keys['d']?1:0));
  ui.velVal.textContent = (speed * player.speed).toFixed(1);
  
  ui.hpVal.textContent = Math.max(0, player.hp) + '%';
  ui.hpBar.style.width = Math.max(0, player.hp) + '%';
  if (player.hp < 30) ui.hpBar.style.backgroundColor = COLORS.CHASE;
  else ui.hpBar.style.backgroundColor = COLORS.PLAYER;

  requestAnimationFrame(loop);
}

// Start
resize();
loop();

</script>
