<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Architecture & Information Flow</title>
    <style>
        :root {
            /* Palette - Deep Slate & High Contrast Accents */
            --bg-color: #0B1120;       /* Slate 950 */
            --grid-color: #1E293B;     /* Slate 800 */
            
            --card-bg: #0F172A;        /* Slate 900 */
            --card-border: #334155;    /* Slate 700 */
            --card-highlight: #475569; /* Slate 600 */
            
            --text-main: #F8FAFC;      /* Slate 50 */
            --text-muted: #94A3B8;     /* Slate 400 */

            /* Signal Colors - Distinct & Accessible */
            --color-data: #38BDF8;     /* Sky 400 (Cyan) */
            --color-instr: #A78BFA;    /* Violet 400 (Purple) */
            --color-control: #F59E0B;  /* Amber 500 (Orange - High Contrast) */
            
            /* CPU Highlight */
            --cpu-glow: rgba(56, 189, 248, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Prevent scroll for infographic feel */
            display: flex;
            flex-direction: column;
        }

        /* --- Background Grid --- */
        .grid-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(30, 41, 59, 0.4) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(30, 41, 59, 0.4) 1px, transparent 1px);
        }

        /* Vignette to focus center */
        .vignette {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: radial-gradient(circle at center, transparent 30%, var(--bg-color) 90%);
            pointer-events: none;
        }

        /* --- Header --- */
        header {
            position: relative;
            z-index: 10;
            padding: 2rem 3rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main);
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* --- Main Canvas --- */
        main {
            position: relative;
            flex: 1;
            z-index: 5;
            width: 100%;
            height: 100%;
        }

        /* SVG Layer for Connections */
        svg#connections {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10; /* Below nodes, above background */
        }

        /* --- Component Cards --- */
        .node {
            position: absolute;
            width: 140px;
            height: 100px;
            background: linear-gradient(180deg, #1E293B 0%, #0F172A 100%);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s;
            /* Standardized internal padding */
            padding: 1rem;
        }

        .node:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border-color: var(--card-highlight);
            z-index: 30;
        }

        /* Icons */
        .icon {
            width: 32px;
            height: 32px;
            margin-bottom: 12px;
            color: var(--text-muted);
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Typography */
        .label {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .sub-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 400;
            text-align: center;
            opacity: 0.8;
        }

        /* --- Specific Node Positioning (Hub & Spoke / Radial) --- */
        /* Using percentage-based centering for responsiveness */
        
        /* CPU: Center & Dominant (30% larger) */
        #cpu {
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 140px;
            border: 1px solid var(--color-data);
            box-shadow: 0 0 30px var(--cpu-glow), 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
        }
        #cpu:hover { transform: translate(-50%, -50%) translateY(-4px); }
        #cpu .icon { color: var(--color-data); width: 48px; height: 48px; }
        #cpu .label { color: var(--color-data); font-size: 1.1rem; }

        /* Peripherals: Radial Grid around CPU */
        /* Top Row */
        #network { left: 12%; top: 15%; }
        #memory { right: 12%; top: 15%; }

        /* Middle Row */
        #input { left: 2%; top: 50%; transform: translateY(-50%); }
        #output { right: 2%; top: 50%; transform: translateY(-50%); }

        /* Bottom Row */
        #storage { left: 12%; bottom: 15%; }
        #gpu { right: 12%; bottom: 15%; }

        /* --- Legend (Footer) --- */
        .legend {
            position: absolute;
            bottom: 2rem;
            right: 3rem; /* Bottom-Right placement */
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 1rem 1.5rem;
            display: flex;
            gap: 2rem;
            z-index: 50;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .legend-line {
            width: 40px;
            height: 2px;
            background-color: currentColor;
            flex-shrink: 0;
        }

        .legend-text {
            font-size: 0.75rem;
            color: var(--text-main);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* --- SVG Styles --- */
        .path {
            fill: none;
            stroke-width: 2px;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Data: Solid Cyan */
        .type-data { 
            stroke: var(--color-data); 
            filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.3));
        }
        
        /* Instructions: Dashed Purple */
        .type-instr { 
            stroke: var(--color-instr); 
            stroke-dasharray: 8 4; 
            animation: flow 1s linear infinite;
            filter: drop-shadow(0 0 4px rgba(167, 139, 250, 0.3));
        }
        
        /* Control: Dotted Amber (High Contrast) */
        .type-control { 
            stroke: var(--color-control); 
            stroke-dasharray: 2 4; 
            animation: flow 1.5s linear infinite;
            filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.4));
        }

        @keyframes flow {
            to { stroke-dashoffset: -12; }
        }

        /* Markers */
        .marker-data { fill: var(--color-data); }
        .marker-instr { fill: var(--color-instr); }
        .marker-control { fill: var(--color-control); }

    </style>
</head>
<body>

    <div class="grid-bg"></div>
    <div class="vignette"></div>

    <header>
        <h1>System Architecture</h1>
        <div class="subtitle">Information Flow & Topology</div>
    </header>

    <main id="canvas">
        <!-- Legend (Footer) -->
        <div class="legend">
            <div class="legend-item" style="color: var(--color-data);">
                <div class="legend-line"></div>
                <span class="legend-text">Data Bus</span>
            </div>

            <div class="legend-item" style="color: var(--color-instr);">
                <div class="legend-line" style="border-top: 2px dashed currentColor; height: 0;"></div>
                <span class="legend-text">Instructions</span>
            </div>

            <div class="legend-item" style="color: var(--color-control);">
                <div class="legend-line" style="border-top: 2px dotted currentColor; height: 0;"></div>
                <span class="legend-text">Control</span>
            </div>
        </div>

        <!-- SVG Connections -->
        <svg id="connections" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="arrow-data" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" class="marker-data" />
                </marker>
                <marker id="arrow-instr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" class="marker-instr" />
                </marker>
                <marker id="arrow-control" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" class="marker-control" />
                </marker>
            </defs>
        </svg>

        <!-- NODES -->

        <!-- CPU (Center) -->
        <div id="cpu" class="node">
            <svg class="icon" viewBox="0 0 24 24">
                <rect x="4" y="4" width="16" height="16" rx="2" />
                <rect x="9" y="9" width="6" height="6" />
                <path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3" />
            </svg>
            <div class="label">CPU</div>
            <div class="sub-label">Central Processing Unit</div>
        </div>

        <!-- Memory (Top Right) -->
        <div id="memory" class="node">
            <svg class="icon" viewBox="0 0 24 24">
                <rect x="2" y="6" width="20" height="12" rx="2" />
                <path d="M6 18v2M10 18v2M14 18v2M18 18v2" />
                <line x1="6" y1="12" x2="18" y2="12" />
            </svg>
            <div class="label">Memory</div>
            <div class="sub-label">RAM / Cache</div>
        </div>

        <!-- Storage (Bottom Left) -->
        <div id="storage" class="node">
            <svg class="icon" viewBox="0 0 24 24">
                <ellipse cx="12" cy="5" rx="9" ry="3" />
                <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" />
                <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
            </svg>
            <div class="label">Storage</div>
            <div class="sub-label">NVMe / SSD</div>
        </div>

        <!-- Input (Far Left) -->
        <div id="input" class="node">
            <svg class="icon" viewBox="0 0 24 24">
                <rect x="2" y="4" width="20" height="16" rx="2" />
                <line x1="6" y1="8" x2="6.01" y2="8" />
                <line x1="10" y1="8" x2="10.01" y2="8" />
                <line x1="14" y1="8" x2="14.01" y2="8" />
                <line x1="18" y1="8" x2="18.01" y2="8" />
                <line x1="6" y1="12" x2="6.01" y2="12" />
                <line x1="10" y1="12" x2="10.01" y2="12" />
                <line x1="14" y1="12" x2="14.01" y2="12" />
                <line x1="18" y1="12" x2="18.01" y2="12" />
            </svg>
            <div class="label">Input</div>
            <div class="sub-label">User Events</div>
        </div>

        <!-- Output (Far Right) -->
        <div id="output" class="node">
            <svg class="icon" viewBox="0 0 24 24">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2" />
                <line x1="8" y1="21" x2="16" y2="21" />
                <line x1="12" y1="17" x2="12" y2="21" />
            </svg>
            <div class="label">Output</div>
            <div class="sub-label">Display / Audio</div>
        </div>

        <!-- Network (Top Left) -->
        <div id="network" class="node">
            <svg class="icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" />
                <line x1="2" y1="12" x2="22" y2="12" />
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
            </svg>
            <div class="label">Network</div>
            <div class="sub-label">NIC / Link</div>
        </div>

        <!-- GPU (Bottom Right) -->
        <div id="gpu" class="node">
            <svg class="icon" viewBox="0 0 24 24">
                <rect x="2" y="6" width="20" height="12" rx="2" />
                <path d="M6 18v2M18 18v2" />
                <path d="M6 6V4M18 6V4" />
                <rect x="8" y="9" width="8" height="6" />
            </svg>
            <div class="label">GPU</div>
            <div class="sub-label">Parallel Processing</div>
        </div>

    </main>

    <script>
        // Configuration of connections
        const connections = [
            // CPU <-> Memory
            { from: 'memory', to: 'cpu', type: 'instr' }, // Fetch Instructions (Purple)
            { from: 'cpu', to: 'memory', type: 'data' },  // Read/Write Data (Cyan)
            { from: 'cpu', to: 'memory', type: 'control' }, // Control Signals (Amber)

            // CPU <-> Storage
            { from: 'storage', to: 'cpu', type: 'data' }, // Load Data
            { from: 'cpu', to: 'storage', type: 'control' }, // Write Command

            // CPU <-> GPU
            { from: 'cpu', to: 'gpu', type: 'data' }, // Send Geometry/Textures
            { from: 'cpu', to: 'gpu', type: 'instr' }, // Execute Shaders (Purple)

            // GPU <-> Output
            { from: 'gpu', to: 'output', type: 'data' }, // Framebuffer

            // Network <-> CPU
            { from: 'network', to: 'cpu', type: 'data' }, // Incoming Packets
            { from: 'cpu', to: 'network', type: 'data' }, // Outgoing Packets
            { from: 'network', to: 'cpu', type: 'control' }, // Interrupts (Amber)

            // Input <-> CPU
            { from: 'input', to: 'cpu', type: 'control' }, // Interrupts (Amber)
            { from: 'input', to: 'cpu', type: 'data' }, // Event Data

            // CPU <-> Output (Audio/Control)
            { from: 'cpu', to: 'output', type: 'data' }, // Audio Stream
        ];

        const svg = document.getElementById('connections');
        const mainContainer = document.getElementById('canvas');

        function getCenter(element) {
            const rect = element.getBoundingClientRect();
            const mainRect = mainContainer.getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2 - mainRect.left,
                y: rect.top + rect.height / 2 - mainRect.top
            };
        }

        function getEdgePoint(center, width, height, targetCenter) {
            const dx = targetCenter.x - center.x;
            const dy = targetCenter.y - center.y;
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);
            
            // Offset to stop line exactly at border
            const padding = 2; 
            
            // If purely horizontal or vertical, snap to center of that side
            if (absDx > absDy) {
                return {
                    x: center.x + (dx > 0 ? width/2 + padding : -width/2 - padding),
                    y: center.y
                };
            } else {
                return {
                    x: center.x,
                    y: center.y + (dy > 0 ? height/2 + padding : -height/2 - padding)
                };
            }
        }

        function draw() {
            // Keep defs
            const defs = svg.querySelector('defs').outerHTML;
            svg.innerHTML = defs;

            connections.forEach(conn => {
                const startEl = document.getElementById(conn.from);
                const endEl = document.getElementById(conn.to);
                if (!startEl || !endEl) return;

                const sRect = startEl.getBoundingClientRect();
                const eRect = endEl.getBoundingClientRect();
                const mRect = mainContainer.getBoundingClientRect();

                // Centers relative to main container
                const sCenter = { x: sRect.left + sRect.width/2 - mRect.left, y: sRect.top + sRect.height/2 - mRect.top };
                const eCenter = { x: eRect.left + eRect.width/2 - mRect.left, y: eRect.top + eRect.height/2 - mRect.top };

                // Edge points
                const startPt = getEdgePoint(sCenter, sRect.width, sRect.height, eCenter);
                const endPt = getEdgePoint(eCenter, eRect.width, eRect.height, sCenter);

                // Bezier Control Points (Orthogonal-ish curves)
                const dist = Math.hypot(endPt.x - startPt.x, endPt.y - startPt.y);
                const curvature = Math.max(80, dist * 0.4); // Increased curvature for elegance

                let cp1, cp2;
                const dx = endPt.x - startPt.x;
                const dy = endPt.y - startPt.y;

                if (Math.abs(dx) > Math.abs(dy)) {
                    cp1 = { x: startPt.x + (dx > 0 ? curvature : -curvature), y: startPt.y };
                    cp2 = { x: endPt.x - (dx > 0 ? curvature : -curvature), y: endPt.y };
                } else {
                    cp1 = { x: startPt.x, y: startPt.y + (dy > 0 ? curvature : -curvature) };
                    cp2 = { x: endPt.x, y: endPt.y - (dy > 0 ? curvature : -curvature) };
                }

                const d = `M ${startPt.x} ${startPt.y} C ${cp1.x} ${cp1.y}, ${cp2.x} ${cp2.y}, ${endPt.x} ${endPt.y}`;

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", d);
                path.setAttribute("class", `path type-${conn.type}`);
                
                // Add specific marker
                path.setAttribute("marker-end", `url(#arrow-${conn.type})`);
                
                svg.appendChild(path);
            });
        }

        // Initial Draw
        requestAnimationFrame(draw);

        // Redraw on Resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(draw, 50);
        });
    </script>
</body>
</html>
