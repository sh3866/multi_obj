<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Architecture & Information Flow</title>
    <style>
        :root {
            /* Palette - Slate & Neon */
            --bg-color: #0F172A;       /* Slate 950 */
            --grid-line: #1E293B;      /* Slate 800 */
            --card-bg: #1E293B;        /* Slate 800 */
            --card-border: #334155;    /* Slate 700 */
            
            --text-main: #F1F5F9;      /* Slate 100 */
            --text-muted: #94A3B8;     /* Slate 400 */

            /* Signal Colors */
            --color-data: #38BDF8;     /* Sky 400 */
            --color-instr: #A78BFA;    /* Violet 400 */
            --color-control: #34D399;  /* Emerald 400 */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Background Grid --- */
        .grid-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            /* 1px grid, low opacity */
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.5;
        }

        /* Vignette for focus */
        .vignette {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: radial-gradient(circle at center, transparent 0%, var(--bg-color) 90%);
            pointer-events: none;
        }

        /* --- Header --- */
        header {
            position: relative;
            z-index: 10;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(15,23,42,1) 0%, rgba(15,23,42,0) 100%);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main);
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
            font-weight: 400;
        }

        /* --- Main Canvas --- */
        main {
            position: relative;
            flex: 1;
            z-index: 5;
        }

        /* SVG Layer */
        svg#connections {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10; /* Above background, below nodes */
        }

        /* --- Component Cards --- */
        .node {
            position: absolute;
            width: 140px;
            height: 100px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .node:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border-color: var(--text-muted);
        }

        /* Icons */
        .icon {
            width: 28px;
            height: 28px;
            margin-bottom: 8px;
            color: var(--text-muted);
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.02em;
        }

        .sub-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* --- Specific Node Styles --- */
        
        /* CPU: Anchor */
        #cpu {
            width: 180px;
            height: 140px;
            border: 1px solid var(--color-data);
            background: radial-gradient(circle at center, #25334a 0%, #1E293B 100%);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.15);
            z-index: 30;
        }
        #cpu .icon { color: var(--color-data); width: 36px; height: 36px; }
        #cpu .label { color: var(--color-data); font-size: 1rem; }

        /* --- Legend (Top Right) --- */
        .legend {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            z-index: 50;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .legend-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.75rem;
            color: var(--text-main);
        }

        .swatch {
            width: 30px;
            height: 0;
            border-top-width: 2px;
            border-top-style: solid;
        }

        /* Line Styles */
        .path {
            fill: none;
            stroke-width: 2px;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke-dashoffset 0.5s linear;
        }

        /* Data: Solid Blue */
        .type-data { stroke: var(--color-data); }
        
        /* Instructions: Dashed Purple */
        .type-instr { 
            stroke: var(--color-instr); 
            stroke-dasharray: 8 4; 
            animation: flow 1s linear infinite;
        }
        
        /* Control: Dotted Green */
        .type-control { 
            stroke: var(--color-control); 
            stroke-dasharray: 2 4; 
            animation: flow 1.5s linear infinite;
        }

        @keyframes flow {
            to { stroke-dashoffset: -12; }
        }

    </style>
</head>
<body>

    <div class="grid-bg"></div>
    <div class="vignette"></div>

    <header>
        <div class="title-block">
            <h1>System Architecture</h1>
            <div class="subtitle">Information Flow & Component Topology</div>
        </div>
    </header>

    <main id="canvas">
        <!-- Legend -->
        <div class="legend">
            <div class="legend-title">Signal Legend</div>
            <div class="legend-item">
                <div class="swatch" style="border-color: var(--color-data);"></div>
                <span>Data Bus</span>
            </div>
            <div class="legend-item">
                <div class="swatch" style="border-color: var(--color-instr); border-top-style: dashed;"></div>
                <span>Instructions</span>
            </div>
            <div class="legend-item">
                <div class="swatch" style="border-color: var(--color-control); border-top-style: dotted;"></div>
                <span>Control Signals</span>
            </div>
        </div>

        <!-- SVG Connections -->
        <svg id="connections" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Arrowhead -->
                <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="currentColor" />
                </marker>
            </defs>
        </svg>

        <!-- NODES -->

        <!-- CPU (Center) -->
        <div id="cpu" class="node">
            <svg class="icon" viewBox="0 0 24 24">
                <rect x="4" y="4" width="16" height="16" rx="2" />
                <rect x="9" y="9" width="6" height="6" />
                <path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3" />
            </svg>
            <div class="label">CPU</div>
            <div class="sub-label">Central Processor</div>
        </div>

        <!-- Memory (Top) -->
        <div id="memory" class="node">
            <svg class="icon" viewBox="0 0 24 24">
                <rect x="4" y="4" width="16" height="16" rx="2" />
                <line x1="8" y1="12" x2="16" y2="12" />
                <line x1="12" y1="8" x2="12" y2="16" />
            </svg>
            <div class="label">Memory</div>
            <div class="sub-label">RAM / Cache</div>
        </div>

        <!-- Storage (Bottom) -->
        <div id="storage" class="node">
            <svg class="icon" viewBox="0 0 24 24">
                <ellipse cx="12" cy="5" rx="9" ry="3" />
                <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" />
                <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
            </svg>
            <div class="label">Storage</div>
            <div class="sub-label">NVMe / SSD</div>
        </div>

        <!-- Input (Left) -->
        <div id="input" class="node">
            <svg class="icon" viewBox="0 0 24 24">
                <rect x="2" y="4" width="20" height="16" rx="2" />
                <line x1="6" y1="8" x2="6.01" y2="8" />
                <line x1="10" y1="8" x2="10.01" y2="8" />
                <line x1="14" y1="8" x2="14.01" y2="8" />
                <line x1="18" y1="8" x2="18.01" y2="8" />
                <line x1="6" y1="12" x2="6.01" y2="12" />
                <line x1="10" y1="12" x2="10.01" y2="12" />
                <line x1="14" y1="12" x2="14.01" y2="12" />
                <line x1="18" y1="12" x2="18.01" y2="12" />
            </svg>
            <div class="label">Input</div>
            <div class="sub-label">User Events</div>
        </div>

        <!-- Output (Right) -->
        <div id="output" class="node">
            <svg class="icon" viewBox="0 0 24 24">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2" />
                <line x1="8" y1="21" x2="16" y2="21" />
                <line x1="12" y1="17" x2="12" y2="21" />
            </svg>
            <div class="label">Output</div>
            <div class="sub-label">Display / Audio</div>
        </div>

        <!-- Network (Top Right) -->
        <div id="network" class="node">
            <svg class="icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" />
                <line x1="2" y1="12" x2="22" y2="12" />
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
            </svg>
            <div class="label">Network</div>
            <div class="sub-label">NIC / Link</div>
        </div>

        <!-- GPU (Bottom Right) -->
        <div id="gpu" class="node">
            <svg class="icon" viewBox="0 0 24 24">
                <rect x="2" y="6" width="20" height="12" rx="2" />
                <path d="M6 18v2M18 18v2" />
                <path d="M6 6V4M18 6V4" />
                <rect x="8" y="9" width="8" height="6" />
            </svg>
            <div class="label">GPU</div>
            <div class="sub-label">Parallel Proc.</div>
        </div>

    </main>

    <script>
        // Configuration of connections
        const connections = [
            // CPU <-> Memory
            { from: 'memory', to: 'cpu', type: 'instr' }, // Fetch Instructions
            { from: 'cpu', to: 'memory', type: 'data' },  // Read/Write Data
            { from: 'cpu', to: 'memory', type: 'control' }, // Control Signals

            // CPU <-> Storage
            { from: 'storage', to: 'cpu', type: 'data' }, // Load Data
            { from: 'cpu', to: 'storage', type: 'control' }, // Write Command

            // CPU <-> GPU
            { from: 'cpu', to: 'gpu', type: 'data' }, // Send Geometry/Textures
            { from: 'cpu', to: 'gpu', type: 'instr' }, // Execute Shaders

            // GPU <-> Output
            { from: 'gpu', to: 'output', type: 'data' }, // Framebuffer

            // Network <-> CPU
            { from: 'network', to: 'cpu', type: 'data' }, // Incoming Packets
            { from: 'cpu', to: 'network', type: 'data' }, // Outgoing Packets
            { from: 'network', to: 'cpu', type: 'control' }, // Interrupts

            // Input <-> CPU
            { from: 'input', to: 'cpu', type: 'control' }, // Interrupts
            { from: 'input', to: 'cpu', type: 'data' }, // Event Data

            // CPU <-> Output (Audio/Control)
            { from: 'cpu', to: 'output', type: 'data' }, // Audio Stream
        ];

        const svg = document.getElementById('connections');
        const mainContainer = document.getElementById('canvas');

        function getCenter(element) {
            const rect = element.getBoundingClientRect();
            const mainRect = mainContainer.getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2 - mainRect.left,
                y: rect.top + rect.height / 2 - mainRect.top
            };
        }

        function getEdgePoint(center, width, height, targetCenter) {
            const dx = targetCenter.x - center.x;
            const dy = targetCenter.y - center.y;
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);
            
            // Offset to stop line exactly at border
            const padding = 2; 
            
            // If purely horizontal or vertical, snap to center of that side
            if (absDx > absDy) {
                return {
                    x: center.x + (dx > 0 ? width/2 + padding : -width/2 - padding),
                    y: center.y
                };
            } else {
                return {
                    x: center.x,
                    y: center.y + (dy > 0 ? height/2 + padding : -height/2 - padding)
                };
            }
        }

        function draw() {
            // Keep defs
            const defs = svg.querySelector('defs').outerHTML;
            svg.innerHTML = defs;

            connections.forEach(conn => {
                const startEl = document.getElementById(conn.from);
                const endEl = document.getElementById(conn.to);
                if (!startEl || !endEl) return;

                const sRect = startEl.getBoundingClientRect();
                const eRect = endEl.getBoundingClientRect();
                const mRect = mainContainer.getBoundingClientRect();

                // Centers relative to main container
                const sCenter = { x: sRect.left + sRect.width/2 - mRect.left, y: sRect.top + sRect.height/2 - mRect.top };
                const eCenter = { x: eRect.left + eRect.width/2 - mRect.left, y: eRect.top + eRect.height/2 - mRect.top };

                // Edge points
                const startPt = getEdgePoint(sCenter, sRect.width, sRect.height, eCenter);
                const endPt = getEdgePoint(eCenter, eRect.width, eRect.height, sCenter);

                // Bezier Control Points (Orthogonal-ish curves)
                const dist = Math.hypot(endPt.x - startPt.x, endPt.y - startPt.y);
                const curvature = Math.max(60, dist * 0.4); 

                let cp1, cp2;
                const dx = endPt.x - startPt.x;
                const dy = endPt.y - startPt.y;

                if (Math.abs(dx) > Math.abs(dy)) {
                    cp1 = { x: startPt.x + (dx > 0 ? curvature : -curvature), y: startPt.y };
                    cp2 = { x: endPt.x - (dx > 0 ? curvature : -curvature), y: endPt.y };
                } else {
                    cp1 = { x: startPt.x, y: startPt.y + (dy > 0 ? curvature : -curvature) };
                    cp2 = { x: endPt.x, y: endPt.y - (dy > 0 ? curvature : -curvature) };
                }

                const d = `M ${startPt.x} ${startPt.y} C ${cp1.x} ${cp1.y}, ${cp2.x} ${cp2.y}, ${endPt.x} ${endPt.y}`;

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", d);
                path.setAttribute("class", `path type-${conn.type}`);
                
                // Add marker only if not looping back on self (not applicable here, but good practice)
                // Note: Marker color inherits from stroke via currentColor if set in CSS, 
                // but SVG markers often need explicit fill.
                // We will set the marker fill via a style on the path or rely on the defs.
                // To make marker match line color, we set the marker fill to currentColor in defs.
                // However, the path needs to pass color down.
                
                path.setAttribute("marker-end", "url(#arrow)");
                
                // Explicitly set color for the marker to pick up
                const colorMap = {
                    'data': 'var(--color-data)',
                    'instr': 'var(--color-instr)',
                    'control': 'var(--color-control)'
                };
                
                // We need to resolve CSS variables for the marker to work perfectly cross-browser
                // or just set the stroke color explicitly on the element.
                // Since we used classes, let's just ensure the marker uses the stroke color.
                // The marker in defs has fill="currentColor". 
                
                svg.appendChild(path);
            });
        }

        // Initial Draw
        // Use requestAnimationFrame to ensure layout is calculated
        requestAnimationFrame(draw);

        // Redraw on Resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(draw, 100);
        });
    </script>
</body>
</html>
