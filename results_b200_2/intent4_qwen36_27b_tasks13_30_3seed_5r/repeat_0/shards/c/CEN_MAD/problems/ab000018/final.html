<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poly Road - Design Revision</title>
    <style>
        :root {
            --font-ui: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-display: 'Impact', 'Arial Black', sans-serif;
            --ui-bg: rgba(255, 255, 255, 0.9);
            --ui-shadow: rgba(0, 0, 0, 0.25);
            --primary: #FF9800;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #333;
            font-family: var(--font-ui);
            color: #1a1a1a;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay System */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* HUD - Minimalist, High Readability */
        .hud-area {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .score-pill {
            background: var(--ui-bg);
            border-radius: 20px;
            padding: 8px 16px;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 6px var(--ui-shadow);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .score-pill.current {
            transform: scale(1.1);
            background: #fff;
            border: 2px solid #eee;
        }

        .score-pill.best {
            transform: scale(0.9);
            opacity: 0.7;
            margin-top: 8px;
            background: rgba(255,255,255,0.7);
        }

        .pill-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            font-weight: 700;
            margin-bottom: -2px;
        }

        .pill-value {
            font-family: var(--font-display);
            font-size: 28px;
            line-height: 1;
            color: #333;
        }

        .score-pill.best .pill-value {
            font-size: 20px;
            color: var(--primary);
        }

        /* Controls - Isometric D-Pad */
        .controls-area {
            position: absolute;
            bottom: 40px;
            left: 40px;
            pointer-events: auto;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        
        .controls-area:hover, .controls-area:active {
            opacity: 1;
        }

        .d-pad {
            position: relative;
            width: 140px;
            height: 140px;
        }

        /* Create the cross shape base */
        .d-pad::before {
            content: '';
            position: absolute;
            top: 40px; left: 40px;
            width: 60px; height: 60px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            transform: rotate(45deg);
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .d-btn {
            position: absolute;
            width: 54px;
            height: 54px;
            background: rgba(255, 255, 255, 0.85);
            border: none;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #444;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 6px 0 rgba(0,0,0,0.15), 0 10px 10px rgba(0,0,0,0.1);
            transition: transform 0.1s, box-shadow 0.1s, background 0.1s;
        }

        .d-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 rgba(0,0,0,0.15), 0 0 0 rgba(0,0,0,0.1);
            background: #eee;
        }

        .d-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
            stroke: #1a1a1a;
            stroke-width: 1.5px;
            stroke-linejoin: round;
        }

        /* Positioning */
        .d-btn.up { top: 0; left: 43px; }
        .d-btn.left { top: 43px; left: 0; }
        .d-btn.down { top: 43px; left: 87px; }
        .d-btn.right { top: 43px; left: 43px; opacity: 0; pointer-events: none; } /* Hide Down/Right for cleaner UI or keep functional */
        /* Actually keeping functional but styled differently for game logic */
        .d-btn.down { background: rgba(255,255,255,0.4); color: #666; } 

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .controls-area { bottom: 20px; left: 20px; transform: scale(0.85); transform-origin: bottom left; }
            .hud-area { top: 15px; left: 15px; }
            .score-pill { padding: 6px 12px; }
            .pill-value { font-size: 24px; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div class="hud-area">
            <!-- Current Score -->
            <div class="score-pill current">
                <div class="pill-label">Score</div>
                <div class="pill-value" id="current-score">0</div>
            </div>
            <!-- Best Score -->
            <div class="score-pill best">
                <div class="pill-label">Best</div>
                <div class="pill-value">0</div>
            </div>
        </div>

        <div class="controls-area">
            <div class="d-pad">
                <div class="d-btn up" onclick="handleInput(0, 1)">
                    <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h16z"/></svg>
                </div>
                <div class="d-btn left" onclick="handleInput(-1, 0)">
                    <svg viewBox="0 0 24 24"><path d="M16 12l-8 8v-16z"/></svg>
                </div>
                <div class="d-btn right" onclick="handleInput(1, 0)">
                    <svg viewBox="0 0 24 24"><path d="M8 12l8-8v16z"/></svg>
                </div>
                <div class="d-btn down" onclick="handleInput(0, -1)">
                    <svg viewBox="0 0 24 24"><path d="M12 20l8-8H4z"/></svg>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * POLY ROAD - REVISION 3 (Design Overhaul)
 * 
 * Applied Changes:
 * 1. Perspective: 45-degree isometric-ish view. Horizon lowered to 35%.
 * 2. Player: Low-poly Chicken with squash/stretch animation.
 * 3. Terrain: Checkerboard pattern for grass, distinct textures.
 * 4. Hazards: Boxy, colorful vehicles with wheels.
 * 5. UI: Refined D-pad and softer HUD.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- CONFIGURATION ---
const CONFIG = {
    fov: 350,
    cameraHeight: 140, // Higher angle
    cameraDist: 220,   // Zoom out slightly
    laneHeight: 60,    
    laneWidth: 800,    
    colors: {
        skyTop: '#4FC3F7',
        skyBottom: '#E1F5FE',
        grass: '#8BC34A',       // Vibrant Green
        grassDark: '#689F38',   // Checkerboard dark
        road: '#546E7A',        
        roadDark: '#37474F',
        water: '#29B6F6',       
        waterDark: '#0288D1',
        log: '#795548',
        leaves: '#4CAF50',
        leavesDark: '#2E7D32',
        trunk: '#5D4037'
    }
};

// --- STATE ---
let state = {
    width: 0,
    height: 0,
    centerX: 0,
    centerY: 0,
    playerZ: 0,
    lanes: [],
    score: 0
};

// --- UTILS ---

// 3D Projection Logic (Isometric-ish)
function project(x, y, z) {
    const camZ = state.playerZ - CONFIG.cameraDist;
    const relativeZ = z - camZ;
    
    if (relativeZ <= 10) return { x: 0, y: 0, scale: 0, visible: false };

    const scale = CONFIG.fov / relativeZ;
    
    // CRITICAL: Horizon is now at 35% of screen height to allow looking down
    const horizonY = state.height * 0.35;
    const screenX = state.centerX + (x * scale);
    // Invert Y logic slightly to handle "looking down"
    const screenY = horizonY + ((y - CONFIG.cameraHeight) * scale); 
    
    return { x: screenX, y: screenY, scale: scale, visible: true };
}

function adjustColor(hex, amount) {
    let r = parseInt(hex.slice(1, 3), 16);
    let g = parseInt(hex.slice(3, 5), 16);
    let b = parseInt(hex.slice(5, 7), 16);
    
    r = Math.min(255, Math.max(0, r + amount));
    g = Math.min(255, Math.max(0, g + amount));
    b = Math.min(255, Math.max(0, b + amount));
    
    return `rgb(${r},${g},${b})`;
}

// --- GEOMETRY PRIMITIVES ---

function drawCube(x, y, z, w, h, d, colorTop, colorSide, colorFront) {
    const p = (ox, oy, oz) => project(x + ox, y + oy, z + oz);
    
    // Bottom corners (z depth)
    const bfl = p(-w/2, 0, -d/2); bfr = p(w/2, 0, -d/2);
    const bbl = p(-w/2, 0, d/2);  bbr = p(w/2, 0, d/2);
    
    // Top corners
    const tfl = p(-w/2, h, -d/2); tfr = p(w/2, h, -d/2);
    const tbl = p(-w/2, h, d/2);  tbr = p(w/2, h, d/2);

    if (!bfl.visible) return;

    // Draw Faces (Painter's Algorithm: Top -> Side -> Front for this specific view)
    // Note: Order might need swapping based on exact angle, but Top is usually safe first.
    
    if(colorTop) {
        ctx.fillStyle = colorTop;
        ctx.beginPath();
        ctx.moveTo(tfl.x, tfl.y); ctx.lineTo(tfr.x, tfr.y);
        ctx.lineTo(tbr.x, tbr.y); ctx.lineTo(tbl.x, tbl.y);
        ctx.fill();
        // Low poly edge
        ctx.strokeStyle = 'rgba(0,0,0,0.1)';
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    // Right Side (or Left depending on position, but let's draw both for generic cube)
    if(colorSide) {
        ctx.fillStyle = colorSide;
        ctx.beginPath();
        ctx.moveTo(bfr.x, bfr.y); ctx.lineTo(bbr.x, bbr.y);
        ctx.lineTo(tbr.x, tbr.y); ctx.lineTo(tfr.x, tfr.y);
        ctx.fill();
        ctx.stroke();
    }

    if(colorFront) {
        ctx.fillStyle = colorFront;
        ctx.beginPath();
        ctx.moveTo(bfl.x, bfl.y); ctx.lineTo(bfr.x, bfr.y);
        ctx.lineTo(tfr.x, tfr.y); ctx.lineTo(tfl.x, tfl.y);
        ctx.fill();
        ctx.stroke();
    }
}

function drawShadow(x, z, width, length) {
    const p = project(x, 0, z);
    if (!p.visible) return;
    
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(
        p.x, p.y, 
        width/1.2 * p.scale, 
        length/2.5 * p.scale, 
        0, 0, Math.PI*2
    );
    ctx.fill();
}

// --- GAME OBJECTS ---

class Car {
    constructor(x, direction, typeIdx) {
        this.x = x;
        this.direction = direction; 
        this.speed = (4 + Math.random() * 3) * direction;
        
        // Distinct Vehicle Types
        const types = [
            { w: 40, h: 25, d: 70, color: '#ef5350', type: 'sedan' }, // Red Sedan
            { w: 50, h: 45, d: 90, color: '#42a5f5', type: 'truck' }, // Blue Truck
            { w: 35, h: 25, d: 55, color: '#ffca28', type: 'taxi' },  // Yellow
            { w: 45, h: 30, d: 75, color: '#ab47bc', type: 'coupe' }  // Purple
        ];
        this.dim = types[typeIdx % types.length];
    }

    draw(laneZ) {
        const cz = laneZ + (CONFIG.laneHeight / 2);
        const { w, h, d, color } = this.dim;

        drawShadow(this.x, cz, w, d);

        // Main Body
        drawCube(this.x, 0, cz, w, h, d, 
            adjustColor(color, 40), 
            adjustColor(color, -20), 
            adjustColor(color, 0)
        );
        
        // Wheels (Simple black boxes sticking out)
        const wheelColor = '#212121';
        const wheelSize = 8;
        // Front Wheels
        drawCube(this.x - w/2 - 2, 0, cz - d/4, 4, wheelSize, wheelSize, wheelColor, wheelColor, wheelColor);
        drawCube(this.x + w/2 + 2, 0, cz - d/4, 4, wheelSize, wheelSize, wheelColor, wheelColor, wheelColor);
        // Rear Wheels
        drawCube(this.x - w/2 - 2, 0, cz + d/4, 4, wheelSize, wheelSize, wheelColor, wheelColor, wheelColor);
        drawCube(this.x + w/2 + 2, 0, cz + d/4, 4, wheelSize, wheelSize, wheelColor, wheelColor, wheelColor);

        // Windshield (Simple dark rect on top)
        if(this.dim.type === 'truck') {
            drawCube(this.x, h, cz - d/4, w - 4, 2, d/3, '#111', '#111', '#111');
        }
    }
}

class Log {
    constructor(x, z) {
        this.x = x;
        this.z = z;
        this.w = 30;
        this.h = 15;
        this.d = 120;
    }
    
    draw() {
        drawShadow(this.x, this.z, this.w, this.d);
        drawCube(this.x, 5, this.z, this.w, this.h, this.d, 
            adjustColor(CONFIG.colors.log, 20), 
            adjustColor(CONFIG.colors.log, -30), 
            CONFIG.colors.log
        );
    }
}

class Tree {
    constructor(x, z) {
        this.x = x;
        this.z = z;
    }

    draw() {
        const trunkW = 12, trunkH = 25;
        const leafSize = 50;
        
        drawShadow(this.x, this.z, trunkW*2, trunkW*2);
        
        // Trunk
        drawCube(this.x, 0, this.z, trunkW, trunkH, trunkW, 
            null, 
            adjustColor(CONFIG.colors.trunk, -10), 
            CONFIG.colors.trunk
        );
        
        // Leaves (Chunky Low Poly)
        drawCube(this.x, trunkH, this.z, leafSize, leafSize, leafSize,
            adjustColor(CONFIG.colors.leaves, 30),
            adjustColor(CONFIG.colors.leaves, -30),
            CONFIG.colors.leaves
        );
    }
}

class Lane {
    constructor(zIndex) {
        this.zIndex = zIndex;
        this.z = zIndex * CONFIG.laneHeight;
        this.type = this.determineType(zIndex);
        this.obstacles = [];
        this.cars = [];
        this.logs = [];

        if (this.type === 'road') {
            this.speed = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 3);
            const count = 1 + Math.floor(Math.random() * 2);
            for(let i=0; i<count; i++) {
                // Spread cars out
                this.cars.push(new Car(-CONFIG.laneWidth + (i * 500), this.speed, Math.floor(Math.random()*4)));
            }
        } else if (this.type === 'grass') {
            // Only add trees if not too close to center (player spawn area)
            if (zIndex > 2 && Math.random() > 0.4) {
                const treeX = (Math.random() * CONFIG.laneWidth * 0.8) - (CONFIG.laneWidth * 0.4);
                // Don't place tree exactly in center
                if (Math.abs(treeX) > 60) {
                    this.obstacles.push(new Tree(treeX, this.z + CONFIG.laneHeight/2));
                }
            }
        } else if (this.type === 'water') {
            const count = 1 + Math.floor(Math.random() * 2);
            for(let i=0; i<count; i++) {
                const logX = (Math.random() * CONFIG.laneWidth * 0.6) - (CONFIG.laneWidth * 0.3);
                this.logs.push(new Log(logX, this.z + CONFIG.laneHeight/2));
            }
        }
    }

    determineType(z) {
        // Pattern: Grass, Grass, Road, Grass, Water, Grass
        const mod = z % 5;
        if (mod < 2) return 'grass';
        if (mod < 4) return 'road';
        return 'water';
    }

    update() {
        if (this.type === 'road') {
            this.cars.forEach(car => {
                car.x += car.speed;
                const limit = CONFIG.laneWidth / 1.1;
                if (car.speed > 0 && car.x > limit) car.x = -limit;
                if (car.speed < 0 && car.x < -limit) car.x = limit;
            });
        }
    }

    draw() {
        const p1 = project(-CONFIG.laneWidth/2, 0, this.z);
        const p2 = project(CONFIG.laneWidth/2, 0, this.z);
        const p3 = project(CONFIG.laneWidth/2, 0, this.z + CONFIG.laneHeight);
        const p4 = project(-CONFIG.laneWidth/2, 0, this.z + CONFIG.laneHeight);

        if (!p1.visible) return;

        let topColor, sideColor;
        if (this.type === 'grass') {
            sideColor = CONFIG.colors.grassDark;
            // Checkerboard effect based on index
            topColor = (this.zIndex % 2 === 0) ? CONFIG.colors.grass : adjustColor(CONFIG.colors.grass, -15);
        } else if (this.type === 'road') {
            sideColor = CONFIG.colors.roadDark;
            topColor = CONFIG.colors.road;
        } else {
            sideColor = CONFIG.colors.waterDark;
            topColor = CONFIG.colors.water;
        }

        // Draw Side (Thickness)
        ctx.fillStyle = sideColor;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
        const p1b = project(-CONFIG.laneWidth/2, -15, this.z);
        const p2b = project(CONFIG.laneWidth/2, -15, this.z);
        ctx.lineTo(p2b.x, p2b.y); ctx.lineTo(p1b.x, p1b.y);
        ctx.fill();

        // Draw Top
        ctx.fillStyle = topColor;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y);
        ctx.fill();

        // Details
        if (this.type === 'road') {
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = Math.max(1, 2 * p1.scale);
            ctx.setLineDash([15, 25]);
            ctx.beginPath();
            const c1 = project(0, 0, this.z);
            const c2 = project(0, 0, this.z + CONFIG.laneHeight);
            ctx.moveTo(c1.x, c1.y); ctx.lineTo(c2.x, c2.y);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // Draw Objects
        this.cars.forEach(car => car.draw(this.z));
        this.logs.forEach(log => log.draw());
        this.obstacles.forEach(obs => obs.draw());
    }
}

class Player {
    constructor() {
        this.x = 0;
        this.z = 0;
        this.targetX = 0;
        this.targetZ = 0;
        this.y = 0;
        this.vy = 0;
        this.isMoving = false;
        this.squash = 1; // 1 = normal, <1 = stretched, >1 = squashed
    }

    move(dx, dy) {
        if (this.isMoving) return;
        this.targetX += dx * 40;
        this.targetZ += dy * CONFIG.laneHeight;
        this.isMoving = true;
        this.vy = 10; // Jump height
        
        // Squash and Stretch Logic
        this.squash = 1.3; // Stretch on jump start
    }

    update() {
        const dx = this.targetX - this.x;
        const dz = this.targetZ - this.z;
        
        if (Math.abs(dx) > 0.1) this.x += dx * 0.2;
        if (Math.abs(dz) > 0.1) this.z += dz * 0.2;

        this.y += this.vy;
        this.vy -= 0.6; // Gravity
        
        // Squash animation
        if (this.y > 0) {
            this.squash = 1.15; // Stay stretched in air
        } else {
            // Landing
            this.y = 0;
            this.vy = 0;
            this.isMoving = false;
            this.x = this.targetX;
            this.z = this.targetZ;
            state.playerZ = this.z;
            
            // Bounce effect
            if (this.squash < 1.2) {
                this.squash = 0.7; // Squash on impact
            }
        }

        // Return to normal shape
        this.squash += (1 - this.squash) * 0.1;
    }

    draw() {
        drawShadow(this.x, this.z, 20, 20);

        const p = (ox, oy, oz) => project(this.x + ox, this.y + oy, this.z + oz);
        const s = project(this.x, this.y, this.z).scale;

        // --- LOW POLY CHICKEN ---
        // Body (Squashed/Stretched)
        const bodyH = 30 / this.squash;
        const bodyW = 24 * this.squash;
        const bodyD = 24 * this.squash;
        
        // Main Body
        drawCube(this.x, this.y, this.z, bodyW, bodyH, bodyD, 
            '#FFF', 
            '#E0E0E0', 
            '#FFF'
        );

        // Comb (Red thing on head)
        drawCube(this.x, this.y + bodyH, this.z - 2, 10, 8, 10, 
            '#D32F2F', '#B71C1C', '#D32F2F'
        );

        // Beak
        const beakY = this.y + bodyH * 0.5;
        const beakZ = this.z - bodyD/2;
        ctx.fillStyle = '#FF9800';
        ctx.beginPath();
        const b0 = p(0, beakY, beakZ);
        const b1 = p(-5, beakY, beakZ - 10*s);
        const b2 = p(5, beakY, beakZ - 10*s);
        ctx.moveTo(b0.x, b0.y); ctx.lineTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y);
        ctx.fill();

        // Eyes
        const eyeY = beakY - 5*s;
        const eyeX1 = -6*s;
        const eyeX2 = 6*s;
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(p(eyeX1, eyeY, beakZ).x, p(eyeX1, eyeY, beakZ).y, 3*s, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(p(eyeX2, eyeY, beakZ).x, p(eyeX2, eyeY, beakZ).y, 3*s, 0, Math.PI*2); ctx.fill();
    }
}

// --- ENGINE ---

const player = new Player();

function handleInput(dx, dy) {
    player.move(dx, dy);
    if (dy > 0) {
        state.score++;
        document.getElementById('current-score').innerText = state.score;
    }
}

window.addEventListener('keydown', (e) => {
    switch(e.key) {
        case 'ArrowUp': case 'w': handleInput(0, 1); break;
        case 'ArrowDown': case 's': handleInput(0, -1); break;
        case 'ArrowLeft': case 'a': handleInput(-1, 0); break;
        case 'ArrowRight': case 'd': handleInput(1, 0); break;
    }
});

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    state.width = canvas.width;
    state.height = canvas.height;
    state.centerX = state.width / 2;
    state.centerY = state.height / 2;
}

function init() {
    resize();
    window.addEventListener('resize', resize);
    
    // Initial lanes
    for (let i = -5; i < 20; i++) {
        state.lanes.push(new Lane(i));
    }
    loop();
}

function loop() {
    // 1. Background
    const grad = ctx.createLinearGradient(0, 0, 0, state.height);
    grad.addColorStop(0, CONFIG.colors.skyTop);
    grad.addColorStop(1, CONFIG.colors.skyBottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, state.width, state.height);

    // 2. Update
    player.update();
    state.lanes.forEach(l => l.update());

    // Infinite Scroll
    const pLane = Math.floor(player.z / CONFIG.laneHeight);
    while (state.lanes.length > 0 && state.lanes[0].zIndex < pLane - 5) state.lanes.shift();
    while (state.lanes.length < 20) {
        const last = state.lanes[state.lanes.length-1];
        state.lanes.push(new Lane(last.zIndex + 1));
    }

    // 3. Render (Back to Front)
    // We need to draw the lanes first, then the player on top
    // But actually, player might be "behind" a tree in the next lane?
    // Simple Z-sorting:
    
    // Create a render list
    let renderList = [];
    
    // Add lanes
    state.lanes.forEach(lane => {
        if (lane.z < state.playerZ - CONFIG.cameraDist - 50) return; // Cull far back
        renderList.push({ type: 'lane', obj: lane, z: lane.z });
    });

    // Add Player
    renderList.push({ type: 'player', obj: player, z: player.z });

    // Sort by Z (Far to Near)
    renderList.sort((a, b) => b.z - a.z);

    renderList.forEach(item => {
        if (item.type === 'lane') {
            item.obj.draw();
        } else {
            item.obj.draw();
        }
    });

    requestAnimationFrame(loop);
}

init();
</script>
</body>
</html>
