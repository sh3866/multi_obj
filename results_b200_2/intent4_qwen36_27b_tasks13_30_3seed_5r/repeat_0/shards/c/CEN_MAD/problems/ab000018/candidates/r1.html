<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poly Hop - Visual Design Revised</title>
    <style>
        :root {
            --ui-bg: rgba(255, 255, 255, 0.15);
            --ui-border: rgba(255, 255, 255, 0.4);
            --text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
            --font-stack: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --ui-font: 'Impact', 'Arial Black', sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #333;
            font-family: var(--font-stack);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* HUD Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hud-top {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .score-card {
            background: var(--ui-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--ui-border);
            padding: 8px 16px;
            border-radius: 12px;
            color: white;
            font-family: var(--ui-font);
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .score-label {
            font-size: 10px;
            letter-spacing: 1px;
            opacity: 0.9;
            margin-bottom: 2px;
            font-weight: 600;
        }

        .score-value {
            font-size: 24px;
            line-height: 1;
            text-shadow: var(--text-shadow);
        }

        .score-value span {
            color: #FFD700; 
        }

        /* Controls Overlay - D-Pad Style */
        .controls-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        
        .controls-container:hover {
            opacity: 1;
        }

        .controls-hint-text {
            color: white;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
            margin-bottom: 8px;
            background: rgba(0,0,0,0.3);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: 40px 40px 40px;
            grid-template-rows: 40px 40px;
            gap: 5px;
        }

        .d-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .d-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.2);
            background: rgba(255,255,255,0.4);
        }

        .d-btn.up { grid-column: 2; grid-row: 1; }
        .d-btn.left { grid-column: 1; grid-row: 2; }
        .d-btn.down { grid-column: 2; grid-row: 2; }
        .d-btn.right { grid-column: 3; grid-row: 2; }

        @media (max-width: 600px) {
            .controls-container {
                bottom: 20px;
                right: 20px;
            }
            .score-card { transform: scale(0.8); transform-origin: left top; }
        }

    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div class="hud-top">
            <div class="score-card">
                <div class="score-label">Best</div>
                <div class="score-value">42</div>
            </div>
            <div class="score-card">
                <div class="score-label">Score</div>
                <div class="score-value"><span id="current-score">12</span></div>
            </div>
        </div>

        <div class="controls-container">
            <div class="controls-hint-text">Controls</div>
            <div class="d-pad">
                <div class="d-btn up" onclick="handleInput(0, 1)">▲</div>
                <div class="d-btn left" onclick="handleInput(-1, 0)">◀</div>
                <div class="d-btn down" onclick="handleInput(0, -1)">▼</div>
                <div class="d-btn right" onclick="handleInput(1, 0)">▶</div>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * POLY HOP - REVISION 2
 * 
 * Changes applied based on critique:
 * 1. Perspective Flattened: Camera height lowered, FOV adjusted to make grid occupy bottom 70%.
 * 2. Lane Geometry: Distinct colors, checkerboard grass patterns, dashed road lines.
 * 3. Character: Replaced cube with a stylized low-poly chicken (beak, eyes, wattle).
 * 4. Vehicles: 3-face lighting model applied (Top, Side, Front) for volume.
 * 5. Atmosphere: Vertical gradient sky, horizon line logic.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- CONFIGURATION ---
const CONFIG = {
    fov: 400,           // Wider FOV for flatter look
    cameraHeight: 60,   // Much lower camera (closer to ground)
    cameraDist: 150,    // Camera sits closer behind player
    laneHeight: 60,     // Z-depth of a lane
    laneWidth: 500,     // Total world width
    blockSize: 40,      // Size of player/objects
    colors: {
        skyTop: '#87CEEB',       // Lighter horizon
        skyBottom: '#4682B4',    // Deeper bottom
        grassLight: '#76c75a',
        grassDark: '#5da844',
        road: '#555555',
        roadLine: '#ffffff',
        water: '#48b1bf',
        waterDark: '#3a919c',
        wood: '#b07c4e',
        woodDark: '#8c623d'
    }
};

// --- STATE ---
let state = {
    width: 0,
    height: 0,
    centerX: 0,
    centerY: 0,
    playerZ: 0,
    lanes: [],
    score: 12
};

// --- UTILS ---

// 3D Projection: Converts World (x, y, z) to Screen (x, y, scale)
// Z increases as we go "up" the screen (away from player)
function project(x, y, z) {
    // Camera follows player on Z. 
    // We shift world coordinates relative to camera.
    // Camera is at Z = playerZ - cameraDist
    // Camera is at Y = cameraHeight
    
    const relativeZ = z - (state.playerZ - CONFIG.cameraDist);
    
    // Prevent clipping issues behind camera
    if (relativeZ <= 0) return { x: 0, y: 0, scale: 0, visible: false };

    const scale = CONFIG.fov / relativeZ;
    
    // Center X, and adjust Y so that Y=0 is roughly 70% down the screen
    // Screen Y increases downwards. 
    // We want World Y=0 to be below CenterY.
    const screenX = state.centerX + (x * scale);
    const screenY = (state.centerY + 100) - ((y - CONFIG.cameraHeight) * scale); 
    
    return { x: screenX, y: screenY, scale: scale, visible: true };
}

// Hex color manipulation
function lightenDarkenColor(col, amt) {
    let usePound = false;
    if (col[0] == "#") {
        col = col.slice(1);
        usePound = true;
    }
    let num = parseInt(col,16);
    let r = (num >> 16) + amt;
    if (r > 255) r = 255; else if  (r < 0) r = 0;
    let b = ((num >> 8) & 0x00FF) + amt;
    if (b > 255) b = 255; else if  (b < 0) b = 0;
    let g = (num & 0x0000FF) + amt;
    if (g > 255) g = 255; else if (g < 0) g = 0;
    return (usePound?"#":"") + (g | (b << 8) | (r << 16)).toString(16);
}

// --- CLASSES ---

class Lane {
    constructor(zIndex) {
        this.zIndex = zIndex;
        this.z = zIndex * CONFIG.laneHeight;
        this.type = this.determineType(zIndex);
        this.traffic = [];
        
        if (this.type === 'road') {
            this.speed = (Math.random() > 0.5 ? 1 : -1) * (3 + Math.random() * 3);
            const count = 2 + Math.floor(Math.random() * 2);
            // Stagger cars
            for(let i=0; i<count; i++) {
                this.addCar(i * 250);
            }
        }
    }

    determineType(z) {
        // Pattern: Grass, Grass, Road, Road, Water, Grass
        const mod = z % 6;
        if (mod === 0 || mod === 1) return 'grass';
        if (mod === 2 || mod === 3) return 'road';
        if (mod === 4) return 'water';
        return 'grass';
    }

    addCar(xOffset) {
        // Random vehicle type
        const types = [
            { w: 60, h: 35, d: 40, color: '#ff6b6b' }, // Red Sports
            { w: 50, h: 45, d: 50, color: '#54a0ff' }, // Blue Truck
            { w: 55, h: 38, d: 42, color: '#feca57' }, // Yellow Taxi
            { w: 60, h: 35, d: 40, color: '#5f27cd' }  // Purple
        ];
        const type = types[Math.floor(Math.random()*types.length)];
        
        this.traffic.push({
            x: xOffset,
            w: type.w,
            h: type.h,
            d: type.d,
            color: type.color
        });
    }

    update() {
        if (this.type === 'road') {
            this.traffic.forEach(car => {
                car.x += this.speed;
                // Wrap around logic
                const limit = CONFIG.laneWidth / 1.5;
                if (this.speed > 0 && car.x > limit) car.x = -limit;
                if (this.speed < 0 && car.x < -limit) car.x = limit;
            });
        }
    }

    draw() {
        // Calculate corners for the top surface
        const pLeft = project(-CONFIG.laneWidth/2, 0, this.z);
        const pRight = project(CONFIG.laneWidth/2, 0, this.z);
        const pBackLeft = project(-CONFIG.laneWidth/2, 0, this.z + CONFIG.laneHeight);
        const pBackRight = project(CONFIG.laneWidth/2, 0, this.z + CONFIG.laneHeight);

        if (!pLeft.visible) return;

        // 1. Draw Terrain Base (Side/Depth)
        // We actually just draw the top face, but if we want thickness we draw a quad.
        // For this style, a flat top with a distinct color usually implies the block.
        
        // Color Logic
        let topColor, sideColor;
        if (this.type === 'grass') {
            sideColor = CONFIG.colors.grassDark;
            // Checkerboard effect based on grid position
            topColor = (Math.floor(this.zIndex) % 2 === 0) ? CONFIG.colors.grassLight : '#6bc04d';
        } else if (this.type === 'road') {
            sideColor = '#333';
            topColor = CONFIG.colors.road;
        } else if (this.type === 'water') {
            sideColor = CONFIG.colors.waterDark;
            topColor = CONFIG.colors.water;
        }
        
        // Draw Top Face
        ctx.beginPath();
        ctx.moveTo(pLeft.x, pLeft.y);
        ctx.lineTo(pRight.x, pRight.y);
        ctx.lineTo(pBackRight.x, pBackRight.y);
        ctx.lineTo(pBackLeft.x, pBackLeft.y);
        ctx.closePath();
        ctx.fillStyle = topColor;
        ctx.fill();
        
        // Draw Side Face (to give blocky 3D feel)
        ctx.beginPath();
        ctx.moveTo(pLeft.x, pLeft.y);
        ctx.lineTo(pRight.x, pRight.y);
        // Project slightly down to simulate thickness? Or just use the Z depth.
        // Since we are looking from above, the "side" is actually the bottom edge of the quad we just drew if we don't add thickness.
        // Let's add a small thickness visual.
        const thickness = 5;
        const pLeftBottom = project(-CONFIG.laneWidth/2, -thickness, this.z);
        const pRightBottom = project(CONFIG.laneWidth/2, -thickness, this.z);
        
        ctx.lineTo(pRightBottom.x, pRightBottom.y);
        ctx.lineTo(pLeftBottom.x, pLeftBottom.y);
        ctx.closePath();
        ctx.fillStyle = sideColor;
        ctx.fill();

        // 2. Details
        if (this.type === 'road') {
            // Dashed Center Line
            ctx.strokeStyle = 'rgba(255,255,255,0.7)';
            ctx.lineWidth = Math.max(1, 2 * pLeft.scale);
            ctx.setLineDash([Math.max(5, 15 * pLeft.scale), Math.max(5, 15 * pLeft.scale)]);
            ctx.beginPath();
            // Start slightly inside the lane
            const centerStart = project(0, 0, this.z);
            const centerEnd = project(0, 0, this.z + CONFIG.laneHeight);
            ctx.moveTo(centerStart.x, centerStart.y);
            ctx.lineTo(centerEnd.x, centerEnd.y);
            ctx.stroke();
            ctx.setLineDash([]);
        } else if (this.type === 'water') {
            // Wave lines
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = Math.max(1, 2 * pLeft.scale);
            const mid = project(0, 0, this.z + CONFIG.laneHeight/2);
            ctx.beginPath();
            ctx.moveTo(mid.x - 30*pLeft.scale, mid.y);
            ctx.lineTo(mid.x - 10*pLeft.scale, mid.y - 5*pLeft.scale);
            ctx.lineTo(mid.x + 10*pLeft.scale, mid.y + 5*pLeft.scale);
            ctx.lineTo(mid.x + 30*pLeft.scale, mid.y);
            ctx.stroke();
        }

        // 3. Draw Traffic
        // Sort traffic by Z (not really needed for single lane, but good practice)
        // Draw cars that are "lower" on screen first? No, Painter's algo: Back to Front.
        // But cars are all on same Z plane.
        this.traffic.forEach(car => {
            this.drawCar(car, pLeft.scale, pLeft.y);
        });
    }

    drawCar(car, scale, baseY) {
        const cx = car.x;
        const cz = this.z;
        const w = car.w;
        const h = car.h;
        const d = car.d;

        // Define vertices for a 3D box
        // Bottom corners
        const bfl = project(cx - w/2, 0, cz);
        const bfr = project(cx + w/2, 0, cz);
        const bbl = project(cx - w/2, 0, cz + d);
        const bbr = project(cx + w/2, 0, cz + d);
        
        // Top corners
        const tfl = project(cx - w/2, h, cz);
        const tfr = project(cx + w/2, h, cz);
        const tbl = project(cx - w/2, h, cz + d);
        const tbr = project(cx + w/2, h, cz + d);

        if (!bfl.visible) return;

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.moveTo(bfl.x, bfl.y);
        ctx.lineTo(bfr.x, bfr.y);
        ctx.lineTo(bbr.x, bbr.y);
        ctx.lineTo(bbl.x, bbl.y);
        ctx.fill();

        // Determine light direction (Top-Leftish)
        // Top Face: Lightest
        // Side (Right): Medium
        // Side (Left): Dark
        // Front (Top): Medium-Light

        // Draw Order: Top, Right Side, Front Face
        
        // Top
        ctx.fillStyle = car.color;
        ctx.beginPath();
        ctx.moveTo(tfl.x, tfl.y);
        ctx.lineTo(tfr.x, tfr.y);
        ctx.lineTo(tbr.x, tbr.y);
        ctx.lineTo(tbl.x, tbl.y);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.1)';
        ctx.stroke();

        // Right Side
        ctx.fillStyle = lightenDarkenColor(car.color, -20);
        ctx.beginPath();
        ctx.moveTo(bfr.x, bfr.y);
        ctx.lineTo(bbr.x, bbr.y);
        ctx.lineTo(tbr.x, tbr.y);
        ctx.lineTo(tfr.x, tfr.y);
        ctx.fill();
        ctx.stroke();

        // Front Face (Top of car facing camera)
        ctx.fillStyle = lightenDarkenColor(car.color, -10);
        ctx.beginPath();
        ctx.moveTo(bfl.x, bfl.y);
        ctx.lineTo(bfr.x, bfr.y);
        ctx.lineTo(tfr.x, tfr.y);
        ctx.lineTo(tfl.x, tfl.y);
        ctx.fill();
        ctx.stroke();
    }
}

class Player {
    constructor() {
        this.x = 0;
        this.z = 0;
        this.targetX = 0;
        this.targetZ = 0;
        this.hopY = 0;
        this.hopVel = 0;
        this.isHopping = false;
    }

    move(dx, dy) {
        if (this.isHopping) return;
        
        this.targetX += dx * 40; // 40 is block width approx
        this.targetZ += dy * CONFIG.laneHeight;
        
        this.isHopping = true;
        this.hopVel = 8; // Higher hop
        
        if (dy > 0) {
            state.score++;
            document.getElementById('current-score').innerText = state.score;
        }
    }

    update() {
        // Smooth movement
        this.x += (this.targetX - this.x) * 0.25;
        this.z += (this.targetZ - this.z) * 0.25;

        // Hop Physics
        if (this.isHopping) {
            this.hopY += this.hopVel;
            this.hopVel -= 0.5; // Gravity
            
            if (this.hopY <= 0) {
                this.hopY = 0;
                this.isHopping = false;
                // Snap
                this.x = this.targetX;
                this.z = this.targetZ;
                state.playerZ = this.z;
            }
        }
    }

    draw() {
        // Shadow
        const sP = project(this.x, 0, this.z);
        if (!sP.visible) return;
        
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        // Shadow scales with height (further = smaller)
        const shadowSize = 15 * sP.scale;
        const shadowHeight = 5 * sP.scale;
        // Shadow shrinks as player goes up
        const hopFactor = Math.max(0.5, 1 - (this.hopY / 100));
        ctx.ellipse(sP.x, sP.y, shadowSize * hopFactor, shadowHeight * hopFactor, 0, 0, Math.PI*2);
        ctx.fill();

        // --- CHICKEN CHARACTER ---
        // Low Poly Construction
        const size = 35; // Body size
        const pX = this.x;
        const pY = this.hopY;
        const pZ = this.z;

        // Helper to get projected point
        const p = (dx, dy, dz) => project(pX + dx, pY + dy, pZ + dz);

        // Vertices for Body (Cube-ish)
        // 0: Front-Bottom-Left (FB-L)
        const v = [
            p(-size/2, 0, -size/2), // FB-L
            p(size/2, 0, -size/2),  // FB-R
            p(size/2, 0, size/2),   // BB-R
            p(-size/2, 0, size/2),  // BB-L
            p(-size/2, size, -size/2), // FT-L
            p(size/2, size, -size/2),  // FT-R
            p(size/2, size, size/2),   // BT-R
            p(-size/2, size, size/2)   // BT-L
        ];

        if (!v[0].visible) return;

        // Draw Body
        // Top (White)
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(v[4].x, v[4].y);
        ctx.lineTo(v[5].x, v[5].y);
        ctx.lineTo(v[6].x, v[6].y);
        ctx.lineTo(v[7].x, v[7].y);
        ctx.fill();

        // Right Side (Light Grey)
        ctx.fillStyle = '#e6e6e6';
        ctx.beginPath();
        ctx.moveTo(v[1].x, v[1].y);
        ctx.lineTo(v[2].x, v[2].y);
        ctx.lineTo(v[6].x, v[6].y);
        ctx.lineTo(v[5].x, v[5].y);
        ctx.fill();

        // Front Face (White)
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(v[0].x, v[0].y);
        ctx.lineTo(v[1].x, v[1].y);
        ctx.lineTo(v[5].x, v[5].y);
        ctx.lineTo(v[4].x, v[4].y);
        ctx.fill();

        // --- HEAD / FACE DETAILS ---
        // We draw these directly on the Front Face coordinates
        // Center of Front Face
        const cx = (v[0].x + v[1].x) / 2;
        const cy = (v[0].y + v[4].y) / 2; // Mid height
        const scale = v[0].scale;

        // Eyes
        const eyeSize = 4 * scale;
        const eyeY = cy - (size/4)*scale;
        
        ctx.fillStyle = '#333';
        // Left Eye
        ctx.beginPath();
        ctx.arc(cx - (size/4)*scale, eyeY, eyeSize, 0, Math.PI*2);
        ctx.fill();
        // Right Eye
        ctx.beginPath();
        ctx.arc(cx + (size/4)*scale, eyeY, eyeSize, 0, Math.PI*2);
        ctx.fill();

        // Beak (Orange Triangle)
        const beakY = cy;
        ctx.fillStyle = '#FF9800';
        ctx.beginPath();
        ctx.moveTo(cx, beakY);
        ctx.lineTo(cx - (size/6)*scale, beakY + (size/6)*scale);
        ctx.lineTo(cx + (size/6)*scale, beakY + (size/6)*scale);
        ctx.fill();

        // Wattle (Red)
        ctx.fillStyle = '#D32F2F';
        ctx.beginPath();
        ctx.arc(cx, beakY + (size/5)*scale, 3*scale, 0, Math.PI*2);
        ctx.fill();

        // Comb (Red on top)
        ctx.fillStyle = '#D32F2F';
        const topY = v[4].y;
        ctx.beginPath();
        ctx.moveTo(cx - 5*scale, topY);
        ctx.lineTo(cx, topY - 5*scale);
        ctx.lineTo(cx + 5*scale, topY);
        ctx.fill();
    }
}

// --- INITIALIZATION ---

const player = new Player();

function handleInput(dx, dy) {
    player.move(dx, dy);
}

// Keyboard support
window.addEventListener('keydown', (e) => {
    switch(e.key) {
        case 'ArrowUp': case 'w': handleInput(0, 1); break;
        case 'ArrowDown': case 's': handleInput(0, -1); break;
        case 'ArrowLeft': case 'a': handleInput(-1, 0); break;
        case 'ArrowRight': case 'd': handleInput(1, 0); break;
    }
});

function init() {
    resize();
    window.addEventListener('resize', resize);
    
    // Create initial lanes
    // Start player at index 5, generate lanes from -5 to 25
    for (let i = -5; i < 25; i++) {
        state.lanes.push(new Lane(i));
    }

    loop();
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    state.width = canvas.width;
    state.height = canvas.height;
    state.centerX = state.width / 2;
    state.centerY = state.height / 2; 
}

// --- GAME LOOP ---

function loop() {
    // 1. Clear & Draw Background (Atmosphere)
    const grad = ctx.createLinearGradient(0, 0, 0, state.height);
    grad.addColorStop(0, CONFIG.colors.skyTop);
    grad.addColorStop(1, CONFIG.colors.skyBottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, state.width, state.height);

    // Draw Horizon Line (Visual Anchor)
    // Calculate screen Y of Z=infinity roughly? 
    // Or just draw a faint line at the vanishing point.
    // Vanishing point Y is roughly centerY + 100 - cameraHeight...
    // Let's just draw a simple distant ground plane color block if needed, 
    // but the gradient handles it mostly.

    // 2. Update Logic
    player.update();
    state.lanes.forEach(lane => lane.update());

    // Infinite Scroll
    const playerLaneIndex = Math.floor(player.z / CONFIG.laneHeight);
    
    // Remove old lanes
    while (state.lanes.length > 0 && state.lanes[0].zIndex < playerLaneIndex - 5) {
        state.lanes.shift();
    }
    // Add new lanes
    const lastZ = state.lanes[state.lanes.length-1].zIndex;
    while (lastZ < playerLaneIndex + 15) {
        state.lanes.push(new Lane(lastZ + 1));
        break; // Add one at a time to avoid loop issues if logic changes
    }

    // 3. Render (Painter's Algorithm: Back to Front)
    // Sort lanes by Z descending (furthest first)
    const sortedLanes = [...state.lanes].sort((a, b) => b.z - a.z);
    
    sortedLanes.forEach(lane => {
        // Optimization: Don't draw if way behind camera
        if (lane.z < state.playerZ - CONFIG.cameraDist - 100) return;
        lane.draw();
    });

    // Draw Player
    player.draw();

    requestAnimationFrame(loop);
}

// Start
init();

</script>
