<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Cube - Digital Puzzle</title>
<style>
  :root {
    /* --- Design System: Colors --- */
    --bg-dark: #121212;
    --bg-panel: #1e1e1e;
    --text-main: #ffffff;
    --text-muted: #888888;
    
    /* Rubik's Standard Palette */
    --c-white: #ffffff;
    --c-yellow: #ffd500;
    --c-red: #ff3b30;
    --c-orange: #ff9500;
    --c-blue: #007aff;
    --c-green: #34c759;
    --c-black: #000000; 
    
    /* UI Elements */
    --radius: 12px;
    --cube-size: 400px; /* Increased Scale per Critique #1 */
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0;
    padding: 0;
    /* Critique #5: Deep charcoal/slate background */
    background-color: #181a1f;
    background-image: radial-gradient(circle at 50% 50%, #252830 0%, #121212 100%);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* --- Layout: The Vertical Hero Column (Critique #2) --- */
  .app-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
    position: relative;
    perspective: 1500px;
  }

  /* --- Top Navigation (Critique #3 & #6) --- */
  header {
    position: absolute;
    top: 20px;
    width: 90%;
    max-width: 1000px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 20;
  }

  .brand {
    font-weight: 800;
    font-size: 1.1rem;
    letter-spacing: 1px;
    color: #fff;
    text-transform: uppercase;
    opacity: 0.8;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand svg { stroke: #fff; }

  /* Critique #6: Standardized UI Grammar */
  .size-selector {
    display: flex;
    background: rgba(30, 30, 30, 0.6);
    backdrop-filter: blur(10px);
    border-radius: var(--radius);
    padding: 4px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .size-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 8px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s;
  }
  .size-btn.active {
    background: rgba(255,255,255,0.15);
    color: #fff;
  }
  .size-btn:hover:not(.active) { color: #fff; }

  /* --- Hero Stats (Critique #2) --- */
  .hero-stats {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 20px;
    z-index: 10;
    /* Critique #2: High contrast, monospaced, dark background */
    background: #000000;
    padding: 10px 30px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  .stat-row {
    display: flex;
    gap: 30px;
    align-items: baseline;
  }

  .metric {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .metric-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #666;
    margin-bottom: 2px;
  }
  
  .metric-value {
    font-family: 'Courier New', Courier, monospace; /* Monospaced */
    font-size: 1.8rem;
    font-weight: 700;
    color: #fff;
    line-height: 1;
  }

  /* --- Main Stage (Critique #1) --- */
  .stage {
    position: relative;
    width: var(--cube-size);
    height: var(--cube-size);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 5;
  }

  /* Critique #5: Drop shadow beneath cube */
  .cube-shadow {
    position: absolute;
    width: 70%;
    height: 70%;
    background: black;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.6;
    transform: translateY(30%) scale(0.8);
    z-index: -1;
    transition: all 0.3s ease;
  }

  .scene-interactor {
    width: var(--cube-size);
    height: var(--cube-size);
    position: relative;
    transform-style: preserve-3d;
    transform: rotateX(-25deg) rotateY(-40deg);
    transition: transform 0.1s linear;
    cursor: grab;
  }
  .scene-interactor:active { cursor: grabbing; }

  .cube {
    width: 100%;
    height: 100%;
    position: absolute;
    transform-style: preserve-3d;
  }

  /* --- 3D Cube Construction --- */
  .face {
    position: absolute;
    width: var(--cube-size);
    height: var(--cube-size);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    background: #111; 
    border-radius: 12px; /* Critique #6: Standardized Radius */
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8); 
    backface-visibility: hidden;
    border: 2px solid #111;
    gap: 4px; 
    padding: 4px; 
  }

  /* Face Positioning */
  .face.front  { transform: rotateY(0deg) translateZ(calc(var(--cube-size)/2)); }
  .face.back   { transform: rotateY(180deg) translateZ(calc(var(--cube-size)/2)); }
  .face.right  { transform: rotateY(90deg) translateZ(calc(var(--cube-size)/2)); }
  .face.left   { transform: rotateY(-90deg) translateZ(calc(var(--cube-size)/2)); }
  .face.top    { transform: rotateX(90deg) translateZ(calc(var(--cube-size)/2)); }
  .face.bottom { transform: rotateX(-90deg) translateZ(calc(var(--cube-size)/2)); }

  /* Critique #5: Glossy, semi-gloss finish stickers */
  .sticker {
    border-radius: 4px;
    position: relative;
    background-color: var(--c-white);
    /* Gradient for curvature */
    background-image: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5) 0%, transparent 70%);
    box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
    overflow: hidden; 
  }
  /* Specular Highlight */
  .sticker::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 45%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.4), transparent);
    border-radius: 4px 4px 50% 50%;
    pointer-events: none;
  }

  /* --- Scramble Panel (Critique #3 & #6) --- */
  .formula-panel {
    position: absolute;
    top: 20px; /* Opposite side of header */
    width: 220px;
    background: rgba(30, 30, 30, 0.6);
    backdrop-filter: blur(12px);
    border-radius: var(--radius);
    padding: 15px;
    border: 1px solid rgba(255,255,255,0.1);
    pointer-events: none;
    z-index: 15;
  }
  
  .formula-title {
    font-size: 0.6rem;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
    letter-spacing: 1px;
    font-weight: 700;
  }
  
  .move-list {
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.85rem;
    line-height: 1.6;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  
  .move-chunk {
    display: inline-flex;
    align-items: center;
    background: rgba(0,0,0,0.4);
    padding: 2px 6px;
    border-radius: 4px;
  }
  .move-char { font-weight: bold; margin-right: 2px; }
  .mod-char { opacity: 0.7; font-size: 0.8em; }

  /* Notation Colors */
  .n-R { color: var(--c-orange); }
  .n-L { color: var(--c-blue); }
  .n-U { color: var(--c-white); }
  .n-D { color: var(--c-yellow); }
  .n-F { color: var(--c-green); }
  .n-B { color: var(--c-red); }

  /* --- Bottom Control Dock (Critique #4 & #6) --- */
  .controls-container {
    position: absolute;
    bottom: 30px;
    z-index: 20;
  }

  .control-bar {
    display: flex;
    background: rgba(30, 30, 30, 0.7);
    backdrop-filter: blur(15px); /* Blur separation */
    padding: 8px;
    border-radius: 50px; /* Pill shape */
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    gap: 8px;
  }

  button.btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
  }
  
  button.btn:hover {
    color: #fff;
    background: rgba(255,255,255,0.1);
  }

  /* Critique #6: Neutral primary action */
  button.btn-primary {
    background: #ffffff;
    color: #000;
  }
  button.btn-primary:hover {
    background: #e0e0e0;
    color: #000;
  }

  /* Responsive */
  @media(max-width: 800px) {
    :root { --cube-size: 280px; }
    .formula-panel { display: none; }
    header { top: 10px; width: 95%; }
    .controls-container { bottom: 15px; }
    .hero-stats { padding: 8px 20px; }
    .metric-value { font-size: 1.4rem; }
    .size-btn { padding: 6px 10px; font-size: 0.75rem; }
  }

</style>
</head>
<body>

<div class="app-container">
  
  <!-- Header: Brand Left, Size Selector Right -->
  <header>
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line><line x1="15" y1="21" x2="15" y2="9"></line><line x1="21" y1="15" x2="3" y2="15"></line></svg>
      THE CUBE
    </div>
    <div class="size-selector">
      <button class="size-btn" onclick="setCubeSize(2)">2x2</button>
      <button class="size-btn active" onclick="setCubeSize(3)">3x3</button>
      <button class="size-btn" onclick="setCubeSize(4)">4x4</button>
      <button class="size-btn" onclick="setCubeSize(5)">5x5</button>
    </div>
  </header>

  <!-- Scramble Panel: Top Left (Critique #3) -->
  <div class="formula-panel">
    <div class="formula-title">Current Scramble</div>
    <div class="move-list" id="scramble-display">
      <!-- Populated by JS -->
    </div>
  </div>

  <!-- Hero Column (Critique #2) -->
  <div class="app-center-stack" style="display:flex; flex-direction:column; align-items:center;">
    
    <!-- Stats: Directly Above Cube -->
    <div class="hero-stats">
      <div class="stat-row">
        <div class="metric">
          <span class="metric-label">Moves</span>
          <span class="metric-value" id="move-count">0</span>
        </div>
        <div class="metric">
          <span class="metric-label">Time</span>
          <span class="metric-value" id="timer">00:00</span>
        </div>
      </div>
    </div>

    <!-- Stage: Center of Viewport -->
    <div class="stage">
      <div class="cube-shadow"></div> <!-- Critique #5: Grounding Shadow -->
      <div class="scene-interactor" id="scene">
        <div class="cube" id="cube">
          <!-- Faces generated by JS -->
        </div>
      </div>
    </div>

  </div>

  <!-- Control Dock: Bottom Center, Pill Shape (Critique #4) -->
  <div class="controls-container">
    <div class="control-bar">
      <button class="btn" onclick="undoMove()">Undo</button>
      <button class="btn" onclick="getHint()">Hint</button>
      <button class="btn" onclick="resetCube()">Reset</button>
      <!-- Critique #6: Neutral Primary Color -->
      <button class="btn btn-primary" onclick="scrambleCube()">Scramble</button>
    </div>
  </div>

</div>

<script>
  // --- CONFIGURATION ---
  const COLORS = {
    U: 'var(--c-white)', 
    D: 'var(--c-yellow)', 
    F: 'var(--c-green)', 
    B: 'var(--c-red)',   
    R: 'var(--c-orange)', 
    L: 'var(--c-blue)'   
  };

  // --- STATE ---
  let cubeState = [];
  let moveHistory = [];
  let timerInterval;
  let seconds = 0;
  let isDragging = false;
  let startX, startY;
  let currentRotX = -25;
  let currentRotY = -40;
  let currentSize = 3;

  // --- DOM ELEMENTS ---
  const cubeEl = document.getElementById('cube');
  const sceneEl = document.getElementById('scene');
  const timerEl = document.getElementById('timer');
  const moveCountEl = document.getElementById('move-count');
  const scrambleDisplayEl = document.getElementById('scramble-display');

  // --- INITIALIZATION ---
  function init() {
    createCubeDOM(3);
    scrambleCube();
    setupInteraction();
  }

  // --- DOM GENERATION ---
  function createCubeDOM(size) {
    cubeEl.innerHTML = '';
    const faces = ['front', 'back', 'right', 'left', 'top', 'bottom'];
    
    faces.forEach((faceName, index) => {
      const faceDiv = document.createElement('div');
      faceDiv.className = `face ${faceName}`;
      faceDiv.id = `face-${index}`;
      
      // Create grid based on size
      const count = size * size;
      for(let i=0; i<count; i++) {
        const sticker = document.createElement('div');
        sticker.className = 'sticker';
        sticker.dataset.index = i;
        faceDiv.appendChild(sticker);
      }
      cubeEl.appendChild(faceDiv);
    });
  }

  // --- LOGIC: STATE MANAGEMENT ---
  
  function resetCube() {
    stopTimer();
    seconds = 0;
    updateTimerDisplay();
    moveHistory = [];
    moveCountEl.innerText = '0';
    
    // Initialize standard colors
    const faces = ['F', 'B', 'R', 'L', 'U', 'D'];
    cubeEl.childNodes.forEach((face, i) => {
      const color = COLORS[faces[i]];
      Array.from(face.children).forEach(sticker => {
        sticker.style.backgroundColor = color;
      });
    });
    
    scrambleDisplayEl.innerHTML = '<span style="color:#666; font-family:sans-serif;">Ready</span>';
  }

  function setCubeSize(size) {
    currentSize = size;
    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    
    createCubeDOM(size);
    scrambleCube();
  }

  // --- LOGIC: MOVES & SCRAMBLE ---
  
  const NOTATION_COLORS = {
    'R': 'n-R', 'L': 'n-L', 'U': 'n-U', 'D': 'n-D', 'F': 'n-F', 'B': 'n-B'
  };

  function scrambleCube() {
    const moves = ['F', 'B', 'U', 'D', 'L', 'R'];
    const modifiers = ['', "'", '2'];
    let generatedMoves = [];
    
    // Generate 20 moves
    for(let i=0; i<20; i++) {
      const m = moves[Math.floor(Math.random() * moves.length)];
      const mod = modifiers[Math.floor(Math.random() * modifiers.length)];
      generatedMoves.push(m + mod);
    }
    
    renderScrambleText(generatedMoves);
    
    // Visual Scramble
    let count = 0;
    const interval = setInterval(() => {
      randomizeColors();
      count++;
      if(count > 15) {
        clearInterval(interval);
        startTimer();
      }
    }, 80);
  }

  function renderScrambleText(moves) {
    scrambleDisplayEl.innerHTML = '';
    moves.forEach(move => {
      const char = move.charAt(0);
      const mod = move.substring(1);
      const colorClass = NOTATION_COLORS[char] || 'n-F';
      
      const chunk = document.createElement('span');
      chunk.className = 'move-chunk';
      
      const charSpan = document.createElement('span');
      charSpan.className = `move-char ${colorClass}`;
      charSpan.innerText = char;
      
      const modSpan = document.createElement('span');
      modSpan.className = 'mod-char';
      modSpan.innerText = mod;
      
      chunk.appendChild(charSpan);
      chunk.appendChild(modSpan);
      scrambleDisplayEl.appendChild(chunk);
    });
  }

  function randomizeColors() {
    const allStickers = document.querySelectorAll('.sticker');
    const colorKeys = Object.keys(COLORS);
    allStickers.forEach(s => {
      const randColor = COLORS[colorKeys[Math.floor(Math.random() * colorKeys.length)]];
      s.style.backgroundColor = randColor;
    });
  }

  // --- CONTROLS ---
  function startTimer() {
    stopTimer();
    seconds = 0;
    timerInterval = setInterval(() => {
      seconds++;
      updateTimerDisplay();
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
  }

  function updateTimerDisplay() {
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = (seconds % 60).toString().padStart(2, '0');
    timerEl.innerText = `${m}:${s}`;
  }

  function undoMove() {
    if(seconds > 0) {
      seconds = Math.max(0, seconds - 1);
      updateTimerDisplay();
    }
  }

  function getHint() {
    alert("Hint: Look for the white cross on the top face.");
  }

  // --- INTERACTION (3D ROTATION) ---
  function setupInteraction() {
    document.addEventListener('mousedown', (e) => {
      if(e.target.closest('.btn') || e.target.closest('.size-btn')) return;
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - startX;
      const deltaY = e.clientY - startY;
      
      currentRotY += deltaX * 0.5;
      currentRotX -= deltaY * 0.5;
      
      currentRotX = Math.max(-90, Math.min(90, currentRotX));

      sceneEl.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
      
      startX = e.clientX;
      startY = e.clientY;
    });

    document.addEventListener('mouseup', () => isDragging = false);
    
    // Touch support
    document.addEventListener('touchstart', (e) => {
      if(e.target.closest('.btn')) return;
      isDragging = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    });
    
    document.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const deltaX = e.touches[0].clientX - startX;
      const deltaY = e.touches[0].clientY - startY;
      
      currentRotY += deltaX * 0.5;
      currentRotX -= deltaY * 0.5;
      currentRotX = Math.max(-90, Math.min(90, currentRotX));

      sceneEl.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
      
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    });
    
    document.addEventListener('touchend', () => isDragging = false);
  }

  // Start
  init();

</script>
</body>
</html>
