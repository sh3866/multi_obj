<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Cube - Professional Puzzle</title>
<style>
  :root {
    /* --- Palette --- */
    --bg-dark: #0f1115;
    --bg-gradient: radial-gradient(circle at 50% 50%, #1e222b 0%, #0f1115 100%);
    
    /* Glassmorphism UI Colors */
    --glass-bg: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.12);
    --glass-highlight: rgba(255, 255, 255, 0.05);
    --glass-blur: 16px;
    
    /* Typography */
    --text-main: #ffffff;
    --text-muted: #a0a0a0;
    --text-accent: #4dabf7;
    
    /* Rubik's Colors (Vibrant) */
    --c-white: #ffffff;
    --c-yellow: #ffd700;
    --c-red: #ff3b30;
    --c-orange: #ff9500;
    --c-blue: #007aff;
    --c-green: #34c759;
    --c-plastic: #111111; /* The base plastic color */
    
    /* Dimensions */
    --cube-scale: 1;
    --cube-size: 300px;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-dark);
    background-image: var(--bg-gradient);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* --- Layout Structure --- */
  .app-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    perspective: 1200px;
  }

  /* --- Header / Top Bar --- */
  header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 100;
    pointer-events: none; /* Let clicks pass through empty space */
  }

  .header-left {
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: auto;
  }

  .brand {
    font-weight: 800;
    font-size: 1.2rem;
    letter-spacing: 1.5px;
    color: #fff;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }
  .brand svg { stroke: var(--c-blue); filter: drop-shadow(0 0 5px rgba(0,122,255,0.5)); }

  /* Scramble Panel (Moved Top Left per Critique) */
  .scramble-panel {
    background: var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 12px 16px;
    min-width: 200px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    transition: transform 0.3s ease;
  }

  .panel-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 1px;
    margin-bottom: 6px;
    font-weight: 700;
  }

  .move-list {
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
    color: #fff;
    line-height: 1.4;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .move-chunk {
    background: rgba(0,0,0,0.3);
    padding: 2px 5px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  /* Notation Colors */
  .n-R { color: var(--c-orange); } .n-L { color: var(--c-blue); } 
  .n-U { color: #fff; text-shadow: 0 0 2px #000; } .n-D { color: var(--c-yellow); } 
  .n-F { color: var(--c-green); } .n-B { color: var(--c-red); }

  /* Size Selectors (Upgraded per Critique) */
  .size-selector {
    background: var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur));
    border: 1px solid var(--glass-border);
    border-radius: 50px; /* Pill shape */
    padding: 4px;
    display: flex;
    gap: 4px;
    pointer-events: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }

  .size-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 8px 16px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 25px;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .size-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
  .size-btn.active {
    background: #fff;
    color: #000;
    box-shadow: 0 2px 10px rgba(255,255,255,0.2);
  }

  /* --- Main Stage & Timer --- */
  .main-stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 10;
  }

  /* Hero Stats (Timer & Moves) - Centered Top (Critique) */
  .hero-stats {
    display: flex;
    align-items: center;
    gap: 40px;
    margin-bottom: 40px;
    z-index: 20;
  }

  .stat-item {
    text-align: center;
    background: var(--glass-bg);
    backdrop-filter: blur(10px);
    padding: 10px 24px;
    border-radius: 16px;
    border: 1px solid var(--glass-border);
    min-width: 120px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }

  .stat-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    margin-bottom: 4px;
    font-weight: 700;
  }

  .stat-value {
    font-family: 'Courier New', monospace;
    font-size: 2rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 15px rgba(255,255,255,0.2);
  }

  /* 3D Scene */
  .scene-container {
    width: var(--cube-size);
    height: var(--cube-size);
    position: relative;
    transform-style: preserve-3d;
    /* Initial rotation */
    transform: rotateX(-25deg) rotateY(-40deg);
    transition: transform 0.1s linear;
    cursor: grab;
  }
  .scene-container:active { cursor: grabbing; }

  .cube {
    width: 100%;
    height: 100%;
    position: absolute;
    transform-style: preserve-3d;
  }

  /* Shadow */
  .cube-shadow {
    position: absolute;
    top: 50%; left: 50%;
    width: 60%; height: 60%;
    transform: translate(-50%, 120%) rotateX(90deg);
    background: black;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.5;
    z-index: -1;
    pointer-events: none;
  }

  /* Faces */
  .face {
    position: absolute;
    width: 100%; height: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    background: var(--c-plastic);
    border-radius: 12px;
    border: 2px solid #000;
    gap: 4px;
    padding: 4px;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    backface-visibility: hidden;
  }
  
  /* Face Transforms */
  .face.front  { transform: rotateY(0deg) translateZ(150px); }
  .face.back   { transform: rotateY(180deg) translateZ(150px); }
  .face.right  { transform: rotateY(90deg) translateZ(150px); }
  .face.left   { transform: rotateY(-90deg) translateZ(150px); }
  .face.top    { transform: rotateX(90deg) translateZ(150px); }
  .face.bottom { transform: rotateX(-90deg) translateZ(150px); }

  /* Stickers */
  .sticker {
    background-color: var(--c-white);
    border-radius: 4px;
    position: relative;
    /* Realistic Gloss */
    box-shadow: inset 0 0 4px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.1);
    transition: background-color 0.2s;
  }
  /* Glossy Highlight */
  .sticker::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 50%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.45) 0%, transparent 100%);
    border-radius: 4px 4px 50% 50%;
    pointer-events: none;
  }

  /* --- Footer Controls (Redesigned per Critique) --- */
  .footer-dock {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 800px;
    z-index: 100;
  }

  .control-bar {
    display: flex;
    justify-content: space-between;
    background: rgba(20, 20, 25, 0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 12px 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }

  .control-group {
    display: flex;
    gap: 12px;
  }

  button.btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    color: #fff;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    min-width: 80px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  button.btn:hover {
    background: rgba(255,255,255,0.15);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }
  
  button.btn:active {
    transform: translateY(0);
  }

  /* Primary Action: Scramble */
  button.btn-primary {
    background: var(--c-red);
    border-color: transparent;
    box-shadow: 0 4px 15px rgba(255, 59, 48, 0.4);
  }
  button.btn-primary:hover {
    background: #ff5e55;
    box-shadow: 0 6px 20px rgba(255, 59, 48, 0.6);
  }

  /* Responsive */
  @media(max-width: 768px) {
    :root { --cube-size: 240px; }
    header { padding: 15px; flex-direction: column; gap: 15px; align-items: flex-start; }
    .hero-stats { gap: 15px; margin-bottom: 20px; }
    .stat-value { font-size: 1.5rem; }
    .control-bar { flex-direction: column; gap: 10px; padding: 15px; }
    .control-group { width: 100%; }
    .control-group button { flex: 1; }
    .footer-dock { bottom: 20px; width: 95%; }
  }
</style>
</head>
<body>

<div class="app-container">
  
  <!-- Header -->
  <header>
    <div class="header-left">
      <div class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v18H3z"></path><path d="M3 9h18"></path><path d="M9 21V9"></path><path d="M15 21V9"></path><path d="M21 15H3"></path></svg>
        THE CUBE
      </div>
      
      <!-- Scramble Panel (Relocated) -->
      <div class="scramble-panel">
        <div class="panel-label">Current Scramble</div>
        <div class="move-list" id="scramble-display">
          <span style="opacity:0.5; font-size:0.8rem;">Press Scramble to start</span>
        </div>
      </div>
    </div>

    <!-- Size Selectors (Upgraded) -->
    <div class="size-selector">
      <button class="size-btn" onclick="setCubeSize(2)">2x2</button>
      <button class="size-btn active" onclick="setCubeSize(3)">3x3</button>
      <button class="size-btn" onclick="setCubeSize(4)">4x4</button>
      <button class="size-btn" onclick="setCubeSize(5)">5x5</button>
    </div>
  </header>

  <!-- Main Stage -->
  <div class="main-stage">
    
    <!-- Timer & Moves (Centered Top) -->
    <div class="hero-stats">
      <div class="stat-item">
        <div class="stat-label">Moves</div>
        <div class="stat-value" id="move-count">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Time</div>
        <div class="stat-value" id="timer">00:00</div>
      </div>
    </div>

    <!-- 3D Cube -->
    <div class="scene-container" id="scene">
      <div class="cube-shadow"></div>
      <div class="cube" id="cube">
        <!-- Faces generated by JS -->
      </div>
    </div>

  </div>

  <!-- Footer Controls (Redesigned Dock) -->
  <div class="footer-dock">
    <div class="control-bar">
      <div class="control-group">
        <button class="btn" onclick="undoMove()">Undo</button>
        <button class="btn" onclick="getHint()">Hint</button>
        <button class="btn" onclick="resetCube()">Reset</button>
      </div>
      <button class="btn btn-primary" onclick="scrambleCube()">SCRAMBLE</button>
    </div>
  </div>

</div>

<script>
  // --- CONFIGURATION ---
  const COLORS = {
    U: 'var(--c-white)', 
    D: 'var(--c-yellow)', 
    F: 'var(--c-green)', 
    B: 'var(--c-red)',   
    R: 'var(--c-orange)', 
    L: 'var(--c-blue)'   
  };

  const NOTATION_COLORS = {
    'R': 'n-R', 'L': 'n-L', 'U': 'n-U', 'D': 'n-D', 'F': 'n-F', 'B': 'n-B'
  };

  // --- STATE ---
  let moveHistory = [];
  let timerInterval;
  let seconds = 0;
  let isDragging = false;
  let startX, startY;
  let currentRotX = -25;
  let currentRotY = -40;
  let currentSize = 3;

  // --- DOM ELEMENTS ---
  const cubeEl = document.getElementById('cube');
  const sceneEl = document.getElementById('scene');
  const timerEl = document.getElementById('timer');
  const moveCountEl = document.getElementById('move-count');
  const scrambleDisplayEl = document.getElementById('scramble-display');

  // --- INITIALIZATION ---
  function init() {
    createCubeDOM(3);
    setupInteraction();
  }

  // --- DOM GENERATION ---
  function createCubeDOM(size) {
    cubeEl.innerHTML = '';
    const faces = ['front', 'back', 'right', 'left', 'top', 'bottom'];
    
    // Adjust translateZ based on size (assuming 300px base)
    // For simplicity in this demo, we keep the visual scale fixed via CSS variable,
    // but we need to adjust the 3D math slightly for different cube sizes if we were doing real logic.
    // For visual demo, we stick to the 3x3 geometry logic but change grid density.
    
    faces.forEach((faceName, index) => {
      const faceDiv = document.createElement('div');
      faceDiv.className = `face ${faceName}`;
      
      // Create grid based on size
      const count = size * size;
      faceDiv.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
      faceDiv.style.gridTemplateRows = `repeat(${size}, 1fr)`;
      
      for(let i=0; i<count; i++) {
        const sticker = document.createElement('div');
        sticker.className = 'sticker';
        sticker.dataset.index = i;
        faceDiv.appendChild(sticker);
      }
      cubeEl.appendChild(faceDiv);
    });
    
    // Reset colors to default solved state
    resetColors();
  }

  function resetColors() {
    const faces = ['F', 'B', 'R', 'L', 'U', 'D'];
    cubeEl.childNodes.forEach((face, i) => {
      const color = COLORS[faces[i]];
      Array.from(face.children).forEach(sticker => {
        sticker.style.backgroundColor = color;
      });
    });
  }

  // --- LOGIC: MOVES & SCRAMBLE ---
  
  function scrambleCube() {
    stopTimer();
    seconds = 0;
    updateTimerDisplay();
    moveCountEl.innerText = '0';
    
    const moves = ['F', 'B', 'U', 'D', 'L', 'R'];
    const modifiers = ['', "'", '2'];
    let generatedMoves = [];
    
    // Generate 20 moves
    for(let i=0; i<20; i++) {
      const m = moves[Math.floor(Math.random() * moves.length)];
      const mod = modifiers[Math.floor(Math.random() * modifiers.length)];
      generatedMoves.push(m + mod);
    }
    
    renderScrambleText(generatedMoves);
    
    // Visual Scramble Animation (Fast Shuffle)
    let count = 0;
    const interval = setInterval(() => {
      randomizeColors();
      // Slight rotation shake
      sceneEl.style.transform = `rotateX(${currentRotX + (Math.random()*10-5)}deg) rotateY(${currentRotY + (Math.random()*10-5)}deg)`;
      count++;
      if(count > 10) {
        clearInterval(interval);
        sceneEl.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
        startTimer();
      }
    }, 50);
  }

  function renderScrambleText(moves) {
    scrambleDisplayEl.innerHTML = '';
    moves.forEach(move => {
      const char = move.charAt(0);
      const mod = move.substring(1);
      const colorClass = NOTATION_COLORS[char] || 'n-F';
      
      const chunk = document.createElement('span');
      chunk.className = 'move-chunk';
      
      const charSpan = document.createElement('span');
      charSpan.className = `move-char ${colorClass}`;
      charSpan.innerText = char;
      
      const modSpan = document.createElement('span');
      modSpan.className = 'mod-char';
      modSpan.innerText = mod;
      
      chunk.appendChild(charSpan);
      chunk.appendChild(modSpan);
      scrambleDisplayEl.appendChild(chunk);
    });
  }

  function randomizeColors() {
    const allStickers = document.querySelectorAll('.sticker');
    const colorKeys = Object.keys(COLORS);
    allStickers.forEach(s => {
      const randColor = COLORS[colorKeys[Math.floor(Math.random() * colorKeys.length)]];
      s.style.backgroundColor = randColor;
    });
  }

  // --- CONTROLS ---
  function startTimer() {
    stopTimer();
    seconds = 0;
    timerInterval = setInterval(() => {
      seconds++;
      updateTimerDisplay();
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
  }

  function updateTimerDisplay() {
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = (seconds % 60).toString().padStart(2, '0');
    timerEl.innerText = `${m}:${s}`;
  }

  function resetCube() {
    stopTimer();
    seconds = 0;
    updateTimerDisplay();
    moveCountEl.innerText = '0';
    resetColors();
    scrambleDisplayEl.innerHTML = '<span style="opacity:0.5; font-size:0.8rem;">Ready</span>';
  }

  function setCubeSize(size) {
    currentSize = size;
    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    
    // Adjust CSS variable for scale
    document.documentElement.style.setProperty('--cube-size', (size * 60) + 'px');
    
    createCubeDOM(size);
    resetCube();
  }

  function undoMove() {
    if(seconds > 0) {
      seconds = Math.max(0, seconds - 1);
      updateTimerDisplay();
    }
  }

  function getHint() {
    alert("Pro Tip: Start by solving the white cross, ensuring the side colors match the center pieces.");
  }

  // --- INTERACTION (3D ROTATION) ---
  function setupInteraction() {
    document.addEventListener('mousedown', (e) => {
      if(e.target.closest('.btn') || e.target.closest('.size-btn') || e.target.closest('.scramble-panel')) return;
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      sceneEl.style.transition = 'none';
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - startX;
      const deltaY = e.clientY - startY;
      
      currentRotY += deltaX * 0.5;
      currentRotX -= deltaY * 0.5;
      
      // Clamp X rotation to avoid flipping upside down completely
      currentRotX = Math.max(-90, Math.min(90, currentRotX));

      sceneEl.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
      
      startX = e.clientX;
      startY = e.clientY;
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
      sceneEl.style.transition = 'transform 0.1s linear';
    });
    
    // Touch support
    document.addEventListener('touchstart', (e) => {
      if(e.target.closest('.btn') || e.target.closest('.size-btn')) return;
      isDragging = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      sceneEl.style.transition = 'none';
    });
    
    document.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const deltaX = e.touches[0].clientX - startX;
      const deltaY = e.touches[0].clientY - startY;
      
      currentRotY += deltaX * 0.5;
      currentRotX -= deltaY * 0.5;
      currentRotX = Math.max(-90, Math.min(90, currentRotX));

      sceneEl.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
      
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    });
    
    document.addEventListener('touchend', () => {
      isDragging = false;
      sceneEl.style.transition = 'transform 0.1s linear';
    });
  }

  // Start
  init();

</script>
</body>
</html>
