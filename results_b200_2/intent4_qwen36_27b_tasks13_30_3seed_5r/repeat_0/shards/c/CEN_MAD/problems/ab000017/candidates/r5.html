<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Cube - Professional Puzzle</title>
<style>
  :root {
    /* --- Palette: Digital Workbench --- */
    --bg-dark: #121214;
    --bg-gradient: radial-gradient(circle at 50% 40%, #2a2d35 0%, #0f1115 80%);
    
    /* Solid Material UI Colors */
    --card-bg: #1e2025;
    --card-border: rgba(255, 255, 255, 0.08);
    --card-shadow: 0 10px 30px rgba(0,0,0,0.5);
    
    /* Typography */
    --font-main: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --text-main: #ffffff;
    --text-muted: #8b9bb4;
    --text-highlight: #ffffff;
    
    /* Rubik's Colors (Plastic Matte) */
    --c-white: #f0f0f0;
    --c-yellow: #f5cb42;
    --c-red: #ce3838;
    --c-orange: #eb6d30;
    --c-blue: #3872ce;
    --c-green: #38b038;
    --c-plastic: #1a1a1a; 
    
    /* Dimensions */
    --cube-size: 300px;
    --gap-size: 4px;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-dark);
    background-image: var(--bg-gradient);
    color: var(--text-main);
    font-family: var(--font-main);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* --- Layout Structure --- */
  .app-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    perspective: 1200px;
  }

  /* --- Header / Top Bar --- */
  header {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 100;
    pointer-events: none; 
  }

  .header-left {
    display: flex;
    flex-direction: column;
    gap: 12px;
    pointer-events: auto;
  }

  .brand {
    font-weight: 800;
    font-size: 1.1rem;
    letter-spacing: 2px;
    color: #fff;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand svg { stroke: var(--c-blue); filter: drop-shadow(0 0 4px rgba(56, 114, 206, 0.4)); }

  /* Formula Panel (Solid Material) */
  .formula-panel {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 12px 16px;
    min-width: 220px;
    box-shadow: var(--card-shadow);
  }

  .panel-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 1px;
    margin-bottom: 8px;
    font-weight: 700;
  }

  .move-list {
    font-family: "SF Mono", "Roboto Mono", "Courier New", monospace;
    font-size: 0.85rem;
    color: #fff;
    line-height: 1.6;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .move-chunk {
    background: rgba(255,255,255,0.05);
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.05);
    font-weight: 600;
  }
  /* Notation Colors */
  .n-R { color: var(--c-orange); } .n-L { color: var(--c-blue); } 
  .n-U { color: #fff; } .n-D { color: var(--c-yellow); } 
  .n-F { color: var(--c-green); } .n-B { color: var(--c-red); }

  /* Size Selectors (Solid Material) */
  .size-selector {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 4px;
    display: flex;
    gap: 2px;
    pointer-events: auto;
    box-shadow: var(--card-shadow);
  }

  .size-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 8px 16px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.2s ease;
  }
  .size-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
  .size-btn.active {
    background: #fff;
    color: #000;
    box-shadow: 0 2px 8px rgba(255,255,255,0.15);
  }

  /* --- Main Stage & HUD --- */
  .main-stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 10;
  }

  /* Hero Stats (Timer & Moves) - Centered Top */
  .hero-stats {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 20px;
    z-index: 20;
  }

  .stat-item {
    text-align: center;
    background: var(--card-bg);
    padding: 8px 24px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    min-width: 100px;
    box-shadow: var(--card-shadow);
  }

  .stat-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    margin-bottom: 2px;
    font-weight: 700;
  }

  .stat-value {
    font-family: "SF Mono", "Roboto Mono", monospace;
    font-size: 1.8rem;
    font-weight: 700;
    color: #fff;
    line-height: 1;
  }

  /* 3D Scene */
  .scene-container {
    width: var(--cube-size);
    height: var(--cube-size);
    position: relative;
    transform-style: preserve-3d;
    /* Initial rotation */
    transform: rotateX(-25deg) rotateY(-40deg);
    transition: transform 0.1s linear;
    cursor: grab;
  }
  .scene-container:active { cursor: grabbing; }

  .cube {
    width: 100%;
    height: 100%;
    position: absolute;
    transform-style: preserve-3d;
  }

  /* Shadow (Directional Lighting) */
  .cube-shadow {
    position: absolute;
    top: 50%; left: 50%;
    width: 70%; height: 70%;
    transform: translate(-50%, 130%) rotateX(90deg);
    background: black;
    border-radius: 50%;
    filter: blur(30px);
    opacity: 0.6;
    z-index: -1;
    pointer-events: none;
  }

  /* Faces */
  .face {
    position: absolute;
    width: 100%; height: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    background: var(--c-plastic);
    border-radius: 6px; /* Slightly rounded cube edges */
    border: 1px solid #000;
    gap: var(--gap-size); /* Plastic gaps */
    padding: var(--gap-size);
    box-shadow: inset 0 0 10px rgba(0,0,0,0.6);
    backface-visibility: hidden;
  }
  
  /* Face Transforms */
  .face.front  { transform: rotateY(0deg) translateZ(150px); }
  .face.back   { transform: rotateY(180deg) translateZ(150px); }
  .face.right  { transform: rotateY(90deg) translateZ(150px); }
  .face.left   { transform: rotateY(-90deg) translateZ(150px); }
  .face.top    { transform: rotateX(90deg) translateZ(150px); }
  .face.bottom { transform: rotateX(-90deg) translateZ(150px); }

  /* Stickers */
  .sticker {
    background-color: var(--c-white);
    border-radius: 3px;
    position: relative;
    /* Subtle Matte Finish */
    box-shadow: inset 0 0 2px rgba(0,0,0,0.2), 0 1px 1px rgba(255,255,255,0.05);
    transition: background-color 0.2s;
  }
  /* Subtle Gloss */
  .sticker::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 40%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.3) 0%, transparent 100%);
    border-radius: 3px 3px 100% 100%;
    pointer-events: none;
    opacity: 0.6;
  }

  /* --- Footer Controls (Redesigned Dock) --- */
  .footer-dock {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 600px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  /* Primary Action: Scramble (Elevated) */
  button.btn-primary {
    background: var(--c-red);
    border: none;
    color: #fff;
    padding: 14px 40px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(206, 56, 56, 0.4);
    transition: all 0.2s ease;
    width: 100%;
    max-width: 250px;
  }
  button.btn-primary:hover {
    background: #e04040;
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(206, 56, 56, 0.6);
  }

  /* Secondary Controls Group */
  .secondary-controls {
    display: flex;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 4px;
    box-shadow: var(--card-shadow);
  }

  button.btn-sec {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  
  button.btn-sec:hover {
    background: rgba(255,255,255,0.05);
    color: #fff;
  }

  /* Responsive */
  @media(max-width: 768px) {
    :root { --cube-size: 240px; }
    header { padding: 15px; flex-direction: column; gap: 15px; align-items: flex-start; }
    .hero-stats { gap: 10px; margin-bottom: 15px; }
    .stat-value { font-size: 1.4rem; }
    .formula-panel { min-width: auto; width: 100%; max-width: 280px; }
    .footer-dock { bottom: 20px; width: 95%; }
    .secondary-controls { width: 100%; justify-content: space-between; }
  }
</style>
</head>
<body>

<div class="app-container">
  
  <!-- Header -->
  <header>
    <div class="header-left">
      <div class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v18H3z"></path><path d="M3 9h18"></path><path d="M9 21V9"></path><path d="M15 21V9"></path><path d="M21 15H3"></path></svg>
        THE CUBE
      </div>
      
      <!-- Compact Formula/Tip Panel (Top Left) -->
      <div class="formula-panel">
        <div class="panel-label">Current Scramble</div>
        <div class="move-list" id="scramble-display">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>

    <!-- Size Selectors -->
    <div class="size-selector">
      <button class="size-btn" onclick="setCubeSize(2)">2x2</button>
      <button class="size-btn active" onclick="setCubeSize(3)">3x3</button>
      <button class="size-btn" onclick="setCubeSize(4)">4x4</button>
      <button class="size-btn" onclick="setCubeSize(5)">5x5</button>
    </div>
  </header>

  <!-- Main Stage -->
  <div class="main-stage">
    
    <!-- Timer & Moves (Centered Top HUD) -->
    <div class="hero-stats">
      <div class="stat-item">
        <div class="stat-label">Moves</div>
        <div class="stat-value" id="move-count">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Time</div>
        <div class="stat-value" id="timer">00:00</div>
      </div>
    </div>

    <!-- 3D Cube -->
    <div class="scene-container" id="scene">
      <div class="cube-shadow"></div>
      <div class="cube" id="cube">
        <!-- Faces generated by JS -->
      </div>
    </div>

  </div>

  <!-- Footer Controls -->
  <div class="footer-dock">
    <!-- Primary Action (Elevated) -->
    <button class="btn-primary" onclick="scrambleCube()">SCRAMBLE</button>
    
    <!-- Secondary Controls (Grouped) -->
    <div class="secondary-controls">
      <button class="btn-sec" onclick="undoMove()">Undo</button>
      <button class="btn-sec" onclick="getHint()">Hint</button>
      <button class="btn-sec" onclick="resetCube()">Reset</button>
    </div>
  </div>

</div>

<script>
  // --- CONFIGURATION ---
  const COLORS = {
    U: 'var(--c-white)', 
    D: 'var(--c-yellow)', 
    F: 'var(--c-green)', 
    B: 'var(--c-red)',   
    R: 'var(--c-orange)', 
    L: 'var(--c-blue)'   
  };

  const NOTATION_COLORS = {
    'R': 'n-R', 'L': 'n-L', 'U': 'n-U', 'D': 'n-D', 'F': 'n-F', 'B': 'n-B'
  };

  // --- STATE ---
  let moveHistory = [];
  let timerInterval;
  let seconds = 0;
  let isDragging = false;
  let startX, startY;
  let currentRotX = -25;
  let currentRotY = -40;
  let currentSize = 3;

  // --- DOM ELEMENTS ---
  const cubeEl = document.getElementById('cube');
  const sceneEl = document.getElementById('scene');
  const timerEl = document.getElementById('timer');
  const moveCountEl = document.getElementById('move-count');
  const scrambleDisplayEl = document.getElementById('scramble-display');

  // --- INITIALIZATION ---
  function init() {
    createCubeDOM(3);
    setupInteraction();
    // Initial Scramble State (Critique Requirement)
    scrambleCube();
  }

  // --- DOM GENERATION ---
  function createCubeDOM(size) {
    cubeEl.innerHTML = '';
    const faces = ['front', 'back', 'right', 'left', 'top', 'bottom'];
    
    faces.forEach((faceName, index) => {
      const faceDiv = document.createElement('div');
      faceDiv.className = `face ${faceName}`;
      
      // Create grid based on size
      const count = size * size;
      faceDiv.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
      faceDiv.style.gridTemplateRows = `repeat(${size}, 1fr)`;
      
      for(let i=0; i<count; i++) {
        const sticker = document.createElement('div');
        sticker.className = 'sticker';
        sticker.dataset.index = i;
        faceDiv.appendChild(sticker);
      }
      cubeEl.appendChild(faceDiv);
    });
    
    // Default solved state colors
    resetColors();
  }

  function resetColors() {
    const faces = ['F', 'B', 'R', 'L', 'U', 'D'];
    cubeEl.childNodes.forEach((face, i) => {
      const color = COLORS[faces[i]];
      Array.from(face.children).forEach(sticker => {
        sticker.style.backgroundColor = color;
      });
    });
  }

  // --- LOGIC: MOVES & SCRAMBLE ---
  
  function scrambleCube() {
    stopTimer();
    seconds = 0;
    updateTimerDisplay();
    moveCountEl.innerText = '0';
    
    const moves = ['F', 'B', 'U', 'D', 'L', 'R'];
    const modifiers = ['', "'", '2'];
    let generatedMoves = [];
    
    // Generate 20 moves
    for(let i=0; i<20; i++) {
      const m = moves[Math.floor(Math.random() * moves.length)];
      const mod = modifiers[Math.floor(Math.random() * modifiers.length)];
      generatedMoves.push(m + mod);
    }
    
    renderScrambleText(generatedMoves);
    
    // Visual Scramble Animation
    let count = 0;
    const interval = setInterval(() => {
      randomizeColors();
      // Shake effect
      sceneEl.style.transform = `rotateX(${currentRotX + (Math.random()*10-5)}deg) rotateY(${currentRotY + (Math.random()*10-5)}deg)`;
      count++;
      if(count > 12) {
        clearInterval(interval);
        sceneEl.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
        // Start timer with offset to simulate active state (Critique)
        seconds = 12; 
        updateTimerDisplay();
        startTimer();
      }
    }, 50);
  }

  function renderScrambleText(moves) {
    scrambleDisplayEl.innerHTML = '';
    moves.forEach(move => {
      const char = move.charAt(0);
      const mod = move.substring(1);
      const colorClass = NOTATION_COLORS[char] || 'n-F';
      
      const chunk = document.createElement('span');
      chunk.className = 'move-chunk';
      
      const charSpan = document.createElement('span');
      charSpan.className = `move-char ${colorClass}`;
      charSpan.innerText = char;
      
      const modSpan = document.createElement('span');
      modSpan.className = 'mod-char';
      modSpan.innerText = mod;
      
      chunk.appendChild(charSpan);
      chunk.appendChild(modSpan);
      scrambleDisplayEl.appendChild(chunk);
    });
  }

  function randomizeColors() {
    const allStickers = document.querySelectorAll('.sticker');
    const colorKeys = Object.keys(COLORS);
    allStickers.forEach(s => {
      const randColor = COLORS[colorKeys[Math.floor(Math.random() * colorKeys.length)]];
      s.style.backgroundColor = randColor;
    });
  }

  // --- CONTROLS ---
  function startTimer() {
    stopTimer();
    timerInterval = setInterval(() => {
      seconds++;
      updateTimerDisplay();
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
  }

  function updateTimerDisplay() {
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = (seconds % 60).toString().padStart(2, '0');
    timerEl.innerText = `${m}:${s}`;
  }

  function resetCube() {
    stopTimer();
    seconds = 0;
    updateTimerDisplay();
    moveCountEl.innerText = '0';
    resetColors();
    scrambleDisplayEl.innerHTML = '<span style="opacity:0.5; font-size:0.8rem;">Ready</span>';
  }

  function setCubeSize(size) {
    currentSize = size;
    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    
    // Adjust CSS variable for scale
    document.documentElement.style.setProperty('--cube-size', (size * 60) + 'px');
    
    createCubeDOM(size);
    resetCube();
  }

  function undoMove() {
    if(seconds > 0) {
      seconds = Math.max(0, seconds - 1);
      updateTimerDisplay();
    }
  }

  function getHint() {
    alert("Pro Tip: Start by solving the white cross, ensuring the side colors match the center pieces.");
  }

  // --- INTERACTION (3D ROTATION) ---
  function setupInteraction() {
    document.addEventListener('mousedown', (e) => {
      if(e.target.closest('.btn-primary') || e.target.closest('.btn-sec') || e.target.closest('.size-btn') || e.target.closest('.formula-panel')) return;
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      sceneEl.style.transition = 'none';
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - startX;
      const deltaY = e.clientY - startY;
      
      currentRotY += deltaX * 0.5;
      currentRotX -= deltaY * 0.5;
      
      // Clamp X rotation to avoid flipping upside down completely
      currentRotX = Math.max(-90, Math.min(90, currentRotX));

      sceneEl.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
      
      startX = e.clientX;
      startY = e.clientY;
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
      sceneEl.style.transition = 'transform 0.1s linear';
    });
    
    // Touch support
    document.addEventListener('touchstart', (e) => {
      if(e.target.closest('.btn-primary') || e.target.closest('.btn-sec') || e.target.closest('.size-btn')) return;
      isDragging = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      sceneEl.style.transition = 'none';
    });
    
    document.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const deltaX = e.touches[0].clientX - startX;
      const deltaY = e.touches[0].clientY - startY;
      
      currentRotY += deltaX * 0.5;
      currentRotX -= deltaY * 0.5;
      currentRotX = Math.max(-90, Math.min(90, currentRotX));

      sceneEl.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
      
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    });
    
    document.addEventListener('touchend', () => {
      isDragging = false;
      sceneEl.style.transition = 'transform 0.1s linear';
    });
  }

  // Start
  init();

</script>
</body>
</html>
