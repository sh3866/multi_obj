<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMONO — The Art of Draping</title>
    <style>
        :root {
            --bg-paper: #EBE6DB; /* Warmer, slightly darker paper */
            --ink-black: #151515;
            --kimono-indigo: #0f1c2e; /* Deep Midnight */
            --kimono-mid: #1b3b4f;
            --kimono-highlight: #2a506b;
            --obi-base: #E6E2D6;
            --obi-shadow: #C5C0B3;
            --obi-accent: #A83200; /* Deep Vermilion */
            --obi-accent-light: #D64500;
            --font-serif: "Didot", "Bodoni MT", "Times New Roman", serif;
            --font-sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-paper);
            color: var(--ink-black);
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Critique Point 5: Reduced opacity noise texture */
        .texture-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            opacity: 0.06; /* Reduced from 0.4 */
            mix-blend-mode: multiply;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Layout */
        main {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1.2fr 1.8fr 0.8fr; /* Adjusted grid for tighter composition */
            position: relative;
            z-index: 1;
            padding: 0 2rem;
        }

        /* Typography Areas */
        .sidebar {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .sidebar-left {
            align-items: flex-end; /* Moved closer to center */
            text-align: right;
            padding-right: 3rem;
        }

        .sidebar-right {
            align-items: flex-start;
            padding-left: 2rem;
            justify-content: center;
        }

        /* Critique Point 4: Typography Hierarchy */
        h1 {
            font-family: var(--font-serif);
            font-size: 4rem; /* Reduced by ~20% from 5rem */
            font-weight: 400;
            line-height: 1.1;
            letter-spacing: -0.01em; /* Tighter tracking */
            color: var(--kimono-indigo);
            margin-bottom: 1rem;
            font-style: italic;
        }

        .subtitle {
            font-family: var(--font-sans);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: #666;
            margin-bottom: 1.5rem;
            border-top: 1px solid rgba(0,0,0,0.15);
            padding-top: 0.8rem;
            width: 120px;
            margin-left: auto; /* Push to right */
        }

        .description {
            font-family: var(--font-sans);
            font-size: 0.95rem;
            line-height: 1.6;
            max-width: 280px;
            color: #444;
            font-weight: 300;
        }

        /* Critique Point 4: Vertical Text Opacity */
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-family: var(--font-serif);
            font-size: 1.4rem;
            letter-spacing: 0.4em;
            color: var(--kimono-indigo);
            height: 350px;
            opacity: 0.4; /* Reduced to 40% */
        }

        /* Center Stage */
        .center-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        #kimono-container {
            width: 100%;
            height: 100%;
            max-width: 550px;
            max-height: 85vh;
            transition: transform 0.15s ease-out;
            will-change: transform;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            filter: drop-shadow(0px 25px 20px rgba(0,0,0,0.15)); /* Critique Point 5: Drop shadow */
        }

        /* Animation */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .floating {
            animation: float 7s ease-in-out infinite;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
                padding: 2rem;
            }
            .sidebar-left {
                align-items: center;
                text-align: center;
                padding-right: 0;
                margin-bottom: 2rem;
            }
            .subtitle { margin: 0 auto 1rem auto; }
            .sidebar-right { display: none; }
            h1 { font-size: 3rem; }
            .center-stage { height: 60vh; }
        }
    </style>
</head>
<body>

    <div class="texture-overlay"></div>

    <main>
        <!-- Left Sidebar -->
        <div class="sidebar-left">
            <div class="subtitle">Traditional Craft</div>
            <h1>Indigo<br>Flow</h1>
            <p class="description">
                A study in silk drape and geometry. 
                Featuring the <em>Asanoha</em> (hemp leaf) motif 
                woven into the narrative of fabric.
            </p>
        </div>

        <!-- Center Visual -->
        <div class="center-stage">
            <div id="kimono-container" class="floating">
                <!-- viewBox adjusted to frame the garment better -->
                <svg viewBox="0 0 500 850" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Critique Point 3: Enhanced Pattern (Asanoha) -->
                        <pattern id="asanoha" x="0" y="0" width="40" height="69.28" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
                            <!-- Tiling Hexagons -->
                            <path d="M20,0 L40,11.55 L40,34.64 L20,46.19 L0,34.64 L0,11.55 Z" fill="none" stroke="#4B869E" stroke-width="1.2" opacity="0.5"/>
                            <path d="M20,69.28 L40,57.73 L40,34.64 L20,46.19 L0,34.64 L0,57.73 Z" fill="none" stroke="#4B869E" stroke-width="1.2" opacity="0.5"/>
                            <!-- Inner Motif -->
                            <path d="M20,15 L28,20 L28,29 L20,34 L12,29 L12,20 Z" fill="none" stroke="#E8E4D9" stroke-width="0.5" opacity="0.6"/>
                            <path d="M20,54.28 L28,49.28 L28,40.28 L20,35.28 L12,40.28 L12,49.28 Z" fill="none" stroke="#E8E4D9" stroke-width="0.5" opacity="0.6"/>
                        </pattern>

                        <!-- Critique Point 3: Gradients for Materiality -->
                        <!-- Main Body Gradient (Sheen) -->
                        <linearGradient id="fabric-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#0d1f2b" />
                            <stop offset="30%" stop-color="var(--kimono-mid)" />
                            <stop offset="50%" stop-color="var(--kimono-highlight)" /> <!-- Highlight -->
                            <stop offset="75%" stop-color="var(--kimono-mid)" />
                            <stop offset="100%" stop-color="#0d1f2b" />
                        </linearGradient>

                        <!-- Sleeve Gradient (Deeper shadow) -->
                        <linearGradient id="sleeve-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#0d1f2b" />
                            <stop offset="100%" stop-color="#152e3d" />
                        </linearGradient>

                        <!-- Critique Point 2: Refined Obi Gradients -->
                        <linearGradient id="obi-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#F0EDE5" /> <!-- Top Highlight -->
                            <stop offset="20%" stop-color="#E6E2D6" />
                            <stop offset="80%" stop-color="#D1CCC0" />
                            <stop offset="100%" stop-color="#B8B3A5" /> <!-- Bottom Shadow -->
                        </linearGradient>

                        <linearGradient id="obi-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#7A2400" />
                            <stop offset="50%" stop-color="var(--obi-accent-light)" />
                            <stop offset="100%" stop-color="#7A2400" />
                        </linearGradient>

                        <!-- Fabric Sheen Overlay -->
                        <linearGradient id="sheen-overlay" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="rgba(255,255,255,0)" />
                            <stop offset="40%" stop-color="rgba(255,255,255,0.05)" />
                            <stop offset="60%" stop-color="rgba(255,255,255,0.05)" />
                            <stop offset="100%" stop-color="rgba(255,255,255,0)" />
                        </linearGradient>
                    </defs>

                    <g>
                        <!-- Critique Point 1: Reconstructed Garment Geometry -->
                        
                        <!-- Left Sleeve (Organic Taper) -->
                        <path d="M160,150 
                                 C130,150 80,170 50,200 
                                 C40,215 40,245 55,255 
                                 C80,265 120,240 145,190 
                                 L145,155 Z" 
                              fill="url(#sleeve-grad)" />

                        <!-- Right Sleeve (Organic Taper) -->
                        <path d="M340,150 
                                 C370,150 420,170 450,200 
                                 C460,215 460,245 445,255 
                                 C420,265 380,240 355,190 
                                 L355,155 Z" 
                              fill="url(#sleeve-grad)" />

                        <!-- Main Body (A-Line Drape) -->
                        <path d="M160,150 
                                 Q250,175 340,150 
                                 C350,300 365,550 370,780 
                                 Q250,810 130,780 
                                 C135,550 150,300 160,150 Z" 
                              fill="url(#fabric-grad)" />
                        
                        <!-- Pattern Overlay (Clipped to body) -->
                        <clipPath id="body-clip">
                             <path d="M160,150 Q250,175 340,150 C350,300 365,550 370,780 Q250,810 130,780 C135,550 150,300 160,150 Z" />
                        </clipPath>
                        <rect x="0" y="0" width="500" height="850" fill="url(#asanoha)" clip-path="url(#body-clip)" opacity="0.7" />
                        <!-- Sheen Overlay -->
                        <rect x="0" y="0" width="500" height="850" fill="url(#sheen-overlay)" clip-path="url(#body-clip)" />

                        <!-- Collar (Eri) - Deepened overlap -->
                        <!-- Left Collar (Shadow layer) -->
                        <path d="M250,155 
                                 Q180,170 145,780 
                                 Q150,780 155,780 
                                 Q190,175 250,165 Z" 
                              fill="#08121a" />
                        
                        <!-- Right Collar (Top layer - The Eri) -->
                        <path d="M250,155 
                                 Q320,170 355,780 
                                 Q350,780 345,780 
                                 Q310,175 250,165 Z" 
                              fill="#2A506B" />

                        <!-- Fabric Folds (Simulated via subtle strokes) -->
                        <path d="M250,170 L250,420" stroke="#000" stroke-width="1" opacity="0.15" fill="none" />
                        <path d="M180,420 Q190,580 170,780" stroke="#000" stroke-width="2" stroke-linecap="round" opacity="0.1" fill="none" />
                        <path d="M320,420 Q310,580 330,780" stroke="#000" stroke-width="2" stroke-linecap="round" opacity="0.1" fill="none" />

                        <!-- Critique Point 2: Refined Obi Sash (Multi-layered) -->
                        <g transform="translate(0, 0)">
                            
                            <!-- The Wrap (Horizontal Band) -->
                            <path d="M155,450 
                                     Q250,470 345,450 
                                     L348,510 
                                     Q250,530 152,510 Z" 
                                  fill="url(#obi-grad)" />
                            
                            <!-- Obi Edge Accents (Vermilion) -->
                            <path d="M154,452 Q250,472 346,452" stroke="url(#obi-accent-grad)" stroke-width="2" fill="none" />
                            <path d="M151,508 Q250,528 349,508" stroke="url(#obi-accent-grad)" stroke-width="2" fill="none" />

                            <!-- Sculptural Obi Knot (Tate-gama style) -->
                            <g transform="translate(250, 480)">
                                <!-- Main Knot Body -->
                                <path d="M-50,-10 
                                         L-60,20 
                                         L-40,50 
                                         L40,50 
                                         L60,20 
                                         L50,-10 Z" 
                                      fill="url(#obi-grad)" 
                                      stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
                                
                                <!-- Vermilion Ribbon Over Knot -->
                                <path d="M-52,0 L52,0" stroke="url(#obi-accent-grad)" stroke-width="5" stroke-linecap="round"/>
                                <path d="M-42,15 L42,15" stroke="url(#obi-accent-grad)" stroke-width="5" stroke-linecap="round"/>
                                
                                <!-- Tails (Hanging down) - Left -->
                                <path d="M-40,50 L-50,140 L-20,140 L-15,50 Z" fill="url(#obi-grad)" />
                                <!-- Tails (Hanging down) - Right -->
                                <path d="M40,50 L50,140 L20,140 L15,50 Z" fill="url(#obi-grad)" />
                                
                                <!-- Ribbon Tails (Vermilion) - Left -->
                                <path d="M-25,50 L-35,150 L-5,150 L-5,50 Z" fill="url(#obi-accent-grad)" />
                                <!-- Ribbon Tails (Vermilion) - Right -->
                                <path d="M25,50 L35,150 L5,150 L5,50 Z" fill="url(#obi-accent-grad)" />
                            </g>
                        </g>
                    </g>
                </svg>
            </div>
        </div>

        <!-- Right Sidebar: Vertical Typography -->
        <div class="sidebar-right">
            <div class="vertical-text">
                和服の美意識 <br>
                <span style="font-size: 0.8em; opacity: 0.5;">Harmony • Respect • Purity • Truth</span>
            </div>
        </div>
    </main>

    <script>
        // Subtle Parallax Effect
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX) / 50; // Slightly reduced sensitivity
            const y = (window.innerHeight - e.pageY) / 50;
            
            const container = document.getElementById('kimono-container');
            container.style.transform = `
                translate(${x}px, ${y}px) 
                rotateY(${x * 0.5}deg) 
                rotateX(${-y * 0.5}deg)
            `;
        });
    </script>
</body>
</html>
