<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMONO — Furisode Nocturne</title>
    <style>
        :root {
            --bg-deep: #05080F;
            --bg-wash: #0F1526;
            --text-gold: #E6D2B5;
            --text-muted: #6B7A99;
            --kimono-indigo: #182D4D;
            --kimono-dark: #0A1424;
            --obi-red: #681515;
            --obi-highlight: #9E2A2A;
            --obi-shadow: #3D0A0A;
            --font-serif: "Didot", "Bodoni Moda", "Playfair Display", "Times New Roman", serif;
            --font-sans: "Helvetica Neue", "Helvetica", "Arial", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 30%, var(--bg-wash) 0%, var(--bg-deep) 80%);
            color: var(--text-gold);
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Atmospheric Background Texture (Seigaiha hint) */
        .bg-texture {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.05;
            background-image: 
                radial-gradient(circle at 50% 100%, rgba(255,255,255,0.1) 2px, transparent 2.5px),
                radial-gradient(circle at 50% 100%, rgba(255,255,255,0.1) 2px, transparent 2.5px);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            mask-image: linear-gradient(to top, black 40%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, black 40%, transparent 100%);
        }

        /* Layout */
        main {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 20% 60% 20%;
            position: relative;
            z-index: 5;
        }

        /* Typography Areas */
        .sidebar-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 4rem;
            position: relative;
        }

        .sidebar-right {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        /* Typography Hierarchy */
        .subtitle {
            font-family: var(--font-sans);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--text-muted);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitle::before {
            content: '';
            display: block;
            width: 30px;
            height: 1px;
            background-color: var(--text-muted);
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 4.5rem;
            font-weight: 300;
            line-height: 1;
            letter-spacing: -0.02em;
            color: var(--text-gold);
            margin-bottom: 1.5rem;
            text-shadow: 0 0 30px rgba(230, 210, 181, 0.1);
        }

        .description {
            font-family: var(--font-sans);
            font-size: 0.9rem;
            line-height: 1.8;
            max-width: 260px;
            color: var(--text-muted);
            font-weight: 300;
            border-left: 1px solid rgba(230, 210, 181, 0.2);
            padding-left: 1.5rem;
        }

        /* Vertical Text */
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-family: var(--font-serif);
            font-size: 2rem;
            letter-spacing: 0.8em;
            color: var(--text-gold);
            opacity: 0.9;
            user-select: none;
            text-shadow: 0 0 15px rgba(230, 210, 181, 0.2);
            font-weight: 400;
        }

        /* Center Stage */
        .center-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 2500px;
        }

        #kimono-container {
            width: 100%;
            height: 100%;
            max-width: 900px;
            max-height: 95vh;
            transition: transform 0.1s ease-out;
            will-change: transform;
            /* Soft drop shadow for separation from background */
            filter: drop-shadow(0px 30px 50px rgba(0,0,0,0.8));
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Animation */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        .floating {
            animation: float 12s ease-in-out infinite;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
                padding: 2rem;
            }
            .sidebar-left {
                align-items: center;
                text-align: center;
                padding-left: 0;
                padding-bottom: 1rem;
                order: 1;
            }
            .subtitle { justify-content: center; margin: 0 auto 1rem auto; }
            .description { border-left: none; padding-left: 0; margin: 0 auto; }
            .center-stage { order: 2; }
            .sidebar-right { order: 3; display: none; }
            h1 { font-size: 3rem; }
            #kimono-container { max-height: 60vh; }
        }
    </style>
</head>
<body>

    <div class="bg-texture"></div>

    <main>
        <!-- Left Sidebar -->
        <div class="sidebar-left">
            <div class="subtitle">Silk & Geometry</div>
            <h1>Furisode<br>Nocturne</h1>
            <p class="description">
                A study in fluid draping and negative space. 
                <em>Sakura</em> (cherry blossom) motifs 
                woven into midnight indigo silk.
            </p>
        </div>

        <!-- Center Visual -->
        <div class="center-stage">
            <div id="kimono-container" class="floating">
                <!-- viewBox adjusted to capture full length -->
                <svg viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- 1. Sakura Pattern (Systematized Diagonal Flow) -->
                        <pattern id="sakura-pattern" x="0" y="0" width="140" height="140" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                            <!-- Petal -->
                            <path id="petal" d="M0,0 C12,-12 24,-6 24,0 C24,6 12,12 0,0 C-12,12 -24,6 -24,0 C-24,-6 -12,-12 0,0 Z" />
                            
                            <!-- Small Blossom -->
                            <g transform="translate(40, 40) scale(0.6)">
                                <use href="#petal" fill="#D4AF37" opacity="0.5" transform="rotate(0)" />
                                <use href="#petal" fill="#D4AF37" opacity="0.5" transform="rotate(72)" />
                                <use href="#petal" fill="#D4AF37" opacity="0.5" transform="rotate(144)" />
                                <use href="#petal" fill="#D4AF37" opacity="0.5" transform="rotate(216)" />
                                <use href="#petal" fill="#D4AF37" opacity="0.5" transform="rotate(288)" />
                                <circle cx="0" cy="0" r="2" fill="#FFF" opacity="0.9"/>
                            </g>
                            
                            <!-- Large Blossom -->
                            <g transform="translate(120, 120) scale(1.0)">
                                <use href="#petal" fill="#E8C3C3" opacity="0.3" transform="rotate(10)" />
                                <use href="#petal" fill="#E8C3C3" opacity="0.3" transform="rotate(82)" />
                                <use href="#petal" fill="#E8C3C3" opacity="0.3" transform="rotate(154)" />
                                <use href="#petal" fill="#E8C3C3" opacity="0.3" transform="rotate(226)" />
                                <use href="#petal" fill="#E8C3C3" opacity="0.3" transform="rotate(298)" />
                                <circle cx="0" cy="0" r="3" fill="#FFF" opacity="0.7"/>
                            </g>
                        </pattern>

                        <!-- 2. Gradients for Materiality -->
                        
                        <!-- Indigo Silk Body: Cylindrical volume simulation -->
                        <linearGradient id="fabric-body" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#0A1525" />
                            <stop offset="15%" stop-color="#182D4D" />
                            <stop offset="45%" stop-color="#2F507A" /> <!-- Light source reflection -->
                            <stop offset="85%" stop-color="#182D4D" />
                            <stop offset="100%" stop-color="#0A1525" />
                        </linearGradient>

                        <!-- Sleeve Gradient: Flatter but draped -->
                        <linearGradient id="fabric-sleeve" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#0A1525" />
                            <stop offset="50%" stop-color="#182D4D" />
                            <stop offset="100%" stop-color="#0A1525" />
                        </linearGradient>

                        <!-- Obi Base: Rich red silk -->
                        <linearGradient id="obi-base-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#3D0A0A" />
                            <stop offset="20%" stop-color="var(--obi-red)" />
                            <stop offset="50%" stop-color="var(--obi-highlight)" />
                            <stop offset="80%" stop-color="var(--obi-red)" />
                            <stop offset="100%" stop-color="#3D0A0A" />
                        </linearGradient>

                        <!-- Obi Knot: 3D Sculptural shading -->
                        <linearGradient id="obi-knot-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#B84040" />
                            <stop offset="50%" stop-color="var(--obi-red)" />
                            <stop offset="100%" stop-color="var(--obi-shadow)" />
                        </linearGradient>

                        <!-- Mask to fade pattern at edges -->
                        <radialGradient id="pattern-mask-grad" cx="50%" cy="50%" r="65%">
                            <stop offset="0%" stop-color="white" stop-opacity="0.8"/>
                            <stop offset="60%" stop-color="white" stop-opacity="0.5"/>
                            <stop offset="100%" stop-color="black" stop-opacity="0"/>
                        </radialGradient>
                        <mask id="pattern-mask">
                            <rect width="100%" height="100%" fill="url(#pattern-mask-grad)"/>
                        </mask>
                    </defs>

                    <g id="kimono-assembly" transform="translate(0, 20)">
                        
                        <!-- 1. Main Body (Torso + Skirt) - Fluid Curves -->
                        <!-- Reshaped to taper at waist and flare at bottom -->
                        <path d="M320,160 
                                 L480,160 
                                 L460,450 
                                 L560,1100 
                                 Q400,1130 240,1100 
                                 L340,450 Z" 
                              fill="url(#fabric-body)" />

                        <!-- Pattern Overlay on Body -->
                        <rect x="0" y="0" width="800" height="1200" fill="url(#sakura-pattern)" mask="url(#pattern-mask)" />

                        <!-- 2. Left Sleeve (Sode) - Organic Drop -->
                        <!-- Shoulders curve, sleeve drops low -->
                        <path d="M320,160 
                                 C280,160 240,170 210,220 
                                 L140,650 
                                 Q130,670 150,670
                                 L230,670 
                                 C260,450 280,250 320,160 Z" 
                              fill="url(#fabric-sleeve)" />
                        
                        <!-- 3. Right Sleeve - Organic Drop -->
                        <path d="M480,160 
                                 C520,160 560,170 590,220 
                                 L660,650 
                                 Q670,670 650,670
                                 L570,670 
                                 C540,450 520,250 480,160 Z" 
                              fill="url(#fabric-sleeve)" />

                        <!-- Pattern on Sleeves (Clipped) -->
                        <clipPath id="sleeves-clip">
                            <path d="M320,160 C280,160 240,170 210,220 L140,650 Q130,670 150,670 L230,670 C260,450 280,250 320,160 Z" />
                            <path d="M480,160 C520,160 560,170 590,220 L660,650 Q670,670 650,670 L570,670 C540,450 520,250 480,160 Z" />
                        </clipPath>
                        <rect x="0" y="0" width="800" height="1200" fill="url(#sakura-pattern)" clip-path="url(#sleeves-clip)" opacity="0.8"/>

                        <!-- 4. Collar Structure (Eri) - Refined & Thin -->
                        <!-- Under-collar (Nagajuban) - Right side (visible underneath) -->
                        <path d="M395,155 
                                 Q500,175 545,1090 
                                 L535,1090 
                                 Q495,185 395,155 Z" 
                              fill="#F2EFE9" opacity="0.9" />
                        
                        <!-- Main Outer Collar (Eri) - Left Over Right (V-Shape Intersection) -->
                        <!-- Left Collar (Top Layer) - Pale Gold/White -->
                        <path d="M400,150 
                                 Q290,185 265,1095 
                                 L280,1095 
                                 Q305,190 400,150 Z" 
                              fill="#E6D2B5" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
                        
                        <!-- Right Collar (Bottom Layer) -->
                        <path d="M400,150 
                                 Q510,185 535,1095 
                                 L520,1095 
                                 Q505,190 400,150 Z" 
                              fill="#E6D2B5" />

                        <!-- Fabric Folds (Subtle Depth) -->
                        <path d="M400,160 L400,500" stroke="#000" stroke-width="2" opacity="0.1" fill="none" />
                        <path d="M330,500 Q340,800 320,1100" stroke="#000" stroke-width="4" stroke-linecap="round" opacity="0.08" fill="none" />
                        <path d="M470,500 Q460,800 480,1100" stroke="#000" stroke-width="4" stroke-linecap="round" opacity="0.08" fill="none" />

                        <!-- 5. Obi Sash Group (Taiko Musubi) -->
                        <g transform="translate(0, 550)">
                            
                            <!-- The Obi Wrap (Front) - Wider, Voluminous -->
                            <path d="M270,0 
                                     Q400,25 530,0 
                                     L535,90 
                                     Q400,115 265,90 Z" 
                                  fill="url(#obi-base-grad)" />
                            
                            <!-- Obi-ji (Central Motif) - Gold Geometric -->
                            <g opacity="0.8">
                                <path d="M380,45 L420,45 M400,25 L400,65" stroke="var(--text-gold)" stroke-width="2" />
                                <circle cx="400" cy="45" r="15" fill="none" stroke="var(--text-gold)" stroke-width="1" />
                            </g>

                            <!-- The Taiko Knot (Back Volume) -->
                            <g transform="translate(400, 20)">
                                <!-- Back bulk (The drum) - 3D shading -->
                                <path d="M-80,-60 L80,-60 L90,50 L-90,50 Z" fill="url(#obi-knot-grad)" />
                                
                                <!-- Side loops (The 'wings') - Thick strokes -->
                                <path d="M-80,-40 C-120,-40 -120,30 -80,30" fill="none" stroke="url(#obi-base-grad)" stroke-width="22" stroke-linecap="round"/>
                                <path d="M80,-40 C120,-40 120,30 80,30" fill="none" stroke="url(#obi-base-grad)" stroke-width="22" stroke-linecap="round"/>
                                
                                <!-- Obi-jime (Sash/Cord) - Gold Cord -->
                                <path d="M-85,-20 L85,-20" stroke="var(--text-gold)" stroke-width="10" stroke-linecap="round"/>
                                <path d="M-85,20 L85,20" stroke="var(--text-gold)" stroke-width="10" stroke-linecap="round"/>
                                
                                <!-- Obi-age (Stiffener sticking out top) -->
                                <path d="M-60,-60 L60,-60 L55,-105 L-55,-105 Z" fill="#4A1515" />
                                <!-- Gold trim on Obi-age -->
                                <path d="M-55,-105 L55,-105 L50,-112 L-50,-112 Z" fill="var(--text-gold)" />
                            </g>

                            <!-- Obi-dori (Trailing Ribbons) -->
                            <path d="M360,70 L350,300 L375,300 L380,70 Z" fill="var(--text-gold)" opacity="0.9"/>
                            <path d="M440,70 L450,300 L425,300 L420,70 Z" fill="var(--text-gold)" opacity="0.9"/>
                        </g>

                    </g>
                </svg>
            </div>
        </div>

        <!-- Right Sidebar: Vertical Typography -->
        <div class="sidebar-right">
            <div class="vertical-text">
                美意識
                <br>
                <span style="font-size: 0.5em; opacity: 0.6; font-family: var(--font-sans); letter-spacing: 0.1em; margin-top: 20px;">AESTHETICS</span>
            </div>
        </div>
    </main>

    <script>
        // Subtle Parallax Effect
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 150; 
            const y = (window.innerHeight - e.pageY * 2) / 150;
            
            const container = document.getElementById('kimono-container');
            // Reduced rotation for elegance
            container.style.transform = `
                translate(${x}px, ${y}px) 
                rotateY(${x * 0.3}deg) 
                rotateX(${-y * 0.3}deg)
            `;
        });
    </script>
</body>
</html>
