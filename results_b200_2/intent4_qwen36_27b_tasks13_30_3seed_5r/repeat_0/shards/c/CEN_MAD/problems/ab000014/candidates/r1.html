<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMONO — The Art of Draping</title>
    <style>
        :root {
            --bg-paper: #F2EFE8; /* Warm, textured paper tone */
            --ink-black: #1A1A1A;
            --kimono-base: #1B3B4F; /* Indigo */
            --kimono-dark: #0F2430;
            --kimono-light: #2A506B;
            --obi-cream: #E8E4D9;
            --obi-ribbon: #C04000; /* Vermilion */
            --accent-gold: #D4AF37;
            --font-serif: "Playfair Display", "Didot", "Bodoni MT", "Times New Roman", serif;
            --font-sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-paper);
            color: var(--ink-black);
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Warm Paper Texture Overlay */
        .texture-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            opacity: 0.4;
            mix-blend-mode: multiply;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Layout */
        main {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            position: relative;
            z-index: 1;
        }

        /* Typography Areas */
        .sidebar {
            padding: 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .sidebar-left {
            align-items: flex-start;
        }

        .sidebar-right {
            align-items: flex-end;
            justify-content: space-between;
        }

        /* High-contrast Serif Typography */
        h1 {
            font-family: var(--font-serif);
            font-size: 5rem;
            font-weight: 400; /* Light weight for elegance */
            line-height: 1;
            letter-spacing: -0.02em;
            color: var(--kimono-dark);
            margin-bottom: 1rem;
            font-style: italic;
        }

        .subtitle {
            font-family: var(--font-sans);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #666;
            margin-bottom: 2rem;
            border-top: 1px solid rgba(0,0,0,0.2);
            padding-top: 1rem;
            width: 150px;
        }

        .description {
            font-family: var(--font-serif);
            font-size: 1.25rem;
            line-height: 1.5;
            max-width: 320px;
            color: #444;
        }

        /* Vertical Japanese Typography */
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-family: var(--font-serif);
            font-size: 1.5rem;
            letter-spacing: 0.3em;
            color: var(--kimono-base);
            height: 300px;
            opacity: 0.8;
        }

        /* Center Stage */
        .center-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        #kimono-container {
            width: 100%;
            height: 100%;
            max-width: 600px;
            max-height: 90vh;
            transition: transform 0.1s ease-out; /* Smoother JS tracking */
            will-change: transform;
        }

        /* SVG Specific Styles */
        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Animation */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .floating {
            animation: float 8s ease-in-out infinite;
        }

        /* Responsive Adjustments */
        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
            }
            .sidebar {
                padding: 2rem;
            }
            .sidebar-left {
                align-items: center;
                text-align: center;
            }
            .sidebar-right {
                display: none; /* Hide vertical text on mobile */
            }
            h1 { font-size: 3.5rem; }
            .subtitle { margin: 0 auto 1.5rem auto; }
        }
    </style>
</head>
<body>

    <div class="texture-overlay"></div>

    <main>
        <!-- Left Sidebar -->
        <div class="sidebar-left">
            <div class="subtitle">Traditional Craft</div>
            <h1>Indigo<br>Flow</h1>
            <p class="description">
                A study in silk drape and geometry. 
                Featuring the <em>Asanoha</em> (hemp leaf) motif 
                woven into the narrative of fabric.
            </p>
        </div>

        <!-- Center Visual -->
        <div class="center-stage">
            <div id="kimono-container" class="floating">
                <svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- 1. Authentic Pattern: Asanoha (Hemp Leaf) -->
                        <pattern id="asanoha" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="scale(0.8)">
                            <rect width="40" height="40" fill="transparent"/>
                            <!-- Hexagonal Leaf Motif -->
                            <path d="M20,5 L35,15 L35,30 L20,35 L5,30 L5,15 Z" fill="none" stroke="#4B869E" stroke-width="1.5" opacity="0.6"/>
                            <path d="M20,10 L30,17 L30,27 L20,32 L10,27 L10,17 Z" fill="none" stroke="#E8E4D9" stroke-width="0.5" opacity="0.4"/>
                            <!-- Inner detail -->
                            <line x1="20" y1="5" x2="20" y2="35" stroke="#4B869E" stroke-width="0.5" opacity="0.5"/>
                            <line x1="5" y1="15" x2="35" y2="30" stroke="#4B869E" stroke-width="0.5" opacity="0.5"/>
                            <line x1="35" y1="15" x2="5" y2="30" stroke="#4B869E" stroke-width="0.5" opacity="0.5"/>
                        </pattern>

                        <!-- 2. Materiality: Gradients -->
                        <!-- Fabric Gradient for body -->
                        <linearGradient id="fabric-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#0d1f2b" />
                            <stop offset="20%" stop-color="var(--kimono-base)" />
                            <stop offset="50%" stop-color="var(--kimono-light)" /> <!-- Highlight center -->
                            <stop offset="80%" stop-color="var(--kimono-base)" />
                            <stop offset="100%" stop-color="#0d1f2b" />
                        </linearGradient>

                        <!-- Sleeve Gradient for depth -->
                        <linearGradient id="sleeve-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#0d1f2b" />
                            <stop offset="100%" stop-color="#152e3d" />
                        </linearGradient>

                        <!-- Obi Gradient for volume -->
                        <linearGradient id="obi-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#E8E4D9" />
                            <stop offset="50%" stop-color="#F2EFE8" />
                            <stop offset="100%" stop-color="#C7C3B6" />
                        </linearGradient>

                        <linearGradient id="obi-ribbon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#8A2B00" />
                            <stop offset="50%" stop-color="var(--obi-ribbon)" />
                            <stop offset="100%" stop-color="#8A2B00" />
                        </linearGradient>

                        <!-- Shadow Filter -->
                        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
                            <feOffset dx="0" dy="20" result="offsetblur" />
                            <feComponentTransfer>
                                <feFuncA type="linear" slope="0.15" />
                            </feComponentTransfer>
                            <feMerge>
                                <feMergeNode />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                    </defs>

                    <!-- Main Group with Shadow -->
                    <g filter="url(#soft-shadow)">
                        
                        <!-- 3. Reconstructed Geometry: Bezier Curves -->
                        
                        <!-- Left Sleeve (Organic Drape) -->
                        <path class="kimono-layer" d="M150,140 
                                             C120,140 80,160 50,180 
                                             C40,190 40,220 50,230 
                                             C70,240 110,220 130,180 
                                             L130,150 Z" 
                              fill="url(#sleeve-grad)" />
                        
                        <!-- Right Sleeve -->
                        <path class="kimono-layer" d="M350,140 
                                             C380,140 420,160 450,180 
                                             C460,190 460,220 450,230 
                                             C430,240 390,220 370,180 
                                             L370,150 Z" 
                              fill="url(#sleeve-grad)" />

                        <!-- Main Body (Curved Hem & Shoulders) -->
                        <path class="kimono-layer" d="M150,140 
                                             Q250,160 350,140 
                                             L340,760 
                                             Q250,780 160,760 
                                             Z" 
                              fill="url(#fabric-grad)" />
                        
                        <!-- Pattern Overlay -->
                        <path d="M150,140 Q250,160 350,140 L340,760 Q250,780 160,760 Z" 
                              fill="url(#asanoha)" opacity="0.5" />

                        <!-- 4. Eri (Collar) - Traditional Overlap -->
                        <!-- Left Collar (Bottom layer) -->
                        <path d="M250,145 
                                 Q180,160 160,760 
                                 Q165,760 175,760 
                                 Q195,165 250,155 Z" 
                              fill="#10202C" />
                        
                        <!-- Right Collar (Top layer - The 'Eri') -->
                        <path d="M250,145 
                                 Q320,160 340,760 
                                 Q335,760 325,760 
                                 Q305,165 250,155 Z" 
                              fill="#2A506B" stroke="#4B869E" stroke-width="0.5" />

                        <!-- Fabric Folds (Vertical Seam & Drape) -->
                        <path d="M250,160 L250,400" stroke="#0d1f2b" stroke-width="1" opacity="0.3" fill="none" />
                        <path d="M180,400 Q190,550 170,760" stroke="#0d1f2b" stroke-width="2" stroke-linecap="round" opacity="0.2" fill="none" />
                        <path d="M320,400 Q310,550 330,760" stroke="#0d1f2b" stroke-width="2" stroke-linecap="round" opacity="0.2" fill="none" />

                        <!-- 5. Refined Obi Sash -->
                        <g transform="translate(0, 0)">
                            
                            <!-- The Wrap (Horizontal) -->
                            <path d="M152,440 
                                     Q250,460 348,440 
                                     L345,490 
                                     Q250,510 155,490 Z" 
                                  fill="url(#obi-grad)" />
                            
                            <!-- Obi Ribbon (Vermilion Accent) -->
                            <path d="M153,442 Q250,462 347,442 L346,448 Q250,468 154,448 Z" fill="url(#obi-ribbon-grad)" />
                            <path d="M155,486 Q250,506 345,486 L344,492 Q250,512 156,492 Z" fill="url(#obi-ribbon-grad)" />

                            <!-- Sculptural Obi Knot (Tate-gama style) -->
                            <g transform="translate(250, 465)">
                                <!-- Main Body -->
                                <path d="M-45,0 L-55,25 L-35,45 L35,45 L55,25 L45,0 Z" fill="url(#obi-grad)" />
                                <!-- Vermilion Ribbon Over Knot -->
                                <path d="M-48,5 L48,5" stroke="var(--obi-ribbon)" stroke-width="4" stroke-linecap="round"/>
                                <path d="M-40,20 L40,20" stroke="var(--obi-ribbon)" stroke-width="4" stroke-linecap="round"/>
                                
                                <!-- Tails (Hanging down) -->
                                <path d="M-35,45 L-45,120 L-15,120 L-15,45 Z" fill="url(#obi-grad)" />
                                <path d="M35,45 L45,120 L15,120 L15,45 Z" fill="url(#obi-grad)" />
                                
                                <!-- Ribbon Tails (Vermilion) -->
                                <path d="M-25,45 L-35,130 L-5,130 L-5,45 Z" fill="url(#obi-ribbon-grad)" />
                                <path d="M25,45 L35,130 L5,130 L5,45 Z" fill="url(#obi-ribbon-grad)" />
                            </g>
                        </g>
                    </g>
                </svg>
            </div>
        </div>

        <!-- Right Sidebar: Vertical Typography -->
        <div class="sidebar-right">
            <div class="vertical-text">
                和服の美意識 <br>
                <span style="font-size: 0.8em; opacity: 0.6;">Harmony • Respect • Purity • Truth</span>
            </div>
        </div>
    </main>

    <script>
        // Subtle Parallax Effect
        // We track the mouse position and slightly rotate/translate the kimono container
        // to give it a 3D presence without being distracting.
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX) / 40;
            const y = (window.innerHeight - e.pageY) / 40;
            
            const container = document.getElementById('kimono-container');
            // Combine rotation and translation for organic feel
            container.style.transform = `
                translate(${x}px, ${y}px) 
                rotateY(${x * 0.5}deg) 
                rotateX(${-y * 0.5}deg)
            `;
        });
    </script>
</body>
</html>
