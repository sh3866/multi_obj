<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEO-RUNNER // REVISION 2.0</title>
    <style>
        :root {
            /* 3-Tone Value Hierarchy */
            --c-sky: #1a1a2e;       /* Deep Midnight Blue */
            --c-mid: #2d2d44;       /* Distinct Mid-tone */
            --c-gnd: #e0e0e0;       /* High Contrast Ground */
            --c-hero: #ffffff;      /* Pure White for Hero */
            --c-obs: #050508;       /* Void Black for Obstacles */
            --c-accent: #ff3c00;    /* Neon Red for UI */
            
            /* Typography */
            --font-pixel: 'Courier New', Courier, monospace; /* Fallback for strict offline env */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body {
            background-color: #000;
            color: var(--c-gnd);
            font-family: var(--font-pixel);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Game Container */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: var(--c-sky);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated; /* Retro crispness */
        }

        /* Noise Texture Overlay - Tactile Quality */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            opacity: 0.12;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* HUD Layer - Reorganized */
        .hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 20;
            pointer-events: none;
        }

        .hud-left {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .score-label {
            font-size: 12px;
            color: rgba(224, 224, 224, 0.6);
            letter-spacing: 4px;
            font-weight: bold;
        }

        .score-value {
            font-size: 32px;
            line-height: 1;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            color: var(--c-gnd);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        .high-score {
            font-size: 14px;
            color: var(--c-accent);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .hud-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        /* Speed Indicator - Distinct Container */
        .speed-container {
            background-color: var(--c-obs);
            color: var(--c-gnd);
            padding: 8px 16px;
            border: 2px solid var(--c-gnd);
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 1px;
            box-shadow: 4px 4px 0px rgba(255,255,255,0.1);
        }

        /* Instructions - Relocated to Float near Hero */
        .instruction-overlay {
            position: absolute;
            top: 35%; /* Floats in the air */
            left: 16%; /* Right next to Dinosaur */
            text-align: left;
            z-index: 20;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .key-text {
            background: var(--c-obs);
            color: var(--c-gnd);
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 2px;
            border-left: 4px solid var(--c-accent);
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        .instruction-line {
            position: absolute;
            top: 50%;
            left: -10px;
            width: 10px;
            height: 2px;
            background: var(--c-gnd);
        }

        /* Game Over Panel */
        .game-over-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            z-index: 30;
            background: rgba(26, 26, 46, 0.95);
            padding: 40px 60px;
            border: 4px solid var(--c-gnd);
            box-shadow: 10px 10px 0px rgba(0,0,0,0.5);
        }

        .game-over-title {
            color: var(--c-accent);
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0px #fff;
        }

        .restart-hint {
            color: var(--c-gnd);
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .glitch-active {
            animation: glitch-anim 0.15s infinite;
        }

        @keyframes glitch-anim {
            0% { transform: translate(0) }
            25% { transform: translate(-3px, 3px) }
            50% { transform: translate(-3px, -3px) }
            75% { transform: translate(3px, 3px) }
            100% { transform: translate(0) }
        }

    </style>
</head>
<body>

    <div id="game-container">
        <div class="noise-overlay"></div>
        
        <!-- HUD -->
        <div class="hud-layer">
            <div class="hud-left">
                <div class="score-label">SCORE</div>
                <div class="score-value" id="score">00000</div>
                <div class="high-score">HI: <span id="high-score">00000</span></div>
            </div>
            <div class="hud-right">
                <div class="speed-container">
                    SPD: <span id="speed-val">00</span>
                </div>
            </div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Instructions (Relocated) -->
        <div class="instruction-overlay" id="instructions">
            <div class="instruction-line"></div>
            <div class="key-text">SPACE TO JUMP</div>
        </div>

        <!-- Game Over -->
        <div class="game-over-panel" id="game-over">
            <div class="game-over-title">CRASHED</div>
            <div class="restart-hint">PRESS SPACE TO REBOOT</div>
        </div>
    </div>

<script>
    /**
     * CONFIGURATION & PALETTE
     * Applying 3-Tone Value Hierarchy
     */
    const PALETTE = {
        sky: '#1a1a2e',          // Deep Midnight Blue
        mid: '#2d2d44',          // Distinct Mid-tone (Mountains)
        ground: '#e0e0e0',       // High Contrast Foreground
        hero: '#ffffff',         // Crisp White Silhouette
        obs: '#050508',          // Void Black Silhouette
        accent: '#ff3c00'        // UI Accent
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    // UI Elements
    const ui = {
        score: document.getElementById('score'),
        highScore: document.getElementById('high-score'),
        speedVal: document.getElementById('speed-val'),
        gameOver: document.getElementById('game-over'),
        instructions: document.getElementById('instructions'),
        container: document.getElementById('game-container')
    };

    // Game State
    let state = {
        isPlaying: false,
        isGameOver: false,
        score: 0,
        highScore: 0,
        speed: 0,
        baseSpeed: 10,
        maxSpeed: 24,
        frame: 0,
        gravity: 0.65,
        groundHeight: 120 // Elevated ground plane
    };

    let entities = {
        player: null,
        obstacles: [],
        particles: [],
        bgLayers: []
    };

    let spawnTimer = 0;

    /**
     * CLASSES
     */

    class Player {
        constructor() {
            // Scale & Anchor: ~90px height
            this.w = 60; 
            this.h = 90;
            this.x = canvas.width * 0.15; 
            this.y = canvas.height - state.groundHeight - this.h;
            this.dy = 0;
            this.jumpForce = -16;
            this.isGrounded = true;
            this.runAnim = 0;
        }

        jump() {
            if (this.isGrounded) {
                this.dy = this.jumpForce;
                this.isGrounded = false;
                // Dust burst
                for(let i=0; i<8; i++) {
                    entities.particles.push(new Particle(this.x + 20, this.y + this.h, PALETTE.ground));
                }
            }
        }

        update() {
            this.dy += state.gravity;
            this.y += this.dy;

            // Collision with ground
            if (this.y + this.h > canvas.height - state.groundHeight) {
                this.y = canvas.height - state.groundHeight - this.h;
                this.dy = 0;
                this.isGrounded = true;
            }

            if (this.isGrounded) this.runAnim += state.speed * 0.15;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.fillStyle = PALETTE.hero;
            
            // DRAWING A LARGER, CRISPER SILHOUETTE
            // Head
            ctx.fillRect(20, 0, 30, 25);
            // Snout
            ctx.fillRect(45, 5, 20, 15);
            // Eye (Indentation logic omitted for solid silhouette readability)
            
            // Neck
            ctx.fillRect(30, 25, 15, 10);

            // Torso (Leaning forward)
            ctx.fillRect(25, 35, 25, 40);

            // Arms
            ctx.fillRect(45, 45, 15, 8);
            ctx.fillRect(55, 50, 8, 8);

            // Tail (Long and sweeping)
            ctx.fillRect(0, 40, 25, 12);
            ctx.fillRect(-15, 30, 15, 12);
            ctx.fillRect(-25, 25, 10, 10);

            // Legs (Thicker, clearer animation)
            ctx.lineWidth = 10;
            ctx.lineCap = 'square';
            ctx.strokeStyle = PALETTE.hero;

            if (!this.isGrounded) {
                // Jumping: Tuck legs
                ctx.beginPath();
                ctx.moveTo(30, 75); ctx.lineTo(20, 85); ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(45, 75); ctx.lineTo(55, 85); ctx.stroke();
            } else {
                // Running: Fast cycle
                const offset = Math.sin(this.runAnim) * 15;
                
                ctx.beginPath();
                ctx.moveTo(30, 75);
                ctx.lineTo(30 + offset, 90);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(45, 75);
                ctx.lineTo(45 - offset, 90);
                ctx.stroke();
            }

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type;
            this.markedForDeletion = false;
            this.x = canvas.width + 50;
            
            if (type === 'cactus') {
                // Cactus Cluster
                this.w = 50 + Math.random() * 30;
                this.h = 60 + Math.random() * 30;
                this.y = canvas.height - state.groundHeight - this.h;
            } else {
                // Pterodactyl
                this.w = 60;
                this.h = 40;
                // Distinct heights: Low (jumpable), Mid, High
                const levels = [160, 100, 50]; 
                const dist = levels[Math.floor(Math.random() * levels.length)];
                this.y = canvas.height - state.groundHeight - dist;
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= state.speed;
            if (this.x + this.w < -100) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.25;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.fillStyle = PALETTE.obs;

            if (this.type === 'cactus') {
                // Geometric Cactus Silhouette
                ctx.beginPath();
                // Main trunk
                ctx.rect(this.w/3, 0, this.w/2.5, this.h);
                // Left Arm
                ctx.rect(0, this.h * 0.4, this.w/3, 12);
                ctx.rect(0, this.h * 0.2, 12, this.h * 0.3);
                // Right Arm
                ctx.rect(this.w * 0.6, this.h * 0.5, this.w/3, 12);
                ctx.rect(this.w * 0.8, this.h * 0.3, 12, this.h * 0.3);
                ctx.fill();
            } else {
                // Pterodactyl Silhouette
                ctx.fillStyle = PALETTE.obs;
                
                // Body
                ctx.beginPath();
                ctx.moveTo(this.w/2, this.h/2 + 10);
                ctx.lineTo(this.w/2 - 20, this.h/2);
                ctx.lineTo(this.w/2, this.h/2 - 10);
                ctx.fill();

                // Head/Beak
                ctx.beginPath();
                ctx.moveTo(this.w/2 + 15, this.h/2);
                ctx.lineTo(this.w + 10, this.h/2 + 8);
                ctx.lineTo(this.w/2 + 15, this.h/2 + 8);
                ctx.fill();

                // Wings (Animated)
                const wingY = Math.sin(this.wingFrame) * 20;
                ctx.beginPath();
                ctx.moveTo(this.w/2 - 5, this.h/2);
                ctx.lineTo(this.w/2 - 25, this.h/2 - 20 - wingY);
                ctx.lineTo(this.w/2 + 20, this.h/2);
                ctx.fill();
            }
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 4 + 2;
            this.vx = (Math.random() - 0.5) * 4 - state.speed;
            this.vy = (Math.random() - 1) * 3;
            this.color = color;
            this.alpha = 1;
            this.decay = 0.04;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= this.decay;
        }
        draw() {
            ctx.globalAlpha = Math.max(0, this.alpha);
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1;
        }
    }

    class BackgroundLayer {
        constructor(speedMod, yOffsetBase, jaggedness, color) {
            this.speedMod = speedMod;
            this.yOffsetBase = yOffsetBase; 
            this.jaggedness = jaggedness;
            this.color = color;
            this.x = 0;
            this.width = 150; // Wider segments for smoother mountains
            this.points = [];
            
            const count = Math.ceil(canvas.width / this.width) + 4;
            for(let i=0; i<count; i++) {
                this.points.push(Math.random() * this.jaggedness);
            }
        }

        update() {
            this.x -= state.speed * this.speedMod;
            if (this.x <= -this.width) {
                this.x += this.width;
                this.points.shift();
                this.points.push(Math.random() * this.jaggedness);
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            let startX = this.x % this.width;
            
            // Draw jagged line
            for (let i = 0; i < this.points.length; i++) {
                let px = startX + (i * this.width);
                let py = (canvas.height - state.groundHeight) - this.yOffsetBase - this.points[i];
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();
        }
    }

    /**
     * ENGINE
     */

    function init() {
        resize();
        entities.player = new Player();
        
        // Parallax Layers (Mid-tone Mountains)
        entities.bgLayers = [
            new BackgroundLayer(0.2, 300, 100, PALETTE.mid), // Far
            new BackgroundLayer(0.4, 180, 60, PALETTE.mid)   // Near
        ];
        
        loop();
    }

    function spawnObstacle() {
        spawnTimer--;
        if (spawnTimer <= 0) {
            // Inject Gameplay Elements
            const type = Math.random() > 0.6 ? 'bird' : 'cactus';
            entities.obstacles.push(new Obstacle(type));
            
            // Rhythmic spacing based on speed
            const minFrames = 45;
            const maxFrames = 110;
            const speedFactor = state.speed * 3; 
            
            spawnTimer = Math.max(minFrames, (maxFrames + Math.random() * 50) - speedFactor);
        }
    }

    function checkCollisions() {
        const p = entities.player;
        // Forgiving hitbox (inner rect)
        const hitX = p.x + 15;
        const hitY = p.y + 10;
        const hitW = p.w - 30;
        const hitH = p.h - 20;

        for (let obs of entities.obstacles) {
            const obsHitX = obs.x + 8;
            const obsHitY = obs.y + 8;
            const obsHitW = obs.w - 16;
            const obsHitH = obs.h - 16;

            if (
                hitX < obsHitX + obsHitW &&
                hitX + hitW > obsHitX &&
                hitY < obsHitY + obsHitH &&
                hitY + hitH > obsHitY
            ) {
                gameOver();
            }
        }
    }

    function gameOver() {
        state.isGameOver = true;
        state.isPlaying = false;
        ui.container.classList.add('glitch-active');
        ui.gameOver.style.display = 'block';
        ui.instructions.style.opacity = '0';
        
        if (state.score > state.highScore) {
            state.highScore = Math.floor(state.score);
            ui.highScore.innerText = state.highScore.toString().padStart(5, '0');
        }
    }

    function resetGame() {
        state.isGameOver = false;
        state.score = 0;
        state.speed = state.baseSpeed;
        spawnTimer = 0;
        
        entities.player = new Player();
        entities.obstacles = [];
        entities.particles = [];
        
        ui.container.classList.remove('glitch-active');
        ui.gameOver.style.display = 'none';
        ui.instructions.style.opacity = '1';
        state.isPlaying = true;
    }

    function update() {
        if (!state.isPlaying) return;

        state.frame++;
        state.score += state.speed * 0.01;
        
        // Speed ramp up
        if (state.frame % 120 === 0 && state.speed < state.maxSpeed) {
            state.speed += 0.3;
        }

        ui.score.innerText = Math.floor(state.score).toString().padStart(5, '0');
        // Calculate speed display value
        const displaySpeed = Math.floor(120 + (state.speed - state.baseSpeed) * 12);
        ui.speedVal.innerText = displaySpeed;

        entities.player.update();
        entities.bgLayers.forEach(l => l.update());
        
        spawnObstacle();
        entities.obstacles.forEach((o, i) => {
            o.update();
            if (o.markedForDeletion) entities.obstacles.splice(i, 1);
        });

        entities.particles.forEach((p, i) => {
            p.update();
            if (p.alpha <= 0) entities.particles.splice(i, 1);
        });

        checkCollisions();
    }

    function draw() {
        // 1. Sky (Deep Midnight Blue - Solid)
        ctx.fillStyle = PALETTE.sky;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. Mountains (Mid-tone)
        entities.bgLayers.forEach(l => l.draw());

        // 3. Ground (High Contrast Foreground)
        ctx.fillStyle = PALETTE.ground;
        ctx.fillRect(0, canvas.height - state.groundHeight, canvas.width, state.groundHeight);
        
        // Top Edge (Horizon line definition)
        ctx.fillStyle = '#ffffff'; // Pure white top edge for max separation
        ctx.fillRect(0, canvas.height - state.groundHeight, canvas.width, 4);

        // 4. Entities
        entities.player.draw();
        entities.obstacles.forEach(o => o.draw());
        entities.particles.forEach(p => p.draw());
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    function resize() {
        canvas.width = ui.container.offsetWidth;
        canvas.height = ui.container.offsetHeight;
        if (entities.player) {
            entities.player.x = canvas.width * 0.15;
            // Keep player on ground if resized while idle
            if(!state.isPlaying) entities.player.y = canvas.height - state.groundHeight - entities.player.h;
        }
    }

    // Inputs
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            if (state.isGameOver) {
                resetGame();
            } else if (!state.isPlaying) {
                state.isPlaying = true;
                ui.instructions.style.opacity = '0';
            } else {
                entities.player.jump();
            }
        }
    });

    window.addEventListener('resize', resize);
    
    window.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (state.isGameOver) {
            resetGame();
        } else if (!state.isPlaying) {
            state.isPlaying = true;
            ui.instructions.style.opacity = '0';
        } else {
            entities.player.jump();
        }
    }, {passive: false});

    // Boot
    init();

</script>
</body>
</html>
