<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-RUNNER // RETRO</title>
    <style>
        :root {
            --bg-deep: #1a1a2e;
            --bg-horizon: #252540;
            --accent-cyan: #00f0ff;
            --accent-pink: #ff2a6d;
            --text-primary: #ffffff;
            --text-secondary: #8888aa;
            --ground-color: #16213e;
            --font-stack: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body {
            background-color: #050505;
            color: var(--text-primary);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main Game Container */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1400px;
            max-height: 800px;
            background-color: var(--bg-deep);
            overflow: hidden;
            box-shadow: 0 0 100px rgba(0, 240, 255, 0.05);
        }

        /* CRT Overlay Effect */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.15) 50%,
                rgba(0,0,0,0.15)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
            opacity: 0.6;
        }

        /* Canvas Layer */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* HUD Layer */
        .hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
            pointer-events: none;
        }

        .hud-left {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .score-label {
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 2px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .score-value {
            font-size: 40px;
            font-weight: bold;
            line-height: 1;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
            font-variant-numeric: tabular-nums;
        }

        .high-score {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
            opacity: 0.7;
        }

        .hud-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .speed-display {
            font-size: 14px;
            color: var(--accent-cyan);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .speed-bar-container {
            width: 120px;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 5px;
        }

        .speed-bar-fill {
            height: 100%;
            background: var(--accent-cyan);
            width: 20%;
            transition: width 0.1s linear;
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        /* Instructions Overlay */
        .instruction-overlay {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .key-hint {
            display: inline-block;
            padding: 8px 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(2px);
            animation: pulse 2s infinite ease-in-out;
        }

        .key-text {
            color: var(--text-primary);
            font-size: 14px;
            letter-spacing: 3px;
            font-weight: bold;
            text-transform: uppercase;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); border-color: var(--accent-cyan); }
        }

        /* Game Over Panel */
        .game-over-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            z-index: 20;
        }

        .game-over-title {
            color: var(--accent-pink);
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }

        .restart-hint {
            color: var(--text-primary);
            font-size: 16px;
            letter-spacing: 2px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .glitch-active {
            animation: glitch-anim 0.2s infinite;
        }

        @keyframes glitch-anim {
            0% { transform: translate(0) }
            20% { transform: translate(-3px, 2px) skewX(2deg) }
            40% { transform: translate(-3px, -2px) skewX(-2deg) }
            60% { transform: translate(3px, 2px) skewX(1deg) }
            80% { transform: translate(3px, -2px) skewX(-1deg) }
            100% { transform: translate(0) }
        }

    </style>
</head>
<body>

    <div id="game-container">
        <div class="scanlines"></div>
        
        <!-- HUD -->
        <div class="hud-layer">
            <div class="hud-left">
                <div class="score-label">Score</div>
                <div class="score-value" id="score">00000</div>
                <div class="high-score">HI: <span id="high-score">00000</span></div>
            </div>
            <div class="hud-right">
                <div class="speed-display" id="speed-val">1.0x</div>
                <div class="speed-bar-container">
                    <div class="speed-bar-fill" id="speed-fill"></div>
                </div>
            </div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Instructions -->
        <div class="instruction-overlay" id="instructions">
            <div class="key-hint">
                <div class="key-text">SPACE</div>
            </div>
        </div>

        <!-- Game Over -->
        <div class="game-over-panel" id="game-over">
            <div class="game-over-title">CRASHED</div>
            <div class="restart-hint">PRESS SPACE TO REBOOT</div>
        </div>
    </div>

<script>
    /**
     * CONFIGURATION & PALETTE
     */
    const PALETTE = {
        bg: '#1a1a2e',
        horizon: '#252540',
        mountains: '#16213e',
        ground: '#0f1629',
        groundLine: '#00f0ff',
        player: '#ffffff',
        playerShadow: '#00f0ff',
        obstacle: '#ff2a6d',
        obstacleShadow: '#ff2a6d',
        bird: '#ffffff'
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const ui = {
        score: document.getElementById('score'),
        highScore: document.getElementById('high-score'),
        speedVal: document.getElementById('speed-val'),
        speedFill: document.getElementById('speed-fill'),
        gameOver: document.getElementById('game-over'),
        instructions: document.getElementById('instructions'),
        container: document.getElementById('game-container')
    };

    // Game State
    let state = {
        isPlaying: false,
        isGameOver: false,
        score: 0,
        highScore: 0,
        speed: 8,
        frame: 0,
        gravity: 0.65,
        groundHeight: 100 // Pixels from bottom
    };

    let entities = {
        player: null,
        obstacles: [],
        particles: [],
        bgLayers: []
    };

    let spawnTimer = 0;
    let spawnInterval = 90;

    /**
     * CLASSES
     */

    class Player {
        constructor() {
            this.w = 50;
            this.h = 55;
            this.x = canvas.width * 0.15; // 15% from left
            this.y = canvas.height - state.groundHeight - this.h;
            this.dy = 0;
            this.jumpForce = -14;
            this.isGrounded = true;
            this.runAnim = 0;
        }

        jump() {
            if (this.isGrounded) {
                this.dy = this.jumpForce;
                this.isGrounded = false;
                createParticles(this.x + this.w/2, this.y + this.h, 10, PALETTE.groundLine);
            }
        }

        update() {
            // Physics
            this.dy += state.gravity;
            this.y += this.dy;

            // Ground Collision
            if (this.y + this.h > canvas.height - state.groundHeight) {
                this.y = canvas.height - state.groundHeight - this.h;
                this.dy = 0;
                this.isGrounded = true;
            }

            // Animation
            if (this.isGrounded) this.runAnim += 0.25;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            // Shadow/Glow
            ctx.shadowColor = PALETTE.playerShadow;
            ctx.shadowBlur = 15;
            ctx.fillStyle = PALETTE.player;

            // Silhouette Construction (Solid Blocky)
            
            // Head & Neck
            ctx.beginPath();
            ctx.rect(10, 0, 35, 20); 
            ctx.rect(20, 10, 15, 15);
            ctx.fill();

            // Body
            ctx.beginPath();
            ctx.rect(5, 25, 30, 20);
            ctx.fill();

            // Tail
            ctx.beginPath();
            ctx.moveTo(5, 30);
            ctx.lineTo(-10, 25);
            ctx.lineTo(5, 40);
            ctx.fill();

            // Legs (Running Cycle)
            ctx.lineWidth = 6;
            ctx.lineCap = 'square';
            ctx.strokeStyle = PALETTE.player;
            
            if (!this.isGrounded) {
                // Jumping pose (legs tucked)
                ctx.beginPath();
                ctx.moveTo(10, 45);
                ctx.lineTo(5, 55);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(25, 45);
                ctx.lineTo(30, 50);
                ctx.stroke();
            } else {
                // Running pose
                const legOffset = Math.sin(this.runAnim) * 10;
                
                ctx.beginPath();
                ctx.moveTo(12, 45);
                ctx.lineTo(12 - legOffset, 55);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(22, 45);
                ctx.lineTo(22 + legOffset, 55);
                ctx.stroke();
            }

            // Eye (Negative Space)
            ctx.fillStyle = PALETTE.bg;
            ctx.shadowBlur = 0;
            ctx.fillRect(32, 5, 4, 4);

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type;
            this.markedForDeletion = false;
            this.x = canvas.width + 100;
            
            if (type === 'cactus') {
                this.w = 30 + Math.random() * 20;
                this.h = 40 + Math.random() * 25;
                this.y = canvas.height - state.groundHeight - this.h;
            } else {
                // Bird
                this.w = 45;
                this.h = 30;
                // Heights: Low (jumpable), Mid (duck/jump), High (visual)
                const heights = [20, 60, 100]; 
                const distFromGround = heights[Math.floor(Math.random() * heights.length)];
                this.y = canvas.height - state.groundHeight - distFromGround;
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= state.speed;
            if (this.x + this.w < -100) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.15;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            ctx.shadowColor = PALETTE.obstacleShadow;
            ctx.shadowBlur = 10;
            ctx.fillStyle = PALETTE.obstacle;

            if (this.type === 'cactus') {
                // Geometric Cactus
                // Main trunk
                ctx.beginPath();
                ctx.roundRect(this.w/3, 0, this.w/1.5, this.h, 4);
                ctx.fill();
                
                // Arms
                ctx.beginPath();
                ctx.roundRect(0, this.h * 0.4, this.w/3, 8, 2);
                ctx.roundRect(0, this.h * 0.2, 6, this.h * 0.3, 2);
                ctx.fill();
            } else {
                // Pterodactyl
                ctx.fillStyle = PALETTE.bird;
                ctx.shadowColor = PALETTE.bird;
                
                // Body
                ctx.beginPath();
                ctx.ellipse(this.w/2, this.h/2, 15, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Head/Beak
                ctx.beginPath();
                ctx.moveTo(this.w/2 + 15, this.h/2);
                ctx.lineTo(this.w, this.h/2 + 5);
                ctx.lineTo(this.w/2 + 15, this.h/2 + 10);
                ctx.fill();

                // Wings
                const wingY = Math.sin(this.wingFrame) * 15;
                ctx.beginPath();
                ctx.moveTo(this.w/2 - 5, this.h/2);
                ctx.lineTo(this.w/2 - 20, this.h/2 - 10 - wingY);
                ctx.lineTo(this.w/2 + 10, this.h/2);
                ctx.fill();
            }
            
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 3 + 1;
            this.vx = (Math.random() - 0.5) * 4;
            this.vy = (Math.random() - 0.5) * 4;
            this.color = color;
            this.alpha = 1;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= 0.03;
        }
        draw() {
            ctx.globalAlpha = Math.max(0, this.alpha);
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1;
        }
    }

    class BackgroundLayer {
        constructor(speedMod, color, yOffset, jaggedness) {
            this.speedMod = speedMod;
            this.color = color;
            this.yOffset = yOffset;
            this.jaggedness = jaggedness;
            this.x = 0;
            this.width = 100;
            this.points = [];
            // Generate points
            for(let i=0; i < (canvas.width / this.width) + 4; i++) {
                this.points.push(Math.random() * this.jaggedness);
            }
        }

        update() {
            this.x -= state.speed * this.speedMod;
            if (this.x <= -this.width) {
                this.x += this.width;
                this.points.shift();
                this.points.push(Math.random() * this.jaggedness);
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            let startX = this.x % this.width;
            
            // Draw jagged shape
            for (let i = 0; i < this.points.length; i++) {
                let px = startX + (i * this.width);
                let py = canvas.height - state.groundHeight - this.yOffset - this.points[i];
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();
        }
    }

    /**
     * GAME ENGINE
     */

    function init() {
        resize();
        entities.player = new Player();
        
        // Parallax Layers
        entities.bgLayers = [
            new BackgroundLayer(0.1, PALETTE.mountains, 150, 80), // Far
            new BackgroundLayer(0.3, PALETTE.horizon, 80, 40)     // Mid
        ];
        
        loop();
    }

    function createParticles(x, y, count, color) {
        for (let i = 0; i < count; i++) {
            entities.particles.push(new Particle(x, y, color));
        }
    }

    function spawnObstacle() {
        spawnTimer--;
        if (spawnTimer <= 0) {
            // Logic: More birds as speed increases, but keep cactus common
            const type = Math.random() > 0.7 ? 'bird' : 'cactus';
            entities.obstacles.push(new Obstacle(type));
            
            // Randomize next spawn time based on speed
            const minGap = 60 - (state.speed * 2); 
            spawnTimer = Math.max(40, minGap) + Math.random() * 60;
        }
    }

    function checkCollisions() {
        // AABB Collision with padding
        const p = entities.player;
        // Hitbox adjustments for forgiveness
        const hitX = p.x + 10;
        const hitY = p.y + 5;
        const hitW = p.w - 20;
        const hitH = p.h - 10;

        for (let obs of entities.obstacles) {
            const obsHitX = obs.x + 5;
            const obsHitY = obs.y + 5;
            const obsHitW = obs.w - 10;
            const obsHitH = obs.h - 10;

            if (
                hitX < obsHitX + obsHitW &&
                hitX + hitW > obsHitX &&
                hitY < obsHitY + obsHitH &&
                hitY + hitH > obsHitY
            ) {
                gameOver();
            }
        }
    }

    function gameOver() {
        state.isGameOver = true;
        state.isPlaying = false;
        ui.container.classList.add('glitch-active');
        ui.gameOver.style.display = 'block';
        ui.instructions.style.opacity = '0';
        
        if (state.score > state.highScore) {
            state.highScore = Math.floor(state.score);
            ui.highScore.innerText = state.highScore.toString().padStart(5, '0');
        }
    }

    function resetGame() {
        state.isGameOver = false;
        state.score = 0;
        state.speed = 8;
        spawnTimer = 0;
        
        entities.player = new Player();
        entities.obstacles = [];
        entities.particles = [];
        
        ui.container.classList.remove('glitch-active');
        ui.gameOver.style.display = 'none';
        ui.instructions.style.opacity = '1';
        state.isPlaying = true;
    }

    function update() {
        if (!state.isPlaying) return;

        state.frame++;
        state.score += state.speed * 0.01;
        
        // Speed Progression
        if (state.frame % 600 === 0) state.speed += 0.5;

        // UI Updates
        ui.score.innerText = Math.floor(state.score).toString().padStart(5, '0');
        ui.speedVal.innerText = (state.speed / 8).toFixed(1) + 'x';
        ui.speedFill.style.width = Math.min((state.speed / 20) * 100, 100) + '%';

        // Entities
        entities.player.update();
        entities.bgLayers.forEach(l => l.update());
        
        spawnObstacle();
        entities.obstacles.forEach((o, i) => {
            o.update();
            if (o.markedForDeletion) entities.obstacles.splice(i, 1);
        });

        entities.particles.forEach((p, i) => {
            p.update();
            if (p.alpha <= 0) entities.particles.splice(i, 1);
        });

        checkCollisions();
    }

    function draw() {
        // Clear
        ctx.fillStyle = PALETTE.bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Backgrounds
        entities.bgLayers.forEach(l => l.draw());

        // Ground
        ctx.fillStyle = PALETTE.ground;
        ctx.fillRect(0, canvas.height - state.groundHeight, canvas.width, state.groundHeight);
        
        // Ground Line (Neon)
        ctx.strokeStyle = PALETTE.groundLine;
        ctx.lineWidth = 3;
        ctx.shadowColor = PALETTE.groundLine;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height - state.groundHeight);
        ctx.lineTo(canvas.width, canvas.height - state.groundHeight);
        ctx.stroke();
        ctx.shadowBlur = 0; // Reset

        // Entities
        entities.player.draw();
        entities.obstacles.forEach(o => o.draw());
        entities.particles.forEach(p => p.draw());
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    function resize() {
        canvas.width = ui.container.offsetWidth;
        canvas.height = ui.container.offsetHeight;
        if (entities.player) entities.player.x = canvas.width * 0.15;
    }

    // Inputs
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            if (state.isGameOver) {
                resetGame();
            } else if (!state.isPlaying) {
                state.isPlaying = true;
                ui.instructions.style.opacity = '0';
            } else {
                entities.player.jump();
            }
        }
    });

    window.addEventListener('resize', resize);
    
    // Touch
    window.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (state.isGameOver) {
            resetGame();
        } else if (!state.isPlaying) {
            state.isPlaying = true;
            ui.instructions.style.opacity = '0';
        } else {
            entities.player.jump();
        }
    }, {passive: false});

    // Boot
    init();

</script>
</body>
</html>
