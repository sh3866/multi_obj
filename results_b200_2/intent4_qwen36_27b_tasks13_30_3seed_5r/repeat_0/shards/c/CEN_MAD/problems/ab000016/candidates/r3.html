<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEO-RUNNER // VOID</title>
    <style>
        :root {
            --font-main: 'Courier New', Courier, monospace;
            --c-void: #050508;
            --c-surface: #2a2a35;
            --c-highlight: #e0e0e0;
            --c-accent: #ff3c00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body {
            background-color: #000;
            color: var(--c-highlight);
            font-family: var(--font-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Game Container */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: var(--c-void);
            overflow: hidden;
            cursor: default;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        /* Noise Texture Overlay */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            opacity: 0.08;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* HUD Layer */
        .hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 20;
            pointer-events: none;
        }

        .hud-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .score-label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
        }

        .score-value {
            font-size: 28px;
            line-height: 1;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .high-score {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 2px;
        }

        .hud-right {
            text-align: right;
        }

        .speed-display {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: -1px;
            color: #fff;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.4);
        }
        
        .speed-unit {
            font-size: 10px;
            color: rgba(255,255,255,0.6);
            margin-left: 2px;
        }

        /* Instructions Overlay */
        .instruction-overlay {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 20;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .key-hint {
            display: inline-block;
            /* Removed pill box background per critique */
        }

        .key-text {
            color: #fff;
            font-size: 16px;
            letter-spacing: 3px;
            font-weight: bold;
            /* Clean white text with subtle drop shadow */
            text-shadow: 
                1px 1px 0 #000, 
               -1px -1px 0 #000,
                1px -1px 0 #000,
               -1px 1px 0 #000,
                2px 2px 4px rgba(0,0,0,0.8);
        }

        /* Game Over Panel */
        .game-over-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            z-index: 30;
            background: rgba(0,0,0,0.6);
            padding: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .game-over-title {
            color: #fff;
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
            text-shadow: 4px 4px 0px var(--c-accent);
        }

        .restart-hint {
            color: #fff;
            font-size: 14px;
            letter-spacing: 2px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .glitch-active {
            animation: glitch-anim 0.2s infinite;
        }

        @keyframes glitch-anim {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }

    </style>
</head>
<body>

    <div id="game-container">
        <div class="noise-overlay"></div>
        
        <!-- HUD -->
        <div class="hud-layer">
            <div class="hud-left">
                <div class="score-label">SCORE</div>
                <div class="score-value" id="score">00000</div>
                <div class="high-score">HI: <span id="high-score">00000</span></div>
            </div>
            <div class="hud-right">
                <div class="speed-display"><span id="speed-val">120</span><span class="speed-unit">KM/H</span></div>
            </div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Instructions -->
        <div class="instruction-overlay" id="instructions">
            <div class="key-hint">
                <div class="key-text">PRESS SPACE TO JUMP</div>
            </div>
        </div>

        <!-- Game Over -->
        <div class="game-over-panel" id="game-over">
            <div class="game-over-title">CRASHED</div>
            <div class="restart-hint">PRESS SPACE TO REBOOT</div>
        </div>
    </div>

<script>
    /**
     * CONFIGURATION & PALETTE
     */
    const PALETTE = {
        bgTop: '#050508',      // Deep Void Blue
        bgBottom: '#15151e',   // Slightly lighter void
        mountainsFar: '#0a0a0f', // Very dark silhouette
        mountainsNear: '#1a1a24', // Darker silhouette
        ground: '#2a2a35',     // Textured surface
        groundTop: '#3d3d4a',  // Top edge
        player: '#ffffff',     // Crisp white silhouette
        obstacle: '#050508',   // Void silhouette (negative space feel)
        bird: '#050508'
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    // UI Elements
    const ui = {
        score: document.getElementById('score'),
        highScore: document.getElementById('high-score'),
        speedVal: document.getElementById('speed-val'),
        gameOver: document.getElementById('game-over'),
        instructions: document.getElementById('instructions'),
        container: document.getElementById('game-container')
    };

    // Game State
    let state = {
        isPlaying: false,
        isGameOver: false,
        score: 0,
        highScore: 0,
        speed: 0,
        baseSpeed: 9,
        maxSpeed: 22,
        frame: 0,
        gravity: 0.6,
        groundHeight: 100 
    };

    let entities = {
        player: null,
        obstacles: [],
        particles: [],
        bgLayers: []
    };

    let spawnTimer = 0;

    /**
     * CLASSES
     */

    class Player {
        constructor() {
            this.w = 44; 
            this.h = 44;
            this.x = canvas.width * 0.15; // Left third
            this.y = canvas.height - state.groundHeight - this.h;
            this.dy = 0;
            this.jumpForce = -14;
            this.isGrounded = true;
            this.runAnim = 0;
        }

        jump() {
            if (this.isGrounded) {
                this.dy = this.jumpForce;
                this.isGrounded = false;
                // Dust
                for(let i=0; i<5; i++) {
                    entities.particles.push(new Particle(this.x + 10, this.y + this.h, PALETTE.groundTop));
                }
            }
        }

        update() {
            this.dy += state.gravity;
            this.y += this.dy;

            if (this.y + this.h > canvas.height - state.groundHeight) {
                this.y = canvas.height - state.groundHeight - this.h;
                this.dy = 0;
                this.isGrounded = true;
            }

            if (this.isGrounded) this.runAnim += state.speed * 0.15;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.fillStyle = PALETTE.player;
            
            // Drawing a crisp, geometric Raptor silhouette
            
            // Head
            ctx.fillRect(18, 0, 18, 12);
            // Snout
            ctx.fillRect(32, 4, 12, 8);
            // Eye (cutout effect by drawing background color? No, keep it solid for contrast, but maybe indent?)
            // Let's keep it solid white for max readability.

            // Neck
            ctx.fillRect(22, 12, 8, 6);

            // Torso
            ctx.fillRect(12, 18, 18, 18);

            // Arms
            ctx.fillRect(28, 22, 6, 4);
            ctx.fillRect(32, 26, 4, 4);

            // Tail
            ctx.fillRect(0, 20, 14, 6);
            ctx.fillRect(-6, 16, 10, 6);

            // Legs (Animated)
            ctx.lineWidth = 6;
            ctx.lineCap = 'square';
            ctx.strokeStyle = PALETTE.player;

            if (!this.isGrounded) {
                // Jumping: Tuck legs
                ctx.beginPath();
                ctx.moveTo(16, 36); ctx.lineTo(10, 42); ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(26, 36); ctx.lineTo(32, 42); ctx.stroke();
            } else {
                // Running: Fast cycle
                const offset = Math.sin(this.runAnim) * 10;
                
                ctx.beginPath();
                ctx.moveTo(16, 36);
                ctx.lineTo(16 + offset, 44);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(26, 36);
                ctx.lineTo(26 - offset, 44);
                ctx.stroke();
            }

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type;
            this.markedForDeletion = false;
            this.x = canvas.width + 50;
            
            if (type === 'cactus') {
                // Cluster of cacti
                this.w = 30 + Math.random() * 20;
                this.h = 40 + Math.random() * 25;
                this.y = canvas.height - state.groundHeight - this.h;
            } else {
                // Pterodactyl
                this.w = 40;
                this.h = 30;
                // Verticality: High, Mid, Low
                const levels = [140, 80, 30]; 
                const dist = levels[Math.floor(Math.random() * levels.length)];
                this.y = canvas.height - state.groundHeight - dist;
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= state.speed;
            if (this.x + this.w < -50) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.2;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.fillStyle = PALETTE.obstacle;

            if (this.type === 'cactus') {
                // Geometric Cactus Silhouette
                ctx.beginPath();
                // Main trunk
                ctx.rect(this.w/3, 0, this.w/2, this.h);
                // Arms
                ctx.rect(0, this.h * 0.3, this.w/3, 8);
                ctx.rect(0, this.h * 0.1, 8, this.h * 0.3);
                
                ctx.rect(this.w * 0.6, this.h * 0.4, this.w/3, 8);
                ctx.rect(this.w * 0.8, this.h * 0.2, 8, this.h * 0.4);
                ctx.fill();
            } else {
                // Pterodactyl Silhouette
                ctx.fillStyle = PALETTE.bird;
                
                // Body
                ctx.beginPath();
                ctx.moveTo(this.w/2, this.h/2 + 5);
                ctx.lineTo(this.w/2 - 15, this.h/2);
                ctx.lineTo(this.w/2, this.h/2 - 5);
                ctx.fill();

                // Head
                ctx.beginPath();
                ctx.moveTo(this.w/2 + 10, this.h/2);
                ctx.lineTo(this.w + 5, this.h/2 + 5);
                ctx.lineTo(this.w/2 + 10, this.h/2 + 5);
                ctx.fill();

                // Wings
                const wingY = Math.sin(this.wingFrame) * 15;
                ctx.beginPath();
                ctx.moveTo(this.w/2 - 5, this.h/2);
                ctx.lineTo(this.w/2 - 20, this.h/2 - 15 - wingY);
                ctx.lineTo(this.w/2 + 15, this.h/2);
                ctx.fill();
            }
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 3 + 1;
            this.vx = (Math.random() - 0.5) * 3 - state.speed;
            this.vy = (Math.random() - 1) * 2;
            this.color = color;
            this.alpha = 1;
            this.decay = 0.04;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= this.decay;
        }
        draw() {
            ctx.globalAlpha = Math.max(0, this.alpha);
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1;
        }
    }

    class BackgroundLayer {
        constructor(speedMod, yOffset, jaggedness, color, yOffsetBase) {
            this.speedMod = speedMod;
            this.yOffsetBase = yOffsetBase; // Distance from ground top
            this.jaggedness = jaggedness;
            this.color = color;
            this.x = 0;
            this.width = 100; 
            this.points = [];
            
            const count = Math.ceil(canvas.width / this.width) + 2;
            for(let i=0; i<count; i++) {
                this.points.push(Math.random() * this.jaggedness);
            }
        }

        update() {
            this.x -= state.speed * this.speedMod;
            if (this.x <= -this.width) {
                this.x += this.width;
                this.points.shift();
                this.points.push(Math.random() * this.jaggedness);
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            let startX = this.x % this.width;
            
            // Draw jagged line
            for (let i = 0; i < this.points.length; i++) {
                let px = startX + (i * this.width);
                let py = (canvas.height - state.groundHeight) - this.yOffsetBase - this.points[i];
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();
        }
    }

    /**
     * ENGINE
     */

    function init() {
        resize();
        entities.player = new Player();
        
        // Parallax Layers (Distinct silhouettes)
        entities.bgLayers = [
            new BackgroundLayer(0.1, 250, 80, PALETTE.mountainsFar, 250), // Far
            new BackgroundLayer(0.25, 150, 40, PALETTE.mountainsNear, 150) // Mid
        ];
        
        loop();
    }

    function spawnObstacle() {
        spawnTimer--;
        if (spawnTimer <= 0) {
            const type = Math.random() > 0.7 ? 'bird' : 'cactus';
            entities.obstacles.push(new Obstacle(type));
            
            // Rhythmic spacing based on speed
            const minFrames = 50;
            const maxFrames = 120;
            const speedFactor = state.speed * 3; 
            
            spawnTimer = Math.max(minFrames, (maxFrames + Math.random() * 50) - speedFactor);
        }
    }

    function checkCollisions() {
        const p = entities.player;
        // Forgiving hitbox
        const hitX = p.x + 10;
        const hitY = p.y + 8;
        const hitW = p.w - 20;
        const hitH = p.h - 12;

        for (let obs of entities.obstacles) {
            const obsHitX = obs.x + 5;
            const obsHitY = obs.y + 5;
            const obsHitW = obs.w - 10;
            const obsHitH = obs.h - 10;

            if (
                hitX < obsHitX + obsHitW &&
                hitX + hitW > obsHitX &&
                hitY < obsHitY + obsHitH &&
                hitY + hitH > obsHitY
            ) {
                gameOver();
            }
        }
    }

    function gameOver() {
        state.isGameOver = true;
        state.isPlaying = false;
        ui.container.classList.add('glitch-active');
        ui.gameOver.style.display = 'block';
        ui.instructions.style.opacity = '0';
        
        if (state.score > state.highScore) {
            state.highScore = Math.floor(state.score);
            ui.highScore.innerText = state.highScore.toString().padStart(5, '0');
        }
    }

    function resetGame() {
        state.isGameOver = false;
        state.score = 0;
        state.speed = state.baseSpeed;
        spawnTimer = 0;
        
        entities.player = new Player();
        entities.obstacles = [];
        entities.particles = [];
        
        ui.container.classList.remove('glitch-active');
        ui.gameOver.style.display = 'none';
        ui.instructions.style.opacity = '1';
        state.isPlaying = true;
    }

    function update() {
        if (!state.isPlaying) return;

        state.frame++;
        state.score += state.speed * 0.01;
        
        if (state.frame % 100 === 0 && state.speed < state.maxSpeed) {
            state.speed += 0.2;
        }

        ui.score.innerText = Math.floor(state.score).toString().padStart(5, '0');
        const displaySpeed = Math.floor(100 + (state.speed - state.baseSpeed) * 15);
        ui.speedVal.innerText = displaySpeed;

        entities.player.update();
        entities.bgLayers.forEach(l => l.update());
        
        spawnObstacle();
        entities.obstacles.forEach((o, i) => {
            o.update();
            if (o.markedForDeletion) entities.obstacles.splice(i, 1);
        });

        entities.particles.forEach((p, i) => {
            p.update();
            if (p.alpha <= 0) entities.particles.splice(i, 1);
        });

        checkCollisions();
    }

    function draw() {
        // 1. Sky
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, PALETTE.bgTop);
        gradient.addColorStop(1, PALETTE.bgBottom);
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. Mountains
        entities.bgLayers.forEach(l => l.draw());

        // 3. Ground
        // Base
        ctx.fillStyle = PALETTE.ground;
        ctx.fillRect(0, canvas.height - state.groundHeight, canvas.width, state.groundHeight);
        
        // Top Edge (Horizon line)
        ctx.fillStyle = PALETTE.groundTop;
        ctx.fillRect(0, canvas.height - state.groundHeight, canvas.width, 3);

        // 4. Entities
        entities.player.draw();
        entities.obstacles.forEach(o => o.draw());
        entities.particles.forEach(p => p.draw());
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    function resize() {
        canvas.width = ui.container.offsetWidth;
        canvas.height = ui.container.offsetHeight;
        if (entities.player) entities.player.x = canvas.width * 0.15;
    }

    // Inputs
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            if (state.isGameOver) {
                resetGame();
            } else if (!state.isPlaying) {
                state.isPlaying = true;
                ui.instructions.style.opacity = '0';
            } else {
                entities.player.jump();
            }
        }
    });

    window.addEventListener('resize', resize);
    
    window.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (state.isGameOver) {
            resetGame();
        } else if (!state.isPlaying) {
            state.isPlaying = true;
            ui.instructions.style.opacity = '0';
        } else {
            entities.player.jump();
        }
    }, {passive: false});

    // Boot
    init();

</script>
</body>
</html>
