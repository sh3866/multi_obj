<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOLARIS RUNNER // REV 3.0</title>
    <style>
        :root {
            /* Modern-Retro Desert Palette */
            --c-sky-top: #2b1b3d;      /* Deep Indigo */
            --c-sky-bot: #e88d67;      /* Sunset Orange */
            --c-sun: #ffdd88;          /* Pale Sun */
            --c-mtn-far: #4a3b52;      /* Distant Purple */
            --c-mtn-near: #635066;     /* Mid Purple */
            --c-gnd: #dcb386;          /* Dusty Beige */
            --c-gnd-dark: #c49a70;     /* Ground Detail */
            --c-sil: #1a1a1d;          /* Near Black for Silhouettes */
            --c-accent: #ff4500;       /* Safety Orange */
            
            /* Typography */
            --font-ui: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--c-sky-top);
            color: var(--c-sil);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Game Container */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, var(--c-sky-top), var(--c-sky-bot));
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated; 
        }

        /* CRT Scanline Effect */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
        }

        /* HUD - Unified Cluster */
        .hud-cluster {
            position: absolute;
            top: 25px;
            right: 30px;
            text-align: right;
            z-index: 20;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .hud-row {
            display: flex;
            justify-content: flex-end;
            align-items: baseline;
            gap: 15px;
        }

        .hud-label {
            font-size: 10px;
            font-weight: 900;
            color: rgba(26, 26, 29, 0.6);
            letter-spacing: 1px;
        }

        .hud-value {
            font-size: 24px;
            font-weight: 900;
            color: var(--c-sil);
            font-variant-numeric: tabular-nums;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.2);
        }

        .hud-highlight {
            color: var(--c-accent);
        }

        .speed-badge {
            font-size: 12px;
            font-weight: 900;
            color: var(--c-sil);
            background: rgba(220, 179, 134, 0.9); /* Ground color translucent */
            padding: 2px 6px;
            border-radius: 2px;
        }

        /* Footer Instruction */
        .footer-instruction {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 20;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .key-cap {
            display: inline-block;
            border: 2px solid var(--c-sil);
            color: var(--c-sil);
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 2px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(2px);
            margin-bottom: 4px;
        }

        .sub-text {
            display: block;
            font-size: 10px;
            color: var(--c-sil);
            opacity: 0.7;
            letter-spacing: 1px;
        }

        /* Game Over Panel */
        .game-over-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            z-index: 30;
            background: rgba(232, 141, 103, 0.95); /* Sunset Orange */
            padding: 30px 50px;
            border: 4px solid var(--c-sil);
            box-shadow: 8px 8px 0px rgba(0,0,0,0.3);
        }

        .game-over-title {
            color: var(--c-sil);
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .restart-hint {
            color: var(--c-sil);
            font-size: 14px;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

    </style>
</head>
<body>

    <div id="game-container">
        <div class="scanlines"></div>
        
        <!-- HUD Cluster -->
        <div class="hud-cluster">
            <div class="hud-row">
                <div>
                    <div class="hud-label">SCORE</div>
                    <div class="hud-value" id="score">00000</div>
                </div>
                <div>
                    <div class="hud-label">HI</div>
                    <div class="hud-value hud-highlight" id="high-score">00000</div>
                </div>
            </div>
            <div class="hud-row" style="justify-content: flex-end; margin-top: 5px;">
                <div class="speed-badge">SPD: <span id="speed-val">00</span></div>
            </div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Footer Instructions -->
        <div class="footer-instruction" id="instructions">
            <div class="key-cap">SPACE / TAP</div>
            <span class="sub-text">TO JUMP</span>
        </div>

        <!-- Game Over -->
        <div class="game-over-panel" id="game-over">
            <div class="game-over-title">WIPEOUT</div>
            <div class="restart-hint">PRESS TO RESTART</div>
        </div>
    </div>

<script>
    /**
     * CONFIGURATION
     */
    const PALETTE = {
        sun: '#ffdd88',
        mtnFar: '#4a3b52',
        mtnNear: '#635066',
        ground: '#dcb386',
        groundDark: '#c49a70',
        sil: '#1a1a1d',
        accent: '#ff4500'
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    const ui = {
        score: document.getElementById('score'),
        highScore: document.getElementById('high-score'),
        speedVal: document.getElementById('speed-val'),
        gameOver: document.getElementById('game-over'),
        instructions: document.getElementById('instructions'),
        container: document.getElementById('game-container')
    };

    let state = {
        isPlaying: false,
        isGameOver: false,
        score: 0,
        highScore: 0,
        speed: 0,
        baseSpeed: 9,
        maxSpeed: 22,
        frame: 0,
        gravity: 0.6,
        groundHeight: 100,
        groundOffset: 0
    };

    let entities = {
        player: null,
        obstacles: [],
        particles: [],
        bgLayers: [],
        sunX: 0
    };

    let spawnTimer = 0;

    /**
     * CLASSES
     */

    class Player {
        constructor() {
            this.w = 50; 
            this.h = 60; // Slightly smaller, sleeker
            this.x = canvas.width * 0.18; 
            this.y = canvas.height - state.groundHeight - this.h;
            this.dy = 0;
            this.jumpForce = -14;
            this.isGrounded = true;
            this.runAnim = 0;
            this.rotation = 0;
        }

        jump() {
            if (this.isGrounded) {
                this.dy = this.jumpForce;
                this.isGrounded = false;
                // Dust burst
                for(let i=0; i<6; i++) {
                    entities.particles.push(new Particle(this.x + 20, this.y + this.h, PALETTE.ground));
                }
            }
        }

        update() {
            this.dy += state.gravity;
            this.y += this.dy;

            // Ground Collision
            if (this.y + this.h > canvas.height - state.groundHeight) {
                this.y = canvas.height - state.groundHeight - this.h;
                this.dy = 0;
                this.isGrounded = true;
                this.rotation = 0;
            } else {
                // Rotate slightly when jumping
                this.rotation = Math.min(this.rotation + 0.05, 0.3);
            }

            if (this.isGrounded) this.runAnim += state.speed * 0.15;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.fillStyle = PALETTE.sil;
            
            // CRISP SILHOUETTE DRAWING
            // Head & Snout
            ctx.fillRect(20, 0, 25, 20);
            ctx.fillRect(35, 0, 15, 12); // Snout top
            ctx.fillRect(35, 15, 15, 5); // Jaw

            // Neck
            ctx.fillRect(25, 20, 15, 10);

            // Torso (Angled forward)
            ctx.beginPath();
            ctx.moveTo(25, 30);
            ctx.lineTo(40, 30);
            ctx.lineTo(35, 55);
            ctx.lineTo(20, 55);
            ctx.fill();

            // Arm (Tiny)
            ctx.fillRect(30, 35, 12, 4);

            // Tail (Spiky)
            ctx.beginPath();
            ctx.moveTo(20, 40);
            ctx.lineTo(0, 35);
            ctx.lineTo(5, 50);
            ctx.lineTo(20, 50);
            ctx.fill();

            // Legs (Animated)
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.strokeStyle = PALETTE.sil;

            if (!this.isGrounded) {
                // Jumping pose
                ctx.beginPath(); ctx.moveTo(25, 55); ctx.lineTo(15, 65); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(35, 55); ctx.lineTo(45, 65); ctx.stroke();
            } else {
                // Running cycle
                const offset = Math.sin(this.runAnim) * 12;
                ctx.beginPath(); ctx.moveTo(25, 55); ctx.lineTo(25 + offset, 60); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(35, 55); ctx.lineTo(35 - offset, 60); ctx.stroke();
            }

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type;
            this.markedForDeletion = false;
            this.x = canvas.width + 50;
            
            if (type === 'cactus') {
                // Variable cactus sizes
                this.w = 30 + Math.random() * 20;
                this.h = 40 + Math.random() * 30;
                this.y = canvas.height - state.groundHeight - this.h;
            } else {
                // Bird
                this.w = 50;
                this.h = 30;
                // Height levels
                const levels = [140, 90, 40]; 
                const dist = levels[Math.floor(Math.random() * levels.length)];
                this.y = canvas.height - state.groundHeight - dist;
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= state.speed;
            if (this.x + this.w < -100) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.2;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.fillStyle = PALETTE.sil;

            if (this.type === 'cactus') {
                // Stylized Cactus
                ctx.beginPath();
                // Main body
                ctx.rect(this.w/2 - 8, 0, 16, this.h);
                // Arms
                ctx.rect(this.w/2 - 20, this.h * 0.3, 12, 8);
                ctx.rect(this.w/2 - 20, this.h * 0.15, 8, this.h * 0.2);
                
                ctx.rect(this.w/2 + 8, this.h * 0.5, 15, 8);
                ctx.rect(this.w/2 + 15, this.h * 0.3, 8, this.h * 0.3);
                ctx.fill();
            } else {
                // Bird Silhouette
                // Body
                ctx.beginPath();
                ctx.ellipse(this.w/2, this.h/2 + 5, 15, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                // Beak
                ctx.beginPath();
                ctx.moveTo(this.w/2 + 15, this.h/2 + 5);
                ctx.lineTo(this.w + 5, this.h/2 + 8);
                ctx.lineTo(this.w/2 + 15, this.h/2 + 10);
                ctx.fill();
                // Wings
                const wingY = Math.sin(this.wingFrame) * 15;
                ctx.beginPath();
                ctx.moveTo(this.w/2 - 5, this.h/2);
                ctx.lineTo(this.w/2 - 15, this.h/2 - 20 - wingY);
                ctx.lineTo(this.w/2 + 10, this.h/2);
                ctx.fill();
            }
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 3 + 1;
            this.vx = (Math.random() - 0.5) * 3 - state.speed * 0.5;
            this.vy = (Math.random() - 1) * 2;
            this.color = color;
            this.alpha = 1;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= 0.03;
        }
        draw() {
            ctx.globalAlpha = Math.max(0, this.alpha);
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1;
        }
    }

    class BackgroundLayer {
        constructor(speedMod, yOffsetBase, jaggedness, color) {
            this.speedMod = speedMod;
            this.yOffsetBase = yOffsetBase; 
            this.jaggedness = jaggedness;
            this.color = color;
            this.x = 0;
            this.width = 100; 
            this.points = [];
            
            const count = Math.ceil(canvas.width / this.width) + 4;
            for(let i=0; i<count; i++) {
                this.points.push(Math.random() * this.jaggedness);
            }
        }

        update() {
            this.x -= state.speed * this.speedMod;
            if (this.x <= -this.width) {
                this.x += this.width;
                this.points.shift();
                this.points.push(Math.random() * this.jaggedness);
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            let startX = this.x % this.width;
            
            for (let i = 0; i < this.points.length; i++) {
                let px = startX + (i * this.width);
                let py = (canvas.height - state.groundHeight) - this.yOffsetBase - this.points[i];
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();
        }
    }

    /**
     * ENGINE
     */

    function init() {
        resize();
        entities.player = new Player();
        
        // Background Layers
        entities.bgLayers = [
            new BackgroundLayer(0.15, 250, 80, PALETTE.mtnFar),
            new BackgroundLayer(0.3, 150, 50, PALETTE.mtnNear)
        ];
        
        // Initial obstacles to populate scene
        entities.obstacles.push(new Obstacle('cactus'));
        entities.obstacles[0].x = canvas.width * 0.7;
        entities.obstacles.push(new Obstacle('bird'));
        entities.obstacles[1].x = canvas.width * 0.9;

        loop();
    }

    function spawnObstacle() {
        spawnTimer--;
        if (spawnTimer <= 0) {
            const type = Math.random() > 0.6 ? 'bird' : 'cactus';
            entities.obstacles.push(new Obstacle(type));
            
            const minFrames = 40;
            const maxFrames = 100;
            const speedFactor = state.speed * 3; 
            
            spawnTimer = Math.max(minFrames, (maxFrames + Math.random() * 50) - speedFactor);
        }
    }

    function checkCollisions() {
        const p = entities.player;
        // Hitbox tuning
        const hitX = p.x + 10;
        const hitY = p.y + 10;
        const hitW = p.w - 20;
        const hitH = p.h - 20;

        for (let obs of entities.obstacles) {
            const obsHitX = obs.x + 5;
            const obsHitY = obs.y + 5;
            const obsHitW = obs.w - 10;
            const obsHitH = obs.h - 10;

            if (
                hitX < obsHitX + obsHitW &&
                hitX + hitW > obsHitX &&
                hitY < obsHitY + obsHitH &&
                hitY + hitH > obsHitY
            ) {
                gameOver();
            }
        }
    }

    function gameOver() {
        state.isGameOver = true;
        state.isPlaying = false;
        ui.gameOver.style.display = 'block';
        ui.instructions.style.opacity = '0';
        
        if (state.score > state.highScore) {
            state.highScore = Math.floor(state.score);
            ui.highScore.innerText = state.highScore.toString().padStart(5, '0');
        }
    }

    function resetGame() {
        state.isGameOver = false;
        state.score = 0;
        state.speed = state.baseSpeed;
        spawnTimer = 0;
        
        entities.player = new Player();
        entities.obstacles = [];
        entities.particles = [];
        
        ui.gameOver.style.display = 'none';
        ui.instructions.style.opacity = '1';
        state.isPlaying = true;
    }

    function update() {
        if (!state.isPlaying) return;

        state.frame++;
        state.score += state.speed * 0.01;
        
        // Speed ramp
        if (state.frame % 120 === 0 && state.speed < state.maxSpeed) {
            state.speed += 0.2;
        }

        ui.score.innerText = Math.floor(state.score).toString().padStart(5, '0');
        const displaySpeed = Math.floor(100 + (state.speed - state.baseSpeed) * 10);
        ui.speedVal.innerText = displaySpeed;

        entities.player.update();
        entities.bgLayers.forEach(l => l.update());
        
        spawnObstacle();
        entities.obstacles.forEach((o, i) => {
            o.update();
            if (o.markedForDeletion) entities.obstacles.splice(i, 1);
        });

        entities.particles.forEach((p, i) => {
            p.update();
            if (p.alpha <= 0) entities.particles.splice(i, 1);
        });

        checkCollisions();
    }

    function draw() {
        // 1. Sky is handled by CSS gradient
        
        // 2. Sun (Static background element)
        ctx.fillStyle = PALETTE.sun;
        ctx.globalAlpha = 0.4;
        ctx.beginPath();
        ctx.arc(canvas.width * 0.7, canvas.height * 0.25, 80, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;

        // 3. Mountains
        entities.bgLayers.forEach(l => l.draw());

        // 4. Ground (Textured)
        ctx.fillStyle = PALETTE.ground;
        ctx.fillRect(0, canvas.height - state.groundHeight, canvas.width, state.groundHeight);
        
        // Ground Detail (Moving noise lines)
        ctx.fillStyle = PALETTE.groundDark;
        state.groundOffset = (state.groundOffset + state.speed) % 20;
        for(let i = -20; i < canvas.width; i+=20) {
            let x = i - state.groundOffset;
            // Draw random dashes
            if(Math.sin(i) > 0.5) {
                ctx.fillRect(x, canvas.height - state.groundHeight + 10, 10, 2);
                ctx.fillRect(x + 5, canvas.height - state.groundHeight + 30, 15, 2);
            }
        }
        
        // Ground Top Line
        ctx.fillStyle = PALETTE.sil;
        ctx.fillRect(0, canvas.height - state.groundHeight, canvas.width, 2);

        // 5. Entities
        entities.player.draw();
        entities.obstacles.forEach(o => o.draw());
        entities.particles.forEach(p => p.draw());
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    function resize() {
        canvas.width = ui.container.offsetWidth;
        canvas.height = ui.container.offsetHeight;
        if (entities.player) {
            entities.player.x = canvas.width * 0.18;
            if(!state.isPlaying) entities.player.y = canvas.height - state.groundHeight - entities.player.h;
        }
    }

    // Inputs
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            if (state.isGameOver) resetGame();
            else if (!state.isPlaying) { state.isPlaying = true; ui.instructions.style.opacity = '0'; }
            else entities.player.jump();
        }
    });

    window.addEventListener('resize', resize);
    
    window.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (state.isGameOver) resetGame();
        else if (!state.isPlaying) { state.isPlaying = true; ui.instructions.style.opacity = '0'; }
        else entities.player.jump();
    }, {passive: false});

    // Boot
    init();

</script>
</body>
</html>
