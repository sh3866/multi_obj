<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Urban Auto — Vector Showcase</title>
<style>
  :root {
    --bg: #f4f1ea;
    --text: #1a1a1a;
    --accent: #ff6600;
    --rickshaw-yellow: #FFD700;
    --chrome-light: #ffffff;
    --chrome-dark: #a0a0a0;
    --tire-black: #111111;
    --glass: #88ccff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Grain Texture Overlay */
  .noise {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.4'/%3E%3C/svg%3E");
  }

  /* Main Layout */
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    padding: 3rem;
    max-width: 1800px;
    margin: 0 auto;
  }

  /* Typography */
  header {
    grid-column: 1 / 2;
    grid-row: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: flex-start;
    margin-bottom: 2rem;
    z-index: 2;
  }

  h1 {
    font-size: 4.5rem;
    line-height: 0.9;
    text-transform: uppercase;
    letter-spacing: -0.03em;
    font-weight: 900;
    color: var(--text);
    margin-bottom: 0.5rem;
  }

  .subtitle {
    font-family: 'Courier New', Courier, monospace;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 1rem;
    letter-spacing: 0.1em;
    color: var(--accent);
    border-top: 2px solid var(--text);
    padding-top: 0.5rem;
    margin-top: 1rem;
  }

  /* Specs Block */
  .specs {
    grid-column: 1 / 2;
    grid-row: 2;
    align-self: flex-end;
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    line-height: 1.6;
    color: #555;
    border-left: 2px solid var(--accent);
    padding-left: 1.5rem;
  }

  .specs p { margin-bottom: 1rem; }
  .specs strong { color: var(--text); display: block; margin-bottom: 0.2rem; font-weight: bold; }

  /* SVG Stage */
  .stage {
    grid-column: 1 / -1;
    grid-row: 1 / -1;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    pointer-events: none; /* Let clicks pass through if needed */
  }

  #rickshaw-container {
    width: 90%;
    max-width: 1000px;
    height: auto;
    pointer-events: auto;
    transform: rotate(-6deg); /* Dynamic Tilt */
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    filter: drop-shadow(20px 30px 20px rgba(0,0,0,0.25));
  }

  #rickshaw-container:hover {
    transform: rotate(-4deg) scale(1.02);
    filter: drop-shadow(25px 35px 25px rgba(0,0,0,0.3));
  }

  /* Hotspots */
  .hotspot-group { cursor: pointer; }
  .hotspot { fill: var(--accent); stroke: #fff; stroke-width: 2; transition: all 0.2s; }
  .hotspot-group:hover .hotspot { r: 7; fill: #ff3300; }
  
  .hotspot-label {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: bold;
    fill: var(--text);
    opacity: 0;
    transition: opacity 0.2s;
    text-shadow: 0px 0px 4px var(--bg);
  }
  .hotspot-group:hover .hotspot-label { opacity: 1; }

  /* Footer */
  footer {
    position: absolute;
    bottom: 2rem;
    right: 3rem;
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    text-align: right;
    opacity: 0.7;
  }

</style>
</head>
<body>

<div class="noise"></div>

<main>
  <header>
    <h1>The<br>Auto<br>Rickshaw</h1>
    <div class="subtitle">Vehicle ID: TUK-TUK-01</div>
  </header>

  <div class="specs">
    <p>
      <strong>CHASSIS</strong>
      Open Steel Tubular<br>
      3-Wheel Configuration
    </p>
    <p>
      <strong>ENGINE</strong>
      125cc Single Cylinder<br>
      Air Cooled
    </p>
    <p>
      <strong>ORIGIN</strong>
      Mumbai, India<br>
      Est. 1980s
    </p>
  </div>

  <div class="stage">
    <!-- REVISED SVG -->
    <svg id="rickshaw-container" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- VOLUMETRIC GRADIENTS -->
        
        <!-- Yellow Body (Split Lighting: Top-Left Light) -->
        <linearGradient id="bodyGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#FFF200;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#FFC300;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="bodyGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#FFC300;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#B38F00;stop-opacity:1" />
        </linearGradient>

        <!-- Chrome/Metal -->
        <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
          <stop offset="40%" style="stop-color:#E0E0E0;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#999999;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#D0D0D0;stop-opacity:1" />
        </linearGradient>

        <!-- Glass -->
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#B3E5FC;stop-opacity:0.7" />
          <stop offset="100%" style="stop-color:#0288D1;stop-opacity:0.9" />
        </linearGradient>

        <!-- Tires -->
        <linearGradient id="tireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
          <stop offset="80%" style="stop-color:#111;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#000;stop-opacity:1" />
        </linearGradient>

        <!-- Headlamp Glow -->
        <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" style="stop-color:#FFF;stop-opacity:1" />
          <stop offset="30%" style="stop-color:#FFF9C4;stop-opacity:0.8" />
          <stop offset="100%" style="stop-color:#FFC107;stop-opacity:0" />
        </radialGradient>

        <!-- Decal Pattern -->
        <pattern id="flowerDecal" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
          <circle cx="10" cy="10" r="4" fill="none" stroke="#cc0000" stroke-width="1.5"/>
          <circle cx="10" cy="10" r="1.5" fill="#cc0000"/>
        </pattern>
      </defs>

      <!-- GROUND SHADOW -->
      <ellipse cx="450" cy="510" rx="300" ry="25" fill="rgba(0,0,0,0.2)" filter="blur(5px)" />

      <!-- === REAR WHEELS (ELLIPSES FOR DEPTH) === -->
      
      <!-- Rear Wheel Left (Background) -->
      <g transform="translate(380, 440)">
        <!-- Tire -->
        <ellipse cx="0" cy="0" rx="55" ry="55" fill="url(#tireGrad)" />
        <ellipse cx="0" cy="0" rx="40" ry="40" fill="#E0E0E0" /> <!-- Rim -->
        <ellipse cx="0" cy="0" rx="40" ry="40" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="10 5" /> <!-- Tread detail -->
        <ellipse cx="0" cy="0" rx="12" ry="12" fill="#111" /> <!-- Hub -->
        <!-- Mudguard -->
        <path d="M-60,-30 A 60 60 0 0 1 60,-30" fill="none" stroke="#FFC300" stroke-width="10" />
      </g>

      <!-- Rear Wheel Right (Foreground) -->
      <g transform="translate(560, 450)">
        <!-- Tire -->
        <ellipse cx="0" cy="0" rx="65" ry="65" fill="url(#tireGrad)" />
        <ellipse cx="0" cy="0" rx="48" ry="48" fill="url(#chromeGrad)" /> <!-- Chrome Rim -->
        <ellipse cx="0" cy="0" rx="48" ry="48" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="12 6" />
        <ellipse cx="0" cy="0" rx="15" ry="15" fill="#111" /> <!-- Hub -->
        <!-- Mudguard (Wraps over) -->
        <path d="M-70,-40 A 70 70 0 0 1 70,-40" fill="none" stroke="url(#bodyGradLight)" stroke-width="12" />
      </g>

      <!-- === CHASSIS & SUSPENSION === -->
      <g id="chassis">
        <!-- Rear Axle Beam -->
        <line x1="380" y1="440" x2="560" y2="450" stroke="#333" stroke-width="12" stroke-linecap="round" />
        
        <!-- Front Fork (Leading to Front Wheel) -->
        <path d="M 460 280 L 480 480" stroke="#333" stroke-width="10" stroke-linecap="round" />
        <!-- Steering Arm -->
        <path d="M 460 280 L 400 300" stroke="#333" stroke-width="8" />

        <!-- Engine Block (Under Driver) -->
        <rect x="430" y="380" width="80" height="60" rx="5" fill="#444" transform="rotate(10, 430, 380)" />
        <path d="M 430 380 L 440 400 L 480 410 L 510 390 Z" fill="#222" /> <!-- Engine Shadow -->
      </g>

      <!-- === FRONT WHEEL (CIRCLE - LARGER) === -->
      <g transform="translate(480, 480)">
        <!-- Tire -->
        <circle cx="0" cy="0" r="75" fill="url(#tireGrad)" />
        <circle cx="0" cy="0" r="60" fill="url(#chromeGrad)" /> <!-- Large Chrome Rim -->
        <circle cx="0" cy="0" r="60" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="15 8" />
        <circle cx="0" cy="0" r="20" fill="#111" /> <!-- Hub -->
        <!-- Mudguard -->
        <path d="M-80,-50 A 80 80 0 0 1 80,-50" fill="none" stroke="url(#bodyGradLight)" stroke-width="14" />
      </g>

      <!-- === CABIN (3D VOLUME - TRAPEZOIDAL PRISM) === -->
      <g id="cabin">
        <!-- Back Wall (Darker) -->
        <path d="M 320 250 L 500 250 L 500 150 L 320 150 Z" fill="url(#bodyGradDark)" />
        
        <!-- Right Side Wall (Light) -->
        <path d="M 500 150 L 500 250 L 620 250 L 620 150 Z" fill="url(#bodyGradLight)" />
        
        <!-- Door Panel (Right Side) -->
        <path d="M 500 250 L 620 250 L 620 180 L 500 180 Z" fill="url(#bodyGradLight)" stroke="#E6BE00" stroke-width="1"/>
        
        <!-- Side Window (Right) -->
        <path d="M 510 160 L 610 160 L 610 190 L 510 190 Z" fill="url(#glassGrad)" />
        
        <!-- Decals / Stickers -->
        <rect x="520" y="220" width="80" height="10" fill="url(#flowerDecal)" opacity="0.8" />
        <path d="M 500 240 L 620 240" stroke="#cc0000" stroke-width="2" stroke-dasharray="5 5" /> <!-- Stripe -->

        <!-- Roof Canopy -->
        <path d="M 310 150 L 490 150 L 630 150 L 630 160 L 490 160 L 310 160 Z" fill="url(#chromeGrad)" />
        <!-- Roof Rack -->
        <path d="M 300 150 L 300 140 L 500 140 L 500 150" fill="none" stroke="#333" stroke-width="4" />
        <line x1="330" y1="140" x2="330" y2="150" stroke="#333" stroke-width="2" />
        <line x1="400" y1="140" x2="400" y2="150" stroke="#333" stroke-width="2" />
        <line x1="470" y1="140" x2="470" y2="150" stroke="#333" stroke-width="2" />

        <!-- Driver Windshield (Front Face) -->
        <path d="M 460 250 L 500 250 L 500 150 L 460 150 Z" fill="url(#glassGrad)" stroke="#333" stroke-width="2"/>
        
        <!-- Driver Seat -->
        <path d="M 460 250 L 500 250 L 500 220 L 460 220 Z" fill="#222" />
        
        <!-- Driver Head Silhouette -->
        <circle cx="480" cy="200" r="12" fill="#333" />
      </g>

      <!-- === FRONT ASSEMBLY DETAILS === -->
      
      <!-- Handlebars -->
      <path d="M 460 280 L 410 270 L 410 290" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="410" cy="290" r="5" fill="#111" /> <!-- Grip -->
      
      <!-- Mirrors -->
      <path d="M 460 280 L 470 250 L 480 250" fill="none" stroke="#333" stroke-width="2" />
      <circle cx="482" cy="250" r="6" fill="#111" /> <!-- Mirror Head -->

      <!-- Headlamp -->
      <g transform="translate(480, 340)">
        <circle cx="0" cy="0" r="40" fill="url(#lampGlow)" /> <!-- Glow -->
        <circle cx="0" cy="0" r="18" fill="url(#chromeGrad)" /> <!-- Housing -->
        <circle cx="0" cy="0" r="12" fill="#FFF" /> <!-- Bulb -->
        <path d="M-18,0 A 18 18 0 0 1 18 0" fill="none" stroke="#333" stroke-width="2" /> <!-- Highlight -->
      </g>

      <!-- === INTERACTIVE HOTSPOTS === -->
      <g class="hotspot-group">
        <circle cx="480" cy="340" r="5" class="hotspot" />
        <text x="510" y="345" class="hotspot-label">Halogen Headlamp</text>
      </g>
      <g class="hotspot-group">
        <circle cx="620" cy="210" r="5" class="hotspot" />
        <text x="640" y="215" class="hotspot-label">Side Panel</text>
      </g>
      <g class="hotspot-group">
        <circle cx="480" cy="480" r="5" class="hotspot" />
        <text x="510" y="485" class="hotspot-label">Front Wheel</text>
      </g>
      <g class="hotspot-group">
        <circle cx="560" cy="450" r="5" class="hotspot" />
        <text x="590" y="455" class="hotspot-label">Rear Axle</text>
      </g>

    </svg>
  </div>

  <footer>
    <div>
      Designed for Urban Mobility<br>
      Vector Craft v2.0
    </div>
  </footer>
</main>

<script>
  // Interaction: Tilt SVG based on mouse position
  const container = document.querySelector('main');
  const svg = document.getElementById('rickshaw-container');

  container.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth) - 0.5;
    const y = (e.clientY / window.innerHeight) - 0.5;

    // Parallax effect
    // Base rotation is -6deg, we add slight dynamic movement
    const rotateY = x * 10; // Max 5deg left/right
    const rotateX = -y * 10; // Max 5deg up/down
    
    svg.style.transform = `perspective(1200px) rotate(-6deg) rotateY(${rotateY}deg) rotateX(${rotateX}deg) scale(1.02)`;
  });

  container.addEventListener('mouseleave', () => {
    svg.style.transform = `perspective(1200px) rotate(-6deg) rotateY(0deg) rotateX(0deg) scale(1)`;
  });
</script>
</body>
</html>
