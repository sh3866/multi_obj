<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Urban Auto — Vector Showcase</title>
<style>
  :root {
    --bg: #fdfbf7; /* Warmer, paper-like canvas */
    --text: #1a1a1a;
    --accent: #ff4500; /* Indian Saffron/Orange */
    --rickshaw-yellow: #FFD700;
    --chrome-light: #ffffff;
    --chrome-dark: #a0a0a0;
    --tire-black: #111111;
    --glass: #88ccff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Grain Texture Overlay - Subtle */
  .noise {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.5'/%3E%3C/svg%3E");
  }

  /* Main Layout */
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    padding: 4rem 6rem;
    max-width: 2000px;
    margin: 0 auto;
  }

  /* Typography - Refined Hierarchy */
  header {
    grid-column: 1 / 2;
    grid-row: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: flex-start;
    z-index: 2;
  }

  h1 {
    /* Reduced Scale & Weight */
    font-size: 3.5rem; 
    line-height: 1.1;
    text-transform: uppercase;
    letter-spacing: -0.04em;
    font-weight: 700; /* Reduced from 900 */
    color: var(--text);
    margin-bottom: 0.5rem;
  }

  .subtitle {
    font-family: 'Courier New', Courier, monospace;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    color: var(--accent);
    border-top: 1px solid var(--text);
    padding-top: 0.5rem;
    margin-top: 0.5rem;
    width: 100%;
  }

  /* Specs Block - Increased Contrast */
  .specs {
    grid-column: 1 / 2;
    grid-row: 2;
    align-self: flex-end;
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    line-height: 1.6;
    color: #000; /* Black for contrast */
    border-left: 3px solid var(--accent);
    padding-left: 1.5rem;
    max-width: 280px;
  }

  .specs p { margin-bottom: 1.2rem; }
  .specs strong { color: var(--accent); display: block; margin-bottom: 0.3rem; font-weight: 900; font-size: 0.9rem; }

  /* SVG Stage */
  .stage {
    grid-column: 1 / -1;
    grid-row: 1 / -1;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    pointer-events: none;
  }

  #rickshaw-container {
    width: 95%;
    max-width: 1100px;
    height: auto;
    pointer-events: auto;
    /* Slight rotation for dynamic feel */
    transform: rotate(-3deg); 
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    /* Anchored Shadow */
    filter: drop-shadow(25px 35px 10px rgba(0,0,0,0.2));
  }

  #rickshaw-container:hover {
    transform: rotate(-1deg) scale(1.01);
    filter: drop-shadow(30px 40px 15px rgba(0,0,0,0.25));
  }

  /* Hotspots */
  .hotspot-group { cursor: pointer; pointer-events: auto; }
  .hotspot { fill: var(--accent); stroke: #fff; stroke-width: 2; transition: all 0.2s; }
  .hotspot-group:hover .hotspot { r: 7; fill: #ff3300; }
  
  .hotspot-label {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    font-weight: bold;
    fill: var(--text);
    opacity: 0;
    transition: opacity 0.2s;
    text-shadow: 0px 0px 6px var(--bg);
  }
  .hotspot-group:hover .hotspot-label { opacity: 1; }

  /* Footer - Removed per critique */
  footer { display: none; }

</style>
</head>
<body>

<div class="noise"></div>

<main>
  <header>
    <h1>The<br>Auto<br>Rickshaw</h1>
    <div class="subtitle">Vehicle ID: TUK-TUK-01</div>
  </header>

  <div class="specs">
    <p>
      <strong>CHASSIS</strong>
      Open Steel Tubular<br>
      3-Wheel Configuration<br>
      <span style="opacity:0.6; font-size:0.75em">REAR AXLE DRIVE</span>
    </p>
    <p>
      <strong>ENGINE</strong>
      125cc Single Cylinder<br>
      Air Cooled<br>
      <span style="opacity:0.6; font-size:0.75em">3-GEAR TRANSMISSION</span>
    </p>
  </div>

  <div class="stage">
    <!-- REVISED SVG -->
    <svg id="rickshaw-container" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- VOLUMETRIC GRADIENTS -->
        
        <!-- Yellow Body (Rich Gradient) -->
        <linearGradient id="bodyGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#FFF200;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#FFC300;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="bodyGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#FFC300;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#B38F00;stop-opacity:1" />
        </linearGradient>

        <!-- Chrome/Metal (Tubular Look) -->
        <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
          <stop offset="40%" style="stop-color:#E0E0E0;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#999999;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#D0D0D0;stop-opacity:1" />
        </linearGradient>

        <!-- Glass -->
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#B3E5FC;stop-opacity:0.6" />
          <stop offset="100%" style="stop-color:#0288D1;stop-opacity:0.85" />
        </linearGradient>

        <!-- Tires -->
        <linearGradient id="tireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
          <stop offset="80%" style="stop-color:#111;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#000;stop-opacity:1" />
        </linearGradient>

        <!-- Headlamp Glow -->
        <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" style="stop-color:#FFF;stop-opacity:1" />
          <stop offset="30%" style="stop-color:#FFF9C4;stop-opacity:0.9" />
          <stop offset="100%" style="stop-color:#FFC107;stop-opacity:0" />
        </radialGradient>

        <!-- Seat Pattern -->
        <pattern id="seatPattern" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
          <rect width="10" height="10" fill="#444" />
          <path d="M0,0 L10,10 M10,0 L0,10" stroke="#222" stroke-width="1"/>
        </pattern>
        
        <!-- Decal Pattern -->
        <pattern id="flowerDecal" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
          <circle cx="10" cy="10" r="4" fill="none" stroke="#cc0000" stroke-width="1.5"/>
          <circle cx="10" cy="10" r="1.5" fill="#cc0000"/>
        </pattern>
      </defs>

      <!-- GROUND SHADOW -->
      <ellipse cx="450" cy="560" rx="280" ry="30" fill="rgba(0,0,0,0.25)" filter="blur(6px)" />

      <!-- === REAR WHEELS (ELLIPSES FOR DEPTH) === -->
      
      <!-- Rear Wheel Left (Background) -->
      <g transform="translate(380, 470)">
        <!-- Tire -->
        <ellipse cx="0" cy="0" rx="55" ry="55" fill="url(#tireGrad)" />
        <ellipse cx="0" cy="0" rx="40" ry="40" fill="#E0E0E0" /> <!-- Rim -->
        <ellipse cx="0" cy="0" rx="40" ry="40" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="10 5" />
        <ellipse cx="0" cy="0" rx="12" ry="12" fill="#111" /> <!-- Hub -->
        <!-- Mudguard (Curved path overlapping tire) -->
        <path d="M-60,-35 A 60 60 0 0 1 60,-35" fill="none" stroke="url(#bodyGradLight)" stroke-width="12" />
        <path d="M-60,-35 A 60 60 0 0 1 60,-35" fill="none" stroke="#000" stroke-width="2" opacity="0.2" /> <!-- Edge detail -->
      </g>

      <!-- Rear Wheel Right (Foreground) -->
      <g transform="translate(560, 480)">
        <!-- Tire -->
        <ellipse cx="0" cy="0" rx="65" ry="65" fill="url(#tireGrad)" />
        <ellipse cx="0" cy="0" rx="48" ry="48" fill="url(#chromeGrad)" /> <!-- Chrome Rim -->
        <ellipse cx="0" cy="0" rx="48" ry="48" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="12 6" />
        <ellipse cx="0" cy="0" rx="15" ry="15" fill="#111" /> <!-- Hub -->
        <!-- Mudguard (Wraps over) -->
        <path d="M-70,-45 A 70 70 0 0 1 70,-45" fill="none" stroke="url(#bodyGradLight)" stroke-width="14" />
        <path d="M-70,-45 A 70 70 0 0 1 70,-45" fill="none" stroke="#000" stroke-width="2" opacity="0.2" />
      </g>

      <!-- === CHASSIS & SUSPENSION === -->
      <g id="chassis">
        <!-- Rear Axle Beam (Thick Tubular) -->
        <line x1="380" y1="470" x2="560" y2="480" stroke="#333" stroke-width="16" stroke-linecap="round" />
        
        <!-- Frame Connectors (Connecting cabin to wheels) -->
        <line x1="400" y1="470" x2="450" y2="300" stroke="#222" stroke-width="8" />
        <line x1="540" y1="480" x2="580" y2="300" stroke="#222" stroke-width="8" />
        
        <!-- Front Fork (Leading to Front Wheel) -->
        <path d="M 460 280 L 480 510" stroke="#333" stroke-width="12" stroke-linecap="round" />
        <!-- Steering Arm -->
        <path d="M 460 280 L 400 310" stroke="#333" stroke-width="10" />

        <!-- Engine Block (Under Driver) -->
        <rect x="430" y="400" width="90" height="60" rx="5" fill="#444" transform="rotate(10, 430, 400)" />
        <path d="M 430 400 L 440 420 L 480 430 L 520 410 Z" fill="#222" /> <!-- Engine Shadow -->
      </g>

      <!-- === FRONT WHEEL (CIRCLE - LARGER) === -->
      <g transform="translate(480, 510)">
        <!-- Tire -->
        <circle cx="0" cy="0" r="75" fill="url(#tireGrad)" />
        <circle cx="0" cy="0" r="60" fill="url(#chromeGrad)" /> <!-- Large Chrome Rim -->
        <circle cx="0" cy="0" r="60" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="15 8" />
        <circle cx="0" cy="0" r="20" fill="#111" /> <!-- Hub -->
        <!-- Mudguard -->
        <path d="M-80,-50 A 80 80 0 0 1 80,-50" fill="none" stroke="url(#bodyGradLight)" stroke-width="16" />
        <path d="M-80,-50 A 80 80 0 0 1 80,-50" fill="none" stroke="#000" stroke-width="2" opacity="0.2" />
      </g>

      <!-- === CABIN (3D VOLUME - TRAPEZOIDAL PRISM) === -->
      <g id="cabin">
        <!-- Back Wall (Darker) -->
        <path d="M 320 280 L 500 280 L 500 160 L 320 160 Z" fill="url(#bodyGradDark)" />
        
        <!-- Right Side Wall (Light) -->
        <path d="M 500 160 L 500 280 L 620 280 L 620 160 Z" fill="url(#bodyGradLight)" />
        
        <!-- Door Panel (Right Side) -->
        <path d="M 500 280 L 620 280 L 620 200 L 500 200 Z" fill="url(#bodyGradLight)" stroke="#E6BE00" stroke-width="1"/>
        
        <!-- Side Window (Right) -->
        <path d="M 510 170 L 610 170 L 610 210 L 510 210 Z" fill="url(#glassGrad)" />
        
        <!-- Decals / Stickers -->
        <rect x="520" y="240" width="80" height="12" fill="url(#flowerDecal)" opacity="0.9" />
        <path d="M 500 265 L 620 265" stroke="#cc0000" stroke-width="2" stroke-dasharray="5 5" /> <!-- Stripe -->

        <!-- Roof Canopy -->
        <path d="M 310 160 L 490 160 L 630 160 L 630 170 L 490 170 L 310 170 Z" fill="url(#chromeGrad)" />
        <!-- Roof Rack (More detail) -->
        <path d="M 300 160 L 300 145 L 500 145 L 500 160" fill="none" stroke="#333" stroke-width="4" />
        <line x1="330" y1="145" x2="330" y2="160" stroke="#333" stroke-width="2" />
        <line x1="400" y1="145" x2="400" y2="160" stroke="#333" stroke-width="2" />
        <line x1="470" y1="145" x2="470" y2="160" stroke="#333" stroke-width="2" />
        
        <!-- Hanging Prayer Flag/Tassel (Identity Detail) -->
        <path d="M 310 160 L 290 190" stroke="#ff4500" stroke-width="3" />
        <circle cx="290" cy="195" r="4" fill="#ff4500" />

        <!-- Driver Windshield (Angled) -->
        <path d="M 460 280 L 500 280 L 500 160 L 460 160 Z" fill="url(#glassGrad)" stroke="#333" stroke-width="2"/>
        <!-- Windshield Wiper -->
        <path d="M 480 280 L 470 240" stroke="#111" stroke-width="2" />

        <!-- Driver Seat (Visible through window or side) -->
        <path d="M 460 280 L 500 280 L 500 240 L 460 240 Z" fill="url(#seatPattern)" />
        
        <!-- Driver Head Silhouette -->
        <circle cx="480" cy="210" r="14" fill="#333" />
        <path d="M 480 210 L 490 260" stroke="#333" stroke-width="10" /> <!-- Shoulder -->
      </g>

      <!-- === FRONT ASSEMBLY DETAILS === -->
      
      <!-- Handlebars (Functional Yoke) -->
      <path d="M 460 280 L 410 270 L 410 300" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="410" cy="300" r="6" fill="#111" /> <!-- Grip -->
      
      <!-- Mirrors -->
      <path d="M 460 280 L 470 250 L 480 250" fill="none" stroke="#333" stroke-width="2" />
      <circle cx="482" cy="250" r="6" fill="#111" /> <!-- Mirror Head -->
      <!-- Side Mirror (Passenger side) -->
      <path d="M 500 200 L 510 190 L 520 190" fill="none" stroke="#333" stroke-width="2" />
      <circle cx="522" cy="190" r="6" fill="#111" />

      <!-- Headlamp (Detailed) -->
      <g transform="translate(480, 360)">
        <circle cx="0" cy="0" r="50" fill="url(#lampGlow)" /> <!-- Glow -->
        <circle cx="0" cy="0" r="22" fill="url(#chromeGrad)" /> <!-- Housing -->
        <circle cx="0" cy="0" r="15" fill="#FFF" /> <!-- Bulb -->
        <path d="M-22,0 A 22 22 0 0 1 22 0" fill="none" stroke="#333" stroke-width="2" /> <!-- Highlight -->
      </g>

      <!-- === INTERACTIVE HOTSPOTS === -->
      <g class="hotspot-group">
        <circle cx="480" cy="360" r="5" class="hotspot" />
        <text x="520" y="365" class="hotspot-label">Halogen Headlamp</text>
      </g>
      <g class="hotspot-group">
        <circle cx="620" cy="230" r="5" class="hotspot" />
        <text x="640" y="235" class="hotspot-label">Side Panel</text>
      </g>
      <g class="hotspot-group">
        <circle cx="480" cy="510" r="5" class="hotspot" />
        <text x="520" y="515" class="hotspot-label">Front Wheel</text>
      </g>
      <g class="hotspot-group">
        <circle cx="560" cy="480" r="5" class="hotspot" />
        <text x="590" y="485" class="hotspot-label">Rear Axle</text>
      </g>

    </svg>
  </div>
</main>

<script>
  // Interaction: Tilt SVG based on mouse position
  const container = document.querySelector('main');
  const svg = document.getElementById('rickshaw-container');

  container.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth) - 0.5;
    const y = (e.clientY / window.innerHeight) - 0.5;

    // Parallax effect
    // Base rotation is -3deg, we add slight dynamic movement
    const rotateY = x * 8; // Max 4deg left/right
    const rotateX = -y * 8; // Max 4deg up/down
    
    svg.style.transform = `perspective(1200px) rotate(-3deg) rotateY(${rotateY}deg) rotateX(${rotateX}deg) scale(1.02)`;
  });

  container.addEventListener('mouseleave', () => {
    svg.style.transform = `perspective(1200px) rotate(-3deg) rotateY(0deg) rotateX(0deg) scale(1)`;
  });
</script>
</body>
</html>
