<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Tactics | AI Behavior</title>
<style>
  :root {
    --bg-dark: #020617; /* Slate 950 */
    --grid-color: rgba(56, 189, 248, 0.04);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent-gold: #fbbf24;
    --accent-cyan: #22d3ee;
    --accent-amber: #f59e0b;
    --accent-red: #ef4444;
    --accent-green: #22c55e; /* Green for Integrity */
    --wall-fill: #0f172a; /* Solid Dark */
    --wall-stroke: #334155;
    --panel-bg: rgba(2, 6, 23, 0.85);
    --border-light: rgba(148, 163, 184, 0.15);
    --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-dark);
    color: var(--text-primary);
    font-family: var(--font-main);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
  }

  /* Tactical Grid Background */
  .grid-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
    pointer-events: none;
  }

  /* Canvas Layer */
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
    cursor: crosshair;
  }

  /* UI Overlay Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px;
    box-sizing: border-box;
  }

  /* Header */
  header {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    pointer-events: auto;
    gap: 8px;
    width: 100%;
  }

  .header-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .brand-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--accent-gold), #fcd34d);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 15px rgba(251, 191, 36, 0.3);
  }

  .brand-text h1 {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 1px;
    margin: 0;
    color: #fff;
    text-transform: uppercase;
  }

  .brand-text p {
    font-size: 11px;
    color: var(--text-secondary);
    margin: 0;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    opacity: 0.7;
  }

  /* Header Controls */
  .header-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .status-badge {
    font-size: 9px;
    padding: 4px 8px;
    background: rgba(34, 211, 238, 0.1);
    color: var(--accent-cyan);
    border-radius: 4px;
    border: 1px solid rgba(34, 211, 238, 0.2);
    text-transform: uppercase;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .live-dot {
    width: 6px;
    height: 6px;
    background-color: var(--accent-cyan);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { opacity: 1; box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.7); }
    70% { opacity: 0.7; box-shadow: 0 0 0 4px rgba(34, 211, 238, 0); }
    100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34, 211, 238, 0); }
  }

  .btn {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border-light);
    color: var(--text-secondary);
    padding: 6px 12px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    border-radius: 4px;
    pointer-events: auto;
  }

  .btn:hover {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border-color: rgba(255,255,255,0.3);
  }

  /* Unified Tactical Inspector Panel (Top Left) */
  .tactical-inspector {
    position: absolute;
    top: 100px; /* Below header */
    left: 24px;
    width: 240px;
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border-light);
    border-radius: 6px;
    padding: 16px;
    pointer-events: auto;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-light);
    padding-bottom: 8px;
  }

  .panel-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-secondary);
    font-weight: 700;
  }

  /* Stats */
  .stat-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
  }

  .stat-label { color: var(--text-secondary); }
  .stat-value { font-family: 'SF Mono', 'Roboto Mono', monospace; font-weight: 500; color: #fff; }

  .health-container {
    margin-top: -2px;
  }

  .health-bar-bg {
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: hidden;
  }

  .health-fill {
    height: 100%;
    background: var(--accent-green); /* Changed to Green */
    width: 100%;
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
  }

  /* Legend Section within Panel */
  .legend-section {
    border-top: 1px solid var(--border-light);
    padding-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .legend-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text-secondary);
  }

  .indicator {
    width: 6px;
    height: 6px;
    transform: rotate(45deg); /* Diamond shape */
    box-shadow: 0 0 4px currentColor;
  }

  /* Footer Hint */
  .footer-hint {
    position: absolute;
    bottom: 24px;
    left: 24px;
    font-size: 11px;
    color: var(--text-secondary);
    opacity: 0.6;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .key-hint {
    background: rgba(255,255,255,0.05);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: monospace;
    border: 1px solid rgba(255,255,255,0.1);
    color: #fff;
  }

</style>
</head>
<body>

  <div class="grid-bg"></div>
  <canvas id="arena"></canvas>

  <div class="ui-layer">
    <header>
      <div class="header-content">
        <div class="brand">
          <div class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2l8.66 5v10L12 22l-8.66-5V7L12 2z"/>
            </svg>
          </div>
          <div class="brand-text">
            <h1>Neural Tactics</h1>
            <p>AI Behavior Simulation</p>
          </div>
        </div>
        
        <div class="header-controls">
          <div class="status-badge">
            <div class="live-dot"></div>
            LIVE
          </div>
          <button class="btn" id="btn-reset">Reset Sim</button>
        </div>
      </div>
    </header>

    <!-- Unified Tactical Inspector (Top Left) -->
    <div class="tactical-inspector">
      <div class="panel-header">
        <div class="panel-title">Tactical Inspector</div>
      </div>
      
      <div class="stat-group">
        <div class="stat-row">
          <span class="stat-label">Player Integrity</span>
          <span class="stat-value" id="hp-val">100%</span>
        </div>
        <div class="health-container">
          <div class="health-bar-bg">
            <div class="health-fill" id="hp-bar"></div>
          </div>
        </div>

        <div class="stat-row">
          <span class="stat-label">Coordinates</span>
          <span class="stat-value" id="pos-val">0, 0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Velocity</span>
          <span class="stat-value" id="vel-val">0.0</span>
        </div>
      </div>

      <!-- Legend Moved Here -->
      <div class="legend-section">
        <div class="legend-row">
          <div class="legend-item">
            <div class="indicator" style="color: var(--accent-cyan); background: var(--accent-cyan);"></div>
            PATROL
          </div>
          <div class="legend-item">
            <div class="indicator" style="color: var(--accent-amber); background: var(--accent-amber);"></div>
            ALERT
          </div>
        </div>
        <div class="legend-row">
          <div class="legend-item">
            <div class="indicator" style="color: var(--accent-red); background: var(--accent-red);"></div>
            CHASE
          </div>
          <div class="legend-item">
            <div class="indicator" style="color: #fff; background: #fff;"></div>
            ATTACK
          </div>
        </div>
      </div>
    </div>

    <!-- Footer Hint -->
    <div class="footer-hint">
      <span class="key-hint">W</span><span class="key-hint">A</span><span class="key-hint">S</span><span class="key-hint">D</span> to move
    </div>
  </div>

<script>
/**
 * ENGINE & LOGIC
 */
const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d');
const ui = {
  hpVal: document.getElementById('hp-val'),
  hpBar: document.getElementById('hp-bar'),
  posVal: document.getElementById('pos-val'),
  velVal: document.getElementById('vel-val'),
  resetBtn: document.getElementById('btn-reset')
};

// Configuration
const COLORS = {
  PATROL: '#22d3ee', // Cyan
  ALERT: '#f59e0b',  // Amber
  CHASE: '#ef4444',  // Red
  ATTACK: '#ffffff', // White
  PLAYER: '#fbbf24', // Gold
  PLAYER_GLOW: 'rgba(251, 191, 36, 0.4)',
  WALL_FILL: '#0f172a', // Solid Dark Slate
  WALL_STROKE: '#334155', // Slate 700
  TRAIL: 'rgba(255,255,255,0.15)',
  CONE: 'rgba(255,255,255,0.05)',
  RANGE: 'rgba(255,255,255,0.1)'
};

const STATES = {
  PATROL: 'PATROL',
  ALERT: 'ALERT',
  CHASE: 'CHASE',
  ATTACK: 'ATTACK'
};

// Game State
let width, height;
let player = { x: 0, y: 0, radius: 12, hp: 100, speed: 4.5, trail: [] };
let enemies = [];
let walls = [];
let keys = {};

// Initialize
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  initWorld();
}

function initWorld() {
  // Player start
  player.x = width * 0.15;
  player.y = height * 0.5;
  player.hp = 100;
  player.trail = [];

  // Walls - Tactical Arena
  const w = width;
  const h = height;
  walls = [
    { x: w * 0.3, y: h * 0.2, w: 20, h: h * 0.4 },
    { x: w * 0.6, y: h * 0.4, w: 20, h: h * 0.4 },
    { x: w * 0.4, y: h * 0.5, w: 150, h: 20 },
    { x: w * 0.15, y: h * 0.15, w: 120, h: 120 }, 
    { x: w * 0.75, y: h * 0.7, w: 120, h: 120 },
  ];

  // Enemies - Diverse States as per critique
  enemies = [
    new Enemy(w * 0.5, h * 0.15, STATES.PATROL),
    new Enemy(w * 0.8, h * 0.8, STATES.PATROL),
    new Enemy(w * 0.85, h * 0.2, STATES.CHASE), // Forced Chase
    new Enemy(w * 0.15, h * 0.8, STATES.ALERT), // Forced Alert
    new Enemy(w * 0.5, h * 0.9, STATES.ATTACK), // Forced Attack
  ];
}

class Enemy {
  constructor(x, y, state) {
    this.x = x;
    this.y = y;
    this.radius = 10;
    this.angle = 0;
    this.state = state;
    this.speed = 2.0;
    this.trail = []; 
    
    // Patrol Logic
    this.patrolPath = [];
    this.generatePatrolPath();
    this.patrolIndex = 0;
    
    // Alert Logic
    this.alertTimer = 0;
    
    // Attack Logic
    this.attackCooldown = 0;
    this.wobble = Math.random() * 100;
  }

  generatePatrolPath() {
    const points = 6;
    for(let i=0; i<points; i++) {
      this.patrolPath.push({
        x: Math.random() * (width - 100) + 50,
        y: Math.random() * (height - 100) + 50
      });
    }
  }

  update() {
    const distToPlayer = Math.hypot(player.x - this.x, player.y - this.y);
    const angleToPlayer = Math.atan2(player.y - this.y, player.x - this.x);
    
    let canSeePlayer = false;
    const visionRange = 280;
    
    if (distToPlayer < visionRange) {
      let angleDiff = angleToPlayer - this.angle;
      while (angleDiff <= -Math.PI) angleDiff += Math.PI*2;
      while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
      
      // FOV 90 degrees (PI/2)
      if (Math.abs(angleDiff) < Math.PI / 2) {
        canSeePlayer = !checkWallCollision(this.x, this.y, player.x, player.y);
      }
    }

    // State Machine
    switch(this.state) {
      case STATES.PATROL:
        let target = this.patrolPath[this.patrolIndex];
        this.angle = Math.atan2(target.y - this.y, target.x - this.x);
        this.moveTowards(target.x, target.y);
        
        if (Math.hypot(target.x - this.x, target.y - this.y) < 10) {
          this.patrolIndex = (this.patrolIndex + 1) % this.patrolPath.length;
        }

        if (distToPlayer < visionRange && canSeePlayer) {
          this.state = STATES.ALERT;
          this.alertTimer = 45; 
        }
        break;

      case STATES.ALERT:
        this.angle = angleToPlayer;
        this.alertTimer--;
        // Hover in place
        if (this.alertTimer <= 0) {
          if (canSeePlayer) this.state = STATES.CHASE;
          else this.state = STATES.PATROL;
        }
        break;

      case STATES.CHASE:
        this.angle = angleToPlayer;
        this.speed = 3.2; 
        if (canSeePlayer) {
          if (distToPlayer < 50) {
            this.state = STATES.ATTACK;
            this.speed = 0; // Stop to attack
          } else {
            this.moveTowards(player.x, player.y);
          }
        } else {
          this.state = STATES.ALERT;
          this.alertTimer = 60;
          this.speed = 2.0;
        }
        break;

      case STATES.ATTACK:
        this.angle = angleToPlayer;
        this.attackCooldown--;
        if (this.attackCooldown <= 0) {
          player.hp -= 2;
          this.attackCooldown = 20;
          createParticle(player.x, player.y, COLORS.ATTACK);
        }
        if (distToPlayer > 200) {
          this.state = STATES.CHASE;
        }
        break;
    }

    // Update Motion Trail
    this.trail.push({x: this.x, y: this.y});
    if (this.trail.length > 15) this.trail.shift();
  }

  moveTowards(tx, ty) {
    const dx = tx - this.x;
    const dy = ty - this.y;
    const dist = Math.hypot(dx, dy);
    
    if (dist > 0) {
      let nx = (dx / dist) * this.speed;
      let ny = (dy / dist) * this.speed;
      
      if (!checkCircleWallCollision(this.x + nx, this.y + ny, this.radius)) {
        this.x += nx;
        this.y += ny;
      } else {
        // Slide
        if (!checkCircleWallCollision(this.x + nx, this.y, this.radius)) this.x += nx;
        else if (!checkCircleWallCollision(this.x, this.y + ny, this.radius)) this.y += ny;
      }
    }
  }

  draw() {
    ctx.save();
    
    // 1. Draw Velocity/Path Trail (Dashed)
    if (this.trail.length > 1) {
      ctx.beginPath();
      ctx.setLineDash([4, 4]); // Dashed line
      ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (let i = 1; i < this.trail.length; i++) {
        ctx.lineTo(this.trail[i].x, this.trail[i].y);
      }
      ctx.strokeStyle = this.getColor();
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.4;
      ctx.stroke();
      ctx.setLineDash([]); // Reset
      ctx.globalAlpha = 1.0;
    }

    // 2. Visualize AI Logic (Brain)
    // Detection Cone (Reduced Opacity)
    ctx.fillStyle = this.state === STATES.CHASE ? 'rgba(239, 68, 68, 0.1)' : 'rgba(255, 255, 255, 0.05)';
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    // Draw a 90 degree cone
    ctx.arc(this.x, this.y, 280, this.angle - Math.PI/2, this.angle + Math.PI/2);
    ctx.lineTo(this.x, this.y);
    ctx.fill();

    // Attack Range Circle (Distinct Ring)
    ctx.strokeStyle = this.state === STATES.ATTACK ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 50, 0, Math.PI*2);
    ctx.stroke();

    // 3. Draw Entity (Unified Geometry: Rounded Triangle)
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);

    // Body Shape
    ctx.fillStyle = this.getColor();
    ctx.shadowColor = this.getColor();
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.lineTo(-8, 8);
    ctx.lineTo(-4, 0);
    ctx.lineTo(-8, -8);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.restore();

    // 4. State Label
    ctx.fillStyle = this.getColor();
    ctx.font = 'bold 10px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(this.state, this.x, this.y - 22);

    // 5. Chase Vector (Solid line to player)
    if (this.state === STATES.CHASE) {
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(player.x, player.y);
        ctx.strokeStyle = COLORS.CHASE;
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.6;
        ctx.stroke();
        ctx.globalAlpha = 1.0;
    }
  }

  getColor() {
    switch(this.state) {
      case STATES.PATROL: return COLORS.PATROL;
      case STATES.ALERT: return COLORS.ALERT;
      case STATES.CHASE: return COLORS.CHASE;
      case STATES.ATTACK: return COLORS.ATTACK;
      default: return '#fff';
    }
  }
}

// Helpers
function checkWallCollision(x1, y1, x2, y2) {
  for (let w of walls) {
    if (x1 < w.x + w.w && x2 > w.x && y1 < w.y + w.h && y2 > w.y) return true;
    if (x2 < w.x + w.w && x1 > w.x && y2 < w.y + w.h && y1 > w.y) return true;
  }
  return false;
}

function checkCircleWallCollision(x, y, r) {
  for (let w of walls) {
    let testX = x;
    let testY = y;

    if (x < w.x) testX = w.x;
    else if (x > w.x + w.w) testX = w.x + w.w;

    if (y < w.y) testY = w.y;
    else if (y > w.y + w.h) testY = w.y + w.h;

    let distX = x - testX;
    let distY = y - testY;
    let distance = Math.sqrt((distX*distX) + (distY*distY));

    if (distance <= r) return true;
  }
  return false;
}

let particles = [];
function createParticle(x, y, color) {
  for(let i=0; i<3; i++) {
    particles.push({
      x: x + (Math.random()-0.5)*10, 
      y: y + (Math.random()-0.5)*10, 
      vx: (Math.random()-0.5)*2,
      vy: (Math.random()-0.5)*2,
      color: color, 
      life: 30, 
      size: Math.random() * 3 + 1
    });
  }
}

// Input Handling
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('resize', resize);
ui.resetBtn.addEventListener('click', initWorld);

// Main Loop
function loop() {
  ctx.clearRect(0, 0, width, height);

  // Update Player
  let dx = 0, dy = 0;
  if (keys['w']) dy = -1;
  if (keys['s']) dy = 1;
  if (keys['a']) dx = -1;
  if (keys['d']) dx = 1;

  if (dx !== 0 || dy !== 0) {
    let len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    
    let nextX = player.x + dx * player.speed;
    let nextY = player.y + dy * player.speed;
    
    if (!checkCircleWallCollision(nextX, player.y, player.radius)) player.x = nextX;
    if (!checkCircleWallCollision(player.x, nextY, player.radius)) player.y = nextY;
    
    player.trail.push({x: player.x, y: player.y});
    if (player.trail.length > 15) player.trail.shift();
  }

  // Draw Walls (Standardized Dark Fill + Edge Highlight)
  for (let w of walls) {
    ctx.fillStyle = COLORS.WALL_FILL;
    ctx.fillRect(w.x, w.y, w.w, w.h);
    
    ctx.strokeStyle = COLORS.WALL_STROKE;
    ctx.lineWidth = 1;
    ctx.strokeRect(w.x, w.y, w.w, w.h);
  }

  // Draw Player Trail
  if (player.trail.length > 1) {
    ctx.beginPath();
    ctx.moveTo(player.trail[0].x, player.trail[0].y);
    for (let i = 1; i < player.trail.length; i++) {
      ctx.lineTo(player.trail[i].x, player.trail[i].y);
    }
    ctx.strokeStyle = COLORS.PLAYER;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.globalAlpha = 0.3;
    ctx.stroke();
    ctx.globalAlpha = 1.0;
  }

  // Update & Draw Enemies
  for (let e of enemies) {
    e.update();
    e.draw();
  }

  // Draw Player (Distinct Shape: Hexagon, Gold/White)
  ctx.save();
  ctx.translate(player.x, player.y);
  
  // Glow
  ctx.shadowColor = COLORS.PLAYER;
  ctx.shadowBlur = 15;
  
  // Hexagon Shape
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const angle = (Math.PI / 3) * i;
    const px = Math.cos(angle) * player.radius;
    const py = Math.sin(angle) * player.radius;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  
  // Inner Hex (Gold)
  ctx.shadowBlur = 0;
  ctx.fillStyle = COLORS.PLAYER;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const angle = (Math.PI / 3) * i;
    const px = Math.cos(angle) * (player.radius - 3);
    const py = Math.sin(angle) * (player.radius - 3);
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  
  ctx.restore();

  // Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 30;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  ctx.globalAlpha = 1;

  // Update UI
  ui.posVal.textContent = `${Math.round(player.x)}, ${Math.round(player.y)}`;
  let speed = Math.hypot(keys['w']?1:0 + (keys['s']?1:0), keys['a']?1:0 + (keys['d']?1:0));
  ui.velVal.textContent = (speed * player.speed).toFixed(1);
  
  ui.hpVal.textContent = Math.max(0, Math.round(player.hp)) + '%';
  ui.hpBar.style.width = Math.max(0, player.hp) + '%';
  if (player.hp < 30) ui.hpBar.style.backgroundColor = COLORS.CHASE;
  else ui.hpBar.style.backgroundColor = COLORS.PLAYER;

  requestAnimationFrame(loop);
}

// Start
resize();
loop();

</script>
</body>
