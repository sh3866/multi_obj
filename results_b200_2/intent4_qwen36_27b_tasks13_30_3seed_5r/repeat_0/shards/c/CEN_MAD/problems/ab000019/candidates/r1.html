<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Tactics | AI Behavior</title>
<style>
  :root {
    --bg-dark: #05080a;
    --grid-color: rgba(56, 189, 248, 0.05);
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --accent-blue: #38bdf8;
    --accent-amber: #fbbf24;
    --accent-red: #f43f5e;
    --accent-cyan: #06b6d4;
    --panel-bg: rgba(15, 23, 42, 0.65);
    --border-light: rgba(255, 255, 255, 0.1);
    --font-main: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-dark);
    color: var(--text-primary);
    font-family: var(--font-main);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
  }

  /* Tactical Grid Background */
  .grid-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
    pointer-events: none;
  }

  /* Canvas Layer */
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
    cursor: crosshair;
  }

  /* UI Overlay Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px;
    box-sizing: border-box;
  }

  /* Header & Legend Layout */
  header {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    pointer-events: auto;
    gap: 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .brand-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
  }

  .brand-text h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin: 0;
    color: #fff;
    text-transform: uppercase;
  }

  .brand-text p {
    font-size: 12px;
    color: var(--text-secondary);
    margin: 0;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Legend Panel (Top Left under Title) */
  .legend-panel {
    display: flex;
    gap: 20px;
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border-light);
    padding: 12px 20px;
    border-radius: 6px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text-secondary);
  }

  .indicator {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    box-shadow: 0 0 8px currentColor;
  }

  /* Inspector Panel (Bottom Right) */
  .inspector-panel {
    align-self: flex-end;
    width: 260px;
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border-light);
    border-radius: 8px;
    padding: 20px;
    pointer-events: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    transition: transform 0.2s ease;
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border-light);
    padding-bottom: 8px;
  }

  .panel-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-secondary);
    font-weight: 700;
  }

  .status-badge {
    font-size: 10px;
    padding: 2px 6px;
    background: rgba(6, 182, 212, 0.2);
    color: var(--accent-cyan);
    border-radius: 4px;
    border: 1px solid rgba(6, 182, 212, 0.3);
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 13px;
  }

  .stat-label { color: var(--text-secondary); }
  .stat-value { font-family: 'SF Mono', 'Roboto Mono', monospace; font-weight: 500; color: #fff; }

  .health-container {
    margin-top: 4px;
    margin-bottom: 16px;
  }

  .health-bar-bg {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: hidden;
  }

  .health-fill {
    height: 100%;
    background: var(--accent-cyan);
    width: 100%;
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
  }

  .controls {
    display: flex;
    gap: 10px;
  }

  .btn {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border-light);
    color: var(--text-secondary);
    padding: 8px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    border-radius: 4px;
  }

  .btn:hover {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border-color: rgba(255,255,255,0.3);
  }

  /* Instructions (Bottom Left) */
  .instructions {
    align-self: flex-start;
    margin-bottom: 0;
    font-size: 12px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .key-group {
    display: flex;
    gap: 4px;
  }

  .key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 4px;
    color: #fff;
    font-weight: 600;
    font-size: 10px;
    box-shadow: 0 2px 0 rgba(0,0,0,0.3);
  }

</style>
</head>
<body>

  <div class="grid-bg"></div>
  <canvas id="arena"></canvas>

  <div class="ui-layer">
    <header>
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Neural Tactics</h1>
          <p>AI Behavior Demonstration</p>
        </div>
      </div>

      <!-- Legend moved to Top Left under title -->
      <div class="legend-panel">
        <div class="legend-item">
          <div class="indicator" style="color: var(--accent-blue); background: var(--accent-blue);"></div>
          PATROL
        </div>
        <div class="legend-item">
          <div class="indicator" style="color: var(--accent-amber); background: var(--accent-amber);"></div>
          ALERT
        </div>
        <div class="legend-item">
          <div class="indicator" style="color: var(--accent-red); background: var(--accent-red);"></div>
          CHASE
        </div>
        <div class="legend-item">
          <div class="indicator" style="color: #fff; background: #fff;"></div>
          ATTACK
        </div>
      </div>
    </header>

    <!-- Instructions Bottom Left -->
    <div class="instructions">
      <div class="key-group">
        <div class="key">W</div>
        <div class="key">A</div>
        <div class="key">S</div>
        <div class="key">D</div>
      </div>
      <span>to move agent</span>
    </div>

    <!-- Inspector moved to Bottom Right -->
    <div class="inspector-panel">
      <div class="panel-header">
        <div class="panel-title">Player Inspector</div>
        <div class="status-badge">ACTIVE</div>
      </div>
      
      <div class="stat-row">
        <span class="stat-label">Integrity</span>
        <span class="stat-value" id="hp-val">100%</span>
      </div>
      <div class="health-container">
        <div class="health-bar-bg">
          <div class="health-fill" id="hp-bar"></div>
        </div>
      </div>

      <div class="stat-row">
        <span class="stat-label">Coordinates</span>
        <span class="stat-value" id="pos-val">0, 0</span>
      </div>

      <div class="stat-row">
        <span class="stat-label">Velocity</span>
        <span class="stat-value" id="vel-val">0.0</span>
      </div>

      <div class="controls">
        <div class="btn" id="btn-reset">Reset Simulation</div>
      </div>
    </div>
  </div>

<script>
/**
 * ENGINE & LOGIC
 */
const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d');
const ui = {
  hpVal: document.getElementById('hp-val'),
  hpBar: document.getElementById('hp-bar'),
  posVal: document.getElementById('pos-val'),
  velVal: document.getElementById('vel-val'),
  resetBtn: document.getElementById('btn-reset')
};

// Configuration
const COLORS = {
  PATROL: '#38bdf8', // Cyan/Blue
  ALERT: '#fbbf24',  // Amber
  CHASE: '#f43f5e',  // Red
  ATTACK: '#ffffff', // White
  PLAYER: '#06b6d4', // Cyan
  WALL_FILL: '#0f172a',
  WALL_STROKE: '#38bdf8' // Bright Rim Light
};

const STATES = {
  PATROL: 'PATROL',
  ALERT: 'ALERT',
  CHASE: 'CHASE',
  ATTACK: 'ATTACK'
};

// Game State
let width, height;
let player = { x: 0, y: 0, radius: 14, hp: 100, speed: 4.5, trail: [] };
let enemies = [];
let walls = [];
let keys = {};

// Initialize
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  initWorld();
}

function initWorld() {
  // Player start
  player.x = width * 0.15;
  player.y = height * 0.5;
  player.hp = 100;
  player.trail = [];

  // Walls - Creating a tactical arena layout
  const w = width;
  const h = height;
  walls = [
    { x: w * 0.3, y: h * 0.2, w: 20, h: h * 0.4 },
    { x: w * 0.6, y: h * 0.4, w: 20, h: h * 0.4 },
    { x: w * 0.4, y: h * 0.5, w: 150, h: 20 },
    { x: w * 0.15, y: h * 0.15, w: 120, h: 120 }, 
    { x: w * 0.75, y: h * 0.7, w: 120, h: 120 },
  ];

  // Enemies - CRITIQUE POINT: Force states
  enemies = [
    new Enemy(w * 0.5, h * 0.15, STATES.PATROL),
    new Enemy(w * 0.8, h * 0.8, STATES.PATROL),
    new Enemy(w * 0.85, h * 0.2, STATES.CHASE), // Forced Chase
    new Enemy(w * 0.15, h * 0.8, STATES.PATROL),
    new Enemy(w * 0.5, h * 0.9, STATES.ATTACK), // Forced Attack
  ];
}

class Enemy {
  constructor(x, y, state) {
    this.x = x;
    this.y = y;
    this.radius = 12;
    this.angle = 0;
    this.state = state;
    this.speed = 2.8;
    this.trail = []; // Motion trail
    
    // Patrol Logic
    this.patrolPath = [];
    this.generatePatrolPath();
    this.patrolIndex = 0;
    
    // Alert Logic
    this.alertTimer = 0;
    this.alertPos = {x: 0, y: 0};

    // Attack Logic
    this.attackCooldown = 0;
    
    // Random offset for natural movement
    this.wobble = Math.random() * 100;
  }

  generatePatrolPath() {
    const points = 5;
    for(let i=0; i<points; i++) {
      this.patrolPath.push({
        x: Math.random() * (width - 100) + 50,
        y: Math.random() * (height - 100) + 50
      });
    }
  }

  update() {
    const distToPlayer = Math.hypot(player.x - this.x, player.y - this.y);
    const angleToPlayer = Math.atan2(player.y - this.y, player.x - this.x);
    
    // Raycasting for Vision
    let canSeePlayer = false;
    // Vision range
    const visionRange = 280;
    
    if (distToPlayer < visionRange) {
      let angleDiff = angleToPlayer - this.angle;
      while (angleDiff <= -Math.PI) angleDiff += Math.PI*2;
      while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
      
      // FOV 75 degrees
      if (Math.abs(angleDiff) < Math.PI / 2.5) {
        canSeePlayer = !checkWallCollision(this.x, this.y, player.x, player.y);
      }
    }

    // State Machine
    switch(this.state) {
      case STATES.PATROL:
        // Move to next waypoint
        let target = this.patrolPath[this.patrolIndex];
        this.angle = Math.atan2(target.y - this.y, target.x - this.x);
        this.moveTowards(target.x, target.y);
        
        // Check if reached waypoint
        if (Math.hypot(target.x - this.x, target.y - this.y) < 10) {
          this.patrolIndex = (this.patrolIndex + 1) % this.patrolPath.length;
        }

        if (distToPlayer < visionRange && canSeePlayer) {
          this.state = STATES.ALERT;
          this.alertTimer = 45; 
          this.alertPos = {x: player.x, y: player.y};
        }
        break;

      case STATES.ALERT:
        this.angle = angleToPlayer;
        this.alertTimer--;
        if (this.alertTimer <= 0) {
          if (canSeePlayer) this.state = STATES.CHASE;
          else this.state = STATES.PATROL;
        }
        break;

      case STATES.CHASE:
        this.angle = angleToPlayer;
        this.speed = 3.5; // Move faster
        if (canSeePlayer) {
          if (distToPlayer < 45) {
            this.state = STATES.ATTACK;
            this.speed = 2.8;
          } else {
            this.moveTowards(player.x, player.y);
          }
        } else {
          this.state = STATES.ALERT;
          this.alertTimer = 60;
          this.speed = 2.8;
        }
        break;

      case STATES.ATTACK:
        this.angle = angleToPlayer;
        this.attackCooldown--;
        if (this.attackCooldown <= 0) {
          player.hp -= 5;
          this.attackCooldown = 40;
          createParticle(player.x, player.y, COLORS.ATTACK);
        }
        if (distToPlayer > 180) {
          this.state = STATES.CHASE;
        }
        break;
    }

    // Update Motion Trail
    this.trail.push({x: this.x, y: this.y, age: 1.0});
    if (this.trail.length > 10) this.trail.shift();
    this.trail.forEach(t => t.age -= 0.1);
  }

  moveTowards(tx, ty) {
    const dx = tx - this.x;
    const dy = ty - this.y;
    const dist = Math.hypot(dx, dy);
    
    if (dist > 0) {
      let nx = (dx / dist) * this.speed;
      let ny = (dy / dist) * this.speed;
      
      // Wall Collision
      if (!checkCircleWallCollision(this.x + nx, this.y + ny, this.radius)) {
        this.x += nx;
        this.y += ny;
      } else {
        // Slide
        if (!checkCircleWallCollision(this.x + nx, this.y, this.radius)) this.x += nx;
        else if (!checkCircleWallCollision(this.x, this.y + ny, this.radius)) this.y += ny;
      }
    }
  }

  draw() {
    ctx.save();
    
    // 1. Draw Motion Trail
    if (this.trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (let i = 1; i < this.trail.length; i++) {
        ctx.lineTo(this.trail[i].x, this.trail[i].y);
      }
      ctx.strokeStyle = this.getColor();
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.3;
      ctx.stroke();
      ctx.globalAlpha = 1.0;
    }

    // 2. Draw Detection Cone (Semi-transparent)
    // Only draw full cone if not patrolling, or dimmer if patrolling
    if (this.state !== STATES.PATROL) {
      ctx.fillStyle = this.state === STATES.CHASE ? 'rgba(244, 63, 94, 0.2)' : 'rgba(251, 191, 36, 0.2)';
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      ctx.arc(this.x, this.y, 280, this.angle - Math.PI/2.5, this.angle + Math.PI/2.5);
      ctx.lineTo(this.x, this.y);
      ctx.fill();
    }

    // 3. Draw Entity
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);

    // Body Shape (Triangle/Arrow)
    ctx.fillStyle = this.getColor();
    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.lineTo(-10, 9);
    ctx.lineTo(-6, 0);
    ctx.lineTo(-10, -9);
    ctx.closePath();
    ctx.fill();
    
    // Inner Glow/Highlight
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = 0.4;
    ctx.beginPath();
    ctx.moveTo(5, 0);
    ctx.lineTo(-2, 3);
    ctx.lineTo(-2, -3);
    ctx.fill();
    ctx.globalAlpha = 1.0;

    ctx.restore();

    // 4. Draw State Label
    ctx.fillStyle = this.getColor();
    ctx.font = 'bold 10px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(this.state, this.x, this.y - 24);
    
    // Draw ID
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '9px monospace';
    ctx.fillText(`ID:${Math.floor(this.wobble)}`, this.x, this.y - 16);
  }

  getColor() {
    switch(this.state) {
      case STATES.PATROL: return COLORS.PATROL;
      case STATES.ALERT: return COLORS.ALERT;
      case STATES.CHASE: return COLORS.CHASE;
      case STATES.ATTACK: return COLORS.ATTACK;
      default: return '#fff';
    }
  }
}

// Helpers
function checkWallCollision(x1, y1, x2, y2) {
  for (let w of walls) {
    // Check line intersection with AABB
    // Simplified: Check if start and end are on opposite sides of wall rects
    // For better accuracy we'd use Liang-Barsky, but this suffices for demo
    if (x1 < w.x + w.w && x2 > w.x && y1 < w.y + w.h && y2 > w.y) return true;
    if (x2 < w.x + w.w && x1 > w.x && y2 < w.y + w.h && y1 > w.y) return true;
  }
  return false;
}

function checkCircleWallCollision(x, y, r) {
  for (let w of walls) {
    let testX = x;
    let testY = y;

    if (x < w.x) testX = w.x;
    else if (x > w.x + w.w) testX = w.x + w.w;

    if (y < w.y) testY = w.y;
    else if (y > w.y + w.h) testY = w.y + w.h;

    let distX = x - testX;
    let distY = y - testY;
    let distance = Math.sqrt((distX*distX) + (distY*distY));

    if (distance <= r) return true;
  }
  return false;
}

let particles = [];
function createParticle(x, y, color) {
  for(let i=0; i<3; i++) {
    particles.push({
      x: x + (Math.random()-0.5)*10, 
      y: y + (Math.random()-0.5)*10, 
      vx: (Math.random()-0.5)*2,
      vy: (Math.random()-0.5)*2,
      color: color, 
      life: 30, 
      size: Math.random() * 3 + 1
    });
  }
}

// Input Handling
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('resize', resize);
ui.resetBtn.addEventListener('click', initWorld);

// Main Loop
function loop() {
  ctx.clearRect(0, 0, width, height);

  // Update Player
  let dx = 0, dy = 0;
  if (keys['w']) dy = -1;
  if (keys['s']) dy = 1;
  if (keys['a']) dx = -1;
  if (keys['d']) dx = 1;

  if (dx !== 0 || dy !== 0) {
    let len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    
    let nextX = player.x + dx * player.speed;
    let nextY = player.y + dy * player.speed;
    
    if (!checkCircleWallCollision(nextX, player.y, player.radius)) player.x = nextX;
    if (!checkCircleWallCollision(player.x, nextY, player.radius)) player.y = nextY;
    
    // Add to player trail
    player.trail.push({x: player.x, y: player.y, age: 1.0});
    if (player.trail.length > 20) player.trail.shift();
  }
  player.trail.forEach(t => t.age -= 0.05);

  // Draw Walls (Tactical Style: Dark fill, Bright Rim)
  for (let w of walls) {
    ctx.fillStyle = COLORS.WALL_FILL;
    ctx.fillRect(w.x, w.y, w.w, w.h);
    
    // Rim Light
    ctx.strokeStyle = COLORS.WALL_STROKE;
    ctx.lineWidth = 2;
    ctx.shadowColor = COLORS.WALL_STROKE;
    ctx.shadowBlur = 10;
    ctx.strokeRect(w.x, w.y, w.w, w.h);
    ctx.shadowBlur = 0; // Reset
  }

  // Draw Player Trail
  if (player.trail.length > 1) {
    ctx.beginPath();
    ctx.moveTo(player.trail[0].x, player.trail[0].y);
    for (let i = 1; i < player.trail.length; i++) {
      ctx.lineTo(player.trail[i].x, player.trail[i].y);
    }
    ctx.strokeStyle = COLORS.PLAYER;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // Gradient fade for trail
    ctx.globalAlpha = 0.4;
    ctx.stroke();
    ctx.globalAlpha = 1.0;
  }

  // Update & Draw Enemies
  for (let e of enemies) {
    e.update();
    e.draw();
  }

  // Draw Player (Distinct Shape: Glowing Ring)
  ctx.save();
  ctx.translate(player.x, player.y);
  
  // Outer Glow Ring
  ctx.shadowColor = COLORS.PLAYER;
  ctx.shadowBlur = 15;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
  ctx.stroke();
  
  // Inner Fill
  ctx.fillStyle = COLORS.PLAYER;
  ctx.globalAlpha = 0.2;
  ctx.beginPath();
  ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1.0;
  
  // Center Dot
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, 0, 3, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.restore();

  // Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 30;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  ctx.globalAlpha = 1;

  // Update UI
  ui.posVal.textContent = `${Math.round(player.x)}, ${Math.round(player.y)}`;
  let speed = Math.hypot(keys['w']?1:0 + (keys['s']?1:0), keys['a']?1:0 + (keys['d']?1:0));
  ui.velVal.textContent = (speed * player.speed).toFixed(1);
  
  ui.hpVal.textContent = Math.max(0, player.hp) + '%';
  ui.hpBar.style.width = Math.max(0, player.hp) + '%';
  if (player.hp < 30) ui.hpBar.style.backgroundColor = COLORS.CHASE;
  else ui.hpBar.style.backgroundColor = COLORS.PLAYER;

  requestAnimationFrame(loop);
}

// Start
resize();
loop();

</script>
</body>
</html>
