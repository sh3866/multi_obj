<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Architecture & Data Flow</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --border-color: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            
            /* Flow Colors */
            --accent-data: #38bdf8;   /* Cyan */
            --accent-instr: #a78bfa;  /* Violet */
            --accent-control: #34d399; /* Emerald */
            --accent-io: #fbbf24;     /* Amber */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            background: var(--bg-color);
            z-index: 10;
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 0.05em;
        }

        /* Legend */
        .legend {
            display: flex;
            gap: 2rem;
            font-size: 0.75rem;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Main Diagram Area */
        main {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Subtle grid background */
            background-image: 
                linear-gradient(rgba(51, 65, 85, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(51, 65, 85, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            overflow: hidden;
        }

        /* SVG Layer */
        svg#diagram {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        /* Base Component Styles */
        .component {
            position: absolute;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            text-align: center;
            transition: transform 0.3s ease, border-color 0.3s ease;
            z-index: 2;
            /* Minimalist styling */
            box-shadow: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .component:hover {
            border-color: var(--text-secondary);
            transform: scale(1.02);
            z-index: 3;
        }

        .component-icon {
            font-size: 1.2rem;
            display: block;
            opacity: 0.8;
        }

        .component-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-primary);
            display: block;
            letter-spacing: 0.02em;
        }

        .component-desc {
            font-size: 0.65rem;
            color: var(--text-secondary);
            display: block;
            font-family: 'Courier New', monospace;
        }

        /* --- HIERARCHY & SHAPES --- */

        /* 1. CPU: Center, Large (1.5x scale approx) */
        #cpu {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 100px;
            border-width: 2px;
            border-color: var(--text-primary);
            z-index: 10;
        }
        #cpu .component-icon { font-size: 2rem; }
        #cpu .component-label { font-size: 1.1rem; }

        /* 2. Internal Hardware: Rounded Rectangles */
        .shape-rect {
            border-radius: 8px;
            width: 120px;
            height: 80px;
        }

        /* 3. External/Peripherals: Pill Shapes */
        .shape-pill {
            border-radius: 50px; /* Pill shape */
            width: 130px;
            height: 60px;
            border-style: dashed; /* Dashed border to further distinguish peripherals */
            border-width: 1px;
        }

        /* Positioning (Radial Layout handled by specific top/left %) */
        /* Top */
        #gpu { top: 15%; left: 50%; transform: translate(-50%, -50%); }
        /* Bottom */
        #storage { top: 85%; left: 50%; transform: translate(-50%, -50%); }
        /* Left */
        #ram { top: 50%; left: 15%; transform: translate(-50%, -50%); }
        /* Right */
        #network { top: 50%; left: 85%; transform: translate(-50%, -50%); }
        
        /* Diagonals */
        #input { top: 20%; left: 20%; transform: translate(-50%, -50%); }
        #output { top: 80%; left: 80%; transform: translate(-50%, -50%); }

        /* SVG Line Styles */
        .flow-line {
            fill: none;
            stroke-width: 3px;
            stroke-linecap: round;
            /* Dashed for flow animation */
            stroke-dasharray: 15, 10; 
            animation: flow 1s linear infinite;
        }

        .static-line {
            fill: none;
            stroke-width: 1px;
            stroke: rgba(255, 255, 255, 0.05);
        }

        /* Animation */
        @keyframes flow {
            to { stroke-dashoffset: -25; }
        }

        .flow-slow { animation-duration: 2s; }
        .flow-fast { animation-duration: 0.7s; }

    </style>
</head>
<body>

    <header>
        <div>
            <h1>System Architecture</h1>
            <div class="subtitle">Information Flow & Component Hierarchy</div>
        </div>
        <div class="legend">
            <div class="legend-item"><div class="dot" style="background: var(--accent-data);"></div> Data</div>
            <div class="legend-item"><div class="dot" style="background: var(--accent-instr);"></div> Instructions</div>
            <div class="legend-item"><div class="dot" style="background: var(--accent-control);"></div> Control</div>
            <div class="legend-item"><div class="dot" style="background: var(--accent-io);"></div> I/O Stream</div>
        </div>
    </header>

    <main>
        <!-- SVG Layer for connections -->
        <svg id="diagram" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Arrow Markers for each color -->
                <marker id="arrow-data" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="var(--accent-data)" />
                </marker>
                <marker id="arrow-instr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="var(--accent-instr)" />
                </marker>
                <marker id="arrow-control" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="var(--accent-control)" />
                </marker>
                <marker id="arrow-io" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="var(--accent-io)" />
                </marker>
            </defs>
            
            <!-- Paths will be drawn here by JS -->
            <g id="connections"></g>
        </svg>

        <!-- HTML Layer for Components -->
        
        <!-- Peripherals (Pill Shapes) -->
        <div id="input" class="component shape-pill">
            <span class="component-icon">⌨️</span>
            <span class="component-label">Input</span>
            <span class="component-desc">User Events</span>
        </div>

        <div id="output" class="component shape-pill">
            <span class="component-icon">🖥️</span>
            <span class="component-label">Output</span>
            <span class="component-desc">Display</span>
        </div>

        <!-- Internal Hardware (Rect Shapes) -->
        <div id="gpu" class="component shape-rect">
            <span class="component-icon">🎮</span>
            <span class="component-label">GPU</span>
            <span class="component-desc">Graphics</span>
        </div>

        <div id="ram" class="component shape-rect">
            <span class="component-icon">📊</span>
            <span class="component-label">Memory</span>
            <span class="component-desc">RAM</span>
        </div>

        <div id="network" class="component shape-rect">
            <span class="component-icon">🌐</span>
            <span class="component-label">Network</span>
            <span class="component-desc">NIC</span>
        </div>

        <div id="storage" class="component shape-rect">
            <span class="component-icon">💾</span>
            <span class="component-label">Storage</span>
            <span class="component-desc">SSD/HDD</span>
        </div>

        <!-- Central Component (CPU) -->
        <div id="cpu" class="component">
            <span class="component-icon">🧠</span>
            <span class="component-label">CPU</span>
            <span class="component-desc">Central Logic</span>
        </div>

    </main>

    <script>
        // Configuration for connections
        // Types: 'data', 'instruction', 'control', 'io'
        const connections = [
            { from: 'storage', to: 'ram', type: 'data', speed: 'flow-slow' },
            { from: 'ram', to: 'cpu', type: 'instruction', speed: 'flow-fast' },
            { from: 'cpu', to: 'ram', type: 'control', speed: 'flow-slow' },
            { from: 'cpu', to: 'gpu', type: 'data', speed: 'flow-fast' },
            { from: 'gpu', to: 'output', type: 'io', speed: 'flow-fast' },
            { from: 'input', to: 'cpu', type: 'io', speed: 'flow-fast' },
            { from: 'network', to: 'cpu', type: 'data', speed: 'flow-slow' },
            { from: 'cpu', to: 'network', type: 'data', speed: 'flow-slow' },
            { from: 'cpu', to: 'storage', type: 'control', speed: 'flow-slow' }
        ];

        const svg = document.getElementById('diagram');
        const g = document.getElementById('connections');

        // Color map
        const colors = {
            'data': 'var(--accent-data)',
            'instruction': 'var(--accent-instr)',
            'control': 'var(--accent-control)',
            'io': 'var(--accent-io)'
        };

        function getCenter(element) {
            const rect = element.getBoundingClientRect();
            const mainRect = document.querySelector('main').getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2 - mainRect.left,
                y: rect.top + rect.height / 2 - mainRect.top
            };
        }

        function drawConnections() {
            // Clear existing paths
            g.innerHTML = '';

            connections.forEach(conn => {
                const startEl = document.getElementById(conn.from);
                const endEl = document.getElementById(conn.to);
                
                if (!startEl || !endEl) return;

                const start = getCenter(startEl);
                const end = getCenter(endEl);

                // Calculate Bezier Control Point
                // We want smooth curves. 
                // For radial layout, a slight curve towards the center or away adds depth.
                // Here we use a quadratic curve with a control point offset from the midpoint.
                const midX = (start.x + end.x) / 2;
                const midY = (start.y + end.y) / 2;
                
                // Offset logic to make lines curve nicely instead of straight
                // Adding a perpendicular offset creates an arc
                const dx = end.x - start.x;
                const dy = end.y - start.y;
                
                // Rotate vector 90 degrees and scale
                const offsetScale = 0.2; // How curvy
                const cpX = midX - (dy * offsetScale);
                const cpY = midY + (dx * offsetScale);

                const d = `M ${start.x} ${start.y} Q ${cpX} ${cpY} ${end.x} ${end.y}`;

                // 1. Background track (faint solid line for clarity)
                const trackPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
                trackPath.setAttribute("d", d);
                trackPath.setAttribute("class", "static-line");
                g.appendChild(trackPath);

                // 2. Animated flow line (Thicker, Solid stroke, Dashed array)
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", d);
                path.setAttribute("class", `flow-line ${conn.speed}`);
                path.setAttribute("stroke", colors[conn.type]);
                path.setAttribute("stroke-opacity", "0.9");
                
                // Add Arrowhead
                path.setAttribute("marker-end", `url(#arrow-${conn.type})`);
                
                g.appendChild(path);
            });
        }

        // Initial Draw
        // Use requestAnimationFrame to ensure DOM is rendered before calculating positions
        requestAnimationFrame(() => {
            drawConnections();
        });

        // Redraw on resize
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(drawConnections, 100);
        });

    </script>
</body>
</html>
