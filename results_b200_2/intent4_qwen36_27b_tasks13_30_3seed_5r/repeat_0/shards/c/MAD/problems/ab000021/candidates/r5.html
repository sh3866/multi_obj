<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Architecture: Cyber-Industrial View</title>
    <style>
        :root {
            /* Cyber-Industrial Palette */
            --bg-void: #050505;
            --bg-grid: #0a0a0a;
            
            /* Node Colors */
            --node-bg: #000000;
            --node-stroke: #333333;
            --node-highlight: #555555;
            
            /* CPU "Die" Colors */
            --cpu-base: #1a1a1a;
            --cpu-die: #e0e0e0;
            --cpu-glow: rgba(255, 255, 255, 0.15);
            
            /* Signal Colors (High Saturation) */
            --color-data: #00f0ff;    /* Cyan - Data */
            --color-instr: #d946ef;   /* Fuchsia - Instructions */
            --color-ctrl: #10b981;    /* Emerald - Control */
            --color-io: #f43f5e;      /* Coral - I/O */

            /* Typography */
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-void);
            color: #e2e8f0;
            font-family: var(--font-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Background Pattern */
        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-image: 
                linear-gradient(var(--bg-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.3;
            pointer-events: none;
        }

        /* Header & Integrated Legend */
        header {
            padding: 1.5rem 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            position: relative;
            z-index: 10;
            background: linear-gradient(to bottom, var(--bg-void), transparent);
        }

        .title-group {
            margin-bottom: 1rem;
        }

        .title-group h1 {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #fff;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .title-group p {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Inline Legend */
        .legend-row {
            display: flex;
            gap: 2rem;
            align-items: center;
            border-left: 2px solid #333;
            padding-left: 1rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .legend-line {
            width: 24px;
            height: 0;
            border-top-width: 2px;
            border-top-style: solid;
        }

        /* Main Diagram Area */
        main {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* SVG Layer */
        svg#diagram {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        /* --- COMPONENT BASE STYLES --- */
        .component {
            position: absolute;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            width: 140px;
            height: 90px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .component:hover {
            transform: scale(1.05);
            z-index: 20;
        }

        /* Typography */
        .comp-label {
            font-weight: 700;
            font-size: 0.9rem;
            color: #fff;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .comp-sub {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: #94a3b8;
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 2px;
        }

        /* --- PERIPHERAL NODE STYLES (Chassis) --- */
        .node-chassis {
            background: var(--node-bg);
            border: 1px solid var(--node-stroke);
            box-shadow: 0 0 0 1px #000, 0 10px 30px -10px rgba(0,0,0,0.8);
        }

        /* Specific Peripheral Visuals */
        .node-chassis::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            border: 1px solid transparent;
            transition: border-color 0.3s;
        }

        .component:hover .node-chassis::before {
            border-color: var(--node-highlight);
        }

        /* Memory: Stacked Layer look */
        #ram .node-chassis {
            border-radius: 2px;
        }
        #ram::after {
            content: '';
            position: absolute;
            width: 80%;
            height: 2px;
            background: #333;
            top: 25%;
            box-shadow: 0 12px 0 #333, 0 24px 0 #333;
        }

        /* Storage: Solid Block look */
        #storage .node-chassis {
            border-radius: 4px;
            border-bottom: 4px solid #222;
        }

        /* Network: Antenna look */
        #network .node-chassis {
            border-radius: 4px;
        }

        /* Input/Output: Rounded corners */
        #input .node-chassis, #output .node-chassis {
            border-radius: 8px;
        }

        /* --- CPU (The Anchor) --- */
        #cpu {
            width: 220px;
            height: 220px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        #cpu:hover {
            transform: translate(-50%, -50%) scale(1.05);
        }

        /* The CPU Die Container */
        .cpu-die {
            position: absolute;
            inset: 0;
            background: var(--cpu-base);
            /* Chamfered Hexagon Shape */
            clip-path: polygon(20% 0%, 80% 0%, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0% 80%, 0% 20%);
            border: 2px solid #444;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            box-shadow: 0 0 50px var(--cpu-glow);
            transition: box-shadow 0.3s;
        }

        #cpu:hover .cpu-die {
            box-shadow: 0 0 80px rgba(255, 255, 255, 0.3);
            border-color: #888;
        }

        /* The Inner Gold/Silver Core */
        .cpu-core {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #d4d4d4, #ffffff);
            clip-path: polygon(20% 0%, 80% 0%, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0% 80%, 0% 20%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }

        /* Circuit Details on CPU */
        .cpu-trace {
            position: absolute;
            background: #999;
        }
        .trace-h { height: 1px; width: 100%; left: 0; }
        .trace-v { width: 1px; height: 100%; top: 0; }
        
        .cpu-label {
            font-weight: 900;
            font-size: 1.5rem;
            color: #111;
            letter-spacing: 0.05em;
            z-index: 2;
        }
        .cpu-sub {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: #555;
            z-index: 2;
            margin-top: 4px;
        }

        /* --- CONNECTOR STYLES --- */
        
        /* Base Track (Dark background for lines) */
        .track-line {
            fill: none;
            stroke: #1a1a1a;
            stroke-width: 6px;
            stroke-linejoin: round;
            stroke-linecap: round;
            opacity: 0.6;
        }

        /* Data: Solid, Cyan */
        .flow-data {
            fill: none;
            stroke: var(--color-data);
            stroke-width: 2px;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 4px var(--color-data));
        }

        /* Control: Dashed, Emerald */
        .flow-control {
            fill: none;
            stroke: var(--color-ctrl);
            stroke-width: 2px;
            stroke-dasharray: 8, 6;
            stroke-linecap: butt;
            filter: drop-shadow(0 0 4px var(--color-ctrl));
        }

        /* Instructions: Dotted, Fuchsia */
        .flow-instruction {
            fill: none;
            stroke: var(--color-instr);
            stroke-width: 2px;
            stroke-dasharray: 1, 5; /* Dotted */
            stroke-linecap: round;
            filter: drop-shadow(0 0 4px var(--color-instr));
        }

        /* I/O: Solid, Coral */
        .flow-io {
            fill: none;
            stroke: var(--color-io);
            stroke-width: 2px;
            stroke-linecap: round;
            filter: drop-shadow(0 0 4px var(--color-io));
        }

        /* Animation */
        @keyframes flowDash {
            to { stroke-dashoffset: -20; }
        }
        
        .animate-flow {
            animation: flowDash 1.5s linear infinite;
        }
        
        /* Pulse animation for Data */
        @keyframes pulseFlow {
            0% { stroke-opacity: 0.5; }
            50% { stroke-opacity: 1; }
            100% { stroke-opacity: 0.5; }
        }
        .animate-pulse {
            animation: pulseFlow 2s ease-in-out infinite;
        }

    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <header>
        <div class="title-group">
            <h1>System Architecture</h1>
            <p>Information Flow & Signal Distribution</p>
        </div>
        
        <div class="legend-row">
            <div class="legend-item">
                <div class="legend-line" style="border-color: var(--color-data);"></div> 
                <span>Data</span>
            </div>
            <div class="legend-item">
                <div class="legend-line" style="border-color: var(--color-instr); border-top-style: dotted;"></div> 
                <span>Instruction</span>
            </div>
            <div class="legend-item">
                <div class="legend-line" style="border-color: var(--color-ctrl); border-top-style: dashed;"></div> 
                <span>Control</span>
            </div>
            <div class="legend-item">
                <div class="legend-line" style="border-color: var(--color-io);"></div> 
                <span>I/O Stream</span>
            </div>
        </div>
    </header>

    <main>
        <!-- SVG Layer for connections & Zones -->
        <svg id="diagram" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Arrow Markers -->
                <marker id="arrow-data" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="var(--color-data)" />
                </marker>
                <marker id="arrow-instr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="var(--color-instr)" />
                </marker>
                <marker id="arrow-control" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="var(--color-ctrl)" />
                </marker>
                <marker id="arrow-io" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="var(--color-io)" />
                </marker>
            </defs>
            
            <g id="connections"></g>
        </svg>

        <!-- HTML Layer for Components -->

        <!-- Peripherals -->
        <div id="input" class="component">
            <div class="node-chassis"></div>
            <!-- Icon: Keyboard -->
            <svg style="position:absolute; width:24px; height:24px; stroke:#666; fill:none; stroke-width:1.5; z-index:2" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"/></svg>
            <span class="comp-label">Input</span>
            <span class="comp-sub">Events</span>
        </div>

        <div id="output" class="component">
            <div class="node-chassis"></div>
            <!-- Icon: Monitor -->
            <svg style="position:absolute; width:24px; height:24px; stroke:#666; fill:none; stroke-width:1.5; z-index:2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            <span class="comp-label">Output</span>
            <span class="comp-sub">Display</span>
        </div>

        <!-- Core / Internal -->
        <div id="gpu" class="component">
            <div class="node-chassis"></div>
            <!-- Icon: Chip -->
            <svg style="position:absolute; width:24px; height:24px; stroke:#666; fill:none; stroke-width:1.5; z-index:2" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></svg>
            <span class="comp-label">GPU</span>
            <span class="comp-sub">Render</span>
        </div>

        <div id="ram" class="component">
            <div class="node-chassis"></div>
            <!-- Icon: RAM -->
            <svg style="position:absolute; width:24px; height:24px; stroke:#666; fill:none; stroke-width:1.5; z-index:2" viewBox="0 0 24 24"><path d="M6 19v-3a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v3"/><rect x="4" y="5" width="16" height="10" rx="2"/><path d="M9 17v2M15 17v2M8 11h.01M12 11h.01M16 11h.01"/></svg>
            <span class="comp-label">Memory</span>
            <span class="comp-sub">RAM</span>
        </div>

        <div id="network" class="component">
            <div class="node-chassis"></div>
            <!-- Icon: Globe -->
            <svg style="position:absolute; width:24px; height:24px; stroke:#666; fill:none; stroke-width:1.5; z-index:2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <span class="comp-label">Network</span>
            <span class="comp-sub">NIC</span>
        </div>

        <div id="storage" class="component">
            <div class="node-chassis"></div>
            <!-- Icon: Database -->
            <svg style="position:absolute; width:24px; height:24px; stroke:#666; fill:none; stroke-width:1.5; z-index:2" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            <span class="comp-label">Storage</span>
            <span class="comp-sub">SSD</span>
        </div>

        <!-- Central Component (CPU) -->
        <div id="cpu" class="component">
            <div class="cpu-die">
                <div class="cpu-core">
                    <!-- Decorative internal traces -->
                    <div class="cpu-trace trace-h" style="top:30%"></div>
                    <div class="cpu-trace trace-h" style="bottom:30%"></div>
                    <div class="cpu-trace trace-v" style="left:30%"></div>
                    <div class="cpu-trace trace-v" style="right:30%"></div>
                    
                    <span class="cpu-label">CPU</span>
                    <span class="cpu-sub">LOGIC</span>
                </div>
            </div>
        </div>

    </main>

    <script>
        // Configuration for connections
        const connections = [
            { from: 'storage', to: 'ram', type: 'data', label: 'Load' },
            { from: 'ram', to: 'cpu', type: 'instruction', label: 'Fetch' }, // Key instruction flow
            { from: 'cpu', to: 'ram', type: 'control', label: 'Write' },     // Key control flow
            { from: 'cpu', to: 'gpu', type: 'data', label: 'Render Data' },
            { from: 'gpu', to: 'output', type: 'io', label: 'Signal' },
            { from: 'input', to: 'cpu', type: 'io', label: 'Interrupt' },
            { from: 'network', to: 'cpu', type: 'data', label: 'Packet In' },
            { from: 'cpu', to: 'network', type: 'data', label: 'Packet Out' },
            { from: 'cpu', to: 'storage', type: 'control', label: 'Persist' }
        ];

        const svg = document.getElementById('diagram');
        const gConn = document.getElementById('connections');

        function getCenter(element) {
            const rect = element.getBoundingClientRect();
            const mainRect = document.querySelector('main').getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2 - mainRect.left,
                y: rect.top + rect.height / 2 - mainRect.top,
                w: rect.width,
                h: rect.height
            };
        }

        function drawConnections() {
            gConn.innerHTML = '';

            connections.forEach(conn => {
                const startEl = document.getElementById(conn.from);
                const endEl = document.getElementById(conn.to);
                
                if (!startEl || !endEl) return;

                const start = getCenter(startEl);
                const end = getCenter(endEl);

                // Calculate Cubic Bezier Control Points
                // Logic: S-Curve for smoother flow between nodes
                const distX = end.x - start.x;
                const distY = end.y - start.y;
                
                // Adjust control point tension based on distance to keep lines taut but curved
                const tension = 0.5; 
                const cp1x = start.x + (distX * tension);
                const cp1y = start.y;
                const cp2x = end.x - (distX * tension);
                const cp2y = end.y;

                // Path Definition
                const d = `M ${start.x} ${start.y} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${end.x} ${end.y}`;

                // 1. Background track (Dark pipe)
                const trackPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
                trackPath.setAttribute("d", d);
                trackPath.setAttribute("class", "track-line");
                gConn.appendChild(trackPath);

                // 2. Animated flow line
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", d);
                
                // Class mapping
                let flowClass = '';
                let marker = `url(#arrow-${conn.type})`;
                
                if(conn.type === 'data') {
                    flowClass = 'flow-data animate-pulse';
                } else if(conn.type === 'control') {
                    flowClass = 'flow-control animate-flow';
                } else if(conn.type === 'instruction') {
                    flowClass = 'flow-instruction animate-flow';
                } else if(conn.type === 'io') {
                    flowClass = 'flow-io animate-flow';
                }
                
                path.setAttribute("class", flowClass);
                path.setAttribute("marker-end", marker);
                
                gConn.appendChild(path);
            });
        }

        // Initial Draw
        // Use requestAnimationFrame to ensure DOM is laid out before calculating positions
        requestAnimationFrame(() => {
            drawConnections();
        });

        // Redraw on resize
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                drawConnections();
            }, 100);
        });

    </script>
</body>
</html>
