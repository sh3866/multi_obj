<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Tactics: AI Visualization</title>
<style>
  :root {
    --bg-dark: #05080a;
    --grid-line: rgba(59, 130, 246, 0.08);
    --text-main: #e2e8f0;
    --text-dim: #64748b;
    --accent-blue: #3b82f6;
    --accent-green: #10b981;
    --accent-amber: #f59e0b;
    --accent-red: #ef4444;
    --panel-bg: rgba(15, 23, 42, 0.65);
    --panel-border: rgba(148, 163, 184, 0.15);
  }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
  }

  /* Background Grid Pattern - Lowered opacity */
  .grid-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
    pointer-events: none;
  }

  /* Canvas Layer */
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
    cursor: crosshair;
  }

  /* UI Overlay Container */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px;
    box-sizing: border-box;
  }

  /* Header & Legend Layout */
  .top-bar {
    display: flex;
    align-items: center;
    gap: 24px;
    pointer-events: auto;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-icon {
    width: 36px;
    height: 36px;
    background: var(--accent-blue);
    border-radius: 4px; /* Unified Geometry */
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
  }

  .brand-text h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin: 0;
    color: #fff;
  }

  .brand-text p {
    font-size: 11px;
    color: var(--text-dim);
    margin: 0;
  }

  /* Panels - Unified Geometry */
  .panel {
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 12px 16px;
    pointer-events: auto;
    box-shadow: 0 4px 24px rgba(0,0,0,0.2);
  }

  /* Legend Panel (Relocated Top Left) */
  .legend-panel {
    display: flex;
    flex-direction: row;
    gap: 16px;
    align-items: center;
    border-top: 1px solid var(--accent-blue); /* Visual anchor */
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text-main);
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 2px; /* Unified Geometry */
  }

  /* Inspector Panel (Bottom Left - Demoted) */
  .inspector-panel {
    width: 240px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: rgba(15, 23, 42, 0.4); /* Lower opacity */
    border: 1px solid rgba(148, 163, 184, 0.1); /* Subtler border */
  }

  .panel-title {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-bottom: 4px;
    font-weight: 700;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
  }

  .stat-label { color: var(--text-dim); }
  .stat-value { 
    font-family: 'Courier New', Courier, monospace; 
    font-weight: 700; 
    color: var(--text-main); 
    letter-spacing: -0.5px;
  }

  /* Health Bar - Outline/Subtle style */
  .health-bar-container {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.05);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 2px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .health-fill {
    height: 100%;
    background: var(--accent-green);
    width: 100%;
    transition: width 0.2s ease;
    /* Removed bright glow/shadow */
  }

  .controls {
    margin-top: 4px;
    display: flex;
    gap: 8px;
  }

  /* Button Style - Ghost/Subtle */
  .btn {
    flex: 1;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-dim);
    padding: 6px;
    font-size: 10px;
    text-transform: uppercase;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    border-radius: 2px;
  }

  .btn:hover {
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.3);
    color: #fff;
  }

  .btn.active {
    border-color: var(--accent-blue);
    color: var(--accent-blue);
    background: rgba(59, 130, 246, 0.05);
  }

  /* Instructions */
  .instructions {
    position: absolute;
    bottom: 24px;
    right: 24px;
    text-align: right;
    font-size: 11px;
    color: var(--text-dim);
    pointer-events: none;
  }
  .key {
    display: inline-block;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 2px 6px;
    border-radius: 2px;
    margin: 0 2px;
    color: var(--text-main);
    font-weight: 600;
    font-family: monospace;
  }

</style>
</head>
<body>

  <div class="grid-bg"></div>
  <canvas id="arena"></canvas>

  <div class="ui-layer">
    <header class="top-bar">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Neural Tactics</h1>
          <p>AI Behavior State Visualization</p>
        </div>
      </div>

      <!-- Legend Relocated Here -->
      <div class="panel legend-panel">
        <div class="legend-item"><div class="dot" style="background:var(--accent-blue)"></div>Patrol</div>
        <div class="legend-item"><div class="dot" style="background:var(--accent-amber)"></div>Alert</div>
        <div class="legend-item"><div class="dot" style="background:var(--accent-red)"></div>Chase</div>
        <div class="legend-item"><div class="dot" style="background:#fff; box-shadow:0 0 5px #fff"></div>Attack</div>
      </div>
    </header>

    <div style="display:flex; justify-content:space-between; align-items:flex-end;">
      <div class="panel inspector-panel">
        <div class="panel-title">Player Inspector</div>
        
        <div class="stat-row">
          <span class="stat-label">Health</span>
          <span class="stat-value" id="hp-val">100%</span>
        </div>
        <div class="health-bar-container">
          <div class="health-fill" id="hp-bar"></div>
        </div>

        <div class="stat-row">
          <span class="stat-label">Position</span>
          <span class="stat-value" id="pos-val">0, 0</span>
        </div>

        <div class="stat-row">
          <span class="stat-label">Velocity</span>
          <span class="stat-value" id="vel-val">0.0</span>
        </div>

        <div class="controls">
          <div class="btn active" id="btn-move">Move (WASD)</div>
          <div class="btn" id="btn-reset">Reset</div>
        </div>
      </div>

      <div class="instructions">
        Use <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> to move player<br>
        Observe AI state transitions
      </div>
    </div>
  </div>

<script>
/**
 * ENGINE & LOGIC
 */
const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d');
const ui = {
  hpVal: document.getElementById('hp-val'),
  hpBar: document.getElementById('hp-bar'),
  posVal: document.getElementById('pos-val'),
  velVal: document.getElementById('vel-val'),
  resetBtn: document.getElementById('btn-reset')
};

// Configuration
const COLORS = {
  PATROL: '#3b82f6',
  ALERT: '#f59e0b',
  CHASE: '#ef4444',
  ATTACK: '#ffffff',
  PLAYER: '#10b981',
  WALL: '#0f172a',
  WALL_BORDER: '#334155'
};

const STATES = {
  PATROL: 'PATROL',
  ALERT: 'ALERT',
  CHASE: 'CHASE',
  ATTACK: 'ATTACK'
};

// Game State
let width, height;
let player = { x: 0, y: 0, radius: 12, hp: 100, speed: 4 };
let enemies = [];
let walls = [];
let keys = {};

// Initialize
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  initWorld();
}

function initWorld() {
  // Player start
  player.x = width * 0.2;
  player.y = height * 0.5;
  player.hp = 100;

  // Walls
  walls = [
    { x: width * 0.4, y: height * 0.2, w: 20, h: height * 0.3 },
    { x: width * 0.6, y: height * 0.5, w: 20, h: height * 0.3 },
    { x: width * 0.5, y: height * 0.5, w: 150, h: 20 },
    { x: width * 0.2, y: height * 0.2, w: 100, h: 100 }, // Box
    { x: width * 0.75, y: height * 0.2, w: 100, h: 100 }, // Box
  ];

  // Enemies - State Diversity: 2 Patrol, 1 Chase, 1 Alert, 1 Attack
  enemies = [
    new Enemy(width * 0.5, height * 0.1, STATES.PATROL),
    new Enemy(width * 0.8, height * 0.8, STATES.PATROL),
    new Enemy(width * 0.85, height * 0.2, STATES.CHASE), // State Diversity
    new Enemy(width * 0.15, height * 0.8, STATES.ALERT), // State Diversity
    new Enemy(width * 0.5, height * 0.9, STATES.ATTACK),  // State Diversity
  ];
}

class Enemy {
  constructor(x, y, state) {
    this.x = x;
    this.y = y;
    this.radius = 10;
    this.angle = 0;
    this.state = state;
    this.speed = 2.5;
    
    // Patrol Logic
    this.patrolTarget = this.getRandomPatrolPoint();
    this.patrolTimer = 0;
    
    // Alert Logic
    this.alertTimer = 0;
    this.alertPos = {x: 0, y: 0};

    // Attack Logic
    this.attackCooldown = 0;
    
    // Visual pulse for Attack
    this.pulse = 0;
  }

  getRandomPatrolPoint() {
    return {
      x: Math.random() * (width - 100) + 50,
      y: Math.random() * (height - 100) + 50
    };
  }

  update() {
    const distToPlayer = Math.hypot(player.x - this.x, player.y - this.y);
    const angleToPlayer = Math.atan2(player.y - this.y, player.x - this.x);
    
    // Raycasting for Vision
    let canSeePlayer = false;
    if (distToPlayer < 250) {
      // Check if within FOV (90 degrees)
      let angleDiff = angleToPlayer - this.angle;
      // Normalize angle
      while (angleDiff <= -Math.PI) angleDiff += Math.PI*2;
      while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
      
      if (Math.abs(angleDiff) < Math.PI / 3) {
        // Check walls
        canSeePlayer = !checkWallCollision(this.x, this.y, player.x, player.y);
      }
    }

    // State Machine
    switch(this.state) {
      case STATES.PATROL:
        this.angle = Math.atan2(this.patrolTarget.y - this.y, this.patrolTarget.x - this.x);
        this.moveTowards(this.patrolTarget.x, this.patrolTarget.y);
        
        if (distToPlayer < 250 && canSeePlayer) {
          this.state = STATES.ALERT;
          this.alertTimer = 60; // Frames to wait
          this.alertPos = {x: player.x, y: player.y};
        } else if (Math.hypot(this.patrolTarget.x - this.x, this.patrolTarget.y - this.y) < 5) {
          this.patrolTarget = this.getRandomPatrolPoint();
        }
        break;

      case STATES.ALERT:
        this.angle = angleToPlayer;
        this.alertTimer--;
        if (this.alertTimer <= 0) {
          if (canSeePlayer) this.state = STATES.CHASE;
          else this.state = STATES.PATROL;
        }
        break;

      case STATES.CHASE:
        this.angle = angleToPlayer;
        if (canSeePlayer) {
          if (distToPlayer < 40) {
            this.state = STATES.ATTACK;
          } else {
            this.moveTowards(player.x, player.y);
          }
        } else {
          this.state = STATES.ALERT;
          this.alertTimer = 60;
        }
        break;

      case STATES.ATTACK:
        this.angle = angleToPlayer;
        this.attackCooldown--;
        this.pulse += 0.2; // Pulse animation
        
        if (this.attackCooldown <= 0) {
          player.hp -= 10;
          this.attackCooldown = 60;
          createParticle(player.x, player.y, COLORS.ATTACK);
        }
        if (distToPlayer > 150) {
          this.state = STATES.CHASE;
        }
        break;
    }
  }

  moveTowards(tx, ty) {
    const dx = tx - this.x;
    const dy = ty - this.y;
    const dist = Math.hypot(dx, dy);
    
    if (dist > 0) {
      // Simple collision avoidance
      let nx = (dx / dist) * this.speed;
      let ny = (dy / dist) * this.speed;
      
      // Wall Collision Check (Very simple)
      if (!checkCircleWallCollision(this.x + nx, this.y + ny, this.radius)) {
        this.x += nx;
        this.y += ny;
      } else {
        // Slide along wall
        if (!checkCircleWallCollision(this.x + nx, this.y, this.radius)) this.x += nx;
        else if (!checkCircleWallCollision(this.x, this.y + ny, this.radius)) this.y += ny;
      }
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // 1. Draw Ownership Line (Connecting entity to cone base)
    // Since cone is drawn relative to entity, we draw a small connector line
    // effectively just the center point emphasis.
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();

    // 2. Draw Detection Cone (Unified Tactical Aesthetic)
    // Drawn first so it's behind the unit
    if (this.state !== STATES.PATROL) {
      const coneColor = this.getColor();
      const coneRad = 250;
      const coneSpread = Math.PI / 3;

      // Create Gradient for "Scanline/Tactical" look
      // Radial gradient from center
      let grad = ctx.createRadialGradient(0, 0, 0, 0, 0, coneRad);
      grad.addColorStop(0, coneColor);
      grad.addColorStop(1, 'transparent');
      
      ctx.fillStyle = grad;
      ctx.globalAlpha = 0.15; // Low opacity

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, coneRad, this.angle - coneSpread, this.angle + coneSpread);
      ctx.lineTo(0, 0);
      ctx.fill();
      
      // Scanline texture simulation (Thin lines)
      ctx.globalAlpha = 0.3;
      ctx.strokeStyle = coneColor;
      ctx.lineWidth = 1;
      for(let i=10; i<coneRad; i+=15) {
          ctx.beginPath();
          ctx.arc(0, 0, i, this.angle - coneSpread, this.angle + coneSpread);
          ctx.stroke();
      }
      
      ctx.globalAlpha = 1.0;
    }

    // 3. Pathfinding Line (To target waypoint)
    // Only visible in PATROL state or CHASE (to player)
    ctx.save();
    // Rotate back to draw in world space for easier coordinate math
    ctx.rotate(-this.angle); 
    
    ctx.beginPath();
    ctx.moveTo(0,0);
    
    let targetX = 0, targetY = 0;
    
    if (this.state === STATES.PATROL) {
        // Calculate relative position of patrol target
        let dx = this.patrolTarget.x - this.x;
        let dy = this.patrolTarget.y - this.y;
        // Rotate point
        let rx = dx * Math.cos(-this.angle) - dy * Math.sin(-this.angle);
        let ry = dx * Math.sin(-this.angle) + dy * Math.cos(-this.angle);
        targetX = rx;
        targetY = ry;
    } else if (this.state === STATES.CHASE || this.state === STATES.ATTACK) {
        let dx = player.x - this.x;
        let dy = player.y - this.y;
        let rx = dx * Math.cos(-this.angle) - dy * Math.sin(-this.angle);
        let ry = dx * Math.sin(-this.angle) + dy * Math.cos(-this.angle);
        targetX = rx;
        targetY = ry;
    }

    if (this.state === STATES.PATROL || this.state === STATES.CHASE || this.state === STATES.ATTACK) {
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = this.getColor();
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.4;
        ctx.lineTo(targetX, targetY);
        ctx.stroke();
        
        // Draw Target Waypoint
        ctx.beginPath();
        ctx.arc(targetX, targetY, 2, 0, Math.PI*2);
        ctx.fillStyle = this.getColor();
        ctx.fill();
    }
    
    ctx.restore(); // Restore rotation

    // 4. Draw Entity Body
    ctx.rotate(this.angle);

    ctx.fillStyle = this.getColor();
    ctx.beginPath();
    ctx.moveTo(10, 0);
    ctx.lineTo(-8, 7);
    ctx.lineTo(-5, 0);
    ctx.lineTo(-8, -7);
    ctx.closePath();
    ctx.fill();
    
    // Glow
    ctx.shadowColor = this.getColor();
    ctx.shadowBlur = 15;
    ctx.fill();

    ctx.restore();

    // 5. Draw State Label (High Contrast)
    ctx.fillStyle = this.getColor();
    ctx.font = 'bold 10px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowBlur = 0;
    ctx.fillText(this.state, this.x, this.y - 22);
  }

  getColor() {
    switch(this.state) {
      case STATES.PATROL: return COLORS.PATROL;
      case STATES.ALERT: return COLORS.ALERT;
      case STATES.CHASE: return COLORS.CHASE;
      case STATES.ATTACK: return COLORS.ATTACK;
      default: return '#fff';
    }
  }
}

// Helpers
function checkWallCollision(x1, y1, x2, y2) {
  for (let w of walls) {
    // Simple line vs AABB
    if (x1 < w.x + w.w && x2 > w.x && y1 < w.y + w.h && y2 > w.y) return true;
    if (x2 < w.x + w.w && x1 > w.x && y2 < w.y + w.h && y1 > w.y) return true;
  }
  return false;
}

function checkCircleWallCollision(x, y, r) {
  for (let w of walls) {
    let testX = x;
    let testY = y;

    if (x < w.x) testX = w.x;
    else if (x > w.x + w.w) testX = w.x + w.w;

    if (y < w.y) testY = w.y;
    else if (y > w.y + w.h) testY = w.y + w.h;

    let distX = x - testX;
    let distY = y - testY;
    let distance = Math.sqrt((distX*distX) + (distY*distY));

    if (distance <= r) return true;
  }
  return false;
}

let particles = [];
function createParticle(x, y, color) {
  particles.push({x, y, color, life: 20, size: 5});
}

// Input Handling
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('resize', resize);
ui.resetBtn.addEventListener('click', initWorld);

// Main Loop
function loop() {
  ctx.clearRect(0, 0, width, height);

  // Update Player
  let dx = 0, dy = 0;
  if (keys['w']) dy = -1;
  if (keys['s']) dy = 1;
  if (keys['a']) dx = -1;
  if (keys['d']) dx = 1;

  // Normalize
  if (dx !== 0 || dy !== 0) {
    let len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    
    let nextX = player.x + dx * player.speed;
    let nextY = player.y + dy * player.speed;
    
    if (!checkCircleWallCollision(nextX, player.y, player.radius)) player.x = nextX;
    if (!checkCircleWallCollision(player.x, nextY, player.radius)) player.y = nextY;
  }

  // Draw Walls
  ctx.fillStyle = COLORS.WALL;
  ctx.strokeStyle = COLORS.WALL_BORDER;
  ctx.lineWidth = 2;
  for (let w of walls) {
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeRect(w.x, w.y, w.w, w.h);
  }

  // Update & Draw Enemies
  for (let e of enemies) {
    e.update();
    e.draw();
  }

  // Draw Player
  ctx.save();
  ctx.translate(player.x, player.y);
  
  // Player Glow
  ctx.shadowColor = COLORS.PLAYER;
  ctx.shadowBlur = 20;
  
  ctx.fillStyle = COLORS.PLAYER;
  ctx.beginPath();
  ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
  ctx.fill();
  
  // Inner detail
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, 0, player.radius * 0.4, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.restore();

  // Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 20;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (20 - p.life), 0, Math.PI * 2);
    ctx.fill();
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  ctx.globalAlpha = 1;

  // Update UI
  ui.posVal.textContent = `${Math.round(player.x)}, ${Math.round(player.y)}`;
  let speed = Math.hypot(keys['w']?1:0 + (keys['s']?1:0), keys['a']?1:0 + (keys['d']?1:0));
  ui.velVal.textContent = (speed * player.speed).toFixed(1);
  
  ui.hpVal.textContent = Math.max(0, player.hp) + '%';
  ui.hpBar.style.width = Math.max(0, player.hp) + '%';
  if (player.hp < 30) ui.hpBar.style.backgroundColor = COLORS.CHASE;
  else ui.hpBar.style.backgroundColor = COLORS.PLAYER;

  requestAnimationFrame(loop);
}

// Start
resize();
loop();

</script>
</body>
</html>
