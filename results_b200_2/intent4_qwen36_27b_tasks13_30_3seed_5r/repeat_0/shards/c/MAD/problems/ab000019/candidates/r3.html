<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactical AI Visualization</title>
<style>
  :root {
    --bg-dark: #020617;
    --sidebar-width: 280px;
    --grid-line: rgba(56, 189, 248, 0.08); /* Reduced opacity for grid */
    --text-main: #f1f5f9;
    --text-dim: #94a3b8;
    --accent-cyan: #06b6d4; /* Hero Color */
    --accent-green: #10b981;
    --accent-amber: #f59e0b;
    --accent-red: #ef4444;
    --accent-white: #f8fafc;
    --glass-bg: rgba(15, 23, 42, 0.65);
    --glass-border: rgba(56, 189, 248, 0.15);
  }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
    display: flex;
  }

  /* Background Grid */
  .grid-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 0;
    pointer-events: none;
  }

  /* Canvas Layer */
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
    cursor: crosshair;
  }

  /* Layout Structure */
  .sidebar {
    width: var(--sidebar-width);
    height: 100%;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 24px;
    box-sizing: border-box;
    pointer-events: auto;
    position: relative;
  }

  .main-arena {
    flex-grow: 1;
    height: 100%;
    position: relative;
    z-index: 5;
  }

  /* Branding */
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .brand-icon {
    width: 36px;
    height: 36px;
    background: var(--accent-cyan);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
  }

  .brand-text h1 {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 0;
    color: #fff;
    line-height: 1.1;
  }

  .brand-text p {
    font-size: 10px;
    color: var(--text-dim);
    margin: 0;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* Panels */
  .panel {
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    padding: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 8px;
    margin-bottom: 12px;
  }

  .panel-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent-cyan);
    font-weight: 700;
  }

  /* Inspector Specifics */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    margin-bottom: 12px;
  }

  .stat-label { color: var(--text-dim); }
  .stat-value { 
    font-family: 'Courier New', Courier, monospace; 
    font-weight: 700; 
    color: var(--text-main); 
    font-size: 14px;
  }

  /* Health Bar */
  .health-bar-container {
    width: 100%;
    height: 8px;
    background: rgba(0,0,0,0.4);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .health-fill {
    height: 100%;
    background: var(--accent-cyan);
    width: 100%;
    transition: width 0.2s ease, background-color 0.2s ease;
    box-shadow: 0 0 10px var(--accent-cyan);
  }

  /* Legend */
  .legend-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text-main);
    padding: 6px 0;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    box-shadow: 0 0 8px currentColor;
  }

  /* Status Badge */
  .status-badge {
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 4px;
    background: rgba(255,255,255,0.1);
    color: var(--text-main);
    font-family: monospace;
    font-weight: bold;
    border: 1px solid rgba(255,255,255,0.1);
  }

  /* Controls Hint */
  .controls-hint {
    margin-top: auto;
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.6;
  }
  .key {
    display: inline-block;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 2px 6px;
    border-radius: 4px;
    margin: 0 2px;
    color: var(--text-main);
    font-weight: 600;
    font-family: monospace;
    font-size: 10px;
    min-width: 16px;
    text-align: center;
  }

</style>
</head>
<body>

  <!-- Left Sidebar -->
  <div class="sidebar">
    <div class="brand">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Tactical AI</h1>
        <p>Behavior Monitor</p>
      </div>
    </div>

    <!-- Inspector Panel -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">Player Unit</div>
        <div class="status-badge" id="status-badge">ALIVE</div>
      </div>
      
      <div class="stat-row">
        <span class="stat-label">Integrity</span>
        <span class="stat-value" id="hp-val">100%</span>
      </div>
      <div class="health-bar-container">
        <div class="health-fill" id="hp-bar"></div>
      </div>

      <div class="stat-row">
        <span class="stat-label">Grid Position</span>
        <span class="stat-value" id="pos-val">0, 0</span>
      </div>

      <div class="stat-row">
        <span class="stat-label">Active Threats</span>
        <span class="stat-value" id="threat-val">0</span>
      </div>
    </div>

    <!-- Legend Panel -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">AI States</div>
      </div>
      <div class="legend-list">
        <div class="legend-item"><div class="dot" style="background:var(--accent-cyan); color:var(--accent-cyan)"></div>Patrol</div>
        <div class="legend-item"><div class="dot" style="background:var(--accent-amber); color:var(--accent-amber)"></div>Alert</div>
        <div class="legend-item"><div class="dot" style="background:var(--accent-red); color:var(--accent-red)"></div>Chase</div>
        <div class="legend-item"><div class="dot" style="background:var(--accent-white); color:var(--accent-white)"></div>Attack</div>
      </div>
    </div>

    <div class="controls-hint">
      <div><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> Move Player</div>
      <div style="margin-top:8px; opacity: 0.7;">Avoid red zones.</div>
    </div>
  </div>

  <!-- Main Arena -->
  <div class="main-arena">
    <div class="grid-bg"></div>
    <canvas id="arena"></canvas>
  </div>

<script>
/**
 * ENGINE & LOGIC
 */
const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d');
const ui = {
  hpVal: document.getElementById('hp-val'),
  hpBar: document.getElementById('hp-bar'),
  posVal: document.getElementById('pos-val'),
  threatVal: document.getElementById('threat-val'),
  statusBadge: document.getElementById('status-badge')
};

// Configuration
const COLORS = {
  PATROL: '#06b6d4', // Cyan
  ALERT: '#f59e0b',  // Amber
  CHASE: '#ef4444',  // Red
  ATTACK: '#f8fafc', // White
  PLAYER: '#22d3ee', // Electric Cyan
  WALL: '#0f172a',
  WALL_BORDER: '#334155'
};

const STATES = {
  PATROL: 'PATROL',
  ALERT: 'ALERT',
  CHASE: 'CHASE',
  ATTACK: 'ATTACK'
};

// Game State
let width, height;
let player = { x: 0, y: 0, radius: 12, hp: 100, speed: 4, angle: 0 };
let enemies = [];
let walls = [];
let keys = {};

// Initialize
function resize() {
  const container = document.querySelector('.main-arena');
  width = container.clientWidth;
  height = container.clientHeight;
  canvas.width = width;
  canvas.height = height;
  initWorld();
}

function initWorld() {
  // Player start
  player.x = width * 0.15;
  player.y = height * 0.5;
  player.hp = 100;

  // Walls - Tactical Layout
  walls = [
    { x: width * 0.35, y: height * 0.15, w: 20, h: height * 0.25 },
    { x: width * 0.65, y: height * 0.55, w: 20, h: height * 0.25 },
    { x: width * 0.45, y: height * 0.45, w: 180, h: 20 },
    { x: width * 0.2, y: height * 0.2, w: 120, h: 120 }, // Box
    { x: width * 0.7, y: height * 0.2, w: 120, h: 120 }, // Box
  ];

  // Enemies - State Diversity
  enemies = [
    new Enemy(width * 0.5, height * 0.1, STATES.PATROL),
    new Enemy(width * 0.8, height * 0.8, STATES.PATROL),
    new Enemy(width * 0.85, height * 0.2, STATES.CHASE),
    new Enemy(width * 0.15, height * 0.8, STATES.ALERT),
    new Enemy(width * 0.5, height * 0.9, STATES.ATTACK),
  ];
}

class Enemy {
  constructor(x, y, state) {
    this.x = x;
    this.y = y;
    this.radius = 10;
    this.angle = 0;
    this.state = state;
    this.speed = 2.5;
    
    // Patrol Logic
    this.patrolTarget = this.getRandomPatrolPoint();
    
    // Alert Logic
    this.alertTimer = 0;

    // Attack Logic
    this.attackCooldown = 0;
  }

  getRandomPatrolPoint() {
    return {
      x: Math.random() * (width - 100) + 50,
      y: Math.random() * (height - 100) + 50
    };
  }

  update() {
    const distToPlayer = Math.hypot(player.x - this.x, player.y - this.y);
    const angleToPlayer = Math.atan2(player.y - this.y, player.x - this.x);
    
    // Raycasting for Vision
    let canSeePlayer = false;
    if (distToPlayer < 300) { 
      let angleDiff = angleToPlayer - this.angle;
      while (angleDiff <= -Math.PI) angleDiff += Math.PI*2;
      while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
      
      // FOV Check (60 degrees)
      if (Math.abs(angleDiff) < Math.PI / 3) {
        canSeePlayer = !checkWallCollision(this.x, this.y, player.x, player.y);
      }
    }

    // State Machine
    switch(this.state) {
      case STATES.PATROL:
        this.angle = Math.atan2(this.patrolTarget.y - this.y, this.patrolTarget.x - this.x);
        this.moveTowards(this.patrolTarget.x, this.patrolTarget.y);
        
        if (distToPlayer < 300 && canSeePlayer) {
          this.state = STATES.ALERT;
          this.alertTimer = 60; 
        } else if (Math.hypot(this.patrolTarget.x - this.x, this.patrolTarget.y - this.y) < 5) {
          this.patrolTarget = this.getRandomPatrolPoint();
        }
        break;

      case STATES.ALERT:
        this.angle = angleToPlayer;
        this.alertTimer--;
        if (this.alertTimer <= 0) {
          if (canSeePlayer) this.state = STATES.CHASE;
          else this.state = STATES.PATROL;
        }
        break;

      case STATES.CHASE:
        this.angle = angleToPlayer;
        if (canSeePlayer) {
          if (distToPlayer < 50) {
            this.state = STATES.ATTACK;
          } else {
            this.moveTowards(player.x, player.y);
          }
        } else {
          this.state = STATES.ALERT;
          this.alertTimer = 60;
        }
        break;

      case STATES.ATTACK:
        this.angle = angleToPlayer;
        this.attackCooldown--;
        
        if (this.attackCooldown <= 0) {
          player.hp -= 10;
          this.attackCooldown = 60;
          createParticle(player.x, player.y, COLORS.ATTACK);
        }
        if (distToPlayer > 200) {
          this.state = STATES.CHASE;
        }
        break;
    }
  }

  moveTowards(tx, ty) {
    const dx = tx - this.x;
    const dy = ty - this.y;
    const dist = Math.hypot(dx, dy);
    
    if (dist > 0) {
      let nx = (dx / dist) * this.speed;
      let ny = (dy / dist) * this.speed;
      
      if (!checkCircleWallCollision(this.x + nx, this.y + ny, this.radius)) {
        this.x += nx;
        this.y += ny;
      } else {
        if (!checkCircleWallCollision(this.x + nx, this.y, this.radius)) this.x += nx;
        else if (!checkCircleWallCollision(this.x, this.y + ny, this.radius)) this.y += ny;
      }
    }
  }

  draw() {
    const color = this.getColor();
    
    // 1. Draw Pathfinding Line (Dashed) - Drawn first (bottom layer)
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    let targetX = 0, targetY = 0;
    
    if (this.state === STATES.PATROL) {
        targetX = this.patrolTarget.x;
        targetY = this.patrolTarget.y;
    } else if (this.state === STATES.CHASE || this.state === STATES.ATTACK) {
        targetX = player.x;
        targetY = player.y;
    }

    if (this.state === STATES.PATROL || this.state === STATES.CHASE || this.state === STATES.ATTACK) {
        ctx.lineTo(targetX, targetY);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.globalAlpha = 0.4;
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
    }

    // 2. Draw Detection Cone
    const coneRad = 300;
    const coneSpread = Math.PI / 3; 

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, coneRad, -coneSpread, coneSpread);
    ctx.lineTo(0, 0);
    ctx.closePath();
    
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.15;
    ctx.fill();
    
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.4;
    ctx.stroke();
    ctx.restore();

    // 3. Draw Attack Range Circle
    if (this.state === STATES.CHASE || this.state === STATES.ATTACK) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, 50, 0, Math.PI*2);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.6;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // 4. Draw Entity Body
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);

    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    
    ctx.fillStyle = color;
    ctx.beginPath();
    // Tactical Arrow Shape
    ctx.moveTo(14, 0);
    ctx.lineTo(-8, 8);
    ctx.lineTo(-4, 0);
    ctx.lineTo(-8, -8);
    ctx.closePath();
    ctx.fill();

    ctx.restore();

    // 5. Draw State Label
    ctx.save();
    ctx.translate(this.x, this.y - 30); 
    
    const text = this.state;
    ctx.font = 'bold 11px "Courier New", monospace';
    const textWidth = ctx.measureText(text).width;
    
    // Pill Background
    ctx.fillStyle = 'rgba(2, 6, 23, 0.85)';
    const pillPadding = 6;
    const pillHeight = 18;
    const pillWidth = textWidth + (pillPadding * 2);
    
    ctx.beginPath();
    ctx.roundRect(-pillWidth/2, -pillHeight/2, pillWidth, pillHeight, 4);
    ctx.fill();
    
    // Border for label
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.stroke();
    
    // Text
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 0, 1);
    
    ctx.restore();
  }

  getColor() {
    switch(this.state) {
      case STATES.PATROL: return COLORS.PATROL;
      case STATES.ALERT: return COLORS.ALERT;
      case STATES.CHASE: return COLORS.CHASE;
      case STATES.ATTACK: return COLORS.ATTACK;
      default: return '#fff';
    }
  }
}

// Helpers
function checkWallCollision(x1, y1, x2, y2) {
  for (let w of walls) {
    if (x1 < w.x + w.w && x2 > w.x && y1 < w.y + w.h && y2 > w.y) return true;
    if (x2 < w.x + w.w && x1 > w.x && y2 < w.y + w.h && y1 > w.y) return true;
  }
  return false;
}

function checkCircleWallCollision(x, y, r) {
  for (let w of walls) {
    let testX = x;
    let testY = y;

    if (x < w.x) testX = w.x;
    else if (x > w.x + w.w) testX = w.x + w.w;

    if (y < w.y) testY = w.y;
    else if (y > w.y + w.h) testY = w.y + w.h;

    let distX = x - testX;
    let distY = y - testY;
    let distance = Math.sqrt((distX*distX) + (distY*distY));

    if (distance <= r) return true;
  }
  return false;
}

let particles = [];
function createParticle(x, y, color) {
  particles.push({x, y, color, life: 20, size: 5});
}

// Input Handling
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('resize', resize);

// Main Loop
function loop() {
  ctx.clearRect(0, 0, width, height);

  // Update Player
  let dx = 0, dy = 0;
  if (keys['w']) dy = -1;
  if (keys['s']) dy = 1;
  if (keys['a']) dx = -1;
  if (keys['d']) dx = 1;

  if (dx !== 0 || dy !== 0) {
    let len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    player.angle = Math.atan2(dy, dx);
    
    let nextX = player.x + dx * player.speed;
    let nextY = player.y + dy * player.speed;
    
    if (!checkCircleWallCollision(nextX, player.y, player.radius)) player.x = nextX;
    if (!checkCircleWallCollision(player.x, nextY, player.radius)) player.y = nextY;
  }

  // Draw Walls
  ctx.fillStyle = COLORS.WALL;
  ctx.strokeStyle = COLORS.WALL_BORDER;
  ctx.lineWidth = 2;
  for (let w of walls) {
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeRect(w.x, w.y, w.w, w.h);
  }

  // Update & Draw Enemies
  let activeThreats = 0;
  for (let e of enemies) {
    e.update();
    e.draw();
    if (e.state === STATES.CHASE || e.state === STATES.ATTACK) activeThreats++;
  }

  // Draw Player
  ctx.save();
  ctx.translate(player.x, player.y);
  
  // Rotate player indicator
  ctx.rotate(player.angle);
  
  ctx.shadowColor = COLORS.PLAYER;
  ctx.shadowBlur = 15;
  
  ctx.fillStyle = COLORS.PLAYER;
  ctx.beginPath();
  // Triangle shape for player to show direction
  ctx.moveTo(14, 0);
  ctx.lineTo(-8, 8);
  ctx.lineTo(-4, 0);
  ctx.lineTo(-8, -8);
  ctx.closePath();
  ctx.fill();
  
  ctx.restore();

  // Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 20;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (20 - p.life), 0, Math.PI * 2);
    ctx.fill();
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  ctx.globalAlpha = 1;

  // Update UI
  ui.posVal.textContent = `${Math.round(player.x)}, ${Math.round(player.y)}`;
  ui.threatVal.textContent = activeThreats;
  
  ui.hpVal.textContent = Math.max(0, player.hp) + '%';
  ui.hpBar.style.width = Math.max(0, player.hp) + '%';
  
  if (player.hp < 30) {
    ui.hpBar.style.backgroundColor = COLORS.CHASE;
    ui.hpBar.style.boxShadow = `0 0 10px ${COLORS.CHASE}`;
    ui.statusBadge.textContent = "CRITICAL";
    ui.statusBadge.style.color = COLORS.CHASE;
    ui.statusBadge.style.borderColor = COLORS.CHASE;
  } else {
    ui.hpBar.style.backgroundColor = COLORS.PLAYER;
    ui.hpBar.style.boxShadow = `0 0 10px ${COLORS.PLAYER}`;
    ui.statusBadge.textContent = "ALIVE";
    ui.statusBadge.style.color = COLORS.PLAYER;
    ui.statusBadge.style.borderColor = COLORS.PLAYER;
  }

  requestAnimationFrame(loop);
}

// Start
resize();
loop();

</script>
</body>
</html>
