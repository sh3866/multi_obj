<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RETRO-RUN // REVISED</title>
    <style>
        :root {
            /* Modern-Retro Sunset Palette */
            --bg-top: #2c1b3d;      /* Deep Purple */
            --bg-mid: #903749;      /* Muted Red */
            --bg-bot: #e05c33;      /* Burnt Orange */
            --ground-dark: #1a1418; /* Dark Earth */
            --ground-light: #2d242b;/* Lighter Earth */
            --accent: #ff5e00;      /* Bright Orange for UI */
            --text-main: #fffaf0;   /* Off-white */
            
            --font-stack: 'Courier New', Courier, monospace; /* System Monospace */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000;
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Game Container */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1000px; /* Widescreen aspect ratio focus */
            max-height: 600px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            /* Crisp pixel rendering */
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
        }

        /* HUD Layer */
        .hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
            pointer-events: none;
        }

        .hud-left, .hud-right {
            display: flex;
            flex-direction: column;
        }

        .hud-right {
            align-items: flex-end;
        }

        .label {
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            opacity: 0.7;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .score-display {
            font-size: 32px;
            font-weight: 900;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
        }

        .high-score {
            font-size: 16px;
            color: var(--accent);
            font-weight: bold;
            margin-top: 4px;
            opacity: 0.9;
        }

        .speed-display {
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.5);
        }

        /* Instructions Overlay */
        .instruction-overlay {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .instruction-text {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--text-main);
            text-transform: uppercase;
            text-shadow: 2px 2px 0px var(--bg-mid);
            opacity: 0.9;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.98); }
        }

        /* Game Over Panel */
        .game-over-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            z-index: 20;
            background: rgba(0,0,0,0.6);
            padding: 40px;
            border: 2px solid var(--text-main);
            backdrop-filter: blur(2px);
        }

        .game-over-title {
            font-size: 48px;
            font-weight: 900;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
            text-shadow: 4px 4px 0px var(--bg-mid);
        }

        .retry-text {
            font-size: 16px;
            letter-spacing: 2px;
            color: var(--accent);
            font-weight: bold;
        }

    </style>
</head>
<body>

    <div id="game-container">
        <!-- HUD -->
        <div class="hud-layer">
            <div class="hud-left">
                <div class="label">Score</div>
                <div class="score-display" id="score">00000</div>
                <div class="high-score">HI: <span id="high-score">00000</span></div>
            </div>
            <div class="hud-right">
                <div class="label">Velocity</div>
                <div class="speed-display" id="speed-val">1.0x</div>
            </div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Instructions -->
        <div class="instruction-overlay" id="instructions">
            <div class="instruction-text">PRESS SPACE TO JUMP</div>
        </div>

        <!-- Game Over -->
        <div class="game-over-panel" id="game-over">
            <div class="game-over-title">CRASHED</div>
            <div class="retry-text">PRESS SPACE TO RETRY</div>
        </div>
    </div>

<script>
    /**
     * REVISED DESIGN SYSTEM
     * Focus: Solid shapes, crisp strokes, sunset palette, pixel-perfect composition.
     */
    
    // Palette
    const C = {
        skyTop: '#2c1b3d',
        skyMid: '#903749',
        skyBot: '#e05c33',
        groundDark: '#1a1418',
        groundLine: '#3b2d35', // Muted earth tone
        playerFill: '#111',    // Silhouette base
        playerStroke: '#fff',  // Crisp white outline
        obsFill: '#111',
        obsStroke: '#fff'
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const ui = {
        score: document.getElementById('score'),
        highScore: document.getElementById('high-score'),
        speed: document.getElementById('speed-val'),
        gameOver: document.getElementById('game-over'),
        instructions: document.getElementById('instructions')
    };

    // Game State
    let game = {
        width: 0,
        height: 0,
        frame: 0,
        speed: 6,
        score: 0,
        highScore: 0,
        isPlaying: false,
        isGameOver: false,
        groundY: 0
    };

    /**
     * UTILITIES
     */
    function resize() {
        const container = document.getElementById('game-container');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        game.width = canvas.width;
        game.height = canvas.height;
        game.groundY = game.height - 80; // 80px ground height
    }

    /**
     * ENTITIES
     */

    class Player {
        constructor() {
            this.w = 50;
            this.h = 50;
            this.x = 60;
            this.y = game.groundY - this.h;
            this.dy = 0;
            this.jumpForce = -16;
            this.gravity = 0.8;
            this.grounded = true;
            this.runFrame = 0;
        }

        jump() {
            if (this.grounded) {
                this.dy = this.jumpForce;
                this.grounded = false;
            }
        }

        update() {
            this.dy += this.gravity;
            this.y += this.dy;

            // Ground Collision
            if (this.y + this.h > game.groundY) {
                this.y = game.groundY - this.h;
                this.dy = 0;
                this.grounded = true;
            } else {
                this.grounded = false;
            }

            if (this.grounded) {
                this.runFrame += 0.2;
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);

            // Style: Crisp Stroke
            ctx.fillStyle = C.playerFill;
            ctx.strokeStyle = C.playerStroke;
            ctx.lineWidth = 2;
            ctx.lineJoin = 'round';

            // Body
            ctx.beginPath();
            ctx.rect(10, 10, 30, 30);
            ctx.fill();
            ctx.stroke();

            // Head
            ctx.beginPath();
            ctx.rect(25, 0, 25, 20);
            ctx.fill();
            ctx.stroke();

            // Snout
            ctx.beginPath();
            ctx.rect(40, 5, 15, 10);
            ctx.fill();
            ctx.stroke();

            // Eye (Negative space)
            ctx.fillStyle = '#fff';
            ctx.fillRect(35, 5, 4, 4);

            // Tail
            ctx.fillStyle = C.playerFill;
            ctx.beginPath();
            ctx.moveTo(10, 20);
            ctx.lineTo(-10, 15);
            ctx.lineTo(10, 30);
            ctx.fill();
            ctx.stroke();

            // Legs (Animated)
            const legOffset = Math.sin(this.runFrame) * 10;
            
            ctx.beginPath();
            // Back leg
            ctx.moveTo(15, 40);
            ctx.lineTo(15 - (this.grounded ? legOffset : 5), 50);
            // Front leg
            ctx.moveTo(35, 40);
            ctx.lineTo(35 + (this.grounded ? legOffset : -5), 50);
            ctx.stroke();

            // Arms
            ctx.beginPath();
            ctx.moveTo(30, 15);
            ctx.lineTo(45, 25);
            ctx.stroke();

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type;
            this.markedForDeletion = false;
            
            if (type === 'cactus') {
                this.w = 30 + Math.random() * 20;
                this.h = 40 + Math.random() * 30;
                this.x = game.width + 50;
                this.y = game.groundY - this.h;
            } else {
                // Pterodactyl
                this.w = 50;
                this.h = 30;
                this.x = game.width + 50;
                // Heights: Low (jump) or High (run under)
                const heights = [game.groundY - 40, game.groundY - 90];
                this.y = heights[Math.floor(Math.random() * heights.length)];
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= game.speed;
            if (this.type === 'bird') this.wingFrame += 0.1;
            if (this.x + this.w < -50) this.markedForDeletion = true;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            ctx.fillStyle = C.obsFill;
            ctx.strokeStyle = C.obsStroke;
            ctx.lineWidth = 2;
            ctx.lineJoin = 'round';

            if (this.type === 'cactus') {
                // Main trunk
                ctx.beginPath();
                ctx.rect(5, 0, this.w - 10, this.h);
                ctx.fill();
                ctx.stroke();
                
                // Arms
                ctx.beginPath();
                ctx.rect(0, 10, 10, 20); // Left arm
                ctx.stroke();
                ctx.beginPath();
                ctx.rect(this.w - 10, 20, 10, 15); // Right arm
                ctx.stroke();
            } else {
                // Pterodactyl
                // Body
                ctx.beginPath();
                ctx.ellipse(25, 15, 20, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                
                // Head/Beak
                ctx.beginPath();
                ctx.moveTo(45, 15);
                ctx.lineTo(55, 18);
                ctx.lineTo(45, 20);
                ctx.fill();
                ctx.stroke();

                // Wing (Flapping)
                const wingY = Math.sin(this.wingFrame) * 15;
                ctx.beginPath();
                ctx.moveTo(15, 15);
                ctx.lineTo(30, 15 + wingY);
                ctx.lineTo(40, 15);
                ctx.fill();
                ctx.stroke();
            }

            ctx.restore();
        }
    }

    class Background {
        constructor() {
            this.mountains = [];
            this.generateMountains();
            this.clouds = [];
            for(let i=0; i<5; i++) this.clouds.push({
                x: Math.random() * game.width,
                y: Math.random() * (game.height/2),
                w: 60 + Math.random() * 100,
                speed: 0.2 + Math.random() * 0.3
            });
        }

        generateMountains() {
            // Generate a set of points for the distant dunes
            this.mountains = [];
            let x = 0;
            while(x < game.width + 200) {
                const w = 100 + Math.random() * 200;
                const h = 50 + Math.random() * 100;
                this.mountains.push({x: x, w: w, h: h});
                x += w - 50; // Overlap
            }
        }

        update() {
            // Move mountains slowly
            this.mountains.forEach(m => {
                m.x -= game.speed * 0.1;
            });
            // Recycle mountains
            if (this.mountains[0].x + this.mountains[0].w < 0) {
                const first = this.mountains.shift();
                const last = this.mountains[this.mountains.length - 1];
                first.x = last.x + last.w - 50;
                first.h = 50 + Math.random() * 100;
                this.mountains.push(first);
            }

            // Move clouds
            this.clouds.forEach(c => {
                c.x -= c.speed;
                if(c.x + c.w < 0) {
                    c.x = game.width + 50;
                    c.y = Math.random() * (game.height/2);
                }
            });
        }

        draw() {
            // Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, game.height);
            grad.addColorStop(0, C.skyTop);
            grad.addColorStop(0.6, C.skyMid);
            grad.addColorStop(1, C.skyBot);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, game.width, game.height);

            // Sun (Solid block for retro feel)
            ctx.fillStyle = '#ffb703';
            ctx.beginPath();
            ctx.arc(game.width * 0.75, game.height * 0.4, 60, 0, Math.PI * 2);
            ctx.fill();

            // Clouds (Simple geometric shapes)
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            this.clouds.forEach(c => {
                ctx.beginPath();
                ctx.rect(c.x, c.y, c.w, 20);
                ctx.rect(c.x + 20, c.y - 15, c.w * 0.6, 15);
                ctx.fill();
            });

            // Mountains (Layered Dunes)
            ctx.fillStyle = '#4a253d'; // Darker purple than sky
            ctx.beginPath();
            ctx.moveTo(0, game.groundY);
            this.mountains.forEach(m => {
                // Draw peaks
                ctx.lineTo(m.x, game.groundY - m.h);
                ctx.lineTo(m.x + m.w, game.groundY - m.h);
            });
            ctx.lineTo(game.width, game.groundY);
            ctx.fill();
            
            // Second layer of mountains (closer, darker)
            ctx.fillStyle = '#2e1829'; 
            ctx.beginPath();
            ctx.moveTo(0, game.groundY);
            this.mountains.forEach(m => {
                ctx.lineTo(m.x + 50, game.groundY - (m.h * 0.6));
                ctx.lineTo(m.x + m.w + 50, game.groundY - (m.h * 0.6));
            });
            ctx.lineTo(game.width, game.groundY);
            ctx.fill();
        }
    }

    /**
     * MAIN LOOP
     */
    let player;
    let obstacles = [];
    let bg;
    let spawnTimer = 0;
    let spawnInterval = 100;

    function init() {
        resize();
        window.addEventListener('resize', resize);
        
        player = new Player();
        bg = new Background();
        
        // Initial obstacle
        obstacles.push(new Obstacle('cactus'));
        obstacles[0].x = game.width + 200;

        loop();
    }

    function spawnObstacle() {
        spawnTimer--;
        if (spawnTimer <= 0) {
            const type = Math.random() > 0.7 ? 'bird' : 'cactus';
            obstacles.push(new Obstacle(type));
            
            // Randomize gap based on speed
            spawnInterval = Math.max(60, 100 - (game.speed * 2)) + Math.random() * 40;
            spawnTimer = spawnInterval;
        }
    }

    function checkCollisions() {
        // Hitbox padding for forgiveness
        const pPad = 8;
        
        for (let obs of obstacles) {
            const oPad = 5;
            
            if (
                player.x + pPad < obs.x + obs.w - oPad &&
                player.x + player.w - pPad > obs.x + oPad &&
                player.y + pPad < obs.y + obs.h - oPad &&
                player.y + player.h - pPad > obs.y + oPad
            ) {
                gameOver();
            }
        }
    }

    function gameOver() {
        game.isPlaying = false;
        game.isGameOver = true;
        ui.gameOver.style.display = 'block';
        ui.instructions.style.opacity = '0';
        
        if (game.score > game.highScore) {
            game.highScore = Math.floor(game.score);
            ui.highScore.innerText = game.highScore.toString().padStart(5, '0');
        }
    }

    function resetGame() {
        game.isGameOver = false;
        game.isPlaying = true;
        game.score = 0;
        game.speed = 6;
        obstacles = [];
        player = new Player();
        spawnTimer = 0;
        
        ui.gameOver.style.display = 'none';
        ui.instructions.style.opacity = '1';
        
        // Start with one obstacle
        obstacles.push(new Obstacle('cactus'));
        obstacles[0].x = game.width + 300;
    }

    function drawGround() {
        // Ground Block
        ctx.fillStyle = C.groundDark;
        ctx.fillRect(0, game.groundY, game.width, game.height - game.groundY);

        // Top Edge Line
        ctx.strokeStyle = C.groundLine;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, game.groundY);
        ctx.lineTo(game.width, game.groundY);
        ctx.stroke();

        // Moving Ground Details (Texture)
        ctx.fillStyle = C.groundLight;
        const offset = (game.frame * game.speed) % 50;
        for(let i = 0; i < game.width + 50; i+=50) {
            ctx.fillRect(i - offset, game.groundY + 10, 20, 4);
            ctx.fillRect(i - offset + 10, game.groundY + 30, 40, 4);
        }
    }

    function updateUI() {
        ui.score.innerText = Math.floor(game.score).toString().padStart(5, '0');
        ui.speed.innerText = (game.speed / 6).toFixed(1) + 'x';
    }

    function loop() {
        // Clear
        ctx.clearRect(0, 0, game.width, game.height);

        // Background
        bg.update();
        bg.draw();

        // Ground
        drawGround();

        if (game.isPlaying) {
            game.frame++;
            game.score += 0.1;
            game.speed += 0.001; // Slowly increase speed

            // Player
            player.update();
            player.draw();

            // Obstacles
            spawnObstacle();
            obstacles.forEach((obs, index) => {
                obs.update();
                obs.draw();
                if (obs.markedForDeletion) obstacles.splice(index, 1);
            });

            checkCollisions();
            updateUI();
        } else {
            // Draw static player/obstacles if game over or paused
            if(player) player.draw();
            obstacles.forEach(obs => obs.draw());
        }

        requestAnimationFrame(loop);
    }

    // Input
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            if (game.isGameOver) {
                resetGame();
            } else if (!game.isPlaying) {
                game.isPlaying = true;
                ui.instructions.style.opacity = '0';
            } else {
                player.jump();
            }
        }
    });

    window.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (game.isGameOver) {
            resetGame();
        } else if (!game.isPlaying) {
            game.isPlaying = true;
            ui.instructions.style.opacity = '0';
        } else {
            player.jump();
        }
    }, {passive: false});

    init();

</script>
</body>
</html>
