<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-RUNNER // REVISED</title>
    <style>
        :root {
            --bg-gradient-top: #120c1f;
            --bg-gradient-bottom: #2a1b3d;
            --ground-color: #0f0f12;
            --accent-primary: #00f0ff; /* Cyan */
            --accent-secondary: #ff0055; /* Neon Red */
            --accent-tertiary: #ccff00; /* Neon Lime */
            --text-primary: #ffffff;
            --text-muted: #8b9bb4;
            --font-stack: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --glass-panel: rgba(15, 15, 18, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #000;
            color: var(--text-primary);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CRT Scanline Effect Overlay - Subtle */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.05) 50%,
                rgba(0,0,0,0.05)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
        }

        /* Main Game Container */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 600px;
            /* Removed hard border, using box shadow for depth */
            box-shadow: 0 0 80px rgba(0, 240, 255, 0.1);
            overflow: hidden;
        }

        /* HUD Layer */
        .hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 32px 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
            pointer-events: none;
        }

        .hud-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .label {
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
        }

        .score-display {
            font-size: 48px;
            font-weight: 800;
            line-height: 1;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            font-variant-numeric: tabular-nums;
            color: var(--text-primary);
        }

        .high-score {
            font-size: 14px;
            color: var(--accent-tertiary);
            opacity: 0.8;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .speed-indicator {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .speed-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-secondary);
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
        }

        .speed-bar-container {
            width: 120px;
            height: 6px;
            background: rgba(255,255,255,0.1);
            margin-top: 8px;
            border-radius: 3px;
            overflow: hidden;
        }

        .speed-fill {
            height: 100%;
            background: var(--accent-secondary);
            width: 10%;
            box-shadow: 0 0 10px var(--accent-secondary);
            transition: width 0.1s linear;
        }

        /* Canvas Layer */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Instructions Overlay - Ghost Style */
        .instruction-overlay {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            opacity: 1;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .key-hint {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            padding: 12px 32px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .key-icon {
            width: 36px;
            height: 28px;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 10px;
            letter-spacing: 1px;
            color: var(--text-primary);
            box-shadow: 0 2px 0 rgba(255,255,255,0.1);
            background: linear-gradient(to bottom, rgba(255,255,255,0.1), rgba(255,255,255,0.0));
        }

        .instruction-text {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--text-primary);
            text-transform: uppercase;
        }

        /* Glitch Effect Class */
        .glitch-active {
            animation: glitch-anim 0.2s infinite;
        }

        @keyframes glitch-anim {
            0% { transform: translate(0) }
            20% { transform: translate(-3px, 3px) }
            40% { transform: translate(-3px, -3px) }
            60% { transform: translate(3px, 3px) }
            80% { transform: translate(3px, -3px) }
            100% { transform: translate(0) }
        }

        /* UI Elements for State */
        .game-over-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 15, 18, 0.85);
            border: 1px solid rgba(255, 0, 85, 0.3);
            padding: 50px 80px;
            text-align: center;
            display: none;
            z-index: 20;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.2);
        }

        .game-over-title {
            color: var(--accent-secondary);
            font-size: 32px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 6px;
            font-weight: 800;
            text-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
        }

        .retry-text {
            color: var(--text-primary);
            font-size: 14px;
            letter-spacing: 2px;
            opacity: 0.8;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <div id="game-container">
        <!-- HUD -->
        <div class="hud-layer">
            <div class="hud-group">
                <div class="score-display" id="score">00000</div>
                <div class="high-score">HI: <span id="high-score">00000</span></div>
            </div>
            <div class="hud-group speed-indicator">
                <div class="label">Velocity</div>
                <div class="speed-value" id="speed-val">1.0x</div>
                <div class="speed-bar-container"><div class="speed-fill" id="speed-fill"></div></div>
            </div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Instructions -->
        <div class="instruction-overlay" id="instructions">
            <div class="key-hint">
                <div class="key-icon">SPACE</div>
                <div class="instruction-text">Jump</div>
            </div>
        </div>

        <!-- Game Over (Hidden by default) -->
        <div class="game-over-panel" id="game-over">
            <div class="game-over-title">System Failure</div>
            <div class="retry-text">PRESS SPACE TO REBOOT</div>
        </div>
    </div>

<script>
    /**
     * DESIGN SYSTEM & CONSTANTS
     * Applied "Neon-Noir" Aesthetic
     */
    const COLORS = {
        skyTop: '#120c1f',
        skyBottom: '#4a2545', // Warm sunset purple
        ground: '#050507',
        groundLine: '#00f0ff',
        player: '#ffffff',
        playerAccent: '#00f0ff',
        obstacle: '#ff0055',
        obstacleSecondary: '#ff0055',
        bird: '#ccff00'
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const speedValEl = document.getElementById('speed-val');
    const speedFillEl = document.getElementById('speed-fill');
    const gameOverPanel = document.getElementById('game-over');
    const instructionsEl = document.getElementById('instructions');

    let animationFrameId;
    let gameSpeed = 8; // Slightly faster base speed
    let score = 0;
    let highScore = 0;
    let frame = 0;
    let isGameOver = false;
    let isPlaying = false;

    // Physics Constants
    const GRAVITY = 0.7;
    const JUMP_FORCE = -14;
    const GROUND_HEIGHT = 80; // Higher ground for better composition

    /**
     * ENTITIES
     */
    
    class Player {
        constructor() {
            // Scaled up significantly (Critique Point 2)
            this.width = 60; 
            this.height = 80;
            // Positioned left (Critique Point 1)
            this.x = canvas.width * 0.15; 
            this.y = canvas.height - GROUND_HEIGHT - this.height;
            this.dy = 0;
            this.originalY = canvas.height - GROUND_HEIGHT - this.height;
            this.isGrounded = true;
            this.runFrame = 0;
            this.jumpSquash = 0; // For animation
        }

        jump() {
            if (this.isGrounded) {
                this.dy = JUMP_FORCE;
                this.isGrounded = false;
                this.jumpSquash = -5; // Stretch
                createParticles(this.x + this.width/2, this.y + this.height, 10, COLORS.groundLine);
            }
        }

        update() {
            // Apply Gravity
            this.dy += GRAVITY;
            this.y += this.dy;

            // Ground Collision
            if (this.y + this.height > canvas.height - GROUND_HEIGHT) {
                if (!this.isGrounded) {
                    this.jumpSquash = 5; // Squash on impact
                }
                this.y = canvas.height - GROUND_HEIGHT - this.height;
                this.dy = 0;
                this.isGrounded = true;
            } else {
                this.isGrounded = false;
            }

            // Animation ticker
            if (this.isGrounded) {
                this.runFrame += 0.25; 
            } else {
                this.runFrame = 0; // Static legs in air
            }

            // Recover squash/stretch
            this.jumpSquash += (0 - this.jumpSquash) * 0.1;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            // Apply squash/stretch transform
            ctx.scale(1 + (this.jumpSquash/20), 1 - (this.jumpSquash/20));

            // Neon Glow (Critique Point 6)
            ctx.shadowColor = COLORS.playerAccent;
            ctx.shadowBlur = 20;
            ctx.fillStyle = COLORS.player;

            // Geometric Dino Silhouette (High Readability)
            
            // Body
            ctx.beginPath();
            ctx.roundRect(10, 30, 40, 40, 8);
            ctx.fill();

            // Head
            ctx.beginPath();
            ctx.roundRect(30, 10, 40, 30, 8);
            ctx.fill();

            // Eye (Negative space)
            ctx.fillStyle = COLORS.skyTop;
            ctx.shadowBlur = 0; // No glow for eye
            ctx.fillRect(55, 20, 8, 8);

            // Tail
            ctx.fillStyle = COLORS.player;
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.moveTo(10, 50);
            ctx.lineTo(-15, 40);
            ctx.lineTo(10, 60);
            ctx.fill();

            // Legs (Thick, geometric)
            ctx.strokeStyle = COLORS.player;
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';

            const legOffset = Math.sin(this.runFrame) * 12;

            // Back Leg
            ctx.beginPath();
            ctx.moveTo(20, 70);
            ctx.lineTo(20 - legOffset, 80);
            ctx.stroke();

            // Front Leg
            ctx.beginPath();
            ctx.moveTo(40, 70);
            ctx.lineTo(40 + legOffset, 80);
            ctx.stroke();

            // Arms
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(40, 40);
            ctx.lineTo(55, 50);
            ctx.stroke();

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type; // 'cactus' or 'bird'
            this.markedForDeletion = false;
            
            if (type === 'cactus') {
                this.width = 40 + Math.random() * 30;
                this.height = 60 + Math.random() * 40;
                this.x = canvas.width + this.width;
                this.y = canvas.height - GROUND_HEIGHT - this.height;
            } else {
                // Bird
                this.width = 60;
                this.height = 40;
                this.x = canvas.width + this.width;
                // Random height: Low (jumpable), Mid (duckable if we had that), High
                const heights = [40, 90]; 
                const chosenHeight = heights[Math.floor(Math.random() * heights.length)];
                this.y = canvas.height - GROUND_HEIGHT - chosenHeight;
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= gameSpeed;
            if (this.x + this.width < -100) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.15;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);

            if (this.type === 'cactus') {
                ctx.fillStyle = COLORS.obstacle;
                ctx.shadowColor = COLORS.obstacle;
                ctx.shadowBlur = 15;

                // Main Stem
                ctx.beginPath();
                ctx.roundRect(10, 0, this.width - 20, this.height, 6);
                ctx.fill();

                // Arms
                ctx.beginPath();
                ctx.roundRect(0, this.height * 0.4, 15, 15, 4); 
                ctx.roundRect(0, this.height * 0.1, 6, 30, 3); 
                ctx.fill();

                ctx.beginPath();
                ctx.roundRect(this.width - 15, this.height * 0.6, 15, 15, 4); 
                ctx.roundRect(this.width - 6, this.height * 0.3, 6, 30, 3); 
                ctx.fill();

            } else {
                // Bird
                ctx.fillStyle = COLORS.bird;
                ctx.shadowColor = COLORS.bird;
                ctx.shadowBlur = 15;

                // Body
                ctx.beginPath();
                ctx.ellipse(30, 20, 25, 12, 0, 0, Math.PI * 2);
                ctx.fill();

                // Beak
                ctx.beginPath();
                ctx.moveTo(55, 20);
                ctx.lineTo(70, 25);
                ctx.lineTo(55, 28);
                ctx.fill();

                // Wings
                const wingY = Math.sin(this.wingFrame) * 15;
                
                ctx.beginPath();
                ctx.moveTo(20, 20);
                ctx.lineTo(0, 0 + wingY);
                ctx.lineTo(40, 20);
                ctx.fill();
            }

            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 4 + 2;
            this.speedX = Math.random() * 4 - 2;
            this.speedY = Math.random() * 4 - 2;
            this.color = color;
            this.life = 1.0;
            this.decay = Math.random() * 0.03 + 0.02;
        }
        update() {
            this.x -= gameSpeed * 0.8; 
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= this.decay;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 10;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;
        }
    }

    class BackgroundLayer {
        constructor(speedMod, color, heightBase, jaggedness) {
            this.speedMod = speedMod;
            this.color = color;
            this.x = 0;
            this.width = 150; 
            this.heightBase = heightBase; 
            this.jaggedness = jaggedness;
            this.points = [];
            
            // Generate initial noise
            for(let i=0; i < canvas.width / this.width + 4; i++) {
                this.points.push(Math.random() * this.jaggedness);
            }
        }

        update() {
            this.x -= gameSpeed * this.speedMod;
            if (this.x <= -this.width) {
                this.x += this.width;
                this.points.shift();
                this.points.push(Math.random() * this.jaggedness);
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            let startX = this.x % this.width;
            
            // Draw jagged mountains
            for (let i = 0; i < this.points.length; i++) {
                let px = startX + (i * this.width);
                // Create peaks
                let py = canvas.height - GROUND_HEIGHT - this.heightBase - this.points[i];
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();
        }
    }

    /**
     * GAME STATE
     */
    let player;
    let obstacles = [];
    let particles = [];
    let bgLayers = [];
    let spawnTimer = 0;
    let spawnInterval = 90;

    function init() {
        resize();
        player = new Player();
        
        // Layered Environment (Critique Point 3)
        bgLayers = [
            new BackgroundLayer(0.05, '#1a1525', 150, 80), // Far dark mountains
            new BackgroundLayer(0.15, '#2d223b', 100, 50)   // Mid lighter mountains
        ];
        
        // Pre-populate to avoid empty start
        obstacles.push(new Obstacle('cactus'));
        obstacles[0].x = canvas.width * 0.7; // Place initial obstacle
        
        loop();
    }

    function createParticles(x, y, count, color) {
        for (let i = 0; i < count; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    function spawnObstacle() {
        spawnTimer--;
        if (spawnTimer <= 0) {
            const type = Math.random() > 0.6 ? 'bird' : 'cactus';
            obstacles.push(new Obstacle(type));
            
            // Randomize gap slightly
            spawnTimer = spawnInterval + Math.random() * 40;
            
            // Increase difficulty
            if (spawnInterval > 50) spawnInterval -= 0.2;
            gameSpeed += 0.005;
        }
    }

    function checkCollisions() {
        // Simple AABB with generous padding for player
        for (let obs of obstacles) {
            const pPadding = 12; // Forgiving hitbox
            const oPadding = 5;

            if (
                player.x + pPadding < obs.x + obs.width - oPadding &&
                player.x + player.width - pPadding > obs.x + oPadding &&
                player.y + pPadding < obs.y + obs.height - oPadding &&
                player.y + player.height - pPadding > obs.y + oPadding
            ) {
                gameOver();
            }
        }
    }

    function gameOver() {
        isGameOver = true;
        isPlaying = false;
        document.getElementById('game-container').classList.add('glitch-active');
        gameOverPanel.style.display = 'block';
        instructionsEl.style.opacity = '0';
        
        if (score > highScore) {
            highScore = Math.floor(score);
            highScoreEl.innerText = highScore.toString().padStart(5, '0');
        }
    }

    function resetGame() {
        isGameOver = false;
        player = new Player();
        obstacles = [];
        particles = [];
        score = 0;
        gameSpeed = 8;
        spawnInterval = 90;
        spawnTimer = 0;
        document.getElementById('game-container').classList.remove('glitch-active');
        gameOverPanel.style.display = 'none';
        instructionsEl.style.opacity = '1';
        
        // Pre-populate again
        obstacles.push(new Obstacle('cactus'));
        obstacles[0].x = canvas.width * 0.7;
        
        isPlaying = true;
    }

    function update() {
        if (!isPlaying) return;

        frame++;
        score += 0.15;
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
        
        // Update HUD Speed
        let speedMultiplier = (gameSpeed / 8).toFixed(1);
        speedValEl.innerText = speedMultiplier + 'x';
        let fillPercent = Math.min((gameSpeed - 8) / 8 * 100, 100);
        speedFillEl.style.width = Math.max(fillPercent, 5) + '%';

        player.update();
        
        // Backgrounds
        bgLayers.forEach(layer => layer.update());

        // Obstacles
        spawnObstacle();
        obstacles.forEach((obs, index) => {
            obs.update();
            if (obs.markedForDeletion) obstacles.splice(index, 1);
        });

        // Particles
        particles.forEach((p, index) => {
            p.update();
            if (p.life <= 0) particles.splice(index, 1);
        });

        checkCollisions();
    }

    function draw() {
        // Clear & Draw Sky (Critique Point 6)
        let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, COLORS.skyTop);
        gradient.addColorStop(1, COLORS.skyBottom);
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Backgrounds
        bgLayers.forEach(layer => layer.draw());

        // Draw Ground (Distinct Plane)
        ctx.fillStyle = COLORS.ground;
        ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, GROUND_HEIGHT);
        
        // Ground Top Line (Neon)
        ctx.strokeStyle = COLORS.groundLine;
        ctx.lineWidth = 3;
        ctx.shadowColor = COLORS.groundLine;
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height - GROUND_HEIGHT);
        ctx.lineTo(canvas.width, canvas.height - GROUND_HEIGHT);
        ctx.stroke();
        ctx.shadowBlur = 0; // Reset

        // Draw Entities
        player.draw();
        obstacles.forEach(obs => obs.draw());
        particles.forEach(p => p.draw());
    }

    function loop() {
        update();
        draw();
        animationFrameId = requestAnimationFrame(loop);
    }

    function resize() {
        canvas.width = document.getElementById('game-container').offsetWidth;
        canvas.height = document.getElementById('game-container').offsetHeight;
        // Update player Y on resize if needed
        if(player) {
            player.originalY = canvas.height - GROUND_HEIGHT - player.height;
            if(player.isGrounded) {
                player.y = player.originalY;
            }
        }
    }

    // Input Handling
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            if (isGameOver) {
                resetGame();
            } else if (!isPlaying) {
                isPlaying = true;
                instructionsEl.style.opacity = '0';
            } else {
                player.jump();
            }
        }
    });

    window.addEventListener('resize', resize);
    
    // Touch support
    window.addEventListener('touchstart', (e) => {
        e.preventDefault(); 
        if (isGameOver) {
            resetGame();
        } else if (!isPlaying) {
            isPlaying = true;
            instructionsEl.style.opacity = '0';
        } else {
            player.jump();
        }
    }, {passive: false});

    // Start
    init();

</script>
</body>
</html>
