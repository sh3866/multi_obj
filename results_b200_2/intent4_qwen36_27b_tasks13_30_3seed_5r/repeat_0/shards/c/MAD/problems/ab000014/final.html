<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMONO — The Vermilion Wave</title>
    <style>
        :root {
            /* Palette: Washi Paper & Deep Ink */
            --bg-paper: #F4F2E6; /* Slightly warmer paper tone */
            --ink-black: #1A1A1A;
            --ink-light: #666666;
            
            /* Kimono Colors (Vermilion & White) */
            --kimono-base: #B22222; 
            --kimono-dark: #8B0000; 
            --kimono-shadow: #4A0000; 
            
            /* Obi Colors (Deep Indigo) */
            --obi-base: #1C2833;
            --obi-light: #2E4053;
            --obi-dark: #0A1118;
            --obi-gold: #D4AF37;

            /* Lining */
            --lining-white: #F9F9F9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-paper);
            color: var(--ink-black);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        /* Paper Texture Overlay */
        .texture {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.5;
            z-index: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.5'/%3E%3C/svg%3E");
        }

        /* Layout Container */
        .canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Main SVG */
        #kimono-svg {
            height: 105vh; /* Taller to dominate */
            width: auto;
            max-width: 100vw;
            filter: drop-shadow(0px 20px 40px rgba(0,0,0,0.2));
            transition: transform 0.1s ease-out; 
            /* Center alignment */
            display: block;
        }

        /* UI / Info Block (Centered Anchor) */
        .info-block {
            position: absolute;
            bottom: 8vh; /* Anchored at bottom */
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            pointer-events: none;
            width: 400px;
        }

        /* Typography Polish: Accent Line */
        .accent-line {
            width: 2px;
            background-color: var(--kimono-base);
            height: 60px; 
            margin-bottom: 1.5rem;
        }

        .label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--kimono-base);
            margin-bottom: 0.8rem;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 300; /* Elegant thin weight */
            line-height: 1;
            letter-spacing: -0.03em;
            color: var(--kimono-dark);
            margin-bottom: 1rem;
            font-family: "Didot", "Times New Roman", serif; /* Serif for traditional feel */
        }

        p.desc {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--ink-light);
            font-weight: 400;
            max-width: 320px;
            background: rgba(244, 242, 230, 0.8); /* Slight mask for readability */
            padding: 0 10px;
        }

        /* Animation */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        .floating {
            animation: float 8s ease-in-out infinite;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .info-block {
                bottom: 4vh;
                width: 90%;
            }
            h1 { font-size: 2.5rem; }
            #kimono-svg { height: 90vh; }
        }
    </style>
</head>
<body>

    <div class="texture"></div>

    <div class="canvas-container">
        
        <!-- UI Overlay: Centered Anchor -->
        <div class="info-block">
            <div class="accent-line"></div>
            <div class="label">Traditional Garment</div>
            <h1>VERMILION<br>WAVE</h1>
            <p class="desc">
                A digital reconstruction of the <strong>Kosode</strong>. 
                Featuring the <em>Tsuzure</em> collar overlap, 
                continuous <em>Sode</em> sleeves, and a <em>Seigaiha</em> wave motif.
            </p>
        </div>

        <!-- SVG KIMONO -->
        <!-- ViewBox expanded to fit full height (1200) and width (900) -->
        <svg id="kimono-svg" class="floating" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 1. SILK GRADIENT -->
                <linearGradient id="silk-luster" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#991b1b" />
                    <stop offset="40%" stop-color="#c53030" /> <!-- Highlight -->
                    <stop offset="60%" stop-color="#9b2c2c" />
                    <stop offset="100%" stop-color="#742a2a" />
                </linearGradient>

                <!-- 2. METALLIC GOLD GRADIENT -->
                <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#B8860B" />
                    <stop offset="50%" stop-color="#FFDF00" />
                    <stop offset="100%" stop-color="#B8860B" />
                </linearGradient>

                <!-- 3. FILTERS (Displacement & Shadow) -->
                <!-- Displaces the pattern to simulate fabric folds -->
                <filter id="fabric-distortion">
                    <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise" />
                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" xChannelSelector="R" yChannelSelector="G" />
                </filter>

                <!-- Soft Inner Shadow for Collar -->
                <filter id="inner-shadow">
                    <feOffset dx="2" dy="2"/>
                    <feGaussianBlur stdDeviation="2" result="offset-blur"/>
                    <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                    <feFlood flood-color="black" flood-opacity="0.3" result="color"/>
                    <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                    <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
                </filter>

                <!-- 4. PATTERNS -->
                <!-- Pattern: Seigaiha (Concentric Waves) -->
                <pattern id="pattern-seigaiha" x="0" y="0" width="40" height="80" patternUnits="userSpaceOnUse">
                    <!-- Main Wave Arc -->
                    <path d="M0,40 A20,20 0 0,1 40,40" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7" />
                    <!-- Inner Wave Arc -->
                    <path d="M0,55 A20,20 0 0,1 40,55" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7" />
                    <!-- Fill between waves -->
                    <path d="M0,40 A20,20 0 0,1 40,40 L40,55 A20,20 0 0,0 0,55 Z" fill="#600000" opacity="0.5" />
                </pattern>

                <!-- 5. CLIP PATHS -->
                <!-- Main Body Silhouette: Sweeping curves, wide hem -->
                <clipPath id="kimono-silhouette">
                    <path d="
                        M 320,120 
                        C 290,130 260,160 250,200 
                        L 160,220 
                        C 150,230 150,500 150,550 
                        L 150,1080 
                        C 250,1110 650,1110 750,1080 
                        L 750,550 
                        C 750,500 750,230 740,220 
                        L 650,200 
                        C 640,160 610,130 580,120 
                        Z" 
                    />
                </clipPath>
            </defs>

            <g id="garment-group" transform="translate(20, 10)">
                
                <!-- 1. MAIN BODY (Unified Silhouette with Pattern) -->
                <g id="main-body">
                    <!-- Base Shape (Silk Gradient) -->
                    <path d="
                        M 320,120 
                        C 290,130 260,160 250,200 
                        L 160,220 
                        C 150,230 150,500 150,550 
                        L 150,1080 
                        C 250,1110 650,1110 750,1080 
                        L 750,550 
                        C 750,500 750,230 740,220 
                        L 650,200 
                        C 640,160 610,130 580,120 
                        Z" 
                        fill="url(#silk-luster)" 
                    />
                    
                    <!-- Pattern Overlay (Distorted to simulate drape) -->
                    <rect x="0" y="0" width="900" height="1200" 
                          fill="url(#pattern-seigaiha)" 
                          clip-path="url(#kimono-silhouette)" 
                          filter="url(#fabric-distortion)"
                    />

                    <!-- Structural Folds (Shadows) -->
                    <!-- Sleeve to Body transitions -->
                    <path d="M280,200 Q280,350 260,550" stroke="var(--kimono-shadow)" stroke-width="8" opacity="0.4" fill="none" />
                    <path d="M620,200 Q620,350 640,550" stroke="var(--kimono-shadow)" stroke-width="8" opacity="0.4" fill="none" />
                    
                    <!-- Skirt Folds (Vertical Drape) -->
                    <path d="M300,600 L300,1090" stroke="var(--kimono-shadow)" stroke-width="4" opacity="0.3" fill="none" />
                    <path d="M600,600 L600,1090" stroke="var(--kimono-shadow)" stroke-width="4" opacity="0.3" fill="none" />
                    <!-- Center Front Shadow -->
                    <path d="M450,600 L450,1090" stroke="var(--kimono-shadow)" stroke-width="6" opacity="0.2" fill="none" />
                    
                    <!-- Hem Shadow -->
                    <path d="M150,1075 Q450,1105 750,1075" stroke="var(--kimono-shadow)" stroke-width="12" opacity="0.5" fill="none" />
                </g>

                <!-- 2. COLLAR (Eri & Tsuzure) - Reconstructed -->
                <g id="collar-group">
                    <!-- Left Collar (Under) - White Lining -->
                    <path d="M320,120 L450,230 L445,235 L315,125 Z" fill="var(--lining-white)" />
                    
                    <!-- Right Collar (Over) - The V shape -->
                    <path d="M450,230 L580,120 L585,125 L455,235 Z" fill="var(--lining-white)" />
                    
                    <!-- Tsuke-komi (The colored edge strip) -->
                    <path d="M320,120 L450,230 L447,233 L317,123 Z" fill="var(--kimono-dark)" />
                    <path d="M450,230 L580,120 L577,123 L447,233 Z" fill="var(--kimono-dark)" />

                    <!-- The Tsuzure (Hanging Edge) - Authentic Detail -->
                    <!-- The right lapel hangs down the chest, crossing the center line -->
                    <path d="M450,230 L470,240 L440,420 L420,410 Z" fill="var(--kimono-base)" filter="url(#inner-shadow)" />
                    <!-- Inner lining of Tsuzure (White) -->
                    <path d="M450,230 L465,239 L440,415 L424,407 Z" fill="var(--lining-white)" />
                    <!-- Edge of Tsuzure -->
                    <path d="M450,230 L470,240 L440,420 L420,410 Z" fill="none" stroke="var(--kimono-dark)" stroke-width="1" />
                </g>

                <!-- 3. OBI (Sash) - Volumetric Taiko Musubi -->
                <!-- Positioned at waist (y=650) -->
                <g id="obi-group">
                    
                    <!-- Main Wrap (Wide Band) -->
                    <!-- Top Highlight -->
                    <path d="M220,650 C350,630 550,630 680,650 L680,665 C550,645 350,645 220,665 Z" fill="var(--obi-light)" />
                    <!-- Base Color -->
                    <path d="M220,665 C350,645 550,645 680,665 L680,765 C550,750 350,750 220,765 Z" fill="var(--obi-base)" />
                    <!-- Bottom Shadow -->
                    <path d="M220,765 C350,750 550,750 680,765 L680,780 C550,765 350,765 220,780 Z" fill="var(--obi-dark)" />

                    <!-- OBI KNOT (Taiko Musubi - Drum Knot) -->
                    <!-- Centered at x=450, y=715 -->
                    <g transform="translate(450, 715)">
                        
                        <!-- OBI DOME (Tails hanging down) -->
                        <path d="M-40,50 C-50,100 -40,160 -20,180 L20,180 C40,160 50,100 40,50 Z" fill="var(--obi-dark)" />
                        <!-- Dome Folds -->
                        <path d="M-20,50 L-20,175" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
                        <path d="M0,50 L0,180" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
                        <path d="M20,50 L20,175" stroke="rgba(255,255,255,0.1)" stroke-width="2" />

                        <!-- Main Knot Body (The Drum) -->
                        <!-- Geometric Shading: Left shadow, Center light, Right shadow -->
                        <!-- Left Shadow Block -->
                        <path d="M-80,-50 L-20,-50 L-20,50 L-80,50 A15,15 0 0,1 -80,-50 Z" fill="var(--obi-dark)" />
                        <!-- Center Highlight Block -->
                        <rect x="-20" y="-50" width="40" height="100" fill="var(--obi-light)" />
                        <!-- Right Shadow Block -->
                        <path d="M20,-50 L80,-50 A15,15 0 0,1 80,50 L20,50 Z" fill="var(--obi-base)" />
                        
                        <!-- Knot Folds/Texture lines -->
                        <path d="M-80,-25 L80,-25" stroke="rgba(0,0,0,0.3)" stroke-width="2" />
                        <path d="M-80,0 L80,0" stroke="rgba(0,0,0,0.3)" stroke-width="2" />
                        <path d="M-80,25 L80,25" stroke="rgba(0,0,0,0.3)" stroke-width="2" />
                        
                        <!-- Gold Accent on Knot (Obi-age peeking out) -->
                        <path d="M-70,-50 L70,-50" stroke="url(#gold-accent)" stroke-width="6" stroke-linecap="round" />
                        <!-- Obijime (Cord) -->
                        <path d="M-75,-10 L75,-10" stroke="#800000" stroke-width="4" stroke-dasharray="2,2" />
                    </g>
                </g>
            </g>
        </svg>

    </div>

    <script>
        // Subtle Parallax on Mouse Move
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 200;
            const y = (window.innerHeight - e.pageY * 2) / 200;
            
            const svg = document.getElementById('kimono-svg');
            svg.style.transform = `translate(${x}px, ${y}px)`;
        });

        // Reset transform when mouse leaves to resume float
        document.addEventListener('mouseleave', () => {
            const svg = document.getElementById('kimono-svg');
            svg.style.transform = `translate(0px, 0px)`;
        });
    </script>
</body>
</html>
