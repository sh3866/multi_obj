<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMONO — Indigo & Vermilion</title>
    <style>
        :root {
            /* Palette: Washi Paper & Sumi Ink */
            --bg-paper: #F2F0E9;
            --ink-black: #1A1A1A;
            --ink-light: #666666;
            
            /* Kimono Colors (Deep Indigo) */
            --kimono-base: #0A192F;
            --kimono-shadow: #050D1A;
            --kimono-highlight: #112240;
            --kimono-accent: #233554;
            
            /* Obi Colors (Vermilion) */
            --obi-base: #C0392B;
            --obi-light: #E74C3C;
            --obi-dark: #8E281D;
            
            /* UI Colors */
            --btn-bg: #C0392B;
            --btn-text: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-paper);
            color: var(--ink-black);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        /* Paper Texture Overlay */
        .texture {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.4;
            z-index: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Layout Container */
        .canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Main SVG */
        #kimono-svg {
            height: 92vh;
            width: auto;
            max-width: 85vw;
            filter: drop-shadow(0px 30px 40px rgba(0,0,0,0.1));
            transition: transform 0.1s ease-out; /* Smooth parallax */
        }

        /* UI / Info Block (Left Aligned) */
        .info-block {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: 10vw; /* Tight to the left edge of the silhouette */
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 280px;
        }

        .label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--ink-light);
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 4rem;
            font-weight: 200; /* Lighter weight */
            line-height: 0.9;
            letter-spacing: -0.03em;
            color: var(--kimono-base); /* Harmonize with garment */
        }

        p.desc {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--ink-light);
            font-weight: 400;
        }

        /* Controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-top: 1rem;
        }

        .btn {
            background: var(--btn-bg);
            border: none;
            color: var(--btn-text);
            padding: 1rem 1.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 2px;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn:hover {
            background: var(--ink-black);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        /* SVG Elements Styling */
        .kimono-body {
            fill: var(--kimono-base);
            transition: fill 0.5s ease;
        }
        
        .kimono-shadow {
            fill: var(--kimono-shadow);
            transition: fill 0.5s ease;
        }

        .kimono-highlight {
            fill: var(--kimono-highlight);
            transition: fill 0.5s ease;
        }

        .obi-body {
            fill: var(--obi-base);
            transition: fill 0.5s ease;
        }
        
        .obi-shadow {
            fill: var(--obi-dark);
            transition: fill 0.5s ease;
        }

        .obi-highlight {
            fill: var(--obi-light);
            transition: fill 0.5s ease;
        }

        /* Pattern Styles */
        .pattern-fill {
            fill: var(--kimono-accent);
            opacity: 0.6;
            transition: opacity 0.5s ease;
        }
        
        .pattern-stroke {
            stroke: #FFFFFF;
            stroke-width: 1.5;
            opacity: 0.8;
            transition: opacity 0.5s ease;
        }

        .pattern-hidden {
            opacity: 0 !important;
        }

        /* Animation */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .floating {
            animation: float 8s ease-in-out infinite;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .info-block {
                position: relative;
                top: auto;
                left: auto;
                transform: none;
                width: 90%;
                text-align: center;
                align-items: center;
                margin-top: 2rem;
            }
            
            .canvas-container {
                flex-direction: column;
            }

            h1 { font-size: 3rem; }
            
            .controls {
                flex-direction: row;
            }
            
            .btn { text-align: center; }
        }
    </style>
</head>
<body>

    <div class="texture"></div>

    <div class="canvas-container">
        
        <!-- UI Overlay: Left Aligned -->
        <div class="info-block">
            <div class="label">Masterpiece Series — No. 04</div>
            <h1>INDIGO<br>&<br>VERMILION</h1>
            <p class="desc">
                A digital reconstruction of the <strong>Kosode</strong>. 
                Featuring the <em>Tsuzure</em> collar overlap, 
                detached <em>Sode</em> sleeves, and a <em>Seigaiha</em> wave motif.
            </p>
            <div class="controls">
                <button class="btn" onclick="togglePattern()">Toggle Pattern</button>
                <button class="btn" onclick="toggleColor()">Change Hue</button>
            </div>
        </div>

        <!-- SVG KIMONO -->
        <svg id="kimono-svg" class="floating" viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Gradients for Depth -->
                <linearGradient id="body-grad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="var(--kimono-highlight)" />
                    <stop offset="30%" stop-color="var(--kimono-base)" />
                    <stop offset="100%" stop-color="var(--kimono-shadow)" />
                </linearGradient>

                <linearGradient id="obi-wrap-grad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="var(--obi-light)" />
                    <stop offset="50%" stop-color="var(--obi-base)" />
                    <stop offset="100%" stop-color="var(--obi-dark)" />
                </linearGradient>

                <!-- Pattern: Seigaiha (Concentric Waves) -->
                <pattern id="pattern-seigaiha" x="0" y="0" width="40" height="80" patternUnits="userSpaceOnUse">
                    <path d="M0,40 A20,20 0 0,1 40,40" fill="none" class="pattern-stroke" />
                    <path d="M0,55 A20,20 0 0,1 40,55" fill="none" class="pattern-stroke" />
                    <path d="M0,70 A20,20 0 0,1 40,70" fill="none" class="pattern-stroke" />
                    <!-- Fill between waves for contrast -->
                    <path d="M0,40 A20,20 0 0,1 40,40 L40,55 A20,20 0 0,0 0,55 Z" class="pattern-fill" />
                    <path d="M0,70 A20,20 0 0,1 40,70 L40,85 A20,20 0 0,0 0,85 Z" class="pattern-fill" />
                </pattern>

                <!-- Clip Paths for Pattern Isolation -->
                <clipPath id="body-clip">
                    <!-- Boxy Silhouette -->
                    <path d="M220,150 L380,150 L380,880 L220,880 Z" />
                </clipPath>
                
                <clipPath id="sleeve-clip-left">
                    <!-- Detached Sleeve -->
                    <path d="M180,150 L80,150 L80,500 L180,500 Z" />
                </clipPath>

                <clipPath id="sleeve-clip-right">
                    <!-- Detached Sleeve -->
                    <path d="M420,150 L520,150 L520,500 L420,500 Z" />
                </clipPath>
            </defs>

            <g id="garment-group">
                
                <!-- 1. Left Sleeve (Detached, Boxy) -->
                <g id="left-sleeve">
                    <rect x="80" y="150" width="100" height="350" fill="url(#body-grad)" />
                    <!-- Pattern Overlay -->
                    <rect x="0" y="0" width="600" height="900" class="pattern-layer" clip-path="url(#sleeve-clip-left)" fill="url(#pattern-seigaiha)" />
                    <!-- Inner Shadow (Depth) -->
                    <rect x="180" y="150" width="10" height="350" fill="var(--kimono-shadow)" opacity="0.5" />
                </g>

                <!-- 2. Right Sleeve (Detached, Boxy) -->
                <g id="right-sleeve">
                    <rect x="420" y="150" width="100" height="350" fill="url(#body-grad)" />
                    <!-- Pattern Overlay -->
                    <rect x="0" y="0" width="600" height="900" class="pattern-layer" clip-path="url(#sleeve-clip-right)" fill="url(#pattern-seigaiha)" />
                    <!-- Inner Shadow (Depth) -->
                    <rect x="420" y="150" width="10" height="350" fill="var(--kimono-shadow)" opacity="0.5" />
                </g>

                <!-- 3. Main Body (Torso & Skirt) - Boxy Cut -->
                <g id="main-body">
                    <!-- Base Shape -->
                    <path d="M220,150 L380,150 L380,880 L220,880 Z" fill="url(#body-grad)" />
                    
                    <!-- Main Pattern Overlay -->
                    <rect x="0" y="0" width="600" height="900" class="pattern-layer" clip-path="url(#body-clip)" fill="url(#pattern-seigaiha)" />

                    <!-- Natural Folds (Shadow lines) -->
                    <path d="M220,150 L220,880" stroke="var(--kimono-shadow)" stroke-width="4" opacity="0.6" />
                    <path d="M380,150 L380,880" stroke="var(--kimono-shadow)" stroke-width="4" opacity="0.6" />
                    <path d="M260,150 L260,880" stroke="var(--kimono-shadow)" stroke-width="2" opacity="0.3" />
                    <path d="M340,150 L340,880" stroke="var(--kimono-shadow)" stroke-width="2" opacity="0.3" />
                </g>

                <!-- 4. Collar (Eri & Tsuzure) -->
                <g id="collar-group">
                    <!-- Left Collar (Under) - White/Contrast -->
                    <path d="M220,150 L280,210 L270,220 L210,160 Z" fill="#FFFFFF" />
                    
                    <!-- Right Collar (Over) - The V shape -->
                    <path d="M280,210 L380,150 L390,160 L290,220 Z" fill="#FFFFFF" />
                    
                    <!-- Tsuke-komi (The colored edge strip) -->
                    <path d="M220,150 L280,210 L278,213 L218,153 Z" fill="var(--obi-base)" />
                    <path d="M280,210 L380,150 L378,153 L278,213 Z" fill="var(--obi-base)" />

                    <!-- The Tsuzure (Hanging Edge) - Authentic Detail -->
                    <!-- Right side crosses OVER left side -->
                    <path d="M280,210 L290,220 L270,320 L260,310 Z" fill="var(--kimono-base)" />
                    <path d="M280,210 L290,220 L270,320 L260,310 Z" fill="var(--kimono-shadow)" opacity="0.5" />
                </g>

                <!-- 5. OBI (Sash) - Taiko Musubi (Drum Knot) -->
                <g id="obi-group">
                    <!-- Main Wrap (Wide Band) -->
                    <path d="M135,550 C180,530 220,520 300,520 C380,520 420,530 465,550 L465,650 C420,630 380,620 300,620 C220,620 180,630 135,650 Z" 
                          fill="url(#obi-wrap-grad)" />
                    
                    <!-- Wrap Folds (Texture) -->
                    <path d="M140,560 Q300,540 460,560" stroke="rgba(0,0,0,0.1)" stroke-width="1" fill="none" />
                    <path d="M138,580 Q300,560 462,580" stroke="rgba(0,0,0,0.1)" stroke-width="1" fill="none" />
                    <path d="M136,600 Q300,580 464,600" stroke="rgba(0,0,0,0.1)" stroke-width="1" fill="none" />

                    <!-- OBI KNOT (Taiko Style - Back bulk) -->
                    <g transform="translate(300, 590)">
                        <!-- Main Knot Body (The Drum) -->
                        <rect x="-60" y="-40" width="120" height="80" rx="10" fill="var(--obi-dark)" />
                        <!-- Knot Highlights/Folds -->
                        <path d="M-60,-20 L60,-20" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
                        <path d="M-60,0 L60,0" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
                        <path d="M-60,20 L60,20" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
                        
                        <!-- OBI DOME (Tails hanging down) -->
                        <path d="M-40,40 C-50,80 -40,120 -20,140 L20,140 C40,120 50,80 40,40 Z" fill="var(--obi-dark)" />
                        <!-- Dome Folds -->
                        <path d="M-20,40 L-20,130" stroke="rgba(0,0,0,0.2)" stroke-width="1" />
                        <path d="M0,40 L0,140" stroke="rgba(0,0,0,0.2)" stroke-width="1" />
                        <path d="M20,40 L20,130" stroke="rgba(0,0,0,0.2)" stroke-width="1" />
                        
                        <!-- Gold Accent on Knot (Obi-age peeking out) -->
                        <path d="M-50,-40 L50,-40" stroke="var(--kimono-accent)" stroke-width="4" />
                    </g>
                </g>
            </g>
        </svg>

    </div>

    <script>
        // State
        let isPatternVisible = true;
        let isIndigo = true;
        
        // DOM Elements
        const root = document.documentElement;
        const patternLayers = document.querySelectorAll('.pattern-layer');

        // Toggle Pattern Visibility
        function togglePattern() {
            isPatternVisible = !isPatternVisible;
            patternLayers.forEach(layer => {
                if (isPatternVisible) {
                    layer.classList.remove('pattern-hidden');
                } else {
                    layer.classList.add('pattern-hidden');
                }
            });
        }

        // Toggle Color Palette (Indigo vs. Black/Gold)
        function toggleColor() {
            if (isIndigo) {
                // Switch to Black & Gold
                root.style.setProperty('--kimono-base', '#111111');
                root.style.setProperty('--kimono-highlight', '#222222');
                root.style.setProperty('--kimono-shadow', '#000000');
                root.style.setProperty('--kimono-accent', '#333333');
                
                root.style.setProperty('--obi-base', '#D4AF37'); // Gold
                root.style.setProperty('--obi-light', '#F2D06B');
                root.style.setProperty('--obi-dark', '#997B2F');
                
                // Update Pattern Colors
                document.querySelector('.pattern-fill').style.fill = '#333333';
                document.querySelector('.pattern-stroke').style.stroke = '#D4AF37';
                
                // Update UI Button Color to match
                root.style.setProperty('--btn-bg', '#D4AF37');
                root.style.setProperty('--btn-text', '#000000');

            } else {
                // Switch back to Indigo & Vermilion
                root.style.setProperty('--kimono-base', '#0A192F');
                root.style.setProperty('--kimono-highlight', '#112240');
                root.style.setProperty('--kimono-shadow', '#050D1A');
                root.style.setProperty('--kimono-accent', '#233554');
                
                root.style.setProperty('--obi-base', '#C0392B');
                root.style.setProperty('--obi-light', '#E74C3C');
                root.style.setProperty('--obi-dark', '#8E281D');

                // Reset Pattern Colors
                document.querySelector('.pattern-fill').style.fill = '#233554';
                document.querySelector('.pattern-stroke').style.stroke = '#FFFFFF';

                // Reset UI Button Color
                root.style.setProperty('--btn-bg', '#C0392B');
                root.style.setProperty('--btn-text', '#FFFFFF');
            }
            isIndigo = !isIndigo;
        }

        // Subtle Parallax on Mouse Move
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 150;
            const y = (window.innerHeight - e.pageY * 2) / 150;
            
            const svg = document.getElementById('kimono-svg');
            // Apply transform while maintaining the CSS animation class logic
            // We modify the transform property directly, but since the animation
            // uses translateY, we combine them. However, simple inline transform
            // overrides animation. To keep the "float", we rely on the container
            // or just accept that parallax overrides the float during interaction.
            // For a better feel, we'll just shift the SVG slightly.
            svg.style.transform = `translate(${x}px, ${y}px)`;
        });

    </script>
</body>
</html>
