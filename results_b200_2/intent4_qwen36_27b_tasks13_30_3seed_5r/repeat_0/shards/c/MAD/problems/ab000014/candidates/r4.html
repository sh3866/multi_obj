<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMONO — The Vermilion Wave</title>
    <style>
        :root {
            /* Palette: Washi Paper & Deep Ink */
            --bg-paper: #F0EEDC;
            --bg-texture: #E6E3D4;
            --ink-black: #121212;
            --ink-light: #555555;
            
            /* Kimono Colors (Vermilion & White) */
            --kimono-base: #B22222; /* Firebrick Red */
            --kimono-dark: #8B0000; /* Dark Red */
            --kimono-shadow: #5A0000; /* Deepest Shadow */
            
            /* Obi Colors (Deep Indigo to contrast Red) */
            --obi-base: #1C2833;
            --obi-light: #2E4053;
            --obi-dark: #0A1118;
            --obi-gold: #D4AF37;

            /* Lining */
            --lining-white: #F9F9F9;
            --lining-shadow: #DDDDDD;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-paper);
            color: var(--ink-black);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        /* Paper Texture Overlay */
        .texture {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.6;
            z-index: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.5'/%3E%3C/svg%3E");
        }

        /* Layout Container */
        .canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Main SVG */
        #kimono-svg {
            height: 95vh;
            width: auto;
            max-width: 90vw;
            /* Soft shadow for depth */
            filter: drop-shadow(0px 15px 25px rgba(0,0,0,0.15));
            transition: transform 0.1s ease-out; 
        }

        /* UI / Info Block (Left Aligned) */
        .info-block {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: 6vw;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 0; /* Tighter gap */
            width: 260px;
            pointer-events: none;
        }

        /* Typography Polish: Accent Line */
        .accent-line {
            width: 2px;
            background-color: var(--kimono-base);
            height: 100%; /* Full height of text block */
            position: absolute;
            left: -1.5rem;
            top: 0;
            display: block;
        }

        .label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--kimono-base);
            margin-bottom: 0.5rem;
            padding-left: 1rem;
        }

        h1 {
            font-size: 3.2rem;
            font-weight: 400; /* Thinner for elegance */
            line-height: 0.9;
            letter-spacing: -0.04em; /* Tighter tracking */
            color: var(--kimono-dark);
            margin-bottom: 1.2rem;
            padding-left: 1rem;
        }

        p.desc {
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--ink-light);
            font-weight: 400;
            padding-left: 1rem;
            border-left: none; /* Moved to accent-line */
            max-width: 220px;
        }

        /* Animation */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .floating {
            animation: float 7s ease-in-out infinite;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .info-block {
                position: relative;
                top: auto;
                left: auto;
                transform: none;
                width: 80%;
                text-align: left;
                align-items: flex-start;
                margin-top: 1rem;
                margin-bottom: 2rem;
            }
            
            .accent-line {
                left: 0;
                height: 100%;
            }
            
            .canvas-container {
                flex-direction: column;
            }

            h1 { font-size: 2.5rem; }
            #kimono-svg { height: 70vh; }
        }
    </style>
</head>
<body>

    <div class="texture"></div>

    <div class="canvas-container">
        
        <!-- UI Overlay: Left Aligned -->
        <div class="info-block">
            <div class="accent-line"></div>
            <div class="label">Traditional Garment</div>
            <h1>VERMILION<br>WAVE</h1>
            <p class="desc">
                A digital reconstruction of the <strong>Kosode</strong>. 
                Featuring the <em>Tsuzure</em> collar overlap, 
                continuous <em>Sode</em> sleeves, and a <em>Seigaiha</em> wave motif.
            </p>
        </div>

        <!-- SVG KIMONO -->
        <!-- ViewBox expanded to fit full height (1100) and width (800) -->
        <svg id="kimono-svg" class="floating" viewBox="0 0 800 1100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Pattern: Seigaiha (Concentric Waves) -->
                <!-- Redefined to use White and Dark Red for contrast on Red base -->
                <pattern id="pattern-seigaiha" x="0" y="0" width="40" height="80" patternUnits="userSpaceOnUse">
                    <!-- Main Wave Arc -->
                    <path d="M0,40 A20,20 0 0,1 40,40" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />
                    <!-- Inner Wave Arc -->
                    <path d="M0,55 A20,20 0 0,1 40,55" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />
                    <!-- Fill between waves -->
                    <path d="M0,40 A20,20 0 0,1 40,40 L40,55 A20,20 0 0,0 0,55 Z" fill="var(--kimono-dark)" opacity="0.4" />
                </pattern>

                <!-- 
                     UNIFIED CLIP PATH 
                     This path defines the ENTIRE kimono from shoulder to hem.
                     It includes the T-shaped sleeves and the wide skirt.
                -->
                <clipPath id="kimono-silhouette">
                    <path d="
                        M 320,150 
                        C 300,150 280,160 270,180 
                        L 180,190 
                        L 180,500 
                        L 280,500 
                        L 280,1050 
                        L 520,1050 
                        L 520,500 
                        L 620,500 
                        L 620,190 
                        L 530,180 
                        C 520,160 500,150 480,150 
                        Z" 
                    />
                </clipPath>

                <!-- 
                     COLLAR CLIP PATH 
                     To keep the collar edge clean and prevent pattern bleeding 
                -->
                <clipPath id="collar-clip">
                    <path d="M300,160 L400,160 L400,350 L300,350 Z" />
                </clipPath>
            </defs>

            <g id="garment-group" transform="translate(40, 20)">
                
                <!-- 1. MAIN BODY (Unified Silhouette with Pattern) -->
                <!-- The base shape is drawn once, then filled with color and pattern -->
                <g id="main-body">
                    <!-- Base Color Shape (Red) -->
                    <path d="
                        M 320,150 
                        C 300,150 280,160 270,180 
                        L 180,190 
                        L 180,500 
                        L 280,500 
                        L 280,1050 
                        L 520,1050 
                        L 520,500 
                        L 620,500 
                        L 620,190 
                        L 530,180 
                        C 520,160 500,150 480,150 
                        Z" 
                        fill="var(--kimono-base)" 
                    />
                    
                    <!-- Continuous Pattern Overlay masked to the silhouette -->
                    <rect x="0" y="0" width="800" height="1100" 
                          fill="url(#pattern-seigaiha)" 
                          clip-path="url(#kimono-silhouette)" 
                    />

                    <!-- Structural Folds (Shadows) -->
                    <!-- Sleeve to Body transitions (Underarm shadows) -->
                    <path d="M280,190 L280,500" stroke="var(--kimono-shadow)" stroke-width="6" opacity="0.3" />
                    <path d="M520,190 L520,500" stroke="var(--kimono-shadow)" stroke-width="6" opacity="0.3" />
                    
                    <!-- Skirt Folds (Vertical Drape) -->
                    <path d="M320,500 L320,1050" stroke="var(--kimono-shadow)" stroke-width="3" opacity="0.2" />
                    <path d="M480,500 L480,1050" stroke="var(--kimono-shadow)" stroke-width="3" opacity="0.2" />
                    <!-- Center Front Shadow -->
                    <path d="M400,500 L400,1050" stroke="var(--kimono-shadow)" stroke-width="2" opacity="0.15" />
                    
                    <!-- Hem shadow -->
                    <path d="M280,1040 L520,1040" stroke="var(--kimono-shadow)" stroke-width="8" opacity="0.4" />
                </g>

                <!-- 2. COLLAR (Eri & Tsuzure) - Reconstructed for continuity -->
                <g id="collar-group">
                    <!-- Left Collar (Under) - White Lining (Nagajuban) -->
                    <!-- This path creates the 'V' depth -->
                    <path d="M320,150 L400,220 L395,225 L315,155 Z" fill="var(--lining-white)" />
                    
                    <!-- Right Collar (Over) - The V shape -->
                    <!-- This crosses over the left collar -->
                    <path d="M400,220 L480,150 L485,155 L405,225 Z" fill="var(--lining-white)" />
                    
                    <!-- Tsuke-komi (The colored edge strip) -->
                    <!-- Left edge (Red border on white) -->
                    <path d="M320,150 L400,220 L397,223 L317,153 Z" fill="var(--kimono-dark)" />
                    <!-- Right edge (Red border on white) -->
                    <path d="M400,220 L480,150 L477,153 L397,223 Z" fill="var(--kimono-dark)" />

                    <!-- The Tsuzure (Hanging Edge) - Authentic Detail -->
                    <!-- The right lapel hangs down the chest, crossing the center line -->
                    <path d="M400,220 L415,230 L390,360 L375,350 Z" fill="var(--kimono-base)" />
                    <!-- Inner lining of Tsuzure (White) -->
                    <path d="M400,220 L412,229 L389,355 L379,347 Z" fill="var(--lining-white)" />
                    <!-- Shadow on the Tsuzure to show it's a separate layer -->
                    <path d="M400,220 L415,230 L390,360 L375,350 Z" fill="var(--kimono-shadow)" opacity="0.5" />
                </g>

                <!-- 3. OBI (Sash) - Re-aligned to Waist (y=600) -->
                <!-- Geometric shading replacing glossy gradients -->
                <g id="obi-group" transform="translate(0, 100)"> <!-- Moved down visually -->
                    
                    <!-- Main Wrap (Wide Band) -->
                    <!-- Using flat blocks of color for geometric shading -->
                    <!-- Top Highlight -->
                    <path d="M240,600 C300,580 500,580 560,600 L560,615 C500,595 300,595 240,615 Z" fill="var(--obi-light)" />
                    <!-- Base Color -->
                    <path d="M240,615 C300,595 500,595 560,615 L560,715 C500,700 300,700 240,715 Z" fill="var(--obi-base)" />
                    <!-- Bottom Shadow -->
                    <path d="M240,715 C300,700 500,700 560,715 L560,730 C500,710 300,710 240,730 Z" fill="var(--obi-dark)" />

                    <!-- Wrap Folds (Texture - Horizontal lines) -->
                    <path d="M250,630 Q400,615 550,630" stroke="rgba(255,255,255,0.1)" stroke-width="2" fill="none" />
                    <path d="M245,660 Q400,645 555,660" stroke="rgba(255,255,255,0.1)" stroke-width="2" fill="none" />
                    <path d="M242,690 Q400,675 558,690" stroke="rgba(255,255,255,0.1)" stroke-width="2" fill="none" />

                    <!-- OBI KNOT (Taiko Musubi - Drum Knot) -->
                    <!-- Centered at x=400, y=665 -->
                    <g transform="translate(400, 665)">
                        
                        <!-- OBI DOME (Tails hanging down - drawn first so they go behind the knot) -->
                        <!-- Geometric shading: Left shadow, Center light, Right shadow -->
                        <path d="M-30,40 C-40,80 -30,120 -15,140 L15,140 C30,120 40,80 30,40 Z" fill="var(--obi-dark)" />
                        <!-- Dome Folds -->
                        <path d="M-15,40 L-15,135" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
                        <path d="M0,40 L0,140" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
                        <path d="M15,40 L15,135" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

                        <!-- Main Knot Body (The Drum) -->
                        <!-- Geometric Shading: Left block, Center block, Right block -->
                        <!-- Left Shadow Block -->
                        <path d="M-60,-40 L-20,-40 L-20,40 L-60,40 A12,12 0 0,1 -60,-40 Z" fill="var(--obi-dark)" />
                        <!-- Center Highlight Block -->
                        <rect x="-20" y="-40" width="40" height="80" fill="var(--obi-light)" />
                        <!-- Right Shadow Block -->
                        <path d="M20,-40 L60,-40 A12,12 0 0,1 60,40 L20,40 Z" fill="var(--obi-base)" />
                        
                        <!-- Knot Folds/Texture lines -->
                        <path d="M-60,-20 L60,-20" stroke="rgba(0,0,0,0.2)" stroke-width="1" />
                        <path d="M-60,0 L60,0" stroke="rgba(0,0,0,0.2)" stroke-width="1" />
                        <path d="M-60,20 L60,20" stroke="rgba(0,0,0,0.2)" stroke-width="1" />
                        
                        <!-- Gold Accent on Knot (Obi-age peeking out) -->
                        <path d="M-50,-40 L50,-40" stroke="var(--obi-gold)" stroke-width="4" stroke-linecap="round" />
                    </g>
                </g>
            </g>
        </svg>

    </div>

    <script>
        // Subtle Parallax on Mouse Move
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 150;
            const y = (window.innerHeight - e.pageY * 2) / 150;
            
            const svg = document.getElementById('kimono-svg');
            // Apply transform. Note: This overrides the CSS 'floating' animation 
            // momentarily, but provides a more interactive "showcase" feel.
            // We combine the parallax with the base position.
            svg.style.transform = `translate(${x}px, ${y}px)`;
        });

        // Reset transform when mouse leaves to resume float
        document.addEventListener('mouseleave', () => {
            const svg = document.getElementById('kimono-svg');
            svg.style.transform = `translate(0px, 0px)`;
        });
    </script>
</body>
</html>
