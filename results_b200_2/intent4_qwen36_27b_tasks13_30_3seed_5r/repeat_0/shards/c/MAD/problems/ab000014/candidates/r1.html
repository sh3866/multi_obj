<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMONO — Masterpiece Series</title>
    <style>
        :root {
            /* Palette: Washi Paper & Sumi Ink */
            --bg-paper: #F2F0E9;
            --bg-noise: #D8D6CE;
            --ink-black: #1A1A1A;
            --ink-light: #555555;
            
            /* Kimono Colors (Indigo Theme Default) */
            --kimono-base: #1B3B4F;
            --kimono-highlight: #2A5570;
            --kimono-shadow: #0F2430;
            
            /* Obi Colors (Vermilion Default) */
            --obi-base: #B23A3A;
            --obi-highlight: #D65454;
            --obi-shadow: #7A2222;
            
            /* Accents */
            --gold: #D4AF37;
            --collar-red: #8B2E2E; /* The Tsuke-komi edge */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-paper);
            color: var(--ink-black);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        /* Paper Texture Overlay */
        .texture {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.4;
            z-index: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Layout Container */
        .canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Main SVG */
        #kimono-svg {
            height: 95vh;
            width: auto;
            max-width: 80vw;
            filter: drop-shadow(0px 20px 30px rgba(0,0,0,0.15));
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* UI / Info Block (Bottom Left) */
        .info-block {
            position: absolute;
            bottom: 3rem;
            left: 3rem;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 320px;
        }

        .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--ink-light);
            border-top: 1px solid var(--ink-light);
            padding-top: 0.5rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 300;
            line-height: 1;
            letter-spacing: -0.02em;
            color: var(--ink-black);
        }

        p.desc {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #444;
            font-weight: 300;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--ink-black);
            color: var(--ink-black);
            padding: 0.6rem 1.2rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 50px;
        }

        .btn:hover {
            background: var(--ink-black);
            color: var(--bg-paper);
        }

        /* SVG Elements Styling */
        .kimono-body {
            fill: var(--kimono-base);
            transition: fill 0.5s ease;
        }
        
        .kimono-shadow-area {
            fill: var(--kimono-shadow);
            transition: fill 0.5s ease;
        }

        .kimono-highlight-area {
            fill: var(--kimono-highlight);
            transition: fill 0.5s ease;
        }

        .obi-body {
            fill: var(--obi-base);
            transition: fill 0.5s ease;
        }
        
        .obi-shadow-area {
            fill: var(--obi-shadow);
            transition: fill 0.5s ease;
        }

        .pattern-overlay {
            fill: url(#pattern-momiji);
            opacity: 0.15;
            mix-blend-mode: soft-light;
            transition: opacity 0.5s ease;
        }

        .pattern-active {
            opacity: 0.35;
            mix-blend-mode: screen;
        }

        /* Animation */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .floating {
            animation: float 6s ease-in-out infinite;
        }

    </style>
</head>
<body>

    <div class="texture"></div>

    <div class="canvas-container">
        
        <!-- SVG KIMONO -->
        <!-- viewBox adjusted to center the garment vertically -->
        <svg id="kimono-svg" class="floating" viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Gradients for Organic Fabric Drape -->
                <linearGradient id="body-grad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="var(--kimono-base)" />
                    <stop offset="40%" stop-color="var(--kimono-highlight)" />
                    <stop offset="100%" stop-color="var(--kimono-shadow)" />
                </linearGradient>

                <linearGradient id="obi-grad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="var(--obi-highlight)" />
                    <stop offset="30%" stop-color="var(--obi-base)" />
                    <stop offset="100%" stop-color="var(--obi-shadow)" />
                </linearGradient>

                <!-- Pattern: Momiji (Maple Leaf) Stylized -->
                <pattern id="pattern-momiji" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
                    <path d="M30,10 Q35,20 45,25 Q35,30 35,40 Q30,35 25,40 Q25,30 15,25 Q25,20 30,10 Z" fill="var(--gold)" opacity="0.8" />
                    <path d="M30,38 L30,50" stroke="var(--gold)" stroke-width="1" opacity="0.6" />
                </pattern>

                <!-- Clip Paths for Pattern Isolation -->
                <clipPath id="body-clip">
                    <path d="M220,160 C220,160 200,180 190,220 C160,250 140,400 140,800 C140,820 160,830 170,830 L430,830 C440,830 460,820 460,800 C460,400 440,250 410,220 C400,180 380,160 380,160 Z" />
                </clipPath>
                
                <clipPath id="sleeve-clip">
                    <path d="M220,160 C220,160 200,180 190,220 C160,250 140,400 140,800 C140,820 160,830 170,830 L430,830 C440,830 460,820 460,800 C460,400 440,250 410,220 C400,180 380,160 380,160 Z" />
                </clipPath>
            </defs>

            <g id="garment-group">
                <!-- 1. Left Sleeve (Organic T-Shape) -->
                <g id="left-sleeve">
                    <!-- Sleeve Body -->
                    <path d="M190,220 
                             C150,240 80,250 60,280 
                             C50,300 50,380 60,400 
                             C80,420 150,410 170,380 
                             C180,360 190,300 190,220 Z" 
                          fill="url(#body-grad)" />
                    <!-- Sleeve Shadow (Depth) -->
                    <path d="M60,280 C50,300 50,380 60,400 C80,420 150,410 170,380 C160,360 140,320 140,320 C100,340 70,340 60,300 Z" fill="var(--kimono-shadow)" opacity="0.4"/>
                    <!-- Sleeve Pattern -->
                    <rect x="0" y="0" width="600" height="900" class="pattern-overlay" clip-path="url(#sleeve-clip)" transform="translate(-50, 0) scale(0.6)"/>
                </g>

                <!-- 2. Right Sleeve -->
                <g id="right-sleeve">
                    <!-- Sleeve Body -->
                    <path d="M410,220 
                             C450,240 520,250 540,280 
                             C550,300 550,380 540,400 
                             C520,420 450,410 430,380 
                             C420,360 410,300 410,220 Z" 
                          fill="url(#body-grad)" />
                    <!-- Sleeve Shadow -->
                    <path d="M540,280 C550,300 550,380 540,400 C520,420 450,410 430,380 C440,360 460,320 460,320 C500,340 530,340 540,300 Z" fill="var(--kimono-shadow)" opacity="0.4"/>
                    <!-- Sleeve Pattern -->
                    <rect x="0" y="0" width="600" height="900" class="pattern-overlay" clip-path="url(#sleeve-clip)" transform="translate(250, 0) scale(0.6)"/>
                </g>

                <!-- 3. Main Body (Torso & Skirt) -->
                <g id="main-body">
                    <!-- Base Shape with Curved Hem -->
                    <path d="M220,160 
                             C200,180 190,220 190,220 
                             C160,250 140,400 140,800 
                             C140,820 160,830 170,830 
                             L430,830 
                             C440,830 460,820 460,800 
                             C460,400 440,250 410,220 
                             C400,180 380,160 380,160 Z" 
                          fill="url(#body-grad)" />
                    
                    <!-- Main Pattern Overlay -->
                    <rect x="0" y="0" width="600" height="900" class="pattern-overlay" clip-path="url(#body-clip)" />

                    <!-- Natural Folds (Bezier Curves) -->
                    <path d="M220,160 Q200,500 170,830" stroke="rgba(0,0,0,0.15)" stroke-width="2" fill="none" />
                    <path d="M380,160 Q400,500 430,830" stroke="rgba(0,0,0,0.15)" stroke-width="2" fill="none" />
                    <path d="M250,450 Q300,500 350,450" stroke="rgba(0,0,0,0.05)" stroke-width="4" fill="none" /> <!-- Waist drape -->
                </g>

                <!-- 4. Collar (Eri & Tsuzure) -->
                <g id="collar-group">
                    <!-- Left Collar (Under) -->
                    <path d="M220,160 L280,210 L270,220 L210,170 Z" fill="var(--kimono-shadow)" />
                    
                    <!-- Right Collar (Over) - The V shape -->
                    <path d="M280,210 L380,160 L390,170 L290,220 Z" fill="var(--kimono-base)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
                    
                    <!-- The Tsuzure (Hanging Edge) - Authentic Detail -->
                    <!-- This is the small triangular flap that hangs down the chest -->
                    <path d="M280,210 L290,220 L270,320 L260,310 Z" fill="var(--collar-red)" />
                    <path d="M280,210 L290,220 L270,320 L260,310 Z" fill="rgba(0,0,0,0.1)" /> <!-- Shadow on flap -->
                </g>

                <!-- 5. OBI (Sash) -->
                <g id="obi-group">
                    <!-- Main Wrap -->
                    <path d="M142,480 C180,460 220,450 300,450 C380,450 420,460 458,480 L455,540 C420,520 380,510 300,510 C220,510 180,520 145,540 Z" 
                          fill="url(#obi-grad)" />
                    
                    <!-- Wrap Folds (Texture) -->
                    <path d="M150,490 L450,490" stroke="rgba(0,0,0,0.1)" stroke-width="1" />
                    <path d="M148,500 L452,500" stroke="rgba(0,0,0,0.1)" stroke-width="1" />
                    <path d="M146,510 L454,510" stroke="rgba(0,0,0,0.1)" stroke-width="1" />
                    <path d="M145,520 L455,520" stroke="rgba(0,0,0,0.1)" stroke-width="1" />

                    <!-- OBI KNOT (Taiko Style - Back bulk) -->
                    <!-- Centered around X=300, Y=490 -->
                    <g transform="translate(300, 500)">
                        <!-- Main Knot Body -->
                        <path d="M-45,0 C-50,-30 -40,-50 0,-50 C40,-50 50,-30 45,0 C50,30 40,50 0,50 C-40,50 -50,30 -45,0 Z" 
                              fill="var(--obi-shadow)" />
                        <!-- Knot Highlights -->
                        <path d="M-40,-10 C-40,-30 0,-40 0,-40 C0,-40 40,-30 40,-10" stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none"/>
                        
                        <!-- OBI DOME (Tails hanging down) -->
                        <path d="M-30,20 C-35,60 -25,100 -15,120 L15,120 C25,100 35,60 30,20 Z" fill="var(--obi-shadow)" />
                        
                        <!-- Gold Accent on Knot -->
                        <path d="M-20,-20 L20,-20 M-20,0 L20,0 M-20,20 L20,20" stroke="var(--gold)" stroke-width="1.5" opacity="0.6" />
                    </g>
                </g>
            </g>
        </svg>

        <!-- UI Overlay -->
        <div class="info-block">
            <div>
                <div class="label">Collection 2024 — Kyoto</div>
                <h1>INDIGO<br>&<br>VERMILION</h1>
            </div>
            <p class="desc">
                A digital reconstruction of the traditional *kosode*. 
                Featuring the <em>Tsuzure</em> collar overlap and a 
                nature-inspired geometric pattern inspired by falling maple leaves.
            </p>
            <div class="controls">
                <button class="btn" onclick="togglePattern()">Toggle Pattern</button>
                <button class="btn" onclick="toggleColor()">Change Hue</button>
            </div>
        </div>

    </div>

    <script>
        // State
        let isPatternVisible = true;
        let isIndigo = true;
        
        // DOM Elements
        const root = document.documentElement;
        const patternLayers = document.querySelectorAll('.pattern-overlay');
        const kimonoSvg = document.getElementById('kimono-svg');

        // Toggle Pattern Visibility
        function togglePattern() {
            isPatternVisible = !isPatternVisible;
            patternLayers.forEach(layer => {
                if (isPatternVisible) {
                    layer.classList.add('pattern-active');
                    layer.style.opacity = '0.35';
                } else {
                    layer.classList.remove('pattern-active');
                    layer.style.opacity = '0';
                }
            });
        }

        // Toggle Color Palette (Indigo vs. Midnight/Gold)
        function toggleColor() {
            if (isIndigo) {
                // Switch to Midnight Black & Gold
                root.style.setProperty('--kimono-base', '#1a1a1a');
                root.style.setProperty('--kimono-highlight', '#2a2a2a');
                root.style.setProperty('--kimono-shadow', '#050505');
                
                root.style.setProperty('--obi-base', '#D4AF37'); // Gold Obi
                root.style.setProperty('--obi-highlight', '#F2D06B');
                root.style.setProperty('--obi-shadow', '#8a701e');
                
                // Adjust pattern color to fit dark theme
                document.querySelector('#pattern-momiji path').setAttribute('fill', '#F2D06B');
            } else {
                // Switch back to Indigo & Vermilion
                root.style.setProperty('--kimono-base', '#1B3B4F');
                root.style.setProperty('--kimono-highlight', '#2A5570');
                root.style.setProperty('--kimono-shadow', '#0F2430');
                
                root.style.setProperty('--obi-base', '#B23A3A');
                root.style.setProperty('--obi-highlight', '#D65454');
                root.style.setProperty('--obi-shadow', '#7A2222');

                // Reset pattern color
                document.querySelector('#pattern-momiji path').setAttribute('fill', '#D4AF37');
            }
            isIndigo = !isIndigo;
        }

        // Subtle Parallax on Mouse Move
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 100;
            const y = (window.innerHeight - e.pageY * 2) / 100;
            
            // Apply transform while maintaining the CSS animation class logic
            // Note: Applying inline transform overrides CSS animation, 
            // so we rely on the 'floating' class for the idle animation 
            // and only apply parallax if mouse is active, or keep it subtle.
            
            // To avoid conflict with the 'floating' animation, we shift the container slightly
            // instead of the SVG directly, or just let the breathing animation handle the life.
            // Let's keep it simple: Parallax on the container.
            const container = document.querySelector('.canvas-container');
            container.style.transform = `translate(${x}px, ${y}px)`;
        });

    </script>
</body>
</html>
