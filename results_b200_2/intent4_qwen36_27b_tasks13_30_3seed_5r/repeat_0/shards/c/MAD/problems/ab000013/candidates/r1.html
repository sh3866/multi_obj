<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Urban Auto Rickshaw — Vector Showcase</title>
<style>
  :root {
    --bg: #f4f1ea;
    --text-main: #1a1a1a;
    --text-muted: #666666;
    --taxi-yellow: #FFC300;
    --taxi-yellow-light: #FFE066;
    --taxi-yellow-dark: #CC9A00;
    --chrome: #E0E5EC;
    --chrome-dark: #8C969F;
    --glass: #87CEEB;
    --glass-highlight: #E0F7FA;
    --shadow: rgba(0,0,0,0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--bg);
    color: var(--text-main);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Grain Texture Overlay */
  .grain {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.5'/%3E%3C/svg%3E");
  }

  /* Layout Grid */
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 1.2fr 1fr;
    grid-template-rows: auto 1fr auto;
    padding: 3rem 4rem;
    max-width: 1800px;
    margin: 0 auto;
  }

  /* Typography & Header */
  header {
    grid-column: 2 / 3;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-start;
    z-index: 10;
  }

  h1 {
    font-size: 4.5rem;
    line-height: 0.85;
    text-transform: uppercase;
    letter-spacing: -0.03em;
    font-weight: 900;
    color: var(--text-main);
    margin-bottom: 0.5rem;
  }

  .subtitle {
    font-family: 'Courier New', Courier, monospace;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 1rem;
    letter-spacing: 0.1em;
    color: var(--taxi-yellow-dark);
    background: #fff;
    padding: 4px 8px;
    border: 1px solid var(--taxi-yellow-dark);
  }

  /* The Stage */
  .stage {
    grid-column: 1 / -1;
    grid-row: 2 / 3;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* SVG Container */
  #rickshaw-container {
    width: 100%;
    max-width: 1100px;
    height: auto;
    /* Dynamic shadow handled by SVG */
    transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    cursor: pointer;
    transform-origin: center center;
  }

  /* Specs Panel */
  .specs {
    position: absolute;
    right: 2rem;
    top: 50%;
    transform: translateY(-50%);
    text-align: right;
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    line-height: 1.5;
    color: var(--text-muted);
    max-width: 220px;
    border-right: 4px solid var(--taxi-yellow);
    padding-right: 1.5rem;
    z-index: 5;
  }

  .specs h3 {
    color: var(--text-main);
    font-size: 1.1rem;
    margin-bottom: 0.5rem;
    font-weight: 900;
    text-transform: uppercase;
  }

  .specs p { margin-bottom: 1.5rem; }
  .specs span { display: block; font-weight: bold; color: var(--text-main); }

  /* Footer */
  footer {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    color: var(--text-muted);
    border-top: 1px solid rgba(0,0,0,0.1);
    padding-top: 1rem;
  }

  /* Hotspots */
  .hotspot-group { cursor: pointer; }
  .hotspot-circle {
    fill: var(--taxi-yellow);
    stroke: #fff;
    stroke-width: 2;
    transition: all 0.2s ease;
  }
  .hotspot-group:hover .hotspot-circle {
    fill: var(--taxi-yellow-dark);
    r: 8;
  }
  .hotspot-line {
    stroke: var(--text-main);
    stroke-width: 1;
    opacity: 0.3;
  }
  .hotspot-label {
    font-family: 'Helvetica Neue', sans-serif;
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    fill: var(--text-main);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .hotspot-group:hover .hotspot-label { opacity: 1; }
  .hotspot-group:hover .hotspot-line { opacity: 1; stroke: var(--taxi-yellow-dark); }

</style>
</head>
<body>

<div class="grain"></div>

<main>
  <header>
    <div class="subtitle">Project: Urban Mobility</div>
    <h1>The Urban<br>Auto Rickshaw</h1>
  </header>

  <div class="stage">
    
    <div class="specs">
      <h3>Technical Data</h3>
      <p><span>Chassis</span>Open Steel Tubular</p>
      <p><span>Engine</span>125cc Single Cylinder</p>
      <p><span>Transmission</span>4-Speed Manual</p>
      <p><span>Capacity</span>Driver + 4 Pax</p>
      <p><span>Origin</span>India</p>
    </div>

    <!-- SVG DRAWING START -->
    <!-- viewBox adjusted to fit the larger, perspective view -->
    <svg id="rickshaw-container" viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Lighting: Top Left Source -->
        
        <!-- Body Paint Gradient (Yellow) -->
        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:var(--taxi-yellow-light);stop-opacity:1" />
          <stop offset="40%" style="stop-color:var(--taxi-yellow);stop-opacity:1" />
          <stop offset="100%" style="stop-color:var(--taxi-yellow-dark);stop-opacity:1" />
        </linearGradient>

        <!-- Shadow Gradient for Cabin Side -->
        <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:rgba(0,0,0,0.15);stop-opacity:1" />
          <stop offset="100%" style="stop-color:rgba(0,0,0,0);stop-opacity:1" />
        </linearGradient>

        <!-- Chrome/Metal Gradient -->
        <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
          <stop offset="30%" style="stop-color:var(--chrome);stop-opacity:1" />
          <stop offset="100%" style="stop-color:var(--chrome-dark);stop-opacity:1" />
        </linearGradient>

        <!-- Glass Gradient -->
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:var(--glass-highlight);stop-opacity:0.9" />
          <stop offset="20%" style="stop-color:var(--glass);stop-opacity:0.6" />
          <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:0.8" />
        </linearGradient>

        <!-- Headlamp Glow -->
        <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" style="stop-color:#FFF;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#FFF9C4;stop-opacity:0.8" />
          <stop offset="100%" style="stop-color:#FFC107;stop-opacity:0" />
        </radialGradient>

        <!-- Rubber Gradient -->
        <linearGradient id="rubberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#111;stop-opacity:1" />
        </linearGradient>
      </defs>

      <!-- GROUND SHADOW -->
      <ellipse cx="450" cy="560" rx="380" ry="35" fill="rgba(0,0,0,0.15)" filter="blur(10px)" />

      <!-- ========================================== -->
      <!-- REAR SECTION (Wheels & Cabin Back)         -->
      <!-- ========================================== -->

      <!-- REAR WHEELS (Visible through frame) -->
      <!-- Left Rear Wheel -->
      <g transform="translate(250, 520)">
        <ellipse cx="0" cy="0" rx="55" ry="55" fill="url(#rubberGrad)" />
        <ellipse cx="0" cy="0" rx="45" ry="45" fill="url(#chromeGrad)" />
        <ellipse cx="0" cy="0" rx="15" ry="15" fill="#222" />
        <!-- Spokes -->
        <path d="M0,-45 L0,45 M-45,0 L45,0 M-30,-30 L30,30 M-30,30 L30,-30" stroke="#777" stroke-width="3" />
      </g>

      <!-- Right Rear Wheel (Closer) -->
      <g transform="translate(650, 520)">
        <ellipse cx="0" cy="0" rx="55" ry="55" fill="url(#rubberGrad)" />
        <ellipse cx="0" cy="0" rx="45" ry="45" fill="url(#chromeGrad)" />
        <ellipse cx="0" cy="0" rx="15" ry="15" fill="#222" />
        <path d="M0,-45 L0,45 M-45,0 L45,0 M-30,-30 L30,30 M-30,30 L30,-30" stroke="#777" stroke-width="3" />
      </g>

      <!-- CABIN BACK WALL (Interior) -->
      <path d="M 280 350 L 620 350 L 650 250 L 260 250 Z" fill="#1a1a1a" />
      
      <!-- CABIN BACK WALL (Yellow Exterior) -->
      <!-- The back wall is angled. 
           Bottom Left: 280, 350. Bottom Right: 620, 350. 
           Top Left: 260, 250. Top Right: 650, 250. 
           This creates a perspective wedge.
      -->
      <path d="M 280 350 L 620 350 L 650 250 L 260 250 Z" fill="url(#bodyGrad)" />
      
      <!-- Back Wall Details (Decals/Grille) -->
      <rect x="300" y="270" width="300" height="60" fill="#111" rx="5" />
      <line x1="310" y1="270" x2="310" y2="330" stroke="#444" stroke-width="2" />
      <line x1="320" y1="270" x2="320" y2="330" stroke="#444" stroke-width="2" />
      <line x1="330" y1="270" x2="330" y2="330" stroke="#444" stroke-width="2" />
      <line x1="340" y1="270" x2="340" y2="330" stroke="#444" stroke-width="2" />
      <line x1="350" y1="270" x2="350" y2="330" stroke="#444" stroke-width="2" />
      <line x1="360" y1="270" x2="360" y2="330" stroke="#444" stroke-width="2" />
      <line x1="370" y1="270" x2="370" y2="330" stroke="#444" stroke-width="2" />
      <line x1="380" y1="270" x2="380" y2="330" stroke="#444" stroke-width="2" />
      <line x1="390" y1="270" x2="390" y2="330" stroke="#444" stroke-width="2" />
      <line x1="400" y1="270" x2="400" y2="330" stroke="#444" stroke-width="2" />
      <line x1="410" y1="270" x2="410" y2="330" stroke="#444" stroke-width="2" />
      <line x1="420" y1="270" x2="420" y2="330" stroke="#444" stroke-width="2" />
      <line x1="430" y1="270" x2="430" y2="330" stroke="#444" stroke-width="2" />
      <line x1="440" y1="270" x2="440" y2="330" stroke="#444" stroke-width="2" />
      <line x1="450" y1="270" x2="450" y2="330" stroke="#444" stroke-width="2" />
      <line x1="460" y1="270" x2="460" y2="330" stroke="#444" stroke-width="2" />
      <line x1="470" y1="270" x2="470" y2="330" stroke="#444" stroke-width="2" />
      <line x1="480" y1="270" x2="480" y2="330" stroke="#444" stroke-width="2" />
      <line x1="490" y1="270" x2="490" y2="330" stroke="#444" stroke-width="2" />
      <line x1="500" y1="270" x2="500" y2="330" stroke="#444" stroke-width="2" />
      <line x1="510" y1="270" x2="510" y2="330" stroke="#444" stroke-width="2" />
      <line x1="520" y1="270" x2="520" y2="330" stroke="#444" stroke-width="2" />
      <line x1="530" y1="270" x2="530" y2="330" stroke="#444" stroke-width="2" />
      <line x1="540" y1="270" x2="540" y2="330" stroke="#444" stroke-width="2" />
      <line x1="550" y1="270" x2="550" y2="330" stroke="#444" stroke-width="2" />
      <line x1="560" y1="270" x2="560" y2="330" stroke="#444" stroke-width="2" />
      <line x1="570" y1="270" x2="570" y2="330" stroke="#444" stroke-width="2" />
      <line x1="580" y1="270" x2="580" y2="330" stroke="#444" stroke-width="2" />
      <line x1="590" y1="270" x2="590" y2="330" stroke="#444" stroke-width="2" />
      <line x1="600" y1="270" x2="600" y2="330" stroke="#444" stroke-width="2" />

      <!-- ========================================== -->
      <!-- CABIN SIDE & ROOF                          -->
      <!-- ========================================== -->

      <!-- CABIN SIDE WALL (Right/Foreground) -->
      <!-- Connects Back Wall (620,350 to 650,250) to Front Pillar -->
      <path d="M 620 350 L 650 250 L 680 250 L 680 350 Z" fill="url(#bodyGrad)" />
      <!-- Shadow on the side -->
      <path d="M 620 350 L 650 250 L 660 250 L 630 350 Z" fill="url(#shadowGrad)" />
      
      <!-- Door Frame (Chrome) -->
      <path d="M 625 345 L 655 255 L 675 255 L 675 345 Z" fill="none" stroke="url(#chromeGrad)" stroke-width="4" />
      
      <!-- Side Window -->
      <path d="M 635 260 L 665 260 L 665 330 L 635 330 Z" fill="url(#glassGrad)" />

      <!-- CABIN ROOF (Canopy) -->
      <!-- Top surface -->
      <path d="M 260 250 L 650 250 L 680 250 L 290 250 Z" fill="url(#chromeGrad)" />
      <!-- Thickness/Underside shadow -->
      <path d="M 260 250 L 290 250 L 680 250 L 650 250 Z" fill="#555" />
      
      <!-- Roof Rack -->
      <path d="M 270 245 L 640 245 L 670 245 L 300 245 Z" fill="none" stroke="#333" stroke-width="4" />
      <!-- Rack Bars -->
      <path d="M 300 245 L 290 250 M 350 245 L 340 250 M 400 245 L 390 250 M 450 245 L 440 250 M 500 245 L 490 250 M 550 245 L 540 250 M 600 245 L 590 250" stroke="#333" stroke-width="3" />

      <!-- ========================================== -->
      <!-- FRONT ASSEMBLY (Driver, Windshield, Wheel) -->
      <!-- ========================================== -->

      <!-- FRONT WHEEL (Foreshortened) -->
      <g transform="translate(460, 520)">
        <!-- Tire -->
        <ellipse cx="0" cy="0" rx="45" ry="45" fill="url(#rubberGrad)" />
        <!-- Rim -->
        <ellipse cx="0" cy="0" rx="35" ry="35" fill="url(#chromeGrad)" />
        <!-- Hub -->
        <ellipse cx="0" cy="0" rx="10" ry="10" fill="#111" />
        <!-- Spokes (Foreshortened) -->
        <path d="M0,-35 L0,35 M-35,0 L35,0 M-25,-25 L25,25 M-25,25 L25,-25" stroke="#777" stroke-width="3" />
        <!-- Mudguard -->
        <path d="M-60,15 A 60 60 0 0 1 60,15" fill="none" stroke="url(#bodyGrad)" stroke-width="14" stroke-linecap="round" />
      </g>

      <!-- FRONT FRAME / FORK -->
      <!-- Connects Front Wheel (460, 520) to Handlebars (460, 380) -->
      <line x1="460" y1="520" x2="460" y2="380" stroke="#333" stroke-width="10" />
      <line x1="460" y1="520" x2="460" y2="380" stroke="url(#chromeGrad)" stroke-width="4" /> <!-- Chrome Fork -->

      <!-- DRIVER AREA (Under Windshield) -->
      <!-- Driver Seat -->
      <path d="M 420 380 L 500 380 L 500 350 L 420 350 Z" fill="#222" />
      <!-- Driver Silhouette (Abstract) -->
      <path d="M 430 350 C 430 280, 490 280, 490 350 Z" fill="#333" /> <!-- Body -->
      <circle cx="460" cy="290" r="18" fill="#333" /> <!-- Head -->
      
      <!-- Handlebars -->
      <path d="M 400 360 Q 460 380 520 360" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round" />
      <!-- Grips -->
      <circle cx="400" cy="360" r="6" fill="#111" />
      <circle cx="520" cy="360" r="6" fill="#111" />

      <!-- MIRRORS -->
      <!-- Left Mirror -->
      <path d="M 400 360 L 380 330" stroke="#333" stroke-width="3" />
      <ellipse cx="375" cy="325" rx="8" ry="12" fill="#111" />
      <!-- Right Mirror -->
      <path d="M 520 360 L 540 330" stroke="#333" stroke-width="3" />
      <ellipse cx="545" cy="325" rx="8" ry="12" fill="#111" />

      <!-- WINDSHIELD (Glass Panel) -->
      <!-- Trapezoid shape angling back -->
      <path d="M 420 380 L 500 380 L 480 250 L 440 250 Z" fill="url(#glassGrad)" stroke="#555" stroke-width="2" />
      <!-- Windshield Reflection -->
      <path d="M 430 370 L 450 260 L 460 260 L 440 370 Z" fill="#FFF" opacity="0.3" />

      <!-- FRONT BODYWORK / BULKHEAD -->
      <!-- The yellow panel covering the front engine area -->
      <path d="M 400 380 L 520 380 L 500 350 L 420 350 Z" fill="url(#bodyGrad)" stroke="#333" stroke-width="1" />
      
      <!-- HEADLAMP -->
      <g transform="translate(460, 380)">
        <!-- Glow -->
        <circle cx="0" cy="0" r="30" fill="url(#lampGlow)" />
        <!-- Housing -->
        <circle cx="0" cy="0" r="18" fill="#222" stroke="url(#chromeGrad)" stroke-width="3" />
        <!-- Lens -->
        <circle cx="0" cy="0" r="12" fill="#FFF" />
      </g>

      <!-- ========================================== -->
      <!-- INTERACTIVE HOTSPOTS                       -->
      <!-- ========================================== -->
      
      <!-- Hotspot: Headlamp -->
      <g class="hotspot-group">
        <circle cx="460" cy="380" r="4" class="hotspot-circle" />
        <line x1="460" y1="380" x2="400" y2="420" class="hotspot-line" />
        <text x="390" y="430" class="hotspot-label" text-anchor="end">Halogen Headlamp</text>
      </g>

      <!-- Hotspot: Windshield -->
      <g class="hotspot-group">
        <circle cx="460" cy="315" r="4" class="hotspot-circle" />
        <line x1="460" y1="315" x2="520" y2="270" class="hotspot-line" />
        <text x="530" y="270" class="hotspot-label" text-anchor="start">Polycarbonate Shield</text>
      </g>

      <!-- Hotspot: Roof Rack -->
      <g class="hotspot-group">
        <circle cx="500" cy="245" r="4" class="hotspot-circle" />
        <line x1="500" y1="245" x2="560" y2="200" class="hotspot-line" />
        <text x="570" y="200" class="hotspot-label" text-anchor="start">Roof Rack</text>
      </g>

      <!-- Hotspot: Wheels -->
      <g class="hotspot-group">
        <circle cx="650" cy="520" r="4" class="hotspot-circle" />
        <line x1="650" y1="520" x2="720" y2="560" class="hotspot-line" />
        <text x="730" y="560" class="hotspot-label" text-anchor="start">10" Alloy Wheels</text>
      </g>

    </svg>
    <!-- SVG DRAWING END -->

  </div>

  <footer>
    <div>
      Designed for Urban Mobility<br>
      Vector Craft v2.0
    </div>
    <div>
      [ INTERACTIVE VIEW ]
    </div>
  </footer>
</main>

<script>
  // Parallax effect
  const container = document.querySelector('main');
  const svg = document.getElementById('rickshaw-container');

  container.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth) - 0.5;
    const y = (e.clientY / window.innerHeight) - 0.5;

    // Subtle parallax effect
    // Rotate slightly based on mouse position
    svg.style.transform = `perspective(1200px) rotateY(${x * 4}deg) rotateX(${-y * 4}deg) scale(1.05)`;
  });

  container.addEventListener('mouseleave', () => {
    svg.style.transform = `perspective(1200px) rotateY(0deg) rotateX(0deg) scale(1)`;
  });
</script>

</body>
</html>
