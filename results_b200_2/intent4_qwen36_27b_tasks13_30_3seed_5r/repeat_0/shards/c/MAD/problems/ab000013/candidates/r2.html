<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Urban Auto Rickshaw — Vector Showcase</title>
<style>
  :root {
    --bg: #e8e4d9;
    --text-main: #111111;
    --text-muted: #555555;
    --taxi-yellow: #FFC300;
    --taxi-yellow-light: #FFE680;
    --taxi-yellow-dark: #CC9A00;
    --taxi-green: #006B3F; /* Classic Indian Taxi Green Stripe */
    --chrome: #E0E5EC;
    --chrome-dark: #8C969F;
    --glass: #87CEEB;
    --glass-highlight: #E0F7FA;
    --shadow: rgba(0,0,0,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--bg);
    color: var(--text-main);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Grain Texture Overlay - Simulating Paper/Concrete */
  .grain {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.5'/%3E%3C/svg%3E");
  }

  /* Main Layout */
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    perspective: 1000px;
  }

  /* Typography & Header - Moved to Top Left, Secondary */
  header {
    position: absolute;
    top: 3rem;
    left: 3rem;
    z-index: 20;
  }

  h1 {
    font-size: 1.8rem;
    line-height: 1.1;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    font-weight: 800;
    color: var(--text-main);
    margin-bottom: 0.25rem;
  }

  .subtitle {
    font-family: 'Helvetica Neue', Helvetica, sans-serif; /* Unified font */
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: var(--taxi-yellow-dark);
    background: rgba(255,255,255,0.8);
    padding: 4px 8px;
    border: 1px solid rgba(0,0,0,0.1);
    display: inline-block;
  }

  /* The Stage - Centered & Dominant */
  .stage {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* SVG Container - Scaled Up */
  #rickshaw-container {
    width: 90vw;
    height: 90vh;
    max-width: 1400px;
    max-height: 1000px;
    transition: transform 0.1s linear; /* Smooth parallax */
    transform-origin: center center;
    filter: drop-shadow(0px 20px 30px rgba(0,0,0,0.2));
  }

  /* Specs Panel - Floating Bottom Right */
  .specs {
    position: absolute;
    bottom: 4rem;
    right: 4rem;
    text-align: right;
    font-family: 'Helvetica Neue', Helvetica, sans-serif; /* Unified sans-serif */
    font-size: 0.9rem;
    line-height: 1.6;
    color: var(--text-main);
    max-width: 260px;
    background: rgba(255, 255, 255, 0.9);
    padding: 1.5rem;
    border: 1px solid rgba(0,0,0,0.1);
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    z-index: 20;
    backdrop-filter: blur(5px);
  }

  .specs h3 {
    color: var(--text-main);
    font-size: 0.9rem;
    margin-bottom: 0.8rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 2px solid var(--taxi-yellow);
    padding-bottom: 0.5rem;
    display: inline-block;
  }

  .specs p { margin-bottom: 0.5rem; }
  .specs span { display: block; font-weight: 700; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .specs strong { font-weight: 600; }

  /* Hotspots */
  .hotspot-group { cursor: pointer; transition: opacity 0.3s; }
  .hotspot-circle {
    fill: var(--taxi-yellow);
    stroke: #fff;
    stroke-width: 2;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    transition: all 0.3s ease;
  }
  .hotspot-group:hover .hotspot-circle {
    fill: var(--taxi-yellow-dark);
    r: 7;
  }
  .hotspot-line {
    stroke: var(--text-main);
    stroke-width: 1;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .hotspot-label {
    font-family: 'Helvetica Neue', sans-serif;
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    fill: var(--text-main);
    opacity: 0;
    transition: opacity 0.3s;
    letter-spacing: 0.05em;
  }
  .hotspot-group:hover .hotspot-label { opacity: 1; }
  .hotspot-group:hover .hotspot-line { opacity: 1; }

  /* Animation for hanging flag */
  @keyframes sway {
    0% { transform: rotate(0deg); }
    50% { transform: rotate(3deg); }
    100% { transform: rotate(0deg); }
  }
  .hanging-item {
    transform-origin: top center;
    animation: sway 3s infinite ease-in-out;
  }

</style>
</head>
<body>

<div class="grain"></div>

<main>
  <header>
    <div class="subtitle">Project: Urban Mobility</div>
    <h1>The Urban<br>Auto Rickshaw</h1>
  </header>

  <div class="stage">
    
    <div class="specs">
      <h3>Technical Data</h3>
      <p><span>Chassis</span><strong>Open Steel Tubular</strong></p>
      <p><span>Engine</span><strong>125cc Single Cylinder</strong></p>
      <p><span>Transmission</span><strong>4-Speed Manual</strong></p>
      <p><span>Capacity</span><strong>Driver + 4 Pax</strong></p>
      <p><span>Origin</span><strong>India</strong></p>
    </div>

    <!-- SVG DRAWING START -->
    <!-- viewBox adjusted for a 3/4 perspective composition -->
    <svg id="rickshaw-container" viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Lighting: Top Left Source -->
        
        <!-- Body Paint Gradient (Yellow) - Dynamic 3D shading -->
        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:var(--taxi-yellow-light);stop-opacity:1" />
          <stop offset="40%" style="stop-color:var(--taxi-yellow);stop-opacity:1" />
          <stop offset="100%" style="stop-color:var(--taxi-yellow-dark);stop-opacity:1" />
        </linearGradient>
        
        <!-- Shadow Gradient for Cabin Side -->
        <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:rgba(0,0,0,0.3);stop-opacity:1" />
          <stop offset="100%" style="stop-color:rgba(0,0,0,0);stop-opacity:1" />
        </linearGradient>

        <!-- Chrome/Metal Gradient -->
        <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
          <stop offset="30%" style="stop-color:var(--chrome);stop-opacity:1" />
          <stop offset="100%" style="stop-color:var(--chrome-dark);stop-opacity:1" />
        </linearGradient>

        <!-- Glass Gradient -->
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:var(--glass-highlight);stop-opacity:0.9" />
          <stop offset="20%" style="stop-color:var(--glass);stop-opacity:0.6" />
          <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:0.8" />
        </linearGradient>

        <!-- Headlamp Glow -->
        <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" style="stop-color:#FFF;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#FFF9C4;stop-opacity:0.8" />
          <stop offset="100%" style="stop-color:#FFC107;stop-opacity:0" />
        </radialGradient>

        <!-- Rubber Gradient -->
        <linearGradient id="rubberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#444;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#111;stop-opacity:1" />
        </linearGradient>
      </defs>

      <!-- GROUND SHADOW -->
      <ellipse cx="400" cy="600" rx="350" ry="40" fill="rgba(0,0,0,0.2)" filter="blur(15px)" />

      <!-- ========================================== -->
      <!-- REAR SECTION (Wheels & Cabin Back)         -->
      <!-- ========================================== -->

      <!-- REAR WHEELS (Visible through frame) -->
      <!-- Left Rear Wheel (Background) -->
      <g transform="translate(220, 560)">
        <ellipse cx="0" cy="0" rx="50" ry="50" fill="url(#rubberGrad)" />
        <ellipse cx="0" cy="0" rx="38" ry="38" fill="url(#chromeGrad)" />
        <ellipse cx="0" cy="0" rx="12" ry="12" fill="#222" />
        <!-- Spokes -->
        <path d="M0,-38 L0,38 M-38,0 L38,0 M-27,-27 L27,27 M-27,27 L27,-27" stroke="#777" stroke-width="3" />
      </g>

      <!-- Right Rear Wheel (Foreground) -->
      <g transform="translate(580, 560)">
        <ellipse cx="0" cy="0" rx="50" ry="50" fill="url(#rubberGrad)" />
        <ellipse cx="0" cy="0" rx="38" ry="38" fill="url(#chromeGrad)" />
        <ellipse cx="0" cy="0" rx="12" ry="12" fill="#222" />
        <path d="M0,-38 L0,38 M-38,0 L38,0 M-27,-27 L27,27 M-27,27 L27,-27" stroke="#777" stroke-width="3" />
      </g>

      <!-- CABIN BACK WALL (Interior - Dark) -->
      <path d="M 250 380 L 550 380 L 580 280 L 280 280 Z" fill="#1a1a1a" />
      
      <!-- CABIN BACK WALL (Yellow Exterior) -->
      <!-- The back wall is angled to show perspective -->
      <path d="M 250 380 L 550 380 L 580 280 L 280 280 Z" fill="url(#bodyGrad)" />
      
      <!-- Back Wall Details (Decals/Grille) -->
      <rect x="280" y="300" width="280" height="50" fill="#111" rx="4" />
      <!-- Vertical Grille Lines -->
      <path d="M290,300 L290,350 M300,300 L300,350 M310,300 L310,350 M320,300 L320,350 M330,300 L330,350 M340,300 L340,350 M350,300 L350,350 M360,300 L360,350 M370,300 L370,350 M380,300 L380,350 M390,300 L390,350 M400,300 L400,350 M410,300 L410,350 M420,300 L420,350 M430,300 L430,350 M440,300 L440,350 M450,300 L450,350 M460,300 L460,350 M470,300 L470,350 M480,300 L480,350 M490,300 L490,350 M500,300 L500,350 M510,300 L510,350 M520,300 L520,350 M530,300 L530,350 M540,300 L540,350" stroke="#444" stroke-width="2" />
      
      <!-- Ornament: Rear Bumper Sticker -->
      <rect x="380" y="360" width="60" height="10" fill="#FF0000" />
      <text x="410" y="368" font-family="Arial" font-size="6" fill="white" text-anchor="middle" font-weight="bold">JAI HIND</text>

      <!-- ========================================== -->
      <!-- CABIN SIDE & ROOF                          -->
      <!-- ========================================== -->

      <!-- CABIN SIDE WALL (Right/Foreground) -->
      <!-- Connects Back Wall (550,380 to 580,280) to Front Pillar -->
      <path d="M 550 380 L 580 280 L 620 280 L 620 380 Z" fill="url(#bodyGrad)" />
      <!-- Shadow on the side -->
      <path d="M 550 380 L 580 280 L 590 280 L 560 380 Z" fill="url(#shadowGrad)" />
      
      <!-- Door Frame (Chrome) -->
      <path d="M 555 375 L 585 285 L 615 285 L 615 375 Z" fill="none" stroke="url(#chromeGrad)" stroke-width="4" />
      
      <!-- Side Window -->
      <path d="M 565 290 L 595 290 L 595 360 L 565 360 Z" fill="url(#glassGrad)" />

      <!-- CABIN ROOF (Canopy) -->
      <!-- Top surface -->
      <path d="M 280 280 L 580 280 L 620 280 L 320 280 Z" fill="url(#chromeGrad)" />
      <!-- Thickness/Underside shadow -->
      <path d="M 280 280 L 320 280 L 620 280 L 580 280 Z" fill="#555" />
      
      <!-- Roof Rack -->
      <path d="M 290 275 L 570 275 L 610 275 L 330 275 Z" fill="none" stroke="#333" stroke-width="4" />
      <!-- Rack Bars -->
      <path d="M 330 275 L 320 280 M 380 275 L 370 280 M 430 275 L 420 280 M 480 275 L 470 280 M 530 275 L 520 280 M 580 275 L 570 280" stroke="#333" stroke-width="3" />

      <!-- ========================================== -->
      <!-- FRONT ASSEMBLY (Driver, Windshield, Wheel) -->
      <!-- ========================================== -->

      <!-- FRONT WHEEL (Foreshortened) -->
      <g transform="translate(420, 560)">
        <!-- Tire -->
        <ellipse cx="0" cy="0" rx="40" ry="40" fill="url(#rubberGrad)" />
        <!-- Rim -->
        <ellipse cx="0" cy="0" rx="30" ry="30" fill="url(#chromeGrad)" />
        <!-- Hub -->
        <ellipse cx="0" cy="0" rx="8" ry="8" fill="#111" />
        <!-- Spokes (Foreshortened) -->
        <path d="M0,-30 L0,30 M-30,0 L30,0 M-21,-21 L21,21 M-21,21 L21,-21" stroke="#777" stroke-width="3" />
        <!-- Mudguard -->
        <path d="M-55,10 A 55 55 0 0 1 55,10" fill="none" stroke="url(#bodyGrad)" stroke-width="12" stroke-linecap="round" />
      </g>

      <!-- FRONT FRAME / FORK -->
      <!-- Connects Front Wheel (420, 560) to Handlebars (420, 400) -->
      <line x1="420" y1="560" x2="420" y2="400" stroke="#333" stroke-width="10" />
      <line x1="420" y1="560" x2="420" y2="400" stroke="url(#chromeGrad)" stroke-width="4" /> <!-- Chrome Fork -->

      <!-- DRIVER AREA (Under Windshield) -->
      <!-- Driver Seat -->
      <path d="M 380 400 L 460 400 L 460 370 L 380 370 Z" fill="#222" />
      <!-- Driver Silhouette (Abstract) -->
      <path d="M 390 370 C 390 300, 450 300, 450 370 Z" fill="#333" /> <!-- Body -->
      <circle cx="420" cy="310" r="16" fill="#333" /> <!-- Head -->
      
      <!-- Handlebars -->
      <path d="M 360 380 Q 420 400 480 380" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round" />
      <!-- Grips -->
      <circle cx="360" cy="380" r="6" fill="#111" />
      <circle cx="480" cy="380" r="6" fill="#111" />

      <!-- MIRRORS -->
      <!-- Left Mirror -->
      <path d="M 360 380 L 340 350" stroke="#333" stroke-width="3" />
      <ellipse cx="335" cy="345" rx="7" ry="10" fill="#111" />
      <!-- Right Mirror -->
      <path d="M 480 380 L 500 350" stroke="#333" stroke-width="3" />
      <ellipse cx="505" cy="345" rx="7" ry="10" fill="#111" />

      <!-- WINDSHIELD (Glass Panel) -->
      <!-- Trapezoid shape angling back -->
      <path d="M 380 400 L 460 400 L 440 280 L 400 280 Z" fill="url(#glassGrad)" stroke="#555" stroke-width="2" />
      <!-- Windshield Reflection -->
      <path d="M 390 390 L 410 290 L 420 290 L 400 390 Z" fill="#FFF" opacity="0.3" />

      <!-- FRONT BODYWORK / BULKHEAD -->
      <!-- The yellow panel covering the front engine area -->
      <path d="M 360 400 L 480 400 L 460 370 L 380 370 Z" fill="url(#bodyGrad)" stroke="#333" stroke-width="1" />
      
      <!-- Ornament: Green Stripe on Front -->
      <path d="M 362 390 L 478 390 L 458 372 L 382 372 Z" fill="var(--taxi-green)" opacity="0.8" />

      <!-- HEADLAMP -->
      <g transform="translate(420, 400)">
        <!-- Glow -->
        <circle cx="0" cy="0" r="25" fill="url(#lampGlow)" />
        <!-- Housing -->
        <circle cx="0" cy="0" r="16" fill="#222" stroke="url(#chromeGrad)" stroke-width="3" />
        <!-- Lens -->
        <circle cx="0" cy="0" r="10" fill="#FFF" />
      </g>

      <!-- Ornament: Hanging Prayer Flag -->
      <g class="hanging-item" transform="translate(340, 280)">
        <path d="M0,0 L0,15" stroke="#333" stroke-width="1" />
        <rect x="-4" y="15" width="8" height="12" fill="#FF0000" />
        <rect x="-4" y="27" width="8" height="12" fill="#0000FF" />
        <rect x="-4" y="39" width="8" height="12" fill="#FFFF00" />
      </g>

      <!-- Ornament: Small Idol on Dashboard -->
      <g transform="translate(420, 370)">
        <path d="M-5,0 L5,0 L3,-10 L-3,-10 Z" fill="#DAA520" /> <!-- Gold Base -->
        <circle cx="0" cy="-12" r="4" fill="#DAA520" /> <!-- Head -->
      </g>

      <!-- ========================================== -->
      <!-- INTERACTIVE HOTSPOTS                       -->
      <!-- ========================================== -->
      
      <!-- Hotspot: Headlamp -->
      <g class="hotspot-group">
        <circle cx="420" cy="400" r="4" class="hotspot-circle" />
        <line x1="420" y1="400" x2="350" y2="450" class="hotspot-line" />
        <text x="340" y="450" class="hotspot-label" text-anchor="end">Halogen Headlamp</text>
      </g>

      <!-- Hotspot: Windshield -->
      <g class="hotspot-group">
        <circle cx="420" cy="340" r="4" class="hotspot-circle" />
        <line x1="420" y1="340" x2="480" y2="300" class="hotspot-line" />
        <text x="490" y="300" class="hotspot-label" text-anchor="start">Polycarbonate Shield</text>
      </g>

      <!-- Hotspot: Roof Rack -->
      <g class="hotspot-group">
        <circle cx="460" cy="275" r="4" class="hotspot-circle" />
        <line x1="460" y1="275" x2="520" y2="230" class="hotspot-line" />
        <text x="530" y="230" class="hotspot-label" text-anchor="start">Roof Rack</text>
      </g>

      <!-- Hotspot: Wheels -->
      <g class="hotspot-group">
        <circle cx="580" cy="560" r="4" class="hotspot-circle" />
        <line x1="580" y1="560" x2="650" y2="600" class="hotspot-line" />
        <text x="660" y="600" class="hotspot-label" text-anchor="start">10" Alloy Wheels</text>
      </g>

    </svg>
    <!-- SVG DRAWING END -->

  </div>

</main>

<script>
  // Parallax effect
  const container = document.querySelector('main');
  const svg = document.getElementById('rickshaw-container');

  container.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth) - 0.5;
    const y = (e.clientY / window.innerHeight) - 0.5;

    // Subtle parallax effect
    // Rotate slightly based on mouse position
    // Note: Using scale(1.0) here as requested in brief to scale up via CSS, but keeping transform for rotation
    svg.style.transform = `perspective(1200px) rotateY(${x * 4}deg) rotateX(${-y * 4}deg)`;
  });

  container.addEventListener('mouseleave', () => {
    svg.style.transform = `perspective(1200px) rotateY(0deg) rotateX(0deg)`;
  });
</script>

</body>
</html>
