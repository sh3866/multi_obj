<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Urban Auto Rickshaw — Vector Showcase</title>
<style>
  :root {
    --bg: #f0f2f5;
    --bg-gradient: linear-gradient(135deg, #f0f2f5 0%, #e2e6ea 100%);
    --text-main: #1a1a1a;
    --text-muted: #666666;
    --taxi-yellow: #FFD700;
    --taxi-yellow-dark: #D4AF37;
    --taxi-green: #006B3F;
    --chrome-light: #FFFFFF;
    --chrome-mid: #C0C5CE;
    --chrome-dark: #7A818A;
    --glass: rgba(135, 206, 235, 0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-gradient);
    color: var(--text-main);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* Grain Texture Overlay */
  .grain {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.5'/%3E%3C/svg%3E");
  }

  /* Main Layout */
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1200px;
  }

  /* Typography & Header - Minimal, Top Left */
  header {
    position: absolute;
    top: 3rem;
    left: 3rem;
    z-index: 20;
    pointer-events: none;
  }

  h1 {
    font-size: 1.2rem;
    line-height: 1.2;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 700;
    color: var(--text-main);
    opacity: 0.8;
  }

  .subtitle {
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    color: var(--taxi-green);
    margin-top: 0.2rem;
  }

  /* The Stage */
  .stage {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* SVG Container */
  #rickshaw-container {
    width: 85vw;
    height: 85vh;
    max-width: 1200px;
    max-height: 900px;
    transition: transform 0.1s linear;
    transform-origin: center center;
    filter: drop-shadow(0px 30px 40px rgba(0,0,0,0.15));
  }

  /* Data Caption - Bottom Right */
  .caption {
    position: absolute;
    bottom: 2rem;
    right: 3rem;
    text-align: right;
    font-size: 0.75rem;
    color: var(--text-muted);
    z-index: 20;
    opacity: 0.6;
    max-width: 200px;
    line-height: 1.4;
    border-right: 2px solid var(--taxi-yellow);
    padding-right: 1rem;
  }

  .caption strong {
    color: var(--text-main);
    display: block;
    margin-bottom: 0.2rem;
    font-size: 0.8rem;
  }

  /* Hotspots (Hidden by default, subtle) */
  .hotspot-group { cursor: pointer; }
  .hotspot-circle {
    fill: var(--taxi-green);
    stroke: #fff;
    stroke-width: 2;
    transition: all 0.3s ease;
    opacity: 0.8;
  }
  .hotspot-group:hover .hotspot-circle {
    fill: var(--taxi-yellow);
    r: 6;
  }
  .hotspot-label {
    font-family: 'Helvetica Neue', sans-serif;
    font-weight: 700;
    font-size: 10px;
    text-transform: uppercase;
    fill: var(--text-main);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .hotspot-group:hover .hotspot-label { opacity: 1; }

  /* Animation */
  @keyframes sway {
    0% { transform: rotate(0deg); }
    50% { transform: rotate(2deg); }
    100% { transform: rotate(0deg); }
  }
  .hanging-item {
    transform-origin: top center;
    animation: sway 4s infinite ease-in-out;
  }

</style>
</head>
<body>

<div class="grain"></div>

<main>
  <header>
    <h1>The Urban<br>Auto Rickshaw</h1>
    <div class="subtitle">Vector Composition</div>
  </header>

  <div class="stage">
    
    <div class="caption">
      <strong>Technical Specifications</strong>
      Chassis: Open Steel Tubular<br>
      Engine: 125cc Single Cylinder<br>
      Capacity: Driver + 4 Pax<br>
      Origin: India
    </div>

    <!-- SVG DRAWING START -->
    <!-- viewBox adjusted for 3/4 perspective -->
    <svg id="rickshaw-container" viewBox="0 0 900 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Body Paint Gradient (Yellow) - Light Top-Right -->
        <linearGradient id="bodyGrad" x1="20%" y1="0%" x2="80%" y2="100%">
          <stop offset="0%" style="stop-color:#FFEA00;stop-opacity:1" />
          <stop offset="45%" style="stop-color:#FFC300;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#CC9A00;stop-opacity:1" />
        </linearGradient>

        <!-- Shadow Gradient (Interior/Shadows) -->
        <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:rgba(0,0,0,0.1);stop-opacity:1" />
          <stop offset="100%" style="stop-color:rgba(0,0,0,0.5);stop-opacity:1" />
        </linearGradient>

        <!-- Chrome/Metal Gradient -->
        <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
          <stop offset="30%" style="stop-color:var(--chrome-mid);stop-opacity:1" />
          <stop offset="100%" style="stop-color:var(--chrome-dark);stop-opacity:1" />
        </linearGradient>

        <!-- Glass Gradient -->
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#E0F7FA;stop-opacity:0.8" />
          <stop offset="50%" style="stop-color:#87CEEB;stop-opacity:0.5" />
          <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:0.7" />
        </linearGradient>

        <!-- Rubber Gradient -->
        <linearGradient id="rubberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#000;stop-opacity:1" />
        </linearGradient>

        <!-- Headlamp Glow -->
        <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" style="stop-color:#FFF;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#FFF9C4;stop-opacity:0.6" />
          <stop offset="100%" style="stop-color:#FFC107;stop-opacity:0" />
        </radialGradient>

        <!-- Ground Shadow Blur -->
        <filter id="blurShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="12" />
        </filter>
      </defs>

      <!-- GROUND SHADOW -->
      <!-- Ellipse placed under the wheels to anchor the vehicle -->
      <ellipse cx="480" cy="680" rx="380" ry="50" fill="rgba(0,0,0,0.25)" filter="url(#blurShadow)" />

      <!-- ========================================== -->
      <!-- REAR SECTION (Wheels & Cabin Back)         -->
      <!-- ========================================== -->

      <!-- Left Rear Wheel (Background) -->
      <!-- Positioned further back in Z-space -->
      <g transform="translate(300, 640)">
        <!-- Tire -->
        <ellipse cx="0" cy="0" rx="45" ry="45" fill="url(#rubberGrad)" />
        <!-- Rim -->
        <ellipse cx="0" cy="0" rx="32" ry="32" fill="url(#chromeGrad)" />
        <!-- Hub -->
        <ellipse cx="0" cy="0" rx="10" ry="10" fill="#222" />
        <!-- Spokes -->
        <path d="M0,-32 L0,32 M-32,0 L32,0 M-23,-23 L23,23 M-23,23 L23,-23" stroke="#777" stroke-width="3" />
        <!-- Mudguard (Partial) -->
        <path d="M-45,10 A 45 45 0 0 1 45,10" fill="none" stroke="url(#bodyGrad)" stroke-width="8" stroke-linecap="round" />
      </g>

      <!-- Right Rear Wheel (Foreground) -->
      <!-- Positioned closer, slightly lower -->
      <g transform="translate(680, 650)">
        <!-- Tire -->
        <ellipse cx="0" cy="0" rx="45" ry="45" fill="url(#rubberGrad)" />
        <!-- Rim -->
        <ellipse cx="0" cy="0" rx="32" ry="32" fill="url(#chromeGrad)" />
        <!-- Hub -->
        <ellipse cx="0" cy="0" rx="10" ry="10" fill="#222" />
        <!-- Spokes -->
        <path d="M0,-32 L0,32 M-32,0 L32,0 M-23,-23 L23,23 M-23,23 L23,-23" stroke="#777" stroke-width="3" />
        <!-- Mudguard (Full visible arc) -->
        <path d="M-45,10 A 45 45 0 0 1 45,10" fill="none" stroke="url(#bodyGrad)" stroke-width="8" stroke-linecap="round" />
        <!-- Mudguard Highlight -->
        <path d="M-42,12 A 42 42 0 0 1 42,12" fill="none" stroke="#FFF" stroke-width="1" opacity="0.5" />
      </g>

      <!-- CABIN BACK WALL (Interior - Dark) -->
      <!-- Connects to the top of the chassis -->
      <path d="M 320 480 L 640 480 L 680 380 L 360 380 Z" fill="#1a1a1a" />
      
      <!-- CABIN BACK WALL (Yellow Exterior) -->
      <!-- Angled to show perspective -->
      <path d="M 320 480 L 640 480 L 680 380 L 360 380 Z" fill="url(#bodyGrad)" />
      
      <!-- Back Wall Details (Grille) -->
      <!-- Dark mesh area -->
      <path d="M 360 400 L 670 400 L 650 460 L 340 460 Z" fill="#111" opacity="0.8" />
      <!-- Grille Lines -->
      <path d="M350,410 L660,410 M350,420 L660,420 M350,430 L660,430 M350,440 L660,440 M350,450 L660,450" stroke="#333" stroke-width="2" />
      
      <!-- Ornament: Rear Bumper -->
      <path d="M 330 470 L 660 470 L 665 485 L 325 485 Z" fill="url(#chromeGrad)" />
      <!-- Ornament: Decal -->
      <text x="500" y="440" font-family="Arial" font-size="14" fill="#FFF" text-anchor="middle" font-weight="bold" opacity="0.7" transform="rotate(-5, 500, 440)">JAI HIND</text>

      <!-- ========================================== -->
      <!-- CABIN SIDE & ROOF                          -->
      <!-- ========================================== -->

      <!-- CABIN SIDE WALL (Right/Foreground) -->
      <!-- Connects Back Wall to Front Pillar -->
      <path d="M 640 480 L 680 380 L 720 380 L 700 480 Z" fill="url(#bodyGrad)" />
      <!-- Shadow on the side (Interior depth) -->
      <path d="M 640 480 L 680 380 L 690 380 L 650 480 Z" fill="url(#shadowGrad)" />
      
      <!-- Door Frame (Chrome) -->
      <path d="M 645 475 L 685 385 L 715 385 L 695 475 Z" fill="none" stroke="url(#chromeGrad)" stroke-width="3" />
      
      <!-- Side Window -->
      <path d="M 655 390 L 695 390 L 690 460 L 650 460 Z" fill="url(#glassGrad)" />
      <!-- Window Reflection -->
      <path d="M 660 400 L 680 400 L 675 450 L 655 450 Z" fill="#FFF" opacity="0.2" />

      <!-- CABIN ROOF (Canopy) -->
      <!-- Top surface -->
      <path d="M 360 380 L 680 380 L 720 380 L 400 380 Z" fill="url(#chromeGrad)" />
      <!-- Thickness/Underside shadow -->
      <path d="M 360 380 L 400 380 L 720 380 L 680 380 Z" fill="#555" />
      
      <!-- Roof Rack -->
      <path d="M 370 370 L 670 370 L 710 370 L 410 370 Z" fill="none" stroke="#333" stroke-width="4" />
      <!-- Rack Bars -->
      <path d="M 410 370 L 400 380 M 460 370 L 450 380 M 510 370 L 500 380 M 560 370 L 550 380 M 610 370 L 600 380 M 660 370 L 650 380" stroke="#333" stroke-width="3" />

      <!-- ========================================== -->
      <!-- FRONT ASSEMBLY (Driver, Windshield, Wheel) -->
      <!-- ========================================== -->

      <!-- FRONT WHEEL (Foreshortened) -->
      <!-- Positioned centrally but angled -->
      <g transform="translate(520, 660)">
        <!-- Tire -->
        <ellipse cx="0" cy="0" rx="35" ry="35" fill="url(#rubberGrad)" />
        <!-- Rim -->
        <ellipse cx="0" cy="0" rx="25" ry="25" fill="url(#chromeGrad)" />
        <!-- Hub -->
        <ellipse cx="0" cy="0" rx="7" ry="7" fill="#111" />
        <!-- Spokes (Foreshortened) -->
        <path d="M0,-25 L0,25 M-25,0 L25,0 M-18,-18 L18,18 M-18,18 L18,-18" stroke="#777" stroke-width="3" />
        <!-- Mudguard -->
        <path d="M-40,10 A 40 40 0 0 1 40,10" fill="none" stroke="url(#bodyGrad)" stroke-width="10" stroke-linecap="round" />
        <!-- Mudguard Highlight -->
        <path d="M-37,12 A 37 37 0 0 1 37,12" fill="none" stroke="#FFF" stroke-width="1" opacity="0.5" />
      </g>

      <!-- FRONT FRAME / FORK -->
      <!-- Connects Front Wheel (520, 660) to Handlebars (520, 480) -->
      <line x1="520" y1="660" x2="520" y2="480" stroke="#333" stroke-width="12" />
      <line x1="520" y1="660" x2="520" y2="480" stroke="url(#chromeGrad)" stroke-width="5" /> <!-- Chrome Fork -->

      <!-- DRIVER AREA (Under Windshield) -->
      <!-- Driver Seat -->
      <path d="M 480 500 L 560 500 L 560 470 L 480 470 Z" fill="#222" />
      <!-- Driver Silhouette (Abstract) -->
      <path d="M 490 470 C 490 400, 550 400, 550 470 Z" fill="#333" /> <!-- Body -->
      <circle cx="520" cy="430" r="18" fill="#333" /> <!-- Head -->
      <!-- Headphones/Earphones (Common detail) -->
      <path d="M 502 430 L 502 420 A 18 18 0 0 1 538 420 L 538 430" fill="none" stroke="#111" stroke-width="2" />

      <!-- Handlebars (Proper Assembly) -->
      <!-- Stem -->
      <line x1="520" y1="500" x2="520" y2="480" stroke="#111" stroke-width="6" />
      <!-- Bar -->
      <path d="M 460 480 Q 520 500 580 480" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round" />
      <!-- Grips -->
      <circle cx="460" cy="480" r="8" fill="#333" />
      <circle cx="580" cy="480" r="8" fill="#333" />
      <!-- Clutch/Brake Levers -->
      <path d="M 460 480 L 445 490" stroke="#555" stroke-width="3" />
      <path d="M 580 480 L 595 490" stroke="#555" stroke-width="3" />

      <!-- MIRRORS -->
      <!-- Left Mirror -->
      <path d="M 460 480 L 440 450" stroke="#333" stroke-width="3" />
      <ellipse cx="435" cy="445" rx="8" ry="12" fill="#111" />
      <!-- Right Mirror -->
      <path d="M 580 480 L 600 450" stroke="#333" stroke-width="3" />
      <ellipse cx="605" cy="445" rx="8" ry="12" fill="#111" />

      <!-- WINDSHIELD (Glass Panel) -->
      <!-- Trapezoid shape angling back -->
      <path d="M 480 500 L 560 500 L 540 380 L 500 380 Z" fill="url(#glassGrad)" stroke="#555" stroke-width="2" />
      <!-- Windshield Reflection -->
      <path d="M 490 490 L 510 390 L 520 390 L 500 490 Z" fill="#FFF" opacity="0.3" />

      <!-- FRONT BODYWORK / BULKHEAD -->
      <!-- The yellow panel covering the front engine area -->
      <path d="M 460 500 L 580 500 L 560 470 L 480 470 Z" fill="url(#bodyGrad)" stroke="#333" stroke-width="1" />
      
      <!-- Ornament: Green Stripe on Front -->
      <path d="M 462 490 L 578 490 L 558 472 L 482 472 Z" fill="var(--taxi-green)" opacity="0.9" />

      <!-- HEADLAMP -->
      <g transform="translate(520, 500)">
        <!-- Glow -->
        <circle cx="0" cy="0" r="30" fill="url(#lampGlow)" />
        <!-- Housing -->
        <circle cx="0" cy="0" r="18" fill="#222" stroke="url(#chromeGrad)" stroke-width="4" />
        <!-- Lens -->
        <circle cx="0" cy="0" r="12" fill="#FFF" />
        <!-- Turn Signals (Small details) -->
        <circle cx="-22" cy="5" r="5" fill="#FF5722" />
        <circle cx="22" cy="5" r="5" fill="#FF5722" />
      </g>

      <!-- Ornament: Hanging Prayer Flag -->
      <g class="hanging-item" transform="translate(440, 380)">
        <path d="M0,0 L0,15" stroke="#333" stroke-width="1" />
        <rect x="-4" y="15" width="8" height="12" fill="#FF0000" />
        <rect x="-4" y="27" width="8" height="12" fill="#0000FF" />
        <rect x="-4" y="39" width="8" height="12" fill="#FFFF00" />
      </g>

      <!-- Ornament: Small Idol on Dashboard -->
      <g transform="translate(520, 470)">
        <path d="M-5,0 L5,0 L3,-10 L-3,-10 Z" fill="#DAA520" /> <!-- Gold Base -->
        <circle cx="0" cy="-12" r="4" fill="#DAA520" /> <!-- Head -->
      </g>

      <!-- ========================================== -->
      <!-- INTERACTIVE HOTSPOTS                       -->
      <!-- ========================================== -->
      
      <!-- Hotspot: Headlamp -->
      <g class="hotspot-group">
        <circle cx="520" cy="500" r="4" class="hotspot-circle" />
        <text x="540" y="500" class="hotspot-label" text-anchor="start">Halogen Headlamp</text>
      </g>

      <!-- Hotspot: Windshield -->
      <g class="hotspot-group">
        <circle cx="520" cy="440" r="4" class="hotspot-circle" />
        <text x="540" y="440" class="hotspot-label" text-anchor="start">Polycarbonate Shield</text>
      </g>

      <!-- Hotspot: Wheels -->
      <g class="hotspot-group">
        <circle cx="680" cy="650" r="4" class="hotspot-circle" />
        <text x="700" y="650" class="hotspot-label" text-anchor="start">10" Alloy Wheels</text>
      </g>

    </svg>
    <!-- SVG DRAWING END -->

  </div>

</main>

<script>
  // Parallax effect
  const container = document.querySelector('main');
  const svg = document.getElementById('rickshaw-container');

  container.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth) - 0.5;
    const y = (e.clientY / window.innerHeight) - 0.5;

    // Subtle parallax effect
    // Rotate slightly based on mouse position
    svg.style.transform = `perspective(1200px) rotateY(${x * 5}deg) rotateX(${-y * 5}deg)`;
  });

  container.addEventListener('mouseleave', () => {
    svg.style.transform = `perspective(1200px) rotateY(0deg) rotateX(0deg)`;
  });
</script>

</body>
</html>
