<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Urban Auto Rickshaw — Vector Showcase</title>
<style>
  :root {
    --bg-dark: #1a1a1a;
    --bg-accent: #2c2c2c;
    --text-main: #f0f0f0;
    --text-muted: #a0a0a0;
    --taxi-yellow: #FFD600;
    --taxi-yellow-dark: #FBC02D;
    --taxi-green: #006B3F;
    --taxi-green-dark: #004D2C;
    --chrome-light: #FFFFFF;
    --chrome-mid: #B0B5B9;
    --chrome-dark: #606569;
    --glass: rgba(173, 216, 230, 0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* Gritty Asphalt Texture Overlay */
  .grain {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.15;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* Radial Vignette to focus on vehicle */
  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(circle at center, transparent 40%, #000000 100%);
  }

  /* Main Layout */
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    perspective: 1500px;
  }

  /* Typography & Header - Minimal, Top Left */
  header {
    position: absolute;
    top: 4rem;
    left: 4rem;
    z-index: 20;
    pointer-events: none;
  }

  h1 {
    font-size: 2.5rem;
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    font-weight: 800;
    color: var(--text-main);
    text-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }

  .subtitle {
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    color: var(--taxi-yellow);
    margin-top: 0.5rem;
    border-top: 1px solid var(--taxi-green);
    padding-top: 0.5rem;
    display: inline-block;
  }

  /* The Stage */
  .stage {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* SVG Container - Enlarged */
  #rickshaw-container {
    width: 90vw;
    height: 90vh;
    max-width: 1400px;
    max-height: 1000px;
    transition: transform 0.1s linear;
    transform-origin: center center;
    /* Stronger drop shadow for depth */
    filter: drop-shadow(0px 40px 60px rgba(0,0,0,0.6));
  }

  /* Data Caption - Bottom Left, High Contrast */
  .caption {
    position: absolute;
    bottom: 4rem;
    left: 4rem;
    text-align: left;
    z-index: 20;
    max-width: 300px;
  }

  .caption strong {
    color: var(--taxi-yellow);
    display: block;
    margin-bottom: 0.5rem;
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .spec-list {
    list-style: none;
    font-size: 0.9rem;
    color: var(--text-muted);
    line-height: 1.6;
    border-left: 2px solid var(--taxi-green);
    padding-left: 1rem;
  }

  .spec-list li span {
    color: var(--text-main);
    font-weight: 600;
  }

  /* Hotspots */
  .hotspot-group { cursor: pointer; }
  .hotspot-circle {
    fill: var(--taxi-yellow);
    stroke: #fff;
    stroke-width: 2;
    transition: all 0.3s ease;
    opacity: 0.9;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }
  .hotspot-group:hover .hotspot-circle {
    fill: var(--taxi-green);
    stroke: var(--taxi-yellow);
    r: 7;
  }
  .hotspot-label {
    font-family: 'Helvetica Neue', sans-serif;
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    fill: var(--text-main);
    opacity: 0;
    transition: opacity 0.3s;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  .hotspot-group:hover .hotspot-label { opacity: 1; }

  /* Animation */
  @keyframes sway {
    0% { transform: rotate(0deg); }
    50% { transform: rotate(4deg); }
    100% { transform: rotate(0deg); }
  }
  .hanging-item {
    transform-origin: top center;
    animation: sway 3.5s infinite ease-in-out;
  }

</style>
</head>
<body>

<div class="grain"></div>
<div class="vignette"></div>

<main>
  <header>
    <h1>The Urban<br>Auto Rickshaw</h1>
    <div class="subtitle">Vector Composition</div>
  </header>

  <div class="stage">
    
    <div class="caption">
      <strong>Technical Specifications</strong>
      <ul class="spec-list">
        <li>Chassis: <span>Open Steel Tubular</span></li>
        <li>Engine: <span>125cc Single Cylinder</span></li>
        <li>Capacity: <span>Driver + 4 Pax</span></li>
        <li>Origin: <span>India</span></li>
      </ul>
    </div>

    <!-- SVG DRAWING START -->
    <!-- viewBox adjusted for 3/4 perspective, wider canvas -->
    <svg id="rickshaw-container" viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Metallic Body Paint Gradient (Yellow) -->
        <linearGradient id="bodyGrad" x1="20%" y1="0%" x2="80%" y2="100%">
          <stop offset="0%" style="stop-color:#FFF59D;stop-opacity:1" />
          <stop offset="30%" style="stop-color:#FFD600;stop-opacity:1" />
          <stop offset="80%" style="stop-color:#FBC02D;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#F57F17;stop-opacity:1" />
        </linearGradient>

        <!-- Shadow Gradient (Interior/Shadows) -->
        <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:rgba(0,0,0,0.2);stop-opacity:1" />
          <stop offset="100%" style="stop-color:rgba(0,0,0,0.8);stop-opacity:1" />
        </linearGradient>

        <!-- Chrome/Metal Gradient -->
        <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
          <stop offset="20%" style="stop-color:#E0E0E0;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#9E9E9E;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#616161;stop-opacity:1" />
        </linearGradient>

        <!-- Glass Gradient -->
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#E0F7FA;stop-opacity:0.6" />
          <stop offset="50%" style="stop-color:#80DEEA;stop-opacity:0.3" />
          <stop offset="100%" style="stop-color:#006064;stop-opacity:0.6" />
        </linearGradient>

        <!-- Rubber Gradient -->
        <linearGradient id="rubberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#424242;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
        </linearGradient>
        
        <!-- Seat Fabric Pattern -->
        <pattern id="seatPattern" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
          <rect width="10" height="10" fill="#880E4F" />
          <rect width="5" height="10" fill="#AD1457" />
        </pattern>

        <!-- Headlamp Glow -->
        <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" style="stop-color:#FFF;stop-opacity:1" />
          <stop offset="40%" style="stop-color:#FFF9C4;stop-opacity:0.8" />
          <stop offset="100%" style="stop-color:#FFC107;stop-opacity:0" />
        </radialGradient>

        <!-- Ground Shadow Blur -->
        <filter id="blurShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="15" />
        </filter>
      </defs>

      <!-- GROUND SHADOW -->
      <!-- Larger, softer shadow to ground the heavier vehicle -->
      <ellipse cx="550" cy="760" rx="400" ry="60" fill="rgba(0,0,0,0.6)" filter="url(#blurShadow)" />

      <!-- ========================================== -->
      <!-- REAR SECTION (Wheels & Cabin Back)         -->
      <!-- ========================================== -->

      <!-- Left Rear Wheel (Background) -->
      <!-- Smaller due to perspective -->
      <g transform="translate(350, 700)">
        <!-- Tire -->
        <ellipse cx="0" cy="0" rx="55" ry="55" fill="url(#rubberGrad)" />
        <!-- Rim -->
        <ellipse cx="0" cy="0" rx="38" ry="38" fill="url(#chromeGrad)" />
        <!-- Hub -->
        <ellipse cx="0" cy="0" rx="12" ry="12" fill="#222" />
        <!-- Spokes -->
        <path d="M0,-38 L0,38 M-38,0 L38,0 M-27,-27 L27,27 M-27,27 L27,-27" stroke="#777" stroke-width="4" />
        <!-- Mudguard (Partial, Large) -->
        <path d="M-55,-20 A 55 55 0 0 1 55,-20" fill="none" stroke="url(#bodyGrad)" stroke-width="12" stroke-linecap="round" />
      </g>

      <!-- Right Rear Wheel (Foreground) -->
      <!-- Larger, lower -->
      <g transform="translate(750, 720)">
        <!-- Tire -->
        <ellipse cx="0" cy="0" rx="65" ry="65" fill="url(#rubberGrad)" />
        <!-- Rim -->
        <ellipse cx="0" cy="0" rx="45" ry="45" fill="url(#chromeGrad)" />
        <!-- Hub -->
        <ellipse cx="0" cy="0" rx="14" ry="14" fill="#111" />
        <!-- Spokes -->
        <path d="M0,-45 L0,45 M-45,0 L45,0 M-32,-32 L32,32 M-32,32 L32,-32" stroke="#888" stroke-width="5" />
        <!-- Mudguard (Full visible arc, Large) -->
        <path d="M-65,-25 A 65 65 0 0 1 65,-25" fill="none" stroke="url(#bodyGrad)" stroke-width="14" stroke-linecap="round" />
        <!-- Mudguard Highlight -->
        <path d="M-62,-22 A 62 62 0 0 1 62,-22" fill="none" stroke="#FFF" stroke-width="2" opacity="0.6" />
      </g>

      <!-- CABIN BACK WALL (Interior - Dark) -->
      <!-- Connects to the top of the chassis -->
      <path d="M 380 500 L 720 520 L 760 380 L 420 360 Z" fill="#111" />
      
      <!-- CABIN BACK WALL (Yellow Exterior) -->
      <!-- Angled to show perspective -->
      <path d="M 380 500 L 720 520 L 760 380 L 420 360 Z" fill="url(#bodyGrad)" />
      
      <!-- Back Wall Details (Grille) -->
      <!-- Dark mesh area -->
      <path d="M 430 390 L 740 410 L 720 480 L 400 460 Z" fill="#000" opacity="0.9" />
      <!-- Grille Lines -->
      <path d="M420,410 L730,430 M410,430 L720,450 M400,450 L710,470" stroke="#333" stroke-width="3" />
      
      <!-- Ornament: Rear Bumper -->
      <path d="M 390 490 L 730 510 L 735 525 L 385 505 Z" fill="url(#chromeGrad)" />
      <!-- Ornament: Decal -->
      <text x="560" y="450" font-family="Arial" font-size="18" fill="#FFF" text-anchor="middle" font-weight="bold" opacity="0.8" transform="rotate(4, 560, 450)">JAI HIND</text>

      <!-- ========================================== -->
      <!-- CABIN SIDE & ROOF (Enclosed)               -->
      <!-- ========================================== -->

      <!-- CABIN SIDE WALL (Right/Foreground) -->
      <!-- Connects Back Wall to Front Pillar -->
      <path d="M 720 520 L 760 380 L 800 380 L 780 540 Z" fill="url(#bodyGrad)" />
      <!-- Shadow on the side (Interior depth) -->
      <path d="M 720 520 L 760 380 L 770 380 L 730 520 Z" fill="url(#shadowGrad)" />
      
      <!-- Door Frame (Chrome) -->
      <path d="M 725 515 L 765 385 L 795 385 L 775 535 Z" fill="none" stroke="url(#chromeGrad)" stroke-width="4" />
      
      <!-- Side Window -->
      <path d="M 735 395 L 775 395 L 770 510 L 730 510 Z" fill="url(#glassGrad)" />
      <!-- Window Reflection -->
      <path d="M 740 405 L 760 405 L 755 500 L 735 500 Z" fill="#FFF" opacity="0.2" />

      <!-- CABIN ROOF (Canopy) -->
      <!-- Top surface -->
      <path d="M 420 360 L 760 380 L 800 380 L 460 360 Z" fill="url(#chromeGrad)" />
      <!-- Thickness/Underside shadow -->
      <path d="M 420 360 L 460 360 L 800 380 L 760 380 Z" fill="#555" />
      
      <!-- Roof Rack -->
      <path d="M 430 350 L 750 350 L 790 350 L 470 350 Z" fill="none" stroke="#333" stroke-width="5" />
      <!-- Rack Bars -->
      <path d="M 470 350 L 460 360 M 520 350 L 510 360 M 570 350 L 560 360 M 620 350 L 610 360 M 670 350 L 660 360 M 720 350 L 710 360 M 770 350 L 760 360" stroke="#333" stroke-width="4" />

      <!-- ========================================== -->
      <!-- INTERIOR (Visible through windows)         -->
      <!-- ========================================== -->
      
      <!-- Seat Back (Patterned) -->
      <path d="M 450 400 L 750 420 L 730 480 L 430 460 Z" fill="url(#seatPattern)" opacity="0.8" />
      
      <!-- Ornament: Hanging Prayer Flag -->
      <g class="hanging-item" transform="translate(480, 365)">
        <path d="M0,0 L0,20" stroke="#333" stroke-width="1.5" />
        <rect x="-5" y="20" width="10" height="15" fill="#FF0000" />
        <rect x="-5" y="35" width="10" height="15" fill="#0000FF" />
        <rect x="-5" y="50" width="10" height="15" fill="#FFFF00" />
      </g>

      <!-- ========================================== -->
      <!-- FRONT ASSEMBLY (Driver, Windshield, Wheel) -->
      <!-- ========================================== -->

      <!-- FRONT WHEEL (Foreshortened) -->
      <!-- Positioned centrally but angled -->
      <g transform="translate(600, 740)">
        <!-- Tire -->
        <ellipse cx="0" cy="0" rx="50" ry="50" fill="url(#rubberGrad)" />
        <!-- Rim -->
        <ellipse cx="0" cy="0" rx="35" ry="35" fill="url(#chromeGrad)" />
        <!-- Hub -->
        <ellipse cx="0" cy="0" rx="10" ry="10" fill="#111" />
        <!-- Spokes (Foreshortened) -->
        <path d="M0,-35 L0,35 M-35,0 L35,0 M-25,-25 L25,25 M-25,25 L25,-25" stroke="#777" stroke-width="4" />
        <!-- Mudguard (Large) -->
        <path d="M-55,15 A 55 55 0 0 1 55,15" fill="none" stroke="url(#bodyGrad)" stroke-width="14" stroke-linecap="round" />
        <!-- Mudguard Highlight -->
        <path d="M-52,18 A 52 52 0 0 1 52,18" fill="none" stroke="#FFF" stroke-width="2" opacity="0.6" />
      </g>

      <!-- FRONT FRAME / FORK -->
      <!-- Connects Front Wheel (600, 740) to Handlebars (600, 500) -->
      <line x1="600" y1="740" x2="600" y2="500" stroke="#333" stroke-width="16" />
      <line x1="600" y1="740" x2="600" y2="500" stroke="url(#chromeGrad)" stroke-width="6" /> <!-- Chrome Fork -->

      <!-- DRIVER AREA (Under Windshield) -->
      <!-- Driver Seat -->
      <path d="M 560 520 L 640 520 L 640 480 L 560 480 Z" fill="#222" />
      <!-- Driver Silhouette (Abstract) -->
      <path d="M 570 480 C 570 410, 630 410, 630 480 Z" fill="#222" /> <!-- Body -->
      <circle cx="600" cy="440" r="20" fill="#222" /> <!-- Head -->
      <!-- Headphones/Earphones (Common detail) -->
      <path d="M 580 440 L 580 425 A 20 20 0 0 1 620 425 L 620 440" fill="none" stroke="#111" stroke-width="3" />

      <!-- Handlebars (Proper Assembly) -->
      <!-- Stem -->
      <line x1="600" y1="520" x2="600" y2="500" stroke="#111" stroke-width="8" />
      <!-- Bar -->
      <path d="M 540 500 Q 600 520 660 500" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round" />
      <!-- Grips -->
      <circle cx="540" cy="500" r="10" fill="#333" />
      <circle cx="660" cy="500" r="10" fill="#333" />
      <!-- Clutch/Brake Levers -->
      <path d="M 540 500 L 525 510" stroke="#555" stroke-width="4" />
      <path d="M 660 500 L 675 510" stroke="#555" stroke-width="4" />

      <!-- MIRRORS -->
      <!-- Left Mirror -->
      <path d="M 540 500 L 520 460" stroke="#333" stroke-width="4" />
      <ellipse cx="515" cy="455" rx="10" ry="15" fill="#111" />
      <!-- Right Mirror -->
      <path d="M 660 500 L 680 460" stroke="#333" stroke-width="4" />
      <ellipse cx="685" cy="455" rx="10" ry="15" fill="#111" />

      <!-- WINDSHIELD (Glass Panel) -->
      <!-- Trapezoid shape angling back -->
      <path d="M 560 520 L 640 520 L 620 380 L 580 380 Z" fill="url(#glassGrad)" stroke="#555" stroke-width="3" />
      <!-- Windshield Reflection -->
      <path d="M 570 510 L 590 390 L 600 390 L 580 510 Z" fill="#FFF" opacity="0.3" />

      <!-- FRONT BODYWORK / BULKHEAD -->
      <!-- The yellow panel covering the front engine area -->
      <path d="M 540 520 L 660 520 L 640 480 L 560 480 Z" fill="url(#bodyGrad)" stroke="#333" stroke-width="2" />
      
      <!-- Ornament: Green Stripe on Front -->
      <path d="M 542 510 L 658 510 L 638 482 L 562 482 Z" fill="var(--taxi-green)" opacity="0.9" />

      <!-- HEADLAMP -->
      <g transform="translate(600, 520)">
        <!-- Glow -->
        <circle cx="0" cy="0" r="40" fill="url(#lampGlow)" />
        <!-- Housing -->
        <circle cx="0" cy="0" r="22" fill="#222" stroke="url(#chromeGrad)" stroke-width="5" />
        <!-- Lens -->
        <circle cx="0" cy="0" r="15" fill="#FFF" />
        <!-- Turn Signals (Small details) -->
        <circle cx="-28" cy="8" r="7" fill="#FF5722" />
        <circle cx="28" cy="8" r="7" fill="#FF5722" />
      </g>

      <!-- Ornament: Small Idol on Dashboard -->
      <g transform="translate(600, 480)">
        <path d="M-6,0 L6,0 L4,-12 L-4,-12 Z" fill="#DAA520" /> <!-- Gold Base -->
        <circle cx="0" cy="-14" r="5" fill="#DAA520" /> <!-- Head -->
      </g>

      <!-- ========================================== -->
      <!-- INTERACTIVE HOTSPOTS                       -->
      <!-- ========================================== -->
      
      <!-- Hotspot: Headlamp -->
      <g class="hotspot-group">
        <circle cx="600" cy="520" r="5" class="hotspot-circle" />
        <text x="630" y="520" class="hotspot-label" text-anchor="start">Halogen Headlamp</text>
      </g>

      <!-- Hotspot: Windshield -->
      <g class="hotspot-group">
        <circle cx="600" cy="450" r="5" class="hotspot-circle" />
        <text x="630" y="450" class="hotspot-label" text-anchor="start">Polycarbonate Shield</text>
      </g>

      <!-- Hotspot: Wheels -->
      <g class="hotspot-group">
        <circle cx="750" cy="720" r="5" class="hotspot-circle" />
        <text x="780" y="720" class="hotspot-label" text-anchor="start">10" Alloy Wheels</text>
      </g>

    </svg>
    <!-- SVG DRAWING END -->

  </div>

</main>

<script>
  // Parallax effect
  const container = document.querySelector('main');
  const svg = document.getElementById('rickshaw-container');

  container.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth) - 0.5;
    const y = (e.clientY / window.innerHeight) - 0.5;

    // Subtle parallax effect
    // Rotate slightly based on mouse position
    svg.style.transform = `perspective(1500px) rotateY(${x * 6}deg) rotateX(${-y * 6}deg)`;
  });

  container.addEventListener('mouseleave', () => {
    svg.style.transform = `perspective(1500px) rotateY(0deg) rotateX(0deg)`;
  });
</script>

</body>
</html>
