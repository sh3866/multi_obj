<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Rickshaw — Vector Showcase</title>
<style>
  :root {
    --bg-dark: #121212;
    --bg-gradient: radial-gradient(circle at center, #2a2a2a 0%, #050505 100%);
    --text-main: #e0e0e0;
    --text-muted: #888888;
    --accent-yellow: #FFD700;
    --accent-green: #008000;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-dark);
    background-image: var(--bg-gradient);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Subtle Grain Overlay */
  .grain {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
    opacity: 0.05;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* Layout Container */
  .showcase-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }

  /* Typography - Minimal & Demoted */
  .label-container {
    position: absolute;
    bottom: 3rem;
    left: 3rem;
    opacity: 0.6;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  
  .label-container:hover { opacity: 1; }

  h1 {
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-main);
    margin-bottom: 0.5rem;
  }

  .specs {
    display: flex;
    gap: 1.5rem;
    font-size: 0.75rem;
    color: var(--text-muted);
    font-family: 'Courier New', monospace;
  }

  .spec-item span { color: var(--accent-yellow); }

  /* SVG Stage */
  #svg-stage {
    width: 100%;
    height: 100%;
    max-width: 1200px;
    max-height: 900px;
    transition: transform 0.1s ease-out;
    transform-style: preserve-3d;
  }

  /* Animation */
  @keyframes sway {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(8deg); }
  }
  .hanging {
    transform-origin: top center;
    animation: sway 4s ease-in-out infinite;
  }

</style>
</head>
<body>

<div class="grain"></div>

<div class="showcase-container">
  
  <!-- Footer/Specs -->
  <div class="label-container">
    <h1>Standard 3W Model</h1>
    <div class="specs">
      <div class="spec-item">CHASSIS: <span>TUBULAR</span></div>
      <div class="spec-item">WHEELS: <span>3x 10"</span></div>
      <div class="spec-item">ORIGIN: <span>INDIA</span></div>
    </div>
  </div>

  <!-- SVG Graphic -->
  <svg id="svg-stage" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Metallic Yellow Body -->
      <linearGradient id="bodyPaint" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFF59D" />
        <stop offset="25%" stop-color="#FFD700" />
        <stop offset="70%" stop-color="#FBC02D" />
        <stop offset="100%" stop-color="#F57F17" />
      </linearGradient>

      <!-- Shadow for Depth -->
      <linearGradient id="bodyShadow" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#000" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0.0"/>
      </linearGradient>

      <!-- Chrome -->
      <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFF" />
        <stop offset="40%" stop-color="#B0B5B9" />
        <stop offset="60%" stop-color="#FFF" />
        <stop offset="100%" stop-color="#555" />
      </linearGradient>

      <!-- Glass -->
      <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#E0F7FA" stop-opacity="0.7"/>
        <stop offset="40%" stop-color="#80DEEA" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#006064" stop-opacity="0.6"/>
      </linearGradient>

      <!-- Rubber -->
      <linearGradient id="rubber" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#333" />
        <stop offset="100%" stop-color="#000" />
      </linearGradient>

      <!-- Headlight Glow -->
      <radialGradient id="glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFF" stop-opacity="1"/>
        <stop offset="40%" stop-color="#FFF9C4" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#FFC107" stop-opacity="0"/>
      </radialGradient>

      <!-- Blur Filter -->
      <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="12" />
      </filter>
    </defs>

    <!-- Ground Shadow (Elliptical to match perspective) -->
    <ellipse cx="520" cy="680" rx="320" ry="50" fill="#000" filter="url(#blur)" opacity="0.7" />

    <!-- ========================================== -->
    <!-- REAR WHEELS (Perspective Ellipses)         -->
    <!-- ========================================== -->
    
    <!-- Left Rear Wheel (Background) -->
    <g transform="translate(280, 600)">
      <!-- Tire -->
      <ellipse cx="0" cy="0" rx="45" ry="45" fill="url(#rubber)" stroke="#111" stroke-width="2"/>
      <!-- Rim -->
      <ellipse cx="0" cy="0" rx="30" ry="30" fill="url(#chrome)" />
      <!-- Hub -->
      <ellipse cx="0" cy="0" rx="8" ry="8" fill="#222" />
      <!-- Spokes -->
      <path d="M0,-30 L0,30 M-30,0 L30,0 M-21,-21 L21,21 M-21,21 L21,-21" stroke="#888" stroke-width="3" />
      <!-- Mudguard (Attached to Frame) -->
      <path d="M-45,-10 A 45 45 0 0 1 45,-10" fill="none" stroke="url(#bodyPaint)" stroke-width="12" stroke-linecap="round" />
      <!-- Mudguard Highlight -->
      <path d="M-42,-8 A 42 42 0 0 1 42,-8" fill="none" stroke="#FFF" stroke-width="1" opacity="0.5" />
    </g>

    <!-- Right Rear Wheel (Foreground) -->
    <g transform="translate(780, 620)">
      <!-- Tire -->
      <ellipse cx="0" cy="0" rx="55" ry="55" fill="url(#rubber)" stroke="#111" stroke-width="2"/>
      <!-- Rim -->
      <ellipse cx="0" cy="0" rx="38" ry="38" fill="url(#chrome)" />
      <!-- Hub -->
      <ellipse cx="0" cy="0" rx="10" ry="10" fill="#222" />
      <!-- Spokes -->
      <path d="M0,-38 L0,38 M-38,0 L38,0 M-27,-27 L27,27 M-27,27 L27,-27" stroke="#999" stroke-width="4" />
      <!-- Mudguard (Attached to Frame) -->
      <path d="M-55,-15 A 55 55 0 0 1 55,-15" fill="none" stroke="url(#bodyPaint)" stroke-width="14" stroke-linecap="round" />
      <!-- Mudguard Highlight -->
      <path d="M-52,-12 A 52 52 0 0 1 52,-12" fill="none" stroke="#FFF" stroke-width="1.5" opacity="0.6" />
    </g>

    <!-- ========================================== -->
    <!-- MAIN CHASSIS & CABIN (Contiguous Block)    -->
    <!-- ========================================== -->

    <!-- Cabin Back Wall (Visible inside) -->
    <path d="M 320 420 L 700 440 L 720 300 L 360 280 Z" fill="#111" />

    <!-- Cabin Exterior Back Wall (Yellow) -->
    <path d="M 320 420 L 700 440 L 720 300 L 360 280 Z" fill="url(#bodyPaint)" />
    
    <!-- Cabin Side Wall (Right/Foreground) -->
    <!-- Connects seamlessly to Back Wall -->
    <path d="M 700 440 L 720 300 L 760 300 L 780 450 Z" fill="url(#bodyPaint)" />
    <!-- Side Wall Shadow (Interior Depth) -->
    <path d="M 700 440 L 720 300 L 730 300 L 710 440 Z" fill="url(#bodyShadow)" />

    <!-- Door Frame (Chrome Strip) -->
    <path d="M 710 435 L 730 305 L 750 305 L 770 445 Z" fill="none" stroke="url(#chrome)" stroke-width="3" />
    
    <!-- Side Window -->
    <path d="M 720 315 L 745 315 L 760 430 L 725 430 Z" fill="url(#glass)" />
    <!-- Window Reflection -->
    <path d="M 725 325 L 740 325 L 750 420 L 730 420 Z" fill="#FFF" opacity="0.2" />

    <!-- Roof (Canopy) -->
    <!-- Top Surface -->
    <path d="M 360 280 L 720 300 L 760 300 L 400 280 Z" fill="url(#chrome)" />
    <!-- Roof Underside (Thickness) -->
    <path d="M 360 280 L 400 280 L 760 300 L 720 300 Z" fill="#444" />
    
    <!-- Roof Rack (Ornament) -->
    <path d="M 380 270 L 730 270" stroke="#333" stroke-width="6" stroke-linecap="round" />
    <path d="M 420 270 L 410 280 M 480 270 L 470 280 M 540 270 L 530 280 M 600 270 L 590 280 M 660 270 L 650 280 M 720 270 L 710 280" stroke="#333" stroke-width="4" />

    <!-- Interior Seat (Patterned) -->
    <path d="M 380 360 L 710 380 L 710 420 L 380 400 Z" fill="#880E4F" />
    <!-- Seat Stripes -->
    <path d="M 420 363 L 410 403 M 460 366 L 450 406 M 500 369 L 490 409 M 540 372 L 530 412 M 580 375 L 570 415 M 620 378 L 610 418 M 660 381 L 650 421" stroke="#AD1457" stroke-width="4" />

    <!-- Hanging Ornament -->
    <g class="hanging" transform="translate(420, 280)">
      <path d="M0,0 L0,15" stroke="#333" stroke-width="1.5" />
      <rect x="-4" y="15" width="8" height="12" fill="#FF0000" />
      <rect x="-4" y="27" width="8" height="12" fill="#0000FF" />
      <rect x="-4" y="39" width="8" height="12" fill="#FFFF00" />
    </g>

    <!-- ========================================== -->
    <!-- FRONT ASSEMBLY (Driver, Windshield, Wheel) -->
    <!-- ========================================== -->

    <!-- Front Wheel (Foreshortened) -->
    <g transform="translate(580, 640)">
      <!-- Tire -->
      <ellipse cx="0" cy="0" rx="45" ry="45" fill="url(#rubber)" stroke="#111" stroke-width="2"/>
      <!-- Rim -->
      <ellipse cx="0" cy="0" rx="32" ry="32" fill="url(#chrome)" />
      <!-- Hub -->
      <ellipse cx="0" cy="0" rx="8" ry="8" fill="#222" />
      <!-- Spokes -->
      <path d="M0,-32 L0,32 M-32,0 L32,0 M-22,-22 L22,22 M-22,22 L22,-22" stroke="#888" stroke-width="3" />
      <!-- Mudguard (Front) -->
      <path d="M-45,10 A 45 45 0 0 1 45,10" fill="none" stroke="url(#bodyPaint)" stroke-width="12" stroke-linecap="round" />
      <!-- Mudguard Highlight -->
      <path d="M-42,13 A 42 42 0 0 1 42,13" fill="none" stroke="#FFF" stroke-width="1" opacity="0.6" />
    </g>

    <!-- Front Fork (Steering Column) -->
    <!-- Connects Wheel (580, 640) to Handlebars (580, 450) -->
    <line x1="580" y1="640" x2="580" y2="450" stroke="#222" stroke-width="14" />
    <line x1="580" y1="640" x2="580" y2="450" stroke="url(#chrome)" stroke-width="6" />

    <!-- Driver Seat -->
    <path d="M 540 460 L 620 460 L 620 430 L 540 430 Z" fill="#222" />
    
    <!-- Driver Silhouette -->
    <path d="M 550 430 C 550 370, 610 370, 610 430 Z" fill="#111" /> <!-- Body -->
    <circle cx="580" cy="395" r="18" fill="#111" /> <!-- Head -->

    <!-- Handlebars (Horizontal Assembly) -->
    <!-- Stem -->
    <line x1="580" y1="450" x2="580" y2="420" stroke="#111" stroke-width="8" />
    <!-- Bar -->
    <path d="M 510 420 Q 580 440 650 420" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round" />
    <!-- Grips -->
    <circle cx="510" cy="420" r="8" fill="#333" />
    <circle cx="650" cy="420" r="8" fill="#333" />
    <!-- Levers -->
    <path d="M 510 420 L 495 430" stroke="#555" stroke-width="3" />
    <path d="M 650 420 L 665 430" stroke="#555" stroke-width="3" />

    <!-- Mirrors (Standard Shape) -->
    <!-- Left Mirror -->
    <path d="M 510 420 L 490 380" stroke="#333" stroke-width="3" />
    <ellipse cx="485" cy="375" rx="8" ry="12" fill="#111" />
    <ellipse cx="485" cy="375" rx="6" ry="10" fill="url(#glass)" /> <!-- Glass part -->
    
    <!-- Right Mirror -->
    <path d="M 650 420 L 670 380" stroke="#333" stroke-width="3" />
    <ellipse cx="675" cy="375" rx="8" ry="12" fill="#111" />
    <ellipse cx="675" cy="375" rx="6" ry="10" fill="url(#glass)" /> <!-- Glass part -->

    <!-- Windshield (Glass Panel) -->
    <!-- Trapezoid angling back -->
    <path d="M 540 460 L 620 460 L 600 320 L 560 320 Z" fill="url(#glass)" stroke="#444" stroke-width="2" />
    <!-- Windshield Reflection -->
    <path d="M 550 450 L 570 330 L 580 330 L 560 450 Z" fill="#FFF" opacity="0.3" />

    <!-- Front Bodywork (Bulkhead) -->
    <!-- Connects everything at the front -->
    <path d="M 520 460 L 640 460 L 620 420 L 540 420 Z" fill="url(#bodyPaint)" stroke="#222" stroke-width="1" />
    
    <!-- Front Grille (Green Stripe) -->
    <path d="M 522 450 L 638 450 L 618 422 L 542 422 Z" fill="var(--accent-green)" opacity="0.9" />
    <!-- Grille Lines -->
    <path d="M 530 430 L 630 430 M 525 440 L 635 440" stroke="#004D00" stroke-width="2" />

    <!-- Headlamp -->
    <g transform="translate(580, 460)">
      <!-- Glow -->
      <circle cx="0" cy="0" r="35" fill="url(#glow)" />
      <!-- Housing -->
      <circle cx="0" cy="0" r="18" fill="#222" stroke="url(#chrome)" stroke-width="4" />
      <!-- Lens -->
      <circle cx="0" cy="0" r="12" fill="#FFF" />
      <!-- Turn Signals -->
      <circle cx="-22" cy="6" r="5" fill="#FF5722" />
      <circle cx="22" cy="6" r="5" fill="#FF5722" />
    </g>

    <!-- Ornament: Dashboard Idol -->
    <g transform="translate(580, 420)">
      <path d="M-5,0 L5,0 L3,-10 L-3,-10 Z" fill="#DAA520" />
      <circle cx="0" cy="-12" r="4" fill="#DAA520" />
    </g>

  </svg>

</div>

<script>
  // Subtle 3D Parallax Effect
  const container = document.querySelector('.showcase-container');
  const svg = document.getElementById('svg-stage');

  container.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth) - 0.5;
    const y = (e.clientY / window.innerHeight) - 0.5;

    // Rotate slightly based on mouse position
    // Limits rotation to keep it subtle and professional
    svg.style.transform = `perspective(1500px) rotateY(${x * 4}deg) rotateX(${-y * 4}deg)`;
  });

  container.addEventListener('mouseleave', () => {
    svg.style.transform = `perspective(1500px) rotateY(0deg) rotateX(0deg)`;
  });
</script>

</body>
</html>
