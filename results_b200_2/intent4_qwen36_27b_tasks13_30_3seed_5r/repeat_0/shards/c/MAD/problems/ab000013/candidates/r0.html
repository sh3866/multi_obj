<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Classic Auto — Vector Showcase</title>
<style>
  :root {
    --bg: #fdfbf7;
    --text: #2c2c2c;
    --accent: #ff9900;
    --accent-dark: #cc7a00;
    --rickshaw-yellow: #FFD600;
    --rickshaw-yellow-dark: #E6BE00;
    --rickshaw-shadow: #BFA300;
    --metal: #A0AAB2;
    --metal-dark: #717D85;
    --chrome: #E0E5EC;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* Background Texture */
  .noise {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.5'/%3E%3C/svg%3E");
  }

  /* Layout */
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 1.2fr 1fr;
    grid-template-rows: auto 1fr auto;
    padding: 2rem;
    max-width: 1600px;
  }

  /* Typography & HUD */
  header {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 2rem;
    border-bottom: 2px solid var(--text);
    padding-bottom: 1rem;
  }

  h1 {
    font-size: 3rem;
    line-height: 0.9;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    font-weight: 800;
  }

  .subtitle {
    font-family: 'Courier New', Courier, monospace;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
  }

  /* The Stage */
  .stage {
    grid-column: 1 / -1;
    grid-row: 2 / 3;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* SVG Container */
  #rickshaw-container {
    width: 100%;
    max-width: 900px;
    height: auto;
    filter: drop-shadow(0px 20px 30px rgba(0,0,0,0.15));
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    cursor: pointer;
  }

  #rickshaw-container:hover {
    transform: scale(1.02) translateY(-5px);
  }

  /* Decorative Elements */
  .specs {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    text-align: right;
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    line-height: 1.6;
    color: #555;
    max-width: 200px;
  }

  .specs strong { color: var(--text); }

  .specs::before {
    content: '';
    display: block;
    width: 2px;
    height: 100px;
    background: var(--accent);
    margin-bottom: 1rem;
    margin-left: auto;
  }

  /* Interactive Dots */
  .hotspot {
    fill: var(--accent);
    cursor: pointer;
    transition: r 0.2s;
  }
  .hotspot:hover { r: 6; }
  .hotspot-label {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    fill: var(--text);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .hotspot-group:hover .hotspot-label { opacity: 1; }

  /* Footer */
  footer {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    margin-top: auto;
  }

  /* Animation */
  @keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
  }
  
  .wheel-spin {
    transform-origin: center;
    animation: spin 2s linear infinite;
  }
  
  @keyframes spin {
    100% { transform: rotate(360deg); }
  }

</style>
</head>
<body>

<div class="noise"></div>

<main>
  <header>
    <div>
      <div class="subtitle">Vehicle ID: TUK-TUK-01</div>
      <h1>The Urban<br>Auto Rickshaw</h1>
    </div>
    <div class="subtitle">
      Origin: India<br>
      Type: 3-Wheeler
    </div>
  </header>

  <div class="stage">
    <div class="specs">
      <p><strong>CHASSIS</strong><br>Open Steel Tubular</p>
      <p><strong>ENGINE</strong><br>125cc Single Cylinder</p>
      <p><strong>PAINT</strong><br>Industrial Yellow</p>
      <p><strong>STATUS</strong><br>Active</p>
    </div>

    <!-- SVG DRAWING START -->
    <svg id="rickshaw-container" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gradients -->
        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:var(--rickshaw-yellow);stop-opacity:1" />
          <stop offset="100%" style="stop-color:var(--rickshaw-yellow-dark);stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:var(--chrome);stop-opacity:1" />
          <stop offset="100%" style="stop-color:var(--metal-dark);stop-opacity:1" />
        </linearGradient>

        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#aaddff;stop-opacity:0.6" />
          <stop offset="100%" style="stop-color:#336699;stop-opacity:0.8" />
        </linearGradient>

        <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" style="stop-color:#FFF;stop-opacity:1" />
          <stop offset="40%" style="stop-color:#FFF9C4;stop-opacity:0.8" />
          <stop offset="100%" style="stop-color:#FFC107;stop-opacity:0" />
        </radialGradient>

        <!-- Patterns -->
        <pattern id="seatPattern" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
          <rect width="10" height="10" fill="#333"/>
          <rect width="5" height="10" fill="#222"/>
        </pattern>
      </defs>

      <!-- GROUND SHADOW -->
      <ellipse cx="400" cy="440" rx="320" ry="20" fill="rgba(0,0,0,0.15)" />

      <!-- REAR WHEEL (Left/Back) -->
      <g transform="translate(260, 390)">
        <circle cx="0" cy="0" r="55" fill="#222" /> <!-- Tire -->
        <circle cx="0" cy="0" r="45" fill="var(--metal)" /> <!-- Rim -->
        <circle cx="0" cy="0" r="15" fill="#111" /> <!-- Hub -->
        <!-- Spokes -->
        <path d="M0,-45 L0,45 M-45,0 L45,0 M-30,-30 L30,30 M-30,30 L30,-30" stroke="#555" stroke-width="4" />
        <!-- Mudguard -->
        <path d="M-60,10 A 60 60 0 0 1 60,10" fill="none" stroke="var(--rickshaw-yellow-dark)" stroke-width="12" />
      </g>

      <!-- REAR WHEEL (Right/Front) -->
      <g transform="translate(540, 390)">
        <circle cx="0" cy="0" r="55" fill="#111" /> <!-- Tire -->
        <circle cx="0" cy="0" r="45" fill="var(--metal)" /> <!-- Rim -->
        <circle cx="0" cy="0" r="15" fill="#111" /> <!-- Hub -->
        <path d="M0,-45 L0,45 M-45,0 L45,0 M-30,-30 L30,30 M-30,30 L30,-30" stroke="#555" stroke-width="4" />
        <!-- Mudguard -->
        <path d="M-60,10 A 60 60 0 0 1 60,10" fill="none" stroke="var(--rickshaw-yellow)" stroke-width="12" />
      </g>

      <!-- FRAME / CHASSIS -->
      <path d="M 240 390 L 280 250 L 520 250 L 560 390" fill="none" stroke="#333" stroke-width="8" stroke-linejoin="round"/>
      <line x1="300" y1="350" x2="500" y2="350" stroke="#333" stroke-width="6" />

      <!-- ENGINE AREA (Under Driver) -->
      <rect x="380" y="280" width="60" height="80" rx="5" fill="#444" />
      <rect x="385" y="290" width="50" height="30" fill="#222" /> <!-- Engine Block -->

      <!-- DRIVER AREA -->
      <!-- Driver Seat -->
      <path d="M 380 250 L 420 250 L 420 200 L 380 200 Z" fill="#222" />
      <path d="M 380 250 L 420 250 L 430 320 L 370 320 Z" fill="url(#seatPattern)" />
      
      <!-- Driver Silhouette (Simple) -->
      <circle cx="400" cy="180" r="15" fill="#333" />
      <path d="M 385 200 L 415 200 L 415 240 L 385 240 Z" fill="#333" />

      <!-- FRONT WHEEL -->
      <g transform="translate(400, 380)">
        <circle cx="0" cy="0" r="45" fill="#111" />
        <circle cx="0" cy="0" r="35" fill="var(--metal)" />
        <circle cx="0" cy="0" r="10" fill="#111" />
        <path d="M0,-35 L0,35 M-35,0 L35,0 M-25,-25 L25,25 M-25,25 L25,-25" stroke="#555" stroke-width="3" />
        <!-- Front Mudguard -->
        <path d="M-50,5 A 50 50 0 0 1 50,5" fill="none" stroke="var(--rickshaw-yellow)" stroke-width="10" />
      </g>

      <!-- FRONT ASSEMBLY (Fork, Handlebars) -->
      <!-- Fork -->
      <line x1="400" y1="250" x2="400" y2="380" stroke="#333" stroke-width="8" />
      <!-- Handlebars -->
      <path d="M 370 240 Q 400 230 430 240" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round" />
      <circle cx="370" cy="240" r="4" fill="#222" /> <!-- Grip -->
      <circle cx="430" cy="240" r="4" fill="#222" /> <!-- Grip -->
      
      <!-- Mirrors -->
      <path d="M 370 240 L 360 220 L 355 225" fill="none" stroke="#333" stroke-width="2" />
      <ellipse cx="355" cy="225" rx="5" ry="8" fill="#333" />
      <path d="M 430 240 L 440 220 L 445 225" fill="none" stroke="#333" stroke-width="2" />
      <ellipse cx="445" cy="225" rx="5" ry="8" fill="#333" />

      <!-- HEADLAMP -->
      <circle cx="400" cy="300" r="15" fill="url(#lampGlow)" />
      <circle cx="400" cy="300" r="10" fill="#222" stroke="var(--chrome)" stroke-width="2" />
      <circle cx="400" cy="300" r="6" fill="#FFF" />

      <!-- CABIN (Passenger Area) -->
      <g id="cabin">
        <!-- Back Wall -->
        <path d="M 260 250 L 540 250 L 540 160 L 260 160 Z" fill="var(--rickshaw-yellow-dark)" />
        
        <!-- Side Wall (Right/Foreground) -->
        <path d="M 540 160 L 540 250 L 600 250 L 600 160 Z" fill="var(--rickshaw-yellow)" />
        
        <!-- Door Frame (Right) -->
        <path d="M 540 250 L 540 160 L 570 160 L 570 250" fill="none" stroke="#333" stroke-width="4" />
        
        <!-- Windows (Right Side) -->
        <path d="M 545 165 L 565 165 L 565 190 L 545 190 Z" fill="var(--glassGrad)" />
        
        <!-- Decorative Stripe -->
        <path d="M 540 200 L 600 200 L 600 210 L 540 210 Z" fill="var(--accent-dark)" />

        <!-- Roof Canopy -->
        <path d="M 250 160 L 530 160 L 610 160 L 620 170 L 540 170 L 250 170 Z" fill="var(--metal)" />
        <path d="M 250 160 L 530 160 L 530 165 L 250 165 Z" fill="#555" /> <!-- Roof Shadow -->
        
        <!-- Roof Rack -->
        <path d="M 250 160 L 250 150 L 530 150 L 530 160" fill="none" stroke="#333" stroke-width="4" />
        <line x1="280" y1="150" x2="280" y2="160" stroke="#333" stroke-width="2" />
        <line x1="350" y1="150" x2="350" y2="160" stroke="#333" stroke-width="2" />
        <line x1="420" y1="150" x2="420" y2="160" stroke="#333" stroke-width="2" />
        <line x1="500" y1="150" x2="500" y2="160" stroke="#333" stroke-width="2" />
        
        <!-- Windshield -->
        <path d="M 260 160 L 540 160 L 520 110 L 280 110 Z" fill="var(--glassGrad)" />
        <path d="M 260 160 L 540 160 L 520 110 L 280 110 Z" fill="none" stroke="#555" stroke-width="3" />
        <line x1="400" y1="160" x2="400" y2="110" stroke="#555" stroke-width="3" /> <!-- Windshield Divider -->
      </g>

      <!-- INTERACTIVE HOTSPOTS -->
      <g class="hotspot-group">
        <circle cx="400" cy="300" r="4" class="hotspot" />
        <text x="420" y="305" class="hotspot-label">Headlamp</text>
      </g>
      <g class="hotspot-group">
        <circle cx="600" cy="200" r="4" class="hotspot" />
        <text x="620" y="205" class="hotspot-label">Passenger Door</text>
      </g>
      <g class="hotspot-group">
        <circle cx="400" cy="150" r="4" class="hotspot" />
        <text x="420" y="155" class="hotspot-label">Roof Rack</text>
      </g>

    </svg>
    <!-- SVG DRAWING END -->
  </div>

  <footer>
    <div>
      Designed for Urban Mobility<br>
      Vector Craft v1.0
    </div>
    <div>
      [ SCROLL FOR MORE ]
    </div>
  </footer>
</main>

<script>
  // Simple interaction to tilt the SVG based on mouse position
  const container = document.querySelector('main');
  const svg = document.getElementById('rickshaw-container');

  container.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth) - 0.5;
    const y = (e.clientY / window.innerHeight) - 0.5;

    // Subtle parallax effect
    svg.style.transform = `perspective(1000px) rotateY(${x * 5}deg) rotateX(${-y * 5}deg) scale(1.02)`;
  });

  container.addEventListener('mouseleave', () => {
    svg.style.transform = `perspective(1000px) rotateY(0deg) rotateX(0deg) scale(1)`;
  });
</script>

</body>
</html>
