<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crossy Road Style Game</title>
    <style>
        :root {
            --bg-sky-top: #4facfe;
            --bg-sky-bot: #00f2fe;
            --ui-text: #ffffff;
            --accent: #ffeb3b;
            --font-stack: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #333;
            font-family: var(--font-stack);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        /* Top HUD */
        .hud-top {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .score-pill {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            padding: 8px 20px;
            border-radius: 4px;
            color: var(--ui-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            transform: translateY(0);
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .score-pill.pop {
            transform: scale(1.15) translateY(-2px);
        }

        .pill-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            margin-bottom: 2px;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
        }

        .pill-value {
            font-size: 32px;
            font-weight: 900;
            line-height: 1;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        }

        .pill-value.best { 
            font-size: 24px; 
            color: var(--accent);
        }

        /* Bottom Controls - D-Pad */
        .controls-area {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 20px;
            pointer-events: auto; /* Allow clicking */
        }

        .dpad {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px;
            gap: 8px;
            transform: rotate(0deg);
        }

        .dpad-btn {
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .dpad-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.2);
            background: rgba(255, 255, 255, 0.4);
        }

        .dpad-up { grid-column: 2; grid-row: 1; }
        .dpad-left { grid-column: 1; grid-row: 2; }
        .dpad-down { grid-column: 2; grid-row: 2; }
        .dpad-right { grid-column: 3; grid-row: 2; }

        /* SVG Icons */
        .icon { width: 24px; height: 24px; fill: currentColor; }

        @media (max-width: 600px) {
            .hud-top { gap: 10px; }
            .score-pill { padding: 6px 12px; }
            .pill-value { font-size: 24px; }
            .pill-value.best { font-size: 18px; }
            .dpad { transform: scale(0.8); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div class="hud-top">
            <div class="score-pill">
                <div class="pill-label">Best</div>
                <div class="pill-value best" id="best-score">108</div>
            </div>
            <div class="score-pill" id="score-pill">
                <div class="pill-label">Score</div>
                <div class="pill-value" id="current-score">0</div>
            </div>
        </div>

        <div class="controls-area">
            <div class="dpad">
                <div class="dpad-btn dpad-up" onclick="game.player.move(0, 1)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
                </div>
                <div class="dpad-btn dpad-left" onclick="game.player.move(-1, 0)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                </div>
                <div class="dpad-btn dpad-down" onclick="game.player.move(0, -1)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
                </div>
                <div class="dpad-btn dpad-right" onclick="game.player.move(1, 0)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * REDESIGNED ENGINE
 * 2.5D Perspective, Flat UI, Dynamic Lighting
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

// --- CONFIGURATION ---
const CONFIG = {
    fov: 400,             // Increased FOV for flatter look
    cameraHeight: 280,    // Higher camera
    cameraDist: 180,      // Closer to player
    laneHeight: 60,       // Z-depth
    laneWidth: 600,       // Wider world
    blockSize: 40,
    colors: {
        skyTop: '#4facfe',
        skyBot: '#00f2fe',
        // Grass
        grassTop: '#7ec850',
        grassSide: '#4e9a25',
        // Road
        roadTop: '#607d8b',
        roadSide: '#37474f',
        // Water
        waterTop: '#29b6f6',
        waterSide: '#0288d1',
        // Wood
        woodTop: '#d7ccc8',
        woodSide: '#8d6e63',
        woodDark: '#5d4037'
    }
};

// --- STATE ---
const state = {
    width: 0,
    height: 0,
    centerX: 0,
    centerY: 0,
    playerZ: 0,
    score: 0,
    lanes: [],
    mountains: []
};

// --- UTILS ---
const project = (x, y, z) => {
    const camZ = state.playerZ + state.cameraDist;
    // Standard perspective projection
    // We offset z by playerZ so camera moves with player
    const relativeZ = z - state.playerZ;
    
    // Avoid divide by zero or rendering behind camera
    if (relativeZ + state.cameraDist <= 0) return null;

    const scale = CONFIG.fov / (CONFIG.fov + relativeZ + state.cameraDist);
    
    // x is centered on screen
    // y is calculated relative to camera height
    const screenX = state.centerX + (x * scale);
    const screenY = (state.height * 0.6) + (y - CONFIG.cameraHeight) * scale; // 0.6 pushes horizon down slightly
    
    return { x: screenX, y: screenY, scale: scale };
};

// Generate random mountains for background
function initMountains() {
    state.mountains = [];
    for(let i=0; i<20; i++) {
        state.mountains.push({
            x: (Math.random() * 2000) - 1000,
            z: 2000 + Math.random() * 2000,
            w: 200 + Math.random() * 300,
            h: 100 + Math.random() * 200,
            color: `rgba(255, 255, 255, ${0.1 + Math.random() * 0.2})`
        });
    }
    state.mountains.sort((a,b) => a.z - b.z);
}

// --- CLASSES ---

class Lane {
    constructor(zIndex) {
        this.zIndex = zIndex;
        this.z = zIndex * CONFIG.laneHeight;
        this.type = this.determineType(zIndex);
        this.traffic = [];
        this.logs = [];
        
        // Generate content
        if (this.type === 'road') {
            this.speed = (Math.random() > 0.5 ? 1 : -1) * (4 + Math.random() * 4);
            const count = 1 + Math.floor(Math.random() * 2);
            for(let i=0; i<count; i++) {
                this.addCar(i * 350);
            }
        } else if (this.type === 'water') {
            const count = 1 + Math.floor(Math.random() * 2);
            for(let i=0; i<count; i++) {
                this.logs.push({
                    x: (Math.random() * CONFIG.laneWidth) - (CONFIG.laneWidth/2),
                    width: 100 + Math.random() * 80,
                    speed: (Math.random() > 0.5 ? 1 : -1) * 2
                });
            }
        }
    }

    determineType(z) {
        // Pattern: 2 Grass, 2 Road, 1 Water, 2 Grass
        const mod = z % 7;
        if (mod < 2) return 'grass';
        if (mod < 4) return 'road';
        if (mod < 5) return 'water';
        return 'grass';
    }

    addCar(xOffset) {
        const carColors = ['#ff5252', '#ffeb3b', '#448aff', '#e040fb', '#8bc34a'];
        this.traffic.push({
            x: xOffset,
            width: 70,
            height: 45,
            depth: 50,
            color: carColors[Math.floor(Math.random()*carColors.length)]
        });
    }

    update() {
        if (this.type === 'road') {
            this.traffic.forEach(car => {
                car.x += this.speed;
                const limit = CONFIG.laneWidth;
                if (this.speed > 0 && car.x > limit) car.x = -limit;
                if (this.speed < 0 && car.x < -limit) car.x = limit;
            });
        } else if (this.type === 'water') {
            this.logs.forEach(log => {
                log.x += log.speed;
                if(log.x > CONFIG.laneWidth) log.x = -CONFIG.laneWidth;
            });
        }
    }

    draw() {
        if (this.z < state.playerZ - CONFIG.cameraDist - 100) return;

        const xLeft = -CONFIG.laneWidth/2 - 200; // Extend beyond visible
        const xRight = CONFIG.laneWidth/2 + 200;
        
        // Project corners
        const pBL = project(xLeft, 0, this.z);
        const pBR = project(xRight, 0, this.z);
        const pTL = project(xLeft, 0, this.z + CONFIG.laneHeight);
        const pTR = project(xRight, 0, this.z + CONFIG.laneHeight);

        if(!pBL || !pBR) return;

        // Draw Side Face (Depth)
        ctx.fillStyle = CONFIG.colors[this.type + 'Side'];
        ctx.beginPath();
        ctx.moveTo(pBL.x, pBL.y);
        ctx.lineTo(pBR.x, pBR.y);
        ctx.lineTo(pTR.x, pTR.y);
        ctx.lineTo(pTL.x, pTL.y);
        ctx.closePath();
        ctx.fill();

        // Draw Top Face
        ctx.fillStyle = CONFIG.colors[this.type + 'Top'];
        ctx.beginPath();
        ctx.moveTo(pTL.x, pTL.y);
        ctx.lineTo(pTR.x, pTR.y);
        ctx.lineTo(pBR.x, pBR.y);
        ctx.lineTo(pBL.x, pBL.y);
        ctx.closePath();
        ctx.fill();

        // Details
        if (this.type === 'road') {
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 4 * pBL.scale;
            ctx.setLineDash([20 * pBL.scale, 30 * pBL.scale]);
            ctx.beginPath();
            ctx.moveTo(pBL.x, pBL.y);
            ctx.lineTo(pTL.x, pTL.y);
            ctx.stroke();
            ctx.setLineDash([]);
        } else if (this.type === 'water') {
            // Draw Logs
            this.logs.forEach(log => this.drawLog(log));
        }

        // Draw Traffic
        if (this.type === 'road') {
            this.traffic.forEach(car => this.drawCar(car));
        }
    }

    drawCar(car) {
        const cx = car.x;
        const cz = this.z + 2; // Slight lift
        const w = car.width;
        const h = car.height;
        const d = car.depth;

        // Shadow
        const sFL = project(cx - w/2, 0, this.z);
        const sFR = project(cx + w/2, 0, this.z);
        const sBL = project(cx - w/2, 0, this.z + d);
        const sBR = project(cx + w/2, 0, this.z + d);
        
        if(sFL) {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.moveTo(sFL.x, sFL.y); ctx.lineTo(sFR.x, sFR.y);
            ctx.lineTo(sBR.x, sBR.y); ctx.lineTo(sBL.x, sBL.y);
            ctx.fill();
        }

        // Car Body (Simplified Cube)
        const bFL = project(cx - w/2, 0, cz);
        const bFR = project(cx + w/2, 0, cz);
        const bBL = project(cx - w/2, 0, cz + d);
        const bBR = project(cx + w/2, 0, cz + d);
        const tFL = project(cx - w/2, h, cz);
        const tFR = project(cx + w/2, h, cz);
        const tBL = project(cx - w/2, h, cz + d);
        const tBR = project(cx + w/2, h, cz + d);

        if(!bFL) return;

        // Top
        ctx.fillStyle = adjustColor(car.color, 20);
        ctx.beginPath();
        ctx.moveTo(tFL.x, tFL.y); ctx.lineTo(tFR.x, tFR.y);
        ctx.lineTo(tBR.x, tBR.y); ctx.lineTo(tBL.x, tBL.y);
        ctx.fill();

        // Front (Facing camera)
        ctx.fillStyle = adjustColor(car.color, 40);
        ctx.beginPath();
        ctx.moveTo(bFL.x, bFL.y); ctx.lineTo(bFR.x, bFR.y);
        ctx.lineTo(tFR.x, tFR.y); ctx.lineTo(tFL.x, tFL.y);
        ctx.fill();

        // Side (Right)
        ctx.fillStyle = adjustColor(car.color, -40);
        ctx.beginPath();
        ctx.moveTo(bFR.x, bFR.y); ctx.lineTo(bBR.x, bBR.y);
        ctx.lineTo(tBR.x, tBR.y); ctx.lineTo(tFR.x, tFR.y);
        ctx.fill();

        // Side (Left)
        ctx.fillStyle = adjustColor(car.color, -10);
        ctx.beginPath();
        ctx.moveTo(bFL.x, bFL.y); ctx.lineTo(bBL.x, bBL.y);
        ctx.lineTo(tBL.x, tBL.y); ctx.lineTo(tFL.x, tFL.y);
        ctx.fill();
    }

    drawLog(log) {
        const lx = log.x;
        const lz = this.z + 5;
        const w = log.width;
        const h = 10;
        const d = 40;

        const bFL = project(lx - w/2, 0, lz);
        const bFR = project(lx + w/2, 0, lz);
        const bBL = project(lx - w/2, 0, lz + d);
        const bBR = project(lx + w/2, 0, lz + d);
        const tFL = project(lx - w/2, h, lz);
        const tFR = project(lx + w/2, h, lz);
        const tBL = project(lx - w/2, h, lz + d);
        const tBR = project(lx + w/2, h, lz + d);

        if(!bFL) return;

        // Shadow on water
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.moveTo(bFL.x, bFL.y); ctx.lineTo(bFR.x, bFR.y);
        ctx.lineTo(bBR.x, bBR.y); ctx.lineTo(bBL.x, bBL.y);
        ctx.fill();

        // Log Body
        ctx.fillStyle = CONFIG.colors.woodTop;
        ctx.beginPath();
        ctx.moveTo(tFL.x, tFL.y); ctx.lineTo(tFR.x, tFR.y);
        ctx.lineTo(tBR.x, tBR.y); ctx.lineTo(tBL.x, tBL.y);
        ctx.fill();

        ctx.fillStyle = CONFIG.colors.woodSide;
        ctx.beginPath();
        ctx.moveTo(bFR.x, bFR.y); ctx.lineTo(bBR.x, bBR.y);
        ctx.lineTo(tBR.x, tBR.y); ctx.lineTo(tFR.x, tFR.y);
        ctx.fill();
        
        ctx.fillStyle = CONFIG.colors.woodDark;
        ctx.beginPath();
        ctx.moveTo(bFL.x, bFL.y); ctx.lineTo(bBL.x, bBL.y);
        ctx.lineTo(tBL.x, tBL.y); ctx.lineTo(tFL.x, tFL.y);
        ctx.fill();
    }
}

class Player {
    constructor() {
        this.x = 0;
        this.z = 0;
        this.targetX = 0;
        this.targetZ = 0;
        this.hopY = 0;
        this.hopVel = 0;
        this.isHopping = false;
        this.facing = 0; // -1 left, 0 front, 1 right
    }

    move(dx, dy) {
        if (this.isHopping) return;
        
        this.targetX += dx * 60; // Grid snap
        this.targetZ += dy * CONFIG.laneHeight;
        
        // Clamp X
        if (this.targetX > CONFIG.laneWidth/2) this.targetX = CONFIG.laneWidth/2;
        if (this.targetX < -CONFIG.laneWidth/2) this.targetX = -CONFIG.laneWidth/2;
        
        this.isHopping = true;
        this.hopVel = 9;
        
        if(dx > 0) this.facing = 1;
        if(dx < 0) this.facing = -1;

        if (dy > 0) {
            state.score++;
            this.updateScoreUI();
        }
    }

    updateScoreUI() {
        const el = document.getElementById('current-score');
        const pill = document.getElementById('score-pill');
        el.innerText = state.score;
        pill.classList.add('pop');
        setTimeout(() => pill.classList.remove('pop'), 150);
    }

    update() {
        // Smooth movement
        this.x += (this.targetX - this.x) * 0.15;
        this.z += (this.targetZ - this.z) * 0.15;

        // Hop Physics
        if (this.isHopping) {
            this.hopY += this.hopVel;
            this.hopVel -= 0.8; // Gravity
            
            if (this.hopY <= 0) {
                this.hopY = 0;
                this.isHopping = false;
                this.x = this.targetX;
                this.z = this.targetZ;
                state.playerZ = this.z;
            }
        }
    }

    draw() {
        // Shadow
        const sP = project(this.x, 0, this.z);
        if(!sP) return;
        
        const shadowScale = Math.max(0.4, 1 - (this.hopY / 120));
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(sP.x, sP.y, 20 * sP.scale * shadowScale, 12 * sP.scale * shadowScale, 0, 0, Math.PI*2);
        ctx.fill();

        // Draw Character (Charming Low-Poly Chicken)
        const size = 40;
        const pX = this.x;
        const pY = this.hopY;
        const pZ = this.z;

        // Helper
        const p = (x, y, z) => project(pX + x, pY + y, pZ + z);

        // Body (Cube)
        const b0 = p(-size/2, 0, -size/2); // FBL
        const b1 = p( size/2, 0, -size/2); // FBR
        const b2 = p( size/2, 0,  size/2); // BBR
        const b3 = p(-size/2, 0,  size/2); // BBL
        const b4 = p(-size/2, size, -size/2); // FTBL
        const b5 = p( size/2, size, -size/2); // FTBR
        const b6 = p( size/2, size,  size/2); // BTBR
        const b7 = p(-size/2, size,  size/2); // BTBL

        // Body Colors
        const bodyLight = '#ffffff';
        const bodyDark = '#e0e0e0';
        const bodySide = '#bdbdbd';

        // Draw Body Faces
        // Top
        ctx.fillStyle = bodyLight;
        ctx.beginPath(); ctx.moveTo(b4.x, b4.y); ctx.lineTo(b5.x, b5.y); ctx.lineTo(b6.x, b6.y); ctx.lineTo(b7.x, b7.y); ctx.fill();
        
        // Front
        ctx.fillStyle = '#f5f5f5';
        ctx.beginPath(); ctx.moveTo(b0.x, b0.y); ctx.lineTo(b1.x, b1.y); ctx.lineTo(b5.x, b5.y); ctx.lineTo(b4.x, b4.y); ctx.fill();
        
        // Right
        ctx.fillStyle = bodySide;
        ctx.beginPath(); ctx.moveTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y); ctx.lineTo(b6.x, b6.y); ctx.lineTo(b5.x, b5.y); ctx.fill();
        
        // Left
        ctx.fillStyle = bodyDark;
        ctx.beginPath(); ctx.moveTo(b0.x, b0.y); ctx.lineTo(b3.x, b3.y); ctx.lineTo(b7.x, b7.y); ctx.lineTo(b4.x, b4.y); ctx.fill();

        // Head (Smaller Cube)
        const hSize = size * 0.7;
        const hY = size * 0.6;
        const hZ = -size * 0.3;
        
        const h0 = p(-hSize/2, hY, hZ - hSize/2);
        const h1 = p( hSize/2, hY, hZ - hSize/2);
        const h2 = p( hSize/2, hY, hZ + hSize/2);
        const h3 = p(-hSize/2, hY, hZ + hSize/2);
        const h4 = p(-hSize/2, hY + hSize, hZ - hSize/2);
        const h5 = p( hSize/2, hY + hSize, hZ - hSize/2);
        const h6 = p( hSize/2, hY + hSize, hZ + hSize/2);
        const h7 = p(-hSize/2, hY + hSize, hZ + hSize/2);

        // Head Faces
        ctx.fillStyle = bodyLight;
        ctx.beginPath(); ctx.moveTo(h4.x, h4.y); ctx.lineTo(h5.x, h5.y); ctx.lineTo(h6.x, h6.y); ctx.lineTo(h7.x, h7.y); ctx.fill();
        
        ctx.fillStyle = '#f5f5f5';
        ctx.beginPath(); ctx.moveTo(h0.x, h0.y); ctx.lineTo(h1.x, h1.y); ctx.lineTo(h5.x, h5.y); ctx.lineTo(h4.x, h4.y); ctx.fill();
        
        ctx.fillStyle = bodySide;
        ctx.beginPath(); ctx.moveTo(h1.x, h1.y); ctx.lineTo(h2.x, h2.y); ctx.lineTo(h6.x, h6.y); ctx.lineTo(h5.x, h5.y); ctx.fill();
        
        ctx.fillStyle = bodyDark;
        ctx.beginPath(); ctx.moveTo(h0.x, h0.y); ctx.lineTo(h3.x, h3.y); ctx.lineTo(h7.x, h7.y); ctx.lineTo(h4.x, h4.y); ctx.fill();

        // Details: Eyes
        const eyeSize = 4 * b0.scale;
        const eyeY = h0.y - (hSize/2)*b0.scale;
        ctx.fillStyle = '#333';
        ctx.beginPath(); ctx.arc(h0.x + (hSize/3)*b0.scale, eyeY, eyeSize, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(h1.x - (hSize/3)*b1.scale, eyeY, eyeSize, 0, Math.PI*2); ctx.fill();

        // Details: Beak
        ctx.fillStyle = '#ffca28';
        ctx.beginPath();
        const beakX = (h0.x + h1.x) / 2;
        const beakY = h0.y - (hSize/2)*b0.scale + eyeSize;
        ctx.moveTo(beakX, beakY);
        ctx.lineTo(beakX - 5*b0.scale, beakY + 6*b0.scale);
        ctx.lineTo(beakX + 5*b0.scale, beakY + 6*b0.scale);
        ctx.fill();

        // Details: Comb
        ctx.fillStyle = '#e53935';
        ctx.beginPath();
        ctx.moveTo(h4.x, h4.y);
        ctx.lineTo(h5.x, h5.y);
        ctx.lineTo(h4.x + (h5.x-h4.x)/2, h4.y - 8*b0.scale);
        ctx.fill();
    }
}

function adjustColor(hex, percent) {
    let r = parseInt(hex.substring(1,3), 16);
    let g = parseInt(hex.substring(3,5), 16);
    let b = parseInt(hex.substring(5,7), 16);
    r = Math.min(255, Math.max(0, r + percent));
    g = Math.min(255, Math.max(0, g + percent));
    b = Math.min(255, Math.max(0, b + percent));
    return `rgb(${r},${g},${b})`;
}

// --- INITIALIZATION ---

const player = new Player();
initMountains();

function init() {
    resize();
    window.addEventListener('resize', resize);
    
    // Create initial lanes
    for (let i = -5; i < 20; i++) {
        state.lanes.push(new Lane(i));
    }

    // Input Handling
    window.addEventListener('keydown', (e) => {
        switch(e.key) {
            case 'ArrowUp': case 'w': player.move(0, 1); break;
            case 'ArrowDown': case 's': player.move(0, -1); break;
            case 'ArrowLeft': case 'a': player.move(-1, 0); break;
            case 'ArrowRight': case 'd': player.move(1, 0); break;
        }
    });

    // Touch/Click handling on canvas for "tap to move forward" convenience
    canvas.addEventListener('touchstart', (e) => {
        // Only if not clicking UI
        if(e.target === canvas) {
            e.preventDefault();
            player.move(0, 1);
        }
    }, {passive: false});
    
    canvas.addEventListener('mousedown', (e) => {
        if(e.target === canvas) player.move(0, 1);
    });

    loop();
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    state.width = canvas.width;
    state.height = canvas.height;
    state.centerX = state.width / 2;
}

// --- GAME LOOP ---

function loop() {
    // 1. Draw Background (Sky Gradient)
    const gradient = ctx.createLinearGradient(0, 0, 0, state.height);
    gradient.addColorStop(0, CONFIG.colors.skyTop);
    gradient.addColorStop(1, CONFIG.colors.skyBot);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, state.width, state.height);

    // 2. Draw Mountains (Parallax-ish)
    state.mountains.forEach(m => {
        // Simple parallax: move x slightly based on player movement (optional, kept static for stability)
        // Just draw them
        const mProj = project(m.x, 0, m.z);
        if(mProj) {
            ctx.fillStyle = m.color;
            ctx.beginPath();
            ctx.moveTo(mProj.x - m.w * mProj.scale, mProj.y);
            ctx.lineTo(mProj.x, mProj.y - m.h * mProj.scale);
            ctx.lineTo(mProj.x + m.w * mProj.scale, mProj.y);
            ctx.fill();
        }
    });

    // Update Player
    player.update();

    // Update Lanes
    state.lanes.forEach(lane => lane.update());

    // Infinite Scroll Logic
    const playerLaneIndex = Math.floor(player.z / CONFIG.laneHeight);
    
    if (state.lanes[0].zIndex < playerLaneIndex - 5) {
        state.lanes.shift();
        const lastZ = state.lanes[state.lanes.length-1].zIndex;
        state.lanes.push(new Lane(lastZ + 1));
    }

    // Draw Lanes (Back to Front)
    // Sort by Z descending (furthest first)
    const sortedLanes = [...state.lanes].sort((a, b) => b.z - a.z);
    
    sortedLanes.forEach(lane => {
        // Cull lanes behind camera
        if (lane.z < state.playerZ - CONFIG.cameraDist - 50) return;
        lane.draw();
    });

    // Draw Player (Always on top of lanes)
    player.draw();

    requestAnimationFrame(loop);
}

// Make player move function global for HTML onclick
window.game = { player: player };

// Start
init();

</script>
