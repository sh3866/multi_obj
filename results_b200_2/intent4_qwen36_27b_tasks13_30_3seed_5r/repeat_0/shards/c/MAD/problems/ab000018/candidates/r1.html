<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Low Poly Crossing</title>
    <style>
        :root {
            --bg-sky: #2c3e50; /* Darker, cleaner sky */
            --ui-bg: rgba(20, 25, 35, 0.85);
            --ui-text: #ffffff;
            --accent: #f1c40f;
            --font-stack: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-sky);
            font-family: var(--font-stack);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
        }

        /* Top HUD */
        .hud-top {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .score-pill {
            background: var(--ui-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 50px;
            color: var(--ui-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            transform: translateY(0);
            transition: transform 0.1s ease;
        }
        
        .score-pill.pop {
            transform: scale(1.1);
        }

        .pill-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
            margin-bottom: 2px;
        }

        .pill-value {
            font-size: 24px;
            font-weight: 800;
            line-height: 1;
        }

        .pill-value.best { color: var(--accent); }

        /* Bottom Controls Bar */
        .controls-bar {
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            width: 100%;
            padding: 20px 0 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .key-hint {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .key-cap {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .hud-top { gap: 8px; }
            .score-pill { min-width: 60px; padding: 6px 10px; }
            .pill-value { font-size: 18px; }
            .controls-bar { font-size: 12px; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div class="hud-top">
            <div class="score-pill">
                <div class="pill-label">Best</div>
                <div class="pill-value best" id="best-score">108</div>
            </div>
            <div class="score-pill" id="score-pill">
                <div class="pill-label">Score</div>
                <div class="pill-value" id="current-score">0</div>
            </div>
        </div>

        <div class="controls-bar">
            <div class="key-hint">
                <span class="key-cap">W</span>
                <span class="key-cap">A</span>
                <span class="key-cap">S</span>
                <span class="key-cap">D</span>
                <span>or Tap to Move</span>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * REDESIGNED ENGINE
 * Focus: 2.5D Perspective, Consistent Lighting (Top-Left), Visual Polish
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); // Optimize

// --- CONFIGURATION ---
const CONFIG = {
    fov: 350,            // Field of View
    cameraHeight: 220,   // Higher camera for better depth perception
    cameraDist: 250,     // Distance behind player
    laneHeight: 50,      // Z-depth of a lane
    laneWidth: 500,      // World width
    blockSize: 40,       // Player size
    colors: {
        // Lighting Palette (Light Top-Left, Dark Bottom-Right)
        grassTop: '#8bc34a',
        grassSide: '#558b2f',
        roadTop: '#607d8b',
        roadSide: '#37474f',
        waterTop: '#29b6f6',
        waterSide: '#0277bd',
        woodTop: '#a1887f',
        woodSide: '#5d4037',
        playerTop: '#ffffff',
        playerSide: '#e0e0e0',
        playerBeak: '#ffca28'
    }
};

// --- STATE ---
let state = {
    width: 0,
    height: 0,
    centerX: 0,
    centerY: 0, // Will be set to vertical center
    playerZ: 0,
    score: 0,
    lanes: []
};

// --- UTILS ---

// 3D Projection with 2.5D perspective
function project(x, y, z) {
    // Camera tracks player Z
    const camZ = state.playerZ + state.cameraDist;
    
    // Perspective scale factor
    const scale = CONFIG.fov / (CONFIG.fov + (z - state.playerZ));
    
    // Project to screen coordinates
    // x is centered on screen center
    // y is relative to camera height
    const screenX = state.centerX + (x * scale);
    const screenY = state.centerY + (y - CONFIG.cameraHeight) * scale;
    
    return { x: screenX, y: screenY, scale: scale };
}

// Color helper for lighting
function getShade(baseColor, darker) {
    return darker ? CONFIG.colors[baseColor + 'Side'] : CONFIG.colors[baseColor + 'Top'];
}

// --- CLASSES ---

class Lane {
    constructor(zIndex) {
        this.zIndex = zIndex;
        this.z = zIndex * CONFIG.laneHeight;
        this.type = this.determineType(zIndex);
        this.traffic = [];
        this.logs = [];
        
        // Generate content
        if (this.type === 'road') {
            this.speed = (Math.random() > 0.5 ? 1 : -1) * (3 + Math.random() * 3);
            const count = 1 + Math.floor(Math.random() * 2);
            for(let i=0; i<count; i++) {
                this.addCar(i * 300);
            }
        } else if (this.type === 'water') {
            // Add logs
            const count = 1 + Math.floor(Math.random() * 2);
            for(let i=0; i<count; i++) {
                this.logs.push({
                    x: (Math.random() * CONFIG.laneWidth) - (CONFIG.laneWidth/2),
                    width: 80 + Math.random() * 60,
                    speed: 1.5
                });
            }
        }
    }

    determineType(z) {
        // Pattern: 3 Grass, 2 Road, 1 Water, 2 Grass
        const mod = z % 8;
        if (mod < 3) return 'grass';
        if (mod < 5) return 'road';
        if (mod < 6) return 'water';
        return 'grass';
    }

    addCar(xOffset) {
        const carColors = ['#ff5252', '#ffeb3b', '#448aff', '#e040fb'];
        this.traffic.push({
            x: xOffset,
            width: 70,
            height: 45,
            depth: 50,
            color: carColors[Math.floor(Math.random()*carColors.length)],
            yOff: 0 // For animation
        });
    }

    update() {
        if (this.type === 'road') {
            this.traffic.forEach(car => {
                car.x += this.speed;
                // Wrap
                const limit = CONFIG.laneWidth;
                if (this.speed > 0 && car.x > limit) car.x = -limit;
                if (this.speed < 0 && car.x < -limit) car.x = limit;
            });
        } else if (this.type === 'water') {
            this.logs.forEach(log => {
                log.x += log.speed;
                if(log.x > CONFIG.laneWidth) log.x = -CONFIG.laneWidth;
            });
        }
    }

    draw() {
        // Optimization: Cull if behind camera
        if (this.z < state.playerZ - CONFIG.cameraDist) return;

        // 1. Draw Terrain Block
        // We draw the "Side" (depth) and "Top" (surface)
        
        // Define corners
        // x: -250 to 250 (half width)
        const xLeft = -CONFIG.laneWidth/2;
        const xRight = CONFIG.laneWidth/2;
        
        // Project points
        const pBL = project(xLeft, 0, this.z);
        const pBR = project(xRight, 0, this.z);
        const pTL = project(xLeft, 0, this.z + CONFIG.laneHeight);
        const pTR = project(xRight, 0, this.z + CONFIG.laneHeight);

        // Draw Side Face (Depth)
        ctx.beginPath();
        ctx.moveTo(pBL.x, pBL.y);
        ctx.lineTo(pBR.x, pBR.y);
        ctx.lineTo(pTR.x, pTR.y);
        ctx.lineTo(pTL.x, pTL.y);
        ctx.closePath();
        
        // Apply consistent lighting (Side is darker)
        ctx.fillStyle = getShade(this.type, true);
        ctx.fill();

        // Draw Top Face
        ctx.beginPath();
        ctx.moveTo(pTL.x, pTL.y);
        ctx.lineTo(pTR.x, pTR.y);
        ctx.lineTo(pBR.x, pBR.y);
        ctx.lineTo(pBL.x, pBL.y);
        ctx.closePath();
        
        // Apply consistent lighting (Top is lighter)
        ctx.fillStyle = getShade(this.type, false);
        ctx.fill();

        // 2. Draw Details
        if (this.type === 'road') {
            // Dashed lines
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 2 * pBL.scale;
            ctx.setLineDash([15 * pBL.scale, 20 * pBL.scale]);
            ctx.beginPath();
            ctx.moveTo(pBL.x + (CONFIG.laneWidth/2)*pBL.scale, pBL.y); // Center
            ctx.lineTo(pTL.x + (CONFIG.laneWidth/2)*pTL.scale, pTL.y);
            ctx.stroke();
            ctx.setLineDash([]);
        } else if (this.type === 'water') {
            // Simple wave lines
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 2 * pBL.scale;
            const midX = (pBL.x + pBR.x) / 2;
            const midY = (pBL.y + pBR.y) / 2;
            ctx.beginPath();
            ctx.moveTo(midX - 50*pBL.scale, midY);
            ctx.quadraticCurveTo(midX, midY - 5*pBL.scale, midX + 50*pBL.scale, midY);
            ctx.stroke();
        }

        // 3. Draw Objects (Cars/Logs)
        if (this.type === 'road') {
            this.traffic.forEach(car => this.drawCar(car));
        } else if (this.type === 'water') {
            this.logs.forEach(log => this.drawLog(log));
        }
    }

    drawCar(car) {
        // Car Geometry
        const cx = car.x;
        const cz = this.z;
        const w = car.width;
        const h = car.height;
        const d = car.depth;

        // Project 8 corners (Simplified for low poly)
        // Bottom
        const bFL = project(cx - w/2, 0, cz);
        const bFR = project(cx + w/2, 0, cz);
        const bBL = project(cx - w/2, 0, cz + d);
        const bBR = project(cx + w/2, 0, cz + d);
        
        // Top
        const tFL = project(cx - w/2, h, cz);
        const tFR = project(cx + w/2, h, cz);
        const tBL = project(cx - w/2, h, cz + d);
        const tBR = project(cx + w/2, h, cz + d);

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.moveTo(bFL.x, bFL.y);
        ctx.lineTo(bFR.x, bFR.y);
        ctx.lineTo(bBR.x, bBR.y);
        ctx.lineTo(bBL.x, bBL.y);
        ctx.fill();

        // Draw Faces (Lighting: Top-Left is light, Bottom-Right is dark)
        
        // Top Face
        ctx.fillStyle = car.color;
        ctx.beginPath();
        ctx.moveTo(tFL.x, tFL.y);
        ctx.lineTo(tFR.x, tFR.y);
        ctx.lineTo(tBR.x, tBR.y);
        ctx.lineTo(tBL.x, tBL.y);
        ctx.fill();

        // Front Face (Facing camera) - Lightest
        ctx.fillStyle = this.adjustColor(car.color, 40);
        ctx.beginPath();
        ctx.moveTo(bFL.x, bFL.y);
        ctx.lineTo(bFR.x, bFR.y);
        ctx.lineTo(tFR.x, tFR.y);
        ctx.lineTo(tFL.x, tFL.y);
        ctx.fill();

        // Right Face (Facing right/down) - Dark
        ctx.fillStyle = this.adjustColor(car.color, -40);
        ctx.beginPath();
        ctx.moveTo(bFR.x, bFR.y);
        ctx.lineTo(bBR.x, bBR.y);
        ctx.lineTo(tBR.x, tBR.y);
        ctx.lineTo(tFR.x, tFR.y);
        ctx.fill();

        // Left Face (Facing left/up) - Medium
        ctx.fillStyle = this.adjustColor(car.color, -10);
        ctx.beginPath();
        ctx.moveTo(bFL.x, bFL.y);
        ctx.lineTo(bBL.x, bBL.y);
        ctx.lineTo(tBL.x, tBL.y);
        ctx.lineTo(tFL.x, tFL.y);
        ctx.fill();
    }

    drawLog(log) {
        const lx = log.x;
        const lz = this.z + 5; // Slightly raised
        const w = log.width;
        const h = 15;
        const d = 40;

        const bFL = project(lx - w/2, 0, lz);
        const bFR = project(lx + w/2, 0, lz);
        const bBL = project(lx - w/2, 0, lz + d);
        const bBR = project(lx + w/2, 0, lz + d);
        const tFL = project(lx - w/2, h, lz);
        const tFR = project(lx + w/2, h, lz);
        const tBL = project(lx - w/2, h, lz + d);
        const tBR = project(lx + w/2, h, lz + d);

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.moveTo(bFL.x, bFL.y);
        ctx.lineTo(bFR.x, bFR.y);
        ctx.lineTo(bBR.x, bBR.y);
        ctx.lineTo(bBL.x, bBL.y);
        ctx.fill();

        // Faces
        ctx.fillStyle = CONFIG.colors.woodTop;
        ctx.beginPath();
        ctx.moveTo(tFL.x, tFL.y); ctx.lineTo(tFR.x, tFR.y);
        ctx.lineTo(tBR.x, tBR.y); ctx.lineTo(tBL.x, tBL.y);
        ctx.fill();

        ctx.fillStyle = CONFIG.colors.woodSide;
        ctx.beginPath();
        ctx.moveTo(bFR.x, bFR.y); ctx.lineTo(bBR.x, bBR.y);
        ctx.lineTo(tBR.x, tBR.y); ctx.lineTo(tFR.x, tFR.y);
        ctx.fill();
        
        ctx.fillStyle = this.adjustColor(CONFIG.colors.woodTop, -20);
        ctx.beginPath();
        ctx.moveTo(bFL.x, bFL.y); ctx.lineTo(bBL.x, bBL.y);
        ctx.lineTo(tBL.x, tBL.y); ctx.lineTo(tFL.x, tFL.y);
        ctx.fill();
    }

    adjustColor(hex, percent) {
        let r = parseInt(hex.substring(1,3), 16);
        let g = parseInt(hex.substring(3,5), 16);
        let b = parseInt(hex.substring(5,7), 16);
        r = Math.min(255, Math.max(0, r + percent));
        g = Math.min(255, Math.max(0, g + percent));
        b = Math.min(255, Math.max(0, b + percent));
        return `rgb(${r},${g},${b})`;
    }
}

class Player {
    constructor() {
        this.x = 0;
        this.z = 0;
        this.targetX = 0;
        this.targetZ = 0;
        this.hopY = 0;
        this.hopVel = 0;
        this.isHopping = false;
        this.rotation = 0; // For visual flair
    }

    move(dx, dy) {
        if (this.isHopping) return;
        
        this.targetX += dx * 50; // Grid snap width approx
        this.targetZ += dy * CONFIG.laneHeight;
        
        // Clamp X
        if (this.targetX > CONFIG.laneWidth/2) this.targetX = CONFIG.laneWidth/2;
        if (this.targetX < -CONFIG.laneWidth/2) this.targetX = -CONFIG.laneWidth/2;
        
        this.isHopping = true;
        this.hopVel = 8; // Jump height

        // Score logic
        if (dy > 0) {
            state.score++;
            this.updateScoreUI();
        }
    }

    updateScoreUI() {
        const el = document.getElementById('current-score');
        const pill = document.getElementById('score-pill');
        el.innerText = state.score;
        
        // Pop animation
        pill.classList.add('pop');
        setTimeout(() => pill.classList.remove('pop'), 100);
    }

    update() {
        // Smooth movement (Lerp)
        this.x += (this.targetX - this.x) * 0.15;
        this.z += (this.targetZ - this.z) * 0.15;

        // Hop Physics
        if (this.isHopping) {
            this.hopY += this.hopVel;
            this.hopVel -= 0.6; // Gravity
            
            if (this.hopY <= 0) {
                this.hopY = 0;
                this.isHopping = false;
                // Snap
                this.x = this.targetX;
                this.z = this.targetZ;
                state.playerZ = this.z;
            }
        }
    }

    draw() {
        // 1. Draw Shadow
        // Shadow stays on ground, scales with height
        const sP = project(this.x, 0, this.z);
        const shadowScale = Math.max(0.5, 1 - (this.hopY / 100));
        
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(sP.x, sP.y, 18 * sP.scale * shadowScale, 10 * sP.scale * shadowScale, 0, 0, Math.PI*2);
        ctx.fill();

        // 2. Draw Character (Charming Low-Poly Chicken)
        const size = CONFIG.blockSize;
        const pX = this.x;
        const pY = this.hopY;
        const pZ = this.z;

        // Helper to get projected point
        const p = (x, y, z) => project(pX + x, pY + y, pZ + z);

        // Define vertices for a cube body + head
        // Body
        const b0 = p(-size/2, 0, -size/2); // Front-Bottom-Left
        const b1 = p( size/2, 0, -size/2); // Front-Bottom-Right
        const b2 = p( size/2, 0,  size/2); // Back-Bottom-Right
        const b3 = p(-size/2, 0,  size/2); // Back-Bottom-Left
        const b4 = p(-size/2, size, -size/2); // Front-Top-Left
        const b5 = p( size/2, size, -size/2); // Front-Top-Right
        const b6 = p( size/2, size,  size/2); // Back-Top-Right
        const b7 = p(-size/2, size,  size/2); // Back-Top-Left

        // Head (Smaller box on top)
        const hSize = size * 0.6;
        const hY = size * 0.8; // Offset up
        const hZ = -size * 0.2; // Offset forward
        const h0 = p(-hSize/2, hY, hZ - hSize/2);
        const h1 = p( hSize/2, hY, hZ - hSize/2);
        const h2 = p( hSize/2, hY, hZ + hSize/2);
        const h3 = p(-hSize/2, hY, hZ + hSize/2);
        const h4 = p(-hSize/2, hY + hSize, hZ - hSize/2);
        const h5 = p( hSize/2, hY + hSize, hZ - hSize/2);
        const h6 = p( hSize/2, hY + hSize, hZ + hSize/2);
        const h7 = p(-hSize/2, hY + hSize, hZ + hSize/2);

        // --- Draw Body ---
        // Top Face
        ctx.fillStyle = CONFIG.colors.playerTop;
        ctx.beginPath();
        ctx.moveTo(b4.x, b4.y); ctx.lineTo(b5.x, b5.y);
        ctx.lineTo(b6.x, b6.y); ctx.lineTo(b7.x, b7.y);
        ctx.fill();

        // Right Face (Dark)
        ctx.fillStyle = CONFIG.colors.playerSide;
        ctx.beginPath();
        ctx.moveTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y);
        ctx.lineTo(b6.x, b6.y); ctx.lineTo(b5.x, b5.y);
        ctx.fill();

        // Left Face (Medium)
        ctx.fillStyle = this.adjustColor(CONFIG.colors.playerTop, -10);
        ctx.beginPath();
        ctx.moveTo(b0.x, b0.y); ctx.lineTo(b3.x, b3.y);
        ctx.lineTo(b7.x, b7.y); ctx.lineTo(b4.x, b4.y);
        ctx.fill();

        // Front Face (Light)
        ctx.fillStyle = this.adjustColor(CONFIG.colors.playerTop, 20);
        ctx.beginPath();
        ctx.moveTo(b0.x, b0.y); ctx.lineTo(b1.x, b1.y);
        ctx.lineTo(b5.x, b5.y); ctx.lineTo(b4.x, b4.y);
        ctx.fill();

        // --- Draw Head ---
        // Top
        ctx.fillStyle = CONFIG.colors.playerTop;
        ctx.beginPath();
        ctx.moveTo(h4.x, h4.y); ctx.lineTo(h5.x, h5.y);
        ctx.lineTo(h6.x, h6.y); ctx.lineTo(h7.x, h7.y);
        ctx.fill();

        // Front
        ctx.fillStyle = this.adjustColor(CONFIG.colors.playerTop, 20);
        ctx.beginPath();
        ctx.moveTo(h0.x, h0.y); ctx.lineTo(h1.x, h1.y);
        ctx.lineTo(h5.x, h5.y); ctx.lineTo(h4.x, h4.y);
        ctx.fill();

        // --- Details (Eyes & Beak) ---
        // Eyes on front face
        const eyeSize = 3 * b0.scale;
        const eyeY = h0.y - (hSize/2)*b0.scale - (hSize/3)*b0.scale;
        
        ctx.fillStyle = '#333';
        // Left Eye
        ctx.beginPath();
        ctx.arc(h0.x + (hSize/3)*b0.scale, eyeY, eyeSize, 0, Math.PI*2);
        ctx.fill();
        // Right Eye
        ctx.beginPath();
        ctx.arc(h1.x - (hSize/3)*b1.scale, eyeY, eyeSize, 0, Math.PI*2);
        ctx.fill();

        // Beak (Triangle on front)
        ctx.fillStyle = CONFIG.colors.playerBeak;
        ctx.beginPath();
        const beakX = (h0.x + h1.x) / 2;
        const beakY = h0.y - (hSize/2)*b0.scale;
        ctx.moveTo(beakX, beakY);
        ctx.lineTo(beakX - 4*b0.scale, beakY + 4*b0.scale);
        ctx.lineTo(beakX + 4*b0.scale, beakY + 4*b0.scale);
        ctx.fill();
        
        // Comb (Red thing on head)
        ctx.fillStyle = '#e53935';
        ctx.beginPath();
        ctx.moveTo(h4.x, h4.y);
        ctx.lineTo(h5.x, h5.y);
        ctx.lineTo(h4.x + (h5.x-h4.x)/2, h4.y - 5*b0.scale);
        ctx.fill();
    }

    adjustColor(hex, percent) {
        // Quick helper for the player class
        let r = parseInt(hex.substring(1,3), 16);
        let g = parseInt(hex.substring(3,5), 16);
        let b = parseInt(hex.substring(5,7), 16);
        r = Math.min(255, Math.max(0, r + percent));
        g = Math.min(255, Math.max(0, g + percent));
        b = Math.min(255, Math.max(0, b + percent));
        return `rgb(${r},${g},${b})`;
    }
}

// --- INITIALIZATION ---

const player = new Player();

function init() {
    resize();
    window.addEventListener('resize', resize);
    
    // Create initial lanes
    for (let i = -5; i < 20; i++) {
        state.lanes.push(new Lane(i));
    }

    // Input Handling
    window.addEventListener('keydown', (e) => {
        switch(e.key) {
            case 'ArrowUp': case 'w': player.move(0, 1); break;
            case 'ArrowDown': case 's': player.move(0, -1); break;
            case 'ArrowLeft': case 'a': player.move(-1, 0); break;
            case 'ArrowRight': case 'd': player.move(1, 0); break;
        }
    });

    // Touch handling
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        // Simple tap logic: hop forward
        player.move(0, 1);
    }, {passive: false});
    
    canvas.addEventListener('mousedown', (e) => {
        player.move(0, 1);
    });

    loop();
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    state.width = canvas.width;
    state.height = canvas.height;
    state.centerX = state.width / 2;
    // CRITICAL FIX: Center vertical vanishing point
    state.centerY = state.height / 2; 
}

// --- GAME LOOP ---

function loop() {
    // Clear with Sky Color
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(0, 0, state.width, state.height);

    // Update Player
    player.update();

    // Update Lanes
    state.lanes.forEach(lane => lane.update());

    // Infinite Scroll Logic
    const playerLaneIndex = Math.floor(player.z / CONFIG.laneHeight);
    
    if (state.lanes[0].zIndex < playerLaneIndex - 5) {
        state.lanes.shift();
        const lastZ = state.lanes[state.lanes.length-1].zIndex;
        state.lanes.push(new Lane(lastZ + 1));
    }

    // Draw Lanes (Back to Front)
    // We sort by Z descending so far lanes draw first
    const sortedLanes = [...state.lanes].sort((a, b) => b.z - a.z);
    
    sortedLanes.forEach(lane => {
        if (lane.z < state.playerZ - CONFIG.cameraDist) return;
        lane.draw();
    });

    // Draw Player
    player.draw();

    requestAnimationFrame(loop);
}

// Start
init();

</script>
