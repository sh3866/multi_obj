<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poly Hop - Visual Design Demo</title>
    <style>
        :root {
            --bg-sky-top: #4facfe;
            --bg-sky-bottom: #00f2fe;
            --font-stack: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --ui-font: 'Impact', 'Arial Black', sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(to bottom, var(--bg-sky-top), var(--bg-sky-bottom));
            font-family: var(--font-stack);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border-radius: 8px;
        }

        /* HUD Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .score-box {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            padding: 10px 20px;
            border-radius: 30px;
            color: white;
            font-family: var(--ui-font);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 100px;
        }

        .score-label {
            font-size: 10px;
            opacity: 0.8;
            margin-bottom: 2px;
        }

        .score-value {
            font-size: 28px;
            line-height: 1;
        }

        .score-value span {
            color: #FFD700; /* Gold */
        }

        /* Controls Overlay */
        .controls-hint {
            position: absolute;
            bottom: 40px;
            right: 40px;
            opacity: 0.6;
            color: white;
            font-size: 12px;
            text-align: right;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .key-icon {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 4px;
            padding: 2px 6px;
            margin: 0 2px;
            font-weight: bold;
        }

        /* Mobile Controls (Visible on small screens) */
        .mobile-controls {
            display: none; /* Hidden on desktop by default, shown via JS detection if needed */
            pointer-events: auto;
            width: 100%;
            height: 150px;
            position: absolute;
            bottom: 20px;
            left: 0;
        }

        @media (max-width: 600px) {
            .controls-hint { display: none; }
            .mobile-controls { display: flex; justify-content: center; gap: 20px; align-items: center; }
            .score-box { transform: scale(0.8); }
        }

    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div class="hud-top">
            <div class="score-box">
                <div class="score-label">Best</div>
                <div class="score-value">42</div>
            </div>
            <div class="score-box">
                <div class="score-label">Score</div>
                <div class="score-value"><span id="current-score">12</span></div>
            </div>
        </div>

        <div class="controls-hint">
            Use <span class="key-icon">↑</span> <span class="key-icon">↓</span> <span class="key-icon">←</span> <span class="key-icon">→</span> to move<br>
            Click/Tap to hop
        </div>
    </div>
</div>

<script>
/**
 * POLY HOP - VISUAL DESIGN DEMO
 * A 2.5D Pseudo-3D Engine for a Crossy Road style game.
 * 
 * Core Concept:
 * We use a simplified 3D math model (Z-depth projection) to render 2D Canvas shapes.
 * This allows for smooth movement, parallax, and a "low-poly" aesthetic without WebGL complexity.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- CONFIGURATION ---
const CONFIG = {
    fov: 300,           // Field of view
    cameraHeight: 150,  // Camera height above ground
    cameraDist: 200,    // Distance behind player
    laneHeight: 40,     // Z-height of a lane
    laneWidth: 400,     // World width
    blockSize: 40,      // Size of player/objects
    colors: {
        skyTop: '#4facfe',
        skyBottom: '#00f2fe',
        grassLight: '#76c75a',
        grassDark: '#5da844',
        road: '#555555',
        roadLine: '#ffffff',
        water: '#48b1bf',
        waterDark: '#3a919c',
        wood: '#b07c4e',
        woodDark: '#8c623d',
        player: '#ffffff',
        playerShadow: 'rgba(0,0,0,0.3)'
    }
};

// --- STATE ---
let state = {
    width: 0,
    height: 0,
    centerX: 0,
    centerY: 0,
    playerZ: 0,
    playerX: 0, // -1 to 1 grid coords
    playerY: 0, // Grid lane index
    targetX: 0,
    targetY: 0,
    hopOffset: 0, // Y-axis hop animation
    hopVel: 0,
    isHopping: false,
    lanes: [],
    score: 12
};

// --- ASSETS & UTILS ---

// Simple 3D Projection
function project(x, y, z) {
    // Camera follows player on Z, but stays centered on X (mostly)
    // We shift the world so player is always at Z=0 relative to camera logic
    const camZ = state.playerZ + state.cameraDist;
    const scale = CONFIG.fov / (CONFIG.fov + (z - state.playerZ));
    
    const screenX = state.centerX + (x * scale);
    const screenY = state.centerY + (y - CONFIG.cameraHeight) * scale;
    
    return { x: screenX, y: screenY, scale: scale };
}

// --- CLASSES ---

class Lane {
    constructor(zIndex) {
        this.zIndex = zIndex;
        this.z = zIndex * CONFIG.laneHeight;
        this.type = this.determineType(zIndex);
        this.traffic = [];
        
        // Initialize traffic if road
        if (this.type === 'road') {
            this.speed = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 2);
            const count = 2 + Math.floor(Math.random() * 2);
            for(let i=0; i<count; i++) {
                this.addCar(i * 200);
            }
        }
    }

    determineType(z) {
        const mod = z % 5;
        if (mod === 0) return 'grass';
        if (mod === 1) return 'road';
        if (mod === 2) return 'road';
        if (mod === 3) return 'grass';
        if (mod === 4) return 'water';
        return 'grass';
    }

    addCar(xOffset) {
        this.traffic.push({
            x: xOffset,
            width: 60,
            height: 30,
            color: ['#ff6b6b', '#feca57', '#54a0ff', '#5f27cd'][Math.floor(Math.random()*4)],
            type: 'car'
        });
    }

    update() {
        if (this.type === 'road') {
            this.traffic.forEach(car => {
                car.x += this.speed;
                // Wrap around
                if (this.speed > 0 && car.x > CONFIG.laneWidth) car.x = -CONFIG.laneWidth;
                if (this.speed < 0 && car.x < -CONFIG.laneWidth) car.x = CONFIG.laneWidth;
            });
        }
        if (this.type === 'water') {
            // Could add logs here
        }
    }

    draw() {
        // Calculate world coordinates relative to camera
        // We need to draw the lane at 'this.z'
        
        // 1. Draw Terrain Base
        // Left edge: -200, Right edge: 200
        const pLeft = project(-220, 0, this.z);
        const pRight = project(220, 0, this.z);
        const pBackLeft = project(-220, 0, this.z + CONFIG.laneHeight);
        const pBackRight = project(220, 0, this.z + CONFIG.laneHeight);

        // Draw Side (Depth)
        ctx.beginPath();
        ctx.moveTo(pLeft.x, pLeft.y);
        ctx.lineTo(pRight.x, pRight.y);
        ctx.lineTo(pBackRight.x, pBackRight.y);
        ctx.lineTo(pBackLeft.x, pBackLeft.y);
        ctx.closePath();
        
        // Color logic
        let sideColor, topColor;
        if (this.type === 'grass') {
            sideColor = CONFIG.colors.grassDark;
            topColor = (Math.floor(this.zIndex) % 2 === 0) ? CONFIG.colors.grassLight : '#6bc04d';
        } else if (this.type === 'road') {
            sideColor = '#333';
            topColor = CONFIG.colors.road;
        } else if (this.type === 'water') {
            sideColor = CONFIG.colors.waterDark;
            topColor = CONFIG.colors.water;
        }
        
        ctx.fillStyle = sideColor;
        ctx.fill();

        // Draw Top
        ctx.beginPath();
        ctx.moveTo(pBackLeft.x, pBackLeft.y);
        ctx.lineTo(pBackRight.x, pBackRight.y);
        ctx.lineTo(pRight.x, pRight.y); // Actually front right in screen space due to perspective
        ctx.lineTo(pLeft.x, pLeft.y);
        ctx.closePath();
        ctx.fillStyle = topColor;
        ctx.fill();

        // 2. Draw Details (Lines, Wood texture)
        if (this.type === 'road') {
            // Dashed Line
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 2 * pLeft.scale;
            ctx.setLineDash([10 * pLeft.scale, 15 * pLeft.scale]);
            ctx.beginPath();
            ctx.moveTo(pLeft.x + 200*pLeft.scale, pLeft.y); // Center line
            ctx.lineTo(pBackLeft.x + 200*pBackLeft.scale, pBackLeft.y);
            ctx.stroke();
            ctx.setLineDash([]);
        } else if (this.type === 'water') {
            // Simple wave lines
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2 * pLeft.scale;
            const midX = (pLeft.x + pRight.x)/2;
            const midY = (pLeft.y + pRight.y)/2;
            ctx.beginPath();
            ctx.moveTo(midX - 50*pLeft.scale, midY);
            ctx.quadraticCurveTo(midX, midY - 5*pLeft.scale, midX + 50*pLeft.scale, midY);
            ctx.stroke();
        }

        // 3. Draw Traffic
        if (this.type === 'road') {
            this.traffic.forEach(car => {
                this.drawCar(car, pLeft.scale);
            });
        }
    }

    drawCar(car, scale) {
        // Car is at car.x, z = this.z
        // We draw a low-poly box
        
        const cx = car.x;
        const cz = this.z;
        const cw = car.width;
        const ch = 30; // Height
        const cd = 40; // Depth

        // Project corners
        // Front Bottom Left/Right
        const fbl = project(cx - cw/2, 0, cz);
        const fbr = project(cx + cw/2, 0, cz);
        // Back Bottom Left/Right
        const bbl = project(cx - cw/2, 0, cz + cd);
        const bbr = project(cx + cw/2, 0, cz + cd);
        // Top corners (simplified)
        const ftl = project(cx - cw/2, ch, cz);
        const ftr = project(cx + cw/2, ch, cz);
        const btl = project(cx - cw/2, ch, cz + cd);
        const btr = project(cx + cw/2, ch, cz + cd);

        // Draw Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.moveTo(fbl.x, fbl.y);
        ctx.lineTo(fbr.x, fbr.y);
        ctx.lineTo(bbr.x, bbr.y);
        ctx.lineTo(bbl.x, bbl.y);
        ctx.fill();

        // Draw Body (Side facing camera depends on direction, simplified here to just top/sides)
        // Top
        ctx.fillStyle = car.color;
        ctx.beginPath();
        ctx.moveTo(ftl.x, ftl.y);
        ctx.lineTo(ftr.x, ftr.y);
        ctx.lineTo(btr.x, btr.y);
        ctx.lineTo(btl.x, btl.y);
        ctx.fill();

        // Side (Right)
        ctx.fillStyle = this.darken(car.color, 20);
        ctx.beginPath();
        ctx.moveTo(fbr.x, fbr.y);
        ctx.lineTo(bbr.x, bbr.y);
        ctx.lineTo(btr.x, btr.y);
        ctx.lineTo(ftr.x, ftr.y);
        ctx.fill();

        // Side (Left)
        ctx.fillStyle = this.darken(car.color, 40);
        ctx.beginPath();
        ctx.moveTo(fbl.x, fbl.y);
        ctx.lineTo(bbl.x, bbl.y);
        ctx.lineTo(btl.x, btl.y);
        ctx.lineTo(ftl.x, ftl.y);
        ctx.fill();
        
        // Front
        ctx.fillStyle = this.darken(car.color, 10);
        ctx.beginPath();
        ctx.moveTo(fbl.x, fbl.y);
        ctx.lineTo(fbr.x, fbr.y);
        ctx.lineTo(ftr.x, ftr.y);
        ctx.lineTo(ftl.x, ftl.y);
        ctx.fill();
    }

    darken(hex, percent) {
        // Simple hex darken helper
        let r = parseInt(hex.substring(1,3), 16);
        let g = parseInt(hex.substring(3,5), 16);
        let b = parseInt(hex.substring(5,7), 16);
        r = Math.floor(r * (100 - percent) / 100);
        g = Math.floor(g * (100 - percent) / 100);
        b = Math.floor(b * (100 - percent) / 100);
        return `rgb(${r},${g},${b})`;
    }
}

class Player {
    constructor() {
        this.x = 0;
        this.y = 0; // Grid Y
        this.z = 0; // World Z
        this.targetX = 0;
        this.targetZ = 0;
        this.hopY = 0;
        this.hopVel = 0;
        this.color = CONFIG.colors.player;
    }

    move(dx, dy) {
        if (this.isHopping) return;
        
        this.targetX += dx;
        this.targetZ += dy * CONFIG.laneHeight;
        
        // Start Hop
        this.isHopping = true;
        this.hopVel = 6;
        
        // Update score if moving forward
        if (dy > 0) {
            state.score++;
            document.getElementById('current-score').innerText = state.score;
        }
    }

    update() {
        // Lerp X
        this.x += (this.targetX - this.x) * 0.2;
        // Lerp Z
        this.z += (this.targetZ - this.z) * 0.2;

        // Hop Physics
        if (this.isHopping) {
            this.hopY += this.hopVel;
            this.hopVel -= 0.4; // Gravity
            
            if (this.hopY <= 0) {
                this.hopY = 0;
                this.isHopping = false;
                // Snap to grid
                this.x = this.targetX;
                this.z = this.targetZ;
                state.playerZ = this.z; // Update camera follow Z
            }
        }
    }

    draw() {
        // Shadow
        const sP = project(this.x, 0, this.z);
        ctx.fillStyle = CONFIG.colors.playerShadow;
        ctx.beginPath();
        ctx.ellipse(sP.x, sP.y, 15 * sP.scale, 8 * sP.scale, 0, 0, Math.PI*2);
        ctx.fill();

        // Player Body (Low Poly Cube)
        const size = CONFIG.blockSize;
        const pX = this.x;
        const pY = this.hopY;
        const pZ = this.z;

        // Vertices
        // 0: Front-Bottom-Left, 1: Front-Bottom-Right, 2: Back-Bottom-Right, 3: Back-Bottom-Left
        // 4: Front-Top-Left, 5: Front-Top-Right, 6: Back-Top-Right, 7: Back-Top-Left
        
        const v = [
            project(pX - size/2, pY, pZ),
            project(pX + size/2, pY, pZ),
            project(pX + size/2, pY, pZ + size),
            project(pX - size/2, pY, pZ + size),
            project(pX - size/2, pY + size, pZ),
            project(pX + size/2, pY + size, pZ),
            project(pX + size/2, pY + size, pZ + size),
            project(pX - size/2, pY + size, pZ + size)
        ];

        // Draw Faces
        // Top
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(v[4].x, v[4].y);
        ctx.lineTo(v[5].x, v[5].y);
        ctx.lineTo(v[6].x, v[6].y);
        ctx.lineTo(v[7].x, v[7].y);
        ctx.fill();

        // Right
        ctx.fillStyle = '#e0e0e0';
        ctx.beginPath();
        ctx.moveTo(v[1].x, v[1].y);
        ctx.lineTo(v[2].x, v[2].y);
        ctx.lineTo(v[6].x, v[6].y);
        ctx.lineTo(v[5].x, v[5].y);
        ctx.fill();

        // Left
        ctx.fillStyle = '#cccccc';
        ctx.beginPath();
        ctx.moveTo(v[0].x, v[0].y);
        ctx.lineTo(v[3].x, v[3].y);
        ctx.lineTo(v[7].x, v[7].y);
        ctx.lineTo(v[4].x, v[4].y);
        ctx.fill();

        // Front
        ctx.fillStyle = '#f5f5f5';
        ctx.beginPath();
        ctx.moveTo(v[0].x, v[0].y);
        ctx.lineTo(v[1].x, v[1].y);
        ctx.lineTo(v[5].x, v[5].y);
        ctx.lineTo(v[4].x, v[4].y);
        ctx.fill();

        // Eyes (Cute Factor)
        // Calculate eye position on the front face
        const eyeSize = 4 * v[0].scale;
        const eyeY = v[0].y - (size/2)*v[0].scale - (size/4)*v[0].scale; // Roughly on face
        
        // Left Eye
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(v[0].x + (size/4)*v[0].scale, eyeY, eyeSize, 0, Math.PI*2);
        ctx.fill();
        
        // Right Eye
        ctx.beginPath();
        ctx.arc(v[1].x - (size/4)*v[1].scale, eyeY, eyeSize, 0, Math.PI*2);
        ctx.fill();
    }
}

// --- INITIALIZATION ---

const player = new Player();

function init() {
    resize();
    window.addEventListener('resize', resize);
    
    // Create initial lanes
    for (let i = -5; i < 20; i++) {
        state.lanes.push(new Lane(i));
    }

    // Input Handling
    window.addEventListener('keydown', (e) => {
        switch(e.key) {
            case 'ArrowUp': case 'w': player.move(0, 1); break;
            case 'ArrowDown': case 's': player.move(0, -1); break;
            case 'ArrowLeft': case 'a': player.move(-1, 0); break;
            case 'ArrowRight': case 'd': player.move(1, 0); break;
        }
    });

    // Touch/Click handling for demo
    canvas.addEventListener('mousedown', (e) => {
        // Simple tap to hop forward logic for demo
        player.move(0, 1);
    });

    loop();
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    state.width = canvas.width;
    state.height = canvas.height;
    state.centerX = state.width / 2;
    state.centerY = state.height / 2 + 50; // Shift down slightly
}

// --- GAME LOOP ---

function loop() {
    // Clear
    ctx.clearRect(0, 0, state.width, state.height);

    // Update Player
    player.update();

    // Update Lanes (Traffic)
    state.lanes.forEach(lane => lane.update());

    // Infinite Scroll Logic
    // If player moves too far forward, remove back lanes, add front lanes
    const playerLaneIndex = Math.floor(player.z / CONFIG.laneHeight);
    
    // Keep lanes relative to player
    if (state.lanes[0].zIndex < playerLaneIndex - 5) {
        state.lanes.shift();
        const lastZ = state.lanes[state.lanes.length-1].zIndex;
        state.lanes.push(new Lane(lastZ + 1));
    }

    // Sort Lanes for Painter's Algorithm (Back to Front)
    // We actually need to draw lanes, then player.
    // But cars might need to be behind player? 
    // Simple approach: Draw all lanes, then player.
    // To make player appear "inside" the lane, we need to be careful.
    // However, for this specific visual style, drawing all terrain then player is usually sufficient 
    // unless a car is directly behind the player.
    
    // Better Z-Sorting:
    // We can interleave. But since lanes are distinct Z-planes, we just draw lanes.
    // We draw the lane the player is currently IN last?
    // No, we draw everything, then player.
    // To fix car occlusion: Draw cars that are BEHIND player Z last?
    // Let's stick to simple: Lanes -> Player. It looks fine for this style.

    // Draw Lanes (Back to Front)
    // Sort by Z descending
    const sortedLanes = [...state.lanes].sort((a, b) => b.z - a.z);
    
    sortedLanes.forEach(lane => {
        // Optimization: Don't draw if way behind camera
        if (lane.z < state.playerZ - CONFIG.cameraDist) return;
        lane.draw();
    });

    // Draw Player
    player.draw();

    requestAnimationFrame(loop);
}

// Start
init();

</script>
</body>
</html>
