<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Rickshaw: Vector Study</title>
<style>
  :root {
    --bg: #f2f0e9;
    --grid: #dcd9d0;
    --text-main: #1a1a1a;
    --text-muted: #666;
    --accent: #ff6b00;
    --accent-glow: rgba(255, 107, 0, 0.4);
    
    /* Vehicle Palette */
    --paint-yellow: #fecb00;
    --paint-shadow: #dca300;
    --paint-highlight: #ffe066;
    --chrome: #e0e0e0;
    --chrome-dark: #888;
    --tire: #1a1a1a;
    --tire-shine: #333;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--bg);
    color: var(--text-main);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Background Grid & Noise */
  .bg-layer {
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image: 
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: center;
    opacity: 0.4;
  }
  
  .noise {
    position: absolute;
    inset: 0;
    z-index: 1;
    opacity: 0.15;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
  }

  /* Layout */
  main {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 1.5fr 1fr;
    grid-template-rows: auto 1fr auto;
    padding: 3rem;
    max-width: 1800px;
    margin: 0 auto;
  }

  /* Header */
  header {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 2px solid var(--text-main);
    padding-bottom: 1.5rem;
    margin-bottom: 2rem;
  }

  .brand {
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
    display: block;
  }

  h1 {
    font-size: clamp(2.5rem, 5vw, 4.5rem);
    line-height: 0.9;
    text-transform: uppercase;
    letter-spacing: -0.03em;
    font-weight: 900;
    font-style: italic;
  }

  .meta {
    text-align: right;
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.9rem;
    line-height: 1.4;
    font-weight: 600;
  }

  /* Stage */
  .stage {
    grid-column: 1 / -1;
    grid-row: 2 / 3;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    perspective: 1000px;
  }

  /* SVG Container */
  #vehicle-stage {
    width: 100%;
    max-width: 900px;
    height: auto;
    /* No drop-shadow here, we draw shadows inside SVG for precision */
    transition: transform 0.1s linear;
    will-change: transform;
  }

  /* Sidebar Info */
  .info-panel {
    position: absolute;
    right: 0;
    top: 30%;
    text-align: right;
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    line-height: 1.8;
    color: var(--text-main);
    width: 220px;
  }

  .info-panel dt {
    color: var(--text-muted);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  
  .info-panel dd {
    font-weight: 700;
    margin-bottom: 0.5rem;
  }

  .marker {
    position: absolute;
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 0 4px rgba(255, 107, 0, 0.2);
    top: 0; left: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }

  /* Footer */
  footer {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: auto;
    padding-top: 1rem;
    border-top: 1px solid rgba(0,0,0,0.1);
  }

  /* Hotspot Styles */
  .hotspot {
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .hotspot circle {
    fill: var(--accent);
    stroke: #fff;
    stroke-width: 2px;
  }
  .hotspot:hover circle {
    r: 8;
    fill: #fff;
    stroke: var(--accent);
  }
  .hotspot-label {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: bold;
    fill: var(--text-main);
    background: var(--bg);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .hotspot:hover .hotspot-label {
    opacity: 1;
  }

  /* Animations */
  @keyframes pulse {
    0% { opacity: 0.6; }
    50% { opacity: 1; }
    100% { opacity: 0.6; }
  }
  
  .indicator-light {
    animation: pulse 1s infinite;
  }

</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="noise"></div>

<main>
  <header>
    <div>
      <span class="brand">Vector Study 01</span>
      <h1>The Auto<br>Rickshaw</h1>
    </div>
    <div class="meta">
      ORIGIN: INDIA<br>
      CLASS: 3-WHEELER<br>
      STATUS: ACTIVE
    </div>
  </header>

  <div class="stage">
    
    <dl class="info-panel">
      <dt>Chassis</dt><dd>Steel Tubular</dd>
      <dt>Engine</dt><dd>125cc 4-Stroke</dd>
      <dt>Capacity</dt><dd>3 Persons</dd>
      <dt>Speed</dt><dd>60 km/h</dd>
    </dl>

    <!-- SVG DRAWING START -->
    <svg id="vehicle-stage" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gradients -->
        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:var(--paint-highlight);stop-opacity:1" />
          <stop offset="40%" style="stop-color:var(--paint-yellow);stop-opacity:1" />
          <stop offset="100%" style="stop-color:var(--paint-shadow);stop-opacity:1" />
        </linearGradient>

        <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
          <stop offset="30%" style="stop-color:#ccc;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#666;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#8ecae6;stop-opacity:0.6" />
          <stop offset="100%" style="stop-color:#219ebc;stop-opacity:0.9" />
        </linearGradient>

        <linearGradient id="tireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#111;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#000;stop-opacity:1" />
        </linearGradient>
        
        <!-- Patterns -->
        <pattern id="seatStripe" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
          <rect width="8" height="8" fill="#1a1a1a"/>
          <rect width="4" height="8" fill="#333"/>
        </pattern>

        <!-- Filters -->
        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="15" stdDeviation="10" flood-color="#000" flood-opacity="0.15"/>
        </filter>
      </defs>

      <!-- GROUND SHADOW -->
      <ellipse cx="450" cy="520" rx="340" ry="25" fill="rgba(0,0,0,0.1)" />
      <ellipse cx="450" cy="520" rx="200" ry="10" fill="rgba(0,0,0,0.2)" />

      <!-- ================= REAR ASSEMBLY ================= -->
      <g id="rear-assembly">
        <!-- Rear Axle Beam -->
        <rect x="260" y="450" width="380" height="20" fill="#222" rx="5" />
        
        <!-- Left Rear Wheel -->
        <g transform="translate(280, 480)">
          <!-- Tire -->
          <circle cx="0" cy="0" r="55" fill="url(#tireGrad)" />
          <circle cx="0" cy="0" r="50" fill="none" stroke="#222" stroke-width="2" />
          <!-- Rim -->
          <circle cx="0" cy="0" r="40" fill="url(#chromeGrad)" />
          <circle cx="0" cy="0" r="35" fill="none" stroke="#555" stroke-width="1" />
          <!-- Hub -->
          <circle cx="0" cy="0" r="12" fill="#111" />
          <!-- Spokes -->
          <path d="M0,-40 L0,40 M-40,0 L40,0 M-28,-28 L28,28 M-28,28 L28,-28" stroke="#777" stroke-width="6" />
          <!-- Mudguard -->
          <path d="M-55,20 A 60 60 0 0 1 55,20" fill="none" stroke="var(--paint-yellow)" stroke-width="10" stroke-linecap="round"/>
        </g>

        <!-- Right Rear Wheel -->
        <g transform="translate(620, 480)">
          <circle cx="0" cy="0" r="55" fill="url(#tireGrad)" />
          <circle cx="0" cy="0" r="50" fill="none" stroke="#222" stroke-width="2" />
          <circle cx="0" cy="0" r="40" fill="url(#chromeGrad)" />
          <circle cx="0" cy="0" r="35" fill="none" stroke="#555" stroke-width="1" />
          <circle cx="0" cy="0" r="12" fill="#111" />
          <path d="M0,-40 L0,40 M-40,0 L40,0 M-28,-28 L28,28 M-28,28 L28,-28" stroke="#777" stroke-width="6" />
          <!-- Mudguard -->
          <path d="M-55,20 A 60 60 0 0 1 55,20" fill="none" stroke="var(--paint-yellow)" stroke-width="10" stroke-linecap="round"/>
        </g>
      </g>

      <!-- ================= CHASSIS & ENGINE ================= -->
      <g id="chassis">
        <!-- Side Rails -->
        <path d="M 280 480 L 360 350" stroke="#222" stroke-width="16" stroke-linecap="round" />
        <path d="M 620 480 L 540 350" stroke="#222" stroke-width="16" stroke-linecap="round" />
        
        <!-- Engine Block -->
        <g transform="translate(450, 380)">
          <rect x="-30" y="0" width="60" height="80" rx="4" fill="#333" />
          <rect x="-35" y="10" width="70" height="60" rx="4" fill="#222" /> <!-- Heat shield -->
          <path d="M -20 20 L 20 20 L 20 60 L -20 60 Z" fill="#111" /> <!-- Cylinder -->
          <!-- Exhaust Pipe -->
          <path d="M 20 40 L 40 40 L 40 70" fill="none" stroke="url(#chromeGrad)" stroke-width="8" />
        </g>
      </g>

      <!-- ================= FRONT ASSEMBLY ================= -->
      <g id="front-assembly">
        <!-- Steering Column -->
        <line x1="450" y1="350" x2="450" y2="480" stroke="#222" stroke-width="14" />
        
        <!-- Front Wheel -->
        <g transform="translate(450, 490)">
          <circle cx="0" cy="0" r="55" fill="url(#tireGrad)" />
          <circle cx="0" cy="0" r="40" fill="url(#chromeGrad)" />
          <circle cx="0" cy="0" r="12" fill="#111" />
          <path d="M0,-40 L0,40 M-40,0 L40,0 M-28,-28 L28,28 M-28,28 L28,-28" stroke="#777" stroke-width="6" />
          <!-- Front Mudguard -->
          <path d="M-55,20 A 60 60 0 0 1 55,20" fill="none" stroke="var(--paint-yellow)" stroke-width="10" stroke-linecap="round"/>
        </g>

        <!-- Handlebars -->
        <g transform="translate(450, 360)">
          <path d="M -60 0 Q 0 -20 60 0" fill="none" stroke="#222" stroke-width="8" stroke-linecap="round" />
          <circle cx="-60" cy="0" r="6" fill="#111" /> <!-- Grip L -->
          <circle cx="60" cy="0" r="6" fill="#111" /> <!-- Grip R -->
          
          <!-- Mirrors -->
          <path d="M -60 0 L -70 -30" stroke="#555" stroke-width="2" />
          <ellipse cx="-70" cy="-30" rx="6" ry="10" fill="#111" />
          <path d="M 60 0 L 70 -30" stroke="#555" stroke-width="2" />
          <ellipse cx="70" cy="-30" rx="6" ry="10" fill="#111" />
        </g>

        <!-- Headlamp -->
        <g transform="translate(450, 420)">
          <circle cx="0" cy="0" r="12" fill="#fff" />
          <circle cx="0" cy="0" r="16" fill="none" stroke="url(#chromeGrad)" stroke-width="4" />
          <circle cx="0" cy="0" r="25" fill="rgba(255,255,200,0.3)" class="indicator-light" />
        </g>
      </g>

      <!-- ================= CABIN ================= -->
      <g id="cabin" filter="url(#dropShadow)">
        <!-- Cabin Back Wall -->
        <path d="M 280 340 L 620 340 L 620 180 L 280 180 Z" fill="var(--paint-shadow)" />
        
        <!-- Cabin Side Wall (Right/Foreground) -->
        <!-- Tapered perspective -->
        <path d="M 620 180 L 620 340 L 680 360 L 680 200 Z" fill="url(#bodyGrad)" />
        
        <!-- Cabin Front Wall (Driver Side) -->
        <path d="M 540 180 L 540 340 L 620 340 L 620 180 Z" fill="var(--paint-yellow)" />

        <!-- Door Frame -->
        <path d="M 620 180 L 620 340" stroke="#111" stroke-width="4" />
        <path d="M 620 200 L 675 215" stroke="#111" stroke-width="4" /> <!-- Top trim -->
        
        <!-- Door Handle -->
        <rect x="635" y="260" width="15" height="4" fill="#111" />

        <!-- Window -->
        <path d="M 625 190 L 670 205 L 670 260 L 625 260 Z" fill="url(#glassGrad)" stroke="#111" stroke-width="3" />
        <!-- Window Reflection -->
        <path d="M 630 195 L 640 198 L 640 255 L 630 255 Z" fill="rgba(255,255,255,0.2)" />

        <!-- Seat (Inside) -->
        <path d="M 300 340 L 600 340 L 600 300 L 300 300 Z" fill="url(#seatStripe)" />
        
        <!-- Roof Canopy -->
        <!-- Top surface -->
        <path d="M 270 180 L 630 180 L 690 200 L 330 200 Z" fill="url(#chromeGrad)" />
        <!-- Roof Edge -->
        <path d="M 270 180 L 630 180 L 630 185 L 270 185 Z" fill="#555" />
        
        <!-- Roof Rack -->
        <path d="M 330 180 L 330 170 L 620 170 L 620 180" fill="none" stroke="#111" stroke-width="4" />
        <line x1="360" y1="170" x2="360" y2="180" stroke="#111" stroke-width="2" />
        <line x1="450" y1="170" x2="450" y2="180" stroke="#111" stroke-width="2" />
        <line x1="550" y1="170" x2="550" y2="180" stroke="#111" stroke-width="2" />

        <!-- Windshield (Front) -->
        <path d="M 540 340 L 620 340 L 600 180 L 520 180 Z" fill="url(#glassGrad)" stroke="#111" stroke-width="4" />
        <!-- Windshield Pillar -->
        <line x1="580" y1="340" x2="560" y2="180" stroke="#111" stroke-width="4" />
        
        <!-- Windshield Reflection -->
        <path d="M 545 330 L 560 330 L 540 190 L 525 190 Z" fill="rgba(255,255,255,0.15)" />

        <!-- Side Panel Decorative Stripe -->
        <path d="M 620 300 L 675 320 L 675 325 L 620 305 Z" fill="var(--accent)" />
      </g>

      <!-- ================= DRIVER (Simplified) ================= -->
      <g id="driver">
        <!-- Head -->
        <circle cx="580" cy="250" r="14" fill="#333" />
        <!-- Torso -->
        <path d="M 570 265 L 590 265 L 590 340 L 570 340 Z" fill="#444" />
        <!-- Arms -->
        <path d="M 575 270 L 545 300 L 540 280" fill="none" stroke="#444" stroke-width="8" stroke-linecap="round" />
      </g>

      <!-- ================= INTERACTIVE HOTSPOTS ================= -->
      <g class="hotspot-group">
        <g class="hotspot" transform="translate(450, 420)">
          <circle cx="0" cy="0" r="5" />
          <text x="20" y="5" class="hotspot-label">Xenon Headlamp</text>
        </g>
      </g>
      <g class="hotspot-group">
        <g class="hotspot" transform="translate(650, 250)">
          <circle cx="0" cy="0" r="5" />
          <text x="20" y="5" class="hotspot-label">Polycarbonate Window</text>
        </g>
      </g>
      <g class="hotspot-group">
        <g class="hotspot" transform="translate(450, 400)">
          <circle cx="0" cy="0" r="5" />
          <text x="20" y="5" class="hotspot-label">Liquid Cooled Engine</text>
        </g>
      </g>

    </svg>
    <!-- SVG DRAWING END -->

  </div>

  <footer>
    <div>
      Designed for Urban Mobility<br>
      Vector Craft v2.0
    </div>
    <div>
      [ HOVER FOR DETAILS ]
    </div>
  </footer>
</main>

<script>
  // Refined Parallax Interaction
  const stage = document.querySelector('.stage');
  const svg = document.getElementById('vehicle-stage');

  stage.addEventListener('mousemove', (e) => {
    const rect = stage.getBoundingClientRect();
    // Calculate mouse position relative to center of stage (-1 to 1)
    const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    const y = ((e.clientY - rect.top) / rect.height) * 2 - 1;

    // Apply subtle rotation and translation
    // RotateY creates the 3D turn effect
    // RotateX creates the tilt effect
    // TranslateY lifts it slightly
    const rotateY = x * 5; // Max 5 degrees
    const rotateX = -y * 3; // Max 3 degrees
    const translateX = x * -10;
    const translateY = y * -10;

    svg.style.transform = `perspective(1000px) rotateY(${rotateY}deg) rotateX(${rotateX}deg) translate3d(${translateX}px, ${translateY}px, 0)`;
  });

  stage.addEventListener('mouseleave', () => {
    // Reset smoothly
    svg.style.transition = 'transform 0.5s ease-out';
    svg.style.transform = `perspective(1000px) rotateY(0deg) rotateX(0deg) translate3d(0,0,0)`;
    
    // Remove transition after reset so mousemove is snappy again
    setTimeout(() => {
      svg.style.transition = 'transform 0.1s linear';
    }, 500);
  });
</script>

</body>
</html>
