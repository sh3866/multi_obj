<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Auto Rickshaw: Vector Study</title>
<style>
  :root {
    --bg: #f4f4f0;
    --grid-line: #e5e5df;
    --text-main: #181818;
    --text-muted: #666666;
    --accent: #ff3300;
    
    /* Palette - Enhanced */
    --rick-yellow: #eebb00;
    --rick-yellow-light: #ffdd44;
    --rick-yellow-dark: #b89000;
    --chrome-light: #ffffff;
    --chrome-mid: #d8d8d8;
    --chrome-dark: #888888;
    --glass: #88ccdd;
    --glass-dark: #4499aa;
    --tire: #111111;
    --seat: #222;
    --seat-stripe: #444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--bg);
    color: var(--text-main);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Background Grid System */
  .bg-grid {
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image: 
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 40px 40px, 40px 40px, 200px 200px, 200px 200px;
    opacity: 0.5;
  }

  /* Noise Texture */
  .noise {
    position: absolute;
    inset: 0;
    z-index: 1;
    opacity: 0.06;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
  }

  /* Layout Container */
  main {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 1.2fr 1fr;
    grid-template-rows: auto 1fr auto;
    padding: 3rem;
    max-width: 1920px;
    margin: 0 auto;
  }

  /* Header Typography */
  header {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 2px solid var(--text-main);
    padding-bottom: 1.5rem;
    margin-bottom: 1rem;
  }

  .brand {
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
    display: block;
  }

  h1 {
    font-size: clamp(3rem, 6vw, 5rem);
    line-height: 0.85;
    text-transform: uppercase;
    letter-spacing: -0.04em;
    font-weight: 900;
    font-style: italic;
  }

  .meta {
    text-align: right;
    font-family: 'Courier New', Courier, monospace;
    font-size: 1rem;
    line-height: 1.4;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  /* Stage Area */
  .stage {
    grid-column: 1 / -1;
    grid-row: 2 / 3;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    perspective: 1200px;
  }

  /* SVG Container */
  #vehicle-stage {
    width: 100%;
    max-width: 1000px;
    height: auto;
    transition: transform 0.1s linear;
    will-change: transform;
  }

  /* Info Panel (Floating) */
  .info-panel {
    position: absolute;
    right: 5%;
    top: 50%;
    transform: translateY(-50%);
    text-align: right;
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
    line-height: 2;
    color: var(--text-main);
    width: 240px;
    pointer-events: none;
  }

  .info-panel dt {
    color: var(--text-muted);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: block;
    margin-bottom: -0.4rem;
  }
  
  .info-panel dd {
    font-weight: 800;
    margin-bottom: 0;
  }

  /* Footer */
  footer {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: auto;
    padding-top: 1.5rem;
    border-top: 1px solid rgba(0,0,0,0.1);
  }

  /* Hotspots */
  .hotspot {
    cursor: pointer;
  }
  .hotspot-circle {
    fill: var(--accent);
    stroke: #fff;
    stroke-width: 2px;
    transition: r 0.2s;
  }
  .hotspot:hover .hotspot-circle {
    r: 8;
    fill: #fff;
    stroke: var(--accent);
  }
  .hotspot-label {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    font-weight: 700;
    fill: var(--text-main);
    background: var(--bg);
    padding: 2px 6px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  .hotspot:hover .hotspot-label {
    opacity: 1;
  }

  /* Animations */
  @keyframes blink {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  .blink { animation: blink 2s infinite; }

</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="noise"></div>

<main>
  <header>
    <div>
      <span class="brand">Vector Study 01</span>
      <h1>The Auto<br>Rickshaw</h1>
    </div>
    <div class="meta">
      ORIGIN: INDIA<br>
      CLASS: 3-WHEELER<br>
      STATUS: ACTIVE
    </div>
  </header>

  <div class="stage">
    
    <dl class="info-panel">
      <dt>Chassis</dt><dd>Steel Tubular</dd>
      <dt>Engine</dt><dd>125cc 4-Stroke</dd>
      <dt>Capacity</dt><dd>3 Persons</dd>
      <dt>Speed</dt><dd>60 km/h</dd>
    </dl>

    <!-- SVG DRAWING START -->
    <svg id="vehicle-stage" viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gradients -->
        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:var(--rick-yellow-light);stop-opacity:1" />
          <stop offset="30%" style="stop-color:var(--rick-yellow);stop-opacity:1" />
          <stop offset="100%" style="stop-color:var(--rick-yellow-dark);stop-opacity:1" />
        </linearGradient>

        <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
          <stop offset="40%" style="stop-color:#ccc;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#777;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:var(--glass);stop-opacity:0.8" />
          <stop offset="100%" style="stop-color:var(--glass-dark);stop-opacity:0.9" />
        </linearGradient>

        <linearGradient id="tireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#111;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#000;stop-opacity:1" />
        </linearGradient>

        <!-- Patterns -->
        <pattern id="seatStripe" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
          <rect width="6" height="6" fill="var(--seat)"/>
          <rect width="3" height="6" fill="var(--seat-stripe)"/>
        </pattern>

        <!-- Filters -->
        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="20" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
        </filter>
        
        <filter id="glow">
          <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- GROUND SHADOW -->
      <ellipse cx="450" cy="550" rx="350" ry="30" fill="rgba(0,0,0,0.1)" />
      <ellipse cx="450" cy="550" rx="200" ry="12" fill="rgba(0,0,0,0.2)" />

      <!-- ================= REAR ASSEMBLY ================= -->
      <g id="rear-assembly">
        <!-- Rear Axle Beam -->
        <rect x="250" y="480" width="400" height="24" fill="#222" rx="4" />
        <rect x="260" y="480" width="380" height="4" fill="#444" /> <!-- Highlight -->

        <!-- Left Rear Wheel -->
        <g transform="translate(270, 520)">
          <!-- Tire -->
          <circle cx="0" cy="0" r="58" fill="url(#tireGrad)" />
          <circle cx="0" cy="0" r="52" fill="none" stroke="#222" stroke-width="2" />
          <!-- Rim -->
          <circle cx="0" cy="0" r="42" fill="url(#chromeGrad)" />
          <circle cx="0" cy="0" r="38" fill="none" stroke="#555" stroke-width="1" />
          <!-- Hub -->
          <circle cx="0" cy="0" r="14" fill="#111" />
          <!-- Spokes -->
          <path d="M0,-42 L0,42 M-42,0 L42,0 M-30,-30 L30,30 M-30,30 L30,-30" stroke="#777" stroke-width="7" />
          <!-- Mudguard -->
          <path d="M-58,25 A 62 62 0 0 1 58,25" fill="none" stroke="var(--rick-yellow)" stroke-width="12" stroke-linecap="round"/>
        </g>

        <!-- Right Rear Wheel -->
        <g transform="translate(630, 520)">
          <circle cx="0" cy="0" r="58" fill="url(#tireGrad)" />
          <circle cx="0" cy="0" r="52" fill="none" stroke="#222" stroke-width="2" />
          <circle cx="0" cy="0" r="42" fill="url(#chromeGrad)" />
          <circle cx="0" cy="0" r="38" fill="none" stroke="#555" stroke-width="1" />
          <circle cx="0" cy="0" r="14" fill="#111" />
          <path d="M0,-42 L0,42 M-42,0 L42,0 M-30,-30 L30,30 M-30,30 L30,-30" stroke="#777" stroke-width="7" />
          <!-- Mudguard -->
          <path d="M-58,25 A 62 62 0 0 1 58,25" fill="none" stroke="var(--rick-yellow)" stroke-width="12" stroke-linecap="round"/>
        </g>
      </g>

      <!-- ================= CHASSIS & ENGINE ================= -->
      <g id="chassis">
        <!-- Side Rails -->
        <path d="M 270 520 L 350 380" stroke="#222" stroke-width="18" stroke-linecap="round" />
        <path d="M 630 520 L 550 380" stroke="#222" stroke-width="18" stroke-linecap="round" />
        <!-- Rail Highlights -->
        <path d="M 270 520 L 350 380" stroke="#444" stroke-width="2" stroke-linecap="round" transform="translate(-2, -2)" />
        <path d="M 630 520 L 550 380" stroke="#444" stroke-width="2" stroke-linecap="round" transform="translate(-2, -2)" />
        
        <!-- Engine Block -->
        <g transform="translate(450, 410)">
          <rect x="-35" y="0" width="70" height="90" rx="5" fill="#333" />
          <rect x="-40" y="15" width="80" height="60" rx="5" fill="#222" /> <!-- Heat shield -->
          <path d="M -25 25 L 25 25 L 25 65 L -25 65 Z" fill="#111" /> <!-- Cylinder -->
          <!-- Fins -->
          <path d="M -25 30 L 25 30 M -25 40 L 25 40 M -25 50 L 25 50 M -25 60 L 25 60" stroke="#222" stroke-width="2" />
          <!-- Exhaust Pipe -->
          <path d="M 25 50 L 45 50 L 45 85" fill="none" stroke="url(#chromeGrad)" stroke-width="10" stroke-linecap="round" />
        </g>
      </g>

      <!-- ================= FRONT ASSEMBLY ================= -->
      <g id="front-assembly">
        <!-- Steering Column -->
        <line x1="450" y1="380" x2="450" y2="520" stroke="#222" stroke-width="16" />
        
        <!-- Front Wheel -->
        <g transform="translate(450, 530)">
          <circle cx="0" cy="0" r="58" fill="url(#tireGrad)" />
          <circle cx="0" cy="0" r="42" fill="url(#chromeGrad)" />
          <circle cx="0" cy="0" r="14" fill="#111" />
          <path d="M0,-42 L0,42 M-42,0 L42,0 M-30,-30 L30,30 M-30,30 L30,-30" stroke="#777" stroke-width="7" />
          <!-- Front Mudguard -->
          <path d="M-58,25 A 62 62 0 0 1 58,25" fill="none" stroke="var(--rick-yellow)" stroke-width="12" stroke-linecap="round"/>
        </g>

        <!-- Handlebars -->
        <g transform="translate(450, 390)">
          <path d="M -65 0 Q 0 -25 65 0" fill="none" stroke="#222" stroke-width="10" stroke-linecap="round" />
          <circle cx="-65" cy="0" r="8" fill="#111" /> <!-- Grip L -->
          <circle cx="65" cy="0" r="8" fill="#111" /> <!-- Grip R -->
          
          <!-- Mirrors -->
          <path d="M -65 0 L -80 -40" stroke="#555" stroke-width="3" />
          <ellipse cx="-80" cy="-40" rx="8" ry="14" fill="#111" transform="rotate(-15 -80 -40)" />
          <path d="M 65 0 L 80 -40" stroke="#555" stroke-width="3" />
          <ellipse cx="80" cy="-40" rx="8" ry="14" fill="#111" transform="rotate(15 80 -40)" />
        </g>

        <!-- Headlamp -->
        <g transform="translate(450, 450)">
          <circle cx="0" cy="0" r="14" fill="#fff" />
          <circle cx="0" cy="0" r="18" fill="none" stroke="url(#chromeGrad)" stroke-width="5" />
          <circle cx="0" cy="0" r="30" fill="rgba(255,255,200,0.4)" class="blink" filter="url(#glow)" />
        </g>
      </g>

      <!-- ================= CABIN ================= -->
      <g id="cabin" filter="url(#dropShadow)">
        <!-- Cabin Back Wall -->
        <path d="M 270 370 L 630 370 L 630 200 L 270 200 Z" fill="var(--rick-yellow-dark)" />
        
        <!-- Cabin Side Wall (Right/Foreground) -->
        <path d="M 630 200 L 630 370 L 690 390 L 690 220 Z" fill="url(#bodyGrad)" />
        
        <!-- Cabin Front Wall (Driver Side) -->
        <path d="M 540 200 L 540 370 L 630 370 L 630 200 Z" fill="var(--rick-yellow)" />

        <!-- Door Frame -->
        <path d="M 630 200 L 630 370" stroke="#111" stroke-width="4" />
        <path d="M 630 220 L 685 240" stroke="#111" stroke-width="4" /> <!-- Top trim -->
        
        <!-- Door Handle -->
        <rect x="645" y="290" width="18" height="6" fill="#111" rx="2" />

        <!-- Window -->
        <path d="M 635 210 L 680 225 L 680 280 L 635 280 Z" fill="url(#glassGrad)" stroke="#111" stroke-width="4" />
        <!-- Window Reflection -->
        <path d="M 640 215 L 650 218 L 650 275 L 640 275 Z" fill="rgba(255,255,255,0.3)" />

        <!-- Seat (Inside) -->
        <path d="M 290 370 L 610 370 L 610 320 L 290 320 Z" fill="url(#seatStripe)" />
        <!-- Seat Backrest -->
        <path d="M 290 320 L 610 320 L 610 280 L 290 280 Z" fill="var(--seat)" />
        
        <!-- Roof Canopy -->
        <!-- Top surface -->
        <path d="M 260 200 L 640 200 L 700 220 L 340 220 Z" fill="url(#chromeGrad)" />
        <!-- Roof Edge -->
        <path d="M 260 200 L 640 200 L 640 205 L 260 205 Z" fill="#555" />
        
        <!-- Roof Rack -->
        <path d="M 340 200 L 340 190 L 630 190 L 630 200" fill="none" stroke="#111" stroke-width="5" />
        <line x1="370" y1="190" x2="370" y2="200" stroke="#111" stroke-width="3" />
        <line x1="450" y1="190" x2="450" y2="200" stroke="#111" stroke-width="3" />
        <line x1="550" y1="190" x2="550" y2="200" stroke="#111" stroke-width="3" />

        <!-- Windshield (Front) -->
        <path d="M 540 370 L 630 370 L 610 200 L 530 200 Z" fill="url(#glassGrad)" stroke="#111" stroke-width="5" />
        <!-- Windshield Pillar -->
        <line x1="580" y1="370" x2="560" y2="200" stroke="#111" stroke-width="5" />
        
        <!-- Windshield Reflection -->
        <path d="M 545 360 L 560 360 L 540 210 L 525 210 Z" fill="rgba(255,255,255,0.2)" />

        <!-- Side Panel Decorative Stripe -->
        <path d="M 630 330 L 685 350 L 685 355 L 630 335 Z" fill="var(--accent)" />
      </g>

      <!-- ================= DRIVER (Simplified) ================= -->
      <g id="driver">
        <!-- Head -->
        <circle cx="580" cy="280" r="16" fill="#333" />
        <!-- Torso -->
        <path d="M 570 295 L 590 295 L 590 370 L 570 370 Z" fill="#444" />
        <!-- Arms -->
        <path d="M 575 300 L 545 330 L 540 310" fill="none" stroke="#444" stroke-width="10" stroke-linecap="round" />
      </g>

      <!-- ================= INTERACTIVE HOTSPOTS ================= -->
      <g class="hotspot-group">
        <g class="hotspot" transform="translate(450, 450)">
          <circle cx="0" cy="0" r="6" class="hotspot-circle" />
          <text x="25" y="5" class="hotspot-label">Xenon Headlamp</text>
        </g>
      </g>
      <g class="hotspot-group">
        <g class="hotspot" transform="translate(655, 280)">
          <circle cx="0" cy="0" r="6" class="hotspot-circle" />
          <text x="25" y="5" class="hotspot-label">Polycarbonate Window</text>
        </g>
      </g>
      <g class="hotspot-group">
        <g class="hotspot" transform="translate(450, 430)">
          <circle cx="0" cy="0" r="6" class="hotspot-circle" />
          <text x="25" y="5" class="hotspot-label">Liquid Cooled Engine</text>
        </g>
      </g>

    </svg>
    <!-- SVG DRAWING END -->

  </div>

  <footer>
    <div>
      Designed for Urban Mobility<br>
      Vector Craft v2.0
    </div>
    <div>
      [ HOVER FOR DETAILS ]
    </div>
  </footer>
</main>

<script>
  // Refined Parallax Interaction
  const stage = document.querySelector('.stage');
  const svg = document.getElementById('vehicle-stage');

  stage.addEventListener('mousemove', (e) => {
    const rect = stage.getBoundingClientRect();
    // Calculate mouse position relative to center of stage (-1 to 1)
    const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    const y = ((e.clientY - rect.top) / rect.height) * 2 - 1;

    // Apply subtle rotation and translation
    // RotateY creates the 3D turn effect
    // RotateX creates the tilt effect
    // TranslateY lifts it slightly
    const rotateY = x * 6; // Max 6 degrees
    const rotateX = -y * 4; // Max 4 degrees
    const translateX = x * -15;
    const translateY = y * -15;

    svg.style.transform = `perspective(1200px) rotateY(${rotateY}deg) rotateX(${rotateX}deg) translate3d(${translateX}px, ${translateY}px, 0)`;
  });

  stage.addEventListener('mouseleave', () => {
    // Reset smoothly
    svg.style.transition = 'transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)';
    svg.style.transform = `perspective(1200px) rotateY(0deg) rotateX(0deg) translate3d(0,0,0)`;
    
    // Remove transition after reset so mousemove is snappy again
    setTimeout(() => {
      svg.style.transition = 'transform 0.1s linear';
    }, 600);
  });
</script>

</body>
</html>
