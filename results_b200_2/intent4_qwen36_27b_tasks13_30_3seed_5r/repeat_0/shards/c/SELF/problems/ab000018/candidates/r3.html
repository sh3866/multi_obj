<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poly Road - Visual Redesign</title>
    <style>
        :root {
            --ui-font: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            --ui-primary: #ffffff;
            --ui-text: #2d3436;
            --ui-accent: #ff7675;
            --ui-shadow: rgba(0,0,0,0.2);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Fallback */
            font-family: var(--ui-font);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- UI LAYER --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }

        /* HUD */
        .hud-top {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 10px;
        }

        .score-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 6px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1), 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.5);
            transform: translateY(0);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .score-card.pop {
            transform: scale(1.15) translateY(-5px);
        }

        .label {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #b2bec3;
            margin-bottom: 2px;
        }

        .value {
            font-size: 28px;
            font-weight: 800;
            line-height: 1;
            color: var(--ui-text);
        }

        .score-card.best .value { color: #fdcb6e; }
        .score-card.current .value { color: var(--ui-accent); }

        /* Controls Hint */
        .controls-hint {
            align-self: flex-end;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            padding: 10px 16px;
            border-radius: 12px;
            color: rgba(255,255,255,0.9);
            font-size: 12px;
            font-weight: 600;
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 20px;
            margin-right: 10px;
            transition: opacity 0.3s;
        }

        .key-row { display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
        .key {
            background: rgba(255,255,255,0.15);
            border-bottom: 2px solid rgba(0,0,0,0.2);
            border-radius: 4px;
            padding: 2px 6px;
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }

        /* Mobile Controls */
        .mobile-controls {
            display: none;
            pointer-events: auto;
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 20;
        }

        .dpad-btn {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            backdrop-filter: blur(2px);
            transition: background 0.1s, transform 0.1s;
        }
        .dpad-btn:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.9);
        }

        @media (max-width: 768px) {
            .controls-hint { display: none; }
            .mobile-controls { display: block; }
            .hud-top { transform: scale(0.85); transform-origin: top center; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div class="hud-top">
            <div class="score-card best">
                <div class="label">Best</div>
                <div class="value" id="best-score">142</div>
            </div>
            <div class="score-card current" id="score-pill">
                <div class="label">Score</div>
                <div class="value" id="current-score">0</div>
            </div>
        </div>

        <div class="controls-hint">
            <div class="key-row">
                <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>
                <span>to move</span>
            </div>
            <div style="opacity: 0.7; font-size: 11px;">Tap screen to hop</div>
        </div>
    </div>

    <div class="mobile-controls">
        <div class="dpad-btn" style="top: -60px; left: 0;" data-dir="up">▲</div>
        <div class="dpad-btn" style="bottom: -60px; left: 0;" data-dir="down">▼</div>
        <div class="dpad-btn" style="top: 0; left: -60px;" data-dir="left">◀</div>
        <div class="dpad-btn" style="top: 0; right: -60px;" data-dir="right">▶</div>
    </div>
</div>

<script>
/**
 * POLY ROAD REDESIGN
 * 
 * Design Philosophy:
 * 1. 3D Quality: Use proper face projection (corners) instead of simple scaling.
 * 2. Palette: "Flat UI" inspired but with depth. Soft greens, warm asphalt, vibrant accents.
 * 3. Lighting: Simple directional shading (Top = Light, Side = Dark).
 * 4. Character: Geometric but distinct.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- CONFIGURATION ---
const CONFIG = {
    fov: 350,
    cameraHeight: 160,
    cameraDist: 220,
    laneHeight: 45,
    laneWidth: 500,
    blockSize: 30,
    colors: {
        skyTop: '#74b9ff',
        skyBottom: '#a29bfe',
        grassLight: '#55efc4',
        grassDark: '#00b894',
        road: '#636e72',
        roadLine: '#dfe6e9',
        water: '#0984e3',
        waterSide: '#0652DD',
        wood: '#fdcb6e',
        woodSide: '#e1b12c',
        tree: '#00cec9',
        treeSide: '#006266'
    }
};

// --- STATE ---
let state = {
    width: 0,
    height: 0,
    centerX: 0,
    centerY: 0,
    playerZ: 0,
    lanes: [],
    score: 0,
    clouds: []
};

// --- UTILS ---

// 3D Projection: World (x,y,z) -> Screen (x,y)
function project(x, y, z) {
    const camZ = state.playerZ + state.cameraDist;
    const dist = z - state.playerZ;
    // Perspective scale factor
    const scale = CONFIG.fov / (CONFIG.fov + dist);
    
    const screenX = state.centerX + (x * scale);
    const screenY = state.centerY + (y - CONFIG.cameraHeight) * scale;
    
    return { x: screenX, y: screenY, scale: scale, depth: dist };
}

// Helper: Darken color by percentage
function hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
    } : {r:0,g:0,b:0};
}

function adjustColor(hex, amount) {
    const c = hexToRgb(hex);
    const r = Math.min(255, Math.max(0, c.r + amount));
    const g = Math.min(255, Math.max(0, c.g + amount));
    const b = Math.min(255, Math.max(0, c.b + amount));
    return `rgb(${r},${g},${b})`;
}

// --- CLASSES ---

class Cloud {
    constructor() {
        this.x = (Math.random() - 0.5) * 2000;
        this.y = -150 - Math.random() * 200;
        this.z = 1000 + Math.random() * 2000; 
        this.scale = 0.5 + Math.random() * 1.0;
        this.speed = 0.2 + Math.random() * 0.3;
    }

    update() {
        this.x += this.speed;
        if (this.x > 1500) this.x = -1500;
    }

    draw() {
        const p = project(this.x, this.y, this.z);
        // Draw cloud as a cluster of rects/circles for low-poly feel
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        const s = p.scale * 150;
        ctx.beginPath();
        ctx.arc(p.x, p.y, s, 0, Math.PI * 2);
        ctx.arc(p.x + s*0.8, p.y + s*0.2, s*0.7, 0, Math.PI * 2);
        ctx.arc(p.x - s*0.8, p.y + s*0.2, s*0.7, 0, Math.PI * 2);
        ctx.fill();
    }
}

class Lane {
    constructor(zIndex) {
        this.zIndex = zIndex;
        this.z = zIndex * CONFIG.laneHeight;
        this.type = this.determineType(zIndex);
        this.traffic = [];
        this.decorations = [];

        // Init Traffic
        if (this.type === 'road') {
            this.speed = (Math.random() > 0.5 ? 1 : -1) * (3 + Math.random() * 4);
            const count = 1 + Math.floor(Math.random() * 2);
            for(let i=0; i<count; i++) {
                // Space cars out
                this.traffic.push({
                    x: (i * 300) - 200,
                    width: 40,
                    height: 20,
                    depth: 70,
                    color: ['#ff7675', '#74b9ff', '#fdcb6e', '#a29bfe'][Math.floor(Math.random()*4)],
                    type: Math.random() > 0.8 ? 'truck' : 'car'
                });
            }
        } 
        // Init Decorations
        else if (this.type === 'grass') {
            // Place trees on sides
            if (Math.random() > 0.4) {
                const side = Math.random() > 0.5 ? 1 : -1;
                this.decorations.push({
                    x: side * (120 + Math.random() * 100),
                    type: 'tree'
                });
            }
        }
    }

    determineType(z) {
        // Pattern: Grass, Road, Road, Grass, Water
        const mod = z % 5;
        if (mod === 0) return 'grass';
        if (mod === 1) return 'road';
        if (mod === 2) return 'road';
        if (mod === 3) return 'grass';
        if (mod === 4) return 'water';
        return 'grass';
    }

    update() {
        if (this.type === 'road') {
            this.traffic.forEach(car => {
                car.x += this.speed;
                // Wrap logic
                if (this.speed > 0 && car.x > CONFIG.laneWidth + 100) car.x = -CONFIG.laneWidth - 100;
                if (this.speed < 0 && car.x < -CONFIG.laneWidth - 100) car.x = CONFIG.laneWidth + 100;
            });
        }
    }

    draw() {
        // Corners of the lane slab
        const w = CONFIG.laneWidth / 2 + 60; // Extra width for curb
        const pFL = project(-w, 0, this.z); // Front Left
        const pFR = project(w, 0, this.z);  // Front Right
        const pBL = project(-w, 0, this.z + CONFIG.laneHeight); // Back Left
        const pBR = project(w, 0, this.z + CONFIG.laneHeight); // Back Right

        // Colors
        let topColor, sideColor;
        if (this.type === 'grass') {
            topColor = (Math.floor(this.zIndex) % 2 === 0) ? CONFIG.colors.grassLight : CONFIG.colors.grassDark;
            sideColor = adjustColor(topColor, -30);
        } else if (this.type === 'road') {
            topColor = CONFIG.colors.road;
            sideColor = '#2d3436';
        } else if (this.type === 'water') {
            topColor = CONFIG.colors.water;
            sideColor = CONFIG.colors.waterSide;
        }

        // 1. Draw Side (Depth)
        ctx.fillStyle = sideColor;
        ctx.beginPath();
        ctx.moveTo(pFL.x, pFL.y);
        ctx.lineTo(pFR.x, pFR.y);
        ctx.lineTo(pBR.x, pBR.y);
        ctx.lineTo(pBL.x, pBL.y);
        ctx.closePath();
        ctx.fill();

        // 2. Draw Top
        ctx.fillStyle = topColor;
        ctx.beginPath();
        ctx.moveTo(pBL.x, pBL.y);
        ctx.lineTo(pBR.x, pBR.y);
        ctx.lineTo(pFR.x, pFR.y);
        ctx.lineTo(pFL.x, pFL.y);
        ctx.closePath();
        ctx.fill();

        // 3. Details
        if (this.type === 'road') {
            // Road markings
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2 * pFL.scale;
            ctx.setLineDash([10 * pFL.scale, 15 * pFL.scale]);
            ctx.beginPath();
            // Center line
            const pCenterFront = project(0, 0, this.z);
            const pCenterBack = project(0, 0, this.z + CONFIG.laneHeight);
            ctx.moveTo(pCenterFront.x, pCenterFront.y);
            ctx.lineTo(pCenterBack.x, pCenterBack.y);
            ctx.stroke();
            ctx.setLineDash([]);
        } else if (this.type === 'water') {
            // Simple wave lines
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 2 * pFL.scale;
            const midX = (pFL.x + pFR.x)/2;
            const midY = (pFL.y + pFR.y)/2;
            ctx.beginPath();
            ctx.moveTo(midX - 30*pFL.scale, midY);
            ctx.quadraticCurveTo(midX, midY - 5*pFL.scale, midX + 30*pFL.scale, midY);
            ctx.stroke();
        }

        // 4. Decorations (Trees)
        // Draw BEFORE traffic so cars pass in front of trees if close
        this.decorations.forEach(dec => {
            this.drawTree(dec.x, this.z, pFL.scale);
        });

        // 5. Traffic
        if (this.type === 'road') {
            this.traffic.forEach(car => {
                this.drawCar(car, pFL.scale);
            });
        }
    }

    drawTree(x, z, scale) {
        const p = project(x, 0, z);
        const s = scale * 40; // Tree scale

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, s*0.6, s*0.3, 0, 0, Math.PI*2);
        ctx.fill();

        // Trunk
        const trunkW = s * 0.3;
        const trunkH = s * 0.6;
        ctx.fillStyle = CONFIG.colors.woodSide;
        ctx.fillRect(p.x - trunkW/2, p.y - trunkH, trunkW, trunkH);

        // Leaves (Low Poly Cone)
        ctx.fillStyle = CONFIG.colors.tree;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y - s * 2.2); // Tip
        ctx.lineTo(p.x + s/2, p.y - trunkH); // Right Bottom
        ctx.lineTo(p.x - s/2, p.y - trunkH); // Left Bottom
        ctx.fill();
        
        // Highlight triangle
        ctx.fillStyle = adjustColor(CONFIG.colors.tree, 30);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y - s * 2.2);
        ctx.lineTo(p.x + s/2, p.y - trunkH);
        ctx.lineTo(p.x, p.y - trunkH);
        ctx.fill();
    }

    drawCar(car, scale) {
        const cx = car.x;
        const cz = this.z;
        const cw = car.width;
        const ch = car.height;
        const cd = car.depth;

        // Project 8 corners of the car box
        // Front Bottom Left/Right
        const fbl = project(cx - cw/2, 0, cz);
        const fbr = project(cx + cw/2, 0, cz);
        // Back Bottom Left/Right
        const bbl = project(cx - cw/2, 0, cz + cd);
        const bbr = project(cx + cw/2, 0, cz + cd);
        // Front Top Left/Right
        const ftl = project(cx - cw/2, ch, cz);
        const ftr = project(cx + cw/2, ch, cz);
        // Back Top Left/Right
        const btl = project(cx - cw/2, ch, cz + cd);
        const btr = project(cx + cw/2, ch, cz + cd);

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.moveTo(fbl.x, fbl.y);
        ctx.lineTo(fbr.x, fbr.y);
        ctx.lineTo(bbr.x, bbr.y);
        ctx.lineTo(bbl.x, bbl.y);
        ctx.fill();

        // Body Color
        const bodyColor = car.color;
        const sideColor = adjustColor(bodyColor, -30);
        const topColor = adjustColor(bodyColor, 20);

        // Draw Faces (Painter's Algorithm: Top -> Sides -> Front)
        
        // Top
        ctx.fillStyle = topColor;
        ctx.beginPath();
        ctx.moveTo(ftl.x, ftl.y);
        ctx.lineTo(ftr.x, ftr.y);
        ctx.lineTo(btr.x, btr.y);
        ctx.lineTo(btl.x, btl.y);
        ctx.fill();

        // Right Side
        ctx.fillStyle = sideColor;
        ctx.beginPath();
        ctx.moveTo(fbr.x, fbr.y);
        ctx.lineTo(bbr.x, bbr.y);
        ctx.lineTo(btr.x, btr.y);
        ctx.lineTo(ftr.x, ftr.y);
        ctx.fill();

        // Left Side
        ctx.fillStyle = adjustColor(bodyColor, -50);
        ctx.beginPath();
        ctx.moveTo(fbl.x, fbl.y);
        ctx.lineTo(bbl.x, bbl.y);
        ctx.lineTo(btl.x, btl.y);
        ctx.lineTo(ftl.x, ftl.y);
        ctx.fill();
        
        // Front
        ctx.fillStyle = bodyColor;
        ctx.beginPath();
        ctx.moveTo(fbl.x, fbl.y);
        ctx.lineTo(fbr.x, fbr.y);
        ctx.lineTo(ftr.x, ftr.y);
        ctx.lineTo(ftl.x, ftl.y);
        ctx.fill();
    }
}

class Player {
    constructor() {
        this.x = 0;
        this.z = 0;
        this.targetX = 0;
        this.targetZ = 0;
        this.hopY = 0;
        this.hopVel = 0;
        this.isHopping = false;
    }

    move(dx, dy) {
        if (this.isHopping) return;
        
        this.targetX += dx * 40; 
        this.targetZ += dy * CONFIG.laneHeight;
        
        this.isHopping = true;
        this.hopVel = 12;
        
        if (dy > 0) {
            state.score++;
            const el = document.getElementById('current-score');
            el.innerText = state.score;
            
            // Pop animation
            const pill = document.getElementById('score-pill');
            pill.classList.remove('pop');
            void pill.offsetWidth; // trigger reflow
            pill.classList.add('pop');
        }
    }

    update() {
        // Smooth movement
        this.x += (this.targetX - this.x) * 0.2;
        this.z += (this.targetZ - this.z) * 0.2;

        // Hop Physics
        if (this.isHopping) {
            this.hopY += this.hopVel;
            this.hopVel -= 1.2; // Gravity
            
            if (this.hopY <= 0) {
                this.hopY = 0;
                this.isHopping = false;
                this.x = this.targetX;
                this.z = this.targetZ;
                state.playerZ = this.z;
            }
        }
    }

    draw() {
        const sP = project(this.x, 0, this.z);
        const scale = sP.scale;
        const size = CONFIG.blockSize;
        const yOff = this.hopY;

        // Shadow (Always on ground)
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(sP.x, sP.y, 14 * scale, 7 * scale, 0, 0, Math.PI*2);
        ctx.fill();

        // Vertices for the Player Cube
        // 0:FBL, 1:FBR, 2:BBR, 3:BBL
        // 4:FTL, 5:FTR, 6:BTR, 7:BTL
        const v = [
            project(this.x - size/2, yOff, this.z),
            project(this.x + size/2, yOff, this.z),
            project(this.x + size/2, yOff, this.z + size),
            project(this.x - size/2, yOff, this.z + size),
            project(this.x - size/2, yOff + size, this.z),
            project(this.x + size/2, yOff + size, this.z),
            project(this.x + size/2, yOff + size, this.z + size),
            project(this.x - size/2, yOff + size, this.z + size)
        ];

        // Draw Faces
        // Top
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(v[4].x, v[4].y);
        ctx.lineTo(v[5].x, v[5].y);
        ctx.lineTo(v[6].x, v[6].y);
        ctx.lineTo(v[7].x, v[7].y);
        ctx.fill();

        // Right
        ctx.fillStyle = '#dfe6e9';
        ctx.beginPath();
        ctx.moveTo(v[1].x, v[1].y);
        ctx.lineTo(v[2].x, v[2].y);
        ctx.lineTo(v[6].x, v[6].y);
        ctx.lineTo(v[5].x, v[5].y);
        ctx.fill();

        // Left
        ctx.fillStyle = '#b2bec3';
        ctx.beginPath();
        ctx.moveTo(v[0].x, v[0].y);
        ctx.lineTo(v[3].x, v[3].y);
        ctx.lineTo(v[7].x, v[7].y);
        ctx.lineTo(v[4].x, v[4].y);
        ctx.fill();

        // Front
        ctx.fillStyle = '#f5f6fa';
        ctx.beginPath();
        ctx.moveTo(v[0].x, v[0].y);
        ctx.lineTo(v[1].x, v[1].y);
        ctx.lineTo(v[5].x, v[5].y);
        ctx.lineTo(v[4].x, v[4].y);
        ctx.fill();

        // Face Details (Eyes & Beak) - Draw on Front Face
        const eyeSize = 3 * scale;
        const eyeY = v[0].y - (size/3)*scale;
        
        // Eyes
        ctx.fillStyle = '#2d3436';
        ctx.beginPath();
        ctx.arc(v[0].x + (size/3)*scale, eyeY, eyeSize, 0, Math.PI*2);
        ctx.arc(v[1].x - (size/3)*scale, eyeY, eyeSize, 0, Math.PI*2);
        ctx.fill();

        // Beak
        ctx.fillStyle = '#fab1a0';
        ctx.beginPath();
        ctx.moveTo(v[0].x + (size/2)*scale, eyeY + (size/4)*scale);
        ctx.lineTo(v[0].x + (size/2)*scale + (size/4)*scale, eyeY + (size/3)*scale);
        ctx.lineTo(v[0].x + (size/2)*scale, eyeY + (size/2)*scale);
        ctx.fill();
    }
}

// --- INITIALIZATION ---

const player = new Player();

function init() {
    resize();
    window.addEventListener('resize', resize);
    
    // Create initial lanes (start behind player and go forward)
    for (let i = -5; i < 20; i++) {
        state.lanes.push(new Lane(i));
    }

    // Create Clouds
    for(let i=0; i<12; i++) {
        state.clouds.push(new Cloud());
    }

    // Input Handling
    window.addEventListener('keydown', (e) => {
        switch(e.key) {
            case 'ArrowUp': case 'w': player.move(0, 1); break;
            case 'ArrowDown': case 's': player.move(0, -1); break;
            case 'ArrowLeft': case 'a': player.move(-1, 0); break;
            case 'ArrowRight': case 'd': player.move(1, 0); break;
        }
    });

    canvas.addEventListener('mousedown', () => player.move(0, 1));
    
    // Mobile D-Pad
    document.querySelectorAll('.dpad-btn').forEach(btn => {
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            const dir = btn.getAttribute('data-dir');
            if (dir === 'up') player.move(0, 1);
            if (dir === 'down') player.move(0, -1);
            if (dir === 'left') player.move(-1, 0);
            if (dir === 'right') player.move(1, 0);
        });
    });

    loop();
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    state.width = canvas.width;
    state.height = canvas.height;
    state.centerX = state.width / 2;
    state.centerY = state.height / 2 + 80; 
}

// --- GAME LOOP ---

function loop() {
    // Clear
    ctx.clearRect(0, 0, state.width, state.height);

    // Draw Sky Gradient
    const grad = ctx.createLinearGradient(0, 0, 0, state.height);
    grad.addColorStop(0, CONFIG.colors.skyTop);
    grad.addColorStop(1, CONFIG.colors.skyBottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, state.width, state.height);

    // Update & Draw Clouds
    state.clouds.forEach(c => {
        c.update();
        c.draw();
    });

    // Update Player
    player.update();

    // Update Lanes
    state.lanes.forEach(lane => lane.update());

    // Infinite Scroll Logic
    const playerLaneIndex = Math.floor(player.z / CONFIG.laneHeight);
    
    if (state.lanes[0].zIndex < playerLaneIndex - 5) {
        state.lanes.shift();
        const lastZ = state.lanes[state.lanes.length-1].zIndex;
        state.lanes.push(new Lane(lastZ + 1));
    }

    // Sort Lanes (Back to Front) - Painter's Algorithm
    const sortedLanes = [...state.lanes].sort((a, b) => b.z - a.z);
    
    sortedLanes.forEach(lane => {
        // Optimization: Don't draw if way behind camera
        if (lane.z < state.playerZ - CONFIG.cameraDist) return;
        lane.draw();
    });

    // Draw Player
    player.draw();

    requestAnimationFrame(loop);
}

// Start
init();

</script>
</body>
