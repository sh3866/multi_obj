<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactical AI Visualizer</title>
<style>
  :root {
    --bg-dark: #090b10;
    --bg-panel: rgba(15, 23, 42, 0.65);
    --border-panel: rgba(148, 163, 184, 0.1);
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --accent-blue: #38bdf8;
    --accent-blue-dim: rgba(56, 189, 248, 0.2);
    --accent-amber: #fbbf24;
    --accent-amber-dim: rgba(251, 191, 36, 0.2);
    --accent-red: #f43f5e;
    --accent-red-dim: rgba(244, 63, 94, 0.2);
    --accent-emerald: #34d399;
    --font-mono: 'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: var(--font-sans);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  /* Background Grid & Atmosphere */
  .bg-layer {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-color: var(--bg-dark);
    background-image: 
      linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  .atmosphere {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(circle at 50% 50%, transparent 0%, #000000 120%);
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
    cursor: crosshair;
  }

  /* UI Overlay */
  .ui-layer {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 32px;
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .brand h1 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    margin: 0;
  }

  .brand p {
    font-size: 11px;
    color: var(--text-muted);
    margin: 0;
    font-family: var(--font-mono);
    letter-spacing: 0.5px;
  }

  /* Panels */
  .panel {
    background: var(--bg-panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-panel);
    border-radius: 12px;
    padding: 20px;
    pointer-events: auto;
    box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
  }

  .panel-header {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel-header::before {
    content: '';
    display: block;
    width: 6px;
    height: 6px;
    background: var(--accent-blue);
    border-radius: 2px;
    box-shadow: 0 0 10px var(--accent-blue);
  }

  /* Legend Panel */
  .legend-panel {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 180px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-main);
    transition: opacity 0.2s;
  }

  .legend-item:hover { opacity: 0.7; }

  .indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    position: relative;
  }
  
  .indicator::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    opacity: 0.4;
  }

  /* Inspector Panel */
  .inspector-panel {
    width: 340px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
    margin-bottom: 8px;
  }

  .stat-label { color: var(--text-muted); font-weight: 400; }
  
  .stat-value { 
    font-family: var(--font-mono); 
    font-weight: 600; 
    color: #fff; 
    font-size: 13px;
    letter-spacing: 0.5px;
  }

  .health-bar-wrapper {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.05);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }

  .health-fill {
    height: 100%;
    background: var(--accent-emerald);
    width: 100%;
    transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 0 15px rgba(52, 211, 153, 0.4);
    position: relative;
  }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 4px;
  }

  .btn {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text-muted);
    padding: 12px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    border-radius: 6px;
    font-family: var(--font-mono);
  }

  .btn:hover {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border-color: rgba(255,255,255,0.2);
    transform: translateY(-1px);
  }

  .btn.primary {
    background: var(--accent-blue);
    border-color: var(--accent-blue);
    color: #0f172a;
    box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
  }
  
  .btn.primary:hover {
    background: #7dd3fc;
    box-shadow: 0 6px 16px rgba(56, 189, 248, 0.4);
  }

  /* Instructions */
  .instructions {
    position: absolute;
    bottom: 32px;
    right: 32px;
    text-align: right;
    font-size: 12px;
    color: var(--text-muted);
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }

  .key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-bottom: 2px solid rgba(255,255,255,0.2);
    border-radius: 4px;
    margin: 0 2px;
    color: #fff;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 10px;
  }

  /* Scanlines - Subtle */
  .scanlines {
    position: fixed;
    inset: 0;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.05) 50%, rgba(0,0,0,0.05));
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 20;
    opacity: 0.6;
  }

</style>
</head>
<body>

  <div class="bg-layer"></div>
  <div class="atmosphere"></div>
  <canvas id="arena"></canvas>
  <div class="scanlines"></div>

  <div class="ui-layer">
    <header>
      <div class="brand">
        <h1>Neural Tactics</h1>
        <p>Behavior State Visualization</p>
      </div>

      <div class="panel legend-panel">
        <div class="panel-header">AI States</div>
        <div class="legend-item">
          <div class="indicator" style="background:var(--accent-blue); box-shadow:0 0 8px var(--accent-blue)"></div>
          <span>Patrol</span>
        </div>
        <div class="legend-item">
          <div class="indicator" style="background:var(--accent-amber); box-shadow:0 0 8px var(--accent-amber)"></div>
          <span>Alert</span>
        </div>
        <div class="legend-item">
          <div class="indicator" style="background:var(--accent-red); box-shadow:0 0 8px var(--accent-red)"></div>
          <span>Chase</span>
        </div>
        <div class="legend-item">
          <div class="indicator" style="background:#fff; box-shadow:0 0 8px #fff"></div>
          <span>Attack</span>
        </div>
      </div>
    </header>

    <div style="display:flex; justify-content:space-between; align-items:flex-end;">
      <div class="panel inspector-panel">
        <div class="panel-header">Player Inspector</div>
        
        <div>
          <div class="stat-row">
            <span class="stat-label">Health</span>
            <span class="stat-value" id="hp-val">100%</span>
          </div>
          <div class="health-bar-wrapper">
            <div class="health-fill" id="hp-bar"></div>
          </div>
        </div>

        <div style="margin-top: 12px;">
          <div class="stat-row">
            <span class="stat-label">Position</span>
            <span class="stat-value" id="pos-val">0, 0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Velocity</span>
            <span class="stat-value" id="vel-val">0.0</span>
          </div>
        </div>

        <div class="controls">
          <div class="btn primary">Move (WASD)</div>
          <div class="btn" id="btn-reset">Reset</div>
        </div>
      </div>

      <div class="instructions">
        <span>Use <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> to move player</span>
        <span style="opacity: 0.6; font-size: 11px;">Observe AI state transitions</span>
      </div>
    </div>
  </div>

<script>
/**
 * ENGINE & LOGIC
 */
const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d');
const ui = {
  hpVal: document.getElementById('hp-val'),
  hpBar: document.getElementById('hp-bar'),
  posVal: document.getElementById('pos-val'),
  velVal: document.getElementById('vel-val'),
  resetBtn: document.getElementById('btn-reset')
};

// Configuration
const COLORS = {
  PATROL: '#38bdf8',
  ALERT: '#fbbf24',
  CHASE: '#f43f5e',
  ATTACK: '#ffffff',
  PLAYER: '#34d399',
  WALL: '#0f172a',
  WALL_BORDER: '#1e293b',
  WALL_HIGHLIGHT: '#334155',
  GRID: '#1e293b'
};

const STATES = {
  PATROL: 'PATROL',
  ALERT: 'ALERT',
  CHASE: 'CHASE',
  ATTACK: 'ATTACK'
};

// Game State
let width, height;
let player = { x: 0, y: 0, radius: 12, hp: 100, speed: 5.5 };
let enemies = [];
let walls = [];
let keys = {};
let time = 0;

// Initialize
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  initWorld();
}

function initWorld() {
  // Player start
  player.x = width * 0.2;
  player.y = height * 0.5;
  player.hp = 100;

  // Walls - Tactical Layout
  const w = width;
  const h = height;
  
  // Reset walls
  walls = [];
  
  // Create a grid-like tactical environment
  const wallThickness = 20;
  
  // Outer boundaries (soft)
  // walls.push({ x: 0, y: 0, w: w, h: 20 });
  // walls.push({ x: 0, y: h-20, w: w, h: 20 });

  // Central structures
  walls.push({ x: w * 0.4, y: h * 0.2, w: wallThickness, h: h * 0.3 }); // Vertical Pillar 1
  walls.push({ x: w * 0.6, y: h * 0.5, w: wallThickness, h: h * 0.3 }); // Vertical Pillar 2
  
  walls.push({ x: w * 0.5, y: h * 0.45, w: 200, h: wallThickness }); // Horizontal Bar
  
  // Corner cover
  walls.push({ x: w * 0.15, y: h * 0.15, w: 140, h: 140 });
  walls.push({ x: w * 0.75, y: h * 0.15, w: 140, h: 140 });
  
  // Bottom obstacles
  walls.push({ x: w * 0.3, y: h * 0.75, w: 180, h: wallThickness });
  walls.push({ x: w * 0.7, y: h * 0.7, w: wallThickness, h: 120 });

  // Enemies
  enemies = [
    new Enemy(w * 0.5, h * 0.1, STATES.PATROL),
    new Enemy(w * 0.8, h * 0.8, STATES.PATROL),
    new Enemy(w * 0.85, h * 0.2, STATES.PATROL),
    new Enemy(w * 0.15, h * 0.8, STATES.PATROL),
    new Enemy(w * 0.5, h * 0.9, STATES.PATROL),
    new Enemy(w * 0.3, h * 0.3, STATES.PATROL),
  ];
}

class Enemy {
  constructor(x, y, state) {
    this.x = x;
    this.y = y;
    this.radius = 10;
    this.angle = 0;
    this.state = state;
    this.speed = 3.2;
    
    // Patrol Logic
    this.patrolTarget = this.getRandomPatrolPoint();
    this.patrolTimer = 0;
    
    // Alert Logic
    this.alertTimer = 0;
    this.alertPos = {x: 0, y: 0};

    // Attack Logic
    this.attackCooldown = 0;
    
    // Animation
    this.pulse = 0;
  }

  getRandomPatrolPoint() {
    // Avoid spawning inside walls (simple check)
    let safe = false;
    let rx, ry;
    while(!safe) {
      rx = Math.random() * (width - 100) + 50;
      ry = Math.random() * (height - 100) + 50;
      safe = !checkCircleWallCollision(rx, ry, 20);
    }
    return { x: rx, y: ry };
  }

  update() {
    const distToPlayer = Math.hypot(player.x - this.x, player.y - this.y);
    const angleToPlayer = Math.atan2(player.y - this.y, player.x - this.x);
    
    // Raycasting for Vision
    let canSeePlayer = false;
    if (distToPlayer < 350) { // Vision range
      let angleDiff = angleToPlayer - this.angle;
      while (angleDiff <= -Math.PI) angleDiff += Math.PI*2;
      while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
      
      if (Math.abs(angleDiff) < Math.PI / 3) { // FOV ~120 degrees
        canSeePlayer = !checkWallCollision(this.x, this.y, player.x, player.y);
      }
    }

    // State Machine
    switch(this.state) {
      case STATES.PATROL:
        this.angle = Math.atan2(this.patrolTarget.y - this.y, this.patrolTarget.x - this.x);
        this.moveTowards(this.patrolTarget.x, this.patrolTarget.y);
        
        if (distToPlayer < 350 && canSeePlayer) {
          this.state = STATES.ALERT;
          this.alertTimer = 60; // 1 second alert
          this.alertPos = {x: player.x, y: player.y};
        } else if (Math.hypot(this.patrolTarget.x - this.x, this.patrolTarget.y - this.y) < 5) {
          this.patrolTarget = this.getRandomPatrolPoint();
        }
        break;

      case STATES.ALERT:
        this.angle = angleToPlayer;
        this.alertTimer--;
        if (this.alertTimer <= 0) {
          if (canSeePlayer) this.state = STATES.CHASE;
          else this.state = STATES.PATROL;
        }
        break;

      case STATES.CHASE:
        this.angle = angleToPlayer;
        if (canSeePlayer) {
          if (distToPlayer < 50) {
            this.state = STATES.ATTACK;
          } else {
            this.moveTowards(player.x, player.y, this.speed * 1.3); // Faster chase
          }
        } else {
          this.state = STATES.ALERT;
          this.alertTimer = 60;
        }
        break;

      case STATES.ATTACK:
        this.angle = angleToPlayer;
        this.attackCooldown--;
        if (this.attackCooldown <= 0) {
          player.hp -= 8; 
          this.attackCooldown = 25;
          createParticle(player.x, player.y, COLORS.ATTACK);
        }
        if (distToPlayer > 200) {
          this.state = STATES.CHASE;
        }
        break;
    }
    
    this.pulse += 0.15;
  }

  moveTowards(tx, ty, spd = null) {
    const speed = spd || this.speed;
    const dx = tx - this.x;
    const dy = ty - this.y;
    const dist = Math.hypot(dx, dy);
    
    if (dist > 0) {
      let nx = (dx / dist) * speed;
      let ny = (dy / dist) * speed;
      
      // Wall Collision Check
      if (!checkCircleWallCollision(this.x + nx, this.y + ny, this.radius)) {
        this.x += nx;
        this.y += ny;
      } else {
        // Slide
        if (!checkCircleWallCollision(this.x + nx, this.y, this.radius)) this.x += nx;
        else if (!checkCircleWallCollision(this.x, this.y + ny, this.radius)) this.y += ny;
      }
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Draw Detection Cone (only if not patrolling or if alerting)
    if (this.state !== STATES.PATROL) {
      let alpha = 0.1;
      let color = this.getColor();
      
      if (this.state === STATES.ALERT) alpha = 0.15;
      if (this.state === STATES.CHASE) alpha = 0.2;
      
      const gradient = ctx.createRadialGradient(0, 0, 10, 0, 0, 350);
      gradient.addColorStop(0, hexToRgba(color, alpha * 1.5));
      gradient.addColorStop(1, hexToRgba(color, 0));

      ctx.fillStyle = gradient;
      ctx.strokeStyle = hexToRgba(color, 0.4);
      ctx.lineWidth = 1;
      
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, 350, this.angle - Math.PI/3, this.angle + Math.PI/3);
      ctx.lineTo(0, 0);
      ctx.fill();
      ctx.stroke();
    }

    // Rotate entity
    ctx.rotate(this.angle);

    // Dynamic Glow
    const glowSize = 15 + Math.sin(this.pulse) * 5;
    ctx.shadowColor = this.getColor();
    ctx.shadowBlur = glowSize;

    // Draw Enemy Shape (Triangle)
    ctx.fillStyle = this.getColor();
    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.lineTo(-8, 9);
    ctx.lineTo(-4, 0);
    ctx.lineTo(-8, -9);
    ctx.closePath();
    ctx.fill();
    
    // Inner Core
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(-2, 0, 2.5, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();

    // Draw State Label (Floating)
    // Only draw if close or not patrol to reduce clutter
    if (this.state !== STATES.PATROL) {
      ctx.fillStyle = this.getColor();
      ctx.font = '10px "SF Mono", monospace';
      ctx.textAlign = 'center';
      ctx.globalAlpha = 0.9;
      ctx.fillText(this.state, this.x, this.y - 20);
      ctx.globalAlpha = 1.0;
    }
  }

  getColor() {
    switch(this.state) {
      case STATES.PATROL: return COLORS.PATROL;
      case STATES.ALERT: return COLORS.ALERT;
      case STATES.CHASE: return COLORS.CHASE;
      case STATES.ATTACK: return COLORS.ATTACK;
      default: return '#fff';
    }
  }
}

// Helpers
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function checkWallCollision(x1, y1, x2, y2) {
  for (let w of walls) {
    // Check if line segment intersects AABB
    // Sample points along the line
    const steps = 8;
    for(let i=0; i<=steps; i++) {
        const t = i/steps;
        const cx = x1 + (x2-x1)*t;
        const cy = y1 + (y2-y1)*t;
        if (cx > w.x && cx < w.x + w.w && cy > w.y && cy < w.y + w.h) return true;
    }
  }
  return false;
}

function checkCircleWallCollision(x, y, r) {
  for (let w of walls) {
    let testX = x;
    let testY = y;

    if (x < w.x) testX = w.x;
    else if (x > w.x + w.w) testX = w.x + w.w;

    if (y < w.y) testY = w.y;
    else if (y > w.y + w.h) testY = w.y + w.h;

    let distX = x - testX;
    let distY = y - testY;
    let distance = Math.sqrt((distX*distX) + (distY*distY));

    if (distance <= r) return true;
  }
  return false;
}

let particles = [];
function createParticle(x, y, color) {
  for(let i=0; i<6; i++) {
    particles.push({
      x, y, color, 
      life: 25, 
      size: Math.random() * 3 + 1,
      vx: (Math.random() - 0.5) * 5,
      vy: (Math.random() - 0.5) * 5
    });
  }
}

// Input Handling
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('resize', resize);
ui.resetBtn.addEventListener('click', initWorld);

// Main Loop
function loop() {
  time++;
  ctx.clearRect(0, 0, width, height);

  // Update Player
  let dx = 0, dy = 0;
  if (keys['w']) dy = -1;
  if (keys['s']) dy = 1;
  if (keys['a']) dx = -1;
  if (keys['d']) dx = 1;

  if (dx !== 0 || dy !== 0) {
    let len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    
    let nextX = player.x + dx * player.speed;
    let nextY = player.y + dy * player.speed;
    
    if (!checkCircleWallCollision(nextX, player.y, player.radius)) player.x = nextX;
    if (!checkCircleWallCollision(player.x, nextY, player.radius)) player.y = nextY;
  }

  // Draw Walls
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = 15;
  ctx.shadowOffsetY = 8;
  
  for (let w of walls) {
    // Fill
    ctx.fillStyle = COLORS.WALL;
    ctx.fillRect(w.x, w.y, w.w, w.h);
    
    // Border/Bevel
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
    ctx.lineWidth = 1;
    ctx.strokeStyle = COLORS.WALL_BORDER;
    ctx.strokeRect(w.x, w.y, w.w, w.h);
    
    // Top Highlight (Tech feel)
    ctx.fillStyle = COLORS.WALL_HIGHLIGHT;
    ctx.fillRect(w.x, w.y, w.w, 2);
    
    // Corner Accents
    ctx.fillStyle = COLORS.WALL_BORDER;
    ctx.fillRect(w.x + w.w - 4, w.y, 4, 4);
    ctx.fillRect(w.x, w.y + w.h - 4, 4, 4);
  }

  // Draw Connections (Network lines between enemies)
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.03)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let i=0; i<enemies.length; i++) {
      for(let j=i+1; j<enemies.length; j++) {
          let d = Math.hypot(enemies[i].x - enemies[j].x, enemies[i].y - enemies[j].y);
          if(d < 250) {
              ctx.moveTo(enemies[i].x, enemies[i].y);
              ctx.lineTo(enemies[j].x, enemies[j].y);
          }
      }
  }
  ctx.stroke();

  // Update & Draw Enemies
  for (let e of enemies) {
    e.update();
    e.draw();
  }

  // Draw Player
  ctx.save();
  ctx.translate(player.x, player.y);
  
  // Player Glow (Ring)
  ctx.shadowColor = COLORS.PLAYER;
  ctx.shadowBlur = 20;
  ctx.strokeStyle = COLORS.PLAYER;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, player.radius + 6, 0, Math.PI * 2);
  ctx.stroke();
  
  // Player Body
  ctx.fillStyle = COLORS.PLAYER;
  ctx.beginPath();
  ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
  ctx.fill();
  
  // Inner detail
  ctx.fillStyle = '#fff';
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.arc(0, 0, player.radius * 0.4, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.restore();

  // Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 25;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  ctx.globalAlpha = 1;

  // Update UI
  ui.posVal.textContent = `${Math.round(player.x)}, ${Math.round(player.y)}`;
  let speed = Math.hypot(dx, dy) * player.speed;
  ui.velVal.textContent = speed.toFixed(1);
  
  ui.hpVal.textContent = Math.max(0, Math.round(player.hp)) + '%';
  ui.hpBar.style.width = Math.max(0, player.hp) + '%';
  if (player.hp < 30) ui.hpBar.style.backgroundColor = COLORS.CHASE;
  else ui.hpBar.style.backgroundColor = COLORS.PLAYER;

  requestAnimationFrame(loop);
}

// Start
resize();
loop();

</script>
</body>
</html>
