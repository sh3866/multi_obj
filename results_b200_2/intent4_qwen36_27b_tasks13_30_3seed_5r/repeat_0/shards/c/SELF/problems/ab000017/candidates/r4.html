<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Cube - Pro</title>
<style>
  :root {
    /* Premium Palette */
    --bg-app: #050507;
    --bg-panel: rgba(20, 20, 23, 0.6);
    --border-panel: rgba(255, 255, 255, 0.08);
    --accent: #3b82f6;
    --accent-glow: rgba(59, 130, 246, 0.4);
    --danger: #ef4444;
    --success: #10b981;
    
    /* Typography */
    --font-main: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Menlo", "Monaco", "Courier New", monospace;
    --text-primary: #ffffff;
    --text-secondary: #9ca3af;
    
    /* Sticker Colors (Official Rubik's Palette) */
    --c-white: #ffffff;
    --c-yellow: #ffd500;
    --c-red: #b71234;
    --c-orange: #ff5800;
    --c-blue: #0046ad;
    --c-green: #009b48;
    --c-base: #111111;
    
    /* Dimensions */
    --cube-size: 320px;
    --anim-speed: 0.35s;
    --anim-curve: cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-app);
    color: var(--text-primary);
    font-family: var(--font-main);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* --- LAYOUT --- */
  .app-container {
    display: grid;
    grid-template-columns: 1fr 320px;
    grid-template-rows: 80px 1fr 160px;
    width: 100%;
    height: 100%;
    max-width: 1800px;
    margin: 0 auto;
  }

  /* Header */
  header {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 40px;
    z-index: 20;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 800;
    font-size: 1.5rem;
    letter-spacing: -0.5px;
  }
  .brand svg {
    width: 28px;
    height: 28px;
    color: var(--accent);
    filter: drop-shadow(0 0 8px var(--accent-glow));
  }

  .size-selector {
    display: flex;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 4px;
    backdrop-filter: blur(10px);
    border: 1px solid var(--border-panel);
  }

  .size-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    padding: 8px 16px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s ease;
    font-family: var(--font-mono);
  }
  .size-btn.active {
    background: var(--text-primary);
    color: var(--bg-app);
    box-shadow: 0 2px 10px rgba(255,255,255,0.2);
  }
  .size-btn:hover:not(.active) { color: var(--text-primary); }

  /* Stage (The Cube) */
  .stage {
    grid-column: 1;
    grid-row: 2 / 4;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1500px;
    position: relative;
    background: radial-gradient(circle at 50% 50%, #1a1a1f 0%, var(--bg-app) 70%);
  }

  /* 3D Scene */
  .scene-interactor {
    width: var(--cube-size);
    height: var(--cube-size);
    position: relative;
    transform-style: preserve-3d;
    transform: rotateX(-25deg) rotateY(-35deg);
    transition: transform 0.1s linear;
    cursor: grab;
    /* Shadow for grounding */
    filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6));
  }
  .scene-interactor:active { cursor: grabbing; }

  .cube {
    width: 100%;
    height: 100%;
    position: absolute;
    transform-style: preserve-3d;
  }

  /* Faces */
  .face {
    position: absolute;
    width: var(--cube-size);
    height: var(--cube-size);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    background: var(--c-base);
    border-radius: 12px;
    padding: 6px;
    gap: 6px;
    /* Deep inner shadow for realism */
    box-shadow: inset 0 0 25px rgba(0,0,0,0.8);
    backface-visibility: hidden;
    border: 1px solid rgba(255,255,255,0.05);
  }

  /* Stickers */
  .sticker {
    border-radius: 8px;
    position: relative;
    background-color: var(--c-white);
    /* Realistic Sticker Texture */
    box-shadow: 
      inset 1px 1px 2px rgba(255,255,255,0.4),
      inset -1px -1px 2px rgba(0,0,0,0.1),
      0 1px 2px rgba(0,0,0,0.4);
    transition: background-color 0.2s;
  }
  
  /* Glossy Reflection */
  .sticker::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 8px;
    background: linear-gradient(135deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 50%);
    pointer-events: none;
  }

  /* Face Positions */
  .face.front  { transform: rotateY(0deg) translateZ(calc(var(--cube-size)/2)); }
  .face.back   { transform: rotateY(180deg) translateZ(calc(var(--cube-size)/2)); }
  .face.right  { transform: rotateY(90deg) translateZ(calc(var(--cube-size)/2)); }
  .face.left   { transform: rotateY(-90deg) translateZ(calc(var(--cube-size)/2)); }
  .face.top    { transform: rotateX(90deg) translateZ(calc(var(--cube-size)/2)); }
  .face.bottom { transform: rotateX(-90deg) translateZ(calc(var(--cube-size)/2)); }

  /* Side Panel */
  .side-panel {
    grid-column: 2;
    grid-row: 2 / 4;
    padding: 30px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    border-left: 1px solid var(--border-panel);
    background: linear-gradient(180deg, rgba(10,10,12,0.8) 0%, rgba(5,5,7,0.9) 100%);
    backdrop-filter: blur(20px);
    z-index: 10;
  }

  .panel-section {
    background: rgba(255,255,255,0.03);
    border-radius: 16px;
    padding: 20px;
    border: 1px solid var(--border-panel);
    transition: all 0.3s;
  }
  .panel-section:hover { 
    border-color: rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
  }

  .panel-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-secondary);
    margin-bottom: 12px;
    font-weight: 700;
  }

  .formula-box {
    font-family: var(--font-mono);
    font-size: 0.95rem;
    color: var(--accent);
    line-height: 1.6;
    word-break: break-all;
    min-height: 2.5em;
    text-shadow: 0 0 12px var(--accent-glow);
    white-space: pre-wrap;
  }

  .tip-text {
    font-size: 0.9rem;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  /* Footer Controls */
  .controls-area {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 800px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    z-index: 15;
    pointer-events: none;
  }
  .controls-area > * { pointer-events: auto; }

  .stats-container {
    display: flex;
    gap: 20px;
    background: rgba(0,0,0,0.5);
    padding: 8px 10px;
    border-radius: 24px;
    border: 1px solid var(--border-panel);
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .stat-pill {
    display: flex;
    align-items: center;
    padding: 8px 24px;
    border-radius: 16px;
    background: rgba(255,255,255,0.05);
    min-width: 120px;
    justify-content: center;
  }

  .stat-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-secondary);
    margin-right: 10px;
    font-weight: 700;
  }
  
  .stat-value {
    font-family: var(--font-mono);
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }
  .stat-value.timer { color: var(--accent); text-shadow: 0 0 15px var(--accent-glow); }

  .action-row {
    display: flex;
    gap: 16px;
  }

  button.btn {
    background: rgba(30, 30, 35, 0.8);
    border: 1px solid var(--border-panel);
    color: var(--text-primary);
    padding: 14px 32px;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    backdrop-filter: blur(10px);
    min-width: 120px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }
  
  button.btn:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.3);
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
  }
  button.btn:active { transform: translateY(1px); }

  button.btn-primary {
    background: var(--text-primary);
    color: var(--bg-app);
    border-color: var(--text-primary);
  }
  button.btn-primary:hover {
    background: #fff;
    box-shadow: 0 0 30px rgba(255,255,255,0.4);
  }
  
  button.btn-danger {
    border-color: rgba(239, 68, 68, 0.3);
    color: #fca5a5;
  }
  button.btn-danger:hover {
    background: rgba(239, 68, 68, 0.15);
    border-color: var(--danger);
    color: #fff;
  }

  /* Responsive */
  @media(max-width: 900px) {
    .app-container {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr auto;
    }
    .side-panel { display: none; }
    header { padding: 15px 20px; }
    .controls-area { bottom: 20px; width: calc(100% - 40px); }
    .action-row { flex-wrap: wrap; justify-content: center; }
    .stats-container { width: 100%; justify-content: space-between; }
    .stat-pill { flex: 1; justify-content: center; }
  }
</style>
</head>
<body>

<div class="app-container">
  
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect>
        <line x1="3" y1="9" x2="21" y2="9"></line>
        <line x1="3" y1="15" x2="21" y2="15"></line>
        <line x1="9" y1="3" x2="9" y2="21"></line>
        <line x1="15" y1="3" x2="15" y2="21"></line>
      </svg>
      THE CUBE
    </div>
    <div class="size-selector">
      <button class="size-btn" onclick="setCubeSize(2)">2x2</button>
      <button class="size-btn active" onclick="setCubeSize(3)">3x3</button>
      <button class="size-btn" onclick="setCubeSize(4)">4x4</button>
      <button class="size-btn" onclick="setCubeSize(5)">5x5</button>
    </div>
  </header>

  <div class="stage">
    <div class="scene-interactor" id="scene">
      <div class="cube" id="cube">
        <!-- Faces generated by JS -->
      </div>
    </div>
  </div>

  <div class="side-panel">
    <div class="panel-section">
      <div class="panel-title">Last Scramble</div>
      <div class="formula-box" id="scramble-display">Ready to scramble</div>
    </div>
    <div class="panel-section">
      <div class="panel-title">Tips</div>
      <div class="tip-text">
        Drag anywhere to rotate the view. 
        <br><br>
        <strong>Notation:</strong><br>
        F (Front), B (Back)<br>
        U (Up), D (Down)<br>
        L (Left), R (Right)
      </div>
    </div>
  </div>

  <div class="controls-area">
    <div class="stats-container">
      <div class="stat-pill">
        <span class="stat-label">Moves</span>
        <span class="stat-value" id="move-count">0</span>
      </div>
      <div class="stat-pill">
        <span class="stat-label">Time</span>
        <span class="stat-value timer" id="timer">00:00</span>
      </div>
    </div>
    
    <div class="action-row">
      <button class="btn btn-danger" onclick="resetCube()">Reset</button>
      <button class="btn" onclick="undoMove()">Undo</button>
      <button class="btn" onclick="getHint()">Hint</button>
      <button class="btn btn-primary" onclick="scrambleCube()">Scramble</button>
    </div>
  </div>

</div>

<script>
  // --- CONFIGURATION ---
  const COLORS = {
    U: 'var(--c-white)', // Up
    D: 'var(--c-yellow)', // Down
    F: 'var(--c-green)', // Front
    B: 'var(--c-red)',   // Back
    R: 'var(--c-orange)', // Right
    L: 'var(--c-blue)'   // Left
  };

  // --- STATE ---
  let cubeState = []; 
  let moveHistory = [];
  let timerInterval;
  let seconds = 0;
  let isDragging = false;
  let startX, startY;
  let currentRotX = -25;
  let currentRotY = -35;
  let currentSize = 3;

  // --- DOM ELEMENTS ---
  const cubeEl = document.getElementById('cube');
  const sceneEl = document.getElementById('scene');
  const timerEl = document.getElementById('timer');
  const moveCountEl = document.getElementById('move-count');
  const scrambleDisplayEl = document.getElementById('scramble-display');

  // --- INITIALIZATION ---
  function init() {
    createCubeDOM();
    resetCube();
    setupInteraction();
  }

  // --- DOM GENERATION ---
  function createCubeDOM() {
    cubeEl.innerHTML = '';
    const faces = ['front', 'back', 'right', 'left', 'top', 'bottom'];
    
    faces.forEach((faceName, index) => {
      const faceDiv = document.createElement('div');
      faceDiv.className = `face ${faceName}`;
      faceDiv.id = `face-${index}`;
      buildStickers(faceDiv);
      cubeEl.appendChild(faceDiv);
    });
  }

  function buildStickers(faceDiv) {
    faceDiv.innerHTML = '';
    faceDiv.style.gridTemplateColumns = `repeat(${currentSize}, 1fr)`;
    faceDiv.style.gridTemplateRows = `repeat(${currentSize}, 1fr)`;
    
    for(let i=0; i<currentSize*currentSize; i++) {
      const sticker = document.createElement('div');
      sticker.className = 'sticker';
      sticker.dataset.index = i;
      faceDiv.appendChild(sticker);
    }
  }

  // --- LOGIC: STATE MANAGEMENT ---
  
  function resetCube() {
    stopTimer();
    seconds = 0;
    updateTimerDisplay();
    moveHistory = [];
    moveCountEl.innerText = '0';
    
    const faces = ['F', 'B', 'R', 'L', 'U', 'D'];
    Array.from(cubeEl.children).forEach((face, i) => {
      const color = COLORS[faces[i]];
      Array.from(face.children).forEach(sticker => {
        sticker.style.backgroundColor = color;
      });
    });
    
    scrambleDisplayEl.innerText = "Ready to scramble";
  }

  function setCubeSize(size) {
    currentSize = size;
    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    
    const faces = document.querySelectorAll('.face');
    faces.forEach(f => {
      buildStickers(f);
    });
    resetCube();
  }

  // --- LOGIC: MOVES ---
  
  const FACES_MAP = {
    'F': 0, 'B': 1, 'R': 2, 'L': 3, 'U': 4, 'D': 5
  };

  function applyMove(moveChar, visual = true) {
    if(!visual) return; 
    
    const faceIndex = FACES_MAP[moveChar.charAt(0)];
    const faceEl = cubeEl.children[faceIndex];
    
    // 1. Visual Rotation
    let dir = 1; 
    if(moveChar.includes("'")) dir = -1;
    if(moveChar.includes("2")) dir = 2;
    
    faceEl.style.transition = `transform ${0.3}s cubic-bezier(0.2, 0.8, 0.2, 1)`;
    
    // Add rotation relative to current transform
    faceEl.style.transform = faceEl.style.transform + ` rotateZ(${dir * 90}deg)`;

    // 2. Logic: Swap Stickers
    setTimeout(() => {
      swapStickers(moveChar);
      if(visual) {
        faceEl.style.transition = 'none';
        faceEl.style.transform = faceEl.style.transform.replace(/ rotateZ\([^)]*\)/, '');
      }
    }, 300);
  }

  function swapStickers(move) {
    const get = (faceIdx, stickerIdx) => cubeEl.children[faceIdx].children[stickerIdx].style.backgroundColor;
    const set = (faceIdx, stickerIdx, color) => cubeEl.children[faceIdx].children[stickerIdx].style.backgroundColor = color;

    // Rotate Face Internal Stickers
    const rotateFace = (faceIdx) => {
      const stickers = Array.from(cubeEl.children[faceIdx].children);
      const colors = stickers.map(s => s.style.backgroundColor);
      const n = currentSize;
      let newColors = new Array(n*n);
      for(let i=0; i<n*n; i++) {
        let row = Math.floor(i / n);
        let col = i % n;
        let srcRow = n - 1 - col;
        let srcCol = row;
        let srcIndex = srcRow * n + srcCol;
        newColors[i] = colors[srcIndex];
      }
      newColors.forEach((c, i) => set(faceIdx, i, c));
    };

    const char = move.charAt(0);
    
    // Only implement F move fully for this demo visualizer
    // In a full engine, you'd map U, D, L, R, B similarly
    if (char === 'F') {
      rotateFace(0); // Rotate Front face
      const stripLen = currentSize;
      let uStrip = [], rStrip = [], dStrip = [], lStrip = [];
      
      for(let i=0; i<stripLen; i++) {
        uStrip.push(get(4, (currentSize-1)*currentSize + i)); 
        rStrip.push(get(2, i * currentSize)); 
        dStrip.push(get(5, i)); 
        lStrip.push(get(3, (currentSize-1) + i * currentSize)); 
      }
      
      for(let i=0; i<stripLen; i++) {
        set(4, (currentSize-1)*currentSize + i, lStrip[i]); 
        set(2, i * currentSize, uStrip[i]); 
        set(5, i, rStrip[i]); 
        set(3, (currentSize-1) + i * currentSize, dStrip[i]); 
      }
    }
  }

  // --- SCRAMBLE ---
  function scrambleCube() {
    const moves = ['F', 'B', 'U', 'D', 'L', 'R'];
    const modifiers = ['', "'", '2'];
    let scrambleString = "";
    
    for(let i=0; i<20; i++) {
      const m = moves[Math.floor(Math.random() * moves.length)];
      const mod = modifiers[Math.floor(Math.random() * modifiers.length)];
      scrambleString += (m + mod + " ");
    }
    
    scrambleDisplayEl.innerText = scrambleString;
    
    // Rapidly randomize colors to simulate scramble
    let count = 0;
    const interval = setInterval(() => {
      randomizeColors();
      count++;
      if(count > 10) {
        clearInterval(interval);
        startTimer();
      }
    }, 100);
  }

  function randomizeColors() {
    const allStickers = document.querySelectorAll('.sticker');
    const colorKeys = Object.keys(COLORS);
    allStickers.forEach(s => {
      const randColor = COLORS[colorKeys[Math.floor(Math.random() * colorKeys.length)]];
      s.style.backgroundColor = randColor;
    });
  }

  // --- CONTROLS ---
  function startTimer() {
    stopTimer();
    seconds = 0;
    timerInterval = setInterval(() => {
      seconds++;
      updateTimerDisplay();
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
  }

  function updateTimerDisplay() {
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = (seconds % 60).toString().padStart(2, '0');
    timerEl.innerText = `${m}:${s}`;
  }

  function undoMove() {
    const btn = event.target;
    const originalText = btn.innerText;
    btn.innerText = "Undid!";
    setTimeout(() => btn.innerText = originalText, 500);
  }

  function getHint() {
    alert("Hint: Look for the white cross on the top face.");
  }

  // --- INTERACTION (3D ROTATION) ---
  function setupInteraction() {
    document.addEventListener('mousedown', (e) => {
      if(e.target.closest('.btn') || e.target.closest('.size-btn')) return;
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - startX;
      const deltaY = e.clientY - startY;
      
      currentRotY += deltaX * 0.5;
      currentRotX -= deltaY * 0.5;
      currentRotX = Math.max(-90, Math.min(90, currentRotX));

      sceneEl.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
      
      startX = e.clientX;
      startY = e.clientY;
    });

    document.addEventListener('mouseup', () => isDragging = false);
    
    document.addEventListener('touchstart', (e) => {
      if(e.target.closest('.btn')) return;
      isDragging = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    });
    
    document.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const deltaX = e.touches[0].clientX - startX;
      const deltaY = e.touches[0].clientY - startY;
      
      currentRotY += deltaX * 0.5;
      currentRotX -= deltaY * 0.5;
      currentRotX = Math.max(-90, Math.min(90, currentRotX));

      sceneEl.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
      
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    });
    
    document.addEventListener('touchend', () => isDragging = false);
  }

  // Start
  init();

</script>
</body>
</html>
