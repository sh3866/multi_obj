<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHRONO RUNNER // MK-V</title>
    <style>
        :root {
            --bg-deep: #030406;
            --bg-panel: #0a0b10;
            --accent-cyan: #00f3ff;
            --accent-purple: #bd00ff;
            --accent-rose: #ff0055;
            --text-main: #ffffff;
            --text-dim: #5c6370;
            --font-mono: 'Courier New', Courier, monospace;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-ui);
        }

        /* Ambient Background */
        .ambient-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 80px 80px;
            z-index: 0;
            pointer-events: none;
        }

        /* Vignette */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.6) 100%);
            z-index: 0;
            pointer-events: none;
        }

        /* Main Container */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1400px;
            max-height: 700px;
            background: linear-gradient(180deg, #050608 0%, #0d111a 100%);
            box-shadow: 
                0 0 0 1px rgba(255,255,255,0.05),
                0 30px 80px rgba(0,0,0,0.9);
            overflow: hidden;
            z-index: 1;
        }

        /* HUD */
        .hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 48px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
            pointer-events: none;
        }

        .hud-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .hud-right { align-items: flex-end; }

        .label {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.3em;
            color: var(--text-dim);
            font-weight: 700;
            text-transform: uppercase;
        }

        .score-container {
            display: flex;
            align-items: baseline;
            gap: 16px;
        }

        .score-val {
            font-family: var(--font-mono);
            font-size: 48px;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -2px;
            line-height: 1;
            text-shadow: 0 0 25px rgba(255,255,255,0.1);
        }

        .high-score {
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--accent-cyan);
            opacity: 0.8;
            letter-spacing: 1px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(0, 243, 255, 0.05);
        }

        /* Speedometer */
        .speed-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .speed-val {
            font-family: var(--font-mono);
            font-size: 24px;
            color: var(--accent-cyan);
            font-weight: bold;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            min-width: 60px;
            text-align: right;
        }

        .speed-track {
            width: 140px;
            height: 4px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .speed-fill {
            height: 100%;
            background: var(--accent-cyan);
            width: 10%;
            box-shadow: 0 0 10px var(--accent-cyan);
            transition: width 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Canvas */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Overlay Messages */
        .overlay-msg {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 10;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .key-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 36px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-bottom: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .msg-text {
            font-size: 11px;
            letter-spacing: 0.4em;
            color: var(--text-dim);
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Game Over */
        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 4, 6, 0.6);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .game-over-screen.active {
            opacity: 1;
            pointer-events: all;
        }

        .go-title {
            font-family: var(--font-mono);
            font-size: 64px;
            font-weight: 900;
            color: var(--accent-rose);
            text-transform: uppercase;
            letter-spacing: 8px;
            text-shadow: 0 0 40px rgba(255, 0, 85, 0.5);
            margin-bottom: 16px;
            transform: skew(-5deg);
        }

        .go-subtitle {
            font-family: var(--font-mono);
            font-size: 16px;
            color: var(--text-dim);
            margin-bottom: 48px;
            letter-spacing: 2px;
        }

        .btn-restart {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-main);
            padding: 16px 48px;
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            border-radius: 2px;
        }

        .btn-restart::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }

        .btn-restart:hover {
            background: var(--text-main);
            color: var(--bg-deep);
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
            border-color: var(--text-main);
        }

        /* Scanlines */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.15) 50%,
                rgba(0,0,0,0.15)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
        }

        /* Glitch Effect */
        @keyframes glitch-anim {
            0% { transform: translate(0) }
            20% { transform: translate(-5px, 5px) }
            40% { transform: translate(-5px, -5px) }
            60% { transform: translate(5px, 5px) }
            80% { transform: translate(5px, -5px) }
            100% { transform: translate(0) }
        }

        .glitch-active canvas {
            animation: glitch-anim 0.1s infinite;
            filter: hue-rotate(90deg) contrast(1.2) brightness(1.2);
        }
    </style>
</head>
<body>

    <div class="ambient-grid"></div>
    <div class="vignette"></div>

    <div id="game-container">
        <!-- HUD -->
        <div class="hud-layer">
            <div class="hud-group">
                <div class="label">Sequence Score</div>
                <div class="score-container">
                    <span class="score-val" id="score">00000</span>
                    <span class="high-score">HI <span id="high-score">00000</span></span>
                </div>
            </div>
            <div class="hud-group hud-right">
                <div class="label">Flow Velocity</div>
                <div class="speed-container">
                    <span class="speed-val" id="speed-val">1.0x</span>
                    <div class="speed-track">
                        <div class="speed-fill" id="speed-fill"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Instructions -->
        <div class="overlay-msg" id="instructions">
            <div class="key-badge">SP</div>
            <div class="msg-text">To Jump</div>
        </div>

        <!-- Game Over Screen -->
        <div class="game-over-screen" id="game-over">
            <div class="go-title">SYSTEM FAILURE</div>
            <div class="go-subtitle">DATA CORRUPTED // SCORE: <span id="final-score">0</span></div>
            <button class="btn-restart" id="restart-btn">Reboot System</button>
        </div>

        <!-- Scanlines -->
        <div class="scanlines"></div>
    </div>

<script>
    /**
     * CONFIGURATION & ASSETS
     */
    const COLORS = {
        bg: '#030406',
        player: '#ffffff',
        playerGlow: '#00f3ff',
        obstacle: '#ff0055', 
        obstacleGlow: '#ff0055',
        ground: '#1a1e29',
        grid: 'rgba(255, 255, 255, 0.04)',
        bgLayer1: '#0d0f16',
        bgLayer2: '#141824'
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const speedValEl = document.getElementById('speed-val');
    const speedFillEl = document.getElementById('speed-fill');
    const gameOverScreen = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');
    const instructionsEl = document.getElementById('instructions');
    const containerEl = document.getElementById('game-container');
    const restartBtn = document.getElementById('restart-btn');

    // Game State
    let animationFrameId;
    let gameSpeed = 9;
    let score = 0;
    let highScore = 0;
    let frame = 0;
    let isGameOver = false;
    let isPlaying = false;

    // Physics
    const GRAVITY = 0.7;
    const JUMP_FORCE = -14.5;
    const GROUND_OFFSET = 90; // Distance from bottom

    /**
     * ENTITIES
     */

    class Player {
        constructor() {
            this.width = 44;
            this.height = 44;
            this.x = 80;
            this.y = canvas.height - GROUND_OFFSET - this.height;
            this.dy = 0;
            this.originalY = canvas.height - GROUND_OFFSET - this.height;
            this.isGrounded = true;
            this.runFrame = 0;
            this.rotation = 0;
        }

        jump() {
            if (this.isGrounded) {
                this.dy = JUMP_FORCE;
                this.isGrounded = false;
                createParticles(this.x + this.width/2, this.y + this.height, 12, '#fff');
            }
        }

        update() {
            this.dy += GRAVITY;
            this.y += this.dy;

            // Ground Collision
            if (this.y + this.height > canvas.height - GROUND_OFFSET) {
                this.y = canvas.height - GROUND_OFFSET - this.height;
                this.dy = 0;
                this.isGrounded = true;
                this.rotation = 0;
            } else {
                this.isGrounded = false;
                // Slight rotation on jump for dynamic feel
                this.rotation = Math.min(this.rotation + 0.04, 0.2);
            }

            if (this.isGrounded) {
                this.runFrame += 0.3;
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x + this.width/2, this.y + this.height/2);
            ctx.rotate(this.rotation);
            
            // Glow
            ctx.shadowColor = COLORS.playerGlow;
            ctx.shadowBlur = 25;
            ctx.fillStyle = COLORS.player;

            // Geometric Dino Body (Cleaner Silhouette)
            ctx.beginPath();
            ctx.roundRect(-14, -10, 28, 24, 6);
            ctx.fill();

            // Head
            ctx.beginPath();
            ctx.roundRect(8, -22, 26, 18, 6);
            ctx.fill();

            // Eye (Visor style)
            ctx.fillStyle = COLORS.bg;
            ctx.shadowBlur = 0;
            ctx.fillRect(20, -17, 8, 6);

            // Tail (Sharp)
            ctx.fillStyle = COLORS.player;
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.moveTo(-14, -6);
            ctx.lineTo(-28, -10);
            ctx.lineTo(-14, 6);
            ctx.fill();

            // Legs (Animated)
            ctx.strokeStyle = COLORS.player;
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            
            const legOffset = Math.sin(this.runFrame) * 10;
            
            // Back Leg
            ctx.beginPath();
            ctx.moveTo(-8, 12);
            ctx.lineTo(-8 - legOffset, 22);
            ctx.stroke();

            // Front Leg
            ctx.beginPath();
            ctx.moveTo(8, 12);
            ctx.lineTo(8 + legOffset, 22);
            ctx.stroke();

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type;
            this.markedForDeletion = false;
            
            if (type === 'cactus') {
                this.width = 28;
                this.height = 50 + Math.random() * 25;
                this.x = canvas.width + 50;
                this.y = canvas.height - GROUND_OFFSET - this.height;
            } else {
                // Bird
                this.width = 44;
                this.height = 32;
                this.x = canvas.width + 50;
                const heights = [50, 95, 140]; 
                this.y = canvas.height - GROUND_OFFSET - heights[Math.floor(Math.random() * heights.length)];
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= gameSpeed;
            if (this.x + this.width < -50) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.15;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            if (this.type === 'cactus') {
                ctx.shadowColor = COLORS.obstacleGlow;
                ctx.shadowBlur = 20;
                ctx.fillStyle = COLORS.obstacle;
                
                // Cyber Cactus (Tapered)
                ctx.beginPath();
                ctx.roundRect(0, 0, this.width, this.height, 8);
                ctx.fill();
                
                // Inner Detail
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(8, 8, 6, this.height - 16);

            } else {
                // Cyber Bird
                ctx.shadowColor = COLORS.playerGlow; 
                ctx.shadowBlur = 20;
                ctx.fillStyle = COLORS.player; 

                // Body (Pill shape)
                ctx.beginPath();
                ctx.ellipse(22, 16, 20, 12, 0, 0, Math.PI * 2);
                ctx.fill();

                // Wings
                const wingY = Math.sin(this.wingFrame) * 16;
                ctx.beginPath();
                ctx.moveTo(22, 14);
                ctx.lineTo(14, 0 + wingY);
                ctx.lineTo(30, 14);
                ctx.fill();
                
                // Beak
                ctx.beginPath();
                ctx.moveTo(42, 16);
                ctx.lineTo(54, 20);
                ctx.lineTo(42, 20);
                ctx.fill();
            }
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 4 + 1;
            this.speedX = Math.random() * 6 - 3;
            this.speedY = Math.random() * 6 - 3;
            this.color = color;
            this.life = 1.0;
        }
        update() {
            this.x -= gameSpeed * 0.5; 
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.025;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 0;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    class BackgroundLayer {
        constructor(speedMod, yOffset, height, color) {
            this.speedMod = speedMod;
            this.yOffset = yOffset; 
            this.height = height;
            this.x = 0;
            this.width = 140;
            this.color = color;
            this.points = [];
            
            // Generate terrain
            for(let i=0; i < 30; i++) {
                this.points.push(Math.random() * height);
            }
        }

        update() {
            this.x -= gameSpeed * this.speedMod;
            if (this.x <= -this.width) {
                this.x += this.width;
                this.points.shift();
                this.points.push(Math.random() * this.height);
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            let startX = this.x % this.width;
            
            for (let i = 0; i < this.points.length + 2; i++) {
                let px = startX + (i * this.width);
                let py = canvas.height - GROUND_OFFSET - this.yOffset - (this.points[i] || 0);
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            
            ctx.lineTo(canvas.width + 200, canvas.height);
            ctx.lineTo(-200, canvas.height);
            ctx.closePath();
            ctx.fill();
        }
    }

    /**
     * SYSTEM LOGIC
     */
    let player;
    let obstacles = [];
    let particles = [];
    let bgLayers = [];
    let spawnTimer = 0;
    let spawnInterval = 90;

    function init() {
        resize();
        player = new Player();
        // Parallax layers
        bgLayers = [
            new BackgroundLayer(0.05, 220, 120, COLORS.bgLayer1), // Far mountains
            new BackgroundLayer(0.2, 120, 60, COLORS.bgLayer2)   // Mid hills
        ];
        loop();
    }

    function createParticles(x, y, count, color) {
        for (let i = 0; i < count; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    function spawnObstacle() {
        spawnTimer--;
        if (spawnTimer <= 0) {
            const type = Math.random() > 0.75 ? 'bird' : 'cactus';
            obstacles.push(new Obstacle(type));
            spawnTimer = spawnInterval + Math.random() * 60;
            
            if (spawnInterval > 55) spawnInterval -= 0.2;
            gameSpeed += 0.004;
        }
    }

    function checkCollisions() {
        for (let obs of obstacles) {
            const pPad = 10; 
            const oPad = 8;

            if (
                player.x + pPad < obs.x + obs.width - oPad &&
                player.x + player.width - pPad > obs.x + oPad &&
                player.y + pPad < obs.y + obs.height - oPad &&
                player.y + player.height - pPad > obs.y + oPad
            ) {
                gameOver();
            }
        }
    }

    function gameOver() {
        isGameOver = true;
        isPlaying = false;
        containerEl.classList.add('glitch-active');
        gameOverScreen.classList.add('active');
        finalScoreEl.innerText = Math.floor(score);
        instructionsEl.style.opacity = '0';
        
        if (score > highScore) {
            highScore = Math.floor(score);
            highScoreEl.innerText = highScore.toString().padStart(5, '0');
        }
    }

    function resetGame() {
        isGameOver = false;
        player = new Player();
        obstacles = [];
        particles = [];
        score = 0;
        gameSpeed = 9;
        spawnInterval = 90;
        spawnTimer = 0;
        containerEl.classList.remove('glitch-active');
        gameOverScreen.classList.remove('active');
        isPlaying = true;
        instructionsEl.style.opacity = '0';
    }

    function update() {
        if (!isPlaying) return;

        frame++;
        score += 0.15; 
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
        
        let speedMultiplier = (gameSpeed / 9).toFixed(1);
        speedValEl.innerText = speedMultiplier + 'x';
        let fillPercent = Math.min((gameSpeed - 9) / 12 * 100, 100);
        speedFillEl.style.width = Math.max(fillPercent, 5) + '%';

        player.update();
        bgLayers.forEach(layer => layer.update());

        spawnObstacle();
        obstacles.forEach((obs, index) => {
            obs.update();
            if (obs.markedForDeletion) obstacles.splice(index, 1);
        });

        particles.forEach((p, index) => {
            p.update();
            if (p.life <= 0) particles.splice(index, 1);
        });

        checkCollisions();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        bgLayers.forEach(layer => layer.draw());

        // Ground Line (Cleaner)
        ctx.strokeStyle = COLORS.grid;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height - GROUND_OFFSET);
        ctx.lineTo(canvas.width, canvas.height - GROUND_OFFSET);
        ctx.stroke();

        player.draw();
        obstacles.forEach(obs => obs.draw());
        particles.forEach(p => p.draw());
    }

    function loop() {
        update();
        draw();
        animationFrameId = requestAnimationFrame(loop);
    }

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        const rect = containerEl.getBoundingClientRect();
        
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        
        ctx.scale(dpr, dpr);
        
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';

        if(player) player.originalY = canvas.height / dpr - GROUND_OFFSET - player.height;
    }

    // Input Handling
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            if (isGameOver) {
                resetGame();
            } else if (!isPlaying) {
                isPlaying = true;
                instructionsEl.style.opacity = '0';
            } else {
                player.jump();
            }
        }
    });

    restartBtn.addEventListener('click', resetGame);

    window.addEventListener('resize', resize);
    
    window.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (isGameOver) {
            resetGame();
        } else if (!isPlaying) {
            isPlaying = true;
            instructionsEl.style.opacity = '0';
        } else {
            player.jump();
        }
    }, {passive: false});

    // Start
    init();

</script>
</body>
</html>
