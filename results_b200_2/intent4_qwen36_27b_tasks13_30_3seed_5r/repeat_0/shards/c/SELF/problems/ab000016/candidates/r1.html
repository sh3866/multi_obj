<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEO-RUNNER // OFFLINE</title>
    <style>
        :root {
            --bg-deep: #090a0f;
            --bg-panel: #11131a;
            --grid-line: rgba(255, 255, 255, 0.03);
            --accent-cyan: #00f3ff;
            --accent-pink: #ff0055;
            --accent-yellow: #ffcc00;
            --text-main: #eef2f6;
            --text-dim: #5c667a;
            --font-mono: 'Courier New', Courier, monospace;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-ui);
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient Background Grid */
        .ambient-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
        }

        /* Game Container */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1000px;
            max-height: 500px;
            background: radial-gradient(circle at 50% 100%, #1a1e29 0%, var(--bg-deep) 70%);
            box-shadow: 
                0 0 0 1px rgba(255,255,255,0.05),
                0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            z-index: 1;
        }

        /* HUD Layer */
        .hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        .hud-left, .hud-right {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .hud-right {
            align-items: flex-end;
        }

        .label {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 3px;
            color: var(--text-dim);
            text-transform: uppercase;
            font-weight: 700;
        }

        .score-box {
            display: flex;
            align-items: baseline;
            gap: 15px;
        }

        .score-val {
            font-family: var(--font-mono);
            font-size: 32px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -1px;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        .score-high {
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--accent-cyan);
            opacity: 0.8;
        }

        /* Speedometer */
        .speed-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .speed-val {
            font-family: var(--font-mono);
            font-size: 18px;
            color: var(--accent-cyan);
            font-weight: bold;
        }

        .speed-track {
            width: 100px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .speed-fill {
            height: 100%;
            background: var(--accent-cyan);
            width: 20%;
            box-shadow: 0 0 10px var(--accent-cyan);
            transition: width 0.1s linear;
        }

        /* Canvas */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Overlay Instructions */
        .overlay-msg {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .key-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 4px;
            backdrop-filter: blur(4px);
        }

        .key-icon {
            width: 24px;
            height: 24px;
            border: 1px solid var(--text-main);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            font-family: var(--font-mono);
            box-shadow: 0 2px 0 rgba(0,0,0,0.5);
        }

        .msg-text {
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        /* Game Over State */
        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 10, 15, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .game-over-screen.active {
            opacity: 1;
            pointer-events: all;
        }

        .go-title {
            font-family: var(--font-mono);
            font-size: 48px;
            font-weight: 900;
            color: var(--accent-pink);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 30px rgba(255, 0, 85, 0.4);
            margin-bottom: 10px;
            transform: skew(-5deg);
        }

        .go-score {
            font-family: var(--font-mono);
            font-size: 18px;
            color: var(--text-main);
            margin-bottom: 40px;
        }

        .btn-restart {
            background: transparent;
            border: 1px solid var(--text-main);
            color: var(--text-main);
            padding: 12px 30px;
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-restart:hover {
            background: var(--text-main);
            color: var(--bg-deep);
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        /* Scanline Effect */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.05) 50%,
                rgba(0,0,0,0.05)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
        }

        /* Glitch Animation */
        @keyframes glitch-anim {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }

        .glitch-active canvas {
            animation: glitch-anim 0.15s infinite;
            filter: hue-rotate(90deg);
        }

    </style>
</head>
<body>

    <div class="ambient-bg"></div>

    <div id="game-container">
        <!-- HUD -->
        <div class="hud-layer">
            <div class="hud-left">
                <div class="label">System Score</div>
                <div class="score-box">
                    <span class="score-val" id="score">00000</span>
                    <span class="score-high">HI <span id="high-score">00000</span></span>
                </div>
            </div>
            <div class="hud-right">
                <div class="label">Velocity</div>
                <div class="speed-container">
                    <span class="speed-val" id="speed-val">1.0x</span>
                    <div class="speed-track">
                        <div class="speed-fill" id="speed-fill"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Instructions -->
        <div class="overlay-msg" id="instructions">
            <div class="key-badge">
                <div class="key-icon">SP</div>
            </div>
            <div class="msg-text">To Jump</div>
        </div>

        <!-- Game Over Screen -->
        <div class="game-over-screen" id="game-over">
            <div class="go-title">CRITICAL ERROR</div>
            <div class="go-score">DATA LOST: <span id="final-score">0</span></div>
            <button class="btn-restart" id="restart-btn">Reboot System</button>
        </div>

        <!-- Scanlines -->
        <div class="scanlines"></div>
    </div>

<script>
    /**
     * CONFIGURATION & ASSETS
     */
    const COLORS = {
        bg: '#090a0f', // Matches CSS var
        player: '#ffffff',
        playerGlow: '#00f3ff',
        obstacle: '#ff0055', // Neon Pink
        obstacleGlow: '#ff0055',
        ground: '#1a1e29',
        grid: 'rgba(255, 255, 255, 0.05)'
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const speedValEl = document.getElementById('speed-val');
    const speedFillEl = document.getElementById('speed-fill');
    const gameOverScreen = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');
    const instructionsEl = document.getElementById('instructions');
    const containerEl = document.getElementById('game-container');
    const restartBtn = document.getElementById('restart-btn');

    // Game State
    let animationFrameId;
    let gameSpeed = 6;
    let score = 0;
    let highScore = 0;
    let frame = 0;
    let isGameOver = false;
    let isPlaying = false;

    // Physics
    const GRAVITY = 0.6;
    const JUMP_FORCE = -11;
    const GROUND_OFFSET = 80; // Distance from bottom

    /**
     * ENTITIES
     */

    class Player {
        constructor() {
            this.width = 34;
            this.height = 34;
            this.x = 60;
            this.y = canvas.height - GROUND_OFFSET - this.height;
            this.dy = 0;
            this.originalY = canvas.height - GROUND_OFFSET - this.height;
            this.isGrounded = true;
            this.runFrame = 0;
            this.rotation = 0;
        }

        jump() {
            if (this.isGrounded) {
                this.dy = JUMP_FORCE;
                this.isGrounded = false;
                createParticles(this.x + this.width/2, this.y + this.height, 8, '#fff');
            }
        }

        update() {
            this.dy += GRAVITY;
            this.y += this.dy;

            // Ground Collision
            if (this.y + this.height > canvas.height - GROUND_OFFSET) {
                this.y = canvas.height - GROUND_OFFSET - this.height;
                this.dy = 0;
                this.isGrounded = true;
                this.rotation = 0;
            } else {
                this.isGrounded = false;
                // Rotate slightly when jumping
                this.rotation = Math.min(this.rotation + 0.05, 0.2);
            }

            // Animation
            if (this.isGrounded) {
                this.runFrame += 0.25;
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x + this.width/2, this.y + this.height/2);
            ctx.rotate(this.rotation);
            
            // Glow
            ctx.shadowColor = COLORS.playerGlow;
            ctx.shadowBlur = 15;
            ctx.fillStyle = COLORS.player;

            // Geometric Dino Shape
            // Body
            ctx.beginPath();
            ctx.roundRect(-10, -10, 20, 20, 3);
            ctx.fill();

            // Head
            ctx.beginPath();
            ctx.roundRect(5, -18, 18, 14, 3);
            ctx.fill();

            // Eye (Cutout effect)
            ctx.fillStyle = COLORS.bg;
            ctx.shadowBlur = 0;
            ctx.fillRect(16, -14, 4, 4);

            // Tail
            ctx.fillStyle = COLORS.player;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(-10, -5);
            ctx.lineTo(-22, -8);
            ctx.lineTo(-10, 2);
            ctx.fill();

            // Legs
            ctx.strokeStyle = COLORS.player;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            
            const legOffset = Math.sin(this.runFrame) * 6;
            
            // Back Leg
            ctx.beginPath();
            ctx.moveTo(-5, 10);
            ctx.lineTo(-5 - legOffset, 17);
            ctx.stroke();

            // Front Leg
            ctx.beginPath();
            ctx.moveTo(5, 10);
            ctx.lineTo(5 + legOffset, 17);
            ctx.stroke();

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type;
            this.markedForDeletion = false;
            
            if (type === 'cactus') {
                this.width = 20;
                this.height = 40 + Math.random() * 15;
                this.x = canvas.width + 50;
                this.y = canvas.height - GROUND_OFFSET - this.height;
            } else {
                // Bird
                this.width = 36;
                this.height = 24;
                this.x = canvas.width + 50;
                // Heights: Low (jumpable), Mid (duck/jump), High
                const heights = [30, 75, 110]; 
                this.y = canvas.height - GROUND_OFFSET - heights[Math.floor(Math.random() * heights.length)];
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= gameSpeed;
            if (this.x + this.width < -50) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.15;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            if (this.type === 'cactus') {
                ctx.shadowColor = COLORS.obstacleGlow;
                ctx.shadowBlur = 12;
                ctx.fillStyle = COLORS.obstacle;
                
                // Cyber Cactus Shape
                ctx.beginPath();
                ctx.roundRect(0, 0, this.width, this.height, 4);
                ctx.fill();
                
                // Inner detail
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(4, 4, 4, this.height - 8);

            } else {
                // Cyber Bird
                ctx.shadowColor = COLORS.playerGlow; // Birds are tech
                ctx.shadowBlur = 10;
                ctx.fillStyle = COLORS.player; // White/Silver birds

                // Body
                ctx.beginPath();
                ctx.ellipse(18, 12, 16, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                // Wings
                const wingY = Math.sin(this.wingFrame) * 12;
                ctx.beginPath();
                ctx.moveTo(18, 10);
                ctx.lineTo(10, 0 + wingY);
                ctx.lineTo(26, 10);
                ctx.fill();
                
                // Beak
                ctx.beginPath();
                ctx.moveTo(34, 12);
                ctx.lineTo(42, 15);
                ctx.lineTo(34, 16);
                ctx.fill();
            }
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 3 + 1;
            this.speedX = Math.random() * 4 - 2;
            this.speedY = Math.random() * 4 - 2;
            this.color = color;
            this.life = 1.0;
        }
        update() {
            this.x -= gameSpeed * 0.5; // Drift with world
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.03;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 0;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    class BackgroundLayer {
        constructor(speedMod, yOffset, height) {
            this.speedMod = speedMod;
            this.yOffset = yOffset; // Distance from ground
            this.height = height;
            this.x = 0;
            this.width = 100;
            this.points = [];
            
            // Generate terrain
            for(let i=0; i < 20; i++) {
                this.points.push(Math.random() * height);
            }
        }

        update() {
            this.x -= gameSpeed * this.speedMod;
            if (this.x <= -this.width) {
                this.x += this.width;
                this.points.shift();
                this.points.push(Math.random() * this.height);
            }
        }

        draw() {
            ctx.fillStyle = '#151822';
            ctx.beginPath();
            let startX = this.x % this.width;
            
            // Draw jagged horizon
            for (let i = 0; i < this.points.length + 2; i++) {
                let px = startX + (i * this.width);
                let py = canvas.height - GROUND_OFFSET - this.yOffset - (this.points[i] || 0);
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            
            // Close shape to bottom
            ctx.lineTo(canvas.width + 200, canvas.height);
            ctx.lineTo(-200, canvas.height);
            ctx.closePath();
            ctx.fill();
        }
    }

    /**
     * SYSTEM LOGIC
     */
    let player;
    let obstacles = [];
    let particles = [];
    let bgLayers = [];
    let spawnTimer = 0;
    let spawnInterval = 90;

    function init() {
        resize();
        player = new Player();
        // Parallax layers
        bgLayers = [
            new BackgroundLayer(0.1, 150, 80), // Far mountains
            new BackgroundLayer(0.3, 80, 40)   // Mid hills
        ];
        loop();
    }

    function createParticles(x, y, count, color) {
        for (let i = 0; i < count; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    function spawnObstacle() {
        spawnTimer--;
        if (spawnTimer <= 0) {
            const type = Math.random() > 0.7 ? 'bird' : 'cactus';
            obstacles.push(new Obstacle(type));
            spawnTimer = spawnInterval + Math.random() * 60;
            
            // Difficulty scaling
            if (spawnInterval > 50) spawnInterval -= 0.2;
            gameSpeed += 0.002;
        }
    }

    function checkCollisions() {
        for (let obs of obstacles) {
            // Hitbox padding for forgiveness
            const pPad = 6; 
            const oPad = 4;

            if (
                player.x + pPad < obs.x + obs.width - oPad &&
                player.x + player.width - pPad > obs.x + oPad &&
                player.y + pPad < obs.y + obs.height - oPad &&
                player.y + player.height - pPad > obs.y + oPad
            ) {
                gameOver();
            }
        }
    }

    function gameOver() {
        isGameOver = true;
        isPlaying = false;
        containerEl.classList.add('glitch-active');
        gameOverScreen.classList.add('active');
        finalScoreEl.innerText = Math.floor(score);
        instructionsEl.style.opacity = '0';
        
        if (score > highScore) {
            highScore = Math.floor(score);
            highScoreEl.innerText = highScore.toString().padStart(5, '0');
        }
    }

    function resetGame() {
        isGameOver = false;
        player = new Player();
        obstacles = [];
        particles = [];
        score = 0;
        gameSpeed = 6;
        spawnInterval = 90;
        spawnTimer = 0;
        containerEl.classList.remove('glitch-active');
        gameOverScreen.classList.remove('active');
        isPlaying = true;
        instructionsEl.style.opacity = '0';
    }

    function update() {
        if (!isPlaying) return;

        frame++;
        score += 0.05; // Score accumulation
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
        
        // HUD Updates
        let speedMultiplier = (gameSpeed / 6).toFixed(1);
        speedValEl.innerText = speedMultiplier + 'x';
        let fillPercent = Math.min((gameSpeed - 6) / 8 * 100, 100);
        speedFillEl.style.width = Math.max(fillPercent, 5) + '%';

        player.update();
        bgLayers.forEach(layer => layer.update());

        spawnObstacle();
        obstacles.forEach((obs, index) => {
            obs.update();
            if (obs.markedForDeletion) obstacles.splice(index, 1);
        });

        particles.forEach((p, index) => {
            p.update();
            if (p.life <= 0) particles.splice(index, 1);
        });

        checkCollisions();
    }

    function draw() {
        // Clear background (CSS handles the deep bg, canvas handles the scene)
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Backgrounds
        bgLayers.forEach(layer => layer.draw());

        // Draw Ground Line
        ctx.strokeStyle = COLORS.grid;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height - GROUND_OFFSET);
        ctx.lineTo(canvas.width, canvas.height - GROUND_OFFSET);
        ctx.stroke();

        // Draw Entities
        player.draw();
        obstacles.forEach(obs => obs.draw());
        particles.forEach(p => p.draw());
    }

    function loop() {
        update();
        draw();
        animationFrameId = requestAnimationFrame(loop);
    }

    function resize() {
        // Handle high DPI displays
        const dpr = window.devicePixelRatio || 1;
        const rect = containerEl.getBoundingClientRect();
        
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        
        ctx.scale(dpr, dpr);
        
        // CSS size
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';

        // Re-calculate ground position relative to new height
        if(player) player.originalY = canvas.height / dpr - GROUND_OFFSET - player.height;
    }

    // Input Handling
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            if (isGameOver) {
                resetGame();
            } else if (!isPlaying) {
                isPlaying = true;
                instructionsEl.style.opacity = '0';
            } else {
                player.jump();
            }
        }
    });

    restartBtn.addEventListener('click', resetGame);

    window.addEventListener('resize', resize);
    
    // Touch support
    window.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (isGameOver) {
            resetGame();
        } else if (!isPlaying) {
            isPlaying = true;
            instructionsEl.style.opacity = '0';
        } else {
            player.jump();
        }
    }, {passive: false});

    // Start
    init();

</script>
</body>
</html>
