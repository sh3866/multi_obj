<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEO-RUNNER // MK-IV</title>
    <style>
        :root {
            --bg-deep: #050508;
            --bg-panel: #0f1015;
            --accent-cyan: #00f0ff;
            --accent-magenta: #ff0055;
            --accent-yellow: #ffcc00;
            --text-main: #ffffff;
            --text-dim: #6b7280;
            --font-display: 'Courier New', Courier, monospace;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-ui);
        }

        /* Background Texture */
        .ambient-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
            pointer-events: none;
        }

        /* Main Container */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 600px;
            background: radial-gradient(circle at 50% 120%, #161822 0%, var(--bg-deep) 60%);
            box-shadow: 
                0 0 0 1px rgba(255,255,255,0.08),
                0 20px 60px rgba(0,0,0,0.8);
            overflow: hidden;
            z-index: 1;
        }

        /* HUD */
        .hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
            pointer-events: none;
        }

        .hud-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hud-right { align-items: flex-end; }

        .label {
            font-family: var(--font-display);
            font-size: 11px;
            letter-spacing: 0.2em;
            color: var(--text-dim);
            font-weight: 700;
        }

        .score-container {
            display: flex;
            align-items: baseline;
            gap: 20px;
        }

        .score-val {
            font-family: var(--font-display);
            font-size: 42px;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -2px;
            line-height: 1;
            text-shadow: 0 0 20px rgba(255,255,255,0.15);
        }

        .high-score {
            font-family: var(--font-display);
            font-size: 14px;
            color: var(--accent-cyan);
            opacity: 0.9;
            letter-spacing: 1px;
        }

        /* Speedometer */
        .speed-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .speed-val {
            font-family: var(--font-display);
            font-size: 20px;
            color: var(--accent-cyan);
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        .speed-track {
            width: 120px;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .speed-fill {
            height: 100%;
            background: var(--accent-cyan);
            width: 10%;
            box-shadow: 0 0 15px var(--accent-cyan);
            transition: width 0.1s linear;
        }

        /* Canvas */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Overlay Messages */
        .overlay-msg {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            z-index: 10;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .key-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 32px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: var(--text-main);
            font-family: var(--font-display);
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .msg-text {
            font-size: 12px;
            letter-spacing: 0.15em;
            color: var(--text-dim);
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Game Over */
        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 8, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .game-over-screen.active {
            opacity: 1;
            pointer-events: all;
        }

        .go-title {
            font-family: var(--font-display);
            font-size: 56px;
            font-weight: 900;
            color: var(--accent-magenta);
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 0 0 40px rgba(255, 0, 85, 0.6);
            margin-bottom: 10px;
            transform: skew(-5deg);
        }

        .go-subtitle {
            font-family: var(--font-display);
            font-size: 16px;
            color: var(--text-dim);
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .btn-restart {
            background: transparent;
            border: 1px solid var(--text-main);
            color: var(--text-main);
            padding: 14px 40px;
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .btn-restart:hover {
            background: var(--text-main);
            color: var(--bg-deep);
            box-shadow: 0 0 30px rgba(255,255,255,0.3);
        }

        /* CRT Scanlines */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
        }

        /* Glitch Effect */
        @keyframes glitch-anim {
            0% { transform: translate(0) }
            20% { transform: translate(-3px, 3px) }
            40% { transform: translate(-3px, -3px) }
            60% { transform: translate(3px, 3px) }
            80% { transform: translate(3px, -3px) }
            100% { transform: translate(0) }
        }

        .glitch-active canvas {
            animation: glitch-anim 0.1s infinite;
            filter: hue-rotate(90deg) contrast(1.2);
        }
    </style>
</head>
<body>

    <div class="ambient-grid"></div>

    <div id="game-container">
        <!-- HUD -->
        <div class="hud-layer">
            <div class="hud-group">
                <div class="label">SYSTEM SCORE</div>
                <div class="score-container">
                    <span class="score-val" id="score">00000</span>
                    <span class="high-score">HI <span id="high-score">00000</span></span>
                </div>
            </div>
            <div class="hud-group hud-right">
                <div class="label">VELOCITY</div>
                <div class="speed-container">
                    <span class="speed-val" id="speed-val">1.0x</span>
                    <div class="speed-track">
                        <div class="speed-fill" id="speed-fill"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Instructions -->
        <div class="overlay-msg" id="instructions">
            <div class="key-badge">SP</div>
            <div class="msg-text">To Jump</div>
        </div>

        <!-- Game Over Screen -->
        <div class="game-over-screen" id="game-over">
            <div class="go-title">CRITICAL ERROR</div>
            <div class="go-subtitle">DATA CORRUPTED // SCORE: <span id="final-score">0</span></div>
            <button class="btn-restart" id="restart-btn">Reboot System</button>
        </div>

        <!-- Scanlines -->
        <div class="scanlines"></div>
    </div>

<script>
    /**
     * CONFIGURATION & ASSETS
     */
    const COLORS = {
        bg: '#050508',
        player: '#ffffff',
        playerGlow: '#00f0ff',
        obstacle: '#ff0055', 
        obstacleGlow: '#ff0055',
        ground: '#1a1e29',
        grid: 'rgba(255, 255, 255, 0.05)',
        bgLayer1: '#0f1015',
        bgLayer2: '#14161e'
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const speedValEl = document.getElementById('speed-val');
    const speedFillEl = document.getElementById('speed-fill');
    const gameOverScreen = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');
    const instructionsEl = document.getElementById('instructions');
    const containerEl = document.getElementById('game-container');
    const restartBtn = document.getElementById('restart-btn');

    // Game State
    let animationFrameId;
    let gameSpeed = 8;
    let score = 0;
    let highScore = 0;
    let frame = 0;
    let isGameOver = false;
    let isPlaying = false;

    // Physics
    const GRAVITY = 0.65;
    const JUMP_FORCE = -13;
    const GROUND_OFFSET = 90; // Distance from bottom

    /**
     * ENTITIES
     */

    class Player {
        constructor() {
            this.width = 40;
            this.height = 40;
            this.x = 80;
            this.y = canvas.height - GROUND_OFFSET - this.height;
            this.dy = 0;
            this.originalY = canvas.height - GROUND_OFFSET - this.height;
            this.isGrounded = true;
            this.runFrame = 0;
            this.rotation = 0;
        }

        jump() {
            if (this.isGrounded) {
                this.dy = JUMP_FORCE;
                this.isGrounded = false;
                createParticles(this.x + this.width/2, this.y + this.height, 10, '#fff');
            }
        }

        update() {
            this.dy += GRAVITY;
            this.y += this.dy;

            // Ground Collision
            if (this.y + this.height > canvas.height - GROUND_OFFSET) {
                this.y = canvas.height - GROUND_OFFSET - this.height;
                this.dy = 0;
                this.isGrounded = true;
                this.rotation = 0;
            } else {
                this.isGrounded = false;
                this.rotation = Math.min(this.rotation + 0.04, 0.15);
            }

            if (this.isGrounded) {
                this.runFrame += 0.25;
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x + this.width/2, this.y + this.height/2);
            ctx.rotate(this.rotation);
            
            // Glow
            ctx.shadowColor = COLORS.playerGlow;
            ctx.shadowBlur = 20;
            ctx.fillStyle = COLORS.player;

            // Geometric Dino Body
            ctx.beginPath();
            ctx.roundRect(-12, -12, 24, 24, 4);
            ctx.fill();

            // Head
            ctx.beginPath();
            ctx.roundRect(6, -20, 22, 16, 4);
            ctx.fill();

            // Eye
            ctx.fillStyle = COLORS.bg;
            ctx.shadowBlur = 0;
            ctx.fillRect(18, -16, 5, 5);

            // Tail
            ctx.fillStyle = COLORS.player;
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.moveTo(-12, -8);
            ctx.lineTo(-26, -12);
            ctx.lineTo(-12, 4);
            ctx.fill();

            // Legs
            ctx.strokeStyle = COLORS.player;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            
            const legOffset = Math.sin(this.runFrame) * 8;
            
            // Back Leg
            ctx.beginPath();
            ctx.moveTo(-6, 12);
            ctx.lineTo(-6 - legOffset, 20);
            ctx.stroke();

            // Front Leg
            ctx.beginPath();
            ctx.moveTo(6, 12);
            ctx.lineTo(6 + legOffset, 20);
            ctx.stroke();

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type;
            this.markedForDeletion = false;
            
            if (type === 'cactus') {
                this.width = 24;
                this.height = 45 + Math.random() * 20;
                this.x = canvas.width + 50;
                this.y = canvas.height - GROUND_OFFSET - this.height;
            } else {
                // Bird
                this.width = 40;
                this.height = 28;
                this.x = canvas.width + 50;
                const heights = [40, 85, 130]; 
                this.y = canvas.height - GROUND_OFFSET - heights[Math.floor(Math.random() * heights.length)];
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= gameSpeed;
            if (this.x + this.width < -50) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.15;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            if (this.type === 'cactus') {
                ctx.shadowColor = COLORS.obstacleGlow;
                ctx.shadowBlur = 15;
                ctx.fillStyle = COLORS.obstacle;
                
                // Cyber Cactus
                ctx.beginPath();
                ctx.roundRect(0, 0, this.width, this.height, 6);
                ctx.fill();
                
                // Detail
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(6, 6, 5, this.height - 12);

            } else {
                // Cyber Bird
                ctx.shadowColor = COLORS.playerGlow; 
                ctx.shadowBlur = 15;
                ctx.fillStyle = COLORS.player; 

                // Body
                ctx.beginPath();
                ctx.ellipse(20, 14, 18, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                // Wings
                const wingY = Math.sin(this.wingFrame) * 14;
                ctx.beginPath();
                ctx.moveTo(20, 12);
                ctx.lineTo(12, 0 + wingY);
                ctx.lineTo(28, 12);
                ctx.fill();
                
                // Beak
                ctx.beginPath();
                ctx.moveTo(38, 14);
                ctx.lineTo(48, 18);
                ctx.lineTo(38, 18);
                ctx.fill();
            }
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 3 + 1;
            this.speedX = Math.random() * 6 - 3;
            this.speedY = Math.random() * 6 - 3;
            this.color = color;
            this.life = 1.0;
        }
        update() {
            this.x -= gameSpeed * 0.5; 
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.03;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 0;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    class BackgroundLayer {
        constructor(speedMod, yOffset, height, color) {
            this.speedMod = speedMod;
            this.yOffset = yOffset; 
            this.height = height;
            this.x = 0;
            this.width = 120;
            this.color = color;
            this.points = [];
            
            // Generate terrain
            for(let i=0; i < 25; i++) {
                this.points.push(Math.random() * height);
            }
        }

        update() {
            this.x -= gameSpeed * this.speedMod;
            if (this.x <= -this.width) {
                this.x += this.width;
                this.points.shift();
                this.points.push(Math.random() * this.height);
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            let startX = this.x % this.width;
            
            for (let i = 0; i < this.points.length + 2; i++) {
                let px = startX + (i * this.width);
                let py = canvas.height - GROUND_OFFSET - this.yOffset - (this.points[i] || 0);
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            
            ctx.lineTo(canvas.width + 200, canvas.height);
            ctx.lineTo(-200, canvas.height);
            ctx.closePath();
            ctx.fill();
        }
    }

    /**
     * SYSTEM LOGIC
     */
    let player;
    let obstacles = [];
    let particles = [];
    let bgLayers = [];
    let spawnTimer = 0;
    let spawnInterval = 80;

    function init() {
        resize();
        player = new Player();
        // Parallax layers
        bgLayers = [
            new BackgroundLayer(0.05, 200, 100, COLORS.bgLayer1), // Far mountains
            new BackgroundLayer(0.2, 100, 50, COLORS.bgLayer2)   // Mid hills
        ];
        loop();
    }

    function createParticles(x, y, count, color) {
        for (let i = 0; i < count; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    function spawnObstacle() {
        spawnTimer--;
        if (spawnTimer <= 0) {
            const type = Math.random() > 0.7 ? 'bird' : 'cactus';
            obstacles.push(new Obstacle(type));
            spawnTimer = spawnInterval + Math.random() * 60;
            
            if (spawnInterval > 50) spawnInterval -= 0.2;
            gameSpeed += 0.003;
        }
    }

    function checkCollisions() {
        for (let obs of obstacles) {
            const pPad = 8; 
            const oPad = 6;

            if (
                player.x + pPad < obs.x + obs.width - oPad &&
                player.x + player.width - pPad > obs.x + oPad &&
                player.y + pPad < obs.y + obs.height - oPad &&
                player.y + player.height - pPad > obs.y + oPad
            ) {
                gameOver();
            }
        }
    }

    function gameOver() {
        isGameOver = true;
        isPlaying = false;
        containerEl.classList.add('glitch-active');
        gameOverScreen.classList.add('active');
        finalScoreEl.innerText = Math.floor(score);
        instructionsEl.style.opacity = '0';
        
        if (score > highScore) {
            highScore = Math.floor(score);
            highScoreEl.innerText = highScore.toString().padStart(5, '0');
        }
    }

    function resetGame() {
        isGameOver = false;
        player = new Player();
        obstacles = [];
        particles = [];
        score = 0;
        gameSpeed = 8;
        spawnInterval = 80;
        spawnTimer = 0;
        containerEl.classList.remove('glitch-active');
        gameOverScreen.classList.remove('active');
        isPlaying = true;
        instructionsEl.style.opacity = '0';
    }

    function update() {
        if (!isPlaying) return;

        frame++;
        score += 0.1; 
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
        
        let speedMultiplier = (gameSpeed / 8).toFixed(1);
        speedValEl.innerText = speedMultiplier + 'x';
        let fillPercent = Math.min((gameSpeed - 8) / 10 * 100, 100);
        speedFillEl.style.width = Math.max(fillPercent, 5) + '%';

        player.update();
        bgLayers.forEach(layer => layer.update());

        spawnObstacle();
        obstacles.forEach((obs, index) => {
            obs.update();
            if (obs.markedForDeletion) obstacles.splice(index, 1);
        });

        particles.forEach((p, index) => {
            p.update();
            if (p.life <= 0) particles.splice(index, 1);
        });

        checkCollisions();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        bgLayers.forEach(layer => layer.draw());

        // Ground Line
        ctx.strokeStyle = COLORS.grid;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height - GROUND_OFFSET);
        ctx.lineTo(canvas.width, canvas.height - GROUND_OFFSET);
        ctx.stroke();

        player.draw();
        obstacles.forEach(obs => obs.draw());
        particles.forEach(p => p.draw());
    }

    function loop() {
        update();
        draw();
        animationFrameId = requestAnimationFrame(loop);
    }

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        const rect = containerEl.getBoundingClientRect();
        
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        
        ctx.scale(dpr, dpr);
        
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';

        if(player) player.originalY = canvas.height / dpr - GROUND_OFFSET - player.height;
    }

    // Input Handling
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            if (isGameOver) {
                resetGame();
            } else if (!isPlaying) {
                isPlaying = true;
                instructionsEl.style.opacity = '0';
            } else {
                player.jump();
            }
        }
    });

    restartBtn.addEventListener('click', resetGame);

    window.addEventListener('resize', resize);
    
    window.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (isGameOver) {
            resetGame();
        } else if (!isPlaying) {
            isPlaying = true;
            instructionsEl.style.opacity = '0';
        } else {
            player.jump();
        }
    }, {passive: false});

    // Start
    init();

</script>
</body>
</html>
