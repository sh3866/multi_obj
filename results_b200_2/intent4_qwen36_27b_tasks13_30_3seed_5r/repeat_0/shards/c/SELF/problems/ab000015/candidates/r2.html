<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Glacial Descent: Velocity Run</title>
<style>
    :root {
        --c-snow-light: #F8FAFC;
        --c-snow-dark: #E2E8F0;
        --c-ice: #BAE6FD;
        --c-ice-dark: #7DD3FC;
        --c-rock: #334155;
        --c-ui-bg: rgba(15, 23, 42, 0.85);
        --c-ui-border: rgba(255, 255, 255, 0.1);
        --c-accent: #22D3EE; /* Cyan */
        --c-accent-glow: rgba(34, 211, 238, 0.6);
        --c-danger: #F43F5E; /* Rose */
        --c-warning: #FBBF24; /* Amber */
        --font-stack: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --font-mono: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }

    body, html {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background-color: #0f172a;
        font-family: var(--font-stack);
    }

    /* --- CANVAS LAYER --- */
    #gameCanvas {
        display: block;
        width: 100%; height: 100%;
        position: absolute; top: 0; left: 0; z-index: 1;
    }

    /* --- UI LAYER --- */
    #ui-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        display: flex; flex-direction: column; justify-content: space-between;
        z-index: 10;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* --- HUD: TOP --- */
    .hud-top {
        display: flex; justify-content: space-between; align-items: flex-start;
        padding: 20px;
        position: relative;
    }

    .panel {
        background: var(--c-ui-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--c-ui-border);
        border-radius: 12px;
        padding: 8px 16px;
        color: white;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        display: flex; flex-direction: column;
        min-width: 80px;
        transform: skewX(-10deg); /* Dynamic shape */
    }

    .panel > * { transform: skewX(10deg); } /* Un-skew content */

    .label {
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--c-accent);
        margin-bottom: 2px;
        font-weight: 800;
        opacity: 0.9;
    }

    .value {
        font-size: 24px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        font-family: var(--font-mono);
        text-shadow: 0 0 10px rgba(255,255,255,0.2);
        line-height: 1;
    }

    .value span { font-size: 12px; color: #94a3b8; font-weight: 600; margin-left: 2px; }

    /* Progress Bar (Top Edge) */
    .progress-container {
        position: absolute; top: 0; left: 0; width: 100%; height: 3px;
        background: rgba(0,0,0,0.5);
        z-index: 20;
    }
    .progress-fill {
        height: 100%; background: var(--c-accent);
        width: 0%; transition: width 0.1s linear;
        box-shadow: 0 0 15px var(--c-accent-glow);
    }

    /* --- HUD: CENTER (Gates) --- */
    .gate-indicator {
        position: absolute; top: 18%; left: 50%; transform: translateX(-50%);
        text-align: center; pointer-events: none;
        opacity: 0; 
        transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .gate-indicator.active { opacity: 1; transform: translateX(-50%) scale(1.1); }
    
    .gate-badge {
        display: inline-flex; align-items: center; gap: 10px;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid var(--c-warning);
        padding: 6px 20px;
        border-radius: 30px;
        backdrop-filter: blur(4px);
        box-shadow: 0 0 20px rgba(251, 191, 36, 0.2);
    }
    .gate-icon {
        width: 8px; height: 8px;
        background: var(--c-warning);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--c-warning);
        animation: pulse 1s infinite;
    }
    @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

    .gate-text {
        color: #fff; font-weight: 800; letter-spacing: 2px; font-size: 12px;
        text-transform: uppercase;
    }

    /* --- CONTROLS: BOTTOM --- */
    .hud-bottom {
        display: flex; justify-content: space-between; align-items: flex-end;
        padding: 20px;
        padding-bottom: max(20px, env(safe-area-inset-bottom));
    }

    .controls-area {
        display: flex; gap: 20px;
        pointer-events: auto;
    }

    .btn-control {
        width: 70px; height: 70px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        display: flex; justify-content: center; align-items: center;
        cursor: pointer;
        transition: all 0.1s;
        color: rgba(255,255,255,0.7);
        backdrop-filter: blur(4px);
        position: relative;
        overflow: hidden;
    }
    /* Inner ring for detail */
    .btn-control::after {
        content: ''; position: absolute; top: 5px; left: 5px; right: 5px; bottom: 5px;
        border-radius: 50%; border: 1px solid rgba(255,255,255,0.1);
    }

    .btn-control:active, .btn-control.pressed {
        background: rgba(255, 255, 255, 0.15);
        border-color: #fff;
        transform: scale(0.92);
        color: #fff;
        box-shadow: 0 0 20px rgba(255,255,255,0.2);
    }
    
    .btn-control svg { width: 32px; height: 32px; fill: currentColor; stroke: currentColor; stroke-width: 2px; }

    .stats-area {
        text-align: right;
        position: relative;
        display: flex; flex-direction: column; align-items: flex-end;
    }

    /* Speedometer specific */
    .speedometer {
        display: flex; align-items: baseline; justify-content: flex-end;
        position: relative;
    }
    
    /* Dynamic Speed Number */
    .speed-val {
        font-size: 64px; font-weight: 900; font-style: italic;
        font-family: var(--font-mono);
        background: linear-gradient(to bottom, #fff, #cbd5e1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-right: 2px;
        line-height: 0.8;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
        letter-spacing: -2px;
    }
    .speed-unit { font-size: 14px; font-weight: 700; color: #94a3b8; letter-spacing: 1px; margin-top: 8px;}
    
    /* Speed bar visual */
    .speed-bar-bg {
        width: 140px; height: 6px; background: rgba(0,0,0,0.4);
        border-radius: 3px; margin-top: 8px; margin-left: auto;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.1);
    }
    .speed-bar-fill {
        height: 100%; background: linear-gradient(90deg, var(--c-accent), #fff);
        width: 0%;
        transition: width 0.1s linear;
        box-shadow: 0 0 10px var(--c-accent);
    }

    /* Shake Effect Class */
    .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake {
        10%, 90% { transform: translate3d(-2px, 0, 0); }
        20%, 80% { transform: translate3d(3px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
        40%, 60% { transform: translate3d(5px, 0, 0); }
    }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
    <div class="progress-container">
        <div class="progress-fill" id="progressBar"></div>
    </div>

    <div class="hud-top">
        <div class="panel">
            <div class="label">Distance</div>
            <div class="value" id="distVal">0<span>m</span></div>
        </div>
        <div class="panel" style="align-items: center;">
            <div class="label">Time</div>
            <div class="value" id="timeVal">00:00</div>
        </div>
    </div>

    <div class="gate-indicator" id="gateIndicator">
        <div class="gate-badge">
            <div class="gate-icon"></div>
            <div class="gate-text">Gate Ahead</div>
        </div>
    </div>

    <div class="hud-bottom">
        <div class="controls-area">
            <div class="btn-control" id="btnLeft">
                <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke="none" /></svg>
            </div>
            <div class="btn-control" id="btnRight">
                <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" stroke="none" /></svg>
            </div>
        </div>

        <div class="stats-area">
            <div class="label">Velocity</div>
            <div class="speedometer">
                <div class="speed-val" id="speedVal">0</div>
                <div class="speed-unit">KM/H</div>
            </div>
            <div class="speed-bar-bg">
                <div class="speed-bar-fill" id="speedBar"></div>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * ALPINE RUSH - Visual Simulation
 * A pseudo-3D engine using a vertical canvas projection to simulate a downhill slope.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 

// State
let width, height;
let frame = 0;
let speed = 0;
let targetSpeed = 160; // km/h - slightly faster for more drama
let playerX = 0; // -1 (left) to 1 (right)
let playerTilt = 0;
let distance = 0;
let startTime = Date.now();
let shakeIntensity = 0;

// World Generation
const SEGMENT_LENGTH = 120;
const ROAD_WIDTH = 2000;
let segments = [];

// UI Elements
const uiSpeed = document.getElementById('speedVal');
const uiDist = document.getElementById('distVal');
const uiTime = document.getElementById('timeVal');
const uiProgress = document.getElementById('progressBar');
const uiGate = document.getElementById('gateIndicator');
const uiSpeedBar = document.getElementById('speedBar');
const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');

// --- Resize Handling ---
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Input Handling ---
let inputLeft = false;
let inputRight = false;

const handleInput = (dir, active) => {
    if(dir === 'left') inputLeft = active;
    if(dir === 'right') inputRight = active;
    
    const btn = dir === 'left' ? btnLeft : btnRight;
    if(active) btn.classList.add('pressed');
    else btn.classList.remove('pressed');
};

// Touch/Mouse events for controls
const addInputListeners = (el, dir) => {
    el.addEventListener('mousedown', () => handleInput(dir, true));
    el.addEventListener('mouseup', () => handleInput(dir, false));
    el.addEventListener('mouseleave', () => handleInput(dir, false));
    el.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(dir, true); });
    el.addEventListener('touchend', (e) => { e.preventDefault(); handleInput(dir, false); });
};
addInputListeners(btnLeft, 'left');
addInputListeners(btnRight, 'right');

// Keyboard
window.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowLeft' || e.key === 'a') handleInput('left', true);
    if(e.key === 'ArrowRight' || e.key === 'd') handleInput('right', true);
});
window.addEventListener('keyup', (e) => {
    if(e.key === 'ArrowLeft' || e.key === 'a') handleInput('left', false);
    if(e.key === 'ArrowRight' || e.key === 'd') handleInput('right', false);
});

// --- 3D Math Helpers ---
function project(p, cameraX, cameraY, cameraZ, cameraDepth) {
    const scale = cameraDepth / (p.z - cameraZ);
    const x = (1 + scale * (p.x - cameraX)) * width / 2;
    const y = (1 - scale * (p.y - cameraY)) * height / 2;
    const w = scale * ROAD_WIDTH * width / 2; 
    return { x, y, scale, w };
}

// --- World Creation ---
function createRoad() {
    segments = [];
    const totalSegments = 1000; 
    
    for (let i = 0; i < totalSegments; i++) {
        // Generate curve and hill - smoother curves
        const curve = (Math.sin(i * 0.02) * 3) + (Math.sin(i * 0.005) * 6);
        const y = Math.sin(i * 0.05) * 1500; // Hills
        
        segments.push({
            index: i,
            p: { x: 0, y: y, z: i * SEGMENT_LENGTH },
            curve: curve,
            color: Math.floor(i / 3) % 2 ? 'dark' : 'light'
        });
    }
}
createRoad();

// --- Rendering Helpers ---
function drawPolygon(ctx, x1, y1, x2, y2, x3, y3, x4, y4, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.lineTo(x4, y4);
    ctx.closePath();
    ctx.fill();
}

function drawSnow(x1, y1, x2, y2, x3, y3, x4, y4, isDark) {
    // Snow base
    drawPolygon(ctx, x1, y1, x2, y2, x3, y3, x4, y4, isDark ? '#E2E8F0' : '#F8FAFC');
}

function drawRock(ctx, x, y, scale) {
    const size = 500 * scale;
    // Main Rock
    ctx.fillStyle = '#334155';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - size/2, y + size/2);
    ctx.lineTo(x + size/2, y + size/2);
    ctx.fill();
    
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.moveTo(x - size/2, y + size/2);
    ctx.lineTo(x + size/2, y + size/2);
    ctx.lineTo(x + size/3, y + size/3);
    ctx.lineTo(x - size/3, y + size/3);
    ctx.fill();
    
    // Snow cap
    ctx.fillStyle = '#F1F5F9';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - size/4, y + size/6);
    ctx.lineTo(x + size/4, y + size/6);
    ctx.fill();
}

function drawTree(ctx, x, y, scale) {
    const h = 1000 * scale;
    const w = 400 * scale;
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(x + w/2, y + h/4, w/2, h/6, 0, 0, Math.PI*2);
    ctx.fill();

    // Trunk
    ctx.fillStyle = '#475569';
    ctx.fillRect(x - w/8, y - h/2, w/4, h/2);
    
    // Leaves (Triangle) - Darker Green
    ctx.fillStyle = '#166534';
    ctx.beginPath();
    ctx.moveTo(x, y - h);
    ctx.lineTo(x - w, y - h/2);
    ctx.lineTo(x + w, y - h/2);
    ctx.fill();
    
    // Snow on tree
    ctx.fillStyle = '#F8FAFC';
    ctx.beginPath();
    ctx.moveTo(x, y - h);
    ctx.lineTo(x - w/2, y - h*0.7);
    ctx.lineTo(x + w/2, y - h*0.7);
    ctx.fill();
}

function drawGate(ctx, x, y, scale) {
    const w = 1600 * scale;
    const h = 600 * scale;
    
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(x, y, w/1.5, h/4, 0, 0, Math.PI*2);
    ctx.fill();

    // Poles
    ctx.fillStyle = '#F43F5E';
    ctx.fillRect(x - w/2, y - h, 30 * scale, h);
    ctx.fillRect(x + w/2 - 30*scale, y - h, 30 * scale, h);
    
    // Banner
    ctx.fillStyle = '#FBBF24';
    ctx.fillRect(x - w/2, y - h, w, 120 * scale);
    
    // Text
    ctx.fillStyle = '#0f172a';
    ctx.font = `bold ${50*scale}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText("GATE", x, y - h + 80*scale);
}

// --- Main Loop ---
let cameraZ = 0;
let playerZ = 0; 

function update(dt) {
    // Acceleration
    if (speed < targetSpeed) speed += 50 * dt;
    else if (speed > targetSpeed) speed -= 20 * dt;
    
    // Movement
    const speedMeters = speed * 0.5; 
    cameraZ += speedMeters * 2; 
    distance += speedMeters * dt;
    
    // Steering
    const steerSpeed = 3.0 * dt;
    if (inputLeft) {
        playerX -= steerSpeed;
        playerTilt = Math.max(playerTilt - 5*dt, -0.6);
    } else if (inputRight) {
        playerX += steerSpeed;
        playerTilt = Math.min(playerTilt + 5*dt, 0.6);
    } else {
        playerTilt *= 0.9; 
    }
    playerX = Math.max(-1.5, Math.min(1.5, playerX)); 

    // Screen Shake Decay
    if(shakeIntensity > 0) shakeIntensity -= 10 * dt;
    if(shakeIntensity < 0) shakeIntensity = 0;

    // UI Updates
    uiSpeed.innerText = Math.floor(speed);
    uiDist.innerHTML = Math.floor(distance) + '<span>m</span>';
    
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const min = Math.floor(elapsed / 60).toString().padStart(2, '0');
    const sec = (elapsed % 60).toString().padStart(2, '0');
    uiTime.innerText = `${min}:${sec}`;
    
    // Progress Bar (Looping simulation)
    const progress = (distance % 2000) / 20;
    uiProgress.style.width = `${progress}%`;
    
    // Speed Bar
    uiSpeedBar.style.width = `${(speed / targetSpeed) * 100}%`;

    // Gate Logic
    const nextGateDist = Math.ceil(distance / 500) * 500;
    if (nextGateDist - distance < 250) {
        uiGate.classList.add('active');
    } else {
        uiGate.classList.remove('active');
    }
}

function render() {
    // Clear Sky - Atmospheric Gradient
    const gradient = ctx.createLinearGradient(0, 0, 0, height);
    gradient.addColorStop(0, '#0F172A'); // Deep Blue
    gradient.addColorStop(0.5, '#3B82F6'); // Mid Blue
    gradient.addColorStop(1, '#E2E8F0'); // Snow Horizon
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);
    
    // Apply Shake
    let shakeX = 0, shakeY = 0;
    if (shakeIntensity > 0) {
        shakeX = (Math.random() - 0.5) * shakeIntensity;
        shakeY = (Math.random() - 0.5) * shakeIntensity;
        ctx.save();
        ctx.translate(shakeX, shakeY);
    }

    // Camera setup
    const baseSegmentIndex = Math.floor(cameraZ / SEGMENT_LENGTH);
    const basePercent = (cameraZ % SEGMENT_LENGTH) / SEGMENT_LENGTH;
    
    const cameraDepth = 0.84; // FOV
    const drawDistance = 300;

    // Render Road (Back to Front)
    let maxY = height; 
    
    for(let n = 0; n < drawDistance; n++) {
        const index = (baseSegmentIndex + n) % segments.length;
        const segment = segments[index];
        
        let z = segment.p.z - cameraZ;
        if (z <= 0) continue; 

        let curveX = 0;
        for(let k=0; k<n; k++) {
            const kIdx = (baseSegmentIndex + k) % segments.length;
            curveX += segments[kIdx].curve;
        }

        const p = project({ x: segment.p.x - curveX * 100, y: segment.p.y, z: z }, 
                          playerX * ROAD_WIDTH, 
                          1500, 
                          0, 
                          cameraDepth);
        
        const pNext = project({ x: segments[(index+1)%segments.length].p.x - curveX * 100, y: segments[(index+1)%segments.length].p.y, z: z + SEGMENT_LENGTH }, 
                              playerX * ROAD_WIDTH, 
                              1500, 0, cameraDepth);

        if (p.y >= maxY) continue;
        
        // Draw Snow Ground
        const w1 = p.w * 2.5; 
        const w2 = pNext.w * 2.5;
        drawSnow(ctx, p.x - w1, p.y, p.x + w1, p.y, pNext.x + w2, pNext.y, pNext.x - w2, pNext.y, segment.color === 'dark');
        
        // Draw Road (Ice Track)
        const rw1 = p.w;
        const rw2 = pNext.w;
        const isDark = segment.color === 'dark';
        // More realistic ice colors
        const roadColor = isDark ? '#90CDF4' : '#EBF8FF'; 
        drawPolygon(ctx, p.x - rw1, p.y, p.x + rw1, p.y, pNext.x + rw2, pNext.y, pNext.x - rw2, pNext.y, roadColor);
        
        // Lane Markers (Subtle)
        if (!isDark) {
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            const lw1 = rw1 * 0.01;
            const lw2 = rw2 * 0.01;
            drawPolygon(ctx, p.x - lw1, p.y, p.x + lw1, p.y, pNext.x + lw2, pNext.y, pNext.x - lw2, pNext.y, 'rgba(255,255,255,0.6)');
        }

        // Objects
        if (segment.index % 5 === 0 && n > 5) {
             drawTree(ctx, p.x - w1 * 1.3, p.y, p.scale);
             drawTree(ctx, p.x + w1 * 1.3, p.y, p.scale);
        }
        if (segment.index % 12 === 0 && n > 5) {
            drawRock(ctx, p.x + w1 * 0.9, p.y, p.scale);
        }

        // Gates
        if (segment.index % 100 === 0 && n > 5 && n < 20) {
             drawGate(ctx, p.x, p.y, p.scale);
        }

        maxY = p.y;
    }

    // --- Draw Player (The Rider) ---
    const playerScreenX = width / 2;
    const playerScreenY = height - 140;
    
    ctx.save();
    ctx.translate(playerScreenX, playerScreenY);
    ctx.rotate(playerTilt);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(0, 45, 50, 15, 0, 0, Math.PI*2);
    ctx.fill();

    // Skis
    ctx.fillStyle = '#1A202C';
    ctx.fillRect(-38, 35, 12, 65); // Left
    ctx.fillRect(26, 35, 12, 65);  // Right

    // Body (Stylized)
    ctx.fillStyle = '#F43F5E'; // Suit
    ctx.beginPath();
    ctx.roundRect(-28, -25, 56, 65, 12);
    ctx.fill();
    
    // Helmet
    ctx.fillStyle = '#1E40AF';
    ctx.beginPath();
    ctx.arc(0, -35, 24, 0, Math.PI*2);
    ctx.fill();
    
    // Goggles
    ctx.fillStyle = '#FBBF24';
    ctx.fillRect(-20, -40, 40, 12);

    // Motion Blur Trails (Speed lines)
    if (speed > 50) {
        ctx.restore(); // Reset rotation for trails
        ctx.save();
        ctx.translate(playerScreenX, playerScreenY);
        const blurAlpha = (speed - 50) / 200;
        ctx.strokeStyle = `rgba(255, 255, 255, ${blurAlpha})`;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        for(let i=0; i<8; i++) {
            const ox = (Math.random() - 0.5) * 120;
            const oy = (Math.random() - 0.5) * 120;
            ctx.beginPath();
            ctx.moveTo(ox, oy + 20);
            ctx.lineTo(ox, oy + 20 + speed/2);
            ctx.stroke();
        }
    }

    ctx.restore();

    // Reset Shake
    if (shakeIntensity > 0) ctx.restore();
}

// --- Game Loop ---
let lastTime = 0;
function loop(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.1); 
    lastTime = time;

    update(dt);
    render();
    requestAnimationFrame(loop);
}

// Start
requestAnimationFrame(loop);

</script>
