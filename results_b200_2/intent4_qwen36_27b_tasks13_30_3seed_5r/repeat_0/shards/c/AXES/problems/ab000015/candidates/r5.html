<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Alpine Velocity: Downhill Rush</title>
<style>
    :root {
        --c-bg-dark: #0f172a;
        --c-cyan: #22d3ee;
        --c-cyan-dim: rgba(34, 211, 238, 0.3);
        --c-orange: #f97316;
        --c-white: #f8fafc;
        --c-slate: #334155;
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --ui-blur: 20px;
        --radius: 16px;
    }

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--c-bg-dark); font-family: var(--font-ui); color: var(--c-white); }

    /* --- CANVAS LAYER --- */
    #gameCanvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    /* --- FX OVERLAY (Grain & Vignette) --- */
    #fx-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none;
        background: radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.9) 100%);
        box-shadow: inset 0 0 150px rgba(0,0,0,0.8);
        opacity: 0.85;
    }
    /* CSS Grain for texture */
    #fx-layer::before {
        content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
        opacity: 0.5;
        pointer-events: none;
    }

    /* --- UI LAYER --- */
    #ui-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
        display: flex; flex-direction: column; justify-content: space-between;
        pointer-events: none;
    }

    /* --- PROGRESS BAR (Compact) --- */
    .progress-track {
        position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: rgba(0,0,0,0.5); z-index: 20;
        backdrop-filter: blur(2px);
    }
    .progress-fill {
        height: 100%; background: linear-gradient(90deg, var(--c-orange), #fbbf24); width: 0%;
        box-shadow: 0 0 15px var(--c-orange);
        transition: width 0.1s linear;
    }

    /* --- HUD: TOP CLUSTER --- */
    .hud-top {
        display: flex; justify-content: space-between; align-items: flex-start;
        padding: 24px; gap: 16px; pointer-events: none;
    }

    /* Glassmorphism Panel */
    .hud-panel {
        background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.02) 100%);
        backdrop-filter: blur(var(--ui-blur)); -webkit-backdrop-filter: blur(var(--ui-blur));
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-top: 1px solid rgba(255, 255, 255, 0.3); /* Top highlight */
        border-radius: var(--radius);
        padding: 10px 20px;
        display: flex; flex-direction: column; justify-content: center;
        min-width: 90px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .hud-label {
        font-size: 10px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
        color: var(--c-cyan); margin-bottom: 2px; opacity: 0.9;
    }

    .hud-value {
        font-family: var(--font-ui); font-size: 24px; font-weight: 700;
        color: var(--c-white); letter-spacing: -0.5px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        font-variant-numeric: tabular-nums;
    }

    /* --- SPEEDOMETER (Center Top - Reduced Scale, Clean) --- */
    .speedometer-container {
        position: absolute; top: 100px; left: 50%; transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center;
        pointer-events: none;
    }
    .speed-val {
        font-family: var(--font-ui);
        font-size: 72px; font-weight: 900; font-style: italic;
        color: var(--c-white); line-height: 1;
        text-shadow: 0 4px 15px rgba(0,0,0,0.4);
        letter-spacing: -2px;
        /* Shake animation via JS */
    }
    .speed-unit {
        font-size: 14px; font-weight: 700; color: var(--c-white);
        letter-spacing: 3px; margin-top: 4px; text-transform: uppercase;
        opacity: 0.8;
    }

    /* --- GATE INDICATOR --- */
    .gate-overlay {
        position: absolute; top: 40%; width: 100%;
        display: flex; justify-content: center; pointer-events: none;
        opacity: 0; transform: translateY(20px) scale(0.95);
        transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .gate-overlay.visible { opacity: 1; transform: translateY(0) scale(1); }
    
    .gate-badge {
        background: linear-gradient(135deg, #ea580c, #c2410c);
        color: #fff; padding: 12px 40px; border-radius: 50px;
        font-weight: 900; font-size: 20px; font-style: italic;
        text-transform: uppercase; letter-spacing: 3px;
        box-shadow: 0 15px 35px rgba(234, 88, 12, 0.5), inset 0 1px 0 rgba(255,255,255,0.4);
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255,255,255,0.2);
    }

    /* --- CONTROLS: BOTTOM --- */
    .hud-bottom {
        padding: 0 32px 50px; display: flex; justify-content: space-between; align-items: flex-end;
        pointer-events: none;
    }

    .controls-group {
        display: flex; gap: 24px; pointer-events: auto;
    }

    .btn-control {
        width: 90px; height: 90px;
        background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-top: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 50%; /* Circular for better ergonomics */
        display: flex; justify-content: center; align-items: center;
        cursor: pointer; transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        color: var(--c-white);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        position: relative;
        overflow: hidden;
    }

    .btn-control:active, .btn-control.pressed {
        background: linear-gradient(180deg, rgba(34, 211, 238, 0.3) 0%, rgba(34, 211, 238, 0.1) 100%);
        border-color: var(--c-cyan);
        transform: translateY(4px) scale(0.95);
        box-shadow: 0 0 25px var(--c-cyan-dim);
    }
    
    .btn-control svg { width: 40px; height: 40px; fill: currentColor; opacity: 0.9; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

    /* Mobile Responsive */
    @media (max-width: 600px) {
        .speed-val { font-size: 56px; }
        .hud-panel { padding: 8px 14px; min-width: 75px; }
        .hud-value { font-size: 20px; }
        .btn-control { width: 80px; height: 80px; }
        .hud-bottom { padding: 0 20px 30px; }
        .gate-badge { font-size: 16px; padding: 10px 30px; }
    }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="fx-layer"></div>

<div id="ui-layer">
    <!-- Progress -->
    <div class="progress-track"><div class="progress-fill" id="progressBar"></div></div>

    <!-- Top Stats Cluster -->
    <div class="hud-top">
        <div class="hud-panel">
            <div class="hud-label">Distance</div>
            <div class="hud-value" id="distVal">0000 m</div>
        </div>
        <div class="hud-panel">
            <div class="hud-label">Time</div>
            <div class="hud-value" id="timeVal">00:00</div>
        </div>
    </div>

    <!-- Primary Speedometer -->
    <div class="speedometer-container">
        <div class="speed-val" id="speedVal">0</div>
        <div class="speed-unit">km/h</div>
    </div>

    <!-- Gate Warning -->
    <div class="gate-overlay" id="gateOverlay">
        <div class="gate-badge">SLALOM GATE</div>
    </div>

    <!-- Bottom Controls -->
    <div class="hud-bottom">
        <div class="controls-group">
            <div class="btn-control" id="btnLeft">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </div>
            <div class="btn-control" id="btnRight">
                <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * ALPINE VELOCITY - REVISED
 * Design focus: Dynamic camera, distinct alpine identity, readable route, high-contrast assets.
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

// --- CONFIG ---
let width, height;
let frame = 0;
let speed = 0;
const MAX_SPEED = 240; 
let playerX = 0; 
let playerTilt = 0;
let distance = 0;
let startTime = Date.now();
let shakeIntensity = 0;
let cameraDutch = 0; // Dutch angle tilt

const SEGMENT_LENGTH = 120;
const ROAD_WIDTH = 2200;
let segments = [];

// --- UI REFS ---
const uiSpeed = document.getElementById('speedVal');
const uiDist = document.getElementById('distVal');
const uiTime = document.getElementById('timeVal');
const uiProgress = document.getElementById('progressBar');
const uiGate = document.getElementById('gateOverlay');
const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');

// --- RESIZE ---
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- INPUT ---
let inputLeft = false, inputRight = false;

const handleInput = (dir, active) => {
    if(dir === 'left') inputLeft = active;
    if(dir === 'right') inputRight = active;
    const btn = dir === 'left' ? btnLeft : btnRight;
    if(active) btn.classList.add('pressed');
    else btn.classList.remove('pressed');
};

const addInputListeners = (el, dir) => {
    const start = (e) => { e.preventDefault(); handleInput(dir, true); };
    const end = (e) => { e.preventDefault(); handleInput(dir, false); };
    el.addEventListener('mousedown', start); el.addEventListener('mouseup', end);
    el.addEventListener('touchstart', start, {passive:false}); el.addEventListener('touchend', end, {passive:false});
};
addInputListeners(btnLeft, 'left');
addInputListeners(btnRight, 'right');

window.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowLeft') handleInput('left', true);
    if(e.key === 'ArrowRight') handleInput('right', true);
});
window.addEventListener('keyup', (e) => {
    if(e.key === 'ArrowLeft') handleInput('left', false);
    if(e.key === 'ArrowRight') handleInput('right', false);
});

// --- 3D MATH ---
function project(p, cameraX, cameraY, cameraZ, cameraDepth) {
    const scale = cameraDepth / (p.z - cameraZ);
    const x = (1 + scale * (p.x - cameraX)) * width / 2;
    const y = (1 - scale * (p.y - cameraY)) * height / 2;
    const w = scale * ROAD_WIDTH * width / 2; 
    return { x, y, scale, w };
}

// --- WORLD GEN ---
function createRoad() {
    segments = [];
    const totalSegments = 1200;
    
    for (let i = 0; i < totalSegments; i++) {
        // Curves
        const curve = Math.sin(i * 0.02) * 4 + Math.sin(i * 0.005) * 12;
        // Hills (Downhill bias)
        const y = (i * 15) + (Math.sin(i * 0.04) * 500); 
        
        segments.push({
            index: i,
            p: { x: 0, y: y, z: i * SEGMENT_LENGTH },
            curve: curve,
            color: Math.floor(i / 3) % 2 ? 'dark' : 'light'
        });
    }
}
createRoad();

// --- DRAWING HELPERS ---
function drawPoly(ctx, x1, y1, x2, y2, x3, y3, x4, y4, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3); ctx.lineTo(x4, y4);
    ctx.closePath(); ctx.fill();
}

// --- ASSETS ---

function drawMountain(ctx, x, y, w, h, color, snowLine) {
    // Atmospheric fade
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w/2, y - h);
    ctx.lineTo(x + w, y);
    ctx.fill();

    // Snow Cap
    if (snowLine > 0) {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(x + w/2, y - h);
        // Jagged snow line
        const sl = h * snowLine;
        ctx.lineTo(x + w/2 - (w/2 * snowLine), y - h + sl);
        ctx.lineTo(x + w/2 - (w/2 * snowLine) + (w*0.1), y - h + sl - 10);
        ctx.lineTo(x + w/2 + (w * 0.05), y - h + sl + 15);
        ctx.lineTo(x + w/2 + (w/2 * snowLine), y - h + sl);
        ctx.fill();
    }
}

function drawTree(ctx, x, y, scale) {
    const h = 2200 * scale;
    const w = 600 * scale;
    
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(x, y, w*0.8, w*0.3, 0, 0, Math.PI*2); ctx.fill();

    // Trunk
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(x - w/10, y - h/3, w/5, h/3);
    
    // Leaves (Layered)
    ctx.fillStyle = '#0f172a'; 
    ctx.beginPath();
    ctx.moveTo(x, y - h*0.9);
    ctx.lineTo(x - w, y - h/3);
    ctx.lineTo(x + w, y - h/3);
    ctx.fill();
    
    ctx.fillStyle = '#1e293b'; 
    ctx.beginPath();
    ctx.moveTo(x, y - h*1.2);
    ctx.lineTo(x - w*0.7, y - h*0.6);
    ctx.lineTo(x + w*0.7, y - h*0.6);
    ctx.fill();

    // Snow on top
    ctx.fillStyle = '#E2E8F0';
    ctx.beginPath();
    ctx.moveTo(x, y - h*1.2);
    ctx.lineTo(x - w*0.3, y - h*0.95);
    ctx.lineTo(x + w*0.3, y - h*0.95);
    ctx.fill();
}

function drawRock(ctx, x, y, scale) {
    const size = 1200 * scale;
    ctx.fillStyle = '#475569';
    ctx.beginPath();
    ctx.moveTo(x - size/2, y);
    ctx.lineTo(x - size/3, y - size/1.5);
    ctx.lineTo(x + size/4, y - size/1.2);
    ctx.lineTo(x + size/2, y);
    ctx.fill();
    
    // Highlight
    ctx.fillStyle = '#94a3b8';
    ctx.beginPath();
    ctx.moveTo(x - size/3, y - size/1.5);
    ctx.lineTo(x + size/4, y - size/1.2);
    ctx.lineTo(x, y - size/2);
    ctx.fill();
}

function drawGate(ctx, x, y, scale) {
    const w = 2200 * scale;
    const h = 1000 * scale;
    
    // Poles
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - w/2, y - h, 45 * scale, h);
    ctx.fillRect(x + w/2 - 45*scale, y - h, 45 * scale, h);
    
    // Banner
    ctx.fillStyle = '#f97316'; // High contrast orange
    ctx.fillRect(x - w/2 - 30*scale, y - h, w + 60*scale, 160 * scale);
    
    // Stripes (Checkerboard pattern)
    ctx.fillStyle = '#000';
    for(let i=0; i<8; i++) {
        ctx.fillRect(x - w/2 + (i * w/8), y - h, w/16, 160 * scale);
    }
}

// --- MAIN LOOP ---
let cameraZ = 0;
let particles = [];

function update(dt) {
    // Physics
    if (speed < MAX_SPEED) speed += 80 * dt;
    
    const speedMeters = speed * 0.8;
    cameraZ += speedMeters * 3;
    distance += speedMeters * dt;
    
    // Steering
    const steerSpeed = 3.5 * dt;
    if (inputLeft) {
        playerX -= steerSpeed;
        playerTilt = Math.max(playerTilt - 12*dt, -0.5);
        cameraDutch = Math.max(cameraDutch - 10*dt, -0.15); // Dynamic Dutch Angle
        shakeIntensity = Math.min(shakeIntensity + 5, 10);
    } else if (inputRight) {
        playerX += steerSpeed;
        playerTilt = Math.min(playerTilt + 12*dt, 0.5);
        cameraDutch = Math.min(cameraDutch + 10*dt, 0.15);
        shakeIntensity = Math.min(shakeIntensity + 5, 10);
    } else {
        playerTilt *= 0.92;
        cameraDutch *= 0.92;
        shakeIntensity *= 0.9;
    }
    playerX = Math.max(-2.0, Math.min(2.0, playerX));

    // UI Updates
    uiSpeed.innerText = Math.floor(speed);
    uiDist.innerHTML = Math.floor(distance).toLocaleString() + ' m';
    
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const min = Math.floor(elapsed / 60).toString().padStart(2, '0');
    const sec = (elapsed % 60).toString().padStart(2, '0');
    uiTime.innerText = `${min}:${sec}`;
    
    const progress = (distance % 5000) / 50;
    uiProgress.style.width = `${Math.min(100, progress)}%`;

    // Gate Logic
    const nextGateDist = Math.ceil(distance / 600) * 600;
    if (nextGateDist - distance < 400) {
        uiGate.classList.add('visible');
    } else {
        uiGate.classList.remove('visible');
    }

    // Particles (Snow spray)
    if (speed > 30) {
        // Spawn more particles at higher speeds
        const count = Math.floor(speed / 30);
        for(let i=0; i<count; i++) {
            particles.push({
                x: width/2 + (Math.random() - 0.5) * 160,
                y: height - 120,
                vx: (Math.random() - 0.5) * 30,
                vy: Math.random() * 30 + 30,
                life: 1.0,
                size: Math.random() * 8 + 4
            });
        }
    }
    
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx - (playerTilt * 60); 
        p.y += p.vy;
        p.life -= 0.04;
        if (p.life <= 0 || p.y > height) particles.splice(i, 1);
    }
}

function render() {
    // Sky Gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
    skyGrad.addColorStop(0, '#0f172a'); 
    skyGrad.addColorStop(0.6, '#1e293b'); 
    skyGrad.addColorStop(1, '#cbd5e1'); 
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, width, height);

    // Camera Shake & Dutch Angle
    let shakeX = 0, shakeY = 0;
    if (shakeIntensity > 0.1) {
        shakeX = (Math.random() - 0.5) * shakeIntensity * 5;
        shakeY = (Math.random() - 0.5) * shakeIntensity * 5;
    }

    ctx.save();
    ctx.translate(width/2, height/2); // Move origin to center for rotation
    ctx.rotate(cameraDutch); // Apply Dutch Angle
    ctx.translate(-width/2 + shakeX, -height/2 + shakeY); // Move back + shake

    const baseSegmentIndex = Math.floor(cameraZ / SEGMENT_LENGTH);
    const cameraDepth = 1.0 / Math.tan((60/2) * Math.PI / 180); 
    const drawDistance = 180;

    // Draw Mountains (Background)
    const bgOffset = playerX * 400;
    
    // Far Peaks
    drawMountain(ctx, width*0.1 - bgOffset, height*0.6, 900, 400, '#334155', 0.3);
    drawMountain(ctx, width*0.7 - bgOffset, height*0.6, 1000, 500, '#1e293b', 0.4);
    // Near Peaks
    drawMountain(ctx, width*0.3 - bgOffset*1.5, height*0.65, 700, 320, '#475569', 0.5);

    let maxY = height;
    let curveAcc = 0;

    // Render Road
    for(let n = 0; n < drawDistance; n++) {
        const index = (baseSegmentIndex + n) % segments.length;
        const segment = segments[index];
        
        let z = segment.p.z - cameraZ;
        if (z <= 0) continue; 

        curveAcc += segment.curve;
        const curveX = curveAcc * 120;

        // Project
        const p = project({ x: segment.p.x - curveX, y: segment.p.y, z: z }, 
                          playerX * ROAD_WIDTH, 
                          2200, // Camera Height
                          0, 
                          cameraDepth);
        
        const nextIndex = (index+1)%segments.length;
        const nextSeg = segments[nextIndex];
        const pNext = project({ x: nextSeg.p.x - curveX, y: nextSeg.p.y, z: z + SEGMENT_LENGTH }, 
                              playerX * ROAD_WIDTH, 2200, 0, cameraDepth);

        if (p.y >= maxY) continue;
        
        // 1. Ground (Snow)
        const w1 = p.w * 6;
        const w2 = pNext.w * 6;
        const isDark = segment.color === 'dark';
        const groundCol = isDark ? '#e2e8f0' : '#f8fafc'; 
        drawPoly(ctx, p.x - w1, p.y, p.x + w1, p.y, pNext.x + w2, pNext.y, pNext.x - w2, pNext.y, groundCol);

        // 2. Road (Ice Track) - Crystalline look
        const rw1 = p.w;
        const rw2 = pNext.w;
        const roadCol = isDark ? '#7dd3fc' : '#bae6fd'; 
        drawPoly(ctx, p.x - rw1, p.y, p.x + rw1, p.y, pNext.x + rw2, pNext.y, pNext.x - rw2, pNext.y, roadCol);

        // 3. Lane Markers (High Contrast)
        if (!isDark) {
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            const lw1 = rw1 * 0.02;
            const lw2 = rw2 * 0.02;
            drawPoly(ctx, p.x - lw1, p.y, p.x + lw1, p.y, pNext.x + lw2, pNext.y, pNext.x - lw2, pNext.y, 'rgba(255,255,255,0.9)');
        }

        // 4. Objects
        if (n > 5) {
            // Trees
            if (segment.index % 6 === 0) drawTree(ctx, p.x - w1*1.6, p.y, p.scale);
            if (segment.index % 6 === 3) drawTree(ctx, p.x + w1*1.6, p.y, p.scale);
            
            // Rocks
            if (segment.index % 25 === 0) drawRock(ctx, p.x + rw1*0.8, p.y, p.scale);
            if (segment.index % 40 === 0) drawRock(ctx, p.x - rw1*0.9, p.y, p.scale);

            // Gates
            if (segment.index % 100 === 0) drawGate(ctx, p.x, p.y, p.scale);
        }

        maxY = p.y;
    }

    // --- DRAW RIDER (Visible, Centered, Dynamic) ---
    const playerScreenX = width / 2;
    const playerScreenY = height - 120; 
    
    ctx.save();
    ctx.translate(playerScreenX, playerScreenY);
    ctx.rotate(playerTilt);

    // Dynamic Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(0, 90, 120, 35, 0, 0, Math.PI*2); ctx.fill();

    // Skis
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.moveTo(-20, 60); ctx.lineTo(-70, 160); ctx.lineTo(-20, 160); ctx.lineTo(-10, 60); ctx.fill();
    ctx.beginPath(); ctx.moveTo(20, 60); ctx.lineTo(70, 160); ctx.lineTo(20, 160); ctx.lineTo(10, 60); ctx.fill();

    // Boots
    ctx.fillStyle = '#000';
    ctx.fillRect(-25, 50, 18, 18);
    ctx.fillRect(7, 50, 18, 18);

    // Body (Aerodynamic Tuck) - High Contrast Orange
    ctx.fillStyle = '#f97316'; 
    ctx.beginPath();
    ctx.moveTo(-35, 60);
    ctx.quadraticCurveTo(-55, 10, -20, -30);
    ctx.lineTo(20, -30);
    ctx.quadraticCurveTo(55, 10, 35, 60);
    ctx.fill();
    
    // Zipper detail
    ctx.fillStyle = '#fff';
    ctx.fillRect(-2, -25, 4, 60);

    // Helmet
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(0, -40, 38, 0, Math.PI*2); ctx.fill();
    
    // Visor
    ctx.fillStyle = '#fbbf24'; 
    ctx.beginPath(); ctx.arc(0, -40, 35, 0, Math.PI, false); ctx.fill();

    ctx.restore();

    // --- PARTICLES (Snow Spray) ---
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for(let p of particles) {
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // --- SPEED LINES (Visual FX) ---
    if (speed > 60) {
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 4;
        const lineCount = Math.floor(speed / 15);
        for(let i=0; i<lineCount; i++) {
            const lx = Math.random() * width;
            const ly = Math.random() * height;
            const lLen = speed * 2;
            ctx.beginPath();
            ctx.moveTo(lx, ly);
            ctx.lineTo(lx, ly + lLen);
            ctx.stroke();
        }
    }

    ctx.restore(); // Restore from camera transform
}

let lastTime = 0;
function loop(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.1);
    lastTime = time;
    update(dt);
    render();
    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>
</body>
</html>
