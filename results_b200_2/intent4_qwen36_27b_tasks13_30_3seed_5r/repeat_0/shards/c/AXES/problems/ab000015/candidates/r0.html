<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Alpine Rush: Freefall</title>
<style>
    :root {
        --c-snow: #F0F4F8;
        --c-ice: #A5D8FF;
        --c-rock: #2D3748;
        --c-rock-light: #4A5568;
        --c-tree: #2F855A;
        --c-tree-dark: #22543D;
        --c-ui-bg: rgba(15, 23, 42, 0.85);
        --c-ui-border: rgba(255, 255, 255, 0.1);
        --c-accent: #38BDF8; /* Cyan */
        --c-danger: #F56565; /* Red */
        --c-warning: #FBBF24; /* Amber */
        --font-stack: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

    body, html {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background-color: #0f172a;
        font-family: var(--font-stack);
    }

    /* --- CANVAS LAYER --- */
    #gameCanvas {
        display: block;
        width: 100%; height: 100%;
    }

    /* --- UI LAYER --- */
    #ui-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; /* Let clicks pass to controls if needed */
        display: flex; flex-direction: column; justify-content: space-between;
    }

    /* --- HUD: TOP --- */
    .hud-top {
        display: flex; justify-content: space-between; align-items: flex-start;
        padding: 20px;
    }

    .panel {
        background: var(--c-ui-bg);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid var(--c-ui-border);
        border-radius: 12px;
        padding: 12px 20px;
        color: white;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        display: flex; flex-direction: column;
    }

    .label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--c-accent);
        margin-bottom: 4px;
        font-weight: 700;
    }

    .value {
        font-size: 24px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .value span { font-size: 14px; color: #94a3b8; font-weight: 400; margin-left: 4px; }

    /* Progress Bar */
    .progress-container {
        position: absolute; top: 0; left: 0; width: 100%; height: 6px;
        background: rgba(0,0,0,0.5);
    }
    .progress-fill {
        height: 100%; background: var(--c-accent);
        width: 0%; transition: width 0.1s linear;
        box-shadow: 0 0 10px var(--c-accent);
    }

    /* --- HUD: CENTER (Gates) --- */
    .gate-indicator {
        position: absolute; top: 20%; width: 100%;
        text-align: center; pointer-events: none;
        opacity: 0; transition: opacity 0.3s;
    }
    .gate-indicator.active { opacity: 1; }
    .gate-icon {
        display: inline-block; width: 60px; height: 60px;
        background: rgba(255,255,255,0.1); border: 2px solid var(--c-warning);
        border-radius: 50%; line-height: 56px; font-weight: 900; color: var(--c-warning);
        font-size: 24px;
    }

    /* --- CONTROLS: BOTTOM --- */
    .hud-bottom {
        padding: 30px;
        display: flex; justify-content: space-between; align-items: flex-end;
    }

    .controls-area {
        display: flex; gap: 20px;
        pointer-events: auto;
    }

    .btn-control {
        width: 70px; height: 70px;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        display: flex; justify-content: center; align-items: center;
        cursor: pointer;
        transition: all 0.1s;
        color: white;
    }
    .btn-control:active, .btn-control.pressed {
        background: var(--c-accent);
        border-color: var(--c-accent);
        transform: scale(0.95);
        box-shadow: 0 0 15px var(--c-accent);
    }
    
    .btn-control svg { width: 32px; height: 32px; fill: currentColor; }

    .stats-area {
        text-align: right;
    }

    /* Speedometer specific */
    .speedometer {
        display: flex; align-items: baseline; justify-content: flex-end;
    }
    .speed-val {
        font-size: 48px; font-weight: 900; font-style: italic;
        background: linear-gradient(to bottom, #fff, #94a3b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-right: 5px;
    }
    .speed-unit { font-size: 14px; font-weight: 700; color: #94a3b8; }

    /* Shake Effect Class */
    .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake {
        10%, 90% { transform: translate3d(-1px, 0, 0); }
        20%, 80% { transform: translate3d(2px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
        40%, 60% { transform: translate3d(4px, 0, 0); }
    }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
    <div class="progress-container">
        <div class="progress-fill" id="progressBar"></div>
    </div>

    <div class="hud-top">
        <div class="panel">
            <div class="label">Distance</div>
            <div class="value" id="distVal">0<span>m</span></div>
        </div>
        <div class="panel" style="align-items: center;">
            <div class="label">Time</div>
            <div class="value" id="timeVal">00:00</div>
        </div>
    </div>

    <div class="gate-indicator" id="gateIndicator">
        <div class="gate-icon">GATE</div>
    </div>

    <div class="hud-bottom">
        <div class="controls-area">
            <div class="btn-control" id="btnLeft">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </div>
            <div class="btn-control" id="btnRight">
                <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </div>
        </div>

        <div class="panel stats-area" style="border:none; background:transparent; box-shadow:none; padding:0;">
            <div class="label">Velocity</div>
            <div class="speedometer">
                <div class="speed-val" id="speedVal">0</div>
                <div class="speed-unit">KM/H</div>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * ALPINE RUSH - Visual Simulation
 * A pseudo-3D engine using a vertical canvas projection to simulate a downhill slope.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); // Optimize

// State
let width, height;
let frame = 0;
let speed = 0;
let targetSpeed = 120; // km/h
let playerX = 0; // -1 (left) to 1 (right)
let playerTilt = 0;
let distance = 0;
let startTime = Date.now();
let shakeIntensity = 0;

// World Generation
const SEGMENT_LENGTH = 100;
const RUMBLE_LENGTH = 3;
const ROAD_WIDTH = 2000;
const LANES = 3;
let segments = [];
let trackLength = 0;

// UI Elements
const uiSpeed = document.getElementById('speedVal');
const uiDist = document.getElementById('distVal');
const uiTime = document.getElementById('timeVal');
const uiProgress = document.getElementById('progressBar');
const uiGate = document.getElementById('gateIndicator');
const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');

// --- Resize Handling ---
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Input Handling ---
let inputLeft = false;
let inputRight = false;

const handleInput = (dir, active) => {
    if(dir === 'left') inputLeft = active;
    if(dir === 'right') inputRight = active;
    
    const btn = dir === 'left' ? btnLeft : btnRight;
    if(active) btn.classList.add('pressed');
    else btn.classList.remove('pressed');
};

// Touch/Mouse events for controls
const addInputListeners = (el, dir) => {
    el.addEventListener('mousedown', () => handleInput(dir, true));
    el.addEventListener('mouseup', () => handleInput(dir, false));
    el.addEventListener('mouseleave', () => handleInput(dir, false));
    el.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(dir, true); });
    el.addEventListener('touchend', (e) => { e.preventDefault(); handleInput(dir, false); });
};
addInputListeners(btnLeft, 'left');
addInputListeners(btnRight, 'right');

// Keyboard
window.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowLeft') handleInput('left', true);
    if(e.key === 'ArrowRight') handleInput('right', true);
});
window.addEventListener('keyup', (e) => {
    if(e.key === 'ArrowLeft') handleInput('left', false);
    if(e.key === 'ArrowRight') handleInput('right', false);
});

// --- 3D Math Helpers ---
function project(p, cameraX, cameraY, cameraZ, cameraDepth) {
    const scale = cameraDepth / (p.z - cameraZ);
    const x = (1 + scale * (p.x - cameraX)) * width / 2;
    const y = (1 - scale * (p.y - cameraY)) * height / 2;
    const w = scale * ROAD_WIDTH * width / 2; // Width of road at this depth
    return { x, y, scale, w };
}

// --- World Creation ---
function createRoad() {
    segments = [];
    const totalSegments = 1000; // Infinite scroll logic later
    
    for (let i = 0; i < totalSegments; i++) {
        // Generate curve and hill
        const curve = (Math.sin(i * 0.05) * 4) + (Math.sin(i * 0.01) * 8);
        const y = Math.sin(i * 0.1) * 1000; // Hills
        
        segments.push({
            index: i,
            p: { x: 0, y: y, z: i * SEGMENT_LENGTH },
            curve: curve,
            color: Math.floor(i / RUMBLE_LENGTH) % 2 ? 'dark' : 'light'
        });
    }
}
createRoad();

// --- Rendering Helpers ---
function drawPolygon(ctx, x1, y1, x2, y2, x3, y3, x4, y4, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.lineTo(x4, y4);
    ctx.closePath();
    ctx.fill();
}

function drawSnow(x1, y1, x2, y2, x3, y3, x4, y4, isDark) {
    // Snow base
    drawPolygon(ctx, x1, y1, x2, y2, x3, y3, x4, y4, isDark ? '#E2E8F0' : '#F7FAFC');
    
    // Texture noise (simple lines for speed illusion)
    if (!isDark && Math.random() > 0.9) {
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillRect(x1 + (x2-x1)*0.2, y1, 2, 10);
    }
}

function drawRock(ctx, x, y, scale) {
    const size = 300 * scale;
    ctx.fillStyle = '#4A5568';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - size/2, y + size/2);
    ctx.lineTo(x + size/2, y + size/2);
    ctx.fill();
    
    // Snow cap
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - size/4, y + size/6);
    ctx.lineTo(x + size/4, y + size/6);
    ctx.fill();
}

function drawTree(ctx, x, y, scale) {
    const h = 800 * scale;
    const w = 300 * scale;
    // Trunk
    ctx.fillStyle = '#744210';
    ctx.fillRect(x - w/8, y - h/2, w/4, h/2);
    // Leaves (Triangle)
    ctx.fillStyle = '#2F855A';
    ctx.beginPath();
    ctx.moveTo(x, y - h);
    ctx.lineTo(x - w, y - h/2);
    ctx.lineTo(x + w, y - h/2);
    ctx.fill();
    // Snow on tree
    ctx.fillStyle = '#F0F4F8';
    ctx.beginPath();
    ctx.moveTo(x, y - h);
    ctx.lineTo(x - w/2, y - h*0.7);
    ctx.lineTo(x + w/2, y - h*0.7);
    ctx.fill();
}

function drawGate(ctx, x, y, scale) {
    const w = 1200 * scale;
    const h = 400 * scale;
    
    // Poles
    ctx.fillStyle = '#F56565';
    ctx.fillRect(x - w/2, y - h, 20 * scale, h);
    ctx.fillRect(x + w/2 - 20*scale, y - h, 20 * scale, h);
    
    // Banner
    ctx.fillStyle = '#FBBF24';
    ctx.fillRect(x - w/2, y - h, w, 80 * scale);
    
    // Text
    ctx.fillStyle = '#000';
    ctx.font = `bold ${30*scale}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText("GATE", x, y - h + 50*scale);
}

// --- Main Loop ---
let cameraZ = 0;
let playerZ = 0; // Player is always at a fixed Z relative to camera in this logic, actually camera moves forward

function update(dt) {
    // Acceleration
    if (speed < targetSpeed) speed += 50 * dt;
    else if (speed > targetSpeed) speed -= 20 * dt;
    
    // Movement
    const speedMeters = speed * 0.5; // Scale down for visual
    cameraZ += speedMeters * 2; // Move camera forward
    distance += speedMeters * dt;
    
    // Steering
    const steerSpeed = 3.0 * dt;
    if (inputLeft) {
        playerX -= steerSpeed;
        playerTilt = Math.max(playerTilt - 5*dt, -0.5);
    } else if (inputRight) {
        playerX += steerSpeed;
        playerTilt = Math.min(playerTilt + 5*dt, 0.5);
    } else {
        playerTilt *= 0.9; // Return to center
    }
    playerX = Math.max(-1.5, Math.min(1.5, playerX)); // Bounds

    // Screen Shake Decay
    if(shakeIntensity > 0) shakeIntensity -= 10 * dt;
    if(shakeIntensity < 0) shakeIntensity = 0;

    // UI Updates
    uiSpeed.innerText = Math.floor(speed);
    uiDist.innerHTML = Math.floor(distance) + '<span>m</span>';
    
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const min = Math.floor(elapsed / 60).toString().padStart(2, '0');
    const sec = (elapsed % 60).toString().padStart(2, '0');
    uiTime.innerText = `${min}:${sec}`;
    
    // Progress Bar (Looping simulation)
    const progress = (distance % 2000) / 20;
    uiProgress.style.width = `${progress}%`;

    // Gate Logic
    const nextGateDist = Math.ceil(distance / 500) * 500;
    if (nextGateDist - distance < 200) {
        uiGate.classList.add('active');
        uiGate.style.top = (20 + (nextGateDist - distance)/10) + '%'; // Parallax hint
    } else {
        uiGate.classList.remove('active');
    }
}

function render() {
    // Clear Sky
    const gradient = ctx.createLinearGradient(0, 0, 0, height);
    gradient.addColorStop(0, '#1A202C'); // Dark blue top
    gradient.addColorStop(0.5, '#4299E1'); // Horizon
    gradient.addColorStop(1, '#E2E8F0'); // Snow horizon
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);
    
    // Apply Shake
    let shakeX = 0, shakeY = 0;
    if (shakeIntensity > 0) {
        shakeX = (Math.random() - 0.5) * shakeIntensity;
        shakeY = (Math.random() - 0.5) * shakeIntensity;
        ctx.save();
        ctx.translate(shakeX, shakeY);
    }

    // Camera setup
    const baseSegmentIndex = Math.floor(cameraZ / SEGMENT_LENGTH);
    const basePercent = (cameraZ % SEGMENT_LENGTH) / SEGMENT_LENGTH;
    const playerSegmentY = 0; // Flattened for simplicity in this view
    
    const cameraDepth = 0.84; // FOV
    const drawDistance = 300;

    // Render Road (Back to Front)
    let maxY = height; // Clipping buffer
    
    // We only draw visible segments relative to camera
    for(let n = 0; n < drawDistance; n++) {
        const index = (baseSegmentIndex + n) % segments.length;
        const segment = segments[index];
        
        // Loop Z logic
        let z = segment.p.z - cameraZ;
        if (z <= 0) continue; // Behind camera

        // Apply Curve offset for visual curve
        let curveX = 0;
        for(let k=0; k<n; k++) {
            const kIdx = (baseSegmentIndex + k) % segments.length;
            curveX += segments[kIdx].curve;
        }

        // Project
        const p = project({ x: segment.p.x - curveX * 100, y: segment.p.y, z: z }, 
                          playerX * ROAD_WIDTH, 
                          1500, // Camera height
                          0, 
                          cameraDepth);
        
        const pNext = project({ x: segments[(index+1)%segments.length].p.x - curveX * 100, y: segments[(index+1)%segments.length].p.y, z: z + SEGMENT_LENGTH }, 
                              playerX * ROAD_WIDTH, 
                              1500, 0, cameraDepth);

        if (p.y >= maxY) continue;
        
        // Draw Snow Ground (Wider than road)
        const w1 = p.w * 2.5; // Ground width
        const w2 = pNext.w * 2.5;
        drawSnow(ctx, p.x - w1, p.y, p.x + w1, p.y, pNext.x + w2, pNext.y, pNext.x - w2, segment.color === 'dark');
        
        // Draw Road (Ice Track)
        const rw1 = p.w;
        const rw2 = pNext.w;
        // Ice gradient effect
        const isDark = segment.color === 'dark';
        const roadColor = isDark ? '#BEE3F8' : '#E6FFFA'; // Ice colors
        drawPolygon(ctx, p.x - rw1, p.y, p.x + rw1, p.y, pNext.x + rw2, pNext.y, pNext.x - rw2, pNext.y, roadColor);
        
        // Lane Markers
        if (!isDark) {
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            const lw1 = rw1 * 0.02;
            const lw2 = rw2 * 0.02;
            // Center line
            drawPolygon(ctx, p.x - lw1, p.y, p.x + lw1, p.y, pNext.x + lw2, pNext.y, pNext.x - lw2, pNext.y, 'rgba(255,255,255,0.5)');
        }

        // Objects (Trees/Rocks)
        if (segment.index % 5 === 0 && n > 5) {
             drawTree(ctx, p.x - w1 * 1.2, p.y, p.scale);
             drawTree(ctx, p.x + w1 * 1.2, p.y, p.scale);
        }
        if (segment.index % 12 === 0 && n > 5) {
            drawRock(ctx, p.x + w1 * 0.8, p.y, p.scale);
        }

        // Gates
        if (segment.index % 100 === 0 && n > 5 && n < 20) {
             drawGate(ctx, p.x, p.y, p.scale);
             // Trigger gate passed logic here visually
        }

        maxY = p.y;
    }

    // --- Draw Player (The Rider) ---
    // Player is drawn at fixed screen position, but tilted
    const playerScreenX = width / 2;
    const playerScreenY = height - 150;
    
    ctx.save();
    ctx.translate(playerScreenX, playerScreenY);
    ctx.rotate(playerTilt);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(0, 40, 40, 10, 0, 0, Math.PI*2);
    ctx.fill();

    // Skis
    ctx.fillStyle = '#2D3748';
    ctx.fillRect(-35, 30, 10, 60); // Left
    ctx.fillRect(25, 30, 10, 60);  // Right

    // Body (Stylized)
    ctx.fillStyle = '#F56565'; // Suit
    ctx.beginPath();
    ctx.roundRect(-25, -20, 50, 60, 10);
    ctx.fill();
    
    // Helmet
    ctx.fillStyle = '#2B6CB0';
    ctx.beginPath();
    ctx.arc(0, -30, 22, 0, Math.PI*2);
    ctx.fill();
    
    // Goggles
    ctx.fillStyle = '#F6E05E';
    ctx.fillRect(-18, -35, 36, 10);

    // Motion Blur Trails (Speed lines)
    if (speed > 50) {
        ctx.restore(); // Reset rotation for trails
        ctx.save();
        ctx.translate(playerScreenX, playerScreenY);
        const blurAlpha = (speed - 50) / 200;
        ctx.strokeStyle = `rgba(255, 255, 255, ${blurAlpha})`;
        ctx.lineWidth = 2;
        for(let i=0; i<5; i++) {
            const ox = (Math.random() - 0.5) * 100;
            const oy = (Math.random() - 0.5) * 100;
            ctx.beginPath();
            ctx.moveTo(ox, oy + 20);
            ctx.lineTo(ox, oy + 20 + speed/2);
            ctx.stroke();
        }
    }

    ctx.restore();

    // Reset Shake
    if (shakeIntensity > 0) ctx.restore();
}

// --- Game Loop ---
let lastTime = 0;
function loop(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.1); // Cap dt
    lastTime = time;

    update(dt);
    render();
    requestAnimationFrame(loop);
}

// Start
requestAnimationFrame(loop);

</script>
</body>
</html>
