<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactical AI Visualizer // REVISED</title>
<style>
  :root {
    --bg-deep: #050708;
    --bg-panel: rgba(16, 20, 24, 0.85);
    --grid-line: rgba(56, 189, 248, 0.05);
    
    /* Semantic Colors - High Contrast Tactical */
    --color-patrol: #38bdf8;   /* Cyan */
    --color-alert: #facc15;    /* Amber */
    --color-chase: #f97316;    /* Orange */
    --color-attack: #f43f5e;   /* Rose/Red */
    --color-player: #34d399;   /* Emerald */
    --color-wall: #0f172a;
    --color-wall-border: #334155;
    
    /* Typography */
    --font-ui: "Segoe UI", "Roboto", "Helvetica Neue", sans-serif;
    --font-mono: "Consolas", "Monaco", "Courier New", monospace;
    
    --text-main: #f1f5f9;
    --text-dim: #94a3b8;
    --border-color: rgba(148, 163, 184, 0.2);
  }

  body {
    margin: 0; padding: 0;
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-ui);
    overflow: hidden;
    height: 100vh; width: 100vw;
    user-select: none;
  }

  /* Background Grid */
  .grid-bg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 0;
    pointer-events: none;
  }

  canvas {
    position: absolute; top: 0; left: 0;
    z-index: 1;
    cursor: crosshair;
  }

  /* UI Layer */
  .ui-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 20px; box-sizing: border-box;
  }

  /* HUD Panel Construction - Angled Corners */
  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    padding: 16px;
    pointer-events: auto;
    position: relative;
    backdrop-filter: blur(4px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    clip-path: polygon(
      0 0, 
      100% 0, 
      100% calc(100% - 15px), 
      calc(100% - 15px) 100%, 
      0 100%
    );
  }

  .panel::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
  }

  /* Header */
  header {
    display: flex; justify-content: space-between; align-items: flex-start;
    width: 100%;
  }

  .brand {
    display: flex; flex-direction: column;
  }

  .brand h1 {
    font-size: 24px; font-weight: 800; letter-spacing: -0.5px;
    text-transform: uppercase; margin: 0 0 4px 0;
    color: var(--text-main);
    font-family: var(--font-ui);
  }

  .brand p {
    font-size: 12px; color: var(--text-dim);
    margin: 0; letter-spacing: 1px; text-transform: uppercase;
    font-weight: 600;
  }

  /* Top Right Legend - Moved for Hierarchy */
  .top-right-zone {
    display: flex; justify-content: flex-end;
  }

  .legend-panel {
    min-width: 280px;
  }

  .panel-header {
    font-size: 10px; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 1.5px; border-bottom: 1px solid var(--border-color);
    padding-bottom: 8px; margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: center;
  }

  /* Legend Grid */
  .legend-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }

  .legend-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--text-dim);
    padding: 6px 8px;
    border: 1px solid transparent;
    border-radius: 4px;
    transition: all 0.2s ease;
    font-family: var(--font-mono);
    font-weight: 600;
  }

  .legend-item.active {
    color: #fff;
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.1);
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
  }

  .indicator {
    width: 10px; height: 10px;
    border-radius: 2px;
    background: currentColor;
    box-shadow: 0 0 8px currentColor;
  }

  /* Right Side Inspector - Moved for Hierarchy */
  .inspector-zone {
    position: absolute;
    top: 50%; right: 20px;
    transform: translateY(-50%);
    width: 260px;
    display: flex; flex-direction: column; gap: 12px;
  }

  /* Stats Grid */
  .stats-grid {
    display: grid; grid-template-columns: 1fr; gap: 14px;
    margin-bottom: 14px;
  }

  .stat-row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13px;
  }

  .stat-label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { 
    color: var(--text-main); 
    font-family: var(--font-mono); 
    font-size: 16px; 
    font-weight: 700; 
  }

  /* Health Bar */
  .bar-track {
    width: 100%; height: 8px; background: rgba(0,0,0,0.4);
    border-radius: 2px; overflow: hidden;
    margin-top: 6px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .bar-fill {
    height: 100%; background: var(--color-player);
    width: 100%; transition: width 0.1s linear;
    box-shadow: 0 0 10px var(--color-player);
  }

  /* Controls */
  .controls {
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid var(--border-color);
    padding-top: 12px;
  }

  .hint {
    font-size: 10px; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 0.5px; font-family: var(--font-mono);
    background: rgba(0,0,0,0.2); padding: 4px 6px; border-radius: 3px;
  }

  .btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border-color);
    color: var(--text-dim);
    padding: 6px 12px; font-size: 10px;
    text-transform: uppercase; letter-spacing: 1px;
    cursor: pointer; transition: all 0.2s;
    font-family: var(--font-mono);
    font-weight: 700;
  }

  .btn:hover {
    background: rgba(255,255,255,0.1);
    color: #fff; border-color: #fff;
  }

  /* Scanlines */
  .scanlines {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
    background-size: 100% 4px;
    pointer-events: none; z-index: 20; opacity: 0.15;
  }

</style>
</head>
<body>

  <div class="grid-bg"></div>
  <div class="scanlines"></div>
  <canvas id="arena"></canvas>

  <div class="ui-layer">
    <!-- Top Header & Legend -->
    <header>
      <div class="brand">
        <h1>Tactical AI // Sim_v3.0</h1>
        <p>Behavior Tree Visualization</p>
      </div>

      <div class="top-right-zone">
        <div class="panel legend-panel">
          <div class="panel-header">
            <span>State Legend</span>
          </div>
          <div class="legend-grid">
            <div class="legend-item" id="leg-patrol">
              <div class="indicator" style="color:var(--color-patrol);"></div>
              PATROL
            </div>
            <div class="legend-item" id="leg-alert">
              <div class="indicator" style="color:var(--color-alert);"></div>
              ALERT
            </div>
            <div class="legend-item" id="leg-chase">
              <div class="indicator" style="color:var(--color-chase);"></div>
              CHASE
            </div>
            <div class="legend-item" id="leg-attack">
              <div class="indicator" style="color:var(--color-attack);"></div>
              ATTACK
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Right Side Inspector (Centered Vertically) -->
    <div class="inspector-zone">
      
      <!-- Player Status Panel -->
      <div class="panel">
        <div class="panel-header">
          <span>Player Health</span>
          <span style="color:var(--color-player)">●</span>
        </div>
        
        <div class="stats-grid">
          <div class="stat-group">
            <div class="stat-row">
              <span class="stat-label">Integrity</span>
              <span class="stat-value" id="hp-val">100%</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" id="hp-bar"></div>
            </div>
          </div>

          <div class="stat-row">
            <span class="stat-label">Active Threats</span>
            <span class="stat-value" id="threat-val">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Nearest Hostile</span>
            <span class="stat-value" id="dist-val">--</span>
          </div>
        </div>

        <div class="controls">
          <span class="hint">WASD / Arrows</span>
          <button class="btn" id="btn-reset">Reset Sim</button>
        </div>
      </div>
    </div>
  </div>

<script>
/**
 * ENGINE & LOGIC
 */
const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d');

// UI Elements
const ui = {
  hpVal: document.getElementById('hp-val'),
  hpBar: document.getElementById('hp-bar'),
  threatVal: document.getElementById('threat-val'),
  distVal: document.getElementById('dist-val'),
  resetBtn: document.getElementById('btn-reset'),
  legends: {
    PATROL: document.getElementById('leg-patrol'),
    ALERT: document.getElementById('leg-alert'),
    CHASE: document.getElementById('leg-chase'),
    ATTACK: document.getElementById('leg-attack')
  }
};

// Configuration
const COLORS = {
  PATROL: '#38bdf8',
  ALERT: '#facc15',
  CHASE: '#f97316',
  ATTACK: '#f43f5e',
  PLAYER: '#34d399',
  WALL: '#0f172a',
  WALL_BORDER: '#334155'
};

const STATES = {
  PATROL: 'PATROL',
  ALERT: 'ALERT',
  CHASE: 'CHASE',
  ATTACK: 'ATTACK'
};

// Game State
let width, height;
let player = { x: 0, y: 0, radius: 14, hp: 100, speed: 6, angle: 0 };
let enemies = [];
let walls = [];
let keys = {};
let time = 0;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  initWorld();
}

function initWorld() {
  player.x = width * 0.15;
  player.y = height * 0.5;
  player.hp = 100;
  ui.hpBar.style.width = '100%';
  ui.hpBar.style.backgroundColor = COLORS.PLAYER;
  ui.hpVal.style.color = '#fff';

  // Walls - Materialized Environment
  walls = [
    { x: width * 0.35, y: height * 0.2, w: 20, h: height * 0.3 },
    { x: width * 0.65, y: height * 0.5, w: 20, h: height * 0.3 },
    { x: width * 0.4, y: height * 0.5, w: 150, h: 20 },
    { x: width * 0.2, y: height * 0.2, w: 120, h: 120 },
    { x: width * 0.75, y: height * 0.2, w: 120, h: 120 },
    { x: width * 0.75, y: height * 0.7, w: 120, h: 120 },
    { x: width * 0.1, y: height * 0.8, w: 150, h: 20 }
  ];

  // Enemies - Distributed States
  enemies = [];
  // Patrols (Ghost effect)
  enemies.push(new Enemy(width * 0.5, height * 0.1, STATES.PATROL));
  enemies.push(new Enemy(width * 0.8, height * 0.8, STATES.PATROL));
  enemies.push(new Enemy(width * 0.2, height * 0.8, STATES.PATROL));
  // Alert (Yellow)
  enemies.push(new Enemy(width * 0.85, height * 0.2, STATES.ALERT));
  // Chase (Orange)
  enemies.push(new Enemy(width * 0.6, height * 0.6, STATES.CHASE));
  // Attack (Red - High Threat)
  enemies.push(new Enemy(width * 0.3, height * 0.4, STATES.ATTACK));
  // Extra Patrol
  enemies.push(new Enemy(width * 0.9, height * 0.5, STATES.PATROL));
}

class Enemy {
  constructor(x, y, initialState) {
    this.x = x;
    this.y = y;
    this.radius = 12;
    this.angle = 0;
    this.state = initialState;
    this.speed = 2.5;
    
    // Patrol
    this.patrolTarget = this.getRandomPatrolPoint();
    this.patrolPath = []; 
    
    // Alert
    this.alertTimer = 60;
    this.alertPos = null;
    
    // Attack
    this.attackCooldown = 0;
  }

  getRandomPatrolPoint() {
    return {
      x: Math.random() * (width - 100) + 50,
      y: Math.random() * (height - 100) + 50
    };
  }

  update() {
    const distToPlayer = Math.hypot(player.x - this.x, player.y - this.y);
    const angleToPlayer = Math.atan2(player.y - this.y, player.x - this.x);
    
    let canSeePlayer = false;
    // Vision Logic
    if (distToPlayer < 350) { 
      let angleDiff = angleToPlayer - this.angle;
      while (angleDiff <= -Math.PI) angleDiff += Math.PI*2;
      while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
      
      if (Math.abs(angleDiff) < Math.PI / 3) { // 120deg FOV
        canSeePlayer = !checkWallCollision(this.x, this.y, player.x, player.y);
      }
    }

    const oldState = this.state;

    switch(this.state) {
      case STATES.PATROL:
        this.angle = Math.atan2(this.patrolTarget.y - this.y, this.patrolTarget.x - this.x);
        this.moveTowards(this.patrolTarget.x, this.patrolTarget.y);
        
        // Record path for visualization (Thick dashed lines)
        if (time % 5 === 0) {
          this.patrolPath.push({x: this.x, y: this.y});
          if (this.patrolPath.length > 20) this.patrolPath.shift();
        }

        if (distToPlayer < 350 && canSeePlayer) {
          this.state = STATES.ALERT;
          this.alertTimer = 90; 
          this.alertPos = {x: player.x, y: player.y};
        } else if (Math.hypot(this.patrolTarget.x - this.x, this.patrolTarget.y - this.y) < 5) {
          this.patrolTarget = this.getRandomPatrolPoint();
        }
        break;

      case STATES.ALERT:
        this.angle = angleToPlayer;
        this.alertTimer--;
        if (this.alertTimer <= 0) {
          if (canSeePlayer) this.state = STATES.CHASE;
          else this.state = STATES.PATROL;
        }
        break;

      case STATES.CHASE:
        this.angle = angleToPlayer;
        if (canSeePlayer) {
          if (distToPlayer < 60) {
            this.state = STATES.ATTACK;
          } else {
            this.moveTowards(player.x, player.y, 4.5); // Faster
          }
        } else {
          this.state = STATES.ALERT;
          this.alertTimer = 60;
        }
        break;

      case STATES.ATTACK:
        this.angle = angleToPlayer;
        this.attackCooldown--;
        if (this.attackCooldown <= 0) {
          player.hp -= 8;
          this.attackCooldown = 20;
          createParticle(player.x, player.y, COLORS.ATTACK);
        }
        if (distToPlayer > 250) {
          this.state = STATES.CHASE;
        }
        break;
    }
  }

  moveTowards(tx, ty, spdOverride = null) {
    const dx = tx - this.x;
    const dy = ty - this.y;
    const dist = Math.hypot(dx, dy);
    const spd = spdOverride || this.speed;
    
    if (dist > 0) {
      let nx = (dx / dist) * spd;
      let ny = (dy / dist) * spd;
      
      if (!checkCircleWallCollision(this.x + nx, this.y + ny, this.radius)) {
        this.x += nx;
        this.y += ny;
      } else {
        // Slide
        if (!checkCircleWallCollision(this.x + nx, this.y, this.radius)) this.x += nx;
        else if (!checkCircleWallCollision(this.x, this.y + ny, this.radius)) this.y += ny;
      }
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);

    // 1. Visualize Pathfinding (Patrol) - Thick, distinct lines
    if (this.state === STATES.PATROL && this.patrolPath.length > 1) {
      ctx.save();
      ctx.translate(-this.x, -this.y); 
      ctx.beginPath();
      ctx.strokeStyle = COLORS.PATROL;
      ctx.lineWidth = 3; // Thicker
      ctx.setLineDash([8, 8]);
      ctx.lineDashOffset = -time; // Animate dashes
      ctx.globalAlpha = 0.4;
      ctx.moveTo(this.patrolPath[0].x, this.patrolPath[0].y);
      for(let p of this.patrolPath) ctx.lineTo(p.x, p.y);
      ctx.lineTo(this.x, this.y); 
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    // 2. Detection Cones - Semi-transparent & Volumetric
    if (this.state !== STATES.PATROL) {
      ctx.save();
      ctx.rotate(this.angle);
      
      const range = 350;
      const fov = Math.PI / 2.5;
      let strokeCol = this.state === STATES.ATTACK ? COLORS.ATTACK : (this.state === STATES.CHASE ? COLORS.CHASE : COLORS.ALERT);
      
      // Gradient Fill for Cone
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, range);
      grad.addColorStop(0, strokeCol + '40'); // 25% opacity
      grad.addColorStop(1, strokeCol + '00'); // 0% opacity

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, range, -fov, fov);
      ctx.lineTo(0, 0);
      
      ctx.fillStyle = grad;
      ctx.fill();
      
      // Wireframe borders
      ctx.strokeStyle = strokeCol;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.3;
      ctx.stroke();
      ctx.restore();
    }

    // 3. Draw Unit Shape
    ctx.rotate(this.angle);
    
    // Glow effect
    ctx.shadowBlur = 15;
    ctx.shadowColor = this.getColor();
    ctx.fillStyle = this.getColor();
    
    ctx.beginPath();
    const pulse = Math.sin(time * 0.3) * 2;
    
    if (this.state === STATES.PATROL) {
      // Ghost/Motion Blur Effect
      ctx.globalAlpha = 0.8;
      ctx.arc(0, 0, this.radius, 0, Math.PI*2);
      // Trail
      ctx.beginPath();
      ctx.fillStyle = this.getColor();
      ctx.globalAlpha = 0.3;
      ctx.arc(-10, 0, this.radius * 0.8, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 0.8;
      ctx.fill();
    } 
    else if (this.state === STATES.ALERT) {
      // Focused Search Shape (Diamond)
      ctx.globalAlpha = 1.0;
      ctx.moveTo(14, 0);
      ctx.lineTo(0, 8);
      ctx.lineTo(-10, 0);
      ctx.lineTo(0, -8);
      ctx.fill();
      // Sonar pulse ring
      if (time % 30 < 15) {
        ctx.beginPath();
        ctx.strokeStyle = this.getColor();
        ctx.lineWidth = 2;
        ctx.arc(0,0, 20 + (time%30), 0, Math.PI*2);
        ctx.stroke();
      }
    } 
    else if (this.state === STATES.CHASE) {
      // Forward leaning Triangle
      ctx.globalAlpha = 1.0;
      ctx.moveTo(16, 0);
      ctx.lineTo(-10, 10);
      ctx.lineTo(-6, 0);
      ctx.lineTo(-10, -10);
      ctx.fill();
    } 
    else {
      // ATTACK: Kinetic Urgency
      ctx.globalAlpha = 1.0;
      ctx.moveTo(18 + pulse, 0);
      ctx.lineTo(0, 14);
      ctx.lineTo(-10, 0);
      ctx.lineTo(0, -14);
      ctx.fill();
      
      // Attack Vector / Beam
      ctx.beginPath();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.moveTo(10, 0);
      ctx.lineTo(40 + pulse, 0); // Beam forward
      ctx.stroke();
      
      // Pulsating Danger Zone
      ctx.beginPath();
      ctx.arc(0, 0, 60, 0, Math.PI*2);
      ctx.strokeStyle = COLORS.ATTACK;
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.lineDashOffset = time;
      ctx.globalAlpha = 0.5;
      ctx.stroke();
    }
    
    // Inner Core
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();

    // 4. State Label - High Contrast Pill
    ctx.save();
    ctx.translate(this.x, this.y + 30);
    
    // Label Background
    const textWidth = ctx.measureText(this.state).width;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    // Rounded rect manually
    ctx.beginPath();
    ctx.roundRect(-textWidth/2 - 6, -10, textWidth + 12, 14, 4);
    ctx.fill();
    
    ctx.strokeStyle = this.getColor();
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Label Text
    ctx.fillStyle = '#fff';
    ctx.font = '700 10px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.state, 0, -3);
    
    ctx.restore();
  }

  getColor() {
    switch(this.state) {
      case STATES.PATROL: return COLORS.PATROL;
      case STATES.ALERT: return COLORS.ALERT;
      case STATES.CHASE: return COLORS.CHASE;
      case STATES.ATTACK: return COLORS.ATTACK;
      default: return '#fff';
    }
  }
}

// Helpers
function checkWallCollision(x1, y1, x2, y2) {
  for (let w of walls) {
    // Simple AABB check for line of sight
    if (x1 < w.x + w.w && x2 > w.x && y1 < w.y + w.h && y2 > w.y) return true;
    if (x2 < w.x + w.w && x1 > w.x && y2 < w.y + w.h && y1 > w.y) return true;
  }
  return false;
}

function checkCircleWallCollision(x, y, r) {
  for (let w of walls) {
    let testX = x;
    let testY = y;
    if (x < w.x) testX = w.x;
    else if (x > w.x + w.w) testX = w.x + w.w;
    if (y < w.y) testY = w.y;
    else if (y > w.y + w.h) testY = w.y + w.h;
    let distX = x - testX;
    let distY = y - testY;
    let distance = Math.sqrt((distX*distX) + (distY*distY));
    if (distance <= r) return true;
  }
  return false;
}

let particles = [];
function createParticle(x, y, color) {
  for(let i=0; i<4; i++) {
    particles.push({
      x, y, color, 
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8,
      life: 15, size: Math.random() * 3 + 1
    });
  }
}

// Input Handling
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('resize', resize);
ui.resetBtn.addEventListener('click', initWorld);

// Main Loop
function loop() {
  time++;
  ctx.clearRect(0, 0, width, height);

  // Update Player
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy = -1;
  if (keys['s'] || keys['arrowdown']) dy = 1;
  if (keys['a'] || keys['arrowleft']) dx = -1;
  if (keys['d'] || keys['arrowright']) dx = 1;

  let isMoving = (dx !== 0 || dy !== 0);
  if (isMoving) {
    let len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    player.angle = Math.atan2(dy, dx);
    let nextX = player.x + dx * player.speed;
    let nextY = player.y + dy * player.speed;
    if (!checkCircleWallCollision(nextX, player.y, player.radius)) player.x = nextX;
    if (!checkCircleWallCollision(player.x, nextY, player.radius)) player.y = nextY;
  }

  // Draw Walls - Materialized Environment
  for (let w of walls) {
    // Shadow (Depth)
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(w.x + 6, w.y + 6, w.w, w.h); 
    
    // Base
    ctx.fillStyle = COLORS.WALL;
    ctx.fillRect(w.x, w.y, w.w, w.h);
    
    // Border
    ctx.strokeStyle = COLORS.WALL_BORDER;
    ctx.lineWidth = 2;
    ctx.strokeRect(w.x, w.y, w.w, w.h);
    
    // Top Edge Highlight (Bevel effect)
    ctx.beginPath();
    ctx.moveTo(w.x, w.y);
    ctx.lineTo(w.x + w.w, w.y);
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Update & Draw Enemies
  const stateCounts = { PATROL: 0, ALERT: 0, CHASE: 0, ATTACK: 0 };
  let nearestDist = 9999;
  let activeThreats = 0;
  
  for (let e of enemies) {
    e.update();
    e.draw();
    stateCounts[e.state]++;
    
    let d = Math.hypot(player.x - e.x, player.y - e.y);
    if (d < nearestDist) nearestDist = d;
    if (e.state === STATES.CHASE || e.state === STATES.ATTACK) activeThreats++;
  }

  // Draw Player
  ctx.save();
  ctx.translate(player.x, player.y);
  
  // Strong Glow
  ctx.shadowColor = COLORS.PLAYER;
  ctx.shadowBlur = 20;
  
  // Body
  ctx.fillStyle = COLORS.PLAYER;
  ctx.beginPath();
  ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
  ctx.fill();
  
  // Inner Direction Indicator
  ctx.rotate(player.angle);
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(6, 0);
  ctx.lineTo(-6, 6);
  ctx.lineTo(-6, -6);
  ctx.fill();
  
  ctx.restore();

  // Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 15;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  ctx.globalAlpha = 1;

  // Update UI
  ui.hpVal.textContent = Math.max(0, Math.round(player.hp)) + '%';
  ui.hpBar.style.width = Math.max(0, Math.round(player.hp)) + '%';
  
  if (player.hp < 30) {
    ui.hpBar.style.backgroundColor = COLORS.ATTACK;
    ui.hpBar.style.boxShadow = `0 0 10px ${COLORS.ATTACK}`;
    ui.hpVal.style.color = COLORS.ATTACK;
  } else {
    ui.hpBar.style.backgroundColor = COLORS.PLAYER;
    ui.hpBar.style.boxShadow = `0 0 10px ${COLORS.PLAYER}`;
    ui.hpVal.style.color = '#fff';
  }

  ui.threatVal.textContent = activeThreats;
  ui.threatVal.style.color = activeThreats > 0 ? COLORS.ATTACK : 'var(--text-dim)';
  ui.distVal.textContent = Math.round(nearestDist) + 'm';

  // Update Legend Highlights
  for (let s in stateCounts) {
    const el = ui.legends[s];
    if (stateCounts[s] > 0) el.classList.add('active');
    else el.classList.remove('active');
  }

  requestAnimationFrame(loop);
}

// Start
resize();
loop();

</script>
