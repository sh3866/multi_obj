<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Tactics: AI Behavior Visualizer</title>
<style>
  :root {
    --bg-deep: #05080a;
    --bg-panel: rgba(8, 15, 22, 0.85);
    
    /* Semantic Colors */
    --color-patrol: #0ea5e9;   /* Sky Blue */
    --color-alert: #f59e0b;    /* Amber */
    --color-chase: #f97316;    /* Orange */
    --color-attack: #ef4444;   /* Red */
    --color-player: #10b981;   /* Emerald */
    --color-grid: rgba(30, 41, 59, 0.4);
    
    /* Typography */
    --font-mono: "SF Mono", "Roboto Mono", "Menlo", "Consolas", "Courier New", monospace;
  }

  body {
    margin: 0; padding: 0;
    background-color: var(--bg-deep);
    color: #e2e8f0;
    font-family: var(--font-mono);
    overflow: hidden;
    height: 100vh; width: 100vw;
    user-select: none;
  }

  /* Background Grid - Subtle Topographic/Blueprint feel */
  .grid-bg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      linear-gradient(var(--color-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--color-grid) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
    pointer-events: none;
    opacity: 0.5;
  }

  canvas {
    position: absolute; top: 0; left: 0;
    z-index: 1;
    cursor: crosshair;
  }

  /* UI Layer */
  .ui-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 20px; box-sizing: border-box;
  }

  /* Panels */
  .panel {
    background: var(--bg-panel);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 4px;
    padding: 16px;
    pointer-events: auto;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
  }
  
  /* Decorative corner accents */
  .panel::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 8px; height: 8px;
    border-top: 2px solid var(--color-player);
    border-left: 2px solid var(--color-player);
  }
  .panel::after {
    content: ''; position: absolute; bottom: 0; right: 0;
    width: 8px; height: 8px;
    border-bottom: 2px solid var(--color-player);
    border-right: 2px solid var(--color-player);
  }

  /* Header */
  header {
    display: flex; justify-content: space-between; align-items: flex-start;
  }

  .brand {
    display: flex; flex-direction: column;
  }

  .brand h1 {
    font-size: 20px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; margin: 0 0 6px 0;
    color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
  }

  .brand p {
    font-size: 11px; color: var(--color-player);
    margin: 0; opacity: 0.8; letter-spacing: 1px;
  }

  /* Legend Panel - Top Right */
  .legend-panel {
    display: flex; flex-direction: column; gap: 8px;
    min-width: 180px;
  }

  .legend-title {
    font-size: 10px; color: #64748b; text-transform: uppercase;
    letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 4px; margin-bottom: 2px;
  }

  .legend-item {
    display: flex; align-items: center; gap: 10px;
    font-size: 11px; font-weight: 500; color: #94a3b8;
    transition: all 0.3s;
  }

  .legend-item.active {
    color: #fff;
    transform: translateX(4px);
  }

  .indicator {
    width: 8px; height: 8px;
    position: relative;
  }
  
  .indicator::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 16px; height: 16px;
    background: currentColor; opacity: 0.2;
    border-radius: 50%;
    filter: blur(4px);
  }

  /* Inspector Panel - Bottom Left */
  .inspector-container {
    display: flex; justify-content: flex-start; align-items: flex-end;
  }

  .inspector-panel {
    width: 300px;
  }

  .stat-group {
    margin-bottom: 12px;
  }

  .stat-label {
    display: flex; justify-content: space-between;
    font-size: 11px; color: #64748b; margin-bottom: 4px;
  }

  .stat-value {
    color: #e2e8f0; font-weight: 600;
  }

  /* Health Bar */
  .bar-track {
    width: 100%; height: 4px; background: rgba(255,255,255,0.1);
    border-radius: 2px; overflow: hidden;
  }
  .bar-fill {
    height: 100%; background: var(--color-player);
    width: 100%; transition: width 0.2s ease-out;
    box-shadow: 0 0 8px var(--color-player);
  }

  /* State Log (Replaces raw coords) */
  .state-log {
    font-size: 10px; color: #94a3b8;
    background: rgba(0,0,0,0.3);
    padding: 8px; border-radius: 2px;
    margin-top: 8px; border-left: 2px solid #475569;
    min-height: 36px;
  }
  .log-entry { margin-bottom: 2px; }
  .log-entry span { color: #fff; }

  /* Controls */
  .controls {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 12px; padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.05);
  }

  .hint {
    font-size: 10px; color: #475569; text-transform: uppercase;
  }

  .btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: #94a3b8;
    padding: 6px 12px; font-size: 10px;
    text-transform: uppercase; letter-spacing: 1px;
    cursor: pointer; transition: all 0.2s;
    border-radius: 2px;
    font-family: var(--font-mono);
  }

  .btn:hover {
    background: rgba(255,255,255,0.1);
    color: #fff; border-color: rgba(255,255,255,0.3);
  }

  /* Scanline effect overlay */
  .scanlines {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
    background-size: 100% 4px;
    pointer-events: none; z-index: 20; opacity: 0.3;
  }

</style>
</head>
<body>

  <div class="grid-bg"></div>
  <div class="scanlines"></div>
  <canvas id="arena"></canvas>

  <div class="ui-layer">
    <!-- Top Header -->
    <header>
      <div class="brand">
        <h1>Neural Tactics</h1>
        <p>Enemy AI Behavior Visualization // Sim_v2.4</p>
      </div>

      <div class="panel legend-panel">
        <div class="legend-title">AI State Legend</div>
        <div class="legend-item" id="leg-patrol">
          <div class="indicator" style="color:var(--color-patrol); background:var(--color-patrol)"></div>
          PATROL (Idle)
        </div>
        <div class="legend-item" id="leg-alert">
          <div class="indicator" style="color:var(--color-alert); background:var(--color-alert)"></div>
          ALERT (Search)
        </div>
        <div class="legend-item" id="leg-chase">
          <div class="indicator" style="color:var(--color-chase); background:var(--color-chase)"></div>
          CHASE (Pursuit)
        </div>
        <div class="legend-item" id="leg-attack">
          <div class="indicator" style="color:var(--color-attack); background:var(--color-attack)"></div>
          ATTACK (Engage)
        </div>
      </div>
    </header>

    <!-- Bottom Inspector -->
    <div class="inspector-container">
      <div class="panel inspector-panel">
        <div class="legend-title">Player Status</div>
        
        <div class="stat-group">
          <div class="stat-label">
            <span>Integrity</span>
            <span class="stat-value" id="hp-val">100%</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" id="hp-bar"></div>
          </div>
        </div>

        <div class="stat-group">
          <div class="stat-label">
            <span>Active Threats</span>
            <span class="stat-value" id="threat-val">0</span>
          </div>
          <div class="stat-label">
            <span>Nearest Enemy</span>
            <span class="stat-value" id="dist-val">--</span>
          </div>
        </div>

        <div class="state-log" id="log-container">
          <div class="log-entry">> System initialized.</div>
        </div>

        <div class="controls">
          <span class="hint">WASD / Arrows to Move</span>
          <button class="btn" id="btn-reset">Reset Simulation</button>
        </div>
      </div>
    </div>
  </div>

<script>
/**
 * ENGINE & LOGIC
 */
const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d');

// UI Elements
const ui = {
  hpVal: document.getElementById('hp-val'),
  hpBar: document.getElementById('hp-bar'),
  threatVal: document.getElementById('threat-val'),
  distVal: document.getElementById('dist-val'),
  logContainer: document.getElementById('log-container'),
  resetBtn: document.getElementById('btn-reset'),
  legends: {
    PATROL: document.getElementById('leg-patrol'),
    ALERT: document.getElementById('leg-alert'),
    CHASE: document.getElementById('leg-chase'),
    ATTACK: document.getElementById('leg-attack')
  }
};

// Configuration
const COLORS = {
  PATROL: '#0ea5e9',
  ALERT: '#f59e0b',
  CHASE: '#f97316',
  ATTACK: '#ef4444',
  PLAYER: '#10b981',
  WALL: '#0f172a',
  WALL_BORDER: '#334155'
};

const STATES = {
  PATROL: 'PATROL',
  ALERT: 'ALERT',
  CHASE: 'CHASE',
  ATTACK: 'ATTACK'
};

// Game State
let width, height;
let player = { x: 0, y: 0, radius: 12, hp: 100, speed: 5, angle: 0 };
let enemies = [];
let walls = [];
let keys = {};
let time = 0;
let logMsgs = [];

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  initWorld();
}

function log(msg, type = 'INFO') {
  const el = document.createElement('div');
  el.className = 'log-entry';
  const color = type === 'DANGER' ? 'var(--color-attack)' : (type === 'WARN' ? 'var(--color-alert)' : '#fff');
  el.innerHTML = `<span style="color:${color}">[${type}]</span> ${msg}`;
  ui.logContainer.appendChild(el);
  ui.logContainer.scrollTop = ui.logContainer.scrollHeight;
  
  // Keep only last 3
  if (ui.logContainer.children.length > 3) {
    ui.logContainer.removeChild(ui.logContainer.children[0]);
  }
}

function initWorld() {
  player.x = width * 0.2;
  player.y = height * 0.5;
  player.hp = 100;
  ui.hpBar.style.width = '100%';
  ui.hpBar.style.backgroundColor = 'var(--color-player)';
  log("Simulation reset complete.");

  // Walls
  walls = [
    { x: width * 0.4, y: height * 0.2, w: 20, h: height * 0.3 },
    { x: width * 0.6, y: height * 0.5, w: 20, h: height * 0.3 },
    { x: width * 0.5, y: height * 0.5, w: 150, h: 20 },
    { x: width * 0.2, y: height * 0.2, w: 120, h: 120 },
    { x: width * 0.75, y: height * 0.2, w: 120, h: 120 },
    { x: width * 0.75, y: height * 0.7, w: 120, h: 120 },
  ];

  // Enemies
  enemies = [];
  enemies.push(new Enemy(width * 0.5, height * 0.1, STATES.PATROL));
  enemies.push(new Enemy(width * 0.8, height * 0.8, STATES.CHASE));
  enemies.push(new Enemy(width * 0.85, height * 0.2, STATES.ALERT));
  enemies.push(new Enemy(width * 0.15, height * 0.8, STATES.PATROL));
  enemies.push(new Enemy(width * 0.3, height * 0.4, STATES.ATTACK));
}

class Enemy {
  constructor(x, y, initialState) {
    this.x = x;
    this.y = y;
    this.radius = 14;
    this.angle = 0;
    this.state = initialState;
    this.speed = 3;
    
    // Patrol
    this.patrolTarget = this.getRandomPatrolPoint();
    this.patrolPath = []; 
    
    // Alert
    this.alertTimer = 60;
    this.alertPos = null;
    
    // Attack
    this.attackCooldown = 0;
    this.prevState = null;
  }

  getRandomPatrolPoint() {
    return {
      x: Math.random() * (width - 100) + 50,
      y: Math.random() * (height - 100) + 50
    };
  }

  update() {
    const distToPlayer = Math.hypot(player.x - this.x, player.y - this.y);
    const angleToPlayer = Math.atan2(player.y - this.y, player.x - this.x);
    
    let canSeePlayer = false;
    // Vision Logic
    if (distToPlayer < 350) { 
      let angleDiff = angleToPlayer - this.angle;
      while (angleDiff <= -Math.PI) angleDiff += Math.PI*2;
      while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
      
      if (Math.abs(angleDiff) < Math.PI / 3) { // 120deg FOV
        canSeePlayer = !checkWallCollision(this.x, this.y, player.x, player.y);
      }
    }

    const oldState = this.state;

    switch(this.state) {
      case STATES.PATROL:
        this.angle = Math.atan2(this.patrolTarget.y - this.y, this.patrolTarget.x - this.x);
        this.moveTowards(this.patrolTarget.x, this.patrolTarget.y);
        
        // Record path for visualization
        if (time % 5 === 0) {
          this.patrolPath.push({x: this.x, y: this.y});
          if (this.patrolPath.length > 10) this.patrolPath.shift();
        }

        if (distToPlayer < 350 && canSeePlayer) {
          this.state = STATES.ALERT;
          this.alertTimer = 90; 
          this.alertPos = {x: player.x, y: player.y};
          log(`Enemy @ ${Math.round(this.x)} spotted target`, 'WARN');
        } else if (Math.hypot(this.patrolTarget.x - this.x, this.patrolTarget.y - this.y) < 5) {
          this.patrolTarget = this.getRandomPatrolPoint();
        }
        break;

      case STATES.ALERT:
        this.angle = angleToPlayer;
        this.alertTimer--;
        if (this.alertTimer <= 0) {
          if (canSeePlayer) this.state = STATES.CHASE;
          else this.state = STATES.PATROL;
        }
        break;

      case STATES.CHASE:
        this.angle = angleToPlayer;
        if (canSeePlayer) {
          if (distToPlayer < 60) {
            this.state = STATES.ATTACK;
            log(`Enemy engaged target!`, 'DANGER');
          } else {
            this.moveTowards(player.x, player.y, 5); // Faster
          }
        } else {
          this.state = STATES.ALERT;
          this.alertTimer = 60;
        }
        break;

      case STATES.ATTACK:
        this.angle = angleToPlayer;
        this.attackCooldown--;
        if (this.attackCooldown <= 0) {
          player.hp -= 5;
          this.attackCooldown = 30;
          createParticle(player.x, player.y, COLORS.ATTACK);
        }
        if (distToPlayer > 250) {
          this.state = STATES.CHASE;
        }
        break;
    }
    
    // State Transition Logger
    if (this.state !== oldState) {
      // Only log for the closest enemy to avoid spam
      if (distToPlayer < 400) {
        // log(`Enemy transitioned to ${this.state}`);
      }
    }
  }

  moveTowards(tx, ty, spdOverride = null) {
    const dx = tx - this.x;
    const dy = ty - this.y;
    const dist = Math.hypot(dx, dy);
    const spd = spdOverride || this.speed;
    
    if (dist > 0) {
      let nx = (dx / dist) * spd;
      let ny = (dy / dist) * spd;
      
      if (!checkCircleWallCollision(this.x + nx, this.y + ny, this.radius)) {
        this.x += nx;
        this.y += ny;
      } else {
        // Slide
        if (!checkCircleWallCollision(this.x + nx, this.y, this.radius)) this.x += nx;
        else if (!checkCircleWallCollision(this.x, this.y + ny, this.radius)) this.y += ny;
      }
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);

    // 1. Visualize Pathfinding (Patrol)
    if (this.state === STATES.PATROL && this.patrolPath.length > 1) {
      ctx.save();
      ctx.translate(-this.x, -this.y); // Undo translation to draw in world space
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(14, 165, 233, 0.3)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.moveTo(this.patrolPath[0].x, this.patrolPath[0].y);
      for(let p of this.patrolPath) ctx.lineTo(p.x, p.y);
      // Draw target dot
      ctx.lineTo(this.patrolTarget.x, this.patrolTarget.y);
      ctx.stroke();
      ctx.setLineDash([]);
      
      // Target Marker
      ctx.fillStyle = 'rgba(14, 165, 233, 0.5)';
      ctx.beginPath();
      ctx.arc(this.patrolTarget.x, this.patrolTarget.y, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    // 2. Detection Cones (Wireframe/Sonar style)
    if (this.state !== STATES.PATROL) {
      ctx.save();
      ctx.rotate(this.angle);
      
      const range = 350;
      const fov = Math.PI / 2.5;
      
      // Dynamic color based on state
      let strokeCol = this.state === STATES.ATTACK ? COLORS.ATTACK : (this.state === STATES.CHASE ? COLORS.CHASE : COLORS.ALERT);
      
      // Wireframe Cone
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, range, -fov, fov);
      ctx.lineTo(0, 0);
      
      // Fill with low opacity
      ctx.fillStyle = strokeCol;
      ctx.globalAlpha = 0.1;
      ctx.fill();
      
      // Wireframe borders
      ctx.strokeStyle = strokeCol;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.6;
      ctx.stroke();
      
      // Attack Range Ring (Distinct visual)
      if (this.state === STATES.ATTACK) {
        ctx.beginPath();
        ctx.arc(0, 0, 60, 0, Math.PI*2);
        ctx.strokeStyle = COLORS.ATTACK;
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        
        // Pulsing danger effect
        if (time % 10 < 5) {
           ctx.beginPath();
           ctx.arc(0, 0, 80, 0, Math.PI*2);
           ctx.strokeStyle = COLORS.ATTACK;
           ctx.globalAlpha = 0.2;
           ctx.stroke();
        }
      }
      ctx.restore();
    }

    // 3. Draw Unit Shape (Weaponized Shapes)
    ctx.rotate(this.angle);
    ctx.shadowBlur = 15;
    ctx.shadowColor = this.getColor();
    ctx.fillStyle = this.getColor();
    
    ctx.beginPath();
    const pulse = Math.sin(time * 0.2) * 1.5;
    
    if (this.state === STATES.PATROL) {
      // Dormant Circle
      ctx.arc(0, 0, 10, 0, Math.PI*2);
    } else if (this.state === STATES.ALERT) {
      // Jagged/Alert shape
      ctx.moveTo(12, 0);
      ctx.lineTo(4, 8);
      ctx.lineTo(-6, 4);
      ctx.lineTo(-8, 0);
      ctx.lineTo(-6, -4);
      ctx.lineTo(4, -8);
    } else if (this.state === STATES.CHASE) {
      // Forward leaning triangle
      ctx.moveTo(14, 0);
      ctx.lineTo(-8, 10);
      ctx.lineTo(-4, 0);
      ctx.lineTo(-8, -10);
    } else {
      // ATTACK: Sharp Spear/Diamond
      ctx.moveTo(16 + pulse, 0);
      ctx.lineTo(0, 12);
      ctx.lineTo(-8, 0);
      ctx.lineTo(0, -12);
    }
    ctx.closePath();
    ctx.fill();
    
    // Inner Core
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();

    // 4. State Label (Standardized)
    // Placed below unit, distinct style
    ctx.save();
    ctx.translate(this.x, this.y + 25);
    ctx.fillStyle = this.getColor();
    ctx.font = '600 10px "SF Mono", monospace';
    ctx.textAlign = 'center';
    ctx.globalAlpha = 0.9;
    ctx.fillText(this.state, 0, 0);
    
    // Label background for readability
    const textWidth = ctx.measureText(this.state).width;
    ctx.fillStyle = 'rgba(5, 8, 10, 0.7)';
    ctx.fillRect(-textWidth/2 - 4, -8, textWidth + 8, 10);
    
    ctx.restore();
  }

  getColor() {
    switch(this.state) {
      case STATES.PATROL: return COLORS.PATROL;
      case STATES.ALERT: return COLORS.ALERT;
      case STATES.CHASE: return COLORS.CHASE;
      case STATES.ATTACK: return COLORS.ATTACK;
      default: return '#fff';
    }
  }
}

// Helpers
function checkWallCollision(x1, y1, x2, y2) {
  for (let w of walls) {
    // Simple AABB check for line of sight
    if (x1 < w.x + w.w && x2 > w.x && y1 < w.y + w.h && y2 > w.y) return true;
    if (x2 < w.x + w.w && x1 > w.x && y2 < w.y + w.h && y1 > w.y) return true;
  }
  return false;
}

function checkCircleWallCollision(x, y, r) {
  for (let w of walls) {
    let testX = x;
    let testY = y;
    if (x < w.x) testX = w.x;
    else if (x > w.x + w.w) testX = w.x + w.w;
    if (y < w.y) testY = w.y;
    else if (y > w.y + w.h) testY = w.y + w.h;
    let distX = x - testX;
    let distY = y - testY;
    let distance = Math.sqrt((distX*distX) + (distY*distY));
    if (distance <= r) return true;
  }
  return false;
}

let particles = [];
function createParticle(x, y, color) {
  for(let i=0; i<4; i++) {
    particles.push({
      x, y, color, 
      vx: (Math.random() - 0.5) * 5,
      vy: (Math.random() - 0.5) * 5,
      life: 20, size: Math.random() * 2 + 1
    });
  }
}

// Input Handling
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('resize', resize);
ui.resetBtn.addEventListener('click', initWorld);

// Main Loop
function loop() {
  time++;
  ctx.clearRect(0, 0, width, height);

  // Update Player
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy = -1;
  if (keys['s'] || keys['arrowdown']) dy = 1;
  if (keys['a'] || keys['arrowleft']) dx = -1;
  if (keys['d'] || keys['arrowright']) dx = 1;

  let isMoving = (dx !== 0 || dy !== 0);
  if (isMoving) {
    let len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    player.angle = Math.atan2(dy, dx);
    let nextX = player.x + dx * player.speed;
    let nextY = player.y + dy * player.speed;
    if (!checkCircleWallCollision(nextX, player.y, player.radius)) player.x = nextX;
    if (!checkCircleWallCollision(player.x, nextY, player.radius)) player.y = nextY;
  }

  // Draw Walls (High contrast, sleek)
  for (let w of walls) {
    ctx.fillStyle = COLORS.WALL;
    ctx.fillRect(w.x, w.y, w.w, w.h);
    
    ctx.shadowBlur = 0;
    ctx.strokeStyle = COLORS.WALL_BORDER;
    ctx.lineWidth = 1;
    ctx.strokeRect(w.x, w.y, w.w, w.h);
    
    // Top edge highlight
    ctx.beginPath();
    ctx.moveTo(w.x, w.y);
    ctx.lineTo(w.x + w.w, w.y);
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.stroke();
  }

  // Update & Draw Enemies
  const stateCounts = { PATROL: 0, ALERT: 0, CHASE: 0, ATTACK: 0 };
  let nearestDist = 9999;
  let activeThreats = 0;
  
  for (let e of enemies) {
    e.update();
    e.draw();
    stateCounts[e.state]++;
    
    let d = Math.hypot(player.x - e.x, player.y - e.y);
    if (d < nearestDist) nearestDist = d;
    if (e.state === STATES.CHASE || e.state === STATES.ATTACK) activeThreats++;
  }

  // Draw Player (Strong Identity)
  ctx.save();
  ctx.translate(player.x, player.y);
  
  // Player Glow
  ctx.shadowColor = COLORS.PLAYER;
  ctx.shadowBlur = 15;
  
  // Body
  ctx.fillStyle = COLORS.PLAYER;
  ctx.beginPath();
  ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
  ctx.fill();
  
  // Inner Direction Indicator
  ctx.rotate(player.angle);
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(4, 0);
  ctx.lineTo(-4, 4);
  ctx.lineTo(-4, -4);
  ctx.fill();
  
  ctx.restore();

  // Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 20;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  ctx.globalAlpha = 1;

  // Update UI
  ui.hpVal.textContent = Math.max(0, Math.round(player.hp)) + '%';
  ui.hpBar.style.width = Math.max(0, Math.round(player.hp)) + '%';
  
  if (player.hp < 30) {
    ui.hpBar.style.backgroundColor = COLORS.ATTACK;
    ui.hpBar.style.boxShadow = `0 0 10px ${COLORS.ATTACK}`;
  } else {
    ui.hpBar.style.backgroundColor = COLORS.PLAYER;
    ui.hpBar.style.boxShadow = `0 0 10px ${COLORS.PLAYER}`;
  }

  ui.threatVal.textContent = activeThreats;
  ui.threatVal.style.color = activeThreats > 0 ? COLORS.ATTACK : '#64748b';
  ui.distVal.textContent = Math.round(nearestDist) + 'm';

  // Update Legend Highlights
  for (let s in stateCounts) {
    const el = ui.legends[s];
    if (stateCounts[s] > 0) el.classList.add('active');
    else el.classList.remove('active');
  }

  requestAnimationFrame(loop);
}

// Start
resize();
loop();

</script>
</body>
</html>
