<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crossy Pixel: Redesign</title>
    <style>
        :root {
            --ui-font: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --ui-display: 'Arial Black', 'Impact', sans-serif;
            --ui-shadow: rgba(0,0,0,0.25);
            --ui-accent: #ff4757;
            --ui-text: #2d3436;
            --btn-color: #f5f6fa;
            --btn-active: #dcdde1;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: var(--ui-font);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI OVERLAY */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* HUD - Minimalist & Compact */
        .hud-row {
            display: flex;
            justify-content: flex-end; /* Moved to Right */
            align-items: flex-start;
            padding: 15px;
            width: 100%;
            pointer-events: none;
        }

        .score-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .score-pill {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 99px;
            padding: 6px 16px;
            box-shadow: 0 4px 12px var(--ui-shadow);
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(4px);
            min-width: 100px;
            justify-content: space-between;
            border: 2px solid rgba(0,0,0,0.05);
        }

        .score-pill label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            color: #7f8c8d;
            letter-spacing: 0.5px;
        }

        .score-pill span {
            font-family: var(--ui-display);
            font-size: 20px;
            line-height: 1;
            color: var(--ui-text);
        }

        .score-pill span.pop {
            animation: popAnim 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: var(--ui-accent);
        }

        @keyframes popAnim {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }

        /* CONTROLS - Bottom Center/Right, Compact */
        .controls-wrapper {
            padding: 20px;
            display: flex;
            justify-content: flex-end; /* Moved to Right for better composition */
            align-items: flex-end;
            pointer-events: none;
            margin-bottom: 30px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: 50px 50px 50px;
            grid-template-rows: 50px 50px;
            gap: 6px;
            pointer-events: auto;
        }

        .d-btn {
            background: var(--btn-color);
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 16px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s, background 0.1s;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        .d-btn svg {
            fill: #2d3436;
            width: 20px;
            height: 20px;
        }

        .d-btn:active, .d-btn.active {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.15);
            background: var(--btn-active);
        }

        /* Grid positioning */
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        @media (max-width: 600px) {
            .controls-wrapper { padding: 15px; justify-content: flex-start; }
            .hud-row { justify-content: space-between; }
            .d-pad { transform: scale(0.9); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <!-- HUD -->
        <div class="hud-row">
            <!-- Empty left spacer for balance -->
            <div style="width: 100px;"></div>
            
            <div class="score-container">
                <div class="score-pill">
                    <label>Best</label>
                    <span id="best-score">42</span>
                </div>
                <div class="score-pill">
                    <label>Score</label>
                    <span id="current-score">12</span>
                </div>
            </div>
        </div>

        <!-- CONTROLS -->
        <div class="controls-wrapper">
            <div class="d-pad">
                <div class="d-btn btn-up" data-dir="up">
                    <svg viewBox="0 0 24 24"><path d="M12 5l-8 8h16z"/></svg>
                </div>
                <div class="d-btn btn-left" data-dir="left">
                    <svg viewBox="0 0 24 24"><path d="M5 12l8-8v16z"/></svg>
                </div>
                <div class="d-btn btn-down" data-dir="down">
                    <svg viewBox="0 0 24 24"><path d="M12 19l8-8H4z"/></svg>
                </div>
                <div class="d-btn btn-right" data-dir="right">
                    <svg viewBox="0 0 24 24"><path d="M19 12l-8 8V4z"/></svg>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * CROSSY PIXEL REDESIGN
 * 
 * Applied Changes:
 * 1. Perspective: Flatter camera (Y * 0.6), wider FOV.
 * 2. Colors: Vibrant palette (Saturated Green, Bright Blue, Warm Orange).
 * 3. Lighting: Unified Top-Left light source logic.
 * 4. Character: Chunky, detailed chicken with beak/comb.
 * 5. UI: Clean, pill-shaped HUD elements; compact D-pad.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- CONFIGURATION ---
const CONFIG = {
    fov: 400,           // Wider FOV
    cameraHeight: 160,  // Lower camera
    cameraDist: 120,    // Closer to player
    laneWidth: 50,      // Lane Depth (Z)
    laneSize: 50,       // Lane Width (X)
    colors: {
        // Sky
        skyTop: '#48dbfb',
        skyBot: '#c7ecee',
        // Grass
        grassTop: '#55efc4',
        grassSide: '#00b894',
        grassSideDark: '#009688',
        // Road
        roadTop: '#747d8c',
        roadSide: '#2f3640',
        roadLine: '#dcdde1',
        // Water
        waterTop: '#0abde3',
        waterSide: '#0097e6',
        waterHighlight: '#7ed6df',
        // Wood
        woodTop: '#e1b12c',
        woodSide: '#dda20a',
        woodEnd: '#cd6133',
        // Cars
        carColors: ['#ff7979', '#badc58', '#dff9fb', '#f9ca24']
    }
};

// --- STATE ---
let state = {
    width: 0,
    height: 0,
    centerX: 0,
    centerY: 0,
    playerX: 0,
    playerZ: 0,
    lanes: [],
    score: 12,
    bestScore: 42,
    clouds: [],
    frame: 0
};

// --- UTILS ---
function project(x, y, z) {
    // Camera tracks player Z with a slight offset
    const camZ = state.playerZ + CONFIG.cameraDist;
    // Camera tracks player X with lag (parallax feel)
    const camX = state.playerX * 0.2; 
    
    // Perspective Projection
    const scale = CONFIG.fov / (CONFIG.fov + (z - camZ));
    
    // Map to screen coordinates
    const screenX = state.centerX + (x - camX) * scale;
    // Flatter Y projection (0.6 multiplier)
    const screenY = state.centerY + (y - CONFIG.cameraHeight) * scale * 0.6; 
    
    return { x: screenX, y: screenY, scale: scale };
}

function adjustColor(hex, percent) {
    let c = hexToRgb(hex);
    let r = Math.floor(c.r * (100 + percent) / 100);
    let g = Math.floor(c.g * (100 + percent) / 100);
    let b = Math.floor(c.b * (100 + percent) / 100);
    return `rgb(${Math.min(255,Math.max(0,r))},${Math.min(255,Math.max(0,g))},${Math.min(255,Math.max(0,b))})`;
}

function hexToRgb(hex) {
    let r = parseInt(hex.substring(1,3), 16);
    let g = parseInt(hex.substring(3,5), 16);
    let b = parseInt(hex.substring(5,7), 16);
    return {r, g, b};
}

// --- CLASSES ---

class Cloud {
    constructor(z) {
        this.x = (Math.random() - 0.5) * 6000;
        this.y = (Math.random() * 100) + 100; 
        this.z = z;
        this.size = 1 + Math.random() * 1.5;
    }
    draw() {
        const p = project(this.x, this.y, this.z);
        if (p.scale <= 0) return;
        
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        const s = 60 * p.scale * this.size;
        const y = p.y;
        const x = p.x;
        
        // Voxel Cloud Construction
        // Bottom wide layer
        ctx.fillRect(x - s, y, s*3, s*0.6);
        // Middle layer
        ctx.fillRect(x - s*0.5, y - s*0.4, s*2, s*0.6);
        // Top layer
        ctx.fillRect(x, y - s*0.8, s, s*0.6);
    }
}

class Tree {
    constructor(z) {
        this.x = (Math.random() > 0.5 ? 1 : -1) * (80 + Math.random() * 120);
        this.z = z;
        this.size = 0.8 + Math.random() * 0.6;
        this.type = Math.random() > 0.3 ? 'pine' : 'bush';
    }
    draw() {
        const p = project(this.x, 0, this.z);
        if (p.scale <= 0) return;
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, 30 * p.scale * this.size, 15 * p.scale * this.size, 0, 0, Math.PI*2);
        ctx.fill();

        if (this.type === 'pine') {
            const h = 100 * p.scale * this.size;
            const w = 40 * p.scale * this.size;
            
            // Trunk
            ctx.fillStyle = '#6D4C41';
            ctx.fillRect(p.x - w/6, p.y - h/3, w/3, h/3);
            
            // Leaves (Layered)
            const drawLayer = (yOff, wScale, colTop, colSide) => {
                const layerW = w * wScale * 2;
                const layerH = h * 0.35;
                const layerY = p.y - h + yOff;
                
                // Top Face
                ctx.fillStyle = colTop;
                ctx.fillRect(p.x - layerW/2, layerY, layerW, layerH);
                // Right Face
                ctx.fillStyle = colSide;
                ctx.fillRect(p.x, layerY, layerW/2, layerH);
                // Left Face (implied by top face logic usually, but we can draw a sliver)
                // Actually, for simple voxel, we just need top and right for this angle
            };
            
            drawLayer(0, 1, '#2ecc71', '#27ae60');
            drawLayer(h*0.3, 0.8, '#2ecc71', '#27ae60');
            drawLayer(h*0.6, 0.6, '#2ecc71', '#27ae60');
        } else {
            // Bush
            const s = 25*p.scale*this.size;
            // Base
            ctx.fillStyle = '#00b894';
            ctx.fillRect(p.x-s, p.y-s, s*2, s*2);
            // Top Highlight
            ctx.fillStyle = '#55efc4';
            ctx.fillRect(p.x-s, p.y-s, s*2, s*0.5);
        }
    }
}

class Lane {
    constructor(zIndex) {
        this.zIndex = zIndex;
        this.z = zIndex * CONFIG.laneWidth;
        this.type = this.determineType(zIndex);
        this.traffic = [];
        this.logs = [];
        this.trees = [];

        // Scenery Generation
        if (this.type === 'grass') {
            if (Math.random() > 0.4) this.trees.push(new Tree(this.z));
            if (Math.random() > 0.6) this.trees.push(new Tree(this.z));
        }
        
        // Hazard Generation
        if (this.type === 'road') {
            this.speed = (Math.random() > 0.5 ? 1 : -1) * (4 + Math.random() * 3);
            const count = 1 + Math.floor(Math.random() * 2);
            for(let i=0; i<count; i++) {
                this.traffic.push({
                    x: i * 500 - 200 + (Math.random()*100),
                    width: 50, height: 35, depth: 90,
                    color: CONFIG.colors.carColors[Math.floor(Math.random()*4)]
                });
            }
        } else if (this.type === 'water') {
            this.speed = (Math.random() > 0.5 ? 1 : -1) * 2;
            for(let i=0; i<3; i++) {
                this.logs.push({
                    x: i * 350 - 200,
                    width: 120 + Math.random() * 40,
                    height: 12, depth: 35
                });
            }
        }
    }

    determineType(z) {
        // Pattern: Grass, Road, Water, Grass, Road...
        const mod = Math.abs(z) % 5;
        if (mod === 0 || mod === 1) return 'grass';
        if (mod === 2) return 'road';
        if (mod === 3) return 'water';
        return 'grass';
    }

    update() {
        if (this.type === 'road') {
            this.traffic.forEach(car => {
                car.x += this.speed;
                if (this.speed > 0 && car.x > 1200) car.x = -800;
                if (this.speed < 0 && car.x < -1200) car.x = 800;
            });
        }
        if (this.type === 'water') {
            this.logs.forEach(log => {
                log.x += this.speed;
                if (this.speed > 0 && log.x > 1200) log.x = -800;
                if (this.speed < 0 && log.x < -1200) log.x = 800;
            });
        }
    }

    draw() {
        // Calculate corners
        const pLeft = project(-600, 0, this.z);
        const pRight = project(600, 0, this.z);
        const pBackLeft = project(-600, 0, this.z + CONFIG.laneWidth);
        const pBackRight = project(600, 0, this.z + CONFIG.laneWidth);

        // 1. Side Wall (Depth)
        ctx.beginPath();
        ctx.moveTo(pLeft.x, pLeft.y);
        ctx.lineTo(pRight.x, pRight.y);
        ctx.lineTo(pBackRight.x, pBackRight.y);
        ctx.lineTo(pBackLeft.x, pBackLeft.y);
        ctx.closePath();
        
        let sideColor, topColor;
        if (this.type === 'grass') {
            sideColor = CONFIG.colors.grassSide;
            // Checkerboard grass
            topColor = (Math.floor(this.zIndex) % 2 === 0) ? CONFIG.colors.grassTop : '#45e0b6';
        } else if (this.type === 'road') {
            sideColor = CONFIG.colors.roadSide;
            topColor = CONFIG.colors.roadTop;
        } else if (this.type === 'water') {
            sideColor = CONFIG.colors.waterSide;
            topColor = CONFIG.colors.waterTop;
        }
        
        ctx.fillStyle = sideColor;
        ctx.fill();

        // 2. Top Surface
        ctx.beginPath();
        ctx.moveTo(pBackLeft.x, pBackLeft.y);
        ctx.lineTo(pBackRight.x, pBackRight.y);
        ctx.lineTo(pRight.x, pRight.y);
        ctx.lineTo(pLeft.x, pLeft.y);
        ctx.closePath();
        ctx.fillStyle = topColor;
        ctx.fill();

        // 3. Details
        if (this.type === 'road') {
            // Road Lines
            ctx.strokeStyle = CONFIG.colors.roadLine;
            ctx.lineWidth = 4 * pLeft.scale;
            ctx.setLineDash([20 * pLeft.scale, 30 * pLeft.scale]);
            ctx.beginPath();
            // Draw line in middle
            const midP = project(0, 0, this.z);
            const midBackP = project(0, 0, this.z + CONFIG.laneWidth);
            ctx.moveTo(midP.x, midP.y);
            ctx.lineTo(midBackP.x, midBackP.y);
            ctx.stroke();
            ctx.setLineDash([]);
        } else if (this.type === 'water') {
            // Water Ripples
            ctx.strokeStyle = CONFIG.colors.waterHighlight;
            ctx.lineWidth = 2 * pLeft.scale;
            ctx.globalAlpha = 0.5;
            const rippleOffset = (state.frame * 2) % 40;
            
            // Ripple 1
            const r1 = project(50, 0, this.z);
            const r1b = project(50, 0, this.z + CONFIG.laneWidth);
            ctx.beginPath();
            ctx.moveTo(r1.x + rippleOffset*r1.scale, r1.y);
            ctx.lineTo(r1b.x + rippleOffset*r1b.scale, r1b.y);
            ctx.stroke();
            
            // Ripple 2
            const r2 = project(150, 0, this.z);
            const r2b = project(150, 0, this.z + CONFIG.laneWidth);
            ctx.beginPath();
            ctx.moveTo(r2.x + rippleOffset*r2.scale, r2.y);
            ctx.lineTo(r2b.x + rippleOffset*r2b.scale, r2b.y);
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }

        // 4. Scenery (Trees are drawn behind cars usually, but for simple z-sorting we draw them here)
        this.trees.forEach(tree => tree.draw());

        // 5. Moving Objects
        if (this.type === 'road') {
            this.traffic.forEach(car => this.drawCar(car, pLeft.scale));
        } else if (this.type === 'water') {
            this.logs.forEach(log => this.drawLog(log, pLeft.scale));
        }
    }

    drawCar(car, scale) {
        const cx = car.x;
        const cz = this.z + 5; // Slightly above ground
        const cw = car.width;
        const ch = car.height;
        const cd = car.depth;

        // Vertices
        const v = [
            project(cx - cw/2, 0, cz),     // 0 FBL
            project(cx + cw/2, 0, cz),     // 1 FBR
            project(cx + cw/2, 0, cz + cd), // 2 BBR
            project(cx - cw/2, 0, cz + cd), // 3 BBL
            project(cx - cw/2, ch, cz),    // 4 FTL
            project(cx + cw/2, ch, cz),    // 5 FTR
            project(cx + cw/2, ch, cz + cd), // 6 BTR
            project(cx - cw/2, ch, cz + cd)  // 7 BTL
        ];

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.moveTo(project(cx - cw/2, 0, this.z).x, project(cx - cw/2, 0, this.z).y);
        ctx.lineTo(project(cx + cw/2, 0, this.z).x, project(cx + cw/2, 0, this.z).y);
        ctx.lineTo(project(cx + cw/2, 0, this.z + cd).x, project(cx + cw/2, 0, this.z + cd).y);
        ctx.lineTo(project(cx - cw/2, 0, this.z + cd).x, project(cx - cw/2, 0, this.z + cd).y);
        ctx.fill();

        // Faces
        // Top (Lightest)
        ctx.fillStyle = adjustColor(car.color, 20);
        ctx.beginPath(); ctx.moveTo(v[4].x, v[4].y); ctx.lineTo(v[5].x, v[5].y); ctx.lineTo(v[6].x, v[6].y); ctx.lineTo(v[7].x, v[7].y); ctx.fill();
        
        // Right Side (Medium)
        ctx.fillStyle = adjustColor(car.color, -10);
        ctx.beginPath(); ctx.moveTo(v[1].x, v[1].y); ctx.lineTo(v[2].x, v[2].y); ctx.lineTo(v[6].x, v[6].y); ctx.lineTo(v[5].x, v[5].y); ctx.fill();

        // Left Side (Darkest - assuming light from Top-Left? Wait, if light is top-left, left side should be lighter than right side if looking from right. 
        // In our projection, +X is Right. So Left side is -X. Light is Top-Left. So Left side is lit. Right side is shadow.)
        // Correction:
        // Left Side (-X)
        ctx.fillStyle = adjustColor(car.color, 10); // Lit
        ctx.beginPath(); ctx.moveTo(v[0].x, v[0].y); ctx.lineTo(v[3].x, v[3].y); ctx.lineTo(v[7].x, v[7].y); ctx.lineTo(v[4].x, v[4].y); ctx.fill();
        
        // Front (+Z? No, Front is usually facing camera or direction of travel. Let's assume Front is +Z for now, or just fill the face facing camera)
        // Actually, for a car moving sideways, we see Front/Back caps.
        // Front Cap (Facing Camera roughly)
        ctx.fillStyle = adjustColor(car.color, 0);
        ctx.beginPath(); ctx.moveTo(v[0].x, v[0].y); ctx.lineTo(v[1].x, v[1].y); ctx.lineTo(v[5].x, v[5].y); ctx.lineTo(v[4].x, v[4].y); ctx.fill();

        // Windows (Black/Dark Blue)
        ctx.fillStyle = '#2d3436';
        // Simple rectangle on top face
        const winMargin = 5 * scale;
        ctx.fillRect(v[4].x + winMargin, v[4].y + winMargin, (v[5].x - v[4].x) - winMargin*2, (v[6].y - v[4].y) - winMargin*2);
    }

    drawLog(log, scale) {
        const lx = log.x;
        const lz = this.z + 2;
        const lw = log.width;
        const lh = 10; 
        const ld = 35;

        const v = [
            project(lx - lw/2, lh, lz),
            project(lx + lw/2, lh, lz),
            project(lx + lw/2, lh, lz + ld),
            project(lx - lw/2, lh, lz + ld),
            project(lx - lw/2, lh+10, lz),
            project(lx + lw/2, lh+10, lz),
            project(lx + lw/2, lh+10, lz + ld),
            project(lx - lw/2, lh+10, lz + ld)
        ];

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.moveTo(project(lx - lw/2, 0, lz).x, project(lx - lw/2, 0, lz).y);
        ctx.lineTo(project(lx + lw/2, 0, lz).x, project(lx + lw/2, 0, lz).y);
        ctx.lineTo(project(lx + lw/2, 0, lz + ld).x, project(lx + lw/2, 0, lz + ld).y);
        ctx.lineTo(project(lx - lw/2, 0, lz + ld).x, project(lx - lw/2, 0, lz + ld).y);
        ctx.fill();

        // Log Top
        ctx.fillStyle = CONFIG.colors.woodTop;
        ctx.beginPath(); ctx.moveTo(v[4].x, v[4].y); ctx.lineTo(v[5].x, v[5].y); ctx.lineTo(v[6].x, v[6].y); ctx.lineTo(v[7].x, v[7].y); ctx.fill();
        
        // Log Sides
        ctx.fillStyle = CONFIG.colors.woodSide;
        ctx.beginPath(); ctx.moveTo(v[1].x, v[1].y); ctx.lineTo(v[2].x, v[2].y); ctx.lineTo(v[6].x, v[6].y); ctx.lineTo(v[5].x, v[5].y); ctx.fill();
        
        // Log End (Right)
        ctx.fillStyle = CONFIG.colors.woodEnd;
        ctx.beginPath(); ctx.moveTo(v[2].x, v[2].y); ctx.lineTo(v[3].x, v[3].y); ctx.lineTo(v[7].x, v[7].y); ctx.lineTo(v[6].x, v[6].y); ctx.fill();
    }
}

class Player {
    constructor() {
        this.x = 0;
        this.z = 0;
        this.targetX = 0;
        this.targetZ = 0;
        this.hopY = 0;
        this.hopVel = 0;
        this.isHopping = false;
        this.width = 45;
        this.height = 55;
        this.depth = 45;
    }

    move(dx, dy) {
        if (this.isHopping) return;
        
        this.targetX += dx * CONFIG.laneSize;
        this.targetZ += dy * CONFIG.laneWidth;
        
        this.isHopping = true;
        this.hopVel = 14;
        
        if (dy > 0) {
            state.score++;
            const scoreEl = document.getElementById('current-score');
            scoreEl.innerText = state.score;
            scoreEl.classList.remove('pop');
            void scoreEl.offsetWidth; // trigger reflow
            scoreEl.classList.add('pop');
        }
    }

    update() {
        // Smooth Lerp
        this.x += (this.targetX - this.x) * 0.25;
        this.z += (this.targetZ - this.z) * 0.25;

        // Hop Physics
        if (this.isHopping) {
            this.hopY += this.hopVel;
            this.hopVel -= 0.8; // Gravity
            
            if (this.hopY <= 0) {
                this.hopY = 0;
                this.isHopping = false;
                this.x = this.targetX;
                this.z = this.targetZ;
                state.playerZ = this.z;
                state.playerX = this.x;
            }
        }
    }

    draw() {
        // Shadow
        const sP = project(this.x, 0, this.z);
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(sP.x, sP.y, 25 * sP.scale, 15 * sP.scale, 0, 0, Math.PI*2);
        ctx.fill();

        // Chicken Geometry
        const pX = this.x;
        const pY = this.hopY;
        const pZ = this.z;
        const w = this.width;
        const h = this.height;
        const d = this.depth;

        // Vertices
        const v = [
            project(pX - w/2, pY, pZ),       // 0 FBL
            project(pX + w/2, pY, pZ),       // 1 FBR
            project(pX + w/2, pY, pZ + d),   // 2 BBR
            project(pX - w/2, pY, pZ + d),   // 3 BBL
            project(pX - w/2, pY + h, pZ),   // 4 FTL
            project(pX + w/2, pY + h, pZ),   // 5 FTR
            project(pX + w/2, pY + h, pZ + d), // 6 BTR
            project(pX - w/2, pY + h, pZ + d)  // 7 BTL
        ];

        // Body
        // Top (White)
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.moveTo(v[4].x, v[4].y); ctx.lineTo(v[5].x, v[5].y); ctx.lineTo(v[6].x, v[6].y); ctx.lineTo(v[7].x, v[7].y); ctx.fill();
        
        // Right (Shadow)
        ctx.fillStyle = '#dcdde1';
        ctx.beginPath(); ctx.moveTo(v[1].x, v[1].y); ctx.lineTo(v[2].x, v[2].y); ctx.lineTo(v[6].x, v[6].y); ctx.lineTo(v[5].x, v[5].y); ctx.fill();
        
        // Left (Lit)
        ctx.fillStyle = '#f5f6fa';
        ctx.beginPath(); ctx.moveTo(v[0].x, v[0].y); ctx.lineTo(v[3].x, v[3].y); ctx.lineTo(v[7].x, v[7].y); ctx.lineTo(v[4].x, v[4].y); ctx.fill();
        
        // Front
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.moveTo(v[0].x, v[0].y); ctx.lineTo(v[1].x, v[1].y); ctx.lineTo(v[5].x, v[5].y); ctx.lineTo(v[4].x, v[4].y); ctx.fill();

        // Details: Comb (Red)
        ctx.fillStyle = '#ff4757';
        ctx.beginPath();
        ctx.moveTo(v[4].x, v[4].y - 12*v[0].scale);
        ctx.lineTo(v[5].x, v[5].y - 12*v[0].scale);
        ctx.lineTo(v[5].x, v[5].y);
        ctx.lineTo(v[4].x, v[4].y);
        ctx.fill();

        // Details: Beak (Orange)
        ctx.fillStyle = '#ffa502';
        ctx.beginPath();
        ctx.moveTo(v[0].x + 10*v[0].scale, v[0].y - 28*v[0].scale);
        ctx.lineTo(v[1].x - 10*v[0].scale, v[0].y - 28*v[0].scale);
        ctx.lineTo(v[1].x - 15*v[0].scale, v[0].y - 18*v[0].scale); 
        ctx.lineTo(v[0].x + 15*v[0].scale, v[0].y - 18*v[0].scale);
        ctx.fill();

        // Details: Eyes (Black)
        ctx.fillStyle = '#2f3542';
        ctx.beginPath();
        ctx.arc(v[0].x + 12*v[0].scale, v[0].y - 32*v[0].scale, 4*v[0].scale, 0, Math.PI*2);
        ctx.arc(v[1].x - 12*v[0].scale, v[1].y - 32*v[0].scale, 4*v[0].scale, 0, Math.PI*2);
        ctx.fill();
        
        // Details: Eyes (White Glint)
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(v[0].x + 13*v[0].scale, v[0].y - 33*v[0].scale, 1.5*v[0].scale, 0, Math.PI*2);
        ctx.arc(v[1].x - 11*v[0].scale, v[1].y - 33*v[0].scale, 1.5*v[0].scale, 0, Math.PI*2);
        ctx.fill();
    }
}

// --- INITIALIZATION ---

const player = new Player();

function init() {
    resize();
    window.addEventListener('resize', resize);
    
    // Generate initial world
    for (let i = -10; i < 40; i++) {
        state.lanes.push(new Lane(i));
    }
    
    // Generate clouds
    for(let i=0; i<15; i++) {
        state.clouds.push(new Cloud(Math.random() * 3000));
    }

    // Input Handling
    window.addEventListener('keydown', (e) => {
        switch(e.key) {
            case 'ArrowUp': case 'w': player.move(0, 1); break;
            case 'ArrowDown': case 's': player.move(0, -1); break;
            case 'ArrowLeft': case 'a': player.move(-1, 0); break;
            case 'ArrowRight': case 'd': player.move(1, 0); break;
        }
    });

    // D-Pad Listeners
    document.querySelectorAll('.d-btn').forEach(btn => {
        const handlePress = (e) => {
            if(e.cancelable) e.preventDefault();
            const dir = btn.dataset.dir;
            if(dir === 'up') player.move(0, 1);
            if(dir === 'down') player.move(0, -1);
            if(dir === 'left') player.move(-1, 0);
            if(dir === 'right') player.move(1, 0);
            
            // Visual feedback
            btn.classList.add('active');
            setTimeout(() => btn.classList.remove('active'), 100);
        };

        btn.addEventListener('mousedown', handlePress);
        btn.addEventListener('touchstart', handlePress);
    });

    loop();
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    state.width = canvas.width;
    state.height = canvas.height;
    state.centerX = state.width / 2;
    state.centerY = state.height / 2 + 120; // Lower center point to fill screen
}

// --- GAME LOOP ---

function loop() {
    state.frame++;
    
    // Clear & Draw Sky Gradient
    const gradient = ctx.createLinearGradient(0, 0, 0, state.height);
    gradient.addColorStop(0, CONFIG.colors.skyTop);
    gradient.addColorStop(1, CONFIG.colors.skyBot);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, state.width, state.height);

    // Update Logic
    player.update();
    state.lanes.forEach(lane => lane.update());
    
    // Infinite Scroll Logic
    const playerLaneIndex = Math.floor(player.z / CONFIG.laneWidth);
    while(state.lanes.length > 0 && state.lanes[0].zIndex < playerLaneIndex - 10) {
        state.lanes.shift();
    }
    const lastZ = state.lanes[state.lanes.length-1].zIndex;
    while(lastZ < playerLaneIndex + 20) {
        state.lanes.push(new Lane(lastZ + 1));
        lastZ++;
    }

    // Draw Clouds
    state.clouds.forEach(c => c.draw());

    // Draw Lanes (Back to Front)
    const sortedLanes = [...state.lanes].sort((a, b) => b.z - a.z);
    sortedLanes.forEach(lane => {
        // Culling
        if (lane.z < state.playerZ - CONFIG.cameraDist) return; 
        if (lane.z > state.playerZ + CONFIG.fov * 2.5) return; 
        lane.draw();
    });

    // Draw Player
    player.draw();

    requestAnimationFrame(loop);
}

// Start
init();

</script>
