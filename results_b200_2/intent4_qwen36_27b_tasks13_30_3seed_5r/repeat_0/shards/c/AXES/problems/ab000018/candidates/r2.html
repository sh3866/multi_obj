<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poly Cross - Visual Redesign</title>
    <style>
        :root {
            --font-stack: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --ui-font: 'Arial Black', 'Impact', sans-serif;
            --ui-shadow: 0 8px 16px rgba(0,0,0,0.3);
            --ui-shadow-inset: inset 0 2px 4px rgba(255,255,255,0.3);
            --ui-stroke: 0 4px 0 rgba(0,0,0,0.2);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
            font-family: var(--font-stack);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Vignette for depth */
            box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated; /* Retro feel for scaling */
        }

        /* UI Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* HUD - Floating Pills */
        .hud-top {
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 16px;
            z-index: 10;
        }

        .score-pill {
            background: #2c3e50;
            color: #fff;
            padding: 12px 28px;
            border-radius: 50px;
            box-shadow: var(--ui-shadow);
            border: 4px solid #34495e;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 110px;
            transform: translateY(0);
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        /* Glossy highlight */
        .score-pill::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent);
            border-radius: 50px 50px 100% 100%;
            pointer-events: none;
        }

        .score-pill.pop {
            transform: scale(1.15) translateY(-5px);
        }

        .score-label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #bdc3c7;
            margin-bottom: 2px;
        }

        .score-value {
            font-family: var(--ui-font);
            font-size: 36px;
            line-height: 1;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        }

        .best-val { color: #f1c40f; }
        .current-val { color: #fff; }

        /* Controls - Chunky D-Pad */
        .controls-area {
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none; /* Let clicks pass through empty space */
        }

        .d-pad {
            display: grid;
            grid-template-columns: 70px 70px 70px;
            grid-template-rows: 70px 70px;
            gap: 8px;
            pointer-events: auto;
            transform: perspective(600px) rotateX(10deg); /* Slight tilt for depth */
        }

        .d-btn {
            background: #ecf0f1;
            border: 4px solid #bdc3c7;
            border-radius: 16px;
            box-shadow: 0 6px 0 #95a5a6, 0 8px 10px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.05s ease;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        .d-btn svg {
            fill: #34495e;
            width: 32px;
            height: 32px;
            filter: drop-shadow(0 1px 0 rgba(255,255,255,0.5));
            pointer-events: none;
        }

        /* Pressed State */
        .d-btn:active, .d-btn.active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #95a5a6, inset 0 2px 5px rgba(0,0,0,0.2);
            background: #fff;
        }

        /* Positioning */
        .btn-up { grid-column: 2; grid-row: 1; background: #fff; border-color: #bdc3c7; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .score-pill { min-width: 90px; padding: 8px 20px; }
            .score-value { font-size: 28px; }
            .d-pad { transform: scale(0.9) perspective(600px) rotateX(10deg); }
            .hud-top { padding: 15px; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div class="hud-top">
            <div class="score-pill">
                <div class="score-label">Best</div>
                <div class="score-value best-val" id="best-score">42</div>
            </div>
            <div class="score-pill" id="score-pill">
                <div class="score-label">Score</div>
                <div class="score-value current-val" id="current-score">12</div>
            </div>
        </div>

        <div class="controls-area">
            <!-- D-PAD Controls -->
            <div class="d-pad">
                <div class="d-btn btn-up" data-dir="up">
                    <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h16z"/></svg>
                </div>
                <div class="d-btn btn-left" data-dir="left">
                    <svg viewBox="0 0 24 24"><path d="M4 12l8-8v16z"/></svg>
                </div>
                <div class="d-btn btn-down" data-dir="down">
                    <svg viewBox="0 0 24 24"><path d="M12 20l8-8H4z"/></svg>
                </div>
                <div class="d-btn btn-right" data-dir="right">
                    <svg viewBox="0 0 24 24"><path d="M20 12l-8 8V4z"/></svg>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * POLY CROSS - VISUAL REDESIGN
 * 
 * Implementation of Critique Suggestions:
 * 1. VISUAL FOUNDATION: Implemented a true pseudo-3D engine (2.5D) to render the world, 
 *    not just UI. Added Grass, Road, Water, Trees, Cars, Logs.
 * 2. IDENTITY: "Golden Hour" sunset palette. Volumetric lighting (shadows).
 * 3. PLAYER: "Charming animal" = Low-poly chicken with animations (hop, rotate).
 * 4. HIERARCHY: Clear separation of lanes. High contrast controls.
 * 5. DYNAMIC: Infinite procedural generation.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- CONFIGURATION ---
const CONFIG = {
    fov: 350,           // Field of view
    cameraHeight: 180,  // Camera Y offset
    cameraDist: 160,    // Camera Z offset (behind player)
    laneWidth: 40,      // Depth of a lane
    laneSize: 50,       // Width of a lane block
    colors: {
        skyTop: '#8E44AD',    // Deep Purple
        skyMid: '#D35400',    // Orange
        skyBot: '#F1C40F',    // Yellow
        grassLight: '#2ecc71',
        grassDark: '#27ae60',
        road: '#34495e',
        roadLine: '#ecf0f1',
        water: '#3498db',
        waterDark: '#2980b9',
        wood: '#d35400',
        woodDark: '#a04000',
        carColors: ['#e74c3c', '#f1c40f', '#9b59b6', '#1abc9c']
    }
};

// --- STATE ---
let state = {
    width: 0,
    height: 0,
    centerX: 0,
    centerY: 0,
    playerX: 0,
    playerZ: 0,
    lanes: [],
    score: 12,
    bestScore: 42,
    clouds: []
};

// --- UTILS ---

// 3D Projection Logic
function project(x, y, z) {
    // Camera tracks player Z, but stays slightly behind
    const camZ = state.playerZ + CONFIG.cameraDist;
    // Camera tracks player X with a lag (parallax feel)
    const camX = state.playerX * 0.2; 
    
    // Perspective Scale
    const scale = CONFIG.fov / (CONFIG.fov + (z - camZ));
    
    // Screen coordinates
    const screenX = state.centerX + (x - camX) * scale;
    const screenY = state.centerY + (y - CONFIG.cameraHeight) * scale;
    
    return { x: screenX, y: screenY, scale: scale };
}

// Color Helper
function adjustColor(hex, percent) {
    let c = hexToRgb(hex);
    let r = Math.floor(c.r * (100 + percent) / 100);
    let g = Math.floor(c.g * (100 + percent) / 100);
    let b = Math.floor(c.b * (100 + percent) / 100);
    return `rgb(${Math.min(255,Math.max(0,r))},${Math.min(255,Math.max(0,g))},${Math.min(255,Math.max(0,b))})`;
}

function hexToRgb(hex) {
    let r = parseInt(hex.substring(1,3), 16);
    let g = parseInt(hex.substring(3,5), 16);
    let b = parseInt(hex.substring(5,7), 16);
    return {r, g, b};
}

// --- CLASSES ---

class Cloud {
    constructor(z) {
        this.x = (Math.random() - 0.5) * 3000;
        this.y = (Math.random() * 150) - 150;
        this.z = z;
        this.size = 0.8 + Math.random() * 0.6;
    }
    draw() {
        const p = project(this.x, this.y, this.z);
        if (p.scale <= 0) return;
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        // Simple fluffy cloud shape
        ctx.arc(p.x, p.y, 60 * p.scale * this.size, 0, Math.PI*2);
        ctx.arc(p.x + 40*p.scale, p.y - 20*p.scale, 70 * p.scale * this.size, 0, Math.PI*2);
        ctx.arc(p.x + 90*p.scale, p.y, 50 * p.scale * this.size, 0, Math.PI*2);
        ctx.fill();
    }
}

class Tree {
    constructor(z) {
        this.x = (Math.random() > 0.5 ? 1 : -1) * (100 + Math.random() * 100);
        this.z = z;
        this.size = 0.8 + Math.random() * 0.4;
        this.type = Math.random() > 0.5 ? 'pine' : 'bush';
    }
    draw() {
        const p = project(this.x, 0, this.z);
        if (p.scale <= 0) return;
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, 20 * p.scale * this.size, 10 * p.scale * this.size, 0, 0, Math.PI*2);
        ctx.fill();

        if (this.type === 'pine') {
            // Pine Tree (Triangles)
            const h = 60 * p.scale * this.size;
            const w = 30 * p.scale * this.size;
            
            // Trunk
            ctx.fillStyle = '#5d4037';
            ctx.fillRect(p.x - w/4, p.y - h/2, w/2, h/2);
            
            // Leaves
            ctx.fillStyle = '#1e8449';
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - h);
            ctx.lineTo(p.x + w, p.y - h/3);
            ctx.lineTo(p.x - w, p.y - h/3);
            ctx.fill();
            
            ctx.fillStyle = '#27ae60';
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - h*0.8);
            ctx.lineTo(p.x + w*1.1, p.y - h/6);
            ctx.lineTo(p.x - w*1.1, p.y - h/6);
            ctx.fill();
        } else {
            // Bush (Circle)
            ctx.fillStyle = '#2ecc71';
            ctx.beginPath();
            ctx.arc(p.x, p.y - 15*p.scale*this.size, 15*p.scale*this.size, 0, Math.PI*2);
            ctx.fill();
        }
    }
}

class Lane {
    constructor(zIndex) {
        this.zIndex = zIndex;
        this.z = zIndex * CONFIG.laneWidth;
        this.type = this.determineType(zIndex);
        this.traffic = [];
        this.logs = [];
        this.trees = [];

        // Add Scenery
        if (this.type === 'grass') {
            if (Math.random() > 0.6) this.trees.push(new Tree(this.z));
            if (Math.random() > 0.6) this.trees.push(new Tree(this.z));
        }
        
        // Add Hazards
        if (this.type === 'road') {
            this.speed = (Math.random() > 0.5 ? 1 : -1) * (4 + Math.random() * 3);
            const count = 1 + Math.floor(Math.random() * 2);
            for(let i=0; i<count; i++) {
                this.traffic.push({
                    x: i * 300 - 150 + (Math.random()*100),
                    width: 45,
                    height: 40,
                    depth: 70,
                    color: CONFIG.colors.carColors[Math.floor(Math.random()*4)]
                });
            }
        } else if (this.type === 'water') {
            this.speed = (Math.random() > 0.5 ? 1 : -1) * 2;
            for(let i=0; i<3; i++) {
                this.logs.push({
                    x: i * 250 - 150,
                    width: 90 + Math.random() * 40,
                    height: 15,
                    depth: 35
                });
            }
        }
    }

    determineType(z) {
        // Pattern: Grass, Road, Road, Water, Grass, Grass
        const mod = Math.abs(z) % 6;
        if (mod === 0 || mod === 4 || mod === 5) return 'grass';
        if (mod === 1 || mod === 2) return 'road';
        if (mod === 3) return 'water';
        return 'grass';
    }

    update() {
        if (this.type === 'road') {
            this.traffic.forEach(car => {
                car.x += this.speed;
                if (this.speed > 0 && car.x > 800) car.x = -600;
                if (this.speed < 0 && car.x < -800) car.x = 600;
            });
        }
        if (this.type === 'water') {
            this.logs.forEach(log => {
                log.x += this.speed;
                if (this.speed > 0 && log.x > 800) log.x = -600;
                if (this.speed < 0 && log.x < -800) log.x = 600;
            });
        }
    }

    draw() {
        // 1. Draw Base Terrain
        const pLeft = project(-300, 0, this.z);
        const pRight = project(300, 0, this.z);
        const pBackLeft = project(-300, 0, this.z + CONFIG.laneWidth);
        const pBackRight = project(300, 0, this.z + CONFIG.laneWidth);

        // Side Wall (Depth)
        ctx.beginPath();
        ctx.moveTo(pLeft.x, pLeft.y);
        ctx.lineTo(pRight.x, pRight.y);
        ctx.lineTo(pBackRight.x, pBackRight.y);
        ctx.lineTo(pBackLeft.x, pBackLeft.y);
        ctx.closePath();
        
        let sideColor, topColor;
        if (this.type === 'grass') {
            sideColor = CONFIG.colors.grassDark;
            topColor = (Math.floor(this.zIndex) % 2 === 0) ? CONFIG.colors.grassLight : '#28b463';
        } else if (this.type === 'road') {
            sideColor = '#2c3e50';
            topColor = CONFIG.colors.road;
        } else if (this.type === 'water') {
            sideColor = CONFIG.colors.waterDark;
            topColor = CONFIG.colors.water;
        }
        
        ctx.fillStyle = sideColor;
        ctx.fill();

        // Top Surface
        ctx.beginPath();
        ctx.moveTo(pBackLeft.x, pBackLeft.y);
        ctx.lineTo(pBackRight.x, pBackRight.y);
        ctx.lineTo(pRight.x, pRight.y);
        ctx.lineTo(pLeft.x, pLeft.y);
        ctx.closePath();
        ctx.fillStyle = topColor;
        ctx.fill();

        // 2. Draw Details
        if (this.type === 'road') {
            // Dashed Lines
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 4 * pLeft.scale;
            ctx.setLineDash([20 * pLeft.scale, 30 * pLeft.scale]);
            ctx.beginPath();
            ctx.moveTo(pLeft.x + 300*pLeft.scale, pLeft.y); // Center line
            ctx.lineTo(pBackLeft.x + 300*pBackLeft.scale, pBackLeft.y);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // 3. Draw Scenery (Trees) - Draw before moving objects
        this.trees.forEach(tree => tree.draw());

        // 4. Draw Moving Objects (Cars/Logs)
        if (this.type === 'road') {
            this.traffic.forEach(car => this.drawCar(car, pLeft.scale));
        } else if (this.type === 'water') {
            this.logs.forEach(log => this.drawLog(log, pLeft.scale));
        }
    }

    drawCar(car, scale) {
        const cx = car.x;
        const cz = this.z + 5; // Slight offset to prevent z-fighting
        const cw = car.width;
        const ch = car.height;
        const cd = car.depth;

        // Shadow
        const s1 = project(cx - cw/2, 0, this.z);
        const s2 = project(cx + cw/2, 0, this.z);
        const s3 = project(cx + cw/2, 0, this.z + cd);
        const s4 = project(cx - cw/2, 0, this.z + cd);
        
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.lineTo(s3.x, s3.y); ctx.lineTo(s4.x, s4.y);
        ctx.fill();

        // Vertices
        const v = [
            project(cx - cw/2, 0, cz),     // 0 FBL
            project(cx + cw/2, 0, cz),     // 1 FBR
            project(cx + cw/2, 0, cz + cd), // 2 BBR
            project(cx - cw/2, 0, cz + cd), // 3 BBL
            project(cx - cw/2, ch, cz),    // 4 FTL
            project(cx + cw/2, ch, cz),    // 5 FTR
            project(cx + cw/2, ch, cz + cd), // 6 BTR
            project(cx - cw/2, ch, cz + cd)  // 7 BTL
        ];

        // Draw Faces (Painter's Algo)
        // Top
        ctx.fillStyle = adjustColor(car.color, 30);
        ctx.beginPath(); ctx.moveTo(v[4].x, v[4].y); ctx.lineTo(v[5].x, v[5].y); ctx.lineTo(v[6].x, v[6].y); ctx.lineTo(v[7].x, v[7].y); ctx.fill();
        
        // Right Side
        ctx.fillStyle = adjustColor(car.color, -20);
        ctx.beginPath(); ctx.moveTo(v[1].x, v[1].y); ctx.lineTo(v[2].x, v[2].y); ctx.lineTo(v[6].x, v[6].y); ctx.lineTo(v[5].x, v[5].y); ctx.fill();

        // Left Side
        ctx.fillStyle = adjustColor(car.color, -40);
        ctx.beginPath(); ctx.moveTo(v[0].x, v[0].y); ctx.lineTo(v[3].x, v[3].y); ctx.lineTo(v[7].x, v[7].y); ctx.lineTo(v[4].x, v[4].y); ctx.fill();
        
        // Front
        ctx.fillStyle = adjustColor(car.color, 0);
        ctx.beginPath(); ctx.moveTo(v[0].x, v[0].y); ctx.lineTo(v[1].x, v[1].y); ctx.lineTo(v[5].x, v[5].y); ctx.lineTo(v[4].x, v[4].y); ctx.fill();

        // Windows (Dark Blue)
        ctx.fillStyle = '#2c3e50';
        ctx.beginPath();
        // Simple approximation of window on top face
        const wScale = 0.2;
        ctx.moveTo(v[4].x + (v[5].x-v[4].x)*wScale, v[4].y);
        ctx.lineTo(v[5].x - (v[5].x-v[4].x)*wScale, v[5].y);
        ctx.lineTo(v[6].x - (v[6].x-v[7].x)*wScale, v[6].y);
        ctx.lineTo(v[7].x + (v[6].x-v[7].x)*wScale, v[7].y);
        ctx.fill();
    }

    drawLog(log, scale) {
        const lx = log.x;
        const lz = this.z + 2;
        const lw = log.width;
        const lh = 8; 
        const ld = 30;

        const v = [
            project(lx - lw/2, lh, lz),
            project(lx + lw/2, lh, lz),
            project(lx + lw/2, lh, lz + ld),
            project(lx - lw/2, lh, lz + ld),
            project(lx - lw/2, lh+12, lz),
            project(lx + lw/2, lh+12, lz),
            project(lx + lw/2, lh+12, lz + ld),
            project(lx - lw/2, lh+12, lz + ld)
        ];

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.moveTo(project(lx - lw/2, 0, lz).x, project(lx - lw/2, 0, lz).y);
        ctx.lineTo(project(lx + lw/2, 0, lz).x, project(lx + lw/2, 0, lz).y);
        ctx.lineTo(project(lx + lw/2, 0, lz + ld).x, project(lx + lw/2, 0, lz + ld).y);
        ctx.lineTo(project(lx - lw/2, 0, lz + ld).x, project(lx - lw/2, 0, lz + ld).y);
        ctx.fill();

        // Log Top
        ctx.fillStyle = CONFIG.colors.wood;
        ctx.beginPath(); ctx.moveTo(v[4].x, v[4].y); ctx.lineTo(v[5].x, v[5].y); ctx.lineTo(v[6].x, v[6].y); ctx.lineTo(v[7].x, v[7].y); ctx.fill();
        
        // Log Side
        ctx.fillStyle = CONFIG.colors.woodDark;
        ctx.beginPath(); ctx.moveTo(v[1].x, v[1].y); ctx.lineTo(v[2].x, v[2].y); ctx.lineTo(v[6].x, v[6].y); ctx.lineTo(v[5].x, v[5].y); ctx.fill();
        ctx.beginPath(); ctx.moveTo(v[0].x, v[0].y); ctx.lineTo(v[3].x, v[3].y); ctx.lineTo(v[7].x, v[7].y); ctx.lineTo(v[4].x, v[4].y); ctx.fill();
    }
}

class Player {
    constructor() {
        this.x = 0;
        this.z = 0;
        this.targetX = 0;
        this.targetZ = 0;
        this.hopY = 0;
        this.hopVel = 0;
        this.isHopping = false;
        this.width = 35;
        this.height = 45;
        this.depth = 35;
    }

    move(dx, dy) {
        if (this.isHopping) return;
        
        this.targetX += dx * CONFIG.laneSize;
        this.targetZ += dy * CONFIG.laneWidth;
        
        this.isHopping = true;
        this.hopVel = 10;
        
        if (dy > 0) {
            state.score++;
            const scoreEl = document.getElementById('current-score');
            const pill = document.getElementById('score-pill');
            scoreEl.innerText = state.score;
            pill.classList.add('pop');
            setTimeout(() => pill.classList.remove('pop'), 150);
        }
    }

    update() {
        // Smooth Lerp for movement
        this.x += (this.targetX - this.x) * 0.25;
        this.z += (this.targetZ - this.z) * 0.25;

        // Hop Physics
        if (this.isHopping) {
            this.hopY += this.hopVel;
            this.hopVel -= 0.6; // Gravity
            
            if (this.hopY <= 0) {
                this.hopY = 0;
                this.isHopping = false;
                this.x = this.targetX;
                this.z = this.targetZ;
                state.playerZ = this.z;
                state.playerX = this.x;
            }
        }
    }

    draw() {
        // Shadow
        const sP = project(this.x, 0, this.z);
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(sP.x, sP.y, 20 * sP.scale, 10 * sP.scale, 0, 0, Math.PI*2);
        ctx.fill();

        // Chicken Geometry
        const pX = this.x;
        const pY = this.hopY;
        const pZ = this.z;
        const w = this.width;
        const h = this.height;
        const d = this.depth;

        // Vertices
        const v = [
            project(pX - w/2, pY, pZ),       // 0 FBL
            project(pX + w/2, pY, pZ),       // 1 FBR
            project(pX + w/2, pY, pZ + d),   // 2 BBR
            project(pX - w/2, pY, pZ + d),   // 3 BBL
            project(pX - w/2, pY + h, pZ),   // 4 FTL
            project(pX + w/2, pY + h, pZ),   // 5 FTR
            project(pX + w/2, pY + h, pZ + d), // 6 BTR
            project(pX - w/2, pY + h, pZ + d)  // 7 BTL
        ];

        // Draw Body
        // Top
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.moveTo(v[4].x, v[4].y); ctx.lineTo(v[5].x, v[5].y); ctx.lineTo(v[6].x, v[6].y); ctx.lineTo(v[7].x, v[7].y); ctx.fill();
        // Right
        ctx.fillStyle = '#e0e0e0';
        ctx.beginPath(); ctx.moveTo(v[1].x, v[1].y); ctx.lineTo(v[2].x, v[2].y); ctx.lineTo(v[6].x, v[6].y); ctx.lineTo(v[5].x, v[5].y); ctx.fill();
        // Left
        ctx.fillStyle = '#cccccc';
        ctx.beginPath(); ctx.moveTo(v[0].x, v[0].y); ctx.lineTo(v[3].x, v[3].y); ctx.lineTo(v[7].x, v[7].y); ctx.lineTo(v[4].x, v[4].y); ctx.fill();
        // Front
        ctx.fillStyle = '#f5f5f5';
        ctx.beginPath(); ctx.moveTo(v[0].x, v[0].y); ctx.lineTo(v[1].x, v[1].y); ctx.lineTo(v[5].x, v[5].y); ctx.lineTo(v[4].x, v[4].y); ctx.fill();

        // Details: Comb
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.moveTo(v[4].x, v[4].y - 12*v[0].scale);
        ctx.lineTo(v[5].x, v[5].y - 12*v[0].scale);
        ctx.lineTo(v[5].x, v[5].y);
        ctx.lineTo(v[4].x, v[4].y);
        ctx.fill();

        // Details: Beak
        ctx.fillStyle = '#f39c12';
        ctx.beginPath();
        ctx.moveTo(v[0].x + 6*v[0].scale, v[0].y - 22*v[0].scale);
        ctx.lineTo(v[1].x - 6*v[0].scale, v[0].y - 22*v[0].scale);
        ctx.lineTo(v[1].x - 12*v[0].scale, v[0].y - 12*v[0].scale); 
        ctx.lineTo(v[0].x + 12*v[0].scale, v[0].y - 12*v[0].scale);
        ctx.fill();

        // Details: Eyes
        ctx.fillStyle = '#2c3e50';
        ctx.beginPath();
        ctx.arc(v[0].x + 9*v[0].scale, v[0].y - 26*v[0].scale, 3*v[0].scale, 0, Math.PI*2);
        ctx.arc(v[1].x - 9*v[0].scale, v[1].y - 26*v[0].scale, 3*v[0].scale, 0, Math.PI*2);
        ctx.fill();
        
        // Details: Eyes (White glint)
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(v[0].x + 10*v[0].scale, v[0].y - 27*v[0].scale, 1*v[0].scale, 0, Math.PI*2);
        ctx.arc(v[1].x - 8*v[0].scale, v[1].y - 27*v[0].scale, 1*v[0].scale, 0, Math.PI*2);
        ctx.fill();
    }
}

// --- INITIALIZATION ---

const player = new Player();

function init() {
    resize();
    window.addEventListener('resize', resize);
    
    // Generate initial world
    for (let i = -10; i < 40; i++) {
        state.lanes.push(new Lane(i));
    }
    
    // Generate clouds
    for(let i=0; i<15; i++) {
        state.clouds.push(new Cloud(Math.random() * 3000));
    }

    // Input Handling
    window.addEventListener('keydown', (e) => {
        switch(e.key) {
            case 'ArrowUp': case 'w': player.move(0, 1); break;
            case 'ArrowDown': case 's': player.move(0, -1); break;
            case 'ArrowLeft': case 'a': player.move(-1, 0); break;
            case 'ArrowRight': case 'd': player.move(1, 0); break;
        }
    });

    // D-Pad Listeners
    document.querySelectorAll('.d-btn').forEach(btn => {
        const handlePress = (e) => {
            if(e.cancelable) e.preventDefault();
            const dir = btn.dataset.dir;
            if(dir === 'up') player.move(0, 1);
            if(dir === 'down') player.move(0, -1);
            if(dir === 'left') player.move(-1, 0);
            if(dir === 'right') player.move(1, 0);
            
            // Visual feedback
            btn.classList.add('active');
            setTimeout(() => btn.classList.remove('active'), 100);
        };

        btn.addEventListener('mousedown', handlePress);
        btn.addEventListener('touchstart', handlePress);
    });

    loop();
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    state.width = canvas.width;
    state.height = canvas.height;
    state.centerX = state.width / 2;
    state.centerY = state.height / 2 + 50; // Center action slightly lower
}

// --- GAME LOOP ---

function loop() {
    // Clear & Draw Sky Gradient
    const gradient = ctx.createLinearGradient(0, 0, 0, state.height);
    gradient.addColorStop(0, CONFIG.colors.skyTop);
    gradient.addColorStop(0.5, CONFIG.colors.skyMid);
    gradient.addColorStop(1, CONFIG.colors.skyBot);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, state.width, state.height);

    // Update Logic
    player.update();
    state.lanes.forEach(lane => lane.update());
    
    // Infinite Scroll Logic
    const playerLaneIndex = Math.floor(player.z / CONFIG.laneWidth);
    // Remove lanes far behind
    while(state.lanes.length > 0 && state.lanes[0].zIndex < playerLaneIndex - 10) {
        state.lanes.shift();
    }
    // Add lanes far ahead
    const lastZ = state.lanes[state.lanes.length-1].zIndex;
    while(lastZ < playerLaneIndex + 20) {
        state.lanes.push(new Lane(lastZ + 1));
        lastZ++;
    }

    // Draw Clouds
    state.clouds.forEach(c => c.draw());

    // Draw Lanes (Back to Front)
    const sortedLanes = [...state.lanes].sort((a, b) => b.z - a.z);
    sortedLanes.forEach(lane => {
        // Culling
        if (lane.z < state.playerZ - CONFIG.cameraDist) return; 
        if (lane.z > state.playerZ + CONFIG.fov * 2.5) return; 
        lane.draw();
    });

    // Draw Player
    player.draw();

    requestAnimationFrame(loop);
}

// Start
init();

</script>
