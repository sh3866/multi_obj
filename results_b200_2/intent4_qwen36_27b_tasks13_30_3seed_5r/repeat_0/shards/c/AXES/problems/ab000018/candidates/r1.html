<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poly Hop - Visual Redesign</title>
    <style>
        :root {
            --font-stack: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --ui-font: 'Impact', 'Arial Black', sans-serif;
            --ui-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000; /* Fallback */
            font-family: var(--font-stack);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Layer - HUD */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hud-top {
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
        }

        .score-pill {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 8px 24px;
            border-radius: 50px;
            box-shadow: var(--ui-shadow);
            border: 2px solid #34495e;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 100px;
            transform: translateY(0);
            transition: transform 0.1s;
        }

        .score-pill.pop {
            transform: scale(1.1);
        }

        .score-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
            margin-bottom: -2px;
        }

        .score-value {
            font-family: var(--ui-font);
            font-size: 32px;
            line-height: 1;
        }

        .best-val { color: #f1c40f; }
        .current-val { color: #fff; }

        /* Controls Overlay */
        .controls-area {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: auto;
        }

        .d-pad {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px;
            gap: 5px;
            pointer-events: auto;
        }

        .d-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.1s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        .d-btn:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
        }

        .d-btn svg {
            fill: white;
            width: 24px;
            height: 24px;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
        }

        /* Positioning D-pad buttons */
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .score-pill { min-width: 80px; padding: 6px 16px; }
            .score-value { font-size: 24px; }
            .d-pad { transform: scale(0.9); }
        }

    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div class="hud-top">
            <div class="score-pill">
                <div class="score-label">Best</div>
                <div class="score-value best-val" id="best-score">42</div>
            </div>
            <div class="score-pill" id="score-pill">
                <div class="score-label">Score</div>
                <div class="score-value current-val" id="current-score">12</div>
            </div>
        </div>

        <div class="controls-area">
            <!-- D-PAD Controls -->
            <div class="d-pad">
                <div class="d-btn btn-up" data-dir="up">
                    <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h16z"/></svg>
                </div>
                <div class="d-btn btn-left" data-dir="left">
                    <svg viewBox="0 0 24 24"><path d="M4 12l8-8v16z"/></svg>
                </div>
                <div class="d-btn btn-down" data-dir="down">
                    <svg viewBox="0 0 24 24"><path d="M12 20l8-8H4z"/></svg>
                </div>
                <div class="d-btn btn-right" data-dir="right">
                    <svg viewBox="0 0 24 24"><path d="M20 12l-8 8V4z"/></svg>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * POLY HOP - VISUAL REDESIGN
 * 
 * Changes applied based on critique:
 * 1. Visual Identity: Switched to a vibrant "Golden Hour" sunset palette.
 * 2. Perspective: Enhanced FOV and camera height for a chunky, legible 2.5D look.
 * 3. Player: Redesigned as a chunky, low-poly chicken (Red comb, white body, beak).
 * 4. Assets: Cars are now volumetric boxes. River includes floating logs.
 * 5. Composition: Action centered. Sky gradient replaces cyan void.
 * 6. Controls: Added visible D-Pad UI.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- CONFIGURATION ---
const CONFIG = {
    fov: 280,           // Wider FOV for better depth perception
    cameraHeight: 160,  // Higher camera for better overview
    cameraDist: 140,    // Closer to player
    laneWidth: 40,      // Z-depth of a lane
    laneSize: 50,       // X/Y size of a block
    colors: {
        skyTop: '#ff7e5f',   // Sunset Orange
        skyBottom: '#feb47b', // Peach
        grassLight: '#7ec850',
        grassDark: '#5da844',
        road: '#505c66',
        roadLine: '#ffffff',
        water: '#45a29e',
        waterDark: '#2c7c7a',
        wood: '#a0522d',
        woodDark: '#8b4513',
        player: '#ffffff',
        playerShadow: 'rgba(0,0,0,0.25)'
    }
};

// --- STATE ---
let state = {
    width: 0,
    height: 0,
    centerX: 0,
    centerY: 0,
    playerZ: 0,
    lanes: [],
    score: 12,
    bestScore: 42,
    clouds: []
};

// --- UTILS ---

// Simple 3D Projection
function project(x, y, z) {
    // Camera follows player on Z
    // Camera X follows player X slightly to keep them centered but allow movement
    const camZ = state.playerZ + state.cameraDist;
    const camX = state.playerX * 0.3; // Parallax effect
    
    const scale = CONFIG.fov / (CONFIG.fov + (z - camZ));
    
    const screenX = state.centerX + (x - camX) * scale;
    const screenY = state.centerY + (y - CONFIG.cameraHeight) * scale;
    
    return { x: screenX, y: screenY, scale: scale };
}

// Hex color manipulation
function hexToRgb(hex) {
    let r = parseInt(hex.substring(1,3), 16);
    let g = parseInt(hex.substring(3,5), 16);
    let b = parseInt(hex.substring(5,7), 16);
    return {r, g, b};
}

function adjustColor(hex, percent) {
    let c = hexToRgb(hex);
    let r = Math.floor(c.r * (100 + percent) / 100);
    let g = Math.floor(c.g * (100 + percent) / 100);
    let b = Math.floor(c.b * (100 + percent) / 100);
    r = Math.min(255, Math.max(0, r));
    g = Math.min(255, Math.max(0, g));
    b = Math.min(255, Math.max(0, b));
    return `rgb(${r},${g},${b})`;
}

// --- CLASSES ---

class Cloud {
    constructor(z) {
        this.x = (Math.random() - 0.5) * 2000;
        this.y = (Math.random() * 100) - 100; // High up
        this.z = z;
        this.scale = 0.5 + Math.random() * 0.5;
    }
    draw() {
        const p = project(this.x, this.y, this.z);
        if (p.scale <= 0) return;
        
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 40 * p.scale * this.scale, 0, Math.PI*2);
        ctx.arc(p.x + 30*p.scale, p.y - 10*p.scale, 50 * p.scale * this.scale, 0, Math.PI*2);
        ctx.arc(p.x + 70*p.scale, p.y, 40 * p.scale * this.scale, 0, Math.PI*2);
        ctx.fill();
    }
}

class Lane {
    constructor(zIndex) {
        this.zIndex = zIndex;
        this.z = zIndex * CONFIG.laneWidth;
        this.type = this.determineType(zIndex);
        this.traffic = [];
        this.logs = [];
        
        // Initialize contents
        if (this.type === 'road') {
            this.speed = (Math.random() > 0.5 ? 1 : -1) * (3 + Math.random() * 2);
            const count = 2 + Math.floor(Math.random() * 2);
            for(let i=0; i<count; i++) {
                this.traffic.push({
                    x: i * 250 - 200,
                    width: 50,
                    height: 45,
                    depth: 35,
                    color: ['#ff6b6b', '#feca57', '#54a0ff', '#5f27cd'][Math.floor(Math.random()*4)]
                });
            }
        } else if (this.type === 'water') {
            this.speed = (Math.random() > 0.5 ? 1 : -1) * 2;
            // Add logs
            for(let i=0; i<3; i++) {
                this.logs.push({
                    x: i * 200 - 150,
                    width: 80 + Math.random() * 40,
                    height: 30,
                    depth: 30
                });
            }
        }
    }

    determineType(z) {
        // Pattern: Grass, Road, Road, Grass, Water, Grass
        const mod = Math.abs(z) % 6;
        if (mod === 0 || mod === 3 || mod === 5) return 'grass';
        if (mod === 1 || mod === 2) return 'road';
        if (mod === 4) return 'water';
        return 'grass';
    }

    update() {
        if (this.type === 'road') {
            this.traffic.forEach(car => {
                car.x += this.speed;
                if (this.speed > 0 && car.x > 600) car.x = -600;
                if (this.speed < 0 && car.x < -600) car.x = 600;
            });
        }
        if (this.type === 'water') {
            this.logs.forEach(log => {
                log.x += this.speed;
                if (this.speed > 0 && log.x > 600) log.x = -600;
                if (this.speed < 0 && log.x < -600) log.x = 600;
            });
        }
    }

    draw() {
        // Draw Terrain Base
        const pLeft = project(-250, 0, this.z);
        const pRight = project(250, 0, this.z);
        const pBackLeft = project(-250, 0, this.z + CONFIG.laneWidth);
        const pBackRight = project(250, 0, this.z + CONFIG.laneWidth);

        // Side (Depth)
        ctx.beginPath();
        ctx.moveTo(pLeft.x, pLeft.y);
        ctx.lineTo(pRight.x, pRight.y);
        ctx.lineTo(pBackRight.x, pBackRight.y);
        ctx.lineTo(pBackLeft.x, pBackLeft.y);
        ctx.closePath();
        
        let sideColor, topColor;
        if (this.type === 'grass') {
            sideColor = CONFIG.colors.grassDark;
            topColor = (Math.floor(this.zIndex) % 2 === 0) ? CONFIG.colors.grassLight : '#6bc04d';
        } else if (this.type === 'road') {
            sideColor = '#333';
            topColor = CONFIG.colors.road;
        } else if (this.type === 'water') {
            sideColor = CONFIG.colors.waterDark;
            topColor = CONFIG.colors.water;
        }
        
        ctx.fillStyle = sideColor;
        ctx.fill();

        // Top
        ctx.beginPath();
        ctx.moveTo(pBackLeft.x, pBackLeft.y);
        ctx.lineTo(pBackRight.x, pBackRight.y);
        ctx.lineTo(pRight.x, pRight.y);
        ctx.lineTo(pLeft.x, pLeft.y);
        ctx.closePath();
        ctx.fillStyle = topColor;
        ctx.fill();

        // Details
        if (this.type === 'road') {
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 3 * pLeft.scale;
            ctx.setLineDash([10 * pLeft.scale, 20 * pLeft.scale]);
            ctx.beginPath();
            ctx.moveTo(pLeft.x + 250*pLeft.scale, pLeft.y); // Center
            ctx.lineTo(pBackLeft.x + 250*pBackLeft.scale, pBackLeft.y);
            ctx.stroke();
            ctx.setLineDash([]);
        } else if (this.type === 'water') {
            // Logs
            this.logs.forEach(log => this.drawLog(log, pLeft.scale));
        }

        // Traffic (Cars)
        if (this.type === 'road') {
            this.traffic.forEach(car => this.drawCar(car, pLeft.scale));
        }
    }

    drawCar(car, scale) {
        const cx = car.x;
        const cz = this.z;
        const cw = car.width;
        const ch = car.height;
        const cd = car.depth;

        // Shadow
        const s1 = project(cx - cw/2, 0, cz);
        const s2 = project(cx + cw/2, 0, cz);
        const s3 = project(cx + cw/2, 0, cz + cd);
        const s4 = project(cx - cw/2, 0, cz + cd);
        
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.moveTo(s1.x, s1.y);
        ctx.lineTo(s2.x, s2.y);
        ctx.lineTo(s3.x, s3.y);
        ctx.lineTo(s4.x, s4.y);
        ctx.fill();

        // Box Vertices
        const v = [
            project(cx - cw/2, 0, cz), // 0 Front BL
            project(cx + cw/2, 0, cz), // 1 Front BR
            project(cx + cw/2, 0, cz + cd), // 2 Back BR
            project(cx - cw/2, 0, cz + cd), // 3 Back BL
            project(cx - cw/2, ch, cz), // 4 Front TL
            project(cx + cw/2, ch, cz), // 5 Front TR
            project(cx + cw/2, ch, cz + cd), // 6 Back TR
            project(cx - cw/2, ch, cz + cd)  // 7 Back TL
        ];

        // Draw Faces (Painter's algo inside object)
        // Top
        ctx.fillStyle = adjustColor(car.color, 20);
        ctx.beginPath(); ctx.moveTo(v[4].x, v[4].y); ctx.lineTo(v[5].x, v[5].y); ctx.lineTo(v[6].x, v[6].y); ctx.lineTo(v[7].x, v[7].y); ctx.fill();
        
        // Right
        ctx.fillStyle = adjustColor(car.color, -20);
        ctx.beginPath(); ctx.moveTo(v[1].x, v[1].y); ctx.lineTo(v[2].x, v[2].y); ctx.lineTo(v[6].x, v[6].y); ctx.lineTo(v[5].x, v[5].y); ctx.fill();

        // Left
        ctx.fillStyle = adjustColor(car.color, -40);
        ctx.beginPath(); ctx.moveTo(v[0].x, v[0].y); ctx.lineTo(v[3].x, v[3].y); ctx.lineTo(v[7].x, v[7].y); ctx.lineTo(v[4].x, v[4].y); ctx.fill();
        
        // Front
        ctx.fillStyle = adjustColor(car.color, 0);
        ctx.beginPath(); ctx.moveTo(v[0].x, v[0].y); ctx.lineTo(v[1].x, v[1].y); ctx.lineTo(v[5].x, v[5].y); ctx.lineTo(v[4].x, v[4].y); ctx.fill();
        
        // Headlights/Taillights (Simple dots)
        ctx.fillStyle = '#ffeb3b'; // Yellow lights
        if (this.speed > 0) {
            ctx.beginPath(); ctx.arc(v[0].x + 5*scale, v[0].y - 10*scale, 3*scale, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(v[1].x - 5*scale, v[1].y - 10*scale, 3*scale, 0, Math.PI*2); ctx.fill();
        }
    }

    drawLog(log, scale) {
        const lx = log.x;
        const lz = this.z;
        const lw = log.width;
        const lh = 10; // Slightly above water
        const ld = 30;

        const v = [
            project(lx - lw/2, lh, lz),
            project(lx + lw/2, lh, lz),
            project(lx + lw/2, lh, lz + ld),
            project(lx - lw/2, lh, lz + ld),
            project(lx - lw/2, lh+10, lz),
            project(lx + lw/2, lh+10, lz),
            project(lx + lw/2, lh+10, lz + ld),
            project(lx - lw/2, lh+10, lz + ld)
        ];

        // Shadow on water
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.moveTo(project(lx - lw/2, 0, lz).x, project(lx - lw/2, 0, lz).y);
        ctx.lineTo(project(lx + lw/2, 0, lz).x, project(lx + lw/2, 0, lz).y);
        ctx.lineTo(project(lx + lw/2, 0, lz + ld).x, project(lx + lw/2, 0, lz + ld).y);
        ctx.lineTo(project(lx - lw/2, 0, lz + ld).x, project(lx - lw/2, 0, lz + ld).y);
        ctx.fill();

        // Log Top
        ctx.fillStyle = CONFIG.colors.wood;
        ctx.beginPath(); ctx.moveTo(v[4].x, v[4].y); ctx.lineTo(v[5].x, v[5].y); ctx.lineTo(v[6].x, v[6].y); ctx.lineTo(v[7].x, v[7].y); ctx.fill();
        // Log Side
        ctx.fillStyle = CONFIG.colors.woodDark;
        ctx.beginPath(); ctx.moveTo(v[1].x, v[1].y); ctx.lineTo(v[2].x, v[2].y); ctx.lineTo(v[6].x, v[6].y); ctx.lineTo(v[5].x, v[5].y); ctx.fill();
        ctx.beginPath(); ctx.moveTo(v[0].x, v[0].y); ctx.lineTo(v[3].x, v[3].y); ctx.lineTo(v[7].x, v[7].y); ctx.lineTo(v[4].x, v[4].y); ctx.fill();
    }
}

class Player {
    constructor() {
        this.x = 0;
        this.z = 0;
        this.targetX = 0;
        this.targetZ = 0;
        this.hopY = 0;
        this.hopVel = 0;
        this.isHopping = false;
        this.width = 30;
        this.height = 40;
        this.depth = 30;
    }

    move(dx, dy) {
        if (this.isHopping) return;
        
        this.targetX += dx * CONFIG.laneSize;
        this.targetZ += dy * CONFIG.laneWidth;
        
        this.isHopping = true;
        this.hopVel = 8;
        
        if (dy > 0) {
            state.score++;
            const scoreEl = document.getElementById('current-score');
            const pill = document.getElementById('score-pill');
            scoreEl.innerText = state.score;
            pill.classList.add('pop');
            setTimeout(() => pill.classList.remove('pop'), 100);
        }
    }

    update() {
        // Smooth Lerp
        this.x += (this.targetX - this.x) * 0.2;
        this.z += (this.targetZ - this.z) * 0.2;

        // Hop Physics
        if (this.isHopping) {
            this.hopY += this.hopVel;
            this.hopVel -= 0.5; // Gravity
            
            if (this.hopY <= 0) {
                this.hopY = 0;
                this.isHopping = false;
                this.x = this.targetX;
                this.z = this.targetZ;
                state.playerZ = this.z;
                state.playerX = this.x;
            }
        }
    }

    draw() {
        // Shadow (Always on ground)
        const sP = project(this.x, 0, this.z);
        ctx.fillStyle = CONFIG.colors.playerShadow;
        ctx.beginPath();
        ctx.ellipse(sP.x, sP.y, 18 * sP.scale, 9 * sP.scale, 0, 0, Math.PI*2);
        ctx.fill();

        // Chicken Geometry
        const pX = this.x;
        const pY = this.hopY;
        const pZ = this.z;
        const w = this.width;
        const h = this.height;
        const d = this.depth;

        // Vertices (Bottom 0-3, Top 4-7)
        const v = [
            project(pX - w/2, pY, pZ),       // 0 FBL
            project(pX + w/2, pY, pZ),       // 1 FBR
            project(pX + w/2, pY, pZ + d),   // 2 BBR
            project(pX - w/2, pY, pZ + d),   // 3 BBL
            project(pX - w/2, pY + h, pZ),   // 4 FTL
            project(pX + w/2, pY + h, pZ),   // 5 FTR
            project(pX + w/2, pY + h, pZ + d), // 6 BTR
            project(pX - w/2, pY + h, pZ + d)  // 7 BTL
        ];

        // Draw Body (White)
        // Top
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.moveTo(v[4].x, v[4].y); ctx.lineTo(v[5].x, v[5].y); ctx.lineTo(v[6].x, v[6].y); ctx.lineTo(v[7].x, v[7].y); ctx.fill();
        // Right
        ctx.fillStyle = '#e0e0e0';
        ctx.beginPath(); ctx.moveTo(v[1].x, v[1].y); ctx.lineTo(v[2].x, v[2].y); ctx.lineTo(v[6].x, v[6].y); ctx.lineTo(v[5].x, v[5].y); ctx.fill();
        // Left
        ctx.fillStyle = '#cccccc';
        ctx.beginPath(); ctx.moveTo(v[0].x, v[0].y); ctx.lineTo(v[3].x, v[3].y); ctx.lineTo(v[7].x, v[7].y); ctx.lineTo(v[4].x, v[4].y); ctx.fill();
        // Front
        ctx.fillStyle = '#f5f5f5';
        ctx.beginPath(); ctx.moveTo(v[0].x, v[0].y); ctx.lineTo(v[1].x, v[1].y); ctx.lineTo(v[5].x, v[5].y); ctx.lineTo(v[4].x, v[4].y); ctx.fill();

        // Details: Comb (Red triangle on top front)
        ctx.fillStyle = '#ff4757';
        ctx.beginPath();
        ctx.moveTo(v[4].x, v[4].y - 10*v[0].scale);
        ctx.lineTo(v[5].x, v[5].y - 10*v[0].scale);
        ctx.lineTo(v[5].x, v[5].y);
        ctx.lineTo(v[4].x, v[4].y);
        ctx.fill();

        // Details: Beak (Yellow triangle on front)
        ctx.fillStyle = '#ffa502';
        ctx.beginPath();
        ctx.moveTo(v[0].x + 5*v[0].scale, v[0].y - 20*v[0].scale);
        ctx.lineTo(v[1].x - 5*v[0].scale, v[0].y - 20*v[0].scale);
        ctx.lineTo(v[1].x - 10*v[0].scale, v[0].y - 10*v[0].scale); // Point down
        ctx.lineTo(v[0].x + 10*v[0].scale, v[0].y - 10*v[0].scale);
        ctx.fill();

        // Details: Eyes (Black dots)
        ctx.fillStyle = '#2f3542';
        ctx.beginPath();
        ctx.arc(v[0].x + 8*v[0].scale, v[0].y - 25*v[0].scale, 2.5*v[0].scale, 0, Math.PI*2);
        ctx.arc(v[1].x - 8*v[0].scale, v[1].y - 25*v[0].scale, 2.5*v[0].scale, 0, Math.PI*2);
        ctx.fill();
    }
}

// --- INITIALIZATION ---

const player = new Player();

function init() {
    resize();
    window.addEventListener('resize', resize);
    
    // Generate initial world
    for (let i = -10; i < 30; i++) {
        state.lanes.push(new Lane(i));
    }
    
    // Generate clouds
    for(let i=0; i<10; i++) {
        state.clouds.push(new Cloud(Math.random() * 2000));
    }

    // Input Handling
    window.addEventListener('keydown', (e) => {
        switch(e.key) {
            case 'ArrowUp': case 'w': player.move(0, 1); break;
            case 'ArrowDown': case 's': player.move(0, -1); break;
            case 'ArrowLeft': case 'a': player.move(-1, 0); break;
            case 'ArrowRight': case 'd': player.move(1, 0); break;
        }
    });

    // D-Pad Listeners
    document.querySelectorAll('.d-btn').forEach(btn => {
        btn.addEventListener('mousedown', (e) => {
            e.preventDefault(); // Prevent focus sticking
            const dir = btn.dataset.dir;
            if(dir === 'up') player.move(0, 1);
            if(dir === 'down') player.move(0, -1);
            if(dir === 'left') player.move(-1, 0);
            if(dir === 'right') player.move(1, 0);
        });
        // Touch support
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const dir = btn.dataset.dir;
            if(dir === 'up') player.move(0, 1);
            if(dir === 'down') player.move(0, -1);
            if(dir === 'left') player.move(-1, 0);
            if(dir === 'right') player.move(1, 0);
        });
    });

    loop();
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    state.width = canvas.width;
    state.height = canvas.height;
    state.centerX = state.width / 2;
    state.centerY = state.height / 2 + 80; // Shift down to center action
}

// --- GAME LOOP ---

function loop() {
    // Clear & Draw Sky
    const gradient = ctx.createLinearGradient(0, 0, 0, state.height);
    gradient.addColorStop(0, CONFIG.colors.skyTop);
    gradient.addColorStop(1, CONFIG.colors.skyBottom);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, state.width, state.height);

    // Update Logic
    player.update();
    state.lanes.forEach(lane => lane.update());
    
    // Infinite Scroll
    const playerLaneIndex = Math.floor(player.z / CONFIG.laneWidth);
    if (state.lanes[0].zIndex < playerLaneIndex - 5) {
        state.lanes.shift();
        const lastZ = state.lanes[state.lanes.length-1].zIndex;
        state.lanes.push(new Lane(lastZ + 1));
    }

    // Draw Clouds (Background)
    state.clouds.forEach(c => c.draw());

    // Draw Lanes (Back to Front)
    const sortedLanes = [...state.lanes].sort((a, b) => b.z - a.z);
    sortedLanes.forEach(lane => {
        if (lane.z < state.playerZ - CONFIG.cameraDist) return; // Cull behind
        if (lane.z > state.playerZ + CONFIG.fov * 2) return; // Cull too far
        lane.draw();
    });

    // Draw Player
    player.draw();

    requestAnimationFrame(loop);
}

// Start
init();

</script>
</body>
</html>
