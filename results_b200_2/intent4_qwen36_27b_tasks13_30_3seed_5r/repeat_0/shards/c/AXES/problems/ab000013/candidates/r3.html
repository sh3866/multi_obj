<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indian Auto Rickshaw — Street Legend</title>
<style>
  :root {
    /* Lively Indian Street Palette */
    --bg-sky-top: #FF8C42; /* Sunset Orange */
    --bg-sky-bottom: #FFD166; /* Golden Hour */
    --street-surface: #2D3436;
    --street-highlight: #4B5458;
    
    /* Vehicle Palette */
    --rick-main: #F4D03F; /* Auto Yellow */
    --rick-dark: #B7950B;
    --rick-accent: #E74C3C; /* Deep Red/Pink Trim */
    --chrome: #ECF0F1;
    --chrome-shadow: #BDC3C7;
    --tire: #17202A;
    --interior: #2C3E50;
    
    /* Typography */
    --font-display: 'Impact', 'Arial Black', sans-serif;
    --font-body: 'Courier New', Courier, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--bg-sky-top);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    font-family: var(--font-body);
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1000px;
  }

  /* --- Composition Container --- */
  .showcase-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Vibrant Sunset Gradient */
    background: linear-gradient(to bottom, var(--bg-sky-top) 0%, var(--bg-sky-bottom) 60%, var(--street-surface) 60%, var(--street-surface) 100%);
    overflow: hidden;
  }

  /* --- Background Elements (Cityscape Silhouette) --- */
  .city-silhouette {
    position: absolute;
    bottom: 40%; /* Align with horizon */
    left: 0;
    width: 100%;
    height: 200px;
    z-index: 1;
    opacity: 0.4;
    pointer-events: none;
  }

  /* --- Typography Overlay --- */
  .ui-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 20;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 3rem;
  }

  .title-block {
    align-self: flex-end; /* Moved to right to balance vehicle */
    text-align: right;
    transform: skewX(-5deg);
    margin-right: 2rem;
  }

  .title-block h1 {
    font-family: var(--font-display);
    font-size: 4.5rem; /* Reduced scale */
    line-height: 0.9;
    color: #FFF;
    text-transform: uppercase;
    letter-spacing: -1px;
    text-shadow: 3px 3px 0px rgba(0,0,0,0.2);
    margin-bottom: 0.5rem;
  }

  .title-block h1 span {
    color: var(--street-surface); /* Contrast against sky */
    display: block;
    font-size: 0.5em;
    letter-spacing: 2px;
    font-family: var(--font-body);
    font-weight: normal;
  }

  .title-block p {
    font-family: var(--font-body);
    color: #FFF;
    font-weight: bold;
    font-size: 1.2rem;
    background: var(--rick-accent);
    display: inline-block;
    padding: 5px 10px;
    transform: skewX(5deg); /* Counter skew for readability */
  }

  /* --- The Stage (SVG) --- */
  .stage {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
  }

  #rickshaw-svg {
    width: 85%;
    height: 85%;
    max-width: 1100px;
    filter: drop-shadow(20px 30px 20px rgba(0,0,0,0.4));
    transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* --- Annotations --- */
  .annotation {
    position: absolute;
    display: flex;
    align-items: center;
    pointer-events: auto;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.5s ease;
    z-index: 30;
  }
  
  .annotation.visible { opacity: 1; }

  .ann-dot {
    width: 10px;
    height: 10px;
    background: #FFF;
    border: 2px solid var(--rick-accent);
    border-radius: 50%;
    position: relative;
    z-index: 2;
    box-shadow: 0 0 5px rgba(0,0,0,0.5);
  }
  
  .ann-line {
    height: 1px;
    background: #FFF;
    width: 40px;
    position: relative;
    margin-right: 8px;
    opacity: 0.8;
  }

  .ann-content {
    background: rgba(44, 62, 80, 0.85); /* Dark readable box */
    backdrop-filter: blur(4px);
    padding: 0.4rem 0.8rem;
    border-left: 3px solid var(--rick-main);
    color: #FFF;
    min-width: 120px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    border-radius: 0 4px 4px 0;
  }

  .ann-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    color: #BDC3C7;
    letter-spacing: 0.1em;
    margin-bottom: 2px;
  }
  
  .ann-value {
    font-family: var(--font-display);
    color: var(--rick-main);
    font-size: 1rem;
    letter-spacing: 0.5px;
  }

  /* --- Footer Info --- */
  .bottom-bar {
    position: absolute;
    bottom: 2rem;
    left: 3rem;
    text-align: left;
    font-family: var(--font-body);
    font-size: 0.7rem;
    color: rgba(255,255,255,0.6);
    pointer-events: none;
    z-index: 20;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

</style>
</head>
<body>

<div class="showcase-container">
  
  <!-- Background: City Silhouette -->
  <svg class="city-silhouette" viewBox="0 0 1000 200" preserveAspectRatio="none">
    <path d="M0,200 L0,150 L50,150 L50,100 L100,100 L100,140 L150,140 L150,80 L200,80 L200,120 L250,120 L250,160 L300,160 L300,90 L350,90 L350,180 L400,180 L400,110 L450,110 L450,130 L500,130 L500,70 L550,70 L550,150 L600,150 L600,120 L650,120 L650,180 L700,180 L700,100 L750,100 L750,160 L800,160 L800,90 L850,90 L850,140 L900,140 L900,170 L950,170 L950,120 L1000,120 L1000,200 Z" fill="#2C3E50"/>
  </svg>

  <!-- UI Overlay -->
  <div class="ui-overlay">
    <div class="title-block">
      <h1>Auto <span>Rickshaw</span></h1>
      <p>INDIAN STREET LEGEND</p>
    </div>
    <div class="bottom-bar">
      Vector Render System &bull; 3/4 Perspective<br>
      "The King of the Road"
    </div>
  </div>

  <!-- The Stage -->
  <div class="stage">
    <!-- SVG Drawing -->
    <svg id="rickshaw-svg" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Body Paint Gradient (Yellow) -->
        <linearGradient id="paint-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:var(--rick-main)" />
          <stop offset="50%" style="stop-color:#F7DC6F" />
          <stop offset="100%" style="stop-color:var(--rick-dark)" />
        </linearGradient>

        <!-- Chrome Gradient -->
        <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#FFF" />
          <stop offset="40%" style="stop-color:#BDC3C7" />
          <stop offset="60%" style="stop-color:#FFF" />
          <stop offset="100%" style="stop-color:#7F8C8D" />
        </linearGradient>

        <!-- Glass Gradient -->
        <linearGradient id="glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:rgba(130, 224, 255, 0.4)" />
          <stop offset="100%" style="stop-color:rgba(44, 62, 80, 0.8)" />
        </linearGradient>

        <!-- Headlight Beam -->
        <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#FFF9C4; stop-opacity:0.9" />
          <stop offset="100%" style="stop-color:#FFF9C4; stop-opacity:0" />
        </linearGradient>
      </defs>

      <!-- GROUND SHADOW -->
      <ellipse cx="500" cy="630" rx="350" ry="50" fill="rgba(0,0,0,0.5)" filter="blur(10px)" />

      <!-- 1. REAR WHEELS (Visible structure) -->
      <!-- Left Rear Wheel (Further back) -->
      <g transform="translate(280, 580)">
        <!-- Tire -->
        <path d="M-65,0 A 65 65 0 1 0 65,0 A 65 65 0 1 0 -65,0" fill="var(--tire)" />
        <path d="M-58,0 A 58 58 0 1 0 58,0 A 58 58 0 1 0 -58,0" fill="#2C3E50" /> <!-- Inner tire -->
        <!-- Rim -->
        <path d="M-45,0 A 45 45 0 1 0 45,0 A 45 45 0 1 0 -45,0" fill="url(#chrome-grad)" />
        <!-- Spokes -->
        <path d="M0,-40 L0,40 M-35,-22 L35,22 M-35,22 L35,-22" stroke="#7F8C8D" stroke-width="4" />
        <!-- Hub -->
        <circle cx="0" cy="0" r="8" fill="#333" />
        <!-- Mudguard -->
        <path d="M-75,10 A 80 80 0 0 1 75,10" fill="none" stroke="url(#paint-yellow)" stroke-width="12" stroke-linecap="round"/>
      </g>

      <!-- Right Rear Wheel (Closer) -->
      <g transform="translate(650, 600)">
        <!-- Tire -->
        <path d="M-75,0 A 75 75 0 1 0 75,0 A 75 75 0 1 0 -75,0" fill="var(--tire)" />
        <path d="M-68,0 A 68 68 0 1 0 68,0 A 68 68 0 1 0 -68,0" fill="#2C3E50" />
        <!-- Rim -->
        <path d="M-52,0 A 52 52 0 1 0 52,0 A 52 52 0 1 0 -52,0" fill="url(#chrome-grad)" />
        <!-- Spokes -->
        <path d="M0,-48 L0,48 M-40,-28 L40,28 M-40,28 L40,-28" stroke="#7F8C8D" stroke-width="5" />
        <!-- Hub -->
        <circle cx="0" cy="0" r="10" fill="#333" />
        <!-- Mudguard -->
        <path d="M-85,15 A 90 90 0 0 1 85,15" fill="none" stroke="url(#paint-yellow)" stroke-width="14" stroke-linecap="round"/>
      </g>

      <!-- 2. CHASSIS & ENGINE -->
      <!-- Frame Bar -->
      <path d="M 280 580 L 650 600" stroke="#333" stroke-width="15" />
      
      <!-- Engine Block (Visible between wheels) -->
      <g transform="translate(400, 540)">
        <path d="M0,0 L 120,0 L 130,70 L -10,70 Z" fill="#222" />
        <path d="M10,10 L 110,10 L 115,60 L 5,60 Z" fill="#111" />
        <!-- Fins -->
        <line x1="10" y1="20" x2="110" y2="20" stroke="#333" stroke-width="3"/>
        <line x1="10" y1="30" x2="110" y2="30" stroke="#333" stroke-width="3"/>
        <line x1="10" y1="40" x2="110" y2="40" stroke="#333" stroke-width="3"/>
        <!-- Exhaust Pipe -->
        <path d="M 60 70 L 30 100 L 10 100" fill="none" stroke="#555" stroke-width="8" stroke-linecap="round"/>
      </g>

      <!-- 3. CABIN (Passenger Area) -->
      <!-- Interior Back Wall -->
      <path d="M 300 320 L 580 320 L 580 540 L 300 540 Z" fill="url(#interior)" />
      
      <!-- Interior Seat (Bench) -->
      <path d="M 300 390 L 580 390 L 580 430 L 300 430 Z" fill="#34495E" /> <!-- Backrest -->
      <path d="M 300 430 L 580 430 L 560 480 L 320 480 Z" fill="#2C3E50" /> <!-- Cushion -->
      <!-- Seat Pattern (Ornamental) -->
      <path d="M 330 440 L 350 460 M 370 440 L 390 460 M 410 440 L 430 460 M 450 440 L 470 460 M 490 440 L 510 460 M 530 440 L 550 460" stroke="#E74C3C" stroke-width="3"/>

      <!-- Back Wall Exterior -->
      <path d="M 300 320 L 580 320 L 580 540 L 300 540 Z" fill="url(#paint-yellow)" stroke="#222" stroke-width="2"/>
      
      <!-- Back Window -->
      <path d="M 320 340 L 560 340 L 560 400 L 320 400 Z" fill="#111" stroke="#111" stroke-width="2" />
      <path d="M 320 340 L 560 340 L 560 400 L 320 400 Z" fill="rgba(0,0,0,0.6)" /> <!-- Dark Glass -->

      <!-- Side Wall (Visible Left Face) -->
      <!-- Correct Perspective: Top edge goes up-right, Bottom edge goes up-right but less steep -->
      <path d="M 300 320 L 300 540 L 420 590 L 420 370 Z" fill="url(#paint-yellow)" stroke="#222" stroke-width="2"/>
      
      <!-- Door Panel Lines -->
      <path d="M 300 380 L 420 430" stroke="#B7950B" stroke-width="3" />
      
      <!-- Side Window -->
      <path d="M 310 390 L 410 435 L 410 510 L 310 460 Z" fill="#111" stroke="#111" stroke-width="2"/>
      <path d="M 310 390 L 410 435 L 410 510 L 310 460 Z" fill="rgba(0,0,0,0.5)" />

      <!-- Ornamental Stripes (Red & Black) -->
      <path d="M 300 480 L 420 535 L 420 550 L 300 495 Z" fill="var(--rick-accent)" />
      <path d="M 300 495 L 420 550 L 420 560 L 300 505 Z" fill="#111" />
      <path d="M 300 320 L 300 330 L 420 380 L 420 370 Z" fill="#111" /> <!-- Top Trim -->

      <!-- Stickers -->
      <g transform="translate(330, 450)">
        <!-- Jai Hind Label with backing -->
        <rect x="0" y="0" width="50" height="24" fill="rgba(255,255,255,0.9)" transform="rotate(-10)" rx="2" />
        <text x="25" y="16" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#000" transform="rotate(-10)">JAI HIND</text>
      </g>
      <!-- Star Sticker -->
      <circle cx="360" cy="410" r="12" fill="#FF5722" />
      <text x="360" y="415" text-anchor="middle" font-family="Arial" font-size="12" fill="#FFF">★</text>

      <!-- 4. ROOF & CANOPY -->
      <!-- Top Roof Surface -->
      <path d="M 290 320 L 570 320 L 670 360 L 390 360 Z" fill="url(#chrome-grad)" stroke="#222" stroke-width="2"/>
      
      <!-- Roof Rack -->
      <path d="M 280 310 L 560 310 L 660 350 L 380 350 Z" fill="none" stroke="#333" stroke-width="4" />
      <path d="M 280 310 L 380 350" stroke="#333" stroke-width="4" />
      <!-- Rack Bars -->
      <path d="M 320 310 L 420 350 M 360 310 L 460 350 M 400 310 L 500 350 M 440 310 L 540 350 M 480 310 L 580 350 M 520 310 L 620 350" stroke="#333" stroke-width="3" />

      <!-- 5. FRONT ASSEMBLY (Driver) -->
      <!-- Front Cabin Wall -->
      <path d="M 580 320 L 670 360 L 670 520 L 580 480 Z" fill="url(#paint-yellow)" stroke="#222" stroke-width="2"/>
      
      <!-- Windshield -->
      <path d="M 580 320 L 670 360 L 670 440 L 580 400 Z" fill="url(#glass-grad)" stroke="#111" stroke-width="3"/>
      <!-- Windshield Reflection -->
      <path d="M 590 330 L 620 345 L 620 400 L 590 385 Z" fill="rgba(255,255,255,0.4)" />

      <!-- Handlebars (Distinctive) -->
      <g transform="translate(620, 450)">
        <!-- Stem -->
        <path d="M 0 0 L 0 50" stroke="#333" stroke-width="10" stroke-linecap="round"/>
        <!-- Bar -->
        <path d="M -50 20 L 50 40" stroke="#333" stroke-width="10" stroke-linecap="round" />
        <!-- Grips -->
        <path d="M -50 20 L -60 15" stroke="#111" stroke-width="12" stroke-linecap="round"/>
        <path d="M 50 40 L 60 45" stroke="#111" stroke-width="12" stroke-linecap="round"/>
      </g>

      <!-- Mirrors (Added) -->
      <!-- Left Mirror -->
      <g transform="translate(580, 400)">
        <path d="M 0 0 L -30 -40 L -45 -35" fill="none" stroke="#333" stroke-width="3" />
        <ellipse cx="-45" cy="-35" rx="6" ry="10" fill="#111" transform="rotate(-10 -45 -35)" />
      </g>
      <!-- Right Mirror -->
      <g transform="translate(660, 430)">
        <path d="M 0 0 L 30 -40 L 45 -35" fill="none" stroke="#333" stroke-width="3" />
        <ellipse cx="45" cy="-35" rx="6" ry="10" fill="#111" transform="rotate(10 45 -35)" />
      </g>

      <!-- Driver Figure -->
      <!-- Head -->
      <circle cx="620" cy="360" r="14" fill="#D7CCC8" /> <!-- Skin -->
      <path d="M 610 360 Q 620 345 630 360 Q 620 350 610 360" fill="#FFF" /> <!-- Turban/Cap -->
      <!-- Body -->
      <path d="M 605 375 L 635 375 L 645 440 L 595 440 Z" fill="#1A237E" /> <!-- Shirt -->
      <!-- Arms -->
      <path d="M 610 380 L 560 450" stroke="#D7CCC8" stroke-width="6" stroke-linecap="round" />
      <path d="M 630 380 L 670 470" stroke="#D7CCC8" stroke-width="6" stroke-linecap="round" />

      <!-- Headlamp -->
      <g transform="translate(650, 510)">
        <circle cx="0" cy="0" r="40" fill="url(#beam-grad)" opacity="0.6" transform="rotate(-15)" />
        <circle cx="0" cy="0" r="25" fill="#222" stroke="url(#chrome-grad)" stroke-width="5" />
        <circle cx="0" cy="0" r="16" fill="#FFF" />
        <circle cx="0" cy="0" r="10" fill="#FFF9C4" />
        <!-- Lens Reflection -->
        <circle cx="-6" cy="-6" r="5" fill="#FFF" opacity="0.8" />
      </g>

      <!-- Front Wheel (Single, clearly visible) -->
      <g transform="translate(650, 600)">
        <ellipse cx="0" cy="0" rx="60" ry="55" fill="var(--tire)" />
        <ellipse cx="0" cy="0" rx="53" ry="48" fill="#424242" />
        <ellipse cx="0" cy="0" rx="38" ry="34" fill="url(#chrome-grad)" />
        <ellipse cx="0" cy="0" rx="10" ry="9" fill="#333" />
        <!-- Mudguard -->
        <path d="M-65,15 A 70 65 0 0 1 65,15" fill="none" stroke="url(#paint-yellow)" stroke-width="14" stroke-linecap="round"/>
      </g>

      <!-- Details: Hanging Prayer Flag -->
      <g transform="translate(290, 320)">
        <line x1="0" y1="0" x2="0" y2="30" stroke="#333" stroke-width="1" />
        <path d="M 0 0 L 15 5 L 0 10 Z" fill="#E74C3C" />
        <path d="M 0 10 L 10 15 L 0 20 Z" fill="#F4D03F" />
      </g>
      
    </svg>

    <!-- Annotations Layer (Positioned via JS) -->
    <div id="annotations-container"></div>
  </div>
</div>

<script>
  // Configuration for Annotations
  const annotations = [
    { label: "Bodywork", value: "Fiber Reinforced", svgX: 360, svgY: 450, offset: {x: -120, y: -30} },
    { label: "Headlamp", value: "Halogen 55W", svgX: 650, svgY: 510, offset: {x: 50, y: -40} },
    { label: "Driver", value: "Licensed Pro", svgX: 620, svgY: 360, offset: {x: 50, y: -30} },
    { label: "Roof", value: "Aluminum Sheet", svgX: 500, svgY: 330, offset: {x: -80, y: -50} },
    { label: "Rear Axle", value: "Twin Wheel", svgX: 460, svgY: 600, offset: {x: 60, y: 40} },
  ];

  const container = document.getElementById('annotations-container');
  const svg = document.getElementById('rickshaw-svg');

  // Create Annotation Elements
  annotations.forEach((ann, index) => {
    const el = document.createElement('div');
    el.className = 'annotation';
    el.id = `ann-${index}`;
    el.innerHTML = `
      <div class="ann-content">
        <div class="ann-label">${ann.label}</div>
        <div class="ann-value">${ann.value}</div>
      </div>
      <div class="ann-line"></div>
      <div class="ann-dot"></div>
    `;
    container.appendChild(el);
  });

  // Positioning Logic
  function updatePositions() {
    const svgRect = svg.getBoundingClientRect();
    const svgWidth = svgRect.width;
    const svgHeight = svgRect.height;
    const viewBox = svg.viewBox.baseVal;

    annotations.forEach((ann, index) => {
      const el = document.getElementById(`ann-${index}`);
      
      // Calculate scale factor
      const scaleX = svgWidth / viewBox.width;
      const scaleY = svgHeight / viewBox.height;

      // Calculate absolute position on screen relative to container
      const absX = svgRect.left + (ann.svgX * scaleX);
      const absY = svgRect.top + (ann.svgY * scaleY);

      // Apply position
      el.style.position = 'absolute';
      el.style.left = `${absX + ann.offset.x}px`;
      el.style.top = `${absY + ann.offset.y}px`;
      
      // Animate in
      setTimeout(() => {
        el.classList.add('visible');
      }, 500 + (index * 150));
    });
  }

  // Parallax Effect
  const showcase = document.querySelector('.showcase-container');
  
  showcase.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth) - 0.5;
    const y = (e.clientY / window.innerHeight) - 0.5;

    // Move SVG slightly
    svg.style.transform = `
      translate(${x * 20}px, ${y * 10}px) 
      rotateY(${x * 5}deg)
    `;
    
    // Move background silhouette opposite direction (Parallax)
    document.querySelector('.city-silhouette').style.transform = `translate(${x * -30}px, 0)`;
  });

  // Init
  window.addEventListener('load', updatePositions);
  window.addEventListener('resize', updatePositions);

</script>
</body>
</html>
