<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mumbai Auto Rickshaw - 3/4 Perspective</title>
<style>
  :root {
    --sky-top: #1a0b2e;
    --sky-mid: #5e1e3e;
    --sky-horizon: #d35400;
    --street: #0f0f12;
    
    /* Vehicle Colors */
    --rickshaw-yellow: #f1c40f;
    --rickshaw-yellow-dark: #b7950b;
    --rickshaw-yellow-light: #f7dc6f;
    --chrome: #bdc3c7;
    --chrome-bright: #ecf0f1;
    --tire: #111;
    --chrome-wheel: #95a5a6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--street);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    font-family: 'Arial Black', 'Helvetica Neue', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1000px;
  }

  /* --- The Stage --- */
  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-mid) 40%, var(--sky-horizon) 75%, var(--street) 75%);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* --- Background Elements --- */
  .bg-silhouette {
    position: absolute;
    bottom: 25%; 
    left: 0;
    width: 100%;
    height: 350px;
    z-index: 1;
    opacity: 0.9;
    filter: blur(2px);
    transition: transform 0.1s ease-out;
  }

  /* --- Typography --- */
  .title-block {
    position: absolute;
    top: 4%;
    left: 4%;
    z-index: 20;
    text-align: left;
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  .title-main {
    font-size: 4rem;
    line-height: 0.9;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: -2px;
    text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
    opacity: 0.9;
  }

  .title-sub {
    font-family: 'Courier New', monospace;
    font-size: 1rem;
    color: #fff;
    background: rgba(231, 76, 60, 0.8);
    display: inline-block;
    padding: 4px 10px;
    margin-top: 5px;
    font-weight: bold;
    letter-spacing: 2px;
  }

  /* --- The Vehicle Container --- */
  .vehicle-stage {
    position: relative;
    z-index: 10;
    width: 90%;
    max-width: 1100px;
    height: auto;
    transition: transform 0.1s ease-out;
    filter: drop-shadow(0px 40px 25px rgba(0,0,0,0.7));
  }

  svg {
    width: 100%;
    height: auto;
    display: block;
  }

  /* --- Interaction --- */
  .sticker {
    transition: transform 0.2s;
    transform-origin: center;
  }
  .sticker:hover {
    transform: scale(1.05);
  }

</style>
</head>
<body>

<div class="scene">
  
  <!-- Background Skyline (Mumbai Silhouette) -->
  <svg class="bg-silhouette" viewBox="0 0 1200 350" preserveAspectRatio="none">
    <path d="M0,350 L0,280 L80,280 L80,200 L150,200 L150,250 L220,250 L220,180 L280,180 L280,260 L350,260 L350,150 L420,150 L420,290 L500,290 L500,120 L560,120 L560,200 L620,200 L620,140 L680,140 L680,250 L750,250 L750,160 L820,160 L820,280 L900,280 L900,190 L980,190 L980,260 L1050,260 L1050,220 L1120,220 L1120,300 L1200,300 L1200,350 Z" fill="#11051e"/>
    <!-- Gateway of India Suggestion -->
    <path d="M500,350 L500,250 Q550,200 600,250 L600,350" fill="none" stroke="#11051e" stroke-width="20"/>
  </svg>

  <!-- Typography -->
  <div class="title-block">
    <h1 class="title-main">MUMBAI<br>DRIFTER</h1>
    <div class="title-sub">NO. MH-04-2024</div>
  </div>

  <!-- The Vehicle -->
  <div class="vehicle-stage" id="vehicle-stage">
    <svg viewBox="0 0 1100 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gradients -->
        <linearGradient id="paint-yellow" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:var(--rickshaw-yellow-light)" />
          <stop offset="50%" style="stop-color:var(--rickshaw-yellow)" />
          <stop offset="100%" style="stop-color:var(--rickshaw-yellow-dark)" />
        </linearGradient>

        <linearGradient id="paint-yellow-side" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#d4ac0d" />
          <stop offset="100%" style="stop-color:#9a7d0a" />
        </linearGradient>

        <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#fff" />
          <stop offset="25%" style="stop-color:#bdc3c7" />
          <stop offset="50%" style="stop-color:#fff" />
          <stop offset="75%" style="stop-color:#7f8c8d" />
          <stop offset="100%" style="stop-color:#fff" />
        </linearGradient>

        <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:rgba(255,255,255,0.8)" />
          <stop offset="30%" style="stop-color:rgba(173,216,230,0.4)" />
          <stop offset="100%" style="stop-color:rgba(44,62,80,0.8)" />
        </linearGradient>

        <linearGradient id="tire-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#000" />
          <stop offset="50%" style="stop-color:#222" />
          <stop offset="100%" style="stop-color:#000" />
        </linearGradient>
        
        <radialGradient id="headlight-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" style="stop-color:#fff; stop-opacity:1" />
          <stop offset="40%" style="stop-color:#fff9c4; stop-opacity:0.8" />
          <stop offset="100%" style="stop-color:#fff9c4; stop-opacity:0" />
        </radialGradient>
      </defs>

      <!-- 1. GROUND SHADOW -->
      <ellipse cx="550" cy="660" rx="400" ry="50" fill="rgba(0,0,0,0.6)" filter="blur(20px)" />

      <!-- 2. REAR WHEELS -->
      <!-- Left Rear Wheel (Background) -->
      <g transform="translate(320, 620)">
        <path d="M-75,0 A 75 75 0 1 0 75,0 A 75 75 0 1 0 -75,0" fill="url(#tire-grad)" />
        <path d="M-65,0 A 65 65 0 1 0 65,0 A 65 65 0 1 0 -65,0" fill="#333" />
        <path d="M-55,0 A 55 55 0 1 0 55,0 A 55 55 0 1 0 -55,0" fill="url(#chrome-wheel)" />
        <!-- Spokes -->
        <g stroke="#555" stroke-width="8">
          <line x1="0" y1="-50" x2="0" y2="50" />
          <line x1="-43" y1="-25" x2="43" y2="25" />
          <line x1="-43" y1="25" x2="43" y2="-25" />
        </g>
        <circle cx="0" cy="0" r="15" fill="#111" />
        <!-- Mudguard (Background) -->
        <path d="M-90,10 A 95 90 0 0 1 90,10" fill="none" stroke="url(#paint-yellow)" stroke-width="18" stroke-linecap="round"/>
        <path d="M-90,10 A 95 90 0 0 1 90,10" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
      </g>

      <!-- Right Rear Wheel (Foreground) -->
      <g transform="translate(680, 640)">
        <path d="M-85,0 A 85 85 0 1 0 85,0 A 85 85 0 1 0 -85,0" fill="url(#tire-grad)" />
        <path d="M-75,0 A 75 75 0 1 0 75,0 A 75 75 0 1 0 -75,0" fill="#222" />
        <path d="M-60,0 A 60 60 0 1 0 60,0 A 60 60 0 1 0 -60,0" fill="url(#chrome-wheel)" />
        <!-- Spokes -->
        <g stroke="#555" stroke-width="10">
          <line x1="0" y1="-55" x2="0" y2="55" />
          <line x1="-47" y1="-27" x2="47" y2="27" />
          <line x1="-47" y1="27" x2="47" y2="-27" />
        </g>
        <circle cx="0" cy="0" r="18" fill="#111" />
        <!-- Mudguard (Foreground) -->
        <path d="M-100,15 A 105 100 0 0 1 100,15" fill="none" stroke="url(#paint-yellow)" stroke-width="20" stroke-linecap="round"/>
        <path d="M-100,15 A 105 100 0 0 1 100,15" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
      </g>

      <!-- 3. CHASSIS & ENGINE -->
      <!-- Main Frame (Connecting Rear to Front) -->
      <path d="M 320 620 L 680 640" stroke="#111" stroke-width="24" stroke-linecap="round" />
      
      <!-- Engine Block -->
      <g transform="translate(450, 580)">
        <path d="M-10,10 L 100,10 L 110,80 L -20,80 Z" fill="#111" />
        <path d="M0,20 L 90,20 L 95,70 L -10,70 Z" fill="#222" />
        <!-- Cooling Fins -->
        <g stroke="#000" stroke-width="4" opacity="0.5">
          <line x1="5" y1="30" x2="85" y2="30" />
          <line x1="5" y1="45" x2="85" y2="45" />
          <line x1="5" y1="60" x2="85" y2="60" />
        </g>
        <!-- Exhaust -->
        <path d="M 80 80 L 40 130 L -20 130" fill="none" stroke="#555" stroke-width="14" stroke-linecap="round"/>
        <path d="M 80 80 L 40 130 L -20 130" fill="none" stroke="#999" stroke-width="6" stroke-linecap="round"/>
      </g>

      <!-- 4. REAR CABIN (Passenger) -->
      <!-- Cabin Interior (Dark depth) -->
      <path d="M 300 300 L 620 300 L 620 560 L 300 560 Z" fill="#1a1a1a" />
      
      <!-- Back Wall (Exterior Face) -->
      <path d="M 300 300 L 620 300 L 620 560 L 300 560 Z" fill="url(#paint-yellow)" stroke="#000" stroke-width="4"/>
      
      <!-- Back Window -->
      <path d="M 320 320 L 600 320 L 600 440 L 320 440 Z" fill="url(#glass-grad)" stroke="#000" stroke-width="3"/>
      <!-- Window Reflection -->
      <path d="M 330 330 L 400 330 L 350 430 L 320 430 Z" fill="rgba(255,255,255,0.2)" />
      
      <!-- Side Wall (Right Face - Perspective) -->
      <path d="M 620 300 L 620 560 L 750 610 L 750 350 Z" fill="url(#paint-yellow-side)" stroke="#000" stroke-width="4"/>
      
      <!-- Side Window -->
      <path d="M 630 360 L 740 405 L 740 490 L 630 445 Z" fill="url(#glass-grad)" stroke="#000" stroke-width="3"/>
      
      <!-- Ornamental Details on Cabin -->
      <!-- Stripes -->
      <path d="M 300 510 L 620 510 L 620 530 L 300 530 Z" fill="var(--accent-red, #c0392b)" />
      <path d="M 300 530 L 620 530 L 620 540 L 300 540 Z" fill="#000" />
      <path d="M 620 510 L 750 560 L 750 570 L 620 520 Z" fill="var(--accent-red, #c0392b)" />

      <!-- Sticker: Jai Shri Ram -->
      <g class="sticker" transform="translate(460, 480)">
        <rect x="-50" y="-15" width="100" height="30" rx="4" fill="#fff" stroke="#000" stroke-width="2" transform="rotate(-2)" />
        <text x="0" y="5" font-family="Arial Black" font-size="11" fill="#000" text-anchor="middle" transform="rotate(-2)">JAI SHRI RAM</text>
      </g>
      
      <!-- Sticker: Small Logo -->
      <g transform="translate(580, 350)">
        <circle cx="0" cy="0" r="12" fill="#fff" stroke="#000" stroke-width="2"/>
        <circle cx="0" cy="0" r="8" fill="#c0392b"/>
      </g>

      <!-- 5. ROOF & CANOPY -->
      <!-- Roof Top (3D Box) -->
      <path d="M 290 300 L 610 300 L 740 350 L 420 350 Z" fill="url(#chrome-grad)" stroke="#000" stroke-width="3"/>
      
      <!-- Roof Rack (Lattice) -->
      <g stroke="#000" stroke-width="4" fill="none">
        <!-- Frame -->
        <rect x="280" y="285" width="340" height="30" rx="5" />
        <!-- Vertical Bars -->
        <path d="M 300 285 L 300 320 M 340 285 L 340 320 M 380 285 L 380 320 M 420 285 L 420 320 M 460 285 L 460 320 M 500 285 L 500 320 M 540 285 L 540 320 M 580 285 L 580 320 M 620 285 L 620 320 M 660 285 L 660 320 M 700 285 L 700 320" />
        <!-- Cross Bars -->
        <path d="M 280 300 L 620 300" />
        <path d="M 280 310 L 620 310" />
      </g>

      <!-- 6. FRONT ASSEMBLY (Driver) -->
      <!-- Front Cabin Wall -->
      <path d="M 620 300 L 740 350 L 740 510 L 620 470 Z" fill="url(#paint-yellow-side)" stroke="#000" stroke-width="4"/>
      
      <!-- Windshield (Transparent) -->
      <path d="M 620 300 L 740 350 L 740 430 L 620 380 Z" fill="url(#glass-grad)" stroke="#000" stroke-width="3"/>
      <!-- Windshield Reflection -->
      <path d="M 630 310 L 660 325 L 660 390 L 630 375 Z" fill="rgba(255,255,255,0.4)" />

      <!-- Driver Figure (Simplified) -->
      <g transform="translate(670, 370)">
        <!-- Head -->
        <circle cx="0" cy="0" r="20" fill="#d7ccc8" />
        <!-- Turban/Cap -->
        <path d="M -20 0 Q 0 -25 20 0 Q 0 -5 -20 0" fill="#fff" />
        <!-- Body -->
        <path d="M -15 20 L 15 20 L 25 80 L -25 80 Z" fill="#2980b9" />
        <!-- Arms -->
        <path d="M -10 30 L -40 90" stroke="#d7ccc8" stroke-width="9" stroke-linecap="round"/>
        <path d="M 10 30 L 50 100" stroke="#d7ccc8" stroke-width="9" stroke-linecap="round"/>
      </g>

      <!-- Handlebars -->
      <g transform="translate(720, 460)">
        <!-- Stem -->
        <path d="M 0 0 L 0 70" stroke="#000" stroke-width="14" stroke-linecap="round"/>
        <!-- Bar -->
        <path d="M -70 40 L 70 60" stroke="#000" stroke-width="14" stroke-linecap="round" />
        <!-- Grips -->
        <path d="M -70 40 L -85 35" stroke="#333" stroke-width="16" stroke-linecap="round"/>
        <path d="M 70 60 L 85 65" stroke="#333" stroke-width="16" stroke-linecap="round"/>
        <!-- Indicators -->
        <circle cx="-85" cy="35" r="5" fill="#f39c12" />
        <circle cx="85" cy="65" r="5" fill="#f39c12" />
      </g>

      <!-- Mirrors -->
      <g transform="translate(620, 390)">
        <path d="M 0 0 L -40 -50 L -55 -45" fill="none" stroke="#000" stroke-width="4" />
        <ellipse cx="-55" cy="-45" rx="10" ry="15" fill="#000" stroke="#333" stroke-width="2"/>
      </g>
      <g transform="translate(730, 430)">
        <path d="M 0 0 L 40 -50 L 55 -45" fill="none" stroke="#000" stroke-width="4" />
        <ellipse cx="55" cy="-45" rx="10" ry="15" fill="#000" stroke="#333" stroke-width="2"/>
      </g>

      <!-- Headlamp -->
      <g transform="translate(730, 500)">
        <!-- Glow -->
        <circle cx="0" cy="0" r="80" fill="url(#headlight-glow)" opacity="0.9" style="mix-blend-mode: screen;" />
        <!-- Housing -->
        <circle cx="0" cy="0" r="35" fill="#111" stroke="url(#chrome-grad)" stroke-width="10" />
        <!-- Lens -->
        <circle cx="0" cy="0" r="26" fill="#fff" />
        <circle cx="0" cy="0" r="18" fill="#fff9c4" />
        <!-- Reflection -->
        <circle cx="-10" cy="-10" r="8" fill="#fff" />
      </g>

      <!-- Front Wheel -->
      <g transform="translate(740, 680)">
        <path d="M-85,0 A 85 85 0 1 0 85,0 A 85 85 0 1 0 -85,0" fill="url(#tire-grad)" />
        <path d="M-75,0 A 75 75 0 1 0 75,0 A 75 75 0 1 0 -75,0" fill="#222" />
        <path d="M-60,0 A 60 60 0 1 0 60,0 A 60 60 0 1 0 -60,0" fill="url(#chrome-wheel)" />
        <!-- Spokes -->
        <g stroke="#555" stroke-width="8">
          <line x1="0" y1="-55" x2="0" y2="55" />
          <line x1="-47" y1="-27" x2="47" y2="27" />
          <line x1="-47" y1="27" x2="47" y2="-27" />
        </g>
        <circle cx="0" cy="0" r="16" fill="#111" />
        <!-- Mudguard -->
        <path d="M-100,20 A 105 100 0 0 1 100,20" fill="none" stroke="url(#paint-yellow)" stroke-width="22" stroke-linecap="round"/>
        <path d="M-100,20 A 105 100 0 0 1 100,20" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
      </g>

      <!-- Ornamental Details -->
      <!-- Hanging Charm -->
      <g transform="translate(300, 300)">
        <line x1="0" y1="0" x2="0" y2="50" stroke="#000" stroke-width="3" />
        <path d="M 0 0 L 20 8 L 0 15 Z" fill="#c0392b" />
        <path d="M 0 15 L 15 25 L 0 35 Z" fill="#f1c40f" />
        <path d="M 0 35 L 10 45 L 0 50 Z" fill="#27ae60" />
      </g>

    </svg>
  </div>

</div>

<script>
  // Simple Parallax Effect
  const scene = document.querySelector('.scene');
  const vehicle = document.getElementById('vehicle-stage');
  const silhouette = document.querySelector('.bg-silhouette');

  scene.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth) - 0.5;
    const y = (e.clientY / window.innerHeight) - 0.5;

    // Move vehicle slightly (3D tilt)
    vehicle.style.transform = `
      translate(${x * 20}px, ${y * 15}px) 
      rotateY(${x * 10}deg) 
      rotateX(${-y * 5}deg)
    `;
    
    // Move background silhouette (Parallax depth)
    silhouette.style.transform = `translateX(${x * -50}px)`;
  });

  // Reset on mouse leave
  scene.addEventListener('mouseleave', () => {
    vehicle.style.transform = `translate(0, 0) rotateY(0) rotateX(0)`;
    silhouette.style.transform = `translateX(0)`;
  });
</script>
</body>
</html>
