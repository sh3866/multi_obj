<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street Legend: The Auto Rickshaw</title>
<style>
  :root {
    /* Palette: Vibrant Indian Sunset */
    --sky-top: #2c003e;
    --sky-mid: #c0392b;
    --sky-horizon: #f39c12;
    --street: #1a1a1a;
    
    /* Vehicle Colors */
    --body-yellow: #f1c40f;
    --body-yellow-dark: #d4ac0d;
    --body-yellow-highlight: #f7dc6f;
    --accent-red: #e74c3c;
    --accent-black: #2c3e50;
    --chrome: #ecf0f1;
    --chrome-dark: #bdc3c7;
    --glass: rgba(173, 216, 230, 0.4);
    --tire: #111;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--street);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    font-family: 'Arial Black', 'Helvetica Neue', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* --- The Stage --- */
  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-mid) 40%, var(--sky-horizon) 80%, var(--street) 80%);
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1200px;
    overflow: hidden;
  }

  /* --- Background Elements --- */
  .bg-silhouette {
    position: absolute;
    bottom: 20%; /* Horizon line */
    left: 0;
    width: 100%;
    height: 300px;
    z-index: 1;
    opacity: 0.8;
    filter: blur(1px);
    transition: transform 0.1s ease-out;
  }

  /* --- Typography (Pop Art Style) --- */
  .title-block {
    position: absolute;
    top: 5%;
    right: 5%;
    z-index: 20;
    text-align: right;
    mix-blend-mode: multiply; /* Blends with sunset */
    transform: rotate(-2deg);
    pointer-events: none;
  }

  .title-main {
    font-size: 6rem;
    line-height: 0.85;
    color: #fff;
    text-transform: uppercase;
    text-shadow: 4px 4px 0px var(--accent-red);
    -webkit-text-stroke: 2px var(--accent-red);
    opacity: 0.9;
  }

  .title-sub {
    font-family: 'Courier New', monospace;
    font-size: 1.2rem;
    color: #fff;
    background: var(--accent-red);
    display: inline-block;
    padding: 4px 12px;
    margin-top: 10px;
    transform: rotate(1deg);
    font-weight: bold;
    letter-spacing: 1px;
  }

  /* --- The Vehicle Container --- */
  .vehicle-stage {
    position: relative;
    z-index: 10;
    width: 80%;
    max-width: 1000px;
    height: auto;
    transform-style: preserve-3d;
    transition: transform 0.1s ease-out;
    filter: drop-shadow(0px 30px 20px rgba(0,0,0,0.6));
  }

  /* --- SVG Styles --- */
  svg {
    width: 100%;
    height: auto;
    display: block;
  }

  /* --- Interactive Elements (Stickers) --- */
  .sticker {
    cursor: pointer;
    transition: transform 0.2s;
    transform-origin: center;
  }
  .sticker:hover {
    transform: scale(1.1) rotate(2deg);
  }
  .sticker-bg {
    fill: #fff;
    stroke: #000;
    stroke-width: 2;
  }
  .sticker-text {
    font-family: 'Arial Black', sans-serif;
    font-size: 10px;
    fill: #000;
    text-anchor: middle;
  }

</style>
</head>
<body>

<div class="scene">
  
  <!-- Background Skyline (Mumbai Silhouette) -->
  <svg class="bg-silhouette" viewBox="0 0 1200 300" preserveAspectRatio="none">
    <path d="M0,300 L0,250 L50,250 L50,180 L100,180 L100,220 L150,220 L150,150 L200,150 L200,200 L250,200 L250,280 L300,280 L300,120 L350,120 L350,250 L400,250 L400,160 L450,160 L450,210 L500,210 L500,100 L550,100 L550,240 L600,240 L600,180 L650,180 L650,260 L700,260 L700,140 L750,140 L750,220 L800,220 L800,130 L850,130 L850,200 L900,200 L900,270 L950,270 L950,190 L1000,190 L1000,240 L1050,240 L1050,290 L1100,290 L1100,220 L1200,220 L1200,300 Z" fill="#1a0b2e"/>
    <!-- Gateway of India Arch Hint -->
    <path d="M500,300 L500,200 Q550,150 600,200 L600,300" fill="none" stroke="#1a0b2e" stroke-width="15"/>
  </svg>

  <!-- Typography -->
  <div class="title-block">
    <h1 class="title-main">Auto<br>Legend</h1>
    <div class="title-sub">MUMBAI EXPRESS</div>
  </div>

  <!-- The Vehicle -->
  <div class="vehicle-stage" id="vehicle-stage">
    <svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gradients -->
        <linearGradient id="paint-yellow" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:var(--body-yellow-highlight)" />
          <stop offset="40%" style="stop-color:var(--body-yellow)" />
          <stop offset="100%" style="stop-color:var(--body-yellow-dark)" />
        </linearGradient>
        
        <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#fff" />
          <stop offset="30%" style="stop-color:#bdc3c7" />
          <stop offset="50%" style="stop-color:#fff" />
          <stop offset="100%" style="stop-color:#7f8c8d" />
        </linearGradient>

        <linearGradient id="glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:rgba(255,255,255,0.7)" />
          <stop offset="20%" style="stop-color:rgba(173,216,230,0.2)" />
          <stop offset="100%" style="stop-color:rgba(44,62,80,0.6)" />
        </linearGradient>

        <linearGradient id="tire-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#000" />
          <stop offset="20%" style="stop-color:#222" />
          <stop offset="100%" style="stop-color:#000" />
        </linearGradient>

        <!-- Headlight Glow -->
        <radialGradient id="headlight-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" style="stop-color:#fff; stop-opacity:1" />
          <stop offset="40%" style="stop-color:#fff9c4; stop-opacity:0.6" />
          <stop offset="100%" style="stop-color:#fff9c4; stop-opacity:0" />
        </radialGradient>
      </defs>

      <!-- 1. GROUND SHADOW -->
      <ellipse cx="500" cy="660" rx="350" ry="40" fill="rgba(0,0,0,0.5)" filter="blur(15px)" />

      <!-- 2. REAR WHEELS (The Twin Structure) -->
      <!-- Left Rear Wheel (Background) -->
      <g transform="translate(300, 620)">
        <path d="M-70,0 A 70 70 0 1 0 70,0 A 70 70 0 1 0 -70,0" fill="url(#tire-grad)" />
        <path d="M-60,0 A 60 60 0 1 0 60,0 A 60 60 0 1 0 -60,0" fill="#333" />
        <path d="M-50,0 A 50 50 0 1 0 50,0 A 50 50 0 1 0 -50,0" fill="url(#chrome-grad)" />
        <!-- Spokes -->
        <path d="M0,-45 L0,45 M-40,-22 L40,22 M-40,22 L40,-22" stroke="#555" stroke-width="6" />
        <circle cx="0" cy="0" r="12" fill="#111" />
      </g>

      <!-- Right Rear Wheel (Foreground) -->
      <g transform="translate(650, 640)">
        <path d="M-80,0 A 80 80 0 1 0 80,0 A 80 80 0 1 0 -80,0" fill="url(#tire-grad)" />
        <path d="M-70,0 A 70 70 0 1 0 70,0 A 70 70 0 1 0 -70,0" fill="#222" />
        <path d="M-55,0 A 55 55 0 1 0 55,0 A 55 55 0 1 0 -55,0" fill="url(#chrome-grad)" />
        <!-- Spokes -->
        <path d="M0,-50 L0,50 M-45,-25 L45,25 M-45,25 L45,-25" stroke="#555" stroke-width="8" />
        <circle cx="0" cy="0" r="14" fill="#111" />
      </g>

      <!-- 3. CHASSIS & ENGINE -->
      <!-- Connecting Frame -->
      <path d="M 300 620 L 650 640" stroke="#222" stroke-width="20" />
      <!-- Engine Block (Detailed) -->
      <g transform="translate(420, 580)">
        <path d="M0,0 L 140,0 L 150,80 L -10,80 Z" fill="#111" />
        <path d="M10,10 L 130,10 L 135,70 L 5,70 Z" fill="#333" />
        <!-- Cooling Fins -->
        <line x1="10" y1="20" x2="130" y2="20" stroke="#111" stroke-width="4"/>
        <line x1="10" y1="35" x2="130" y2="35" stroke="#111" stroke-width="4"/>
        <line x1="10" y1="50" x2="130" y2="50" stroke="#111" stroke-width="4"/>
        <!-- Exhaust Pipe -->
        <path d="M 100 80 L 60 120 L 20 120" fill="none" stroke="#7f8c8d" stroke-width="12" stroke-linecap="round"/>
      </g>

      <!-- 4. REAR CABIN (Passenger) -->
      <!-- Interior (Dark) -->
      <path d="M 280 300 L 600 300 L 600 550 L 280 550 Z" fill="#2c3e50" />
      
      <!-- Back Wall (Exterior) -->
      <path d="M 280 300 L 600 300 L 600 550 L 280 550 Z" fill="url(#paint-yellow)" stroke="#000" stroke-width="3"/>
      
      <!-- Back Window -->
      <path d="M 300 320 L 580 320 L 580 420 L 300 420 Z" fill="url(#glass-grad)" stroke="#000" stroke-width="2"/>
      
      <!-- Side Wall (Left Face - Perspective) -->
      <path d="M 280 300 L 280 550 L 400 600 L 400 350 Z" fill="url(#paint-yellow)" stroke="#000" stroke-width="3"/>
      
      <!-- Side Window -->
      <path d="M 290 360 L 390 405 L 390 490 L 290 445 Z" fill="url(#glass-grad)" stroke="#000" stroke-width="2"/>

      <!-- Ornamental Details on Cabin -->
      <!-- Stripes -->
      <path d="M 280 500 L 400 550 L 400 565 L 280 515 Z" fill="var(--accent-red)" />
      <path d="M 280 515 L 400 565 L 400 575 L 280 525 Z" fill="#000" />
      
      <!-- Sticker: Jai Shri Ram -->
      <g class="sticker" transform="translate(320, 480)">
        <rect x="-40" y="-15" width="80" height="30" rx="5" class="sticker-bg" transform="rotate(-5)" />
        <text x="0" y="5" class="sticker-text" transform="rotate(-5)">JAI SHRI RAM</text>
      </g>

      <!-- 5. ROOF & CANOPY -->
      <!-- Roof Top -->
      <path d="M 270 300 L 590 300 L 680 340 L 360 340 Z" fill="url(#chrome-grad)" stroke="#000" stroke-width="3"/>
      
      <!-- Roof Rack (The classic lattice) -->
      <g stroke="#000" stroke-width="4" fill="none">
        <!-- Frame -->
        <rect x="260" y="285" width="340" height="30" rx="5" />
        <!-- Vertical Bars -->
        <path d="M 280 285 L 280 320 M 320 285 L 320 320 M 360 285 L 360 320 M 400 285 L 400 320 M 440 285 L 440 320 M 480 285 L 480 320 M 520 285 L 520 320 M 560 285 L 560 320 M 600 285 L 600 320 M 640 285 L 640 320" />
        <!-- Cross Bars -->
        <path d="M 260 300 L 600 300" />
        <path d="M 260 310 L 600 310" />
      </g>

      <!-- 6. FRONT ASSEMBLY (Driver) -->
      <!-- Front Cabin Wall -->
      <path d="M 600 300 L 680 340 L 680 500 L 600 460 Z" fill="url(#paint-yellow)" stroke="#000" stroke-width="3"/>
      
      <!-- Windshield (Transparent) -->
      <path d="M 600 300 L 680 340 L 680 420 L 600 380 Z" fill="url(#glass-grad)" stroke="#000" stroke-width="3"/>
      <!-- Windshield Reflection -->
      <path d="M 610 310 L 640 325 L 640 390 L 610 375 Z" fill="rgba(255,255,255,0.5)" />

      <!-- Driver Figure (Simplified) -->
      <g transform="translate(630, 360)">
        <!-- Head -->
        <circle cx="0" cy="0" r="18" fill="#d7ccc8" />
        <!-- Turban/Cap -->
        <path d="M -18 0 Q 0 -20 18 0 Q 0 -5 -18 0" fill="#fff" />
        <!-- Body -->
        <path d="M -15 20 L 15 20 L 25 80 L -25 80 Z" fill="#2980b9" />
        <!-- Arms -->
        <path d="M -10 30 L -40 90" stroke="#d7ccc8" stroke-width="8" stroke-linecap="round"/>
        <path d="M 10 30 L 50 100" stroke="#d7ccc8" stroke-width="8" stroke-linecap="round"/>
      </g>

      <!-- Handlebars -->
      <g transform="translate(650, 450)">
        <!-- Stem -->
        <path d="M 0 0 L 0 60" stroke="#000" stroke-width="12" stroke-linecap="round"/>
        <!-- Bar -->
        <path d="M -60 30 L 60 50" stroke="#000" stroke-width="12" stroke-linecap="round" />
        <!-- Grips -->
        <path d="M -60 30 L -75 25" stroke="#333" stroke-width="14" stroke-linecap="round"/>
        <path d="M 60 50 L 75 55" stroke="#333" stroke-width="14" stroke-linecap="round"/>
      </g>

      <!-- Mirrors -->
      <g transform="translate(600, 380)">
        <path d="M 0 0 L -40 -50 L -55 -45" fill="none" stroke="#000" stroke-width="4" />
        <ellipse cx="-55" cy="-45" rx="8" ry="12" fill="#000" />
      </g>
      <g transform="translate(670, 420)">
        <path d="M 0 0 L 40 -50 L 55 -45" fill="none" stroke="#000" stroke-width="4" />
        <ellipse cx="55" cy="-45" rx="8" ry="12" fill="#000" />
      </g>

      <!-- Headlamp -->
      <g transform="translate(670, 490)">
        <!-- Glow -->
        <circle cx="0" cy="0" r="60" fill="url(#headlight-glow)" opacity="0.8" />
        <!-- Housing -->
        <circle cx="0" cy="0" r="30" fill="#111" stroke="url(#chrome-grad)" stroke-width="8" />
        <!-- Lens -->
        <circle cx="0" cy="0" r="22" fill="#fff" />
        <circle cx="0" cy="0" r="15" fill="#fff9c4" />
        <!-- Reflection -->
        <circle cx="-8" cy="-8" r="6" fill="#fff" />
      </g>

      <!-- Front Wheel -->
      <g transform="translate(680, 660)">
        <path d="M-75,0 A 75 75 0 1 0 75,0 A 75 75 0 1 0 -75,0" fill="url(#tire-grad)" />
        <path d="M-65,0 A 65 65 0 1 0 65,0 A 65 65 0 1 0 -65,0" fill="#222" />
        <path d="M-50,0 A 50 50 0 1 0 50,0 A 50 50 0 1 0 -50,0" fill="url(#chrome-grad)" />
        <!-- Spokes -->
        <path d="M0,-45 L0,45 M-40,-22 L40,22 M-40,22 L40,-22" stroke="#555" stroke-width="6" />
        <circle cx="0" cy="0" r="12" fill="#111" />
        <!-- Mudguard -->
        <path d="M-80,15 A 85 80 0 0 1 80,15" fill="none" stroke="url(#paint-yellow)" stroke-width="16" stroke-linecap="round"/>
      </g>

      <!-- Ornamental Details -->
      <!-- Hanging Charm -->
      <g transform="translate(290, 300)">
        <line x1="0" y1="0" x2="0" y2="40" stroke="#000" stroke-width="2" />
        <path d="M 0 0 L 15 5 L 0 10 Z" fill="#e74c3c" />
        <path d="M 0 10 L 10 15 L 0 20 Z" fill="#f1c40f" />
      </g>

    </svg>
  </div>

</div>

<script>
  // Simple Parallax Effect
  const scene = document.querySelector('.scene');
  const vehicle = document.getElementById('vehicle-stage');
  const silhouette = document.querySelector('.bg-silhouette');

  scene.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth) - 0.5;
    const y = (e.clientY / window.innerHeight) - 0.5;

    // Move vehicle slightly (3D tilt)
    vehicle.style.transform = `
      translate(${x * 15}px, ${y * 10}px) 
      rotateY(${x * 8}deg) 
      rotateX(${-y * 5}deg)
    `;
    
    // Move background silhouette (Parallax depth)
    silhouette.style.transform = `translateX(${x * -40}px)`;
  });

  // Reset on mouse leave
  scene.addEventListener('mouseleave', () => {
    vehicle.style.transform = `translate(0, 0) rotateY(0) rotateX(0)`;
    silhouette.style.transform = `translateX(0)`;
  });
</script>
</body>
</html>
