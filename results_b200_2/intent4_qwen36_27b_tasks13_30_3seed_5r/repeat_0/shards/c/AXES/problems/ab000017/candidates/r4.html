<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Cube - Pro Workbench</title>
<style>
  :root {
    /* --- PALETTE: Technical Dark --- */
    --bg-deep: #050505;
    --bg-panel: #141414;
    --bg-panel-highlight: #222222;
    
    /* Accents */
    --accent-primary: #3b82f6;
    --accent-primary-glow: rgba(59, 130, 246, 0.4);
    --accent-warn: #ef4444;
    --accent-success: #10b981;
    
    /* Text */
    --text-main: #ffffff;
    --text-muted: #888888;
    --text-dim: #444444;

    /* Typography */
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Roboto Mono", "Courier New", monospace;

    /* Cube Colors (Standard High Saturation) */
    --c-white: #f0f0f0;
    --c-yellow: #ffd500;
    --c-red: #ff3b30;
    --c-orange: #ff9500;
    --c-blue: #007aff;
    --c-green: #34c759;
    --c-black: #111111; /* Plastic */
    --c-highlight: rgba(255,255,255,0.15);
    --c-shadow: rgba(0,0,0,0.8);

    /* Dimensions */
    --cube-size: 280px;
    --gap: 4px;
    --radius-sticker: 8px;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-deep);
    background-image: 
      radial-gradient(circle at 50% 30%, #1a1a1a 0%, #050505 80%),
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 100% 100%, 40px 40px, 40px 40px;
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* --- LAYOUT GRID --- */
  .app-container {
    display: grid;
    grid-template-rows: 80px 1fr 160px;
    height: 100%;
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    position: relative;
  }

  /* --- HEADER --- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 40px;
    z-index: 10;
  }

  .brand {
    font-weight: 800;
    font-size: 1.25rem;
    letter-spacing: 0.05em;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 12px;
    text-transform: uppercase;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }

  /* --- SIZE SELECTOR (Subtle Pill) --- */
  .size-selector {
    display: flex;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 100px;
    padding: 4px;
    backdrop-filter: blur(8px);
  }

  .size-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 8px 20px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 100px;
    transition: all 0.2s ease;
    font-family: var(--font-ui);
  }
  .size-btn:hover { color: var(--text-main); }
  .size-btn.active {
    background: var(--bg-panel-highlight);
    color: var(--text-main);
    box-shadow: 0 2px 5px rgba(0,0,0,0.5);
  }

  /* --- METRICS (Top Right) --- */
  .metrics-group {
    display: flex;
    gap: 20px;
  }

  .metric-card {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    text-align: right;
  }

  .metric-label {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 2px;
  }

  .metric-value {
    font-family: var(--font-mono);
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1;
  }

  /* --- CENTER STAGE --- */
  .stage {
    grid-row: 2;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1200px;
    position: relative;
  }

  /* 3D Scene Wrapper */
  .scene-interactor {
    width: var(--cube-size);
    height: var(--cube-size);
    position: relative;
    transform-style: preserve-3d;
    transform: rotateX(-20deg) rotateY(-30deg);
    cursor: grab;
    transition: transform 0.1s linear;
    /* Shadow for depth */
    filter: drop-shadow(0 30px 40px rgba(0,0,0,0.8));
  }
  .scene-interactor:active { cursor: grabbing; }

  .cube {
    width: 100%;
    height: 100%;
    position: absolute;
    transform-style: preserve-3d;
  }

  /* Faces */
  .face {
    position: absolute;
    width: var(--cube-size);
    height: var(--cube-size);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    background: var(--c-black);
    border-radius: 12px;
    padding: var(--gap);
    gap: var(--gap);
    /* Inset shadow to simulate depth of the plastic housing */
    box-shadow: inset 0 0 20px rgba(0,0,0,1);
    backface-visibility: hidden; /* Optimization */
  }

  /* Stickers */
  .sticker {
    border-radius: var(--radius-sticker);
    position: relative;
    background-color: var(--c-white); 
    /* Complex shadow for tactile feel: inner light, outer shadow */
    box-shadow: 
      inset 1px 1px 2px rgba(255,255,255,0.3),
      inset -1px -1px 2px rgba(0,0,0,0.2),
      0 1px 0 rgba(255,255,255,0.05), /* Tiny edge highlight */
      0 2px 3px rgba(0,0,0,0.5);
    transition: background-color 0.2s ease;
  }

  /* Gloss Overlay for Plastic Look */
  .sticker::after {
    content: '';
    position: absolute;
    top: 15%; left: 15%; right: 15%; height: 35%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.5), transparent);
    border-radius: 8px 8px 40px 40px;
    pointer-events: none;
    opacity: 0.7;
  }

  /* Face Positioning (Standard Cube) */
  .face.front  { transform: rotateY(0deg) translateZ(calc(var(--cube-size)/2)); }
  .face.back   { transform: rotateY(180deg) translateZ(calc(var(--cube-size)/2)); }
  .face.right  { transform: rotateY(90deg) translateZ(calc(var(--cube-size)/2)); }
  .face.left   { transform: rotateY(-90deg) translateZ(calc(var(--cube-size)/2)); }
  .face.top    { transform: rotateX(90deg) translateZ(calc(var(--cube-size)/2)); }
  .face.bottom { transform: rotateX(-90deg) translateZ(calc(var(--cube-size)/2)); }

  /* --- FOOTER CONTROLS (Unified Zone) --- */
  .controls-area {
    grid-row: 3;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 0 40px 40px 40px;
    gap: 24px;
  }

  /* Scramble Panel (Floating) */
  .scramble-panel {
    width: 100%;
    max-width: 500px;
    background: rgba(20, 20, 20, 0.6);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 12px 24px;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    backdrop-filter: blur(10px);
  }
  
  .panel-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .panel-label {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 0.1em;
  }

  .scramble-text {
    font-family: var(--font-mono);
    font-size: 1rem;
    color: var(--text-main);
    letter-spacing: 0.05em;
    line-height: 1.4;
    min-height: 1.4em;
  }

  .panel-tip {
    font-family: var(--font-ui);
    font-size: 0.8rem;
    color: var(--accent-primary);
    font-weight: 500;
    text-align: right;
    opacity: 0.9;
  }

  /* Unified Control Bar */
  .control-bar {
    display: flex;
    gap: 16px;
    width: 100%;
    max-width: 600px;
    justify-content: center;
  }

  /* --- BUTTON SYSTEM (Tactile / Mechanical) --- */
  button.btn {
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-main);
    position: relative;
    font-family: var(--font-ui);
  }

  /* Secondary Buttons */
  .btn-secondary {
    background: var(--bg-panel);
    border-top: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 4px 0 #000, 0 8px 10px rgba(0,0,0,0.5);
    color: var(--text-muted);
  }
  .btn-secondary:hover {
    background: var(--bg-panel-highlight);
    color: var(--text-main);
    transform: translateY(-1px);
    box-shadow: 0 5px 0 #000, 0 10px 15px rgba(0,0,0,0.5);
  }
  .btn-secondary:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 #000, inset 0 2px 5px rgba(0,0,0,0.5);
    border-top-color: transparent;
  }

  /* Primary Button (Scramble) */
  .btn-primary {
    background: var(--accent-primary);
    color: #fff;
    border-top: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 4px 0 #1d4ed8, 0 10px 20px var(--accent-primary-glow);
    min-width: 140px;
    justify-content: center;
  }
  .btn-primary:hover {
    background: #2563eb;
    transform: translateY(-1px);
    box-shadow: 0 5px 0 #1d4ed8, 0 12px 25px var(--accent-primary-glow);
  }
  .btn-primary:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 #1d4ed8, inset 0 2px 5px rgba(0,0,0,0.3);
    border-top-color: transparent;
  }

  /* --- RESPONSIVE --- */
  @media(max-width: 768px) {
    .app-container { grid-template-rows: 70px 1fr auto; }
    header { padding: 0 20px; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .brand { display: none; }
    .size-selector { margin: 0 auto; }
    .metrics-group { position: absolute; top: 70px; right: 20px; }
    
    .controls-area { padding: 20px; gap: 16px; }
    .control-bar { flex-wrap: wrap; }
    .btn { flex: 1; justify-content: center; }
    .scramble-panel { width: 100%; }
  }
</style>
</head>
<body>

<div class="app-container">
  
  <header>
    <div class="brand">
      <!-- Simple SVG Logo -->
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="3" y1="9" x2="21" y2="9"></line>
        <line x1="3" y1="15" x2="21" y2="15"></line>
        <line x1="9" y1="3" x2="9" y2="21"></line>
        <line x1="15" y1="3" x2="15" y2="21"></line>
      </svg>
      <span>The Cube</span>
    </div>

    <div class="size-selector">
      <button class="size-btn" onclick="setCubeSize(2)">2×2</button>
      <button class="size-btn active" onclick="setCubeSize(3)">3×3</button>
      <button class="size-btn" onclick="setCubeSize(4)">4×4</button>
      <button class="size-btn" onclick="setCubeSize(5)">5×5</button>
    </div>

    <div class="metrics-group">
      <div class="metric-card">
        <span class="metric-label">Moves</span>
        <span class="metric-value" id="move-count">00</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Time</span>
        <span class="metric-value" id="timer">00:00</span>
      </div>
    </div>
  </header>

  <!-- Center Stage -->
  <div class="stage">
    <div class="scene-interactor" id="scene">
      <div class="cube" id="cube">
        <!-- Generated by JS -->
      </div>
    </div>
  </div>

  <!-- Footer Controls -->
  <div class="controls-area">
    
    <!-- Unified Control Bar -->
    <div class="control-bar">
      <button class="btn btn-secondary" onclick="undoMove()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
        Undo
      </button>
      <button class="btn btn-secondary" onclick="getHint()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
        Hint
      </button>
      <button class="btn btn-secondary" onclick="resetCube()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"></path><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
        Reset
      </button>
      
      <!-- Divider -->
      <div style="width: 1px; background: rgba(255,255,255,0.1); margin: 0 8px;"></div>
      
      <button class="btn btn-primary" onclick="scrambleCube()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
        Scramble
      </button>
    </div>

    <!-- Info Panel -->
    <div class="scramble-panel">
      <div class="panel-info">
        <div class="panel-label">Current Scramble</div>
        <div class="scramble-text" id="scramble-display">Ready to scramble</div>
      </div>
      <div class="panel-tip" id="tip-display">Tip: Focus on the cross.</div>
    </div>

  </div>

</div>

<script>
  // --- CONFIGURATION ---
  const COLORS = {
    U: 'var(--c-white)', 
    D: 'var(--c-yellow)', 
    F: 'var(--c-green)', 
    B: 'var(--c-red)',   
    R: 'var(--c-orange)', 
    L: 'var(--c-blue)'   
  };

  // --- STATE ---
  let cubeState = []; 
  let moveHistory = [];
  let timerInterval;
  let seconds = 0;
  let isDragging = false;
  let startX, startY;
  let currentRotX = -20;
  let currentRotY = -30;

  // --- DOM ELEMENTS ---
  const cubeEl = document.getElementById('cube');
  const sceneEl = document.getElementById('scene');
  const timerEl = document.getElementById('timer');
  const moveCountEl = document.getElementById('move-count');
  const scrambleDisplayEl = document.getElementById('scramble-display');
  const tipDisplayEl = document.getElementById('tip-display');

  // --- INITIALIZATION ---
  function init() {
    createCubeDOM();
    resetCube();
    setupInteraction();
  }

  // --- DOM GENERATION ---
  function createCubeDOM() {
    cubeEl.innerHTML = '';
    const faces = ['front', 'back', 'right', 'left', 'top', 'bottom'];
    
    faces.forEach((faceName, index) => {
      const faceDiv = document.createElement('div');
      faceDiv.className = `face ${faceName}`;
      faceDiv.id = `face-${index}`;
      
      // Create 3x3 grid
      for(let i=0; i<9; i++) {
        const sticker = document.createElement('div');
        sticker.className = 'sticker';
        sticker.dataset.index = i;
        faceDiv.appendChild(sticker);
      }
      cubeEl.appendChild(faceDiv);
    });
  }

  // --- LOGIC: STATE MANAGEMENT ---
  function resetCube() {
    stopTimer();
    seconds = 0;
    updateTimerDisplay();
    moveHistory = [];
    moveCountEl.innerText = '00';
    
    // Initialize standard colors
    const faces = ['F', 'B', 'R', 'L', 'U', 'D'];
    cubeEl.childNodes.forEach((face, i) => {
      const color = COLORS[faces[i]];
      Array.from(face.children).forEach(sticker => {
        sticker.style.backgroundColor = color;
      });
    });
    
    scrambleDisplayEl.innerHTML = "Ready";
    tipDisplayEl.innerHTML = "Tip: Focus on the cross.";
  }

  function setCubeSize(size) {
    // Visual only update
    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    
    const faces = document.querySelectorAll('.face');
    faces.forEach(f => {
      f.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
      f.style.gridTemplateRows = `repeat(${size}, 1fr)`;
      
      // Rebuild stickers to match grid
      const currentColor = f.children[0] ? f.children[0].style.backgroundColor : '#fff';
      f.innerHTML = '';
      for(let i=0; i<size*size; i++) {
        const s = document.createElement('div');
        s.className = 'sticker';
        s.style.backgroundColor = currentColor;
        f.appendChild(s);
      }
    });
  }

  // --- LOGIC: MOVES ---
  const FACES_MAP = { 'F': 0, 'B': 1, 'R': 2, 'L': 3, 'U': 4, 'D': 5 };

  // Simplified Sticker Swapping Logic (Visual Simulation for Front Face)
  function swapStickers(move) {
    const f = 0; // Front
    const u = 4; // Up
    const r = 2; // Right
    const d = 5; // Down
    const l = 3; // Left
    
    const get = (faceIdx, stickerIdx) => cubeEl.children[faceIdx].children[stickerIdx].style.backgroundColor;
    const set = (faceIdx, stickerIdx, color) => cubeEl.children[faceIdx].children[stickerIdx].style.backgroundColor = color;

    // Rotate Face Internal Stickers (Clockwise)
    const rotateFace = (faceIdx) => {
      const stickers = Array.from(cubeEl.children[faceIdx].children);
      const colors = stickers.map(s => s.style.backgroundColor);
      // Clockwise rotation of indices
      const map = [6,3,0, 7,4,1, 8,5,2];
      const temp = [...colors];
      map.forEach((src, dest) => set(faceIdx, dest, temp[src]));
    };

    const char = move.charAt(0);
    
    // Example logic for F move
    if (char === 'F') {
      rotateFace(f);
      // Swap edges
      const uRow = [get(u,6), get(u,7), get(u,8)];
      const rCol = [get(r,0), get(r,3), get(r,6)];
      const dRow = [get(d,2), get(d,1), get(d,0)]; 
      const lCol = [get(l,8), get(l,5), get(l,2)]; 
      
      set(u,6, lCol[0]); set(u,7, lCol[1]); set(u,8, lCol[2]);
      set(r,0, uRow[0]); set(r,3, uRow[1]); set(r,6, uRow[2]);
      set(d,0, rCol[2]); set(d,1, rCol[1]); set(d,2, rCol[0]);
      set(l,2, dRow[2]); set(l,5, dRow[1]); set(l,8, dRow[0]);
    }
  }

  function applyMove(moveChar, visual = true) {
    const faceIndex = FACES_MAP[moveChar.charAt(0)];
    const faceEl = cubeEl.children[faceIndex];
    
    if(visual) {
      let dir = 1; 
      if(moveChar.includes("'")) dir = -1;
      
      // Animate spin
      faceEl.style.transition = `transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)`;
      faceEl.style.transform += ` rotateZ(${dir * 90}deg)`;
    }

    setTimeout(() => {
      swapStickers(moveChar);
      if(visual) {
        faceEl.style.transition = 'none';
        faceEl.style.transform = ''; 
      }
    }, visual ? 300 : 0);
  }

  // --- SCRAMBLE ---
  function scrambleCube() {
    const moves = ['F', 'B', 'U', 'D', 'L', 'R'];
    const modifiers = ['', "'", '2'];
    let scrambleString = "";
    const scrambleMoves = [];
    
    // Generate 20 moves
    for(let i=0; i<20; i++) {
      const m = moves[Math.floor(Math.random() * moves.length)];
      const mod = modifiers[Math.floor(Math.random() * modifiers.length)];
      scrambleMoves.push(m + mod);
      scrambleString += (m + mod + " ");
    }
    
    scrambleDisplayEl.innerHTML = scrambleString;
    tipDisplayEl.innerHTML = "Tip: Look for patterns.";
    
    // Visual Effect: Rapid Randomization
    let count = 0;
    const interval = setInterval(() => {
      randomizeColors();
      count++;
      if(count > 15) {
        clearInterval(interval);
        startTimer();
      }
    }, 80);
  }

  function randomizeColors() {
    const allStickers = document.querySelectorAll('.sticker');
    const colorKeys = Object.keys(COLORS);
    allStickers.forEach(s => {
      const randColor = COLORS[colorKeys[Math.floor(Math.random() * colorKeys.length)]];
      s.style.backgroundColor = randColor;
    });
  }

  // --- CONTROLS ---
  function startTimer() {
    stopTimer();
    seconds = 0;
    timerInterval = setInterval(() => {
      seconds++;
      updateTimerDisplay();
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
  }

  function updateTimerDisplay() {
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = (seconds % 60).toString().padStart(2, '0');
    timerEl.innerText = `${m}:${s}`;
  }

  function undoMove() {
    // Visual feedback
    const btn = event.currentTarget;
    btn.style.transform = "translateY(4px)";
    btn.style.boxShadow = "0 0 0 #000";
    setTimeout(() => {
      btn.style.transform = "";
      btn.style.boxShadow = "";
    }, 100);
  }

  function getHint() {
    tipDisplayEl.innerHTML = "Hint: Solve the white cross first.";
    tipDisplayEl.style.color = "var(--accent-success)";
    setTimeout(() => {
      tipDisplayEl.style.color = "var(--accent-primary)";
    }, 2000);
  }

  // --- INTERACTION (3D ROTATION) ---
  function setupInteraction() {
    document.addEventListener('mousedown', (e) => {
      if(e.target.closest('.btn') || e.target.closest('.size-btn')) return;
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - startX;
      const deltaY = e.clientY - startY;
      
      currentRotY += deltaX * 0.5;
      currentRotX -= deltaY * 0.5;
      
      currentRotX = Math.max(-90, Math.min(90, currentRotX));

      sceneEl.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
      
      startX = e.clientX;
      startY = e.clientY;
    });

    document.addEventListener('mouseup', () => isDragging = false);
    
    // Touch support
    document.addEventListener('touchstart', (e) => {
      if(e.target.closest('.btn')) return;
      isDragging = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, {passive: false});
    
    document.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      e.preventDefault(); 
      const deltaX = e.touches[0].clientX - startX;
      const deltaY = e.touches[0].clientY - startY;
      
      currentRotY += deltaX * 0.5;
      currentRotX -= deltaY * 0.5;
      currentRotX = Math.max(-90, Math.min(90, currentRotX));

      sceneEl.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
      
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, {passive: false});
    
    document.addEventListener('touchend', () => isDragging = false);
  }

  // Start
  init();

</script>
</body>
</html>
