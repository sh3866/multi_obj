<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-RUNNER // DESERT PROTOCOL</title>
    <style>
        :root {
            /* Modern-Retro Palette */
            --bg-sky-top: #0b001a;
            --bg-sky-mid: #2e0b4a;
            --bg-sky-bot: #ff007f; /* Neon Horizon */
            
            --sun-core: #ffea00;
            --sun-edge: #ff007f;
            
            --ground-fill: #05001a;
            --grid-color: #ff007f;
            
            --ui-text: #ffffff;
            --ui-accent: #00f2ff; /* Cyan */
            --ui-dim: #8888aa;
            
            /* Monospace System Fonts for Crisp Retro Feel */
            --font-stack: 'Courier New', 'Lucida Console', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000;
            color: var(--ui-text);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main Game Container */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1920px;
            max-height: 1080px;
            overflow: hidden;
            background: #000;
        }

        /* CRT Effects - Subtle Grain */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 2px,
                rgba(0, 0, 0, 0.25) 4px,
                rgba(0, 0, 0, 0.25) 6px
            );
            pointer-events: none;
            z-index: 50;
            opacity: 0.6;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 49;
        }

        /* HUD Layer - Top Left Anchor */
        .hud-layer {
            position: absolute;
            top: 30px;
            left: 30px;
            right: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 30;
            pointer-events: none;
            font-family: var(--font-stack);
            text-transform: uppercase;
        }

        .hud-score-block {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .hud-label {
            font-size: 12px;
            letter-spacing: 3px;
            color: var(--ui-accent);
            font-weight: bold;
            margin-bottom: 4px;
            opacity: 0.9;
        }

        .score-display {
            font-size: 36px;
            font-weight: bold;
            color: var(--ui-text);
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 10px rgba(255,255,255,0.4);
        }

        .high-score {
            color: var(--ui-dim);
            font-size: 14px;
            margin-top: 6px;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        /* Speed Indicator - Right Aligned */
        .speed-indicator {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            width: 100px;
            background: rgba(0,0,0,0.4);
            padding: 10px 15px;
            border-left: 3px solid var(--ui-accent);
            backdrop-filter: blur(4px);
        }

        .speed-val {
            font-size: 20px;
            font-weight: bold;
            color: var(--ui-text);
            font-variant-numeric: tabular-nums;
            margin-bottom: 6px;
        }
        .speed-unit {
            font-size: 10px;
            color: var(--ui-accent);
        }

        .speed-track {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            position: relative;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .speed-fill {
            height: 100%;
            background: var(--ui-accent);
            width: 20%;
            box-shadow: 0 0 10px var(--ui-accent);
            transition: width 0.1s linear;
        }

        /* Canvas */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Instruction Footer - Demoted */
        .overlay-ui {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 30;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .instruction-text {
            font-size: 16px;
            font-weight: bold;
            color: var(--ui-text);
            text-transform: uppercase;
            letter-spacing: 4px;
            animation: blink 2s infinite ease-in-out;
            text-shadow: 0 0 5px var(--ui-accent);
        }

        @keyframes blink {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.3; }
        }

        .game-over-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            z-index: 40;
            background: rgba(5, 0, 20, 0.85);
            padding: 50px 80px;
            border: 2px solid var(--ui-accent);
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        .go-title {
            font-size: 48px;
            font-weight: 900;
            color: var(--ui-text);
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 15px;
            text-shadow: 4px 4px 0 var(--sun-edge);
        }

        .go-sub {
            font-size: 16px;
            color: var(--ui-accent);
            letter-spacing: 2px;
            animation: blink 1s infinite;
        }

        /* Glitch Effect */
        .glitch-active {
            animation: glitch-skew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
        }

        @keyframes glitch-skew {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); }
            40% { transform: translate(-3px, -3px); }
            60% { transform: translate(3px, 3px); }
            80% { transform: translate(3px, -3px); }
            100% { transform: translate(0); }
        }

    </style>
</head>
<body>

    <div id="game-container">
        <div class="scanlines"></div>
        <div class="vignette"></div>

        <!-- HUD -->
        <div class="hud-layer">
            <div class="hud-score-block">
                <div class="hud-label">DISTANCE</div>
                <div class="score-display"><span id="score">00000</span></div>
                <div class="high-score">HI: <span id="high-score">00000</span></div>
            </div>
            
            <div class="speed-indicator">
                <div class="speed-val"><span id="speed-val">00</span> <span class="speed-unit">KM/H</span></div>
                <div class="speed-track">
                    <div class="speed-fill" id="speed-fill"></div>
                </div>
            </div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Start Instruction (Footer) -->
        <div class="overlay-ui" id="start-ui">
            <div class="instruction-text">PRESS SPACE TO JUMP</div>
        </div>

        <!-- Game Over -->
        <div class="game-over-panel" id="game-over">
            <div class="go-title">CRITICAL FAILURE</div>
            <div class="go-sub">PRESS SPACE TO REBOOT</div>
        </div>
    </div>

<script>
    /**
     * CONFIGURATION
     */
    const COLORS = {
        skyTop: '#0b001a',
        skyMid: '#2e0b4a',
        skyBot: '#ff007f',
        sunCore: '#ffea00',
        sunEdge: '#ff007f',
        groundFill: '#05001a',
        gridColor: '#ff007f',
        player: '#ffffff', // Crisp White Silhouette
        playerShadow: '#000',
        obstacle: '#ffffff', // High contrast obstacles
        bird: '#ffea00' // Yellow
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const speedValEl = document.getElementById('speed-val');
    const speedFillEl = document.getElementById('speed-fill');
    const gameOverPanel = document.getElementById('game-over');
    const startUI = document.getElementById('start-ui');

    // Game State
    let animationFrameId;
    let gameSpeed = 12; // Increased base speed for better feel
    let score = 0;
    let highScore = 0;
    let frame = 0;
    let isGameOver = false;
    let isPlaying = false;
    let groundY;

    // Physics
    const GRAVITY = 0.7;
    const JUMP_FORCE = -15;

    /**
     * CLASSES
     */

    class Player {
        constructor() {
            this.width = 60;
            this.height = 55;
            this.x = 120; // Left Third Axis
            this.y = groundY - this.height;
            this.dy = 0;
            this.originalY = groundY - this.height;
            this.isGrounded = true;
            this.runFrame = 0;
            this.trail = []; 
        }

        jump() {
            if (this.isGrounded) {
                this.dy = JUMP_FORCE;
                this.isGrounded = false;
                // Spawn dust particles
                for(let i=0; i<8; i++) {
                    particles.push(new Particle(this.x + 20, this.y + this.height, COLORS.gridColor));
                }
            }
        }

        update() {
            this.dy += GRAVITY;
            this.y += this.dy;

            // Ground collision
            if (this.y + this.height > groundY) {
                this.y = groundY - this.height;
                this.dy = 0;
                this.isGrounded = true;
            } else {
                this.isGrounded = false;
            }

            // Animation
            if (this.isGrounded) {
                this.runFrame += 0.3; 
            }

            // Trail Logic (Ghost effect)
            if (frame % 5 === 0) {
                this.trail.push({x: this.x, y: this.y, alpha: 0.6});
                if (this.trail.length > 5) this.trail.shift();
            }
            for(let t of this.trail) {
                t.x -= gameSpeed * 0.9; // Trail moves back slightly slower
                t.alpha -= 0.1;
            }
            this.trail = this.trail.filter(t => t.alpha > 0);
        }

        draw() {
            // Draw Trail
            this.trail.forEach(t => {
                ctx.save();
                ctx.globalAlpha = t.alpha * 0.4;
                ctx.translate(t.x, t.y);
                ctx.fillStyle = COLORS.player;
                drawDinoShape(ctx, 0, 0, this.width, this.height, this.runFrame, false);
                ctx.restore();
            });

            ctx.save();
            ctx.translate(this.x, this.y);
            
            // Lean logic
            if(this.isGrounded) {
                // Slight forward lean
                ctx.rotate(0.15); 
            } else {
                // Lean back in air
                ctx.rotate(-0.15);
            }

            ctx.fillStyle = COLORS.player;
            // Shadow for depth
            ctx.shadowColor = "rgba(0,0,0,0.5)";
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 5;
            ctx.shadowOffsetY = 5;

            drawDinoShape(ctx, 0, 0, this.width, this.height, this.runFrame, true);

            ctx.restore();
        }
    }

    // Helper to draw the Dino Shape to reuse for Trail
    function drawDinoShape(c, x, y, w, h, animFrame, isMain) {
        c.beginPath();
        // Head
        c.moveTo(0, -h + 15);
        c.lineTo(25, -h + 15);
        c.lineTo(25, -h + 25);
        c.lineTo(35, -h + 25); // Snout
        c.lineTo(35, -h + 35);
        c.lineTo(25, -h + 35);
        c.lineTo(25, -h + 45); // Neck
        c.lineTo(10, -h + 45);
        c.lineTo(10, -h + 55); // Back
        c.lineTo(-10, -h + 55);
        c.lineTo(-25, -h + 45); // Tail top
        c.lineTo(-35, -h + 35); // Tail tip
        c.lineTo(-25, -h + 25); // Tail bottom
        c.lineTo(-10, -h + 25);
        c.lineTo(-10, 0); // Legs
        c.lineTo(10, 0);
        c.fill();

        // Legs (Animated)
        c.lineWidth = 8;
        c.strokeStyle = COLORS.player;
        c.lineCap = 'square';

        if (isMain) {
            if (isMain && isGrounded) {
                const legAnim = Math.sin(animFrame) * 12;
                // Back Leg
                c.beginPath();
                c.moveTo(-5, 0);
                c.lineTo(-5 - legAnim, 15);
                c.stroke();
                // Front Leg
                c.beginPath();
                c.moveTo(5, 0);
                c.lineTo(5 + legAnim, 15);
                c.stroke();
            } else {
                // Jump pose
                c.beginPath();
                c.moveTo(-5, 0);
                c.lineTo(-15, 10);
                c.stroke();
                c.beginPath();
                c.moveTo(5, 0);
                c.lineTo(-5, 10);
                c.stroke();
            }
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type;
            this.markedForDeletion = false;
            this.x = canvas.width + 50;
            
            if (type === 'cactus') {
                this.width = 45;
                this.height = 65;
                this.y = groundY - this.height;
                this.variant = Math.random();
            } else {
                // Bird (Flying)
                this.width = 55;
                this.height = 40;
                // Heights: Low (jump over), High (duck/run under - simplified to jump for now)
                const heights = [groundY - 60, groundY - 130];
                this.y = heights[Math.floor(Math.random() * heights.length)];
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= gameSpeed;
            if (this.x + this.width < -100) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.2;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';

            if (this.type === 'cactus') {
                ctx.fillStyle = COLORS.obstacle;
                
                // Main Stem
                ctx.fillRect(this.width/2 - 8, 0, 16, this.height);
                
                // Arms (Sharp Geometry)
                if(this.variant > 0.3) {
                    // Left arm
                    ctx.fillRect(0, 20, 16, 10);
                    ctx.fillRect(0, 10, 10, 20);
                }
                if(this.variant > 0.6) {
                    // Right arm
                    ctx.fillRect(this.width - 16, 30, 16, 10);
                    ctx.fillRect(this.width - 10, 20, 10, 20);
                }
                
                // Inner Detail (Dark Core)
                ctx.fillStyle = '#05001a';
                ctx.fillRect(this.width/2 - 2, 5, 4, this.height - 10);
            } else {
                // Bird
                ctx.fillStyle = COLORS.bird;
                
                // Body (Sharp Diamond)
                ctx.beginPath();
                ctx.moveTo(0, 20);
                ctx.lineTo(25, 10);
                ctx.lineTo(50, 20);
                ctx.lineTo(25, 30);
                ctx.fill();

                // Wings
                const wingY = Math.sin(this.wingFrame) * 18;
                ctx.beginPath();
                ctx.moveTo(25, 20);
                ctx.lineTo(15, -5 + wingY);
                ctx.lineTo(35, 20);
                ctx.fill();
            }

            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 5 + 2;
            this.speedX = Math.random() * 5 - 2.5;
            this.speedY = Math.random() * 4 - 2;
            this.color = color;
            this.life = 1.0;
        }
        update() {
            this.x -= gameSpeed * 0.6; 
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.03;
        }
        draw() {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    class BackgroundLayer {
        constructor(speedMod, yOffset, height, color, jaggedness) {
            this.speedMod = speedMod;
            this.yOffset = yOffset;
            this.height = height;
            this.color = color;
            this.x = 0;
            this.width = 200;
            this.jaggedness = jaggedness;
            this.points = [];
            
            // Init points
            for(let i = 0; i < (canvas.width / this.width) + 4; i++) {
                this.points.push(Math.random() * this.jaggedness);
            }
        }

        update() {
            this.x -= gameSpeed * this.speedMod;
            if (this.x <= -this.width) {
                this.x += this.width;
                this.points.shift();
                this.points.push(Math.random() * this.jaggedness);
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            let startX = this.x % this.width;
            
            for (let i = 0; i < this.points.length; i++) {
                let px = startX + (i * this.width);
                let py = groundY - this.yOffset - this.points[i];
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();
        }
    }

    class Sun {
        constructor() {
            this.r = 140;
            this.y = groundY - 180;
            this.x = canvas.width - 300;
        }
        
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            // Gradient Sun
            let grad = ctx.createLinearGradient(0, -this.r, 0, this.r);
            grad.addColorStop(0, COLORS.sunCore);
            grad.addColorStop(0.5, COLORS.sunEdge);
            grad.addColorStop(1, '#ff007f');
            ctx.fillStyle = grad;
            
            ctx.beginPath();
            ctx.arc(0, 0, this.r, 0, Math.PI * 2);
            ctx.fill();

            // Retro Stripes (Cutouts) - Using sky color to simulate transparency
            ctx.fillStyle = COLORS.skyBot; 
            
            const startH = 20;
            const gap = 8;
            const thickness = 6;
            for(let h = startH; h < this.r; h += (gap + thickness)) {
                let w = Math.sqrt(this.r*this.r - h*h);
                ctx.fillRect(-w, h, w*2, thickness);
            }
            
            ctx.restore();
        }
    }

    /**
     * GAME LOGIC
     */
    let player;
    let obstacles = [];
    let particles = [];
    let bgLayers = [];
    let sun;
    let spawnTimer = 0;

    function init() {
        resize();
        resetGame();
        loop();
    }

    function resetGame() {
        isGameOver = false;
        isPlaying = false;
        player = new Player();
        obstacles = [];
        particles = [];
        score = 0;
        gameSpeed = 12;
        spawnTimer = 0;
        
        // Parallax Layers
        bgLayers = [
            new BackgroundLayer(0.15, 220, 100, '#1a0b2e', 60), // Far Mountains
            new BackgroundLayer(0.3, 140, 60, '#2e0b4a', 30)  // Near Hills
        ];
        sun = new Sun();
        
        document.getElementById('game-container').classList.remove('glitch-active');
        gameOverPanel.style.display = 'none';
        startUI.style.opacity = '1';
        
        updateHUD();
    }

    function updateHUD() {
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
        let speedDisplay = Math.floor(gameSpeed * 18); 
        speedValEl.innerText = speedDisplay.toString().padStart(2, '0');
        
        // Map speed 12-40 to 10%-100%
        let fillPercent = Math.min(((gameSpeed - 12) / 28) * 100 + 10, 100);
        speedFillEl.style.width = fillPercent + '%';
    }

    function spawnObstacle() {
        spawnTimer--;
        if (spawnTimer <= 0) {
            const type = Math.random() > 0.6 ? 'bird' : 'cactus';
            obstacles.push(new Obstacle(type));
            
            // Dynamic spacing based on speed
            let minFrames = 25 + (800 / gameSpeed); 
            spawnTimer = minFrames + Math.random() * 30;
            
            // Speed scaling
            if (gameSpeed < 35) gameSpeed += 0.008;
        }
    }

    function checkCollisions() {
        // Hitbox padding
        const pPad = 14;
        const oPad = 8;

        for (let obs of obstacles) {
            if (
                player.x + pPad < obs.x + obs.width - oPad &&
                player.x + player.width - pPad > obs.x + oPad &&
                player.y + pPad < obs.y + obs.height - oPad &&
                player.y + player.height - pPad > obs.y + oPad
            ) {
                gameOver();
            }
        }
    }

    function gameOver() {
        isGameOver = true;
        isPlaying = false;
        document.getElementById('game-container').classList.add('glitch-active');
        gameOverPanel.style.display = 'block';
        startUI.style.opacity = '0';
        
        if (score > highScore) {
            highScore = Math.floor(score);
            highScoreEl.innerText = highScore.toString().padStart(5, '0');
        }
    }

    function update() {
        if (!isPlaying) return;

        frame++;
        score += 0.1 * (gameSpeed/12);
        updateHUD();

        player.update();
        bgLayers.forEach(layer => layer.update());
        
        spawnObstacle();
        obstacles.forEach((obs, index) => {
            obs.update();
            if (obs.markedForDeletion) obstacles.splice(index, 1);
        });

        particles.forEach((p, index) => {
            p.update();
            if (p.life <= 0) particles.splice(index, 1);
        });

        checkCollisions();
    }

    function draw() {
        // Clear with gradient sky
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, COLORS.skyTop);
        grad.addColorStop(0.5, COLORS.skyMid);
        grad.addColorStop(1, COLORS.skyBot);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Sun
        sun.draw();

        // Backgrounds
        bgLayers.forEach(layer => layer.draw());

        // Ground Plane
        ctx.fillStyle = COLORS.groundFill;
        ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
        
        // LAYERED DESERT GROUND
        // 1. Horizon Line (Thick, Solid)
        ctx.lineWidth = 4;
        ctx.strokeStyle = COLORS.gridColor;
        ctx.shadowColor = COLORS.gridColor;
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(canvas.width, groundY);
        ctx.stroke();
        ctx.shadowBlur = 0; // Reset shadow

        // 2. Moving Grid Lines (Perspective)
        let offset = (frame * gameSpeed) % 60;
        
        ctx.strokeStyle = 'rgba(255, 0, 127, 0.4)'; // Grid Color with opacity
        ctx.lineWidth = 2;
        
        // Horizontal moving lines (Exponential spacing for perspective)
        let horizonScale = 1;
        for(let i = 0; i < 18; i++) {
            let y = groundY + (i * i * 3.5) + (offset * 4);
            if(y > canvas.height) y -= (canvas.height - groundY);
            if(y > groundY) {
                // Fade out lines further away
                let alpha = 1 - (i / 18);
                ctx.globalAlpha = alpha * 0.7;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }
        ctx.globalAlpha = 1.0;

        // Entities
        obstacles.forEach(obs => obs.draw());
        player.draw();
        particles.forEach(p => p.draw());
    }

    function loop() {
        update();
        draw();
        animationFrameId = requestAnimationFrame(loop);
    }

    function resize() {
        const container = document.getElementById('game-container');
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        
        groundY = canvas.height - 120;
        
        if(player) {
            player.originalY = groundY - player.height;
            if(player.isGrounded) player.y = player.originalY;
        }
        
        // Update BG points on resize
        bgLayers.forEach(l => {
            l.points = [];
            for(let i=0; i < (canvas.width / l.width) + 4; i++) {
                l.points.push(Math.random() * l.jaggedness);
            }
        });
        
        if(sun) {
            sun.y = groundY - 180;
            sun.x = canvas.width - 300;
        }
    }

    // Input Handling
    function handleInputStart(e) {
        if (e.type === 'keydown' && e.code !== 'Space') return;
        if (e.type === 'keydown') e.preventDefault(); 

        if (isGameOver) {
            resetGame();
            isPlaying = true;
        } else if (!isPlaying) {
            isPlaying = true;
            startUI.style.opacity = '0';
        } else {
            player.jump();
        }
    }

    window.addEventListener('keydown', handleInputStart);
    window.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleInputStart(e);
    }, {passive: false});
    window.addEventListener('mousedown', handleInputStart);

    window.addEventListener('resize', resize);
    
    // Start
    init();

</script>
</body>
</html>
