<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-RUNNER // DESERT PROTOCOL</title>
    <style>
        :root {
            --bg-sky-top: #2b0f4c; /* Deep Purple */
            --bg-sky-bot: #e05c34; /* Sunset Orange */
            --sun-core: #ffcc00;
            --ground-top: #1a0b2e; /* Dark Purple */
            --ground-bot: #000000;
            --accent: #00ffcc; /* Cyan Neon */
            --text-main: #ffffff;
            --text-dim: #8888aa;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #050505;
            color: var(--text-main);
            font-family: var(--font-mono);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main Game Container */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1600px;
            max-height: 900px;
            overflow: hidden;
            background: #000;
        }

        /* CRT Overlay Effects */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.1) 2px,
                rgba(0,0,0,0.1) 4px
            );
            pointer-events: none;
            z-index: 100;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* HUD Layer */
        .hud-layer {
            position: absolute;
            top: 30px;
            left: 0;
            width: 100%;
            padding: 0 50px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 20;
            pointer-events: none;
        }

        .hud-left {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .label {
            font-size: 10px;
            letter-spacing: 3px;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 4px;
            text-shadow: 0 0 5px var(--accent);
        }

        .score-display {
            font-size: 48px;
            font-weight: 900;
            color: var(--text-main);
            line-height: 1;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            letter-spacing: -2px;
        }

        .high-score {
            color: var(--text-dim);
            font-size: 14px;
            margin-top: 6px;
            letter-spacing: 1px;
        }

        /* Speed Indicator */
        .speed-indicator {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            width: 200px;
        }

        .speed-val {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .speed-track {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
        }

        .speed-fill {
            height: 100%;
            background: var(--accent);
            width: 10%;
            box-shadow: 0 0 10px var(--accent);
            transition: width 0.1s linear;
        }

        .speed-marks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 9px,
                rgba(0,0,0,0.5) 10px
            );
        }

        /* Canvas */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Start/Restart UI */
        .overlay-ui {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 30;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .pulse-text {
            font-size: 18px;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 4px;
            animation: pulse 1.5s infinite ease-in-out;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        .game-over-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            z-index: 40;
        }

        .go-title {
            font-size: 60px;
            font-weight: 900;
            color: #ff3366;
            text-transform: uppercase;
            text-shadow: 4px 4px 0 #000;
            margin-bottom: 10px;
        }

        .go-sub {
            font-size: 16px;
            color: var(--text-main);
            letter-spacing: 2px;
        }

        /* Glitch Animation */
        .glitch-active {
            animation: glitch-skew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
        }

        @keyframes glitch-skew {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

    </style>
</head>
<body>

    <div id="game-container">
        <div class="scanlines"></div>
        <div class="vignette"></div>

        <!-- HUD -->
        <div class="hud-layer">
            <div class="hud-left">
                <div class="label">Score</div>
                <div class="score-display"><span id="score">00000</span></div>
                <div class="high-score">HI: <span id="high-score">00000</span></div>
            </div>
            
            <div class="speed-indicator">
                <div class="speed-val">SPD: <span id="speed-val">00</span></div>
                <div class="speed-track">
                    <div class="speed-marks"></div>
                    <div class="speed-fill" id="speed-fill"></div>
                </div>
            </div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Start Instruction -->
        <div class="overlay-ui" id="start-ui">
            <div class="pulse-text">PRESS SPACE TO RUN</div>
        </div>

        <!-- Game Over -->
        <div class="game-over-panel" id="game-over">
            <div class="go-title">CRASHED</div>
            <div class="go-sub">PRESS SPACE TO REBOOT</div>
        </div>
    </div>

<script>
    /**
     * CONFIGURATION
     */
    const COLORS = {
        skyTop: '#2b0f4c',
        skyBot: '#e05c34',
        sun: '#ffcc00',
        sunStripe: '#e05c34', // Matches sky bottom for cutout effect
        ground: '#1a0b2e',
        groundGrid: '#3d2066',
        player: '#ffffff',
        obstacle: '#ff3366', // Hot pink for contrast against purple/orange
        obstacleDark: '#990033',
        bird: '#ffcc00'
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const speedValEl = document.getElementById('speed-val');
    const speedFillEl = document.getElementById('speed-fill');
    const gameOverPanel = document.getElementById('game-over');
    const startUI = document.getElementById('start-ui');

    // Game State
    let animationFrameId;
    let gameSpeed = 10;
    let score = 0;
    let highScore = 0;
    let frame = 0;
    let isGameOver = false;
    let isPlaying = false;
    let groundY;

    // Physics
    const GRAVITY = 0.7;
    const JUMP_FORCE = -14;

    /**
     * CLASSES
     */

    class Player {
        constructor() {
            this.width = 50;
            this.height = 50;
            this.x = 100; // Positioned at left third
            this.y = groundY - this.height;
            this.dy = 0;
            this.originalY = groundY - this.height;
            this.isGrounded = true;
            this.runFrame = 0;
        }

        jump() {
            if (this.isGrounded) {
                this.dy = JUMP_FORCE;
                this.isGrounded = false;
                // Spawn dust
                for(let i=0; i<10; i++) {
                    particles.push(new Particle(this.x + 15, this.y + this.height, COLORS.groundGrid));
                }
            }
        }

        update() {
            this.dy += GRAVITY;
            this.y += this.dy;

            if (this.y + this.height > groundY) {
                this.y = groundY - this.height;
                this.dy = 0;
                this.isGrounded = true;
            } else {
                this.isGrounded = false;
            }

            if (this.isGrounded) {
                this.runFrame += 0.3; 
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x + this.width/2, this.y + this.height/2);
            
            // Lean forward when running
            if(this.isGrounded) {
                ctx.rotate(0.2);
            } else {
                ctx.rotate(-0.2); // Lean back slightly when jumping
            }

            ctx.fillStyle = COLORS.player;

            // Pixel Art Style Dino (Crisp Silhouette)
            // Head
            ctx.fillRect(5, -25, 30, 20);
            // Jaw
            ctx.fillRect(25, -10, 15, 8);
            // Eye (Negative space)
            ctx.fillStyle = COLORS.skyBot;
            ctx.fillRect(22, -20, 4, 4);
            
            ctx.fillStyle = COLORS.player;
            // Body
            ctx.fillRect(-5, -10, 30, 30);
            // Tail
            ctx.fillRect(-25, -15, 20, 10);
            ctx.fillRect(-25, -5, 10, 5);

            // Legs (Animated)
            ctx.lineWidth = 4;
            ctx.strokeStyle = COLORS.player;
            ctx.lineCap = 'square';

            if (this.isGrounded) {
                const legAnim = Math.sin(this.runFrame) * 12;
                // Back Leg
                ctx.beginPath();
                ctx.moveTo(-5, 15);
                ctx.lineTo(-5 + legAnim, 25);
                ctx.stroke();
                // Front Leg
                ctx.beginPath();
                ctx.moveTo(5, 15);
                ctx.lineTo(5 - legAnim, 25);
                ctx.stroke();
            } else {
                // Jump pose: legs tucked
                ctx.beginPath();
                ctx.moveTo(-5, 15);
                ctx.lineTo(-10, 20);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(5, 15);
                ctx.lineTo(0, 20);
                ctx.stroke();
            }

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type;
            this.markedForDeletion = false;
            this.x = canvas.width + 100;
            
            if (type === 'cactus') {
                this.width = 35;
                this.height = 55;
                this.y = groundY - this.height;
                this.variant = Math.random();
            } else {
                // Bird
                this.width = 50;
                this.height = 35;
                // Heights: Low, Mid, High
                const heights = [groundY - 45, groundY - 85, groundY - 130];
                this.y = heights[Math.floor(Math.random() * heights.length)];
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= gameSpeed;
            if (this.x + this.width < -100) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.2;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);

            if (this.type === 'cactus') {
                ctx.fillStyle = COLORS.obstacle;
                
                // Main Stem
                ctx.fillRect(this.width/2 - 6, 0, 12, this.height);
                
                // Arms
                if(this.variant > 0.3) {
                    ctx.fillRect(0, 20, 12, 8);
                    ctx.fillRect(0, 10, 8, 18);
                }
                if(this.variant > 0.6) {
                    ctx.fillRect(this.width - 12, 30, 12, 8);
                    ctx.fillRect(this.width - 8, 20, 8, 18);
                }
                
                // Detail (Shadow)
                ctx.fillStyle = COLORS.obstacleDark;
                ctx.fillRect(this.width/2, 0, 4, this.height);
            } else {
                // Bird
                ctx.fillStyle = COLORS.bird;
                
                // Body
                ctx.beginPath();
                ctx.moveTo(0, 15);
                ctx.lineTo(20, 5);
                ctx.lineTo(40, 15);
                ctx.lineTo(20, 25);
                ctx.fill();

                // Wings
                const wingY = Math.sin(this.wingFrame) * 15;
                ctx.beginPath();
                ctx.moveTo(20, 15);
                ctx.lineTo(10, 0 + wingY);
                ctx.lineTo(30, 15);
                ctx.fill();
            }

            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 5 + 2;
            this.speedX = Math.random() * 4 - 2;
            this.speedY = Math.random() * 3 - 1;
            this.color = color;
            this.life = 1.0;
        }
        update() {
            this.x -= gameSpeed * 0.5; // Move with world
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.04;
        }
        draw() {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    class BackgroundLayer {
        constructor(speedMod, yOffset, height, color, jaggedness) {
            this.speedMod = speedMod;
            this.yOffset = yOffset;
            this.height = height;
            this.color = color;
            this.x = 0;
            this.width = 200;
            this.jaggedness = jaggedness;
            this.points = [];
            
            // Init points
            for(let i = 0; i < (canvas.width / this.width) + 4; i++) {
                this.points.push(Math.random() * this.jaggedness);
            }
        }

        update() {
            this.x -= gameSpeed * this.speedMod;
            if (this.x <= -this.width) {
                this.x += this.width;
                this.points.shift();
                this.points.push(Math.random() * this.jaggedness);
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            let startX = this.x % this.width;
            
            for (let i = 0; i < this.points.length; i++) {
                let px = startX + (i * this.width);
                let py = groundY - this.yOffset - this.points[i];
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();
        }
    }

    class Sun {
        constructor() {
            this.r = 80;
            this.y = groundY - 160;
            this.x = canvas.width - 200;
        }
        
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            // Sun body
            ctx.fillStyle = COLORS.sun;
            ctx.beginPath();
            ctx.arc(0, 0, this.r, 0, Math.PI * 2);
            ctx.fill();

            // Retro Stripes
            ctx.fillStyle = COLORS.sunStripe;
            // Draw horizontal rects over the sun
            const startH = 10;
            const gap = 6;
            const thickness = 6;
            for(let h = startH; h < this.r; h += (gap + thickness)) {
                // Calculate width of slice at this height using Pythagorean theorem
                // x^2 + y^2 = r^2  =>  x = sqrt(r^2 - y^2)
                let w = Math.sqrt(this.r*this.r - h*h);
                ctx.fillRect(-w, h, w*2, thickness);
            }
            
            ctx.restore();
        }
    }

    /**
     * GAME LOGIC
     */
    let player;
    let obstacles = [];
    let particles = [];
    let bgLayers = [];
    let sun;
    let spawnTimer = 0;

    function init() {
        resize();
        resetGame();
        loop();
    }

    function resetGame() {
        isGameOver = false;
        isPlaying = false;
        player = new Player();
        obstacles = [];
        particles = [];
        score = 0;
        gameSpeed = 10;
        spawnTimer = 0;
        
        // Parallax Layers
        bgLayers = [
            new BackgroundLayer(0.2, 200, 100, '#4a1c5e', 60), // Far Mountains
            new BackgroundLayer(0.5, 120, 60, '#2d1145', 30)  // Near Hills
        ];
        sun = new Sun();
        
        document.getElementById('game-container').classList.remove('glitch-active');
        gameOverPanel.style.display = 'none';
        startUI.style.opacity = '1';
        
        updateHUD();
    }

    function updateHUD() {
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
        let speedDisplay = Math.floor(gameSpeed * 10);
        speedValEl.innerText = speedDisplay.toString().padStart(2, '0');
        
        // Map speed 10-30 to 10%-100%
        let fillPercent = Math.min(((gameSpeed - 10) / 20) * 100 + 10, 100);
        speedFillEl.style.width = fillPercent + '%';
    }

    function spawnObstacle() {
        spawnTimer--;
        if (spawnTimer <= 0) {
            const type = Math.random() > 0.7 ? 'bird' : 'cactus';
            obstacles.push(new Obstacle(type));
            
            // Dynamic spacing based on speed
            let minFrames = 35 + (1000 / gameSpeed); 
            spawnTimer = minFrames + Math.random() * 50;
            
            // Speed scaling
            if (gameSpeed < 25) gameSpeed += 0.005;
        }
    }

    function checkCollisions() {
        // Hitbox padding
        const pPad = 8;
        const oPad = 6;

        for (let obs of obstacles) {
            if (
                player.x + pPad < obs.x + obs.width - oPad &&
                player.x + player.width - pPad > obs.x + oPad &&
                player.y + pPad < obs.y + obs.height - oPad &&
                player.y + player.height - pPad > obs.y + oPad
            ) {
                gameOver();
            }
        }
    }

    function gameOver() {
        isGameOver = true;
        isPlaying = false;
        document.getElementById('game-container').classList.add('glitch-active');
        gameOverPanel.style.display = 'block';
        startUI.style.opacity = '0';
        
        if (score > highScore) {
            highScore = Math.floor(score);
            highScoreEl.innerText = highScore.toString().padStart(5, '0');
        }
    }

    function update() {
        if (!isPlaying) return;

        frame++;
        score += 0.1 * (gameSpeed/10);
        updateHUD();

        player.update();
        bgLayers.forEach(layer => layer.update());
        
        spawnObstacle();
        obstacles.forEach((obs, index) => {
            obs.update();
            if (obs.markedForDeletion) obstacles.splice(index, 1);
        });

        particles.forEach((p, index) => {
            p.update();
            if (p.life <= 0) particles.splice(index, 1);
        });

        checkCollisions();
    }

    function draw() {
        // Clear with gradient sky
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, COLORS.skyTop);
        grad.addColorStop(1, COLORS.skyBot);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Sun
        sun.draw();

        // Backgrounds
        bgLayers.forEach(layer => layer.draw());

        // Ground Plane
        ctx.fillStyle = COLORS.ground;
        ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
        
        // Retro Grid Lines on Ground
        ctx.strokeStyle = COLORS.groundGrid;
        ctx.lineWidth = 2;
        ctx.beginPath();
        
        // Horizontal moving lines (Perspective effect)
        let offset = (frame * gameSpeed) % 40;
        for(let y = groundY; y < canvas.height; y += 40) {
            let perspectiveY = y + (offset * ((y - groundY)/canvas.height));
            if(perspectiveY > canvas.height) perspectiveY -= canvas.height;
            ctx.moveTo(0, perspectiveY);
            ctx.lineTo(canvas.width, perspectiveY);
        }
        ctx.stroke();

        // Entities
        obstacles.forEach(obs => obs.draw());
        player.draw();
        particles.forEach(p => p.draw());
    }

    function loop() {
        update();
        draw();
        animationFrameId = requestAnimationFrame(loop);
    }

    function resize() {
        const container = document.getElementById('game-container');
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        
        groundY = canvas.height - 120;
        
        if(player) {
            player.originalY = groundY - player.height;
            if(player.isGrounded) player.y = player.originalY;
        }
        
        // Update BG points on resize
        bgLayers.forEach(l => {
            l.points = [];
            for(let i=0; i < (canvas.width / l.width) + 4; i++) {
                l.points.push(Math.random() * l.jaggedness);
            }
        });
        
        if(sun) {
            sun.y = groundY - 160;
            sun.x = canvas.width - 200;
        }
    }

    // Input Handling
    function handleInputStart(e) {
        if (e.type === 'keydown' && e.code !== 'Space') return;
        if (e.type === 'keydown') e.preventDefault(); 

        if (isGameOver) {
            resetGame();
            isPlaying = true;
        } else if (!isPlaying) {
            isPlaying = true;
            startUI.style.opacity = '0';
        } else {
            player.jump();
        }
    }

    window.addEventListener('keydown', handleInputStart);
    window.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleInputStart(e);
    }, {passive: false});
    window.addEventListener('mousedown', handleInputStart);

    window.addEventListener('resize', resize);
    
    // Start
    init();

</script>
</body>
</html>
