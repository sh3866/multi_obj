<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-RUNNER // DESERT PROTOCOL</title>
    <style>
        :root {
            /* Neon Prehistoric Palette */
            --bg-sky-top: #050014;
            --bg-sky-mid: #1a0b2e;
            --bg-sky-bot: #4a1c40; /* Deep magenta horizon */
            
            --sun-color: #ff007f;
            --sun-glow: #ff4da6;
            
            --ground-base: #0a0a0a;
            --ground-accent: #00f2ff; /* Cyan */
            
            --ui-color: #ffffff;
            --ui-accent: #00f2ff;
            --ui-dim: #555555;
            
            --font-mono: 'Courier New', Courier, monospace; /* System monospace */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000;
            color: var(--ui-color);
            font-family: var(--font-mono);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main Game Container */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1920px;
            max-height: 1080px;
            overflow: hidden;
            background: #000;
        }

        /* CRT/Screen Effects - Subtle but present */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 2px,
                rgba(0, 0, 0, 0.15) 4px,
                rgba(0, 0, 0, 0.15) 6px
            );
            pointer-events: none;
            z-index: 50;
            opacity: 0.6;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 49;
        }

        /* HUD Layer - Unified Top Block */
        .hud-layer {
            position: absolute;
            top: 20px;
            left: 30px;
            right: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 30;
            pointer-events: none;
            font-family: var(--font-mono);
            text-transform: uppercase;
        }

        .hud-score-block {
            display: flex;
            flex-direction: column;
        }

        .hud-label {
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--ui-accent);
            font-weight: bold;
            margin-bottom: 2px;
            opacity: 0.8;
        }

        .score-display {
            font-size: 32px;
            font-weight: bold;
            color: var(--ui-color);
            line-height: 1;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
        }

        .high-score {
            color: var(--ui-dim);
            font-size: 12px;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* Speed Indicator - Small, Right Aligned */
        .speed-indicator {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            width: 120px;
            background: rgba(0,0,0,0.3);
            padding: 8px 12px;
            border-left: 2px solid var(--ui-accent);
            backdrop-filter: blur(2px);
        }

        .speed-val {
            font-size: 16px;
            font-weight: bold;
            color: var(--ui-color);
            font-variant-numeric: tabular-nums;
            margin-bottom: 4px;
        }

        .speed-track {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            position: relative;
        }

        .speed-fill {
            height: 100%;
            background: var(--ui-accent);
            width: 20%;
            box-shadow: 0 0 8px var(--ui-accent);
            transition: width 0.1s linear;
        }

        /* Canvas */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Start/Restart UI - Relocated */
        .overlay-ui {
            position: absolute;
            top: 55%; /* Position near player's jump height */
            left: 140px; /* Offset from player */
            transform: translate(0, -50%);
            text-align: left;
            z-index: 30;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .instruction-text {
            font-size: 18px;
            font-weight: bold;
            color: var(--ui-accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: blink 1.5s infinite ease-in-out;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border: 1px solid var(--ui-accent);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
        }

        .instruction-sub {
            font-size: 10px;
            color: #aaa;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; box-shadow: 0 0 10px rgba(0, 242, 255, 0.4); }
            50% { opacity: 0.5; box-shadow: 0 0 2px rgba(0, 242, 255, 0.1); }
        }

        .game-over-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            z-index: 40;
            background: rgba(5, 0, 20, 0.9);
            padding: 40px 60px;
            border: 1px solid var(--ui-color);
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        .go-title {
            font-size: 48px;
            font-weight: 900;
            color: var(--ui-color);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0 var(--ui-accent);
        }

        .go-sub {
            font-size: 14px;
            color: var(--ui-accent);
            letter-spacing: 2px;
            animation: blink 1s infinite;
        }

        /* Glitch Effect */
        .glitch-active {
            animation: glitch-skew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
        }

        @keyframes glitch-skew {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); }
            40% { transform: translate(-3px, -3px); }
            60% { transform: translate(3px, 3px); }
            80% { transform: translate(3px, -3px); }
            100% { transform: translate(0); }
        }

    </style>
</head>
<body>

    <div id="game-container">
        <div class="scanlines"></div>
        <div class="vignette"></div>

        <!-- HUD -->
        <div class="hud-layer">
            <div class="hud-score-block">
                <div class="hud-label">DISTANCE</div>
                <div class="score-display"><span id="score">00000</span></div>
                <div class="high-score">HI: <span id="high-score">00000</span></div>
            </div>
            
            <div class="speed-indicator">
                <div class="speed-val"><span id="speed-val">00</span> <span style="font-size:10px; color:#888">KM/H</span></div>
                <div class="speed-track">
                    <div class="speed-fill" id="speed-fill"></div>
                </div>
            </div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Start Instruction (Relocated near player) -->
        <div class="overlay-ui" id="start-ui">
            <div class="instruction-text">PRESS SPACE</div>
            <div class="instruction-sub">TO JUMP</div>
        </div>

        <!-- Game Over -->
        <div class="game-over-panel" id="game-over">
            <div class="go-title">CRITICAL FAILURE</div>
            <div class="go-sub">PRESS SPACE TO REBOOT</div>
        </div>
    </div>

<script>
    /**
     * CONFIGURATION
     */
    const COLORS = {
        skyTop: '#050014',
        skyMid: '#1a0b2e',
        skyBot: '#4a1c40',
        sun: '#ff007f',
        groundFill: '#080808',
        groundLine: '#00f2ff',
        player: '#00f2ff', 
        playerShadow: '#000',
        obstacle: '#ff007f', // Magenta
        bird: '#ffcc00' // Yellow
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const speedValEl = document.getElementById('speed-val');
    const speedFillEl = document.getElementById('speed-fill');
    const gameOverPanel = document.getElementById('game-over');
    const startUI = document.getElementById('start-ui');

    // Game State
    let animationFrameId;
    let gameSpeed = 10;
    let score = 0;
    let highScore = 0;
    let frame = 0;
    let isGameOver = false;
    let isPlaying = false;
    let groundY;

    // Physics
    const GRAVITY = 0.6;
    const JUMP_FORCE = -13;

    /**
     * CLASSES
     */

    class Player {
        constructor() {
            this.width = 54;
            this.height = 50;
            this.x = 100; // Fixed horizontal position
            this.y = groundY - this.height;
            this.dy = 0;
            this.originalY = groundY - this.height;
            this.isGrounded = true;
            this.runFrame = 0;
            this.trail = []; 
        }

        jump() {
            if (this.isGrounded) {
                this.dy = JUMP_FORCE;
                this.isGrounded = false;
                // Spawn dust particles
                for(let i=0; i<6; i++) {
                    particles.push(new Particle(this.x + 20, this.y + this.height, COLORS.groundLine));
                }
            }
        }

        update() {
            this.dy += GRAVITY;
            this.y += this.dy;

            // Ground collision
            if (this.y + this.height > groundY) {
                this.y = groundY - this.height;
                this.dy = 0;
                this.isGrounded = true;
            } else {
                this.isGrounded = false;
            }

            // Animation
            if (this.isGrounded) {
                this.runFrame += 0.25; 
            }

            // Trail Logic (Ghost effect)
            if (frame % 4 === 0) {
                this.trail.push({x: this.x, y: this.y, alpha: 0.5});
                if (this.trail.length > 4) this.trail.shift();
            }
            for(let t of this.trail) {
                t.x -= gameSpeed * 0.8; 
                t.alpha -= 0.08;
            }
            this.trail = this.trail.filter(t => t.alpha > 0);
        }

        draw() {
            // Draw Trail
            this.trail.forEach(t => {
                ctx.save();
                ctx.globalAlpha = t.alpha * 0.3;
                ctx.translate(t.x + this.width/2, t.y + this.height/2);
                ctx.fillStyle = COLORS.player;
                // Draw a simplified block for trail
                ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                ctx.restore();
            });

            ctx.save();
            ctx.translate(this.x + this.width/2, this.y + this.height/2);
            
            // Lean logic
            if(this.isGrounded) {
                ctx.rotate(0.1); // Slight forward lean
            } else {
                ctx.rotate(-0.2); // Lean back in air
            }

            ctx.fillStyle = COLORS.player;
            ctx.shadowColor = COLORS.player;
            ctx.shadowBlur = 10;

            // CRISP VECTOR DINOSAUR
            // Head
            ctx.beginPath();
            ctx.moveTo(-5, -20);
            ctx.lineTo(20, -20);
            ctx.lineTo(25, -15);
            ctx.lineTo(25, -5);
            ctx.lineTo(15, -5);
            ctx.lineTo(15, 0);
            ctx.lineTo(-5, 0);
            ctx.fill();

            // Jaw
            ctx.beginPath();
            ctx.moveTo(15, -5);
            ctx.lineTo(25, -5);
            ctx.lineTo(25, 0);
            ctx.lineTo(15, 0);
            ctx.fill();

            // Eye (Negative space)
            ctx.fillStyle = '#000';
            ctx.fillRect(18, -16, 4, 4);
            
            ctx.fillStyle = COLORS.player;
            
            // Body
            ctx.beginPath();
            ctx.moveTo(-5, 0);
            ctx.lineTo(15, 0);
            ctx.lineTo(15, 15);
            ctx.lineTo(-10, 15);
            ctx.lineTo(-15, 5);
            ctx.fill();

            // Tail
            ctx.beginPath();
            ctx.moveTo(-15, 5);
            ctx.lineTo(-35, 0);
            ctx.lineTo(-35, -5);
            ctx.lineTo(-20, -5);
            ctx.fill();

            // Legs
            ctx.lineWidth = 6;
            ctx.strokeStyle = COLORS.player;
            ctx.lineCap = 'square';

            if (this.isGrounded) {
                const legAnim = Math.sin(this.runFrame) * 15;
                // Back Leg
                ctx.beginPath();
                ctx.moveTo(-5, 15);
                ctx.lineTo(-5 + legAnim, 25);
                ctx.stroke();
                // Front Leg
                ctx.beginPath();
                ctx.moveTo(5, 15);
                ctx.lineTo(5 - legAnim, 25);
                ctx.stroke();
            } else {
                // Jump pose
                ctx.beginPath();
                ctx.moveTo(-5, 15);
                ctx.lineTo(-10, 22);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(5, 15);
                ctx.lineTo(0, 22);
                ctx.stroke();
            }

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type;
            this.markedForDeletion = false;
            this.x = canvas.width + 100;
            
            if (type === 'cactus') {
                this.width = 40;
                this.height = 60;
                this.y = groundY - this.height;
                this.variant = Math.random();
            } else {
                // Bird (Flying)
                this.width = 50;
                this.height = 35;
                // Heights: Low (jumpable), Mid (duck/jump), High
                // For this runner, we assume only jump, so Low and High
                const heights = [groundY - 50, groundY - 110];
                this.y = heights[Math.floor(Math.random() * heights.length)];
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= gameSpeed;
            if (this.x + this.width < -100) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.25;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);

            if (this.type === 'cactus') {
                ctx.fillStyle = COLORS.obstacle;
                ctx.shadowColor = COLORS.obstacle;
                ctx.shadowBlur = 10;
                
                // Main Stem
                ctx.fillRect(this.width/2 - 6, 0, 12, this.height);
                
                // Arms
                if(this.variant > 0.3) {
                    ctx.fillRect(0, 20, 12, 8);
                    ctx.fillRect(0, 10, 8, 18);
                }
                if(this.variant > 0.6) {
                    ctx.fillRect(this.width - 12, 30, 12, 8);
                    ctx.fillRect(this.width - 8, 20, 8, 18);
                }
                
                // Detail (Shadow)
                ctx.fillStyle = '#99004d';
                ctx.shadowBlur = 0;
                ctx.fillRect(this.width/2, 0, 4, this.height);
            } else {
                // Bird
                ctx.fillStyle = COLORS.bird;
                ctx.shadowColor = COLORS.bird;
                ctx.shadowBlur = 10;
                
                // Body (Diamond shape)
                ctx.beginPath();
                ctx.moveTo(0, 15);
                ctx.lineTo(20, 5);
                ctx.lineTo(40, 15);
                ctx.lineTo(20, 25);
                ctx.fill();

                // Wings
                const wingY = Math.sin(this.wingFrame) * 15;
                ctx.beginPath();
                ctx.moveTo(20, 15);
                ctx.lineTo(10, 0 + wingY);
                ctx.lineTo(30, 15);
                ctx.fill();
            }

            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 4 + 2;
            this.speedX = Math.random() * 4 - 2;
            this.speedY = Math.random() * 3 - 1;
            this.color = color;
            this.life = 1.0;
        }
        update() {
            this.x -= gameSpeed * 0.5; 
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.04;
        }
        draw() {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    class BackgroundLayer {
        constructor(speedMod, yOffset, height, color, jaggedness) {
            this.speedMod = speedMod;
            this.yOffset = yOffset;
            this.height = height;
            this.color = color;
            this.x = 0;
            this.width = 150;
            this.jaggedness = jaggedness;
            this.points = [];
            
            // Init points
            for(let i = 0; i < (canvas.width / this.width) + 4; i++) {
                this.points.push(Math.random() * this.jaggedness);
            }
        }

        update() {
            this.x -= gameSpeed * this.speedMod;
            if (this.x <= -this.width) {
                this.x += this.width;
                this.points.shift();
                this.points.push(Math.random() * this.jaggedness);
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            let startX = this.x % this.width;
            
            for (let i = 0; i < this.points.length; i++) {
                let px = startX + (i * this.width);
                let py = groundY - this.yOffset - this.points[i];
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();
        }
    }

    class Sun {
        constructor() {
            this.r = 120;
            this.y = groundY - 160;
            this.x = canvas.width - 250;
        }
        
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            // Gradient Sun
            let grad = ctx.createLinearGradient(0, -this.r, 0, this.r);
            grad.addColorStop(0, COLORS.sun);
            grad.addColorStop(1, '#ff99cc');
            ctx.fillStyle = grad;
            
            ctx.beginPath();
            ctx.arc(0, 0, this.r, 0, Math.PI * 2);
            ctx.fill();

            // Retro Stripes (Cutouts)
            // Use the sky color at this height to simulate transparency
            // Approximation: Sky bottom color
            ctx.fillStyle = COLORS.skyBot; 
            
            const startH = 15;
            const gap = 10;
            const thickness = 6;
            for(let h = startH; h < this.r; h += (gap + thickness)) {
                let w = Math.sqrt(this.r*this.r - h*h);
                ctx.fillRect(-w, h, w*2, thickness);
            }
            
            ctx.restore();
        }
    }

    /**
     * GAME LOGIC
     */
    let player;
    let obstacles = [];
    let particles = [];
    let bgLayers = [];
    let sun;
    let spawnTimer = 0;

    function init() {
        resize();
        resetGame();
        loop();
    }

    function resetGame() {
        isGameOver = false;
        isPlaying = false;
        player = new Player();
        obstacles = [];
        particles = [];
        score = 0;
        gameSpeed = 10;
        spawnTimer = 0;
        
        // Parallax Layers - Darker, distinct silhouettes
        bgLayers = [
            new BackgroundLayer(0.1, 200, 100, '#150a21', 80), // Far Mountains
            new BackgroundLayer(0.25, 120, 60, '#0d0514', 40)  // Near Hills
        ];
        sun = new Sun();
        
        document.getElementById('game-container').classList.remove('glitch-active');
        gameOverPanel.style.display = 'none';
        startUI.style.opacity = '1';
        
        updateHUD();
    }

    function updateHUD() {
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
        let speedDisplay = Math.floor(gameSpeed * 15); // Fake speed value
        speedValEl.innerText = speedDisplay.toString().padStart(2, '0');
        
        // Map speed 10-30 to 10%-100%
        let fillPercent = Math.min(((gameSpeed - 10) / 20) * 100 + 10, 100);
        speedFillEl.style.width = fillPercent + '%';
    }

    function spawnObstacle() {
        spawnTimer--;
        if (spawnTimer <= 0) {
            // Higher chance of cacti, but ensure birds appear
            const type = Math.random() > 0.6 ? 'bird' : 'cactus';
            obstacles.push(new Obstacle(type));
            
            // Dynamic spacing based on speed
            let minFrames = 30 + (1000 / gameSpeed); 
            spawnTimer = minFrames + Math.random() * 40;
            
            // Speed scaling
            if (gameSpeed < 28) gameSpeed += 0.005;
        }
    }

    function checkCollisions() {
        // Hitbox padding - slightly forgiving
        const pPad = 12;
        const oPad = 10;

        for (let obs of obstacles) {
            if (
                player.x + pPad < obs.x + obs.width - oPad &&
                player.x + player.width - pPad > obs.x + oPad &&
                player.y + pPad < obs.y + obs.height - oPad &&
                player.y + player.height - pPad > obs.y + oPad
            ) {
                gameOver();
            }
        }
    }

    function gameOver() {
        isGameOver = true;
        isPlaying = false;
        document.getElementById('game-container').classList.add('glitch-active');
        gameOverPanel.style.display = 'block';
        startUI.style.opacity = '0';
        
        if (score > highScore) {
            highScore = Math.floor(score);
            highScoreEl.innerText = highScore.toString().padStart(5, '0');
        }
    }

    function update() {
        if (!isPlaying) return;

        frame++;
        score += 0.1 * (gameSpeed/10);
        updateHUD();

        player.update();
        bgLayers.forEach(layer => layer.update());
        
        spawnObstacle();
        obstacles.forEach((obs, index) => {
            obs.update();
            if (obs.markedForDeletion) obstacles.splice(index, 1);
        });

        particles.forEach((p, index) => {
            p.update();
            if (p.life <= 0) particles.splice(index, 1);
        });

        checkCollisions();
    }

    function draw() {
        // Clear with gradient sky
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, COLORS.skyTop);
        grad.addColorStop(0.6, COLORS.skyMid);
        grad.addColorStop(1, COLORS.skyBot);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Sun
        sun.draw();

        // Backgrounds
        bgLayers.forEach(layer => layer.draw());

        // Ground Plane
        ctx.fillStyle = COLORS.groundFill;
        ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
        
        // LAYERED DESERT GROUND
        // 1. Top Line (Horizon of ground)
        ctx.lineWidth = 2;
        ctx.strokeStyle = COLORS.groundLine;
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(canvas.width, groundY);
        ctx.stroke();

        // 2. Moving Grid Lines (Perspective)
        // Reduce density, increase stroke weight for primary lines
        let offset = (frame * gameSpeed) % 40;
        
        ctx.strokeStyle = 'rgba(0, 242, 255, 0.3)';
        ctx.lineWidth = 1;
        
        // Horizontal moving lines (Exponential spacing for perspective)
        // Start from groundY and go down
        let horizonScale = 1;
        for(let i = 0; i < 15; i++) {
            let y = groundY + (i * i * 2.5) + (offset * 3);
            if(y > canvas.height) y -= (canvas.height - groundY);
            if(y > groundY) {
                // Fade out lines further away
                let alpha = 1 - (i / 15);
                ctx.globalAlpha = alpha * 0.5;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }
        ctx.globalAlpha = 1.0;

        // Entities
        obstacles.forEach(obs => obs.draw());
        player.draw();
        particles.forEach(p => p.draw());
    }

    function loop() {
        update();
        draw();
        animationFrameId = requestAnimationFrame(loop);
    }

    function resize() {
        const container = document.getElementById('game-container');
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        
        groundY = canvas.height - 100;
        
        if(player) {
            player.originalY = groundY - player.height;
            if(player.isGrounded) player.y = player.originalY;
        }
        
        // Update BG points on resize
        bgLayers.forEach(l => {
            l.points = [];
            for(let i=0; i < (canvas.width / l.width) + 4; i++) {
                l.points.push(Math.random() * l.jaggedness);
            }
        });
        
        if(sun) {
            sun.y = groundY - 160;
            sun.x = canvas.width - 250;
        }
    }

    // Input Handling
    function handleInputStart(e) {
        if (e.type === 'keydown' && e.code !== 'Space') return;
        if (e.type === 'keydown') e.preventDefault(); 

        if (isGameOver) {
            resetGame();
            isPlaying = true;
        } else if (!isPlaying) {
            isPlaying = true;
            startUI.style.opacity = '0';
        } else {
            player.jump();
        }
    }

    window.addEventListener('keydown', handleInputStart);
    window.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleInputStart(e);
    }, {passive: false});
    window.addEventListener('mousedown', handleInputStart);

    window.addEventListener('resize', resize);
    
    // Start
    init();

</script>
</body>
</html>
