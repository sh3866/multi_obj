<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-RUNNER // DESERT PROTOCOL</title>
    <style>
        :root {
            /* Modern-Retro Palette: Deep Night Sky -> Neon Horizon */
            --bg-sky-top: #0f0c29;
            --bg-sky-mid: #302b63;
            --bg-sky-bot: #24243e;
            
            --sun-top: #ff00cc;
            --sun-bot: #333399;
            
            --ground-fill: #050505;
            --ground-grid: #ff00cc;
            --ground-grid-dim: #2a004d;
            
            --accent: #00f2ff; /* Cyan */
            --accent-glow: rgba(0, 242, 255, 0.6);
            --danger: #ff0055; /* Hot Pink */
            
            --font-main: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: var(--font-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main Game Container */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1600px;
            max-height: 900px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* CRT Overlay Effects */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.15) 2px,
                rgba(0,0,0,0.15) 4px
            );
            pointer-events: none;
            z-index: 100;
            opacity: 0.8;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* HUD Layer - Unified Dashboard */
        .hud-layer {
            position: absolute;
            top: 30px;
            left: 40px;
            right: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 20;
            pointer-events: none;
            font-family: var(--font-main);
            text-transform: uppercase;
        }

        .hud-left {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .label {
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--accent);
            font-weight: bold;
            margin-bottom: 2px;
            text-shadow: 0 0 5px var(--accent-glow);
            opacity: 0.8;
        }

        .score-display {
            font-size: 42px;
            font-weight: 900;
            color: #fff;
            line-height: 1;
            text-shadow: 0 0 10px rgba(255,255,255,0.4);
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
        }

        .high-score {
            color: var(--accent);
            font-size: 14px;
            margin-top: 4px;
            letter-spacing: 1px;
            opacity: 0.7;
        }

        /* Speed Indicator - Right Side */
        .speed-indicator {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            width: 180px;
        }

        .speed-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 6px;
        }

        .speed-val {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }

        .speed-track {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-bottom: 1px solid var(--accent);
            position: relative;
            overflow: hidden;
        }

        .speed-fill {
            height: 100%;
            background: var(--accent);
            width: 10%;
            box-shadow: 0 0 15px var(--accent);
            transition: width 0.2s ease-out;
        }

        /* Canvas */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Start/Restart UI */
        .overlay-ui {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 30;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .pulse-text {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 6px;
            animation: pulse 1.2s infinite ease-in-out;
            text-shadow: 0 0 10px var(--accent);
            background: rgba(0,0,0,0.4);
            padding: 10px 20px;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; border-color: rgba(255,255,255,0.2); }
            50% { opacity: 1; border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
        }

        .game-over-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            z-index: 40;
            background: rgba(0,0,0,0.85);
            padding: 40px 60px;
            border: 2px solid var(--danger);
            box-shadow: 0 0 30px var(--danger);
        }

        .go-title {
            font-size: 50px;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 4px 4px 0 var(--danger);
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .go-sub {
            font-size: 16px;
            color: var(--accent);
            letter-spacing: 2px;
            animation: pulse 1s infinite;
        }

        /* Glitch Animation */
        .glitch-active {
            animation: glitch-skew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
        }

        @keyframes glitch-skew {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 5px); }
            40% { transform: translate(-5px, -5px); }
            60% { transform: translate(5px, 5px); }
            80% { transform: translate(5px, -5px); }
            100% { transform: translate(0); }
        }

    </style>
</head>
<body>

    <div id="game-container">
        <div class="scanlines"></div>
        <div class="vignette"></div>

        <!-- HUD -->
        <div class="hud-layer">
            <div class="hud-left">
                <div class="label">Distance</div>
                <div class="score-display"><span id="score">00000</span></div>
                <div class="high-score">HI: <span id="high-score">00000</span></div>
            </div>
            
            <div class="speed-indicator">
                <div class="speed-header">
                    <span class="label" style="margin:0">Velocity</span>
                    <span class="speed-val"><span id="speed-val">00</span> KM/H</span>
                </div>
                <div class="speed-track">
                    <div class="speed-fill" id="speed-fill"></div>
                </div>
            </div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Start Instruction -->
        <div class="overlay-ui" id="start-ui">
            <div class="pulse-text">PRESS SPACE TO JUMP</div>
        </div>

        <!-- Game Over -->
        <div class="game-over-panel" id="game-over">
            <div class="go-title">CRITICAL FAILURE</div>
            <div class="go-sub">PRESS SPACE TO REBOOT</div>
        </div>
    </div>

<script>
    /**
     * CONFIGURATION
     */
    const COLORS = {
        skyTop: '#0f0c29',
        skyMid: '#302b63',
        skyBot: '#24243e',
        sunTop: '#ff00cc',
        sunBot: '#333399',
        groundFill: '#050505',
        groundGrid: '#ff00cc',
        groundGridDim: '#3a0050',
        player: '#00f2ff', // Cyan
        playerShadow: '#000000',
        obstacle: '#ff0055', // Hot Pink
        obstacleDetail: '#990033',
        bird: '#ffcc00' // Yellow
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const speedValEl = document.getElementById('speed-val');
    const speedFillEl = document.getElementById('speed-fill');
    const gameOverPanel = document.getElementById('game-over');
    const startUI = document.getElementById('start-ui');

    // Game State
    let animationFrameId;
    let gameSpeed = 10;
    let score = 0;
    let highScore = 0;
    let frame = 0;
    let isGameOver = false;
    let isPlaying = false;
    let groundY;

    // Physics
    const GRAVITY = 0.6;
    const JUMP_FORCE = -13;

    /**
     * CLASSES
     */

    class Player {
        constructor() {
            this.width = 50;
            this.height = 50;
            this.x = 80; // Positioned slightly off-center left
            this.y = groundY - this.height;
            this.dy = 0;
            this.originalY = groundY - this.height;
            this.isGrounded = true;
            this.runFrame = 0;
            this.trail = []; // For ghost trail effect
        }

        jump() {
            if (this.isGrounded) {
                this.dy = JUMP_FORCE;
                this.isGrounded = false;
                // Spawn dust
                for(let i=0; i<8; i++) {
                    particles.push(new Particle(this.x + 20, this.y + this.height, COLORS.groundGrid));
                }
            }
        }

        update() {
            this.dy += GRAVITY;
            this.y += this.dy;

            // Ground collision
            if (this.y + this.height > groundY) {
                this.y = groundY - this.height;
                this.dy = 0;
                this.isGrounded = true;
            } else {
                this.isGrounded = false;
            }

            // Animation
            if (this.isGrounded) {
                this.runFrame += 0.25; 
            }

            // Trail Logic
            if (frame % 3 === 0) {
                this.trail.push({x: this.x, y: this.y, alpha: 0.6});
                if (this.trail.length > 5) this.trail.shift();
            }
            // Update trail positions
            for(let t of this.trail) {
                t.x -= gameSpeed; // Trail stays in world space
                t.alpha -= 0.1;
            }
            this.trail = this.trail.filter(t => t.alpha > 0);
        }

        draw() {
            // Draw Trail
            this.trail.forEach(t => {
                ctx.save();
                ctx.globalAlpha = t.alpha * 0.4;
                ctx.translate(t.x + this.width/2, t.y + this.height/2);
                ctx.fillStyle = COLORS.player;
                // Simple block representation for trail
                ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                ctx.restore();
            });

            ctx.save();
            ctx.translate(this.x + this.width/2, this.y + this.height/2);
            
            // Lean logic
            if(this.isGrounded) {
                ctx.rotate(0.15);
            } else {
                ctx.rotate(-0.15); // Lean back when jumping
            }

            ctx.fillStyle = COLORS.player;
            ctx.shadowColor = COLORS.player;
            ctx.shadowBlur = 15; // Neon Glow

            // Pixel Art Style Dino (Crisp Silhouette)
            // Head
            ctx.fillRect(5, -25, 30, 20);
            // Jaw
            ctx.fillRect(25, -10, 15, 8);
            // Eye (Negative space)
            ctx.fillStyle = COLORS.groundFill;
            ctx.fillRect(22, -20, 4, 4);
            
            ctx.fillStyle = COLORS.player;
            // Body
            ctx.fillRect(-5, -10, 30, 30);
            // Tail
            ctx.fillRect(-25, -15, 20, 10);
            ctx.fillRect(-25, -5, 10, 5);

            // Legs (Animated)
            ctx.lineWidth = 6;
            ctx.strokeStyle = COLORS.player;
            ctx.lineCap = 'square';

            if (this.isGrounded) {
                const legAnim = Math.sin(this.runFrame) * 12;
                // Back Leg
                ctx.beginPath();
                ctx.moveTo(-5, 15);
                ctx.lineTo(-5 + legAnim, 25);
                ctx.stroke();
                // Front Leg
                ctx.beginPath();
                ctx.moveTo(5, 15);
                ctx.lineTo(5 - legAnim, 25);
                ctx.stroke();
            } else {
                // Jump pose: legs tucked
                ctx.beginPath();
                ctx.moveTo(-5, 15);
                ctx.lineTo(-10, 20);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(5, 15);
                ctx.lineTo(0, 20);
                ctx.stroke();
            }

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type;
            this.markedForDeletion = false;
            this.x = canvas.width + 100;
            
            if (type === 'cactus') {
                this.width = 35;
                this.height = 55;
                this.y = groundY - this.height;
                this.variant = Math.random();
            } else {
                // Bird (Flying)
                this.width = 50;
                this.height = 35;
                // Heights: Low, Mid, High
                const heights = [groundY - 45, groundY - 85, groundY - 130];
                this.y = heights[Math.floor(Math.random() * heights.length)];
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= gameSpeed;
            if (this.x + this.width < -100) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.2;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);

            if (this.type === 'cactus') {
                ctx.fillStyle = COLORS.obstacle;
                ctx.shadowColor = COLORS.obstacle;
                ctx.shadowBlur = 10;
                
                // Main Stem
                ctx.fillRect(this.width/2 - 6, 0, 12, this.height);
                
                // Arms
                if(this.variant > 0.3) {
                    ctx.fillRect(0, 20, 12, 8);
                    ctx.fillRect(0, 10, 8, 18);
                }
                if(this.variant > 0.6) {
                    ctx.fillRect(this.width - 12, 30, 12, 8);
                    ctx.fillRect(this.width - 8, 20, 8, 18);
                }
                
                // Detail (Shadow)
                ctx.fillStyle = COLORS.obstacleDetail;
                ctx.shadowBlur = 0;
                ctx.fillRect(this.width/2, 0, 4, this.height);
            } else {
                // Bird
                ctx.fillStyle = COLORS.bird;
                ctx.shadowColor = COLORS.bird;
                ctx.shadowBlur = 10;
                
                // Body (Diamond shape)
                ctx.beginPath();
                ctx.moveTo(0, 15);
                ctx.lineTo(20, 5);
                ctx.lineTo(40, 15);
                ctx.lineTo(20, 25);
                ctx.fill();

                // Wings
                const wingY = Math.sin(this.wingFrame) * 15;
                ctx.beginPath();
                ctx.moveTo(20, 15);
                ctx.lineTo(10, 0 + wingY);
                ctx.lineTo(30, 15);
                ctx.fill();
            }

            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 4 + 2;
            this.speedX = Math.random() * 4 - 2;
            this.speedY = Math.random() * 3 - 1;
            this.color = color;
            this.life = 1.0;
        }
        update() {
            this.x -= gameSpeed * 0.5; // Move with world
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.04;
        }
        draw() {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    class BackgroundLayer {
        constructor(speedMod, yOffset, height, color, jaggedness) {
            this.speedMod = speedMod;
            this.yOffset = yOffset;
            this.height = height;
            this.color = color;
            this.x = 0;
            this.width = 200;
            this.jaggedness = jaggedness;
            this.points = [];
            
            // Init points
            for(let i = 0; i < (canvas.width / this.width) + 4; i++) {
                this.points.push(Math.random() * this.jaggedness);
            }
        }

        update() {
            this.x -= gameSpeed * this.speedMod;
            if (this.x <= -this.width) {
                this.x += this.width;
                this.points.shift();
                this.points.push(Math.random() * this.jaggedness);
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            let startX = this.x % this.width;
            
            for (let i = 0; i < this.points.length; i++) {
                let px = startX + (i * this.width);
                let py = groundY - this.yOffset - this.points[i];
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();
        }
    }

    class Sun {
        constructor() {
            this.r = 100;
            this.y = groundY - 140;
            this.x = canvas.width - 200;
        }
        
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            // Gradient Sun
            let grad = ctx.createLinearGradient(0, -this.r, 0, this.r);
            grad.addColorStop(0, COLORS.sunTop);
            grad.addColorStop(1, COLORS.sunBot);
            ctx.fillStyle = grad;
            
            ctx.beginPath();
            ctx.arc(0, 0, this.r, 0, Math.PI * 2);
            ctx.fill();

            // Retro Stripes (Cutouts)
            ctx.fillStyle = COLORS.skyBot; // Match sky bottom to simulate transparency
            const startH = 10;
            const gap = 8;
            const thickness = 6;
            for(let h = startH; h < this.r; h += (gap + thickness)) {
                let w = Math.sqrt(this.r*this.r - h*h);
                ctx.fillRect(-w, h, w*2, thickness);
            }
            
            ctx.restore();
        }
    }

    /**
     * GAME LOGIC
     */
    let player;
    let obstacles = [];
    let particles = [];
    let bgLayers = [];
    let sun;
    let spawnTimer = 0;

    function init() {
        resize();
        resetGame();
        loop();
    }

    function resetGame() {
        isGameOver = false;
        isPlaying = false;
        player = new Player();
        obstacles = [];
        particles = [];
        score = 0;
        gameSpeed = 10;
        spawnTimer = 0;
        
        // Parallax Layers
        // Using darker, more distinct colors for depth
        bgLayers = [
            new BackgroundLayer(0.1, 200, 100, '#1a153a', 60), // Far Mountains (Dark Purple)
            new BackgroundLayer(0.3, 120, 60, '#120d26', 30)  // Near Hills (Darker)
        ];
        sun = new Sun();
        
        document.getElementById('game-container').classList.remove('glitch-active');
        gameOverPanel.style.display = 'none';
        startUI.style.opacity = '1';
        
        updateHUD();
    }

    function updateHUD() {
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
        let speedDisplay = Math.floor(gameSpeed * 12); // Fake speed value
        speedValEl.innerText = speedDisplay.toString().padStart(2, '0');
        
        // Map speed 10-30 to 10%-100%
        let fillPercent = Math.min(((gameSpeed - 10) / 20) * 100 + 10, 100);
        speedFillEl.style.width = fillPercent + '%';
    }

    function spawnObstacle() {
        spawnTimer--;
        if (spawnTimer <= 0) {
            // Higher chance of cacti, but ensure birds appear
            const type = Math.random() > 0.6 ? 'bird' : 'cactus';
            obstacles.push(new Obstacle(type));
            
            // Dynamic spacing based on speed
            let minFrames = 35 + (1000 / gameSpeed); 
            spawnTimer = minFrames + Math.random() * 50;
            
            // Speed scaling
            if (gameSpeed < 28) gameSpeed += 0.005;
        }
    }

    function checkCollisions() {
        // Hitbox padding - slightly forgiving
        const pPad = 10;
        const oPad = 8;

        for (let obs of obstacles) {
            if (
                player.x + pPad < obs.x + obs.width - oPad &&
                player.x + player.width - pPad > obs.x + oPad &&
                player.y + pPad < obs.y + obs.height - oPad &&
                player.y + player.height - pPad > obs.y + oPad
            ) {
                gameOver();
            }
        }
    }

    function gameOver() {
        isGameOver = true;
        isPlaying = false;
        document.getElementById('game-container').classList.add('glitch-active');
        gameOverPanel.style.display = 'block';
        startUI.style.opacity = '0';
        
        if (score > highScore) {
            highScore = Math.floor(score);
            highScoreEl.innerText = highScore.toString().padStart(5, '0');
        }
    }

    function update() {
        if (!isPlaying) return;

        frame++;
        score += 0.1 * (gameSpeed/10);
        updateHUD();

        player.update();
        bgLayers.forEach(layer => layer.update());
        
        spawnObstacle();
        obstacles.forEach((obs, index) => {
            obs.update();
            if (obs.markedForDeletion) obstacles.splice(index, 1);
        });

        particles.forEach((p, index) => {
            p.update();
            if (p.life <= 0) particles.splice(index, 1);
        });

        checkCollisions();
    }

    function draw() {
        // Clear with gradient sky
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, COLORS.skyTop);
        grad.addColorStop(0.5, COLORS.skyMid);
        grad.addColorStop(1, COLORS.skyBot);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Sun
        sun.draw();

        // Backgrounds
        bgLayers.forEach(layer => layer.draw());

        // Ground Plane
        ctx.fillStyle = COLORS.groundFill;
        ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
        
        // Retro Grid Lines on Ground (Perspective)
        ctx.lineWidth = 2;
        
        // Horizontal moving lines
        let offset = (frame * gameSpeed) % 40;
        
        // Vertical perspective lines
        ctx.strokeStyle = COLORS.groundGridDim;
        ctx.beginPath();
        const centerX = canvas.width / 2;
        const vanishY = groundY;
        
        // Draw radiating lines
        for (let i = -10; i <= 10; i++) {
            let x = centerX + (i * 100);
            ctx.moveTo(x, canvas.height);
            ctx.lineTo(centerX + (i * 20), vanishY);
        }
        ctx.stroke();

        // Horizontal lines
        ctx.strokeStyle = COLORS.groundGrid;
        ctx.beginPath();
        for(let i = 0; i < 20; i++) {
            // Exponential spacing for perspective
            let y = groundY + (i * i * 1.5) + (offset * 2);
            if(y > canvas.height) y -= (canvas.height - groundY);
            if(y > groundY) {
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
            }
        }
        ctx.stroke();

        // Entities
        obstacles.forEach(obs => obs.draw());
        player.draw();
        particles.forEach(p => p.draw());
    }

    function loop() {
        update();
        draw();
        animationFrameId = requestAnimationFrame(loop);
    }

    function resize() {
        const container = document.getElementById('game-container');
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        
        groundY = canvas.height - 120;
        
        if(player) {
            player.originalY = groundY - player.height;
            if(player.isGrounded) player.y = player.originalY;
        }
        
        // Update BG points on resize
        bgLayers.forEach(l => {
            l.points = [];
            for(let i=0; i < (canvas.width / l.width) + 4; i++) {
                l.points.push(Math.random() * l.jaggedness);
            }
        });
        
        if(sun) {
            sun.y = groundY - 140;
            sun.x = canvas.width - 200;
        }
    }

    // Input Handling
    function handleInputStart(e) {
        if (e.type === 'keydown' && e.code !== 'Space') return;
        if (e.type === 'keydown') e.preventDefault(); 

        if (isGameOver) {
            resetGame();
            isPlaying = true;
        } else if (!isPlaying) {
            isPlaying = true;
            startUI.style.opacity = '0';
        } else {
            player.jump();
        }
    }

    window.addEventListener('keydown', handleInputStart);
    window.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleInputStart(e);
    }, {passive: false});
    window.addEventListener('mousedown', handleInputStart);

    window.addEventListener('resize', resize);
    
    // Start
    init();

</script>
</body>
</html>
