<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Architecture & Information Flow</title>
    <style>
        :root {
            /* Palette - Technical Blueprint */
            --bg-dark: #050507;
            --bg-panel: #111318;
            --grid-line: #1f222e;
            
            --text-primary: #e2e8f0;
            --text-secondary: #64748b;
            --text-label: #94a3b8;

            /* Signal Colors */
            --c-data: #00f0ff;       /* Cyan - Data Bus */
            --c-instr: #e879f9;      /* Magenta - Instructions */
            --c-control: #4ade80;    /* Green - Control Signals */
            --c-io: #fbbf24;         /* Amber - I/O */

            /* Dimensions */
            --node-w: 160px;
            --node-h: 100px;
            --cpu-w: 200px;
            --cpu-h: 140px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Prevent scroll for infographic feel */
            display: flex;
            flex-direction: column;
        }

        /* Background Grid - Blueprint Style */
        .bg-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }

        /* Header */
        header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 10;
            border-bottom: 1px solid var(--grid-line);
            background: rgba(5, 5, 7, 0.9);
            backdrop-filter: blur(10px);
        }

        .header-left h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
        }
        .header-left p {
            font-family: 'Menlo', 'Consolas', monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Legend - Bottom Left or Top Right? Critique says move to bottom to clear top. */
        .legend {
            display: flex;
            gap: 1.5rem;
            background: var(--bg-panel);
            border: 1px solid var(--grid-line);
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            align-items: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
        }

        .legend-icon {
            width: 24px;
            height: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Legend Visuals */
        .l-solid { height: 4px; width: 100%; background: var(--c-data); }
        .l-dashed { height: 0; width: 100%; border-top: 2px dashed var(--c-instr); }
        .l-dotted { height: 0; width: 100%; border-top: 2px dotted var(--c-control); }
        .l-thick { height: 6px; width: 100%; background: var(--c-io); border-radius: 2px; }

        /* Main Diagram Area */
        main {
            flex: 1;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        /* SVG Layer */
        svg#connections-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Zones (Grouping) */
        .zone {
            position: absolute;
            border: 1px dashed var(--grid-line);
            background: rgba(255, 255, 255, 0.01);
            border-radius: 12px;
            z-index: 0;
            pointer-events: none;
        }
        
        .zone-label {
            position: absolute;
            top: -12px;
            left: 16px;
            background: var(--bg-dark);
            padding: 0 8px;
            font-family: 'Menlo', 'Consolas', monospace;
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

        /* Nodes - Standardized Card System */
        .node {
            position: absolute;
            background: var(--bg-panel);
            border: 1px solid #334155;
            border-radius: 6px;
            width: var(--node-w);
            height: var(--node-h);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            z-index: 2;
            transition: all 0.3s ease;
        }

        /* Node Content */
        .node-icon {
            width: 28px;
            height: 28px;
            margin-bottom: 0.5rem;
            stroke-width: 1.5;
            color: var(--text-secondary);
        }
        .node-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.02em;
        }
        .node-desc {
            font-size: 0.7rem;
            font-family: 'Menlo', 'Consolas', monospace;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* CPU - The Hero */
        .node.cpu {
            width: var(--cpu-w);
            height: var(--cpu-h);
            border: 1px solid var(--c-data);
            background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
            z-index: 3;
            box-shadow: 0 0 0 1px rgba(0, 240, 255, 0.1), 0 10px 40px rgba(0,0,0,0.6);
        }
        .node.cpu::after {
            /* Decorative core */
            content: '';
            position: absolute;
            inset: 12px;
            border: 1px dashed rgba(0, 240, 255, 0.2);
            border-radius: 4px;
        }
        .node.cpu .node-icon {
            color: var(--c-data);
            width: 36px;
            height: 36px;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.4));
        }

        /* I/O Nodes - Distinct Shape */
        .node.io-node {
            border-left: 4px solid var(--c-io);
        }

        /* GPU - Secondary */
        .node.gpu {
            border-color: #475569;
            background: #0f1115;
        }
        .node.gpu .node-icon { color: var(--c-instr); }

        /* SVG Styles */
        .path-track {
            fill: none;
            stroke: rgba(255,255,255,0.03);
            stroke-width: 4;
            stroke-linecap: round;
        }
        .path-active {
            fill: none;
            stroke-width: 2px;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Line Types */
        .type-data { 
            stroke: var(--c-data); 
            stroke-width: 3px; /* Solid Ribbon feel */
            filter: drop-shadow(0 0 4px rgba(0, 240, 255, 0.3));
        }
        .type-instruction { 
            stroke: var(--c-instr); 
            stroke-dasharray: 6, 6; 
            stroke-width: 2px;
            filter: drop-shadow(0 0 4px rgba(232, 121, 249, 0.3));
            animation: flow 1s linear infinite;
        }
        .type-control { 
            stroke: var(--c-control); 
            stroke-dasharray: 2, 4; /* Dotted */
            stroke-width: 2px;
            opacity: 0.9; /* Ensure visibility */
            filter: drop-shadow(0 0 3px rgba(74, 222, 128, 0.4));
            animation: flow 2s linear infinite;
        }
        .type-io { 
            stroke: var(--c-io); 
            stroke-width: 4px; /* Thick Pipe */
            stroke-linecap: round;
        }

        /* Animations */
        @keyframes flow {
            to { stroke-dashoffset: -16; }
        }

        /* Labels on Lines */
        .path-label-group {
            pointer-events: none;
        }
        .path-label-bg {
            fill: var(--bg-dark);
            stroke: var(--grid-line);
            stroke-width: 1px;
            rx: 3px;
        }
        .path-label {
            font-size: 10px;
            font-family: 'Menlo', 'Consolas', monospace;
            fill: var(--text-label);
            font-weight: 600;
            text-anchor: middle;
            dominant-baseline: middle;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <header>
        <div class="header-left">
            <h1>System Architecture</h1>
            <p>Information Flow & Hardware Topology</p>
        </div>
        <!-- Legend moved to header right for balance, or can be bottom. 
             Critique suggests moving away from top right to avoid jumping. 
             Let's keep it in header but ensure it's readable, or move to bottom left.
             Given the single page constraint, bottom left is safer for "diagram first" viewing.
        -->
    </header>

    <main id="diagram-area">
        
        <!-- Zones -->
        <!-- Processing Core: Center -->
        <div class="zone" id="zone-processing" style="top: 10%; left: 35%; width: 30%; height: 40%;">
            <span class="zone-label">Processing Core</span>
        </div>

        <!-- Storage & Memory: Bottom -->
        <div class="zone" id="zone-storage" style="top: 60%; left: 20%; width: 60%; height: 30%;">
            <span class="zone-label">Storage & Memory Subsystem</span>
        </div>

        <!-- SVG Layer -->
        <svg id="connections-layer" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Arrowheads: Unified Geometry (Filled Triangles) -->
                <marker id="arrow-data" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 Z" fill="var(--c-data)" />
                </marker>
                <marker id="arrow-instr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 Z" fill="var(--c-instr)" />
                </marker>
                <marker id="arrow-control" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 Z" fill="var(--c-control)" />
                </marker>
                <marker id="arrow-io" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 Z" fill="var(--c-io)" />
                </marker>
            </defs>
        </svg>

        <!-- Components -->
        <!-- Using percentages for layout to ensure responsiveness and prevent cropping -->
        
        <!-- Input (Left) -->
        <div id="input" class="node io-node" style="top: 35%; left: 5%;">
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M18 12h-4c-1.1 0-2 .9-2 2v4c0 1.1.9 2 2 2h4c1.1 0 2-.9 2-2v-4c0-1.1-.9-2-2-2z"/><path d="M6 12H2v4h4"/><path d="M6 20H2v-4h4"/><path d="M6 8H2v4h4"/><path d="M18 8h-4c-1.1 0-2 .9-2 2v4c0 1.1.9 2 2 2h4c1.1 0 2-.9 2-2v-4c0-1.1-.9-2-2-2z"/></svg>
            <div class="node-label">Input</div>
            <div class="node-desc">User Events</div>
        </div>

        <!-- Network (Top Right) -->
        <div id="network" class="node" style="top: 5%; left: 75%;">
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
            <div class="node-label">Network</div>
            <div class="node-desc">Packets</div>
        </div>

        <!-- GPU (Top Center - slightly smaller visual weight than CPU) -->
        <div id="gpu" class="node gpu" style="top: 5%; left: 50%; transform: translateX(-50%);">
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/><path d="M9 1v3"/><path d="M15 1v3"/><path d="M9 20v3"/><path d="M15 20v3"/><path d="M20 9h3"/><path d="M20 14h3"/><path d="M1 9h3"/><path d="M1 14h3"/></svg>
            <div class="node-label">GPU</div>
            <div class="node-desc">Render Accel</div>
        </div>

        <!-- CPU (Center - Focal Point) -->
        <div id="cpu" class="node cpu" style="top: 30%; left: 50%; transform: translate(-50%, -50%);">
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></svg>
            <div class="node-label">CPU</div>
            <div class="node-desc">Control Unit</div>
        </div>

        <!-- RAM (Bottom Left) -->
        <div id="ram" class="node" style="top: 70%; left: 35%; transform: translateX(-50%);">
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 18v2"/><path d="M10 18v2"/><path d="M14 18v2"/><path d="M18 18v2"/><path d="M6 10h12"/></svg>
            <div class="node-label">Memory</div>
            <div class="node-desc">Volatile RAM</div>
        </div>

        <!-- Storage (Bottom Right) -->
        <div id="storage" class="node" style="top: 70%; left: 65%; transform: translateX(-50%);">
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
            <div class="node-label">Storage</div>
            <div class="node-desc">NVMe SSD</div>
        </div>

        <!-- Output (Far Right) -->
        <div id="output" class="node io-node" style="top: 35%; left: 90%;">
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            <div class="node-label">Output</div>
            <div class="node-desc">Display</div>
        </div>

    </main>

    <!-- Legend Footer -->
    <div style="position: absolute; bottom: 2rem; left: 2rem; z-index: 20;">
        <div class="legend">
            <div class="legend-item">
                <div class="legend-icon"><div class="l-solid"></div></div> Data (Solid)
            </div>
            <div class="legend-item">
                <div class="legend-icon"><div class="l-dashed"></div></div> Instr (Dashed)
            </div>
            <div class="legend-item">
                <div class="legend-icon"><div class="l-dotted"></div></div> Control (Dot)
            </div>
            <div class="legend-item">
                <div class="legend-icon"><div class="l-thick"></div></div> I/O (Thick)
            </div>
        </div>
    </div>

    <script>
        // Configuration for connections
        const connectionsConfig = [
            // Input -> CPU (I/O)
            { from: 'input', to: 'cpu', type: 'io', label: 'Events' },
            
            // Network -> CPU (Data)
            { from: 'network', to: 'cpu', type: 'data', label: 'Packets' },
            
            // CPU -> RAM (Control/Write) - Dotted per Critique
            { from: 'cpu', to: 'ram', type: 'control', label: 'Write' },
            
            // RAM -> CPU (Instruction Fetch) - Dashed per Critique
            { from: 'ram', to: 'cpu', type: 'instruction', label: 'Fetch' },
            
            // CPU -> GPU (Data Render)
            { from: 'cpu', to: 'gpu', type: 'data', label: 'Render' },
            
            // GPU -> Output (I/O Stream)
            { from: 'gpu', to: 'output', type: 'io', label: 'Pixels' },
            
            // CPU <-> Storage (High Bandwidth)
            { from: 'storage', to: 'cpu', type: 'data', label: 'Load' },
            { from: 'cpu', to: 'storage', type: 'control', label: 'Persist' }
        ];

        const svgLayer = document.getElementById('connections-layer');
        
        const markers = {
            'data': 'url(#arrow-data)',
            'instruction': 'url(#arrow-instr)',
            'control': 'url(#arrow-control)',
            'io': 'url(#arrow-io)'
        };

        function getCenter(element) {
            const rect = element.getBoundingClientRect();
            const mainRect = document.getElementById('diagram-area').getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2 - mainRect.left,
                y: rect.top + rect.height / 2 - mainRect.top,
                w: rect.width,
                h: rect.height
            };
        }

        // Calculate intersection with the rectangle edge
        function getEdgePoint(center, targetCenter) {
            const dx = targetCenter.x - center.x;
            const dy = targetCenter.y - center.y;
            const angle = Math.atan2(dy, dx);
            
            // Use a slightly smaller hit box for the intersection so arrows don't overlap the border
            const hitBoxW = center.w * 0.9; 
            const hitBoxH = center.h * 0.9;
            
            const absCos = Math.abs(Math.cos(angle));
            const absSin = Math.abs(Math.sin(angle));
            
            let x, y;
            // Determine if we hit the vertical or horizontal side first
            if (hitBoxW * absSin < hitBoxH * absCos) {
                // Hit vertical side (Left or Right)
                const signX = Math.sign(Math.cos(angle));
                const halfW = hitBoxW / 2;
                x = center.x + signX * halfW;
                y = center.y + Math.tan(angle) * signX * halfW;
            } else {
                // Hit horizontal side (Top or Bottom)
                const signY = Math.sign(Math.sin(angle));
                const halfH = hitBoxH / 2;
                y = center.y + signY * halfH;
                x = center.x + (1 / Math.tan(angle)) * signY * halfH;
            }
            return { x, y };
        }

        function drawConnections() {
            // Clear existing paths but keep defs
            const defs = svgLayer.querySelector('defs').outerHTML;
            svgLayer.innerHTML = defs;

            connectionsConfig.forEach(conn => {
                const startEl = document.getElementById(conn.from);
                const endEl = document.getElementById(conn.to);
                
                if (!startEl || !endEl) return;

                const startC = getCenter(startEl);
                const endC = getCenter(endEl);

                const startPoint = getEdgePoint(startC, endC);
                const endPoint = getEdgePoint(endC, startC);

                // Calculate Bezier Control Points
                const dx = endPoint.x - startPoint.x;
                const dy = endPoint.y - startPoint.y;
                const distance = Math.sqrt(dx*dx + dy*dy);
                
                // Adjust curvature based on distance for cleaner lines
                // For horizontal connections, pull control points horizontally
                // For vertical, pull vertically
                const curvature = Math.min(distance * 0.4, 120); 

                let cp1x = startPoint.x;
                let cp1y = startPoint.y;
                let cp2x = endPoint.x;
                let cp2y = endPoint.y;

                if (Math.abs(dx) > Math.abs(dy)) {
                    cp1x += dx * 0.5;
                    cp2x -= dx * 0.5;
                } else {
                    cp1y += dy * 0.5;
                    cp2y -= dy * 0.5;
                }

                const pathD = `M ${startPoint.x} ${startPoint.y} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${endPoint.x} ${endPoint.y}`;

                // 1. Track (Faint background line)
                const track = document.createElementNS("http://www.w3.org/2000/svg", "path");
                track.setAttribute("d", pathD);
                track.setAttribute("class", "path-track");
                svgLayer.appendChild(track);

                // 2. Active Flow Line
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", pathD);
                path.setAttribute("class", `path-active type-${conn.type}`);
                path.setAttribute("marker-end", markers[conn.type]);
                svgLayer.appendChild(path);

                // 3. Label Logic
                // Calculate midpoint of Bezier curve
                const midX = (startPoint.x + cp1x + cp2x + endPoint.x) / 4;
                const midY = (startPoint.y + cp1y + cp2y + endPoint.y) / 4;

                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.setAttribute("class", "path-label-group");

                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", midX);
                text.setAttribute("y", midY);
                text.setAttribute("class", "path-label");
                text.textContent = conn.label;

                g.appendChild(text);
                svgLayer.appendChild(g);

                // Get bounding box of text (must be in DOM to measure)
                const bbox = text.getBBox();
                
                // Create rect background
                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute("x", bbox.x - 6);
                rect.setAttribute("y", bbox.y - 3);
                rect.setAttribute("width", bbox.width + 12);
                rect.setAttribute("height", bbox.height + 6);
                rect.setAttribute("class", "path-label-bg");
                
                // Insert rect before text in the group
                g.insertBefore(rect, text);
            });
        }

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(drawConnections, 100);
        });

        // Initial Draw
        window.addEventListener('load', drawConnections);
        if (document.readyState === "complete") {
            drawConnections();
        }

    </script>
</body>
</html>
