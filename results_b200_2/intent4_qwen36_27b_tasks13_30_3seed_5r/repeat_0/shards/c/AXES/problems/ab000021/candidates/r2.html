<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Architecture & Information Flow</title>
    <style>
        :root {
            /* Palette - Technical & High Contrast */
            --bg-chassis: #050505;
            --zone-bg: rgba(255, 255, 255, 0.02);
            --zone-border: rgba(255, 255, 255, 0.05);
            
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --text-accent: #00ffcc; /* Cyan terminal color */

            /* Signal Colors - Distinct & Vibrant */
            --color-data: #00e5ff;       /* Cyan - Data */
            --color-instruction: #d500f9; /* Magenta - Instructions */
            --color-control: #76ff03;    /* Lime - Control */
            --color-io: #ffea00;         /* Yellow - I/O */

            /* Dimensions */
            --node-w: 160px;
            --node-h: 100px;
            --cpu-w: 220px;
            --cpu-h: 140px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-chassis);
            color: var(--text-primary);
            font-family: 'Courier New', Courier, monospace; /* Technical Monospace */
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Background Texture - Subtle Circuit Grid */
        .bg-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--zone-border) 1px, transparent 1px),
                linear-gradient(90deg, var(--zone-border) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.3;
            z-index: 0;
            pointer-events: none;
        }

        /* Header */
        header {
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            border-bottom: 1px solid var(--zone-border);
            background: rgba(5, 5, 5, 0.9);
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        h1::before {
            content: '';
            display: block;
            width: 8px;
            height: 8px;
            background: var(--color-control);
            box-shadow: 0 0 5px var(--color-control);
        }

        .legend {
            display: flex;
            gap: 1.5rem;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
        }

        .legend-line {
            width: 20px;
            height: 2px;
        }

        /* Main Diagram Area */
        main {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            perspective: 1000px;
        }

        /* SVG Layer - Demoted */
        svg#connections-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Zones (Grouping) */
        .zone {
            position: absolute;
            border: 1px dashed var(--zone-border);
            background: var(--zone-bg);
            border-radius: 12px;
            z-index: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .zone-label {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 0.6rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.7;
        }

        /* Nodes - Unified System */
        .node {
            position: absolute;
            background: #111;
            border: 1px solid #333;
            border-radius: 4px; /* Squarer, more technical */
            width: var(--node-w);
            height: var(--node-h);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            z-index: 2;
            transition: transform 0.3s ease, border-color 0.3s ease;
            /* Technical "Ports" visual */
            background-image: 
                linear-gradient(90deg, transparent 4px, #222 4px, #222 6px, transparent 6px);
            background-position: bottom 0 left 0;
            background-size: 100% 100%;
        }

        .node::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            border: 1px solid transparent;
            border-radius: 4px;
            pointer-events: none;
        }

        .node:hover {
            transform: translateY(-2px);
            border-color: var(--text-secondary);
            z-index: 3;
        }

        /* CPU - Distinct Visual Identity */
        .node.cpu {
            width: var(--cpu-w);
            height: var(--cpu-h);
            border: 1px solid #444;
            background: 
                radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .node.cpu::after {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1px dashed #333;
            border-radius: 2px;
            pointer-events: none;
        }

        /* CPU Pulse Animation */
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(213, 0, 249, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(213, 0, 249, 0); }
            100% { box-shadow: 0 0 0 0 rgba(213, 0, 249, 0); }
        }
        .node.cpu { animation: pulse-glow 3s infinite; }

        /* Icon Styling */
        .node-icon {
            width: 28px;
            height: 28px;
            margin-bottom: 0.5rem;
            stroke-width: 1.5;
            color: var(--text-secondary);
        }
        
        .node.cpu .node-icon {
            stroke: var(--text-primary);
            filter: drop-shadow(0 0 2px rgba(255,255,255,0.3));
        }

        .node-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.2rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .node-desc {
            font-size: 0.65rem;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
        }

        /* Connector Styles - Refined Grammar */
        .path-track {
            fill: none;
            stroke: #222;
            stroke-width: 1;
            opacity: 0.5;
        }

        .path-active {
            fill: none;
            stroke-width: 2px;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Specific Line Styles */
        .type-data { 
            stroke: var(--color-data); 
            stroke-dasharray: 0; /* Solid */
            filter: drop-shadow(0 0 2px var(--color-data));
        }
        .type-instruction { 
            stroke: var(--color-instruction); 
            stroke-dasharray: 6, 4; /* Dashed */
            filter: drop-shadow(0 0 2px var(--color-instruction));
        }
        .type-control { 
            stroke: var(--color-control); 
            stroke-dasharray: 2, 4; /* Dotted */
            filter: drop-shadow(0 0 2px var(--color-control));
        }
        .type-io { 
            stroke: var(--color-io); 
            stroke-dasharray: 0; 
            stroke-width: 3px; /* Thick */
            opacity: 0.8;
            filter: drop-shadow(0 0 2px var(--color-io));
        }

        /* Path Labels - Pill Background */
        .path-label-bg {
            fill: var(--bg-chassis);
            stroke: #333;
            stroke-width: 1px;
            rx: 4px;
        }
        .path-label {
            font-size: 11px;
            fill: var(--text-primary);
            font-family: 'Courier New', Courier, monospace;
            font-weight: 700;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
        }

        /* Animations */
        @keyframes dash-flow {
            to { stroke-dashoffset: -20; }
        }
        .type-instruction, .type-control {
            animation: dash-flow 1s linear infinite;
        }

    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <header>
        <h1>System Architecture</h1>
        <div class="legend">
            <div class="legend-item">
                <div class="legend-line" style="background: var(--color-data);"></div> Data (Solid)
            </div>
            <div class="legend-item">
                <div class="legend-line" style="background: var(--color-instruction); border-bottom: 2px dashed var(--color-instruction); height: 0;"></div> Instr (Dashed)
            </div>
            <div class="legend-item">
                <div class="legend-line" style="background: var(--color-control); border-bottom: 2px dotted var(--color-control); height: 0;"></div> Control (Dot)
            </div>
            <div class="legend-item">
                <div class="legend-line" style="background: var(--color-io); height: 4px;"></div> I/O (Thick)
            </div>
        </div>
    </header>

    <main id="diagram-area">
        
        <!-- Background Zones -->
        <div class="zone" id="zone-processing" style="top: 15%; left: 35%; width: 30%; height: 35%;">
            <span class="zone-label">Processing Core</span>
        </div>
        <div class="zone" id="zone-storage" style="top: 60%; left: 20%; width: 60%; height: 30%;">
            <span class="zone-label">Storage & Memory Subsystem</span>
        </div>
        <div class="zone" id="zone-peripheral" style="top: 10%; right: 10%; width: 20%; height: 80%;">
            <span class="zone-label">External I/O</span>
        </div>

        <!-- SVG Layer -->
        <svg id="connections-layer" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Arrowheads -->
                <marker id="arrow-data" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                    <path d="M0,0 L8,4 L0,8 Z" fill="var(--color-data)" />
                </marker>
                <marker id="arrow-instr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                    <path d="M0,0 L8,4 L0,8 Z" fill="var(--color-instruction)" />
                </marker>
                <marker id="arrow-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                    <path d="M0,0 L8,4 L0,8 Z" fill="var(--color-control)" />
                </marker>
                <marker id="arrow-io" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                    <path d="M0,0 L8,4 L0,8 Z" fill="var(--color-io)" />
                </marker>
            </defs>
        </svg>

        <!-- Components -->
        <!-- Input -->
        <div id="input" class="node" style="top: 15%; left: 10%;">
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.01"/><path d="M10 8h.01"/><path d="M14 8h.01"/><path d="M18 8h.01"/><path d="M6 12h.01"/><path d="M10 12h.01"/><path d="M14 12h.01"/><path d="M18 12h.01"/><path d="M6 16h12"/></svg>
            <div class="node-label">Input</div>
            <div class="node-desc">Keyboard / Mouse</div>
        </div>

        <!-- Network -->
        <div id="network" class="node" style="top: 15%; left: 80%;">
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
            <div class="node-label">Network</div>
            <div class="node-desc">NIC / External</div>
        </div>

        <!-- GPU -->
        <div id="gpu" class="node" style="top: 15%; left: 50%; transform: translateX(-50%);">
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/><path d="M9 1v3"/><path d="M15 1v3"/><path d="M9 20v3"/><path d="M15 20v3"/><path d="M20 9h3"/><path d="M20 14h3"/><path d="M1 9h3"/><path d="M1 14h3"/></svg>
            <div class="node-label">GPU</div>
            <div class="node-desc">Graphics Processing</div>
        </div>

        <!-- CPU (Center) -->
        <div id="cpu" class="node cpu" style="top: 50%; left: 50%; transform: translate(-50%, -50%);">
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></svg>
            <div class="node-label">CPU</div>
            <div class="node-desc">Control Unit / ALU</div>
        </div>

        <!-- RAM -->
        <div id="ram" class="node" style="top: 75%; left: 25%; transform: translateX(-50%);">
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 18v2"/><path d="M10 18v2"/><path d="M14 18v2"/><path d="M18 18v2"/><path d="M6 10h12"/></svg>
            <div class="node-label">Memory</div>
            <div class="node-desc">Volatile RAM</div>
        </div>

        <!-- Storage -->
        <div id="storage" class="node" style="top: 75%; left: 75%; transform: translateX(-50%);">
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
            <div class="node-label">Storage</div>
            <div class="node-desc">NVMe SSD</div>
        </div>

        <!-- Output -->
        <div id="output" class="node" style="top: 15%; left: 85%; transform: translateX(50%);">
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            <div class="node-label">Output</div>
            <div class="node-desc">Display / Monitor</div>
        </div>

    </main>

    <script>
        const connectionsConfig = [
            // Input -> CPU
            { from: 'input', to: 'cpu', type: 'io', label: 'Events' },
            
            // Network -> CPU
            { from: 'network', to: 'cpu', type: 'data', label: 'Packets' },
            
            // CPU -> RAM (Control/Write)
            { from: 'cpu', to: 'ram', type: 'control', label: 'Write' },
            
            // RAM -> CPU (Instruction Fetch)
            { from: 'ram', to: 'cpu', type: 'instruction', label: 'Fetch' },
            
            // CPU -> GPU (Data Render)
            { from: 'cpu', to: 'gpu', type: 'data', label: 'Render' },
            
            // GPU -> Output (I/O Stream)
            { from: 'gpu', to: 'output', type: 'io', label: 'Pixels' },
            
            // CPU <-> Storage (High Bandwidth)
            { from: 'storage', to: 'cpu', type: 'data', label: 'Load', thick: true },
            { from: 'cpu', to: 'storage', type: 'control', label: 'Persist' }
        ];

        const svgLayer = document.getElementById('connections-layer');
        
        const markers = {
            'data': 'url(#arrow-data)',
            'instruction': 'url(#arrow-instr)',
            'control': 'url(#arrow-control)',
            'io': 'url(#arrow-io)'
        };

        function getCenter(element) {
            const rect = element.getBoundingClientRect();
            const mainRect = document.getElementById('diagram-area').getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2 - mainRect.left,
                y: rect.top + rect.height / 2 - mainRect.top,
                w: rect.width,
                h: rect.height
            };
        }

        function getEdgePoint(center, targetCenter) {
            const dx = targetCenter.x - center.x;
            const dy = targetCenter.y - center.y;
            const angle = Math.atan2(dy, dx);
            
            // Use a slightly smaller hit box for the intersection so arrows don't overlap the border
            const hitBoxW = center.w * 0.9; 
            const hitBoxH = center.h * 0.9;
            
            const absCos = Math.abs(Math.cos(angle));
            const absSin = Math.abs(Math.sin(angle));
            
            let x, y;
            if (hitBoxW * absSin < hitBoxH * absCos) {
                const signX = Math.sign(Math.cos(angle));
                const halfW = hitBoxW / 2;
                x = center.x + signX * halfW;
                y = center.y + Math.tan(angle) * signX * halfW;
            } else {
                const signY = Math.sign(Math.sin(angle));
                const halfH = hitBoxH / 2;
                y = center.y + signY * halfH;
                x = center.x + (1 / Math.tan(angle)) * signY * halfH;
            }
            return { x, y };
        }

        function drawConnections() {
            // Clear existing paths but keep defs
            const defs = svgLayer.querySelector('defs').outerHTML;
            svgLayer.innerHTML = defs;

            connectionsConfig.forEach(conn => {
                const startEl = document.getElementById(conn.from);
                const endEl = document.getElementById(conn.to);
                
                if (!startEl || !endEl) return;

                const startC = getCenter(startEl);
                const endC = getCenter(endEl);

                const startPoint = getEdgePoint(startC, endC);
                const endPoint = getEdgePoint(endC, startC);

                // Calculate Bezier Control Points
                const dx = endPoint.x - startPoint.x;
                const dy = endPoint.y - startPoint.y;
                const distance = Math.sqrt(dx*dx + dy*dy);
                
                // Adjust curvature based on distance for cleaner lines
                const curvature = Math.min(distance * 0.3, 100); 

                let cp1x = startPoint.x;
                let cp1y = startPoint.y;
                let cp2x = endPoint.x;
                let cp2y = endPoint.y;

                // Horizontal bias for cleaner horizontal flow
                if (Math.abs(dx) > Math.abs(dy)) {
                    cp1x += dx * 0.5;
                    cp2x -= dx * 0.5;
                } else {
                    cp1y += dy * 0.5;
                    cp2y -= dy * 0.5;
                }

                const pathD = `M ${startPoint.x} ${startPoint.y} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${endPoint.x} ${endPoint.y}`;

                // 1. Track (Faint background line)
                const track = document.createElementNS("http://www.w3.org/2000/svg", "path");
                track.setAttribute("d", pathD);
                track.setAttribute("class", "path-track");
                svgLayer.appendChild(track);

                // 2. Active Flow Line
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", pathD);
                path.setAttribute("class", `path-active type-${conn.type}`);
                path.setAttribute("marker-end", markers[conn.type]);
                if(conn.thick) path.setAttribute("stroke-width", "4");
                svgLayer.appendChild(path);

                // 3. Label Logic
                // Calculate midpoint of Bezier curve
                const midX = (startPoint.x + cp1x + cp2x + endPoint.x) / 4;
                const midY = (startPoint.y + cp1y + cp2y + endPoint.y) / 4;

                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", midX);
                text.setAttribute("y", midY);
                text.setAttribute("class", "path-label");
                text.textContent = conn.label;

                // Create a background pill for the text using getBBox (requires appending first or estimating)
                // We'll append a group
                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.appendChild(text);
                svgLayer.appendChild(g);

                // Get bounding box of text
                const bbox = text.getBBox();
                
                // Create rect background
                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute("x", bbox.x - 4);
                rect.setAttribute("y", bbox.y - 2);
                rect.setAttribute("width", bbox.width + 8);
                rect.setAttribute("height", bbox.height + 4);
                rect.setAttribute("class", "path-label-bg");
                
                // Insert rect before text in the group
                g.insertBefore(rect, text);
            });
        }

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(drawConnections, 100);
        });

        // Initial Draw
        window.addEventListener('load', drawConnections);
        drawConnections(); // Fallback

    </script>
</body>
</html>
