<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Architecture & Information Flow</title>
    <style>
        :root {
            /* Palette - High Contrast & Distinctive */
            --bg-color: #09090b; /* Deepest Black/Grey */
            --surface-color: #18181b; /* Dark Card */
            --surface-border: #27272a;
            
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            
            /* Signal Colors - Neon & Distinct */
            --color-data: #0ea5e9;      /* Sky Blue */
            --color-instruction: #c084fc; /* Violet */
            --color-control: #4ade80;   /* Bright Green */
            --color-io: #facc15;        /* Yellow */

            /* Dimensions */
            --card-width: 180px;
            --cpu-width: 240px;
            --card-height: 120px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Background Grid Pattern */
        .bg-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--surface-border) 1px, transparent 1px),
                linear-gradient(90deg, var(--surface-border) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.2;
            z-index: 0;
            pointer-events: none;
        }

        /* Header & Legend */
        header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            background: rgba(9, 9, 11, 0.8);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--surface-border);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        .legend {
            display: flex;
            gap: 1.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
        }

        .legend-line {
            width: 20px;
            height: 3px;
            border-radius: 2px;
        }

        /* Main Diagram Area */
        main {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            z-index: 1;
        }

        /* SVG Layer */
        svg#connections-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Node Components */
        .node {
            position: absolute;
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            width: var(--card-width);
            height: var(--card-height);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
            z-index: 2;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .node:hover {
            transform: translateY(-2px) scale(1.02);
            border-color: var(--text-secondary);
            z-index: 3;
        }

        /* CPU Specific Styling (Dominant) */
        .node.cpu {
            width: var(--cpu-width);
            height: 160px;
            border: 1px solid var(--color-instruction);
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.15);
            background: linear-gradient(145deg, var(--surface-color), #1e1b2e);
        }

        .node-icon {
            width: 32px;
            height: 32px;
            margin-bottom: 0.75rem;
            stroke-width: 1.5;
        }

        .node-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .node-desc {
            font-size: 0.7rem;
            color: var(--text-secondary);
            line-height: 1.2;
        }

        /* Positioning (Centered Radial Layout) */
        /* Calculated based on a 1000x700 virtual grid, handled via % for responsiveness */
        #cpu     { top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #gpu     { top: 20%; left: 50%; transform: translate(-50%, -50%); }
        #ram     { top: 50%; left: 25%; transform: translate(-50%, -50%); }
        #storage { top: 80%; left: 50%; transform: translate(-50%, -50%); }
        #network { top: 50%; left: 75%; transform: translate(-50%, -50%); }
        #input   { top: 20%; left: 20%; transform: translate(-50%, -50%); }
        #output  { top: 80%; left: 80%; transform: translate(-50%, -50%); }

        /* SVG Animations */
        @keyframes dash-flow {
            to { stroke-dashoffset: -20; }
        }
        
        @keyframes dash-flow-reverse {
            to { stroke-dashoffset: 20; }
        }

        .path-track {
            fill: none;
            stroke: var(--surface-border);
            stroke-width: 2;
            opacity: 0.4;
        }

        .path-active {
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 8, 12; /* 20 total */
            animation: dash-flow 1s linear infinite;
        }

        /* Path Styling per Type */
        .type-data { stroke: var(--color-data); filter: drop-shadow(0 0 3px var(--color-data)); }
        .type-instruction { stroke: var(--color-instruction); filter: drop-shadow(0 0 3px var(--color-instruction)); stroke-dasharray: 2, 8; animation-duration: 0.5s; }
        .type-control { stroke: var(--color-control); filter: drop-shadow(0 0 3px var(--color-control)); stroke-dasharray: 4, 4; animation-duration: 0.8s; }
        .type-io { stroke: var(--color-io); filter: drop-shadow(0 0 3px var(--color-io)); stroke-dasharray: 12, 8; animation-duration: 1.2s; }

        /* Label on lines */
        .path-label {
            font-size: 10px;
            fill: var(--text-secondary);
            font-family: monospace;
            text-anchor: middle;
            background-color: var(--bg-color);
        }

    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <header>
        <div>
            <h1>System Architecture</h1>
            <div style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px; font-family: monospace;">INFO FLOW VISUALIZATION</div>
        </div>
        <div class="legend">
            <div class="legend-item">
                <div class="legend-line" style="background: var(--color-data);"></div> Data
            </div>
            <div class="legend-item">
                <div class="legend-line" style="background: var(--color-instruction);"></div> Instructions
            </div>
            <div class="legend-item">
                <div class="legend-line" style="background: var(--color-control);"></div> Control
            </div>
            <div class="legend-item">
                <div class="legend-line" style="background: var(--color-io);"></div> I/O Streams
            </div>
        </div>
    </header>

    <main id="diagram-area">
        <!-- SVG Layer -->
        <svg id="connections-layer" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="var(--text-secondary)" />
                </marker>
                <marker id="arrowhead-data" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="var(--color-data)" />
                </marker>
                <marker id="arrowhead-instr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="var(--color-instruction)" />
                </marker>
                <marker id="arrowhead-control" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="var(--color-control)" />
                </marker>
                <marker id="arrowhead-io" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="var(--color-io)" />
                </marker>
            </defs>
            <!-- Paths injected by JS -->
        </svg>

        <!-- Components -->
        <div id="input" class="node">
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.01"/><path d="M10 8h.01"/><path d="M14 8h.01"/><path d="M18 8h.01"/><path d="M6 12h.01"/><path d="M10 12h.01"/><path d="M14 12h.01"/><path d="M18 12h.01"/><path d="M6 16h12"/></svg>
            <div class="node-label">Input</div>
            <div class="node-desc">Peripherals</div>
        </div>

        <div id="gpu" class="node">
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/><path d="M9 1v3"/><path d="M15 1v3"/><path d="M9 20v3"/><path d="M15 20v3"/><path d="M20 9h3"/><path d="M20 14h3"/><path d="M1 9h3"/><path d="M1 14h3"/></svg>
            <div class="node-label">GPU</div>
            <div class="node-desc">Parallel Processing</div>
        </div>

        <div id="ram" class="node">
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 18v2"/><path d="M10 18v2"/><path d="M14 18v2"/><path d="M18 18v2"/><path d="M6 10h12"/></svg>
            <div class="node-label">Memory</div>
            <div class="node-desc">RAM / Cache</div>
        </div>

        <!-- CPU is central and larger -->
        <div id="cpu" class="node cpu">
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="var(--color-instruction)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></svg>
            <div class="node-label">CPU</div>
            <div class="node-desc">Control Unit / ALU</div>
        </div>

        <div id="network" class="node">
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
            <div class="node-label">Network</div>
            <div class="node-desc">External Bus</div>
        </div>

        <div id="storage" class="node">
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
            <div class="node-label">Storage</div>
            <div class="node-desc">NVMe SSD</div>
        </div>

        <div id="output" class="node">
            <svg class="node-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            <div class="node-label">Output</div>
            <div class="node-desc">Display / Audio</div>
        </div>

    </main>

    <script>
        const connectionsConfig = [
            { from: 'input', to: 'cpu', type: 'io', label: 'Events' },
            { from: 'network', to: 'cpu', type: 'data', label: 'Packets' },
            { from: 'cpu', to: 'network', type: 'data', label: 'Response' },
            { from: 'storage', to: 'ram', type: 'data', label: 'Load' },
            { from: 'ram', to: 'cpu', type: 'instruction', label: 'Fetch' },
            { from: 'cpu', to: 'ram', type: 'control', label: 'Write' },
            { from: 'cpu', to: 'gpu', type: 'data', label: 'Render' },
            { from: 'gpu', to: 'output', type: 'io', label: 'Pixels' },
            { from: 'cpu', to: 'storage', type: 'control', label: 'Persist' }
        ];

        const svgLayer = document.getElementById('connections-layer');
        
        // Marker mapping
        const markers = {
            'data': 'url(#arrowhead-data)',
            'instruction': 'url(#arrowhead-instr)',
            'control': 'url(#arrowhead-control)',
            'io': 'url(#arrowhead-io)'
        };

        function getCenter(element) {
            const rect = element.getBoundingClientRect();
            const mainRect = document.getElementById('diagram-area').getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2 - mainRect.left,
                y: rect.top + rect.height / 2 - mainRect.top,
                w: rect.width,
                h: rect.height
            };
        }

        // Calculate intersection of line and rectangle to stop at border
        function getEdgePoint(center, targetCenter) {
            const dx = targetCenter.x - center.x;
            const dy = targetCenter.y - center.y;
            const angle = Math.atan2(dy, dx);
            
            // Approximate box intersection logic
            const absCos = Math.abs(Math.cos(angle));
            const absSin = Math.abs(Math.sin(angle));
            
            // Determine if hitting vertical or horizontal side
            let x, y;
            if (center.w * absSin < center.h * absCos) {
                // Hit side
                const signX = Math.sign(Math.cos(angle));
                const halfW = center.w / 2;
                x = center.x + signX * halfW;
                y = center.y + Math.tan(angle) * signX * halfW;
            } else {
                // Hit top/bottom
                const signY = Math.sign(Math.sin(angle));
                const halfH = center.h / 2;
                y = center.y + signY * halfH;
                x = center.x + (1 / Math.tan(angle)) * signY * halfH;
            }
            return { x, y };
        }

        function drawConnections() {
            svgLayer.innerHTML = `
                <defs>
                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="var(--text-secondary)" />
                    </marker>
                    <marker id="arrowhead-data" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="var(--color-data)" />
                    </marker>
                    <marker id="arrowhead-instr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="var(--color-instruction)" />
                    </marker>
                    <marker id="arrowhead-control" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="var(--color-control)" />
                    </marker>
                    <marker id="arrowhead-io" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="var(--color-io)" />
                    </marker>
                </defs>
            `;

            connectionsConfig.forEach(conn => {
                const startEl = document.getElementById(conn.from);
                const endEl = document.getElementById(conn.to);
                
                if (!startEl || !endEl) return;

                const startC = getCenter(startEl);
                const endC = getCenter(endEl);

                // Get points on the edge of the boxes
                const startPoint = getEdgePoint(startC, endC);
                const endPoint = getEdgePoint(endC, startC);

                // Bezier Control Points for smooth curves
                // Distance based curvature
                const dx = endPoint.x - startPoint.x;
                const dy = endPoint.y - startPoint.y;
                const distance = Math.sqrt(dx*dx + dy*dy);
                const curvature = distance * 0.2; // 20% offset

                // Simple orthogonal-ish curve logic
                let cp1x = startPoint.x;
                let cp1y = startPoint.y;
                let cp2x = endPoint.x;
                let cp2y = endPoint.y;

                // If mostly horizontal
                if (Math.abs(dx) > Math.abs(dy)) {
                    cp1x += dx * 0.5;
                    cp2x -= dx * 0.5;
                } else {
                    cp1y += dy * 0.5;
                    cp2y -= dy * 0.5;
                }

                const pathD = `M ${startPoint.x} ${startPoint.y} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${endPoint.x} ${endPoint.y}`;

                // 1. Background Track
                const track = document.createElementNS("http://www.w3.org/2000/svg", "path");
                track.setAttribute("d", pathD);
                track.setAttribute("class", "path-track");
                svgLayer.appendChild(track);

                // 2. Active Flow Line
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", pathD);
                path.setAttribute("class", `path-active type-${conn.type}`);
                path.setAttribute("marker-end", markers[conn.type]);
                svgLayer.appendChild(path);

                // 3. Label (Optional, placed at midpoint)
                // Midpoint of bezier is roughly average of control points
                const midX = (startPoint.x + cp1x + cp2x + endPoint.x) / 4;
                const midY = (startPoint.y + cp1y + cp2y + endPoint.y) / 4;

                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", midX);
                text.setAttribute("y", midY - 5);
                text.setAttribute("class", "path-label");
                text.textContent = conn.label;
                svgLayer.appendChild(text);
            });
        }

        // Debounce resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(drawConnections, 100);
        });

        // Initial Draw
        window.addEventListener('load', drawConnections);
        // Draw immediately too in case load already fired
        drawConnections();

    </script>
</body>
</html>
