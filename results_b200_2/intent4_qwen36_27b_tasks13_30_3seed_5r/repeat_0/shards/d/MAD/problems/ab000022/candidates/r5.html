<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce & Dash - Adventure Awaits</title>
    <style>
        :root {
            /* Palette - High Saturation */
            --c-sky-top: #00C6FF;
            --c-sky-bot: #0072FF;
            --c-grass: #58CC02;
            --c-grass-dark: #388E05;
            --c-dirt: #E67E22;
            --c-dirt-dark: #D35400;
            --c-block: #F1C40F;
            --c-ui-bg: #FFFFFF;
            --c-text: #2C3E50;
            --c-accent: #FF3366;
            --c-shadow: rgba(0, 0, 0, 0.15);
            
            /* Typography */
            --font-main: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a1a;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-main);
            overflow: hidden;
            color: var(--c-text);
        }

        /* Game Container */
        #game-screen {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1920px;
            max-height: 1080px;
            background: linear-gradient(to bottom, var(--c-sky-top), var(--c-sky-bot));
            overflow: hidden;
            transition: background 0.6s ease;
        }

        /* --- PARALLAX BACKGROUND LAYERS --- */
        .scene-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        /* Layer 1: Clouds */
        .cloud-layer { z-index: 1; }
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50px;
            animation: floatCloud 40s linear infinite;
        }
        .cloud::after, .cloud::before {
            content: ''; position: absolute; background: inherit; border-radius: 50%;
        }
        .c1 { width: 120px; height: 40px; top: 15%; left: -150px; animation-duration: 30s; }
        .c1::after { width: 50px; height: 50px; top: -25px; left: 20px; }
        .c1::before { width: 40px; height: 40px; top: -15px; left: 60px; }
        
        .c2 { width: 180px; height: 60px; top: 25%; left: -200px; animation-duration: 45s; animation-delay: 10s; opacity: 0.7; }
        .c2::after { width: 90px; height: 90px; top: -45px; left: 35px; }
        
        .c3 { width: 100px; height: 30px; top: 10%; left: -120px; animation-duration: 25s; animation-delay: 5s; }

        /* Layer 2: Distant Mountains */
        .mountain-layer { z-index: 2; bottom: 0; top: auto; height: 60%; pointer-events: none; }
        .mountain {
            position: absolute;
            bottom: 0;
            width: 0; height: 0;
            border-left: 300px solid transparent;
            border-right: 300px solid transparent;
            border-bottom: 450px solid rgba(255, 255, 255, 0.3);
        }
        .m1 { left: -10%; border-bottom-color: rgba(255, 255, 255, 0.4); transform: scale(1.3); }
        .m2 { left: 30%; border-bottom-color: rgba(255, 255, 255, 0.5); transform: scale(1.5); z-index: -1; }
        .m3 { right: -15%; border-bottom-color: rgba(255, 255, 255, 0.4); transform: scale(1.4); }

        /* The Goal Castle on the horizon */
        .castle {
            position: absolute;
            right: 8%;
            bottom: 120px; 
            width: 80px;
            height: 100px;
            z-index: 2;
            opacity: 0.9;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.1));
        }
        .castle svg { width: 100%; height: 100%; }

        /* Layer 3: Mid-ground Hills */
        .hill-layer { z-index: 3; bottom: 0; top: auto; height: 30%; pointer-events: none; }
        .hill {
            position: absolute;
            bottom: -50px;
            width: 110%;
            height: 200px;
            background: var(--c-grass);
            border-radius: 50% 50% 0 0;
            transform: translateX(-10%);
            box-shadow: inset 0 10px 0 rgba(255,255,255,0.1);
        }
        .h1 { left: -10%; background: var(--c-grass-dark); height: 140px; z-index: 1; }
        .h2 { right: -10%; background: var(--c-grass); height: 180px; z-index: 2; }

        /* Layer 4: The Level (Canvas) */
        #level-canvas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* --- HERO --- */
        #hero-container {
            position: absolute;
            bottom: 110px; 
            left: 15%;
            z-index: 20;
            width: 120px;
            height: 120px;
            transition: left 0.1s linear;
            pointer-events: none;
        }
        .hero-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 10px 5px rgba(0,0,0,0.2));
            animation: heroBounce 2s ease-in-out infinite;
        }
        @keyframes heroBounce {
            0%, 100% { transform: translateY(0) scaleY(1); }
            50% { transform: translateY(-15px) scaleY(1.05); }
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 30;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            pointer-events: none;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        /* Left Column: Title + Controls */
        .left-col {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
            pointer-events: auto;
        }

        .game-title {
            font-size: 5.5rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            line-height: 0.85;
            -webkit-text-stroke: 2px #2c3e50;
            text-shadow: 6px 6px 0px var(--c-accent), 0px 15px 30px rgba(0,0,0,0.2);
            transform: skew(-3deg);
            margin-left: -5px;
        }
        .game-title span {
            display: block;
            font-size: 1.2rem;
            color: var(--c-block);
            -webkit-text-stroke: 1px #2c3e50;
            letter-spacing: 6px;
            margin-top: 5px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
            font-weight: 800;
        }

        /* --- UNIFIED GAME UI STYLE --- */
        .game-ui-panel {
            background: var(--c-ui-bg);
            border: 3px solid var(--c-text);
            border-radius: 12px;
            box-shadow: 6px 6px 0px var(--c-text);
            padding: 15px 25px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.2s;
        }

        /* Controls Panel */
        .controls-title {
            font-size: 0.7rem;
            font-weight: 900;
            color: #95a5a6;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .key-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--c-text);
        }
        .key {
            background: #f1f2f6;
            color: var(--c-text);
            padding: 4px 10px;
            border-radius: 6px;
            border: 2px solid #2c3e50;
            border-bottom: 4px solid #2c3e50;
            font-family: monospace;
            font-weight: 900;
            font-size: 0.8rem;
            min-width: 28px;
            text-align: center;
            box-shadow: 0 2px 0 rgba(0,0,0,0.1);
            transition: all 0.1s;
        }
        .key-press {
            transform: translateY(2px);
            border-bottom-width: 2px;
            background: #e1e1e6;
        }

        /* World Selector */
        .world-selector {
            pointer-events: auto;
            display: flex;
            gap: 15px;
            padding: 10px 20px;
            align-items: center;
            background: var(--c-ui-bg);
            border: 3px solid var(--c-text);
            border-radius: 50px; /* Pill shape */
            box-shadow: 6px 6px 0px var(--c-text);
        }
        .world-label {
            font-weight: 900;
            font-size: 0.8rem;
            color: var(--c-text);
            margin-right: 5px;
            text-transform: uppercase;
        }
        .world-btn {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 2px solid var(--c-text);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .world-btn:hover { transform: translateY(-3px); }
        .world-btn.active { 
            transform: scale(1.15); 
            border-color: var(--c-accent); 
            box-shadow: 0 0 0 2px var(--c-accent);
        }
        
        /* Patterns */
        .w-grass { background: linear-gradient(135deg, #7CFC00 50%, #8B4513 50%); }
        .w-ice { background: linear-gradient(135deg, #E0FFFF 50%, #87CEFA 50%); }
        .w-fire { background: linear-gradient(135deg, #FF4500 50%, #FFD700 50%); }

        /* HUD Counters (Top Right) */
        .hud-counters {
            position: absolute;
            top: 30px;
            right: 30px;
            display: flex;
            gap: 20px;
            pointer-events: none;
        }
        .hud-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--c-ui-bg);
            border: 3px solid var(--c-text);
            border-radius: 12px;
            padding: 5px 15px 5px 5px;
            box-shadow: 4px 4px 0px var(--c-text);
        }
        .hud-icon {
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
        }
        .hud-val {
            font-weight: 900;
            font-size: 1.4rem;
            font-family: monospace;
            color: var(--c-text);
        }

        /* --- START BUTTON (Center Stage) --- */
        .start-btn-wrapper {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            z-index: 40;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* Flat Vector Button */
        .start-btn {
            position: relative;
            width: 260px;
            height: 80px;
            background: var(--c-accent);
            border: 4px solid var(--c-text);
            border-radius: 40px;
            cursor: pointer;
            outline: none;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 10px 0 var(--c-text), 0 20px 20px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        /* Shine effect */
        .start-btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 40%;
            background: rgba(255,255,255,0.2);
            border-radius: 36px 36px 0 0;
        }

        .start-text {
            font-family: var(--font-main);
            font-weight: 900;
            font-size: 2rem;
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 2;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }

        .start-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 0 var(--c-text), 0 24px 25px rgba(0,0,0,0.2);
            background: #ff5282;
        }
        .start-btn:active {
            transform: translateY(10px);
            box-shadow: 0 0 0 var(--c-text), 0 0 5px rgba(0,0,0,0.2);
        }

        /* Animations */
        @keyframes floatCloud {
            0% { transform: translateX(-200px); }
            100% { transform: translateX(120vw); }
        }

    </style>
</head>
<body>

    <div id="game-screen">
        
        <!-- Layer 1: Clouds -->
        <div class="scene-layer cloud-layer">
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="cloud c3"></div>
        </div>

        <!-- Layer 2: Mountains & Castle -->
        <div class="scene-layer mountain-layer">
            <div class="mountain m1"></div>
            <div class="mountain m2"></div>
            <div class="mountain m3"></div>
            
            <!-- Goal Castle -->
            <div class="castle">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 100 L10 40 L20 30 L30 40 L30 20 L40 10 L50 20 L50 40 L80 40 L90 30 L100 40 L100 100 Z" fill="white" stroke="#2c3e50" stroke-width="2"/>
                    <rect x="40" y="70" width="20" height="30" fill="#2c3e50" rx="10" />
                    <rect x="15" y="40" width="10" height="15" fill="#2c3e50" />
                    <rect x="75" y="40" width="10" height="15" fill="#2c3e50" />
                </svg>
            </div>
        </div>

        <!-- Layer 3: Hills -->
        <div class="scene-layer hill-layer">
            <div class="hill h1"></div>
            <div class="hill h2"></div>
        </div>

        <!-- Layer 4: Level Preview (Canvas) -->
        <canvas id="level-canvas"></canvas>

        <!-- Hero Character -->
        <div id="hero-container">
            <svg class="hero-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Shadow -->
                <ellipse cx="50" cy="95" rx="25" ry="4" fill="rgba(0,0,0,0.2)" />
                <!-- Body -->
                <circle cx="50" cy="50" r="38" fill="#FF4757" stroke="#2c3e50" stroke-width="4" />
                <!-- Face Mask -->
                <ellipse cx="50" cy="55" rx="22" ry="14" fill="white" stroke="#2c3e50" stroke-width="3" />
                <!-- Eyes -->
                <circle cx="42" cy="52" r="4" fill="#2c3e50" />
                <circle cx="58" cy="52" r="4" fill="#2c3e50" />
                <!-- Mouth -->
                <path d="M45 62 Q 50 68 55 62" stroke="#2c3e50" stroke-width="3" fill="none" stroke-linecap="round" />
                <!-- Hat -->
                <path d="M20 25 L 50 5 L 80 25 Z" fill="#FFD700" stroke="#2c3e50" stroke-width="4" stroke-linejoin="round" />
                <!-- Legs -->
                <path d="M35 85 L 35 95 M 65 85 L 65 95" stroke="#2c3e50" stroke-width="6" stroke-linecap="round" />
            </svg>
        </div>

        <!-- UI Overlay -->
        <div class="ui-layer">
            
            <!-- Header -->
            <header>
                <!-- Left Column: Title + Controls -->
                <div class="left-col">
                    <div class="game-title">
                        Bounce <span style="color:var(--c-block)">Dash</span>
                        <span>Adventure Awaits</span>
                    </div>

                    <!-- Controls Guide (Moved Here) -->
                    <div class="game-ui-panel controls-guide">
                        <div class="controls-title">Controls</div>
                        <div class="key-row"><span class="key">←</span><span class="key">→</span> Move</div>
                        <div class="key-row"><span class="key">Spc</span> Jump</div>
                        <div class="key-row"><span class="key">Z</span> Attack</div>
                    </div>
                </div>

                <!-- World Selector (Top Right -> Center/Leftish or Top Center) -->
                <!-- Keeping it top right for balance against the title, but styled flat -->
                <div class="world-selector">
                    <span class="world-label">World</span>
                    <div class="world-btn w-grass active" title="Green Hills"></div>
                    <div class="world-btn w-ice" title="Ice Peaks"></div>
                    <div class="world-btn w-fire" title="Lava Lands"></div>
                </div>
            </header>

            <!-- HUD Counters (Top Corner) -->
            <div class="hud-counters">
                <div class="hud-item">
                    <div class="hud-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10" fill="#FFD700" stroke="#d4ac0d" stroke-width="2"/>
                            <text x="12" y="16" font-size="14" font-weight="bold" fill="#d4ac0d" text-anchor="middle">$</text>
                        </svg>
                    </div>
                    <div class="hud-val">42</div>
                </div>
                <div class="hud-item">
                    <div class="hud-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24">
                            <path d="M12 2L15 8L21 9L17 14L18 20L12 17L6 20L7 14L3 9L9 8L12 2Z" fill="#E74C3C" stroke="#c0392b" stroke-width="2"/>
                        </svg>
                    </div>
                    <div class="hud-val">x 3</div>
                </div>
            </div>

        </div>

        <!-- Start Button (Center Stage) -->
        <div class="start-btn-wrapper">
            <button class="start-btn">
                <span class="start-text">Start Adventure</span>
            </button>
        </div>

    </div>

    <script>
        // --- CANVAS LEVEL GENERATION ---
        const canvas = document.getElementById('level-canvas');
        const ctx = canvas.getContext('2d');

        // Resize handling
        function resize() {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
            drawLevel();
        }
        window.addEventListener('resize', resize);

        // State for colors
        let currentTheme = {
            grass: '#58CC02',
            grassDark: '#388E05',
            dirt: '#E67E22',
            dirtDark: '#D35400',
            block: '#8B4513',
            blockTop: '#58CC02'
        };

        // Helper: Draw Rounded Rect
        function roundRect(x, y, w, h, r, color, stroke) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            if(stroke) {
                ctx.strokeStyle = stroke;
                ctx.lineWidth = 3;
                ctx.stroke();
            }
        }

        // Helper: Draw Mystery Block
        function drawMysteryBlock(x, y, size) {
            const s = size;
            // Base
            ctx.fillStyle = '#FF8C00';
            ctx.fillRect(x, y, s, s);
            // Checkerboard pattern
            ctx.fillStyle = '#FFA500'; 
            ctx.fillRect(x, y, s/2, s/2);
            ctx.fillRect(x + s/2, y + s/2, s/2, s/2);
            // Border
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, s, s);
            // Question mark
            ctx.fillStyle = '#FFD700';
            ctx.font = `bold ${s*0.6}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('?', x + s/2, y + s/2 + 2);
            // Outline text
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 1;
            ctx.strokeText('?', x + s/2, y + s/2 + 2);
        }

        // Helper: Draw Pipe
        function drawPipe(x, y, w, h) {
            const headH = 40;
            // Pipe Body
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(x + 10, y + headH, w - 20, h - headH);
            // Pipe Head
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(x, y, w, headH);
            // Highlights (Flat style)
            ctx.fillStyle = '#58d68d';
            ctx.fillRect(x + 5, y, 8, headH); 
            ctx.fillRect(x + 15, y + headH, 4, h - headH);
            // Outlines
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, w, headH);
            ctx.strokeRect(x+10, y+headH, w-20, h-headH);
        }

        // Helper: Draw Flag
        function drawFlag(x, y, h) {
            // Pole
            ctx.fillStyle = '#7f8c8d';
            ctx.fillRect(x, y, 6, h);
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, 6, h);
            
            // Ball on top
            ctx.beginPath();
            ctx.arc(x+3, y, 6, 0, Math.PI*2);
            ctx.fillStyle = '#f1c40f';
            ctx.fill();
            ctx.strokeStyle = '#2c3e50';
            ctx.stroke();
            
            // Flag
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.moveTo(x+6, y+10);
            ctx.lineTo(x+60, y+30);
            ctx.lineTo(x+6, y+50);
            ctx.fill();
            ctx.stroke();
        }

        // Helper: Draw Enemy (Flat Style)
        function drawEnemy(x, y) {
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.beginPath();
            ctx.ellipse(x+20, y+35, 18, 5, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Body (Mushroom shape)
            ctx.fillStyle = '#8e44ad'; 
            ctx.beginPath();
            ctx.arc(x+20, y+15, 20, Math.PI, 0); // Top dome
            ctx.lineTo(x+40, y+35);
            ctx.lineTo(x, y+35);
            ctx.fill();
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // Eyes
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(x+12, y+20, 5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+28, y+20, 5, 0, Math.PI*2); ctx.fill();
            
            // Pupils
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(x+12, y+20, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+28, y+20, 2, 0, Math.PI*2); ctx.fill();
        }

        // Helper: Draw Coin
        function drawCoin(x, y) {
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.ellipse(x, y, 8, 12, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#d4ac0d';
            ctx.lineWidth = 2;
            ctx.stroke();
            // Shine
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.ellipse(x-2, y-4, 2, 4, -0.2, 0, Math.PI*2);
            ctx.fill();
        }

        // Helper: Draw Bush
        const drawBush = (x, y, scale) => {
            ctx.fillStyle = '#228B22';
            ctx.strokeStyle = '#1a6b1a';
            ctx.lineWidth = 2;
            
            ctx.beginPath();
            ctx.arc(x, y, 25 * scale, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(x + 20*scale, y, 35 * scale, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(x + 40*scale, y, 25 * scale, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
        }

        function drawLevel() {
            // Clear
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const groundY = canvas.height - 100;

            // 1. Draw Ground
            // Top Grass
            ctx.fillStyle = currentTheme.grass; 
            ctx.fillRect(0, groundY, canvas.width, 100);
            
            // Grass Shadow/Border
            ctx.fillStyle = currentTheme.grassDark;
            ctx.fillRect(0, groundY, canvas.width, 8);
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY); ctx.stroke();

            // Dirt Body
            ctx.fillStyle = currentTheme.dirt;
            ctx.fillRect(0, groundY + 12, canvas.width, 88);
            
            // Dirt details (Dots)
            ctx.fillStyle = currentTheme.dirtDark;
            for(let i=0; i<canvas.width; i+=60) {
                ctx.beginPath(); ctx.arc(i+30, groundY+50, 5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(i+10, groundY+80, 5, 0, Math.PI*2); ctx.fill();
            }

            // 2. Draw Platforms
            const pW = 60; const pH = 20;
            
            // Floating blocks
            drawMysteryBlock(canvas.width * 0.2, groundY - 120, 50);
            
            // Row of blocks
            for(let i=0; i<3; i++) {
                roundRect(canvas.width * 0.4 + (i*65), groundY - 120, pW, pH, 4, currentTheme.block, '#2c3e50');
                // Grass on top
                ctx.fillStyle = currentTheme.blockTop;
                ctx.fillRect(canvas.width * 0.4 + (i*65), groundY - 120, pW, 6);
                ctx.strokeStyle = '#2c3e50';
                ctx.strokeRect(canvas.width * 0.4 + (i*65), groundY - 120, pW, 6);
            }

            // High platform
            roundRect(canvas.width * 0.7, groundY - 200, 150, pH, 4, currentTheme.block, '#2c3e50');
            ctx.fillStyle = currentTheme.blockTop;
            ctx.fillRect(canvas.width * 0.7, groundY - 200, 150, 6);

            // 3. Draw Pipe
            drawPipe(canvas.width * 0.6, groundY - 60, 60, 60);

            // 4. Draw Flag (Goal)
            drawFlag(canvas.width * 0.85, groundY - 250, 250);

            // 5. Draw Coins
            drawCoin(canvas.width * 0.2 + 25, groundY - 160);
            drawCoin(canvas.width * 0.7 + 30, groundY - 240);
            drawCoin(canvas.width * 0.7 + 60, groundY - 240);
            drawCoin(canvas.width * 0.7 + 90, groundY - 240);

            // 6. Draw Enemy
            drawEnemy(canvas.width * 0.5, groundY - 35);

            // 7. Draw Bushes (Foreground Decor)
            drawBush(canvas.width * 0.15, groundY, 1);
            drawBush(canvas.width * 0.75, groundY, 0.8);
        }

        // Initial draw
        resize();

        // --- INTERACTIVITY ---
        
        // Hero movement simulation on hover
        const hero = document.getElementById('hero-container');
        const screen = document.getElementById('game-screen');

        screen.addEventListener('mousemove', (e) => {
            const rect = screen.getBoundingClientRect();
            const x = e.clientX - rect.left;
            // Map mouse X to a percentage, but clamp it
            let percent = (x / rect.width) * 100;
            // Keep hero mostly in the left/middle area
            if(percent > 40) percent = 40;
            if(percent < 10) percent = 10;
            
            hero.style.left = percent + '%';
        });

        // World Selector Logic
        const worlds = document.querySelectorAll('.world-btn');
        const root = document.documentElement;
        
        const themes = {
            'w-grass': { 
                sky: ['#00C6FF', '#0072FF'], 
                ground: '#58CC02', 
                dirt: '#E67E22',
                dirtDark: '#D35400',
                block: '#8B4513',
                blockTop: '#58CC02'
            },
            'w-ice': { 
                sky: ['#83a4d4', '#b6fbff'], 
                ground: '#E0FFFF', 
                dirt: '#A9A9A9',
                dirtDark: '#778899',
                block: '#708090',
                blockTop: '#E0FFFF'
            },
            'w-fire': { 
                sky: ['#ff9966', '#ff5e62'], 
                ground: '#555555', 
                dirt: '#333333',
                dirtDark: '#1a1a1a',
                block: '#2c3e50',
                blockTop: '#555555'
            }
        };

        worlds.forEach(btn => {
            btn.addEventListener('click', () => {
                // Remove active class
                worlds.forEach(w => w.classList.remove('active'));
                btn.classList.add('active');

                // Change Theme
                const theme = themes[btn.classList[1]];
                root.style.setProperty('--c-sky-top', theme.sky[0]);
                root.style.setProperty('--c-sky-bot', theme.sky[1]);
                
                // Update Canvas Theme
                currentTheme.grass = theme.ground;
                currentTheme.grassDark = theme.ground === '#58CC02' ? '#388E05' : theme.dirt; // Fallback logic
                currentTheme.dirt = theme.dirt;
                currentTheme.dirtDark = theme.dirtDark;
                currentTheme.block = theme.block;
                currentTheme.blockTop = theme.blockTop;
                
                drawLevel();
            });
        });

        // Key press effect
        document.addEventListener('keydown', (e) => {
            const keyEl = document.querySelector(`.key:contains("${e.key === ' ' ? 'Spc' : e.key.toUpperCase()}")`);
            if(keyEl) {
                keyEl.classList.add('key-press');
                setTimeout(() => keyEl.classList.remove('key-press'), 150);
            }
        });

    </script>
</body>
</html>
