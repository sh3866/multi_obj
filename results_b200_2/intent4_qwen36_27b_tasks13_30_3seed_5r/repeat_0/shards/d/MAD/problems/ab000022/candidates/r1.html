<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce & Dash - Adventure Awaits</title>
    <style>
        :root {
            /* Palette */
            --c-sky-top: #4FACFE;
            --c-sky-bot: #00F2FE;
            --c-grass-top: #7CFC00;
            --c-grass-bot: #32CD32;
            --c-dirt: #8B4513;
            --c-dirt-dark: #5D2906;
            --c-block: #FF8C00;
            --c-accent: #FFD700;
            --c-hero: #FF4757;
            --c-hero-dark: #C41E3A;
            --c-ui-glass: rgba(20, 20, 30, 0.6);
            --c-ui-border: rgba(255, 255, 255, 0.2);
            
            /* Typography */
            --font-main: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #111;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-main);
            overflow: hidden;
            color: white;
        }

        /* Game Container */
        #game-screen {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1920px;
            max-height: 1080px;
            background: linear-gradient(to bottom, var(--c-sky-top), var(--c-sky-bot));
            overflow: hidden;
            box-shadow: 0 0 100px rgba(0,0,0,0.5);
            transition: background 0.5s ease;
        }

        /* --- PARALLAX BACKGROUND LAYERS --- */
        .scene-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        /* Layer 1: Clouds (Slowest) */
        .cloud-layer { z-index: 1; }
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50px;
            animation: floatCloud 40s linear infinite;
            filter: blur(2px);
        }
        .cloud::after, .cloud::before {
            content: ''; position: absolute; background: inherit; border-radius: 50%;
        }
        .c1 { width: 120px; height: 40px; top: 15%; left: -150px; animation-duration: 35s; }
        .c1::after { width: 50px; height: 50px; top: -25px; left: 20px; }
        .c1::before { width: 40px; height: 40px; top: -15px; left: 60px; }
        .c2 { width: 180px; height: 60px; top: 25%; left: -200px; animation-duration: 45s; animation-delay: 10s; opacity: 0.5; }
        .c2::after { width: 80px; height: 80px; top: -40px; left: 30px; }
        .c3 { width: 100px; height: 35px; top: 10%; left: -120px; animation-duration: 25s; animation-delay: 5s; }

        /* Layer 2: Distant Mountains (Mid) */
        .mountain-layer { z-index: 2; bottom: 0; top: auto; height: 60%; background: transparent; }
        .mountain {
            position: absolute;
            bottom: 0;
            width: 0; height: 0;
            border-left: 200px solid transparent;
            border-right: 200px solid transparent;
            border-bottom: 350px solid #A0E6FF; /* Light blue */
            opacity: 0.6;
            filter: blur(3px);
        }
        .m1 { left: -5%; border-bottom-color: #87CEEB; transform: scale(1.2); }
        .m2 { left: 20%; border-bottom-color: #A0E6FF; transform: scale(1.5); z-index: -1; }
        .m3 { right: -10%; border-bottom-color: #87CEEB; transform: scale(1.3); }

        /* Layer 3: Mid-ground Hills (Faster) */
        .hill-layer { z-index: 3; bottom: 0; top: auto; height: 40%; }
        .hill {
            position: absolute;
            bottom: 0;
            width: 120%;
            height: 200px;
            background: #7CFC00;
            border-radius: 50% 50% 0 0;
            transform: translateX(-10%);
            box-shadow: inset 0 10px 20px rgba(255,255,255,0.2);
        }
        .h1 { left: -10%; background: #65a300; height: 150px; z-index: 1; }
        .h2 { right: -10%; background: #7CFC00; height: 180px; z-index: 2; }

        /* Layer 4: The Level (Canvas) */
        #level-canvas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* --- HERO --- */
        #hero-container {
            position: absolute;
            bottom: 120px; /* Aligned to ground plane */
            left: 20%;     /* Center-left foreground */
            z-index: 20;
            width: 100px;
            height: 100px;
            transition: transform 0.1s linear;
            cursor: pointer;
        }
        /* Hero SVG Styling */
        .hero-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.3));
            animation: heroBounce 2s ease-in-out infinite;
        }
        @keyframes heroBounce {
            0%, 100% { transform: translateY(0) scaleY(1); }
            50% { transform: translateY(-15px) scaleY(1.05); }
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 30;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            pointer-events: none; /* Allow clicks to pass to canvas/interactive elements */
        }

        /* Header: Title & World Select */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .game-title {
            font-size: 5rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            line-height: 0.9;
            /* Drop shadow for pop */
            text-shadow: 
                5px 5px 0px var(--c-hero),
                10px 10px 0px rgba(0,0,0,0.2);
            transform: skew(-5deg);
        }
        .game-title span {
            display: block;
            font-size: 1.5rem;
            color: var(--c-accent);
            text-shadow: 2px 2px 0px #000;
            letter-spacing: 5px;
            margin-top: 5px;
        }

        /* World Selector (Top Right) */
        .world-selector {
            pointer-events: auto;
            background: var(--c-ui-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--c-ui-border);
            padding: 8px;
            border-radius: 50px;
            display: flex;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .world-btn {
            width: 45px; height: 45px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.5);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .world-btn:hover { transform: translateY(-2px); border-color: white; }
        .world-btn.active { border-color: var(--c-accent); transform: scale(1.1); box-shadow: 0 0 15px var(--c-accent); }
        
        /* CSS Patterns for worlds */
        .w-grass { background: linear-gradient(135deg, #7CFC00 50%, #8B4513 50%); }
        .w-ice { background: linear-gradient(135deg, #E0FFFF 50%, #87CEFA 50%); }
        .w-fire { background: linear-gradient(135deg, #FF4500 50%, #FFD700 50%); }

        /* Bottom Area: Start Button & Glass Panel */
        .bottom-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            margin-bottom: 20px;
        }

        /* Start Button (Lower Middle) */
        .start-btn-wrapper {
            position: absolute;
            bottom: 80px; /* Lifted slightly from bottom */
            left: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            z-index: 40;
        }
        .start-btn {
            background: var(--c-hero);
            color: white;
            border: none;
            padding: 18px 60px;
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 15px; /* Rounded Rectangle */
            cursor: pointer;
            /* Flat style with depth */
            box-shadow: 
                0 8px 0 var(--c-hero-dark),
                0 15px 20px rgba(0,0,0,0.3);
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
        }
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 0 var(--c-hero-dark), 0 20px 30px rgba(0,0,0,0.4);
            filter: brightness(1.1);
        }
        .start-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 var(--c-hero-dark), 0 5px 10px rgba(0,0,0,0.3);
        }

        /* Unified UI Panel (Bottom Right) */
        .ui-panel {
            pointer-events: auto;
            background: var(--c-ui-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--c-ui-border);
            border-radius: 20px;
            padding: 20px;
            width: 280px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Stats Section */
        .stats-group {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stat-label { font-size: 0.7rem; opacity: 0.7; letter-spacing: 1px; margin-bottom: 2px; }
        .stat-value { font-size: 1.2rem; font-weight: 700; }
        .icon-coin { color: var(--c-accent); }

        /* Controls Section */
        .controls-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .key-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
        }
        .key {
            background: rgba(255,255,255,0.9);
            color: #333;
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: 700;
            box-shadow: 0 2px 0 #999;
            font-size: 0.75rem;
            min-width: 24px;
            text-align: center;
        }

        /* Animations */
        @keyframes floatCloud {
            0% { transform: translateX(-200px); }
            100% { transform: translateX(120vw); }
        }
        @keyframes shine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }

    </style>
</head>
<body>

    <div id="game-screen">
        
        <!-- Layer 1: Clouds -->
        <div class="scene-layer cloud-layer">
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="cloud c3"></div>
        </div>

        <!-- Layer 2: Mountains -->
        <div class="scene-layer mountain-layer">
            <div class="mountain m1"></div>
            <div class="mountain m2"></div>
            <div class="mountain m3"></div>
        </div>

        <!-- Layer 3: Hills -->
        <div class="scene-layer hill-layer">
            <div class="hill h1"></div>
            <div class="hill h2"></div>
        </div>

        <!-- Layer 4: Level Preview (Canvas) -->
        <canvas id="level-canvas"></canvas>

        <!-- Hero Character -->
        <div id="hero-container">
            <svg class="hero-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Shadow -->
                <ellipse cx="50" cy="95" rx="30" ry="5" fill="rgba(0,0,0,0.3)" />
                <!-- Body -->
                <circle cx="50" cy="50" r="40" fill="#FF4757" stroke="#C41E3A" stroke-width="3" />
                <!-- Shine -->
                <path d="M25 35 Q 50 15 75 35" stroke="rgba(255,255,255,0.4)" stroke-width="5" fill="none" stroke-linecap="round" />
                <!-- Face -->
                <g class="face">
                    <ellipse cx="50" cy="60" rx="18" ry="10" fill="white" opacity="0.95" />
                    <!-- Eyes -->
                    <circle cx="42" cy="55" r="5" fill="black" class="eye" />
                    <circle cx="58" cy="55" r="5" fill="black" class="eye" />
                    <!-- Mouth -->
                    <path d="M42 65 Q 50 72 58 65" stroke="black" stroke-width="3" fill="none" stroke-linecap="round" />
                </g>
                <!-- Hat -->
                <path d="M25 25 L 50 5 L 75 25 Z" fill="#FFD700" stroke="#E67E22" stroke-width="3" stroke-linejoin="round" />
                <!-- Legs -->
                <path d="M35 85 L 35 95 M 65 85 L 65 95" stroke="#C41E3A" stroke-width="6" stroke-linecap="round" />
            </svg>
        </div>

        <!-- UI Overlay -->
        <div class="ui-layer">
            
            <!-- Header -->
            <header>
                <div class="game-title">
                    Bounce <span style="color:var(--c-accent)">Dash</span>
                    <span>Adventure Awaits</span>
                </div>

                <!-- World Selector -->
                <div class="world-selector">
                    <div class="world-btn w-grass active" title="Green Hills"></div>
                    <div class="world-btn w-ice" title="Ice Peaks"></div>
                    <div class="world-btn w-fire" title="Lava Lands"></div>
                </div>
            </header>

            <!-- Bottom Area -->
            <div class="bottom-area">
                <!-- Left side empty for balance or could hold a logo -->
                <div></div> 

                <!-- Right side: Unified Panel -->
                <div class="ui-panel">
                    <!-- Stats -->
                    <div class="stats-group">
                        <div class="stat-item">
                            <span class="stat-label">COINS</span>
                            <span class="stat-value"><span class="icon-coin">●</span> 042</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">SCORE</span>
                            <span class="stat-value">12,500</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">LIVES</span>
                            <span class="stat-value" style="color:#FF4757">♥ 3</span>
                        </div>
                    </div>
                    <!-- Controls -->
                    <div class="controls-group">
                        <div class="key-row"><span class="key">←</span><span class="key">→</span> Move</div>
                        <div class="key-row"><span class="key">SPC</span> Jump</div>
                        <div class="key-row"><span class="key">Z</span> Attack</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Start Button (Absolute positioned lower-middle) -->
        <div class="start-btn-wrapper">
            <button class="start-btn">Start Adventure</button>
        </div>

    </div>

    <script>
        // --- CANVAS LEVEL GENERATION ---
        const canvas = document.getElementById('level-canvas');
        const ctx = canvas.getContext('2d');

        // Resize handling
        function resize() {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
            drawLevel();
        }
        window.addEventListener('resize', resize);

        // Helper: Draw Rounded Rect
        function roundRect(x, y, w, h, r, color, stroke) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            if(stroke) {
                ctx.strokeStyle = stroke;
                ctx.lineWidth = 4;
                ctx.stroke();
            }
        }

        // Helper: Draw Checkerboard Block
        function drawMysteryBlock(x, y, size) {
            const s = size;
            // Base
            ctx.fillStyle = '#FF8C00';
            ctx.fillRect(x, y, s, s);
            // Checkerboard pattern
            ctx.fillStyle = '#FFA500'; // Lighter orange
            ctx.fillRect(x, y, s/2, s/2);
            ctx.fillRect(x + s/2, y + s/2, s/2, s/2);
            // Border
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 4;
            ctx.strokeRect(x, y, s, s);
            // Question mark
            ctx.fillStyle = '#FFD700';
            ctx.font = `bold ${s*0.6}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('?', x + s/2, y + s/2 + 2);
        }

        // Helper: Draw Pipe
        function drawPipe(x, y, w, h) {
            const headH = 40;
            // Pipe Body
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(x + 10, y + headH, w - 20, h - headH);
            // Pipe Head
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(x, y, w, headH);
            // Highlights
            ctx.fillStyle = '#58d68d';
            ctx.fillRect(x + 5, y, 10, headH); // Head shine
            ctx.fillRect(x + 15, y + headH, 5, h - headH); // Body shine
            // Outlines
            ctx.strokeStyle = '#1e8449';
            ctx.lineWidth = 4;
            ctx.strokeRect(x, y, w, headH);
            ctx.strokeRect(x+10, y+headH, w-20, h-headH);
        }

        // Helper: Draw Flag
        function drawFlag(x, y, h) {
            // Pole
            ctx.fillStyle = '#7f8c8d';
            ctx.fillRect(x, y, 8, h);
            // Ball on top
            ctx.beginPath();
            ctx.arc(x+4, y, 8, 0, Math.PI*2);
            ctx.fillStyle = '#f1c40f';
            ctx.fill();
            ctx.strokeStyle = '#d35400';
            ctx.stroke();
            // Flag
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.moveTo(x+8, y+10);
            ctx.lineTo(x+70, y+35);
            ctx.lineTo(x+8, y+60);
            ctx.fill();
        }

        // Helper: Draw Enemy
        function drawEnemy(x, y) {
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(x+20, y+35, 20, 6, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Body (Mushroom shape)
            ctx.fillStyle = '#8e44ad'; // Purple enemy
            ctx.beginPath();
            ctx.arc(x+20, y+15, 22, Math.PI, 0); // Top dome
            ctx.lineTo(x+42, y+35);
            ctx.lineTo(x, y+35);
            ctx.fill();
            ctx.strokeStyle = '#4a235a';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // Eyes
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(x+12, y+20, 6, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+28, y+20, 6, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(x+12, y+20, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+28, y+20, 2, 0, Math.PI*2); ctx.fill();
        }

        // Helper: Draw Coin
        function drawCoin(x, y) {
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.ellipse(x, y, 10, 14, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#DAA520';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.ellipse(x-3, y-3, 3, 5, 0, 0, Math.PI*2);
            ctx.fill();
        }

        // Helper: Draw Bush
        const drawBush = (x, y, scale) => {
            ctx.fillStyle = '#228B22';
            ctx.beginPath();
            ctx.arc(x, y, 30 * scale, 0, Math.PI * 2);
            ctx.arc(x + 25*scale, y, 40 * scale, 0, Math.PI * 2);
            ctx.arc(x + 50*scale, y, 30 * scale, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawLevel() {
            // Clear
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const groundY = canvas.height - 100;

            // 1. Draw Ground
            // Top Grass
            ctx.fillStyle = '#7CFC00'; 
            ctx.fillRect(0, groundY, canvas.width, 100);
            
            // Grass Shadow
            ctx.fillStyle = '#65a300'; 
            ctx.fillRect(0, groundY, canvas.width, 10);

            // Dirt Body
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, groundY + 15, canvas.width, 85);
            
            // Dirt details
            ctx.fillStyle = '#5D2906';
            for(let i=0; i<canvas.width; i+=50) {
                ctx.beginPath(); ctx.arc(i+25, groundY+50, 4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(i+5, groundY+80, 4, 0, Math.PI*2); ctx.fill();
            }

            // 2. Draw Platforms
            const pW = 60; const pH = 20;
            
            // Floating blocks
            drawMysteryBlock(canvas.width * 0.2, groundY - 120, 50);
            
            // Row of blocks
            for(let i=0; i<3; i++) {
                roundRect(canvas.width * 0.4 + (i*65), groundY - 120, pW, pH, 4, '#8B4513', '#5D2906');
                // Grass on top
                ctx.fillStyle = '#7CFC00';
                ctx.fillRect(canvas.width * 0.4 + (i*65), groundY - 120, pW, 6);
            }

            // High platform
            roundRect(canvas.width * 0.7, groundY - 200, 150, pH, 4, '#8B4513', '#5D2906');
            ctx.fillStyle = '#7CFC00';
            ctx.fillRect(canvas.width * 0.7, groundY - 200, 150, 6);

            // 3. Draw Pipe
            drawPipe(canvas.width * 0.6, groundY - 60, 60, 60);

            // 4. Draw Flag (Goal)
            drawFlag(canvas.width * 0.85, groundY - 250, 250);

            // 5. Draw Coins
            drawCoin(canvas.width * 0.2 + 25, groundY - 160);
            drawCoin(canvas.width * 0.7 + 30, groundY - 240);
            drawCoin(canvas.width * 0.7 + 60, groundY - 240);
            drawCoin(canvas.width * 0.7 + 90, groundY - 240);

            // 6. Draw Enemy
            drawEnemy(canvas.width * 0.5, groundY - 35);

            // 7. Draw Bushes (Foreground Decor)
            drawBush(canvas.width * 0.15, groundY, 1);
            drawBush(canvas.width * 0.75, groundY, 0.8);
        }

        // Initial draw
        resize();

        // --- INTERACTIVITY ---
        
        // Hero movement simulation on hover
        const hero = document.getElementById('hero-container');
        const screen = document.getElementById('game-screen');

        screen.addEventListener('mousemove', (e) => {
            const rect = screen.getBoundingClientRect();
            const x = e.clientX - rect.left;
            // Map mouse X to a percentage, but clamp it
            let percent = (x / rect.width) * 100;
            // Keep hero mostly in the left/middle area
            if(percent > 40) percent = 40;
            if(percent < 10) percent = 10;
            
            hero.style.left = percent + '%';
        });

        // World Selector Logic
        const worlds = document.querySelectorAll('.world-btn');
        const root = document.documentElement;
        
        const themes = {
            'w-grass': { sky: ['#4FACFE', '#00F2FE'], ground: '#7CFC00', dirt: '#8B4513' },
            'w-ice': { sky: ['#83a4d4', '#b6fbff'], ground: '#E0FFFF', dirt: '#A9A9A9' },
            'w-fire': { sky: ['#ff9966', '#ff5e62'], ground: '#555555', dirt: '#333333' }
        };

        worlds.forEach(btn => {
            btn.addEventListener('click', () => {
                // Remove active class
                worlds.forEach(w => w.classList.remove('active'));
                btn.classList.add('active');

                // Change Theme
                const theme = themes[btn.classList[1]];
                root.style.setProperty('--c-sky-top', theme.sky[0]);
                root.style.setProperty('--c-sky-bot', theme.sky[1]);
                root.style.setProperty('--c-grass-top', theme.ground);
                root.style.setProperty('--c-dirt', theme.dirt);
                
                // Redraw canvas to update ground colors
                drawLevel();
            });
        });

    </script>
</body>
</html>
