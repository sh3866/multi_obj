<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social & Party Interface - Tactical Revision</title>
    <style>
        :root {
            /* Palette: Tactical Dark */
            --bg-app: #090a0f;
            --bg-panel: #131620;
            --bg-card: #1c202e;
            --bg-card-hover: #252a3d;
            --bg-input: #0f1219;
            
            /* Accents */
            --accent-primary: #00e5ff; /* Cyan/Holographic */
            --accent-primary-dim: rgba(0, 229, 255, 0.15);
            --accent-secondary: #ffaa00; /* Amber */
            --accent-danger: #ff4757;
            --accent-success: #2ed573;
            
            /* Text */
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --text-dark: #5a667d;
            
            /* Borders */
            --border-subtle: #2a3040;
            --border-highlight: rgba(255, 255, 255, 0.08);
            
            /* Typography */
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            /* Geometry */
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-round: 50%;
            
            /* Effects */
            --shadow-glow: 0 0 20px rgba(0, 229, 255, 0.2);
            --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.4);
            --ease-elastic: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Main Layout --- */
        .app-container {
            width: 1280px;
            height: 800px;
            background: var(--bg-panel);
            border-radius: var(--radius-lg);
            box-shadow: 0 0 0 1px var(--border-subtle), 0 20px 60px rgba(0,0,0,0.8);
            display: grid;
            grid-template-columns: 320px 1fr 340px; /* Sidebar | Stage | Detail */
            grid-template-rows: 72px 1fr; /* Header | Content */
            overflow: hidden;
            position: relative;
        }

        /* --- 1. Player Profile Header (Critique #1) --- */
        .app-header {
            grid-column: 1 / -1;
            background: rgba(19, 22, 32, 0.95);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            backdrop-filter: blur(8px);
            z-index: 100;
        }

        .brand {
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .brand-logo {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, var(--accent-primary), #0099ff);
            border-radius: 8px;
            display: grid; place-items: center;
            box-shadow: 0 0 10px var(--accent-primary-dim);
        }

        .header-nav {
            display: flex;
            gap: 4px;
            background: var(--bg-input);
            padding: 4px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
        }

        .nav-tab {
            padding: 8px 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-tab.active {
            background: var(--bg-card);
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .current-user {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-card);
            padding: 6px 12px 6px 6px;
            border-radius: 50px;
            border: 1px solid var(--border-subtle);
            transition: border-color 0.2s;
        }
        .current-user:hover { border-color: var(--accent-primary); }

        .user-avatar-sm {
            width: 40px; height: 40px;
            border-radius: var(--radius-round);
            border: 2px solid var(--accent-primary);
            position: relative;
        }
        .user-avatar-sm::after {
            content: ''; position: absolute; bottom: 0; right: 0;
            width: 12px; height: 12px;
            background: var(--accent-success);
            border: 2px solid var(--bg-card);
            border-radius: var(--radius-round);
        }

        .user-info { display: flex; flex-direction: column; padding-right: 8px; }
        .user-name { font-size: 14px; font-weight: 700; color: var(--text-main); }
        .user-rank { font-size: 11px; color: var(--accent-secondary); font-weight: 600; letter-spacing: 0.5px; }

        /* --- 2. Left Sidebar (Friends) --- */
        .sidebar {
            background: var(--bg-panel);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        /* Controls */
        .sidebar-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .search-box {
            flex: 1;
            position: relative;
        }
        .search-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            padding: 10px 12px 10px 36px;
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 13px;
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: var(--accent-primary); }
        .search-icon {
            position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); width: 16px; height: 16px;
        }
        .btn-add {
            width: 42px; height: 42px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--accent-primary);
            display: grid; place-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-add:hover { background: var(--accent-primary); color: #000; box-shadow: 0 0 15px var(--accent-primary-dim); }

        /* 4. Pending Requests (Critique #4 - High Priority) */
        .requests-section {
            margin-bottom: 20px;
        }
        .section-header {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 10px;
            letter-spacing: 1px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .req-card {
            background: rgba(255, 71, 87, 0.05); /* Red tint */
            border: 1px solid rgba(255, 71, 87, 0.2);
            border-radius: var(--radius-md);
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: slideIn 0.3s ease;
        }
        .req-info { display: flex; gap: 10px; align-items: center; }
        .req-avatar { width: 36px; height: 36px; border-radius: var(--radius-round); border: 1px solid var(--border-subtle); }
        .req-text h4 { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
        .req-text p { font-size: 11px; color: var(--text-muted); }
        .req-actions { display: flex; gap: 6px; }
        .btn-icon {
            width: 28px; height: 28px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            display: grid; place-items: center;
        }
        .btn-accept { background: var(--accent-success); color: #000; }
        .btn-decline { background: rgba(255,255,255,0.1); color: var(--text-muted); }
        .btn-decline:hover { background: var(--accent-danger); color: #fff; }

        /* Friends List */
        .friends-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }
        .friends-list::-webkit-scrollbar { width: 4px; }
        .friends-list::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }

        .friend-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
            border: 1px solid transparent;
            position: relative;
        }
        .friend-item:hover { background: var(--bg-card); }
        
        /* Active State with Visual Link (Critique #2) */
        .friend-item.active {
            background: var(--bg-card-hover);
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.05);
        }
        .friend-item.active::before {
            content: '';
            position: absolute;
            left: 0; top: 50%; transform: translateY(-50%);
            width: 3px; height: 20px;
            background: var(--accent-primary);
            border-radius: 0 4px 4px 0;
        }

        .avatar-wrap { position: relative; margin-right: 12px; flex-shrink: 0; }
        .avatar { width: 44px; height: 44px; border-radius: var(--radius-round); object-fit: cover; }
        .status-dot {
            position: absolute; bottom: 1px; right: 1px;
            width: 12px; height: 12px;
            border-radius: var(--radius-round);
            border: 2px solid var(--bg-panel);
        }
        .s-online { background: var(--accent-success); box-shadow: 0 0 5px var(--accent-success); }
        .s-ingame { background: var(--accent-primary); box-shadow: 0 0 5px var(--accent-primary); }
        .s-offline { background: var(--text-dark); }

        .friend-meta { flex: 1; min-width: 0; }
        .friend-name { font-size: 14px; font-weight: 600; color: var(--text-main); margin-bottom: 2px; }
        .friend-status { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- 3. Center Panel: Battle Squad (Critique #3) --- */
        .main-stage {
            background: var(--bg-app);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Tactical Texture (Critique #6) */
        .tactical-bg {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.5;
            mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
            pointer-events: none;
        }
        
        /* Holographic Glow Center */
        .stage-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 600px; height: 600px;
            background: radial-gradient(circle, var(--accent-primary-dim) 0%, transparent 70%);
            opacity: 0.4;
            pointer-events: none;
            filter: blur(40px);
        }

        .stage-content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }

        .squad-title {
            font-size: 24px; font-weight: 800; color: var(--text-main);
            letter-spacing: -0.5px; margin-bottom: 4px;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }
        .squad-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 40px; }

        /* Orbit Visualization */
        .orbit-container {
            position: relative;
            width: 360px; height: 360px;
            margin-bottom: 40px;
            display: flex; justify-content: center; align-items: center;
        }

        .orbit-ring {
            position: absolute;
            border: 1px dashed var(--border-subtle);
            border-radius: var(--radius-round);
            animation: spin 60s linear infinite;
        }
        .orbit-ring.r1 { width: 100%; height: 100%; }
        .orbit-ring.r2 { width: 60%; height: 60%; animation-direction: reverse; animation-duration: 40s; }
        .orbit-ring.r3 { width: 30%; height: 30%; border-style: solid; border-color: var(--border-highlight); }

        .leader-slot {
            width: 90px; height: 90px;
            border-radius: var(--radius-round);
            border: 3px solid var(--accent-primary);
            box-shadow: 0 0 20px var(--accent-primary-dim);
            z-index: 5;
            position: relative;
            background: #000;
        }

        .member-slot {
            position: absolute;
            width: 60px; height: 60px;
            border-radius: var(--radius-round);
            border: 2px solid var(--border-subtle);
            background: #000;
            z-index: 4;
            transition: transform 0.3s var(--ease-elastic);
        }
        .member-slot:hover { transform: scale(1.15); border-color: var(--text-main); z-index: 6; }

        /* Positioning Members */
        .member-slot:nth-child(4) { top: 0; left: 50%; transform: translate(-50%, -50%); }
        .member-slot:nth-child(5) { bottom: 10%; right: 0; }
        .member-slot:nth-child(6) { bottom: 10%; left: 0; }
        
        .empty-slot {
            position: absolute;
            width: 60px; height: 60px;
            border: 2px dashed var(--text-dark);
            border-radius: var(--radius-round);
            top: 50%; right: -10px; transform: translateY(-50%);
            display: grid; place-items: center;
            color: var(--text-dark);
            font-size: 24px;
            animation: pulse 2s infinite;
        }

        /* Action Bar (Critique #3) */
        .action-bar {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .btn {
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            border: none;
            display: flex; align-items: center; gap: 8px;
            transition: all 0.2s;
            font-family: var(--font-stack);
        }

        .btn-sec {
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
        }
        .btn-sec:hover { background: var(--bg-card-hover); color: var(--text-main); border-color: var(--text-muted); }

        .btn-primary {
            background: var(--accent-primary);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
            min-width: 160px;
            justify-content: center;
        }
        /* Tactile Finish (Critique #6) */
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 229, 255, 0.5);
            filter: brightness(1.1);
        }

        /* --- 5. Right Panel: Detail (Critique #2) --- */
        .detail-panel {
            background: var(--bg-panel);
            border-left: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Visual Link Line (Critique #2) */
        .detail-panel::before {
            content: '';
            position: absolute;
            left: -1px; top: 20%; bottom: 20%;
            width: 1px;
            background: linear-gradient(to bottom, transparent, var(--accent-primary), transparent);
            opacity: 0.5;
        }

        .profile-header {
            padding: 30px 24px;
            text-align: center;
            background: linear-gradient(to bottom, rgba(0, 229, 255, 0.05), transparent);
        }

        .detail-avatar {
            width: 100px; height: 100px;
            border-radius: var(--radius-round);
            border: 3px solid var(--bg-card);
            outline: 2px solid var(--accent-primary);
            margin-bottom: 16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .detail-name { font-size: 20px; font-weight: 800; color: var(--text-main); margin-bottom: 4px; }
        .detail-tag { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
        
        .rank-badge {
            display: inline-block;
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #1a1a1a;
            font-weight: 800;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            box-shadow: 0 2px 10px rgba(251, 191, 36, 0.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: var(--border-subtle);
            margin: 0 24px 24px 24px;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-subtle);
        }
        .stat-box {
            background: var(--bg-card);
            padding: 16px 12px;
            text-align: center;
        }
        .stat-val { font-size: 18px; font-weight: 700; color: var(--text-main); }
        .stat-lbl { font-size: 10px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; margin-top: 4px; }

        .activity-box {
            margin: 0 24px 24px 24px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 16px;
        }
        .act-label { font-size: 10px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 6px; }
        .act-text { font-size: 13px; color: var(--text-main); font-style: italic; line-height: 1.4; }

        .detail-actions {
            margin-top: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Animation */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <div class="app-container">
        <!-- 1. Header -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-logo">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/></svg>
                </div>
                <span>Nexus</span>
            </div>

            <nav class="header-nav">
                <div class="nav-tab active">Social</div>
                <div class="nav-tab">Guild</div>
                <div class="nav-tab">Shop</div>
            </nav>

            <div class="current-user">
                <div class="user-info">
                    <div class="user-name">Commander_X</div>
                    <div class="user-rank">Diamond I</div>
                </div>
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231c202e'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='%2300e5ff' font-family='sans-serif'%3EX%3C/text%3E%3C/svg%3E" class="user-avatar-sm">
            </div>
        </header>

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-controls">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" class="search-input" placeholder="Search...">
                </div>
                <button class="btn-add" title="Add Friend">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                </button>
            </div>

            <!-- 4. Pending Requests -->
            <div class="requests-section">
                <div class="section-header">
                    <span>Requests</span>
                    <span style="color:var(--accent-danger)">1</span>
                </div>
                <div class="req-card">
                    <div class="req-info">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23333'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='%23ff4757'%3E?%3C/text%3E%3C/svg%3E" class="req-avatar">
                        <div class="req-text">
                            <h4>TankMaster</h4>
                            <p>2h ago</p>
                        </div>
                    </div>
                    <div class="req-actions">
                        <button class="btn-icon btn-accept"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg></button>
                        <button class="btn-icon btn-decline"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
                    </div>
                </div>
            </div>

            <div class="section-header"><span>Online — 3</span></div>
            
            <div class="friends-list">
                <!-- 2. Active Item (Visual Link) -->
                <div class="friend-item active" onclick="selectFriend(this, 'Viper')">
                    <div class="avatar-wrap">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%232ed573'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E" class="avatar">
                        <div class="status-dot s-ingame"></div>
                    </div>
                    <div class="friend-meta">
                        <div class="friend-name">Viper</div>
                        <div class="friend-status">In Game: Arena</div>
                    </div>
                </div>

                <div class="friend-item" onclick="selectFriend(this, 'Nova')">
                    <div class="avatar-wrap">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ffaa00'/%3E%3Ccircle cx='50' cy='50' r='20' fill='white'/%3E%3C/svg%3E" class="avatar">
                        <div class="status-dot s-online"></div>
                    </div>
                    <div class="friend-meta">
                        <div class="friend-name">Nova</div>
                        <div class="friend-status">In Lobby</div>
                    </div>
                </div>

                <div class="friend-item" onclick="selectFriend(this, 'Kael')">
                    <div class="avatar-wrap">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%238b5cf6'/%3E%3Cpath d='M30,30 L70,70 M70,30 L30,70' stroke='white' stroke-width='8'/%3E%3C/svg%3E" class="avatar">
                        <div class="status-dot s-online"></div>
                    </div>
                    <div class="friend-meta">
                        <div class="friend-name">Kael</div>
                        <div class="friend-status">AFK</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 3. Center Stage -->
        <main class="main-stage">
            <div class="tactical-bg"></div>
            <div class="stage-glow"></div>

            <div class="stage-content">
                <div class="squad-title">Battle Squad</div>
                <div class="squad-subtitle">Level 1-100 • 3/5 Members</div>

                <div class="orbit-container">
                    <div class="orbit-ring r1"></div>
                    <div class="orbit-ring r2"></div>
                    <div class="orbit-ring r3"></div>

                    <!-- Leader -->
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231c202e'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='%2300e5ff' font-family='sans-serif'%3EX%3C/text%3E%3C/svg%3E" class="leader-slot">

                    <!-- Members -->
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%232ed573'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E" class="member-slot">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ffaa00'/%3E%3Ccircle cx='50' cy='50' r='20' fill='white'/%3E%3C/svg%3E" class="member-slot">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%238b5cf6'/%3E%3Cpath d='M30,30 L70,70 M70,30 L30,70' stroke='white' stroke-width='8'/%3E%3C/svg%3E" class="member-slot">

                    <div class="empty-slot">+</div>
                </div>

                <!-- Action Bar -->
                <div class="action-bar">
                    <button class="btn btn-sec">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                        Invite
                    </button>
                    
                    <button class="btn btn-primary">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        Start Match
                    </button>
                </div>
            </div>
        </main>

        <!-- 5. Detail Panel -->
        <aside class="detail-panel">
            <div class="profile-header">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%232ed573'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E" class="detail-avatar" id="d-avatar">
                <div class="detail-name" id="d-name">Viper</div>
                <div class="detail-tag" id="d-tag">#8492 • <span style="color:var(--accent-primary)">In Game</span></div>
                <div class="rank-badge" id="d-rank">Platinum II</div>
            </div>

            <div class="activity-box">
                <div class="act-label">Recent Activity</div>
                <div class="act-text" id="d-act">"GGs everyone! That clutch was insane."</div>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-val" id="d-wins">1.4k</div>
                    <div class="stat-lbl">Wins</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="d-mmr">2,450</div>
                    <div class="stat-lbl">MMR</div>
                </div>
            </div>

            <div class="detail-actions">
                <button class="btn btn-sec" style="width:100%; justify-content:center;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    Whisper
                </button>
                
                <!-- 2. Battle Button (Visible) -->
                <button class="btn btn-primary" style="width:100%; justify-content:center; background: var(--accent-secondary); box-shadow: 0 4px 15px rgba(255, 170, 0, 0.3);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"></path><path d="M13 19l6-6"></path><path d="M16 16l4 4"></path><path d="M19 21l2-2"></path></svg>
                    Battle
                </button>
            </div>
        </aside>
    </div>

    <script>
        const friends = {
            'Viper': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%232ed573'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E",
                name: "Viper", tag: "#8492 • <span style='color:var(--accent-primary)'>In Game</span>", rank: "Platinum II",
                wins: "1.4k", mmr: "2,450", act: "\"GGs everyone! That clutch was insane.\""
            },
            'Nova': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ffaa00'/%3E%3Ccircle cx='50' cy='50' r='20' fill='white'/%3E%3C/svg%3E",
                name: "Nova", tag: "#1102 • <span style='color:var(--accent-success)'>Online</span>", rank: "Gold I",
                wins: "320", mmr: "1,800", act: "\"Looking for a duo for ranked tonight.\""
            },
            'Kael': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%238b5cf6'/%3E%3Cpath d='M30,30 L70,70 M70,30 L30,70' stroke='white' stroke-width='8'/%3E%3C/svg%3E",
                name: "Kael", tag: "#9921 • <span style='color:var(--accent-secondary)'>AFK</span>", rank: "Bronze III",
                wins: "45", mmr: "900", act: "\"Going to grab some food, brb.\""
            }
        };

        function selectFriend(el, name) {
            document.querySelectorAll('.friend-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            
            const data = friends[name];
            const panel = document.querySelector('.detail-panel');
            
            // Simple fade transition
            panel.style.opacity = '0.5';
            panel.style.transform = 'translateX(10px)';
            panel.style.transition = 'all 0.2s';

            setTimeout(() => {
                document.getElementById('d-avatar').src = data.img;
                document.getElementById('d-name').textContent = data.name;
                document.getElementById('d-tag').innerHTML = data.tag;
                document.getElementById('d-rank').textContent = data.rank;
                document.getElementById('d-wins').textContent = data.wins;
                document.getElementById('d-mmr').textContent = data.mmr;
                document.getElementById('d-act').textContent = data.act;

                panel.style.opacity = '1';
                panel.style.transform = 'translateX(0)';
            }, 200);
        }
    </script>
</body>
</html>
