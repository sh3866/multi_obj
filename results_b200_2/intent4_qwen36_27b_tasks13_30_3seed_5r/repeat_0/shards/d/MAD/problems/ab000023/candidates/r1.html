<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Scene: The Emblem</title>
<style>
  :root {
    --bg-color: #e0e0e0;
    --sign-face: #ffffff;
    --brand-red: #E50914;
    --text-main: #1a1a1a;
    --text-muted: #7a7a7a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-color);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    /* Perspective setup */
    perspective: 1000px;
  }

  /* Ambient Background Lighting */
  .ambient-light {
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 50% 30%, #ffffff 0%, #dcdcdc 40%, #c4c4c4 100%);
    z-index: -1;
  }

  /* UI Overlay */
  .ui-layer {
    position: absolute;
    top: 60px;
    left: 60px;
    z-index: 10;
    pointer-events: none;
  }

  h1 {
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-main);
    margin-bottom: 8px;
  }

  p.subtitle {
    font-size: 12px;
    color: var(--text-muted);
    max-width: 280px;
    line-height: 1.5;
  }

  /* The 3D Scene Container */
  .scene {
    position: relative;
    width: 400px;
    height: 400px;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
    /* Initial 3D Angle */
    transform: rotateX(12deg) rotateY(-15deg);
    transition: transform 0.1s ease-out;
  }

  /* The Physical Sign Block */
  .sign-block {
    position: relative;
    width: 320px;
    height: 320px;
    transform-style: preserve-3d;
  }

  /* --- 3D Geometry Faces --- */
  
  /* Front Face (The Sign) */
  .face.front {
    position: absolute;
    width: 100%;
    height: 100%;
    background: var(--sign-face);
    transform: translateZ(25px); /* Half of thickness */
    /* Subtle inner shadow for edge definition */
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
  }

  /* Right Face (Thickness) */
  .face.right {
    position: absolute;
    width: 50px; /* Thickness depth */
    height: 100%;
    /* Linear gradient to simulate lighting on the side */
    background: linear-gradient(to right, #e6e6e6, #d1d1d1);
    /* Rotate 90deg right, translate to align with right edge */
    transform: rotateY(90deg) translateZ(145px); /* 145 = (320/2) - (50/2) */
    right: -25px; /* Visual adjustment */
  }

  /* Top Face (Thickness) */
  .face.top {
    position: absolute;
    width: 100%;
    height: 50px;
    /* Lighter gradient for top surface catching light */
    background: linear-gradient(to bottom, #f5f5f5, #e0e0e0);
    /* Rotate 90deg up, translate to align with top edge */
    transform: rotateX(90deg) translateZ(145px);
    top: -25px;
  }

  /* --- Mounting Hardware --- */
  /* Matte, subtle screws */
  .mount {
    position: absolute;
    width: 14px;
    height: 14px;
    background: #e0e0e0;
    border-radius: 50%;
    /* Slightly raised above the face */
    transform: translateZ(26px);
    /* Inner shadow to simulate the screw head recess */
    box-shadow: inset 1px 1px 2px rgba(0,0,0,0.2);
  }
  
  .mount::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 6px; height: 6px;
    background: #c0c0c0; /* Darker center */
    border-radius: 50%;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.5); /* Subtle highlight */
  }

  /* Positioning mounts */
  .mount.tl { top: 24px; left: 24px; }
  .mount.tr { top: 24px; right: 24px; }
  .mount.bl { bottom: 24px; left: 24px; }
  .mount.br { bottom: 24px; right: 24px; }

  /* --- The Hero Emblem --- */
  .emblem-container {
    position: absolute;
    top: 50%; left: 50%;
    /* Floating slightly above the surface */
    transform: translate(-50%, -50%) translateZ(27px); 
    width: 160px;
    height: 160px;
    pointer-events: none;
  }

  svg.emblem {
    width: 100%;
    height: 100%;
    overflow: visible;
    /* Soft drop shadow specifically for the emblem */
    filter: drop-shadow(0 15px 15px rgba(229, 9, 20, 0.3));
  }

  .bg-circle {
    fill: var(--brand-red);
  }
  
  .play-triangle {
    fill: #ffffff;
    /* Using vector-effect to ensure crisp scaling */
    vector-effect: non-scaling-stroke;
  }

  /* --- Ground Shadow --- */
  .floor-shadow {
    position: absolute;
    width: 300px;
    height: 100px;
    /* Soft radial gradient */
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 70%);
    bottom: -200px; /* Offset below the sign */
    /* Rotate to lay flat on the "floor" */
    transform: rotateX(90deg) translateZ(20px);
    filter: blur(15px);
    opacity: 0.6;
  }

  /* --- Product Info Footer --- */
  .info-strip {
    position: absolute;
    bottom: 60px;
    display: flex;
    gap: 60px;
    z-index: 10;
  }
  
  .info-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  
  .info-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    font-weight: 600;
  }
  
  .info-value {
    font-size: 18px;
    font-weight: 500;
    color: var(--text-main);
    letter-spacing: -0.5px;
  }

  /* --- Animation --- */
  @keyframes popIn {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8) translateZ(27px); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1) translateZ(27px); }
  }
  
  .emblem-container {
    animation: popIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

</style>
</head>
<body>

  <div class="ambient-light"></div>

  <div class="ui-layer">
    <h1>Studio Emblem</h1>
    <p class="subtitle">High-contrast geometric signage.<br>Pristine white finish with chromatic red.</p>
  </div>

  <div class="scene">
    <div class="sign-block">
      
      <!-- 3D Geometry Faces -->
      <div class="face front"></div>
      <div class="face right"></div>
      <div class="face top"></div>

      <!-- Mounting Hardware (Matte Screws) -->
      <div class="mount tl"></div>
      <div class="mount tr"></div>
      <div class="mount bl"></div>
      <div class="mount br"></div>

      <!-- The Graphic Emblem -->
      <div class="emblem-container">
        <svg class="emblem" viewBox="0 0 100 100">
          <!-- Vibrant Red Circle -->
          <circle class="bg-circle" cx="50" cy="50" r="48" />
          
          <!-- Perfectly Centered Equilateral Play Triangle -->
          <!-- Calculated to be geometrically centered and dominant -->
          <path class="play-triangle" d="M 36 26 L 76 50 L 36 74 Z" />
        </svg>
      </div>

      <!-- Soft Studio Shadow -->
      <div class="floor-shadow"></div>
    </div>
  </div>

  <div class="info-strip">
    <div class="info-item">
      <span class="info-label">Material</span>
      <span class="info-value">Alabaster Matte</span>
    </div>
    <div class="info-item">
      <span class="info-label">Dimension</span>
      <span class="info-value">320 x 320mm</span>
    </div>
    <div class="info-item">
      <span class="info-label">Finish</span>
      <span class="info-value">Soft Touch</span>
    </div>
  </div>

  <script>
    // Smooth parallax effect for the 3D scene
    const scene = document.querySelector('.scene');
    const body = document.body;

    body.addEventListener('mousemove', (e) => {
      const x = (window.innerWidth / 2 - e.pageX) / 35;
      const y = (window.innerHeight / 2 - e.pageY) / 35;

      // Clamp values to keep rotation subtle and elegant
      const clampX = Math.max(-20, Math.min(20, x));
      const clampY = Math.max(-20, Math.min(20, y));

      // Apply rotation
      scene.style.transform = `rotateX(${12 + clampY}deg) rotateY(${-15 + clampX}deg)`;
    });

    // Reset on mouse leave
    body.addEventListener('mouseleave', () => {
      scene.style.transform = `rotateX(12deg) rotateY(-15deg)`;
    });
  </script>
</body>
</html>
