<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Scene: The Emblem</title>
<style>
  :root {
    /* Palette */
    --bg-wall: #e8e8e8;
    --bg-floor: #dcdcdc;
    --bg-floor-dark: #cfcfcf;
    --sign-face: #ffffff;
    --sign-edge: #f0f0f0;
    --sign-shadow: #d4d4d4;
    --brand-red: #E50914;
    --text-main: #1a1a1a;
    --text-muted: #888888;
    --screw-steel: #c0c0c0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-wall);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    perspective: 1200px; /* Deep perspective for realistic scale */
  }

  /* --- Studio Context (Background) --- */
  .studio-bg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: -1;
    overflow: hidden;
  }

  /* Wall */
  .wall {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 60%;
    background: linear-gradient(to bottom, #f2f2f2, #e0e0e0);
    transform-origin: top;
    transform: rotateX(2deg);
  }

  /* Floor */
  .floor {
    position: absolute;
    bottom: 0; left: 0; width: 100%; height: 50%;
    background: linear-gradient(to bottom, #dcdcdc, #c4c4c4);
    transform-origin: bottom;
    transform: rotateX(-5deg);
  }

  /* Corner Line to ground the scene */
  .floor::after {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 1px;
    background: rgba(0,0,0,0.05);
    box-shadow: 0 10px 20px rgba(0,0,0,0.05);
  }

  /* --- UI Overlay --- */
  .ui-layer {
    position: absolute;
    top: 60px;
    left: 80px;
    z-index: 10;
    pointer-events: none;
  }

  h1 {
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-main);
    margin-bottom: 12px;
  }

  p.subtitle {
    font-size: 13px;
    color: var(--text-muted);
    max-width: 260px;
    line-height: 1.6;
  }

  /* --- The 3D Scene Container --- */
  .scene {
    position: relative;
    width: 400px;
    height: 400px;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
    /* Initial 3D Angle */
    transform: rotateX(10deg) rotateY(-20deg);
    transition: transform 0.1s ease-out;
  }

  /* The Physical Sign Block */
  .sign-block {
    position: relative;
    width: 340px;
    height: 340px;
    transform-style: preserve-3d;
  }

  /* --- 3D Geometry Faces --- */
  
  /* Front Face (The Sign) */
  .face.front {
    position: absolute;
    width: 100%;
    height: 100%;
    background: var(--sign-face);
    transform: translateZ(15px); /* 15mm Thickness */
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02);
  }

  /* Right Face (Thickness - Shadowed) */
  .face.right {
    position: absolute;
    width: 30px; /* Visual thickness */
    height: 100%;
    /* Gradient simulates shadow on the right edge */
    background: linear-gradient(to right, var(--sign-edge), var(--sign-shadow));
    transform: rotateY(90deg) translateZ(155px); /* Center + half width - half thickness */
    right: -15px;
  }

  /* Top Face (Thickness - Lighted) */
  .face.top {
    position: absolute;
    width: 100%;
    height: 30px;
    /* Lighter gradient for top surface catching light */
    background: linear-gradient(to bottom, #ffffff, #f4f4f4);
    transform: rotateX(90deg) translateZ(155px);
    top: -15px;
  }

  /* --- Mounting Hardware (Standardized Screws) --- */
  .mount {
    position: absolute;
    width: 12px;
    height: 12px;
    background: radial-gradient(circle at 30% 30%, #e0e0e0, #b0b0b0);
    border-radius: 50%;
    transform: translateZ(16px); /* Just above surface */
    box-shadow: 1px 1px 2px rgba(0,0,0,0.15);
  }
  
  /* Screw Head Detail */
  .mount::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 6px; height: 1.5px;
    background: #888;
    box-shadow: 0 0 1px rgba(255,255,255,0.5);
  }

  /* Positioning mounts */
  .mount.tl { top: 25px; left: 25px; }
  .mount.tr { top: 25px; right: 25px; }
  .mount.bl { bottom: 25px; left: 25px; }
  .mount.br { bottom: 25px; right: 25px; }

  /* --- The Hero Emblem --- */
  .emblem-container {
    position: absolute;
    top: 50%; left: 50%;
    /* Floating slightly above the surface */
    transform: translate(-50%, -50%) translateZ(17px); 
    width: 180px;
    height: 180px;
    pointer-events: none;
  }

  svg.emblem {
    width: 100%;
    height: 100%;
    overflow: visible;
    /* Directional shadow: Top-Left Light -> Bottom-Right Shadow */
    filter: drop-shadow(4px 6px 6px rgba(0,0,0,0.15));
  }

  .bg-circle {
    fill: var(--brand-red);
  }
  
  .play-triangle {
    fill: #ffffff;
    vector-effect: non-scaling-stroke;
  }

  /* --- Ground Shadow --- */
  .floor-shadow {
    position: absolute;
    width: 340px;
    height: 340px;
    /* Directional shadow offset */
    transform: rotateX(90deg) translateZ(50px) translate(30px, 30px);
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0) 70%);
    filter: blur(20px);
    opacity: 0.7;
    pointer-events: none;
  }

  /* --- Product Info Footer (Grid Layout) --- */
  .info-strip {
    position: absolute;
    bottom: 80px;
    display: flex;
    gap: 80px;
    z-index: 10;
    border-top: 1px solid rgba(0,0,0,0.1);
    padding-top: 20px;
  }
  
  .info-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 100px;
  }
  
  .info-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
    font-weight: 600;
  }
  
  .info-value {
    font-size: 16px;
    font-weight: 700; /* Bolder for hierarchy */
    color: var(--text-main);
    letter-spacing: -0.5px;
  }

  /* --- Animation --- */
  @keyframes popIn {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8) translateZ(17px); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1) translateZ(17px); }
  }
  
  .emblem-container {
    animation: popIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

</style>
</head>
<body>

  <div class="studio-bg">
    <div class="wall"></div>
    <div class="floor"></div>
  </div>

  <div class="ui-layer">
    <h1>Studio Emblem</h1>
    <p class="subtitle">High-contrast geometric signage.<br>Pristine white finish with chromatic red.</p>
  </div>

  <div class="scene">
    <div class="sign-block">
      
      <!-- 3D Geometry Faces -->
      <div class="face front"></div>
      <div class="face right"></div>
      <div class="face top"></div>

      <!-- Mounting Hardware (Matte Screws) -->
      <div class="mount tl"></div>
      <div class="mount tr"></div>
      <div class="mount bl"></div>
      <div class="mount br"></div>

      <!-- The Graphic Emblem -->
      <div class="emblem-container">
        <svg class="emblem" viewBox="0 0 100 100">
          <!-- Vibrant Red Circle -->
          <circle class="bg-circle" cx="50" cy="50" r="48" />
          
          <!-- Perfectly Centered Equilateral Play Triangle -->
          <!-- Adjusted path for perfect visual centering -->
          <path class="play-triangle" d="M 38 28 L 78 50 L 38 72 Z" />
        </svg>
      </div>

      <!-- Soft Studio Shadow -->
      <div class="floor-shadow"></div>
    </div>
  </div>

  <div class="info-strip">
    <div class="info-item">
      <span class="info-label">Material</span>
      <span class="info-value">Alabaster Matte</span>
    </div>
    <div class="info-item">
      <span class="info-label">Dimension</span>
      <span class="info-value">340 x 340mm</span>
    </div>
    <div class="info-item">
      <span class="info-label">Finish</span>
      <span class="info-value">Soft Touch</span>
    </div>
  </div>

  <script>
    // Smooth parallax effect for the 3D scene
    const scene = document.querySelector('.scene');
    const body = document.body;

    body.addEventListener('mousemove', (e) => {
      const x = (window.innerWidth / 2 - e.pageX) / 40;
      const y = (window.innerHeight / 2 - e.pageY) / 40;

      // Clamp values to keep rotation subtle and elegant
      const clampX = Math.max(-25, Math.min(25, x));
      const clampY = Math.max(-25, Math.min(25, y));

      // Apply rotation
      // Base rotation is rotateX(10) rotateY(-20)
      scene.style.transform = `rotateX(${10 + clampY}deg) rotateY(${-20 + clampX}deg)`;
    });

    // Reset on mouse leave
    body.addEventListener('mouseleave', () => {
      scene.style.transform = `rotateX(10deg) rotateY(-20deg)`;
    });
  </script>
</body>
</html>
