<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Visualization: Physical Signage</title>
<style>
  :root {
    /* Studio Environment Colors */
    --bg-wall-top: #F0F2F5;
    --bg-wall-bot: #E0E2E8;
    --bg-floor: #D1D5DB;
    
    /* Material Colors */
    --sign-face-light: #FFFFFF;
    --sign-face-dark: #F4F6F8; /* Alabaster Matte gradient end */
    --sign-edge: #9CA3AF;
    --brand-red: #E50914;
    --metal-light: #FFFFFF;
    --metal-dark: #6B7280;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: linear-gradient(to bottom, var(--bg-wall-top) 0%, var(--bg-wall-bot) 60%, var(--bg-floor) 60%);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    perspective: 1200px; /* Deep perspective for realism */
  }

  /* --- Studio Floor Line --- */
  .floor-line {
    position: absolute;
    top: 60%;
    left: 0;
    width: 100%;
    height: 1px;
    background: rgba(0,0,0,0.08);
    box-shadow: 0 1px 0 rgba(255,255,255,0.4);
    z-index: 0;
  }

  /* --- 3D Scene Container --- */
  .scene {
    position: relative;
    width: 400px;
    height: 400px;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
    /* Initial Angle */
    transform: rotateX(15deg) rotateY(-20deg);
    transition: transform 0.1s ease-out;
    z-index: 10;
  }

  /* The Physical Sign Block */
  .sign-block {
    position: relative;
    width: 340px;
    height: 340px;
    transform-style: preserve-3d;
  }

  /* --- 3D Geometry Faces --- */

  /* Front Face */
  .face.front {
    position: absolute;
    width: 100%;
    height: 100%;
    /* Alabaster Matte Material */
    background: linear-gradient(135deg, var(--sign-face-light) 0%, var(--sign-face-dark) 100%);
    transform: translateZ(12px); /* Half of 24px depth */
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05); /* Subtle edge definition */
    border-radius: 2px; /* Micro bevel */
  }

  /* Right Face (Thickness) */
  .face.right {
    position: absolute;
    width: 24px;
    height: 100%;
    background: linear-gradient(to right, #b0b5bd, #8a9099);
    transform: rotateY(90deg) translateZ(170px); /* Width/2 */
    right: -12px;
    border-radius: 0 2px 2px 0;
  }

  /* Top Face (Thickness) */
  .face.top {
    position: absolute;
    width: 100%;
    height: 24px;
    background: linear-gradient(to bottom, #e5e7eb, #d1d5db);
    transform: rotateX(90deg) translateZ(170px); /* Height/2 */
    top: -12px;
    border-radius: 2px 2px 0 0;
  }

  /* --- Mounting Hardware (Screws) --- */
  .screw {
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    transform: translateZ(12.5px); /* Just above front face */
    /* Metallic Bevel */
    background: radial-gradient(circle at 30% 30%, var(--metal-light), var(--metal-dark) 80%);
    box-shadow: 
      1px 1px 2px rgba(0,0,0,0.4), /* Drop shadow */
      inset 0 0 2px rgba(0,0,0,0.5); /* Inner depth */
  }

  /* Screw Head Detail (Slot) */
  .screw::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(45deg);
    width: 10px; height: 2px;
    background: #4b5563;
    box-shadow: inset 0 1px 0 rgba(0,0,0,0.5);
  }

  /* Positioning */
  .screw.tl { top: 24px; left: 24px; }
  .screw.tr { top: 24px; right: 24px; }
  .screw.bl { bottom: 24px; left: 24px; }
  .screw.br { bottom: 24px; right: 24px; }

  /* --- The Hero Emblem --- */
  .emblem-container {
    position: absolute;
    top: 50%; left: 50%;
    /* Floating slightly above the surface */
    transform: translate(-50%, -50%) translateZ(16px); 
    width: 180px;
    height: 180px;
    pointer-events: none;
    /* Soft shadow lifting it off the white surface */
    filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.15));
    animation: floatIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  svg.emblem {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .bg-circle {
    fill: var(--brand-red);
  }
  
  .play-triangle {
    fill: #ffffff;
  }

  /* --- Ground Shadow --- */
  .floor-shadow {
    position: absolute;
    width: 340px;
    height: 340px;
    /* Directional shadow offset */
    transform: rotateX(90deg) translateZ(20px) translate(20px, 20px);
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0) 70%);
    filter: blur(12px);
    opacity: 0.8;
    pointer-events: none;
    z-index: -1;
  }

  /* --- Animation --- */
  @keyframes floatIn {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.95) translateZ(16px); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1) translateZ(16px); }
  }

</style>
</head>
<body>

  <div class="floor-line"></div>

  <div class="scene" id="scene">
    <div class="sign-block">
      
      <!-- 3D Geometry Faces -->
      <div class="face front"></div>
      <div class="face right"></div>
      <div class="face top"></div>

      <!-- Mounting Hardware (Metallic Screws) -->
      <div class="screw tl"></div>
      <div class="screw tr"></div>
      <div class="screw bl"></div>
      <div class="screw br"></div>

      <!-- The Graphic Emblem -->
      <div class="emblem-container">
        <svg class="emblem" viewBox="0 0 100 100">
          <!-- Vibrant Red Circle -->
          <circle class="bg-circle" cx="50" cy="50" r="46" />
          
          <!-- Perfectly Centered Equilateral Play Triangle -->
          <!-- Centered mathematically for visual balance -->
          <path class="play-triangle" d="M 38 28 L 78 50 L 38 72 Z" />
        </svg>
      </div>

      <!-- Soft Studio Shadow -->
      <div class="floor-shadow"></div>
    </div>
  </div>

  <script>
    // Smooth parallax effect for the 3D scene
    const scene = document.getElementById('scene');
    const body = document.body;

    // Mouse move handler
    body.addEventListener('mousemove', (e) => {
      // Calculate mouse position relative to center
      const x = (window.innerWidth / 2 - e.pageX) / 40; // Sensitivity X
      const y = (window.innerHeight / 2 - e.pageY) / 40; // Sensitivity Y

      // Clamp values to keep rotation subtle and within physical limits
      const clampX = Math.max(-15, Math.min(15, x));
      const clampY = Math.max(-15, Math.min(15, y));

      // Apply rotation
      // Base rotation is rotateX(15) rotateY(-20)
      // We add the mouse movement to the base
      scene.style.transform = `rotateX(${15 + clampY}deg) rotateY(${-20 + clampX}deg)`;
    });

    // Reset on mouse leave
    body.addEventListener('mouseleave', () => {
      scene.style.transform = `rotateX(15deg) rotateY(-20deg)`;
    });
  </script>
</body>
</html>
