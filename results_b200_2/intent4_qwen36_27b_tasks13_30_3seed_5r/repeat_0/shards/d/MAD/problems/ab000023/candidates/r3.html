<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Emblem: Product Visualization</title>
<style>
  :root {
    --bg-wall-top: #ffffff;
    --bg-wall-bot: #e6e6e6;
    --bg-floor: #dcdcdc;
    --bg-floor-dark: #c0c0c0;
    --sign-face: #ffffff;
    --sign-edge: #dcdcdc;
    --brand-red: #E50914;
    --text-main: #111111;
    --text-muted: #777777;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-wall-top);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    perspective: 1000px;
    color: var(--text-main);
  }

  /* --- Studio Context (Background) --- */
  .studio-bg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: -1;
    background: linear-gradient(to bottom, var(--bg-wall-top) 0%, var(--bg-wall-bot) 65%, var(--bg-floor) 65%, var(--bg-floor-dark) 100%);
    overflow: hidden;
  }

  /* Architectural Floor Line */
  .floor-line {
    position: absolute;
    top: 65%; left: 0; width: 100%; height: 1px;
    background: rgba(0,0,0,0.1);
    box-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }

  /* --- UI Overlay (Centered Hierarchy) --- */
  .ui-layer {
    position: absolute;
    top: 8vh;
    width: 100%;
    text-align: center;
    z-index: 10;
    pointer-events: none;
  }

  h1 {
    font-weight: 800;
    font-size: clamp(24px, 4vw, 48px);
    letter-spacing: -1px;
    text-transform: uppercase;
    color: var(--text-main);
    margin-bottom: 8px;
    line-height: 1;
  }

  p.subtitle {
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 400;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* --- The 3D Scene Container --- */
  .scene {
    position: relative;
    width: 400px;
    height: 400px;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
    /* Initial 3D Angle - Isometric-ish */
    transform: rotateX(20deg) rotateY(-25deg);
    transition: transform 0.1s ease-out;
    margin-top: 10vh;
  }

  /* The Physical Sign Block */
  .sign-block {
    position: relative;
    width: 320px;
    height: 320px;
    transform-style: preserve-3d;
  }

  /* --- 3D Geometry Faces --- */
  
  /* Front Face (The Sign) */
  .face.front {
    position: absolute;
    width: 100%;
    height: 100%;
    background: var(--sign-face);
    /* 15px Thickness Extrusion */
    transform: translateZ(15px);
    /* Subtle rim light on left/top edges via box-shadow inset */
    box-shadow: 
      inset 1px 1px 0px rgba(255,255,255,1),
      inset 0px 0px 0px 1px rgba(0,0,0,0.05);
    /* Smooth surface material */
    background: radial-gradient(circle at 30% 30%, #ffffff, #fcfcfc);
  }

  /* Right Face (Thickness - Shadowed) */
  .face.right {
    position: absolute;
    width: 30px;
    height: 100%;
    background: linear-gradient(to right, #e0e0e0, #b0b0b0);
    /* Rotate 90deg and shift by half-width + half-thickness */
    transform: rotateY(90deg) translateZ(150px);
    right: -15px;
  }

  /* Top Face (Thickness - Lighted) */
  .face.top {
    position: absolute;
    width: 100%;
    height: 30px;
    background: linear-gradient(to bottom, #ffffff, #e8e8e8);
    /* Rotate 90deg and shift by half-height + half-thickness */
    transform: rotateX(90deg) translateZ(150px);
    top: -15px;
  }

  /* --- Mounting Hardware (Detailed Screws) --- */
  .mount {
    position: absolute;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    transform: translateZ(15.5px); /* Slightly above face */
    /* Metallic Radial Gradient */
    background: radial-gradient(circle at 35% 35%, #f0f0f0, #999999 60%, #777777 100%);
    box-shadow: 
      1px 1px 2px rgba(0,0,0,0.4),
      inset 0 0 1px rgba(255,255,255,0.8);
  }
  
  /* Screw Head Detail (Phillips) */
  .mount::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 8px; height: 2px;
    background: #555;
    box-shadow: 0 0 1px rgba(255,255,255,0.3);
  }
  
  /* Crossbar for Phillips */
  .mount::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(90deg);
    width: 8px; height: 2px;
    background: #555;
    z-index: -1; /* Behind the first bar */
  }

  /* Positioning mounts */
  .mount.tl { top: 20px; left: 20px; }
  .mount.tr { top: 20px; right: 20px; }
  .mount.bl { bottom: 20px; left: 20px; }
  .mount.br { bottom: 20px; right: 20px; }

  /* --- The Hero Emblem --- */
  .emblem-container {
    position: absolute;
    top: 50%; left: 50%;
    /* Floating slightly above the surface */
    transform: translate(-50%, -50%) translateZ(18px); 
    width: 160px;
    height: 160px;
    pointer-events: none;
  }

  svg.emblem {
    width: 100%;
    height: 100%;
    overflow: visible;
    /* Directional shadow: Top-Left Light -> Bottom-Right Shadow */
    filter: drop-shadow(4px 6px 8px rgba(0,0,0,0.25));
  }

  .bg-circle {
    fill: var(--brand-red);
  }
  
  .play-triangle {
    fill: #ffffff;
  }

  /* --- Ground Shadow --- */
  .floor-shadow {
    position: absolute;
    width: 320px;
    height: 320px;
    /* Directional shadow offset */
    transform: rotateX(90deg) translateZ(40px) translate(40px, 40px);
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0) 70%);
    filter: blur(15px);
    opacity: 0.6;
    pointer-events: none;
  }

  /* --- Product Info Footer (Grid Layout) --- */
  .info-strip {
    position: absolute;
    bottom: 8vh;
    display: flex;
    gap: 100px;
    z-index: 10;
    border-top: 1px solid rgba(0,0,0,0.1);
    padding-top: 20px;
    background: linear-gradient(to top, rgba(255,255,255,0.9), transparent);
    padding-bottom: 40px; /* Visual balance */
  }
  
  .info-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 120px;
    text-align: left;
  }
  
  .info-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    font-weight: 600;
  }
  
  .info-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-main);
    letter-spacing: -0.5px;
  }

  /* --- Animation --- */
  @keyframes floatIn {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.9) translateZ(18px); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1) translateZ(18px); }
  }
  
  .emblem-container {
    animation: floatIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

</style>
</head>
<body>

  <div class="studio-bg">
    <div class="floor-line"></div>
  </div>

  <div class="ui-layer">
    <h1>Studio Emblem</h1>
    <p class="subtitle">Geometric Signage System</p>
  </div>

  <div class="scene">
    <div class="sign-block">
      
      <!-- 3D Geometry Faces -->
      <div class="face front"></div>
      <div class="face right"></div>
      <div class="face top"></div>

      <!-- Mounting Hardware (Metallic Screws) -->
      <div class="mount tl"></div>
      <div class="mount tr"></div>
      <div class="mount bl"></div>
      <div class="mount br"></div>

      <!-- The Graphic Emblem -->
      <div class="emblem-container">
        <svg class="emblem" viewBox="0 0 100 100">
          <!-- Vibrant Red Circle -->
          <circle class="bg-circle" cx="50" cy="50" r="46" />
          
          <!-- Perfectly Centered Equilateral Play Triangle -->
          <path class="play-triangle" d="M 38 28 L 78 50 L 38 72 Z" />
        </svg>
      </div>

      <!-- Soft Studio Shadow -->
      <div class="floor-shadow"></div>
    </div>
  </div>

  <div class="info-strip">
    <div class="info-item">
      <span class="info-label">Material</span>
      <span class="info-value">Alabaster Matte</span>
    </div>
    <div class="info-item">
      <span class="info-label">Dimension</span>
      <span class="info-value">320 x 320mm</span>
    </div>
    <div class="info-item">
      <span class="info-label">Finish</span>
      <span class="info-value">Soft Touch</span>
    </div>
  </div>

  <script>
    // Smooth parallax effect for the 3D scene
    const scene = document.querySelector('.scene');
    const body = document.body;

    // Mouse move handler
    body.addEventListener('mousemove', (e) => {
      // Calculate mouse position relative to center
      const x = (window.innerWidth / 2 - e.pageX) / 50; // Divisor controls sensitivity
      const y = (window.innerHeight / 2 - e.pageY) / 50;

      // Clamp values to keep rotation subtle
      const clampX = Math.max(-20, Math.min(20, x));
      const clampY = Math.max(-20, Math.min(20, y));

      // Apply rotation
      // Base rotation is rotateX(20) rotateY(-25)
      // We add the mouse movement to the base
      scene.style.transform = `rotateX(${20 + clampY}deg) rotateY(${-25 + clampX}deg)`;
    });

    // Reset on mouse leave
    body.addEventListener('mouseleave', () => {
      scene.style.transform = `rotateX(20deg) rotateY(-25deg)`;
    });
  </script>
</body>
</html>
