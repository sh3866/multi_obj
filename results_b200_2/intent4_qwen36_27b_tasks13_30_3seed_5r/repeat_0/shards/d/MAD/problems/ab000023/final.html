<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Visualization: Physical Signage</title>
<style>
  :root {
    /* Studio Environment Colors */
    --bg-top: #ffffff;
    --bg-bottom: #e6e9f0;
    
    /* Material Colors */
    --sign-white: #ffffff;
    --sign-shadow: #e0e0e0;
    --sign-edge: #d1d5db;
    
    /* Brand Colors */
    --brand-red-base: #E50914;
    --brand-red-highlight: #ff4d55;
    --brand-red-shadow: #b00009;
    
    /* Hardware */
    --screw-metal: #9ca3af;
    --screw-highlight: #f3f4f6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    /* Seamless Studio Gradient Background */
    background: linear-gradient(to bottom, var(--bg-top) 0%, var(--bg-bottom) 100%);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: system-ui, -apple-system, sans-serif;
    perspective: 1500px;
  }

  /* --- 3D Scene Container --- */
  .scene {
    position: relative;
    width: 500px;
    height: 500px;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
    /* Upright, stable presentation */
    transform: rotateX(5deg); 
    transition: transform 0.1s linear;
    z-index: 10;
  }

  /* The Physical Sign Block */
  .sign-block {
    position: relative;
    width: 360px;
    height: 360px;
    transform-style: preserve-3d;
  }

  /* --- 3D Geometry Faces --- */

  /* Front Face */
  .face.front {
    position: absolute;
    width: 100%;
    height: 100%;
    background: var(--sign-white);
    transform: translateZ(16px); /* Thickness offset */
    border-radius: 6px; /* Polished corners */
    box-shadow: inset 0 0 20px rgba(0,0,0,0.02); /* Subtle inner depth */
    display: flex;
    justify-content: center;
    align-items: center;
    /* Soft internal shadow to frame the logo */
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05), 0 0 50px rgba(0,0,0,0.05);
  }

  /* Right Face (Thickness) */
  .face.right {
    position: absolute;
    width: 32px;
    height: 100%;
    background: var(--sign-edge);
    transform: rotateY(90deg) translateZ(180px);
    right: -16px;
    border-radius: 0 6px 6px 0;
    /* Shadow on the right side to simulate lighting from left */
    box-shadow: inset 10px 0 20px rgba(0,0,0,0.1);
  }

  /* Top Face (Thickness) */
  .face.top {
    position: absolute;
    width: 100%;
    height: 32px;
    background: linear-gradient(to bottom, #ffffff, #f0f0f0);
    transform: rotateX(90deg) translateZ(180px);
    top: -16px;
    border-radius: 6px 6px 0 0;
    box-shadow: inset 0 10px 20px rgba(255,255,255,0.8);
  }

  /* Bottom Face (Thickness) */
  .face.bottom {
    position: absolute;
    width: 100%;
    height: 32px;
    background: #cfcfcf;
    transform: rotateX(-90deg) translateZ(180px);
    bottom: -16px;
    border-radius: 0 0 6px 6px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
  }

  /* --- Mounting Hardware (Screws) --- */
  .screw {
    position: absolute;
    width: 10px; /* Scaled down */
    height: 10px;
    border-radius: 50%;
    transform: translateZ(16.5px); /* Just above front face */
    background: radial-gradient(circle at 30% 30%, var(--screw-highlight), var(--screw-metal));
    box-shadow: 1px 1px 2px rgba(0,0,0,0.3);
  }

  /* Screw Slot */
  .screw::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 6px; height: 1.5px;
    background: #4b5563;
  }

  /* Positions */
  .screw.tl { top: 20px; left: 20px; }
  .screw.tr { top: 20px; right: 20px; }
  .screw.bl { bottom: 20px; left: 20px; }
  .screw.br { bottom: 20px; right: 20px; }

  /* --- The Hero Emblem --- */
  .emblem-container {
    position: relative;
    width: 160px;
    height: 160px;
    /* Centered perfectly */
    display: flex;
    justify-content: center;
    align-items: center;
    /* Subtle lift */
    transform: translateZ(2px);
    /* Soft shadow on the sign face */
    filter: drop-shadow(0px 6px 10px rgba(0,0,0,0.15));
  }

  svg.emblem {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* --- Ground Shadow --- */
  .floor-shadow {
    position: absolute;
    width: 360px;
    height: 60px;
    /* Positioned on the floor plane relative to the scene */
    transform: rotateX(90deg) translateZ(200px) translateY(100px);
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0) 70%);
    filter: blur(15px);
    opacity: 0.6;
    pointer-events: none;
    z-index: -1;
  }

</style>
</head>
<body>

  <div class="scene" id="scene">
    <div class="sign-block">
      
      <!-- 3D Geometry Faces -->
      <div class="face front"></div>
      <div class="face right"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>

      <!-- Mounting Hardware (Screws) -->
      <div class="screw tl"></div>
      <div class="screw tr"></div>
      <div class="screw bl"></div>
      <div class="screw br"></div>

      <!-- The Graphic Emblem -->
      <div class="emblem-container">
        <svg class="emblem" viewBox="0 0 100 100">
          <defs>
            <!-- Glossy Red Gradient -->
            <radialGradient id="redGloss" cx="30%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#ff5c61" />
              <stop offset="40%" stop-color="#E50914" />
              <stop offset="100%" stop-color="#990005" />
            </radialGradient>
            
            <!-- Subtle Inner Bevel for Circle -->
            <linearGradient id="circleBevel" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="rgba(255,255,255,0.3)" />
              <stop offset="50%" stop-color="rgba(255,255,255,0)" />
              <stop offset="100%" stop-color="rgba(0,0,0,0.1)" />
            </linearGradient>
          </defs>

          <!-- Main Red Circle -->
          <circle cx="50" cy="50" r="48" fill="url(#redGloss)" />
          
          <!-- Inner Bevel Overlay -->
          <circle cx="50" cy="50" r="48" fill="url(#circleBevel)" />

          <!-- Play Triangle -->
          <!-- Slightly rounded corners for a polished modern feel -->
          <path d="M 36 30 L 74 50 L 36 70 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1" stroke-linejoin="round" />
        </svg>
      </div>

      <!-- Soft Studio Floor Shadow -->
      <div class="floor-shadow"></div>
    </div>
  </div>

  <script>
    // Smooth parallax effect for the 3D scene
    const scene = document.getElementById('scene');
    const body = document.body;

    // Mouse move handler
    body.addEventListener('mousemove', (e) => {
      // Calculate mouse position relative to center
      const x = (window.innerWidth / 2 - e.pageX) / 60; // Lower sensitivity for stability
      const y = (window.innerHeight / 2 - e.pageY) / 60; 

      // Clamp values to keep rotation subtle
      const clampX = Math.max(-10, Math.min(10, x));
      const clampY = Math.max(-10, Math.min(10, y));

      // Apply rotation
      scene.style.transform = `rotateX(${5 + clampY}deg) rotateY(${clampX}deg)`;
    });

    // Reset on mouse leave
    body.addEventListener('mouseleave', () => {
      scene.style.transform = `rotateX(5deg) rotateY(0deg)`;
    });
  </script>
</body>
</html>
