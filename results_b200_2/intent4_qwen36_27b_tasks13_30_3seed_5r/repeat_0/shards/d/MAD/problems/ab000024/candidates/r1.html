<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Architect Series | Precision Sanitary Ware</title>
    <style>
        :root {
            --bg: #F9F9F9;
            --text-main: #111111;
            --text-muted: #666666;
            --grid-line: #EAEAEA;
            --accent: #0055FF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* --- Layout Grid --- */
        .grid-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            display: flex;
            justify-content: center;
        }
        .grid-line {
            width: 1px;
            height: 100%;
            background: linear-gradient(to bottom, transparent, var(--grid-line), transparent);
            margin: 0 15vw;
        }

        /* --- Header --- */
        header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
            position: relative;
        }

        .brand {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            position: relative;
        }
        .brand::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--text-main);
        }

        .nav-links span {
            margin-left: 2rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.3s ease;
            letter-spacing: 0.02em;
        }

        .nav-links span:hover {
            color: var(--text-main);
        }

        /* --- Main Stage --- */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1.4fr 0.6fr; /* Shift focus to visual */
            position: relative;
            z-index: 1;
        }

        /* Left: The Visual */
        .visual-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 4vh; /* Extended canvas visual space */
            perspective: 1000px;
        }

        .svg-container {
            width: 85%;
            height: 90%;
            max-width: 700px;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Right: The Copy */
        .info-panel {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 6rem 4rem;
            position: relative;
        }

        /* Typography aligned to grid */
        h1 {
            font-size: 5rem;
            line-height: 0.85;
            letter-spacing: -0.05em;
            margin-bottom: 2rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .tagline {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 300px;
            margin-bottom: 4rem;
            font-weight: 400;
        }

        .specs {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            border-top: 1px solid var(--text-main);
            padding-top: 1.5rem;
        }

        .spec-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid #E5E5E5;
            padding-bottom: 0.5rem;
        }

        .spec-item h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .spec-item p {
            font-size: 1.1rem;
            font-weight: 500;
            font-family: "Courier New", Courier, monospace; /* Technical feel */
        }

        /* --- Interaction --- */
        .flush-btn-ui {
            position: absolute;
            /* Position relative to the handle */
            top: 35%; 
            left: 65%;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.8);
            border: 1px solid #E0E0E0;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            backdrop-filter: blur(5px);
        }

        .flush-btn-ui:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            border-color: var(--text-main);
        }

        .flush-btn-ui:active {
            transform: scale(0.9);
        }

        .flush-btn-ui svg {
            width: 20px;
            height: 20px;
            stroke: var(--text-main);
            fill: none;
            stroke-width: 2;
        }

        /* --- Animations --- */
        @keyframes vortexSpin {
            0% { transform: rotate(0deg) scale(0.8); opacity: 0; }
            20% { opacity: 0.7; }
            80% { opacity: 0.7; transform: rotate(270deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1.2); opacity: 0; }
        }

        .vortex-group {
            transform-origin: 315px 395px; /* Center of bowl */
            pointer-events: none;
        }

        .vortex-active {
            animation: vortexSpin 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            h1 { font-size: 3.5rem; }
            .info-panel { padding: 3rem; }
        }

        @media (max-width: 768px) {
            main {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
            }
            .visual-stage {
                height: 55vh;
                padding-bottom: 0;
            }
            .info-panel {
                padding: 2rem;
                height: auto;
            }
            h1 { font-size: 3rem; }
            .grid-overlay { display: none; }
        }
    </style>
</head>
<body>

    <!-- Background Grid -->
    <div class="grid-overlay">
        <div class="grid-line"></div>
    </div>

    <header>
        <div class="brand">Sanitarius.</div>
        <nav class="nav-links">
            <span>Collection</span>
            <span>Technology</span>
            <span>Configure</span>
        </nav>
    </header>

    <main>
        <!-- Visual Stage -->
        <div class="visual-stage">
            <div class="svg-container" id="toiletSvg">
                <!-- Inline SVG Illustration -->
                <svg viewBox="0 0 600 800" width="100%" height="100%" preserveAspectRatio="xMidYMax meet">
                    <defs>
                        <!-- 1. Ceramic Material (Studio Lighting) -->
                        <!-- Main body gradient: Soft white to subtle grey shadow -->
                        <linearGradient id="gradCeramBody" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="15%" stop-color="#F4F4F4" /> <!-- Highlight -->
                            <stop offset="60%" stop-color="#E8E8E8" /> <!-- Midtone -->
                            <stop offset="100%" stop-color="#D0D0D0" /> <!-- Shadow -->
                        </linearGradient>

                        <!-- Rim/Top gradient: Brighter specular -->
                        <linearGradient id="gradCeramTop" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="50%" stop-color="#F0F0F0" />
                            <stop offset="100%" stop-color="#C5C5C5" />
                        </linearGradient>

                        <!-- 2. Chrome/Plastic Handle -->
                        <linearGradient id="gradChrome" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="30%" stop-color="#E0E0E0" />
                            <stop offset="100%" stop-color="#999999" />
                        </linearGradient>

                        <!-- 3. Water Material -->
                        <radialGradient id="gradWater" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#E1F0FA" />
                            <stop offset="70%" stop-color="#A9D2F5" />
                            <stop offset="100%" stop-color="#8AB6D6" />
                        </radialGradient>

                        <!-- 4. Vortex Gradient (For flushing effect) -->
                        <linearGradient id="gradVortex" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
                            <stop offset="100%" stop-color="#A9D2F5" stop-opacity="0.4"/>
                        </linearGradient>

                        <!-- Drop Shadow Filter -->
                        <filter id="blurShadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="20" />
                        </filter>
                    </defs>

                    <!-- Floor Shadow (Extended Canvas) -->
                    <ellipse cx="310" cy="760" rx="160" ry="35" fill="rgba(0,0,0,0.08)" filter="url(#blurShadow)" />

                    <!-- Base / Plumbing (Visible) -->
                    <g id="plumbing">
                        <!-- Flange/Base connection -->
                        <path d="M260 740 Q310 760 360 740 L370 750 Q310 770 250 750 Z" fill="#1A1A1A" />
                        <!-- Floor contact shadow -->
                        <ellipse cx="310" cy="755" rx="60" ry="10" fill="rgba(0,0,0,0.15)" />
                    </g>

                    <!-- Tank (3/4 Perspective) -->
                    <g id="tank">
                        <!-- Tank Body (Swept shape) -->
                        <path d="M230 160 Q230 140 250 140 L370 140 Q390 140 390 160 L390 400 Q390 420 370 420 L250 420 Q230 420 230 400 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Tank Top Lid (Depth) -->
                        <path d="M225 150 L395 150 L390 140 Q370 130 350 130 L250 130 Q230 130 225 140 Z" fill="url(#gradCeramTop)" />
                        
                        <!-- Tank Inner Shadow (Depth cue) -->
                        <path d="M230 400 Q230 160 250 140 L250 420 Z" fill="#000" opacity="0.02" />
                    </g>

                    <!-- Bowl Body (3/4 Perspective) -->
                    <g id="bowl">
                        <!-- Main Bowl Shape -->
                        <path d="M235 380 L385 380 Q385 580 310 620 Q235 580 235 380 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Bowl Rim (Top Surface) -->
                        <ellipse cx="310" cy="380" rx="85" ry="30" fill="url(#gradCeramTop)" />
                        
                        <!-- Bowl Inner Hole (Depth) -->
                        <ellipse cx="310" cy="380" rx="65" ry="20" fill="#E0E0E0" />
                        
                        <!-- Water Surface -->
                        <ellipse class="water-surface" cx="310" cy="382" rx="60" ry="16" fill="url(#gradWater)" />
                        
                        <!-- Water Depth Shadow -->
                        <path d="M250 382 Q310 410 370 382 Q310 400 250 382 Z" fill="#8AB6D6" opacity="0.5" />

                        <!-- Vortex Animation Group (Hidden initially) -->
                        <g class="vortex-group" id="vortexGroup" opacity="0">
                            <!-- Stylized swirl paths -->
                            <path d="M310 380 Q330 360 350 380 T310 400 T270 380 T310 360" stroke="url(#gradVortex)" stroke-width="3" fill="none" stroke-linecap="round"/>
                            <path d="M310 380 Q320 370 330 380 T310 390 T290 380 T310 370" stroke="#FFF" stroke-width="2" fill="none" stroke-linecap="round"/>
                        </g>
                    </g>

                    <!-- Seat & Lid -->
                    <g id="lid-seat">
                        <!-- Lid (Vertical/Ajar) -->
                        <path d="M240 370 Q310 400 380 370 L375 160 Q310 130 245 160 Z" fill="url(#gradCeramBody)" />
                        <!-- Lid Edge Thickness -->
                        <path d="M240 370 Q310 400 380 370 L378 374 Q310 404 242 374 Z" fill="#D0D0D0" />

                        <!-- Seat (Horizontal) -->
                        <ellipse cx="310" cy="380" rx="80" ry="26" fill="none" stroke="#FFFFFF" stroke-width="16" />
                        <!-- Seat Inner Shadow -->
                        <ellipse cx="310" cy="380" rx="72" ry="20" fill="rgba(0,0,0,0.03)" />
                    </g>

                    <!-- Flush Handle (Distinct Material) -->
                    <g id="handle-group">
                        <!-- Handle Base -->
                        <rect x="385" y="230" width="12" height="45" rx="4" fill="url(#gradChrome)" />
                        <!-- Lever Arm -->
                        <path d="M385 245 L415 245 L415 253 L385 253 Z" fill="url(#gradChrome)" />
                        <!-- Pivot -->
                        <circle cx="385" cy="249" r="4" fill="#888" />
                    </g>

                </svg>

                <!-- Floating Interaction Button -->
                <div class="flush-btn-ui" id="flushBtn" title="Flush">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2v10m0 0l-3-3m3 3l3-3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 12v10" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Info Panel -->
        <div class="info-panel">
            <h1>The<br>Architect<br>Series.</h1>
            <p class="tagline">
                Precision-engineered ceramic with a 360-degree silent close mechanism. 
                Experience the hydraulic perfection of the dual-action siphon.
            </p>

            <div class="specs">
                <div class="spec-item">
                    <h3>Efficiency</h3>
                    <p>4.8 / 1.6L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vit. China</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Gloss White</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const flushBtn = document.getElementById('flushBtn');
            const handleGroup = document.getElementById('handle-group');
            const vortexGroup = document.getElementById('vortexGroup');
            const waterSurface = document.querySelector('.water-surface');

            flushBtn.addEventListener('click', () => {
                if (vortexGroup.classList.contains('vortex-active')) return; // Prevent double click spam

                // 1. Move Handle (3D rotation simulation)
                handleGroup.style.transition = "transform 0.15s cubic-bezier(0.1, 0.7, 1.0, 0.1)";
                handleGroup.style.transformOrigin = "385px 249px";
                handleGroup.style.transform = "rotate(25deg) scale(0.95)";

                // Return handle
                setTimeout(() => {
                    handleGroup.style.transition = "transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)";
                    handleGroup.style.transform = "rotate(0deg) scale(1)";
                }, 200);

                // 2. Trigger Vortex
                vortexGroup.style.opacity = "1";
                vortexGroup.classList.remove('vortex-active');
                void vortexGroup.offsetWidth; // Trigger reflow
                vortexGroup.classList.add('vortex-active');

                // 3. Water level dip
                waterSurface.style.transition = "ry 0.5s ease-in-out";
                waterSurface.setAttribute("ry", "12"); // Shrink Y to look like it's going down
                setTimeout(() => {
                    waterSurface.setAttribute("ry", "16"); // Restore
                }, 1200);
            });

            // Subtle parallax on mouse move (Depth)
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth - e.pageX * 2) / 150;
                const y = (window.innerHeight - e.pageY * 2) / 150;

                const lid = document.getElementById('lid-seat');
                // Move lid slightly independent of bowl to enhance 3D feel
                lid.style.transform = `translate(${x * 0.5}px, ${y * 0.5}px)`;
            });
        });
    </script>
</body>
</html>
