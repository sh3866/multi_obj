<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Architect Series | Precision Sanitary Ware</title>
    <style>
        :root {
            /* Palette: Refined Dark Studio */
            --bg-dark: #0e0e11;
            --bg-gradient: radial-gradient(circle at 50% 55%, #252530 0%, #0e0e11 75%);
            
            --text-main: #F0F0F0;
            --text-muted: #6b6b76;
            --accent: #4D9FFF;
            
            --font-display: "Helvetica Neue", "Inter", "Arial Black", sans-serif;
            --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-dark);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Background Vignette (Replaces Grid) --- */
        .vignette-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.6) 100%);
        }

        /* --- Header --- */
        header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            position: relative;
        }

        .brand {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .brand-dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
        }

        .nav-links span {
            margin-left: 3rem;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .nav-links span:hover {
            color: var(--text-main);
        }

        /* --- Main Stage --- */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1.4fr 0.6fr;
            position: relative;
            z-index: 1;
        }

        /* Left: The Visual */
        .visual-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center; /* Centered vertically */
        }

        .svg-container {
            width: 100%;
            height: 100%;
            max-width: 850px; /* Increased scale */
            position: relative;
            filter: drop-shadow(0px 30px 60px rgba(0,0,0,0.8));
        }

        /* Right: The Copy */
        .info-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem 4rem 4rem 0;
            position: relative;
            text-align: right;
        }

        /* Typography - Demoted Headline */
        h1 {
            font-family: var(--font-display);
            font-size: 3.5rem; /* Reduced from 5.5rem */
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin-bottom: 2rem;
            color: #888890; /* Lowered contrast */
            font-weight: 400; /* Lighter weight */
        }

        .tagline {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 350px;
            margin-left: auto; /* Align right */
            margin-bottom: 3rem;
            font-weight: 300;
            border-right: 2px solid var(--accent); /* Flipped border */
            padding-right: 1.5rem;
        }

        .specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-left: auto;
            max-width: 400px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 2rem;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end; /* Align right */
        }

        .spec-item h3 {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #444;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .spec-item p {
            font-size: 1.1rem;
            font-weight: 300;
            font-family: var(--font-display);
            color: var(--text-main);
        }

        /* --- Interaction Hints --- */
        .flush-hint {
            position: absolute;
            top: 38%;
            left: 66%; 
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
            animation: pulseRing 2.5s infinite;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .flush-hint::after {
            content: 'CLICK';
            font-size: 0.5rem;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.1em;
        }

        @keyframes pulseRing {
            0% { transform: scale(0.8); opacity: 0.3; border-color: rgba(255,255,255,0.1); }
            50% { border-color: rgba(77, 159, 255, 0.4); }
            100% { transform: scale(1.6); opacity: 0; border-color: rgba(255,255,255,0); }
        }

        /* --- Animations --- */
        @keyframes vortexSpin {
            0% { transform: rotate(0deg) scale(0.5); opacity: 0; }
            20% { opacity: 1; transform: rotate(180deg) scale(1); }
            80% { opacity: 1; transform: rotate(540deg) scale(1.1); }
            100% { transform: rotate(720deg) scale(1.2); opacity: 0; }
        }

        .vortex-group {
            transform-origin: 340px 465px;
            pointer-events: none;
        }

        .vortex-active {
            animation: vortexSpin 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            h1 { font-size: 3rem; }
            .info-panel { padding: 2rem; text-align: left; }
            .tagline { margin-left: 0; border-right: none; border-left: 2px solid var(--accent); padding-left: 1.5rem; padding-right: 0; }
            .specs { margin-left: 0; }
            .spec-item { align-items: flex-start; }
        }

        @media (max-width: 768px) {
            main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
            .visual-stage { height: 55vh; }
            .info-panel { padding: 2rem; height: auto; background: linear-gradient(to top, var(--bg-dark) 90%, transparent); }
            h1 { font-size: 2.5rem; }
            header { padding: 1.5rem 2rem; }
            .flush-hint { display: none; }
        }
    </style>
</head>
<body>

    <!-- Vignette Background -->
    <div class="vignette-overlay"></div>

    <header>
        <div class="brand"><div class="brand-dot"></div> Sanitarius.</div>
        <nav class="nav-links">
            <span>Collection</span>
            <span>Technology</span>
            <span>Configure</span>
        </nav>
    </header>

    <main>
        <!-- Visual Stage -->
        <div class="visual-stage">
            <div class="svg-container" id="toiletSvg">
                <!-- Inline SVG Illustration - Redrawn for Realism & Anatomy -->
                <svg viewBox="0 0 800 900" width="100%" height="100%" preserveAspectRatio="xMidYMax meet">
                    <defs>
                        <!-- 1. Ceramic Material (High Gloss / Wet Look) -->
                        <linearGradient id="gradCeramBody" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="15%" stop-color="#F7F7F7" /> <!-- Sharp Specular -->
                            <stop offset="55%" stop-color="#E0E0E0" /> <!-- Midtone -->
                            <stop offset="85%" stop-color="#999999" /> <!-- Shadow Transition -->
                            <stop offset="100%" stop-color="#666666" /> <!-- Deep Shadow -->
                        </linearGradient>

                        <!-- 2. Ceramic Top/Lid (Brighter, Matte-ish) -->
                        <linearGradient id="gradCeramTop" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="100%" stop-color="#DDDDDD" />
                        </linearGradient>

                        <!-- 3. Chrome Handle (Metallic) -->
                        <linearGradient id="gradChrome" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="30%" stop-color="#CCCCCC" />
                            <stop offset="50%" stop-color="#888888" />
                            <stop offset="51%" stop-color="#FFFFFF" /> <!-- Glare -->
                            <stop offset="100%" stop-color="#444444" />
                        </linearGradient>

                        <!-- 4. Water Material (Deep Blue) -->
                        <radialGradient id="gradWater" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
                            <stop offset="40%" stop-color="#4D9FFF" stop-opacity="0.8" />
                            <stop offset="100%" stop-color="#1C3D60" stop-opacity="1" />
                        </radialGradient>

                        <!-- 5. Vortex Gradient -->
                        <linearGradient id="gradVortex" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
                            <stop offset="100%" stop-color="#8AB6D6" stop-opacity="0"/>
                        </linearGradient>

                        <!-- Floor Shadow Blur -->
                        <filter id="blurShadow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="20" />
                        </filter>
                    </defs>

                    <!-- Floor Shadow -->
                    <ellipse cx="360" cy="840" rx="200" ry="45" fill="rgba(0,0,0,0.9)" filter="url(#blurShadow)" />

                    <!-- Base / Plumbing (Grounded) -->
                    <g id="plumbing">
                        <!-- Floor Flange (Visible detail) -->
                        <path d="M280 830 Q360 850 440 830 L440 835 Q360 855 280 835 Z" fill="#222" />
                        <!-- Bolt details -->
                        <circle cx="300" cy="835" r="3" fill="#555" />
                        <circle cx="420" cy="835" r="3" fill="#555" />
                        <!-- Connection Shadow -->
                        <path d="M300 830 L300 845 Q360 860 420 845 L420 830 Z" fill="#000" opacity="0.6" />
                    </g>

                    <!-- Tank (Geometric / Architectural) -->
                    <g id="tank">
                        <!-- Tank Body -->
                        <path d="M240 180 L480 180 L480 420 Q480 440 460 440 L260 440 Q240 440 240 420 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Tank Top Lid (3D depth) -->
                        <path d="M230 180 L490 180 L480 165 L240 165 Z" fill="url(#gradCeramTop)" />
                        
                        <!-- Right Side Depth (Thickness) -->
                        <path d="M480 180 L490 180 L490 420 L480 420 Z" fill="#555" />
                        
                        <!-- Front Face Highlight (Gloss) -->
                        <path d="M250 190 L470 190 L470 410 Q470 430 450 430 L250 430 Z" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
                    </g>

                    <!-- Bowl Body (Curved) -->
                    <g id="bowl">
                        <!-- Main Bowl Shape -->
                        <path d="M260 440 L460 440 Q460 680 360 720 Q260 680 260 440 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Bowl Rim (Top Surface - Outer) -->
                        <ellipse cx="360" cy="440" rx="110" ry="30" fill="url(#gradCeramTop)" />
                        
                        <!-- Bowl Inner Hole (Depth) -->
                        <ellipse cx="360" cy="440" rx="85" ry="22" fill="#E8E8E8" />
                        
                        <!-- Water Surface -->
                        <ellipse class="water-surface" cx="360" cy="442" rx="80" ry="18" fill="url(#gradWater)" />
                        
                        <!-- Water Depth Shadow (Inside the bowl) -->
                        <path d="M280 442 Q360 465 440 442 Q360 455 280 442 Z" fill="#000" opacity="0.3" />

                        <!-- Vortex Animation Group -->
                        <g class="vortex-group" id="vortexGroup" opacity="0">
                            <!-- Stylized swirl paths -->
                            <path d="M360 442 Q390 420 420 445 T360 470 T320 445 T360 420" stroke="url(#gradVortex)" stroke-width="5" fill="none" stroke-linecap="round"/>
                            <path d="M360 442 Q380 430 390 445 T360 455 T350 445 T360 430" stroke="#FFF" stroke-width="2" fill="none" stroke-linecap="round"/>
                        </g>
                    </g>

                    <!-- Seat & Lid (Ajar) -->
                    <g id="lid-seat">
                        <!-- Lid (Vertical/Ajar) -->
                        <!-- Path simulating a rounded rectangle in perspective -->
                        <path d="M270 430 Q360 460 450 430 L440 170 Q360 140 280 170 Z" fill="url(#gradCeramBody)" />
                        <!-- Lid Edge Thickness (Bottom) -->
                        <path d="M270 430 Q360 460 450 430 L448 434 Q360 464 272 434 Z" fill="#D0D0D0" />

                        <!-- Seat (Horizontal) -->
                        <!-- Donut shape -->
                        <path d="M250 440 A110 30 0 1 0 470 440 A110 30 0 1 0 250 440 M360 415 A85 20 0 1 1 360 465 A85 20 0 1 1 360 415" fill="#FFFFFF" />
                        <!-- Seat Inner Shadow -->
                        <ellipse cx="360" cy="440" rx="80" ry="18" fill="rgba(0,0,0,0.05)" />
                    </g>

                    <!-- Flush Handle (Enlarged, Detailed) -->
                    <g id="handle-group">
                        <!-- Handle Base (Vertical Mount) -->
                        <rect x="475" y="260" width="20" height="70" rx="4" fill="url(#gradChrome)" />
                        <!-- Lever Arm (Horizontal) - Larger -->
                        <path d="M475 290 L540 290 L540 305 L475 305 Z" fill="url(#gradChrome)" />
                        <!-- Pivot Point -->
                        <circle cx="475" cy="297.5" r="6" fill="#333" />
                        <!-- Pivot Highlight -->
                        <circle cx="473" cy="295" r="2" fill="#FFF" opacity="0.5"/>
                    </g>

                </svg>

                <!-- Interaction Hint -->
                <div class="flush-hint"></div>
            </div>
        </div>

        <!-- Info Panel -->
        <div class="info-panel">
            <h1>The<br>Architect<br>Series.</h1>
            <p class="tagline">
                Precision-engineered ceramic geometry. A seamless fusion of hydraulic efficiency and architectural form.
            </p>

            <div class="specs">
                <div class="spec-item">
                    <h3>Efficiency</h3>
                    <p>4.8 / 1.6L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vit. China</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Gloss White</p>
                </div>
                <div class="spec-item">
                    <h3>System</h3>
                    <p>Siphon Jet</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const handleGroup = document.getElementById('handle-group');
            const vortexGroup = document.getElementById('vortexGroup');
            const waterSurface = document.querySelector('.water-surface');
            const svgContainer = document.getElementById('toiletSvg');

            // Function to trigger flush
            const triggerFlush = () => {
                if (vortexGroup.classList.contains('vortex-active')) return;

                // 1. Move Handle (Physical rotation)
                handleGroup.style.transition = "transform 0.15s cubic-bezier(0.1, 0.7, 1.0, 0.1)";
                handleGroup.style.transformOrigin = "475px 297.5px"; // Pivot point
                handleGroup.style.transform = "rotate(30deg)";

                // Return handle with spring effect
                setTimeout(() => {
                    handleGroup.style.transition = "transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)";
                    handleGroup.style.transform = "rotate(0deg)";
                }, 150);

                // 2. Trigger Vortex
                vortexGroup.style.opacity = "1";
                vortexGroup.classList.remove('vortex-active');
                void vortexGroup.offsetWidth; // Trigger reflow
                vortexGroup.classList.add('vortex-active');

                // 3. Water level dip (Simulate drain)
                waterSurface.style.transition = "ry 0.4s ease-in, fill 0.5s ease";
                waterSurface.setAttribute("ry", "5"); // Shrink Y
                waterSurface.setAttribute("fill", "url(#gradCeramBody)"); // Fade to white/empty look briefly

                // Restore water
                setTimeout(() => {
                    waterSurface.setAttribute("ry", "18"); // Restore Y
                    waterSurface.setAttribute("fill", "url(#gradWater)"); // Restore color
                }, 1200);
            };

            // Click anywhere on the SVG to flush
            svgContainer.addEventListener('click', triggerFlush);

            // Subtle Parallax on Mouse Move
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth - e.pageX * 2) / 150;
                const y = (window.innerHeight - e.pageY * 2) / 150;

                const lid = document.getElementById('lid-seat');
                const tank = document.getElementById('tank');
                
                // Move elements slightly to create depth
                lid.style.transform = `translate(${x * 0.5}px, ${y * 0.5}px)`;
                tank.style.transform = `translate(${x * 0.2}px, ${y * 0.2}px)`;
            });
        });
    </script>
</body>
</html>
