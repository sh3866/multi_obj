<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Architect Series | Precision Sanitary Ware</title>
    <style>
        :root {
            /* Palette: Dark Studio */
            --bg-dark: #141416;
            --bg-gradient: radial-gradient(circle at 50% 40%, #2a2a30 0%, #141416 80%);
            
            --text-main: #FFFFFF;
            --text-muted: #888890;
            --accent: #4D9FFF; /* Water Blue */
            
            --font-display: "Helvetica Neue", "Arial Black", sans-serif;
            --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-dark);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Background Grid --- */
        .grid-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100px 100px;
            mask-image: radial-gradient(circle at 50% 50%, black 40%, transparent 100%);
        }

        /* --- Header --- */
        header {
            padding: 2.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            position: relative;
        }

        .brand {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .brand-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
        }

        .nav-links span {
            margin-left: 3rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .nav-links span:hover {
            color: var(--text-main);
        }

        /* --- Main Stage --- */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1.3fr 0.7fr;
            position: relative;
            z-index: 1;
        }

        /* Left: The Visual */
        .visual-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 2vh;
        }

        .svg-container {
            width: 90%;
            height: 95%;
            max-width: 750px;
            position: relative;
            filter: drop-shadow(0px 20px 40px rgba(0,0,0,0.6));
        }

        /* Right: The Copy */
        .info-panel {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 6rem 4rem 6rem 0;
            position: relative;
        }

        /* Typography */
        h1 {
            font-family: var(--font-display);
            font-size: 5.5rem;
            line-height: 0.9;
            letter-spacing: -0.04em;
            margin-bottom: 2.5rem;
            color: var(--text-main);
            font-weight: 700;
        }

        .tagline {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 380px;
            margin-bottom: 4rem;
            font-weight: 300;
            border-left: 2px solid var(--accent);
            padding-left: 1.5rem;
        }

        .specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
        }

        .spec-item h3 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #555;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .spec-item p {
            font-size: 1.2rem;
            font-weight: 400;
            font-family: var(--font-display);
            color: var(--text-main);
        }

        /* --- Interaction Hints --- */
        .flush-hint {
            position: absolute;
            top: 30%;
            left: 68%; /* Positioned near handle */
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.2);
            pointer-events: none;
            animation: pulseRing 2s infinite;
            z-index: 20;
        }

        @keyframes pulseRing {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* --- Animations --- */
        @keyframes vortexSpin {
            0% { transform: rotate(0deg) scale(0.8); opacity: 0; }
            15% { opacity: 0.9; transform: rotate(90deg) scale(1); }
            80% { opacity: 0.9; transform: rotate(270deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1.2); opacity: 0; }
        }

        .vortex-group {
            transform-origin: 320px 480px; /* Center of water */
            pointer-events: none;
        }

        .vortex-active {
            animation: vortexSpin 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            h1 { font-size: 4rem; }
            .info-panel { padding: 3rem 2rem; }
        }

        @media (max-width: 768px) {
            main {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
            }
            .visual-stage {
                height: 50vh;
                padding-bottom: 0;
            }
            .info-panel {
                padding: 2rem;
                height: auto;
                background: linear-gradient(to top, var(--bg-dark) 80%, transparent);
            }
            h1 { font-size: 3rem; }
            header { padding: 1.5rem 2rem; }
            .flush-hint { display: none; }
        }
    </style>
</head>
<body>

    <!-- Architectural Grid Background -->
    <div class="grid-overlay"></div>

    <header>
        <div class="brand"><div class="brand-dot"></div> Sanitarius.</div>
        <nav class="nav-links">
            <span>Collection</span>
            <span>Technology</span>
            <span>Configure</span>
        </nav>
    </header>

    <main>
        <!-- Visual Stage -->
        <div class="visual-stage">
            <div class="svg-container" id="toiletSvg">
                <!-- Inline SVG Illustration -->
                <svg viewBox="0 0 800 900" width="100%" height="100%" preserveAspectRatio="xMidYMax meet">
                    <defs>
                        <!-- 1. Ceramic Material (High Gloss / Shadow) -->
                        <!-- Left side highlight, deep right shadow -->
                        <linearGradient id="gradCeramBody" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="10%" stop-color="#F2F2F2" /> <!-- Specular Edge -->
                            <stop offset="50%" stop-color="#EAEAEA" /> <!-- Midtone -->
                            <stop offset="90%" stop-color="#BDBDBD" /> <!-- Shadow -->
                            <stop offset="100%" stop-color="#A0A0A0" /> <!-- Deep Shadow -->
                        </linearGradient>

                        <!-- Top surfaces (Lid/Rim) - Brighter -->
                        <linearGradient id="gradCeramTop" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="40%" stop-color="#F9F9F9" />
                            <stop offset="100%" stop-color="#D0D0D0" />
                        </linearGradient>

                        <!-- 2. Chrome/Plastic Handle (Metallic) -->
                        <linearGradient id="gradChrome" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="20%" stop-color="#E0E0E0" />
                            <stop offset="50%" stop-color="#AAAAAA" />
                            <stop offset="100%" stop-color="#555555" />
                        </linearGradient>

                        <!-- 3. Water Material (Deep Blue) -->
                        <radialGradient id="gradWater" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
                            <stop offset="20%" stop-color="#4D9FFF" stop-opacity="0.8" />
                            <stop offset="100%" stop-color="#1C3D60" stop-opacity="1" />
                        </radialGradient>

                        <!-- 4. Vortex Gradient (Motion Blur) -->
                        <linearGradient id="gradVortex" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
                            <stop offset="100%" stop-color="#8AB6D6" stop-opacity="0.2"/>
                        </linearGradient>

                        <!-- Floor Shadow -->
                        <filter id="blurShadow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="15" />
                        </filter>
                    </defs>

                    <!-- Floor Shadow -->
                    <ellipse cx="380" cy="860" rx="180" ry="40" fill="rgba(0,0,0,0.8)" filter="url(#blurShadow)" />

                    <!-- Base / Plumbing (Visible, grounded) -->
                    <g id="plumbing">
                        <!-- Floor Flange -->
                        <path d="M300 840 Q380 860 460 840 L460 845 Q380 865 300 845 Z" fill="#222" />
                        <!-- Connection Shadow -->
                        <path d="M320 840 L320 855 Q380 870 440 855 L440 840 Z" fill="#000" opacity="0.5" />
                    </g>

                    <!-- Tank (Geometric / Architectural) -->
                    <g id="tank">
                        <!-- Tank Body -->
                        <!-- Flat front face with subtle shading -->
                        <path d="M260 150 L500 150 L500 430 L260 430 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Tank Top Lid (3D depth) -->
                        <path d="M250 150 L510 150 L500 135 L260 135 Z" fill="url(#gradCeramTop)" />
                        
                        <!-- Right Side Depth (Thickness) -->
                        <path d="M500 150 L510 150 L510 430 L500 430 Z" fill="#999" opacity="0.6" />
                    </g>

                    <!-- Bowl Body (Curved) -->
                    <g id="bowl">
                        <!-- Main Bowl Shape -->
                        <path d="M260 410 L500 410 Q500 650 380 680 Q260 650 260 410 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Bowl Rim (Top Surface) -->
                        <ellipse cx="380" cy="410" rx="120" ry="35" fill="url(#gradCeramTop)" />
                        
                        <!-- Bowl Inner Hole (Depth) -->
                        <ellipse cx="380" cy="410" rx="95" ry="25" fill="#E0E0E0" />
                        
                        <!-- Water Surface -->
                        <ellipse class="water-surface" cx="380" cy="412" rx="90" ry="22" fill="url(#gradWater)" />
                        
                        <!-- Water Depth Shadow (Inside the bowl) -->
                        <path d="M290 412 Q380 440 470 412 Q380 430 290 412 Z" fill="#000" opacity="0.2" />

                        <!-- Vortex Animation Group (Hidden initially) -->
                        <g class="vortex-group" id="vortexGroup" opacity="0">
                            <!-- Stylized swirl paths -->
                            <path d="M380 412 Q410 390 440 415 T380 440 T340 415 T380 390" stroke="url(#gradVortex)" stroke-width="4" fill="none" stroke-linecap="round"/>
                            <path d="M380 412 Q400 400 410 415 T380 425 T370 415 T380 400" stroke="#FFF" stroke-width="2" fill="none" stroke-linecap="round"/>
                        </g>
                    </g>

                    <!-- Seat & Lid -->
                    <g id="lid-seat">
                        <!-- Lid (Vertical/Ajar) -->
                        <!-- Using a path that simulates a rounded rectangle in perspective -->
                        <path d="M270 400 Q380 430 490 400 L480 150 Q380 120 280 150 Z" fill="url(#gradCeramBody)" />
                        <!-- Lid Edge Thickness (Bottom) -->
                        <path d="M270 400 Q380 430 490 400 L488 404 Q380 434 272 404 Z" fill="#D0D0D0" />

                        <!-- Seat (Horizontal) -->
                        <!-- Donut shape -->
                        <path d="M260 410 A120 35 0 1 0 500 410 A120 35 0 1 0 260 410 M380 385 A95 25 0 1 1 380 435 A95 25 0 1 1 380 385" fill="#FFFFFF" />
                        <!-- Seat Inner Shadow -->
                        <ellipse cx="380" cy="410" rx="90" ry="22" fill="rgba(0,0,0,0.05)" />
                    </g>

                    <!-- Flush Handle (Physical, Metallic) -->
                    <g id="handle-group">
                        <!-- Handle Base (Vertical Mount) -->
                        <rect x="490" y="280" width="15" height="60" rx="3" fill="url(#gradChrome)" />
                        <!-- Lever Arm (Horizontal) -->
                        <path d="M490 300 L535 300 L535 312 L490 312 Z" fill="url(#gradChrome)" />
                        <!-- Pivot Point -->
                        <circle cx="490" cy="306" r="5" fill="#333" />
                    </g>

                </svg>

                <!-- Interaction Hint (Pulsing Ring) -->
                <div class="flush-hint"></div>
            </div>
        </div>

        <!-- Info Panel -->
        <div class="info-panel">
            <h1>The<br>Architect<br>Series.</h1>
            <p class="tagline">
                Precision-engineered ceramic geometry. A seamless fusion of hydraulic efficiency and architectural form.
            </p>

            <div class="specs">
                <div class="spec-item">
                    <h3>Efficiency</h3>
                    <p>4.8 / 1.6L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vit. China</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Gloss White</p>
                </div>
                <div class="spec-item">
                    <h3>System</h3>
                    <p>Siphon Jet</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const handleGroup = document.getElementById('handle-group');
            const vortexGroup = document.getElementById('vortexGroup');
            const waterSurface = document.querySelector('.water-surface');
            const svgContainer = document.getElementById('toiletSvg');

            // Function to trigger flush
            const triggerFlush = () => {
                if (vortexGroup.classList.contains('vortex-active')) return;

                // 1. Move Handle (Physical rotation)
                handleGroup.style.transition = "transform 0.15s cubic-bezier(0.1, 0.7, 1.0, 0.1)";
                handleGroup.style.transformOrigin = "490px 306px"; // Pivot point
                handleGroup.style.transform = "rotate(25deg)";

                // Return handle with spring effect
                setTimeout(() => {
                    handleGroup.style.transition = "transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)";
                    handleGroup.style.transform = "rotate(0deg)";
                }, 150);

                // 2. Trigger Vortex
                vortexGroup.style.opacity = "1";
                vortexGroup.classList.remove('vortex-active');
                void vortexGroup.offsetWidth; // Trigger reflow
                vortexGroup.classList.add('vortex-active');

                // 3. Water level dip (Simulate drain)
                waterSurface.style.transition = "ry 0.4s ease-in, fill 0.5s ease";
                waterSurface.setAttribute("ry", "10"); // Shrink Y
                waterSurface.setAttribute("fill", "url(#gradCeramBody)"); // Fade to white/empty look briefly

                // Restore water
                setTimeout(() => {
                    waterSurface.setAttribute("ry", "22"); // Restore Y
                    waterSurface.setAttribute("fill", "url(#gradWater)"); // Restore color
                }, 1200);
            };

            // Click anywhere on the SVG to flush
            svgContainer.addEventListener('click', triggerFlush);

            // Subtle Parallax on Mouse Move
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth - e.pageX * 2) / 120;
                const y = (window.innerHeight - e.pageY * 2) / 120;

                const lid = document.getElementById('lid-seat');
                const tank = document.getElementById('tank');
                
                // Move elements slightly to create depth
                lid.style.transform = `translate(${x * 0.5}px, ${y * 0.5}px)`;
                tank.style.transform = `translate(${x * 0.2}px, ${y * 0.2}px)`;
            });
        });
    </script>
</body>
</html>
