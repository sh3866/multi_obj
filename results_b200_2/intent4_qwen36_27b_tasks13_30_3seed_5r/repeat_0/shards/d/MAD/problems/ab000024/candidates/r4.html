<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Architect Series | Precision Sanitary Ware</title>
    <style>
        :root {
            /* Palette: Deep Studio Atmosphere */
            --bg-dark: #050505;
            --bg-gradient: radial-gradient(circle at 50% 40%, #2a2a35 0%, #050505 70%);
            
            --text-main: #FFFFFF;
            --text-muted: #888890;
            --text-dim: #444444;
            --accent: #00F0FF; /* Cyan glow */
            
            --font-display: "Helvetica Neue", "Inter", "Arial", sans-serif;
            --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-dark);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Background Vignette & Texture --- */
        .vignette-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.9) 100%);
        }

        /* --- Header --- */
        header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            position: relative;
        }

        .brand {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .brand-dot {
            width: 8px;
            height: 8px;
            background: var(--text-main);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .nav-links span {
            margin-left: 3rem;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .nav-links span:hover {
            color: var(--text-main);
        }

        /* --- Main Stage --- */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1.5fr 0.7fr;
            position: relative;
            z-index: 1;
            padding-bottom: 2rem;
        }

        /* Left: The Visual */
        .visual-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Anchor to bottom */
            padding-bottom: 5vh;
        }

        .svg-container {
            width: 100%;
            height: 100%;
            max-width: 900px;
            position: relative;
            /* SVG internal shadows will handle depth */
        }

        /* Right: The Copy */
        .info-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem 4rem 4rem 0;
            position: relative;
            text-align: right;
        }

        /* Typography - High Contrast */
        h1 {
            font-family: var(--font-display);
            font-size: 4.5rem;
            line-height: 0.95;
            letter-spacing: -0.04em;
            margin-bottom: 2rem;
            color: #FFFFFF; /* Pure White */
            font-weight: 700;
            text-shadow: 0 0 30px rgba(255,255,255,0.1);
        }

        .tagline {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 350px;
            margin-left: auto;
            margin-bottom: 4rem;
            font-weight: 300;
            border-right: 2px solid var(--accent);
            padding-right: 1.5rem;
        }

        /* Restructured Data Grid */
        .specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem 2rem; /* Larger vertical gap */
            margin-left: auto;
            max-width: 450px;
            border-top: 1px solid rgba(255,255,255,0.15);
            padding-top: 2.5rem;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .spec-item h3 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #555;
            font-weight: 600;
            margin-bottom: 0.6rem;
        }

        .spec-item p {
            font-size: 1.5rem; /* Larger values */
            font-weight: 400;
            font-family: var(--font-display);
            color: var(--text-main);
        }

        /* --- Interaction Hints --- */
        .flush-hint {
            position: absolute;
            top: 38%;
            left: 66%; 
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.2);
            pointer-events: none;
            animation: pulseRing 2.5s infinite;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
        }
        
        .flush-hint::after {
            content: 'FLUSH';
            font-size: 0.55rem;
            color: var(--accent);
            letter-spacing: 0.15em;
            font-weight: 700;
        }

        @keyframes pulseRing {
            0% { transform: scale(0.8); opacity: 0; border-color: transparent; }
            50% { opacity: 1; border-color: var(--accent); }
            100% { transform: scale(1.5); opacity: 0; border-color: transparent; }
        }

        /* --- Animations --- */
        @keyframes vortexSpin {
            0% { transform: rotate(0deg) scale(0.3); opacity: 0; }
            10% { opacity: 1; transform: rotate(180deg) scale(0.8); }
            100% { transform: rotate(720deg) scale(1.2); opacity: 0; }
        }

        .vortex-group {
            transform-origin: 340px 465px;
            pointer-events: none;
        }

        .vortex-active {
            animation: vortexSpin 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            h1 { font-size: 3.5rem; }
            .info-panel { padding: 2rem; text-align: left; }
            .tagline { margin-left: 0; border-right: none; border-left: 2px solid var(--accent); padding-left: 1.5rem; padding-right: 0; }
            .specs { margin-left: 0; }
            .spec-item { align-items: flex-start; }
        }

        @media (max-width: 768px) {
            main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
            .visual-stage { height: 50vh; padding-bottom: 0; }
            .info-panel { padding: 2rem; height: auto; background: linear-gradient(to top, var(--bg-dark) 80%, transparent); z-index: 5; }
            h1 { font-size: 2.5rem; margin-bottom: 1rem; }
            header { padding: 1.5rem 2rem; }
            .flush-hint { display: none; }
        }
    </style>
</head>
<body>

    <!-- Vignette Background -->
    <div class="vignette-overlay"></div>

    <header>
        <div class="brand"><div class="brand-dot"></div> Sanitarius.</div>
        <nav class="nav-links">
            <span>Collection</span>
            <span>Technology</span>
            <span>Configure</span>
        </nav>
    </header>

    <main>
        <!-- Visual Stage -->
        <div class="visual-stage">
            <div class="svg-container" id="toiletSvg">
                <!-- Inline SVG Illustration -->
                <svg viewBox="0 0 800 900" width="100%" height="100%" preserveAspectRatio="xMidYMax meet">
                    <defs>
                        <!-- 1. Ceramic Material (Multi-stop for glossy porcelain) -->
                        <linearGradient id="gradCeramBody" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="20%" stop-color="#F5F5F5" /> <!-- Specular -->
                            <stop offset="60%" stop-color="#E0E0E0" /> <!-- Midtone -->
                            <stop offset="90%" stop-color="#B0B0B0" /> <!-- Shadow Transition -->
                            <stop offset="100%" stop-color="#666666" /> <!-- Deep Shadow -->
                        </linearGradient>

                        <!-- 2. Ceramic Top/Lid -->
                        <linearGradient id="gradCeramTop" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="100%" stop-color="#E0E0E0" />
                        </linearGradient>

                        <!-- 3. Chrome Handle (Metallic) -->
                        <linearGradient id="gradChrome" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="40%" stop-color="#CCCCCC" />
                            <stop offset="50%" stop-color="#FFFFFF" /> <!-- Sharp Highlight -->
                            <stop offset="100%" stop-color="#555555" />
                        </linearGradient>

                        <!-- 4. Water Material (Deep Azure/Teal) -->
                        <radialGradient id="gradWater" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9" /> <!-- Bright center -->
                            <stop offset="50%" stop-color="#006680" stop-opacity="1" />
                            <stop offset="100%" stop-color="#003340" stop-opacity="1" /> <!-- Deep rim -->
                        </radialGradient>

                        <!-- 5. Vortex Gradient -->
                        <linearGradient id="gradVortex" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
                            <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
                        </linearGradient>

                        <!-- Floor Shadow Blur -->
                        <filter id="blurShadow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="25" />
                        </filter>

                        <!-- Handle Glow Filter -->
                        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="4" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>

                    <!-- Floor Plane / Baseboard (Grounding Element) -->
                    <g id="floor-context">
                        <!-- Baseboard Line -->
                        <rect x="0" y="820" width="800" height="80" fill="#080808" />
                        <line x1="0" y1="820" x2="800" y2="820" stroke="#1a1a1a" stroke-width="2" />
                        
                        <!-- Soft Drop Shadow -->
                        <ellipse cx="360" cy="830" rx="220" ry="40" fill="rgba(0,0,0,0.95)" filter="url(#blurShadow)" />
                    </g>

                    <!-- Plumbing Base -->
                    <g id="plumbing">
                        <!-- Floor Flange -->
                        <path d="M260 820 Q360 845 460 820 L460 825 Q360 850 260 825 Z" fill="#111" />
                        <!-- Bolts -->
                        <circle cx="290" cy="825" r="4" fill="#333" />
                        <circle cx="430" cy="825" r="4" fill="#333" />
                        <!-- Connection Shadow -->
                        <path d="M280 820 L280 835 Q360 855 440 835 L440 820 Z" fill="#000" opacity="0.8" />
                    </g>

                    <!-- Tank -->
                    <g id="tank">
                        <!-- Tank Body -->
                        <path d="M240 180 L480 180 L480 420 Q480 440 460 440 L260 440 Q240 440 240 420 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Tank Top Lid -->
                        <path d="M230 180 L490 180 L480 165 L240 165 Z" fill="url(#gradCeramTop)" />
                        
                        <!-- Right Side Depth -->
                        <path d="M480 180 L490 180 L490 420 L480 420 Z" fill="#555" />
                        
                        <!-- Front Face Highlight -->
                        <path d="M250 190 L470 190 L470 410 Q470 430 450 430 L250 430 Z" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" />
                    </g>

                    <!-- Bowl -->
                    <g id="bowl">
                        <!-- Main Bowl Shape -->
                        <path d="M260 440 L460 440 Q460 680 360 720 Q260 680 260 440 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Bowl Rim Outer -->
                        <ellipse cx="360" cy="440" rx="110" ry="30" fill="url(#gradCeramTop)" />
                        
                        <!-- Bowl Inner Hole (Depth) -->
                        <ellipse cx="360" cy="440" rx="85" ry="22" fill="#F0F0F0" />
                        
                        <!-- Water Surface -->
                        <ellipse class="water-surface" cx="360" cy="442" rx="80" ry="18" fill="url(#gradWater)" />
                        
                        <!-- Water Depth Shadow -->
                        <path d="M280 442 Q360 465 440 442 Q360 455 280 442 Z" fill="#000" opacity="0.2" />

                        <!-- Vortex Animation Group -->
                        <g class="vortex-group" id="vortexGroup" opacity="0">
                            <path d="M360 442 Q390 420 420 445 T360 470 T320 445 T360 420" stroke="url(#gradVortex)" stroke-width="6" fill="none" stroke-linecap="round"/>
                            <path d="M360 442 Q380 430 390 445 T360 455 T350 445 T360 430" stroke="#FFF" stroke-width="3" fill="none" stroke-linecap="round"/>
                        </g>
                    </g>

                    <!-- Seat & Lid (Ajar) -->
                    <g id="lid-seat">
                        <!-- Lid (Vertical/Ajar) -->
                        <path d="M270 430 Q360 460 450 430 L440 170 Q360 140 280 170 Z" fill="url(#gradCeramBody)" />
                        <!-- Lid Edge Thickness -->
                        <path d="M270 430 Q360 460 450 430 L448 434 Q360 464 272 434 Z" fill="#D0D0D0" />

                        <!-- Seat (Horizontal) -->
                        <path d="M250 440 A110 30 0 1 0 470 440 A110 30 0 1 0 250 440 M360 415 A85 20 0 1 1 360 465 A85 20 0 1 1 360 415" fill="#FFFFFF" />
                        <!-- Seat Inner Shadow -->
                        <ellipse cx="360" cy="440" rx="80" ry="18" fill="rgba(0,0,0,0.05)" />
                    </g>

                    <!-- Flush Handle (Enlarged, Glowing, Depressed State) -->
                    <g id="handle-group">
                        <!-- Handle Base -->
                        <rect x="475" y="260" width="20" height="70" rx="4" fill="url(#gradChrome)" />
                        <!-- Lever Arm - Depressed for action -->
                        <g transform="rotate(25, 475, 297.5)">
                            <path d="M475 290 L540 290 L540 305 L475 305 Z" fill="url(#gradChrome)" filter="url(#glow)" />
                        </g>
                        <!-- Pivot Point -->
                        <circle cx="475" cy="297.5" r="7" fill="#222" />
                        <!-- Pivot Highlight -->
                        <circle cx="473" cy="295" r="2.5" fill="#FFF" />
                    </g>

                </svg>

                <!-- Interaction Hint -->
                <div class="flush-hint"></div>
            </div>
        </div>

        <!-- Info Panel -->
        <div class="info-panel">
            <h1>The<br>Architect<br>Series.</h1>
            <p class="tagline">
                Precision-engineered ceramic geometry. A seamless fusion of hydraulic efficiency and architectural form.
            </p>

            <div class="specs">
                <div class="spec-item">
                    <h3>Efficiency</h3>
                    <p>4.8 / 1.6L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vit. China</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Gloss White</p>
                </div>
                <div class="spec-item">
                    <h3>System</h3>
                    <p>Siphon Jet</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const handleGroup = document.getElementById('handle-group');
            const vortexGroup = document.getElementById('vortexGroup');
            const waterSurface = document.querySelector('.water-surface');
            const svgContainer = document.getElementById('toiletSvg');

            // Function to trigger flush
            const triggerFlush = () => {
                if (vortexGroup.classList.contains('vortex-active')) return;

                // 1. Move Handle (Physical rotation)
                // It starts at 25deg (depressed). We rotate it further to 45deg then spring back.
                handleGroup.style.transition = "transform 0.1s cubic-bezier(0.1, 0.7, 1.0, 0.1)";
                handleGroup.style.transformOrigin = "475px 297.5px"; 
                handleGroup.style.transform = "rotate(20deg)"; // Additional push

                // Return handle
                setTimeout(() => {
                    handleGroup.style.transition = "transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)";
                    handleGroup.style.transform = "rotate(0deg)";
                }, 100);

                // 2. Trigger Vortex
                vortexGroup.style.opacity = "1";
                vortexGroup.classList.remove('vortex-active');
                void vortexGroup.offsetWidth; // Trigger reflow
                vortexGroup.classList.add('vortex-active');

                // 3. Water level dip (Simulate drain)
                waterSurface.style.transition = "ry 0.3s ease-in, fill 0.5s ease";
                waterSurface.setAttribute("ry", "5"); // Shrink Y
                waterSurface.setAttribute("fill", "url(#gradCeramBody)"); // Fade to white

                // Restore water
                setTimeout(() => {
                    waterSurface.setAttribute("ry", "18"); // Restore Y
                    waterSurface.setAttribute("fill", "url(#gradWater)"); // Restore color
                }, 1000);
            };

            // Click anywhere on the SVG to flush
            svgContainer.addEventListener('click', triggerFlush);

            // Subtle Parallax on Mouse Move
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth - e.pageX * 2) / 150;
                const y = (window.innerHeight - e.pageY * 2) / 150;

                const lid = document.getElementById('lid-seat');
                const tank = document.getElementById('tank');
                
                // Move elements slightly to create depth
                lid.style.transform = `translate(${x * 0.5}px, ${y * 0.5}px)`;
                tank.style.transform = `translate(${x * 0.2}px, ${y * 0.2}px)`;
            });
        });
    </script>
</body>
</html>
