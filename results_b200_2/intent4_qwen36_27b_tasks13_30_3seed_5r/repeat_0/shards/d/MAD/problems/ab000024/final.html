<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Architect Series | Precision Sanitary Ware</title>
    <style>
        :root {
            /* Palette: Gallery Atmosphere */
            --bg-dark: #0a0a0c;
            --bg-grid: rgba(255, 255, 255, 0.03);
            
            --text-main: #FFFFFF;
            --text-muted: #888890;
            --text-dim: #444444;
            
            --font-display: "Helvetica Neue", "Inter", "Arial", sans-serif;
            --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            perspective: 1000px;
        }

        /* --- Architectural Background Context --- */
        .gallery-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle at 50% 30%, #1a1a20 0%, #050505 80%);
        }

        /* Floor Grid */
        .floor-grid {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%; /* Perspective floor area */
            background: 
                linear-gradient(to bottom, transparent 0%, var(--bg-dark) 100%),
                repeating-linear-gradient(90deg, var(--bg-grid) 0px, var(--bg-grid) 1px, transparent 1px, transparent 100px),
                repeating-linear-gradient(180deg, var(--bg-grid) 0px, var(--bg-grid) 1px, transparent 1px, transparent 100px);
            transform: perspective(600px) rotateX(60deg) scale(1.5);
            transform-origin: bottom;
            opacity: 0.6;
            z-index: 0;
        }

        /* --- Header --- */
        header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            position: relative;
        }

        .brand {
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .brand-dot {
            width: 6px;
            height: 6px;
            background: var(--text-main);
            border-radius: 50%;
        }

        .nav-links span {
            margin-left: 3rem;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .nav-links span:hover {
            color: var(--text-main);
        }

        /* --- Main Stage --- */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1.4fr 0.8fr;
            position: relative;
            z-index: 1;
        }

        /* Left: The Visual */
        .visual-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 10vh; /* Grounding offset */
        }

        .svg-container {
            width: 100%;
            height: 100%;
            max-width: 800px;
            position: relative;
            filter: drop-shadow(0px 20px 30px rgba(0,0,0,0.6));
        }

        /* Right: The Copy */
        .info-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem 4rem 4rem 0;
            position: relative;
            text-align: right;
        }

        /* Typography */
        h1 {
            font-family: var(--font-display);
            font-size: 3.8rem; /* Scaled down slightly per critique */
            line-height: 0.95;
            letter-spacing: -0.03em;
            margin-bottom: 2rem;
            color: #FFFFFF;
            font-weight: 600;
        }

        .tagline {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 350px;
            margin-left: auto;
            margin-bottom: 4rem;
            font-weight: 300;
            border-right: 1px solid rgba(255,255,255,0.2);
            padding-right: 1.5rem;
        }

        /* Restructured Data Grid */
        .specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem 2rem;
            margin-left: auto;
            max-width: 450px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 2.5rem;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .spec-item h3 {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #555;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .spec-item p {
            font-size: 1.4rem;
            font-weight: 400;
            font-family: var(--font-display);
            color: var(--text-main);
        }

        /* --- Animations --- */
        @keyframes vortexSpin {
            0% { transform: rotate(0deg) scale(0.3); opacity: 0; }
            15% { opacity: 0.8; transform: rotate(180deg) scale(0.9); }
            100% { transform: rotate(720deg) scale(1.3); opacity: 0; }
        }

        .vortex-group {
            transform-origin: 350px 430px;
            pointer-events: none;
        }

        .vortex-active {
            animation: vortexSpin 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            h1 { font-size: 3rem; }
            .info-panel { padding: 2rem; text-align: left; }
            .tagline { margin-left: 0; border-right: none; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 1.5rem; padding-right: 0; }
            .specs { margin-left: 0; }
            .spec-item { align-items: flex-start; }
        }

        @media (max-width: 768px) {
            main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
            .visual-stage { height: 50vh; padding-bottom: 0; }
            .info-panel { padding: 2rem; height: auto; background: linear-gradient(to top, var(--bg-dark) 80%, transparent); z-index: 5; }
            h1 { font-size: 2.5rem; margin-bottom: 1rem; }
            header { padding: 1.5rem 2rem; }
        }
    </style>
</head>
<body>

    <!-- Background Elements -->
    <div class="gallery-bg"></div>
    <div class="floor-grid"></div>

    <header>
        <div class="brand"><div class="brand-dot"></div> Sanitarius.</div>
        <nav class="nav-links">
            <span>Collection</span>
            <span>Technology</span>
            <span>Configure</span>
        </nav>
    </header>

    <main>
        <!-- Visual Stage -->
        <div class="visual-stage">
            <div class="svg-container" id="toiletSvg">
                <!-- Inline SVG Illustration -->
                <svg viewBox="0 0 800 900" width="100%" height="100%" preserveAspectRatio="xMidYMax meet">
                    <defs>
                        <!-- 1. Ceramic Body (High Gloss Porcelain) -->
                        <linearGradient id="gradCeramBody" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="15%" stop-color="#FFFFFF" /> <!-- Sharp Specular -->
                            <stop offset="45%" stop-color="#F0F0F0" /> <!-- Midtone -->
                            <stop offset="85%" stop-color="#D0D0D0" /> <!-- Shadow Transition -->
                            <stop offset="100%" stop-color="#777777" /> <!-- Deep Shadow -->
                        </linearGradient>

                        <!-- 2. Ceramic Top/Lid (Flat Surface) -->
                        <linearGradient id="gradCeramTop" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="100%" stop-color="#E5E5E5" />
                        </linearGradient>

                        <!-- 3. Chrome Handle (Machined Metal) -->
                        <linearGradient id="gradChrome" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="30%" stop-color="#999999" />
                            <stop offset="50%" stop-color="#FFFFFF" /> <!-- Highlight -->
                            <stop offset="100%" stop-color="#444444" />
                        </linearGradient>

                        <!-- 4. Water Material -->
                        <radialGradient id="gradWater" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
                            <stop offset="60%" stop-color="#005566" stop-opacity="1" />
                            <stop offset="100%" stop-color="#002233" stop-opacity="1" />
                        </radialGradient>

                        <!-- 5. Vortex Gradient -->
                        <linearGradient id="gradVortex" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
                            <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
                        </linearGradient>

                        <!-- Floor Shadow Blur -->
                        <filter id="blurShadow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="30" />
                        </filter>

                        <!-- Subtle Glow for Handle -->
                        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="3" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>

                    <!-- Floor Plane / Baseboard -->
                    <g id="floor-context">
                        <!-- Baseboard Line -->
                        <rect x="0" y="810" width="800" height="90" fill="#050505" />
                        <line x1="0" y1="810" x2="800" y2="810" stroke="#222" stroke-width="1" />
                        
                        <!-- Drop Shadow -->
                        <ellipse cx="350" cy="820" rx="200" ry="35" fill="rgba(0,0,0,0.9)" filter="url(#blurShadow)" />
                    </g>

                    <!-- Plumbing Base -->
                    <g id="plumbing">
                        <!-- Floor Flange -->
                        <path d="M260 810 Q350 835 440 810 L440 815 Q350 840 260 815 Z" fill="#111" />
                        <!-- Bolts -->
                        <circle cx="285" cy="815" r="3" fill="#333" />
                        <circle cx="415" cy="815" r="3" fill="#333" />
                        <!-- Connection Seal -->
                        <path d="M280 810 L280 825 Q350 845 420 825 L420 810 Z" fill="#000" opacity="0.8" />
                    </g>

                    <!-- Tank -->
                    <g id="tank">
                        <!-- Tank Body -->
                        <path d="M250 190 L450 190 L450 430 Q450 450 430 450 L270 450 Q250 450 250 430 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Tank Top Lid (Closed) -->
                        <path d="M245 190 L455 190 L450 175 L250 175 Z" fill="url(#gradCeramTop)" />
                        
                        <!-- Right Side Depth -->
                        <path d="M450 190 L455 190 L455 430 L450 430 Z" fill="#555" />
                        
                        <!-- Front Face Highlight -->
                        <path d="M260 200 L440 200 L440 420 Q440 440 420 440 L260 440 Z" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1" />
                    </g>

                    <!-- Bowl -->
                    <g id="bowl">
                        <!-- Main Bowl Shape -->
                        <path d="M270 450 L430 450 Q430 680 350 720 Q270 680 270 450 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Bowl Rim Outer -->
                        <ellipse cx="350" cy="450" rx="100" ry="28" fill="url(#gradCeramTop)" />
                        
                        <!-- Bowl Inner Hole (Depth) -->
                        <ellipse cx="350" cy="450" rx="80" ry="20" fill="#F0F0F0" />
                        
                        <!-- Water Surface -->
                        <ellipse class="water-surface" cx="350" cy="452" rx="75" ry="16" fill="url(#gradWater)" />
                        
                        <!-- Water Depth Shadow -->
                        <path d="M285 452 Q350 475 415 452 Q350 465 285 452 Z" fill="#000" opacity="0.25" />

                        <!-- Vortex Animation Group -->
                        <g class="vortex-group" id="vortexGroup" opacity="0">
                            <path d="M350 452 Q380 430 410 455 T350 480 T310 455 T350 430" stroke="url(#gradVortex)" stroke-width="6" fill="none" stroke-linecap="round"/>
                            <path d="M350 452 Q370 440 380 455 T350 465 T340 455 T350 440" stroke="#FFF" stroke-width="3" fill="none" stroke-linecap="round"/>
                        </g>
                    </g>

                    <!-- Seat & Lid (Closed) -->
                    <g id="lid-seat">
                        <!-- Lid (Closed - Flat) -->
                        <path d="M260 440 A100 28 0 1 0 440 440 A100 28 0 1 0 260 440 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Lid Edge Thickness -->
                        <path d="M260 440 A100 28 0 1 0 440 440 L440 443 A100 28 0 1 1 260 443 Z" fill="#D0D0D0" />

                        <!-- Seat (Under Lid, slightly visible rim) -->
                        <path d="M262 442 A98 26 0 1 0 438 442 A98 26 0 1 0 262 442" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
                    </g>

                    <!-- Flush Handle -->
                    <g id="handle-group">
                        <!-- Handle Base -->
                        <rect x="445" y="260" width="18" height="70" rx="3" fill="url(#gradChrome)" />
                        <!-- Lever Arm -->
                        <g transform="rotate(10, 445, 295)">
                            <path d="M445 290 L510 290 L510 302 L445 302 Z" fill="url(#gradChrome)" filter="url(#glow)" />
                        </g>
                        <!-- Pivot Point -->
                        <circle cx="445" cy="296" r="6" fill="#222" />
                        <!-- Pivot Highlight -->
                        <circle cx="443" cy="294" r="2" fill="#FFF" />
                    </g>

                </svg>
            </div>
        </div>

        <!-- Info Panel -->
        <div class="info-panel">
            <h1>The<br>Architect<br>Series.</h1>
            <p class="tagline">
                Precision-engineered ceramic geometry. A seamless fusion of hydraulic efficiency and architectural form.
            </p>

            <div class="specs">
                <div class="spec-item">
                    <h3>Efficiency</h3>
                    <p>4.8 / 1.6L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vit. China</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Gloss White</p>
                </div>
                <div class="spec-item">
                    <h3>System</h3>
                    <p>Siphon Jet</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const handleGroup = document.getElementById('handle-group');
            const vortexGroup = document.getElementById('vortexGroup');
            const waterSurface = document.querySelector('.water-surface');
            const svgContainer = document.getElementById('toiletSvg');

            // Function to trigger flush
            const triggerFlush = () => {
                if (vortexGroup.classList.contains('vortex-active')) return;

                // 1. Move Handle (Physical rotation)
                // It starts at 10deg. We rotate it further to 30deg then spring back.
                handleGroup.style.transition = "transform 0.1s cubic-bezier(0.1, 0.7, 1.0, 0.1)";
                handleGroup.style.transformOrigin = "445px 296px"; 
                handleGroup.style.transform = "rotate(20deg)"; 

                // Return handle
                setTimeout(() => {
                    handleGroup.style.transition = "transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)";
                    handleGroup.style.transform = "rotate(0deg)";
                }, 100);

                // 2. Trigger Vortex
                vortexGroup.style.opacity = "1";
                vortexGroup.classList.remove('vortex-active');
                void vortexGroup.offsetWidth; // Trigger reflow
                vortexGroup.classList.add('vortex-active');

                // 3. Water level dip (Simulate drain)
                waterSurface.style.transition = "ry 0.3s ease-in, fill 0.5s ease";
                waterSurface.setAttribute("ry", "4"); // Shrink Y
                waterSurface.setAttribute("fill", "url(#gradCeramBody)"); // Fade to white

                // Restore water
                setTimeout(() => {
                    waterSurface.setAttribute("ry", "16"); // Restore Y
                    waterSurface.setAttribute("fill", "url(#gradWater)"); // Restore color
                }, 900);
            };

            // Click anywhere on the SVG to flush
            svgContainer.addEventListener('click', triggerFlush);

            // Subtle Parallax on Mouse Move
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth - e.pageX * 2) / 150;
                const y = (window.innerHeight - e.pageY * 2) / 150;

                const lid = document.getElementById('lid-seat');
                const tank = document.getElementById('tank');
                
                // Move elements slightly to create depth
                lid.style.transform = `translate(${x * 0.5}px, ${y * 0.5}px)`;
                tank.style.transform = `translate(${x * 0.2}px, ${y * 0.2}px)`;
            });
        });
    </script>
</body>
</html>
