<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Hand Study: Front View</title>
    <style>
        :root {
            --bg-dark: #050505;
            --bg-spotlight: #1a1a1a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .stage {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Cinematic Vignette Background */
            background: radial-gradient(circle at 60% 40%, #1f1f22 0%, #080808 80%);
        }

        /* Film Grain Overlay */
        .noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.06;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Vignette for depth */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9;
            background: radial-gradient(circle at center, transparent 50%, #000000 100%);
        }

        svg {
            width: 100%;
            height: 100%;
            max-width: 600px; /* Tighter crop for "Close-up" */
            max-height: 1000px;
            will-change: transform;
            transition: transform 0.1s ease-out;
            filter: drop-shadow(0 20px 50px rgba(0,0,0,0.8));
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="noise"></div>
        <div class="vignette"></div>

        <!-- ViewBox set to crop tight on the hand and phone -->
        <svg id="scene" viewBox="0 0 500 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Skin Gradients: Warm, directional lighting from top-left -->
                <linearGradient id="skinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#e8cbb8" />
                    <stop offset="40%" stop-color="#b07c60" />
                    <stop offset="100%" stop-color="#5e3b2f" />
                </linearGradient>
                
                <linearGradient id="skinThumb" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f2d4bd" />
                    <stop offset="50%" stop-color="#a86e50" />
                    <stop offset="100%" stop-color="#4a2a1e" />
                </linearGradient>

                <linearGradient id="skinShadow" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#3a221a" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="#1a0d08" stop-opacity="0.9"/>
                </linearGradient>

                <!-- Device: Matte Black / Space Grey -->
                <linearGradient id="deviceBody" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#3a3a3c" />
                    <stop offset="50%" stop-color="#1c1c1e" />
                    <stop offset="100%" stop-color="#0a0a0b" />
                </linearGradient>

                <!-- Device Bevel Highlight -->
                <linearGradient id="bevel" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
                    <stop offset="100%" stop-color="rgba(255,255,255,0)" />
                </linearGradient>

                <!-- Screen: Dark OLED with subtle blue tint -->
                <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#020203" />
                    <stop offset="100%" stop-color="#000000" />
                </linearGradient>

                <!-- Screen Reflection (Diagonal) -->
                <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0)" />
                    <stop offset="45%" stop-color="rgba(255,255,255,0)" />
                    <stop offset="48%" stop-color="rgba(255,255,255,0.15)" />
                    <stop offset="52%" stop-color="rgba(255,255,255,0.05)" />
                    <stop offset="100%" stop-color="rgba(255,255,255,0)" />
                </linearGradient>

                <!-- Filters -->
                <filter id="blurSmall" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="2.5" />
                </filter>
                
                <filter id="blurLarge" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="30" />
                </filter>

                <!-- Contact Shadow: Sharp but soft edges for occlusion -->
                <filter id="contactShadow">
                    <feGaussianBlur stdDeviation="3" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="2"/>
                    </feComponentTransfer>
                </filter>
            </defs>

            <!-- Main Composition Group -->
            <!-- Centered slightly right to balance the left-leaning phone -->
            <g id="main-composition" transform="translate(20, -20)">

                <!-- 1. DEVICE (Rotated 180 to show Front Face) -->
                <!-- Positioned center-left, tilted slightly -->
                <g id="device" transform="translate(120, 180) rotate(12)">
                    
                    <!-- Drop Shadow -->
                    <rect x="20" y="20" width="240" height="520" rx="30" fill="#000" opacity="0.8" filter="url(#blurLarge)" />

                    <!-- Device Body (Backplate) -->
                    <rect x="0" y="0" width="240" height="520" rx="30" fill="url(#deviceBody)" />

                    <!-- Edge Bevel (Thickness) -->
                    <rect x="0" y="0" width="240" height="520" rx="30" fill="none" stroke="url(#bevel)" stroke-width="1.5" opacity="0.6" />

                    <!-- Screen Area -->
                    <rect x="8" y="8" width="224" height="504" rx="24" fill="url(#screenGlow)" />

                    <!-- Screen Details (Dynamic Island / Notch area) -->
                    <rect x="80" y="20" width="80" height="24" rx="12" fill="#000" />
                    <circle cx="145" cy="32" r="4" fill="#111" /> <!-- Camera lens -->
                    <circle cx="145" cy="32" r="1.5" fill="#222" /> <!-- Glare -->

                    <!-- Screen Glass Reflection -->
                    <rect x="8" y="8" width="224" height="504" rx="24" fill="url(#glassReflection)" style="mix-blend-mode: overlay;" pointer-events="none" />

                    <!-- Hardware Buttons (Visible on Right side now) -->
                    <!-- Since device is rotated, buttons are on the right of the visual frame -->
                    <rect x="240" y="140" width="4" height="60" rx="2" fill="#111" /> <!-- Power -->
                    <rect x="240" y="220" width="4" height="50" rx="2" fill="#111" /> <!-- Vol Up -->
                    <rect x="240" y="280" width="4" height="50" rx="2" fill="#111" /> <!-- Vol Down -->
                </g>

                <!-- 2. THE HAND (Anatomical Reconstruction) -->
                <!-- Hand wraps from the RIGHT side, thumb on screen -->
                <g id="hand" transform="translate(0, 0)">
                    
                    <!-- Palm & Wrist Base (Entering from Right) -->
                    <path d="M 450,150 C 350,250 320,500 380,800 L 550,800 L 550,150 Z" fill="url(#skinGradient)" />
                    
                    <!-- Palm Creases (Life/Heart lines hints) -->
                    <path d="M 360,400 Q 420,450 450,550" stroke="#5a3a2a" stroke-width="2" fill="none" opacity="0.4" filter="url(#blurSmall)" />

                    <!-- FINGERS: Wrapping around the back/right edge -->
                    <!-- These cast shadows onto the screen or device face -->

                    <!-- Index Finger (Top) -->
                    <g transform="translate(340, 280) rotate(15)">
                        <!-- Shadow on Screen -->
                        <path d="M -20,0 L -40,150 L -80,150 L -50,0 Z" fill="#000" filter="url(#contactShadow)" opacity="0.5" />
                        
                        <!-- Finger Body -->
                        <path d="M -15,-20 C 20,-20 50,40 30,160 C 20,180 -10,170 -15,150 Z" fill="url(#skinGradient)" />
                        
                        <!-- Knuckle -->
                        <circle cx="0" cy="0" r="14" fill="url(#skinGradient)" />
                        <path d="M -10,-10 Q 0,-5 10,-15" stroke="#5a3a2a" stroke-width="2" fill="none" opacity="0.5" />
                        
                        <!-- Nail -->
                        <path d="M 10,145 Q 25,150 20,165 Q 5,160 10,145 Z" fill="rgba(255,255,255,0.15)" />
                        <!-- Specular -->
                        <path d="M 15,150 Q 20,155 18,160" stroke="#fff" stroke-width="1" opacity="0.6" />
                    </g>

                    <!-- Middle Finger (Center) -->
                    <g transform="translate(330, 380) rotate(10)">
                        <!-- Shadow -->
                        <path d="M -20,0 L -40,160 L -80,160 L -50,0 Z" fill="#000" filter="url(#contactShadow)" opacity="0.5" />

                        <!-- Finger Body -->
                        <path d="M -15,-20 C 20,-20 50,50 30,170 C 20,190 -10,180 -15,160 Z" fill="url(#skinGradient)" />
                        
                        <!-- Knuckle -->
                        <circle cx="0" cy="0" r="15" fill="url(#skinGradient)" />
                        <path d="M -12,-10 Q 0,-5 12,-15" stroke="#5a3a2a" stroke-width="2" fill="none" opacity="0.5" />

                        <!-- Nail -->
                        <path d="M 10,155 Q 25,160 20,175 Q 5,170 10,155 Z" fill="rgba(255,255,255,0.15)" />
                        <path d="M 15,160 Q 20,165 18,170" stroke="#fff" stroke-width="1" opacity="0.6" />
                    </g>

                    <!-- Ring Finger -->
                    <g transform="translate(330, 480) rotate(5)">
                        <!-- Shadow -->
                        <path d="M -20,0 L -40,150 L -80,150 L -50,0 Z" fill="#000" filter="url(#contactShadow)" opacity="0.5" />

                        <!-- Finger Body -->
                        <path d="M -15,-20 C 20,-20 50,40 30,160 C 20,180 -10,170 -15,150 Z" fill="url(#skinGradient)" />
                        
                        <!-- Knuckle -->
                        <circle cx="0" cy="0" r="14" fill="url(#skinGradient)" />

                        <!-- Nail -->
                        <path d="M 10,145 Q 25,150 20,165 Q 5,160 10,145 Z" fill="rgba(255,255,255,0.15)" />
                    </g>

                    <!-- Pinky Finger (Bottom) -->
                    <g transform="translate(335, 570) rotate(0)">
                        <!-- Shadow -->
                        <path d="M -20,0 L -40,130 L -80,130 L -50,0 Z" fill="#000" filter="url(#contactShadow)" opacity="0.5" />

                        <!-- Finger Body -->
                        <path d="M -15,-20 C 20,-20 40,30 25,140 C 15,160 -10,150 -15,130 Z" fill="url(#skinGradient)" />
                        
                        <!-- Knuckle -->
                        <circle cx="0" cy="0" r="13" fill="url(#skinGradient)" />

                        <!-- Nail -->
                        <path d="M 10,125 Q 22,130 18,145 Q 5,140 10,125 Z" fill="rgba(255,255,255,0.15)" />
                    </g>

                    <!-- THE THUMB (Focal Point - Front Screen) -->
                    <!-- Originates from right palm, crosses over screen -->
                    <g id="thumb" transform="translate(420, 650)">
                        
                        <!-- Shadow Cast by Thumb onto Screen -->
                        <!-- Placed under the thumb geometry to anchor it -->
                        <path d="M 0,0 C -40,-80 -120,-150 -160,-180 C -180,-200 -150,-220 -120,-200 C -80,-160 -20,-60 0,0 Z" 
                              fill="#000" opacity="0.6" filter="url(#contactShadow)" />

                        <!-- Thenar Eminence (Base of thumb) -->
                        <path d="M 0,0 C -30,60 -20,120 20,140 L 60,140 Z" fill="url(#skinGradient)" />
                        
                        <!-- Thumb Shaft -->
                        <!-- Sweeping curve from bottom-right to top-left -->
                        <path d="M 10,20 C -40,60 -100,120 -140,180 C -160,220 -140,250 -100,240 C -60,230 -30,180 20,120 Z" fill="url(#skinThumb)" />
                        
                        <!-- IP Joint (Knuckle) -->
                        <circle cx="-130" cy="190" r="20" fill="url(#skinThumb)" />
                        <!-- Joint Crease -->
                        <path d="M -150,175 Q -130,190 -145,205" stroke="#5a3a2a" stroke-width="3" fill="none" opacity="0.7" filter="url(#blurSmall)" />
                        
                        <!-- Distal Phalanx (Tip) -->
                        <path d="M -140,180 C -160,220 -140,250 -100,240 C -80,235 -90,200 -120,180 Z" fill="url(#skinThumb)" />
                        
                        <!-- Thumbnail (High Detail) -->
                        <g transform="translate(-115, 210) rotate(-25)">
                            <!-- Nail Plate -->
                            <path d="M 0,0 C 12,-10 28,0 22,28 C 16,40 -6,35 -12,18 Z" fill="rgba(255,255,255,0.25)" />
                            <!-- Lunula -->
                            <path d="M -8,18 Q 2,28 12,18" stroke="#fff" stroke-width="1" opacity="0.3" fill="none" />
                            <!-- Specular Highlight (Glossy) -->
                            <path d="M 4,2 L 14,2" stroke="#fff" stroke-width="2" opacity="0.8" filter="url(#blurSmall)" />
                        </g>

                        <!-- Rim Light on Thumb Edge (Back side of thumb) -->
                        <path d="M -140,180 C -160,220 -140,250 -100,240" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" filter="url(#blurSmall)" />
                    </g>

                </g>

                <!-- 3. Global Lighting Accents -->
                
                <!-- Specular highlights on Knuckles (Right side fingers) -->
                <!-- Highlights the "bulge" of the metacarpals -->
                <ellipse cx="350" cy="280" rx="5" ry="10" fill="#fff" opacity="0.3" filter="url(#blurSmall)" transform="rotate(15, 350, 280)" />
                <ellipse cx="340" cy="380" rx="6" ry="12" fill="#fff" opacity="0.3" filter="url(#blurSmall)" transform="rotate(10, 340, 380)" />
                <ellipse cx="340" cy="480" rx="5" ry="10" fill="#fff" opacity="0.3" filter="url(#blurSmall)" />

                <!-- Specular Highlight on Thumb Knuckle -->
                <ellipse cx="-140" cy="180" rx="6" ry="6" fill="#fff" opacity="0.6" filter="url(#blurSmall)" transform="translate(280, 470)" />

            </g>
        </svg>
    </div>

    <script>
        // Subtle Parallax Interaction
        document.addEventListener('mousemove', (e) => {
            const svg = document.getElementById('scene');
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            // Normalize mouse position (-1 to 1)
            const x = (e.clientX / width) * 2 - 1;
            const y = (e.clientY / height) * 2 - 1;

            // Apply movement (Opposite to mouse for depth)
            // Reduced scale for a more subtle, high-end feel
            const moveX = -x * 15; 
            const moveY = -y * 15;
            
            // Apply subtle rotation
            const rotate = x * 1.5;

            svg.style.transform = `translate(${moveX}px, ${moveY}px) rotate(${rotate}deg) scale(1.02)`;
        });

        // Reset on leave
        document.addEventListener('mouseleave', () => {
            const svg = document.getElementById('scene');
            svg.style.transform = `translate(0px, 0px) rotate(0deg) scale(1.02)`;
        });
    </script>
</body>
</html>
