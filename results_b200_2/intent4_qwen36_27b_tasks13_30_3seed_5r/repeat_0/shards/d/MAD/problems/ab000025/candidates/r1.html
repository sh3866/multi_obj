<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Interface of Touch — Study No. 04</title>
    <style>
        :root {
            --bg-color: #08080a;
            --text-primary: #ffffff;
            --text-secondary: #8c8c98;
            --text-dim: #44444a;
            --accent: #ff3b30;
            
            /* Editorial Typography */
            --font-display: 'Didot', 'Times New Roman', 'Bodoni MT', serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Grain Texture */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.04;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            z-index: 10;
        }

        /* Main Layout */
        .composition {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr; /* Text takes more space */
            position: relative;
            z-index: 2;
        }

        /* Typography Section */
        .editorial {
            padding: 6rem 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .meta {
            font-family: var(--font-ui);
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--accent);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .meta::after {
            content: '';
            display: block;
            height: 1px;
            flex-grow: 1;
            background: linear-gradient(to right, var(--text-dim), transparent);
        }

        h1 {
            font-family: var(--font-display);
            font-size: 5.5rem;
            font-weight: 400;
            line-height: 0.9;
            margin-bottom: 2.5rem;
            letter-spacing: -0.03em;
            color: #fff;
        }

        h1 span {
            display: block;
            font-style: italic;
            color: var(--text-secondary);
            font-size: 0.6em;
            margin-left: 1rem;
        }

        p.description {
            font-size: 1rem;
            line-height: 1.7;
            color: var(--text-secondary);
            max-width: 480px;
            margin-bottom: 4rem;
            border-left: 2px solid var(--text-dim);
            padding-left: 1.5rem;
        }

        /* Data Grid */
        .specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            width: 100%;
            max-width: 600px;
        }

        .spec-col {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .spec-item {
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 1rem;
        }

        .spec-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-dim);
            margin-bottom: 0.5rem;
            display: block;
        }

        .spec-value {
            font-family: var(--font-display);
            font-size: 1.75rem;
            color: var(--text-primary);
            font-weight: 300;
        }

        /* Visual Stage */
        .visual-stage {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1a1a1e 0%, #08080a 70%);
            overflow: hidden;
        }

        /* SVG Styling */
        svg#scene {
            width: 100%;
            height: 100%;
            max-width: 800px;
            /* Animation applied via JS for better control */
            transform-origin: center center;
            will-change: transform;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .composition {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }
            .editorial {
                padding: 3rem;
                order: 2;
            }
            .visual-stage {
                order: 1;
                min-height: 50vh;
            }
            h1 { font-size: 4rem; }
            .specs { gap: 2rem; }
        }
    </style>
</head>
<body>

    <div class="noise-overlay"></div>

    <div class="composition">
        <div class="editorial">
            <div class="meta">Study No. 04 — Haptics</div>
            <h1>
                Tactile
                <span>Reality</span>
            </h1>
            <p class="description">
                A study in the friction between biological form and synthetic glass. 
                Exploring the anatomy of grip, the pressure of the thumb, and the 
                seamless integration of hardware and hand.
            </p>
            
            <div class="specs">
                <div class="spec-col">
                    <div class="spec-item">
                        <span class="spec-label">Material</span>
                        <span class="spec-value">Matte Ceramic</span>
                    </div>
                    <div class="spec-item">
                        <span class="spec-label">Glass</span>
                        <span class="spec-value">Sapphire</span>
                    </div>
                </div>
                <div class="spec-col">
                    <div class="spec-item">
                        <span class="spec-label">Ergonomics</span>
                        <span class="spec-value">Curved 3D</span>
                    </div>
                    <div class="spec-item">
                        <span class="spec-label">Weight</span>
                        <span class="spec-value">184g</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="visual-stage">
            <!-- The SVG Illustration -->
            <svg id="scene" viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Skin Gradients: Warm, organic, complex -->
                    <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#e6cbb3" />
                        <stop offset="40%" stop-color="#d1a893" />
                        <stop offset="100%" stop-color="#9e7863" />
                    </linearGradient>
                    
                    <linearGradient id="skinDark" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#8a6050" />
                        <stop offset="100%" stop-color="#4a3025" />
                    </linearGradient>

                    <radialGradient id="fingerTip" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#f0d0c0" />
                        <stop offset="80%" stop-color="#d1a893" />
                        <stop offset="100%" stop-color="#a67c65" />
                    </radialGradient>

                    <!-- Phone Gradients: Cool, sharp, specular -->
                    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3a3a40" />
                        <stop offset="50%" stop-color="#151518" />
                        <stop offset="100%" stop-color="#050505" />
                    </linearGradient>

                    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#1e2530" />
                        <stop offset="100%" stop-color="#0b0e13" />
                    </linearGradient>

                    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="rgba(255,255,255,0)" />
                        <stop offset="20%" stop-color="rgba(255,255,255,0.6)" />
                        <stop offset="50%" stop-color="rgba(255,255,255,0.1)" />
                        <stop offset="100%" stop-color="rgba(255,255,255,0)" />
                    </linearGradient>

                    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="rgba(255,255,255,0)" />
                        <stop offset="35%" stop-color="rgba(255,255,255,0.02)" />
                        <stop offset="40%" stop-color="rgba(255,255,255,0.15)" />
                        <stop offset="42%" stop-color="rgba(255,255,255,0)" />
                        <stop offset="100%" stop-color="rgba(255,255,255,0)" />
                    </linearGradient>

                    <!-- Filters -->
                    <filter id="softBlur">
                        <feGaussianBlur stdDeviation="8" />
                    </filter>
                    <filter id="heavyBlur">
                        <feGaussianBlur stdDeviation="25" />
                    </filter>
                    <filter id="contactShadow">
                        <feGaussianBlur stdDeviation="3" />
                        <feOffset dx="0" dy="2" />
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.5"/>
                        </feComponentTransfer>
                        <feComposite operator="over" in="SourceGraphic"/>
                    </filter>
                </defs>

                <!-- 1. The Hand (Back Layer - Wrist & Palm Base) -->
                <g id="hand-back">
                    <!-- Wrist connecting to forearm -->
                    <path d="M 250,950 L 320,600 Q 380,580 420,600 L 580,950 Z" fill="url(#skinBase)" />
                    <!-- Wrist anatomy hint -->
                    <path d="M 330,700 Q 400,680 450,720" stroke="#a67c65" stroke-width="2" fill="none" opacity="0.6" filter="url(#softBlur)"/>
                </g>

                <!-- 2. The Phone (Hardware Layer) -->
                <!-- Positioned before the fingers so fingers wrap around it -->
                <g id="phone-base" transform="translate(260, 160) rotate(12)">
                    <!-- Phone Body Shadow -->
                    <rect x="10" y="10" width="240" height="520" rx="24" fill="#000" opacity="0.5" filter="url(#softBlur)"/>
                    
                    <!-- Phone Bezel -->
                    <rect x="0" y="0" width="240" height="520" rx="24" fill="url(#phoneBody)" />
                    
                    <!-- Screen -->
                    <rect x="8" y="8" width="224" height="504" rx="18" fill="url(#screenGlow)" />
                    
                    <!-- Hardware: Camera Module (Top Left) -->
                    <g transform="translate(15, 20)">
                        <rect x="0" y="0" width="60" height="60" rx="14" fill="#111" stroke="#222" stroke-width="1"/>
                        <!-- Lenses -->
                        <circle cx="18" cy="18" r="10" fill="#0a0a0a" stroke="#333" stroke-width="1"/>
                        <circle cx="18" cy="18" r="4" fill="#000" />
                        <circle cx="42" cy="18" r="10" fill="#0a0a0a" stroke="#333" stroke-width="1"/>
                        <circle cx="18" cy="42" r="10" fill="#0a0a0a" stroke="#333" stroke-width="1"/>
                        <!-- Flash/Sensor -->
                        <circle cx="42" cy="42" r="4" fill="#222" />
                    </g>

                    <!-- Hardware: Speaker (Top) -->
                    <rect x="90" y="12" width="60" height="4" rx="2" fill="#050505" />

                    <!-- Abstract Screen UI (Subtle) -->
                    <g opacity="0.6">
                        <rect x="30" y="100" width="180" height="120" rx="8" fill="#222" opacity="0.5" />
                        <rect x="30" y="240" width="140" height="8" rx="4" fill="#444" />
                        <rect x="30" y="260" width="100" height="8" rx="4" fill="#444" />
                    </g>

                    <!-- Glass Reflection (Specular) -->
                    <path d="M 8,8 L 232,8 L 232,250 L 80,512 L 8,512 Z" fill="url(#glassReflection)" style="mix-blend-mode: screen;" />
                    
                    <!-- Screen Edge Highlight -->
                    <rect x="8" y="8" width="224" height="504" rx="18" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
                </g>

                <!-- 3. The Hand (Interaction Layer - Fingers) -->
                <!-- Fingers wrap around the RIGHT side of the phone -->
                <g id="hand-front">
                    
                    <!-- Palm Base (Right side connection) -->
                    <path d="M 450,550 Q 550,550 600,750 L 650,950 L 450,950 Z" fill="url(#skinBase)" />

                    <!-- Finger 1 (Index) -->
                    <g transform="translate(505, 380) rotate(15)">
                        <!-- Phalanx -->
                        <path d="M 0,0 C 30,-10 50,20 40,70 C 30,90 0,80 0,0 Z" fill="url(#skinBase)" />
                        <!-- Knuckle -->
                        <circle cx="15" cy="20" r="16" fill="url(#skinDark)" opacity="0.4" />
                        <!-- Nail -->
                        <ellipse cx="15" cy="65" rx="10" ry="14" fill="#e0c0b0" opacity="0.9" filter="url(#contactShadow)"/>
                        <!-- Contact Shadow on Phone (Simulated) -->
                        <path d="M -5,0 L -5,80" stroke="#000" stroke-width="4" opacity="0.2" filter="url(#softBlur)" transform="translate(-5, 0) rotate(-15)"/>
                    </g>

                    <!-- Finger 2 (Middle) -->
                    <g transform="translate(495, 480) rotate(10)">
                        <path d="M 0,0 C 30,-10 50,20 40,70 C 30,90 0,80 0,0 Z" fill="url(#skinBase)" />
                        <circle cx="15" cy="20" r="16" fill="url(#skinDark)" opacity="0.4" />
                        <ellipse cx="15" cy="65" rx="10" ry="14" fill="#e0c0b0" opacity="0.9" filter="url(#contactShadow)"/>
                    </g>

                    <!-- Finger 3 (Ring) -->
                    <g transform="translate(505, 580) rotate(5)">
                        <path d="M 0,0 C 30,-10 50,20 40,70 C 30,90 0,80 0,0 Z" fill="url(#skinBase)" />
                        <circle cx="15" cy="20" r="16" fill="url(#skinDark)" opacity="0.4" />
                        <ellipse cx="15" cy="65" rx="10" ry="14" fill="#e0c0b0" opacity="0.9" filter="url(#contactShadow)"/>
                    </g>

                    <!-- Finger 4 (Pinky) -->
                    <g transform="translate(520, 680) rotate(0)">
                        <path d="M 0,0 C 25,-10 40,20 30,60 C 20,80 0,70 0,0 Z" fill="url(#skinBase)" />
                        <circle cx="12" cy="15" r="14" fill="url(#skinDark)" opacity="0.4" />
                        <ellipse cx="12" cy="55" rx="9" ry="12" fill="#e0c0b0" opacity="0.9" filter="url(#contactShadow)"/>
                    </g>

                    <!-- The Thumb (The Focal Point - Left Side) -->
                    <g transform="translate(340, 400) rotate(-20)">
                        <!-- Thenar Eminence (Thumb base muscle) -->
                        <path d="M -40,0 C -80,50 -80,120 -40,180 L -10,180 Z" fill="url(#skinDark)" opacity="0.8" />
                        
                        <!-- Thumb Shaft -->
                        <path d="M -20,0 C 0,60 20,100 20,140 C 20,160 0,160 -10,140 C -20,100 -30,60 -20,0 Z" fill="url(#skinBase)" />
                        
                        <!-- Thumb Joint (IP Joint) -->
                        <circle cx="10" cy="110" r="14" fill="#bfa090" />
                        <path d="M 0,100 Q 15,110 5,120" stroke="#8a6e5e" stroke-width="1.5" fill="none" opacity="0.6" />
                        
                        <!-- Thumb Tip -->
                        <path d="M 20,140 C 30,150 40,160 30,180 C 20,190 0,170 -10,140 Z" fill="url(#fingerTip)" />
                        
                        <!-- Thumbnail (Detailed) -->
                        <path d="M 10,150 Q 25,155 25,175 Q 10,180 5,160 Z" fill="#f2e3d8" opacity="0.95" />
                        <path d="M 10,150 Q 25,155 25,175 Q 10,180 5,160 Z" fill="none" stroke="#dcbfb5" stroke-width="0.5" />
                        
                        <!-- Creases -->
                        <path d="M -10,80 Q 0,90 -5,100" stroke="#8a6e5e" stroke-width="1.5" fill="none" opacity="0.5" />
                    </g>
                </g>

                <!-- 4. Lighting & Shadows (Global) -->
                <g id="lighting">
                    <!-- Cast Shadow from Thumb onto Screen (Critical for depth) -->
                    <!-- Rotated to match the phone's perspective -->
                    <ellipse cx="390" cy="520" rx="35" ry="50" fill="#000" opacity="0.4" filter="url(#softBlur)" transform="rotate(12, 390, 520)" />
                    
                    <!-- Cast Shadow from Fingers onto Screen -->
                    <path d="M 480,400 L 520,400 L 520,700 L 480,700 Z" fill="#000" opacity="0.2" filter="url(#softBlur)" transform="rotate(12, 500, 550)" />

                    <!-- Rim Light / Edge Highlight (Separation from BG) -->
                    <!-- Phone Rim -->
                    <rect x="260" y="160" width="240" height="520" rx="24" fill="none" stroke="url(#rimLight)" stroke-width="2" transform="rotate(12, 380, 420)" opacity="0.8" />
                    
                    <!-- Hand Rim (Right Edge) -->
                    <path d="M 580,950 Q 600,600 500,350" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none" filter="url(#softBlur)" />
                    
                    <!-- Thumb Rim (Left Edge) -->
                    <path d="M 250,450 Q 280,500 300,550" stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none" filter="url(#softBlur)" />
                </g>

                <!-- 5. Foreground Elements (Depth of Field) -->
                <g id="foreground">
                    <!-- Blurry fingers in foreground to create scale -->
                    <path d="M 800,900 L 900,700 L 800,600" stroke="#e6cbb3" stroke-width="40" stroke-linecap="round" filter="url(#heavyBlur)" opacity="0.3" />
                    <circle cx="850" cy="850" r="100" fill="#111" filter="url(#heavyBlur)" opacity="0.5" />
                </g>

            </svg>
        </div>
    </div>

    <script>
        // Interactive Parallax Effect
        document.addEventListener('mousemove', (e) => {
            const svg = document.getElementById('scene');
            const visualStage = document.querySelector('.visual-stage');
            const rect = visualStage.getBoundingClientRect();
            
            // Calculate mouse position relative to the center of the stage
            const x = (e.clientX - rect.left - rect.width / 2) / rect.width;
            const y = (e.clientY - rect.top - rect.height / 2) / rect.height;

            // Apply subtle rotation and translation to the SVG based on mouse
            // Using CSS transform for performance
            // Reduced intensity for a more premium, subtle feel
            const rotateX = y * 5; 
            const rotateY = x * 5;
            const translateX = x * 15;
            const translateY = y * 15;

            svg.style.transition = 'transform 0.1s ease-out';
            svg.style.transform = `perspective(1000px) rotateX(${-rotateX}deg) rotateY(${rotateY}deg) translate(${translateX}px, ${translateY}px)`;
        });

        // Reset on mouse leave
        document.addEventListener('mouseleave', () => {
            const svg = document.getElementById('scene');
            svg.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) translate(0px, 0px)`;
        });
    </script>
</body>
</html>
