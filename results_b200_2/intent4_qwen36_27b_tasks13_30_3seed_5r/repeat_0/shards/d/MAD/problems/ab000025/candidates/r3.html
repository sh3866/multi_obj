<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand & Device Study</title>
    <style>
        :root {
            --bg-color: #050505;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .stage {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 70% 40%, #1a1a1a 0%, #000000 80%);
        }

        /* Noise Texture for Print Quality */
        .noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.06;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Vignette for Atmosphere */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9;
            background: radial-gradient(circle at center, transparent 30%, #000000 100%);
        }

        svg {
            width: 100%;
            height: 100%;
            max-width: 1000px;
            max-height: 1200px;
            will-change: transform;
            transition: transform 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            filter: drop-shadow(0 20px 50px rgba(0,0,0,0.8));
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="noise"></div>
        <div class="vignette"></div>

        <svg id="scene" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Skin Gradients (Natural, directional lighting from Top-Right) -->
                <linearGradient id="skinGradient" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#7a5240" />
                    <stop offset="40%" stop-color="#b07d65" />
                    <stop offset="80%" stop-color="#e3c2a6" />
                    <stop offset="100%" stop-color="#f3dcc8" />
                </linearGradient>

                <!-- Deep Shadow Gradient for Folds -->
                <linearGradient id="foldShadow" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#4a2e22" stop-opacity="0.9"/>
                    <stop offset="100%" stop-color="#2a1610" stop-opacity="0.4"/>
                </linearGradient>

                <!-- Device Gradients (Titanium/Metallic) -->
                <linearGradient id="deviceBody" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#3a3a3e" />
                    <stop offset="20%" stop-color="#1a1a1c" />
                    <stop offset="100%" stop-color="#000000" />
                </linearGradient>

                <!-- Screen (OLED Black with subtle reflection) -->
                <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#0d1117" />
                    <stop offset="100%" stop-color="#000000" />
                </linearGradient>

                <!-- Glass Reflection (Diagonal) -->
                <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0)" />
                    <stop offset="45%" stop-color="rgba(255,255,255,0)" />
                    <stop offset="50%" stop-color="rgba(255,255,255,0.12)" />
                    <stop offset="52%" stop-color="rgba(255,255,255,0)" />
                    <stop offset="100%" stop-color="rgba(255,255,255,0)" />
                </linearGradient>

                <!-- Filters -->
                <filter id="blurSmall" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" />
                </filter>
                <filter id="blurLarge" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="20" />
                </filter>
                <filter id="contactShadow">
                    <feGaussianBlur stdDeviation="4" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="1.5"/>
                    </feComponentTransfer>
                </filter>
            </defs>

            <!-- 1. The Device -->
            <!-- Positioned slightly right, angled -->
            <g id="device" transform="translate(380, 120) rotate(12)">
                
                <!-- Drop Shadow (Cast on background) -->
                <rect x="30" y="30" width="240" height="560" rx="28" fill="#000" opacity="0.8" filter="url(#blurLarge)" />

                <!-- Device Body -->
                <rect x="0" y="0" width="240" height="560" rx="28" fill="url(#deviceBody)" />
                
                <!-- Hardware Buttons (Volume/Power) -->
                <rect x="238" y="120" width="4" height="40" rx="2" fill="#222" />
                <rect x="238" y="170" width="4" height="40" rx="2" fill="#222" />
                <rect x="-2" y="150" width="4" height="50" rx="2" fill="#222" />

                <!-- Bezel Highlight -->
                <rect x="0" y="0" width="240" height="560" rx="28" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

                <!-- Screen Area -->
                <rect x="10" y="10" width="220" height="540" rx="20" fill="url(#screenGlow)" />

                <!-- Screen Content (Abstract UI) -->
                <g opacity="0.6">
                    <!-- Notch/Dynamic Island -->
                    <rect x="85" y="15" width="70" height="20" rx="10" fill="#000" />
                    
                    <!-- Widget Area -->
                    <rect x="25" y="80" width="190" height="100" rx="16" fill="#1a1a1a" opacity="0.5" />
                    <circle cx="50" cy="130" r="15" fill="#333" />
                    <rect x="75" y="115" width="80" height="6" rx="3" fill="#444" />
                    <rect x="75" y="130" width="50" height="4" rx="2" fill="#333" />

                    <!-- List Items -->
                    <rect x="25" y="210" width="190" height="60" rx="12" fill="#1a1a1a" opacity="0.3" />
                    <rect x="25" y="285" width="190" height="60" rx="12" fill="#1a1a1a" opacity="0.3" />
                    <rect x="25" y="360" width="190" height="60" rx="12" fill="#1a1a1a" opacity="0.3" />
                </g>

                <!-- Camera Module (Floating on back, but visible due to angle) -->
                <!-- Actually, let's put camera on the back. We see the front screen. -->
                <!-- Correction: The prompt asks for camera details. Let's assume the hand is holding it such that we see the back, OR the hand is holding it from the side. -->
                <!-- Let's switch to BACK VIEW to show camera bump, it's more editorial. -->
                
                <!-- OVERLAY: Back Cover -->
                <rect x="0" y="0" width="240" height="560" rx="28" fill="#080808" />
                
                <!-- Camera Bump -->
                <g transform="translate(20, 20)">
                    <rect x="0" y="0" width="100" height="100" rx="24" fill="#111" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
                    <!-- Lenses -->
                    <circle cx="30" cy="30" r="18" fill="#000" stroke="#222" stroke-width="1" />
                    <circle cx="30" cy="30" r="8" fill="#0a0a0a" />
                    <circle cx="30" cy="30" r="2" fill="#333" /> <!-- Reflection -->
                    
                    <circle cx="70" cy="30" r="18" fill="#000" stroke="#222" stroke-width="1" />
                    <circle cx="70" cy="30" r="8" fill="#0a0a0a" />
                    
                    <circle cx="30" cy="70" r="18" fill="#000" stroke="#222" stroke-width="1" />
                    <circle cx="30" cy="70" r="8" fill="#0a0a0a" />
                    
                    <!-- Flash -->
                    <circle cx="70" cy="70" r="6" fill="#444" />
                </g>

                <!-- Glass Reflection (Front glass reflection even on back view? No, just gloss finish) -->
                <path d="M 0,0 L 240,0 L 240,300 L 60,560 L 0,560 Z" fill="url(#glassReflection)" style="mix-blend-mode: overlay;" pointer-events="none" />
            </g>

            <!-- 2. The Hand (Reconstructed Anatomy) -->
            <!-- Hand wraps from Right to Left around the device -->
            <g id="hand" transform="translate(0, 50)">
                
                <!-- Arm/Palm Base (Right side, blurred at edge) -->
                <path d="M 650,100 Q 850,500 850,900 L 650,900 Z" fill="url(#skinGradient)" filter="url(#blurSmall)" opacity="0.8" />
                <!-- Solid Palm connecting to fingers -->
                <path d="M 600,200 Q 750,400 750,800 L 620,800 Q 580,500 600,200 Z" fill="url(#skinGradient)" />

                <!-- Fingers Wrapping (Right Side -> Left Side) -->
                <!-- Using continuous paths for organic feel -->
                
                <!-- Index Finger (Top) -->
                <g id="index-finger" transform="translate(580, 250)">
                    <!-- Main Finger Body -->
                    <path d="M 0,-20 C 60,-20 80,40 60,120 C 50,140 20,130 0,100 Z" fill="url(#skinGradient)" />
                    <!-- Knuckle Crease (Back of hand) -->
                    <path d="M 10,-10 Q 25,10 10,30" stroke="#5a3a2a" stroke-width="2" fill="none" opacity="0.6" />
                    <!-- Nail Bed (Visible on top side) -->
                    <path d="M 50,110 Q 60,120 55,135 Q 40,125 50,110 Z" fill="#dcb5a3" opacity="0.9" />
                    <!-- Contact Shadow on Phone -->
                    <path d="M 60,50 Q 40,100 20,120" stroke="#000" stroke-width="8" filter="url(#contactShadow)" opacity="0.7" />
                </g>

                <!-- Middle Finger -->
                <g id="middle-finger" transform="translate(570, 350)">
                    <path d="M 0,-20 C 70,-20 90,50 70,140 C 60,160 20,150 0,120 Z" fill="url(#skinGradient)" />
                    <path d="M 10,-10 Q 30,10 15,35" stroke="#5a3a2a" stroke-width="2" fill="none" opacity="0.6" />
                    <path d="M 60,130 Q 70,140 65,155 Q 50,145 60,130 Z" fill="#dcb5a3" opacity="0.9" />
                    <path d="M 70,60 Q 50,110 30,140" stroke="#000" stroke-width="8" filter="url(#contactShadow)" opacity="0.7" />
                </g>

                <!-- Ring Finger -->
                <g id="ring-finger" transform="translate(580, 450)">
                    <path d="M 0,-20 C 60,-20 80,40 60,130 C 50,150 20,140 0,110 Z" fill="url(#skinGradient)" />
                    <path d="M 10,-10 Q 25,10 10,30" stroke="#5a3a2a" stroke-width="2" fill="none" opacity="0.6" />
                    <path d="M 50,120 Q 60,130 55,145 Q 40,135 50,120 Z" fill="#dcb5a3" opacity="0.9" />
                    <path d="M 60,50 Q 40,100 20,130" stroke="#000" stroke-width="8" filter="url(#contactShadow)" opacity="0.7" />
                </g>

                <!-- Pinky Finger -->
                <g id="pinky-finger" transform="translate(600, 550)">
                    <path d="M 0,-20 C 50,-20 70,30 50,110 C 40,130 10,120 0,90 Z" fill="url(#skinGradient)" />
                    <path d="M 10,-10 Q 20,10 10,25" stroke="#5a3a2a" stroke-width="2" fill="none" opacity="0.6" />
                    <path d="M 40,100 Q 50,110 45,125 Q 30,115 40,100 Z" fill="#dcb5a3" opacity="0.9" />
                    <path d="M 50,40 Q 30,90 10,110" stroke="#000" stroke-width="8" filter="url(#contactShadow)" opacity="0.7" />
                </g>

                <!-- The Thumb (Focal Point - Left Side) -->
                <!-- Originates from bottom right, crosses over to left -->
                <g id="thumb" transform="translate(500, 650) rotate(-45)">
                    
                    <!-- Thenar Eminence (Base) -->
                    <path d="M -40,-40 C -80,0 -60,100 -20,120 L 20,120 Z" fill="url(#skinGradient)" />
                    
                    <!-- Thumb Shaft (Proximal Phalanx) -->
                    <path d="M 0,0 C 20,60 40,120 50,160 C 60,180 30,180 10,160 C -10,120 -20,60 0,0 Z" fill="url(#skinGradient)" />
                    
                    <!-- IP Joint (Knuckle) -->
                    <circle cx="30" cy="130" r="18" fill="url(#skinGradient)" />
                    <!-- Joint Crease -->
                    <path d="M 15,115 Q 35,130 25,145" stroke="#5a3a2a" stroke-width="2" fill="none" opacity="0.8" />
                    
                    <!-- Distal Phalanx (Tip) -->
                    <path d="M 10,160 C 20,190 40,210 60,200 C 70,190 60,160 50,160 Z" fill="url(#skinGradient)" />
                    
                    <!-- Thumbnail (Detailed) -->
                    <g transform="translate(45, 175) rotate(10)">
                        <!-- Nail Plate -->
                        <path d="M 0,0 C 10,-5 20,5 15,20 C 10,30 -5,25 -5,10 Z" fill="#e8dcd5" opacity="0.9" />
                        <!-- Lunula (Moon) -->
                        <path d="M 0,10 Q 5,15 10,10" stroke="#d0c0b5" stroke-width="1" fill="none" />
                        <!-- Shine -->
                        <path d="M 2,2 L 12,2" stroke="#fff" stroke-width="1" opacity="0.5" />
                    </g>

                    <!-- Rim Light on Thumb Edge -->
                    <path d="M 10,160 C 20,190 40,210 60,200" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" filter="url(#blurSmall)" />
                    
                    <!-- Shadow cast by thumb onto device -->
                    <path d="M 20,120 L 20,180" stroke="#000" stroke-width="12" filter="url(#contactShadow)" opacity="0.6" transform="rotate(45, 20, 120)" />
                </g>

            </g>

            <!-- 3. Lighting & Atmosphere Overlays -->
            
            <!-- Soft global rim light on the left side of the hand to separate from dark background -->
            <path d="M 400,300 Q 350,500 420,700" stroke="rgba(255,255,255,0.1)" stroke-width="15" fill="none" filter="url(#blurSmall)" />
            
            <!-- Specular highlights on knuckles (Right side fingers) -->
            <circle cx="620" cy="300" r="5" fill="#fff" opacity="0.3" filter="url(#blurSmall)" />
            <circle cx="610" cy="400" r="6" fill="#fff" opacity="0.3" filter="url(#blurSmall)" />
            <circle cx="620" cy="500" r="5" fill="#fff" opacity="0.3" filter="url(#blurSmall)" />

        </svg>
    </div>

    <script>
        // Enhanced Parallax Interaction
        document.addEventListener('mousemove', (e) => {
            const svg = document.getElementById('scene');
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            // Normalize mouse position (-1 to 1)
            const x = (e.clientX / width) * 2 - 1;
            const y = (e.clientY / height) * 2 - 1;

            // Apply movement
            // Move slightly opposite to mouse for depth
            const moveX = -x * 15; 
            const moveY = -y * 15;
            
            // Apply subtle rotation
            const rotate = x * 3;

            svg.style.transform = `translate(${moveX}px, ${moveY}px) rotate(${rotate}deg) scale(1.02)`;
        });

        // Reset on leave
        document.addEventListener('mouseleave', () => {
            const svg = document.getElementById('scene');
            svg.style.transform = `translate(0px, 0px) rotate(0deg) scale(1)`;
        });
    </script>
</body>
</html>
