<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Hand Study</title>
    <style>
        :root {
            --bg-dark: #080808;
            --bg-accent: #141414;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .stage {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Subtle radial spotlight */
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000000 70%);
        }

        /* Grain for Film Look */
        .noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Deep Vignette */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9;
            background: radial-gradient(circle at 50% 50%, transparent 40%, #000000 100%);
        }

        svg {
            width: 100%;
            height: 100%;
            max-width: 900px; /* tighter constraint for close-up feel */
            max-height: 1100px;
            will-change: transform;
            /* Smooth interaction */
            transition: transform 0.1s linear; 
            filter: drop-shadow(0 30px 60px rgba(0,0,0,0.9));
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="noise"></div>
        <div class="vignette"></div>

        <!-- ViewBox adjusted to center the action (400x600 area) -->
        <svg id="scene" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Skin: Natural Warmth, Directional Lighting (Top Right) -->
                <linearGradient id="skinGradient" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#5e3b2f" />
                    <stop offset="30%" stop-color="#9c664f" />
                    <stop offset="80%" stop-color="#e0b69a" />
                    <stop offset="100%" stop-color="#f2d4bd" />
                </linearGradient>

                <!-- Skin Shadow (Crevices) -->
                <linearGradient id="skinShadow" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#3a221a" stop-opacity="0.9"/>
                    <stop offset="100%" stop-color="#2a1510" stop-opacity="0.6"/>
                </linearGradient>

                <!-- Device: Titanium Dark Grey -->
                <linearGradient id="deviceBody" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#4a4a4e" />
                    <stop offset="15%" stop-color="#2a2a2c" />
                    <stop offset="100%" stop-color="#111113" />
                </linearGradient>

                <!-- Device Edge Highlight -->
                <linearGradient id="edgeHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0.3)" />
                    <stop offset="100%" stop-color="rgba(255,255,255,0)" />
                </linearGradient>

                <!-- Screen: Deep OLED -->
                <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#050505" />
                    <stop offset="100%" stop-color="#000000" />
                </linearGradient>

                <!-- Glass Reflection -->
                <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0)" />
                    <stop offset="48%" stop-color="rgba(255,255,255,0)" />
                    <stop offset="50%" stop-color="rgba(255,255,255,0.15)" />
                    <stop offset="52%" stop-color="rgba(255,255,255,0)" />
                    <stop offset="100%" stop-color="rgba(255,255,255,0)" />
                </linearGradient>

                <!-- Filters -->
                <filter id="blurSmall" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="2" />
                </filter>
                <filter id="blurLarge" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="25" />
                </filter>
                
                <!-- Contact Shadow Filter -->
                <filter id="contactShadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="4" result="blur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="1.8"/>
                    </feComponentTransfer>
                </filter>
                
                <!-- Soft Shadow for Depth -->
                <filter id="softShadow">
                    <feGaussianBlur stdDeviation="8" />
                </filter>
            </defs>

            <!-- GROUP: Entire Hand & Phone Unit -->
            <!-- Centered at 400, 500 -->
            <g id="main-composition" transform="translate(0, 50)">

                <!-- 1. The Device (Back View) -->
                <!-- Positioned Center-Left to allow hand to wrap from Right -->
                <g id="device" transform="translate(320, 200) rotate(-5)">
                    
                    <!-- Device Drop Shadow -->
                    <rect x="40" y="40" width="260" height="580" rx="32" fill="#000" opacity="0.9" filter="url(#blurLarge)" />

                    <!-- Device Body -->
                    <rect x="0" y="0" width="260" height="580" rx="32" fill="url(#deviceBody)" />
                    
                    <!-- Hardware Buttons (Left side visible) -->
                    <rect x="-3" y="160" width="4" height="50" rx="2" fill="#222" /> <!-- Mute -->
                    <rect x="-3" y="230" width="4" height="60" rx="2" fill="#222" /> <!-- Vol Up -->
                    <rect x="-3" y="310" width="4" height="60" rx="2" fill="#222" /> <!-- Vol Down -->

                    <!-- Edge Bevel (Rim Light) -->
                    <rect x="0" y="0" width="260" height="580" rx="32" fill="none" stroke="url(#edgeHighlight)" stroke-width="1.5" />

                    <!-- Back Glass Texture -->
                    <rect x="0" y="0" width="260" height="580" rx="32" fill="url(#glassReflection)" style="mix-blend-mode: overlay;" pointer-events="none" />

                    <!-- Camera Module (Prominent) -->
                    <g transform="translate(20, 25)">
                        <!-- Bump Base -->
                        <rect x="0" y="0" width="110" height="110" rx="26" fill="#0a0a0a" stroke="rgba(255,255,255,0.1)" stroke-width="1" filter="url(#softShadow)"/>
                        
                        <!-- Lens 1 (Top Left) -->
                        <circle cx="35" cy="35" r="22" fill="#000" stroke="#222" stroke-width="1" />
                        <circle cx="35" cy="35" r="10" fill="#050505" />
                        <path d="M 25,25 A 14 14 0 0 1 40,25" stroke="rgba(255,255,255,0.3)" stroke-width="1" fill="none" /> <!-- Glare -->

                        <!-- Lens 2 (Top Right) -->
                        <circle cx="75" cy="35" r="22" fill="#000" stroke="#222" stroke-width="1" />
                        <circle cx="75" cy="35" r="10" fill="#050505" />

                        <!-- Lens 3 (Bottom Left) -->
                        <circle cx="35" cy="75" r="22" fill="#000" stroke="#222" stroke-width="1" />
                        <circle cx="35" cy="75" r="10" fill="#050505" />
                        
                        <!-- Flash/Sensor -->
                        <circle cx="75" cy="75" r="6" fill="#333" />
                        <circle cx="75" cy="75" r="3" fill="#111" />
                    </g>
                </g>

                <!-- 2. The Hand (Anatomical Reconstruction) -->
                <!-- Hand wraps from Right side over to Left/Bottom -->
                <g id="hand" transform="translate(0, 0)">
                    
                    <!-- Arm Base (Entering from bottom right) -->
                    <path d="M 700,800 L 850,850 L 850,1000 L 600,1000 Z" fill="url(#skinGradient)" />
                    <path d="M 700,800 L 850,850 L 850,1000 L 600,1000 Z" fill="url(#skinShadow)" opacity="0.3" />

                    <!-- Palm Base (Connecting fingers to wrist) -->
                    <!-- Overlaps device edge slightly to show grip -->
                    <path d="M 580,250 Q 750,400 750,800 Q 650,850 550,750 Q 550,500 580,250 Z" fill="url(#skinGradient)" />
                    
                    <!-- Palm Creases (Thenar Eminence) -->
                    <path d="M 580,600 Q 620,650 650,700" stroke="#5a3a2a" stroke-width="3" fill="none" opacity="0.5" filter="url(#blurSmall)" />

                    <!-- FINGERS: Wrapping around the right edge of the device -->
                    <!-- Device Right Edge is approx at X=580 (at rotation) -->

                    <!-- Index Finger (Top) -->
                    <g transform="translate(580, 280) rotate(10)">
                        <!-- Contact Shadow on Phone -->
                        <rect x="-10" y="0" width="20" height="120" fill="#000" filter="url(#contactShadow)" opacity="0.6" />
                        
                        <!-- Finger Body -->
                        <path d="M -10,-20 C 30,-20 60,30 40,120 C 30,140 10,130 -10,110 Z" fill="url(#skinGradient)" />
                        
                        <!-- Knuckle Detail -->
                        <circle cx="10" cy="0" r="12" fill="url(#skinGradient)" />
                        <path d="M 0,-5 Q 10,0 0,10" stroke="#5a3a2a" stroke-width="2" fill="none" opacity="0.6" />
                        
                        <!-- Nail (Semi-transparent, curved) -->
                        <path d="M 20,110 Q 35,115 30,125 Q 15,120 20,110 Z" fill="rgba(255,255,255,0.2)" />
                        <path d="M 22,112 Q 30,115 28,122" stroke="#fff" stroke-width="1" opacity="0.6" fill="none" />
                    </g>

                    <!-- Middle Finger (Middle) -->
                    <g transform="translate(585, 380) rotate(5)">
                        <!-- Contact Shadow -->
                        <rect x="-10" y="0" width="20" height="120" fill="#000" filter="url(#contactShadow)" opacity="0.6" />

                        <!-- Finger Body -->
                        <path d="M -10,-20 C 30,-20 60,40 40,130 C 30,150 10,140 -10,120 Z" fill="url(#skinGradient)" />
                        
                        <!-- Knuckle Detail -->
                        <circle cx="10" cy="0" r="13" fill="url(#skinGradient)" />
                        <path d="M 0,-5 Q 12,0 0,12" stroke="#5a3a2a" stroke-width="2" fill="none" opacity="0.6" />

                        <!-- Nail -->
                        <path d="M 20,120 Q 35,125 30,135 Q 15,130 20,120 Z" fill="rgba(255,255,255,0.2)" />
                        <path d="M 22,122 Q 30,125 28,132" stroke="#fff" stroke-width="1" opacity="0.6" fill="none" />
                    </g>

                    <!-- Ring Finger (Lower) -->
                    <g transform="translate(580, 480) rotate(0)">
                        <!-- Contact Shadow -->
                        <rect x="-10" y="0" width="20" height="120" fill="#000" filter="url(#contactShadow)" opacity="0.6" />

                        <!-- Finger Body -->
                        <path d="M -10,-20 C 30,-20 60,30 40,120 C 30,140 10,130 -10,110 Z" fill="url(#skinGradient)" />
                        
                        <!-- Knuckle Detail -->
                        <circle cx="10" cy="0" r="12" fill="url(#skinGradient)" />
                        <path d="M 0,-5 Q 10,0 0,10" stroke="#5a3a2a" stroke-width="2" fill="none" opacity="0.6" />

                        <!-- Nail -->
                        <path d="M 20,110 Q 35,115 30,125 Q 15,120 20,110 Z" fill="rgba(255,255,255,0.2)" />
                    </g>

                    <!-- Pinky Finger (Bottom) -->
                    <g transform="translate(570, 570) rotate(-10)">
                        <!-- Contact Shadow -->
                        <rect x="-10" y="0" width="20" height="100" fill="#000" filter="url(#contactShadow)" opacity="0.6" />

                        <!-- Finger Body -->
                        <path d="M -10,-20 C 25,-20 50,20 35,100 C 25,120 5,110 -10,90 Z" fill="url(#skinGradient)" />
                        
                        <!-- Knuckle Detail -->
                        <circle cx="10" cy="0" r="11" fill="url(#skinGradient)" />

                        <!-- Nail -->
                        <path d="M 15,90 Q 28,95 25,105 Q 12,100 15,90 Z" fill="rgba(255,255,255,0.2)" />
                    </g>

                    <!-- THE THUMB (Focal Point) -->
                    <!-- Originates from right palm, crosses over device face to left edge -->
                    <g id="thumb" transform="translate(600, 700)">
                        
                        <!-- Shadow Cast by Thumb onto Device Face -->
                        <!-- This creates the "Grip" illusion -->
                        <path d="M 0,0 C -50,-100 -100,-200 -120,-250 C -140,-280 -100,-300 -80,-270 C -50,-200 0,-50 0,0 Z" 
                              fill="#000" opacity="0.4" filter="url(#contactShadow)" />

                        <!-- Thenar Eminence (Base) -->
                        <path d="M 0,0 C -20,50 -10,100 20,120 L 60,120 Z" fill="url(#skinGradient)" />
                        
                        <!-- Thumb Shaft -->
                        <!-- Curving UP and LEFT -->
                        <path d="M 10,10 C -30,50 -80,100 -100,180 C -120,220 -100,250 -60,240 C -30,230 -10,180 20,120 Z" fill="url(#skinGradient)" />
                        
                        <!-- IP Joint (Knuckle) -->
                        <circle cx="-90" cy="180" r="22" fill="url(#skinGradient)" />
                        <!-- Joint Crease -->
                        <path d="M -110,165 Q -90,180 -105,195" stroke="#5a3a2a" stroke-width="3" fill="none" opacity="0.7" filter="url(#blurSmall)" />
                        
                        <!-- Distal Phalanx (Tip) -->
                        <path d="M -100,180 C -120,220 -100,250 -60,240 C -40,235 -50,200 -80,180 Z" fill="url(#skinGradient)" />
                        
                        <!-- Thumbnail (Detailed) -->
                        <g transform="translate(-85, 210) rotate(-20)">
                            <!-- Nail Plate -->
                            <path d="M 0,0 C 10,-8 25,2 20,25 C 15,35 -5,30 -10,15 Z" fill="rgba(255,255,255,0.25)" />
                            <!-- Lunula -->
                            <path d="M -5,15 Q 5,25 15,15" stroke="#fff" stroke-width="1" opacity="0.3" fill="none" />
                            <!-- Specular Highlight -->
                            <path d="M 2,2 L 12,2" stroke="#fff" stroke-width="1.5" opacity="0.7" filter="url(#blurSmall)" />
                        </g>

                        <!-- Rim Light on Thumb Edge -->
                        <path d="M -100,180 C -120,220 -100,250 -60,240" stroke="rgba(255,255,255,0.3)" stroke-width="2" fill="none" filter="url(#blurSmall)" />
                    </g>

                </g>

                <!-- 3. Global Lighting & Atmosphere -->
                
                <!-- Specular highlights on Knuckles (Right side fingers) -->
                <!-- High contrast to define volume -->
                <ellipse cx="595" cy="280" rx="4" ry="8" fill="#fff" opacity="0.4" filter="url(#blurSmall)" transform="rotate(10, 595, 280)" />
                <ellipse cx="600" cy="380" rx="5" ry="9" fill="#fff" opacity="0.4" filter="url(#blurSmall)" transform="rotate(5, 600, 380)" />
                <ellipse cx="595" cy="480" rx="4" ry="8" fill="#fff" opacity="0.4" filter="url(#blurSmall)" />
                <ellipse cx="585" cy="570" rx="3" ry="7" fill="#fff" opacity="0.4" filter="url(#blurSmall)" transform="rotate(-10, 585, 570)" />

                <!-- Specular Highlight on Thumb Knuckle -->
                <ellipse cx="-100" cy="170" rx="5" ry="5" fill="#fff" opacity="0.5" filter="url(#blurSmall)" transform="translate(500, 530)" />

            </g>
        </svg>
    </div>

    <script>
        // Subtle Parallax Interaction
        document.addEventListener('mousemove', (e) => {
            const svg = document.getElementById('scene');
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            // Normalize mouse position (-1 to 1)
            const x = (e.clientX / width) * 2 - 1;
            const y = (e.clientY / height) * 2 - 1;

            // Apply movement (Opposite to mouse for depth)
            const moveX = -x * 20; 
            const moveY = -y * 20;
            
            // Apply subtle rotation
            const rotate = x * 2;

            svg.style.transform = `translate(${moveX}px, ${moveY}px) rotate(${rotate}deg) scale(1.05)`;
        });

        // Reset on leave
        document.addEventListener('mouseleave', () => {
            const svg = document.getElementById('scene');
            svg.style.transform = `translate(0px, 0px) rotate(0deg) scale(1.05)`;
        });
    </script>
</body>
</html>
