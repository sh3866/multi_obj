<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Close-Up Study</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Full bleed container */
        .stage {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Grain Overlay for Film/Print look */
        .noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Vignette */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9;
            background: radial-gradient(circle at center, transparent 40%, #000000 120%);
        }

        svg {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 1200px;
            /* Hardware acceleration for smooth parallax */
            will-change: transform;
            transition: transform 0.1s ease-out;
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="noise"></div>
        <div class="vignette"></div>

        <!-- 
             REVISION NOTES:
             1. ViewBox cropped to focus on the "Action Area" (Knuckles to Screen).
             2. Hand geometry re-rendered with continuous curves (organic) instead of segments.
             3. Unified lighting: Light source top-right.
             4. Contact shadows added between fingers and phone body.
        -->
        <svg id="scene" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Skin Gradients (Warm, directional) -->
                <linearGradient id="skinGradient" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#8c604a" />
                    <stop offset="40%" stop-color="#b88a72" />
                    <stop offset="100%" stop-color="#e8cbb8" />
                </linearGradient>
                
                <linearGradient id="skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#5e3b2b" />
                    <stop offset="100%" stop-color="#3a2218" />
                </linearGradient>

                <!-- Device Gradients (Cool, metallic) -->
                <linearGradient id="deviceBody" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#2a2a2e" />
                    <stop offset="50%" stop-color="#121214" />
                    <stop offset="100%" stop-color="#050505" />
                </linearGradient>

                <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#1a202c" />
                    <stop offset="50%" stop-color="#0d1117" />
                    <stop offset="100%" stop-color="#000000" />
                </linearGradient>

                <!-- Reflections -->
                <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0)" />
                    <stop offset="45%" stop-color="rgba(255,255,255,0)" />
                    <stop offset="50%" stop-color="rgba(255,255,255,0.08)" />
                    <stop offset="55%" stop-color="rgba(255,255,255,0)" />
                    <stop offset="100%" stop-color="rgba(255,255,255,0)" />
                </linearGradient>

                <!-- Filters -->
                <filter id="blurSmall" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="4" />
                </filter>
                <filter id="blurLarge" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="15" />
                </filter>
                <filter id="contactShadowBlur">
                    <feGaussianBlur stdDeviation="2" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.8"/>
                    </feComponentTransfer>
                </filter>
            </defs>

            <!-- 1. Background / Depth -->
            <rect width="100%" height="100%" fill="#08080a" />
            <!-- Subtle ambient light behind hand -->
            <circle cx="400" cy="500" r="300" fill="#ffffff" opacity="0.03" filter="url(#blurLarge)" />

            <!-- 2. The Device (Centered) -->
            <!-- Shifted slightly right to allow thumb interaction on left -->
            <g id="device" transform="translate(350, 100) rotate(6)">
                
                <!-- Device Shadow (Cast onto background/other fingers) -->
                <rect x="20" y="20" width="260" height="580" rx="30" fill="#000" opacity="0.6" filter="url(#blurLarge)" />

                <!-- Device Chassis -->
                <rect x="0" y="0" width="260" height="580" rx="30" fill="url(#deviceBody)" />
                
                <!-- Device Bezel / Lip -->
                <rect x="0" y="0" width="260" height="580" rx="30" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

                <!-- Screen Surface -->
                <rect x="8" y="8" width="244" height="564" rx="24" fill="url(#screenGlow)" />

                <!-- Screen UI (Abstract, Dark Mode) -->
                <g opacity="0.3">
                    <!-- Time -->
                    <rect x="30" y="40" width="40" height="15" rx="4" fill="#fff" />
                    <!-- Widget -->
                    <rect x="20" y="100" width="220" height="120" rx="16" fill="#ffffff" opacity="0.1" />
                    <rect x="40" y="130" width="100" height="10" rx="5" fill="#fff" opacity="0.5" />
                    <!-- App Grid -->
                    <circle cx="40" cy="280" r="20" fill="#fff" opacity="0.2" />
                    <circle cx="80" cy="280" r="20" fill="#fff" opacity="0.2" />
                    <circle cx="120" cy="280" r="20" fill="#fff" opacity="0.2" />
                </g>

                <!-- Camera Module (Top Left) -->
                <g transform="translate(20, 20)">
                    <rect x="0" y="0" width="70" height="70" rx="16" fill="#000" stroke="#333" stroke-width="1" />
                    <!-- Lenses -->
                    <circle cx="25" cy="25" r="12" fill="#050505" stroke="#222" stroke-width="2" />
                    <circle cx="25" cy="25" r="4" fill="#111" />
                    <circle cx="55" cy="25" r="12" fill="#050505" stroke="#222" stroke-width="2" />
                    <circle cx="25" cy="55" r="12" fill="#050505" stroke="#222" stroke-width="2" />
                    <!-- Flash -->
                    <circle cx="55" cy="55" r="4" fill="#444" />
                </g>

                <!-- Glass Specular Highlight -->
                <path d="M 8,8 L 252,8 L 252,300 L 80,572 L 8,572 Z" fill="url(#glassReflection)" style="mix-blend-mode: screen;" pointer-events="none" />
            </g>

            <!-- 3. The Hand (Organic, Detailed) -->
            <!-- Positioned to wrap around the device -->
            <g id="hand" transform="translate(0, 50)">
                
                <!-- Shadow cast by hand onto device (Simulated via dark overlay on device area) -->
                <!-- This creates the "contact" feel -->
                <path d="M 520,150 Q 580,500 520,800" stroke="#000" stroke-width="30" fill="none" opacity="0.4" filter="url(#blurSmall)" transform="translate(0, 50)" />

                <!-- Palm Base (Right side, extending off canvas) -->
                <path d="M 550,200 Q 700,400 750,800 L 850,800 L 850,200 Z" fill="url(#skinGradient)" />
                
                <!-- Fingers Wrapping (Right Side) -->
                <g id="fingers-right" transform="translate(530, 250) rotate(15)">
                    
                    <!-- Index Finger -->
                    <g transform="translate(0, 0)">
                        <path d="M 0,0 C 40,10 60,50 50,120 C 40,140 0,130 0,0 Z" fill="url(#skinGradient)" />
                        <!-- Knuckle -->
                        <circle cx="20" cy="20" r="18" fill="url(#skinShadow)" opacity="0.5" />
                        <!-- Nail -->
                        <ellipse cx="25" cy="110" rx="12" ry="16" fill="#dcc0b0" opacity="0.8" />
                        <!-- Contact Shadow (Finger to Phone) -->
                        <path d="M -10,0 L -10,130" stroke="#000" stroke-width="6" filter="url(#contactShadowBlur)" opacity="0.6" />
                    </g>

                    <!-- Middle Finger -->
                    <g transform="translate(-10, 100)">
                        <path d="M 0,0 C 45,10 65,60 55,130 C 45,150 0,140 0,0 Z" fill="url(#skinGradient)" />
                        <circle cx="25" cy="25" r="20" fill="url(#skinShadow)" opacity="0.5" />
                        <ellipse cx="28" cy="120" rx="13" ry="17" fill="#dcc0b0" opacity="0.8" />
                        <path d="M -10,0 L -10,140" stroke="#000" stroke-width="6" filter="url(#contactShadowBlur)" opacity="0.6" />
                    </g>

                    <!-- Ring Finger -->
                    <g transform="translate(0, 200)">
                        <path d="M 0,0 C 40,10 60,60 50,130 C 40,150 0,140 0,0 Z" fill="url(#skinGradient)" />
                        <circle cx="20" cy="20" r="19" fill="url(#skinShadow)" opacity="0.5" />
                        <ellipse cx="25" cy="120" rx="12" ry="16" fill="#dcc0b0" opacity="0.8" />
                        <path d="M -10,0 L -10,140" stroke="#000" stroke-width="6" filter="url(#contactShadowBlur)" opacity="0.6" />
                    </g>

                    <!-- Pinky Finger -->
                    <g transform="translate(10, 300)">
                        <path d="M 0,0 C 30,10 50,50 40,110 C 30,130 0,120 0,0 Z" fill="url(#skinGradient)" />
                        <circle cx="15" cy="15" r="16" fill="url(#skinShadow)" opacity="0.5" />
                        <ellipse cx="20" cy="100" rx="11" ry="14" fill="#dcc0b0" opacity="0.8" />
                        <path d="M -10,0 L -10,120" stroke="#000" stroke-width="6" filter="url(#contactShadowBlur)" opacity="0.6" />
                    </g>
                </g>

                <!-- The Thumb (Left Side - Focal Point) -->
                <!-- Detailed anatomy: Thenar eminence, IP joint, nail bed -->
                <g id="thumb" transform="translate(350, 450) rotate(-25)">
                    
                    <!-- Thenar Eminence (Base muscle) -->
                    <path d="M -60,-20 C -100,50 -100,150 -50,200 C -20,220 20,220 50,150 Z" fill="url(#skinGradient)" />
                    
                    <!-- Thumb Shaft -->
                    <path d="M -40,-10 C -20,60 20,100 40,140 C 40,160 10,160 -10,140 C -40,100 -60,40 -40,-10 Z" fill="url(#skinGradient)" />
                    
                    <!-- IP Joint (Knuckle) -->
                    <circle cx="20" cy="110" r="16" fill="url(#skinShadow)" opacity="0.6" />
                    <!-- Joint Crease -->
                    <path d="M 10,100 Q 25,115 15,125" stroke="#7a5a4a" stroke-width="2" fill="none" opacity="0.7" />
                    
                    <!-- Thumb Tip -->
                    <path d="M 40,140 C 55,150 60,170 45,185 C 30,195 10,180 -10,140 Z" fill="url(#skinGradient)" />
                    
                    <!-- Thumbnail -->
                    <path d="M 25,155 Q 45,160 45,180 Q 30,185 20,170 Z" fill="#e8dcd5" opacity="0.95" />
                    <path d="M 25,155 Q 45,160 45,180 Q 30,185 20,170 Z" fill="none" stroke="#bbaea5" stroke-width="0.5" />
                    
                    <!-- Skin Texture Lines (Subtle) -->
                    <path d="M -30,20 Q -10,40 -20,60" stroke="#7a5a4a" stroke-width="1" fill="none" opacity="0.4" />
                    <path d="M -20,80 Q 0,100 -10,120" stroke="#7a5a4a" stroke-width="1" fill="none" opacity="0.4" />

                    <!-- Contact Shadow (Thumb onto Screen) -->
                    <path d="M -20,100 L -20,180" stroke="#000" stroke-width="15" filter="url(#contactShadowBlur)" opacity="0.5" />
                </g>

                <!-- Foreground Depth Blur (Out of focus fingers) -->
                <g opacity="0.4" filter="url(#blurLarge)">
                    <path d="M 600,900 L 700,600 L 650,500" stroke="#b88a72" stroke-width="60" stroke-linecap="round" />
                </g>

            </g>

            <!-- 4. Lighting Overlays (Global) -->
            <!-- Rim light on the left edge of the thumb to separate from dark background -->
            <path d="M 300,500 Q 250,600 280,700" stroke="rgba(255,255,255,0.15)" stroke-width="3" fill="none" filter="url(#blurSmall)" />
            
            <!-- Specular highlight on the knuckles (Right side) -->
            <circle cx="580" cy="400" r="10" fill="#fff" opacity="0.2" filter="url(#blurSmall)" />
            <circle cx="570" cy="500" r="12" fill="#fff" opacity="0.2" filter="url(#blurSmall)" />

        </svg>
    </div>

    <script>
        // Subtle Parallax Interaction
        document.addEventListener('mousemove', (e) => {
            const svg = document.getElementById('scene');
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            // Normalize mouse position (-1 to 1)
            const x = (e.clientX / width) * 2 - 1;
            const y = (e.clientY / height) * 2 - 1;

            // Apply subtle movement
            // Move slightly opposite to mouse for depth
            const moveX = -x * 20; 
            const moveY = -y * 20;
            
            // Apply subtle rotation
            const rotate = x * 2;

            svg.style.transform = `translate(${moveX}px, ${moveY}px) rotate(${rotate}deg) scale(1.05)`;
        });

        // Reset on leave
        document.addEventListener('mouseleave', () => {
            const svg = document.getElementById('scene');
            svg.style.transform = `translate(0px, 0px) rotate(0deg) scale(1)`;
        });
    </script>
</body>
</html>
