<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPINE // DESCENT // REVISED</title>
    <style>
        :root {
            --bg-deep: #020617;
            --bg-mid: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent: #38bdf8;
            --danger: #ef4444;
            --success: #10b981;
            
            --font-display: 'Impact', 'Arial Black', sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Layout & Container --- */
        .screen-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            overflow: hidden;
        }

        /* --- The Visual Scene (SVG) --- */
        .scene-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- UI Overlay --- */
        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- Typography & UI Elements --- */
        
        /* 7. Demote the Title */
        .header {
            width: fit-content;
            opacity: 0.6; /* Lowered opacity */
            transition: opacity 0.3s ease;
        }

        .header:hover {
            opacity: 1;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 2.5rem; /* Reduced scale */
            text-transform: uppercase;
            line-height: 0.9;
            letter-spacing: -1px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--accent);
            margin-top: 0.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* 6. Systematize the HUD (Right) */
        .data-panel {
            align-self: flex-end;
            width: 240px;
            background: rgba(15, 23, 42, 0.6); /* Lower opacity background */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            pointer-events: auto;
            border-radius: 2px;
            
            /* Strict Grid Application */
            display: grid;
            gap: 16px; /* 8px grid multiple */
        }

        .data-row {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 4px;
        }

        .data-label {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-value {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--text-main);
            font-weight: 600; /* Standardized weight */
            text-align: right; /* Right aligned */
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--danger);
            margin-right: 8px;
            box-shadow: 0 0 8px var(--danger);
            animation: pulse 2s infinite;
        }

        .footer {
            align-self: flex-start;
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            opacity: 0.5;
        }

        .compass {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-weight: bold;
            font-size: 0.8rem;
            color: var(--text-muted);
            background: rgba(0,0,0,0.3);
            margin-top: 1rem;
        }

        /* --- Animations --- */
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

    </style>
</head>
<body>

<div class="screen-container">
    
    <!-- Background / Scene SVG -->
    <svg class="scene-layer" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Sky Gradient: Atmospheric Depth -->
            <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
                <stop offset="40%" style="stop-color:#1e293b;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
            </linearGradient>

            <!-- Canopy Gradient: Volumetric 3D feel -->
            <linearGradient id="canopyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#e2e8f0;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#94a3b8;stop-opacity:1" />
            </linearGradient>

            <!-- Depth Blur Filter -->
            <filter id="blurMist">
                <feGaussianBlur in="SourceGraphic" stdDeviation="30" />
            </filter>
        </defs>

        <!-- 1. Sky Background -->
        <rect width="1920" height="1080" fill="url(#skyGradient)" />

        <!-- 2. Distant Landscape (Atmospheric Depth) -->
        <!-- Added per critique: Silhouetted mountains, low opacity -->
        <g id="distant-mountains" opacity="0.5">
            <path d="M0,1080 L0,600 Q300,550 600,700 T1200,600 T1920,750 L1920,1080 Z" 
                  fill="#0f172a" filter="url(#blurMist)" />
            <path d="M0,1080 L0,750 Q500,650 1000,800 T1920,700 L1920,1080 Z" 
                  fill="#1e293b" opacity="0.8" filter="url(#blurMist)" />
        </g>

        <!-- 5. Enhance Motion Cues (Diagonal Wind Streaks) -->
        <!-- Replaced static lines with dynamic diagonal elements -->
        <g id="wind-group"></g>

        <!-- 1. Reconstruct the Cliff Face (Left) -->
        <!-- Multi-layered vector construction, geometric facets -->
        <g id="cliff-group">
            <!-- Base Shape -->
            <path d="M-50,-50 L650,-50 L650,120 L600,180 L680,280 L580,360 L620,450 L520,540 L560,650 L450,750 L500,880 L380,1000 L450,1150 L-50,1200 Z" 
                  fill="#020617" />
            
            <!-- Facet 1 (Lighter, Top Right) -->
            <path d="M-50,-50 L650,-50 L650,120 L600,180 L680,280 L580,360 L620,450 L520,540 L560,650 L450,750 L500,880 L380,1000 L450,1150 L-50,1200 Z" 
                  fill="#1e293b" transform="translate(-20, -20)" opacity="0.8" />
            
            <!-- Facet 2 (Deep Shadow/Crevice) -->
            <path d="M-50,-50 L600,-50 L600,120 L550,180 L630,280 L530,360 L570,450 L470,540 L510,650 L400,750 L450,880 L330,1000 L400,1150 L-50,1200 Z" 
                  fill="#0f172a" transform="translate(-10, -10)" opacity="0.9" />

            <!-- Geological Texture Lines -->
            <g stroke="#020617" stroke-width="2" fill="none" opacity="0.7">
                <path d="M600,180 L550,180 L530,360 L570,450 L470,540 L510,650 L400,750 L450,880 L330,1000" stroke-width="4" />
                <path d="M630,280 L530,360" />
                <path d="M570,450 L470,540" />
                <path d="M510,650 L400,750" />
            </g>

            <!-- Rim Light (Edge highlight) -->
            <path d="M650,-50 L650,120 L600,180 L680,280 L580,360 L620,450 L520,540 L560,650 L450,750 L500,880 L380,1000 L450,1150" 
                  fill="none" stroke="#94a3b8" stroke-width="3" opacity="0.3" />
        </g>

        <!-- 3. Refine Canopy & 4. Clarify Human Figure -->
        <!-- Shifted right for separation, 3D shading, taut lines -->
        <!-- Positioned around x=1200 (Right of center) -->
        <g id="parachuter-group" transform="translate(1200, 350)">
            
            <!-- Canopy: 3D Aware -->
            <g id="canopy">
                <!-- Main Shape -->
                <path class="parachute-canopy" d="M-180,0 C-180,-140 180,-140 180,0 C180,35 90,45 0,45 C-90,45 -180,35 -180,0 Z" 
                      fill="url(#canopyGradient)" />
                
                <!-- Panel Geometry (Adds realism) -->
                <g stroke="#64748b" stroke-width="1.5" fill="none" opacity="0.4">
                    <path d="M0,-120 L0,40" />
                    <path d="M-50,-125 L-25,40" />
                    <path d="M50,-125 L25,40" />
                    <path d="M-100,-115 L-50,40" />
                    <path d="M100,-115 L50,40" />
                    <path d="M-150,-85 L-75,35" />
                    <path d="M150,-85 L75,35" />
                </g>
            </g>

            <!-- Taut Harness Lines -->
            <g stroke="#cbd5e1" stroke-width="1" fill="none" opacity="0.8">
                <!-- Left Side -->
                <line x1="-140" y1="5" x2="-12" y2="190" />
                <line x1="-100" y1="20" x2="-10" y2="190" />
                <line x1="-60" y1="35" x2="-8" y2="190" />
                <!-- Right Side -->
                <line x1="140" y1="5" x2="12" y2="190" />
                <line x1="100" y1="20" x2="10" y2="190" />
                <line x1="60" y1="35" x2="8" y2="190" />
            </g>

            <!-- Harness Block -->
            <rect x="-15" y="185" width="30" height="12" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="1" />

            <!-- Human Figure: Rim Light & Silhouette -->
            <g class="silhouette">
                <!-- Rim Light Stroke (To pop against background) -->
                <g stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.6">
                    <circle cx="0" cy="178" r="10" />
                    <path d="M-10,188 L-10,225 L-18,265 L-22,275" stroke-linecap="round" />
                    <path d="M10,188 L10,225 L18,265 L22,275" stroke-linecap="round" />
                    <path d="M-10,195 C-25,200 -35,215 -30,225" stroke-linecap="round" />
                    <path d="M10,195 C25,200 35,215 30,225" stroke-linecap="round" />
                </g>

                <!-- Solid Fill -->
                <g fill="#020617">
                    <!-- Head -->
                    <circle cx="0" cy="178" r="9" />
                    <!-- Torso -->
                    <path d="M-10,188 L-10,225 L10,225 L10,188 Z" />
                    <!-- Legs -->
                    <path d="M-10,225 L-18,265 L-22,275" stroke="#020617" stroke-width="7" stroke-linecap="round" fill="none" />
                    <path d="M10,225 L18,265 L22,275" stroke="#020617" stroke-width="7" stroke-linecap="round" fill="none" />
                    <!-- Arms -->
                    <path d="M-10,195 C-25,200 -35,215 -30,225" stroke="#020617" stroke-width="6" fill="none" stroke-linecap="round"/>
                    <path d="M10,195 C25,200 35,215 30,225" stroke="#020617" stroke-width="6" fill="none" stroke-linecap="round"/>
                </g>
            </g>
        </g>

    </svg>

    <!-- UI Overlay -->
    <div class="ui-layer">
        
        <!-- 7. Demoted Title -->
        <div class="header">
            <h1>Alpine<br>Descent</h1>
            <div class="subtitle">Operation: Freefall // Sector 4</div>
        </div>

        <!-- 6. Systematized HUD -->
        <div class="data-panel">
            <div class="data-row">
                <span class="data-label">Altitude</span>
                <span class="data-value" id="alt-val">14,200 ft</span>
            </div>
            <div class="data-row">
                <span class="data-label">V. Speed</span>
                <span class="data-value">-24 ft/s</span>
            </div>
            <div class="data-row">
                <span class="data-label">Wind Vec</span>
                <span class="data-value">NW 12mph</span>
            </div>
            <div class="data-row">
                <span class="data-label">Canopy</span>
                <span class="data-value" style="color:var(--success)">NOMINAL</span>
            </div>
            <div class="data-row" style="border:none;">
                <span class="data-label">Proximity</span>
                <span class="data-value"><span class="status-indicator"></span>CAUTION</span>
            </div>
            
            <!-- Filler Data -->
            <div class="data-row">
                <span class="data-label">G-Force</span>
                <span class="data-value">1.02 G</span>
            </div>
            <div class="data-row">
                <span class="data-label">GPS</span>
                <span class="data-value">LOCKED</span>
            </div>
        </div>

        <div class="footer">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <div>
                    <p>SYS.ONLINE</p>
                    <p>RENDER_ENGINE: SVG_V2</p>
                </div>
                <div class="compass">N</div>
            </div>
        </div>
    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const windGroup = document.getElementById('wind-group');
        const parachuter = document.getElementById('parachuter-group');
        const altVal = document.getElementById('alt-val');
        
        // --- Animation State ---
        let time = 0;
        let altitude = 14200;
        
        // --- 5. Generate Diagonal Wind Lines ---
        const windLines = [];
        const numLines = 40;
        
        for(let i=0; i<numLines; i++) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            
            // Random start position
            const startX = Math.random() * 1920;
            const startY = Math.random() * 1080;
            const len = 150 + Math.random() * 250; // Long streaks
            
            // Diagonal angle (approx 15 degrees down)
            // dx = len, dy = len * tan(15deg) approx 0.26 * len
            const dy = len * 0.26;

            line.setAttribute("x1", startX);
            line.setAttribute("y1", startY);
            line.setAttribute("x2", startX + len);
            line.setAttribute("y2", startY + dy);
            
            // Styling for motion blur effect
            line.setAttribute("stroke", "#fff");
            line.setAttribute("stroke-width", "1.5");
            line.setAttribute("stroke-linecap", "round");
            line.setAttribute("opacity", Math.random() * 0.3 + 0.1);
            
            windGroup.appendChild(line);
            
            windLines.push({
                el: line,
                x: startX,
                y: startY,
                dx: len,
                dy: dy,
                speed: 8 + Math.random() * 12 // Fast descent speed
            });
        }

        // --- Main Animation Loop ---
        function animate() {
            time += 0.016;

            // 1. Parachuter Physics (Realistic Bobbing)
            const bobY = Math.sin(time * 1.2) * 10; 
            const swayX = Math.sin(time * 0.6) * 15;
            
            // Descent Cycle
            const descentCycle = (time * 40) % 1000; // Cycle down and reset
            const baseY = 200 + descentCycle; // Start higher up
            
            // Apply transform
            parachuter.setAttribute('transform', `translate(${1200 + swayX}, ${baseY + bobY})`);

            // 2. Wind Animation (Diagonal Flow)
            windLines.forEach(line => {
                line.x += line.speed;
                line.y += line.speed * 0.26; // Move down as we move right

                // Reset if off screen (Right or Bottom)
                if(line.x > 1920 || line.y > 1080) {
                    line.x = -200; // Start off screen left
                    line.y = Math.random() * 1080; // Random height
                }

                line.el.setAttribute("x1", line.x);
                line.el.setAttribute("y1", line.y);
                line.el.setAttribute("x2", line.x + line.dx);
                line.el.setAttribute("y2", line.y + line.dy);
            });

            // 3. Data Update
            altitude -= 0.5;
            if(altitude < 14000) altitude = 14200;
            altVal.innerText = Math.floor(altitude).toLocaleString() + " ft";

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>

</body>
</html>
