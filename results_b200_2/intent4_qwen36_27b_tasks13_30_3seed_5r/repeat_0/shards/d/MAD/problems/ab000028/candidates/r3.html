<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPINE // DESCENT // FINAL</title>
    <style>
        :root {
            --bg-deep: #020617;
            --bg-mid: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent: #38bdf8;
            --danger: #ef4444;
            --success: #10b981;
            
            --font-display: 'Impact', 'Arial Black', sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Layout & Container --- */
        .screen-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            overflow: hidden;
        }

        /* --- The Visual Scene (SVG) --- */
        .scene-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- UI Overlay --- */
        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- Typography & UI Elements --- */
        
        /* 5. Refined Typography & Depth */
        .header {
            width: fit-content;
            /* Background plate for separation */
            background: rgba(2, 6, 23, 0.4);
            backdrop-filter: blur(4px);
            padding: 1rem 1.5rem;
            border-left: 4px solid var(--text-main);
            clip-path: polygon(0 0, 100% 0, 95% 100%, 0% 100%);
        }

        h1 {
            font-family: var(--font-display);
            font-size: 4rem; /* Increased scale for impact */
            text-transform: uppercase;
            line-height: 0.9;
            letter-spacing: -1px;
            color: #fff;
            text-shadow: 2px 4px 12px rgba(0,0,0,0.8);
        }

        .subtitle {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--accent);
            margin-top: 0.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* 3. Demote Secondary Data (HUD) */
        .data-panel {
            align-self: flex-end;
            width: 220px;
            /* Drastically reduced opacity and contrast */
            background: rgba(15, 23, 42, 0.2); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            pointer-events: auto;
            border-radius: 4px;
            display: grid;
            gap: 12px;
        }

        .data-row {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 2px;
        }

        .data-label {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 400; /* Lighter weight */
            opacity: 0.7;
        }

        .data-value {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text-main);
            font-weight: 400; /* Normal weight, not bold */
            text-align: right;
            opacity: 0.8;
        }

        .status-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--danger);
            margin-right: 6px;
            box-shadow: 0 0 6px var(--danger);
            animation: pulse 3s infinite;
        }

        .footer {
            align-self: flex-start;
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            opacity: 0.4;
        }

        /* --- Animations --- */
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

    </style>
</head>
<body>

<div class="screen-container">
    
    <!-- Background / Scene SVG -->
    <svg class="scene-layer" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Sky Gradient: Deep Atmospheric Depth -->
            <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#020617;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#0f172a;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
            </linearGradient>

            <!-- Canopy Gradient: Light source from top-left -->
            <linearGradient id="canopyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
                <stop offset="40%" style="stop-color:#cbd5e1;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#64748b;stop-opacity:1" />
            </linearGradient>

            <!-- Rim Light Gradient for Canopy -->
            <linearGradient id="rimLight" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
                <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
            </linearGradient>

            <!-- Depth Blur Filter -->
            <filter id="blurMist">
                <feGaussianBlur in="SourceGraphic" stdDeviation="40" />
            </filter>
        </defs>

        <!-- 1. Sky Background -->
        <rect width="1920" height="1080" fill="url(#skyGradient)" />

        <!-- 5. Distant Landscape (Atmospheric Depth) -->
        <!-- Low contrast, smooth gradients for scale -->
        <g id="distant-mountains">
            <path d="M0,1080 L0,650 Q400,600 800,750 T1600,650 T1920,800 L1920,1080 Z" 
                  fill="#1e293b" opacity="0.4" filter="url(#blurMist)" />
            <path d="M0,1080 L0,800 Q600,700 1200,850 T1920,750 L1920,1080 Z" 
                  fill="#0f172a" opacity="0.6" filter="url(#blurMist)" />
        </g>

        <!-- 4. Enhanced Motion Cues (Wind Streaks) -->
        <!-- Dynamic, curved lines that will be animated via JS -->
        <g id="wind-group"></g>

        <!-- 2. Clarify the Hazard (Cliff) -->
        <!-- Single sharp vector silhouette with distinct rim light -->
        <g id="cliff-group">
            <!-- Base Silhouette -->
            <path d="M-50,-50 L700,-50 L680,150 L750,250 L650,350 L700,500 L580,650 L620,800 L480,950 L520,1150 L-50,1200 Z" 
                  fill="#020617" />
            
            <!-- High-Contrast Rim Light (The Edge) -->
            <!-- This defines the "Safe" vs "Danger" line -->
            <path d="M700,-50 L680,150 L750,250 L650,350 L700,500 L580,650 L620,800 L480,950 L520,1150" 
                  fill="none" stroke="#f8fafc" stroke-width="4" opacity="0.9" />
            
            <!-- Subtle Shadow Cast by Rim Light -->
            <path d="M700,-50 L680,150 L750,250 L650,350 L700,500 L580,650 L620,800 L480,950 L520,1150" 
                  fill="none" stroke="#020617" stroke-width="12" transform="translate(6, 6)" opacity="0.8" />
        </g>

        <!-- 1. Focal Dominance (Parachutist) -->
        <!-- Scaled up 1.5x, weighted silhouette, rim light -->
        <!-- Positioned closer to the cliff edge for tension -->
        <g id="parachuter-group" transform="translate(1000, 300)">
            
            <!-- Canopy: Larger, 3D, with Rim Light -->
            <g id="canopy">
                <!-- Main Shape (Scaled up) -->
                <path class="parachute-canopy" d="M-240,0 C-240,-190 240,-190 240,0 C240,50 120,65 0,65 C-120,65 -240,50 -240,0 Z" 
                      fill="url(#canopyGradient)" />
                
                <!-- Rim Light/Glow (Separation from dark sky) -->
                <path d="M-240,0 C-240,-190 240,-190 240,0" 
                      fill="none" stroke="url(#rimLight)" stroke-width="6" opacity="0.8" />

                <!-- Panel Geometry (Depth) -->
                <g stroke="#475569" stroke-width="2" fill="none" opacity="0.5">
                    <path d="M0,-150 L0,50" />
                    <path d="M-60,-155 L-30,50" />
                    <path d="M60,-155 L30,50" />
                    <path d="M-120,-140 L-60,50" />
                    <path d="M120,-140 L60,50" />
                    <path d="M-180,-100 L-90,45" />
                    <path d="M180,-100 L90,45" />
                </g>
            </g>

            <!-- Taut Harness Lines (Thicker, clearer) -->
            <g stroke="#e2e8f0" stroke-width="1.5" fill="none" opacity="0.9">
                <!-- Left Side -->
                <line x1="-180" y1="10" x2="-16" y2="250" />
                <line x1="-120" y1="30" x2="-14" y2="250" />
                <line x1="-60" y1="45" x2="-12" y2="250" />
                <!-- Right Side -->
                <line x1="180" y1="10" x2="16" y2="250" />
                <line x1="120" y1="30" x2="14" y2="250" />
                <line x1="60" y1="45" x2="12" y2="250" />
            </g>

            <!-- Harness Block (Heavier) -->
            <rect x="-20" y="240" width="40" height="16" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="2" />

            <!-- Human Figure: Solid Weighted Silhouette -->
            <g class="silhouette">
                <!-- Rim Light Stroke (Glow) -->
                <g stroke="#ffffff" stroke-width="3" fill="none" opacity="0.5">
                    <circle cx="0" cy="235" r="12" />
                    <path d="M-12,248 L-15,290 L-25,340 L-30,350" stroke-linecap="round" stroke-width="8" />
                    <path d="M12,248 L15,290 L25,340 L30,350" stroke-linecap="round" stroke-width="8" />
                    <path d="M-12,255 C-30,265 -40,285 -35,295" stroke-linecap="round" stroke-width="8" />
                    <path d="M12,255 C30,265 40,285 35,295" stroke-linecap="round" stroke-width="8" />
                </g>

                <!-- Solid Fill (The Body) -->
                <g fill="#020617">
                    <!-- Head -->
                    <circle cx="0" cy="235" r="11" />
                    <!-- Torso (Thicker) -->
                    <path d="M-12,248 L-12,290 L12,290 L12,248 Z" />
                    <!-- Legs (Thicker, distinct boots) -->
                    <path d="M-12,290 L-25,340 L-30,350" stroke="#020617" stroke-width="12" stroke-linecap="round" fill="none" />
                    <path d="M12,290 L25,340 L30,350" stroke="#020617" stroke-width="12" stroke-linecap="round" fill="none" />
                    <!-- Arms (Active posture) -->
                    <path d="M-12,255 C-30,265 -40,285 -35,295" stroke="#020617" stroke-width="10" fill="none" stroke-linecap="round"/>
                    <path d="M12,255 C30,265 40,285 35,295" stroke="#020617" stroke-width="10" fill="none" stroke-linecap="round"/>
                </g>
            </g>
        </g>

    </svg>

    <!-- UI Overlay -->
    <div class="ui-layer">
        
        <!-- 5. Title with Plate -->
        <div class="header">
            <h1>Alpine<br>Descent</h1>
            <div class="subtitle">Operation: Freefall // Sector 4</div>
        </div>

        <!-- 3. Demoted HUD -->
        <div class="data-panel">
            <div class="data-row">
                <span class="data-label">Altitude</span>
                <span class="data-value" id="alt-val">14,200 ft</span>
            </div>
            <div class="data-row">
                <span class="data-label">V. Speed</span>
                <span class="data-value">-24 ft/s</span>
            </div>
            <div class="data-row">
                <span class="data-label">Wind Vec</span>
                <span class="data-value">NW 12mph</span>
            </div>
            <div class="data-row">
                <span class="data-label">Canopy</span>
                <span class="data-value" style="color:var(--success); opacity: 0.8">NOMINAL</span>
            </div>
            <div class="data-row" style="border:none;">
                <span class="data-label">Proximity</span>
                <span class="data-value"><span class="status-indicator"></span>CAUTION</span>
            </div>
            
            <div class="data-row">
                <span class="data-label">G-Force</span>
                <span class="data-value">1.02 G</span>
            </div>
            <div class="data-row">
                <span class="data-label">GPS</span>
                <span class="data-value">LOCKED</span>
            </div>
        </div>

        <div class="footer">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <div>
                    <p>SYS.ONLINE</p>
                    <p>RENDER_ENGINE: SVG_V3</p>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const windGroup = document.getElementById('wind-group');
        const parachuter = document.getElementById('parachuter-group');
        const altVal = document.getElementById('alt-val');
        
        // --- Animation State ---
        let time = 0;
        let altitude = 14200;
        
        // --- 4. Generate Dynamic Wind Streaks ---
        const windLines = [];
        const numLines = 50;
        
        for(let i=0; i<numLines; i++) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
            
            // Styling for motion blur effect
            line.setAttribute("stroke", "#fff");
            line.setAttribute("stroke-width", "1.5");
            line.setAttribute("stroke-linecap", "round");
            line.setAttribute("opacity", Math.random() * 0.2 + 0.05); // Subtle
            
            windGroup.appendChild(line);
            
            windLines.push({
                el: line,
                x: Math.random() * 1920,
                y: Math.random() * 1080,
                len: 100 + Math.random() * 200,
                speed: 10 + Math.random() * 15,
                // 15 degree angle logic
                angle: 0.26 
            });
        }

        // --- Main Animation Loop ---
        function animate() {
            time += 0.016;

            // 1. Parachuter Physics (Realistic Bobbing)
            const bobY = Math.sin(time * 1.2) * 12; 
            const swayX = Math.sin(time * 0.6) * 20;
            
            // Descent Cycle (Visual Loop)
            const descentCycle = (time * 20) % 1200; // Slower descent
            const baseY = 100 + descentCycle; // Start higher up
            
            // Apply transform
            // Note: Translating X/Y directly for performance
            parachuter.setAttribute('transform', `translate(${1000 + swayX}, ${baseY + bobY})`);

            // 2. Wind Animation (Diagonal Flow)
            windLines.forEach(line => {
                line.x += line.speed;
                line.y += line.speed * line.angle;

                // Reset if off screen
                if(line.x > 1920 || line.y > 1080) {
                    line.x = -200; 
                    line.y = Math.random() * 1080; 
                }

                // Create a curved path for better "flow" visualization
                // M startX startY Q controlX controlY endX endY
                // The control point offsets the line to create a curve
                const cx = line.x + (line.len / 2);
                const cy = line.y + (line.len / 2) * line.angle - 20; // Curve up slightly (lift)
                const ex = line.x + line.len;
                const ey = line.y + (line.len * line.angle);

                line.el.setAttribute("d", `M${line.x},${line.y} Q${cx},${cy} ${ex},${ey}`);
            });

            // 3. Data Update
            altitude -= 0.3;
            if(altitude < 14000) altitude = 14200;
            altVal.innerText = Math.floor(altitude).toLocaleString() + " ft";

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>

</body>
</html>
