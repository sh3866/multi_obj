<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPINE // DESCENT // REVISED</title>
    <style>
        :root {
            --bg-deep: #0f172a;
            --bg-cliff: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --danger: #ef4444;
            --success: #10b981;
            
            --font-display: 'Impact', 'Arial Black', sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* --- Layout & Container --- */
        .screen-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            overflow: hidden;
        }

        /* --- The Visual Scene (SVG) --- */
        .scene-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- UI Overlay --- */
        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- Typography & UI Elements --- */
        
        /* 5. Demoted Header: Reduced size, opacity, and visual weight */
        .header {
            width: fit-content;
            /* Slightly more transparent plate */
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(2px);
            padding: 0.75rem 1.25rem;
            border-left: 2px solid var(--accent); /* Thinner accent */
            clip-path: polygon(0 0, 100% 0, 96% 100%, 0% 100%);
        }

        h1 {
            font-family: var(--font-display);
            font-size: 2.5rem; /* Reduced from 4rem */
            text-transform: uppercase;
            line-height: 0.9;
            letter-spacing: 1px;
            color: #fff;
            opacity: 0.9;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 400;
        }

        /* 5. Refined HUD Panel: Semi-transparent dark box, grounded */
        .data-panel {
            align-self: flex-end;
            width: 260px;
            /* Darker, semi-transparent background to ground the text */
            background: rgba(15, 23, 42, 0.85); 
            border: 1px solid rgba(148, 163, 184, 0.1);
            padding: 1.25rem;
            pointer-events: auto;
            border-radius: 2px;
            display: grid;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .data-row {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            padding-bottom: 4px;
        }

        .data-label {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-value {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text-main);
            font-weight: 700; /* Stronger contrast for data */
            text-align: right;
        }

        .status-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--danger);
            margin-right: 8px;
            box-shadow: 0 0 8px var(--danger);
            animation: pulse 2s infinite;
        }

        .footer {
            align-self: flex-start;
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            opacity: 0.5;
            margin-top: auto;
        }

        /* --- Animations --- */
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

    </style>
</head>
<body>

<div class="screen-container">
    
    <!-- Background / Scene SVG -->
    <svg class="scene-layer" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- 2. Atmospheric Depth: Deep Blue/Grey Gradient -->
            <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#020617;stop-opacity:1" />
                <stop offset="40%" style="stop-color:#0f172a;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
            </linearGradient>

            <!-- Canopy Gradient: Simulating light volume -->
            <linearGradient id="canopyGradient" x1="0%" y1="0%" x2="50%" y2="100%">
                <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
                <stop offset="30%" style="stop-color:#e2e8f0;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
            </linearGradient>

            <!-- 3. Rim Light Gradient -->
            <linearGradient id="rimLight" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
                <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.2" />
                <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
            </linearGradient>

            <!-- 1. Cliff Texture Pattern (Rock Layers) -->
            <pattern id="rockTexture" width="100" height="100" patternUnits="userSpaceOnUse">
                <path d="M0,20 Q50,40 100,20 M0,60 Q50,80 100,60 M0,100 Q50,120 100,100" 
                      stroke="#334155" stroke-width="2" fill="none" opacity="0.3" />
                <path d="M-20,0 L20,100 M20,-20 L60,100 M60,-20 L100,100" 
                      stroke="#0f172a" stroke-width="1" fill="none" opacity="0.2" />
            </pattern>

            <!-- Depth Blur Filter -->
            <filter id="blurMist">
                <feGaussianBlur in="SourceGraphic" stdDeviation="30" />
            </filter>
        </defs>

        <!-- 2. Sky Background -->
        <rect width="1920" height="1080" fill="url(#skyGradient)" />

        <!-- 2. Distant Landscape (Depth Layers) -->
        <g id="distant-mountains">
            <!-- Layer 1: Faintest -->
            <path d="M0,1080 L0,700 Q400,650 900,800 T1920,700 L1920,1080 Z" 
                  fill="#1e293b" opacity="0.5" filter="url(#blurMist)" />
            <!-- Layer 2: Slightly darker -->
            <path d="M0,1080 L0,850 Q600,750 1400,900 T1920,800 L1920,1080 Z" 
                  fill="#0f172a" opacity="0.7" filter="url(#blurMist)" />
        </g>

        <!-- 4. Motion Cues (Wind Streaks - Behind Parachutist) -->
        <g id="wind-group"></g>

        <!-- 1. Reconstructed Cliff Face (Physical Barrier) -->
        <!-- Polygon shape, filled with dark slate and pattern -->
        <g id="cliff-group">
            <!-- Main Rock Body -->
            <path d="M-100,-50 L600,-50 L580,120 L640,220 L550,320 L600,480 L480,620 L520,800 L400,950 L450,1150 L-100,1200 Z" 
                  fill="#1a202c" />
            
            <!-- Rock Strata Texture -->
            <path d="M-100,-50 L600,-50 L580,120 L640,220 L550,320 L600,480 L480,620 L520,800 L400,950 L450,1150 L-100,1200 Z" 
                  fill="url(#rockTexture)" />
            
            <!-- 1. The Edge: Sharp definition -->
            <path d="M600,-50 L580,120 L640,220 L550,320 L600,480 L480,620 L520,800 L400,950 L450,1150" 
                  fill="none" stroke="#475569" stroke-width="4" />
            
            <!-- Inner Shadow for depth at the edge -->
            <path d="M600,-50 L580,120 L640,220 L550,320 L600,480 L480,620 L520,800 L400,950 L450,1150" 
                  fill="none" stroke="#020617" stroke-width="15" transform="translate(-10, 0)" opacity="0.6" />
        </g>

        <!-- 3. Enhanced Subject (Parachutist & Canopy) -->
        <!-- Scaled up, positioned for dynamic tension -->
        <g id="parachuter-group" transform="translate(1100, 400)">
            
            <!-- Canopy: Larger, Volumetric, Ribs -->
            <g id="canopy">
                <!-- Main Shape -->
                <path class="parachute-canopy" d="M-300,0 C-300,-220 300,-220 300,0 C300,70 150,90 0,90 C-150,90 -300,70 -300,0 Z" 
                      fill="url(#canopyGradient)" />
                
                <!-- 3. Structural Ribs (Mechanical Realism) -->
                <g stroke="#1e293b" stroke-width="3" fill="none" opacity="0.4">
                    <path d="M0,-180 L0,70" />
                    <path d="M-75,-185 L-35,70" />
                    <path d="M75,-185 L35,70" />
                    <path d="M-150,-165 L-70,65" />
                    <path d="M150,-165 L70,65" />
                    <path d="M-220,-120 L-105,55" />
                    <path d="M220,-120 L105,55" />
                </g>

                <!-- 3. Rim Light (Separation) -->
                <path d="M-300,0 C-300,-220 300,-220 300,0" 
                      fill="none" stroke="url(#rimLight)" stroke-width="8" />
            </g>

            <!-- 4. Physics & Motion: Taut Harness Lines -->
            <!-- Thicker, slightly curved to show tension -->
            <g stroke="#cbd5e1" stroke-width="2.5" fill="none" opacity="0.9">
                <!-- Left Side -->
                <line x1="-200" y1="20" x2="-20" y2="320" />
                <line x1="-100" y1="60" x2="-15" y2="320" />
                <line x1="0" y1="75" x2="-5" y2="320" />
                <!-- Right Side -->
                <line x1="200" y1="20" x2="20" y2="320" />
                <line x1="100" y1="60" x2="15" y2="320" />
                <line x1="0" y1="75" x2="5" y2="320" />
            </g>

            <!-- Harness Block -->
            <rect x="-25" y="310" width="50" height="20" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="2" />

            <!-- Human Figure: Weighted Silhouette with Rim Light -->
            <g class="silhouette">
                <!-- Rim Light Stroke -->
                <g stroke="#ffffff" stroke-width="4" fill="none" opacity="0.6">
                    <circle cx="0" cy="295" r="14" />
                    <path d="M-15,310 L-15,360 L-25,420 L-30,430" stroke-linecap="round" stroke-width="10" />
                    <path d="M15,310 L15,360 L25,420 L30,430" stroke-linecap="round" stroke-width="10" />
                    <path d="M-15,315 C-40,330 -50,360 -45,370" stroke-linecap="round" stroke-width="10" />
                    <path d="M15,315 C40,330 50,360 45,370" stroke-linecap="round" stroke-width="10" />
                </g>

                <!-- Solid Fill -->
                <g fill="#020617">
                    <!-- Head -->
                    <circle cx="0" cy="295" r="13" />
                    <!-- Torso -->
                    <path d="M-15,310 L-15,360 L15,360 L15,310 Z" />
                    <!-- Legs -->
                    <path d="M-15,360 L-25,420 L-30,430" stroke="#020617" stroke-width="14" stroke-linecap="round" fill="none" />
                    <path d="M15,360 L25,420 L30,430" stroke="#020617" stroke-width="14" stroke-linecap="round" fill="none" />
                    <!-- Arms -->
                    <path d="M-15,315 C-40,330 -50,360 -45,370" stroke="#020617" stroke-width="12" fill="none" stroke-linecap="round"/>
                    <path d="M15,315 C40,330 50,360 45,370" stroke="#020617" stroke-width="12" fill="none" stroke-linecap="round"/>
                </g>
            </g>
        </g>

    </svg>

    <!-- UI Overlay -->
    <div class="ui-layer">
        
        <!-- 5. Demoted Header -->
        <div class="header">
            <h1>Alpine<br>Descent</h1>
            <div class="subtitle">Operation: Freefall // Sector 4</div>
        </div>

        <!-- 5. Refined HUD Panel -->
        <div class="data-panel">
            <div class="data-row">
                <span class="data-label">Altitude</span>
                <span class="data-value" id="alt-val">14,200 ft</span>
            </div>
            <div class="data-row">
                <span class="data-label">V. Speed</span>
                <span class="data-value">-24 ft/s</span>
            </div>
            <div class="data-row">
                <span class="data-label">Wind Vec</span>
                <span class="data-value">NW 12mph</span>
            </div>
            <div class="data-row">
                <span class="data-label">Canopy</span>
                <span class="data-value" style="color:var(--success)">NOMINAL</span>
            </div>
            <div class="data-row" style="border:none;">
                <span class="data-label">Proximity</span>
                <span class="data-value"><span class="status-indicator"></span>CAUTION</span>
            </div>
            
            <div class="data-row">
                <span class="data-label">G-Force</span>
                <span class="data-value">1.02 G</span>
            </div>
            <div class="data-row">
                <span class="data-label">GPS</span>
                <span class="data-value">LOCKED</span>
            </div>
        </div>

        <div class="footer">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <div>
                    <p>SYS.ONLINE</p>
                    <p>RENDER_ENGINE: SVG_V4</p>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const windGroup = document.getElementById('wind-group');
        const parachuter = document.getElementById('parachuter-group');
        const altVal = document.getElementById('alt-val');
        
        // --- Animation State ---
        let time = 0;
        let altitude = 14200;
        
        // --- 4. Generate Dynamic Wind Streaks ---
        const windLines = [];
        const numLines = 60; // Increased density
        
        for(let i=0; i<numLines; i++) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
            
            // Styling for motion blur effect
            line.setAttribute("stroke", "#fff");
            line.setAttribute("stroke-width", "1");
            line.setAttribute("stroke-linecap", "round");
            // Varying opacity for depth
            line.setAttribute("opacity", Math.random() * 0.3 + 0.05); 
            
            windGroup.appendChild(line);
            
            windLines.push({
                el: line,
                x: Math.random() * 1920,
                y: Math.random() * 1080,
                len: 150 + Math.random() * 250, // Longer streaks for speed
                speed: 15 + Math.random() * 20, // Faster speed
                angle: 0.2 // Slight downward angle
            });
        }

        // --- Main Animation Loop ---
        function animate() {
            time += 0.016;

            // 1. Parachuter Physics (Smoother, heavier bobbing)
            const bobY = Math.sin(time * 0.8) * 15; 
            const swayX = Math.sin(time * 0.4) * 25; // Slower, wider sway
            
            // Descent Cycle (Visual Loop)
            const descentCycle = (time * 15) % 1000; // Slower descent loop
            const baseY = 200 + descentCycle; 
            
            // Apply transform
            parachuter.setAttribute('transform', `translate(${1100 + swayX}, ${baseY + bobY})`);

            // 2. Wind Animation (Diagonal Flow)
            windLines.forEach(line => {
                line.x += line.speed;
                line.y += line.speed * line.angle;

                // Reset if off screen
                if(line.x > 1920 || line.y > 1080) {
                    line.x = -300; 
                    line.y = Math.random() * 1080; 
                }

                // Create a curved path for aerodynamic flow
                const cx = line.x + (line.len / 2);
                const cy = line.y + (line.len / 2) * line.angle - 30; // Curve up slightly
                const ex = line.x + line.len;
                const ey = line.y + (line.len * line.angle);

                line.el.setAttribute("d", `M${line.x},${line.y} Q${cx},${cy} ${ex},${ey}`);
            });

            // 3. Data Update
            altitude -= 0.2;
            if(altitude < 14000) altitude = 14200;
            altVal.innerText = Math.floor(altitude).toLocaleString() + " ft";

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>
</body>
</html>
