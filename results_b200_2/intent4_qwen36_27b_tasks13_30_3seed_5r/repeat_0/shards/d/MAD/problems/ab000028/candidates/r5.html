<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPINE DESCENT // REVISED</title>
    <style>
        :root {
            /* 4. Unified Palette */
            --bg-deep: #020617;
            --bg-cliff: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent: #38bdf8;
            --danger: #f43f5e;
            --success: #10b981;
            
            /* 4. Unified Typography: Geometric Sans */
            --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Layout & Container --- */
        .screen-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            overflow: hidden;
        }

        /* --- The Visual Scene (SVG) --- */
        .scene-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- UI Overlay --- */
        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- Typography & UI Elements --- */
        
        /* 4. Subordinate Header: Lower opacity, cleaner look */
        .header {
            width: fit-content;
            background: rgba(15, 23, 42, 0.4); /* More transparent */
            backdrop-filter: blur(4px);
            padding: 1rem 1.5rem;
            border-left: 3px solid var(--text-muted);
            opacity: 0.85; /* 4. Opacity reduced */
            transition: opacity 0.3s ease;
        }
        
        .header:hover { opacity: 1; }

        h1 {
            font-family: var(--font-stack);
            font-weight: 800;
            font-size: 2rem;
            text-transform: uppercase;
            line-height: 1;
            letter-spacing: 2px;
            color: #fff;
        }

        .subtitle {
            font-family: var(--font-stack);
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* 4. Refined HUD Panel: Grid alignment, cleaner aesthetics */
        .data-panel {
            align-self: flex-end;
            width: 280px;
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid rgba(148, 163, 184, 0.15);
            padding: 1.5rem;
            pointer-events: auto;
            border-radius: 4px;
            display: grid;
            gap: 12px;
            opacity: 0.85; /* 4. Opacity reduced */
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
        }

        .data-panel:hover { opacity: 1; }

        .data-row {
            display: grid;
            /* 4. Strict grid alignment */
            grid-template-columns: 1fr auto; 
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 6px;
        }
        
        .data-row:last-child { border-bottom: none; padding-bottom: 0; }

        .data-label {
            font-family: var(--font-stack);
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .data-value {
            font-family: var(--font-stack);
            font-size: 0.9rem;
            color: var(--text-main);
            font-weight: 700;
            text-align: right; /* 4. Right aligned */
            letter-spacing: 0.5px;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--danger);
            margin-right: 8px;
            box-shadow: 0 0 10px var(--danger);
            animation: pulse 2s infinite ease-in-out;
        }

        .footer {
            align-self: flex-start;
            font-family: var(--font-stack);
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            opacity: 0.4;
            margin-top: auto;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* --- Animations --- */
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

    </style>
</head>
<body>

<div class="screen-container">
    
    <!-- Background / Scene SVG -->
    <svg class="scene-layer" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- 5. Atmospheric Depth: Deep blue to near black -->
            <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#020617;stop-opacity:1" />
                <stop offset="40%" style="stop-color:#0f172a;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
            </linearGradient>

            <!-- 1. Cliff Gradient: Dark slate to near-black -->
            <linearGradient id="cliffGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#020617;stop-opacity:1" />
                <stop offset="80%" style="stop-color:#1e293b;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
            </linearGradient>

            <!-- 3. Canopy Gradient: 3D Dome (Radial) -->
            <radialGradient id="canopyGradient" cx="35%" cy="35%" r="65%">
                <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
                <stop offset="40%" style="stop-color:#cbd5e1;stop-opacity:1" />
                <stop offset="80%" style="stop-color:#64748b;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
            </radialGradient>

            <!-- 2. Rim Light Gradient -->
            <linearGradient id="rimLight" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
                <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
            </linearGradient>

            <!-- 2. Glow Filter for Subject -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="8" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>

            <!-- 5. Depth Blur -->
            <filter id="blurMist">
                <feGaussianBlur in="SourceGraphic" stdDeviation="40" />
            </filter>
        </defs>

        <!-- 5. Sky Background -->
        <rect width="1920" height="1080" fill="url(#skyGradient)" />

        <!-- 5. Distant Landscape (Horizon/Valley Floor) -->
        <g id="distant-mountains">
            <!-- Layer 1: Faintest -->
            <path d="M0,1080 L0,750 Q500,700 1000,850 T1920,750 L1920,1080 Z" 
                  fill="#0f172a" opacity="0.6" filter="url(#blurMist)" />
            <!-- Layer 2: Valley Floor -->
            <path d="M0,1080 L0,900 Q960,850 1920,920 L1920,1080 Z" 
                  fill="#020617" opacity="0.9" filter="url(#blurMist)" />
        </g>

        <!-- 5. Motion Cues (Wind Streaks - Behind Parachutist, Flowing Left to Right) -->
        <g id="wind-group"></g>

        <!-- 1. Reconstructed Cliff Face -->
        <g id="cliff-group">
            <!-- Main Rock Body (Jagged Path) -->
            <path d="M-100,-50 L650,-50 L620,150 L700,280 L580,420 L650,580 L520,750 L600,950 L450,1150 L-100,1200 Z" 
                  fill="url(#cliffGradient)" />
            
            <!-- 1. Rock Strata (Geological Lines) -->
            <g stroke="#0f172a" stroke-width="3" opacity="0.4">
                <path d="M-100,100 L630,140" />
                <path d="M-100,300 L680,280" />
                <path d="M-100,500 L580,420" />
                <path d="M-100,700 L650,580" />
                <path d="M-100,900 L520,750" />
                <path d="M-100,1100 L600,950" />
            </g>
            <!-- Secondary Strata (Lighter) -->
            <g stroke="#334155" stroke-width="1" opacity="0.3">
                <path d="M-100,150 L610,160" />
                <path d="M-100,350 L690,320" />
                <path d="M-100,550 L560,460" />
                <path d="M-100,750 L630,620" />
            </g>
            
            <!-- 1. The Edge: High contrast definition -->
            <path d="M650,-50 L620,150 L700,280 L580,420 L650,580 L520,750 L600,950 L450,1150" 
                  fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.5" />
            
            <!-- Inner Shadow for depth at the edge -->
            <path d="M650,-50 L620,150 L700,280 L580,420 L650,580 L520,750 L600,950 L450,1150" 
                  fill="none" stroke="#000000" stroke-width="20" transform="translate(-15, 0)" opacity="0.8" filter="url(#blurMist)" />
        </g>

        <!-- 3. Enhanced Subject (Parachutist & Canopy) -->
        <!-- Scaled up, positioned for dynamic tension -->
        <g id="parachuter-group" transform="translate(1100, 400)">
            
            <!-- 3. Canopy: 3D Dome, Volumetric -->
            <g id="canopy">
                <!-- Main Shape -->
                <path class="parachute-canopy" d="M-350,10 C-350,-250 350,-250 350,10 C350,100 180,130 0,130 C-180,130 -350,100 -350,10 Z" 
                      fill="url(#canopyGradient)" />
                
                <!-- Structural Ribs (Mechanical Realism) -->
                <g stroke="#1e293b" stroke-width="2" fill="none" opacity="0.3">
                    <path d="M0,-220 L0,100" />
                    <path d="M-90,-220 L-40,100" />
                    <path d="M90,-220 L40,100" />
                    <path d="M-180,-180 L-80,90" />
                    <path d="M180,-180 L80,90" />
                    <path d="M-270,-100 L-120,70" />
                    <path d="M270,-100 L120,70" />
                </g>

                <!-- 3. Rim Light (Separation) -->
                <path d="M-350,10 C-350,-250 350,-250 350,10" 
                      fill="none" stroke="url(#rimLight)" stroke-width="12" />
            </g>

            <!-- 3. Physics & Motion: Taut Harness Lines (Variable Width) -->
            <g fill="none" opacity="0.9">
                <!-- Left Lines -->
                <path d="M-250,50 Q-150,180 -25,340" stroke="#cbd5e1" stroke-width="3" />
                <path d="M-120,90 Q-100,200 -20,340" stroke="#cbd5e1" stroke-width="2" />
                <path d="M0,105 L0,340" stroke="#cbd5e1" stroke-width="1.5" />
                <!-- Right Lines -->
                <path d="M250,50 Q150,180 25,340" stroke="#cbd5e1" stroke-width="3" />
                <path d="M120,90 Q100,200 20,340" stroke="#cbd5e1" stroke-width="2" />
                <path d="M0,105 L0,340" stroke="#cbd5e1" stroke-width="1.5" />
            </g>

            <!-- Harness Block -->
            <rect x="-30" y="330" width="60" height="24" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2" />

            <!-- 2. Human Figure: Bulky Silhouette with Rim Light -->
            <g class="silhouette" filter="url(#glow)">
                <!-- Solid Fill (Suit) -->
                <g fill="#020617">
                    <!-- Head/Helmet -->
                    <circle cx="0" cy="305" r="18" />
                    <!-- Torso (Bulky) -->
                    <path d="M-22,325 L-22,380 L22,380 L22,325 Z" />
                    <!-- Legs (Thick strokes) -->
                    <path d="M-20,380 L-30,450 L-35,460" stroke="#020617" stroke-width="18" stroke-linecap="round" fill="none" />
                    <path d="M20,380 L30,450 L35,460" stroke="#020617" stroke-width="18" stroke-linecap="round" fill="none" />
                    <!-- Arms -->
                    <path d="M-22,330 C-50,340 -60,370 -55,380" stroke="#020617" stroke-width="16" fill="none" stroke-linecap="round"/>
                    <path d="M22,330 C50,340 60,370 55,380" stroke="#020617" stroke-width="16" fill="none" stroke-linecap="round"/>
                </g>

                <!-- 2. Rim Light Stroke (Glow effect on edges) -->
                <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.5">
                    <circle cx="0" cy="305" r="18" />
                    <path d="M-22,325 L-22,380 L22,380 L22,325 Z" />
                    <path d="M-20,380 L-30,450" stroke-width="18" />
                    <path d="M20,380 L30,450" stroke-width="18" />
                </g>
            </g>
        </g>

    </svg>

    <!-- UI Overlay -->
    <div class="ui-layer">
        
        <!-- 4. Demoted Header -->
        <div class="header">
            <h1>Alpine Descent</h1>
            <div class="subtitle">Operation: Freefall // Sector 4</div>
        </div>

        <!-- 4. Refined HUD Panel -->
        <div class="data-panel">
            <div class="data-row">
                <span class="data-label">Altitude</span>
                <span class="data-value" id="alt-val">14,200 ft</span>
            </div>
            <div class="data-row">
                <span class="data-label">V. Speed</span>
                <span class="data-value">-24 ft/s</span>
            </div>
            <div class="data-row">
                <span class="data-label">Wind Vec</span>
                <span class="data-value">NW 12mph</span>
            </div>
            <div class="data-row">
                <span class="data-label">Canopy</span>
                <span class="data-value" style="color:var(--success)">NOMINAL</span>
            </div>
            <div class="data-row" style="border:none;">
                <span class="data-label">Proximity</span>
                <span class="data-value"><span class="status-indicator"></span>CAUTION</span>
            </div>
            
            <div class="data-row">
                <span class="data-label">G-Force</span>
                <span class="data-value">1.02 G</span>
            </div>
            <div class="data-row">
                <span class="data-label">GPS</span>
                <span class="data-value">LOCKED</span>
            </div>
        </div>

        <div class="footer">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <div>
                    <p>SYS.ONLINE</p>
                    <p>RENDER_ENGINE: SVG_V5</p>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const windGroup = document.getElementById('wind-group');
        const parachuter = document.getElementById('parachuter-group');
        const altVal = document.getElementById('alt-val');
        
        // --- Animation State ---
        let time = 0;
        let altitude = 14200;
        
        // --- 5. Generate Dynamic Wind Streaks (Flowing Left to Right) ---
        const windLines = [];
        const numLines = 50; 
        
        for(let i=0; i<numLines; i++) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
            
            // Styling for tapered motion effect
            line.setAttribute("stroke", "#ffffff");
            line.setAttribute("stroke-linecap", "round");
            // Varying opacity and width for depth
            const opacity = Math.random() * 0.3 + 0.05;
            const width = Math.random() * 1.5 + 0.5;
            line.setAttribute("opacity", opacity); 
            line.setAttribute("stroke-width", width);
            
            windGroup.appendChild(line);
            
            windLines.push({
                el: line,
                x: Math.random() * 1920,
                y: Math.random() * 1080,
                len: 100 + Math.random() * 200,
                speed: 20 + Math.random() * 30, // Faster
                angle: 0.1 // Slight downward drift
            });
        }

        // --- Main Animation Loop ---
        function animate() {
            time += 0.016;

            // 1. Parachuter Physics (Smoother, heavier bobbing)
            const bobY = Math.sin(time * 0.8) * 15; 
            const swayX = Math.sin(time * 0.4) * 25; 
            
            // Descent Cycle (Visual Loop)
            const descentCycle = (time * 15) % 1000; 
            const baseY = 200 + descentCycle; 
            
            // Apply transform
            parachuter.setAttribute('transform', `translate(${1100 + swayX}, ${baseY + bobY})`);

            // 2. Wind Animation (Diagonal Flow Left -> Right)
            windLines.forEach(line => {
                line.x += line.speed;
                line.y += line.speed * line.angle;

                // Reset if off screen
                if(line.x > 1920) {
                    line.x = -300; 
                    line.y = Math.random() * 1080; 
                }

                // Create a curved path for aerodynamic flow
                const cx = line.x + (line.len / 2);
                const cy = line.y + (line.len / 2) * line.angle - 10; 
                const ex = line.x + line.len;
                const ey = line.y + (line.len * line.angle);

                line.el.setAttribute("d", `M${line.x},${line.y} Q${cx},${cy} ${ex},${ey}`);
            });

            // 3. Data Update
            altitude -= 0.2;
            if(altitude < 14000) altitude = 14200;
            altVal.innerText = Math.floor(altitude).toLocaleString() + " ft";

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>
</body>
</html>
