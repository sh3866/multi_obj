<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPINE // DESCENT // REVISED</title>
    <style>
        :root {
            --bg-deep: #020617;
            --bg-mid: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent: #38bdf8;
            --danger: #ef4444;
            --success: #10b981;
            
            --font-display: 'Impact', 'Arial Black', sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Layout & Container --- */
        .screen-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            grid-template-rows: 100px 1fr 100px;
            overflow: hidden;
        }

        /* --- The Visual Scene (SVG) --- */
        .scene-layer {
            grid-column: 1 / -1;
            grid-row: 1 / -1;
            z-index: 1;
            width: 100%;
            height: 100%;
            /* Subtle vignette via CSS to help focus */
            mask-image: radial-gradient(circle at center, black 60%, transparent 100%);
        }

        /* --- UI Overlay --- */
        .ui-layer {
            grid-column: 1 / -1;
            grid-row: 1 / -1;
            z-index: 10;
            pointer-events: none;
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            grid-template-rows: 80px 1fr 80px;
            padding: 2rem;
        }

        /* --- Typography & UI Elements --- */
        .header {
            grid-column: 1 / 2;
            grid-row: 1 / 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-left: 4px solid var(--accent);
            padding-left: 1.5rem;
            pointer-events: auto;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 3.5rem;
            text-transform: uppercase;
            line-height: 0.9;
            letter-spacing: -1px;
            color: #fff;
            text-shadow: 0 4px 12px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--accent);
            margin-top: 0.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* REVISED: Reduced visual weight, desaturated, secondary layer */
        .data-panel {
            grid-column: 3 / 4;
            grid-row: 1 / 4; /* Span full height for editorial look */
            align-self: center;
            justify-self: end;
            width: 220px;
            background: rgba(15, 23, 42, 0.4); /* Lower opacity */
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1.5rem;
            pointer-events: auto;
            border-radius: 4px;
            transform: translateX(-10px); /* Pull back slightly */
            transition: transform 0.3s ease;
        }

        .data-panel:hover {
            transform: translateX(0);
            background: rgba(15, 23, 42, 0.7);
        }

        /* REVISED: Strict column grid for typography */
        .data-row {
            display: grid;
            grid-template-columns: 1fr auto;
            column-gap: 1rem;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15); /* Standardized opacity */
            padding-bottom: 0.5rem;
        }

        .data-label {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-value {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text-main);
            font-weight: bold;
            text-align: right;
        }

        .status-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--danger);
            margin-right: 6px;
            box-shadow: 0 0 10px var(--danger);
            animation: pulse 2s infinite;
        }

        .footer {
            grid-column: 1 / 3;
            grid-row: 3 / 4;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            padding-bottom: 1rem;
        }

        .compass {
            width: 48px;
            height: 48px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-weight: bold;
            font-size: 0.8rem;
            color: var(--text-muted);
            background: rgba(0,0,0,0.2);
        }

        /* --- Animations --- */
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* --- SVG Styles --- */
        .wind-streak {
            stroke: rgba(255, 255, 255, 0.4);
            stroke-width: 1.5;
            stroke-linecap: round;
        }

    </style>
</head>
<body>

<div class="screen-container">
    
    <!-- Background / Scene SVG -->
    <svg class="scene-layer" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Sky Gradient: Dramatic Sunset/Dusk -->
            <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
                <stop offset="30%" style="stop-color:#312e81;stop-opacity:1" />
                <stop offset="70%" style="stop-color:#c026d3;stop-opacity:0.8" />
                <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.6" />
            </linearGradient>

            <!-- Cliff Gradient: High contrast, detailed -->
            <linearGradient id="cliffGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#020617;stop-opacity:1" />
                <stop offset="40%" style="stop-color:#1e293b;stop-opacity:1" />
                <stop offset="80%" style="stop-color:#334155;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
            </linearGradient>

            <!-- Canopy Gradient: Volumetric feel -->
            <linearGradient id="canopyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:1" />
            </linearGradient>

            <!-- Depth Blur Filter -->
            <filter id="blurMist">
                <feGaussianBlur in="SourceGraphic" stdDeviation="25" />
            </filter>
        </defs>

        <!-- 1. Sky Background -->
        <rect width="1920" height="1080" fill="url(#skyGradient)" />

        <!-- 2. Distant Landscape (Atmospheric Depth) -->
        <g id="distant-mountains" opacity="0.7">
            <!-- Far Range -->
            <path d="M0,1080 L0,550 Q400,450 800,650 T1920,500 L1920,1080 Z" fill="#3b0764" filter="url(#blurMist)" />
            <!-- Mid Range -->
            <path d="M0,1080 L0,700 Q600,600 1200,850 T1920,700 L1920,1080 Z" fill="#4c1d95" opacity="0.8" filter="url(#blurMist)" />
        </g>

        <!-- 3. Wind / Motion Cues (REVISED: Dynamic Streaks) -->
        <g id="wind-group"></g>

        <!-- 4. The Dramatic Cliff (REVISED: Jagged, Layered, Detailed) -->
        <g id="cliff-group">
            <!-- Main Cliff Silhouette (Jagged Path) -->
            <path class="cliff-face" d="M-100,-50 L550,-50 L550,150 L520,180 L580,250 L500,320 L540,380 L450,450 L480,520 L380,600 L420,680 L320,750 L360,850 L250,950 L300,1080 L-100,1200 Z" 
                  fill="url(#cliffGradient)" stroke="#0f172a" stroke-width="2" />
            
            <!-- REVISED: Internal Contour Lines (Geological Depth) -->
            <g stroke="#020617" stroke-width="3" fill="none" opacity="0.6">
                <path d="M550,150 L520,180 L580,250" stroke-width="4" stroke="#000" /> <!-- Edge highlight shadow -->
                <path d="M500,320 L540,380 L450,450" />
                <path d="M450,450 L480,520 L380,600" />
                <path d="M380,600 L420,680 L320,750" />
                <path d="M320,750 L360,850 L250,950" />
                
                <!-- Secondary Texture Lines -->
                <path d="M520,180 L500,320" stroke-width="1" stroke="#000" opacity="0.5" />
                <path d="M540,380 L480,520" stroke-width="1" stroke="#000" opacity="0.5" />
                <path d="M420,680 L360,850" stroke-width="1" stroke="#000" opacity="0.5" />
            </g>

            <!-- REVISED: Edge Highlight (Sunlight hitting the lip) -->
            <path d="M550,-50 L550,150 L520,180 L580,250 L500,320" 
                  fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.4" />
        </g>

        <!-- 5. The Parachuter Group (REVISED: Center-Right, Detailed Geometry) -->
        <!-- Positioned around x=1100, y=300 -->
        <g id="parachuter-group" transform="translate(1100, 300)">
            
            <!-- REVISED: Canopy with Distinct Panel Geometry -->
            <g id="canopy">
                <!-- Main Canopy Shape -->
                <path class="parachute-canopy" d="M-160,0 C-160,-120 160,-120 160,0 C160,30 80,40 0,40 C-80,40 -160,30 -160,0 Z" 
                      fill="url(#canopyGradient)" stroke="#94a3b8" stroke-width="1" />
                
                <!-- Panel Lines (Geometry) -->
                <g stroke="#94a3b8" stroke-width="1" fill="none" opacity="0.6">
                    <path d="M0,-100 L0,35" />
                    <path d="M-40,-105 L-20,35" />
                    <path d="M40,-105 L20,35" />
                    <path d="M-80,-95 L-40,35" />
                    <path d="M80,-95 L40,35" />
                    <path d="M-120,-70 L-60,30" />
                    <path d="M120,-70 L60,30" />
                </g>
                
                <!-- Top Highlight (Sun reflection) -->
                <path d="M-160,0 C-160,-120 160,-120 160,0 C160,-10 80,-20 0,-20 C-80,-20 -160,-10 -160,0 Z" 
                      fill="#fff" opacity="0.2" />
            </g>

            <!-- REVISED: Taut Harness Lines -->
            <g stroke="#cbd5e1" stroke-width="1.5" fill="none">
                <!-- Left Lines -->
                <line x1="-120" y1="5" x2="-10" y2="180" />
                <line x1="-80" y1="25" x2="-5" y2="180" />
                <line x1="-40" y1="35" x2="-2" y2="180" />
                <!-- Right Lines -->
                <line x1="120" y1="5" x2="10" y2="180" />
                <line x1="80" y1="25" x2="5" y2="180" />
                <line x1="40" y1="35" x2="2" y2="180" />
            </g>

            <!-- Harness Block -->
            <rect x="-12" y="175" width="24" height="10" rx="2" fill="#334155" stroke="#94a3b8" />

            <!-- REVISED: Suspended Human Figure (Dynamic Silhouette) -->
            <g class="silhouette" fill="#0f172a">
                <!-- Torso -->
                <path d="M-10,185 L-8,220 L8,220 L10,185 Z" />
                <!-- Head (Helmet) -->
                <circle cx="0" cy="178" r="9" />
                <!-- Legs (Dangling, relaxed) -->
                <path d="M-8,220 L-15,260 L-20,270" stroke="#0f172a" stroke-width="7" stroke-linecap="round" fill="none" />
                <path d="M8,220 L15,260 L20,270" stroke="#0f172a" stroke-width="7" stroke-linecap="round" fill="none" />
                <!-- Arms (Holding toggles/relaxed) -->
                <path d="M-10,190 C-25,195 -35,210 -30,220" stroke="#0f172a" stroke-width="6" fill="none" stroke-linecap="round"/>
                <path d="M10,190 C25,195 35,210 30,220" stroke="#0f172a" stroke-width="6" fill="none" stroke-linecap="round"/>
            </g>
        </g>

        <!-- 6. Mist Overlay at bottom -->
        <rect x="0" y="950" width="1920" height="130" fill="url(#skyGradient)" opacity="0.5" filter="url(#blurMist)" />
    </svg>

    <!-- UI Overlay -->
    <div class="ui-layer">
        <div class="header">
            <h1>Alpine<br>Descent</h1>
            <div class="subtitle">Operation: Freefall // Sector 4</div>
        </div>

        <!-- REVISED: Data Panel (Right side, lower opacity, strict grid) -->
        <div class="data-panel">
            <div class="data-row">
                <span class="data-label">Altitude</span>
                <span class="data-value" id="alt-val">14,200 ft</span>
            </div>
            <div class="data-row">
                <span class="data-label">Vertical Speed</span>
                <span class="data-value">-24 ft/s</span>
            </div>
            <div class="data-row">
                <span class="data-label">Wind Vector</span>
                <span class="data-value">NW 12mph</span>
            </div>
            <div class="data-row">
                <span class="data-label">Canopy Status</span>
                <span class="data-value" style="color:var(--success)">NOMINAL</span>
            </div>
            <div class="data-row" style="border:none;">
                <span class="data-label">Proximity</span>
                <span class="data-value"><span class="status-indicator"></span>CAUTION</span>
            </div>
            
            <!-- Decorative extra data to fill height -->
            <div class="data-row">
                <span class="data-label">G-Force</span>
                <span class="data-value">1.02 G</span>
            </div>
            <div class="data-row">
                <span class="data-label">GPS Lock</span>
                <span class="data-value">ACTIVE</span>
            </div>
        </div>

        <div class="footer">
            <div>
                <p>SYS.ONLINE</p>
                <p>RENDER_ENGINE: SVG_V2</p>
            </div>
            <div class="compass">N</div>
            <div style="text-align: right;">
                <p>DESIGN: SENIOR_FRONTEND</p>
                <p>NO_EXTERNAL_ASSETS</p>
            </div>
        </div>
    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const svg = document.querySelector('.scene-layer');
        const windGroup = document.getElementById('wind-group');
        const parachuter = document.getElementById('parachuter-group');
        const altVal = document.getElementById('alt-val');
        
        // --- Animation State ---
        let time = 0;
        let altitude = 14200;
        
        // --- Generate Wind Lines (REVISED: Faster, gradient opacity feel) ---
        const windLines = [];
        const numLines = 30;
        
        for(let i=0; i<numLines; i++) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            // Spread across the sky
            const y = Math.random() * 900; // Keep above ground mist
            const x = Math.random() * 1920;
            const len = 100 + Math.random() * 200; // Longer streaks for speed
            
            line.setAttribute("x1", x);
            line.setAttribute("y1", y);
            line.setAttribute("x2", x + len);
            line.setAttribute("y2", y);
            line.setAttribute("class", "wind-streak");
            
            // Opacity based on speed/length to simulate motion blur
            const opacity = 0.1 + (len / 300); 
            line.setAttribute("opacity", Math.min(opacity, 0.6));
            
            windGroup.appendChild(line);
            windLines.push({
                el: line,
                x: x,
                y: y,
                speed: 4 + Math.random() * 8, // Faster wind
                len: len
            });
        }

        // --- Main Animation Loop ---
        function animate() {
            time += 0.015;

            // 1. Parachuter Physics (Bobbing & Drifting)
            // Moves down slowly, bobs vertically, sways horizontally
            const bobY = Math.sin(time * 1.5) * 15; // Deeper bob
            const swayX = Math.sin(time * 0.8) * 20; // Wider sway
            
            // Calculate descent loop
            // Start at y=300, go down to y=900, reset
            const descentCycle = (time * 30) % 1000; 
            const baseY = 300 + descentCycle;
            
            // Apply transform to the group
            parachuter.setAttribute('transform', `translate(${1100 + swayX}, ${baseY + bobY})`);

            // 2. Wind Animation (REVISED: Consistent Vector)
            windLines.forEach(line => {
                line.x += line.speed;
                // Reset if off screen right
                if(line.x > 1920) {
                    line.x = -line.len - 50;
                    line.y = Math.random() * 900; // Respawn in sky area
                }
                line.el.setAttribute("x1", line.x);
                line.el.setAttribute("x2", line.x + line.len);
            });

            // 3. Data Update Simulation
            altitude -= 1;
            if(altitude < 14000) altitude = 14200;
            altVal.innerText = altitude.toLocaleString() + " ft";

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>

</body>
</html>
