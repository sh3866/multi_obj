<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUDUS // Architect</title>
    <style>
        :root {
            /* Palette: Technical Workshop */
            --bg-canvas: #0f1115; /* Deep void */
            --bg-panel: #161920; /* Dark surface */
            --bg-surface: #1e222b; /* Card base */
            --bg-surface-highlight: #2a2f38; /* Card hover */
            --bg-input: #0b0d10;
            
            --border-subtle: #2f3642;
            --border-focus: #f59e0b;
            
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            /* Accents */
            --accent-primary: #f97316; /* Burnt Orange */
            --accent-primary-glow: rgba(249, 115, 22, 0.25);
            --accent-secondary: #38bdf8; /* Cyan */
            
            --success: #10b981;
            --danger: #ef4444;

            /* Board Terrain */
            --terrain-base: #2d3748;
            --terrain-highlight: #4a5568;
            --terrain-water: #1e3a8a;
            --terrain-grass: #3f6212;
            --terrain-mountain: #78350f;
            
            /* Typography */
            --font-display: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --font-mono: 'Menlo', 'Consolas', 'Monaco', 'Courier New', monospace;
            
            /* Spacing */
            --radius-md: 6px;
            --radius-sm: 2px;
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.15);
            --shadow-deep: 0 20px 25px -5px rgba(0, 0, 0, 0.6), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            font-family: var(--font-display);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- 1. Header --- */
        header {
            height: 48px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 50;
            flex-shrink: 0;
        }

        .brand {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
        }

        .brand-icon {
            width: 20px;
            height: 20px;
            background: var(--accent-primary);
            border-radius: 2px;
            position: relative;
            box-shadow: 0 0 8px var(--accent-primary-glow);
        }

        .header-actions button {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .header-actions button:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        /* --- Main Layout (Horizontal Split) --- */
        main {
            flex: 1;
            display: flex;
            height: calc(100vh - 48px);
            overflow: hidden;
        }

        /* --- 2. Left Sidebar (Control Center) --- */
        .sidebar {
            width: 320px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 20;
        }

        .sidebar-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .section-header {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent-primary);
            margin-bottom: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 8px;
        }
        .section-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-subtle);
            opacity: 0.5;
        }

        /* Cards */
        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 12px;
            box-shadow: var(--shadow-card);
        }

        .card-title {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-primary);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        /* Inputs */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }
        .input-group:last-child { margin-bottom: 0; }
        
        .input-row {
            display: flex;
            gap: 8px;
        }

        label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }

        .input-field {
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            width: 100%;
            transition: all 0.2s;
        }
        .input-field:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        /* Toggle Switch */
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
        }
        .toggle-switch {
            position: relative;
            width: 32px;
            height: 18px;
            appearance: none;
            background: var(--bg-input);
            border-radius: 9px;
            border: 1px solid var(--border-subtle);
            outline: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 12px;
            height: 12px;
            background: var(--text-muted);
            border-radius: 50%;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .toggle-switch:checked {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
        }
        .toggle-switch:checked::after {
            transform: translateX(14px);
            background: #fff;
        }

        /* Range Slider */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 2px;
            background: var(--border-subtle);
            margin-top: 6px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: var(--accent-primary);
            border-radius: 2px;
            cursor: pointer;
            margin-top: -5px;
        }

        /* --- Action Bar (Sidebar Footer) --- */
        .action-bar {
            background: var(--bg-panel);
            border-top: 1px solid var(--border-subtle);
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }

        .validation-summary {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            background: var(--bg-surface);
            padding: 8px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
        }
        
        .check-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
        }
        .check-item.valid { color: var(--success); }
        .check-item.invalid { color: var(--danger); }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 10px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.8rem;
            font-family: var(--font-mono);
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: #000;
            box-shadow: 0 0 10px var(--accent-primary-glow);
        }
        .btn-primary:hover:not(:disabled) {
            background: #ea580c;
            box-shadow: 0 0 15px var(--accent-primary-glow);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
        }
        .btn-secondary:hover {
            background: var(--bg-surface-highlight);
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-panel); }
        ::-webkit-scrollbar-thumb { background: #333842; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }

        /* --- 3. Right Canvas (The Workbench) --- */
        .stage-container {
            flex: 1;
            background-color: #12141a;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            
            /* Technical Blueprint Grid */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Large grid lines for blueprint feel */
        .stage-container::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
            background-size: 200px 200px;
            pointer-events: none;
        }

        .board-wrapper {
            position: relative;
            background: #1a1e26;
            padding: 24px;
            border-radius: 4px;
            /* Physical Object Feel */
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.5),
                0 0 0 1px #333842,
                0 0 0 2px rgba(0,0,0,0.8);
            transition: transform 0.3s ease;
            z-index: 5;
        }

        canvas {
            display: block;
            border: 1px solid #000;
            cursor: crosshair;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .board-overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(15, 17, 21, 0.9);
            backdrop-filter: blur(4px);
            padding: 8px 12px;
            border-radius: 2px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
            z-index: 10;
            pointer-events: none;
            border-left: 3px solid var(--accent-primary);
        }
        
        .overlay-title {
            color: var(--text-primary);
            font-weight: 700;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.05em;
        }
        
        .status-dot {
            width: 4px;
            height: 4px;
            background: var(--success);
            box-shadow: 0 0 4px var(--success);
        }

    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-icon"></div>
            LUDUS // ARCHITECT
        </div>
        <div class="header-actions">
            <button>Export JSON</button>
            <button>Save Project</button>
        </div>
    </header>

    <main>
        <!-- SECTION 1: LEFT SIDEBAR (Controls) -->
        <aside class="sidebar">
            <div class="sidebar-scroll">
                
                <!-- Group: Specs -->
                <div>
                    <div class="section-header">Board Specifications</div>
                    
                    <!-- Card: Dimensions -->
                    <div class="card">
                        <div class="card-title">Grid Geometry</div>
                        <div class="input-group">
                            <label>Dimensions (Rows x Cols)</label>
                            <div class="input-row">
                                <input type="number" id="rows" value="8" min="3" max="20" class="input-field">
                                <input type="number" id="cols" value="8" min="3" max="20" class="input-field">
                            </div>
                        </div>
                        <div class="input-group">
                            <label>Topology</label>
                            <select id="geometry" class="input-field">
                                <option value="square">Square Grid</option>
                                <option value="hex">Hexagonal Grid</option>
                            </select>
                        </div>
                    </div>

                    <!-- Card: Initial Layout -->
                    <div class="card" style="margin-top: 12px;">
                        <div class="card-title">Deployment Zones</div>
                        <div class="input-group">
                            <label>Blue Unit Start (X, Y)</label>
                            <div class="input-row">
                                <input type="number" value="0" class="input-field" placeholder="X">
                                <input type="number" value="0" class="input-field" placeholder="Y">
                            </div>
                        </div>
                        <div class="input-group">
                            <label>Orange Unit Start (X, Y)</label>
                            <div class="input-row">
                                <input type="number" value="7" class="input-field" placeholder="X">
                                <input type="number" value="7" class="input-field" placeholder="Y">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Group: Rules (New Feature) -->
                <div>
                    <div class="section-header">Game Logic & Rules</div>
                    
                    <!-- Rule: Movement -->
                    <div class="card">
                        <div class="card-title">Movement Mechanics</div>
                        <div class="toggle-row">
                            <label style="color: var(--text-primary);">Orthogonal Only</label>
                            <input type="checkbox" class="toggle-switch">
                        </div>
                        <div class="input-group">
                            <label>Base Move Cost <span style="font-family: var(--font-mono); color: var(--accent-secondary); float: right;">3 MP</span></label>
                            <input type="range" min="1" max="10" value="3">
                        </div>
                    </div>

                    <!-- Rule: Win State -->
                    <div class="card" style="margin-top: 12px;">
                        <div class="card-title">Win Conditions</div>
                        <div class="input-group">
                            <label>Victory Type</label>
                            <select class="input-field">
                                <option>Elimination</option>
                                <option>Control 3 Capitals</option>
                                <option>Score Limit</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Scoring Multiplier</label>
                            <input type="number" value="1.0" step="0.1" class="input-field">
                        </div>
                    </div>
                </div>

                <!-- Group: Generators -->
                <div>
                    <div class="section-header">Generators</div>
                    <div class="card">
                        <div class="toggle-row">
                            <span style="font-size: 0.8rem;">Terrain Noise</span>
                            <input type="checkbox" class="toggle-switch" checked>
                        </div>
                        <div class="toggle-row">
                            <span style="font-size: 0.8rem;">Resource Nodes</span>
                            <input type="checkbox" class="toggle-switch" checked>
                        </div>
                    </div>
                </div>

            </div>

            <!-- SECTION 2: ACTION BAR (Sidebar Footer) -->
            <div class="action-bar">
                <div class="validation-summary">
                    <div class="check-item valid">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        Symmetry Valid
                    </div>
                    <div class="check-item valid">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        Start Positions Defined
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button class="btn btn-secondary" id="generate-btn">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/></svg>
                        Regen
                    </button>
                    <button class="btn btn-primary" id="start-game-btn">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        Start Game
                    </button>
                </div>
            </div>
        </aside>

        <!-- SECTION 3: RIGHT CANVAS (Live Preview) -->
        <section class="stage-container">
            <div class="board-overlay">
                <div class="overlay-title">
                    <div class="status-dot"></div>
                    LIVE PREVIEW
                </div>
                <div id="coords" style="margin-top: 4px;">COORD: --</div>
                <div style="opacity: 0.6; font-size: 0.65rem; margin-top: 2px;">ENGINE: ACTIVE</div>
            </div>
            <div class="board-wrapper" id="board-wrapper">
                <canvas id="gameBoard"></canvas>
            </div>
        </section>
    </main>

    <script>
        /**
         * LUDUS ENGINE - REVISED
         * Focus: Visual polish, depth, and "Tabletop" feel.
         */
        
        const canvas = document.getElementById('gameBoard');
        const ctx = canvas.getContext('2d');
        const boardWrapper = document.getElementById('board-wrapper');
        const rowsInput = document.getElementById('rows');
        const colsInput = document.getElementById('cols');
        const generateBtn = document.getElementById('generate-btn');
        const startGameBtn = document.getElementById('start-game-btn');
        const geometrySelect = document.getElementById('geometry');
        const coordsDisplay = document.getElementById('coords');

        // State
        let config = {
            rows: 8,
            cols: 8,
            cellSize: 60,
            geometry: 'square',
            seed: Date.now()
        };

        // Colors: Deep, rich colors for the tabletop
        const PALETTE = {
            bg: '#1e222b',
            water: '#1e3a8a',
            waterLight: '#2563eb',
            grass: '#3f6212',
            grassLight: '#4d7c0f',
            mountain: '#78350f',
            snow: '#e2e8f0',
            stroke: 'rgba(0,0,0,0.2)',
            highlight: '#f97316'
        };

        function resizeCanvas() {
            const stage = document.querySelector('.stage-container');
            // Calculate available space with padding
            const maxW = stage.clientWidth - 120; 
            const maxH = stage.clientHeight - 120;

            // Determine cell size based on grid dimensions
            const sizeByCols = Math.floor(maxW / config.cols);
            const sizeByRows = Math.floor(maxH / config.rows);
            
            // Clamp size
            config.cellSize = Math.min(sizeByCols, sizeByRows, 80); 

            canvas.width = config.cols * config.cellSize;
            canvas.height = config.rows * config.cellSize;
        }

        function drawSquare(x, y, size, type, r, c) {
            const padding = 2;
            const isAlt = (r + c) % 2 === 0;
            
            // Base Colors
            let fillBase = isAlt ? PALETTE.grass : PALETTE.grassLight;
            
            if (type === 'water') {
                fillBase = PALETTE.water;
            } else if (type === 'mountain') {
                fillBase = PALETTE.mountain;
            }

            // 1. Draw Base
            ctx.fillStyle = fillBase;
            ctx.fillRect(x + padding, y + padding, size - padding*2, size - padding*2);
            
            // 2. Draw "Bevel" (Light Top/Left, Dark Bottom/Right)
            ctx.lineWidth = 2;
            
            // Top & Left (Light)
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.beginPath();
            ctx.moveTo(x + padding, y + size - padding);
            ctx.lineTo(x + padding, y + padding);
            ctx.lineTo(x + size - padding, y + padding);
            ctx.stroke();

            // Bottom & Right (Dark)
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.moveTo(x + size - padding, y + padding);
            ctx.lineTo(x + size - padding, y + size - padding);
            ctx.lineTo(x + padding, y + size - padding);
            ctx.stroke();

            // 3. Detail (Terrain Specific)
            if (type === 'mountain') {
                // Snow Cap Triangle
                ctx.fillStyle = PALETTE.snow;
                ctx.beginPath();
                ctx.moveTo(x + size/2, y + padding + 10);
                ctx.lineTo(x + size/2 - 12, y + size/2 + 5);
                ctx.lineTo(x + size/2 + 12, y + size/2 + 5);
                ctx.fill();
            } else if (type === 'water') {
                // Wave Lines
                ctx.strokeStyle = PALETTE.waterLight;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x + padding + 10, y + size/2);
                ctx.quadraticCurveTo(x + size/2, y + size/2 - 10, x + size - padding - 10, y + size/2);
                ctx.stroke();
            }
        }

        function drawHex(cx, cy, size, type) {
            const r = size / 2 - 4;
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = 2 * Math.PI / 6 * i;
                const x = cx + r * Math.cos(angle);
                const y = cy + r * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            
            ctx.fillStyle = PALETTE.grass;
            ctx.fill();
            
            // Hex Bevel
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.stroke();
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const cs = config.cellSize;

            if (config.geometry === 'square') {
                for (let r = 0; r < config.rows; r++) {
                    for (let c = 0; c < config.cols; c++) {
                        // Simple pseudo-random noise
                        const noiseVal = Math.sin(c * 0.5 + config.seed/1000) * Math.cos(r * 0.5 + config.seed/1000);
                        let type = 'grass';
                        if (noiseVal > 0.6) type = 'mountain';
                        else if (noiseVal < -0.6) type = 'water';
                        
                        drawSquare(c * cs, r * cs, cs, type, r, c);
                    }
                }
            } else if (config.geometry === 'hex') {
                const r = cs / 2 - 2;
                const h = Math.sqrt(3) * r;
                const v = 1.5 * r;
                
                for (let rIdx = 0; rIdx < config.rows; rIdx++) {
                    for (let cIdx = 0; cIdx < config.cols; cIdx++) {
                        const cx = cIdx * (1.5 * r) + (rIdx % 2) * (0.75 * r) + r;
                        const cy = rIdx * v + r;
                        drawHex(cx, cy, cs, 'plain');
                    }
                }
            }
        }

        function updateUI() {
            // Update overlay text
            const overlayGrid = document.querySelector('.board-overlay div:last-child');
            if(overlayGrid) overlayGrid.textContent = `GRID: ${config.rows}x${config.cols}`;
        }

        function init() {
            resizeCanvas();
            drawBoard();
            updateUI();
        }

        // --- Interactivity ---

        rowsInput.addEventListener('input', (e) => {
            config.rows = parseInt(e.target.value);
            updateUI();
            resizeCanvas();
            drawBoard();
        });

        colsInput.addEventListener('input', (e) => {
            config.cols = parseInt(e.target.value);
            updateUI();
            resizeCanvas();
            drawBoard();
        });

        geometrySelect.addEventListener('change', (e) => {
            config.geometry = e.target.value;
            resizeCanvas();
            drawBoard();
        });

        generateBtn.addEventListener('click', () => {
            const btn = generateBtn;
            const originalText = btn.innerHTML;
            btn.innerHTML = `Generating...`;
            btn.style.opacity = '0.7';
            
            setTimeout(() => {
                config.seed = Date.now();
                drawBoard();
                btn.innerHTML = originalText;
                btn.style.opacity = '1';
                
                // Flash effect
                canvas.style.filter = 'brightness(1.2)';
                setTimeout(() => canvas.style.filter = 'none', 200);
            }, 300);
        });
        
        startGameBtn.addEventListener('click', () => {
             const btn = startGameBtn;
             btn.innerHTML = "Launching...";
             setTimeout(() => {
                 btn.innerHTML = "Start Game";
                 alert("Game Session Started (Simulation)");
             }, 800);
        });

        // Canvas Hover
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const c = Math.floor(x / config.cellSize);
            const r = Math.floor(y / config.cellSize);
            
            if (c >= 0 && c < config.cols && r >= 0 && r < config.rows) {
                coordsDisplay.textContent = `COORD: X${c}, Y${r}`;
                
                // Redraw to clear previous hover
                drawBoard();
                
                // Draw Highlight
                ctx.strokeStyle = PALETTE.highlight;
                ctx.lineWidth = 3;
                ctx.strokeRect(c * config.cellSize + 2, r * config.cellSize + 2, config.cellSize - 4, config.cellSize - 4);
            }
        });

        canvas.addEventListener('mouseleave', () => {
            coordsDisplay.textContent = "COORD: --";
            drawBoard();
        });

        window.addEventListener('resize', () => {
            resizeCanvas();
            drawBoard();
        });
        
        init();

    </script>
</body>
</html>
