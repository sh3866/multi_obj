<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUDUS // Board Architect</title>
    <style>
        :root {
            /* Palette: Tactical Tabletop */
            --bg-body: #0f172a;
            --bg-panel: #1e293b;
            --bg-surface: #334155;
            --bg-input: #0f172a;
            
            --border-subtle: #334155;
            --border-focus: #f59e0b;
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --accent-primary: #f59e0b; /* Amber */
            --accent-secondary: #d97706;
            --accent-glow: rgba(245, 158, 11, 0.2);
            
            --success: #10b981;
            --danger: #ef4444;

            /* Board Colors - Thematic */
            --terrain-water: #0d9488; /* Deep Teal */
            --terrain-grass: #3f6212; /* Olive Green */
            --terrain-mountain: #b45309; /* Warm Ochre */
            --terrain-snow: #f1f5f9; /* Slate 100 */
            
            /* Typography */
            --font-display: 'Georgia', 'Times New Roman', serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'Menlo', 'Monaco', 'Courier New', monospace;
            
            /* Spacing & Radius */
            --radius-unified: 6px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Header --- */
        header {
            height: 60px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: var(--bg-panel);
            z-index: 10;
            flex-shrink: 0;
        }

        .brand {
            font-family: var(--font-display);
            font-weight: bold;
            font-size: 1.25rem;
            letter-spacing: 0.05em;
            color: var(--accent-primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 24px;
            height: 24px;
            background: var(--accent-primary);
            mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/></svg>') no-repeat center;
            -webkit-mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/></svg>') no-repeat center;
        }

        .header-actions {
            display: flex;
            gap: 16px;
        }

        /* --- Layout: Top Stage, Bottom Controls --- */
        main {
            flex: 1;
            display: grid;
            grid-template-rows: 65% 35%;
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        /* --- Top: The Stage --- */
        .stage-container {
            background-color: #0b1120;
            /* Felt Texture Effect */
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(30, 41, 59, 0.8) 0%, rgba(11, 17, 32, 1) 100%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--border-subtle);
        }

        .board-container {
            position: relative;
            transition: transform 0.3s ease;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.6),
                0 0 0 1px rgba(255,255,255,0.1);
            border-radius: var(--radius-unified);
            padding: 8px;
            background: #1e293b; 
            border: 4px solid #0f172a; /* Heavy wood/plastic rim feel */
        }

        canvas {
            display: block;
            border-radius: 2px;
            cursor: crosshair;
        }

        .board-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            padding: 8px 12px;
            border-radius: var(--radius-unified);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-secondary);
            pointer-events: none;
            border: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* --- Bottom: Control Deck --- */
        .controls-deck {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--bg-panel);
            overflow: hidden;
        }

        .panel {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            border-right: 1px solid var(--border-subtle);
        }
        
        .panel:last-child {
            border-right: none;
        }

        .panel-header {
            padding: 16px 24px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-subtle);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
        }

        .panel-content {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* --- Controls & Inputs --- */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        .value-display {
            font-family: var(--font-mono);
            color: var(--accent-primary);
        }

        /* Slider Styling */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: var(--bg-surface);
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--text-primary);
            border: 2px solid var(--accent-primary);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
            margin-top: -6px; /* Center on track */
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .input-wrapper {
            position: relative;
        }
        
        .input-wrapper input[type="number"], .input-wrapper select {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: var(--radius-unified);
            font-family: var(--font-ui);
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }
        .input-wrapper input:focus, .input-wrapper select:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        /* Toggles */
        .toggle-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
        }

        .toggle-switch {
            position: relative;
            width: 40px;
            height: 22px;
            appearance: none;
            background: var(--bg-surface);
            border-radius: 11px;
            outline: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            background: var(--text-secondary);
            border-radius: 50%;
            transition: transform 0.3s, background 0.3s;
        }
        .toggle-switch:checked {
            background: var(--accent-primary);
        }
        .toggle-switch:checked::after {
            transform: translateX(18px);
            background: #0f172a; /* Dark knob on bright track */
        }

        /* --- Rules Editor Upgrade --- */
        .rule-editor-item {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-unified);
            padding: 16px;
            margin-bottom: 12px;
        }
        .rule-editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .rule-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
        }
        .rule-meta {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
            padding: 2px 6px;
            border-radius: 4px;
        }
        .rule-control {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .rule-control input, .rule-control select {
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: var(--radius-unified);
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        /* Validation Box */
        .validation-box {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: var(--radius-unified);
            padding: 16px;
            margin-top: auto;
        }
        .val-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }
        .val-row:last-child { margin-bottom: 0; }
        .val-icon { width: 14px; height: 14px; fill: var(--success); }

        /* --- Buttons --- */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--radius-unified);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Primary: Solid High Contrast */
        .btn-primary {
            background: var(--accent-primary);
            color: #0f172a;
            box-shadow: none;
        }
        .btn-primary:hover {
            background: var(--accent-secondary);
            transform: translateY(-1px);
        }
        .btn-primary:active { transform: translateY(0); }

        /* Secondary: Subtle */
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
        }
        .btn-secondary:hover {
            background: var(--bg-surface);
            border-color: var(--text-secondary);
        }
        
        /* Header Button Variant */
        .btn-header {
            width: auto;
            padding: 8px 16px;
            font-size: 0.85rem;
        }

        /* --- Scrollbar --- */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-surface); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* --- Utility --- */
        .divider { height: 1px; background: var(--border-subtle); margin: 10px 0; }
        
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-icon"></div>
            LUDUS
        </div>
        <div class="header-actions">
            <button class="btn btn-secondary btn-header">Export JSON</button>
            <!-- Start Simulation moved to Header -->
            <button class="btn btn-primary btn-header" id="start-sim-btn">Start Simulation</button>
        </div>
    </header>

    <main>
        <!-- TOP: The Stage (65% Height) -->
        <section class="stage-container">
            <div class="board-overlay">
                <div style="font-weight: bold; color: var(--text-primary);">PREVIEW: TERRAIN</div>
                <div id="coords">X: 0, Y: 0</div>
                <div style="opacity: 0.6; font-size: 0.7rem;">GRID: 8x8</div>
            </div>
            <div class="board-container" id="board-wrapper">
                <canvas id="gameBoard"></canvas>
            </div>
        </section>

        <!-- BOTTOM: Controls Deck (35% Height) -->
        <section class="controls-deck">
            
            <!-- LEFT PANEL: Board Specs -->
            <aside class="panel">
                <div class="panel-header">
                    <span>Board Specs</span>
                    <span style="font-family: var(--font-mono); color: var(--text-muted);">v1.0.2</span>
                </div>
                <div class="panel-content">
                    
                    <div class="control-group">
                        <label>Grid Dimensions <span class="value-display" id="dim-display">8x8</span></label>
                        <div class="grid-inputs">
                            <div class="input-wrapper">
                                <input type="number" id="rows" value="8" min="3" max="20">
                            </div>
                            <div class="input-wrapper">
                                <input type="number" id="cols" value="8" min="3" max="20">
                            </div>
                        </div>
                    </div>

                    <div class="control-group">
                        <label>Tile Complexity <span class="value-display" id="complexity-display">Medium</span></label>
                        <input type="range" id="complexity" min="1" max="3" step="1" value="2">
                    </div>

                    <div class="control-group">
                        <label>Cell Geometry</label>
                        <div class="input-wrapper">
                            <select id="geometry">
                                <option value="square">Square (Classic)</option>
                                <option value="hex">Hexagon (Hive)</option>
                                <option value="octagon">Octagon (Crazy)</option>
                            </select>
                        </div>
                    </div>

                    <div class="divider"></div>

                    <div class="panel-header" style="padding: 0 0 10px 0; border: none; background: transparent; position: static;">
                        <span>Generators</span>
                    </div>

                    <div class="toggle-item">
                        <span style="font-size: 0.9rem;">Terrain Noise</span>
                        <input type="checkbox" class="toggle-switch" checked>
                    </div>
                    <div class="toggle-item">
                        <span style="font-size: 0.9rem;">Resource Nodes</span>
                        <input type="checkbox" class="toggle-switch" checked>
                    </div>
                    <div class="toggle-item">
                        <span style="font-size: 0.9rem;">Fog of War</span>
                        <input type="checkbox" class="toggle-switch">
                    </div>

                    <div style="margin-top: auto;">
                        <button class="btn btn-primary" id="generate-btn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 0 1 9-9"/></svg>
                            Generate Board
                        </button>
                    </div>
                </div>
            </aside>

            <!-- RIGHT PANEL: Rule Logic Editor -->
            <aside class="panel">
                <div class="panel-header">
                    <span>Rule Logic</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                </div>
                <div class="panel-content">
                    
                    <!-- Functional Rule Editor 1 -->
                    <div class="rule-editor-item">
                        <div class="rule-editor-header">
                            <span class="rule-label">Movement Cost</span>
                            <span class="rule-meta">Global</span>
                        </div>
                        <div class="rule-control">
                            <input type="range" min="1" max="10" value="3" style="flex:1;">
                            <span class="value-display">3</span>
                        </div>
                    </div>

                    <!-- Functional Rule Editor 2 -->
                    <div class="rule-editor-item">
                        <div class="rule-editor-header">
                            <span class="rule-label">Victory Condition</span>
                            <span class="rule-meta">Win State</span>
                        </div>
                        <div class="rule-control">
                            <select style="flex:1;">
                                <option>Control 3 Capital Nodes</option>
                                <option>Eliminate All Rivals</option>
                                <option>Score 100 Points</option>
                            </select>
                        </div>
                    </div>

                    <div class="divider"></div>

                    <div class="panel-header" style="padding: 0 0 10px 0; border: none; background: transparent; position: static;">
                        <span>Validation</span>
                    </div>

                    <div class="validation-box" id="validation-box">
                        <div class="val-row">
                            <svg class="val-icon" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                            <span>Grid topology valid</span>
                        </div>
                        <div class="val-row">
                            <svg class="val-icon" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                            <span>Resource balance OK</span>
                        </div>
                        <div class="val-row">
                            <svg class="val-icon" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                            <span>Pathing solvable</span>
                        </div>
                    </div>

                </div>
            </aside>
        </section>
    </main>

    <script>
        /**
         * LUDUS ENGINE
         * A procedural board generator using Canvas API.
         * Updated for Thematic Colors & Layout.
         */
        
        const canvas = document.getElementById('gameBoard');
        const ctx = canvas.getContext('2d');
        const boardWrapper = document.getElementById('board-wrapper');
        const rowsInput = document.getElementById('rows');
        const colsInput = document.getElementById('cols');
        const dimDisplay = document.getElementById('dim-display');
        const complexityInput = document.getElementById('complexity');
        const complexityDisplay = document.getElementById('complexity-display');
        const generateBtn = document.getElementById('generate-btn');
        const geometrySelect = document.getElementById('geometry');
        const coordsDisplay = document.getElementById('coords');

        // State
        let config = {
            rows: 8,
            cols: 8,
            cellSize: 60,
            complexity: 2, // 1: simple, 2: medium, 3: detailed
            geometry: 'square',
            seed: Date.now()
        };

        // Colors: Thematic Tones
        const PALETTE = {
            bg: '#1e293b',
            // Water: Deep Teal
            water: '#0d9488',
            waterDeep: '#0f766e',
            // Grass: Olive
            grass: '#3f6212',
            grassLight: '#4d7c0f',
            // Mountain: Warm Ochre
            mountain: '#b45309',
            mountainLight: '#d97706',
            // Snow
            snow: '#f1f5f9',
            
            // UI
            stroke: '#475569',
            highlight: '#f59e0b'
        };

        // --- Drawing Functions ---

        function resizeCanvas() {
            const stage = document.querySelector('.stage-container');
            const maxW = stage.clientWidth - 100; // Padding
            const maxH = stage.clientHeight - 100;

            const sizeByCols = Math.floor(maxW / config.cols);
            const sizeByRows = Math.floor(maxH / config.rows);
            config.cellSize = Math.min(sizeByCols, sizeByRows, 90); // Cap size

            canvas.width = config.cols * config.cellSize;
            canvas.height = config.rows * config.cellSize;
        }

        function drawSquare(x, y, size, type, id) {
            const padding = 2;
            const isAlt = (Math.floor(x / size) + Math.floor(y / size)) % 2 === 0;
            
            // Base
            let fillBase = isAlt ? PALETTE.grass : PALETTE.grassLight;
            
            // Determine Terrain Type
            if (type === 'water') {
                fillBase = PALETTE.water;
            } else if (type === 'mountain') {
                fillBase = PALETTE.mountain;
            }

            // Draw Base
            ctx.fillStyle = fillBase;
            ctx.fillRect(x + padding, y + padding, size - padding*2, size - padding*2);
            
            // Texture/Detail
            if (type === 'mountain') {
                // Snow Cap
                ctx.fillStyle = PALETTE.snow;
                ctx.beginPath();
                ctx.moveTo(x + size/2, y + padding + 5);
                ctx.lineTo(x + size/2 - 10, y + size/2);
                ctx.lineTo(x + size/2 + 10, y + size/2);
                ctx.fill();
            } else if (type === 'water') {
                // Wave lines
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x + padding + 5, y + size/2);
                ctx.quadraticCurveTo(x + size/2, y + size/2 - 10, x + size - padding - 5, y + size/2);
                ctx.stroke();
            }

            // Border (subtle)
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.lineWidth = 1;
            ctx.strokeRect(x + padding, y + padding, size - padding*2, size - padding*2);
        }

        function drawHex(cx, cy, size, type) {
            const r = size / 2 - 4;
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = 2 * Math.PI / 6 * i;
                const x = cx + r * Math.cos(angle);
                const y = cy + r * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fillStyle = PALETTE.grass;
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.stroke();
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const cs = config.cellSize;

            if (config.geometry === 'square') {
                for (let r = 0; r < config.rows; r++) {
                    for (let c = 0; c < config.cols; c++) {
                        // Procedural Generation based on seed
                        // Simple pseudo-noise
                        const noiseVal = Math.sin(c * 0.5 + config.seed/1000) * Math.cos(r * 0.5 + config.seed/1000);
                        let type = 'grass';
                        if (noiseVal > 0.6) type = 'mountain';
                        else if (noiseVal < -0.6) type = 'water';
                        
                        drawSquare(c * cs, r * cs, cs, type);
                    }
                }
            } else if (config.geometry === 'hex') {
                const r = cs / 2 - 2;
                const h = Math.sqrt(3) * r;
                const v = 1.5 * r;
                
                for (let rIdx = 0; rIdx < config.rows; rIdx++) {
                    for (let cIdx = 0; cIdx < config.cols; cIdx++) {
                        const cx = cIdx * (1.5 * r) + (rIdx % 2) * (0.75 * r) + r;
                        const cy = rIdx * v + r;
                        drawHex(cx, cy, cs, 'plain');
                    }
                }
            }
        }

        function updateUI() {
            dimDisplay.textContent = `${config.rows}x${config.cols}`;
            const compLabels = ['Low', 'Medium', 'High'];
            complexityDisplay.textContent = compLabels[config.complexity - 1];
            
            // Update overlay text
            document.querySelector('.board-overlay div:last-child').textContent = `GRID: ${config.rows}x${config.cols}`;
        }

        function init() {
            resizeCanvas();
            drawBoard();
            updateUI();
        }

        // --- Interactivity ---

        rowsInput.addEventListener('input', (e) => {
            config.rows = parseInt(e.target.value);
            updateUI();
            resizeCanvas();
            drawBoard();
        });

        colsInput.addEventListener('input', (e) => {
            config.cols = parseInt(e.target.value);
            updateUI();
            resizeCanvas();
            drawBoard();
        });

        complexityInput.addEventListener('input', (e) => {
            config.complexity = parseInt(e.target.value);
            updateUI();
        });

        geometrySelect.addEventListener('change', (e) => {
            config.geometry = e.target.value;
            resizeCanvas();
            drawBoard();
        });

        generateBtn.addEventListener('click', () => {
            const btn = generateBtn;
            const originalText = btn.innerHTML;
            
            btn.innerHTML = `<svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Generating...`;
            
            setTimeout(() => {
                config.seed = Date.now();
                drawBoard();
                btn.innerHTML = originalText;
                
                // Flash effect
                canvas.style.filter = 'brightness(1.3)';
                setTimeout(() => canvas.style.filter = 'none', 150);
            }, 500);
        });

        // Canvas Hover
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const c = Math.floor(x / config.cellSize);
            const r = Math.floor(y / config.cellSize);
            
            if (c >= 0 && c < config.cols && r >= 0 && r < config.rows) {
                coordsDisplay.textContent = `X: ${c}, Y: ${r}`;
                
                drawBoard();
                ctx.strokeStyle = PALETTE.highlight;
                ctx.lineWidth = 3;
                ctx.strokeRect(c * config.cellSize + 2, r * config.cellSize + 2, config.cellSize - 4, config.cellSize - 4);
            }
        });

        canvas.addEventListener('mouseleave', () => {
            coordsDisplay.textContent = "X: -, Y: -";
            drawBoard();
        });

        // Spinner CSS
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes spin { 100% { transform: rotate(360deg); } }
            .spin { animation: spin 1s linear infinite; }
        `;
        document.head.appendChild(styleSheet);

        window.addEventListener('resize', () => {
            resizeCanvas();
            drawBoard();
        });
        
        init();

    </script>
</body>
</html>
