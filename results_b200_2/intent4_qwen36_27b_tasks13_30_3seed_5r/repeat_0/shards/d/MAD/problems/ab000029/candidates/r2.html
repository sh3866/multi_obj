<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUDUS // Board Architect</title>
    <style>
        :root {
            /* Palette: Digital Workshop */
            --bg-canvas: #050505; /* Deep dark background for stage */
            --bg-panel: #121212; /* Dark surface for controls */
            --bg-surface: #1e1e1e; /* Card backgrounds */
            --bg-input: #0a0a0a;
            
            --border-subtle: #333333;
            --border-highlight: #444444;
            --border-focus: #f59e0b;
            
            --text-primary: #f0f0f0;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            
            /* Accents */
            --accent-primary: #f97316; /* Neon Orange */
            --accent-primary-hover: #ea580c;
            --accent-secondary: #f59e0b; /* Amber for data */
            
            --success: #10b981;
            --danger: #ef4444;

            /* Board Colors - High Saturation */
            --terrain-water: #0ea5e9; /* Bright Blue */
            --terrain-grass: #22c55e; /* Vibrant Green */
            --terrain-mountain: #f59e0b; /* Bright Orange */
            --terrain-snow: #ffffff;
            
            /* Typography */
            --font-display: system-ui, -apple-system, sans-serif;
            --font-ui: system-ui, -apple-system, sans-serif;
            --font-mono: 'Menlo', 'Consolas', 'Monaco', 'Courier New', monospace;
            
            /* Spacing & Radius */
            --radius-unified: 6px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Header --- */
        header {
            height: 50px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: var(--bg-panel);
            z-index: 20;
            flex-shrink: 0;
        }

        .brand {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 0.05em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-mono); /* Tool feel */
        }

        .brand-icon {
            width: 20px;
            height: 20px;
            background: var(--accent-primary);
            border-radius: 2px;
            display: grid;
            place-items: center;
        }
        
        .brand-icon::after {
            content: '';
            width: 10px;
            height: 10px;
            background: #000;
            border-radius: 50%;
        }

        .header-actions {
            display: flex;
            gap: 16px;
        }

        /* --- Layout: 60/40 Split --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 50px);
            overflow: hidden;
        }

        /* --- Top 60%: The Canvas --- */
        .stage-container {
            flex: 60;
            background-color: var(--bg-canvas);
            /* Subtle grid pattern for workshop feel */
            background-image: 
                linear-gradient(var(--border-subtle) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-subtle) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .board-container {
            position: relative;
            transition: transform 0.3s ease;
            /* Strong shadow to pop */
            box-shadow: 
                0 30px 60px -12px rgba(0,0,0,0.8),
                0 0 0 1px rgba(255,255,255,0.05);
            border-radius: var(--radius-unified);
            padding: 12px;
            background: #1a1a1a; 
            border: 1px solid #333;
        }

        canvas {
            display: block;
            border-radius: 2px;
            cursor: crosshair;
            background: #000;
        }

        .board-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            padding: 10px 14px;
            border-radius: var(--radius-unified);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-secondary);
            pointer-events: none;
            border: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 5;
        }
        
        .overlay-title {
            color: var(--text-primary);
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
        }

        /* --- Validation Bar (Between Canvas and Controls) --- */
        .validation-bar {
            height: 40px;
            background: var(--bg-panel);
            border-top: 1px solid var(--border-subtle);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            padding: 0 24px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            gap: 16px;
            flex-shrink: 0;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--success);
            font-weight: 600;
        }
        
        .status-badge.error { color: var(--danger); }
        
        .status-icon {
            width: 16px;
            height: 16px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.15);
        }
        
        .status-badge.error .status-icon {
            background: rgba(239, 68, 68, 0.15);
        }

        .validation-message {
            color: var(--text-secondary);
            margin-left: auto;
        }

        /* --- Bottom 40%: Control Deck --- */
        .controls-deck {
            flex: 40;
            background: var(--bg-panel);
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
        }

        .panel {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            border-right: 1px solid var(--border-subtle);
        }
        
        .panel:last-child { border-right: none; }

        .panel-header {
            padding: 12px 24px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-subtle);
            font-weight: 700;
            background: var(--bg-panel);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .panel-content {
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- Inputs & Controls --- */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        .value-display {
            font-family: var(--font-mono);
            color: var(--accent-secondary);
            font-size: 0.8rem;
        }

        /* Grid Inputs */
        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .input-wrapper {
            position: relative;
        }
        
        .input-wrapper input[type="number"], 
        .input-wrapper select {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: var(--radius-unified);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }
        .input-wrapper input:focus, .input-wrapper select:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        /* Toggles */
        .toggle-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 0;
        }

        .toggle-switch {
            position: relative;
            width: 36px;
            height: 20px;
            appearance: none;
            background: var(--bg-surface);
            border-radius: 10px;
            outline: none;
            cursor: pointer;
            transition: background 0.3s;
            border: 1px solid var(--border-subtle);
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            background: var(--text-muted);
            border-radius: 50%;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s;
        }
        .toggle-switch:checked {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
        }
        .toggle-switch:checked::after {
            transform: translateX(16px);
            background: #fff;
        }

        /* --- Rule Stack Cards --- */
        .rule-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-unified);
            padding: 12px;
            margin-bottom: 8px;
            transition: border-color 0.2s;
        }
        
        .rule-card:hover {
            border-color: var(--border-highlight);
        }

        .rule-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .rule-title {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .rule-tag {
            font-size: 0.6rem;
            background: rgba(255,255,255,0.1);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-family: var(--font-mono);
        }

        .rule-body {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rule-body input, .rule-body select {
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: var(--radius-unified);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            width: 100%;
        }

        /* Slider Styling */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: var(--bg-input);
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--text-primary);
            border: 2px solid var(--accent-primary);
            border-radius: 50%;
            cursor: pointer;
            margin-top: -5px; 
        }

        .btn-add-rule {
            background: transparent;
            border: 1px dashed var(--border-subtle);
            color: var(--text-muted);
            width: 100%;
            padding: 10px;
            border-radius: var(--radius-unified);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .btn-add-rule:hover {
            border-color: var(--text-muted);
            color: var(--text-primary);
            background: rgba(255,255,255,0.02);
        }

        /* --- Action Buttons --- */
        .action-area {
            margin-top: auto;
            display: flex;
            gap: 12px;
            padding-top: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-unified);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Primary: Neon Orange */
        .btn-primary {
            background: var(--accent-primary);
            color: #000;
        }
        .btn-primary:hover {
            background: var(--accent-primary-hover);
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.4);
        }

        /* Secondary: Outline */
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-highlight);
            color: var(--text-primary);
        }
        .btn-secondary:hover {
            background: var(--bg-surface);
            border-color: var(--text-secondary);
        }
        
        /* Header Button */
        .btn-link {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-family: var(--font-ui);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: var(--radius-unified);
        }
        .btn-link:hover {
            color: var(--text-primary);
            background: rgba(255,255,255,0.05);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-icon"></div>
            LUDUS
        </div>
        <div class="header-actions">
            <button class="btn-link">Export JSON</button>
        </div>
    </header>

    <main>
        <!-- TOP: The Canvas (60%) -->
        <section class="stage-container">
            <div class="board-overlay">
                <div class="overlay-title">
                    <div class="status-dot"></div>
                    LIVE PREVIEW
                </div>
                <div id="coords">X: 0, Y: 0</div>
                <div style="opacity: 0.6; font-size: 0.7rem; margin-top: 4px;">GRID: 8x8</div>
            </div>
            <div class="board-container" id="board-wrapper">
                <canvas id="gameBoard"></canvas>
            </div>
        </section>

        <!-- VALIDATION BAR -->
        <section class="validation-bar">
            <div class="status-badge">
                <div class="status-icon">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
                Configuration Valid
            </div>
            <div class="validation-message">
                Ready to generate. 0 errors found.
            </div>
        </section>

        <!-- BOTTOM: Controls Deck (40%) -->
        <section class="controls-deck">
            
            <!-- LEFT PANEL: Specs -->
            <aside class="panel">
                <div class="panel-header">
                    <span>Board Specs</span>
                </div>
                <div class="panel-content">
                    
                    <div class="control-group">
                        <label>Grid Dimensions</label>
                        <div class="grid-inputs">
                            <div class="input-wrapper">
                                <input type="number" id="rows" value="8" min="3" max="20">
                            </div>
                            <div class="input-wrapper">
                                <input type="number" id="cols" value="8" min="3" max="20">
                            </div>
                        </div>
                    </div>

                    <div class="control-group">
                        <label>Cell Geometry</label>
                        <div class="input-wrapper">
                            <select id="geometry">
                                <option value="square">Square (Classic)</option>
                                <option value="hex">Hexagon (Hive)</option>
                            </select>
                        </div>
                    </div>

                    <div class="divider" style="height: 1px; background: var(--border-subtle); margin: 4px 0;"></div>

                    <div class="panel-header" style="border:none; padding: 0 0 8px 0; background: transparent; position: static;">
                        <span>Generators</span>
                    </div>

                    <div class="toggle-item">
                        <span style="font-size: 0.9rem;">Terrain Noise</span>
                        <input type="checkbox" class="toggle-switch" checked>
                    </div>
                    <div class="toggle-item">
                        <span style="font-size: 0.9rem;">Resource Nodes</span>
                        <input type="checkbox" class="toggle-switch" checked>
                    </div>

                    <!-- Action Area -->
                    <div class="action-area">
                        <button class="btn btn-secondary" style="flex: 1;" id="generate-btn">
                            Generate Board
                        </button>
                        <button class="btn btn-primary" style="flex: 1.5;" id="start-game-btn">
                            Start Game
                        </button>
                    </div>

                </div>
            </aside>

            <!-- RIGHT PANEL: Rule Stack -->
            <aside class="panel">
                <div class="panel-header">
                    <span>Rule Stack</span>
                </div>
                <div class="panel-content" style="padding-top: 12px;">
                    
                    <!-- Rule Card 1 -->
                    <div class="rule-card">
                        <div class="rule-card-header">
                            <span class="rule-title">
                                Movement Cost
                                <span class="rule-tag">Global</span>
                            </span>
                            <input type="checkbox" class="toggle-switch" checked style="transform: scale(0.8);">
                        </div>
                        <div class="rule-body">
                            <input type="range" min="1" max="10" value="3">
                            <span class="value-display" style="width: 30px; text-align: right;">3</span>
                        </div>
                    </div>

                    <!-- Rule Card 2 -->
                    <div class="rule-card">
                        <div class="rule-card-header">
                            <span class="rule-title">
                                Victory Condition
                                <span class="rule-tag">Win State</span>
                            </span>
                            <input type="checkbox" class="toggle-switch" checked style="transform: scale(0.8);">
                        </div>
                        <div class="rule-body">
                            <select>
                                <option>Control 3 Capital Nodes</option>
                                <option>Eliminate All Rivals</option>
                                <option>Score 100 Points</option>
                            </select>
                        </div>
                    </div>

                    <button class="btn-add-rule">+ Add Rule</button>

                </div>
            </aside>
        </section>
    </main>

    <script>
        /**
         * LUDUS ENGINE
         * Visual overhaul: High saturation, crisp borders.
         */
        
        const canvas = document.getElementById('gameBoard');
        const ctx = canvas.getContext('2d');
        const boardWrapper = document.getElementById('board-wrapper');
        const rowsInput = document.getElementById('rows');
        const colsInput = document.getElementById('cols');
        const generateBtn = document.getElementById('generate-btn');
        const startGameBtn = document.getElementById('start-game-btn');
        const geometrySelect = document.getElementById('geometry');
        const coordsDisplay = document.getElementById('coords');

        // State
        let config = {
            rows: 8,
            cols: 8,
            cellSize: 60,
            geometry: 'square',
            seed: Date.now()
        };

        // Colors: High Saturation
        const PALETTE = {
            bg: '#1e1e1e',
            water: '#0ea5e9',
            grass: '#22c55e',
            grassDark: '#16a34a',
            mountain: '#f59e0b',
            snow: '#ffffff',
            stroke: 'rgba(0,0,0,0.1)',
            highlight: '#f97316'
        };

        function resizeCanvas() {
            const stage = document.querySelector('.stage-container');
            // Leave some margin
            const maxW = stage.clientWidth - 80; 
            const maxH = stage.clientHeight - 80;

            const sizeByCols = Math.floor(maxW / config.cols);
            const sizeByRows = Math.floor(maxH / config.rows);
            
            // Clamp size for aesthetics
            config.cellSize = Math.min(sizeByCols, sizeByRows, 80); 

            canvas.width = config.cols * config.cellSize;
            canvas.height = config.rows * config.cellSize;
        }

        function drawSquare(x, y, size, type, r, c) {
            const padding = 1;
            const isAlt = (r + c) % 2 === 0;
            
            // Base Colors
            let fillBase = isAlt ? PALETTE.grass : PALETTE.grassDark;
            
            if (type === 'water') fillBase = PALETTE.water;
            if (type === 'mountain') fillBase = PALETTE.mountain;

            // Draw Base
            ctx.fillStyle = fillBase;
            ctx.fillRect(x + padding, y + padding, size - padding*2, size - padding*2);
            
            // Detail
            if (type === 'mountain') {
                // Snow Cap
                ctx.fillStyle = PALETTE.snow;
                ctx.beginPath();
                ctx.moveTo(x + size/2, y + padding + 5);
                ctx.lineTo(x + size/2 - 10, y + size/2);
                ctx.lineTo(x + size/2 + 10, y + size/2);
                ctx.fill();
            } else if (type === 'water') {
                // Wave
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x + padding + 8, y + size/2);
                ctx.quadraticCurveTo(x + size/2, y + size/2 - 8, x + size - padding - 8, y + size/2);
                ctx.stroke();
            }

            // Crisp Border
            ctx.strokeStyle = PALETTE.stroke;
            ctx.lineWidth = 1;
            ctx.strokeRect(x + padding, y + padding, size - padding*2, size - padding*2);
        }

        function drawHex(cx, cy, size, type) {
            const r = size / 2 - 4;
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = 2 * Math.PI / 6 * i;
                const x = cx + r * Math.cos(angle);
                const y = cy + r * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fillStyle = PALETTE.grass;
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.stroke();
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const cs = config.cellSize;

            if (config.geometry === 'square') {
                for (let r = 0; r < config.rows; r++) {
                    for (let c = 0; c < config.cols; c++) {
                        const noiseVal = Math.sin(c * 0.5 + config.seed/1000) * Math.cos(r * 0.5 + config.seed/1000);
                        let type = 'grass';
                        if (noiseVal > 0.6) type = 'mountain';
                        else if (noiseVal < -0.6) type = 'water';
                        
                        drawSquare(c * cs, r * cs, cs, type, r, c);
                    }
                }
            } else if (config.geometry === 'hex') {
                const r = cs / 2 - 2;
                const h = Math.sqrt(3) * r;
                const v = 1.5 * r;
                
                for (let rIdx = 0; rIdx < config.rows; rIdx++) {
                    for (let cIdx = 0; cIdx < config.cols; cIdx++) {
                        const cx = cIdx * (1.5 * r) + (rIdx % 2) * (0.75 * r) + r;
                        const cy = rIdx * v + r;
                        drawHex(cx, cy, cs, 'plain');
                    }
                }
            }
        }

        function updateUI() {
            document.querySelector('.board-overlay div:last-child').textContent = `GRID: ${config.rows}x${config.cols}`;
        }

        function init() {
            resizeCanvas();
            drawBoard();
            updateUI();
        }

        // --- Interactivity ---

        rowsInput.addEventListener('input', (e) => {
            config.rows = parseInt(e.target.value);
            updateUI();
            resizeCanvas();
            drawBoard();
        });

        colsInput.addEventListener('input', (e) => {
            config.cols = parseInt(e.target.value);
            updateUI();
            resizeCanvas();
            drawBoard();
        });

        geometrySelect.addEventListener('change', (e) => {
            config.geometry = e.target.value;
            resizeCanvas();
            drawBoard();
        });

        generateBtn.addEventListener('click', () => {
            const btn = generateBtn;
            const originalText = btn.innerHTML;
            btn.innerHTML = `Generating...`;
            
            setTimeout(() => {
                config.seed = Date.now();
                drawBoard();
                btn.innerHTML = originalText;
                
                // Flash effect
                canvas.style.filter = 'brightness(1.3)';
                setTimeout(() => canvas.style.filter = 'none', 150);
            }, 400);
        });
        
        startGameBtn.addEventListener('click', () => {
             // Simple feedback for prototype
             const btn = startGameBtn;
             btn.innerHTML = "Starting...";
             setTimeout(() => btn.innerHTML = "Start Game", 1000);
        });

        // Canvas Hover
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const c = Math.floor(x / config.cellSize);
            const r = Math.floor(y / config.cellSize);
            
            if (c >= 0 && c < config.cols && r >= 0 && r < config.rows) {
                coordsDisplay.textContent = `X: ${c}, Y: ${r}`;
                
                // Redraw to clear previous hover
                drawBoard();
                
                // Draw Highlight
                ctx.strokeStyle = PALETTE.highlight;
                ctx.lineWidth = 3;
                ctx.strokeRect(c * config.cellSize + 2, r * config.cellSize + 2, config.cellSize - 4, config.cellSize - 4);
            }
        });

        canvas.addEventListener('mouseleave', () => {
            coordsDisplay.textContent = "X: -, Y: -";
            drawBoard();
        });

        window.addEventListener('resize', () => {
            resizeCanvas();
            drawBoard();
        });
        
        init();

    </script>
</body>
</html>
