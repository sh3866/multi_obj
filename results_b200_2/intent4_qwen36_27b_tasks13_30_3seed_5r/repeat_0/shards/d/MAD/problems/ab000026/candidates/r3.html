<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play with Tiles</title>
<style>
  :root {
    --felt-base: #245c43;
    --felt-dark: #1a4231;
    --wood-dark: #2b1d16;
    --wood-light: #5e4233;
    --gold-accent: #ffd700;
    --gold-dim: #b8931d;
    --text-primary: #ffffff;
    --text-secondary: #aab7b8;
    --tile-w: 60px;
    --tile-h: 120px;
    --bg-gradient: radial-gradient(circle at center, var(--felt-base) 0%, var(--felt-dark) 100%);
  }

  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  
  body, html {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--wood-dark);
    color: var(--text-primary);
  }

  /* --- Layout & Background --- */
  #game-container {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    background: var(--bg-gradient);
    /* Felt Texture via SVG Noise */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
    box-shadow: inset 0 0 150px rgba(0,0,0,0.7);
  }

  /* Wood Veneer Border */
  .frame-border {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    border: 24px solid var(--wood-dark);
    border-right-color: var(--wood-light);
    border-bottom-color: var(--wood-light);
    pointer-events: none;
    z-index: 100;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
  }

  /* --- Top Bar (HUD) --- */
  .top-bar {
    position: absolute; top: 30px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 40px; align-items: center;
    z-index: 50;
  }

  .score-pill {
    background: rgba(0, 0, 0, 0.5);
    padding: 10px 24px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; gap: 16px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.4);
    backdrop-filter: blur(8px);
    min-width: 140px;
  }

  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: #2c3e50;
    border: 2px solid var(--gold-dim);
    display: flex; justify-content: center; align-items: center;
    font-size: 1.2rem;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
  }
  .avatar.active { 
    border-color: var(--gold-accent); 
    box-shadow: 0 0 12px var(--gold-accent), inset 0 2px 4px rgba(0,0,0,0.5); 
  }
  
  .score-info { display: flex; flex-direction: column; justify-content: center; }
  .score-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-secondary); font-weight: 700; line-height: 1; margin-bottom: 4px;}
  
  /* Critique 5: Balance Score Hierarchy */
  .score-val { 
    font-size: 1.5rem; 
    font-weight: 800; 
    color: var(--text-primary); 
    font-variant-numeric: tabular-nums; 
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }

  /* --- Center Board (SVG) --- */
  #board-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: default;
  }

  svg#game-board {
    width: 100%; height: 100%;
    overflow: visible;
  }

  /* --- Player Area (Bottom) --- */
  .player-area {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 240px;
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 50;
    padding-bottom: 50px;
    pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 40%, transparent 100%);
  }

  /* --- Draw Pile (Critique 4) --- */
  .draw-pile-container {
    position: absolute; right: 60px; bottom: 50px;
    display: flex; flex-direction: column; align-items: center; gap: 0px;
    pointer-events: auto;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .draw-pile-container:hover { transform: translateY(-5px); }
  .draw-pile-container:active { transform: translateY(-2px) scale(0.98); }
  
  .draw-stack {
    position: relative; width: 60px; height: 110px;
    perspective: 600px;
    margin-bottom: 10px;
  }
  
  .tile-back {
    position: absolute; width: 100%; height: 100%;
    background: linear-gradient(135deg, #1a237e, #0d47a1);
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 
      inset 0 0 0 2px rgba(0,0,0,0.2),
      1px 1px 0 rgba(255,255,255,0.1),
      2px 2px 5px rgba(0,0,0,0.5);
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 4px);
  }
  
  /* Stacked look with slight rotation for realism */
  .tile-back:nth-child(1) { transform: translate(0,0) rotate(0deg); }
  .tile-back:nth-child(2) { transform: translate(1px, 2px) rotate(0.5deg); }
  .tile-back:nth-child(3) { transform: translate(2px, 4px) rotate(-0.5deg); }
  .tile-back:nth-child(4) { transform: translate(3px, 6px) rotate(0.5deg); z-index: 4; border-color: rgba(255,255,255,0.3);}

  /* Badge attached to stack */
  .draw-badge {
    background: #2c3e50;
    color: #fff;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.7rem;
    font-weight: 700;
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    position: absolute;
    bottom: -10px;
    z-index: 5;
    pointer-events: none;
  }

  /* Hand Rack */
  .hand-rack {
    display: flex; gap: 10px;
    padding: 20px;
    pointer-events: auto;
  }

  /* Critique 1: Unify Tile Materiality */
  .tile {
    width: var(--tile-w); height: var(--tile-h);
    /* Premium Ceramic Look */
    background: linear-gradient(135deg, #fdfbf7 0%, #f4f4f0 50%, #e8e8e3 100%);
    border-radius: 8px;
    position: relative;
    border: 1px solid #d0d0c8;
    /* Complex Shadow for depth */
    box-shadow: 
      inset 2px 2px 0 rgba(255,255,255,0.9), /* Top-Left Highlight */
      inset -2px -2px 0 rgba(0,0,0,0.1), /* Bottom-Right Shadow */
      2px 4px 8px rgba(0,0,0,0.4), /* Drop Shadow */
      0 1px 2px rgba(0,0,0,0.3);
    transform-origin: bottom center;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor: pointer;
    display: flex; flex-direction: column;
    /* Default fanned rotation set by JS */
  }

  /* Critique 2: Elevated Hand Interaction */
  .tile:hover {
    transform: rotate(0deg) translateY(-15px) scale(1.02) !important;
    box-shadow: 
      inset 2px 2px 0 rgba(255,255,255,1),
      5px 15px 20px rgba(0,0,0,0.6);
    z-index: 20;
    border-color: #fff;
  }

  .tile.selected {
    transform: rotate(0deg) translateY(-30px) scale(1.1) !important;
    box-shadow: 
      0 0 0 2px var(--gold-accent),
      0 20px 40px rgba(0,0,0,0.7);
    z-index: 30;
    border: 1px solid var(--gold-accent);
  }

  .tile.disabled {
    /* Desaturation filter for blocked tiles */
    filter: grayscale(80%) brightness(0.9);
    opacity: 0.6;
    cursor: default;
  }
  .tile.disabled:hover { transform: rotate(var(--rotation)) translateY(0) !important; box-shadow: 2px 4px 8px rgba(0,0,0,0.4); }

  .tile-half {
    flex: 1; width: 100%;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    padding: 8px;
    position: relative;
  }
  
  /* Subtle inner shadow for the recessed area */
  .tile-half::after {
    content: ''; position: absolute; inset: 0;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
    pointer-events: none;
  }

  .tile-divider {
    height: 2px; background: #d0d0c8; width: 80%; margin: 0 auto;
    box-shadow: 0 1px 0 rgba(255,255,255,0.8), 0 -1px 0 rgba(0,0,0,0.1);
  }

  .pip {
    background: radial-gradient(circle at 30% 30%, #444, #111);
    border-radius: 50%;
    width: 9px; height: 9px;
    margin: auto;
    box-shadow: 0 1px 1px rgba(0,0,0,0.6);
  }

  /* --- Endpoint Indicators (Critique 3) --- */
  .endpoint-group {
    cursor: pointer;
    transition: all 0.3s;
  }
  .endpoint-bg {
    fill: rgba(255, 215, 0, 0.1);
    stroke: var(--gold-accent);
    stroke-width: 3; /* Thicker stroke */
    stroke-dasharray: 8 6; /* Bolder dashes */
    filter: drop-shadow(0 0 6px var(--gold-accent));
    transition: all 0.3s;
  }
  .endpoint-text {
    fill: #fff;
    font-family: sans-serif;
    font-weight: 800;
    font-size: 24px; /* Larger text */
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
    text-shadow: 0 2px 4px rgba(0,0,0,0.9);
  }
  .endpoint-group:hover .endpoint-bg {
    fill: rgba(255, 215, 0, 0.4);
    stroke-width: 4;
    r: 32; /* Expand radius */
  }

  /* --- Toast --- */
  #toast {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
    background: rgba(20, 20, 20, 0.95);
    color: var(--gold-accent); padding: 16px 32px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    pointer-events: none; opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1);
    z-index: 200; text-align: center; font-weight: 700; letter-spacing: 0.5px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    text-transform: uppercase; font-size: 0.9rem;
  }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

</style>
</head>
<body>

<div id="game-container">
  <div class="frame-border"></div>

  <!-- Top HUD (Scoreboard) -->
  <div class="top-bar">
    <div class="score-pill">
      <div class="avatar">🤖</div>
      <div class="score-info">
        <div class="score-label">CPU</div>
        <div class="score-val" id="cpu-score">42</div>
      </div>
    </div>
    <div class="score-pill">
      <div class="avatar active">👤</div>
      <div class="score-info">
        <div class="score-label">YOU</div>
        <div class="score-val" id="player-score">12</div>
      </div>
    </div>
  </div>

  <!-- Main Board -->
  <div id="board-area">
    <svg id="game-board" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- Drop Shadow for Board Tiles -->
        <filter id="tileShadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="2" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
        </filter>
        
        <!-- Tile Graphic Component (Ivory/Bone Look) -->
        <g id="tile-visual">
          <!-- Base -->
          <rect x="0" y="0" width="50" height="100" rx="6" fill="#f4f4f0" filter="url(#tileShadow)"/>
          <!-- Bevel Highlight -->
          <rect x="2" y="2" width="46" height="96" rx="4" fill="none" stroke="white" stroke-opacity="0.7" stroke-width="1"/>
          <!-- Divider -->
          <line x1="5" y1="50" x2="45" y2="50" stroke="#d0d0c8" stroke-width="1"/>
          <!-- Edge -->
          <rect x="0" y="0" width="50" height="100" rx="6" fill="none" stroke="#d0d0c8" stroke-width="1"/>
        </g>

        <!-- Pip Patterns -->
        <g id="pips-1"><circle cx="25" cy="25" r="5.5" fill="#212121"/></g>
        <g id="pips-2">
          <circle cx="18" cy="18" r="5.5" fill="#212121"/>
          <circle cx="32" cy="32" r="5.5" fill="#212121"/>
        </g>
        <g id="pips-3">
          <circle cx="18" cy="18" r="5.5" fill="#212121"/>
          <circle cx="25" cy="25" r="5.5" fill="#212121"/>
          <circle cx="32" cy="32" r="5.5" fill="#212121"/>
        </g>
        <g id="pips-4">
          <circle cx="18" cy="18" r="5.5" fill="#212121"/>
          <circle cx="32" cy="18" r="5.5" fill="#212121"/>
          <circle cx="18" cy="32" r="5.5" fill="#212121"/>
          <circle cx="32" cy="32" r="5.5" fill="#212121"/>
        </g>
        <g id="pips-5">
          <circle cx="18" cy="18" r="5.5" fill="#212121"/>
          <circle cx="32" cy="18" r="5.5" fill="#212121"/>
          <circle cx="25" cy="25" r="5.5" fill="#212121"/>
          <circle cx="18" cy="32" r="5.5" fill="#212121"/>
          <circle cx="32" cy="32" r="5.5" fill="#212121"/>
        </g>
        <g id="pips-6">
          <circle cx="18" cy="15" r="5.5" fill="#212121"/>
          <circle cx="32" cy="15" r="5.5" fill="#212121"/>
          <circle cx="18" cy="25" r="5.5" fill="#212121"/>
          <circle cx="32" cy="25" r="5.5" fill="#212121"/>
          <circle cx="18" cy="35" r="5.5" fill="#212121"/>
          <circle cx="32" cy="35" r="5.5" fill="#212121"/>
        </g>
      </defs>

      <!-- The Chain Layer -->
      <g id="chain-layer" transform="translate(0,0)">
        <!-- Injected via JS -->
      </g>

      <!-- Endpoints Layer -->
      <g id="endpoints-layer">
        <!-- Left Endpoint -->
        <g id="end-left" class="endpoint-group" style="display:none;" transform="translate(0,0)">
          <circle class="endpoint-bg" cx="0" cy="50" r="30" />
          <text class="endpoint-text" x="0" y="54">?</text>
        </g>
        <!-- Right Endpoint -->
        <g id="end-right" class="endpoint-group" style="display:none;" transform="translate(0,0)">
          <circle class="endpoint-bg" cx="0" cy="50" r="30" />
          <text class="endpoint-text" x="0" y="54">?</text>
        </g>
      </g>
    </svg>
  </div>

  <!-- Player Area -->
  <div class="player-area">
    
    <!-- Draw Pile -->
    <div class="draw-pile-container" onclick="drawTile()">
      <div class="draw-stack">
        <div class="tile-back"></div>
        <div class="tile-back"></div>
        <div class="tile-back"></div>
        <div class="tile-back"></div>
      </div>
      <div class="draw-badge" id="boneyard-count">12 Left</div>
    </div>

    <!-- Hand -->
    <div class="hand-rack" id="player-hand">
      <!-- Injected via JS -->
    </div>
  </div>

  <div id="toast">Turn Skipped</div>
</div>

<script>
/**
 * Game Configuration & State
 */
const TILE_W = 50;
const TILE_H = 100;
const GAP = 6; // Tightened gap for Critique 6

// State
let boardChain = []; // {a, b, rotation, x, y}
let playerHand = [];
let boneyard = [];
let leftEndVal = null;
let rightEndVal = null;
let selectedTileIdx = -1;

// SVG Helper
const SVG_NS = "http://www.w3.org/2000/svg";

function initGame() {
  // 1. Generate Boneyard
  for(let i=0; i<=6; i++) {
    for(let j=i; j<=6; j++) {
      boneyard.push({a: i, b: j});
    }
  }
  boneyard.sort(() => Math.random() - 0.5);

  // 2. Deal Hand
  for(let i=0; i<7; i++) playerHand.push(boneyard.pop());

  // 3. Build Hero Chain (Visual Demo)
  boardChain.push({ a: 6, b: 6, rotation: 0 });
  leftEndVal = 6;
  rightEndVal = 6;

  const heroChain = [
    {a:6, b:2}, {a:2, b:5}, {a:5, b:1}, {a:1, b:4}, {a:4, b:3}, {a:3, b:3}
  ];
  
  heroChain.forEach(t => {
    boardChain.push({ a: t.a, b: t.b, rotation: 90 }); 
    rightEndVal = t.b;
  });

  renderBoard();
  renderHand();
  updateUI();
}

// --- Rendering: Board ---

function renderBoard() {
  const container = document.getElementById('chain-layer');
  container.innerHTML = '';

  // Calculate Layout
  let xCursor = 0;
  let layout = [];
  
  boardChain.forEach((tile, index) => {
    const w = (tile.rotation === 0) ? TILE_W : TILE_H;
    layout.push({ ...tile, w, h: (tile.rotation === 0) ? TILE_H : TILE_W, x: xCursor });
    xCursor += w + GAP;
  });

  // Center the group
  const totalWidth = xCursor;
  const startX = (1000 - totalWidth) / 2;
  const startY = (600 - TILE_H) / 2; 

  layout.forEach((t, i) => {
    const g = document.createElementNS(SVG_NS, "g");
    // Critique 6: Ensure vertical alignment is perfect
    g.setAttribute("transform", `translate(${startX + t.x}, ${startY}) rotate(${t.rotation})`);
    
    // Base Shape
    const shape = document.createElementNS(SVG_NS, "use");
    shape.setAttribute("href", "#tile-visual");
    g.appendChild(shape);

    // Pips Top (A)
    if(t.a > 0) {
      const pipsA = document.createElementNS(SVG_NS, "use");
      pipsA.setAttribute("href", `#pips-${t.a}`);
      g.appendChild(pipsA);
    }

    // Pips Bottom (B)
    if(t.b > 0) {
      const pipsB = document.createElementNS(SVG_NS, "use");
      pipsB.setAttribute("href", `#pips-${t.b}`);
      pipsB.setAttribute("transform", `translate(0, 50)`); 
      g.appendChild(pipsB);
    }

    container.appendChild(g);
  });

  // Update Endpoints
  updateEndpoints(startX, startY, layout);
}

function updateEndpoints(startX, startY, layout) {
  const endLeft = document.getElementById('end-left');
  const endRight = document.getElementById('end-right');

  // Left Endpoint Position
  const first = layout[0];
  const leftX = startX - GAP - 25; 
  endLeft.setAttribute("transform", `translate(${leftX}, ${startY + 50})`);
  // Critique 3: Text Label indicating match value
  endLeft.querySelector('text').textContent = `Match ${leftEndVal}`;
  endLeft.style.display = 'block';

  // Right Endpoint Position
  const last = layout[layout.length-1];
  const rightX = startX + layout.reduce((acc, t) => acc + t.w + GAP, -GAP) + 25;
  endRight.setAttribute("transform", `translate(${rightX}, ${startY + 50})`);
  // Critique 3: Text Label indicating match value
  endRight.querySelector('text').textContent = `Match ${rightEndVal}`;
  endRight.style.display = 'block';

  // Bind Events
  endLeft.onclick = () => playTileToSide('left');
  endRight.onclick = () => playTileToSide('right');
}

// --- Rendering: Hand ---

function renderHand() {
  const rack = document.getElementById('player-hand');
  rack.innerHTML = '';
  
  const totalTiles = playerHand.length;
  const totalAngle = 30; // Total fan spread
  const startAngle = -totalAngle / 2;
  const stepAngle = totalTiles > 1 ? totalAngle / (totalTiles - 1) : 0;

  playerHand.forEach((tile, idx) => {
    const el = document.createElement('div');
    el.className = 'tile';
    
    // Check validity
    const valid = (tile.a === leftEndVal || tile.b === leftEndVal || 
                  tile.a === rightEndVal || tile.b === rightEndVal);
    
    if (!valid) el.classList.add('disabled');
    if (idx === selectedTileIdx) el.classList.add('selected');

    // Apply fanned rotation using CSS variable
    const rotation = startAngle + (stepAngle * idx);
    el.style.setProperty('--rotation', `${rotation}deg`);
    el.style.transform = `rotate(${rotation}deg)`;

    el.innerHTML = `
      <div class="tile-half">${getPipsHTML(tile.a)}</div>
      <div class="tile-divider"></div>
      <div class="tile-half">${getPipsHTML(tile.b)}</div>
    `;
    
    el.onclick = () => selectTile(idx);
    rack.appendChild(el);
  });
}

function getPipsHTML(n) {
  if(n===0) return '';
  let html = '';
  const positions = {
    1: [[2,2]],
    2: [[1,1], [3,3]],
    3: [[1,1], [2,2], [3,3]],
    4: [[1,1], [3,1], [1,3], [3,3]],
    5: [[1,1], [3,1], [2,2], [1,3], [3,3]],
    6: [[1,1], [3,1], [1,2], [3,2], [1,3], [3,3]]
  };
  
  positions[n].forEach(([r,c]) => {
    html += `<div style="grid-area: ${r} / ${c}"><div class="pip"></div></div>`;
  });
  return html;
}

// --- Logic ---

function selectTile(idx) {
  if(selectedTileIdx === idx) {
    selectedTileIdx = -1;
  } else {
    const tile = playerHand[idx];
    if (tile.a !== leftEndVal && tile.b !== leftEndVal && 
        tile.a !== rightEndVal && tile.b !== rightEndVal) {
      showToast("No matches");
      return;
    }
    selectedTileIdx = idx;
  }
  renderHand();
}

function playTileToSide(side) {
  if (selectedTileIdx === -1) {
    showToast("Select a tile first");
    return;
  }

  const tile = playerHand[selectedTileIdx];
  let played = false;

  if (side === 'left') {
    if (tile.a === leftEndVal) {
      boardChain.unshift({ a: tile.b, b: tile.a, rotation: 90 });
      leftEndVal = tile.b;
      played = true;
    } else if (tile.b === leftEndVal) {
      boardChain.unshift({ a: tile.a, b: tile.b, rotation: 90 });
      leftEndVal = tile.a;
      played = true;
    }
  } else if (side === 'right') {
    if (tile.a === rightEndVal) {
      boardChain.push({ a: tile.a, b: tile.b, rotation: 90 });
      rightEndVal = tile.b;
      played = true;
    } else if (tile.b === rightEndVal) {
      boardChain.push({ a: tile.b, b: tile.a, rotation: 90 });
      rightEndVal = tile.a;
      played = true;
    }
  }

  if (played) {
    playerHand.splice(selectedTileIdx, 1);
    selectedTileIdx = -1;
    renderHand();
    renderBoard();
    updateUI();
    if(playerHand.length > 0) setTimeout(cpuMove, 1000);
  } else {
    showToast("Invalid placement");
  }
}

function cpuMove() {
  const matchIdx = boneyard.findIndex(t => t.a === leftEndVal || t.b === leftEndVal || t.a === rightEndVal || t.b === rightEndVal);
  
  if(matchIdx !== -1) {
    const t = boneyard[matchIdx];
    if(t.a === rightEndVal) {
        boardChain.push({a:t.a, b:t.b, rotation:90});
        rightEndVal = t.b;
    } else {
        boardChain.push({a:t.b, b:t.a, rotation:90});
        rightEndVal = t.a;
    }
    boneyard.splice(matchIdx, 1);
    showToast("CPU played a tile");
    renderBoard();
    updateUI();
  } else {
    if(boneyard.length > 0) {
        boneyard.pop(); 
        showToast("CPU drew a tile");
        updateUI();
    } else {
        showToast("CPU passed");
    }
  }
}

function drawTile() {
  if (boneyard.length > 0) {
    const t = boneyard.pop();
    playerHand.push(t);
    renderHand();
    updateUI();
  } else {
    showToast("Boneyard Empty");
  }
}

function updateUI() {
  document.getElementById('boneyard-count').textContent = boneyard.length + " Left";
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

// Start
initGame();

</script>
