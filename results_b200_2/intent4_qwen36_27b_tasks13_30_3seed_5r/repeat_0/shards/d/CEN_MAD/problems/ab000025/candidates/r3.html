<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Close-Up: Organic Grip</title>
    <style>
        :root {
            --bg-color: #080808;
            --text-primary: #f0f0f0;
            --font-ui: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Grain Texture for Editorial Feel */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.08;
            pointer-events: none;
            z-index: 20;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Main Stage */
        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: crosshair;
        }

        /* SVG Container - Tight Crop */
        svg#illustration {
            width: 100%;
            height: 100%;
            max-width: 100vh;
            max-height: 100vh;
            object-fit: contain;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            /* Ensure SVG scales nicely on mobile */
            svg#illustration {
                max-width: 150vh;
                max-height: 150vh;
            }
        }
    </style>
</head>
<body>

    <div class="noise-overlay"></div>

    <div class="stage">
        <!-- 
            RECONSTRUCTED SVG:
            - ViewBox cropped significantly (600x800) to zoom in.
            - Continuous paths for fingers to simulate wrapping.
            - Screen glow illuminating the thumb.
            - Detailed knuckles and nails.
        -->
        <svg id="illustration" viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- ==================== GRADIENTS ==================== -->

                <!-- Skin: Natural Lighting (Top-Left Source) -->
                <linearGradient id="skinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f5d0b8" /> <!-- Highlight -->
                    <stop offset="40%" stop-color="#d8a48b" /> <!-- Midtone -->
                    <stop offset="80%" stop-color="#a87660" /> <!-- Shadow -->
                    <stop offset="100%" stop-color="#6e4836" /> <!-- Core Shadow -->
                </linearGradient>

                <!-- Skin: Screen Illumination (Blue/Cyan Cast) -->
                <linearGradient id="skinGlow" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="rgba(100, 200, 255, 0.3)" />
                    <stop offset="100%" stop-color="rgba(100, 200, 255, 0)" />
                </linearGradient>

                <!-- Device: Metal Chassis -->
                <linearGradient id="metalChassis" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#3a3a3e" />
                    <stop offset="20%" stop-color="#1c1c1e" />
                    <stop offset="80%" stop-color="#000000" />
                    <stop offset="100%" stop-color="#1a1a1c" /> <!-- Rim light right -->
                </linearGradient>

                <!-- Screen: Deep Glass -->
                <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#15171c" />
                    <stop offset="50%" stop-color="#050608" />
                    <stop offset="100%" stop-color="#000000" />
                </linearGradient>

                <!-- Glare/Reflection -->
                <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0.12)" />
                    <stop offset="40%" stop-color="rgba(255,255,255,0.0)" />
                    <stop offset="100%" stop-color="rgba(255,255,255,0.0)" />
                </linearGradient>

                <!-- ==================== FILTERS ==================== -->
                <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" />
                </filter>
                <filter id="blurShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="6" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.6"/>
                    </feComponentTransfer>
                </filter>
                <filter id="blurDepth" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="40" />
                </filter>
            </defs>

            <!-- Background: Deep Shadow with subtle vignette -->
            <rect width="100%" height="100%" fill="var(--bg-color)" />
            <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
                <stop offset="60%" stop-color="#000" stop-opacity="0" />
                <stop offset="100%" stop-color="#000" stop-opacity="0.8" />
            </radialGradient>
            <rect width="100%" height="100%" fill="url(#vignette)" pointer-events="none" />

            <!-- Main Composition Group -->
            <g id="scene" transform="translate(300, 400)">
                
                <!-- ==================== LAYER 1: HAND BASE (PALM/WRIST) ==================== -->
                <g id="hand-base">
                    <!-- The bulk of the hand behind the phone -->
                    <path d="M -250,400 C -250,150 -180,-50 -40,-80 C 120,-110 250,50 250,400 Z" fill="url(#skinGradient)" opacity="0.8" filter="url(#blurSoft)" />
                    <!-- Deep shadow area where hand meets phone back -->
                    <path d="M -150,-80 C 0,-100 150,-80 200,200 L -200,200 Z" fill="#3d2317" opacity="0.5" filter="url(#blurSoft)"/>
                </g>

                <!-- ==================== LAYER 2: THE DEVICE ==================== -->
                <g id="device" transform="translate(0, 0)">
                    <!-- Chassis Body -->
                    <rect x="-130" y="-320" width="260" height="640" rx="35" fill="url(#metalChassis)" />
                    
                    <!-- Screen Inner (Bezel) -->
                    <rect x="-118" y="-308" width="236" height="616" rx="28" fill="url(#screenGradient)" />
                    
                    <!-- Screen Glow (Ambient Light Source) -->
                    <rect x="-118" y="-308" width="236" height="616" rx="28" fill="rgba(100, 200, 255, 0.05)" />

                    <!-- Hardware Details -->
                    <g id="hardware">
                        <!-- Dynamic Island / Notch -->
                        <rect x="-40" y="-285" width="80" height="24" rx="12" fill="#000" />
                        <!-- Camera Lens -->
                        <circle cx="-20" cy="-273" r="5" fill="#1a1a1a" />
                        <circle cx="-20" cy="-273" r="2" fill="#333" />
                        <!-- Speaker -->
                        <rect x="25" y="-276" width="20" height="3" rx="1.5" fill="#050505" />
                        
                        <!-- Side Buttons (Volume/Power) -->
                        <rect x="-134" y="-120" width="6" height="40" rx="2" fill="#2a2a2e" /> <!-- Vol Up -->
                        <rect x="-134" y="-60" width="6" height="40" rx="2" fill="#2a2a2e" /> <!-- Vol Down -->
                        <rect x="130" y="-80" width="6" height="60" rx="2" fill="#2a2a2e" /> <!-- Power -->
                    </g>

                    <!-- Abstract UI Content (Faint) -->
                    <g opacity="0.3">
                        <rect x="-80" y="-240" width="160" height="120" rx="12" fill="rgba(255,255,255,0.05)" />
                        <circle cx="-60" cy="-180" r="10" fill="rgba(255,255,255,0.1)" />
                        <rect x="-40" y="-185" width="80" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
                        <rect x="-80" y="-100" width="160" height="6" rx="3" fill="rgba(255,255,255,0.08)" />
                        <rect x="-80" y="-80" width="120" height="6" rx="3" fill="rgba(255,255,255,0.08)" />
                    </g>

                    <!-- Glass Glare Overlay -->
                    <path d="M -118,-308 L 118,-308 L 118,100 L -118,300 Z" fill="url(#glassReflection)" style="mix-blend-mode: screen;" />
                    
                    <!-- Device Rim Light (Top/Left Edge) -->
                    <rect x="-130" y="-320" width="260" height="640" rx="35" fill="none" stroke="url(#skinGradient)" stroke-width="1" opacity="0.3" />
                </g>

                <!-- ==================== LAYER 3: CAST SHADOWS ==================== -->
                <!-- Shadows projected from fingers onto the screen -->
                <g id="shadows" filter="url(#blurShadow)">
                    <!-- Thumb Shadow on Screen -->
                    <path d="M -80,50 Q -20,120 40,20" stroke="#000" stroke-width="30" fill="none" opacity="0.6" />
                    <!-- Fingers Shadow on Right Edge -->
                    <path d="M 118,-150 L 118,200" stroke="#000" stroke-width="15" fill="none" opacity="0.5" />
                </g>

                <!-- ==================== LAYER 4: HAND FRONT (FINGERS & THUMB) ==================== -->
                
                <!-- Fingers (Wrapping right edge - Continuous Flow) -->
                <g id="fingers">
                    <!-- Index Finger -->
                    <g transform="translate(130, -160)">
                        <!-- Organic Finger Shape -->
                        <path d="M 0,0 C 25,10 45,40 35,60 C 20,75 0,70 0,0 Z" fill="url(#skinGradient)" />
                        <!-- Knuckle Crease -->
                        <path d="M -5,25 Q 15,30 5,45" stroke="#7a4430" stroke-width="1.5" fill="none" opacity="0.5" />
                        <!-- Nail (Side View) -->
                        <path d="M 30,45 C 35,45 38,55 32,60 C 28,60 28,50 30,45 Z" fill="#eacbc0" opacity="0.9" />
                    </g>

                    <!-- Middle Finger -->
                    <g transform="translate(130, -60)">
                        <path d="M 0,0 C 30,15 50,70 35,90 C 15,105 0,95 0,0 Z" fill="url(#skinGradient)" />
                        <path d="M -5,35 Q 20,40 10,55" stroke="#7a4430" stroke-width="1.5" fill="none" opacity="0.5" />
                        <!-- Nail -->
                        <path d="M 32,55 C 38,55 40,65 35,70 C 30,70 30,60 32,55 Z" fill="#eacbc0" opacity="0.9" />
                    </g>

                    <!-- Ring Finger -->
                    <g transform="translate(130, 40)">
                        <path d="M 0,0 C 25,15 40,75 25,95 C 5,110 0,100 0,0 Z" fill="url(#skinGradient)" />
                        <path d="M -5,35 Q 15,40 5,55" stroke="#7a4430" stroke-width="1.5" fill="none" opacity="0.5" />
                        <!-- Nail -->
                        <path d="M 25,60 C 30,60 32,70 28,75 C 24,75 24,65 25,60 Z" fill="#eacbc0" opacity="0.9" />
                    </g>

                    <!-- Pinky Finger -->
                    <g transform="translate(130, 140)">
                        <path d="M 0,0 C 20,15 30,60 15,80 C 0,95 0,85 0,0 Z" fill="url(#skinGradient)" />
                        <!-- Nail -->
                        <path d="M 15,55 C 20,55 22,65 18,70 C 14,70 14,60 15,55 Z" fill="#eacbc0" opacity="0.9" />
                    </g>
                </g>

                <!-- Thumb (The Active Grip - Overlapping Screen) -->
                <g id="thumb">
                    <!-- Thumb Base connecting to palm -->
                    <path d="M -120,300 C -120,200 -80,150 -50,100" stroke="url(#skinGradient)" stroke-width="45" fill="none" stroke-linecap="round" />
                    
                    <!-- Thumb Shaft -->
                    <path d="M -70,100 C -80,70 -40,30 -20,0 C 0,-30 20,-20 20,10 C 20,40 -40,90 -70,100 Z" fill="url(#skinGradient)" />
                    
                    <!-- Joint Definition (MCP Joint) -->
                    <circle cx="-35" cy="30" r="20" fill="url(#skinGradient)" />
                    <path d="M -45,25 Q -35,35 -25,28" stroke="#7a4430" stroke-width="1.5" fill="none" opacity="0.6" />

                    <!-- Thumbnail (Facing Camera) -->
                    <g transform="rotate(-15, -10, -10)">
                        <!-- Nail Bed -->
                        <path d="M -10,-25 C 0,-35 15,-25 15,-5 C 15,15 -10,5 -10,-25 Z" fill="#f5e6de" />
                        <!-- Cuticle -->
                        <path d="M -10,-25 C 0,-30 15,-25 15,-20" stroke="#dcbba8" stroke-width="1" fill="none" />
                        <!-- Specular Highlight -->
                        <ellipse cx="-2" cy="-10" rx="3" ry="8" fill="#fff" opacity="0.7" filter="url(#blurSoft)" />
                        
                        <!-- Screen Glow on Thumb -->
                        <path d="M -10,-25 C 0,-35 15,-25 15,-5 C 15,15 -10,5 -10,-25 Z" fill="url(#skinGlow)" style="mix-blend-mode: screen;" />
                    </g>
                </g>

            </g>

            <!-- Foreground Depth Blur (Bokeh simulation) -->
            <circle cx="0" cy="700" r="150" fill="#000" filter="url(#blurDepth)" opacity="0.8" />
            <circle cx="600" cy="50" r="180" fill="#000" filter="url(#blurDepth)" opacity="0.7" />
        </svg>
    </div>

    <script>
        // Subtle Parallax Interaction
        const stage = document.querySelector('.stage');
        const scene = document.querySelector('#scene');

        stage.addEventListener('mousemove', (e) => {
            const rect = stage.getBoundingClientRect();
            // Normalize mouse position from -1 to 1
            const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            const y = ((e.clientY - rect.top) / rect.height) * 2 - 1;

            // Calculate rotation/translation values
            const translateX = x * 15;
            const translateY = y * 15;
            const rotate = x * 3;

            scene.style.transition = 'transform 0.1s ease-out';
            scene.style.transform = `translate(${translateX}px, ${translateY}px) rotate(${rotate}deg)`;
        });

        stage.addEventListener('mouseleave', () => {
            scene.style.transition = 'transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1)';
            scene.style.transform = `translate(0px, 0px) rotate(0deg)`; 
        });
    </script>
</body>
</html>
