<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Close-Up: Active Grip</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-primary: #e0e0e0;
            --text-muted: #555555;
            --font-display: 'Didot', 'Bodoni Moda', 'Times New Roman', serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Grain Texture for Editorial Feel */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.12;
            pointer-events: none;
            z-index: 20;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Main Stage */
        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SVG Container - Tight Crop */
        svg#illustration {
            width: 100%;
            height: 100%;
            max-width: 120vh; /* Portrait orientation preference */
            max-height: 120vh;
            object-fit: contain;
        }

        /* Metadata Overlay: Editorial Footer */
        .metadata-overlay {
            position: absolute;
            bottom: 3rem;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 15;
            pointer-events: none;
        }

        .meta-container {
            display: flex;
            align-items: flex-end;
            gap: 2rem;
        }

        .meta-col {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            text-align: left;
        }

        .meta-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            font-weight: 500;
        }

        .meta-value {
            font-family: var(--font-display);
            font-size: 1.1rem;
            color: var(--text-primary);
            font-weight: 400;
            letter-spacing: -0.02em;
        }

        /* Vertical Dividers aligned to text center */
        .meta-divider {
            width: 1px;
            height: 24px; /* Height of text block approx */
            background: rgba(255,255,255,0.15);
            margin-bottom: 0.1rem;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .metadata-overlay {
                bottom: 1.5rem;
            }
            .meta-container {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            .meta-divider {
                width: 30px;
                height: 1px;
                margin-bottom: 0;
            }
        }
    </style>
</head>
<body>

    <div class="noise-overlay"></div>

    <div class="stage">
        <!-- 
            RECONSTRUCTED SVG:
            - Tighter viewBox for "Close-up" feel.
            - Complex bezier paths for anatomy (knuckles, phalanges).
            - Unified lighting (Top-Left source).
            - Cast shadows and specular highlights.
        -->
        <svg id="illustration" viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- ==================== GRADIENTS ==================== -->

                <!-- Skin: Subsurface Scattering Simulation -->
                <linearGradient id="skinHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffdbca" /> <!-- Brightest highlight -->
                    <stop offset="30%" stop-color="#e8b5a0" /> <!-- Midtone -->
                    <stop offset="80%" stop-color="#b0755a" /> <!-- Deep shadow -->
                    <stop offset="100%" stop-color="#6e3b25" /> <!-- Core shadow -->
                </linearGradient>

                <linearGradient id="skinCrease" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#8a4a35" />
                    <stop offset="100%" stop-color="#4a2010" />
                </linearGradient>

                <!-- Device: Ceramic/Metal -->
                <linearGradient id="deviceChassis" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#2a2a2e" />
                    <stop offset="40%" stop-color="#111113" />
                    <stop offset="100%" stop-color="#000000" />
                </linearGradient>

                <!-- Device: Rim Light (Crucial for separation) -->
                <linearGradient id="rimHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0)" />
                    <stop offset="40%" stop-color="rgba(255,255,255,0.8)" /> <!-- Sharp specular -->
                    <stop offset="60%" stop-color="rgba(255,255,255,0.2)" />
                    <stop offset="100%" stop-color="rgba(255,255,255,0)" />
                </linearGradient>

                <!-- Screen: Deep Glass -->
                <linearGradient id="screenSurface" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#16181d" />
                    <stop offset="50%" stop-color="#0a0b0e" />
                    <stop offset="100%" stop-color="#000000" />
                </linearGradient>

                <!-- Screen Reflection (UI/Glare) -->
                <linearGradient id="glassGlare" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
                    <stop offset="30%" stop-color="rgba(255,255,255,0.02)" />
                    <stop offset="100%" stop-color="rgba(255,255,255,0.0)" />
                </linearGradient>

                <!-- ==================== FILTERS ==================== -->
                <filter id="blurSoft">
                    <feGaussianBlur stdDeviation="4" />
                </filter>
                <filter id="blurContact">
                    <feGaussianBlur stdDeviation="2" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.7"/>
                    </feComponentTransfer>
                </filter>
                <filter id="blurDepth">
                    <feGaussianBlur stdDeviation="25" />
                </filter>
            </defs>

            <!-- Background: Subtle Vignette -->
            <rect width="100%" height="100%" fill="#050505" />
            <circle cx="300" cy="450" r="400" fill="url(#rimHighlight)" opacity="0.1" filter="url(#blurDepth)" />

            <!-- Main Composition Group (Centered) -->
            <g id="scene" transform="translate(300, 450) rotate(-12)">
                
                <!-- ==================== LAYER 1: HAND BACK (PALM & WRIST) ==================== -->
                <g id="hand-back">
                    <!-- Wrist -->
                    <path d="M -180,600 C -200,350 -150,200 -20,150 C 60,200 100,350 80,600 Z" fill="url(#skinCrease)" />
                    <!-- Palm Base -->
                    <path d="M -160,550 C -180,300 -120,180 0,160 C 100,180 140,300 120,550 Z" fill="url(#skinHighlight)" opacity="0.8" />
                </g>

                <!-- ==================== LAYER 2: THE DEVICE ==================== -->
                <g id="device">
                    <!-- Chassis Body -->
                    <rect x="-120" y="-280" width="240" height="560" rx="30" fill="url(#deviceChassis)" />
                    
                    <!-- Screen Inner -->
                    <rect x="-110" y="-270" width="220" height="540" rx="24" fill="url(#screenSurface)" />
                    
                    <!-- Hardware Details -->
                    <g id="hardware">
                        <!-- Speaker -->
                        <rect x="-10" y="-255" width="20" height="3" rx="1.5" fill="#050505" />
                        <!-- Camera/Sensor -->
                        <circle cx="5" cy="-255" r="2.5" fill="#050505" />
                        <!-- Side Buttons -->
                        <rect x="120" y="-100" width="4" height="30" rx="1" fill="#1a1a1a" />
                        <rect x="120" y="-50" width="4" height="30" rx="1" fill="#1a1a1a" />
                    </g>

                    <!-- Screen UI (Abstract) -->
                    <g opacity="0.4">
                        <rect x="-80" y="-210" width="160" height="100" rx="8" fill="rgba(255,255,255,0.05)" />
                        <rect x="-80" y="-80" width="100" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
                        <rect x="-80" y="-65" width="140" height="6" rx="3" fill="rgba(255,255,255,0.05)" />
                    </g>

                    <!-- Glass Glare Overlay -->
                    <path d="M -110,-270 L 110,-270 L 110,-50 L -110,200 Z" fill="url(#glassGlare)" style="mix-blend-mode: overlay;" />
                    
                    <!-- Device Rim Light (Edge Highlight) -->
                    <rect x="-120" y="-280" width="240" height="560" rx="30" fill="none" stroke="url(#rimHighlight)" stroke-width="1.5" />
                </g>

                <!-- ==================== LAYER 3: CAST SHADOWS (CONTACT) ==================== -->
                <!-- Shadows projected from fingers onto the screen -->
                <g id="shadows" filter="url(#blurContact)">
                    <!-- Thumb Shadow on Screen -->
                    <path d="M -80,60 Q -20,100 60,20" stroke="#000" stroke-width="25" fill="none" opacity="0.5" />
                    <!-- Fingers Shadow on Right Edge -->
                    <path d="M 110,-150 L 110,200" stroke="#000" stroke-width="12" fill="none" opacity="0.4" />
                </g>

                <!-- ==================== LAYER 4: HAND FRONT (FINGERS & THUMB) ==================== -->
                
                <!-- Fingers (Wrapping right edge) -->
                <g id="fingers">
                    <!-- Index Finger -->
                    <g transform="translate(110, -160)">
                        <!-- Phalanx Shape -->
                        <path d="M 0,0 C 30,15 40,60 0,70 C -10,60 -10,10 0,0 Z" fill="url(#skinHighlight)" />
                        <!-- Knuckle Crease -->
                        <path d="M -2,25 Q 10,30 2,40" stroke="#6e3b25" stroke-width="1.5" fill="none" opacity="0.6" />
                        <!-- Nail -->
                        <path d="M 22,35 C 28,35 30,45 25,50 C 20,50 18,40 22,35 Z" fill="#f0dcd3" opacity="0.8" />
                        <!-- Nail Specular -->
                        <path d="M 23,37 L 26,37" stroke="#fff" stroke-width="0.5" opacity="0.8" />
                    </g>

                    <!-- Middle Finger -->
                    <g transform="translate(110, -60)">
                        <path d="M 0,0 C 35,15 45,70 0,80 C -10,70 -10,10 0,0 Z" fill="url(#skinHighlight)" />
                        <path d="M -2,30 Q 10,35 2,45" stroke="#6e3b25" stroke-width="1.5" fill="none" opacity="0.6" />
                        <!-- Nail -->
                        <path d="M 25,40 C 31,40 33,50 28,55 C 23,55 21,45 25,40 Z" fill="#f0dcd3" opacity="0.8" />
                    </g>

                    <!-- Ring Finger -->
                    <g transform="translate(110, 40)">
                        <path d="M 0,0 C 30,15 40,70 0,80 C -10,70 -10,10 0,0 Z" fill="url(#skinHighlight)" />
                        <path d="M -2,30 Q 10,35 2,45" stroke="#6e3b25" stroke-width="1.5" fill="none" opacity="0.6" />
                        <!-- Nail -->
                        <path d="M 22,40 C 28,40 30,50 25,55 C 20,55 18,45 22,40 Z" fill="#f0dcd3" opacity="0.8" />
                    </g>

                    <!-- Pinky Finger -->
                    <g transform="translate(110, 140)">
                        <path d="M 0,0 C 25,15 35,60 0,70 C -10,60 -10,10 0,0 Z" fill="url(#skinHighlight)" />
                        <!-- Nail -->
                        <path d="M 18,35 C 23,35 25,45 20,50 C 16,50 15,40 18,35 Z" fill="#f0dcd3" opacity="0.8" />
                    </g>
                </g>

                <!-- Thumb (The Active Grip) -->
                <g id="thumb">
                    <!-- Thumb Base -->
                    <path d="M -100,350 C -100,200 -80,150 -60,100" stroke="url(#skinCrease)" stroke-width="50" fill="none" stroke-linecap="round" />
                    
                    <!-- Thumb Shaft (Detailed) -->
                    <path d="M -80,110 C -90,80 -60,30 -30,-10 C -10,-40 10,-30 10,-10 C 10,10 -40,60 -80,110 Z" fill="url(#skinHighlight)" />
                    
                    <!-- Joint Definition -->
                    <circle cx="-40" cy="20" r="18" fill="url(#skinHighlight)" />
                    <path d="M -48,15 Q -40,25 -32,18" stroke="#6e3b25" stroke-width="1.5" fill="none" opacity="0.7" />

                    <!-- Thumbnail (Facing Camera) -->
                    <g transform="rotate(-20, -15, -20)">
                        <path d="M -15,-30 C -5,-40 10,-30 10,-10 C 10,10 -15,0 -15,-30 Z" fill="#f5e6de" />
                        <!-- Cuticle -->
                        <path d="M -15,-30 C -5,-35 10,-30 10,-25" stroke="#e0c0b0" stroke-width="1" fill="none" />
                        <!-- Specular Highlight -->
                        <ellipse cx="-5" cy="-15" rx="2" ry="6" fill="#fff" opacity="0.6" filter="url(#blurSoft)" />
                    </g>
                </g>

            </g>

            <!-- Foreground Depth Blur (Bokeh simulation) -->
            <circle cx="50" cy="800" r="120" fill="#000" filter="url(#blurDepth)" opacity="0.8" />
            <circle cx="550" cy="100" r="150" fill="#000" filter="url(#blurDepth)" opacity="0.7" />
        </svg>
    </div>

    <!-- Typography & Metadata Overlay -->
    <div class="metadata-overlay">
        <div class="meta-container">
            <div class="meta-col">
                <span class="meta-label">Subject</span>
                <span class="meta-value">Tactile Interface</span>
            </div>

            <div class="meta-divider"></div>

            <div class="meta-col">
                <span class="meta-label">Material</span>
                <span class="meta-value">Ceramic & Glass</span>
            </div>

            <div class="meta-divider"></div>

            <div class="meta-col">
                <span class="meta-label">Ergonomics</span>
                <span class="meta-value">Active Grip</span>
            </div>
        </div>
    </div>

    <script>
        // Refined Parallax Interaction
        const stage = document.querySelector('.stage');
        const scene = document.querySelector('#scene');

        stage.addEventListener('mousemove', (e) => {
            const rect = stage.getBoundingClientRect();
            // Normalize mouse position from -1 to 1
            const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            const y = ((e.clientY - rect.top) / rect.height) * 2 - 1;

            // Calculate rotation/translation values
            // Reduced intensity for a more premium, stable feel
            const translateX = x * 10;
            const translateY = y * 10;
            const rotate = x * 2;

            scene.style.transition = 'transform 0.1s ease-out';
            scene.style.transform = `translate(${translateX}px, ${translateY}px) rotate(${rotate}deg)`;
        });

        stage.addEventListener('mouseleave', () => {
            scene.style.transition = 'transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1)';
            scene.style.transform = `translate(0px, 0px) rotate(-12deg)`; // Return to base -12deg
        });
    </script>
</body>
</html>
