<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Interface of Touch</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --text-primary: #e0e0e0;
            --text-secondary: #888890;
            --accent: #ff4757;
            --font-display: 'Didot', 'Times New Roman', serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Ambient Background Noise */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.05;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            z-index: 0;
        }

        /* Main Container */
        .composition {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            z-index: 1;
        }

        /* Typography / Editorial Side */
        .editorial {
            padding: 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 2;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 5rem;
            font-weight: 300;
            line-height: 0.9;
            margin-bottom: 2rem;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .meta {
            font-family: var(--font-ui);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .meta::before {
            content: '';
            display: block;
            width: 40px;
            height: 1px;
            background: var(--text-secondary);
        }

        p.description {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-secondary);
            max-width: 400px;
            margin-bottom: 3rem;
        }

        .specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 2rem;
        }

        .spec-item h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .spec-item span {
            font-family: var(--font-display);
            font-size: 1.5rem;
            color: var(--text-primary);
        }

        /* Visual / SVG Side */
        .visual-stage {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* SVG Styling */
        svg#scene {
            width: 100%;
            height: 100%;
            max-width: 900px;
            /* Subtle breathing animation */
            animation: breathe 6s ease-in-out infinite;
            filter: drop-shadow(0 20px 50px rgba(0,0,0,0.6));
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.02) translateY(-5px); }
        }

        /* Responsive */
        @media (max-width: 900px) {
            .composition {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }
            .editorial {
                padding: 2rem;
                order: 2;
            }
            .visual-stage {
                order: 1;
                height: 50vh;
            }
            h1 { font-size: 3.5rem; }
        }
    </style>
</head>
<body>

    <div class="noise-overlay"></div>

    <div class="composition">
        <div class="editorial">
            <div class="meta">Study No. 04 — Interaction</div>
            <h1>Tactile<br>Reality</h1>
            <p class="description">
                A study in the friction between biological form and synthetic glass. 
                Exploring the anatomy of grip, the pressure of the thumb, and the 
                seamless integration of hardware and hand.
            </p>
            
            <div class="specs">
                <div class="spec-item">
                    <h3>Material</h3>
                    <span>Matte Ceramic</span>
                </div>
                <div class="spec-item">
                    <h3>Ergonomics</h3>
                    <span>Curved 2.5D</span>
                </div>
            </div>
        </div>

        <div class="visual-stage">
            <!-- The SVG Illustration -->
            <svg id="scene" viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Gradients -->
                    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#e0cbbd" />
                        <stop offset="50%" stop-color="#bfa090" />
                        <stop offset="100%" stop-color="#8a6e5e" />
                    </linearGradient>

                    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#5e4538" />
                        <stop offset="100%" stop-color="#8a6e5e" />
                    </linearGradient>

                    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#2a2a2a" />
                        <stop offset="50%" stop-color="#111111" />
                        <stop offset="100%" stop-color="#050505" />
                    </linearGradient>

                    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#1a202c" />
                        <stop offset="100%" stop-color="#0d1117" />
                    </linearGradient>

                    <linearGradient id="rimHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#444" />
                        <stop offset="50%" stop-color="#888" />
                        <stop offset="100%" stop-color="#333" />
                    </linearGradient>

                    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="rgba(255,255,255,0.0)" />
                        <stop offset="40%" stop-color="rgba(255,255,255,0.05)" />
                        <stop offset="45%" stop-color="rgba(255,255,255,0.3)" />
                        <stop offset="50%" stop-color="rgba(255,255,255,0.0)" />
                        <stop offset="100%" stop-color="rgba(255,255,255,0.0)" />
                    </linearGradient>

                    <!-- Filters -->
                    <filter id="softBlur">
                        <feGaussianBlur stdDeviation="4" />
                    </filter>
                    <filter id="heavyBlur">
                        <feGaussianBlur stdDeviation="15" />
                    </filter>
                    <filter id="dropShadow">
                        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
                    </filter>
                </defs>

                <!-- 1. The Background / Depth -->
                <rect width="100%" height="100%" fill="transparent" />

                <!-- 2. The Hand (Back Layer - Wrist & Palm Base) -->
                <g id="hand-back">
                    <!-- Wrist -->
                    <path d="M 280,900 L 350,550 L 550,550 L 620,900 Z" fill="url(#skinGrad)" />
                    <!-- Forearm Muscle Hint -->
                    <path d="M 300,900 Q 380,750 450,900" stroke="#a08070" stroke-width="3" fill="none" opacity="0.5"/>
                </g>

                <!-- 3. The Phone (Base) -->
                <g id="phone-base" transform="translate(250, 150) rotate(5)">
                    <!-- Phone Body -->
                    <rect x="0" y="0" width="260" height="540" rx="30" fill="url(#phoneBody)" filter="url(#dropShadow)"/>
                    
                    <!-- Screen -->
                    <rect x="10" y="10" width="240" height="520" rx="22" fill="url(#screenGlow)" />
                    
                    <!-- Camera Notch -->
                    <rect x="110" y="15" width="40" height="12" rx="6" fill="#000" />
                    <circle cx="120" cy="21" r="2" fill="#1a1a1a" />
                    
                    <!-- Screen Content (Abstract UI) -->
                    <g opacity="0.8">
                        <!-- Header -->
                        <rect x="30" y="60" width="120" height="10" rx="5" fill="#444" />
                        <!-- Image placeholder -->
                        <rect x="30" y="90" width="200" height="140" rx="10" fill="#222" />
                        <!-- Text lines -->
                        <rect x="30" y="250" width="180" height="6" rx="3" fill="#333" />
                        <rect x="30" y="270" width="160" height="6" rx="3" fill="#333" />
                        <rect x="30" y="290" width="140" height="6" rx="3" fill="#333" />
                        <!-- Button -->
                        <rect x="30" y="350" width="80" height="30" rx="15" fill="#ff4757" />
                    </g>

                    <!-- Glass Reflection -->
                    <path d="M 10,10 L 250,10 L 250,200 L 50,530 L 10,530 Z" fill="url(#glassReflection)" style="mix-blend-mode: overlay;" />
                </g>

                <!-- 4. The Hand (Interaction Layer) -->
                <g id="hand-front" transform="translate(0, 0)">
                    
                    <!-- Palm Base wrapping phone -->
                    <path d="M 250,400 Q 220,500 250,700 L 550,700 Q 580,500 550,400 Z" fill="url(#skinGrad)" opacity="0.9"/>
                    
                    <!-- Fingers (Wrapped around right side) -->
                    <!-- Finger 1 (Index) -->
                    <g transform="translate(500, 420) rotate(15)">
                        <path d="M 0,0 Q 30,20 20,60 L -20,60 Z" fill="url(#skinShadow)" />
                        <!-- Knuckle -->
                        <circle cx="15" cy="15" r="12" fill="url(#skinGrad)" />
                        <!-- Nail -->
                        <ellipse cx="10" cy="55" rx="8" ry="12" fill="#dcbfb5" opacity="0.8" />
                    </g>

                    <!-- Finger 2 (Middle) -->
                    <g transform="translate(490, 500) rotate(10)">
                        <path d="M 0,0 Q 30,20 20,60 L -20,60 Z" fill="url(#skinShadow)" />
                        <circle cx="15" cy="15" r="12" fill="url(#skinGrad)" />
                        <ellipse cx="10" cy="55" rx="8" ry="12" fill="#dcbfb5" opacity="0.8" />
                    </g>

                    <!-- Finger 3 (Ring) -->
                    <g transform="translate(495, 580) rotate(5)">
                        <path d="M 0,0 Q 30,20 20,60 L -20,60 Z" fill="url(#skinShadow)" />
                        <circle cx="15" cy="15" r="12" fill="url(#skinGrad)" />
                        <ellipse cx="10" cy="55" rx="8" ry="12" fill="#dcbfb5" opacity="0.8" />
                    </g>

                    <!-- Finger 4 (Pinky) -->
                    <g transform="translate(510, 660) rotate(0)">
                        <path d="M 0,0 Q 30,20 20,50 L -20,50 Z" fill="url(#skinShadow)" />
                        <circle cx="15" cy="15" r="11" fill="url(#skinGrad)" />
                        <ellipse cx="10" cy="45" rx="7" ry="10" fill="#dcbfb5" opacity="0.8" />
                    </g>

                    <!-- The Thumb (The Focal Point) -->
                    <g transform="translate(320, 450) rotate(-25)">
                        <!-- Thumb Base/Connection to Palm -->
                        <path d="M -20,20 Q -50,50 -60,120 L -10,150 Z" fill="url(#skinShadow)" />
                        
                        <!-- Thumb Shaft -->
                        <path d="M -10,20 Q 0,80 40,130 L 10,160 Z" fill="url(#skinGrad)" />
                        
                        <!-- Thumb Joint -->
                        <circle cx="20" cy="110" r="14" fill="#bfa090" />
                        
                        <!-- Thumb Tip -->
                        <path d="M 10,160 Q 20,190 40,180 Q 50,160 40,130 Z" fill="url(#skinGrad)" />
                        
                        <!-- Thumbnail -->
                        <path d="M 35,155 Q 45,165 40,175 Q 30,165 35,155" fill="#eaddcf" opacity="0.9" />
                        
                        <!-- Thumb Crease -->
                        <path d="M 15,100 Q 25,110 15,120" stroke="#8a6e5e" stroke-width="2" fill="none" opacity="0.6" />
                    </g>
                </g>

                <!-- 5. Lighting & Highlights (Global) -->
                <g id="lighting">
                    <!-- Highlight on Phone Rim -->
                    <rect x="245" y="145" width="260" height="540" rx="30" fill="none" stroke="url(#rimHighlight)" stroke-width="2" transform="rotate(5, 380, 415)" opacity="0.5" />
                    
                    <!-- Cast Shadow from Hand onto Phone Screen -->
                    <path d="M 300,350 Q 450,350 500,500 L 500,700 L 300,700 Z" fill="#000" opacity="0.2" filter="url(#softBlur)" transform="rotate(5, 380, 415)" />

                    <!-- Cast Shadow from Thumb onto Screen -->
                    <ellipse cx="380" cy="500" rx="40" ry="60" fill="#000" opacity="0.3" filter="url(#softBlur)" transform="rotate(10, 380, 500)" />
                </g>

                <!-- 6. Foreground Elements (Depth of Field) -->
                <g id="foreground" opacity="0.3">
                    <circle cx="80" cy="800" r="150" fill="#111" filter="url(#heavyBlur)" />
                    <circle cx="700" cy="100" r="200" fill="#000" filter="url(#heavyBlur)" />
                </g>

            </svg>
        </div>
    </div>

    <script>
        // Interactive Parallax Effect
        document.addEventListener('mousemove', (e) => {
            const svg = document.getElementById('scene');
            const visualStage = document.querySelector('.visual-stage');
            const rect = visualStage.getBoundingClientRect();
            
            // Calculate mouse position relative to the center of the stage
            const x = (e.clientX - rect.left - rect.width / 2) / rect.width;
            const y = (e.clientY - rect.top - rect.height / 2) / rect.height;

            // Apply subtle rotation and translation to the SVG based on mouse
            // Using CSS transform for performance
            const rotateX = y * 10; // Max 10deg rotation
            const rotateY = x * 10;
            const translateX = x * 20;
            const translateY = y * 20;

            svg.style.transform = `perspective(1000px) rotateX(${-rotateX}deg) rotateY(${rotateY}deg) translate(${translateX}px, ${translateY}px)`;
        });

        // Reset on mouse leave
        document.addEventListener('mouseleave', () => {
            const svg = document.getElementById('scene');
            svg.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) translate(0px, 0px)`;
        });
    </script>
</body>
</html>
