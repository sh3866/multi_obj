<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Close-Up: Tactile Interface</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --text-primary: #f0f0f0;
            --text-muted: #666670;
            --font-display: 'Didot', 'Times New Roman', serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Noise Texture for Film Grain Effect */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.07;
            pointer-events: none;
            z-index: 10;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Main Layout: The Illustration is the stage */
        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px; /* For parallax */
        }

        /* SVG Container */
        svg#illustration {
            width: 100%;
            height: 100%;
            max-width: 100vh; /* Keep aspect ratio manageable on wide screens */
            max-height: 100vh;
            object-fit: contain;
            transition: transform 0.1s ease-out;
            will-change: transform;
        }

        /* Metadata Overlay: Editorial Footer */
        .metadata-overlay {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            right: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 5;
            pointer-events: none; /* Let clicks pass through to SVG if needed */
            mix-blend-mode: exclusion;
        }

        .meta-col {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .meta-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-muted);
        }

        .meta-value {
            font-family: var(--font-display);
            font-size: 1.25rem;
            color: var(--text-primary);
            font-weight: 400;
        }

        .meta-divider {
            width: 1px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            margin: 0 2rem;
            align-self: center;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .metadata-overlay {
                flex-direction: column;
                align-items: flex-start;
                gap: 1.5rem;
                bottom: 1.5rem;
                left: 1.5rem;
            }
            .meta-divider {
                width: 40px;
                height: 1px;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <div class="noise-overlay"></div>

    <div class="stage">
        <!-- 
            SVG Composition:
            1. viewBox="0 0 800 800" for a square, focused crop.
            2. Hand drawn with organic bezier curves (C, Q, S).
            3. Gradients for subsurface scattering and metallic reflections.
        -->
        <svg id="illustration" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Lighting & Materials -->
                
                <!-- Skin Gradient: Top-Left Light Source -->
                <linearGradient id="skinLight" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f2d3bc" /> <!-- Highlight -->
                    <stop offset="40%" stop-color="#dcb39e" /> <!-- Midtone -->
                    <stop offset="85%" stop-color="#9e6b52" /> <!-- Shadow -->
                    <stop offset="100%" stop-color="#5e3a2b" /> <!-- Deep Shadow -->
                </linearGradient>

                <!-- Skin Shadow Gradient (for crevices) -->
                <linearGradient id="skinDark" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#8a5a45" />
                    <stop offset="100%" stop-color="#4a2a1a" />
                </linearGradient>

                <!-- Phone Chassis: Dark Metal -->
                <linearGradient id="phoneChassis" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#333333" />
                    <stop offset="50%" stop-color="#1a1a1a" />
                    <stop offset="100%" stop-color="#050505" />
                </linearGradient>

                <!-- Phone Rim: Metallic Edge Highlight -->
                <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#555" />
                    <stop offset="20%" stop-color="#fff" /> <!-- Specular Highlight -->
                    <stop offset="50%" stop-color="#333" />
                    <stop offset="100%" stop-color="#111" />
                </linearGradient>

                <!-- Screen: Dark Glass with subtle UI glow -->
                <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#1e232e" />
                    <stop offset="50%" stop-color="#11141a" />
                    <stop offset="100%" stop-color="#08090c" />
                </linearGradient>

                <!-- Glass Reflection Gradient (Top Left to Bottom Right) -->
                <linearGradient id="reflection" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
                    <stop offset="40%" stop-color="rgba(255,255,255,0.0)" />
                    <stop offset="100%" stop-color="rgba(255,255,255,0.0)" />
                </linearGradient>

                <!-- Filters -->
                <filter id="blurSoft">
                    <feGaussianBlur stdDeviation="3" />
                </filter>
                <filter id="blurHeavy">
                    <feGaussianBlur stdDeviation="20" />
                </filter>
                <filter id="contactShadow">
                    <feGaussianBlur stdDeviation="2" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.6"/>
                    </feComponentTransfer>
                </filter>
            </defs>

            <!-- BACKGROUND -->
            <rect width="100%" height="100%" fill="transparent" />

            <g id="scene-group" transform="translate(400, 400) rotate(-15)">
                
                <!-- ==================== THE HAND (BACK LAYER) ==================== -->
                <!-- Wrist and Palm Base -->
                <g id="hand-back">
                    <!-- Wrist connecting from bottom -->
                    <path d="M -150,450 C -180,200 -100,100 0,50 C 80,100 120,200 120,450 Z" fill="url(#skinDark)" />
                    <!-- Palm base (thick area) -->
                    <path d="M -120,450 C -150,300 -100,150 20,100 C 120,150 150,300 120,450 Z" fill="url(#skinLight)" opacity="0.9" />
                </g>

                <!-- ==================== THE PHONE ==================== -->
                <g id="phone-device">
                    <!-- Phone Body -->
                    <rect x="-140" y="-320" width="280" height="640" rx="35" fill="url(#phoneChassis)" />
                    
                    <!-- Screen -->
                    <rect x="-130" y="-310" width="260" height="620" rx="28" fill="url(#screenGlass)" />
                    
                    <!-- Hardware Details -->
                    <!-- Speaker -->
                    <rect x="-15" y="-295" width="30" height="4" rx="2" fill="#050505" />
                    <!-- Camera -->
                    <circle cx="10" cy="-295" r="3" fill="#050505" />
                    
                    <!-- Buttons (Volume/Power) -->
                    <rect x="140" y="-150" width="4" height="40" rx="1" fill="#222" />
                    <rect x="140" y="-90" width="4" height="40" rx="1" fill="#222" />
                    <rect x="-144" y="-120" width="4" height="25" rx="1" fill="#222" />

                    <!-- Abstract UI (Subtle) -->
                    <g opacity="0.6">
                        <rect x="-100" y="-250" width="200" height="120" rx="10" fill="rgba(255,255,255,0.05)" />
                        <rect x="-100" y="-110" width="140" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
                        <rect x="-100" y="-90" width="180" height="8" rx="4" fill="rgba(255,255,255,0.05)" />
                    </g>

                    <!-- Glass Reflection (Top Left Light Source) -->
                    <path d="M -130,-310 L 130,-310 L 130,-100 L -130,200 Z" fill="url(#reflection)" style="mix-blend-mode: overlay;" />
                </g>

                <!-- ==================== THE HAND (FRONT LAYER) ==================== -->
                <!-- Fingers wrapping around the RIGHT edge -->
                <g id="fingers-right">
                    <!-- Cast Shadow on Phone (Contact Friction) -->
                    <path d="M 130,-150 L 130,250" stroke="#000" stroke-width="15" opacity="0.4" filter="url(#contactShadow)" />

                    <!-- Index Finger -->
                    <g transform="translate(130, -180)">
                        <path d="M 0,0 C 40,10 50,60 0,70 C -10,60 -10,10 0,0 Z" fill="url(#skinLight)" />
                        <!-- Nail -->
                        <ellipse cx="25" cy="35" rx="6" ry="12" fill="#e8d0c0" opacity="0.6" transform="rotate(10)" />
                        <!-- Knuckle Crease -->
                        <path d="M -5,20 Q 10,25 5,35" stroke="#7a4a35" stroke-width="1.5" fill="none" opacity="0.5" />
                    </g>

                    <!-- Middle Finger -->
                    <g transform="translate(130, -80)">
                        <path d="M 0,0 C 45,10 55,70 0,80 C -10,70 -10,10 0,0 Z" fill="url(#skinLight)" />
                        <!-- Nail -->
                        <ellipse cx="28" cy="40" rx="6" ry="12" fill="#e8d0c0" opacity="0.6" transform="rotate(10)" />
                         <!-- Knuckle Crease -->
                         <path d="M -5,25 Q 10,30 5,40" stroke="#7a4a35" stroke-width="1.5" fill="none" opacity="0.5" />
                    </g>

                    <!-- Ring Finger -->
                    <g transform="translate(130, 20)">
                        <path d="M 0,0 C 40,10 50,70 0,80 C -10,70 -10,10 0,0 Z" fill="url(#skinLight)" />
                        <!-- Nail -->
                        <ellipse cx="25" cy="40" rx="6" ry="12" fill="#e8d0c0" opacity="0.6" transform="rotate(10)" />
                    </g>

                    <!-- Pinky Finger -->
                    <g transform="translate(130, 120)">
                        <path d="M 0,0 C 35,10 40,60 0,70 C -10,60 -10,10 0,0 Z" fill="url(#skinLight)" />
                        <!-- Nail -->
                        <ellipse cx="20" cy="35" rx="5" ry="10" fill="#e8d0c0" opacity="0.6" transform="rotate(10)" />
                    </g>
                </g>

                <!-- ==================== THE THUMB ==================== -->
                <!-- Wrapping from LEFT to FRONT -->
                <g id="thumb">
                    <!-- Thumb Shadow on Screen -->
                    <path d="M -80,50 Q 0,100 60,0" stroke="#000" stroke-width="30" opacity="0.25" filter="url(#contactShadow)" />

                    <!-- Thumb Base (Palm connection) -->
                    <path d="M -120,300 C -120,150 -100,100 -80,50" stroke="url(#skinDark)" stroke-width="60" fill="none" stroke-linecap="round" />
                    
                    <!-- Thumb Shaft (Flesh) -->
                    <path d="M -100,40 C -110,10 -80,-40 -40,-80 C -10,-100 20,-80 20,-40 C 20,-10 -40,50 -100,40 Z" fill="url(#skinLight)" />
                    
                    <!-- Thumb Joint (Knuckle) -->
                    <circle cx="-45" cy="-20" r="22" fill="url(#skinLight)" />
                    <!-- Joint Crease -->
                    <path d="M -55,-10 Q -45,-25 -35,-15" stroke="#7a4a35" stroke-width="2" fill="none" opacity="0.6" />

                    <!-- Thumbnail -->
                    <path d="M -15,-45 C -5,-60 15,-50 15,-30 C 15,-10 -10,-20 -15,-45 Z" fill="#f0e0d6" opacity="0.8" />
                    <!-- Nail Highlight -->
                    <path d="M -10,-45 Q 0,-55 5,-40" stroke="#fff" stroke-width="1" fill="none" opacity="0.5" />
                </g>

            </g>

            <!-- Foreground Blur (Depth of Field) -->
            <circle cx="50" cy="750" r="150" fill="#000" filter="url(#blurHeavy)" opacity="0.6" />
            <circle cx="750" cy="100" r="200" fill="#000" filter="url(#blurHeavy)" opacity="0.5" />
        </svg>
    </div>

    <!-- Typography & Metadata Overlay -->
    <div class="metadata-overlay">
        <div class="meta-col">
            <span class="meta-label">Subject</span>
            <span class="meta-value">Tactile Interface</span>
        </div>

        <div class="meta-divider"></div>

        <div class="meta-col">
            <span class="meta-label">Material</span>
            <span class="meta-value">Ceramic & Glass</span>
        </div>

        <div class="meta-divider"></div>

        <div class="meta-col">
            <span class="meta-label">Ergonomics</span>
            <span class="meta-value">Active Grip</span>
        </div>
    </div>

    <script>
        // Parallax Interaction
        // Moves the internal SVG group slightly based on mouse position relative to center
        const stage = document.querySelector('.stage');
        const sceneGroup = document.querySelector('#scene-group');

        stage.addEventListener('mousemove', (e) => {
            const rect = stage.getBoundingClientRect();
            // Normalize mouse position from -1 to 1
            const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            const y = ((e.clientY - rect.top) / rect.height) * 2 - 1;

            // Calculate rotation/translation values
            // We want the hand to "hold" the phone steady but shift slightly against the background
            const rotateX = y * 5; // Subtle tilt
            const rotateY = x * 5;
            const translateX = x * 15;
            const translateY = y * 15;

            // Apply transform to the SVG group
            sceneGroup.style.transform = `translate(${translateX}px, ${translateY}px) rotate(${x * 2}deg)`;
        });

        // Reset on leave
        stage.addEventListener('mouseleave', () => {
            sceneGroup.style.transition = 'transform 0.5s ease-out';
            sceneGroup.style.transform = `translate(0px, 0px) rotate(0deg)`;
            setTimeout(() => {
                sceneGroup.style.transition = 'none'; // Remove transition for instant mouse follow
            }, 500);
        });
    </script>
</body>
</html>
