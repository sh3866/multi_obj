<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Close-Up: Organic Grip</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-primary: #f0f0f0;
            --font-ui: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Grain Texture for Editorial Feel */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.06;
            pointer-events: none;
            z-index: 20;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Main Stage */
        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: crosshair;
        }

        /* SVG Container - Tight Crop */
        svg#illustration {
            width: 100%;
            height: 100%;
            max-width: 100vh;
            max-height: 100vh;
            object-fit: contain;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            svg#illustration {
                max-width: 150vh;
                max-height: 150vh;
            }
        }
    </style>
</head>
<body>

    <div class="noise-overlay"></div>

    <div class="stage">
        <!-- 
            RECONSTRUCTED SVG:
            1. Z-INDEX: Split fingers (tips over phone, base behind).
            2. ANATOMY: Thumb originates bottom-left, overlapping screen.
            3. MATERIALITY: Glass gradients, metallic bezel, specular highlights.
            4. COMPOSITION: Tight crop (800x1200).
        -->
        <svg id="illustration" viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- ==================== GRADIENTS ==================== -->

                <!-- Skin: Complex Volume (Knuckles light, creases dark) -->
                <linearGradient id="skinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f5d0b8" /> 
                    <stop offset="30%" stop-color="#d8a48b" /> 
                    <stop offset="70%" stop-color="#a87660" /> 
                    <stop offset="100%" stop-color="#6e4836" /> 
                </linearGradient>

                <!-- Skin: Back of Hand (Shadowed) -->
                <linearGradient id="skinBack" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#8a5a42" /> 
                    <stop offset="100%" stop-color="#3d2317" /> 
                </linearGradient>

                <!-- Skin: Screen Illumination (Blue/Cyan Cast) -->
                <radialGradient id="skinGlow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="rgba(100, 200, 255, 0.4)" />
                    <stop offset="100%" stop-color="rgba(100, 200, 255, 0)" />
                </radialGradient>

                <!-- Device: Metal Chassis -->
                <linearGradient id="metalChassis" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#4a4a4e" /> <!-- Highlight -->
                    <stop offset="15%" stop-color="#2c2c2e" />
                    <stop offset="85%" stop-color="#000000" /> <!-- Shadow -->
                    <stop offset="100%" stop-color="#3a3a3c" /> <!-- Rim light right -->
                </linearGradient>

                <!-- Screen: Deep Glass with subtle sheen -->
                <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#1a1c23" />
                    <stop offset="40%" stop-color="#0a0b0d" />
                    <stop offset="100%" stop-color="#000000" />
                </linearGradient>

                <!-- Glare/Reflection -->
                <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
                    <stop offset="30%" stop-color="rgba(255,255,255,0.0)" />
                    <stop offset="100%" stop-color="rgba(255,255,255,0.0)" />
                </linearGradient>

                <!-- ==================== FILTERS ==================== -->
                <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" />
                </filter>
                <filter id="blurShadow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="8" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.7"/>
                    </feComponentTransfer>
                </filter>
                <filter id="blurDepth" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="60" />
                </filter>
            </defs>

            <!-- Background: Deep Shadow with subtle vignette -->
            <rect width="100%" height="100%" fill="var(--bg-color)" />
            <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
                <stop offset="50%" stop-color="#000" stop-opacity="0" />
                <stop offset="100%" stop-color="#000" stop-opacity="0.9" />
            </radialGradient>
            <rect width="100%" height="100%" fill="url(#vignette)" pointer-events="none" />

            <!-- Main Composition Group -->
            <g id="scene" transform="translate(400, 600)">
                
                <!-- ==================== LAYER 1: HAND BASE (PALM/WRIST - BEHIND PHONE) ==================== -->
                <g id="hand-base">
                    <!-- The bulk of the hand behind the phone -->
                    <!-- Redrawn to support the wrap -->
                    <path d="M -300,600 C -300,200 -200,-100 -50,-150 C 100,-200 300,0 300,600 Z" fill="url(#skinBack)" filter="url(#blurSoft)" />
                    <!-- Deep shadow area where hand meets phone back -->
                    <path d="M -200,-100 C -50,-150 100,-150 250,0 C 300,50 300,200 300,200 L -200,200 Z" fill="#2a150d" opacity="0.8" filter="url(#blurSoft)"/>
                </g>

                <!-- ==================== LAYER 2: THE DEVICE ==================== -->
                <g id="device" transform="translate(0, 0)">
                    <!-- Chassis Body -->
                    <rect x="-140" y="-350" width="280" height="700" rx="40" fill="url(#metalChassis)" />
                    
                    <!-- Inner Bezel (The black frame) -->
                    <rect x="-128" y="-338" width="256" height="676" rx="32" fill="#000" />

                    <!-- Screen Glass -->
                    <rect x="-125" y="-335" width="250" height="670" rx="30" fill="url(#screenGradient)" />
                    
                    <!-- Screen Glow (Ambient Light Source) -->
                    <rect x="-125" y="-335" width="250" height="670" rx="30" fill="rgba(100, 200, 255, 0.03)" />

                    <!-- Hardware Details -->
                    <g id="hardware">
                        <!-- Dynamic Island / Notch -->
                        <rect x="-45" y="-310" width="90" height="26" rx="13" fill="#000" />
                        <!-- Camera Lens -->
                        <circle cx="-22" cy="-297" r="5.5" fill="#1a1a1a" />
                        <circle cx="-22" cy="-297" r="2" fill="#333" />
                        <!-- Speaker -->
                        <rect x="28" y="-300" width="22" height="3.5" rx="1.75" fill="#050505" />
                        
                        <!-- Side Buttons (Volume/Power) -->
                        <rect x="-145" y="-140" width="6" height="45" rx="2" fill="#2a2a2e" /> <!-- Vol Up -->
                        <rect x="-145" y="-75" width="6" height="45" rx="2" fill="#2a2a2e" /> <!-- Vol Down -->
                        <rect x="140" y="-100" width="6" height="70" rx="2" fill="#2a2a2e" /> <!-- Power -->
                    </g>

                    <!-- Abstract UI Content (Faint) -->
                    <g opacity="0.2">
                        <rect x="-80" y="-250" width="160" height="140" rx="12" fill="rgba(255,255,255,0.05)" />
                        <circle cx="-60" cy="-180" r="12" fill="rgba(255,255,255,0.1)" />
                        <rect x="-40" y="-188" width="90" height="10" rx="4" fill="rgba(255,255,255,0.1)" />
                        <rect x="-80" y="-110" width="160" height="6" rx="3" fill="rgba(255,255,255,0.08)" />
                        <rect x="-80" y="-85" width="120" height="6" rx="3" fill="rgba(255,255,255,0.08)" />
                    </g>

                    <!-- Glass Glare Overlay -->
                    <path d="M -125,-335 L 125,-335 L 125,150 L -125,400 Z" fill="url(#glassReflection)" style="mix-blend-mode: screen;" />
                </g>

                <!-- ==================== LAYER 3: CAST SHADOWS ==================== -->
                <!-- Shadows projected from fingers onto the screen -->
                <g id="shadows" filter="url(#blurShadow)">
                    <!-- Thumb Shadow on Screen (Anchors the thumb) -->
                    <path d="M -100,60 Q -30,150 50,30" stroke="#000" stroke-width="40" fill="none" opacity="0.7" />
                    <!-- Fingers Shadow on Right Edge -->
                    <path d="M 125,-180 L 125,250" stroke="#000" stroke-width="20" fill="none" opacity="0.6" />
                </g>

                <!-- ==================== LAYER 4: HAND FRONT (FINGERS & THUMB) ==================== -->
                
                <!-- Fingers (Wrapping right edge - Continuous Flow) -->
                <!-- Logic: The finger base is behind the phone (handled in LAYER 1 visually, but drawn here for continuity) -->
                <!-- We draw the tips overlapping the bezel/screen edge -->
                <g id="fingers">
                    <!-- Index Finger -->
                    <g transform="translate(135, -180)">
                        <!-- Organic Finger Shape (Tip overlapping bezel) -->
                        <path d="M -10,-20 C 15,-10 35,20 25,40 C 10,55 -10,50 -10,-20 Z" fill="url(#skinGradient)" />
                        <!-- Tension Lines / Creases -->
                        <path d="M -5,10 Q 10,15 0,25" stroke="#7a4430" stroke-width="1.5" fill="none" opacity="0.6" />
                        <!-- Nail (Side View) -->
                        <path d="M 20,25 C 25,25 28,35 22,40 C 18,40 18,30 20,25 Z" fill="#eacbc0" opacity="0.9" />
                        <!-- Specular on Nail -->
                        <ellipse cx="22" cy="32" rx="1.5" ry="4" fill="#fff" opacity="0.6" filter="url(#blurSoft)" />
                    </g>

                    <!-- Middle Finger -->
                    <g transform="translate(135, -70)">
                        <path d="M -10,-20 C 20,-5 40,50 25,70 C 5,85 -10,75 -10,-20 Z" fill="url(#skinGradient)" />
                        <path d="M -5,20 Q 15,25 5,40" stroke="#7a4430" stroke-width="1.5" fill="none" opacity="0.6" />
                        <!-- Nail -->
                        <path d="M 22,35 C 28,35 30,45 25,50 C 20,50 20,40 22,35 Z" fill="#eacbc0" opacity="0.9" />
                        <!-- Specular -->
                        <ellipse cx="24" cy="42" rx="1.5" ry="5" fill="#fff" opacity="0.6" filter="url(#blurSoft)" />
                    </g>

                    <!-- Ring Finger -->
                    <g transform="translate(135, 30)">
                        <path d="M -10,-20 C 15,0 30,60 15,80 C -5,95 -10,85 -10,-20 Z" fill="url(#skinGradient)" />
                        <path d="M -5,20 Q 10,25 0,40" stroke="#7a4430" stroke-width="1.5" fill="none" opacity="0.6" />
                        <!-- Nail -->
                        <path d="M 15,45 C 20,45 22,55 18,60 C 14,60 14,50 15,45 Z" fill="#eacbc0" opacity="0.9" />
                         <!-- Specular -->
                         <ellipse cx="17" cy="52" rx="1.5" ry="4" fill="#fff" opacity="0.6" filter="url(#blurSoft)" />
                    </g>

                    <!-- Pinky Finger -->
                    <g transform="translate(135, 130)">
                        <path d="M -10,-20 C 10,0 20,50 5,70 C -10,85 -10,75 -10,-20 Z" fill="url(#skinGradient)" />
                        <!-- Nail -->
                        <path d="M 5,45 C 10,45 12,55 8,60 C 4,60 4,50 5,45 Z" fill="#eacbc0" opacity="0.9" />
                    </g>
                </g>

                <!-- Thumb (The Active Grip - Overlapping Screen) -->
                <!-- Redesigned to originate bottom-left and wrap over -->
                <g id="thumb">
                    <!-- Thumb Base connecting to palm (Behind phone visually, but drawn here for gradient continuity) -->
                    <!-- Clipped visually by the phone, but we draw the part that goes OVER -->
                    
                    <!-- Thumb Shaft (Overlapping screen) -->
                    <path d="M -130,300 C -130,200 -80,150 -50,100 C -30,70 -10,50 10,40 C 30,30 40,50 30,70 C 10,100 -50,150 -130,300 Z" fill="url(#skinGradient)" />
                    
                    <!-- Joint Definition (MCP Joint) -->
                    <circle cx="-40" cy="100" r="25" fill="url(#skinGradient)" />
                    <path d="M -55,90 Q -40,105 -25,95" stroke="#7a4430" stroke-width="2" fill="none" opacity="0.6" />

                    <!-- Thumbnail (Facing Camera) -->
                    <g transform="rotate(-10, 20, 40)">
                        <!-- Nail Bed -->
                        <path d="M 5,25 C 15,15 30,25 30,45 C 30,65 5,55 5,25 Z" fill="#f5e6de" />
                        <!-- Cuticle -->
                        <path d="M 5,25 C 15,20 30,25 30,30" stroke="#dcbba8" stroke-width="1.5" fill="none" />
                        <!-- Specular Highlight -->
                        <ellipse cx="15" cy="40" rx="4" ry="10" fill="#fff" opacity="0.6" filter="url(#blurSoft)" />
                        
                        <!-- Screen Glow on Thumb -->
                        <path d="M 5,25 C 15,15 30,25 30,45 C 30,65 5,55 5,25 Z" fill="url(#skinGlow)" style="mix-blend-mode: screen;" />
                    </g>
                </g>

            </g>

            <!-- Foreground Depth Blur (Bokeh simulation) -->
            <circle cx="0" cy="1200" r="200" fill="#000" filter="url(#blurDepth)" opacity="0.8" />
            <circle cx="800" cy="100" r="250" fill="#000" filter="url(#blurDepth)" opacity="0.7" />
        </svg>
    </div>

    <script>
        // Subtle Parallax Interaction
        const stage = document.querySelector('.stage');
        const scene = document.querySelector('#scene');

        stage.addEventListener('mousemove', (e) => {
            const rect = stage.getBoundingClientRect();
            // Normalize mouse position from -1 to 1
            const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            const y = ((e.clientY - rect.top) / rect.height) * 2 - 1;

            // Calculate rotation/translation values
            const translateX = x * 20;
            const translateY = y * 20;
            const rotate = x * 4;

            scene.style.transition = 'transform 0.1s ease-out';
            scene.style.transform = `translate(${translateX}px, ${translateY}px) rotate(${rotate}deg)`;
        });

        stage.addEventListener('mouseleave', () => {
            scene.style.transition = 'transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1)';
            scene.style.transform = `translate(0px, 0px) rotate(0deg)`; 
        });
    </script>
</body>
</html>
