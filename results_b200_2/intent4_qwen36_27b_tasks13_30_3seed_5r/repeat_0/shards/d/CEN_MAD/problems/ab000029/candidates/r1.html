<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUDUS // Tactical Architect</title>
    <style>
        :root {
            /* Palette: Deep Slate, Tactical Teal, & Amber */
            --bg-body: #0f172a;
            --bg-panel: #1e293b;
            --bg-canvas: #020617; /* Very dark for contrast */
            --bg-input: #0f172a;
            
            --border-subtle: #334155;
            --border-focus: #f59e0b;
            
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --accent-primary: #f59e0b; /* Amber */
            --accent-hover: #d97706;
            --accent-glow: rgba(245, 158, 11, 0.25);
            
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.1);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.1);

            /* Typography */
            --font-display: 'Georgia', 'Times New Roman', serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'Menlo', 'Monaco', 'Courier New', monospace;

            /* Standardized Geometry */
            --radius: 6px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Header --- */
        header {
            height: 56px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: var(--bg-panel);
            z-index: 10;
        }

        .brand {
            font-family: var(--font-display);
            font-weight: bold;
            font-size: 1.25rem;
            letter-spacing: 0.05em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand span { color: var(--accent-primary); }

        .brand-icon {
            width: 24px;
            height: 24px;
            background: var(--accent-primary);
            -webkit-mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/></svg>') no-repeat center;
            mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/></svg>') no-repeat center;
        }

        /* Ghost Buttons for Tertiary Actions */
        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: var(--radius);
            transition: all 0.2s;
        }

        .btn-ghost:hover {
            background: var(--bg-surface);
            color: var(--text-primary);
            border-color: var(--border-subtle);
        }

        /* --- Layout Grid --- */
        main {
            flex: 1;
            display: grid;
            /* Left: 320px | Center: Flex | Right: 320px */
            grid-template-columns: 320px 1fr 320px;
            height: calc(100vh - 56px);
        }

        /* --- Panels (Shared Styles) --- */
        .panel {
            background: var(--bg-panel);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding-bottom: 20px;
        }
        
        .panel:last-child {
            border-right: none;
            border-left: 1px solid var(--border-subtle);
        }

        .panel-header {
            padding: 16px 20px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-subtle);
            font-weight: 700;
            background: rgba(30, 41, 59, 0.95);
            position: sticky;
            top: 0;
            backdrop-filter: blur(4px);
            z-index: 2;
        }

        .panel-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* --- Inputs & Controls --- */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        .value-display {
            font-family: var(--font-mono);
            color: var(--text-primary);
            font-size: 0.75rem;
            background: rgba(255,255,255,0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        input[type="number"], select, textarea {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: var(--radius);
            font-family: var(--font-ui);
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        /* Sliders */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: var(--border-subtle);
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--text-primary);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
            border: 2px solid var(--bg-panel);
            box-shadow: 0 0 0 1px var(--text-secondary);
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.1); }

        /* Toggles (Pill Style) */
        .toggle-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .toggle-item:last-child { border-bottom: none; }

        .toggle-label {
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            appearance: none;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            background: var(--text-secondary);
            border-radius: 50%;
            transition: all 0.2s;
        }
        .toggle-switch:checked {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
        }
        .toggle-switch:checked::after {
            transform: translateX(20px);
            background: #fff;
        }

        /* --- Center: The Tactical Canvas --- */
        .stage {
            background-color: var(--bg-canvas);
            /* Subtle grid pattern */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* The Board Container */
        .board-container {
            position: relative;
            transition: transform 0.3s ease;
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.6),
                0 0 0 1px rgba(255,255,255,0.1);
            border-radius: 4px;
            padding: 8px;
            background: #1e293b; /* Board frame */
            border: 1px solid #334155;
        }

        canvas {
            display: block;
            border-radius: 2px;
            cursor: crosshair;
        }

        /* Overlay UI */
        .board-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            padding: 10px 16px;
            border-radius: var(--radius);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-secondary);
            pointer-events: none;
            border: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .board-overlay strong { color: var(--text-primary); }

        /* --- Right Panel: Logic & Validation --- */
        
        /* Validation Summary */
        .validation-box {
            background: var(--success-bg);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: var(--radius);
            padding: 12px;
            margin-bottom: 8px;
        }
        .validation-box.error {
            background: var(--danger-bg);
            border-color: rgba(239, 68, 68, 0.3);
        }
        .val-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            margin-bottom: 4px;
            color: var(--success);
        }
        .validation-box.error .val-row { color: var(--danger); }
        .val-icon { width: 14px; height: 14px; flex-shrink: 0; }

        /* Rule Editor Inputs */
        .rule-input-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* --- Buttons (Action Hierarchy) --- */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Primary: Generate (Bottom Left) */
        .btn-primary {
            background: var(--accent-primary);
            color: #0f172a;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(245, 158, 11, 0.3);
        }

        /* Secondary: Start Sim (Bottom Right) */
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--text-primary);
            color: var(--text-primary);
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
        }

        /* --- Scrollbar --- */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-panel); }
        ::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* Utility */
        .divider { height: 1px; background: var(--border-subtle); margin: 8px 0; opacity: 0.5; }

    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-icon"></div>
            LUDUS <span>// ARCHITECT</span>
        </div>
        <div class="header-actions">
            <button class="btn-ghost">Export JSON</button>
            <button class="btn-ghost">Load Preset</button>
        </div>
    </header>

    <main>
        <!-- LEFT PANEL: Configuration (Input Zone) -->
        <aside class="panel">
            <div class="panel-header">
                <span>Board Specifications</span>
            </div>
            <div class="panel-content">
                
                <!-- Dimensions -->
                <div class="control-group">
                    <label>Grid Dimensions <span class="value-display" id="dim-display">8x8</span></label>
                    <div class="input-row">
                        <input type="number" id="rows" value="8" min="4" max="24" placeholder="Rows">
                        <input type="number" id="cols" value="8" min="4" max="24" placeholder="Cols">
                    </div>
                </div>

                <!-- Complexity -->
                <div class="control-group">
                    <label>Complexity <span class="value-display" id="complexity-display">Standard</span></label>
                    <input type="range" id="complexity" min="1" max="3" step="1" value="2">
                </div>

                <!-- Geometry -->
                <div class="control-group">
                    <label>Cell Geometry</label>
                    <select id="geometry">
                        <option value="square">Square (Classic)</option>
                        <option value="hex">Hexagon (Tactical)</option>
                    </select>
                </div>

                <div class="divider"></div>

                <!-- Generators -->
                <div class="control-group">
                    <div class="panel-header" style="padding: 0 0 10px 0; border: none; background: transparent; position: static;">Generators</div>
                    
                    <div class="toggle-item">
                        <span class="toggle-label">Terrain Noise</span>
                        <input type="checkbox" class="toggle-switch" checked>
                    </div>
                    <div class="toggle-item">
                        <span class="toggle-label">Resource Nodes</span>
                        <input type="checkbox" class="toggle-switch" checked>
                    </div>
                    <div class="toggle-item">
                        <span class="toggle-label">Fog of War</span>
                        <input type="checkbox" class="toggle-switch">
                    </div>
                </div>

                <div class="divider"></div>

                <!-- Initial Layout -->
                <div class="control-group">
                    <div class="panel-header" style="padding: 0 0 10px 0; border: none; background: transparent; position: static;">Initial Layout</div>
                    <div class="input-row">
                        <input type="text" placeholder="P1 Start [x,y]" value="1,1">
                        <input type="text" placeholder="P2 Start [x,y]" value="7,7">
                    </div>
                </div>

                <!-- Primary Action -->
                <div style="margin-top: auto; padding-top: 20px;">
                    <button class="btn btn-primary" id="generate-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 0 1 9-9"/></svg>
                        Generate Board
                    </button>
                </div>
            </div>
        </aside>

        <!-- CENTER: Canvas Preview -->
        <section class="stage">
            <div class="board-overlay">
                <div><strong>LAYER:</strong> TERRAIN</div>
                <div id="coords">X: 0, Y: 0</div>
            </div>
            <div class="board-container" id="board-wrapper">
                <canvas id="gameBoard"></canvas>
            </div>
        </section>

        <!-- RIGHT PANEL: Logic & Actions (Output Zone) -->
        <aside class="panel">
            <div class="panel-header">
                <span>Rule Logic & Validation</span>
            </div>
            <div class="panel-content">
                
                <!-- Validation (Moved to Top) -->
                <div class="control-group">
                    <label>Validation Status</label>
                    <div class="validation-box" id="validation-box">
                        <div class="val-row">
                            <svg class="val-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                            <span>Grid topology valid</span>
                        </div>
                        <div class="val-row">
                            <svg class="val-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                            <span>Resource balance OK</span>
                        </div>
                        <div class="val-row">
                            <svg class="val-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                            <span>Pathing solvable</span>
                        </div>
                    </div>
                </div>

                <!-- Rule Editor (Interactive Inputs) -->
                <div class="control-group">
                    <div class="panel-header" style="padding: 0 0 10px 0; border: none; background: transparent; position: static;">Edit Rules</div>
                    
                    <div class="rule-input-group">
                        <div>
                            <label>Movement Cost (MP)</label>
                            <input type="number" value="3" min="1" max="10">
                        </div>
                        
                        <div>
                            <label>Victory Condition</label>
                            <textarea placeholder="Define win state logic...">Control 3 Capital Nodes or Eliminate all rival units.</textarea>
                        </div>
                    </div>
                </div>

                <!-- Secondary Action -->
                <div style="margin-top: auto; padding-top: 20px;">
                    <button class="btn btn-secondary" id="start-sim-btn">
                        Start Simulation
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    </button>
                </div>

            </div>
        </aside>
    </main>

    <script>
        /**
         * LUDUS ENGINE
         * Canvas-based tactical board generator.
         */
        
        const canvas = document.getElementById('gameBoard');
        const ctx = canvas.getContext('2d');
        const boardWrapper = document.getElementById('board-wrapper');
        const rowsInput = document.getElementById('rows');
        const colsInput = document.getElementById('cols');
        const dimDisplay = document.getElementById('dim-display');
        const complexityInput = document.getElementById('complexity');
        const complexityDisplay = document.getElementById('complexity-display');
        const generateBtn = document.getElementById('generate-btn');
        const geometrySelect = document.getElementById('geometry');
        const coordsDisplay = document.getElementById('coords');

        // State
        let config = {
            rows: 8,
            cols: 8,
            cellSize: 60,
            complexity: 2, 
            geometry: 'square',
            seed: Date.now()
        };

        // Colors - Tactical Palette
        const PALETTE = {
            bg: '#0f172a',
            // Muted Greens/Blues for tiles
            land: '#1e293b', 
            landAlt: '#16202c',
            water: '#0ea5e9',
            mountain: '#334155',
            resource: '#10b981',
            highlight: '#f59e0b',
            stroke: '#475569'
        };

        // --- Drawing Functions ---

        function resizeCanvas() {
            const stage = document.querySelector('.stage');
            const maxW = stage.clientWidth - 80; // padding
            const maxH = stage.clientHeight - 80;

            const sizeByCols = Math.floor(maxW / config.cols);
            const sizeByRows = Math.floor(maxH / config.rows);
            // Ensure cells aren't too small or too huge
            config.cellSize = Math.min(Math.max(sizeByCols, 30), Math.max(sizeByRows, 30), 80); 

            canvas.width = config.cols * config.cellSize;
            canvas.height = config.rows * config.cellSize;
        }

        function drawSquare(x, y, size, type, id) {
            const padding = 2;
            const isAlt = (Math.floor(x / size) + Math.floor(y / size)) % 2 === 0;
            
            // Base
            ctx.fillStyle = isAlt ? PALETTE.landAlt : PALETTE.land;
            ctx.fillRect(x + padding, y + padding, size - padding*2, size - padding*2);
            
            // Stroke
            ctx.strokeStyle = PALETTE.stroke;
            ctx.lineWidth = 1;
            ctx.strokeRect(x + padding, y + padding, size - padding*2, size - padding*2);

            // Details
            if (type === 'mountain') {
                ctx.fillStyle = 'rgba(148, 163, 184, 0.15)';
                ctx.beginPath();
                ctx.moveTo(x + padding, y + size - padding);
                ctx.lineTo(x + size/2, y + padding + 10);
                ctx.lineTo(x + size - padding, y + size - padding);
                ctx.fill();
                
                // Mountain detail lines
                ctx.strokeStyle = 'rgba(148, 163, 184, 0.3)';
                ctx.beginPath();
                ctx.moveTo(x + size/2 - 5, y + size/2);
                ctx.lineTo(x + size/2, y + padding + 10);
                ctx.lineTo(x + size/2 + 5, y + size/2);
                ctx.stroke();
            } else if (type === 'water') {
                ctx.fillStyle = 'rgba(14, 165, 233, 0.2)';
                ctx.fillRect(x + padding + 2, y + padding + 2, size - padding*2 - 4, size - padding*2 - 4);
                
                // Water wave
                ctx.strokeStyle = 'rgba(14, 165, 233, 0.4)';
                ctx.beginPath();
                ctx.moveTo(x + size * 0.2, y + size * 0.5);
                ctx.quadraticCurveTo(x + size * 0.5, y + size * 0.3, x + size * 0.8, y + size * 0.5);
                ctx.stroke();
            }
        }

        function drawHex(cx, cy, size, type) {
            const r = size / 2 - 4;
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = 2 * Math.PI / 6 * i;
                const x = cx + r * Math.cos(angle);
                const y = cy + r * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fillStyle = PALETTE.land;
            ctx.fill();
            ctx.strokeStyle = PALETTE.stroke;
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        function drawResourceNode(x, y, size) {
            const cx = x + size/2;
            const cy = y + size/2;
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath();
            ctx.arc(cx + 2, cy + 2, size * 0.15, 0, Math.PI*2);
            ctx.fill();

            // Node
            ctx.fillStyle = PALETTE.resource;
            ctx.shadowColor = 'rgba(16, 185, 129, 0.6)';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(cx, cy, size * 0.15, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0; // Reset
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const cs = config.cellSize;

            if (config.geometry === 'square') {
                for (let r = 0; r < config.rows; r++) {
                    for (let c = 0; c < config.cols; c++) {
                        // Pseudo-random terrain
                        const noise = Math.sin(c * 0.5 + config.seed) * Math.cos(r * 0.5 + config.seed);
                        let type = 'plain';
                        if (noise > 0.6) type = 'mountain';
                        else if (noise < -0.6) type = 'water';
                        
                        drawSquare(c * cs, r * cs, cs, type);

                        // Random Resource Nodes (seeded by position)
                        if ((c + r + config.seed) % 7 === 0 && type !== 'water') {
                            drawResourceNode(c * cs, r * cs, cs);
                        }
                    }
                }
            } else if (config.geometry === 'hex') {
                const r = cs / 2 - 2;
                const h = Math.sqrt(3) * r;
                const v = 1.5 * r;
                
                for (let rIdx = 0; rIdx < config.rows; rIdx++) {
                    for (let cIdx = 0; cIdx < config.cols; cIdx++) {
                        const cx = cIdx * (1.5 * r) + (rIdx % 2) * (0.75 * r) + r;
                        const cy = rIdx * v + r;
                        drawHex(cx, cy, cs, 'plain');
                    }
                }
            }
        }

        function updateUI() {
            dimDisplay.textContent = `${config.rows}x${config.cols}`;
            const compLabels = ['Low', 'Standard', 'Complex'];
            complexityDisplay.textContent = compLabels[config.complexity - 1];
        }

        function init() {
            resizeCanvas();
            drawBoard();
            updateUI();
        }

        // --- Interactivity ---

        rowsInput.addEventListener('input', (e) => {
            config.rows = parseInt(e.target.value) || 8;
            updateUI();
            resizeCanvas();
            drawBoard();
        });

        colsInput.addEventListener('input', (e) => {
            config.cols = parseInt(e.target.value) || 8;
            updateUI();
            resizeCanvas();
            drawBoard();
        });

        complexityInput.addEventListener('input', (e) => {
            config.complexity = parseInt(e.target.value);
            updateUI();
        });

        geometrySelect.addEventListener('change', (e) => {
            config.geometry = e.target.value;
            resizeCanvas();
            drawBoard();
        });

        generateBtn.addEventListener('click', () => {
            const btn = generateBtn;
            const originalText = btn.innerHTML;
            
            btn.innerHTML = `<svg class="spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Generating...`;
            btn.style.opacity = '0.8';
            
            setTimeout(() => {
                config.seed = Date.now();
                drawBoard();
                btn.innerHTML = originalText;
                btn.style.opacity = '1';
                
                // Flash effect
                canvas.style.filter = 'brightness(1.3)';
                setTimeout(() => canvas.style.filter = 'none', 150);
            }, 500);
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const c = Math.floor(x / config.cellSize);
            const r = Math.floor(y / config.cellSize);
            
            if (c >= 0 && c < config.cols && r >= 0 && r < config.rows) {
                coordsDisplay.textContent = `X: ${c}, Y: ${r}`;
                
                drawBoard(); // Redraw
                
                // Cursor Highlight
                ctx.strokeStyle = PALETTE.highlight;
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 3]);
                ctx.strokeRect(c * config.cellSize + 4, r * config.cellSize + 4, config.cellSize - 8, config.cellSize - 8);
                ctx.setLineDash([]);
            }
        });

        canvas.addEventListener('mouseleave', () => {
            coordsDisplay.textContent = "X: -, Y: -";
            drawBoard();
        });

        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes spin { 100% { transform: rotate(360deg); } }
            .spin { animation: spin 1s linear infinite; }
        `;
        document.head.appendChild(styleSheet);

        window.addEventListener('resize', () => {
            resizeCanvas();
            drawBoard();
        });
        
        init();

    </script>
</body>
</html>
