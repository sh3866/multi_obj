<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Architect Series | Premium Sanitaryware</title>
    <style>
        :root {
            --bg: #F4F4F5;
            --text-main: #1A1A1A;
            --text-muted: #666666;
            --accent: #0055FF;
            --shadow-color: rgba(0, 0, 0, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            /* Critique Point 5: Reduced opacity grid for less noise */
            background-image: 
                linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* --- UI Layer --- */
        header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            mix-blend-mode: multiply;
        }

        .brand {
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .nav-links span {
            margin-left: 2rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-links span:hover {
            color: var(--text-main);
        }

        /* --- Main Stage --- */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 60% 40%;
            position: relative;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* Left: The Visual */
        .visual-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .svg-container {
            width: 90%;
            height: 90%;
            position: relative;
            /* Critique Point 4: Stronger drop shadow for hierarchy */
            filter: drop-shadow(0px 30px 40px rgba(0,0,0,0.2));
            transition: transform 0.3s ease-out;
        }

        /* Right: The Copy */
        .info-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 6rem 4rem;
            z-index: 5;
            border-left: 1px solid rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 4.5rem;
            line-height: 0.9;
            letter-spacing: -0.04em;
            margin-bottom: 2rem;
            color: var(--text-main);
            font-weight: 700;
        }

        .tagline {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 380px;
            margin-bottom: 4rem;
            font-weight: 400;
        }

        .specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            margin-top: auto;
        }

        .spec-item h3 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            /* Critique Point 5: Darker text color */
            color: #888888;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        .spec-item p {
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: var(--text-main);
        }

        /* --- Interaction --- */
        .flush-trigger-zone {
            position: absolute;
            top: 38%;
            left: 76%;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 20;
            /* border: 1px solid red; Debugging */
        }

        /* --- Animations --- */
        /* Critique Point 2: Fluid swirling motion */
        @keyframes swirlVortex {
            0% { transform: rotate(0deg) scale(1); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; transform: rotate(360deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
            }
            .info-panel {
                border-left: none;
                border-top: 1px solid rgba(0,0,0,0.05);
                padding: 3rem;
                background: rgba(244, 244, 245, 0.8);
                backdrop-filter: blur(10px);
            }
            h1 { font-size: 3rem; }
            .visual-stage { height: 60vh; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">Sanitarius.</div>
        <nav class="nav-links">
            <span>Collection</span>
            <span>Technology</span>
            <span>Configure</span>
        </nav>
    </header>

    <main>
        <!-- Visual Stage -->
        <div class="visual-stage">
            <div class="svg-container" id="toiletSvg">
                <!-- Inline SVG Illustration -->
                <svg viewBox="0 0 800 800" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <!-- Critique Point 1: Multi-stop linear gradient for ceramic curvature -->
                        <linearGradient id="gradCeramBody" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#FFFFFF" /> <!-- Highlight -->
                            <stop offset="30%" stop-color="#F9F9F9" />
                            <stop offset="80%" stop-color="#EAEAEA" /> <!-- Midtone -->
                            <stop offset="100%" stop-color="#D1D1D1" /> <!-- Shadow -->
                        </linearGradient>

                        <!-- Water Gradient -->
                        <radialGradient id="gradWater" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
                            <stop offset="40%" stop-color="#E1F0FA" stop-opacity="0.8" />
                            <stop offset="100%" stop-color="#4A90E2" stop-opacity="0.9" />
                        </radialGradient>

                        <!-- Critique Point 4: Darker Chrome for Handle Contrast -->
                        <linearGradient id="gradChrome" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="50%" stop-color="#999999" />
                            <stop offset="100%" stop-color="#444444" />
                        </linearGradient>

                        <!-- Floor Shadow Blur -->
                        <filter id="blurShadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="15" />
                        </filter>

                        <!-- Inner Glow for Flushing -->
                        <filter id="innerGlow">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
                            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                        </filter>
                    </defs>

                    <!-- Floor Shadow -->
                    <ellipse cx="400" cy="755" rx="230" ry="40" fill="rgba(0,0,0,0.12)" filter="url(#blurShadow)" />

                    <!-- Critique Point 3: Refined Plumbing Base (Floor Flange) -->
                    <g id="plumbing">
                        <!-- Flange Base -->
                        <path d="M360 730 L440 730 L440 740 L360 740 Z" fill="#B0B0B0" />
                        <!-- Flange Top Shadow -->
                        <path d="M360 730 L440 730 L440 732 L360 732 Z" fill="#000" opacity="0.2"/>
                        <!-- Pipe Connection (Subtle) -->
                        <rect x="385" y="710" width="30" height="25" fill="#222" rx="2" />
                        <!-- Wall Pipe Stub -->
                        <rect x="385" y="600" width="30" height="120" fill="#D0D0D0" />
                        <rect x="385" y="600" width="5" height="120" fill="#FFF" opacity="0.5"/>
                    </g>

                    <!-- TANK -->
                    <g id="tank">
                        <!-- Tank Body -->
                        <path d="M280 200 Q280 180 300 180 L500 180 Q520 180 520 200 L520 450 Q520 470 500 470 L300 470 Q280 470 280 450 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Tank Top Lid -->
                        <path d="M275 195 L525 195 L520 180 Q500 170 480 170 L320 170 Q300 170 280 180 Z" fill="#FFFFFF" />
                        
                        <!-- Critique Point 1: Sharp Specular Highlight -->
                        <path d="M285 200 L285 450 Q285 465 300 465 L302 465 Q288 465 288 450 L288 200 Q288 185 302 185 L300 180 Q288 180 285 200 Z" fill="#FFFFFF" opacity="0.9"/>
                    </g>

                    <!-- BOWL BODY -->
                    <g id="bowl">
                        <!-- Main Bowl Shape -->
                        <path d="M230 430 L570 430 Q570 660 400 690 Q230 660 230 430 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Bowl Front Curve Highlight -->
                        <path d="M230 430 Q400 480 570 430 L560 520 Q400 570 240 520 Z" fill="#FFFFFF" opacity="0.5" />
                        
                        <!-- Bowl Rim (Top) -->
                        <ellipse cx="400" cy="430" rx="170" ry="48" fill="url(#gradCeramBody)" />
                        <!-- Rim Inner Edge Shadow -->
                        <ellipse cx="400" cy="430" rx="170" ry="48" fill="none" stroke="#D0D0D0" stroke-width="1" opacity="0.6"/>
                        
                        <!-- Bowl Inner Hole -->
                        <ellipse cx="400" cy="430" rx="135" ry="38" fill="#C0C0C0" />
                        
                        <!-- Water Surface -->
                        <ellipse class="water-surface" cx="400" cy="432" rx="125" ry="33" fill="url(#gradWater)" />
                        
                        <!-- Water Depth Shadow -->
                        <path d="M275 432 Q400 475 525 432 Q400 455 275 432 Z" fill="#3D85C6" opacity="0.3" />

                        <!-- Critique Point 2: Fluid Vector Vortex (Hidden initially) -->
                        <g class="swirl" opacity="0" style="transform-origin: 400px 432px;">
                            <path d="M350 432 C350 390 450 390 450 432 C450 470 350 470 350 432" stroke="#FFF" stroke-width="4" fill="none" filter="url(#innerGlow)" stroke-linecap="round"/>
                            <path d="M370 432 C370 405 430 405 430 432 C430 455 370 455 370 432" stroke="#E1F0FA" stroke-width="2" fill="none" stroke-linecap="round"/>
                        </g>
                    </g>

                    <!-- SEAT & LID -->
                    <g id="lid-seat">
                        <!-- Lid (Open/Vertical) -->
                        <path d="M235 410 Q400 465 565 410 L560 210 Q400 170 240 210 Z" fill="#FFFFFF" />
                        <!-- Lid Thickness Edge -->
                        <path d="M235 410 Q400 465 565 410 L563 415 Q400 470 237 415 Z" fill="#E0E0E0" />
                        
                        <!-- Seat (Horizontal) -->
                        <ellipse cx="400" cy="430" rx="150" ry="40" fill="none" stroke="#FFFFFF" stroke-width="16" />
                        <!-- Seat Shadow on Bowl -->
                        <ellipse cx="400" cy="445" rx="135" ry="28" fill="rgba(0,0,0,0.04)" />
                    </g>

                    <!-- FLUSH HANDLE (High Contrast) -->
                    <g id="handle-group" style="transform-origin: 520px 320px;">
                        <!-- Handle Base Plate -->
                        <rect x="515" y="300" width="12" height="40" rx="4" fill="url(#gradChrome)" />
                        <!-- Lever Arm -->
                        <path class="handle-lever" d="M515 315 L555 315 L555 325 L515 325 Z" fill="url(#gradChrome)" />
                        <!-- Lever Grip -->
                        <rect x="550" y="310" width="8" height="20" rx="2" fill="#333" />
                    </g>

                </svg>

                <!-- Invisible Interaction Zone -->
                <div class="flush-trigger-zone" id="flushBtn" title="Flush"></div>
            </div>
        </div>

        <!-- Info Panel -->
        <div class="info-panel">
            <h1>The<br>Architect<br>Series.</h1>
            <p class="tagline">
                Precision-engineered ceramic with a 360-degree silent close mechanism. 
                Experience the hydraulic perfection of the dual-action siphon.
            </p>

            <div class="specs">
                <div class="spec-item">
                    <h3>Efficiency</h3>
                    <p>4.8 / 1.6L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vit. China</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Gloss White</p>
                </div>
                <div class="spec-item">
                    <h3>Action</h3>
                    <p>Siphon Jet</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const flushBtn = document.getElementById('flushBtn');
            const handleGroup = document.getElementById('handle-group');
            const svgContainer = document.getElementById('toiletSvg');
            const waterSurface = document.querySelector('.water-surface');
            const swirl = document.querySelector('.swirl');
            const svg = document.querySelector('svg');

            // Function to create water particles
            function createSplash() {
                const ns = "http://www.w3.org/2000/svg";
                
                // Create particles
                for(let i=0; i<15; i++) {
                    const drop = document.createElementNS(ns, "circle");
                    const startX = 400 + (Math.random() * 80 - 40);
                    const startY = 432;
                    
                    drop.setAttribute("cx", startX);
                    drop.setAttribute("cy", startY);
                    drop.setAttribute("r", Math.random() * 3 + 1);
                    drop.setAttribute("fill", "#A9D2F5");
                    drop.style.opacity = 0;
                    
                    svg.appendChild(drop);
                    
                    // Animate using Web Animations API
                    const animation = drop.animate([
                        { transform: `translate(0, 0) scale(0)`, opacity: 0 },
                        { opacity: 1, transform: `translate(0, -20px) scale(1)`, offset: 0.2 },
                        { transform: `translate(${Math.random()*40-20}px, ${Math.random()*60 + 40}px) scale(0.5)`, opacity: 0 }
                    ], {
                        duration: 600 + Math.random() * 300,
                        easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                    });

                    animation.onfinish = () => drop.remove();
                }
            }

            flushBtn.addEventListener('click', () => {
                // 1. Move Handle
                handleGroup.style.transition = "transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1)";
                handleGroup.style.transform = "rotate(25deg)";

                setTimeout(() => {
                    handleGroup.style.transition = "transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)";
                    handleGroup.style.transform = "rotate(0deg)";
                }, 200);

                // 2. Trigger Water Effect
                createSplash();
                
                // 3. Bowl swirl animation (Critique Point 2)
                swirl.style.opacity = "1";
                swirl.style.transition = "none"; // Reset transition
                swirl.style.animation = "swirlVortex 1.5s ease-in-out forwards";
                
                // 4. Water level dip visual trick
                waterSurface.style.transition = "cy 0.6s cubic-bezier(0.4, 0, 0.2, 1)";
                waterSurface.setAttribute("cy", "445"); // Move down
                
                setTimeout(() => {
                    waterSurface.setAttribute("cy", "432"); // Return
                }, 1200);
            });

            // Subtle parallax on mouse move for dimensionality
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth - e.pageX * 2) / 150;
                const y = (window.innerHeight - e.pageY * 2) / 150;

                const lid = document.getElementById('lid-seat');
                lid.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
</body>
</html>
