<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Architect Series | Premium Sanitaryware</title>
    <style>
        :root {
            /* Palette: Sophisticated, Clean, Architectural */
            --bg-wall: #F2F2F2;
            --text-main: #1A1A1A;
            --text-muted: #666666;
            --chrome-light: #FFFFFF;
            --chrome-mid: #C4C4C4;
            --chrome-dark: #8A8A8A;
            --water-cyan: #E0F4FF;
            --water-deep: #BDE0FE;
            --water-vortex: #00A8E8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Critique Point 3: Reduced opacity grid (5%) */
            background-color: var(--bg-wall);
            background-image: 
                linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            color: var(--text-main);
            /* Critique Point 6: Unified Geometric Sans */
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* --- UI Layer --- */
        header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            position: relative;
        }

        .brand {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .nav-links span {
            margin-left: 2rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-links span:hover {
            color: var(--text-main);
        }

        /* --- Main Stage --- */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 55% 45%;
            position: relative;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
            align-items: center;
        }

        /* Left: The Visual */
        .visual-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            /* Critique Point 3: Spotlight effect */
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.9) 0%, rgba(242,242,242,0) 70%);
        }

        .svg-container {
            width: 95%; /* Critique Point 2: Scaled up */
            height: 90%;
            position: relative;
            filter: drop-shadow(0px 50px 70px rgba(0,0,0,0.12));
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Right: The Copy */
        .info-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem 5rem;
            z-index: 5;
            border-left: 1px solid rgba(0,0,0,0.06);
        }

        /* Critique Point 2 & 6: Typography Hierarchy */
        h1 {
            font-size: 3.8rem; /* Reduced size */
            font-weight: 400; /* Reduced weight */
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 2rem;
            color: var(--text-main);
        }

        .tagline {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 400px;
            margin-bottom: 4rem;
            font-weight: 400;
        }

        .specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            margin-top: auto;
        }

        .spec-item h3 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #999;
            margin-bottom: 0.5rem;
            /* Critique Point 6: Increased weight */
            font-weight: 600; 
        }

        .spec-item p {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: -0.01em;
            color: var(--text-main);
        }

        /* --- Interaction --- */
        /* Adjusted coordinates for the larger handle */
        .flush-trigger-zone {
            position: absolute;
            top: 35%;
            left: 83%;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 20;
        }
        
        /* --- Animations --- */
        /* Critique Point 5: Dynamic Swirl */
        @keyframes swirlVortex {
            0% { transform: rotate(0deg) scale(0.5); opacity: 0; }
            20% { opacity: 0.9; }
            60% { transform: rotate(360deg) scale(1.1); opacity: 0.8; }
            100% { transform: rotate(720deg) scale(0.5); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
                grid-template-rows: 1.2fr 1fr;
            }
            .info-panel {
                border-left: none;
                border-top: 1px solid rgba(0,0,0,0.06);
                padding: 2rem;
                background: rgba(242, 242, 242, 0.9);
                backdrop-filter: blur(10px);
            }
            h1 { font-size: 3rem; }
            .visual-stage { height: 50vh; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">Sanitarius.</div>
        <nav class="nav-links">
            <span>Collection</span>
            <span>Technology</span>
            <span>Configure</span>
        </nav>
    </header>

    <main>
        <!-- Visual Stage -->
        <div class="visual-stage">
            <div class="svg-container" id="toiletSvg">
                <!-- Inline SVG Illustration -->
                <svg viewBox="0 0 900 800" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <!-- Critique Point 1: High-gloss Vitreous China Gradient -->
                        <linearGradient id="gradCeramBody" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#FFFFFF" /> 
                            <stop offset="20%" stop-color="#F8F8F8" />
                            <stop offset="70%" stop-color="#E0E0E0" /> 
                            <stop offset="100%" stop-color="#C8C8C8" /> 
                        </linearGradient>

                        <!-- Chrome Gradient -->
                        <linearGradient id="gradChrome" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="50%" stop-color="#E0E0E0" />
                            <stop offset="100%" stop-color="#A0A0A0" />
                        </linearGradient>

                        <!-- Floor Shadow Blur -->
                        <filter id="blurShadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="20" />
                        </filter>
                    </defs>

                    <!-- Floor Shadow -->
                    <ellipse cx="450" cy="740" rx="240" ry="45" fill="rgba(0,0,0,0.1)" filter="url(#blurShadow)" />

                    <!-- Plumbing Base -->
                    <g id="plumbing">
                        <rect x="420" y="680" width="40" height="60" fill="#B0B0B0" />
                        <rect x="425" y="680" width="10" height="60" fill="#FFF" opacity="0.4" />
                        <path d="M380 730 L520 730 L530 745 L370 745 Z" fill="url(#gradChrome)" />
                        <path d="M380 730 L520 730 L520 733 L380 733 Z" fill="#000" opacity="0.2"/>
                        <ellipse cx="450" cy="730" rx="140" ry="25" fill="url(#gradCeramBody)" />
                        <ellipse cx="450" cy="730" rx="130" ry="22" fill="none" stroke="#FFF" stroke-width="1" opacity="0.5"/>
                    </g>

                    <!-- TANK -->
                    <g id="tank">
                        <!-- Tank Body -->
                        <path d="M310 180 Q310 150 340 150 L560 150 Q590 150 590 180 L590 460 Q590 490 560 490 L340 490 Q310 490 310 460 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Tank Top Lid -->
                        <path d="M305 165 L595 165 L590 150 Q560 140 540 140 L360 140 Q340 140 310 150 Z" fill="#FFFFFF" />
                        
                        <!-- Critique Point 1: Sharp Specular Highlights -->
                        <!-- Left Edge Highlight -->
                        <path d="M315 180 L315 460 Q315 485 340 485 L345 485 Q320 485 320 460 L320 180 Q320 155 345 155 L340 150 Q315 150 315 180 Z" fill="#FFFFFF" opacity="0.9"/>
                        
                        <!-- Right Edge Highlight (Soft) -->
                        <path d="M585 180 L585 460 Q585 485 560 485 L555 485 Q580 485 580 460 L580 180 Q580 155 555 155 L560 150 Q585 150 585 180 Z" fill="#FFFFFF" opacity="0.4"/>
                    </g>

                    <!-- BOWL BODY -->
                    <g id="bowl">
                        <!-- Main Bowl Shape -->
                        <path d="M250 440 L650 440 Q650 680 450 720 Q250 680 250 440 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Bowl Front Curve Highlight -->
                        <path d="M250 440 Q450 500 650 440 L640 540 Q450 600 260 540 Z" fill="#FFFFFF" opacity="0.6" />
                        
                        <!-- Bowl Rim (Top) -->
                        <ellipse cx="450" cy="440" rx="200" ry="55" fill="url(#gradCeramBody)" />
                        <!-- Rim Inner Edge Shadow -->
                        <ellipse cx="450" cy="440" rx="200" ry="55" fill="none" stroke="#D0D0D0" stroke-width="2" opacity="0.5"/>
                        
                        <!-- Bowl Inner Hole (Water Area) -->
                        <ellipse cx="450" cy="440" rx="160" ry="45" fill="#EAEAEA" />
                        
                        <!-- Water Surface -->
                        <ellipse class="water-surface" cx="450" cy="442" rx="150" ry="40" fill="var(--water-cyan)" opacity="0.9" />
                        
                        <!-- Water Depth Shadow -->
                        <path d="M300 442 Q450 485 600 442 Q450 465 300 442 Z" fill="var(--water-deep)" opacity="0.6" />

                        <!-- Critique Point 5: Stylized Blue Vortex -->
                        <g class="swirl" opacity="0" style="transform-origin: 450px 440px;">
                            <!-- Outer swirl -->
                            <path d="M380 440 C380 390 520 390 520 440 C520 490 380 490 380 440" stroke="var(--water-vortex)" stroke-width="4" fill="none" stroke-linecap="round"/>
                            <!-- Inner swirl -->
                            <path d="M400 440 C400 405 500 405 500 440 C500 470 400 470 400 440" stroke="var(--water-vortex)" stroke-width="3" fill="none" stroke-linecap="round"/>
                        </g>
                    </g>

                    <!-- SEAT & LID -->
                    <g id="lid-seat">
                        <!-- Lid (Open/Vertical) -->
                        <path d="M255 420 Q450 480 645 420 L635 200 Q450 160 265 200 Z" fill="#FFFFFF" />
                        <!-- Lid Thickness Edge -->
                        <path d="M255 420 Q450 480 645 420 L643 425 Q450 485 257 425 Z" fill="#E0E0E0" />
                        
                        <!-- Seat (Horizontal) -->
                        <ellipse cx="450" cy="440" rx="175" ry="48" fill="none" stroke="#FFFFFF" stroke-width="20" />
                        <!-- Seat Shadow on Bowl -->
                        <ellipse cx="450" cy="458" rx="155" ry="35" fill="rgba(0,0,0,0.03)" />
                    </g>

                    <!-- Critique Point 5: Redesigned Flush Handle (Larger, Chrome, Shadow) -->
                    <g id="handle-group" style="transform-origin: 605px 320px; filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.3));">
                        <!-- Handle Base Plate -->
                        <rect x="595" y="300" width="20" height="50" rx="6" fill="url(#gradChrome)" />
                        
                        <!-- Lever Arm (Wider) -->
                        <path class="handle-lever" d="M595 320 L645 320 L645 335 L595 335 Z" fill="url(#gradChrome)" />
                        
                        <!-- Lever Grip -->
                        <rect x="640" y="315" width="12" height="25" rx="4" fill="#222" />
                        
                        <!-- Handle Highlight -->
                        <rect x="598" y="303" width="3" height="44" rx="1" fill="#FFF" opacity="0.9"/>
                    </g>

                </svg>

                <!-- Invisible Interaction Zone -->
                <div class="flush-trigger-zone" id="flushBtn" title="Flush"></div>
            </div>
        </div>

        <!-- Info Panel -->
        <div class="info-panel">
            <h1>The<br>Architect<br>Series.</h1>
            <p class="tagline">
                Precision-engineered ceramic with a 360-degree silent close mechanism. 
                Experience the hydraulic perfection of the dual-action siphon.
            </p>

            <div class="specs">
                <div class="spec-item">
                    <h3>Efficiency</h3>
                    <p>4.8 / 1.6L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vit. China</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Gloss White</p>
                </div>
                <div class="spec-item">
                    <h3>Action</h3>
                    <p>Siphon Jet</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const flushBtn = document.getElementById('flushBtn');
            const handleGroup = document.getElementById('handle-group');
            const waterSurface = document.querySelector('.water-surface');
            const swirl = document.querySelector('.swirl');
            const svg = document.querySelector('svg');

            // Function to create water particles
            function createSplash() {
                const ns = "http://www.w3.org/2000/svg";
                
                // Create particles
                for(let i=0; i<20; i++) {
                    const drop = document.createElementNS(ns, "circle");
                    // Center of bowl
                    const startX = 450 + (Math.random() * 100 - 50);
                    const startY = 440;
                    
                    drop.setAttribute("cx", startX);
                    drop.setAttribute("cy", startY);
                    drop.setAttribute("r", Math.random() * 2.5 + 1);
                    drop.setAttribute("fill", "#FFFFFF");
                    drop.style.opacity = 0;
                    
                    svg.appendChild(drop);
                    
                    // Animate using Web Animations API
                    const animation = drop.animate([
                        { transform: `translate(0, 0) scale(0)`, opacity: 0 },
                        { opacity: 0.8, transform: `translate(0, -30px) scale(1)`, offset: 0.2 },
                        { transform: `translate(${Math.random()*60-30}px, ${Math.random()*80 + 50}px) scale(0.5)`, opacity: 0 }
                    ], {
                        duration: 700 + Math.random() * 300,
                        easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                    });

                    animation.onfinish = () => drop.remove();
                }
            }

            flushBtn.addEventListener('click', () => {
                // 1. Move Handle
                handleGroup.style.transition = "transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1)";
                handleGroup.style.transform = "rotate(25deg)";

                setTimeout(() => {
                    handleGroup.style.transition = "transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)";
                    handleGroup.style.transform = "rotate(0deg)";
                }, 200);

                // 2. Trigger Water Effect
                createSplash();
                
                // 3. Bowl swirl animation
                swirl.style.opacity = "1";
                swirl.style.transition = "none"; 
                swirl.style.animation = "swirlVortex 1.2s ease-in-out forwards";
                
                // 4. Water level dip visual trick
                waterSurface.style.transition = "transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)";
                waterSurface.style.transformOrigin = "450px 440px";
                waterSurface.style.transform = "scale(0.92)";
                
                setTimeout(() => {
                    waterSurface.style.transform = "scale(1)";
                }, 1200);
            });

            // Subtle parallax on mouse move for dimensionality
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth - e.pageX * 2) / 150;
                const y = (window.innerHeight - e.pageY * 2) / 150;

                const lid = document.getElementById('lid-seat');
                // Apply transform safely
                if(lid) {
                    lid.style.transform = `translate(${x}px, ${y}px)`;
                    lid.style.transition = 'transform 0.1s ease-out';
                }
            });
        });
    </script>
</body>
</html>
