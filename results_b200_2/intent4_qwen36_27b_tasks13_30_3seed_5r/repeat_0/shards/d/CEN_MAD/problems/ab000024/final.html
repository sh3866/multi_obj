<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Architect Series | Premium Sanitaryware</title>
    <style>
        :root {
            /* Palette: Warm, Architectural, Realistic */
            --bg-wall: #F5F5F7;
            --bg-floor: #EBEBEB;
            --text-main: #1D1D1F;
            --text-muted: #86868B;
            --chrome-light: #FFFFFF;
            --chrome-mid: #D1D1D6;
            --chrome-dark: #8E8E93;
            --water-surface: #E5F1FB;
            --water-depth: #D0E3F3;
            --water-vortex: #007AFF; /* Apple Blue */
            --shadow-color: rgba(0, 0, 0, 0.08);
            --shadow-heavy: rgba(0, 0, 0, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-wall);
            /* Critique 2: Subtle Tile Texture */
            background-image: 
                linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-main);
            /* Critique 5: Clean System Font */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* --- UI Layer --- */
        header {
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            position: relative;
        }

        .brand {
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand::before {
            content: '';
            display: block;
            width: 8px;
            height: 8px;
            background: var(--text-main);
            border-radius: 2px;
        }

        .nav-links span {
            margin-left: 2.5rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .nav-links span:hover {
            color: var(--text-main);
        }

        /* --- Main Stage --- */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 55% 45%;
            position: relative;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            align-items: center;
            padding-bottom: 2rem; /* Floor offset */
        }

        /* Left: The Visual */
        .visual-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Ground the object */
            height: 100%;
            padding-bottom: 20px;
        }

        .svg-container {
            width: 100%;
            height: 100%;
            position: relative;
            /* Critique 4: Stronger Drop Shadow */
            filter: drop-shadow(0px 40px 60px var(--shadow-heavy));
        }

        /* Right: The Copy */
        .info-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 4rem;
            z-index: 5;
            /* Critique 5: Vertical Rhythm Alignment */
            height: 100%;
        }

        /* Critique 5: Typography Hierarchy */
        h1 {
            font-size: 4.5rem;
            font-weight: 300; /* Lighter weight, larger size */
            line-height: 1.05;
            letter-spacing: -0.03em;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        .tagline {
            font-size: 1.15rem;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 420px;
            margin-bottom: 4rem;
            font-weight: 400;
        }

        .specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            margin-top: auto;
            border-top: 1px solid rgba(0,0,0,0.08);
            padding-top: 2rem;
        }

        .spec-item h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #999;
            margin-bottom: 0.5rem;
            font-weight: 600; 
        }

        .spec-item p {
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: var(--text-main);
        }

        /* --- Interaction --- */
        .flush-trigger-zone {
            position: absolute;
            top: 30%;
            left: 80%;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 20;
            /* Debug border for testing: border: 1px solid red; */
        }

        /* --- Animations --- */
        @keyframes swirlVortex {
            0% { transform: rotate(0deg) scale(0.5); opacity: 0; }
            20% { opacity: 0.8; }
            60% { transform: rotate(360deg) scale(1.2); opacity: 0.6; }
            100% { transform: rotate(720deg) scale(0.5); opacity: 0; }
        }

        @keyframes waterDip {
            0% { transform: scale(1); }
            30% { transform: scale(0.95) translateY(5px); }
            100% { transform: scale(1); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
            }
            .visual-stage { height: 50vh; align-items: center; }
            .info-panel {
                border-left: none;
                border-top: 1px solid rgba(0,0,0,0.06);
                padding: 2rem;
                background: rgba(245, 245, 247, 0.95);
                backdrop-filter: blur(10px);
                height: auto;
            }
            h1 { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">Sanitarius.</div>
        <nav class="nav-links">
            <span>Collection</span>
            <span>Technology</span>
            <span>Configure</span>
        </nav>
    </header>

    <main>
        <!-- Visual Stage -->
        <div class="visual-stage">
            <div class="svg-container" id="toiletSvg">
                <!-- Inline SVG Illustration -->
                <svg viewBox="0 0 900 800" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <!-- Critique 1: High-Realism Porcelain Gradient (White to Soft Grey) -->
                        <linearGradient id="gradCeramBody" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#FFFFFF" /> 
                            <stop offset="15%" stop-color="#FDFDFD" />
                            <stop offset="60%" stop-color="#EAEAEA" /> 
                            <stop offset="100%" stop-color="#CFCFCF" /> 
                        </linearGradient>

                        <!-- Chrome/Metal Gradient -->
                        <linearGradient id="gradChrome" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="30%" stop-color="#E5E5E5" />
                            <stop offset="100%" stop-color="#9A9A9A" />
                        </linearGradient>

                        <!-- Floor Shadow Blur -->
                        <filter id="blurShadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="25" />
                        </filter>
                    </defs>

                    <!-- Floor Shadow -->
                    <ellipse cx="450" cy="755" rx="260" ry="50" fill="rgba(0,0,0,0.12)" filter="url(#blurShadow)" />

                    <!-- Plumbing Base (Floor Flange) -->
                    <g id="plumbing">
                        <!-- Base Connection -->
                        <rect x="430" y="690" width="40" height="70" fill="#A0A0A0" />
                        <rect x="435" y="690" width="10" height="70" fill="#FFF" opacity="0.3" />
                        
                        <!-- Floor Flange Plate -->
                        <path d="M380 745 L520 745 L530 760 L370 760 Z" fill="url(#gradChrome)" />
                        <path d="M380 745 L520 745 L520 748 L380 748 Z" fill="#000" opacity="0.1"/>
                        
                        <!-- Toilet Base Foot -->
                        <ellipse cx="450" cy="745" rx="150" ry="30" fill="url(#gradCeramBody)" />
                        <ellipse cx="450" cy="745" rx="140" ry="25" fill="none" stroke="#FFF" stroke-width="2" opacity="0.8"/>
                    </g>

                    <!-- TANK -->
                    <g id="tank">
                        <!-- Tank Body -->
                        <path d="M310 180 Q310 150 340 150 L560 150 Q590 150 590 180 L590 460 Q590 490 560 490 L340 490 Q310 490 310 460 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Tank Top Lid -->
                        <path d="M305 165 L595 165 L590 150 Q560 140 540 140 L360 140 Q340 140 310 150 Z" fill="#FFFFFF" />
                        
                        <!-- Critique 1: Sharp Specular Highlights -->
                        <!-- Left Edge Highlight (Strong) -->
                        <path d="M315 180 L315 460 Q315 485 340 485 L345 485 Q320 485 320 460 L320 180 Q320 155 345 155 L340 150 Q315 150 315 180 Z" fill="#FFFFFF" opacity="0.9"/>
                        
                        <!-- Right Edge Highlight (Soft) -->
                        <path d="M585 180 L585 460 Q585 485 560 485 L555 485 Q580 485 580 460 L580 180 Q580 155 555 155 L560 150 Q585 150 585 180 Z" fill="#FFFFFF" opacity="0.3"/>
                    </g>

                    <!-- BOWL BODY -->
                    <g id="bowl">
                        <!-- Main Bowl Shape -->
                        <path d="M250 440 L650 440 Q650 680 450 720 Q250 680 250 440 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Bowl Front Curve Highlight -->
                        <path d="M250 440 Q450 500 650 440 L640 540 Q450 600 260 540 Z" fill="#FFFFFF" opacity="0.5" />
                        
                        <!-- Bowl Rim (Top) -->
                        <ellipse cx="450" cy="440" rx="200" ry="55" fill="url(#gradCeramBody)" />
                        <!-- Rim Inner Edge Shadow -->
                        <ellipse cx="450" cy="440" rx="200" ry="55" fill="none" stroke="#D0D0D0" stroke-width="2" opacity="0.5"/>
                        
                        <!-- Bowl Inner Hole (Water Area) -->
                        <ellipse cx="450" cy="440" rx="160" ry="45" fill="#EAEAEA" />
                        
                        <!-- Water Surface -->
                        <ellipse class="water-surface" cx="450" cy="442" rx="150" ry="40" fill="var(--water-surface)" opacity="0.9" />
                        
                        <!-- Water Depth Shadow -->
                        <path d="M300 442 Q450 485 600 442 Q450 465 300 442 Z" fill="var(--water-depth)" opacity="0.6" />

                        <!-- Critique 3: Dynamic Vector Swirl -->
                        <g class="swirl" opacity="0" style="transform-origin: 450px 440px;">
                            <!-- Outer swirl -->
                            <path d="M380 440 C380 390 520 390 520 440 C520 490 380 490 380 440" stroke="var(--water-vortex)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8"/>
                            <!-- Inner swirl -->
                            <path d="M400 440 C400 405 500 405 500 440 C500 470 400 470 400 440" stroke="var(--water-vortex)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
                        </g>
                    </g>

                    <!-- SEAT & LID -->
                    <g id="lid-seat">
                        <!-- Lid (Open/Vertical) -->
                        <path d="M255 420 Q450 480 645 420 L635 200 Q450 160 265 200 Z" fill="#FFFFFF" />
                        <!-- Lid Thickness Edge -->
                        <path d="M255 420 Q450 480 645 420 L643 425 Q450 485 257 425 Z" fill="#E0E0E0" />
                        
                        <!-- Seat (Horizontal) -->
                        <ellipse cx="450" cy="440" rx="175" ry="48" fill="none" stroke="#FFFFFF" stroke-width="20" />
                        <!-- Seat Shadow on Bowl -->
                        <ellipse cx="450" cy="458" rx="155" ry="35" fill="rgba(0,0,0,0.04)" />
                    </g>

                    <!-- Flush Handle -->
                    <g id="handle-group" style="transform-origin: 605px 320px; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));">
                        <!-- Handle Base Plate -->
                        <rect x="595" y="300" width="20" height="50" rx="6" fill="url(#gradChrome)" />
                        
                        <!-- Lever Arm -->
                        <path class="handle-lever" d="M595 320 L645 320 L645 335 L595 335 Z" fill="url(#gradChrome)" />
                        
                        <!-- Lever Grip -->
                        <rect x="640" y="315" width="12" height="25" rx="4" fill="#333" />
                        
                        <!-- Handle Highlight -->
                        <rect x="598" y="303" width="3" height="44" rx="1" fill="#FFF" opacity="0.9"/>
                    </g>

                </svg>

                <!-- Invisible Interaction Zone -->
                <div class="flush-trigger-zone" id="flushBtn" title="Flush"></div>
            </div>
        </div>

        <!-- Info Panel -->
        <div class="info-panel">
            <h1>The<br>Architect<br>Series.</h1>
            <p class="tagline">
                Precision-engineered ceramic with a 360-degree silent close mechanism. 
                Experience the hydraulic perfection of the dual-action siphon.
            </p>

            <div class="specs">
                <div class="spec-item">
                    <h3>Efficiency</h3>
                    <p>4.8 / 1.6L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vit. China</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Gloss White</p>
                </div>
                <div class="spec-item">
                    <h3>Action</h3>
                    <p>Siphon Jet</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const flushBtn = document.getElementById('flushBtn');
            const handleGroup = document.getElementById('handle-group');
            const waterSurface = document.querySelector('.water-surface');
            const swirl = document.querySelector('.swirl');
            const svg = document.querySelector('svg');

            // Function to create water particles
            function createSplash() {
                const ns = "http://www.w3.org/2000/svg";
                
                // Create particles
                for(let i=0; i<25; i++) {
                    const drop = document.createElementNS(ns, "circle");
                    // Center of bowl
                    const startX = 450 + (Math.random() * 100 - 50);
                    const startY = 440;
                    
                    drop.setAttribute("cx", startX);
                    drop.setAttribute("cy", startY);
                    drop.setAttribute("r", Math.random() * 2.5 + 1);
                    drop.setAttribute("fill", "#FFFFFF");
                    drop.style.opacity = 0;
                    
                    svg.appendChild(drop);
                    
                    // Animate using Web Animations API
                    const animation = drop.animate([
                        { transform: `translate(0, 0) scale(0)`, opacity: 0 },
                        { opacity: 0.9, transform: `translate(0, -40px) scale(1)`, offset: 0.2 },
                        { transform: `translate(${Math.random()*80-40}px, ${Math.random()*100 + 60}px) scale(0.5)`, opacity: 0 }
                    ], {
                        duration: 800 + Math.random() * 400,
                        easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                    });

                    animation.onfinish = () => drop.remove();
                }
            }

            flushBtn.addEventListener('click', () => {
                // 1. Move Handle
                handleGroup.style.transition = "transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1)";
                handleGroup.style.transform = "rotate(25deg)";

                setTimeout(() => {
                    handleGroup.style.transition = "transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)";
                    handleGroup.style.transform = "rotate(0deg)";
                }, 200);

                // 2. Trigger Water Effect
                createSplash();
                
                // 3. Bowl swirl animation
                swirl.style.opacity = "1";
                swirl.style.transition = "none"; 
                swirl.style.animation = "swirlVortex 1.2s ease-in-out forwards";
                
                // 4. Water level dip visual trick
                waterSurface.style.transition = "transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)";
                waterSurface.style.transformOrigin = "450px 440px";
                waterSurface.style.animation = "waterDip 1.5s ease-in-out";
            });

            // Subtle parallax on mouse move for dimensionality
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth - e.pageX * 2) / 150;
                const y = (window.innerHeight - e.pageY * 2) / 150;

                const lid = document.getElementById('lid-seat');
                // Apply transform safely
                if(lid) {
                    lid.style.transform = `translate(${x}px, ${y}px)`;
                    lid.style.transition = 'transform 0.1s ease-out';
                }
            });
        });
    </script>
</body>
</html>
