<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Architect Series | Premium Sanitaryware</title>
    <style>
        :root {
            --bg: #F0F0F0;
            --bg-texture: #EAEAEA;
            --text-main: #111111;
            --text-muted: #555555;
            --accent: #0066FF;
            --shadow: rgba(0, 0, 0, 0.1);
            --ceramic-highlight: #FFFFFF;
            --ceramic-shadow: #D1D1D1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            /* Architectural Grid Background */
            background-image: 
                linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* --- UI Layer --- */
        header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            mix-blend-mode: multiply;
        }

        .brand {
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .nav-links span {
            margin-left: 2rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-links span:hover {
            color: var(--text-main);
        }

        /* --- Main Stage --- */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 60% 40%;
            position: relative;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* Left: The Visual */
        .visual-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Floor plane simulation */
            background: radial-gradient(circle at 50% 80%, rgba(255,255,255,0.8) 0%, rgba(0,0,0,0.02) 70%);
        }

        .svg-container {
            width: 90%;
            height: 90%;
            position: relative;
            /* Drop shadow for the whole object to ground it */
            filter: drop-shadow(0px 20px 30px rgba(0,0,0,0.15));
        }

        /* Right: The Copy */
        .info-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 6rem 4rem;
            z-index: 5;
            border-left: 1px solid rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 4rem;
            line-height: 0.95;
            letter-spacing: -0.04em; /* Tight tracking for premium feel */
            margin-bottom: 2rem;
            color: var(--text-main);
            font-weight: 700;
        }

        .tagline {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 380px;
            margin-bottom: 4rem;
            font-weight: 400; /* Regular weight */
        }

        .specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            margin-top: auto;
        }

        .spec-item h3 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #888;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        .spec-item p {
            font-size: 1.25rem;
            font-weight: 500; /* Medium weight for legibility */
            letter-spacing: -0.01em;
            color: var(--text-main);
        }

        /* --- Interaction --- */
        .flush-trigger-zone {
            position: absolute;
            top: 38%; /* Aligned with handle */
            left: 76%;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 20;
            /* border: 1px solid rgba(0,0,0,0.1); Debugging */
        }

        /* Hover state for the whole SVG to hint interactivity */
        .svg-container:hover .handle-lever {
            filter: brightness(0.95);
        }

        /* --- Animations --- */
        @keyframes swirlMotion {
            0% { transform: rotate(0deg) scale(1); opacity: 0.3; }
            50% { transform: rotate(180deg) scale(1.2); opacity: 0.8; }
            100% { transform: rotate(360deg) scale(1); opacity: 0.3; }
        }

        @keyframes waterDrop {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 1; }
            80% { opacity: 1; transform: translateY(40px) scale(1); }
            100% { transform: translateY(50px) scale(1.5); opacity: 0; }
        }

        .water-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #A9D2F5;
            border-radius: 50%;
            pointer-events: none;
        }

        /* SVG Gradients */
        .grad-ceramic { stop-color: #FFFFFF; }
        .grad-ceramic-mid { stop-color: #F5F5F5; }
        .grad-ceramic-shadow { stop-color: #D8D8D8; }
        
        .grad-chrome { stop-color: #FFFFFF; }
        .grad-chrome-dark { stop-color: #B8B8B8; }

        /* Responsive */
        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
            }
            .info-panel {
                border-left: none;
                border-top: 1px solid rgba(0,0,0,0.05);
                padding: 3rem;
                background: rgba(255,255,255,0.5);
                backdrop-filter: blur(10px);
            }
            h1 { font-size: 3rem; }
            .visual-stage { height: 60vh; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">Sanitarius.</div>
        <nav class="nav-links">
            <span>Collection</span>
            <span>Technology</span>
            <span>Configure</span>
        </nav>
    </header>

    <main>
        <!-- Visual Stage -->
        <div class="visual-stage">
            <div class="svg-container" id="toiletSvg">
                <!-- Inline SVG Illustration -->
                <svg viewBox="0 0 800 800" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <!-- 1. Ceramic Material (Cool Grey to White for Volume) -->
                        <linearGradient id="gradCeramBody" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="25%" stop-color="#FFFFFF" />
                            <stop offset="85%" stop-color="#E8E8E8" />
                            <stop offset="100%" stop-color="#D0D0D0" />
                        </linearGradient>

                        <!-- 2. Water Material (Deep Blue Gradient) -->
                        <radialGradient id="gradWater" cx="50%" cy="50%" r="50%" fx="40%" fy="40%">
                            <stop offset="0%" stop-color="#E1F0FA" stop-opacity="0.8" />
                            <stop offset="60%" stop-color="#A9D2F5" stop-opacity="0.9" />
                            <stop offset="100%" stop-color="#4A90E2" />
                        </radialGradient>

                        <!-- 3. Chrome/Plastic Handle -->
                        <linearGradient id="gradChrome" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="50%" stop-color="#E0E0E0" />
                            <stop offset="100%" stop-color="#A0A0A0" />
                        </linearGradient>

                        <!-- 4. Floor Shadow Blur -->
                        <filter id="blurShadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="12" />
                        </filter>

                        <!-- 5. Inner Glow for Flushing -->
                        <filter id="innerGlow">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
                            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                        </filter>
                    </defs>

                    <!-- Floor Shadow (Grounding the composition) -->
                    <ellipse cx="400" cy="760" rx="220" ry="35" fill="rgba(0,0,0,0.08)" filter="url(#blurShadow)" />

                    <!-- PLUMBING BASE (Visible) -->
                    <g id="plumbing">
                        <!-- Main pipe connection -->
                        <path d="M380 700 L420 700 L420 760 L380 760 Z" fill="#1A1A1A" opacity="0.9"/>
                        <!-- Flange/Base detail -->
                        <path d="M370 700 L430 700 L430 710 L370 710 Z" fill="#000" opacity="0.5"/>
                        <!-- Subtle pipe reflection -->
                        <path d="M385 700 L390 700 L390 760 L385 760 Z" fill="#FFFFFF" opacity="0.1"/>
                    </g>

                    <!-- TANK (Back) -->
                    <g id="tank">
                        <!-- Tank Body -->
                        <path d="M280 200 Q280 180 300 180 L500 180 Q520 180 520 200 L520 450 Q520 470 500 470 L300 470 Q280 470 280 450 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Tank Top Lid (Flat) -->
                        <path d="M275 195 L525 195 L520 180 Q500 170 480 170 L320 170 Q300 170 280 180 Z" fill="#FFFFFF" />
                        
                        <!-- Specular Highlight (Top Left Edge) -->
                        <path d="M285 200 L285 450 Q285 465 300 465 L305 465 Q290 465 290 450 L290 200 Q290 185 305 185 L305 180 Q290 180 285 200 Z" fill="#FFFFFF" opacity="0.8"/>
                    </g>

                    <!-- BOWL BODY -->
                    <g id="bowl">
                        <!-- Main Bowl Shape (Wider than tank) -->
                        <path d="M240 430 L560 430 Q560 650 400 680 Q240 650 240 430 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Bowl Front Curve Highlight (Volume) -->
                        <path d="M240 430 Q400 480 560 430 L550 500 Q400 550 250 500 Z" fill="#FFFFFF" opacity="0.6" />
                        
                        <!-- Bowl Rim (Top) -->
                        <ellipse cx="400" cy="430" rx="160" ry="45" fill="url(#gradCeramBody)" />
                        <!-- Rim Inner Edge Shadow -->
                        <ellipse cx="400" cy="430" rx="160" ry="45" fill="none" stroke="#D0D0D0" stroke-width="2" opacity="0.5"/>
                        
                        <!-- Bowl Inner Hole (Dark depth) -->
                        <ellipse cx="400" cy="430" rx="130" ry="35" fill="#C0C0C0" />
                        
                        <!-- Water Surface -->
                        <ellipse class="water-surface" cx="400" cy="432" rx="120" ry="30" fill="url(#gradWater)" />
                        
                        <!-- Water Depth/Shadow inside bowl -->
                        <path d="M280 432 Q400 470 520 432 Q400 455 280 432 Z" fill="#3D85C6" opacity="0.4" />

                        <!-- Swirl Detail (Visual Cue - Hidden initially) -->
                        <g class="swirl" opacity="0" style="transform-origin: 400px 432px;">
                            <path d="M360 432 Q400 410 440 432 T400 450" stroke="#FFF" stroke-width="3" fill="none" filter="url(#innerGlow)"/>
                            <path d="M380 432 Q400 420 420 432" stroke="#FFF" stroke-width="1.5" fill="none"/>
                        </g>
                    </g>

                    <!-- SEAT & LID -->
                    <g id="lid-seat">
                        <!-- Lid (Open/Vertical) -->
                        <path d="M245 410 Q400 460 555 410 L550 220 Q400 180 250 220 Z" fill="#FFFFFF" />
                        <!-- Lid Thickness Edge -->
                        <path d="M245 410 Q400 460 555 410 L553 415 Q400 465 247 415 Z" fill="#E0E0E0" />
                        
                        <!-- Seat (Horizontal) -->
                        <ellipse cx="400" cy="430" rx="145" ry="38" fill="none" stroke="#FFFFFF" stroke-width="16" />
                        <!-- Seat Shadow on Bowl -->
                        <ellipse cx="400" cy="445" rx="130" ry="25" fill="rgba(0,0,0,0.04)" />
                    </g>

                    <!-- FLUSH HANDLE (The Cue) -->
                    <g id="handle-group" style="transform-origin: 520px 320px;">
                        <!-- Handle Base Plate -->
                        <rect x="515" y="300" width="12" height="40" rx="4" fill="url(#gradChrome)" />
                        <!-- Lever Arm -->
                        <path class="handle-lever" d="M515 315 L555 315 L555 325 L515 325 Z" fill="url(#gradChrome)" />
                        <!-- Lever Grip -->
                        <rect x="550" y="310" width="8" height="20" rx="2" fill="#A0A0A0" />
                    </g>

                </svg>

                <!-- Invisible Interaction Zone -->
                <div class="flush-trigger-zone" id="flushBtn" title="Flush"></div>
            </div>
        </div>

        <!-- Info Panel -->
        <div class="info-panel">
            <h1>The<br>Architect<br>Series.</h1>
            <p class="tagline">
                Precision-engineered ceramic with a 360-degree silent close mechanism. 
                Experience the hydraulic perfection of the dual-action siphon.
            </p>

            <div class="specs">
                <div class="spec-item">
                    <h3>Efficiency</h3>
                    <p>4.8 / 1.6L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vit. China</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Gloss White</p>
                </div>
                <div class="spec-item">
                    <h3>Action</h3>
                    <p>Siphon Jet</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const flushBtn = document.getElementById('flushBtn');
            const handleGroup = document.getElementById('handle-group');
            const svgContainer = document.getElementById('toiletSvg');
            const waterSurface = document.querySelector('.water-surface');
            const swirl = document.querySelector('.swirl');
            const svg = document.querySelector('svg');

            // Function to create water particles
            function createSplash() {
                // Center of water in SVG coordinates roughly: 400, 430
                const ns = "http://www.w3.org/2000/svg";
                
                // Create particles
                for(let i=0; i<12; i++) {
                    const drop = document.createElementNS(ns, "circle");
                    const startX = 400 + (Math.random() * 80 - 40);
                    const startY = 430;
                    
                    drop.setAttribute("cx", startX);
                    drop.setAttribute("cy", startY);
                    drop.setAttribute("r", Math.random() * 3 + 1);
                    drop.setAttribute("fill", "#A9D2F5");
                    drop.style.opacity = 0;
                    
                    svg.appendChild(drop);
                    
                    // Animate using Web Animations API
                    const animation = drop.animate([
                        { transform: `translate(0, 0)`, opacity: 0 },
                        { opacity: 1, offset: 0.1 },
                        { transform: `translate(${Math.random()*40-20}px, ${Math.random()*60 + 20}px)`, opacity: 0 }
                    ], {
                        duration: 500 + Math.random() * 300,
                        easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                    });

                    animation.onfinish = () => drop.remove();
                }
            }

            flushBtn.addEventListener('click', () => {
                // 1. Move Handle (Physical feedback)
                handleGroup.style.transition = "transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1)";
                handleGroup.style.transform = "rotate(25deg)";

                setTimeout(() => {
                    handleGroup.style.transition = "transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)";
                    handleGroup.style.transform = "rotate(0deg)";
                }, 200);

                // 2. Trigger Water Effect (Visual Cue)
                createSplash();
                
                // 3. Bowl swirl animation
                swirl.style.opacity = "1";
                swirl.style.transition = "transform 2.5s ease-in-out, opacity 0.5s ease";
                swirl.style.transform = "rotate(360deg) scale(1.3)";
                
                // Fade out swirl
                setTimeout(() => {
                    swirl.style.opacity = "0";
                    swirl.style.transform = "rotate(0deg) scale(1)";
                }, 2000);

                // 4. Water level dip visual trick (Siphon effect)
                waterSurface.style.transition = "cy 0.6s cubic-bezier(0.4, 0, 0.2, 1)";
                waterSurface.setAttribute("cy", "445"); // Move down
                
                setTimeout(() => {
                    waterSurface.setAttribute("cy", "432"); // Return
                }, 1200);
            });

            // Subtle parallax on mouse move for dimensionality
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth - e.pageX * 2) / 150;
                const y = (window.innerHeight - e.pageY * 2) / 150;

                const lid = document.getElementById('lid-seat');
                // Only move the lid slightly to create depth separation
                lid.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
</body>
</html>
