<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Hub - Glassmorphism Redesign</title>
    <style>
        :root {
            /* Palette: Atmospheric Depth */
            --bg-canvas-start: #1a1a1f;
            --bg-canvas-end: #0f1016;
            
            /* Glass System */
            --glass-bg: rgba(25, 25, 30, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.03);
            --glass-blur: 16px;
            
            /* Status Colors (Strict Logic) */
            --status-online: #34d399;
            --status-lobby: #fbbf24;
            --status-ingame: #f87171;
            --status-offline: #6b7280;
            
            /* Action Colors */
            --action-primary: #3b82f6; /* Blue Invite */
            --action-primary-glow: rgba(59, 130, 246, 0.4);
            --action-battle: #f59e0b; /* Gold Battle */
            --action-battle-glow: rgba(245, 158, 11, 0.4);
            
            /* Typography */
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "SF Mono", "Roboto Mono", "Courier New", monospace;
            
            /* Dimensions */
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body {
            background: radial-gradient(circle at 50% -20%, var(--bg-canvas-start), var(--bg-canvas-end));
            color: #f0f0f0;
            font-family: var(--font-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Main Layout --- */
        .app-container {
            width: 1440px;
            height: 900px;
            display: grid;
            grid-template-columns: 360px 1fr 380px; /* Left, Center, Right */
            grid-template-rows: 100px 1fr; /* Top Header, Main Content */
            gap: 24px;
            padding: 24px;
            position: relative;
        }

        /* --- 1. Glassmorphism Base Class --- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Top Player Profile Header (Revised) --- */
        .profile-header {
            grid-column: 2 / 4; /* Spans Center and Right */
            grid-row: 1 / 2;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            background: rgba(30, 30, 35, 0.85); /* Slightly more opaque for header */
            z-index: 10;
        }

        .ph-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Unified Avatar Component */
        .avatar-wrapper {
            position: relative;
            width: 56px;
            height: 56px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.1);
        }

        /* Status Ring Logic */
        .status-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid transparent;
            box-sizing: border-box;
        }

        .status-ring.online { border-color: var(--status-online); }
        .status-ring.lobby { border-color: var(--status-lobby); }
        .status-ring.ingame { border-color: var(--status-ingame); box-shadow: 0 0 10px rgba(248, 113, 113, 0.3); }
        .status-ring.offline { border-color: var(--status-offline); }
        
        /* AFK Pulse Animation */
        .status-ring.afk {
            border-color: var(--status-lobby);
            animation: pulse-afk 2s infinite;
        }

        @keyframes pulse-afk {
            0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(251, 191, 36, 0); }
            100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
        }

        .ph-info { display: flex; flex-direction: column; }
        
        .ph-name {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .ph-rank {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--status-online);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* Active Party Indicator (Top Right of Header) */
        .ph-party-status {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .party-badge {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            padding: 8px 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
            color: var(--status-lobby);
        }

        .party-dot {
            width: 8px;
            height: 8px;
            background: var(--status-lobby);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--status-lobby);
        }

        /* --- Left Sidebar (Friends) --- */
        .sidebar {
            grid-column: 1 / 2;
            grid-row: 1 / 3; /* Spans full height */
            padding: 24px;
            gap: 20px;
        }

        .search-bar {
            position: relative;
        }

        .search-input {
            width: 100%;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            padding: 12px 16px 12px 40px;
            border-radius: var(--radius-md);
            color: #fff;
            font-size: 14px;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.3);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--status-offline);
            width: 16px;
        }

        .add-btn {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px dashed rgba(255,255,255,0.2);
            color: var(--status-online);
            padding: 12px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }

        .add-btn:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.4);
        }

        /* Pending Requests (Highlighted Card) */
        .pending-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
            border: 1px solid rgba(52, 211, 153, 0.2); /* Subtle green border */
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.05);
            padding: 16px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            position: relative;
        }

        .pending-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, var(--status-online), transparent);
        }

        .pending-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .pending-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--status-online);
            font-weight: 700;
        }

        .pending-badge {
            background: var(--status-online);
            color: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 10px;
        }

        .req-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .req-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .req-info { flex: 1; }
        .req-name { font-size: 13px; font-weight: 600; color: #fff; }
        .req-meta { font-size: 11px; color: var(--status-offline); }

        .req-actions { display: flex; gap: 6px; }
        
        .btn-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .btn-accept { background: rgba(52, 211, 153, 0.15); color: var(--status-online); }
        .btn-accept:hover { background: var(--status-online); color: #000; }
        .btn-decline { background: rgba(255,255,255,0.05); color: var(--status-offline); }
        .btn-decline:hover { background: rgba(255,255,255,0.1); color: #fff; }

        /* Friends List */
        .friends-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
        }

        .friends-scroll::-webkit-scrollbar { width: 4px; }
        .friends-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--status-offline);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 16px 0 8px 4px;
        }

        .friend-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .friend-row:hover {
            background: rgba(255,255,255,0.03);
        }

        .friend-row.active {
            background: rgba(59, 130, 246, 0.1); /* Blue tint */
            border-color: rgba(59, 130, 246, 0.2);
        }

        .friend-avatar-sm {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .f-info { flex: 1; }
        .f-name { font-size: 14px; font-weight: 600; color: #fff; }
        
        .f-status-text {
            font-size: 12px;
            font-weight: 500;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Status Text Colors */
        .text-online { color: var(--status-online); }
        .text-lobby { color: var(--status-lobby); }
        .text-ingame { color: var(--status-ingame); text-shadow: 0 0 8px rgba(248, 113, 113, 0.4); }
        .text-offline { color: var(--status-offline); }
        
        .status-dot-sm {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }

        /* --- Center Stage (Party Hub) --- */
        .center-stage {
            grid-column: 2 / 3;
            grid-row: 2 / 3;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        /* Background Grid */
        .grid-bg {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle, black 30%, transparent 80%);
            pointer-events: none;
        }

        .party-orbit {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
        }

        /* Orbital Rings */
        .orbit-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .ring-1 { width: 100%; height: 100%; animation: spin 60s linear infinite; }
        .ring-2 { width: 60%; height: 60%; border-style: dashed; animation: spin 40s linear infinite reverse; }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Nodes */
        .node {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .node:hover { transform: scale(1.1); z-index: 10; }

        .node-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            background: #000;
            overflow: hidden;
        }
        
        .node-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .node-label {
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 4px 10px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
        }

        /* Node Positions */
        .node-center { z-index: 5; }
        .node-top { top: 10px; }
        .node-left { bottom: 40px; left: 20px; }
        .node-right { bottom: 40px; right: 20px; }
        
        .node-empty {
            border: 2px dashed rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.3);
            font-size: 24px;
        }
        .node-empty img { display: none; }

        .start-btn {
            padding: 16px 48px;
            background: var(--action-primary);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 0 20px var(--action-primary-glow);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px var(--action-primary-glow);
            filter: brightness(1.1);
        }

        /* --- Right Detail Panel --- */
        .detail-panel {
            grid-column: 3 / 4;
            grid-row: 2 / 3;
            padding: 0;
        }

        .dp-header {
            padding: 40px 24px 24px;
            text-align: center;
            background: linear-gradient(to bottom, rgba(255,255,255,0.05), transparent);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .dp-avatar-lg {
            width: 100px;
            height: 100px;
            margin: 0 auto 16px;
        }

        .dp-name { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; }
        .dp-tag { font-family: var(--font-mono); color: var(--status-offline); font-size: 13px; margin-bottom: 12px; }
        
        .dp-level {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: var(--status-lobby);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 24px;
        }

        .stat-card {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            padding: 12px;
            border-radius: var(--radius-md);
            text-align: center;
        }

        .stat-val {
            font-family: var(--font-mono);
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .stat-lbl {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--status-offline);
            letter-spacing: 1px;
        }

        .dp-actions {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-md);
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Invite: Primary Blue */
        .btn-invite {
            background: rgba(59, 130, 246, 0.15);
            color: var(--action-primary);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .btn-invite:hover {
            background: var(--action-primary);
            color: #fff;
            box-shadow: 0 0 15px var(--action-primary-glow);
        }

        /* Battle: Warm Gold/Orange */
        .btn-battle {
            background: rgba(245, 158, 11, 0.15);
            color: var(--action-battle);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .btn-battle:hover {
            background: var(--action-battle);
            color: #000;
            box-shadow: 0 0 15px var(--action-battle-glow);
        }

        /* Whisper: Secondary */
        .btn-whisper {
            background: transparent;
            color: var(--status-offline);
            border: 1px solid var(--glass-border);
        }
        .btn-whisper:hover {
            background: rgba(255,255,255,0.05);
            color: #fff;
        }

        /* SVG Icons */
        .icon { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .icon-sm { width: 14px; height: 14px; }

    </style>
</head>
<body>

    <div class="app-container">

        <!-- 1. Player Profile Header (Top Right/Center) -->
        <header class="glass-panel profile-header">
            <div class="ph-left">
                <div class="avatar-wrapper">
                    <!-- User Avatar -->
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%233b82f6'/%3E%3Cstop offset='100%25' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' fill='url(%23g)'/%3E%3Ctext x='50' y='65' font-size='45' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EX%3C/text%3E%3C/svg%3E" class="avatar-img">
                    <div class="status-ring online"></div>
                </div>
                <div class="ph-info">
                    <div class="ph-name">Commander_X</div>
                    <div class="ph-rank">Diamond I</div>
                </div>
            </div>

            <div class="ph-party-status">
                <div class="party-badge">
                    <div class="party-dot"></div>
                    <span>Party: 3/5 Members</span>
                </div>
                <!-- Settings Icon Placeholder -->
                <svg class="icon" style="color:var(--status-offline); cursor:pointer" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </div>
        </header>

        <!-- 2. Left Sidebar (Friends) -->
        <aside class="glass-panel sidebar">
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" class="search-input" placeholder="Search friends...">
            </div>

            <button class="add-btn">
                <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                Add Friend
            </button>

            <!-- Pending Requests (Distinct Card) -->
            <div class="pending-card">
                <div class="pending-header">
                    <span class="pending-title">Pending Requests</span>
                    <span class="pending-badge">1</span>
                </div>
                <div class="req-row">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23555'/%3E%3Ctext x='50' y='65' font-size='40' text-anchor='middle' fill='%23999'%3E?%3C/text%3E%3C/svg%3E" class="req-avatar">
                    <div class="req-info">
                        <div class="req-name">TankMaster</div>
                        <div class="req-meta">Lvl 45 • Bronze</div>
                    </div>
                    <div class="req-actions">
                        <button class="btn-circle btn-accept"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg></button>
                        <button class="btn-circle btn-decline"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
                    </div>
                </div>
            </div>

            <div class="friends-scroll">
                <div class="section-label">Online (3)</div>

                <!-- Friend 1: In Game -->
                <div class="friend-row active" onclick="selectFriend(this, 'Viper')">
                    <div class="avatar-wrapper" style="width:40px; height:40px;">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2334d399'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E" class="friend-avatar-sm">
                        <div class="status-ring ingame"></div>
                    </div>
                    <div class="f-info">
                        <div class="f-name">Viper</div>
                        <div class="f-status-text text-ingame">In Game: Arena</div>
                    </div>
                </div>

                <!-- Friend 2: Lobby -->
                <div class="friend-row" onclick="selectFriend(this, 'Nova')">
                    <div class="avatar-wrapper" style="width:40px; height:40px;">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23fbbf24'/%3E%3Ccircle cx='50' cy='50' r='20' fill='white'/%3E%3C/svg%3E" class="friend-avatar-sm">
                        <div class="status-ring lobby"></div>
                    </div>
                    <div class="f-info">
                        <div class="f-name">Nova</div>
                        <div class="f-status-text text-lobby">In Lobby</div>
                    </div>
                </div>

                <!-- Friend 3: AFK -->
                <div class="friend-row" onclick="selectFriend(this, 'Kael')">
                    <div class="avatar-wrapper" style="width:40px; height:40px;">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%238b5cf6'/%3E%3Cpath d='M30,30 L70,70 M70,30 L30,70' stroke='white' stroke-width='8'/%3E%3C/svg%3E" class="friend-avatar-sm">
                        <div class="status-ring afk"></div>
                    </div>
                    <div class="f-info">
                        <div class="f-name">Kael</div>
                        <div class="f-status-text text-lobby">AFK</div>
                    </div>
                </div>

                <div class="section-label">Offline (2)</div>

                <!-- Friend 4: Offline -->
                <div class="friend-row" onclick="selectFriend(this, 'Ghost')">
                    <div class="avatar-wrapper" style="width:40px; height:40px;">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2364748b'/%3E%3C/svg%3E" class="friend-avatar-sm" style="opacity:0.7">
                        <div class="status-ring offline"></div>
                    </div>
                    <div class="f-info">
                        <div class="f-name" style="opacity:0.7">Ghost</div>
                        <div class="f-status-text text-offline">Offline 2h</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 3. Center Stage (Party Visuals) -->
        <main class="glass-panel center-stage">
            <div class="grid-bg"></div>
            
            <div style="text-align:center; margin-bottom: 20px; z-index:2;">
                <h2 style="font-size:24px; font-weight:800; letter-spacing:-0.5px; margin-bottom:4px;">Battle Squad</h2>
                <p style="color:var(--status-offline); font-size:13px;">Ready to deploy</p>
            </div>

            <div class="party-orbit">
                <div class="orbit-ring ring-1"></div>
                <div class="orbit-ring ring-2"></div>

                <!-- Center Node (Me) -->
                <div class="node node-center">
                    <div class="node-avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%233b82f6'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white' font-weight='bold'%3EX%3C/text%3E%3C/svg%3E">
                    </div>
                    <div class="node-label">You</div>
                </div>

                <!-- Party Member 1 -->
                <div class="node node-top">
                    <div class="node-avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2334d399'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E">
                    </div>
                    <div class="node-label">Viper</div>
                </div>

                <!-- Party Member 2 -->
                <div class="node node-left">
                    <div class="node-avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23fbbf24'/%3E%3Ccircle cx='50' cy='50' r='20' fill='white'/%3E%3C/svg%3E">
                    </div>
                    <div class="node-label">Nova</div>
                </div>

                <!-- Party Member 3 -->
                <div class="node node-right">
                    <div class="node-avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%238b5cf6'/%3E%3Cpath d='M30,30 L70,70 M70,30 L30,70' stroke='white' stroke-width='8'/%3E%3C/svg%3E">
                    </div>
                    <div class="node-label">Kael</div>
                </div>

                <!-- Empty Slot -->
                <div class="node" style="top: 50%; left: 10px; transform: translateY(-50%);">
                    <div class="node-avatar node-empty">+</div>
                </div>
            </div>

            <button class="start-btn">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                Start Match
            </button>
        </main>

        <!-- 4. Right Detail Panel -->
        <aside class="glass-panel detail-panel">
            <div class="dp-header">
                <div class="avatar-wrapper dp-avatar-lg">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2334d399'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E" class="avatar-img" id="detail-avatar">
                    <div class="status-ring ingame" id="detail-status-ring"></div>
                </div>
                <div class="dp-name" id="detail-name">Viper</div>
                <div class="dp-tag" id="detail-tag">#8492 • In Game</div>
                <div class="dp-level" id="detail-level">LVL 89</div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-val" id="stat-wins">1.4k</div>
                    <div class="stat-lbl">Wins</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val" id="stat-mmr">2,450</div>
                    <div class="stat-lbl">MMR</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val" id="stat-rate">54%</div>
                    <div class="stat-lbl">Win Rate</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val" id="stat-rank">Plat II</div>
                    <div class="stat-lbl">Rank</div>
                </div>
            </div>

            <div class="dp-actions">
                <!-- Primary Action: Invite -->
                <button class="btn-action btn-invite">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="17" y1="11" x2="23" y2="11"></line></svg>
                    Invite to Party
                </button>
                
                <!-- Secondary Action: Battle (Warm Color) -->
                <button class="btn-action btn-battle">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"></path><path d="M13 19l6-6"></path><path d="M16 16l4 4"></path><path d="M19 21l2-2"></path></svg>
                    Challenge to Battle
                </button>

                <!-- Tertiary Action: Whisper -->
                <button class="btn-action btn-whisper">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    Whisper
                </button>
            </div>
        </aside>

    </div>

    <script>
        const friends = {
            'Viper': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2334d399'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E",
                name: "Viper",
                tag: "#8492 • In Game: Arena",
                lvl: "89",
                statusClass: "ingame",
                wins: "1.4k", mmr: "2,450", rate: "54%", rank: "Plat II"
            },
            'Nova': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23fbbf24'/%3E%3Ccircle cx='50' cy='50' r='20' fill='white'/%3E%3C/svg%3E",
                name: "Nova",
                tag: "#1102 • In Lobby",
                lvl: "42",
                statusClass: "lobby",
                wins: "320", mmr: "1,800", rate: "48%", rank: "Gold I"
            },
            'Kael': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%238b5cf6'/%3E%3Cpath d='M30,30 L70,70 M70,30 L30,70' stroke='white' stroke-width='8'/%3E%3C/svg%3E",
                name: "Kael",
                tag: "#9921 • AFK",
                lvl: "12",
                statusClass: "afk",
                wins: "45", mmr: "900", rate: "32%", rank: "Bronze III"
            },
            'Ghost': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2364748b'/%3E%3C/svg%3E",
                name: "Ghost",
                tag: "#0012 • Offline",
                lvl: "76",
                statusClass: "offline",
                wins: "890", mmr: "2,100", rate: "51%", rank: "Diamond III"
            }
        };

        function selectFriend(element, name) {
            // Update Active State in List
            document.querySelectorAll('.friend-row').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            // Update Detail Panel
            const data = friends[name];
            if(data) {
                const panel = document.querySelector('.detail-panel');
                
                // Fade effect
                panel.style.opacity = '0.5';
                panel.style.transition = 'opacity 0.2s';
                
                setTimeout(() => {
                    document.getElementById('detail-avatar').src = data.img;
                    document.getElementById('detail-name').textContent = data.name;
                    document.getElementById('detail-tag').textContent = data.tag;
                    document.getElementById('detail-level').textContent = 'LVL ' + data.lvl;
                    
                    // Status Ring Update
                    const ring = document.getElementById('detail-status-ring');
                    ring.className = 'status-ring ' + data.statusClass;

                    // Stats Update
                    document.getElementById('stat-wins').textContent = data.wins;
                    document.getElementById('stat-mmr').textContent = data.mmr;
                    document.getElementById('stat-rate').textContent = data.rate;
                    document.getElementById('stat-rank').textContent = data.rank;

                    panel.style.opacity = '1';
                }, 200);
            }
        }
    </script>
</body>
</html>
