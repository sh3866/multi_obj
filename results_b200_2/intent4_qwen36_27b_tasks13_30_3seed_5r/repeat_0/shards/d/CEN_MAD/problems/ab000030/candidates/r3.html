<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Hub - Revised</title>
    <style>
        :root {
            /* Palette: Warm & Polished */
            --bg-canvas: #121214;
            --bg-panel: #1a1a1e;
            --bg-panel-highlight: #232329;
            
            /* Status Colors (Warmth & Contrast) */
            --status-online: #10b981;
            --status-lobby: #f59e0b;
            --status-ingame: #f97316; /* Warm Orange/Amber instead of Red */
            --status-offline: #6b7280;
            
            /* Action Colors */
            --action-primary: #3b82f6;
            --action-battle: #f87171; /* Aggressive Red/Pink */
            --action-battle-glow: rgba(248, 113, 113, 0.5);
            
            /* Typography */
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            /* Radius Scale */
            --radius-card: 8px;
            --radius-btn: 12px;
            --radius-pill: 999px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body {
            background-color: var(--bg-canvas);
            background-image: radial-gradient(circle at 50% 0%, #2a2a30 0%, var(--bg-canvas) 70%);
            color: #e5e7eb;
            font-family: var(--font-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Main Layout --- */
        .app-container {
            width: 1440px;
            height: 900px;
            display: grid;
            grid-template-columns: 360px 1fr 380px; /* Left, Center, Right */
            grid-template-rows: 90px 1fr; /* Top Header, Main Content */
            gap: 20px;
            padding: 20px;
            position: relative;
        }

        /* --- Base Card Style --- */
        .card {
            background: var(--bg-panel);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-card);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- 1. Header --- */
        .header {
            grid-column: 2 / 4;
            grid-row: 1 / 2;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: rgba(26, 26, 30, 0.95);
            backdrop-filter: blur(10px);
            z-index: 20;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-container {
            position: relative;
            width: 48px;
            height: 48px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #333;
        }

        /* Standardized Status Rings */
        .status-ring {
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 2px solid var(--bg-panel); /* Gap */
            box-shadow: 0 0 0 2px var(--ring-color, #555);
            pointer-events: none;
        }
        
        .status-ring.online { --ring-color: var(--status-online); }
        .status-ring.lobby { --ring-color: var(--status-lobby); }
        .status-ring.ingame { --ring-color: var(--status-ingame); }
        .status-ring.offline { --ring-color: var(--status-offline); }

        .user-info h1 { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
        .user-info .rank { font-size: 13px; color: var(--status-online); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

        .party-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.05);
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .party-indicator span { font-size: 13px; font-weight: 600; color: #fff; }
        .party-indicator .count { color: var(--status-lobby); }

        /* --- 2. Left Sidebar (Social Feed) --- */
        .sidebar {
            grid-column: 1 / 2;
            grid-row: 1 / 3;
            padding: 20px;
            gap: 16px;
        }

        .search-box {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--radius-card);
            padding: 10px 12px 10px 36px;
            color: #fff;
            font-size: 14px;
            width: 100%;
            transition: 0.2s;
        }
        .search-box:focus { border-color: rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); }
        
        .search-icon {
            position: absolute; left: 32px; top: 28px; width: 16px; height: 16px; color: var(--status-offline); pointer-events: none;
        }

        .btn-add {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 12px;
            border-radius: var(--radius-pill); /* Pill shape */
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-add:hover { background: rgba(255,255,255,0.1); }

        /* Pending Requests (Top of Feed) */
        .feed-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .section-header {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--status-offline);
            font-weight: 700;
            margin: 8px 0 4px 4px;
            display: flex;
            justify-content: space-between;
        }

        .req-card {
            background: linear-gradient(to right, rgba(255,255,255,0.03), transparent);
            border: 1px solid rgba(255,255,255,0.05);
            border-left: 3px solid var(--status-online);
            padding: 12px;
            border-radius: var(--radius-card);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .req-details { flex: 1; }
        .req-name { font-size: 13px; font-weight: 600; color: #fff; }
        .req-meta { font-size: 11px; color: var(--status-offline); margin-top: 2px; }

        .req-actions { display: flex; gap: 8px; }
        .btn-icon {
            width: 28px; height: 28px;
            border-radius: 50%;
            border: none;
            display: grid; place-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-accept { background: rgba(16, 185, 129, 0.15); color: var(--status-online); }
        .btn-accept:hover { background: var(--status-online); color: #fff; }
        .btn-decline { background: rgba(255,255,255,0.05); color: var(--status-offline); }
        .btn-decline:hover { background: rgba(255,255,255,0.1); color: #fff; }

        /* Friends List */
        .friends-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }
        .friends-list::-webkit-scrollbar { width: 4px; }
        .friends-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        .friend-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: var(--radius-card);
            cursor: pointer;
            transition: background 0.15s;
        }
        .friend-row:hover { background: rgba(255,255,255,0.03); }
        .friend-row.active { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2); }

        .f-info { flex: 1; overflow: hidden; }
        .f-name { font-size: 14px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .f-status { font-size: 12px; margin-top: 2px; font-weight: 500; display: flex; align-items: center; gap: 6px; }

        /* Status Text Colors */
        .text-online { color: var(--status-online); }
        .text-lobby { color: var(--status-lobby); }
        .text-ingame { color: var(--status-ingame); }
        .text-offline { color: var(--status-offline); opacity: 0.7; }
        .f-name.offline, .f-status.offline { opacity: 0.5; }

        /* --- 3. Center Stage (Tactical Visualization) --- */
        .center-stage {
            grid-column: 2 / 3;
            grid-row: 2 / 3;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* Glassmorphism / Metallic Sheen */
            background: linear-gradient(135deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.005) 100%);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: var(--radius-card);
            overflow: hidden;
        }

        /* Tactical Grid Background */
        .tactical-grid {
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle at center, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px, 100px 100px, 100px 100px;
            mask-image: radial-gradient(circle, black 40%, transparent 90%);
            pointer-events: none;
        }

        .squad-container {
            position: relative;
            width: 500px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Orbital Rings */
        .orbit {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .orbit-outer { width: 100%; height: 100%; border-style: dashed; animation: spin 80s linear infinite; }
        .orbit-inner { width: 60%; height: 60%; animation: spin 40s linear infinite reverse; }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Nodes */
        .node {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }
        .node:hover { transform: scale(1.05); }

        .node-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            background: #111;
            overflow: hidden;
        }
        .node-avatar img { width: 100%; height: 100%; object-fit: cover; }

        /* Names below icons in white with drop shadow */
        .node-name {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            text-align: center;
            width: 100px;
        }

        /* Node Positions */
        .pos-center { z-index: 5; }
        .pos-top { top: 20px; }
        .pos-left { bottom: 60px; left: 20px; }
        .pos-right { bottom: 60px; right: 20px; }
        
        /* Holographic Beacon for Empty Slot */
        .pos-beacon { top: 50%; left: 20px; transform: translateY(-50%); }
        .beacon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px dashed var(--status-lobby);
            display: grid;
            place-items: center;
            animation: pulse-beacon 2s infinite;
            background: rgba(245, 158, 11, 0.05);
        }
        .beacon-text {
            font-size: 10px;
            font-weight: 800;
            color: var(--status-lobby);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            line-height: 1.1;
        }

        @keyframes pulse-beacon {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.2); border-color: var(--status-lobby); }
            50% { box-shadow: 0 0 20px 5px rgba(245, 158, 11, 0.1); border-color: rgba(245, 158, 11, 0.3); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); border-color: var(--status-lobby); }
        }

        .squad-footer {
            margin-top: 20px;
            z-index: 2;
        }
        .btn-deploy {
            padding: 12px 40px;
            background: var(--action-primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-btn);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-deploy:hover { filter: brightness(1.1); transform: translateY(-1px); }

        /* --- 4. Right Panel (Contextual Actions) --- */
        .detail-panel {
            grid-column: 3 / 4;
            grid-row: 2 / 3;
            padding: 0;
        }

        .dp-header {
            padding: 30px 24px;
            text-align: center;
            background: linear-gradient(to bottom, rgba(255,255,255,0.03), transparent);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .dp-avatar-wrap {
            width: 90px;
            height: 90px;
            margin: 0 auto 12px;
        }

        .dp-name { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: #fff; margin-bottom: 4px; }
        .dp-tag { font-size: 13px; color: var(--status-offline); margin-bottom: 12px; }
        
        .dp-level {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-card);
            font-size: 12px;
            font-weight: 700;
            color: var(--status-lobby);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 20px;
        }

        .stat-card {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: var(--radius-card);
            text-align: center;
        }

        .stat-val {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }
        /* Unify font, use bold/color for rank */
        .stat-val.rank-val { color: var(--status-online); }

        .stat-lbl {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--status-offline);
            letter-spacing: 1px;
            font-weight: 600;
        }

        .dp-actions {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-btn);
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Battle: Primary, Aggressive */
        .btn-battle {
            background: var(--action-battle);
            color: #fff;
            box-shadow: 0 4px 15px var(--action-battle-glow);
            position: relative;
            overflow: hidden;
        }
        /* Jagged effect simulation via border gradient or shadow */
        .btn-battle:hover {
            box-shadow: 0 0 25px var(--action-battle-glow);
            filter: brightness(1.1);
            transform: scale(1.02);
        }
        .btn-battle::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.2) 50%, transparent 60%);
            opacity: 0.5;
        }

        /* Invite: Secondary */
        .btn-invite {
            background: rgba(255,255,255,0.05);
            color: var(--action-primary);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .btn-invite:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: var(--action-primary);
        }

        /* Whisper: Tertiary */
        .btn-whisper {
            background: transparent;
            color: var(--status-offline);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .btn-whisper:hover {
            background: rgba(255,255,255,0.03);
            color: #fff;
        }

        /* SVG Icons */
        .icon { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .icon-sm { width: 14px; height: 14px; }

    </style>
</head>

    <div class="app-container">

        <!-- 1. Header -->
        <header class="card header">
            <div class="user-pill">
                <div class="avatar-container">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%233b82f6'/%3E%3Cstop offset='100%25' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' fill='url(%23g)'/%3E%3Ctext x='50' y='65' font-size='45' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EX%3C/text%3E%3C/svg%3E" class="avatar">
                    <div class="status-ring online"></div>
                </div>
                <div class="user-info">
                    <h1>Commander_X</h1>
                    <div class="rank">Diamond I</div>
                </div>
            </div>

            <div class="party-indicator">
                <svg class="icon" style="color:var(--status-lobby)" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                <span>Party: <span class="count">3/5</span></span>
            </div>
        </header>

        <!-- 2. Left Sidebar (Social Feed) -->
        <aside class="card sidebar">
            <!-- Search -->
            <div style="position:relative">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" class="search-box" placeholder="Search friends...">
            </div>

            <button class="btn-add">
                <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Add Friend
            </button>

            <!-- Feed Section -->
            <div class="feed-section">
                <div class="section-header">
                    <span>Pending Requests</span>
                    <span style="color:var(--status-online)">1 New</span>
                </div>
                
                <!-- Pending Card -->
                <div class="req-card">
                    <div class="avatar-container" style="width:36px; height:36px;">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23555'/%3E%3Ctext x='50' y='65' font-size='40' text-anchor='middle' fill='%23999'%3E?%3C/text%3E%3C/svg%3E" class="avatar">
                        <div class="status-ring offline"></div>
                    </div>
                    <div class="req-details">
                        <div class="req-name">TankMaster</div>

                    <div class="req-actions">
                        <button class="btn-icon btn-accept"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg></button>
                        <button class="btn-icon btn-decline"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
                    </div>
                </div>

                <!-- Online List -->
                <div class="section-header">Online (3)</div>
                
                <div class="friends-list">
                    <!-- Friend 1: In Game -->
                    <div class="friend-row active" onclick="selectFriend(this, 'Viper')">
                        <div class="avatar-container" style="width:36px; height:36px;">
                            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2334d399'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E" class="avatar">
                            <div class="status-ring ingame"></div>
                        </div>
                        <div class="f-info">
                            <div class="f-name">Viper</div>
                            <div class="f-status text-ingame">In Game: Arena</div>
                        </div>
                    </div>

                    <!-- Friend 2: Lobby -->
                    <div class="friend-row" onclick="selectFriend(this, 'Nova')">
                        <div class="avatar-container" style="width:36px; height:36px;">
                            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23fbbf24'/%3E%3Ccircle cx='50' cy='50' r='20' fill='white'/%3E%3C/svg%3E" class="avatar">
                            <div class="status-ring lobby"></div>
                        </div>
                        <div class="f-info">
                            <div class="f-name">Nova</div>
                            <div class="f-status text-lobby">In Lobby</div>
                        </div>
                    </div>

                    <!-- Friend 3: AFK -->
                    <div class="friend-row" onclick="selectFriend(this, 'Kael')">
                        <div class="avatar-container" style="width:36px; height:36px;">
                            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%238b5cf6'/%3E%3Cpath d='M30,30 L70,70 M70,30 L30,70' stroke='white' stroke-width='8'/%3E%3C/svg%3E" class="avatar">
                            <div class="status-ring lobby"></div>
                        </div>
                        <div class="f-info">
                            <div class="f-name">Kael</div>
                            <div class="f-status text-lobby">AFK</div>
                        </div>
                    </div>

                    <!-- Friend 4: Offline -->
                    <div class="friend-row" onclick="selectFriend(this, 'Ghost')">
                        <div class="avatar-container" style="width:36px; height:36px;">
                            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2364748b'/%3E%3C/svg%3E" class="avatar">
                            <div class="status-ring offline"></div>
                        </div>
                        <div class="f-info">
                            <div class="f-name offline">Ghost</div>
                            <div class="f-status text-offline">Offline 2h</div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 3. Center Stage (Tactical Visualization) -->
        <main class="center-stage">
            <div class="tactical-grid"></div>
            
            <div class="squad-container">
                <div class="orbit orbit-outer"></div>
                <div class="orbit orbit-inner"></div>

                <!-- Center Node (Me) -->
                <div class="node pos-center">
                    <div class="node-avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%233b82f6'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white' font-weight='bold'%3EX%3C/text%3E%3C/svg%3E">
                    </div>
                    <div class="node-name">You</div>
                </div>

                <!-- Party Member 1 -->
                <div class="node pos-top">
                    <div class="node-avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2334d399'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E">
                    </div>
                    <div class="node-name">Viper</div>
                </div>

                <!-- Party Member 2 -->
                <div class="node pos-left">
                    <div class="node-avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23fbbf24'/%3E%3Ccircle cx='50' cy='50' r='20' fill='white'/%3E%3C/svg%3E">
                    </div>
                    <div class="node-name">Nova</div>
                </div>

                <!-- Party Member 3 -->
                <div class="node pos-right">
                    <div class="node-avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%238b5cf6'/%3E%3Cpath d='M30,30 L70,70 M70,30 L30,70' stroke='white' stroke-width='8'/%3E%3C/svg%3E">
                    </div>
                    <div class="node-name">Kael</div>
                </div>

                <!-- Empty Slot: Holographic Beacon -->
                <div class="node pos-beacon">
                    <div class="beacon-circle">
                        <span class="beacon-text">Slot<br>Open</span>
                    </div>
                </div>
            </div>

            <div class="squad-footer">
                <button class="btn-deploy">Start Match</button>
            </div>
        </main>

        <!-- 4. Right Detail Panel -->
        <aside class="card detail-panel">
            <div class="dp-header">
                <div class="avatar-container dp-avatar-wrap">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2334d399'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E" class="avatar" id="detail-avatar">
                    <div class="status-ring ingame" id="detail-status-ring"></div>
                </div>
                <div class="dp-name" id="detail-name">Viper</div>
                <div class="dp-tag" id="detail-tag">#8492 • In Game: Arena</div>
                <div class="dp-level" id="detail-level">LVL 89</div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-val" id="stat-wins">1.4k</div>
                    <div class="stat-lbl">Wins</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val" id="stat-mmr">2,450</div>
                    <div class="stat-lbl">MMR</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val" id="stat-rate">54%</div>
                    <div class="stat-lbl">Win Rate</div>
                </div>
                <div class="stat-card">
                    <!-- Unified font, styled via class -->
                    <div class="stat-val rank-val" id="stat-rank">Plat II</div>
                    <div class="stat-lbl">Rank</div>
                </div>
            </div>

            <div class="dp-actions">
                <!-- Primary Action: Battle (Aggressive) -->
                <button class="btn-action btn-battle">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"></path><path d="M13 19l6-6"></path><path d="M16 16l4 4"></path><path d="M19 21l2-2"></path></svg>
                    Challenge to Battle
                </button>
                
                <!-- Secondary Action: Invite to Game -->
                <button class="btn-action btn-invite">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="17" y1="11" x2="23" y2="11"></line></svg>
                    Invite to Game
                </button>

                <!-- Tertiary Action: Whisper -->
                <button class="btn-action btn-whisper">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    Whisper
                </button>
            </div>
        </aside>

    </div>

    <script>
        const friends = {
            'Viper': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2334d399'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E",
                name: "Viper",
                tag: "#8492 • In Game: Arena",
                lvl: "89",
                statusClass: "ingame",
                wins: "1.4k", mmr: "2,450", rate: "54%", rank: "Plat II"
            },
            'Nova': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23fbbf24'/%3E%3Ccircle cx='50' cy='50' r='20' fill='white'/%3E%3C/svg%3E",
                name: "Nova",
                tag: "#1102 • In Lobby",
                lvl: "42",
                statusClass: "lobby",
                wins: "320", mmr: "1,800", rate: "48%", rank: "Gold I"
            },
            'Kael': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%238b5cf6'/%3E%3Cpath d='M30,30 L70,70 M70,30 L30,70' stroke='white' stroke-width='8'/%3E%3C/svg%3E",
                name: "Kael",
                tag: "#9921 • AFK",
                lvl: "12",
                statusClass: "lobby",
                wins: "45", mmr: "900", rate: "32%", rank: "Bronze III"
            },
            'Ghost': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2364748b'/%3E%3C/svg%3E",
                name: "Ghost",
                tag: "#0012 • Offline",
                lvl: "76",
                statusClass: "offline",
                wins: "890", mmr: "2,100", rate: "51%", rank: "Diamond III"
            }
        };

        function selectFriend(element, name) {
            // Update Active State in List
            document.querySelectorAll('.friend-row').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            // Update Detail Panel
            const data = friends[name];
            if(data) {
                const panel = document.querySelector('.detail-panel');
                
                // Fade effect
                panel.style.opacity = '0.5';
                panel.style.transition = 'opacity 0.2s';
                
                setTimeout(() => {
                    document.getElementById('detail-avatar').src = data.img;
                    document.getElementById('detail-name').textContent = data.name;
                    document.getElementById('detail-tag').textContent = data.tag;
                    document.getElementById('detail-level').textContent = 'LVL ' + data.lvl;
                    
                    // Status Ring Update
                    const ring = document.getElementById('detail-status-ring');
                    ring.className = 'status-ring ' + data.statusClass;

                    // Stats Update
                    document.getElementById('stat-wins').textContent = data.wins;
                    document.getElementById('stat-mmr').textContent = data.mmr;
                    document.getElementById('stat-rate').textContent = data.rate;
                    document.getElementById('stat-rank').textContent = data.rank;

                    panel.style.opacity = '1';
                }, 200);
            }
        }
    </script>
</body>
</html>
