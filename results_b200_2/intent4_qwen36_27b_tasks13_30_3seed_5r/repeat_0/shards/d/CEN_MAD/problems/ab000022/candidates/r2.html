<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce Dash - Adventure</title>
    <style>
        :root {
            /* Palette - Updated for better depth */
            --c-sky-top: #4FACFE;
            --c-sky-bot: #00F2FE;
            --c-mountain: #A6E4FF;
            --c-hill: #86E3CE;
            --c-grass-top: #58D68D;
            --c-grass-bot: #27AE60;
            --c-dirt: #8B4513;
            --c-dirt-dark: #5D2906;
            --c-block: #F39C12;
            --c-block-dark: #D35400;
            --c-accent: #FFD700;
            --c-hero: #FF4757;
            --c-hero-dark: #C41E3A;
            --c-text: #FFFFFF;
            --c-ui-panel: rgba(255, 255, 255, 0.15);
            --c-ui-border: rgba(255, 255, 255, 0.3);
            
            /* Lighting & Shadows (Top-Left Source) */
            --shadow-2d: 4px 6px 0px rgba(0,0,0,0.2);
            --shadow-float: 0px 15px 25px rgba(0,0,0,0.2);
            --shadow-inset: inset 2px 2px 0px rgba(255,255,255,0.4), inset -2px -2px 0px rgba(0,0,0,0.1);
            
            --radius-lg: 24px;
            --radius-md: 16px;
            
            --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #111;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-main);
            overflow: hidden;
            color: var(--c-text);
        }

        /* Game Screen Container */
        #game-screen {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1920px;
            max-height: 1080px;
            background: linear-gradient(to bottom, var(--c-sky-top), var(--c-sky-bot));
            overflow: hidden;
            box-shadow: 0 0 80px rgba(0,0,0,0.5);
            transition: background 0.5s ease;
        }

        /* --- PARALLAX LAYERS --- */
        .layer {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transition: transform 0.1s linear;
        }

        /* Layer 1: Clouds */
        .clouds { z-index: 1; }
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 100px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.05);
            animation: drift linear infinite;
        }
        .c1 { width: 200px; height: 70px; top: 12%; left: -200px; animation-duration: 45s; }
        .c1::before { content:''; position:absolute; width:100px; height:100px; background:inherit; border-radius:50%; top:-50px; left:30px; }
        .c1::after { content:''; position:absolute; width:80px; height:80px; background:inherit; border-radius:50%; top:-30px; left:100px; }
        
        .c2 { width: 160px; height: 60px; top: 22%; left: -150px; animation-duration: 60s; opacity: 0.6; animation-delay: -20s; }
        .c2::before { content:''; position:absolute; width:80px; height:80px; background:inherit; border-radius:50%; top:-40px; left:20px; }

        /* Layer 2: Mountains (New Depth) */
        .mountains {
            z-index: 2;
            bottom: 120px;
            left: 0;
            width: 100%;
            height: 400px;
        }
        .mountain {
            position: absolute;
            bottom: 0;
            width: 0; height: 0;
            border-left: 250px solid transparent;
            border-right: 250px solid transparent;
            border-bottom: 450px solid var(--c-mountain);
            filter: drop-shadow(10px 0 10px rgba(0,0,0,0.05));
        }
        .m1 { left: -5%; transform: scale(1.3); opacity: 0.8; }
        .m2 { left: 40%; transform: scale(1.1); opacity: 0.7; }
        .m3 { right: -10%; transform: scale(1.4); opacity: 0.9; }

        /* Layer 3: Mid-ground Hills (New Depth) */
        .hills {
            z-index: 3;
            bottom: 80px;
            width: 120%;
            left: -10%;
            height: 250px;
            background: var(--c-hill);
            border-radius: 60% 40% 0 0;
            box-shadow: inset -20px -20px 40px rgba(0,0,0,0.1);
        }

        /* Layer 4: The Stage (Canvas) */
        #level-canvas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45%; 
            z-index: 10;
        }

        /* --- HERO --- */
        #hero-wrapper {
            position: absolute;
            bottom: 140px; /* Sits on ground */
            left: 25%;
            z-index: 20;
            width: 140px;
            height: 140px;
            transform-origin: bottom center;
            filter: var(--shadow-float);
            transition: left 0.1s linear;
            pointer-events: none;
        }

        .hero-svg {
            width: 100%;
            height: 100%;
            animation: heroBob 2s ease-in-out infinite;
        }

        @keyframes heroBob {
            0%, 100% { transform: translateY(0) scaleY(1); }
            50% { transform: translateY(-10px) scaleY(0.98); }
        }
        
        /* --- UI OVERLAY --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 30;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 50px;
            pointer-events: none;
        }

        /* Header */
        header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            pointer-events: auto;
        }

        /* Title: Custom 3D Extrusion */
        .game-title {
            font-size: 5.5rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            line-height: 0.9;
            letter-spacing: -3px;
            position: relative;
            /* The 3D Look */
            text-shadow: 
                0px 4px 0px #C41E3A,
                0px 8px 0px #C41E3A,
                0px 12px 0px #8A1629,
                0px 15px 10px rgba(0,0,0,0.3);
            transform: skewX(-6deg) translateX(-10px);
            margin-bottom: 10px;
        }
        
        /* Small Coin Counter moved to Top Left under Title */
        .counter-panel {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 8px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow-2d);
            transform: skewX(-6deg);
            width: fit-content;
            margin-top: 10px;
        }

        .coin-icon {
            width: 24px;
            height: 24px;
            background: radial-gradient(circle at 30% 30%, #FFD700, #F39C12);
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            font-size: 0.8rem;
            text-shadow: 0 1px 0 rgba(0,0,0,0.3);
        }

        .counter-text {
            font-size: 1.2rem;
            font-weight: 800;
            color: #333;
        }

        /* Bottom Section */
        .bottom-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            padding-bottom: 20px;
            pointer-events: auto;
        }

        /* World Selector (Redesigned as Map Path) */
        .world-selector {
            background: var(--c-ui-panel);
            backdrop-filter: blur(10px);
            border: 2px solid var(--c-ui-border);
            padding: 10px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 0;
            box-shadow: var(--shadow-2d);
        }

        .world-node {
            width: 40px; 
            height: 40px;
            border-radius: 50%;
            border: 3px solid #fff;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            z-index: 2;
        }
        
        .world-connector {
            width: 30px;
            height: 4px;
            background: rgba(255,255,255,0.5);
            z-index: 1;
            border-radius: 2px;
        }

        .world-node:hover { transform: translateY(-3px); }
        .world-node.active { 
            transform: scale(1.2) translateY(-3px); 
            border-color: #FFD700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.8), 0 6px 0 rgba(0,0,0,0.2);
        }
        
        .w-grass { background: linear-gradient(135deg, #58D68D, #27AE60); }
        .w-ice { background: linear-gradient(135deg, #74B9FF, #0984E3); }
        .w-fire { background: linear-gradient(135deg, #FF7675, #D63031); }

        /* Controls Guide (Redesigned Panel) */
        .controls-guide {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(12px);
            padding: 15px 20px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255,255,255,0.2);
            text-align: right;
            box-shadow: var(--shadow-2d);
            transform: translateX(10px);
            opacity: 0.9;
            transition: all 0.3s;
        }
        .controls-guide:hover { opacity: 1; transform: translateX(5px); }

        .key-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin: 8px 0;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.9);
        }
        
        /* Chunky Keycaps */
        .key {
            background: #fff;
            color: #333;
            padding: 6px 12px;
            border-radius: 8px;
            font-family: var(--font-main);
            font-weight: 900;
            box-shadow: 0 4px 0 #999;
            font-size: 0.9rem;
            min-width: 28px;
            text-align: center;
            border: 1px solid rgba(0,0,0,0.1);
        }

        /* Start Button (Primary Focal Point) */
        .start-container {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            z-index: 40;
        }
        
        .start-btn {
            background: linear-gradient(to bottom, #FF6B81, #FF4757);
            color: white;
            border: none;
            padding: 24px 80px;
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 2px;
            
            /* Strong 3D Button Effect */
            box-shadow: 
                0 12px 0 #C41E3A, 
                0 20px 20px rgba(0,0,0,0.4),
                inset 0 4px 0 rgba(255,255,255,0.4);
            
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            text-shadow: 0 2px 2px rgba(0,0,0,0.2);
        }
        
        .start-btn:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 16px 0 #C41E3A, 
                0 30px 40px rgba(0,0,0,0.5),
                inset 0 4px 0 rgba(255,255,255,0.4);
            filter: brightness(1.1);
        }
        
        .start-btn:active {
            transform: translateY(8px);
            box-shadow: 
                0 4px 0 #C41E3A, 
                0 5px 10px rgba(0,0,0,0.3),
                inset 0 4px 0 rgba(255,255,255,0.4);
        }

        /* Shine animation */
        .start-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            transform: skewX(-20deg);
            animation: shineBtn 3.5s infinite;
        }

        @keyframes shineBtn {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        @keyframes drift {
            0% { transform: translateX(-200px); }
            100% { transform: translateX(120vw); }
        }

    </style>
</head>
<body>

    <div id="game-screen">
        
        <!-- BACKGROUND LAYERS -->
        <div class="layer clouds">
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
        </div>
        <div class="layer mountains">
            <div class="mountain m1"></div>
            <div class="mountain m2"></div>
            <div class="mountain m3"></div>
        </div>
        <div class="layer hills"></div>

        <!-- THE LEVEL PREVIEW (CANVAS) -->
        <canvas id="level-canvas"></canvas>

        <!-- HERO CHARACTER -->
        <div id="hero-wrapper">
            <svg class="hero-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Shadow -->
                <ellipse cx="50" cy="95" rx="30" ry="8" fill="rgba(0,0,0,0.3)" />
                <!-- Body -->
                <g transform="translate(0, 0)">
                    <!-- Legs (static for idle) -->
                    <path d="M35 75 L35 90 L50 90 L50 75" fill="#C41E3A" />
                    <path d="M50 75 L50 90 L65 90 L65 75" fill="#C41E3A" />
                    <!-- Main Ball -->
                    <circle cx="50" cy="50" r="40" fill="#FF4757" stroke="#C41E3A" stroke-width="3" />
                    <!-- Shine -->
                    <path d="M25 30 Q 50 10 75 30" stroke="rgba(255,255,255,0.4)" stroke-width="6" fill="none" stroke-linecap="round" />
                    <!-- Eyes -->
                    <ellipse cx="40" cy="45" rx="6" ry="9" fill="white" />
                    <ellipse cx="60" cy="45" rx="6" ry="9" fill="white" />
                    <circle cx="42" cy="45" r="3" fill="black" />
                    <circle cx="62" cy="45" r="3" fill="black" />
                    <!-- Mouth -->
                    <path d="M40 65 Q 50 70 60 65" stroke="black" stroke-width="3" fill="none" stroke-linecap="round" />
                    <!-- Hat -->
                    <path d="M30 20 L 50 5 L 70 20 Z" fill="#FFD700" stroke="#E67E22" stroke-width="2" stroke-linejoin="round" />
                    <rect x="20" y="20" width="60" height="8" rx="4" fill="#FFD700" stroke="#E67E22" stroke-width="2" />
                </g>
            </svg>
        </div>

        <!-- UI LAYER -->
        <div class="ui-layer">
            <header>
                <div class="game-title">BOUNCE<br>DASH</div>
                
                <!-- Moved Counter to Top Left -->
                <div class="counter-panel">
                    <div class="coin-icon">$</div>
                    <div class="counter-text">042 <span>/ 100</span></div>
                </div>
            </header>

            <div class="bottom-area">
                <!-- World Selector (Map Path) -->
                <div class="world-selector">
                    <div class="world-node w-grass active" onclick="setTheme('grass')" title="Green Hills"></div>
                    <div class="world-connector"></div>
                    <div class="world-node w-ice" onclick="setTheme('ice')" title="Ice Peaks"></div>
                    <div class="world-connector"></div>
                    <div class="world-node w-fire" onclick="setTheme('fire')" title="Lava Lands"></div>
                </div>

                <!-- Controls Guide -->
                <div class="controls-guide">
                    <div class="key-row"><span>Move</span> <span class="key">←</span> <span class="key">→</span></div>
                    <div class="key-row"><span>Jump</span> <span class="key">SPACE</span></div>
                    <div class="key-row"><span>Power</span> <span class="key">Z</span></div>
                </div>
            </div>
        </div>

        <!-- START BUTTON -->
        <div class="start-container">
            <button class="start-btn">Start Adventure</button>
        </div>

    </div>

    <script>
        // --- CANVAS SETUP ---
        const canvas = document.getElementById('level-canvas');
        const ctx = canvas.getContext('2d');
        
        // Theme Configurations
        const themes = {
            grass: { 
                sky: ['#4FACFE', '#00F2FE'], 
                mountain: '#A6E4FF',
                hill: '#86E3CE',
                grass: ['#58D68D', '#27AE60'], 
                dirt: '#8B4513',
                block: '#F39C12',
                blockDark: '#D35400'
            },
            ice: { 
                sky: ['#83a4d4', '#b6fbff'], 
                mountain: '#E0F7FA',
                hill: '#B2EBF2',
                grass: ['#A9DFBF', '#74B9FF'], 
                dirt: '#BDC3C7',
                block: '#74B9FF',
                blockDark: '#0984E3'
            },
            fire: { 
                sky: ['#ff9966', '#ff5e62'], 
                mountain: '#FFCCBC',
                hill: '#FFAB91',
                grass: ['#57606f', '#2f3640'], 
                dirt: '#2f3640',
                block: '#e1b12c',
                blockDark: '#9a7d0a'
            }
        };

        let currentTheme = themes.grass;

        function setTheme(themeName) {
            currentTheme = themes[themeName];
            const root = document.documentElement;
            root.style.setProperty('--c-sky-top', currentTheme.sky[0]);
            root.style.setProperty('--c-sky-bot', currentTheme.sky[1]);
            root.style.setProperty('--c-mountain', currentTheme.mountain);
            root.style.setProperty('--c-hill', currentTheme.hill);
            
            document.querySelectorAll('.world-node').forEach(b => b.classList.remove('active'));
            document.querySelector(`.w-${themeName}`).classList.add('active');
            
            drawLevel();
        }

        // --- RESIZE HANDLING ---
        function resize() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            canvas.logicalWidth = rect.width;
            canvas.logicalHeight = rect.height;
            drawLevel();
        }
        window.addEventListener('resize', resize);

        // --- DRAWING HELPERS (2.5D / Chunky Style) ---
        
        // Helper to draw a 3D-ish block
        function drawBlock3D(x, y, w, h, color, depthColor, topColor) {
            // Top Face (Highlight)
            ctx.fillStyle = topColor || color;
            ctx.fillRect(x, y, w, h);
            
            // Bottom/Side Face (Shadow)
            ctx.fillStyle = depthColor;
            ctx.fillRect(x, y + h, w, 8); // Extrusion depth
            
            // Border
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, w, h);
        }

        function drawPipe(x, y, w, h) {
            const mainGreen = '#2ecc71';
            const darkGreen = '#27ae60';
            const lightGreen = '#58d68d';
            
            // Pipe Body (Cylinder look)
            ctx.fillStyle = mainGreen;
            ctx.fillRect(x + 10, y + 30, w - 20, h - 30);
            // Body Highlight
            ctx.fillStyle = lightGreen;
            ctx.fillRect(x + 15, y + 30, 6, h - 30);
            
            // Pipe Head (Lid)
            ctx.fillStyle = darkGreen;
            ctx.fillRect(x, y, w, 40);
            // Head Extrusion
            ctx.fillStyle = '#1e8449';
            ctx.fillRect(x, y + 40, w, 5);
            
            // Head Highlight
            ctx.fillStyle = lightGreen;
            ctx.fillRect(x + 5, y, 8, 40);
            
            // Outlines
            ctx.strokeStyle = '#145a32';
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, w, 40);
            ctx.strokeRect(x+10, y+30, w-20, h-30);
        }

        function drawFlag(x, y, h) {
            // Pole
            ctx.fillStyle = '#95a5a6';
            ctx.fillRect(x, y, 8, h);
            
            // Top Ball
            ctx.beginPath();
            ctx.arc(x+4, y, 8, 0, Math.PI*2);
            ctx.fillStyle = '#f1c40f';
            ctx.fill();
            ctx.strokeStyle = '#f39c12';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Flag
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.moveTo(x+8, y+10);
            ctx.lineTo(x+70, y+35);
            ctx.lineTo(x+8, y+60);
            ctx.fill();
            
            // Flag Detail
            ctx.fillStyle = '#c0392b';
            ctx.beginPath();
            ctx.moveTo(x+8, y+35);
            ctx.lineTo(x+70, y+35);
            ctx.lineTo(x+8, y+60);
            ctx.fill();
        }

        function drawEnemy(x, y) {
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(x+20, y+30, 15, 5, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Body
            ctx.fillStyle = '#8e44ad';
            ctx.beginPath();
            ctx.arc(x+20, y+15, 18, Math.PI, 0); // Dome
            ctx.lineTo(x+38, y+30);
            ctx.lineTo(x+2, y+30);
            ctx.fill();
            
            // Eyes
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(x+12, y+18, 5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+28, y+18, 5, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(x+12, y+18, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+28, y+18, 2, 0, Math.PI*2); ctx.fill();
        }

        function drawMysteryBlock(x, y, s) {
            // Top Face
            ctx.fillStyle = currentTheme.block;
            ctx.fillRect(x, y, s, s);
            // Extrusion
            ctx.fillStyle = currentTheme.blockDark;
            ctx.fillRect(x, y+s, s, 8);
            
            // Checkerboard/Highlight
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(x, y, s/2, s/2);
            ctx.fillRect(x+s/2, y+s/2, s/2, s/2);
            
            // Border
            ctx.strokeStyle = '#6E2C00';
            ctx.lineWidth = 4;
            ctx.strokeRect(x, y, s, s);
            
            // Question Mark
            ctx.fillStyle = '#FFF';
            ctx.font = `bold ${s*0.7}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('?', x + s/2, y + s/2 + 4);
        }

        function drawCoin(x, y) {
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.ellipse(x, y, 8, 12, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#DAA520';
            ctx.lineWidth = 2;
            ctx.stroke();
            // Shine
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.ellipse(x-2, y-4, 2, 4, 0, 0, Math.PI*2);
            ctx.fill();
        }

        // --- MAIN LEVEL RENDER ---
        function drawLevel() {
            const w = canvas.logicalWidth;
            const h = canvas.logicalHeight;
            
            ctx.clearRect(0, 0, w, h);

            const groundY = h - 100;

            // 1. Draw Ground
            // Grass Top
            ctx.fillStyle = currentTheme.grass[0];
            ctx.fillRect(0, groundY, w, 20);
            // Grass Bottom/Shadow
            ctx.fillStyle = currentTheme.grass[1];
            ctx.fillRect(0, groundY + 20, w, 80);
            // Dirt
            ctx.fillStyle = currentTheme.dirt;
            ctx.fillRect(0, groundY + 40, w, 60);
            
            // Texture Dots
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for(let i=0; i<w; i+=60) {
                ctx.beginPath(); ctx.arc(i+30, groundY+60, 4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(i+10, groundY+80, 4, 0, Math.PI*2); ctx.fill();
            }

            // 2. Platforms & Blocks
            // Mystery Block
            drawMysteryBlock(w * 0.25, groundY - 140, 50);
            
            // Brick Row
            for(let i=0; i<3; i++) {
                drawBlock3D(w * 0.4 + (i*60), groundY - 140, 50, 20, '#A0522D', '#5D2906', currentTheme.grass[0]);
            }

            // High Platform
            drawBlock3D(w * 0.75, groundY - 220, 160, 20, '#A0522D', '#5D2906', currentTheme.grass[0]);

            // 3. Elements
            drawPipe(w * 0.65, groundY - 70, 70, 70);
            drawEnemy(w * 0.5, groundY - 35);
            drawFlag(w * 0.9, groundY - 280, 280);

            // 4. Coins
            drawCoin(w * 0.25 + 25, groundY - 180);
            drawCoin(w * 0.75 + 30, groundY - 260);
            drawCoin(w * 0.75 + 60, groundY - 260);
            drawCoin(w * 0.75 + 90, groundY - 260);

            // 5. Decor (Bushes)
            const drawBush = (x, y, s) => {
                ctx.fillStyle = currentTheme.grass[1];
                ctx.beginPath();
                ctx.arc(x, y, 25*s, 0, Math.PI*2);
                ctx.arc(x+20*s, y, 35*s, 0, Math.PI*2);
                ctx.arc(x+40*s, y, 25*s, 0, Math.PI*2);
                ctx.fill();
            };
            drawBush(w * 0.15, groundY, 1.2);
            drawBush(w * 0.85, groundY, 0.9);
        }

        // --- INTERACTIVITY ---
        const hero = document.getElementById('hero-wrapper');
        const screen = document.getElementById('game-screen');

        // Parallax-ish Hero movement
        screen.addEventListener('mousemove', (e) => {
            const rect = screen.getBoundingClientRect();
            const x = e.clientX - rect.left;
            let percent = (x / rect.width) * 100;
            
            // Clamp hero to left-center area
            if(percent > 40) percent = 40;
            if(percent < 10) percent = 10;
            
            hero.style.left = percent + '%';
            
            // Simple squash/stretch on move
            hero.style.transform = `scaleY(${1 + Math.sin(Date.now()/150)*0.05})`;
        });

        // Initialize
        resize();

    </script>
</body>
</html>
