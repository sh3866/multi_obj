<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce Dash - Adventure</title>
    <style>
        :root {
            /* Palette - Bold & Vibrant */
            --c-sky-top: #3498db;
            --c-sky-bot: #85c1e9;
            --c-cloud: #ffffff;
            --c-mountain-back: #5dade2;
            --c-mountain-front: #2980b9;
            --c-hill-back: #27ae60;
            --c-hill-front: #1e8449;
            --c-ground-top: #58d68d;
            --c-ground-bot: #2ecc71;
            --c-dirt: #d35400;
            --c-dirt-dark: #a04000;
            
            /* UI Colors */
            --c-ui-yellow: #f1c40f;
            --c-ui-yellow-dark: #d4ac0d;
            --c-ui-white: #ffffff;
            --c-ui-black: #2c3e50;
            --c-ui-red: #e74c3c;
            
            /* Style Constants */
            --border-thick: 4px solid var(--c-ui-black);
            --border-thin: 2px solid var(--c-ui-black);
            --shadow-hard: 6px 6px 0px var(--c-ui-black);
            --radius-ui: 12px;
            --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a1a;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-main);
            overflow: hidden;
            color: var(--c-ui-white);
            user-select: none;
        }

        /* Game Screen Container */
        #game-screen {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1920px;
            max-height: 1080px;
            background: linear-gradient(to bottom, var(--c-sky-top), var(--c-sky-bot));
            overflow: hidden;
            box-shadow: 0 0 100px rgba(0,0,0,0.7);
        }

        /* --- PARALLAX LAYERS --- */
        
        /* Layer 1: Sky & Clouds */
        .layer-sky {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .cloud {
            position: absolute;
            background: var(--c-cloud);
            border: var(--border-thick);
            border-radius: 100px;
            opacity: 0.9;
            animation: drift linear infinite;
        }
        .cloud::before, .cloud::after {
            content: ''; position: absolute; background: inherit;
            border: inherit; border-radius: 50%;
            z-index: -1;
        }
        .cloud::before { border-bottom-color: transparent; border-right-color: transparent; }
        .cloud::after { border-bottom-color: transparent; border-left-color: transparent; }

        /* Cloud Variants */
        .c1 { width: 240px; height: 80px; top: 15%; left: -250px; animation-duration: 35s; }
        .c1::before { width: 100px; height: 100px; top: -50px; left: 30px; }
        .c1::after { width: 120px; height: 120px; top: -60px; left: 90px; }
        
        .c2 { width: 180px; height: 60px; top: 25%; left: -200px; animation-duration: 50s; animation-delay: -15s; opacity: 0.7; transform: scale(0.8); }
        .c2::before { width: 80px; height: 80px; top: -40px; left: 20px; }

        .c3 { width: 280px; height: 90px; top: 10%; left: -300px; animation-duration: 40s; animation-delay: -5s; }
        .c3::before { width: 120px; height: 120px; top: -60px; left: 40px; }
        .c3::after { width: 140px; height: 140px; top: -70px; left: 110px; }

        @keyframes drift {
            0% { transform: translateX(-300px); }
            100% { transform: translateX(120vw); }
        }

        /* Layer 2: Mountains (Mid-Background) */
        .layer-mountains {
            position: absolute;
            bottom: 15%; left: 0; width: 100%; height: 50%;
            z-index: 2;
            pointer-events: none;
        }
        .mountain {
            position: absolute;
            bottom: 0;
            border-radius: 50% 50% 0 0;
            background: var(--c-mountain-back);
            border-top: var(--border-thick);
            border-left: var(--border-thick);
            border-right: var(--border-thick);
            /* No bottom border to blend with hills */
        }
        .m1 { left: -5%; width: 60%; height: 80%; background: var(--c-mountain-back); opacity: 0.8; }
        .m2 { left: 30%; width: 50%; height: 60%; background: var(--c-mountain-front); z-index: 3; }
        .m3 { right: -10%; width: 70%; height: 90%; background: var(--c-mountain-back); opacity: 0.9; }

        /* Layer 3: Hills (Foreground Back) */
        .layer-hills {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 200px;
            z-index: 4;
            pointer-events: none;
        }
        .hill {
            position: absolute;
            bottom: 0;
            border-radius: 100% 100% 0 0;
            border-top: var(--border-thick);
            border-left: var(--border-thick);
            border-right: var(--border-thick);
        }
        .h1 { left: -10%; width: 50%; height: 150px; background: var(--c-hill-back); }
        .h2 { right: -10%; width: 60%; height: 180px; background: var(--c-hill-front); z-index: 5; }

        /* Layer 4: Canvas (The Level) */
        #level-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* Layer 5: Hero */
        #hero-wrapper {
            position: absolute;
            left: 35%; 
            bottom: 28%; 
            z-index: 15; 
            width: 100px;
            height: 100px;
            pointer-events: none;
            /* Bounce Animation */
            animation: heroJump 2s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
        }
        
        /* Hero Shadow (on ground) */
        #hero-shadow {
            position: absolute;
            bottom: -28%; /* Relative to wrapper position */
            left: 35%;
            width: 60px;
            height: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            z-index: 9;
            transform: translateX(-50%);
            animation: shadowScale 2s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
        }

        @keyframes heroJump {
            0%, 100% { transform: translateY(0) scaleY(1) scaleX(1); }
            10% { transform: translateY(10px) scaleY(0.85) scaleX(1.15); } /* Squash */
            40% { transform: translateY(-100px) scaleY(1.1) scaleX(0.9); } /* Air */
            60% { transform: translateY(-100px) scaleY(1.1) scaleX(0.9); } /* Hang */
            90% { transform: translateY(5px) scaleY(0.9) scaleX(1.1); } /* Land */
        }
        @keyframes shadowScale {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.3; }
            50% { transform: translateX(-50%) scale(0.5); opacity: 0.1; }
        }

        /* --- BOLD FLAT UI --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 30;
            pointer-events: none; /* Let clicks pass to canvas if needed */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        /* Common UI Panel Style */
        .ui-panel {
            background: var(--c-ui-white);
            border: var(--border-thick);
            border-radius: var(--radius-ui);
            box-shadow: var(--shadow-hard);
            pointer-events: auto;
            transition: transform 0.2s;
        }
        .ui-panel:active {
            transform: translate(2px, 2px);
            box-shadow: 4px 4px 0px var(--c-ui-black);
        }

        /* Header: Title */
        .header-area {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            width: 100%;
        }
        
        .game-title {
            font-size: 5rem;
            font-weight: 900;
            color: var(--c-ui-yellow);
            text-transform: uppercase;
            line-height: 0.85;
            letter-spacing: -2px;
            text-shadow: 4px 4px 0px var(--c-ui-black);
            transform: skewX(-5deg);
            margin-left: -4px; /* Optical alignment */
        }
        .game-title span {
            display: block;
            color: var(--c-ui-white);
            text-shadow: 4px 4px 0px var(--c-ui-red);
            font-size: 6rem;
        }

        /* Header: Counters */
        .counters-container {
            display: flex;
            gap: 20px;
        }
        .counter-box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: var(--c-ui-white);
            color: var(--c-ui-black);
            font-weight: 900;
            font-size: 1.5rem;
            min-width: 120px;
            justify-content: center;
        }
        .counter-icon {
            width: 24px; height: 24px;
            border-radius: 50%;
            border: 2px solid var(--c-ui-black);
        }
        .icon-coin { background: var(--c-ui-yellow); }
        .icon-star { background: var(--c-ui-red); clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); background: #f1c40f; border: none; }

        /* Bottom Area */
        .bottom-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
        }

        /* World Selector */
        .world-selector {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            gap: 10px;
        }
        .world-label {
            font-weight: 800;
            color: var(--c-ui-black);
            margin-right: 5px;
            font-size: 1rem;
            text-transform: uppercase;
        }
        .world-dot {
            width: 24px; height: 24px;
            border-radius: 50%;
            border: 3px solid var(--c-ui-black);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .world-dot:hover { transform: scale(1.2); }
        .world-dot.active {
            background: var(--c-ui-white);
            box-shadow: inset 0 0 0 4px var(--c-ui-black);
        }
        .w-grass { background: #2ecc71; }
        .w-ice { background: #3498db; }
        .w-fire { background: #e74c3c; }

        /* Controls Guide */
        .controls-guide {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px 20px;
            background: var(--c-ui-white);
            transform: rotate(2deg);
        }
        .control-row {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--c-ui-black);
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        .key-icon {
            background: #ecf0f1;
            border: 2px solid var(--c-ui-black);
            border-bottom: 4px solid var(--c-ui-black);
            border-radius: 6px;
            width: 24px; height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }
        .key-space { width: 60px; }

        /* Start Button */
        .start-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            z-index: 40;
        }
        .start-btn {
            background: var(--c-ui-yellow);
            color: var(--c-ui-black);
            border: var(--border-thick);
            padding: 16px 48px;
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 50px; /* Pill shape */
            cursor: pointer;
            box-shadow: var(--shadow-hard);
            transition: all 0.1s;
            font-family: var(--font-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .start-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px var(--c-ui-black);
            background: #f4d03f;
        }
        .start-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0px var(--c-ui-black);
        }
        .play-icon {
            width: 0; height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 16px solid var(--c-ui-black);
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .game-title { font-size: 3rem; }
            .game-title span { font-size: 3.5rem; }
            .ui-layer { padding: 20px; }
            .controls-guide { display: none; } /* Hide controls on small screens */
            .start-btn { padding: 12px 32px; font-size: 1.4rem; }
        }

    </style>
</head>
<body>

    <div id="game-screen">
        
        <!-- LAYER 1: SKY & CLOUDS -->
        <div class="layer-sky">
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="cloud c3"></div>
        </div>

        <!-- LAYER 2: MOUNTAINS -->
        <div class="layer-mountains">
            <div class="mountain m1"></div>
            <div class="mountain m2"></div>
            <div class="mountain m3"></div>
        </div>

        <!-- LAYER 3: HILLS -->
        <div class="layer-hills">
            <div class="hill h1"></div>
            <div class="hill h2"></div>
        </div>

        <!-- LAYER 4: GAMEPLAY CANVAS -->
        <canvas id="level-canvas"></canvas>

        <!-- HERO CHARACTER (SVG) -->
        <div id="hero-shadow"></div>
        <div id="hero-wrapper">
            <svg class="hero-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Legs -->
                <path d="M35 70 L30 90 L45 90 L50 70" fill="#C0392B" stroke="#2c3e50" stroke-width="3" stroke-linejoin="round"/>
                <path d="M65 70 L70 90 L55 90 L50 70" fill="#E74C3C" stroke="#2c3e50" stroke-width="3" stroke-linejoin="round"/>
                <!-- Body -->
                <circle cx="50" cy="50" r="38" fill="#E74C3C" stroke="#2c3e50" stroke-width="4" />
                <!-- Eyes -->
                <g fill="white" stroke="#2c3e50" stroke-width="2">
                    <ellipse cx="38" cy="42" rx="8" ry="12" />
                    <ellipse cx="62" cy="42" rx="8" ry="12" />
                </g>
                <!-- Pupils -->
                <g fill="#2c3e50">
                    <circle cx="42" cy="42" r="4" />
                    <circle cx="66" cy="42" r="4" />
                </g>
                <!-- Mouth -->
                <path d="M40 62 Q 50 70 60 62" stroke="#2c3e50" stroke-width="3" fill="none" stroke-linecap="round" />
                <!-- Hat -->
                <path d="M25 20 L 50 5 L 75 20 Z" fill="#F1C40F" stroke="#2c3e50" stroke-width="3" stroke-linejoin="round" />
                <rect x="20" y="20" width="60" height="10" rx="4" fill="#F1C40F" stroke="#2c3e50" stroke-width="3" />
                <circle cx="50" cy="5" r="6" fill="#E74C3C" stroke="#2c3e50" stroke-width="3" />
            </svg>
        </div>

        <!-- UI LAYER -->
        <div class="ui-layer">
            <header class="header-area">
                <div class="game-title">BOUNCE<br><span>DASH</span></div>
                
                <div class="counters-container">
                    <div class="counter-box ui-panel">
                        <div class="counter-icon icon-coin"></div>
                        <div>042</div>
                    </div>
                    <div class="counter-box ui-panel">
                        <div class="counter-icon icon-star"></div>
                        <div>03</div>
                    </div>
                </div>
            </header>

            <div class="bottom-area">
                <!-- World Selector -->
                <div class="world-selector ui-panel">
                    <div class="world-label">World</div>
                    <div class="world-dot w-grass active" onclick="setTheme('grass')"></div>
                    <div class="world-dot w-ice" onclick="setTheme('ice')"></div>
                    <div class="world-dot w-fire" onclick="setTheme('fire')"></div>
                </div>

                <!-- Controls -->
                <div class="controls-guide ui-panel">
                    <div class="control-row">
                        <span>Move</span>
                        <div class="key-icon">←</div>
                        <div class="key-icon">→</div>
                    </div>
                    <div class="control-row">
                        <span>Jump</span>
                        <div class="key-icon key-space">SPACE</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Start Button -->
        <div class="start-container">
            <button class="start-btn">
                <div class="play-icon"></div>
                Start Adventure
            </button>
        </div>

    </div>

    <script>
        // --- CANVAS SETUP ---
        const canvas = document.getElementById('level-canvas');
        const ctx = canvas.getContext('2d');
        
        // Theme Configurations
        const themes = {
            grass: { 
                sky: ['#3498db', '#85c1e9'], 
                mBack: '#5dade2', mFront: '#2980b9',
                hBack: '#27ae60', hFront: '#1e8449',
                gTop: '#58d68d', gBot: '#2ecc71', 
                dirt: '#d35400', dirtDark: '#a04000',
                block: '#f1c40f', blockDark: '#d4ac0d'
            },
            ice: { 
                sky: ['#83a4d4', '#b6fbff'], 
                mBack: '#d6eaf8', mFront: '#aed6f1',
                hBack: '#a9dfbf', hFront: '#74b9ff',
                gTop: '#d4e6f1', gBot: '#a9cce3', 
                dirt: '#bdc3c7', dirtDark: '#95a5a6',
                block: '#74b9ff', blockDark: '#0984e3'
            },
            fire: { 
                sky: ['#ff9966', '#ff5e62'], 
                mBack: '#ffccbc', mFront: '#ff8a65',
                hBack: '#57606f', hFront: '#2f3640',
                gTop: '#34495e', gBot: '#2c3e50', 
                dirt: '#2f3640', dirtDark: '#17202a',
                block: '#f39c12', blockDark: '#d35400'
            }
        };

        let currentTheme = themes.grass;

        function setTheme(themeName) {
            currentTheme = themes[themeName];
            const root = document.documentElement;
            root.style.setProperty('--c-sky-top', currentTheme.sky[0]);
            root.style.setProperty('--c-sky-bot', currentTheme.sky[1]);
            root.style.setProperty('--c-mountain-back', currentTheme.mBack);
            root.style.setProperty('--c-mountain-front', currentTheme.mFront);
            root.style.setProperty('--c-hill-back', currentTheme.hBack);
            root.style.setProperty('--c-hill-front', currentTheme.hFront);
            root.style.setProperty('--c-ground-top', currentTheme.gTop);
            root.style.setProperty('--c-ground-bot', currentTheme.gBot);
            
            document.querySelectorAll('.world-dot').forEach(b => b.classList.remove('active'));
            document.querySelector(`.w-${themeName}`).classList.add('active');
            
            drawLevel();
        }

        // --- RESIZE HANDLING ---
        function resize() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            canvas.logicalWidth = rect.width;
            canvas.logicalHeight = rect.height;
            drawLevel();
        }
        window.addEventListener('resize', resize);

        // --- DRAWING HELPERS (Bold Flat Style) ---
        
        function drawRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, w, h);
        }

        function drawBlock3D(x, y, w, h, topColor, sideColor) {
            // Top Face
            ctx.fillStyle = topColor;
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, w, h);
            
            // Bottom Extrusion (The "depth")
            ctx.fillStyle = sideColor;
            ctx.fillRect(x, y + h, w, 12);
            ctx.beginPath();
            ctx.moveTo(x, y+h);
            ctx.lineTo(x, y+h+12);
            ctx.lineTo(x+w, y+h+12);
            ctx.lineTo(x+w, y+h);
            ctx.stroke();
        }

        function drawPipe(x, y, w, h) {
            const main = '#2ecc71';
            const dark = '#27ae60';
            const light = '#58d68d';
            
            // Pipe Body
            drawRect(x + 10, y + 30, w - 20, h - 30, main);
            // Highlight
            ctx.fillStyle = light;
            ctx.fillRect(x + 15, y + 30, 8, h - 30);
            
            // Pipe Top
            drawRect(x, y, w, 40, main);
            // Top Highlight
            ctx.fillStyle = light;
            ctx.fillRect(x + 5, y + 5, 10, 30);
            
            // Dark Rim at junction
            ctx.fillStyle = '#1e8449';
            ctx.fillRect(x, y + 40, w, 6);
        }

        function drawFlag(x, y, h) {
            // Pole
            drawRect(x, y, 8, h, '#95a5a6');
            
            // Top Ball
            ctx.beginPath();
            ctx.arc(x+4, y, 10, 0, Math.PI*2);
            ctx.fillStyle = '#f1c40f';
            ctx.fill();
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // Flag (Triangle)
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.moveTo(x+8, y+15);
            ctx.lineTo(x+60, y+35);
            ctx.lineTo(x+8, y+65);
            ctx.fill();
            ctx.stroke();
        }

        function drawEnemy(x, y) {
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(x+20, y+35, 20, 8, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Body (Mushroom shape)
            ctx.fillStyle = '#8e44ad';
            ctx.beginPath();
            ctx.arc(x+20, y+15, 25, Math.PI, 0); // Top dome
            ctx.lineTo(x+45, y+35);
            ctx.lineTo(x-5, y+35);
            ctx.fill();
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // Spots
            ctx.fillStyle = '#9b59b6';
            ctx.beginPath(); ctx.arc(x+10, y+5, 5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+30, y+5, 4, 0, Math.PI*2); ctx.fill();
            
            // Eyes
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(x+10, y+20, 6, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+30, y+20, 6, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(x+12, y+20, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+32, y+20, 2, 0, Math.PI*2); ctx.fill();
        }

        function drawMysteryBlock(x, y, s) {
            drawBlock3D(x, y, s, s, currentTheme.block, currentTheme.blockDark);
            
            // Question Mark
            ctx.fillStyle = '#fff';
            ctx.font = `900 ${s*0.7}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 4;
            ctx.strokeText('?', x + s/2, y + s/2 + 4);
            ctx.fillText('?', x + s/2, y + s/2 + 4);
            
            // Dots on corners
            const dotSize = 4;
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(x+4, y+4, dotSize, dotSize);
            ctx.fillRect(x+s-4-dotSize, y+4, dotSize, dotSize);
            ctx.fillRect(x+4, y+s-4-dotSize, dotSize, dotSize);
            ctx.fillRect(x+s-4-dotSize, y+s-4-dotSize, dotSize, dotSize);
        }

        function drawCoin(x, y) {
            ctx.fillStyle = '#F1C40F';
            ctx.beginPath();
            ctx.ellipse(x, y, 10, 14, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // Shine
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.ellipse(x-3, y-5, 2, 5, -0.2, 0, Math.PI*2);
            ctx.fill();
        }

        // --- MAIN LEVEL RENDER ---
        function drawLevel() {
            const w = canvas.logicalWidth;
            const h = canvas.logicalHeight;
            
            ctx.clearRect(0, 0, w, h);

            // Ground Level (Midground floor)
            const groundY = h * 0.75;

            // 1. Draw Ground
            // Top Grass
            ctx.fillStyle = currentTheme.gTop;
            ctx.fillRect(0, groundY, w, 30);
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(w, groundY); ctx.stroke();

            // Dirt
            ctx.fillStyle = currentTheme.dirt;
            ctx.fillRect(0, groundY + 30, w, 100);
            
            // Dirt Texture (Dots)
            ctx.fillStyle = currentTheme.dirtDark;
            for(let i=0; i<w; i+=60) {
                ctx.beginPath(); ctx.arc(i+30, groundY+60, 4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(i+10, groundY+90, 4, 0, Math.PI*2); ctx.fill();
            }

            // 2. Platforms
            // Low Platform (Hero stands here)
            drawBlock3D(w * 0.2, groundY - 120, 220, 25, currentTheme.gTop, currentTheme.dirt);
            
            // High Platform
            drawBlock3D(w * 0.75, groundY - 220, 180, 25, currentTheme.gTop, currentTheme.dirt);
            
            // Mystery Block above hero
            drawMysteryBlock(w * 0.25, groundY - 190, 50);

            // 3. Elements
            drawPipe(w * 0.65, groundY - 80, 80, 80);
            drawEnemy(w * 0.5, groundY - 40);
            
            // Goal Flag (Far Right)
            drawFlag(w * 0.92, groundY - 300, 300);

            // 4. Coins
            drawCoin(w * 0.25 + 25, groundY - 230);
            drawCoin(w * 0.75 + 40, groundY - 260);
            drawCoin(w * 0.75 + 80, groundY - 260);
            drawCoin(w * 0.75 + 120, groundY - 260);

            // 5. Decor (Bushes)
            const drawBush = (x, y, s) => {
                ctx.fillStyle = currentTheme.gBot;
                ctx.beginPath();
                ctx.arc(x, y, 25*s, 0, Math.PI*2);
                ctx.arc(x+25*s, y, 35*s, 0, Math.PI*2);
                ctx.arc(x+50*s, y, 25*s, 0, Math.PI*2);
                ctx.fill();
                ctx.strokeStyle = '#2c3e50';
                ctx.lineWidth = 3;
                ctx.stroke();
            };
            drawBush(w * 0.15, groundY, 1.2);
            drawBush(w * 0.85, groundY, 0.9);
        }

        // --- INTERACTIVITY ---
        const hero = document.getElementById('hero-wrapper');
        const shadow = document.getElementById('hero-shadow');
        const screen = document.getElementById('game-screen');

        // Parallax-ish Hero movement
        screen.addEventListener('mousemove', (e) => {
            const rect = screen.getBoundingClientRect();
            const x = e.clientX - rect.left;
            let percent = (x / rect.width) * 100;
            
            // Clamp hero to left-center area
            if(percent > 45) percent = 45;
            if(percent < 10) percent = 10;
            
            hero.style.left = percent + '%';
            shadow.style.left = percent + '%';
        });

        // Initialize
        resize();

    </script>
</body>
</html>
