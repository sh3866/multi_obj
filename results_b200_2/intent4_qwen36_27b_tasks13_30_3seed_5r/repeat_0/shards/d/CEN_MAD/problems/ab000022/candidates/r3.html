<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce Dash - Adventure</title>
    <style>
        :root {
            /* Palette - Updated for vibrant depth */
            --c-sky-top: #4FACFE;
            --c-sky-bot: #00F2FE;
            --c-mountain: #A6E4FF;
            --c-hill: #86E3CE;
            --c-grass-top: #58D68D;
            --c-grass-bot: #27AE60;
            --c-dirt: #8B4513;
            --c-dirt-dark: #5D2906;
            --c-block: #F39C12;
            --c-block-dark: #D35400;
            --c-accent: #FFD700;
            --c-hero: #FF4757;
            --c-hero-dark: #C41E3A;
            --c-text: #FFFFFF;
            
            /* Glassmorphism Vars */
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-blur: blur(12px);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            
            /* Lighting */
            --shadow-2d: 4px 6px 0px rgba(0,0,0,0.2);
            --shadow-float: 0px 15px 25px rgba(0,0,0,0.2);
            
            --radius-lg: 24px;
            --radius-md: 16px;
            
            --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #111;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-main);
            overflow: hidden;
            color: var(--c-text);
        }

        /* Game Screen Container */
        #game-screen {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1920px;
            max-height: 1080px;
            background: linear-gradient(to bottom, var(--c-sky-top), var(--c-sky-bot));
            overflow: hidden;
            box-shadow: 0 0 80px rgba(0,0,0,0.5);
            transition: background 0.5s ease;
        }

        /* --- RECONSTRUCTED SCENE DEPTH --- */
        
        /* Layer 1: Far Background (Clouds & Mountains) */
        .layer-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .clouds { position: absolute; width: 100%; height: 60%; }
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 100px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.05);
            animation: drift linear infinite;
        }
        .c1 { width: 200px; height: 70px; top: 12%; left: -200px; animation-duration: 45s; }
        .c1::before { content:''; position:absolute; width:100px; height:100px; background:inherit; border-radius:50%; top:-50px; left:30px; }
        .c1::after { content:''; position:absolute; width:80px; height:80px; background:inherit; border-radius:50%; top:-30px; left:100px; }
        
        .c2 { width: 160px; height: 60px; top: 22%; left: -150px; animation-duration: 60s; opacity: 0.6; animation-delay: -20s; }
        .c2::before { content:''; position:absolute; width:80px; height:80px; background:inherit; border-radius:50%; top:-40px; left:20px; }

        .mountains {
            position: absolute;
            bottom: 150px; /* Sit above the mid-ground floor */
            width: 100%;
            height: 400px;
        }
        .mountain {
            position: absolute;
            bottom: 0;
            width: 0; height: 0;
            border-left: 300px solid transparent;
            border-right: 300px solid transparent;
            border-bottom: 500px solid var(--c-mountain);
            filter: drop-shadow(10px 0 10px rgba(0,0,0,0.05));
        }
        .m1 { left: -5%; transform: scale(1.3); opacity: 0.8; }
        .m2 { left: 40%; transform: scale(1.1); opacity: 0.7; }
        .m3 { right: -10%; transform: scale(1.4); opacity: 0.9; }


        /* Layer 2: Mid-ground (The Gameplay Area - Canvas) */
        #level-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to UI */
        }

        /* Layer 3: Foreground (Framing) */
        .layer-fg {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 100%;
            z-index: 20;
            pointer-events: none;
        }
        .foreground-grass {
            position: absolute;
            bottom: -20px;
            width: 100%;
            height: 120px;
            background: linear-gradient(to bottom, var(--c-grass-top), var(--c-grass-bot));
            border-top: 6px solid rgba(255,255,255,0.3);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
            z-index: 20;
        }
        /* Decorative bushes in foreground */
        .fg-bush {
            position: absolute;
            bottom: 60px;
            background: var(--c-grass-bot);
            border-radius: 40px 40px 0 0;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }
        .fg-bush.left { left: -20px; width: 200px; height: 80px; }
        .fg-bush.right { right: 40px; width: 250px; height: 100px; }


        /* --- HERO (Redesigned) --- */
        #hero-wrapper {
            position: absolute;
            /* Positioned dynamically via JS to sit on a platform */
            left: 30%; 
            bottom: 28%; 
            z-index: 15; /* Between Midground and Foreground */
            width: 120px;
            height: 120px;
            filter: var(--shadow-float);
            pointer-events: none;
        }

        .hero-svg {
            width: 100%;
            height: 100%;
            /* Jump animation */
            animation: heroJump 2.5s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
        }

        @keyframes heroJump {
            0%, 100% { transform: translateY(0) scaleY(1) scaleX(1); }
            10% { transform: translateY(10px) scaleY(0.9) scaleX(1.1); } /* Squash */
            40% { transform: translateY(-80px) scaleY(1.1) scaleX(0.9); } /* Stretch/Air */
            60% { transform: translateY(-80px) scaleY(1.1) scaleX(0.9); } /* Hang time */
            90% { transform: translateY(5px) scaleY(0.9) scaleX(1.1); } /* Landing */
        }
        
        /* --- UNIFIED UI LANGUAGE (Glassmorphism) --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 30;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            pointer-events: none;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            box-shadow: var(--glass-shadow);
            pointer-events: auto;
        }

        /* Header */
        header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            pointer-events: none;
        }

        .game-title {
            font-size: 5rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            line-height: 0.9;
            letter-spacing: -2px;
            position: relative;
            /* Clean 3D text */
            text-shadow: 0px 4px 0px #C41E3A, 0px 8px 20px rgba(0,0,0,0.3);
            transform: skewX(-5deg);
            margin-bottom: 15px;
        }
        
        /* Consolidated Counters */
        .counter-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            width: fit-content;
            color: #fff;
        }

        .coin-icon {
            width: 28px;
            height: 28px;
            background: radial-gradient(circle at 30% 30%, #FFD700, #F39C12);
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #D35400;
            font-size: 1rem;
        }

        .counter-text {
            font-size: 1.5rem;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            font-variant-numeric: tabular-nums;
        }

        /* Bottom Section */
        .bottom-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            pointer-events: none;
        }

        /* World Selector (Cleaner) */
        .world-selector {
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 0;
        }

        .world-node {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 3px solid #fff;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .world-connector {
            width: 30px; height: 4px;
            background: rgba(255,255,255,0.4);
            border-radius: 2px;
        }
        .world-node:hover { transform: translateY(-3px); }
        .world-node.active { 
            transform: scale(1.2) translateY(-3px); 
            border-color: #FFD700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }
        
        .w-grass { background: linear-gradient(135deg, #58D68D, #27AE60); }
        .w-ice { background: linear-gradient(135deg, #74B9FF, #0984E3); }
        .w-fire { background: linear-gradient(135deg, #FF7675, #D63031); }

        /* Relocated Controls (Bottom Right) */
        .controls-guide {
            padding: 12px 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0.8; /* Reduced weight */
            transition: opacity 0.3s;
            transform: rotate(-2deg); /* Playful tilt */
        }
        .controls-guide:hover { opacity: 1; }

        .key-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        
        /* Dark Keycaps */
        .key {
            background: #333;
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 800;
            box-shadow: 0 3px 0 #000, 0 4px 5px rgba(0,0,0,0.3);
            font-size: 0.8rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        /* --- REDESIGNED START BUTTON (Diegetic Block) --- */
        .start-container {
            position: absolute;
            bottom: 140px; /* Above foreground */
            left: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            z-index: 40;
        }
        
        .start-btn {
            /* Gamified Block Style */
            background: linear-gradient(to bottom, #FFD700 0%, #FFA500 100%);
            color: #fff;
            border: none;
            padding: 20px 60px;
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            transform-origin: center;
            
            /* 3D Block Shadow */
            box-shadow: 
                0 15px 0 #D35400, /* Extrusion */
                0 25px 20px rgba(0,0,0,0.3), /* Drop Shadow */
                inset 0 4px 0 rgba(255,255,255,0.6); /* Highlight */
            
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            text-shadow: 0 2px 0 rgba(0,0,0,0.2);
            font-family: var(--font-main);
        }
        
        .start-btn:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 19px 0 #D35400, 
                0 35px 30px rgba(0,0,0,0.4),
                inset 0 4px 0 rgba(255,255,255,0.6);
            filter: brightness(1.1);
        }
        
        .start-btn:active {
            transform: translateY(10px);
            box-shadow: 
                0 5px 0 #D35400, 
                0 10px 10px rgba(0,0,0,0.3),
                inset 0 4px 0 rgba(255,255,255,0.6);
        }

        /* Question Mark on Button */
        .start-btn::before {
            content: '?';
            position: absolute;
            top: -20px; left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            color: #FFD700;
            text-shadow: 0 4px 10px rgba(0,0,0,0.2);
            animation: floatQ 2s ease-in-out infinite;
        }

        @keyframes floatQ {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        @keyframes drift {
            0% { transform: translateX(-200px); }
            100% { transform: translateX(120vw); }
        }

    </style>
</head>
<body>

    <div id="game-screen">
        
        <!-- LAYER 1: FAR BACKGROUND -->
        <div class="layer-bg">
            <div class="clouds">
                <div class="cloud c1"></div>
                <div class="cloud c2"></div>
            </div>
            <div class="mountains">
                <div class="mountain m1"></div>
                <div class="mountain m2"></div>
                <div class="mountain m3"></div>
            </div>
        </div>

        <!-- LAYER 2: MID-GROUND (The Level) -->
        <canvas id="level-canvas"></canvas>

        <!-- HERO CHARACTER -->
        <div id="hero-wrapper">
            <svg class="hero-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Shadow -->
                <ellipse cx="50" cy="95" rx="25" ry="6" fill="rgba(0,0,0,0.3)" />
                <!-- Body Group -->
                <g transform="translate(0, 0)">
                    <!-- Legs (Active Pose) -->
                    <path d="M35 75 L30 90 L45 90 L50 75" fill="#C41E3A" />
                    <path d="M65 75 L70 90 L55 90 L50 75" fill="#C41E3A" />
                    <!-- Main Ball -->
                    <circle cx="50" cy="50" r="40" fill="#FF4757" stroke="#C41E3A" stroke-width="3" />
                    <!-- Shine -->
                    <path d="M25 30 Q 50 10 75 30" stroke="rgba(255,255,255,0.4)" stroke-width="6" fill="none" stroke-linecap="round" />
                    <!-- Eyes -->
                    <ellipse cx="40" cy="45" rx="6" ry="9" fill="white" />
                    <ellipse cx="60" cy="45" rx="6" ry="9" fill="white" />
                    <circle cx="42" cy="45" r="3" fill="black" />
                    <circle cx="62" cy="45" r="3" fill="black" />
                    <!-- Mouth (Smile) -->
                    <path d="M40 65 Q 50 72 60 65" stroke="black" stroke-width="3" fill="none" stroke-linecap="round" />
                    <!-- Hat -->
                    <path d="M30 20 L 50 5 L 70 20 Z" fill="#FFD700" stroke="#E67E22" stroke-width="2" stroke-linejoin="round" />
                    <rect x="20" y="20" width="60" height="8" rx="4" fill="#FFD700" stroke="#E67E22" stroke-width="2" />
                </g>
            </svg>
        </div>

        <!-- LAYER 3: FOREGROUND -->
        <div class="layer-fg">
            <div class="foreground-grass"></div>
            <div class="fg-bush left"></div>
            <div class="fg-bush right"></div>
        </div>

        <!-- UI LAYER -->
        <div class="ui-layer">
            <header>
                <div class="game-title">BOUNCE<br>DASH</div>
                
                <!-- Consolidated Counter (Top Left) -->
                <div class="counter-panel glass-panel">
                    <div class="coin-icon">$</div>
                    <div class="counter-text">042 <span style="opacity:0.7; font-size:0.8em">/ 100</span></div>
                </div>
            </header>

            <div class="bottom-area">
                <!-- World Selector -->
                <div class="world-selector glass-panel">
                    <div class="world-node w-grass active" onclick="setTheme('grass')" title="Green Hills"></div>
                    <div class="world-connector"></div>
                    <div class="world-node w-ice" onclick="setTheme('ice')" title="Ice Peaks"></div>
                    <div class="world-connector"></div>
                    <div class="world-node w-fire" onclick="setTheme('fire')" title="Lava Lands"></div>
                </div>

                <!-- Relocated Controls (Bottom Right) -->
                <div class="controls-guide glass-panel">
                    <div class="key-row"><span>Move</span> <span class="key">←</span> <span class="key">→</span></div>
                    <div class="key-row"><span>Jump</span> <span class="key">SPACE</span></div>
                </div>
            </div>
        </div>

        <!-- Start Button -->
        <div class="start-container">
            <button class="start-btn">Start Adventure</button>
        </div>

    </div>

    <script>
        // --- CANVAS SETUP ---
        const canvas = document.getElementById('level-canvas');
        const ctx = canvas.getContext('2d');
        
        // Theme Configurations
        const themes = {
            grass: { 
                sky: ['#4FACFE', '#00F2FE'], 
                mountain: '#A6E4FF',
                hill: '#86E3CE',
                grass: ['#58D68D', '#27AE60'], 
                dirt: '#8B4513',
                block: '#F39C12',
                blockDark: '#D35400'
            },
            ice: { 
                sky: ['#83a4d4', '#b6fbff'], 
                mountain: '#E0F7FA',
                hill: '#B2EBF2',
                grass: ['#A9DFBF', '#74B9FF'], 
                dirt: '#BDC3C7',
                block: '#74B9FF',
                blockDark: '#0984E3'
            },
            fire: { 
                sky: ['#ff9966', '#ff5e62'], 
                mountain: '#FFCCBC',
                hill: '#FFAB91',
                grass: ['#57606f', '#2f3640'], 
                dirt: '#2f3640',
                block: '#e1b12c',
                blockDark: '#9a7d0a'
            }
        };

        let currentTheme = themes.grass;

        function setTheme(themeName) {
            currentTheme = themes[themeName];
            const root = document.documentElement;
            root.style.setProperty('--c-sky-top', currentTheme.sky[0]);
            root.style.setProperty('--c-sky-bot', currentTheme.sky[1]);
            root.style.setProperty('--c-mountain', currentTheme.mountain);
            root.style.setProperty('--c-hill', currentTheme.hill);
            root.style.setProperty('--c-grass-top', currentTheme.grass[0]);
            root.style.setProperty('--c-grass-bot', currentTheme.grass[1]);
            
            document.querySelectorAll('.world-node').forEach(b => b.classList.remove('active'));
            document.querySelector(`.w-${themeName}`).classList.add('active');
            
            drawLevel();
        }

        // --- RESIZE HANDLING ---
        function resize() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            canvas.logicalWidth = rect.width;
            canvas.logicalHeight = rect.height;
            drawLevel();
        }
        window.addEventListener('resize', resize);

        // --- DRAWING HELPERS ---
        
        function drawBlock3D(x, y, w, h, color, depthColor, topColor) {
            ctx.fillStyle = topColor || color;
            ctx.fillRect(x, y, w, h);
            ctx.fillStyle = depthColor;
            ctx.fillRect(x, y + h, w, 10); // Extrusion
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, w, h);
        }

        function drawPipe(x, y, w, h) {
            const mainGreen = '#2ecc71';
            const darkGreen = '#27ae60';
            const lightGreen = '#58d68d';
            
            ctx.fillStyle = mainGreen;
            ctx.fillRect(x + 10, y + 30, w - 20, h - 30);
            ctx.fillStyle = lightGreen;
            ctx.fillRect(x + 15, y + 30, 6, h - 30);
            
            ctx.fillStyle = darkGreen;
            ctx.fillRect(x, y, w, 40);
            ctx.fillStyle = '#1e8449';
            ctx.fillRect(x, y + 40, w, 5);
            ctx.fillStyle = lightGreen;
            ctx.fillRect(x + 5, y, 8, 40);
            
            ctx.strokeStyle = '#145a32';
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, w, 40);
            ctx.strokeRect(x+10, y+30, w-20, h-30);
        }

        function drawFlag(x, y, h) {
            // Pole
            ctx.fillStyle = '#95a5a6';
            ctx.fillRect(x, y, 8, h);
            
            // Top Ball
            ctx.beginPath();
            ctx.arc(x+4, y, 8, 0, Math.PI*2);
            ctx.fillStyle = '#f1c40f';
            ctx.fill();
            ctx.strokeStyle = '#f39c12';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Flag
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.moveTo(x+8, y+10);
            ctx.lineTo(x+70, y+35);
            ctx.lineTo(x+8, y+60);
            ctx.fill();
            
            ctx.fillStyle = '#c0392b';
            ctx.beginPath();
            ctx.moveTo(x+8, y+35);
            ctx.lineTo(x+70, y+35);
            ctx.lineTo(x+8, y+60);
            ctx.fill();
        }

        function drawEnemy(x, y) {
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(x+20, y+30, 15, 5, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Body
            ctx.fillStyle = '#8e44ad';
            ctx.beginPath();
            ctx.arc(x+20, y+15, 18, Math.PI, 0);
            ctx.lineTo(x+38, y+30);
            ctx.lineTo(x+2, y+30);
            ctx.fill();
            
            // Eyes
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(x+12, y+18, 5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+28, y+18, 5, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(x+12, y+18, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+28, y+18, 2, 0, Math.PI*2); ctx.fill();
        }

        function drawMysteryBlock(x, y, s) {
            ctx.fillStyle = currentTheme.block;
            ctx.fillRect(x, y, s, s);
            ctx.fillStyle = currentTheme.blockDark;
            ctx.fillRect(x, y+s, s, 8);
            
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(x, y, s/2, s/2);
            ctx.fillRect(x+s/2, y+s/2, s/2, s/2);
            
            ctx.strokeStyle = '#6E2C00';
            ctx.lineWidth = 4;
            ctx.strokeRect(x, y, s, s);
            
            ctx.fillStyle = '#FFF';
            ctx.font = `bold ${s*0.7}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('?', x + s/2, y + s/2 + 4);
        }

        function drawCoin(x, y) {
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.ellipse(x, y, 8, 12, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#DAA520';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.ellipse(x-2, y-4, 2, 4, 0, 0, Math.PI*2);
            ctx.fill();
        }

        // --- MAIN LEVEL RENDER ---
        function drawLevel() {
            const w = canvas.logicalWidth;
            const h = canvas.logicalHeight;
            
            ctx.clearRect(0, 0, w, h);

            // Ground Level (Midground floor)
            const groundY = h * 0.75;

            // 1. Draw Ground
            ctx.fillStyle = currentTheme.grass[0];
            ctx.fillRect(0, groundY, w, 20);
            ctx.fillStyle = currentTheme.grass[1];
            ctx.fillRect(0, groundY + 20, w, 60);
            ctx.fillStyle = currentTheme.dirt;
            ctx.fillRect(0, groundY + 40, w, 100);
            
            // Texture
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for(let i=0; i<w; i+=80) {
                ctx.beginPath(); ctx.arc(i+40, groundY+60, 5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(i+10, groundY+80, 5, 0, Math.PI*2); ctx.fill();
            }

            // 2. Platforms
            // Low Platform (Hero stands here)
            drawBlock3D(w * 0.2, groundY - 120, 200, 20, '#A0522D', '#5D2906', currentTheme.grass[0]);
            
            // High Platform
            drawBlock3D(w * 0.75, groundY - 220, 160, 20, '#A0522D', '#5D2906', currentTheme.grass[0]);
            
            // Mystery Block above hero
            drawMysteryBlock(w * 0.25, groundY - 180, 50);

            // 3. Elements
            drawPipe(w * 0.65, groundY - 70, 70, 70);
            drawEnemy(w * 0.5, groundY - 35);
            
            // Goal Flag (Far Right)
            drawFlag(w * 0.92, groundY - 280, 280);

            // 4. Coins
            drawCoin(w * 0.25 + 25, groundY - 220);
            drawCoin(w * 0.75 + 30, groundY - 260);
            drawCoin(w * 0.75 + 60, groundY - 260);
            drawCoin(w * 0.75 + 90, groundY - 260);

            // 5. Decor (Bushes)
            const drawBush = (x, y, s) => {
                ctx.fillStyle = currentTheme.grass[1];
                ctx.beginPath();
                ctx.arc(x, y, 25*s, 0, Math.PI*2);
                ctx.arc(x+20*s, y, 35*s, 0, Math.PI*2);
                ctx.arc(x+40*s, y, 25*s, 0, Math.PI*2);
                ctx.fill();
            };
            drawBush(w * 0.15, groundY, 1.2);
            drawBush(w * 0.85, groundY, 0.9);
        }

        // --- INTERACTIVITY ---
        const hero = document.getElementById('hero-wrapper');
        const screen = document.getElementById('game-screen');

        // Parallax-ish Hero movement
        screen.addEventListener('mousemove', (e) => {
            const rect = screen.getBoundingClientRect();
            const x = e.clientX - rect.left;
            let percent = (x / rect.width) * 100;
            
            // Clamp hero to left-center area
            if(percent > 40) percent = 40;
            if(percent < 10) percent = 10;
            
            hero.style.left = percent + '%';
        });

        // Initialize
        resize();

    </script>
</body>
</html>
