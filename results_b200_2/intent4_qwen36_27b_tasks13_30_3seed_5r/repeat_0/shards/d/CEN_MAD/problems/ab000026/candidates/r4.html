<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play with Tiles</title>
<style>
  :root {
    --felt-dark: #0f1814;
    --felt-green: #1a2e24;
    --felt-highlight: #2a4f3d;
    --wood-frame: #2d1b15;
    --wood-panel: #3e2723;
    --gold: #d4af37;
    --gold-bright: #ffd700;
    --gold-dim: #8a6d1c;
    --tile-ivory: #f0ead6;
    --tile-edge: #e0d8c0;
    --font-main: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  
  body, html {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background-color: #050505;
    font-family: var(--font-main);
    color: #eee;
  }

  /* --- Environment --- */
  #game-container {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    background: #000;
  }

  /* The Table Surface */
  .table-surface {
    position: absolute;
    top: 10px; left: 10px; right: 10px; bottom: 10px;
    background: 
      radial-gradient(circle at 50% 40%, var(--felt-highlight) 0%, var(--felt-green) 40%, var(--felt-dark) 90%);
    border-radius: 60px;
    box-shadow: 
      inset 0 0 80px rgba(0,0,0,0.9), 
      0 0 0 10px var(--wood-frame),
      0 0 0 16px #1a1a1a;
    z-index: 1;
    overflow: hidden;
  }
  
  /* Felt Texture Overlay */
  .table-surface::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
    pointer-events: none;
    opacity: 0.6;
  }

  /* Top Lamp Glow */
  .lamp-glow {
    position: absolute;
    top: -10%; left: 50%; transform: translateX(-50%);
    width: 100%; height: 60%;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.08) 0%, transparent 60%);
    pointer-events: none;
    z-index: 2;
  }

  /* --- HUD: Header (Strengthened) --- */
  .top-bar {
    position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 40px; align-items: center;
    z-index: 10;
    pointer-events: none; /* Let clicks pass to board if needed */
  }

  .score-plaque {
    background: linear-gradient(to bottom, #2c1e18, #1a110d);
    border: 2px solid var(--gold-dim);
    border-top: 1px solid var(--gold);
    border-radius: 8px;
    padding: 8px 20px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.6);
    min-width: 160px;
    pointer-events: auto;
  }

  .score-plaque h3 {
    margin: 0; font-size: 0.7rem; color: var(--gold);
    text-transform: uppercase; letter-spacing: 2px;
    font-weight: 700;
  }
  
  .score-val {
    font-size: 1.8rem; font-weight: 700; color: #fff;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }

  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    border: 2px solid var(--gold);
    display: flex; justify-content: center; align-items: center;
    font-size: 1rem;
    background: #1a2e24;
    box-shadow: 0 2px 5px rgba(0,0,0,0.5);
  }

  .active-turn-indicator {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4caf50;
    box-shadow: 0 0 8px #4caf50;
    animation: pulse-green 1.5s infinite;
  }

  @keyframes pulse-green {
    0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; }
  }

  /* --- The Board (SVG) --- */
  #board-area {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 5;
    overflow: hidden;
  }

  svg#game-board {
    width: 100%; height: 100%;
    shape-rendering: geometricPrecision;
  }

  /* --- Player Action Zone (Bottom) --- */
  .action-zone {
    position: absolute; bottom: 0; right: 0;
    width: 100%; height: 220px;
    display: flex; justify-content: center; align-items: flex-end;
    z-index: 20;
    pointer-events: none;
  }

  /* The Rack (Redesigned) */
  .hand-rack {
    display: flex; gap: 20px;
    padding: 25px 40px 10px 40px;
    margin-bottom: 20px;
    background: linear-gradient(to bottom, rgba(62, 39, 35, 0.9), rgba(30, 18, 14, 0.95));
    border-radius: 20px 20px 0 0;
    border: 1px solid rgba(212, 175, 55, 0.3);
    border-bottom: none;
    box-shadow: 0 -10px 50px rgba(0,0,0,0.8);
    backdrop-filter: blur(5px);
    pointer-events: auto;
    transform-origin: bottom center;
    transition: transform 0.3s;
  }

  /* --- Tile Styling (Unified & Tactile) --- */
  .tile {
    width: 54px; height: 108px;
    background: linear-gradient(135deg, #fff 0%, #e8e4d8 100%);
    border-radius: 8px;
    position: relative;
    box-shadow: 
      0 4px 0 #cbbfa8,
      0 6px 0 #b8a98f,
      0 8px 0 #a6967d,
      0 15px 20px rgba(0,0,0,0.6);
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor: pointer;
    display: flex; flex-direction: column;
    border: 1px solid #ccc;
  }

  /* Hover Lift Effect */
  .tile:hover {
    transform: translateY(-20px) scale(1.05);
    box-shadow: 
      0 10px 0 #cbbfa8,
      0 12px 0 #b8a98f,
      0 14px 0 #a6967d,
      0 25px 30px rgba(0,0,0,0.7);
    z-index: 30;
  }

  .tile.selected {
    transform: translateY(-30px) scale(1.1);
    box-shadow: 
      0 15px 0 #cbbfa8,
      0 17px 0 #b8a98f,
      0 19px 0 #a6967d,
      0 0 0 3px var(--gold),
      0 0 25px rgba(212, 175, 55, 0.5);
    z-index: 35;
  }

  .tile.disabled {
    filter: grayscale(0.8) brightness(0.85);
    opacity: 0.6;
    cursor: default;
    transform: translateY(0) !important;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3) !important;
  }

  .tile-half {
    flex: 1; width: 100%;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    padding: 6px;
  }
  .tile-divider {
    height: 2px; background: #b0a890; width: 80%; margin: 0 auto;
    box-shadow: 0 1px 0 rgba(255,255,255,0.6);
  }

  /* Pips */
  .pip {
    background: radial-gradient(circle at 30% 30%, #444, #000);
    border-radius: 50%;
    width: 7px; height: 7px;
    margin: auto;
    box-shadow: inset 0 1px 2px rgba(0,0,0,1), 0 1px 1px rgba(255,255,255,0.2);
  }

  /* --- Draw Pile (Redesigned) --- */
  .boneyard-container {
    position: absolute;
    bottom: 40px; right: 40px;
    display: flex; flex-direction: column; align-items: center;
    z-index: 25;
    pointer-events: auto;
  }

  /* Side view of stack */
  .boneyard-stack {
    width: 60px; height: 20px;
    background: #1a237e;
    border-radius: 4px;
    position: relative;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    transition: transform 0.2s;
  }
  
  /* The "Face" of the top tile in stack */
  .boneyard-stack::before {
    content: ''; position: absolute;
    bottom: 0; left: 0; right: 0; height: 100%;
    background: linear-gradient(to bottom, #2a3bb5, #0d1a50);
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  
  /* The "Thickness" layers (simulated with borders/gradients) */
  .boneyard-stack::after {
    content: ''; position: absolute;
    bottom: -15px; left: 2px; right: 2px; height: 15px;
    background: repeating-linear-gradient(
      to bottom,
      #e8e4d8 0px, #e8e4d8 2px,
      #1a237e 2px, #1a237e 4px
    );
    border-radius: 0 0 4px 4px;
    opacity: 0.9;
  }

  .boneyard-stack:hover { transform: translateY(-5px); }
  .boneyard-stack:active { transform: translateY(-2px); }

  .boneyard-label {
    margin-top: 15px;
    color: var(--gold);
    font-size: 0.8rem; font-weight: 700;
    text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    background: rgba(0,0,0,0.7);
    padding: 4px 12px;
    border-radius: 12px;
    border: 1px solid var(--gold-dim);
    letter-spacing: 1px;
  }

  /* --- Endpoints (Interactive Cues) --- */
  .endpoint-cue {
    position: absolute;
    width: 50px; height: 50px;
    border-radius: 50%;
    background: rgba(20, 15, 10, 0.85);
    border: 2px solid var(--gold-dim);
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    display: flex; justify-content: center; align-items: center;
    font-size: 1.4rem; font-weight: 800; color: #a1887f;
    pointer-events: auto;
    cursor: pointer;
    z-index: 100;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    backdrop-filter: blur(2px);
  }
  
  /* Reticle marks */
  .endpoint-cue::before {
    content: ''; position: absolute; top: 50%; left: -10px; right: -10px; height: 1px; background: var(--gold-dim);
  }
  .endpoint-cue::after {
    content: ''; position: absolute; left: 50%; top: -10px; bottom: -10px; width: 1px; background: var(--gold-dim);
  }

  .endpoint-cue.active {
    background: var(--gold);
    color: #2d1a11;
    border-color: #fff;
    box-shadow: 0 0 30px var(--gold), 0 5px 20px rgba(0,0,0,0.5);
    transform: scale(1.2);
    animation: pulse-gold 1.5s infinite;
  }
  
  @keyframes pulse-gold {
    0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7); }
    70% { box-shadow: 0 0 0 20px rgba(212, 175, 55, 0); }
    100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
  }

  /* --- Toast --- */
  #toast {
    position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
    background: rgba(15, 10, 5, 0.95);
    border: 1px solid var(--gold);
    color: #fff; padding: 16px 32px; border-radius: 4px;
    pointer-events: none; opacity: 0; transition: all 0.3s;
    z-index: 200; text-align: center; font-weight: 600;
    box-shadow: 0 15px 40px rgba(0,0,0,0.8);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

</style>
</head>
<body>

<div id="game-container">
  <div class="table-surface">
    <div class="lamp-glow"></div>
    
    <!-- Top HUD (Strengthened) -->
    <div class="top-bar">
      <div class="score-plaque">
        <div class="avatar">🤖</div>
        <div>
          <h3>Opponent</h3>
          <div class="score-val" id="cpu-score">0</div>
        </div>
      </div>
      
      <!-- Turn Indicator Center -->
      <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
         <div class="active-turn-indicator" id="turn-dot"></div>
         <div style="font-size:0.7rem; color:var(--gold); text-transform:uppercase; letter-spacing:1px;">Your Turn</div>
      </div>

      <div class="score-plaque">
        <div style="text-align: right;">
          <h3>You</h3>
          <div class="score-val" id="player-score">0</div>
        </div>
        <div class="avatar" style="background: radial-gradient(circle at 30% 30%, #ef5350, #b71c1c);">👤</div>
      </div>
    </div>

    <!-- Main Board Area -->
    <div id="board-area">
      <svg id="game-board" viewBox="0 0 1400 800" preserveAspectRatio="xMidYMid meet">
        <defs>
          <!-- Tile Shadow Filter -->
          <filter id="tileShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
          </filter>
          
          <!-- Pip Inner Shadow Filter -->
          <filter id="pipShadow">
            <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-color="#000" flood-opacity="0.8"/>
          </filter>
          
          <!-- High Fidelity Tile Base -->
          <g id="tile-base">
            <!-- Shadow -->
            <rect x="-2" y="4" width="58" height="110" rx="10" fill="rgba(0,0,0,0.25)"/>
            <!-- Main Body (Ivory) -->
            <rect x="0" y="0" width="50" height="100" rx="8" fill="url(#ivoryGrad)" stroke="#d0d0c8" stroke-width="1"/>
            <!-- Inner Bevel -->
            <rect x="3" y="3" width="44" height="94" rx="6" fill="none" stroke="white" stroke-opacity="0.6" stroke-width="1"/>
            <!-- Divider -->
            <line x1="5" y1="50" x2="45" y2="50" stroke="#bbb" stroke-width="1.5"/>
          </g>
          
          <linearGradient id="ivoryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#e8e8e0;stop-opacity:1" />
          </linearGradient>

          <!-- Pips SVGs -->
          <g id="pip-1"><circle cx="0" cy="0" r="5" fill="#111" filter="url(#pipShadow)"/></g>
          <g id="pip-2">
            <circle cx="-9" cy="-9" r="5" fill="#111" filter="url(#pipShadow)"/>
            <circle cx="9" cy="9" r="5" fill="#111" filter="url(#pipShadow)"/>
          </g>
          <g id="pip-3">
            <use href="#pip-1"/>
            <circle cx="-9" cy="-9" r="5" fill="#111" filter="url(#pipShadow)"/>
            <circle cx="9" cy="9" r="5" fill="#111" filter="url(#pipShadow)"/>
          </g>
          <g id="pip-4">
            <circle cx="-9" cy="-9" r="5" fill="#111" filter="url(#pipShadow)"/>
            <circle cx="9" cy="-9" r="5" fill="#111" filter="url(#pipShadow)"/>
            <circle cx="-9" cy="9" r="5" fill="#111" filter="url(#pipShadow)"/>
            <circle cx="9" cy="9" r="5" fill="#111" filter="url(#pipShadow)"/>
          </g>
          <g id="pip-5">
            <use href="#pip-4"/>
            <circle cx="0" cy="0" r="5" fill="#111" filter="url(#pipShadow)"/>
          </g>
          <g id="pip-6">
            <circle cx="-9" cy="-12" r="5" fill="#111" filter="url(#pipShadow)"/>
            <circle cx="9" cy="-12" r="5" fill="#111" filter="url(#pipShadow)"/>
            <circle cx="-9" cy="0" r="5" fill="#111" filter="url(#pipShadow)"/>
            <circle cx="9" cy="0" r="5" fill="#111" filter="url(#pipShadow)"/>
            <circle cx="-9" cy="12" r="5" fill="#111" filter="url(#pipShadow)"/>
            <circle cx="9" cy="12" r="5" fill="#111" filter="url(#pipShadow)"/>
          </g>
        </defs>

        <g id="chain-layer"></g>
      </svg>
      
      <!-- HTML Overlays for Endpoints -->
      <div id="endpoint-start-dom" class="endpoint-cue" style="display:none;"></div>
      <div id="endpoint-end-dom" class="endpoint-cue" style="display:none;"></div>
    </div>

    <!-- Player Action Zone -->
    <div class="action-zone">
      <!-- The Rack -->
      <div class="hand-rack" id="player-hand"></div>
      
      <!-- The Draw Pile -->
      <div class="boneyard-container">
        <div class="boneyard-stack" onclick="drawTile()"></div>
        <div class="boneyard-label" id="boneyard-count">12 Left</div>
      </div>
    </div>
  </div>

  <div id="toast">Turn Skipped</div>
</div>

<script>
/**
 * Game State & Logic
 */
const TILE_W = 50;
const TILE_H = 100;
const GAP = 15; // Increased gap for readability
const PIP_MAP = { 0: '', 1: 'pip-1', 2: 'pip-2', 3: 'pip-3', 4: 'pip-4', 5: 'pip-5', 6: 'pip-6' };

let boardChain = [];
let playerHand = [];
let boneyard = [];
let startEndVal = null;
let endEndVal = null;
let selectedTileIdx = -1;

function initGame() {
  // Generate Boneyard
  for(let i=0; i<=6; i++) {
    for(let j=i; j<=6; j++) {
      boneyard.push({a: i, b: j});
    }
  }
  boneyard.sort(() => Math.random() - 0.5);

  // Deal 7
  for(let i=0; i<7; i++) playerHand.push(boneyard.pop());

  // CRITICAL CHANGE: Create a winding chain of 9 tiles
  // Sequence: 6-6, 6-5, 5-4, 4-4, 4-3, 3-1, 1-1, 1-2, 2-0
  // We will manually set rotations to make it look like a snake
  boardChain = [
    { a: 6, b: 6, rot: 90 }, // Start vertical
    { a: 6, b: 5, rot: 0 },  // Horizontal
    { a: 5, b: 4, rot: 90 }, // Vertical
    { a: 4, b: 4, rot: 0 },  // Horizontal
    { a: 4, b: 3, rot: 90 }, // Vertical
    { a: 3, b: 1, rot: 0 },  // Horizontal
    { a: 1, b: 1, rot: 90 }, // Vertical
    { a: 1, b: 2, rot: 0 },  // Horizontal
    { a: 2, b: 0, rot: 90 }  // End Vertical
  ];
  
  startEndVal = 6; // The exposed side of the first tile
  endEndVal = 0;   // The exposed side of the last tile

  // Fake scores
  document.getElementById('cpu-score').textContent = '12';
  document.getElementById('player-score').textContent = '0';

  renderHand();
  renderBoard();
  updateUI();
}

// --- Rendering ---

function createTileSVG(a, b, rot) {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.setAttribute("filter", "url(#tileShadow)");
  
  // Base
  const shape = document.createElementNS("http://www.w3.org/2000/svg", "use");
  shape.setAttribute("href", "#tile-base");
  shape.setAttribute("x", -TILE_W/2);
  shape.setAttribute("y", -TILE_H/2);
  g.appendChild(shape);

  // Pips Top (A) - Centered at (0, -25)
  if(PIP_MAP[a]) {
    const pipsA = document.createElementNS("http://www.w3.org/2000/svg", "use");
    pipsA.setAttribute("href", `#${PIP_MAP[a]}`);
    pipsA.setAttribute("transform", `translate(0, -25)`); 
    g.appendChild(pipsA);
  }

  // Pips Bottom (B) - Centered at (0, 25)
  if(PIP_MAP[b]) {
    const pipsB = document.createElementNS("http://www.w3.org/2000/svg", "use");
    pipsB.setAttribute("href", `#${PIP_MAP[b]}`);
    pipsB.setAttribute("transform", `translate(0, 25)`);
    g.appendChild(pipsB);
  }

  return g;
}

function renderBoard() {
  const container = document.getElementById('chain-layer');
  container.innerHTML = '';
  
  if (boardChain.length === 0) return;

  // Layout Logic: "Snake" Pattern
  // We calculate X and Y for each tile based on the previous one
  let cx = 700; // Center X of 1400
  let cy = 400; // Center Y of 800
  
  // Offset to center the whole chain initially
  // We'll do a pass to find bounds, or just center the first tile and let it grow.
  // For this demo, let's just center the first tile.
  
  const positions = [];

  boardChain.forEach((t, i) => {
    const isVert = t.rot === 90;
    const w = isVert ? TILE_H : TILE_W;
    const h = isVert ? TILE_W : TILE_H;
    
    // Store position relative to center of tile
    positions.push({ x: cx, y: cy, w, h });
    
    // Calculate next position
    // If vertical (90), next is to the right
    // If horizontal (0), next is down (or up) to create snake
    
    // Simple logic:
    // If current is Vertical (90), next is attached to its Right side -> Move X right
    // If current is Horizontal (0), next is attached to its Bottom side -> Move Y down
    
    // However, we need to match the pip values. 
    // The visual rotation is handled by the `rot` property in the data.
    // We just need to place them visually adjacent.
    
    if (isVert) {
      // Next tile attaches to the right of this vertical tile
      cx += (w/2) + GAP + (TILE_W/2); 
      // Keep Y same
    } else {
      // Next tile attaches to bottom of this horizontal tile
      cy += (h/2) + GAP + (TILE_H/2);
      // Keep X same
    }
  });

  // Centering Correction:
  // Find min/max x and y of the chain
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  positions.forEach(p => {
    if(p.x - p.w/2 < minX) minX = p.x - p.w/2;
    if(p.x + p.w/2 > maxX) maxX = p.x + p.w/2;
    if(p.y - p.h/2 < minY) minY = p.y - p.h/2;
    if(p.y + p.h/2 > maxY) maxY = p.y + p.h/2;
  });
  
  const chainW = maxX - minX;
  const chainH = maxY - minY;
  const offsetX = (1400 - chainW) / 2 - minX;
  const offsetY = (800 - chainH) / 2 - minY;

  positions.forEach((pos, i) => {
    const t = boardChain[i];
    const el = createTileSVG(t.a, t.b, t.rot);
    el.setAttribute("transform", `translate(${pos.x + offsetX}, ${pos.y + offsetY}) rotate(${t.rot})`);
    container.appendChild(el);
  });

  // Update Endpoints
  updateEndpoints(offsetX, offsetY);
}

function updateEndpoints(offsetX, offsetY) {
  const startCue = document.getElementById('endpoint-start-dom');
  const endCue = document.getElementById('endpoint-end-dom');
  
  const svgEl = document.getElementById('game-board');
  const rect = svgEl.getBoundingClientRect();
  const scaleX = rect.width / 1400;
  const scaleY = rect.height / 800;

  // --- Start Endpoint ---
  const first = boardChain[0];
  const isVert = first.rot === 90;
  // Visual center of first tile (calculated in renderBoard loop logic, simplified here)
  // We need to re-calculate the specific coordinate of the first tile's exposed end
  let cx = 700; 
  let cy = 400;
  
  // Actually, let's just grab the transform from the DOM or recalculate simply.
  // Recalculating simply:
  let currX = 700 + offsetX;
  let currY = 400 + offsetY;
  
  // Start Point Logic
  // If Vertical (90), it's the top or bottom. 
  // In our snake logic: Vertical tiles have the next tile to the RIGHT.
  // So the START is to the LEFT.
  // Horizontal tiles have the next tile DOWN. So the START is UP.
  
  let startX = currX;
  let startY = currY;

  if (isVert) {
    startX -= (TILE_H/2) + 30; // 30px away
  } else {
    startY -= (TILE_H/2) + 30;
  }

  startCue.style.display = 'flex';
  startCue.style.left = (rect.left + (startX * scaleX) - 25) + 'px'; 
  startCue.style.top = (rect.top + (startY * scaleY) - 25) + 'px';
  startCue.textContent = startEndVal;
  startCue.onclick = () => playTileToSide('start');

  // --- End Endpoint ---
  // Calculate last position
  let tempX = 700; let tempY = 400;
  boardChain.forEach((t, i) => {
    const isV = t.rot === 90;
    const w = isV ? TILE_H : TILE_W;
    const h = isV ? TILE_W : TILE_H;
    
    // Move to next
    if (isV) tempX += (w/2) + GAP + (TILE_W/2);
    else tempY += (h/2) + GAP + (TILE_H/2);
    
    // If this is the last one, we are at the NEXT position, so step back to current center
    if (i === boardChain.length - 1) {
        if(isV) tempX -= (w/2) + GAP + (TILE_W/2);
        else tempY -= (h/2) + GAP + (TILE_H/2);
    }
  });

  const lastX = tempX + offsetX;
  const lastY = tempY + offsetY;
  
  const last = boardChain[boardChain.length-1];
  const lastIsVert = last.rot === 90;

  let endX = lastX;
  let endY = lastY;

  // If Vertical, end is RIGHT. If Horizontal, end is BOTTOM.
  if (lastIsVert) {
    endX += (TILE_H/2) + 30;
  } else {
    endY += (TILE_H/2) + 30;
  }

  endCue.style.display = 'flex';
  endCue.style.left = (rect.left + (endX * scaleX) - 25) + 'px';
  endCue.style.top = (rect.top + (endY * scaleY) - 25) + 'px';
  endCue.textContent = endEndVal;
  endCue.onclick = () => playTileToSide('end');
}

function renderHand() {
  const rack = document.getElementById('player-hand');
  rack.innerHTML = '';
  
  playerHand.forEach((tile, idx) => {
    const el = document.createElement('div');
    el.className = 'tile';
    
    const valid = (tile.a === startEndVal || tile.b === startEndVal || 
                  tile.a === endEndVal || tile.b === endEndVal);
    
    if (!valid) el.classList.add('disabled');
    if (idx === selectedTileIdx) el.classList.add('selected');

    el.innerHTML = `
      <div class="tile-half">${getPipsHTML(tile.a)}</div>
      <div class="tile-divider"></div>
      <div class="tile-half">${getPipsHTML(tile.b)}</div>
    `;
    
    el.onclick = () => selectTile(idx);
    rack.appendChild(el);
  });
}

function getPipsHTML(n) {
  if(n===0) return '';
  const positions = {
    1: [[2,2]], 2: [[1,1], [3,3]], 3: [[1,1], [2,2], [3,3]],
    4: [[1,1], [3,1], [1,3], [3,3]], 5: [[1,1], [3,1], [2,2], [1,3], [3,3]],
    6: [[1,1], [3,1], [1,2], [3,2], [1,3], [3,3]]
  };
  return positions[n].map(([r,c]) => `<div style="grid-area: ${r} / ${c}"><div class="pip"></div></div>`).join('');
}

// --- Interaction ---

function selectTile(idx) {
  if(selectedTileIdx === idx) {
    selectedTileIdx = -1;
    clearEndpointHighlights();
  } else {
    const tile = playerHand[idx];
    const isValid = (tile.a === startEndVal || tile.b === startEndVal || 
                    tile.a === endEndVal || tile.b === endEndVal);
    
    if (!isValid) {
      showToast("Invalid Move");
      return;
    }
    
    selectedTileIdx = idx;
    
    // Highlight endpoints if match found
    const startCue = document.getElementById('endpoint-start-dom');
    const endCue = document.getElementById('endpoint-end-dom');
    
    startCue.classList.toggle('active', tile.a === startEndVal || tile.b === startEndVal);
    endCue.classList.toggle('active', tile.a === endEndVal || tile.b === endEndVal);
  }
  renderHand();
}

function clearEndpointHighlights() {
  document.getElementById('endpoint-start-dom').classList.remove('active');
  document.getElementById('endpoint-end-dom').classList.remove('active');
}

function playTileToSide(side) {
  if (selectedTileIdx === -1) {
    showToast("Select a tile first");
    return;
  }

  const tile = playerHand[selectedTileIdx];
  let played = false;

  if (side === 'start') {
    if (tile.a === startEndVal) {
      // Match A to start. B is new start.
      // Visual logic: Prepend to chain. 
      // If previous first was Vertical, this one might be Horizontal.
      // Simplified: Just toggle rotation for visual variety
      boardChain.unshift({ a: tile.b, b: tile.a, rot: boardChain[0].rot === 90 ? 0 : 90 }); 
      startEndVal = tile.b; played = true;
    } else if (tile.b === startEndVal) {
      boardChain.unshift({ a: tile.a, b: tile.b, rot: boardChain[0].rot === 90 ? 0 : 90 });
      startEndVal = tile.a; played = true;
    }
  } else if (side === 'end') {
    if (tile.b === endEndVal) {
      boardChain.push({ a: tile.a, b: tile.b, rot: boardChain[boardChain.length-1].rot === 90 ? 0 : 90 });
      endEndVal = tile.a; played = true;
    } else if (tile.a === endEndVal) {
      boardChain.push({ a: tile.b, b: tile.a, rot: boardChain[boardChain.length-1].rot === 90 ? 0 : 90 });
      endEndVal = tile.b; played = true;
    }
  }

  if (played) {
    playerHand.splice(selectedTileIdx, 1);
    selectedTileIdx = -1;
    clearEndpointHighlights();
    renderHand();
    renderBoard();
    updateUI();
    checkWin();
  } else {
    showToast("Cannot play there");
    selectedTileIdx = -1;
    clearEndpointHighlights();
    renderHand();
  }
}

function drawTile() {
  if (boneyard.length > 0) {
    playerHand.push(boneyard.pop());
    renderHand();
    updateUI();
    showToast("Drawn a tile");
  } else {
    showToast("Boneyard Empty");
  }
}

function updateUI() {
  document.getElementById('boneyard-count').textContent = boneyard.length + " Left";
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

function checkWin() {
  if (playerHand.length === 0) showToast("YOU WIN!");
}

window.addEventListener('resize', () => {
    // Re-render board to fix endpoints on resize
    renderBoard();
});

initGame();
</script>
