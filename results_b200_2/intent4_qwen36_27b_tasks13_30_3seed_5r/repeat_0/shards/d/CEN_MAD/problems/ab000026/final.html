<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play with Tiles: Midnight Parlor</title>
<style>
  :root {
    --table-dark: #05140e;
    --table-mid: #0f2b1f;
    --table-light: #1a4535;
    --rack-dark: #2a1610;
    --rack-light: #4e2e22;
    --rack-highlight: #6d4434;
    --tile-base: #fdfcf8;
    --tile-shadow: #dcd6c8;
    --pip-color: #1a1a1a;
    --gold: #cfaa68;
    --gold-glow: rgba(207, 170, 104, 0.4);
    --font-main: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  
  body, html {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background-color: #000;
    font-family: var(--font-main);
    color: #eee;
  }

  /* --- Environment: Midnight Parlor --- */
  #game-container {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    background: #000;
  }

  .table-surface {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at 50% 30%, var(--table-light) 0%, var(--table-mid) 50%, var(--table-dark) 100%);
    z-index: 1;
    overflow: hidden;
  }
  
  /* Velvet Texture Overlay */
  .table-surface::after {
    content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.12'/%3E%3C/svg%3E");
    pointer-events: none;
    opacity: 0.8;
    mix-blend-mode: overlay;
  }

  /* Vignette for depth */
  .vignette {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(0,0,0,0.8) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* --- HUD: Header --- */
  .top-bar {
    position: absolute; top: 20px; left: 0; right: 0;
    display: flex; justify-content: space-between; padding: 0 40px;
    z-index: 10;
    pointer-events: none;
  }

  .score-plaque {
    background: linear-gradient(135deg, #1a110d 0%, #0d0806 100%);
    border: 1px solid #3d2b1f;
    border-top: 1px solid #5c402b;
    border-radius: 6px;
    padding: 10px 24px;
    display: flex; align-items: center; gap: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    pointer-events: auto;
    min-width: 180px;
  }

  .score-plaque.right { flex-direction: row-reverse; text-align: right; }

  .score-plaque h3 {
    margin: 0; font-size: 0.65rem; color: var(--gold);
    text-transform: uppercase; letter-spacing: 2px;
    font-weight: 700; opacity: 0.8;
  }
  
  .score-val {
    font-size: 2rem; font-weight: 300; color: #fff;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    line-height: 1;
  }

  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid #5c402b;
    display: flex; justify-content: center; align-items: center;
    font-size: 1.2rem;
    background: #0f2b1f;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
  }

  /* --- Player Action Zone (Bottom) --- */
  .action-zone {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 280px;
    display: flex; justify-content: center; align-items: flex-end;
    padding-bottom: 20px;
    z-index: 20;
    pointer-events: none;
  }

  /* --- The Physical Rack --- */
  .rack-wrapper {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 30px;
    pointer-events: auto;
  }

  .hand-rack {
    position: relative;
    padding: 15px 30px 15px 30px;
    display: flex; gap: 12px;
    background: linear-gradient(to bottom, var(--rack-light), var(--rack-dark));
    border-radius: 12px 12px 4px 4px;
    border-top: 2px solid var(--rack-highlight);
    box-shadow: 
      0 20px 50px rgba(0,0,0,0.8), 
      inset 0 0 30px rgba(0,0,0,0.6);
    transform-origin: bottom center;
    /* Leather Texture */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
  }

  /* "Your Turn" Glow on Rack */
  .hand-rack::before {
    content: ''; position: absolute; inset: -2px;
    border-radius: 14px;
    box-shadow: 0 0 20px var(--gold-glow);
    animation: pulse-rack 3s infinite ease-in-out;
    pointer-events: none;
    z-index: -1;
  }

  @keyframes pulse-rack {
    0% { opacity: 0.3; } 50% { opacity: 0.8; } 100% { opacity: 0.3; }
  }

  /* --- Draw Pile (Physical Stack) --- */
  .boneyard-container {
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: 15px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .boneyard-container:hover { transform: translateY(-5px); }
  .boneyard-container:active { transform: translateY(-2px); }

  .boneyard-stack {
    position: relative;
    width: 60px; height: 120px;
    display: flex; flex-direction: column-reverse;
    align-items: center; justify-content: flex-start;
  }

  /* The individual tiles in the stack */
  .stack-tile {
    width: 60px; height: 120px;
    background: #1a237e;
    border-radius: 6px;
    position: absolute; bottom: 0;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 2px 5px rgba(0,0,0,0.5);
  }
  
  /* Stack Pattern */
  .stack-tile::after {
    content: ''; position: absolute; top: 10%; bottom: 10%; left: 15%; right: 15%;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 4px;
  }

  /* Stacking effect via transform */
  .stack-tile:nth-child(1) { transform: translateY(0px); }
  .stack-tile:nth-child(2) { transform: translateY(-2px); }
  .stack-tile:nth-child(3) { transform: translateY(-4px); }
  .stack-tile:nth-child(4) { transform: translateY(-6px); }
  .stack-tile:nth-child(5) { transform: translateY(-8px); }
  .stack-tile:nth-child(6) { transform: translateY(-10px); }

  .boneyard-label {
    margin-top: 15px;
    color: var(--gold);
    font-size: 0.9rem; font-weight: 700;
    text-shadow: 0 2px 4px rgba(0,0,0,1);
    background: rgba(0,0,0,0.6);
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid rgba(207, 170, 104, 0.3);
    letter-spacing: 1px;
    backdrop-filter: blur(4px);
  }

  /* --- Tile Styling (Bone & Brass) --- */
  .tile {
    width: 60px; height: 120px;
    background: linear-gradient(135deg, #fff 0%, #f0ead6 100%);
    border-radius: 8px;
    position: relative;
    /* 3D Bevel */
    box-shadow: 
      inset 1px 1px 0 #fff,
      inset -1px -1px 0 #dcd6c8,
      0 10px 20px rgba(0,0,0,0.4);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor: pointer;
    display: flex; flex-direction: column;
    transform-origin: bottom center;
    margin-top: 10px; /* Sits in rack */
  }

  .tile:hover {
    transform: translateY(-25px) scale(1.05);
    box-shadow: 
      inset 1px 1px 0 #fff,
      inset -1px -1px 0 #dcd6c8,
      0 20px 30px rgba(0,0,0,0.5);
    z-index: 30;
  }

  .tile.selected {
    transform: translateY(-40px) scale(1.1);
    box-shadow: 
      inset 1px 1px 0 #fff,
      inset -1px -1px 0 #dcd6c8,
      0 0 0 2px var(--gold),
      0 25px 40px rgba(0,0,0,0.6);
    z-index: 35;
  }

  .tile.disabled {
    filter: grayscale(0.7) brightness(0.9);
    opacity: 0.6;
    cursor: default;
    transform: translateY(0) !important;
    box-shadow: 0 5px 10px rgba(0,0,0,0.2);
    margin-top: 15px;
  }

  .tile-half {
    flex: 1; width: 100%;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    padding: 8px;
    position: relative;
  }
  
  /* Indented Pips */
  .pip {
    background: #111;
    border-radius: 50%;
    width: 8px; height: 8px;
    margin: auto;
    box-shadow: inset 0 1px 2px rgba(0,0,0,1), 0 1px 0 rgba(255,255,255,0.2);
  }
  
  .tile-divider {
    height: 1px; background: #dcd6c8; width: 80%; margin: 0 auto;
    box-shadow: 0 1px 0 rgba(255,255,255,0.8);
  }

  /* --- SVG Board Styling --- */
  #board-area {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 5;
    overflow: hidden;
  }

  svg#game-board {
    width: 100%; height: 100%;
    shape-rendering: geometricPrecision;
  }

  /* --- Interactive Endpoints --- */
  .endpoint-cue {
    position: absolute;
    width: 60px; height: 60px;
    border-radius: 50%;
    background: rgba(10, 8, 5, 0.8);
    border: 1px solid rgba(255,255,255,0.1);
    display: flex; justify-content: center; align-items: center;
    font-size: 1.5rem; font-weight: 700; color: #555;
    pointer-events: auto;
    cursor: pointer;
    z-index: 100;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    backdrop-filter: blur(4px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
  }

  /* Dashed ring for valid move */
  .endpoint-cue::after {
    content: ''; position: absolute; inset: -5px;
    border-radius: 50%;
    border: 2px dashed rgba(255,255,255,0.2);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .endpoint-cue.active {
    background: rgba(207, 170, 104, 0.2);
    border-color: var(--gold);
    color: #fff;
    box-shadow: 0 0 20px var(--gold-glow);
    transform: scale(1.1);
  }
  
  .endpoint-cue.active::after {
    opacity: 1;
    animation: spin-dash 10s linear infinite;
  }

  @keyframes spin-dash {
    100% { transform: rotate(360deg); }
  }

  /* --- Toast --- */
  #toast {
    position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
    background: rgba(15, 10, 5, 0.95);
    border: 1px solid var(--gold);
    color: #fff; padding: 16px 32px; border-radius: 4px;
    pointer-events: none; opacity: 0; transition: all 0.3s;
    z-index: 200; text-align: center; font-weight: 600;
    box-shadow: 0 15px 40px rgba(0,0,0,0.8);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

</style>
</head>
<body>

<div id="game-container">
  <div class="table-surface">
    <div class="vignette"></div>
    
    <!-- Top HUD -->
    <div class="top-bar">
      <div class="score-plaque">
        <div class="avatar">🤖</div>
        <div>
          <h3>Opponent</h3>
          <div class="score-val" id="cpu-score">12</div>
        </div>
      </div>

      <div class="score-plaque right">
        <div>
          <h3>You</h3>
          <div class="score-val" id="player-score">0</div>
        </div>
        <div class="avatar" style="background: radial-gradient(circle at 30% 30%, #d32f2f, #8e0000);">👤</div>
      </div>
    </div>

    <!-- Main Board Area -->
    <div id="board-area">
      <svg id="game-board" viewBox="0 0 1400 800" preserveAspectRatio="xMidYMid meet">
        <defs>
          <!-- Drop Shadow for Tiles -->
          <filter id="tileShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="2" dy="8" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
          </filter>
          
          <!-- Pip Inner Shadow -->
          <filter id="pipShadow">
            <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-color="#000" flood-opacity="0.9"/>
          </filter>
          
          <!-- Tile Base Shape -->
          <g id="tile-base">
            <rect x="-25" y="-50" width="50" height="100" rx="6" fill="url(#ivoryGrad)" stroke="#e0d8c0" stroke-width="1"/>
            <!-- Inner Highlight -->
            <rect x="-23" y="-48" width="46" height="96" rx="4" fill="none" stroke="white" stroke-opacity="0.5" stroke-width="1"/>
            <!-- Divider Line -->
            <line x1="-20" y1="0" x2="20" y2="0" stroke="#b0a890" stroke-width="1.5"/>
          </g>
          
          <linearGradient id="ivoryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#e8e4d8;stop-opacity:1" />
          </linearGradient>

          <!-- Pips -->
          <g id="pip-1"><circle cx="0" cy="0" r="4.5" fill="#111" filter="url(#pipShadow)"/></g>
          <g id="pip-2">
            <circle cx="-9" cy="-9" r="4.5" fill="#111" filter="url(#pipShadow)"/>
            <circle cx="9" cy="9" r="4.5" fill="#111" filter="url(#pipShadow)"/>
          </g>
          <g id="pip-3">
            <use href="#pip-1"/>
            <circle cx="-9" cy="-9" r="4.5" fill="#111" filter="url(#pipShadow)"/>
            <circle cx="9" cy="9" r="4.5" fill="#111" filter="url(#pipShadow)"/>
          </g>
          <g id="pip-4">
            <circle cx="-9" cy="-9" r="4.5" fill="#111" filter="url(#pipShadow)"/>
            <circle cx="9" cy="-9" r="4.5" fill="#111" filter="url(#pipShadow)"/>
            <circle cx="-9" cy="9" r="4.5" fill="#111" filter="url(#pipShadow)"/>
            <circle cx="9" cy="9" r="4.5" fill="#111" filter="url(#pipShadow)"/>
          </g>
          <g id="pip-5">
            <use href="#pip-4"/>
            <circle cx="0" cy="0" r="4.5" fill="#111" filter="url(#pipShadow)"/>
          </g>
          <g id="pip-6">
            <circle cx="-9" cy="-12" r="4.5" fill="#111" filter="url(#pipShadow)"/>
            <circle cx="9" cy="-12" r="4.5" fill="#111" filter="url(#pipShadow)"/>
            <circle cx="-9" cy="0" r="4.5" fill="#111" filter="url(#pipShadow)"/>
            <circle cx="9" cy="0" r="4.5" fill="#111" filter="url(#pipShadow)"/>
            <circle cx="-9" cy="12" r="4.5" fill="#111" filter="url(#pipShadow)"/>
            <circle cx="9" cy="12" r="4.5" fill="#111" filter="url(#pipShadow)"/>
          </g>
        </defs>

        <g id="chain-layer"></g>
      </svg>
      
      <!-- Drop Zones -->
      <div id="endpoint-start-dom" class="endpoint-cue" style="display:none;"></div>
      <div id="endpoint-end-dom" class="endpoint-cue" style="display:none;"></div>
    </div>

    <!-- Player Action Zone -->
    <div class="action-zone">
      <div class="rack-wrapper">
        
        <!-- Draw Pile (Left) -->
        <div class="boneyard-container" onclick="drawTile()">
          <div class="boneyard-stack">
            <!-- Visual layers of the stack -->
            <div class="stack-tile"></div>
            <div class="stack-tile"></div>
            <div class="stack-tile"></div>
            <div class="stack-tile"></div>
            <div class="stack-tile"></div>
            <div class="stack-tile"></div>
          </div>
          <div class="boneyard-label" id="boneyard-count">21 Left</div>
        </div>

        <!-- The Hand Rack -->
        <div class="hand-rack" id="player-hand"></div>
        
      </div>
    </div>
  </div>

  <div id="toast">Turn Skipped</div>
</div>

<script>
/**
 * Game State & Logic
 */
const TILE_W = 50;
const TILE_H = 100;
const GAP = 10; 
const PIP_MAP = { 0: '', 1: 'pip-1', 2: 'pip-2', 3: 'pip-3', 4: 'pip-4', 5: 'pip-5', 6: 'pip-6' };

let boardChain = [];
let playerHand = [];
let boneyard = [];
let startEndVal = null;
let endEndVal = null;
let selectedTileIdx = -1;

function initGame() {
  // Generate Boneyard
  for(let i=0; i<=6; i++) {
    for(let j=i; j<=6; j++) {
      boneyard.push({a: i, b: j});
    }
  }
  boneyard.sort(() => Math.random() - 0.5);

  // Deal 7
  for(let i=0; i<7; i++) playerHand.push(boneyard.pop());

  // Setup Initial Snake Chain
  boardChain = [
    { a: 6, b: 6, rot: 90 }, 
    { a: 6, b: 5, rot: 0 },  
    { a: 5, b: 4, rot: 90 }, 
    { a: 4, b: 4, rot: 0 },  
    { a: 4, b: 3, rot: 90 }, 
    { a: 3, b: 1, rot: 0 },  
    { a: 1, b: 1, rot: 90 }, 
    { a: 1, b: 2, rot: 0 },  
    { a: 2, b: 0, rot: 90 }  
  ];
  
  startEndVal = 6; 
  endEndVal = 0;   

  renderHand();
  renderBoard();
  updateUI();
}

// --- Rendering ---

function createTileSVG(a, b, rot) {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.setAttribute("filter", "url(#tileShadow)");
  
  // Base
  const shape = document.createElementNS("http://www.w3.org/2000/svg", "use");
  shape.setAttribute("href", "#tile-base");
  g.appendChild(shape);

  // Pips Top (A)
  if(PIP_MAP[a]) {
    const pipsA = document.createElementNS("http://www.w3.org/2000/svg", "use");
    pipsA.setAttribute("href", `#${PIP_MAP[a]}`);
    pipsA.setAttribute("transform", `translate(0, -25)`); 
    g.appendChild(pipsA);
  }

  // Pips Bottom (B)
  if(PIP_MAP[b]) {
    const pipsB = document.createElementNS("http://www.w3.org/2000/svg", "use");
    pipsB.setAttribute("href", `#${PIP_MAP[b]}`);
    pipsB.setAttribute("transform", `translate(0, 25)`);
    g.appendChild(pipsB);
  }

  return g;
}

function renderBoard() {
  const container = document.getElementById('chain-layer');
  container.innerHTML = '';
  
  if (boardChain.length === 0) return;

  let cx = 700; 
  let cy = 400;
  const positions = [];

  // Calculate relative positions
  boardChain.forEach((t, i) => {
    const isVert = t.rot === 90;
    const w = isVert ? TILE_H : TILE_W;
    const h = isVert ? TILE_W : TILE_H;
    
    positions.push({ x: cx, y: cy, w, h });
    
    if (isVert) {
      cx += (w/2) + GAP + (TILE_W/2); 
    } else {
      cy += (h/2) + GAP + (TILE_H/2);
    }
  });

  // Centering Math
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  positions.forEach(p => {
    if(p.x - p.w/2 < minX) minX = p.x - p.w/2;
    if(p.x + p.w/2 > maxX) maxX = p.x + p.w/2;
    if(p.y - p.h/2 < minY) minY = p.y - p.h/2;
    if(p.y + p.h/2 > maxY) maxY = p.y + p.h/2;
  });
  
  const chainW = maxX - minX;
  const chainH = maxY - minY;
  const offsetX = (1400 - chainW) / 2 - minX;
  const offsetY = (800 - chainH) / 2 - minY;

  positions.forEach((pos, i) => {
    const t = boardChain[i];
    const el = createTileSVG(t.a, t.b, t.rot);
    el.setAttribute("transform", `translate(${pos.x + offsetX}, ${pos.y + offsetY}) rotate(${t.rot})`);
    container.appendChild(el);
  });

  updateEndpoints(offsetX, offsetY);
}

function updateEndpoints(offsetX, offsetY) {
  const startCue = document.getElementById('endpoint-start-dom');
  const endCue = document.getElementById('endpoint-end-dom');
  
  const svgEl = document.getElementById('game-board');
  const rect = svgEl.getBoundingClientRect();
  const scaleX = rect.width / 1400;
  const scaleY = rect.height / 800;

  // --- Start Endpoint ---
  const first = boardChain[0];
  const isVert = first.rot === 90;
  
  let startX = 700 + offsetX;
  let startY = 400 + offsetY;

  if (isVert) {
    startX -= (TILE_H/2) + 40; 
  } else {
    startY -= (TILE_H/2) + 40;
  }

  startCue.style.display = 'flex';
  startCue.style.left = (rect.left + (startX * scaleX) - 30) + 'px'; 
  startCue.style.top = (rect.top + (startY * scaleY) - 30) + 'px';
  startCue.textContent = startEndVal;
  startCue.onclick = () => playTileToSide('start');

  // --- End Endpoint ---
  let tempX = 700; let tempY = 400;
  boardChain.forEach((t, i) => {
    const isV = t.rot === 90;
    const w = isV ? TILE_H : TILE_W;
    const h = isV ? TILE_W : TILE_H;
    
    if (isV) tempX += (w/2) + GAP + (TILE_W/2);
    else tempY += (h/2) + GAP + (TILE_H/2);
    
    if (i === boardChain.length - 1) {
        if(isV) tempX -= (w/2) + GAP + (TILE_W/2);
        else tempY -= (h/2) + GAP + (TILE_H/2);
    }
  });

  const lastX = tempX + offsetX;
  const lastY = tempY + offsetY;
  
  const last = boardChain[boardChain.length-1];
  const lastIsVert = last.rot === 90;

  let endX = lastX;
  let endY = lastY;

  if (lastIsVert) {
    endX += (TILE_H/2) + 40;
  } else {
    endY += (TILE_H/2) + 40;
  }

  endCue.style.display = 'flex';
  endCue.style.left = (rect.left + (endX * scaleX) - 30) + 'px';
  endCue.style.top = (rect.top + (endY * scaleY) - 30) + 'px';
  endCue.textContent = endEndVal;
  endCue.onclick = () => playTileToSide('end');
}

function renderHand() {
  const rack = document.getElementById('player-hand');
  rack.innerHTML = '';
  
  playerHand.forEach((tile, idx) => {
    const el = document.createElement('div');
    el.className = 'tile';
    
    const valid = (tile.a === startEndVal || tile.b === startEndVal || 
                  tile.a === endEndVal || tile.b === endEndVal);
    
    if (!valid) el.classList.add('disabled');
    if (idx === selectedTileIdx) el.classList.add('selected');

    el.innerHTML = `
      <div class="tile-half">${getPipsHTML(tile.a)}</div>
      <div class="tile-divider"></div>
      <div class="tile-half">${getPipsHTML(tile.b)}</div>
    `;
    
    el.onclick = () => selectTile(idx);
    rack.appendChild(el);
  });
}

function getPipsHTML(n) {
  if(n===0) return '';
  const positions = {
    1: [[2,2]], 2: [[1,1], [3,3]], 3: [[1,1], [2,2], [3,3]],
    4: [[1,1], [3,1], [1,3], [3,3]], 5: [[1,1], [3,1], [2,2], [1,3], [3,3]],
    6: [[1,1], [3,1], [1,2], [3,2], [1,3], [3,3]]
  };
  return positions[n].map(([r,c]) => `<div style="grid-area: ${r} / ${c}"><div class="pip"></div></div>`).join('');
}

// --- Interaction ---

function selectTile(idx) {
  if(selectedTileIdx === idx) {
    selectedTileIdx = -1;
    clearEndpointHighlights();
  } else {
    const tile = playerHand[idx];
    const isValid = (tile.a === startEndVal || tile.b === startEndVal || 
                    tile.a === endEndVal || tile.b === endEndVal);
    
    if (!isValid) {
      showToast("Invalid Move");
      return;
    }
    
    selectedTileIdx = idx;
    
    const startCue = document.getElementById('endpoint-start-dom');
    const endCue = document.getElementById('endpoint-end-dom');
    
    startCue.classList.toggle('active', tile.a === startEndVal || tile.b === startEndVal);
    endCue.classList.toggle('active', tile.a === endEndVal || tile.b === endEndVal);
  }
  renderHand();
}

function clearEndpointHighlights() {
  document.getElementById('endpoint-start-dom').classList.remove('active');
  document.getElementById('endpoint-end-dom').classList.remove('active');
}

function playTileToSide(side) {
  if (selectedTileIdx === -1) {
    showToast("Select a tile first");
    return;
  }

  const tile = playerHand[selectedTileIdx];
  let played = false;

  if (side === 'start') {
    if (tile.a === startEndVal) {
      boardChain.unshift({ a: tile.b, b: tile.a, rot: boardChain[0].rot === 90 ? 0 : 90 }); 
      startEndVal = tile.b; played = true;
    } else if (tile.b === startEndVal) {
      boardChain.unshift({ a: tile.a, b: tile.b, rot: boardChain[0].rot === 90 ? 0 : 90 });
      startEndVal = tile.a; played = true;
    }
  } else if (side === 'end') {
    if (tile.b === endEndVal) {
      boardChain.push({ a: tile.a, b: tile.b, rot: boardChain[boardChain.length-1].rot === 90 ? 0 : 90 });
      endEndVal = tile.a; played = true;
    } else if (tile.a === endEndVal) {
      boardChain.push({ a: tile.b, b: tile.a, rot: boardChain[boardChain.length-1].rot === 90 ? 0 : 90 });
      endEndVal = tile.b; played = true;
    }
  }

  if (played) {
    playerHand.splice(selectedTileIdx, 1);
    selectedTileIdx = -1;
    clearEndpointHighlights();
    renderHand();
    renderBoard();
    updateUI();
    checkWin();
  } else {
    showToast("Cannot play there");
    selectedTileIdx = -1;
    clearEndpointHighlights();
    renderHand();
  }
}

function drawTile() {
  if (boneyard.length > 0) {
    playerHand.push(boneyard.pop());
    renderHand();
    updateUI();
    showToast("Drawn a tile");
  } else {
    showToast("Boneyard Empty");
  }
}

function updateUI() {
  document.getElementById('boneyard-count').textContent = boneyard.length + " Left";
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

function checkWin() {
  if (playerHand.length === 0) showToast("YOU WIN!");
}

window.addEventListener('resize', () => {
    renderBoard();
});

initGame();
</script>
