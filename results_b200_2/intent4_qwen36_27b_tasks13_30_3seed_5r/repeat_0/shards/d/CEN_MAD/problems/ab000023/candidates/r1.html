<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Scene: The Emblem</title>
<style>
  :root {
    /* Palette: Pristine White, Vibrant Red, Metallic Grays */
    --bg-studio-top: #f8f9fa;
    --bg-studio-bottom: #dcdfe2;
    --sign-face-light: #ffffff;
    --sign-face-dark: #f2f2f4; /* Matte gradient end */
    --sign-side: #e8e8ea; /* Shadowed thickness */
    --sign-edge: #d1d1d6; /* Bevel */
    --brand-red: #E60023;
    --brand-shadow: #b3001b;
    --text-main: #111111;
    --text-muted: #757575;
    --screw-metal: #b0b0b0;
    --screw-shadow: #808080;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    /* Studio Radial Gradient */
    background: radial-gradient(circle at 50% 30%, var(--bg-studio-top) 0%, var(--bg-studio-bottom) 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    perspective: 1000px;
  }

  /* UI Overlay - Clean Typography */
  .ui-layer {
    position: absolute;
    top: 60px;
    left: 60px;
    z-index: 10;
    pointer-events: none;
  }

  h1 {
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-main);
    margin-bottom: 12px;
  }

  p.subtitle {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.6;
    max-width: 320px;
    font-weight: 400;
  }

  /* The 3D Scene Container */
  .scene {
    position: relative;
    width: 100%;
    height: 600px; /* Fixed height for 3D space */
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
    /* Initial subtle tilt */
    transform: rotateX(12deg) rotateY(-12deg);
    transition: transform 0.1s linear; /* Smooth tracking */
  }

  /* The Physical Sign Block */
  .sign-block {
    position: relative;
    width: 400px;
    height: 400px;
    transform-style: preserve-3d;
    /* Center the block */
    transform: translateZ(0);
    cursor: pointer;
  }

  /* Unified 3D Extrusion Logic */
  .face {
    position: absolute;
    backface-visibility: hidden;
  }

  /* Front Face: Matte Gradient */
  .face.front {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, var(--sign-face-light) 0%, var(--sign-face-dark) 100%);
    transform: translateZ(20px); /* Thickness offset */
    border-radius: 4px; /* Slight rounding */
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5); /* Inner rim light */
    z-index: 2;
  }

  /* Side Face: The Depth */
  .face.right {
    width: 40px; /* Thickness */
    height: 100%;
    background: var(--sign-side);
    /* Position: Right edge, rotated 90deg */
    transform: rotateY(90deg) translateZ(380px); /* 400px width - 20px offset */
    left: -20px; /* Align perfectly with front face right edge */
    transform-origin: left center;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
  }

  /* Top Face: The Top Profile */
  .face.top {
    width: 100%;
    height: 40px; /* Thickness */
    background: linear-gradient(to bottom, var(--sign-face-light), var(--sign-side));
    transform: rotateX(90deg) translateZ(20px);
    top: -20px;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
  }

  /* Metallic Screws */
  .screw {
    position: absolute;
    width: 10px;
    height: 10px;
    background: radial-gradient(circle at 30% 30%, #f0f0f0, var(--screw-metal));
    border-radius: 50%;
    transform: translateZ(21px); /* Just in front of surface */
    box-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    z-index: 5;
  }
  /* Screw Head Detail (Phillips/Slot) */
  .screw::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 6px; height: 1px;
    background: var(--screw-shadow);
    transform: translate(-50%, -50%) rotate(45deg);
    box-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }
  .screw::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 1px; height: 6px;
    background: var(--screw-shadow);
    transform: translate(-50%, -50%) rotate(45deg);
  }

  .screw.tl { top: 25px; left: 25px; }
  .screw.tr { top: 25px; right: 25px; }
  .screw.bl { bottom: 25px; left: 25px; }
  .screw.br { bottom: 25px; right: 25px; }

  /* The Graphic Emblem */
  .emblem-container {
    position: absolute;
    top: 50%; left: 50%;
    /* Centered and raised slightly for relief effect */
    transform: translate(-50%, -50%) translateZ(22px); 
    width: 200px; /* ~50% of width */
    height: 200px;
    z-index: 4;
  }

  svg.emblem {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* SVG Styling */
  .bg-circle {
    fill: var(--brand-red);
    /* Soft colored shadow for the emblem */
    filter: drop-shadow(0 8px 12px rgba(230, 0, 35, 0.35));
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  
  .play-triangle {
    fill: #ffffff;
    /* Slight inner bevel on triangle */
    stroke: #ffffff;
    stroke-width: 1;
  }

  /* Drop Shadow on the Floor */
  .floor-shadow {
    position: absolute;
    width: 450px;
    height: 150px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0) 70%);
    /* Positioned "below" the sign in 3D space */
    transform: rotateX(90deg) translateZ(250px); /* 400/2 + offset */
    filter: blur(15px);
    opacity: 0.8;
    pointer-events: none;
  }

  /* Interactivity States */
  .sign-block:hover .bg-circle {
    transform: scale(1.05);
  }

  /* Product Info Footer */
  .info-strip {
    position: absolute;
    bottom: 60px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 60px;
    width: 100%;
    max-width: 800px;
    text-align: center;
  }
  
  .info-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .info-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    font-weight: 600;
  }

  .info-value {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-main);
    letter-spacing: -0.5px;
  }

  /* Subtle animation for the emblem on load */
  @keyframes popIn {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  .emblem-container {
    animation: popIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

</style>
</head>
<body>

  <div class="ui-layer">
    <h1>Studio Emblem</h1>
    <p class="subtitle">High-contrast geometric signage.<br>Pristine white finish with chromatic red.</p>
  </div>

  <div class="scene">
    <div class="sign-block">
      <!-- 3D Faces -->
      <div class="face front"></div>
      <div class="face right"></div>
      <div class="face top"></div>

      <!-- Mounting Hardware (Screws) -->
      <div class="screw tl"></div>
      <div class="screw tr"></div>
      <div class="screw bl"></div>
      <div class="screw br"></div>

      <!-- The Graphic Emblem -->
      <div class="emblem-container">
        <svg class="emblem" viewBox="0 0 100 100">
          <!-- The Red Circle -->
          <circle class="bg-circle" cx="50" cy="50" r="46" />
          
          <!-- The White Play Button -->
          <!-- Centered mathematically -->
          <path class="play-triangle" d="M 38 26 L 70 50 L 38 74 Z" />
        </svg>
      </div>

      <!-- Floor Shadow -->
      <div class="floor-shadow"></div>
    </div>
  </div>

  <div class="info-strip">
    <div class="info-item">
      <span class="info-label">Material</span>
      <span class="info-value">Alabaster Matte</span>
    </div>
    <div class="info-item">
      <span class="info-label">Dimension</span>
      <span class="info-value">400 x 400mm</span>
    </div>
    <div class="info-item">
      <span class="info-label">Finish</span>
      <span class="info-value">Soft Touch</span>
    </div>
  </div>

  <script>
    // Smooth parallax effect to enhance the 3D feel
    const scene = document.querySelector('.scene');
    const signBlock = document.querySelector('.sign-block');

    // Use requestAnimationFrame for smoother performance
    let targetX = -12;
    let targetY = 12;
    let currentX = -12;
    let currentY = 12;

    document.addEventListener('mousemove', (e) => {
      // Calculate mouse position relative to center
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      
      const mouseX = e.clientX - centerX;
      const mouseY = e.clientY - centerY;

      // Determine rotation targets (inverted for natural feel)
      targetX = 12 + (mouseY / -15);
      targetY = -12 + (mouseX / 15);

      // Clamp values
      targetX = Math.max(0, Math.min(30, targetX));
      targetY = Math.max(-30, Math.min(10, targetY));
    });

    // Animation Loop
    function animate() {
      // Linear interpolation (Lerp) for smoothness
      currentX += (targetX - currentX) * 0.1;
      currentY += (targetY - currentY) * 0.1;

      scene.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;
      requestAnimationFrame(animate);
    }
    animate();

    // Reset on mouse leave
    document.addEventListener('mouseleave', () => {
      targetX = 12;
      targetY = -12;
    });
  </script>
</body>
</html>
