<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Emblem - Product Scene</title>
<style>
  :root {
    /* Palette: Pristine White, Vibrant Red, Deep Shadows */
    --bg-studio-top: #f4f6f8;
    --bg-studio-bottom: #dfe3e8;
    --sign-face-light: #ffffff;
    --sign-face-dark: #f8f8fa; /* Subtle sheen */
    --sign-side: #e6e6e8; /* Matte Alabaster side */
    --sign-edge: #d6d6d8; /* Bevel */
    --brand-red: #E53935; /* Chromatic Red */
    --brand-shadow: #b71c1c;
    --text-main: #1a1a1a;
    --text-muted: #666666;
    --screw-metal: #9e9e9e;
    --screw-core: #424242;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    /* Studio Lighting Gradient */
    background: radial-gradient(ellipse at 50% 20%, var(--bg-studio-top) 0%, var(--bg-studio-bottom) 80%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    perspective: 1200px; /* Deep perspective */
  }

  /* UI Overlay - Centralized Hierarchy */
  .ui-layer {
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
    pointer-events: none;
  }

  h1 {
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-main);
    margin-bottom: 8px;
    opacity: 0.9;
  }

  /* The 3D Scene Container */
  .scene {
    position: relative;
    width: 100%;
    height: 600px;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
    /* Initial resting pose */
    transform: rotateX(10deg) rotateY(-10deg);
    transition: transform 0.1s linear;
  }

  /* The Physical Sign Block */
  .sign-block {
    position: relative;
    width: 420px;
    height: 420px;
    transform-style: preserve-3d;
    transform: translateZ(0);
  }

  /* 3D Extrusion Construction */
  .face {
    position: absolute;
    backface-visibility: hidden;
  }

  /* Front Face: Matte Gradient */
  .face.front {
    width: 100%;
    height: 100%;
    /* Lighting gradient to simulate studio sheen */
    background: linear-gradient(135deg, var(--sign-face-light) 0%, var(--sign-face-dark) 100%);
    transform: translateZ(20px); /* 20px Thickness */
    border-radius: 2px;
    /* Inner shadow for depth */
    box-shadow: inset 0 0 40px rgba(0,0,0,0.02);
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Side Face: The Depth (Right side) */
  .face.right {
    width: 20px; /* Thickness */
    height: 100%;
    background: linear-gradient(to right, var(--sign-edge), var(--sign-side));
    /* Position: Right edge, rotated 90deg */
    transform: rotateY(90deg) translateZ(410px); /* Width - Thickness/2 */
    left: 50%; /* Center relative to block */
    margin-left: 210px; /* Push to edge */
    transform-origin: left center;
    box-shadow: inset 1px 0 0 rgba(255,255,255,0.2); /* Edge highlight */
  }

  /* Top Face: The Top Profile */
  .face.top {
    width: 100%;
    height: 20px; /* Thickness */
    background: linear-gradient(to bottom, #ffffff, var(--sign-side));
    transform: rotateX(90deg) translateZ(10px); /* Half thickness offset */
    top: 50%;
    margin-top: -210px; /* Center vertically */
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
  }

  /* Mounting Hardware: Refined Screws */
  .screw {
    position: absolute;
    width: 14px;
    height: 14px;
    background: radial-gradient(circle at 30% 30%, #d0d0d0, var(--screw-metal));
    border-radius: 50%;
    transform: translateZ(22px); /* Raised slightly */
    box-shadow: 
      1px 2px 3px rgba(0,0,0,0.2), /* Drop shadow */
      inset 0 0 2px rgba(0,0,0,0.5); /* Bevel shadow */
    z-index: 5;
  }
  
  /* Screw Detail: Phillips Head */
  .screw::after {
    content: '+';
    position: absolute;
    top: 50%; left: 50%;
    width: 100%; height: 100%;
    text-align: center;
    line-height: 14px;
    font-size: 12px;
    color: var(--screw-core);
    font-weight: bold;
    transform: translate(-50%, -50%) rotate(0deg);
    text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }

  .screw.tl { top: 30px; left: 30px; }
  .screw.tr { top: 30px; right: 30px; }
  .screw.bl { bottom: 30px; left: 30px; }
  .screw.br { bottom: 30px; right: 30px; }

  /* The Graphic Emblem */
  .emblem-container {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) translateZ(23px); /* Floating above surface */
    width: 160px;
    height: 160px;
    z-index: 4;
  }

  svg.emblem {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* SVG Styling: Tactile Red */
  .bg-circle {
    fill: var(--brand-red);
    /* Deep colored shadow */
    filter: drop-shadow(0 10px 15px rgba(229, 57, 53, 0.3));
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  
  .play-triangle {
    fill: #ffffff;
  }

  /* Floor Shadow: Anchored & Diffuse */
  .floor-shadow {
    position: absolute;
    width: 500px;
    height: 200px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0) 70%);
    /* Positioned "below" the sign in 3D space */
    transform: rotateX(90deg) translateZ(300px); 
    filter: blur(20px);
    opacity: 1;
    pointer-events: none;
    transform-origin: center;
  }

  /* Product Info Footer: Unified Typography */
  .info-strip {
    position: absolute;
    bottom: 80px;
    display: flex;
    gap: 40px;
    width: 100%;
    justify-content: center;
    text-align: center;
  }
  
  .info-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .info-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    font-weight: 600;
  }

  .info-value {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-main);
    letter-spacing: -0.2px;
  }

  /* Subtle animation for the emblem on load */
  @keyframes popIn {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  .emblem-container {
    animation: popIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

</style>
</head>
<body>

  <div class="ui-layer">
    <h1>Studio Emblem</h1>
  </div>

  <div class="scene">
    <div class="sign-block">
      <!-- 3D Extrusion Faces -->
      <div class="face front"></div>
      <div class="face right"></div>
      <div class="face top"></div>

      <!-- Mounting Hardware (Screws) -->
      <div class="screw tl"></div>
      <div class="screw tr"></div>
      <div class="screw bl"></div>
      <div class="screw br"></div>

      <!-- The Graphic Emblem -->
      <div class="emblem-container">
        <svg class="emblem" viewBox="0 0 100 100">
          <!-- The Red Circle -->
          <circle class="bg-circle" cx="50" cy="50" r="48" />
          
          <!-- The White Play Button -->
          <!-- Geometrically centered triangle -->
          <path class="play-triangle" d="M 38 28 L 72 50 L 38 72 Z" />
        </svg>
      </div>

      <!-- Floor Shadow -->
      <div class="floor-shadow"></div>
    </div>
  </div>

  <div class="info-strip">
    <div class="info-item">
      <span class="info-label">Material</span>
      <span class="info-value">Alabaster Matte</span>
    </div>
    <div class="info-item">
      <span class="info-label">Dimension</span>
      <span class="info-value">420 x 420mm</span>
    </div>
    <div class="info-item">
      <span class="info-label">Finish</span>
      <span class="info-value">Soft Touch</span>
    </div>
  </div>

  <script>
    // Smooth parallax effect to enhance the 3D feel
    const scene = document.querySelector('.scene');
    
    // Use requestAnimationFrame for smoother performance
    let targetX = 10;
    let targetY = -10;
    let currentX = 10;
    let currentY = -10;

    document.addEventListener('mousemove', (e) => {
      // Calculate mouse position relative to center
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      
      const mouseX = e.clientX - centerX;
      const mouseY = e.clientY - centerY;

      // Determine rotation targets (inverted for natural feel)
      // Reduced sensitivity for a more premium, solid feel
      targetX = 10 + (mouseY / -25); 
      targetY = -10 + (mouseX / 25);

      // Clamp values to prevent flipping
      targetX = Math.max(-15, Math.min(25, targetX));
      targetY = Math.max(-25, Math.min(15, targetY));
    });

    // Animation Loop
    function animate() {
      // Linear interpolation (Lerp) for smoothness
      currentX += (targetX - currentX) * 0.08;
      currentY += (targetY - currentY) * 0.08;

      scene.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;
      requestAnimationFrame(animate);
    }
    animate();

    // Reset on mouse leave
    document.addEventListener('mouseleave', () => {
      targetX = 10;
      targetY = -10;
    });
  </script>
</body>
</html>
