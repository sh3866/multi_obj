<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Emblem - Product Scene</title>
<style>
  :root {
    /* Palette: Refined Studio Lighting & Materials */
    --bg-studio-top: #e8eaed;
    --bg-studio-bottom: #cdd1d6;
    
    /* Sign Material: Alabaster Matte */
    --sign-face-base: #fcfcfc;
    --sign-face-shadow: #eef0f2;
    --sign-side-dark: #d4d6d9;
    --sign-side-light: #e4e6e9;
    
    /* Brand Identity */
    --brand-red: #E53935; /* High contrast red */
    --brand-red-shadow: #b71c1c;
    
    /* Hardware */
    --metal-light: #ffffff;
    --metal-mid: #a0a0a0;
    --metal-dark: #606060;
    
    /* Typography */
    --text-main: #1a1a1a;
    --text-muted: #6e6e6e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(ellipse at 50% 30%, var(--bg-studio-top) 0%, var(--bg-studio-bottom) 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    perspective: 1200px;
  }

  /* UI Overlay */
  .ui-layer {
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
    pointer-events: none;
  }

  h1 {
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--text-main);
    opacity: 0.6;
  }

  /* The 3D Scene Container */
  .scene {
    position: relative;
    width: 100%;
    height: 600px;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
    /* Initial resting pose */
    transform: rotateX(15deg) rotateY(-12deg);
    transition: transform 0.1s linear;
  }

  /* The Physical Sign Block */
  .sign-block {
    position: relative;
    width: 460px;
    height: 460px;
    transform-style: preserve-3d;
    transform: translateZ(0);
  }

  .face {
    position: absolute;
    backface-visibility: hidden;
  }

  /* Front Face: Alabaster Matte Gradient */
  .face.front {
    width: 100%;
    height: 100%;
    /* Simulating tactile matte material with subtle noise/gradient */
    background: linear-gradient(160deg, var(--sign-face-base) 0%, var(--sign-face-shadow) 100%);
    transform: translateZ(28px); /* 28px Thickness */
    border-radius: 6px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.8); /* Crisp edge highlight */
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Side Face: The Depth (Right side) */
  .face.right {
    width: 28px; /* Thickness */
    height: 100%;
    /* Linear gradient simulating side lighting */
    background: linear-gradient(to right, var(--sign-side-light), var(--sign-side-dark));
    /* Positioning for 3D extrusion */
    transform: rotateY(90deg) translateZ(446px); /* Width - Thickness/2 */
    left: 50%;
    margin-left: 232px;
    transform-origin: left center;
    border-radius: 0 2px 2px 0;
    border-top: 1px solid rgba(255,255,255,0.3);
    border-bottom: 1px solid rgba(0,0,0,0.05);
  }

  /* Top Face: The Top Profile */
  .face.top {
    width: 100%;
    height: 28px; /* Thickness */
    background: linear-gradient(to bottom, var(--sign-side-light), var(--sign-side-dark));
    transform: rotateX(90deg) translateZ(14px); /* Half thickness offset */
    top: 50%;
    margin-top: -232px; /* Center vertically */
    border-radius: 2px 2px 0 0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
  }

  /* Mounting Hardware: Vector Precision Screws */
  .screw {
    position: absolute;
    width: 14px;
    height: 14px;
    /* Metallic Gradient */
    background: radial-gradient(circle at 35% 35%, var(--metal-light), var(--metal-mid) 60%, var(--metal-dark) 100%);
    border-radius: 50%;
    transform: translateZ(29px); /* Raised above surface */
    /* Tight, realistic drop shadow */
    box-shadow: 0 2px 5px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.9);
    z-index: 5;
  }
  
  /* Screw Detail: Recessed Slot with Highlight */
  .screw::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 9px; height: 1.5px;
    background: rgba(0,0,0,0.4);
    border-radius: 1px;
    transform: translate(-50%, -50%) rotate(-45deg);
    /* Specular highlight on the slot */
    box-shadow: 0 1px 0 rgba(255,255,255,0.6);
  }

  .screw.tl { top: 40px; left: 40px; }
  .screw.tr { top: 40px; right: 40px; }
  .screw.bl { bottom: 40px; left: 40px; }
  .screw.br { bottom: 40px; right: 40px; }

  /* The Graphic Emblem */
  .emblem-container {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) translateZ(32px); /* Floating higher */
    width: 200px;
    height: 200px;
    z-index: 4;
  }

  svg.emblem {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* SVG Styling: Tactile Red */
  .bg-circle {
    fill: var(--brand-red);
    /* Soft shadow to separate from white background */
    filter: drop-shadow(0 10px 15px rgba(229, 57, 53, 0.3));
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  
  .play-triangle {
    fill: #ffffff;
    /* Subtle inner bevel effect via stroke */
    stroke: #ffffff;
    stroke-width: 2px;
  }

  /* Floor Shadow: Anchored & Diffuse */
  .floor-shadow {
    position: absolute;
    width: 600px;
    height: 300px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0) 70%);
    /* Positioned below the object in 3D space */
    transform: rotateX(90deg) translateZ(400px); 
    filter: blur(30px);
    opacity: 1;
    pointer-events: none;
    transform-origin: center;
  }

  /* Product Info Footer: Unified Typography */
  .info-strip {
    position: absolute;
    bottom: 60px;
    display: flex;
    gap: 80px;
    width: 100%;
    justify-content: center;
    text-align: center;
  }
  
  .info-item {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .info-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .info-value {
    font-size: 16px;
    font-weight: 700; /* Bolder weight for spec values */
    color: var(--text-main);
    letter-spacing: -0.2px;
  }

  /* Subtle animation for the emblem on load */
  @keyframes popIn {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  .emblem-container {
    animation: popIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

</style>
</head>
<body>

  <div class="ui-layer">
    <h1>Studio Emblem</h1>
  </div>

  <div class="scene">
    <div class="sign-block">
      <!-- 3D Extrusion Faces -->
      <div class="face front"></div>
      <div class="face right"></div>
      <div class="face top"></div>

      <!-- Mounting Hardware (Screws) -->
      <div class="screw tl"></div>
      <div class="screw tr"></div>
      <div class="screw bl"></div>
      <div class="screw br"></div>

      <!-- The Graphic Emblem -->
      <div class="emblem-container">
        <svg class="emblem" viewBox="0 0 100 100">
          <!-- The Red Circle -->
          <circle class="bg-circle" cx="50" cy="50" r="46" />
          
          <!-- The White Play Button -->
          <!-- Geometrically precise, centered triangle -->
          <path class="play-triangle" d="M 36 30 L 36 70 L 74 50 Z" />
        </svg>
      </div>

      <!-- Floor Shadow -->
      <div class="floor-shadow"></div>
    </div>
  </div>

  <div class="info-strip">
    <div class="info-item">
      <span class="info-label">Material</span>
      <span class="info-value">Alabaster Matte</span>
    </div>
    <div class="info-item">
      <span class="info-label">Dimension</span>
      <span class="info-value">460 x 460mm</span>
    </div>
    <div class="info-item">
      <span class="info-label">Finish</span>
      <span class="info-value">Soft Touch</span>
    </div>
  </div>

  <script>
    // Smooth parallax effect to enhance the 3D feel
    const scene = document.querySelector('.scene');
    
    // Use requestAnimationFrame for smoother performance
    let targetX = 15;
    let targetY = -12;
    let currentX = 15;
    let currentY = -12;

    document.addEventListener('mousemove', (e) => {
      // Calculate mouse position relative to center
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      
      const mouseX = e.clientX - centerX;
      const mouseY = e.clientY - centerY;

      // Determine rotation targets (inverted for natural feel)
      // Reduced sensitivity for a more premium, solid feel
      targetX = 15 + (mouseY / -40); 
      targetY = -12 + (mouseX / 40);

      // Clamp values to prevent flipping
      targetX = Math.max(-10, Math.min(25, targetX));
      targetY = Math.max(-25, Math.min(10, targetY));
    });

    // Animation Loop
    function animate() {
      // Linear interpolation (Lerp) for smoothness
      currentX += (targetX - currentX) * 0.08;
      currentY += (targetY - currentY) * 0.08;

      scene.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;
      requestAnimationFrame(animate);
    }
    animate();

    // Reset on mouse leave
    document.addEventListener('mouseleave', () => {
      targetX = 15;
      targetY = -12;
    });
  </script>
</body>
</html>
