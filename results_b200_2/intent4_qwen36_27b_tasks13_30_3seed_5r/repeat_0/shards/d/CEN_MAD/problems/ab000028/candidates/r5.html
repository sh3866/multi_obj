<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descent // High Altitude Action</title>
    <style>
        :root {
            --bg-deep: #020617;
            --accent-orange: #f97316;
            --accent-glow: #fdba74;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* The Stage */
        .visual-canvas {
            position: relative;
            width: 100%;
            height: 100%;
            /* Deep atmospheric gradient */
            background: linear-gradient(to bottom, #050b14 0%, #1e293b 60%, #475569 100%);
        }

        /* SVG Container */
        svg.scene {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            touch-action: none; 
        }

        /* Film Grain for Texture */
        .grain {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.05;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Vignette for cinematic focus */
        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 40%, #000000 100%);
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="visual-canvas">
    
    <!-- Atmospheric Overlays -->
    <div class="grain"></div>
    <div class="vignette"></div>

    <!-- Main Illustration -->
    <svg class="scene" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Gradients -->
            
            <!-- 1. Cliff Gradients (Deep Slate/Charcoal) -->
            <linearGradient id="cliffShadow" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#02040a" />
                <stop offset="100%" stop-color="#0f172a" />
            </linearGradient>
            
            <linearGradient id="cliffLight" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#1e293b" />
                <stop offset="100%" stop-color="#334155" />
            </linearGradient>

            <!-- 2. Canopy Gradients (High Contrast White/Slate) -->
            <linearGradient id="canopyFace" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="100%" stop-color="#cbd5e1" />
            </linearGradient>
            
            <linearGradient id="canopyInner" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#94a3b8" />
                <stop offset="100%" stop-color="#334155" />
            </linearGradient>

            <!-- 3. Mist Gradient -->
            <linearGradient id="mistGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#64748b" stop-opacity="0" />
                <stop offset="50%" stop-color="#64748b" stop-opacity="0.2" />
                <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
            </linearGradient>

            <!-- Filters -->
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="10" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
            
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="5" dy="15" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
            </filter>

            <!-- Reusable Strata for Cliff Texture -->
            <path id="strataLine" d="M-100,0 L100,15 L300,5 L500,25 L700,10 L900,35 L1000,15" stroke="#020617" stroke-width="6" fill="none" opacity="0.8"/>
        </defs>

        <!-- 1. Background Sky (Handled by CSS) -->

        <!-- 2. Distant Landscape (Atmospheric Depth) -->
        <g id="landscape">
            <!-- Far Mountains (Hazy, Lighter Tone) -->
            <path d="M0,1080 L0,850 Q200,800 450,880 T900,820 T1400,900 T1920,850 L1920,1080 Z" 
                  fill="#64748b" opacity="0.3" />
            <!-- Mid Mountains (Darker, More Defined) -->
            <path d="M0,1080 L0,920 Q250,880 500,950 T1100,900 T1920,960 L1920,1080 Z" 
                  fill="#334155" opacity="0.6" />
            <!-- Near Ridge (Silhouette) -->
            <path d="M0,1080 L0,980 Q300,950 600,1000 T1200,970 T1920,1020 L1920,1080 Z" 
                  fill="#0f172a" opacity="0.9" />
        </g>

        <!-- 3. Motion Cues (Systematized Wind) -->
        <g id="wind-group"></g>

        <!-- 4. The Cliff (Reconstructed Left Anchor) -->
        <g id="cliff-system">
            <!-- Main Cliff Mass (Filled Polygon, Solid Weight) -->
            <!-- Jagged geometric path simulating rock formation -->
            <path d="M-50,-50 L550,-50 L500,100 L600,250 L450,400 L550,600 L400,800 L500,1000 L350,1250 L-50,1350 Z" 
                  fill="url(#cliffShadow)" />
            
            <!-- Secondary Facet (Highlight Side) -->
            <path d="M550,-50 L500,100 L600,250 L450,400 L550,600 L400,800 L500,1000 L350,1250 L650,1250 L650,-50 Z"
                  fill="url(#cliffLight)" />
            
            <!-- Texture: Rock Strata (Horizontal jagged lines) -->
            <g stroke="#020617" stroke-width="4" opacity="0.5">
                <use href="#strataLine" y="120" />
                <use href="#strataLine" y="280" />
                <use href="#strataLine" y="440" />
                <use href="#strataLine" y="600" />
                <use href="#strataLine" y="760" />
                <use href="#strataLine" y="920" />
                <use href="#strataLine" y="1080" />
            </g>

            <!-- Rim Light: The Danger Edge (Moonlight/Sunlight Source) -->
            <!-- Outer Glow -->
            <path d="M550,-50 L500,100 L600,250 L450,400 L550,600 L400,800 L500,1000 L350,1250" 
                  fill="none" stroke="#ffffff" stroke-width="12" opacity="0.2" filter="url(#glow)" />
            <!-- Sharp Edge -->
            <path d="M550,-50 L500,100 L600,250 L450,400 L550,600 L400,800 L500,1000 L350,1250" 
                  fill="none" stroke="#e2e8f0" stroke-width="3" opacity="0.9" />
        </g>

        <!-- 5. The Parachutist (Dynamic Silhouette) -->
        <!-- Shifted to Left-Center to balance the cliff -->
        <g id="parachutist-system">
            
            <!-- Canopy (Faceted, High Contrast) -->
            <g id="canopy" transform="translate(0, -350)">
                <!-- Shadow on lower canopy -->
                <ellipse cx="0" cy="40" rx="180" ry="45" fill="#000000" opacity="0.2" filter="url(#shadow)" />

                <!-- Canopy Fabric (Left/Shadow Side) -->
                <path d="M-250,0 C-250,-190 0,-190 0,-190 L0,70 C-90,70 -250,50 -250,0 Z" 
                      fill="url(#canopyInner)" />
                
                <!-- Canopy Fabric (Right/Light Side) -->
                <path d="M0,-190 C0,-190 250,-190 250,0 C250,50 90,70 0,70 Z" 
                      fill="url(#canopyFace)" />
                
                <!-- Internal Structure: Gores (Vertical lines for volume) -->
                <g stroke="#0f172a" stroke-width="2" fill="none" opacity="0.3">
                    <path d="M-250,0 C-180,-170 0,-180 0,-180" />
                    <path d="M-125,25 C-60,-150 0,-170 0,-170" />
                    <path d="M125,25 C60,-150 0,-170 0,-170" />
                    <path d="M250,0 C180,-170 0,-180 0,-180" />
                </g>
                
                <!-- Top Highlight (Rim Light on Canopy) -->
                <path d="M-250,0 C-250,-190 250,-190 250,0" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8" />
            </g>

            <!-- Suspension Lines (Taut, Connecting Canopy to Harness) -->
            <g stroke="#ffffff" stroke-width="2" opacity="0.9">
                <!-- Left side lines -->
                <line x1="-230" y1="-340" x2="-20" y2="0" />
                <line x1="-120" y1="-335" x2="-10" y2="0" />
                <line x1="-20" y1="-330" x2="0" y2="0" />
                <!-- Right side lines -->
                <line x1="230" y1="-340" x2="20" y2="0" />
                <line x1="120" y1="-335" x2="10" y2="0" />
                <line x1="20" y1="-330" x2="0" y2="0" />
            </g>

            <!-- Human Figure (Volumetric, Dynamic Pose, High Contrast) -->
            <g id="human-figure">
                <!-- Harness (Bright Orange Splash) -->
                <rect x="-25" y="-15" width="50" height="65" rx="8" fill="var(--accent-orange)" filter="url(#shadow)" />
                <path d="M-15,-15 L15,-15 L15,50 L-15,50 Z" fill="var(--accent-glow)" opacity="0.6"/> <!-- Highlight -->
                
                <!-- Torso (Dark Silhouette leaning back) -->
                <path d="M-18,-15 L-22,50 L22,50 L18,-15 Z" fill="#020617" />
                
                <!-- Head -->
                <circle cx="0" cy="-30" r="14" fill="#020617" />
                <!-- Helmet Rim Light -->
                <path d="M-10,-35 A 14 14 0 0 1 10,-35" fill="none" stroke="#475569" stroke-width="2"/>
                
                <!-- Legs (Dangling, heavy lines) -->
                <path d="M-15,50 C-25,100 -15,150 -5,180" stroke="#020617" stroke-width="16" fill="none" stroke-linecap="round"/>
                <path d="M15,50 C25,100 15,150 5,180" stroke="#020617" stroke-width="16" fill="none" stroke-linecap="round"/>
                
                <!-- Arms (Active, Bracing) -->
                <!-- Left Arm -->
                <path d="M-10,-5 C-35,10 -45,40 -30,60" stroke="#020617" stroke-width="12" fill="none" stroke-linecap="round"/>
                <!-- Right Arm -->
                <path d="M10,-5 C35,10 45,40 30,60" stroke="#020617" stroke-width="12" fill="none" stroke-linecap="round"/>
                
                <!-- Rim light on human to separate from dark background -->
                <path d="M-18,-15 L-22,50" stroke="#475569" stroke-width="2" fill="none"/>
                <path d="M-5,180" stroke="#475569" stroke-width="2" fill="none"/>
            </g>
        </g>

        <!-- 6. Foreground Mist (Depth) -->
        <rect x="0" y="700" width="1920" height="400" fill="url(#mistGrad)" pointer-events="none" />
    </svg>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const windGroup = document.getElementById('wind-group');
        const parachutist = document.getElementById('parachutist-system');
        
        // --- Configuration ---
        const config = {
            windCount: 80, // More lines for stronger speed feel
            baseX: 800, // Shifted Left-Center
            baseY: 500,
            bobSpeed: 0.003, 
            bobHeight: 15,
            swaySpeed: 0.002, 
            swayWidth: 20,
            descentSpeed: 0.5 // Slow, controlled descent
        };

        let state = {
            time: 0,
            y: config.baseY
        };

        // --- Generate Systematized Wind Lines ---
        for(let i = 0; i < config.windCount; i++) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            
            // Distribute vertically
            const y = Math.random() * 1080;
            const x = Math.random() * -1920; 
            
            // Vary length for depth
            const length = 150 + Math.random() * 500; 
            const width = 0.5 + Math.random() * 1.5; 
            
            // Color variation
            const opacity = 0.1 + (Math.random() * 0.25);
            
            line.setAttribute("x1", x);
            line.setAttribute("y1", y);
            line.setAttribute("x2", x + length);
            line.setAttribute("y2", y); 
            
            line.setAttribute("stroke", Math.random() > 0.7 ? "#ffffff" : "#94a3b8");
            line.setAttribute("stroke-width", width);
            line.setAttribute("stroke-linecap", "round");
            line.setAttribute("opacity", opacity);
            
            line.dataset.speed = 15 + Math.random() * 25; // Faster wind
            line.dataset.x = x;
            line.dataset.len = length;
            
            windGroup.appendChild(line);
        }

        // --- Animation Loop ---
        function animate() {
            state.time += 1;

            // 1. Parachutist Physics
            const bob = Math.sin(state.time * config.bobSpeed * 100) * config.bobHeight;
            const sway = Math.sin(state.time * config.swaySpeed * 100) * config.swayWidth;
            
            state.y += config.descentSpeed;
            if (state.y > 1300) state.y = -400;

            // Apply Transform
            parachutist.setAttribute('transform', `translate(${config.baseX + sway}, ${state.y + bob})`);

            // 2. Wind Animation
            const lines = windGroup.children;
            for(let i = 0; i < lines.length; i++) {
                const line = lines[i];
                let currentX = parseFloat(line.dataset.x);
                const speed = parseFloat(line.dataset.speed);
                const len = parseFloat(line.dataset.len);

                currentX += speed;
                
                if (currentX > 1920) {
                    currentX = -len - (Math.random() * 800); 
                    line.dataset.x = currentX;
                    line.setAttribute("x1", currentX);
                    line.setAttribute("x2", currentX + len);
                } else {
                    line.setAttribute("x1", currentX);
                    line.setAttribute("x2", currentX + len);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>
</body>
</html>
