<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descent // High Altitude Action</title>
    <style>
        :root {
            --bg-deep: #020617;
            --cliff-shadow: #02040a;
            --cliff-face: #1e293b;
            --accent-orange: #f97316;
            --accent-glow: #fb923c;
            --mist-color: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* The Stage */
        .visual-canvas {
            position: relative;
            width: 100%;
            height: 100%;
            /* Atmospheric gradient sky */
            background: linear-gradient(to bottom, #020617 0%, #0f172a 40%, #334155 85%, #64748b 100%);
        }

        /* SVG Container */
        svg.scene {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            /* Prevents touch scrolling on mobile while maintaining interactivity if added later */
            touch-action: none; 
        }

        /* Film Grain for Texture */
        .grain {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.07;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Vignette for cinematic focus */
        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 50%, #000000 120%);
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div class="visual-canvas">
    
    <!-- Atmospheric Overlays -->
    <div class="grain"></div>
    <div class="vignette"></div>

    <!-- Main Illustration -->
    <svg class="scene" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Gradients -->
            <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#02040a" />
                <stop offset="50%" stop-color="#0f172a" />
                <stop offset="100%" stop-color="#1e293b" />
            </linearGradient>

            <linearGradient id="cliffFaceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#020617" />
                <stop offset="80%" stop-color="#1e293b" />
                <stop offset="100%" stop-color="#334155" />
            </linearGradient>

            <linearGradient id="canopyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#e2e8f0" />
                <stop offset="40%" stop-color="#94a3b8" />
                <stop offset="100%" stop-color="#475569" />
            </linearGradient>

            <radialGradient id="mistGrad" cx="50%" cy="100%" r="50%">
                <stop offset="0%" stop-color="#64748b" stop-opacity="0" />
                <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
            </radialGradient>

            <!-- Filters -->
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="15" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
            
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="10" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
            </filter>

            <!-- Reusable Strata Path for Cliff Texture -->
            <path id="strataLine" d="M-100,0 L100,10 L300,5 L500,20 L700,15 L900,30 L1000,10" stroke="#000000" stroke-width="4" fill="none" opacity="0.6"/>
        </defs>

        <!-- 1. Background Sky (Handled by CSS, but we add depth layers here) -->
        
        <!-- 2. Distant Landscape (Atmospheric Depth) -->
        <g id="landscape" opacity="0.6">
            <!-- Far Mountains -->
            <path d="M0,1080 L0,800 Q200,750 400,820 T800,780 T1200,850 T1600,760 T1920,820 L1920,1080 Z" 
                  fill="#334155" opacity="0.4" />
            <!-- Mid Mountains -->
            <path d="M0,1080 L0,900 Q300,850 600,920 T1200,880 T1920,950 L1920,1080 Z" 
                  fill="#1e293b" opacity="0.7" />
        </g>

        <!-- 3. Motion Cues (Systematized Wind) -->
        <g id="wind-group"></g>

        <!-- 4. The Cliff (Reconstructed Left Anchor) -->
        <g id="cliff-system">
            <!-- Main Cliff Mass -->
            <path d="M-50,-50 L400,-50 L380,50 L450,150 L350,250 L420,400 L300,550 L380,700 L250,850 L350,1000 L200,1150 L-50,1250 Z" 
                  fill="url(#cliffFaceGrad)" />
            
            <!-- Texture: Rock Strata (Horizontal jagged lines) -->
            <g stroke="#020617" stroke-width="3" opacity="0.5">
                <use href="#strataLine" y="100" />
                <use href="#strataLine" y="250" />
                <use href="#strataLine" y="400" />
                <use href="#strataLine" y="550" />
                <use href="#strataLine" y="700" />
                <use href="#strataLine" y="850" />
                <use href="#strataLine" y="1000" />
            </g>

            <!-- Rim Light: The Danger Edge -->
            <!-- Outer Glow -->
            <path d="M400,-50 L380,50 L450,150 L350,250 L420,400 L300,550 L380,700 L250,850 L350,1000 L200,1150" 
                  fill="none" stroke="#94a3b8" stroke-width="8" opacity="0.3" filter="url(#glow)" />
            <!-- Sharp Edge -->
            <path d="M400,-50 L380,50 L450,150 L350,250 L420,400 L300,550 L380,700 L250,850 L350,1000 L200,1150" 
                  fill="none" stroke="#cbd5e1" stroke-width="2" opacity="0.9" />
        </g>

        <!-- 5. The Parachutist (Dynamic Silhouette) -->
        <g id="parachutist-system">
            
            <!-- Canopy (Stylized, Semi-transparent, Structured) -->
            <g id="canopy" transform="translate(0, -350)">
                <!-- Shadow on "ground" (abstract concept here, shadow on lower canopy) -->
                <ellipse cx="0" cy="30" rx="160" ry="40" fill="#000000" opacity="0.3" filter="url(#shadow)" />

                <!-- Canopy Fabric -->
                <path d="M-240,0 C-240,-180 240,-180 240,0 C240,50 90,70 0,70 C-90,70 -240,50 -240,0 Z" 
                      fill="url(#canopyGrad)" />
                
                <!-- Internal Structure: Gores (Vertical lines) -->
                <g stroke="#334155" stroke-width="2" fill="none" opacity="0.6">
                    <path d="M-240,0 C-180,-160 0,-170 0,-170" />
                    <path d="M-160,20 C-100,-140 0,-160 0,-160" />
                    <path d="M-80,40 C-40,-120 0,-150 0,-150" />
                    <path d="M0,45 L0,-150" />
                    <path d="M80,40 C40,-120 0,-150 0,-150" />
                    <path d="M160,20 C100,-140 0,-160 0,-160" />
                    <path d="M240,0 C180,-160 0,-170 0,-170" />
                </g>
                
                <!-- Top Highlight -->
                <path d="M-240,0 C-240,-180 240,-180 240,0" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5" />
            </g>

            <!-- Suspension Lines (Taut, Connecting Canopy to Harness) -->
            <g stroke="#e2e8f0" stroke-width="1.5" opacity="0.8">
                <!-- Left side -->
                <line x1="-220" y1="-340" x2="-25" y2="0" />
                <line x1="-120" y1="-335" x2="-15" y2="0" />
                <line x1="-40" y1="-330" x2="-5" y2="0" />
                <!-- Right side -->
                <line x1="220" y1="-340" x2="25" y2="0" />
                <line x1="120" y1="-335" x2="15" y2="0" />
                <line x1="40" y1="-330" x2="5" y2="0" />
            </g>

            <!-- Human Figure (Volumetric, Dynamic Pose) -->
            <g id="human-figure">
                <!-- Harness (Orange, Volumetric) -->
                <rect x="-25" y="-15" width="50" height="60" rx="10" fill="var(--accent-orange)" filter="url(#shadow)" />
                <path d="M-15,-15 L15,-15 L15,45 L-15,45 Z" fill="var(--accent-glow)" opacity="0.5"/> <!-- Highlight -->
                
                <!-- Torso (Dark Silhouette leaning back) -->
                <path d="M-18,-15 L-22,40 L22,40 L18,-15 Z" fill="#020617" />
                
                <!-- Head -->
                <circle cx="0" cy="-30" r="14" fill="#020617" />
                
                <!-- Legs (Dangling, heavy lines) -->
                <path d="M-15,40 C-25,90 -15,140 -5,170" stroke="#020617" stroke-width="16" fill="none" stroke-linecap="round"/>
                <path d="M15,40 C25,90 15,140 5,170" stroke="#020617" stroke-width="16" fill="none" stroke-linecap="round"/>
                
                <!-- Arms (Active, Bracing) -->
                <!-- Left Arm -->
                <path d="M-10,-5 C-35,10 -45,40 -30,60" stroke="#020617" stroke-width="12" fill="none" stroke-linecap="round"/>
                <!-- Right Arm -->
                <path d="M10,-5 C35,10 45,40 30,60" stroke="#020617" stroke-width="12" fill="none" stroke-linecap="round"/>
                
                <!-- Rim light on human to separate from dark background -->
                <path d="M-18,-15 L-22,40" stroke="#334155" stroke-width="2" fill="none"/>
            </g>
        </g>

        <!-- 6. Foreground Mist (Depth) -->
        <rect x="0" y="800" width="1920" height="300" fill="url(#mistGrad)" pointer-events="none" />
    </svg>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const windGroup = document.getElementById('wind-group');
        const parachutist = document.getElementById('parachutist-system');
        
        // --- Configuration ---
        const config = {
            windCount: 60, // Fewer, stronger lines
            baseX: 1200, // Position in the "open" sky
            baseY: 450,
            bobSpeed: 0.002, 
            bobHeight: 20,
            swaySpeed: 0.001, 
            swayWidth: 30,
            descentSpeed: 0.8 // Slow, controlled descent
        };

        let state = {
            time: 0,
            y: config.baseY
        };

        // --- Generate Systematized Wind Lines ---
        // Instead of random noise, we create rhythmic, horizontal streaks
        for(let i = 0; i < config.windCount; i++) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            
            // Distribute vertically across the screen
            const y = Math.random() * 1080;
            // Start off-screen left
            const x = Math.random() * -1920; 
            
            // Vary length significantly for depth (longer = further/faster)
            const length = 200 + Math.random() * 600; 
            const width = 0.5 + Math.random() * 2; 
            
            // Color variation (white vs light blue)
            const opacity = 0.1 + (Math.random() * 0.3);
            
            line.setAttribute("x1", x);
            line.setAttribute("y1", y);
            line.setAttribute("x2", x + length);
            line.setAttribute("y2", y); // Perfectly horizontal for speed
            
            line.setAttribute("stroke", Math.random() > 0.5 ? "#ffffff" : "#94a3b8");
            line.setAttribute("stroke-width", width);
            line.setAttribute("stroke-linecap", "round");
            line.setAttribute("opacity", opacity);
            
            // Store data for animation
            line.dataset.speed = 10 + Math.random() * 20; // High speed
            line.dataset.x = x;
            line.dataset.len = length;
            
            windGroup.appendChild(line);
        }

        // --- Animation Loop ---
        function animate() {
            state.time += 1;

            // 1. Parachutist Physics (Gentle, heavy descent)
            const bob = Math.sin(state.time * config.bobSpeed * 100) * config.bobHeight;
            const sway = Math.sin(state.time * config.swaySpeed * 100) * config.swayWidth;
            
            state.y += config.descentSpeed;
            // Reset when passing bottom
            if (state.y > 1200) state.y = -300;

            // Apply Transform
            parachutist.setAttribute('transform', `translate(${config.baseX + sway}, ${state.y + bob})`);

            // 2. Wind Animation (Rhythmic Speed)
            const lines = windGroup.children;
            for(let i = 0; i < lines.length; i++) {
                const line = lines[i];
                let currentX = parseFloat(line.dataset.x);
                const speed = parseFloat(line.dataset.speed);
                const len = parseFloat(line.dataset.len);

                currentX += speed;
                
                // Reset if off screen right
                if (currentX > 1920) {
                    currentX = -len - (Math.random() * 500); // Random gap before respawning
                    line.dataset.x = currentX;
                    line.setAttribute("x1", currentX);
                    line.setAttribute("x2", currentX + len);
                } else {
                    // Update position
                    line.setAttribute("x1", currentX);
                    line.setAttribute("x2", currentX + len);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>
</body>
</html>
