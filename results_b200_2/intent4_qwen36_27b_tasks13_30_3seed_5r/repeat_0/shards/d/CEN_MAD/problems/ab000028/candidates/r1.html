<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpine Descent // Visual Revision</title>
    <style>
        :root {
            /* Palette */
            --color-bg-deep: #020617;
            --color-rock-dark: #0f172a;
            --color-rock-light: #1e293b;
            --color-rock-highlight: #334155;
            --color-sky-top: #0f172a;
            --color-sky-mid: #475569;
            --color-sky-horizon: #94a3b8;
            --color-text-main: #f8fafc;
            --color-text-dim: #64748b;
            --color-accent: #38bdf8;
            
            /* Typography */
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--color-bg-deep);
            color: var(--color-text-main);
            font-family: var(--font-mono);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: block; /* Changed from flex to block for full bleed */
        }

        /* --- Full Bleed Container --- */
        .visual-canvas {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, var(--color-sky-top) 0%, var(--color-sky-mid) 50%, var(--color-sky-horizon) 100%);
        }

        /* --- The SVG Illustration --- */
        svg.scene {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* --- Minimal UI Overlay --- */
        .ui-overlay {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            z-index: 20;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .ui-data-block {
            background: rgba(2, 6, 23, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.75rem 1rem;
            backdrop-filter: blur(4px);
            width: fit-content;
        }

        .ui-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-text-dim);
            margin-bottom: 0.25rem;
            display: block;
        }

        .ui-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--color-text-main);
            letter-spacing: -0.02em;
        }

        .ui-value.highlight {
            color: var(--color-accent);
        }

        /* Grain Overlay for texture */
        .grain {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

    </style>
</head>
<body>

<div class="visual-canvas">
    
    <!-- Grain Texture -->
    <div class="grain"></div>

    <!-- Main Illustration -->
    <svg class="scene" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Gradients -->
            <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#020617" />
                <stop offset="40%" stop-color="#0f172a" />
                <stop offset="80%" stop-color="#1e293b" />
                <stop offset="100%" stop-color="#475569" />
            </linearGradient>

            <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#020617" />
                <stop offset="80%" stop-color="#0f172a" />
                <stop offset="100%" stop-color="#1e293b" />
            </linearGradient>

            <linearGradient id="mistGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#0f172a" stop-opacity="0" />
                <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
            </linearGradient>

            <!-- Filters -->
            <filter id="blurFar" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="15" />
            </filter>
            <filter id="blurMid" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="5" />
            </filter>
        </defs>

        <!-- 1. Background Sky -->
        <rect width="1920" height="1080" fill="url(#skyGrad)" />

        <!-- 2. Distant Landscape (Depth) -->
        <g opacity="0.6">
            <!-- Farthest Range (Blue/Grey, Hazy) -->
            <path d="M0,1080 L0,750 Q250,700 500,780 T1100,720 T1920,800 L1920,1080 Z" fill="#475569" filter="url(#blurFar)" />
            <!-- Mid Range (Darker, slightly sharper) -->
            <path d="M0,1080 L0,850 Q300,800 600,880 T1400,820 T1920,900 L1920,1080 Z" fill="#1e293b" filter="url(#blurMid)" />
        </g>

        <!-- 3. Motion Cues (Wind Streaks) -->
        <g id="wind-group" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.3">
            <!-- Generated via JS -->
        </g>

        <!-- 4. The Cliff (Left Anchor) -->
        <g id="cliff-system">
            <!-- Base Shape -->
            <path d="M-100,-100 L350,-100 L350,150 L320,200 L380,300 L300,400 L340,500 L250,600 L320,750 L200,900 L280,1080 L-100,1200 Z" 
                  fill="url(#cliffGrad)" />
            
            <!-- Geologic Strata (Texture) -->
            <g stroke="#020617" stroke-width="3" opacity="0.5">
                <path d="M350,150 L320,200" />
                <path d="M320,200 L380,300" />
                <path d="M380,300 L300,400" />
                <path d="M300,400 L340,500" />
                <path d="M340,500 L250,600" />
                <path d="M250,600 L320,750" />
                <path d="M320,750 L200,900" />
                <path d="M200,900 L280,1080" />
            </g>

            <!-- Strata Highlights (Inner Glow effect) -->
            <g stroke="#334155" stroke-width="1" fill="none" opacity="0.6">
                <path d="M345,150 L315,200" />
                <path d="M315,200 L375,300" />
                <path d="M375,300 L295,400" />
                <path d="M295,400 L335,500" />
                <path d="M335,500 L245,600" />
                <path d="M245,600 L315,750" />
                <path d="M315,750 L195,900" />
                <path d="M195,900 L275,1080" />
            </g>

            <!-- Edge Highlight (Danger Zone) -->
            <path d="M350,-100 L350,150 L320,200 L380,300 L300,400 L340,500 L250,600 L320,750 L200,900 L280,1080" 
                  fill="none" stroke="#64748b" stroke-width="2" opacity="0.8" />
        </g>

        <!-- 5. The Parachutist (Center-Right) -->
        <g id="parachutist-system" transform="translate(0,0)">
            
            <!-- Canopy -->
            <g id="canopy" transform="translate(0, -180)">
                <!-- Main Canopy Shape -->
                <path d="M-140,0 C-140,-120 140,-120 140,0 C140,25 60,35 0,35 C-60,35 -140,25 -140,0 Z" fill="#f1f5f9" />
                
                <!-- Canopy Ribs (Volume) -->
                <g stroke="#cbd5e1" stroke-width="1.5" fill="none" opacity="0.6">
                    <path d="M-140,0 Q-70,-80 0,-90" />
                    <path d="M-70,15 Q-35,-40 0,-45" />
                    <path d="M70,15 Q35,-40 0,-45" />
                    <path d="M140,0 Q70,-80 0,-90" />
                </g>
                
                <!-- Shadow under canopy -->
                <path d="M-130,10 C-130,30 130,30 130,10 C130,20 60,30 0,30 C-60,30 -130,20 -130,10 Z" fill="#94a3b8" opacity="0.5" />
            </g>

            <!-- Suspension Lines (Taut) -->
            <g stroke="#e2e8f0" stroke-width="1" opacity="0.8">
                <!-- Left Lines -->
                <line x1="-120" y1="-170" x2="-15" y2="0" />
                <line x1="-60" y1="-165" x2="-10" y2="0" />
                <!-- Right Lines -->
                <line x1="120" y1="-170" x2="15" y2="0" />
                <line x1="60" y1="-165" x2="10" y2="0" />
            </g>

            <!-- Human Figure (Silhouette) -->
            <g id="human" fill="#020617">
                <!-- Harness -->
                <rect x="-12" y="-5" width="24" height="35" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
                
                <!-- Body -->
                <path d="M-10,-5 L-8,30 L8,30 L10,-5 Z" />
                
                <!-- Legs (Dangling) -->
                <path d="M-8,30 C-12,50 -20,70 -15,90" stroke="#020617" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M8,30 C12,50 20,70 15,90" stroke="#020617" stroke-width="8" fill="none" stroke-linecap="round"/>
                
                <!-- Head -->
                <circle cx="0" cy="-15" r="9" />
                
                <!-- Arms (Holding risers) -->
                <path d="M-5,0 C-15,5 -25,15 -15,25" stroke="#020617" stroke-width="6" fill="none" stroke-linecap="round"/>
                <path d="M5,0 C15,5 25,15 15,25" stroke="#020617" stroke-width="6" fill="none" stroke-linecap="round"/>
            </g>
        </g>

        <!-- 6. Foreground Mist (Atmosphere) -->
        <rect x="0" y="900" width="1920" height="200" fill="url(#mistGrad)" />
    </svg>

    <!-- Minimal UI -->
    <div class="ui-overlay">
        <div class="ui-data-block">
            <span class="ui-label">Altitude</span>
            <div class="ui-value highlight" id="altitude-display">14,250 FT</div>
        </div>
        <div class="ui-data-block">
            <span class="ui-label">Vertical Speed</span>
            <div class="ui-value">-24.5 FT/S</div>
        </div>
    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const windGroup = document.getElementById('wind-group');
        const parachutist = document.getElementById('parachutist-system');
        const altDisplay = document.getElementById('altitude-display');
        
        // --- Configuration ---
        const config = {
            windCount: 60,
            baseX: 1000, // Start position X
            baseY: 400,  // Start position Y
            bobSpeed: 0.002,
            bobHeight: 15,
            swaySpeed: 0.001,
            swayWidth: 8,
            descentSpeed: 0.3 // Pixels per frame
        };

        let state = {
            time: 0,
            y: config.baseY,
            altitude: 14250
        };

        // --- Generate Wind Lines ---
        for(let i = 0; i < config.windCount; i++) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            // Randomize position and length
            const y = Math.random() * 1080;
            const x = Math.random() * 1920;
            const length = 50 + Math.random() * 150;
            
            line.setAttribute("x1", x);
            line.setAttribute("y1", y);
            line.setAttribute("x2", x + length);
            line.setAttribute("y2", y);
            
            // Vary opacity for depth
            line.setAttribute("opacity", 0.1 + Math.random() * 0.4);
            
            // Store data for animation
            line.dataset.speed = 3 + Math.random() * 8; // Speed
            line.dataset.x = x;
            line.dataset.len = length;
            
            windGroup.appendChild(line);
        }

        // --- Animation Loop ---
        function animate() {
            state.time += 1;

            // 1. Parachutist Physics
            // Bobbing (Vertical)
            const bob = Math.sin(state.time * config.bobSpeed * 100) * config.bobHeight;
            // Swaying (Horizontal)
            const sway = Math.sin(state.time * config.swaySpeed * 100) * config.swayWidth;
            
            // Descent
            state.y += config.descentSpeed;
            // Loop descent visual (keep within screen bounds roughly)
            if (state.y > 1200) state.y = -200;

            // Apply Transform
            parachutist.setAttribute('transform', `translate(${config.baseX + sway}, ${state.y + bob})`);

            // 2. Wind Animation
            const lines = windGroup.children;
            for(let i = 0; i < lines.length; i++) {
                const line = lines[i];
                let currentX = parseFloat(line.dataset.x);
                const speed = parseFloat(line.dataset.speed);
                const len = parseFloat(line.dataset.len);

                currentX += speed;
                
                // Reset if off screen right
                if (currentX > 1920) {
                    currentX = -len - 100;
                    // Randomize Y slightly on reset for organic feel
                    const newY = Math.random() * 1080;
                    line.setAttribute("y1", newY);
                    line.setAttribute("y2", newY);
                }

                line.dataset.x = currentX;
                line.setAttribute("x1", currentX);
                line.setAttribute("x2", currentX + len);
            }

            // 3. Update UI Data
            state.altitude -= 0.5;
            if(state.altitude < 0) state.altitude = 14500;
            altDisplay.innerText = Math.floor(state.altitude).toLocaleString() + " FT";

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>

</body>
</html>
