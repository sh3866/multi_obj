<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpine Descent // Design Revision</title>
    <style>
        :root {
            /* Palette - Deeper, Richer */
            --color-bg-deep: #02040a;
            --color-rock-dark: #0f131c;
            --color-rock-light: #1c2333;
            --color-rock-highlight: #2d3748;
            --color-sky-top: #050914;
            --color-sky-mid: #1a2639;
            --color-sky-horizon: #5c6b7f;
            --color-text-main: #f1f5f9;
            --color-text-dim: #64748b;
            --color-accent: #38bdf8; /* Cyan - Used sparingly */
            
            /* Typography */
            --font-mono: 'Courier New', Courier, monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--color-bg-deep);
            color: var(--color-text-main);
            font-family: var(--font-sans);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: block;
        }

        /* --- Full Bleed Container --- */
        .visual-canvas {
            position: relative;
            width: 100%;
            height: 100%;
            /* Dramatic Sky Gradient */
            background: linear-gradient(to bottom, var(--color-sky-top) 0%, var(--color-sky-mid) 40%, var(--color-sky-horizon) 85%, #8b9bb4 100%);
        }

        /* --- The SVG Illustration --- */
        svg.scene {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* --- UI Overlay (Demoted & Integrated) --- */
        .ui-overlay {
            position: absolute;
            bottom: 2.5rem;
            left: 2.5rem;
            z-index: 20;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .ui-data-block {
            /* Removed solid background, reduced visual weight */
            display: flex;
            flex-direction: column;
        }

        .ui-label {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.5); /* Lowered opacity */
            margin-bottom: 0.2rem;
        }

        .ui-value {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-text-main);
            letter-spacing: -0.04em;
            line-height: 1;
        }

        .ui-value.highlight {
            color: var(--color-accent);
        }

        /* Grain Overlay for texture */
        .grain {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

    </style>
</head>
<body>

<div class="visual-canvas">
    
    <!-- Grain Texture -->
    <div class="grain"></div>

    <!-- Main Illustration -->
    <svg class="scene" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Gradients -->
            <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#020617" />
                <stop offset="40%" stop-color="#0f172a" />
                <stop offset="80%" stop-color="#1e293b" />
                <stop offset="100%" stop-color="#475569" />
            </linearGradient>

            <!-- Cliff Texture Gradient -->
            <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#020617" />
                <stop offset="70%" stop-color="#0f172a" />
                <stop offset="100%" stop-color="#1e293b" />
            </linearGradient>

            <!-- Canopy Gradient for Volume -->
            <radialGradient id="canopyGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="30%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="80%" stop-color="#e2e8f0" />
                <stop offset="100%" stop-color="#94a3b8" />
            </radialGradient>

            <linearGradient id="mistGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#0f172a" stop-opacity="0" />
                <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
            </linearGradient>

            <!-- Filters -->
            <filter id="blurFar" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="15" />
            </filter>
            <filter id="blurMid" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="6" />
            </filter>
            <filter id="shadowBlur" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="8" />
            </filter>
        </defs>

        <!-- 1. Background Sky -->
        <rect width="1920" height="1080" fill="url(#skyGrad)" />

        <!-- 2. Distant Landscape (Atmospheric Depth) -->
        <g id="landscape">
            <!-- Farthest Range (Blue/Grey, Hazy) -->
            <path d="M0,1080 L0,750 Q250,700 500,780 T1100,720 T1920,800 L1920,1080 Z" fill="#475569" opacity="0.4" filter="url(#blurFar)" />
            <!-- Mid Range (Darker, slightly sharper) -->
            <path d="M0,1080 L0,850 Q300,800 600,880 T1400,820 T1920,900 L1920,1080 Z" fill="#1e293b" opacity="0.7" filter="url(#blurMid)" />
        </g>

        <!-- 3. Motion Cues (Dynamic Wind Streaks) -->
        <g id="wind-group" stroke="#ffffff" stroke-linecap="round" opacity="0.2">
            <!-- Generated via JS -->
        </g>

        <!-- 4. The Cliff (Reconstructed Left Anchor) -->
        <g id="cliff-system">
            <!-- Base Shape: Jagged, Solid -->
            <path d="M-100,-100 L450,-100 L450,180 L400,240 L480,350 L380,480 L420,600 L350,750 L450,900 L300,1100 L-100,1200 Z" 
                  fill="url(#cliffGrad)" />
            
            <!-- Geologic Strata (Horizontal Texture) -->
            <g stroke="#000000" stroke-width="4" opacity="0.4">
                <!-- Main Strata Lines -->
                <path d="M-100,200 L440,220" />
                <path d="M-100,350 L460,360" />
                <path d="M-100,500 L410,520" />
                <path d="M-100,650 L370,670" />
                <path d="M-100,800 L430,820" />
                <path d="M-100,950 L320,970" />
            </g>

            <!-- Strata Highlights (Inner Edge Lighting) -->
            <g stroke="#334155" stroke-width="1" fill="none" opacity="0.5">
                <path d="M-100,205 L440,225" />
                <path d="M-100,355 L460,365" />
                <path d="M-100,505 L410,525" />
                <path d="M-100,655 L370,675" />
                <path d="M-100,805 L430,825" />
                <path d="M-100,955 L320,975" />
            </g>

            <!-- Edge Highlight (Danger Zone / Rim Light) -->
            <path d="M450,-100 L450,180 L400,240 L480,350 L380,480 L420,600 L350,750 L450,900 L300,1100" 
                  fill="none" stroke="#64748b" stroke-width="3" opacity="0.6" />
        </g>

        <!-- 5. The Parachutist (Elevated Scale & Craft) -->
        <!-- Centered around 1100, 400 initially -->
        <g id="parachutist-system" transform="translate(0,0)">
            
            <!-- Canopy (Redrawn with Gores & Volume) -->
            <g id="canopy" transform="translate(0, -280)">
                <!-- Shadow under canopy for depth -->
                <ellipse cx="0" cy="35" rx="180" ry="20" fill="#000000" opacity="0.3" filter="url(#shadowBlur)" />

                <!-- Main Canopy Shape -->
                <path d="M-200,0 C-200,-160 200,-160 200,0 C200,40 80,55 0,55 C-80,55 -200,40 -200,0 Z" fill="url(#canopyGrad)" />
                
                <!-- Gores (Vertical Panel Lines) -->
                <g stroke="#94a3b8" stroke-width="1" fill="none" opacity="0.3">
                    <path d="M-200,0 Q-100,-120 0,-140" />
                    <path d="M-100,30 Q-50,-60 0,-70" />
                    <path d="M100,30 Q50,-60 0,-70" />
                    <path d="M200,0 Q100,-120 0,-140" />
                </g>
                
                <!-- Top Highlight (Rim Light) -->
                <path d="M-200,0 C-200,-160 200,-160 200,0" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8" />
            </g>

            <!-- Suspension Lines (Taut) -->
            <g stroke="#cbd5e1" stroke-width="1.5" opacity="0.8">
                <!-- Left Lines -->
                <line x1="-160" y1="-270" x2="-20" y2="0" />
                <line x1="-80" y1="-260" x2="-15" y2="0" />
                <!-- Right Lines -->
                <line x1="160" y1="-270" x2="20" y2="0" />
                <line x1="80" y1="-260" x2="15" y2="0" />
            </g>

            <!-- Human Figure (Distinct Dynamic Silhouette) -->
            <g id="human">
                <!-- Harness -->
                <rect x="-18" y="-10" width="36" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2"/>
                
                <!-- Body -->
                <path d="M-15,-10 L-12,40 L12,40 L15,-10 Z" fill="#0f172a" />
                
                <!-- Legs (Dangling - Dynamic) -->
                <path d="M-12,40 C-18,70 -25,100 -18,130" stroke="#0f172a" stroke-width="12" fill="none" stroke-linecap="round"/>
                <path d="M12,40 C18,70 25,100 18,130" stroke="#0f172a" stroke-width="12" fill="none" stroke-linecap="round"/>
                
                <!-- Head -->
                <circle cx="0" cy="-25" r="12" fill="#0f172a" />
                
                <!-- Arms (Holding risers - Active Pose) -->
                <path d="M-5,-5 C-25,0 -35,20 -20,35" stroke="#0f172a" stroke-width="10" fill="none" stroke-linecap="round"/>
                <path d="M5,-5 C25,0 35,20 20,35" stroke="#0f172a" stroke-width="10" fill="none" stroke-linecap="round"/>
            </g>
        </g>

        <!-- 6. Foreground Mist (Atmosphere) -->
        <rect x="0" y="900" width="1920" height="200" fill="url(#mistGrad)" />
    </svg>

    <!-- Minimal UI -->
    <div class="ui-overlay">
        <div class="ui-data-block">
            <span class="ui-label">Altitude</span>
            <div class="ui-value highlight" id="altitude-display">14,250 FT</div>
        </div>
        <div class="ui-data-block">
            <span class="ui-label">Vertical Speed</span>
            <div class="ui-value">-24.5 FT/S</div>
        </div>
        <div class="ui-data-block">
            <span class="ui-label">Wind</span>
            <div class="ui-value" style="font-size: 1rem; opacity: 0.8;">NW 12KT</div>
        </div>
    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const windGroup = document.getElementById('wind-group');
        const parachutist = document.getElementById('parachutist-system');
        const altDisplay = document.getElementById('altitude-display');
        
        // --- Configuration ---
        const config = {
            windCount: 90, // More lines for better density
            baseX: 1200, // Moved slightly right to balance the heavy cliff
            baseY: 400,
            bobSpeed: 0.0015, // Slower, smoother bob
            bobHeight: 12,
            swaySpeed: 0.0008, // Slower sway
            swayWidth: 15,
            descentSpeed: 0.4 
        };

        let state = {
            time: 0,
            y: config.baseY,
            altitude: 14250
        };

        // --- Generate Dynamic Wind Lines ---
        for(let i = 0; i < config.windCount; i++) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            
            const y = Math.random() * 1080;
            const x = Math.random() * 1920;
            // Vary length and stroke width for tapered look
            const length = 100 + Math.random() * 300; 
            const width = 1 + Math.random() * 2;
            
            line.setAttribute("x1", x);
            line.setAttribute("y1", y);
            line.setAttribute("x2", x + length);
            line.setAttribute("y2", y + (Math.random() * 20 - 10)); // Slight vertical angle
            
            line.setAttribute("stroke-width", width);
            line.setAttribute("opacity", 0.05 + Math.random() * 0.25);
            
            // Store data for animation
            line.dataset.speed = 4 + Math.random() * 12; // Faster wind
            line.dataset.x = x;
            line.dataset.len = length;
            
            windGroup.appendChild(line);
        }

        // --- Animation Loop ---
        function animate() {
            state.time += 1;

            // 1. Parachutist Physics
            const bob = Math.sin(state.time * config.bobSpeed * 100) * config.bobHeight;
            const sway = Math.sin(state.time * config.swaySpeed * 100) * config.swayWidth;
            
            state.y += config.descentSpeed;
            // Loop descent
            if (state.y > 1200) state.y = -200;

            // Apply Transform
            parachutist.setAttribute('transform', `translate(${config.baseX + sway}, ${state.y + bob})`);

            // 2. Wind Animation (Motion Cues)
            const lines = windGroup.children;
            for(let i = 0; i < lines.length; i++) {
                const line = lines[i];
                let currentX = parseFloat(line.dataset.x);
                const speed = parseFloat(line.dataset.speed);
                const len = parseFloat(line.dataset.len);

                currentX += speed;
                
                // Reset if off screen
                if (currentX > 1920) {
                    currentX = -len - 100;
                    const newY = Math.random() * 1080;
                    line.setAttribute("y1", newY);
                    line.setAttribute("y2", newY + (Math.random() * 20 - 10));
                }

                line.dataset.x = currentX;
                line.setAttribute("x1", currentX);
                line.setAttribute("x2", currentX + len);
            }

            // 3. Update UI Data
            state.altitude -= 0.2;
            if(state.altitude < 12000) state.altitude = 14500;
            altDisplay.innerText = Math.floor(state.altitude).toLocaleString() + " FT";

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>
</body>
</html>
