<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpine Descent // Design Revision</title>
    <style>
        :root {
            /* Palette - Deeper, Richer, Higher Contrast */
            --color-bg-deep: #02040a;
            --color-rock-dark: #05070a;
            --color-rock-light: #1c2333;
            --color-sky-top: #050914;
            --color-sky-mid: #1a2639;
            --color-sky-horizon: #5c6b7f;
            --color-accent: #ff8c00; /* Warm Orange for Figure */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--color-bg-deep);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: block;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* --- Full Bleed Container --- */
        .visual-canvas {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, var(--color-sky-top) 0%, var(--color-sky-mid) 40%, var(--color-sky-horizon) 85%, #8b9bb4 100%);
        }

        /* --- The SVG Illustration --- */
        svg.scene {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Grain Overlay for texture */
        .grain {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.08;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body>

<div class="visual-canvas">
    
    <!-- Grain Texture -->
    <div class="grain"></div>

    <!-- Main Illustration -->
    <svg class="scene" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Gradients -->
            <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#020617" />
                <stop offset="40%" stop-color="#0f172a" />
                <stop offset="80%" stop-color="#1e293b" />
                <stop offset="100%" stop-color="#475569" />
            </linearGradient>

            <!-- Cliff Texture Gradient - Charcoal/Indigo -->
            <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#020617" />
                <stop offset="60%" stop-color="#0f172a" />
                <stop offset="100%" stop-color="#1e293b" />
            </linearGradient>

            <!-- Canopy Gradient for Volume -->
            <radialGradient id="canopyGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="30%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="85%" stop-color="#cbd5e1" />
                <stop offset="100%" stop-color="#64748b" />
            </radialGradient>

            <linearGradient id="mistGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#0f172a" stop-opacity="0" />
                <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
            </linearGradient>

            <!-- Filters -->
            <filter id="blurFar" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="15" />
            </filter>
            <filter id="blurMid" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="6" />
            </filter>
            <filter id="shadowBlur" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="12" />
            </filter>
        </defs>

        <!-- 1. Background Sky -->
        <rect width="1920" height="1080" fill="url(#skyGrad)" />

        <!-- 2. Distant Landscape (Atmospheric Depth) -->
        <g id="landscape">
            <!-- Farthest Range -->
            <path d="M0,1080 L0,750 Q250,700 500,780 T1100,720 T1920,800 L1920,1080 Z" fill="#475569" opacity="0.4" filter="url(#blurFar)" />
            <!-- Mid Range -->
            <path d="M0,1080 L0,850 Q300,800 600,880 T1400,820 T1920,900 L1920,1080 Z" fill="#1e293b" opacity="0.7" filter="url(#blurMid)" />
        </g>

        <!-- 3. Motion Cues (Dynamic Wind Streaks) -->
        <g id="wind-group" stroke="#ffffff" stroke-linecap="round" opacity="0.3"></g>

        <!-- 4. The Cliff (Reconstructed Left Anchor - Jagged & Textured) -->
        <g id="cliff-system">
            <!-- Base Shape: Jagged, Solid -->
            <path d="M-100,-100 L550,-100 L550,120 L480,180 L520,320 L420,450 L480,580 L380,720 L480,880 L320,1100 L-100,1200 Z" 
                  fill="url(#cliffGrad)" />
            
            <!-- Geologic Strata (Horizontal Texture) -->
            <g stroke="#000000" stroke-width="5" opacity="0.5">
                <path d="M-100,150 L540,170" />
                <path d="M-100,300 L500,310" />
                <path d="M-100,450 L450,470" />
                <path d="M-100,600 L410,620" />
                <path d="M-100,750 L460,770" />
                <path d="M-100,900 L350,920" />
            </g>

            <!-- Strata Highlights (Inner Edge Lighting) -->
            <g stroke="#334155" stroke-width="2" fill="none" opacity="0.4">
                <path d="M-100,155 L540,175" />
                <path d="M-100,305 L500,315" />
                <path d="M-100,455 L450,475" />
                <path d="M-100,605 L410,625" />
                <path d="M-100,755 L460,775" />
                <path d="M-100,905 L350,925" />
            </g>

            <!-- Edge Highlight (Danger Zone / Rim Light) -->
            <path d="M550,-100 L550,120 L480,180 L520,320 L420,450 L480,580 L380,720 L480,880 L320,1100" 
                  fill="none" stroke="#64748b" stroke-width="4" opacity="0.7" filter="url(#shadowBlur)" />
            <path d="M550,-100 L550,120 L480,180 L520,320 L420,450 L480,580 L380,720 L480,880 L320,1100" 
                  fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.8" />
        </g>

        <!-- 5. The Parachutist (Elevated Scale & Craft) -->
        <!-- Centered around 1200, 400 initially -->
        <g id="parachutist-system" transform="translate(0,0)">
            
            <!-- Canopy (Redrawn with Gores & Volume) -->
            <g id="canopy" transform="translate(0, -280)">
                <!-- Shadow under canopy for depth -->
                <ellipse cx="0" cy="40" rx="180" ry="25" fill="#000000" opacity="0.4" filter="url(#shadowBlur)" />

                <!-- Main Canopy Shape -->
                <path d="M-210,0 C-210,-170 210,-170 210,0 C210,45 85,60 0,60 C-85,60 -210,45 -210,0 Z" fill="url(#canopyGrad)" />
                
                <!-- Gores (Vertical Panel Lines) -->
                <g stroke="#475569" stroke-width="2" fill="none" opacity="0.2">
                    <path d="M-210,0 Q-100,-130 0,-150" />
                    <path d="M-100,30 Q-50,-70 0,-80" />
                    <path d="M100,30 Q50,-70 0,-80" />
                    <path d="M210,0 Q100,-130 0,-150" />
                </g>
                
                <!-- Top Highlight (Rim Light) -->
                <path d="M-210,0 C-210,-170 210,-170 210,0" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9" />
            </g>

            <!-- Suspension Lines (Taut) -->
            <g stroke="#e2e8f0" stroke-width="2" opacity="0.9">
                <!-- Left Lines -->
                <line x1="-180" y1="-270" x2="-22" y2="0" />
                <line x1="-90" y1="-260" x2="-18" y2="0" />
                <!-- Right Lines -->
                <line x1="180" y1="-270" x2="22" y2="0" />
                <line x1="90" y1="-260" x2="18" y2="0" />
            </g>

            <!-- Human Figure (Distinct Dynamic Silhouette - Warm Orange) -->
            <g id="human">
                <!-- Harness -->
                <rect x="-20" y="-10" width="40" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
                
                <!-- Body -->
                <path d="M-16,-10 L-14,45 L14,45 L16,-10 Z" fill="#0f172a" />
                
                <!-- Legs (Dangling - Dynamic) -->
                <path d="M-14,45 C-20,80 -28,110 -22,145" stroke="#0f172a" stroke-width="13" fill="none" stroke-linecap="round"/>
                <path d="M14,45 C20,80 28,110 22,145" stroke="#0f172a" stroke-width="13" fill="none" stroke-linecap="round"/>
                
                <!-- Head -->
                <circle cx="0" cy="-28" r="13" fill="#0f172a" />
                
                <!-- Arms (Bracing/Active Pose) -->
                <!-- Highlight the figure with a rim light color for contrast -->
                <path d="M-8,-5 C-30,5 -40,30 -25,50" stroke="#ff8c00" stroke-width="11" fill="none" stroke-linecap="round"/>
                <path d="M8,-5 C30,5 40,30 25,50" stroke="#ff8c00" stroke-width="11" fill="none" stroke-linecap="round"/>
            </g>
        </g>

        <!-- 6. Foreground Mist (Atmosphere) -->
        <rect x="0" y="900" width="1920" height="200" fill="url(#mistGrad)" />
    </svg>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const windGroup = document.getElementById('wind-group');
        const parachutist = document.getElementById('parachutist-system');
        
        // --- Configuration ---
        const config = {
            windCount: 120, // Increased density
            baseX: 1200, // Centered in the open sky
            baseY: 400,
            bobSpeed: 0.0015, 
            bobHeight: 15,
            swaySpeed: 0.0008, 
            swayWidth: 20,
            descentSpeed: 0.6 
        };

        let state = {
            time: 0,
            y: config.baseY
        };

        // --- Generate Dynamic Wind Lines ---
        // Sweeping, variable-width streaks
        for(let i = 0; i < config.windCount; i++) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            
            const y = Math.random() * 1080;
            const x = Math.random() * 1920;
            // Vary length and stroke width for tapered look
            const length = 150 + Math.random() * 400; 
            const width = 1 + Math.random() * 3; // Thicker lines for "speed"
            
            line.setAttribute("x1", x);
            line.setAttribute("y1", y);
            line.setAttribute("x2", x + length);
            line.setAttribute("y2", y + (Math.random() * 40 - 20)); // Slight vertical angle
            
            line.setAttribute("stroke-width", width);
            line.setAttribute("opacity", 0.1 + Math.random() * 0.4);
            
            // Store data for animation
            line.dataset.speed = 6 + Math.random() * 15; // Faster wind
            line.dataset.x = x;
            line.dataset.len = length;
            
            windGroup.appendChild(line);
        }

        // --- Animation Loop ---
        function animate() {
            state.time += 1;

            // 1. Parachutist Physics
            const bob = Math.sin(state.time * config.bobSpeed * 100) * config.bobHeight;
            const sway = Math.sin(state.time * config.swaySpeed * 100) * config.swayWidth;
            
            state.y += config.descentSpeed;
            // Loop descent to keep it in frame
            if (state.y > 1200) state.y = -200;

            // Apply Transform
            parachutist.setAttribute('transform', `translate(${config.baseX + sway}, ${state.y + bob})`);

            // 2. Wind Animation (Motion Cues)
            const lines = windGroup.children;
            for(let i = 0; i < lines.length; i++) {
                const line = lines[i];
                let currentX = parseFloat(line.dataset.x);
                const speed = parseFloat(line.dataset.speed);
                const len = parseFloat(line.dataset.len);

                currentX += speed;
                
                // Reset if off screen
                if (currentX > 1920) {
                    currentX = -len - 100;
                    const newY = Math.random() * 1080;
                    line.setAttribute("y1", newY);
                    line.setAttribute("y2", newY + (Math.random() * 40 - 20));
                }

                line.dataset.x = currentX;
                line.setAttribute("x1", currentX);
                line.setAttribute("x2", currentX + len);
            }

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>
</body>
</html>
