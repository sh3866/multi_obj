<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactile Reality: Study No. 04</title>
    <style>
        :root {
            --bg-color: #0b0b0c;
            --text-primary: #f0f0f0;
            --text-secondary: #6e6e73;
            --accent: #d4af37;
            --font-display: 'Didot', 'Times New Roman', serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Grain Texture for "Film" Look */
        .grain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Main Layout */
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 40% 60%;
        }

        /* Left Panel: Typography & Data */
        .editorial-panel {
            padding: 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 2;
            background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 100%);
        }

        .header-group {
            margin-bottom: 3rem;
        }

        .meta-label {
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            display: block;
            border-left: 1px solid var(--accent);
            padding-left: 1rem;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 4.5rem;
            font-weight: 400;
            line-height: 0.95;
            letter-spacing: -0.03em;
            color: #fff;
            margin-bottom: 1.5rem;
            /* Subtle metallic text gradient */
            background: linear-gradient(135deg, #fff 0%, #aaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-secondary);
            max-width: 360px;
            font-weight: 300;
        }

        /* Right Panel: The Visual Study */
        .visual-stage {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a1a1e 0%, #000000 100%);
        }

        /* The Illustration */
        svg#illustration {
            width: 100%;
            height: 100%;
            max-width: 1000px;
            filter: drop-shadow(0 30px 60px rgba(0,0,0,0.8));
        }

        /* Data Annotations */
        .annotation-group {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .annotation {
            position: absolute;
            display: flex;
            align-items: center;
            font-family: var(--font-ui);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #fff;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .annotation:hover {
            opacity: 1;
            color: var(--accent);
        }

        .annotation::before {
            content: '';
            position: absolute;
            left: -20px;
            width: 10px;
            height: 1px;
            background: var(--accent);
        }

        .annotation::after {
            content: '';
            position: absolute;
            left: -15px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        /* Specific Annotation Positions */
        .ann-thumb { top: 45%; left: 35%; transform: translate(-20px, 0); }
        .ann-glass { top: 25%; left: 60%; transform: translate(0, -20px); }
        .ann-occlusion { top: 60%; left: 45%; transform: translate(0, 20px); }

        /* Responsive */
        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; grid-template-rows: 40% 60%; }
            .editorial-panel { padding: 2rem; background: rgba(0,0,0,0.8); }
            h1 { font-size: 3rem; }
            .visual-stage { align-items: flex-end; }
            svg#illustration { transform: scale(0.8); }
        }
    </style>
</head>
<body>

    <div class="grain"></div>

    <div class="container">
        <div class="editorial-panel">
            <div class="header-group">
                <span class="meta-label">Study No. 04 — Interaction</span>
                <h1>Tactile<br>Reality</h1>
                <p class="description">
                    An editorial study of the friction between biological form and synthetic glass. 
                    Focuses on the anatomy of grip, occlusion depth, and material contrast.
                </p>
            </div>
        </div>

        <div class="visual-stage">
            <!-- SVG Illustration: High Fidelity Close-Up -->
            <svg id="illustration" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Lighting & Materials -->
                    <linearGradient id="skinLight" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#e8d5c4" />
                        <stop offset="40%" stop-color="#d1bfae" />
                        <stop offset="80%" stop-color="#bfa090" />
                        <stop offset="100%" stop-color="#8c6e5e" />
                    </linearGradient>
                    
                    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#7a5e50" />
                        <stop offset="100%" stop-color="#4a3b32" />
                    </linearGradient>

                    <radialGradient id="subsurface" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#ffaaaa" stop-opacity="0.3" />
                        <stop offset="100%" stop-color="#ffaaaa" stop-opacity="0" />
                    </radialGradient>

                    <linearGradient id="deviceBody" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#333" />
                        <stop offset="10%" stop-color="#1a1a1a" />
                        <stop offset="90%" stop-color="#050505" />
                        <stop offset="100%" stop-color="#000" />
                    </linearGradient>

                    <linearGradient id="screenReflect" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="rgba(255,255,255,0)" />
                        <stop offset="35%" stop-color="rgba(255,255,255,0.02)" />
                        <stop offset="36%" stop-color="rgba(255,255,255,0.15)" />
                        <stop offset="38%" stop-color="rgba(255,255,255,0)" />
                        <stop offset="100%" stop-color="rgba(255,255,255,0)" />
                    </linearGradient>

                    <filter id="blurSmall">
                        <feGaussianBlur stdDeviation="3" />
                    </filter>
                    <filter id="blurLarge">
                        <feGaussianBlur stdDeviation="12" />
                    </filter>
                    <filter id="contactShadow">
                        <feGaussianBlur stdDeviation="2" />
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="1.5"/>
                        </feComponentTransfer>
                    </filter>
                </defs>

                <!-- 1. The Device (Background Layer) -->
                <g id="device" transform="translate(320, 150) rotate(8)">
                    <!-- Main Chassis -->
                    <rect x="0" y="0" width="240" height="520" rx="24" fill="url(#deviceBody)" stroke="#444" stroke-width="1"/>
                    
                    <!-- Screen Area -->
                    <rect x="8" y="8" width="224" height="504" rx="18" fill="#080808" />
                    
                    <!-- Screen Content (Abstract/Dim) -->
                    <g opacity="0.4">
                        <rect x="40" y="100" width="160" height="120" rx="8" fill="#111" />
                        <rect x="40" y="250" width="120" height="8" rx="4" fill="#333" />
                        <rect x="40" y="270" width="140" height="8" rx="4" fill="#333" />
                        <rect x="40" y="290" width="100" height="8" rx="4" fill="#333" />
                    </g>

                    <!-- Glass Reflection (Sweep) -->
                    <path d="M -50,0 L 100,-50 L 150,550 L 0,600 Z" fill="url(#screenReflect)" style="mix-blend-mode: screen;" />

                    <!-- Hardware Details: Camera Island -->
                    <circle cx="20" cy="20" r="6" fill="#000" stroke="#222" stroke-width="1" />
                    <circle cx="20" cy="20" r="2" fill="#333" /> <!-- Lens glint -->
                </g>

                <!-- 2. The Hand (Complex Layering) -->
                <g id="hand" transform="translate(0, 50)">
                    
                    <!-- Wrist & Forearm (Bottom Left) -->
                    <path d="M -50,900 L 200,600 L 300,600 L 450,900 Z" fill="url(#skinLight)" />
                    
                    <!-- Palm Base (Connecting to fingers) -->
                    <path d="M 200,600 Q 250,500 320,550 L 400,700 L 200,800 Z" fill="url(#skinLight)" />

                    <!-- Cast Shadow from Hand onto Phone (Crucial for Depth) -->
                    <path d="M 300,400 L 450,400 L 450,700 L 300,700 Z" fill="#000" opacity="0.6" filter="url(#blurSmall)" transform="rotate(8, 380, 550)" style="mix-blend-mode: multiply;" />

                    <!-- 3. Fingers (Wrapping Right Side) -->
                    <!-- Index Finger -->
                    <g transform="translate(420, 450) rotate(15)">
                        <!-- Cast Shadow on Phone -->
                        <ellipse cx="-10" cy="30" rx="15" ry="40" fill="#000" opacity="0.5" filter="url(#contactShadow)" transform="rotate(-10)" />
                        
                        <!-- Finger Body -->
                        <path d="M 0,0 C 15,-10 30,20 20,60 L -10,60 C -10,30 -15,10 0,0" fill="url(#skinLight)" />
                        <!-- Knuckle Highlight -->
                        <ellipse cx="10" cy="15" rx="8" ry="5" fill="#fff" opacity="0.2" filter="url(#blurSmall)" />
                        <!-- Nail -->
                        <ellipse cx="10" cy="55" rx="6" ry="10" fill="#e6dcd0" opacity="0.6" />
                    </g>

                    <!-- Middle Finger -->
                    <g transform="translate(410, 540) rotate(10)">
                        <ellipse cx="-10" cy="30" rx="15" ry="40" fill="#000" opacity="0.5" filter="url(#contactShadow)" transform="rotate(-10)" />
                        <path d="M 0,0 C 15,-5 35,25 25,70 L -5,70 C -15,35 -10,10 0,0" fill="url(#skinLight)" />
                        <ellipse cx="12" cy="15" rx="8" ry="5" fill="#fff" opacity="0.2" filter="url(#blurSmall)" />
                        <ellipse cx="12" cy="65" rx="6" ry="10" fill="#e6dcd0" opacity="0.6" />
                    </g>

                    <!-- Ring Finger -->
                    <g transform="translate(415, 630) rotate(5)">
                        <ellipse cx="-10" cy="30" rx="15" ry="40" fill="#000" opacity="0.5" filter="url(#contactShadow)" transform="rotate(-5)" />
                        <path d="M 0,0 C 15,-5 30,25 20,65 L -5,65 C -10,30 -10,10 0,0" fill="url(#skinLight)" />
                        <ellipse cx="10" cy="15" rx="8" ry="5" fill="#fff" opacity="0.2" filter="url(#blurSmall)" />
                        <ellipse cx="10" cy="60" rx="6" ry="10" fill="#e6dcd0" opacity="0.6" />
                    </g>

                    <!-- Pinky Finger -->
                    <g transform="translate(430, 710) rotate(-5)">
                        <path d="M 0,0 C 10,0 20,30 15,50 L -5,50 C -10,20 -10,0 0,0" fill="url(#skinShadow)" />
                        <ellipse cx="8" cy="45" rx="5" ry="8" fill="#e6dcd0" opacity="0.6" />
                    </g>

                    <!-- 4. The Thumb (Foreground, Overlapping Screen) -->
                    <g transform="translate(280, 550) rotate(-35)">
                        <!-- Cast Shadow on Screen (High Detail) -->
                        <path d="M 10,0 C 40,0 50,80 20,150 L -20,150 C -10,80 -10,0 10,0" fill="#000" opacity="0.4" filter="url(#blurSmall)" />
                        
                        <!-- Thumb Base -->
                        <path d="M -20,-20 Q -10,40 10,100 L -30,120 Z" fill="url(#skinLight)" />
                        
                        <!-- Thumb Tip & Pad -->
                        <path d="M 10,100 C 40,100 50,140 30,160 C 10,180 -10,160 -30,120 Z" fill="url(#skinLight)" />
                        
                        <!-- Subsurface Scattering (Rim Light on Thumb Edge) -->
                        <path d="M 10,100 C 40,100 50,140 30,160" stroke="#ffb3a7" stroke-width="2" fill="none" filter="url(#blurSmall)" opacity="0.5" />
                        
                        <!-- Thumbnail -->
                        <path d="M 20,140 Q 35,150 25,165 Q 10,150 20,140" fill="#e6dcd0" opacity="0.8" />
                        
                        <!-- Thumb Crease (Anatomy Detail) -->
                        <path d="M 5,110 Q 15,120 5,130" stroke="#8c6e5e" stroke-width="1.5" fill="none" opacity="0.6" />
                    </g>
                </g>

                <!-- 5. Foreground Depth Blur (The "Close-Up" Effect) -->
                <g opacity="0.6">
                    <circle cx="100" cy="800" r="150" fill="#0b0b0c" filter="url(#blurLarge)" />
                    <circle cx="750" cy="100" r="200" fill="#0b0b0c" filter="url(#blurLarge)" />
                </g>
            </svg>

            <!-- Annotations Layer -->
            <div class="annotation-group">
                <div class="annotation ann-thumb">Thumb Grip Pressure</div>
                <div class="annotation ann-glass">2.5D Curved Glass</div>
                <div class="annotation ann-occlusion">Cast Shadow Depth</div>
            </div>
        </div>
    </div>

    <script>
        // Enhanced Parallax with Tilt
        const svg = document.getElementById('illustration');
        const container = document.querySelector('.visual-stage');

        document.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width - 0.5;
            const y = (e.clientY - rect.top) / rect.height - 0.5;

            // Move the hand slightly differently than the phone to create depth
            // We do this via CSS transform on the SVG container
            const moveX = x * 20;
            const moveY = y * 20;
            
            svg.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.05)`;
            
            // Parallax for annotations (move them slower)
            const annotations = document.querySelectorAll('.annotation');
            annotations.forEach(ann => {
                ann.style.transform = `translate(${x * -10}px, ${y * -10}px)`;
            });
        });

        document.addEventListener('mouseleave', () => {
            svg.style.transition = 'transform 0.5s ease';
            svg.style.transform = `translate(0, 0) scale(1.05)`;
            const annotations = document.querySelectorAll('.annotation');
            annotations.forEach(ann => {
                ann.style.transition = 'transform 0.5s ease';
                ann.style.transform = `translate(0, 0)`;
            });
        });
    </script>
</body>
</html>
