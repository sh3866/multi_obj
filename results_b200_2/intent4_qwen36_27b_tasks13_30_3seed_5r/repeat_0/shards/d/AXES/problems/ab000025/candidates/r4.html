<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactile Study: The Grip</title>
    <style>
        :root {
            /* Palette: Deep Editorial Dark */
            --bg-deep: #020202;
            --bg-gradient: radial-gradient(circle at 50% 50%, #161616 0%, #050505 80%);
            --text-main: #f0f0f0;
            --text-muted: #666666;
            --accent-skin: #d4a383;
            --accent-light: #ffffff;
            
            /* Typography */
            --font-display: 'Didot', 'Bodoni MT', 'Playfair Display', 'Times New Roman', serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* Layout */
        .layout-grid {
            display: grid;
            grid-template-columns: 28% 1fr; /* Reduced left panel width */
            width: 100%;
            height: 100%;
        }

        /* Left: Editorial Context */
        .context-panel {
            padding: 4rem 3rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            z-index: 10;
            position: relative;
        }

        .meta-data {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            opacity: 0.6;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 3.5rem;
            font-weight: 400;
            line-height: 0.9;
            color: #fff;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
        }

        .caption {
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 280px;
            font-weight: 300;
            opacity: 0.8;
        }

        /* Right: Visual Stage */
        .visual-stage {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: var(--bg-gradient);
        }

        /* The Illustration */
        svg#illustration {
            width: 100%;
            height: 100%;
            /* Center the composition */
            transform-origin: center center;
            will-change: transform;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .layout-grid { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
            .context-panel { 
                padding: 1.5rem; 
                justify-content: flex-start;
            }
            h1 { font-size: 2.5rem; }
            .caption { display: none; }
        }
    </style>
</head>
<body>

    <div class="layout-grid">
        <div class="context-panel">
            <div class="meta-data">Study No. 04 — Tactile Interface</div>
            <h1>The Grip</h1>
            <p class="caption">
                An editorial study of biological tension meeting synthetic glass. 
                Focus on the occlusion of the thumb, the tension of the metacarpals, 
                and the cinematic interplay of cool rim light against warm skin.
            </p>
        </div>

        <div class="visual-stage">
            <!-- 
                REVISED SVG ILLUSTRATION
                - Removed annotations.
                - Reconstructed hand anatomy with distinct joints.
                - Improved lighting (warm key, cool rim).
                - Unified material language (Editorial/Premium).
            -->
            <svg id="illustration" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Skin Gradients: Rich, warm, volumetric -->
                    <linearGradient id="skinKey" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#f5d0b8" /> 
                        <stop offset="40%" stop-color="#d69e82" /> 
                        <stop offset="85%" stop-color="#8c5238" /> 
                        <stop offset="100%" stop-color="#4a2e20" /> 
                    </linearGradient>

                    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#cfa085" />
                        <stop offset="50%" stop-color="#7a4228" />
                        <stop offset="100%" stop-color="#351b12" />
                    </linearGradient>

                    <!-- Device Gradients: High fidelity metal -->
                    <linearGradient id="deviceChassis" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#2a2a2e" />
                        <stop offset="20%" stop-color="#1a1a1c" />
                        <stop offset="100%" stop-color="#080808" />
                    </linearGradient>

                    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#1a1a1a" />
                        <stop offset="50%" stop-color="#0a0a0a" />
                        <stop offset="100%" stop-color="#000000" />
                    </linearGradient>

                    <!-- Screen Reflection -->
                    <linearGradient id="screenReflection" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
                        <stop offset="40%" stop-color="rgba(255,255,255,0.0)" />
                        <stop offset="100%" stop-color="rgba(255,255,255,0.0)" />
                    </linearGradient>

                    <!-- Filters -->
                    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="2" />
                    </filter>
                    <filter id="deepShadow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="12" />
                    </filter>
                    <filter id="contactBlur">
                        <feGaussianBlur stdDeviation="0.5" />
                    </filter>
                </defs>

                <!-- BACKGROUND LIGHTING -->
                <!-- Subtle ambient light to separate the phone from the void -->
                <circle cx="450" cy="450" r="300" fill="url(#screenReflection)" opacity="0.05" filter="url(#softBlur)" />

                <!-- 1. THE DEVICE (Rotated slightly) -->
                <g id="device" transform="translate(350, 100) rotate(12)">
                    
                    <!-- Device Drop Shadow (Cast on background) -->
                    <rect x="10" y="10" width="240" height="560" rx="30" fill="#000" opacity="0.8" filter="url(#deepShadow)" />

                    <!-- Device Body (Chassis) -->
                    <rect x="0" y="0" width="240" height="560" rx="30" fill="url(#deviceChassis)" stroke="#333" stroke-width="1" />
                    
                    <!-- Inner Bezel -->
                    <rect x="4" y="4" width="232" height="552" rx="26" fill="#000" />

                    <!-- Screen -->
                    <rect x="6" y="6" width="228" height="548" rx="24" fill="url(#screenGlass)" />
                    
                    <!-- Screen Reflection (Cinematic Streak) -->
                    <path d="M 6,6 L 230,6 L 100,300 L 6,150 Z" fill="url(#screenReflection)" opacity="0.6" />
                    <path d="M 150,548 L 230,548 L 230,450 L 150,548 Z" fill="url(#screenReflection)" opacity="0.2" />

                    <!-- Hardware: Dynamic Island / Notch -->
                    <rect x="75" y="18" width="90" height="24" rx="12" fill="#000" />
                    <circle cx="145" cy="30" r="4" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="1" />
                    <circle cx="145" cy="30" r="1.5" fill="#222" /> <!-- Lens reflection -->
                    
                    <!-- Hardware: Side Buttons -->
                    <!-- Volume Up -->
                    <rect x="-4" y="140" width="4" height="35" rx="2" fill="#222" />
                    <!-- Volume Down -->
                    <rect x="-4" y="185" width="4" height="35" rx="2" fill="#222" />
                    <!-- Power (Right side, hidden mostly by fingers but edge visible) -->
                    <rect x="240" y="160" width="4" height="50" rx="2" fill="#222" />

                    <!-- Screen UI (Subtle hint of content) -->
                    <g opacity="0.1">
                        <rect x="20" y="60" width="200" height="20" rx="4" fill="#fff" />
                        <rect x="20" y="90" width="120" height="10" rx="2" fill="#fff" />
                        <rect x="20" y="110" width="160" height="10" rx="2" fill="#fff" />
                    </g>
                </g>

                <!-- 2. THE HAND (Foreground, Realistic Anatomy) -->
                <!-- Positioned to wrap the RIGHT edge of the phone -->
                <g id="hand" transform="translate(0, 0)">
                    
                    <!-- Base Hand Shadow (Cast on phone and background) -->
                    <!-- This creates the "occlusion" mentioned in the critique -->
                    <path d="M 600,300 Q 650,400 600,600 L 550,650 L 500,300 Z" fill="#000" opacity="0.6" filter="url(#deepShadow)" transform="translate(-10, 5)" />

                    <!-- 2a. The Fingers (Wrapping the right edge) -->
                    <!-- Order: Index (Top) to Pinky (Bottom) -->
                    
                    <!-- INDEX FINGER -->
                    <g transform="translate(560, 340) rotate(30)">
                        <!-- Proximal Phalanx -->
                        <path d="M -10,0 C 20,-10 30,10 30,80 L -10,80 Z" fill="url(#skinKey)" />
                        <!-- Middle Phalanx -->
                        <path d="M 10,70 C 35,70 45,90 45,150 L 5,150 Z" fill="url(#skinKey)" />
                        <!-- Distal Phalanx (Tip) -->
                        <path d="M 15,140 C 40,140 50,170 40,200 C 20,210 5,180 5,150 Z" fill="url(#skinKey)" />
                        
                        <!-- Knuckle Definition (Index) -->
                        <path d="M 15,75 Q 25,75 25,85" stroke="#6e4b38" stroke-width="2" fill="none" filter="url(#contactBlur)" />
                        <!-- Nail -->
                        <ellipse cx="30" cy="190" rx="6" ry="10" fill="#e6dcd0" opacity="0.8" />
                        <!-- Rim Light on Finger Tip -->
                        <path d="M 40,200 C 50,170 40,140 15,140" stroke="#aaccff" stroke-width="2" fill="none" filter="url(#softBlur)" opacity="0.4" />
                    </g>

                    <!-- MIDDLE FINGER -->
                    <g transform="translate(570, 430) rotate(25)">
                        <path d="M -10,0 C 20,-10 30,10 30,90 L -10,90 Z" fill="url(#skinShadow)" />
                        <path d="M 10,80 C 35,80 45,100 45,160 L 5,160 Z" fill="url(#skinShadow)" />
                        <path d="M 15,150 C 40,150 50,180 40,210 C 20,220 5,190 5,160 Z" fill="url(#skinShadow)" />
                        
                        <!-- Knuckle Crease -->
                        <path d="M 15,85 Q 25,85 25,95" stroke="#5a3525" stroke-width="2.5" fill="none" filter="url(#contactBlur)" />
                        <!-- Nail -->
                        <ellipse cx="30" cy="200" rx="7" ry="11" fill="#e6dcd0" opacity="0.7" />
                         <!-- Rim Light -->
                         <path d="M 40,210 C 50,180 40,150 15,150" stroke="#aaccff" stroke-width="2" fill="none" filter="url(#softBlur)" opacity="0.4" />
                    </g>

                    <!-- RING FINGER -->
                    <g transform="translate(575, 520) rotate(20)">
                        <path d="M -10,0 C 20,-10 30,10 30,95 L -10,95 Z" fill="url(#skinShadow)" />
                        <path d="M 10,85 C 35,85 45,105 45,165 L 5,165 Z" fill="url(#skinShadow)" />
                        <path d="M 15,155 C 40,155 50,185 40,215 C 20,225 5,195 5,165 Z" fill="url(#skinShadow)" />
                        
                        <!-- Knuckle Crease -->
                        <path d="M 15,90 Q 25,90 25,100" stroke="#5a3525" stroke-width="2.5" fill="none" filter="url(#contactBlur)" />
                        <!-- Nail -->
                        <ellipse cx="30" cy="205" rx="6" ry="10" fill="#e6dcd0" opacity="0.7" />
                    </g>

                    <!-- PINKY FINGER -->
                    <g transform="translate(570, 600) rotate(15)">
                        <path d="M -10,0 C 20,-5 25,10 25,70 L -10,70 Z" fill="url(#skinShadow)" />
                        <path d="M 10,60 C 30,60 35,80 35,120 L 5,120 Z" fill="url(#skinShadow)" />
                        <path d="M 15,110 C 35,110 40,130 30,150 C 15,160 5,140 5,120 Z" fill="url(#skinShadow)" />
                        <!-- Nail -->
                        <ellipse cx="25" cy="145" rx="5" ry="8" fill="#e6dcd0" opacity="0.6" />
                    </g>

                    <!-- 2b. The Palm & Wrist -->
                    <!-- Main Palm Mass -->
                    <path d="M 550,300 Q 650,300 650,650 Q 650,800 500,800 L 450,800 L 450,300 Z" fill="url(#skinKey)" />
                    
                    <!-- Palm Creases (Depth) -->
                    <path d="M 550,350 Q 600,400 620,500" stroke="#6e4b38" stroke-width="3" fill="none" opacity="0.4" filter="url(#softBlur)" />
                    <path d="M 480,600 Q 550,650 600,700" stroke="#6e4b38" stroke-width="3" fill="none" opacity="0.3" filter="url(#softBlur)" />

                    <!-- 2c. The Thumb (Crossing to screen) -->
                    <g transform="translate(480, 500) rotate(-45)">
                        
                        <!-- Thumb Cast Shadow (On the screen) -->
                        <!-- This shadow is crucial for the "contact" feel -->
                        <path d="M 0,0 L 40,0 L 60,150 L 20,180 L -20,150 Z" fill="#000" opacity="0.5" filter="url(#deepShadow)" transform="translate(15, 15)" />

                        <!-- Thumb Base (Thenar Eminence) -->
                        <path d="M -40,-40 Q -10,20 10,100 L -50,120 Z" fill="url(#skinKey)" />
                        
                        <!-- Thumb Proximal Phalanx -->
                        <path d="M -10,80 Q 10,100 20,160 L -20,160 Z" fill="url(#skinKey)" />
                        
                        <!-- Thumb Distal Phalanx (Tip) -->
                        <path d="M 5,150 C 40,150 60,190 50,230 C 20,240 -10,220 -20,160 Z" fill="url(#skinKey)" />
                        
                        <!-- Thumb Joint Crease -->
                        <path d="M -5,130 Q 5,140 -5,150" stroke="#6e4b38" stroke-width="2" fill="none" opacity="0.6" />

                        <!-- Thumbnail (Detailed, facing somewhat towards viewer) -->
                        <path d="M 40,190 Q 60,200 55,225 Q 35,220 40,190" fill="#e6dcd0" opacity="0.9" />
                        <!-- Thumbnail Specular (Glass Reflection) -->
                        <path d="M 42,195 Q 50,200 48,215" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.8" />
                        
                        <!-- Subsurface Scattering / Rim Light on Thumb Edge -->
                        <path d="M 20,160 C 40,150 60,190 50,230" stroke="#aaccff" stroke-width="3" fill="none" filter="url(#softBlur)" opacity="0.6" />
                    </g>
                </g>
            </svg>
        </div>
    </div>

    <script>
        // Parallax Effect - Subtle and Premium
        const svg = document.getElementById('illustration');
        const stage = document.querySelector('.visual-stage');

        document.addEventListener('mousemove', (e) => {
            if (!stage) return;
            const rect = stage.getBoundingClientRect();
            
            // Calculate normalized mouse position (-1 to 1)
            const x = (e.clientX - rect.left) / rect.width - 0.5;
            const y = (e.clientY - rect.top) / rect.height - 0.5;

            // Move SVG slightly (Zoomed in feel)
            // Reduced movement for a more premium, steady feel
            const moveX = x * 15;
            const moveY = y * 15;
            
            svg.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.02)`;
        });

        document.addEventListener('mouseleave', () => {
            svg.style.transition = 'transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            svg.style.transform = `translate(0, 0) scale(1.02)`;
        });
        
        document.addEventListener('mouseenter', () => {
             svg.style.transition = 'none';
        });
    </script>
</body>
</html>
