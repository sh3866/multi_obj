<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactile Study: The Grip — Revision 02</title>
    <style>
        :root {
            /* Palette: Refined Editorial Dark */
            --bg-deep: #080808;
            --bg-gradient: radial-gradient(circle at 60% 40%, #1a1a1a 0%, #050505 70%);
            --text-main: #e0e0e0;
            --text-muted: #555555;
            
            /* Typography */
            --font-display: 'Didot', 'Bodoni MT', 'Playfair Display', 'Times New Roman', serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* Layout: Shifted to emphasize the visual stage */
        .layout-grid {
            display: grid;
            grid-template-columns: 20% 1fr; 
            width: 100%;
            height: 100%;
        }

        /* Left: Minimal Context */
        .context-panel {
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 10;
            position: relative;
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        .meta-data {
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 2.5rem; /* Reduced scale */
            font-weight: 400;
            line-height: 1;
            color: #fff;
            margin-bottom: 1rem;
            letter-spacing: -0.03em;
            opacity: 0.9;
        }

        .caption {
            font-size: 0.75rem;
            line-height: 1.5;
            color: var(--text-muted);
            max-width: 240px;
            font-weight: 300;
            opacity: 0.6;
        }

        /* Right: Visual Stage */
        .visual-stage {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: var(--bg-gradient);
        }

        /* The Illustration */
        svg#illustration {
            width: 100%;
            height: 100%;
            transform-origin: center center;
            will-change: transform;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .layout-grid { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
            .context-panel { 
                padding: 1rem; 
                justify-content: flex-start;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.05);
            }
            h1 { font-size: 2rem; }
            .caption { display: none; }
        }
    </style>
</head>
<body>

    <div class="layout-grid">
        <div class="context-panel">
            <div class="meta-data">Revision 02 — Anatomy & Materiality</div>
            <h1>The Grip</h1>
            <p class="caption">
                Anatomical reconstruction. 
                Focus on subsurface scattering, contact occlusion, 
                and the tension of the metacarpals.
            </p>
        </div>

        <div class="visual-stage">
            <svg id="illustration" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Filters -->
                    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="4" />
                    </filter>
                    <filter id="deepShadow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="15" />
                    </filter>
                    <filter id="contactShadow">
                        <feGaussianBlur stdDeviation="2" />
                        <feOffset dx="0" dy="2" />
                    </filter>

                    <!-- Skin Materials: Warm, Organic, Subsurface Scattering -->
                    <linearGradient id="skinKey" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#fcd5c0" /> <!-- Highlight -->
                        <stop offset="30%" stop-color="#d69e82" /> <!-- Midtone -->
                        <stop offset="80%" stop-color="#8c5238" /> <!-- Shadow -->
                        <stop offset="100%" stop-color="#4a2e20" /> <!-- Deep Shadow -->
                    </linearGradient>

                    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#cfa085" />
                        <stop offset="50%" stop-color="#7a4228" />
                        <stop offset="100%" stop-color="#351b12" />
                    </linearGradient>

                    <radialGradient id="palmGrad" cx="30%" cy="30%" r="70%">
                        <stop offset="0%" stop-color="#e8bca6" />
                        <stop offset="60%" stop-color="#b07055" />
                        <stop offset="100%" stop-color="#5e3525" />
                    </radialGradient>

                    <!-- Device Materials: High Fidelity Metal -->
                    <linearGradient id="deviceChassis" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3a3a3e" />
                        <stop offset="20%" stop-color="#1a1a1c" />
                        <stop offset="50%" stop-color="#0a0a0a" />
                        <stop offset="100%" stop-color="#000000" />
                    </linearGradient>

                    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#222222" />
                        <stop offset="50%" stop-color="#0a0a0a" />
                        <stop offset="100%" stop-color="#000000" />
                    </linearGradient>

                    <!-- Screen Reflection -->
                    <linearGradient id="screenReflection" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="rgba(255,255,255,0.2)" />
                        <stop offset="30%" stop-color="rgba(255,255,255,0.0)" />
                        <stop offset="100%" stop-color="rgba(255,255,255,0.0)" />
                    </linearGradient>
                    
                    <!-- Rim Light for Skin -->
                    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
                        <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0"/>
                    </linearGradient>
                </defs>

                <!-- 1. THE DEVICE -->
                <!-- Positioned center-left, rotated slightly -->
                <g id="device" transform="translate(300, 150) rotate(12)">
                    
                    <!-- Device Drop Shadow -->
                    <rect x="15" y="15" width="260" height="600" rx="35" fill="#000" opacity="0.9" filter="url(#deepShadow)" />

                    <!-- Device Body -->
                    <rect x="0" y="0" width="260" height="600" rx="35" fill="url(#deviceChassis)" stroke="#444" stroke-width="1" />
                    
                    <!-- Inner Bezel -->
                    <rect x="5" y="5" width="250" height="590" rx="30" fill="#050505" />

                    <!-- Screen Base -->
                    <rect x="7" y="7" width="246" height="586" rx="28" fill="url(#screenGlass)" />
                    
                    <!-- Screen Reflection (Cinematic) -->
                    <path d="M 7,7 L 240,7 L 120,400 L 7,200 Z" fill="url(#screenReflection)" opacity="0.4" />
                    
                    <!-- Hardware: Dynamic Island -->
                    <rect x="80" y="20" width="100" height="28" rx="14" fill="#000" />
                    <circle cx="155" cy="34" r="5" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="1" />
                    
                    <!-- Hardware: Side Buttons (Left) -->
                    <rect x="-3" y="150" width="3" height="40" rx="1.5" fill="#333" />
                    <rect x="-3" y="200" width="3" height="40" rx="1.5" fill="#333" />
                    
                    <!-- Hardware: Power Button (Right - Partially Occluded) -->
                    <rect x="260" y="180" width="3" height="60" rx="1.5" fill="#333" />

                    <!-- Screen Content (Minimal UI) -->
                    <g opacity="0.15">
                        <rect x="30" y="70" width="200" height="20" rx="4" fill="#fff" />
                        <rect x="30" y="100" width="140" height="10" rx="2" fill="#fff" />
                        <rect x="30" y="120" width="180" height="10" rx="2" fill="#fff" />
                    </g>
                </g>

                <!-- 2. THE HAND (Foreground) -->
                <!-- Detailed Anatomy: Fingers, Knuckles, Palm, Thumb -->
                <g id="hand">
                    
                    <!-- 2a. Back Fingers (Wrapping the right edge) -->
                    <!-- These occlude the right side of the phone -->
                    
                    <!-- INDEX FINGER -->
                    <g transform="translate(560, 380) rotate(25)">
                        <!-- Finger Body -->
                        <path d="M -15,0 C 0,-15 30,-10 35,20 L 35,140 L -15,140 Z" fill="url(#skinKey)" />
                        <!-- Knuckle Joint -->
                        <path d="M 5,130 Q 20,135 25,145" stroke="#5e3525" stroke-width="2" fill="none" filter="url(#softBlur)" opacity="0.8"/>
                        <!-- Nail (Facing right) -->
                        <path d="M 30,120 C 45,120 45,140 30,140 Z" fill="#e6dcd0" opacity="0.8" />
                        <!-- Rim Light -->
                        <path d="M -15,0 C 0,-15 30,-10 35,20" stroke="#fff" stroke-width="1" opacity="0.3" fill="none"/>
                    </g>

                    <!-- MIDDLE FINGER -->
                    <g transform="translate(575, 470) rotate(20)">
                        <path d="M -15,0 C 0,-15 30,-10 35,25 L 35,150 L -15,150 Z" fill="url(#skinShadow)" />
                        <!-- Knuckle -->
                        <path d="M 5,140 Q 20,145 25,155" stroke="#4a2e20" stroke-width="2" fill="none" filter="url(#softBlur)" opacity="0.8"/>
                        <!-- Nail -->
                        <path d="M 30,130 C 45,130 45,150 30,150 Z" fill="#e6dcd0" opacity="0.7" />
                        <!-- Rim Light -->
                        <path d="M -15,0 C 0,-15 30,-10 35,25" stroke="#fff" stroke-width="1" opacity="0.2" fill="none"/>
                    </g>

                    <!-- RING FINGER -->
                    <g transform="translate(575, 560) rotate(15)">
                        <path d="M -15,0 C 0,-15 30,-10 35,25 L 35,140 L -15,140 Z" fill="url(#skinShadow)" />
                        <!-- Knuckle -->
                        <path d="M 5,130 Q 20,135 25,145" stroke="#4a2e20" stroke-width="2" fill="none" filter="url(#softBlur)" opacity="0.8"/>
                        <!-- Nail -->
                        <path d="M 30,120 C 45,120 45,140 30,140 Z" fill="#e6dcd0" opacity="0.6" />
                    </g>

                    <!-- PINKY FINGER -->
                    <g transform="translate(560, 640) rotate(10)">
                        <path d="M -15,0 C 0,-10 25,-5 25,20 L 25,110 L -15,110 Z" fill="url(#skinShadow)" />
                        <!-- Knuckle -->
                        <path d="M 5,100 Q 15,105 20,110" stroke="#4a2e20" stroke-width="2" fill="none" filter="url(#softBlur)" opacity="0.8"/>
                        <!-- Nail -->
                        <path d="M 20,95 C 35,95 35,110 20,110 Z" fill="#e6dcd0" opacity="0.5" />
                    </g>

                    <!-- 2b. The Palm & Wrist -->
                    <!-- Connects fingers, wraps around bottom right -->
                    <path d="M 550,350 
                             Q 650,350 680,500 
                             Q 700,700 600,850 
                             L 450,900 
                             L 450,350 Z" 
                          fill="url(#palmGrad)" />
                    
                    <!-- Palm Creases (Anatomical Detail) -->
                    <path d="M 580,380 Q 640,450 660,550" stroke="#6e4b38" stroke-width="3" fill="none" opacity="0.4" filter="url(#softBlur)" />
                    <path d="M 500,700 Q 580,750 620,820" stroke="#6e4b38" stroke-width="3" fill="none" opacity="0.3" filter="url(#softBlur)" />

                    <!-- 2c. The Thumb (Crossing to screen) -->
                    <!-- The Hero Element: Detailed, interacting with screen -->
                    <g id="thumb" transform="translate(500, 550) rotate(-40)">
                        
                        <!-- Thumb Cast Shadow (On Screen) -->
                        <!-- Critical for depth -->
                        <path d="M 0,0 L 40,0 L 80,200 L 20,220 L -20,200 Z" 
                              fill="#000" opacity="0.6" filter="url(#deepShadow)" 
                              transform="translate(20, 20)" />

                        <!-- Thumb Base (Thenar Eminence) -->
                        <path d="M -50,-50 Q -20,10 10,120 L -60,140 Z" fill="url(#skinKey)" />
                        
                        <!-- Thumb Proximal Phalanx -->
                        <path d="M -10,100 Q 20,130 30,200 L -20,200 Z" fill="url(#skinKey)" />
                        
                        <!-- Thumb Distal Phalanx (Tip) -->
                        <path d="M 5,190 C 45,190 65,240 55,280 C 25,290 -15,270 -20,200 Z" fill="url(#skinKey)" />
                        
                        <!-- Thumb Joint Crease -->
                        <path d="M -5,160 Q 10,170 -5,185" stroke="#6e4b38" stroke-width="2.5" fill="none" opacity="0.7" />

                        <!-- Thumbnail (Detailed, Translucent) -->
                        <path d="M 45,230 Q 65,240 60,270 Q 40,265 45,230" fill="#e6dcd0" opacity="0.9" />
                        <!-- Thumbnail Specular -->
                        <path d="M 48,235 Q 55,245 52,260" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.9" />
                        
                        <!-- Subsurface Scattering / Rim Light on Thumb Edge -->
                        <path d="M 30,200 C 45,190 65,240 55,280" 
                              stroke="#aaccff" stroke-width="3" fill="none" filter="url(#softBlur)" opacity="0.6" />
                    </g>
                </g>

                <!-- 3. CONTACT SHADOWS (Overlay) -->
                <!-- Darkens the phone edge where skin touches it to seal the realism -->
                <g id="contacts" opacity="0.8" filter="url(#contactShadow)">
                    <!-- Thumb Base Contact -->
                    <path d="M 360,500 L 400,500 L 390,540 L 350,540 Z" fill="#000" />
                    <!-- Index Finger Contact -->
                    <path d="M 550,400 L 580,400 L 570,430 L 540,430 Z" fill="#000" />
                    <!-- Middle Finger Contact -->
                    <path d="M 560,490 L 590,490 L 580,520 L 550,520 Z" fill="#000" />
                </g>

            </svg>
        </div>
    </div>

    <script>
        // Parallax Effect - Subtle and Premium
        const svg = document.getElementById('illustration');
        const stage = document.querySelector('.visual-stage');

        document.addEventListener('mousemove', (e) => {
            if (!stage) return;
            const rect = stage.getBoundingClientRect();
            
            // Calculate normalized mouse position (-1 to 1)
            const x = (e.clientX - rect.left) / rect.width - 0.5;
            const y = (e.clientY - rect.top) / rect.height - 0.5;

            // Move SVG slightly (Zoomed in feel)
            const moveX = x * 20;
            const moveY = y * 20;
            
            svg.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.05)`;
        });

        document.addEventListener('mouseleave', () => {
            svg.style.transition = 'transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            svg.style.transform = `translate(0, 0) scale(1.05)`;
        });
        
        document.addEventListener('mouseenter', () => {
             svg.style.transition = 'none';
        });
    </script>
</body>
</html>
