<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Close-Up: Tactile Interaction</title>
    <style>
        :root {
            --bg-color: #121214;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --accent: #ff453a; /* High contrast alert red for focal points */
            --font-display: 'Didot', 'Bodoni MT', 'Times New Roman', serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Grain Texture for Editorial Feel */
        .grain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Layout: Asymmetric Grid */
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 35% 65%;
        }

        /* Left Panel: Reduced Weight */
        .editorial-panel {
            padding: 3rem 4rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Anchor to bottom */
            z-index: 2;
            background: linear-gradient(90deg, rgba(18,18,20,0.95) 0%, rgba(18,18,20,0.4) 80%, rgba(18,18,20,0) 100%);
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .header-group {
            max-width: 400px;
        }

        .meta-label {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            display: block;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 3.5rem;
            font-weight: 400;
            line-height: 1.1;
            letter-spacing: -0.02em;
            color: #fff;
            margin-bottom: 1rem;
        }

        .description {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-secondary);
            font-weight: 300;
        }

        /* Right Panel: The Visual Stage */
        .visual-stage {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* Subtle radial glow to separate subject from void */
            background: radial-gradient(circle at 70% 50%, #2a2a30 0%, #0f0f11 70%);
        }

        /* The Illustration */
        svg#illustration {
            width: 120%; /* Intentional zoom */
            height: 120%;
            transform-origin: center center;
            /* Initial offset to center the "cropped" view */
            transform: translate(-10%, -10%); 
        }

        /* Annotations: Clean, High Contrast, Positioned for Legibility */
        .annotation-group {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .annotation {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-ui);
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            color: #fff;
            background: rgba(0,0,0,0.6); /* High contrast bg */
            backdrop-filter: blur(4px);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        .annotation-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
        }

        /* Positions: Moved away from dark screen center to edges */
        .ann-thumb { bottom: 25%; left: 45%; }
        .ann-glass { top: 20%; right: 25%; }
        .ann-detail { bottom: 15%; right: 20%; }

        /* Responsive */
        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
            .editorial-panel { 
                padding: 1.5rem; 
                background: rgba(18,18,20,0.9); 
                justify-content: center;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.1);
            }
            .visual-stage { overflow: hidden; }
            svg#illustration { width: 100%; height: auto; transform: scale(1.2) translateY(-10%); }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="grain"></div>

    <div class="container">
        <div class="editorial-panel">
            <div class="header-group">
                <span class="meta-label">Editorial Study — No. 04</span>
                <h1>The Grip</h1>
                <p class="description">
                    A close-up examination of biological tension meeting synthetic smoothness. 
                    Focus on occlusion, knuckle definition, and the physics of touch.
                </p>
            </div>
        </div>

        <div class="visual-stage">
            <!-- SVG Illustration: Close-up, Detailed, Lighting-Unified -->
            <svg id="illustration" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Lighting: Key Light from Top-Left -->
                    <linearGradient id="skinLight" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#f5e6d3" /> <!-- Highlight -->
                        <stop offset="40%" stop-color="#dcbfa3" /> <!-- Midtone -->
                        <stop offset="85%" stop-color="#a87b60" /> <!-- Shadow -->
                        <stop offset="100%" stop-color="#6e4b38" /> <!-- Deep Shadow -->
                    </linearGradient>

                    <!-- Device: Metallic Bevel -->
                    <linearGradient id="deviceBody" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#2a2a2e" />
                        <stop offset="20%" stop-color="#111" />
                        <stop offset="100%" stop-color="#000" />
                    </linearGradient>

                    <!-- Device: Screen Reflection (Unified with Key Light) -->
                    <linearGradient id="screenReflect" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
                        <stop offset="40%" stop-color="rgba(255,255,255,0.0)" />
                        <stop offset="100%" stop-color="rgba(255,255,255,0.0)" />
                    </linearGradient>

                    <!-- Filters -->
                    <filter id="softBlur">
                        <feGaussianBlur stdDeviation="4" />
                    </filter>
                    <filter id="contactBlur">
                        <feGaussianBlur stdDeviation="1.5" />
                    </filter>
                    <filter id="shadowBlur">
                        <feGaussianBlur stdDeviation="8" />
                    </filter>
                </defs>

                <!-- 1. Device (Background) -->
                <g id="device" transform="translate(300, 100) rotate(12)">
                    <!-- Main Body -->
                    <rect x="0" y="0" width="280" height="580" rx="30" fill="url(#deviceBody)" stroke="#444" stroke-width="1"/>
                    
                    <!-- Screen Area -->
                    <rect x="10" y="10" width="260" height="560" rx="22" fill="#050505" />
                    
                    <!-- Screen Reflection (Top Left) -->
                    <path d="M 10,10 L 200,10 L 100,300 L 10,200 Z" fill="url(#screenReflect)" />

                    <!-- Hardware: Top Speaker/Camera -->
                    <rect x="110" y="25" width="60" height="6" rx="3" fill="#1a1a1a" />
                    <circle cx="140" cy="25" r="2" fill="#000" />
                    
                    <!-- Hardware: Side Buttons -->
                    <rect x="-4" y="120" width="4" height="30" rx="2" fill="#222" />
                    <rect x="-4" y="160" width="4" height="30" rx="2" fill="#222" />
                </g>

                <!-- 2. The Hand (Foreground) -->
                <g id="hand" transform="translate(0, 50)">
                    
                    <!-- Wrist & Palm Base (Thick, meaty) -->
                    <path d="M 50,800 L 250,600 Q 320,550 380,600 L 450,800 Z" fill="url(#skinLight)" />
                    
                    <!-- Palm Crease (Anatomy Detail) -->
                    <path d="M 250,600 Q 300,680 380,600" stroke="#8c5e45" stroke-width="2" fill="none" opacity="0.5" filter="url(#contactBlur)" />

                    <!-- 3. Fingers (Wrapping Right Edge) -->
                    <!-- Shadows cast ONTO the device -->
                    <g id="finger-shadows" fill="#000" opacity="0.6" filter="url(#shadowBlur)">
                        <!-- Index Shadow -->
                        <path d="M 380,300 Q 420,310 410,350 L 390,350 Z" transform="rotate(12, 400, 300)" />
                        <!-- Middle Shadow -->
                        <path d="M 380,380 Q 430,390 420,440 L 400,440 Z" transform="rotate(12, 400, 380)" />
                        <!-- Ring Shadow -->
                        <path d="M 380,460 Q 430,470 420,520 L 400,520 Z" transform="rotate(12, 400, 460)" />
                        <!-- Pinky Shadow -->
                        <path d="M 380,540 Q 420,550 410,590 L 390,590 Z" transform="rotate(12, 400, 540)" />
                    </g>

                    <!-- Finger Bodies -->
                    <!-- Index -->
                    <g transform="translate(380, 300) rotate(15)">
                        <path d="M 0,0 C 20,-10 40,20 30,80 L -10,80 C -15,30 -15,10 0,0" fill="url(#skinLight)" />
                        <!-- Knuckle Highlight -->
                        <ellipse cx="15" cy="20" rx="6" ry="4" fill="#fff" opacity="0.3" filter="url(#softBlur)" />
                        <!-- Nail (Detailed) -->
                        <ellipse cx="12" cy="75" rx="7" ry="11" fill="#e6dcd0" opacity="0.8" />
                        <ellipse cx="12" cy="75" rx="3" ry="6" fill="#fff" opacity="0.4" filter="url(#contactBlur)" /> <!-- Specular -->
                    </g>

                    <!-- Middle -->
                    <g transform="translate(390, 380) rotate(12)">
                        <path d="M 0,0 C 25,-5 50,25 40,90 L -10,90 C -15,35 -15,10 0,0" fill="url(#skinLight)" />
                        <ellipse cx="20" cy="25" rx="7" ry="4" fill="#fff" opacity="0.3" filter="url(#softBlur)" />
                        <!-- Nail -->
                        <ellipse cx="18" cy="85" rx="8" ry="12" fill="#e6dcd0" opacity="0.8" />
                    </g>

                    <!-- Ring -->
                    <g transform="translate(400, 460) rotate(10)">
                        <path d="M 0,0 C 25,-5 45,25 35,95 L -10,95 C -15,35 -15,10 0,0" fill="url(#skinLight)" />
                        <ellipse cx="18" cy="25" rx="7" ry="4" fill="#fff" opacity="0.3" filter="url(#softBlur)" />
                        <!-- Nail -->
                        <ellipse cx="16" cy="90" rx="7" ry="11" fill="#e6dcd0" opacity="0.8" />
                    </g>

                    <!-- Pinky -->
                    <g transform="translate(410, 540) rotate(8)">
                        <path d="M 0,0 C 15,0 30,30 20,60 L -10,60 C -10,20 -10,0 0,0" fill="url(#skinLight)" />
                        <!-- Nail -->
                        <ellipse cx="10" cy="55" rx="6" ry="9" fill="#e6dcd0" opacity="0.8" />
                    </g>

                    <!-- 4. The Thumb (Dominant Foreground) -->
                    <g transform="translate(250, 550) rotate(-30)">
                        <!-- Cast Shadow on Screen -->
                        <path d="M 20,100 C 60,100 70,200 40,280 L 0,280 C -10,200 -10,100 20,100" fill="#000" opacity="0.5" filter="url(#contactBlur)" />
                        
                        <!-- Thumb Base -->
                        <path d="M -20,-20 Q -10,60 10,140 L -30,160 Z" fill="url(#skinLight)" />
                        
                        <!-- Thumb Tip & Pad (Pressing) -->
                        <path d="M 10,140 C 50,140 60,200 30,240 C 0,260 -20,240 -30,160 Z" fill="url(#skinLight)" />
                        
                        <!-- Subsurface Scattering (Rim Light) -->
                        <path d="M 10,140 C 50,140 60,200 30,240" stroke="#ffaaaa" stroke-width="4" fill="none" filter="url(#softBlur)" opacity="0.4" />
                        
                        <!-- Thumbnail (Detailed) -->
                        <path d="M 25,210 Q 45,220 35,245 Q 15,230 25,210" fill="#e6dcd0" opacity="0.9" />
                        <path d="M 25,210 Q 35,220 30,235" stroke="#fff" stroke-width="1" fill="none" opacity="0.6" /> <!-- Specular -->

                        <!-- Thumb Crease (Webbing) -->
                        <path d="M 0,100 Q 15,120 0,140" stroke="#8c5e45" stroke-width="2" fill="none" opacity="0.6" filter="url(#contactBlur)" />
                    </g>
                </g>
            </svg>

            <!-- Annotations Layer -->
            <div class="annotation-group">
                <!-- Clean, high-contrast labels -->
                <div class="annotation ann-thumb">
                    <div class="annotation-dot"></div>
                    <span>Thumb Occlusion</span>
                </div>
                <div class="annotation ann-glass">
                    <div class="annotation-dot"></div>
                    <span>Screen Reflection</span>
                </div>
                <div class="annotation ann-detail">
                    <div class="annotation-dot"></div>
                    <span>Knuckle Tension</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Subtle Parallax Interaction
        const svg = document.getElementById('illustration');
        const container = document.querySelector('.visual-stage');
        const annotations = document.querySelectorAll('.annotation');

        document.addEventListener('mousemove', (e) => {
            if (!container) return;
            const rect = container.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width - 0.5;
            const y = (e.clientY - rect.top) / rect.height - 0.5;

            // Move illustration slightly (depth effect)
            // Scale is handled in CSS, we just translate here
            const moveX = x * 15;
            const moveY = y * 15;
            
            svg.style.transform = `translate(calc(-10% + ${moveX}px), calc(-10% + ${moveY}px)) scale(1.05)`;
            
            // Move annotations in opposite direction for parallax
            annotations.forEach(ann => {
                ann.style.transform = `translate(${x * -15}px, ${y * -15}px)`;
            });
        });

        document.addEventListener('mouseleave', () => {
            svg.style.transition = 'transform 0.5s ease';
            svg.style.transform = `translate(-10%, -10%) scale(1.05)`;
            annotations.forEach(ann => {
                ann.style.transition = 'transform 0.5s ease';
                ann.style.transform = `translate(0, 0)`;
            });
        });
    </script>
</body>
</html>
