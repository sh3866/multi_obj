<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play with Tiles</title>
<style>
  :root {
    --felt-primary: #2c5e4a;
    --felt-dark: #1a3c2f;
    --wood-frame: #3e2723;
    --wood-light: #5d4037;
    --tile-body: #f5f5f0;
    --tile-shadow: #d7d7d0;
    --pip-color: #212121;
    --accent-gold: #d4af37;
    --accent-red: #c62828;
    --text-light: #eceff1;
    --ui-bg: rgba(0, 0, 0, 0.4);
    --ui-border: rgba(255, 255, 255, 0.1);
  }

  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  
  body, html {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background-color: var(--wood-frame);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-light);
  }

  /* --- Layout & Background --- */
  #game-container {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    background: 
      radial-gradient(circle at center, var(--felt-primary) 0%, var(--felt-dark) 120%),
      repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 2px, transparent 2px, transparent 4px);
  }

  /* Wood Veneer Border */
  .frame-border {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    border: 24px solid var(--wood-frame);
    border-right-color: var(--wood-light);
    border-bottom-color: var(--wood-light);
    pointer-events: none;
    z-index: 10;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
  }

  /* --- Top Bar (Score & Opponent) --- */
  .top-bar {
    position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 40px; align-items: center;
    z-index: 5;
  }

  .score-pill {
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
    border-radius: 30px;
    padding: 8px 24px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(5px);
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
  }

  .score-val { font-size: 1.2rem; font-weight: 700; color: var(--accent-gold); font-variant-numeric: tabular-nums; }
  .score-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; }
  
  .opponent-avatar {
    width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(135deg, #455a64, #263238);
    border: 2px solid var(--accent-gold);
    display: flex; justify-content: center; align-items: center;
    font-size: 1.2rem;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }

  /* --- Center Board (SVG) --- */
  #board-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex; justify-content: center; align-items: center;
  }

  svg#game-board {
    width: 100%; height: 100%;
    overflow: visible;
  }

  /* --- Bottom Area (Hand & Controls) --- */
  .player-area {
    position: absolute; bottom: 20px; left: 0; right: 0;
    height: 220px;
    display: flex; flex-direction: column; align-items: center;
    z-index: 5;
    pointer-events: none; /* Let clicks pass through to tiles */
  }

  /* Draw Pile */
  .draw-pile {
    position: absolute; bottom: 140px; left: 40px;
    width: 60px; height: 100px;
    pointer-events: auto;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .draw-pile:hover { transform: translateY(-5px); }
  .draw-pile:active { transform: scale(0.95); }
  
  .tile-back {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #1a237e, #0d47a1);
    border-radius: 6px;
    border: 2px solid #fff;
    box-shadow: 2px 2px 0 #000, 4px 4px 5px rgba(0,0,0,0.5);
    position: relative;
  }
  .tile-back::after {
    content: ''; position: absolute; inset: 4px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 2px;
  }
  .draw-count {
    position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%);
    color: var(--text-light); font-size: 0.8rem; text-shadow: 0 1px 2px #000;
  }

  /* Hand Rack */
  .hand-rack {
    display: flex; gap: 12px;
    padding: 20px;
    background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
    pointer-events: auto;
    margin-bottom: 20px;
  }

  .tile {
    width: 50px; height: 100px;
    background: var(--tile-body);
    border-radius: 6px;
    position: relative;
    box-shadow: 
      0 1px 0 #ccc,
      0 4px 0 #bbb,
      0 6px 0 #aaa,
      0 10px 20px rgba(0,0,0,0.4);
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    cursor: pointer;
    display: flex; flex-direction: column;
  }

  .tile:hover {
    transform: translateY(-15px) scale(1.05);
    box-shadow: 
      0 1px 0 #ccc,
      0 15px 0 #bbb,
      0 17px 0 #aaa,
      0 25px 30px rgba(0,0,0,0.5);
    z-index: 10;
  }

  .tile.disabled {
    filter: grayscale(0.8) brightness(0.8);
    cursor: not-allowed;
  }
  .tile.disabled:hover { transform: none; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }

  .tile-half {
    flex: 1; width: 100%;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    padding: 4px;
    position: relative;
  }
  .tile-divider {
    height: 1px; background: #ccc; width: 80%; margin: 0 auto;
  }

  /* Pips */
  .pip {
    background: var(--pip-color);
    border-radius: 50%;
    width: 6px; height: 6px;
    margin: auto;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
  }

  /* --- Endpoints (Interaction Zones) --- */
  .endpoint {
    position: absolute;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 2px dashed rgba(255,255,255,0.3);
    display: flex; justify-content: center; align-items: center;
    font-size: 0.8rem; font-weight: bold; color: rgba(255,255,255,0.5);
    transition: all 0.3s;
    pointer-events: none;
    opacity: 0;
  }
  .endpoint.active { opacity: 1; pointer-events: auto; cursor: pointer; }
  .endpoint.active:hover { background: var(--accent-gold); color: #000; border-style: solid; transform: scale(1.1); }

  /* --- Notifications --- */
  #toast {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
    background: rgba(0,0,0,0.8);
    color: white; padding: 12px 24px; border-radius: 8px;
    pointer-events: none; opacity: 0; transition: all 0.3s;
    z-index: 100; text-align: center; font-weight: 600;
  }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

</style>
</head>
<body>

<div id="game-container">
  <div class="frame-border"></div>

  <!-- Top HUD -->
  <div class="top-bar">
    <div class="score-pill">
      <div class="opponent-avatar">🤖</div>
      <div>
        <div class="score-label">Opponent</div>
        <div class="score-val" id="cpu-score">45</div>
      </div>
    </div>
    <div class="score-pill">
      <div style="text-align: right;">
        <div class="score-label">You</div>
        <div class="score-val" id="player-score">12</div>
      </div>
      <div class="opponent-avatar" style="border-color: var(--accent-red);">👤</div>
    </div>
  </div>

  <!-- Main Board -->
  <div id="board-area">
    <svg id="game-board" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">
      <!-- Definitions for Reusable Tile Graphic -->
      <defs>
        <filter id="tileDropShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity="0.4"/>
        </filter>
        <filter id="pipShadow" x="-20%" y="-20%" width="140%" height="140%">
           <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-color="#000" flood-opacity="0.5"/>
        </filter>
        
        <!-- The Tile Shape -->
        <g id="tile-shape">
          <!-- Body -->
          <rect x="0" y="0" width="40" height="80" rx="4" fill="#f4f4f0" stroke="#d0d0c8" stroke-width="1"/>
          <!-- Bevel Highlight -->
          <rect x="2" y="2" width="36" height="76" rx="2" fill="none" stroke="white" stroke-opacity="0.6" stroke-width="1"/>
          <!-- Divider -->
          <line x1="4" y1="40" x2="36" y2="40" stroke="#bbb" stroke-width="1"/>
          <!-- Inner Shadow -->
          <rect x="0" y="0" width="40" height="80" rx="4" fill="none" stroke="#000" stroke-opacity="0.05" stroke-width="2"/>
        </g>

        <!-- Pip Templates (0-6) -->
        <!-- Center -->
        <g id="pip-1"><circle cx="20" cy="40" r="4.5" fill="#222" filter="url(#pipShadow)"/></g>
        <!-- Diagonal -->
        <g id="pip-2">
          <circle cx="12" cy="32" r="4.5" fill="#222" filter="url(#pipShadow)"/>
          <circle cx="28" cy="48" r="4.5" fill="#222" filter="url(#pipShadow)"/>
        </g>
        <!-- Center + Diag -->
        <g id="pip-3">
          <circle cx="20" cy="40" r="4.5" fill="#222" filter="url(#pipShadow)"/>
          <circle cx="12" cy="32" r="4.5" fill="#222" filter="url(#pipShadow)"/>
          <circle cx="28" cy="48" r="4.5" fill="#222" filter="url(#pipShadow)"/>
        </g>
        <!-- Corners -->
        <g id="pip-4">
          <circle cx="12" cy="28" r="4.5" fill="#222" filter="url(#pipShadow)"/>
          <circle cx="28" cy="28" r="4.5" fill="#222" filter="url(#pipShadow)"/>
          <circle cx="12" cy="52" r="4.5" fill="#222" filter="url(#pipShadow)"/>
          <circle cx="28" cy="52" r="4.5" fill="#222" filter="url(#pipShadow)"/>
        </g>
        <!-- Corners + Center -->
        <g id="pip-5">
          <use href="#pip-4"/>
          <circle cx="20" cy="40" r="4.5" fill="#222" filter="url(#pipShadow)"/>
        </g>
        <!-- Corners + Sides -->
        <g id="pip-6">
          <circle cx="12" cy="28" r="4.5" fill="#222" filter="url(#pipShadow)"/>
          <circle cx="28" cy="28" r="4.5" fill="#222" filter="url(#pipShadow)"/>
          <circle cx="12" cy="40" r="4.5" fill="#222" filter="url(#pipShadow)"/>
          <circle cx="28" cy="40" r="4.5" fill="#222" filter="url(#pipShadow)"/>
          <circle cx="12" cy="52" r="4.5" fill="#222" filter="url(#pipShadow)"/>
          <circle cx="28" cy="52" r="4.5" fill="#222" filter="url(#pipShadow)"/>
        </g>
      </defs>

      <!-- The Chain of Tiles -->
      <g id="chain-layer">
        <!-- Tiles will be injected here via JS -->
      </g>

      <!-- Endpoint Indicators -->
      <g id="endpoints-layer">
        <g id="end-left" class="endpoint-svg" transform="translate(0,0)" style="cursor: pointer; display:none;">
          <circle cx="0" cy="40" r="20" fill="rgba(212, 175, 55, 0.2)" stroke="#d4af37" stroke-width="2" stroke-dasharray="4,2"/>
          <text x="0" y="45" text-anchor="middle" fill="#d4af37" font-family="sans-serif" font-weight="bold" font-size="16">?</text>
        </g>
        <g id="end-right" class="endpoint-svg" transform="translate(0,0)" style="cursor: pointer; display:none;">
          <circle cx="0" cy="40" r="20" fill="rgba(212, 175, 55, 0.2)" stroke="#d4af37" stroke-width="2" stroke-dasharray="4,2"/>
          <text x="0" y="45" text-anchor="middle" fill="#d4af37" font-family="sans-serif" font-weight="bold" font-size="16">?</text>
        </g>
      </g>
    </svg>
  </div>

  <!-- Player Area -->
  <div class="player-area">
    
    <!-- Draw Pile -->
    <div class="draw-pile" onclick="drawTile()">
      <div class="tile-back"></div>
      <div class="draw-count" id="boneyard-count">12 Left</div>
    </div>

    <!-- Hand -->
    <div class="hand-rack" id="player-hand">
      <!-- Tiles injected via JS -->
    </div>
  </div>

  <div id="toast">Turn Skipped</div>
</div>

<script>
/**
 * Game State & Logic
 */
const TILE_W = 40;
const TILE_H = 80;
const GAP = 2;

// Pip Layouts (SVG IDs)
const PIP_MAP = {
  0: '', 1: 'pip-1', 2: 'pip-2', 3: 'pip-3', 4: 'pip-4', 5: 'pip-5', 6: 'pip-6'
};

// State
let boardChain = []; // Array of {a, b, rotation}
let playerHand = [];
let boneyard = [];
let leftEndVal = null;
let rightEndVal = null;

// Initial Setup
function initGame() {
  // Generate Boneyard (Double Six set)
  for(let i=0; i<=6; i++) {
    for(let j=i; j<=6; j++) {
      boneyard.push({a: i, b: j});
    }
  }
  // Shuffle
  boneyard.sort(() => Math.random() - 0.5);

  // Deal 7 to player
  for(let i=0; i<7; i++) playerHand.push(boneyard.pop());

  // Start the board with a random double (or highest double logic usually, but random for visual demo)
  // Let's force a [6,6] start for visual impact
  const startTile = {a: 6, b: 6}; 
  boardChain.push({ ...startTile, rotation: 0 }); // 0 deg is vertical
  leftEndVal = 6;
  rightEndVal = 6;

  renderHand();
  renderBoard();
  updateUI();
}

// --- Rendering Functions ---

function createTileSVG(a, b, rotation) {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  
  // Transform logic:
  // 0 = Vertical (Standard)
  // 90 = Horizontal
  // We center the tile at 0,0 for easier rotation logic, then translate
  g.setAttribute("transform", `rotate(${rotation})`);

  // Add Shape
  const shape = document.createElementNS("http://www.w3.org/2000/svg", "use");
  shape.setAttribute("href", "#tile-shape");
  shape.setAttribute("x", -TILE_W/2);
  shape.setAttribute("y", -TILE_H/2);
  g.appendChild(shape);

  // Add Pips Top (Value A)
  if(PIP_MAP[a]) {
    const pipsA = document.createElementNS("http://www.w3.org/2000/svg", "use");
    pipsA.setAttribute("href", `#${PIP_MAP[a]}`);
    // Shift pips to top half
    pipsA.setAttribute("transform", `translate(0, -20)`); 
    g.appendChild(pipsA);
  }

  // Add Pips Bottom (Value B)
  if(PIP_MAP[b]) {
    const pipsB = document.createElementNS("http://www.w3.org/2000/svg", "use");
    pipsB.setAttribute("href", `#${PIP_MAP[b]}`);
    // Shift pips to bottom half
    pipsB.setAttribute("transform", `translate(0, 20)`);
    g.appendChild(pipsB);
  }

  return g;
}

function renderBoard() {
  const container = document.getElementById('chain-layer');
  container.innerHTML = '';

  if (boardChain.length === 0) return;

  // Calculate center offset
  // We want the chain to grow outwards from center.
  // Simple linear layout for this demo:
  // Even indices go Left, Odd indices go Right.
  
  // Calculate total width to center everything
  // Approximate width calculation
  let currentX = 500; // Center of SVG (1000/2)
  let currentY = 300; // Center of SVG (600/2)

  // We need to place them. Let's do a simple zig-zag or straight line.
  // For "Play with Tiles", a straight line that pans or a compact zig-zag is best.
  // Let's do a straight line that fits.
  
  // First, place the initial tile in center
  const first = boardChain[0];
  const t1 = createTileSVG(first.a, first.b, first.rotation);
  t1.setAttribute("transform", `translate(${currentX}, ${currentY}) rotate(${first.rotation})`);
  container.appendChild(t1);

  let leftX = currentX - TILE_W/2 - GAP;
  let rightX = currentX + TILE_W/2 + GAP;
  
  // If rotated 90 (horizontal), height is width
  const w = (first.rotation === 90) ? TILE_H : TILE_W;
  leftX = currentX - w/2 - GAP;
  rightX = currentX + w/2 + GAP;

  // Place rest
  for(let i=1; i<boardChain.length; i++) {
    const t = boardChain[i];
    const tileEl = createTileSVG(t.a, t.b, t.rotation);
    
    // Determine position based on index (even=left, odd=right)
    // In this simple linear model, we just append. 
    // A real engine tracks a "cursor" for left and right ends.
    
    // For this visual demo, let's just build the visual chain based on a simple array logic
    // where we manually set positions to make it look like a snake.
    
    // Re-implementing simple placement for demo:
    // 0 is center. 1 is right. 2 is left. 3 is right.
    // This requires knowing the previous tile's position.
  }
  
  // REVISED RENDER STRATEGY:
  // Keep track of coordinates in the data structure to make rendering trivial.
  // (In a real app, calculate on render, but for this single file demo, 
  // let's just calculate positions dynamically here).
  
  let x = 500; 
  let y = 300;
  
  // Place 0
  const t0 = boardChain[0];
  const el0 = createTileSVG(t0.a, t0.b, t0.rotation);
  el0.setAttribute("transform", `translate(${x}, ${y}) rotate(${t0.rotation})`);
  container.appendChild(el0);
  
  let lx = x; let rx = x; // Track ends
  const w0 = (t0.rotation === 90) ? TILE_H : TILE_W;
  lx -= (w0/2 + GAP);
  rx += (w0/2 + GAP);

  // Helper to add tile to side
  const addTile = (t, side) => {
    const el = createTileSVG(t.a, t.b, t.rotation);
    const w = (t.rotation === 90) ? TILE_H : TILE_W;
    
    if(side === 'left') {
      lx -= (w/2 + GAP);
      el.setAttribute("transform", `translate(${lx}, ${y}) rotate(${t.rotation})`);
      lx -= (w/2); // Move cursor past tile
    } else {
      rx += (w/2 + GAP);
      el.setAttribute("transform", `translate(${rx}, ${y}) rotate(${t.rotation})`);
      rx += (w/2);
    }
    container.appendChild(el);
  };

  // Re-process chain for placement
  // (Note: In a real app, we'd store x,y in the object)
  // Since I cleared the container, I need to rebuild.
  // To keep it simple, I will just assume the chain is linear and render from center out.
  // The data structure `boardChain` is just values. 
  // Let's just render them in a line for this visual prototype.
  
  container.innerHTML = ''; // Clear again
  
  // Simple linear layout centered
  let totalW = 0;
  boardChain.forEach(t => totalW += (t.rotation === 90 ? TILE_H : TILE_W) + GAP);
  
  let startX = (1000 - totalW) / 2;
  
  boardChain.forEach((t, i) => {
    const el = createTileSVG(t.a, t.b, t.rotation);
    const w = (t.rotation === 90) ? TILE_H : TILE_W;
    el.setAttribute("transform", `translate(${startX + w/2}, 300) rotate(${t.rotation})`);
    container.appendChild(el);
    startX += w + GAP;
  });

  // Update Endpoints
  const endsLayer = document.getElementById('endpoints-layer');
  const endLeft = document.getElementById('end-left');
  const endRight = document.getElementById('end-right');

  // Find actual screen coords of ends
  // Left End
  const first = boardChain[0];
  const wFirst = (first.rotation === 90) ? TILE_H : TILE_W;
  const leftCoord = startX - GAP - 20; // 20 is radius of endpoint circle
  endLeft.setAttribute("transform", `translate(${startX - (wFirst/2) - GAP - 20}, 300)`);
  endLeft.querySelector('text').textContent = leftEndVal;
  
  // Right End
  const last = boardChain[boardChain.length-1];
  const wLast = (last.rotation === 90) ? TILE_H : TILE_W;
  // Need to calculate right edge of last tile
  // Recalculate start for last tile
  let tempX = startX;
  for(let i=0; i<boardChain.length-1; i++) {
     const t = boardChain[i];
     tempX += ((t.rotation === 90) ? TILE_H : TILE_W) + GAP;
  }
  const rightCoord = tempX + (wLast/2) + GAP + 20;
  
  endRight.setAttribute("transform", `translate(${rightCoord}, 300)`);
  endRight.querySelector('text').textContent = rightEndVal;

  // Show endpoints
  if (leftEndVal !== null) {
    endLeft.style.display = 'block';
    endLeft.onclick = () => playTileToSide('left');
  }
  if (rightEndVal !== null) {
    endRight.style.display = 'block';
    endRight.onclick = () => playTileToSide('right');
  }
}

function renderHand() {
  const rack = document.getElementById('player-hand');
  rack.innerHTML = '';
  
  playerHand.forEach((tile, idx) => {
    const el = document.createElement('div');
    el.className = 'tile';
    
    // Check validity
    const valid = (tile.a === leftEndVal || tile.b === leftEndVal || 
                  tile.a === rightEndVal || tile.b === rightEndVal);
    if (!valid) el.classList.add('disabled');

    el.innerHTML = `
      <div class="tile-half">${getPipsHTML(tile.a)}</div>
      <div class="tile-divider"></div>
      <div class="tile-half">${getPipsHTML(tile.b)}</div>
    `;
    
    el.onclick = () => selectTile(idx);
    rack.appendChild(el);
  });
}

function getPipsHTML(n) {
  if(n===0) return '';
  let html = '';
  // CSS Grid positions for pips (3x3)
  // 1: center (2,2)
  // 2: (1,1), (3,3)
  // 3: + center
  // 4: (1,1), (3,1), (1,3), (3,3)
  // 5: + center
  // 6: + (2,1), (2,3)
  
  const positions = {
    1: [[2,2]],
    2: [[1,1], [3,3]],
    3: [[1,1], [2,2], [3,3]],
    4: [[1,1], [3,1], [1,3], [3,3]],
    5: [[1,1], [3,1], [2,2], [1,3], [3,3]],
    6: [[1,1], [3,1], [1,2], [3,2], [1,3], [3,3]]
  };
  
  positions[n].forEach(([r,c]) => {
    html += `<div style="grid-area: ${r} / ${c}"><div class="pip"></div></div>`;
  });
  return html;
}

// --- Interaction Logic ---

let selectedTileIdx = -1;

function selectTile(idx) {
  if(selectedTileIdx === idx) {
    selectedTileIdx = -1; // Deselect
    renderHand();
    return;
  }
  
  const tile = playerHand[idx];
  // Check if playable
  if (tile.a !== leftEndVal && tile.b !== leftEndVal && 
      tile.a !== rightEndVal && tile.b !== rightEndVal) {
    showToast("Invalid Move");
    return;
  }

  selectedTileIdx = idx;
  
  // Highlight logic could go here
  // If it matches both, we need to ask user which side (handled by endpoint clicks)
  // If it matches one, auto-play? Let's require endpoint click for precision.
  
  // Visual feedback in hand
  const tiles = document.querySelectorAll('.tile');
  tiles.forEach(t => t.style.borderColor = 'transparent');
  tiles[idx].style.borderColor = 'var(--accent-gold)';
}

function playTileToSide(side) {
  if (selectedTileIdx === -1) {
    showToast("Select a tile first");
    return;
  }

  const tile = playerHand[selectedTileIdx];
  let played = false;
  let rotation = 0; // 0 = vertical, 90 = horizontal

  // Logic to determine orientation and match
  if (side === 'left') {
    if (tile.a === leftEndVal) {
      // Match A to Left. B becomes new Left.
      // Orientation: To match A (bottom of tile usually, or top depending on view)
      // In our visualizer, Tile is [A top, B bottom].
      // If we place it to the left, we want its Right side (A) to touch the chain's Left side.
      // So we need to rotate it 90 degrees so A is on the right.
      boardChain.unshift({ a: tile.b, b: tile.a, rotation: 90 }); 
      leftEndVal = tile.b;
      played = true;
    } else if (tile.b === leftEndVal) {
      // Match B to Left. A becomes new Left.
      // B is bottom. We need B on right. Rotate 90.
      boardChain.unshift({ a: tile.a, b: tile.b, rotation: 90 });
      leftEndVal = tile.a;
      played = true;
    }
  } else if (side === 'right') {
    if (tile.b === rightEndVal) {
      // Match B (bottom) to Right. A becomes new Right.
      // We need B on the Left of this tile. Rotate 90.
      boardChain.push({ a: tile.a, b: tile.b, rotation: 90 });
      rightEndVal = tile.a;
      played = true;
    } else if (tile.a === rightEndVal) {
      // Match A (top) to Right. B becomes new Right.
      // We need A on Left. Rotate 90 and flip? 
      // SVG rotation 90 makes Top->Right. 
      // Let's just use 90 and swap a/b visually in the unshift/push logic to keep it simple.
      // Actually, let's just rotate 90. 
      // If A matches right end, A must be on the left side of this tile.
      // Top(A) -> Left. Rotate 270 (-90).
      boardChain.push({ a: tile.b, b: tile.a, rotation: 90 }); // Visual hack for demo
      rightEndVal = tile.b;
      played = true;
    }
  }

  if (played) {
    playerHand.splice(selectedTileIdx, 1);
    selectedTileIdx = -1;
    renderHand();
    renderBoard();
    updateUI();
    checkWin();
  } else {
    showToast("Cannot play there");
  }
}

function drawTile() {
  if (boneyard.length > 0) {
    const t = boneyard.pop();
    playerHand.push(t);
    renderHand();
    updateUI();
    showToast("Drawn a tile");
  } else {
    showToast("Boneyard Empty");
  }
}

function updateUI() {
  document.getElementById('boneyard-count').textContent = boneyard.length + " Left";
  // Update scores randomly for flavor
  // document.getElementById('cpu-score').textContent = Math.floor(Math.random()*50);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

function checkWin() {
  if (playerHand.length === 0) {
    showToast("YOU WIN!");
  }
}

// Start
initGame();

</script>
