<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Scene: The Emblem</title>
<style>
  :root {
    --bg-color: #e0e2e5;
    --brand-red: #FF0033;
    --brand-red-dark: #cc0029;
    --text-main: #2a2a2a;
    --text-muted: #7a7a7a;
    --sign-face-base: #fdfdfd;
    --sign-face-shadow: #e8e8e8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-color);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    perspective: 1000px;
    position: relative;
  }

  /* Ambient Background */
  .ambient-light {
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 50% 45%, #ffffff 0%, #dcdcdc 40%, #cfcfcf 100%);
    z-index: -1;
    pointer-events: none;
  }

  /* UI Overlay - Top Left */
  .ui-layer {
    position: absolute;
    top: 60px;
    left: 60px;
    z-index: 10;
    pointer-events: none;
    mix-blend-mode: multiply;
  }

  h1 {
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-main);
    margin-bottom: 6px;
  }

  p.subtitle {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    max-width: 280px;
    line-height: 1.4;
  }

  /* The 3D Scene Container */
  .scene {
    position: relative;
    width: 500px;
    height: 500px;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
    /* Initial angle: slightly looking down and from the right */
    transform: rotateX(12deg) rotateY(-15deg);
    transition: transform 0.1s ease-out; /* Smooth parallax */
  }

  /* The Physical Sign Block */
  .sign-block {
    position: relative;
    width: 320px;
    height: 320px;
    transform-style: preserve-3d;
  }

  /* Faces of the Sign */
  .face {
    position: absolute;
    backface-visibility: hidden; /* Performance optimization */
  }

  /* Front Face: The pristine white surface */
  .face.front {
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 30% 30%, var(--sign-face-base) 0%, var(--sign-face-shadow) 100%);
    transform: translateZ(20px);
    border-radius: 4px;
    /* Inner shadow for edge definition */
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.8), inset 0 0 30px rgba(0,0,0,0.02);
    z-index: 2;
  }

  /* Side Face (Right): Shows thickness */
  .face.right {
    width: 40px; /* Thickness */
    height: 100%;
    background: linear-gradient(to right, #e0e0e0, #c5c5c5);
    transform: rotateY(90deg) translateZ(280px); /* 320 width - 40 thickness/2? No, pivot is center. */
    /* Calculation: Width is 320. Pivot is 160. TranslateZ = 160. 
       Wait, transform origin is center. 
       Right face is at x=160. To rotate Y 90deg, it needs to be translated by 160. 
       But we want it to look like a block.
       Let's use a simpler box model approach with transforms.
    */
    transform-origin: right center;
    transform: rotateY(-90deg) translateZ(0px); 
    /* Correction for center-based transforms: 
       The face is 40px wide. If placed at right edge, it's complex.
       Easier: Place it relative to the front face logic.
    */
    /* Resetting strategy for cleaner 3D box: */
    /* Front is at Z=0 (conceptually). Side is rotated 90deg around Y. */
    /* Let's use the explicit translation method from previous attempt but fixed. */
    left: 160px; /* Half of width */
    top: 0;
    width: 40px;
    height: 320px;
    transform: rotateY(90deg) translateZ(160px); /* Moves it to the right edge */
    /* Wait, standard CSS 3D box: */
    /* Parent center is 0,0. Front face is 320x320 at translateZ(20). */
    /* Right face needs to be at X=160 (half width). */
    /* It rotates -90deg. It sits at Z=160 (half width). */
    /* Actually, let's stick to the working logic from the input but refined. */
    left: 160px; 
    transform: rotateY(90deg) translateZ(160px);
    background: linear-gradient(to right, #dcdcdc, #bfbfbf);
    box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
    z-index: 1;
  }

  /* Top Face: Shows thickness from top */
  .face.top {
    width: 100%;
    height: 40px; /* Thickness */
    background: linear-gradient(to bottom, #f5f5f5, #e6e6e6);
    top: 160px; /* Half height */
    transform-origin: top center;
    transform: rotateX(90deg) translateZ(160px);
    box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
    z-index: 1;
  }

  /* Mounting Hardware - Refined */
  .mount {
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    /* Metallic Gradient */
    background: radial-gradient(circle at 30% 30%, #ffffff 0%, #d1d1d1 20%, #999999 100%);
    /* Shadow for depth */
    box-shadow: 
      1px 2px 3px rgba(0,0,0,0.2), 
      inset 0 0 2px rgba(0,0,0,0.1);
    transform: translateZ(22px); /* Slightly proud of the face */
    z-index: 5;
  }
  
  /* The screw head slot */
  .mount::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 8px; height: 2px;
    background: #777;
    transform: translate(-50%, -50%) rotate(45deg);
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.5);
  }

  .mount.tl { top: 24px; left: 24px; }
  .mount.tr { top: 24px; right: 24px; }
  .mount.bl { bottom: 24px; left: 24px; }
  .mount.br { bottom: 24px; right: 24px; }

  /* The Graphic Emblem - Centered & Floating */
  .emblem-container {
    position: absolute;
    top: 50%; left: 50%;
    /* Centering */
    transform: translate(-50%, -50%) translateZ(24px); /* Floating 4px above surface */
    width: 160px;
    height: 160px;
    z-index: 10;
    pointer-events: auto; /* Allow hover */
    cursor: pointer;
  }

  svg.emblem {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* SVG Elements Styling */
  .bg-circle {
    fill: var(--brand-red);
    /* Soft red shadow to ground the emblem on the white sign */
    filter: drop-shadow(0 12px 16px rgba(255, 0, 51, 0.35));
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  
  .play-triangle {
    fill: #ffffff;
    transform-origin: 50px 50px; /* Center of SVG */
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  /* Floor Shadow - Grounding the object */
  .floor-shadow {
    position: absolute;
    width: 340px;
    height: 340px;
    background: radial-gradient(circle at center, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0) 70%);
    /* Position below the block */
    transform: rotateX(90deg) translateZ(-200px); 
    filter: blur(12px);
    z-index: -1;
  }

  /* Interactivity States */
  .emblem-container:hover .bg-circle {
    transform: scale(1.05);
    fill: #ff1a47; /* Slightly brighter on hover */
  }
  .emblem-container:hover .play-triangle {
    transform: scale(1.08) translateX(2px); /* Subtle movement towards right */
  }

  /* Product Info Footer - Refined Typography & Layout */
  .info-strip {
    position: absolute;
    bottom: 60px;
    display: flex;
    gap: 60px;
    z-index: 20;
  }
  
  .info-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
    text-align: left;
  }
  
  .info-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    font-weight: 600;
  }
  
  .info-value {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-main);
    letter-spacing: -0.2px;
  }

  /* Subtle animation for the emblem on load */
  @keyframes popIn {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8) translateZ(10px); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1) translateZ(24px); }
  }
  .emblem-container {
    animation: popIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

</style>
</head>
<body>

  <div class="ambient-light"></div>

  <div class="ui-layer">
    <h1>Studio Emblem</h1>
    <p class="subtitle">High-contrast geometric signage.<br>Pristine white finish with chromatic red.</p>
  </div>

  <div class="scene">
    <div class="sign-block">
      
      <!-- 3D Faces -->
      <div class="face front"></div>
      
      <!-- 
        Note on 3D Construction:
        Using explicit transforms relative to the center of the 320x320 container.
      -->
      <div class="face right"></div>
      <div class="face top"></div>

      <!-- Mounting Hardware -->
      <div class="mount tl"></div>
      <div class="mount tr"></div>
      <div class="mount bl"></div>
      <div class="mount br"></div>

      <!-- The Graphic Emblem -->
      <div class="emblem-container">
        <svg class="emblem" viewBox="0 0 100 100">
          <!-- The Red Circle -->
          <!-- Slightly larger radius for visual weight -->
          <circle class="bg-circle" cx="50" cy="50" r="46" />
          
          <!-- The White Play Button -->
          <!-- Adjusted coordinates for perfect optical centering -->
          <path class="play-triangle" d="M 42 32 L 70 50 L 42 68 Z" />
        </svg>
      </div>

      <!-- Floor Shadow -->
      <div class="floor-shadow"></div>
    </div>
  </div>

  <div class="info-strip">
    <div class="info-item">
      <span class="info-label">Material</span>
      <span class="info-value">Alabaster Matte</span>
    </div>
    <div class="info-item">
      <span class="info-label">Dimension</span>
      <span class="info-value">320 x 320mm</span>
    </div>
    <div class="info-item">
      <span class="info-label">Finish</span>
      <span class="info-value">Soft Touch</span>
    </div>
  </div>

  <script>
    // Smooth parallax effect to enhance the 3D feel
    const scene = document.querySelector('.scene');
    
    // Configuration for sensitivity
    const sensitivity = 25;
    const maxRotation = 15;

    document.addEventListener('mousemove', (e) => {
      const x = (window.innerWidth / 2 - e.pageX) / sensitivity;
      const y = (window.innerHeight / 2 - e.pageY) / sensitivity;

      // Clamp values to prevent extreme rotation
      const clampX = Math.max(-maxRotation, Math.min(maxRotation, x));
      const clampY = Math.max(-maxRotation, Math.min(maxRotation, y));

      // Apply rotation to the scene container
      // Base rotation + mouse influence
      scene.style.transform = `rotateX(${12 + clampY}deg) rotateY(${-15 + clampX}deg)`;
    });

    // Reset on mouse leave
    document.addEventListener('mouseleave', () => {
      scene.style.transform = `rotateX(12deg) rotateY(-15deg)`;
    });
  </script>
</body>
</html>
