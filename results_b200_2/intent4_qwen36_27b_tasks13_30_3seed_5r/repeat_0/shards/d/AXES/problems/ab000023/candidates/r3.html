<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Scene: The Emblem</title>
<style>
  :root {
    /* Palette - Studio Commercial */
    --bg-color: #e0e2e6;
    --bg-gradient: radial-gradient(circle at 50% 30%, #f4f5f7 0%, #d1d3d8 100%);
    
    /* Brand Colors */
    --brand-red: #FF1E38;
    --brand-red-dark: #cc001a;
    --brand-red-highlight: #ff8090;
    
    /* Typography */
    --text-main: #111111;
    --text-muted: #555555;
    --text-faint: #888888;
    
    /* Materials */
    --mat-white-face: #ffffff;
    --mat-white-edge: #dcdcdc;
    --mat-white-shadow: #b0b0b0;
    --mat-metal: #777777;
    --mat-metal-highlight: #eeeeee;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-gradient);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    perspective: 1000px;
    position: relative;
  }

  /* Ambient Studio Lighting */
  .ambient-light {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 50%);
    z-index: 0;
    pointer-events: none;
  }

  /* UI Overlay - Contextual Header */
  .ui-layer {
    position: absolute;
    top: 50px;
    left: 60px;
    z-index: 10;
    pointer-events: none;
  }

  h1 {
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-main);
    margin-bottom: 6px;
  }

  p.subtitle {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }

  /* The 3D Scene Container */
  .scene {
    position: relative;
    width: 600px;
    height: 600px;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
    /* Base Isometric View */
    transform: rotateX(18deg) rotateY(-22deg);
    transition: transform 0.1s linear; /* Smooth mouse follow */
  }

  /* The Physical Sign Block */
  .sign-block {
    position: relative;
    width: 440px; /* Slightly wider for better proportions */
    height: 440px;
    transform-style: preserve-3d;
  }

  /* Faces of the Sign */
  .face {
    position: absolute;
    backface-visibility: hidden;
  }

  /* Front Face - The Canvas */
  .face.front {
    width: 100%;
    height: 100%;
    background: var(--mat-white-face);
    /* Subtle texture to suggest matte material */
    background-image: radial-gradient(circle at 30% 30%, #ffffff 0%, #f7f7f7 100%);
    transform: translateZ(25px);
    border-radius: 4px;
    /* Inner shadow for edge definition */
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Side Face (Right) - Thickness */
  .face.right {
    width: 50px;
    height: 100%;
    background: linear-gradient(to right, var(--mat-white-edge), var(--mat-white-shadow));
    left: 50%; /* Centered relative to block, then rotated */
    transform-origin: left center;
    transform: translateX(-50%) rotateY(90deg); /* Correct positioning */
    border-radius: 0 4px 4px 0;
    z-index: 1;
    /* Adjust left to align perfectly with the right edge of the front face */
    left: 100%;
    transform-origin: left center;
    transform: rotateY(90deg);
  }
  /* Correction for side face positioning based on width */
  .face.right {
     left: 100%;
     width: 50px;
     transform-origin: left center;
     transform: rotateY(90deg);
  }

  /* Top Face - Thickness */
  .face.top {
    width: 100%;
    height: 50px;
    background: linear-gradient(to bottom, #ffffff, var(--mat-white-edge));
    top: 0;
    transform-origin: top center;
    transform: rotateX(90deg);
    border-radius: 4px 4px 0 0;
    z-index: 1;
  }

  /* Mounting Hardware - Refined for realism */
  .mount {
    position: absolute;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    /* Complex metallic gradient */
    background: radial-gradient(circle at 30% 30%, var(--mat-metal-highlight) 0%, var(--mat-metal) 60%, #444 100%);
    box-shadow: 
      0 4px 6px rgba(0,0,0,0.3), /* Drop shadow */
      inset 0 1px 2px rgba(255,255,255,0.9), /* Top bevel */
      inset 0 -1px 2px rgba(0,0,0,0.5); /* Bottom depth */
    transform: translateZ(26px);
    z-index: 5;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  
  /* Screw Slot */
  .mount::after {
    content: '';
    width: 14px; 
    height: 3px;
    background: #222;
    transform: rotate(45deg);
    border-radius: 1px;
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.9);
  }

  .mount.tl { top: 35px; left: 35px; }
  .mount.tr { top: 35px; right: 35px; }
  .mount.bl { bottom: 35px; left: 35px; }
  .mount.br { bottom: 35px; right: 35px; }

  /* The Graphic Emblem - DOMINANT FOCAL POINT */
  .emblem-container {
    position: relative;
    width: 220px; /* Larger size */
    height: 220px;
    z-index: 10;
    /* Floating effect */
    transform: translateZ(15px);
    filter: drop-shadow(0 20px 25px rgba(0,0,0,0.25));
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  svg.emblem {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* SVG Styles */
  .bg-circle {
    fill: var(--brand-red);
    stroke: var(--brand-red-dark);
    stroke-width: 2px;
    /* Inner gradient for volume */
    fill: url(#redGradient);
  }
  
  .play-triangle {
    fill: #ffffff;
    /* Subtle drop shadow inside the emblem */
    filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.1));
  }

  /* Floor Shadow - Grounding the Object */
  .floor-shadow {
    position: absolute;
    width: 450px;
    height: 450px;
    background: radial-gradient(circle at center, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0) 70%);
    /* Positioned on the floor plane */
    transform: rotateX(90deg) translateZ(-250px) translateX(0px) translateY(20px); 
    filter: blur(20px);
    z-index: -1;
    opacity: 0.9;
  }

  /* Product Info Footer - Clear Hierarchy */
  .info-strip {
    position: absolute;
    bottom: 60px;
    display: flex;
    gap: 60px;
    z-index: 20;
    padding: 16px 32px;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(12px);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  }
  
  .info-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
    text-align: left;
    min-width: 80px;
    border-right: 1px solid rgba(0,0,0,0.1);
    padding-right: 32px;
  }
  
  .info-item:last-child {
    border-right: none;
    padding-right: 0;
  }
  
  .info-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-faint);
    font-weight: 700;
  }
  
  .info-value {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-main);
    letter-spacing: -0.2px;
  }

  /* Hover Interactions */
  .emblem-container:hover {
    transform: translateZ(25px) scale(1.05);
    filter: drop-shadow(0 30px 40px rgba(0,0,0,0.3));
  }

  /* Entrance Animation */
  @keyframes popIn {
    0% { opacity: 0; transform: rotateX(18deg) rotateY(-22deg) scale(0.95) translateY(40px); }
    100% { opacity: 1; transform: rotateX(18deg) rotateY(-22deg) scale(1) translateY(0); }
  }
  .scene {
    animation: popIn 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

</style>
</head>
<body>

  <div class="ambient-light"></div>

  <div class="ui-layer">
    <h1>Studio Emblem</h1>
    <p class="subtitle">Physical Signage Prototype — Series 01</p>
  </div>

  <div class="scene">
    <div class="sign-block">
      
      <!-- 3D Construction -->
      <div class="face front"></div>
      <div class="face right"></div>
      <div class="face top"></div>

      <!-- Detailed Hardware -->
      <div class="mount tl"></div>
      <div class="mount tr"></div>
      <div class="mount bl"></div>
      <div class="mount br"></div>

      <!-- The Emblem -->
      <div class="emblem-container">
        <svg class="emblem" viewBox="0 0 100 100">
          <defs>
            <!-- Gradient to give the red circle volume -->
            <radialGradient id="redGradient" cx="30%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#ff4d63" />
              <stop offset="60%" stop-color="#FF1E38" />
              <stop offset="100%" stop-color="#cc001a" />
            </radialGradient>
            <!-- Clip path for the inner highlight -->
            <clipPath id="circleClip">
              <circle cx="50" cy="50" r="48" />
            </clipPath>
          </defs>
          
          <!-- Red Background Circle -->
          <circle class="bg-circle" cx="50" cy="50" r="48" />
          
          <!-- Glossy Highlight (Top Left) -->
          <ellipse cx="35" cy="30" rx="25" ry="15" fill="white" opacity="0.15" transform="rotate(-30 35 30)" clip-path="url(#circleClip)" />
          
          <!-- White Play Button -->
          <!-- Centered geometrically -->
          <path class="play-triangle" d="M 38 32 L 74 50 L 38 68 Z" />
        </svg>
      </div>

      <!-- Floor Shadow -->
      <div class="floor-shadow"></div>
    </div>
  </div>

  <div class="info-strip">
    <div class="info-item">
      <span class="info-label">Material</span>
      <span class="info-value">Alabaster Matte</span>
    </div>
    <div class="info-item">
      <span class="info-label">Thickness</span>
      <span class="info-value">25mm</span>
    </div>
    <div class="info-item">
      <span class="info-label">Mounting</span>
      <span class="info-value">M4 Hardware</span>
    </div>
    <div class="info-item">
      <span class="info-label">Contrast</span>
      <span class="info-value">High Def.</span>
    </div>
  </div>

  <script>
    // Refined Parallax Logic
    const scene = document.querySelector('.scene');
    const emblem = document.querySelector('.emblem-container');
    
    // Sensitivity for mouse movement
    const sensitivity = 45;
    const maxRotation = 10;

    // Base rotations
    const baseRotX = 18;
    const baseRotY = -22;

    document.addEventListener('mousemove', (e) => {
      const x = (window.innerWidth / 2 - e.pageX) / sensitivity;
      const y = (window.innerHeight / 2 - e.pageY) / sensitivity;

      // Clamp values to prevent extreme angles
      const clampX = Math.max(-maxRotation, Math.min(maxRotation, x));
      const clampY = Math.max(-maxRotation, Math.min(maxRotation, y));

      // Apply rotation to scene
      scene.style.transform = `rotateX(${baseRotX + clampY}deg) rotateY(${baseRotY + clampX}deg)`;
      
      // Subtle independent movement for the emblem to enhance depth (parallax)
      // We move it slightly opposite to the rotation to simulate floating
      emblem.style.transform = `translateZ(${15 - (clampY/3)}px)`;
    });

    document.addEventListener('mouseleave', () => {
      // Reset to base state smoothly
      scene.style.transform = `rotateX(${baseRotX}deg) rotateY(${baseRotY}deg)`;
      emblem.style.transform = `translateZ(15px)`;
    });
  </script>
</body>
</html>
