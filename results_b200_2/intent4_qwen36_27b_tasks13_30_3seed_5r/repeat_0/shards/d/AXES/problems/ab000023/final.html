<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Scene: The Emblem</title>
<style>
  :root {
    /* Palette - Studio Environment */
    --bg-wall-top: #f0f2f5;
    --bg-wall-bot: #d1d5db;
    --bg-floor: #bfc4cc;
    
    /* Brand Colors */
    --brand-red: #FF1F42; /* Vibrant, high-saturation red */
    --brand-red-shadow: #b30022;
    
    /* Materials */
    --mat-white-face: #ffffff;
    --mat-white-edge: #e2e2e2;
    --mat-metal: #4a4a4a;
    
    /* Typography */
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --text-main: #111111;
    --text-muted: #777777;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: linear-gradient(to bottom, var(--bg-wall-top) 0%, var(--bg-wall-bot) 60%, var(--bg-floor) 60%);
    font-family: var(--font-sans);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    perspective: 1000px;
    position: relative;
  }

  /* Architectural Context: Floor Line */
  .floor-line {
    position: absolute;
    top: 60%;
    left: 0;
    width: 100%;
    height: 1px;
    background: rgba(0,0,0,0.05);
    z-index: 0;
  }

  /* Ambient Studio Lighting */
  .ambient-light {
    position: absolute;
    top: -10%; left: 50%;
    transform: translateX(-50%);
    width: 140%;
    height: 80%;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 50%);
    z-index: 0;
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  /* UI Overlay - Minimal Header */
  .ui-layer {
    position: absolute;
    top: 50px;
    left: 60px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  h1 {
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--text-main);
    line-height: 1.2;
    margin-bottom: 2px;
  }

  p.subtitle {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    line-height: 1.2;
  }

  /* The 3D Scene Container */
  .scene {
    position: relative;
    width: 600px;
    height: 600px;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
    /* Isometric View */
    transform: rotateX(15deg) rotateY(-25deg);
    transition: transform 0.1s linear; 
  }

  /* The Physical Sign Block */
  .sign-block {
    position: relative;
    width: 400px;
    height: 400px;
    transform-style: preserve-3d;
    transform: translateZ(0);
  }

  /* Faces of the Sign */
  .face {
    position: absolute;
    backface-visibility: hidden;
  }

  /* Front Face */
  .face.front {
    width: 100%;
    height: 100%;
    background: var(--mat-white-face);
    /* High-quality SVG Noise for physical texture */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
    transform: translateZ(25px);
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.03);
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Side Face (Right) - Thickness */
  .face.right {
    width: 25px;
    height: 100%;
    background: linear-gradient(to bottom, #e8e8e8, #d0d0d0);
    left: 100%;
    transform-origin: left center;
    transform: rotateY(90deg);
    border-radius: 0 2px 2px 0;
    z-index: 1;
    /* Inner shadow for edge depth */
    box-shadow: inset 2px 0 5px rgba(0,0,0,0.1);
  }

  /* Top Face - Thickness */
  .face.top {
    width: 100%;
    height: 25px;
    background: linear-gradient(to right, #f5f5f5, #e0e0e0);
    top: 0;
    transform-origin: top center;
    transform: rotateX(90deg);
    border-radius: 2px 2px 0 0;
    z-index: 1;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
  }

  /* Mounting Hardware - Refined */
  .mount {
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    /* Metallic Gradient */
    background: radial-gradient(circle at 30% 30%, #999 0%, #555 60%, #333 100%);
    /* Directional Shadow matching global light (top-left source) */
    box-shadow: 
      2px 2px 4px rgba(0,0,0,0.3), /* Cast shadow */
      inset 1px 1px 1px rgba(255,255,255,0.5), /* Highlight */
      inset -1px -1px 2px rgba(0,0,0,0.8); /* Inner depth */
    transform: translateZ(26px);
    z-index: 5;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  
  /* Screw Slot */
  .mount::after {
    content: '';
    width: 8px; 
    height: 1.5px;
    background: #1a1a1a;
    transform: rotate(45deg);
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.8);
  }

  .mount.tl { top: 35px; left: 35px; }
  .mount.tr { top: 35px; right: 35px; }
  .mount.bl { bottom: 35px; left: 35px; }
  .mount.br { bottom: 35px; right: 35px; }

  /* The Graphic Emblem - DOMINANT FOCAL POINT */
  .emblem-container {
    position: relative;
    width: 240px; /* Large Scale */
    height: 240px;
    z-index: 10;
    /* Floating above surface */
    transform: translateZ(20px);
    filter: drop-shadow(0 20px 30px rgba(0,0,0,0.25));
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  svg.emblem {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* SVG Styles */
  .bg-circle {
    fill: var(--brand-red);
    /* Inner subtle gradient for volume */
    fill: url(#redGradient);
  }
  
  .play-triangle {
    fill: #ffffff;
    /* Crisp edges */
    shape-rendering: geometricPrecision;
  }

  /* Floor Shadow */
  .floor-shadow {
    position: absolute;
    width: 350px;
    height: 350px;
    background: radial-gradient(circle at center, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.05) 60%, rgba(0,0,0,0) 70%);
    /* Positioned on floor plane */
    transform: rotateX(90deg) translateZ(-250px) translateY(40px); 
    filter: blur(20px);
    z-index: -1;
    opacity: 1;
  }

  /* Product Info Footer - Rebalanced */
  .info-strip {
    position: absolute;
    bottom: 60px;
    display: flex;
    gap: 0;
    z-index: 20;
    padding: 16px 32px;
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.6);
    box-shadow: 0 15px 35px rgba(0,0,0,0.08);
    /* Constrained width to reduce visual weight */
    width: auto;
    min-width: 500px;
  }
  
  .info-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
    text-align: left;
    padding: 0 24px;
    border-right: 1px solid rgba(0,0,0,0.15); /* Increased opacity */
  }
  
  .info-item:first-child { padding-left: 0; }
  .info-item:last-child {
    border-right: none;
    padding-right: 0;
  }
  
  .info-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    font-weight: 700;
  }
  
  .info-value {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-main);
    letter-spacing: -0.2px;
  }

  /* Hover Interactions */
  .emblem-container:hover {
    transform: translateZ(35px) scale(1.05);
    filter: drop-shadow(0 30px 40px rgba(0,0,0,0.3));
  }

  /* Entrance Animation */
  @keyframes popIn {
    0% { opacity: 0; transform: rotateX(15deg) rotateY(-25deg) scale(0.95) translateY(40px); }
    100% { opacity: 1; transform: rotateX(15deg) rotateY(-25deg) scale(1) translateY(0); }
  }
  .scene {
    animation: popIn 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

</style>
</head>
<body>

  <div class="floor-line"></div>
  <div class="ambient-light"></div>

  <div class="ui-layer">
    <h1>Studio Emblem</h1>
    <p class="subtitle">Physical Signage Prototype — Series 01</p>
  </div>

  <div class="scene">
    <div class="sign-block">
      
      <!-- 3D Construction -->
      <div class="face front"></div>
      <div class="face right"></div>
      <div class="face top"></div>

      <!-- Detailed Hardware -->
      <div class="mount tl"></div>
      <div class="mount tr"></div>
      <div class="mount bl"></div>
      <div class="mount br"></div>

      <!-- The Emblem -->
      <div class="emblem-container">
        <svg class="emblem" viewBox="0 0 100 100">
          <defs>
            <!-- Gradient for Volume -->
            <radialGradient id="redGradient" cx="35%" cy="35%" r="70%">
              <stop offset="0%" stop-color="#ff5c7c" />
              <stop offset="40%" stop-color="#FF1F42" />
              <stop offset="100%" stop-color="#C9001E" />
            </radialGradient>
            <!-- Clip path for gloss -->
            <clipPath id="circleClip">
              <circle cx="50" cy="50" r="49" />
            </clipPath>
          </defs>
          
          <!-- Red Background Circle -->
          <circle class="bg-circle" cx="50" cy="50" r="49" />
          
          <!-- Glossy Highlight (Top Left) -->
          <ellipse cx="30" cy="25" rx="25" ry="15" fill="white" opacity="0.3" transform="rotate(-30 30 25)" clip-path="url(#circleClip)" />
          
          <!-- White Play Button -->
          <!-- Geometrically centered and crisp -->
          <path class="play-triangle" d="M 36 30 L 76 50 L 36 70 Z" />
        </svg>
      </div>

      <!-- Floor Shadow -->
      <div class="floor-shadow"></div>
    </div>
  </div>

  <div class="info-strip">
    <div class="info-item">
      <span class="info-label">Material</span>
      <span class="info-value">Alabaster Matte</span>
    </div>
    <div class="info-item">
      <span class="info-label">Thickness</span>
      <span class="info-value">25mm</span>
    </div>
    <div class="info-item">
      <span class="info-label">Mounting</span>
      <span class="info-value">M4 Hardware</span>
    </div>
    <div class="info-item">
      <span class="info-label">Contrast</span>
      <span class="info-value">High Def.</span>
    </div>
  </div>

  <script>
    // Refined Parallax Logic
    const scene = document.querySelector('.scene');
    const emblem = document.querySelector('.emblem-container');
    
    // Sensitivity for mouse movement
    const sensitivity = 80;
    const maxRotation = 10;

    // Base rotations
    const baseRotX = 15;
    const baseRotY = -25;

    document.addEventListener('mousemove', (e) => {
      const x = (window.innerWidth / 2 - e.pageX) / sensitivity;
      const y = (window.innerHeight / 2 - e.pageY) / sensitivity;

      // Clamp values to prevent extreme angles
      const clampX = Math.max(-maxRotation, Math.min(maxRotation, x));
      const clampY = Math.max(-maxRotation, Math.min(maxRotation, y));

      // Apply rotation to scene
      scene.style.transform = `rotateX(${baseRotX + clampY}deg) rotateY(${baseRotY + clampX}deg)`;
      
      // Subtle independent movement for the emblem to enhance depth (parallax)
      // We move it slightly opposite to the rotation to simulate floating
      emblem.style.transform = `translateZ(${20 - (clampY/2)}px)`;
    });

    document.addEventListener('mouseleave', () => {
      // Reset to base state smoothly
      scene.style.transform = `rotateX(${baseRotX}deg) rotateY(${baseRotY}deg)`;
      emblem.style.transform = `translateZ(20px)`;
    });
  </script>
</body>
</html>
