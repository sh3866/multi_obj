<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Architect Series | Refined Design</title>
    <style>
        :root {
            /* Palette: High-End Architectural */
            --bg-wall: #1a1d24;
            --bg-floor: #111317;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-cyan: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            
            /* Typography */
            --font-main: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-wall);
            color: var(--text-main);
            font-family: var(--font-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            -webkit-font-smoothing: antialiased;
        }

        /* Environment: Wall & Floor Split */
        .environment {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: flex;
            flex-direction: column;
        }

        .wall {
            flex: 3;
            background: linear-gradient(180deg, #232730 0%, #1a1d24 100%);
            position: relative;
        }

        .floor {
            flex: 1;
            background: linear-gradient(180deg, #14161b 0%, #0a0b0e 100%);
            position: relative;
            border-top: 1px solid rgba(255,255,255,0.03);
            /* Subtle Floor Grid */
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            perspective: 1000px;
            transform-style: preserve-3d;
        }
        
        /* Floor Reflection */
        .floor-reflection {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 40%);
            pointer-events: none;
        }

        /* Main Layout */
        .stage {
            display: grid;
            grid-template-columns: 35% 65%;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        /* Left: Info Panel */
        .info-panel {
            padding: 5rem 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 10;
            border-right: 1px solid rgba(255,255,255,0.05);
            background: linear-gradient(90deg, rgba(26,29,36,0.95) 0%, rgba(26,29,36,0) 100%);
            backdrop-filter: blur(10px);
        }

        .brand {
            position: absolute;
            top: 4rem;
            left: 4rem;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand::before {
            content: '';
            display: block;
            width: 12px;
            height: 1px;
            background: var(--accent-cyan);
        }

        /* Reduced typography scale per critique */
        h1 {
            font-size: 3.5rem; 
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin-bottom: 1.5rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .tagline {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 380px;
            margin-bottom: 4rem;
            font-weight: 300;
            border-left: 2px solid var(--accent-cyan);
            padding-left: 1.5rem;
        }

        /* Specs: Grid aligned */
        .specs-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            max-width: 400px;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
        }

        .spec-item h3 {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            font-weight: 600;
            opacity: 0.7;
        }

        .spec-item p {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
        }

        /* Right: Visual Stage */
        .visual-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            overflow: hidden;
        }

        .svg-wrapper {
            width: 100%;
            height: 100%;
            /* Centering the SVG properly */
            display: flex;
            align-items: center; 
            justify-content: center;
        }

        /* Flush Trigger Area */
        .flush-trigger {
            position: absolute;
            top: 38%; 
            right: 38%;
            width: 60px;
            height: 60px;
            cursor: pointer;
            z-index: 20;
            border-radius: 50%;
            /* Debug: border: 1px solid red; */
        }
        
        .flush-trigger:hover {
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
        }

        /* Animations */
        .swirl-group {
            transform-origin: 320px 565px;
            opacity: 0;
            pointer-events: none;
        }

        .flush-active .swirl-group {
            animation: vortexSpin 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .water-surface {
            transform-origin: 320px 565px;
            transition: transform 0.3s ease-out;
        }

        .flush-active .water-surface {
            transform: scale(0.4) rotate(45deg);
        }
        
        .water-level {
            transition: transform 0.3s ease-out;
        }
        .flush-active .water-level {
            transform: translateY(15px);
        }

        @keyframes vortexSpin {
            0% { transform: rotate(0deg) scale(0.1); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: rotate(1080deg) scale(1.5); opacity: 0; }
        }

        @media (max-width: 1024px) {
            .stage {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
                overflow-y: auto;
            }
            .info-panel {
                padding: 2rem;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.05);
                background: rgba(26,29,36,0.95);
            }
            .visual-stage {
                height: 60vh;
            }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="environment">
        <div class="wall"></div>
        <div class="floor">
            <div class="floor-reflection"></div>
        </div>
    </div>

    <main class="stage">
        <!-- Left: Context -->
        <div class="info-panel">
            <div class="brand">Sanitarius</div>
            
            <h1>The<br>Architect<br>Series.</h1>
            
            <p class="tagline">
                A study in glossy vitreous china. Hydraulic perfection meets silent engineering in a form that grounds the space.
            </p>

            <div class="specs-container">
                <div class="spec-item">
                    <h3>Efficiency</h3>
                    <p>4.8 / 1.6L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vit. China</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Gloss White</p>
                </div>
                <div class="spec-item">
                    <h3>Origin</h3>
                    <p>Swiss Design</p>
                </div>
            </div>
        </div>

        <!-- Right: Product -->
        <div class="visual-stage">
            <div class="flush-trigger" id="flushBtn" title="Activate Flush"></div>

            <div class="svg-wrapper">
                <!-- ViewBox adjusted to frame the connected unit -->
                <svg viewBox="0 0 600 800" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <!-- 1. Ceramic Body: High-Frequency Gloss -->
                        <!-- Simulates the heavy, smooth curve of porcelain with a strong light source from the left -->
                        <linearGradient id="gradCeramBody" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#9ca3af" /> <!-- Shadow Left Edge -->
                            <stop offset="8%" stop-color="#ffffff" /> <!-- Sharp Specular Highlight -->
                            <stop offset="25%" stop-color="#f3f4f6" /> <!-- Soft Fall-off -->
                            <stop offset="65%" stop-color="#d1d5db" /> <!-- Mid-tone -->
                            <stop offset="90%" stop-color="#6b7280" /> <!-- Shadow Right -->
                            <stop offset="100%" stop-color="#374151" /> <!-- Core Shadow -->
                        </linearGradient>

                        <!-- 2. Chrome: Metallic -->
                        <linearGradient id="gradChrome" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff" />
                            <stop offset="40%" stop-color="#e2e8f0" />
                            <stop offset="50%" stop-color="#94a3b8" />
                            <stop offset="100%" stop-color="#475569" />
                        </linearGradient>

                        <!-- 3. Water: Deep Blue with Glow -->
                        <radialGradient id="gradWater" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.9" />
                            <stop offset="50%" stop-color="#0284c7" />
                            <stop offset="100%" stop-color="#082f49" />
                        </radialGradient>
                        
                        <!-- 4. Vortex Gradient -->
                        <radialGradient id="gradVortex" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0" />
                            <stop offset="70%" stop-color="#0284c7" stop-opacity="0.6" />
                            <stop offset="100%" stop-color="#082f49" stop-opacity="0.9" />
                        </radialGradient>

                        <!-- 5. Filters -->
                        <filter id="blurShadow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="30" />
                        </filter>
                        
                        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="6" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>

                    <!-- 1. Grounding Shadow -->
                    <g id="environment">
                        <ellipse cx="310" cy="740" rx="160" ry="25" fill="#000" filter="url(#blurShadow)" opacity="0.7" />
                    </g>

                    <!-- 2. Plumbing Base (Visible) -->
                    <g id="plumbing">
                        <!-- Floor Flange Base -->
                        <path d="M250 740 Q310 760 370 740 L360 750 Q310 770 260 750 Z" fill="#1f2937" />
                        <!-- Connection Bolts -->
                        <circle cx="270" cy="745" r="4" fill="#4b5563" stroke="#111" stroke-width="1"/>
                        <circle cx="350" cy="745" r="4" fill="#4b5563" stroke="#111" stroke-width="1"/>
                    </g>

                    <!-- 3. The Tank (Rear) - Connected to bowl -->
                    <g id="tank">
                        <!-- Tank Body: Subtle taper -->
                        <path d="M240 290 L380 290 C390 290 390 310 390 320 L390 540 L240 540 L240 320 C240 310 240 290 250 290 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Tank Lid: Flat, distinct layer -->
                        <path d="M235 290 L385 290 C395 290 395 275 385 275 L235 275 C225 275 225 290 235 290 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Lid Shadow (Depth) -->
                        <path d="M240 290 L380 290 L380 295 L240 295 Z" fill="rgba(0,0,0,0.15)" />
                    </g>

                    <!-- 4. The Bowl (Front) - Connected, no gap -->
                    <g id="bowl">
                        <!-- Bowl Front Volume: Egg shape, grounded -->
                        <!-- Starts at y=540 to touch tank -->
                        <path d="M220 540 Q310 510 400 540 C410 680 370 740 310 740 C250 740 210 680 220 540 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Rim: Outer Edge -->
                        <path d="M210 540 Q310 580 410 540 Q410 560 310 600 Q210 560 210 540 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Rim: Inner Hole (The Drop) -->
                        <ellipse cx="310" cy="545" rx="95" ry="32" fill="#111827" /> <!-- Dark interior -->
                        
                        <!-- Water Surface -->
                        <g class="water-level">
                            <!-- Main Water Body -->
                            <ellipse class="water-surface" cx="310" cy="548" rx="90" ry="28" fill="url(#gradWater)" />
                            
                            <!-- Dynamic Vortex (Hidden until flush) -->
                            <g class="swirl-group">
                                <!-- Vortex Shape -->
                                <path d="M310 548 Q280 530 260 550 Q250 570 310 560 Q370 550 360 530 Q340 530 310 548" fill="none" stroke="#7dd3fc" stroke-width="5" filter="url(#glow)" />
                                <path d="M310 548 Q290 540 280 550 Q270 560 310 555 Q350 550 340 540 Q330 540 310 548" fill="none" stroke="#bae6fd" stroke-width="3" filter="url(#glow)" />
                                <!-- Center Hole -->
                                <circle cx="310" cy="548" r="12" fill="#082f49" filter="url(#blurShadow)" />
                            </g>
                        </g>
                    </g>

                    <!-- 5. Seat & Lid (Assembled) -->
                    <g id="lid-seat">
                        <!-- Lid: Vertical (Open) -->
                        <path d="M245 535 Q310 565 375 535 L365 280 Q310 260 255 280 Z" fill="url(#gradCeramBody)" />
                        <!-- Lid Detail Line -->
                        <path d="M255 285 Q310 265 365 285" stroke="rgba(0,0,0,0.1)" stroke-width="1" fill="none" />

                        <!-- Seat: Horizontal (Down) -->
                        <!-- Outer Edge -->
                        <path d="M210 540 Q310 580 410 540 L400 555 Q310 595 220 555 Z" fill="url(#gradCeramBody)" />
                        <!-- Seat Inner Hole (Black/Dark) -->
                        <path d="M245 545 Q310 575 375 545 L365 555 Q310 585 255 555 Z" fill="#0f1115" />
                    </g>

                    <!-- 6. Flush Handle (Chrome Lever) -->
                    <!-- Positioned clearly on the right side of the tank -->
                    <g id="handle-group" transform-origin="390 400">
                        <!-- Base Plate -->
                        <circle cx="390" cy="400" r="12" fill="url(#gradChrome)" stroke="#fff" stroke-width="1" />
                        <!-- Lever Arm -->
                        <path d="M390 400 L445 390 L445 405 L390 415 Z" fill="url(#gradChrome)" />
                        <!-- Lever Tip -->
                        <circle cx="445" cy="397.5" r="6" fill="url(#gradChrome)" stroke="#fff" stroke-width="0.5" />
                    </g>

                    <!-- 7. Splash Particles Container -->
                    <g id="splash-container"></g>

                </svg>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const flushBtn = document.getElementById('flushBtn');
            const handleGroup = document.getElementById('handle-group');
            const splashContainer = document.getElementById('splash-container');
            const swirlGroup = document.querySelector('.swirl-group');
            const waterLevel = document.querySelector('.water-level');

            // Function to create water splash particles
            function createSplash() {
                const ns = "http://www.w3.org/2000/svg";
                
                // Create particles
                for(let i=0; i<35; i++) {
                    const drop = document.createElementNS(ns, "circle");
                    
                    // Origin near center of water
                    const startX = 310 + (Math.random() * 50 - 25);
                    const startY = 548;
                    
                    drop.setAttribute("cx", startX);
                    drop.setAttribute("cy", startY);
                    drop.setAttribute("r", Math.random() * 3 + 1);
                    drop.setAttribute("fill", "#7dd3fc");
                    drop.setAttribute("opacity", "0.8");
                    
                    splashContainer.appendChild(drop);
                    
                    // Physics simulation
                    const tx = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 60 + 20); 
                    const ty = -(Math.random() * 70 + 30); 

                    const animation = drop.animate([
                        { transform: `translate(0, 0)`, opacity: 1 },
                        { transform: `translate(${tx}px, ${ty}px)`, opacity: 1, offset: 0.4 },
                        { transform: `translate(${tx * 1.2}px, ${ty + 90}px)`, opacity: 0 }
                    ], {
                        duration: 800 + Math.random() * 400,
                        easing: 'cubic-bezier(0.1, 0.7, 0.2, 1)'
                    });

                    animation.onfinish = () => drop.remove();
                }
            }

            // Trigger Flush
            const triggerFlush = () => {
                // 1. Move Handle (Lever action)
                handleGroup.style.transition = "transform 0.1s ease-out";
                handleGroup.style.transform = "rotate(30deg)";

                setTimeout(() => {
                    handleGroup.style.transition = "transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1)";
                    handleGroup.style.transform = "rotate(0deg)";
                }, 150);

                // 2. Trigger Water Effects
                createSplash();
                
                // 3. Bowl swirl animation
                swirlGroup.classList.remove('flush-active');
                waterLevel.classList.remove('flush-active');
                void swirlGroup.offsetWidth; // Force reflow
                
                swirlGroup.classList.add('flush-active');
                waterLevel.classList.add('flush-active');
                
                // 4. Reset classes
                setTimeout(() => {
                    swirlGroup.classList.remove('flush-active');
                    waterLevel.classList.remove('flush-active');
                }, 1500);
            };

            flushBtn.addEventListener('click', triggerFlush);

            // Subtle Parallax for Depth
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth - e.pageX * 2) / 600;
                const y = (window.innerHeight - e.pageY * 2) / 600;

                const lid = document.getElementById('lid-seat');
                const tank = document.getElementById('tank');
                const bowl = document.getElementById('bowl');
                
                // Lid moves most (furthest back/loose), Tank moves medium, Bowl moves least (heavy/grounded)
                lid.style.transform = `translate(${x * 5}px, ${y * 3}px)`;
                tank.style.transform = `translate(${x * 2}px, ${y * 1}px)`;
                bowl.style.transform = `translate(${x * 0.5}px, ${y * 0.5}px)`;
            });
        });
    </script>
</body>
</html>
