<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Architect Series | Product Illustration</title>
    <style>
        :root {
            /* Palette: Moody & Premium */
            --bg-dark: #161616;
            --bg-gradient: radial-gradient(circle at 70% 50%, #2a2d33 0%, #111111 80%);
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --accent-blue: #38BDF8; /* For water/action only */
            --chrome-light: #FFFFFF;
            --chrome-dark: #9CA3AF;
            
            /* Typography */
            --font-main: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-dark);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: var(--font-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            position: relative;
        }

        /* Subtle Noise Texture for "Material" feel */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        /* Layout: "L" Shape Composition */
        .stage {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        /* Left: Information Panel */
        .info-panel {
            padding: 6rem 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        /* Typography */
        .brand {
            position: absolute;
            top: 4rem;
            left: 4rem;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.5rem 1rem;
            border-radius: 50px;
        }

        h1 {
            font-size: 4rem;
            line-height: 0.95;
            letter-spacing: -0.04em;
            margin-bottom: 2rem;
            font-weight: 700;
            color: var(--text-main);
            background: linear-gradient(180deg, #FFFFFF 0%, #A1A1AA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 1.15rem;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 420px;
            margin-bottom: 4rem;
            font-weight: 300;
        }

        /* Specs Card: Minimalist Glass */
        .specs-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            max-width: 460px;
        }

        .spec-item h3 {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .spec-item p {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
        }

        /* Right: Visual Stage */
        .visual-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            /* Gradient Light Source */
            background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.08) 0%, transparent 60%);
        }

        .svg-wrapper {
            width: 90%;
            height: 90%;
            transform-origin: center center;
            /* Initial scale up for dominance */
            transform: scale(1.1); 
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Interactive Flush Handle Overlay */
        .flush-trigger {
            position: absolute;
            /* Positioned over the handle in the SVG roughly */
            top: 38%; 
            right: 38%;
            width: 60px;
            height: 60px;
            cursor: pointer;
            z-index: 20;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.05);
            transition: all 0.3s ease;
            opacity: 0; /* Hidden initially, shows on hover */
        }

        .flush-trigger:hover {
            opacity: 1;
            background: rgba(255,255,255,0.1);
            transform: scale(1.1);
            border-color: var(--accent-blue);
        }
        
        .flush-trigger svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: var(--text-main);
            stroke-width: 2;
        }

        /* Animations */
        @keyframes vortexSpin {
            0% { transform: rotate(0deg) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 0.8; }
            100% { transform: rotate(720deg) scale(1.2); opacity: 0; }
        }

        .swirl-group {
            transform-origin: 320px 560px;
            pointer-events: none;
        }

        .flush-active .swirl-group {
            animation: vortexSpin 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .water-surface {
            transform-origin: 320px 560px;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .flush-active .water-surface {
            transform: scale(0.7);
        }
        
        .water-level {
            transition: transform 0.4s ease;
        }
        .flush-active .water-level {
            transform: translateY(15px);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .stage {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
                overflow-y: auto;
            }
            .info-panel {
                padding: 2rem;
                min-height: auto;
                justify-content: flex-start;
            }
            .visual-stage {
                height: 60vh;
            }
            h1 { font-size: 2.5rem; }
            .brand { top: 2rem; left: 2rem; }
            .specs-container { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="noise-overlay"></div>
    <div class="brand">Sanitarius</div>

    <main class="stage">
        <!-- Left: The Context -->
        <div class="info-panel">
            <h1>The Architect<br>Series.</h1>
            <p class="tagline">
                Hydraulic perfection meets material richness. A study in glossy vitreous china and silent engineering.
            </p>

            <div class="specs-container">
                <div class="spec-item">
                    <h3>Efficiency</h3>
                    <p>4.8 / 1.6L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vit. China</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Gloss White</p>
                </div>
                <div class="spec-item">
                    <h3>Origin</h3>
                    <p>Swiss Design</p>
                </div>
            </div>
        </div>

        <!-- Right: The Product -->
        <div class="visual-stage">
            <!-- Interactive Zone for Handle -->
            <div class="flush-trigger" id="flushBtn" title="Flush">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2v10m0 0l-3-3m3 3l3-3" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 12v10" stroke-linecap="round"/>
                </svg>
            </div>

            <div class="svg-wrapper">
                <svg viewBox="0 0 600 800" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <!-- Ceramic: High Contrast Gloss -->
                        <linearGradient id="gradCeramBody" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#A1A1AA" /> 
                            <stop offset="15%" stop-color="#FFFFFF" /> 
                            <stop offset="50%" stop-color="#E4E4E7" /> 
                            <stop offset="85%" stop-color="#D4D4D8" /> 
                            <stop offset="100%" stop-color="#71717A" /> 
                        </linearGradient>

                        <!-- Chrome: Metallic -->
                        <linearGradient id="gradChrome" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="40%" stop-color="#D4D4D8" />
                            <stop offset="60%" stop-color="#A1A1AA" />
                            <stop offset="100%" stop-color="#52525B" />
                        </linearGradient>

                        <!-- Water: Deep Blue -->
                        <radialGradient id="gradWater" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#7DD3FC" />
                            <stop offset="50%" stop-color="#0284C7" />
                            <stop offset="100%" stop-color="#082F49" />
                        </radialGradient>

                        <!-- Floor Shadow: Soft Blur -->
                        <filter id="blurShadow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="20" />
                        </filter>
                    </defs>

                    <!-- 1. Environment -->
                    <g id="environment">
                        <!-- Floor Shadow -->
                        <ellipse cx="310" cy="720" rx="160" ry="25" fill="#000" filter="url(#blurShadow)" opacity="0.6" />
                    </g>

                    <!-- 2. The Plumbing Base -->
                    <g id="plumbing">
                        <!-- Floor Flange -->
                        <ellipse cx="310" cy="720" rx="50" ry="12" fill="#27272A" />
                        <ellipse cx="310" cy="718" rx="45" ry="10" fill="#18181B" />
                    </g>

                    <!-- 3. The Bowl (Front) -->
                    <g id="bowl">
                        <!-- Bowl Front Volume -->
                        <path d="M220 550 L400 550 Q400 700 310 720 Q220 700 220 550 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Bowl Rim (Outer) -->
                        <ellipse cx="310" cy="550" rx="95" ry="30" fill="url(#gradCeramBody)" />
                        <!-- Bowl Rim (Inner - Darker) -->
                        <ellipse cx="310" cy="552" rx="85" ry="24" fill="#3F3F46" />
                        
                        <!-- Water Surface (Grouped for animation) -->
                        <g class="water-level">
                            <ellipse class="water-surface" cx="310" cy="555" rx="80" ry="20" fill="url(#gradWater)" opacity="0.95" />
                            
                            <!-- Swirl Detail (Action Cue) -->
                            <g class="swirl-group">
                                <path d="M260 555 Q310 530 360 555 T310 570" stroke="rgba(255,255,255,0.9)" stroke-width="3" fill="none" stroke-linecap="round" />
                                <path d="M280 560 Q310 545 340 560" stroke="rgba(255,255,255,0.5)" stroke-width="2" fill="none" stroke-linecap="round" />
                            </g>
                        </g>
                    </g>

                    <!-- 4. The Tank (Behind) -->
                    <g id="tank">
                        <!-- Main Tank Body -->
                        <path d="M240 250 L380 250 L380 540 L240 540 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Tank Lid (Flat, Modern) -->
                        <path d="M235 255 L385 255 L380 245 L240 245 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Lid Handle (Minimalist Chrome) -->
                        <rect x="285" y="247" width="50" height="5" rx="2.5" fill="url(#gradChrome)" />
                    </g>

                    <!-- 5. Seat & Lid (Distinct Parts) -->
                    <g id="lid-seat">
                        <!-- Lid (Open, Vertical) -->
                        <path d="M240 545 Q310 575 380 545 L370 260 Q310 240 250 260 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Seat (Down) -->
                        <!-- Outer Ring -->
                        <path d="M230 545 Q310 575 390 545 L390 555 Q310 585 230 555 Z" fill="url(#gradCeramBody)" />
                        <!-- Seat Hole -->
                        <path d="M250 548 Q310 572 370 548 L370 552 Q310 576 250 552 Z" fill="#18181B" opacity="0.9" />
                    </g>

                    <!-- 6. Flush Handle (Chrome Lever) -->
                    <g id="handle-group" transform-origin="385 380">
                        <!-- Base Plate -->
                        <circle cx="385" cy="380" r="12" fill="url(#gradChrome)" stroke="#fff" stroke-width="0.5"/>
                        <!-- Lever Arm -->
                        <path d="M385 380 L425 375 L425 385 L385 390 Z" fill="url(#gradChrome)" />
                        <!-- Lever Tip -->
                        <circle cx="425" cy="380" r="6" fill="url(#gradChrome)" />
                    </g>

                    <!-- 7. Splash Particles (Container) -->
                    <g id="splash-container"></g>

                </svg>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const flushBtn = document.getElementById('flushBtn');
            const handleGroup = document.getElementById('handle-group');
            const svgWrapper = document.querySelector('.svg-wrapper');
            const splashContainer = document.getElementById('splash-container');
            const swirlGroup = document.querySelector('.swirl-group');
            const waterLevel = document.querySelector('.water-level');

            // Function to create water splash particles
            function createSplash() {
                const ns = "http://www.w3.org/2000/svg";
                
                // Create particles
                for(let i=0; i<20; i++) {
                    const drop = document.createElementNS(ns, "circle");
                    
                    // Origin near center of water
                    const startX = 310 + (Math.random() * 40 - 20);
                    const startY = 555;
                    
                    drop.setAttribute("cx", startX);
                    drop.setAttribute("cy", startY);
                    drop.setAttribute("r", Math.random() * 2 + 1);
                    drop.setAttribute("fill", "#7DD3FC"); // Light Blue
                    
                    splashContainer.appendChild(drop);
                    
                    // Physics simulation (Upward and Outward)
                    const angle = (Math.random() * Math.PI) + Math.PI; 
                    const velocity = Math.random() * 20 + 15;
                    const tx = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 30 + 10); 
                    const ty = -(Math.random() * 40 + 20); 

                    const animation = drop.animate([
                        { transform: `translate(0, 0)`, opacity: 1 },
                        { transform: `translate(${tx}px, ${ty}px)`, opacity: 1, offset: 0.5 },
                        { transform: `translate(${tx * 1.5}px, ${ty + 60}px)`, opacity: 0 }
                    ], {
                        duration: 600 + Math.random() * 300,
                        easing: 'cubic-bezier(0.1, 0.8, 0.2, 1)'
                    });

                    animation.onfinish = () => drop.remove();
                }
            }

            // Trigger Flush
            const triggerFlush = () => {
                // 1. Move Handle
                handleGroup.style.transition = "transform 0.1s ease-out";
                handleGroup.style.transform = "rotate(20deg)";

                setTimeout(() => {
                    handleGroup.style.transition = "transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1)";
                    handleGroup.style.transform = "rotate(0deg)";
                }, 150);

                // 2. Trigger Water Effects
                createSplash();
                
                // 3. Bowl swirl animation
                swirlGroup.classList.remove('flush-active');
                waterLevel.classList.remove('flush-active');
                // Force reflow
                void swirlGroup.offsetWidth; 
                
                swirlGroup.classList.add('flush-active');
                waterLevel.classList.add('flush-active');
                
                // 4. Reset classes after animation
                setTimeout(() => {
                    swirlGroup.classList.remove('flush-active');
                    waterLevel.classList.remove('flush-active');
                }, 1200);
            };

            flushBtn.addEventListener('click', triggerFlush);

            // Subtle parallax on mouse move for depth
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth - e.pageX * 2) / 300;
                const y = (window.innerHeight - e.pageY * 2) / 300;

                const lid = document.getElementById('lid-seat');
                const tank = document.getElementById('tank');
                
                // Parallax: Lid moves more than tank
                lid.style.transform = `translate(${x * 3}px, ${y * 3}px)`;
                tank.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
</body>
</html>
