<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Architect Series | Precision Ceramic</title>
    <style>
        :root {
            --bg-floor: #1a1a1a;
            --bg-wall: #222222;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #4db5ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(to bottom, var(--bg-wall) 60%, var(--bg-floor) 60%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        /* --- Composition Layout --- */
        .stage {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            width: 100%;
            height: 100%;
            max-width: 1600px;
            position: relative;
        }

        /* Left: The Product Illustration */
        .visual-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 0;
            z-index: 2;
        }

        .svg-wrapper {
            width: 100%;
            height: 100%;
            /* Scale the SVG to fill the view nicely */
            transform-origin: bottom center;
            transform: scale(1); 
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Right: The Information */
        .info-panel {
            padding: 4rem 6rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 5;
            position: relative;
        }

        /* Typography */
        .brand {
            position: absolute;
            top: 3rem;
            left: 4rem;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            z-index: 20;
        }

        h1 {
            font-size: 5rem;
            line-height: 0.9;
            letter-spacing: -0.04em;
            margin-bottom: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 400px;
            margin-bottom: 3rem;
            border-left: 2px solid var(--accent);
            padding-left: 1.5rem;
        }

        .specs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
        }

        .spec-item h3 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .spec-item p {
            font-size: 1.25rem;
            font-weight: 500;
            color: #fff;
        }

        /* Controls */
        .flush-control {
            position: absolute;
            bottom: 4rem;
            left: 4rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            cursor: pointer;
            z-index: 20;
            transition: transform 0.2s;
        }

        .flush-control:hover {
            transform: scale(1.05);
        }

        .flush-control:active {
            transform: scale(0.95);
        }

        .flush-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .flush-text {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* --- SVG Visual Styles --- */
        
        /* Animations */
        @keyframes swirlSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes ripple {
            0% { transform: scale(0.9); opacity: 0.8; }
            50% { transform: scale(1.02); opacity: 0.4; }
            100% { transform: scale(0.9); opacity: 0.8; }
        }

        @keyframes splashDrop {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(40px) scale(0.5); opacity: 0; }
        }

        .swirl-group {
            transform-origin: 300px 380px;
            transition: transform 0.5s ease-out;
        }

        .flush-active .swirl-group {
            animation: swirlSpin 0.6s ease-in-out;
        }

        .water-surface {
            transform-origin: center;
            transition: transform 0.2s;
        }

        .flush-active .water-surface {
            animation: ripple 0.8s ease-out infinite;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .stage {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
            }
            .visual-stage {
                height: 60vh;
                order: 2;
            }
            .info-panel {
                padding: 2rem;
                height: 40vh;
                order: 1;
                justify-content: flex-end;
            }
            h1 { font-size: 3rem; }
            .brand { top: 1.5rem; left: 2rem; }
        }
    </style>
</head>
<body>

    <div class="brand">Sanitarius</div>

    <main class="stage">
        <!-- Left: The Illustration -->
        <div class="visual-stage">
            <div class="svg-wrapper">
                <svg viewBox="0 0 600 800" width="100%" height="100%" preserveAspectRatio="xMidYMax meet">
                    <defs>
                        <!-- Ceramic: Complex gradient for volume -->
                        <linearGradient id="gradCeramBody" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#E0E5EC" /> <!-- Shadow Left -->
                            <stop offset="15%" stop-color="#FFFFFF" /> <!-- Highlight -->
                            <stop offset="50%" stop-color="#F8F9FA" /> <!-- Midtone -->
                            <stop offset="85%" stop-color="#D1D5DB" /> <!-- Shadow Right -->
                            <stop offset="100%" stop-color="#9CA3AF" /> <!-- Rim Shadow -->
                        </linearGradient>

                        <!-- Chrome: Metallic reflection -->
                        <linearGradient id="gradChrome" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="20%" stop-color="#B0B0B0" />
                            <stop offset="50%" stop-color="#E0E0E0" />
                            <stop offset="80%" stop-color="#808080" />
                            <stop offset="100%" stop-color="#404040" />
                        </linearGradient>

                        <!-- Water: Deep blue to cyan -->
                        <radialGradient id="gradWater" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#E0F2FE" />
                            <stop offset="70%" stop-color="#38BDF8" />
                            <stop offset="100%" stop-color="#0369A1" />
                        </radialGradient>

                        <!-- Floor Shadow Blur -->
                        <filter id="blurShadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="12" />
                        </filter>
                    </defs>

                    <!-- 1. Grounding Elements -->
                    <g id="environment">
                        <!-- Floor Shadow -->
                        <ellipse cx="300" cy="720" rx="160" ry="20" fill="#000" filter="url(#blurShadow)" opacity="0.6" />
                        <!-- Wall Shadow (Subtle) -->
                        <path d="M250 150 L350 150 L380 700 L220 700 Z" fill="#000" opacity="0.1" filter="url(#blurShadow)" />
                    </g>

                    <!-- 2. The Tank (Back) -->
                    <g id="tank">
                        <!-- Main Tank Body -->
                        <path d="M220 160 Q220 140 240 140 L360 140 Q380 140 380 160 L380 420 Q380 440 360 440 L240 440 Q220 440 220 420 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Tank Top Lid (Separate piece) -->
                        <path d="M215 150 L385 150 L380 140 Q360 130 340 130 L260 130 Q240 130 220 140 Z" fill="url(#gradCeramBody)" stroke="#fff" stroke-width="1"/>
                        
                        <!-- Lid Handle (Top) -->
                        <rect x="280" y="135" width="40" height="6" rx="3" fill="url(#gradChrome)" />
                    </g>

                    <!-- 3. The Bowl (Front) -->
                    <g id="bowl">
                        <!-- Main Bowl Volume -->
                        <path d="M220 400 L380 400 Q380 580 300 610 Q220 580 220 400 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Bowl Rim (The Ring) -->
                        <ellipse cx="300" cy="400" rx="90" ry="28" fill="url(#gradCeramBody)" />
                        <!-- Bowl Inner Hole -->
                        <ellipse cx="300" cy="400" rx="75" ry="22" fill="#1a1a1a" /> <!-- Dark void -->
                        
                        <!-- Water Surface -->
                        <ellipse class="water-surface" cx="300" cy="402" rx="70" ry="19" fill="url(#gradWater)" opacity="0.9" />
                        
                        <!-- Swirl Detail (Action Cue) -->
                        <g class="swirl-group">
                            <!-- Stylized vortex lines -->
                            <path d="M270 405 Q300 390 330 405 T300 415" stroke="rgba(255,255,255,0.6)" stroke-width="2" fill="none" stroke-linecap="round" />
                            <path d="M285 410 Q300 400 315 410" stroke="rgba(255,255,255,0.4)" stroke-width="1" fill="none" stroke-linecap="round" />
                        </g>
                    </g>

                    <!-- 4. Seat & Lid (Distinct Parts) -->
                    <g id="lid-seat">
                        <!-- Lid (Open, Vertical) -->
                        <!-- Drawing the lid leaning back against the tank -->
                        <path d="M240 395 Q300 425 360 395 L350 160 Q300 140 250 160 Z" fill="url(#gradCeramBody)" />
                        <!-- Lid Thickness/Edge -->
                        <path d="M240 395 Q300 425 360 395 L358 400 Q300 430 242 400 Z" fill="#D1D5DB" />

                        <!-- Seat (Down) -->
                        <!-- Outer Ring -->
                        <path d="M230 400 Q300 430 370 400 L370 410 Q300 440 230 410 Z" fill="url(#gradCeramBody)" />
                        <!-- Seat Hole -->
                        <path d="M245 403 Q300 428 355 403 L355 410 Q300 435 245 410 Z" fill="#1a1a1a" opacity="0.9" />
                    </g>

                    <!-- 5. Plumbing Base (Visible) -->
                    <g id="plumbing">
                        <!-- Connection Pipe (Back) -->
                        <path d="M280 600 L320 600 L320 650 L280 650 Z" fill="#333" />
                        <!-- Base Flange (Floor) -->
                        <ellipse cx="300" cy="650" rx="35" ry="8" fill="#fff" opacity="0.8" />
                        <ellipse cx="300" cy="650" rx="30" ry="5" fill="#ccc" opacity="0.5" />
                        <!-- Wall Pipe (Subtle) -->
                        <rect x="290" y="100" width="20" height="400" fill="#222" opacity="0.3" />
                    </g>

                    <!-- 6. Flush Handle (The Control) -->
                    <g id="handle-group" transform-origin="375 250">
                        <!-- Base Plate -->
                        <circle cx="375" cy="250" r="12" fill="url(#gradChrome)" />
                        <!-- Lever -->
                        <path d="M375 250 L415 245 L415 255 L375 260 Z" fill="url(#gradChrome)" />
                        <!-- Lever Tip Detail -->
                        <circle cx="415" cy="250" r="4" fill="#fff" />
                    </g>

                    <!-- 7. Splash Particles (Container) -->
                    <g id="splash-container"></g>

                </svg>
            </div>
        </div>

        <!-- Right: The Copy -->
        <div class="info-panel">
            <h1>The Architect<br>Series.</h1>
            <p class="tagline">
                Precision-engineered ceramic with a 360-degree silent close mechanism. 
                Experience the hydraulic perfection of the dual-action siphon.
            </p>

            <div class="specs">
                <div class="spec-item">
                    <h3>Efficiency</h3>
                    <p>4.8 / 1.6L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vit. China</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Gloss White</p>
                </div>
                <div class="spec-item">
                    <h3>Origin</h3>
                    <p>Swiss Design</p>
                </div>
            </div>

            <!-- Flush Interaction Trigger -->
            <div class="flush-control" id="flushBtn">
                <div class="flush-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <path d="M12 2v10m0 0l-3-3m3 3l3-3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 12v10" stroke-linecap="round"/>
                    </svg>
                </div>
                <span class="flush-text">Flush</span>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const flushBtn = document.getElementById('flushBtn');
            const handleGroup = document.getElementById('handle-group');
            const svgContainer = document.querySelector('.svg-wrapper svg');
            const splashContainer = document.getElementById('splash-container');
            const swirlGroup = document.querySelector('.swirl-group');

            // Function to create water splash particles
            function createSplash() {
                const ns = "http://www.w3.org/2000/svg";
                
                // Create 12 particles
                for(let i=0; i<12; i++) {
                    const drop = document.createElementNS(ns, "circle");
                    
                    // Origin near center of water
                    const startX = 300 + (Math.random() * 40 - 20);
                    const startY = 400;
                    
                    drop.setAttribute("cx", startX);
                    drop.setAttribute("cy", startY);
                    drop.setAttribute("r", Math.random() * 3 + 1);
                    drop.setAttribute("fill", "#7DD3FC");
                    
                    splashContainer.appendChild(drop);
                    
                    // Physics simulation via CSS vars or direct animation
                    // We want them to shoot up and out
                    const angle = (Math.random() * Math.PI) + Math.PI; // Upward arc
                    const velocity = Math.random() * 30 + 20;
                    const tx = Math.cos(angle) * velocity * 2; // Horizontal spread
                    const ty = -Math.abs(Math.sin(angle) * velocity * 5) - 40; // Upward height

                    const animation = drop.animate([
                        { transform: `translate(0, 0)`, opacity: 1 },
                        { transform: `translate(${tx}px, ${ty}px)`, opacity: 1, offset: 0.4 },
                        { transform: `translate(${tx * 1.2}px, ${ty + 60}px)`, opacity: 0 }
                    ], {
                        duration: 800 + Math.random() * 200,
                        easing: 'cubic-bezier(0.1, 0.8, 0.2, 1)'
                    });

                    animation.onfinish = () => drop.remove();
                }
            }

            flushBtn.addEventListener('click', () => {
                // 1. Move Handle (Visual feedback)
                handleGroup.style.transition = "transform 0.1s ease-out";
                handleGroup.style.transform = "rotate(30deg)";

                setTimeout(() => {
                    handleGroup.style.transition = "transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1)";
                    handleGroup.style.transform = "rotate(0deg)";
                }, 150);

                // 2. Trigger Water Effects
                createSplash();
                
                // 3. Bowl swirl animation
                swirlGroup.classList.add('flush-active');
                
                // 4. Water level dip visual trick
                const waterSurface = document.querySelector('.water-surface');
                waterSurface.style.transition = "cy 0.3s ease";
                waterSurface.setAttribute("cy", "408"); // Drop level
                waterSurface.setAttribute("rx", "72"); // Expand slightly
                
                setTimeout(() => {
                    waterSurface.setAttribute("cy", "402"); // Return
                    waterSurface.setAttribute("rx", "70");
                    swirlGroup.classList.remove('flush-active');
                }, 1200);
            });

            // Subtle parallax on mouse move for depth
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth - e.pageX * 2) / 100;
                const y = (window.innerHeight - e.pageY * 2) / 100;

                // Move lid slightly differently than bowl for parallax
                const lid = document.getElementById('lid-seat');
                const tank = document.getElementById('tank');
                
                lid.style.transform = `translate(${x * 1}px, ${y * 1}px)`;
                tank.style.transform = `translate(${x * 0.2}px, ${y * 0.2}px)`;
            });
        });
    </script>
</body>
</html>
