<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Architect Series | Product Illustration</title>
    <style>
        :root {
            /* Palette: Refined Luxury */
            --bg-deep: #0f1115;
            --bg-light: #1c1f26;
            --text-main: #FFFFFF;
            --text-muted: #8b92a1;
            --accent-water: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            
            /* Typography */
            --font-main: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            -webkit-font-smoothing: antialiased;
        }

        /* Environment: Wall & Floor */
        .environment {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 75% 40%, #2a2d35 0%, #141519 60%, #0a0a0c 100%);
            overflow: hidden;
        }

        /* Subtle Grid on Wall */
        .grid-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 100px 100px;
            mask-image: radial-gradient(circle at 70% 40%, black 0%, transparent 70%);
            -webkit-mask-image: radial-gradient(circle at 70% 40%, black 0%, transparent 70%);
        }

        /* Main Layout */
        .stage {
            display: grid;
            grid-template-columns: 40% 60%;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        /* Left: Info Panel */
        .info-panel {
            padding: 6rem 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 10;
            border-right: 1px solid rgba(255,255,255,0.05);
            background: linear-gradient(90deg, rgba(15,17,21,0.8) 0%, rgba(15,17,21,0) 100%);
            backdrop-filter: blur(5px);
        }

        .brand {
            position: absolute;
            top: 4rem;
            left: 4rem;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand::before {
            content: '';
            display: block;
            width: 20px;
            height: 2px;
            background: var(--text-main);
        }

        h1 {
            font-size: 5rem;
            line-height: 0.9;
            letter-spacing: -0.05em;
            margin-bottom: 2rem;
            font-weight: 700;
            color: var(--text-main);
            text-shadow: 0 0 40px rgba(255,255,255,0.1);
        }

        .tagline {
            font-size: 1.25rem;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 400px;
            margin-bottom: 4rem;
            font-weight: 300;
            border-left: 1px solid var(--accent-water);
            padding-left: 1.5rem;
        }

        /* Specs */
        .specs-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            max-width: 460px;
        }

        .spec-item h3 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .spec-item p {
            font-size: 1.25rem;
            font-weight: 400;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
        }

        /* Right: Visual Stage */
        .visual-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            overflow: hidden;
        }

        .svg-wrapper {
            width: 90%;
            height: 90%;
            /* Scaled up per critique to dominate space */
            transform: scale(1.15);
            transform-origin: center center;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Flush Trigger Area (Invisible but clickable) */
        .flush-trigger {
            position: absolute;
            top: 40%; 
            right: 36%;
            width: 80px;
            height: 80px;
            cursor: pointer;
            z-index: 20;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        
        /* Hint circle on hover */
        .flush-trigger:hover::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 1px solid var(--accent-water);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        /* Animations */
        .swirl-group {
            transform-origin: 320px 560px;
            opacity: 0;
            pointer-events: none;
        }

        .flush-active .swirl-group {
            animation: vortexSpin 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .water-surface {
            transform-origin: 320px 560px;
            transition: transform 0.4s ease;
        }

        .flush-active .water-surface {
            transform: scale(0.6) rotate(15deg);
        }
        
        .water-level {
            transition: transform 0.4s ease;
        }
        .flush-active .water-level {
            transform: translateY(25px);
        }

        @keyframes vortexSpin {
            0% { transform: rotate(0deg) scale(0.2); opacity: 0; }
            10% { opacity: 1; }
            80% { opacity: 0.8; }
            100% { transform: rotate(1080deg) scale(1.1); opacity: 0; }
        }

        @media (max-width: 1024px) {
            .stage {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
                overflow-y: auto;
            }
            .info-panel {
                padding: 2rem;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.05);
            }
            .visual-stage {
                height: 60vh;
            }
            h1 { font-size: 3rem; }
            .brand { top: 2rem; left: 2rem; }
        }
    </style>
</head>
<body>

    <div class="environment">
        <div class="grid-lines"></div>
    </div>

    <main class="stage">
        <!-- Left: Context -->
        <div class="info-panel">
            <div class="brand">Sanitarius</div>
            
            <h1>The<br>Architect<br>Series.</h1>
            
            <p class="tagline">
                Hydraulic perfection meets material richness. A study in glossy vitreous china and silent engineering.
            </p>

            <div class="specs-container">
                <div class="spec-item">
                    <h3>Efficiency</h3>
                    <p>4.8 / 1.6L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vit. China</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Gloss White</p>
                </div>
                <div class="spec-item">
                    <h3>Origin</h3>
                    <p>Swiss Design</p>
                </div>
            </div>
        </div>

        <!-- Right: Product -->
        <div class="visual-stage">
            <div class="flush-trigger" id="flushBtn" title="Flush System"></div>

            <div class="svg-wrapper">
                <!-- ViewBox adjusted for better framing of the complete object -->
                <svg viewBox="0 0 600 850" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <!-- 1. Ceramic Body: High-Frequency Gloss -->
                        <!-- Simulates the heavy, smooth curve of porcelain with a strong light source from the left -->
                        <linearGradient id="gradCeramBody" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#6b7280" /> <!-- Deep Shadow Left -->
                            <stop offset="10%" stop-color="#ffffff" /> <!-- Sharp Highlight -->
                            <stop offset="30%" stop-color="#e5e7eb" /> <!-- Soft Fall-off -->
                            <stop offset="70%" stop-color="#d1d5db" /> <!-- Mid-tone -->
                            <stop offset="90%" stop-color="#9ca3af" /> <!-- Shadow Right -->
                            <stop offset="100%" stop-color="#4b5563" /> <!-- Core Shadow -->
                        </linearGradient>

                        <!-- 2. Chrome: Metallic -->
                        <linearGradient id="gradChrome" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff" />
                            <stop offset="30%" stop-color="#cbd5e1" />
                            <stop offset="50%" stop-color="#94a3b8" />
                            <stop offset="100%" stop-color="#475569" />
                        </linearGradient>

                        <!-- 3. Water: Deep Blue with Glow -->
                        <radialGradient id="gradWater" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.9" />
                            <stop offset="40%" stop-color="#0284c7" />
                            <stop offset="100%" stop-color="#082f49" />
                        </radialGradient>
                        
                        <!-- 4. Vortex Gradient -->
                        <radialGradient id="gradVortex" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0" />
                            <stop offset="70%" stop-color="#0284c7" stop-opacity="0.6" />
                            <stop offset="100%" stop-color="#082f49" stop-opacity="0.9" />
                        </radialGradient>

                        <!-- 5. Filters -->
                        <filter id="blurShadow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="25" />
                        </filter>
                        
                        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="5" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>

                    <!-- 1. Grounding Shadow -->
                    <g id="environment">
                        <ellipse cx="310" cy="760" rx="180" ry="30" fill="#000" filter="url(#blurShadow)" opacity="0.8" />
                    </g>

                    <!-- 2. Plumbing Base (Visible) -->
                    <g id="plumbing">
                        <!-- Floor Flange Base -->
                        <path d="M260 740 Q310 760 360 740 L350 750 Q310 770 270 750 Z" fill="#1f2937" />
                        <!-- Connection Bolt -->
                        <circle cx="280" cy="745" r="3" fill="#4b5563" />
                        <circle cx="340" cy="745" r="3" fill="#4b5563" />
                    </g>

                    <!-- 3. The Tank (Rear) -->
                    <g id="tank">
                        <!-- Tank Body: Rectangular with rounded top -->
                        <path d="M250 280 L370 280 C380 280 380 300 380 310 L380 540 L250 540 L250 310 C250 300 250 280 260 280 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Tank Lid: Flat, distinct layer -->
                        <path d="M245 280 L375 280 C385 280 385 265 375 265 L245 265 C235 265 235 280 245 280 Z" fill="url(#gradCeramBody)" stroke="#fff" stroke-width="0.5" />
                        
                        <!-- Lid Shadow (Depth) -->
                        <rect x="250" y="280" width="130" height="5" fill="rgba(0,0,0,0.2)" filter="url(#blurShadow)" />
                    </g>

                    <!-- 4. The Bowl (Front) -->
                    <g id="bowl">
                        <!-- Bowl Front Volume: Egg shape -->
                        <path d="M220 550 Q310 520 400 550 C400 680 360 740 310 740 C260 740 220 680 220 550 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Rim: Outer Edge -->
                        <path d="M210 550 Q310 590 410 550 Q410 570 310 610 Q210 570 210 550 Z" fill="url(#gradCeramBody)" />
                        
                        <!-- Rim: Inner Hole (The Drop) -->
                        <ellipse cx="310" cy="555" rx="90" ry="28" fill="#1f2937" /> <!-- Dark interior -->
                        
                        <!-- Water Surface -->
                        <g class="water-level">
                            <!-- Main Water Body -->
                            <ellipse class="water-surface" cx="310" cy="558" rx="85" ry="24" fill="url(#gradWater)" />
                            
                            <!-- Dynamic Vortex (Hidden until flush) -->
                            <g class="swirl-group">
                                <!-- Vortex Shape -->
                                <path d="M310 558 Q280 540 260 560 Q250 580 310 570 Q370 560 360 540 Q340 540 310 558" fill="none" stroke="#7dd3fc" stroke-width="4" filter="url(#glow)" />
                                <path d="M310 558 Q290 550 280 560 Q270 570 310 565 Q350 560 340 550 Q330 550 310 558" fill="none" stroke="#bae6fd" stroke-width="2" filter="url(#glow)" />
                                <!-- Center Hole -->
                                <circle cx="310" cy="558" r="10" fill="#082f49" filter="url(#blurShadow)" />
                            </g>
                        </g>
                    </g>

                    <!-- 5. Seat & Lid (Assembled) -->
                    <g id="lid-seat">
                        <!-- Lid: Vertical (Open) -->
                        <!-- Simulates a thick, rounded ceramic lid leaning back -->
                        <path d="M240 545 Q310 575 380 545 L370 290 Q310 270 250 290 Z" fill="url(#gradCeramBody)" />
                        <!-- Lid Detail Line -->
                        <path d="M250 295 Q310 275 370 295" stroke="rgba(0,0,0,0.1)" stroke-width="1" fill="none" />

                        <!-- Seat: Horizontal (Down) -->
                        <!-- Outer Edge -->
                        <path d="M210 550 Q310 590 410 550 L400 565 Q310 605 220 565 Z" fill="url(#gradCeramBody)" />
                        <!-- Seat Inner Hole (Black/Dark) -->
                        <path d="M240 555 Q310 585 380 555 L370 565 Q310 595 250 565 Z" fill="#111" />
                    </g>

                    <!-- 6. Flush Handle (Chrome Lever) -->
                    <!-- Positioned clearly on the right side of the tank -->
                    <g id="handle-group" transform-origin="380 400">
                        <!-- Base Plate -->
                        <circle cx="380" cy="400" r="14" fill="url(#gradChrome)" stroke="#fff" stroke-width="1" />
                        <!-- Lever Arm -->
                        <path d="M380 400 L435 390 L435 405 L380 415 Z" fill="url(#gradChrome)" />
                        <!-- Lever Tip -->
                        <circle cx="435" cy="397.5" r="7" fill="url(#gradChrome)" stroke="#fff" stroke-width="0.5" />
                    </g>

                    <!-- 7. Splash Particles Container -->
                    <g id="splash-container"></g>

                </svg>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const flushBtn = document.getElementById('flushBtn');
            const handleGroup = document.getElementById('handle-group');
            const splashContainer = document.getElementById('splash-container');
            const swirlGroup = document.querySelector('.swirl-group');
            const waterLevel = document.querySelector('.water-level');

            // Function to create water splash particles
            function createSplash() {
                const ns = "http://www.w3.org/2000/svg";
                
                // Create particles
                for(let i=0; i<30; i++) {
                    const drop = document.createElementNS(ns, "circle");
                    
                    // Origin near center of water
                    const startX = 310 + (Math.random() * 60 - 30);
                    const startY = 560;
                    
                    drop.setAttribute("cx", startX);
                    drop.setAttribute("cy", startY);
                    drop.setAttribute("r", Math.random() * 3 + 1);
                    drop.setAttribute("fill", "#7dd3fc");
                    drop.setAttribute("opacity", "0.8");
                    
                    splashContainer.appendChild(drop);
                    
                    // Physics simulation
                    const tx = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 50 + 20); 
                    const ty = -(Math.random() * 60 + 30); 

                    const animation = drop.animate([
                        { transform: `translate(0, 0)`, opacity: 1 },
                        { transform: `translate(${tx}px, ${ty}px)`, opacity: 1, offset: 0.4 },
                        { transform: `translate(${tx * 1.2}px, ${ty + 80}px)`, opacity: 0 }
                    ], {
                        duration: 800 + Math.random() * 400,
                        easing: 'cubic-bezier(0.1, 0.7, 0.2, 1)'
                    });

                    animation.onfinish = () => drop.remove();
                }
            }

            // Trigger Flush
            const triggerFlush = () => {
                // 1. Move Handle (Lever action)
                handleGroup.style.transition = "transform 0.1s ease-out";
                handleGroup.style.transform = "rotate(25deg)";

                setTimeout(() => {
                    handleGroup.style.transition = "transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1)";
                    handleGroup.style.transform = "rotate(0deg)";
                }, 150);

                // 2. Trigger Water Effects
                createSplash();
                
                // 3. Bowl swirl animation
                swirlGroup.classList.remove('flush-active');
                waterLevel.classList.remove('flush-active');
                void swirlGroup.offsetWidth; // Force reflow
                
                swirlGroup.classList.add('flush-active');
                waterLevel.classList.add('flush-active');
                
                // 4. Reset classes
                setTimeout(() => {
                    swirlGroup.classList.remove('flush-active');
                    waterLevel.classList.remove('flush-active');
                }, 1500);
            };

            flushBtn.addEventListener('click', triggerFlush);

            // Subtle Parallax for Depth
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth - e.pageX * 2) / 400;
                const y = (window.innerHeight - e.pageY * 2) / 400;

                const lid = document.getElementById('lid-seat');
                const tank = document.getElementById('tank');
                const bowl = document.getElementById('bowl');
                
                // Lid moves most (furthest back/loose), Tank moves medium, Bowl moves least (heavy/grounded)
                lid.style.transform = `translate(${x * 4}px, ${y * 4}px)`;
                tank.style.transform = `translate(${x * 2}px, ${y * 2}px)`;
                bowl.style.transform = `translate(${x * 1}px, ${y * 1}px)`;
            });
        });
    </script>
</body>
</html>
