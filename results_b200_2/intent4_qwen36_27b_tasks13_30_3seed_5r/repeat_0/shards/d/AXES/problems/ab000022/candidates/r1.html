<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce & Dash - Adventure Awaits</title>
    <style>
        :root {
            /* Palette */
            --c-sky-top: #4FACFE;
            --c-sky-bot: #00F2FE;
            --c-grass: #7CFC00;
            --c-grass-dark: #58d68d;
            --c-dirt: #8B4513;
            --c-block: #FF8C00;
            --c-accent: #FFD700;
            --c-hero: #FF4757;
            --c-hero-dark: #C41E3A;
            --c-text: #ffffff;
            
            /* UI System Variables */
            --glass-bg: rgba(20, 20, 40, 0.6);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-blur: 12px;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 8px;
            --shadow-card: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            --shadow-btn: 0 4px 0px #b33939;
            
            /* Typography */
            --font-stack: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #111;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-stack);
            overflow: hidden;
        }

        /* --- GAME SCREEN CONTAINER --- */
        #game-screen {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1920px;
            max-height: 1080px;
            background: linear-gradient(to bottom, var(--c-sky-top), var(--c-sky-bot));
            overflow: hidden;
            transition: background 0.5s ease;
            box-shadow: 0 0 100px rgba(0,0,0,0.5);
        }

        /* --- PARALLAX BACKGROUND --- */
        .bg-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Clouds */
        .cloud {
            position: absolute;
            background: #fff;
            border-radius: 100px;
            opacity: 0.8;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .cloud::after, .cloud::before {
            content: ''; position: absolute; background: inherit; border-radius: 50%;
        }
        
        .c1 { width: 140px; height: 50px; top: 15%; left: -150px; animation: floatCloud 25s linear infinite; }
        .c1::after { width: 60px; height: 60px; top: -30px; left: 20px; }
        .c1::before { width: 50px; height: 50px; top: -20px; left: 70px; }

        .c2 { width: 100px; height: 40px; top: 25%; left: -120px; animation: floatCloud 35s linear infinite; animation-delay: 5s; opacity: 0.6; }
        .c2::after { width: 50px; height: 50px; top: -25px; left: 15px; }

        .c3 { width: 160px; height: 60px; top: 10%; left: -160px; animation: floatCloud 18s linear infinite; animation-delay: 2s; }
        .c3::after { width: 70px; height: 70px; top: -35px; left: 25px; }
        .c3::before { width: 60px; height: 60px; top: -25px; left: 80px; }

        /* Distant Mountains */
        .mountains-svg {
            position: absolute;
            bottom: 140px;
            width: 100%;
            height: 300px;
            z-index: 1;
        }

        /* --- LEVEL CANVAS (The "Game World") --- */
        #level-canvas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%; /* Occupy bottom 40% */
            z-index: 5;
        }

        /* --- HERO --- */
        #hero-container {
            position: absolute;
            bottom: 32%; /* Positioned on the ground layer visually */
            left: 15%;
            z-index: 10;
            width: 100px;
            height: 100px;
            transition: transform 0.1s linear;
            filter: drop-shadow(0px 10px 5px rgba(0,0,0,0.2));
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20;
            pointer-events: none; /* Allow clicks through to buttons */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .game-title-group {
            transform: skewX(-5deg);
        }

        .game-title {
            font-size: 5rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            line-height: 0.9;
            text-shadow: 
                4px 4px 0px var(--c-hero),
                8px 8px 0px rgba(0,0,0,0.2);
            letter-spacing: -2px;
        }
        
        .game-title span {
            color: var(--c-accent);
        }

        .world-label {
            font-size: 1.2rem;
            font-weight: 700;
            color: rgba(255,255,255,0.8);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
            background: rgba(0,0,0,0.3);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
        }

        /* --- COLLECTIBLES TRACKER (Unified UI Language) --- */
        .tracker-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            padding: 15px 25px;
            border-radius: var(--radius-md);
            color: white;
            display: flex;
            gap: 20px;
            box-shadow: var(--shadow-card);
            pointer-events: auto;
        }

        .tracker-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tracker-icon {
            font-size: 1.5rem;
        }

        .tracker-val {
            font-weight: 800;
            font-size: 1.2rem;
            font-variant-numeric: tabular-nums;
        }
        
        .tracker-max {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.6);
            font-weight: 600;
        }

        /* --- BOTTOM CONTROLS --- */
        .bottom-ui {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            gap: 20px;
        }

        /* World Selector (Interactive) */
        .world-selector {
            pointer-events: auto;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            padding: 10px;
            border-radius: 50px;
            display: flex;
            gap: 12px;
            box-shadow: var(--shadow-card);
        }

        .world-btn {
            width: 50px; height: 50px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            opacity: 0.6;
        }

        .world-btn:hover { transform: translateY(-3px); opacity: 1; }
        .world-btn.active { 
            border-color: #fff; 
            transform: scale(1.15); 
            opacity: 1;
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }
        
        /* Patterns */
        .w-grass { background: radial-gradient(circle at 30% 30%, #7CFC00, #228B22); }
        .w-ice { background: radial-gradient(circle at 30% 30%, #E0FFFF, #00BFFF); }
        .w-fire { background: radial-gradient(circle at 30% 30%, #FF4500, #8B0000); }

        /* Controls Guide (Secondary) */
        .controls-guide {
            pointer-events: auto;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            padding: 15px 20px;
            border-radius: var(--radius-md);
            color: rgba(255,255,255,0.8);
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .controls-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 4px;
        }

        .key-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .key {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.8rem;
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }

        /* --- START BUTTON (Primary Anchor) --- */
        .start-container {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            pointer-events: auto;
            text-align: center;
        }

        .start-btn {
            background: var(--c-hero);
            color: white;
            border: none;
            padding: 18px 70px;
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 60px;
            cursor: pointer;
            /* Unified visual style: Flat but with depth */
            box-shadow: 
                0 8px 0 #b33939, 
                0 15px 20px rgba(0,0,0,0.3);
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            letter-spacing: 1px;
            overflow: hidden;
        }

        .start-btn:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 12px 0 #b33939, 
                0 25px 30px rgba(0,0,0,0.3);
            background: #ff5e6c;
        }

        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b33939;
        }

        /* Shine effect */
        .start-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-20deg);
            animation: shine 4s infinite;
        }

        /* --- ANIMATIONS --- */
        @keyframes floatCloud {
            0% { transform: translateX(-200px); }
            100% { transform: translateX(120vw); }
        }
        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0) scaleY(1); }
            10% { transform: translateY(0) scaleY(0.9); } /* Squash */
            50% { transform: translateY(-15px) scaleY(1.05); } /* Stretch */
        }
        @keyframes blink {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }

        /* SVG Styles */
        .hero-svg {
            width: 100%;
            height: 100%;
            animation: bounce 2s ease-in-out infinite;
        }
        .eye { transform-origin: center; animation: blink 4s infinite; }

    </style>
</head>
<body>

    <div id="game-screen">
        
        <!-- Background Parallax -->
        <div class="bg-layer">
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="cloud c3"></div>
            
            <!-- Distant Mountains SVG -->
            <svg class="mountains-svg" viewBox="0 0 1000 300" preserveAspectRatio="none">
                <path d="M0,300 L0,150 L150,50 L300,180 L450,80 L600,200 L800,20 L1000,150 L1000,300 Z" fill="rgba(255,255,255,0.3)" />
                <path d="M0,300 L0,200 L200,100 L400,220 L600,120 L800,250 L1000,180 L1000,300 Z" fill="rgba(255,255,255,0.15)" />
            </svg>
        </div>

        <!-- The Level Preview (Canvas) -->
        <canvas id="level-canvas"></canvas>

        <!-- Hero Character -->
        <div id="hero-container">
            <svg class="hero-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Body -->
                <circle cx="50" cy="50" r="45" fill="var(--c-hero)" stroke="var(--c-hero-dark)" stroke-width="4" />
                <!-- Shine -->
                <path d="M25 35 Q 50 15 75 35" stroke="rgba(255,255,255,0.3)" stroke-width="5" fill="none" stroke-linecap="round" />
                <!-- Face -->
                <g class="face">
                    <!-- Mouth -->
                    <path d="M40 65 Q 50 75 60 65" stroke="black" stroke-width="3" fill="none" stroke-linecap="round" />
                    <!-- Eyes -->
                    <circle cx="40" cy="55" r="6" fill="black" class="eye" />
                    <circle cx="60" cy="55" r="6" fill="black" class="eye" />
                    <circle cx="42" cy="53" r="2" fill="white" />
                    <circle cx="62" cy="53" r="2" fill="white" />
                </g>
                <!-- Hat -->
                <path d="M30 20 L 50 5 L 70 20 Z" fill="#FFD700" stroke="#E67E22" stroke-width="3" stroke-linejoin="round" />
                <path d="M20 20 Q 50 25 80 20" stroke="#E67E22" stroke-width="4" fill="none" stroke-linecap="round" />
            </svg>
        </div>

        <!-- UI Overlay -->
        <div class="ui-layer">
            
            <!-- Header: Title & Collectibles -->
            <header>
                <div class="game-title-group">
                    <div class="game-title">
                        Bounce <span>&</span> Dash
                    </div>
                    <div class="world-label" id="world-name">Green Hills</div>
                </div>

                <div class="tracker-card">
                    <div class="tracker-item">
                        <div class="tracker-icon" style="color: var(--c-accent);">●</div>
                        <div>
                            <div class="tracker-val" id="coin-count">0</div>
                            <div class="tracker-max">/ 50 Coins</div>
                        </div>
                    </div>
                    <div style="width: 1px; background: rgba(255,255,255,0.2);"></div>
                    <div class="tracker-item">
                        <div class="tracker-icon" style="color: var(--c-hero);">♥</div>
                        <div>
                            <div class="tracker-val">3</div>
                            <div class="tracker-max">Lives</div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Bottom: World Selector & Controls -->
            <div class="bottom-ui">
                <div class="world-selector">
                    <div class="world-btn w-grass active" data-world="grass" title="Green Hills"></div>
                    <div class="world-btn w-ice" data-world="ice" title="Ice Peaks"></div>
                    <div class="world-btn w-fire" data-world="fire" title="Lava Lands"></div>
                </div>

                <div class="controls-guide">
                    <div class="controls-title">Controls</div>
                    <div class="key-row"><span class="key">←</span> <span class="key">→</span> Move</div>
                    <div class="key-row"><span class="key">SPACE</span> Jump</div>
                    <div class="key-row"><span class="key">Z</span> Attack</div>
                </div>
            </div>
        </div>

        <!-- Primary Action -->
        <div class="start-container">
            <button class="start-btn" onclick="alert('Game Starting...')">Start Adventure</button>
        </div>

    </div>

    <script>
        // --- CANVAS LEVEL GENERATION ---
        const canvas = document.getElementById('level-canvas');
        const ctx = canvas.getContext('2d');
        let currentTheme = 'grass';

        // Resize handling
        function resize() {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
            drawLevel();
        }
        window.addEventListener('resize', resize);

        // --- DRAWING HELPERS ---
        
        function drawGround(y, colorMain, colorDark) {
            // Grass Top
            ctx.fillStyle = colorMain;
            ctx.fillRect(0, y, canvas.width, 20);
            
            // Grass Shadow/Detail
            ctx.fillStyle = colorDark;
            ctx.fillRect(0, y + 10, canvas.width, 5);

            // Dirt Body
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, y + 15, canvas.width, canvas.height - y);
            
            // Dirt Texture (Dots)
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for(let i=0; i<canvas.width; i+=40) {
                ctx.beginPath(); ctx.arc(i+20, y+50, 4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(i+50, y+80, 3, 0, Math.PI*2); ctx.fill();
            }
            
            // Bottom Border
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(0, y+15, canvas.width, 2);
        }

        function drawBlock(x, y, size, type) {
            const s = size;
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(x+5, y+5, s, s);

            // Base
            if (type === 'mystery') {
                ctx.fillStyle = '#FF8C00';
                ctx.fillRect(x, y, s, s);
                // Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(x, y, s, s/2);
                // Border
                ctx.strokeStyle = '#8B4513';
                ctx.lineWidth = 4;
                ctx.strokeRect(x, y, s, s);
                // Question Mark
                ctx.fillStyle = '#FFD700';
                ctx.font = `bold ${s*0.7}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('?', x + s/2, y + s/2 + 2);
                // Bolts
                ctx.fillStyle = '#8B4513';
                ctx.beginPath(); ctx.arc(x+6, y+6, 2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(x+s-6, y+6, 2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(x+6, y+s-6, 2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(x+s-6, y+s-6, 2, 0, Math.PI*2); ctx.fill();
            } else {
                // Standard Brick
                ctx.fillStyle = '#A0522D';
                ctx.fillRect(x, y, s, s);
                ctx.strokeStyle = '#5D2906';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, s, s);
                // Brick pattern
                ctx.beginPath();
                ctx.moveTo(x, y + s/2); ctx.lineTo(x+s, y + s/2);
                ctx.moveTo(x + s/2, y); ctx.lineTo(x + s/2, y + s/2);
                ctx.moveTo(x + s/4, y + s/2); ctx.lineTo(x + s/4, y + s);
                ctx.moveTo(x + s*0.75, y + s/2); ctx.lineTo(x + s*0.75, y + s);
                ctx.stroke();
            }
        }

        function drawPipe(x, y, w, h, colorMain, colorDark) {
            const headH = 40;
            // Pipe Body
            ctx.fillStyle = colorMain;
            ctx.fillRect(x + 10, y + headH, w - 20, h - headH);
            // Pipe Head
            ctx.fillStyle = colorDark;
            ctx.fillRect(x, y, w, headH);
            // Highlights
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(x + 5, y, 10, headH); 
            ctx.fillRect(x + 15, y + headH, 5, h - headH); 
            // Outlines
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, w, headH);
            ctx.strokeRect(x+10, y+headH, w-20, h-headH);
        }

        function drawFlag(x, y, h) {
            // Pole
            ctx.fillStyle = '#7f8c8d';
            ctx.fillRect(x, y, 8, h);
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.strokeRect(x, y, 8, h);
            
            // Ball on top
            ctx.beginPath();
            ctx.arc(x+4, y, 8, 0, Math.PI*2);
            ctx.fillStyle = '#f1c40f';
            ctx.fill();
            ctx.stroke();

            // Flag
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.moveTo(x+8, y+10);
            ctx.lineTo(x+60, y+30);
            ctx.lineTo(x+8, y+50);
            ctx.fill();
            ctx.stroke();
        }

        function drawEnemy(x, y) {
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(x+20, y+35, 18, 5, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Body (Mushroom shape)
            ctx.fillStyle = '#8e44ad'; // Purple enemy
            ctx.beginPath();
            ctx.arc(x+20, y+15, 20, Math.PI, 0); // Top dome
            ctx.lineTo(x+40, y+35);
            ctx.lineTo(x, y+35);
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.stroke();
            
            // Eyes
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(x+12, y+20, 6, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+28, y+20, 6, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(x+12, y+20, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+28, y+20, 2, 0, Math.PI*2); ctx.fill();
        }

        function drawCoin(x, y) {
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.ellipse(x, y, 10, 14, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#DAA520';
            ctx.lineWidth = 2;
            ctx.stroke();
            // Shine
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.ellipse(x-3, y-4, 2, 6, -0.2, 0, Math.PI*2);
            ctx.fill();
        }

        function drawBush(x, y, scale, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, 30 * scale, 0, Math.PI * 2);
            ctx.arc(x + 25*scale, y, 40 * scale, 0, Math.PI * 2);
            ctx.arc(x + 50*scale, y, 30 * scale, 0, Math.PI * 2);
            ctx.fill();
            // Outline
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.stroke();
        }

        // --- THEMES ---
        const themes = {
            'grass': { 
                sky: ['#4FACFE', '#00F2FE'], 
                grass: '#7CFC00', 
                grassDark: '#58d68d', 
                pipe: ['#2ecc71', '#27ae60'],
                bush: '#228B22'
            },
            'ice': { 
                sky: ['#83a4d4', '#b6fbff'], 
                grass: '#E0FFFF', 
                grassDark: '#B0E0E6', 
                pipe: ['#add8e6', '#87cefa'],
                bush: '#87CEFA'
            },
            'fire': { 
                sky: ['#ff9966', '#ff5e62'], 
                grass: '#555555', 
                grassDark: '#333333', 
                pipe: ['#cd5c5c', '#8b0000'],
                bush: '#8b0000'
            }
        };

        // --- MAIN DRAW LOOP ---
        function drawLevel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const theme = themes[currentTheme];
            const groundY = canvas.height - 120;

            // 1. Background Elements (Bushes behind ground)
            drawBush(canvas.width * 0.15, groundY, 1.2, theme.bush);
            drawBush(canvas.width * 0.75, groundY, 0.8, theme.bush);

            // 2. Ground
            drawGround(groundY, theme.grass, theme.grassDark);

            // 3. Platforms
            // Floating blocks
            drawBlock(canvas.width * 0.2, groundY - 120, 50, 'mystery');
            
            // Row of blocks
            for(let i=0; i<3; i++) {
                drawBlock(canvas.width * 0.4 + (i*65), groundY - 120, 60, 'brick');
            }

            // High platform
            drawBlock(canvas.width * 0.7, groundY - 200, 60, 'brick');
            drawBlock(canvas.width * 0.7 + 65, groundY - 200, 60, 'brick');
            drawBlock(canvas.width * 0.7 + 130, groundY - 200, 60, 'brick');

            // 4. Pipe
            drawPipe(canvas.width * 0.6, groundY - 60, 60, 60, theme.pipe[0], theme.pipe[1]);

            // 5. Flag (Goal)
            drawFlag(canvas.width * 0.85, groundY - 250, 250);

            // 6. Coins
            drawCoin(canvas.width * 0.2 + 25, groundY - 160);
            drawCoin(canvas.width * 0.7 + 30, groundY - 240);
            drawCoin(canvas.width * 0.7 + 95, groundY - 240);
            drawCoin(canvas.width * 0.7 + 160, groundY - 240);

            // 7. Enemy
            drawEnemy(canvas.width * 0.5, groundY - 35);
        }

        // Initial draw
        resize();

        // --- INTERACTIVITY ---
        
        // Hero Parallax/Bounce
        const hero = document.getElementById('hero-container');
        const screen = document.getElementById('game-screen');
        let mouseX = 0;

        screen.addEventListener('mousemove', (e) => {
            const rect = screen.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            
            // Move hero slightly with mouse (parallax)
            let percent = (mouseX / rect.width) * 10;
            // Clamp
            percent = Math.max(0, Math.min(40, percent + 10));
            hero.style.left = percent + '%';
            
            // Dynamic bounce based on movement speed or just time
            const bounceHeight = Math.abs(Math.sin(Date.now() / 200)) * 15;
            hero.style.transform = `translateY(-${bounceHeight}px)`;
        });

        // World Selector Logic
        const worlds = document.querySelectorAll('.world-btn');
        const root = document.documentElement;
        const worldNameLabel = document.getElementById('world-name');
        const coinCountLabel = document.getElementById('coin-count');
        
        worlds.forEach(btn => {
            btn.addEventListener('click', () => {
                const worldKey = btn.dataset.world;
                currentTheme = worldKey;

                // UI Updates
                worlds.forEach(w => w.classList.remove('active'));
                btn.classList.add('active');
                
                // Text Updates
                const names = { 'grass': 'Green Hills', 'ice': 'Ice Peaks', 'fire': 'Lava Lands' };
                worldNameLabel.textContent = names[worldKey];
                
                // Randomize coin count slightly for effect
                coinCountLabel.textContent = Math.floor(Math.random() * 10);

                // Theme Updates
                const theme = themes[worldKey];
                root.style.setProperty('--c-sky-top', theme.sky[0]);
                root.style.setProperty('--c-sky-bot', theme.sky[1]);
                
                // Redraw Canvas
                drawLevel();
            });
        });

    </script>
</body>
</html>
