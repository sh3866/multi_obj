<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce & Dash - Adventure Awaits</title>
    <style>
        :root {
            /* Palette - High Contrast & Vibrant */
            --c-sky-top: #00B4DB;
            --c-sky-bot: #0083B0;
            --c-sun: #FFD700;
            --c-grass: #55E6C1;
            --c-grass-dark: #2ECC71;
            --c-dirt: #5D4037;
            --c-dirt-light: #795548;
            --c-hero: #FF5252;
            --c-hero-dark: #D32F2F;
            --c-wood: #8D6E63;
            --c-wood-dark: #5D4037;
            --c-wood-light: #A1887F;
            --c-text: #ffffff;
            
            /* Typography */
            --font-display: 'Arial Black', 'Impact', sans-serif;
            --font-ui: 'Segoe UI', 'Helvetica Neue', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a1a;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: var(--font-ui);
            user-select: none;
        }

        /* --- GAME SCREEN CONTAINER --- */
        #game-screen {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1920px;
            max-height: 1080px;
            background: linear-gradient(to bottom, var(--c-sky-top), var(--c-sky-bot));
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0,0,0,0.6);
        }

        /* --- BACKGROUND LAYERS (Parallax) --- */
        .bg-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Sun */
        .sun {
            position: absolute;
            top: 15%;
            right: 15%;
            width: 120px;
            height: 120px;
            background: var(--c-sun);
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.6);
            z-index: 1;
        }

        /* Clouds */
        .cloud {
            position: absolute;
            background: #FFF;
            border-radius: 100px;
            opacity: 0.85;
            z-index: 2;
            animation: floatCloud 60s linear infinite;
        }
        .cloud::after, .cloud::before {
            content: ''; position: absolute; background: inherit; border-radius: 50%;
        }
        
        .c1 { width: 200px; height: 80px; top: 15%; left: -10%; }
        .c1::after { width: 100px; height: 100px; top: -50px; left: 30px; }
        .c1::before { width: 90px; height: 90px; top: -40px; left: 90px; }

        .c2 { width: 140px; height: 60px; top: 25%; left: 50%; opacity: 0.6; animation-duration: 75s; }
        .c2::after { width: 70px; height: 70px; top: -35px; left: 25px; }

        .c3 { width: 240px; height: 100px; top: 10%; left: 80%; animation-duration: 55s; }
        .c3::after { width: 120px; height: 120px; top: -60px; left: 50px; }

        /* Distant Mountains SVG */
        .mountains-svg {
            position: absolute;
            bottom: 20%; /* Sits above the main ground */
            width: 110%;
            left: -5%;
            height: 450px;
            z-index: 3;
            filter: drop-shadow(0px -5px 10px rgba(0,0,0,0.1));
        }

        /* --- LEVEL CANVAS (The "Game World") --- */
        #level-canvas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65%; /* Expanded for depth */
            z-index: 10;
        }

        /* --- HERO --- */
        #hero-container {
            position: absolute;
            bottom: 25%; /* Positioned on ground */
            left: 25%;
            z-index: 20;
            width: 160px;
            height: 160px;
            transition: transform 0.15s ease-out;
            filter: drop-shadow(0px 20px 10px rgba(0,0,0,0.3));
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 30;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 40px;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            pointer-events: auto;
            padding-top: 20px;
        }

        .game-title-group {
            position: relative;
            z-index: 5;
            transform: skewX(-6deg); /* Dynamic tilt */
        }

        .game-title {
            font-family: var(--font-display);
            font-size: 5.5rem;
            line-height: 0.95;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: -2px;
            /* 3D Cartoon Text Effect */
            text-shadow: 
                6px 6px 0px var(--c-hero-dark),
                12px 12px 0px rgba(0,0,0,0.2);
            margin-left: 10px;
        }
        
        .game-title span {
            color: var(--c-sun);
            display: inline-block;
            animation: bounceTitle 3s infinite ease-in-out;
            text-shadow: 6px 6px 0px #D35400;
        }

        /* --- COLLECTIBLES TRACKER (Thematic Badge) --- */
        .tracker-badge {
            background: var(--c-wood-light);
            border: 4px solid var(--c-wood-dark);
            padding: 10px 30px;
            border-radius: 12px;
            display: flex;
            gap: 25px;
            pointer-events: auto;
            box-shadow: 0 8px 0 rgba(0,0,0,0.2);
            transform: skewX(-6deg); /* Matches title tilt */
            position: relative;
        }
        
        /* Wood texture effect */
        .tracker-badge::before {
            content: ''; position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 2px dashed rgba(255,255,255,0.3); border-radius: 8px;
        }

        .tracker-item {
            display: flex;
            align-items: center;
            gap: 12px;
            transform: skewX(6deg); /* Counter tilt */
        }

        .tracker-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            border: 3px solid #333;
            background: #FFF;
            box-shadow: 0 4px 0 #333;
        }
        
        .icon-coin { background: var(--c-sun); color: #fff; border-color: #D4AC0D; }
        .icon-life { background: var(--c-hero); color: #fff; border-color: #C0392B; }

        .tracker-val {
            font-family: var(--font-display);
            font-size: 1.8rem;
            line-height: 1;
            color: #fff;
            text-shadow: 2px 2px 0 #333;
        }
        
        .tracker-max {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #fff;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0 #333;
        }

        /* --- BOTTOM CONTROLS --- */
        .bottom-ui {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            gap: 30px;
            pointer-events: auto;
            padding-bottom: 20px;
        }

        /* World Selector - Map Fragment Style */
        .world-selector-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            transform: skewX(-6deg);
        }

        .world-selector-label {
            font-family: var(--font-display);
            font-size: 1rem;
            color: #FFF;
            text-shadow: 2px 2px 0 #333;
            margin-left: 10px;
        }

        .world-selector {
            background: var(--c-wood);
            border: 4px solid var(--c-wood-dark);
            padding: 10px;
            border-radius: 12px;
            display: flex;
            gap: 12px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.2);
            transform: skewX(6deg); /* Counter tilt */
        }

        .world-btn {
            width: 50px; height: 50px;
            border-radius: 8px;
            border: 3px solid #333;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            box-shadow: 0 4px 0 #333;
            background-size: cover;
            background-position: center;
        }

        .world-btn:hover { transform: translateY(-4px); box-shadow: 0 8px 0 #333; }
        .world-btn:active { transform: translateY(0); box-shadow: 0 0 0 #333; }
        
        .world-btn.active { 
            border-color: var(--c-sun); 
            transform: translateY(-6px) scale(1.1); 
            box-shadow: 0 10px 0 #333, 0 0 15px var(--c-sun);
        }
        
        /* Map-like patterns */
        .w-grass { background: radial-gradient(circle, #A9DFBF 0%, #27AE60 100%); }
        .w-ice { background: radial-gradient(circle, #E1F5FE 0%, #0288D1 100%); }
        .w-fire { background: radial-gradient(circle, #FFCCBC 0%, #D84315 100%); }

        /* Controls Guide - Painted Crate Style */
        .controls-guide {
            background: var(--c-wood-light);
            padding: 15px 20px;
            border-radius: 4px;
            color: #3E2723;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 3px solid var(--c-wood-dark);
            box-shadow: 0 8px 0 rgba(0,0,0,0.2);
            min-width: 200px;
            transform: skewX(6deg);
            position: relative;
        }
        
        /* Crate cross planks */
        .controls-guide::before {
            content: ''; position: absolute; top: 0; left: 50%; width: 4px; height: 100%;
            background: var(--c-wood-dark); transform: translateX(-50%) rotate(2deg); opacity: 0.3;
        }

        .controls-title {
            font-family: var(--font-display);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--c-wood-dark);
            border-bottom: 2px solid rgba(0,0,0,0.2);
            padding-bottom: 4px;
            margin-bottom: 4px;
        }

        .key-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            font-weight: 800;
            transform: skewX(-6deg); /* Counter tilt text */
        }

        .key {
            background: #FFF;
            border: 2px solid #333;
            color: #333;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9rem;
            box-shadow: 0 3px 0 #333;
            min-width: 20px;
            text-align: center;
        }

        /* --- START BUTTON --- */
        .start-container {
            position: absolute;
            bottom: 8%; /* Anchored to bottom */
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            pointer-events: auto;
            text-align: center;
        }

        .start-btn {
            background: var(--c-hero);
            color: white;
            border: 4px solid #333;
            padding: 20px 80px;
            font-size: 2.5rem;
            font-family: var(--font-display);
            text-transform: uppercase;
            border-radius: 50px; /* Pill shape */
            cursor: pointer;
            /* 3D Extrusion */
            box-shadow: 
                0 10px 0 #333,
                0 15px 20px rgba(0,0,0,0.4);
            transition: all 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        }

        .start-btn:hover {
            transform: translateX(-50%) translateY(-4px);
            box-shadow: 
                0 14px 0 #333,
                0 20px 30px rgba(0,0,0,0.5);
            background: #FF6E6E;
        }

        .start-btn:active {
            transform: translateX(-50%) translateY(6px);
            box-shadow: 
                0 4px 0 #333,
                0 5px 10px rgba(0,0,0,0.3);
        }

        /* --- ANIMATIONS --- */
        @keyframes floatCloud {
            0% { transform: translateX(-250px); }
            100% { transform: translateX(120vw); }
        }
        @keyframes bounceTitle {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0) scaleY(1); }
            15% { transform: translateY(0) scaleY(0.8) scaleX(1.2); } 
            50% { transform: translateY(-25px) scaleY(1.1) scaleX(0.9); } 
            85% { transform: translateY(0) scaleY(0.9) scaleX(1.1); }
        }
        @keyframes blink {
            0%, 95%, 100% { transform: scaleY(1); }
            97% { transform: scaleY(0.1); }
        }
        @keyframes spin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .hero-svg {
            width: 100%;
            height: 100%;
            animation: bounce 2s ease-in-out infinite;
        }
        .eye { transform-origin: center; animation: blink 4s infinite; }

    </style>
</head>
<body>

    <div id="game-screen">
        
        <!-- Background Parallax -->
        <div class="bg-layer">
            <div class="sun"></div>
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="cloud c3"></div>
            
            <!-- Distant Mountains SVG -->
            <svg class="mountains-svg" viewBox="0 0 1000 400" preserveAspectRatio="none">
                <!-- Far Layer (Lighter Blue) -->
                <path d="M0,400 L0,250 C150,200 250,300 350,220 C450,140 550,280 650,180 C750,80 850,250 1000,200 L1000,400 Z" fill="#81D4FA" opacity="0.6" />
                <!-- Mid Layer (Darker Blue) -->
                <path d="M0,400 L0,300 C100,280 200,350 300,280 C400,210 500,320 600,250 C700,180 800,320 1000,280 L1000,400 Z" fill="#4FC3F7" opacity="0.8" />
            </svg>
        </div>

        <!-- The Level Preview (Canvas) -->
        <canvas id="level-canvas"></canvas>

        <!-- Hero Character -->
        <div id="hero-container">
            <svg class="hero-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Body -->
                <circle cx="50" cy="50" r="45" fill="var(--c-hero)" stroke="#333" stroke-width="4" />
                <!-- Shine -->
                <path d="M25 35 Q 50 15 75 35" stroke="rgba(255,255,255,0.5)" stroke-width="6" fill="none" stroke-linecap="round" />
                <!-- Face -->
                <g class="face">
                    <!-- Mouth (Open) -->
                    <path d="M35 65 Q 50 80 65 65 Z" fill="#333" />
                    <!-- Eyes -->
                    <circle cx="35" cy="50" r="7" fill="#FFF" stroke="#333" stroke-width="2" class="eye" />
                    <circle cx="65" cy="50" r="7" fill="#FFF" stroke="#333" stroke-width="2" class="eye" />
                    <circle cx="35" cy="50" r="2" fill="#333" />
                    <circle cx="65" cy="50" r="2" fill="#333" />
                </g>
                <!-- Hat (Cap) -->
                <path d="M20 25 Q 50 10 80 25 Z" fill="#FFD700" stroke="#333" stroke-width="4" stroke-linejoin="round" />
                <path d="M20 25 Q 50 35 80 25" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round" />
                <!-- Arms -->
                <path d="M15 55 Q 5 70 20 85" stroke="var(--c-hero)" stroke-width="12" stroke-linecap="round" fill="none" />
                <path d="M15 55 Q 5 70 20 85" stroke="#333" stroke-width="4" stroke-linecap="round" fill="none" />
            </svg>
        </div>

        <!-- UI Overlay -->
        <div class="ui-layer">
            
            <!-- Header: Title & Stats -->
            <header>
                <div class="game-title-group">
                    <div class="game-title">
                        Bounce <span>&</span> Dash
                    </div>
                </div>

                <div class="tracker-badge">
                    <div class="tracker-item">
                        <div class="tracker-icon icon-coin">$</div>
                        <div>
                            <div class="tracker-val" id="coin-count">042</div>
                            <div class="tracker-max">Coins</div>
                        </div>
                    </div>
                    <div style="width: 2px; background: rgba(0,0,0,0.2); margin: 0 10px; border-radius: 2px;"></div>
                    <div class="tracker-item">
                        <div class="tracker-icon icon-life">♥</div>
                        <div>
                            <div class="tracker-val">3</div>
                            <div class="tracker-max">Lives</div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Bottom: World Selector & Controls -->
            <div class="bottom-ui">
                <div class="world-selector-container">
                    <div class="world-selector-label">Select World</div>
                    <div class="world-selector">
                        <div class="world-btn w-grass active" data-world="grass" title="Green Hills"></div>
                        <div class="world-btn w-ice" data-world="ice" title="Ice Peaks"></div>
                        <div class="world-btn w-fire" data-world="fire" title="Lava Lands"></div>
                    </div>
                </div>

                <div class="controls-guide">
                    <div class="controls-title">How to Play</div>
                    <div class="key-row"><span class="key">←</span> <span class="key">→</span> <span>Run</span></div>
                    <div class="key-row"><span class="key">SPACE</span> <span>Jump</span></div>
                </div>
            </div>
        </div>

        <!-- Primary Action (Bottom Center) -->
        <div class="start-container">
            <button class="start-btn" onclick="alert('Game Starting...')">Start Adventure</button>
        </div>

    </div>

    <script>
        // --- CANVAS LEVEL GENERATION ---
        const canvas = document.getElementById('level-canvas');
        const ctx = canvas.getContext('2d');
        let currentTheme = 'grass';

        // Resize handling
        function resize() {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
            drawLevel();
        }
        window.addEventListener('resize', resize);

        // --- DRAWING HELPERS ---
        
        function drawGround(y, colorMain, colorDark) {
            // Grass Top Layer
            ctx.fillStyle = colorMain;
            ctx.fillRect(0, y, canvas.width, 40);
            
            // Grass Outline
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 5;
            ctx.stroke();

            // Dirt Body
            ctx.fillStyle = '#5D4037'; 
            ctx.fillRect(0, y + 40, canvas.width, canvas.height - y);
            
            // Dirt Texture (Dots)
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for(let i=0; i<canvas.width; i+=80) {
                ctx.beginPath(); ctx.arc(i+40, y+80, 8, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(i+100, y+120, 6, 0, Math.PI*2); ctx.fill();
            }
            
            // Bottom Border
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(0, canvas.height - 15, canvas.width, 15);
        }

        function drawBlock(x, y, size, type) {
            const s = size;
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fillRect(x+12, y+12, s, s);

            // Base
            if (type === 'mystery') {
                ctx.fillStyle = '#FF7043'; // Orange block
                ctx.fillRect(x, y, s, s);
                // Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.fillRect(x+5, y+5, s-10, s/2);
                // Border
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 5;
                ctx.strokeRect(x, y, s, s);
                // Question Mark
                ctx.fillStyle = '#FFF';
                ctx.font = `bold ${s*0.7}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('?', x + s/2, y + s/2 + 2);
                // Bolts
                ctx.fillStyle = '#333';
                ctx.beginPath(); ctx.arc(x+12, y+12, 4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(x+s-12, y+12, 4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(x+12, y+s-12, 4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(x+s-12, y+s-12, 4, 0, Math.PI*2); ctx.fill();
            } else {
                // Standard Brick
                ctx.fillStyle = '#A0522D';
                ctx.fillRect(x, y, s, s);
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 4;
                ctx.strokeRect(x, y, s, s);
                // Brick pattern
                ctx.beginPath();
                ctx.moveTo(x, y + s/2); ctx.lineTo(x+s, y + s/2);
                ctx.moveTo(x + s/2, y); ctx.lineTo(x + s/2, y + s/2);
                ctx.moveTo(x + s/4, y + s/2); ctx.lineTo(x + s/4, y + s);
                ctx.moveTo(x + s*0.75, y + s/2); ctx.lineTo(x + s*0.75, y + s);
                ctx.stroke();
            }
        }

        function drawPipe(x, y, w, h, colorMain, colorDark) {
            const headH = 60;
            // Pipe Body
            ctx.fillStyle = colorMain;
            ctx.fillRect(x + 15, y + headH, w - 30, h - headH);
            // Pipe Head
            ctx.fillStyle = colorDark;
            ctx.fillRect(x, y, w, headH);
            // Highlights
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(x + 10, y, 12, headH); 
            ctx.fillRect(x + 25, y + headH, 10, h - headH); 
            // Outlines
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 5;
            ctx.strokeRect(x, y, w, headH);
            ctx.strokeRect(x+15, y+headH, w-30, h-headH);
        }

        function drawFlag(x, y, h) {
            // Pole
            ctx.fillStyle = '#BDC3C7';
            ctx.fillRect(x, y, 16, h);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.strokeRect(x, y, 16, h);
            
            // Ball on top
            ctx.beginPath();
            ctx.arc(x+8, y, 16, 0, Math.PI*2);
            ctx.fillStyle = '#F1C40F';
            ctx.fill();
            ctx.stroke();

            // Flag (Whimsical)
            ctx.fillStyle = '#E74C3C';
            ctx.beginPath();
            ctx.moveTo(x+16, y+25);
            ctx.lineTo(x+90, y+50);
            ctx.lineTo(x+16, y+90);
            ctx.fill();
            ctx.stroke();
            
            // Flag Pattern
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.moveTo(x+16, y+45);
            ctx.lineTo(x+50, y+55);
            ctx.lineTo(x+16, y+65);
            ctx.fill();
        }

        function drawEnemy(x, y) {
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(x+30, y+50, 30, 10, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Body (Mushroom shape)
            ctx.fillStyle = '#8E44AD'; 
            ctx.beginPath();
            ctx.arc(x+30, y+25, 35, Math.PI, 0); // Top dome
            ctx.lineTo(x+65, y+50);
            ctx.lineTo(x, y+50);
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.stroke();
            
            // Eyes
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(x+18, y+30, 12, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+42, y+30, 12, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(x+18, y+30, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+42, y+30, 4, 0, Math.PI*2); ctx.fill();
        }

        function drawCoin(x, y) {
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.ellipse(x, y, 18, 24, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.stroke();
            // Shine
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.ellipse(x-5, y-8, 4, 12, -0.2, 0, Math.PI*2);
            ctx.fill();
        }

        function drawBush(x, y, scale, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, 40 * scale, 0, Math.PI * 2);
            ctx.arc(x + 35*scale, y, 50 * scale, 0, Math.PI * 2);
            ctx.arc(x + 70*scale, y, 40 * scale, 0, Math.PI * 2);
            ctx.fill();
            // Outline
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        // --- THEMES ---
        const themes = {
            'grass': { 
                sky: ['#00B4DB', '#0083B0'], 
                grass: '#55E6C1', 
                grassDark: '#2ECC71', 
                pipe: ['#2ECC71', '#27AE60'],
                bush: '#228B22'
            },
            'ice': { 
                sky: ['#2980B9', '#6DD5FA'], 
                grass: '#B2EBF2', 
                grassDark: '#80DEEA', 
                pipe: ['#4FC3F7', '#0288D1'],
                bush: '#00BCD4'
            },
            'fire': { 
                sky: ['#4B0082', '#FF512F'], 
                grass: '#424242', 
                grassDark: '#212121', 
                pipe: ['#FF5722', '#BF360C'],
                bush: '#B71C1C'
            }
        };

        // --- MAIN DRAW LOOP ---
        function drawLevel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const theme = themes[currentTheme];
            const groundY = canvas.height - 160;

            // 1. Background Elements (Bushes behind ground)
            drawBush(canvas.width * 0.1, groundY, 1.2, theme.bush);
            drawBush(canvas.width * 0.7, groundY, 0.9, theme.bush);
            drawBush(canvas.width * 0.9, groundY, 1.1, theme.bush);

            // 2. Ground
            drawGround(groundY, theme.grass, theme.grassDark);

            // 3. Platforms
            // Floating blocks
            drawBlock(canvas.width * 0.2, groundY - 180, 70, 'mystery');
            
            // Row of blocks
            for(let i=0; i<3; i++) {
                drawBlock(canvas.width * 0.4 + (i*85), groundY - 180, 80, 'brick');
            }

            // High platform
            drawBlock(canvas.width * 0.7, groundY - 300, 80, 'brick');
            drawBlock(canvas.width * 0.7 + 85, groundY - 300, 80, 'brick');
            drawBlock(canvas.width * 0.7 + 170, groundY - 300, 80, 'brick');

            // 4. Pipe
            drawPipe(canvas.width * 0.6, groundY - 100, 90, 100, theme.pipe[0], theme.pipe[1]);

            // 5. Flag (Goal) - Expressive
            drawFlag(canvas.width * 0.85, groundY - 350, 350);

            // 6. Coins
            drawCoin(canvas.width * 0.2 + 35, groundY - 230);
            drawCoin(canvas.width * 0.7 + 40, groundY - 350);
            drawCoin(canvas.width * 0.7 + 125, groundY - 350);
            drawCoin(canvas.width * 0.7 + 210, groundY - 350);

            // 7. Enemy
            drawEnemy(canvas.width * 0.5, groundY - 55);
        }

        // Initial draw
        resize();

        // --- INTERACTIVITY ---
        
        // Hero Parallax/Bounce
        const hero = document.getElementById('hero-container');
        const screen = document.getElementById('game-screen');
        let mouseX = 0;

        screen.addEventListener('mousemove', (e) => {
            const rect = screen.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            
            // Move hero slightly with mouse (parallax)
            let percent = (mouseX / rect.width) * 30;
            // Clamp to stay on screen
            percent = Math.max(15, Math.min(40, percent));
            hero.style.left = percent + '%';
            
            // Dynamic bounce based on movement speed or just time
            const bounceHeight = Math.abs(Math.sin(Date.now() / 200)) * 15;
            hero.style.transform = `translateY(-${bounceHeight}px)`;
        });

        // World Selector Logic
        const worlds = document.querySelectorAll('.world-btn');
        const root = document.documentElement;
        const coinCountLabel = document.getElementById('coin-count');
        
        worlds.forEach(btn => {
            btn.addEventListener('click', () => {
                const worldKey = btn.dataset.world;
                currentTheme = worldKey;

                // UI Updates
                worlds.forEach(w => w.classList.remove('active'));
                btn.classList.add('active');
                
                // Randomize coin count slightly for effect
                coinCountLabel.textContent = Math.floor(Math.random() * 100).toString().padStart(2, '0');

                // Theme Updates
                const theme = themes[worldKey];
                root.style.setProperty('--c-sky-top', theme.sky[0]);
                root.style.setProperty('--c-sky-bot', theme.sky[1]);
                
                // Redraw Canvas
                drawLevel();
            });
        });

    </script>
</body>
</html>
