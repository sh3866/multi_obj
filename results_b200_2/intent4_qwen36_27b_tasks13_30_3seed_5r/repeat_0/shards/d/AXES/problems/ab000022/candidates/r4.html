<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce & Dash - Adventure Awaits</title>
    <style>
        :root {
            /* Palette - Vibrant & Cohesive */
            --c-sky-top: #2980B9;
            --c-sky-bot: #6DD5FA;
            --c-grass: #27AE60;
            --c-grass-light: #2ECC71;
            --c-dirt: #5D4037;
            --c-accent: #F1C40F;
            --c-hero: #E74C3C;
            --c-hero-dark: #C0392B;
            --c-text: #ffffff;
            --c-wood: #8D6E63;
            --c-wood-dark: #5D4037;
            
            /* UI System - Flat Vector with Outlines */
            --ui-bg: rgba(255, 255, 255, 0.95);
            --ui-border: 3px solid #333;
            --ui-shadow: 4px 4px 0px rgba(0,0,0,0.2);
            --radius-lg: 16px;
            --radius-md: 8px;
            
            /* Typography */
            --font-stack: 'Segoe UI', 'Arial Black', sans-serif;
            --font-display: 'Impact', 'Arial Black', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #111;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-stack);
            overflow: hidden;
            color: var(--c-text);
            user-select: none;
        }

        /* --- GAME SCREEN CONTAINER --- */
        #game-screen {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1920px;
            max-height: 1080px;
            background: linear-gradient(to bottom, var(--c-sky-top), var(--c-sky-bot));
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* --- PARALLAX BACKGROUND LAYERS --- */
        .bg-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Sun */
        .sun {
            position: absolute;
            top: 15%;
            right: 10%;
            width: 100px;
            height: 100px;
            background: #FFF;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.6);
        }

        /* Clouds - Flat Vector Style */
        .cloud {
            position: absolute;
            background: #FFF;
            border-radius: 50px;
            opacity: 0.9;
            animation: floatCloud 45s linear infinite;
        }
        .cloud::after, .cloud::before {
            content: ''; position: absolute; background: inherit; border-radius: 50%;
        }
        
        .c1 { width: 160px; height: 60px; top: 15%; left: -10%; }
        .c1::after { width: 80px; height: 80px; top: -40px; left: 30px; }
        .c1::before { width: 70px; height: 70px; top: -30px; left: 80px; }

        .c2 { width: 120px; height: 40px; top: 25%; left: 45%; opacity: 0.7; animation-duration: 60s; }
        .c2::after { width: 50px; height: 50px; top: -25px; left: 20px; }

        .c3 { width: 180px; height: 70px; top: 10%; left: 75%; animation-duration: 50s; }
        .c3::after { width: 90px; height: 90px; top: -45px; left: 40px; }

        /* Distant Mountains */
        .mountains-svg {
            position: absolute;
            bottom: 15%; /* Sits above the main ground line */
            width: 110%;
            left: -5%;
            height: 350px;
            z-index: 1;
        }

        /* --- LEVEL CANVAS (The "Game World") --- */
        /* Expanded to take up bottom 50% for depth */
        #level-canvas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55%; 
            z-index: 5;
        }

        /* --- HERO --- */
        #hero-container {
            position: absolute;
            bottom: 22%; /* Positioned on ground */
            left: 20%;
            z-index: 10;
            width: 120px;
            height: 120px;
            transition: transform 0.1s ease-out;
            filter: drop-shadow(0px 15px 5px rgba(0,0,0,0.3));
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            pointer-events: auto;
        }

        .game-title-group {
            position: relative;
            z-index: 2;
        }

        .game-title {
            font-family: var(--font-display);
            font-size: 6.5rem;
            line-height: 0.9;
            color: #fff;
            text-transform: uppercase;
            /* Crisp Vector Shadow */
            text-shadow: 
                6px 6px 0px var(--c-hero-dark),
                12px 12px 0px rgba(0,0,0,0.15);
            letter-spacing: -2px;
            transform: skewX(-5deg);
            margin-left: 20px;
        }
        
        .game-title span {
            color: var(--c-accent);
            display: inline-block;
            transform: skewX(5deg); 
            animation: bounceTitle 3s infinite ease-in-out;
            text-shadow: 6px 6px 0px #D35400;
        }

        /* Thematic World Label - Styled like a signpost */
        .world-label {
            margin-top: 15px;
            margin-left: 24px;
            display: inline-block;
            background: var(--c-wood);
            padding: 8px 24px;
            border-radius: 4px;
            border: 4px solid var(--c-wood-dark);
            box-shadow: 0 6px 10px rgba(0,0,0,0.3);
            position: relative;
            transform: skewX(-5deg);
        }
        
        /* Signpost Nails */
        .world-label::before, .world-label::after {
            content: '';
            position: absolute;
            width: 10px; height: 10px;
            background: #3E2723;
            border-radius: 50%;
            top: 50%; transform: translateY(-50%);
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.5);
        }
        .world-label::before { left: 10px; }
        .world-label::after { right: 10px; }

        .world-label span {
            display: block;
            font-family: var(--font-display);
            font-size: 1.8rem;
            color: #FFF;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
            transform: skewX(5deg);
        }

        /* --- COLLECTIBLES TRACKER (Stats Panel) --- */
        .tracker-card {
            background: var(--ui-bg);
            /* Unified Flat Style */
            border: var(--ui-border);
            padding: 15px 35px;
            border-radius: var(--radius-lg);
            color: #333;
            display: flex;
            gap: 40px;
            box-shadow: var(--ui-shadow);
            pointer-events: auto;
            transform: skewX(-5deg); /* Matches title tilt */
        }

        .tracker-item {
            display: flex;
            align-items: center;
            gap: 15px;
            transform: skewX(5deg); /* Counter tilt for text */
        }

        .tracker-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            border: 3px solid #333;
            background: #FFF;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }
        
        .icon-coin { background: var(--c-accent); color: #fff; border-color: #D4AC0D; }
        .icon-life { background: var(--c-hero); color: #fff; border-color: #C0392B; }

        .tracker-val {
            font-family: var(--font-display);
            font-size: 2rem;
            line-height: 1;
            color: #333;
        }
        
        .tracker-max {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #666;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* --- BOTTOM CONTROLS --- */
        .bottom-ui {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            gap: 30px;
            pointer-events: auto;
        }

        /* World Selector - Carousel Style */
        .world-selector-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .world-selector-label {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: #FFF;
            text-shadow: 2px 2px 0 #000;
            margin-left: 10px;
        }

        .world-selector {
            background: var(--ui-bg);
            border: var(--ui-border);
            padding: 15px;
            border-radius: var(--radius-lg);
            display: flex;
            gap: 15px;
            box-shadow: var(--ui-shadow);
        }

        .world-btn {
            width: 60px; height: 60px;
            border-radius: 12px;
            border: 3px solid #333;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 0 #333;
        }

        .world-btn:hover { transform: translateY(-4px); box-shadow: 0 8px 0 #333; }
        .world-btn:active { transform: translateY(0); box-shadow: 0 0 0 #333; }
        
        .world-btn.active { 
            border-color: var(--c-accent); 
            transform: translateY(-6px) scale(1.1); 
            box-shadow: 0 10px 0 #333, 0 0 15px var(--c-accent);
        }
        
        /* Patterns */
        .w-grass { background: linear-gradient(135deg, #A9DFBF, #27AE60); }
        .w-ice { background: linear-gradient(135deg, #AED6F1, #2980B9); }
        .w-fire { background: linear-gradient(135deg, #F5B7B1, #C0392B); }

        /* Controls Guide - Lightened & Integrated */
        .controls-guide {
            background: var(--ui-bg);
            padding: 15px 25px;
            border-radius: var(--radius-md);
            color: #333;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: var(--ui-border);
            box-shadow: var(--ui-shadow);
            min-width: 220px;
        }

        .controls-title {
            font-family: var(--font-display);
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--c-hero);
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
            margin-bottom: 5px;
        }

        .key-row {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1rem;
            font-weight: 700;
        }

        .key {
            background: #333;
            border: 2px solid #000;
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.9rem;
            box-shadow: 0 3px 0 #000;
            min-width: 24px;
            text-align: center;
        }

        /* --- START BUTTON --- */
        .start-container {
            position: absolute;
            top: 50%; /* Centered vertically relative to screen, but we push it down via margin */
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 30;
            pointer-events: auto;
            text-align: center;
            margin-top: 180px; /* Push below title area */
        }

        .start-btn {
            background: var(--c-hero);
            color: white;
            border: 4px solid #333;
            padding: 20px 70px;
            font-size: 2.5rem;
            font-family: var(--font-display);
            text-transform: uppercase;
            border-radius: var(--radius-lg);
            cursor: pointer;
            /* 3D Blocky Style */
            box-shadow: 
                0 8px 0 #333,
                0 15px 20px rgba(0,0,0,0.4);
            transition: all 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        }

        .start-btn:hover {
            transform: translate(-50%, -50%) translateY(-4px);
            box-shadow: 
                0 12px 0 #333,
                0 20px 30px rgba(0,0,0,0.5);
            background: #FF5252;
        }

        .start-btn:active {
            transform: translate(-50%, -50%) translateY(4px);
            box-shadow: 
                0 0 0 #333,
                0 5px 10px rgba(0,0,0,0.3);
        }

        /* --- ANIMATIONS --- */
        @keyframes floatCloud {
            0% { transform: translateX(-200px); }
            100% { transform: translateX(120vw); }
        }
        @keyframes bounceTitle {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0) scaleY(1); }
            15% { transform: translateY(0) scaleY(0.85) scaleX(1.1); } 
            50% { transform: translateY(-15px) scaleY(1.05) scaleX(0.95); } 
            85% { transform: translateY(0) scaleY(0.95) scaleX(1.05); }
        }
        @keyframes blink {
            0%, 95%, 100% { transform: scaleY(1); }
            97% { transform: scaleY(0.1); }
        }

        .hero-svg {
            width: 100%;
            height: 100%;
            animation: bounce 2.5s ease-in-out infinite;
        }
        .eye { transform-origin: center; animation: blink 4s infinite; }

    </style>
</head>
<body>

    <div id="game-screen">
        
        <!-- Background Parallax -->
        <div class="bg-layer">
            <div class="sun"></div>
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="cloud c3"></div>
            
            <!-- Distant Mountains SVG -->
            <svg class="mountains-svg" viewBox="0 0 1000 400" preserveAspectRatio="none">
                <!-- Far Layer -->
                <path d="M0,400 L0,250 C150,200 250,300 350,220 C450,140 550,280 650,180 C750,80 850,250 1000,200 L1000,400 Z" fill="rgba(255,255,255,0.25)" />
                <!-- Mid Layer -->
                <path d="M0,400 L0,300 C100,280 200,350 300,280 C400,210 500,320 600,250 C700,180 800,320 1000,280 L1000,400 Z" fill="rgba(255,255,255,0.15)" />
            </svg>
        </div>

        <!-- The Level Preview (Canvas) -->
        <canvas id="level-canvas"></canvas>

        <!-- Hero Character -->
        <div id="hero-container">
            <svg class="hero-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Body -->
                <circle cx="50" cy="50" r="45" fill="var(--c-hero)" stroke="#333" stroke-width="3" />
                <!-- Shine -->
                <path d="M25 35 Q 50 15 75 35" stroke="rgba(255,255,255,0.4)" stroke-width="5" fill="none" stroke-linecap="round" />
                <!-- Face -->
                <g class="face">
                    <!-- Mouth -->
                    <path d="M40 65 Q 50 75 60 65" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round" />
                    <!-- Eyes -->
                    <circle cx="40" cy="55" r="6" fill="#333" class="eye" />
                    <circle cx="60" cy="55" r="6" fill="#333" class="eye" />
                    <circle cx="42" cy="53" r="2" fill="white" />
                    <circle cx="62" cy="53" r="2" fill="white" />
                </g>
                <!-- Hat -->
                <path d="M30 20 L 50 5 L 70 20 Z" fill="#FFD700" stroke="#333" stroke-width="3" stroke-linejoin="round" />
                <path d="M20 20 Q 50 25 80 20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round" />
            </svg>
        </div>

        <!-- UI Overlay -->
        <div class="ui-layer">
            
            <!-- Header: Title & Stats -->
            <header>
                <div class="game-title-group">
                    <div class="game-title">
                        Bounce <span>&</span> Dash
                    </div>
                    <div class="world-label" id="world-name">
                        <span>Green Hills</span>
                    </div>
                </div>

                <div class="tracker-card">
                    <div class="tracker-item">
                        <div class="tracker-icon icon-coin">$</div>
                        <div>
                            <div class="tracker-val" id="coin-count">012</div>
                            <div class="tracker-max">Coins</div>
                        </div>
                    </div>
                    <div style="width: 2px; background: #ddd; margin: 0 10px; border-radius: 2px;"></div>
                    <div class="tracker-item">
                        <div class="tracker-icon icon-life">♥</div>
                        <div>
                            <div class="tracker-val">3</div>
                            <div class="tracker-max">Lives</div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Bottom: World Selector & Controls -->
            <div class="bottom-ui">
                <div class="world-selector-container">
                    <div class="world-selector-label">Select World</div>
                    <div class="world-selector">
                        <div class="world-btn w-grass active" data-world="grass" title="Green Hills"></div>
                        <div class="world-btn w-ice" data-world="ice" title="Ice Peaks"></div>
                        <div class="world-btn w-fire" data-world="fire" title="Lava Lands"></div>
                    </div>
                </div>

                <div class="controls-guide">
                    <div class="controls-title">Controls</div>
                    <div class="key-row"><span class="key">←</span> <span class="key">→</span> <span>Move</span></div>
                    <div class="key-row"><span class="key">SPACE</span> <span>Jump</span></div>
                </div>
            </div>
        </div>

        <!-- Primary Action (Centered) -->
        <div class="start-container">
            <button class="start-btn" onclick="alert('Game Starting...')">Start Adventure</button>
        </div>

    </div>

    <script>
        // --- CANVAS LEVEL GENERATION ---
        const canvas = document.getElementById('level-canvas');
        const ctx = canvas.getContext('2d');
        let currentTheme = 'grass';

        // Resize handling
        function resize() {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
            drawLevel();
        }
        window.addEventListener('resize', resize);

        // --- DRAWING HELPERS (Unified Style: Bold Outlines) ---
        
        function drawGround(y, colorMain, colorDark) {
            // Grass Top Layer
            ctx.fillStyle = colorMain;
            ctx.fillRect(0, y, canvas.width, 30);
            
            // Grass Outline
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Dirt Body
            ctx.fillStyle = '#5D4037'; 
            ctx.fillRect(0, y + 30, canvas.width, canvas.height - y);
            
            // Dirt Texture (Dots)
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            for(let i=0; i<canvas.width; i+=60) {
                ctx.beginPath(); ctx.arc(i+30, y+60, 6, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(i+80, y+90, 5, 0, Math.PI*2); ctx.fill();
            }
            
            // Bottom Border
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(0, canvas.height - 10, canvas.width, 10);
        }

        function drawBlock(x, y, size, type) {
            const s = size;
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(x+10, y+10, s, s);

            // Base
            if (type === 'mystery') {
                ctx.fillStyle = '#FF7043'; // Orange block
                ctx.fillRect(x, y, s, s);
                // Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(x, y, s, s/2);
                // Border
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 4;
                ctx.strokeRect(x, y, s, s);
                // Question Mark
                ctx.fillStyle = '#FFF';
                ctx.font = `bold ${s*0.7}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('?', x + s/2, y + s/2 + 2);
                // Bolts
                ctx.fillStyle = '#333';
                ctx.beginPath(); ctx.arc(x+10, y+10, 3, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(x+s-10, y+10, 3, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(x+10, y+s-10, 3, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(x+s-10, y+s-10, 3, 0, Math.PI*2); ctx.fill();
            } else {
                // Standard Brick
                ctx.fillStyle = '#A0522D';
                ctx.fillRect(x, y, s, s);
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 3;
                ctx.strokeRect(x, y, s, s);
                // Brick pattern
                ctx.beginPath();
                ctx.moveTo(x, y + s/2); ctx.lineTo(x+s, y + s/2);
                ctx.moveTo(x + s/2, y); ctx.lineTo(x + s/2, y + s/2);
                ctx.moveTo(x + s/4, y + s/2); ctx.lineTo(x + s/4, y + s);
                ctx.moveTo(x + s*0.75, y + s/2); ctx.lineTo(x + s*0.75, y + s);
                ctx.stroke();
            }
        }

        function drawPipe(x, y, w, h, colorMain, colorDark) {
            const headH = 50;
            // Pipe Body
            ctx.fillStyle = colorMain;
            ctx.fillRect(x + 15, y + headH, w - 30, h - headH);
            // Pipe Head
            ctx.fillStyle = colorDark;
            ctx.fillRect(x, y, w, headH);
            // Highlights
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(x + 8, y, 10, headH); 
            ctx.fillRect(x + 20, y + headH, 8, h - headH); 
            // Outlines
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.strokeRect(x, y, w, headH);
            ctx.strokeRect(x+15, y+headH, w-30, h-headH);
        }

        function drawFlag(x, y, h) {
            // Pole
            ctx.fillStyle = '#BDC3C7';
            ctx.fillRect(x, y, 12, h);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, 12, h);
            
            // Ball on top
            ctx.beginPath();
            ctx.arc(x+6, y, 12, 0, Math.PI*2);
            ctx.fillStyle = '#F1C40F';
            ctx.fill();
            ctx.stroke();

            // Flag (Whimsical)
            ctx.fillStyle = '#E74C3C';
            ctx.beginPath();
            ctx.moveTo(x+12, y+20);
            ctx.lineTo(x+80, y+40);
            ctx.lineTo(x+12, y+70);
            ctx.fill();
            ctx.stroke();
            
            // Flag Pattern
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.moveTo(x+12, y+40);
            ctx.lineTo(x+45, y+40);
            ctx.lineTo(x+12, y+55);
            ctx.fill();
        }

        function drawEnemy(x, y) {
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(x+25, y+40, 25, 8, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Body (Mushroom shape)
            ctx.fillStyle = '#8E44AD'; 
            ctx.beginPath();
            ctx.arc(x+25, y+20, 28, Math.PI, 0); // Top dome
            ctx.lineTo(x+53, y+40);
            ctx.lineTo(x, y+40);
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // Eyes
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(x+15, y+25, 9, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+35, y+25, 9, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(x+15, y+25, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+35, y+25, 3, 0, Math.PI*2); ctx.fill();
        }

        function drawCoin(x, y) {
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.ellipse(x, y, 15, 20, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.stroke();
            // Shine
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.ellipse(x-4, y-6, 3, 10, -0.2, 0, Math.PI*2);
            ctx.fill();
        }

        function drawBush(x, y, scale, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, 35 * scale, 0, Math.PI * 2);
            ctx.arc(x + 30*scale, y, 45 * scale, 0, Math.PI * 2);
            ctx.arc(x + 60*scale, y, 35 * scale, 0, Math.PI * 2);
            ctx.fill();
            // Outline
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        // --- THEMES ---
        const themes = {
            'grass': { 
                sky: ['#2980B9', '#6DD5FA'], 
                grass: '#27AE60', 
                grassDark: '#229954', 
                pipe: ['#2ECC71', '#27AE60'],
                bush: '#228B22'
            },
            'ice': { 
                sky: ['#2980B9', '#6DD5FA'], 
                grass: '#B2EBF2', 
                grassDark: '#80DEEA', 
                pipe: ['#4FC3F7', '#0288D1'],
                bush: '#00BCD4'
            },
            'fire': { 
                sky: ['#4B0082', '#FF512F'], 
                grass: '#424242', 
                grassDark: '#212121', 
                pipe: ['#FF5722', '#BF360C'],
                bush: '#B71C1C'
            }
        };

        // --- MAIN DRAW LOOP ---
        function drawLevel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const theme = themes[currentTheme];
            const groundY = canvas.height - 140;

            // 1. Background Elements (Bushes behind ground)
            drawBush(canvas.width * 0.1, groundY, 1.2, theme.bush);
            drawBush(canvas.width * 0.7, groundY, 0.9, theme.bush);
            drawBush(canvas.width * 0.9, groundY, 1.1, theme.bush);

            // 2. Ground
            drawGround(groundY, theme.grass, theme.grassDark);

            // 3. Platforms
            // Floating blocks
            drawBlock(canvas.width * 0.2, groundY - 150, 60, 'mystery');
            
            // Row of blocks
            for(let i=0; i<3; i++) {
                drawBlock(canvas.width * 0.4 + (i*75), groundY - 150, 70, 'brick');
            }

            // High platform
            drawBlock(canvas.width * 0.7, groundY - 250, 70, 'brick');
            drawBlock(canvas.width * 0.7 + 75, groundY - 250, 70, 'brick');
            drawBlock(canvas.width * 0.7 + 150, groundY - 250, 70, 'brick');

            // 4. Pipe
            drawPipe(canvas.width * 0.6, groundY - 80, 80, 80, theme.pipe[0], theme.pipe[1]);

            // 5. Flag (Goal) - Expressive
            drawFlag(canvas.width * 0.88, groundY - 300, 300);

            // 6. Coins
            drawCoin(canvas.width * 0.2 + 30, groundY - 190);
            drawCoin(canvas.width * 0.7 + 35, groundY - 290);
            drawCoin(canvas.width * 0.7 + 110, groundY - 290);
            drawCoin(canvas.width * 0.7 + 185, groundY - 290);

            // 7. Enemy
            drawEnemy(canvas.width * 0.5, groundY - 45);
        }

        // Initial draw
        resize();

        // --- INTERACTIVITY ---
        
        // Hero Parallax/Bounce
        const hero = document.getElementById('hero-container');
        const screen = document.getElementById('game-screen');
        let mouseX = 0;

        screen.addEventListener('mousemove', (e) => {
            const rect = screen.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            
            // Move hero slightly with mouse (parallax)
            let percent = (mouseX / rect.width) * 20;
            // Clamp to stay on screen
            percent = Math.max(15, Math.min(35, percent));
            hero.style.left = percent + '%';
            
            // Dynamic bounce based on movement speed or just time
            const bounceHeight = Math.abs(Math.sin(Date.now() / 200)) * 10;
            hero.style.transform = `translateY(-${bounceHeight}px)`;
        });

        // World Selector Logic
        const worlds = document.querySelectorAll('.world-btn');
        const root = document.documentElement;
        const worldNameLabel = document.getElementById('world-name');
        const coinCountLabel = document.getElementById('coin-count');
        
        worlds.forEach(btn => {
            btn.addEventListener('click', () => {
                const worldKey = btn.dataset.world;
                currentTheme = worldKey;

                // UI Updates
                worlds.forEach(w => w.classList.remove('active'));
                btn.classList.add('active');
                
                // Text Updates
                const names = { 'grass': 'Green Hills', 'ice': 'Ice Peaks', 'fire': 'Lava Lands' };
                worldNameLabel.querySelector('span').textContent = names[worldKey];
                
                // Randomize coin count slightly for effect
                coinCountLabel.textContent = Math.floor(Math.random() * 10).toString().padStart(2, '0');

                // Theme Updates
                const theme = themes[worldKey];
                root.style.setProperty('--c-sky-top', theme.sky[0]);
                root.style.setProperty('--c-sky-bot', theme.sky[1]);
                
                // Redraw Canvas
                drawLevel();
            });
        });

    </script>
</body>
</html>
