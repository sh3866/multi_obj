<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPINE DESCENT // EDITORIAL REVISED</title>
    <style>
        :root {
            /* Palette - Atmospheric & High Contrast */
            --bg-sky-top: #0f172a;
            --bg-sky-horizon: #38bdf8; /* Horizon glow */
            --bg-sky-bottom: #1e293b;
            
            --cliff-shadow: #020617;
            --cliff-face: #0f172a;
            --cliff-highlight: #334155;
            
            --accent-ui: #f8fafc; /* Clean White */
            --accent-alert: #ef4444; /* Red for danger */
            --accent-teal: #2dd4bf; /* Teal for HUD accents */

            /* Typography - Unified System */
            --font-stack: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-sky-top);
            color: var(--accent-ui);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* --- Layout --- */
        .viewport {
            position: relative;
            width: 100%;
            height: 100%;
            /* Vignette overlay to focus center */
            box-shadow: inset 0 0 150px rgba(0,0,0,0.6);
        }

        /* --- SVG Scene --- */
        .scene-svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- UI Layer (Editorial Overlay) --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            /* Subtle fade so it doesn't compete with illustration */
            opacity: 0.85; 
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .title-group {
            position: relative;
        }

        .title-group::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 0;
            width: 40px;
            height: 4px;
            background-color: var(--accent-teal);
        }

        .title-group h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            color: var(--accent-ui);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .title-group p {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--accent-teal);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        /* Data Strip - Unified Right Side */
        .data-strip {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.5rem;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            padding: 1rem;
            border-right: 2px solid var(--accent-teal);
            border-radius: 4px 0 0 4px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .data-label {
            font-size: 0.6rem;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 2px;
        }

        .data-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-ui);
            font-variant-numeric: tabular-nums;
        }

        /* Footer */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 0.65rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Animations */
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        .rec-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--accent-alert);
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

    </style>
</head>
<body>

<div class="viewport">
    
    <!-- THE SCENE: SVG Illustration -->
    <svg class="scene-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Sky Gradient: High altitude depth -->
            <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#020617" />
                <stop offset="60%" stop-color="#1e293b" />
                <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
            </linearGradient>

            <!-- Cliff Gradient: Deep, jagged shadows -->
            <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#000000" />
                <stop offset="40%" stop-color="#0f172a" />
                <stop offset="95%" stop-color="#1e293b" />
            </linearGradient>
            
            <!-- Rim Light Gradient (Sun flare effect) -->
            <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
                <stop offset="80%" stop-color="#bae6fd" stop-opacity="0.9" />
                <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
            </linearGradient>

            <!-- Canopy Gradient: Fabric volume -->
            <radialGradient id="canopyGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="60%" stop-color="#e2e8f0" />
                <stop offset="100%" stop-color="#94a3b8" />
            </radialGradient>

            <!-- Blur for Depth of Field -->
            <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="8" />
            </filter>
            
            <!-- Drop Shadow for Canopy -->
            <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="20" stdDeviation="15" flood-color="#000" flood-opacity="0.8"/>
            </filter>

            <!-- Glow for UI elements -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
        </defs>

        <!-- 1. Sky Background -->
        <rect width="100%" height="100%" fill="url(#skyGrad)" />

        <!-- 2. Distant Landscape (Atmospheric Perspective) -->
        <g id="landscape-layer">
            <!-- Distant Mountains: Hazy Blue -->
            <path d="M0,900 L0,550 Q 300,500 600,600 T 1600,550 L1600,900 Z" fill="#334155" opacity="0.3" filter="url(#blur)" />
            <!-- Mid Mountains: Darker -->
            <path d="M0,900 L0,650 L 400,600 L 800,700 L 1200,620 L 1600,700 L1600,900 Z" fill="#1e293b" opacity="0.6" filter="url(#blur)" />
            <!-- Foreground Valley Floor -->
            <path d="M0,900 L0,800 L 1600,800 L1600,900 Z" fill="#0f172a" opacity="0.9" />
        </g>

        <!-- 3. Wind / Motion Cues (Unified Diagonal Shear) -->
        <!-- These lines are generated by JS -->
        <g id="wind-layer"></g>

        <!-- 4. The Dramatic Cliff (Left Foreground - Looming) -->
        <g id="cliff-layer">
            <!-- Main Cliff Mass - Jagged, Geometric -->
            <!-- The shape is pushed closer to the center to create claustrophobia/danger -->
            <path d="M-100,-100 L500,-100 L520,150 L450,250 L550,350 L480,480 L520,600 L420,750 L480,900 L-100,900 Z" fill="url(#cliffGrad)" />
            
            <!-- Rim Light on the Edge (Strong Separation) -->
            <path d="M500,-100 L520,150 L450,250 L550,350 L480,480 L520,600 L420,750 L480,900" fill="none" stroke="url(#rimLight)" stroke-width="6" filter="url(#glow)" />

            <!-- Rock Strata / Texture (Subtle, 0.5px opacity) -->
            <g stroke="#000000" stroke-width="1" fill="none" opacity="0.3">
                <!-- Vertical Fissures -->
                <path d="M450,250 L430,450" />
                <path d="M480,480 L460,700" />
                
                <!-- Horizontal Layers (Geological Strata) -->
                <path d="M-100,150 L520,150" stroke-width="2" />
                <path d="M-100,350 L550,350" stroke-width="2" />
                <path d="M-100,600 L520,600" stroke-width="2" />
                <path d="M-100,750 L420,750" stroke-width="2" />
            </g>

            <!-- Facet Highlights (3D volume) -->
            <g fill="#bae6fd" opacity="0.05">
                <path d="M520,150 L450,250 L550,350 L520,350 Z" />
                <path d="M480,480 L520,600 L420,750 L480,750 Z" />
            </g>
        </g>

        <!-- 5. The Parachutist (Right Third Focus - Large Scale) -->
        <!-- Translated via JS for animation, base is x=1100, y=400 -->
        <g id="parachute-group" transform="translate(1100, 400)">
            
            <!-- Canopy (Segmented, 3D, Tension) -->
            <g id="canopy" filter="url(#dropShadow)">
                <!-- Main Canopy Shape -->
                <path d="M-350,0 C-350,-300 350,-300 350,0 C350,100 150,120 0,120 C-150,120 -350,100 -350,0 Z" fill="url(#canopyGrad)" />
                
                <!-- Canopy Ribs (Structural Detail - Gores) -->
                <g stroke="#64748b" stroke-width="2" opacity="0.3" fill="none">
                    <!-- Center Spine -->
                    <path d="M0,-280 L0,110" />
                    <!-- Left Gores -->
                    <path d="M-175,-290 C-175,-150 -175,0 -175,100" />
                    <path d="M-270,-220 C-270,-80 -270,0 -270,80" />
                    <!-- Right Gores -->
                    <path d="M175,-290 C175,-150 175,0 175,100" />
                    <path d="M270,-220 C270,-80 270,0 270,80" />
                </g>
                
                <!-- Bottom Hem Lines -->
                <path d="M-350,0 C-175,100 0,110 0,110" stroke="#0f172a" stroke-width="2" fill="none" opacity="0.6"/>
                <path d="M350,0 C175,100 0,110 0,110" stroke="#0f172a" stroke-width="2" fill="none" opacity="0.6"/>
            </g>

            <!-- Taut Harness Lines (Connecting structurally) -->
            <g stroke="#ffffff" stroke-width="1.5" opacity="0.8">
                <!-- Left Lines -->
                <line x1="-270" y1="80" x2="-25" y2="350" />
                <line x1="-175" y1="100" x2="-25" y2="350" />
                <line x1="-50" y1="110" x2="-25" y2="350" />
                <!-- Right Lines -->
                <line x1="270" y1="80" x2="25" y2="350" />
                <line x1="175" y1="100" x2="25" y2="350" />
                <line x1="50" y1="110" x2="25" y2="350" />
            </g>

            <!-- Human Figure (Dynamic Silhouette - Larger Scale) -->
            <g id="human-figure">
                <!-- Harness Pack -->
                <rect x="-30" y="330" width="60" height="70" rx="5" fill="#020617" stroke="#334155" stroke-width="1" />
                
                <!-- Body Parts (Vector Shapes) -->
                <g stroke="none">
                    <!-- Legs (Splayed for balance) -->
                    <path d="M-15,400 C-15,450 -50,490 -45,540 C-40,545 -15,500 -15,450 Z" fill="#020617" />
                    <path d="M15,400 C15,450 50,490 45,540 C40,545 15,500 15,450 Z" fill="#020617" />
                    
                    <!-- Torso -->
                    <path d="M-22,330 L22,330 L15,410 L-15,410 Z" fill="#020617" />

                    <!-- Arms (Reaching out) -->
                    <path d="M-22,340 C-60,330 -85,300 -100,280 C-95,275 -70,300 -25,350 Z" fill="#020617" />
                    <path d="M22,340 C60,330 85,300 100,280 C95,275 70,300 25,350 Z" fill="#020617" />
                </g>
                
                <!-- Head -->
                <circle cx="0" cy="310" r="14" fill="#020617" />
                
                <!-- Rim Light on Figure (Separation) -->
                <path d="M-100,280 C-85,300 -60,330 -22,340 L-15,410 C-15,450 -50,490 -45,540 M 100,280 C85,300 60,330 22,340 L15,410 C15,450 50,490 45,540" stroke="#bae6fd" stroke-width="2" fill="none" opacity="0.8" filter="url(#glow)" />
            </g>
        </g>
    </svg>

    <!-- UI OVERLAY -->
    <div class="ui-layer">
        
        <!-- Header -->
        <div class="header">
            <div class="title-group">
                <h1>Alpine Descent</h1>
                <p>Operation: Vertical // Sector 4</p>
            </div>
            
            <div class="data-strip">
                <div class="data-item">
                    <span class="data-label">Altitude</span>
                    <span class="data-value" id="val-alt">14,200 ft</span>
                </div>
                <div class="data-item">
                    <span class="data-label">Vert. Speed</span>
                    <span class="data-value" id="val-speed">-24.5 ft/s</span>
                </div>
                <div class="data-item">
                    <span class="data-label">Wind</span>
                    <span class="data-value">NW 12mph</span>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div>
                <span class="rec-indicator"></span>
                <span>REC: 00:42:19</span>
            </div>
            <div>
                <span>SYS.ONLINE // RENDER: SVG_CORE_V5</span>
            </div>
        </div>

    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const svg = document.querySelector('.scene-svg');
        const windLayer = document.getElementById('wind-layer');
        const parachuteGroup = document.getElementById('parachute-group');
        const humanFigure = document.getElementById('human-figure');
        
        // --- State ---
        let time = 0;
        let altitude = 14200;
        let windLines = [];

        // --- 1. Generate Wind Streaks ---
        // Sweeping, semi-transparent motion blurs (Diagonal)
        // Using SVG Lines with varying opacity for "Editorial" feel
        for(let i = 0; i < 80; i++) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            const x = Math.random() * 1600;
            const y = Math.random() * 900;
            const len = 200 + Math.random() * 400; // Longer streaks for speed
            
            // Visual properties for depth
            const opacity = 0.05 + Math.random() * 0.25;
            const width = 1 + Math.random() * 3;

            line.setAttribute("x1", x);
            line.setAttribute("y1", y);
            line.setAttribute("x2", x + len);
            line.setAttribute("y2", y + (len * 0.2)); // Diagonal angle
            line.setAttribute("stroke-width", width);
            line.setAttribute("stroke", "#ffffff");
            line.setAttribute("opacity", opacity);
            line.setAttribute("stroke-linecap", "round");
            
            windLayer.appendChild(line);
            windLines.push({
                el: line,
                x: x,
                y: y,
                speed: 15 + Math.random() * 25, // Faster wind
                len: len
            });
        }

        // --- 2. Animation Loop ---
        function animate() {
            time += 0.01;

            // A. Parachute Physics Simulation
            // Smooth descent with rhythmic sway
            // Swaying closer to the cliff (x=500) to create tension
            const swayX = Math.sin(time * 0.8) * 100; 
            const bobY = Math.sin(time * 1.5) * 40;
            
            // Slow descent loop (visual only)
            const descentY = (time * 40) % 1200;
            
            // Base position: Right Third (x=1100)
            // We move the whole group
            const currentX = 1100 + swayX; 
            const currentY = 400 + descentY + bobY;

            parachuteGroup.setAttribute('transform', `translate(${currentX}, ${currentY})`);

            // B. Human Figure Micro-movement (Counter-balance)
            // The figure tilts slightly opposite to the sway to maintain balance
            const tilt = -swayX * 0.08; 
            humanFigure.setAttribute('transform', `rotate(${tilt}, 0, 350)`);

            // C. Wind Animation
            windLines.forEach(line => {
                line.x += line.speed;
                line.y += line.speed * 0.2; // Diagonal movement
                
                // Reset if off screen
                if(line.x > 1600) {
                    line.x = -line.len - (Math.random() * 300);
                    line.y = Math.random() * 900;
                }
                
                line.el.setAttribute("x1", line.x);
                line.el.setAttribute("y1", line.y);
                line.el.setAttribute("x2", line.x + line.len);
                line.el.setAttribute("y2", line.y + (line.len * 0.2));
            });

            // D. Update HUD Data
            // Simulate altitude drop
            altitude -= 0.5;
            if(altitude < 13500) altitude = 14200; // Loop
            
            document.getElementById('val-alt').innerText = Math.floor(altitude).toLocaleString() + " ft";

            // Varying speed value
            const speedVar = (Math.sin(time * 2) * 2.5);
            const currentSpeed = (24.5 + speedVar).toFixed(1);
            
            // Logic: If close to cliff (swayX is negative, moving left), speed fluctuates
            const speedEl = document.getElementById('val-speed');
            speedEl.innerText = "-" + currentSpeed + " ft/s";
            
            if (swayX < -80) {
                speedEl.style.color = 'var(--accent-alert)';
                speedEl.innerText = "CAUTION";
            } else {
                speedEl.style.color = 'var(--accent-ui)';
            }

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>

</body>
</html>
