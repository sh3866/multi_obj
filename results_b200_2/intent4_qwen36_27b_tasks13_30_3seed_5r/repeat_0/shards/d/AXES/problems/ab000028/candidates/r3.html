<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPINE DESCENT // REVISED</title>
    <style>
        :root {
            /* Palette - Editorial & Atmospheric */
            --bg-sky-deep: #020617;
            --bg-sky-mid: #172554;
            --bg-sky-horizon: #334155;
            --accent-warn: #ef4444;
            --text-ui: #f8fafc;
            
            /* Typography */
            --font-ui: 'Courier New', Courier, monospace;
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-sky-deep);
            color: var(--text-ui);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* --- Layout --- */
        .viewport {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* --- SVG Scene --- */
        .scene-svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- Minimal UI Layer --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Header - Demoted per critique (Opacity 0.4-0.5) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            opacity: 0.4; /* Reduced to push into background */
        }

        .title-group h1 {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
            color: var(--text-ui);
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .title-group p {
            font-size: 0.7rem;
            color: #94a3b8;
            letter-spacing: 0.05em;
        }

        /* Data Strip - Unified, small, integrated */
        .data-strip {
            display: flex;
            gap: 2rem;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .data-label {
            font-size: 0.65rem;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 2px;
            letter-spacing: 0.05em;
        }

        .data-value {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-ui);
            letter-spacing: 0.05em;
        }

        .data-value.warn {
            color: var(--accent-warn);
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
        }

        /* Footer */
        .footer {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #64748b;
            opacity: 0.5;
        }

        /* SVG Animation Classes */
        .wind-streak {
            stroke: rgba(255, 255, 255, 0.2);
            stroke-linecap: round;
        }
        
        .proximity-warning-text {
            font-family: var(--font-ui);
            font-size: 14px;
            font-weight: bold;
            fill: var(--accent-warn);
            letter-spacing: 2px;
            opacity: 0.9;
        }

    </style>
</head>
<body>

<div class="viewport">
    
    <!-- THE SCENE: SVG Illustration -->
    <svg class="scene-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Sky Gradient: Dusk/Dawn Atmosphere -->
            <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#020617" />
                <stop offset="40%" stop-color="#172554" />
                <stop offset="80%" stop-color="#334155" />
                <stop offset="100%" stop-color="#475569" />
            </linearGradient>

            <!-- Cliff Gradient: Near-black to deep slate -->
            <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#000000" />
                <stop offset="50%" stop-color="#020617" />
                <stop offset="100%" stop-color="#0f172a" />
            </linearGradient>

            <!-- Canopy Gradient: High Contrast Editorial -->
            <linearGradient id="canopyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="60%" stop-color="#cbd5e1" />
                <stop offset="100%" stop-color="#475569" />
            </linearGradient>

            <!-- Figure Gradient: Integrated material -->
            <linearGradient id="figureGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#020617" />
                <stop offset="100%" stop-color="#1e293b" />
            </linearGradient>

            <!-- Blur Filter for Depth -->
            <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="5" />
            </filter>
            
            <!-- Shadow Filter for Canopy -->
            <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
            </filter>
        </defs>

        <!-- 1. Sky Background -->
        <rect width="100%" height="100%" fill="url(#skyGrad)" />

        <!-- 2. Distant Landscape (Depth & Scale) -->
        <g id="landscape-layer">
            <!-- Hazy Far Mountains -->
            <path d="M0,900 L0,550 C200,520 500,650 800,600 C1100,550 1400,700 1600,600 L1600,900 Z" fill="#1e293b" opacity="0.3" filter="url(#blur)" />
            <!-- Mid-ground Mountains -->
            <path d="M0,900 L0,620 C300,650 500,580 900,680 C1200,750 1500,650 1600,700 L1600,900 Z" fill="#0f172a" opacity="0.6" />
        </g>

        <!-- 3. Wind / Motion Cues -->
        <g id="wind-layer"></g>

        <!-- 4. The Dramatic Cliff (Left Foreground) -->
        <!-- Expanded vertically, jagged texture, rock layers -->
        <g id="cliff-layer">
            <!-- Main Cliff Mass - Jagged Vector -->
            <path d="M-50,-50 L350,-50 L380,50 L320,120 L400,200 L340,280 L390,350 L310,450 L360,550 L290,650 L340,750 L280,850 L320,950 L-50,950 Z" fill="url(#cliffGrad)" />
            
            <!-- Rock Strata / Texture Lines (Geological Weight) -->
            <g stroke="#000000" stroke-width="4" fill="none" opacity="0.8">
                <!-- Vertical fissures -->
                <path d="M320,120 L310,450" />
                <path d="M340,280 L330,650" />
                <!-- Horizontal layers -->
                <path d="M-50,200 L400,200" stroke-width="2" opacity="0.5"/>
                <path d="M-50,450 L360,450" stroke-width="2" opacity="0.5"/>
                <path d="M-50,750 L340,750" stroke-width="2" opacity="0.5"/>
            </g>
            
            <!-- Facet Highlights (Simulating light hitting edges) -->
            <g stroke="#334155" stroke-width="2" fill="none" opacity="0.4">
                <path d="M380,50 L320,120 L400,200 L340,280 L390,350 L310,450 L360,550 L290,650 L340,750 L280,850 L320,950" />
            </g>

            <!-- Proximity Warning (Clarified Danger) -->
            <g id="proximity-group" opacity="0">
                <!-- Warning Arc -->
                <path d="M380,500 A 150,150 0 0,1 380,700" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 8" />
                <!-- Warning Text -->
                <text x="550" y="600" class="proximity-warning-text" transform="rotate(90, 550, 600)">PROXIMITY WARNING</text>
            </g>
        </g>

        <!-- 5. The Parachutist (Right Third Focus - Scale & Detail) -->
        <!-- Positioned at x=1100 (Right Third), larger scale -->
        <g id="parachute-group" transform="translate(1100, 350)">
            
            <!-- Canopy (Fully Inflated, Structural Integrity) -->
            <g id="canopy" filter="url(#dropShadow)">
                <!-- Main Canopy Shape -->
                <path d="M-280,0 C-280,-220 280,-220 280,0 C280,70 140,90 0,90 C-140,90 -280,70 -280,0 Z" fill="url(#canopyGrad)" />
                
                <!-- Canopy Ribs (Structural Detail - Gores) -->
                <g stroke="#0f172a" stroke-width="2" opacity="0.3" fill="none">
                    <path d="M-200,-60 C-200,-200 0,-200 0,-200" />
                    <path d="M-100,-80 C-100,-210 0,-210 0,-210" />
                    <path d="M100,-80 C100,-210 0,-210 0,-210" />
                    <path d="M200,-60 C200,-200 0,-200 0,-200" />
                    <!-- Bottom hem lines -->
                    <path d="M-280,0 C-140,60 0,70 0,70" />
                    <path d="M280,0 C140,60 0,70 0,70" />
                </g>
            </g>

            <!-- Taut Harness Lines -->
            <g stroke="#ffffff" stroke-width="1.5" opacity="0.8">
                <!-- Left Lines (Connecting to harness) -->
                <line x1="-240" y1="10" x2="-25" y2="260" />
                <line x1="-140" y1="60" x2="-25" y2="260" />
                <line x1="-40" y1="80" x2="-25" y2="260" />
                <!-- Right Lines -->
                <line x1="240" y1="10" x2="25" y2="260" />
                <line x1="140" y1="60" x2="25" y2="260" />
                <line x1="40" y1="80" x2="25" y2="260" />
            </g>

            <!-- Human Figure (Dynamic Silhouette - Polished) -->
            <g id="human-figure">
                <!-- Harness Pack -->
                <rect x="-30" y="250" width="60" height="65" rx="6" fill="url(#figureGrad)" stroke="#334155" stroke-width="1" />
                
                <!-- Body Parts (Vector Shapes, not Stick Figure) -->
                <g stroke="none">
                    <!-- Legs (Splayed for balance) -->
                    <path d="M-15,310 C-15,350 -45,380 -40,420 C-35,425 -10,390 -15,350 Z" fill="url(#figureGrad)" />
                    <path d="M15,310 C15,350 45,380 40,420 C35,425 10,390 15,350 Z" fill="url(#figureGrad)" />
                    
                    <!-- Torso -->
                    <path d="M-20,250 L20,250 L15,315 L-15,315 Z" fill="url(#figureGrad)" />

                    <!-- Arms (Reaching out) -->
                    <path d="M-20,255 C-50,250 -70,230 -80,220 C-75,215 -55,235 -25,265 Z" fill="url(#figureGrad)" />
                    <path d="M20,255 C50,250 70,230 80,220 C75,215 55,235 25,265 Z" fill="url(#figureGrad)" />
                </g>
                
                <!-- Head -->
                <circle cx="0" cy="235" r="14" fill="url(#figureGrad)" />
            </g>
        </g>
    </svg>

    <!-- UI OVERLAY -->
    <div class="ui-layer">
        
        <!-- Header -->
        <div class="header">
            <div class="title-group">
                <h1>Alpine Descent</h1>
                <p>Operation: Vertical // Sector 4</p>
            </div>
            
            <div class="data-strip">
                <div class="data-item">
                    <span class="data-label">Altitude</span>
                    <span class="data-value" id="val-alt">14,200 ft</span>
                </div>
                <div class="data-item">
                    <span class="data-label">Vert. Speed</span>
                    <span class="data-value" id="val-speed">-24.5 ft/s</span>
                </div>
                <div class="data-item">
                    <span class="data-label">Wind</span>
                    <span class="data-value">NW 12mph</span>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div>
                <span>SYS.ONLINE</span>
                <span style="margin-left: 1rem;">RENDER: SVG_CORE_V3</span>
            </div>
            <div>
                <span>COORD: 45.2° N, 12.4° E</span>
            </div>
        </div>

    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const svg = document.querySelector('.scene-svg');
        const windLayer = document.getElementById('wind-layer');
        const parachuteGroup = document.getElementById('parachute-group');
        const humanFigure = document.getElementById('human-figure');
        const proximityGroup = document.getElementById('proximity-group');
        
        // --- State ---
        let time = 0;
        let altitude = 14200;
        let windLines = [];

        // --- 1. Generate Wind Streaks ---
        // Sweeping, semi-transparent motion blurs
        for(let i = 0; i < 50; i++) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            const x = Math.random() * 1600;
            const y = Math.random() * 900;
            const len = 100 + Math.random() * 250; // Longer streaks
            
            // Visual properties for depth
            const opacity = 0.1 + Math.random() * 0.3;
            const width = 1 + Math.random() * 2;

            line.setAttribute("x1", x);
            line.setAttribute("y1", y);
            line.setAttribute("x2", x + len);
            line.setAttribute("y2", y);
            line.setAttribute("stroke-width", width);
            line.setAttribute("opacity", opacity);
            line.setAttribute("class", "wind-streak");
            
            windLayer.appendChild(line);
            windLines.push({
                el: line,
                x: x,
                y: y,
                speed: 8 + Math.random() * 15, // Faster wind for speed sensation
                len: len
            });
        }

        // --- 2. Animation Loop ---
        function animate() {
            time += 0.015;

            // A. Parachute Physics Simulation
            // Smooth descent with rhythmic sway
            const swayX = Math.sin(time * 0.8) * 60; // Wider sway
            const bobY = Math.sin(time * 1.5) * 20;
            
            // Slow descent loop (visual only)
            const descentY = (time * 50) % 1000;
            
            // Base position: Right Third (x=1100)
            // We apply transform to move it
            const baseX = 0; 
            const baseY = 0;

            // Apply transform to the whole group
            parachuteGroup.setAttribute('transform', `translate(${1100 + swayX}, ${350 + descentY + bobY})`);

            // B. Human Figure Micro-movement (Counter-balance)
            // The figure tilts slightly opposite to the sway to maintain balance
            const tilt = -swayX * 0.05; 
            humanFigure.setAttribute('transform', `rotate(${tilt}, 0, 260)`);

            // C. Wind Animation
            windLines.forEach(line => {
                line.x += line.speed;
                
                // Reset if off screen
                if(line.x > 1600) {
                    line.x = -line.len - (Math.random() * 200);
                    line.y = Math.random() * 900;
                }
                
                line.el.setAttribute("x1", line.x);
                line.el.setAttribute("x2", line.x + line.len);
            });

            // D. Proximity Warning Logic
            // Show warning when the parachute sways left (closer to cliff at x=350)
            // Parachute center is at 1100. Sway range is +/- 60.
            // Closest approach is 1100 - 60 = 1040.
            // Trigger warning when swayX < -40
            if (swayX < -40) {
                const opacity = Math.min(1, Math.abs(swayX + 40) / 20);
                proximityGroup.setAttribute("opacity", opacity);
                
                // Update UI Data
                document.getElementById('val-speed').classList.add('warn');
                document.getElementById('val-speed').innerText = "CAUTION";
            } else {
                proximityGroup.setAttribute("opacity", 0);
                document.getElementById('val-speed').classList.remove('warn');
                // Varying speed value
                const speedVar = (Math.sin(time) * 0.5);
                document.getElementById('val-speed').innerText = (Math.abs(24.5 + speedVar)).toFixed(1) + " ft/s";
            }

            // E. Update HUD Data
            altitude -= 0.5;
            if(altitude < 13800) altitude = 14200; // Loop
            
            document.getElementById('val-alt').innerText = Math.floor(altitude).toLocaleString() + " ft";

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>

</body>
</html>
