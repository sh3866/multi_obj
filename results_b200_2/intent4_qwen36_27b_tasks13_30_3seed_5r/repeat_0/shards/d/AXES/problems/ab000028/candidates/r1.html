<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPINE DESCENT // ACTION</title>
    <style>
        :root {
            --bg-deep: #020617;
            --bg-sky-top: #0f172a;
            --bg-sky-horizon: #38bdf8;
            --bg-sky-light: #e0f2fe;
            --cliff-dark: #020617;
            --cliff-mid: #0f172a;
            --cliff-light: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-cyan: #22d3ee;
            --accent-warn: #f43f5e;
            --glass-bg: rgba(15, 23, 42, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-display: 'Impact', 'Arial Black', sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* --- Scene Container --- */
        .viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* --- SVG Layer --- */
        .scene-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- UI Overlay Layer --- */
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
        }

        /* --- Glassmorphism UI Components --- */
        .hud-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 1.25rem;
            pointer-events: auto;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        /* --- Header / Title --- */
        .header-block {
            grid-column: 1 / 2;
            grid-row: 1 / 2;
            margin: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 4rem;
            text-transform: uppercase;
            line-height: 0.85;
            letter-spacing: 2px;
            color: var(--text-primary);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .header-meta {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--accent-cyan);
            margin-top: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-top: 1px solid var(--accent-cyan);
            padding-top: 0.5rem;
            display: inline-block;
            width: fit-content;
        }

        /* --- Data Panel (Right Side) --- */
        .data-block {
            grid-column: 3 / 4;
            grid-row: 2 / 3;
            margin: 2rem;
            width: 280px;
            align-self: center;
            justify-self: end;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .data-row:last-child { border-bottom: none; margin-bottom: 0; }

        .data-label {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-value {
            font-family: var(--font-mono);
            font-size: 1.1rem;
            color: var(--text-primary);
            font-weight: 700;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-warn);
            box-shadow: 0 0 10px var(--accent-warn);
            animation: pulse-warn 1.5s infinite;
        }

        .indicator.nominal {
            background-color: var(--accent-cyan);
            box-shadow: 0 0 10px var(--accent-cyan);
            animation: pulse-nominal 3s infinite;
        }

        /* --- Footer / Footer Info --- */
        .footer-block {
            grid-column: 1 / -1;
            grid-row: 3 / 4;
            margin: 0 2rem 2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        /* --- Animations --- */
        @keyframes pulse-warn {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes pulse-nominal {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* SVG Animation Classes */
        .wind-streak {
            stroke: rgba(255, 255, 255, 0.4);
            stroke-linecap: round;
        }
        
        .proximity-arc {
            fill: none;
            stroke: var(--accent-warn);
            stroke-width: 2;
            stroke-dasharray: 4 4;
            opacity: 0.6;
        }

    </style>
</head>
<body>

<div class="viewport">
    
    <!-- THE SCENE: SVG Illustration -->
    <svg class="scene-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Sky Gradient -->
            <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#0f172a" />
                <stop offset="40%" stop-color="#1e3a8a" />
                <stop offset="100%" stop-color="#bae6fd" />
            </linearGradient>

            <!-- Cliff Texture Gradient -->
            <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#020617" />
                <stop offset="80%" stop-color="#0f172a" />
                <stop offset="100%" stop-color="#1e293b" />
            </linearGradient>

            <!-- Parachute Canopy Gradient -->
            <radialGradient id="canopyGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="0%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="70%" stop-color="#e2e8f0" />
                <stop offset="100%" stop-color="#94a3b8" />
            </radialGradient>

            <!-- Blur Filter for Atmosphere -->
            <filter id="atmosBlur" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" />
            </filter>
        </defs>

        <!-- 1. Sky Background -->
        <rect width="100%" height="100%" fill="url(#skyGrad)" />

        <!-- 2. Distant Landscape (Atmospheric Depth) -->
        <g id="landscape-layer" opacity="0.7">
            <!-- Far Ridge -->
            <path d="M0,1080 L0,650 C200,680 400,600 600,650 C800,700 1000,620 1200,680 C1500,750 1800,650 1920,700 L1920,1080 Z" fill="#64748b" opacity="0.5" filter="url(#atmosBlur)" />
            <!-- Near Ridge -->
            <path d="M0,1080 L0,750 C300,720 500,800 800,780 C1100,760 1400,850 1920,800 L1920,1080 Z" fill="#475569" opacity="0.6" filter="url(#atmosBlur)" />
        </g>

        <!-- 3. Wind / Motion Cues (Dynamic) -->
        <g id="wind-layer">
            <!-- Generated via JS -->
        </g>

        <!-- 4. The Dramatic Cliff (Foreground Left) -->
        <g id="cliff-layer">
            <!-- Main Cliff Mass -->
            <path d="M-100,-100 L550,-100 L550,150 C550,180 520,220 500,250 C480,280 510,320 490,350 C470,380 500,420 480,450 C460,480 490,520 470,550 C450,580 480,620 460,650 C440,680 470,720 450,750 C430,780 460,820 440,850 C420,880 450,920 430,950 C410,980 440,1020 420,1080 L-100,1080 Z" fill="url(#cliffGrad)" />
            
            <!-- Rock Strata / Texture Lines -->
            <g stroke="#020617" stroke-width="2" opacity="0.5" fill="none">
                <path d="M550,150 C550,180 520,220 500,250" />
                <path d="M500,250 C480,280 510,320 490,350" />
                <path d="M490,350 C470,380 500,420 480,450" />
                <path d="M480,450 C460,480 490,520 470,550" />
                <path d="M470,550 C450,580 480,620 460,650" />
                <path d="M460,650 C440,680 470,720 450,750" />
                <path d="M450,750 C430,780 460,820 440,850" />
                <path d="M440,850 C420,880 450,920 430,950" />
                <path d="M430,950 C410,980 440,1020 420,1080" />
            </g>

            <!-- Proximity Warning Arc -->
            <path class="proximity-arc" d="M550,400 A 150,150 0 0,1 550,600" />
            <text x="720" y="500" font-family="monospace" font-size="12" fill="#f43f5e" opacity="0.8" transform="rotate(10, 720, 500)">PROXIMITY WARNING</text>
        </g>

        <!-- 5. The Parachutist (Center Focus) -->
        <g id="parachute-group">
            <!-- Canopy -->
            <path d="M-180,0 C-180,-140 180,-140 180,0 C180,40 100,60 0,60 C-100,60 -180,40 -180,0 Z" fill="url(#canopyGrad)" />
            <!-- Canopy Ribs (Texture) -->
            <g stroke="#cbd5e1" stroke-width="1" opacity="0.5" fill="none">
                <path d="M-120,-10 C-120,-120 0,-120 0,-120" />
                <path d="M-60,-20 C-60,-130 0,-130 0,-130" />
                <path d="M60,-20 C60,-130 0,-130 0,-130" />
                <path d="M120,-10 C120,-120 0,-120 0,-120" />
                <path d="M-180,0 C-180,20 -100,30 0,30" />
                <path d="M180,0 C180,20 100,30 0,30" />
            </g>

            <!-- Taut Harness Lines -->
            <g stroke="#f8fafc" stroke-width="1.5" opacity="0.8">
                <line x1="-140" y1="10" x2="-15" y2="160" />
                <line x1="140" y1="10" x2="15" y2="160" />
                <line x1="-70" y1="40" x2="-5" y2="160" />
                <line x1="70" y1="40" x2="5" y2="160" />
            </g>

            <!-- Human Figure (Silhouette) -->
            <g id="human-figure">
                <!-- Harness -->
                <rect x="-20" y="155" width="40" height="45" rx="5" fill="#0f172a" stroke="#334155" />
                
                <!-- Body Parts -->
                <g stroke="#020617" stroke-width="9" stroke-linecap="round" fill="none">
                    <!-- Legs (Splayed slightly for balance) -->
                    <path d="M-10,195 C-10,230 -25,260 -20,280" />
                    <path d="M10,195 C10,230 25,260 20,280" />
                    <!-- Arms (Reaching slightly out) -->
                    <path d="M-10,160 C-30,155 -40,140 -50,130" />
                    <path d="M10,160 C30,155 40,140 50,130" />
                </g>
                
                <!-- Head -->
                <circle cx="0" cy="145" r="14" fill="#020617" />
            </g>
        </g>
    </svg>

    <!-- UI OVERLAY -->
    <div class="ui-overlay">
        
        <!-- Header -->
        <div class="header-block">
            <h1>Alpine<br>Descent</h1>
            <div class="header-meta">Operation: Vertical // Sector 4</div>
        </div>

        <!-- Data Panel -->
        <div class="hud-panel data-block">
            <div class="data-row">
                <span class="data-label">Altitude</span>
                <span class="data-value" id="val-alt">14,200 ft</span>
            </div>
            <div class="data-row">
                <span class="data-label">Vert. Speed</span>
                <span class="data-value" id="val-speed">-24.5 ft/s</span>
            </div>
            <div class="data-row">
                <span class="data-label">Wind Vector</span>
                <span class="data-value">NW 12mph</span>
            </div>
            <div class="data-row">
                <span class="data-label">Canopy</span>
                <span class="data-value" style="color:var(--accent-cyan)">NOMINAL</span>
            </div>
            <div class="data-row">
                <span class="data-label">Proximity</span>
                <span class="data-value status-badge">
                    <span class="indicator"></span> CAUTION
                </span>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer-block">
            <div>
                <p>SYS.ONLINE</p>
                <p>RENDER: SVG_CORE_V2</p>
            </div>
            <div style="text-align: right;">
                <p>COORD: 45.2° N, 12.4° E</p>
                <p>DESIGN: SENIOR_REVISION</p>
            </div>
        </div>

    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const svg = document.querySelector('.scene-svg');
        const windLayer = document.getElementById('wind-layer');
        const parachuteGroup = document.getElementById('parachute-group');
        const humanFigure = document.getElementById('human-figure');
        
        // --- State ---
        let time = 0;
        let altitude = 14200;
        let windLines = [];

        // --- 1. Generate Wind Streaks ---
        // We create lines of varying length and opacity to simulate depth
        for(let i = 0; i < 60; i++) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            const x = Math.random() * 1920;
            const y = Math.random() * 1080;
            const len = 50 + Math.random() * 150;
            
            // Randomize visual properties for depth
            const opacity = 0.1 + Math.random() * 0.4;
            const width = 1 + Math.random() * 2;

            line.setAttribute("x1", x);
            line.setAttribute("y1", y);
            line.setAttribute("x2", x + len);
            line.setAttribute("y2", y);
            line.setAttribute("stroke-width", width);
            line.setAttribute("opacity", opacity);
            line.setAttribute("class", "wind-streak");
            
            windLayer.appendChild(line);
            windLines.push({
                el: line,
                x: x,
                y: y,
                speed: 4 + Math.random() * 8, // Faster wind
                len: len
            });
        }

        // --- 2. Animation Loop ---
        function animate() {
            time += 0.015;

            // A. Parachute Physics Simulation
            // Combine a slow descent with a rhythmic "sway" and "bob"
            // The sway creates the tension against the cliff
            const swayX = Math.sin(time * 0.8) * 40; 
            const bobY = Math.sin(time * 1.5) * 15;
            
            // Slow descent loop
            const descentY = (time * 50) % 1200;
            
            // Base position: Center right, avoiding the cliff on the left
            const baseX = 1100; 
            const baseY = -200;

            // Apply transform to the whole group
            parachuteGroup.setAttribute('transform', `translate(${baseX + swayX}, ${baseY + descentY + bobY})`);

            // B. Human Figure Micro-movement (Counter-balance)
            // The figure tilts slightly opposite to the sway to maintain balance
            const tilt = -swayX * 0.05; 
            humanFigure.setAttribute('transform', `rotate(${tilt}, 0, 160)`);

            // C. Wind Animation
            windLines.forEach(line => {
                line.x += line.speed;
                
                // Reset if off screen
                if(line.x > 1920) {
                    line.x = -line.len - (Math.random() * 200);
                    line.y = Math.random() * 1080;
                }
                
                line.el.setAttribute("x1", line.x);
                line.el.setAttribute("x2", line.x + line.len);
            });

            // D. Update HUD Data
            altitude -= 1.5;
            if(altitude < 13800) altitude = 14200; // Loop
            
            // Add slight jitter to vertical speed for realism
            const speedJitter = (Math.random() * 0.4) - 0.2;
            const currentSpeed = -24.5 + speedJitter;

            document.getElementById('val-alt').innerText = Math.floor(altitude).toLocaleString() + " ft";
            document.getElementById('val-speed').innerText = currentSpeed.toFixed(1) + " ft/s";

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>

</body>
</html>
