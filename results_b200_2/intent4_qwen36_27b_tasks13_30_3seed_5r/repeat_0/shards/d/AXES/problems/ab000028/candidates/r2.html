<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPINE DESCENT // REVISED</title>
    <style>
        :root {
            /* Palette - Editorial & Atmospheric */
            --bg-sky-deep: #020617;
            --bg-sky-mid: #0f172a;
            --bg-sky-horizon: #1e293b;
            --accent-sun: #fbbf24;
            --accent-warn: #ef4444;
            --text-ui: #f8fafc;
            --cliff-dark: #0f172a;
            --cliff-light: #1e293b;
            
            /* Typography */
            --font-ui: 'Courier New', Courier, monospace;
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-sky-deep);
            color: var(--text-ui);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* --- Layout --- */
        .viewport {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* --- SVG Scene --- */
        .scene-svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- Minimal UI Layer --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Header - Demoted, refined */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            opacity: 0.8;
        }

        .title-group h1 {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
            color: var(--text-ui);
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .title-group p {
            font-size: 0.75rem;
            color: #94a3b8;
            letter-spacing: 0.05em;
        }

        /* Data Strip - Unified, small, integrated */
        .data-strip {
            display: flex;
            gap: 2rem;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .data-label {
            font-size: 0.65rem;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .data-value {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-ui);
        }

        .data-value.warn {
            color: var(--accent-warn);
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
        }

        /* Footer */
        .footer {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #64748b;
            opacity: 0.6;
        }

        /* SVG Animation Classes */
        .wind-streak {
            stroke: rgba(255, 255, 255, 0.3);
            stroke-linecap: round;
        }
        
        .proximity-warning-text {
            font-family: var(--font-ui);
            font-size: 14px;
            font-weight: bold;
            fill: var(--accent-warn);
            letter-spacing: 2px;
            opacity: 0.8;
        }

    </style>
</head>
<body>

<div class="viewport">
    
    <!-- THE SCENE: SVG Illustration -->
    <svg class="scene-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Sky Gradient: Dusk/Dawn Atmosphere -->
            <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#020617" />
                <stop offset="40%" stop-color="#172554" />
                <stop offset="80%" stop-color="#334155" />
                <stop offset="100%" stop-color="#475569" />
            </linearGradient>

            <!-- Cliff Gradient: Deep shadows to slate edges -->
            <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#020617" />
                <stop offset="70%" stop-color="#0f172a" />
                <stop offset="100%" stop-color="#1e293b" />
            </linearGradient>

            <!-- Canopy Gradient: Glowing/High Contrast -->
            <linearGradient id="canopyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#f8fafc" />
                <stop offset="50%" stop-color="#cbd5e1" />
                <stop offset="100%" stop-color="#64748b" />
            </linearGradient>

            <!-- Blur Filter -->
            <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="4" />
            </filter>
        </defs>

        <!-- 1. Sky Background -->
        <rect width="100%" height="100%" fill="url(#skyGrad)" />

        <!-- 2. Distant Landscape (Depth) -->
        <g id="landscape-layer">
            <path d="M0,900 L0,550 C300,520 500,600 800,580 C1100,560 1300,650 1600,600 L1600,900 Z" fill="#334155" opacity="0.4" filter="url(#blur)" />
            <path d="M0,900 L0,650 C400,680 600,620 1000,700 C1300,750 1500,680 1600,720 L1600,900 Z" fill="#1e293b" opacity="0.6" />
        </g>

        <!-- 3. Wind / Motion Cues -->
        <g id="wind-layer"></g>

        <!-- 4. The Dramatic Cliff (Left Foreground) -->
        <!-- Expanded vertically to show scale and rock layers -->
        <g id="cliff-layer">
            <!-- Main Cliff Mass - Faceted Vector Style -->
            <path d="M-50,-50 L450,-50 L450,50 C450,80 420,120 400,150 C420,200 460,250 440,300 C420,350 380,400 390,450 C410,500 450,550 430,600 C410,650 360,700 380,750 C400,800 440,850 420,950 L-50,950 Z" fill="url(#cliffGrad)" />
            
            <!-- Rock Strata / Texture Lines (Geological Weight) -->
            <g stroke="#020617" stroke-width="3" fill="none" opacity="0.6">
                <path d="M450,50 C450,80 420,120 400,150" />
                <path d="M400,150 C420,200 460,250 440,300" />
                <path d="M440,300 C420,350 380,400 390,450" />
                <path d="M390,450 C410,500 450,550 430,600" />
                <path d="M430,600 C410,650 360,700 380,750" />
                <path d="M380,750 C400,800 440,850 420,950" />
            </g>
            
            <!-- Facet Highlights (Simulating light hitting edges) -->
            <g stroke="#475569" stroke-width="1" fill="none" opacity="0.3">
                <path d="M440,300 C420,350 380,400 390,450" />
                <path d="M430,600 C410,650 360,700 380,750" />
            </g>

            <!-- Proximity Warning (Clarified Danger) -->
            <g id="proximity-group" opacity="0">
                <!-- Warning Arc -->
                <path d="M450,500 A 120,120 0 0,1 450,700" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 6" />
                <!-- Warning Text -->
                <text x="580" y="600" class="proximity-warning-text" transform="rotate(90, 580, 600)">PROXIMITY WARNING</text>
            </g>
        </g>

        <!-- 5. The Parachutist (Center Focus - Fully Visible) -->
        <!-- Positioned to show safe descent but proximity to cliff -->
        <g id="parachute-group" transform="translate(800, 400)">
            
            <!-- Canopy (Fully Inflated) -->
            <g id="canopy">
                <!-- Main Canopy Shape -->
                <path d="M-220,0 C-220,-180 220,-180 220,0 C220,60 120,80 0,80 C-120,80 -220,60 -220,0 Z" fill="url(#canopyGrad)" />
                
                <!-- Canopy Ribs (Structural Detail) -->
                <g stroke="#94a3b8" stroke-width="1.5" opacity="0.6" fill="none">
                    <path d="M-150,-30 C-150,-160 0,-160 0,-160" />
                    <path d="M-70,-50 C-70,-170 0,-170 0,-170" />
                    <path d="M70,-50 C70,-170 0,-170 0,-170" />
                    <path d="M150,-30 C150,-160 0,-160 0,-160" />
                    <path d="M-220,0 C-220,40 -100,60 0,60" />
                    <path d="M220,0 C220,40 100,60 0,60" />
                </g>
            </g>

            <!-- Taut Harness Lines -->
            <g stroke="#f8fafc" stroke-width="1.5" opacity="0.9">
                <!-- Left Lines -->
                <line x1="-180" y1="10" x2="-20" y2="220" />
                <line x1="-90" y1="60" x2="-20" y2="220" />
                <line x1="0" y1="80" x2="-20" y2="220" />
                <!-- Right Lines -->
                <line x1="180" y1="10" x2="20" y2="220" />
                <line x1="90" y1="60" x2="20" y2="220" />
                <line x1="0" y1="80" x2="20" y2="220" />
            </g>

            <!-- Human Figure (Dynamic Silhouette) -->
            <g id="human-figure">
                <!-- Harness Pack -->
                <rect x="-25" y="215" width="50" height="55" rx="8" fill="#0f172a" stroke="#334155" />
                
                <!-- Body Parts -->
                <g stroke="#020617" stroke-width="10" stroke-linecap="round" fill="none">
                    <!-- Legs (Splayed for balance) -->
                    <path d="M-15,265 C-15,300 -35,330 -30,360" />
                    <path d="M15,265 C15,300 35,330 30,360" />
                    <!-- Arms (Reaching out) -->
                    <path d="M-15,220 C-40,215 -55,200 -65,190" />
                    <path d="M15,220 C40,215 55,200 65,190" />
                </g>
                
                <!-- Head -->
                <circle cx="0" cy="205" r="16" fill="#020617" />
            </g>
        </g>
    </svg>

    <!-- UI OVERLAY -->
    <div class="ui-layer">
        
        <!-- Header -->
        <div class="header">
            <div class="title-group">
                <h1>Alpine Descent</h1>
                <p>Operation: Vertical // Sector 4</p>
            </div>
            
            <div class="data-strip">
                <div class="data-item">
                    <span class="data-label">Altitude</span>
                    <span class="data-value" id="val-alt">14,200 ft</span>
                </div>
                <div class="data-item">
                    <span class="data-label">Vert. Speed</span>
                    <span class="data-value" id="val-speed">-24.5 ft/s</span>
                </div>
                <div class="data-item">
                    <span class="data-label">Wind</span>
                    <span class="data-value">NW 12mph</span>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div>
                <span>SYS.ONLINE</span>
                <span style="margin-left: 1rem;">RENDER: SVG_CORE_V3</span>
            </div>
            <div>
                <span>COORD: 45.2° N, 12.4° E</span>
            </div>
        </div>

    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const svg = document.querySelector('.scene-svg');
        const windLayer = document.getElementById('wind-layer');
        const parachuteGroup = document.getElementById('parachute-group');
        const humanFigure = document.getElementById('human-figure');
        const proximityGroup = document.getElementById('proximity-group');
        
        // --- State ---
        let time = 0;
        let altitude = 14200;
        let windLines = [];

        // --- 1. Generate Wind Streaks ---
        // Sweeping, semi-transparent motion blurs
        for(let i = 0; i < 40; i++) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            const x = Math.random() * 1600;
            const y = Math.random() * 900;
            const len = 100 + Math.random() * 200;
            
            // Visual properties for depth
            const opacity = 0.1 + Math.random() * 0.3;
            const width = 1 + Math.random() * 2;

            line.setAttribute("x1", x);
            line.setAttribute("y1", y);
            line.setAttribute("x2", x + len);
            line.setAttribute("y2", y);
            line.setAttribute("stroke-width", width);
            line.setAttribute("opacity", opacity);
            line.setAttribute("class", "wind-streak");
            
            windLayer.appendChild(line);
            windLines.push({
                el: line,
                x: x,
                y: y,
                speed: 5 + Math.random() * 10, // Faster wind
                len: len
            });
        }

        // --- 2. Animation Loop ---
        function animate() {
            time += 0.015;

            // A. Parachute Physics Simulation
            // Smooth descent with rhythmic sway
            const swayX = Math.sin(time * 0.8) * 50; 
            const bobY = Math.sin(time * 1.5) * 15;
            
            // Slow descent loop (visual only)
            const descentY = (time * 40) % 1000;
            
            // Base position: Center right, avoiding the cliff on the left
            // We move the group, but the SVG coordinates are absolute
            // The parachute is centered at 800,400 in the SVG structure
            // We apply transform to move it
            const baseX = 0; 
            const baseY = 0;

            // Apply transform to the whole group
            parachuteGroup.setAttribute('transform', `translate(${800 + swayX}, ${400 + descentY + bobY})`);

            // B. Human Figure Micro-movement (Counter-balance)
            // The figure tilts slightly opposite to the sway to maintain balance
            const tilt = -swayX * 0.08; 
            humanFigure.setAttribute('transform', `rotate(${tilt}, 0, 220)`);

            // C. Wind Animation
            windLines.forEach(line => {
                line.x += line.speed;
                
                // Reset if off screen
                if(line.x > 1600) {
                    line.x = -line.len - (Math.random() * 200);
                    line.y = Math.random() * 900;
                }
                
                line.el.setAttribute("x1", line.x);
                line.el.setAttribute("x2", line.x + line.len);
            });

            // D. Proximity Warning Logic
            // Show warning when the parachute sways left (closer to cliff at x=450)
            // Parachute center is at 800. Sway range is +/- 50.
            // Closest approach is 800 - 50 = 750.
            // Let's trigger warning when swayX < -30
            if (swayX < -30) {
                const opacity = Math.min(1, Math.abs(swayX + 30) / 20);
                proximityGroup.setAttribute("opacity", opacity);
                
                // Update UI Data
                document.getElementById('val-speed').classList.add('warn');
                document.getElementById('val-speed').innerText = "CAUTION";
            } else {
                proximityGroup.setAttribute("opacity", 0);
                document.getElementById('val-speed').classList.remove('warn');
                document.getElementById('val-speed').innerText = (Math.random() * 0.4 - 0.2 - 24.5).toFixed(1) + " ft/s";
            }

            // E. Update HUD Data
            altitude -= 0.5;
            if(altitude < 13800) altitude = 14200; // Loop
            
            document.getElementById('val-alt').innerText = Math.floor(altitude).toLocaleString() + " ft";

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>

</body>
</html>
