<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPINE DESCENT // REVISED</title>
    <style>
        :root {
            /* Palette - High Contrast Editorial */
            --bg-sky-top: #09090b;
            --bg-sky-mid: #1e293b;
            --bg-sky-horizon: #475569;
            --accent-danger: #f59e0b; /* Amber/Safety Orange */
            --accent-highlight: #38bdf8; /* Electric Blue */
            --text-ui-primary: #f8fafc;
            --text-ui-secondary: #94a3b8;
            
            /* Typography */
            --font-ui: 'Courier New', Courier, monospace;
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-sky-top);
            color: var(--text-ui-primary);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* --- Layout --- */
        .viewport {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* --- SVG Scene --- */
        .scene-svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- UI Layer (Demoted) --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0.6; /* Dimmed per critique */
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .title-group h1 {
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
            color: var(--text-ui-primary);
        }

        .title-group p {
            font-size: 0.65rem;
            color: var(--text-ui-secondary);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* Data Strip */
        .data-strip {
            display: flex;
            gap: 2.5rem;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .data-label {
            font-size: 0.6rem;
            color: var(--text-ui-secondary);
            text-transform: uppercase;
            margin-bottom: 2px;
            letter-spacing: 0.05em;
        }

        .data-value {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-ui-primary);
            letter-spacing: 0.05em;
        }

        /* Footer */
        .footer {
            display: flex;
            justify-content: space-between;
            font-size: 0.6rem;
            color: var(--text-ui-secondary);
            letter-spacing: 0.05em;
        }

    </style>
</head>
<body>

<div class="viewport">
    
    <!-- THE SCENE: SVG Illustration -->
    <svg class="scene-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Sky Gradient: High altitude twilight -->
            <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#020617" />
                <stop offset="50%" stop-color="#172554" />
                <stop offset="100%" stop-color="#334155" />
            </linearGradient>

            <!-- Cliff Gradient: Faceted, dark but readable -->
            <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#020617" />
                <stop offset="60%" stop-color="#0f172a" />
                <stop offset="100%" stop-color="#1e293b" />
            </linearGradient>
            
            <!-- Rim Light Gradient for Cliff Edge -->
            <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#334155" stop-opacity="0" />
                <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.8" />
            </linearGradient>

            <!-- Canopy Gradient: Volumetric White/Grey -->
            <linearGradient id="canopyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="70%" stop-color="#e2e8f0" />
                <stop offset="100%" stop-color="#94a3b8" />
            </linearGradient>

            <!-- Blur Filter for Depth of Field -->
            <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="6" />
            </filter>
            
            <!-- Drop Shadow for Canopy -->
            <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
            </filter>

            <!-- Glow for Danger Elements -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
        </defs>

        <!-- 1. Sky Background -->
        <rect width="100%" height="100%" fill="url(#skyGrad)" />

        <!-- 2. Distant Landscape (Atmospheric Perspective) -->
        <g id="landscape-layer">
            <!-- Layer 1: Furthest, lightest, haziest -->
            <path d="M0,900 L0,500 Q 400,480 800,550 T 1600,520 L1600,900 Z" fill="#1e293b" opacity="0.2" filter="url(#blur)" />
            <!-- Layer 2: Mid-ground, darker -->
            <path d="M0,900 L0,580 Q 300,620 600,550 T 1200,650 T 1600,600 L1600,900 Z" fill="#0f172a" opacity="0.4" filter="url(#blur)" />
            <!-- Layer 3: Closer, sharp -->
            <path d="M0,900 L0,650 L 200,620 L 400,700 L 800,680 L 1200,750 L 1600,700 L1600,900 Z" fill="#020617" opacity="0.7" />
        </g>

        <!-- 3. Wind / Motion Cues (Dynamic Diagonal Shear) -->
        <g id="wind-layer"></g>

        <!-- 4. The Dramatic Cliff (Left Foreground) -->
        <g id="cliff-layer">
            <!-- Main Cliff Mass - Jagged, Geometric Vector -->
            <path d="M-100,-100 L400,-100 L420,80 L350,150 L450,250 L380,350 L480,450 L360,580 L420,700 L320,850 L400,1000 L-100,1000 Z" fill="url(#cliffGrad)" />
            
            <!-- Rim Light on the Edge (Separation from Sky) -->
            <path d="M400,-100 L420,80 L350,150 L450,250 L380,350 L480,450 L360,580 L420,700 L320,850 L400,1000" fill="none" stroke="url(#rimLight)" stroke-width="4" />

            <!-- Rock Strata / Texture (Geological Weight) -->
            <g stroke="#020617" stroke-width="6" fill="none" opacity="0.6">
                <!-- Vertical Fissures -->
                <path d="M350,150 L330,350" stroke-width="3" />
                <path d="M380,350 L360,580" stroke-width="4" />
                <path d="M420,700 L400,1000" stroke-width="5" />
                
                <!-- Horizontal Layers (Sloped to match perspective) -->
                <path d="M-100,100 L420,100" stroke-width="3" opacity="0.4"/>
                <path d="M-100,250 L450,250" stroke-width="3" opacity="0.4"/>
                <path d="M-100,450 L480,450" stroke-width="3" opacity="0.4"/>
                <path d="M-100,700 L420,700" stroke-width="3" opacity="0.4"/>
            </g>

            <!-- Facet Highlights (Simulating 3D structure) -->
            <g fill="#334155" opacity="0.2">
                <path d="M420,80 L350,150 L380,350 L450,250 Z" />
                <path d="M380,350 L360,580 L420,700 L480,450 Z" />
            </g>

            <!-- Proximity Warning (Clarified Danger) -->
            <g id="proximity-group" opacity="0">
                <!-- Warning Arc -->
                <path d="M480,500 A 200,200 0 0,1 480,700" fill="none" stroke="var(--accent-danger)" stroke-width="3" stroke-dasharray="10 10" filter="url(#glow)" />
                <!-- Warning Text -->
                <text x="700" y="600" class="proximity-warning-text" fill="var(--accent-danger)" font-family="var(--font-ui)" font-size="16" font-weight="bold" letter-spacing="2" transform="rotate(90, 700, 600)">PROXIMITY WARNING</text>
            </g>
        </g>

        <!-- 5. The Parachutist (Right Third Focus) -->
        <g id="parachute-group" transform="translate(1200, 400)">
            
            <!-- Canopy (Segmented, 3D, Tension) -->
            <g id="canopy" filter="url(#dropShadow)">
                <!-- Main Canopy Shape -->
                <path d="M-300,0 C-300,-250 300,-250 300,0 C300,80 150,100 0,100 C-150,100 -300,80 -300,0 Z" fill="url(#canopyGrad)" />
                
                <!-- Canopy Ribs (Structural Detail - Gores) -->
                <g stroke="#64748b" stroke-width="2" opacity="0.4" fill="none">
                    <!-- Center Spine -->
                    <path d="M0,-230 L0,90" />
                    <!-- Left Gores -->
                    <path d="M-150,-240 C-150,-100 -150,0 -150,80" />
                    <path d="M-250,-180 C-250,-50 -250,0 -250,60" />
                    <!-- Right Gores -->
                    <path d="M150,-240 C150,-100 150,0 150,80" />
                    <path d="M250,-180 C250,-50 250,0 250,60" />
                </g>
                
                <!-- Bottom Hem Lines -->
                <path d="M-300,0 C-150,80 0,90 0,90" stroke="#0f172a" stroke-width="1" fill="none" opacity="0.5"/>
                <path d="M300,0 C150,80 0,90 0,90" stroke="#0f172a" stroke-width="1" fill="none" opacity="0.5"/>
            </g>

            <!-- Taut Harness Lines (Connecting structurally) -->
            <g stroke="#ffffff" stroke-width="1.5" opacity="0.9">
                <!-- Left Lines -->
                <line x1="-250" y1="60" x2="-20" y2="300" />
                <line x1="-150" y1="80" x2="-20" y2="300" />
                <line x1="-50" y1="90" x2="-20" y2="300" />
                <!-- Right Lines -->
                <line x1="250" y1="60" x2="20" y2="300" />
                <line x1="150" y1="80" x2="20" y2="300" />
                <line x1="50" y1="90" x2="20" y2="300" />
            </g>

            <!-- Human Figure (Dynamic Silhouette - Polished) -->
            <g id="human-figure">
                <!-- Harness Pack -->
                <rect x="-25" y="280" width="50" height="60" rx="4" fill="#020617" stroke="#334155" stroke-width="1" />
                
                <!-- Body Parts (Vector Shapes) -->
                <g stroke="none">
                    <!-- Legs (Splayed for balance) -->
                    <path d="M-12,340 C-12,380 -40,410 -35,450 C-30,455 -10,420 -12,380 Z" fill="#020617" />
                    <path d="M12,340 C12,380 40,410 35,450 C30,455 10,420 12,380 Z" fill="#020617" />
                    
                    <!-- Torso -->
                    <path d="M-18,280 L18,280 L12,345 L-12,345 Z" fill="#020617" />

                    <!-- Arms (Reaching out) -->
                    <path d="M-18,285 C-45,280 -65,260 -75,250 C-70,245 -50,265 -20,295 Z" fill="#020617" />
                    <path d="M18,285 C45,280 65,260 75,250 C70,245 50,265 20,295 Z" fill="#020617" />
                </g>
                
                <!-- Head -->
                <circle cx="0" cy="265" r="12" fill="#020617" />
                
                <!-- Rim Light on Figure (Separation) -->
                <path d="M-75,250 C-65,260 -45,280 -18,285 L-12,345 C-12,380 -40,410 -35,450 M 75,250 C65,260 45,280 18,285 L12,345 C12,380 40,410 35,450" stroke="#475569" stroke-width="1.5" fill="none" opacity="0.8" />
            </g>
        </g>
    </svg>

    <!-- UI OVERLAY -->
    <div class="ui-layer">
        
        <!-- Header -->
        <div class="header">
            <div class="title-group">
                <h1>Alpine Descent</h1>
                <p>Operation: Vertical // Sector 4</p>
            </div>
            
            <div class="data-strip">
                <div class="data-item">
                    <span class="data-label">Altitude</span>
                    <span class="data-value" id="val-alt">14,200 ft</span>
                </div>
                <div class="data-item">
                    <span class="data-label">Vert. Speed</span>
                    <span class="data-value" id="val-speed">-24.5 ft/s</span>
                </div>
                <div class="data-item">
                    <span class="data-label">Wind</span>
                    <span class="data-value">NW 12mph</span>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div>
                <span>SYS.ONLINE</span>
                <span style="margin-left: 1rem;">RENDER: SVG_CORE_V4</span>
            </div>
            <div>
                <span>COORD: 45.2° N, 12.4° E</span>
            </div>
        </div>

    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const svg = document.querySelector('.scene-svg');
        const windLayer = document.getElementById('wind-layer');
        const parachuteGroup = document.getElementById('parachute-group');
        const humanFigure = document.getElementById('human-figure');
        const proximityGroup = document.getElementById('proximity-group');
        
        // --- State ---
        let time = 0;
        let altitude = 14200;
        let windLines = [];

        // --- 1. Generate Wind Streaks ---
        // Sweeping, semi-transparent motion blurs (Diagonal)
        for(let i = 0; i < 60; i++) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            const x = Math.random() * 1600;
            const y = Math.random() * 900;
            const len = 150 + Math.random() * 300; // Longer streaks
            
            // Visual properties for depth
            const opacity = 0.05 + Math.random() * 0.2;
            const width = 1 + Math.random() * 2;

            line.setAttribute("x1", x);
            line.setAttribute("y1", y);
            line.setAttribute("x2", x + len);
            line.setAttribute("y2", y + (len * 0.3)); // Diagonal angle
            line.setAttribute("stroke-width", width);
            line.setAttribute("stroke", "#ffffff");
            line.setAttribute("opacity", opacity);
            line.setAttribute("stroke-linecap", "round");
            
            windLayer.appendChild(line);
            windLines.push({
                el: line,
                x: x,
                y: y,
                speed: 10 + Math.random() * 20, // Faster wind
                len: len
            });
        }

        // --- 2. Animation Loop ---
        function animate() {
            time += 0.015;

            // A. Parachute Physics Simulation
            // Smooth descent with rhythmic sway
            const swayX = Math.sin(time * 0.8) * 80; // Wider sway
            const bobY = Math.sin(time * 1.5) * 30;
            
            // Slow descent loop (visual only)
            const descentY = (time * 60) % 1200;
            
            // Base position: Right Third (x=1200)
            const baseX = 0; 
            const baseY = 0;

            // Apply transform to the whole group
            parachuteGroup.setAttribute('transform', `translate(${1200 + swayX}, ${400 + descentY + bobY})`);

            // B. Human Figure Micro-movement (Counter-balance)
            // The figure tilts slightly opposite to the sway to maintain balance
            const tilt = -swayX * 0.06; 
            humanFigure.setAttribute('transform', `rotate(${tilt}, 0, 300)`);

            // C. Wind Animation
            windLines.forEach(line => {
                line.x += line.speed;
                line.y += line.speed * 0.3; // Diagonal movement
                
                // Reset if off screen
                if(line.x > 1600) {
                    line.x = -line.len - (Math.random() * 200);
                    line.y = Math.random() * 900;
                }
                
                line.el.setAttribute("x1", line.x);
                line.el.setAttribute("y1", line.y);
                line.el.setAttribute("x2", line.x + line.len);
                line.el.setAttribute("y2", line.y + (line.len * 0.3));
            });

            // D. Proximity Warning Logic
            // Show warning when the parachute sways left (closer to cliff at x=400)
            // Parachute center is at 1200. Sway range is +/- 80.
            // Closest approach is 1200 - 80 = 1120.
            // Trigger warning when swayX < -60
            if (swayX < -60) {
                const opacity = Math.min(1, Math.abs(swayX + 60) / 20);
                proximityGroup.setAttribute("opacity", opacity);
                
                // Update UI Data
                document.getElementById('val-speed').classList.add('warn');
                document.getElementById('val-speed').style.color = 'var(--accent-danger)';
                document.getElementById('val-speed').innerText = "CAUTION";
            } else {
                proximityGroup.setAttribute("opacity", 0);
                document.getElementById('val-speed').style.color = 'var(--text-ui-primary)';
                // Varying speed value
                const speedVar = (Math.sin(time) * 0.5);
                document.getElementById('val-speed').innerText = (Math.abs(24.5 + speedVar)).toFixed(1) + " ft/s";
            }

            // E. Update HUD Data
            altitude -= 0.5;
            if(altitude < 13800) altitude = 14200; // Loop
            
            document.getElementById('val-alt').innerText = Math.floor(altitude).toLocaleString() + " ft";

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>

</body>
</html>
