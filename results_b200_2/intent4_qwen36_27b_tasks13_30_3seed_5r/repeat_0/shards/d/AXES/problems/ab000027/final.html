<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trifolium Repens — Specimen Study</title>
<style>
  :root {
    /* Palette: Earthy, muted, botanical */
    --bg-paper: #F4F1EA;
    --bg-paper-dark: #E8E4D9;
    --ink-main: #2C3328; /* Dark organic green-black */
    --ink-secondary: #566650; /* Muted green-grey */
    --ink-faint: #8A9685;
    --accent-study: #A63D2F; /* Dried ink red (used sparingly) */
    
    /* Typography */
    --font-serif: "Georgia", "Times New Roman", serif;
    --font-mono: "Courier New", Courier, monospace;
    --font-sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--bg-paper);
    /* Subtle paper texture via noise */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.06'/%3E%3C/svg%3E");
    color: var(--ink-main);
    font-family: var(--font-sans);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Layout: Full Canvas with Marginalia */
  .study-container {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 60px;
  }

  /* The Main SVG Illustration */
  .specimen-svg {
    width: 100%;
    height: 100%;
    max-width: 1200px;
    max-height: 1000px;
    z-index: 1;
    /* Subtle rotation for organic feel */
    transform: rotate(-2deg);
  }

  /* Scientific Marginalia (HTML overlays) */
  .marginalia {
    position: absolute;
    z-index: 2;
    pointer-events: none; /* Let clicks pass through to potential interactions */
  }

  /* Top Right: Header */
  .header-block {
    top: 80px;
    right: 80px;
    text-align: right;
    max-width: 300px;
  }

  .header-block h1 {
    font-family: var(--font-serif);
    font-size: 42px;
    font-weight: 400;
    font-style: italic;
    line-height: 1;
    color: var(--ink-main);
    margin-bottom: 12px;
    letter-spacing: -0.02em;
  }

  .header-block .subtitle {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-secondary);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border-top: 1px solid var(--ink-main);
    padding-top: 8px;
    display: inline-block;
  }

  /* Bottom Left: Data Table */
  .data-block {
    bottom: 80px;
    left: 80px;
    font-family: var(--font-mono);
    max-width: 280px;
  }

  .data-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 20px;
    row-gap: 12px;
    border-left: 1px solid var(--ink-main);
    padding-left: 16px;
  }

  .data-item {
    display: flex;
    flex-direction: column;
  }

  .data-label {
    font-size: 10px;
    color: var(--ink-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 2px;
  }

  .data-value {
    font-size: 14px;
    color: var(--ink-main);
    font-weight: 600;
    text-align: right; /* Align numbers */
  }

  /* Top Left: Specimen ID */
  .id-block {
    top: 80px;
    left: 80px;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.6;
    color: var(--ink-secondary);
    border: 1px solid var(--ink-main);
    padding: 12px 16px;
    background: rgba(244, 241, 234, 0.8); /* Slight paper mask */
    backdrop-filter: blur(2px);
  }

  .id-block strong {
    color: var(--ink-main);
    font-weight: 700;
    display: block;
    margin-bottom: 4px;
  }

  /* Scale Bar */
  .scale-container {
    position: absolute;
    bottom: 80px;
    right: 80px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }

  .scale-bar {
    width: 120px;
    height: 2px; /* Thicker line */
    background: var(--ink-main);
    position: relative;
  }

  .scale-bar::before, .scale-bar::after {
    content: '';
    position: absolute;
    width: 2px;
    height: 8px;
    background: var(--ink-main);
    top: -3px;
  }
  .scale-bar::before { left: 0; }
  .scale-bar::after { right: 0; }

  .scale-text {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-main);
    letter-spacing: 0.05em;
  }

  /* Responsive */
  @media (max-width: 1024px) {
    .study-container { padding: 40px; }
    .header-block { top: 40px; right: 40px; }
    .data-block { bottom: 40px; left: 40px; }
    .id-block { top: 40px; left: 40px; }
    .scale-container { bottom: 40px; right: 40px; }
    .header-block h1 { font-size: 32px; }
  }

  @media (max-width: 768px) {
    .study-container { display: block; overflow-y: auto; height: auto; }
    .specimen-svg { height: 60vh; margin-bottom: 40px; }
    .marginalia { position: relative; top: auto; bottom: auto; left: auto; right: auto; margin-bottom: 20px; text-align: center; }
    .header-block { border-bottom: 1px solid var(--ink-faint); padding-bottom: 20px; }
    .data-block { border-top: 1px solid var(--ink-faint); padding-top: 20px; text-align: left; }
    .data-grid { border-left: none; padding-left: 0; }
    .scale-container { align-items: center; margin-top: 20px; }
  }

</style>
</head>
<body>

<div class="study-container">

  <!-- Specimen ID Block -->
  <div class="marginalia id-block">
    <strong>NO. 042-B</strong>
    LOC: 51.5074° N, 0.1278° W<br>
    DATE: 14 JUN 2024<br>
    MEDIA: VECTOR / LINE
  </div>

  <!-- Main Header Block -->
  <div class="marginalia header-block">
    <h1>Trifolium<br>repens</h1>
    <div class="subtitle">White Clover</div>
  </div>

  <!-- 
    SVG Illustration 
    - Organic, asymmetrical leaflets
    - Complex gradients for volume
    - Refined vector serrations
  -->
  <svg class="specimen-svg" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Leaf Gradient: Left (Lighter) -->
      <linearGradient id="gradLeft" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#4A7A32"/>
        <stop offset="40%" stop-color="#7BA85A"/>
        <stop offset="80%" stop-color="#A8D08B"/>
        <stop offset="100%" stop-color="#C2E0A8"/>
      </linearGradient>

      <!-- Leaf Gradient: Right (Darker) -->
      <linearGradient id="gradRight" x1="100%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#2E5A1E"/>
        <stop offset="50%" stop-color="#558838"/>
        <stop offset="100%" stop-color="#88B860"/>
      </linearGradient>

      <!-- Leaf Gradient: Top (Mid-tone) -->
      <linearGradient id="gradTop" x1="50%" y1="100%" x2="50%" y2="0%">
        <stop offset="0%" stop-color="#3A6B3D"/>
        <stop offset="60%" stop-color="#6B9E5C"/>
        <stop offset="100%" stop-color="#98C78B"/>
      </linearGradient>

      <!-- Stem Gradient -->
      <linearGradient id="gradStem" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#2C3E30"/>
        <stop offset="50%" stop-color="#4A6B40"/>
        <stop offset="100%" stop-color="#6B9E5C"/>
      </linearGradient>

      <!-- Vein Filter for organic texture -->
      <filter id="veinRoughness">
        <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
      </filter>

      <!-- Soft Shadow for Depth -->
      <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
        <feDropShadow dx="4" dy="12" stdDeviation="10" flood-color="#1A2618" flood-opacity="0.15" />
      </filter>
    </defs>

    <g class="plant-group" filter="url(#softShadow)">
      
      <!-- Main Stem -->
      <path d="M 500 1100 
               C 490 950, 515 850, 505 700
               C 500 650, 510 600, 500 500"
            fill="none" stroke="url(#gradStem)" stroke-width="14" stroke-linecap="round"/>
      <!-- Stem Highlight (simulating cylinder) -->
      <path d="M 500 1100 
               C 490 950, 515 850, 505 700
               C 500 650, 510 600, 500 500"
            fill="none" stroke="#A8D08B" stroke-width="3" stroke-linecap="round" opacity="0.4" transform="translate(-4, 2)"/>

      <!-- Petioles -->
      <path d="M 500 500 C 470 480, 410 420, 340 350" fill="none" stroke="#3A6B3D" stroke-width="6" stroke-linecap="round"/>
      <path d="M 500 500 C 530 480, 590 420, 660 350" fill="none" stroke="#3A6B3D" stroke-width="6" stroke-linecap="round"/>
      <path d="M 500 500 C 490 440, 505 380, 500 280" fill="none" stroke="#3A6B3D" stroke-width="6" stroke-linecap="round"/>

      <!-- LEAFLET 1: LEFT (Asymmetrical) -->
      <g transform="translate(330, 330) rotate(-42)">
        <!-- Leaf Body with Serrations -->
        <path d="M 0 0 
                 C -8 -25, -35 -50, -28 -85 
                 C -32 -90, -38 -95, -35 -105
                 C -42 -115, -48 -125, -42 -135
                 C -50 -150, -45 -175, -30 -205
                 C -15 -225, 0 -240, 0 -240
                 C 0 -240, 18 -225, 32 -205
                 C 48 -175, 52 -150, 45 -135
                 C 40 -125, 35 -115, 28 -105
                 C 25 -95, 18 -90, 12 -85
                 C 15 -50, 8 -25, 0 0 Z"
              fill="url(#gradLeft)"/>
        
        <!-- Veins -->
        <g fill="none" stroke="#1E3F20" stroke-linecap="round" opacity="0.4" filter="url(#veinRoughness)">
          <path d="M 0 10 C 0 -60, -5 -140, 0 -230" stroke-width="2"/>
          <!-- Lateral Veins -->
          <path d="M -2 -50 C -25 -55, -35 -70, -35 -80" stroke-width="1.5"/>
          <path d="M 3 -50 C 25 -55, 35 -70, 35 -80" stroke-width="1.5"/>
          <path d="M -3 -100 C -28 -105, -38 -120, -38 -135" stroke-width="1.5"/>
          <path d="M 4 -100 C 28 -105, 38 -120, 38 -135" stroke-width="1.5"/>
          <path d="M -2 -160 C -15 -165, -20 -180, -20 -190" stroke-width="1.5"/>
          <path d="M 3 -160 C 15 -165, 20 -180, 20 -190" stroke-width="1.5"/>
        </g>

        <!-- Blanch (V-Blotch) - Translucent -->
        <path d="M -12 -70 Q 0 -50 12 -70 Q 0 -100 -12 -70" fill="#FFFFFF" opacity="0.35"/>
      </g>

      <!-- LEAFLET 2: RIGHT (Asymmetrical) -->
      <g transform="translate(670, 330) rotate(38)">
        <path d="M 0 0 
                 C -8 -25, -35 -50, -28 -85 
                 C -32 -90, -38 -95, -35 -105
                 C -42 -115, -48 -125, -42 -135
                 C -50 -150, -45 -175, -30 -205
                 C -15 -225, 0 -240, 0 -240
                 C 0 -240, 18 -225, 32 -205
                 C 48 -175, 52 -150, 45 -135
                 C 40 -125, 35 -115, 28 -105
                 C 25 -95, 18 -90, 12 -85
                 C 15 -50, 8 -25, 0 0 Z"
              fill="url(#gradRight)"/>
        
        <!-- Veins -->
        <g fill="none" stroke="#1E3F20" stroke-linecap="round" opacity="0.4" filter="url(#veinRoughness)">
          <path d="M 0 10 C 0 -60, -5 -140, 0 -230" stroke-width="2"/>
          <path d="M -2 -50 C -25 -55, -35 -70, -35 -80" stroke-width="1.5"/>
          <path d="M 3 -50 C 25 -55, 35 -70, 35 -80" stroke-width="1.5"/>
          <path d="M -3 -100 C -28 -105, -38 -120, -38 -135" stroke-width="1.5"/>
          <path d="M 4 -100 C 28 -105, 38 -120, 38 -135" stroke-width="1.5"/>
          <path d="M -2 -160 C -15 -165, -20 -180, -20 -190" stroke-width="1.5"/>
          <path d="M 3 -160 C 15 -165, 20 -180, 20 -190" stroke-width="1.5"/>
        </g>

        <!-- Blanch -->
        <path d="M -12 -70 Q 0 -50 12 -70 Q 0 -100 -12 -70" fill="#FFFFFF" opacity="0.35"/>
      </g>

      <!-- LEAFLET 3: TOP (Larger) -->
      <g transform="translate(500, 260) rotate(2)">
        <path d="M 0 0 
                 C -10 -30, -40 -60, -35 -95 
                 C -38 -100, -45 -105, -42 -115
                 C -50 -130, -55 -140, -50 -150
                 C -55 -170, -50 -200, -35 -230
                 C -20 -250, 0 -270, 0 -270
                 C 0 -270, 20 -250, 35 -230
                 C 50 -200, 55 -170, 50 -150
                 C 55 -140, 50 -130, 42 -115
                 C 45 -105, 38 -100, 35 -95
                 C 40 -60, 10 -30, 0 0 Z"
              fill="url(#gradTop)"/>
        
        <!-- Veins -->
        <g fill="none" stroke="#1E3F20" stroke-linecap="round" opacity="0.4" filter="url(#veinRoughness)">
          <path d="M 0 10 C 0 -70, -5 -160, 0 -260" stroke-width="2.5"/>
          <path d="M -2 -60 C -30 -65, -40 -80, -42 -90" stroke-width="2"/>
          <path d="M 3 -60 C 30 -65, 40 -80, 42 -90" stroke-width="2"/>
          <path d="M -3 -120 C -35 -125, -45 -140, -45 -155" stroke-width="2"/>
          <path d="M 4 -120 C 35 -125, 45 -140, 45 -155" stroke-width="2"/>
          <path d="M -2 -180 C -20 -185, -25 -200, -25 -210" stroke-width="2"/>
          <path d="M 3 -180 C 20 -185, 25 -200, 25 -210" stroke-width="2"/>
        </g>

        <!-- Blanch -->
        <path d="M -20 -80 Q 0 -60 20 -80 Q 0 -110 -20 -80" fill="#FFFFFF" opacity="0.35"/>
      </g>

      <!-- Stipules (Leaf-like structures at base of petiole) -->
      <path d="M 492 505 C 480 520, 470 540, 482 545 C 488 540, 492 525, 492 515 Z" fill="#3A6B3D" opacity="0.9"/>
      <path d="M 508 505 C 520 520, 530 540, 518 545 C 512 540, 508 525, 508 515 Z" fill="#3A6B3D" opacity="0.9"/>

    </g>

    <!-- Annotations: Clean, authoritative lines -->
    <g stroke="#A63D2F" stroke-width="1.5" opacity="0.8">
      <!-- To Top Leaflet -->
      <path d="M 500 120 L 500 60 L 620 60" fill="none"/>
      <circle cx="500" cy="120" r="3" fill="#A63D2F"/>
      
      <!-- To Left Leaflet Margin -->
      <path d="M 290 230 L 230 190 L 160 190" fill="none"/>
      <circle cx="290" cy="230" r="3" fill="#A63D2F"/>

      <!-- To Left Leaflet Base (Blotch) -->
      <path d="M 320 310 L 250 360 L 180 360" fill="none"/>
      <circle cx="320" cy="310" r="3" fill="#A63D2F"/>
    </g>

    <!-- Annotation Labels -->
    <g font-family="var(--font-mono)" font-size="12" fill="#2C3328" letter-spacing="0.05em" font-weight="600">
      <text x="630" y="64">TRIFOLIATE LEAF</text>
      <text x="150" y="194" text-anchor="end">SERRULATE MARGIN</text>
      <text x="170" y="364" text-anchor="end">V-BLOTCH</text>
    </g>

  </svg>

  <!-- Data Block (Bottom Left) -->
  <div class="marginalia data-block">
    <div class="data-grid">
      <div class="data-item">
        <span class="data-label">Leaflet Len</span>
        <span class="data-value">32.4 mm</span>
      </div>
      <div class="data-item">
        <span class="data-label">Leaflet Wid</span>
        <span class="data-value">28.1 mm</span>
      </div>
      <div class="data-item">
        <span class="data-label">Petiole</span>
        <span class="data-value">87.6 mm</span>
      </div>
      <div class="data-item">
        <span class="data-label">Serration</span>
        <span class="data-value">8–12 / side</span>
      </div>
    </div>
  </div>

  <!-- Scale Bar (Bottom Right) -->
  <div class="scale-container">
    <div class="scale-bar"></div>
    <div class="scale-text">2.0 cm</div>
  </div>

</div>

<script>
  // Subtle Parallax Effect for "Living" feel
  const plantGroup = document.querySelector('.plant-group');
  const container = document.querySelector('.study-container');

  if (container && plantGroup) {
    document.addEventListener('mousemove', (e) => {
      const rect = container.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      
      // Mouse position relative to center (-1 to 1)
      const dx = (e.clientX - cx) / (rect.width / 2);
      const dy = (e.clientY - cy) / (rect.height / 2);
      
      // Very subtle rotation and translation
      // Using CSS transform on the SVG group
      const rotateY = dx * 5; // Max 5deg
      const rotateX = -dy * 5;
      const translateX = dx * 15;
      const translateY = dy * 15;
      
      plantGroup.style.transform = `perspective(1000px) rotateY(${rotateY}deg) rotateX(${rotateX}deg) translate(${translateX}px, ${translateY}px)`;
    });

    // Reset smoothly on mouse leave
    document.addEventListener('mouseleave', () => {
      plantGroup.style.transition = 'transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)';
      plantGroup.style.transform = 'perspective(1000px) rotateY(0deg) rotateX(0deg) translate(0, 0)';
      setTimeout(() => { plantGroup.style.transition = ''; }, 600);
    });
  }
</script>
</body>
</html>
