<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARLORD Social Interface</title>
    <style>
        :root {
            /* Palette: Deep Space & Neon Energy */
            --bg-app: #05070a;
            --bg-panel: #0f1219;
            --bg-surface: #161b26;
            --bg-surface-hover: #1e2538;
            
            /* Primary Actions */
            --color-gold: #fbbf24; 
            --color-gold-dim: rgba(251, 191, 36, 0.15);
            --color-gold-glow: rgba(251, 191, 36, 0.4);
            
            /* Battle/Conflict */
            --color-ruby: #ef4444;
            --color-ruby-dark: #991b1b;
            
            /* Statuses */
            --color-neon-green: #10b981;
            --color-cyan: #06b6d4;
            --color-purple: #8b5cf6;

            /* Text */
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-disabled: #475569;

            /* Geometry */
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-av: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body {
            background-color: var(--bg-app);
            color: var(--text-primary);
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* Subtle noise texture */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
        }

        /* --- App Layout --- */
        .app-container {
            width: 1440px;
            height: 900px;
            background: var(--bg-app);
            border-radius: var(--radius-lg);
            box-shadow: 0 0 0 1px #1e293b, 0 20px 50px -10px rgba(0,0,0,0.9);
            display: grid;
            grid-template-columns: 320px 1fr 360px;
            grid-template-rows: 80px 1fr;
            overflow: hidden;
            border: 1px solid #1e293b;
            position: relative;
        }

        /* --- 1. Header (User Profile) --- */
        .app-header {
            grid-column: 1 / -1;
            background: var(--bg-panel);
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 50;
            /* Subtle ambient light behind header */
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--color-gold), #b45309);
            border-radius: var(--radius-sm);
            display: grid;
            place-items: center;
            box-shadow: 0 0 15px var(--color-gold-dim);
            transform: skewX(-10deg);
            color: #000;
        }

        .brand-text {
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 4px;
            color: var(--text-primary);
            text-transform: uppercase;
            transform: skewX(-10deg);
            text-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        /* User Profile Header - Distinct & Clear */
        .user-profile-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 16px 8px 8px;
            background: var(--bg-surface);
            border-radius: var(--radius-av);
            border: 1px solid #1e293b;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
            transition: transform 0.2s;
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            border: 2px solid var(--color-gold);
            overflow: hidden;
            box-shadow: 0 0 15px var(--color-gold-dim);
            background: #000;
        }
        
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .user-info { display: flex; flex-direction: column; }
        .user-name { font-size: 16px; font-weight: 700; color: var(--text-primary); letter-spacing: 0.5px; }
        .user-rank { 
            font-size: 12px; 
            font-weight: 700; 
            color: var(--color-gold); 
            text-transform: uppercase; 
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .user-rank::before {
            content: '';
            display: block;
            width: 6px;
            height: 6px;
            background: var(--color-neon-green);
            border-radius: 50%;
            box-shadow: 0 0 5px var(--color-neon-green);
        }

        /* --- 2. Sidebar (Friends) --- */
        .sidebar {
            background: var(--bg-panel);
            border-right: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        /* Requests Panel */
        .requests-panel {
            padding: 24px;
            background: linear-gradient(to bottom, rgba(239, 68, 68, 0.05), transparent);
            border-bottom: 1px solid #1e293b;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            font-weight: 800;
        }

        .badge-count {
            background: var(--color-ruby);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .request-card {
            background: var(--bg-surface);
            border: 1px solid #1e293b;
            border-radius: var(--radius-md);
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
        }
        
        /* Red accent bar on left */
        .request-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0; width: 4px;
            background: var(--color-ruby);
            box-shadow: 0 0 10px var(--color-ruby);
        }

        .req-avatar {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            background: #000;
            flex-shrink: 0;
            border: 1px solid #1e293b;
        }

        .req-info { flex: 1; }
        .req-name { font-size: 14px; font-weight: 700; color: var(--text-primary); }
        .req-detail { font-size: 11px; color: var(--text-secondary); }

        .req-actions { display: flex; gap: 8px; }
        
        .btn-action-sm {
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: none;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 0.5px;
        }
        
        .btn-accept { 
            background: var(--color-neon-green); 
            color: #000; 
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }
        .btn-accept:hover { 
            background: #34d399; 
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); 
            transform: translateY(-1px);
        }
        
        .btn-decline { 
            background: transparent; 
            border: 1px solid #334155; 
            color: var(--text-secondary); 
        }
        .btn-decline:hover { 
            border-color: var(--text-secondary); 
            color: var(--text-primary); 
            background: rgba(255,255,255,0.05);
        }

        /* Search & Add */
        .search-area {
            padding: 24px;
            border-bottom: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .search-input-wrap {
            position: relative;
        }

        .search-input {
            width: 100%;
            background: var(--bg-app);
            border: 1px solid #1e293b;
            padding: 12px 14px 12px 40px;
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 13px;
            transition: all 0.2s;
            font-weight: 500;
        }
        
        .search-input:focus { 
            border-color: var(--color-gold); 
            box-shadow: 0 0 0 2px var(--color-gold-dim);
        }
        
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-disabled);
            pointer-events: none;
        }

        .btn-add {
            width: 100%;
            background: var(--bg-surface);
            border: 1px solid #1e293b;
            color: var(--text-secondary);
            padding: 10px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-add:hover { 
            background: var(--bg-surface-hover); 
            border-color: var(--text-secondary); 
            color: var(--text-primary); 
        }

        /* Friends List */
        .friends-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            scrollbar-width: thin;
            scrollbar-color: #1e293b var(--bg-panel);
        }

        .friend-item {
            display: flex;
            align-items: center;
            padding: 14px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 8px;
            border: 1px solid transparent;
            position: relative;
        }

        .friend-item:hover { background: var(--bg-surface); }

        /* Selected State - Solid background */
        .friend-item.active {
            background: var(--bg-surface);
            border-color: var(--color-gold);
            box-shadow: 0 0 0 1px var(--color-gold), 0 4px 12px rgba(0,0,0,0.3);
        }

        .friend-item.active .friend-name { color: var(--color-gold); }
        .friend-item.active .friend-status { color: var(--color-gold); opacity: 0.8; }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            margin-right: 14px;
            background: #000;
            border: 1px solid #1e293b;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }
        
        /* Status Frames */
        .avatar-frame {
            position: absolute;
            inset: -1px;
            border-radius: var(--radius-md);
            pointer-events: none;
            z-index: 2;
        }
        .status-in-game .avatar-frame {
            border: 2px solid var(--color-neon-green);
            box-shadow: inset 0 0 10px rgba(16, 185, 129, 0.2);
        }

        .friend-info { flex: 1; }
        .friend-name { font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 2px; }
        .friend-status { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
        
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-disabled); }
        .status-online .status-dot { background: var(--color-neon-green); box-shadow: 0 0 5px var(--color-neon-green); }
        .status-lobby .status-dot { background: var(--color-cyan); box-shadow: 0 0 5px var(--color-cyan); }
        .status-afk .status-dot { background: var(--color-gold); }

        /* --- 3. Main Stage (Visual Context) --- */
        .main-stage {
            background: radial-gradient(circle at 50% 50%, #161b26 0%, #05070a 70%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Subtle Grid */
        .floor-grid {
            position: absolute;
            inset: 0;
            background: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
            pointer-events: none;
        }

        /* Party Roster Visualization */
        .party-roster {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Connection Lines (SVG) - De-emphasized */
        .connections-svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.4; /* Demoted visual weight */
        }
        
        .connection-line {
            stroke: var(--color-purple);
            stroke-width: 2;
            stroke-opacity: 0.5;
            stroke-dasharray: 5;
            animation: dash-flow 15s linear infinite;
        }

        .connection-line.active {
            stroke: var(--color-gold);
            stroke-opacity: 0.8;
            stroke-dasharray: none;
            filter: drop-shadow(0 0 3px var(--color-gold));
        }

        /* Slots Layout */
        .slots-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .slot-card {
            width: 100px;
            height: 100px;
            background: rgba(15, 18, 25, 0.9);
            border: 1px solid #1e293b;
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(4px);
        }
        
        .slot-card:hover { 
            transform: scale(1.1); 
            border-color: var(--text-primary); 
            z-index: 10;
        }

        /* Leader Slot */
        .slot-leader {
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 130px; height: 130px;
        }
        
        .slot-leader .slot-card {
            border: 2px solid var(--color-gold);
            box-shadow: 0 0 30px var(--color-gold-dim);
            background: rgba(251, 191, 36, 0.05);
        }
        
        .slot-leader .slot-card::after {
            content: 'LEADER';
            position: absolute;
            bottom: -24px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--color-gold);
            text-shadow: 0 0 10px var(--color-gold);
        }

        /* Member Slots */
        .slot-member { width: 100px; height: 100px; }
        .pos-1 { top: 15%; left: 50%; transform: translateX(-50%); }
        .pos-2 { bottom: 20%; left: 25%; }
        .pos-3 { bottom: 20%; right: 25%; }

        .slot-avatar {
            width: 70%;
            height: 70%;
            border-radius: var(--radius-sm);
            overflow: hidden;
            margin-bottom: 8px;
            border: 1px solid #1e293b;
        }
        
        .slot-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .slot-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-secondary);
            z-index: 2;
        }

        /* Empty Slot */
        .slot-empty {
            bottom: 5%; left: 50%; transform: translateX(-50%);
        }
        .slot-empty .slot-card {
            border: 2px dashed #334155;
            background: rgba(255,255,255,0.02);
        }
        .slot-empty .slot-card:hover {
            border-color: var(--color-purple);
            background: rgba(139, 92, 246, 0.1);
        }
        .empty-icon { font-size: 20px; color: #334155; margin-bottom: 4px; }

        /* --- 4. Right Detail Panel (Friend Focus) --- */
        .detail-panel {
            background: var(--bg-panel);
            border-left: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Header Background Gradient */
        .detail-header-bg {
            height: 200px;
            background: linear-gradient(to bottom, rgba(139, 92, 246, 0.15), transparent);
            position: absolute;
            top: 0; left: 0; right: 0;
            pointer-events: none;
        }

        .detail-content {
            padding: 32px;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .detail-profile {
            text-align: center;
            margin-bottom: 32px;
            margin-top: 20px;
        }

        .detail-avatar-wrap {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            position: relative;
        }

        .detail-avatar {
            width: 100%;
            height: 100%;
            border-radius: var(--radius-lg);
            border: 3px solid var(--bg-panel);
            box-shadow: 0 0 0 2px var(--color-purple), 0 10px 30px rgba(0,0,0,0.5);
            object-fit: cover;
        }

        .detail-name { 
            font-size: 28px; 
            font-weight: 800; 
            color: var(--text-primary); 
            letter-spacing: -0.5px; 
            margin-bottom: 6px;
        }
        .detail-tag { 
            color: var(--text-secondary); 
            font-size: 14px; 
            font-weight: 500; 
        }

        /* Social Context Section */
        .social-context {
            margin-bottom: 32px;
        }
        
        .context-label {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-disabled);
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-align: center;
        }

        .context-row {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .pill {
            padding: 8px 16px;
            background: var(--bg-surface);
            border: 1px solid #1e293b;
            border-radius: 24px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .pill.mutual { border-color: var(--color-purple); color: var(--color-purple); background: rgba(139, 92, 246, 0.1); }

        /* Actions - The "Command" Area */
        .detail-actions {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            /* Perspective for 3D buttons */
            perspective: 1000px;
        }

        .action-btn {
            width: 100%;
            padding: 18px;
            border-radius: var(--radius-md);
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            overflow: hidden;
        }

        /* Battle Button - Aggressive, High Contrast */
        .action-battle {
            background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%);
            color: #fff;
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4), inset 0 1px 0 rgba(255,255,255,0.2);
            /* Tech Aggressive Shape */
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            transform: translateZ(0);
        }
        .action-battle:hover { 
            transform: translateY(-2px) scale(1.02); 
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.6);
            filter: brightness(1.1);
        }
        .action-battle:active { transform: translateY(1px); }
        
        /* Invite to Game - Primary, Friendly */
        .action-game {
            background: var(--color-gold);
            color: #000;
            box-shadow: 0 6px 20px var(--color-gold-dim);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
        }
        .action-game:hover { 
            transform: translateY(-2px) scale(1.02); 
            box-shadow: 0 10px 30px var(--color-gold-dim);
            background: #fcd34d;
        }

        /* Chat - Secondary */
        .action-chat {
            background: transparent;
            border: 1px solid #1e293b;
            color: var(--text-secondary);
        }
        .action-chat:hover { 
            background: var(--bg-surface); 
            border-color: var(--text-secondary); 
            color: var(--text-primary); 
        }

        /* Animations */
        @keyframes dash-flow {
            to { stroke-dashoffset: -100; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- 1. Header -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-logo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/>
                    </svg>
                </div>
                <span class="brand-text">Warlord</span>
            </div>

            <!-- Distinct Player Profile Header -->
            <div class="user-profile-header">
                <div class="user-info">
                    <div class="user-name">Commander_X</div>
                    <div class="user-rank">Lvl 99 • Warlord</div>
                </div>
                <div class="user-avatar">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23231d2b'/%3E%3Cpath d='M20,80 Q50,20 80,80' stroke='%23fbbf24' stroke-width='8' fill='none'/%3E%3Ccircle cx='50' cy='50' r='10' fill='%23fbbf24'/%3E%3C/svg%3E">
                </div>
            </div>
        </header>

        <!-- 2. Sidebar (Friends) -->
        <aside class="sidebar">
            <!-- Requests Panel -->
            <div class="requests-panel">
                <div class="section-header">
                    <div class="section-label">Incoming Requests</div>
                    <div class="badge-count">1</div>
                </div>
                <div class="request-card">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ef4444'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E?%3C/text%3E%3C/svg%3E" class="req-avatar">
                    <div class="req-info">
                        <div class="req-name">TankMaster</div>
                        <div class="req-detail">Level 45 • 2h ago</div>
                    </div>
                    <div class="req-actions">
                        <button class="btn-action-sm btn-accept">Accept</button>
                        <button class="btn-action-sm btn-decline">Decline</button>
                    </div>
                </div>
            </div>

            <!-- Search & Add -->
            <div class="search-area">
                <div class="search-input-wrap">
                    <span class="search-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </span>
                    <input type="text" class="search-input" placeholder="Search friends...">
                </div>
                <button class="btn-add">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Add Friend
                </button>
            </div>

            <!-- Friends List -->
            <div class="friends-scroll-area">
                <div class="section-label" style="margin: 10px 10px 5px;">Online — 4</div>
                
                <!-- Friend 1 (Active) -->
                <div class="friend-item active status-in-game" onclick="selectFriend(this, 'Viper')">
                    <div class="avatar">
                        <div class="avatar-frame"></div>
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2310b981'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E">
                    </div>
                    <div class="friend-info">
                        <div class="friend-name">Viper</div>
                        <div class="friend-status">
                            <span class="status-dot"></span> In Game: Arena
                        </div>
                    </div>
                </div>

                <!-- Friend 2 -->
                <div class="friend-item status-lobby" onclick="selectFriend(this, 'Nova')">
                    <div class="avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23fbbf24'/%3E%3Ccircle cx='50' cy='50' r='20' fill='white'/%3E%3C/svg%3E">
                    </div>
                    <div class="friend-info">
                        <div class="friend-name">Nova</div>
                        <div class="friend-status">
                            <span class="status-dot"></span> In Lobby
                        </div>
                    </div>
                </div>

                <!-- Friend 3 -->
                <div class="friend-item status-afk" onclick="selectFriend(this, 'Kael')">
                    <div class="avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%238b5cf6'/%3E%3Cpath d='M30,30 L70,70 M70,30 L30,70' stroke='white' stroke-width='8'/%3E%3C/svg%3E">
                    </div>
                    <div class="friend-info">
                        <div class="friend-name">Kael</div>
                        <div class="friend-status">
                            <span class="status-dot"></span> AFK
                        </div>
                    </div>
                </div>
                
                <!-- Friend 4 -->
                <div class="friend-item status-online" onclick="selectFriend(this, 'Rex')">
                    <div class="avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2306b6d4'/%3E%3Crect x='30' y='30' width='40' height='40' fill='white'/%3E%3C/svg%3E">
                    </div>
                    <div class="friend-info">
                        <div class="friend-name">Rex</div>
                        <div class="friend-status">
                            <span class="status-dot"></span> Trading
                        </div>
                    </div>
                </div>

                <div class="section-label" style="margin: 24px 10px 5px;">Offline — 12</div>
                <div class="friend-item">
                    <div class="avatar" style="opacity: 0.5; filter: grayscale(100%);">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23475569'/%3E%3C/svg%3E">
                    </div>
                    <div class="friend-info">
                        <div class="friend-name" style="opacity: 0.6;">Rogue_One</div>
                        <div class="friend-status">Offline 2h</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 3. Main Stage (Party Visuals) -->
        <main class="main-stage">
            <div class="floor-grid"></div>
            
            <div class="party-roster">
                <!-- SVG Connections -->
                <svg class="connections-svg" viewBox="0 0 700 500" preserveAspectRatio="none">
                    <!-- Lines from Leader (350, 250) to Members -->
                    <line x1="350" y1="250" x2="350" y2="100" class="connection-line active" /> <!-- Top -->
                    <line x1="350" y1="250" x2="200" y2="400" class="connection-line active" /> <!-- Bottom Left -->
                    <line x1="350" y1="250" x2="500" y2="400" class="connection-line active" /> <!-- Bottom Right -->
                    <!-- Line to Empty Slot -->
                    <line x1="350" y1="250" x2="350" y2="450" class="connection-line" />
                </svg>

                <div class="slots-container">
                    <!-- Leader Node -->
                    <div class="slot-leader">
                        <div class="slot-card">
                            <div class="slot-avatar">
                                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23231d2b'/%3E%3Cpath d='M20,80 Q50,20 80,80' stroke='%23fbbf24' stroke-width='8' fill='none'/%3E%3Ccircle cx='50' cy='50' r='10' fill='%23fbbf24'/%3E%3C/svg%3E">
                            </div>
                            <div class="slot-label">You</div>
                        </div>
                    </div>

                    <!-- Squad Members -->
                    <div class="slot-member pos-1">
                        <div class="slot-card">
                            <div class="slot-avatar">
                                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2310b981'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E">
                            </div>
                            <div class="slot-label">Viper</div>
                        </div>
                    </div>
                    <div class="slot-member pos-2">
                        <div class="slot-card">
                            <div class="slot-avatar">
                                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23fbbf24'/%3E%3Ccircle cx='50' cy='50' r='20' fill='white'/%3E%3C/svg%3E">
                            </div>
                            <div class="slot-label">Nova</div>
                        </div>
                    </div>
                    <div class="slot-member pos-3">
                        <div class="slot-card">
                            <div class="slot-avatar">
                                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%238b5cf6'/%3E%3Cpath d='M30,30 L70,70 M70,30 L30,70' stroke='white' stroke-width='8'/%3E%3C/svg%3E">
                            </div>
                            <div class="slot-label">Kael</div>
                        </div>
                    </div>
                    
                    <!-- Empty Slot -->
                    <div class="slot-member slot-empty">
                        <div class="slot-card">
                            <div class="empty-icon">+</div>
                            <div class="slot-label">Invite</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- 4. Right Detail Panel (Friend Focus) -->
        <aside class="detail-panel">
            <div class="detail-header-bg"></div>
            
            <div class="detail-content">
                <div class="detail-profile">
                    <div class="detail-avatar-wrap">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2310b981'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E" class="detail-avatar">
                    </div>
                    <div class="detail-name">Viper</div>
                    <div class="detail-tag">#8492 • In Game: Arena</div>
                </div>

                <!-- Social Context -->
                <div class="social-context">
                    <div class="context-label">Connection Stats</div>
                    <div class="context-row">
                        <div class="pill mutual">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                            4 Mutual
                        </div>
                        <div class="pill">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                            12 Games
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="detail-actions">
                    <!-- Battle (High Priority) -->
                    <button class="action-btn action-battle">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"></path><path d="M13 19l6-6"></path><path d="M16 16l4 4"></path><path d="M19 21l2-2"></path></svg>
                        Challenge to Battle
                    </button>
                    
                    <!-- Invite to Game (Primary) -->
                    <button class="action-btn action-game">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        Invite to Game
                    </button>

                    <!-- Chat (Secondary) -->
                    <button class="action-btn action-chat">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        Send Message
                    </button>
                </div>
            </div>
        </aside>

    </div>

    <script>
        // Data Store
        const friends = {
            'Viper': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2310b981'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E",
                name: "Viper",
                tag: "#8492 • In Game: Arena",
                mutual: 4, games: 12
            },
            'Nova': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23fbbf24'/%3E%3Ccircle cx='50' cy='50' r='20' fill='white'/%3E%3C/svg%3E",
                name: "Nova",
                tag: "#1102 • In Lobby",
                mutual: 1, games: 5
            },
            'Kael': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%238b5cf6'/%3E%3Cpath d='M30,30 L70,70 M70,30 L30,70' stroke='white' stroke-width='8'/%3E%3C/svg%3E",
                name: "Kael",
                tag: "#9921 • AFK",
                mutual: 8, games: 45
            },
            'Rex': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2306b6d4'/%3E%3Crect x='30' y='30' width='40' height='40' fill='white'/%3E%3C/svg%3E",
                name: "Rex",
                tag: "#3341 • Trading",
                mutual: 0, games: 2
            }
        };

        function selectFriend(element, name) {
            // Handle Active State
            document.querySelectorAll('.friend-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            // Update Right Panel
            const data = friends[name];
            if(data) {
                const panel = document.querySelector('.detail-content');
                
                // Fade transition
                panel.style.opacity = '0';
                panel.style.transform = 'translateY(10px)';
                panel.style.transition = 'all 0.2s ease-out';
                
                setTimeout(() => {
                    document.querySelector('.detail-avatar').src = data.img;
                    document.querySelector('.detail-name').textContent = data.name;
                    document.querySelector('.detail-tag').textContent = data.tag;
                    
                    // Update Social Context
                    const mutualPill = document.querySelector('.pill.mutual');
                    mutualPill.innerHTML = `
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                        ${data.mutual} Mutual
                    `;
                    const gamesPill = document.querySelector('.pill:last-child');
                    gamesPill.innerHTML = `
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                        ${data.games} Games
                    `;

                    panel.style.opacity = '1';
                    panel.style.transform = 'translateY(0)';
                }, 200);
            }
        }
    </script>
</body>
</html>
