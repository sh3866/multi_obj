<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARLORD Social Interface</title>
    <style>
        :root {
            /* Palette: Deep, warm, industrial */
            --bg-deep: #0f0c14;
            --bg-panel: #181320;
            --bg-card: #231d2b;
            --bg-card-hover: #2e2638;
            
            --accent-primary: #d97706; /* Amber Gold */
            --accent-glow: rgba(217, 119, 6, 0.4);
            --accent-secondary: #7c3aed; /* Electric Violet */
            --accent-danger: #ef4444; /* Red */
            --accent-success: #10b981; /* Green */
            
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #475569;
            
            --border-base: #332b40;
            --border-highlight: #5b4d70;

            /* Typography */
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            /* Geometry */
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 24px; /* Avatars */
            --radius-xl: 32px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body {
            background-color: #000;
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* Subtle Noise Texture */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }

        /* --- Main App Container --- */
        .app-container {
            width: 1440px;
            height: 900px;
            background: var(--bg-deep);
            border-radius: var(--radius-xl);
            box-shadow: 0 0 0 1px var(--border-base), 0 50px 100px -20px rgba(0,0,0,0.9);
            display: grid;
            grid-template-columns: 320px 1fr 360px;
            grid-template-rows: 80px 1fr;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--border-base);
        }

        /* --- 1. Header (User Profile) --- */
        .app-header {
            grid-column: 1 / -1;
            background: rgba(24, 19, 32, 0.95);
            border-bottom: 1px solid var(--border-base);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 20;
            backdrop-filter: blur(10px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-primary), #b45309);
            border-radius: var(--radius-sm);
            display: grid;
            place-items: center;
            box-shadow: 0 0 15px var(--accent-glow);
            clip-path: polygon(10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%, 0 10%);
        }

        .brand-text {
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 2px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        /* User Profile Header - Full Context */
        .user-profile-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 16px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-base);
            position: relative;
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-lg);
            border: 2px solid var(--accent-secondary);
            overflow: hidden;
        }
        
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .user-rank {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-success);
            box-shadow: 0 0 8px var(--accent-success);
            margin-top: 4px;
            margin-left: auto;
        }

        /* --- 2. Sidebar (Friends & Requests) --- */
        .sidebar {
            background: var(--bg-panel);
            border-right: 1px solid var(--border-base);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        /* Requests Panel (Moved to Top) */
        .requests-panel {
            padding: 20px;
            background: rgba(239, 68, 68, 0.03);
            border-bottom: 1px solid var(--border-base);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            font-weight: 800;
        }

        .badge-count {
            background: var(--accent-danger);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 10px;
        }

        .request-card {
            background: var(--bg-card);
            border: 1px solid var(--border-base);
            border-radius: var(--radius-md);
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        .req-avatar {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            background: #000;
            flex-shrink: 0;
        }

        .req-info { flex: 1; }
        .req-name { font-size: 14px; font-weight: 600; }
        .req-detail { font-size: 11px; color: var(--text-muted); }

        .req-actions { display: flex; gap: 8px; }
        
        .btn-icon {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            border: none;
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(255,255,255,0.05);
            color: var(--text-muted);
        }
        
        .btn-icon:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }
        .btn-accept:hover { background: rgba(16, 185, 129, 0.2); color: var(--accent-success); }
        .btn-decline:hover { background: rgba(239, 68, 68, 0.2); color: var(--accent-danger); }

        /* Search & Add */
        .search-area {
            padding: 20px;
            border-bottom: 1px solid var(--border-base);
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            background: var(--bg-deep);
            border: 1px solid var(--border-base);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 13px;
        }
        
        .search-input:focus { border-color: var(--accent-primary); }

        .btn-add {
            background: var(--bg-card);
            border: 1px solid var(--border-base);
            color: var(--text-main);
            width: 42px;
            border-radius: var(--radius-md);
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .btn-add:hover { background: var(--bg-card-hover); border-color: var(--text-muted); }

        /* Friends List */
        .friends-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px;
            scrollbar-width: thin;
            scrollbar-color: var(--bg-card) var(--bg-panel);
        }

        .friend-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
            border: 1px solid transparent;
            position: relative;
        }

        .friend-item:hover { background: var(--bg-card); }

        .friend-item.active {
            background: linear-gradient(90deg, rgba(217, 119, 6, 0.1), transparent);
            border-color: rgba(217, 119, 6, 0.3);
        }

        .friend-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 20px;
            background: var(--accent-primary);
            border-radius: 0 4px 4px 0;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-lg); /* Unified Avatar Radius */
            margin-right: 12px;
            background: #000;
            border: 1px solid var(--border-base);
            overflow: hidden;
        }

        .friend-info { flex: 1; }
        .friend-name { font-size: 14px; font-weight: 600; }
        .friend-status { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

        /* --- 3. Main Stage (Command Circle) --- */
        .main-stage {
            background: radial-gradient(circle at 50% 60%, #231d2b 0%, #0f0c14 70%);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 40px;
            overflow: hidden;
        }

        /* 3D Floor Grid */
        .floor-grid {
            position: absolute;
            bottom: -100px;
            left: -50%;
            width: 200%;
            height: 100%;
            background: 
                linear-gradient(rgba(217, 119, 6, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(217, 119, 6, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(600px) rotateX(60deg);
            mask-image: linear-gradient(to top, rgba(0,0,0,1), transparent);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1), transparent);
            pointer-events: none;
        }

        /* Command Circle */
        .party-visual {
            position: relative;
            width: 450px;
            height: 450px;
            margin-bottom: 60px;
            z-index: 5;
        }

        /* Isometric Rings */
        .orbit-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(60deg);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .ring-inner { width: 200px; height: 200px; border-color: var(--accent-primary); opacity: 0.3; }
        .ring-outer { width: 360px; height: 360px; border-style: dashed; border-color: var(--accent-secondary); opacity: 0.2; animation: spin 40s linear infinite; }

        /* Nodes */
        .node {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: var(--radius-lg);
            background: var(--bg-card);
            border: 2px solid var(--border-base);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: grid;
            place-items: center;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
        }

        .node img { width: 100%; height: 100%; object-fit: cover; }

        /* Leader Node */
        .node-leader {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.2);
            z-index: 10;
            border-color: var(--accent-primary);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .node-leader::after {
            content: 'LEADER';
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--accent-primary);
            background: rgba(15, 12, 20, 0.8);
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* Member Nodes (Isometric placement) */
        .node-member {
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        
        .node-member:hover { transform: translateY(-10px) scale(1.1); border-color: var(--text-main); }

        .pos-1 { top: 20px; left: 50%; transform: translateX(-50%); } /* Top */
        .pos-2 { bottom: 40px; left: 40px; } /* Bottom Left */
        .pos-3 { bottom: 40px; right: 40px; } /* Bottom Right */

        /* Empty Slot */
        .node-empty {
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            border: 2px dashed var(--text-dim);
            background: rgba(255,255,255,0.02);
        }

        .slot-counter {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-panel);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-base);
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
        }

        /* Action Bar */
        .action-bar {
            display: flex;
            gap: 20px;
            z-index: 10;
            width: 100%;
            justify-content: center;
            align-items: center;
        }

        .btn {
            padding: 14px 32px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), #b45309);
            color: #fff;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px var(--accent-glow); }

        .btn-secondary {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            border: 1px solid var(--border-base);
        }

        .btn-secondary:hover { background: rgba(255,255,255,0.1); border-color: var(--text-muted); }

        /* --- 4. Right Detail Panel --- */
        .detail-panel {
            background: var(--bg-panel);
            border-left: 1px solid var(--border-base);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Subtle background glow for selected user */
        .detail-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(to bottom, rgba(124, 58, 237, 0.1), transparent);
            pointer-events: none;
        }

        .detail-header {
            padding: 40px 24px 20px;
            text-align: center;
            position: relative;
            z-index: 5;
        }

        .detail-avatar-wrap {
            width: 100px;
            height: 100px;
            margin: 0 auto 16px;
            position: relative;
        }

        .detail-avatar {
            width: 100%;
            height: 100%;
            border-radius: var(--radius-lg);
            border: 2px solid var(--accent-secondary);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.3);
            object-fit: cover;
        }

        .detail-name { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
        .detail-tag { color: var(--text-muted); font-size: 13px; font-weight: 500; }

        /* Actions - Secondary Weight, Bottom of card */
        .detail-actions {
            padding: 0 24px 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            order: 2; /* Below stats visually if needed, but here we keep logical flow */
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Invite to Game (Primary Action) */
        .action-game {
            background: var(--accent-secondary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }
        .action-game:hover { background: #6d28d9; transform: translateY(-1px); }

        /* Invite to Party (Secondary) */
        .action-party {
            background: transparent;
            border: 1px solid var(--border-base);
            color: var(--text-main);
        }
        .action-party:hover { background: var(--bg-card); border-color: var(--text-muted); }

        /* Battle (Destructive/Aggressive) */
        .action-battle {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            position: relative;
            overflow: hidden;
        }
        /* Aggressive styling for Battle */
        .action-battle::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background: var(--accent-danger);
        }
        .action-battle:hover { background: var(--accent-danger); color: #fff; }

        /* Stats */
        .stats-section {
            flex: 1;
            padding: 20px 24px;
            order: 1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-base);
            padding: 12px;
            border-radius: var(--radius-md);
            text-align: center;
            transition: transform 0.2s;
        }
        
        .stat-card:hover { transform: translateY(-2px); border-color: var(--border-highlight); }

        .stat-val { font-size: 18px; font-weight: 800; color: var(--text-main); }
        .stat-label { font-size: 10px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; margin-top: 2px; }

        /* Animations */
        @keyframes spin { 100% { transform: translate(-50%, -50%) rotateX(60deg) rotate(360deg); } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Header -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-logo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
                        <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/>
                    </svg>
                </div>
                <span class="brand-text">Warlord</span>
            </div>

            <div class="user-profile-header">
                <div class="user-info">
                    <div class="user-name">Commander_X</div>
                    <div class="user-rank">Lvl 99 • Warlord</div>
                </div>
                <div class="user-avatar">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23231d2b'/%3E%3Cpath d='M20,80 Q50,20 80,80' stroke='%23d97706' stroke-width='8' fill='none'/%3E%3Ccircle cx='50' cy='50' r='10' fill='%23d97706'/%3E%3C/svg%3E">
                </div>
                <div class="status-indicator"></div>
            </div>
        </header>

        <!-- Sidebar -->
        <aside class="sidebar">
            <!-- Requests Panel (Moved Top) -->
            <div class="requests-panel">
                <div class="section-header">
                    <div class="section-label">Requests</div>
                    <div class="badge-count">1</div>
                </div>
                <div class="request-card">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ef4444'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E?%3C/text%3E%3C/svg%3E" class="req-avatar">
                    <div class="req-info">
                        <div class="req-name">TankMaster</div>
                        <div class="req-detail">Level 45 • 2h ago</div>
                    </div>
                    <div class="req-actions">
                        <button class="btn-icon btn-accept">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        </button>
                        <button class="btn-icon btn-decline">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Search & Add -->
            <div class="search-area">
                <input type="text" class="search-input" placeholder="Search friends...">
                <button class="btn-add" title="Add Friend">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </div>

            <!-- Friends List -->
            <div class="friends-scroll-area">
                <div class="section-label" style="margin: 10px 10px 5px;">Online — 4</div>
                
                <!-- Friend 1 (Active) -->
                <div class="friend-item active" onclick="selectFriend(this, 'Viper')">
                    <div class="avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2310b981'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E">
                    </div>
                    <div class="friend-info">
                        <div class="friend-name">Viper</div>
                        <div class="friend-status">In Game: Arena</div>
                    </div>
                </div>

                <!-- Friend 2 -->
                <div class="friend-item" onclick="selectFriend(this, 'Nova')">
                    <div class="avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23d97706'/%3E%3Ccircle cx='50' cy='50' r='20' fill='white'/%3E%3C/svg%3E">
                    </div>
                    <div class="friend-info">
                        <div class="friend-name">Nova</div>
                        <div class="friend-status">In Lobby</div>
                    </div>
                </div>

                <!-- Friend 3 -->
                <div class="friend-item" onclick="selectFriend(this, 'Kael')">
                    <div class="avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%237c3aed'/%3E%3Cpath d='M30,30 L70,70 M70,30 L30,70' stroke='white' stroke-width='8'/%3E%3C/svg%3E">
                    </div>
                    <div class="friend-info">
                        <div class="friend-name">Kael</div>
                        <div class="friend-status">AFK</div>
                    </div>
                </div>
                
                <!-- Friend 4 -->
                <div class="friend-item" onclick="selectFriend(this, 'Rex')">
                    <div class="avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%233b82f6'/%3E%3Crect x='30' y='30' width='40' height='40' fill='white'/%3E%3C/svg%3E">
                    </div>
                    <div class="friend-info">
                        <div class="friend-name">Rex</div>
                        <div class="friend-status">Trading</div>
                    </div>
                </div>

                <div class="section-label" style="margin: 20px 10px 5px;">Offline — 12</div>
                <div class="friend-item">
                    <div class="avatar" style="opacity: 0.5;">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23475569'/%3E%3C/svg%3E">
                    </div>
                    <div class="friend-info">
                        <div class="friend-name" style="opacity: 0.6;">Rogue_One</div>
                        <div class="friend-status">Offline 2h</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Stage: Command Circle -->
        <main class="main-stage">
            <div class="floor-grid"></div>
            
            <div class="party-visual">
                <!-- Isometric Rings -->
                <div class="orbit-ring ring-outer"></div>
                <div class="orbit-ring ring-inner"></div>
                
                <!-- Leader Node -->
                <div class="node node-leader">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23231d2b'/%3E%3Cpath d='M20,80 Q50,20 80,80' stroke='%23d97706' stroke-width='8' fill='none'/%3E%3Ccircle cx='50' cy='50' r='10' fill='%23d97706'/%3E%3C/svg%3E">
                </div>

                <!-- Squad Members -->
                <div class="node node-member pos-1">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2310b981'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E">
                </div>
                <div class="node node-member pos-2">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23d97706'/%3E%3Ccircle cx='50' cy='50' r='20' fill='white'/%3E%3C/svg%3E">
                </div>
                <div class="node node-member pos-3">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%237c3aed'/%3E%3Cpath d='M30,30 L70,70 M70,30 L30,70' stroke='white' stroke-width='8'/%3E%3C/svg%3E">
                </div>
                
                <!-- Empty Slot -->
                <div class="node node-empty">
                    <div class="slot-counter">3 / 4 Slots</div>
                    <span style="font-size:24px; color:var(--text-dim);">+</span>
                </div>
            </div>

            <div class="action-bar">
                <button class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    Start Match
                </button>
                <button class="btn btn-secondary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    Invite to Party
                </button>
            </div>
        </main>

        <!-- Right Detail Panel -->
        <aside class="detail-panel">
            <div class="detail-header">
                <div class="detail-avatar-wrap">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2310b981'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E" class="detail-avatar">
                </div>
                <div class="detail-name">Viper</div>
                <div class="detail-tag">#8492 • In Game: Arena</div>
            </div>

            <div class="stats-section">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-val">1.4k</div>
                        <div class="stat-label">Wins</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val">2,450</div>
                        <div class="stat-label">MMR</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val">54%</div>
                        <div class="stat-label">Win Rate</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val">Plat II</div>
                        <div class="stat-label">Rank</div>
                    </div>
                </div>
            </div>

            <div class="detail-actions">
                <!-- Invite to Game (Primary) -->
                <button class="action-btn action-game">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                    Invite to Game
                </button>
                
                <!-- Invite to Party (Secondary) -->
                <button class="action-btn action-party">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                    Invite to Party
                </button>

                <!-- Battle (Destructive) -->
                <button class="action-btn action-battle">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"></path><path d="M13 19l6-6"></path><path d="M16 16l4 4"></path><path d="M19 21l2-2"></path></svg>
                    Challenge to Battle
                </button>
            </div>
        </aside>

    </div>

    <script>
        // Data Store
        const friends = {
            'Viper': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2310b981'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E",
                name: "Viper",
                tag: "#8492 • In Game: Arena",
                wins: "1.4k", mmr: "2,450", rate: "54%", rank: "Plat II"
            },
            'Nova': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23d97706'/%3E%3Ccircle cx='50' cy='50' r='20' fill='white'/%3E%3C/svg%3E",
                name: "Nova",
                tag: "#1102 • In Lobby",
                wins: "320", mmr: "1,800", rate: "48%", rank: "Gold I"
            },
            'Kael': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%237c3aed'/%3E%3Cpath d='M30,30 L70,70 M70,30 L30,70' stroke='white' stroke-width='8'/%3E%3C/svg%3E",
                name: "Kael",
                tag: "#9921 • AFK",
                wins: "45", mmr: "900", rate: "32%", rank: "Bronze III"
            },
            'Rex': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%233b82f6'/%3E%3Crect x='30' y='30' width='40' height='40' fill='white'/%3E%3C/svg%3E",
                name: "Rex",
                tag: "#3341 • Trading",
                wins: "890", mmr: "2,100", rate: "51%", rank: "Plat I"
            }
        };

        function selectFriend(element, name) {
            // Handle Active State
            document.querySelectorAll('.friend-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            // Update Right Panel
            const data = friends[name];
            if(data) {
                const panel = document.querySelector('.detail-panel');
                
                // Simple fade transition
                panel.style.opacity = '0.5';
                panel.style.transform = 'translateX(10px)';
                panel.style.transition = 'all 0.15s ease-out';
                
                setTimeout(() => {
                    document.querySelector('.detail-avatar').src = data.img;
                    document.querySelector('.detail-name').textContent = data.name;
                    document.querySelector('.detail-tag').textContent = data.tag;
                    
                    const stats = document.querySelectorAll('.stat-val');
                    stats[0].textContent = data.wins;
                    stats[1].textContent = data.mmr;
                    stats[2].textContent = data.rate;
                    stats[3].textContent = data.rank;

                    panel.style.opacity = '1';
                    panel.style.transform = 'translateX(0)';
                }, 150);
            }
        }
    </script>
</body>
</html>
