<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARLORD Social Interface</title>
    <style>
        :root {
            /* Palette: Tactical Neon - Deep Slate, Neon Gold, Cyber Violet */
            --bg-deep: #090a0f;
            --bg-panel: #11131c;
            --bg-card: #1a1d2b;
            --bg-card-hover: #24283b;
            
            --accent-primary: #f59e0b; /* Amber Gold - High Energy */
            --accent-primary-dim: rgba(245, 158, 11, 0.2);
            --accent-secondary: #8b5cf6; /* Violet - Tech */
            --accent-secondary-dim: rgba(139, 92, 246, 0.2);
            
            --accent-danger: #f43f5e; /* Red - Battle */
            --accent-success: #10b981; /* Green - Status */
            --accent-info: #38bdf8; /* Blue - Neutral Status */

            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #475569;

            --border-base: #2e334a;
            --border-highlight: #f59e0b;

            /* Typography */
            --font-stack: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            /* Geometry - Unified Radius System */
            --radius-sm: 6px;
            --radius-md: 12px; /* Primary UI Elements */
            --radius-lg: 18px; /* Avatars */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body {
            background-color: #000;
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* Carbon Fiber / Noise Texture */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
        }

        /* --- Main App Container --- */
        .app-container {
            width: 1440px;
            height: 900px;
            background: var(--bg-deep);
            border-radius: var(--radius-lg);
            box-shadow: 0 0 0 1px var(--border-base), 0 20px 50px -10px rgba(0,0,0,0.8);
            display: grid;
            grid-template-columns: 340px 1fr 380px;
            grid-template-rows: 72px 1fr;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--border-base);
        }

        /* --- 1. Header --- */
        .app-header {
            grid-column: 1 / -1;
            background: rgba(17, 19, 28, 0.9);
            border-bottom: 1px solid var(--border-base);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 20;
            backdrop-filter: blur(8px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent-primary), #b45309);
            border-radius: var(--radius-sm);
            display: grid;
            place-items: center;
            box-shadow: 0 0 15px var(--accent-primary-dim);
            transform: skewX(-10deg);
        }

        .brand-text {
            font-weight: 900;
            font-size: 18px;
            letter-spacing: 3px;
            color: var(--text-main);
            text-transform: uppercase;
            transform: skewX(-10deg);
        }

        .user-profile-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 6px 12px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-base);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-lg);
            border: 2px solid var(--accent-secondary);
            overflow: hidden;
            box-shadow: 0 0 10px var(--accent-secondary-dim);
        }
        
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .user-info { display: flex; flex-direction: column; }
        .user-name { font-size: 14px; font-weight: 700; color: var(--text-main); }
        .user-rank { font-size: 11px; font-weight: 600; color: var(--accent-primary); text-transform: uppercase; letter-spacing: 0.5px; }

        /* --- 2. Sidebar (Friends) --- */
        .sidebar {
            background: var(--bg-panel);
            border-right: 1px solid var(--border-base);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        /* Requests Panel */
        .requests-panel {
            padding: 20px;
            background: linear-gradient(to bottom, rgba(244, 63, 94, 0.05), transparent);
            border-bottom: 1px solid var(--border-base);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .badge-count {
            background: var(--accent-danger);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.4);
        }

        .request-card {
            background: var(--bg-card);
            border: 1px solid var(--border-base);
            border-radius: var(--radius-md);
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }
        
        .request-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0; width: 3px;
            background: var(--accent-danger);
        }

        .req-avatar {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            background: #000;
            flex-shrink: 0;
            border: 1px solid var(--border-base);
        }

        .req-info { flex: 1; }
        .req-name { font-size: 13px; font-weight: 700; color: var(--text-main); }
        .req-detail { font-size: 11px; color: var(--text-muted); }

        .req-actions { display: flex; gap: 6px; }
        
        .btn-action-sm {
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            border: none;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .btn-accept { background: var(--accent-success); color: #fff; }
        .btn-accept:hover { box-shadow: 0 0 10px var(--accent-success); }
        .btn-decline { background: transparent; border: 1px solid var(--border-base); color: var(--text-muted); }
        .btn-decline:hover { border-color: var(--text-muted); color: var(--text-main); }

        /* Search & Add */
        .search-area {
            padding: 20px;
            border-bottom: 1px solid var(--border-base);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-input-wrap {
            position: relative;
        }

        .search-input {
            width: 100%;
            background: var(--bg-deep);
            border: 1px solid var(--border-base);
            padding: 10px 14px 10px 36px;
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 13px;
            transition: border-color 0.2s;
        }
        
        .search-input:focus { border-color: var(--accent-primary); }
        
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            pointer-events: none;
        }

        .btn-add {
            width: 100%;
            background: var(--bg-card);
            border: 1px dashed var(--border-base);
            color: var(--text-muted);
            padding: 10px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
        }
        
        .btn-add:hover { 
            background: var(--bg-card-hover); 
            border-color: var(--text-muted); 
            color: var(--text-main); 
            border-style: solid;
        }

        /* Friends List */
        .friends-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px;
            scrollbar-width: thin;
            scrollbar-color: var(--bg-card) var(--bg-panel);
        }

        .friend-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
            border: 1px solid transparent;
            position: relative;
        }

        .friend-item:hover { background: var(--bg-card); }

        .friend-item.active {
            background: var(--bg-card);
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px var(--accent-primary-dim);
        }

        .friend-item.active .friend-name { color: var(--accent-primary); }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-lg);
            margin-right: 12px;
            background: #000;
            border: 1px solid var(--border-base);
            overflow: hidden;
            position: relative;
        }
        
        /* Status Frames */
        .avatar-frame {
            position: absolute;
            inset: -2px;
            border-radius: var(--radius-lg);
            pointer-events: none;
        }
        .status-in-game .avatar-frame {
            border: 2px solid var(--accent-success);
            box-shadow: 0 0 8px var(--accent-success);
            animation: pulse-border 2s infinite;
        }

        .friend-info { flex: 1; }
        .friend-name { font-size: 14px; font-weight: 600; color: var(--text-main); }
        .friend-status { font-size: 12px; color: var(--text-muted); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
        
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); }
        .status-online .status-dot { background: var(--accent-success); box-shadow: 0 0 5px var(--accent-success); }
        .status-lobby .status-dot { background: var(--accent-info); box-shadow: 0 0 5px var(--accent-info); }
        .status-afk .status-dot { background: var(--accent-primary); }

        /* --- 3. Main Stage (Party Roster) --- */
        .main-stage {
            background: radial-gradient(circle at 50% 30%, #1a1d2b 0%, #090a0f 70%);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Clean Grid Background */
        .floor-grid {
            position: absolute;
            inset: 0;
            background: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            pointer-events: none;
        }

        /* Party Roster Container */
        .party-roster {
            position: relative;
            width: 100%;
            max-width: 700px;
            height: 500px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Connection Lines (SVG) */
        .connections-svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        
        .connection-line {
            stroke: var(--accent-secondary);
            stroke-width: 2;
            stroke-opacity: 0.3;
            stroke-dasharray: 10;
            animation: dash-flow 20s linear infinite;
        }

        .connection-line.active {
            stroke: var(--accent-primary);
            stroke-opacity: 0.6;
            stroke-dasharray: none;
            filter: drop-shadow(0 0 5px var(--accent-primary));
        }

        /* Slots Layout */
        .slots-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Leader Slot (Center) */
        .slot-leader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
        }

        /* Member Slots (Triangle formation) */
        .slot-member {
            position: absolute;
            width: 100px;
            height: 100px;
        }
        
        .pos-1 { top: 10%; left: 50%; transform: translateX(-50%); }
        .pos-2 { bottom: 15%; left: 15%; }
        .pos-3 { bottom: 15%; right: 15%; }

        /* Slot Card Design */
        .slot-card {
            width: 100%;
            height: 100%;
            background: rgba(26, 29, 43, 0.8);
            border: 1px solid var(--border-base);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(4px);
        }

        .slot-leader .slot-card {
            border: 2px solid var(--accent-primary);
            box-shadow: 0 0 30px var(--accent-primary-dim);
            background: rgba(245, 158, 11, 0.05);
        }
        
        .slot-leader .slot-card::after {
            content: 'LEADER';
            position: absolute;
            bottom: -24px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--accent-primary);
        }

        .slot-card:hover { transform: scale(1.05); border-color: var(--text-main); }

        .slot-avatar {
            width: 80%;
            height: 80%;
            border-radius: var(--radius-md);
            overflow: hidden;
            margin-bottom: 8px;
        }
        
        .slot-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .slot-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* Empty Slot */
        .slot-empty .slot-card {
            border: 2px dashed var(--text-dim);
            background: rgba(255,255,255,0.02);
        }
        
        .slot-empty .slot-card:hover {
            border-color: var(--accent-secondary);
            background: var(--accent-secondary-dim);
        }

        .empty-icon {
            font-size: 24px;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        /* --- 4. Right Detail Panel (Friend Focus) --- */
        .detail-panel {
            background: var(--bg-panel);
            border-left: 1px solid var(--border-base);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Thematic Header Background */
        .detail-header-bg {
            height: 180px;
            background: linear-gradient(to bottom, var(--accent-secondary-dim), transparent);
            position: absolute;
            top: 0; left: 0; right: 0;
            pointer-events: none;
        }

        .detail-content {
            padding: 24px;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .detail-profile {
            text-align: center;
            margin-bottom: 24px;
        }

        .detail-avatar-wrap {
            width: 100px;
            height: 100px;
            margin: 0 auto 16px;
            position: relative;
        }

        .detail-avatar {
            width: 100%;
            height: 100%;
            border-radius: var(--radius-lg);
            border: 3px solid var(--bg-panel);
            box-shadow: 0 0 0 2px var(--accent-secondary), 0 10px 20px rgba(0,0,0,0.5);
            object-fit: cover;
        }

        .detail-name { font-size: 24px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; }
        .detail-tag { color: var(--text-muted); font-size: 13px; font-weight: 500; margin-top: 4px; }

        /* Social Context Section */
        .social-context {
            margin-bottom: 24px;
        }
        
        .context-label {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-dim);
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .context-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .pill {
            padding: 6px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-base);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .pill.mutual { border-color: var(--accent-secondary); color: var(--accent-secondary); }

        /* Actions - The "Command" Area */
        .detail-actions {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-md);
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        /* Battle Button - High Stakes */
        .action-battle {
            background: linear-gradient(90deg, #991b1b, var(--accent-danger));
            color: #fff;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        .action-battle:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 25px rgba(244, 63, 94, 0.6);
            filter: brightness(1.1);
        }
        
        /* Invite to Game - Primary */
        .action-game {
            background: var(--accent-primary);
            color: #000;
            box-shadow: 0 4px 15px var(--accent-primary-dim);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        .action-game:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 25px var(--accent-primary-dim);
        }

        /* Chat - Secondary */
        .action-chat {
            background: transparent;
            border: 1px solid var(--border-base);
            color: var(--text-main);
        }
        .action-chat:hover { background: var(--bg-card); border-color: var(--text-muted); }

        /* Animations */
        @keyframes pulse-border {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        @keyframes dash-flow {
            to { stroke-dashoffset: -100; }
        }

    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Header -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-logo">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
                        <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/>
                    </svg>
                </div>
                <span class="brand-text">Warlord</span>
            </div>

            <div class="user-profile-header">
                <div class="user-info">
                    <div class="user-name">Commander_X</div>
                    <div class="user-rank">Lvl 99 • Warlord</div>
                </div>
                <div class="user-avatar">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23231d2b'/%3E%3Cpath d='M20,80 Q50,20 80,80' stroke='%23f59e0b' stroke-width='8' fill='none'/%3E%3Ccircle cx='50' cy='50' r='10' fill='%23f59e0b'/%3E%3C/svg%3E">
                </div>
            </div>
        </header>

        <!-- Sidebar -->
        <aside class="sidebar">
            <!-- Requests Panel -->
            <div class="requests-panel">
                <div class="section-header">
                    <div class="section-label">Requests</div>
                    <div class="badge-count">1</div>
                </div>
                <div class="request-card">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ef4444'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E?%3C/text%3E%3C/svg%3E" class="req-avatar">
                    <div class="req-info">
                        <div class="req-name">TankMaster</div>
                        <div class="req-detail">Level 45</div>
                    </div>
                    <div class="req-actions">
                        <button class="btn-action-sm btn-accept">Accept</button>
                        <button class="btn-action-sm btn-decline">Decline</button>
                    </div>
                </div>
            </div>

            <!-- Search & Add -->
            <div class="search-area">
                <div class="search-input-wrap">
                    <span class="search-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </span>
                    <input type="text" class="search-input" placeholder="Search friends...">
                </div>
                <button class="btn-add">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Add Friend
                </button>
            </div>

            <!-- Friends List -->
            <div class="friends-scroll-area">
                <div class="section-label" style="margin: 10px 10px 5px;">Online — 4</div>
                
                <!-- Friend 1 (Active) -->
                <div class="friend-item active status-in-game" onclick="selectFriend(this, 'Viper')">
                    <div class="avatar">
                        <div class="avatar-frame"></div>
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2310b981'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E">
                    </div>
                    <div class="friend-info">
                        <div class="friend-name">Viper</div>
                        <div class="friend-status">
                            <span class="status-dot"></span> In Game: Arena
                        </div>
                    </div>
                </div>

                <!-- Friend 2 -->
                <div class="friend-item status-lobby" onclick="selectFriend(this, 'Nova')">
                    <div class="avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23f59e0b'/%3E%3Ccircle cx='50' cy='50' r='20' fill='white'/%3E%3C/svg%3E">
                    </div>
                    <div class="friend-info">
                        <div class="friend-name">Nova</div>
                        <div class="friend-status">
                            <span class="status-dot"></span> In Lobby
                        </div>
                    </div>
                </div>

                <!-- Friend 3 -->
                <div class="friend-item status-afk" onclick="selectFriend(this, 'Kael')">
                    <div class="avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%238b5cf6'/%3E%3Cpath d='M30,30 L70,70 M70,30 L30,70' stroke='white' stroke-width='8'/%3E%3C/svg%3E">
                    </div>
                    <div class="friend-info">
                        <div class="friend-name">Kael</div>
                        <div class="friend-status">
                            <span class="status-dot"></span> AFK
                        </div>
                    </div>
                </div>
                
                <!-- Friend 4 -->
                <div class="friend-item status-online" onclick="selectFriend(this, 'Rex')">
                    <div class="avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%233b82f6'/%3E%3Crect x='30' y='30' width='40' height='40' fill='white'/%3E%3C/svg%3E">
                    </div>
                    <div class="friend-info">
                        <div class="friend-name">Rex</div>
                        <div class="friend-status">
                            <span class="status-dot"></span> Trading
                        </div>
                    </div>
                </div>

                <div class="section-label" style="margin: 20px 10px 5px;">Offline — 12</div>
                <div class="friend-item">
                    <div class="avatar" style="opacity: 0.5; filter: grayscale(100%);">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23475569'/%3E%3C/svg%3E">
                    </div>
                    <div class="friend-info">
                        <div class="friend-name" style="opacity: 0.6;">Rogue_One</div>
                        <div class="friend-status">Offline 2h</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Stage: Party Roster -->
        <main class="main-stage">
            <div class="floor-grid"></div>
            
            <div class="party-roster">
                <!-- SVG Connections -->
                <svg class="connections-svg" viewBox="0 0 700 500" preserveAspectRatio="none">
                    <!-- Lines from Leader (350, 250) to Members -->
                    <line x1="350" y1="250" x2="350" y2="100" class="connection-line active" /> <!-- Top -->
                    <line x1="350" y1="250" x2="150" y2="400" class="connection-line active" /> <!-- Bottom Left -->
                    <line x1="350" y1="250" x2="550" y2="400" class="connection-line active" /> <!-- Bottom Right -->
                    <!-- Line to Empty Slot (dashed) -->
                    <line x1="350" y1="250" x2="350" y2="450" class="connection-line" />
                </svg>

                <div class="slots-container">
                    <!-- Leader Node -->
                    <div class="slot-leader">
                        <div class="slot-card">
                            <div class="slot-avatar">
                                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23231d2b'/%3E%3Cpath d='M20,80 Q50,20 80,80' stroke='%23f59e0b' stroke-width='8' fill='none'/%3E%3Ccircle cx='50' cy='50' r='10' fill='%23f59e0b'/%3E%3C/svg%3E">
                            </div>
                            <div class="slot-label">You</div>
                        </div>
                    </div>

                    <!-- Squad Members -->
                    <div class="slot-member pos-1">
                        <div class="slot-card">
                            <div class="slot-avatar">
                                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2310b981'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E">
                            </div>
                            <div class="slot-label">Viper</div>
                        </div>
                    </div>
                    <div class="slot-member pos-2">
                        <div class="slot-card">
                            <div class="slot-avatar">
                                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23f59e0b'/%3E%3Ccircle cx='50' cy='50' r='20' fill='white'/%3E%3C/svg%3E">
                            </div>
                            <div class="slot-label">Nova</div>
                        </div>
                    </div>
                    <div class="slot-member pos-3">
                        <div class="slot-card">
                            <div class="slot-avatar">
                                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%238b5cf6'/%3E%3Cpath d='M30,30 L70,70 M70,30 L30,70' stroke='white' stroke-width='8'/%3E%3C/svg%3E">
                            </div>
                            <div class="slot-label">Kael</div>
                        </div>
                    </div>
                    
                    <!-- Empty Slot -->
                    <div class="slot-member" style="bottom: 5%; left: 50%; transform: translateX(-50%);">
                        <div class="slot-card slot-empty">
                            <div class="empty-icon">+</div>
                            <div class="slot-label">Invite</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Right Detail Panel -->
        <aside class="detail-panel">
            <div class="detail-header-bg"></div>
            
            <div class="detail-content">
                <div class="detail-profile">
                    <div class="detail-avatar-wrap">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2310b981'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E" class="detail-avatar">
                    </div>
                    <div class="detail-name">Viper</div>
                    <div class="detail-tag">#8492 • In Game: Arena</div>
                </div>

                <!-- Social Context -->
                <div class="social-context">
                    <div class="context-label">Connection</div>
                    <div class="context-row">
                        <div class="pill mutual">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                            4 Mutual Friends
                        </div>
                        <div class="pill">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                            12 Games
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="detail-actions">
                    <!-- Battle (High Priority) -->
                    <button class="action-btn action-battle">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"></path><path d="M13 19l6-6"></path><path d="M16 16l4 4"></path><path d="M19 21l2-2"></path></svg>
                        Challenge to Battle
                    </button>
                    
                    <!-- Invite to Game (Primary) -->
                    <button class="action-btn action-game">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        Invite to Game
                    </button>

                    <!-- Chat (Secondary) -->
                    <button class="action-btn action-chat">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        Send Message
                    </button>
                </div>
            </div>
        </aside>

    </div>

    <script>
        // Data Store
        const friends = {
            'Viper': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2310b981'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E",
                name: "Viper",
                tag: "#8492 • In Game: Arena",
                mutual: 4, games: 12
            },
            'Nova': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23f59e0b'/%3E%3Ccircle cx='50' cy='50' r='20' fill='white'/%3E%3C/svg%3E",
                name: "Nova",
                tag: "#1102 • In Lobby",
                mutual: 1, games: 5
            },
            'Kael': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%238b5cf6'/%3E%3Cpath d='M30,30 L70,70 M70,30 L30,70' stroke='white' stroke-width='8'/%3E%3C/svg%3E",
                name: "Kael",
                tag: "#9921 • AFK",
                mutual: 8, games: 45
            },
            'Rex': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%233b82f6'/%3E%3Crect x='30' y='30' width='40' height='40' fill='white'/%3E%3C/svg%3E",
                name: "Rex",
                tag: "#3341 • Trading",
                mutual: 0, games: 2
            }
        };

        function selectFriend(element, name) {
            // Handle Active State
            document.querySelectorAll('.friend-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            // Update Right Panel
            const data = friends[name];
            if(data) {
                const panel = document.querySelector('.detail-content');
                
                // Simple fade transition
                panel.style.opacity = '0';
                panel.style.transform = 'translateY(10px)';
                panel.style.transition = 'all 0.2s ease-out';
                
                setTimeout(() => {
                    document.querySelector('.detail-avatar').src = data.img;
                    document.querySelector('.detail-name').textContent = data.name;
                    document.querySelector('.detail-tag').textContent = data.tag;
                    
                    // Update Social Context
                    const mutualPill = document.querySelector('.pill.mutual');
                    mutualPill.innerHTML = `
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                        ${data.mutual} Mutual Friends
                    `;
                    const gamesPill = document.querySelector('.pill:last-child');
                    gamesPill.innerHTML = `
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                        ${data.games} Games
                    `;

                    panel.style.opacity = '1';
                    panel.style.transform = 'translateY(0)';
                }, 200);
            }
        }
    </script>
</body>
</html>
