<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STRATOS // PARTY SYSTEM</title>
    <style>
        :root {
            /* Palette: Premium Gaming / Sci-Fi */
            --bg-app: #090a0f;
            --bg-panel: #11141c;
            --bg-surface: #1a1f2b;
            --bg-surface-hover: #232a3b;
            
            --accent-primary: #3b82f6; /* Electric Blue */
            --accent-primary-dim: rgba(59, 130, 246, 0.15);
            --accent-secondary: #10b981; /* Emerald Green */
            --accent-alert: #f59e0b; /* Amber */
            --accent-danger: #ef4444; /* Red */
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #475569;
            
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-highlight: rgba(59, 130, 246, 0.5);
            
            --font-stack: 'Inter', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', 'Roboto Mono', monospace;
            
            --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-font-smoothing: antialiased; }

        body {
            background-color: #000;
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Main Layout --- */
        .app-window {
            width: 1600px;
            height: 960px;
            background: var(--bg-app);
            border-radius: 12px;
            box-shadow: 0 0 0 1px #1f2937, 0 25px 50px -12px rgba(0, 0, 0, 0.9);
            display: grid;
            grid-template-columns: 340px 1fr 420px;
            grid-template-rows: 1fr;
            overflow: hidden;
            position: relative;
        }

        /* Subtle Noise Texture */
        .app-window::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 50;
        }

        /* --- Left Sidebar (Friends) --- */
        .sidebar {
            background: var(--bg-panel);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .sidebar-header {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .search-box {
            position: relative;
        }
        
        .search-box svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            width: 16px;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            padding: 12px 12px 12px 42px;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 13px;
            transition: all 0.2s;
            font-family: var(--font-stack);
        }
        
        .search-input:focus {
            border-color: var(--accent-primary);
            background: #000;
            box-shadow: 0 0 0 2px var(--accent-primary-dim);
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: var(--bg-surface);
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
        }

        .user-pill-info {
            flex: 1;
        }
        .user-pill-name { font-size: 13px; font-weight: 700; color: var(--text-main); }
        .user-pill-status { font-size: 11px; color: var(--accent-secondary); font-family: var(--font-mono); }

        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        /* Scrollbar */
        .list-container::-webkit-scrollbar { width: 4px; }
        .list-container::-webkit-scrollbar-thumb { background: var(--bg-surface); border-radius: 4px; }

        .section-header {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-dim);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin: 20px 12px 8px 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .count-badge {
            background: var(--bg-surface);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .friend-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            position: relative;
        }

        .friend-item:hover {
            background: var(--bg-surface);
        }

        .friend-item.selected {
            background: var(--accent-primary-dim);
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.1);
        }

        .friend-item.selected::before {
            content: '';
            position: absolute;
            left: 0;
            top: 14px;
            bottom: 14px;
            width: 3px;
            background: var(--accent-primary);
            border-radius: 0 2px 2px 0;
        }

        .avatar-wrap {
            position: relative;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            background: var(--bg-surface);
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            position: relative;
        }
        
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .status-dot {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--bg-panel);
            z-index: 2;
        }
        
        .st-online { background: var(--accent-secondary); box-shadow: 0 0 5px var(--accent-secondary); }
        .st-game { background: var(--accent-primary); box-shadow: 0 0 5px var(--accent-primary); }
        .st-afk { background: var(--accent-alert); }
        .st-off { background: var(--text-dim); }

        .friend-info { flex: 1; min-width: 0; }
        .f-name { font-size: 14px; font-weight: 600; color: var(--text-main); margin-bottom: 2px; display: block; }
        .f-status { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Pending Requests Section */
        .requests-box {
            background: var(--bg-surface);
            border-top: 1px solid var(--border-subtle);
            padding: 16px;
            margin: 12px;
            border-radius: 8px;
        }
        
        .req-item {
            display: flex;
            align-items: center;
            background: var(--bg-panel);
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
            border: 1px solid var(--border-subtle);
        }

        .req-avatar { width: 32px; height: 32px; border-radius: 6px; margin-right: 12px; background: #333; display: grid; place-items: center; font-size: 10px; font-weight: bold; color: #fff;}
        .req-info { flex: 1; }
        .req-name { font-size: 12px; font-weight: 700; color: var(--text-main); }
        .req-lvl { font-size: 10px; color: var(--text-muted); }
        
        .req-btns { display: flex; gap: 6px; }
        .icon-btn { width: 28px; height: 28px; border-radius: 4px; border: none; display: grid; place-items: center; cursor: pointer; transition: 0.2s; }
        .btn-acc { background: var(--accent-secondary); color: #000; }
        .btn-acc:hover { opacity: 0.9; transform: scale(1.05); }
        .btn-dec { background: rgba(239, 68, 68, 0.15); color: var(--accent-danger); }
        .btn-dec:hover { background: var(--accent-danger); color: white; }

        /* --- Center Stage (Party) --- */
        .stage {
            background: radial-gradient(circle at 50% 50%, #111a2a 0%, #050505 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Grid Background */
        .tech-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(var(--border-subtle) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-subtle) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(circle at center, black 20%, transparent 70%);
            -webkit-mask-image: radial-gradient(circle at center, black 20%, transparent 70%);
            z-index: 1;
            opacity: 0.5;
        }
        
        .ambient-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 60%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        .stage-content {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .party-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .party-title {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(255,255,255,0.1);
            margin-bottom: 8px;
        }

        .party-sub {
            color: var(--accent-primary);
            font-family: var(--font-mono);
            font-size: 14px;
            letter-spacing: 1px;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        /* The Orbit System */
        .orbit-system {
            position: relative;
            width: 550px;
            height: 550px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
        }

        .orbit-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px dashed var(--border-subtle);
            pointer-events: none;
        }

        .ring-inner { 
            width: 280px; height: 280px; 
            border-color: rgba(59, 130, 246, 0.15); 
            animation: spin 60s linear infinite; 
        }
        .ring-outer { 
            width: 460px; height: 460px; 
            border-color: rgba(255,255,255,0.03); 
            animation: spin 120s linear infinite reverse; 
        }

        .center-hub {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #60a5fa, var(--accent-primary));
            border: 4px solid #fff;
            box-shadow: 
                0 0 0 4px var(--accent-primary-dim),
                0 0 60px rgba(59, 130, 246, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            animation: float 6s ease-in-out infinite;
        }
        
        .center-hub img { 
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover; 
            mix-blend-mode: overlay; opacity: 0.9; 
        }

        .node {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--bg-surface);
            border: 3px solid var(--bg-app);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s var(--ease-elastic);
            cursor: pointer;
            overflow: hidden;
            z-index: 5;
        }

        .node:hover { transform: scale(1.2); border-color: var(--accent-primary); z-index: 20; }
        .node img { width: 100%; height: 100%; object-fit: cover; }

        /* Node Positioning (Calculated for 550px container) */
        .n-1 { top: 40px; left: 50%; transform: translateX(-50%); }
        .n-2 { bottom: 100px; right: 80px; }
        .n-3 { bottom: 100px; left: 80px; }
        
        .empty-slot {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px dashed var(--text-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            top: 50%; right: 40px; transform: translateY(-50%);
            animation: float 4s ease-in-out infinite reverse;
        }

        .action-row {
            display: flex;
            gap: 16px;
            z-index: 20;
        }

        /* Buttons */
        .btn {
            padding: 16px 36px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            font-family: var(--font-stack);
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent);
            pointer-events: none;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }
        .btn-primary:hover { 
            background: #2563eb; 
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.6); 
            transform: translateY(-2px); 
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.03);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
        }
        .btn-secondary:hover { 
            background: rgba(255,255,255,0.08); 
            border-color: var(--text-muted); 
        }
        
        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .btn-danger:hover { background: var(--accent-danger); color: white; }

        /* --- Right Detail Panel --- */
        .detail-panel {
            background: var(--bg-panel);
            border-left: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        .hero-section {
            padding: 40px 30px;
            text-align: center;
            background: linear-gradient(180deg, rgba(59, 130, 246, 0.03), transparent);
            border-bottom: 1px solid var(--border-subtle);
        }

        .hero-avatar-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            padding: 4px;
            background: conic-gradient(from 180deg, var(--accent-primary), var(--accent-secondary));
            margin: 0 auto 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .hero-avatar-large img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid var(--bg-panel);
            object-fit: cover;
        }

        .hero-name { font-size: 26px; font-weight: 800; margin-bottom: 6px; letter-spacing: 0.5px; }
        .hero-tag { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; font-family: var(--font-mono); }

        .level-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--accent-secondary);
            color: #000;
            font-weight: 800;
            font-size: 13px;
            padding: 8px 24px;
            border-radius: 30px;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
            letter-spacing: 1px;
        }

        .stats-area {
            padding: 30px;
            flex: 1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .stat-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-2px); border-color: var(--text-dim); }

        .stat-val { font-size: 24px; font-weight: 800; color: var(--text-main); font-family: var(--font-mono); margin-bottom: 6px; }
        .stat-lbl { font-size: 10px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1.5px; font-weight: 700; }

        .panel-actions {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Animations */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

        svg { fill: currentColor; }
    </style>
</head>
<body>

    <div class="app-window">
        <!-- Left Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <!-- User Pill -->
                <div class="user-pill">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%233b82f6'/%3E%3Cstop offset='100%25' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EX%3C/text%3E%3C/svg%3E" style="width: 40px; height: 40px; border-radius: 8px;">
                    <div class="user-pill-info">
                        <div class="user-pill-name">Commander_X</div>
                        <div class="user-pill-status">LVL 99 • ONLINE</div>
                    </div>
                </div>

                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" class="search-input" placeholder="Search friends...">
                </div>
            </div>

            <div class="list-container">
                <div class="section-header">Online <span class="count-badge">4</span></div>
                
                <!-- Friend: Viper -->
                <div class="friend-item selected" onclick="selectFriend(this, 'Viper')">
                    <div class="avatar-wrap">
                        <div class="avatar">
                            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2310b981'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E">
                        </div>
                        <div class="status-dot st-game"></div>
                    </div>
                    <div class="friend-info">
                        <span class="f-name">Viper</span>
                        <span class="f-status">In Game: Arena</span>
                    </div>
                </div>

                <!-- Friend: Nova -->
                <div class="friend-item" onclick="selectFriend(this, 'Nova')">
                    <div class="avatar-wrap">
                        <div class="avatar">
                            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23f59e0b'/%3E%3Ccircle cx='50' cy='50' r='20' fill='white'/%3E%3C/svg%3E">
                        </div>
                        <div class="status-dot st-online"></div>
                    </div>
                    <div class="friend-info">
                        <span class="f-name">Nova</span>
                        <span class="f-status">In Lobby</span>
                    </div>
                </div>

                <!-- Friend: Kael -->
                <div class="friend-item" onclick="selectFriend(this, 'Kael')">
                    <div class="avatar-wrap">
                        <div class="avatar">
                            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%238b5cf6'/%3E%3Cpath d='M30,30 L70,70 M70,30 L30,70' stroke='white' stroke-width='8'/%3E%3C/svg%3E">
                        </div>
                        <div class="status-dot st-afk"></div>
                    </div>
                    <div class="friend-info">
                        <span class="f-name">Kael</span>
                        <span class="f-status">AFK</span>
                    </div>
                </div>

                <div class="section-header">Offline <span class="count-badge">12</span></div>
                
                <div class="friend-item" style="opacity: 0.6;">
                    <div class="avatar-wrap">
                        <div class="avatar">
                            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23475569'/%3E%3C/svg%3E">
                        </div>
                        <div class="status-dot st-off"></div>
                    </div>
                    <div class="friend-info">
                        <span class="f-name">Rogue_One</span>
                        <span class="f-status">Offline 2h</span>
                    </div>
                </div>
            </div>

            <div style="margin-top: auto; padding: 0 12px 12px;">
                <div class="requests-box">
                    <div class="section-header" style="margin-top:0; margin-bottom: 12px;">Pending <span class="count-badge">1</span></div>
                    <div class="req-item">
                        <div class="req-avatar" style="background: #ef4444;">?</div>
                        <div class="req-info">
                            <div class="req-name">TankMaster</div>
                            <div class="req-lvl">Lvl 45</div>
                        </div>
                        <div class="req-btns">
                            <button class="icon-btn btn-acc">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            </button>
                            <button class="icon-btn btn-dec">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Stage -->
        <main class="stage">
            <div class="tech-grid"></div>
            <div class="ambient-glow"></div>
            
            <div class="stage-content">
                <div class="party-header">
                    <div class="party-title">Battle Squad</div>
                    <div class="party-sub">LEVEL 1-100 • 3/5 MEMBERS</div>
                </div>

                <div class="orbit-system">
                    <div class="orbit-ring ring-inner"></div>
                    <div class="orbit-ring ring-outer"></div>
                    
                    <!-- Center Node -->
                    <div class="center-hub">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%233b82f6'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EX%3C/text%3E%3C/svg%3E">
                    </div>
                    
                    <!-- Members -->
                    <div class="node n-1" title="Viper">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2310b981'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E">
                    </div>
                    <div class="node n-2" title="Nova">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23f59e0b'/%3E%3Ccircle cx='50' cy='50' r='20' fill='white'/%3E%3C/svg%3E">
                    </div>
                    <div class="node n-3" title="Kael">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%238b5cf6'/%3E%3Cpath d='M30,30 L70,70 M70,30 L30,70' stroke='white' stroke-width='8'/%3E%3C/svg%3E">
                    </div>

                    <!-- Empty Slot -->
                    <div class="empty-slot">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </div>
                </div>

                <div class="action-row">
                    <button class="btn btn-primary">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        Start Match
                    </button>
                    <button class="btn btn-secondary">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                        Invite
                    </button>
                    <button class="btn btn-danger">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                        Leave
                    </button>
                </div>
            </div>
        </main>

        <!-- Right Detail Panel -->
        <aside class="detail-panel" id="detailPanel">
            <div class="hero-section">
                <div class="hero-avatar-large">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2310b981'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E" id="p-avatar">
                </div>
                <div class="hero-name" id="p-name">Viper</div>
                <div class="hero-tag" id="p-tag">#8492 • In Game</div>
                <div class="level-pill">
                    <span>LVL</span>
                    <span id="p-lvl">89</span>
                </div>
            </div>

            <div class="stats-area">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-val" id="p-wins">1.4k</div>
                        <div class="stat-lbl">Wins</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val" id="p-mmr">2,450</div>
                        <div class="stat-lbl">MMR</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val" id="p-rate">54%</div>
                        <div class="stat-lbl">Win Rate</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val" id="p-rank">Plat II</div>
                        <div class="stat-lbl">Rank</div>
                    </div>
                </div>
            </div>

            <div class="panel-actions">
                <button class="btn btn-secondary" style="width:100%; justify-content:center;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    Whisper
                </button>
                <button class="btn btn-secondary" style="width:100%; justify-content:center; border-color: var(--accent-primary); color: var(--accent-primary); background: rgba(59, 130, 246, 0.05);">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                    View Profile
                </button>
                <button class="btn btn-secondary" style="width:100%; justify-content:center;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="17" y1="11" x2="23" y2="11"></line></svg>
                    Invite to Party
                </button>
            </div>
        </aside>
    </div>

    <script>
        const friends = {
            'Viper': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2310b981'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E",
                name: "Viper", tag: "#8492 • In Game", lvl: "89",
                wins: "1.4k", mmr: "2,450", rate: "54%", rank: "Plat II"
            },
            'Nova': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23f59e0b'/%3E%3Ccircle cx='50' cy='50' r='20' fill='white'/%3E%3C/svg%3E",
                name: "Nova", tag: "#1102 • Online", lvl: "42",
                wins: "320", mmr: "1,800", rate: "48%", rank: "Gold I"
            },
            'Kael': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%238b5cf6'/%3E%3Cpath d='M30,30 L70,70 M70,30 L30,70' stroke='white' stroke-width='8'/%3E%3C/svg%3E",
                name: "Kael", tag: "#9921 • AFK", lvl: "12",
                wins: "45", mmr: "900", rate: "32%", rank: "Bronze III"
            }
        };

        function selectFriend(element, name) {
            document.querySelectorAll('.friend-item').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');

            const data = friends[name];
            if(data) {
                const panel = document.getElementById('detailPanel');
                panel.style.opacity = '0';
                panel.style.transform = 'translateX(10px)';
                panel.style.transition = 'all 0.2s ease';

                setTimeout(() => {
                    document.getElementById('p-avatar').src = data.img;
                    document.getElementById('p-name').textContent = data.name;
                    document.getElementById('p-tag').textContent = data.tag;
                    document.getElementById('p-lvl').textContent = data.lvl;
                    
                    document.getElementById('p-wins').textContent = data.wins;
                    document.getElementById('p-mmr').textContent = data.mmr;
                    document.getElementById('p-rate').textContent = data.rate;
                    document.getElementById('p-rank').textContent = data.rank;

                    panel.style.opacity = '1';
                    panel.style.transform = 'translateX(0)';
                }, 200);
            }
        }
    </script>
</body>
</html>
