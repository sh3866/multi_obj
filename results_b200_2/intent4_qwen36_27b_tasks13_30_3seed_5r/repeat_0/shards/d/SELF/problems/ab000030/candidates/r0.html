<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social & Party Interface</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --bg-panel: #161b28;
            --bg-card: #1e2336;
            --bg-hover: #262d45;
            --accent-primary: #3b82f6; /* Electric Blue */
            --accent-glow: rgba(59, 130, 246, 0.4);
            --accent-secondary: #f59e0b; /* Amber */
            --accent-danger: #ef4444;
            --accent-success: #10b981;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: #2d3748;
            
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            --ease-elastic: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(245, 158, 11, 0.05) 0%, transparent 25%);
        }

        /* --- Layout Grid --- */
        .app-container {
            width: 1280px;
            height: 800px;
            background: var(--bg-panel);
            border-radius: 24px;
            box-shadow: 
                0 0 0 1px var(--border-color),
                0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: grid;
            grid-template-columns: 320px 1fr 360px;
            grid-template-rows: 80px 1fr;
            overflow: hidden;
            position: relative;
        }

        /* --- Header --- */
        .app-header {
            grid-column: 1 / -1;
            background: rgba(22, 27, 40, 0.95);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .brand {
            font-weight: 800;
            font-size: 20px;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-primary), #60a5fa);
            border-radius: 8px;
            display: grid;
            place-items: center;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .nav-tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-dark);
            padding: 4px;
            border-radius: 12px;
        }

        .nav-tab {
            padding: 8px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s var(--ease-smooth);
            position: relative;
        }

        .nav-tab.active {
            background: var(--bg-card);
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .nav-tab:hover:not(.active) {
            color: var(--text-main);
        }

        .nav-tab .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--accent-danger);
            color: white;
            font-size: 10px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-dark);
            animation: pulse 2s infinite;
        }

        /* --- Left Sidebar (Friends List) --- */
        .sidebar {
            background: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 24px;
        }

        .search-bar {
            position: relative;
        }

        .search-input {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 12px 16px 12px 40px;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-primary);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 16px;
            height: 16px;
        }

        .list-section {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            /* Hide scrollbar */
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }
        .list-section::-webkit-scrollbar { display: none; }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 8px;
            margin-top: 16px;
        }

        .friend-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
        }

        .friend-item:hover {
            background: var(--bg-hover);
        }

        .friend-item.active {
            background: rgba(59, 130, 246, 0.1);
        }

        .friend-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 20px;
            width: 3px;
            background: var(--accent-primary);
            border-radius: 0 4px 4px 0;
        }

        .avatar-wrapper {
            position: relative;
            margin-right: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
        }

        .friend-item.active .avatar {
            border-color: var(--accent-primary);
        }

        .status-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--bg-panel);
        }

        .status-online { background: var(--accent-success); }
        .status-afk { background: var(--accent-secondary); }
        .status-offline { background: var(--text-muted); opacity: 0.5; }
        .status-ingame { background: var(--accent-primary); box-shadow: 0 0 8px var(--accent-primary); }

        .friend-info {
            flex: 1;
            min-width: 0; /* Text truncation */
        }

        .friend-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .friend-status-text {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- Center Stage (Party & Actions) --- */
        .main-stage {
            background: var(--bg-dark);
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 32px;
            overflow-y: auto;
        }

        /* The "Game Board" Visual Background */
        .stage-bg {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.5;
            pointer-events: none;
        }

        .party-container {
            position: relative;
            z-index: 2;
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .party-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .party-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .party-subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Party Orbit */
        .orbit-system {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .orbit-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 1px dashed var(--border-color);
            border-radius: 50%;
            animation: spin 60s linear infinite;
        }

        .orbit-ring:nth-child(2) {
            width: 70%;
            height: 70%;
            animation-duration: 40s;
            animation-direction: reverse;
        }

        .leader-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid var(--accent-primary);
            box-shadow: 0 0 30px var(--accent-glow);
            z-index: 5;
            position: relative;
            background: #000;
        }

        .party-member {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid var(--bg-panel);
            background: #000;
            z-index: 4;
            transition: transform 0.5s var(--ease-elastic);
            cursor: pointer;
        }

        .party-member:hover {
            transform: scale(1.1) !important;
            border-color: var(--accent-secondary);
        }

        /* Positioning members in circle */
        .party-member:nth-child(4) { top: 0; left: 50%; transform: translate(-50%, -50%); }
        .party-member:nth-child(5) { bottom: 20%; right: 0; transform: translate(50%, 50%); }
        .party-member:nth-child(6) { bottom: 20%; left: 0; transform: translate(-50%, 50%); }

        .slot-empty {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px dashed var(--text-muted);
            top: 50%;
            right: -40px;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 24px;
            opacity: 0.5;
            animation: bounce 2s infinite;
        }

        .action-bar {
            display: flex;
            gap: 16px;
            width: 100%;
            max-width: 500px;
            justify-content: center;
        }

        .btn {
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s var(--ease-smooth);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
            border-color: var(--text-muted);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .btn-danger:hover {
            background: var(--accent-danger);
            color: white;
        }

        /* --- Right Panel (Details) --- */
        .detail-panel {
            background: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .profile-header {
            padding: 40px 24px;
            text-align: center;
            background: linear-gradient(to bottom, rgba(59, 130, 246, 0.1), transparent);
            border-bottom: 1px solid var(--border-color);
        }

        .profile-avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 4px solid var(--bg-panel);
            box-shadow: 0 0 0 2px var(--accent-primary);
            margin: 0 auto 16px;
            background: #000;
        }

        .profile-name {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .profile-tag {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 12px;
        }

        .profile-level {
            display: inline-block;
            background: var(--accent-secondary);
            color: #000;
            font-weight: 800;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: var(--border-color);
            margin: 24px;
            border-radius: 12px;
            overflow: hidden;
        }

        .stat-item {
            background: var(--bg-card);
            padding: 16px;
            text-align: center;
        }

        .stat-val {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .detail-actions {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* --- Pending Requests (Bottom Left) --- */
        .requests-section {
            background: var(--bg-dark);
            padding: 24px;
            border-top: 1px solid var(--border-color);
        }

        .request-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .request-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .request-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        .req-btn-group {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: none;
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-accept { background: rgba(16, 185, 129, 0.2); color: var(--accent-success); }
        .btn-accept:hover { background: var(--accent-success); color: white; }
        .btn-decline { background: rgba(239, 68, 68, 0.2); color: var(--accent-danger); }
        .btn-decline:hover { background: var(--accent-danger); color: white; }

        /* --- Animations --- */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes bounce { 0%, 100% { transform: translateY(-50%); } 50% { transform: translateY(-60%); } }

        /* --- Utility --- */
        .text-glow { text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        
        /* SVG Icons */
        svg { fill: currentColor; }

    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
                        <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/>
                    </svg>
                </div>
                <span>NEXUS</span>
            </div>

            <nav class="nav-tabs">
                <div class="nav-tab active">Social</div>
                <div class="nav-tab">Guild</div>
                <div class="nav-tab">Shop</div>
            </nav>

            <div class="user-mini-profile">
                <!-- Current User Mini -->
                <div style="display:flex; align-items:center; gap:10px; cursor:pointer;">
                    <div style="text-align:right;">
                        <div style="font-size:14px; font-weight:700;">Commander_X</div>
                        <div style="font-size:11px; color:var(--accent-success);">Online</div>
                    </div>
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%233b82f6'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white' font-family='sans-serif'%3EX%3C/text%3E%3C/svg%3E" class="avatar" style="width:40px; height:40px;">
                </div>
            </div>
        </header>

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" class="search-input" placeholder="Search friends...">
            </div>

            <div class="list-section">
                <div class="section-title">Online — 4</div>
                
                <!-- Friend Items -->
                <div class="friend-item active" onclick="selectFriend(this, 'Viper')">
                    <div class="avatar-wrapper">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2310b981'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E" class="avatar">
                        <div class="status-dot status-ingame"></div>
                    </div>
                    <div class="friend-info">
                        <div class="friend-name">Viper</div>
                        <div class="friend-status-text">In Game: Arena</div>
                    </div>
                </div>

                <div class="friend-item" onclick="selectFriend(this, 'Nova')">
                    <div class="avatar-wrapper">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23f59e0b'/%3E%3Ccircle cx='50' cy='50' r='20' fill='white'/%3E%3C/svg%3E" class="avatar">
                        <div class="status-dot status-online"></div>
                    </div>
                    <div class="friend-info">
                        <div class="friend-name">Nova</div>
                        <div class="friend-status-text">In Lobby</div>
                    </div>
                </div>

                <div class="friend-item" onclick="selectFriend(this, 'Kael')">
                    <div class="avatar-wrapper">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%238b5cf6'/%3E%3Cpath d='M30,30 L70,70 M70,30 L30,70' stroke='white' stroke-width='8'/%3E%3C/svg%3E" class="avatar">
                        <div class="status-dot status-afk"></div>
                    </div>
                    <div class="friend-info">
                        <div class="friend-name">Kael</div>
                        <div class="friend-status-text">AFK</div>
                    </div>
                </div>
            </div>

            <div class="list-section" style="flex: 0;">
                <div class="section-title">Offline — 12</div>
                <div class="friend-item">
                    <div class="avatar-wrapper">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2364748b'/%3E%3C/svg%3E" class="avatar">
                        <div class="status-dot status-offline"></div>
                    </div>
                    <div class="friend-info">
                        <div class="friend-name">Rogue_One</div>
                        <div class="friend-status-text">Offline 2h</div>
                    </div>
                </div>
            </div>

            <!-- Pending Requests -->
            <div class="requests-section">
                <div class="section-title" style="margin-top:0;">Pending Requests (1)</div>
                <div class="request-card">
                    <div class="request-info">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ef4444'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E?%3C/text%3E%3C/svg%3E" class="request-avatar">
                        <div>
                            <div style="font-size:13px; font-weight:700;">TankMaster</div>
                            <div style="font-size:11px; color:var(--text-muted);">Lvl 45</div>
                        </div>
                    </div>
                    <div class="req-btn-group">
                        <button class="icon-btn btn-accept">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        </button>
                        <button class="icon-btn btn-decline">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Stage -->
        <main class="main-stage">
            <div class="stage-bg"></div>
            
            <div class="party-container">
                <div class="party-header">
                    <div class="party-title">Battle Squad</div>
                    <div class="party-subtitle">Level 1-100 • 3/5 Members</div>
                </div>

                <div class="orbit-system">
                    <div class="orbit-ring"></div>
                    <div class="orbit-ring"></div>
                    
                    <!-- Leader (Me) -->
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%233b82f6'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white' font-family='sans-serif'%3EX%3C/text%3E%3C/svg%3E" class="leader-avatar">
                    
                    <!-- Party Members -->
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2310b981'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E" class="party-member" title="Viper">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23f59e0b'/%3E%3Ccircle cx='50' cy='50' r='20' fill='white'/%3E%3C/svg%3E" class="party-member" title="Nova">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%238b5cf6'/%3E%3Cpath d='M30,30 L70,70 M70,30 L30,70' stroke='white' stroke-width='8'/%3E%3C/svg%3E" class="party-member" title="Kael">

                    <!-- Empty Slot -->
                    <div class="slot-empty">+</div>
                </div>

                <div class="action-bar">
                    <button class="btn btn-primary">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        Start Match
                    </button>
                    <button class="btn btn-secondary">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                        Invite
                    </button>
                    <button class="btn btn-danger">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                        Leave
                    </button>
                </div>
            </div>
        </main>

        <!-- Right Detail Panel -->
        <aside class="detail-panel">
            <div class="profile-header">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2310b981'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E" class="profile-avatar">
                <div class="profile-name">Viper</div>
                <div class="profile-tag">#8492 • Online</div>
                <div class="profile-level">LVL 89</div>
            </div>

            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-val">1.4k</div>
                    <div class="stat-label">Wins</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val">2,450</div>
                    <div class="stat-label">MMR</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val">54%</div>
                    <div class="stat-label">Win Rate</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val">Plat II</div>
                    <div class="stat-label">Rank</div>
                </div>
            </div>

            <div class="detail-actions">
                <button class="btn btn-secondary" style="width:100%; justify-content:center;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    Whisper
                </button>
                <button class="btn btn-secondary" style="width:100%; justify-content:center; border-color: var(--accent-primary); color: var(--accent-primary);">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                    View Profile
                </button>
                <button class="btn btn-secondary" style="width:100%; justify-content:center;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="17" y1="11" x2="23" y2="11"></line></svg>
                    Invite to Party
                </button>
            </div>
        </aside>
    </div>

    <script>
        // Simple interaction logic to switch the detail panel content based on selection
        const friends = {
            'Viper': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2310b981'/%3E%3Cpath d='M30,70 L50,30 L70,70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E",
                name: "Viper",
                tag: "#8492 • In Game",
                lvl: "89",
                wins: "1.4k", mmr: "2,450", rate: "54%", rank: "Plat II"
            },
            'Nova': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23f59e0b'/%3E%3Ccircle cx='50' cy='50' r='20' fill='white'/%3E%3C/svg%3E",
                name: "Nova",
                tag: "#1102 • Online",
                lvl: "42",
                wins: "320", mmr: "1,800", rate: "48%", rank: "Gold I"
            },
            'Kael': {
                img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%238b5cf6'/%3E%3Cpath d='M30,30 L70,70 M70,30 L30,70' stroke='white' stroke-width='8'/%3E%3C/svg%3E",
                name: "Kael",
                tag: "#9921 • AFK",
                lvl: "12",
                wins: "45", mmr: "900", rate: "32%", rank: "Bronze III"
            }
        };

        function selectFriend(element, name) {
            // Remove active class from all
            document.querySelectorAll('.friend-item').forEach(el => el.classList.remove('active'));
            // Add active to clicked
            element.classList.add('active');

            // Update Right Panel
            const data = friends[name];
            if(data) {
                const panel = document.querySelector('.detail-panel');
                
                // Fade out effect
                panel.style.opacity = '0';
                panel.style.transform = 'translateX(10px)';
                panel.style.transition = 'all 0.2s ease';

                setTimeout(() => {
                    document.querySelector('.profile-avatar').src = data.img;
                    document.querySelector('.profile-name').textContent = data.name;
                    document.querySelector('.profile-tag').textContent = data.tag;
                    document.querySelector('.profile-level').textContent = 'LVL ' + data.lvl;
                    
                    const stats = document.querySelectorAll('.stat-val');
                    stats[0].textContent = data.wins;
                    stats[1].textContent = data.mmr;
                    stats[2].textContent = data.rate;
                    stats[3].textContent = data.rank;

                    // Fade in
                    panel.style.opacity = '1';
                    panel.style.transform = 'translateX(0)';
                }, 200);
            }
        }

        // Tab switching logic (visual only)
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
            });
        });

    </script>
</body>
</html>
