<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce & Dash - Adventure Awaits</title>
    <style>
        :root {
            /* Palette - Dynamic */
            --c-sky-top: #2E86DE;
            --c-sky-bot: #54A0FF;
            --c-grass: #7BED9F;
            --c-dirt: #5F27CD;
            --c-dirt-light: #70A1FF;
            --c-ui-white: #ffffff;
            --c-accent: #FF9F43;
            --c-danger: #FF6B6B;
            --c-gold: #F1C40F;
            
            /* Typography */
            --font-main: system-ui, -apple-system, sans-serif;
            --font-display: 'Arial Black', Impact, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body {
            background: #111;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-main);
            overflow: hidden;
        }

        /* Main Game Container */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1600px;
            max-height: 900px;
            background: linear-gradient(180deg, var(--c-sky-top), var(--c-sky-bot));
            overflow: hidden;
            box-shadow: 0 0 100px rgba(0,0,0,0.5);
            transition: background 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* --- PARALLAX BACKGROUND --- */
        .bg-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            will-change: transform;
        }

        /* Clouds */
        .cloud {
            position: absolute;
            background: rgba(255,255,255,0.8);
            border-radius: 100px;
            animation: drift 40s linear infinite;
        }
        .cloud::after, .cloud::before {
            content: ''; position: absolute; background: inherit; border-radius: 50%;
        }
        .c1 { width: 120px; height: 50px; top: 20%; left: -10%; }
        .c1::after { width: 60px; height: 60px; top: -30px; left: 20px; }
        .c1::before { width: 50px; height: 50px; top: -20px; left: 50px; }
        
        .c2 { width: 180px; height: 60px; top: 10%; left: 40%; opacity: 0.6; animation-duration: 50s; }
        .c2::after { width: 80px; height: 80px; top: -40px; left: 30px; }

        /* Mountains */
        .mountain {
            position: absolute;
            bottom: 120px;
            width: 0; height: 0;
            border-left: 250px solid transparent;
            border-right: 250px solid transparent;
            border-bottom: 400px solid rgba(255,255,255,0.15);
            filter: blur(1px);
        }
        .m1 { left: -50px; transform: scale(0.8); opacity: 0.5; }
        .m2 { left: 30%; transform: scale(1.2); opacity: 0.3; bottom: 100px; }
        .m3 { right: -100px; transform: scale(0.9); opacity: 0.6; }

        /* --- CANVAS GAMEPLAY --- */
        #game-canvas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 400px;
            z-index: 5;
        }

        /* --- HERO --- */
        #hero-wrapper {
            position: absolute;
            bottom: 150px;
            left: 15%;
            width: 100px;
            height: 100px;
            z-index: 10;
            transition: transform 0.1s;
            cursor: pointer;
        }
        
        .hero-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 15px 10px rgba(0,0,0,0.2));
            animation: heroBounce 1.5s ease-in-out infinite;
        }

        /* --- UI OVERLAY --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20;
            pointer-events: none; /* Let clicks pass through to canvas if needed */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        .title-block {
            position: relative;
        }
        
        .game-title {
            font-family: var(--font-display);
            font-size: 4.5rem;
            line-height: 1;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: -2px;
            /* 3D Layered Text */
            text-shadow: 
                0 4px 0 var(--c-danger),
                0 8px 0 var(--c-danger),
                0 10px 10px rgba(0,0,0,0.2);
            transform: skewX(-5deg);
        }

        .world-title {
            font-family: var(--font-display);
            font-size: 1.8rem;
            color: var(--c-gold);
            text-shadow: 2px 2px 0 #000;
            letter-spacing: 4px;
            margin-top: 5px;
            display: block;
            transform: skewX(-5deg);
        }

        /* Score Board */
        .score-board {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.2);
            padding: 15px 25px;
            border-radius: 20px;
            color: white;
            text-align: right;
            pointer-events: auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transform: skewX(-5deg);
        }
        .score-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 5px;
            font-weight: 800;
            font-size: 1.2rem;
            font-family: monospace;
        }
        .score-row:last-child { margin-bottom: 0; }
        .coin-icon {
            width: 18px; height: 18px;
            background: var(--c-gold);
            border-radius: 50%;
            border: 2px solid #F39C12;
            box-shadow: inset 2px 2px 0 rgba(255,255,255,0.6);
        }

        /* Bottom Controls */
        .bottom-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: auto;
            padding-bottom: 20px;
        }

        /* World Selector */
        .world-selector {
            background: rgba(255,255,255,0.9);
            padding: 8px;
            border-radius: 50px;
            display: flex;
            gap: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border: 4px solid rgba(0,0,0,0.05);
        }
        .world-opt {
            width: 50px; height: 50px;
            border-radius: 50%;
            cursor: pointer;
            border: 4px solid transparent;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }
        .world-opt:hover { transform: translateY(-5px); }
        .world-opt.active { 
            transform: scale(1.1) translateY(-3px);
            border-color: var(--c-danger);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        /* World Patterns */
        .w-1 { background: radial-gradient(circle at 30% 30%, #55efc4, #00b894); }
        .w-2 { background: radial-gradient(circle at 30% 30%, #81ecec, #0984e3); }
        .w-3 { background: radial-gradient(circle at 30% 30%, #fab1a0, #e17055); }

        /* Controls Guide */
        .controls {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            padding: 15px 25px;
            border-radius: 16px;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .ctrl-row { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; font-weight: 600; }
        .key {
            background: linear-gradient(to bottom, #eee, #ccc);
            color: #333;
            padding: 4px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: 900;
            font-size: 0.8rem;
            box-shadow: 0 3px 0 #999;
            min-width: 25px;
            text-align: center;
        }

        /* Start Button */
        .btn-start-container {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            pointer-events: auto;
        }
        .btn-start {
            background: var(--c-danger);
            color: white;
            font-family: var(--font-display);
            font-size: 2rem;
            padding: 20px 70px;
            border: none;
            border-radius: 80px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 10px 0 #c0392b,
                0 15px 30px rgba(0,0,0,0.4);
            transition: all 0.1s ease;
        }
        .btn-start:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
            box-shadow: 
                0 13px 0 #c0392b,
                0 20px 40px rgba(0,0,0,0.4);
        }
        .btn-start:active {
            transform: translateY(8px);
            box-shadow: 
                0 2px 0 #c0392b,
                0 5px 10px rgba(0,0,0,0.4);
        }
        /* Shine */
        .btn-start::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-25deg);
            animation: shine 3s infinite;
        }

        /* Animations */
        @keyframes drift { from { transform: translateX(-200px); } to { transform: translateX(120vw); } }
        @keyframes heroBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes shine { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }
        @keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }

    </style>
</head>
<body>

    <div id="game-container">
        
        <!-- Parallax Background -->
        <div class="bg-layer" id="bg-layer">
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="mountain m1"></div>
            <div class="mountain m2"></div>
            <div class="mountain m3"></div>
        </div>

        <!-- Canvas Level -->
        <canvas id="game-canvas"></canvas>

        <!-- Hero -->
        <div id="hero-wrapper">
            <svg class="hero-svg" viewBox="0 0 100 100">
                <!-- Body -->
                <circle cx="50" cy="50" r="45" fill="#FF6B6B" stroke="#c0392b" stroke-width="4"/>
                <!-- Shine -->
                <path d="M25 30 Q 50 10 75 30" stroke="rgba(255,255,255,0.4)" stroke-width="5" fill="none" stroke-linecap="round"/>
                <!-- Face -->
                <g transform="translate(0, 5)">
                    <ellipse cx="50" cy="60" rx="20" ry="12" fill="white" opacity="0.9"/>
                    <!-- Eyes -->
                    <g class="eyes" style="animation: blink 4s infinite;">
                        <circle cx="40" cy="55" r="5" fill="#333"/>
                        <circle cx="60" cy="55" r="5" fill="#333"/>
                    </g>
                    <!-- Mouth -->
                    <path d="M42 68 Q 50 75 58 68" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <!-- Cheeks -->
                    <circle cx="32" cy="62" r="4" fill="#c0392b" opacity="0.3"/>
                    <circle cx="68" cy="62" r="4" fill="#c0392b" opacity="0.3"/>
                </g>
                <!-- Hat -->
                <path d="M30 20 L 50 5 L 70 20 Z" fill="#F1C40F" stroke="#F39C12" stroke-width="3" stroke-linejoin="round"/>
            </svg>
        </div>

        <!-- UI Overlay -->
        <div class="ui-layer">
            <header class="header">
                <div class="title-block">
                    <div class="game-title">Bounce & Dash</div>
                    <span class="world-title">WORLD 1-1</span>
                </div>
                <div class="score-board">
                    <div class="score-row">COINS <div class="coin-icon"></div> 042</div>
                    <div class="score-row">SCORE 12,500</div>
                </div>
            </header>

            <div class="bottom-area">
                <div class="world-selector">
                    <div class="world-opt w-1 active" onclick="setTheme('grass')"></div>
                    <div class="world-opt w-2" onclick="setTheme('ice')"></div>
                    <div class="world-opt w-3" onclick="setTheme('fire')"></div>
                </div>

                <div class="controls">
                    <div class="ctrl-row">Move <span class="key">←</span> <span class="key">→</span></div>
                    <div class="ctrl-row">Jump <span class="key">SPACE</span></div>
                    <div class="ctrl-row">Attack <span class="key">Z</span></div>
                </div>
            </div>
        </div>

        <div class="btn-start-container">
            <button class="btn-start">Start Adventure</button>
        </div>

    </div>

    <script>
        // --- CONFIG & THEMES ---
        const themes = {
            grass: {
                sky: ['#2E86DE', '#54A0FF'],
                grass: '#7BED9F',
                dirt: '#5F27CD',
                dirtDark: '#341f97',
                block: '#FAB1A0',
                blockDark: '#E17055',
                pipe: '#00B894',
                pipeDark: '#006266',
                enemy: '#8e44ad'
            },
            ice: {
                sky: ['#83a4d4', '#b6fbff'],
                grass: '#dff9fb',
                dirt: '#74b9ff',
                dirtDark: '#0984e3',
                block: '#dfe6e9',
                blockDark: '#b2bec3',
                pipe: '#74b9ff',
                pipeDark: '#0984e3',
                enemy: '#636e72'
            },
            fire: {
                sky: ['#fdcb6e', '#e17055'],
                grass: '#636e72',
                dirt: '#2d3436',
                dirtDark: '#000000',
                block: '#d63031',
                blockDark: '#b33939',
                pipe: '#d35400',
                pipeDark: '#a84300',
                enemy: '#e74c3c'
            }
        };

        let current = themes.grass;
        const root = document.documentElement;
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const hero = document.getElementById('hero-wrapper');
        const bgLayer = document.getElementById('bg-layer');

        // --- RESIZE ---
        function resize() {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
            draw();
        }
        window.addEventListener('resize', resize);

        // --- DRAWING HELPERS ---
        function rect(x, y, w, h, r, color) {
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, r);
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawGround() {
            const y = canvas.height - 100;
            // Grass Top
            rect(0, y, canvas.width, 20, 0, current.grass);
            // Dirt Body
            let grad = ctx.createLinearGradient(0, y+20, 0, canvas.height);
            grad.addColorStop(0, current.dirt);
            grad.addColorStop(1, current.dirtDark);
            rect(0, y+20, canvas.width, 80, 0, grad);
            
            // Dirt dots
            ctx.fillStyle = current.dirtDark;
            for(let i=0; i<canvas.width; i+=40) {
                ctx.beginPath(); ctx.arc(i+20, y+50, 3, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(i+60, y+80, 3, 0, Math.PI*2); ctx.fill();
            }
        }

        function drawBlock(x, y, w, h, type='normal') {
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(x+5, y+5, w, h);
            
            if(type === 'mystery') {
                rect(x, y, w, h, 6, '#F1C40F');
                // Bolts
                ctx.fillStyle = '#F39C12';
                ctx.fillRect(x+4, y+4, 4, 4);
                ctx.fillRect(x+w-8, y+4, 4, 4);
                ctx.fillRect(x+4, y+h-8, 4, 4);
                ctx.fillRect(x+w-8, y+h-8, 4, 4);
                // Question
                ctx.fillStyle = '#d35400';
                ctx.font = 'bold 30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('?', x+w/2, y+h/2 + 10);
            } else {
                rect(x, y, w, h, 4, current.block);
                // Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(x, y, w, 4);
                // Brick pattern
                ctx.strokeStyle = current.blockDark;
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, w, h);
            }
        }

        function drawPipe(x, y, w, h) {
            // Body
            rect(x+10, y+40, w-20, h-40, 0, current.pipe);
            // Head
            rect(x, y, w, 40, 5, current.pipe);
            // Outline/Shadow
            ctx.strokeStyle = current.pipeDark;
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, w, 40);
            ctx.strokeRect(x+10, y+40, w-20, h-40);
            // Shine
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(x+8, y+5, 8, 30);
            ctx.fillRect(x+15, y+45, 6, h-45);
        }

        function drawFlag(x, y, h) {
            // Pole
            ctx.fillStyle = '#bdc3c7';
            ctx.fillRect(x, y, 8, h);
            // Ball
            ctx.beginPath(); ctx.arc(x+4, y, 10, 0, Math.PI*2); ctx.fillStyle='#F1C40F'; ctx.fill();
            // Flag
            ctx.fillStyle = current.grass; // Using grass color for flag
            ctx.beginPath();
            ctx.moveTo(x+8, y+10);
            ctx.lineTo(x+70, y+30);
            ctx.lineTo(x+8, y+50);
            ctx.fill();
        }

        function drawEnemy(x, y) {
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.ellipse(x+25, y+40, 20, 5, 0, 0, Math.PI*2); ctx.fill();
            // Body
            ctx.fillStyle = current.enemy;
            ctx.beginPath();
            ctx.arc(x+25, y+20, 25, Math.PI, 0); // Top
            ctx.lineTo(x+50, y+40);
            ctx.lineTo(x, y+40);
            ctx.fill();
            // Eyes
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(x+15, y+25, 6, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+35, y+25, 6, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(x+15, y+25, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+35, y+25, 2, 0, Math.PI*2); ctx.fill();
        }

        function drawCoin(x, y) {
            ctx.fillStyle = '#F1C40F';
            ctx.beginPath(); ctx.ellipse(x, y, 8, 12, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#F39C12';
            ctx.beginPath(); ctx.ellipse(x, y, 4, 8, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.beginPath(); ctx.ellipse(x-3, y-3, 2, 4, 0, 0, Math.PI*2); ctx.fill();
        }

        function drawBush(x, y) {
            ctx.fillStyle = current.grass; // Use theme grass
            ctx.beginPath();
            ctx.arc(x, y, 30, 0, Math.PI*2);
            ctx.arc(x+30, y, 40, 0, Math.PI*2);
            ctx.arc(x+60, y, 30, 0, Math.PI*2);
            ctx.fill();
            // Detail
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.beginPath();
            ctx.arc(x+30, y+20, 20, 0, Math.PI*2);
            ctx.fill();
        }

        // --- MAIN DRAW ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const groundY = canvas.height - 100;

            drawGround();
            
            // Bushes
            drawBush(canvas.width * 0.1, groundY);
            drawBush(canvas.width * 0.8, groundY);

            // Platforms
            drawBlock(canvas.width * 0.2, groundY - 140, 50, 50, 'mystery');
            drawBlock(canvas.width * 0.4, groundY - 140, 60, 30);
            drawBlock(canvas.width * 0.5, groundY - 140, 60, 30);
            drawBlock(canvas.width * 0.6, groundY - 140, 60, 30);
            drawBlock(canvas.width * 0.75, groundY - 240, 150, 30);

            // Pipe
            drawPipe(canvas.width * 0.6, groundY - 70, 70, 70);

            // Goal
            drawFlag(canvas.width * 0.9, groundY - 250, 250);

            // Coins
            drawCoin(canvas.width * 0.22, groundY - 180);
            drawCoin(canvas.width * 0.45, groundY - 180);
            drawCoin(canvas.width * 0.8, groundY - 280);
            drawCoin(canvas.width * 0.85, groundY - 280);

            // Enemy
            drawEnemy(canvas.width * 0.55, groundY - 45);
        }

        // --- INTERACTIVITY ---
        
        // Theme Switcher
        window.setTheme = (name) => {
            const t = themes[name];
            current = t;
            
            // CSS Vars
            root.style.setProperty('--c-sky-top', t.sky[0]);
            root.style.setProperty('--c-sky-bot', t.sky[1]);
            root.style.setProperty('--c-grass', t.grass);
            
            // UI Active State
            document.querySelectorAll('.world-opt').forEach(el => el.classList.remove('active'));
            document.querySelector(`.w-${name === 'grass' ? '1' : name === 'ice' ? '2' : '3'}`).classList.add('active');
            
            draw();
        };

        // Mouse Parallax
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;

            // Move BG
            bgLayer.style.transform = `translate(${x * 30}px, ${y * 10}px)`;
            
            // Move Hero (simulated)
            const heroX = 15 + (x * 15); // Keep hero in left-ish area
            const heroY = 150 + (Math.abs(Math.sin(Date.now()/300)) * 15); // Bobbing
            
            // Only update position if not being dragged (simplified here)
            hero.style.left = `${Math.min(heroX, 40)}%`; // Clamp right side
            hero.style.bottom = `${heroY}px`;
        });

        // Init
        resize();
        // Start loop for smooth bobbing
        function animate() {
            const t = Date.now() / 300;
            const bob = Math.abs(Math.sin(t)) * 10;
            // Subtle hero animation without mouse movement
            // (Mouse handler overrides this, which is fine for this demo)
            requestAnimationFrame(animate);
        }
        animate();

    </script>
</body>
</html>
