<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce & Dash - Adventure Awaits</title>
    <style>
        :root {
            /* Dynamic Theme Variables */
            --c-sky-top: #4FACFE;
            --c-sky-bot: #00F2FE;
            --c-grass-top: #7CFC00;
            --c-grass-bot: #32CD32;
            --c-dirt: #8B4513;
            --c-dirt-dark: #5D2906;
            --c-block: #FF8C00;
            --c-accent: #FFD700;
            --c-hero: #FF4757;
            --c-hero-dark: #C41E3A;
            --c-ui-bg: rgba(255, 255, 255, 0.15);
            --c-ui-border: rgba(255, 255, 255, 0.3);
            --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --font-display: 'Impact', 'Arial Black', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a1a;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-main);
            overflow: hidden;
            user-select: none;
        }

        /* Main Game Container */
        #game-screen {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1600px;
            max-height: 900px;
            background: linear-gradient(to bottom, var(--c-sky-top), var(--c-sky-bot));
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0,0,0,0.6);
            transition: background 1s ease;
        }

        /* --- PARALLAX BACKGROUND LAYERS --- */
        .scene-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transition: transform 0.1s linear;
        }

        /* Clouds */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50px;
            animation: floatCloud 30s linear infinite;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .cloud::after, .cloud::before {
            content: ''; position: absolute; background: inherit; border-radius: 50%;
        }
        
        .c1 { width: 140px; height: 50px; top: 15%; left: -150px; animation-duration: 25s; }
        .c1::after { width: 60px; height: 60px; top: -30px; left: 20px; }
        .c1::before { width: 50px; height: 50px; top: -20px; left: 60px; }

        .c2 { width: 100px; height: 35px; top: 25%; left: -120px; animation-duration: 35s; animation-delay: 10s; opacity: 0.7; transform: scale(0.8); }
        .c2::after { width: 40px; height: 40px; top: -20px; left: 15px; }

        .c3 { width: 160px; height: 55px; top: 10%; left: -160px; animation-duration: 20s; animation-delay: 5s; }
        .c3::after { width: 70px; height: 70px; top: -35px; left: 25px; }
        .c3::before { width: 60px; height: 60px; top: -25px; left: 70px; }

        /* Mountains (CSS Shapes) */
        .mountain {
            position: absolute;
            bottom: 100px; /* Base level */
            width: 0; height: 0;
            border-left: 200px solid transparent;
            border-right: 200px solid transparent;
            border-bottom: 350px solid rgba(255,255,255,0.3);
            opacity: 0.6;
            filter: blur(2px);
        }
        .m1 { left: 5%; border-bottom-color: rgba(255,255,255,0.4); z-index: 1; }
        .m2 { left: 35%; border-bottom-color: rgba(255,255,255,0.2); transform: scale(1.3); z-index: 0; bottom: 80px; }
        .m3 { right: 15%; border-bottom-color: rgba(255,255,255,0.5); transform: scale(0.9); z-index: 1; }

        /* --- CANVAS LEVEL --- */
        #level-canvas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 350px; 
            z-index: 5;
        }

        /* --- HERO --- */
        #hero-container {
            position: absolute;
            bottom: 140px; 
            left: 20%;
            z-index: 10;
            width: 90px;
            height: 90px;
            transition: left 0.2s ease-out, transform 0.2s ease-out;
            cursor: pointer;
        }
        #hero-container:hover {
            transform: scale(1.1);
        }

        /* --- UI OVERLAY --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            pointer-events: none;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .game-title {
            font-family: var(--font-display);
            font-size: 5rem;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 
                0 4px 0 var(--c-hero),
                0 8px 0 var(--c-hero-dark),
                0 15px 20px rgba(0,0,0,0.3);
            letter-spacing: 2px;
            transform: skew(-5deg);
            line-height: 0.8;
            position: relative;
        }
        .game-title .sub {
            display: block;
            font-size: 1.8rem;
            color: var(--c-accent);
            text-shadow: 2px 2px 0 #000;
            letter-spacing: 4px;
            margin-top: 10px;
            transform: skew(5deg);
            font-family: var(--font-main);
            font-weight: 800;
        }

        .stats-box {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255,255,255,0.2);
            padding: 15px 30px;
            border-radius: 20px;
            color: white;
            text-align: right;
            pointer-events: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform: skew(-5deg);
        }
        .stat-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-bottom: 8px;
            font-weight: 800;
            font-size: 1.4rem;
            text-shadow: 1px 1px 0 #000;
        }
        .stat-row:last-child { margin-bottom: 0; }
        .icon-coin { 
            width: 20px; height: 20px; 
            background: var(--c-accent); 
            border-radius: 50%; 
            border: 2px solid #DAA520;
            box-shadow: inset 2px 2px 0 rgba(255,255,255,0.5);
        }

        /* Bottom Section */
        .bottom-controls {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            padding-bottom: 20px;
        }

        /* World Selector */
        .world-selector {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px;
            border-radius: 50px;
            display: flex;
            gap: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border: 4px solid rgba(0,0,0,0.1);
        }
        .world-btn {
            width: 55px; height: 55px;
            border-radius: 50%;
            border: 4px solid transparent;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        .world-btn:hover { transform: translateY(-5px) scale(1.1); }
        .world-btn.active { 
            border-color: var(--c-hero); 
            transform: scale(1.15);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        /* CSS Patterns for worlds */
        .w-grass { background: radial-gradient(circle at 30% 30%, #7CFC00, #32CD32); }
        .w-ice { background: radial-gradient(circle at 30% 30%, #E0FFFF, #87CEFA); }
        .w-fire { background: radial-gradient(circle at 30% 30%, #FF4500, #8B0000); }

        /* Controls Guide */
        .controls-guide {
            color: white;
            text-align: right;
            background: rgba(0,0,0,0.5);
            padding: 15px 25px;
            border-radius: 16px;
            pointer-events: auto;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .key-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin: 6px 0;
            font-size: 0.95rem;
            font-weight: 600;
            text-shadow: 1px 1px 0 #000;
        }
        .key {
            background: linear-gradient(to bottom, #fff, #ddd);
            color: #333;
            padding: 4px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: 800;
            box-shadow: 0 4px 0 #999, 0 5px 5px rgba(0,0,0,0.2);
            font-size: 0.9rem;
            min-width: 30px;
            text-align: center;
        }

        /* Start Button */
        .start-btn-container {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            z-index: 30;
        }
        
        .start-btn {
            background: var(--c-hero);
            color: white;
            border: none;
            padding: 25px 80px;
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 
                0 15px 0 var(--c-hero-dark),
                0 25px 30px rgba(0,0,0,0.4);
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            letter-spacing: 3px;
            font-family: var(--font-display);
        }
        .start-btn:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 20px 0 var(--c-hero-dark),
                0 35px 40px rgba(0,0,0,0.4);
            filter: brightness(1.1);
        }
        .start-btn:active {
            transform: translateY(10px);
            box-shadow: 
                0 5px 0 var(--c-hero-dark),
                0 10px 10px rgba(0,0,0,0.4);
        }
        /* Shine effect */
        .start-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-20deg);
            animation: shine 4s infinite;
        }

        /* Animations */
        @keyframes floatCloud {
            0% { transform: translateX(-200px); }
            100% { transform: translateX(120vw); }
        }
        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* SVG Hero Styles */
        .hero-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(5px 10px 5px rgba(0,0,0,0.3));
            animation: bounce 2s ease-in-out infinite;
        }
        .eye { transform-origin: center; animation: blink 4s infinite; }
        @keyframes blink {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }

    </style>
</head>
<body>

    <div id="game-screen">
        
        <!-- Background Layers (Parallax) -->
        <div class="scene-layer" id="layer-back">
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="cloud c3"></div>
            <div class="mountain m1"></div>
            <div class="mountain m2"></div>
            <div class="mountain m3"></div>
        </div>

        <!-- The Level Preview (Canvas) -->
        <canvas id="level-canvas"></canvas>

        <!-- Hero Character -->
        <div id="hero-container">
            <svg class="hero-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Body -->
                <circle cx="50" cy="50" r="45" fill="var(--c-hero)" stroke="var(--c-hero-dark)" stroke-width="4" />
                <!-- Shine -->
                <path d="M25 35 Q 50 15 75 35" stroke="rgba(255,255,255,0.3)" stroke-width="6" fill="none" stroke-linecap="round" />
                <!-- Face -->
                <g class="face">
                    <ellipse cx="50" cy="60" rx="22" ry="14" fill="white" opacity="0.95" />
                    <!-- Eyes -->
                    <circle cx="40" cy="55" r="6" fill="#333" class="eye" />
                    <circle cx="60" cy="55" r="6" fill="#333" class="eye" />
                    <!-- Mouth -->
                    <path d="M42 68 Q 50 78 58 68" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round" />
                    <!-- Cheeks -->
                    <circle cx="30" cy="65" r="5" fill="#FF6B81" opacity="0.6" />
                    <circle cx="70" cy="65" r="5" fill="#FF6B81" opacity="0.6" />
                </g>
                <!-- Hat/Accessory -->
                <path d="M30 20 L 50 5 L 70 20 Z" fill="#FFD700" stroke="#E67E22" stroke-width="3" stroke-linejoin="round" />
            </svg>
        </div>

        <!-- UI Layer -->
        <div class="ui-layer">
            <header>
                <div class="game-title">
                    Bounce & Dash
                    <span class="sub">World 1-1</span>
                </div>
                <div class="stats-box">
                    <div class="stat-row">
                        <span>COINS</span>
                        <div class="icon-coin"></div>
                        <span>042</span>
                    </div>
                    <div class="stat-row">
                        <span>SCORE</span>
                        <span>12,500</span>
                    </div>
                </div>
            </header>

            <div class="bottom-controls">
                <div class="world-selector">
                    <div class="world-btn w-grass active" title="Green Hills"></div>
                    <div class="world-btn w-ice" title="Ice Peaks"></div>
                    <div class="world-btn w-fire" title="Lava Lands"></div>
                </div>

                <div class="controls-guide">
                    <div class="key-row"><span>Move</span> <span class="key">←</span> <span class="key">→</span></div>
                    <div class="key-row"><span>Jump</span> <span class="key">SPACE</span></div>
                    <div class="key-row"><span>Attack</span> <span class="key">Z</span></div>
                </div>
            </div>
        </div>

        <div class="start-btn-container">
            <button class="start-btn">Start Adventure</button>
        </div>

    </div>

    <script>
        // --- CANVAS LEVEL GENERATION ---
        const canvas = document.getElementById('level-canvas');
        const ctx = canvas.getContext('2d');

        // State for theme colors
        let currentTheme = {
            groundTop: '#7CFC00',
            groundBot: '#32CD32',
            dirt: '#8B4513',
            dirtDark: '#5D2906',
            block: '#8B4513',
            blockLight: '#A0522D',
            pipe: '#2ecc71',
            pipeDark: '#27ae60'
        };

        // Resize handling
        function resize() {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
            drawLevel();
        }
        window.addEventListener('resize', resize);

        // Helper: Draw Rounded Rect
        function roundRect(x, y, w, h, r, color, stroke) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            if(stroke) {
                ctx.strokeStyle = stroke;
                ctx.lineWidth = 4;
                ctx.stroke();
            }
        }

        // Helper: Draw Checkerboard Block
        function drawMysteryBlock(x, y, size) {
            const s = size;
            // Base
            ctx.fillStyle = currentTheme.block;
            ctx.fillRect(x, y, s, s);
            // Checkerboard pattern
            ctx.fillStyle = currentTheme.blockLight; 
            ctx.fillRect(x, y, s/2, s/2);
            ctx.fillRect(x + s/2, y + s/2, s/2, s/2);
            // Border
            ctx.strokeStyle = '#5D2906';
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, s, s);
            // Question mark
            ctx.fillStyle = '#FFD700';
            ctx.font = `bold ${s*0.6}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 2;
            ctx.fillText('?', x + s/2, y + s/2 + 2);
            ctx.shadowBlur = 0;
        }

        // Helper: Draw Pipe
        function drawPipe(x, y, w, h) {
            const headH = 45;
            // Pipe Body
            ctx.fillStyle = currentTheme.pipe;
            ctx.fillRect(x + 12, y + headH, w - 24, h - headH);
            // Pipe Head
            ctx.fillStyle = currentTheme.pipeDark;
            ctx.fillRect(x, y, w, headH);
            // Highlights
            ctx.fillStyle = '#58d68d';
            ctx.fillRect(x + 6, y, 12, headH); // Head shine
            ctx.fillRect(x + 17, y + headH, 6, h - headH); // Body shine
            // Outlines
            ctx.strokeStyle = '#1e8449';
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, w, headH);
            ctx.strokeRect(x+12, y+headH, w-24, h-headH);
        }

        // Helper: Draw Flag
        function drawFlag(x, y, h) {
            // Pole
            ctx.fillStyle = '#bdc3c7';
            ctx.fillRect(x, y, 10, h);
            // Ball on top
            ctx.beginPath();
            ctx.arc(x+5, y, 8, 0, Math.PI*2);
            ctx.fillStyle = '#f1c40f';
            ctx.fill();
            ctx.strokeStyle = '#d35400';
            ctx.lineWidth = 2;
            ctx.stroke();
            // Flag
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.moveTo(x+10, y+15);
            ctx.lineTo(x+70, y+35);
            ctx.lineTo(x+10, y+55);
            ctx.fill();
            ctx.strokeStyle = '#c0392b';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // Helper: Draw Enemy (Goomba-like)
        function drawEnemy(x, y) {
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(x+25, y+40, 22, 6, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Body (Mushroom shape)
            ctx.fillStyle = '#8e44ad'; // Purple enemy
            ctx.beginPath();
            ctx.arc(x+25, y+20, 25, Math.PI, 0); // Top dome
            ctx.lineTo(x+50, y+40);
            ctx.lineTo(x, y+40);
            ctx.fill();
            
            // Eyes
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(x+15, y+25, 6, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+35, y+25, 6, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(x+15, y+25, 2.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+35, y+25, 2.5, 0, Math.PI*2); ctx.fill();
            
            // Eyebrows
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(x+10, y+18); ctx.lineTo(x+20, y+22); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x+40, y+18); ctx.lineTo(x+30, y+22); ctx.stroke();
        }

        function drawLevel() {
            // Clear
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const groundY = canvas.height - 100;

            // 1. Draw Ground
            // Grass Top
            ctx.fillStyle = currentTheme.groundTop;
            ctx.fillRect(0, groundY, canvas.width, 20);
            // Grass Gradient
            let grad = ctx.createLinearGradient(0, groundY+20, 0, groundY+100);
            grad.addColorStop(0, currentTheme.groundBot);
            grad.addColorStop(1, currentTheme.dirt);
            ctx.fillStyle = grad;
            ctx.fillRect(0, groundY+20, canvas.width, 80);
            
            // Dirt pattern
            ctx.fillStyle = currentTheme.dirtDark;
            for(let i=0; i<canvas.width; i+=60) {
                ctx.beginPath(); ctx.arc(i+30, groundY+60, 4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(i+80, groundY+80, 4, 0, Math.PI*2); ctx.fill();
            }

            // 2. Draw Platforms
            const pW = 70; const pH = 25;
            
            // Floating blocks
            drawMysteryBlock(canvas.width * 0.2, groundY - 130, 55);
            
            // Row of blocks
            for(let i=0; i<3; i++) {
                roundRect(canvas.width * 0.4 + (i*70), groundY - 130, pW, pH, 6, currentTheme.block, currentTheme.dirtDark);
                // Grass on top
                ctx.fillStyle = currentTheme.groundTop;
                ctx.fillRect(canvas.width * 0.4 + (i*70), groundY - 130, pW, 8);
            }

            // High platform
            roundRect(canvas.width * 0.7, groundY - 220, 160, pH, 6, currentTheme.block, currentTheme.dirtDark);
            ctx.fillStyle = currentTheme.groundTop;
            ctx.fillRect(canvas.width * 0.7, groundY - 220, 160, 8);

            // 3. Draw Pipe
            drawPipe(canvas.width * 0.6, groundY - 70, 70, 70);

            // 4. Draw Flag (Goal)
            drawFlag(canvas.width * 0.88, groundY - 280, 280);

            // 5. Draw Coins
            const drawCoin = (x, y) => {
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.ellipse(x, y, 10, 14, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.strokeStyle = '#DAA520';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.ellipse(x-3, y-3, 3, 5, 0, 0, Math.PI*2);
                ctx.fill();
            }
            drawCoin(canvas.width * 0.2 + 27, groundY - 175);
            drawCoin(canvas.width * 0.7 + 30, groundY - 265);
            drawCoin(canvas.width * 0.7 + 70, groundY - 265);
            drawCoin(canvas.width * 0.7 + 110, groundY - 265);

            // 6. Draw Enemy
            drawEnemy(canvas.width * 0.5, groundY - 45);

            // 7. Draw Bushes (Decor)
            const drawBush = (x, y, scale) => {
                ctx.fillStyle = '#228B22';
                ctx.beginPath();
                ctx.arc(x, y, 35 * scale, 0, Math.PI * 2);
                ctx.arc(x + 30*scale, y, 45 * scale, 0, Math.PI * 2);
                ctx.arc(x + 60*scale, y, 35 * scale, 0, Math.PI * 2);
                ctx.fill();
            }
            drawBush(canvas.width * 0.15, groundY, 1.2);
            drawBush(canvas.width * 0.75, groundY, 0.9);
        }

        // Initial draw
        resize();

        // --- INTERACTIVITY ---
        
        // Hero movement simulation on hover
        const hero = document.getElementById('hero-container');
        const screen = document.getElementById('game-screen');
        const layerBack = document.getElementById('layer-back');

        screen.addEventListener('mousemove', (e) => {
            const rect = screen.getBoundingClientRect();
            const x = e.clientX - rect.left;
            
            // Parallax effect for background
            const moveX = (x / rect.width) * 20;
            layerBack.style.transform = `translateX(-${moveX}px)`;

            // Map mouse X to a percentage, but clamp it
            let percent = (x / rect.width) * 100;
            // Keep hero mostly in the left/middle area to not overlap UI
            if(percent > 45) percent = 45;
            if(percent < 5) percent = 5;
            
            hero.style.left = percent + '%';
            
            // Flip hero based on movement direction (simple check)
            // For simplicity, let's just bob him
            const bounceHeight = Math.abs(Math.sin(Date.now() / 200)) * 15;
            hero.style.transform = `translateY(-${bounceHeight}px)`;
        });

        // World Selector Logic
        const worlds = document.querySelectorAll('.world-btn');
        const root = document.documentElement;
        
        const themes = {
            'w-grass': { 
                sky: ['#4FACFE', '#00F2FE'], 
                groundTop: '#7CFC00', 
                groundBot: '#32CD32',
                dirt: '#8B4513',
                dirtDark: '#5D2906',
                block: '#8B4513',
                blockLight: '#A0522D',
                pipe: '#2ecc71',
                pipeDark: '#27ae60'
            },
            'w-ice': { 
                sky: ['#83a4d4', '#b6fbff'], 
                groundTop: '#E0FFFF', 
                groundBot: '#B0E0E6',
                dirt: '#778899',
                dirtDark: '#4682B4',
                block: '#B0C4DE',
                blockLight: '#E0FFFF',
                pipe: '#87CEEB',
                pipeDark: '#4682B4'
            },
            'w-fire': { 
                sky: ['#ff9966', '#ff5e62'], 
                groundTop: '#555555', 
                groundBot: '#333333',
                dirt: '#222222',
                dirtDark: '#000000',
                block: '#8B0000',
                blockLight: '#A52A2A',
                pipe: '#FF4500',
                pipeDark: '#8B0000'
            }
        };

        worlds.forEach(btn => {
            btn.addEventListener('click', () => {
                // Remove active class
                worlds.forEach(w => w.classList.remove('active'));
                btn.classList.add('active');

                // Change Theme
                const theme = themes[btn.classList[1]];
                root.style.setProperty('--c-sky-top', theme.sky[0]);
                root.style.setProperty('--c-sky-bot', theme.sky[1]);
                
                // Update canvas theme object
                currentTheme = {
                    groundTop: theme.groundTop,
                    groundBot: theme.groundBot,
                    dirt: theme.dirt,
                    dirtDark: theme.dirtDark,
                    block: theme.block,
                    blockLight: theme.blockLight,
                    pipe: theme.pipe,
                    pipeDark: theme.pipeDark
                };

                // Redraw canvas
                drawLevel();
            });
        });

    </script>
</body>
</html>
