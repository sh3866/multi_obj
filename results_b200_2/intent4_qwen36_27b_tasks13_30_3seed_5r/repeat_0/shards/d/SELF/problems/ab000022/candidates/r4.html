<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce & Dash - Adventure Awaits</title>
    <style>
        :root {
            /* Palette */
            --c-sky-top: #4facfe;
            --c-sky-bot: #00f2fe;
            --c-grass: #43e97b;
            --c-grass-dark: #38f9d7;
            --c-dirt: #6a11cb;
            --c-dirt-dark: #2575fc;
            --c-ui-white: #ffffff;
            --c-accent: #ff9a9e;
            --c-danger: #ff6b6b;
            --c-gold: #ffd700;
            --c-text: #2d3436;
            
            /* Typography */
            --font-main: system-ui, -apple-system, sans-serif;
            --font-display: 'Arial Black', Impact, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-font-smoothing: antialiased; }

        body {
            background: #0f0c29;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-main);
            overflow: hidden;
        }

        /* Main Game Container */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1600px;
            max-height: 900px;
            background: linear-gradient(180deg, var(--c-sky-top), var(--c-sky-bot));
            overflow: hidden;
            box-shadow: 0 0 150px rgba(0,0,0,0.8);
            transition: background 0.8s ease;
        }

        /* --- PARALLAX BACKGROUND --- */
        .bg-layer {
            position: absolute;
            top: -50px; left: -50px; 
            width: calc(100% + 100px); height: calc(100% + 100px);
            pointer-events: none;
            will-change: transform;
            transition: transform 0.1s linear;
        }

        /* Sun */
        .sun {
            position: absolute;
            top: 10%; right: 10%;
            width: 150px; height: 150px;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            box-shadow: 0 0 80px rgba(255,255,255,0.5);
            filter: blur(5px);
        }

        /* Clouds */
        .cloud {
            position: absolute;
            background: rgba(255,255,255,0.95);
            border-radius: 100px;
            animation: drift 60s linear infinite;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.1));
        }
        .cloud::after, .cloud::before {
            content: ''; position: absolute; background: inherit; border-radius: 50%;
        }
        
        .c1 { width: 180px; height: 70px; top: 20%; left: -20%; }
        .c1::after { width: 80px; height: 80px; top: -40px; left: 30px; }
        .c1::before { width: 70px; height: 70px; top: -30px; left: 80px; }
        
        .c2 { width: 120px; height: 50px; top: 35%; left: 50%; opacity: 0.8; animation-duration: 80s; transform: scale(0.9); }
        .c2::after { width: 60px; height: 60px; top: -30px; left: 30px; }

        /* Mountains - Layered Depth */
        .mountain-layer {
            position: absolute;
            bottom: 120px;
            width: 100%;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: -100px;
        }
        
        .mountain {
            width: 0; height: 0;
            border-left: 350px solid transparent;
            border-right: 350px solid transparent;
            border-bottom: 600px solid rgba(255,255,255,0.15);
            filter: blur(3px);
            margin-bottom: -50px;
        }
        .m1 { opacity: 0.5; transform: scale(1.2); z-index: 1; }
        .m2 { opacity: 0.4; transform: scale(0.9); z-index: 2; border-bottom-color: rgba(255,255,255,0.1); margin-left: -100px; }
        .m3 { opacity: 0.6; transform: scale(1.5); z-index: 0; }

        /* --- CANVAS GAMEPLAY --- */
        #game-canvas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 450px;
            z-index: 5;
        }

        /* --- HERO --- */
        #hero-wrapper {
            position: absolute;
            bottom: 160px;
            left: 12%;
            width: 140px;
            height: 140px;
            z-index: 10;
            transition: transform 0.1s;
            filter: drop-shadow(0 30px 20px rgba(0,0,0,0.3));
        }
        
        .hero-svg {
            width: 100%;
            height: 100%;
            animation: heroBounce 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        /* --- UI OVERLAY --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 60px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        .title-block {
            position: relative;
            animation: floatTitle 5s ease-in-out infinite;
            transform: skewX(-5deg);
        }
        
        .game-title {
            font-family: var(--font-display);
            font-size: 5.5rem;
            line-height: 0.85;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: -2px;
            text-shadow: 
                0 0 0 5px #fff,
                0 0 0 10px rgba(255,107,107,0.9),
                0 20px 0 rgba(0,0,0,0.2);
            margin-left: -10px;
        }

        .world-title {
            font-family: var(--font-display);
            font-size: 2.2rem;
            color: var(--c-gold);
            text-shadow: 3px 3px 0 #000, 0 0 30px rgba(255, 215, 0, 0.6);
            letter-spacing: 8px;
            margin-top: 20px;
            display: block;
            margin-left: -8px;
        }

        /* Score Board */
        .score-board {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.15);
            padding: 20px 35px;
            border-radius: 25px;
            color: white;
            text-align: right;
            pointer-events: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            transform: skewX(-5deg);
            border-left: 8px solid var(--c-gold);
        }
        .score-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 15px;
            margin-bottom: 8px;
            font-weight: 800;
            font-size: 1.4rem;
            font-family: monospace;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .score-row:last-child { margin-bottom: 0; }
        .coin-icon {
            width: 28px; height: 28px;
            background: var(--c-gold);
            border-radius: 50%;
            border: 3px solid #F39C12;
            box-shadow: inset 2px 2px 0 rgba(255,255,255,0.8), 0 5px 15px rgba(0,0,0,0.4);
            position: relative;
            animation: spinCoin 3s linear infinite;
        }
        .coin-icon::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 12px; height: 12px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
        }

        /* Bottom Controls */
        .bottom-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: auto;
            padding-bottom: 40px;
        }

        /* World Selector */
        .world-selector {
            background: rgba(255,255,255,0.95);
            padding: 12px 20px;
            border-radius: 60px;
            display: flex;
            gap: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            border: 5px solid rgba(255,255,255,0.6);
        }
        .world-opt {
            width: 65px; height: 65px;
            border-radius: 50%;
            cursor: pointer;
            border: 5px solid transparent;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 -6px 12px rgba(0,0,0,0.1);
        }
        .world-opt:hover { transform: translateY(-8px) scale(1.15); }
        .world-opt.active { 
            transform: scale(1.2) translateY(-5px);
            border-color: var(--c-danger);
            box-shadow: 0 15px 25px rgba(0,0,0,0.25);
        }
        /* World Patterns */
        .w-1 { background: radial-gradient(circle at 30% 30%, #55efc4, #00b894); }
        .w-2 { background: radial-gradient(circle at 30% 30%, #81ecec, #0984e3); }
        .w-3 { background: radial-gradient(circle at 30% 30%, #fab1a0, #e17055); }

        /* Controls Guide */
        .controls {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 20px 35px;
            border-radius: 25px;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }
        .ctrl-row { display: flex; align-items: center; gap: 15px; font-size: 1.1rem; font-weight: 700; letter-spacing: 0.5px; }
        .key {
            background: linear-gradient(to bottom, #ffffff, #e0e0e0);
            color: #2f3542;
            padding: 8px 14px;
            border-radius: 10px;
            font-family: monospace;
            font-weight: 900;
            font-size: 1rem;
            box-shadow: 0 5px 0 #bdc3c7, 0 8px 15px rgba(0,0,0,0.4);
            min-width: 35px;
            text-align: center;
            transition: transform 0.1s;
        }
        .key:active { transform: translateY(5px); box-shadow: 0 0 0 #bdc3c7; }

        /* Start Button */
        .btn-start-container {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            pointer-events: auto;
        }
        .btn-start {
            background: var(--c-danger);
            color: white;
            font-family: var(--font-display);
            font-size: 2.5rem;
            padding: 30px 90px;
            border: none;
            border-radius: 120px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 4px;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 18px 0 #c0392b,
                0 30px 60px rgba(0,0,0,0.5);
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            border: 5px solid rgba(255,255,255,0.25);
            text-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }
        .btn-start:hover {
            transform: translateY(-8px) scale(1.02);
            filter: brightness(1.1);
            box-shadow: 
                0 25px 0 #c0392b,
                0 45px 70px rgba(0,0,0,0.5);
        }
        .btn-start:active {
            transform: translateY(12px);
            box-shadow: 
                0 6px 0 #c0392b,
                0 12px 20px rgba(0,0,0,0.4);
        }
        /* Shine */
        .btn-start::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
            transform: skewX(-25deg);
            animation: shine 4s infinite;
        }

        /* Animations */
        @keyframes drift { from { transform: translateX(-200px); } to { transform: translateX(120vw); } }
        @keyframes heroBounce { 
            0%, 100% { transform: translateY(0) scaleY(1); } 
            50% { transform: translateY(-30px) scaleY(0.95); } 
            55% { transform: translateY(-30px) scaleY(0.95) scaleX(1.05); }
            60% { transform: translateY(0) scaleY(1.1) scaleX(0.9); }
        }
        @keyframes shine { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }
        @keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
        @keyframes floatTitle { 0%, 100% { transform: skewX(-5deg) translateY(0); } 50% { transform: skewX(-5deg) translateY(-12px); } }
        @keyframes spinCoin { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }

    </style>
</head>
<body>

    <div id="game-container">
        
        <!-- Parallax Background -->
        <div class="bg-layer" id="bg-layer">
            <div class="sun"></div>
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="mountain-layer">
                <div class="mountain m1"></div>
                <div class="mountain m2"></div>
                <div class="mountain m3"></div>
            </div>
        </div>

        <!-- Canvas Level -->
        <canvas id="game-canvas"></canvas>

        <!-- Hero -->
        <div id="hero-wrapper">
            <svg class="hero-svg" viewBox="0 0 100 100">
                <!-- Shadow -->
                <ellipse cx="50" cy="95" rx="35" ry="8" fill="rgba(0,0,0,0.25)" style="animation: heroBounce 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; transform-origin: center;"/>
                
                <!-- Body -->
                <g style="animation: heroBounce 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; transform-origin: 50px 90px;">
                    <circle cx="50" cy="50" r="45" fill="#FF6B6B" stroke="#c0392b" stroke-width="6"/>
                    <!-- Shine -->
                    <path d="M22 28 Q 50 8 78 28" stroke="rgba(255,255,255,0.6)" stroke-width="7" fill="none" stroke-linecap="round"/>
                    
                    <!-- Face -->
                    <g transform="translate(0, 5)">
                        <ellipse cx="50" cy="62" rx="24" ry="16" fill="white" opacity="0.95"/>
                        <!-- Eyes -->
                        <g class="eyes" style="animation: blink 4s infinite; transform-origin: 50px 55px;">
                            <circle cx="40" cy="55" r="7" fill="#333"/>
                            <circle cx="60" cy="55" r="7" fill="#333"/>
                            <circle cx="42" cy="52" r="3" fill="white"/>
                            <circle cx="62" cy="52" r="3" fill="white"/>
                        </g>
                        <!-- Mouth -->
                        <path d="M42 70 Q 50 80 58 70" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
                        <!-- Cheeks -->
                        <circle cx="28" cy="65" r="6" fill="#c0392b" opacity="0.5"/>
                        <circle cx="72" cy="65" r="6" fill="#c0392b" opacity="0.5"/>
                    </g>
                    <!-- Hat -->
                    <path d="M28 18 L 50 2 L 72 18 Z" fill="#F1C40F" stroke="#F39C12" stroke-width="4" stroke-linejoin="round"/>
                    <path d="M22 18 L 78 18 L 78 24 L 22 24 Z" fill="#F39C12"/>
                </g>
            </svg>
        </div>

        <!-- UI Overlay -->
        <div class="ui-layer">
            <header class="header">
                <div class="title-block">
                    <div class="game-title">Bounce & Dash</div>
                    <span class="world-title">WORLD 1-1</span>
                </div>
                <div class="score-board">
                    <div class="score-row">COINS <div class="coin-icon"></div> 042</div>
                    <div class="score-row">SCORE 12,500</div>
                </div>
            </header>

            <div class="bottom-area">
                <div class="world-selector">
                    <div class="world-opt w-1 active" onclick="setTheme('grass')"></div>
                    <div class="world-opt w-2" onclick="setTheme('ice')"></div>
                    <div class="world-opt w-3" onclick="setTheme('fire')"></div>
                </div>

                <div class="controls">
                    <div class="ctrl-row">Move <span class="key">←</span> <span class="key">→</span></div>
                    <div class="ctrl-row">Jump <span class="key" style="width: 70px">SPACE</span></div>
                    <div class="ctrl-row">Attack <span class="key">Z</span></div>
                </div>
            </div>
        </div>

        <div class="btn-start-container">
            <button class="btn-start">Start Adventure</button>
        </div>

    </div>

    <script>
        // --- CONFIG & THEMES ---
        const themes = {
            grass: {
                sky: ['#4facfe', '#00f2fe'],
                grass: '#43e97b',
                dirt: '#6a11cb',
                dirtDark: '#2575fc',
                block: '#FF9F43',
                blockDark: '#E67E22',
                pipe: '#00b894',
                pipeDark: '#006266',
                enemy: '#8e44ad'
            },
            ice: {
                sky: ['#83a4d4', '#b6fbff'],
                grass: '#dff9fb',
                dirt: '#74b9ff',
                dirtDark: '#0984e3',
                block: '#dfe6e9',
                blockDark: '#b2bec3',
                pipe: '#74b9ff',
                pipeDark: '#0984e3',
                enemy: '#636e72'
            },
            fire: {
                sky: ['#fdcb6e', '#e17055'],
                grass: '#636e72',
                dirt: '#2d3436',
                dirtDark: '#000000',
                block: '#d63031',
                blockDark: '#b33939',
                pipe: '#d35400',
                pipeDark: '#a84300',
                enemy: '#e74c3c'
            }
        };

        let current = themes.grass;
        const root = document.documentElement;
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const hero = document.getElementById('hero-wrapper');
        const bgLayer = document.getElementById('bg-layer');

        // --- RESIZE ---
        function resize() {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
            draw();
        }
        window.addEventListener('resize', resize);

        // --- DRAWING HELPERS ---
        function rect(x, y, w, h, r, color) {
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, r);
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawGround() {
            const y = canvas.height - 140;
            // Grass Top
            rect(0, y, canvas.width, 30, 0, current.grass);
            
            // Dirt Body
            let grad = ctx.createLinearGradient(0, y+30, 0, canvas.height);
            grad.addColorStop(0, current.dirt);
            grad.addColorStop(1, current.dirtDark);
            rect(0, y+30, canvas.width, 110, 0, grad);
            
            // Dirt dots
            ctx.fillStyle = current.dirtDark;
            for(let i=0; i<canvas.width; i+=60) {
                ctx.beginPath(); ctx.arc(i+30, y+70, 5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(i+80, y+100, 5, 0, Math.PI*2); ctx.fill();
            }
        }

        function drawBlock(x, y, w, h, type='normal') {
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(x+10, y+10, w, h);
            
            if(type === 'mystery') {
                rect(x, y, w, h, 10, '#F1C40F');
                // Bolts
                ctx.fillStyle = '#F39C12';
                ctx.fillRect(x+8, y+8, 8, 8);
                ctx.fillRect(x+w-16, y+8, 8, 8);
                ctx.fillRect(x+8, y+h-16, 8, 8);
                ctx.fillRect(x+w-16, y+h-16, 8, 8);
                // Question
                ctx.fillStyle = '#d35400';
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('?', x+w/2, y+h/2 + 14);
            } else {
                rect(x, y, w, h, 8, current.block);
                // Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.fillRect(x, y, w, 8);
                // Brick pattern
                ctx.strokeStyle = current.blockDark;
                ctx.lineWidth = 4;
                ctx.strokeRect(x, y, w, h);
            }
        }

        function drawPipe(x, y, w, h) {
            // Body
            rect(x+14, y+50, w-28, h-50, 0, current.pipe);
            // Head
            rect(x, y, w, 50, 10, current.pipe);
            // Outline/Shadow
            ctx.strokeStyle = current.pipeDark;
            ctx.lineWidth = 5;
            ctx.strokeRect(x, y, w, 50);
            ctx.strokeRect(x+14, y+50, w-28, h-50);
            // Shine
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.fillRect(x+12, y+8, 12, 40);
            ctx.fillRect(x+20, y+55, 10, h-55);
        }

        function drawFlag(x, y, h) {
            // Pole
            ctx.fillStyle = '#bdc3c7';
            ctx.fillRect(x, y, 12, h);
            // Ball
            ctx.beginPath(); ctx.arc(x+6, y, 14, 0, Math.PI*2); ctx.fillStyle='#F1C40F'; ctx.fill();
            ctx.strokeStyle = '#F39C12'; ctx.lineWidth = 3; ctx.stroke();
            // Flag
            ctx.fillStyle = current.grass; // Using grass color for flag
            ctx.beginPath();
            ctx.moveTo(x+12, y+20);
            ctx.lineTo(x+90, y+45);
            ctx.lineTo(x+12, y+70);
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.stroke();
        }

        function drawEnemy(x, y) {
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.ellipse(x+25, y+45, 24, 7, 0, 0, Math.PI*2); ctx.fill();
            // Body
            ctx.fillStyle = current.enemy;
            ctx.beginPath();
            ctx.arc(x+25, y+22, 27, Math.PI, 0); // Top
            ctx.lineTo(x+52, y+45);
            ctx.lineTo(x, y+45);
            ctx.fill();
            // Eyes
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(x+15, y+28, 8, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+35, y+28, 8, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(x+15, y+28, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+35, y+28, 3, 0, Math.PI*2); ctx.fill();
        }

        function drawCoin(x, y) {
            ctx.fillStyle = '#F1C40F';
            ctx.beginPath(); ctx.ellipse(x, y, 12, 16, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#F39C12';
            ctx.beginPath(); ctx.ellipse(x, y, 6, 12, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.beginPath(); ctx.ellipse(x-5, y-5, 4, 8, 0, 0, Math.PI*2); ctx.fill();
        }

        function drawBush(x, y) {
            ctx.fillStyle = current.grass; // Use theme grass
            ctx.beginPath();
            ctx.arc(x, y, 40, 0, Math.PI*2);
            ctx.arc(x+40, y, 50, 0, Math.PI*2);
            ctx.arc(x+80, y, 40, 0, Math.PI*2);
            ctx.fill();
            // Detail
            ctx.fillStyle = 'rgba(0,0,0,0.05)';
            ctx.beginPath();
            ctx.arc(x+40, y+30, 30, 0, Math.PI*2);
            ctx.fill();
        }

        // --- MAIN DRAW ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const groundY = canvas.height - 140;

            drawGround();
            
            // Bushes
            drawBush(canvas.width * 0.1, groundY);
            drawBush(canvas.width * 0.8, groundY);

            // Platforms
            drawBlock(canvas.width * 0.2, groundY - 180, 70, 70, 'mystery');
            drawBlock(canvas.width * 0.4, groundY - 180, 80, 40);
            drawBlock(canvas.width * 0.5, groundY - 180, 80, 40);
            drawBlock(canvas.width * 0.6, groundY - 180, 80, 40);
            drawBlock(canvas.width * 0.75, groundY - 320, 180, 40);

            // Pipe
            drawPipe(canvas.width * 0.6, groundY - 90, 90, 90);

            // Goal
            drawFlag(canvas.width * 0.9, groundY - 320, 320);

            // Coins
            drawCoin(canvas.width * 0.22, groundY - 230);
            drawCoin(canvas.width * 0.45, groundY - 230);
            drawCoin(canvas.width * 0.8, groundY - 370);
            drawCoin(canvas.width * 0.85, groundY - 370);

            // Enemy
            drawEnemy(canvas.width * 0.55, groundY - 55);
        }

        // --- INTERACTIVITY ---
        
        // Theme Switcher
        window.setTheme = (name) => {
            const t = themes[name];
            current = t;
            
            // CSS Vars
            root.style.setProperty('--c-sky-top', t.sky[0]);
            root.style.setProperty('--c-sky-bot', t.sky[1]);
            root.style.setProperty('--c-grass', t.grass);
            
            // UI Active State
            document.querySelectorAll('.world-opt').forEach(el => el.classList.remove('active'));
            document.querySelector(`.w-${name === 'grass' ? '1' : name === 'ice' ? '2' : '3'}`).classList.add('active');
            
            draw();
        };

        // Mouse Parallax
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 2; // -1 to 1
            const y = (e.clientY / window.innerHeight - 0.5) * 2;

            // Move BG
            bgLayer.style.transform = `translate(${x * 50}px, ${y * 20}px)`;
            
            // Move Hero (simulated)
            const baseLeft = 12;
            const heroX = baseLeft + (x * 10); 
            const heroY = 160 + (Math.abs(Math.sin(Date.now()/300)) * 15);
            
            hero.style.left = `${Math.min(Math.max(heroX, 10), 40)}%`;
            hero.style.bottom = `${heroY}px`;
        });

        // Init
        resize();
        // Start loop for smooth bobbing
        function animate() {
            const t = Date.now() / 300;
            // Subtle hero animation without mouse movement
            requestAnimationFrame(animate);
        }
        animate();

    </script>
</body>
</html>
