<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce & Dash - Adventure Awaits</title>
    <style>
        :root {
            /* Core Palette */
            --c-sky-top: #4facfe;
            --c-sky-bot: #00f2fe;
            --c-grass: #43e97b;
            --c-grass-dark: #38f9d7;
            --c-dirt: #6a11cb;
            --c-dirt-dark: #2575fc;
            --c-ui-white: #ffffff;
            --c-accent: #ff9a9e;
            --c-danger: #ff6b6b;
            --c-gold: #ffd700;
            --c-text: #2d3436;
            
            /* Typography */
            --font-main: system-ui, -apple-system, sans-serif;
            --font-display: 'Arial Black', Impact, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-font-smoothing: antialiased; }

        body {
            background: #111;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-main);
            overflow: hidden;
        }

        /* Main Game Container */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1600px;
            max-height: 900px;
            background: linear-gradient(180deg, var(--c-sky-top), var(--c-sky-bot));
            overflow: hidden;
            box-shadow: 0 0 120px rgba(0,0,0,0.6);
            transition: background 0.8s ease;
        }

        /* --- PARALLAX BACKGROUND --- */
        .bg-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            will-change: transform;
        }

        /* Sun */
        .sun {
            position: absolute;
            top: 10%; right: 15%;
            width: 120px; height: 120px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(255,255,255,0.4);
            backdrop-filter: blur(2px);
        }

        /* Clouds */
        .cloud {
            position: absolute;
            background: rgba(255,255,255,0.9);
            border-radius: 100px;
            animation: drift 40s linear infinite;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.05));
        }
        .cloud::after, .cloud::before {
            content: ''; position: absolute; background: inherit; border-radius: 50%;
        }
        
        .c1 { width: 140px; height: 60px; top: 25%; left: -15%; }
        .c1::after { width: 70px; height: 70px; top: -35px; left: 25px; }
        .c1::before { width: 60px; height: 60px; top: -25px; left: 60px; }
        
        .c2 { width: 100px; height: 40px; top: 15%; left: 45%; opacity: 0.7; animation-duration: 55s; transform: scale(0.8); }
        .c2::after { width: 50px; height: 50px; top: -25px; left: 20px; }

        /* Mountains - Layered Depth */
        .mountain-layer {
            position: absolute;
            bottom: 150px;
            width: 100%;
            height: 400px;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
        }
        
        .mountain {
            width: 0; height: 0;
            border-left: 300px solid transparent;
            border-right: 300px solid transparent;
            border-bottom: 500px solid rgba(255,255,255,0.2);
            filter: blur(2px);
            margin-bottom: -20px;
        }
        .m1 { opacity: 0.6; transform: scale(1.1); z-index: 1; }
        .m2 { opacity: 0.4; transform: scale(0.8); z-index: 2; border-bottom-color: rgba(255,255,255,0.15); }
        .m3 { opacity: 0.7; transform: scale(1.3); z-index: 0; }

        /* --- CANVAS GAMEPLAY --- */
        #game-canvas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 420px;
            z-index: 5;
        }

        /* --- HERO --- */
        #hero-wrapper {
            position: absolute;
            bottom: 170px; /* Adjusted for better ground alignment */
            left: 15%;
            width: 120px;
            height: 120px;
            z-index: 10;
            transition: transform 0.1s;
            cursor: pointer;
            filter: drop-shadow(0 20px 15px rgba(0,0,0,0.25));
        }
        
        .hero-svg {
            width: 100%;
            height: 100%;
            animation: heroBounce 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        /* --- UI OVERLAY --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 50px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        .title-block {
            position: relative;
            animation: floatTitle 4s ease-in-out infinite;
        }
        
        .game-title {
            font-family: var(--font-display);
            font-size: 5rem;
            line-height: 0.9;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: -3px;
            text-shadow: 
                0 0 0 4px #fff,
                0 0 0 8px var(--c-danger),
                0 15px 0 rgba(0,0,0,0.15);
            transform: skewX(-6deg);
            margin-left: -5px;
        }

        .world-title {
            font-family: var(--font-display);
            font-size: 2rem;
            color: var(--c-gold);
            text-shadow: 2px 2px 0 #000, 0 0 20px rgba(255, 215, 0, 0.5);
            letter-spacing: 6px;
            margin-top: 15px;
            display: block;
            transform: skewX(-6deg);
            margin-left: -5px;
        }

        /* Score Board */
        .score-board {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255,255,255,0.1);
            padding: 15px 30px;
            border-radius: 20px;
            color: white;
            text-align: right;
            pointer-events: auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            transform: skewX(-6deg);
            border-left: 6px solid var(--c-gold);
        }
        .score-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-bottom: 6px;
            font-weight: 800;
            font-size: 1.3rem;
            font-family: monospace;
            letter-spacing: 1px;
        }
        .score-row:last-child { margin-bottom: 0; }
        .coin-icon {
            width: 24px; height: 24px;
            background: var(--c-gold);
            border-radius: 50%;
            border: 3px solid #F39C12;
            box-shadow: inset 2px 2px 0 rgba(255,255,255,0.8), 0 5px 10px rgba(0,0,0,0.3);
            position: relative;
        }
        .coin-icon::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 10px; height: 10px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
        }

        /* Bottom Controls */
        .bottom-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: auto;
            padding-bottom: 30px;
        }

        /* World Selector */
        .world-selector {
            background: rgba(255,255,255,0.95);
            padding: 10px 15px;
            border-radius: 50px;
            display: flex;
            gap: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 4px solid rgba(255,255,255,0.5);
        }
        .world-opt {
            width: 55px; height: 55px;
            border-radius: 50%;
            cursor: pointer;
            border: 4px solid transparent;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.1);
        }
        .world-opt:hover { transform: translateY(-5px) scale(1.1); }
        .world-opt.active { 
            transform: scale(1.15) translateY(-3px);
            border-color: var(--c-danger);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        /* World Patterns */
        .w-1 { background: radial-gradient(circle at 30% 30%, #55efc4, #00b894); }
        .w-2 { background: radial-gradient(circle at 30% 30%, #81ecec, #0984e3); }
        .w-3 { background: radial-gradient(circle at 30% 30%, #fab1a0, #e17055); }

        /* Controls Guide */
        .controls {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 18px 28px;
            border-radius: 20px;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .ctrl-row { display: flex; align-items: center; gap: 12px; font-size: 1rem; font-weight: 700; letter-spacing: 0.5px; }
        .key {
            background: linear-gradient(to bottom, #f1f2f6, #dfe4ea);
            color: #2f3542;
            padding: 6px 12px;
            border-radius: 8px;
            font-family: monospace;
            font-weight: 900;
            font-size: 0.9rem;
            box-shadow: 0 4px 0 #a4b0be, 0 5px 10px rgba(0,0,0,0.3);
            min-width: 30px;
            text-align: center;
            transition: transform 0.1s;
        }
        .key:active { transform: translateY(4px); box-shadow: 0 0 0 #a4b0be; }

        /* Start Button */
        .btn-start-container {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            pointer-events: auto;
        }
        .btn-start {
            background: var(--c-danger);
            color: white;
            font-family: var(--font-display);
            font-size: 2.2rem;
            padding: 25px 80px;
            border: none;
            border-radius: 100px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 15px 0 #c0392b,
                0 25px 40px rgba(0,0,0,0.4);
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            border: 4px solid rgba(255,255,255,0.2);
        }
        .btn-start:hover {
            transform: translateY(-5px);
            filter: brightness(1.15);
            box-shadow: 
                0 20px 0 #c0392b,
                0 35px 50px rgba(0,0,0,0.4);
        }
        .btn-start:active {
            transform: translateY(10px);
            box-shadow: 
                0 5px 0 #c0392b,
                0 10px 15px rgba(0,0,0,0.4);
        }
        /* Shine */
        .btn-start::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            transform: skewX(-25deg);
            animation: shine 4s infinite;
        }

        /* Animations */
        @keyframes drift { from { transform: translateX(-200px); } to { transform: translateX(120vw); } }
        @keyframes heroBounce { 
            0%, 100% { transform: translateY(0) scaleY(1); } 
            50% { transform: translateY(-25px) scaleY(0.95); } 
            55% { transform: translateY(-25px) scaleY(0.95) scaleX(1.05); }
            60% { transform: translateY(0) scaleY(1.1) scaleX(0.9); }
        }
        @keyframes shine { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }
        @keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
        @keyframes floatTitle { 0%, 100% { transform: skewX(-6deg) translateY(0); } 50% { transform: skewX(-6deg) translateY(-10px); } }

    </style>
</head>
<body>

    <div id="game-container">
        
        <!-- Parallax Background -->
        <div class="bg-layer" id="bg-layer">
            <div class="sun"></div>
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="mountain-layer">
                <div class="mountain m1"></div>
                <div class="mountain m2"></div>
                <div class="mountain m3"></div>
            </div>
        </div>

        <!-- Canvas Level -->
        <canvas id="game-canvas"></canvas>

        <!-- Hero -->
        <div id="hero-wrapper">
            <svg class="hero-svg" viewBox="0 0 100 100">
                <!-- Shadow -->
                <ellipse cx="50" cy="90" rx="35" ry="8" fill="rgba(0,0,0,0.2)" style="animation: heroBounce 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; transform-origin: center;"/>
                
                <!-- Body -->
                <g style="animation: heroBounce 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; transform-origin: 50px 90px;">
                    <circle cx="50" cy="50" r="45" fill="#FF6B6B" stroke="#c0392b" stroke-width="5"/>
                    <!-- Shine -->
                    <path d="M25 30 Q 50 10 75 30" stroke="rgba(255,255,255,0.5)" stroke-width="6" fill="none" stroke-linecap="round"/>
                    
                    <!-- Face -->
                    <g transform="translate(0, 5)">
                        <ellipse cx="50" cy="60" rx="22" ry="14" fill="white" opacity="0.95"/>
                        <!-- Eyes -->
                        <g class="eyes" style="animation: blink 4s infinite; transform-origin: 50px 55px;">
                            <circle cx="40" cy="55" r="6" fill="#333"/>
                            <circle cx="60" cy="55" r="6" fill="#333"/>
                            <circle cx="42" cy="53" r="2" fill="white"/>
                            <circle cx="62" cy="53" r="2" fill="white"/>
                        </g>
                        <!-- Mouth -->
                        <path d="M42 68 Q 50 76 58 68" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
                        <!-- Cheeks -->
                        <circle cx="30" cy="62" r="5" fill="#c0392b" opacity="0.4"/>
                        <circle cx="70" cy="62" r="5" fill="#c0392b" opacity="0.4"/>
                    </g>
                    <!-- Hat -->
                    <path d="M30 20 L 50 5 L 70 20 Z" fill="#F1C40F" stroke="#F39C12" stroke-width="4" stroke-linejoin="round"/>
                    <path d="M25 20 L 75 20 L 75 25 L 25 25 Z" fill="#F39C12"/>
                </g>
            </svg>
        </div>

        <!-- UI Overlay -->
        <div class="ui-layer">
            <header class="header">
                <div class="title-block">
                    <div class="game-title">Bounce & Dash</div>
                    <span class="world-title">WORLD 1-1</span>
                </div>
                <div class="score-board">
                    <div class="score-row">COINS <div class="coin-icon"></div> 042</div>
                    <div class="score-row">SCORE 12,500</div>
                </div>
            </header>

            <div class="bottom-area">
                <div class="world-selector">
                    <div class="world-opt w-1 active" onclick="setTheme('grass')"></div>
                    <div class="world-opt w-2" onclick="setTheme('ice')"></div>
                    <div class="world-opt w-3" onclick="setTheme('fire')"></div>
                </div>

                <div class="controls">
                    <div class="ctrl-row">Move <span class="key">←</span> <span class="key">→</span></div>
                    <div class="ctrl-row">Jump <span class="key" style="width: 60px">SPACE</span></div>
                    <div class="ctrl-row">Attack <span class="key">Z</span></div>
                </div>
            </div>
        </div>

        <div class="btn-start-container">
            <button class="btn-start">Start Adventure</button>
        </div>

    </div>

    <script>
        // --- CONFIG & THEMES ---
        const themes = {
            grass: {
                sky: ['#4facfe', '#00f2fe'],
                grass: '#43e97b',
                dirt: '#6a11cb',
                dirtDark: '#2575fc',
                block: '#FF9F43',
                blockDark: '#E67E22',
                pipe: '#00b894',
                pipeDark: '#006266',
                enemy: '#8e44ad'
            },
            ice: {
                sky: ['#83a4d4', '#b6fbff'],
                grass: '#dff9fb',
                dirt: '#74b9ff',
                dirtDark: '#0984e3',
                block: '#dfe6e9',
                blockDark: '#b2bec3',
                pipe: '#74b9ff',
                pipeDark: '#0984e3',
                enemy: '#636e72'
            },
            fire: {
                sky: ['#fdcb6e', '#e17055'],
                grass: '#636e72',
                dirt: '#2d3436',
                dirtDark: '#000000',
                block: '#d63031',
                blockDark: '#b33939',
                pipe: '#d35400',
                pipeDark: '#a84300',
                enemy: '#e74c3c'
            }
        };

        let current = themes.grass;
        const root = document.documentElement;
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const hero = document.getElementById('hero-wrapper');
        const bgLayer = document.getElementById('bg-layer');

        // --- RESIZE ---
        function resize() {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
            draw();
        }
        window.addEventListener('resize', resize);

        // --- DRAWING HELPERS ---
        function rect(x, y, w, h, r, color) {
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, r);
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawGround() {
            const y = canvas.height - 120;
            // Grass Top
            rect(0, y, canvas.width, 25, 0, current.grass);
            
            // Dirt Body
            let grad = ctx.createLinearGradient(0, y+25, 0, canvas.height);
            grad.addColorStop(0, current.dirt);
            grad.addColorStop(1, current.dirtDark);
            rect(0, y+25, canvas.width, 100, 0, grad);
            
            // Dirt dots
            ctx.fillStyle = current.dirtDark;
            for(let i=0; i<canvas.width; i+=50) {
                ctx.beginPath(); ctx.arc(i+25, y+60, 4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(i+70, y+90, 4, 0, Math.PI*2); ctx.fill();
            }
        }

        function drawBlock(x, y, w, h, type='normal') {
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(x+8, y+8, w, h);
            
            if(type === 'mystery') {
                rect(x, y, w, h, 8, '#F1C40F');
                // Bolts
                ctx.fillStyle = '#F39C12';
                ctx.fillRect(x+6, y+6, 6, 6);
                ctx.fillRect(x+w-12, y+6, 6, 6);
                ctx.fillRect(x+6, y+h-12, 6, 6);
                ctx.fillRect(x+w-12, y+h-12, 6, 6);
                // Question
                ctx.fillStyle = '#d35400';
                ctx.font = 'bold 35px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('?', x+w/2, y+h/2 + 12);
            } else {
                rect(x, y, w, h, 6, current.block);
                // Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(x, y, w, 6);
                // Brick pattern
                ctx.strokeStyle = current.blockDark;
                ctx.lineWidth = 3;
                ctx.strokeRect(x, y, w, h);
            }
        }

        function drawPipe(x, y, w, h) {
            // Body
            rect(x+12, y+45, w-24, h-45, 0, current.pipe);
            // Head
            rect(x, y, w, 45, 8, current.pipe);
            // Outline/Shadow
            ctx.strokeStyle = current.pipeDark;
            ctx.lineWidth = 4;
            ctx.strokeRect(x, y, w, 45);
            ctx.strokeRect(x+12, y+45, w-24, h-45);
            // Shine
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(x+10, y+6, 10, 35);
            ctx.fillRect(x+18, y+50, 8, h-50);
        }

        function drawFlag(x, y, h) {
            // Pole
            ctx.fillStyle = '#bdc3c7';
            ctx.fillRect(x, y, 10, h);
            // Ball
            ctx.beginPath(); ctx.arc(x+5, y, 12, 0, Math.PI*2); ctx.fillStyle='#F1C40F'; ctx.fill();
            // Flag
            ctx.fillStyle = current.grass; // Using grass color for flag
            ctx.beginPath();
            ctx.moveTo(x+10, y+15);
            ctx.lineTo(x+80, y+40);
            ctx.lineTo(x+10, y+65);
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.stroke();
        }

        function drawEnemy(x, y) {
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.ellipse(x+25, y+42, 22, 6, 0, 0, Math.PI*2); ctx.fill();
            // Body
            ctx.fillStyle = current.enemy;
            ctx.beginPath();
            ctx.arc(x+25, y+20, 25, Math.PI, 0); // Top
            ctx.lineTo(x+50, y+42);
            ctx.lineTo(x, y+42);
            ctx.fill();
            // Eyes
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(x+15, y+25, 7, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+35, y+25, 7, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(x+15, y+25, 2.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+35, y+25, 2.5, 0, Math.PI*2); ctx.fill();
        }

        function drawCoin(x, y) {
            ctx.fillStyle = '#F1C40F';
            ctx.beginPath(); ctx.ellipse(x, y, 10, 14, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#F39C12';
            ctx.beginPath(); ctx.ellipse(x, y, 5, 10, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.beginPath(); ctx.ellipse(x-4, y-4, 3, 6, 0, 0, Math.PI*2); ctx.fill();
        }

        function drawBush(x, y) {
            ctx.fillStyle = current.grass; // Use theme grass
            ctx.beginPath();
            ctx.arc(x, y, 35, 0, Math.PI*2);
            ctx.arc(x+35, y, 45, 0, Math.PI*2);
            ctx.arc(x+70, y, 35, 0, Math.PI*2);
            ctx.fill();
            // Detail
            ctx.fillStyle = 'rgba(0,0,0,0.05)';
            ctx.beginPath();
            ctx.arc(x+35, y+25, 25, 0, Math.PI*2);
            ctx.fill();
        }

        // --- MAIN DRAW ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const groundY = canvas.height - 120;

            drawGround();
            
            // Bushes
            drawBush(canvas.width * 0.1, groundY);
            drawBush(canvas.width * 0.8, groundY);

            // Platforms
            drawBlock(canvas.width * 0.2, groundY - 160, 60, 60, 'mystery');
            drawBlock(canvas.width * 0.4, groundY - 160, 70, 35);
            drawBlock(canvas.width * 0.5, groundY - 160, 70, 35);
            drawBlock(canvas.width * 0.6, groundY - 160, 70, 35);
            drawBlock(canvas.width * 0.75, groundY - 280, 160, 35);

            // Pipe
            drawPipe(canvas.width * 0.6, groundY - 80, 80, 80);

            // Goal
            drawFlag(canvas.width * 0.9, groundY - 280, 280);

            // Coins
            drawCoin(canvas.width * 0.22, groundY - 200);
            drawCoin(canvas.width * 0.45, groundY - 200);
            drawCoin(canvas.width * 0.8, groundY - 320);
            drawCoin(canvas.width * 0.85, groundY - 320);

            // Enemy
            drawEnemy(canvas.width * 0.55, groundY - 50);
        }

        // --- INTERACTIVITY ---
        
        // Theme Switcher
        window.setTheme = (name) => {
            const t = themes[name];
            current = t;
            
            // CSS Vars
            root.style.setProperty('--c-sky-top', t.sky[0]);
            root.style.setProperty('--c-sky-bot', t.sky[1]);
            root.style.setProperty('--c-grass', t.grass);
            
            // UI Active State
            document.querySelectorAll('.world-opt').forEach(el => el.classList.remove('active'));
            document.querySelector(`.w-${name === 'grass' ? '1' : name === 'ice' ? '2' : '3'}`).classList.add('active');
            
            draw();
        };

        // Mouse Parallax
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;

            // Move BG
            bgLayer.style.transform = `translate(${x * 40}px, ${y * 15}px)`;
            
            // Move Hero (simulated)
            const heroX = 15 + (x * 15); // Keep hero in left-ish area
            const heroY = 170 + (Math.abs(Math.sin(Date.now()/300)) * 15); // Bobbing
            
            // Only update position if not being dragged (simplified here)
            hero.style.left = `${Math.min(heroX, 40)}%`; // Clamp right side
            hero.style.bottom = `${heroY}px`;
        });

        // Init
        resize();
        // Start loop for smooth bobbing
        function animate() {
            const t = Date.now() / 300;
            const bob = Math.abs(Math.sin(t)) * 10;
            // Subtle hero animation without mouse movement
            requestAnimationFrame(animate);
        }
        animate();

    </script>
</body>
</html>
