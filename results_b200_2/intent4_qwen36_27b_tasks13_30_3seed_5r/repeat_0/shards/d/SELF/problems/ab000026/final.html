<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Play with Tiles</title>
<style>
  :root {
    --wood-dark: #1a110c;
    --wood-light: #3e2723;
    --wood-grain: repeating-linear-gradient(90deg, transparent 0px, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
    
    --felt-base: #1e5c48;
    --felt-dark: #143d30;
    --felt-highlight: #2a755b;
    
    --tile-body: #f4f1ea;
    --tile-stroke: #dcd8cf;
    --tile-shadow: rgba(0,0,0,0.4);
    --pip-color: #1c1c1c;
    
    --accent: #ffb300;
    --accent-glow: rgba(255, 179, 0, 0.5);
    --accent-dim: rgba(255, 179, 0, 0.1);
    
    --ui-bg: rgba(15, 15, 20, 0.8);
    --ui-border: rgba(255, 255, 255, 0.1);
    --text-main: #f0f0f0;
    --text-muted: #888;
    
    --font-stack: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }

  body, html {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background-color: var(--wood-dark);
    font-family: var(--font-stack);
    color: var(--text-main);
  }

  /* --- Environment --- */
  .wood-frame {
    position: absolute; inset: 0;
    background-color: var(--wood-dark);
    background-image: var(--wood-grain);
    box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
    display: flex; justify-content: center; align-items: center;
    perspective: 1200px;
  }

  /* --- The Table --- */
  #table-container {
    width: 95%; height: 90%;
    display: flex; flex-direction: column;
    transform: rotateX(2deg); /* Subtle 3D tilt */
    transform-style: preserve-3d;
  }

  #table-top {
    flex: 1;
    background: radial-gradient(ellipse at 50% 40%, var(--felt-highlight) 0%, var(--felt-base) 40%, var(--felt-dark) 100%);
    border-radius: 12px;
    box-shadow: 
      0 30px 60px rgba(0,0,0,0.7),
      inset 0 0 0 8px #0f0f0f,
      inset 0 0 40px rgba(0,0,0,0.6);
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.05);
  }

  /* --- HUD --- */
  .hud-container {
    position: absolute; top: 20px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 40px; z-index: 20;
    pointer-events: none;
  }

  .hud-pill {
    background: var(--ui-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--ui-border);
    border-radius: 40px;
    padding: 8px 20px 8px 12px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    pointer-events: auto;
    min-width: 140px;
  }

  .hud-pill.active-turn {
    border-color: var(--accent);
    box-shadow: 0 0 25px var(--accent-glow), 0 10px 30px rgba(0,0,0,0.5);
    transform: translateY(-5px) scale(1.05);
  }

  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: #222;
    display: flex; justify-content: center; align-items: center;
    font-size: 1.4rem;
    border: 2px solid #444;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
  }
  .hud-pill.active-turn .avatar { 
    border-color: var(--accent);
    background: #2a2a2a;
    box-shadow: 0 0 10px var(--accent-glow);
  }

  .hud-info { display: flex; flex-direction: column; }
  .hud-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 700; margin-bottom: 2px; }
  .hud-score { font-size: 1.5rem; font-weight: 800; color: var(--text-main); font-variant-numeric: tabular-nums; line-height: 1; }
  .hud-pill.active-turn .hud-score { color: var(--accent); }

  /* --- Board Layer --- */
  #board-layer {
    width: 100%; height: 100%;
    position: relative;
    display: flex; justify-content: center; align-items: center;
  }

  svg#game-board {
    width: 100%; height: 100%;
    overflow: visible;
  }

  /* --- Interaction Zones --- */
  .drop-zone {
    position: absolute;
    width: 60px; height: 60px;
    border-radius: 50%;
    border: 2px dashed rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.1);
    display: flex; justify-content: center; align-items: center;
    color: rgba(255,255,255,0.4);
    font-weight: 800; font-size: 1.5rem;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    cursor: pointer;
    z-index: 30;
    pointer-events: none;
    opacity: 0;
    transform: scale(0.8);
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  .drop-zone.visible {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
  }
  .drop-zone.active {
    border-color: var(--accent);
    background: var(--accent-dim);
    color: var(--accent);
    box-shadow: 0 0 20px var(--accent-glow);
    animation: pulse 2s infinite;
  }
  .drop-zone:hover { transform: scale(1.15); background: rgba(255, 179, 0, 0.2); }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255, 179, 0, 0.4); }
    70% { box-shadow: 0 0 0 15px rgba(255, 179, 0, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 179, 0, 0); }
  }

  /* --- Player Area --- */
  .player-area {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 160px;
    z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding-bottom: 20px;
    /* Gradient fades into the wood frame */
    background: linear-gradient(to top, rgba(20,15,10,0.9) 0%, rgba(20,15,10,0.4) 60%, transparent 100%);
  }

  /* Draw Pile */
  .boneyard {
    position: absolute; bottom: 40px; left: 40px;
    width: 70px; height: 110px;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    perspective: 800px;
  }
  .boneyard:hover { transform: translateY(-10px) rotateY(-5deg); }
  .boneyard:active { transform: scale(0.95) translateY(-5px); }
  
  .tile-back {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #102030, #0a1520);
    border-radius: 6px;
    border: 2px solid #fff;
    box-shadow: 
      2px 2px 0 #000, 
      4px 4px 0 #000, 
      6px 6px 15px rgba(0,0,0,0.6);
    position: relative;
    overflow: hidden;
  }
  /* Pattern on back */
  .tile-back::after {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(255,255,255,0.03) 4px, rgba(255,255,255,0.03) 8px);
  }
  
  .boneyard-count {
    position: absolute; bottom: -35px; left: 50%; transform: translateX(-50%);
    font-size: 1.1rem; font-weight: 800; color: #fff; text-shadow: 0 2px 4px #000;
    background: rgba(0,0,0,0.8); padding: 4px 12px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  /* Hand Rack */
  .hand-rack {
    display: flex; gap: 8px;
    padding: 10px 20px;
    perspective: 1000px;
    max-width: 95%;
    overflow-x: auto;
    scrollbar-width: none;
    margin-bottom: 10px;
  }
  .hand-rack::-webkit-scrollbar { display: none; }

  .hand-tile {
    width: 54px; height: 108px;
    background: var(--tile-body);
    border-radius: 6px;
    position: relative;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 
      0 10px 20px rgba(0,0,0,0.5),
      inset 0 0 0 1px rgba(255,255,255,0.5),
      inset 0 0 10px rgba(0,0,0,0.05);
    display: flex; flex-direction: column;
    border: 1px solid #aaa;
    flex-shrink: 0;
  }

  .hand-tile:hover {
    transform: translateY(-20px) scale(1.05);
    z-index: 20;
    box-shadow: 0 25px 50px rgba(0,0,0,0.6);
  }

  .hand-tile.selected {
    transform: translateY(-30px) scale(1.1);
    box-shadow: 0 0 0 2px var(--accent), 0 30px 60px rgba(0,0,0,0.7);
    z-index: 21;
    border-color: var(--accent);
  }

  .hand-tile.disabled {
    filter: grayscale(1) brightness(0.7);
    cursor: default;
    transform: scale(0.95);
    opacity: 0.8;
  }
  .hand-tile.disabled:hover { transform: scale(0.95); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }

  .tile-half {
    flex: 1; width: 100%;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    padding: 6px;
  }
  .tile-divider {
    height: 1px; background: #aaa; width: 80%; margin: 0 auto;
    box-shadow: 0 1px 0 rgba(255,255,255,0.8);
  }

  /* Pips CSS */
  .pip {
    background: var(--pip-color);
    border-radius: 50%;
    width: 7px; height: 7px;
    margin: auto;
    box-shadow: inset 0 1px 2px rgba(0,0,0,1), 0 1px 0 rgba(255,255,255,0.3);
  }

  /* Toast */
  #toast {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
    background: rgba(0,0,0,0.95);
    color: white; padding: 16px 32px; border-radius: 50px;
    pointer-events: none; opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 100; text-align: center; font-weight: 700;
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    letter-spacing: 0.5px;
    font-size: 1.2rem;
  }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

</style>
</head>
<body>

<div class="wood-frame">
  <div id="table-container">
    <div id="table-top">
      <!-- Top HUD -->
      <div class="hud-container">
        <div class="hud-pill" id="hud-opp">
          <div class="avatar">🤖</div>
          <div class="hud-info">
            <div class="hud-label">Opponent</div>
            <div class="hud-score" id="cpu-score">45</div>
          </div>
        </div>
        <div class="hud-pill active-turn" id="hud-player">
          <div class="hud-info" style="text-align: right;">
            <div class="hud-label">You</div>
            <div class="hud-score" id="player-score">12</div>
          </div>
          <div class="avatar">👤</div>
        </div>
      </div>

      <!-- Board -->
      <div id="board-layer">
        <svg id="game-board" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid meet">
          <defs>
            <!-- Tile Gradient -->
            <linearGradient id="tileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#fdfbf7;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#ecebe4;stop-opacity:1" />
            </linearGradient>
            
            <!-- Drop Shadow for Board Tiles -->
            <filter id="boardShadow" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="2" dy="8" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
            </filter>

            <!-- Reusable Tile Graphic (Horizontal 40x80) -->
            <g id="svg-tile">
              <!-- Body -->
              <rect x="-20" y="-40" width="40" height="80" rx="4" fill="url(#tileGrad)" stroke="#c0bdb5" stroke-width="1" filter="url(#boardShadow)"/>
              <!-- Inner Bevel -->
              <rect x="-19" y="-39" width="38" height="78" rx="3" fill="none" stroke="white" stroke-opacity="0.8" stroke-width="1"/>
              <!-- Divider -->
              <line x1="-17" y1="0" x2="17" y2="0" stroke="#bbb" stroke-width="1.5"/>
            </g>

            <!-- Pips (Centered at 0,0 relative to half) -->
            <!-- 1 -->
            <g id="pip-1"><circle cx="0" cy="0" r="5" fill="#1c1c1c" filter="url(#pipShadow)"/></g>
            <!-- 2 -->
            <g id="pip-2">
              <circle cx="-7" cy="-10" r="5" fill="#1c1c1c" filter="url(#pipShadow)"/>
              <circle cx="7" cy="10" r="5" fill="#1c1c1c" filter="url(#pipShadow)"/>
            </g>
            <!-- 3 -->
            <g id="pip-3">
              <circle cx="-7" cy="-10" r="5" fill="#1c1c1c" filter="url(#pipShadow)"/>
              <circle cx="0" cy="0" r="5" fill="#1c1c1c" filter="url(#pipShadow)"/>
              <circle cx="7" cy="10" r="5" fill="#1c1c1c" filter="url(#pipShadow)"/>
            </g>
            <!-- 4 -->
            <g id="pip-4">
              <circle cx="-7" cy="-10" r="5" fill="#1c1c1c" filter="url(#pipShadow)"/>
              <circle cx="7" cy="-10" r="5" fill="#1c1c1c" filter="url(#pipShadow)"/>
              <circle cx="-7" cy="10" r="5" fill="#1c1c1c" filter="url(#pipShadow)"/>
              <circle cx="7" cy="10" r="5" fill="#1c1c1c" filter="url(#pipShadow)"/>
            </g>
            <!-- 5 -->
            <g id="pip-5">
              <use href="#pip-4"/>
              <circle cx="0" cy="0" r="5" fill="#1c1c1c" filter="url(#pipShadow)"/>
            </g>
            <!-- 6 -->
            <g id="pip-6">
              <circle cx="-7" cy="-10" r="5" fill="#1c1c1c" filter="url(#pipShadow)"/>
              <circle cx="7" cy="-10" r="5" fill="#1c1c1c" filter="url(#pipShadow)"/>
              <circle cx="-7" cy="0" r="5" fill="#1c1c1c" filter="url(#pipShadow)"/>
              <circle cx="7" cy="0" r="5" fill="#1c1c1c" filter="url(#pipShadow)"/>
              <circle cx="-7" cy="10" r="5" fill="#1c1c1c" filter="url(#pipShadow)"/>
              <circle cx="7" cy="10" r="5" fill="#1c1c1c" filter="url(#pipShadow)"/>
            </g>
            
            <!-- Tiny shadow for pips -->
            <filter id="pipShadow" x="-50%" y="-50%" width="200%" height="200%">
               <feDropShadow dx="0" dy="1.5" stdDeviation="0.8" flood-color="#000" flood-opacity="0.6"/>
            </filter>
          </defs>

          <g id="chain-layer" transform="translate(600, 300)"></g>
        </svg>

        <!-- Drop Zones -->
        <div id="drop-left" class="drop-zone"></div>
        <div id="drop-right" class="drop-zone"></div>
      </div>
    </div>
  </div>
</div>

<!-- Player Area -->
<div class="player-area">
  
  <!-- Draw Pile -->
  <div class="boneyard" onclick="drawTile()">
    <div class="tile-back"></div>
    <div class="boneyard-count" id="boneyard-count">21</div>
  </div>

  <!-- Hand -->
  <div class="hand-rack" id="player-hand">
    <!-- JS Injected -->
  </div>
</div>

<div id="toast">Notification</div>

<script>
/**
 * Game Logic & Rendering
 */
const TILE_W = 40;
const TILE_H = 80;
const GAP = 8;

// State
let boardChain = []; // {a, b, rotation}
let playerHand = [];
let boneyard = [];
let leftEndVal = null;
let rightEndVal = null;
let selectedTileIdx = -1;

// Pip Map
const PIP_MAP = {
  0: null, 1: 'pip-1', 2: 'pip-2', 3: 'pip-3', 4: 'pip-4', 5: 'pip-5', 6: 'pip-6'
};

function initGame() {
  // Generate Double-6 set
  for(let i=0; i<=6; i++) {
    for(let j=i; j<=6; j++) {
      boneyard.push({a: i, b: j});
    }
  }
  // Shuffle
  boneyard.sort(() => Math.random() - 0.5);

  // Deal
  for(let i=0; i<7; i++) playerHand.push(boneyard.pop());

  // Start with [6,6] for visual impact
  const startTile = {a: 6, b: 6}; 
  boardChain.push({ ...startTile, rotation: 90 }); // Horizontal
  leftEndVal = 6;
  rightEndVal = 6;

  renderHand();
  renderBoard();
  updateUI();
}

// --- Rendering ---

function createBoardTileSVG(a, b, rotation) {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  
  // We build the tile around 0,0
  g.setAttribute("transform", `rotate(${rotation})`);

  // Base Shape
  const shape = document.createElementNS("http://www.w3.org/2000/svg", "use");
  shape.setAttribute("href", "#svg-tile");
  g.appendChild(shape);

  // Top Half (Value A)
  if(PIP_MAP[a]) {
    const pipsA = document.createElementNS("http://www.w3.org/2000/svg", "use");
    pipsA.setAttribute("href", `#${PIP_MAP[a]}`);
    pipsA.setAttribute("transform", `translate(0, -20)`); 
    g.appendChild(pipsA);
  }

  // Bottom Half (Value B)
  if(PIP_MAP[b]) {
    const pipsB = document.createElementNS("http://www.w3.org/2000/svg", "use");
    pipsB.setAttribute("href", `#${PIP_MAP[b]}`);
    pipsB.setAttribute("transform", `translate(0, 20)`);
    g.appendChild(pipsB);
  }

  return g;
}

function renderBoard() {
  const container = document.getElementById('chain-layer');
  container.innerHTML = '';

  if (boardChain.length === 0) return;

  // Simple Linear Layout Logic
  let totalWidth = 0;
  boardChain.forEach(t => {
    totalWidth += (t.rotation === 90 || t.rotation === 270 ? TILE_H : TILE_W) + GAP;
  });
  totalWidth -= GAP;

  let currentX = -totalWidth / 2;

  boardChain.forEach((t, i) => {
    const el = createBoardTileSVG(t.a, t.b, t.rotation);
    const w = (t.rotation === 90 || t.rotation === 270) ? TILE_H : TILE_W;
    
    // Center the tile at currentX
    el.setAttribute("transform", `translate(${currentX}, 0) rotate(${t.rotation})`);
    container.appendChild(el);
    
    currentX += w + GAP;
  });

  // Update Drop Zones
  updateDropZones(currentX, totalWidth);
}

function updateDropZones(endX, totalWidth) {
  const leftZone = document.getElementById('drop-left');
  const rightZone = document.getElementById('drop-right');
  
  const viewBoxW = 1200;
  const center = viewBoxW / 2;

  // Left Edge
  const leftEdgeX = center - totalWidth/2 - GAP - 30; 
  // Right Edge
  const rightEdgeX = center + totalWidth/2 + GAP + 30;

  // Convert SVG X to % of container
  const leftPct = (leftEdgeX / viewBoxW) * 100;
  const rightPct = (rightEdgeX / viewBoxW) * 100;

  // Position HTML Zones
  leftZone.style.left = `${leftPct}%`;
  leftZone.style.top = '50%';
  leftZone.style.transform = 'translate(-50%, -50%)';
  
  rightZone.style.left = `${rightPct}%`;
  rightZone.style.top = '50%';
  rightZone.style.transform = 'translate(-50%, -50%)';

  // Check validity
  const hasLeftMatch = playerHand.some(t => t.a === leftEndVal || t.b === leftEndVal);
  const hasRightMatch = playerHand.some(t => t.a === rightEndVal || t.b === rightEndVal);

  leftZone.className = `drop-zone visible ${hasLeftMatch ? 'active' : ''}`;
  leftZone.textContent = leftEndVal;
  leftZone.onclick = () => playTile('left');

  rightZone.className = `drop-zone visible ${hasRightMatch ? 'active' : ''}`;
  rightZone.textContent = rightEndVal;
  rightZone.onclick = () => playTile('right');
}

function renderHand() {
  const rack = document.getElementById('player-hand');
  rack.innerHTML = '';
  
  playerHand.forEach((tile, idx) => {
    const el = document.createElement('div');
    el.className = 'hand-tile';
    
    // Check validity
    const valid = (tile.a === leftEndVal || tile.b === leftEndVal || 
                  tile.a === rightEndVal || tile.b === rightEndVal);
    if (!valid) el.classList.add('disabled');
    
    if (idx === selectedTileIdx) el.classList.add('selected');

    el.innerHTML = `
      <div class="tile-half">${getPipsHTML(tile.a)}</div>
      <div class="tile-divider"></div>
      <div class="tile-half">${getPipsHTML(tile.b)}</div>
    `;
    
    el.onclick = () => selectTile(idx);
    rack.appendChild(el);
  });
}

function getPipsHTML(n) {
  if(n===0) return '';
  let html = '';
  const positions = {
    1: [[2,2]],
    2: [[1,1], [3,3]],
    3: [[1,1], [2,2], [3,3]],
    4: [[1,1], [3,1], [1,3], [3,3]],
    5: [[1,1], [3,1], [2,2], [1,3], [3,3]],
    6: [[1,1], [3,1], [1,2], [3,2], [1,3], [3,3]]
  };
  
  positions[n].forEach(([r,c]) => {
    html += `<div style="grid-area: ${r} / ${c}"><div class="pip"></div></div>`;
  });
  return html;
}

// --- Interaction ---

function selectTile(idx) {
  if(selectedTileIdx === idx) {
    selectedTileIdx = -1; 
  } else {
    const tile = playerHand[idx];
    // Check if playable
    if (tile.a !== leftEndVal && tile.b !== leftEndVal && 
        tile.a !== rightEndVal && tile.b !== rightEndVal) {
      showToast("Cannot play this tile");
      return;
    }
    selectedTileIdx = idx;
  }
  renderHand();
  updateDropZones(0,0); // Refresh drop zone states
}

function playTile(side) {
  if (selectedTileIdx === -1) {
    showToast("Select a tile first");
    return;
  }

  const tile = playerHand[selectedTileIdx];
  let played = false;

  // Logic to match and rotate
  if (side === 'left') {
    if (tile.a === leftEndVal) {
      // Match Top (A) to Left End.
      boardChain.unshift({ a: tile.b, b: tile.a, rotation: 90 });
      leftEndVal = tile.b;
      played = true;
    } else if (tile.b === leftEndVal) {
      // Match Bottom (B) to Left End.
      boardChain.unshift({ a: tile.a, b: tile.b, rotation: 270 });
      leftEndVal = tile.a;
      played = true;
    }
  } else if (side === 'right') {
    if (tile.b === rightEndVal) {
      // B is Bottom. Rotate 90 -> B is Left.
      boardChain.push({ a: tile.a, b: tile.b, rotation: 90 });
      rightEndVal = tile.a;
      played = true;
    } else if (tile.a === rightEndVal) {
      // A is Top. Rotate 270 -> A is Left.
      boardChain.push({ a: tile.a, b: tile.b, rotation: 270 });
      rightEndVal = tile.b;
      played = true;
    }
  }

  if (played) {
    playerHand.splice(selectedTileIdx, 1);
    selectedTileIdx = -1;
    renderHand();
    renderBoard();
    updateUI();
    checkWin();
  } else {
    showToast("Invalid move");
  }
}

function drawTile() {
  if (boneyard.length > 0) {
    const t = boneyard.pop();
    playerHand.push(t);
    renderHand();
    updateUI();
    showToast("Drew a tile");
  } else {
    showToast("Boneyard Empty");
  }
}

function updateUI() {
  document.getElementById('boneyard-count').textContent = boneyard.length;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

function checkWin() {
  if (playerHand.length === 0) {
    showToast("YOU WIN!");
  }
}

// Start
initGame();

</script>
