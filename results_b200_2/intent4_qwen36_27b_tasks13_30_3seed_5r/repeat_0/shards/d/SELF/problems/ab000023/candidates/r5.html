<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Red Emblem | Product Visualization</title>
<style>
  :root {
    /* Palette: Polished, high-end studio environment */
    --bg-color: #f2f4f6;
    --bg-gradient: radial-gradient(circle at 50% 30%, #ffffff 0%, #eef1f5 100%);
    
    --surface-white: #ffffff;
    --surface-edge: #dcdfe4;
    --surface-shadow: #c3c7cf;
    
    --brand-red: #ff2a2a;
    --brand-red-dark: #b30000;
    --brand-red-glow: rgba(255, 42, 42, 0.25);
    
    --text-main: #111111;
    --text-muted: #777777;
    
    --shadow-soft: 0 20px 60px -10px rgba(0,0,0,0.08);
    --shadow-hard: 0 40px 80px -10px rgba(0,0,0,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-color);
    background-image: var(--bg-gradient);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-main);
    -webkit-font-smoothing: antialiased;
    perspective: 1200px;
  }

  /* --- Layout & Typography --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 20;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 80px 60px;
  }

  .header {
    transform: translateY(-20px);
    opacity: 0;
    animation: fadeSlideDown 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
  }

  .eyebrow {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--brand-red);
    margin-bottom: 16px;
    display: block;
  }

  h1 {
    font-size: 48px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-main);
    line-height: 1;
    margin-bottom: 12px;
  }

  .subtitle {
    font-size: 19px;
    color: var(--text-muted);
    font-weight: 400;
    max-width: 280px;
    line-height: 1.4;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    width: 100%;
    transform: translateY(20px);
    opacity: 0;
    animation: fadeSlideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.4s;
  }

  .specs {
    display: flex;
    gap: 80px;
  }

  .spec-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .spec-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    font-weight: 600;
  }

  .spec-value {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-main);
  }

  /* Decorative line */
  .footer-line {
    position: absolute;
    bottom: 70px;
    left: 60px;
    right: 60px;
    height: 1px;
    background: linear-gradient(90deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0) 100%);
    opacity: 0;
    animation: fadeIn 1.5s ease forwards 0.8s;
  }

  /* --- The 3D Object --- */
  .scene-container {
    position: relative;
    width: 460px;
    height: 460px;
    transform-style: preserve-3d;
    transition: transform 0.1s linear;
    will-change: transform;
    cursor: grab;
    z-index: 10;
  }

  /* --- The Plaque (White Square) --- */
  .plaque {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
  }

  /* Front Face */
  .face-front {
    position: absolute;
    inset: 0;
    background: var(--surface-white);
    border-radius: 12px;
    box-shadow: 
      inset 0 0 0 1px rgba(255,255,255,0.8),
      inset 0 0 40px rgba(0,0,0,0.02);
    transform: translateZ(24px);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Material Texture (Subtle Noise) */
  .face-front::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
    opacity: 0.5;
    pointer-events: none;
  }

  /* Side Extrusion (Simulated with a thick border + shadow) */
  .face-side {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, #e0e0e0, #cfcfcf);
    border-radius: 12px;
    transform: translateZ(0px);
    box-shadow: var(--shadow-hard);
  }

  /* --- Hardware Details --- */
  .screw {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #555, #111);
    box-shadow: 
      0 1px 1px rgba(255,255,255,0.5) inset,
      0 2px 4px rgba(0,0,0,0.3);
    transform: translateZ(25px);
  }
  
  .screw::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 7px; height: 1px;
    background: #000;
    transform: translate(-50%, -50%) rotate(45deg);
    opacity: 0.6;
  }

  .screw-tl { top: 24px; left: 24px; }
  .screw-tr { top: 24px; right: 24px; transform: translateZ(25px) rotate(90deg); }
  .screw-bl { bottom: 24px; left: 24px; transform: translateZ(25px) rotate(-45deg); }
  .screw-br { bottom: 24px; right: 24px; transform: translateZ(25px) rotate(135deg); }

  /* --- The Emblem (The Hero) --- */
  .emblem-wrapper {
    position: relative;
    width: 220px;
    height: 220px;
    transform: translateZ(40px); /* Levitating above the plaque */
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: popIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.5s;
    transition: transform 0.3s ease-out;
  }

  .emblem-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    /* The complex shadow of the sphere */
    filter: drop-shadow(0 25px 35px rgba(180, 0, 0, 0.35));
  }

  .sphere {
    fill: url(#sphereGrad);
  }
  
  .sphere-rim {
    fill: none;
    stroke: #a60000;
    stroke-width: 0.5;
    opacity: 0.4;
  }

  .play-icon {
    fill: #ffffff;
    filter: url(#iconBevel);
  }

  /* --- Floor Shadow --- */
  .shadow-plane {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0) 70%);
    transform: translate(-50%, -50%) translateZ(-100px) rotateX(90deg) scale(1.2);
    filter: blur(25px);
    opacity: 0.8;
    pointer-events: none;
  }

  /* --- Animations --- */
  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes popIn {
    0% { opacity: 0; transform: translateZ(0px) scale(0.6); }
    100% { opacity: 1; transform: translateZ(40px) scale(1); }
  }

  /* Responsive */
  @media (max-width: 768px) {
    .ui-layer { padding: 40px 30px; }
    h1 { font-size: 36px; }
    .scene-container { width: 320px; height: 320px; }
    .specs { gap: 40px; }
    .footer-line { display: none; }
  }
</style>
</head>
<body>

  <!-- SVG Definitions for Gradients/Filters -->
  <svg width="0" height="0" style="position: absolute;">
    <defs>
      <!-- 3D Sphere Gradient -->
      <radialGradient id="sphereGrad" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#ff8080" /> <!-- Highlight -->
        <stop offset="15%" stop-color="#ff2a2a" /> <!-- Main Color -->
        <stop offset="70%" stop-color="#cc0000" /> <!-- Shadow Start -->
        <stop offset="100%" stop-color="#660000" /> <!-- Deep Shadow -->
      </radialGradient>

      <!-- Inner Bevel for Play Icon -->
      <filter id="iconBevel" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
        <feOffset in="blur" dx="1" dy="2" result="offsetBlur"/>
        <feFlood flood-color="#000" flood-opacity="0.25" result="shadowColor"/>
        <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
        <feMerge>
          <feMergeNode in="shadow"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
  </svg>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <div class="header">
      <span class="eyebrow">Product Visualization</span>
      <h1>Studio Emblem</h1>
      <p class="subtitle">Series 4 &bull; Matte Finish</p>
    </div>

    <div class="footer-line"></div>

    <div class="footer">
      <div class="specs">
        <div class="spec-group">
          <span class="spec-label">Material</span>
          <span class="spec-value">Alabaster Composite</span>
        </div>
        <div class="spec-group">
          <span class="spec-label">Dimension</span>
          <span class="spec-value">440 x 440mm</span>
        </div>
        <div class="spec-group">
          <span class="spec-label">Finish</span>
          <span class="spec-value">Soft Touch UV</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 3D Scene -->
  <div class="scene-container" id="sceneContainer">
    
    <!-- The Shadow on the floor -->
    <div class="shadow-plane" id="shadowPlane"></div>

    <!-- The Object -->
    <div class="plaque">
      <!-- The Extruded Side -->
      <div class="face-side"></div>
      
      <!-- The Front Face -->
      <div class="face-front">
        <div class="screw screw-tl"></div>
        <div class="screw screw-tr"></div>
        <div class="screw screw-bl"></div>
        <div class="screw screw-br"></div>

        <!-- The Emblem -->
        <div class="emblem-wrapper" id="emblemWrapper">
          <svg class="emblem-svg" viewBox="0 0 100 100">
            <!-- Sphere Base -->
            <circle class="sphere" cx="50" cy="50" r="46" />
            <!-- Rim Light/Shadow -->
            <circle class="sphere-rim" cx="50" cy="50" r="45.5" />
            
            <!-- Play Triangle (Perfectly Centered) -->
            <path class="play-icon" d="M38 32 L38 68 L72 50 Z" stroke-linejoin="round" />
          </svg>
        </div>
      </div>
    </div>

  </div>

  <script>
    const container = document.getElementById('sceneContainer');
    const emblem = document.getElementById('emblemWrapper');
    const shadow = document.getElementById('shadowPlane');

    // Configuration
    const maxRotation = 15;
    const floatHeight = 10;

    // Initial Tilt
    container.style.transform = `rotateX(10deg) rotateY(-10deg)`;

    document.addEventListener('mousemove', (e) => {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;

      // Calculate normalized mouse position (-1 to 1)
      const mouseX = (e.clientX - centerX) / centerX;
      const mouseY = (e.clientY - centerY) / centerY;

      // Calculate rotation
      // We invert X rotation to match natural head movement (look up -> object tilts back)
      // We keep Y rotation standard (look right -> object turns right)
      let rotateY = mouseX * maxRotation;
      let rotateX = -mouseY * maxRotation;

      // Base tilt adjustments
      const baseX = 10;
      const baseY = -10;

      // Apply transform to container
      container.style.transform = `rotateX(${baseX + rotateX}deg) rotateY(${baseY + rotateY}deg)`;

      // Parallax Effect for Emblem (Moves slightly more than the base)
      // We translate the emblem in Z space to make it "float"
      // We also rotate it slightly in opposite direction for 3D depth
      emblem.style.transform = `translateZ(${40 + (mouseY * 15)}px) rotateX(${-rotateX * 0.5}deg)`;

      // Shadow moves opposite to object tilt to simulate light source
      shadow.style.transform = `translate(-50%, -50%) translateZ(-100px) rotateX(90deg) scale(${1.2 - (mouseY*0.1)}) translateX(${mouseX * 30}px)`;
    });

    // Reset on leave
    document.addEventListener('mouseleave', () => {
      container.style.transition = 'transform 0.5s ease-out';
      container.style.transform = `rotateX(10deg) rotateY(-10deg)`;
      emblem.style.transform = `translateZ(40px) rotateX(0deg)`;
      shadow.style.transform = `translate(-50%, -50%) translateZ(-100px) rotateX(90deg) scale(1.2)`;
      
      setTimeout(() => {
        container.style.transition = 'transform 0.1s linear';
      }, 500);
    });
  </script>
</body>
</html>
