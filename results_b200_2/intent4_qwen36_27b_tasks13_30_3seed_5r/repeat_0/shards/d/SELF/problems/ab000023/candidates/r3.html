<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Red Emblem | Product Visualization</title>
<style>
  :root {
    /* Palette: High-end commercial studio */
    --bg-top: #f8f9fa;
    --bg-bottom: #e9ecef;
    --bg-accent: #f1f3f5;
    
    --surface-white: #ffffff;
    --surface-highlight: #ffffff;
    --surface-side: #e0e0e0;
    --surface-side-dark: #b0b0b0;
    
    --brand-red: #ff3b30;
    --brand-red-deep: #c40000;
    --brand-red-shadow: rgba(255, 59, 48, 0.3);
    
    --text-primary: #1a1a1a;
    --text-secondary: #666666;
    
    /* Lighting & Depth */
    --shadow-floor: 0 40px 80px -10px rgba(0,0,0,0.15);
    --shadow-object: 0 20px 40px -5px rgba(0,0,0,0.2);
    --shadow-emblem: 0 15px 35px var(--brand-red-shadow);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(ellipse at 50% 20%, var(--bg-top), var(--bg-bottom));
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  /* --- Layout --- */
  .ui-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 64px;
  }

  .header {
    opacity: 0;
    animation: fadeDown 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.2s;
  }

  .eyebrow {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--brand-red);
    margin-bottom: 12px;
    display: block;
  }

  h1 {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -1px;
    color: var(--text-primary);
    line-height: 1.1;
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 18px;
    color: var(--text-secondary);
    font-weight: 400;
    max-width: 300px;
    line-height: 1.5;
  }

  .footer {
    display: flex;
    gap: 60px;
    opacity: 0;
    animation: fadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.4s;
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-secondary);
    font-weight: 600;
  }

  .stat-value {
    font-size: 18px;
    font-weight: 500;
    color: var(--text-primary);
  }

  /* --- 3D Scene --- */
  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1500px;
    z-index: 1;
  }

  .tilt-wrapper {
    position: relative;
    width: 440px;
    height: 440px;
    transform-style: preserve-3d;
    transform: rotateX(12deg) rotateY(-12deg);
    transition: transform 0.1s linear;
    cursor: grab;
  }

  /* --- The Object: Base Extrusion --- */
  .sign-base {
    position: absolute;
    inset: 0;
    background: var(--surface-side);
    border-radius: 12px;
    /* The depth of the object */
    transform: translateZ(-24px);
    box-shadow: var(--shadow-floor);
  }

  /* The sides of the extrusion (simulated via multiple layers or gradient) */
  .sign-sides {
    position: absolute;
    inset: 0;
    transform: translateZ(-12px);
    background: linear-gradient(to bottom, #d1d1d1, #a0a0a0);
    border-radius: 12px;
  }

  /* --- The Object: Front Face --- */
  .sign-face {
    position: absolute;
    inset: 0;
    background: var(--surface-white);
    border-radius: 12px;
    transform: translateZ(0px);
    /* Realistic material gradient */
    background: linear-gradient(145deg, #ffffff 0%, #f7f7f7 100%);
    border-top: 1px solid rgba(255,255,255,0.9);
    border-left: 1px solid rgba(255,255,255,0.9);
    box-shadow: inset 0 0 20px rgba(0,0,0,0.02);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* --- Hardware Details --- */
  .screw {
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #444, #111);
    box-shadow: 
      0 1px 1px rgba(255,255,255,0.3) inset,
      0 2px 3px rgba(0,0,0,0.4);
    transform: translateZ(2px);
  }
  
  .screw::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 8px; height: 1.5px;
    background: #000;
    transform: translate(-50%, -50%) rotate(45deg);
    opacity: 0.5;
  }

  .screw-tl { top: 32px; left: 32px; }
  .screw-tr { top: 32px; right: 32px; transform: translateZ(2px) rotate(90deg); }
  .screw-bl { bottom: 32px; left: 32px; transform: translateZ(2px) rotate(-45deg); }
  .screw-br { bottom: 32px; right: 32px; transform: translateZ(2px) rotate(135deg); }

  /* --- The Emblem --- */
  .emblem-container {
    position: relative;
    width: 200px;
    height: 200px;
    transform: translateZ(35px); /* Floating effect */
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    animation: popIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.3s;
  }

  .emblem-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    /* Dynamic shadow based on light source */
    filter: drop-shadow(0 20px 30px rgba(255, 59, 48, 0.4));
    transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  .tilt-wrapper:hover .emblem-svg {
    transform: scale(1.05) translateZ(10px);
  }

  /* SVG Fills */
  .emblem-bg {
    fill: url(#redGradient);
  }
  
  .emblem-stroke {
    fill: none;
    stroke: #a60000;
    stroke-width: 1;
    opacity: 0.5;
  }

  .emblem-icon {
    fill: #ffffff;
    filter: url(#iconBevel);
  }

  /* --- Floor Shadow --- */
  .floor-shadow {
    position: absolute;
    width: 350px;
    height: 100px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 70%);
    bottom: -180px;
    left: 50%;
    transform: translateX(-50%) rotateX(90deg);
    filter: blur(20px);
    opacity: 0.6;
    transition: transform 0.1s linear;
  }

  /* --- Animations --- */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes popIn {
    0% { transform: translateZ(0px) scale(0.8); opacity: 0; }
    100% { transform: translateZ(35px) scale(1); opacity: 1; }
  }

  /* Responsive */
  @media (max-width: 768px) {
    .ui-container { padding: 40px; }
    h1 { font-size: 32px; }
    .tilt-wrapper { width: 320px; height: 320px; }
    .footer { gap: 30px; }
    .stat-value { font-size: 16px; }
  }
</style>
</head>
<body>

  <!-- SVG Definitions -->
  <svg width="0" height="0" style="position: absolute;">
    <defs>
      <!-- High-End Red Sphere Gradient -->
      <radialGradient id="redGradient" cx="30%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#ff7b7b" />
        <stop offset="25%" stop-color="#ff3b30" />
        <stop offset="85%" stop-color="#d00000" />
        <stop offset="100%" stop-color="#8a0000" />
      </radialGradient>

      <!-- Subtle Bevel for Icon -->
      <filter id="iconBevel" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
        <feOffset in="blur" dx="0" dy="2" result="offsetBlur"/>
        <feFlood flood-color="#000" flood-opacity="0.2" result="shadowColor"/>
        <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
        <feMerge>
          <feMergeNode in="SourceGraphic"/>
          <feMergeNode in="shadow"/>
        </feMerge>
      </filter>
    </defs>
  </svg>

  <!-- UI Overlay -->
  <div class="ui-container">
    <div class="header">
      <span class="eyebrow">Product Visualization</span>
      <h1>Studio Emblem</h1>
      <p class="subtitle">Series 4 • Matte Finish</p>
    </div>

    <div class="footer">
      <div class="stat-item">
        <span class="stat-label">Material</span>
        <span class="stat-value">Alabaster Composite</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Dimension</span>
        <span class="stat-value">440 x 440mm</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Finish</span>
        <span class="stat-value">Soft Touch UV</span>
      </div>
    </div>
  </div>

  <!-- 3D Scene -->
  <div class="scene" id="scene">
    <div class="tilt-wrapper" id="signWrapper">
      
      <!-- Shadow -->
      <div class="floor-shadow" id="floorShadow"></div>

      <!-- Physical Block -->
      <div class="sign-base"></div>
      <div class="sign-sides"></div>
      
      <!-- Front Face -->
      <div class="sign-face">
        <div class="screw screw-tl"></div>
        <div class="screw screw-tr"></div>
        <div class="screw screw-bl"></div>
        <div class="screw screw-br"></div>

        <!-- Emblem -->
        <div class="emblem-container">
          <svg class="emblem-svg" viewBox="0 0 100 100">
            <!-- Red Circle -->
            <circle class="emblem-bg" cx="50" cy="50" r="48" />
            <!-- Rim Highlight/Shadow -->
            <circle class="emblem-stroke" cx="50" cy="50" r="46.5" />
            
            <!-- Play Triangle (Perfectly Centered) -->
            <path class="emblem-icon" d="M40 30 L40 70 L74 50 Z" stroke-linejoin="round" />
          </svg>
        </div>
      </div>

    </div>
  </div>

  <script>
    const wrapper = document.getElementById('signWrapper');
    const shadow = document.getElementById('floorShadow');

    // Configuration
    const maxRotation = 18;
    const shadowSensitivity = 0.5;

    document.addEventListener('mousemove', (e) => {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;

      // Calculate normalized mouse position (-1 to 1)
      const mouseX = (e.clientX - centerX) / centerX;
      const mouseY = (e.clientY - centerY) / centerY;

      // Calculate rotation (Invert Y for natural feel)
      let rotateY = mouseX * maxRotation;
      let rotateX = -mouseY * maxRotation;

      // Apply transform
      // Base tilt is 12deg X, -12deg Y
      wrapper.style.transform = `rotateX(${12 + rotateX}deg) rotateY(${-12 + rotateY}deg)`;

      // Shadow moves opposite to object tilt
      shadow.style.transform = `translateX(calc(-50% + ${-rotateY * 8}px)) rotateX(90deg)`;
    });

    // Reset on leave
    document.addEventListener('mouseleave', () => {
      wrapper.style.transform = `rotateX(12deg) rotateY(-12deg)`;
      shadow.style.transform = `translateX(-50%) rotateX(90deg)`;
    });
  </script>
</body>
</html>
