<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPINE // DESCENT</title>
    <style>
        :root {
            --bg-deep: #0f172a;
            --bg-mid: #334155;
            --sky-top: #0f172a;
            --sky-bot: #f8fafc;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --danger: #f43f5e;
            --font-display: 'Impact', 'Arial Black', sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Layout & Container --- */
        .screen-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            grid-template-rows: 100px 1fr 100px;
            overflow: hidden;
        }

        /* --- The Visual Scene (SVG) --- */
        .scene-layer {
            grid-column: 1 / -1;
            grid-row: 1 / -1;
            z-index: 1;
            width: 100%;
            height: 100%;
        }

        /* --- UI Overlay --- */
        .ui-layer {
            grid-column: 1 / -1;
            grid-row: 1 / -1;
            z-index: 10;
            pointer-events: none; /* Let clicks pass to scene if needed */
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            grid-template-rows: 80px 1fr 80px;
            padding: 2rem;
        }

        /* --- Typography & UI Elements --- */
        .header {
            grid-column: 1 / 2;
            grid-row: 1 / 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-left: 2px solid var(--accent);
            padding-left: 1.5rem;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 3rem;
            text-transform: uppercase;
            line-height: 0.9;
            letter-spacing: -1px;
            mix-blend-mode: exclusion;
        }

        .subtitle {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--accent);
            margin-top: 0.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .data-panel {
            grid-column: 3 / 4;
            grid-row: 2 / 3;
            align-self: center;
            justify-self: end;
            width: 250px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            pointer-events: auto;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.5rem;
        }

        .data-label {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .data-value {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--text-main);
            font-weight: bold;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--danger);
            margin-right: 6px;
            box-shadow: 0 0 8px var(--danger);
            animation: pulse 2s infinite;
        }

        .footer {
            grid-column: 1 / -1;
            grid-row: 3 / 4;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .compass {
            width: 40px;
            height: 40px;
            border: 1px solid var(--text-muted);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
        }

        /* --- Animations --- */
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* SVG Specific Styles */
        .cliff-face {
            fill: url(#cliffGradient);
            stroke: #1e293b;
            stroke-width: 1;
        }
        
        .rock-layer {
            fill: none;
            stroke: #0f172a;
            stroke-width: 2;
            opacity: 0.4;
        }

        .wind-line {
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 1;
            stroke-linecap: round;
        }

        .parachute-canopy {
            fill: #e2e8f0;
            stroke: #94a3b8;
            stroke-width: 1;
        }

        .harness-line {
            stroke: #cbd5e1;
            stroke-width: 1;
            fill: none;
        }

        .silhouette {
            fill: #0f172a;
        }

    </style>
</head>
<body>

<div class="screen-container">
    
    <!-- Background / Scene SVG -->
    <svg class="scene-layer" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Sky Gradient -->
            <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
                <stop offset="40%" style="stop-color:#3b82f6;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#bae6fd;stop-opacity:1" />
            </linearGradient>

            <!-- Cliff Gradient -->
            <linearGradient id="cliffGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#020617;stop-opacity:1" />
                <stop offset="60%" style="stop-color:#1e293b;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
            </linearGradient>

            <!-- Depth Blur Filter -->
            <filter id="blurMist">
                <feGaussianBlur in="SourceGraphic" stdDeviation="20" />
            </filter>
        </defs>

        <!-- 1. Sky Background -->
        <rect width="1920" height="1080" fill="url(#skyGradient)" />

        <!-- 2. Distant Landscape (Atmospheric Depth) -->
        <g id="distant-mountains" opacity="0.6">
            <path d="M0,1080 L0,600 Q300,550 600,700 T1200,600 T1920,800 L1920,1080 Z" fill="#93c5fd" filter="url(#blurMist)" />
            <path d="M0,1080 L0,700 Q400,650 800,800 T1920,750 L1920,1080 Z" fill="#bfdbfe" opacity="0.5" filter="url(#blurMist)" />
        </g>

        <!-- 3. Wind / Motion Cues (Animated via JS later) -->
        <g id="wind-group"></g>

        <!-- 4. The Dramatic Cliff (Foreground) -->
        <g id="cliff-group" transform="translate(0, 0)">
            <!-- Main Cliff Shape -->
            <path class="cliff-face" d="M-50,-50 L450,-50 L450,200 C450,250 400,300 380,350 C360,400 380,450 350,500 L400,600 L300,700 L350,800 L250,900 L300,1050 L-50,1150 Z" />
            
            <!-- Rock Layers / Texture -->
            <path class="rock-layer" d="M450,200 C450,250 400,300 380,350" />
            <path class="rock-layer" d="M380,350 C360,400 380,450 350,500" />
            <path class="rock-layer" d="M350,500 L400,600" />
            <path class="rock-layer" d="M400,600 L300,700" />
            <path class="rock-layer" d="M300,700 L350,800" />
            <path class="rock-layer" d="M350,800 L250,900" />
            
            <!-- Edge Highlight -->
            <path d="M450,-50 L450,200 C450,250 400,300 380,350 C360,400 380,450 350,500 L400,600 L300,700 L350,800 L250,900 L300,1050" 
                  fill="none" stroke="#475569" stroke-width="3" />
        </g>

        <!-- 5. The Parachuter Group (Animated via JS) -->
        <g id="parachuter-group" transform="translate(600, -200)">
            
            <!-- Canopy -->
            <path class="parachute-canopy" d="M-120,0 C-120,-100 120,-100 120,0 C120,20 80,30 0,30 C-80,30 -120,20 -120,0 Z" />
            <path class="parachute-canopy" d="M-120,0 C-120,-100 120,-100 120,0 C120,20 60,25 0,25 C-60,25 -120,20 -120,0 Z" fill="#fff" opacity="0.8"/>
            
            <!-- Riser Lines (Taut) -->
            <line class="harness-line" x1="-80" y1="20" x2="-10" y2="120" />
            <line class="harness-line" x1="80" y1="20" x2="10" y2="120" />
            <line class="harness-line" x1="-40" y1="28" x2="-5" y2="120" />
            <line class="harness-line" x1="40" y1="28" x2="5" y2="120" />

            <!-- Harness -->
            <rect x="-15" y="115" width="30" height="40" rx="5" fill="#1e293b" stroke="#475569" />

            <!-- Human Silhouette (Dynamic Pose) -->
            <g class="silhouette">
                <!-- Legs (Dangling slightly) -->
                <path d="M-10,150 C-10,180 -20,210 -15,230" stroke="#0f172a" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M10,150 C10,180 20,210 15,230" stroke="#0f172a" stroke-width="8" fill="none" stroke-linecap="round"/>
                <!-- Torso -->
                <path d="M-10,120 L-5,150 L5,150 L10,120 Z" />
                <!-- Head -->
                <circle cx="0" cy="110" r="12" />
                <!-- Arms (Gesturing/Balancing) -->
                <path d="M-5,125 C-20,120 -30,110 -40,100" stroke="#0f172a" stroke-width="6" fill="none" stroke-linecap="round"/>
                <path d="M5,125 C20,120 30,110 40,100" stroke="#0f172a" stroke-width="6" fill="none" stroke-linecap="round"/>
            </g>
        </g>

        <!-- 6. Mist Overlay at bottom -->
        <rect x="0" y="900" width="1920" height="180" fill="url(#skyGradient)" opacity="0.3" filter="url(#blurMist)" />
    </svg>

    <!-- UI Overlay -->
    <div class="ui-layer">
        <div class="header">
            <h1>Alpine<br>Descent</h1>
            <div class="subtitle">Operation: Freefall // Sector 4</div>
        </div>

        <div class="data-panel">
            <div class="data-row">
                <span class="data-label">Altitude</span>
                <span class="data-value" id="alt-val">14,200 ft</span>
            </div>
            <div class="data-row">
                <span class="data-label">Vertical Speed</span>
                <span class="data-value">-24 ft/s</span>
            </div>
            <div class="data-row">
                <span class="data-label">Wind Vector</span>
                <span class="data-value">NW 12mph</span>
            </div>
            <div class="data-row">
                <span class="data-label">Canopy Status</span>
                <span class="data-value" style="color:var(--accent)">NOMINAL</span>
            </div>
            <div class="data-row" style="border:none;">
                <span class="data-label">Proximity</span>
                <span class="data-value"><span class="status-indicator"></span>CAUTION</span>
            </div>
        </div>

        <div class="footer">
            <div>
                <p>SYS.ONLINE</p>
                <p>RENDER_ENGINE: SVG_V2</p>
            </div>
            <div class="compass">N</div>
            <div style="text-align: right;">
                <p>DESIGN: SENIOR_FRONTEND</p>
                <p>NO_EXTERNAL_ASSETS</p>
            </div>
        </div>
    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const svg = document.querySelector('.scene-layer');
        const windGroup = document.getElementById('wind-group');
        const parachuter = document.getElementById('parachuter-group');
        const altVal = document.getElementById('alt-val');
        
        // --- Animation State ---
        let time = 0;
        let altitude = 14200;
        
        // --- Generate Wind Lines ---
        const windLines = [];
        for(let i=0; i<40; i++) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            const y = Math.random() * 1080;
            const x = Math.random() * 1920;
            const len = 50 + Math.random() * 100;
            
            line.setAttribute("x1", x);
            line.setAttribute("y1", y);
            line.setAttribute("x2", x + len);
            line.setAttribute("y2", y);
            line.setAttribute("class", "wind-line");
            line.setAttribute("opacity", Math.random() * 0.5);
            
            windGroup.appendChild(line);
            windLines.push({
                el: line,
                x: x,
                y: y,
                speed: 2 + Math.random() * 5,
                len: len
            });
        }

        // --- Main Animation Loop ---
        function animate() {
            time += 0.01;

            // 1. Parachuter Bobbing (Sine wave)
            // Moves down slowly and bobs up and down
            const bobY = Math.sin(time * 2) * 10;
            const swayX = Math.sin(time) * 5;
            const descent = (time * 10) % 1100; // Loop descent visual
            
            // Apply transform
            parachuter.setAttribute('transform', `translate(${600 + swayX}, ${-200 + descent + bobY})`);

            // 2. Wind Animation
            windLines.forEach(line => {
                line.x += line.speed;
                if(line.x > 1920) {
                    line.x = -line.len;
                    line.y = Math.random() * 1080;
                }
                line.el.setAttribute("x1", line.x);
                line.el.setAttribute("x2", line.x + line.len);
            });

            // 3. Data Update Simulation
            altitude -= 1;
            if(altitude < 14000) altitude = 14200;
            altVal.innerText = altitude.toLocaleString() + " ft";

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>

</body>
</html>
