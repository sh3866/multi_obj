<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomy of Interaction: Grip Study</title>
    <style>
        :root {
            --bg-deep: #0a0b0d;
            --bg-accent: #14161a;
            --text-ui: #8892a0;
            --text-highlight: #f0f4f8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: crosshair;
        }

        /* 1. Texture & Atmosphere */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.07;
            pointer-events: none;
            z-index: 50;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 40%, #000 100%);
            pointer-events: none;
            z-index: 40;
        }

        /* 2. Layout & Composition */
        .stage {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1500px;
        }

        .art-container {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s linear;
            will-change: transform;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
            /* Center the focal point */
            transform-origin: center;
        }

        /* 3. Typography & Editorial Elements */
        .caption {
            position: absolute;
            bottom: 3rem;
            right: 3rem;
            text-align: right;
            z-index: 60;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        .caption h1 {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            color: var(--text-highlight);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            opacity: 0.9;
        }

        .caption p {
            font-size: 0.7rem;
            color: var(--text-ui);
            letter-spacing: 0.05em;
            font-family: 'Courier New', Courier, monospace;
            max-width: 250px;
            margin-left: auto;
            line-height: 1.4;
        }

        .hint {
            position: absolute;
            top: 2rem;
            left: 2rem;
            font-size: 0.65rem;
            color: #333;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            z-index: 60;
        }

    </style>
</head>
<body>

    <div class="noise-overlay"></div>
    <div class="vignette"></div>

    <div class="hint">Interactive Perspective</div>

    <div class="caption">
        <h1>Fig. 04 // Human Interface</h1>
        <p>Analysis of grip ergonomics, tactile feedback loops, and subsurface skin scattering properties under artificial screen illumination.</p>
    </div>

    <div class="stage" id="stage">
        <div class="art-container" id="art">
            <!-- viewBox adjusted for tighter crop on the hand -->
            <svg viewBox="0 0 900 1100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- 
                      SKIN GRADIENTS 
                      Rebuilt for higher fidelity: Subsurface scattering simulation
                    -->
                    <linearGradient id="skin-base" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#5E3522" />
                        <stop offset="40%" stop-color="#9C6446" />
                        <stop offset="80%" stop-color="#DCA588" />
                        <stop offset="100%" stop-color="#FCE0D3" />
                    </linearGradient>

                    <linearGradient id="skin-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#2E150A" />
                        <stop offset="100%" stop-color="#6E3C24" />
                    </linearGradient>

                    <radialGradient id="joint-highlight" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#FCE0D3" stop-opacity="0.8"/>
                        <stop offset="100%" stop-color="#B87A58" stop-opacity="0"/>
                    </radialGradient>

                    <!-- 
                      DEVICE GRADIENTS 
                      High-end metallic finish
                    -->
                    <linearGradient id="device-metal" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#2a2a2a" />
                        <stop offset="10%" stop-color="#555" /> <!-- Sharp Edge Light -->
                        <stop offset="30%" stop-color="#1a1a1a" />
                        <stop offset="100%" stop-color="#0a0a0a" />
                    </linearGradient>

                    <linearGradient id="screen-glass" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#0f1115" />
                        <stop offset="100%" stop-color="#030405" />
                    </linearGradient>

                    <linearGradient id="screen-emission" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
                        <stop offset="50%" stop-color="#4facfe" stop-opacity="0.4"/>
                        <stop offset="100%" stop-color="#000" stop-opacity="0"/>
                    </linearGradient>

                    <!-- FILTERS -->
                    <filter id="soft-blur" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="6" />
                    </filter>
                    
                    <filter id="heavy-blur" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="35" />
                    </filter>

                    <filter id="drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
                        <feGaussianBlur stdDeviation="15" result="blur" />
                        <feOffset dx="10" dy="20" />
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.6" />
                        </feComponentTransfer>
                        <feComposite operator="over" in="SourceGraphic" />
                    </filter>

                    <filter id="contact-shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="3" />
                        <feOffset dx="0" dy="2" />
                    </filter>
                </defs>

                <!-- BACKGROUND -->
                <rect width="100%" height="100%" fill="var(--bg-deep)" />
                
                <!-- Ambient Glow (Blue light from screen) -->
                <circle cx="40%" cy="45%" r="40%" fill="#4facfe" opacity="0.03" filter="url(#heavy-blur)" />

                <!-- 
                  LAYER 1: THE DEVICE 
                  Centered, slight rotation
                -->
                <g id="device" transform="translate(350, 250) rotate(8)" filter="url(#drop-shadow)">
                    
                    <!-- Chassis -->
                    <rect x="0" y="0" width="260" height="540" rx="36" fill="url(#device-metal)" stroke="#111" stroke-width="2" />
                    
                    <!-- Inner Bezel -->
                    <rect x="4" y="4" width="252" height="532" rx="32" fill="#000" />
                    
                    <!-- Screen -->
                    <rect x="6" y="6" width="248" height="528" rx="30" fill="url(#screen-glass)" />

                    <!-- UI Elements -->
                    <g id="ui-layer" opacity="0.9">
                        <!-- Dynamic Island / Notch -->
                        <rect x="90" y="15" width="80" height="24" rx="12" fill="#000" />
                        <circle cx="155" cy="27" r="4" fill="#111" /> <!-- Camera lens -->
                        <circle cx="155" cy="27" r="1.5" fill="#333" /> <!-- Reflection -->

                        <!-- Abstract UI Content -->
                        <rect x="30" y="60" width="100" height="8" rx="4" fill="#4facfe" opacity="0.8" />
                        <rect x="30" y="80" width="160" height="4" rx="2" fill="#444" />
                        <rect x="30" y="90" width="140" height="4" rx="2" fill="#444" />
                        
                        <!-- Graph Visualization -->
                        <path d="M 30,350 L 70,300 L 110,320 L 160,240 L 220,260" stroke="#4facfe" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                        <circle cx="160" cy="240" r="6" fill="#fff" stroke="#4facfe" stroke-width="2" />
                        
                        <!-- Cards -->
                        <rect x="30" y="400" width="200" height="120" rx="12" fill="#111" stroke="#222" stroke-width="1" />
                        <rect x="45" y="420" width="80" height="6" rx="3" fill="#333" />
                        <rect x="45" y="435" width="120" height="4" rx="2" fill="#222" />
                    </g>

                    <!-- Screen Reflection (Glassy effect) -->
                    <path d="M 6,6 L 254,6 L 254,200 L 6,400 Z" fill="url(#screen-emission)" opacity="0.08" style="mix-blend-mode: overlay;" />
                </g>

                <!-- 
                  LAYER 2: THE ARM (Background) 
                  Entering from bottom right, connecting to hand
                -->
                <g id="arm">
                    <!-- Sleeve -->
                    <path d="M 800,1300 L 750,1000 C 730,900 700,850 650,800 L 900,800 Z" fill="#1a1c20" />
                    <path d="M 750,1000 C 730,900 700,850 650,800 L 630,820 C 680,870 710,920 730,1020 Z" fill="#000" opacity="0.5" filter="url(#soft-blur)"/>
                    
                    <!-- Forearm Skin -->
                    <path d="M 650,800 C 600,700 550,650 500,650 L 600,1300 L 900,1300 L 800,800 Z" fill="url(#skin-shadow)" />
                </g>

                <!-- 
                  LAYER 3: THE HAND (Foreground) 
                  Rebuilt anatomy: Fingers wrapping right edge, Thumb on screen.
                -->
                <g id="hand" transform="translate(0, 20)">
                    
                    <!-- Palm Webbing (Connecting thumb to hand) -->
                    <path d="M 460,700 C 500,720 530,780 550,850 C 520,880 480,820 460,700 Z" fill="url(#skin-shadow)" opacity="0.9"/>

                    <!-- 
                      FINGERS (Right Side Grip)
                      Detailed overlapping paths to simulate wrapping
                    -->
                    
                    <!-- Index Finger -->
                    <g transform="translate(590, 480) rotate(12)">
                        <!-- Main Phalanx -->
                        <path d="M -25,0 C 0,30 -5,80 -20,120 L -45,110 C -30,70 -35,30 -25,0 Z" fill="url(#skin-base)" />
                        <!-- Knuckle Detail -->
                        <ellipse cx="-10" cy="25" rx="14" ry="18" fill="url(#joint-highlight)" opacity="0.6" />
                        <!-- Nail Bed -->
                        <path d="M -38,95 Q -32,85 -25,95 Q -30,110 -38,95" fill="#EBCFB8" opacity="0.8" />
                        <!-- Shadow on Phone -->
                        <path d="M -25,0 C 0,30 -5,80 -20,120 L -25,120 Z" fill="#000" opacity="0.4" filter="url(#contact-shadow)" transform="translate(-10, -5)" />
                    </g>

                    <!-- Middle Finger -->
                    <g transform="translate(610, 580) rotate(4)">
                        <path d="M -25,0 C -5,40 -10,100 -25,140 L -50,130 C -35,90 -40,40 -25,0 Z" fill="url(#skin-base)" />
                        <ellipse cx="-15" cy="25" rx="15" ry="19" fill="url(#joint-highlight)" opacity="0.6" />
                        <path d="M -42,115 Q -36,105 -29,115 Q -34,130 -42,115" fill="#EBCFB8" opacity="0.8" />
                    </g>

                    <!-- Ring Finger -->
                    <g transform="translate(600, 690) rotate(-5)">
                        <path d="M -25,0 C -10,40 -15,90 -30,130 L -55,120 C -40,80 -45,40 -25,0 Z" fill="url(#skin-base)" />
                        <ellipse cx="-20" cy="25" rx="13" ry="17" fill="url(#joint-highlight)" opacity="0.6" />
                        <path d="M -46,105 Q -40,95 -33,105 Q -38,120 -46,105" fill="#EBCFB8" opacity="0.8" />
                    </g>

                    <!-- Pinky Finger -->
                    <g transform="translate(570, 780) rotate(-15)">
                        <path d="M -20,0 C -5,30 -10,80 -25,110 L -45,100 C -35,60 -40,30 -20,0 Z" fill="url(#skin-base)" />
                        <ellipse cx="-20" cy="15" rx="12" ry="15" fill="url(#joint-highlight)" opacity="0.6" />
                    </g>

                    <!-- 
                      THUMB (The Focal Point)
                      Detailed, resting on the screen
                    -->
                    <g transform="translate(380, 650) rotate(-25)">
                        
                        <!-- Cast Shadow on Screen -->
                        <ellipse cx="60" cy="140" rx="35" ry="70" fill="#000" opacity="0.7" filter="url(#contact-shadow)" transform="rotate(15)" />

                        <!-- Thumb Shaft -->
                        <path d="M -15,0 Q 15,70 55,150 L 15,170 Q -15,90 -15,0 Z" fill="url(#skin-base)" />
                        
                        <!-- Knuckles (Detailed) -->
                        <ellipse cx="35" cy="95" rx="18" ry="22" fill="url(#joint-highlight)" />
                        <path d="M 30,95 Q 40,105 35,115" stroke="#6E3C24" stroke-width="1.5" fill="none" opacity="0.5" /> <!-- Crease -->

                        <!-- Thumb Tip -->
                        <path d="M 15,170 Q 50,190 75,160 Q 65,130 55,150 Z" fill="url(#skin-base)" />
                        
                        <!-- Thumbnail (High Detail) -->
                        <path d="M 60,155 Q 70,165 68,180 Q 55,175 55,165" fill="#FCE0D3" opacity="0.9" />
                        <path d="M 60,155 Q 70,165 68,180" stroke="#fff" stroke-width="1" fill="none" opacity="0.4" /> <!-- Shine -->

                        <!-- Screen Light Reflection on Skin (Subsurface Scattering) -->
                        <path d="M 55,150 Q 65,130 75,160 Q 50,190 15,170" fill="#4facfe" opacity="0.4" style="mix-blend-mode: screen;" filter="url(#soft-blur)" />
                        
                        <!-- Edge Highlight -->
                        <path d="M -15,0 Q 15,70 55,150" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.5" filter="url(#soft-blur)" />
                    </g>

                </g>

                <!-- 
                  LAYER 4: GLOBAL LIGHTING 
                  Adds cohesion and depth
                -->
                <rect width="100%" height="100%" fill="url(#screen-emission)" opacity="0.05" style="mix-blend-mode: screen;" pointer-events="none" />

            </svg>
        </div>
    </div>

    <script>
        // Interaction Logic: Enhanced Parallax
        const stage = document.getElementById('stage');
        const art = document.getElementById('art');

        let ticking = false;
        let targetX = 0;
        let targetY = 0;
        let currentX = 0;
        let currentY = 0;

        // Easing factor for smooth movement
        const ease = 0.1;

        function update() {
            // Linear interpolation (Lerp) for smoothness
            currentX += (targetX - currentX) * ease;
            currentY += (targetY - currentY) * ease;

            // Calculate rotation based on mouse position
            const rY = currentX * 8; // Max 8deg rotation Y
            const rX = -currentY * 8; // Max 8deg rotation X

            // Apply transform
            art.style.transform = `
                perspective(1200px) 
                rotateX(${rX}deg) 
                rotateY(${rY}deg) 
                scale(1.02)
            `;

            if (Math.abs(targetX - currentX) > 0.01 || Math.abs(targetY - currentY) > 0.01) {
                requestAnimationFrame(update);
            }
        }

        document.addEventListener('mousemove', (e) => {
            // Normalize coordinates from center (-1 to 1)
            targetX = (e.clientX / window.innerWidth) * 2 - 1;
            targetY = (e.clientY / window.innerHeight) * 2 - 1;

            if (!ticking) {
                requestAnimationFrame(update);
                ticking = true;
            }
        });

        // Reset smoothly when mouse leaves
        document.addEventListener('mouseleave', () => {
            targetX = 0;
            targetY = 0;
            if (!ticking) {
                requestAnimationFrame(update);
                ticking = true;
            }
        });
    </script>
</body>
</html>
