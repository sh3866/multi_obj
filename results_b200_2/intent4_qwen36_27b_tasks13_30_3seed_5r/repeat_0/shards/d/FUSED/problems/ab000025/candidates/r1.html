<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaction Study: Grip</title>
    <style>
        :root {
            --bg-dark: #050505;
            --text-subtle: #555555;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Subtle noise texture for realism */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.04;
            pointer-events: none;
            z-index: 10;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Vignette to focus the eye */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, #000 120%);
            pointer-events: none;
            z-index: 5;
        }

        /* The Stage */
        .stage {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px; /* For 3D tilt */
        }

        /* The Illustration Container */
        .art-container {
            width: 100%;
            height: 100%;
            max-width: 120vh; /* Maintain aspect ratio constraints */
            max-height: 120vw;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Corner Caption - Editorial Style */
        .caption {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-subtle);
            z-index: 20;
            mix-blend-mode: exclusion;
            pointer-events: none;
        }

        .caption span {
            display: block;
            margin-bottom: 0.25rem;
            color: #777;
        }
        
        .caption strong {
            color: #aaa;
            font-weight: 500;
        }

    </style>
</head>
<body>

    <div class="noise-overlay"></div>
    <div class="vignette"></div>

    <div class="caption">
        <span>Fig 04.2</span>
        <strong>Tactile Interface / Grip Study</strong>
    </div>

    <div class="stage" id="stage">
        <div class="art-container" id="art">
            <!-- 
                SVG Illustration: Hand & Phone Close-up
                Focus: Anatomy, Lighting, Depth
            -->
            <svg viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Skin Gradients -->
                    <linearGradient id="skin-light" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FDEBD0" />
                        <stop offset="40%" stop-color="#E6C2A0" />
                        <stop offset="100%" stop-color="#C49F82" />
                    </linearGradient>
                    
                    <linearGradient id="skin-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#D6B096" />
                        <stop offset="100%" stop-color="#8C634A" />
                    </linearGradient>

                    <linearGradient id="skin-dark" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#6e4e3d" />
                        <stop offset="100%" stop-color="#4a3327" />
                    </linearGradient>

                    <!-- Device Gradients -->
                    <linearGradient id="device-metal" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#2a2a2a" />
                        <stop offset="50%" stop-color="#151515" />
                        <stop offset="100%" stop-color="#050505" />
                    </linearGradient>

                    <linearGradient id="device-glass" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#1a1c20" />
                        <stop offset="100%" stop-color="#0a0b0d" />
                    </linearGradient>

                    <!-- Lighting / FX Gradients -->
                    <linearGradient id="rim-light" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="rgba(255,255,255,0)" />
                        <stop offset="50%" stop-color="rgba(255,255,255,0.4)" />
                        <stop offset="100%" stop-color="rgba(255,255,255,0)" />
                    </linearGradient>

                    <radialGradient id="screen-glow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#2a3b55" stop-opacity="0.4" />
                        <stop offset="100%" stop-color="#000" stop-opacity="0" />
                    </radialGradient>

                    <!-- Filters -->
                    <filter id="blur-heavy" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="12" />
                    </filter>
                    
                    <filter id="blur-soft" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="4" />
                    </filter>

                    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
                        <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
                    </filter>
                </defs>

                <!-- 1. The Background (Deep Space) -->
                <rect width="100%" height="100%" fill="url(#device-glass)" />
                
                <!-- 2. The Arm (Background Layer) -->
                <g id="arm" transform="translate(0, 0)">
                    <!-- Wrist/Palm Base entering from bottom left -->
                    <path d="M -50,1050 L 250,600 L 450,650 L 500,1050 Z" fill="url(#skin-shadow)" />
                    <!-- Muscle definition hint -->
                    <path d="M 100,1050 Q 200,800 350,650" stroke="url(#skin-dark)" stroke-width="4" fill="none" opacity="0.5" filter="url(#blur-soft)" />
                </g>

                <!-- 3. The Phone (Middle Layer) -->
                <!-- Tilted slightly for dynamic composition -->
                <g id="phone" transform="translate(280, 150) rotate(12)" filter="url(#drop-shadow)">
                    
                    <!-- Device Chassis -->
                    <rect x="0" y="0" width="280" height="600" rx="35" fill="url(#device-metal)" />
                    
                    <!-- Screen Bezel -->
                    <rect x="8" y="8" width="264" height="584" rx="28" fill="#000" />
                    
                    <!-- Screen Glass -->
                    <rect x="10" y="10" width="260" height="580" rx="26" fill="url(#device-glass)" />

                    <!-- Screen Content: Abstract UI -->
                    <g opacity="0.7">
                        <!-- Top Bar -->
                        <rect x="40" y="60" width="100" height="12" rx="6" fill="#333" />
                        <!-- Large Media/Image Area -->
                        <rect x="20" y="100" width="240" height="180" rx="15" fill="#111" stroke="#333" stroke-width="1" />
                        <!-- Abstract Graph/Data -->
                        <path d="M 30,200 L 80,160 L 130,190 L 200,120" stroke="#444" stroke-width="3" fill="none" />
                        <!-- Text Lines -->
                        <rect x="30" y="320" width="200" height="8" rx="4" fill="#333" />
                        <rect x="30" y="340" width="180" height="8" rx="4" fill="#333" />
                        <rect x="30" y="360" width="150" height="8" rx="4" fill="#333" />
                        <!-- Interactive Button -->
                        <rect x="30" y="420" width="100" height="40" rx="20" fill="#222" stroke="#444" stroke-width="1" />
                    </g>

                    <!-- Camera Module (Top Left) -->
                    <circle cx="30" cy="30" r="6" fill="#0a0a0a" stroke="#222" stroke-width="1" />
                    <circle cx="30" cy="30" r="2" fill="#1a1a1a" />

                    <!-- Speaker Grille (Top Center) -->
                    <rect x="110" y="14" width="60" height="4" rx="2" fill="#111" />

                    <!-- Glass Reflection (Diagonal Sheen) -->
                    <path d="M 10,10 L 270,10 L 270,300 L 10,600 Z" fill="url(#rim-light)" opacity="0.15" style="mix-blend-mode: overlay;" />
                    
                    <!-- Side Edge Highlight -->
                    <rect x="0" y="0" width="280" height="600" rx="35" fill="none" stroke="url(#rim-light)" stroke-width="1.5" opacity="0.6" />
                </g>

                <!-- 4. The Hand (Foreground Layer - Interaction) -->
                <g id="hand-interaction" transform="translate(0, 0)">
                    
                    <!-- Palm Base (Covering phone bottom-left) -->
                    <path d="M 220,650 Q 280,600 350,620 L 400,900 L 150,900 Z" fill="url(#skin-light)" />
                    
                    <!-- Cast Shadow: Hand onto Phone -->
                    <!-- This creates the illusion of depth and pressure -->
                    <g transform="translate(280, 150) rotate(12)" opacity="0.4" filter="url(#blur-soft)">
                        <path d="M -50,450 L 100,350 L 350,450 L 350,650 L -50,650 Z" fill="#000" />
                    </g>

                    <!-- FINGERS (Wrapping the right edge) -->
                    
                    <!-- Finger 1: Index -->
                    <g transform="translate(540, 450) rotate(25)">
                        <!-- Finger Body -->
                        <path d="M -20,0 Q 10,40 -5,90 L -25,90 Z" fill="url(#skin-shadow)" />
                        <!-- Knuckle -->
                        <circle cx="-5" cy="10" r="12" fill="url(#skin-light)" />
                        <!-- Nail -->
                        <ellipse cx="-15" cy="85" rx="6" ry="10" fill="#e0d0c0" opacity="0.8" />
                        <!-- Side Highlight -->
                        <path d="M -20,0 Q 10,40 -5,90" stroke="#fff" stroke-width="1" fill="none" opacity="0.2" />
                    </g>

                    <!-- Finger 2: Middle -->
                    <g transform="translate(560, 540) rotate(15)">
                        <path d="M -20,0 Q 5,40 -10,100 L -30,100 Z" fill="url(#skin-shadow)" />
                        <circle cx="-10" cy="10" r="13" fill="url(#skin-light)" />
                        <ellipse cx="-20" cy="95" rx="7" ry="11" fill="#e0d0c0" opacity="0.8" />
                    </g>

                    <!-- Finger 3: Ring -->
                    <g transform="translate(565, 630) rotate(5)">
                        <path d="M -20,0 Q 0,40 -15,100 L -35,100 Z" fill="url(#skin-shadow)" />
                        <circle cx="-15" cy="10" r="12" fill="url(#skin-light)" />
                        <ellipse cx="-25" cy="95" rx="6" ry="10" fill="#e0d0c0" opacity="0.8" />
                    </g>

                    <!-- Finger 4: Pinky -->
                    <g transform="translate(550, 710) rotate(-5)">
                        <path d="M -20,0 Q -5,30 -15,80 L -35,80 Z" fill="url(#skin-shadow)" />
                        <circle cx="-15" cy="10" r="11" fill="url(#skin-light)" />
                        <ellipse cx="-25" cy="75" rx="5" ry="9" fill="#e0d0c0" opacity="0.8" />
                    </g>

                    <!-- THUMB (The Hero - Crossing the screen) -->
                    <g transform="translate(280, 600) rotate(-30)">
                        
                        <!-- Thumb Shadow on Screen (Projected) -->
                        <!-- This must be inside the phone group ideally, but we fake it here -->
                        <ellipse cx="120" cy="150" rx="30" ry="40" fill="#000" opacity="0.3" filter="url(#blur-soft)" transform="rotate(-10)" />

                        <!-- Thumb Base (Web) -->
                        <path d="M -30,20 Q -60,60 -50,120 L -10,140 Z" fill="url(#skin-shadow)" />

                        <!-- Thumb Shaft -->
                        <path d="M -10,20 Q 20,80 60,160 L 20,180 Z" fill="url(#skin-light)" />
                        
                        <!-- Thumb Joint (Knuckle) -->
                        <circle cx="40" cy="110" r="16" fill="url(#skin-shadow)" />
                        <circle cx="40" cy="110" r="14" fill="url(#skin-light)" /> <!-- Highlight on top -->

                        <!-- Thumb Tip -->
                        <path d="M 20,180 Q 50,200 70,170 Q 60,140 60,160 Z" fill="url(#skin-light)" />
                        
                        <!-- Thumbnail -->
                        <path d="M 60,165 Q 70,175 65,185 Q 55,175 60,165" fill="#fff" opacity="0.9" />
                        
                        <!-- Skin Creases (Texture) -->
                        <path d="M 30,130 Q 40,140 35,150" stroke="#b08f75" stroke-width="1.5" fill="none" opacity="0.6" />
                        <path d="M 25,145 Q 35,155 30,165" stroke="#b08f75" stroke-width="1.5" fill="none" opacity="0.6" />
                        
                        <!-- Specular Highlight (Shiny skin) -->
                        <path d="M 30,80 Q 40,100 50,130" stroke="#fff" stroke-width="2" fill="none" opacity="0.3" filter="url(#blur-soft)" />
                    </g>
                </g>

                <!-- 5. Global Lighting Overlay -->
                <!-- A subtle blue rim light on the right side to simulate environment reflection -->
                <rect width="100%" height="100%" fill="url(#screen-glow)" style="mix-blend-mode: screen;" opacity="0.3" pointer-events="none"/>

            </svg>
        </div>
    </div>

    <script>
        // Subtle Parallax Interaction
        const stage = document.getElementById('stage');
        const art = document.getElementById('art');

        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;

            // Subtle rotation (max 5 degrees)
            const rotateY = x * 10; 
            const rotateX = -y * 10; // Invert Y for natural feel

            // Subtle translation
            const translateX = x * 20;
            const translateY = y * 20;

            art.style.transform = `
                perspective(1000px) 
                rotateX(${rotateX}deg) 
                rotateY(${rotateY}deg) 
                translate3d(${translateX}px, ${translateY}px, 0)
                scale(1.05)
            `;
        });

        // Reset on mouse leave
        document.addEventListener('mouseleave', () => {
            art.style.transform = `
                perspective(1000px) 
                rotateX(0deg) 
                rotateY(0deg) 
                translate3d(0px, 0px, 0)
                scale(1.05)
            `;
        });
    </script>
</body>
</html>
