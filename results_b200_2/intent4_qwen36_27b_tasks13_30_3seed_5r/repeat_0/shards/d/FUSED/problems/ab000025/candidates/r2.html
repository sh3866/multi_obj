<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaction Study: Grip & Light</title>
    <style>
        :root {
            --bg-deep: #08090a;
            --text-ui: #8899a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Film Grain Texture */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.05;
            pointer-events: none;
            z-index: 10;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Editorial Vignette */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 40%, #000 100%);
            pointer-events: none;
            z-index: 5;
        }

        /* The Stage */
        .stage {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1500px;
        }

        /* The Illustration Container */
        .art-container {
            width: 100%;
            height: 100%;
            max-width: 100vh; 
            max-height: 100vw;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: transform;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
            /* Hardware acceleration for the vector graphic */
            transform: translateZ(0); 
        }

        /* Corner Caption */
        .caption {
            position: absolute;
            bottom: 3rem;
            left: 3rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-ui);
            z-index: 20;
            mix-blend-mode: screen;
            pointer-events: none;
            line-height: 1.6;
        }

        .caption strong {
            display: block;
            color: #dce4eb;
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 0.85rem;
        }

        /* UI Hint */
        .hint {
            position: absolute;
            top: 3rem;
            right: 3rem;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #444;
            z-index: 20;
            pointer-events: none;
            text-align: right;
        }

    </style>
</head>
<body>

    <div class="noise-overlay"></div>
    <div class="vignette"></div>

    <div class="caption">
        <strong>Fig 04.2 // Grip Study</strong>
        Anatomy &amp; Contact Pressure Analysis
    </div>
    
    <div class="hint">Move cursor to shift perspective</div>

    <div class="stage" id="stage">
        <div class="art-container" id="art">
            <svg viewBox="0 0 900 1100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Skin Gradients: Refined for organic translucency -->
                    <linearGradient id="skin-main" x1="10%" y1="0%" x2="90%" y2="100%">
                        <stop offset="0%" stop-color="#F5D0B5" /> <!-- Highlight -->
                        <stop offset="40%" stop-color="#E0A98B" /> <!-- Midtone -->
                        <stop offset="80%" stop-color="#B57B5C" /> <!-- Shadow -->
                        <stop offset="100%" stop-color="#7A4F3A" /> <!-- Deep Shadow -->
                    </linearGradient>
                    
                    <radialGradient id="skin-joint" cx="30%" cy="30%" r="70%">
                        <stop offset="0%" stop-color="#F5D0B5" />
                        <stop offset="60%" stop-color="#C98E6E" />
                        <stop offset="100%" stop-color="#8C563D" />
                    </radialGradient>

                    <!-- Screen Glow: Blueish light source -->
                    <linearGradient id="screen-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#4facfe" stop-opacity="0.8"/>
                        <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.2"/>
                        <stop offset="100%" stop-color="#000" stop-opacity="0"/>
                    </linearGradient>

                    <!-- Device Gradients -->
                    <linearGradient id="device-frame" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3a3a3a" />
                        <stop offset="50%" stop-color="#1c1c1c" />
                        <stop offset="100%" stop-color="#080808" />
                    </linearGradient>

                    <!-- Filters -->
                    <filter id="blur-heavy" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="15" />
                    </filter>
                    
                    <filter id="blur-soft" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="4" />
                    </filter>

                    <filter id="shadow-cast" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="6" result="blur" />
                        <feOffset dx="0" dy="8" />
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.5" />
                        </feComponentTransfer>
                        <feComposite operator="over" in="SourceGraphic" />
                    </filter>
                </defs>

                <!-- 1. Background -->
                <rect width="100%" height="100%" fill="#08090a" />
                <!-- Subtle ambient gradient -->
                <circle cx="50%" cy="50%" r="60%" fill="url(#screen-glow-grad)" opacity="0.1" filter="url(#blur-heavy)" />

                <!-- 2. The Arm (Background) -->
                <g id="arm" transform="translate(100, 200)">
                    <!-- Forearm entering from bottom left -->
                    <path d="M -100,1200 L 150,700 C 250,600 350,550 450,500 L 600,800 L -100,1400 Z" fill="url(#skin-main)" opacity="0.9" />
                    <!-- Muscle/Fabric hint -->
                    <path d="M 200,800 Q 300,700 400,600" stroke="#7A4F3A" stroke-width="5" fill="none" opacity="0.4" filter="url(#blur-soft)" />
                </g>

                <!-- 3. The Phone (Middle Layer) -->
                <!-- Positioned centrally, tilted slightly -->
                <g id="phone" transform="translate(320, 120) rotate(8)">
                    
                    <!-- Device Shadow on Background -->
                    <rect x="20" y="40" width="300" height="650" rx="40" fill="#000" opacity="0.6" filter="url(#blur-heavy)" />

                    <!-- Chassis -->
                    <rect x="0" y="0" width="300" height="650" rx="40" fill="url(#device-frame)" />
                    
                    <!-- Side Buttons (Volume/Power) -->
                    <rect x="-4" y="150" width="6" height="40" rx="2" fill="#222" />
                    <rect x="-4" y="210" width="6" height="40" rx="2" fill="#222" />
                    <rect x="298" y="180" width="6" height="60" rx="2" fill="#222" />

                    <!-- Screen Bezel -->
                    <rect x="8" y="8" width="284" height="634" rx="32" fill="#000" />
                    
                    <!-- Screen Content -->
                    <g id="screen-content">
                        <!-- Glass Base -->
                        <rect x="10" y="10" width="280" height="630" rx="30" fill="#0d0e12" />
                        
                        <!-- UI Elements (High Contrast) -->
                        <g opacity="0.9">
                            <!-- Header -->
                            <rect x="40" y="60" width="80" height="10" rx="5" fill="#fff" opacity="0.8" />
                            
                            <!-- Active Graph -->
                            <path d="M 40,350 L 100,280 L 160,320 L 240,200" stroke="#4facfe" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#blur-soft)" opacity="0.5"/> <!-- Glow -->
                            <path d="M 40,350 L 100,280 L 160,320 L 240,200" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /> <!-- Core -->
                            
                            <!-- Data Points -->
                            <circle cx="100" cy="280" r="6" fill="#0d0e12" stroke="#fff" stroke-width="2" />
                            <circle cx="160" cy="320" r="6" fill="#0d0e12" stroke="#fff" stroke-width="2" />
                            <circle cx="240" cy="200" r="6" fill="#0d0e12" stroke="#fff" stroke-width="2" />

                            <!-- Text Blocks -->
                            <rect x="40" y="420" width="200" height="8" rx="4" fill="#444" />
                            <rect x="40" y="440" width="160" height="8" rx="4" fill="#444" />
                            <rect x="40" y="460" width="180" height="8" rx="4" fill="#444" />
                            
                            <!-- Bottom Action -->
                            <rect x="40" y="540" width="220" height="50" rx="15" fill="#fff" />
                            <rect x="110" y="560" width="80" height="10" rx="5" fill="#000" />
                        </g>

                        <!-- Camera Notch -->
                        <rect x="100" y="15" width="100" height="20" rx="10" fill="#000" />
                        <circle cx="180" cy="25" r="4" fill="#1a1a1a" />
                    </g>

                    <!-- Screen Glass Reflection -->
                    <path d="M 10,10 L 290,10 L 290,250 L 10,500 Z" fill="url(#screen-glow-grad)" opacity="0.1" style="mix-blend-mode: screen;" />
                </g>

                <!-- 4. The Hand (Foreground Layer - Interaction) -->
                <!-- Reconstructed anatomy: Fingers wrap organically, Thumb presses -->
                <g id="hand-foreground" transform="translate(0, 0)">
                    
                    <!-- Palm Base (Connecting arm to fingers) -->
                    <path d="M 250,800 C 350,750 450,700 500,650 L 550,950 L 200,1000 Z" fill="url(#skin-main)" />
                    
                    <!-- Screen Reflection on Palm (Blueish tint) -->
                    <path d="M 250,800 C 350,750 450,700 500,650 L 550,950 L 200,1000 Z" fill="#4facfe" opacity="0.15" style="mix-blend-mode: screen;" />

                    <!-- Cast Shadow from Hand onto Phone -->
                    <!-- Grounds the hand on the device -->
                    <g transform="translate(320, 120) rotate(8)" opacity="0.5" filter="url(#blur-soft)">
                        <path d="M 250,400 C 300,450 300,550 250,600 L -100,600 L -100,400 Z" fill="#000" />
                    </g>

                    <!-- FINGERS (Wrapping Right Edge) -->
                    <!-- Organic tapered paths, overlapping the device edge -->
                    
                    <!-- Index Finger -->
                    <g transform="translate(580, 480) rotate(20)">
                        <!-- Finger Shaft -->
                        <path d="M -15,0 C 10,50 5,100 -10,140 L -35,130 C -20,90 -25,40 -15,0 Z" fill="url(#skin-main)" />
                        <!-- Knuckle -->
                        <circle cx="-5" cy="15" r="14" fill="url(#skin-joint)" />
                        <!-- Nail (Subtle, semi-transparent) -->
                        <ellipse cx="-25" cy="125" rx="7" ry="12" fill="#F0E0D0" opacity="0.6" />
                        <!-- Rim Light -->
                        <path d="M -15,0 C 10,50 5,100 -10,140" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.3" filter="url(#blur-soft)" />
                    </g>

                    <!-- Middle Finger -->
                    <g transform="translate(600, 580) rotate(10)">
                        <path d="M -15,0 C 5,50 0,110 -15,150 L -40,140 C -25,100 -30,50 -15,0 Z" fill="url(#skin-main)" />
                        <circle cx="-10" cy="15" r="15" fill="url(#skin-joint)" />
                        <ellipse cx="-30" cy="135" rx="8" ry="13" fill="#F0E0D0" opacity="0.6" />
                    </g>

                    <!-- Ring Finger -->
                    <g transform="translate(595, 690) rotate(0)">
                        <path d="M -15,0 C 0,50 -5,100 -20,140 L -45,130 C -30,90 -35,40 -15,0 Z" fill="url(#skin-main)" />
                        <circle cx="-15" cy="15" r="13" fill="url(#skin-joint)" />
                        <ellipse cx="-35" cy="125" rx="7" ry="12" fill="#F0E0D0" opacity="0.6" />
                    </g>

                    <!-- Pinky Finger -->
                    <g transform="translate(570, 790) rotate(-10)">
                        <path d="M -15,0 C -5,40 -10,90 -25,120 L -45,110 C -30,70 -35,30 -15,0 Z" fill="url(#skin-main)" />
                        <circle cx="-20" cy="15" r="12" fill="url(#skin-joint)" />
                        <ellipse cx="-35" cy="105" rx="6" ry="10" fill="#F0E0D0" opacity="0.6" />
                    </g>

                    <!-- THUMB (The Hero - Pressing Screen) -->
                    <g transform="translate(380, 680) rotate(-25)">
                        
                        <!-- Thumb Shadow on Screen (Projected onto glass) -->
                        <ellipse cx="80" cy="120" rx="40" ry="60" fill="#000" opacity="0.4" filter="url(#blur-soft)" transform="rotate(10)" />

                        <!-- Thumb Base (Webbing) -->
                        <path d="M -20,20 Q -40,60 -30,120 L 10,130 Z" fill="url(#skin-main)" opacity="0.8" />

                        <!-- Thumb Shaft -->
                        <path d="M -10,20 Q 20,80 60,160 L 20,180 Z" fill="url(#skin-main)" />
                        
                        <!-- Joint (Knuckle) -->
                        <circle cx="40" cy="110" r="18" fill="url(#skin-joint)" />
                        
                        <!-- Thumb Tip (Pressing) -->
                        <path d="M 20,180 Q 50,200 70,170 Q 60,140 60,160 Z" fill="url(#skin-main)" />
                        
                        <!-- Thumbnail (Refined) -->
                        <path d="M 60,165 Q 70,175 65,185 Q 55,175 60,165" fill="#F0E0D0" opacity="0.8" />
                        
                        <!-- Skin Creases (Anatomy) -->
                        <path d="M 30,130 Q 40,140 35,150" stroke="#8C563D" stroke-width="2" fill="none" opacity="0.5" />
                        <path d="M 25,145 Q 35,155 30,165" stroke="#8C563D" stroke-width="2" fill="none" opacity="0.5" />
                        
                        <!-- Screen Reflection on Thumb (Blueish) -->
                        <path d="M 20,180 Q 50,200 70,170 Q 60,140 60,160 Z" fill="#4facfe" opacity="0.3" style="mix-blend-mode: screen;" />
                        
                        <!-- Specular Highlight (Shiny skin) -->
                        <path d="M 30,80 Q 40,100 50,130" stroke="#fff" stroke-width="2" fill="none" opacity="0.4" filter="url(#blur-soft)" />
                    </g>
                </g>

                <!-- 5. Global Lighting Overlay -->
                <!-- Adds atmosphere and unifies elements -->
                <rect width="100%" height="100%" fill="url(#screen-glow-grad)" opacity="0.1" style="mix-blend-mode: screen;" pointer-events="none"/>

            </svg>
        </div>
    </div>

    <script>
        // Parallax Interaction Logic
        const stage = document.getElementById('stage');
        const art = document.getElementById('art');

        // Throttling helper
        let ticking = false;

        function updateTransform(x, y) {
            // Normalize -1 to 1
            const nX = (x / window.innerWidth) * 2 - 1;
            const nY = (y / window.innerHeight) * 2 - 1;

            // Rotation values (degrees)
            const rY = nX * 8; // Rotate around Y axis based on X movement
            const rX = -nY * 8; // Rotate around X axis based on Y movement

            // Translation values (pixels)
            const tX = nX * 15;
            const tY = nY * 15;

            art.style.transform = `
                perspective(1200px) 
                rotateX(${rX}deg) 
                rotateY(${rY}deg) 
                translate3d(${tX}px, ${tY}px, 0)
                scale(1.02)
            `;
            ticking = false;
        }

        document.addEventListener('mousemove', (e) => {
            if (!ticking) {
                window.requestAnimationFrame(() => {
                    updateTransform(e.clientX, e.clientY);
                });
                ticking = true;
            }
        });

        // Reset on mouse leave
        document.addEventListener('mouseleave', () => {
            art.style.transform = `
                perspective(1200px) 
                rotateX(0deg) 
                rotateY(0deg) 
                translate3d(0px, 0px, 0)
                scale(1.02)
            `;
        });
    </script>
</body>
</html>
