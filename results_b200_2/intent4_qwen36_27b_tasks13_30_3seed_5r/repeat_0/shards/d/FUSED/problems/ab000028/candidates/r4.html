<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPINE // DESCENT - REVISED</title>
    <style>
        :root {
            --bg-deep: #020617;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #38bdf8;
            --accent-danger: #ef4444;
            --accent-warn: #f59e0b;
            --font-mono: 'Courier New', Courier, monospace;
            --font-display: 'Impact', 'Arial Black', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* --- Layout --- */
        .screen-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* --- The Visual Scene (SVG) --- */
        .scene-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- UI Overlay (HUD) - REVISED: Reduced visual weight --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            /* Stronger Vignette for cinematic focus */
            background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.6) 100%);
        }

        /* Top Left: Title */
        .header {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            opacity: 0.8;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 3.5rem;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: rgba(255,255,255,0.95);
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .meta-tag {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--accent-cyan);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        
        .meta-tag::before {
            content: '';
            display: block;
            width: 12px;
            height: 2px;
            background: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        /* Bottom Right: Integrated Flight Computer - REVISED: Thinner, sleeker */
        .flight-computer {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            width: 220px;
            background: rgba(15, 23, 42, 0.6); /* More transparent */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-left: 2px solid var(--accent-cyan);
            padding: 1rem;
            pointer-events: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transform: skewX(-5deg);
        }

        .computer-header {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--accent-cyan);
            margin-bottom: 0.8rem;
            border-bottom: 1px solid rgba(56, 189, 248, 0.15);
            padding-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            opacity: 0.8;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            align-items: baseline;
            padding-left: 2px;
        }

        .data-label {
            font-family: var(--font-mono);
            font-size: 0.55rem;
            color: var(--text-muted);
            text-transform: uppercase;
            opacity: 0.7;
            letter-spacing: 0.5px;
        }

        .data-value {
            font-family: var(--font-mono);
            font-size: 1rem;
            color: var(--text-main);
            font-weight: bold;
            letter-spacing: -0.5px;
            text-shadow: 0 0 5px rgba(255,255,255,0.1);
        }
        
        .data-value.danger { color: var(--accent-danger); text-shadow: 0 0 8px rgba(239, 68, 68, 0.6); }
        .data-value.good { color: var(--accent-cyan); }
        .data-value.warn { color: var(--accent-warn); }

        /* Footer / Status Bar */
        .footer {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            opacity: 0.6;
            display: flex;
            gap: 25px;
            letter-spacing: 1px;
        }
        
        .footer div::before {
            content: '//';
            margin-right: 6px;
            color: var(--accent-cyan);
            opacity: 0.5;
        }

        /* --- SVG Styles --- */
        
        /* Cliff Gradients - REVISED: Smoother, more realistic */
        .cliff-main {
            fill: url(#cliffGradientMain);
        }

        /* Canopy Gradients - REVISED: Editorial style */
        .canopy-fill {
            fill: url(#canopyGradient);
            stroke: rgba(255,255,255,0.4);
            stroke-width: 1;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
        }

        .canopy-shadow {
            fill: url(#canopyShadowGrad);
            opacity: 0.7;
            mix-blend-mode: multiply;
        }

        /* Harness Lines - REVISED: Thicker, glowing */
        .harness-line {
            stroke: #e2e8f0;
            stroke-width: 2.5; /* Thicker */
            fill: none;
            opacity: 0.9;
            stroke-linecap: round;
            filter: drop-shadow(0 0 3px rgba(255,255,255,0.6));
        }

        /* Human Figure - REVISED: Lighter, rim lit */
        .human-figure {
            fill: #1e293b; /* Darker grey, not black */
            stroke: #94a3b8; /* Rim light color */
            stroke-width: 1.5;
            filter: drop-shadow(0 0 5px rgba(148, 163, 184, 0.3));
        }

        /* Wind Streaks - REVISED: More prominent */
        .wind-streak {
            stroke: rgba(255, 255, 255, 0.5);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-dasharray: 10 5;
        }
        
        .wind-streak-fast {
            stroke: rgba(255, 255, 255, 0.8);
            stroke-width: 3;
        }

        /* Animations */
        @keyframes blink-red {
            0% { opacity: 1; text-shadow: 0 0 10px var(--accent-danger); }
            50% { opacity: 0.6; text-shadow: none; }
            100% { opacity: 1; text-shadow: 0 0 10px var(--accent-danger); }
        }
        
        .blink { animation: blink-red 1.2s infinite; }

    </style>
</head>
<body>

<div class="screen-container">
    
    <!-- Background / Scene SVG -->
    <svg class="scene-layer" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Sky Gradient: Deep Atmospheric -->
            <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#020617;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#0f172a;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
            </linearGradient>

            <!-- Cliff Gradient: Smooth Volume -->
            <linearGradient id="cliffGradientMain" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#020617;stop-opacity:1" />
                <stop offset="70%" style="stop-color:#0f172a;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
            </linearGradient>

            <!-- Canopy Gradient: Smooth 3D -->
            <radialGradient id="canopyGradient" cx="50%" cy="50%" r="50%" fx="30%" fy="20%">
                <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
                <stop offset="40%" style="stop-color:#f1f5f9;stop-opacity:1" />
                <stop offset="80%" style="stop-color:#94a3b8;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
            </radialGradient>

            <!-- Canopy Shadow -->
            <radialGradient id="canopyShadowGrad" cx="50%" cy="100%" r="80%">
                <stop offset="0%" style="stop-color:#000;stop-opacity:0.8" />
                <stop offset="100%" style="stop-color:#000;stop-opacity:0" />
            </radialGradient>

            <!-- Mist Blur -->
            <filter id="blurMist" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="25" />
            </filter>
            
            <!-- Rim Light Filter -->
            <filter id="rimLight">
                <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
        </defs>

        <!-- 1. Sky Background -->
        <rect width="1920" height="1080" fill="url(#skyGradient)" />

        <!-- 2. Distant Mountains (Atmospheric Depth) - REVISED: More layers -->
        <g id="distant-mountains">
            <!-- Layer 1: Far Horizon -->
            <path d="M-200,1080 L-200,600 Q200,550 500,700 T1400,600 T1920,750 L1920,1080 Z" 
                  fill="#3b82f6" opacity="0.15" filter="url(#blurMist)" />
            
            <!-- Layer 2: Mid Range -->
            <path d="M0,1080 L0,700 Q300,650 600,800 T1200,720 T1920,850 L1920,1080 Z" 
                  fill="#1e3a8a" opacity="0.3" filter="url(#blurMist)" />
            
            <!-- Layer 3: Near Background (Silhouette) -->
            <path d="M800,1080 L800,750 Q1200,650 1920,800 L1920,1080 Z" 
                  fill="#0f172a" opacity="0.7" />
        </g>

        <!-- 3. Wind / Motion Cues -->
        <g id="wind-group"></g>

        <!-- 4. The Dramatic Cliff (Foreground Left) - REVISED: Smooth, Strata-focused -->
        <g id="cliff-group">
            <!-- Base Silhouette -->
            <path class="cliff-main" d="M-100,-100 L700,-100 
                L700,200 
                L680,220 L650,250 
                L620,300 L660,350 
                L600,450 L640,500 
                L550,600 L600,650 
                L500,800 L550,850 
                L450,1000 L500,1150 
                L-100,1150 Z" />
            
            <!-- Horizontal Strata (Rock Layers) - REVISED: Sweeping curves -->
            <g id="rock-strata">
                <!-- Top Edge Highlight -->
                <path d="M700,-100 L700,200 L680,220 L650,250 L620,300 L660,350 L600,450 L640,500 L550,600 L600,650 L500,800 L550,850 L450,1000 L500,1150" 
                      fill="none" stroke="#94a3b8" stroke-width="3" opacity="0.4" filter="url(#rimLight)"/>

                <!-- Strata 1 (Top) -->
                <path d="M700,200 Q650,210 650,250 Q680,260 700,280 Z" fill="#1e293b" opacity="0.8"/>
                
                <!-- Strata 2 -->
                <path d="M700,300 Q630,310 620,300 L660,350 Q690,360 700,380 Z" fill="#334155" opacity="0.9"/>
                
                <!-- Strata 3 (Middle) -->
                <path d="M700,400 Q630,420 600,450 L640,500 Q680,520 700,550 Z" fill="#0f172a" opacity="0.8"/>
                
                <!-- Strata 4 -->
                <path d="M700,600 Q620,610 550,600 L600,650 Q660,670 700,700 Z" fill="#475569" opacity="0.7"/>
                
                <!-- Strata 5 (Bottom) -->
                <path d="M700,800 Q600,820 500,800 L550,850 Q620,880 700,900 Z" fill="#1e293b" opacity="0.9"/>
                
                <!-- Strata 6 -->
                <path d="M700,1000 Q550,1020 450,1000 L500,1150 Q600,1160 700,1150 Z" fill="#334155" opacity="0.8"/>
            </g>

            <!-- Snow/Ice Highlights on ledges -->
            <g id="snow-highlights" opacity="0.6">
                <path d="M680,220 Q660,230 650,250" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
                <path d="M640,500 Q620,510 600,450" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
                <path d="M550,850 Q520,860 500,800" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
            </g>
        </g>

        <!-- 5. The Parachuter Group -->
        <!-- REVISED: Shifted closer to cliff (x: 1000 instead of 1200) -->
        <g id="parachuter-group" transform="translate(1000, 400)">
            
            <!-- Taut Harness Lines -->
            <g class="harness-lines">
                <!-- Left side lines (Converging) -->
                <line class="harness-line" x1="-160" y1="20" x2="-15" y2="160" />
                <line class="harness-line" x1="-100" y1="50" x2="-10" y2="160" />
                <line class="harness-line" x1="-30" y1="60" x2="-2" y2="160" />
                <!-- Right side lines -->
                <line class="harness-line" x1="160" y1="20" x2="15" y2="160" />
                <line class="harness-line" x1="100" y1="50" x2="10" y2="160" />
                <line class="harness-line" x1="30" y1="60" x2="2" y2="160" />
            </g>

            <!-- Fully Inflated Canopy -->
            <g class="canopy">
                <!-- Main Dome Shape -->
                <path class="canopy-fill" d="M-180,0 C-180,-160 180,-160 180,0 C180,50 120,60 0,60 C-120,60 -180,50 -180,0 Z" />
                
                <!-- Inner Shadow for Volume -->
                <path class="canopy-shadow" d="M-180,0 C-180,-160 180,-160 180,0 C180,50 120,60 0,60 C-120,60 -180,50 -180,0 Z" />
                
                <!-- Vent holes (Top) -->
                <ellipse class="canopy-vent" cx="0" cy="-15" rx="28" ry="10" fill="#0f172a" opacity="0.4" />
                <ellipse class="canopy-vent" cx="-40" cy="-8" rx="15" ry="5" fill="#0f172a" opacity="0.3" />
                <ellipse class="canopy-vent" cx="40" cy="-8" rx="15" ry="5" fill="#0f172a" opacity="0.3" />
                
                <!-- Editorial Facets (Subtle lines to match rock strata) -->
                <path d="M0,-160 L0,60" stroke="rgba(255,255,255,0.1)" stroke-width="2" fill="none"/>
                <path d="M-60,-140 Q-80,0 -180,0" stroke="rgba(255,255,255,0.1)" stroke-width="2" fill="none"/>
                <path d="M60,-140 Q80,0 180,0" stroke="rgba(255,255,255,0.1)" stroke-width="2" fill="none"/>
            </g>

            <!-- Suspended Human Figure -->
            <g class="human-figure">
                <!-- Harness Pack -->
                <rect x="-22" y="150" width="44" height="55" rx="6" fill="#1e293b" stroke="#94a3b8" />
                
                <!-- Legs (Dangling) -->
                <path d="M-14,195 C-14,235 -28,265 -22,285" stroke="#1e293b" stroke-width="12" fill="none" stroke-linecap="round"/>
                <path d="M14,195 C14,235 28,265 22,285" stroke="#1e293b" stroke-width="12" fill="none" stroke-linecap="round"/>
                
                <!-- Torso -->
                <path d="M-14,150 L-10,195 L10,195 L14,150 Z" fill="#1e293b" />
                
                <!-- Head (Helm) -->
                <circle cx="0" cy="135" r="16" fill="#1e293b" />
                
                <!-- Arms (Bracing) -->
                <path d="M-10,155 C-32,150 -48,135 -58,120" stroke="#1e293b" stroke-width="10" fill="none" stroke-linecap="round"/>
                <path d="M10,155 C32,150 48,135 58,120" stroke="#1e293b" stroke-width="10" fill="none" stroke-linecap="round"/>
            </g>
        </g>

    </svg>

    <!-- UI Overlay -->
    <div class="ui-layer">
        
        <!-- Top Left: Title -->
        <div class="header">
            <div class="meta-tag">Live Telemetry // Sector 7</div>
            <h1>Alpine Descent</h1>
        </div>

        <!-- Bottom Right: Flight Computer -->
        <div class="flight-computer">
            <div class="computer-header">
                <span>Flight Comp</span>
                <span>v2.5</span>
            </div>
            
            <div class="data-row">
                <span class="data-label">Altitude</span>
                <span class="data-value" id="alt-val">14,200 ft</span>
            </div>
            <div class="data-row">
                <span class="data-label">V-Speed</span>
                <span class="data-value danger blink" id="speed-val">-24 ft/s</span>
            </div>
            <div class="data-row">
                <span class="data-label">Wind</span>
                <span class="data-value" id="wind-val">NW 12mph</span>
            </div>
            <div class="data-row">
                <span class="data-label">Load</span>
                <span class="data-value good">NOMINAL</span>
            </div>
            <div class="data-row">
                <span class="data-label">Prox</span>
                <span class="data-value warn" id="prox-val">CAUTION</span>
            </div>
        </div>

        <!-- Bottom Left: Status -->
        <div class="footer">
            <div>SYS.ONLINE</div>
            <div>RENDER: SVG_CANVAS</div>
        </div>

    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const windGroup = document.getElementById('wind-group');
        const parachuter = document.getElementById('parachuter-group');
        const altVal = document.getElementById('alt-val');
        const speedVal = document.getElementById('speed-val');
        const windVal = document.getElementById('wind-val');
        
        // --- Animation State ---
        let time = 0;
        let altitude = 14200;
        
        // --- Generate Wind Lines - REVISED: More lines, directional -->
        const windLines = [];
        const lineCount = 80;
        for(let i=0; i<lineCount; i++) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            const y = Math.random() * 1080;
            const x = Math.random() * 1920;
            // Longer lines for speed sensation
            const len = 200 + Math.random() * 600; 
            
            line.setAttribute("x1", x);
            line.setAttribute("y1", y);
            line.setAttribute("x2", x + len);
            line.setAttribute("y2", y);
            
            // 30% chance of being a "fast" prominent streak
            if(Math.random() > 0.7) {
                line.setAttribute("class", "wind-streak wind-streak-fast");
            } else {
                line.setAttribute("class", "wind-streak");
            }
            
            // Random opacity, but generally higher to be visible
            line.setAttribute("opacity", (Math.random() * 0.5) + 0.2);
            
            windGroup.appendChild(line);
            windLines.push({
                el: line,
                x: x,
                y: y,
                // Speed correlates with size
                speed: 20 + (len / 25), 
                len: len
            });
        }

        // --- Main Animation Loop ---
        function animate() {
            time += 0.015;

            // 1. Parachuter Physics
            // Bobbing (Sine wave Y)
            const bobY = Math.sin(time * 2.5) * 20; 
            // Swaying (Sine wave X - tighter to show control/tension)
            const swayX = Math.sin(time * 1.2) * 25;
            
            // Descent Loop (Visual only)
            // Start at 400, go to 800, reset
            const descent = (time * 50) % 800; 
            
            // Apply transform
            // Center X is 1000 (Closer to cliff)
            parachuter.setAttribute('transform', `translate(${1000 + swayX}, ${400 + descent + bobY})`);

            // 2. Wind Animation
            windLines.forEach(line => {
                line.x += line.speed;
                if(line.x > 1920) {
                    line.x = -line.len;
                    line.y = Math.random() * 1080;
                }
                line.el.setAttribute("x1", line.x);
                line.el.setAttribute("x2", line.x + line.len);
            });

            // 3. Data Update Simulation
            altitude -= 0.6; // Slightly faster descent
            if(altitude < 13900) altitude = 14200;
            altVal.innerText = Math.floor(altitude).toLocaleString() + " ft";

            // Fluctuate Speed
            const speed = 24 + Math.floor(Math.sin(time * 5) * 2);
            speedVal.innerText = `-${speed} ft/s`;

            // Fluctuate Wind
            const wind = 12 + Math.floor(Math.sin(time * 1.5) * 3);
            windVal.innerText = `NW ${wind}mph`;

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>
</body>
</html>
