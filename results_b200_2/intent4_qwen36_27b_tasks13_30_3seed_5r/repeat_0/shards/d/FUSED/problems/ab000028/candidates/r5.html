<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPINE // DESCENT - REVISION 2</title>
    <style>
        :root {
            --bg-deep: #020617;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent-cyan: #38bdf8;
            --accent-danger: #ef4444;
            --accent-warn: #f59e0b;
            --font-mono: 'Courier New', Courier, monospace;
            --font-display: 'Impact', 'Arial Black', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* --- Layout --- */
        .screen-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* --- The Visual Scene (SVG) --- */
        .scene-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- UI Overlay (Editorial Style) --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3rem;
            background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,0,0,0.8) 100%);
        }

        /* Top Left: Title */
        .header {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            opacity: 0.9;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 4rem;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
            font-style: italic;
        }

        .meta-tag {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--accent-cyan);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .meta-tag::before {
            content: '';
            display: block;
            width: 20px;
            height: 2px;
            background: var(--accent-cyan);
        }

        /* Bottom Right: Integrated Flight Computer - Editorial Style */
        .flight-computer {
            position: absolute;
            bottom: 3rem;
            right: 3rem;
            width: 200px;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .data-row {
            display: flex;
            justify-content: flex-end;
            align-items: baseline;
            margin-bottom: 0.5rem;
            text-align: right;
            position: relative;
        }

        /* Vertical line connecting data points */
        .flight-computer::before {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 1px;
            background: rgba(255,255,255,0.1);
            z-index: -1;
        }

        .data-label {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-right: 15px;
        }

        .data-value {
            font-family: var(--font-mono);
            font-size: 1.2rem;
            color: var(--text-main);
            font-weight: bold;
            letter-spacing: -0.5px;
        }
        
        .data-value.danger { color: var(--accent-danger); }
        .data-value.good { color: var(--text-main); opacity: 0.8; }
        .data-value.warn { color: var(--accent-warn); }

        /* Footer / Status Bar */
        .footer {
            position: absolute;
            bottom: 3rem;
            left: 3rem;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            display: flex;
            gap: 30px;
            letter-spacing: 1px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
        }

        /* --- SVG Styles --- */
        
        /* Cliff Styles */
        .cliff-face {
            fill: #0f172a;
        }

        .cliff-highlight {
            fill: #1e293b;
        }

        .cliff-shadow {
            fill: #020617;
        }

        /* Canopy Styles - Editorial Segmented Look */
        .canopy-panel {
            stroke: #1e293b;
            stroke-width: 1.5;
            stroke-linejoin: round;
        }

        /* Harness Lines */
        .harness-line {
            stroke: #e2e8f0;
            stroke-width: 1.5;
            fill: none;
            opacity: 0.8;
            stroke-linecap: round;
        }

        /* Human Figure */
        .human-figure {
            fill: #ffffff; /* High contrast silhouette */
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
        }

        /* Wind Streaks */
        .wind-streak {
            fill: none;
            stroke: rgba(255, 255, 255, 0.15);
            stroke-linecap: round;
        }
        
        /* Animations */
        @keyframes blink-red {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        
        .blink { animation: blink-red 1s infinite; }

    </style>
</head>
<body>

<div class="screen-container">
    
    <!-- Background / Scene SVG -->
    <svg class="scene-layer" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Sky Gradient -->
            <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#020617;stop-opacity:1" />
                <stop offset="40%" style="stop-color:#0f172a;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
            </linearGradient>

            <!-- Atmospheric Blur -->
            <filter id="blurMist" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="30" />
            </filter>

            <!-- Canopy Gradient: Multi-stop for volume -->
            <linearGradient id="canopyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
                <stop offset="40%" style="stop-color:#cbd5e1;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#64748b;stop-opacity:1" />
            </linearGradient>

            <!-- Cliff Texture Gradient -->
            <linearGradient id="cliffTexture" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#020617;stop-opacity:1" />
                <stop offset="60%" style="stop-color:#0f172a;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
            </linearGradient>
        </defs>

        <!-- 1. Sky Background -->
        <rect width="1920" height="1080" fill="url(#skyGradient)" />

        <!-- 2. Distant Mountains (Atmospheric Depth) -->
        <g id="distant-mountains">
            <!-- Layer 1: Far Horizon (Lightest) -->
            <path d="M-200,1080 L-200,600 Q400,500 800,700 T1920,650 L1920,1080 Z" 
                  fill="#3b82f6" opacity="0.1" filter="url(#blurMist)" />
            
            <!-- Layer 2: Mid Range (Darker) -->
            <path d="M0,1080 L0,750 Q600,650 1200,850 T1920,800 L1920,1080 Z" 
                  fill="#1e3a8a" opacity="0.2" filter="url(#blurMist)" />
            
            <!-- Layer 3: Near Background (Silhouette) -->
            <path d="M800,1080 L800,800 Q1400,750 1920,900 L1920,1080 Z" 
                  fill="#0f172a" opacity="0.6" />
        </g>

        <!-- 3. Wind / Motion Cues -->
        <g id="wind-group"></g>

        <!-- 4. The Dramatic Cliff (Foreground Left) -->
        <g id="cliff-group">
            <!-- Base Shape -->
            <path d="M-100,-100 L600,-100 
                L600,150 
                L580,160 L550,200 
                L520,280 L560,320 
                L500,420 L540,480 
                L480,550 L530,600 
                L450,750 L500,800 
                L400,950 L450,1000 
                L400,1150 L-100,1150 Z" 
                fill="url(#cliffTexture)" />

            <!-- Faceted Rock Layers (Strata) -->
            <g opacity="0.9">
                <!-- Strata 1 -->
                <path d="M600,150 L580,160 L550,200 L520,280 L560,320 L500,420 L540,480 L480,550 L530,600 L450,750 L500,800 L400,950 L450,1000 L400,1150" 
                      fill="none" stroke="#475569" stroke-width="2" />
                
                <!-- Highlight Facets -->
                <path d="M600,150 L550,200 L560,320 L540,480 L530,600 L500,800 L450,1000" 
                      fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="square" opacity="0.3"/>
                
                <!-- Detail Lines -->
                <path d="M590,150 L540,200" stroke="#1e293b" stroke-width="2" />
                <path d="M550,280 L530,420" stroke="#1e293b" stroke-width="2" />
                <path d="M520,550 L480,750" stroke="#1e293b" stroke-width="2" />
            </g>

            <!-- Snow/Ice Accents -->
            <g opacity="0.7">
                <path d="M580,160 L550,200" fill="none" stroke="#cbd5e1" stroke-width="3" />
                <path d="M540,480 L530,600" fill="none" stroke="#cbd5e1" stroke-width="3" />
                <path d="M450,1000 L400,1150" fill="none" stroke="#cbd5e1" stroke-width="4" />
            </g>
        </g>

        <!-- 5. The Parachuter Group -->
        <!-- Positioned centrally but slightly left to balance the cliff -->
        <g id="parachuter-group" transform="translate(950, 350)">
            
            <!-- Taut Harness Lines -->
            <g class="harness-lines">
                <!-- Left side -->
                <line class="harness-line" x1="-150" y1="30" x2="-15" y2="180" />
                <line class="harness-line" x1="-90" y1="60" x2="-10" y2="180" />
                <line class="harness-line" x1="-20" y1="70" x2="-2" y2="180" />
                <!-- Right side -->
                <line class="harness-line" x1="150" y1="30" x2="15" y2="180" />
                <line class="harness-line" x1="90" y1="60" x2="10" y2="180" />
                <line class="harness-line" x1="20" y1="70" x2="2" y2="180" />
            </g>

            <!-- Fully Inflated Canopy (Segmented) -->
            <g class="canopy">
                <!-- Center Panel -->
                <path class="canopy-panel" fill="url(#canopyGrad)" d="M-30,-140 Q0,-160 30,-140 L30,60 Q0,70 -30,60 Z" />
                <!-- Left Panel 1 -->
                <path class="canopy-panel" fill="#cbd5e1" d="M-30,-140 Q-80,-150 -130,-110 L-130,50 Q-80,60 -30,60 Z" />
                <!-- Right Panel 1 -->
                <path class="canopy-panel" fill="#94a3b8" d="M30,-140 Q80,-150 130,-110 L130,50 Q80,60 30,60 Z" />
                <!-- Left Wing -->
                <path class="canopy-panel" fill="#64748b" d="M-130,-110 Q-180,-100 -190,-50 L-190,40 Q-180,50 -130,50 Z" />
                <!-- Right Wing -->
                <path class="canopy-panel" fill="#475569" d="M130,-110 Q180,-100 190,-50 L190,40 Q180,50 130,50 Z" />
                
                <!-- Vent Holes -->
                <ellipse cx="0" cy="-130" rx="15" ry="5" fill="#0f172a" opacity="0.5" />
            </g>

            <!-- Suspended Human Figure (Silhouette) -->
            <g class="human-figure">
                <!-- Harness -->
                <rect x="-18" y="170" width="36" height="45" rx="4" />
                
                <!-- Legs (Tucked/Dangling) -->
                <path d="M-12,205 C-12,240 -25,260 -20,280" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round"/>
                <path d="M12,205 C12,240 25,260 20,280" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round"/>
                
                <!-- Torso -->
                <path d="M-12,170 L-8,205 L8,205 L12,170 Z" />
                
                <!-- Head -->
                <circle cx="0" cy="155" r="14" />
                
                <!-- Arms (Reaching up/controlling) -->
                <path d="M-8,175 C-30,170 -45,150 -50,130" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M8,175 C30,170 45,150 50,130" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round"/>
            </g>
        </g>

        <!-- 6. Loose Debris / Birds (Scale cues) -->
        <g id="debris-group">
            <circle cx="700" cy="500" r="2" fill="#fff" opacity="0.6" />
            <circle cx="720" cy="520" r="1.5" fill="#fff" opacity="0.4" />
            <path d="M1500,300 Q1505,295 1510,300 Q1505,298 1500,300 Z" fill="#fff" opacity="0.3" />
            <path d="M1520,280 Q1525,275 1530,280 Q1525,278 1520,280 Z" fill="#fff" opacity="0.2" />
        </g>

    </svg>

    <!-- UI Overlay -->
    <div class="ui-layer">
        
        <!-- Top Left: Title -->
        <div class="header">
            <div class="meta-tag">Live Telemetry // Sector 7</div>
            <h1>Alpine Descent</h1>
        </div>

        <!-- Bottom Right: Flight Computer (Editorial) -->
        <div class="flight-computer">
            <div class="data-row">
                <span class="data-label">Altitude</span>
                <span class="data-value" id="alt-val">14,200 ft</span>
            </div>
            <div class="data-row">
                <span class="data-label">V-Speed</span>
                <span class="data-value danger blink" id="speed-val">-24 ft/s</span>
            </div>
            <div class="data-row">
                <span class="data-label">Wind</span>
                <span class="data-value" id="wind-val">NW 12mph</span>
            </div>
            <div class="data-row">
                <span class="data-label">Prox</span>
                <span class="data-value warn" id="prox-val">CAUTION</span>
            </div>
        </div>

        <!-- Bottom Left: Status -->
        <div class="footer">
            <div>SYS.ONLINE</div>
            <div>RENDER: SVG_CANVAS</div>
        </div>

    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const windGroup = document.getElementById('wind-group');
        const parachuter = document.getElementById('parachuter-group');
        const altVal = document.getElementById('alt-val');
        const speedVal = document.getElementById('speed-val');
        const windVal = document.getElementById('wind-val');
        
        // --- Animation State ---
        let time = 0;
        let altitude = 14200;
        
        // --- Generate Wind Lines (Streaks) ---
        const windLines = [];
        const lineCount = 60;
        for(let i=0; i<lineCount; i++) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            const y = Math.random() * 1080;
            const x = Math.random() * 1920;
            // Varying lengths for depth
            const len = 100 + Math.random() * 400; 
            
            line.setAttribute("x1", x);
            line.setAttribute("y1", y);
            line.setAttribute("x2", x + len);
            line.setAttribute("y2", y);
            
            line.setAttribute("class", "wind-streak");
            line.setAttribute("stroke-width", Math.random() * 1.5 + 0.5);
            
            // Random opacity
            line.setAttribute("opacity", (Math.random() * 0.3) + 0.05);
            
            windGroup.appendChild(line);
            windLines.push({
                el: line,
                x: x,
                y: y,
                // Speed based on "depth" (size)
                speed: 15 + (len / 20), 
                len: len
            });
        }

        // --- Main Animation Loop ---
        function animate() {
            time += 0.016; // Approx 60fps

            // 1. Parachuter Physics
            // Bobbing (Y)
            const bobY = Math.sin(time * 2.5) * 25; 
            // Swaying (X) - controlled but drifting
            const swayX = Math.sin(time * 1.2) * 30;
            
            // Descent Loop (Visual only)
            // Starts at 350, goes down to 800, resets
            const descent = (time * 40) % 800; 
            
            // Apply transform
            // Center X is 950
            parachuter.setAttribute('transform', `translate(${950 + swayX}, ${350 + descent + bobY})`);

            // 2. Wind Animation
            windLines.forEach(line => {
                line.x += line.speed;
                if(line.x > 1920) {
                    line.x = -line.len;
                    line.y = Math.random() * 1080;
                }
                line.el.setAttribute("x1", line.x);
                line.el.setAttribute("x2", line.x + line.len);
            });

            // 3. Data Update Simulation
            altitude -= 0.5; 
            if(altitude < 13900) altitude = 14200;
            altVal.innerText = Math.floor(altitude).toLocaleString() + " ft";

            // Fluctuate Speed
            const speed = 24 + Math.floor(Math.sin(time * 5) * 2);
            speedVal.innerText = `-${speed} ft/s`;

            // Fluctuate Wind
            const wind = 12 + Math.floor(Math.sin(time * 1.5) * 3);
            windVal.innerText = `NW ${wind}mph`;

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>
</body>
</html>
