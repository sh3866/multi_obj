<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPINE // DESCENT</title>
    <style>
        :root {
            --bg-deep: #020617;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #38bdf8;
            --accent-danger: #ef4444;
            --font-mono: 'Courier New', Courier, monospace;
            --font-display: 'Impact', 'Arial Black', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* --- Layout --- */
        .screen-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* --- The Visual Scene (SVG) --- */
        .scene-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- UI Overlay (HUD) --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.5rem;
        }

        /* Top Left: Minimal Title */
        .header {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            opacity: 0.8;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-main);
            margin-left: 2px;
        }

        .meta-tag {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--accent-cyan);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .meta-tag::before {
            content: '';
            display: block;
            width: 12px;
            height: 2px;
            background: var(--accent-cyan);
        }

        /* Bottom Right: Integrated Flight Computer */
        .flight-computer {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            width: 220px;
            background: rgba(2, 6, 23, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 3px solid var(--accent-cyan);
            padding: 1rem;
            pointer-events: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transform: skewX(-5deg); /* Tech aesthetic */
        }

        .computer-header {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.4rem;
            align-items: flex-end;
        }

        .data-label {
            font-family: var(--font-mono);
            font-size: 0.55rem;
            color: var(--text-muted);
            text-transform: uppercase;
            opacity: 0.7;
        }

        .data-value {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--text-main);
            font-weight: bold;
            letter-spacing: -0.5px;
        }
        
        .data-value.danger { color: var(--accent-danger); }
        .data-value.good { color: var(--accent-cyan); }

        /* Footer / Status Bar */
        .footer {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            opacity: 0.6;
            display: flex;
            gap: 20px;
        }

        /* --- SVG Styles --- */
        
        /* Gradients */
        .cliff-face {
            fill: url(#cliffGradient);
            stroke: #1e293b;
            stroke-width: 1;
        }
        
        .cliff-highlight {
            fill: none;
            stroke: #475569;
            stroke-width: 2;
            stroke-linecap: round;
        }

        .canopy-fill {
            fill: url(#canopyGradient);
            stroke: #f8fafc;
            stroke-width: 1.5;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        }

        .canopy-vent {
            fill: #0f172a;
            opacity: 0.6;
        }

        .harness-line {
            stroke: #cbd5e1;
            stroke-width: 1.5;
            fill: none;
            opacity: 0.8;
        }

        .human-figure {
            fill: #020617; /* High contrast silhouette */
        }

        .wind-streak {
            stroke: rgba(255, 255, 255, 0.25);
            stroke-width: 1;
            stroke-linecap: round;
        }

        /* Animations */
        @keyframes blink-red {
            0% { opacity: 1; text-shadow: 0 0 4px var(--accent-danger); }
            50% { opacity: 0.4; text-shadow: none; }
            100% { opacity: 1; text-shadow: 0 0 4px var(--accent-danger); }
        }
        
        .blink { animation: blink-red 1.2s infinite; }

    </style>
</head>
<body>

<div class="screen-container">
    
    <!-- Background / Scene SVG -->
    <svg class="scene-layer" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Sky Gradient -->
            <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
                <stop offset="60%" style="stop-color:#1e3a8a;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
            </linearGradient>

            <!-- Cliff Gradient: Dramatic lighting -->
            <linearGradient id="cliffGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#020617;stop-opacity:1" />
                <stop offset="70%" style="stop-color:#1e293b;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
            </linearGradient>

            <!-- Canopy Gradient: 3D Volume -->
            <radialGradient id="canopyGradient" cx="50%" cy="50%" r="50%" fx="40%" fy="40%">
                <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
                <stop offset="70%" style="stop-color:#e2e8f0;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#94a3b8;stop-opacity:1" />
            </radialGradient>

            <!-- Depth Blur -->
            <filter id="blurMist">
                <feGaussianBlur in="SourceGraphic" stdDeviation="20" />
            </filter>
        </defs>

        <!-- 1. Sky Background -->
        <rect width="1920" height="1080" fill="url(#skyGradient)" />

        <!-- 2. Distant Mountains (Atmospheric Depth) -->
        <g id="distant-mountains">
            <!-- Far Left -->
            <path d="M0,1080 L0,600 Q200,550 400,700 T800,800 L800,1080 Z" fill="#1e3a8a" opacity="0.3" filter="url(#blurMist)" />
            <!-- Far Right -->
            <path d="M1200,1080 L1200,650 Q1500,500 1920,700 L1920,1080 Z" fill="#1e3a8a" opacity="0.3" filter="url(#blurMist)" />
            <!-- Center Back -->
            <path d="M600,1080 L600,750 Q960,650 1300,850 L1300,1080 Z" fill="#2563eb" opacity="0.2" filter="url(#blurMist)" />
        </g>

        <!-- 3. Wind / Motion Cues -->
        <g id="wind-group"></g>

        <!-- 4. The Dramatic Cliff (Foreground Left) -->
        <g id="cliff-group">
            <!-- Main Cliff Silhouette: Jagged and imposing -->
            <path class="cliff-face" d="M-100,-100 L500,-100 
                L500,200 
                L460,220 L490,280 
                L400,350 L430,420 
                L350,500 L380,550 
                L280,650 L320,700 
                L220,800 L260,850 
                L150,950 L200,1000 
                L50,1100 L-100,1100 Z" />
            
            <!-- Rock Strata / Texture Lines -->
            <g id="rock-texture">
                <path class="cliff-highlight" d="M500,200 L460,220 L490,280" />
                <path class="cliff-highlight" d="M490,280 L400,350 L430,420" />
                <path class="cliff-highlight" d="M430,420 L350,500 L380,550" />
                <path class="cliff-highlight" d="M380,550 L280,650 L320,700" />
                <path class="cliff-highlight" d="M320,700 L220,800 L260,850" />
                <path class="cliff-highlight" d="M260,850 L150,950 L200,1000" />
            </g>
        </g>

        <!-- 5. The Parachuter Group (Center-Right Focus) -->
        <!-- Positioned visually centered in the right half -->
        <g id="parachuter-group" transform="translate(1100, 200)">
            
            <!-- Taut Harness Lines -->
            <g class="harness-lines">
                <!-- Left side lines -->
                <line class="harness-line" x1="-140" y1="10" x2="-15" y2="140" />
                <line class="harness-line" x1="-100" y1="35" x2="-10" y2="140" />
                <line class="harness-line" x1="-40" y1="45" x2="-2" y2="140" />
                <!-- Right side lines -->
                <line class="harness-line" x1="140" y1="10" x2="15" y2="140" />
                <line class="harness-line" x1="100" y1="35" x2="10" y2="140" />
                <line class="harness-line" x1="40" y1="45" x2="2" y2="140" />
            </g>

            <!-- Fully Inflated Canopy -->
            <g class="canopy">
                <!-- Main Dome -->
                <path class="canopy-fill" d="M-160,0 C-160,-140 160,-140 160,0 C160,35 100,45 0,45 C-100,45 -160,35 -160,0 Z" />
                
                <!-- Vent holes (Top) -->
                <ellipse class="canopy-vent" cx="0" cy="-10" rx="20" ry="6" />
                <ellipse class="canopy-vent" cx="-30" cy="-5" rx="10" ry="3" />
                <ellipse class="canopy-vent" cx="30" cy="-5" rx="10" ry="3" />
            </g>

            <!-- Suspended Human Figure -->
            <g class="human-figure">
                <!-- Harness Pack -->
                <rect x="-18" y="135" width="36" height="45" rx="4" fill="#334155" stroke="#475569" />
                
                <!-- Legs (Dangling) -->
                <path d="M-12,175 C-12,205 -25,235 -20,255" stroke="#020617" stroke-width="10" fill="none" stroke-linecap="round"/>
                <path d="M12,175 C12,205 25,235 20,255" stroke="#020617" stroke-width="10" fill="none" stroke-linecap="round"/>
                
                <!-- Torso -->
                <path d="M-12,135 L-8,175 L8,175 L12,135 Z" />
                
                <!-- Head (Helm) -->
                <circle cx="0" cy="125" r="14" fill="#020617" />
                
                <!-- Arms (Bracing) -->
                <path d="M-8,140 C-25,135 -35,125 -45,115" stroke="#020617" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M8,140 C25,135 35,125 45,115" stroke="#020617" stroke-width="8" fill="none" stroke-linecap="round"/>
            </g>
        </g>

    </svg>

    <!-- UI Overlay -->
    <div class="ui-layer">
        
        <!-- Top Left: Title -->
        <div class="header">
            <div class="meta-tag">Live Telemetry // Sector 7</div>
            <h1>Alpine Descent</h1>
        </div>

        <!-- Bottom Right: Flight Computer -->
        <div class="flight-computer">
            <div class="computer-header">
                <span>Flight Computer</span>
                <span>v2.4</span>
            </div>
            
            <div class="data-row">
                <span class="data-label">Altitude</span>
                <span class="data-value" id="alt-val">14,200 ft</span>
            </div>
            <div class="data-row">
                <span class="data-label">V-Speed</span>
                <span class="data-value danger blink">-24 ft/s</span>
            </div>
            <div class="data-row">
                <span class="data-label">Wind</span>
                <span class="data-value">NW 12mph</span>
            </div>
            <div class="data-row">
                <span class="data-label">Load</span>
                <span class="data-value good">NOMINAL</span>
            </div>
            <div class="data-row">
                <span class="data-label">Prox</span>
                <span class="data-value danger">CAUTION</span>
            </div>
        </div>

        <!-- Bottom Left: Status -->
        <div class="footer">
            <div>SYS.ONLINE</div>
            <div>RENDER: SVG_CANVAS</div>
        </div>

    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const windGroup = document.getElementById('wind-group');
        const parachuter = document.getElementById('parachuter-group');
        const altVal = document.getElementById('alt-val');
        
        // --- Animation State ---
        let time = 0;
        let altitude = 14200;
        
        // --- Generate Wind Lines ---
        // Creating streaks that move faster to indicate speed
        const windLines = [];
        const lineCount = 50;
        for(let i=0; i<lineCount; i++) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            const y = Math.random() * 1080;
            const x = Math.random() * 1920;
            // Variable length for depth perception
            const len = 100 + Math.random() * 300; 
            
            line.setAttribute("x1", x);
            line.setAttribute("y1", y);
            line.setAttribute("x2", x + len);
            line.setAttribute("y2", y);
            line.setAttribute("class", "wind-streak");
            // Random opacity
            line.setAttribute("opacity", (Math.random() * 0.3) + 0.05);
            
            windGroup.appendChild(line);
            windLines.push({
                el: line,
                x: x,
                y: y,
                // Speed correlates slightly with size (parallax)
                speed: 10 + (len / 40), 
                len: len
            });
        }

        // --- Main Animation Loop ---
        function animate() {
            time += 0.015;

            // 1. Parachuter Physics
            // Bobbing (Sine wave Y)
            const bobY = Math.sin(time * 2.5) * 20; 
            // Swaying (Sine wave X - wider for wind effect)
            const swayX = Math.sin(time * 1.2) * 25;
            
            // Descent Loop (Visual only)
            // Start at 200, go to 1000, reset
            const descent = (time * 30) % 1000; 
            
            // Apply transform
            // Center X is roughly 1100 in SVG (Right of center)
            parachuter.setAttribute('transform', `translate(${1100 + swayX}, ${200 + descent + bobY})`);

            // 2. Wind Animation
            windLines.forEach(line => {
                line.x += line.speed;
                if(line.x > 1920) {
                    line.x = -line.len;
                    line.y = Math.random() * 1080;
                }
                line.el.setAttribute("x1", line.x);
                line.el.setAttribute("x2", line.x + line.len);
            });

            // 3. Data Update Simulation
            altitude -= 0.8; // Slow descent
            if(altitude < 13900) altitude = 14200;
            altVal.innerText = Math.floor(altitude).toLocaleString() + " ft";

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>

</body>
</html>
