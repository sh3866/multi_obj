<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPINE // DESCENT</title>
    <style>
        :root {
            --bg-deep: #020617;
            --sky-top: #0f172a;
            --sky-horizon: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #22d3ee;
            --accent-danger: #ef4444;
            --font-display: 'Impact', 'Arial Black', sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Layout --- */
        .screen-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* --- The Visual Scene (SVG) --- */
        .scene-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- UI Overlay --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
        }

        /* --- UI Components --- */
        .header {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 4rem;
            text-transform: uppercase;
            line-height: 0.8;
            letter-spacing: -2px;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .meta-tag {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--accent-cyan);
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .meta-tag::before {
            content: '';
            display: block;
            width: 20px;
            height: 2px;
            background: var(--accent-cyan);
        }

        /* Flight Computer Panel */
        .flight-computer {
            position: absolute;
            top: 50%;
            right: 4rem;
            transform: translateY(-50%);
            width: 280px;
            background: rgba(2, 6, 23, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-right: 4px solid var(--accent-cyan);
            padding: 1.5rem;
            pointer-events: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .computer-header {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            align-items: baseline;
        }

        .data-label {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .data-value {
            font-family: var(--font-mono);
            font-size: 1rem;
            color: var(--text-main);
            font-weight: bold;
            letter-spacing: -0.5px;
        }
        
        .data-value.danger { color: var(--accent-danger); }
        .data-value.good { color: var(--accent-cyan); }

        /* Footer */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .compass-ring {
            width: 50px;
            height: 50px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .compass-needle {
            width: 2px;
            height: 20px;
            background: linear-gradient(to top, transparent, var(--accent-danger));
            position: absolute;
            top: 5px;
        }

        /* --- SVG Styles --- */
        .cliff-face {
            fill: url(#cliffGradient);
            stroke: #334155;
            stroke-width: 2;
        }
        
        /* Rock Strata */
        .strata-line {
            fill: none;
            stroke: rgba(0, 0, 0, 0.3);
            stroke-width: 3;
            stroke-linecap: round;
        }
        
        .strata-highlight {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 1;
        }

        .wind-streak {
            stroke: rgba(255, 255, 255, 0.15);
            stroke-width: 1.5;
            stroke-linecap: round;
        }

        .canopy-top {
            fill: #f1f5f9;
            stroke: #cbd5e1;
            stroke-width: 1;
        }

        .harness-line {
            stroke: #94a3b8;
            stroke-width: 1.5;
            fill: none;
        }

        .human-figure {
            fill: #0f172a;
            stroke: #1e293b;
            stroke-width: 1;
        }

        /* Animations */
        @keyframes pulse-red {
            0% { opacity: 1; text-shadow: 0 0 5px var(--accent-danger); }
            50% { opacity: 0.5; text-shadow: none; }
            100% { opacity: 1; text-shadow: 0 0 5px var(--accent-danger); }
        }
        
        .blink { animation: pulse-red 1s infinite; }

    </style>
</head>
<body>

<div class="screen-container">
    
    <!-- Background / Scene SVG -->
    <svg class="scene-layer" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Sky Gradient: Deep Space to Atmospheric Blue -->
            <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#020617;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#1e3a8a;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
            </linearGradient>

            <!-- Cliff Gradient: Dramatic Side Lighting -->
            <linearGradient id="cliffGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
                <stop offset="40%" style="stop-color:#1e293b;stop-opacity:1" />
                <stop offset="85%" style="stop-color:#334155;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
            </linearGradient>

            <!-- Depth Blur Filter -->
            <filter id="blurMist">
                <feGaussianBlur in="SourceGraphic" stdDeviation="15" />
            </filter>
            
            <filter id="heavyBlur">
                <feGaussianBlur in="SourceGraphic" stdDeviation="30" />
            </filter>
        </defs>

        <!-- 1. Sky Background -->
        <rect width="1920" height="1080" fill="url(#skyGradient)" />

        <!-- 2. Distant Landscape (Atmospheric Depth) -->
        <g id="distant-mountains">
            <!-- Farthest Range -->
            <path d="M0,1080 L0,650 Q400,550 800,700 T1600,600 L1920,750 L1920,1080 Z" fill="#1e3a8a" opacity="0.4" filter="url(#heavyBlur)" />
            <!-- Mid Range -->
            <path d="M0,1080 L0,750 Q300,700 700,850 T1920,750 L1920,1080 Z" fill="#2563eb" opacity="0.3" filter="url(#blurMist)" />
        </g>

        <!-- 3. Wind / Motion Cues -->
        <g id="wind-group"></g>

        <!-- 4. The Dramatic Cliff (Foreground Left) -->
        <g id="cliff-group">
            <!-- Main Cliff Silhouette -->
            <path class="cliff-face" d="M-50,-50 L550,-50 L550,150 
                    C550,200 500,250 480,300 
                    C460,350 480,400 450,450 
                    L480,550 L400,650 L450,750 
                    L350,850 L420,950 L350,1150 Z" />
            
            <!-- Rock Layers / Strata (Horizontal Texture) -->
            <g id="rock-texture">
                <!-- Top Edge -->
                <path class="strata-line" d="M550,150 C550,200 500,250 480,300" />
                <path class="strata-line" d="M480,300 C460,350 480,400 450,450" />
                <path class="strata-line" d="M450,450 L480,550" />
                <path class="strata-line" d="M480,550 L400,650" />
                <path class="strata-line" d="M400,650 L450,750" />
                <path class="strata-line" d="M450,750 L350,850" />
                <path class="strata-line" d="M350,850 L420,950" />
                
                <!-- Highlights for depth -->
                <path class="strata-highlight" d="M550,140 C550,190 510,240 490,290" />
                <path class="strata-highlight" d="M490,290 C470,340 490,390 460,440" />
                <path class="strata-highlight" d="M460,440 L490,540" />
            </g>
            
            <!-- Cliff Edge Highlight (The "Danger" Line) -->
            <path d="M550,-50 L550,150 C550,200 500,250 480,300 C460,350 480,400 450,450 L480,550 L400,650 L450,750 L350,850 L420,950 L350,1150" 
                  fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.5" />
        </g>

        <!-- 5. The Parachuter Group (The Subject) -->
        <g id="parachuter-group" transform="translate(800, -200)">
            
            <!-- Taut Harness Lines -->
            <g class="harness-lines">
                <line class="harness-line" x1="-100" y1="10" x2="-15" y2="130" />
                <line class="harness-line" x1="100" y1="10" x2="15" y2="130" />
                <line class="harness-line" x1="-50" y1="25" x2="-5" y2="130" />
                <line class="harness-line" x1="50" y1="25" x2="5" y2="130" />
            </g>

            <!-- Fully Inflated Canopy -->
            <g class="canopy">
                <!-- Main Dome -->
                <path class="canopy-top" d="M-140,0 C-140,-120 140,-120 140,0 C140,30 90,40 0,40 C-90,40 -140,30 -140,0 Z" />
                <!-- Shadow/Volume -->
                <path d="M-140,0 C-140,-120 140,-120 140,0 C140,30 60,35 0,35 C-60,35 -140,30 -140,0 Z" fill="#fff" opacity="0.9" />
                <!-- Vent holes at top -->
                <ellipse cx="0" cy="-10" rx="15" ry="5" fill="#0f172a" opacity="0.2"/>
            </g>

            <!-- Suspended Human Figure -->
            <g class="human-figure">
                <!-- Harness Pack -->
                <rect x="-18" y="125" width="36" height="45" rx="4" fill="#334155" stroke="#475569" />
                
                <!-- Legs (Dangling) -->
                <path d="M-12,165 C-12,195 -25,225 -20,245" stroke="#0f172a" stroke-width="9" fill="none" stroke-linecap="round"/>
                <path d="M12,165 C12,195 25,225 20,245" stroke="#0f172a" stroke-width="9" fill="none" stroke-linecap="round"/>
                
                <!-- Torso -->
                <path d="M-12,125 L-8,165 L8,165 L12,125 Z" />
                
                <!-- Head (Helm) -->
                <circle cx="0" cy="115" r="13" fill="#0f172a" />
                
                <!-- Arms (Bracing) -->
                <path d="M-8,130 C-25,125 -35,115 -45,105" stroke="#0f172a" stroke-width="7" fill="none" stroke-linecap="round"/>
                <path d="M8,130 C25,125 35,115 45,105" stroke="#0f172a" stroke-width="7" fill="none" stroke-linecap="round"/>
            </g>
        </g>

        <!-- 6. Mist Overlay at bottom -->
        <rect x="0" y="900" width="1920" height="180" fill="url(#skyGradient)" opacity="0.5" filter="url(#blurMist)" />
    </svg>

    <!-- UI Overlay -->
    <div class="ui-layer">
        <div class="header">
            <div class="meta-tag">Live Telemetry // Sector 7</div>
            <h1>Alpine<br>Descent</h1>
        </div>

        <div class="flight-computer">
            <div class="computer-header">Flight Computer v2.4</div>
            
            <div class="data-row">
                <span class="data-label">Altitude</span>
                <span class="data-value" id="alt-val">14,200 ft</span>
            </div>
            <div class="data-row">
                <span class="data-label">Vertical Speed</span>
                <span class="data-value danger blink">-24 ft/s</span>
            </div>
            <div class="data-row">
                <span class="data-label">Wind Vector</span>
                <span class="data-value">NW 12mph</span>
            </div>
            <div class="data-row">
                <span class="data-label">Canopy Load</span>
                <span class="data-value good">NOMINAL</span>
            </div>
            <div class="data-row">
                <span class="data-label">Proximity</span>
                <span class="data-value danger">CAUTION</span>
            </div>
        </div>

        <div class="footer">
            <div>
                <p>SYS.ONLINE</p>
                <p>RENDER: SVG_CANVAS</p>
            </div>
            <div class="compass-ring">
                <div class="compass-needle"></div>
            </div>
            <div style="text-align: right;">
                <p>DESIGN: REVISED</p>
                <p>NO_EXTERNAL_ASSETS</p>
            </div>
        </div>
    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const svg = document.querySelector('.scene-layer');
        const windGroup = document.getElementById('wind-group');
        const parachuter = document.getElementById('parachuter-group');
        const altVal = document.getElementById('alt-val');
        
        // --- Animation State ---
        let time = 0;
        let altitude = 14200;
        
        // --- Generate Wind Lines ---
        // Creating streaks that move faster to indicate speed
        const windLines = [];
        for(let i=0; i<60; i++) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            const y = Math.random() * 1080;
            const x = Math.random() * 1920;
            // Variable length for depth perception
            const len = 80 + Math.random() * 200; 
            
            line.setAttribute("x1", x);
            line.setAttribute("y1", y);
            line.setAttribute("x2", x + len);
            line.setAttribute("y2", y);
            line.setAttribute("class", "wind-streak");
            // Random opacity
            line.setAttribute("opacity", (Math.random() * 0.3) + 0.05);
            
            windGroup.appendChild(line);
            windLines.push({
                el: line,
                x: x,
                y: y,
                // Speed correlates slightly with size (parallax)
                speed: 8 + (len / 50), 
                len: len
            });
        }

        // --- Main Animation Loop ---
        function animate() {
            time += 0.015;

            // 1. Parachuter Physics
            // Bobbing (Sine wave Y)
            const bobY = Math.sin(time * 2.5) * 15; 
            // Swaying (Sine wave X - wider for wind effect)
            const swayX = Math.sin(time * 1.2) * 15;
            
            // Descent Loop (Visual only)
            // Start at -200, go to 1000, reset
            const descent = (time * 40) % 1300; 
            
            // Apply transform
            // Center X is roughly 800 in SVG, Y is calculated
            parachuter.setAttribute('transform', `translate(${800 + swayX}, ${-200 + descent + bobY})`);

            // 2. Wind Animation
            windLines.forEach(line => {
                line.x += line.speed;
                if(line.x > 1920) {
                    line.x = -line.len;
                    line.y = Math.random() * 1080;
                }
                line.el.setAttribute("x1", line.x);
                line.el.setAttribute("x2", line.x + line.len);
            });

            // 3. Data Update Simulation
            altitude -= 0.5; // Slow descent
            if(altitude < 13900) altitude = 14200;
            altVal.innerText = Math.floor(altitude).toLocaleString() + " ft";

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>

</body>
</html>
