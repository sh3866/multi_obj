<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPINE // DESCENT</title>
    <style>
        :root {
            --bg-deep: #020617;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #38bdf8;
            --accent-danger: #ef4444;
            --accent-warn: #f59e0b;
            --font-mono: 'Courier New', Courier, monospace;
            --font-display: 'Impact', 'Arial Black', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* --- Layout --- */
        .screen-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* --- The Visual Scene (SVG) --- */
        .scene-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- UI Overlay (HUD) --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            /* Subtle vignette */
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.4) 100%);
        }

        /* Top Left: Title */
        .header {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            opacity: 0.9;
            mix-blend-mode: overlay; /* Makes title feel integrated */
        }

        h1 {
            font-family: var(--font-display);
            font-size: 4rem;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .meta-tag {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--accent-cyan);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
        }
        
        .meta-tag::before {
            content: '';
            display: block;
            width: 20px;
            height: 3px;
            background: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        /* Bottom Right: Integrated Flight Computer */
        .flight-computer {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            width: 260px;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(2, 6, 23, 0.95) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-left: 4px solid var(--accent-cyan);
            padding: 1.2rem;
            pointer-events: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 0 20px rgba(56, 189, 248, 0.05);
            transform: skewX(-6deg); /* Aggressive Tech aesthetic */
        }

        .computer-header {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--accent-cyan);
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            padding-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.6rem;
            align-items: flex-end;
            padding-left: 5px; /* Counter skew visual balance */
        }

        .data-label {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            opacity: 0.8;
            letter-spacing: 0.5px;
        }

        .data-value {
            font-family: var(--font-mono);
            font-size: 1.1rem;
            color: var(--text-main);
            font-weight: bold;
            letter-spacing: -0.5px;
            text-shadow: 0 0 5px rgba(255,255,255,0.2);
        }
        
        .data-value.danger { color: var(--accent-danger); text-shadow: 0 0 5px rgba(239, 68, 68, 0.4); }
        .data-value.good { color: var(--accent-cyan); }
        .data-value.warn { color: var(--accent-warn); }

        /* Footer / Status Bar */
        .footer {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            opacity: 0.7;
            display: flex;
            gap: 30px;
            letter-spacing: 1px;
        }
        
        .footer div::before {
            content: '//';
            margin-right: 8px;
            color: var(--accent-cyan);
            opacity: 0.5;
        }

        /* --- SVG Styles --- */
        
        /* Cliff Gradients */
        .cliff-main {
            fill: url(#cliffGradientMain);
        }
        
        .cliff-layer-1 { fill: #1e293b; }
        .cliff-layer-2 { fill: #334155; }
        .cliff-layer-3 { fill: #475569; }
        .cliff-layer-4 { fill: #0f172a; }

        .cliff-highlight {
            fill: none;
            stroke: #64748b;
            stroke-width: 1;
            stroke-linecap: round;
            opacity: 0.5;
        }

        /* Canopy Gradients */
        .canopy-fill {
            fill: url(#canopyGradient);
            stroke: rgba(255,255,255,0.8);
            stroke-width: 1;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.4));
        }

        .canopy-shadow {
            fill: url(#canopyShadowGrad);
            opacity: 0.6;
            mix-blend-mode: multiply;
        }

        .harness-line {
            stroke: #cbd5e1;
            stroke-width: 1.5;
            fill: none;
            opacity: 0.9;
            stroke-linecap: round;
        }

        .human-figure {
            fill: #020617;
            stroke: #1e293b;
            stroke-width: 1;
        }

        .wind-streak {
            stroke: rgba(255, 255, 255, 0.6);
            stroke-width: 1.5;
            stroke-linecap: round;
        }
        
        .wind-streak-fast {
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 2;
        }

        /* Animations */
        @keyframes blink-red {
            0% { opacity: 1; text-shadow: 0 0 8px var(--accent-danger); }
            50% { opacity: 0.5; text-shadow: none; }
            100% { opacity: 1; text-shadow: 0 0 8px var(--accent-danger); }
        }
        
        .blink { animation: blink-red 1s infinite; }

    </style>
</head>
<body>

<div class="screen-container">
    
    <!-- Background / Scene SVG -->
    <svg class="scene-layer" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Sky Gradient: Deep Atmospheric -->
            <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#020617;stop-opacity:1" />
                <stop offset="40%" style="stop-color:#0f172a;stop-opacity:1" />
                <stop offset="80%" style="stop-color:#1e3a8a;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
            </linearGradient>

            <!-- Cliff Gradient: Main Volume -->
            <linearGradient id="cliffGradientMain" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#020617;stop-opacity:1" />
                <stop offset="60%" style="stop-color:#0f172a;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
            </linearGradient>

            <!-- Canopy Gradient: High Volume 3D -->
            <radialGradient id="canopyGradient" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
                <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
                <stop offset="60%" style="stop-color:#cbd5e1;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#64748b;stop-opacity:1" />
            </radialGradient>

            <!-- Canopy Shadow (Inner) -->
            <radialGradient id="canopyShadowGrad" cx="50%" cy="100%" r="80%">
                <stop offset="0%" style="stop-color:#000;stop-opacity:0.8" />
                <stop offset="100%" style="stop-color:#000;stop-opacity:0" />
            </radialGradient>

            <!-- Mist Blur -->
            <filter id="blurMist" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="30" />
            </filter>
        </defs>

        <!-- 1. Sky Background -->
        <rect width="1920" height="1080" fill="url(#skyGradient)" />

        <!-- 2. Distant Mountains (Atmospheric Depth) -->
        <g id="distant-mountains">
            <!-- Layer 1: Far Background (Lightest, Most Blurry) -->
            <path d="M-200,1080 L-200,500 Q300,400 600,600 T1200,550 T1920,650 L1920,1080 Z" 
                  fill="#3b82f6" opacity="0.2" filter="url(#blurMist)" />
            
            <!-- Layer 2: Mid Background -->
            <path d="M0,1080 L0,650 Q200,600 500,750 T1100,680 T1920,800 L1920,1080 Z" 
                  fill="#1e3a8a" opacity="0.4" filter="url(#blurMist)" />
            
            <!-- Layer 3: Near Background (Darker, Sharper) -->
            <path d="M1000,1080 L1000,700 Q1400,600 1920,750 L1920,1080 Z" 
                  fill="#0f172a" opacity="0.6" />
        </g>

        <!-- 3. Wind / Motion Cues -->
        <g id="wind-group"></g>

        <!-- 4. The Dramatic Cliff (Foreground Left) - Rebuilt -->
        <g id="cliff-group">
            <!-- Base Silhouette -->
            <path class="cliff-main" d="M-100,-100 L600,-100 
                L600,150 
                L550,180 L580,250 
                L500,320 L530,400 
                L450,480 L490,550 
                L400,650 L450,720 
                L350,850 L400,920 
                L250,1050 L300,1150 
                L-100,1150 Z" />
            
            <!-- Geometric Strata (Rock Layers) - Varying Colors -->
            <g id="rock-strata">
                <!-- Top Edge Highlight -->
                <path d="M600,-100 L600,150 L550,180 L580,250 L500,320 L530,400 L450,480 L490,550 L400,650 L450,720 L350,850 L400,920 L250,1050 L300,1150" 
                      fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.3"/>

                <!-- Layer 1 (Top) -->
                <path d="M600,150 L550,180 L580,250 L500,320 L530,400 L450,480 L490,550 L400,650 L450,720 L350,850 L400,920 L250,1050 L300,1150 L600,1150 L600,150 Z" fill="#0f172a" opacity="0.8"/>
                
                <!-- Strata Cut 1 -->
                <path class="cliff-layer-1" d="M550,180 L600,220 L600,280 L580,250 Z" />
                <path class="cliff-layer-2" d="M500,320 L580,250 L600,300 L600,380 L530,400 Z" />
                <path class="cliff-layer-1" d="M450,480 L530,400 L600,450 L600,520 L490,550 Z" />
                
                <!-- Strata Cut 2 (Middle) -->
                <path class="cliff-layer-3" d="M400,650 L490,550 L600,600 L600,680 L450,720 Z" />
                <path class="cliff-layer-4" d="M350,850 L450,720 L600,800 L600,900 L400,920 Z" />
                
                <!-- Strata Cut 3 (Bottom) -->
                <path class="cliff-layer-2" d="M250,1050 L400,920 L600,1000 L600,1150 L300,1150 Z" />
            </g>

            <!-- Texture Details (Crevices) -->
            <g id="rock-texture" opacity="0.6">
                <path d="M580,250 L560,260 L570,280" fill="none" stroke="#020617" stroke-width="2"/>
                <path d="M530,400 L510,410 L520,430" fill="none" stroke="#020617" stroke-width="2"/>
                <path d="M450,720 L430,730 L440,760" fill="none" stroke="#020617" stroke-width="3"/>
                <path d="M400,920 L380,930 L390,960" fill="none" stroke="#020617" stroke-width="3"/>
            </g>
        </g>

        <!-- 5. The Parachuter Group -->
        <!-- Positioned visually centered in the right half -->
        <g id="parachuter-group" transform="translate(1200, 300)">
            
            <!-- Taut Harness Lines -->
            <g class="harness-lines">
                <!-- Left side lines (Converging) -->
                <line class="harness-line" x1="-150" y1="10" x2="-15" y2="150" />
                <line class="harness-line" x1="-100" y1="40" x2="-10" y2="150" />
                <line class="harness-line" x1="-30" y1="50" x2="-2" y2="150" />
                <!-- Right side lines -->
                <line class="harness-line" x1="150" y1="10" x2="15" y2="150" />
                <line class="harness-line" x1="100" y1="40" x2="10" y2="150" />
                <line class="harness-line" x1="30" y1="50" x2="2" y2="150" />
            </g>

            <!-- Fully Inflated Canopy -->
            <g class="canopy">
                <!-- Main Dome Shape -->
                <path class="canopy-fill" d="M-170,0 C-170,-150 170,-150 170,0 C170,40 110,50 0,50 C-110,50 -170,40 -170,0 Z" />
                
                <!-- Inner Shadow for Volume -->
                <path class="canopy-shadow" d="M-170,0 C-170,-150 170,-150 170,0 C170,40 110,50 0,50 C-110,50 -170,40 -170,0 Z" />
                
                <!-- Vent holes (Top) -->
                <ellipse class="canopy-vent" cx="0" cy="-12" rx="25" ry="8" fill="#0f172a" opacity="0.4" />
                <ellipse class="canopy-vent" cx="-35" cy="-6" rx="12" ry="4" fill="#0f172a" opacity="0.3" />
                <ellipse class="canopy-vent" cx="35" cy="-6" rx="12" ry="4" fill="#0f172a" opacity="0.3" />
            </g>

            <!-- Suspended Human Figure -->
            <g class="human-figure">
                <!-- Harness Pack -->
                <rect x="-20" y="145" width="40" height="50" rx="5" fill="#1e293b" stroke="#475569" />
                
                <!-- Legs (Dangling) -->
                <path d="M-12,185 C-12,220 -25,250 -20,270" stroke="#020617" stroke-width="11" fill="none" stroke-linecap="round"/>
                <path d="M12,185 C12,220 25,250 20,270" stroke="#020617" stroke-width="11" fill="none" stroke-linecap="round"/>
                
                <!-- Torso -->
                <path d="M-12,145 L-8,185 L8,185 L12,145 Z" fill="#020617" />
                
                <!-- Head (Helm) -->
                <circle cx="0" cy="130" r="15" fill="#020617" />
                
                <!-- Arms (Bracing) -->
                <path d="M-8,150 C-30,145 -45,130 -55,115" stroke="#020617" stroke-width="9" fill="none" stroke-linecap="round"/>
                <path d="M8,150 C30,145 45,130 55,115" stroke="#020617" stroke-width="9" fill="none" stroke-linecap="round"/>
            </g>
        </g>

    </svg>

    <!-- UI Overlay -->
    <div class="ui-layer">
        
        <!-- Top Left: Title -->
        <div class="header">
            <div class="meta-tag">Live Telemetry // Sector 7</div>
            <h1>Alpine Descent</h1>
        </div>

        <!-- Bottom Right: Flight Computer -->
        <div class="flight-computer">
            <div class="computer-header">
                <span>Flight Computer</span>
                <span>v2.4</span>
            </div>
            
            <div class="data-row">
                <span class="data-label">Altitude</span>
                <span class="data-value" id="alt-val">14,200 ft</span>
            </div>
            <div class="data-row">
                <span class="data-label">V-Speed</span>
                <span class="data-value danger blink" id="speed-val">-24 ft/s</span>
            </div>
            <div class="data-row">
                <span class="data-label">Wind</span>
                <span class="data-value" id="wind-val">NW 12mph</span>
            </div>
            <div class="data-row">
                <span class="data-label">Load</span>
                <span class="data-value good">NOMINAL</span>
            </div>
            <div class="data-row">
                <span class="data-label">Prox</span>
                <span class="data-value warn" id="prox-val">CAUTION</span>
            </div>
        </div>

        <!-- Bottom Left: Status -->
        <div class="footer">
            <div>SYS.ONLINE</div>
            <div>RENDER: SVG_CANVAS</div>
        </div>

    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const windGroup = document.getElementById('wind-group');
        const parachuter = document.getElementById('parachuter-group');
        const altVal = document.getElementById('alt-val');
        const speedVal = document.getElementById('speed-val');
        const windVal = document.getElementById('wind-val');
        
        // --- Animation State ---
        let time = 0;
        let altitude = 14200;
        
        // --- Generate Wind Lines ---
        const windLines = [];
        const lineCount = 60;
        for(let i=0; i<lineCount; i++) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            const y = Math.random() * 1080;
            const x = Math.random() * 1920;
            // Variable length for depth perception
            const len = 100 + Math.random() * 400; 
            
            line.setAttribute("x1", x);
            line.setAttribute("y1", y);
            line.setAttribute("x2", x + len);
            line.setAttribute("y2", y);
            line.setAttribute("class", Math.random() > 0.7 ? "wind-streak wind-streak-fast" : "wind-streak");
            // Random opacity
            line.setAttribute("opacity", (Math.random() * 0.4) + 0.1);
            
            windGroup.appendChild(line);
            windLines.push({
                el: line,
                x: x,
                y: y,
                // Speed correlates with size
                speed: 15 + (len / 30), 
                len: len
            });
        }

        // --- Main Animation Loop ---
        function animate() {
            time += 0.012;

            // 1. Parachuter Physics
            // Bobbing (Sine wave Y)
            const bobY = Math.sin(time * 2.5) * 25; 
            // Swaying (Sine wave X - wider for wind effect)
            const swayX = Math.sin(time * 1.2) * 30;
            
            // Descent Loop (Visual only)
            // Start at 300, go to 800, reset
            const descent = (time * 40) % 900; 
            
            // Apply transform
            // Center X is roughly 1200 in SVG
            parachuter.setAttribute('transform', `translate(${1200 + swayX}, ${300 + descent + bobY})`);

            // 2. Wind Animation
            windLines.forEach(line => {
                line.x += line.speed;
                if(line.x > 1920) {
                    line.x = -line.len;
                    line.y = Math.random() * 1080;
                }
                line.el.setAttribute("x1", line.x);
                line.el.setAttribute("x2", line.x + line.len);
            });

            // 3. Data Update Simulation
            altitude -= 0.5; // Slow descent
            if(altitude < 13900) altitude = 14200;
            altVal.innerText = Math.floor(altitude).toLocaleString() + " ft";

            // Fluctuate Speed
            const speed = 24 + Math.floor(Math.sin(time * 5) * 2);
            speedVal.innerText = `-${speed} ft/s`;

            // Fluctuate Wind
            const wind = 12 + Math.floor(Math.sin(time * 1.5) * 3);
            windVal.innerText = `NW ${wind}mph`;

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>
</body>
</html>
