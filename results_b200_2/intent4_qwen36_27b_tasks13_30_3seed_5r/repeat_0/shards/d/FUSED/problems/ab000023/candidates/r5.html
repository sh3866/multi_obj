<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Scene: The Emblem</title>
<style>
  :root {
    /* Environment */
    --bg-top: #f4f6f9;
    --bg-bottom: #dce1e8;
    --floor-line: #cfd6df;
    
    /* Sign Material */
    --sign-face: #ffffff;
    --sign-edge-light: #ffffff;
    --sign-edge-dark: #e0e0e0;
    --sign-shadow: #a0a0a0;
    
    /* Emblem - High Saturation Red */
    --emblem-red: #E62117;
    --emblem-red-deep: #b30000;
    
    /* Hardware */
    --metal-light: #ffffff;
    --metal-mid: #999999;
    --metal-dark: #333333;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    /* Studio Gradient Background */
    background: linear-gradient(to bottom, var(--bg-top) 0%, var(--bg-bottom) 70%, var(--floor-line) 70%, #c5ccd6 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Perspective setup */
    perspective: 1200px;
  }

  /* --- Environment --- */
  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 40%, transparent 30%, rgba(0,0,0,0.15) 100%);
    pointer-events: none;
    z-index: 50;
  }

  /* --- 3D Scene Container --- */
  .scene {
    position: relative;
    width: 360px;
    height: 360px;
    transform-style: preserve-3d;
    /* Base 3/4 View: Tilted back to show top, rotated to show right side */
    transform: rotateX(15deg) rotateY(-25deg);
    transition: transform 0.1s ease-out;
  }

  /* --- The Physical Sign Block --- */
  .sign-block {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    animation: floatIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  /* Common Face Styles */
  .face {
    position: absolute;
    backface-visibility: hidden;
    border-radius: 16px;
    overflow: hidden;
  }

  /* Front Face */
  .face.front {
    width: 100%;
    height: 100%;
    background: var(--sign-face);
    /* Subtle texture/noise simulation via gradient */
    background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, #fcfcfc 100%);
    transform: translateZ(18px);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.9);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
  }

  /* Top Face: Thicker profile */
  .face.top {
    width: 100%;
    height: 36px; /* 18px thickness x 2 */
    background: linear-gradient(to bottom, #ffffff, #f0f0f0);
    transform: rotateX(90deg) translateZ(0px) translateY(-18px);
    border-radius: 16px 16px 4px 4px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,1);
  }

  /* Right Face: Darker for depth */
  .face.right {
    width: 36px;
    height: 100%;
    background: linear-gradient(to right, #dcdcdc, #c5c5c5);
    transform: rotateY(90deg) translateZ(342px) translateX(18px);
    border-radius: 4px 16px 16px 4px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
  }

  /* Left Face */
  .face.left {
    width: 36px;
    height: 100%;
    background: linear-gradient(to left, #e8e8e8, #dcdcdc);
    transform: rotateY(-90deg) translateZ(0px) translateX(-18px);
    border-radius: 16px 4px 4px 16px;
  }

  /* Back Face */
  .face.back {
    width: 100%;
    height: 100%;
    background: #e5e5e5;
    transform: translateZ(-18px) rotateY(180deg);
  }

  /* --- The Emblem (SVG) --- */
  .emblem-container {
    position: relative;
    width: 160px;
    height: 160px;
    z-index: 10;
    /* Stronger drop shadow for "Physical Button" feel */
    filter: drop-shadow(0 15px 15px rgba(0, 0, 0, 0.15)) drop-shadow(0 5px 5px rgba(230, 33, 23, 0.2));
    transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  .sign-block:hover .emblem-container {
    transform: scale(1.05);
  }

  /* --- Mounting Hardware --- */
  .mount {
    position: absolute;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    /* Realistic Metallic Gradient */
    background: radial-gradient(circle at 30% 30%, #ffffff 0%, #cccccc 40%, #666666 100%);
    box-shadow: 
      0 3px 5px rgba(0,0,0,0.3), /* Drop shadow */
      inset 0 1px 1px rgba(255,255,255,1), /* Top Highlight */
      inset 0 -2px 4px rgba(0,0,0,0.2); /* Bottom Inner Shadow */
    transform: translateZ(21px); /* Slightly raised */
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* The Screw Slot */
  .mount::after {
    content: '';
    width: 14px; 
    height: 2px;
    background: #222;
    border-radius: 1px;
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.8);
    transform: rotate(45deg);
  }

  /* Mount Positions */
  .mount.tl { top: 24px; left: 24px; }
  .mount.tr { top: 24px; right: 24px; }
  .mount.bl { bottom: 24px; left: 24px; }
  .mount.br { bottom: 24px; right: 24px; }

  /* --- Physical Label --- */
  .label {
    position: absolute;
    bottom: 28px;
    left: 28px;
    transform: translateZ(20px);
    font-size: 9px;
    font-weight: 700;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1.2;
  }
  
  .label strong {
    color: #333;
    font-size: 10px;
    margin-bottom: 2px;
  }

  /* --- Shadows --- */
  
  /* Contact Shadow (Tight, dark, grounded) */
  .contact-shadow {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    transform: translateZ(-10px) translateX(10px) translateY(10px) scale(0.99);
    background: #000;
    border-radius: 16px;
    filter: blur(15px);
    opacity: 0.12;
    z-index: -1;
  }

  /* Floor Shadow (Soft, distant) */
  .floor-shadow {
    position: absolute;
    width: 300px;
    height: 100px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0) 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) translateZ(-150px) rotateX(90deg);
    filter: blur(20px);
    pointer-events: none;
    transition: transform 0.1s ease-out;
  }

  /* --- Animations --- */
  @keyframes floatIn {
    0% { opacity: 0; transform: rotateX(15deg) rotateY(-25deg) translateY(120px); }
    100% { opacity: 1; transform: rotateX(15deg) rotateY(-25deg) translateY(0); }
  }

</style>
</head>
<body>

  <div class="vignette"></div>

  <!-- 3D Scene -->
  <div class="scene">
    <div class="sign-block">
      
      <!-- 3D Faces -->
      <div class="face front"></div>
      <div class="face top"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face back"></div>

      <!-- Graphic Emblem -->
      <div class="emblem-container">
        <svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- 3D Red Gradient -->
            <radialGradient id="emblemGrad" cx="30%" cy="30%" r="80%">
              <stop offset="0%" stop-color="#ff7373" /> <!-- Specular Highlight -->
              <stop offset="40%" stop-color="#E62117" /> <!-- Base Red -->
              <stop offset="85%" stop-color="#9e0000" /> <!-- Shadow -->
              <stop offset="100%" stop-color="#660000" /> <!-- Rim Shadow -->
            </radialGradient>
            
            <!-- Inner Bevel for the button -->
            <filter id="innerBevel" x="-20%" y="-20%" width="140%" height="140%">
              <feOffset dx="0" dy="2"/>
              <feGaussianBlur stdDeviation="2" result="offset-blur"/>
              <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
              <feFlood flood-color="white" flood-opacity="0.4" result="color"/>
              <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
              <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
            </filter>
          </defs>

          <!-- Red Circle Background -->
          <circle cx="100" cy="100" r="92" fill="url(#emblemGrad)" />
          
          <!-- Glossy Reflection -->
          <path d="M 35 70 Q 100 20 165 70" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" stroke-linecap="round" filter="blur(2px)" />

          <!-- Play Button (Perfectly Centered & Geometric) -->
          <!-- Using a precise polygon for crispness -->
          <path 
            d="M 75 55 L 150 100 L 75 145 Z" 
            fill="#ffffff" 
            stroke="#ffffff" 
            stroke-width="2" 
            stroke-linejoin="round"
            filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.15))"
          />
        </svg>
      </div>

      <!-- Hardware -->
      <div class="mount tl"></div>
      <div class="mount tr"></div>
      <div class="mount bl"></div>
      <div class="mount br"></div>

      <!-- Physical Label -->
      <div class="label">
        <strong>MODEL 01</strong>
        ACRYLIC PLATE
      </div>

    </div>

    <!-- Shadows -->
    <div class="contact-shadow"></div>
    <div class="floor-shadow"></div>
  </div>

  <script>
    // Smooth parallax interaction
    const scene = document.querySelector('.scene');
    const floorShadow = document.querySelector('.floor-shadow');
    
    // Base rotation values (Stable 3/4 view)
    const baseRotateX = 15;
    const baseRotateY = -25;

    document.addEventListener('mousemove', (e) => {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      
      // Calculate distance from center (normalized -1 to 1)
      const x = (e.clientX - centerX) / centerX;
      const y = (e.clientY - centerY) / centerY;

      // Apply rotation limits for subtle movement
      // Adjusted for the new base angles
      const rotateY = baseRotateY + (x * 8); 
      const rotateX = baseRotateX + (y * -8); 

      scene.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

      // Move shadow opposite to sign to simulate light source
      // Shadow moves slightly less than the object to create depth
      floorShadow.style.transform = `translate(-50%, -50%) translateZ(-150px) rotateX(90deg) translateX(${x * 40}px) translateY(${y * 40}px)`;
    });

    // Reset smoothly on leave
    document.addEventListener('mouseleave', () => {
      scene.style.transform = `rotateX(${baseRotateX}deg) rotateY(${baseRotateY}deg)`;
      floorShadow.style.transform = `translate(-50%, -50%) translateZ(-150px) rotateX(90deg)`;
    });
  </script>
</body>
</html>
