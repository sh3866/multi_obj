<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Scene: The Emblem</title>
<style>
  :root {
    /* Environment */
    --bg-wall: #e8e8e8;
    --bg-floor: #d4d4d4;
    --wall-floor-line: #cfcfcf;
    
    /* Sign Material */
    --sign-face: #ffffff;
    --sign-edge-top: #f0f0f0;
    --sign-edge-side: #dcdcdc;
    --sign-shadow: #a0a0a0;
    
    /* Emblem */
    --emblem-red-base: #E60000;
    --emblem-red-highlight: #FF4D4D;
    --emblem-red-shadow: #990000;
    
    /* Hardware */
    --metal-base: #333333;
    --metal-highlight: #888888;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-wall);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1500px;
  }

  /* --- Environment & Lighting --- */
  .environment {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(to bottom, var(--bg-wall) 50%, var(--bg-floor) 50%);
    z-index: -1;
  }

  /* Visual divider for floor/wall */
  .environment::after {
    content: '';
    position: absolute;
    top: 50%; left: 0; width: 100%; height: 1px;
    background: rgba(0,0,0,0.1);
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
  }

  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.15) 100%);
    pointer-events: none;
    z-index: 50;
  }

  /* --- 3D Scene Container --- */
  .scene {
    position: relative;
    width: 400px;
    height: 400px;
    transform-style: preserve-3d;
    /* Initial Angle: Slight tilt to show top and right depth */
    transform: rotateX(15deg) rotateY(-20deg);
    transition: transform 0.1s ease-out;
  }

  /* --- The Physical Sign Block --- */
  .sign-block {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    /* Entrance Animation */
    animation: floatIn 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  /* Common Face Styles */
  .face {
    position: absolute;
    backface-visibility: hidden;
    /* Refined corners */
    border-radius: 16px; 
  }

  /* Front Face: The main matte white surface */
  .face.front {
    width: 100%;
    height: 100%;
    background: var(--sign-face);
    /* Subtle noise/texture simulation */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
    transform: translateZ(20px); /* 20mm depth */
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05); /* Subtle rim */
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
  }

  /* Top Face: Bright, catching overhead light */
  .face.top {
    width: 100%;
    height: 40px; /* 20mm depth * 2 for thickness */
    background: linear-gradient(to bottom, #ffffff, #f4f4f4);
    /* Positioning logic: Rotate 90deg, move up by half thickness */
    transform: rotateX(90deg) translateZ(0px) translateY(-20px);
    border-radius: 16px 16px 4px 4px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,1);
  }

  /* Right Face: Shadowed side */
  .face.right {
    width: 40px; /* Matches top height */
    height: 100%;
    background: linear-gradient(to right, #e5e5e5, #cccccc);
    /* Positioning logic: Rotate 90deg, move right by half width + half thickness */
    transform: rotateY(90deg) translateZ(380px) translateX(20px);
    border-radius: 4px 16px 16px 4px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
  }

  /* Left Face: Mid-tone */
  .face.left {
    width: 40px;
    height: 100%;
    background: linear-gradient(to left, #e0e0e0, #d0d0d0);
    transform: rotateY(-90deg) translateZ(0px) translateX(-20px);
    border-radius: 16px 4px 4px 16px;
  }

  /* --- The Emblem (SVG) --- */
  .emblem-container {
    position: relative;
    width: 160px;
    height: 160px;
    z-index: 10;
    /* Soft shadow to separate from white surface */
    filter: drop-shadow(0 15px 25px rgba(0,0,0,0.2));
    transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  .sign-block:hover .emblem-container {
    transform: scale(1.08);
  }

  /* --- Mounting Hardware --- */
  .mount {
    position: absolute;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--metal-highlight) 0%, var(--metal-base) 100%);
    box-shadow: 
      0 4px 8px rgba(0,0,0,0.3), 
      inset 0 1px 1px rgba(255,255,255,0.4);
    transform: translateZ(22px); /* Sits slightly proud of face */
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* The slot in the screw */
  .mount::after {
    content: '';
    width: 14px; height: 2px;
    background: #111;
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.8);
    transform: rotate(45deg);
  }

  /* Mount Positions (Inset) */
  .mount.tl { top: 28px; left: 28px; }
  .mount.tr { top: 28px; right: 28px; }
  .mount.bl { bottom: 28px; left: 28px; }
  .mount.br { bottom: 28px; right: 28px; }

  /* --- Physical Label (Specs) --- */
  .label {
    position: absolute;
    bottom: 24px;
    right: 24px;
    transform: translateZ(21px);
    font-size: 9px;
    font-weight: 700;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1.2;
  }
  
  .label span {
    color: #555;
  }

  /* --- Shadows --- */
  
  /* Contact Shadow (The dark shadow right behind the sign) */
  .contact-shadow {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    transform: translateZ(-50px) translateX(20px) translateY(20px) scale(0.95);
    background: #ffffff;
    border-radius: 16px;
    filter: blur(15px);
    opacity: 0.6;
    z-index: -1;
    box-shadow: 0 0 50px rgba(0,0,0,0.4);
  }

  /* Floor Shadow (The soft shadow on the ground) */
  .floor-shadow {
    position: absolute;
    width: 300px;
    height: 100px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) translateZ(-220px) rotateX(90deg);
    filter: blur(20px);
    pointer-events: none;
    transition: transform 0.1s ease-out;
  }

  /* --- Animations --- */
  @keyframes floatIn {
    0% { opacity: 0; transform: rotateX(15deg) rotateY(-20deg) translateY(150px); }
    100% { opacity: 1; transform: rotateX(15deg) rotateY(-20deg) translateY(0); }
  }

</style>
</head>
<body>

  <div class="vignette"></div>
  <div class="environment"></div>

  <!-- 3D Scene -->
  <div class="scene">
    <div class="sign-block">
      
      <!-- 3D Faces -->
      <div class="face front"></div>
      <div class="face top"></div>
      <div class="face right"></div>
      <div class="face left"></div>

      <!-- Graphic Emblem -->
      <div class="emblem-container">
        <svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Glossy Red Gradient -->
            <radialGradient id="emblemGrad" cx="35%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#ff4d4d" /> <!-- Highlight -->
              <stop offset="50%" stop-color="#E60000" /> <!-- Base -->
              <stop offset="100%" stop-color="#800000" /> <!-- Shadow -->
            </radialGradient>
            
            <!-- Inner Shadow for Depth -->
            <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feOffset dx="0" dy="2"/>
              <feGaussianBlur stdDeviation="3" result="offset-blur"/>
              <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
              <feFlood flood-color="black" flood-opacity="0.3" result="color"/>
              <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
              <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
            </filter>

            <!-- Drop shadow for the triangle -->
            <filter id="triShadow" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity="0.15" flood-color="#000000"/>
            </filter>
          </defs>

          <!-- Red Badge -->
          <circle cx="100" cy="100" r="90" fill="url(#emblemGrad)" filter="url(#innerShadow)" />
          
          <!-- Glossy Reflection (Subtle white arc) -->
          <path d="M 30 70 Q 100 20 170 70" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-linecap="round" filter="blur(2px)" />

          <!-- Play Button (Crisp Geometric) -->
          <path 
            d="M 75 50 L 150 100 L 75 150 Z" 
            fill="#ffffff" 
            stroke="#ffffff" 
            stroke-width="4" 
            stroke-linejoin="round"
            filter="url(#triShadow)"
          />
        </svg>
      </div>

      <!-- Hardware -->
      <div class="mount tl"></div>
      <div class="mount tr"></div>
      <div class="mount bl"></div>
      <div class="mount br"></div>

      <!-- Physical Label -->
      <div class="label">
        MODEL 01
        <span>400mm Plate</span>
      </div>

    </div>

    <!-- Shadows -->
    <div class="contact-shadow"></div>
    <div class="floor-shadow"></div>
  </div>

  <script>
    // Smooth parallax interaction
    const scene = document.querySelector('.scene');
    const floorShadow = document.querySelector('.floor-shadow');
    
    // Base rotation values
    const baseRotateX = 15;
    const baseRotateY = -20;

    document.addEventListener('mousemove', (e) => {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      
      // Calculate distance from center (normalized -1 to 1)
      const x = (e.clientX - centerX) / centerX;
      const y = (e.clientY - centerY) / centerY;

      // Apply rotation limits for subtle movement
      // Adjusted for the new base angles
      const rotateY = baseRotateY + (x * 12); 
      const rotateX = baseRotateX + (y * -10); 

      scene.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

      // Move shadow opposite to sign to simulate light source
      // Shadow moves X and Y on the floor plane
      floorShadow.style.transform = `translate(-50%, -50%) translateZ(-220px) rotateX(90deg) translateX(${x * 40}px) translateY(${y * 40}px)`;
    });

    // Reset smoothly on leave
    document.addEventListener('mouseleave', () => {
      scene.style.transform = `rotateX(${baseRotateX}deg) rotateY(${baseRotateY}deg)`;
      floorShadow.style.transform = `translate(-50%, -50%) translateZ(-220px) rotateX(90deg)`;
    });
  </script>
</body>
</html>
