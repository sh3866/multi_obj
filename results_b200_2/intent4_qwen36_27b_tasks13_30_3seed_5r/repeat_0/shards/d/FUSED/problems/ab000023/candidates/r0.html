<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Scene: The Emblem</title>
<style>
  :root {
    --bg-color: #e8e8e8;
    --sign-face: #ffffff;
    --sign-side: #f0f0f0;
    --sign-edge: #dcdcdc;
    --brand-red: #FF0000;
    --brand-shadow: #D50000;
    --text-main: #1a1a1a;
    --text-muted: #666666;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-color);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    perspective: 1200px;
  }

  /* Ambient Background Gradient */
  .ambient-light {
    position: absolute;
    top: -20%;
    left: -20%;
    width: 140%;
    height: 140%;
    background: radial-gradient(circle at 50% 40%, #ffffff 0%, #dcdcdc 60%, #b0b0b0 100%);
    z-index: -1;
  }

  /* UI Overlay */
  .ui-layer {
    position: absolute;
    top: 40px;
    left: 60px;
    z-index: 10;
    pointer-events: none;
  }

  h1 {
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-main);
    margin-bottom: 8px;
  }

  p.subtitle {
    font-size: 12px;
    color: var(--text-muted);
    max-width: 300px;
    line-height: 1.5;
  }

  /* The 3D Scene Container */
  .scene {
    position: relative;
    width: 400px;
    height: 400px;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
    transform: rotateX(10deg) rotateY(-10deg);
    transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* The Physical Sign Block */
  .sign-block {
    position: relative;
    width: 340px;
    height: 340px;
    transform-style: preserve-3d;
    cursor: pointer;
  }

  /* Faces of the Sign */
  .face {
    position: absolute;
    background: var(--sign-face);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05); /* Crisp edge highlight */
  }

  .face.front {
    width: 100%;
    height: 100%;
    transform: translateZ(25px);
    /* Soft inner shadow for depth */
    box-shadow: inset 0 0 20px rgba(0,0,0,0.02); 
  }

  .face.right {
    width: 50px; /* Thickness */
    height: 100%;
    background: linear-gradient(to bottom, #f2f2f2, #e6e6e6);
    transform: rotateY(90deg) translateZ(315px); /* Center + half thickness */
    left: -25px; /* Offset to align with right edge */
  }

  .face.top {
    width: 100%;
    height: 50px;
    background: linear-gradient(to right, #f2f2f2, #e6e6e6);
    transform: rotateX(90deg) translateZ(25px);
    top: -25px;
  }

  /* Mounting Hardware */
  .mount {
    position: absolute;
    width: 12px;
    height: 12px;
    background: #b0b0b0;
    border-radius: 50%;
    transform: translateZ(26px); /* Just in front of the sign */
    box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
  }
  .mount::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 4px; height: 4px;
    background: #888;
    border-radius: 50%;
  }
  .mount.tl { top: 20px; left: 20px; }
  .mount.tr { top: 20px; right: 20px; }
  .mount.bl { bottom: 20px; left: 20px; }
  .mount.br { bottom: 20px; right: 20px; }

  /* The SVG Emblem */
  .emblem-container {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) translateZ(26px); /* Floating slightly above surface */
    width: 140px;
    height: 140px;
  }

  svg.emblem {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* SVG Styling */
  .bg-circle {
    fill: var(--brand-red);
    filter: drop-shadow(0 10px 15px rgba(255, 0, 0, 0.4));
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  
  .play-triangle {
    fill: #ffffff;
    transform-origin: center;
    transition: transform 0.3s ease;
  }

  /* Drop Shadow on the Floor */
  .floor-shadow {
    position: absolute;
    width: 300px;
    height: 40px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0) 70%);
    bottom: -150px;
    transform: rotateX(90deg) translateZ(-20px);
    filter: blur(10px);
  }

  /* Interactivity States */
  .sign-block:hover .bg-circle {
    transform: scale(1.05);
  }
  .sign-block:hover .play-triangle {
    transform: scale(1.1);
  }
  .sign-block:active {
    transform: scale(0.98);
  }
  .sign-block:active .bg-circle {
    transform: scale(0.95);
  }

  /* Product Info Footer */
  .info-strip {
    position: absolute;
    bottom: 40px;
    display: flex;
    gap: 40px;
  }
  .info-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .info-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    font-weight: 600;
  }
  .info-value {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-main);
  }

  /* Subtle animation for the emblem on load */
  @keyframes popIn {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  .emblem-container {
    animation: popIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

</style>
</head>
<body>

  <div class="ambient-light"></div>

  <div class="ui-layer">
    <h1>Studio Emblem</h1>
    <p class="subtitle">High-contrast geometric signage.<br>Pristine white finish with chromatic red.</p>
  </div>

  <div class="scene">
    <div class="sign-block">
      <!-- 3D Faces -->
      <div class="face front"></div>
      <div class="face right"></div>
      <div class="face top"></div>

      <!-- Mounting Hardware -->
      <div class="mount tl"></div>
      <div class="mount tr"></div>
      <div class="mount bl"></div>
      <div class="mount br"></div>

      <!-- The Graphic Emblem -->
      <div class="emblem-container">
        <svg class="emblem" viewBox="0 0 100 100">
          <!-- The Red Circle -->
          <circle class="bg-circle" cx="50" cy="50" r="48" />
          
          <!-- The White Play Button -->
          <!-- Coordinates calculated for perfect centering -->
          <path class="play-triangle" d="M 40 28 L 72 50 L 40 72 Z" />
        </svg>
      </div>

      <!-- Floor Shadow -->
      <div class="floor-shadow"></div>
    </div>
  </div>

  <div class="info-strip">
    <div class="info-item">
      <span class="info-label">Material</span>
      <span class="info-value">Alabaster Matte</span>
    </div>
    <div class="info-item">
      <span class="info-label">Dimension</span>
      <span class="info-value">340 x 340mm</span>
    </div>
    <div class="info-item">
      <span class="info-label">Finish</span>
      <span class="info-value">Soft Touch</span>
    </div>
  </div>

  <script>
    // Simple parallax effect to enhance the 3D feel
    const scene = document.querySelector('.scene');
    const signBlock = document.querySelector('.sign-block');

    document.addEventListener('mousemove', (e) => {
      const x = (window.innerWidth / 2 - e.pageX) / 40;
      const y = (window.innerHeight / 2 - e.pageY) / 40;

      // Clamp values to prevent extreme rotation
      const clampX = Math.max(-15, Math.min(15, x));
      const clampY = Math.max(-15, Math.min(15, y));

      // Apply rotation to the scene container
      scene.style.transform = `rotateX(${10 + clampY}deg) rotateY(${-10 + clampX}deg)`;
    });

    // Reset on mouse leave
    document.addEventListener('mouseleave', () => {
      scene.style.transform = `rotateX(10deg) rotateY(-10deg)`;
    });
  </script>
</body>
</html>
