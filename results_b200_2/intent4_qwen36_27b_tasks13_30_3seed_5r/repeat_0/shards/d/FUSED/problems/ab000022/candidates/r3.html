<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Bounce Dash - Adventure Awaits</title>
    <style>
        :root {
            /* Base Palette - will be updated by JS */
            --c-sky-top: #4facfe;
            --c-sky-bot: #00f2fe;
            --c-hill-light: #85e04c;
            --c-hill-dark: #4da025;
            --c-ground: #65c238;
            --c-ground-dark: #4da025;
            --c-dirt: #e67e22;
            --c-dirt-dark: #d35400;
            --c-block: #f1c40f;
            --c-block-dark: #f39c12;
            --c-hero: #ff4757;
            --c-hero-dark: #c0392b;
            --c-ui-white: #ffffff;
            --c-text: #2d3436;
            --c-accent: #3498db;

            /* Typography */
            --font-stack: 'Segoe UI', 'Helvetica Neue', sans-serif;
            --font-display: 'Arial Black', 'Impact', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }

        body {
            background: #111;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-stack);
            overflow: hidden;
            color: var(--c-text);
        }

        /* --- GAME SCREEN CONTAINER --- */
        #game-screen {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1920px;
            max-height: 1080px;
            background: linear-gradient(to bottom, var(--c-sky-top), var(--c-sky-bot));
            overflow: hidden;
            box-shadow: 0 0 100px rgba(0,0,0,0.8);
            transition: background 0.8s ease;
        }

        /* --- DEPTH LAYERS --- */
        .layer {
            position: absolute;
            width: 120%;
            left: -10%;
            height: 100%;
            pointer-events: none;
            transition: transform 0.1s linear;
            will-change: transform;
        }

        /* Layer 1: Clouds */
        .cloud {
            position: absolute;
            background: #fff;
            border-radius: 100px;
            opacity: 0.9;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .cloud::after, .cloud::before {
            content: ''; position: absolute; background: inherit; border-radius: 50%;
        }
        /* Cloud Shapes */
        .c1 { width: 160px; height: 60px; top: 10%; left: 10%; animation: floatCloud 40s infinite linear; }
        .c1::after { width: 80px; height: 80px; top: -40px; left: 20px; }
        .c1::before { width: 100px; height: 100px; top: -50px; left: 60px; }
        
        .c2 { width: 240px; height: 80px; top: 20%; left: 65%; animation: floatCloud 60s infinite linear reverse; opacity: 0.7; transform: scale(0.8); }
        .c2::after { width: 120px; height: 120px; top: -60px; left: 40px; }
        
        .c3 { width: 120px; height: 50px; top: 15%; left: 85%; animation: floatCloud 30s infinite linear; }
        .c3::after { width: 60px; height: 60px; top: -30px; left: 15px; }

        @keyframes floatCloud {
            0% { transform: translateX(0); }
            50% { transform: translateX(60px); }
            100% { transform: translateX(0); }
        }

        /* Layer 2: Distant Hills (Expressive Shapes) */
        .hills-container {
            position: absolute;
            bottom: 160px;
            width: 100%;
            height: 300px;
            z-index: 1;
            opacity: 0.8;
        }
        .hill {
            position: absolute;
            bottom: 0;
            border-radius: 50% 50% 0 0;
        }
        /* Creating varied contours */
        .h1 { width: 600px; height: 350px; left: -5%; background: var(--c-hill-light); z-index: 1; }
        .h2 { width: 800px; height: 450px; left: 30%; background: var(--c-hill-dark); z-index: 0; }
        .h3 { width: 500px; height: 300px; left: 70%; background: var(--c-hill-light); z-index: 1; }

        /* Layer 3: Level Canvas (Mid-ground) */
        #level-canvas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 500px; /* Taller to allow depth */
            z-index: 5;
        }

        /* Layer 4: Hero (Foreground-ish) */
        #hero-container {
            position: absolute;
            bottom: 170px; /* Standing on canvas ground */
            left: 20%;
            z-index: 10;
            width: 120px;
            height: 120px;
            transition: left 0.1s linear;
            filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.5));
        }

        /* Particles */
        .particle {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.8;
            pointer-events: none;
            animation: twinkle 2s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* --- UI OVERLAY --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 40px;
            pointer-events: none;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        .game-title {
            font-family: var(--font-display);
            font-size: 6rem;
            color: var(--c-ui-white);
            text-transform: uppercase;
            line-height: 0.85;
            position: relative;
            transform: skew(-5deg) rotate(-3deg);
            /* Strong Identity Styling */
            text-shadow: 
                0 4px 0 #000,
                0 6px 0 #000,
                5px 5px 0 #000;
            margin-top: 20px;
        }
        
        .game-title span {
            display: block;
            color: var(--c-block);
            font-size: 7.5rem;
            text-shadow: 
                0 4px 0 #d35400,
                0 6px 0 #d35400,
                5px 5px 0 #000;
            background: linear-gradient(to bottom, #f1c40f 0%, #f39c12 100%);
            -webkit-background-clip: text;
            /* Fallback for browsers not supporting clip text */
            color: var(--c-block); 
        }

        /* Score Panel */
        .score-panel {
            background: var(--c-ui-white);
            border: 5px solid var(--c-text);
            border-radius: 20px 20px 20px 5px; /* Tag shape */
            padding: 15px 25px;
            display: flex;
            gap: 20px;
            align-items: center;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.2);
            pointer-events: auto;
            transform: rotate(-2deg);
            margin-top: 20px;
        }

        .coin-icon {
            width: 40px; height: 40px;
            background: radial-gradient(circle at 30% 30%, #f1c40f, #d35400);
            border-radius: 50%;
            border: 3px solid #d35400;
            display: flex;
            align-items: center; justify-content: center;
            font-weight: 900; color: #fff; text-shadow: 1px 1px 0 #000;
            font-family: monospace; font-size: 1.2rem;
            box-shadow: inset -3px -3px 0 rgba(0,0,0,0.2);
        }

        .score-group { display: flex; flex-direction: column; }
        .score-label { font-size: 0.8rem; font-weight: 800; color: #777; text-transform: uppercase; letter-spacing: 1px; }
        .score-val { font-family: monospace; font-size: 1.8rem; font-weight: 900; color: var(--c-text); }

        /* Bottom Section */
        .bottom-controls {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            margin-bottom: 40px; /* Lifted up */
        }

        /* World Selector (Game Tokens) */
        .world-selector-group {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transform: rotate(2deg);
        }
        
        .world-header {
            font-family: var(--font-display);
            color: var(--c-ui-white);
            font-size: 1.4rem;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.4);
            margin-left: 10px;
            letter-spacing: 1px;
        }

        .world-selector {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
            padding: 10px;
            border-radius: 50px;
            display: flex;
            gap: 15px;
            border: 3px solid rgba(255,255,255,0.4);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .world-btn {
            width: 60px; height: 60px;
            border-radius: 50%;
            border: 4px solid var(--c-ui-white);
            cursor: pointer;
            position: relative;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center;
        }

        .world-btn:hover { transform: translateY(-5px) scale(1.1); }
        .world-btn.active { 
            transform: scale(1.2) translateY(-8px); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            z-index: 2;
            border-color: #f1c40f;
        }
        
        /* Inner Icon for World Buttons */
        .world-btn::after {
            content: ''; width: 30%; height: 30%; background: rgba(255,255,255,0.8);
            border-radius: 50%;
        }

        /* Controls Guide (Signpost) */
        .signpost-container {
            pointer-events: none;
            position: relative;
            transform: rotate(-2deg);
            margin-bottom: 20px;
        }
        
        .signpost-board {
            background: #e67e22;
            border: 4px solid #d35400;
            padding: 15px 25px;
            border-radius: 12px;
            color: #fff;
            box-shadow: 0 8px 0 rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            min-width: 180px;
        }
        
        /* Wood Post */
        .signpost-board::after {
            content: '';
            position: absolute;
            bottom: -50px;
            left: 50%;
            width: 16px;
            height: 50px;
            background: linear-gradient(90deg, #8e44ad, #5e2d73); /* Wood color */
            transform: translateX(-50%);
            z-index: -1;
        }

        .key-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            font-size: 0.9rem;
            font-weight: 800;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
        }
        .keys { display: flex; gap: 5px; }
        .key {
            background: #fff;
            color: #333;
            padding: 5px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: 900;
            box-shadow: 0 4px 0 #999;
            border-bottom: 2px solid #ccc;
            font-size: 0.8rem;
        }

        /* --- START BUTTON (Priority 1: Massive, Glowing Portal) --- */
        .start-btn-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .start-btn-label {
            font-family: var(--font-display);
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 0 #000;
            animation: pulseText 2s infinite;
            letter-spacing: 2px;
        }

        .start-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #f1c40f, #e67e22);
            border: 8px solid #fff;
            box-shadow: 
                0 0 0 10px rgba(241, 196, 15, 0.4),
                0 10px 30px rgba(0,0,0,0.5),
                inset 0 0 20px rgba(255,255,255,0.5);
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: portalPulse 3s infinite ease-in-out;
        }

        /* Inner Arrow */
        .start-btn::before {
            content: '';
            display: block;
            width: 0; height: 0;
            border-top: 30px solid transparent;
            border-bottom: 30px solid transparent;
            border-left: 50px solid #fff;
            margin-left: 10px;
            filter: drop-shadow(0 2px 0 rgba(0,0,0,0.2));
        }

        .start-btn:hover {
            transform: scale(1.1);
            background: radial-gradient(circle at 30% 30%, #ffd700, #f39c12);
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        @keyframes portalPulse {
            0% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0.7), 0 10px 30px rgba(0,0,0,0.5); }
            50% { box-shadow: 0 0 0 20px rgba(241, 196, 15, 0), 0 15px 40px rgba(0,0,0,0.6); }
            100% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0), 0 10px 30px rgba(0,0,0,0.5); }
        }
        
        @keyframes pulseText {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }

        /* SVG Hero Styles */
        .hero-svg { width: 100%; height: 100%; overflow: visible; }
        .eye { transform-origin: center; animation: blink 4s infinite; }
        @keyframes blink {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .game-title { font-size: 3.5rem; }
            .game-title span { font-size: 4.5rem; }
            .bottom-controls { flex-direction: column-reverse; align-items: center; gap: 20px; }
            .signpost-container { transform: rotate(0); }
            .world-selector-group { transform: rotate(0); align-items: center; }
        }

    </style>
</head>
<body>

    <div id="game-screen">
        
        <!-- Layer 1: Clouds -->
        <div class="layer" id="bg-clouds">
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="cloud c3"></div>
        </div>

        <!-- Layer 2: Hills (Expressive Shapes) -->
        <div class="layer" id="bg-hills">
            <div class="hills-container">
                <div class="hill h1"></div>
                <div class="hill h2"></div>
                <div class="hill h3"></div>
            </div>
        </div>

        <!-- Layer 3: Level Canvas -->
        <canvas id="level-canvas"></canvas>

        <!-- Layer 4: Hero -->
        <div id="hero-container">
            <svg class="hero-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="2" result="blur"/>
                        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                    </filter>
                </defs>
                <!-- Body -->
                <circle cx="50" cy="55" r="38" fill="#FF4757" stroke="#C41E3A" stroke-width="4" />
                <!-- Shine -->
                <path d="M28 35 Q 50 18 72 35" stroke="rgba(255,255,255,0.6)" stroke-width="5" fill="none" stroke-linecap="round" />
                <!-- Face -->
                <g class="face">
                    <!-- Eyes -->
                    <circle cx="38" cy="50" r="7" fill="black" class="eye" />
                    <circle cx="62" cy="50" r="7" fill="black" class="eye" />
                    <!-- Eye Highlights -->
                    <circle cx="41" cy="47" r="3" fill="white" class="eye" />
                    <circle cx="65" cy="47" r="3" fill="white" class="eye" />
                    <!-- Mouth -->
                    <path d="M38 68 Q 50 78 62 68" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round" />
                </g>
                <!-- Hat -->
                <path d="M20 25 L 50 5 L 80 25 Z" fill="#FFD700" stroke="#E67E22" stroke-width="4" stroke-linejoin="round" />
                <rect x="15" y="22" width="70" height="8" rx="4" fill="#E67E22" stroke="#d35400" stroke-width="2"/>
            </svg>
        </div>

        <!-- Particles Container -->
        <div id="particles-layer" class="layer" style="z-index: 8;"></div>

        <!-- UI Layer -->
        <div class="ui-layer">
            <header>
                <div class="game-title">
                    Super
                    <span>Bounce</span>
                </div>
                
                <div class="score-panel">
                    <div class="coin-icon">$</div>
                    <div class="score-group">
                        <span class="score-label">Coins</span>
                        <span class="score-val">x 124</span>
                    </div>
                    <div style="width: 2px; height: 30px; background: #ddd; margin: 0 10px;"></div>
                    <div class="score-group">
                        <span class="score-label">High Score</span>
                        <span class="score-val">99,500</span>
                    </div>
                </div>
            </header>

            <div class="bottom-controls">
                <!-- Left: World Selector -->
                <div class="world-selector-group">
                    <div class="world-header">WORLD SELECT</div>
                    <div class="world-selector">
                        <div class="world-btn w-grass active" data-theme="grass" title="Green Hills" style="background: radial-gradient(circle at 30% 30%, #85e04c, #4CBB17);"></div>
                        <div class="world-btn w-ice" data-theme="ice" title="Ice Peaks" style="background: radial-gradient(circle at 30% 30%, #a3f7ff, #5bc0de);"></div>
                        <div class="world-btn w-fire" data-theme="fire" title="Lava Lands" style="background: radial-gradient(circle at 30% 30%, #ff9f43, #c0392b);"></div>
                        <div class="world-btn w-sky" data-theme="sky" title="Sky High" style="background: radial-gradient(circle at 30% 30%, #74b9ff, #0984e3);"></div>
                    </div>
                </div>

                <!-- Right: Controls (Signpost) -->
                <div class="signpost-container">
                    <div class="signpost-board">
                        <div class="key-row">
                            <span>MOVE</span>
                            <div class="keys"><span class="key">←</span> <span class="key">→</span></div>
                        </div>
                        <div class="key-row">
                            <span>JUMP</span>
                            <div class="keys"><span class="key" style="width: 70px;">SPACE</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Center Bottom: Start Button (Portal Style) -->
        <div class="start-btn-container">
            <div class="start-btn-label">START ADVENTURE</div>
            <button class="start-btn" id="start-btn"></button>
        </div>

    </div>

    <script>
        // --- CONFIGURATION ---
        const themes = {
            grass: { 
                sky: ['#4facfe', '#00f2fe'], 
                hillLight: '#85e04c', hillDark: '#4da025',
                ground: '#65c238', groundDark: '#4da025', 
                dirt: '#e67e22', dirtDark: '#d35400',
                block: '#f1c40f', blockDark: '#f39c12'
            },
            ice: { 
                sky: ['#83a4d4', '#b6fbff'], 
                hillLight: '#a3f7ff', hillDark: '#74b9ff',
                ground: '#dfe6e9', groundDark: '#b2bec3', 
                dirt: '#b2bec3', dirtDark: '#636e72',
                block: '#74b9ff', blockDark: '#0984e3'
            },
            fire: { 
                sky: ['#2c3e50', '#fd746c'], 
                hillLight: '#57606f', hillDark: '#2f3542',
                ground: '#333333', groundDark: '#1e1e1e', 
                dirt: '#2c2c2c', dirtDark: '#1a1a1a',
                block: '#e17055', blockDark: '#d63031'
            },
            sky: {
                sky: ['#2980b9', '#6dd5fa'], 
                hillLight: '#f1c40f', hillDark: '#f39c12',
                ground: '#f1c40f', groundDark: '#f39c12', 
                dirt: '#f1c40f', dirtDark: '#d35400',
                block: '#fab1a0', blockDark: '#e17055'
            }
        };

        let currentTheme = themes.grass;

        // --- CANVAS DRAWING ---
        const canvas = document.getElementById('level-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
            drawLevel();
        }
        window.addEventListener('resize', resize);

        // Drawing Helpers
        function drawRect(x, y, w, h, color, shadowColor) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
            if(shadowColor) {
                ctx.fillStyle = shadowColor;
                ctx.fillRect(x, y + h - 6, w, 6); // Bottom shadow
                ctx.fillRect(x + w - 6, y, 6, h); // Right shadow
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(x, y, w, 6); // Top highlight
                ctx.fillRect(x, y, 6, h); // Left highlight
            }
        }

        function drawMysteryBlock(x, y, size, color, darkColor) {
            // Base
            ctx.fillStyle = color;
            ctx.fillRect(x, y, size, size);
            
            // Highlights/Shadows
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.fillRect(x, y, size, 6);
            ctx.fillRect(x, y, 6, size);
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(x, y+size-6, size, 6);
            ctx.fillRect(x+size-6, y, 6, size);

            // Screws
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.arc(x+8, y+8, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+size-8, y+8, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+8, y+size-8, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+size-8, y+size-8, 3, 0, Math.PI*2); ctx.fill();

            // Question Mark
            ctx.fillStyle = darkColor;
            ctx.font = `900 ${size*0.6}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('?', x + size/2, y + size/2 + 4);
        }

        function drawPipe(x, y, w, h, color) {
            const headH = 50;
            // Body
            ctx.fillStyle = color;
            ctx.fillRect(x + 12, y + headH, w - 24, h - headH);
            // Head
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, headH);
            
            // Highlights
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(x+6, y, 10, headH); // Head shine
            ctx.fillRect(x+18, y+headH, 6, h-headH); // Body shine
            
            // Shadows
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(x+w-12, y, 12, headH);
            ctx.fillRect(x+w-12, y+headH, 12, h-headH);

            // Outlines
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, w, headH);
            ctx.strokeRect(x+12, y+headH, w-24, h-headH);
        }

        function drawFlag(x, y, h) {
            // Pole
            ctx.fillStyle = '#bdc3c7';
            ctx.fillRect(x, y, 10, h);
            ctx.strokeStyle = '#7f8c8d';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, 10, h);
            
            // Ball
            ctx.beginPath();
            ctx.arc(x+5, y, 10, 0, Math.PI*2);
            ctx.fillStyle = '#f1c40f';
            ctx.fill();
            ctx.stroke();

            // Flag
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.moveTo(x+10, y+15);
            ctx.lineTo(x+70, y+35);
            ctx.lineTo(x+10, y+60);
            ctx.fill();
            ctx.stroke();
        }

        function drawEnemy(x, y) {
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(x+30, y+45, 25, 8, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Body (Goomba-ish)
            ctx.fillStyle = '#8e44ad';
            ctx.beginPath();
            ctx.arc(x+30, y+25, 30, Math.PI, 0); // Dome
            ctx.lineTo(x+60, y+45);
            ctx.lineTo(x, y+45);
            ctx.fill();
            
            // Feet
            ctx.fillStyle = '#2c3e50';
            ctx.beginPath(); ctx.ellipse(x+10, y+45, 10, 6, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(x+50, y+45, 10, 6, 0, 0, Math.PI*2); ctx.fill();

            // Face
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(x+18, y+30, 8, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+42, y+30, 8, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(x+20, y+30, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+40, y+30, 3, 0, Math.PI*2); ctx.fill();
            
            // Eyebrows
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(x+10, y+22); ctx.lineTo(x+25, y+26); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x+50, y+22); ctx.lineTo(x+35, y+26); ctx.stroke();
        }

        function drawCoin(x, y, offset) {
            const wobble = Math.sin(Date.now() / 200 + offset) * 3;
            const scale = (Math.sin(Date.now() / 300 + offset) + 1) / 2; // 0 to 1
            
            ctx.save();
            ctx.translate(x, y + wobble);
            ctx.scale(scale, 1);
            
            // Glow
            ctx.shadowColor = '#FFD700';
            ctx.shadowBlur = 15;
            
            // Coin Body
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.ellipse(0, 0, 14, 18, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Inner
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#DAA520';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.ellipse(-4, -4, 3, 6, 0, 0, Math.PI*2);
            ctx.fill();
            
            ctx.restore();
        }

        function drawLevel() {
            const t = currentTheme;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const groundY = canvas.height - 100;

            // 1. Ground
            drawRect(0, groundY, canvas.width, 100, t.ground, t.groundDark);
            
            // Dirt layer
            drawRect(0, groundY + 25, canvas.width, 75, t.dirt, t.dirtDark);
            
            // Dirt details
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for(let i=0; i<canvas.width; i+=80) {
                ctx.beginPath(); ctx.arc(i+40, groundY+60, 6, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(i+20, groundY+80, 6, 0, Math.PI*2); ctx.fill();
            }

            // 2. Platforms
            // Mystery Block
            drawMysteryBlock(canvas.width * 0.25, groundY - 140, 60, t.block, t.blockDark);
            
            // Brick Row
            for(let i=0; i<3; i++) {
                drawRect(canvas.width * 0.45 + (i*70), groundY - 140, 65, 25, t.dirt, t.dirtDark);
                // Grass top
                ctx.fillStyle = t.ground;
                ctx.fillRect(canvas.width * 0.45 + (i*70), groundY - 140, 65, 8);
            }

            // High Platform
            drawRect(canvas.width * 0.75, groundY - 230, 180, 25, t.dirt, t.dirtDark);
            ctx.fillStyle = t.ground;
            ctx.fillRect(canvas.width * 0.75, groundY - 230, 180, 8);

            // 3. Pipe
            drawPipe(canvas.width * 0.65, groundY - 70, 80, 70, t.groundDark);

            // 4. Flag
            drawFlag(canvas.width * 0.88, groundY - 280, 280);

            // 5. Coins
            drawCoin(canvas.width * 0.25 + 30, groundY - 180, 0);
            drawCoin(canvas.width * 0.75 + 50, groundY - 270, 1);
            drawCoin(canvas.width * 0.75 + 90, groundY - 270, 2);
            drawCoin(canvas.width * 0.75 + 130, groundY - 270, 3);

            // 6. Enemy
            drawEnemy(canvas.width * 0.55, groundY - 45);

            // 7. Bushes
            const drawBush = (x, y, scale, color) => {
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(x, y, 35 * scale, 0, Math.PI * 2);
                ctx.arc(x + 30*scale, y, 45 * scale, 0, Math.PI * 2);
                ctx.arc(x + 60*scale, y, 35 * scale, 0, Math.PI * 2);
                ctx.fill();
            };
            drawBush(canvas.width * 0.15, groundY, 1.2, t.groundDark);
            drawBush(canvas.width * 0.8, groundY, 0.9, t.groundDark);
        }

        // --- INTERACTIVITY ---
        
        // 1. Parallax & Hero Movement
        const hero = document.getElementById('hero-container');
        const screen = document.getElementById('game-screen');
        const bgClouds = document.getElementById('bg-clouds');
        const bgHills = document.getElementById('bg-hills');
        const particlesLayer = document.getElementById('particles-layer');
        let mouseX = 0;

        // Create Particles
        for(let i=0; i<15; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.width = Math.random() * 6 + 2 + 'px';
            p.style.height = p.style.width;
            p.style.left = Math.random() * 100 + '%';
            p.style.top = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 2 + 's';
            particlesLayer.appendChild(p);
        }

        screen.addEventListener('mousemove', (e) => {
            const rect = screen.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            
            // Map mouse X to percentage
            let percent = (mouseX / rect.width) * 100;
            if(percent > 40) percent = 40;
            if(percent < 10) percent = 10;
            
            // Hero movement
            hero.style.left = percent + '%';
            
            // Bobbing effect
            const bounce = Math.abs(Math.sin(Date.now() / 300)) * 15;
            hero.style.transform = `translateY(-${bounce}px)`;

            // Parallax Backgrounds
            const moveX = (mouseX - rect.width/2) * 0.05;
            bgClouds.style.transform = `translateX(${moveX}px)`;
            bgHills.style.transform = `translateX(${moveX * 2}px)`;
        });

        // 2. World Selector Logic
        const worlds = document.querySelectorAll('.world-btn');
        const root = document.documentElement;
        
        worlds.forEach(btn => {
            btn.addEventListener('click', () => {
                worlds.forEach(w => w.classList.remove('active'));
                btn.classList.add('active');

                const themeName = btn.dataset.theme;
                currentTheme = themes[themeName];
                
                // Update CSS Variables
                root.style.setProperty('--c-sky-top', currentTheme.sky[0]);
                root.style.setProperty('--c-sky-bot', currentTheme.sky[1]);
                root.style.setProperty('--c-hill-light', currentTheme.hillLight);
                root.style.setProperty('--c-hill-dark', currentTheme.hillDark);
                root.style.setProperty('--c-ground', currentTheme.ground);
                root.style.setProperty('--c-ground-dark', currentTheme.groundDark);
                
                // Redraw Canvas
                drawLevel();
            });
        });

        // 3. Animation Loop
        function animate() {
            drawLevel();
            requestAnimationFrame(animate);
        }

        // Start
        resize();
        animate();

    </script>
</body>
</html>
