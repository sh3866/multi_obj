<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Bounce - Adventure Awaits</title>
    <style>
        :root {
            /* Palette - Grasslands (Default) */
            --c-sky-top: #4facfe;
            --c-sky-bot: #00f2fe;
            --c-hill-bg: #85e04c;
            --c-hill-fg: #57c91b;
            --c-ground: #65c238;
            --c-ground-dark: #4da025;
            --c-dirt: #e67e22;
            --c-dirt-dark: #d35400;
            --c-block: #f1c40f;
            --c-block-dark: #f39c12;
            --c-text: #2d3436;
            --c-ui-bg: rgba(255, 255, 255, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }

        body {
            background: #111;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            color: var(--c-text);
        }

        /* --- MAIN CONTAINER --- */
        #game-screen {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1920px;
            max-height: 1080px;
            background: linear-gradient(to bottom, var(--c-sky-top), var(--c-sky-bot));
            overflow: hidden;
            transition: background 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* --- PARALLAX LAYERS --- */
        .layer {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            will-change: transform;
        }

        /* Layer 1: Clouds */
        .cloud {
            position: absolute;
            background: #fff;
            border-radius: 100px;
            opacity: 0.9;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            animation: floatCloud linear infinite;
        }
        .cloud::after, .cloud::before {
            content: ''; position: absolute; background: inherit; border-radius: 50%;
        }
        
        /* Cloud Variations */
        .c1 { width: 160px; height: 60px; top: 15%; left: -20%; animation-duration: 45s; }
        .c1::after { width: 80px; height: 80px; top: -40px; left: 20px; }
        .c1::before { width: 100px; height: 100px; top: -50px; left: 60px; }
        
        .c2 { width: 240px; height: 80px; top: 25%; left: -30%; animation-duration: 65s; animation-delay: -20s; opacity: 0.7; transform: scale(0.8); }
        .c2::after { width: 120px; height: 120px; top: -60px; left: 40px; }
        
        .c3 { width: 120px; height: 50px; top: 10%; left: -10%; animation-duration: 35s; animation-delay: -10s; }
        .c3::after { width: 60px; height: 60px; top: -30px; left: 15px; }

        @keyframes floatCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(120vw); }
        }

        /* Layer 2: Hills */
        .hills-container {
            position: absolute;
            bottom: 120px; /* Sits slightly above canvas ground */
            width: 100%;
            height: 400px;
            z-index: 1;
        }
        .hill {
            position: absolute;
            bottom: -50px;
            border-radius: 50% 50% 0 0;
            transition: background 0.8s ease;
        }
        .h1 { width: 120vw; height: 300px; left: -10%; background: var(--c-hill-bg); z-index: 1; filter: brightness(1.1); }
        .h2 { width: 140vw; height: 450px; left: 20%; background: var(--c-hill-fg); z-index: 2; filter: brightness(0.9); }

        /* Layer 3: Level Canvas (Mid-ground) */
        #level-canvas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 450px;
            z-index: 5;
        }

        /* Layer 4: Hero */
        #hero-container {
            position: absolute;
            bottom: 130px; 
            left: 20%;
            z-index: 10;
            width: 120px;
            height: 120px;
            filter: drop-shadow(0px 15px 10px rgba(0,0,0,0.4));
            transition: transform 0.1s linear;
            animation: heroBob 2s infinite ease-in-out;
        }

        @keyframes heroBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* --- UI OVERLAY --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 60px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .game-title {
            font-family: 'Arial Black', Impact, sans-serif;
            font-size: 6rem;
            line-height: 0.9;
            letter-spacing: -2px;
            transform: skew(-5deg) rotate(-3deg);
            margin-top: 20px;
            z-index: 25;
            text-transform: uppercase;
        }

        .title-line-1 {
            display: block;
            color: var(--c-ui-bg);
            text-shadow: 4px 4px 0 #000, 8px 8px 0 rgba(0,0,0,0.2);
            font-size: 3.5rem;
            letter-spacing: 8px;
        }

        .title-line-2 {
            display: block;
            color: var(--c-block);
            text-shadow: 4px 4px 0 #d35400, 8px 8px 0 rgba(0,0,0,0.2);
            background: linear-gradient(to bottom, #fff176 0%, #f1c40f 50%, #f39c12 100%);
            -webkit-background-clip: text;
            color: transparent;
            position: relative;
        }

        /* The 'O' in BOUNCE */
        .o-bounce {
            display: inline-block;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle at 30% 30%, #ff7675, #d63031);
            border: 4px solid #fff;
            border-radius: 50%;
            margin: 0 8px;
            vertical-align: middle;
            position: relative;
            top: -5px;
            box-shadow: inset -5px -5px 0 rgba(0,0,0,0.2), 0 5px 10px rgba(0,0,0,0.3);
            animation: bounceLogo 1.5s infinite ease-in-out;
        }
        .o-bounce::after {
            content: ''; position: absolute; top: 18px; left: 20px;
            width: 12px; height: 12px; background: #fff; border-radius: 50%;
            box-shadow: 22px 0 0 #fff;
        }

        @keyframes bounceLogo {
            0%, 100% { transform: translateY(0) scale(1, 1); }
            50% { transform: translateY(-15px) scale(1.1, 0.9); }
        }

        /* HUD Bar */
        .hud-bar {
            display: flex;
            gap: 15px;
            pointer-events: auto;
            transform: rotate(2deg);
        }

        .hud-panel {
            background: var(--c-ui-bg);
            border: 4px solid var(--c-text);
            border-radius: 0 20px 20px 0;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 5px 5px 0 rgba(0,0,0,0.2);
        }
        
        .hud-icon {
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-weight: 900; font-size: 1.2rem;
            box-shadow: inset -2px -2px 0 rgba(0,0,0,0.2);
        }
        .icon-coin { background: radial-gradient(circle at 30% 30%, #f1c40f, #e67e22); color: #fff; border: 2px solid #d35400; }
        .icon-star { background: radial-gradient(circle at 30% 30%, #a29bfe, #6c5ce7); color: #fff; border: 2px solid #5f27cd; }

        .hud-val { font-family: monospace; font-size: 1.4rem; font-weight: 900; color: var(--c-text); }

        /* Bottom UI */
        .bottom-ui {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            margin-bottom: 20px;
        }

        /* World Selector (Map Path) */
        .world-map {
            pointer-events: auto;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            padding: 15px 25px;
            border-radius: 30px;
            border: 3px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            gap: 5px;
            transform: rotate(-3deg);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .path-connector {
            width: 40px; height: 6px;
            background: repeating-linear-gradient(90deg, #fff 0, #fff 5px, transparent 5px, transparent 10px);
            opacity: 0.5;
        }

        .world-btn {
            width: 60px; height: 60px;
            border-radius: 12px;
            border: 4px solid #fff;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }
        .world-btn:hover { transform: translateY(-5px) scale(1.1); }
        .world-btn.active { 
            transform: scale(1.2) translateY(-10px); 
            border-color: var(--c-block);
            box-shadow: 0 10px 20px rgba(255,255,255,0.4);
            z-index: 2;
        }
        
        .w-grass { background: linear-gradient(135deg, #85e04c, #4CBB17); }
        .w-ice { background: linear-gradient(135deg, #a3f7ff, #5bc0de); }
        .w-fire { background: linear-gradient(135deg, #ff9f43, #c0392b); }
        .w-sky { background: linear-gradient(135deg, #74b9ff, #0984e3); }

        /* Controls (Signpost) */
        .controls-sign {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: rotate(3deg);
        }
        
        .sign-post {
            width: 12px; height: 40px;
            background: #8d6e63;
            border: 2px solid #5d4037;
            margin-top: -5px;
            border-radius: 0 0 4px 4px;
        }

        .controls-hud {
            background: #8d6e63;
            border: 4px solid #5d4037;
            border-radius: 10px 10px 0 0;
            padding: 12px 20px;
            display: flex;
            gap: 20px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.2);
            position: relative;
        }
        /* Sign Nails */
        .controls-hud::before, .controls-hud::after {
            content: ''; position: absolute; top: 8px; width: 8px; height: 8px;
            background: #3e2723; border-radius: 50%;
        }
        .controls-hud::before { left: 8px; }
        .controls-hud::after { right: 8px; }

        .key-group { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .keys-row { display: flex; gap: 5px; }
        .key {
            background: #eee; color: #333; padding: 4px 10px; border-radius: 4px;
            font-family: monospace; font-weight: 900; font-size: 0.9rem;
            box-shadow: 0 3px 0 #999; border-bottom: 2px solid #ccc;
        }
        .key:active { transform: translateY(2px); box-shadow: 0 1px 0 #999; }
        .ctrl-label { font-size: 0.7rem; color: #efebe9; font-weight: 700; letter-spacing: 1px; text-shadow: 1px 1px 0 #3e2723; }

        /* --- START BUTTON (Diegetic Door) --- */
        .start-container {
            position: absolute;
            bottom: 40px;
            right: 15%;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
            z-index: 30;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .start-container:hover { transform: scale(1.05); }
        .start-container:active { transform: scale(0.95); }

        .start-door-frame {
            width: 160px;
            height: 240px;
            background: #2d3436;
            border-radius: 100px 100px 0 0;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #636e72;
        }

        .start-door-inner {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0984e3, #74b9ff);
            border-radius: 80px 80px 0 0;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: doorGlow 3s infinite ease-in-out;
        }

        @keyframes doorGlow {
            0%, 100% { box-shadow: inset 0 0 20px rgba(255,255,255,0.5); }
            50% { box-shadow: inset 0 0 40px rgba(255,255,255,0.8); }
        }

        .start-arrow {
            width: 40px; height: 40px;
            background: #fff;
            clip-path: polygon(0% 0%, 100% 50%, 0% 100%);
            margin-left: 5px;
            animation: arrowPulse 1s infinite;
        }

        @keyframes arrowPulse {
            0%, 100% { transform: translateX(0); opacity: 1; }
            50% { transform: translateX(5px); opacity: 0.8; }
        }

        .start-label {
            margin-top: 15px;
            font-family: 'Arial Black', Impact, sans-serif;
            color: #fff;
            font-size: 1.5rem;
            text-shadow: 0 4px 0 #000;
            letter-spacing: 2px;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 20px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .game-title { font-size: 3.5rem; }
            .title-line-1 { font-size: 2rem; }
            .o-bounce { width: 40px; height: 40px; }
            .ui-layer { padding: 20px; }
            .bottom-ui { flex-direction: column-reverse; align-items: center; gap: 40px; }
            .controls-sign, .world-map { transform: rotate(0); }
            .hud-bar { display: none; }
            .start-container { right: 50%; transform: translateX(50%); bottom: 20px; }
            .start-container:hover { transform: translateX(50%) scale(1.05); }
        }

    </style>
</head>
<body>

    <div id="game-screen">
        
        <!-- Layer 1: Clouds -->
        <div class="layer" id="bg-clouds">
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="cloud c3"></div>
        </div>

        <!-- Layer 2: Hills -->
        <div class="layer" id="bg-hills">
            <div class="hills-container">
                <div class="hill h1"></div>
                <div class="hill h2"></div>
            </div>
        </div>

        <!-- Layer 3: Level Canvas -->
        <canvas id="level-canvas"></canvas>

        <!-- Layer 4: Hero -->
        <div id="hero-container">
            <svg class="hero-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="2" result="blur"/>
                        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                    </filter>
                </defs>
                <!-- Body -->
                <circle cx="50" cy="55" r="38" fill="#FF4757" stroke="#C41E3A" stroke-width="4" />
                <!-- Shine -->
                <path d="M28 35 Q 50 18 72 35" stroke="rgba(255,255,255,0.6)" stroke-width="5" fill="none" stroke-linecap="round" />
                <!-- Face -->
                <g class="face">
                    <circle cx="38" cy="50" r="7" fill="black" class="eye" />
                    <circle cx="62" cy="50" r="7" fill="black" class="eye" />
                    <circle cx="41" cy="47" r="3" fill="white" class="eye" />
                    <circle cx="65" cy="47" r="3" fill="white" class="eye" />
                    <path d="M38 68 Q 50 78 62 68" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round" />
                </g>
                <!-- Hat -->
                <path d="M20 25 L 50 5 L 80 25 Z" fill="#FFD700" stroke="#E67E22" stroke-width="4" stroke-linejoin="round" />
                <rect x="15" y="22" width="70" height="8" rx="4" fill="#E67E22" stroke="#d35400" stroke-width="2"/>
            </svg>
        </div>

        <!-- UI Layer -->
        <div class="ui-layer">
            <header>
                <div class="game-title">
                    <span class="title-line-1">SUPER</span>
                    <span class="title-line-2">B<span class="o-bounce"></span>UNCE</span>
                </div>
                
                <div class="hud-bar">
                    <div class="hud-panel">
                        <div class="hud-icon icon-coin">$</div>
                        <div class="hud-val">124</div>
                    </div>
                    <div class="hud-panel">
                        <div class="hud-icon icon-star">★</div>
                        <div class="hud-val">99k</div>
                    </div>
                </div>
            </header>

            <div class="bottom-ui">
                <!-- World Selector -->
                <div class="world-map">
                    <div class="world-btn w-grass active" data-theme="grass" title="Green Hills"></div>
                    <div class="path-connector"></div>
                    <div class="world-btn w-ice" data-theme="ice" title="Ice Peaks"></div>
                    <div class="path-connector"></div>
                    <div class="world-btn w-fire" data-theme="fire" title="Lava Lands"></div>
                    <div class="path-connector"></div>
                    <div class="world-btn w-sky" data-theme="sky" title="Sky High"></div>
                </div>

                <!-- Controls (Signpost) -->
                <div class="controls-sign">
                    <div class="controls-hud">
                        <div class="key-group">
                            <div class="keys-row">
                                <span class="key">←</span>
                                <span class="key">→</span>
                            </div>
                            <span class="ctrl-label">MOVE</span>
                        </div>
                        <div class="key-group">
                            <span class="key" style="width: 60px;">SPACE</span>
                            <span class="ctrl-label">JUMP</span>
                        </div>
                    </div>
                    <div class="sign-post"></div>
                </div>
            </div>
        </div>

        <!-- Start Button (Diegetic Door) -->
        <div class="start-container" id="start-btn">
            <div class="start-door-frame">
                <div class="start-door-inner">
                    <div class="start-arrow"></div>
                </div>
            </div>
            <div class="start-label">START ADVENTURE</div>
        </div>

    </div>

    <script>
        // --- CONFIGURATION ---
        const themes = {
            grass: { 
                sky: ['#4facfe', '#00f2fe'], 
                hillBg: '#85e04c', hillFg: '#57c91b',
                ground: '#65c238', groundDark: '#4da025', 
                dirt: '#e67e22', dirtDark: '#d35400',
                block: '#f1c40f', blockDark: '#f39c12'
            },
            ice: { 
                sky: ['#83a4d4', '#b6fbff'], 
                hillBg: '#a3f7ff', hillFg: '#74b9ff',
                ground: '#dfe6e9', groundDark: '#b2bec3', 
                dirt: '#b2bec3', dirtDark: '#636e72',
                block: '#74b9ff', blockDark: '#0984e3'
            },
            fire: { 
                sky: ['#2c3e50', '#fd746c'], 
                hillBg: '#57606f', hillFg: '#2f3542',
                ground: '#333333', groundDark: '#1e1e1e', 
                dirt: '#2c2c2c', dirtDark: '#1a1a1a',
                block: '#e17055', blockDark: '#d63031'
            },
            sky: {
                sky: ['#2980b9', '#6dd5fa'], 
                hillBg: '#f1c40f', hillFg: '#f39c12',
                ground: '#f1c40f', groundDark: '#f39c12', 
                dirt: '#f1c40f', dirtDark: '#d35400',
                block: '#fab1a0', blockDark: '#e17055'
            }
        };

        let currentTheme = themes.grass;

        // --- CANVAS DRAWING ---
        const canvas = document.getElementById('level-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
            drawLevel();
        }
        window.addEventListener('resize', resize);

        // Drawing Helpers
        function drawRect(x, y, w, h, color, shadowColor) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
            if(shadowColor) {
                ctx.fillStyle = shadowColor;
                ctx.fillRect(x, y + h - 8, w, 8); // Bottom shadow
                ctx.fillRect(x + w - 8, y, 8, h); // Right shadow
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.fillRect(x, y, w, 8); // Top highlight
                ctx.fillRect(x, y, 8, h); // Left highlight
            }
        }

        function drawMysteryBlock(x, y, size, color, darkColor) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, size, size);
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.fillRect(x, y, size, 8); ctx.fillRect(x, y, 8, size);
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(x, y+size-8, size, 8); ctx.fillRect(x+size-8, y, 8, size);
            
            // Screws
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            const corners = [[10,10], [size-10,10], [10,size-10], [size-10,size-10]];
            corners.forEach(([cx, cy]) => {
                ctx.beginPath(); ctx.arc(x+cx, y+cy, 4, 0, Math.PI*2); ctx.fill();
            });

            ctx.fillStyle = darkColor;
            ctx.font = `900 ${size*0.6}px Arial`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('?', x + size/2, y + size/2 + 4);
        }

        function drawPipe(x, y, w, h, color) {
            const headH = 60;
            ctx.fillStyle = color;
            ctx.fillRect(x + 15, y + headH, w - 30, h - headH); // Body
            ctx.fillRect(x, y, w, headH); // Head
            
            // Highlights
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(x+8, y, 12, headH);
            ctx.fillRect(x+20, y+headH, 8, h-headH);
            
            // Shadows
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(x+w-15, y, 15, headH);
            ctx.fillRect(x+w-15, y+headH, 15, h-headH);

            // Outline
            ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 3;
            ctx.strokeRect(x, y, w, headH);
            ctx.strokeRect(x+15, y+headH, w-30, h-headH);
        }

        function drawFlag(x, y, h) {
            ctx.fillStyle = '#bdc3c7'; ctx.fillRect(x, y, 12, h); // Pole
            ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 2; ctx.strokeRect(x, y, 12, h);
            
            ctx.beginPath(); ctx.arc(x+6, y, 12, 0, Math.PI*2);
            ctx.fillStyle = '#f1c40f'; ctx.fill(); ctx.stroke();

            // Flag Cloth
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.moveTo(x+12, y+20);
            ctx.lineTo(x+80, y+45);
            ctx.lineTo(x+12, y+90);
            ctx.fill(); ctx.stroke();
        }

        function drawEnemy(x, y) {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.ellipse(x+30, y+45, 25, 8, 0, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = '#8e44ad';
            ctx.beginPath();
            ctx.arc(x+30, y+25, 30, Math.PI, 0); 
            ctx.lineTo(x+60, y+45); ctx.lineTo(x, y+45); ctx.fill();
            
            ctx.fillStyle = '#2c3e50';
            ctx.beginPath(); ctx.ellipse(x+10, y+45, 10, 6, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(x+50, y+45, 10, 6, 0, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(x+18, y+30, 8, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+42, y+30, 8, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(x+20, y+30, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+40, y+30, 3, 0, Math.PI*2); ctx.fill();
            
            ctx.strokeStyle = 'black'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(x+10, y+22); ctx.lineTo(x+25, y+26); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x+50, y+22); ctx.lineTo(x+35, y+26); ctx.stroke();
        }

        function drawCoin(x, y, offset) {
            const wobble = Math.sin(Date.now() / 200 + offset) * 3;
            const scale = (Math.sin(Date.now() / 300 + offset) + 1) / 2; 
            
            ctx.save();
            ctx.translate(x, y + wobble);
            ctx.scale(scale, 1);
            
            ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 15;
            ctx.fillStyle = '#FFD700';
            ctx.beginPath(); ctx.ellipse(0, 0, 14, 18, 0, 0, Math.PI*2); ctx.fill();
            
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#DAA520'; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = '#FFF';
            ctx.beginPath(); ctx.ellipse(-4, -4, 3, 6, 0, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }

        function drawLevel() {
            const t = currentTheme;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const groundY = canvas.height - 100;

            // 1. Ground
            drawRect(0, groundY, canvas.width, 100, t.ground, t.groundDark);
            drawRect(0, groundY + 30, canvas.width, 70, t.dirt, t.dirtDark);
            
            // Dirt details
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for(let i=0; i<canvas.width; i+=100) {
                ctx.beginPath(); ctx.arc(i+50, groundY+60, 8, 0, Math.PI*2); ctx.fill();
            }

            // 2. Platforms
            drawMysteryBlock(canvas.width * 0.25, groundY - 150, 65, t.block, t.blockDark);
            
            for(let i=0; i<3; i++) {
                drawRect(canvas.width * 0.45 + (i*75), groundY - 150, 70, 30, t.dirt, t.dirtDark);
                ctx.fillStyle = t.ground;
                ctx.fillRect(canvas.width * 0.45 + (i*75), groundY - 150, 70, 10);
            }

            drawRect(canvas.width * 0.75, groundY - 250, 200, 30, t.dirt, t.dirtDark);
            ctx.fillStyle = t.ground;
            ctx.fillRect(canvas.width * 0.75, groundY - 250, 200, 10);

            // 3. Pipe
            drawPipe(canvas.width * 0.65, groundY - 80, 90, 80, t.groundDark);

            // 4. Flag (Distant Goal)
            drawFlag(canvas.width * 0.88, groundY - 300, 300);

            // 5. Coins
            drawCoin(canvas.width * 0.25 + 32, groundY - 190, 0);
            drawCoin(canvas.width * 0.75 + 50, groundY - 290, 1);
            drawCoin(canvas.width * 0.75 + 100, groundY - 290, 2);
            drawCoin(canvas.width * 0.75 + 150, groundY - 290, 3);

            // 6. Enemy
            drawEnemy(canvas.width * 0.55, groundY - 50);

            // 7. Bushes
            const drawBush = (x, y, scale, color) => {
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(x, y, 40 * scale, 0, Math.PI * 2);
                ctx.arc(x + 40*scale, y, 50 * scale, 0, Math.PI * 2);
                ctx.arc(x + 80*scale, y, 40 * scale, 0, Math.PI * 2);
                ctx.fill();
            };
            drawBush(canvas.width * 0.15, groundY, 1.2, t.groundDark);
            drawBush(canvas.width * 0.8, groundY, 0.9, t.groundDark);
        }

        // --- INTERACTIVITY ---
        const hero = document.getElementById('hero-container');
        const screen = document.getElementById('game-screen');
        const bgClouds = document.getElementById('bg-clouds');
        const bgHills = document.getElementById('bg-hills');

        screen.addEventListener('mousemove', (e) => {
            const rect = screen.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            let percent = (mouseX / rect.width) * 100;
            
            // Hero movement (clamped)
            hero.style.left = Math.max(10, Math.min(percent, 85)) + '%';

            // Parallax Backgrounds
            const moveX = (mouseX - rect.width/2) * 0.05;
            bgClouds.style.transform = `translateX(${moveX}px)`;
            bgHills.style.transform = `translateX(${moveX * 2}px)`;
        });

        // World Selector Logic
        const worlds = document.querySelectorAll('.world-btn');
        const root = document.documentElement;
        
        worlds.forEach(btn => {
            btn.addEventListener('click', () => {
                worlds.forEach(w => w.classList.remove('active'));
                btn.classList.add('active');

                const themeName = btn.dataset.theme;
                currentTheme = themes[themeName];
                
                root.style.setProperty('--c-sky-top', currentTheme.sky[0]);
                root.style.setProperty('--c-sky-bot', currentTheme.sky[1]);
                root.style.setProperty('--c-hill-bg', currentTheme.hillBg);
                root.style.setProperty('--c-hill-fg', currentTheme.hillFg);
                root.style.setProperty('--c-ground', currentTheme.ground);
                root.style.setProperty('--c-ground-dark', currentTheme.groundDark);
                
                drawLevel();
            });
        });

        function animate() {
            drawLevel();
            requestAnimationFrame(animate);
        }

        resize();
        animate();

    </script>
</body>
</html>
