<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce Dash - Adventure Awaits</title>
    <style>
        :root {
            /* Palette */
            --c-sky-top: #3A9BDC;
            --c-sky-bot: #8FDBEF;
            --c-grass: #4CBB17;
            --c-grass-dark: #358A0D;
            --c-dirt: #9C6036;
            --c-dirt-dark: #704324;
            --c-block: #E67E22;
            --c-block-dark: #D35400;
            --c-coin: #FFD700;
            --c-hero: #FF4757;
            --c-ui-dark: rgba(20, 20, 30, 0.85);
            --c-text: #ffffff;
            
            /* Typography */
            --font-stack: 'Segoe UI', 'Helvetica Neue', sans-serif;
            --font-display: 'Arial Black', 'Impact', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body {
            background: #111;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-stack);
            overflow: hidden;
        }

        /* --- GAME SCREEN CONTAINER --- */
        #game-screen {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1600px;
            max-height: 900px;
            background: linear-gradient(to bottom, var(--c-sky-top), var(--c-sky-bot));
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0,0,0,0.6);
            transition: background 0.5s ease;
        }

        /* --- PARALLAX SCENE LAYERS --- */
        .scene-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Clouds */
        .cloud {
            position: absolute;
            background: #fff;
            border-radius: 50px;
            opacity: 0.9;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            animation: floatCloud linear infinite;
        }
        .cloud::after, .cloud::before {
            content: ''; position: absolute; background: inherit; border-radius: 50%;
        }
        
        /* Cloud Variations */
        .c1 { width: 140px; height: 50px; top: 12%; left: -150px; animation-duration: 22s; z-index: 1; }
        .c1::after { width: 60px; height: 60px; top: -30px; left: 20px; }
        .c1::before { width: 50px; height: 50px; top: -20px; left: 70px; }

        .c2 { width: 100px; height: 40px; top: 22%; left: -100px; animation-duration: 30s; animation-delay: -10s; opacity: 0.7; z-index: 0; }
        .c2::after { width: 40px; height: 40px; top: -20px; left: 15px; }

        .c3 { width: 180px; height: 60px; top: 8%; left: -200px; animation-duration: 28s; animation-delay: -5s; z-index: 2; }
        .c3::after { width: 70px; height: 70px; top: -35px; left: 30px; }
        .c3::before { width: 60px; height: 60px; top: -25px; left: 90px; }

        /* Mountains (Background) */
        .mountain {
            position: absolute;
            bottom: 160px; /* Sits behind ground */
            width: 0; height: 0;
            border-left: 200px solid transparent;
            border-right: 200px solid transparent;
            border-bottom: 350px solid rgba(255,255,255,0.3);
            z-index: 0;
        }
        .m1 { left: -5%; border-bottom-color: rgba(255,255,255,0.4); }
        .m2 { left: 20%; border-bottom-color: rgba(255,255,255,0.2); transform: scale(1.5); bottom: 120px; z-index: 0; }
        .m3 { right: -10%; border-bottom-color: rgba(255,255,255,0.4); transform: scale(1.2); }

        /* --- LEVEL CANVAS (Midground & Foreground) --- */
        #level-canvas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 350px;
            z-index: 5;
        }

        /* --- HERO CHARACTER --- */
        #hero-container {
            position: absolute;
            bottom: 160px; /* Ground Level */
            left: 20%;
            z-index: 10;
            width: 90px;
            height: 90px;
            transition: left 0.1s linear;
            /* Dynamic shadow */
            filter: drop-shadow(0px 10px 5px rgba(0,0,0,0.3));
        }

        /* --- UI OVERLAY --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 60px;
            pointer-events: none;
        }

        /* Header: Title & Stats */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .game-title {
            font-family: var(--font-display);
            font-size: 5rem;
            color: #fff;
            text-transform: uppercase;
            line-height: 0.85;
            position: relative;
            transform: skew(-5deg) rotate(-2deg);
            /* 3D Layered Text Effect */
            text-shadow: 
                0 1px 0 #ccc,
                0 2px 0 #c9c9c9,
                0 3px 0 #bbb,
                0 4px 0 #b9b9b9,
                0 5px 0 #aaa,
                0 6px 1px rgba(0,0,0,.1),
                0 0 5px rgba(0,0,0,.1),
                0 1px 3px rgba(0,0,0,.3),
                0 3px 5px rgba(0,0,0,.2),
                0 5px 10px rgba(0,0,0,.25),
                0 10px 10px rgba(0,0,0,.2),
                0 20px 20px rgba(0,0,0,.15);
            margin-left: -10px; /* Visual anchor */
        }
        
        .game-title span {
            display: block;
            color: var(--c-hero);
            font-size: 6.5rem;
            text-shadow: 
                0 1px 0 #900,
                0 2px 0 #800,
                0 3px 0 #700,
                0 4px 0 #600,
                0 5px 0 #500,
                0 6px 1px rgba(0,0,0,.1),
                0 0 5px rgba(0,0,0,.1),
                0 1px 3px rgba(0,0,0,.3),
                0 3px 5px rgba(0,0,0,.2),
                0 5px 10px rgba(0,0,0,.25),
                0 10px 10px rgba(0,0,0,.2),
                0 20px 20px rgba(0,0,0,.15);
        }

        .stats-box {
            background: var(--c-ui-dark);
            border-radius: 12px;
            padding: 15px 25px;
            color: white;
            display: flex;
            gap: 20px;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: auto;
            transform: skew(-5deg);
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 60px;
        }
        .stat-label {
            font-size: 0.75rem;
            font-weight: 800;
            opacity: 0.7;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .stat-value {
            font-family: monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--c-coin);
        }
        .coin-icon {
            width: 24px; height: 24px;
            background: radial-gradient(circle at 30% 30%, #fff, var(--c-coin));
            border-radius: 50%;
            border: 2px solid #B8860B;
            box-shadow: 0 0 10px var(--c-coin);
        }

        /* Bottom Section */
        .bottom-controls {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            pointer-events: none;
        }

        /* World Selector (Left Bottom) */
        .world-selector-group {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .world-header {
            font-family: var(--font-display);
            color: #fff;
            font-size: 1.2rem;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
            margin-left: 5px;
        }

        .world-selector {
            background: var(--c-ui-dark);
            padding: 8px;
            border-radius: 50px;
            display: flex;
            gap: 12px;
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .world-btn {
            width: 48px; height: 48px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            position: relative;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: rgba(0,0,0,0.6);
            font-size: 0.8rem;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        .world-btn:hover { transform: translateY(-3px) scale(1.05); }
        .world-btn.active { 
            border-color: #fff; 
            transform: scale(1.15); 
            box-shadow: 0 0 15px rgba(255,255,255,0.4);
            z-index: 2;
        }

        /* World Patterns */
        .w-grass { background: radial-gradient(circle at 50% 50%, #85e04c, #4CBB17); }
        .w-ice { background: radial-gradient(circle at 50% 50%, #a3f7ff, #5bc0de); }
        .w-fire { background: radial-gradient(circle at 50% 50%, #ff9f43, #c0392b); }
        .w-sky { background: radial-gradient(circle at 50% 50%, #74b9ff, #0984e3); }

        /* Controls Guide (Right Bottom) */
        .controls-guide {
            background: var(--c-ui-dark);
            padding: 15px 20px;
            border-radius: 12px;
            color: #ddd;
            pointer-events: auto;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
        }
        .key-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin: 6px 0;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .key {
            background: #fff;
            color: #333;
            padding: 6px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: 900;
            box-shadow: 0 3px 0 #999, 0 4px 5px rgba(0,0,0,0.2);
            font-size: 0.9rem;
            min-width: 30px;
            text-align: center;
        }

        /* Start Button */
        .start-btn-container {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            z-index: 30;
        }
        
        .start-btn {
            background: var(--c-hero);
            color: white;
            border: none;
            padding: 18px 70px;
            font-family: var(--font-display);
            font-size: 2rem;
            text-transform: uppercase;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 
                0 8px 0 #b33939,
                0 15px 30px rgba(0,0,0,0.4),
                inset 0 2px 0 rgba(255,255,255,0.3);
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
            text-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }
        
        .start-btn:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 12px 0 #b33939,
                0 25px 40px rgba(0,0,0,0.4),
                inset 0 2px 0 rgba(255,255,255,0.3);
            filter: brightness(1.1);
        }
        
        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 
                0 0 0 #b33939,
                0 5px 10px rgba(0,0,0,0.4),
                inset 0 2px 0 rgba(255,255,255,0.3);
        }

        /* Shine sweep */
        .start-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-20deg);
            animation: shine 4s infinite;
        }

        /* --- ANIMATIONS --- */
        @keyframes floatCloud {
            0% { transform: translateX(-200px); }
            100% { transform: translateX(110vw); }
        }
        @keyframes shine {
            0%, 80% { left: -100%; }
            100% { left: 200%; }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes blink {
            0%, 95%, 100% { transform: scaleY(1); }
            97% { transform: scaleY(0.1); }
        }

        /* SVG Hero Styles */
        .hero-svg {
            width: 100%;
            height: 100%;
            /* The bounce is handled by JS/CSS transform on container for smoother parallax interaction */
        }
        .eye { transform-origin: center; animation: blink 4s infinite; }

    </style>
</head>
<body>

    <div id="game-screen">
        
        <!-- Background Layers (Parallax) -->
        <div class="scene-layer">
            <div class="mountain m1"></div>
            <div class="mountain m2"></div>
            <div class="mountain m3"></div>
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="cloud c3"></div>
        </div>

        <!-- The Level Preview (Canvas) -->
        <canvas id="level-canvas"></canvas>

        <!-- Hero Character -->
        <div id="hero-container">
            <svg class="hero-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Drop shadow handled by CSS on container -->
                <defs>
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="2" result="blur"/>
                        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                    </filter>
                </defs>
                <!-- Body -->
                <circle cx="50" cy="50" r="40" fill="#FF4757" stroke="#C41E3A" stroke-width="3" />
                <!-- Shine -->
                <path d="M25 35 Q 50 15 75 35" stroke="rgba(255,255,255,0.4)" stroke-width="4" fill="none" stroke-linecap="round" />
                <!-- Face -->
                <g class="face">
                    <!-- Eyes -->
                    <circle cx="38" cy="45" r="6" fill="black" class="eye" />
                    <circle cx="62" cy="45" r="6" fill="black" class="eye" />
                    <!-- Eye Highlights -->
                    <circle cx="40" cy="43" r="2" fill="white" class="eye" />
                    <circle cx="64" cy="43" r="2" fill="white" class="eye" />
                    <!-- Mouth -->
                    <path d="M35 60 Q 50 70 65 60" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round" />
                    <!-- Cheeks -->
                    <ellipse cx="28" cy="55" rx="5" ry="3" fill="rgba(0,0,0,0.1)" />
                    <ellipse cx="72" cy="55" rx="5" ry="3" fill="rgba(0,0,0,0.1)" />
                </g>
                <!-- Hat -->
                <path d="M25 25 L 50 5 L 75 25 Z" fill="#FFD700" stroke="#E67E22" stroke-width="3" stroke-linejoin="round" />
                <rect x="20" y="22" width="60" height="6" rx="3" fill="#E67E22" />
            </svg>
        </div>

        <!-- UI Layer -->
        <div class="ui-layer">
            <header>
                <div class="game-title">
                    Bounce
                    <span>Dash</span>
                </div>
                <div class="stats-box">
                    <div class="stat-item">
                        <span class="stat-label">COINS</span>
                        <div style="display:flex; align-items:center; gap:5px;">
                            <div class="coin-icon"></div>
                            <span class="stat-value">042</span>
                        </div>
                    </div>
                    <div class="stat-item" style="border-left: 1px solid rgba(255,255,255,0.2); padding-left: 20px;">
                        <span class="stat-label">SCORE</span>
                        <span class="stat-value" style="color: #fff;">12,500</span>
                    </div>
                </div>
            </header>

            <div class="bottom-controls">
                <div class="world-selector-group">
                    <div class="world-header">WORLD SELECT</div>
                    <div class="world-selector">
                        <div class="world-btn w-grass active" data-theme="grass" title="Green Hills">1-1</div>
                        <div class="world-btn w-ice" data-theme="ice" title="Ice Peaks">2-1</div>
                        <div class="world-btn w-fire" data-theme="fire" title="Lava Lands">3-1</div>
                        <div class="world-btn w-sky" data-theme="sky" title="Sky High">4-1</div>
                    </div>
                </div>

                <div class="controls-guide">
                    <div class="key-row"><span>Move</span> <span class="key">←</span> <span class="key">→</span></div>
                    <div class="key-row"><span>Jump</span> <span class="key" style="width: 80px;">SPACE</span></div>
                    <div class="key-row"><span>Attack</span> <span class="key">Z</span></div>
                </div>
            </div>
        </div>

        <div class="start-btn-container">
            <button class="start-btn">Start Adventure</button>
        </div>

    </div>

    <script>
        // --- CONFIGURATION ---
        const themes = {
            grass: { 
                sky: ['#3A9BDC', '#8FDBEF'], 
                ground: '#4CBB17', groundDark: '#358A0D', 
                dirt: '#9C6036', dirtDark: '#704324',
                block: '#E67E22', blockDark: '#D35400'
            },
            ice: { 
                sky: ['#83a4d4', '#b6fbff'], 
                ground: '#a3f7ff', groundDark: '#74b9ff', 
                dirt: '#dfe6e9', dirtDark: '#b2bec3',
                block: '#74b9ff', blockDark: '#0984e3'
            },
            fire: { 
                sky: ['#2c3e50', '#fd746c'], 
                ground: '#555555', groundDark: '#333333', 
                dirt: '#2c2c2c', dirtDark: '#1a1a1a',
                block: '#e17055', blockDark: '#d63031'
            },
            sky: {
                sky: ['#2980b9', '#6dd5fa'], 
                ground: '#f1c40f', groundDark: '#f39c12', 
                dirt: '#f1c40f', dirtDark: '#d35400',
                block: '#fab1a0', blockDark: '#e17055'
            }
        };

        let currentTheme = themes.grass;

        // --- CANVAS DRAWING ---
        const canvas = document.getElementById('level-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
            drawLevel();
        }
        window.addEventListener('resize', resize);

        // Drawing Helpers
        function drawRect(x, y, w, h, color, shadowColor) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
            if(shadowColor) {
                ctx.fillStyle = shadowColor;
                ctx.fillRect(x, y + h - 4, w, 4); // Bottom shadow
                ctx.fillRect(x + w - 4, y, 4, h); // Right shadow
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(x, y, w, 4); // Top highlight
                ctx.fillRect(x, y, 4, h); // Left highlight
            }
        }

        function drawMysteryBlock(x, y, size, color, darkColor) {
            // Base
            ctx.fillStyle = color;
            ctx.fillRect(x, y, size, size);
            
            // Highlights/Shadows
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(x, y, size, 4);
            ctx.fillRect(x, y, 4, size);
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(x, y+size-4, size, 4);
            ctx.fillRect(x+size-4, y, 4, size);

            // Screws
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.arc(x+6, y+6, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+size-6, y+6, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+6, y+size-6, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+size-6, y+size-6, 2, 0, Math.PI*2); ctx.fill();

            // Question Mark
            ctx.fillStyle = darkColor;
            ctx.font = `900 ${size*0.6}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('?', x + size/2, y + size/2 + 2);
        }

        function drawPipe(x, y, w, h, color) {
            const headH = 40;
            // Body
            ctx.fillStyle = color;
            ctx.fillRect(x + 10, y + headH, w - 20, h - headH);
            // Head
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, headH);
            
            // Highlights
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(x+5, y, 8, headH); // Head shine
            ctx.fillRect(x+15, y+headH, 4, h-headH); // Body shine
            
            // Shadows
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(x+w-10, y, 10, headH);
            ctx.fillRect(x+w-10, y+headH, 10, h-headH);

            // Outlines
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, w, headH);
            ctx.strokeRect(x+10, y+headH, w-20, h-headH);
        }

        function drawFlag(x, y, h) {
            // Pole
            ctx.fillStyle = '#bdc3c7';
            ctx.fillRect(x, y, 8, h);
            ctx.strokeStyle = '#7f8c8d';
            ctx.strokeRect(x, y, 8, h);
            
            // Ball
            ctx.beginPath();
            ctx.arc(x+4, y, 8, 0, Math.PI*2);
            ctx.fillStyle = '#f1c40f';
            ctx.fill();
            ctx.stroke();

            // Flag
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.moveTo(x+8, y+10);
            ctx.lineTo(x+60, y+30);
            ctx.lineTo(x+8, y+50);
            ctx.fill();
            ctx.stroke();
        }

        function drawEnemy(x, y) {
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(x+25, y+40, 20, 6, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Body
            ctx.fillStyle = '#8e44ad';
            ctx.beginPath();
            ctx.arc(x+25, y+20, 25, Math.PI, 0); // Dome
            ctx.lineTo(x+50, y+40);
            ctx.lineTo(x, y+40);
            ctx.fill();
            
            // Feet
            ctx.fillStyle = '#2c3e50';
            ctx.beginPath(); ctx.ellipse(x+10, y+40, 8, 5, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(x+40, y+40, 8, 5, 0, 0, Math.PI*2); ctx.fill();

            // Face
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(x+15, y+25, 6, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+35, y+25, 6, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(x+17, y+25, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+33, y+25, 2, 0, Math.PI*2); ctx.fill();
            
            // Eyebrows
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(x+10, y+18); ctx.lineTo(x+20, y+22); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x+40, y+18); ctx.lineTo(x+30, y+22); ctx.stroke();
        }

        function drawCoin(x, y, offset) {
            // Animate slightly
            const wobble = Math.sin(Date.now() / 200 + offset) * 2;
            
            ctx.save();
            ctx.translate(x, y);
            
            // Glow
            ctx.shadowColor = '#FFD700';
            ctx.shadowBlur = 10;
            
            // Coin Body
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.ellipse(0, 0, 10, 14, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Inner
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#DAA520';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.ellipse(-3, -3, 2, 5, 0, 0, Math.PI*2);
            ctx.fill();
            
            ctx.restore();
        }

        function drawLevel() {
            const t = currentTheme;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const groundY = canvas.height - 100;

            // 1. Ground
            drawRect(0, groundY, canvas.width, 100, t.ground, t.groundDark);
            
            // Dirt layer
            drawRect(0, groundY + 20, canvas.width, 80, t.dirt, t.dirtDark);
            
            // Dirt details
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for(let i=0; i<canvas.width; i+=60) {
                ctx.beginPath(); ctx.arc(i+30, groundY+60, 4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(i+10, groundY+80, 4, 0, Math.PI*2); ctx.fill();
            }

            // 2. Platforms
            // Mystery Block
            drawMysteryBlock(canvas.width * 0.2, groundY - 130, 50, t.block, t.blockDark);
            
            // Brick Row
            for(let i=0; i<3; i++) {
                drawRect(canvas.width * 0.4 + (i*60), groundY - 130, 55, 20, t.dirt, t.dirtDark);
                // Grass top
                ctx.fillStyle = t.ground;
                ctx.fillRect(canvas.width * 0.4 + (i*60), groundY - 130, 55, 6);
            }

            // High Platform
            drawRect(canvas.width * 0.7, groundY - 220, 160, 20, t.dirt, t.dirtDark);
            ctx.fillStyle = t.ground;
            ctx.fillRect(canvas.width * 0.7, groundY - 220, 160, 6);

            // 3. Pipe
            drawPipe(canvas.width * 0.6, groundY - 60, 70, 60, t.groundDark);

            // 4. Flag
            drawFlag(canvas.width * 0.85, groundY - 260, 260);

            // 5. Coins
            drawCoin(canvas.width * 0.2 + 25, groundY - 170, 0);
            drawCoin(canvas.width * 0.7 + 40, groundY - 260, 1);
            drawCoin(canvas.width * 0.7 + 70, groundY - 260, 2);
            drawCoin(canvas.width * 0.7 + 100, groundY - 260, 3);

            // 6. Enemy
            drawEnemy(canvas.width * 0.5, groundY - 40);

            // 7. Bushes
            const drawBush = (x, y, scale, color) => {
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(x, y, 30 * scale, 0, Math.PI * 2);
                ctx.arc(x + 25*scale, y, 40 * scale, 0, Math.PI * 2);
                ctx.arc(x + 50*scale, y, 30 * scale, 0, Math.PI * 2);
                ctx.fill();
            };
            drawBush(canvas.width * 0.15, groundY, 1, t.groundDark);
            drawBush(canvas.width * 0.75, groundY, 0.8, t.groundDark);
        }

        // --- INTERACTIVITY ---
        
        // 1. Hero Movement (Parallax-ish)
        const hero = document.getElementById('hero-container');
        const screen = document.getElementById('game-screen');
        let mouseX = 0;

        screen.addEventListener('mousemove', (e) => {
            const rect = screen.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            
            // Map mouse X to percentage (clamped)
            let percent = (mouseX / rect.width) * 100;
            if(percent > 40) percent = 40;
            if(percent < 10) percent = 10;
            
            // Smooth movement could be done with requestAnimationFrame, 
            // but direct style update is snappy for UI.
            hero.style.left = percent + '%';
            
            // Bobbing effect
            const bounce = Math.abs(Math.sin(Date.now() / 300)) * 15;
            hero.style.transform = `translateY(-${bounce}px)`;
        });

        // 2. World Selector Logic
        const worlds = document.querySelectorAll('.world-btn');
        const root = document.documentElement;
        
        worlds.forEach(btn => {
            btn.addEventListener('click', () => {
                worlds.forEach(w => w.classList.remove('active'));
                btn.classList.add('active');

                const themeName = btn.dataset.theme;
                currentTheme = themes[themeName];
                
                // Update CSS Variables
                root.style.setProperty('--c-sky-top', currentTheme.sky[0]);
                root.style.setProperty('--c-sky-bot', currentTheme.sky[1]);
                
                // Redraw Canvas
                drawLevel();
            });
        });

        // 3. Animation Loop for Coins
        function animate() {
            // Only redraw canvas elements that move (coins)
            // For simplicity in this single file, we redraw the whole level 
            // but optimize by checking if we really need to. 
            // Here we just call drawLevel for the coin animation.
            drawLevel();
            requestAnimationFrame(animate);
        }

        // Start
        resize();
        animate();

    </script>
</body>
</html>
