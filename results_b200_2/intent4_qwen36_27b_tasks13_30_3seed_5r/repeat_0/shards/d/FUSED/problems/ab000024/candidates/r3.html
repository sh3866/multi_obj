<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Modern Sanitary Design</title>
    <style>
        :root {
            --bg-wall: #F2F0EE;
            --bg-floor: #E8E5E1;
            --text-main: #111111;
            --text-muted: #666666;
            --accent: #2C3E50;
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-body: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-wall);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Sophisticated Background Context --- */
        .scene-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            display: flex;
            flex-direction: column;
        }

        .wall {
            flex: 1;
            background: 
                linear-gradient(to right, rgba(0,0,0,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            position: relative;
        }

        .wall::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.03));
            pointer-events: none;
        }

        .floor {
            height: 22vh;
            background: linear-gradient(to bottom, var(--bg-floor), #DCD9D5);
            position: relative;
            border-top: 1px solid rgba(0,0,0,0.05);
            perspective: 800px;
        }

        .floor-tile-grid {
            position: absolute;
            top: 0;
            left: -50%;
            width: 200%;
            height: 100%;
            background: 
                linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 100px 40px; /* Perspective trick */
            transform: rotateX(60deg);
            transform-origin: top center;
        }

        /* --- Header --- */
        header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: -0.03em;
            color: var(--text-main);
        }

        .menu span {
            margin-left: 2.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: color 0.2s;
        }

        .menu span:hover {
            color: var(--text-main);
        }

        /* --- Main Layout --- */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            position: relative;
        }

        /* Left: The Product Stage */
        .stage {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 5vh;
            position: relative;
        }

        .svg-wrapper {
            width: 85%;
            height: 90%;
            position: relative;
            /* The SVG has a drop shadow filter applied internally, 
               but we can add a subtle ambient occlusion here */
            filter: drop-shadow(0px 40px 60px rgba(0,0,0,0.15));
            transition: transform 0.2s ease-out;
        }

        /* Right: Typography & Details */
        .details {
            padding: 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 5rem;
            line-height: 0.85;
            font-weight: 300;
            letter-spacing: -0.04em;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        h1 span {
            font-weight: 700;
            display: block;
        }

        .description {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 360px;
            margin-bottom: 3rem;
            border-left: 2px solid var(--text-main);
            padding-left: 1.5rem;
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            margin-top: auto;
        }

        .data-point h4 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .data-point p {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* --- Interactive Elements --- */
        .interaction-hint {
            position: absolute;
            top: 35%; 
            left: 58%; /* Positioned near handle */
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .svg-wrapper:hover .interaction-hint {
            opacity: 1;
            animation: pulse 2s infinite;
        }

        .interaction-hint::before {
            content: '';
            width: 100%;
            height: 100%;
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 50%;
        }
        
        .interaction-hint::after {
            content: 'FLUSH';
            position: absolute;
            top: -25px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--text-main);
            background: white;
            padding: 2px 6px;
            border-radius: 2px;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 0.4; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* --- SVG Animation Classes --- */
        .water-surface {
            transition: transform 0.3s ease;
            transform-origin: 450px 450px;
        }

        .flush-anim .water-surface {
            animation: vortex 1s ease-in-out;
        }

        .water-swirl {
            opacity: 0;
            transform-origin: 450px 450px;
        }

        .flush-anim .water-swirl {
            animation: swirlSpin 1s ease-in-out;
        }

        .handle-lever {
            transform-origin: 0px 0px;
            transition: transform 0.1s ease-out;
        }

        .flush-anim .handle-lever {
            transform: rotate(-25deg);
            transition: transform 0.1s ease-out;
        }

        /* Return handle smoothly */
        .handle-return .handle-lever {
            transform: rotate(0deg);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes vortex {
            0% { transform: scale(1) translateY(0); }
            20% { transform: scale(0.95) translateY(5px); }
            100% { transform: scale(1) translateY(0); }
        }

        @keyframes swirlSpin {
            0% { opacity: 0; transform: scale(0.5) rotate(0deg); }
            30% { opacity: 0.6; }
            100% { opacity: 0; transform: scale(1.2) rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
                grid-template-rows: 1.2fr 1fr;
            }
            .details {
                padding: 2rem;
                justify-content: flex-start;
            }
            h1 { font-size: 3.5rem; }
            .data-grid { display: none; }
            .stage { padding-bottom: 0; align-items: center; }
            .svg-wrapper { width: 90%; height: 60%; }
            header { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- Contextual Background -->
    <div class="scene-container">
        <div class="wall"></div>
        <div class="floor">
            <div class="floor-tile-grid"></div>
        </div>
    </div>

    <header>
        <div class="logo">AURA</div>
        <nav class="menu">
            <span>Series</span>
            <span>Specs</span>
            <span>Order</span>
        </nav>
    </header>

    <main>
        <!-- The Stage -->
        <div class="stage">
            <div class="svg-wrapper" id="productSvg">
                
                <!-- 
                  REVISED VECTOR ILLUSTRATION 
                  - Realistic Floor Standing Toilet
                  - Complex Gradients for Glossy Ceramic
                  - Chrome Plumbing
                -->
                <svg viewBox="0 0 800 800" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <!-- 1. Ceramic Gradient: High gloss, main light top-left -->
                        <linearGradient id="ceramicGloss" x1="0%" y1="0%" x2="100%" y2="50%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="25%" stop-color="#F7F7F7" />
                            <stop offset="70%" stop-color="#E8E8E8" />
                            <stop offset="100%" stop-color="#D0D0D0" />
                        </linearGradient>

                        <!-- 2. Ceramic Front: Soft curve for bowl volume -->
                        <radialGradient id="bowlCurve" cx="40%" cy="60%" r="60%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="80%" stop-color="#F0F0F0" />
                            <stop offset="100%" stop-color="#D6D6D6" />
                        </radialGradient>

                        <!-- 3. Water Gradient: Deep, clean blue -->
                        <radialGradient id="waterGrad" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
                            <stop offset="20%" stop-color="#B3E5FC" stop-opacity="0.9" />
                            <stop offset="60%" stop-color="#4FC3F7" stop-opacity="1" />
                            <stop offset="100%" stop-color="#0288D1" />
                        </radialGradient>

                        <!-- 4. Chrome Gradient: Metallic reflection -->
                        <linearGradient id="chromeMetal" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#E0E0E0" />
                            <stop offset="20%" stop-color="#FFFFFF" />
                            <stop offset="50%" stop-color="#888888" />
                            <stop offset="80%" stop-color="#E0E0E0" />
                            <stop offset="100%" stop-color="#555555" />
                        </linearGradient>

                        <!-- 5. Shadow Filter -->
                        <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
                            <feOffset dx="0" dy="15" result="offsetblur" />
                            <feComponentTransfer>
                                <feFuncA type="linear" slope="0.15" />
                            </feComponentTransfer>
                            <feMerge> 
                                <feMergeNode />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>

                        <!-- 6. Inner Bowl Shadow -->
                        <radialGradient id="innerDepth" cx="50%" cy="50%" r="50%">
                            <stop offset="40%" stop-color="#000" stop-opacity="0" />
                            <stop offset="100%" stop-color="#000" stop-opacity="0.5" />
                        </radialGradient>
                    </defs>

                    <!-- GROUNDING: Floor Shadow -->
                    <ellipse cx="450" cy="680" rx="180" ry="25" fill="#000" opacity="0.2" filter="blur(8px)" />

                    <!-- PLUMBING BASE: Realistic Flange & Wall Pipe -->
                    <g id="plumbing">
                        <!-- Wall Pipe (Behind Toilet) -->
                        <rect x="420" y="650" width="20" height="150" fill="#444" />
                        <rect x="425" y="650" width="8" height="150" fill="#666" opacity="0.5" /> <!-- Highlight -->
                        
                        <!-- Floor Flange Plate (Chrome) -->
                        <ellipse cx="440" cy="670" rx="40" ry="12" fill="url(#chromeMetal)" />
                        <ellipse cx="440" cy="670" rx="35" ry="10" fill="#333" /> <!-- Inner Hole -->
                        
                        <!-- Flange Bolts -->
                        <circle cx="415" cy="670" r="3" fill="#FFF" />
                        <circle cx="465" cy="670" r="3" fill="#FFF" />
                    </g>

                    <!-- TOILET TANK: Rectangular Prism with Radius -->
                    <g id="tank">
                        <!-- Tank Back/Side Shadow -->
                        <path d="M620 200 L650 200 L650 480 Q650 500 630 500 L620 500 Z" fill="#000" opacity="0.05" />
                        
                        <!-- Tank Main Body -->
                        <path d="M380 180 
                                 L620 180 
                                 Q650 180 650 210 
                                 L650 480 
                                 Q650 500 630 500 
                                 L390 500 
                                 Q370 500 370 480 
                                 L370 210 
                                 Q370 180 380 180 Z" 
                              fill="url(#ceramicGloss)" />
                        
                        <!-- Tank Top Lid -->
                        <path d="M370 190 L650 190 L650 180 Q650 160 510 160 Q370 160 370 180 Z" fill="#FFFFFF" />
                        <!-- Lid Highlight -->
                        <path d="M372 182 L648 182" stroke="#FFF" stroke-width="2" opacity="0.8" />
                    </g>

                    <!-- TOILET BOWL: Curved Profile -->
                    <g id="bowl">
                        <!-- Bowl Body -->
                        <path d="M380 490 
                                 L630 490 
                                 Q680 620 450 700 
                                 Q220 620 380 490 Z" 
                              fill="url(#bowlCurve)" />
                        
                        <!-- Bowl Left Volume Shadow -->
                        <path d="M380 490 Q220 620 450 700 L420 680 Q260 610 400 490 Z" fill="#000" opacity="0.04" />
                    </g>

                    <!-- SEAT & LID -->
                    <g id="seat-lid">
                        <!-- The Lid (Standing up) -->
                        <path d="M370 485 
                                 Q510 520 650 485 
                                 L640 220 
                                 Q510 190 380 220 Z" 
                              fill="#FFFFFF" stroke="#EEE" stroke-width="1" />
                        
                        <!-- Lid Thickness Edge -->
                        <path d="M370 485 Q510 520 650 485 L648 488 Q510 523 372 488 Z" fill="#E0E0E0" />
                        
                        <!-- The Seat (Ring) -->
                        <path d="M365 490 Q510 525 655 490 L655 495 Q510 530 365 495 Z" fill="#F0F0F0" />
                        
                        <!-- Front Rim (Thick Ceramic) -->
                        <ellipse cx="510" cy="490" rx="150" ry="40" fill="none" stroke="#FFFFFF" stroke-width="14" />
                        <!-- Inner Rim Shadow -->
                        <ellipse cx="510" cy="490" rx="150" ry="40" fill="none" stroke="#DDD" stroke-width="2" />
                    </g>

                    <!-- BOWL INTERIOR & WATER -->
                    <g id="interior">
                        <!-- Ceramic Rim Thickness (Inner) -->
                        <ellipse cx="510" cy="490" rx="150" ry="40" fill="none" stroke="url(#ceramicGloss)" stroke-width="6" />
                        
                        <!-- The Hole -->
                        <ellipse cx="510" cy="490" rx="142" ry="36" fill="#E0E0E0" />
                        
                        <!-- Water Surface -->
                        <ellipse class="water-surface" cx="510" cy="492" rx="135" ry="32" fill="url(#waterGrad)" />
                        
                        <!-- Inner Depth Shadow -->
                        <ellipse cx="510" cy="492" rx="135" ry="32" fill="url(#innerDepth)" pointer-events="none" />

                        <!-- Water Swirl Animation Element -->
                        <g class="water-swirl">
                            <path d="M420 490 Q510 450 600 490 T510 530" stroke="#FFF" stroke-width="3" fill="none" opacity="0.8" />
                            <path d="M440 495 Q510 470 580 495" stroke="#FFF" stroke-width="2" fill="none" opacity="0.6" />
                        </g>
                    </g>

                    <!-- FLUSH HANDLE (Detailed Chrome) -->
                    <!-- Positioned on the right side of the tank -->
                    <g id="flush-mechanism" transform="translate(640, 350)">
                        <!-- Base Mount -->
                        <rect x="0" y="0" width="15" height="50" rx="4" fill="url(#chromeMetal)" />
                        
                        <!-- The Lever Arm -->
                        <g class="handle-lever">
                            <path d="M0 20 L55 20 L55 30 L0 30 Z" fill="url(#chromeMetal)" />
                            <!-- Cap -->
                            <ellipse cx="55" cy="25" rx="5" ry="12" fill="url(#chromeMetal)" />
                            <!-- Highlight -->
                            <rect x="2" y="22" width="2" height="6" fill="#FFF" opacity="0.8" />
                        </g>
                    </g>

                </svg>

                <!-- Invisible Hit Zone -->
                <div class="interaction-hint" id="flushBtn"></div>
            </div>
        </div>

        <!-- Typography Panel -->
        <div class="details">
            <h1>The<br><span>Modernist.</span></h1>
            <p class="description">
                A seamless fusion of hydraulic engineering and sculptural form. 
                Featuring a dual-flush mechanism and gloss vitreous china finish.
            </p>

            <div class="data-grid">
                <div class="data-point">
                    <h4>Volume</h4>
                    <p>4.8 / 1.6L</p>
                </div>
                <div class="data-point">
                    <h4>Finish</h4>
                    <p>Gloss White</p>
                </div>
                <div class="data-point">
                    <h4>Mount</h4>
                    <p>Floor Stand</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const flushBtn = document.getElementById('flushBtn');
            const svgWrapper = document.querySelector('.svg-wrapper');
            
            // Function to trigger the flush animation
            const triggerFlush = (e) => {
                e.stopPropagation(); // Prevent document click
                
                // 1. Check if already flushing to prevent spam glitch
                if (svgWrapper.classList.contains('flush-anim')) return;

                // 2. Start Animation
                svgWrapper.classList.add('flush-anim');

                // 3. Reset Handle after a delay (The "Spring Back" effect)
                setTimeout(() => {
                    svgWrapper.classList.remove('flush-anim');
                    svgWrapper.classList.add('handle-return');
                }, 300);

                // 4. Clean up classes
                setTimeout(() => {
                    svgWrapper.classList.remove('handle-return');
                }, 1000);
            };

            flushBtn.addEventListener('click', triggerFlush);
            // Also allow clicking the handle directly in SVG
            document.getElementById('flush-mechanism').addEventListener('click', triggerFlush);

            // Subtle Parallax Effect
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth - e.pageX * 2) / 100;
                const y = (window.innerHeight - e.pageY * 2) / 100;

                svgWrapper.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
</body>
</html>
