<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play with Tiles</title>
<style>
  :root {
    /* Palette - Refined for Materiality */
    --felt-primary: #2E6B4F;
    --felt-dark: #183D2B;
    --wood-frame: #3E2723;
    --wood-inner: #5D4037;
    --wood-highlight: #8D6E63;
    
    /* Tile Materials */
    --tile-cream: #F2F0E6;
    --tile-shadow: #D1CFC4;
    --tile-depth: #A0A0A0;
    --pip-black: #1A1A1A;
    
    /* UI Accents */
    --accent-gold: #D4AF37;
    --accent-gold-dim: #8A7222;
    --text-light: #ECF0F1;
    --text-dark: #2C3E50;
    
    /* Dimensions */
    --tile-w: 54px;
    --tile-h: 108px;
  }

  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  
  body, html {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background-color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* --- 1. Layout Zones & Background --- */
  #game-container {
    position: relative;
    width: 100vw; height: 100vh;
    display: grid;
    grid-template-rows: 70px 1fr 180px; /* Top HUD, Board, Player Hand */
    background: 
      radial-gradient(circle at 50% 40%, var(--felt-primary) 0%, var(--felt-dark) 100%);
    /* Felt Texture */
    background-image: 
      radial-gradient(circle at 50% 40%, var(--felt-primary) 0%, var(--felt-dark) 100%),
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
  }

  /* Wood Frame */
  .frame-border {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    border: 24px solid var(--wood-frame);
    box-shadow: inset 0 0 60px rgba(0,0,0,0.9);
    pointer-events: none;
    z-index: 100;
  }
  /* Inner Wood Detail */
  .frame-border::after {
    content: ''; position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px;
    border: 1px solid rgba(255,255,255,0.05);
    border-top: 1px solid rgba(0,0,0,0.5);
    border-left: 1px solid rgba(0,0,0,0.5);
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    border-radius: 4px;
  }

  /* --- Top Bar (HUD) --- */
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 40px;
    z-index: 10;
  }

  .score-pill {
    background: linear-gradient(to bottom, rgba(62, 39, 35, 0.9), rgba(30, 20, 18, 0.95));
    border: 1px solid var(--wood-highlight);
    border-radius: 6px;
    padding: 6px 16px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    min-width: 160px;
  }
  .score-pill.right { flex-direction: row-reverse; text-align: right; }

  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
    font-size: 1.1rem;
    border: 2px solid var(--wood-highlight);
    background: #2c3e50;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
    color: #fff;
  }
  .avatar.active-turn { 
    border-color: var(--accent-gold); 
    box-shadow: 0 0 12px var(--accent-gold-dim); 
    background: #34495e;
  }

  .score-info { display: flex; flex-direction: column; }
  .score-val { 
    font-family: 'Courier New', Courier, monospace; /* Monospace for numbers */
    font-size: 1.3rem; font-weight: 700; 
    color: var(--accent-gold); 
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }
  .score-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: #ccc; opacity: 0.7; }

  /* --- Center Board (The Table) --- */
  #board-area {
    position: relative;
    overflow: hidden;
    display: flex; justify-content: center; align-items: center;
  }

  svg#game-board {
    width: 100%; height: 100%;
    transform-origin: center;
  }

  /* --- Bottom Area (Player Hand & Boneyard) --- */
  .player-area {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    padding: 0 60px;
    z-index: 20;
    background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%);
  }

  .hand-rack {
    display: flex; 
    justify-content: center;
    align-items: flex-end;
    gap: 16px; /* Increased spacing */
    height: 100%;
    padding-bottom: 20px;
  }

  /* --- 2. The 'Tile' Atom (CSS Version for Hand) --- */
  .tile {
    width: var(--tile-w); height: var(--tile-h);
    background: var(--tile-cream);
    border-radius: 8px;
    position: relative;
    /* Tactile 3D Layering */
    box-shadow: 
      inset 1px 1px 2px rgba(255,255,255,0.8), /* Inner Highlight */
      inset -1px -1px 2px rgba(0,0,0,0.1), /* Inner Shadow */
      0 1px 0 #e0ded4, /* Top Bevel */
      0 2px 0 #d0cec4, /* Side Bevel 1 */
      0 3px 0 #b0aea4, /* Side Bevel 2 */
      0 4px 0 #908e84, /* Side Bevel 3 */
      0 10px 25px rgba(0,0,0,0.6); /* Drop Shadow */
    transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    cursor: pointer;
    display: flex; flex-direction: column;
    border: 1px solid #dcdad2;
  }

  .tile:hover {
    transform: translateY(-20px) scale(1.05);
    box-shadow: 
      inset 1px 1px 2px rgba(255,255,255,0.8),
      0 1px 0 #e0ded4,
      0 2px 0 #d0cec4,
      0 3px 0 #b0aea4,
      0 4px 0 #908e84,
      0 25px 40px rgba(0,0,0,0.7);
    z-index: 30;
  }

  .tile.selected {
    transform: translateY(-25px) scale(1.08);
    border-color: var(--accent-gold);
    box-shadow: 
      0 0 0 2px var(--accent-gold),
      0 25px 40px rgba(0,0,0,0.7);
  }

  .tile.disabled {
    filter: grayscale(0.8) brightness(0.9);
    cursor: default;
  }
  .tile.disabled:hover { transform: translateY(0); box-shadow: 0 10px 25px rgba(0,0,0,0.6); }

  /* Tile Internal Structure */
  .tile-half {
    flex: 1; width: 100%;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    padding: 8px;
    position: relative;
  }
  /* Divider */
  .tile-divider {
    height: 1px; background: #cfcfd4; width: 80%; margin: 0 auto;
    box-shadow: 0 1px 0 rgba(255,255,255,0.9);
  }

  /* Pips */
  .pip {
    background: var(--pip-black);
    border-radius: 50%;
    width: 9px; height: 9px;
    margin: auto;
    /* Indented look */
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.9), 0 1px 0 rgba(255,255,255,0.3);
  }

  /* --- 3. Refined Draw Pile (Fanned Stack) --- */
  .boneyard-container {
    position: relative;
    width: 60px; height: 100px;
    margin-left: 40px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .boneyard-container:hover { transform: translateY(-5px); }
  .boneyard-container:active { transform: scale(0.95); }

  /* Stack Layers */
  .boneyard-back {
    position: absolute;
    width: 100%; height: 100%;
    background: #1a237e;
    border-radius: 6px;
    border: 2px solid #fff;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
    z-index: 1;
  }
  .boneyard-back:nth-child(1) { transform: rotate(-3deg) translate(-2px, -2px); }
  .boneyard-back:nth-child(2) { transform: rotate(2deg) translate(2px, -2px); }
  .boneyard-back:nth-child(3) { transform: rotate(-1deg) translate(-1px, 0); }
  .boneyard-top {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #1a237e, #0d47a1);
    border-radius: 6px;
    border: 2px solid #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    z-index: 2;
    display: flex; justify-content: center; align-items: center;
  }
  /* Pattern on back */
  .boneyard-top::after {
    content: ''; position: absolute; inset: 4px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 3px;
    background-image: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(255,255,255,0.05) 4px, rgba(255,255,255,0.05) 8px);
  }
  
  .boneyard-count {
    position: absolute; bottom: -35px; left: 50%; transform: translateX(-50%);
    color: var(--accent-gold); font-size: 0.85rem; font-weight: bold;
    text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    white-space: nowrap;
  }

  /* --- 4. Endpoint Indicators --- */
  .endpoint-group {
    cursor: pointer;
    transition: transform 0.2s;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
  }
  .endpoint-group:hover { transform: scale(1.1); }
  .endpoint-circle {
    fill: rgba(212, 175, 55, 0.1);
    stroke: var(--accent-gold);
    stroke-width: 3;
    stroke-dasharray: 6, 4;
    transition: all 0.2s;
  }
  .endpoint-group:hover .endpoint-circle {
    fill: rgba(212, 175, 55, 0.3);
    stroke-width: 4;
  }
  .endpoint-text {
    fill: var(--accent-gold);
    font-family: 'Georgia', serif;
    font-weight: bold; font-size: 20px;
    text-anchor: middle; dominant-baseline: central;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.8));
  }

  /* --- Toast Notification --- */
  #toast {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
    background: rgba(20, 20, 20, 0.95);
    color: var(--accent-gold); 
    padding: 16px 32px; border-radius: 4px;
    pointer-events: none; opacity: 0; transition: all 0.3s;
    z-index: 200; text-align: center; font-weight: 600;
    border: 1px solid var(--accent-gold);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-size: 0.9rem;
  }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

</style>
</head>
<body>

<div id="game-container">
  <div class="frame-border"></div>

  <!-- 1. Top Zone: HUD -->
  <div class="top-bar">
    <div class="score-pill">
      <div class="avatar active-turn">🤖</div>
      <div class="score-info">
        <div class="score-label">Opponent</div>
        <div class="score-val" id="cpu-score">0</div>
      </div>
    </div>

    <!-- Game Title / Status -->
    <div style="text-align: center;">
      <div style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 3px; color: #8D6E63; font-weight: bold; margin-bottom: 2px;">Play With Tiles</div>
      <div id="turn-indicator" style="font-size: 0.9rem; color: var(--accent-gold); font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Your Turn</div>
    </div>

    <div class="score-pill right">
      <div class="avatar">👤</div>
      <div class="score-info" style="text-align: right;">
        <div class="score-label">You</div>
        <div class="score-val" id="player-score">0</div>
      </div>
    </div>
  </div>

  <!-- 2. Center Zone: The Board -->
  <div id="board-area">
    <svg id="game-board" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Tile Drop Shadow Filter -->
        <filter id="tileDropShadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity="0.5"/>
        </filter>
        
        <!-- Pip Shadow (Indent) -->
        <filter id="pipShadow">
           <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-color="#000" flood-opacity="0.6"/>
        </filter>
        
        <!-- The Tile Shape (SVG) -->
        <g id="tile-shape-svg">
          <!-- Body -->
          <rect x="-22" y="-44" width="44" height="88" rx="6" fill="#F2F0E6" stroke="#dcdad2" stroke-width="1"/>
          <!-- Bevel Highlight -->
          <rect x="-20" y="-42" width="40" height="84" rx="4" fill="none" stroke="white" stroke-opacity="0.9" stroke-width="1"/>
          <!-- Divider Line -->
          <line x1="-18" y1="0" x2="18" y2="0" stroke="#bbb" stroke-width="1"/>
        </g>

        <!-- Pip Templates (0-6) - Centered at 0,0 relative to half -->
        <g id="pip-1"><circle cx="0" cy="0" r="5" fill="#1A1A1A" filter="url(#pipShadow)"/></g>
        <g id="pip-2">
          <circle cx="-9" cy="-9" r="5" fill="#1A1A1A" filter="url(#pipShadow)"/>
          <circle cx="9" cy="9" r="5" fill="#1A1A1A" filter="url(#pipShadow)"/>
        </g>
        <g id="pip-3">
          <circle cx="0" cy="0" r="5" fill="#1A1A1A" filter="url(#pipShadow)"/>
          <circle cx="-9" cy="-9" r="5" fill="#1A1A1A" filter="url(#pipShadow)"/>
          <circle cx="9" cy="9" r="5" fill="#1A1A1A" filter="url(#pipShadow)"/>
        </g>
        <g id="pip-4">
          <circle cx="-9" cy="-9" r="5" fill="#1A1A1A" filter="url(#pipShadow)"/>
          <circle cx="9" cy="-9" r="5" fill="#1A1A1A" filter="url(#pipShadow)"/>
          <circle cx="-9" cy="9" r="5" fill="#1A1A1A" filter="url(#pipShadow)"/>
          <circle cx="9" cy="9" r="5" fill="#1A1A1A" filter="url(#pipShadow)"/>
        </g>
        <g id="pip-5">
          <use href="#pip-4"/>
          <circle cx="0" cy="0" r="5" fill="#1A1A1A" filter="url(#pipShadow)"/>
        </g>
        <g id="pip-6">
          <circle cx="-9" cy="-10" r="5" fill="#1A1A1A" filter="url(#pipShadow)"/>
          <circle cx="9" cy="-10" r="5" fill="#1A1A1A" filter="url(#pipShadow)"/>
          <circle cx="-9" cy="0" r="5" fill="#1A1A1A" filter="url(#pipShadow)"/>
          <circle cx="9" cy="0" r="5" fill="#1A1A1A" filter="url(#pipShadow)"/>
          <circle cx="-9" cy="10" r="5" fill="#1A1A1A" filter="url(#pipShadow)"/>
          <circle cx="9" cy="10" r="5" fill="#1A1A1A" filter="url(#pipShadow)"/>
        </g>
      </defs>

      <!-- The Chain Layer -->
      <g id="chain-layer" transform="translate(500, 300)"></g>

      <!-- Endpoint Indicators Layer -->
      <g id="endpoints-layer"></g>
    </svg>
  </div>

  <!-- 3. Bottom Zone: Hand & Draw -->
  <div class="player-area">
    
    <!-- Hand Rack -->
    <div class="hand-rack" id="player-hand">
      <!-- Tiles injected via JS -->
    </div>

    <!-- Draw Pile (Fanned Stack) -->
    <div class="boneyard-container" onclick="drawTile()">
      <div class="boneyard-back"></div>
      <div class="boneyard-back"></div>
      <div class="boneyard-back"></div>
      <div class="boneyard-top"></div>
      <div class="boneyard-count" id="boneyard-count">12 Left</div>
    </div>
  </div>

  <div id="toast">Message</div>
</div>

<script>
/**
 * Game Logic & Rendering
 */
const TILE_W = 44; // SVG Width
const TILE_H = 88; // SVG Height
const GAP = 6;     // Gap between tiles

// Pip Layout Map
const PIP_MAP = {
  0: null, 1: 'pip-1', 2: 'pip-2', 3: 'pip-3', 4: 'pip-4', 5: 'pip-5', 6: 'pip-6'
};

// State
let boardChain = []; // Array of {a, b, rotation, x, y}
let playerHand = [];
let boneyard = [];
let leftEndVal = null;
let rightEndVal = null;
let selectedTileIdx = -1;

// --- Initialization ---
function initGame() {
  // Generate Double Six Set
  for(let i=0; i<=6; i++) {
    for(let j=i; j<=6; j++) {
      boneyard.push({a: i, b: j});
    }
  }
  // Shuffle
  boneyard.sort(() => Math.random() - 0.5);

  // Deal 6 to player
  for(let i=0; i<6; i++) playerHand.push(boneyard.pop());

  // Start Board with [6,6]
  const startTile = {a: 6, b: 6, rotation: 0}; // 0 = Vertical
  boardChain.push(startTile);
  leftEndVal = 6;
  rightEndVal = 6;

  renderHand();
  renderBoard();
  updateUI();
}

// --- Rendering: Board (SVG) ---
function createBoardTileSVG(tileData) {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  
  // Transform: Move to position, then rotate
  g.setAttribute("transform", `translate(${tileData.x}, ${tileData.y}) rotate(${tileData.rotation})`);
  g.setAttribute("filter", "url(#tileDropShadow)");

  // Shape
  const shape = document.createElementNS("http://www.w3.org/2000/svg", "use");
  shape.setAttribute("href", "#tile-shape-svg");
  g.appendChild(shape);

  // Pips Top (Value A) -> y = -22 (adjusted for larger tile)
  if(PIP_MAP[tileData.a]) {
    const pipsA = document.createElementNS("http://www.w3.org/2000/svg", "use");
    pipsA.setAttribute("href", `#${PIP_MAP[tileData.a]}`);
    pipsA.setAttribute("transform", "translate(0, -22)");
    g.appendChild(pipsA);
  }

  // Pips Bottom (Value B) -> y = 22
  if(PIP_MAP[tileData.b]) {
    const pipsB = document.createElementNS("http://www.w3.org/2000/svg", "use");
    pipsB.setAttribute("href", `#${PIP_MAP[tileData.b]}`);
    pipsB.setAttribute("transform", "translate(0, 22)");
    g.appendChild(pipsB);
  }

  return g;
}

function renderBoard() {
  const container = document.getElementById('chain-layer');
  const endsLayer = document.getElementById('endpoints-layer');
  container.innerHTML = '';
  endsLayer.innerHTML = '';

  if (boardChain.length === 0) return;

  // 1. Calculate Layout (Simple Linear Center-Out)
  const getW = (rot) => (rot === 90 || rot === -90) ? TILE_H : TILE_W;

  // Calculate total width
  let totalW = 0;
  boardChain.forEach(t => totalW += getW(t.rotation) + GAP);
  totalW -= GAP;

  let currentX = -totalW / 2;

  // 2. Render Tiles
  boardChain.forEach((t) => {
    const w = getW(t.rotation);
    t.x = currentX + w/2; // Center anchor
    t.y = 0; // Center Y
    
    const svgTile = createBoardTileSVG(t);
    container.appendChild(svgTile);
    
    currentX += w + GAP;
  });

  // 3. Render Endpoints
  // Left End
  const first = boardChain[0];
  const wFirst = getW(first.rotation);
  const leftX = -totalW/2 - (wFirst/2) - GAP - 30; // 30 is approx radius of endpoint
  
  const leftEp = document.createElementNS("http://www.w3.org/2000/svg", "g");
  leftEp.setAttribute("class", "endpoint-group");
  leftEp.setAttribute("transform", `translate(${leftX}, 0)`);
  leftEp.onclick = () => playTileToSide('left');
  leftEp.innerHTML = `
    <circle cx="0" cy="0" r="22" class="endpoint-circle"/>
    <text x="0" y="2" class="endpoint-text">${leftEndVal}</text>
  `;
  endsLayer.appendChild(leftEp);

  // Right End
  const last = boardChain[boardChain.length-1];
  const wLast = getW(last.rotation);
  const rightX = (totalW/2) + (wLast/2) + GAP + 30;

  const rightEp = document.createElementNS("http://www.w3.org/2000/svg", "g");
  rightEp.setAttribute("class", "endpoint-group");
  rightEp.setAttribute("transform", `translate(${rightX}, 0)`);
  rightEp.onclick = () => playTileToSide('right');
  rightEp.innerHTML = `
    <circle cx="0" cy="0" r="22" class="endpoint-circle"/>
    <text x="0" y="2" class="endpoint-text">${rightEndVal}</text>
  `;
  endsLayer.appendChild(rightEp);
}

// --- Rendering: Hand (HTML) ---
function renderHand() {
  const rack = document.getElementById('player-hand');
  rack.innerHTML = '';
  
  playerHand.forEach((tile, idx) => {
    const el = document.createElement('div');
    el.className = 'tile';
    
    // Check validity
    const valid = (tile.a === leftEndVal || tile.b === leftEndVal || 
                  tile.a === rightEndVal || tile.b === rightEndVal);
    if (!valid) el.classList.add('disabled');
    if (idx === selectedTileIdx) el.classList.add('selected');

    el.innerHTML = `
      <div class="tile-half">${getPipsHTML(tile.a)}</div>
      <div class="tile-divider"></div>
      <div class="tile-half">${getPipsHTML(tile.b)}</div>
    `;
    
    el.onclick = () => selectTile(idx);
    rack.appendChild(el);
  });
}

function getPipsHTML(n) {
  if(n===0) return '';
  let html = '';
  const positions = {
    1: [[2,2]],
    2: [[1,1], [3,3]],
    3: [[1,1], [2,2], [3,3]],
    4: [[1,1], [3,1], [1,3], [3,3]],
    5: [[1,1], [3,1], [2,2], [1,3], [3,3]],
    6: [[1,1], [3,1], [1,2], [3,2], [1,3], [3,3]]
  };
  
  positions[n].forEach(([r,c]) => {
    html += `<div style="grid-area: ${r} / ${c}"><div class="pip"></div></div>`;
  });
  return html;
}

// --- Interaction Logic ---

function selectTile(idx) {
  if (selectedTileIdx === idx) {
    selectedTileIdx = -1; // Deselect
  } else {
    const tile = playerHand[idx];
    // Check if playable
    if (tile.a !== leftEndVal && tile.b !== leftEndVal && 
        tile.a !== rightEndVal && tile.b !== rightEndVal) {
      showToast("No matching ends");
      return;
    }
    selectedTileIdx = idx;
  }
  renderHand();
}

function playTileToSide(side) {
  if (selectedTileIdx === -1) {
    showToast("Select a tile first");
    return;
  }

  const tile = playerHand[selectedTileIdx];
  let played = false;
  let newTileData = null;

  // Logic: 
  // Vertical (0 deg): Top=A, Bottom=B
  // Horizontal (90 deg): Left=B, Right=A (Standard rotation)
  
  if (side === 'left') {
    // We are attaching to the LEFT of the chain.
    // The chain's left end value is `leftEndVal`.
    // We need the RIGHT side of our new tile to match `leftEndVal`.
    
    if (tile.a === leftEndVal) {
      // A matches. A is Top. We need A on Right.
      // Rotate 90deg (Clockwise). Top moves to Right.
      // New Left end becomes B.
      newTileData = { a: tile.b, b: tile.a, rotation: 90 };
      leftEndVal = tile.b;
      played = true;
    } else if (tile.b === leftEndVal) {
      // B matches. B is Bottom. We need B on Right.
      // Rotate -90deg (Counter-Clockwise). Bottom moves to Right.
      // New Left end becomes A.
      newTileData = { a: tile.a, b: tile.b, rotation: -90 };
      leftEndVal = tile.a;
      played = true;
    }
  } else if (side === 'right') {
    // We are attaching to the RIGHT of the chain.
    // The chain's right end value is `rightEndVal`.
    // We need the LEFT side of our new tile to match `rightEndVal`.

    if (tile.b === rightEndVal) {
      // B matches. B is Bottom. We need B on Left.
      // Rotate 90deg. Bottom moves to Left.
      // New Right end becomes A.
      newTileData = { a: tile.a, b: tile.b, rotation: 90 };
      rightEndVal = tile.a;
      played = true;
    } else if (tile.a === rightEndVal) {
      // A matches. A is Top. We need A on Left.
      // Rotate -90deg. Top moves to Left.
      // New Right end becomes B.
      newTileData = { a: tile.a, b: tile.b, rotation: -90 };
      rightEndVal = tile.b;
      played = true;
    }
  }

  if (played) {
    if (side === 'left') boardChain.unshift(newTileData);
    else boardChain.push(newTileData);
    
    playerHand.splice(selectedTileIdx, 1);
    selectedTileIdx = -1;
    
    renderHand();
    renderBoard();
    updateUI();
    checkWin();
  } else {
    showToast("Invalid move");
  }
}

function drawTile() {
  if (boneyard.length > 0) {
    const t = boneyard.pop();
    playerHand.push(t);
    renderHand();
    updateUI();
    showToast("Drawn Tile");
  } else {
    showToast("Boneyard Empty");
  }
}

function updateUI() {
  document.getElementById('boneyard-count').textContent = boneyard.length + " Left";
  // Simulate scores
  document.getElementById('player-score').textContent = Math.floor(Math.random() * 20);
  document.getElementById('cpu-score').textContent = Math.floor(Math.random() * 20);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

function checkWin() {
  if (playerHand.length === 0) {
    showToast("You Win!");
  }
}

// Start
initGame();

</script>
