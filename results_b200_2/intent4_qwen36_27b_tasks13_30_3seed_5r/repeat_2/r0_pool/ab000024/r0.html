<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura | The Modern Flush</title>
<style>
    :root {
        --bg-color: #F4F2EE;
        --text-main: #1A1A1A;
        --text-muted: #6B6B6B;
        --accent: #2B2B2B;
        --highlight: #FFFFFF;
        --ceramic-white: #FDFDFD;
        --ceramic-shadow: #D1D5DB;
        --water-blue: #E0F2FE;
        --water-deep: #7DD3FC;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    /* Layout Grid */
    .container {
        display: grid;
        grid-template-columns: 1fr 1.2fr;
        height: 100%;
        width: 100%;
        position: relative;
    }

    /* Typography & UI Side */
    .content-side {
        padding: 4rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        z-index: 10;
    }

    h1 {
        font-size: 4.5rem;
        font-weight: 300;
        letter-spacing: -0.04em;
        line-height: 1;
        margin-bottom: 1.5rem;
        color: var(--accent);
    }

    h1 span {
        font-weight: 600;
        display: block;
    }

    .tagline {
        font-size: 1.1rem;
        line-height: 1.6;
        color: var(--text-muted);
        max-width: 400px;
        margin-bottom: 3rem;
        border-left: 2px solid var(--accent);
        padding-left: 1.5rem;
    }

    .features {
        display: flex;
        gap: 3rem;
        margin-bottom: 4rem;
    }

    .feature-item h3 {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 0.5rem;
        color: var(--text-main);
    }

    .feature-item p {
        font-size: 0.9rem;
        color: var(--text-muted);
    }

    /* The Flush Button */
    .flush-btn {
        display: inline-flex;
        align-items: center;
        gap: 1rem;
        background: var(--accent);
        color: white;
        border: none;
        padding: 1rem 2.5rem;
        font-size: 1rem;
        font-weight: 500;
        letter-spacing: 0.05em;
        cursor: pointer;
        transition: transform 0.1s ease, box-shadow 0.3s ease;
        width: fit-content;
    }

    .flush-btn:active {
        transform: scale(0.96);
    }

    .flush-btn svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .flush-btn:hover svg {
        transform: rotate(15deg);
    }

    /* Visual Side */
    .visual-side {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 70% 50%, #ffffff 0%, #F4F2EE 70%);
    }

    /* Decorative Background Elements */
    .bg-circle {
        position: absolute;
        border-radius: 50%;
        opacity: 0.4;
        mix-blend-mode: multiply;
    }
    .bg-c-1 { width: 600px; height: 600px; background: #E8E4DB; right: -100px; top: 50%; transform: translateY(-50%); z-index: 1; }
    .bg-c-2 { width: 300px; height: 300px; background: #D1D5DB; right: 20%; bottom: 10%; z-index: 1; }

    /* SVG Container */
    .product-stage {
        width: 100%;
        height: 80%;
        position: relative;
        z-index: 2;
        /* Drop shadow for the whole object to ground it */
        filter: drop-shadow(0px 40px 40px rgba(0,0,0,0.1));
    }

    /* SVG Internal Styles */
    .ceramic-body { fill: url(#grad-ceramic); stroke: #ccc; stroke-width: 1; }
    .ceramic-dark { fill: url(#grad-ceramic-dark); stroke: #bbb; stroke-width: 1; }
    .chrome { fill: url(#grad-chrome); stroke: #999; stroke-width: 0.5; }
    .water { fill: url(#grad-water); opacity: 0.9; }
    .highlight { fill: #fff; opacity: 0.6; }
    .rim { fill: url(#grad-ceramic); stroke: #ddd; stroke-width: 2; }
    
    /* Animation Classes */
    .water-surface {
        transform-origin: center;
    }
    .flush-action {
        animation: none;
    }
    .splash-particle {
        opacity: 0;
    }

    @keyframes flush-spin {
        0% { transform: translateY(0) rotate(0); opacity: 1; }
        50% { transform: translateY(10px) rotate(-20deg); opacity: 0.5; }
        100% { transform: translateY(0) rotate(0); opacity: 1; }
    }

    @keyframes water-drop {
        0% { transform: translateY(-50px) scale(0.5); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translateY(0) scale(1); opacity: 0; }
    }

    @keyframes vortex {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(0.2); opacity: 0.3; }
    }

    /* Mobile Adjustments */
    @media (max-width: 900px) {
        .container { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        .content-side { padding: 2rem; order: 2; }
        .visual-side { order: 1; height: 50vh; }
        h1 { font-size: 3rem; }
    }
</style>
</head>
<body>

<div class="container">
    <div class="content-side">
        <h1>Aura<span>Series 5.</span></h1>
        <div class="tagline">
            Engineered for silence. Sculpted for serenity. 
            The Aura Series 5 combines hydro-dynamic efficiency 
            with a timeless ceramic aesthetic.
        </div>

        <div class="features">
            <div class="feature-item">
                <h3>Hydro-Clean</h3>
                <p>360° rimless spray</p>
            </div>
            <div class="feature-item">
                <h3>Silent Flush</h3>
                <p>Whisper-quiet valve</p>
            </div>
        </div>

        <button class="flush-btn" id="flushTrigger">
            <span>ACTIVATE FLUSH</span>
            <svg viewBox="0 0 24 24">
                <path d="M12,2C12,2 5,10 5,15C5,18.87 8.13,22 12,22C15.87,22 19,18.87 19,15C19,10 12,2 12,2M12,20C9.24,20 7,17.76 7,15C7,12.5 10,7.5 12,4.5C14,7.5 17,12.5 17,15C17,17.76 14.76,20 12,20Z" />
            </svg>
        </button>
    </div>

    <div class="visual-side">
        <div class="bg-circle bg-c-1"></div>
        <div class="bg-circle bg-c-2"></div>

        <svg class="product-stage" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet">
            <defs>
                <!-- Ceramic Gradient (Main Body) -->
                <linearGradient id="grad-ceramic" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#E5E7EB;stop-opacity:1" />
                    <stop offset="20%" style="stop-color:#FFFFFF;stop-opacity:1" />
                    <stop offset="60%" style="stop-color:#F9FAFB;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#D1D5DB;stop-opacity:1" />
                </linearGradient>

                <!-- Ceramic Gradient (Shadows/Darker parts) -->
                <linearGradient id="grad-ceramic-dark" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#9CA3AF;stop-opacity:1" />
                    <stop offset="40%" style="stop-color:#E5E7EB;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#9CA3AF;stop-opacity:1" />
                </linearGradient>

                <!-- Chrome Gradient -->
                <linearGradient id="grad-chrome" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#9CA3AF;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#F3F4F6;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#6B7280;stop-opacity:1" />
                </linearGradient>

                <!-- Water Gradient -->
                <linearGradient id="grad-water" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#BAE6FD;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#7DD3FC;stop-opacity:1" />
                </linearGradient>

                <!-- Vortex Mask -->
                <radialGradient id="vortex-grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                    <stop offset="0%" style="stop-color:#000;stop-opacity:0.8" />
                    <stop offset="100%" style="stop-color:#000;stop-opacity:0" />
                </radialGradient>
            </defs>

            <!-- Floor Shadow -->
            <ellipse cx="300" cy="560" rx="180" ry="25" fill="#000" opacity="0.1" filter="blur(10px)" />

            <!-- PLUMBING / BASE -->
            <g id="base">
                <!-- Floor Flange/Plate -->
                <rect x="260" y="550" width="80" height="10" rx="2" class="chrome" />
                <rect x="298" y="540" width="4" height="15" class="chrome" />
            </g>

            <!-- BOWL (Back/Inside) -->
            <g id="bowl-inner">
                <!-- Water Surface (Hidden behind rim) -->
                <ellipse cx="300" cy="420" rx="120" ry="45" class="water" id="waterSurface" />
                
                <!-- The Vortex (Hidden initially) -->
                <ellipse cx="300" cy="420" rx="100" ry="35" fill="url(#vortex-grad)" id="vortex" opacity="0" />
                
                <!-- Splash Particles (Hidden initially) -->
                <g id="splashGroup">
                    <circle cx="280" cy="400" r="4" fill="#fff" class="splash-particle" />
                    <circle cx="320" cy="390" r="3" fill="#fff" class="splash-particle" />
                    <circle cx="300" cy="380" r="5" fill="#fff" class="splash-particle" />
                    <circle cx="290" cy="430" r="2" fill="#fff" class="splash-particle" />
                </g>
            </g>

            <!-- TANK -->
            <g id="tank">
                <!-- Tank Body -->
                <path d="M210,200 L390,200 C400,200 405,205 405,215 L405,380 C405,390 395,400 380,400 L220,400 C205,400 195,390 195,380 L195,215 C195,205 200,200 210,200 Z" class="ceramic-body" />
                
                <!-- Tank Top Lid -->
                <path d="M200,195 L390,195 C400,195 405,200 405,205 L405,210 L195,210 L195,205 C195,200 200,195 210,195 Z" class="ceramic-dark" />
                
                <!-- Tank Highlight (Gloss) -->
                <path d="M215,210 L215,380 C215,390 220,395 225,395" stroke="white" stroke-width="4" fill="none" opacity="0.5" stroke-linecap="round" />

                <!-- Flush Button Plate -->
                <rect x="270" y="190" width="60" height="10" rx="2" class="chrome" />
                <!-- The Button Itself -->
                <circle cx="300" cy="185" r="15" class="chrome" id="flushButtonVisual" />
                <circle cx="300" cy="185" r="12" fill="#E5E7EB" /> <!-- Button Top -->
            </g>

            <!-- BOWL (Front/Shell) -->
            <g id="bowl-outer">
                <!-- Main Bowl Shape -->
                <path d="M180,420 C180,520 220,550 300,550 C380,550 420,520 420,420 L420,360 C420,350 410,340 400,340 L200,340 C190,340 180,350 180,360 Z" class="ceramic-body" />
                
                <!-- Front Highlight -->
                <path d="M200,400 C200,500 230,530 300,530" stroke="white" stroke-width="6" fill="none" opacity="0.4" stroke-linecap="round" />

                <!-- Rim (The lip of the toilet) -->
                <path d="M180,360 C180,380 250,400 300,400 C350,400 420,380 420,360 L410,350 C410,370 350,390 300,390 C250,390 190,370 190,350 Z" class="ceramic-body" />
                
                <!-- Water Line Shadow (Depth cue) -->
                <path d="M190,380 C190,390 250,405 300,405 C350,405 410,390 410,380" stroke="#9CA3AF" stroke-width="2" fill="none" opacity="0.5" />
            </g>

            <!-- SEAT & LID (Closed/Up position implied by design, here showing seat down) -->
            <g id="seat">
                <!-- Seat Thickness -->
                <path d="M190,355 C190,375 250,395 300,395 C350,395 410,375 410,355 L405,345 C405,365 350,385 300,385 C250,385 195,365 195,345 Z" class="ceramic-dark" />
                <!-- Seat Top Surface -->
                <path d="M195,345 C195,365 250,385 300,385 C350,385 405,365 405,345 C405,335 350,325 300,325 C250,325 195,335 195,345 Z" class="ceramic-body" />
                
                <!-- Seat Highlight -->
                <ellipse cx="300" cy="350" rx="60" ry="10" fill="white" opacity="0.3" />
            </g>

        </svg>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const flushBtn = document.getElementById('flushTrigger');
        const waterSurface = document.getElementById('waterSurface');
        const vortex = document.getElementById('vortex');
        const splashGroup = document.getElementById('splashGroup');
        const particles = document.querySelectorAll('.splash-particle');
        const flushButtonVisual = document.getElementById('flushButtonVisual');

        // Initial state setup
        let isFlushing = false;

        flushBtn.addEventListener('click', () => {
            if (isFlushing) return;
            isFlushing = true;

            // 1. Button Press Animation
            flushButtonVisual.style.transform = "translateY(3px)";
            setTimeout(() => {
                flushButtonVisual.style.transform = "translateY(0)";
            }, 150);

            // 2. Water Surface Animation (Vortex)
            // Move water down slightly
            waterSurface.style.transition = "transform 0.5s ease-in";
            waterSurface.style.transform = "scale(0.9) translateY(10px)";
            
            // Fade in vortex
            vortex.style.transition = "opacity 0.2s";
            vortex.style.opacity = "0.8";
            vortex.style.transform = "scale(0.1)";
            vortex.style.transition = "transform 1s ease-in, opacity 1s ease-in";
            vortex.style.transform = "scale(1.5) rotate(180deg)";
            vortex.style.opacity = "0";

            // 3. Splash Particles
            particles.forEach((p, i) => {
                p.style.transition = `all 0.4s ease-out ${i * 0.05}s`;
                p.style.opacity = "1";
                p.style.transform = `translate(${Math.random()*20-10}px, -${Math.random()*40+20}px)`;
            });

            // 4. Reset Sequence
            setTimeout(() => {
                // Reset particles
                particles.forEach(p => {
                    p.style.transition = "none";
                    p.style.opacity = "0";
                    p.style.transform = "none";
                });

                // Reset water surface (Fill back up)
                waterSurface.style.transition = "transform 2s ease-out";
                waterSurface.style.transform = "scale(1) translateY(0)";

                setTimeout(() => {
                    isFlushing = false;
                }, 2000);

            }, 1000);
        });
    });
</script>
</body>
</html>
