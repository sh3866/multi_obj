<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON RUNNER // SYSTEM ONLINE</title>
<style>
    :root {
        --bg-color: #0f111a;
        --grid-color: #1a1d29;
        --accent-primary: #00f3ff; /* Cyan */
        --accent-secondary: #ff0055; /* Magenta */
        --accent-tertiary: #ffe600; /* Yellow */
        --text-color: #e0e6ed;
        --glass: rgba(15, 17, 26, 0.85);
        --font-main: 'Courier New', Courier, monospace;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: var(--font-main);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* --- BACKGROUND GRID EFFECT --- */
    .bg-grid {
        position: absolute;
        top: 0;
        left: 0;
        width: 200%;
        height: 200%;
        background-image: 
            linear-gradient(var(--grid-color) 1px, transparent 1px),
            linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
        background-size: 40px 40px;
        transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
        animation: gridMove 20s linear infinite;
        z-index: -2;
        opacity: 0.5;
    }

    @keyframes gridMove {
        0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
        100% { transform: perspective(500px) rotateX(60deg) translateY(40px) translateZ(-200px); }
    }

    /* --- CRT SCANLINE OVERLAY --- */
    .scanlines {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
            to bottom,
            rgba(255,255,255,0),
            rgba(255,255,255,0) 50%,
            rgba(0,0,0,0.1) 50%,
            rgba(0,0,0,0.1)
        );
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 100;
        opacity: 0.6;
    }

    /* --- MAIN CONTAINER --- */
    .game-container {
        position: relative;
        width: 90vw;
        max-width: 1000px;
        height: 60vh;
        border: 1px solid rgba(255,255,255,0.1);
        background: linear-gradient(to bottom, rgba(15,17,26,0.9) 0%, rgba(15,17,26,0.4) 100%);
        box-shadow: 0 0 50px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        backdrop-filter: blur(5px);
    }

    /* --- HUD --- */
    .hud {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 20px;
        width: 100%;
        z-index: 10;
    }

    .score-box {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }

    .label {
        font-size: 0.7rem;
        opacity: 0.6;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    .value {
        font-size: 1.8rem;
        font-weight: bold;
        text-shadow: 0 0 10px var(--accent-primary);
    }

    .value.high {
        color: var(--accent-tertiary);
        font-size: 1.2rem;
    }

    .speed-indicator {
        text-align: right;
    }

    .speed-val {
        font-size: 1.5rem;
        color: var(--accent-secondary);
        font-weight: bold;
    }

    .unit {
        font-size: 0.8rem;
        opacity: 0.7;
    }

    /* --- GAMEPLAY AREA --- */
    .viewport {
        position: relative;
        flex-grow: 1;
        display: flex;
        align-items: flex-end;
        padding-bottom: 60px; /* Ground clearance */
    }

    /* --- GROUND --- */
    .ground {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 60px;
        background: var(--bg-color);
        border-top: 2px solid var(--accent-primary);
        z-index: 5;
        box-shadow: 0 -5px 20px rgba(0, 243, 255, 0.2);
    }

    .ground::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 1px;
        background: rgba(255,255,255,0.5);
        box-shadow: 0 0 10px #fff;
    }

    /* --- SPRITES (SVG) --- */
    .sprite {
        position: absolute;
        bottom: 60px; /* On top of ground */
        width: 60px;
        height: 60px;
        will-change: transform;
    }

    .dino {
        left: 100px;
        filter: drop-shadow(0 0 5px var(--accent-primary));
    }

    .dino svg {
        fill: var(--accent-primary);
        width: 100%;
        height: 100%;
    }

    .obstacle {
        filter: drop-shadow(0 0 5px var(--accent-secondary));
    }

    .obstacle svg {
        fill: var(--accent-secondary);
        width: 100%;
        height: 100%;
    }

    .bird {
        bottom: 140px; /* Flying */
        width: 50px;
        height: 50px;
    }

    /* --- ANIMATIONS --- */
    @keyframes run {
        0% { transform: translateY(0) rotate(0deg); }
        25% { transform: translateY(-2px) rotate(-2deg); }
        50% { transform: translateY(0) rotate(0deg); }
        75% { transform: translateY(-2px) rotate(2deg); }
        100% { transform: translateY(0) rotate(0deg); }
    }

    .dino.running {
        animation: run 0.4s infinite linear;
    }

    @keyframes jump {
        0% { bottom: 60px; }
        50% { bottom: 200px; }
        100% { bottom: 60px; }
    }

    .dino.jumping {
        animation: jump 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes fly {
        0% { transform: translateX(110vw); }
        100% { transform: translateX(-150px); }
    }

    @keyframes moveGround {
        0% { background-position: 0 0; }
        100% { background-position: -40px 0; }
    }

    /* --- UI OVERLAYS --- */
    .instruction {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        pointer-events: none;
        z-index: 20;
        transition: opacity 0.3s;
    }

    .key-cap {
        display: inline-block;
        border: 2px solid var(--text-color);
        border-radius: 4px;
        padding: 5px 12px;
        margin: 10px 0;
        font-weight: bold;
        background: rgba(255,255,255,0.1);
        box-shadow: 0 4px 0 rgba(255,255,255,0.2);
    }

    .status-msg {
        position: absolute;
        top: 10px;
        left: 20px;
        font-size: 0.7rem;
        color: var(--accent-tertiary);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .status-dot {
        width: 8px;
        height: 8px;
        background-color: var(--accent-tertiary);
        border-radius: 50%;
        animation: blink 1s infinite;
    }

    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
    }

</style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="scanlines"></div>

    <div class="game-container">
        <!-- HUD -->
        <div class="hud">
            <div class="score-box">
                <span class="label">Score</span>
                <span class="value" id="score">0000</span>
            </div>
            <div class="score-box" style="align-items: flex-end;">
                <span class="label">Best</span>
                <span class="value high" id="highScore">0420</span>
            </div>
            <div class="speed-indicator">
                <span class="speed-val" id="speed">12</span>
                <span class="unit">KM/H</span>
            </div>
        </div>

        <div class="status-msg">
            <div class="status-dot"></div>
            SYSTEM: NOMINAL
        </div>

        <!-- VIEWPORT -->
        <div class="viewport" id="gameArea">
            <div class="instruction" id="startInstruction">
                <div style="font-size: 2rem; font-weight: bold; letter-spacing: 5px; margin-bottom: 10px;">NEON RUNNER</div>
                <div style="opacity: 0.8;">PRESS SPACE TO INITIATE</div>
                <div class="key-cap">SPACE</div>
            </div>

            <!-- Player -->
            <div class="sprite dino" id="dino">
                <!-- Vector Dino SVG -->
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M70,10 H90 V30 H80 V40 H90 V50 H70 V60 H60 V80 H50 V70 H40 V60 H30 V50 H20 V40 H10 V30 H20 V20 H40 V10 Z" />
                    <rect x="85" y="15" width="5" height="5" fill="#0f111a"/> <!-- Eye -->
                </svg>
            </div>

            <!-- Obstacles Container -->
            <div id="obstacles"></div>

            <!-- Ground -->
            <div class="ground"></div>
        </div>
    </div>

<script>
    // --- CONFIGURATION ---
    const GRAVITY = 0.6;
    const JUMP_FORCE = 12;
    const GAME_SPEED_START = 6;
    const SPAWN_RATE = 1500; // ms
    
    // --- STATE ---
    let isPlaying = false;
    let isGameOver = false;
    let score = 0;
    let gameSpeed = GAME_SPEED_START;
    let lastTime = 0;
    let spawnTimer = 0;
    let obstacles = [];
    let animationFrameId;

    // --- DOM ELEMENTS ---
    const dino = document.getElementById('dino');
    const gameArea = document.getElementById('gameArea');
    const obstacleContainer = document.getElementById('obstacles');
    const scoreEl = document.getElementById('score');
    const speedEl = document.getElementById('speed');
    const startInstr = document.getElementById('startInstruction');

    // --- ASSETS (SVG TEMPLATES) ---
    const cactusSVG = `
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M30,100 V40 H10 V30 H30 V10 H50 V30 H70 V20 H80 V40 H60 V100 Z" />
        </svg>
    `;
    
    const birdSVG = `
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M10,50 Q30,20 50,50 T90,50 Q70,70 50,50 T10,50" />
        </svg>
    `;

    // --- GAME LOOP ---
    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const deltaTime = timestamp - lastTime;
        lastTime = timestamp;

        if (isPlaying && !isGameOver) {
            update(deltaTime);
            draw();
            spawnManager(deltaTime);
        }

        animationFrameId = requestAnimationFrame(gameLoop);
    }

    // --- UPDATE LOGIC ---
    function update(dt) {
        // Physics for Dino
        if (dino.dy !== undefined) {
            dino.y += dino.dy;
            dino.dy -= GRAVITY; // Gravity pulls down (negative Y is up in logic, but we handle CSS bottom)

            // Floor collision
            if (dino.y <= 0) {
                dino.y = 0;
                dino.dy = 0;
                dino.classList.remove('jumping');
            }
        }

        // Move Obstacles
        obstacles.forEach((obs, index) => {
            obs.x -= gameSpeed;
            
            // Cleanup off-screen
            if (obs.x < -100) {
                obs.element.remove();
                obstacles.splice(index, 1);
                score += 10;
                scoreEl.innerText = score.toString().padStart(4, '0');
                
                // Increase speed slightly
                if(score % 50 === 0) {
                    gameSpeed += 0.5;
                    speedEl.innerText = Math.floor(12 + (gameSpeed - GAME_SPEED_START) * 2);
                }
            }

            // Collision Detection
            // Dino rect is roughly: Left: 100, Width: 60, Bottom: 60 + y
            const dinoRect = {
                l: 100 + 15, // padding for hitbox forgiveness
                r: 100 + 45,
                b: 60 + dino.y,
                t: 60 + dino.y + 50
            };

            const obsRect = {
                l: obs.x + 10,
                r: obs.x + obs.width - 10,
                b: obs.type === 'bird' ? 140 : 60, // Bird is higher
                t: obs.type === 'bird' ? 140 + 40 : 60 + obs.height
            };

            // Simple AABB Collision
            if (
                dinoRect.l < obsRect.r &&
                dinoRect.r > obsRect.l &&
                dinoRect.b < obsRect.t &&
                dinoRect.t > obsRect.b
            ) {
                gameOver();
            }
        });
    }

    // --- RENDER ---
    function draw() {
        // Render Dino
        dino.style.bottom = (60 + dino.y) + 'px';

        // Render Obstacles
        obstacles.forEach(obs => {
            obs.element.style.transform = `translateX(${obs.x}px)`;
        });
    }

    // --- SPAWNER ---
    function spawnManager(dt) {
        spawnTimer += dt;
        if (spawnTimer > SPAWN_RATE / (gameSpeed / GAME_SPEED_START)) {
            spawnTimer = 0;
            createObstacle();
        }
    }

    function createObstacle() {
        const type = Math.random() > 0.7 ? 'bird' : 'cactus';
        const el = document.createElement('div');
        el.classList.add('sprite', 'obstacle');
        if (type === 'bird') el.classList.add('bird');
        
        el.innerHTML = type === 'cactus' ? cactusSVG : birdSVG;
        el.style.left = '0px'; // Position handled by transform for performance
        
        obstacleContainer.appendChild(el);

        obstacles.push({
            element: el,
            x: 1100, // Start off screen
            width: 40,
            height: type === 'bird' ? 30 : 50,
            type: type
        });
    }

    // --- CONTROLS ---
    function jump() {
        if (!isPlaying) {
            startGame();
            return;
        }
        if (isGameOver) {
            resetGame();
            return;
        }

        // Only jump if on ground
        if (dino.y === 0) {
            dino.dy = JUMP_FORCE;
            dino.classList.add('jumping');
        }
    }

    function startGame() {
        isPlaying = true;
        startInstr.style.opacity = '0';
        dino.classList.add('running');
        dino.y = 0;
        dino.dy = 0;
    }

    function resetGame() {
        isGameOver = false;
        isPlaying = true;
        score = 0;
        gameSpeed = GAME_SPEED_START;
        scoreEl.innerText = '0000';
        speedEl.innerText = '12';
        
        // Clear obstacles
        obstacles.forEach(o => o.element.remove());
        obstacles = [];
        
        startInstr.style.opacity = '0';
        dino.classList.remove('jumping');
        dino.classList.add('running');
    }

    function gameOver() {
        isGameOver = true;
        isPlaying = false;
        dino.classList.remove('running');
        dino.classList.remove('jumping');
        
        startInstr.innerHTML = `
            <div style="font-size: 2rem; font-weight: bold; color: var(--accent-secondary); margin-bottom: 10px;">CRITICAL FAILURE</div>
            <div style="opacity: 0.8;">PRESS SPACE TO REBOOT</div>
            <div class="key-cap">SPACE</div>
        `;
        startInstr.style.opacity = '1';
    }

    // --- INITIALIZATION ---
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            jump();
        }
    });

    // Initial Render
    requestAnimationFrame(gameLoop);

</script>
</body>
</html>
