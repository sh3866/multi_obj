<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical AI Visualization</title>
    <style>
        :root {
            /* Tactical Cyberpunk Palette */
            --bg-dark: #05070a;
            --bg-panel: rgba(10, 12, 16, 0.85);
            
            /* High Saturation Accents */
            --color-player: #00f0ff;
            --color-patrol: #00a8ff;
            --color-alert: #ffcc00;
            --color-chase: #ff2a2a;
            --color-attack: #ff0055;
            
            --text-main: #ffffff;
            --text-muted: #6b7c93;
            
            /* Typography */
            --font-stack: 'Courier New', Courier, monospace; /* Monospace for tactical feel */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* --- Layout --- */
        #app {
            display: grid;
            grid-template-columns: 1fr 300px;
            width: 100%;
            height: 100%;
        }

        /* --- Canvas Area --- */
        #arena-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* CRITIQUE 3: Reduced Grid Opacity (5-10%) */
            background: 
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            cursor: crosshair;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- HUD Overlay --- */
        .hud-overlay {
            position: absolute;
            top: 24px;
            left: 24px;
            pointer-events: none;
            z-index: 10;
        }

        .title-block h1 {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--color-player);
            margin-bottom: 4px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        .title-block h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -1px;
        }

        /* --- Inspector Panel --- */
        #inspector {
            background: var(--bg-panel);
            border-left: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            padding: 30px;
            z-index: 10;
            box-shadow: -10px 0 40px rgba(0,0,0,0.5);
        }

        .panel-header {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            background: var(--color-patrol);
            box-shadow: 0 0 10px var(--color-patrol);
            animation: blink 2s infinite;
        }

        /* Player Stats */
        .stat-group {
            margin-bottom: 40px;
        }

        .stat-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: block;
        }

        .bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: var(--color-player);
            width: 85%;
            box-shadow: 0 0 15px var(--color-player);
            position: relative;
        }
        
        /* Scanline effect on bar */
        .bar-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: scan 2s linear infinite;
        }

        /* Legend */
        .legend-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-main);
        }

        /* CRITIQUE 5: Unified Geometry Icons */
        .legend-icon {
            width: 16px;
            height: 16px;
            margin-right: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .legend-diamond {
            width: 10px;
            height: 10px;
            transform: rotate(45deg);
            box-shadow: 0 0 8px currentColor;
        }

        .legend-desc {
            margin-left: auto;
            font-size: 9px;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Tooltip */
        #tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 16px;
            border-radius: 2px;
            font-size: 11px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
            transform: translate(15px, 15px);
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        @keyframes scan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

    </style>
</head>
<body>

<div id="app">
    <div id="arena-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="hud-overlay">
            <div class="title-block">
                <h1>System Monitor</h1>
                <h2>Tactical AI Analysis</h2>
            </div>
        </div>

        <div id="tooltip">
            <div id="tt-title" style="font-weight:bold; margin-bottom:6px; color:#fff; letter-spacing:1px;">UNIT ID</div>
            <div id="tt-state" style="color:#fff;">State: Idle</div>
        </div>
    </div>

    <aside id="inspector">
        <div class="panel-header">
            <span>Live Inspector</span>
            <div class="status-indicator"></div>
        </div>

        <div class="stat-group">
            <span class="stat-label">PLAYER INTEGRITY</span>
            <div class="bar-container">
                <div class="bar-fill" id="health-bar"></div>
            </div>
            <div style="display:flex; justify-content:space-between; margin-top:8px;">
                <span style="font-size:10px; font-weight:700; color:var(--text-main);">850 / 1000</span>
                <span style="font-size:9px; font-weight:700; letter-spacing:1px; color:var(--color-player);">STABLE</span>
            </div>
        </div>

        <div class="stat-group">
            <span class="stat-label">AI BEHAVIOR LEGEND</span>
            <ul class="legend-list">
                <li class="legend-item" style="color: var(--color-patrol);">
                    <div class="legend-icon"><div class="legend-diamond" style="background: var(--color-patrol);"></div></div>
                    <span>PATROL</span>
                    <span class="legend-desc">Routine</span>
                </li>
                <li class="legend-item" style="color: var(--color-alert);">
                    <div class="legend-icon"><div class="legend-diamond" style="background: var(--color-alert);"></div></div>
                    <span>ALERT</span>
                    <span class="legend-desc">Investigating</span>
                </li>
                <li class="legend-item" style="color: var(--color-chase);">
                    <div class="legend-icon"><div class="legend-diamond" style="background: var(--color-chase);"></div></div>
                    <span>CHASE</span>
                    <span class="legend-desc">Vector Locked</span>
                </li>
                <li class="legend-item" style="color: var(--color-attack);">
                    <div class="legend-icon"><div class="legend-diamond" style="background: var(--color-attack);"></div></div>
                    <span>ATTACK</span>
                    <span class="legend-desc">Engaging</span>
                </li>
            </ul>
        </div>
    </aside>
</div>

<script>
/**
 * Vector Utility
 */
class Vec2 {
    constructor(x, y) { this.x = x; this.y = y; }
    add(v) { return new Vec2(this.x + v.x, this.y + v.y); }
    sub(v) { return new Vec2(this.x - v.x, this.y - v.y); }
    mult(n) { return new Vec2(this.x * n, this.y * n); }
    mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
    normalize() {
        let m = this.mag();
        return m === 0 ? new Vec2(0, 0) : new Vec2(this.x / m, this.y / m);
    }
    dist(v) { return Math.sqrt(Math.pow(this.x - v.x, 2) + Math.pow(this.y - v.y, 2)); }
    copy() { return new Vec2(this.x, this.y); }
}

/**
 * Configuration
 */
const COLORS = {
    player: '#00f0ff',
    wall: '#11141a',
    wallStroke: '#2a303c',
    patrol: '#00a8ff',
    alert: '#ffcc00',
    chase: '#ff2a2a',
    attack: '#ff0055'
};

const STATES = {
    PATROL: 'patrol',
    ALERT: 'alert',
    CHASE: 'chase',
    ATTACK: 'attack'
};

/**
 * Game Objects
 */
class Wall {
    constructor(x, y, w, h) {
        this.x = x; this.y = y; this.w = w; this.h = h;
    }
    
    draw(ctx) {
        ctx.fillStyle = COLORS.wall;
        ctx.strokeStyle = COLORS.wallStroke;
        ctx.lineWidth = 1;
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 15;
        
        ctx.beginPath();
        ctx.rect(this.x, this.y, this.w, this.h);
        ctx.fill();
        ctx.stroke();
        
        // Tactical corner markers
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.strokeRect(this.x + 4, this.y + 4, this.w - 8, this.h - 8);
    }
}

class Player {
    constructor(x, y) {
        this.pos = new Vec2(x, y);
        this.target = new Vec2(x, y);
        this.speed = 3;
        this.angle = 0;
    }

    update() {
        let dir = this.target.sub(this.pos);
        let dist = dir.mag();
        if (dist > 1) {
            dir = dir.normalize().mult(this.speed);
            this.pos = this.pos.add(dir);
            this.angle = Math.atan2(dir.y, dir.x);
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        ctx.rotate(this.angle);

        // CRITIQUE 5: Unified Geometry (Diamond)
        ctx.shadowColor = COLORS.player;
        ctx.shadowBlur = 20;
        ctx.fillStyle = COLORS.player;
        
        ctx.beginPath();
        ctx.moveTo(12, 0);
        ctx.lineTo(0, 8);
        ctx.lineTo(-12, 0);
        ctx.lineTo(0, -8);
        ctx.closePath();
        ctx.fill();
        
        // Inner detail
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(0, 0, 3, 0, Math.PI*2);
        ctx.fill();

        ctx.restore();
    }
}

class Enemy {
    constructor(x, y, patrolPoints, initialState) {
        this.pos = new Vec2(x, y);
        this.patrolPoints = patrolPoints;
        this.currentPatrolIdx = 0;
        this.angle = 0;
        this.speed = 1.2;
        this.state = initialState || STATES.PATROL;
        
        // AI Params
        this.visionRange = 160;
        this.visionAngle = Math.PI / 2.5; 
        this.attackRange = 60;
        
        // Demo State Logic
        this.alertTimer = 0;
        this.lastKnownPos = null;
        this.noiseSource = null;
        
        // Animation offset
        this.animOffset = Math.random() * 100;
    }

    update(player, walls) {
        let distToPlayer = this.pos.dist(player.pos);
        let vecToPlayer = player.pos.sub(this.pos);
        let angleToPlayer = Math.atan2(vecToPlayer.y, vecToPlayer.x);
        
        // Normalize angles
        let angleDiff = angleToPlayer - this.angle;
        while (angleDiff <= -Math.PI) angleDiff += Math.PI*2;
        while (angleDiff > Math.PI) angleDiff -= Math.PI*2;

        // Static Demo Logic to satisfy CRITIQUE 1 & 2
        switch (this.state) {
            case STATES.PATROL:
                // Move to patrol point
                this.moveTo(this.patrolPoints[this.currentPatrolIdx], this.speed);
                
                // Loop patrol
                if (this.pos.dist(this.patrolPoints[this.currentPatrolIdx]) < 5) {
                    this.currentPatrolIdx = (this.currentPatrolIdx + 1) % this.patrolPoints.length;
                }
                break;

            case STATES.ALERT:
                // Investigate
                let target = this.noiseSource ? this.noiseSource : this.lastKnownPos;
                if (target) {
                    this.moveTo(target, this.speed * 1.5);
                }
                break;

            case STATES.CHASE:
                // CRITIQUE 2: Move directly toward player
                this.moveTo(player.pos, this.speed * 2);
                this.angle = angleToPlayer; // Face player
                break;

            case STATES.ATTACK:
                // CRITIQUE 4: Stationary, face player
                this.angle = angleToPlayer;
                break;
        }
        
        // Basic Wall Collision
        walls.forEach(w => {
            if (this.pos.x > w.x && this.pos.x < w.x + w.w &&
                this.pos.y > w.y && this.pos.y < w.y + w.h) {
                let center = new Vec2(w.x + w.w/2, w.y + w.h/2);
                let push = this.pos.sub(center).normalize().mult(1);
                this.pos = this.pos.add(push);
            }
        });
    }

    moveTo(target, spd) {
        let dir = target.sub(this.pos);
        let dist = dir.mag();
        if (dist > 1) {
            this.angle = Math.atan2(dir.y, dir.x);
            dir = dir.normalize().mult(spd);
            this.pos = this.pos.add(dir);
        }
    }

    draw(ctx, playerPos, time) {
        let color = COLORS.patrol;
        if (this.state === STATES.ALERT) color = COLORS.alert;
        if (this.state === STATES.CHASE) color = COLORS.chase;
        if (this.state === STATES.ATTACK) color = COLORS.attack;

        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        ctx.rotate(this.angle);

        // --- CRITIQUE 6: Unified Sharp Polygon Cones ---
        // Draw detection cone
        if (this.state !== STATES.PATROL) {
            ctx.beginPath();
            ctx.moveTo(0, 0);
            
            // Draw triangle instead of arc for sharp polygon look
            let tipX = this.visionRange;
            let tipY = this.visionRange * Math.tan(this.visionAngle/2);
            
            ctx.lineTo(tipX, tipY);
            ctx.lineTo(tipX, -tipY);
            ctx.closePath();
            
            // Fill with low opacity color
            ctx.fillStyle = color + '15'; // ~15% opacity hex
            ctx.fill();
            
            // Stroke edges
            ctx.strokeStyle = color + '40'; 
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        // --- CRITIQUE 7: Glitch Effect on Attack ---
        if (this.state === STATES.ATTACK) {
            // Draw scanlines inside the cone
            ctx.save();
            ctx.clip();
            ctx.fillStyle = 'rgba(255, 0, 85, 0.2)';
            let offset = (time * 2) % 10;
            for(let i = -100; i < 200; i+=10) {
                ctx.fillRect(0, i + offset, 200, 2);
            }
            ctx.restore();
        }

        // --- CRITIQUE 5: Unified Unit Shape (Diamond) ---
        ctx.shadowColor = color;
        ctx.shadowBlur = 15;
        ctx.fillStyle = '#05070a'; // Dark center
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.lineTo(0, 7);
        ctx.lineTo(-10, 0);
        ctx.lineTo(0, -7);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        
        // Reset shadow for labels
        ctx.shadowBlur = 0;

        ctx.restore();

        // --- CRITIQUE 4: Targeting Line for Attack ---
        if (this.state === STATES.ATTACK && playerPos) {
            ctx.strokeStyle = COLORS.attack;
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 5]);
            ctx.beginPath();
            ctx.moveTo(this.pos.x, this.pos.y);
            ctx.lineTo(playerPos.x, playerPos.y);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // --- CRITIQUE 2: Pathfinding Lines ---
        if (this.state === STATES.CHASE && playerPos) {
            // Chase Vector
            ctx.strokeStyle = COLORS.chase;
            ctx.globalAlpha = 0.6;
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(this.pos.x, this.pos.y);
            ctx.lineTo(playerPos.x, playerPos.y);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.globalAlpha = 1.0;
        }

        // State Label
        ctx.fillStyle = color;
        ctx.font = 'bold 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(this.state.toUpperCase(), this.pos.x, this.pos.y - 18);
    }
}

/**
 * Main System
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
const ttTitle = document.getElementById('tt-title');
const ttState = document.getElementById('tt-state');

let width, height;
let player;
let enemies = [];
let walls = [];
let mousePos = new Vec2(0,0);
let selectedEnemy = null;
let time = 0;

function resize() {
    width = canvas.parentElement.offsetWidth;
    height = canvas.parentElement.offsetHeight;
    canvas.width = width;
    canvas.height = height;
    initLevel();
}

function initLevel() {
    // Player: Center-Right
    player = new Player(width * 0.65, height * 0.5);
    player.target = player.pos.copy();

    // Walls
    walls = [
        new Wall(width * 0.3, height * 0.3, width * 0.2, 20),
        new Wall(width * 0.1, height * 0.6, 20, height * 0.2),
        new Wall(width * 0.4, height * 0.7, width * 0.3, 20),
        new Wall(width * 0.75, height * 0.2, 20, height * 0.15)
    ];

    // --- CRITIQUE 1: Populate Missing States ---
    
    // Enemy A: CHASE (Red) - Left side
    let enemyA = new Enemy(width * 0.2, height * 0.5, [], STATES.CHASE);
    
    // Enemy B: ATTACK (High Sat Red) - Top Right
    let enemyB = new Enemy(width * 0.75, height * 0.35, [], STATES.ATTACK);

    // Enemy C: ALERT (Yellow) - Bottom Left
    let noiseSource = new Vec2(width * 0.4, height * 0.8);
    let enemyC = new Enemy(width * 0.15, height * 0.8, [], STATES.ALERT);
    enemyC.noiseSource = noiseSource;

    // Enemy D: PATROL (Blue) - Looping path
    let patrolPath = [
        new Vec2(width * 0.8, height * 0.8),
        new Vec2(width * 0.9, height * 0.8),
        new Vec2(width * 0.9, height * 0.6),
        new Vec2(width * 0.8, height * 0.6)
    ];
    let enemyD = new Enemy(patrolPath[0].x, patrolPath[0].y, patrolPath, STATES.PATROL);

    enemies = [enemyA, enemyB, enemyC, enemyD];
}

// Interaction
window.addEventListener('resize', resize);
canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mousePos = new Vec2(e.clientX - rect.left, e.clientY - rect.top);
    player.target = mousePos;

    let hovered = null;
    enemies.forEach(en => {
        if (en.pos.dist(mousePos) < 30) hovered = en;
    });

    if (hovered) {
        selectedEnemy = hovered;
        canvas.style.cursor = 'pointer';
        tooltip.style.opacity = 1;
        tooltip.style.left = (e.clientX + 15) + 'px';
        tooltip.style.top = (e.clientY + 15) + 'px';
        ttTitle.innerText = "Enemy Unit " + (enemies.indexOf(hovered) + 1);
        ttState.innerText = "State: " + hovered.state.toUpperCase();
        
        // Colorize tooltip text based on state
        let c = COLORS.patrol;
        if(hovered.state === STATES.ALERT) c = COLORS.alert;
        if(hovered.state === STATES.CHASE) c = COLORS.chase;
        if(hovered.state === STATES.ATTACK) c = COLORS.attack;
        ttState.style.color = c;

    } else {
        selectedEnemy = null;
        canvas.style.cursor = 'crosshair';
        tooltip.style.opacity = 0;
    }
});

function drawPatrolPaths() {
    // CRITIQUE 2: Visible dotted lines for Patrol
    enemies.forEach(en => {
        if (en.state === STATES.PATROL && en.patrolPoints.length > 1) {
            ctx.strokeStyle = COLORS.patrol;
            ctx.globalAlpha = 0.3;
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(en.patrolPoints[0].x, en.patrolPoints[0].y);
            for(let i=1; i<en.patrolPoints.length; i++) {
                ctx.lineTo(en.patrolPoints[i].x, en.patrolPoints[i].y);
            }
            ctx.closePath();
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.globalAlpha = 1.0;
            
            // Draw small dots at nodes
            ctx.fillStyle = COLORS.patrol;
            en.patrolPoints.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
                ctx.fill();
            });
        }
    });
}

function animate() {
    time++;
    ctx.clearRect(0, 0, width, height);

    // Logic
    player.update();
    enemies.forEach(en => en.update(player, walls));

    // Draw Layers
    drawPatrolPaths();
    
    walls.forEach(w => w.draw(ctx));
    
    // Draw enemies (sort by Y for pseudo-depth)
    const renderList = [...enemies, player].sort((a, b) => a.pos.y - b.pos.y);
    
    renderList.forEach(obj => {
        if (obj instanceof Enemy) {
            obj.draw(ctx, player.pos, time);
        } else {
            obj.draw(ctx);
        }
    });

    requestAnimationFrame(animate);
}

// Init
resize();
animate();

</script>
</body>
</html>
