<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical AI Analysis</title>
    <style>
        :root {
            /* Palette - Subdued & Tactical */
            --bg-dark: #05070a;
            --bg-panel: #0b0e14;
            --border-color: #1f2633;
            
            /* State Colors - High Contrast */
            --color-player: #00f0ff;
            --color-patrol: #00a8ff;
            --color-alert: #ffcc00;
            --color-chase: #ff2a2a;
            --color-attack: #ff0055;
            
            /* Text Colors - Neutralized for Inspector */
            --text-main: #e0e6ed;
            --text-muted: #6b7c93;
            --text-dim: #4a5568;

            /* Typography - Unified Monospace */
            --font-stack: 'Courier New', 'Consolas', 'Monaco', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* --- Layout --- */
        #app {
            display: grid;
            grid-template-columns: 1fr 320px;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Subtle Scanline Overlay */
        #app::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 999;
            opacity: 0.3;
        }

        /* --- Canvas Area --- */
        #arena-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Tactical Grid */
            background: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            cursor: crosshair;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- HUD Overlay --- */
        .hud-overlay {
            position: absolute;
            top: 24px;
            left: 24px;
            pointer-events: none;
            z-index: 10;
            border-left: 4px solid var(--color-player);
            padding-left: 16px;
            background: linear-gradient(90deg, rgba(0, 240, 255, 0.05) 0%, transparent 100%);
        }

        .title-block h1 {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--color-player);
            margin-bottom: 4px;
            font-family: var(--font-stack);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .title-block h2 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -1px;
            line-height: 1;
            text-transform: uppercase;
            font-family: var(--font-stack);
        }

        /* --- Inspector Panel --- */
        #inspector {
            background: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px;
            z-index: 20;
            box-shadow: -10px 0 40px rgba(0,0,0,0.6);
        }

        .panel-content {
            border: 1px solid var(--border-color);
            padding: 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.2);
        }

        .panel-header {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            background: var(--color-player);
            box-shadow: 0 0 8px var(--color-player);
            animation: blink 2s infinite;
        }

        /* Player Stats */
        .stat-group {
            margin-bottom: 40px;
        }

        .stat-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: block;
            text-transform: uppercase;
        }

        /* Health Bar */
        .bar-container {
            width: 100%;
            height: 4px;
            background: #1a202c;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            background: var(--color-player);
            width: 85%;
            opacity: 0.6; /* Subdued */
            box-shadow: 0 0 5px rgba(0, 240, 255, 0.3);
        }

        .health-values {
            display:flex; 
            justify-content:space-between; 
            margin-top:8px;
        }

        .health-val-num {
            font-size: 12px; 
            font-weight: 700; 
            color: var(--text-main); 
            opacity: 0.8;
        }

        .health-val-status {
            font-size: 10px; 
            color: var(--color-player); 
            opacity: 0.7;
        }

        /* Legend */
        .legend-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-muted); /* Neutralized text */
            opacity: 0.9;
        }

        .legend-item.player-item {
            color: var(--text-main);
            margin-bottom: 8px;
            padding-bottom: 12px;
            border-bottom: 1px dashed var(--border-color);
        }

        .legend-icon {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .legend-shape {
            width: 10px;
            height: 10px;
            border: 1px solid currentColor;
        }
        .shape-circle { border-radius: 50%; }
        .shape-diamond { transform: rotate(45deg); }

        .legend-desc {
            margin-left: auto;
            font-size: 9px;
            color: var(--text-dim);
            font-weight: 400;
            text-transform: uppercase;
        }

        /* Tooltip */
        #tooltip {
            position: absolute;
            background: rgba(5, 7, 10, 0.9);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
            transform: translate(15px, 15px);
            z-index: 100;
            backdrop-filter: blur(2px);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

<div id="app">
    <div id="arena-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="hud-overlay">
            <div class="title-block">
                <!-- Critique 1: Unified Header Style -->
                <h1>System Monitor</h1>
                <h2>Tactical AI Analysis</h2>
            </div>
        </div>

        <div id="tooltip">
            <div id="tt-title" style="font-weight:bold; margin-bottom:4px; color:#fff; letter-spacing:1px;">UNIT ID</div>
            <div id="tt-state" style="color:#fff; font-size:10px;">State: Idle</div>
        </div>
    </div>

    <aside id="inspector">
        <div class="panel-content">
            <div class="panel-header">
                <span>Live Inspector</span>
                <div class="status-indicator"></div>
            </div>

            <div class="stat-group">
                <span class="stat-label">Player Integrity</span>
                <div class="bar-container">
                    <div class="bar-fill" id="health-bar"></div>
                </div>
                <div class="health-values">
                    <span class="health-val-num">850 / 1000</span>
                    <span class="health-val-status">STABLE</span>
                </div>
            </div>

            <div class="stat-group">
                <span class="stat-label">AI Behavior Legend</span>
                <ul class="legend-list">
                    <!-- Player -->
                    <li class="legend-item player-item">
                        <div class="legend-icon"><div class="legend-shape shape-circle" style="background: var(--color-player); border:none;"></div></div>
                        <span>PLAYER UNIT</span>
                        <span class="legend-desc">Target</span>
                    </li>
                    <!-- States - Critique 7: Neutralized Text -->
                    <li class="legend-item" style="color: var(--text-muted);">
                        <div class="legend-icon"><div class="legend-shape shape-diamond" style="border-color: var(--color-patrol);"></div></div>
                        <span>PATROL</span>
                        <span class="legend-desc">Routine</span>
                    </li>
                    <li class="legend-item" style="color: var(--text-muted);">
                        <div class="legend-icon"><div class="legend-shape shape-diamond" style="border-color: var(--color-alert);"></div></div>
                        <span>ALERT</span>
                        <span class="legend-desc">Investigating</span>
                    </li>
                    <li class="legend-item" style="color: var(--text-muted);">
                        <div class="legend-icon"><div class="legend-shape shape-diamond" style="border-color: var(--color-chase);"></div></div>
                        <span>CHASE</span>
                        <span class="legend-desc">Vector Locked</span>
                    </li>
                    <li class="legend-item" style="color: var(--text-muted);">
                        <div class="legend-icon"><div class="legend-shape shape-diamond" style="border-color: var(--color-attack);"></div></div>
                        <span>ATTACK</span>
                        <span class="legend-desc">Engaging</span>
                    </li>
                </ul>
            </div>
        </div>
    </aside>
</div>

<script>
/**
 * Vector Utility
 */
class Vec2 {
    constructor(x, y) { this.x = x; this.y = y; }
    add(v) { return new Vec2(this.x + v.x, this.y + v.y); }
    sub(v) { return new Vec2(this.x - v.x, this.y - v.y); }
    mult(n) { return new Vec2(this.x * n, this.y * n); }
    mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
    normalize() {
        let m = this.mag();
        return m === 0 ? new Vec2(0, 0) : new Vec2(this.x / m, this.y / m);
    }
    dist(v) { return Math.sqrt(Math.pow(this.x - v.x, 2) + Math.pow(this.y - v.y, 2)); }
    copy() { return new Vec2(this.x, this.y); }
}

/**
 * Configuration
 */
const COLORS = {
    player: '#00f0ff',
    wall: '#0f1217',
    wallStroke: '#2a303c',
    patrol: '#00a8ff',
    alert: '#ffcc00',
    chase: '#ff2a2a',
    attack: '#ff0055'
};

const STATES = {
    PATROL: 'patrol',
    ALERT: 'alert',
    CHASE: 'chase',
    ATTACK: 'attack'
};

/**
 * Game Objects
 */
class Wall {
    constructor(x, y, w, h) {
        this.x = x; this.y = y; this.w = w; this.h = h;
    }
    
    draw(ctx) {
        ctx.save();
        
        // Critique 5: Standardized Wall Style
        // Dark fill
        ctx.fillStyle = COLORS.wall;
        ctx.beginPath();
        ctx.rect(this.x, this.y, this.w, this.h);
        ctx.fill();
        
        // 1px Stroke
        ctx.strokeStyle = COLORS.wallStroke;
        ctx.lineWidth = 1;
        ctx.stroke();

        // Corner Brackets
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        // Top Left
        ctx.moveTo(this.x + 10, this.y + 4);
        ctx.lineTo(this.x + 4, this.y + 4);
        ctx.lineTo(this.x + 4, this.y + 10);
        // Top Right
        ctx.moveTo(this.x + this.w - 10, this.y + 4);
        ctx.lineTo(this.x + this.w - 4, this.y + 4);
        ctx.lineTo(this.x + this.w - 4, this.y + 10);
        // Bottom Left
        ctx.moveTo(this.x + 4, this.y + this.h - 10);
        ctx.lineTo(this.x + 4, this.y + this.h - 4);
        ctx.lineTo(this.x + 10, this.y + this.h - 4);
        // Bottom Right
        ctx.moveTo(this.x + this.w - 4, this.y + this.h - 10);
        ctx.lineTo(this.x + this.w - 4, this.y + this.h - 4);
        ctx.lineTo(this.x + this.w - 10, this.y + this.h - 4);
        
        ctx.stroke();

        // Inner subtle fill for "thickness" illusion
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(this.x + 4, this.y + 4, this.w - 8, this.h - 8);

        ctx.restore();
    }
}

class Player {
    constructor(x, y) {
        this.pos = new Vec2(x, y);
        this.prevPos = new Vec2(x, y);
        this.target = new Vec2(x, y);
        this.speed = 3.5;
        this.angle = 0;
        this.radius = 10;
    }

    update() {
        this.prevPos = this.pos.copy();
        let dir = this.target.sub(this.pos);
        let dist = dir.mag();
        if (dist > 1) {
            dir = dir.normalize().mult(this.speed);
            this.pos = this.pos.add(dir);
            this.angle = Math.atan2(dir.y, dir.x);
        }
    }

    draw(ctx, time) {
        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        
        // Critique 6: Geometric Halo (Dashed Ring)
        ctx.rotate(time * 0.2); // Rotate
        ctx.beginPath();
        ctx.arc(0, 0, this.radius + 8, 0, Math.PI * 1.5); // partial ring
        ctx.strokeStyle = COLORS.player;
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 4]);
        ctx.globalAlpha = 0.7;
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1.0;
        ctx.rotate(-time * 0.2); // Un-rotate for body

        // Player Shape (Hexagon)
        ctx.shadowColor = COLORS.player;
        ctx.shadowBlur = 10; 
        
        ctx.fillStyle = '#05070a'; 
        ctx.strokeStyle = COLORS.player;
        ctx.lineWidth = 2;
        
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            const angle = (Math.PI / 3) * i;
            const x = this.radius * Math.cos(angle);
            const y = this.radius * Math.sin(angle);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Center Dot
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(0, 0, 2, 0, Math.PI*2);
        ctx.fill();

        ctx.restore();
    }
}

class Enemy {
    constructor(x, y, patrolPoints, initialState) {
        this.pos = new Vec2(x, y);
        this.patrolPoints = patrolPoints;
        this.currentPatrolIdx = 0;
        this.angle = 0;
        this.speed = 1.5;
        this.state = initialState || STATES.PATROL;
        
        this.visionRange = 180;
        this.visionAngle = Math.PI / 3;
        this.attackRange = 70;
        this.animOffset = Math.random() * 100;
    }

    update(player, walls) {
        let distToPlayer = this.pos.dist(player.pos);
        let vecToPlayer = player.pos.sub(this.pos);
        let angleToPlayer = Math.atan2(vecToPlayer.y, vecToPlayer.x);
        
        // Static Demo Logic
        switch (this.state) {
            case STATES.PATROL:
                this.moveTo(this.patrolPoints[this.currentPatrolIdx], this.speed);
                if (this.pos.dist(this.patrolPoints[this.currentPatrolIdx]) < 5) {
                    this.currentPatrolIdx = (this.currentPatrolIdx + 1) % this.patrolPoints.length;
                }
                break;

            case STATES.ALERT:
                // Move to investigation point
                let target = this.noiseSource ? this.noiseSource : this.patrolPoints[0];
                if (target) {
                    this.moveTo(target, this.speed * 1.2);
                }
                break;

            case STATES.CHASE:
                this.moveTo(player.pos, this.speed * 2.5);
                this.angle = angleToPlayer;
                break;

            case STATES.ATTACK:
                this.angle = angleToPlayer;
                // Jitter
                this.pos.x += Math.sin(Date.now() / 50) * 0.5;
                break;
        }
        
        // Basic Wall Collision
        walls.forEach(w => {
            if (this.pos.x > w.x && this.pos.x < w.x + w.w &&
                this.pos.y > w.y && this.pos.y < w.y + w.h) {
                let center = new Vec2(w.x + w.w/2, w.y + w.h/2);
                let push = this.pos.sub(center).normalize().mult(1);
                this.pos = this.pos.add(push);
            }
        });
    }

    moveTo(target, spd) {
        let dir = target.sub(this.pos);
        let dist = dir.mag();
        if (dist > 1) {
            this.angle = Math.atan2(dir.y, dir.x);
            dir = dir.normalize().mult(spd);
            this.pos = this.pos.add(dir);
        }
    }

    draw(ctx, playerPos, time) {
        let color = COLORS.patrol;
        let opacity = 0.5;

        if (this.state === STATES.ALERT) { color = COLORS.alert; opacity = 0.8; }
        if (this.state === STATES.CHASE) { color = COLORS.chase; opacity = 1.0; }
        if (this.state === STATES.ATTACK) { color = COLORS.attack; opacity = 1.0; }

        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        ctx.rotate(this.angle);
        ctx.globalAlpha = opacity;

        // --- Critique 4: Refined Visual Layering (Cone) ---
        if (this.state !== STATES.PATROL) {
            // Draw Detection Cone
            ctx.beginPath();
            ctx.moveTo(0, 0);
            let tipX = this.visionRange;
            let tipY = this.visionRange * Math.tan(this.visionAngle/2);
            
            ctx.lineTo(tipX, tipY);
            ctx.lineTo(tipX, -tipY);
            ctx.closePath();
            
            // Low-opacity gradient fill
            let grad = ctx.createLinearGradient(0, 0, tipX, 0);
            grad.addColorStop(0, color + '40'); 
            grad.addColorStop(1, color + '00');
            
            ctx.fillStyle = grad;
            ctx.fill();
            
            // Scanline pattern inside cone
            ctx.save();
            ctx.clip();
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(0,0,0,0.6)';
            ctx.lineWidth = 1;
            // Diagonal scanlines
            for(let i = -tipY; i < tipY; i+=4) {
                ctx.moveTo(0, i); 
                ctx.lineTo(tipX, i + (tipX/2)); 
            }
            ctx.stroke();
            ctx.restore();

            // Cone Border
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(tipX, tipY);
            ctx.lineTo(tipX, -tipY);
            ctx.strokeStyle = color + '60'; 
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        // --- Enemy Shape (Diamond) ---
        ctx.globalAlpha = opacity;
        ctx.shadowColor = color;
        ctx.shadowBlur = this.state === STATES.PATROL ? 0 : 10;
        ctx.fillStyle = '#05070a'; 
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.lineTo(0, 7);
        ctx.lineTo(-10, 0);
        ctx.lineTo(0, -7);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        
        ctx.restore();

        // --- Critique 2 & 3: Path & Range Visualization ---
        
        // 1. Patrol Route (Closed Loop)
        if (this.state === STATES.PATROL && this.patrolPoints.length > 0) {
            ctx.strokeStyle = COLORS.patrol;
            ctx.globalAlpha = 0.3;
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(this.patrolPoints[0].x, this.patrolPoints[0].y);
            for(let i=1; i<this.patrolPoints.length; i++) {
                ctx.lineTo(this.patrolPoints[i].x, this.patrolPoints[i].y);
            }
            ctx.closePath(); // Explicitly close loop
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Waypoints
            ctx.fillStyle = COLORS.patrol;
            this.patrolPoints.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
                ctx.fill();
            });
        }

        // 2. Chase Vector
        if (this.state === STATES.CHASE && playerPos) {
            ctx.strokeStyle = COLORS.chase;
            ctx.globalAlpha = 0.6;
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.moveTo(this.pos.x, this.pos.y);
            
            // Quadratic curve for pathfinding illusion
            let midX = (this.pos.x + playerPos.x) / 2;
            let midY = (this.pos.y + playerPos.y) / 2;
            ctx.quadraticCurveTo(midX + 40, midY - 40, playerPos.x, playerPos.y);
            
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.globalAlpha = 1.0;
        }

        // 3. Alert Investigation (Dotted Line)
        if (this.state === STATES.ALERT && this.noiseSource) {
            ctx.strokeStyle = COLORS.alert;
            ctx.globalAlpha = 0.5;
            ctx.setLineDash([2, 3]); // Dotted
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(this.pos.x, this.pos.y);
            ctx.lineTo(this.noiseSource.x, this.noiseSource.y);
            ctx.stroke();
            ctx.setLineDash([]);

            // Investigation Target
            ctx.save();
            ctx.translate(this.noiseSource.x, this.noiseSource.y);
            let scale = 1 + Math.sin(time * 0.2) * 0.2;
            ctx.scale(scale, scale);
            ctx.strokeStyle = COLORS.alert;
            ctx.lineWidth = 2;
            // Crosshair
            ctx.beginPath();
            ctx.moveTo(-5, 0); ctx.lineTo(5, 0);
            ctx.moveTo(0, -5); ctx.lineTo(0, 5);
            ctx.stroke();
            // Ring
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI*2);
            ctx.stroke();
            ctx.restore();
        }

        // 4. Attack Range & Target Lock
        if (this.state === STATES.ATTACK && playerPos) {
            // Critique 3: Distinct Attack Range Circle
            ctx.strokeStyle = COLORS.attack;
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.3;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.arc(this.pos.x, this.pos.y, this.attackRange, 0, Math.PI*2);
            ctx.stroke();
            ctx.setLineDash([]);

            // Target Lock Line
            ctx.strokeStyle = COLORS.attack;
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.4;
            ctx.beginPath();
            ctx.moveTo(this.pos.x, this.pos.y);
            ctx.lineTo(playerPos.x, playerPos.y);
            ctx.stroke();
            
            // Rotating Reticle on Player
            ctx.save();
            ctx.translate(playerPos.x, playerPos.y);
            ctx.rotate(time * 0.1);
            ctx.strokeStyle = COLORS.attack;
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.8;
            ctx.beginPath();
            ctx.moveTo(-15, -10); ctx.lineTo(-15, -15); ctx.lineTo(-10, -15);
            ctx.moveTo(15, -10); ctx.lineTo(15, -15); ctx.lineTo(10, -15);
            ctx.moveTo(-15, 10); ctx.lineTo(-15, 15); ctx.lineTo(-10, 15);
            ctx.moveTo(15, 10); ctx.lineTo(15, 15); ctx.lineTo(10, 15);
            ctx.stroke();
            ctx.restore();
        }

        // State Label
        ctx.fillStyle = color;
        ctx.globalAlpha = opacity;
        ctx.font = 'bold 10px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(this.state.toUpperCase(), this.pos.x, this.pos.y - 18);
        ctx.globalAlpha = 1.0;
    }
}

/**
 * Main System
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
const ttTitle = document.getElementById('tt-title');
const ttState = document.getElementById('tt-state');

let width, height;
let player;
let enemies = [];
let walls = [];
let mousePos = new Vec2(0,0);
let time = 0;

function resize() {
    width = canvas.parentElement.offsetWidth;
    height = canvas.parentElement.offsetHeight;
    canvas.width = width;
    canvas.height = height;
    initLevel();
}

function initLevel() {
    // Player
    player = new Player(width * 0.65, height * 0.5);
    player.target = player.pos.copy();

    // Walls
    walls = [
        new Wall(width * 0.3, height * 0.3, width * 0.2, 20),
        new Wall(width * 0.1, height * 0.6, 20, height * 0.2),
        new Wall(width * 0.4, height * 0.7, width * 0.3, 20),
        new Wall(width * 0.75, height * 0.2, 20, height * 0.15)
    ];

    // Enemy A: CHASE
    let enemyA = new Enemy(width * 0.2, height * 0.5, [], STATES.CHASE);
    
    // Enemy B: ATTACK
    let enemyB = new Enemy(width * 0.75, height * 0.35, [], STATES.ATTACK);

    // Enemy C: ALERT
    let noiseSource = new Vec2(width * 0.35, height * 0.75); 
    let enemyC = new Enemy(width * 0.15, height * 0.8, [], STATES.ALERT);
    enemyC.noiseSource = noiseSource;

    // Enemy D: PATROL
    let patrolPath = [
        new Vec2(width * 0.8, height * 0.8),
        new Vec2(width * 0.9, height * 0.8),
        new Vec2(width * 0.9, height * 0.6),
        new Vec2(width * 0.8, height * 0.6)
    ];
    let enemyD = new Enemy(patrolPath[0].x, patrolPath[0].y, patrolPath, STATES.PATROL);

    enemies = [enemyA, enemyB, enemyC, enemyD];
}

// Interaction
window.addEventListener('resize', resize);
canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mousePos = new Vec2(e.clientX - rect.left, e.clientY - rect.top);
    player.target = mousePos;

    let hovered = null;
    enemies.forEach(en => {
        if (en.pos.dist(mousePos) < 30) hovered = en;
    });

    if (hovered) {
        canvas.style.cursor = 'pointer';
        tooltip.style.opacity = 1;
        tooltip.style.left = (e.clientX + 15) + 'px';
        tooltip.style.top = (e.clientY + 15) + 'px';
        ttTitle.innerText = "Enemy Unit " + (enemies.indexOf(hovered) + 1);
        ttState.innerText = "State: " + hovered.state.toUpperCase();
        
        let c = COLORS.patrol;
        if(hovered.state === STATES.ALERT) c = COLORS.alert;
        if(hovered.state === STATES.CHASE) c = COLORS.chase;
        if(hovered.state === STATES.ATTACK) c = COLORS.attack;
        ttState.style.color = c;

    } else {
        canvas.style.cursor = 'crosshair';
        tooltip.style.opacity = 0;
    }
});

function animate() {
    time++;
    ctx.clearRect(0, 0, width, height);

    // Logic
    player.update();
    enemies.forEach(en => en.update(player, walls));

    // Draw Layers
    walls.forEach(w => w.draw(ctx));
    
    // Sort by Y for pseudo-depth
    const renderList = [...enemies, player].sort((a, b) => a.pos.y - b.pos.y);
    
    renderList.forEach(obj => {
        if (obj instanceof Enemy) {
            obj.draw(ctx, player.pos, time);
        } else {
            obj.draw(ctx, time);
        }
    });

    requestAnimationFrame(animate);
}

// Init
resize();
animate();

</script>
</body>
