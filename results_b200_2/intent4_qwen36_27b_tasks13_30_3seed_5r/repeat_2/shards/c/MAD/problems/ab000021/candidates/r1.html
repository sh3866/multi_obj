<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Architecture Data Flow</title>
<style>
    :root {
        --bg-color: #0b1120;
        --bg-grid: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        
        /* Flow Colors */
        --color-data: #38bdf8;      /* Sky Blue */
        --color-instruction: #f472b6; /* Pink */
        --color-control: #4ade80;   /* Green */
        
        /* Zone Colors */
        --zone-core: rgba(56, 189, 248, 0.05);
        --zone-periph: rgba(244, 114, 182, 0.03);

        --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background-color: var(--bg-color);
        background-image: 
            linear-gradient(var(--bg-grid) 1px, transparent 1px),
            linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
        background-size: 40px 40px;
        color: var(--text-main);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* UI Overlay */
    .ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
    }

    header {
        position: absolute;
        top: 40px;
        left: 50px;
        pointer-events: auto;
    }

    h1 {
        font-size: 2.5rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin-bottom: 0.5rem;
        background: linear-gradient(to right, #fff, #94a3b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .subtitle {
        color: var(--text-muted);
        font-size: 1rem;
        font-weight: 400;
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }

    .legend {
        position: absolute;
        top: 40px;
        right: 50px;
        display: flex;
        gap: 24px;
        background: rgba(15, 23, 42, 0.8);
        padding: 16px 24px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.1);
        backdrop-filter: blur(10px);
        pointer-events: auto;
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: 0.02em;
    }

    .line-indicator {
        width: 24px;
        height: 4px;
        border-radius: 2px;
        box-shadow: 0 0 8px currentColor;
    }

    /* SVG Container */
    #diagram-container {
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 1;
    }

    svg {
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    /* Zone Styles */
    .zone-bg {
        fill: none;
        stroke: rgba(255,255,255,0.05);
        stroke-dasharray: 10 5;
        stroke-width: 1;
    }

    .zone-label {
        fill: rgba(255,255,255,0.15);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        text-anchor: middle;
    }

    /* Component Styles */
    .component-group {
        cursor: pointer;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .component-group:hover {
        transform: translateY(-4px);
        z-index: 20; /* Bring to front */
    }

    /* Base Node Styles */
    .node-rect {
        fill: #1e293b;
        stroke-width: 2;
        rx: 12;
        filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        transition: stroke 0.3s, fill 0.3s;
    }
    
    .node-hex {
        fill: #1e293b;
        stroke-width: 2;
        filter: drop-shadow(0 0 20px rgba(244, 114, 182, 0.2));
        transition: stroke 0.3s, fill 0.3s;
    }

    .comp-label {
        fill: var(--text-main);
        font-size: 16px;
        font-weight: 800;
        text-anchor: middle;
        font-family: var(--font-stack);
        letter-spacing: -0.02em;
    }

    .comp-sub {
        fill: var(--text-muted);
        font-size: 11px;
        font-weight: 500;
        text-anchor: middle;
        font-family: var(--font-stack);
        opacity: 0.8;
    }

    /* Connector Styles */
    .path-bg {
        fill: none;
        stroke: rgba(255,255,255,0.03);
        stroke-width: 6; /* Thick track */
        stroke-linecap: round;
    }

    .path-line {
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        filter: drop-shadow(0 0 4px currentColor);
    }

    .path-dash {
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: 5 15;
        opacity: 0.6;
        animation: dash 1.5s linear infinite;
    }

    .path-particle {
        fill: none;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 1 200; /* Single dot */
        filter: drop-shadow(0 0 6px currentColor);
        animation: flow-particle 2s linear infinite;
    }

    /* Colors */
    .c-data { stroke: var(--color-data); color: var(--color-data); }
    .c-inst { stroke: var(--color-instruction); color: var(--color-instruction); }
    .c-ctrl { stroke: var(--color-control); color: var(--color-control); }

    /* Animations */
    @keyframes dash {
        to { stroke-dashoffset: -20; }
    }
    
    @keyframes flow-particle {
        0% { stroke-dashoffset: 200; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
    }

    /* Interactivity */
    .dimmed { opacity: 0.15 !important; transition: opacity 0.3s; }
    .highlighted { opacity: 1 !important; transition: opacity 0.3s; }

</style>
</head>
<body>

    <div class="ui-layer">
        <header>
            <h1>System Architecture</h1>
            <div class="subtitle">Information Flow &amp; Topology</div>
        </header>

        <div class="legend">
            <div class="legend-item">
                <div class="line-indicator" style="background-color: var(--color-instruction)"></div>
                <span>Instructions</span>
            </div>
            <div class="legend-item">
                <div class="line-indicator" style="background-color: var(--color-data)"></div>
                <span>Data</span>
            </div>
            <div class="legend-item">
                <div class="line-indicator" style="background-color: var(--color-control)"></div>
                <span>Control</span>
            </div>
        </div>
    </div>

    <div id="diagram-container">
        <svg id="main-svg" viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid meet">
            <defs>
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>
            
            <!-- 1. Zones Layer -->
            <g id="zones-layer"></g>
            
            <!-- 2. Connections Layer -->
            <g id="paths-layer"></g>
            
            <!-- 3. Components Layer -->
            <g id="components-layer"></g>
        </svg>
    </div>

<script>
    // --- Configuration ---
    const svg = document.getElementById('main-svg');
    const zonesLayer = document.getElementById('zones-layer');
    const pathsLayer = document.getElementById('paths-layer');
    const componentsLayer = document.getElementById('components-layer');

    const createSVG = (tag, attrs) => {
        const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
        return el;
    };

    // --- Layout Data ---
    // Center CPU (500, 400)
    // Memory Top (500, 150)
    // Storage Bottom (500, 650)
    // Input Left (250, 400)
    // Output Left (250, 200)
    // Network Left (250, 600)
    // GPU Right (750, 400)

    const components = [
        { id: 'cpu', label: 'CPU', sub: 'Central Processing', x: 500, y: 400, type: 'core', shape: 'hex' },
        { id: 'ram', label: 'Memory', sub: 'High Speed RAM', x: 500, y: 150, type: 'core', shape: 'rect' },
        { id: 'storage', label: 'Storage', sub: 'NVMe SSD', x: 500, y: 650, type: 'core', shape: 'rect' },
        { id: 'gpu', label: 'GPU', sub: 'Graphics Engine', x: 750, y: 400, type: 'periph', shape: 'rect' },
        { id: 'input', label: 'Input', sub: 'Keyboard / Mouse', x: 250, y: 400, type: 'periph', shape: 'rect' },
        { id: 'output', label: 'Output', sub: 'Display / Audio', x: 250, y: 200, type: 'periph', shape: 'rect' },
        { id: 'network', label: 'Network', sub: 'Ethernet / Wi-Fi', x: 250, y: 600, type: 'periph', shape: 'rect' }
    ];

    const connections = [
        // CPU <-> Memory (Split)
        { from: 'ram', to: 'cpu', type: 'inst', label: 'Fetch' },
        { from: 'cpu', to: 'ram', type: 'data', label: 'Store' },
        
        // CPU -> Peripherals (Control)
        { from: 'cpu', to: 'gpu', type: 'ctrl', label: 'Command' },
        { from: 'cpu', to: 'input', type: 'ctrl', label: 'Poll' },
        { from: 'cpu', to: 'output', type: 'ctrl', label: 'Signal' },
        { from: 'cpu', to: 'storage', type: 'ctrl', label: 'IO Cmd' },
        { from: 'cpu', to: 'network', type: 'ctrl', label: 'Packet Ctrl' },

        // Data Flows
        { from: 'storage', to: 'ram', type: 'data', label: 'Load' },
        { from: 'input', to: 'cpu', type: 'data', label: 'Events' },
        { from: 'cpu', to: 'output', type: 'data', label: 'Display' },
        { from: 'network', to: 'cpu', type: 'data', label: 'Incoming' },
        { from: 'cpu', to: 'gpu', type: 'data', label: 'Render' }
    ];

    // --- Draw Zones ---
    const drawZones = () => {
        // Core Zone (Vertical)
        const coreRect = createSVG('rect', {
            x: 350, y: 80, width: 300, height: 640, rx: 40,
            fill: 'var(--zone-core)', stroke: 'rgba(56, 189, 248, 0.1)', 'stroke-width': 1, class: 'zone-bg'
        });
        const coreLabel = createSVG('text', { x: 500, y: 750, class: 'zone-label' });
        coreLabel.textContent = "Processing Core";
        
        // Peripheral Zone (Left)
        const periphRect = createSVG('rect', {
            x: 100, y: 130, width: 300, height: 540, rx: 40,
            fill: 'var(--zone-periph)', stroke: 'rgba(244, 114, 182, 0.1)', 'stroke-width': 1, class: 'zone-bg'
        });
        const periphLabel = createSVG('text', { x: 250, y: 750, class: 'zone-label' });
        periphLabel.textContent = "Peripherals";

        zonesLayer.appendChild(coreRect);
        zonesLayer.appendChild(coreLabel);
        zonesLayer.appendChild(periphRect);
        zonesLayer.appendChild(periphLabel);
    };

    // --- Draw Icons ---
    const drawIcon = (id, x, y) => {
        let g = createSVG('g', { transform: `translate(${x-14}, ${y-14})` });
        // Icons drawn with white strokes
        const strokeProps = { stroke:'#cbd5e1', 'stroke-width':2, fill:'none', 'stroke-linecap':'round', 'stroke-linejoin':'round' };
        
        if(id === 'cpu') {
            g.appendChild(createSVG('rect', { x:4, y:4, width:20, height:20, rx:4, ...strokeProps }));
            g.appendChild(createSVG('rect', { x:9, y:9, width:10, height:10, rx:2, fill:'#cbd5e1' }));
        } else if (id === 'ram') {
            g.appendChild(createSVG('path', { d:"M4 4h16v16H4z M4 8h16 M4 12h16 M4 16h16", ...strokeProps }));
        } else if (id === 'gpu') {
            g.appendChild(createSVG('path', { d:"M4 4h16v16H4z M8 12l3-3 3 3 3-3", ...strokeProps }));
        } else if (id === 'storage') {
            g.appendChild(createSVG('path', { d:"M4 4h16v16H4z M12 10a3 3 0 1 0 0 6 3 3 0 0 0 0-6z", ...strokeProps }));
        } else if (id === 'input') {
            g.appendChild(createSVG('path', { d:"M8 4h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z M12 8v4", ...strokeProps }));
        } else if (id === 'output') {
            g.appendChild(createSVG('path', { d:"M4 4h16v12H4z M8 20h8 M12 16v4", ...strokeProps }));
        } else if (id === 'network') {
            g.appendChild(createSVG('path', { d:"M12 18v-2 M8 14a5 5 0 0 1 8 0 M4 10a9 9 0 0 1 16 0", ...strokeProps }));
        }
        return g;
    };

    // --- Render Components ---
    const compMap = {};
    const nodeWidth = 140;
    const nodeHeight = 80;

    components.forEach(c => {
        const g = createSVG('g', { 
            class: 'component-group', 
            transform: `translate(${c.x - nodeWidth/2}, ${c.y - nodeHeight/2})`,
            'data-id': c.id
        });

        // Shape
        let shape;
        if (c.shape === 'hex') {
            // Hexagon centered at 70, 40
            shape = createSVG('polygon', {
                points: "70 5, 125 20, 125 60, 70 75, 15 60, 15 20",
                class: 'node-hex',
                stroke: 'var(--color-instruction)' // CPU gets pink accent
            });
        } else {
            shape = createSVG('rect', { 
                width: nodeWidth, height: nodeHeight, 
                class: 'node-rect',
                stroke: (c.id === 'gpu') ? 'var(--color-data)' : '#334155'
            });
        }
        
        // Icon
        const icon = drawIcon(c.id, 70, 30);

        // Labels
        const textLabel = createSVG('text', { x: 70, y: 60, class: 'comp-label' });
        textLabel.textContent = c.label;
        
        const textSub = createSVG('text', { x: 70, y: 72, class: 'comp-sub' });
        textSub.textContent = c.sub;

        g.appendChild(shape);
        g.appendChild(icon);
        g.appendChild(textLabel);
        g.appendChild(textSub);
        
        componentsLayer.appendChild(g);
        compMap[c.id] = c;

        // Hover Logic
        g.addEventListener('mouseenter', () => highlightPath(c.id));
        g.addEventListener('mouseleave', () => resetHighlight());
    });

    // --- Render Paths ---
    
    // Straight line generator with offset for parallel lines
    const getPathD = (c1, c2, offset = 0) => {
        // Determine direction
        const dx = c2.x - c1.x;
        const dy = c2.y - c1.y;
        
        // Calculate perpendicular vector for offset
        // Normal vector (-dy, dx) normalized
        const len = Math.sqrt(dx*dx + dy*dy);
        const nx = -dy / len;
        const ny = dx / len;

        const x1 = c1.x + nx * offset;
        const y1 = c1.y + ny * offset;
        const x2 = c2.x + nx * offset;
        const y2 = c2.y + ny * offset;

        return `M ${x1} ${y1} L ${x2} ${y2}`;
    };

    const pathGroups = {};

    connections.forEach((conn, index) => {
        const start = compMap[conn.from];
        const end = compMap[conn.to];
        
        // Logic for parallel lines (CPU <-> Memory)
        let offset = 0;
        if ((conn.from === 'ram' && conn.to === 'cpu') || (conn.from === 'cpu' && conn.to === 'ram')) {
            offset = (conn.type === 'inst') ? -8 : 8;
        }

        const g = createSVG('g', { 
            class: 'connection-group', 
            'data-from': conn.from, 
            'data-to': conn.to,
            style: 'pointer-events: none;' // Let clicks pass through to components
        });

        // 1. Background Track (Wide transparent area)
        const bgPath = createSVG('path', {
            d: getPathD(start, end, offset),
            stroke: 'transparent',
            'stroke-width': 20,
            fill: 'none',
            class: 'hit-area'
        });

        // 2. Visible Track (Solid faint line)
        const trackColor = `var(--color-${conn.type === 'inst' ? 'instruction' : conn.type})`;
        const visiblePath = createSVG('path', {
            d: getPathD(start, end, offset),
            class: 'path-bg',
            stroke: trackColor,
            'stroke-opacity': 0.1
        });

        // 3. Solid Line (The main colored line)
        const mainLine = createSVG('path', {
            d: getPathD(start, end, offset),
            class: `path-line c-${conn.type === 'inst' ? 'inst' : conn.type}`
        });

        // 4. Animated Dash (Movement)
        const activePath = createSVG('path', {
            d: getPathD(start, end, offset),
            class: `path-dash c-${conn.type === 'inst' ? 'inst' : conn.type}`,
            style: `animation-delay: ${Math.random() * -2}s`
        });

        // 5. Glowing Particle
        const particle = createSVG('path', {
            d: getPathD(start, end, offset),
            class: `path-particle c-${conn.type === 'inst' ? 'inst' : conn.type}`,
            style: `animation-delay: ${Math.random() * -2}s`
        });

        g.appendChild(bgPath);
        g.appendChild(visiblePath);
        g.appendChild(mainLine);
        g.appendChild(activePath);
        g.appendChild(particle);

        pathsLayer.appendChild(g);
        
        // Store ref for highlighting
        if (!pathGroups[conn.from]) pathGroups[conn.from] = [];
        if (!pathGroups[conn.to]) pathGroups[conn.to] = [];
        pathGroups[conn.from].push(g);
        pathGroups[conn.to].push(g);
    });

    // --- Interactivity ---

    function highlightPath(activeId) {
        // Dim everything first
        document.querySelectorAll('.connection-group').forEach(el => el.classList.add('dimmed'));
        document.querySelectorAll('.component-group').forEach(el => {
            if(el.getAttribute('data-id') !== activeId) el.classList.add('dimmed');
        });
        zonesLayer.classList.add('dimmed');

        // Highlight active component
        const activeComp = document.querySelector(`.component-group[data-id="${activeId}"]`);
        if(activeComp) activeComp.classList.add('highlighted');

        // Highlight connected paths
        const connectedGroups = pathGroups[activeId] || [];
        connectedGroups.forEach(g => {
            g.classList.remove('dimmed');
            g.classList.add('highlighted');
            
            // Find connected components and highlight them too
            const from = g.getAttribute('data-from');
            const to = g.getAttribute('data-to');
            if(from !== activeId) document.querySelector(`.component-group[data-id="${from}"]`).classList.add('highlighted');
            if(to !== activeId) document.querySelector(`.component-group[data-id="${to}"]`).classList.add('highlighted');
        });
    }

    function resetHighlight() {
        document.querySelectorAll('.connection-group').forEach(el => {
            el.classList.remove('dimmed');
            el.classList.remove('highlighted');
        });
        document.querySelectorAll('.component-group').forEach(el => {
            el.classList.remove('dimmed');
            el.classList.remove('highlighted');
        });
        zonesLayer.classList.remove('dimmed');
    }

    // --- Init ---
    drawZones();

</script>
</body>
</html>
