<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Rickshaw | Design Showcase</title>
    <style>
        :root {
            /* Palette - Vibrant Street */
            --bg-color: #f0f2f5;
            --bg-accent: #e1e4e8;
            
            /* Vehicle Colors - Dynamic */
            --body-color: #FFC107; 
            --body-shadow: #FF9800;
            --body-highlight: #FFD54F;
            --roof-color: #212121; /* Classic Black Roof */
            --roof-shadow: #000000;
            
            /* System & Strokes */
            --stroke-color: #1a1a1a;
            --stroke-width: 2px;
            --chrome-light: #ffffff;
            --chrome-mid: #d7d7d7;
            --chrome-dark: #9e9e9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Canvas Styling */
        .canvas-stage {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* The Main SVG */
        #rickshaw-svg {
            width: 100%;
            height: 100%;
            max-width: 1200px; /* Scale up constraint */
            overflow: visible;
        }

        /* UI Controls (Floating) */
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            gap: 20px;
            align-items: center;
            z-index: 100;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .controls label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #555;
        }

        .color-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid white;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.active {
            transform: scale(1.2);
            box-shadow: 0 0 0 2px var(--stroke-color);
        }

        /* Animation for wheels */
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        .wheel-spin {
            transform-origin: center;
            animation: spin 0.5s linear infinite; /* Fast spin for effect */
        }

        /* Typography Overlay */
        .overlay-text {
            position: absolute;
            top: 40px;
            left: 40px;
            pointer-events: none;
        }
        .overlay-text h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #222;
            letter-spacing: -0.5px;
        }
        .overlay-text p {
            font-size: 0.9rem;
            color: #666;
            font-weight: 500;
            margin-top: 5px;
        }

    </style>
</head>
<body>

    <div class="overlay-text">
        <h1>THE URBAN LEGEND</h1>
        <p>Vector Series 001 • 3-Wheel Geometry</p>
    </div>

    <div class="canvas-stage">
        <!-- SVG Canvas: 1000x800 viewBox for detailed perspective -->
        <svg id="rickshaw-svg" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Body Gradient (Side facing light) -->
                <linearGradient id="grad-body-side" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:var(--body-highlight)" />
                    <stop offset="40%" style="stop-color:var(--body-color)" />
                    <stop offset="100%" style="stop-color:var(--body-shadow)" />
                </linearGradient>

                <!-- Body Gradient (Front/Right facing shadow) -->
                <linearGradient id="grad-body-front" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:var(--body-shadow)" />
                    <stop offset="100%" style="stop-color:#d88900" />
                </linearGradient>

                <!-- Roof Gradient -->
                <linearGradient id="grad-roof" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#444" />
                    <stop offset="100%" style="stop-color:var(--roof-shadow)" />
                </linearGradient>

                <!-- Chrome Gradient -->
                <linearGradient id="grad-chrome" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:var(--chrome-light)" />
                    <stop offset="40%" style="stop-color:var(--chrome-mid)" />
                    <stop offset="60%" style="stop-color:var(--chrome-light)" />
                    <stop offset="100%" style="stop-color:var(--chrome-dark)" />
                </linearGradient>

                <!-- Glass Gradient -->
                <linearGradient id="grad-glass" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#aeeeff;stop-opacity:0.6" />
                    <stop offset="100%" style="stop-color:#2874a6;stop-opacity:0.3" />
                </linearGradient>
            </defs>

            <!-- === GROUND SHADOW (Anchoring) === -->
            <!-- Large dark shadow to ground the vehicle -->
            <ellipse cx="500" cy="680" rx="380" ry="45" fill="rgba(0,0,0,0.3)" filter="blur(10px)" />

            <!-- === VEHICLE GROUP (Centered) === -->
            <g id="vehicle-group" transform="translate(50, 50)">

                <!-- 1. REAR WHEELS (The 3rd Wheel & Axle) -->
                <!-- Left Rear Wheel (Visible on far side) -->
                <g transform="translate(280, 620)">
                    <circle cx="0" cy="0" r="75" fill="#1a1a1a" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)"/>
                    <circle cx="0" cy="0" r="40" fill="#ddd" stroke="#333" stroke-width="2"/>
                    <g class="wheel-spin">
                        <path d="M-40,0 L40,0 M0,-40 L0,40 M-28,-28 L28,28 M-28,28 L28,-28" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                    </g>
                </g>

                <!-- Right Rear Wheel (Visible on near side) -->
                <g transform="translate(720, 620)">
                    <circle cx="0" cy="0" r="75" fill="#1a1a1a" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)"/>
                    <circle cx="0" cy="0" r="40" fill="#ddd" stroke="#333" stroke-width="2"/>
                    <g class="wheel-spin">
                        <path d="M-40,0 L40,0 M0,-40 L0,40 M-28,-28 L28,28 M-28,28 L28,-28" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                    </g>
                </g>

                <!-- Rear Axle/Chassis Connection -->
                <rect x="280" y="615" width="440" height="10" fill="#333" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)"/>

                <!-- Rear Mudguards (Overlapping tires) -->
                <!-- Left Rear -->
                <path d="M205,620 Q280,500 355,620" fill="none" stroke="var(--body-color)" stroke-width="22" stroke-linecap="round"/>
                <path d="M205,620 Q280,500 355,620" fill="none" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" stroke-linecap="round"/>
                <!-- Right Rear -->
                <path d="M645,620 Q720,500 795,620" fill="none" stroke="var(--body-color)" stroke-width="22" stroke-linecap="round"/>
                <path d="M645,620 Q720,500 795,620" fill="none" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" stroke-linecap="round"/>


                <!-- 2. REAR ENCLOSED CABIN (The Box) -->
                <!-- Back Wall (Inner Depth) -->
                <path d="M240,400 L760,400 L760,600 L240,600 Z" fill="#d88900" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)"/>
                
                <!-- Interior Back Seat -->
                <path d="M260,500 L740,500 L740,580 L260,580 Z" fill="#333" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)"/>

                <!-- Left Side Wall (The dominant yellow panel) -->
                <path d="M240,400 L180,300 L250,280 L310,380 Z" fill="var(--body-shadow)" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)"/>
                
                <!-- Right Side Wall (Main Face) -->
                <path d="M240,400 L760,400 L760,600 L240,600 Z" fill="url(#grad-body-side)" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)"/>

                <!-- Window Cutout (Right Side) -->
                <path d="M270,430 L730,430 L730,560 L270,560 Z" fill="#2c3e50" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)"/>
                
                <!-- Window Sticker (Ornament) -->
                <g transform="translate(350, 480)">
                    <rect x="0" y="0" width="100" height="30" fill="#fff" rx="4" opacity="0.9" transform="rotate(-2)"/>
                    <text x="50" y="20" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#C0392B" transform="rotate(-2)">JAI SHRI RAM</text>
                </g>

                <!-- Door Outline -->
                <path d="M450,430 L450,560" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" stroke-dasharray="5,5"/>


                <!-- 3. ROOF (Canopy) -->
                <!-- Roof Top Surface -->
                <path d="M180,250 L250,230 L850,230 L760,250 Z" fill="url(#grad-roof)" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)"/>
                
                <!-- Roof Side Overhang (Left - Shadowed) -->
                <path d="M180,250 L240,400 L180,300 Z" fill="#111" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)"/>
                
                <!-- Roof Side Overhang (Right - Main) -->
                <path d="M240,400 L760,400 L760,250 L180,250 Z" fill="url(#grad-roof)" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)"/>

                <!-- Roof Supports (Chrome) -->
                <line x1="240" y1="400" x2="180" y2="250" stroke="url(#grad-chrome)" stroke-width="4" stroke-linecap="round"/>
                <line x1="760" y1="400" x2="760" y2="250" stroke="url(#grad-chrome)" stroke-width="4" stroke-linecap="round"/>
                <line x1="500" y1="400" x2="500" y2="230" stroke="url(#grad-chrome)" stroke-width="4" stroke-linecap="round"/>


                <!-- 4. DRIVER ASSEMBLY -->
                <!-- Driver Seat Backrest -->
                <path d="M550,380 L650,380 L650,480 L550,480 Z" fill="#333" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)"/>
                
                <!-- Driver Silhouette -->
                <g transform="translate(600, 350)">
                    <circle cx="0" cy="0" r="22" fill="#333" /> <!-- Head -->
                    <path d="M-20,20 L20,20 L15,70 L-15,70 Z" fill="#fff" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" /> <!-- Shirt -->
                </g>

                <!-- Windshield (Glass Panel) -->
                <path d="M760,400 L880,420 L880,520 L760,500 Z" fill="url(#grad-glass)" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)"/>
                <!-- Windshield Support -->
                <line x1="760" y1="400" x2="760" y2="500" stroke="url(#grad-chrome)" stroke-width="4"/>

                <!-- Handlebars -->
                <g transform="translate(840, 450)">
                    <path d="M0,0 L-20,40 L-60,40" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round" />
                    <circle cx="-60" cy="40" r="8" fill="#111" /> <!-- Grip -->
                    <!-- Mirror Stem -->
                    <path d="M0,0 L10,-30" stroke="#333" stroke-width="4" />
                    <!-- Side Mirror -->
                    <circle cx="10" cy="-30" r="12" fill="#ccc" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)"/>
                </g>

                <!-- 5. FRONT CHASSIS -->
                <!-- Front Fork (Chrome) -->
                <path d="M880,500 L920,620 L890,620 L850,500 Z" fill="url(#grad-chrome)" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)"/>
                
                <!-- Engine Block -->
                <path d="M750,550 L850,550 L850,620 L750,620 Z" fill="#333" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)"/>
                <!-- Engine Fins -->
                <path d="M760,560 L840,560 M760,570 L840,570 M760,580 L840,580" stroke="#555" stroke-width="2"/>
                <!-- Exhaust Pipe -->
                <path d="M850,590 L950,600 L950,610 L850,600 Z" fill="#888" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)"/>

                <!-- Front Wheel (Single) -->
                <g transform="translate(910, 620)">
                    <circle cx="0" cy="0" r="85" fill="#1a1a1a" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)"/>
                    <circle cx="0" cy="0" r="45" fill="#ddd" stroke="#333" stroke-width="2"/>
                    <g class="wheel-spin">
                        <path d="M-45,0 L45,0 M0,-45 L0,45 M-32,-32 L32,32 M-32,32 L32,-32" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                    </g>
                </g>
                
                <!-- Front Mudguard (Overlapping) -->
                <path d="M825,620 Q910,490 995,620" fill="none" stroke="var(--body-color)" stroke-width="22" stroke-linecap="round"/>
                <path d="M825,620 Q910,490 995,620" fill="none" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" stroke-linecap="round"/>

                <!-- Headlamp (Round, mounted high) -->
                <g transform="translate(900, 500)">
                    <circle cx="0" cy="0" r="20" fill="#111" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)"/>
                    <circle cx="0" cy="0" r="14" fill="#ffeb3b" />
                    <circle cx="0" cy="0" r="6" fill="#fff" />
                    <path d="M-25,0 L-10,0" stroke="#333" stroke-width="4" /> <!-- Mount -->
                </g>

                <!-- License Plate -->
                <g transform="translate(860, 530) rotate(15)">
                    <rect x="0" y="0" width="50" height="25" fill="#fff" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" rx="2" />
                    <text x="25" y="17" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#000">MH-12</text>
                </g>

            </g>
        </svg>
    </div>

    <!-- Floating Controls -->
    <div class="controls">
        <label>Finish</label>
        <!-- Taxi Yellow -->
        <div class="color-btn active" style="background-color: #FFC107;" onclick="changeColor('#FFC107', '#FF9800', '#FFD54F', this)"></div>
        <!-- Classic Red -->
        <div class="color-btn" style="background-color: #D32F2F;" onclick="changeColor('#D32F2F', '#B71C1C', '#EF5350', this)"></div>
        <!-- Metro Blue -->
        <div class="color-btn" style="background-color: #1976D2;" onclick="changeColor('#1976D2', '#0D47A1', '#42A5F5', this)"></div>
        <!-- Premium Green -->
        <div class="color-btn" style="background-color: #388E3C;" onclick="changeColor('#388E3C', '#1B5E20', '#4CAF50', this)"></div>
    </div>

    <script>
        function changeColor(main, shadow, highlight, element) {
            // Update Active Button State
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            element.classList.add('active');

            // Update CSS Variables
            const root = document.documentElement;
            root.style.setProperty('--body-color', main);
            root.style.setProperty('--body-shadow', shadow);
            root.style.setProperty('--body-highlight', highlight);
        }
    </script>
</body>
</html>
