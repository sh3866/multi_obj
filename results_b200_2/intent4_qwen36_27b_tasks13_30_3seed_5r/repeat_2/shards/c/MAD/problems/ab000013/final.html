<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Rickshaw | Vector Design Study</title>
    <style>
        :root {
            /* Palette - Vibrant Street */
            --bg-color: #eef1f5;
            --text-color: #2c3e50;
            
            /* Vehicle Colors */
            --body-main: #FFC107;
            --body-dark: #FF9800;
            --body-light: #FFD54F;
            
            --accent-blue: #1E88E5;
            --accent-blue-dark: #1565C0;
            
            /* System */
            --chrome-grad: linear-gradient(135deg, #fff 0%, #d1d1d1 50%, #9e9e9e 100%);
            --glass-grad: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(100,200,255,0.1) 100%);
            --shadow-color: rgba(0,0,0,0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Background Texture (Subtle Grid) */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: -1;
        }

        .canvas-stage {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The Main SVG */
        #rickshaw-svg {
            width: 100%;
            height: 100%;
            max-width: 1400px; /* Increased scale */
            overflow: visible;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.15)); /* Global depth */
        }

        /* Typography Overlay */
        .overlay-text {
            position: absolute;
            top: 50px;
            left: 50px;
            pointer-events: none;
            z-index: 10;
        }
        .overlay-text h1 {
            font-size: 2.5rem;
            font-weight: 900;
            color: #1a1a1a;
            letter-spacing: -1px;
            line-height: 1;
        }
        .overlay-text p {
            font-size: 1rem;
            color: #555;
            font-weight: 600;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Technical Constraints: No UI Controls, but allowing interaction via hover on vehicle for subtle polish */
        .interactive-part {
            transition: filter 0.3s ease;
        }

    </style>
</head>
<body>

    <div class="overlay-text">
        <h1>THREE-WHEEL<br>GEOMETRY</h1>
        <p>Vector Study 002</p>
    </div>

    <div class="canvas-stage">
        <!-- SVG Canvas: Adjusted ViewBox for 2-point perspective -->
        <svg id="rickshaw-svg" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Gradients for Volume -->
                <linearGradient id="grad-body-side" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--body-main)" />
                    <stop offset="80%" style="stop-color:var(--body-light)" />
                    <stop offset="100%" style="stop-color:var(--body-main)" />
                </linearGradient>

                <linearGradient id="grad-body-front" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:var(--body-dark)" />
                    <stop offset="100%" style="stop-color:#E65100" />
                </linearGradient>

                <linearGradient id="grad-cabin-blue" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:var(--accent-blue)" />
                    <stop offset="100%" style="stop-color:var(--accent-blue-dark)" />
                </linearGradient>

                <linearGradient id="grad-roof" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#424242" />
                    <stop offset="100%" style="stop-color:#212121" />
                </linearGradient>

                <linearGradient id="grad-chrome" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ffffff" />
                    <stop offset="40%" style="stop-color:#e0e0e0" />
                    <stop offset="60%" style="stop-color:#ffffff" />
                    <stop offset="100%" style="stop-color:#9e9e9e" />
                </linearGradient>
                
                <radialGradient id="grad-headlamp" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#fff" />
                    <stop offset="60%" style="stop-color:#FFF59D" />
                    <stop offset="100%" style="stop-color:#FBC02D" />
                </radialGradient>

                <!-- Wheel Clip Path for Animation -->
                <clipPath id="wheel-clip">
                    <circle cx="0" cy="0" r="55" />
                </clipPath>
            </defs>

            <!-- GROUND SHADOW -->
            <ellipse cx="650" cy="750" rx="400" ry="35" fill="var(--shadow-color)" filter="blur(15px)" />

            <!-- MAIN VEHICLE GROUP -->
            <!-- Centered and scaled to dominate the frame -->
            <g id="vehicle" transform="translate(100, 100) scale(1.1)">
                
                <!-- === 1. REAR WHEELS (Axle) === -->
                <!-- Left Rear Wheel (Background) -->
                <g transform="translate(380, 580)">
                    <circle cx="0" cy="0" r="65" fill="#111" stroke="#333" stroke-width="2"/>
                    <circle cx="0" cy="0" r="35" fill="#ccc" stroke="#333" stroke-width="2"/>
                    <g>
                        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="0.4s" repeatCount="indefinite" />
                        <path d="M-35,0 L35,0 M0,-35 L0,35 M-25,-25 L25,25 M-25,25 L25,-25" stroke="#333" stroke-width="6" stroke-linecap="round"/>
                    </g>
                    <!-- Tire Highlight -->
                    <path d="M-65,0 A 65 65 0 0 1 65 0" fill="none" stroke="#333" stroke-width="4" opacity="0.5"/>
                </g>

                <!-- Right Rear Wheel (Foreground) -->
                <g transform="translate(680, 600)">
                    <circle cx="0" cy="0" r="65" fill="#111" stroke="#333" stroke-width="2"/>
                    <circle cx="0" cy="0" r="35" fill="#ccc" stroke="#333" stroke-width="2"/>
                    <g>
                        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="0.4s" repeatCount="indefinite" />
                        <path d="M-35,0 L35,0 M0,-35 L0,35 M-25,-25 L25,25 M-25,25 L25,-25" stroke="#333" stroke-width="6" stroke-linecap="round"/>
                    </g>
                    <path d="M-65,0 A 65 65 0 0 1 65 0" fill="none" stroke="#333" stroke-width="4" opacity="0.5"/>
                </g>

                <!-- Rear Mudguards (Functional) -->
                <!-- Left Rear -->
                <path d="M315,580 Q380,480 445,580" fill="none" stroke="var(--body-main)" stroke-width="18" stroke-linecap="round"/>
                <path d="M315,580 Q380,480 445,580" fill="none" stroke="#d88900" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
                <!-- Right Rear -->
                <path d="M615,600 Q680,500 745,600" fill="none" stroke="var(--body-main)" stroke-width="18" stroke-linecap="round"/>
                <path d="M615,600 Q680,500 745,600" fill="none" stroke="#d88900" stroke-width="6" stroke-linecap="round" opacity="0.5"/>


                <!-- === 2. PASSENGER CABIN (Enclosed) === -->
                <!-- Chassis Base -->
                <path d="M360,560 L660,580 L660,610 L360,590 Z" fill="#333" stroke="#111" stroke-width="2"/>

                <!-- Left Side Wall (Yellow) -->
                <path d="M380,400 L360,560 L660,580 L680,420 Z" fill="url(#grad-body-side)" stroke="#d88900" stroke-width="1"/>
                
                <!-- Right Side Wall (Yellow - visible due to perspective) -->
                <!-- Actually, in a 3/4 view, the right side is obscured by the front, but the rear right corner might show. 
                     Let's draw the BACK face to give depth. -->
                <path d="M660,580 L680,420 L720,420 L700,580 Z" fill="var(--body-dark)" stroke="#d88900" stroke-width="1"/>
                <path d="M680,420 L720,420 L720,460 L680,460 Z" fill="#111" opacity="0.2"/> <!-- Back Window -->

                <!-- Cabin Roof (Black Canopy) -->
                <path d="M350,380 L690,400 L730,400 L390,380 Z" fill="url(#grad-roof)" stroke="#000" stroke-width="1"/>
                <!-- Roof Overhang Front -->
                <path d="M350,380 L390,380 L370,400 L330,400 Z" fill="#212121" />

                <!-- Windows -->
                <!-- Left Window -->
                <path d="M390,410 L650,430 L650,530 L385,510 Z" fill="url(#grad-cabin-blue)" stroke="#111" stroke-width="2"/>
                <!-- Window Glass Reflection -->
                <path d="M400,420 L480,425 L460,510 L395,505 Z" fill="rgba(255,255,255,0.2)" />
                
                <!-- Sticker: Jai Shri Ram -->
                <g transform="translate(480, 460) rotate(2)">
                    <rect x="0" y="0" width="90" height="28" fill="#fff" rx="3" stroke="#eee" stroke-width="1"/>
                    <text x="45" y="19" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#D32F2F" letter-spacing="0.5">JAI SHRI RAM</text>
                </g>

                <!-- Door Details -->
                <path d="M520,420 L510,520" stroke="#d88900" stroke-width="2" stroke-linecap="round"/>
                <circle cx="540" cy="480" r="4" fill="#333"/> <!-- Handle -->


                <!-- === 3. FRONT ASSEMBLY (Driver Area) === -->
                
                <!-- Front Fork (Chrome) -->
                <path d="M740,430 L820,590 L790,590 L720,430 Z" fill="url(#grad-chrome)" stroke="#999" stroke-width="1"/>
                
                <!-- Steering Column -->
                <line x1="760" y1="450" x2="810" y2="560" stroke="#111" stroke-width="8" stroke-linecap="round"/>

                <!-- Handlebars -->
                <g transform="translate(810, 560)">
                    <path d="M0,0 L-30,20 L-60,10" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
                    <!-- Left Grip -->
                    <path d="M-60,10 L-70,5" fill="none" stroke="#333" stroke-width="12" stroke-linecap="round"/>
                    <!-- Left Mirror -->
                    <path d="M-15,10 L-25,-10" stroke="#111" stroke-width="4" />
                    <circle cx="-25" cy="-10" r="10" fill="#333" />
                    <circle cx="-25" cy="-10" r="6" fill="#81D4FA" opacity="0.5"/>
                </g>

                <!-- Windshield (Angled Glass) -->
                <path d="M720,430 L830,440 L840,520 L730,510 Z" fill="url(#glass-grad)" stroke="#333" stroke-width="2"/>
                <!-- Windshield Reflection -->
                <path d="M740,440 L780,445 L770,500 L740,495 Z" fill="rgba(255,255,255,0.3)" />
                
                <!-- Ornamental Charm (Hanging) -->
                <g transform="translate(780, 440)">
                    <line x1="0" y1="0" x2="0" y2="15" stroke="#D32F2F" stroke-width="1"/>
                    <path d="M0,15 L-5,25 L5,25 Z" fill="#FBC02D"/> <!-- Small gold charm -->
                    <path d="M0,15 L-3,22 L3,22 Z" fill="#D32F2F"/> <!-- Red center -->
                </g>

                <!-- Headlamp (High Mount) -->
                <g transform="translate(810, 530)">
                    <path d="M-10,0 L10,0 L10,10 L-10,10 Z" fill="#333" /> <!-- Mount -->
                    <circle cx="0" cy="15" r="18" fill="#111" stroke="#333" stroke-width="2"/>
                    <circle cx="0" cy="15" r="14" fill="url(#grad-headlamp)"/>
                    <circle cx="4" cy="11" r="4" fill="rgba(255,255,255,0.8)"/> <!-- Glare -->
                </g>

                <!-- Front Wheel (Single) -->
                <g transform="translate(805, 600)">
                    <circle cx="0" cy="0" r="65" fill="#111" stroke="#333" stroke-width="2"/>
                    <circle cx="0" cy="0" r="35" fill="#ccc" stroke="#333" stroke-width="2"/>
                    <g>
                        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="0.4s" repeatCount="indefinite" />
                        <path d="M-35,0 L35,0 M0,-35 L0,35 M-25,-25 L25,25 M-25,25 L25,-25" stroke="#333" stroke-width="6" stroke-linecap="round"/>
                    </g>
                    <path d="M-65,0 A 65 65 0 0 1 65 0" fill="none" stroke="#333" stroke-width="4" opacity="0.5"/>
                </g>

                <!-- Front Mudguard (Functional) -->
                <path d="M740,600 Q805,510 870,600" fill="none" stroke="var(--body-main)" stroke-width="18" stroke-linecap="round"/>
                <path d="M740,600 Q805,510 870,600" fill="none" stroke="#d88900" stroke-width="6" stroke-linecap="round" opacity="0.5"/>

                <!-- License Plate (Front) -->
                <g transform="translate(760, 500) rotate(-10)">
                    <rect x="0" y="0" width="50" height="24" fill="#fff" stroke="#333" stroke-width="1" rx="2" />
                    <text x="25" y="16" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">MH-04</text>
                </g>

                <!-- Exhaust Pipe -->
                <path d="M650,590 L850,590" stroke="#555" stroke-width="12" stroke-linecap="round"/>
                <path d="M850,590 L880,590" stroke="#333" stroke-width="14" stroke-linecap="round"/>

            </g>
        </svg>
    </div>

</body>
</html>
