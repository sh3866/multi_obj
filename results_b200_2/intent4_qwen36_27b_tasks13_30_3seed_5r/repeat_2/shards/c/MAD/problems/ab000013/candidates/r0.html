<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Royal Tuk-Tuk | Heritage Series</title>
    <style>
        :root {
            --bg-dark: #1a1c23;
            --bg-panel: #242730;
            --accent-yellow: #f4d03f;
            --accent-red: #e74c3c;
            --accent-teal: #1abc9c;
            --text-main: #ecf0f1;
            --text-muted: #95a5a6;
            --font-stack: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Layout Container */
        .showcase-container {
            position: relative;
            width: 90vw;
            height: 85vh;
            background: linear-gradient(135deg, #2b303b 0%, #1a1c23 100%);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Left Side: Visual */
        .visual-area {
            flex: 2;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 50% 120%, rgba(244, 208, 63, 0.1) 0%, transparent 50%),
                linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.4) 100%);
        }

        /* Right Side: Info */
        .info-area {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-left: 1px solid rgba(255,255,255,0.05);
            background: rgba(36, 39, 48, 0.6);
            backdrop-filter: blur(10px);
        }

        /* Typography */
        h1 {
            font-size: 3.5rem;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #fff, #bdc3c7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent-yellow);
            margin-bottom: 30px;
            font-weight: 600;
        }

        p.desc {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 40px;
            font-size: 0.95rem;
        }

        /* Feature List */
        .specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: auto;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
        }

        .spec-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .spec-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Interactive Elements */
        .color-picker {
            margin-top: 30px;
        }
        
        .color-picker span {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .colors {
            display: flex;
            gap: 15px;
        }

        .color-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.active {
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        /* SVG Animation */
        #rickshaw-svg {
            width: 100%;
            height: 100%;
            max-width: 700px;
            overflow: visible;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.6));
        }

        .wheel-spin {
            transform-origin: center;
            animation: spin 2s linear infinite;
        }

        .wheel-spin-back {
            transform-origin: center;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .suspension {
            animation: bounce 0.8s ease-in-out infinite alternate;
            transform-origin: center;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(3px); }
        }

        .headlight-beam {
            opacity: 0.6;
            animation: flicker 4s infinite;
        }

        @keyframes flicker {
            0%, 95%, 100% { opacity: 0.6; }
            96% { opacity: 0.4; }
            97% { opacity: 0.7; }
        }

        /* Responsive */
        @media (max-width: 900px) {
            .showcase-container {
                flex-direction: column-reverse;
                height: 95vh;
            }
            .info-area {
                padding: 20px;
                flex: 0 0 auto;
                height: 40%;
                border-left: none;
                border-top: 1px solid rgba(255,255,255,0.05);
            }
            .visual-area {
                height: 60%;
            }
            h1 { font-size: 2.5rem; }
            #rickshaw-svg { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="showcase-container">
        <!-- Visual Area -->
        <div class="visual-area">
            <svg id="rickshaw-svg" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Gradients -->
                    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:var(--accent-yellow);stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#d4ac0d;stop-opacity:1" />
                    </linearGradient>
                    
                    <linearGradient id="roof-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:var(--accent-red);stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
                    </linearGradient>

                    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.4" />
                        <stop offset="100%" style="stop-color:#2980b9;stop-opacity:0.1" />
                    </linearGradient>

                    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#bdc3c7;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#ecf0f1;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#95a5a6;stop-opacity:1" />
                    </linearGradient>

                    <radialGradient id="tire-grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                        <stop offset="80%" style="stop-color:#2c3e50;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#000;stop-opacity:1" />
                    </radialGradient>

                    <!-- Filters -->
                    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
                        <feOffset dx="2" dy="2" result="offsetblur" />
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.5" />
                        </feComponentTransfer>
                        <feMerge> 
                            <feMergeNode />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                </defs>

                <!-- Ground Shadow -->
                <ellipse cx="400" cy="530" rx="280" ry="30" fill="rgba(0,0,0,0.4)" />

                <g class="suspension">
                    
                    <!-- REAR WHEEL (Left) -->
                    <g transform="translate(250, 450)">
                        <!-- Mudguard -->
                        <path d="M-60,0 A60,60 0 0,1 60,0" fill="none" stroke="#000" stroke-width="10" />
                        <!-- Tire -->
                        <circle cx="0" cy="0" r="60" fill="#1a1a1a" stroke="#333" stroke-width="2" />
                        <!-- Rim -->
                        <circle cx="0" cy="0" r="45" fill="#555" stroke="#777" stroke-width="2" />
                        <!-- Spokes (Animated) -->
                        <g class="wheel-spin-back">
                            <path d="M0,-45 L0,45 M-45,0 L45,0 M-32,-32 L32,32 M-32,32 L32,-32" stroke="#333" stroke-width="3" />
                        </g>
                    </g>

                    <!-- REAR WHEEL (Right) -->
                    <g transform="translate(550, 450)">
                        <!-- Mudguard -->
                        <path d="M-60,0 A60,60 0 0,1 60,0" fill="none" stroke="#000" stroke-width="10" />
                        <!-- Tire -->
                        <circle cx="0" cy="0" r="60" fill="#1a1a1a" stroke="#333" stroke-width="2" />
                        <!-- Rim -->
                        <circle cx="0" cy="0" r="45" fill="#555" stroke="#777" stroke-width="2" />
                        <!-- Spokes (Animated) -->
                        <g class="wheel-spin-back">
                            <path d="M0,-45 L0,45 M-45,0 L45,0 M-32,-32 L32,32 M-32,32 L32,-32" stroke="#333" stroke-width="3" />
                        </g>
                    </g>

                    <!-- CABIN BACK & FLOOR -->
                    <path d="M220,350 L220,460 L580,460 L580,350 Z" fill="url(#body-grad)" stroke="#b7950b" stroke-width="2"/>
                    <!-- Cabin Detail Lines -->
                    <path d="M220,400 L580,400" stroke="#b7950b" stroke-width="2" opacity="0.5" />
                    <path d="M220,430 L580,430" stroke="#b7950b" stroke-width="2" opacity="0.5" />

                    <!-- CABIN FRONT (Driver Area) -->
                    <path d="M300,350 L280,280 L520,280 L500,350 Z" fill="url(#body-grad)" stroke="#b7950b" stroke-width="2"/>
                    
                    <!-- Windshield -->
                    <path d="M290,280 L310,220 L490,220 L510,280 Z" fill="url(#glass-grad)" stroke="#7f8c8d" stroke-width="2" />
                    <!-- Windshield Support -->
                    <line x1="400" y1="220" x2="400" y2="280" stroke="#7f8c8d" stroke-width="3" />

                    <!-- DRIVER -->
                    <!-- Head -->
                    <circle cx="360" cy="240" r="18" fill="#d35400" />
                    <!-- Cap -->
                    <path d="M340,235 C340,220 380,220 380,235 Z" fill="#fff" />
                    <!-- Body/Shirt -->
                    <path d="M345,255 C345,280 375,280 375,255 Z" fill="#fff" />

                    <!-- FRONT WHEEL -->
                    <g transform="translate(400, 450)">
                        <!-- Fork -->
                        <line x1="0" y1="-80" x2="0" y2="0" stroke="#7f8c8d" stroke-width="8" />
                        <!-- Mudguard -->
                        <path d="M-55,0 A55,55 0 0,1 55,0" fill="none" stroke="#000" stroke-width="8" />
                        <!-- Tire -->
                        <circle cx="0" cy="0" r="55" fill="#1a1a1a" stroke="#333" stroke-width="2" />
                        <!-- Rim -->
                        <circle cx="0" cy="0" r="40" fill="#555" stroke="#777" stroke-width="2" />
                        <!-- Spokes (Animated) -->
                        <g class="wheel-spin">
                            <path d="M0,-40 L0,40 M-40,0 L40,0 M-28,-28 L28,28 M-28,28 L28,-28" stroke="#333" stroke-width="3" />
                        </g>
                    </g>

                    <!-- HANDLEBARS -->
                    <path d="M350,290 L450,290" stroke="#333" stroke-width="6" stroke-linecap="round" />
                    <line x1="350" y1="290" x2="350" y2="270" stroke="#333" stroke-width="6" />
                    <line x1="450" y1="290" x2="450" y2="270" stroke="#333" stroke-width="6" />
                    <!-- Grips -->
                    <rect x="340" y="265" width="20" height="10" fill="#000" rx="2" />
                    <rect x="440" y="265" width="20" height="10" fill="#000" rx="2" />

                    <!-- MIRRORS -->
                    <g transform="translate(340, 260)">
                        <line x1="0" y1="0" x2="-20" y2="-10" stroke="#333" stroke-width="2" />
                        <circle cx="-20" cy="-10" r="8" fill="#ecf0f1" stroke="#333" />
                    </g>
                    <g transform="translate(460, 260)">
                        <line x1="0" y1="0" x2="20" y2="-10" stroke="#333" stroke-width="2" />
                        <circle cx="20" cy="-10" r="8" fill="#ecf0f1" stroke="#333" />
                    </g>

                    <!-- CANOPY ROOF -->
                    <path d="M200,350 Q400,180 600,350" fill="url(#roof-grad)" stroke="#922b21" stroke-width="2" />
                    <!-- Roof Ornament (The Spire) -->
                    <path d="M390,260 L400,200 L410,260" fill="url(#metal-grad)" stroke="#7f8c8d" stroke-width="1" />
                    <circle cx="400" cy="200" r="8" fill="#e74c3c" />

                    <!-- HEADLAMP -->
                    <g transform="translate(400, 360)">
                        <circle cx="0" cy="0" r="25" fill="#f1c40f" stroke="#f39c12" stroke-width="3" />
                        <circle cx="0" cy="0" r="15" fill="#fff" opacity="0.8" />
                        <!-- Beam -->
                        <path class="headlight-beam" d="M-10,0 L-150,200 L150,200 L10,0 Z" fill="url(#beam-grad)" style="mix-blend-mode: screen;" />
                    </g>
                    
                    <!-- License Plate -->
                    <g transform="translate(370, 440)">
                        <rect x="0" y="0" width="60" height="25" fill="#fff" stroke="#333" rx="2" />
                        <text x="30" y="17" font-family="monospace" font-size="12" text-anchor="middle" fill="#000">MH-04</text>
                    </g>

                </g>
            </svg>
        </div>

        <!-- Info Area -->
        <div class="info-area">
            <h2>The Heritage Series</h2>
            <h1>Royal Metro</h1>
            <p class="desc">
                A modern reimagining of the iconic Indian auto-rickshaw. 
                Combining the agility of the three-wheel structure with 
                premium aesthetics and a vibrant street-inspired palette.
            </p>

            <div class="specs">
                <div class="spec-item">
                    <span class="spec-label">Engine</span>
                    <span class="spec-value">3-Cyl Diesel</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">Capacity</span>
                    <span class="spec-value">3 Passengers</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">Top Speed</span>
                    <span class="spec-value">80 km/h</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">Origin</span>
                    <span class="spec-value">Mumbai, IN</span>
                </div>
            </div>

            <div class="color-picker">
                <span>Exterior Finish</span>
                <div class="colors">
                    <div class="color-btn active" style="background-color: #f4d03f;" onclick="changeColor('#f4d03f', '#d4ac0d', this)"></div>
                    <div class="color-btn" style="background-color: #e74c3c;" onclick="changeColor('#e74c3c', '#c0392b', this)"></div>
                    <div class="color-btn" style="background-color: #1abc9c;" onclick="changeColor('#1abc9c', '#16a085', this)"></div>
                    <div class="color-btn" style="background-color: #3498db;" onclick="changeColor('#3498db', '#2980b9', this)"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function changeColor(primary, secondary, element) {
            // Update Active Button State
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            element.classList.add('active');

            // Update SVG Gradient
            const bodyGrad = document.getElementById('body-grad');
            bodyGrad.children[0].style.stopColor = primary;
            bodyGrad.children[1].style.stopColor = secondary;
            
            // Update CSS Variable for consistency if needed elsewhere
            // document.documentElement.style.setProperty('--accent-yellow', primary);
        }
    </script>
</body>
</html>
