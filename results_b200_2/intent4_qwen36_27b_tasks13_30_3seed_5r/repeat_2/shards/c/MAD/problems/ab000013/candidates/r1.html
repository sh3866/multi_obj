<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Metro | The Heritage Series</title>
    <style>
        :root {
            --bg-dark: #121214;
            --panel-bg: #1c1c1f;
            --text-main: #ffffff;
            --text-muted: #8b8b8e;
            --accent: #f4d03f;
            --font-stack: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Layout */
        .showcase-container {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 65% 35%;
            background-color: var(--bg-dark);
            position: relative;
        }

        /* Left: Visual Stage */
        .visual-stage {
            position: relative;
            background: radial-gradient(circle at 60% 80%, #2a2a2e 0%, #121214 70%);
            display: flex;
            align-items: flex-end; /* Anchor to bottom */
            justify-content: center;
            overflow: hidden;
            padding-bottom: 5vh; /* Lift slightly */
        }

        /* Ambient Glow */
        .ambient-light {
            position: absolute;
            width: 60vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(244, 208, 63, 0.08) 0%, transparent 60%);
            top: 10%;
            left: 10%;
            pointer-events: none;
        }

        /* The SVG */
        #rickshaw-svg {
            width: 100%;
            height: 100%;
            max-width: 1100px;
            /* Critical for the 2.5D feel */
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6));
            transition: transform 0.3s ease;
        }

        /* Right: Info Panel */
        .info-panel {
            background-color: var(--panel-bg);
            border-left: 1px solid rgba(255,255,255,0.05);
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        /* Typography */
        .tagline {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--accent);
            margin-bottom: 15px;
            font-weight: 600;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #fff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.description {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 1rem;
            margin-bottom: 50px;
            max-width: 90%;
        }

        /* Specs Grid */
        .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 60px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 30px;
        }

        .spec-item h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .spec-item p {
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--text-main);
        }

        /* Interactive Controls */
        .controls {
            margin-top: auto;
        }

        .controls label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .color-options {
            display: flex;
            gap: 20px;
        }

        .color-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .color-btn::after {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%;
            border: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .color-btn.active {
            transform: scale(1.1);
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        /* Animations */
        .spin-slow {
            transform-origin: center;
            animation: spin 4s linear infinite;
        }
        
        .spin-fast {
            transform-origin: center;
            animation: spin 1.5s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 900px) {
            .showcase-container {
                grid-template-columns: 1fr;
                grid-template-rows: 50% 50%;
            }
            .visual-stage {
                background: radial-gradient(circle at 50% 50%, #2a2a2e 0%, #121214 80%);
                align-items: center;
                padding-bottom: 0;
            }
            .info-panel {
                padding: 30px;
                border-left: none;
                border-top: 1px solid rgba(255,255,255,0.05);
            }
            h1 { font-size: 2.5rem; }
            .specs-grid { display: none; } /* Hide specs on mobile to save space */
        }
    </style>
</head>
<body>

    <div class="showcase-container">
        <!-- Visual Area -->
        <div class="visual-stage">
            <div class="ambient-light"></div>
            
            <!-- SVG Illustration -->
            <svg id="rickshaw-svg" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Body Gradients (Yellow default) -->
                    <linearGradient id="body-primary" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#f4d03f;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#d4ac0d;stop-opacity:1" />
                    </linearGradient>
                    <linearGradient id="body-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#d4ac0d;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#9a7d0a;stop-opacity:1" />
                    </linearGradient>

                    <!-- Roof Gradient (Red) -->
                    <linearGradient id="roof-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
                    </linearGradient>
                    
                    <!-- Glass Gradient -->
                    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#5dade2;stop-opacity:0.6" />
                        <stop offset="100%" style="stop-color:#2874a6;stop-opacity:0.2" />
                    </linearGradient>

                    <!-- Chrome/Metal -->
                    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#bdc3c7;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#ecf0f1;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#7f8c8d;stop-opacity:1" />
                    </linearGradient>

                    <!-- Tires -->
                    <linearGradient id="tire-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#000;stop-opacity:1" />
                    </linearGradient>

                    <!-- Headlight Beam -->
                    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#f1c40f;stop-opacity:0.4" />
                        <stop offset="100%" style="stop-color:#f1c40f;stop-opacity:0" />
                    </linearGradient>

                    <!-- Shadow Filter -->
                    <filter id="inner-shadow">
                        <feOffset dx="0" dy="5"/>
                        <feGaussianBlur stdDeviation="5" result="offset-blur"/>
                        <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                        <feFlood flood-color="black" flood-opacity="0.3" result="color"/>
                        <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                        <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
                    </filter>
                </defs>

                <!-- Ground Shadow (Elongated ellipse) -->
                <ellipse cx="480" cy="680" rx="350" ry="40" fill="#000" opacity="0.6" filter="blur(10px)" />

                <g id="vehicle-group" transform="translate(100, 50)">
                    
                    <!-- === REAR WHEEL (Background/Left) === -->
                    <!-- Positioned slightly higher and smaller to simulate depth -->
                    <g transform="translate(350, 580)">
                        <!-- Mudguard (Back) -->
                        <path d="M-70,0 C-70,-80 70,-80 70,0" fill="none" stroke="#111" stroke-width="18" />
                        <!-- Tire -->
                        <circle cx="0" cy="0" r="70" fill="url(#tire-grad)" />
                        <circle cx="0" cy="0" r="70" fill="none" stroke="#111" stroke-width="4" />
                        <!-- Rim -->
                        <circle cx="0" cy="0" r="45" fill="#444" stroke="#222" stroke-width="2" />
                        <!-- Spokes -->
                        <g class="spin-slow">
                            <path d="M0,-45 L0,45 M-45,0 L45,0 M-32,-32 L32,32 M-32,32 L32,-32" stroke="#222" stroke-width="4" />
                            <circle cx="0" cy="0" r="10" fill="#222" />
                        </g>
                    </g>

                    <!-- === CABIN BACK & SIDE (Yellow) === -->
                    <!-- Constructed to show the 3/4 angle -->
                    <g id="cabin-body">
                        <!-- Side Panel (Facing Viewer) -->
                        <path d="M320,480 L320,340 Q320,320 340,320 L520,320 L520,520 Z" fill="url(#body-primary)" filter="url(#inner-shadow)" />
                        
                        <!-- Back Panel (Facing Away) -->
                        <path d="M220,480 L220,360 Q220,340 240,340 L320,340 L320,480 Z" fill="url(#body-shadow)" />
                        
                        <!-- Floor/Step -->
                        <path d="M220,480 L520,520 L520,540 L220,500 Z" fill="#111" />

                        <!-- Window Cutout (Back) -->
                        <path d="M240,380 L300,380 L300,450 L240,450 Z" fill="#1a1c23" opacity="0.8" />
                        
                        <!-- Window Cutout (Side) -->
                        <path d="M340,350 L480,350 L480,480 L340,460 Z" fill="#1a1c23" opacity="0.6" stroke="#b7950b" stroke-width="2" />
                        
                        <!-- Window Glare -->
                        <path d="M350,360 L470,360 L470,380 L350,380 Z" fill="#fff" opacity="0.1" />
                    </g>

                    <!-- === DRIVER AREA === -->
                    <g id="driver-zone">
                        <!-- Driver Seat Back -->
                        <path d="M300,320 L280,220 L320,220 L340,320 Z" fill="#111" />
                        
                        <!-- Driver Silhouette -->
                        <g transform="translate(300, 240)">
                            <circle cx="0" cy="0" r="20" fill="#333" /> <!-- Head -->
                            <path d="M-20,20 C-20,60 20,60 20,20 Z" fill="#fff" /> <!-- Shirt -->
                        </g>

                        <!-- Windshield (Angled) -->
                        <path d="M280,220 L320,140 L480,140 L500,220 Z" fill="url(#glass-grad)" stroke="#7f8c8d" stroke-width="4" />
                        <!-- Windshield Support -->
                        <line x1="380" y1="140" x2="380" y2="220" stroke="#333" stroke-width="4" />
                    </g>

                    <!-- === FRONT CHASSIS & ENGINE === -->
                    <g id="front-mechanical">
                        <!-- Engine Block -->
                        <path d="M420,450 L500,450 L500,520 L420,520 Z" fill="#333" stroke="#111" stroke-width="2" />
                        <!-- Exhaust -->
                        <path d="M500,480 L560,480 L560,490 L500,490 Z" fill="#555" />
                    </g>

                    <!-- === FRONT WHEEL (Foreground/Right) === -->
                    <!-- Larger, lower, and angled -->
                    <g transform="translate(540, 600)">
                        <!-- Fork (Angled) -->
                        <path d="M0,-120 L-20,-120 L10,0 L30,0 Z" fill="#333" />
                        
                        <!-- Mudguard (Front) -->
                        <path d="M-80,0 C-80,-100 80,-100 80,0" fill="none" stroke="#111" stroke-width="20" />
                        
                        <!-- Tire -->
                        <circle cx="0" cy="0" r="80" fill="url(#tire-grad)" />
                        <circle cx="0" cy="0" r="80" fill="none" stroke="#111" stroke-width="6" />
                        
                        <!-- Rim -->
                        <circle cx="0" cy="0" r="50" fill="#444" stroke="#222" stroke-width="2" />
                        
                        <!-- Spokes -->
                        <g class="spin-fast">
                            <path d="M0,-50 L0,50 M-50,0 L50,0 M-35,-35 L35,35 M-35,35 L35,-35" stroke="#222" stroke-width="6" />
                            <circle cx="0" cy="0" r="12" fill="#222" />
                        </g>
                    </g>

                    <!-- === HANDLEBARS === -->
                    <g transform="translate(480, 220)">
                        <!-- Stem -->
                        <line x1="0" y1="0" x2="0" y2="60" stroke="#333" stroke-width="8" />
                        <!-- Bar -->
                        <path d="M-60,60 L60,60" stroke="#333" stroke-width="8" stroke-linecap="round" />
                        <!-- Grips -->
                        <rect x="-70" y="56" width="20" height="12" fill="#111" rx="2" />
                        <rect x="50" y="56" width="20" height="12" fill="#111" rx="2" />
                        <!-- Mirror Stems -->
                        <path d="M-60,60 L-80,30" stroke="#333" stroke-width="3" />
                        <path d="M60,60 L80,30" stroke="#333" stroke-width="3" />
                        <!-- Mirrors -->
                        <circle cx="-80" cy="30" r="12" fill="#ecf0f1" stroke="#333" />
                        <circle cx="80" cy="30" r="12" fill="#ecf0f1" stroke="#333" />
                    </g>

                    <!-- === CANOPY ROOF (Red) === -->
                    <!-- Sweeping curve covering driver and cabin -->
                    <g id="roof-group">
                        <!-- Roof Main Body -->
                        <path d="M200,350 Q350,150 600,350 L580,380 Q350,200 220,380 Z" fill="url(#roof-grad)" />
                        
                        <!-- Roof Trim (Yellow accent) -->
                        <path d="M220,380 Q350,200 580,380" fill="none" stroke="#f4d03f" stroke-width="4" />
                        
                        <!-- Spire/Ornament -->
                        <path d="M380,260 L400,180 L420,260" fill="url(#chrome)" />
                        <circle cx="400" cy="180" r="10" fill="#e74c3c" />
                    </g>

                    <!-- === HEADLAMP === -->
                    <!-- Positioned on the front nose -->
                    <g transform="translate(520, 380)">
                        <!-- Housing -->
                        <circle cx="0" cy="0" r="35" fill="#111" stroke="#333" stroke-width="4" />
                        <!-- Glass -->
                        <circle cx="0" cy="0" r="25" fill="#f1c40f" />
                        <!-- Bulb -->
                        <circle cx="0" cy="0" r="12" fill="#fff" />
                        
                        <!-- Beam (Projected) -->
                        <path d="M-15,0 L-300,600 L300,600 L15,0 Z" fill="url(#beam-grad)" opacity="0.5" />
                    </g>

                    <!-- === LICENSE PLATE === -->
                    <!-- Attached to the front side panel -->
                    <g transform="translate(420, 460) rotate(5)">
                        <rect x="0" y="0" width="80" height="35" fill="#fff" rx="3" stroke="#333" stroke-width="2" />
                        <text x="40" y="23" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">MH-04</text>
                    </g>

                </g>
            </svg>
        </div>

        <!-- Info Area -->
        <div class="info-panel">
            <div class="tagline">Heritage Series</div>
            <h1>Royal Metro</h1>
            <p class="description">
                A premium reimagining of the iconic Indian auto-rickshaw. 
                Combining the agility of the three-wheel structure with 
                modern 2.5D aesthetics and a vibrant, street-inspired palette.
            </p>

            <div class="specs-grid">
                <div class="spec-item">
                    <h3>Engine</h3>
                    <p>3-Cyl Diesel</p>
                </div>
                <div class="spec-item">
                    <h3>Capacity</h3>
                    <p>3 Passengers</p>
                </div>
                <div class="spec-item">
                    <h3>Top Speed</h3>
                    <p>80 km/h</p>
                </div>
                <div class="spec-item">
                    <h3>Origin</h3>
                    <p>Mumbai, IN</p>
                </div>
            </div>

            <div class="controls">
                <label>Exterior Finish</label>
                <div class="color-options">
                    <div class="color-btn active" style="background-color: #f4d03f;" onclick="changeColor('#f4d03f', '#d4ac0d', '#9a7d0a', this)"></div>
                    <div class="color-btn" style="background-color: #e74c3c;" onclick="changeColor('#e74c3c', '#c0392b', '#922b21', this)"></div>
                    <div class="color-btn" style="background-color: #1abc9c;" onclick="changeColor('#1abc9c', '#16a085', '#0e6655', this)"></div>
                    <div class="color-btn" style="background-color: #34495e;" onclick="changeColor('#34495e', '#2c3e50', '#1a252f', this)"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function changeColor(primary, secondary, shadow, element) {
            // Update Active Button State
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            element.classList.add('active');

            // Update Gradients
            const bodyPrimary = document.getElementById('body-primary');
            const bodyShadow = document.getElementById('body-shadow');

            // Primary Body Gradient
            bodyPrimary.children[0].style.stopColor = primary;
            bodyPrimary.children[1].style.stopColor = secondary;

            // Shadow Body Gradient
            bodyShadow.children[0].style.stopColor = secondary;
            bodyShadow.children[1].style.stopColor = shadow;

            // Update CSS Variable for subtle UI sync
            document.documentElement.style.setProperty('--accent', primary);
        }
    </script>
</body>
</html>
