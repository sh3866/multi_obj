<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Metro | The Heritage Series</title>
    <style>
        :root {
            /* Palette - Refined Warmth */
            --bg-gradient-start: #e67e22;
            --bg-gradient-end: #d35400;
            --panel-bg: #fffbf2;
            --text-main: #2c3e50;
            --text-muted: #5d6d7e;
            
            /* Vehicle Colors - Defaults */
            --accent: #FFC300; 
            --accent-dark: #e6b000;
            --accent-shadow: #b38f00;
            --canopy: #C0392B; 
            --canopy-dark: #922b21;
            --canopy-shadow: #7b241c;
            
            /* System & Strokes */
            --stroke-color: #1a1a1a;
            --stroke-width: 2.5px;
            --chrome: #ecf0f1;
            --chrome-dark: #bdc3c7;

            /* Typography */
            --font-display: 'Arial Black', Impact, sans-serif;
            --font-body: 'Segoe UI', system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: var(--font-body);
            background-color: var(--bg-gradient-start);
        }

        /* Layout Grid */
        .showcase-container {
            display: grid;
            grid-template-columns: 65% 35%;
            height: 100%;
            width: 100%;
        }

        /* LEFT PANEL: Visual Stage */
        .visual-stage {
            position: relative;
            background: radial-gradient(circle at 70% 60%, var(--bg-gradient-start), var(--bg-gradient-end));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* SVG Styling */
        #rickshaw-svg {
            width: 100%;
            height: 100%;
            max-width: 900px;
            /* Strong Drop Shadow for Sticker Effect */
            filter: drop-shadow(0px 20px 25px rgba(0,0,0,0.4)); 
        }

        /* Right Panel: Info */
        .info-panel {
            background-color: var(--panel-bg);
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            box-shadow: -15px 0 40px rgba(0,0,0,0.15);
            z-index: 10;
        }

        /* Typography & Hierarchy */
        .tagline {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--canopy);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            opacity: 0.8;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 4rem;
            line-height: 0.95;
            color: var(--text-main);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        p.description {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        /* Specs Card */
        .specs-card {
            background: rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 40px;
        }

        .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .spec-item h3 {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #999;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .spec-item p {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: var(--text-main);
        }

        /* Controls */
        .controls {
            margin-top: auto;
        }

        .controls label {
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: block;
            color: var(--text-muted);
        }

        .color-options {
            display: flex;
            gap: 15px;
        }

        .color-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .color-btn.active {
            transform: scale(1.1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border-color: var(--text-main);
        }

        /* Animation */
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        .wheel-spin {
            transform-origin: center;
            animation: spin 3s linear infinite;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .showcase-container {
                grid-template-columns: 1fr;
                grid-template-rows: 45% 55%;
            }
            .visual-stage {
                background: var(--bg-gradient-end);
            }
            .info-panel {
                padding: 30px;
            }
            h1 { font-size: 2.5rem; }
            #rickshaw-svg {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="showcase-container">
        <!-- Left: The Art Stage -->
        <div class="visual-stage">
            <svg id="rickshaw-svg" viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Gradients for Dimensionality -->
                    <linearGradient id="body-main" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:var(--accent)" />
                        <stop offset="100%" style="stop-color:var(--accent-dark)" />
                    </linearGradient>
                    
                    <linearGradient id="body-side" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:var(--accent-dark)" />
                        <stop offset="100%" style="stop-color:var(--accent-shadow)" />
                    </linearGradient>

                    <linearGradient id="roof-main" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:var(--canopy)" />
                        <stop offset="100%" style="stop-color:var(--canopy-dark)" />
                    </linearGradient>

                    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#fff" />
                        <stop offset="50%" style="stop-color:#ccc" />
                        <stop offset="100%" style="stop-color:#888" />
                    </linearGradient>

                    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#aeeeff;stop-opacity:0.9" />
                        <stop offset="100%" style="stop-color:#2874a6;stop-opacity:0.5" />
                    </linearGradient>
                </defs>

                <!-- Ground Shadow -->
                <ellipse cx="400" cy="600" rx="320" ry="30" fill="rgba(0,0,0,0.2)" />

                <g id="vehicle" transform="translate(0, 0)">
                    
                    <!-- === 1. REAR WHEELS (Visible at bottom) === -->
                    <g transform="translate(220, 550)">
                        <circle cx="0" cy="0" r="65" fill="#1a1a1a" />
                        <circle cx="0" cy="0" r="35" fill="#ddd" stroke="#333" stroke-width="2" />
                        <g class="wheel-spin">
                            <path d="M-35,0 L35,0 M0,-35 L0,35 M-25,-25 L25,25 M-25,25 L25,-25" stroke="#333" stroke-width="3" />
                        </g>
                    </g>
                    <!-- Rear Wheel Mudguard -->
                    <path d="M150,550 Q220,450 290,550" fill="none" stroke="var(--canopy)" stroke-width="18" stroke-linecap="round" />
                    <path d="M150,550 Q220,450 290,550" fill="none" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" stroke-linecap="round" />

                    <!-- === 2. ENCLOSED CABIN (3D Perspective) === -->
                    <!-- Cabin Back Wall (Inner depth) -->
                    <path d="M180,350 L250,360 L250,520 L180,500 Z" fill="var(--accent-shadow)" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" stroke-linejoin="round"/>
                    
                    <!-- Cabin Roof (Inner ceiling) -->
                    <path d="M180,350 L250,360 L350,380 L280,370 Z" fill="var(--accent-shadow)" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" stroke-linejoin="round"/>

                    <!-- Cabin Side Wall (The yellow panel) -->
                    <path d="M250,360 L530,400 L530,550 L250,520 Z" fill="url(#body-main)" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" stroke-linejoin="round" />
                    
                    <!-- Cabin Front Wall (Side of driver area) -->
                    <path d="M530,400 L600,420 L600,560 L530,550 Z" fill="var(--accent-dark)" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" stroke-linejoin="round" />

                    <!-- Cabin Windows -->
                    <path d="M270,380 L510,415 L510,510 L270,480 Z" fill="#2c3e50" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" stroke-linejoin="round"/>
                    <!-- Window Sticker (Jai Shri Ram) -->
                    <g transform="translate(300, 400) rotate(5)">
                        <rect x="0" y="0" width="60" height="20" fill="#fff" rx="2" opacity="0.9" />
                        <text x="30" y="14" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#C0392B">JAI SHRI RAM</text>
                    </g>

                    <!-- === 3. ROOF (Canopy) === -->
                    <!-- Roof Top Surface -->
                    <path d="M150,300 Q350,220 650,280 L600,320 Q350,260 200,340 Z" fill="url(#roof-main)" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" stroke-linejoin="round" />
                    <!-- Roof Side Overhang -->
                    <path d="M150,300 L200,340 L150,340 Z" fill="var(--canopy-dark)" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" stroke-linejoin="round" />
                    
                    <!-- Roof Supports (Structural) -->
                    <line x1="200" y1="340" x2="250" y2="360" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" />
                    <line x1="600" y1="320" x2="530" y2="400" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" />

                    <!-- === 4. DRIVER AREA === -->
                    <!-- Driver Seat -->
                    <path d="M420,330 L480,340 L480,420 L420,410 Z" fill="#333" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" />
                    
                    <!-- Driver Silhouette -->
                    <g transform="translate(450, 310)">
                        <circle cx="0" cy="0" r="14" fill="#333" />
                        <path d="M-12,12 L12,12 L10,40 L-10,40 Z" fill="#fff" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" />
                    </g>

                    <!-- Windshield (Transparent Panel) -->
                    <path d="M530,350 L620,380 L620,480 L530,450 Z" fill="url(#glass)" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" stroke-linejoin="round" opacity="0.9"/>
                    
                    <!-- Handlebars (Visible through windshield/above seat) -->
                    <g transform="translate(580, 380)">
                        <path d="M0,20 L-20,50 L-50,50" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round" />
                        <circle cx="-50" cy="50" r="5" fill="#111" />
                    </g>

                    <!-- === 5. FRONT CHASSIS === -->
                    <!-- Fork (Chrome) -->
                    <path d="M620,450 L680,550 L660,550 L600,450 Z" fill="url(#chrome)" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" stroke-linejoin="round"/>
                    
                    <!-- Engine Block -->
                    <path d="M500,500 L580,520 L580,580 L500,560 Z" fill="#333" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" stroke-linejoin="round"/>
                    <!-- Exhaust -->
                    <path d="M580,540 L700,550 L700,560 L580,550 Z" fill="#888" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" />

                    <!-- Front Wheel (Single) -->
                    <g transform="translate(670, 560)">
                        <!-- Tire -->
                        <circle cx="0" cy="0" r="70" fill="#1a1a1a" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" />
                        <!-- Rim -->
                        <circle cx="0" cy="0" r="38" fill="#ddd" stroke="#333" stroke-width="2" />
                        <!-- Spokes -->
                        <g class="wheel-spin">
                            <path d="M-38,0 L38,0 M0,-38 L0,38 M-27,-27 L27,27 M-27,27 L27,-27" stroke="#333" stroke-width="3" />
                        </g>
                    </g>
                    
                    <!-- Front Mudguard -->
                    <path d="M600,560 Q670,460 740,560" fill="none" stroke="var(--canopy)" stroke-width="18" stroke-linecap="round" />
                    <path d="M600,560 Q670,460 740,560" fill="none" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" stroke-linecap="round" />

                    <!-- Headlamp -->
                    <g transform="translate(680, 480)">
                        <circle cx="0" cy="0" r="15" fill="#111" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" />
                        <circle cx="0" cy="0" r="10" fill="#ffeb3b" />
                        <circle cx="0" cy="0" r="4" fill="#fff" />
                    </g>

                    <!-- License Plate -->
                    <g transform="translate(560, 510) rotate(10)">
                        <rect x="0" y="0" width="50" height="25" fill="#fff" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" rx="2" />
                        <text x="25" y="17" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#000">MH-12</text>
                    </g>

                    <!-- Mirrors -->
                    <path d="M600,450 L620,400" stroke="#333" stroke-width="3" />
                    <circle cx="620" cy="400" r="8" fill="#ccc" stroke="var(--stroke-color)" stroke-width="var(--stroke-width)" />

                </g>
            </svg>
        </div>

        <!-- Right: Info Panel -->
        <div class="info-panel">
            <div class="tagline">Heritage Series</div>
            <h1>Royal Metro</h1>
            <p class="description">
                The streets of Mumbai reimagined. A premium, cel-shaded vector showcase of the iconic Auto Rickshaw. 
                Featuring a unified visual system, precise perspective, and the soul of the city.
            </p>

            <div class="specs-card">
                <div class="specs-grid">
                    <div class="spec-item">
                        <h3>Engine</h3>
                        <p>3-Cyl Diesel</p>
                    </div>
                    <div class="spec-item">
                        <h3>Capacity</h3>
                        <p>3 Passengers</p>
                    </div>
                    <div class="spec-item">
                        <h3>Top Speed</h3>
                        <p>80 km/h</p>
                    </div>
                    <div class="spec-item">
                        <h3>Origin</h3>
                        <p>Mumbai, IN</p>
                    </div>
                </div>
            </div>

            <div class="controls">
                <label>Exterior Finish</label>
                <div class="color-options">
                    <!-- Taxi Yellow -->
                    <div class="color-btn active" style="background-color: #FFC300;" onclick="changeColor('#FFC300', '#e6b000', '#b38f00', '#C0392B', '#922b21', '#7b241c', this)"></div>
                    <!-- Classic Red -->
                    <div class="color-btn" style="background-color: #C0392B;" onclick="changeColor('#C0392B', '#922b21', '#7b241c', '#FFC300', '#e6b000', '#b38f00', this)"></div>
                    <!-- Metro Blue -->
                    <div class="color-btn" style="background-color: #2980b9;" onclick="changeColor('#2980b9', '#2471a3', '#1a5276', '#F1C40F', '#d4ac0d', '#9a7d0a', this)"></div>
                    <!-- Matte Black -->
                    <div class="color-btn" style="background-color: #34495e;" onclick="changeColor('#34495e', '#2c3e50', '#17202a', '#E74C3C', '#c0392b', '#922b21', this)"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function changeColor(bodyMain, bodyDark, bodyShadow, roofMain, roofDark, roofShadow, element) {
            // Update Active Button State
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            element.classList.add('active');

            // Update CSS Variables
            const root = document.documentElement;
            root.style.setProperty('--accent', bodyMain);
            root.style.setProperty('--accent-dark', bodyDark);
            root.style.setProperty('--accent-shadow', bodyShadow);
            root.style.setProperty('--canopy', roofMain);
            root.style.setProperty('--canopy-dark', roofDark);
            root.style.setProperty('--canopy-shadow', roofShadow);
        }
    </script>
</body>
</html>
