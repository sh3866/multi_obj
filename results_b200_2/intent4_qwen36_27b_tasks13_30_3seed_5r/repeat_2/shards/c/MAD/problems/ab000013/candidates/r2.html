<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Metro | The Heritage Series</title>
    <style>
        :root {
            /* Palette - Vibrant Street Inspired */
            --bg-gradient-start: #ff9966;
            --bg-gradient-end: #ff5e62;
            --panel-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #555555;
            --accent: #FFC300; /* Taxi Yellow */
            --accent-dark: #e6b000;
            --accent-shadow: #b38f00;
            --canopy: #D92525; /* Red Roof */
            --canopy-dark: #a81818;
            --canopy-shadow: #7a1010;
            --chrome: #e0e0e0;
            --chrome-dark: #999;
            
            /* Typography */
            --font-display: 'Arial Black', 'Helvetica Neue', sans-serif;
            --font-body: 'Segoe UI', system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: var(--font-body);
            background-color: var(--bg-gradient-start);
        }

        /* Layout Grid */
        .showcase-container {
            display: grid;
            grid-template-columns: 60% 40%;
            height: 100%;
            width: 100%;
        }

        /* LEFT PANEL: Visual Stage */
        .visual-stage {
            position: relative;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* Subtle geometric pattern overlay */
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.1) 0%, transparent 40%),
                linear-gradient(45deg, rgba(0,0,0,0.05) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.05) 75%, rgba(0,0,0,0.05)),
                linear-gradient(45deg, rgba(0,0,0,0.05) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.05) 75%, rgba(0,0,0,0.05));
            background-size: 100% 100%, 60px 60px, 60px 60px;
            background-position: 0 0, 0 0, 30px 30px;
        }

        /* SVG Styling */
        #rickshaw-svg {
            width: 100%;
            height: 100%;
            max-width: 900px;
            /* Hard shadow for cel-shaded look */
            filter: drop-shadow(15px 20px 0px rgba(0,0,0,0.25)); 
        }

        /* RIGHT PANEL: Info */
        .info-panel {
            background-color: var(--panel-bg);
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            box-shadow: -10px 0 30px rgba(0,0,0,0.1);
            z-index: 2;
        }

        /* Typography & Hierarchy */
        .tagline {
            font-family: 'Courier New', Courier, monospace; /* Stamped look */
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--canopy);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            border: 2px solid var(--canopy);
            display: inline-block;
            padding: 5px 10px;
            width: fit-content;
            transform: rotate(-2deg);
        }

        h1 {
            font-family: var(--font-display);
            font-size: 4.5rem;
            line-height: 0.9;
            color: var(--text-main);
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        p.description {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 40px;
            max-width: 90%;
        }

        /* Specs */
        .specs-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-bottom: 50px;
            border-top: 4px solid var(--text-main);
            padding-top: 25px;
        }

        .spec-item h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #999;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .spec-item p {
            font-family: var(--font-display);
            font-size: 1.5rem;
            color: var(--text-main);
        }

        /* Controls */
        .controls {
            margin-top: auto;
        }

        .controls label {
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: block;
        }

        .color-options {
            display: flex;
            gap: 15px;
        }

        .color-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 3px solid #fff;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
        }

        .color-btn.active {
            transform: scale(1.15);
            box-shadow: 0 0 0 3px var(--text-main);
        }

        /* Animation */
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        .wheel-spin {
            transform-origin: center;
            animation: spin 2s linear infinite;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .showcase-container {
                grid-template-columns: 1fr;
                grid-template-rows: 45% 55%;
            }
            .visual-stage {
                background: var(--bg-gradient-start); /* Solid for mobile performance */
            }
            .info-panel {
                padding: 30px;
            }
            h1 { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div class="showcase-container">
        <!-- Left: The Art Stage -->
        <div class="visual-stage">
            <svg id="rickshaw-svg" viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Gradients for Cel-Shading -->
                    
                    <!-- Body Colors -->
                    <linearGradient id="body-main" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:var(--accent)" />
                        <stop offset="100%" style="stop-color:var(--accent-dark)" />
                    </linearGradient>
                    <linearGradient id="body-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:var(--accent-dark)" />
                        <stop offset="100%" style="stop-color:var(--accent-shadow)" />
                    </linearGradient>

                    <!-- Roof Colors -->
                    <linearGradient id="roof-main" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:var(--canopy)" />
                        <stop offset="100%" style="stop-color:var(--canopy-dark)" />
                    </linearGradient>
                    <linearGradient id="roof-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:var(--canopy-dark)" />
                        <stop offset="100%" style="stop-color:var(--canopy-shadow)" />
                    </linearGradient>

                    <!-- Chrome/Metal -->
                    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#fff" />
                        <stop offset="50%" style="stop-color:#ccc" />
                        <stop offset="100%" style="stop-color:#888" />
                    </linearGradient>

                    <!-- Glass -->
                    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#aeeeff;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#2874a6;stop-opacity:0.4" />
                    </linearGradient>

                    <!-- Tires -->
                    <linearGradient id="tire" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#333" />
                        <stop offset="100%" style="stop-color:#111" />
                    </linearGradient>
                </defs>

                <!-- Ground Shadow (Hard shape) -->
                <path d="M150,600 L650,600 Q700,600 700,620 Q700,640 650,640 L150,640 Q100,640 100,620 Q100,600 150,600 Z" fill="rgba(0,0,0,0.15)" />

                <g id="vehicle" transform="translate(50, 50)">
                    
                    <!-- === REAR SECTION (Left/Back) === -->
                    
                    <!-- Rear Wheels (Hidden behind body mostly, visible at bottom) -->
                    <g transform="translate(280, 530)">
                        <circle cx="0" cy="0" r="75" fill="url(#tire)" stroke="#000" stroke-width="4" />
                        <circle cx="0" cy="0" r="40" fill="#ddd" stroke="#333" stroke-width="2" />
                        <circle cx="0" cy="0" r="15" fill="#333" />
                        <!-- Spokes -->
                        <g class="wheel-spin">
                            <path d="M-40,0 L40,0 M0,-40 L0,40 M-28,-28 L28,28 M-28,28 L28,-28" stroke="#333" stroke-width="3" />
                        </g>
                    </g>
                    
                    <!-- Rear Wheel Mudguard (Red) -->
                    <path d="M200,530 Q280,400 360,530" fill="none" stroke="var(--canopy)" stroke-width="25" stroke-linecap="round" />

                    <!-- Main Cabin Body (Yellow) - 3/4 View -->
                    <!-- Side Panel (Front facing) -->
                    <path d="M280,280 L560,320 L560,540 L280,500 Z" fill="url(#body-main)" stroke="#000" stroke-width="2" />
                    
                    <!-- Top Panel (Side facing) -->
                    <path d="M280,280 L380,220 L660,260 L560,320 Z" fill="url(#body-main)" stroke="#000" stroke-width="2" />
                    
                    <!-- Back Panel (Side facing away) -->
                    <path d="M180,260 L280,280 L280,500 L180,480 Z" fill="url(#body-shadow)" stroke="#000" stroke-width="2" />
                    
                    <!-- Back Window -->
                    <path d="M200,290 L260,300 L260,400 L200,390 Z" fill="#111" stroke="#000" stroke-width="2" />
                    <!-- Back Window Sticker -->
                    <text x="205" y="350" font-family="Arial" font-size="10" fill="#fff" transform="rotate(-2, 205, 350)" opacity="0.8">JAI SHRI RAM</text>

                    <!-- Side Window Cutout -->
                    <path d="M300,320 L520,350 L520,480 L300,450 Z" fill="#111" stroke="#000" stroke-width="2" />
                    <!-- Window Glass Reflection -->
                    <path d="M320,330 L400,340 L380,460 L300,440 Z" fill="#fff" opacity="0.1" />

                    <!-- === ROOF (Canopy) === -->
                    <g id="roof">
                        <!-- Roof Top (Red) -->
                        <path d="M160,240 Q350,120 700,200 L660,260 Q350,180 280,280 Z" fill="url(#roof-main)" stroke="#000" stroke-width="2" />
                        <!-- Roof Side (Darker Red) -->
                        <path d="M160,240 L280,280 L180,480 L180,260 Z" fill="url(#roof-shadow)" stroke="#000" stroke-width="2" />
                        
                        <!-- Roof Trim (Yellow) -->
                        <path d="M280,280 L660,260" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" />
                        <path d="M280,280 L180,480" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" />
                    </g>

                    <!-- === DRIVER AREA === -->
                    <!-- Driver Seat -->
                    <path d="M380,220 L450,230 L450,300 L380,300 Z" fill="#333" />
                    <!-- Driver Silhouette -->
                    <g transform="translate(410, 210)">
                        <circle cx="0" cy="0" r="15" fill="#333" /> <!-- Head -->
                        <path d="M-15,15 L15,15 L10,45 L-10,45 Z" fill="#fff" /> <!-- Shirt -->
                    </g>

                    <!-- Windshield -->
                    <path d="M450,180 L550,220 L550,300 L450,260 Z" fill="url(#glass)" stroke="#000" stroke-width="2" />
                    <!-- Windshield Frame -->
                    <path d="M450,180 L550,220 L550,300 L450,260 Z" fill="none" stroke="#333" stroke-width="4" />

                    <!-- === FRONT CHASSIS === -->
                    <!-- Fork (Chrome) -->
                    <path d="M550,300 L620,350 L620,530 L600,530 L600,350 Z" fill="url(#chrome)" stroke="#000" stroke-width="1" />
                    
                    <!-- Engine Block -->
                    <path d="M500,450 L580,470 L580,550 L500,530 Z" fill="#333" stroke="#000" stroke-width="2" />
                    <!-- Exhaust Pipe -->
                    <path d="M580,490 L680,500 L680,510 L580,500 Z" fill="#888" stroke="#000" stroke-width="1" />

                    <!-- Front Wheel -->
                    <g transform="translate(610, 540)">
                        <!-- Tire -->
                        <circle cx="0" cy="0" r="80" fill="url(#tire)" stroke="#000" stroke-width="4" />
                        <!-- Rim -->
                        <circle cx="0" cy="0" r="45" fill="#ddd" stroke="#333" stroke-width="2" />
                        <!-- Spokes -->
                        <g class="wheel-spin">
                            <path d="M-45,0 L45,0 M0,-45 L0,45 M-32,-32 L32,32 M-32,32 L32,-32" stroke="#333" stroke-width="3" />
                        </g>
                        <!-- Hubcap -->
                        <circle cx="0" cy="0" r="10" fill="#333" />
                    </g>
                    
                    <!-- Front Mudguard (Red) -->
                    <path d="M530,540 Q610,420 690,540" fill="none" stroke="var(--canopy)" stroke-width="20" stroke-linecap="round" />

                    <!-- Handlebars -->
                    <g transform="translate(560, 280)">
                        <!-- Stem -->
                        <line x1="0" y1="0" x2="0" y2="50" stroke="#333" stroke-width="6" />
                        <!-- Bar -->
                        <path d="M-50,50 L50,50" stroke="#333" stroke-width="8" stroke-linecap="round" />
                        <!-- Grips -->
                        <rect x="-60" y="46" width="15" height="12" fill="#111" rx="2" />
                        <rect x="45" y="46" width="15" height="12" fill="#111" rx="2" />
                        
                        <!-- Mirrors -->
                        <path d="M-50,50 L-70,20" stroke="#333" stroke-width="2" />
                        <circle cx="-70" cy="20" r="10" fill="#ccc" stroke="#333" />
                        
                        <path d="M50,50 L70,20" stroke="#333" stroke-width="2" />
                        <circle cx="70" cy="20" r="10" fill="#ccc" stroke="#333" />
                    </g>

                    <!-- Headlamp -->
                    <g transform="translate(620, 360)">
                        <circle cx="0" cy="0" r="25" fill="#111" />
                        <circle cx="0" cy="0" r="20" fill="#ffeb3b" />
                        <circle cx="0" cy="0" r="12" fill="#fff" />
                        <!-- Shine -->
                        <path d="M-10,-10 L10,10" stroke="#fff" stroke-width="4" opacity="0.8" />
                    </g>

                    <!-- License Plate -->
                    <g transform="translate(540, 440) rotate(10)">
                        <rect x="0" y="0" width="70" height="35" fill="#fff" stroke="#333" stroke-width="2" rx="3" />
                        <text x="35" y="23" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">MH-12</text>
                    </g>

                    <!-- Ornamental Spire -->
                    <path d="M450,160 L470,100 L490,160" fill="url(#chrome)" stroke="#000" stroke-width="1" />
                    <circle cx="470" cy="100" r="8" fill="var(--canopy)" />

                </g>
            </svg>
        </div>

        <!-- Right: Info Panel -->
        <div class="info-panel">
            <div class="tagline">Heritage Series</div>
            <h1>Royal Metro</h1>
            <p class="description">
                The streets of Mumbai reimagined. A premium, cel-shaded vector showcase of the iconic Auto Rickshaw. 
                Featuring a vibrant palette, precise 3/4 perspective, and the soul of the city.
            </p>

            <div class="specs-grid">
                <div class="spec-item">
                    <h3>Engine</h3>
                    <p>3-Cyl Diesel</p>
                </div>
                <div class="spec-item">
                    <h3>Capacity</h3>
                    <p>3 Passengers</p>
                </div>
                <div class="spec-item">
                    <h3>Top Speed</h3>
                    <p>80 km/h</p>
                </div>
                <div class="spec-item">
                    <h3>Origin</h3>
                    <p>Mumbai, IN</p>
                </div>
            </div>

            <div class="controls">
                <label>Exterior Finish</label>
                <div class="color-options">
                    <!-- Taxi Yellow -->
                    <div class="color-btn active" style="background-color: #FFC300;" onclick="changeColor('#FFC300', '#e6b000', '#b38f00', '#D92525', '#a81818', '#7a1010', this)"></div>
                    <!-- Classic Red -->
                    <div class="color-btn" style="background-color: #D92525;" onclick="changeColor('#D92525', '#b31b1b', '#801212', '#FFC300', '#e6b000', '#b38f00', this)"></div>
                    <!-- Metro Blue -->
                    <div class="color-btn" style="background-color: #0056b3;" onclick="changeColor('#0056b3', '#003d80', '#00264d', '#FFC300', '#e6b000', '#b38f00', this)"></div>
                    <!-- Matte Black -->
                    <div class="color-btn" style="background-color: #333333;" onclick="changeColor('#333333', '#222222', '#111111', '#FFC300', '#e6b000', '#b38f00', this)"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function changeColor(bodyMain, bodyDark, bodyShadow, roofMain, roofDark, roofShadow, element) {
            // Update Active Button State
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            element.classList.add('active');

            // Update CSS Variables
            const root = document.documentElement;
            root.style.setProperty('--accent', bodyMain);
            root.style.setProperty('--accent-dark', bodyDark);
            root.style.setProperty('--accent-shadow', bodyShadow);
            root.style.setProperty('--canopy', roofMain);
            root.style.setProperty('--canopy-dark', roofDark);
            root.style.setProperty('--canopy-shadow', roofShadow);
        }
    </script>
</body>
</html>
