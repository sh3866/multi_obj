<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMONO | Ai-iro (Indigo)</title>
    <style>
        :root {
            /* Palette - Deep Indigo & Gold */
            --bg-color: #1A1A1A;
            --bg-gradient: radial-gradient(circle at center, #2A2A2A 0%, #0F0F0F 100%);
            --text-main: #E0E0E0;
            --text-muted: #888888;
            
            /* Kimono Colors (Default: Deep Ai-iro Indigo) */
            --k-base: #003153; 
            --k-shadow: #001828;
            --k-highlight: #004e80;
            --k-collar: #F5F5F5; /* Silk White */
            
            /* Obi Colors (Rich Vermilion & Gold) */
            --o-base: #8B0000; 
            --o-shadow: #4A0000;
            --o-highlight: #B22222;
            --o-gold: #D4AF37;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* UI Layout - Museum Placard Style */
        .ui-layer {
            position: absolute;
            top: 3rem;
            right: 3rem;
            z-index: 20;
            pointer-events: none;
        }

        .ui-card {
            background: #111111;
            padding: 2rem;
            border-left: 4px solid var(--o-gold);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 260px;
        }

        .brand {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 1rem;
        }

        .brand h1 {
            font-family: "Times New Roman", Times, serif;
            font-size: 1.4rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 0.3rem;
            color: var(--text-main);
        }

        .brand span {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 0.65rem;
            font-weight: 500;
            color: var(--o-gold);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        /* Controls */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 600;
            color: var(--text-muted);
        }

        .color-swatches {
            display: flex;
            gap: 15px;
        }

        .swatch {
            width: 32px;
            height: 32px;
            border-radius: 2px; /* Squarish for modern look */
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.2s ease, border-color 0.2s ease;
            position: relative;
        }

        .swatch:hover {
            transform: translateY(-2px);
        }

        .swatch.active {
            border-color: var(--o-gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .btn-toggle {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-muted);
            padding: 0.6rem;
            font-family: "Times New Roman", Times, serif;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-transform: uppercase;
        }

        .btn-toggle:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border-color: var(--text-main);
        }

        /* Main Stage */
        main {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        .kimono-stage {
            height: 95vh;
            width: auto;
            /* Elegant soft shadow */
            filter: drop-shadow(0 20px 50px rgba(0,0,0,0.6));
            transition: transform 0.1s linear;
            will-change: transform;
        }

        /* SVG Animations */
        .pattern-layer {
            transition: opacity 0.8s ease;
        }
        
        .pattern-hidden {
            opacity: 0;
        }

        /* Subtle shimmer on silk */
        @keyframes shimmer {
            0% { opacity: 0.02; }
            50% { opacity: 0.08; }
            100% { opacity: 0.02; }
        }
        
        .silk-shine {
            animation: shimmer 6s infinite ease-in-out;
        }

    </style>
</head>
<body>

    <!-- UI Overlay (Museum Placard) -->
    <div class="ui-layer">
        <div class="ui-card">
            <div class="brand">
                <h1>KIMONO</h1>
                <span>Heian Period Heritage</span>
            </div>
            
            <div class="control-group">
                <span class="label">Base Dye (Ai)</span>
                <div class="color-swatches">
                    <!-- Deep Indigo -->
                    <div class="swatch active" data-base="#003153" data-shadow="#001828" data-highlight="#004e80" style="background-color: #003153;"></div>
                    <!-- Midnight Black -->
                    <div class="swatch" data-base="#1C1C1C" data-shadow="#000000" data-highlight="#333333" style="background-color: #1C1C1C;"></div>
                    <!-- Deep Moss -->
                    <div class="swatch" data-base="#1B4D3E" data-shadow="#0A2920" data-highlight="#266B55" style="background-color: #1B4D3E;"></div>
                </div>
            </div>

            <div class="control-group">
                <button id="toggle-pattern" class="btn-toggle">View Plain Silk</button>
            </div>
        </div>
    </div>

    <main>
        <!-- 
            SVG REDESIGN:
            1. Geometry: Floor-length (1300px height), V-Neckline, T-Sleeves.
            2. Pattern: Maple Leaves (Momiji) & Bamboo, masked cleanly.
            3. Obi: Taiko Knot, structured front and back tails.
        -->
        <svg class="kimono-stage" viewBox="0 0 800 1300" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Gradients -->
                <linearGradient id="fabric-base" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--k-shadow); stop-opacity:1" />
                    <stop offset="15%" style="stop-color:var(--k-base); stop-opacity:1" />
                    <stop offset="85%" style="stop-color:var(--k-base); stop-opacity:1" />
                    <stop offset="100%" style="stop-color:var(--k-shadow); stop-opacity:1" />
                </linearGradient>

                <linearGradient id="obi-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--o-shadow); stop-opacity:1" />
                    <stop offset="20%" style="stop-color:var(--o-highlight); stop-opacity:1" />
                    <stop offset="50%" style="stop-color:var(--o-base); stop-opacity:1" />
                    <stop offset="80%" style="stop-color:var(--o-highlight); stop-opacity:1" />
                    <stop offset="100%" style="stop-color:var(--o-shadow); stop-opacity:1" />
                </linearGradient>

                <!-- Metallic Gold Gradient -->
                <linearGradient id="gold-metallic" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#C5A059; stop-opacity:1" />
                    <stop offset="30%" style="stop-color:#F9E596; stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#D4AF37; stop-opacity:1" />
                    <stop offset="70%" style="stop-color:#F9E596; stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#C5A059; stop-opacity:1" />
                </linearGradient>

                <linearGradient id="silk-shine-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:white; stop-opacity:0" />
                    <stop offset="50%" style="stop-color:white; stop-opacity:0.15" />
                    <stop offset="100%" style="stop-color:white; stop-opacity:0" />
                </linearGradient>

                <!-- Nature Motif: Maple Leaf (Momiji) -->
                <g id="maple-leaf">
                    <path d="M0,0 L5,-12 L16,-5 L10,5 L22,12 L10,18 L16,30 L4,24 L0,36 L-4,24 L-16,30 L-10,18 L-22,12 L-10,5 L-16,-5 L-5,-12 Z" 
                          fill="url(#gold-metallic)" opacity="0.85" />
                    <!-- Veins -->
                    <path d="M0,0 L0,36 M0,10 L-8,5 M0,10 L8,5 M0,20 L-12,15 M0,20 L12,15" stroke="#8C7326" stroke-width="0.5" fill="none" opacity="0.6"/>
                </g>

                <!-- Nature Motif: Bamboo -->
                <g id="bamboo-stalk">
                    <rect x="-4" y="0" width="8" height="140" rx="3" fill="url(#gold-metallic)" opacity="0.5" />
                    <!-- Nodes -->
                    <path d="M-4,20 Q0,24 4,20 M-4,60 Q0,64 4,60 M-4,100 Q0,104 4,100" stroke="#8C7326" stroke-width="1" fill="none" opacity="0.8"/>
                </g>

                <!-- Pattern Cluster -->
                <g id="leaf-cluster">
                    <use href="#maple-leaf" transform="translate(0,0) rotate(15) scale(1.3)" />
                    <use href="#maple-leaf" transform="translate(45, 75) rotate(-40) scale(0.9)" />
                    <use href="#maple-leaf" transform="translate(-35, 95) rotate(45) scale(1.0)" />
                    <use href="#bamboo-stalk" transform="translate(25, -70) rotate(5)" />
                </g>

                <!-- Pattern Definition -->
                <pattern id="pattern-botanical" x="0" y="0" width="240" height="240" patternUnits="userSpaceOnUse">
                    <use href="#leaf-cluster" x="10" y="10" />
                    <use href="#leaf-cluster" x="130" y="170" />
                </pattern>

                <!-- Clip Path for Pattern -->
                <clipPath id="garment-clip">
                    <!-- Main Body -->
                    <path d="M -110,-150 C -110,-200 -140,-200 -140,-150 L -140,1050 C -140,1100 -160,1120 -180,1120 L -180,1150 L 180,1150 L 180,1120 C 160,1120 140,1100 140,1050 L 140,-150 C 140,-200 110,-200 110,-150 Z" />
                    <!-- Left Sleeve (T-Shape) -->
                    <path d="M -130,-120 L -360,-120 L -360,500 C -360,530 -330,530 -330,500 L -130,500 Z" />
                    <!-- Right Sleeve (T-Shape) -->
                    <path d="M 130,-120 L 360,-120 L 360,500 C 360,530 330,530 330,500 L 130,500 Z" />
                </clipPath>
            </defs>

            <!-- Center Group -->
            <g transform="translate(400, 120)">
                
                <!-- ================= SLEEVES (Furisode T-Shape) ================= -->
                <!-- Drawn behind body -->
                
                <!-- Left Sleeve -->
                <g id="sleeve-left">
                    <!-- Main T-bar shape -->
                    <path d="M -130,-120 L -360,-120 L -360,500 C -360,530 -330,530 -330,500 L -130,500 Z" fill="url(#fabric-base)" />
                    <!-- Inner shadow -->
                    <path d="M -130,-120 L -130,500 L -160,500 L -160,-120 Z" fill="var(--k-shadow)" opacity="0.4" />
                </g>

                <!-- Right Sleeve -->
                <g id="sleeve-right">
                    <!-- Main T-bar shape -->
                    <path d="M 130,-120 L 360,-120 L 360,500 C 360,530 330,530 330,500 L 130,500 Z" fill="url(#fabric-base)" />
                    <!-- Inner shadow -->
                    <path d="M 130,-120 L 130,500 L 160,500 L 160,-120 Z" fill="var(--k-shadow)" opacity="0.4" />
                </g>

                <!-- ================= MAIN BODY ================= -->
                <!-- Floor length silhouette -->
                <path id="body-back" 
                      d="M -110,-150 C -110,-200 -140,-200 -140,-150 L -140,1050 C -140,1100 -160,1120 -180,1120 L -180,1150 L 180,1150 L 180,1120 C 160,1120 140,1100 140,1050 L 140,-150 C 140,-200 110,-200 110,-150 Z" 
                      fill="url(#fabric-base)" />

                <!-- ================= TEXTURE & PATTERNS ================= -->
                <g class="pattern-layer" clip-path="url(#garment-clip)">
                    <rect x="-400" y="-200" width="800" height="1400" fill="url(#pattern-botanical)" />
                </g>

                <!-- ================= SILK SHINE & FOLDS ================= -->
                <!-- Vertical drape lines -->
                <path d="M -100,-150 L -120,1150" stroke="var(--k-shadow)" stroke-width="4" opacity="0.15" fill="none"/>
                <path d="M 100,-150 L 120,1150" stroke="var(--k-shadow)" stroke-width="4" opacity="0.15" fill="none"/>
                
                <!-- Subtle diagonal silk sheen -->
                <path class="silk-shine" d="M -150,300 L 150,900 L 250,900 L -50,300 Z" fill="url(#silk-shine-grad)" />

                <!-- ================= COLLAR (ERI) ================= -->
                <!-- V-Neckline construction -->
                <g id="collar-group">
                    <!-- Right Collar (Outer layer, darker) -->
                    <path d="M 110,-150 Q 0,-110 -100,-150 L -100,-130 Q 0,-90 110,-130 Z" fill="var(--k-shadow)" />
                    
                    <!-- Left Collar (Inner layer, white silk) -->
                    <path d="M -110,-150 Q 0,-110 100,-150 L 100,-130 Q 0,-90 -100,-130 Z" fill="var(--k-collar)" />
                    
                    <!-- Collar Edge Detail -->
                    <path d="M -110,-140 Q 0,-100 110,-140" stroke="var(--o-gold)" stroke-width="1" fill="none" opacity="0.4"/>
                </g>

                <!-- ================= OBI (SASH) ================= -->
                <!-- Positioned at waist -->
                <g id="obi-group" transform="translate(0, 500)">
                    
                    <!-- 1. Front Wrap (The band around the waist) -->
                    <path d="M -165,-40 L 165,-40 L 165,60 L -165,60 Z" fill="url(#obi-gradient)" />
                    
                    <!-- 2. Back Knot (Taiko Musubi) -->
                    <g transform="translate(0, 10)">
                        <!-- Main Knot Block -->
                        <path d="M -70,-50 L 70,-50 L 80,50 L -80,50 Z" fill="url(#obi-gradient)" />
                        
                        <!-- Obi-Dome (The cover over the knot) -->
                        <path d="M -60,-40 L 60,-40 L 65,40 L -65,40 Z" fill="var(--o-base)" />
                        
                        <!-- Gold Accent (Noshi) on Obi-Dome -->
                        <rect x="-55" y="-20" width="110" height="40" fill="url(#gold-metallic)" opacity="0.9" />
                        <!-- Noshi folds -->
                        <path d="M -55,-20 L 55,20 M 55,-20 L -55,20" stroke="var(--o-shadow)" stroke-width="1" opacity="0.6" />
                        
                        <!-- Shadow under knot -->
                        <path d="M -80,50 L 80,50 L 80,60 L -80,60 Z" fill="rgba(0,0,0,0.4)" />
                    </g>

                    <!-- 3. Hanging Tails (Obi-age) -->
                    <!-- Left Tail -->
                    <path d="M -55,60 L -85,400 L -25,380 L 0,60 Z" fill="url(#obi-gradient)" />
                    <!-- Right Tail -->
                    <path d="M 55,60 L 85,400 L 25,380 L 0,60 Z" fill="url(#obi-gradient)" />
                    
                    <!-- Tail Patterns (Gold lines) -->
                    <path d="M -55,60 L -85,400" stroke="url(#gold-metallic)" stroke-width="2" opacity="0.6" />
                    <path d="M 55,60 L 85,400" stroke="url(#gold-metallic)" stroke-width="2" opacity="0.6" />
                </g>

            </g>
        </svg>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const stage = document.querySelector('.kimono-stage');
            const root = document.documentElement;
            const swatches = document.querySelectorAll('.swatch');
            const toggleBtn = document.getElementById('toggle-pattern');
            const patternLayer = document.querySelector('.pattern-layer');
            
            let isPatternVisible = true;

            // 1. Subtle Parallax Effect (Mouse Movement)
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth / 2 - e.clientX) / 180;
                const y = (window.innerHeight / 2 - e.clientY) / 180;
                
                // Apply subtle rotation
                stage.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
            });

            // 2. Color Switching Logic
            swatches.forEach(swatch => {
                swatch.addEventListener('click', () => {
                    swatches.forEach(s => s.classList.remove('active'));
                    swatch.classList.add('active');

                    const base = swatch.getAttribute('data-base');
                    const shadow = swatch.getAttribute('data-shadow');
                    const highlight = swatch.getAttribute('data-highlight');

                    // Smooth transition for CSS variables
                    root.style.setProperty('--k-base', base);
                    root.style.setProperty('--k-shadow', shadow);
                    root.style.setProperty('--k-highlight', highlight);
                });
            });

            // 3. Pattern Toggle
            toggleBtn.addEventListener('click', () => {
                isPatternVisible = !isPatternVisible;
                if (isPatternVisible) {
                    patternLayer.classList.remove('pattern-hidden');
                    toggleBtn.textContent = "View Plain Silk";
                } else {
                    patternLayer.classList.add('pattern-hidden');
                    toggleBtn.textContent = "Show Pattern";
                }
            });
        });
    </script>
</body>
</html>
