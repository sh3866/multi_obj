<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMONO | Furisode Collection</title>
    <style>
        :root {
            /* Palette - Washi Paper & Ink */
            --bg-color: #EBE6D9;
            --ink-color: #2B2B2B;
            --accent-color: #B22222;
            
            /* Kimono Colors (Indigo Default) */
            --k-base: #2C3E50;
            --k-shadow: #1A252F;
            --k-highlight: #34495E;
            --k-collor: #F5F5F5;
            
            /* Obi Colors */
            --o-base: #8E44AD;
            --o-shadow: #4A235A;
            --o-gold: #D4AF37;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--ink-color);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Subtle Noise Texture for Paper Feel */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        /* UI Layout */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 4rem;
        }

        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: auto;
        }

        .brand h1 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .brand span {
            display: block;
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0.6;
            border-top: 1px solid var(--ink-color);
            padding-top: 0.5rem;
            width: fit-content;
        }

        .collection-info {
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .info-item {
            font-size: 0.65rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .info-item strong {
            font-weight: 600;
            color: var(--accent-color);
        }

        /* Bottom Controls - Redesigned */
        .footer-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4rem;
            pointer-events: auto;
            margin-bottom: 1rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0.5;
            font-weight: 600;
        }

        /* Color Swatches - Elegant Circles */
        .color-swatches {
            display: flex;
            gap: 1.5rem;
        }

        .swatch {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid rgba(43, 43, 43, 0.2);
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
        }

        .swatch:hover {
            transform: scale(1.2);
        }

        .swatch.active {
            transform: scale(1.2);
            border: 1px solid var(--ink-color);
        }
        
        /* Indicator dot for active state */
        .swatch.active::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 4px; height: 4px;
            background: var(--ink-color);
            border-radius: 50%;
        }

        /* Pattern Toggle - Minimal Button */
        .btn-minimal {
            background: transparent;
            border: 1px solid var(--ink-color);
            color: var(--ink-color);
            padding: 0.5rem 1.5rem;
            font-family: inherit;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 20px;
        }

        .btn-minimal:hover {
            background: var(--ink-color);
            color: var(--bg-color);
        }

        /* Main Stage */
        main {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1500px;
        }

        .kimono-stage {
            height: 92vh;
            width: auto;
            filter: drop-shadow(0 30px 50px rgba(0,0,0,0.12));
            transition: transform 0.1s ease-out;
        }

        /* SVG Specifics */
        .pattern-layer {
            transition: opacity 0.6s ease;
        }
        
        .pattern-hidden {
            opacity: 0;
        }

    </style>
</head>
<body>

    <!-- UI Overlay -->
    <div class="ui-layer">
        <header class="header">
            <div class="brand">
                <h1>KIMONO</h1>
                <span>Furisode / Yūzen</span>
            </div>
            <div class="collection-info">
                <div class="info-item">Collection: <strong>Botanical Ink</strong></div>
                <div class="info-item">Season: <strong>Autumn 2024</strong></div>
            </div>
        </header>

        <footer class="footer-controls">
            <div class="control-group">
                <span class="label">Colorway</span>
                <div class="color-swatches">
                    <!-- Indigo -->
                    <div class="swatch active" data-base="#2C3E50" data-shadow="#1A252F" data-highlight="#34495E" style="background-color: #2C3E50;"></div>
                    <!-- Brown -->
                    <div class="swatch" data-base="#5D4037" data-shadow="#3E2723" data-highlight="#795548" style="background-color: #5D4037;"></div>
                    <!-- Crimson -->
                    <div class="swatch" data-base="#B71C1C" data-shadow="#7F0000" data-highlight="#D32F2F" style="background-color: #B71C1C;"></div>
                </div>
            </div>
            <div class="control-group">
                <span class="label">Pattern</span>
                <button id="toggle-pattern" class="btn-minimal">Hide</button>
            </div>
        </footer>
    </div>

    <main>
        <!-- 
            SVG REDESIGN IMPLEMENTATION:
            1. Organic Silhouette: Tapered waist, flared hem.
            2. Furisode Sleeves: Distinct T-shape with drop.
            3. Collar: Layered Left-over-Right 'I' shape.
            4. Obi: Taiko Musubi knot with volume.
            5. Cel-Shading: Polygonal gradients instead of soft noise.
        -->
        <svg class="kimono-stage" viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 1. Cel-Shading Gradients (Sharp transitions) -->
                <linearGradient id="fabric-base" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--k-shadow); stop-opacity:1" />
                    <stop offset="30%" style="stop-color:var(--k-base); stop-opacity:1" />
                    <stop offset="70%" style="stop-color:var(--k-base); stop-opacity:1" />
                    <stop offset="100%" style="stop-color:var(--k-shadow); stop-opacity:1" />
                </linearGradient>

                <linearGradient id="fabric-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:var(--k-highlight); stop-opacity:1" />
                    <stop offset="50%" style="stop-color:var(--k-base); stop-opacity:1" />
                </linearGradient>

                <!-- 2. Obi Volume Gradient -->
                <linearGradient id="obi-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--o-shadow); stop-opacity:1" />
                    <stop offset="15%" style="stop-color:var(--o-base); stop-opacity:1" />
                    <stop offset="85%" style="stop-color:var(--o-base); stop-opacity:1" />
                    <stop offset="100%" style="stop-color:var(--o-shadow); stop-opacity:1" />
                </linearGradient>

                <!-- 3. Pattern: High Contrast Ferns -->
                <pattern id="pattern-fern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
                    <rect width="100" height="100" fill="transparent" />
                    <g stroke="var(--k-highlight)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
                        <!-- Stem -->
                        <path d="M50,10 L50,90" />
                        <!-- Fronds -->
                        <path d="M50,30 Q70,20 80,40" />
                        <path d="M50,30 Q30,20 20,40" />
                        <path d="M50,50 Q70,40 80,60" />
                        <path d="M50,50 Q30,40 20,60" />
                        <path d="M50,70 Q70,60 80,80" />
                        <path d="M50,70 Q30,60 20,80" />
                    </g>
                    <!-- Accent dots -->
                    <circle cx="50" cy="10" r="2" fill="var(--o-gold)" opacity="0.8"/>
                </pattern>

                <!-- 4. Obi Pattern -->
                <pattern id="pattern-obi" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
                    <rect width="10" height="10" fill="var(--o-base)" />
                    <path d="M0,0 L10,10" stroke="var(--o-gold)" stroke-width="1" opacity="0.4"/>
                </pattern>

                <!-- Clip Path for Main Body -->
                <clipPath id="body-clip">
                    <path d="M 50,-550 C 150,-550 180,-500 200,-400 C 220,-200 240,0 260,600 L -260,600 C -240,0 -220,-200 -200,-400 C -180,-500 -150,-550 -50,-550 Z" />
                </clipPath>
            </defs>

            <!-- Center Group -->
            <g transform="translate(400, 580)">
                
                <!-- ================= BACK LAYER (Right Side) ================= -->
                <!-- Right Skirt (Flared) -->
                <path d="M 20,-550 C 100,-550 140,-450 160,-350 C 180,-100 200,200 240,600 L 0,600 Z" fill="url(#fabric-base)" />
                
                <!-- Right Sleeve (Furisode T-Shape) -->
                <!-- Horizontal part -->
                <path d="M 140,-520 L 340,-520 L 340,-320 L 140,-320 Z" fill="url(#fabric-base)" />
                <!-- Vertical Drop (Long) -->
                <path d="M 140,-520 L 340,-520 L 340,300 L 140,300 Z" fill="url(#fabric-base)" />


                <!-- ================= FRONT LAYER (Left Side) ================= -->
                <!-- Left Skirt (Flared, overlaps center) -->
                <path d="M -20,-550 C -100,-550 -140,-450 -160,-350 C -180,-100 -200,200 -240,600 L 0,600 Z" fill="url(#fabric-base)" />

                <!-- Left Sleeve (Furisode T-Shape) -->
                <path d="M -140,-520 L -340,-520 L -340,-320 L -140,-320 Z" fill="url(#fabric-base)" />
                <path d="M -140,-520 L -340,-520 L -340,300 L -140,300 Z" fill="url(#fabric-base)" />

                <!-- ================= SHADING & FOLDS (Cel-Shaded Polygons) ================= -->
                <!-- Center Crease -->
                <path d="M 0,-550 L 0,600" stroke="black" stroke-width="4" opacity="0.15" />
                <!-- Sleeve Hem Folds -->
                <path d="M -340,-320 L -140,-320" stroke="black" stroke-width="3" opacity="0.1" />
                <path d="M 140,-320 L 340,-320" stroke="black" stroke-width="3" opacity="0.1" />
                <!-- Hem Folds -->
                <path d="M -240,600 L -100,600" stroke="black" stroke-width="2" opacity="0.1" />
                <path d="M 100,600 L 240,600" stroke="black" stroke-width="2" opacity="0.1" />


                <!-- ================= PATTERNS ================= -->
                <g class="pattern-layer">
                    <!-- Apply Pattern to Body -->
                    <rect x="-300" y="-600" width="600" height="1200" fill="url(#pattern-fern)" clip-path="url(#body-clip)" />
                    
                    <!-- Apply Pattern to Sleeves -->
                    <path d="M -140,-520 L -340,-520 L -340,300 L -140,300 Z" fill="url(#pattern-fern)" />
                    <path d="M 140,-520 L 340,-520 L 340,300 L 140,300 Z" fill="url(#pattern-fern)" />
                </g>


                <!-- ================= COLLAR (ERI) - Layered ================= -->
                <!-- 1. Outer Collar (Right side - Darker) -->
                <path d="M 150,-550 Q 80,-500 0,-450 L 0,580 L -10,580 L -10,-450 Q 70,-500 140,-550 Z" fill="var(--k-shadow)" />
                
                <!-- 2. Inner Collar (Left side - White/Silk) -->
                <!-- Starts at left shoulder, goes down center, slightly overlaps right side -->
                <path d="M -150,-550 Q -80,-500 -10,-450 L -10,580 L 5,580 L 5,-450 Q -70,-500 -140,-550 Z" fill="var(--k-collor)" />
                
                <!-- Collar Shadow (Cast by Left onto Right/Body) -->
                <path d="M 0,-450 L 0,580" stroke="rgba(0,0,0,0.2)" stroke-width="2" />


                <!-- ================= OBI (SASH) - Volumetric ================= -->
                <g transform="translate(0, -20)">
                    
                    <!-- Back Knot (Taiko Musubi) -->
                    <g transform="translate(0, -20)">
                        <!-- Main Body -->
                        <path d="M -70,-60 L 70,-60 L 90,60 L -90,60 Z" fill="url(#obi-gradient)" />
                        <!-- Knot Texture/Shadow -->
                        <path d="M -70,-60 L 70,-60 L 60,-40 L -60,-40 Z" fill="rgba(0,0,0,0.2)" />
                        <path d="M -70,-60 L -60,60 L -40,60 L -50,-60 Z" fill="rgba(0,0,0,0.1)" />
                        <path d="M 70,-60 L 60,60 L 40,60 L 50,-60 Z" fill="rgba(0,0,0,0.1)" />
                        
                        <!-- Center Band (Noshi) -->
                        <rect x="-50" y="-10" width="100" height="20" fill="var(--o-gold)" opacity="0.8" />
                        <path d="M -50,-10 L 50,10 M 50,-10 L -50,10" stroke="var(--o-shadow)" stroke-width="1" opacity="0.5" />
                    </g>

                    <!-- Front Wrap -->
                    <path d="M -180,-40 L 180,-40 L 180,80 L -180,80 Z" fill="url(#obi-gradient)" />
                    <!-- Obi Pattern Overlay -->
                    <path d="M -180,-40 L 180,-40 L 180,80 L -180,80 Z" fill="url(#pattern-obi)" opacity="0.9" />
                    
                    <!-- Obi-Age (Red/Black strip) -->
                    <rect x="-180" y="-40" width="360" height="5" fill="#111" />
                    <rect x="-180" y="75" width="360" height="5" fill="#111" />

                    <!-- Hanging Tails -->
                    <path d="M -40,80 L -60,350 L -10,340 L 0,80 Z" fill="url(#obi-gradient)" />
                    <path d="M 40,80 L 60,350 L 10,340 L 0,80 Z" fill="url(#obi-gradient)" />
                    
                    <!-- Tails Pattern -->
                    <path d="M -40,80 L -60,350 L -10,340 L 0,80 Z" fill="url(#pattern-obi)" />
                    <path d="M 40,80 L 60,350 L 10,340 L 0,80 Z" fill="url(#pattern-obi)" />
                </g>

            </g>
        </svg>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const stage = document.querySelector('.kimono-stage');
            const root = document.documentElement;
            const swatches = document.querySelectorAll('.swatch');
            const toggleBtn = document.getElementById('toggle-pattern');
            const patternLayer = document.querySelector('.pattern-layer');
            
            let isPatternVisible = true;

            // 1. Subtle Parallax Effect
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth / 2 - e.clientX) / 100;
                const y = (window.innerHeight / 2 - e.clientY) / 100;
                
                // Apply rotation
                stage.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
            });

            // 2. Color Switching Logic
            swatches.forEach(swatch => {
                swatch.addEventListener('click', () => {
                    swatches.forEach(s => s.classList.remove('active'));
                    swatch.classList.add('active');

                    const base = swatch.getAttribute('data-base');
                    const shadow = swatch.getAttribute('data-shadow');
                    const highlight = swatch.getAttribute('data-highlight');

                    // Smooth transition for CSS variables
                    root.style.setProperty('--k-base', base);
                    root.style.setProperty('--k-shadow', shadow);
                    root.style.setProperty('--k-highlight', highlight);
                });
            });

            // 3. Pattern Toggle
            toggleBtn.addEventListener('click', () => {
                isPatternVisible = !isPatternVisible;
                if (isPatternVisible) {
                    patternLayer.classList.remove('pattern-hidden');
                    toggleBtn.textContent = "Hide";
                } else {
                    patternLayer.classList.add('pattern-hidden');
                    toggleBtn.textContent = "Show";
                }
            });
        });
    </script>
</body>
</html>
