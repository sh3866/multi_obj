<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMONO | Autumn Fern Collection</title>
    <style>
        :root {
            /* Palette - Washi Paper & Ink */
            --bg-color: #EBE6D9; /* Warm Washi */
            --ink-color: #2B2B2B; /* Soft Charcoal */
            --accent-color: #B22222; /* Firebrick / Benizari */
            
            /* Kimono Colors (Indigo Default) */
            --k-base: #2C3E50; 
            --k-shadow: #1A252F;
            --k-highlight: #34495E;
            --k-collor: #F5F5F5; /* Silk White */
            
            /* Obi Colors */
            --o-base: #8E44AD; /* Deep Violet */
            --o-shadow: #4A235A;
            --o-gold: #D4AF37;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--ink-color);
            font-family: "Georgia", "Times New Roman", serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Subtle Noise Texture for Paper Feel */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        /* UI Layout */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* Let clicks pass through to stage if needed */
            z-index: 20;
            display: grid;
            grid-template-rows: auto 1fr auto;
            padding: 2rem 4rem;
        }

        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: auto;
        }

        .brand {
            display: flex;
            flex-direction: column;
        }

        .brand h1 {
            font-size: 1.4rem;
            letter-spacing: 0.1em;
            font-weight: normal;
            text-transform: uppercase;
            border-bottom: 1px solid var(--ink-color);
            padding-bottom: 8px;
            margin-bottom: 4px;
        }

        .brand span {
            font-size: 0.75rem;
            color: var(--ink-color);
            opacity: 0.6;
            letter-spacing: 0.05em;
        }

        .collection-info {
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .info-item {
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        .info-item strong {
            font-weight: normal;
            color: var(--accent-color);
        }

        /* Bottom Controls */
        .footer-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3rem;
            pointer-events: auto;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            opacity: 0.7;
        }

        .color-swatches {
            display: flex;
            gap: 0.75rem;
        }

        .swatch {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .swatch:hover {
            transform: scale(1.1);
        }

        .swatch.active {
            box-shadow: 0 0 0 2px var(--bg-color), 0 0 0 4px var(--ink-color);
        }

        /* Main Stage */
        main {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        .kimono-stage {
            height: 90vh;
            width: auto;
            /* Soft drop shadow for presence */
            filter: drop-shadow(0 25px 40px rgba(0,0,0,0.15));
            transition: transform 0.1s ease-out;
            /* Ensure SVG scales nicely */
            max-width: 100%;
        }

        /* SVG Specifics */
        .pattern-layer {
            transition: opacity 0.5s ease;
        }
        
        .pattern-hidden {
            opacity: 0.1;
        }

    </style>
</head>
<body>

    <!-- UI Overlay -->
    <div class="ui-layer">
        <header class="header">
            <div class="brand">
                <h1>KIMONO</h1>
                <span>EST. 1890 TOKYO</span>
            </div>
            <div class="collection-info">
                <div class="info-item">COLLECTION: <strong>Autumn Fern</strong></div>
                <div class="info-item">MATERIAL: <strong>Yūzen Silk</strong></div>
                <div class="info-item">DYEING: <strong>Hand-painted</strong></div>
            </div>
        </header>

        <footer class="footer-controls">
            <div class="control-group">
                <span class="label">Colorway</span>
                <div class="color-swatches">
                    <div class="swatch active" data-base="#2C3E50" data-shadow="#1A252F" data-highlight="#34495E" style="background-color: #2C3E50;"></div>
                    <div class="swatch" data-base="#5D4037" data-shadow="#3E2723" data-highlight="#795548" style="background-color: #5D4037;"></div>
                    <div class="swatch" data-base="#B71C1C" data-shadow="#7F0000" data-highlight="#D32F2F" style="background-color: #B71C1C;"></div>
                </div>
            </div>
            <div class="control-group">
                <span class="label">View</span>
                <button id="toggle-pattern" style="
                    background: transparent;
                    border: 1px solid var(--ink-color);
                    color: var(--ink-color);
                    padding: 0.4rem 1rem;
                    font-family: inherit;
                    font-size: 0.7rem;
                    text-transform: uppercase;
                    letter-spacing: 0.1em;
                    cursor: pointer;
                    transition: all 0.3s;
                ">Hide Pattern</button>
            </div>
        </footer>
    </div>

    <main>
        <!-- 
            SVG REDESIGN:
            1. ViewBox 0 0 800 1200 to capture full length.
            2. T-Sleeves (Tate-sode) geometry corrected.
            3. Collar (Eri) structure fixed (Left over Right).
            4. Obi (Sash) volume and knot (Taisa) added.
            5. Patterns and Gradients applied.
        -->
        <svg class="kimono-stage" viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 1. Fabric Base Gradient (Silk Sheen) -->
                <linearGradient id="fabric-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:var(--k-highlight); stop-opacity:1" />
                    <stop offset="40%" style="stop-color:var(--k-base); stop-opacity:1" />
                    <stop offset="100%" style="stop-color:var(--k-shadow); stop-opacity:1" />
                </linearGradient>

                <!-- 2. Obi Gradient (Volume) -->
                <linearGradient id="obi-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--o-shadow); stop-opacity:1" />
                    <stop offset="20%" style="stop-color:var(--o-base); stop-opacity:1" />
                    <stop offset="80%" style="stop-color:var(--o-base); stop-opacity:1" />
                    <stop offset="100%" style="stop-color:var(--o-shadow); stop-opacity:1" />
                </linearGradient>

                <!-- 3. High-Fidelity Pattern (Stylized Fern/Autumn Leaf) -->
                <pattern id="pattern-fern" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
                    <rect width="80" height="80" fill="transparent" />
                    <!-- Fern Motif -->
                    <g fill="var(--k-highlight)" opacity="0.4">
                        <!-- Central Stem -->
                        <path d="M40,0 L40,80" stroke="currentColor" stroke-width="2" fill="none"/>
                        <!-- Leaves -->
                        <path d="M40,20 Q60,10 70,30 Q50,40 40,30 Z" />
                        <path d="M40,20 Q20,10 10,30 Q30,40 40,30 Z" />
                        <path d="M40,50 Q60,40 70,60 Q50,70 40,60 Z" />
                        <path d="M40,50 Q20,40 10,60 Q30,70 40,60 Z" />
                    </g>
                    <!-- Gold accents -->
                    <circle cx="40" cy="80" r="1.5" fill="var(--o-gold)" opacity="0.6"/>
                </pattern>

                <!-- 4. Obi Pattern (Geometric) -->
                <pattern id="pattern-obi" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                    <rect width="20" height="20" fill="var(--o-base)" />
                    <path d="M0,0 L20,20 M20,0 L0,20" stroke="var(--o-gold)" stroke-width="0.5" opacity="0.5"/>
                </pattern>

                <!-- 5. Shadow Gradient for Folds -->
                <linearGradient id="fold-shadow" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:black; stop-opacity:0.4" />
                    <stop offset="50%" style="stop-color:black; stop-opacity:0" />
                    <stop offset="100%" style="stop-color:black; stop-opacity:0.4" />
                </linearGradient>
            </defs>

            <g id="kimono-body" transform="translate(400, 600)">
                
                <!-- ================= BACK LAYER (RIGHT SIDE OF BODY) ================= -->
                <!-- Right Skirt Panel -->
                <path d="M0,-550 L100,-550 L160,600 L0,600 Z" fill="url(#fabric-sheen)" />
                <!-- Right Sleeve (Tate-sode) -->
                <!-- Horizontal T-Shape: Drops down from shoulder, extends out, folds back -->
                <path d="M100,-550 L320,-550 L320,-350 L100,-350 Z" fill="url(#fabric-sheen)" />
                <!-- Sleeve Drop (Furisode style length) -->
                <path d="M100,-550 L320,-550 L320,300 L100,300 Z" fill="url(#fabric-sheen)" />

                <!-- ================= FRONT LAYER (LEFT SIDE OF BODY) ================= -->
                <!-- Left Skirt Panel -->
                <path d="M0,-550 L-100,-550 L-160,600 L0,600 Z" fill="url(#fabric-sheen)" />
                
                <!-- Left Sleeve (Tate-sode) -->
                <path d="M-100,-550 L-320,-550 L-320,-350 L-100,-350 Z" fill="url(#fabric-sheen)" />
                <!-- Sleeve Drop -->
                <path d="M-100,-550 L-320,-550 L-320,300 L-100,300 Z" fill="url(#fabric-sheen)" />

                <!-- ================= PATTERNS ================= -->
                <!-- Apply Pattern to all fabric areas -->
                <g class="pattern-layer">
                    <path d="M0,-550 L100,-550 L160,600 L0,600 Z" fill="url(#pattern-fern)" />
                    <path d="M100,-550 L320,-350 L320,300 L100,300 Z" fill="url(#pattern-fern)" /> <!-- Right Sleeve -->
                    
                    <path d="M0,-550 L-100,-550 L-160,600 L0,600 Z" fill="url(#pattern-fern)" />
                    <path d="M-100,-550 L-320,-350 L-320,300 L-100,300 Z" fill="url(#pattern-fern)" /> <!-- Left Sleeve -->
                </g>

                <!-- ================= COLLAR (ERI) ================= -->
                <!-- Right Collar (Underneath) - Visible only at neck -->
                <path d="M100,-550 Q50,-520 0,-480 L0,-450 Q50,-490 100,-520 Z" fill="var(--k-collor)" />
                
                <!-- Left Collar (Overlapping) - The continuous lapel -->
                <!-- Starts at shoulder, goes down center, curves slightly -->
                <path d="M-100,-550 Q-50,-520 0,-480 L0,580 Q-8,580 -15,580 L-15,-480 Q-55,-520 -100,-550 Z" fill="var(--k-collor)" />
                
                <!-- Collar Shadow (Depth) -->
                <path d="M0,-480 L0,580 Q-8,580 -15,580 L-15,-480" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="2" />

                <!-- ================= OBI (SASH) ================= -->
                <!-- Positioned at Waist (approx y = -50) -->
                <g id="obi-group" transform="translate(0, -50)">
                    
                    <!-- Obi Back (Noshi) - Visible hint behind -->
                    <path d="M-30,-20 Q0,10 30,-20 L30,60 Q0,90 -30,60 Z" fill="var(--o-shadow)" />

                    <!-- Obi Front Band -->
                    <!-- Wider band wrapping around -->
                    <path d="M-140,-25 L140,-25 L140,75 L-140,75 Z" fill="url(#obi-sheen)" />
                    <!-- Obi Pattern Overlay -->
                    <path d="M-140,-25 L140,-25 L140,75 L-140,75 Z" fill="url(#pattern-obi)" opacity="0.8" />

                    <!-- Obi Cord (Obi-age) -->
                    <rect x="-140" y="-25" width="280" height="4" fill="#222" />
                    <rect x="-140" y="71" width="280" height="4" fill="#222" />

                    <!-- Obi Knot (Taisa) - Front Bow -->
                    <g transform="translate(0, 25)">
                        <!-- Main Bow Loops -->
                        <path d="M-60,-20 Q-30,-40 0,-20 Q30,-40 60,-20 L60,40 Q30,60 0,40 Q-30,60 -60,40 Z" fill="var(--o-base)" />
                        <!-- Knot Shadow -->
                        <path d="M-60,-20 Q-30,-40 0,-20 Q30,-40 60,-20 L60,40 Q30,60 0,40 Q-30,60 -60,40 Z" fill="url(#fold-shadow)" />
                        
                        <!-- Tails hanging down -->
                        <path d="M-40,40 L-50,120 L-10,110 L0,50 Z" fill="var(--o-base)" />
                        <path d="M40,40 L50,120 L10,110 L0,50 Z" fill="var(--o-base)" />
                        
                        <!-- Gold Trim on Knot -->
                        <path d="M-55,-15 Q-30,-30 0,-15 Q30,-30 55,-15" fill="none" stroke="var(--o-gold)" stroke-width="2" />
                    </g>
                </g>

                <!-- ================= FOLDS & DETAILS ================= -->
                <!-- Center Seam Shadow -->
                <path d="M0,-550 L0,-50" stroke="black" stroke-width="1" opacity="0.2" />
                
                <!-- Hem Folds (Koshi) -->
                <path d="M-160,550 L-160,600" stroke="black" stroke-width="1" opacity="0.2" />
                <path d="M160,550 L160,600" stroke="black" stroke-width="1" opacity="0.2" />

                <!-- Sleeve Cuff Folds -->
                <path d="M-100,-350 L-320,-350" stroke="black" stroke-width="2" opacity="0.2" />
                <path d="M100,-350 L320,-350" stroke="black" stroke-width="2" opacity="0.2" />

            </g>
        </svg>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const stage = document.querySelector('.kimono-stage');
            const root = document.documentElement;
            const swatches = document.querySelectorAll('.swatch');
            const toggleBtn = document.getElementById('toggle-pattern');
            const patternLayer = document.querySelector('.pattern-layer');
            
            let isPatternVisible = true;

            // 1. Subtle Parallax / Hover Effect
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth / 2 - e.clientX) / 80;
                const y = (window.innerHeight / 2 - e.clientY) / 80;
                
                // Apply rotation to the SVG stage for 3D effect
                stage.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
            });

            // 2. Color Switching Logic
            swatches.forEach(swatch => {
                swatch.addEventListener('click', () => {
                    // Update UI
                    swatches.forEach(s => s.classList.remove('active'));
                    swatch.classList.add('active');

                    // Update CSS Variables
                    const base = swatch.getAttribute('data-base');
                    const shadow = swatch.getAttribute('data-shadow');
                    const highlight = swatch.getAttribute('data-highlight');

                    root.style.setProperty('--k-base', base);
                    root.style.setProperty('--k-shadow', shadow);
                    root.style.setProperty('--k-highlight', highlight);
                });
            });

            // 3. Pattern Toggle
            toggleBtn.addEventListener('click', () => {
                isPatternVisible = !isPatternVisible;
                if (isPatternVisible) {
                    patternLayer.classList.remove('pattern-hidden');
                    toggleBtn.textContent = "Hide Pattern";
                } else {
                    patternLayer.classList.add('pattern-hidden');
                    toggleBtn.textContent = "Show Pattern";
                }
            });
        });
    </script>
</body>
</html>
