<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMONO | Botanica</title>
    <style>
        :root {
            /* Palette - Washi & Ink */
            --bg-color: #EBE6D9;
            --ink-color: #2B2B2B;
            --accent-color: #8B3A3A; /* Deep Madder Red */
            
            /* Kimono Colors (Default: Indigo) */
            --k-base: #2C3E50;
            --k-shadow: #151E27;
            --k-highlight: #3E5871;
            --k-collor: #F4F4F4;
            
            /* Obi Colors */
            --o-base: #5D4037; /* Earthy Brown */
            --o-shadow: #3E2723;
            --o-highlight: #795548;
            --o-gold: #D4AF37;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--ink-color);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Subtle Noise Texture for Paper Feel */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        /* UI Layout - Floating Top Right Card */
        .ui-layer {
            position: absolute;
            top: 2rem;
            right: 2rem;
            z-index: 20;
            pointer-events: none;
        }

        .ui-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            padding: 1.5rem;
            border-radius: 4px;
            border: 1px solid rgba(43, 43, 43, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            min-width: 200px;
        }

        .brand {
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding-bottom: 1rem;
        }

        .brand h1 {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .brand span {
            font-size: 0.7rem;
            color: #666;
            letter-spacing: 0.05em;
        }

        /* Controls */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 600;
            color: #888;
        }

        .color-swatches {
            display: flex;
            gap: 1rem;
        }

        .swatch {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }

        .swatch:hover {
            transform: scale(1.1);
        }

        .swatch.active {
            box-shadow: 0 0 0 2px var(--bg-color), 0 0 0 4px var(--ink-color);
        }

        .btn-toggle {
            background: transparent;
            border: 1px solid var(--ink-color);
            color: var(--ink-color);
            padding: 0.6rem;
            font-family: inherit;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-toggle:hover {
            background: var(--ink-color);
            color: var(--bg-color);
        }

        /* Main Stage */
        main {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        .kimono-stage {
            height: 95vh;
            width: auto;
            filter: drop-shadow(0 40px 60px rgba(0,0,0,0.15));
            transition: transform 0.1s linear;
            will-change: transform;
        }

        /* SVG Animations */
        .leaf {
            opacity: 0.8;
            transition: opacity 0.5s ease;
        }
        
        .pattern-hidden .leaf {
            opacity: 0;
        }

        /* Subtle shimmer on silk */
        @keyframes shimmer {
            0% { opacity: 0.3; }
            50% { opacity: 0.6; }
            100% { opacity: 0.3; }
        }
        
        .silk-shine {
            animation: shimmer 4s infinite ease-in-out;
        }

    </style>
</head>
<body>

    <!-- UI Overlay (Top Right) -->
    <div class="ui-layer">
        <div class="ui-card">
            <div class="brand">
                <h1>KIMONO</h1>
                <span>Autumn Collection</span>
            </div>
            
            <div class="control-group">
                <span class="label">Fabric Color</span>
                <div class="color-swatches">
                    <!-- Indigo -->
                    <div class="swatch active" data-base="#2C3E50" data-shadow="#151E27" data-highlight="#3E5871" style="background-color: #2C3E50;"></div>
                    <!-- Vermillion -->
                    <div class="swatch" data-base="#8B3A3A" data-shadow="#561e1e" data-highlight="#A64B4B" style="background-color: #8B3A3A;"></div>
                    <!-- Moss -->
                    <div class="swatch" data-base="#2F4F4F" data-shadow="#1A2F2F" data-highlight="#406969" style="background-color: #2F4F4F;"></div>
                </div>
            </div>

            <div class="control-group">
                <button id="toggle-pattern" class="btn-toggle">Hide Pattern</button>
            </div>
        </div>
    </div>

    <main>
        <!-- 
            SVG REDESIGN:
            1. Unified Silhouette: Full length, floor hem, distinct T-sleeves.
            2. Ink-wash Pattern: Falling maple leaves, organic flow.
            3. Volumetric Obi: Taiko knot with depth and hanging tails.
        -->
        <svg class="kimono-stage" viewBox="0 0 800 1100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Gradients -->
                <linearGradient id="fabric-base" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--k-shadow); stop-opacity:1" />
                    <stop offset="20%" style="stop-color:var(--k-base); stop-opacity:1" />
                    <stop offset="80%" style="stop-color:var(--k-base); stop-opacity:1" />
                    <stop offset="100%" style="stop-color:var(--k-shadow); stop-opacity:1" />
                </linearGradient>

                <linearGradient id="obi-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--o-shadow); stop-opacity:1" />
                    <stop offset="20%" style="stop-color:var(--o-highlight); stop-opacity:1" />
                    <stop offset="50%" style="stop-color:var(--o-base); stop-opacity:1" />
                    <stop offset="80%" style="stop-color:var(--o-highlight); stop-opacity:1" />
                    <stop offset="100%" style="stop-color:var(--o-shadow); stop-opacity:1" />
                </linearGradient>

                <linearGradient id="silk-shine-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:white; stop-opacity:0" />
                    <stop offset="50%" style="stop-color:white; stop-opacity:0.1" />
                    <stop offset="100%" style="stop-color:white; stop-opacity:0" />
                </linearGradient>

                <!-- Single Maple Leaf Graphic -->
                <g id="maple-leaf">
                    <path d="M0,0 L5,-10 L15,-5 L10,5 L20,10 L10,15 L15,25 L5,20 L0,30 L-5,20 L-15,25 L-10,15 L-20,10 L-10,5 L-15,-5 L-5,-10 Z" 
                          fill="var(--o-gold)" opacity="0.6" />
                    <path d="M0,0 L0,30" stroke="var(--o-gold)" stroke-width="1" opacity="0.8" fill="none"/>
                </g>

                <!-- Bamboo Graphic -->
                <g id="bamboo-stalk">
                    <rect x="-2" y="0" width="4" height="100" fill="var(--o-gold)" opacity="0.4" />
                    <path d="M-2,20 Q0,22 2,20" stroke="var(--k-shadow)" stroke-width="1" fill="none" opacity="0.5"/>
                    <path d="M-2,50 Q0,52 2,50" stroke="var(--k-shadow)" stroke-width="1" fill="none" opacity="0.5"/>
                    <path d="M-2,80 Q0,82 2,80" stroke="var(--k-shadow)" stroke-width="1" fill="none" opacity="0.5"/>
                </g>

                <!-- Pattern Group -->
                <g id="leaf-cluster">
                    <use href="#maple-leaf" transform="translate(0,0) rotate(15) scale(1.2)" />
                    <use href="#maple-leaf" transform="translate(40, 60) rotate(-30) scale(0.8)" />
                    <use href="#maple-leaf" transform="translate(-30, 80) rotate(45) scale(0.9)" />
                    <use href="#bamboo-stalk" transform="translate(20, -50) rotate(5)" />
                </g>

                <pattern id="pattern-botanical" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
                    <use href="#leaf-cluster" x="10" y="10" />
                    <use href="#leaf-cluster" x="120" y="150" />
                </pattern>
            </defs>

            <!-- Center Group -->
            <g transform="translate(400, 50)">
                
                <!-- ================= MAIN BODY (Back/Right Layer) ================= -->
                <!-- The unified back panel. Straight hem, tapering up to shoulders. -->
                <path id="body-back" 
                      d="M -120,-100 L 120,-100 L 180,900 L -180,900 Z" 
                      fill="url(#fabric-base)" />

                <!-- ================= SLEEVES (Furisode T-Shape) ================= -->
                <!-- Left Sleeve -->
                <g id="sleeve-left">
                    <!-- Upper T-bar -->
                    <path d="M -110,-90 L -320,-90 L -320,80 L -110,80 Z" fill="url(#fabric-base)" />
                    <!-- Drop -->
                    <path d="M -110,-90 L -320,-90 L -320,450 L -110,450 Z" fill="url(#fabric-base)" />
                    <!-- Inner Fold -->
                    <path d="M -110,-90 L -320,-90 L -320,80 L -110,80 Z" fill="var(--k-shadow)" opacity="0.3" />
                </g>

                <!-- Right Sleeve -->
                <g id="sleeve-right">
                    <!-- Upper T-bar -->
                    <path d="M 110,-90 L 320,-90 L 320,80 L 110,80 Z" fill="url(#fabric-base)" />
                    <!-- Drop -->
                    <path d="M 110,-90 L 320,-90 L 320,450 L 110,450 Z" fill="url(#fabric-base)" />
                    <!-- Inner Fold -->
                    <path d="M 110,-90 L 320,-90 L 320,80 L 110,80 Z" fill="var(--k-shadow)" opacity="0.3" />
                </g>

                <!-- ================= FRONT PANEL (Left Layer) ================= -->
                <!-- Overlaps the back panel on the left side to create the 'I' shape -->
                <path id="body-front" 
                      d="M -120,-100 Q 0,-60 120,-100 L 180,900 L -180,900 Z" 
                      fill="url(#fabric-base)" />

                <!-- ================= TEXTURE & PATTERNS ================= -->
                <g class="pattern-layer">
                    <!-- Pattern on Back -->
                    <path d="M -120,-100 L 120,-100 L 180,900 L -180,900 Z" fill="url(#pattern-botanical)" />
                    
                    <!-- Pattern on Sleeves -->
                    <path d="M -110,-90 L -320,-90 L -320,450 L -110,450 Z" fill="url(#pattern-botanical)" />
                    <path d="M 110,-90 L 320,-90 L 320,450 L 110,450 Z" fill="url(#pattern-botanical)" />
                </g>

                <!-- ================= SILK SHINE & FOLDS ================= -->
                <!-- Vertical drape lines -->
                <path d="M -100,-100 L -120,900" stroke="var(--k-shadow)" stroke-width="2" opacity="0.2" fill="none"/>
                <path d="M 100,-100 L 120,900" stroke="var(--k-shadow)" stroke-width="2" opacity="0.2" fill="none"/>
                
                <!-- Subtle diagonal silk sheen -->
                <path class="silk-shine" d="M -150,200 L 150,800 L 250,800 L -50,200 Z" fill="url(#silk-shine-grad)" />

                <!-- ================= COLLAR (ERI) ================= -->
                <!-- Outer Collar (Right side, darker) -->
                <path d="M 110,-100 Q 0,-60 -110,-100 L -110,-80 Q 0,-40 110,-80 Z" fill="var(--k-shadow)" />
                
                <!-- Inner Collar (Left side, White/Silk) -->
                <!-- V-Neck shape -->
                <path d="M -110,-100 Q 0,-60 110,-100 L 100,-80 Q 0,-40 -100,-80 Z" fill="var(--k-collor)" />
                
                <!-- Collar Edge Detail -->
                <path d="M -110,-90 Q 0,-50 110,-90" stroke="var(--k-shadow)" stroke-width="1" fill="none" opacity="0.5"/>

                <!-- ================= OBI (SASH) ================= -->
                <g id="obi-group" transform="translate(0, 380)">
                    
                    <!-- 1. Front Wrap (The band around the waist) -->
                    <path d="M -170,-30 L 170,-30 L 170,50 L -170,50 Z" fill="url(#obi-gradient)" />
                    
                    <!-- 2. Back Knot (Taiko Musubi) - Drawn behind front wrap in Z-space visually, but here we layer it -->
                    <!-- Actually, usually the knot is at the back, but visually in a flat 2D representation, 
                         we place the knot shape centrally if viewed from front, or just the front wrap. 
                         Per brief: "Visible knot... to the back/front". Let's assume a front view where we see the 
                         front wrap, and maybe a stylized knot peeking or a front bow.
                         Let's do a "Front View" of a Taiko Knot which is usually back, but for design sake, 
                         let's render a stylized front bow or just the flat wrap.
                         REVISION: Let's render the OBI-AGE (the hanging tails) and the wrap. 
                         To show "Volume", we will draw the knot shape on the body.
                    -->

                    <!-- The Knot (Taiko Style - Stylized Front Representation) -->
                    <g transform="translate(0, 10)">
                        <!-- Main Knot Block -->
                        <path d="M -60,-40 L 60,-40 L 70,40 L -70,40 Z" fill="url(#obi-gradient)" />
                        
                        <!-- Gold Accent (Noshi) -->
                        <rect x="-50" y="-10" width="100" height="20" fill="var(--o-gold)" opacity="0.9" />
                        <path d="M -50,-10 L 50,10 M 50,-10 L -50,10" stroke="var(--o-shadow)" stroke-width="1" opacity="0.5" />
                        
                        <!-- Shadow under knot -->
                        <path d="M -70,40 L 70,40 L 70,50 L -70,50 Z" fill="rgba(0,0,0,0.3)" />
                    </g>

                    <!-- 3. Hanging Tails (Obi-age) -->
                    <!-- Left Tail -->
                    <path d="M -50,60 L -80,350 L -20,340 L 0,60 Z" fill="url(#obi-gradient)" />
                    <!-- Right Tail -->
                    <path d="M 50,60 L 80,350 L 20,340 L 0,60 Z" fill="url(#obi-gradient)" />
                    
                    <!-- Tail Patterns (Gold lines) -->
                    <path d="M -50,60 L -80,350" stroke="var(--o-gold)" stroke-width="1" opacity="0.5" />
                    <path d="M 50,60 L 80,350" stroke="var(--o-gold)" stroke-width="1" opacity="0.5" />
                </g>

            </g>
        </svg>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const stage = document.querySelector('.kimono-stage');
            const root = document.documentElement;
            const swatches = document.querySelectorAll('.swatch');
            const toggleBtn = document.getElementById('toggle-pattern');
            const patternLayer = document.querySelector('.pattern-layer');
            
            let isPatternVisible = true;

            // 1. Subtle Parallax Effect (Mouse Movement)
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth / 2 - e.clientX) / 120;
                const y = (window.innerHeight / 2 - e.clientY) / 120;
                
                // Apply subtle rotation
                stage.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
            });

            // 2. Color Switching Logic
            swatches.forEach(swatch => {
                swatch.addEventListener('click', () => {
                    swatches.forEach(s => s.classList.remove('active'));
                    swatch.classList.add('active');

                    const base = swatch.getAttribute('data-base');
                    const shadow = swatch.getAttribute('data-shadow');
                    const highlight = swatch.getAttribute('data-highlight');

                    // Smooth transition for CSS variables
                    root.style.setProperty('--k-base', base);
                    root.style.setProperty('--k-shadow', shadow);
                    root.style.setProperty('--k-highlight', highlight);
                });
            });

            // 3. Pattern Toggle
            toggleBtn.addEventListener('click', () => {
                isPatternVisible = !isPatternVisible;
                if (isPatternVisible) {
                    patternLayer.classList.remove('pattern-hidden');
                    toggleBtn.textContent = "Hide Pattern";
                } else {
                    patternLayer.classList.add('pattern-hidden');
                    toggleBtn.textContent = "Show Pattern";
                }
            });
        });
    </script>
</body>
</html>
