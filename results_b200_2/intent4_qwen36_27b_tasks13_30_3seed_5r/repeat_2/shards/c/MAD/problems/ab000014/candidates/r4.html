<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMONO | Furisode</title>
    <style>
        :root {
            /* Palette - Cool Mist & Indigo */
            --bg-color: #C4D4DD;
            --bg-gradient: radial-gradient(circle at center, #DCE4EB 0%, #B8C6D1 100%);
            --ink-color: #2C3E50;
            --ui-bg: rgba(255, 255, 255, 0.4);
            --ui-border: rgba(255, 255, 255, 0.6);
            
            /* Kimono Colors (Default: Deep Slate Blue) */
            --k-base: #2B3A55;
            --k-shadow: #1A2536;
            --k-highlight: #455A78;
            --k-collar: #E8E8E8;
            
            /* Obi Colors (Complementary Gold/Rust) */
            --o-base: #A0522D; 
            --o-shadow: #5E2F0D;
            --o-highlight: #CD853F;
            --o-gold: #D4AF37;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            color: var(--ink-color);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* UI Layout - Refined Minimalist Card */
        .ui-layer {
            position: absolute;
            top: 2rem;
            right: 2rem;
            z-index: 20;
            pointer-events: none;
        }

        .ui-card {
            background: var(--ui-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 1.5rem;
            border-radius: 2px;
            border: 1px solid var(--ui-border);
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 220px;
        }

        .brand {
            border-bottom: 1px solid rgba(44, 62, 80, 0.1);
            padding-bottom: 0.8rem;
        }

        .brand h1 {
            font-family: "Didot", "Times New Roman", serif;
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 0.2rem;
            color: var(--ink-color);
        }

        .brand span {
            font-size: 0.6rem;
            font-weight: 600;
            color: #666;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* Controls */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 700;
            color: #555;
        }

        .color-swatches {
            display: flex;
            gap: 12px;
        }

        .swatch {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease;
            position: relative;
        }

        .swatch:hover {
            transform: scale(1.15);
        }

        .swatch.active {
            box-shadow: 0 0 0 2px white, 0 0 0 4px var(--ink-color);
            transform: scale(1.1);
        }

        .btn-toggle {
            background: transparent;
            border: 1px solid rgba(44, 62, 80, 0.3);
            color: #666;
            padding: 0.5rem;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            opacity: 0.7;
        }

        .btn-toggle:hover {
            background: rgba(44, 62, 80, 0.05);
            color: var(--ink-color);
            opacity: 1;
        }

        /* Main Stage */
        main {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1500px;
        }

        .kimono-stage {
            height: 92vh;
            width: auto;
            /* Soft, expansive shadow */
            filter: drop-shadow(0 30px 40px rgba(0,0,0,0.12));
            transition: transform 0.15s linear;
            will-change: transform;
        }

        /* SVG Animations */
        .pattern-layer {
            transition: opacity 0.5s ease;
        }
        
        .pattern-hidden {
            opacity: 0;
        }

        /* Subtle shimmer on silk */
        @keyframes shimmer {
            0% { opacity: 0.05; }
            50% { opacity: 0.15; }
            100% { opacity: 0.05; }
        }
        
        .silk-shine {
            animation: shimmer 5s infinite ease-in-out;
        }

    </style>
</head>
<body>

    <!-- UI Overlay (Top Right) -->
    <div class="ui-layer">
        <div class="ui-card">
            <div class="brand">
                <h1>KIMONO</h1>
                <span>Furisode Collection</span>
            </div>
            
            <div class="control-group">
                <span class="label">Fabric Tone</span>
                <div class="color-swatches">
                    <!-- Deep Slate Blue -->
                    <div class="swatch active" data-base="#2B3A55" data-shadow="#1A2536" data-highlight="#455A78" style="background-color: #2B3A55;"></div>
                    <!-- Midnight Indigo -->
                    <div class="swatch" data-base="#1B263B" data-shadow="#0D131F" data-highlight="#3A506B" style="background-color: #1B263B;"></div>
                    <!-- Forest Moss -->
                    <div class="swatch" data-base="#2F4F4F" data-shadow="#1A2F2F" data-highlight="#406969" style="background-color: #2F4F4F;"></div>
                </div>
            </div>

            <div class="control-group">
                <button id="toggle-pattern" class="btn-toggle">Hide Pattern</button>
            </div>
        </div>
    </div>

    <main>
        <!-- 
            SVG REDESIGN:
            1. Geometry: V-Neckline, T-Sleeves (Furisode), Smooth Bezier Hem.
            2. Pattern: Maple Leaves (Momiji), masked to flow naturally.
            3. Obi: Taiko Knot, Obi-age tails, Obi-dome cover.
        -->
        <svg class="kimono-stage" viewBox="0 0 800 1150" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Gradients -->
                <linearGradient id="fabric-base" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--k-shadow); stop-opacity:1" />
                    <stop offset="15%" style="stop-color:var(--k-base); stop-opacity:1" />
                    <stop offset="85%" style="stop-color:var(--k-base); stop-opacity:1" />
                    <stop offset="100%" style="stop-color:var(--k-shadow); stop-opacity:1" />
                </linearGradient>

                <linearGradient id="obi-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--o-shadow); stop-opacity:1" />
                    <stop offset="20%" style="stop-color:var(--o-highlight); stop-opacity:1" />
                    <stop offset="50%" style="stop-color:var(--o-base); stop-opacity:1" />
                    <stop offset="80%" style="stop-color:var(--o-highlight); stop-opacity:1" />
                    <stop offset="100%" style="stop-color:var(--o-shadow); stop-opacity:1" />
                </linearGradient>

                <!-- Metallic Gold Gradient -->
                <linearGradient id="gold-metallic" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#C5A059; stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#F9E596; stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#C5A059; stop-opacity:1" />
                </linearGradient>

                <linearGradient id="silk-shine-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:white; stop-opacity:0" />
                    <stop offset="50%" style="stop-color:white; stop-opacity:0.15" />
                    <stop offset="100%" style="stop-color:white; stop-opacity:0" />
                </linearGradient>

                <!-- Nature Motif: Maple Leaf -->
                <g id="maple-leaf">
                    <!-- Complex leaf shape -->
                    <path d="M0,0 L5,-12 L16,-5 L10,5 L22,12 L10,18 L16,30 L4,24 L0,36 L-4,24 L-16,30 L-10,18 L-22,12 L-10,5 L-16,-5 L-5,-12 Z" 
                          fill="url(#gold-metallic)" opacity="0.7" />
                    <path d="M0,0 L0,36" stroke="var(--k-shadow)" stroke-width="1" opacity="0.4" fill="none"/>
                </g>

                <!-- Nature Motif: Bamboo -->
                <g id="bamboo-stalk">
                    <rect x="-3" y="0" width="6" height="120" rx="2" fill="url(#gold-metallic)" opacity="0.4" />
                    <!-- Bamboo segments -->
                    <path d="M-3,20 Q0,23 3,20" stroke="var(--k-shadow)" stroke-width="1" fill="none" opacity="0.6"/>
                    <path d="M-3,50 Q0,53 3,50" stroke="var(--k-shadow)" stroke-width="1" fill="none" opacity="0.6"/>
                    <path d="M-3,80 Q0,83 3,80" stroke="var(--k-shadow)" stroke-width="1" fill="none" opacity="0.6"/>
                </g>

                <!-- Pattern Cluster -->
                <g id="leaf-cluster">
                    <use href="#maple-leaf" transform="translate(0,0) rotate(15) scale(1.2)" />
                    <use href="#maple-leaf" transform="translate(45, 65) rotate(-40) scale(0.8)" />
                    <use href="#maple-leaf" transform="translate(-35, 85) rotate(45) scale(0.9)" />
                    <use href="#bamboo-stalk" transform="translate(20, -60) rotate(5)" />
                </g>

                <!-- Pattern Definition -->
                <pattern id="pattern-botanical" x="0" y="0" width="220" height="220" patternUnits="userSpaceOnUse">
                    <use href="#leaf-cluster" x="10" y="10" />
                    <use href="#leaf-cluster" x="130" y="160" />
                </pattern>

                <!-- Clip Path for Pattern (Ensures no "sticker" effect) -->
                <clipPath id="garment-clip">
                    <path d="M -110,-150 C -110,-200 -140,-200 -140,-150 L -140,850 C -140,900 -160,920 -180,920 L -180,950 L 180,950 L 180,920 C 160,920 140,900 140,850 L 140,-150 C 140,-200 110,-200 110,-150 Z" />
                    <!-- Sleeves -->
                    <path d="M -130,-120 L -350,-120 L -350,450 C -350,480 -320,480 -320,450 L -130,450 Z" />
                    <path d="M 130,-120 L 350,-120 L 350,450 C 350,480 320,480 320,450 L 130,450 Z" />
                </clipPath>
            </defs>

            <!-- Center Group -->
            <g transform="translate(400, 120)">
                
                <!-- ================= SLEEVES (Furisode T-Shape) ================= -->
                <!-- Drawn first to sit behind body -->
                
                <!-- Left Sleeve -->
                <g id="sleeve-left">
                    <!-- Main T-bar shape with rounded bottom -->
                    <path d="M -130,-120 L -350,-120 L -350,450 C -350,480 -320,480 -320,450 L -130,450 Z" fill="url(#fabric-base)" />
                    <!-- Inner shadow/fold at shoulder connection -->
                    <path d="M -130,-120 L -130,450 L -160,450 L -160,-120 Z" fill="var(--k-shadow)" opacity="0.4" />
                </g>

                <!-- Right Sleeve -->
                <g id="sleeve-right">
                    <!-- Main T-bar shape with rounded bottom -->
                    <path d="M 130,-120 L 350,-120 L 350,450 C 350,480 320,480 320,450 L 130,450 Z" fill="url(#fabric-base)" />
                    <!-- Inner shadow/fold at shoulder connection -->
                    <path d="M 130,-120 L 130,450 L 160,450 L 160,-120 Z" fill="var(--k-shadow)" opacity="0.4" />
                </g>

                <!-- ================= MAIN BODY ================= -->
                <!-- Smooth Bezier curves for drape -->
                <path id="body-back" 
                      d="M -110,-150 C -110,-200 -140,-200 -140,-150 L -140,850 C -140,900 -160,920 -180,920 L -180,950 L 180,950 L 180,920 C 160,920 140,900 140,850 L 140,-150 C 140,-200 110,-200 110,-150 Z" 
                      fill="url(#fabric-base)" />

                <!-- ================= TEXTURE & PATTERNS ================= -->
                <!-- Clipped to garment shape -->
                <g class="pattern-layer" clip-path="url(#garment-clip)">
                    <!-- Pattern fill -->
                    <rect x="-400" y="-200" width="800" height="1200" fill="url(#pattern-botanical)" />
                </g>

                <!-- ================= SILK SHINE & FOLDS ================= -->
                <!-- Vertical drape lines -->
                <path d="M -100,-150 L -120,950" stroke="var(--k-shadow)" stroke-width="3" opacity="0.15" fill="none"/>
                <path d="M 100,-150 L 120,950" stroke="var(--k-shadow)" stroke-width="3" opacity="0.15" fill="none"/>
                
                <!-- Subtle diagonal silk sheen -->
                <path class="silk-shine" d="M -150,200 L 150,800 L 250,800 L -50,200 Z" fill="url(#silk-shine-grad)" />

                <!-- ================= COLLAR (ERI) ================= -->
                <!-- V-Neckline construction -->
                <g id="collar-group">
                    <!-- Right Collar (Outer layer, darker) -->
                    <!-- Starts at right shoulder, goes to V point, curves back -->
                    <path d="M 110,-150 Q 0,-110 -100,-150 L -100,-130 Q 0,-90 110,-130 Z" fill="var(--k-shadow)" />
                    
                    <!-- Left Collar (Inner layer, lighter/silk) -->
                    <!-- Starts at left shoulder, goes to V point, curves back -->
                    <path d="M -110,-150 Q 0,-110 100,-150 L 100,-130 Q 0,-90 -100,-130 Z" fill="var(--k-collar)" />
                    
                    <!-- Collar Edge Detail (Gold trim hint) -->
                    <path d="M -110,-140 Q 0,-100 110,-140" stroke="var(--o-gold)" stroke-width="1" fill="none" opacity="0.3"/>
                </g>

                <!-- ================= OBI (SASH) ================= -->
                <!-- Positioned at waist -->
                <g id="obi-group" transform="translate(0, 400)">
                    
                    <!-- 1. Front Wrap (The band around the waist) -->
                    <path d="M -165,-35 L 165,-35 L 165,55 L -165,55 Z" fill="url(#obi-gradient)" />
                    
                    <!-- 2. Back Knot (Taiko Musubi) - Stylized Front View -->
                    <!-- We represent the knot as if we are looking at the back of the wearer, 
                         or simply overlaying the knot shape for decorative effect. 
                         Given the V-neck front, we will place the Knot structure centrally. -->
                    <g transform="translate(0, 10)">
                        <!-- Main Knot Block (Taiko shape) -->
                        <path d="M -70,-45 L 70,-45 L 80,45 L -80,45 Z" fill="url(#obi-gradient)" />
                        
                        <!-- Obi-Dome (The cover over the knot) -->
                        <path d="M -60,-35 L 60,-35 L 65,35 L -65,35 Z" fill="var(--o-base)" />
                        
                        <!-- Gold Accent (Noshi) on Obi-Dome -->
                        <rect x="-55" y="-15" width="110" height="30" fill="url(#gold-metallic)" opacity="0.9" />
                        <path d="M -55,-15 L 55,15 M 55,-15 L -55,15" stroke="var(--o-shadow)" stroke-width="1" opacity="0.6" />
                        
                        <!-- Shadow under knot -->
                        <path d="M -80,45 L 80,45 L 80,55 L -80,55 Z" fill="rgba(0,0,0,0.3)" />
                    </g>

                    <!-- 3. Hanging Tails (Obi-age) -->
                    <!-- Left Tail -->
                    <path d="M -55,55 L -85,350 L -25,340 L 0,55 Z" fill="url(#obi-gradient)" />
                    <!-- Right Tail -->
                    <path d="M 55,55 L 85,350 L 25,340 L 0,55 Z" fill="url(#obi-gradient)" />
                    
                    <!-- Tail Patterns (Gold lines) -->
                    <path d="M -55,55 L -85,350" stroke="url(#gold-metallic)" stroke-width="2" opacity="0.6" />
                    <path d="M 55,55 L 85,350" stroke="url(#gold-metallic)" stroke-width="2" opacity="0.6" />
                </g>

            </g>
        </svg>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const stage = document.querySelector('.kimono-stage');
            const root = document.documentElement;
            const swatches = document.querySelectorAll('.swatch');
            const toggleBtn = document.getElementById('toggle-pattern');
            const patternLayer = document.querySelector('.pattern-layer');
            
            let isPatternVisible = true;

            // 1. Subtle Parallax Effect (Mouse Movement)
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth / 2 - e.clientX) / 150;
                const y = (window.innerHeight / 2 - e.clientY) / 150;
                
                // Apply subtle rotation (less aggressive for elegance)
                stage.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
            });

            // 2. Color Switching Logic
            swatches.forEach(swatch => {
                swatch.addEventListener('click', () => {
                    swatches.forEach(s => s.classList.remove('active'));
                    swatch.classList.add('active');

                    const base = swatch.getAttribute('data-base');
                    const shadow = swatch.getAttribute('data-shadow');
                    const highlight = swatch.getAttribute('data-highlight');

                    // Smooth transition for CSS variables
                    root.style.setProperty('--k-base', base);
                    root.style.setProperty('--k-shadow', shadow);
                    root.style.setProperty('--k-highlight', highlight);
                });
            });

            // 3. Pattern Toggle
            toggleBtn.addEventListener('click', () => {
                isPatternVisible = !isPatternVisible;
                if (isPatternVisible) {
                    patternLayer.classList.remove('pattern-hidden');
                    toggleBtn.textContent = "Hide Pattern";
                } else {
                    patternLayer.classList.add('pattern-hidden');
                    toggleBtn.textContent = "Show Pattern";
                }
            });
        });
    </script>
</body>
</html>
