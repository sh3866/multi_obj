<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SILHOUETTE RUNNER REVISED</title>
<style>
    :root {
        /* Palette: Modern Retro Desert */
        --bg-sky: #201a28;
        --bg-horizon: #3b2d46;
        --ground-base: #e0e0e0;
        --ground-accent: #b0b0b0;
        
        --entity-color: #1a1a1a;
        --ui-color: #1a1a1a;
        
        /* Typography: System Monospace for strict retro feel */
        --font-retro: 'Courier New', Courier, monospace;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
    }

    body {
        background-color: var(--bg-sky);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        font-family: var(--font-retro);
        color: var(--ui-color);
        /* Disable smooth rendering for text to keep it sharp */
        text-rendering: optimizeSpeed;
    }

    /* --- WORLD & ATMOSPHERE --- */
    .world {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 0;
        overflow: hidden;
        /* Retro Gradient */
        background: linear-gradient(180deg, var(--bg-sky) 0%, var(--bg-horizon) 60%, var(--bg-horizon) 100%);
    }

    /* Geometric Sun */
    .sun {
        position: absolute;
        bottom: 32%; /* Just above horizon */
        right: 15%;
        width: 100px;
        height: 100px;
        background-color: #ff6b6b;
        /* Hard edges, no blur */
        border: 4px solid var(--bg-horizon); 
        box-shadow: 0 0 0 4px var(--bg-sky); /* Fake anti-aliasing ring */
        z-index: 1;
    }

    /* Mountain Silhouette */
    .mountains {
        position: absolute;
        bottom: 25%;
        left: 0;
        width: 200%;
        height: 150px;
        background-image: linear-gradient(135deg, transparent 50%, var(--bg-sky) 50%),
                          linear-gradient(225deg, transparent 50%, var(--bg-sky) 50%);
        background-size: 100px 100px;
        opacity: 0.3;
        z-index: 1;
        animation: scrollMountains 40s linear infinite;
    }

    @keyframes scrollMountains {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
    }

    /* --- TERRAIN --- */
    .terrain-layer {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 25%;
        z-index: 2;
        background-color: var(--ground-base);
        /* Strong Horizon Line */
        border-top: 4px solid var(--entity-color);
    }

    /* Rhythmic Ground Texture (Dashed Line) */
    .ground-details {
        position: absolute;
        top: 20px;
        left: 0;
        width: 200%;
        height: 4px;
        background-image: linear-gradient(90deg, var(--ground-accent) 50%, transparent 50%);
        background-size: 60px 100%;
        opacity: 0.6;
        animation: scrollGround 1s linear infinite;
    }

    .ground-noise {
        position: absolute;
        top: 0; left: 0; width: 200%; height: 100%;
        background-image: radial-gradient(circle, var(--entity-color) 1px, transparent 1px);
        background-size: 40px 40px;
        opacity: 0.1;
        animation: scrollGround 0.5s linear infinite;
    }

    @keyframes scrollGround {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
    }

    /* --- GAMEPLAY AREA --- */
    .game-area {
        position: absolute;
        bottom: 25%; /* Aligns with terrain top */
        left: 0;
        width: 100%;
        height: 400px;
        z-index: 10;
        overflow: hidden;
    }

    /* Player Character */
    .dino-container {
        position: absolute;
        bottom: 0;
        left: 100px;
        width: 44px; /* Pixel scale */
        height: 44px;
        z-index: 20;
        will-change: transform;
        image-rendering: pixelated; /* Critical for retro look */
    }

    .dino-svg {
        width: 100%;
        height: 100%;
        fill: var(--entity-color);
        /* Solid Stroke, no white outline */
        stroke: var(--entity-color);
        stroke-width: 0;
    }

    /* Obstacles */
    .obstacle {
        position: absolute;
        will-change: transform;
        z-index: 15;
        image-rendering: pixelated;
    }

    .cactus {
        width: 24px;
        height: 48px;
        bottom: 0;
    }
    .cactus svg {
        width: 100%; height: 100%;
        fill: var(--entity-color);
    }

    .bird {
        width: 32px;
        height: 24px;
        bottom: 60px; /* Mid-air */
    }
    .bird svg {
        width: 100%; height: 100%;
        fill: var(--entity-color);
        animation: flap 0.2s infinite alternate;
    }

    /* --- UI / HUD --- */
    .ui-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 100;
        pointer-events: none;
    }

    /* Top Right: Hierarchical Retro HUD */
    .hud-top-right {
        position: absolute;
        top: 30px;
        right: 40px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        font-family: var(--font-retro);
        text-transform: uppercase;
    }

    .hud-row {
        display: flex;
        align-items: baseline;
        gap: 10px;
    }

    .label {
        font-size: 1rem;
        font-weight: bold;
        letter-spacing: -1px;
        opacity: 0.8;
    }

    /* Score: Largest */
    .value.score {
        font-size: 2.2rem;
        font-weight: 900;
        line-height: 1;
    }

    /* HI: Medium */
    .value.hi {
        font-size: 1.2rem;
        font-weight: bold;
    }

    /* SPD: Smallest */
    .value.spd {
        font-size: 0.9rem;
        letter-spacing: 2px;
    }

    /* Bottom Left: Subtle Instruction */
    .hud-bottom-left {
        position: absolute;
        bottom: 40px;
        left: 50px;
        opacity: 0.6;
        transition: opacity 0.3s;
    }
    
    .instruction-text {
        font-size: 0.8rem;
        letter-spacing: 2px;
        font-weight: bold;
        border: 2px solid var(--ui-color);
        padding: 4px 8px;
        display: inline-block;
    }

    /* --- ANIMATIONS --- */
    @keyframes flap {
        from { transform: scaleY(1); }
        to { transform: scaleY(-0.5); }
    }

    .dino-jumping {
        animation: jumpArc 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes jumpArc {
        0% { transform: translateY(0) rotate(0deg); }
        20% { transform: translateY(-10px) rotate(-5deg); }
        50% { transform: translateY(-150px) rotate(-15deg); }
        80% { transform: translateY(-10px) rotate(5deg); }
        100% { transform: translateY(0) rotate(0deg); }
    }

    .dino-running .dino-svg {
        animation: bob 0.15s infinite alternate ease-in-out;
    }
    @keyframes bob {
        from { transform: translateY(0); }
        to { transform: translateY(-3px); }
    }

    /* Game Over Overlay */
    .overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(32, 26, 40, 0.8);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 200;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
    }
    .overlay.active {
        opacity: 1;
        pointer-events: auto;
    }
    
    .overlay-title {
        font-size: 3rem;
        font-weight: 900;
        color: #fff;
        letter-spacing: -2px;
        margin-bottom: 15px;
    }
    .overlay-sub {
        font-size: 1rem;
        letter-spacing: 2px;
        color: #fff;
        animation: blink 1.5s infinite;
    }
    @keyframes blink { 50% { opacity: 0.4; } }

</style>
</head>
<body>

    <!-- ENVIRONMENT -->
    <div class="world">
        <!-- Sun -->
        <div class="sun"></div>
        
        <!-- Mountains -->
        <div class="mountains"></div>
        
        <!-- Ground -->
        <div class="terrain-layer">
            <div class="ground-details"></div>
            <div class="ground-noise"></div>
        </div>
    </div>

    <!-- GAMEPLAY LAYER -->
    <div class="game-area" id="gameArea">
        <!-- Player -->
        <div class="dino-container dino-running" id="dino">
            <!-- Pixel Art SVG (Solid fill, no stroke) -->
            <svg class="dino-svg" viewBox="0 0 11 13" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
                <path d="M9 0 h2 v2 h2 v2 h-2 v2 h-2 v2 h-2 v2 h-2 v2 h-2 v2 h-2 v-2 h-2 v-2 h-2 v-4 h2 v-2 h2 v-2 h2 v-2 h2 z"/>
            </svg>
        </div>
        <div id="obstacleLayer"></div>
    </div>

    <!-- UI LAYER -->
    <div class="ui-layer">
        <!-- Top Right: Unified Status (Reordered: Score > HI > SPD) -->
        <div class="hud-top-right">
            <!-- 1. SCORE (Top, Largest) -->
            <div class="hud-row">
                <span class="value score" id="scoreVal">0000</span>
            </div>
            <!-- 2. HI (Middle) -->
            <div class="hud-row">
                <span class="label">HI</span>
                <span class="value hi" id="highScoreVal">0420</span>
            </div>
            <!-- 3. SPD (Bottom, Smallest) -->
            <div class="hud-row">
                <span class="label">SPD</span>
                <span class="value spd" id="speedVal">06</span>
            </div>
        </div>

        <!-- Bottom Left: Demoted Instruction -->
        <div class="hud-bottom-left">
            <div class="instruction-text">SPACE</div>
        </div>
    </div>

    <!-- GAME OVER OVERLAY -->
    <div class="overlay" id="overlay">
        <div class="overlay-title">CRASHED</div>
        <div class="overlay-sub">PRESS SPACE TO RETRY</div>
    </div>

<script>
    // --- CONFIG ---
    const GRAVITY = 0.6;
    const JUMP_STRENGTH = 13;
    const BASE_SPEED = 6;
    
    // --- STATE ---
    let isPlaying = true;
    let isGameOver = false;
    let score = 0;
    let highScore = 420;
    let gameSpeed = BASE_SPEED;
    let lastTime = 0;
    let spawnTimer = 0;
    let obstacles = [];
    let dinoY = 0;
    let dinoVelocity = 0;
    let isJumping = false;
    let animationId;

    // --- DOM ---
    const dino = document.getElementById('dino');
    const obstacleLayer = document.getElementById('obstacleLayer');
    const scoreEl = document.getElementById('scoreVal');
    const highScoreEl = document.getElementById('highScoreVal');
    const speedEl = document.getElementById('speedVal');
    const overlay = document.getElementById('overlay');

    // --- ASSETS (Inline SVGs for crisp rendering) ---
    // 8-bit style Cactus
    const CACTUS_SVG = `
        <svg viewBox="0 0 12 24" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
            <path d="M4 24 v-8 h-2 v-4 h2 v-8 h4 v8 h2 v4 h-2 v8 h-4 z"/>
        </svg>`;
    
    // 8-bit style Pterodactyl
    const BIRD_SVG = `
        <svg viewBox="0 0 16 12" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
            <path d="M0 6 h4 v-2 h4 v2 h4 v-2 h4 v2 h-4 v2 h-4 v-2 h-4 v2 h-4 v-2 z"/>
        </svg>`;

    // --- GAME LOOP ---
    function loop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = timestamp - lastTime;
        lastTime = timestamp;

        if (isPlaying && !isGameOver) {
            updatePhysics();
            updateObstacles();
            checkCollisions();
            updateScore();
        }
        
        animationId = requestAnimationFrame(loop);
    }

    // --- PHYSICS ---
    function updatePhysics() {
        dinoY += dinoVelocity;
        dinoVelocity -= GRAVITY;

        if (dinoY < 0) {
            dinoY = 0;
            dinoVelocity = 0;
            if (isJumping) {
                isJumping = false;
                dino.classList.remove('dino-jumping');
                dino.classList.add('dino-running');
            }
        }

        dino.style.transform = `translateY(${-dinoY}px)`;
    }

    function jump() {
        if (dinoY <= 0 && !isJumping) {
            dinoVelocity = JUMP_STRENGTH;
            isJumping = true;
            dino.classList.remove('dino-running');
            dino.classList.add('dino-jumping');
        }
    }

    // --- OBSTACLES ---
    function spawnObstacle() {
        // Determine type
        const type = Math.random() > 0.6 ? 'bird' : 'cactus';
        const el = document.createElement('div');
        el.className = `obstacle ${type}`;
        el.innerHTML = type === 'cactus' ? CACTUS_SVG : BIRD_SVG;
        
        const startX = window.innerWidth;
        el.style.left = `${startX}px`;
        
        obstacleLayer.appendChild(el);

        obstacles.push({
            el: el,
            x: startX,
            type: type,
            width: type === 'cactus' ? 24 : 32,
            height: type === 'cactus' ? 48 : 24,
            passed: false
        });
    }

    function updateObstacles() {
        spawnTimer += 16; 
        
        // Spawn Logic
        if (spawnTimer > (12000 / gameSpeed)) { 
            spawnTimer = 0;
            if (Math.random() > 0.3) spawnObstacle();
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.x -= gameSpeed;
            obs.el.style.left = `${obs.x}px`;

            if (obs.x < -50) {
                obs.el.remove();
                obstacles.splice(i, 1);
            }
        }
    }

    // --- COLLISION ---
    function checkCollisions() {
        // Tight Hitbox
        const dinoRect = {
            l: 100 + 10, 
            r: 100 + 34, 
            t: dinoY,    
            b: dinoY + 34 
        };

        for (let obs of obstacles) {
            let obsRect;
            if (obs.type === 'bird') {
                // Bird floats higher
                obsRect = {
                    l: obs.x + 4,
                    r: obs.x + obs.width - 4,
                    t: 60, 
                    b: 60 + obs.height
                };
            } else {
                // Cactus on ground
                obsRect = {
                    l: obs.x + 4,
                    r: obs.x + obs.width - 4,
                    t: 0,
                    b: obs.height
                };
            }

            if (
                dinoRect.l < obsRect.r &&
                dinoRect.r > obsRect.l &&
                dinoRect.t < obsRect.b &&
                dinoRect.b > obsRect.t
            ) {
                triggerGameOver();
            }
        }
    }

    // --- SCORE & SPEED ---
    function updateScore() {
        score += 0.1;
        const displayScore = Math.floor(score).toString().padStart(4, '0');
        scoreEl.innerText = displayScore;

        if (Math.floor(score) % 100 === 0 && Math.floor(score) > 0) {
            gameSpeed += 0.2;
            speedEl.innerText = Math.floor(gameSpeed).toString().padStart(2, '0');
        }
    }

    // --- GAME CONTROL ---
    function startGame() {
        isPlaying = true;
        isGameOver = false;
        score = 0;
        gameSpeed = BASE_SPEED;
        dinoY = 0;
        dinoVelocity = 0;
        
        obstacles.forEach(o => o.el.remove());
        obstacles = [];
        
        overlay.classList.remove('active');
        dino.classList.remove('dino-jumping');
        dino.classList.add('dino-running');
        
        // Pre-instantiate one obstacle to fulfill visual requirement immediately
        setTimeout(() => spawnObstacle(), 1000);
    }

    function triggerGameOver() {
        isGameOver = true;
        isPlaying = false;
        dino.classList.remove('dino-running');
        dino.classList.remove('dino-jumping');
        
        if (score > highScore) {
            highScore = Math.floor(score);
            highScoreEl.innerText = highScore.toString().padStart(4, '0');
        }

        overlay.classList.add('active');
    }

    // --- INPUT ---
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            if (isGameOver) {
                startGame();
            } else {
                jump();
            }
        }
    });

    // --- INITIAL SETUP ---
    // Fulfilling Critique #1: Instantiate Gameplay Entities
    // We manually create the requested obstacles for the opening frame
    const initCactus = document.createElement('div');
    initCactus.className = 'obstacle cactus';
    initCactus.innerHTML = CACTUS_SVG;
    initCactus.style.left = '600px';
    obstacleLayer.appendChild(initCactus);
    obstacles.push({ el: initCactus, x: 600, type: 'cactus', width: 24, height: 48 });

    const initBird = document.createElement('div');
    initBird.className = 'obstacle bird';
    initBird.innerHTML = BIRD_SVG;
    initBird.style.left = '800px';
    obstacleLayer.appendChild(initBird);
    obstacles.push({ el: initBird, x: 800, type: 'bird', width: 32, height: 24 });

    requestAnimationFrame(loop);

</script>
</body>
</html>
