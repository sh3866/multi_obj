<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIGHT RUNNER: PIXEL EDITION</title>
<style>
    :root {
        /* Palette: Night Run (Critique #2) */
        --bg-sky-top: #0f0c29;
        --bg-sky-bot: #302b63;
        --ground-color: #1a1525; /* Dark anchor color */
        --ground-line: #4a4458;
        
        --entity-color: #f0f0f0; /* High Contrast White */
        --entity-shadow: #000000;
        
        --accent-color: #ff0055; /* For UI highlights */
        
        /* Typography: System Monospace for strict retro feel */
        --font-retro: 'Courier New', Courier, monospace;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
    }

    body {
        background-color: var(--bg-sky-top);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        font-family: var(--font-retro);
        color: var(--entity-color);
        /* Disable smooth rendering for text to keep it sharp */
        text-rendering: optimizeSpeed;
        -webkit-font-smoothing: none;
    }

    /* --- WORLD & ATMOSPHERE (Critique #1 & #5) --- */
    .world {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 0;
        overflow: hidden;
        background: linear-gradient(180deg, var(--bg-sky-top) 0%, var(--bg-sky-bot) 100%);
    }

    /* Stars (Static Retro Noise) */
    .stars {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 60%;
        background-image: 
            radial-gradient(circle, #fff 1px, transparent 1px),
            radial-gradient(circle, #fff 1px, transparent 1px);
        background-size: 100px 100px, 200px 200px;
        background-position: 0 0, 40px 60px;
        opacity: 0.3;
    }

    /* Pixelated Mountains (Critique #1 - Rasterized) */
    .mountains {
        position: absolute;
        bottom: 24%; /* Just above ground */
        left: 0;
        width: 300%; /* Wider for parallax */
        height: 180px;
        /* SVG Data URI for Pixel Art Mountain Silhouette */
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" preserveAspectRatio="none"><path fill="%231f1b36" d="M0,150 L0,100 L50,60 L100,100 L150,150 L200,150 L250,40 L300,150 L400,150 L450,80 L500,150 L600,150 L650,20 L700,150 L800,150 L850,70 L900,150 L1000,150 Z"/></svg>');
        background-repeat: repeat-x;
        background-size: 1000px 180px; /* Scaled to fit */
        background-position: 0 bottom;
        z-index: 1;
        opacity: 0.8;
        animation: scrollMountains 60s linear infinite;
        image-rendering: pixelated;
    }

    @keyframes scrollMountains {
        from { transform: translateX(0); }
        to { transform: translateX(-33.33%); }
    }

    /* --- TERRAIN (Critique #4) --- */
    .terrain-layer {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 24%;
        z-index: 2;
        background-color: var(--ground-color);
        /* Distinct Horizon Line */
        border-top: 4px solid var(--ground-line);
    }

    /* Rhythmic Ground Texture (Moving Dots) */
    .ground-texture {
        position: absolute;
        top: 15px;
        left: 0;
        width: 200%;
        height: 4px;
        background-image: linear-gradient(90deg, var(--ground-line) 50%, transparent 50%);
        background-size: 40px 100%;
        opacity: 0.5;
        animation: scrollGround 0.8s linear infinite;
    }

    .ground-noise {
        position: absolute;
        top: 0; left: 0; width: 200%; height: 100%;
        background-image: radial-gradient(circle, var(--ground-line) 1px, transparent 1px);
        background-size: 50px 50px;
        opacity: 0.15;
        animation: scrollGround 0.4s linear infinite;
    }

    @keyframes scrollGround {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
    }

    /* --- GAMEPLAY AREA --- */
    .game-area {
        position: absolute;
        bottom: 24%; /* Aligns with terrain top */
        left: 0;
        width: 100%;
        height: 450px;
        z-index: 10;
        overflow: hidden;
    }

    /* Player Character (Critique #3 - Larger, Crisp) */
    .dino-container {
        position: absolute;
        bottom: 0;
        left: 80px;
        width: 64px; /* Upscaled */
        height: 64px;
        z-index: 20;
        will-change: transform;
        image-rendering: pixelated; 
        filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.3)); /* Retro depth */
    }

    .dino-svg {
        width: 100%;
        height: 100%;
        fill: var(--entity-color);
        stroke: var(--entity-color);
    }

    /* Obstacles */
    .obstacle {
        position: absolute;
        will-change: transform;
        z-index: 15;
        image-rendering: pixelated;
        filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.3));
    }

    .cactus {
        width: 32px;
        height: 56px;
        bottom: 0;
    }
    .cactus svg {
        width: 100%; height: 100%;
        fill: var(--entity-color);
    }

    .bird {
        width: 48px;
        height: 32px;
        bottom: 60px; /* Mid-air */
    }
    .bird svg {
        width: 100%; height: 100%;
        fill: var(--entity-color);
        animation: flap 0.2s infinite alternate;
    }

    /* --- UI / HUD (Critique #4) --- */
    .ui-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 100;
        pointer-events: none;
    }

    .hud-top-right {
        position: absolute;
        top: 40px;
        right: 40px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        font-family: var(--font-retro);
        text-transform: uppercase;
    }

    .hud-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
    }

    .label {
        font-size: 0.8rem;
        font-weight: bold;
        letter-spacing: -1px;
        opacity: 0.6;
        color: var(--entity-color);
    }

    .value.score {
        font-size: 2.5rem;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -2px;
        text-shadow: 2px 2px 0px var(--bg-sky-top);
    }

    .value.hi {
        font-size: 1.2rem;
        font-weight: bold;
        opacity: 0.8;
    }

    .value.spd {
        font-size: 0.9rem;
        letter-spacing: 2px;
        opacity: 0.5;
        margin-top: 4px;
    }

    /* Integrated Instruction (Critique #4) */
    .hud-instruction {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        opacity: 0.8;
        transition: opacity 0.5s;
        pointer-events: none;
    }
    
    .instruction-box {
        border: 2px solid var(--entity-color);
        padding: 10px 20px;
        background: rgba(15, 12, 41, 0.8);
        backdrop-filter: blur(2px);
        animation: pulse 2s infinite;
    }

    .instruction-text {
        font-size: 1rem;
        letter-spacing: 4px;
        font-weight: bold;
        color: var(--entity-color);
        display: block;
    }
    
    .instruction-sub {
        font-size: 0.7rem;
        opacity: 0.6;
        margin-top: 5px;
        display: block;
    }

    /* --- ANIMATIONS --- */
    @keyframes flap {
        from { transform: scaleY(1); }
        to { transform: scaleY(-0.6); }
    }

    @keyframes pulse {
        0% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.98); }
        100% { opacity: 0.8; transform: scale(1); }
    }

    .dino-jumping {
        animation: jumpArc 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes jumpArc {
        0% { transform: translateY(0) rotate(0deg); }
        20% { transform: translateY(-10px) rotate(-5deg); }
        50% { transform: translateY(-160px) rotate(-15deg); }
        80% { transform: translateY(-10px) rotate(5deg); }
        100% { transform: translateY(0) rotate(0deg); }
    }

    .dino-running .dino-svg {
        animation: bob 0.15s infinite alternate ease-in-out;
    }
    @keyframes bob {
        from { transform: translateY(0); }
        to { transform: translateY(-4px); }
    }

    /* Game Over Overlay */
    .overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(15, 12, 41, 0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 200;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        backdrop-filter: blur(4px);
    }
    .overlay.active {
        opacity: 1;
        pointer-events: auto;
    }
    
    .overlay-title {
        font-size: 4rem;
        font-weight: 900;
        color: var(--entity-color);
        letter-spacing: -3px;
        margin-bottom: 15px;
        text-shadow: 4px 4px 0px var(--accent-color);
    }
    .overlay-sub {
        font-size: 1.2rem;
        letter-spacing: 4px;
        color: var(--entity-color);
        animation: blink 1.5s infinite;
    }
    @keyframes blink { 50% { opacity: 0.4; } }

</style>
</head>
<body>

    <!-- ENVIRONMENT -->
    <div class="world">
        <div class="stars"></div>
        
        <!-- Parallax Mountains -->
        <div class="mountains"></div>
        
        <!-- Ground -->
        <div class="terrain-layer">
            <div class="ground-texture"></div>
            <div class="ground-noise"></div>
        </div>
    </div>

    <!-- GAMEPLAY LAYER -->
    <div class="game-area" id="gameArea">
        <!-- Player -->
        <div class="dino-container dino-running" id="dino">
            <!-- Larger, detailed SVG Sprite -->
            <svg class="dino-svg" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
                <path d="M13 2 h2 v2 h2 v2 h-2 v2 h-2 v2 h-2 v2 h-2 v2 h-2 v2 h-2 v-2 h-2 v-2 h-2 v-4 h2 v-2 h2 v-2 h2 v-2 h2 v-2 h2 z"/>
            </svg>
        </div>
        <div id="obstacleLayer"></div>
    </div>

    <!-- UI LAYER -->
    <div class="ui-layer">
        <!-- Top Right HUD -->
        <div class="hud-top-right">
            <div class="hud-row">
                <span class="value score" id="scoreVal">0000</span>
            </div>
            <div class="hud-row">
                <span class="label">HI</span>
                <span class="value hi" id="highScoreVal">0420</span>
            </div>
            <div class="hud-row">
                <span class="label">SPD</span>
                <span class="value spd" id="speedVal">06</span>
            </div>
        </div>

        <!-- Center Instruction -->
        <div class="hud-instruction" id="instructionBox">
            <div class="instruction-box">
                <span class="instruction-text">PRESS SPACE</span>
                <span class="instruction-sub">TO JUMP</span>
            </div>
        </div>
    </div>

    <!-- GAME OVER OVERLAY -->
    <div class="overlay" id="overlay">
        <div class="overlay-title">CRASHED</div>
        <div class="overlay-sub">PRESS SPACE TO RETRY</div>
    </div>

<script>
    // --- CONFIG ---
    const GRAVITY = 0.6;
    const JUMP_STRENGTH = 14;
    const BASE_SPEED = 7;
    
    // --- STATE ---
    let isPlaying = true;
    let isGameOver = false;
    let score = 0;
    let highScore = 420;
    let gameSpeed = BASE_SPEED;
    let lastTime = 0;
    let spawnTimer = 0;
    let obstacles = [];
    let dinoY = 0;
    let dinoVelocity = 0;
    let isJumping = false;
    let animationId;
    let gameStarted = false;

    // --- DOM ---
    const dino = document.getElementById('dino');
    const obstacleLayer = document.getElementById('obstacleLayer');
    const scoreEl = document.getElementById('scoreVal');
    const highScoreEl = document.getElementById('highScoreVal');
    const speedEl = document.getElementById('speedVal');
    const overlay = document.getElementById('overlay');
    const instructionBox = document.getElementById('instructionBox');

    // --- ASSETS (Inline SVGs for crisp rendering) ---
    // 8-bit style Cactus
    const CACTUS_SVG = `
        <svg viewBox="0 0 12 24" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
            <path d="M4 24 v-8 h-2 v-4 h2 v-8 h4 v8 h2 v4 h-2 v8 h-4 z"/>
        </svg>`;
    
    // 8-bit style Pterodactyl
    const BIRD_SVG = `
        <svg viewBox="0 0 16 12" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
            <path d="M0 6 h4 v-2 h4 v2 h4 v-2 h4 v2 h-4 v2 h-4 v-2 h-4 v2 h-4 v-2 z"/>
        </svg>`;

    // --- GAME LOOP ---
    function loop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = timestamp - lastTime;
        lastTime = timestamp;

        if (isPlaying && !isGameOver) {
            updatePhysics();
            updateObstacles();
            checkCollisions();
            updateScore();
        }
        
        animationId = requestAnimationFrame(loop);
    }

    // --- PHYSICS ---
    function updatePhysics() {
        dinoY += dinoVelocity;
        dinoVelocity -= GRAVITY;

        if (dinoY < 0) {
            dinoY = 0;
            dinoVelocity = 0;
            if (isJumping) {
                isJumping = false;
                dino.classList.remove('dino-jumping');
                dino.classList.add('dino-running');
            }
        }

        dino.style.transform = `translateY(${-dinoY}px)`;
    }

    function jump() {
        if (!gameStarted) {
            gameStarted = true;
            instructionBox.style.opacity = '0'; // Hide instruction on first jump
        }

        if (dinoY <= 0 && !isJumping) {
            dinoVelocity = JUMP_STRENGTH;
            isJumping = true;
            dino.classList.remove('dino-running');
            dino.classList.add('dino-jumping');
        }
    }

    // --- OBSTACLES ---
    function spawnObstacle() {
        // Determine type
        const type = Math.random() > 0.7 ? 'bird' : 'cactus';
        const el = document.createElement('div');
        el.className = `obstacle ${type}`;
        el.innerHTML = type === 'cactus' ? CACTUS_SVG : BIRD_SVG;
        
        const startX = window.innerWidth;
        el.style.left = `${startX}px`;
        
        obstacleLayer.appendChild(el);

        obstacles.push({
            el: el,
            x: startX,
            type: type,
            width: type === 'cactus' ? 32 : 48,
            height: type === 'cactus' ? 56 : 32,
            passed: false
        });
    }

    function updateObstacles() {
        spawnTimer += 16; 
        
        // Spawn Logic
        if (spawnTimer > (25000 / gameSpeed)) { 
            spawnTimer = 0;
            if (Math.random() > 0.4) spawnObstacle();
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.x -= gameSpeed;
            obs.el.style.left = `${obs.x}px`;

            if (obs.x < -100) {
                obs.el.remove();
                obstacles.splice(i, 1);
            }
        }
    }

    // --- COLLISION ---
    function checkCollisions() {
        // Tight Hitbox
        const dinoRect = {
            l: 80 + 16, // x offset + padding
            r: 80 + 48, 
            t: dinoY,    
            b: dinoY + 48 
        };

        for (let obs of obstacles) {
            let obsRect;
            if (obs.type === 'bird') {
                // Bird floats higher
                obsRect = {
                    l: obs.x + 8,
                    r: obs.x + obs.width - 8,
                    t: 60, 
                    b: 60 + obs.height
                };
            } else {
                // Cactus on ground
                obsRect = {
                    l: obs.x + 8,
                    r: obs.x + obs.width - 8,
                    t: 0,
                    b: obs.height
                };
            }

            if (
                dinoRect.l < obsRect.r &&
                dinoRect.r > obsRect.l &&
                dinoRect.t < obsRect.b &&
                dinoRect.b > obsRect.t
            ) {
                triggerGameOver();
            }
        }
    }

    // --- SCORE & SPEED ---
    function updateScore() {
        score += 0.1;
        const displayScore = Math.floor(score).toString().padStart(4, '0');
        scoreEl.innerText = displayScore;

        if (Math.floor(score) % 100 === 0 && Math.floor(score) > 0) {
            gameSpeed += 0.2;
            speedEl.innerText = Math.floor(gameSpeed).toString().padStart(2, '0');
        }
    }

    // --- GAME CONTROL ---
    function startGame() {
        isPlaying = true;
        isGameOver = false;
        score = 0;
        gameSpeed = BASE_SPEED;
        dinoY = 0;
        dinoVelocity = 0;
        
        obstacles.forEach(o => o.el.remove());
        obstacles = [];
        
        overlay.classList.remove('active');
        dino.classList.remove('dino-jumping');
        dino.classList.add('dino-running');
        
        // Reset visual state
        instructionBox.style.opacity = '0';
        gameStarted = true;
    }

    function triggerGameOver() {
        isGameOver = true;
        isPlaying = false;
        dino.classList.remove('dino-running');
        dino.classList.remove('dino-jumping');
        
        if (score > highScore) {
            highScore = Math.floor(score);
            highScoreEl.innerText = highScore.toString().padStart(4, '0');
        }

        overlay.classList.add('active');
    }

    // --- INPUT ---
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            if (isGameOver) {
                startGame();
            } else {
                jump();
            }
        }
    });

    // --- INITIAL SETUP ---
    // Pre-instantiate obstacles for visual context
    const initCactus = document.createElement('div');
    initCactus.className = 'obstacle cactus';
    initCactus.innerHTML = CACTUS_SVG;
    initCactus.style.left = '600px';
    obstacleLayer.appendChild(initCactus);
    obstacles.push({ el: initCactus, x: 600, type: 'cactus', width: 32, height: 56 });

    const initBird = document.createElement('div');
    initBird.className = 'obstacle bird';
    initBird.innerHTML = BIRD_SVG;
    initBird.style.left = '900px';
    obstacleLayer.appendChild(initBird);
    obstacles.push({ el: initBird, x: 900, type: 'bird', width: 48, height: 32 });

    requestAnimationFrame(loop);

</script>
</body>
</html>
