<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYNTH RUNNER</title>
<style>
    :root {
        /* Palette: Deep Space / Desert Night */
        --bg-top: #050510;
        --bg-mid: #1a1a2e;
        --bg-bot: #16213e;
        --accent-cyan: #00f0ff;
        --accent-pink: #ff0055;
        --accent-yellow: #ffe600;
        --ground-color: #0a0a12;
        
        /* Typography */
        --font-ui: 'Courier New', Courier, monospace;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
    }

    body {
        background-color: var(--bg-top);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        font-family: var(--font-ui);
        color: white;
    }

    /* --- WORLD & ATMOSPHERE --- */
    .world {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bot) 100%);
        z-index: 0;
        overflow: hidden;
    }

    /* Stars */
    .stars {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 60%;
        background-image: 
            radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
            radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
            radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
        background-size: 550px 550px, 350px 350px, 250px 250px;
        background-position: 0 0, 40px 60px, 130px 270px;
        opacity: 0.6;
    }

    /* Sun / Moon */
    .celestial {
        position: absolute;
        bottom: 28%;
        left: 50%;
        transform: translateX(-50%);
        width: 200px;
        height: 200px;
        background: linear-gradient(to top, var(--accent-pink), var(--accent-yellow));
        border-radius: 50%;
        box-shadow: 0 0 40px var(--accent-pink);
        z-index: 1;
        opacity: 0.9;
    }
    /* Sun cutouts */
    .celestial::after {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        border-radius: 50%;
        background: repeating-linear-gradient(
            to bottom,
            transparent 0%,
            transparent 10%,
            var(--bg-bot) 10%,
            var(--bg-bot) 14%
        );
    }

    /* --- LAYERED TERRAIN --- */
    .terrain-layer {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 30%;
        z-index: 2;
    }

    /* Distant Mountains (Silhouette) */
    .mountains {
        position: absolute;
        bottom: 0;
        width: 200%;
        height: 100%;
        background: 
            linear-gradient(transparent 60%, var(--bg-mid) 60%),
            linear-gradient(transparent 60%, var(--bg-mid) 60%);
        clip-path: polygon(
            0% 100%, 0% 80%, 10% 70%, 20% 85%, 30% 60%, 40% 75%, 50% 50%, 60% 80%, 70% 55%, 80% 70%, 90% 60%, 100% 80%, 100% 100%
        );
        opacity: 0.5;
        animation: scrollBg 60s linear infinite;
    }

    /* Mid Ground (Dark Dunes) */
    .dunes {
        position: absolute;
        bottom: 0;
        width: 200%;
        height: 100%;
        background: #0f0f1a;
        clip-path: polygon(
            0% 100%, 0% 90%, 15% 85%, 25% 95%, 40% 80%, 55% 90%, 70% 75%, 85% 85%, 100% 90%, 100% 100%
        );
        animation: scrollBg 20s linear infinite;
    }

    /* Immediate Ground (The Floor) */
    .floor {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 80px;
        background-color: var(--ground-color);
        border-top: 2px solid var(--accent-cyan);
        box-shadow: 0 -10px 30px rgba(0, 240, 255, 0.15);
        z-index: 10;
        /* Grid texture on floor */
        background-image: 
            linear-gradient(90deg, rgba(0, 240, 255, 0.1) 1px, transparent 1px),
            linear-gradient(rgba(0, 240, 255, 0.1) 1px, transparent 1px);
        background-size: 50px 20px;
    }

    /* --- GAMEPLAY AREA --- */
    .game-area {
        position: absolute;
        bottom: 80px; /* Matches floor height */
        left: 0;
        width: 100%;
        height: 400px;
        z-index: 20;
        overflow: hidden; /* Hide spawning obstacles */
    }

    /* Player Character */
    .dino-container {
        position: absolute;
        bottom: 0;
        left: 100px;
        width: 64px;
        height: 64px;
        z-index: 30;
        will-change: transform;
    }

    .dino-svg {
        width: 100%;
        height: 100%;
        fill: var(--accent-cyan);
        filter: drop-shadow(0 0 5px var(--accent-cyan));
    }

    /* Obstacles */
    .obstacle {
        position: absolute;
        will-change: transform;
        z-index: 25;
    }

    .cactus {
        width: 40px;
        height: 60px;
        bottom: 0;
    }
    .cactus svg {
        width: 100%; height: 100%;
        fill: var(--accent-pink);
        filter: drop-shadow(0 0 4px var(--accent-pink));
    }

    .bird {
        width: 50px;
        height: 30px;
        bottom: 70px; /* Flying height */
    }
    .bird svg {
        width: 100%; height: 100%;
        fill: var(--accent-yellow);
        filter: drop-shadow(0 0 4px var(--accent-yellow));
        animation: flap 0.5s infinite alternate;
    }

    /* --- UI / HUD --- */
    .ui-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 100;
        pointer-events: none;
        padding: 30px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    /* Top Right HUD */
    .hud-top-right {
        position: absolute;
        top: 30px;
        right: 30px;
        text-align: right;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 5px;
    }

    .score-row {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .label {
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.6);
        letter-spacing: 1px;
        font-weight: bold;
    }

    .value {
        font-size: 1.8rem;
        font-weight: 900;
        color: #fff;
        text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        letter-spacing: -1px;
    }

    .hi-score {
        font-size: 1rem;
        color: var(--accent-yellow);
        font-weight: bold;
    }

    /* Bottom Left: Speed & Instructions */
    .hud-bottom-left {
        position: absolute;
        bottom: 100px; /* Just above floor */
        left: 30px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .speedometer {
        display: flex;
        align-items: baseline;
        gap: 5px;
    }
    .speed-val {
        font-size: 2rem;
        font-weight: bold;
        color: var(--accent-cyan);
    }
    .speed-unit {
        font-size: 0.8rem;
        color: var(--accent-cyan);
    }

    .instruction {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(0, 0, 0, 0.4);
        padding: 8px 12px;
        border-radius: 4px;
        border-left: 3px solid var(--accent-cyan);
        backdrop-filter: blur(4px);
    }

    .key-cap {
        width: 32px;
        height: 32px;
        border: 2px solid white;
        border-radius: 4px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        font-size: 0.8rem;
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 3px 0 rgba(255,255,255,0.3);
    }

    .action-text {
        font-weight: bold;
        letter-spacing: 1px;
        text-transform: uppercase;
        font-size: 0.9rem;
    }

    /* --- ANIMATIONS --- */
    @keyframes scrollBg {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
    }

    @keyframes flap {
        from { transform: scaleY(1); }
        to { transform: scaleY(-0.8); }
    }

    /* Jump Animation Class */
    .dino-jumping {
        animation: jumpArc 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes jumpArc {
        0% { transform: translateY(0) rotate(0deg); }
        30% { transform: translateY(-140px) rotate(-15deg); }
        60% { transform: translateY(-140px) rotate(10deg); }
        100% { transform: translateY(0) rotate(0deg); }
    }

    /* Run Bobbing */
    .dino-running .dino-svg {
        animation: bob 0.3s infinite alternate ease-in-out;
    }
    @keyframes bob {
        from { transform: translateY(0); }
        to { transform: translateY(-4px); }
    }

    /* Game Over Overlay (Hidden by default) */
    .overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.7);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 200;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        backdrop-filter: blur(3px);
    }
    .overlay.active {
        opacity: 1;
        pointer-events: auto;
    }
    
    .overlay-title {
        font-size: 3rem;
        font-weight: 900;
        color: var(--accent-pink);
        text-shadow: 0 0 10px var(--accent-pink);
        margin-bottom: 10px;
        text-transform: uppercase;
        font-style: italic;
    }
    .overlay-sub {
        font-size: 1rem;
        letter-spacing: 2px;
        animation: blink 1s infinite;
    }
    @keyframes blink { 50% { opacity: 0.3; } }

</style>
</head>
<body>

    <!-- ENVIRONMENT -->
    <div class="world">
        <div class="stars"></div>
        <div class="celestial"></div>
        <div class="terrain-layer">
            <div class="mountains"></div>
            <div class="dunes"></div>
        </div>
        <div class="floor"></div>
    </div>

    <!-- GAMEPLAY LAYER -->
    <div class="game-area" id="gameArea">
        <!-- Player -->
        <div class="dino-container dino-running" id="dino">
            <!-- Crisp Vector Dino -->
            <svg class="dino-svg" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                <path d="M26 6h-6v-4h-4v4h-4v4h-4v4h-4v4h4v4h4v10h4v-10h4v-4h4v-4h4v-4h4v-4h-4v-4z"/>
                <rect x="23" y="7" width="2" height="2" fill="#050510"/> <!-- Eye -->
            </svg>
        </div>
        <div id="obstacleLayer"></div>
    </div>

    <!-- UI LAYER -->
    <div class="ui-layer">
        <!-- Top Right: Scores -->
        <div class="hud-top-right">
            <div class="score-row">
                <span class="label">HI</span>
                <span class="hi-score" id="highScoreVal">0420</span>
            </div>
            <div class="score-row">
                <span class="label">SCORE</span>
                <span class="value" id="scoreVal">0000</span>
            </div>
        </div>

        <!-- Bottom Left: Speed & Controls -->
        <div class="hud-bottom-left">
            <div class="speedometer">
                <span class="speed-val" id="speedVal">06</span>
                <span class="speed-unit">x SPD</span>
            </div>
            <div class="instruction">
                <div class="key-cap">SPC</div>
                <span class="action-text">JUMP</span>
            </div>
        </div>
    </div>

    <!-- GAME OVER OVERLAY -->
    <div class="overlay" id="overlay">
        <div class="overlay-title">CRASHED</div>
        <div class="overlay-sub">PRESS SPACE TO RETRY</div>
    </div>

<script>
    // --- CONFIG ---
    const GRAVITY = 0.6;
    const JUMP_STRENGTH = 13;
    const BASE_SPEED = 6;
    
    // --- STATE ---
    let isPlaying = true; // Start immediately per critique
    let isGameOver = false;
    let score = 0;
    let highScore = 420;
    let gameSpeed = BASE_SPEED;
    let lastTime = 0;
    let spawnTimer = 0;
    let obstacles = [];
    let dinoY = 0;
    let dinoVelocity = 0;
    let isJumping = false;
    let animationId;

    // --- DOM ---
    const dino = document.getElementById('dino');
    const obstacleLayer = document.getElementById('obstacleLayer');
    const scoreEl = document.getElementById('scoreVal');
    const highScoreEl = document.getElementById('highScoreVal');
    const speedEl = document.getElementById('speedVal');
    const overlay = document.getElementById('overlay');

    // --- ASSETS ---
    const CACTUS_SVG = `
        <svg viewBox="0 0 24 48" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 48V24H4v-6h6V12h6v6h6v6h-6v26h-6z"/>
        </svg>`;
    
    const BIRD_SVG = `
        <svg viewBox="0 0 32 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 14 L8 8 L16 14 L24 8 L30 14 L24 18 L16 12 L8 18 Z"/>
        </svg>`;

    // --- GAME LOOP ---
    function loop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = timestamp - lastTime;
        lastTime = timestamp;

        if (isPlaying && !isGameOver) {
            updatePhysics();
            updateObstacles();
            checkCollisions();
            updateScore();
        }
        
        animationId = requestAnimationFrame(loop);
    }

    // --- PHYSICS ---
    function updatePhysics() {
        // Apply Gravity
        dinoY += dinoVelocity;
        dinoVelocity -= GRAVITY;

        // Ground Check
        if (dinoY < 0) {
            dinoY = 0;
            dinoVelocity = 0;
            if (isJumping) {
                isJumping = false;
                dino.classList.remove('dino-jumping');
                dino.classList.add('dino-running');
            }
        }

        // Apply Visuals (Transform is performant)
        dino.style.transform = `translateY(${-dinoY}px)`;
    }

    function jump() {
        if (dinoY <= 0 && !isJumping) {
            dinoVelocity = JUMP_STRENGTH;
            isJumping = true;
            dino.classList.remove('dino-running');
            dino.classList.add('dino-jumping');
        }
    }

    // --- OBSTACLES ---
    function spawnObstacle() {
        const type = Math.random() > 0.8 ? 'bird' : 'cactus';
        const el = document.createElement('div');
        el.className = `obstacle ${type}`;
        el.innerHTML = type === 'cactus' ? CACTUS_SVG : BIRD_SVG;
        
        // Initial Position (off screen right)
        const startX = window.innerWidth;
        el.style.left = `${startX}px`;
        
        obstacleLayer.appendChild(el);

        obstacles.push({
            el: el,
            x: startX,
            type: type,
            width: type === 'cactus' ? 40 : 50,
            height: type === 'cactus' ? 60 : 30,
            passed: false
        });
    }

    function updateObstacles() {
        spawnTimer += 16; // Approx 60fps frame time
        
        // Spawn Logic
        if (spawnTimer > (12000 / gameSpeed)) { // Speed dependent spawn
            spawnTimer = 0;
            // Randomize slightly
            if (Math.random() > 0.3) spawnObstacle();
        }

        // Move & Cleanup
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.x -= gameSpeed;
            obs.el.style.left = `${obs.x}px`;

            // Remove if off screen
            if (obs.x < -100) {
                obs.el.remove();
                obstacles.splice(i, 1);
            }
        }
    }

    // --- COLLISION ---
    function checkCollisions() {
        // Dino Hitbox (approximate)
        // Left is 100px (CSS). Width 64px.
        const dinoRect = {
            l: 100 + 12, // Padding for visual forgiveness
            r: 100 + 52, 
            t: dinoY,    // Bottom is 0 relative to floor
            b: dinoY + 54 // Height
        };

        for (let obs of obstacles) {
            let obsRect;
            if (obs.type === 'bird') {
                obsRect = {
                    l: obs.x + 5,
                    r: obs.x + obs.width - 5,
                    t: 70, // Flying height (CSS bottom)
                    b: 70 + obs.height
                };
            } else {
                obsRect = {
                    l: obs.x + 5,
                    r: obs.x + obs.width - 5,
                    t: 0,
                    b: obs.height
                };
            }

            // AABB Collision
            if (
                dinoRect.l < obsRect.r &&
                dinoRect.r > obsRect.l &&
                dinoRect.t < obsRect.b &&
                dinoRect.b > obsRect.t
            ) {
                triggerGameOver();
            }
        }
    }

    // --- SCORE & SPEED ---
    function updateScore() {
        score += 0.1;
        const displayScore = Math.floor(score).toString().padStart(4, '0');
        scoreEl.innerText = displayScore;

        // Speed ramp up
        if (Math.floor(score) % 100 === 0 && Math.floor(score) > 0) {
            gameSpeed += 0.2;
            speedEl.innerText = Math.floor(gameSpeed).toString().padStart(2, '0');
        }
    }

    // --- GAME CONTROL ---
    function startGame() {
        isPlaying = true;
        isGameOver = false;
        score = 0;
        gameSpeed = BASE_SPEED;
        dinoY = 0;
        dinoVelocity = 0;
        
        // Clear obstacles
        obstacles.forEach(o => o.el.remove());
        obstacles = [];
        
        overlay.classList.remove('active');
        dino.classList.remove('dino-jumping');
        dino.classList.add('dino-running');
    }

    function triggerGameOver() {
        isGameOver = true;
        isPlaying = false;
        dino.classList.remove('dino-running');
        dino.classList.remove('dino-jumping');
        
        // Update High Score
        if (score > highScore) {
            highScore = Math.floor(score);
            highScoreEl.innerText = highScore.toString().padStart(4, '0');
        }

        overlay.classList.add('active');
    }

    // --- INPUT ---
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            if (isGameOver) {
                startGame();
            } else {
                jump();
            }
        }
    });

    // Start Loop
    requestAnimationFrame(loop);

</script>
</body>
</html>
