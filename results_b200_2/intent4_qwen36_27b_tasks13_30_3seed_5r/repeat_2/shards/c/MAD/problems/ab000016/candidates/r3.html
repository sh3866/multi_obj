<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SILHOUETTE RUNNER</title>
<style>
    :root {
        /* Palette: Warm Desert & Retro Tech */
        --sky-top: #2c1b4d;
        --sky-horizon: #e86a33;
        --ground-base: #d98c48;
        --ground-dark: #c26e2d;
        
        --accent-cyan: #00f0ff;
        --accent-white: #ffffff;
        --accent-dark: #1a1a1a;
        
        /* Typography */
        --font-ui: 'Courier New', Courier, monospace;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
    }

    body {
        background-color: var(--sky-top);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        font-family: var(--font-ui);
        color: var(--accent-white);
    }

    /* --- WORLD & ATMOSPHERE --- */
    .world {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        /* Sky Gradient: Deep Purple to Burnt Orange */
        background: linear-gradient(180deg, var(--sky-top) 0%, #6b3e75 40%, var(--sky-horizon) 80%, var(--sky-horizon) 100%);
        z-index: 0;
        overflow: hidden;
    }

    /* Faded Sun */
    .celestial {
        position: absolute;
        bottom: 30%; /* Horizon level */
        left: 50%;
        transform: translateX(-50%);
        width: 120px; /* Drastically reduced */
        height: 120px;
        background: linear-gradient(to top, #ffcc00, #ff6b6b);
        border-radius: 50%;
        /* Reduced opacity for context */
        opacity: 0.4; 
        z-index: 1;
        /* Retro sun stripes */
        clip-path: polygon(
            0% 0%, 100% 0%, 100% 60%, 0% 60%, /* Top block */
            0% 65%, 100% 65%, 100% 75%, 0% 75%, /* Cutout */
            0% 80%, 100% 80%, 100% 90%, 0% 90%, /* Cutout */
            0% 95%, 100% 95%, 100% 100%, 0% 100% /* Bottom */
        );
    }

    /* --- TERRAIN --- */
    /* Horizon Line */
    .horizon-line {
        position: absolute;
        bottom: 25%;
        left: 0;
        width: 100%;
        height: 2px;
        background: rgba(255,255,255,0.2);
        z-index: 2;
    }

    .terrain-layer {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 25%;
        z-index: 2;
        /* Ground Gradient */
        background: linear-gradient(180deg, var(--ground-base) 0%, var(--ground-dark) 100%);
        border-top: 2px solid rgba(255,255,255,0.1);
    }

    /* Subtle Ground Texture */
    .ground-texture {
        position: absolute;
        top: 0; left: 0; width: 200%; height: 100%;
        background-image: 
            radial-gradient(circle, rgba(0,0,0,0.1) 1px, transparent 1px);
        background-size: 40px 40px;
        animation: scrollGround 5s linear infinite;
    }

    @keyframes scrollGround {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
    }

    /* --- GAMEPLAY AREA --- */
    .game-area {
        position: absolute;
        bottom: 25%; /* Aligns with terrain */
        left: 0;
        width: 100%;
        height: 400px;
        z-index: 10;
        overflow: hidden;
    }

    /* Player Character: High Contrast Silhouette */
    .dino-container {
        position: absolute;
        bottom: 0;
        left: 120px;
        width: 80px; /* 200% scale approx */
        height: 80px;
        z-index: 20;
        will-change: transform;
    }

    .dino-svg {
        width: 100%;
        height: 100%;
        fill: var(--accent-dark); /* Solid Dark Shape */
        stroke: var(--accent-white); /* Crisp Outline */
        stroke-width: 1.5px;
        stroke-linejoin: round;
    }

    /* Obstacles */
    .obstacle {
        position: absolute;
        will-change: transform;
        z-index: 15;
    }

    .cactus {
        width: 45px;
        height: 70px;
        bottom: 0;
    }
    .cactus svg {
        width: 100%; height: 100%;
        fill: #5c3a21; /* Dark organic color */
        stroke: var(--accent-dark);
        stroke-width: 1px;
    }

    .bird {
        width: 60px;
        height: 35px;
        bottom: 80px; /* Clear headroom */
    }
    .bird svg {
        width: 100%; height: 100%;
        fill: var(--accent-dark);
        stroke: var(--accent-white);
        stroke-width: 1.5px;
        animation: flap 0.4s infinite alternate ease-in-out;
    }

    /* --- UI / HUD --- */
    .ui-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 100;
        pointer-events: none;
    }

    /* Top Right: Unified Status Bar */
    .hud-top-right {
        position: absolute;
        top: 25px;
        right: 30px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        font-family: var(--font-ui);
        text-transform: uppercase;
    }

    .hud-row {
        display: flex;
        align-items: baseline;
        gap: 12px;
    }

    .label {
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.7);
        font-weight: bold;
        letter-spacing: 1px;
    }

    .value {
        font-size: 1.5rem;
        font-weight: 900;
        color: var(--accent-white); /* Neutral White */
        letter-spacing: -1px;
    }

    .value.neon {
        color: var(--accent-cyan); /* Strictly for Speed */
        text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    }

    /* Bottom Left: Refined Instruction */
    .hud-bottom-left {
        position: absolute;
        bottom: 30%; /* Closer to Dino */
        left: 120px; /* Aligned with Dino */
        transform: translateX(100px); /* Offset to the right of Dino */
    }

    .instruction-pill {
        display: inline-flex;
        align-items: center;
        background: rgba(26, 26, 26, 0.85);
        border: 1px solid var(--accent-cyan);
        border-radius: 50px; /* Pill shape */
        padding: 6px 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        backdrop-filter: blur(2px);
    }

    .key-cap {
        width: 28px;
        height: 28px;
        background: var(--accent-cyan);
        color: var(--accent-dark);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: 900;
        font-size: 0.75rem;
        margin-right: 10px;
        box-shadow: inset 0 2px 0 rgba(255,255,255,0.5);
    }

    .action-text {
        font-weight: bold;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-size: 0.9rem;
        color: var(--accent-cyan);
    }

    /* --- ANIMATIONS --- */
    @keyframes flap {
        from { transform: scaleY(1) translateY(0); }
        to { transform: scaleY(-0.6) translateY(2px); }
    }

    .dino-jumping {
        animation: jumpArc 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes jumpArc {
        0% { transform: translateY(0) rotate(0deg); }
        20% { transform: translateY(-10px) rotate(-5deg); }
        50% { transform: translateY(-150px) rotate(-15deg); }
        80% { transform: translateY(-10px) rotate(5deg); }
        100% { transform: translateY(0) rotate(0deg); }
    }

    .dino-running .dino-svg {
        animation: bob 0.2s infinite alternate ease-in-out;
    }
    @keyframes bob {
        from { transform: translateY(0); }
        to { transform: translateY(-6px); }
    }

    /* Game Over Overlay */
    .overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(44, 27, 77, 0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 200;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
        backdrop-filter: blur(5px);
    }
    .overlay.active {
        opacity: 1;
        pointer-events: auto;
    }
    
    .overlay-title {
        font-size: 4rem;
        font-weight: 900;
        color: var(--accent-white);
        text-shadow: 4px 4px 0px var(--sky-top);
        margin-bottom: 20px;
        font-style: italic;
        letter-spacing: -2px;
    }
    .overlay-sub {
        font-size: 1.2rem;
        letter-spacing: 4px;
        color: var(--accent-cyan);
        animation: blink 1.5s infinite;
    }
    @keyframes blink { 50% { opacity: 0.4; } }

</style>
</head>
<body>

    <!-- ENVIRONMENT -->
    <div class="world">
        <!-- Sun -->
        <div class="celestial"></div>
        
        <!-- Horizon -->
        <div class="horizon-line"></div>
        
        <!-- Ground -->
        <div class="terrain-layer">
            <div class="ground-texture"></div>
        </div>
    </div>

    <!-- GAMEPLAY LAYER -->
    <div class="game-area" id="gameArea">
        <!-- Player -->
        <div class="dino-container dino-running" id="dino">
            <!-- High Contrast Vector Dino -->
            <svg class="dino-svg" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                <path d="M28 4h-8v-4h-8v4h-4v4h-4v4h-4v12h4v8h4v-8h4v-4h4v-4h4v-4h4v-8h-4v-4z"/>
                <!-- Eye cutout -->
                <circle cx="20" cy="6" r="1.5" fill="#1a1a1a" stroke="none"/>
            </svg>
        </div>
        <div id="obstacleLayer"></div>
    </div>

    <!-- UI LAYER -->
    <div class="ui-layer">
        <!-- Top Right: Unified Status -->
        <div class="hud-top-right">
            <div class="hud-row">
                <span class="label">HI</span>
                <span class="value" id="highScoreVal">0420</span>
            </div>
            <div class="hud-row">
                <span class="label">SCORE</span>
                <span class="value" id="scoreVal">0000</span>
            </div>
            <div class="hud-row">
                <span class="label">SPD</span>
                <span class="value neon" id="speedVal">06</span>
            </div>
        </div>

        <!-- Bottom Left: Contextual Instruction -->
        <div class="hud-bottom-left">
            <div class="instruction-pill">
                <div class="key-cap">SPC</div>
                <span class="action-text">JUMP</span>
            </div>
        </div>
    </div>

    <!-- GAME OVER OVERLAY -->
    <div class="overlay" id="overlay">
        <div class="overlay-title">CRASHED</div>
        <div class="overlay-sub">PRESS SPACE TO RETRY</div>
    </div>

<script>
    // --- CONFIG ---
    const GRAVITY = 0.65;
    const JUMP_STRENGTH = 14;
    const BASE_SPEED = 7;
    
    // --- STATE ---
    let isPlaying = true;
    let isGameOver = false;
    let score = 0;
    let highScore = 420;
    let gameSpeed = BASE_SPEED;
    let lastTime = 0;
    let spawnTimer = 0;
    let obstacles = [];
    let dinoY = 0;
    let dinoVelocity = 0;
    let isJumping = false;
    let animationId;

    // --- DOM ---
    const dino = document.getElementById('dino');
    const obstacleLayer = document.getElementById('obstacleLayer');
    const scoreEl = document.getElementById('scoreVal');
    const highScoreEl = document.getElementById('highScoreVal');
    const speedEl = document.getElementById('speedVal');
    const overlay = document.getElementById('overlay');

    // --- ASSETS ---
    // Minimalist Cactus Silhouette
    const CACTUS_SVG = `
        <svg viewBox="0 0 24 48" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 48V24H4v-6h6V12h6v6h6v6h-6v26h-6z"/>
        </svg>`;
    
    // Pterodactyl Silhouette
    const BIRD_SVG = `
        <svg viewBox="0 0 32 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 14 L8 8 L16 14 L24 8 L30 14 L24 18 L16 12 L8 18 Z"/>
        </svg>`;

    // --- GAME LOOP ---
    function loop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = timestamp - lastTime;
        lastTime = timestamp;

        if (isPlaying && !isGameOver) {
            updatePhysics();
            updateObstacles();
            checkCollisions();
            updateScore();
        }
        
        animationId = requestAnimationFrame(loop);
    }

    // --- PHYSICS ---
    function updatePhysics() {
        // Apply Gravity
        dinoY += dinoVelocity;
        dinoVelocity -= GRAVITY;

        // Ground Check
        if (dinoY < 0) {
            dinoY = 0;
            dinoVelocity = 0;
            if (isJumping) {
                isJumping = false;
                dino.classList.remove('dino-jumping');
                dino.classList.add('dino-running');
            }
        }

        // Apply Visuals
        dino.style.transform = `translateY(${-dinoY}px)`;
    }

    function jump() {
        if (dinoY <= 0 && !isJumping) {
            dinoVelocity = JUMP_STRENGTH;
            isJumping = true;
            dino.classList.remove('dino-running');
            dino.classList.add('dino-jumping');
        }
    }

    // --- OBSTACLES ---
    function spawnObstacle() {
        // More balanced spawn rates
        const type = Math.random() > 0.7 ? 'bird' : 'cactus';
        const el = document.createElement('div');
        el.className = `obstacle ${type}`;
        el.innerHTML = type === 'cactus' ? CACTUS_SVG : BIRD_SVG;
        
        const startX = window.innerWidth;
        el.style.left = `${startX}px`;
        
        obstacleLayer.appendChild(el);

        obstacles.push({
            el: el,
            x: startX,
            type: type,
            width: type === 'cactus' ? 45 : 60,
            height: type === 'cactus' ? 70 : 35,
            passed: false
        });
    }

    function updateObstacles() {
        spawnTimer += 16; 
        
        // Spawn Logic
        if (spawnTimer > (14000 / gameSpeed)) { 
            spawnTimer = 0;
            // Random chance to spawn to prevent predictable rhythm
            if (Math.random() > 0.2) spawnObstacle();
        }

        // Move & Cleanup
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.x -= gameSpeed;
            obs.el.style.left = `${obs.x}px`;

            if (obs.x < -100) {
                obs.el.remove();
                obstacles.splice(i, 1);
            }
        }
    }

    // --- COLLISION ---
    function checkCollisions() {
        // Dino Hitbox (Tightened for polished feel)
        const dinoRect = {
            l: 120 + 15, 
            r: 120 + 65, 
            t: dinoY,    
            b: dinoY + 60 
        };

        for (let obs of obstacles) {
            let obsRect;
            if (obs.type === 'bird') {
                obsRect = {
                    l: obs.x + 5,
                    r: obs.x + obs.width - 5,
                    t: 80, // Flying height
                    b: 80 + obs.height
                };
            } else {
                obsRect = {
                    l: obs.x + 5,
                    r: obs.x + obs.width - 5,
                    t: 0,
                    b: obs.height
                };
            }

            // AABB Collision
            if (
                dinoRect.l < obsRect.r &&
                dinoRect.r > obsRect.l &&
                dinoRect.t < obsRect.b &&
                dinoRect.b > obsRect.t
            ) {
                triggerGameOver();
            }
        }
    }

    // --- SCORE & SPEED ---
    function updateScore() {
        score += 0.1;
        const displayScore = Math.floor(score).toString().padStart(4, '0');
        scoreEl.innerText = displayScore;

        // Speed ramp up
        if (Math.floor(score) % 100 === 0 && Math.floor(score) > 0) {
            gameSpeed += 0.2;
            speedEl.innerText = Math.floor(gameSpeed).toString().padStart(2, '0');
        }
    }

    // --- GAME CONTROL ---
    function startGame() {
        isPlaying = true;
        isGameOver = false;
        score = 0;
        gameSpeed = BASE_SPEED;
        dinoY = 0;
        dinoVelocity = 0;
        
        obstacles.forEach(o => o.el.remove());
        obstacles = [];
        
        overlay.classList.remove('active');
        dino.classList.remove('dino-jumping');
        dino.classList.add('dino-running');
    }

    function triggerGameOver() {
        isGameOver = true;
        isPlaying = false;
        dino.classList.remove('dino-running');
        dino.classList.remove('dino-jumping');
        
        if (score > highScore) {
            highScore = Math.floor(score);
            highScoreEl.innerText = highScore.toString().padStart(4, '0');
        }

        overlay.classList.add('active');
    }

    // --- INPUT ---
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            if (isGameOver) {
                startGame();
            } else {
                jump();
            }
        }
    });

    // Start Loop
    requestAnimationFrame(loop);

</script>
</body>
</html>
