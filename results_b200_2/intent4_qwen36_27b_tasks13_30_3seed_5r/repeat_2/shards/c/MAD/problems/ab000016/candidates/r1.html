<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYNTH RUNNER</title>
<style>
    :root {
        --sky-top: #240046;
        --sky-mid: #7b2cbf;
        --sky-bot: #ff9e00;
        --sun-color: #ff0055;
        --ground-dark: #10002b;
        --ground-light: #3c096c;
        --neon-cyan: #00f3ff;
        --neon-pink: #ff007f;
        --neon-yellow: #ffe600;
        --font-data: 'Courier New', Courier, monospace;
        --font-title: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
    }

    body {
        background-color: var(--sky-top);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        font-family: var(--font-data);
        color: white;
    }

    /* --- SYNTHWAVE BACKGROUND --- */
    .world {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 40%, var(--sky-bot) 85%);
        overflow: hidden;
    }

    /* The Retro Sun */
    .sun {
        position: absolute;
        bottom: 25%; /* Just above horizon */
        left: 50%;
        transform: translateX(-50%);
        width: 300px;
        height: 300px;
        background: linear-gradient(to top, var(--neon-yellow), var(--sun-color));
        border-radius: 50%;
        box-shadow: 0 0 60px var(--sun-color);
        z-index: 1;
    }

    /* Sun Grid Lines (Cutout effect) */
    .sun::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: repeating-linear-gradient(
            to bottom,
            transparent 0%,
            transparent 80%,
            var(--sky-mid) 80%,
            var(--sky-mid) 90%
        );
    }

    /* --- LAYERED HORIZON (CSS DUNES) --- */
    .horizon {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 25%;
        z-index: 2;
        pointer-events: none;
    }

    .dune {
        position: absolute;
        bottom: 0;
        width: 200%;
        background: var(--ground-dark);
        clip-path: polygon(
            0% 40%, 10% 30%, 25% 50%, 40% 35%, 55% 55%, 70% 30%, 85% 45%, 100% 20%, 100% 100%, 0% 100%
        );
        animation: scrollBg 30s linear infinite;
    }

    .dune.back {
        bottom: 0;
        height: 120%;
        background: #240046;
        opacity: 0.8;
        clip-path: polygon(
            0% 60%, 15% 45%, 35% 65%, 50% 40%, 65% 60%, 85% 45%, 100% 55%, 100% 100%, 0% 100%
        );
        animation: scrollBg 45s linear infinite;
        z-index: -1;
    }

    .dune.front {
        bottom: -50px;
        height: 100px;
        background: black;
        z-index: 5;
        animation: none; /* Static ground for gameplay reference */
    }

    /* --- GRID FLOOR --- */
    .grid-floor {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 60px; /* The playable ground strip */
        background: 
            linear-gradient(to bottom, rgba(0, 243, 255, 0.2), transparent),
            linear-gradient(90deg, var(--ground-light) 1px, transparent 1px),
            linear-gradient(0deg, var(--ground-light) 1px, transparent 1px);
        background-size: 100% 100%, 40px 100%, 100% 20px;
        transform: perspective(300px) rotateX(20deg) scaleY(1.2);
        transform-origin: bottom;
        z-index: 6;
        box-shadow: 0 -10px 40px rgba(0, 243, 255, 0.1);
        border-top: 2px solid var(--neon-cyan);
    }

    /* --- HUD & TYPOGRAPHY --- */
    .ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 20;
        pointer-events: none;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    /* Top Left: Branding */
    .brand {
        position: absolute;
        top: 20px;
        left: 20px;
        font-family: var(--font-title);
        font-weight: 900;
        font-style: italic;
        font-size: 1.2rem;
        letter-spacing: 2px;
        color: rgba(255, 255, 255, 0.4);
        text-transform: uppercase;
    }

    /* Top Left: Data Block */
    .score-block {
        position: absolute;
        top: 20px;
        right: 20px;
        text-align: right;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
    }

    .score-label {
        font-size: 0.7rem;
        color: rgba(255, 255, 255, 0.6);
        letter-spacing: 1px;
    }

    .score-val {
        font-size: 2rem;
        font-weight: bold;
        color: white;
        text-shadow: 2px 2px 0px var(--neon-pink);
    }

    .high-score {
        font-size: 0.9rem;
        color: var(--neon-yellow);
    }

    /* Bottom Right: Speed & Jump */
    .status-block {
        position: absolute;
        bottom: 80px; /* Above the ground */
        right: 20px;
        text-align: right;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
    }

    .speed-box {
        border-right: 3px solid var(--neon-cyan);
        padding-right: 10px;
    }

    .speed-val {
        font-size: 1.5rem;
        font-weight: bold;
        color: var(--neon-cyan);
    }

    .speed-unit {
        font-size: 0.7rem;
        opacity: 0.7;
    }

    /* Jump Instruction */
    .jump-hint {
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0.8;
        animation: pulse 1.5s infinite;
    }

    .key-icon {
        width: 40px;
        height: 40px;
        border: 2px solid white;
        border-radius: 6px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        font-size: 0.8rem;
        background: rgba(0,0,0,0.3);
        box-shadow: 0 4px 0 rgba(255,255,255,0.2);
    }

    /* --- GAME OBJECTS --- */
    .game-area {
        position: absolute;
        bottom: 60px; /* Height of grid floor */
        left: 0;
        width: 100%;
        height: 300px;
        z-index: 10;
    }

    /* DINO */
    .dino {
        position: absolute;
        bottom: 0;
        left: 100px;
        width: 64px;
        height: 64px;
        z-index: 12;
        filter: drop-shadow(0 0 8px var(--neon-cyan));
    }

    .dino svg {
        width: 100%;
        height: 100%;
        fill: var(--neon-cyan);
    }

    /* OBSTACLES */
    .obstacle {
        position: absolute;
        bottom: 0;
        will-change: transform;
        z-index: 11;
    }

    .cactus {
        width: 40px;
        height: 60px;
    }
    .cactus svg {
        fill: var(--neon-pink);
        filter: drop-shadow(0 0 5px var(--neon-pink));
        width: 100%; height: 100%;
    }

    .bird {
        width: 50px;
        height: 30px;
        bottom: 80px; /* Flying height */
    }
    .bird svg {
        fill: var(--neon-yellow);
        filter: drop-shadow(0 0 5px var(--neon-yellow));
        width: 100%; height: 100%;
    }

    /* --- OVERLAYS --- */
    .overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.6);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 50;
        backdrop-filter: blur(2px);
        opacity: 1;
        transition: opacity 0.3s;
    }
    .hidden { opacity: 0; pointer-events: none; }

    .title-big {
        font-family: var(--font-title);
        font-size: 4rem;
        font-weight: 900;
        font-style: italic;
        color: white;
        text-transform: uppercase;
        text-shadow: 4px 4px 0 var(--neon-pink), -2px -2px 0 var(--neon-cyan);
        margin-bottom: 20px;
        letter-spacing: -2px;
    }

    .blink-text {
        animation: blink 1s infinite;
        font-size: 1.2rem;
        letter-spacing: 2px;
    }

    /* --- ANIMATIONS --- */
    @keyframes scrollBg {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
    }

    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
    }

    /* Jump Animation Class */
    .jumping {
        animation: jumpAnim 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes jumpAnim {
        0% { bottom: 0; transform: rotate(0deg); }
        40% { bottom: 160px; transform: rotate(-10deg); }
        60% { bottom: 160px; transform: rotate(10deg); }
        100% { bottom: 0; transform: rotate(0deg); }
    }

    /* Run Animation Class */
    .running svg {
        animation: runBob 0.3s infinite alternate;
    }
    @keyframes runBob {
        from { transform: translateY(0); }
        to { transform: translateY(-3px); }
    }

</style>
</head>
<body>

    <!-- ENVIRONMENT -->
    <div class="world">
        <div class="sun"></div>
        <div class="horizon">
            <div class="dune back"></div>
            <div class="dune"></div>
        </div>
        <div class="grid-floor"></div>
    </div>

    <!-- GAMEPLAY LAYER -->
    <div class="game-area" id="gameArea">
        <!-- Player -->
        <div class="dino running" id="dino">
            <!-- High Contrast Pixel-ish Vector Dino -->
            <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                <path d="M24 4h4v4h-4v4h-4v4h-4v8h-4v-8h-4v-4h-4v-4h4v-4h4v-4h4v-4h4v4z"/>
                <rect x="25" y="5" width="2" height="2" fill="#000"/> <!-- Eye -->
            </svg>
        </div>
        <div id="obstacleLayer"></div>
    </div>

    <!-- UI LAYER -->
    <div class="ui-layer">
        <div class="brand">Synth Runner</div>
        
        <div class="score-block">
            <div class="score-label">SCORE</div>
            <div class="score-val" id="scoreVal">0000</div>
            <div class="high-score">HI: <span id="highScoreVal">0420</span></div>
        </div>

        <div class="status-block">
            <div class="speed-box">
                <div class="speed-val" id="speedVal">06</div>
                <div class="speed-unit">X SPEED</div>
            </div>
            <div class="jump-hint">
                <span>JUMP</span>
                <div class="key-icon">SPC</div>
            </div>
        </div>
    </div>

    <!-- OVERLAY (Start / Game Over) -->
    <div class="overlay" id="overlay">
        <div class="title-big" id="overlayTitle">SYNTH RUNNER</div>
        <div class="blink-text" id="overlaySub">PRESS SPACE TO START</div>
    </div>

<script>
    // --- CONFIG ---
    const GRAVITY = 0.6;
    const JUMP_STRENGTH = 13;
    const BASE_SPEED = 5;
    
    // --- STATE ---
    let isPlaying = false;
    let isGameOver = false;
    let score = 0;
    let gameSpeed = BASE_SPEED;
    let lastTime = 0;
    let spawnTimer = 0;
    let obstacles = [];
    let dinoY = 0;
    let dinoVelocity = 0;
    let isJumping = false;
    let animationId;

    // --- DOM ---
    const dino = document.getElementById('dino');
    const obstacleLayer = document.getElementById('obstacleLayer');
    const scoreEl = document.getElementById('scoreVal');
    const speedEl = document.getElementById('speedVal');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');

    // --- ASSETS ---
    const CACTUS_SVG = `
        <svg viewBox="0 0 24 48" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 48V24H4v-6h6V12h6v6h6v6h-6v26h-6z"/>
        </svg>`;
    
    const BIRD_SVG = `
        <svg viewBox="0 0 32 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 14 L8 8 L16 14 L24 8 L30 14 L24 18 L16 12 L8 18 Z"/>
        </svg>`;

    // --- GAME LOOP ---
    function loop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = timestamp - lastTime;
        lastTime = timestamp;

        if (isPlaying && !isGameOver) {
            updatePhysics();
            updateObstacles();
            checkCollisions();
            updateScore();
        }
        
        animationId = requestAnimationFrame(loop);
    }

    // --- PHYSICS ---
    function updatePhysics() {
        // Apply Gravity
        dinoY += dinoVelocity;
        dinoVelocity -= GRAVITY;

        // Ground Check
        if (dinoY < 0) {
            dinoY = 0;
            dinoVelocity = 0;
            if (isJumping) {
                isJumping = false;
                dino.classList.remove('jumping');
            }
        }

        // Apply Visuals
        // We use transform for smooth performance
        dino.style.transform = `translateY(${-dinoY}px)`;
    }

    function jump() {
        if (dinoY === 0) {
            dinoVelocity = JUMP_STRENGTH;
            isJumping = true;
            dino.classList.add('jumping');
        }
    }

    // --- OBSTACLES ---
    function spawnObstacle() {
        const type = Math.random() > 0.8 ? 'bird' : 'cactus';
        const el = document.createElement('div');
        el.className = `obstacle ${type}`;
        el.innerHTML = type === 'cactus' ? CACTUS_SVG : BIRD_SVG;
        
        // Initial Position (off screen right)
        const startX = window.innerWidth;
        el.style.left = `${startX}px`;
        
        obstacleLayer.appendChild(el);

        obstacles.push({
            el: el,
            x: startX,
            type: type,
            width: type === 'cactus' ? 40 : 50,
            height: type === 'cactus' ? 60 : 30,
            passed: false
        });
    }

    function updateObstacles() {
        spawnTimer += 16; // Approx 60fps frame time
        
        // Spawn Logic
        if (spawnTimer > (10000 / gameSpeed)) { // Speed dependent spawn
            spawnTimer = 0;
            // Randomize slightly
            if (Math.random() > 0.3) spawnObstacle();
        }

        // Move & Cleanup
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.x -= gameSpeed;
            obs.el.style.left = `${obs.x}px`;

            // Remove if off screen
            if (obs.x < -100) {
                obs.el.remove();
                obstacles.splice(i, 1);
            }
        }
    }

    // --- COLLISION ---
    function checkCollisions() {
        // Dino Hitbox (approximate)
        const dinoRect = {
            l: 100 + 10, // Left padding
            r: 100 + 54, // Right padding
            t: dinoY,    // Bottom is 0, positive is UP in our logic? No, let's stick to DOM logic
            b: dinoY + 64 // Height
        };

        for (let obs of obstacles) {
            let obsRect;
            if (obs.type === 'bird') {
                obsRect = {
                    l: obs.x + 5,
                    r: obs.x + obs.width - 5,
                    t: 80, // Flying height fixed in CSS
                    b: 80 + obs.height
                };
            } else {
                obsRect = {
                    l: obs.x + 5,
                    r: obs.x + obs.width - 5,
                    t: 0,
                    b: obs.height
                };
            }

            // AABB Collision
            if (
                dinoRect.l < obsRect.r &&
                dinoRect.r > obsRect.l &&
                dinoRect.t < obsRect.b &&
                dinoRect.b > obsRect.t
            ) {
                triggerGameOver();
            }
        }
    }

    // --- SCORE & SPEED ---
    function updateScore() {
        score += 0.1;
        const displayScore = Math.floor(score).toString().padStart(4, '0');
        scoreEl.innerText = displayScore;

        // Speed ramp up
        if (Math.floor(score) % 100 === 0 && Math.floor(score) > 0) {
            gameSpeed += 0.2;
            speedEl.innerText = Math.floor(gameSpeed).toString().padStart(2, '0');
        }
    }

    // --- GAME CONTROL ---
    function startGame() {
        isPlaying = true;
        isGameOver = false;
        score = 0;
        gameSpeed = BASE_SPEED;
        dinoY = 0;
        dinoVelocity = 0;
        obstacles.forEach(o => o.el.remove());
        obstacles = [];
        
        overlay.classList.add('hidden');
        dino.classList.add('running');
    }

    function triggerGameOver() {
        isGameOver = true;
        isPlaying = false;
        dino.classList.remove('running');
        dino.classList.remove('jumping');
        
        overlayTitle.innerText = "CRASHED";
        overlayTitle.style.color = "var(--neon-pink)";
        overlaySub.innerText = "PRESS SPACE TO RETRY";
        overlay.classList.remove('hidden');
    }

    // --- INPUT ---
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            if (!isPlaying && !isGameOver) {
                startGame();
            } else if (isGameOver) {
                startGame();
            } else {
                jump();
            }
        }
    });

    // Start Loop
    requestAnimationFrame(loop);

</script>
</body>
</html>
