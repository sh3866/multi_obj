<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alpine Cyberpunk: Descent</title>
    <style>
        :root {
            --bg-dark: #050510;
            --bg-indigo: #1e1b4b;
            --neon-cyan: #00f3ff;
            --neon-orange: #ff9100;
            --neon-red: #ff003c;
            --ui-bg: rgba(10, 15, 30, 0.85);
            --font-ui: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-dark);
            font-family: var(--font-ui);
            color: #ffffff;
        }

        /* 1. ENVIRONMENT & ATMOSPHERE */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            /* Deep indigo-to-black radial gradient (Night Sky) */
            background: radial-gradient(circle at 50% 40%, #1e1b4b 0%, #0f172a 40%, #000000 100%);
            overflow: hidden;
        }

        /* Topographic Grid Overlay (Peripheral) */
        .topo-grid {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 100px 100px;
            transform: perspective(400px) rotateX(60deg);
            transform-origin: center top;
            animation: gridMove 20s linear infinite;
            z-index: 0;
            pointer-events: none;
            mask-image: radial-gradient(circle at center, transparent 30%, black 100%);
            -webkit-mask-image: radial-gradient(circle at center, transparent 30%, black 100%);
        }

        @keyframes gridMove {
            0% { transform: perspective(400px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(400px) rotateX(60deg) translateY(100px); }
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 6. TUNNEL VISION (Vignette) */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 5;
        }

        /* UI LAYER */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }

        /* 5. HUD & UI (Hierarchy & Harmony) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            margin-top: 10px;
        }

        .hud-box {
            background: var(--ui-bg);
            border-left: 4px solid var(--neon-cyan); /* Sharp angular accent */
            padding: 8px 16px;
            display: flex;
            flex-direction: column;
            min-width: 120px;
            clip-path: polygon(0 0, 100% 0, 100% 80%, 90% 100%, 0 100%);
        }

        .hud-box.dist {
            border-left: none;
            border-right: 4px solid var(--neon-orange);
            align-items: flex-end;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 10% 100%, 0 80%);
        }

        .hud-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 700;
            margin-bottom: 2px;
        }

        .hud-value {
            font-size: 36px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            color: #ffffff;
        }

        .hud-unit {
            font-size: 12px;
            font-weight: 600;
            margin-left: 4px;
            opacity: 0.5;
            vertical-align: super;
        }

        .speed-val { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0, 243, 255, 0.4); }
        .dist-val { color: var(--neon-orange); text-shadow: 0 0 10px rgba(255, 145, 0, 0.4); }

        /* Progress Bar */
        .progress-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-orange));
            width: 0%;
            transition: width 0.2s linear;
        }

        /* Controls */
        .controls-area {
            display: flex;
            justify-content: space-between; /* Space between Control Zone and nothing (right is empty) */
            align-items: flex-end;
            padding-bottom: 20px;
            pointer-events: auto;
        }

        .control-zone {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            background: var(--ui-bg);
            border: 1px solid rgba(255,255,255,0.1);
            /* Sharp corners */
            clip-path: polygon(10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%, 0 10%);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.1s ease;
        }

        .control-btn svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
            opacity: 0.7;
        }

        .control-btn:active, .control-btn.active {
            background: rgba(0, 243, 255, 0.2);
            border-color: var(--neon-cyan);
            transform: scale(0.95);
        }
        
        .control-btn:active svg, .control-btn.active svg {
            fill: var(--neon-cyan);
            opacity: 1;
            filter: drop-shadow(0 0 5px var(--neon-cyan));
        }

        /* Brake Button styling */
        .brake-btn {
            width: 80px;
            height: 60px;
            background: rgba(255, 0, 60, 0.1);
            border: 1px solid rgba(255, 0, 60, 0.3);
            clip-path: polygon(0 0, 90% 0, 100% 100%, 10% 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--neon-red);
            transition: all 0.1s;
        }

        .brake-btn:active, .brake-btn.active {
            background: var(--neon-red);
            color: #fff;
            box-shadow: 0 0 15px var(--neon-red);
        }

    </style>
</head>
<body>

<div id="game-container">
    <!-- 1. ENVIRONMENT: Topo Grid -->
    <div class="topo-grid"></div>
    
    <!-- Canvas -->
    <canvas id="gameCanvas"></canvas>
    
    <!-- 6. TUNNEL VISION -->
    <div class="vignette"></div>

    <div class="ui-layer">
        <!-- TOP HUD -->
        <div class="top-bar">
            <!-- Speed Box -->
            <div class="hud-box">
                <span class="hud-label">Velocity</span>
                <div class="hud-value">
                    <span id="speedDisplay" class="speed-val">0</span><span class="hud-unit">KM/H</span>
                </div>
            </div>

            <!-- Distance Box -->
            <div class="hud-box dist">
                <span class="hud-label">Distance</span>
                <div class="hud-value">
                    <span id="distDisplay" class="dist-val">0.0</span><span class="hud-unit">KM</span>
                </div>
            </div>
        </div>

        <!-- PROGRESS -->
        <div class="progress-container">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <!-- BOTTOM CONTROLS -->
        <div class="controls-area">
            <!-- Unified Control Zone (Left) -->
            <div class="control-zone">
                <div class="brake-btn" id="btnBrake">
                    BRAKE
                </div>
                <div class="control-btn" id="btnLeft">
                    <svg viewBox="0 0 24 24">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                    </svg>
                </div>
                <div class="control-btn" id="btnRight">
                    <svg viewBox="0 0 24 24">
                        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                    </svg>
                </div>
            </div>
            
            <!-- Right side empty for balance -->
            <div></div>
        </div>
    </div>
</div>

<script>
    /**
     * ALPINE CYBERPUNK ENGINE
     * Revised for: Ribbon Tracks, Geometric Hazards, Silhouette Rider
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    // UI Elements
    const speedDisplay = document.getElementById('speedDisplay');
    const distDisplay = document.getElementById('distDisplay');
    const progressBar = document.getElementById('progressBar');
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnBrake = document.getElementById('btnBrake');

    // State
    let width, height;
    let cx, cy;
    let frame = 0;
    
    const state = {
        speed: 0,
        targetSpeed: 160, // Increased for "Fast" sensation
        distance: 0,
        playerX: 0, // -1 to 1
        playerTilt: 0,
        isBraking: false,
        roadWidth: 2400, 
        cameraHeight: 900, 
        fov: 80, 
        drawDistance: 9000,
        shake: 0,
        horizonY: 0
    };

    const input = {
        left: false,
        right: false,
        brake: false
    };

    // World Objects
    const world = {
        obstacles: [],
        particles: [] // Speed streaks
    };

    // --- Initialization ---

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        const dpr = Math.min(window.devicePixelRatio, 2);
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(dpr, dpr);
        cx = width / 2;
        cy = height / 2;
        state.horizonY = height * 0.38; 
    }

    function init() {
        resize();
        window.addEventListener('resize', resize);
        setupInputs();
        generateWorld();
        requestAnimationFrame(loop);
    }

    function generateWorld() {
        for(let i=0; i<80; i++) {
            const r = Math.random();
            let type = 'tree';
            if (r > 0.7) type = 'rock';
            
            // Lanes: -1 (Left), 0 (Center), 1 (Right) roughly
            const lane = (Math.floor(Math.random() * 3) - 1) * (state.roadWidth * 0.35);
            // Add some randomness to lane position
            const jitter = (Math.random() - 0.5) * 400;

            world.obstacles.push({
                z: 500 + i * 350 + Math.random() * 100,
                x: lane + jitter,
                type: type,
                color: '#ff9100' // Warning Orange
            });
        }
    }

    // --- Input Handling ---

    function setupInputs() {
        document.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft') input.left = true;
            if(e.key === 'ArrowRight') input.right = true;
            if(e.key === 'ArrowDown' || e.key === ' ') input.brake = true;
        });
        document.addEventListener('keyup', (e) => {
            if(e.key === 'ArrowLeft') input.left = false;
            if(e.key === 'ArrowRight') input.right = false;
            if(e.key === 'ArrowDown' || e.key === ' ') input.brake = false;
        });

        const addTouch = (elem, key) => {
            const start = (e) => { 
                if(e.cancelable) e.preventDefault(); 
                input[key] = true; 
                elem.classList.add('active'); 
            };
            const end = (e) => { 
                if(e.cancelable) e.preventDefault(); 
                input[key] = false; 
                elem.classList.remove('active'); 
            };
            elem.addEventListener('mousedown', start);
            elem.addEventListener('mouseup', end);
            elem.addEventListener('mouseleave', end);
            elem.addEventListener('touchstart', start, {passive: false});
            elem.addEventListener('touchend', end, {passive: false});
        };

        addTouch(btnLeft, 'left');
        addTouch(btnRight, 'right');
        addTouch(btnBrake, 'brake');
    }

    // --- Rendering Helpers ---

    function project(x, y, z) {
        const scale = state.fov / (state.fov + z);
        const x2d = (x * scale) + cx;
        const y2d = (state.horizonY + (state.cameraHeight * scale));
        return { x: x2d, y: y2d, scale: scale };
    }

    function drawEnvironment() {
        // 2. THE TRACK: Glowing Ribbons
        const trackLeft = -state.roadWidth / 2;
        const trackRight = state.roadWidth / 2;

        // Draw Left Ribbon
        ctx.beginPath();
        // Gradient for ribbon
        const gradLeft = ctx.createLinearGradient(0, state.horizonY, 0, height);
        gradLeft.addColorStop(0, 'rgba(0, 243, 255, 0.0)');
        gradLeft.addColorStop(0.5, 'rgba(0, 243, 255, 0.15)');
        gradLeft.addColorStop(1, 'rgba(0, 243, 255, 0.4)');
        ctx.fillStyle = gradLeft;
        
        for(let z=0; z<state.drawDistance; z+=150) {
            const p = project(trackLeft - 100, 0, z); // Width of ribbon
            const p2 = project(trackLeft, 0, z);
            if(z===0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        }
        for(let z=state.drawDistance; z>=0; z-=150) {
            const p = project(trackLeft, 0, z);
            ctx.lineTo(p.x, p.y);
        }
        ctx.fill();

        // Draw Right Ribbon
        ctx.beginPath();
        for(let z=0; z<state.drawDistance; z+=150) {
            const p = project(trackRight, 0, z);
            if(z===0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        }
        for(let z=state.drawDistance; z>=0; z-=150) {
            const p = project(trackRight + 100, 0, z);
            ctx.lineTo(p.x, p.y);
        }
        ctx.fillStyle = gradLeft; // Reuse gradient
        ctx.fill();

        // Center dashed line (faint)
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 2;
        ctx.shadowBlur = 0;
        ctx.setLineDash([40, 60]);
        ctx.beginPath();
        for(let z=0; z<state.drawDistance; z+=100) {
            const p = project(0, 0, z);
            if(z===0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        ctx.setLineDash([]);
    }

    function drawObstacle(obs) {
        let z = obs.z - (frame * state.speed * 2);
        const loopLen = 32000;
        z = z % loopLen;
        if (z < 10) z += loopLen;
        
        const relX = obs.x - (state.playerX * state.roadWidth/2);
        const p = project(relX, 0, z);
        
        if (p.scale <= 0 || z > state.drawDistance) return;

        const size = 800 * p.scale; 

        // 3. OBSTACLES: Readability & Identity
        // High-visibility neon outline
        ctx.strokeStyle = obs.color;
        ctx.lineWidth = Math.max(1, 2 * p.scale * 2);
        ctx.shadowBlur = 10;
        ctx.shadowColor = obs.color;

        if (obs.type === 'tree') {
            // Jagged Polygon (Pine Tree)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)'; // Dark interior
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - size * 1.5); // Top
            ctx.lineTo(p.x + size * 0.4, p.y); // Right Bottom
            ctx.lineTo(p.x - size * 0.4, p.y); // Left Bottom
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Inner detail for silhouette
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - size * 1.5);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();

        } else {
            // Blocky Rock
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            const rockH = size * 0.6;
            const rockW = size * 0.8;
            const yPos = p.y - rockH;
            
            ctx.beginPath();
            ctx.rect(p.x - rockW/2, yPos, rockW, rockH);
            ctx.fill();
            ctx.stroke();
        }
        ctx.shadowBlur = 0;
    }

    function drawPlayer() {
        // 4. RIDER: Polish & Motion
        // Anchor slightly higher to show depth
        const anchorY = height - 40; 
        const anchorX = cx + (state.playerX * 140);

        const shakeX = (Math.random() - 0.5) * state.shake;
        const shakeY = (Math.random() - 0.5) * state.shake;

        ctx.save();
        ctx.translate(anchorX + shakeX, anchorY + shakeY);
        ctx.rotate(state.playerTilt * 0.5); 

        // 6. SPEED EFFECTS: Motion Trail (Speed Lines)
        if (state.speed > 20) {
            ctx.globalAlpha = 0.3;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            for(let i=0; i<5; i++) {
                const lx = (Math.random() - 0.5) * 100;
                const ly = -20 - (Math.random() * 100);
                ctx.beginPath();
                ctx.moveTo(lx, ly);
                ctx.lineTo(lx, ly - (state.speed * 0.5)); // Lines stretch backwards
                ctx.stroke();
            }
            ctx.globalAlpha = 1.0;
        }

        // Draw Rider Silhouette
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#00f3ff';
        ctx.fillStyle = '#020617'; // Solid silhouette color

        // Snowboard/Skis
        ctx.beginPath();
        ctx.moveTo(-35, -10);
        ctx.lineTo(35, -10);
        ctx.lineTo(40, 0);
        ctx.lineTo(-40, 0);
        ctx.fill();

        // Body (Dynamic Pose)
        ctx.beginPath();
        // Head
        ctx.arc(0, -65, 12, 0, Math.PI*2);
        // Torso (leaning forward)
        ctx.moveTo(-15, -55);
        ctx.lineTo(15, -55);
        ctx.lineTo(20, -30);
        ctx.lineTo(-20, -30);
        ctx.fill();

        // Goggles (Neon accent on silhouette)
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#00f3ff';
        ctx.fillRect(-10, -68, 20, 6);

        ctx.restore();
    }

    function drawSpeedStreaks() {
        // 6. SPEED EFFECTS: Vertical Particles
        if (state.speed > 10) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            for(let i=0; i<3; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                const len = state.speed * 0.5;
                ctx.fillRect(x, y, 1, len);
            }
        }
    }

    // --- Main Loop ---

    function update() {
        if (input.brake) {
            state.targetSpeed = Math.max(10, state.targetSpeed - 8);
            state.isBraking = true;
        } else {
            state.targetSpeed = Math.min(160, state.targetSpeed + 2);
            state.isBraking = false;
        }
        
        state.speed += (state.targetSpeed - state.speed) * 0.05;

        const steerSpeed = 0.04;
        if (input.left) {
            state.playerX = Math.max(-1, state.playerX - steerSpeed);
            state.playerTilt = Math.max(-0.6, state.playerTilt - 0.05);
        } else if (input.right) {
            state.playerX = Math.min(1, state.playerX + steerSpeed);
            state.playerTilt = Math.min(0.6, state.playerTilt + 0.05);
        } else {
            state.playerTilt += (0 - state.playerTilt) * 0.1;
        }

        // Shake based on speed
        state.shake = Math.max(0, (state.speed - 40) / 8);
        
        state.distance += state.speed * 0.0008;
        
        speedDisplay.innerText = Math.floor(state.speed);
        distDisplay.innerText = state.distance.toFixed(1);
        progressBar.style.width = ((state.distance % 5) / 5 * 100) + '%';
        
        frame++;
    }

    function loop() {
        ctx.clearRect(0, 0, width, height);

        update();

        // Draw Environment
        drawEnvironment();

        // Z-Sort Obstacles
        const renderList = [];
        world.obstacles.forEach(obs => {
            let z = obs.z - (frame * state.speed * 2);
            const loopLen = 32000;
            z = z % loopLen;
            if (z < 0) z += loopLen;
            renderList.push({ z: z, obj: obs });
        });

        // Sort back to front
        renderList.sort((a, b) => b.z - a.z);

        renderList.forEach(item => {
            drawObstacle(item.obj);
        });

        drawPlayer();
        drawSpeedStreaks();

        requestAnimationFrame(loop);
    }

    init();

</script>
</body>
</html>
