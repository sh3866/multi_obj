<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alpine Rush: Velocity</title>
    <style>
        :root {
            --glass-bg: rgba(15, 23, 42, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-cyan: #06b6d4;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --text-white: #f8fafc;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020617; /* Fallback */
            font-family: var(--font-ui);
            color: var(--text-white);
        }

        /* 1. UNIFY PERSPECTIVE & ENVIRONMENT (CSS Backgrounds) */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #020617 0%, #0f172a 40%, #1e293b 100%);
        }

        /* Simulated rushing snow texture via CSS repeating gradient */
        .snow-texture {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background-image: repeating-linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.03) 0px,
                rgba(255, 255, 255, 0.03) 2px,
                transparent 2px,
                transparent 20px
            );
            background-size: 100% 100%;
            background-position: 0 0;
            pointer-events: none;
            z-index: 1;
            opacity: 0.5;
            animation: rushSnow 0.2s linear infinite;
        }

        @keyframes rushSnow {
            from { background-position: 0 0; }
            to { background-position: 0 40px; }
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /* 4. STANDARDIZE UI GRAMMAR (Glassmorphism) */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }

        /* HUD */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .hud-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 8px 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            min-width: 100px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .hud-box.dist {
            align-items: flex-end;
        }

        .hud-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 600;
            margin-bottom: 2px;
        }

        .hud-value {
            font-size: 28px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            color: var(--text-white);
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .hud-unit {
            font-size: 12px;
            font-weight: 700;
            margin-left: 4px;
        }

        /* Neon Accents for Values */
        .speed-val { color: var(--accent-cyan); }
        .dist-val { color: var(--accent-orange); }

        /* Progress Bar */
        .progress-container {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 4px;
            background: rgba(0,0,0,0.3);
            border-radius: 2px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-cyan);
            width: 0%;
            box-shadow: 0 0 10px var(--accent-cyan);
            transition: width 0.1s linear;
        }

        /* Controls */
        .controls-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 20px;
            padding-left: 20px;
            padding-right: 20px;
            pointer-events: auto;
        }

        .steering-group {
            display: flex;
            gap: 12px;
        }

        .control-btn {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.1s ease;
        }

        .control-btn svg {
            width: 24px;
            height: 24px;
            fill: var(--accent-cyan);
            filter: drop-shadow(0 0 2px var(--accent-cyan));
        }

        .control-btn:active, .control-btn.active {
            background: rgba(6, 182, 212, 0.2);
            border-color: var(--accent-cyan);
            transform: scale(0.95);
        }

        .brake-btn {
            width: 70px;
            height: 56px;
            border-radius: 16px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: var(--accent-red);
            font-weight: 800;
            font-size: 12px;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.1s;
        }

        .brake-btn:active, .brake-btn.active {
            background: var(--accent-red);
            color: white;
            box-shadow: 0 0 15px var(--accent-red);
        }

        /* Noise Overlay */
        .noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            z-index: 5;
        }

    </style>
</head>
<body>

<div id="game-container">
    <div class="snow-texture"></div>
    <canvas id="gameCanvas"></canvas>
    <div class="noise"></div>

    <div class="ui-layer">
        <!-- TOP HUD -->
        <div class="top-bar">
            <!-- Speed Box -->
            <div class="hud-box">
                <span class="hud-label">Speed</span>
                <div class="hud-value">
                    <span id="speedDisplay" class="speed-val">0</span><span class="hud-unit">KM/H</span>
                </div>
            </div>

            <!-- Distance Box -->
            <div class="hud-box dist">
                <span class="hud-label">Distance</span>
                <div class="hud-value">
                    <span id="distDisplay" class="dist-val">0.0</span><span class="hud-unit">KM</span>
                </div>
            </div>
        </div>

        <!-- PROGRESS -->
        <div class="progress-container">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <!-- BOTTOM CONTROLS -->
        <div class="controls-area">
            <div class="steering-group">
                <div class="control-btn" id="btnLeft">
                    <svg viewBox="0 0 24 24">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                    </svg>
                </div>
                <div class="control-btn" id="btnRight">
                    <svg viewBox="0 0 24 24">
                        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                    </svg>
                </div>
            </div>
            
            <div class="brake-zone">
                <div class="brake-btn" id="btnBrake">
                    BRAKE
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    /**
     * ALPINE RUSH ENGINE - REVISED
     * Focus: Continuous Slope, Neon Obstacles, Dynamic Rider, Glass UI
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    // UI Elements
    const speedDisplay = document.getElementById('speedDisplay');
    const distDisplay = document.getElementById('distDisplay');
    const progressBar = document.getElementById('progressBar');
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnBrake = document.getElementById('btnBrake');

    // State
    let width, height;
    let cx, cy;
    let frame = 0;
    
    const state = {
        speed: 0,
        targetSpeed: 144, // High velocity goal
        distance: 0,
        playerX: 0, // -1 to 1
        playerTilt: 0,
        isBraking: false,
        roadWidth: 2400, // Wider road
        cameraHeight: 600,
        fov: 120, // Wider FOV for immersion
        drawDistance: 6000,
        shake: 0,
        horizonY: 0 // Calculated dynamically
    };

    const input = {
        left: false,
        right: false,
        brake: false
    };

    // World Objects
    const world = {
        obstacles: [],
        particles: []
    };

    // --- Initialization ---

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        const dpr = Math.min(window.devicePixelRatio, 2);
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(dpr, dpr);
        cx = width / 2;
        cy = height / 2;
        // 1. UNIFY PERSPECTIVE: Horizon is effectively gone, but math needs a vanishing point
        // We place the vanishing point slightly above center to create the downhill slope illusion
        state.horizonY = height * 0.35; 
    }

    function init() {
        resize();
        window.addEventListener('resize', resize);
        setupInputs();
        generateWorld();
        requestAnimationFrame(loop);
    }

    function generateWorld() {
        // Generate a dense stream of obstacles
        for(let i=0; i<50; i++) {
            const type = Math.random() > 0.4 ? 'gate' : 'tree';
            // Random X position within road width
            const lane = (Math.random() * 2 - 1) * (state.roadWidth * 0.8); 
            
            world.obstacles.push({
                z: 200 + i * 300 + Math.random() * 100,
                x: lane,
                type: type,
                gateColor: Math.random() > 0.5 ? 'cyan' : 'orange' // Neon colors
            });
        }
    }

    // --- Input Handling ---

    function setupInputs() {
        document.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft') input.left = true;
            if(e.key === 'ArrowRight') input.right = true;
            if(e.key === 'ArrowDown' || e.key === ' ') input.brake = true;
        });
        document.addEventListener('keyup', (e) => {
            if(e.key === 'ArrowLeft') input.left = false;
            if(e.key === 'ArrowRight') input.right = false;
            if(e.key === 'ArrowDown' || e.key === ' ') input.brake = false;
        });

        const addTouch = (elem, key) => {
            const start = (e) => { 
                if(e.cancelable) e.preventDefault(); 
                input[key] = true; 
                elem.classList.add('active'); 
            };
            const end = (e) => { 
                if(e.cancelable) e.preventDefault(); 
                input[key] = false; 
                elem.classList.remove('active'); 
            };
            elem.addEventListener('mousedown', start);
            elem.addEventListener('mouseup', end);
            elem.addEventListener('mouseleave', end);
            elem.addEventListener('touchstart', start, {passive: false});
            elem.addEventListener('touchend', end, {passive: false});
        };

        addTouch(btnLeft, 'left');
        addTouch(btnRight, 'right');
        addTouch(btnBrake, 'brake');
    }

    // --- Rendering Helpers ---

    function project(x, y, z) {
        // Perspective projection
        // Camera is at (0, cameraHeight, 0)
        // World floor is at y=0. 
        const scale = state.fov / (state.fov + z);
        
        const x2d = (x * scale) + cx;
        // Map Y from 0 (floor) to horizonY
        const y2d = (state.horizonY + (state.cameraHeight * scale));
        
        return { x: x2d, y: y2d, scale: scale };
    }

    function drawEnvironment() {
        // CSS handles the background gradient and rushing snow lines.
        // Canvas draws the track and objects.
        
        // Draw Track Edges (Neon Glowing Lines)
        const trackLeft = -state.roadWidth / 2;
        const trackRight = state.roadWidth / 2;

        ctx.lineCap = 'round';
        
        // Left Line
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(6, 182, 212, 0.4)'; // Cyan dim
        ctx.lineWidth = 4;
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'rgba(6, 182, 212, 0.8)';
        
        for(let z=0; z<state.drawDistance; z+=200) {
            const p = project(trackLeft, 0, z);
            if(z===0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();

        // Right Line
        ctx.beginPath();
        for(let z=0; z<state.drawDistance; z+=200) {
            const p = project(trackRight, 0, z);
            if(z===0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        
        ctx.shadowBlur = 0; // Reset
    }

    function drawObstacle(obs) {
        // Loop logic
        let z = obs.z - (frame * state.speed * 2);
        if (z < 10) z += 15000; // Recycle far away
        
        // Player offset for parallax
        const relX = obs.x - (state.playerX * state.roadWidth/2);
        const p = project(relX, 0, z);
        
        if (p.scale <= 0 || z > state.drawDistance) return;

        const size = 400 * p.scale; // Base size unit

        if (obs.type === 'gate') {
            // 2. POPULATE PLAYFIELD: Neon Gates
            const color = obs.gateColor === 'cyan' ? '#06b6d4' : '#f97316'; // Cyan or Orange
            
            ctx.lineWidth = 12 * p.scale;
            ctx.lineCap = 'round';
            ctx.strokeStyle = color;
            ctx.shadowBlur = 20;
            ctx.shadowColor = color;
            
            // Draw Arch
            ctx.beginPath();
            // Left post
            ctx.moveTo(p.x - size * 0.8, p.y);
            ctx.lineTo(p.x - size * 0.8, p.y - size);
            // Arch Top
            ctx.quadraticCurveTo(p.x, p.y - size * 1.4, p.x + size * 0.8, p.y - size);
            // Right post
            ctx.lineTo(p.x + size * 0.8, p.y);
            ctx.stroke();
            
            // Inner Glow Banner
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.2;
            ctx.beginPath();
            ctx.moveTo(p.x - size * 0.8, p.y);
            ctx.lineTo(p.x - size * 0.8, p.y - size);
            ctx.quadraticCurveTo(p.x, p.y - size * 1.4, p.x + size * 0.8, p.y - size);
            ctx.lineTo(p.x + size * 0.8, p.y);
            ctx.fill();
            ctx.globalAlpha = 1.0;
            
        } else {
            // 2. POPULATE PLAYFIELD: Trees (CSS shapes via Canvas paths)
            // Dark silhouette against the slope
            ctx.fillStyle = '#020617';
            ctx.shadowBlur = 0;
            
            // Draw Triangle Tree
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - size * 1.5); // Top
            ctx.lineTo(p.x - size * 0.4, p.y); // Bottom Left
            ctx.lineTo(p.x + size * 0.4, p.y); // Bottom Right
            ctx.fill();
            
            // Snow Cap
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - size * 1.5);
            ctx.lineTo(p.x - size * 0.15, p.y - size * 1.2);
            ctx.lineTo(p.x + size * 0.15, p.y - size * 1.2);
            ctx.fill();
        }
        ctx.shadowBlur = 0;
    }

    function drawPlayer() {
        // 5. HIERARCHY ADJUSTMENT: Scale up significantly
        const anchorY = height - 40; // Anchor at bottom
        const anchorX = cx + (state.playerX * 150);

        // Screen Shake
        const shakeX = (Math.random() - 0.5) * state.shake;
        const shakeY = (Math.random() - 0.5) * state.shake;

        ctx.save();
        ctx.translate(anchorX + shakeX, anchorY + shakeY);
        ctx.rotate(state.playerTilt * 0.5); // Lean

        // 3. REDESIGN RIDER ASSET
        
        // Speed Trail / Motion Blur
        if(state.speed > 20) {
            const trailLength = state.speed * 0.8;
            const grad = ctx.createLinearGradient(0, 0, 0, trailLength);
            grad.addColorStop(0, 'rgba(255,255,255,0.4)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(-15, -40);
            ctx.lineTo(15, -40);
            ctx.lineTo(40, trailLength);
            ctx.lineTo(-40, trailLength);
            ctx.fill();
        }

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.beginPath();
        ctx.ellipse(state.playerTilt * 10, 10, 50, 15, 0, 0, Math.PI*2);
        ctx.fill();

        // Skis (Silver)
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 12;
        ctx.lineCap = 'round';
        
        // Left Ski
        ctx.beginPath();
        ctx.moveTo(-20, -30);
        ctx.lineTo(-50, 20);
        ctx.stroke();
        
        // Right Ski
        ctx.beginPath();
        ctx.moveTo(20, -30);
        ctx.lineTo(50, 20);
        ctx.stroke();

        // Boots
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.moveTo(-20, -30);
        ctx.lineTo(20, -30);
        ctx.lineTo(25, -10);
        ctx.lineTo(-25, -10);
        ctx.fill();

        // 3. REDESIGN RIDER ASSET: Tuck Pose
        // Legs (Dark Blue)
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.moveTo(-30, -20); // Hip L
        ctx.lineTo(30, -20); // Hip R
        ctx.lineTo(25, -60); // Knee R
        ctx.lineTo(-25, -60); // Knee L
        ctx.fill();

        // Torso (Red Jacket)
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        // Shoulders
        ctx.moveTo(-35, -60);
        ctx.lineTo(35, -60);
        // Hips
        ctx.lineTo(30, -20);
        ctx.lineTo(-30, -20);
        ctx.fill();
        
        // Head/Helmet (White)
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, -85, 22, 0, Math.PI*2);
        ctx.fill();
        
        // Goggles (Cyan Glow)
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-15, -90, 30, 10);
        ctx.fillStyle = '#22d3ee'; 
        ctx.shadowBlur = 5;
        ctx.shadowColor = '#22d3ee';
        ctx.fillRect(-12, -88, 24, 6);
        ctx.shadowBlur = 0;

        // Spray Particles
        if (state.speed > 40) {
            ctx.fillStyle = '#fff';
            for(let i=0; i<8; i++) {
                const px = (Math.random() - 0.5) * 80;
                const py = Math.random() * 40;
                const ps = Math.random() * 6;
                ctx.beginPath();
                ctx.arc(px, py, ps, 0, Math.PI*2);
                ctx.fill();
            }
        }

        ctx.restore();
    }

    // --- Main Loop ---

    function update() {
        // Physics
        if (input.brake) {
            state.targetSpeed = Math.max(10, state.targetSpeed - 4);
            state.isBraking = true;
        } else {
            state.targetSpeed = Math.min(144, state.targetSpeed + 0.8); // Accelerate to 144
            state.isBraking = false;
        }
        
        // Smooth speed transition
        state.speed += (state.targetSpeed - state.speed) * 0.05;

        // Steering
        const steerSpeed = 0.035;
        if (input.left) {
            state.playerX = Math.max(-1, state.playerX - steerSpeed);
            state.playerTilt = Math.max(-0.7, state.playerTilt - 0.05);
        } else if (input.right) {
            state.playerX = Math.min(1, state.playerX + steerSpeed);
            state.playerTilt = Math.min(0.7, state.playerTilt + 0.05);
        } else {
            state.playerTilt += (0 - state.playerTilt) * 0.1;
        }

        // Shake increases with speed
        state.shake = Math.max(0, (state.speed - 80) / 15);
        
        // Distance calculation
        state.distance += state.speed * 0.0008;
        
        // UI Updates
        speedDisplay.innerText = Math.floor(state.speed);
        distDisplay.innerText = state.distance.toFixed(1);
        progressBar.style.width = ((state.distance % 5) / 5 * 100) + '%'; // Reset every 5km
        
        frame++;
    }

    function loop() {
        ctx.clearRect(0, 0, width, height);

        update();

        // Draw Environment
        drawEnvironment();

        // Render List for Z-sorting
        // We only draw obstacles now, as trees are also obstacles in this simplified model
        // Sort by Z descending (draw far first)
        const renderList = [];
        
        world.obstacles.forEach(obs => {
            let z = obs.z - (frame * state.speed * 2);
            // Normalize Z for infinite loop
            const loopLen = 15000;
            z = z % loopLen;
            if (z < 0) z += loopLen;
            
            renderList.push({ z: z, obj: obs });
        });

        renderList.sort((a, b) => b.z - a.z);

        renderList.forEach(item => {
            drawObstacle(item.obj);
        });

        drawPlayer();

        // Vignette for depth
        const grad = ctx.createRadialGradient(cx, cy, height/2, cx, cy, height);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(0.8, 'rgba(0,0,0,0.2)');
        grad.addColorStop(1, 'rgba(0,0,0,0.8)');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,width,height);

        requestAnimationFrame(loop);
    }

    init();

</script>
</body>
</html>
