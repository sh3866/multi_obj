<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alpine Rush: Velocity</title>
    <style>
        :root {
            --glass-bg: rgba(15, 23, 42, 0.4);
            --glass-border: rgba(255, 255, 255, 0.15);
            --accent-cyan: #22d3ee;
            --accent-red: #f43f5e;
            --text-white: #f8fafc;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-digital: "Courier New", Courier, monospace; /* Fallback for digital look */
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
            font-family: var(--font-ui);
            color: var(--text-white);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI OVERLAYS */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            z-index: 10;
        }

        /* TOP HUD - DIEGETIC STYLE */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-top: 10px;
        }

        .hud-box {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 8px 14px;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            min-width: 110px;
        }

        /* Frosty/Glitch aesthetic lines */
        .hud-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: rgba(255,255,255,0.3);
        }

        .hud-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 700;
            margin-bottom: 2px;
        }

        .hud-value-row {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .hud-value {
            font-size: 24px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            font-family: var(--font-digital);
            letter-spacing: -1px;
            text-shadow: 0 0 10px rgba(34, 211, 238, 0.5);
        }

        .hud-unit {
            font-size: 10px;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        .value-speed { color: var(--text-white); }
        .value-dist { color: var(--text-white); }

        /* PROGRESS BAR - COMPACT */
        .progress-container {
            position: absolute;
            top: 85px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 4px;
            background: rgba(0,0,0,0.4);
            border-radius: 2px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-cyan);
            width: 30%;
            box-shadow: 0 0 8px var(--accent-cyan);
            transition: width 0.1s linear;
        }

        /* BOTTOM CONTROLS - FROSTED GLASS */
        .controls-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 10px;
            padding-left: 20px;
            padding-right: 20px;
            pointer-events: auto;
        }

        .glass-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 90px;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0));
            pointer-events: none;
            z-index: -1;
        }

        .steering-group {
            display: flex;
            gap: 20px;
        }

        .control-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.1s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .control-btn svg {
            width: 32px;
            height: 32px;
            fill: rgba(255, 255, 255, 0.9);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .control-btn:active, .control-btn.active {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0.92);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .brake-btn {
            width: 80px;
            height: 80px;
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.4);
            color: #fff;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1px;
            border-radius: 16px; /* Squircle */
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.2);
        }

        .brake-btn:active, .brake-btn.active {
            background: var(--accent-red);
            box-shadow: 0 0 25px rgba(244, 63, 94, 0.6);
            border-color: #fff;
        }

        /* GRAIN OVERLAY */
        .noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.06;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            z-index: 5;
        }

    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="noise"></div>

    <div class="ui-layer">
        <!-- TOP HUD -->
        <div class="top-bar">
            <!-- Speed Box -->
            <div class="hud-box">
                <span class="hud-label">Velocity</span>
                <div class="hud-value-row">
                    <span class="hud-value value-speed" id="speedDisplay">84</span>
                    <span class="hud-unit">KM/H</span>
                </div>
            </div>

            <!-- Distance Box -->
            <div class="hud-box" style="align-items: flex-end;">
                <span class="hud-label">Distance</span>
                <div class="hud-value-row">
                    <span class="hud-value value-dist" id="distDisplay">12.4</span>
                    <span class="hud-unit">KM</span>
                </div>
            </div>
        </div>

        <!-- PROGRESS -->
        <div class="progress-container">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <!-- BOTTOM CONTROLS -->
        <div class="controls-area">
            <div class="steering-group">
                <div class="control-btn" id="btnLeft">
                    <svg viewBox="0 0 24 24">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                    </svg>
                </div>
                <div class="control-btn" id="btnRight">
                    <svg viewBox="0 0 24 24">
                        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                    </svg>
                </div>
            </div>
            
            <div class="control-btn brake-btn" id="btnBrake">
                BRAKE
            </div>
        </div>
        
        <div class="glass-bar"></div>
    </div>
</div>

<script>
    /**
     * ALPINE RUSH ENGINE - REVISED
     * Focus: Visuals, Speed, Perspective, Rider Anchor
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    // UI Elements
    const speedDisplay = document.getElementById('speedDisplay');
    const distDisplay = document.getElementById('distDisplay');
    const progressBar = document.getElementById('progressBar');
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnBrake = document.getElementById('btnBrake');

    // State
    let width, height;
    let cx, cy;
    let frame = 0;
    
    const state = {
        speed: 84,
        targetSpeed: 109, // Start fast per prompt
        distance: 12.4,
        playerX: 0, // -1 to 1
        playerTilt: 0,
        isBraking: false,
        roadWidth: 2200,
        segmentLength: 150, // Shorter segments for smoother floor
        cameraHeight: 900, // Lower camera for more immersion
        fov: 110,
        drawDistance: 4000,
        shake: 0
    };

    const input = {
        left: false,
        right: false,
        brake: false
    };

    // World Objects
    const world = {
        trees: [],
        obstacles: []
    };

    // --- Initialization ---

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        // Handle HiDPI
        const dpr = Math.min(window.devicePixelRatio, 2);
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(dpr, dpr);
        cx = width / 2;
        cy = height / 2;
    }

    function init() {
        resize();
        window.addEventListener('resize', resize);
        setupInputs();
        generateWorld();
        requestAnimationFrame(loop);
    }

    function generateWorld() {
        // Dense trees
        for(let i=0; i<80; i++) {
            world.trees.push({
                z: Math.random() * 6000,
                x: (Math.random() * 2 - 1) * 6000, // Wide spread
                scale: Math.random() * 0.5 + 0.8,
                type: Math.random() > 0.3 ? 'pine' : 'birch'
            });
        }
        // Gates and Rocks
        for(let i=0; i<30; i++) {
            world.obstacles.push({
                z: 500 + i * 300 + Math.random() * 100,
                x: (Math.random() * 2 - 1) * 1200,
                type: Math.random() > 0.4 ? 'gate' : 'rock',
                gateColor: Math.random() > 0.5 ? 'red' : 'blue'
            });
        }
    }

    // --- Input Handling ---

    function setupInputs() {
        document.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft') input.left = true;
            if(e.key === 'ArrowRight') input.right = true;
            if(e.key === 'ArrowDown' || e.key === ' ') input.brake = true;
        });
        document.addEventListener('keyup', (e) => {
            if(e.key === 'ArrowLeft') input.left = false;
            if(e.key === 'ArrowRight') input.right = false;
            if(e.key === 'ArrowDown' || e.key === ' ') input.brake = false;
        });

        const addTouch = (elem, key) => {
            const start = (e) => { 
                if(e.cancelable) e.preventDefault(); 
                input[key] = true; 
                elem.classList.add('active'); 
            };
            const end = (e) => { 
                if(e.cancelable) e.preventDefault(); 
                input[key] = false; 
                elem.classList.remove('active'); 
            };
            elem.addEventListener('mousedown', start);
            elem.addEventListener('mouseup', end);
            elem.addEventListener('mouseleave', end);
            elem.addEventListener('touchstart', start, {passive: false});
            elem.addEventListener('touchend', end, {passive: false});
        };

        addTouch(btnLeft, 'left');
        addTouch(btnRight, 'right');
        addTouch(btnBrake, 'brake');
    }

    // --- Rendering Helpers ---

    function project(x, y, z) {
        // Perspective projection
        // Z=0 is camera plane. We draw Z > 0.
        const scale = state.fov / (state.fov + z);
        
        // Center of screen is (cx, cy)
        // We offset Y to push horizon down slightly for the "slope" look
        const horizonOffset = height * 0.35; 
        
        const x2d = (x * scale) + cx;
        const y2d = ((y - state.cameraHeight) * scale) + horizonOffset;
        
        return { x: x2d, y: y2d, scale: scale };
    }

    function drawSky() {
        // Dramatic Alpine Gradient
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, '#020617'); // Deep Space Blue
        gradient.addColorStop(0.3, '#1e293b'); // Mountain Shadow
        gradient.addColorStop(0.6, '#38bdf8'); // Bright Sky
        gradient.addColorStop(1, '#e0f2fe'); // Ice Mist
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
    }

    function drawMountains() {
        // Parallax Mountains
        const horizonY = height * 0.35;
        
        // Far Layer (Slow)
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.moveTo(0, horizonY);
        for(let i=0; i<=width; i+=30) {
            const h = Math.sin(i * 0.002 + frame * 0.0001) * 60 + 
                      Math.cos(i * 0.01) * 30;
            ctx.lineTo(i, horizonY - h);
        }
        ctx.lineTo(width, horizonY);
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.fill();

        // Near Layer (Fast)
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.moveTo(0, horizonY);
        for(let i=0; i<=width; i+=20) {
            const h = Math.sin(i * 0.005 - frame * 0.005) * 40 + 
                      Math.cos(i * 0.02) * 20;
            ctx.lineTo(i, horizonY - h);
        }
        ctx.lineTo(width, horizonY);
        ctx.fill();
    }

    function drawSlope() {
        // The "Icy Slope" - filling the bottom
        const horizonY = height * 0.35;
        
        // Base Snow Gradient
        const grad = ctx.createLinearGradient(0, horizonY, 0, height);
        grad.addColorStop(0, '#cbd5e1'); // Distant snow
        grad.addColorStop(0.5, '#f1f5f9'); // Mid snow
        grad.addColorStop(1, '#ffffff'); // Close snow
        
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, horizonY);
        ctx.lineTo(width, horizonY);
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.fill();

        // Draw "Speed Lines" (Vertical Streaks)
        // These create the illusion of vertical motion
        ctx.save();
        ctx.globalCompositeOperation = 'overlay';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        
        const speedFactor = state.speed / 100;
        const numLines = 30;
        
        for(let i=0; i<numLines; i++) {
            // Random x position
            const lx = (Math.sin(i * 132.1) * width) + width/2;
            
            // Length depends on speed
            const length = (Math.random() * 100 + 50) * speedFactor;
            
            // Y position loops
            const ly = ((frame * state.speed * 2) + (i * 100)) % height;
            
            ctx.beginPath();
            ctx.moveTo(lx, ly);
            ctx.lineTo(lx, ly + length);
            ctx.lineWidth = Math.random() * 2;
            ctx.stroke();
        }
        ctx.restore();
    }

    function drawTrack() {
        const horizonY = height * 0.35;
        const trackLeft = -state.roadWidth / 2;
        const trackRight = state.roadWidth / 2;

        // Draw Track Surface (Slightly darker than snow to define path)
        ctx.save();
        ctx.beginPath();
        const p1 = project(trackLeft, 0, 10);
        const p2 = project(trackRight, 0, 10);
        const p3 = project(trackRight, 0, state.drawDistance);
        const p4 = project(trackLeft, 0, state.drawDistance);
        
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.lineTo(p4.x, p4.y);
        ctx.clip();

        // Track Texture (Grid lines)
        const offset = (frame * state.speed * 2) % state.segmentLength;
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.2)'; // Cyan tint
        ctx.lineWidth = 2;

        // Horizontal lines
        for (let z = state.drawDistance; z > 10; z -= state.segmentLength) {
            const drawZ = z - offset;
            if (drawZ < 10) continue;
            
            const pL = project(trackLeft, 0, drawZ);
            const pR = project(trackRight, 0, drawZ);
            
            ctx.beginPath();
            ctx.moveTo(pL.x, pL.y);
            ctx.lineTo(pR.x, pR.y);
            ctx.stroke();
        }

        // Glowing Edges
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#38bdf8';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        
        // Left Edge
        ctx.beginPath();
        for(let z=0; z<state.drawDistance; z+=200) {
            const p = project(trackLeft, 0, z);
            if(z===0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();

        // Right Edge
        ctx.beginPath();
        for(let z=0; z<state.drawDistance; z+=200) {
            const p = project(trackRight, 0, z);
            if(z===0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        
        ctx.restore();
    }

    function drawTree(tree) {
        // Calculate relative Z based on movement
        let z = tree.z - (frame * state.speed * 2);
        if(z < 0) z += 6000; // Loop
        if(z > 6000) z -= 6000;

        // Parallax X
        const parallaxX = tree.x - (state.playerX * 3000); 
        
        const p = project(parallaxX, 0, z);
        if (p.scale <= 0) return;

        const size = 300 * p.scale * tree.scale;
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, size/1.5, size/4, 0, 0, Math.PI*2);
        ctx.fill();

        // Tree Body
        ctx.fillStyle = '#0f172a'; // Dark Slate
        ctx.beginPath();
        // Pine shape
        ctx.moveTo(p.x, p.y - size);
        ctx.lineTo(p.x - size/2.5, p.y);
        ctx.lineTo(p.x + size/2.5, p.y);
        ctx.fill();
        
        // Snow on top
        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.moveTo(p.x, p.y - size);
        ctx.lineTo(p.x - size/6, p.y - size*0.7);
        ctx.lineTo(p.x + size/6, p.y - size*0.7);
        ctx.fill();
    }

    function drawObstacle(obs) {
        let z = obs.z - (frame * state.speed * 2);
        if (z < 10) z += 6000;
        
        const relX = obs.x - (state.playerX * state.roadWidth/2);
        const p = project(relX, 0, z);
        
        if (p.scale <= 0) return;

        const size = 180 * p.scale;

        if (obs.type === 'gate') {
            // Arch Shape
            ctx.lineWidth = 6 * p.scale;
            ctx.lineCap = 'round';
            
            const color = obs.gateColor === 'red' ? '#f43f5e' : '#3b82f6';
            ctx.strokeStyle = color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = color;
            
            ctx.beginPath();
            ctx.moveTo(p.x - size, p.y);
            ctx.lineTo(p.x - size, p.y - size * 1.2);
            ctx.quadraticCurveTo(p.x, p.y - size * 1.8, p.x + size, p.y - size * 1.2);
            ctx.lineTo(p.x + size, p.y);
            ctx.stroke();
            
            // Banner
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.3;
            ctx.fillRect(p.x - size, p.y - size * 1.2, size * 2, size * 0.6);
            ctx.globalAlpha = 1.0;
            
        } else {
            // Rock
            ctx.fillStyle = '#475569';
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(p.x, p.y - size/3, size/3, 0, Math.PI*2);
            ctx.fill();
            
            // Rock highlight
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.beginPath();
            ctx.arc(p.x - size/10, p.y - size/2, size/8, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.shadowBlur = 0;
    }

    function drawPlayer() {
        // Player is anchored at bottom center
        const anchorY = height - 120;
        const anchorX = cx + (state.playerX * 150); // Slight movement on screen

        // Screen Shake at high speed
        const shakeX = (Math.random() - 0.5) * state.shake;
        const shakeY = (Math.random() - 0.5) * state.shake;

        ctx.save();
        ctx.translate(anchorX + shakeX, anchorY + shakeY);
        ctx.rotate(state.playerTilt * 0.8); // Lean

        // 1. Shadow (Dynamic based on tilt)
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.ellipse(state.playerTilt * 20, 10, 50, 15, 0, 0, Math.PI*2);
        ctx.fill();

        // 2. Skis (Draw first so they are behind legs)
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        
        // Left Ski
        ctx.beginPath();
        ctx.moveTo(-20, -20);
        ctx.lineTo(-40, 40);
        ctx.stroke();
        
        // Right Ski
        ctx.beginPath();
        ctx.moveTo(20, -20);
        ctx.lineTo(40, 40);
        ctx.stroke();

        // 3. Legs/Boots
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.moveTo(-15, -20);
        ctx.lineTo(15, -20);
        ctx.lineTo(20, 10);
        ctx.lineTo(-20, 10);
        ctx.fill();

        // 4. Torso (The "High Contrast" Suit)
        ctx.fillStyle = '#f43f5e'; // Red Suit
        ctx.beginPath();
        ctx.moveTo(-25, -20);
        ctx.lineTo(25, -20);
        ctx.lineTo(30, -70); // Shoulders
        ctx.lineTo(-30, -70);
        ctx.fill();

        // 5. Helmet
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, -90, 18, 0, Math.PI*2);
        ctx.fill();
        
        // Goggles
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-12, -95, 24, 8);
        ctx.fillStyle = '#38bdf8'; // Cyan reflection
        ctx.fillRect(-8, -93, 16, 4);

        // 6. Speed Spray (Particles behind skis)
        if (state.speed > 60) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            for(let i=0; i<10; i++) {
                const sx = (Math.random() - 0.5) * 60;
                const sy = Math.random() * 50;
                const size = Math.random() * 4 + 2;
                ctx.beginPath();
                ctx.arc(sx, sy + 20, size, 0, Math.PI*2);
                ctx.fill();
            }
        }

        ctx.restore();
    }

    function drawVignette() {
        // Dramatic edges
        const grad = ctx.createRadialGradient(cx, cy, height/2, cx, cy, height);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(0.8, 'rgba(0,0,0,0.2)');
        grad.addColorStop(1, 'rgba(0,0,0,0.7)');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,width,height);
    }

    // --- Main Loop ---

    function update() {
        // Physics
        if (input.brake) {
            state.targetSpeed = Math.max(20, state.targetSpeed - 3);
            state.isBraking = true;
        } else {
            // Accelerate to high speed
            state.targetSpeed = Math.min(145, state.targetSpeed + 0.8);
            state.isBraking = false;
        }
        
        state.speed += (state.targetSpeed - state.speed) * 0.05;

        // Steering
        const steerSpeed = 0.04;
        if (input.left) {
            state.playerX = Math.max(-1, state.playerX - steerSpeed);
            state.playerTilt = Math.max(-0.6, state.playerTilt - 0.05);
        } else if (input.right) {
            state.playerX = Math.min(1, state.playerX + steerSpeed);
            state.playerTilt = Math.min(0.6, state.playerTilt + 0.05);
        } else {
            state.playerTilt += (0 - state.playerTilt) * 0.1;
        }

        // Screen Shake intensity based on speed
        state.shake = Math.max(0, (state.speed - 80) / 10);

        // Distance
        state.distance += state.speed * 0.0005;
        
        // UI Updates
        speedDisplay.innerText = Math.floor(state.speed);
        distDisplay.innerText = state.distance.toFixed(1);
        progressBar.style.width = ((state.distance % 10) / 10 * 100) + '%';
        
        // Speed pulse
        if(state.speed > 110) {
            speedDisplay.style.textShadow = `0 0 ${10 + Math.random()*10}px var(--accent-cyan)`;
        } else {
            speedDisplay.style.textShadow = 'none';
        }

        frame++;
    }

    function loop() {
        ctx.clearRect(0, 0, width, height);

        update();

        // 1. Background
        drawSky();
        drawMountains();
        
        // 2. The Slope & Track
        drawSlope();
        drawTrack();

        // 3. World Objects (Painter's Algo: Far to Near)
        
        // Combine trees and obstacles into one render list for correct Z-sorting
        const renderList = [];
        
        // Add Trees
        world.trees.forEach(tree => {
            let z = tree.z - (frame * state.speed * 2);
            if(z < 0) z += 6000;
            renderList.push({ type: 'tree', z: z, obj: tree });
        });

        // Add Obstacles
        world.obstacles.forEach(obs => {
            let z = obs.z - (frame * state.speed * 2);
            if(z < 0) z += 6000;
            renderList.push({ type: 'obstacle', z: z, obj: obs });
        });

        // Sort: High Z (Far) first
        renderList.sort((a, b) => b.z - a.z);

        renderList.forEach(item => {
            if (item.type === 'tree') drawTree(item.obj);
            else drawObstacle(item.obj);
        });

        // 4. Player (Always Near)
        drawPlayer();

        // 5. Post Processing
        drawVignette();

        requestAnimationFrame(loop);
    }

    // Start
    init();

</script>
