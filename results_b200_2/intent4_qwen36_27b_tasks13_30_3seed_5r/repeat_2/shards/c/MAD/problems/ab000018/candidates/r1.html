<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crossy Road - Isometric Redesign</title>
    <style>
        :root {
            --bg-sky-top: #87CEEB;
            --bg-sky-bot: #E0F7FA;
            --ui-shadow: 0 4px 0px rgba(0,0,0,0.2);
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, var(--bg-sky-top), var(--bg-sky-bot));
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* --- HUD Layer --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        /* Top HUD - Diegetic Wood Signs */
        .hud-top {
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: flex-start;
            margin-top: 10px;
        }

        .wood-sign {
            background: #D7CCC8; /* Wood base */
            border: 4px solid #5D4037; /* Dark wood frame */
            border-radius: 4px;
            padding: 5px 15px;
            position: relative;
            box-shadow: 0 8px 10px rgba(0,0,0,0.2), inset 0 0 20px rgba(0,0,0,0.1);
            text-align: center;
            min-width: 80px;
            transform: rotate(-2deg); /* Slight playful tilt */
            animation: hang 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .wood-sign::before {
            /* The nail/post hole */
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: #3E2723;
            border-radius: 50%;
            box-shadow: 0 2px 0 rgba(255,255,255,0.2);
        }

        .wood-sign.best {
            transform: rotate(2deg);
            background: #FFF3E0;
            border-color: #E65100;
            animation-delay: 0.1s;
        }

        .sign-label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #5D4037;
            margin-bottom: 2px;
            text-shadow: 0 1px 0 rgba(255,255,255,0.5);
        }

        .sign-val {
            font-size: 28px;
            font-weight: 900;
            color: #3E2723;
            line-height: 1;
        }

        .wood-sign.best .sign-val {
            color: #E65100;
        }

        /* Bottom Controls - Chunky 3D D-Pad */
        .controls-area {
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            margin-bottom: 20px;
        }

        .d-pad {
            position: relative;
            width: 180px;
            height: 180px;
            background: rgba(0,0,0,0.05);
            border-radius: 50%;
            backdrop-filter: blur(2px);
        }

        .btn {
            position: absolute;
            width: 60px;
            height: 60px;
            background: linear-gradient(145deg, #f0f0f0, #dcdcdc);
            border: none;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
            cursor: pointer;
            /* 3D Chunky Effect */
            box-shadow: 
                0 6px 0 #999, 
                0 8px 10px rgba(0,0,0,0.3),
                inset 0 2px 5px rgba(255,255,255,1);
            transition: transform 0.05s, box-shadow 0.05s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active, .btn.pressed {
            transform: translateY(6px);
            box-shadow: 
                0 0 0 #999, 
                inset 0 5px 10px rgba(0,0,0,0.2);
        }

        .btn svg {
            width: 28px;
            height: 28px;
            fill: #777;
            filter: drop-shadow(0 -1px 0 rgba(255,255,255,0.8));
        }

        /* Positioning the D-Pad buttons */
        .btn-up { top: 10px; left: 60px; }
        .btn-left { top: 60px; left: 10px; }
        .btn-down { top: 60px; left: 60px; }
        .btn-right { top: 60px; left: 110px; }

        /* Canvas */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        @keyframes hang {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
            100% { transform: translateY(0) rotate(-2deg); opacity: 1; }
        }
        @keyframes hangBest {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
            100% { transform: translateY(0) rotate(2deg); opacity: 1; }
        }

        @media (max-width: 600px) {
            .d-pad { transform: scale(0.85); }
            .wood-sign { min-width: 60px; padding: 4px 10px; }
            .sign-val { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="wood-sign">
                <div class="sign-label">Score</div>
                <div class="sign-val" id="score">0</div>
            </div>
            <div class="wood-sign best">
                <div class="sign-label">Best</div>
                <div class="sign-val" id="best">12</div>
            </div>
        </div>

        <div class="controls-area">
            <div class="d-pad">
                <div class="btn btn-up" id="btn-up">
                    <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h6v8h4v-8h6z"/></svg>
                </div>
                <div class="btn btn-left" id="btn-left">
                    <svg viewBox="0 0 24 24"><path d="M20 12l-8-8v6h-8v4h8v6z"/></svg>
                </div>
                <div class="btn btn-down" id="btn-down">
                    <svg viewBox="0 0 24 24"><path d="M12 20l8-8h-6v-8h-4v8h-6z"/></svg>
                </div>
                <div class="btn btn-right" id="btn-right">
                    <svg viewBox="0 0 24 24"><path d="M4 12l8 8v-6h8v-4h-8v-6z"/></svg>
                </div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        /**
         * CROSSY ROAD - ISOMETRIC REDESIGN
         * Pure Canvas 2.5D Engine
         */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height;

        // --- Configuration ---
        const CONFIG = {
            // Isometric projection settings
            isoAngle: Math.atan(0.5), // ~26.5 degrees
            blockSize: 60, // The size of one grid unit in world space
            lanes: 20,
            drawDistance: 25,
            colors: {
                skyTop: '#87CEEB',
                skyBot: '#E0F7FA',
                // Grass Checkerboard
                grassA: '#7CB342', 
                grassB: '#8BC34A',
                // Road
                road: '#546E7A',
                roadLine: '#FFFFFF',
                // Water
                water: '#29B6F6',
                waterHighlight: '#4FC3F7',
                // UI Elements
                wood: '#8D6E63'
            }
        };

        // --- State ---
        let camera = { x: 0, y: 0, z: 0 };
        let player = { 
            gridX: 0, 
            gridY: 0, 
            worldX: 0, 
            worldY: 0, 
            targetX: 0, 
            targetY: 0,
            z: 0, 
            squish: 1, 
            rot: 0, 
            targetRot: 0,
            color: '#FFF', // Chicken
            beak: '#FF9800'
        };
        let lanes = [];
        let particles = [];
        let score = 0;
        let time = 0;
        let cloudOffset = 0;

        // --- Resize Handling ---
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            // Re-center camera on resize
            camera.x = width / 2;
            camera.y = height * 0.45; // Horizon line upper third
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Math Helpers ---

        // Convert Grid (X,Y) to World 3D (x,y,z)
        // Grid X increases to the right, Grid Y increases "forward" (up the screen)
        function gridToWorld(gx, gy) {
            // Isometric math:
            // x = (gx - gy) * width/2
            // y = (gx + gy) * height/2
            // We adjust scaling so blocks look square-ish
            const w = CONFIG.blockSize;
            const h = CONFIG.blockSize * 0.5; // Flattened for perspective
            return {
                x: (gx - gy) * w,
                y: (gx + gy) * h,
                z: 0
            };
        }

        // Project World 3D to Screen 2D
        function project(x, y, z) {
            return {
                x: camera.x + x,
                y: camera.y + y - z, // Simple Z-depth
                scale: 1 // In this specific projection style, we handle scale manually for aesthetics
            };
        }

        const lerp = (a, b, t) => a + (b - a) * t;
        const rand = (min, max) => Math.random() * (max - min) + min;

        // --- Classes ---

        class Lane {
            constructor(gridY) {
                this.gridY = gridY;
                this.type = this.determineType(gridY);
                this.vehicles = [];
                this.logs = [];
                this.decorations = [];

                // Populate based on type
                if (this.type === 'road') {
                    // Create cars
                    const count = Math.floor(rand(1, 3));
                    const direction = (Math.floor(gridY / 3) % 2 === 0) ? 1 : -1; // Alternating traffic
                    for(let i=0; i<count; i++) {
                        this.vehicles.push({
                            x: rand(-20, 20) * CONFIG.blockSize, // Spread across X
                            speed: rand(2, 5) * direction,
                            color: ['#F44336', '#2196F3', '#FFEB3B', '#9C27B0'][Math.floor(Math.random()*4)],
                            width: 50,
                            height: 30,
                            depth: 40
                        });
                    }
                } else if (this.type === 'water') {
                    // Create logs
                    const count = Math.floor(rand(2, 4));
                    const direction = (Math.floor(gridY / 4) % 2 === 0) ? 1 : -1;
                    for(let i=0; i<count; i++) {
                        this.logs.push({
                            x: rand(-15, 15) * CONFIG.blockSize,
                            speed: rand(1, 2) * direction,
                            length: rand(1.5, 3) // In grid units
                        });
                    }
                } else {
                    // Grass decorations
                    const count = Math.floor(rand(2, 6));
                    for(let i=0; i<count; i++) {
                        this.decorations.push({
                            gx: Math.floor(rand(-8, 8)), // Grid X
                            type: Math.random() > 0.6 ? 'tree' : 'bush',
                            height: rand(0.5, 1.0)
                        });
                    }
                }
            }

            determineType(y) {
                if (y < 4) return 'grass'; // Start area
                const mod = y % 5;
                if (mod === 0) return 'water';
                if (mod === 1 || mod === 2) return 'road';
                return 'grass';
            }

            update() {
                // Move vehicles
                this.vehicles.forEach(v => {
                    v.x += v.speed;
                    // Wrap around
                    const limit = 25 * CONFIG.blockSize;
                    if (v.speed > 0 && v.x > limit) v.x = -limit;
                    if (v.speed < 0 && v.x < -limit) v.x = limit;
                });

                // Move logs
                this.logs.forEach(l => {
                    l.x += l.speed;
                    const limit = 20 * CONFIG.blockSize;
                    if (l.speed > 0 && l.x > limit) l.x = -limit;
                    if (l.speed < 0 && l.x < -limit) l.x = limit;
                });
            }
        }

        // --- Drawing Functions ---

        function drawCube(x, y, z, w, h, d, colorTop, colorSide, colorFront) {
            // Isometric Cube Drawing
            // x,y is center bottom
            
            const p = project(x, y, z);
            
            // Dimensions in screen space
            // We flatten the isometric projection slightly for the "Crossy" look
            const hw = w * 0.5; 
            const hh = h;
            const hd = d * 0.5;

            // 1. Top Face
            ctx.fillStyle = colorTop;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - hh); // Top center
            ctx.lineTo(p.x - hw, p.y - hh + hd); // Left
            ctx.lineTo(p.x, p.y - hh + hd*2); // Bottom center
            ctx.lineTo(p.x + hw, p.y - hh + hd); // Right
            ctx.closePath();
            ctx.fill();

            // 2. Right Face (Side)
            ctx.fillStyle = colorSide;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - hh + hd*2); // Top
            ctx.lineTo(p.x + hw, p.y - hh + hd); // Top Right
            ctx.lineTo(p.x + hw, p.y + hd); // Bottom Right
            ctx.lineTo(p.x, p.y + hd*2); // Bottom
            ctx.closePath();
            ctx.fill();

            // 3. Left Face (Front/Side)
            ctx.fillStyle = colorFront;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - hh + hd*2); // Top
            ctx.lineTo(p.x - hw, p.y - hh + hd); // Top Left
            ctx.lineTo(p.x - hw, p.y + hd); // Bottom Left
            ctx.lineTo(p.x, p.y + hd*2); // Bottom
            ctx.closePath();
            ctx.fill();
        }

        function drawTree(gx, gy, scale) {
            const pos = gridToWorld(gx, gy);
            const baseH = 40 * scale;
            
            // Trunk
            drawCube(pos.x, pos.y, 0, 10, baseH, 10, '#8D6E63', '#5D4037', '#4E342E');
            
            // Leaves (Stacked cubes for low poly look)
            const leafColor = '#43A047';
            const leafDark = '#2E7D32';
            
            drawCube(pos.x, pos.y, baseH, 40, 30, 40, leafColor, leafDark, leafDark);
            drawCube(pos.x, pos.y, baseH + 20, 30, 25, 30, leafColor, leafDark, leafDark);
        }

        function drawBush(gx, gy) {
            const pos = gridToWorld(gx, gy);
            drawCube(pos.x, pos.y, 0, 30, 15, 30, '#C0CA33', '#9E9D24', '#827717');
        }

        function drawBackground() {
            // Simple horizon line / skyline
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.beginPath();
            ctx.moveTo(0, camera.y);
            // Draw some distant hills/city shapes
            for(let i=0; i<=width; i+=50) {
                ctx.lineTo(i, camera.y - Math.sin(i*0.01)*20 - 10);
            }
            ctx.lineTo(width, camera.y);
            ctx.fill();

            // Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            cloudOffset += 0.2;
            const cloudY = camera.y - 80;
            
            [100, 400, 700, 1000].forEach(cx => {
                let drawX = (cx + cloudOffset) % (width + 200) - 100;
                ctx.beginPath();
                ctx.arc(drawX, cloudY, 30, 0, Math.PI*2);
                ctx.arc(drawX+25, cloudY-10, 40, 0, Math.PI*2);
                ctx.arc(drawX+50, cloudY, 30, 0, Math.PI*2);
                ctx.fill();
            });
        }

        // --- Main Game Object ---

        const game = {
            init: () => {
                // Initial Lanes
                for(let i=-2; i<CONFIG.drawDistance; i++) {
                    lanes.push(new Lane(i));
                }
                
                // Input Bindings
                window.addEventListener('keydown', (e) => {
                    if(e.key === 'ArrowUp') game.movePlayer(0, -1);
                    if(e.key === 'ArrowDown') game.movePlayer(0, 1);
                    if(e.key === 'ArrowLeft') game.movePlayer(-1, 0);
                    if(e.key === 'ArrowRight') game.movePlayer(1, 0);
                });

                // Touch Bindings
                const bindBtn = (id, dx, dy) => {
                    const btn = document.getElementById(id);
                    const handler = (e) => {
                        e.preventDefault();
                        btn.classList.add('pressed');
                        game.movePlayer(dx, dy);
                        setTimeout(() => btn.classList.remove('pressed'), 100);
                    };
                    btn.addEventListener('mousedown', handler);
                    btn.addEventListener('touchstart', handler);
                };

                bindBtn('btn-up', 0, -1);
                bindBtn('btn-down', 0, 1);
                bindBtn('btn-left', -1, 0);
                bindBtn('btn-right', 1, 0);

                requestAnimationFrame(game.loop);
            },

            movePlayer: (dx, dy) => {
                // Prevent moving twice instantly
                if (Math.abs(player.worldX - player.targetX) > 1 || Math.abs(player.worldY - player.targetY) > 1) return;

                const newGX = player.gridX + dx;
                const newGY = player.gridY + dy;

                // Update Grid Position
                player.gridX = newGX;
                player.gridY = newGY;

                // Calculate World Target
                const targetPos = gridToWorld(player.gridX, player.gridY);
                player.targetX = targetPos.x;
                player.targetY = targetPos.y;

                // Animation triggers
                player.squish = 0.6; // Squish on jump start
                
                // Rotation
                if (dx > 0) player.targetRot = 0.2;
                if (dx < 0) player.targetRot = -0.2;
                if (dy < 0) player.targetRot = 0; // Facing forward
                if (dy > 0) player.targetRot = Math.PI; // Back

                // Score logic (only when moving forward)
                if (dy === -1) {
                    score++;
                    document.getElementById('score').innerText = score;
                    // Generate new lane ahead
                    const highestY = lanes[lanes.length-1].gridY;
                    lanes.push(new Lane(highestY + 1));
                    // Remove old lanes behind
                    lanes.shift();
                }
            },

            update: () => {
                time += 16;

                // Smooth Player Movement (Lerp)
                player.worldX = lerp(player.worldX, player.targetX, 0.2);
                player.worldY = lerp(player.worldY, player.targetY, 0.2);
                
                // Squish bounce
                player.squish = lerp(player.squish, 1, 0.1);
                player.rot = lerp(player.rot, player.targetRot, 0.1);

                // Camera Follow (Smooth)
                // We want the player to stay in the lower-middle third
                const targetCamY = player.worldY * 0.5; // 0.5 because of iso projection
                const targetCamX = -player.worldX; 
                
                camera.y = lerp(camera.y, (height * 0.6) - targetCamY, 0.1);
                camera.x = lerp(camera.x, (width / 2) + targetCamX, 0.1);

                // Update Lanes
                lanes.forEach(lane => lane.update());

                // Collision / Riding Logic
                const currentLane = lanes.find(l => l.gridY === player.gridY);
                if (currentLane) {
                    if (currentLane.type === 'water') {
                        let onLog = false;
                        // Check if player X aligns with any log X
                        currentLane.logs.forEach(log => {
                            const logWidth = log.length * CONFIG.blockSize;
                            if (player.worldX > log.x - logWidth/2 && player.worldX < log.x + logWidth/2) {
                                onLog = true;
                                // Move player with log
                                player.worldX += log.speed;
                                player.targetX = player.worldX; // Sync target
                                player.gridX = player.worldX / CONFIG.blockSize; // Approx grid
                            }
                        });
                        if (!onLog) {
                            // Drowning logic (reset for demo)
                            // player.squish = 0; // Squat down
                        }
                    }
                }
            },

            draw: () => {
                // 1. Clear & Background
                ctx.fillStyle = 'var(--bg-sky-top)';
                ctx.fillRect(0, 0, width, height);
                drawBackground();

                // 2. Collect all drawables
                let drawables = [];

                // Add Lanes (Ground)
                lanes.forEach(l => {
                    drawables.push({ type: 'lane', obj: l, z: l.gridY });
                    
                    // Add static decorations
                    l.decorations.forEach(d => {
                        drawables.push({ type: 'deco', obj: d, z: l.gridY });
                    });
                    
                    // Add Vehicles
                    l.vehicles.forEach(v => {
                        drawables.push({ type: 'vehicle', obj: v, z: l.gridY });
                    });
                    
                    // Add Logs
                    l.logs.forEach(lg => {
                        drawables.push({ type: 'log', obj: lg, z: l.gridY });
                    });
                });

                // Add Player
                drawables.push({ type: 'player', z: player.gridY });

                // 3. Sort by Y (Painter's Algorithm for Isometric)
                // Higher Y (further "up" screen) draws first? 
                // In this projection, WorldY increases as we go "forward" (up screen).
                // So we draw lowest Y first (closest to camera) to highest Y?
                // Actually, in standard iso, we draw back to front.
                // Back = High Y. Front = Low Y.
                drawables.sort((a, b) => a.z - b.z); // Draw closest (lowest Z/Y) first? 
                // Wait, standard painter: draw furthest away first.
                // In our coord system, high Y is furthest away.
                // So sort ascending: draw low Y (close) then high Y (far)? 
                // NO. If I draw close, far covers it. That's wrong.
                // I must draw Far (High Y) then Close (Low Y).
                // But wait, objects on the SAME Y?
                // Let's reverse sort: High Z first.
                drawables.sort((a, b) => b.z - a.z);

                // 4. Draw Loop
                drawables.forEach(item => {
                    
                    // Draw Ground Lanes
                    if (item.type === 'lane') {
                        const l = item.obj;
                        const y = l.gridY;
                        
                        // Draw a strip of ground for this lane
                        // We need to draw the tiles for this row
                        // Range of X to draw
                        const startX = -15; 
                        const endX = 15;

                        for(let x = startX; x <= endX; x++) {
                            const pos = gridToWorld(x, y);
                            const isAlt = (x + y) % 2 === 0;
                            
                            if (l.type === 'grass') {
                                const col = isAlt ? CONFIG.colors.grassA : CONFIG.colors.grassB;
                                drawCube(pos.x, pos.y, 0, CONFIG.blockSize, 10, CONFIG.blockSize, col, '#558B2F', '#33691E');
                            } else if (l.type === 'road') {
                                drawCube(pos.x, pos.y, 0, CONFIG.blockSize, 10, CONFIG.blockSize, '#546E7A', '#37474F', '#263238');
                                // Road markings
                                if (isAlt) {
                                     ctx.fillStyle = 'rgba(255,255,255,0.3)';
                                     const p = project(pos.x, pos.y, 5);
                                     ctx.fillRect(p.x - 10, p.y - 5, 20, 2);
                                }
                            } else if (l.type === 'water') {
                                // Water animation
                                const wave = Math.sin(time * 0.005 + x + y) * 2;
                                drawCube(pos.x, pos.y, wave, CONFIG.blockSize, 10, CONFIG.blockSize, CONFIG.colors.water, '#0288D1', '#01579B');
                            }
                        }
                    }

                    // Draw Decorations
                    if (item.type === 'deco') {
                        const d = item.obj;
                        if (d.type === 'tree') drawTree(d.gx, item.z, d.height);
                        else drawBush(d.gx, item.z);
                    }

                    // Draw Vehicles
                    if (item.type === 'vehicle') {
                        const v = item.obj;
                        // Convert vehicle X (pixels) to grid-relative
                        // We treat vehicle.x as world X offset
                        const y = gridToWorld(0, item.z).y; // Base Y for this lane
                        drawCube(v.x, y, 15, v.width, v.height, v.depth, v.color, '#333', '#333');
                    }

                    // Draw Logs
                    if (item.type === 'log') {
                        const l = item.obj;
                        const y = gridToWorld(0, item.z).y;
                        drawCube(l.x, y, 5, l.length * CONFIG.blockSize, 10, 20, '#8D6E63', '#5D4037', '#4E342E');
                    }

                    // Draw Player
                    if (item.type === 'player') {
                        const p = project(player.worldX, player.worldY, 0);
                        
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        
                        // Shadow
                        ctx.fillStyle = 'rgba(0,0,0,0.3)';
                        ctx.beginPath();
                        ctx.ellipse(0, 0, 20, 10, 0, 0, Math.PI*2);
                        ctx.fill();

                        // Squish Transform
                        const scaleY = player.squish;
                        const scaleX = 1 + (1 - player.squish) * 0.2;
                        ctx.scale(scaleX, scaleY);

                        // Body
                        drawCube(0, 0, 20, 30, 30, 30, '#FFF', '#E0E0E0', '#BDBDBD');
                        
                        // Head
                        drawCube(0, 0, 45, 25, 25, 25, '#FFF', '#E0E0E0', '#BDBDBD');

                        // Comb (Red)
                        ctx.fillStyle = '#F44336';
                        ctx.beginPath();
                        ctx.arc(0, -25, 5, 0, Math.PI*2);
                        ctx.fill();

                        // Beak
                        ctx.fillStyle = player.beak;
                        ctx.beginPath();
                        ctx.moveTo(10, -15);
                        ctx.lineTo(20, -10);
                        ctx.lineTo(10, -5);
                        ctx.fill();

                        // Eyes
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(8, -18, 2, 0, Math.PI*2);
                        ctx.fill();

                        // Legs (Simple lines)
                        ctx.strokeStyle = '#FF9800';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(-5, 0);
                        ctx.lineTo(-5, -10);
                        ctx.moveTo(5, 0);
                        ctx.lineTo(5, -10);
                        ctx.stroke();

                        ctx.restore();
                    }
                });
            },

            loop: () => {
                game.update();
                game.draw();
                requestAnimationFrame(game.loop);
            }
        };

        // Start
        game.init();

    </script>
</body>
</html>
