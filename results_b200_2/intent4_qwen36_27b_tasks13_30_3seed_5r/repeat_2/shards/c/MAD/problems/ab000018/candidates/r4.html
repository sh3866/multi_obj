<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Low Poly Road Trip</title>
    <style>
        :root {
            --sky-top: #4fc3f7;
            --sky-bot: #e1f5fe;
            --ui-primary: #37474F;
            --ui-accent: #FFCA28;
            --ui-shadow: #102027;
            --ui-text: #ECEFF1;
            --dpad-base: #8D6E63;
            --dpad-dark: #5D4037;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, var(--sky-top), var(--sky-bot));
            font-family: 'Arial Black', 'Impact', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* --- Canvas --- */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- UI Layer --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- HUD (Top Center) --- */
        .hud-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding-top: 25px;
            width: 100%;
        }

        .score-pill {
            background: var(--ui-primary);
            color: var(--ui-text);
            padding: 8px 24px;
            /* 3D Blocky UI Look */
            box-shadow: 0 6px 0 var(--ui-shadow), 0 8px 10px rgba(0,0,0,0.2);
            border-top: 4px solid var(--ui-accent);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
            transform: perspective(500px) rotateX(10deg);
            transition: transform 0.1s;
        }

        .score-pill:active {
            transform: perspective(500px) rotateX(10deg) translateY(4px);
            box-shadow: 0 2px 0 var(--ui-shadow);
        }

        .score-label {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            color: #B0BEC5;
            letter-spacing: 2px;
            margin-bottom: 2px;
        }

        .score-val {
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
        }

        /* --- Controls (Bottom Right) --- */
        .controls-overlay {
            padding: 30px;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            pointer-events: none;
        }

        .dpad {
            position: relative;
            width: 140px;
            height: 140px;
            opacity: 0.9;
            /* 3D Perspective for Controls */
            transform: perspective(600px) rotateX(20deg) rotateY(-10deg);
            transform-style: preserve-3d;
        }

        .dpad-btn {
            position: absolute;
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--dpad-base), #6D4C41);
            border: 2px solid #3E2723;
            /* Physical Button Feel */
            box-shadow: 0 8px 0 var(--dpad-dark), 0 10px 10px rgba(0,0,0,0.3);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.1s;
        }

        .dpad-btn::after {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 2px dashed rgba(255,255,255,0.1);
            border-radius: 8px;
        }

        .dpad-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 var(--dpad-dark), inset 0 0 10px rgba(0,0,0,0.5);
        }

        .dpad-up { top: 0; left: 46px; }
        .dpad-down { bottom: 0; left: 46px; }
        .dpad-left { top: 46px; left: 0; }
        .dpad-right { top: 46px; right: 0; }
        
        /* Center decorative cap */
        .dpad-center { 
            top: 46px; left: 46px; 
            width: 48px; height: 48px; 
            background: #3E2723; 
            border-radius: 50%; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            border: 2px solid #1b0e08;
        }

        /* Tutorial text */
        .tutorial-text {
            position: absolute;
            bottom: 160px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
            background: rgba(0,0,0,0.3);
            padding: 8px 16px;
            border-radius: 20px;
            pointer-events: none;
            opacity: 0;
            animation: fadeIn 1s 2s forwards;
        }

        @keyframes fadeIn { to { opacity: 1; } }

    </style>
</head>
<body>

    <div id="ui-layer">
        <!-- HUD: Top Center -->
        <div class="hud-container">
            <div class="score-pill">
                <div class="score-label">Score</div>
                <div class="score-val" id="score">0</div>
            </div>
            <div class="score-pill">
                <div class="score-label">Best</div>
                <div class="score-val" id="best">12</div>
            </div>
        </div>
        
        <div class="tutorial-text">SWIPE or ARROWS to cross</div>

        <!-- Controls: Bottom Right -->
        <div class="controls-overlay">
            <div class="dpad">
                <div class="dpad-btn dpad-up" onclick="game.movePlayer(0, -1)"></div>
                <div class="dpad-btn dpad-left" onclick="game.movePlayer(-1, 0)"></div>
                <div class="dpad-center"></div>
                <div class="dpad-btn dpad-right" onclick="game.movePlayer(1, 0)"></div>
                <div class="dpad-btn dpad-down" onclick="game.movePlayer(0, 1)"></div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        /**
         * LOW POLY ROAD TRIP
         * Revised Visuals & Geometry
         */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height;

        // --- Configuration ---
        const CONFIG = {
            blockSize: 64, // Slightly larger for better scale
            lanes: 20,
            drawDistance: 35,
            horizonY: 0.38, // Horizon slightly higher
            fov: 900, 
            colors: {
                grassLight: '#81C784',
                grassDark: '#66BB6A',
                road: '#607D8B',
                roadLine: 'rgba(255,255,255,0.8)',
                water: '#29B6F6',
                waterDark: '#0288D1',
                shadow: 'rgba(0,0,0,0.2)'
            }
        };

        // --- State ---
        let camera = { x: 0, y: 0 };
        let player = { 
            gridX: 0, 
            gridY: 0, 
            worldX: 0, 
            worldY: 0, 
            targetX: 0, 
            targetY: 0,
            z: 0, 
            squish: 1, 
            rot: 0, 
            targetRot: 0,
            frame: 0
        };
        let lanes = [];
        let score = 0;
        let time = 0;
        let particles = [];
        let clouds = [];

        // --- Resize Handling ---
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            camera.x = width / 2;
            
            // Init clouds if empty
            if(clouds.length === 0) {
                for(let i=0; i<6; i++) {
                    clouds.push({
                        x: Math.random() * width,
                        y: Math.random() * (height * CONFIG.horizonY),
                        scale: Math.random() * 0.5 + 0.5,
                        speed: Math.random() * 0.5 + 0.1
                    });
                }
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Math Helpers ---
        const lerp = (a, b, t) => a + (b - a) * t;
        const rand = (min, max) => Math.random() * (max - min) + min;

        // Perspective Projection
        function project(x, y, z) {
            const cx = x - camera.x;
            const cy = y - camera.y;
            
            // Scale factor based on distance from camera
            const scale = CONFIG.fov / (CONFIG.fov + cy + 300); 
            
            return {
                x: width/2 + cx * scale,
                y: (height * CONFIG.horizonY) + (cy + 300) * scale * 0.65, 
                scale: scale
            };
        }

        // --- Classes ---

        class Particle {
            constructor(x, y, z, color) {
                this.x = x; this.y = y; this.z = z;
                this.vx = rand(-3, 3);
                this.vy = rand(-3, 3);
                this.vz = rand(2, 5);
                this.life = 1.0;
                this.color = color;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.z += this.vz;
                this.life -= 0.04;
            }
        }

        class Lane {
            constructor(gridY) {
                this.gridY = gridY;
                this.type = this.determineType(gridY);
                this.vehicles = [];
                this.logs = [];
                this.decorations = [];

                if (this.type === 'road') {
                    const count = Math.floor(rand(1, 3));
                    const direction = (Math.floor(gridY / 5) % 2 === 0) ? 1 : -1;
                    for(let i=0; i<count; i++) {
                        this.vehicles.push({
                            x: rand(-18, 18) * CONFIG.blockSize,
                            speed: rand(4, 8) * direction,
                            color: ['#FF5252', '#448AFF', '#FFEB3B', '#E040FB', '#FF9800'][Math.floor(Math.random()*5)],
                            w: rand(40, 60),
                            h: rand(30, 45),
                            d: rand(25, 35)
                        });
                    }
                } else if (this.type === 'water') {
                    const count = Math.floor(rand(2, 4));
                    const direction = (Math.floor(gridY / 4) % 2 === 0) ? 1 : -1;
                    for(let i=0; i<count; i++) {
                        this.logs.push({
                            x: rand(-15, 15) * CONFIG.blockSize,
                            speed: rand(1.5, 3) * direction,
                            len: rand(1.5, 3)
                        });
                    }
                } else {
                    // Grass Deco
                    const count = Math.floor(rand(0, 5));
                    for(let i=0; i<count; i++) {
                        this.decorations.push({
                            gx: Math.floor(rand(-7, 7)),
                            type: Math.random() > 0.6 ? 'tree' : 'bush',
                            scale: rand(0.8, 1.3)
                        });
                    }
                }
            }

            determineType(y) {
                if (y < 4) return 'grass';
                const mod = y % 6;
                if (mod === 0 || mod === 1) return 'water';
                if (mod === 2 || mod === 3 || mod === 4) return 'road';
                return 'grass';
            }

            update() {
                this.vehicles.forEach(v => {
                    v.x += v.speed;
                    const limit = 25 * CONFIG.blockSize;
                    if (v.speed > 0 && v.x > limit) v.x = -limit;
                    if (v.speed < 0 && v.x < -limit) v.x = limit;
                });

                this.logs.forEach(l => {
                    l.x += l.speed;
                    const limit = 20 * CONFIG.blockSize;
                    if (l.speed > 0 && l.x > limit) l.x = -limit;
                    if (l.speed < 0 && l.x < -limit) l.x = limit;
                });
            }
        }

        // --- Drawing Functions ---

        // Draw Low Poly Cube
        function drawCube(x, y, z, w, h, d, colorTop, colorSide, colorFront) {
            const cBot = project(x, y, 0);
            const cTop = project(x, y, z + h);
            
            const hw = (w/2) * cBot.scale;
            const hd = (d/2) * cBot.scale;
            const hTop = (w/2) * cTop.scale; 
            const dTop = (d/2) * cTop.scale;

            const botL = { x: cBot.x - hw, y: cBot.y };
            const botR = { x: cBot.x + hw, y: cBot.y };
            const botC = { x: cBot.x, y: cBot.y + hd }; 
            
            const topL = { x: cTop.x - hTop, y: cTop.y };
            const topR = { x: cTop.x + hTop, y: cTop.y };
            const topC = { x: cTop.x, y: cTop.y + dTop };

            // 1. Front Face
            ctx.fillStyle = colorFront;
            ctx.beginPath();
            ctx.moveTo(botL.x, botL.y);
            ctx.lineTo(botR.x, botR.y);
            ctx.lineTo(topR.x, topR.y);
            ctx.lineTo(topL.x, topL.y);
            ctx.fill();

            // 2. Right Face
            ctx.fillStyle = colorSide;
            ctx.beginPath();
            ctx.moveTo(botR.x, botR.y);
            ctx.lineTo(botC.x, botC.y);
            ctx.lineTo(topC.x, topC.y);
            ctx.lineTo(topR.x, topR.y);
            ctx.fill();

            // 3. Left Face (Darker side)
            ctx.fillStyle = adjustColor(colorSide, -20);
            ctx.beginPath();
            ctx.moveTo(botL.x, botL.y);
            ctx.lineTo(botC.x, botC.y);
            ctx.lineTo(topC.x, topC.y);
            ctx.lineTo(topL.x, topL.y);
            ctx.fill();

            // 4. Top Face
            ctx.fillStyle = colorTop;
            ctx.beginPath();
            ctx.moveTo(topL.x, topL.y);
            ctx.lineTo(topR.x, topR.y);
            ctx.lineTo(topC.x, topC.y);
            ctx.fill();
        }

        function adjustColor(color, amount) {
            return '#' + color.replace(/^#/, '').replace(/../g, color => ('0'+Math.min(255, Math.max(0, parseInt(color, 16) + amount)).toString(16)).substr(-2));
        }

        function drawTree(x, y, scale) {
            const trunkW = 14 * scale;
            const trunkH = 40 * scale;
            const trunkD = 14 * scale;
            
            drawCube(x, y, 0, trunkW, trunkH, trunkD, '#795548', '#5D4037', '#4E342E');
            drawCube(x, y, 30*scale, 45*scale, 35*scale, 45*scale, '#66BB6A', '#43A047', '#2E7D32');
            drawCube(x, y, 55*scale, 35*scale, 30*scale, 35*scale, '#81C784', '#4CAF50', '#388E3C');
        }

        function drawBush(x, y, scale) {
            drawCube(x, y, 0, 25*scale, 20*scale, 25*scale, '#AED581', '#9CCC65', '#7CB342');
        }

        function drawBackground() {
            // Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            clouds.forEach(c => {
                c.x += c.speed;
                if(c.x > width + 100) c.x = -100;
                
                ctx.save();
                ctx.translate(c.x, c.y);
                ctx.scale(c.scale, c.scale);
                ctx.beginPath();
                ctx.arc(0, 0, 30, 0, Math.PI*2);
                ctx.arc(25, -15, 40, 0, Math.PI*2);
                ctx.arc(50, 0, 30, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            });

            // Mountains
            ctx.fillStyle = '#B3E5FC';
            ctx.beginPath();
            ctx.moveTo(0, height * CONFIG.horizonY);
            for(let i=0; i<=width; i+=100) {
                ctx.lineTo(i, (height * CONFIG.horizonY) - Math.abs(Math.sin(i*0.003))*60 - 20);
            }
            ctx.lineTo(width, height * CONFIG.horizonY);
            ctx.fill();
        }

        // --- Main Game Object ---

        const game = {
            init: () => {
                for(let i=-2; i<CONFIG.drawDistance; i++) {
                    lanes.push(new Lane(i));
                }
                
                // Input
                window.addEventListener('keydown', (e) => {
                    if(e.key === 'ArrowUp') game.movePlayer(0, -1);
                    if(e.key === 'ArrowDown') game.movePlayer(0, 1);
                    if(e.key === 'ArrowLeft') game.movePlayer(-1, 0);
                    if(e.key === 'ArrowRight') game.movePlayer(1, 0);
                });

                // Touch / Swipe
                let touchStartX = 0;
                let touchStartY = 0;
                window.addEventListener('touchstart', e => {
                    touchStartX = e.changedTouches[0].screenX;
                    touchStartY = e.changedTouches[0].screenY;
                }, {passive: false});

                window.addEventListener('touchend', e => {
                    const touchEndX = e.changedTouches[0].screenX;
                    const touchEndY = e.changedTouches[0].screenY;
                    const dx = touchEndX - touchStartX;
                    const dy = touchEndY - touchStartY;

                    if (Math.abs(dx) > Math.abs(dy)) {
                        if (Math.abs(dx) > 30) game.movePlayer(dx > 0 ? 1 : -1, 0);
                    } else {
                        if (Math.abs(dy) > 30) game.movePlayer(0, dy > 0 ? 1 : -1);
                    }
                }, {passive: false});

                requestAnimationFrame(game.loop);
            },

            movePlayer: (dx, dy) => {
                if (Math.abs(player.worldX - player.targetX) > 10 || Math.abs(player.worldY - player.targetY) > 10) return;

                const newGX = player.gridX + dx;
                const newGY = player.gridY + dy;

                player.gridX = newGX;
                player.gridY = newGY;

                player.targetX = newGX * CONFIG.blockSize;
                player.targetY = -newGY * CONFIG.blockSize;

                player.squish = 0.7;
                
                if (dx > 0) player.targetRot = Math.PI / 2;
                if (dx < 0) player.targetRot = -Math.PI / 2;
                if (dy < 0) player.targetRot = 0; 
                if (dy > 0) player.targetRot = Math.PI; 

                if (dy === -1) {
                    score++;
                    document.getElementById('score').innerText = score;
                    const highestY = lanes[lanes.length-1].gridY;
                    lanes.push(new Lane(highestY + 1));
                    lanes.shift(); 
                }
                
                for(let i=0; i<5; i++) {
                    particles.push(new Particle(player.worldX, player.worldY, 0, 'rgba(255,255,255,0.6)'));
                }
            },

            update: () => {
                time += 16;

                player.worldX = lerp(player.worldX, player.targetX, 0.25);
                player.worldY = lerp(player.worldY, player.targetY, 0.25);
                player.squish = lerp(player.squish, 1, 0.1);
                player.rot = lerp(player.rot, player.targetRot, 0.2);

                const dist = Math.sqrt(Math.pow(player.targetX - player.worldX, 2) + Math.pow(player.targetY - player.worldY, 2));
                player.z = Math.sin(dist * 0.06) * 25;

                const targetCamX = player.worldX * 0.8;
                const targetCamY = -player.gridY * CONFIG.blockSize * 0.8;

                camera.x = lerp(camera.x, targetCamX, 0.1);
                camera.y = lerp(camera.y, targetCamY, 0.1);

                lanes.forEach(lane => lane.update());

                const currentLane = lanes.find(l => l.gridY === player.gridY);
                if (currentLane && currentLane.type === 'water') {
                    let onLog = false;
                    currentLane.logs.forEach(log => {
                        const logW = log.len * CONFIG.blockSize;
                        if (player.worldX > log.x - logW/2 && player.worldX < log.x + logW/2) {
                            onLog = true;
                            player.worldX += log.speed;
                            player.targetX = player.worldX;
                        }
                    });
                    if (!onLog && player.z < 5) player.squish = 0.2;
                }

                particles.forEach((p, i) => {
                    p.update();
                    if(p.life <= 0) particles.splice(i, 1);
                });
            },

            draw: () => {
                ctx.clearRect(0, 0, width, height);
                drawBackground();

                let drawables = [];

                lanes.forEach(l => {
                    drawables.push({ type: 'lane', obj: l, z: l.gridY });
                    l.decorations.forEach(d => {
                        drawables.push({ type: 'deco', obj: d, z: l.gridY });
                    });
                    l.vehicles.forEach(v => {
                        drawables.push({ type: 'vehicle', obj: v, z: l.gridY });
                    });
                    l.logs.forEach(lg => {
                        drawables.push({ type: 'log', obj: lg, z: l.gridY });
                    });
                });

                drawables.push({ type: 'player', z: player.gridY });

                drawables.sort((a, b) => b.z - a.z);

                drawables.forEach(item => {
                    if (item.type === 'lane') {
                        const l = item.obj;
                        const y = l.gridY;
                        
                        for(let x = -12; x <= 12; x++) {
                            const wx = x * CONFIG.blockSize;
                            const wy = -y * CONFIG.blockSize;
                            
                            let topCol, sideCol;
                            if (l.type === 'grass') {
                                const isAlt = (x + y) % 2 === 0;
                                topCol = isAlt ? CONFIG.colors.grassLight : CONFIG.colors.grassDark;
                                sideCol = '#558B2F';
                            } else if (l.type === 'road') {
                                topCol = CONFIG.colors.road;
                                sideCol = '#263238';
                            } else {
                                const wave = Math.sin(time * 0.005 + x + y) * 2;
                                topCol = CONFIG.colors.water;
                                sideCol = CONFIG.colors.waterDark;
                            }

                            drawCube(wx, wy, 0, CONFIG.blockSize, 15, CONFIG.blockSize, topCol, sideCol, sideCol);

                            if (l.type === 'road' && (x+y)%2===0) {
                                const p = project(wx, wy, 1);
                                ctx.fillStyle = CONFIG.colors.roadLine;
                                ctx.fillRect(p.x - 10*p.scale, p.y - 2*p.scale, 20*p.scale, 4*p.scale);
                            }
                        }
                    }

                    if (item.type === 'deco') {
                        const d = item.obj;
                        const wx = d.gx * CONFIG.blockSize;
                        const wy = -item.z * CONFIG.blockSize;
                        if (d.type === 'tree') drawTree(wx, wy, d.scale);
                        else drawBush(wx, wy, d.scale);
                    }

                    if (item.type === 'vehicle') {
                        const v = item.obj;
                        const wy = -item.z * CONFIG.blockSize;
                        const pSh = project(v.x, wy, 0);
                        ctx.fillStyle = 'rgba(0,0,0,0.3)';
                        ctx.beginPath();
                        ctx.ellipse(pSh.x, pSh.y, 25*pSh.scale, 10*pSh.scale, 0, 0, Math.PI*2);
                        ctx.fill();
                        
                        drawCube(v.x, wy, 12, v.w, v.h, v.d, v.color, '#333', '#222');
                    }

                    if (item.type === 'log') {
                        const l = item.obj;
                        const wy = -item.z * CONFIG.blockSize;
                        drawCube(l.x, wy, 6, l.len * CONFIG.blockSize, 14, 24, '#8D6E63', '#5D4037', '#4E342E');
                    }

                    if (item.type === 'player') {
                        const p = project(player.worldX, player.worldY, 0);
                        
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        
                        ctx.fillStyle = 'rgba(0,0,0,0.3)';
                        ctx.beginPath();
                        ctx.ellipse(0, 0, 18*p.scale, 9*p.scale, 0, 0, Math.PI*2);
                        ctx.fill();

                        const jumpScale = 1 + (player.z / 80);
                        ctx.scale(jumpScale, jumpScale);

                        ctx.rotate(player.rot);

                        const scaleY = player.squish;
                        const scaleX = 1 + (1 - player.squish) * 0.3;
                        ctx.scale(scaleX, scaleY);

                        // --- Draw Charming Animal (Chicken) ---
                        
                        ctx.fillStyle = '#FF9800';
                        ctx.fillRect(-8, 0, 4, 8);
                        ctx.fillRect(4, 0, 4, 8);

                        drawCube(0, 0, 15, 32, 32, 32, '#FFF', '#EEE', '#DDD');
                        drawCube(0, 0, 42, 24, 24, 24, '#FFF', '#EEE', '#DDD');

                        ctx.fillStyle = '#F44336';
                        ctx.beginPath();
                        ctx.arc(0, -24, 7*p.scale, 0, Math.PI*2);
                        ctx.fill();

                        ctx.fillStyle = '#FF9800';
                        ctx.beginPath();
                        ctx.moveTo(12, -12);
                        ctx.lineTo(20, -8);
                        ctx.lineTo(12, -4);
                        ctx.fill();

                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(10, -16, 2.5*p.scale, 0, Math.PI*2);
                        ctx.fill();

                        ctx.restore();
                    }
                });
                
                particles.forEach(p => {
                    const proj = project(p.x, p.y, p.z);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.beginPath();
                    ctx.arc(proj.x, proj.y, 4 * proj.scale, 0, Math.PI*2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                });
            },

            loop: () => {
                game.update();
                game.draw();
                requestAnimationFrame(game.loop);
            }
        };

        // Start
        game.init();

    </script>
</body>
