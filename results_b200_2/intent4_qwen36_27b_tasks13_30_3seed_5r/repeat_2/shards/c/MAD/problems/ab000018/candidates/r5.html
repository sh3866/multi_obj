<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crossy Road Style</title>
    <style>
        :root {
            --ui-font: 'Arial Black', 'Helvetica Neue', sans-serif;
            --ui-white: #FFFFFF;
            --ui-text: #37474F;
            --ui-shadow: #CFD8DC;
            --btn-base: #FFFFFF;
            --btn-dark: #B0BEC5;
            --btn-active: #ECEFF1;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #81D4FA 0%, #E1F5FE 100%);
            font-family: var(--ui-font);
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- UI Layer --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- HUD (Top Left/Right) --- */
        .hud-container {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .score-box {
            background: rgba(255, 255, 255, 0.9);
            color: var(--ui-text);
            padding: 10px 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 90px;
            box-shadow: 0 4px 0 var(--ui-shadow);
            transform: translateY(0);
            transition: transform 0.1s;
        }

        .score-box:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--ui-shadow);
        }

        .score-label {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            color: #90A4AE;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .score-val {
            font-size: 32px;
            font-weight: 900;
            color: #37474F;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        /* --- Controls (Bottom Right) --- */
        .controls-overlay {
            padding: 30px;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            pointer-events: none;
        }

        .dpad {
            position: relative;
            width: 160px;
            height: 160px;
            opacity: 0.95;
            /* Removed perspective skew for cleaner, modern look */
        }

        .dpad-btn {
            position: absolute;
            width: 54px;
            height: 54px;
            background: var(--btn-base);
            border: 1px solid #ECEFF1;
            box-shadow: 0 6px 0 var(--btn-dark);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.05s;
        }

        .dpad-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 var(--btn-dark);
            background: var(--btn-active);
        }

        /* D-pad Icons */
        .dpad-btn::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 3px solid #90A4AE;
            border-radius: 2px;
            opacity: 0.6;
        }

        /* Arrow shapes */
        .dpad-up::after { width: 12px; height: 12px; border-bottom: none; border-left: none; border-right: none; top: 40%; }
        .dpad-down::after { width: 12px; height: 12px; border-top: none; border-left: none; border-right: none; top: 60%; }
        .dpad-left::after { width: 12px; height: 12px; border-top: none; border-bottom: none; border-right: none; left: 40%; }
        .dpad-right::after { width: 12px; height: 12px; border-top: none; border-bottom: none; border-left: none; left: 60%; }

        .dpad-up { top: 0; left: 53px; }
        .dpad-down { bottom: 0; left: 53px; }
        .dpad-left { top: 53px; left: 0; }
        .dpad-right { top: 53px; right: 0; }
        
        .dpad-center { 
            top: 53px; left: 53px; 
            width: 54px; height: 54px; 
            background: rgba(255,255,255,0.3); 
            border-radius: 14px; 
            border: 1px solid rgba(255,255,255,0.5);
        }

        .tutorial-text {
            position: absolute;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 16px;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 30px;
            pointer-events: none;
            opacity: 0;
            animation: fadeIn 1s 1s forwards;
        }

        @keyframes fadeIn { to { opacity: 1; } }

    </style>
</head>
<body>

    <div id="ui-layer">
        <!-- HUD: Split Top -->
        <div class="hud-container">
            <div class="score-box">
                <div class="score-label">Score</div>
                <div class="score-val" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">Best</div>
                <div class="score-val" id="best">142</div>
            </div>
        </div>
        
        <div class="tutorial-text">TAP or SWIPE to move</div>

        <!-- Controls: Bottom Right -->
        <div class="controls-overlay">
            <div class="dpad">
                <div class="dpad-btn dpad-up" onclick="game.movePlayer(0, -1)"></div>
                <div class="dpad-btn dpad-left" onclick="game.movePlayer(-1, 0)"></div>
                <div class="dpad-center"></div>
                <div class="dpad-btn dpad-right" onclick="game.movePlayer(1, 0)"></div>
                <div class="dpad-btn dpad-down" onclick="game.movePlayer(0, 1)"></div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        /**
         * CROSSY ROAD STYLE - REVISED VISUALS
         */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height;

        // --- Configuration ---
        const CONFIG = {
            blockSize: 70, // Bigger blocks
            lanes: 20,
            drawDistance: 30,
            horizonY: 0.35,
            fov: 800,
            colors: {
                grassLight: '#8BC34A', // Vibrant Lime
                grassDark: '#7CB342',
                road: '#455A64',       // Dark Slate
                roadLine: '#FFFFFF',
                water: '#03A9F4',      // Bright Blue
                waterDark: '#0288D1',
                wood: '#8D6E63',
                woodDark: '#5D4037'
            }
        };

        // --- State ---
        let camera = { x: 0, y: 0 };
        let player = { 
            gridX: 0, 
            gridY: 0, 
            worldX: 0, 
            worldY: 0, 
            targetX: 0, 
            targetY: 0,
            z: 0, 
            squish: 1, 
            rot: 0, 
            targetRot: 0
        };
        let lanes = [];
        let score = 0;
        let time = 0;
        let particles = [];
        let clouds = [];

        // --- Resize Handling ---
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            camera.x = width / 2;
            
            if(clouds.length === 0) {
                for(let i=0; i<8; i++) {
                    clouds.push({
                        x: Math.random() * width,
                        y: Math.random() * (height * CONFIG.horizonY),
                        scale: Math.random() * 0.6 + 0.4,
                        speed: Math.random() * 0.8 + 0.2,
                        puffs: Math.floor(Math.random() * 3) + 2
                    });
                }
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Math Helpers ---
        const lerp = (a, b, t) => a + (b - a) * t;
        const rand = (min, max) => Math.random() * (max - min) + min;

        // Perspective Projection
        function project(x, y, z) {
            const cx = x - camera.x;
            const cy = y - camera.y;
            
            const scale = CONFIG.fov / (CONFIG.fov + cy + 300); 
            
            return {
                x: width/2 + cx * scale,
                y: (height * CONFIG.horizonY) + (cy + 300) * scale * 0.65, 
                scale: scale
            };
        }

        // --- Classes ---

        class Particle {
            constructor(x, y, z, color) {
                this.x = x; this.y = y; this.z = z;
                this.vx = rand(-4, 4);
                this.vy = rand(-4, 4);
                this.vz = rand(3, 6);
                this.life = 1.0;
                this.color = color;
                this.size = rand(4, 8);
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.z += this.vz;
                this.vz -= 0.2; // Gravity
                this.life -= 0.03;
            }
        }

        class Lane {
            constructor(gridY) {
                this.gridY = gridY;
                this.type = this.determineType(gridY);
                this.vehicles = [];
                this.logs = [];
                this.decorations = [];

                if (this.type === 'road') {
                    const count = Math.floor(rand(1, 3));
                    // Alternate directions based on lane index
                    const direction = (Math.floor(gridY / 3) % 2 === 0) ? 1 : -1; 
                    for(let i=0; i<count; i++) {
                        this.vehicles.push({
                            x: rand(-15, 15) * CONFIG.blockSize,
                            speed: rand(5, 9) * direction,
                            color: ['#FF5252', '#448AFF', '#FFEB3B', '#E040FB', '#FF9800'][Math.floor(Math.random()*5)],
                            w: rand(45, 60),
                            h: rand(30, 45),
                            d: rand(30, 40),
                            type: Math.random() > 0.7 ? 'truck' : 'car'
                        });
                    }
                } else if (this.type === 'water') {
                    const count = Math.floor(rand(2, 4));
                    const direction = (Math.floor(gridY / 3) % 2 === 0) ? 1 : -1;
                    for(let i=0; i<count; i++) {
                        this.logs.push({
                            x: rand(-15, 15) * CONFIG.blockSize,
                            speed: rand(2, 3.5) * direction,
                            len: rand(1.5, 3)
                        });
                    }
                } else {
                    // Grass Deco
                    const count = Math.floor(rand(0, 6));
                    for(let i=0; i<count; i++) {
                        this.decorations.push({
                            gx: Math.floor(rand(-8, 8)),
                            type: Math.random() > 0.6 ? 'tree' : 'bush',
                            scale: rand(0.8, 1.4)
                        });
                    }
                }
            }

            determineType(y) {
                if (y < 4) return 'grass';
                const mod = y % 6;
                if (mod === 0 || mod === 1) return 'water';
                if (mod === 2 || mod === 3 || mod === 4) return 'road';
                return 'grass';
            }

            update() {
                this.vehicles.forEach(v => {
                    v.x += v.speed;
                    const limit = 25 * CONFIG.blockSize;
                    if (v.speed > 0 && v.x > limit) v.x = -limit;
                    if (v.speed < 0 && v.x < -limit) v.x = limit;
                });

                this.logs.forEach(l => {
                    l.x += l.speed;
                    const limit = 20 * CONFIG.blockSize;
                    if (l.speed > 0 && l.x > limit) l.x = -limit;
                    if (l.speed < 0 && l.x < -limit) l.x = limit;
                });
            }
        }

        // --- Drawing Functions ---

        function drawCube(x, y, z, w, h, d, colorTop, colorSide, colorFront) {
            // Shadow on ground
            const pSh = project(x, y, 0);
            if (z > 0) {
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.beginPath();
                ctx.ellipse(pSh.x, pSh.y, (w/2)*pSh.scale, (d/2)*pSh.scale * 0.8, 0, 0, Math.PI*2);
                ctx.fill();
            }

            const cBot = project(x, y, 0);
            const cTop = project(x, y, z + h);
            
            const hw = (w/2) * cBot.scale;
            const hd = (d/2) * cBot.scale;
            const hTop = (w/2) * cTop.scale; 
            const dTop = (d/2) * cTop.scale;

            const botL = { x: cBot.x - hw, y: cBot.y };
            const botR = { x: cBot.x + hw, y: cBot.y };
            const botC = { x: cBot.x, y: cBot.y + hd }; 
            
            const topL = { x: cTop.x - hTop, y: cTop.y };
            const topR = { x: cTop.x + hTop, y: cTop.y };
            const topC = { x: cTop.x, y: cTop.y + dTop };

            // 1. Front Face
            ctx.fillStyle = colorFront;
            ctx.beginPath();
            ctx.moveTo(botL.x, botL.y);
            ctx.lineTo(botR.x, botR.y);
            ctx.lineTo(topR.x, topR.y);
            ctx.lineTo(topL.x, topL.y);
            ctx.fill();

            // 2. Right Face
            ctx.fillStyle = colorSide;
            ctx.beginPath();
            ctx.moveTo(botR.x, botR.y);
            ctx.lineTo(botC.x, botC.y);
            ctx.lineTo(topC.x, topC.y);
            ctx.lineTo(topR.x, topR.y);
            ctx.fill();

            // 3. Left Face (Darker side)
            ctx.fillStyle = adjustColor(colorSide, -15);
            ctx.beginPath();
            ctx.moveTo(botL.x, botL.y);
            ctx.lineTo(botC.x, botC.y);
            ctx.lineTo(topC.x, topC.y);
            ctx.lineTo(topL.x, topL.y);
            ctx.fill();

            // 4. Top Face
            ctx.fillStyle = colorTop;
            ctx.beginPath();
            ctx.moveTo(topL.x, topL.y);
            ctx.lineTo(topR.x, topR.y);
            ctx.lineTo(topC.x, topC.y);
            ctx.fill();
        }

        function adjustColor(color, amount) {
            return '#' + color.replace(/^#/, '').replace(/../g, color => ('0'+Math.min(255, Math.max(0, parseInt(color, 16) + amount)).toString(16)).substr(-2));
        }

        function drawTree(x, y, scale) {
            const trunkW = 16 * scale;
            const trunkH = 45 * scale;
            const trunkD = 16 * scale;
            
            // Trunk
            drawCube(x, y, 0, trunkW, trunkH, trunkD, '#795548', '#5D4037', '#4E342E');
            // Leaves 1
            drawCube(x, y, 35*scale, 50*scale, 40*scale, 50*scale, '#66BB6A', '#43A047', '#2E7D32');
            // Leaves 2 (Top)
            drawCube(x, y, 65*scale, 35*scale, 35*scale, 35*scale, '#81C784', '#4CAF50', '#388E3C');
        }

        function drawBush(x, y, scale) {
            drawCube(x, y, 0, 30*scale, 25*scale, 30*scale, '#AED581', '#9CCC65', '#7CB342');
        }

        function drawBackground() {
            // Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            clouds.forEach(c => {
                c.x += c.speed;
                if(c.x > width + 150) c.x = -150;
                
                ctx.save();
                ctx.translate(c.x, c.y);
                ctx.scale(c.scale, c.scale);
                
                for(let i=0; i<c.puffs; i++) {
                    ctx.beginPath();
                    ctx.arc(i*25 - 25, 0, 25 + Math.random()*10, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.restore();
            });
        }

        // --- Main Game Object ---

        const game = {
            init: () => {
                for(let i=-2; i<CONFIG.drawDistance; i++) {
                    lanes.push(new Lane(i));
                }
                
                // Input
                window.addEventListener('keydown', (e) => {
                    if(e.key === 'ArrowUp') game.movePlayer(0, -1);
                    if(e.key === 'ArrowDown') game.movePlayer(0, 1);
                    if(e.key === 'ArrowLeft') game.movePlayer(-1, 0);
                    if(e.key === 'ArrowRight') game.movePlayer(1, 0);
                });

                // Touch / Swipe
                let touchStartX = 0;
                let touchStartY = 0;
                window.addEventListener('touchstart', e => {
                    touchStartX = e.changedTouches[0].screenX;
                    touchStartY = e.changedTouches[0].screenY;
                }, {passive: false});

                window.addEventListener('touchend', e => {
                    const touchEndX = e.changedTouches[0].screenX;
                    const touchEndY = e.changedTouches[0].screenY;
                    const dx = touchEndX - touchStartX;
                    const dy = touchEndY - touchStartY;

                    if (Math.abs(dx) > Math.abs(dy)) {
                        if (Math.abs(dx) > 30) game.movePlayer(dx > 0 ? 1 : -1, 0);
                    } else {
                        if (Math.abs(dy) > 30) game.movePlayer(0, dy > 0 ? 1 : -1);
                    }
                }, {passive: false});

                requestAnimationFrame(game.loop);
            },

            movePlayer: (dx, dy) => {
                if (Math.abs(player.worldX - player.targetX) > 10 || Math.abs(player.worldY - player.targetY) > 10) return;

                const newGX = player.gridX + dx;
                const newGY = player.gridY + dy;

                player.gridX = newGX;
                player.gridY = newGY;

                player.targetX = newGX * CONFIG.blockSize;
                player.targetY = -newGY * CONFIG.blockSize;

                player.squish = 0.7;
                
                if (dx > 0) player.targetRot = Math.PI / 2;
                if (dx < 0) player.targetRot = -Math.PI / 2;
                if (dy < 0) player.targetRot = 0; 
                if (dy > 0) player.targetRot = Math.PI; 

                if (dy === -1) {
                    score++;
                    document.getElementById('score').innerText = score;
                    const highestY = lanes[lanes.length-1].gridY;
                    lanes.push(new Lane(highestY + 1));
                    lanes.shift(); 
                }
                
                for(let i=0; i<8; i++) {
                    particles.push(new Particle(player.worldX, player.worldY, 0, 'rgba(255,255,255,0.8)'));
                }
            },

            update: () => {
                time += 16;

                player.worldX = lerp(player.worldX, player.targetX, 0.25);
                player.worldY = lerp(player.worldY, player.targetY, 0.25);
                player.squish = lerp(player.squish, 1, 0.1);
                player.rot = lerp(player.rot, player.targetRot, 0.2);

                // Jump arc
                const dist = Math.sqrt(Math.pow(player.targetX - player.worldX, 2) + Math.pow(player.targetY - player.worldY, 2));
                player.z = Math.sin(dist * 0.06) * 30;

                // Camera follow
                const targetCamX = player.worldX * 0.8;
                const targetCamY = -player.gridY * CONFIG.blockSize * 0.8;

                camera.x = lerp(camera.x, targetCamX, 0.1);
                camera.y = lerp(camera.y, targetCamY, 0.1);

                lanes.forEach(lane => lane.update());

                // Water Logic
                const currentLane = lanes.find(l => l.gridY === player.gridY);
                if (currentLane && currentLane.type === 'water') {
                    let onLog = false;
                    currentLane.logs.forEach(log => {
                        const logW = log.len * CONFIG.blockSize;
                        if (player.worldX > log.x - logW/2 && player.worldX < log.x + logW/2) {
                            onLog = true;
                            player.worldX += log.speed;
                            player.targetX = player.worldX;
                        }
                    });
                    if (!onLog && player.z < 5) player.squish = 0.2;
                }

                particles.forEach((p, i) => {
                    p.update();
                    if(p.life <= 0) particles.splice(i, 1);
                });
            },

            draw: () => {
                ctx.clearRect(0, 0, width, height);
                drawBackground();

                let drawables = [];

                lanes.forEach(l => {
                    drawables.push({ type: 'lane', obj: l, z: l.gridY });
                    l.decorations.forEach(d => {
                        drawables.push({ type: 'deco', obj: d, z: l.gridY });
                    });
                    l.vehicles.forEach(v => {
                        drawables.push({ type: 'vehicle', obj: v, z: l.gridY });
                    });
                    l.logs.forEach(lg => {
                        drawables.push({ type: 'log', obj: lg, z: l.gridY });
                    });
                });

                drawables.push({ type: 'player', z: player.gridY });

                // Sort by Z (Painter's Algorithm)
                drawables.sort((a, b) => b.z - a.z);

                drawables.forEach(item => {
                    if (item.type === 'lane') {
                        const l = item.obj;
                        const y = l.gridY;
                        
                        for(let x = -12; x <= 12; x++) {
                            const wx = x * CONFIG.blockSize;
                            const wy = -y * CONFIG.blockSize;
                            
                            let topCol, sideCol;
                            if (l.type === 'grass') {
                                const isAlt = (x + y) % 2 === 0;
                                topCol = isAlt ? CONFIG.colors.grassLight : CONFIG.colors.grassDark;
                                sideCol = '#558B2F';
                            } else if (l.type === 'road') {
                                topCol = CONFIG.colors.road;
                                sideCol = '#263238';
                            } else {
                                const wave = Math.sin(time * 0.005 + x + y) * 2;
                                topCol = CONFIG.colors.water;
                                sideCol = CONFIG.colors.waterDark;
                            }

                            drawCube(wx, wy, 0, CONFIG.blockSize, 15, CONFIG.blockSize, topCol, sideCol, sideCol);

                            if (l.type === 'road' && (x+y)%2===0) {
                                const p = project(wx, wy, 1);
                                ctx.fillStyle = CONFIG.colors.roadLine;
                                ctx.fillRect(p.x - 10*p.scale, p.y - 2*p.scale, 20*p.scale, 4*p.scale);
                            }
                        }
                    }

                    if (item.type === 'deco') {
                        const d = item.obj;
                        const wx = d.gx * CONFIG.blockSize;
                        const wy = -item.z * CONFIG.blockSize;
                        if (d.type === 'tree') drawTree(wx, wy, d.scale);
                        else drawBush(wx, wy, d.scale);
                    }

                    if (item.type === 'vehicle') {
                        const v = item.obj;
                        const wy = -item.z * CONFIG.blockSize;
                        // Shadow handled by drawCube
                        
                        // Draw Car Body
                        drawCube(v.x, wy, 12, v.w, v.h, v.d, v.color, adjustColor(v.color, -20), adjustColor(v.color, -40));
                        
                        // Draw Windows (Simple black rect)
                        const pWin = project(v.x, wy, 12 + v.h/2);
                        ctx.fillStyle = '#CFD8DC';
                        ctx.fillRect(pWin.x - v.w*0.3*pWin.scale, pWin.y - 5*pWin.scale, v.w*0.6*pWin.scale, 5*pWin.scale);
                    }

                    if (item.type === 'log') {
                        const l = item.obj;
                        const wy = -item.z * CONFIG.blockSize;
                        drawCube(l.x, wy, 6, l.len * CONFIG.blockSize, 14, 24, CONFIG.colors.wood, CONFIG.colors.woodDark, adjustColor(CONFIG.colors.woodDark, -20));
                    }

                    if (item.type === 'player') {
                        const p = project(player.worldX, player.worldY, 0);
                        
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        
                        // Jump scale effect
                        const jumpScale = 1 + (player.z / 80);
                        ctx.scale(jumpScale, jumpScale);

                        ctx.rotate(player.rot);

                        const scaleY = player.squish;
                        const scaleX = 1 + (1 - player.squish) * 0.3;
                        ctx.scale(scaleX, scaleY);

                        // --- Draw Charming Animal (Chicken) ---
                        
                        // Feet
                        ctx.fillStyle = '#FF9800';
                        ctx.fillRect(-8, -2, 4, 8);
                        ctx.fillRect(4, -2, 4, 8);

                        // Body (White Cube)
                        drawCube(0, 0, 15, 34, 34, 34, '#FFF', '#EEE', '#DDD');
                        // Head
                        drawCube(0, 0, 44, 26, 26, 26, '#FFF', '#EEE', '#DDD');

                        // Comb (Red Top)
                        ctx.fillStyle = '#F44336';
                        ctx.beginPath();
                        ctx.arc(0, -24, 8*p.scale, 0, Math.PI*2);
                        ctx.fill();

                        // Beak
                        ctx.fillStyle = '#FFC107';
                        ctx.beginPath();
                        ctx.moveTo(12, -12);
                        ctx.lineTo(22, -8);
                        ctx.lineTo(12, -4);
                        ctx.fill();

                        // Eye
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(10, -16, 2.5*p.scale, 0, Math.PI*2);
                        ctx.fill();

                        ctx.restore();
                    }
                });
                
                particles.forEach(p => {
                    const proj = project(p.x, p.y, p.z);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.beginPath();
                    ctx.arc(proj.x, proj.y, 4 * proj.scale, 0, Math.PI*2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                });
            },

            loop: () => {
                game.update();
                game.draw();
                requestAnimationFrame(game.loop);
            }
        };

        // Start
        game.init();

    </script>
</body>
</html>
