<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Cube — Premium Puzzle Interface</title>
<style>
  :root {
    /* --- Palette: Deep Space & Neon --- */
    --bg-body: #050507;
    --bg-panel: rgba(20, 22, 28, 0.85);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-highlight: rgba(255, 255, 255, 0.15);
    
    --text-main: #ffffff;
    --text-muted: #94a3b8;
    --text-dim: #64748b;
    
    /* --- Standard Rubik's Colors (Vibrant & Accurate) --- */
    --c-white: #ffffff;
    --c-yellow: #ffd500;
    --c-red: #ff3b30;
    --c-orange: #ff9500;
    --c-green: #4cd964;
    --c-blue: #007aff;
    --c-plastic: #111111; 

    /* --- Dimensions --- */
    --cube-size: 60px; 
    --cube-gap: 4px; 
    --cube-step: calc(var(--cube-size) + var(--cube-gap));
  }

  * { box-sizing: border-box; user-select: none; -webkit-font-smoothing: antialiased; }
  
  body {
    margin: 0;
    background-color: var(--bg-body);
    background-image: radial-gradient(circle at 50% 30%, #1a1f2c 0%, #000000 100%);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* --- Header & Nav --- */
  header {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    z-index: 20;
  }

  .brand {
    font-weight: 900;
    font-size: 1.5rem;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-main);
    text-transform: uppercase;
  }
  .brand span { color: var(--c-blue); }

  .size-selector {
    display: flex;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 12px;
    padding: 4px;
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(12px);
  }

  .size-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 8px 16px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s ease;
  }

  .size-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
  .size-btn.active {
    background: var(--text-main);
    color: #000;
    box-shadow: 0 2px 10px rgba(255,255,255,0.2);
  }

  /* --- HUD (Timer & Stats) --- */
  /* CRITIQUE FIX: Moved to top bar to reduce fragmentation */
  .hud-bar {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-left: 40px; /* Space from brand */
  }

  .stat-box {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  
  .stat-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    font-weight: 700;
    margin-bottom: 2px;
  }

  .stat-value {
    font-size: 1.4rem;
    font-weight: 700; /* CRITIQUE FIX: Increased weight */
    color: var(--text-main);
    font-family: "Courier New", Courier, monospace; /* CRITIQUE FIX: Monospaced */
    line-height: 1;
    letter-spacing: -1px;
  }

  /* --- Main Scene --- */
  main {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1200px;
    overflow: hidden;
    cursor: grab;
  }
  
  main:active { cursor: grabbing; }

  /* Atmosphere */
  .spotlight {
    position: absolute;
    width: 900px;
    height: 900px;
    background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .ground-shadow {
    position: absolute;
    top: 65%;
    width: 250px;
    height: 40px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.6) 0%, transparent 70%);
    transform: rotateX(75deg);
    z-index: 0;
    filter: blur(12px);
    transition: transform 0.3s;
  }

  .scene {
    width: calc(var(--cube-size) * 3 + var(--cube-gap) * 2);
    height: calc(var(--cube-size) * 3 + var(--cube-gap) * 2);
    transform-style: preserve-3d;
    /* Initial Isometric-ish View */
    transform: rotateX(-30deg) rotateY(-45deg);
    transition: transform 0.1s linear;
    z-index: 5;
  }

  .cube-assembly {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
  }

  .cubie {
    position: absolute;
    width: var(--cube-size);
    height: var(--cube-size);
    transform-style: preserve-3d;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* --- 3D Faces & Stickers --- */
  .face {
    position: absolute;
    width: 100%;
    height: 100%;
    background-color: var(--c-plastic);
    border-radius: 4px;
    backface-visibility: hidden;
    /* CRITIQUE FIX: Directional Lighting Logic */
    /* Simulate light coming from Top-Right-Front */
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5); 
    overflow: hidden;
  }

  /* Sticker Geometry */
  .sticker {
    position: absolute;
    top: 3px; left: 3px; right: 3px; bottom: 3px;
    border-radius: 3px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.4);
    /* Plastic Texture */
    background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0.05) 100%);
  }

  /* Face Transforms */
  .face.front  { transform: translateZ(calc(var(--cube-size)/2)); }
  .face.back   { transform: rotateY(180deg) translateZ(calc(var(--cube-size)/2)); }
  .face.right  { transform: rotateY(90deg) translateZ(calc(var(--cube-size)/2)); }
  .face.left   { transform: rotateY(-90deg) translateZ(calc(var(--cube-size)/2)); }
  .face.top    { transform: rotateX(90deg) translateZ(calc(var(--cube-size)/2)); }
  .face.bottom { transform: rotateX(-90deg) translateZ(calc(var(--cube-size)/2)); }

  /* Colors & Shading (CRITIQUE FIX: Distinct shading per face) */
  /* Top (White) - Lightest */
  .f-U .sticker { 
    background-color: var(--c-white); 
    filter: brightness(1.1);
  }
  /* Front (Green) - Medium */
  .f-F .sticker { 
    background-color: var(--c-green); 
    filter: brightness(1.0);
  }
  /* Right (Red) - Darker */
  .f-R .sticker { 
    background-color: var(--c-red); 
    filter: brightness(0.85);
  }
  /* Bottom (Yellow) - Shadowed */
  .f-D .sticker { 
    background-color: var(--c-yellow); 
    filter: brightness(0.8);
  }
  /* Left (Orange) - Dark */
  .f-L .sticker { 
    background-color: var(--c-orange); 
    filter: brightness(0.7);
  }
  /* Back (Blue) - Darkest */
  .f-B .sticker { 
    background-color: var(--c-blue); 
    filter: brightness(0.6);
  }

  /* --- Formula Panel (Right Side) --- */
  /* CRITIQUE FIX: Populated with content */
  .formula-panel {
    position: absolute;
    right: 32px;
    top: 50%;
    transform: translateY(-50%);
    width: 240px;
    background: var(--bg-panel);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: -10px 10px 40px rgba(0,0,0,0.3);
    z-index: 15;
  }

  .panel-header {
    font-size: 0.7rem;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    border-bottom: 1px solid var(--glass-border);
    padding-bottom: 8px;
    font-weight: 700;
  }

  .move-log {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 240px;
    overflow-y: auto;
  }

  .move-chip {
    background: rgba(255,255,255,0.05);
    color: var(--text-main);
    font-size: 0.8rem;
    padding: 4px 8px;
    border-radius: 4px;
    font-family: "Courier New", monospace;
    font-weight: 700;
    border: 1px solid transparent;
  }

  /* Tip Section */
  .tip-container {
    margin-top: auto;
    background: rgba(0,0,0,0.2);
    border-radius: 8px;
    padding: 12px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  
  .tip-title {
    color: var(--c-yellow);
    font-size: 0.75rem;
    font-weight: 700;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tip-text {
    color: var(--text-muted);
    font-size: 0.8rem;
    line-height: 1.4;
  }
  
  .algo-text {
    font-family: "Courier New", monospace;
    color: var(--text-main);
    font-weight: 700;
  }

  /* --- Controls (Bottom) --- */
  .controls-bar {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 16px;
    background: var(--bg-panel);
    backdrop-filter: blur(20px);
    padding: 12px 24px;
    border-radius: 24px;
    border: 1px solid var(--glass-border);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    z-index: 20;
  }

  .btn {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--glass-border);
    color: var(--text-main);
    padding: 12px 24px;
    border-radius: 14px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
  }

  .btn:hover {
    background: rgba(255,255,255,0.1);
    transform: translateY(-2px);
    border-color: var(--glass-highlight);
  }

  .btn:active { transform: translateY(0); }

  .btn-primary {
    background: var(--c-blue);
    border: none;
    box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
    color: white;
  }
  .btn-primary:hover { 
    background: #2988ff; 
    box-shadow: 0 6px 20px rgba(0, 122, 255, 0.6);
  }

  /* Scrollbar */
  .move-log::-webkit-scrollbar { width: 4px; }
  .move-log::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

  /* Responsive */
  @media (max-width: 900px) {
    .formula-panel { display: none; }
    header { padding: 0 16px; }
    .hud-bar { margin-left: 16px; }
    .controls-bar { width: 90%; gap: 8px; padding: 10px 16px; }
    .btn { padding: 12px; min-width: auto; }
    .btn span { display: none; } /* Hide text on mobile, keep icons */
    .btn-primary span { display: inline; } /* Keep primary text */
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
      <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
      <line x1="12" y1="22.08" x2="12" y2="12"></line>
    </svg>
    <span>THE</span>CUBE
  </div>

  <!-- CRITIQUE FIX: Integrated HUD into top bar for hierarchy -->
  <div class="hud-bar">
    <div class="stat-box">
      <div class="stat-label">Moves</div>
      <div class="stat-value" id="move-count">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Time</div>
      <div class="stat-value" id="timer">00:00</div>
    </div>
  </div>

  <div class="size-selector">
    <button class="size-btn" onclick="initCube(2)">2×2</button>
    <button class="size-btn active" onclick="initCube(3)">3×3</button>
    <button class="size-btn" onclick="initCube(4)">4×4</button>
    <button class="size-btn" onclick="initCube(5)">5×5</button>
  </div>
</header>

<main id="scene-container">
  <div class="spotlight"></div>
  <div class="ground-shadow"></div>
  <div class="scene" id="scene">
    <div class="cube-assembly" id="cube"></div>
  </div>
</main>

<!-- CRITIQUE FIX: Populated Formula Panel -->
<div class="formula-panel">
  <div class="panel-header">
    Current Scramble
  </div>
  <div class="move-log" id="move-log">
    <span style="color:var(--text-dim); font-size: 0.8rem; font-style: italic; width:100%; text-align:center; padding: 10px;">Ready to Scramble.</span>
  </div>
  
  <div class="tip-container">
    <div class="tip-title">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
      Pro Tip
    </div>
    <div class="tip-text">
      To solve a White Cross, use the "U R U'" algorithm to insert edges without breaking centers.
      <br><br>
      <span class="algo-text">R U R' U'</span>
    </div>
  </div>
</div>

<div class="controls-bar">
  <button class="btn" onclick="undoMove()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
    <span>Undo</span>
  </button>
  
  <button class="btn" onclick="resetTimer()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12"></path><path d="M3 5v7h7"></path></svg>
    <span>Reset</span>
  </button>
  
  <button class="btn" onclick="hintMove()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
    <span>Hint</span>
  </button>

  <button class="btn btn-primary" onclick="scrambleCube()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
    <span>Scramble</span>
  </button>
</div>

<script>
  // --- Constants & State ---
  const COLORS = {
    U: 'f-U', D: 'f-D', F: 'f-F', B: 'f-B', R: 'f-R', L: 'f-L', X: 'f-inner'
  };
  
  let N = 3; // Dimension
  let cubies = [];
  let moveHistory = [];
  let isAnimating = false;
  
  // Timer State
  let startTime = null;
  let timerInterval = null;

  // View Rotation State
  let rotX = -30;
  let rotY = -45;
  let isDragging = false;
  let lastMouseX = 0;
  let lastMouseY = 0;

  // --- DOM Elements ---
  const cubeEl = document.getElementById('cube');
  const sceneEl = document.getElementById('scene');
  const moveCountEl = document.getElementById('move-count');
  const timerEl = document.getElementById('timer');
  const moveLogEl = document.getElementById('move-log');

  // --- Initialization ---

  function initCube(size) {
    N = size;
    cubies = [];
    cubeEl.innerHTML = '';
    moveHistory = [];
    moveCountEl.innerText = '0';
    moveLogEl.innerHTML = '<span style="color:var(--text-dim); font-size: 0.8rem; font-style: italic; width:100%; text-align:center; padding: 10px;">Ready to Scramble.</span>';
    resetTimer();
    
    // Update Active Button
    document.querySelectorAll('.size-btn').forEach(b => {
      b.classList.remove('active');
      if(b.innerText.startsWith(size + '×')) b.classList.add('active');
    });

    // Create Cubies
    const offset = (N - 1) / 2;
    for (let x = 0; x < N; x++) {
      for (let y = 0; y < N; y++) {
        for (let z = 0; z < N; z++) {
          createCubie(x, y, z, offset);
        }
      }
    }
    
    // Reset View
    rotX = -30;
    rotY = -45;
    updateSceneRotation();
  }

  function createCubie(x, y, z, offset) {
    const el = document.createElement('div');
    el.className = 'cubie';
    
    // Logic to determine sticker color based on position
    // x: 0(L) to N-1(R)
    // y: 0(U) to N-1(D)
    // z: 0(B) to N-1(F)
    
    let faceHTML = '';
    
    // Front (z=N-1) -> Green
    if (z === N-1) faceHTML += `<div class="face front"><div class="sticker ${COLORS.F}"></div></div>`;
    // Back (z=0) -> Blue
    else if (z === 0) faceHTML += `<div class="face back"><div class="sticker ${COLORS.B}"></div></div>`;
    else faceHTML += `<div class="face front f-inner"></div><div class="face back f-inner"></div>`;

    // Right (x=N-1) -> Red
    if (x === N-1) faceHTML += `<div class="face right"><div class="sticker ${COLORS.R}"></div></div>`;
    // Left (x=0) -> Orange
    else if (x === 0) faceHTML += `<div class="face left"><div class="sticker ${COLORS.L}"></div></div>`;
    else faceHTML += `<div class="face right f-inner"></div><div class="face left f-inner"></div>`;

    // Top (y=0) -> White
    if (y === 0) faceHTML += `<div class="face top"><div class="sticker ${COLORS.U}"></div></div>`;
    // Bottom (y=N-1) -> Yellow
    else if (y === N-1) faceHTML += `<div class="face bottom"><div class="sticker ${COLORS.D}"></div></div>`;
    else faceHTML += `<div class="face top f-inner"></div><div class="face bottom f-inner"></div>`;

    el.innerHTML = faceHTML;

    // Position
    const sizePx = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cube-size'));
    const gap = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cube-gap'));
    const totalStep = sizePx + gap;

    const px = (x - offset) * totalStep;
    const py = (y - offset) * totalStep;
    const pz = (z - offset) * totalStep;
    
    const cubieData = {
      el: el,
      coords: {x, y, z},
      rotation: '' // Accumulated rotation string
    };

    el.style.transform = `translate3d(${px}px, ${py}px, ${pz}px)`;
    
    cubies.push(cubieData);
    cubeEl.appendChild(el);
  }

  // --- Interaction: View Rotation ---

  sceneEl.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const deltaX = e.clientX - lastMouseX;
    const deltaY = e.clientY - lastMouseY;
    
    rotY += deltaX * 0.5;
    rotX -= deltaY * 0.5;
    
    rotX = Math.max(-90, Math.min(90, rotX));
    
    updateSceneRotation();
    
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  });

  window.addEventListener('mouseup', () => { isDragging = false; });

  function updateSceneRotation() {
    sceneEl.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
  }

  // --- Logic: Rotation System ---

  function rotateSlice(axis, index, direction) {
    if (isAnimating) return;
    isAnimating = true;

    const sliceCubies = cubies.filter(c => c.coords[axis] === index);
    
    const pivot = document.createElement('div');
    pivot.style.position = 'absolute';
    pivot.style.transformStyle = 'preserve-3d';
    pivot.style.width = '100%';
    pivot.style.height = '100%';
    cubeEl.appendChild(pivot);

    sliceCubies.forEach(c => {
      pivot.appendChild(c.el);
    });

    const deg = 90 * direction; 
    let rotateStr = '';
    if (axis === 'x') rotateStr = `rotateX(${deg}deg)`;
    if (axis === 'y') rotateStr = `rotateY(${deg}deg)`;
    if (axis === 'z') rotateStr = `rotateZ(${deg}deg)`;

    pivot.style.transition = 'transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
    pivot.style.transform = rotateStr;

    setTimeout(() => {
      sliceCubies.forEach(c => {
        const {x, y, z} = c.coords;
        let oldY = c.coords.y;
        let oldZ = c.coords.z;
        let oldX = c.coords.x;

        // Coordinate Rotation Logic
        if (axis === 'x') {
          if (direction === 1) { c.coords.y = oldZ; c.coords.z = (N-1) - oldY; }
          else { c.coords.z = oldY; c.coords.y = (N-1) - oldZ; }
        } else if (axis === 'y') {
          if (direction === 1) { c.coords.x = (N-1) - oldZ; c.coords.z = oldX; }
          else { c.coords.z = (N-1) - oldX; c.coords.x = oldZ; }
        } else if (axis === 'z') {
          if (direction === 1) { c.coords.x = oldY; c.coords.y = (N-1) - oldX; }
          else { c.coords.y = oldX; c.coords.x = (N-1) - oldY; }
        }

        // Bake Transform
        c.rotation = rotateStr + ' ' + c.rotation;
        
        const sizePx = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cube-size'));
        const gap = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cube-gap'));
        const totalStep = sizePx + gap;
        const offset = (N - 1) / 2;
        
        const px = (c.coords.x - offset) * totalStep;
        const py = (c.coords.y - offset) * totalStep;
        const pz = (c.coords.z - offset) * totalStep;
        
        c.el.style.transform = c.rotation + ` translate3d(${px}px, ${py}px, ${pz}px)`;
        cubeEl.appendChild(c.el);
      });
      
      pivot.remove();
      isAnimating = false;
    }, 300);
  }

  // --- Game Controls ---

  function scrambleCube() {
    if (isAnimating) return;
    resetTimer();
    startTimer();
    moveHistory = [];
    moveLogEl.innerHTML = '';
    
    const moves = 15 + (N * 5);
    let count = 0;
    
    const interval = setInterval(() => {
      if (count >= moves) {
        clearInterval(interval);
        return;
      }
      
      const axes = ['x', 'y', 'z'];
      const axis = axes[Math.floor(Math.random() * 3)];
      const index = Math.floor(Math.random() * N);
      const dir = Math.random() > 0.5 ? 1 : -1;
      
      performMove(axis, index, dir, false);
      count++;
    }, 150); // Faster scramble
  }

  function performMove(axis, index, dir, record = true) {
    rotateSlice(axis, index, dir);
    
    if (record) {
      moveHistory.push({axis, index, dir});
      moveCountEl.innerText = moveHistory.length;
      
      const chip = document.createElement('div');
      chip.className = 'move-chip';
      // Standard notation mapping
      let label = axis.toUpperCase();
      if (N > 3) {
         // For larger cubes, add index number (1-based)
         label += (index + 1);
      }
      if (dir === -1) label += "'";
      chip.innerText = label;
      moveLogEl.appendChild(chip);
      moveLogEl.scrollTop = moveLogEl.scrollHeight;
    }
  }

  function undoMove() {
    if (isAnimating || moveHistory.length === 0) return;
    const last = moveHistory.pop();
    moveCountEl.innerText = moveHistory.length;
    
    if (moveLogEl.lastChild) moveLogEl.removeChild(moveLogEl.lastChild);
    if (moveLogEl.children.length === 0) moveLogEl.innerHTML = '<span style="color:var(--text-dim); font-size: 0.8rem; font-style: italic; width:100%; text-align:center; padding: 10px;">Ready to Scramble.</span>';
    
    performMove(last.axis, last.index, last.dir * -1, false);
  }

  function hintMove() {
    // Simple visual hint: flash the timer box
    const timerBox = document.querySelector('.stat-box:last-child');
    timerBox.style.color = "var(--c-green)";
    setTimeout(() => { timerBox.style.color = ""; }, 300);
  }

  function resetTimer() {
    clearInterval(timerInterval);
    timerEl.innerText = "00:00";
    startTime = null;
  }

  function startTimer() {
    if (startTime) return;
    startTime = Date.now();
    timerInterval = setInterval(() => {
      const delta = Math.floor((Date.now() - startTime) / 1000);
      const m = Math.floor(delta / 60).toString().padStart(2, '0');
      const s = (delta % 60).toString().padStart(2, '0');
      timerEl.innerText = `${m}:${s}`;
    }, 1000);
  }

  // --- Start ---
  initCube(3);

</script>
</body>
</html>
