<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Royal Metro | Auto Rickshaw Showcase</title>
    <style>
        :root {
            /* Palette - Light/Warm Street Theme */
            --bg-warm: #f2f0e9;
            --bg-accent: #eaddcf;
            --text-main: #2c3e50;
            --text-muted: #5d6d7e;
            --panel-bg: rgba(255, 255, 255, 0.85);
            --panel-border: rgba(255, 255, 255, 0.9);
            
            /* Vehicle Colors (Dynamic) */
            --car-primary: #f4d03f;
            --car-secondary: #d4ac0d;
            --car-dark: #1a1a1a;

            /* Typography */
            --font-display: 'Arial Black', Impact, sans-serif;
            --font-body: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-warm);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Texture Overlay for "Street" Vibe */
        .texture-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: -1;
        }

        /* Sunburst Background Effect */
        .bg-atmosphere {
            position: absolute;
            width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 50% 40%, rgba(255,255,255,0.9) 0%, transparent 60%),
                conic-gradient(from 180deg at 50% 50%, rgba(244, 208, 63, 0.1) 0deg, transparent 60deg, rgba(244, 208, 63, 0.1) 120deg, transparent 180deg, rgba(244, 208, 63, 0.1) 240deg, transparent 300deg);
            z-index: -2;
        }

        /* Main Layout Container */
        .showcase-container {
            width: 95vw;
            height: 90vh;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Left: Visual Stage (Dominant) */
        .visual-stage {
            flex: 2.5;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Right: Info Sidebar (Refined) */
        .info-sidebar {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(0,0,0,0.05);
            box-shadow: -10px 0 40px rgba(0,0,0,0.05);
            position: relative;
            z-index: 10;
        }

        /* Typography */
        .brand-tag {
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 15px;
            display: inline-block;
            border-bottom: 2px solid var(--car-primary);
            padding-bottom: 5px;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 4.5rem;
            line-height: 0.9;
            text-transform: uppercase;
            margin-bottom: 25px;
            color: var(--text-main);
            letter-spacing: -1px;
        }

        h1 span {
            color: var(--car-primary);
            -webkit-text-stroke: 1px var(--text-main);
        }

        .description {
            color: var(--text-muted);
            line-height: 1.7;
            font-size: 1.05rem;
            margin-bottom: 40px;
            max-width: 400px;
        }

        /* Specs Grid */
        .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 40px;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
        }

        .spec-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #95a5a6;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .spec-value {
            font-weight: 600;
            color: var(--text-main);
            font-size: 1.1rem;
        }

        /* Controls */
        .controls-area {
            background: rgba(255,255,255,0.5);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .control-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-main);
            margin-bottom: 15px;
            display: block;
        }

        .color-options {
            display: flex;
            gap: 12px;
        }

        .color-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid rgba(0,0,0,0.1);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .color-btn:hover { transform: scale(1.15); }
        
        .color-btn.active {
            border-color: var(--text-main);
            transform: scale(1.1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* SVG Styling */
        #rickshaw-svg {
            width: 110%; /* Oversized to fill space */
            height: 100%;
            overflow: visible;
            /* Subtle float animation */
            animation: float 6s ease-in-out infinite;
            filter: drop-shadow(0px 20px 20px rgba(0,0,0,0.15));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(0.5deg); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .showcase-container { flex-direction: column; height: 95vh; }
            .visual-stage { height: 50%; flex: none; }
            .info-sidebar { height: 50%; flex: none; border-left: none; border-top: 1px solid rgba(0,0,0,0.05); padding: 30px; }
            h1 { font-size: 3rem; }
            .specs-grid { grid-template-columns: 1fr; gap: 15px; margin-bottom: 20px; }
            #rickshaw-svg { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="bg-atmosphere"></div>
    <div class="texture-overlay"></div>

    <div class="showcase-container">
        <!-- Visual Area -->
        <div class="visual-stage">
            <!-- 
                Completely Reconstructed SVG for 3/4 Perspective 
                Focus: Geometry, Layering, Shading, Details
            -->
            <svg id="rickshaw-svg" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Body Gradient (Left Highlight / Right Shadow) -->
                    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:var(--car-primary);stop-opacity:1" />
                        <stop offset="40%" style="stop-color:var(--car-primary);stop-opacity:1" />
                        <stop offset="100%" style="stop-color:var(--car-secondary);stop-opacity:1" />
                    </linearGradient>

                    <!-- Dark Body Gradient (Mudguards/Chassis) -->
                    <linearGradient id="dark-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
                    </linearGradient>

                    <!-- Roof Gradient (Top Light) -->
                    <linearGradient id="roof-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#34495e;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
                    </linearGradient>

                    <!-- Chrome/Metal Gradient -->
                    <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#bdc3c7;stop-opacity:1" />
                        <stop offset="20%" style="stop-color:#ffffff;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#7f8c8d;stop-opacity:1" />
                        <stop offset="80%" style="stop-color:#ffffff;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#95a5a6;stop-opacity:1" />
                    </linearGradient>

                    <!-- Glass Gradient -->
                    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#5dade2;stop-opacity:0.6" />
                        <stop offset="100%" style="stop-color:#2874a6;stop-opacity:0.3" />
                    </linearGradient>

                    <!-- Tire Gradient -->
                    <radialGradient id="tire-grad" cx="50%" cy="50%" r="50%">
                        <stop offset="80%" style="stop-color:#2c3e50;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#000;stop-opacity:1" />
                    </radialGradient>

                    <!-- Headlight Glow -->
                    <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
                        <stop offset="40%" style="stop-color:#f1c40f;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#f1c40f;stop-opacity:0" />
                    </radialGradient>

                    <!-- Filters -->
                    <filter id="canopy-shadow" x="-10%" y="-10%" width="120%" height="120%">
                        <feGaussianBlur stdDeviation="6" result="blur"/>
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.4" />
                        </feComponentTransfer>
                    </filter>
                </defs>

                <!-- Ground Shadow -->
                <ellipse cx="420" cy="550" rx="280" ry="35" fill="rgba(0,0,0,0.2)" filter="blur(8px)" />

                <g id="rickshaw-group">
                    
                    <!-- 1. REAR WHEELS -->
                    <!-- Left Rear (Closer) -->
                    <g transform="translate(320, 490)">
                        <!-- Tire -->
                        <circle cx="0" cy="0" r="65" fill="url(#tire-grad)" stroke="#111" stroke-width="2"/>
                        <!-- Rim -->
                        <circle cx="0" cy="0" r="45" fill="#34495e" stroke="#555" stroke-width="1"/>
                        <!-- Spokes -->
                        <g stroke="#2c3e50" stroke-width="4">
                            <path d="M0,-45 L0,45 M-45,0 L45,0 M-32,-32 L32,32 M-32,32 L32,-32" />
                        </g>
                        <!-- Hub -->
                        <circle cx="0" cy="0" r="12" fill="#7f8c8d" />
                        <!-- Mudguard -->
                        <path d="M-65,10 A65,65 0 0,1 65,10" fill="none" stroke="url(#dark-grad)" stroke-width="14" stroke-linecap="round"/>
                    </g>

                    <!-- Right Rear (Further) -->
                    <g transform="translate(520, 470)">
                        <!-- Tire -->
                        <circle cx="0" cy="0" r="55" fill="url(#tire-grad)" stroke="#111" stroke-width="2"/>
                        <!-- Rim -->
                        <circle cx="0" cy="0" r="35" fill="#34495e" stroke="#555" stroke-width="1"/>
                        <!-- Spokes -->
                        <g stroke="#2c3e50" stroke-width="3">
                            <path d="M0,-35 L0,35 M-35,0 L35,0 M-25,-25 L25,25 M-25,25 L25,-25" />
                        </g>
                        <!-- Hub -->
                        <circle cx="0" cy="0" r="10" fill="#7f8c8d" />
                        <!-- Mudguard -->
                        <path d="M-55,5 A55,55 0 0,1 55,5" fill="none" stroke="url(#dark-grad)" stroke-width="12" stroke-linecap="round"/>
                    </g>

                    <!-- 2. CABIN BACK WALL (Depth) -->
                    <!-- Angled to show 3/4 perspective -->
                    <path d="M300,380 L540,360 L560,490 L280,510 Z" fill="url(#body-grad)" opacity="0.9"/>
                    <!-- Shadow cast by roof onto back wall -->
                    <path d="M300,380 L540,360 L550,400 L290,420 Z" fill="rgba(0,0,0,0.2)" filter="url(#canopy-shadow)"/>
                    
                    <!-- 3. DRIVER SILHOUETTE -->
                    <g transform="translate(400, 340)">
                        <!-- Head -->
                        <circle cx="0" cy="0" r="22" fill="#d35400" />
                        <!-- Cap -->
                        <path d="M-25,0 C-25,-20 25,-20 25,0 Z" fill="#ecf0f1" />
                        <!-- Shoulders -->
                        <path d="M-30,20 C-30,50 30,50 30,20 Z" fill="#fff" />
                        <!-- Steering Hands -->
                        <circle cx="-25" cy="45" r="5" fill="#d35400" />
                        <circle cx="25" cy="45" r="5" fill="#d35400" />
                    </g>

                    <!-- 4. FRONT WHEEL (Center) -->
                    <g transform="translate(440, 500)">
                        <!-- Forks -->
                        <line x1="-10" y1="-70" x2="-10" y2="0" stroke="#555" stroke-width="6" />
                        <line x1="10" y1="-70" x2="10" y2="0" stroke="#555" stroke-width="6" />
                        <!-- Tire -->
                        <circle cx="0" cy="0" r="60" fill="url(#tire-grad)" stroke="#111" stroke-width="2"/>
                        <!-- Rim -->
                        <circle cx="0" cy="0" r="40" fill="#555" stroke="#777" stroke-width="2"/>
                        <!-- Spokes -->
                        <g stroke="#333" stroke-width="3">
                            <path d="M0,-40 L0,40 M-40,0 L40,0 M-28,-28 L28,28 M-28,28 L28,-28" />
                        </g>
                        <!-- Hub -->
                        <circle cx="0" cy="0" r="15" fill="#95a5a6" />
                        <!-- Mudguard -->
                        <path d="M-60,10 A60,60 0 0,1 60,10" fill="none" stroke="url(#dark-grad)" stroke-width="12" stroke-linecap="round"/>
                    </g>

                    <!-- 5. CABIN FRONT & SIDES (Main Body) -->
                    <!-- Constructed to show 3/4 view -->
                    <g id="body-shell">
                        <!-- Side Panel (Left) -->
                        <path d="M280,510 L280,380 L330,380 L330,510 Z" fill="url(#body-grad)" />
                        <!-- Front Panel (Angled) -->
                        <path d="M330,510 L330,380 L500,360 L520,500 Z" fill="url(#body-grad)" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
                        
                        <!-- Body Details / Panel Lines -->
                        <line x1="340" y1="480" x2="340" y2="420" stroke="rgba(0,0,0,0.1)" stroke-width="2" />
                        <line x1="350" y1="480" x2="350" y2="420" stroke="rgba(0,0,0,0.1)" stroke-width="2" />
                        
                        <!-- Sticker/Ornament on Side -->
                        <g transform="translate(285, 460)">
                            <rect x="0" y="0" width="35" height="15" fill="rgba(255,255,255,0.2)" />
                            <line x1="5" y1="7" x2="30" y2="7" stroke="#fff" stroke-width="2" />
                        </g>
                    </g>

                    <!-- 6. WINDSHIELD -->
                    <!-- Angled glass with reflection -->
                    <path d="M340,370 L320,260 L490,240 L510,350 Z" fill="url(#glass-grad)" stroke="#7f8c8d" stroke-width="2"/>
                    <!-- Reflection Lines -->
                    <path d="M350,300 L400,270 M360,320 L420,280" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round" />
                    <!-- A-Pillar -->
                    <line x1="430" y1="250" x2="430" y2="360" stroke="#555" stroke-width="4" />

                    <!-- 7. HANDLEBARS & STEERING COLUMN -->
                    <g id="steering">
                        <!-- Column -->
                        <line x1="440" y1="360" x2="440" y2="290" stroke="#333" stroke-width="8" />
                        <!-- Bar -->
                        <path d="M360,290 L520,280" stroke="#2c3e50" stroke-width="10" stroke-linecap="round" />
                        <!-- Grips -->
                        <rect x="350" y="285" width="25" height="14" rx="4" fill="#000" />
                        <rect x="515" y="285" width="25" height="14" rx="4" fill="#000" />
                        <!-- Mirrors -->
                        <!-- Left Mirror -->
                        <g transform="translate(355, 290)">
                            <line x1="0" y1="0" x2="-10" y2="-20" stroke="#333" stroke-width="2" />
                            <ellipse cx="-12" cy="-22" rx="6" ry="12" fill="#ecf0f1" stroke="#333" />
                        </g>
                        <!-- Right Mirror -->
                        <g transform="translate(520, 280)">
                            <line x1="0" y1="0" x2="10" y2="-20" stroke="#333" stroke-width="2" />
                            <ellipse cx="12" cy="-22" rx="6" ry="12" fill="#ecf0f1" stroke="#333" />
                        </g>
                    </g>

                    <!-- 8. HEADLAMP -->
                    <g transform="translate(440, 480)">
                        <!-- Housing -->
                        <circle cx="0" cy="0" r="22" fill="#333" stroke="#555" stroke-width="2" />
                        <!-- Bulb -->
                        <circle cx="0" cy="0" r="16" fill="url(#glow-grad)" />
                        <circle cx="0" cy="0" r="8" fill="#fff" />
                        <!-- Turn Signal -->
                        <rect x="-25" y="-5" width="8" height="10" rx="2" fill="#e67e22" />
                        <rect x="17" y="-5" width="8" height="10" rx="2" fill="#e67e22" />
                    </g>

                    <!-- 9. CANOPY ROOF (Curved) -->
                    <path d="M260,380 Q440,140 580,350 L560,370 Q440,170 280,400 Z" fill="url(#roof-grad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
                    
                    <!-- Roof Ornaments (The Spire) -->
                    <g transform="translate(440, 180)">
                        <path d="M-5,0 L0,-50 L5,0 Z" fill="url(#chrome-grad)" />
                        <circle cx="0" cy="-50" r="8" fill="#e74c3c" />
                    </g>

                    <!-- 10. DETAILS & ORNAMENTS -->
                    <!-- License Plate -->
                    <g transform="translate(400, 520)">
                        <rect x="0" y="0" width="60" height="24" rx="3" fill="#ecf0f1" stroke="#333" />
                        <text x="30" y="16" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#000">MH-04</text>
                    </g>
                    
                    <!-- Antenna/Flag -->
                    <line x1="580" y1="350" x2="600" y2="290" stroke="#7f8c8d" stroke-width="2" />
                    <path d="M600,290 L625,305 L600,320 Z" fill="#e74c3c" />

                    <!-- Front Bumper -->
                    <path d="M380,510 Q440,530 500,510" fill="none" stroke="url(#chrome-grad)" stroke-width="6" stroke-linecap="round" />

                </g>
            </svg>
        </div>

        <!-- Info Sidebar -->
        <div class="info-sidebar">
            <div>
                <span class="brand-tag">Heritage Series</span>
                <h1>Royal<br><span>Metro</span></h1>
                <p class="description">
                    A modern reimagining of the iconic Indian auto-rickshaw. 
                    Combining the agility of the three-wheel structure with 
                    premium aesthetics and a vibrant street-inspired palette.
                </p>
            </div>

            <div class="specs-grid">
                <div class="spec-item">
                    <span class="spec-label">Engine</span>
                    <span class="spec-value">3-Cyl Diesel</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">Capacity</span>
                    <span class="spec-value">3 Passengers</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">Top Speed</span>
                    <span class="spec-value">80 km/h</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">Origin</span>
                    <span class="spec-value">Mumbai, IN</span>
                </div>
            </div>

            <div class="controls-area">
                <span class="control-label">Select Livery</span>
                <div class="color-options">
                    <div class="color-btn active" style="background-color: #f4d03f;" onclick="changeColor('#f4d03f', '#d4ac0d', this)" title="Classic Yellow"></div>
                    <div class="color-btn" style="background-color: #e74c3c;" onclick="changeColor('#e74c3c', '#c0392b', this)" title="Red Alert"></div>
                    <div class="color-btn" style="background-color: #1abc9c;" onclick="changeColor('#1abc9c', '#16a085', this)" title="Metro Teal"></div>
                    <div class="color-btn" style="background-color: #3498db;" onclick="changeColor('#3498db', '#2980b9', this)" title="Royal Blue"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function changeColor(primary, secondary, element) {
            // Update Active Button State
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            element.classList.add('active');

            // Update CSS Variables for UI consistency
            document.documentElement.style.setProperty('--car-primary', primary);
            document.documentElement.style.setProperty('--car-secondary', secondary);

            // Update SVG Gradient directly
            const stops = document.getElementById('body-grad').children;
            stops[0].style.stopColor = primary;
            stops[1].style.stopColor = primary;
            stops[2].style.stopColor = secondary;
        }
    </script>
</body>
</html>
