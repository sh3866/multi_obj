<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Classic | The Auto Rickshaw</title>
    <style>
        :root {
            /* Palette - Rich, Street-Inspired */
            --bg-dark: #121212;
            --bg-panel: rgba(30, 30, 30, 0.6);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            
            /* Dynamic Vehicle Colors */
            --car-primary: #f1c40f; /* Classic Yellow */
            --car-secondary: #d35400; /* Burnt Orange/Green trim */
            --car-accent: #27ae60; /* Emerald Green */
            
            /* Typography */
            --font-display: 'Arial Black', Impact, sans-serif;
            --font-body: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            position: relative;
        }

        /* Background Atmosphere */
        .bg-atmosphere {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 50% 60%, #2c3e50 0%, #000000 80%);
            z-index: -2;
        }

        /* Noise Texture */
        .noise-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.07;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            z-index: 0;
        }

        /* Main Layout */
        .showcase-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        /* Left: Visual Stage (Dominant) */
        .visual-stage {
            flex: 1;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 2rem;
        }

        /* Right: Floating Info Card (Organic) */
        .info-card {
            width: 380px;
            padding: 40px;
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255,255,255,0.1);
            box-shadow: -20px 0 60px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            transform: perspective(1000px) rotateY(-5deg);
            transition: transform 0.4s ease;
        }

        .info-card:hover {
            transform: perspective(1000px) rotateY(0deg);
        }

        /* Typography */
        .brand-eyebrow {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--car-primary);
            margin-bottom: 10px;
            display: block;
            opacity: 0.9;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 3.5rem;
            line-height: 0.9;
            text-transform: uppercase;
            margin-bottom: 20px;
            background: linear-gradient(to right, #fff, #ccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 0.95rem;
            margin-bottom: 30px;
            border-left: 2px solid var(--car-secondary);
            padding-left: 15px;
        }

        /* Specs */
        .specs-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            border-top: 1px solid rgba(255,255,255,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 15px 0;
        }

        .spec-col {
            display: flex;
            flex-direction: column;
        }

        .spec-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 5px;
        }

        .spec-val {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }

        /* Controls */
        .controls-wrapper {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
        }

        .control-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 12px;
            display: block;
        }

        .color-swatches {
            display: flex;
            gap: 12px;
        }

        .swatch {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            position: relative;
        }

        .swatch.active {
            border-color: #fff;
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        /* SVG Styles */
        #rickshaw-svg {
            width: 100%;
            height: 100%;
            max-width: 900px;
            max-height: 700px;
            overflow: visible;
            filter: drop-shadow(0px 20px 40px rgba(0,0,0,0.6));
            animation: breathe 6s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02) translateY(-5px); }
        }

        /* Responsive */
        @media (max-width: 900px) {
            body { flex-direction: column; overflow-y: auto; }
            .visual-stage { height: 60vh; }
            .info-card { 
                width: 100%; 
                border-left: none; 
                border-top: 1px solid rgba(255,255,255,0.1); 
                transform: none;
                box-shadow: none;
                margin-top: -50px;
                z-index: 2;
                border-radius: 30px 30px 0 0;
            }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="bg-atmosphere"></div>
    <div class="noise-overlay"></div>

    <div class="showcase-container">
        <!-- VISUAL STAGE -->
        <div class="visual-stage">
            <svg id="rickshaw-svg" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- 1. Complex Body Gradient (Metallic) -->
                    <linearGradient id="body-metallic" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:var(--car-primary);stop-opacity:1" />
                        <stop offset="20%" style="stop-color:#fff;stop-opacity:0.4" /> <!-- Highlight -->
                        <stop offset="25%" style="stop-color:var(--car-primary);stop-opacity:1" />
                        <stop offset="90%" style="stop-color:var(--car-primary);stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#000;stop-opacity:0.3" /> <!-- Edge Shadow -->
                    </linearGradient>

                    <!-- 2. Canopy Fabric Gradient -->
                    <linearGradient id="fabric-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#34495e;stop-opacity:1" />
                        <stop offset="80%" style="stop-color:#2c3e50;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#000;stop-opacity:1" />
                    </linearGradient>

                    <!-- 3. Chrome/Metal -->
                    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#95a5a6" />
                        <stop offset="30%" style="stop-color:#fff" />
                        <stop offset="50%" style="stop-color:#7f8c8d" />
                        <stop offset="100%" style="stop-color:#34495e" />
                    </linearGradient>

                    <!-- 4. Tire Depth -->
                    <radialGradient id="tire-depth" cx="50%" cy="50%" r="50%">
                        <stop offset="75%" style="stop-color:#111" />
                        <stop offset="100%" style="stop-color:#000" />
                    </radialGradient>

                    <!-- 5. Glass Reflection -->
                    <linearGradient id="glass-ref" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#85c1e9;stop-opacity:0.6" />
                        <stop offset="50%" style="stop-color:#2874a6;stop-opacity:0.2" />
                        <stop offset="100%" style="stop-color:#000;stop-opacity:0.5" />
                    </linearGradient>

                    <!-- 6. Headlight Beam -->
                    <radialGradient id="beam" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
                        <stop offset="20%" style="stop-color:#f1c40f;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#f1c40f;stop-opacity:0" />
                    </radialGradient>

                    <!-- Filter for Ambient Occlusion -->
                    <filter id="ao" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="8" />
                    </filter>
                </defs>

                <!-- Ground Shadow -->
                <ellipse cx="400" cy="560" rx="250" ry="35" fill="rgba(0,0,0,0.8)" filter="blur(12px)" />

                <!-- MAIN GROUP -->
                <g id="vehicle" transform="translate(0, 0)">
                    
                    <!-- === REAR WHEELS (Dual) === -->
                    <!-- Left Rear (Background) -->
                    <g transform="translate(280, 490)">
                        <!-- Tire -->
                        <ellipse cx="0" cy="0" rx="55" ry="60" fill="url(#tire-depth)" stroke="#222" stroke-width="2"/>
                        <!-- Rim -->
                        <ellipse cx="0" cy="0" rx="35" ry="38" fill="#444" stroke="#222" stroke-width="1"/>
                        <!-- Spokes -->
                        <g stroke="#222" stroke-width="3">
                            <path d="M0,-38 L0,38 M-35,0 L35,0 M-25,-25 L25,25 M-25,25 L25,-25" />
                        </g>
                        <!-- Hub -->
                        <ellipse cx="0" cy="0" rx="10" ry="10" fill="#777" />
                        <!-- Mudguard (Back) -->
                        <path d="M-50,15 A55,60 0 0,1 50,15" fill="none" stroke="#111" stroke-width="12" stroke-linecap="round"/>
                    </g>

                    <!-- Right Rear (Foreground - Larger) -->
                    <g transform="translate(480, 510)">
                        <!-- Tire -->
                        <ellipse cx="0" cy="0" rx="65" ry="70" fill="url(#tire-depth)" stroke="#000" stroke-width="2"/>
                        <!-- Rim -->
                        <ellipse cx="0" cy="0" rx="45" ry="48" fill="#555" stroke="#333" stroke-width="1"/>
                        <!-- Spokes -->
                        <g stroke="#333" stroke-width="4">
                            <path d="M0,-48 L0,48 M-45,0 L45,0 M-32,-32 L32,32 M-32,32 L32,-32" />
                        </g>
                        <!-- Hub -->
                        <ellipse cx="0" cy="0" rx="12" ry="12" fill="#888" />
                        <!-- Mudguard (Front) -->
                        <path d="M-65,15 A65,70 0 0,1 65,15" fill="none" stroke="url(#chrome)" stroke-width="14" stroke-linecap="round"/>
                        <!-- Exhaust Pipe (Tucked under Right Wheel) -->
                        <path d="M-20,30 L-60,30 L-70,25" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round" />
                    </g>

                    <!-- === ENGINE & CHASSIS === -->
                    <!-- Engine Block -->
                    <g transform="translate(400, 500)">
                        <path d="M-30,-10 L30,-10 L40,40 L-20,40 Z" fill="#222" />
                        <!-- Cooling Fins -->
                        <line x1="-25" y1="0" x2="35" y2="0" stroke="#111" stroke-width="2" />
                        <line x1="-22" y1="10" x2="38" y2="10" stroke="#111" stroke-width="2" />
                        <line x1="-20" y1="20" x2="40" y2="20" stroke="#111" stroke-width="2" />
                        <line x1="-18" y1="30" x2="42" y2="30" stroke="#111" stroke-width="2" />
                    </g>

                    <!-- === CABIN BACK WALL (Depth) === -->
                    <!-- Angled for 3/4 perspective -->
                    <path d="M280,380 L520,360 L540,490 L260,510 Z" fill="url(#body-metallic)" />
                    
                    <!-- Ornamental Sticker -->
                    <g transform="translate(290, 440) rotate(-5)">
                        <rect x="0" y="0" width="60" height="18" fill="#fff" rx="2" opacity="0.95"/>
                        <rect x="1" y="1" width="58" height="16" fill="none" stroke="#c0392b" stroke-width="1" rx="1"/>
                        <text x="30" y="12" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="#27ae60">JAI HIND</text>
                    </g>

                    <!-- Shadow cast by roof onto back wall -->
                    <path d="M280,380 L520,360 L530,400 L270,420 Z" fill="rgba(0,0,0,0.3)" filter="url(#ao)"/>

                    <!-- === DRIVER SILHOUETTE === -->
                    <g transform="translate(410, 330)">
                        <!-- Head -->
                        <circle cx="0" cy="0" r="20" fill="#d35400" />
                        <!-- Cap -->
                        <path d="M-22,0 C-22,-18 22,-18 22,0 Z" fill="#ecf0f1" />
                        <!-- Shoulders -->
                        <path d="M-30,18 C-30,45 30,45 30,18 Z" fill="#fff" />
                        <!-- Hands on Bar -->
                        <circle cx="-25" cy="42" r="4" fill="#d35400" />
                        <circle cx="25" cy="42" r="4" fill="#d35400" />
                    </g>

                    <!-- === FRONT WHEEL (Center) === -->
                    <g transform="translate(420, 520)">
                        <!-- Forks -->
                        <line x1="-10" y1="-70" x2="-10" y2="0" stroke="#444" stroke-width="6" />
                        <line x1="10" y1="-70" x2="10" y2="0" stroke="#444" stroke-width="6" />
                        <!-- Tire -->
                        <ellipse cx="0" cy="0" rx="60" ry="65" fill="url(#tire-depth)" stroke="#000" stroke-width="2"/>
                        <!-- Rim -->
                        <ellipse cx="0" cy="0" rx="40" ry="43" fill="#666" stroke="#888" stroke-width="2"/>
                        <!-- Spokes -->
                        <g stroke="#444" stroke-width="3">
                            <path d="M0,-43 L0,43 M-40,0 L40,0 M-28,-28 L28,28 M-28,28 L28,-28" />
                        </g>
                        <!-- Hub -->
                        <ellipse cx="0" cy="0" rx="15" ry="15" fill="#999" />
                        <!-- Mudguard -->
                        <path d="M-60,10 A60,65 0 0,1 60,10" fill="none" stroke="url(#chrome)" stroke-width="12" stroke-linecap="round"/>
                    </g>

                    <!-- === BODY SHELL (Front & Sides) === -->
                    <g id="body-shell">
                        <!-- Side Panel (Left) -->
                        <path d="M260,510 L260,380 L310,380 L310,510 Z" fill="url(#body-metallic)" />
                        <!-- Front Panel (Angled) -->
                        <path d="M310,510 L310,380 L480,360 L500,500 Z" fill="url(#body-metallic)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
                        
                        <!-- Panel Lines (Detailing) -->
                        <path d="M260,480 L500,460" stroke="rgba(0,0,0,0.2)" stroke-width="2" />
                        <path d="M260,400 L500,380" stroke="rgba(0,0,0,0.2)" stroke-width="2" />

                        <!-- Vibrant Striping -->
                        <path d="M260,490 L500,470 L500,475 L260,495 Z" fill="var(--car-secondary)" />
                        <path d="M260,495 L500,475 L500,480 L260,500 Z" fill="var(--car-accent)" />
                    </g>

                    <!-- === WINDSHIELD === -->
                    <path d="M320,370 L300,260 L470,240 L490,350 Z" fill="url(#glass-ref)" stroke="#7f8c8d" stroke-width="2"/>
                    <!-- Reflection -->
                    <path d="M330,300 L380,270 M340,320 L400,280" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round" />
                    <!-- A-Pillar -->
                    <line x1="415" y1="250" x2="415" y2="360" stroke="#444" stroke-width="4" />

                    <!-- === HANDLEBARS === -->
                    <g id="steering">
                        <!-- Column -->
                        <line x1="415" y1="360" x2="415" y2="290" stroke="#333" stroke-width="8" />
                        <!-- Bar -->
                        <path d="M330,290 L490,280" stroke="#222" stroke-width="10" stroke-linecap="round" />
                        <!-- Grips -->
                        <rect x="320" y="285" width="25" height="14" rx="4" fill="#000" />
                        <rect x="485" y="285" width="25" height="14" rx="4" fill="#000" />
                        
                        <!-- Horn Button -->
                        <circle cx="490" cy="285" r="6" fill="#e74c3c" stroke="#c0392b" stroke-width="1" />
                        
                        <!-- Mirrors -->
                        <g transform="translate(325, 290)">
                            <line x1="0" y1="0" x2="-10" y2="-25" stroke="#333" stroke-width="2" />
                            <ellipse cx="-12" cy="-27" rx="6" ry="14" fill="#ecf0f1" stroke="#333" />
                        </g>
                        <g transform="translate(490, 280)">
                            <line x1="0" y1="0" x2="10" y2="-25" stroke="#333" stroke-width="2" />
                            <ellipse cx="12" cy="-27" rx="6" ry="14" fill="#ecf0f1" stroke="#333" />
                        </g>
                    </g>

                    <!-- === HEADLAMP === -->
                    <g transform="translate(415, 480)">
                        <!-- Housing -->
                        <circle cx="0" cy="0" r="24" fill="#222" stroke="#555" stroke-width="2" />
                        <!-- Bulb -->
                        <circle cx="0" cy="0" r="18" fill="url(#beam)" />
                        <circle cx="0" cy="0" r="9" fill="#fff" />
                        <!-- Indicators -->
                        <rect x="-28" y="-6" width="8" height="12" rx="2" fill="#e67e22" />
                        <rect x="20" y="-6" width="8" height="12" rx="2" fill="#e67e22" />
                    </g>

                    <!-- === CANOPY ROOF === -->
                    <!-- Curved fabric look -->
                    <path d="M240,380 Q410,120 580,350 L560,370 Q410,160 260,400 Z" fill="url(#fabric-grad)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
                    
                    <!-- Roof Details (Folds) -->
                    <path d="M280,390 Q410,180 540,360" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="2" />
                    <path d="M320,400 Q410,220 500,370" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="2" />

                    <!-- Roof Ornaments (Spire) -->
                    <g transform="translate(410, 160)">
                        <path d="M-6,0 L0,-60 L6,0 Z" fill="url(#chrome)" />
                        <circle cx="0" cy="-60" r="10" fill="#e74c3c" />
                    </g>

                    <!-- === EXTRAS === -->
                    <!-- License Plate -->
                    <g transform="translate(370, 515)">
                        <rect x="0" y="0" width="70" height="26" rx="3" fill="#ecf0f1" stroke="#333" />
                        <text x="35" y="17" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">MH-04</text>
                    </g>
                    
                    <!-- Decorative Flag -->
                    <line x1="580" y1="350" x2="600" y2="280" stroke="#777" stroke-width="2" />
                    <path d="M600,280 L630,300 L600,320 Z" fill="#2980b9" />
                    
                    <!-- Front Bumper -->
                    <path d="M350,500 Q415,525 490,500" fill="none" stroke="url(#chrome)" stroke-width="8" stroke-linecap="round" />

                </g>
            </svg>
        </div>

        <!-- INFO CARD -->
        <div class="info-card">
            <span class="brand-eyebrow">Heritage Series</span>
            <h1>Metro<br>Classic</h1>
            <p class="description">
                The undisputed king of Indian streets. A reimagining of the iconic three-wheeler, blending raw mechanical engineering with vibrant street aesthetics.
            </p>

            <div class="specs-row">
                <div class="spec-col">
                    <span class="spec-label">Engine</span>
                    <span class="spec-val">3-Cyl Diesel</span>
                </div>
                <div class="spec-col">
                    <span class="spec-label">Capacity</span>
                    <span class="spec-val">3 Pax</span>
                </div>
                <div class="spec-col">
                    <span class="spec-label">Origin</span>
                    <span class="spec-val">Mumbai</span>
                </div>
            </div>

            <div class="controls-wrapper">
                <span class="control-title">Select Livery</span>
                <div class="color-swatches">
                    <div class="swatch active" style="background-color: #f1c40f;" onclick="updateLivery('#f1c40f', '#d35400', '#27ae60', this)"></div>
                    <div class="swatch" style="background-color: #e74c3c;" onclick="updateLivery('#e74c3c', '#c0392b', '#f1c40f', this)"></div>
                    <div class="swatch" style="background-color: #1abc9c;" onclick="updateLivery('#1abc9c', '#16a085', '#e74c3c', this)"></div>
                    <div class="swatch" style="background-color: #3498db;" onclick="updateLivery('#3498db', '#2980b9', '#e67e22', this)"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateLivery(primary, secondary, accent, element) {
            // Handle UI State
            document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
            element.classList.add('active');

            // Update CSS Variables
            const root = document.documentElement;
            root.style.setProperty('--car-primary', primary);
            root.style.setProperty('--car-secondary', secondary);
            root.style.setProperty('--car-accent', accent);

            // Update SVG Gradient Stops
            const bodyGrad = document.getElementById('body-metallic');
            // Stops: 0 (Main), 2 (Main), 3 (Main)
            bodyGrad.children[0].style.stopColor = primary;
            bodyGrad.children[2].style.stopColor = primary;
            bodyGrad.children[3].style.stopColor = primary;
        }
    </script>
</body>
</html>
