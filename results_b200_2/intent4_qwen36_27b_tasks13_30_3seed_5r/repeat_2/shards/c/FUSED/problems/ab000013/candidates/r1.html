<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Metro | Auto Rickshaw Showcase</title>
    <style>
        :root {
            --bg-dark: #0f1115;
            --bg-panel: #1a1d24;
            --text-main: #f0f2f5;
            --text-muted: #8b9bb4;
            --accent-primary: #f4d03f; /* Default Yellow */
            --accent-secondary: #d4ac0d;
            --font-display: 'Arial Black', 'Impact', sans-serif;
            --font-body: 'Segoe UI', 'Roboto', Helvetica, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Background Atmosphere */
        .bg-atmosphere {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 50% 60%, rgba(244, 208, 63, 0.08) 0%, transparent 50%),
                linear-gradient(to bottom, #161920, #0f1115);
            z-index: -1;
        }

        /* Main Layout */
        .showcase-container {
            position: relative;
            width: 95vw;
            height: 90vh;
            display: flex;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Left: Visual Stage */
        .visual-stage {
            flex: 3;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        /* Right: Info Sidebar */
        .info-sidebar {
            flex: 1;
            background: var(--bg-panel);
            border-left: 1px solid rgba(255,255,255,0.05);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            z-index: 10;
        }

        /* Typography */
        .brand-tag {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-primary);
            margin-bottom: 10px;
            display: inline-block;
            background: rgba(244, 208, 63, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 3.5rem;
            line-height: 1;
            text-transform: uppercase;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #fff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        /* Specs Grid */
        .specs-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 30px;
        }

        .spec-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .spec-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .spec-value {
            font-weight: 600;
            color: var(--text-main);
        }

        /* Controls */
        .controls-area {
            margin-top: auto;
        }

        .control-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 15px;
            display: block;
        }

        .color-options {
            display: flex;
            gap: 15px;
        }

        .color-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            position: relative;
        }

        .color-btn:hover { transform: scale(1.1); }
        
        .color-btn.active {
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        /* SVG Styling */
        #rickshaw-svg {
            width: 100%;
            height: 100%;
            max-width: 800px;
            overflow: visible;
            /* Subtle float animation */
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .wheel-anim {
            transform-origin: center;
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 900px) {
            .showcase-container { flex-direction: column-reverse; height: 95vh; }
            .info-sidebar { height: 45%; padding: 20px; border-left: none; border-top: 1px solid rgba(255,255,255,0.1); }
            .visual-stage { height: 55%; }
            h1 { font-size: 2.5rem; }
            .specs-grid { display: none; } /* Hide specs on mobile to save space */
        }
    </style>
</head>
<body>

    <div class="bg-atmosphere"></div>

    <div class="showcase-container">
        <!-- Visual Area -->
        <div class="visual-stage">
            <svg id="rickshaw-svg" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Dynamic Body Gradient (Left Highlight / Right Shadow) -->
                    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:var(--accent-primary);stop-opacity:1" />
                        <stop offset="40%" style="stop-color:var(--accent-primary);stop-opacity:1" />
                        <stop offset="100%" style="stop-color:var(--accent-secondary);stop-opacity:1" />
                    </linearGradient>

                    <!-- Roof Gradient -->
                    <linearGradient id="roof-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#000;stop-opacity:1" />
                    </linearGradient>

                    <!-- Chrome/Metal Gradient -->
                    <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#bdc3c7;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#7f8c8d;stop-opacity:1" />
                    </linearGradient>

                    <!-- Glass Gradient -->
                    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#34495e;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:0.4" />
                    </linearGradient>

                    <!-- Tire Gradient -->
                    <radialGradient id="tire-grad" cx="50%" cy="50%" r="50%">
                        <stop offset="70%" style="stop-color:#2c3e50;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#000;stop-opacity:1" />
                    </radialGradient>

                    <!-- Filters -->
                    <filter id="drop-shadow" x="-20%" y="-20%" width="150%" height="150%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
                        <feOffset dx="0" dy="15" result="offsetblur" />
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.4" />
                        </feComponentTransfer>
                        <feMerge> 
                            <feMergeNode />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>

                    <!-- Canopy Shadow -->
                    <filter id="canopy-shadow" x="-10%" y="-10%" width="120%" height="120%">
                        <feGaussianBlur stdDeviation="4" result="blur"/>
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.3" />
                        </feComponentTransfer>
                    </filter>
                </defs>

                <!-- Ground Shadow -->
                <ellipse cx="400" cy="540" rx="300" ry="40" fill="rgba(0,0,0,0.6)" filter="blur(10px)" />

                <g filter="url(#drop-shadow)">
                    
                    <!-- 1. REAR WHEEL (Left - Closer to viewer) -->
                    <g transform="translate(280, 480)">
                        <path d="M-70,0 A70,70 0 0,1 70,0" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round"/> <!-- Mudguard -->
                        <circle cx="0" cy="0" r="65" fill="url(#tire-grad)" stroke="#111" stroke-width="2"/>
                        <circle cx="0" cy="0" r="45" fill="#34495e" stroke="#555" stroke-width="1"/>
                        <g class="wheel-anim">
                            <path d="M0,-45 L0,45 M-45,0 L45,0 M-32,-32 L32,32 M-32,32 L32,-32" stroke="#2c3e50" stroke-width="4" />
                            <circle cx="0" cy="0" r="15" fill="#7f8c8d" />
                        </g>
                    </g>

                    <!-- 2. REAR WHEEL (Right - Further away) -->
                    <g transform="translate(520, 460)">
                        <path d="M-60,0 A60,60 0 0,1 60,0" fill="none" stroke="#000" stroke-width="10" stroke-linecap="round"/>
                        <circle cx="0" cy="0" r="55" fill="url(#tire-grad)" stroke="#111" stroke-width="2"/>
                        <circle cx="0" cy="0" r="35" fill="#34495e" stroke="#555" stroke-width="1"/>
                        <g class="wheel-anim">
                            <path d="M0,-35 L0,35 M-35,0 L35,0 M-25,-25 L25,25 M-25,25 L25,-25" stroke="#2c3e50" stroke-width="4" />
                            <circle cx="0" cy="0" r="12" fill="#7f8c8d" />
                        </g>
                    </g>

                    <!-- 3. CABIN BACK WALL (Depth) -->
                    <!-- Drawn first to be behind the driver -->
                    <path d="M280,380 L520,360 L540,480 L260,500 Z" fill="url(#body-grad)" opacity="0.9"/>
                    <!-- Shadow cast by roof onto back wall -->
                    <path d="M280,380 L520,360 L525,400 L275,420 Z" fill="rgba(0,0,0,0.3)" filter="url(#canopy-shadow)"/>

                    <!-- 4. DRIVER SILHOUETTE -->
                    <g transform="translate(380, 340)">
                        <!-- Head -->
                        <circle cx="0" cy="0" r="22" fill="#d35400" />
                        <!-- Cap -->
                        <path d="M-25,0 C-25,-20 25,-20 25,0 Z" fill="#ecf0f1" />
                        <!-- Shoulders -->
                        <path d="M-30,20 C-30,50 30,50 30,20 Z" fill="#fff" />
                    </g>

                    <!-- 5. FRONT WHEEL (Center) -->
                    <g transform="translate(400, 490)">
                        <!-- Forks -->
                        <line x1="-10" y1="-60" x2="-10" y2="0" stroke="#555" stroke-width="6" />
                        <line x1="10" y1="-60" x2="10" y2="0" stroke="#555" stroke-width="6" />
                        <!-- Mudguard -->
                        <path d="M-65,0 A65,65 0 0,1 65,0" fill="none" stroke="#000" stroke-width="10" stroke-linecap="round"/>
                        <!-- Tire -->
                        <circle cx="0" cy="0" r="60" fill="url(#tire-grad)" stroke="#111" stroke-width="2"/>
                        <!-- Rim -->
                        <circle cx="0" cy="0" r="40" fill="#555" stroke="#777" stroke-width="2"/>
                        <g class="wheel-anim">
                            <path d="M0,-40 L0,40 M-40,0 L40,0 M-28,-28 L28,28 M-28,28 L28,-28" stroke="#333" stroke-width="3" />
                            <circle cx="0" cy="0" r="15" fill="#95a5a6" />
                        </g>
                    </g>

                    <!-- 6. CABIN FRONT (Driver Cabin) -->
                    <!-- Angled to create 3/4 perspective -->
                    <path d="M320,400 L280,300 L500,280 L540,380 Z" fill="url(#body-grad)" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
                    
                    <!-- 7. WINDSHIELD -->
                    <path d="M330,290 L310,210 L480,190 L500,270 Z" fill="url(#glass-grad)" stroke="#7f8c8d" stroke-width="2"/>
                    <!-- A-Pillar -->
                    <line x1="400" y1="200" x2="400" y2="280" stroke="#555" stroke-width="4" />

                    <!-- 8. HANDLEBARS -->
                    <path d="M340,290 L460,280" stroke="#2c3e50" stroke-width="8" stroke-linecap="round" />
                    <!-- Grips -->
                    <rect x="330" y="275" width="20" height="12" rx="3" fill="#000" />
                    <rect x="460" y="275" width="20" height="12" rx="3" fill="#000" />

                    <!-- 9. MIRRORS -->
                    <!-- Left Mirror -->
                    <g transform="translate(320, 260)">
                        <line x1="0" y1="0" x2="-15" y2="-15" stroke="#333" stroke-width="2" />
                        <ellipse cx="-18" cy="-18" rx="6" ry="10" fill="#ecf0f1" stroke="#333" />
                    </g>
                    <!-- Right Mirror -->
                    <g transform="translate(480, 250)">
                        <line x1="0" y1="0" x2="15" y2="-15" stroke="#333" stroke-width="2" />
                        <ellipse cx="18" cy="-18" rx="6" ry="10" fill="#ecf0f1" stroke="#333" />
                    </g>

                    <!-- 10. HEADLAMP -->
                    <g transform="translate(400, 390)">
                        <!-- Housing -->
                        <circle cx="0" cy="0" r="22" fill="#333" stroke="#555" stroke-width="2" />
                        <!-- Bulb -->
                        <circle cx="0" cy="0" r="16" fill="#f1c40f" />
                        <circle cx="0" cy="0" r="10" fill="#fff" opacity="0.8" />
                        <!-- Beam (Visual only) -->
                        <path d="M-15,10 L-200,300 L200,300 L15,10 Z" fill="url(#beam-grad)" style="mix-blend-mode: screen; opacity: 0.3;" />
                    </g>

                    <!-- 11. CANOPY ROOF (Curved) -->
                    <path d="M250,380 Q400,150 560,360 L540,380 Q400,180 280,400 Z" fill="url(#roof-grad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
                    
                    <!-- Roof Ornaments (The Spire) -->
                    <g transform="translate(400, 200)">
                        <path d="M-5,0 L0,-40 L5,0 Z" fill="url(#chrome-grad)" />
                        <circle cx="0" cy="-40" r="6" fill="#e74c3c" />
                    </g>

                    <!-- 12. DETAILS & ORNAMENTS -->
                    <!-- License Plate -->
                    <g transform="translate(380, 460)">
                        <rect x="0" y="0" width="50" height="20" rx="2" fill="#ecf0f1" stroke="#333" />
                        <text x="25" y="14" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#000">MH-04</text>
                    </g>
                    
                    <!-- Antenna/Flag -->
                    <line x1="540" y1="360" x2="560" y2="310" stroke="#7f8c8d" stroke-width="2" />
                    <path d="M560,310 L580,320 L560,330 Z" fill="#e74c3c" />

                </g>
            </svg>
        </div>

        <!-- Info Sidebar -->
        <div class="info-sidebar">
            <div>
                <span class="brand-tag">Heritage Series</span>
                <h1>Royal<br>Metro</h1>
                <p class="description">
                    A modern reimagining of the iconic Indian auto-rickshaw. 
                    Combining the agility of the three-wheel structure with 
                    premium aesthetics and a vibrant street-inspired palette.
                </p>
            </div>

            <div class="specs-grid">
                <div class="spec-row">
                    <span class="spec-label">Engine</span>
                    <span class="spec-value">3-Cyl Diesel</span>
                </div>
                <div class="spec-row">
                    <span class="spec-label">Capacity</span>
                    <span class="spec-value">3 Passengers</span>
                </div>
                <div class="spec-row">
                    <span class="spec-label">Top Speed</span>
                    <span class="spec-value">80 km/h</span>
                </div>
                <div class="spec-row">
                    <span class="spec-label">Origin</span>
                    <span class="spec-value">Mumbai, IN</span>
                </div>
            </div>

            <div class="controls-area">
                <span class="control-label">Select Livery</span>
                <div class="color-options">
                    <div class="color-btn active" style="background-color: #f4d03f;" onclick="changeColor('#f4d03f', '#d4ac0d', this)" title="Classic Yellow"></div>
                    <div class="color-btn" style="background-color: #e74c3c;" onclick="changeColor('#e74c3c', '#c0392b', this)" title="Red Alert"></div>
                    <div class="color-btn" style="background-color: #1abc9c;" onclick="changeColor('#1abc9c', '#16a085', this)" title="Metro Teal"></div>
                    <div class="color-btn" style="background-color: #3498db;" onclick="changeColor('#3498db', '#2980b9', this)" title="Royal Blue"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function changeColor(primary, secondary, element) {
            // Update Active Button State
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            element.classList.add('active');

            // Update CSS Variables for UI consistency
            document.documentElement.style.setProperty('--accent-primary', primary);
            document.documentElement.style.setProperty('--accent-secondary', secondary);

            // Update SVG Gradient directly
            const stops = document.getElementById('body-grad').children;
            stops[0].style.stopColor = primary;
            stops[1].style.stopColor = primary;
            stops[2].style.stopColor = secondary;
        }
    </script>
</body>
</html>
