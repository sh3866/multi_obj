<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Royal Metro | Auto Rickshaw Showcase</title>
    <style>
        :root {
            /* Palette - Lively Street Theme */
            --bg-warm: #fdfbf7;
            --bg-accent: #f2e8d9;
            --text-main: #2c3e50;
            --text-muted: #607d8b;
            --panel-bg: rgba(255, 255, 255, 0.85);
            --accent-green: #27ae60;
            --accent-orange: #e67e22;
            --accent-blue: #2980b9;

            /* Vehicle Colors (Dynamic) */
            --car-primary: #f1c40f; /* Standard Yellow */
            --car-secondary: #b7950b; /* Darker Yellow */
            --car-dark: #1a252f;

            /* Typography */
            --font-display: 'Arial Black', Impact, 'Segoe UI Black', sans-serif;
            --font-body: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-warm);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Texture Overlay for "Street" Vibe */
        .texture-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: -1;
        }

        /* Sunburst Background Effect */
        .bg-atmosphere {
            position: absolute;
            width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 30% 30%, rgba(255,255,255,1) 0%, transparent 60%),
                conic-gradient(from 180deg at 30% 30%, rgba(241, 196, 15, 0.15) 0deg, transparent 45deg, rgba(241, 196, 15, 0.15) 90deg, transparent 135deg, rgba(241, 196, 15, 0.15) 180deg, transparent 225deg);
            z-index: -2;
        }

        /* Main Layout Container */
        .showcase-container {
            width: 95vw;
            height: 90vh;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Left: Visual Stage (Dominant) */
        .visual-stage {
            flex: 2.5;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Right: Info Sidebar (Refined) */
        .info-sidebar {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-left: 1px solid rgba(0,0,0,0.05);
            box-shadow: -10px 0 40px rgba(0,0,0,0.05);
            position: relative;
            z-index: 10;
        }

        /* Typography */
        .brand-tag {
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 15px;
            display: inline-block;
            border-bottom: 3px solid var(--car-primary);
            padding-bottom: 5px;
            transition: border-color 0.3s ease;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 4.5rem;
            line-height: 0.9;
            text-transform: uppercase;
            margin-bottom: 25px;
            color: var(--text-main);
            letter-spacing: -1px;
        }

        h1 span {
            color: var(--car-primary);
            -webkit-text-stroke: 1px var(--text-main);
            transition: color 0.3s ease;
        }

        .description {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 1.05rem;
            margin-bottom: 40px;
            max-width: 420px;
            border-left: 2px solid var(--accent-green);
            padding-left: 15px;
        }

        /* Specs Grid */
        .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 40px;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
        }

        .spec-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #95a5a6;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .spec-value {
            font-weight: 600;
            color: var(--text-main);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .spec-value::before {
            content: '';
            display: block;
            width: 6px;
            height: 6px;
            background-color: var(--accent-orange);
            border-radius: 50%;
        }

        /* Controls */
        .controls-area {
            background: rgba(255,255,255,0.5);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .control-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-main);
            margin-bottom: 15px;
            display: block;
        }

        .color-options {
            display: flex;
            gap: 15px;
        }

        .color-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid #fff;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .color-btn:hover { transform: scale(1.15) translateY(-2px); }
        
        .color-btn.active {
            border-color: var(--text-main);
            transform: scale(1.1);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        /* SVG Styling */
        #rickshaw-svg {
            width: 110%;
            height: 100%;
            overflow: visible;
            animation: float 6s ease-in-out infinite;
            filter: drop-shadow(0px 30px 25px rgba(0,0,0,0.2));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(0.2deg); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .showcase-container { flex-direction: column; height: 95vh; }
            .visual-stage { height: 50%; flex: none; }
            .info-sidebar { height: 50%; flex: none; border-left: none; border-top: 1px solid rgba(0,0,0,0.05); padding: 30px; }
            h1 { font-size: 3rem; }
            .specs-grid { grid-template-columns: 1fr; gap: 15px; margin-bottom: 20px; }
            #rickshaw-svg { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="bg-atmosphere"></div>
    <div class="texture-overlay"></div>

    <div class="showcase-container">
        <!-- Visual Area -->
        <div class="visual-stage">
            <!-- 
                RECONSTRUCTED SVG:
                - True 3/4 Perspective
                - Layered Shading (Gradients)
                - Specific Details (Exhaust, Horn, Stickers, Engine)
                - Vibrant Accents
            -->
            <svg id="rickshaw-svg" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Body Gradient (Left Highlight / Right Shadow) -->
                    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:var(--car-primary);stop-opacity:1" />
                        <stop offset="50%" style="stop-color:var(--car-primary);stop-opacity:1" />
                        <stop offset="100%" style="stop-color:var(--car-secondary);stop-opacity:1" />
                    </linearGradient>

                    <!-- Dark Body Gradient (Mudguards/Chassis) -->
                    <linearGradient id="dark-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
                    </linearGradient>

                    <!-- Roof Gradient (Top Light) -->
                    <linearGradient id="roof-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#34495e;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
                    </linearGradient>

                    <!-- Chrome/Metal Gradient -->
                    <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#bdc3c7;stop-opacity:1" />
                        <stop offset="20%" style="stop-color:#ffffff;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#7f8c8d;stop-opacity:1" />
                        <stop offset="80%" style="stop-color:#ffffff;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#95a5a6;stop-opacity:1" />
                    </linearGradient>

                    <!-- Glass Gradient -->
                    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#85c1e9;stop-opacity:0.7" />
                        <stop offset="100%" style="stop-color:#2874a6;stop-opacity:0.4" />
                    </linearGradient>

                    <!-- Tire Gradient -->
                    <radialGradient id="tire-grad" cx="50%" cy="50%" r="50%">
                        <stop offset="80%" style="stop-color:#2c3e50;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#000;stop-opacity:1" />
                    </radialGradient>

                    <!-- Headlight Glow -->
                    <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
                        <stop offset="40%" style="stop-color:#f1c40f;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#f1c40f;stop-opacity:0" />
                    </radialGradient>

                    <!-- Filters -->
                    <filter id="canopy-shadow" x="-10%" y="-10%" width="120%" height="120%">
                        <feGaussianBlur stdDeviation="6" result="blur"/>
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.5" />
                        </feComponentTransfer>
                    </filter>
                </defs>

                <!-- Ground Shadow -->
                <ellipse cx="420" cy="560" rx="280" ry="40" fill="rgba(0,0,0,0.25)" filter="blur(10px)" />

                <g id="rickshaw-group">
                    
                    <!-- 1. REAR WHEELS (Ellipses for Perspective) -->
                    <!-- Left Rear (Closer) -->
                    <g transform="translate(310, 510)">
                        <!-- Tire -->
                        <ellipse cx="0" cy="0" rx="65" ry="70" fill="url(#tire-grad)" stroke="#111" stroke-width="2"/>
                        <!-- Rim -->
                        <ellipse cx="0" cy="0" rx="45" ry="48" fill="#34495e" stroke="#555" stroke-width="1"/>
                        <!-- Spokes -->
                        <g stroke="#2c3e50" stroke-width="4">
                            <path d="M0,-48 L0,48 M-45,0 L45,0 M-32,-32 L32,32 M-32,32 L32,-32" />
                        </g>
                        <!-- Hub -->
                        <ellipse cx="0" cy="0" rx="12" ry="12" fill="#7f8c8d" />
                        <!-- Mudguard -->
                        <path d="M-65,10 A65,70 0 0,1 65,10" fill="none" stroke="url(#dark-grad)" stroke-width="14" stroke-linecap="round"/>
                    </g>

                    <!-- Right Rear (Further - Smaller) -->
                    <g transform="translate(510, 490)">
                        <!-- Tire -->
                        <ellipse cx="0" cy="0" rx="55" ry="60" fill="url(#tire-grad)" stroke="#111" stroke-width="2"/>
                        <!-- Rim -->
                        <ellipse cx="0" cy="0" rx="35" ry="38" fill="#34495e" stroke="#555" stroke-width="1"/>
                        <!-- Spokes -->
                        <g stroke="#2c3e50" stroke-width="3">
                            <path d="M0,-38 L0,38 M-35,0 L35,0 M-25,-25 L25,25 M-25,25 L25,-25" />
                        </g>
                        <!-- Hub -->
                        <ellipse cx="0" cy="0" rx="10" ry="10" fill="#7f8c8d" />
                        <!-- Mudguard -->
                        <path d="M-55,5 A55,60 0 0,1 55,5" fill="none" stroke="url(#dark-grad)" stroke-width="12" stroke-linecap="round"/>
                    </g>

                    <!-- 2. CHASSIS & ENGINE BLOCK HINTS -->
                    <!-- Engine Block -->
                    <g transform="translate(430, 510)">
                         <path d="M-30,0 L30,0 L40,40 L-20,40 Z" fill="#2c3e50" />
                         <!-- Fins -->
                         <line x1="-25" y1="10" x2="35" y2="10" stroke="#1a252f" stroke-width="2" />
                         <line x1="-22" y1="20" x2="38" y2="20" stroke="#1a252f" stroke-width="2" />
                         <line x1="-20" y1="30" x2="40" y2="30" stroke="#1a252f" stroke-width="2" />
                    </g>

                    <!-- Exhaust Pipe (Side/Rear) -->
                    <g transform="translate(460, 520)">
                        <path d="M0,0 Q30,20 60,10 L65,15 Q30,25 0,5 Z" fill="#7f8c8d" />
                        <ellipse cx="62" cy="12" rx="4" ry="6" fill="#000" />
                    </g>

                    <!-- 3. CABIN BACK WALL (Depth) -->
                    <!-- Angled to show 3/4 perspective -->
                    <path d="M290,380 L530,360 L550,490 L270,510 Z" fill="url(#body-grad)" opacity="0.95"/>
                    
                    <!-- Ornamental Sticker on Side Panel -->
                    <g transform="translate(285, 450) rotate(-5)">
                        <!-- Decal Background -->
                        <rect x="0" y="0" width="60" height="20" fill="#fff" rx="2" opacity="0.9"/>
                        <!-- Border -->
                        <rect x="0" y="0" width="60" height="20" fill="none" stroke="#e74c3c" stroke-width="1" rx="2"/>
                        <!-- Text (Simulated) -->
                        <text x="30" y="14" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#27ae60">JAI SHRI RAM</text>
                    </g>

                    <!-- Shadow cast by roof onto back wall -->
                    <path d="M290,380 L530,360 L540,400 L280,420 Z" fill="rgba(0,0,0,0.25)" filter="url(#canopy-shadow)"/>
                    
                    <!-- 4. DRIVER SILHOUETTE (Enhanced) -->
                    <g transform="translate(410, 340)">
                        <!-- Head -->
                        <circle cx="0" cy="0" r="22" fill="#d35400" />
                        <!-- Cap -->
                        <path d="M-25,0 C-25,-20 25,-20 25,0 Z" fill="#ecf0f1" />
                        <!-- Shoulders -->
                        <path d="M-30,20 C-30,50 30,50 30,20 Z" fill="#fff" />
                        <!-- Steering Hands -->
                        <circle cx="-25" cy="45" r="5" fill="#d35400" />
                        <circle cx="25" cy="45" r="5" fill="#d35400" />
                    </g>

                    <!-- 5. FRONT WHEEL (Center) -->
                    <g transform="translate(440, 520)">
                        <!-- Forks -->
                        <line x1="-10" y1="-70" x2="-10" y2="0" stroke="#555" stroke-width="6" />
                        <line x1="10" y1="-70" x2="10" y2="0" stroke="#555" stroke-width="6" />
                        <!-- Tire -->
                        <ellipse cx="0" cy="0" rx="60" ry="65" fill="url(#tire-grad)" stroke="#111" stroke-width="2"/>
                        <!-- Rim -->
                        <ellipse cx="0" cy="0" rx="40" ry="43" fill="#555" stroke="#777" stroke-width="2"/>
                        <!-- Spokes -->
                        <g stroke="#333" stroke-width="3">
                            <path d="M0,-43 L0,43 M-40,0 L40,0 M-28,-28 L28,28 M-28,28 L28,-28" />
                        </g>
                        <!-- Hub -->
                        <ellipse cx="0" cy="0" rx="15" ry="15" fill="#95a5a6" />
                        <!-- Mudguard -->
                        <path d="M-60,10 A60,65 0 0,1 60,10" fill="none" stroke="url(#dark-grad)" stroke-width="12" stroke-linecap="round"/>
                    </g>

                    <!-- 6. CABIN FRONT & SIDES (Main Body) -->
                    <g id="body-shell">
                        <!-- Side Panel (Left) -->
                        <path d="M270,510 L270,380 L320,380 L320,510 Z" fill="url(#body-grad)" />
                        <!-- Front Panel (Angled) -->
                        <path d="M320,510 L320,380 L490,360 L510,500 Z" fill="url(#body-grad)" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
                        
                        <!-- Body Details / Panel Lines -->
                        <line x1="330" y1="480" x2="330" y2="420" stroke="rgba(0,0,0,0.15)" stroke-width="2" />
                        <line x1="340" y1="480" x2="340" y2="420" stroke="rgba(0,0,0,0.15)" stroke-width="2" />
                        
                        <!-- Colorful Striping (Vibrant Accent) -->
                        <path d="M270,480 L510,460 L510,470 L270,490 Z" fill="#e74c3c" />
                        <path d="M270,490 L510,470 L510,475 L270,495 Z" fill="#27ae60" />
                    </g>

                    <!-- 7. WINDSHIELD -->
                    <!-- Angled glass with reflection -->
                    <path d="M330,370 L310,260 L480,240 L500,350 Z" fill="url(#glass-grad)" stroke="#7f8c8d" stroke-width="2"/>
                    <!-- Reflection Lines -->
                    <path d="M340,300 L390,270 M350,320 L410,280" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round" />
                    <!-- A-Pillar -->
                    <line x1="420" y1="250" x2="420" y2="360" stroke="#555" stroke-width="4" />

                    <!-- 8. HANDLEBARS & STEERING COLUMN -->
                    <g id="steering">
                        <!-- Column -->
                        <line x1="430" y1="360" x2="430" y2="290" stroke="#333" stroke-width="8" />
                        <!-- Bar -->
                        <path d="M350,290 L510,280" stroke="#2c3e50" stroke-width="10" stroke-linecap="round" />
                        <!-- Grips -->
                        <rect x="340" y="285" width="25" height="14" rx="4" fill="#000" />
                        <rect x="505" y="285" width="25" height="14" rx="4" fill="#000" />
                        
                        <!-- Horn Button (Detail) -->
                        <circle cx="510" cy="285" r="6" fill="#e74c3c" stroke="#c0392b" stroke-width="1" />
                        
                        <!-- Mirrors -->
                        <!-- Left Mirror -->
                        <g transform="translate(345, 290)">
                            <line x1="0" y1="0" x2="-10" y2="-20" stroke="#333" stroke-width="2" />
                            <ellipse cx="-12" cy="-22" rx="6" ry="12" fill="#ecf0f1" stroke="#333" />
                        </g>
                        <!-- Right Mirror -->
                        <g transform="translate(510, 280)">
                            <line x1="0" y1="0" x2="10" y2="-20" stroke="#333" stroke-width="2" />
                            <ellipse cx="12" cy="-22" rx="6" ry="12" fill="#ecf0f1" stroke="#333" />
                        </g>
                    </g>

                    <!-- 9. HEADLAMP -->
                    <g transform="translate(430, 480)">
                        <!-- Housing -->
                        <circle cx="0" cy="0" r="22" fill="#333" stroke="#555" stroke-width="2" />
                        <!-- Bulb -->
                        <circle cx="0" cy="0" r="16" fill="url(#glow-grad)" />
                        <circle cx="0" cy="0" r="8" fill="#fff" />
                        <!-- Turn Signal -->
                        <rect x="-25" y="-5" width="8" height="10" rx="2" fill="#e67e22" />
                        <rect x="17" y="-5" width="8" height="10" rx="2" fill="#e67e22" />
                    </g>

                    <!-- 10. CANOPY ROOF (Curved) -->
                    <path d="M250,380 Q430,140 570,350 L550,370 Q430,170 270,400 Z" fill="url(#roof-grad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
                    
                    <!-- Roof Ornaments (The Spire) -->
                    <g transform="translate(430, 180)">
                        <path d="M-5,0 L0,-50 L5,0 Z" fill="url(#chrome-grad)" />
                        <circle cx="0" cy="-50" r="8" fill="#e74c3c" />
                    </g>

                    <!-- 11. DETAILS & ORNAMENTS -->
                    <!-- License Plate -->
                    <g transform="translate(390, 510)">
                        <rect x="0" y="0" width="60" height="24" rx="3" fill="#ecf0f1" stroke="#333" />
                        <text x="30" y="16" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#000">MH-04</text>
                    </g>
                    
                    <!-- Antenna/Flag -->
                    <line x1="570" y1="350" x2="590" y2="290" stroke="#7f8c8d" stroke-width="2" />
                    <path d="M590,290 L615,305 L590,320 Z" fill="#2980b9" /> <!-- Blue Flag -->

                    <!-- Front Bumper -->
                    <path d="M370,500 Q430,520 490,500" fill="none" stroke="url(#chrome-grad)" stroke-width="6" stroke-linecap="round" />

                </g>
            </svg>
        </div>

        <!-- Info Sidebar -->
        <div class="info-sidebar">
            <div>
                <span class="brand-tag">Heritage Series</span>
                <h1>Royal<br><span>Metro</span></h1>
                <p class="description">
                    A modern reimagining of the iconic Indian auto-rickshaw. 
                    Combining the agility of the three-wheel structure with 
                    premium aesthetics and a vibrant street-inspired palette.
                </p>
            </div>

            <div class="specs-grid">
                <div class="spec-item">
                    <span class="spec-label">Engine</span>
                    <span class="spec-value">3-Cyl Diesel</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">Capacity</span>
                    <span class="spec-value">3 Passengers</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">Top Speed</span>
                    <span class="spec-value">80 km/h</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">Origin</span>
                    <span class="spec-value">Mumbai, IN</span>
                </div>
            </div>

            <div class="controls-area">
                <span class="control-label">Select Livery</span>
                <div class="color-options">
                    <div class="color-btn active" style="background-color: #f1c40f;" onclick="changeColor('#f1c40f', '#d4ac0d', this)" title="Classic Yellow"></div>
                    <div class="color-btn" style="background-color: #e74c3c;" onclick="changeColor('#e74c3c', '#c0392b', this)" title="Red Alert"></div>
                    <div class="color-btn" style="background-color: #1abc9c;" onclick="changeColor('#1abc9c', '#16a085', this)" title="Metro Teal"></div>
                    <div class="color-btn" style="background-color: #3498db;" onclick="changeColor('#3498db', '#2980b9', this)" title="Royal Blue"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function changeColor(primary, secondary, element) {
            // Update Active Button State
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            element.classList.add('active');

            // Update CSS Variables for UI consistency
            document.documentElement.style.setProperty('--car-primary', primary);
            document.documentElement.style.setProperty('--car-secondary', secondary);

            // Update SVG Gradient directly
            const stops = document.getElementById('body-grad').children;
            stops[0].style.stopColor = primary;
            stops[1].style.stopColor = primary;
            stops[2].style.stopColor = secondary;
        }
    </script>
</body>
</html>
