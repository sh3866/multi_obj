<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Island Hopper: Redesign</title>
    <style>
        :root {
            --ui-font: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --ui-shadow: 0 4px 6px rgba(0,0,0,0.2);
            --ui-glass: rgba(255, 255, 255, 0.25);
            --ui-glass-border: rgba(255, 255, 255, 0.4);
            --ui-text: #ffffff;
            --ui-accent: #FFD700;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000; /* Fallback */
            font-family: var(--ui-font);
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            overscroll-behavior: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        /* HUD Top */
        .hud-top {
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .score-pill {
            background: var(--ui-glass);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--ui-glass-border);
            padding: 8px 20px;
            border-radius: 30px;
            box-shadow: var(--ui-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
            transform: translateY(0);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .score-pill.left { align-self: flex-start; }
        .score-pill.right { align-self: flex-end; }

        .score-label {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 2px;
        }

        .score-val {
            font-size: 32px;
            font-weight: 900;
            color: var(--ui-text);
            line-height: 1;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .score-val.best { color: var(--ui-accent); font-size: 28px; }

        /* Controls Area - Glassmorphism D-Pad */
        .controls-area {
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            margin-bottom: 20px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: 70px 70px 70px;
            grid-template-rows: 70px 70px;
            gap: 10px;
            transform: scale(0.9);
        }

        .btn {
            width: 70px;
            height: 70px;
            background: var(--ui-glass);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid var(--ui-glass-border);
            border-radius: 50%; /* Circular buttons */
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
        }

        .btn:active, .btn.pressed {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.92);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        /* SVG Icons */
        .icon { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2)); }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(-10px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (min-width: 768px) {
            .controls-area { transform: scale(1.2); }
            .d-pad { transform: scale(1.1); }
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="score-pill left">
                <div class="score-label">Score</div>
                <div class="score-val" id="score">0</div>
            </div>
            <div class="score-pill right">
                <div class="score-label">Best</div>
                <div class="score-val best" id="best">12</div>
            </div>
        </div>

        <div class="controls-area">
            <div class="d-pad">
                <div class="btn btn-up" id="btn-up">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                </div>
                <div class="btn btn-left" id="btn-left">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </div>
                <div class="btn btn-down" id="btn-down">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
                </div>
                <div class="btn btn-right" id="btn-right">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        /**
         * ISLAND HOPPER: REDESIGN
         * Focus: 2.5D Perspective, Painter's Algorithm, Procedural Geometry
         */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height;

        // --- Configuration & Design Palette ---
        const CONFIG = {
            fov: 280, // Wider FOV for more depth
            blockSize: 100, // Standard grid unit
            drawDistance: 24, // Lanes to render
            horizonY: 0.25, // Horizon is at 25% down the screen
            colors: {
                skyTop: '#4facfe',
                skyBot: '#f6d365', // Sunset vibe
                grass1: '#76c754',
                grass2: '#64b246',
                road: '#5e6472',
                roadLine: '#f1c40f',
                water: '#3498db',
                waterDeep: '#2980b9',
                wood: '#8d6e63',
                woodDark: '#5d4037',
                player: '#ffffff',
                playerComb: '#ff6b6b',
                playerBeak: '#feca57',
                shadow: 'rgba(0,0,0,0.15)'
            }
        };

        // --- State ---
        let camera = { z: 0 };
        let player = { 
            x: 0, 
            z: 0, 
            targetRot: 0,
            rot: 0,
            squish: 1,
            scale: 1.0 
        };
        let lanes = [];
        let score = 0;
        let time = 0;

        // --- Resize Handling ---
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Math Helpers ---
        const project = (x, y, z) => {
            const camZ = camera.z;
            const relZ = z - camZ;
            
            // Perspective projection
            const dist = Math.max(10, CONFIG.fov + relZ);
            const scale = CONFIG.fov / dist;
            
            // Center X, Project Y based on depth
            // Shift Y up so the player is lower on screen
            const y2d = ((y + relZ) * scale) + (height * CONFIG.horizonY);
            const x2d = (x * scale) + (width / 2);
            
            return { x: x2d, y: y2d, scale: scale };
        };

        const lerp = (a, b, t) => a + (b - a) * t;
        const rand = (min, max) => Math.random() * (max - min) + min;

        // --- Classes ---

        class Lane {
            constructor(zIndex) {
                this.z = zIndex * CONFIG.blockSize;
                this.type = this.determineType(zIndex);
                this.vehicles = [];
                this.logs = [];
                this.decorations = [];
                this.generateContent();
            }

            determineType(z) {
                if (z < 2) return 'grass';
                // Pattern: Grass, Road, Water, Grass, Road
                const mod = z % 5;
                if (mod === 1 || mod === 2) return 'road';
                if (mod === 3) return 'water';
                return 'grass';
            }

            generateContent() {
                if (this.type === 'road') {
                    const count = Math.floor(rand(2, 4));
                    for(let i=0; i<count; i++) {
                        const direction = Math.random() > 0.5 ? 1 : -1;
                        // Space them out
                        const xPos = (i * 300) + rand(-200, 200); 
                        this.vehicles.push({
                            x: xPos,
                            speed: rand(4, 8) * direction,
                            color: ['#e74c3c', '#3498db', '#f1c40f', '#9b59b6'][Math.floor(Math.random()*4)],
                            w: 60, h: 35, d: 45
                        });
                    }
                } else if (this.type === 'water') {
                    const count = Math.floor(rand(2, 3));
                    for(let i=0; i<count; i++) {
                        const direction = Math.random() > 0.5 ? 1 : -1;
                        this.logs.push({
                            x: (i * 400) + rand(-200, 200),
                            speed: rand(2, 4) * direction,
                            length: rand(150, 300),
                            width: 40
                        });
                    }
                } else {
                    // Grass decorations
                    const count = Math.floor(rand(3, 8));
                    for(let i=0; i<count; i++) {
                        this.decorations.push({
                            x: rand(-1000, 1000),
                            type: Math.random() > 0.6 ? 'tree' : 'bush',
                            scale: rand(0.8, 1.5)
                        });
                    }
                }
            }

            update() {
                this.vehicles.forEach(v => {
                    v.x += v.speed;
                    if (v.speed > 0 && v.x > 1200) v.x = -1200;
                    if (v.speed < 0 && v.x < -1200) v.x = 1200;
                });
                this.logs.forEach(l => {
                    l.x += l.speed;
                    if (l.speed > 0 && l.x > 1200) l.x = -1200;
                    if (l.speed < 0 && l.x < -1200) l.x = 1200;
                });
            }

            draw() {
                const zRel = this.z - camera.z;
                if (zRel < -CONFIG.fov || zRel > CONFIG.drawDistance * CONFIG.blockSize) return;

                // Draw the strip (Trapezoid)
                const p1 = project(-1500, 0, this.z);
                const p2 = project(1500, 0, this.z);
                const p3 = project(1500, 0, this.z + CONFIG.blockSize);
                const p4 = project(-1500, 0, this.z + CONFIG.blockSize);

                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.lineTo(p3.x, p3.y);
                ctx.lineTo(p4.x, p4.y);
                ctx.closePath();

                if (this.type === 'grass') {
                    const isAlt = Math.floor(this.z / CONFIG.blockSize) % 2 === 0;
                    ctx.fillStyle = isAlt ? CONFIG.colors.grass1 : CONFIG.colors.grass2;
                    ctx.fill();
                } else if (this.type === 'road') {
                    ctx.fillStyle = CONFIG.colors.road;
                    ctx.fill();
                    
                    // Dashed Line
                    ctx.beginPath();
                    const l1 = project(-1500, 2, this.z);
                    const l2 = project(1500, 2, this.z);
                    const l3 = project(1500, 2, this.z + CONFIG.blockSize);
                    const l4 = project(-1500, 2, this.z + CONFIG.blockSize);
                    ctx.moveTo(l1.x, l1.y);
                    ctx.lineTo(l2.x, l2.y);
                    ctx.lineTo(l3.x, l3.y);
                    ctx.lineTo(l4.x, l4.y);
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.fill();
                } else {
                    // Water
                    ctx.fillStyle = CONFIG.colors.water;
                    ctx.fill();
                    // Reflections/Highlight
                    ctx.fillStyle = 'rgba(255,255,255,0.1)';
                    ctx.fill();
                }
            }
        }

        // --- Drawing Helpers ---

        function drawCube(x, y, z, w, h, d, color, shadow = true) {
            const p = project(x, y, z);
            const s = p.scale;
            const hw = w * s / 2;
            const hh = h * s;
            const hd = d * s / 2; 

            if (shadow) {
                ctx.fillStyle = CONFIG.colors.shadow;
                ctx.beginPath();
                // Shadow ellipse
                ctx.ellipse(p.x + 5*s, p.y + 5*s, hw + 2*s, hd/1.5, 0, 0, Math.PI*2);
                ctx.fill();
            }

            // 1. Front Face
            ctx.fillStyle = color;
            ctx.fillRect(p.x - hw, p.y - hh, hw*2, hh);

            // 2. Right Face
            ctx.fillStyle = adjustColor(color, -20);
            ctx.beginPath();
            ctx.moveTo(p.x + hw, p.y - hh);
            ctx.lineTo(p.x + hw + hd, p.y - hh - hd);
            ctx.lineTo(p.x + hw + hd, p.y - hd);
            ctx.lineTo(p.x + hw, p.y);
            ctx.fill();

            // 3. Top Face
            ctx.fillStyle = adjustColor(color, 40);
            ctx.beginPath();
            ctx.moveTo(p.x - hw, p.y - hh);
            ctx.lineTo(p.x - hw + hd, p.y - hh - hd);
            ctx.lineTo(p.x + hw + hd, p.y - hh - hd);
            ctx.lineTo(p.x + hw, p.y - hh);
            ctx.fill();
            
            // Outline
            ctx.strokeStyle = adjustColor(color, -10);
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        function drawCone(x, y, z, w, h, color) {
            const p = project(x, y, z);
            const s = p.scale;
            
            // Shadow
            ctx.fillStyle = CONFIG.colors.shadow;
            ctx.beginPath();
            ctx.ellipse(p.x, p.y, w*s/2, w*s/4, 0, 0, Math.PI*2);
            ctx.fill();

            // Trunk
            const trunkH = h * 0.15;
            ctx.fillStyle = CONFIG.colors.woodDark;
            ctx.fillRect(p.x - (w*s/5), p.y - trunkH*s, w*s/2.5, trunkH*s);

            // Leaves
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - h*s);
            ctx.lineTo(p.x + w*s/2, p.y - trunkH*s);
            ctx.lineTo(p.x - w*s/2, p.y - trunkH*s);
            ctx.fill();
        }

        function drawPlayer(x, y, z) {
            const p = project(x, y, z);
            const s = p.scale * player.scale;
            
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(player.rot);

            // Squish effect
            const scaleY = player.squish;
            const scaleX = 1 + (1 - player.squish) * 0.4;
            ctx.scale(scaleX, scaleY);

            // Legs (Chicken feet)
            ctx.fillStyle = '#f39c12';
            ctx.fillRect(-12*s, -15*s, 8*s, 15*s);
            ctx.fillRect(4*s, -15*s, 8*s, 15*s);

            // Body
            drawCube(0, -15*s, 0, 35*s, 30*s, 30*s, CONFIG.colors.player, false);

            // Comb
            ctx.fillStyle = CONFIG.colors.playerComb;
            ctx.fillRect(-6*s, -48*s, 12*s, 10*s);

            // Beak
            ctx.fillStyle = CONFIG.colors.playerBeak;
            ctx.beginPath();
            ctx.moveTo(12*s, -38*s);
            ctx.lineTo(26*s, -34*s);
            ctx.lineTo(12*s, -28*s);
            ctx.fill();

            // Eye
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(10*s, -40*s, 3*s, 0, Math.PI*2);
            ctx.fill();

            ctx.restore();
        }

        function adjustColor(hex, percent) {
            let r = parseInt(hex.substring(1,3), 16);
            let g = parseInt(hex.substring(3,5), 16);
            let b = parseInt(hex.substring(5,7), 16);
            r = Math.min(255, Math.max(0, r + percent));
            g = Math.min(255, Math.max(0, g + percent));
            b = Math.min(255, Math.max(0, b + percent));
            return `rgb(${r},${g},${b})`;
        }

        // --- The Game Object ---

        const game = {
            init: () => {
                // Initial Lanes
                for(let i=0; i<CONFIG.drawDistance; i++) {
                    lanes.push(new Lane(i));
                }
                
                // Inputs
                window.addEventListener('keydown', (e) => {
                    if(e.key === 'ArrowUp') game.movePlayer(0, -1);
                    if(e.key === 'ArrowDown') game.movePlayer(0, 1);
                    if(e.key === 'ArrowLeft') game.movePlayer(-1, 0);
                    if(e.key === 'ArrowRight') game.movePlayer(1, 0);
                });

                const bindBtn = (id, dx, dy) => {
                    const btn = document.getElementById(id);
                    const trigger = (e) => {
                        e.preventDefault();
                        btn.classList.add('pressed');
                        game.movePlayer(dx, dy);
                        setTimeout(() => btn.classList.remove('pressed'), 150);
                    };
                    btn.addEventListener('mousedown', trigger);
                    btn.addEventListener('touchstart', trigger);
                };
                bindBtn('btn-up', 0, -1);
                bindBtn('btn-down', 0, 1);
                bindBtn('btn-left', -1, 0);
                bindBtn('btn-right', 1, 0);

                requestAnimationFrame(game.loop);
            },

            movePlayer: (dx, dy) => {
                // Forward
                if (dy === -1) {
                    player.z += CONFIG.blockSize;
                    player.squish = 0.6;
                    score++;
                    document.getElementById('score').innerText = score;
                    camera.z += CONFIG.blockSize;
                    
                    // Infinite generation
                    lanes.push(new Lane(lanes.length));
                    lanes.shift();
                } 
                // Back
                else if (dy === 1) {
                    if(player.z > 0) {
                        player.z -= CONFIG.blockSize;
                        camera.z -= CONFIG.blockSize;
                    }
                }
                // Side
                else if (dx !== 0) {
                    const gridSize = 80; // Tighter grid for movement
                    let currentSlot = Math.round(player.x / gridSize);
                    player.x = (currentSlot + dx) * gridSize;
                    
                    player.targetRot = dx * 0.4;
                    player.squish = 0.7;
                }
            },

            update: () => {
                time += 16;
                
                // Animation Physics
                player.squish = lerp(player.squish, 1, 0.15);
                player.rot = lerp(player.rot, player.targetRot, 0.15);
                player.targetRot = lerp(player.targetRot, 0, 0.05);

                lanes.forEach(lane => lane.update());

                // Collision Logic
                const currentLane = lanes.find(l => Math.abs(l.z - player.z) < 10);
                
                if (currentLane) {
                    if (currentLane.type === 'water') {
                        let onLog = false;
                        currentLane.logs.forEach(log => {
                            // AABB check
                            if (player.x > log.x - log.length/2 + 15 && player.x < log.x + log.length/2 - 15) {
                                onLog = true;
                                player.x += log.speed; // Move with log
                            }
                        });
                        if (!onLog) {
                            // Death logic (simplified: squish)
                            player.squish = 0.1; 
                        }
                    }
                    
                    if (currentLane.type === 'road') {
                        currentLane.vehicles.forEach(v => {
                            // Car collision
                            if (Math.abs(player.x - v.x) < v.w/2 + 15 && Math.abs(player.z - currentLane.z) < 10) {
                                player.squish = 0.1;
                            }
                        });
                    }
                }
            },

            draw: () => {
                // 1. Sky Gradient
                const grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, CONFIG.colors.skyTop);
                grad.addColorStop(1, CONFIG.colors.skyBot);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                // 2. Draw Queue (Painter's Algorithm)
                let drawables = [];

                lanes.forEach(l => {
                    drawables.push({ type: 'lane', obj: l, z: l.z });
                    
                    l.decorations.forEach(d => {
                        drawables.push({ type: 'deco', obj: d, z: l.z });
                    });
                    
                    l.logs.forEach(lg => {
                        drawables.push({ type: 'log', obj: lg, z: l.z });
                    });

                    l.vehicles.forEach(v => {
                        drawables.push({ type: 'vehicle', obj: v, z: l.z });
                    });
                });

                drawables.push({ type: 'player', z: player.z });

                // Sort by Z depth
                drawables.sort((a, b) => a.z - b.z);

                // 3. Render Loop
                drawables.forEach(item => {
                    if (item.type === 'lane') item.obj.draw();
                    
                    if (item.type === 'deco') {
                        const d = item.obj;
                        if (d.type === 'tree') {
                            drawCube(d.x, 0, item.z, 12*d.scale, 25*d.scale, 12*d.scale, CONFIG.colors.woodDark);
                            drawCone(d.x, 25*d.scale, item.z, 50*d.scale, 70*d.scale, '#2ecc71');
                        } else {
                            drawCube(d.x, 0, item.z, 35*d.scale, 25*d.scale, 35*d.scale, '#27ae60');
                        }
                    }

                    if (item.type === 'vehicle') {
                        const v = item.obj;
                        drawCube(v.x, 0, item.z, v.w, v.h, v.d, v.color);
                        
                        // Windshield
                        const vp = project(v.x, v.h, item.z);
                        const vs = vp.scale;
                        ctx.fillStyle = 'rgba(0,0,0,0.3)';
                        ctx.fillRect(vp.x - (v.w*vs/2) + 5*vs, vp.y - 4*vs, v.w*vs - 10*vs, 4*vs);
                    }

                    if (item.type === 'log') {
                        const l = item.obj;
                        drawCube(l.x, 0, item.z, l.length, 15, l.width, CONFIG.colors.wood, true);
                    }

                    if (item.type === 'player') {
                        drawPlayer(player.x, 0, player.z);
                    }
                });
            },

            loop: () => {
                game.update();
                game.draw();
                requestAnimationFrame(game.loop);
            }
        };

        // Start
        game.init();

    </script>
</body>
</html>
