<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Low Poly Crossy - Redesign</title>
    <style>
        :root {
            --ui-primary: #ffffff;
            --ui-shadow: rgba(0,0,0,0.15);
            --btn-bg: #f0f0f0;
            --btn-active: #e0e0e0;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #2c3e50; /* Fallback */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* Canvas Layer */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        /* HUD Top */
        .hud-top {
            padding: 24px;
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .score-pill {
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 12px var(--ui-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
            transform: scale(0.95);
            opacity: 0;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .score-pill:nth-child(2) { animation-delay: 0.1s; }

        .score-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8898aa;
            margin-bottom: 2px;
        }

        .score-val {
            font-size: 22px;
            font-weight: 800;
            color: #2d3436;
            line-height: 1;
        }

        .score-val.best { color: #e17055; }

        /* Controls Area */
        .controls-area {
            padding: 30px;
            padding-bottom: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            /* Fade out at bottom so it doesn't block view */
            background: linear-gradient(to top, rgba(0,0,0,0.1) 0%, transparent 100%);
        }

        .d-pad {
            display: grid;
            grid-template-columns: 64px 64px 64px;
            grid-template-rows: 64px 64px;
            gap: 10px;
            /* Tactile container */
            background: rgba(0,0,0,0.05);
            padding: 12px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn {
            width: 64px;
            height: 64px;
            background: var(--btn-bg);
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
            cursor: pointer;
            transition: all 0.1s ease;
            /* 3D Button Effect */
            box-shadow: 
                0 6px 0 #d1d1d1, 
                0 8px 10px rgba(0,0,0,0.1);
            position: relative;
            top: 0;
        }

        .btn:active, .btn.pressed {
            top: 6px;
            box-shadow: 
                0 0 0 #d1d1d1, 
                inset 0 2px 5px rgba(0,0,0,0.1);
            background: var(--btn-active);
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        /* SVG Icons */
        .icon { width: 24px; height: 24px; fill: currentColor; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.5) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Mobile Adjustments */
        @media (max-width: 500px) {
            .d-pad { transform: scale(0.9); }
            .hud-top { padding: 15px; }
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="score-pill">
                <div class="score-label">Score</div>
                <div class="score-val" id="score">0</div>
            </div>
            <div class="score-pill">
                <div class="score-label">Best</div>
                <div class="score-val best" id="best">42</div>
            </div>
        </div>

        <div class="controls-area">
            <div class="d-pad">
                <div class="btn btn-up" id="btn-up">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                </div>
                <div class="btn btn-left" id="btn-left">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </div>
                <div class="btn btn-down" id="btn-down">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
                </div>
                <div class="btn btn-right" id="btn-right">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        /**
         * LOW POLY CROSSY - REDESIGN
         * Focus: Isometric depth, vibrant colors, tactile UI, clear hazards.
         */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height;

        // --- Configuration & Design Palette ---
        const CONFIG = {
            fov: 400,
            blockSize: 100,
            drawDistance: 18,
            horizonOffset: 100,
            colors: {
                skyTop: '#87CEEB',
                skyBot: '#E0F7FA',
                grassLight: '#7ED957',
                grassDark: '#56AB2F',
                roadBase: '#34495E',
                roadLine: '#F1C40F',
                waterBase: '#2980B9',
                waterLight: '#6DD5FA',
                carRed: '#E74C3C',
                carBlue: '#3498DB',
                carOrange: '#F39C12',
                wood: '#8D6E63',
                woodDark: '#5D4037'
            }
        };

        // --- State ---
        let camera = { z: 0 };
        let player = { 
            x: 0, 
            y: 0, 
            z: 0, 
            targetY: 0, 
            squish: 1, 
            rot: 0, 
            targetRot: 0,
            color: '#FFFFFF' 
        };
        let lanes = [];
        let score = 0;
        let time = 0;

        // --- Resize Handling ---
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Math Helpers ---
        const project = (x, y, z) => {
            // Camera is at z=0 looking down +Z
            // We shift the world so player is roughly centered
            const camZ = camera.z;
            const relZ = z - camZ;
            
            // Perspective projection
            const scale = CONFIG.fov / (CONFIG.fov + Math.max(0, relZ));
            
            // Isometric-ish offset
            const x2d = (x * scale) + (width / 2);
            const y2d = ((y + relZ) * scale) + (height / 2) - CONFIG.horizonOffset;
            
            return { x: x2d, y: y2d, scale: scale };
        };

        const lerp = (a, b, t) => a + (b - a) * t;
        const rand = (min, max) => Math.random() * (max - min) + min;

        // --- Classes ---

        class Lane {
            constructor(zIndex) {
                this.z = zIndex * CONFIG.blockSize;
                this.type = this.determineType(zIndex);
                this.vehicles = [];
                this.logs = [];
                this.decorations = [];

                // Generate content
                if (this.type === 'road') {
                    const count = Math.floor(rand(2, 4));
                    for(let i=0; i<count; i++) {
                        this.vehicles.push({
                            x: rand(-1200, 1200),
                            speed: rand(4, 9) * (Math.random() > 0.5 ? 1 : -1),
                            color: [CONFIG.colors.carRed, CONFIG.colors.carBlue, CONFIG.colors.carOrange][Math.floor(Math.random()*3)],
                            width: rand(50, 70),
                            height: rand(30, 40)
                        });
                    }
                } else if (this.type === 'water') {
                    const count = Math.floor(rand(2, 3));
                    for(let i=0; i<count; i++) {
                        this.logs.push({
                            x: rand(-1200, 1200),
                            speed: rand(2, 4) * (Math.random() > 0.5 ? 1 : -1),
                            length: rand(150, 350)
                        });
                    }
                } else {
                    // Grass decorations
                    const count = Math.floor(rand(4, 10));
                    for(let i=0; i<count; i++) {
                        this.decorations.push({
                            x: rand(-1000, 1000),
                            type: Math.random() > 0.8 ? 'tree' : 'bush',
                            scale: rand(0.8, 1.3)
                        });
                    }
                }
            }

            determineType(z) {
                if (z < 2) return 'grass';
                // Pattern: Grass, Road, Water, Road, Grass
                const mod = z % 5;
                if (mod === 1 || mod === 2) return 'road';
                if (mod === 3) return 'water';
                return 'grass';
            }

            update() {
                this.vehicles.forEach(v => {
                    v.x += v.speed;
                    if (v.x > 1500) v.x = -1500;
                    if (v.x < -1500) v.x = 1500;
                });
                this.logs.forEach(l => {
                    l.x += l.speed;
                    if (l.x > 1500) l.x = -1500;
                    if (l.x < -1500) l.x = 1500;
                });
            }

            draw() {
                const zRel = this.z - camera.z;
                if (zRel < -CONFIG.fov || zRel > CONFIG.drawDistance * CONFIG.blockSize) return;

                // Draw the strip
                const pStart = project(-1200, 0, this.z);
                const pEnd = project(1200, 0, this.z);
                const pStartNext = project(-1200, 0, this.z + CONFIG.blockSize);
                const pEndNext = project(1200, 0, this.z + CONFIG.blockSize);

                ctx.beginPath();
                ctx.moveTo(pStart.x, pStart.y);
                ctx.lineTo(pEnd.x, pEnd.y);
                ctx.lineTo(pEndNext.x, pEndNext.y);
                ctx.lineTo(pStartNext.x, pStartNext.y);
                ctx.closePath();

                // Fill Base
                if (this.type === 'grass') {
                    const isAlt = Math.floor(this.z / CONFIG.blockSize) % 2 === 0;
                    ctx.fillStyle = isAlt ? CONFIG.colors.grassLight : CONFIG.colors.grassDark;
                } else if (this.type === 'road') {
                    ctx.fillStyle = CONFIG.colors.roadBase;
                } else {
                    ctx.fillStyle = CONFIG.colors.waterBase;
                }
                ctx.fill();

                // Details
                if (this.type === 'road') {
                    // Dashed lines
                    ctx.beginPath();
                    const lineStart = project(-width/4, 0, this.z);
                    const lineEnd = project(width/4, 0, this.z);
                    ctx.moveTo(lineStart.x, lineStart.y);
                    ctx.lineTo(lineEnd.x, lineEnd.y);
                    ctx.strokeStyle = CONFIG.colors.roadLine;
                    ctx.lineWidth = 4 * pStart.scale;
                    ctx.setLineDash([20 * pStart.scale, 20 * pStart.scale]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                } else if (this.type === 'water') {
                    // Water shimmer
                    ctx.fillStyle = CONFIG.colors.waterLight;
                    ctx.globalAlpha = 0.3;
                    ctx.fillRect(pStart.x, pStart.y, pEnd.x - pStart.x, pEndNext.y - pStart.y);
                    ctx.globalAlpha = 1.0;
                }
            }
        }

        // --- Drawing Helpers ---

        // Draw a 3D box in isometric-ish perspective
        function drawBox(x, y, z, w, h, d, color, isLog = false) {
            const p = project(x, y, z);
            const scale = p.scale;
            
            const hw = w * scale / 2;
            const hh = h * scale;
            const hd = d * scale / 2;

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.beginPath();
            ctx.ellipse(p.x + 5*scale, p.y + 5*scale, hw, hd/1.5, 0, 0, Math.PI*2);
            ctx.fill();

            // Front Face
            ctx.fillStyle = color;
            ctx.fillRect(p.x - hw, p.y - hh, hw*2, hh);
            
            // Top Face (Lighter)
            ctx.fillStyle = lighten(color, 30);
            ctx.beginPath();
            ctx.moveTo(p.x - hw, p.y - hh);
            ctx.lineTo(p.x - hw + hd, p.y - hh - hd); // Top Left
            ctx.lineTo(p.x + hw + hd, p.y - hh - hd); // Top Right
            ctx.lineTo(p.x + hw, p.y - hh);
            ctx.fill();

            // Side Face (Darker) - Right side
            ctx.fillStyle = darken(color, 20);
            ctx.beginPath();
            ctx.moveTo(p.x + hw, p.y - hh);
            ctx.lineTo(p.x + hw + hd, p.y - hh - hd);
            ctx.lineTo(p.x + hw + hd, p.y - hd);
            ctx.lineTo(p.x + hw, p.y);
            ctx.fill();
            
            // Simple outline for "pop"
            ctx.strokeStyle = darken(color, 40);
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        function lighten(hex, percent) {
            // Very basic hex lighter
            let r = parseInt(hex.substring(1,3), 16);
            let g = parseInt(hex.substring(3,5), 16);
            let b = parseInt(hex.substring(5,7), 16);
            r = Math.min(255, r + percent);
            g = Math.min(255, g + percent);
            b = Math.min(255, b + percent);
            return `rgb(${r},${g},${b})`;
        }
        function darken(hex, percent) {
            let r = parseInt(hex.substring(1,3), 16);
            let g = parseInt(hex.substring(3,5), 16);
            let b = parseInt(hex.substring(5,7), 16);
            r = Math.max(0, r - percent);
            g = Math.max(0, g - percent);
            b = Math.max(0, b - percent);
            return `rgb(${r},${g},${b})`;
        }

        // --- The Game Object ---

        const game = {
            init: () => {
                for(let i=0; i<CONFIG.drawDistance; i++) {
                    lanes.push(new Lane(i));
                }
                
                // Keyboard Input
                window.addEventListener('keydown', (e) => {
                    if(e.key === 'ArrowUp') game.movePlayer(0, -1);
                    if(e.key === 'ArrowDown') game.movePlayer(0, 1);
                    if(e.key === 'ArrowLeft') game.movePlayer(-1, 0);
                    if(e.key === 'ArrowRight') game.movePlayer(1, 0);
                });

                // Touch/Click Input for UI
                const bindBtn = (id, dx, dy) => {
                    const btn = document.getElementById(id);
                    const trigger = (e) => {
                        e.preventDefault();
                        btn.classList.add('pressed');
                        game.movePlayer(dx, dy);
                        setTimeout(() => btn.classList.remove('pressed'), 150);
                    };
                    btn.addEventListener('mousedown', trigger);
                    btn.addEventListener('touchstart', trigger);
                };
                bindBtn('btn-up', 0, -1);
                bindBtn('btn-down', 0, 1);
                bindBtn('btn-left', -1, 0);
                bindBtn('btn-right', 1, 0);

                requestAnimationFrame(game.loop);
            },

            movePlayer: (dx, dy) => {
                const currentLaneIdx = Math.round(player.z / CONFIG.blockSize);
                
                // Forward
                if (dy === -1) {
                    player.z += CONFIG.blockSize;
                    player.squish = 0.6;
                    score++;
                    document.getElementById('score').innerText = score;
                    camera.z += CONFIG.blockSize;
                    
                    lanes.push(new Lane(lanes.length));
                    lanes.shift();
                } 
                // Back
                else if (dy === 1) {
                    if(player.z > 0) {
                        player.z -= CONFIG.blockSize;
                        camera.z -= CONFIG.blockSize;
                    }
                }
                // Side
                else if (dx !== 0) {
                    // Grid snapping for X
                    // Find nearest grid slot
                    const gridSize = 80;
                    let currentSlot = Math.round(player.x / gridSize);
                    player.x = (currentSlot + dx) * gridSize;
                    
                    player.targetRot = dx * 0.3;
                    player.squish = 0.8;
                }
            },

            update: () => {
                time += 16;
                
                // Physics
                player.squish = lerp(player.squish, 1, 0.1);
                player.rot = lerp(player.rot, player.targetRot, 0.1);
                player.targetRot = lerp(player.targetRot, 0, 0.05);

                lanes.forEach(lane => lane.update());

                // Collision Logic (Simple)
                const currentLane = lanes.find(l => Math.abs(l.z - player.z) < 10);
                if (currentLane && currentLane.type === 'water') {
                    let onLog = false;
                    currentLane.logs.forEach(log => {
                        if (player.x > log.x - log.length/2 && player.x < log.x + log.length/2) {
                            onLog = true;
                            player.x += log.speed;
                        }
                    });
                    if (!onLog) {
                        // Reset visual (simulating death/reset)
                        // In a real game, show Game Over screen
                        player.squish = 0.1; // Squish flat
                    }
                }
                
                // Car Collision
                if (currentLane && currentLane.type === 'road') {
                    currentLane.vehicles.forEach(v => {
                        if (Math.abs(player.x - v.x) < v.width/2 + 20 && Math.abs(player.z - currentLane.z) < 10) {
                            player.squish = 0.1;
                        }
                    });
                }
            },

            draw: () => {
                // 1. Sky Gradient
                const grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, CONFIG.colors.skyTop);
                grad.addColorStop(1, CONFIG.colors.skyBot);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                // 2. Draw Queue
                let drawables = [];

                lanes.forEach(l => {
                    drawables.push({ type: 'lane', obj: l, z: l.z });
                    l.decorations.forEach(d => {
                        drawables.push({ type: 'deco', obj: d, z: l.z });
                    });
                    l.vehicles.forEach(v => {
                        drawables.push({ type: 'vehicle', obj: v, z: l.z });
                    });
                    l.logs.forEach(lg => {
                        drawables.push({ type: 'log', obj: lg, z: l.z });
                    });
                });

                drawables.push({ type: 'player', z: player.z });

                // Sort by Z depth (Painter's Algorithm)
                drawables.sort((a, b) => a.z - b.z);

                // 3. Render Loop
                drawables.forEach(item => {
                    if (item.type === 'lane') item.obj.draw();
                    
                    if (item.type === 'deco') {
                        const d = item.obj;
                        // Trees
                        if (d.type === 'tree') {
                            drawBox(d.x, 0, item.z, 15, 40, 15, '#795548'); // Trunk
                            drawBox(d.x, 45, item.z, 50, 50, 50, CONFIG.colors.grassDark); // Leaves
                        } else {
                            drawBox(d.x, 0, item.z, 25, 20, 25, '#8BC34A'); // Bush
                        }
                    }

                    if (item.type === 'vehicle') {
                        const v = item.obj;
                        drawBox(v.x, 0, item.z, v.width, v.height, v.width*0.8, v.color);
                    }

                    if (item.type === 'log') {
                        const l = item.obj;
                        drawBox(l.x, 0, item.z, l.length, 25, 25, CONFIG.colors.wood, true);
                    }

                    if (item.type === 'player') {
                        const p = project(player.x, 0, player.z);
                        const s = p.scale;
                        
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(player.rot);

                        // Squish
                        const scaleY = player.squish;
                        const scaleX = 1 + (1 - player.squish) * 0.5;
                        ctx.scale(scaleX, scaleY);

                        // Legs
                        ctx.fillStyle = '#F39C12';
                        ctx.fillRect(-10*s, -20*s, 6*s, 20*s);
                        ctx.fillRect(4*s, -20*s, 6*s, 20*s);

                        // Body (White Cube)
                        drawBox(0, -20*s, 0, 35*s, 35*s, 35*s, player.color);
                        
                        // Comb (Red)
                        ctx.fillStyle = '#E74C3C';
                        ctx.fillRect(-5*s, -58*s, 10*s, 8*s);

                        // Beak (Yellow)
                        ctx.fillStyle = '#F1C40F';
                        ctx.beginPath();
                        ctx.moveTo(15*s, -42*s);
                        ctx.lineTo(28*s, -38*s);
                        ctx.lineTo(15*s, -32*s);
                        ctx.fill();

                        // Eye (Black)
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(10*s, -45*s, 2.5*s, 0, Math.PI*2);
                        ctx.fill();

                        ctx.restore();
                    }
                });
            },

            loop: () => {
                game.update();
                game.draw();
                requestAnimationFrame(game.loop);
            }
        };

        // Start
        game.init();

    </script>
</body>
</html>
