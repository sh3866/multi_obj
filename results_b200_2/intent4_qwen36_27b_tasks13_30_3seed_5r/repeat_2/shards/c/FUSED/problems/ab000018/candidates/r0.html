<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crossy Pixel - Visual Design</title>
    <style>
        :root {
            --sky-top: #4facfe;
            --sky-bottom: #00f2fe;
            --grass-light: #a8e063;
            --grass-dark: #56ab2f;
            --road-base: #34495e;
            --road-line: #f1c40f;
            --water-base: #2980b9;
            --water-light: #6dd5fa;
            --ui-bg: rgba(0,0,0,0.4);
            --text-color: #fff;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* UI Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        .hud-top {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .score-box {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 8px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            min-width: 80px;
            transform: translateY(-10px);
            opacity: 0;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .score-label {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 2px;
        }

        .score-val {
            font-size: 24px;
            font-weight: 900;
            color: #333;
        }

        .score-val.best {
            color: #e67e22;
        }

        /* Controls */
        .controls-area {
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        .d-pad {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px;
            gap: 8px;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
        }

        .btn {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.1);
            background: rgba(255,255,255,0.4);
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        /* SVG Icons */
        .icon { width: 24px; height: 24px; fill: currentColor; }

        /* Canvas */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(20px) scale(0.8); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            .d-pad { transform: scale(0.8); }
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="score-box">
                <div class="score-label">Score</div>
                <div class="score-val" id="score">0</div>
            </div>
            <div class="score-box" style="animation-delay: 0.1s;">
                <div class="score-label">Best</div>
                <div class="score-val best" id="best">12</div>
            </div>
        </div>

        <div class="controls-area">
            <div class="d-pad">
                <div class="btn btn-up" onclick="game.movePlayer(0, -1)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
                </div>
                <div class="btn btn-left" onclick="game.movePlayer(-1, 0)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z"/></svg>
                </div>
                <div class="btn btn-down" onclick="game.movePlayer(0, 1)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
                </div>
                <div class="btn btn-right" onclick="game.movePlayer(1, 0)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        /**
         * CROSSY PIXEL
         * A single-file pseudo-3D engine for visual demonstration.
         */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize
        let width, height;

        // --- Configuration ---
        const CONFIG = {
            fov: 300,
            blockSize: 100,
            lanes: 15,
            drawDistance: 20,
            colors: {
                skyTop: [79, 172, 254],
                skyBot: [0, 242, 254],
                grass: [168, 224, 99],
                grassDark: [86, 171, 47],
                road: [52, 73, 94],
                roadLine: [241, 196, 15],
                water: [41, 128, 185],
                waterLight: [109, 213, 250]
            }
        };

        // --- State ---
        let camera = { z: 0 };
        let player = { x: 0, y: 0, z: 0, targetY: 0, squish: 1, rot: 0, targetRot: 0 };
        let lanes = [];
        let particles = [];
        let score = 0;
        let time = 0;

        // --- Resize Handling ---
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Math Helpers ---
        const project = (x, y, z) => {
            const scale = CONFIG.fov / (CONFIG.fov + z - camera.z);
            const x2d = (x * scale) + (width / 2);
            const y2d = (y * scale) + (height / 2) - 100; // Horizon offset
            return { x: x2d, y: y2d, scale: scale };
        };

        const lerp = (a, b, t) => a + (b - a) * t;
        const rand = (min, max) => Math.random() * (max - min) + min;

        // --- Classes ---

        class Lane {
            constructor(zIndex) {
                this.z = zIndex * CONFIG.blockSize;
                this.type = this.determineType(zIndex);
                this.vehicles = [];
                this.logs = [];
                this.decorations = [];

                // Generate content based on type
                if (this.type === 'road') {
                    const count = Math.floor(rand(2, 4));
                    for(let i=0; i<count; i++) {
                        this.vehicles.push({
                            x: rand(-width, width),
                            speed: rand(3, 8) * (Math.random() > 0.5 ? 1 : -1),
                            color: Math.random() > 0.5 ? '#e74c3c' : '#f39c12',
                            width: rand(40, 70),
                            height: rand(25, 35)
                        });
                    }
                } else if (this.type === 'water') {
                    const count = Math.floor(rand(2, 3));
                    for(let i=0; i<count; i++) {
                        this.logs.push({
                            x: rand(-width, width),
                            speed: rand(1, 3) * (Math.random() > 0.5 ? 1 : -1),
                            length: rand(150, 300)
                        });
                    }
                } else {
                    // Grass decorations (trees/bushes)
                    const count = Math.floor(rand(3, 8));
                    for(let i=0; i<count; i++) {
                        this.decorations.push({
                            x: rand(-width/1.5, width/1.5),
                            type: Math.random() > 0.7 ? 'tree' : 'bush',
                            scale: rand(0.8, 1.2)
                        });
                    }
                }
            }

            determineType(z) {
                if (z < 5) return 'grass';
                // Pattern: Grass, Road, Road, Water, Grass
                const mod = z % 5;
                if (mod === 1 || mod === 2) return 'road';
                if (mod === 3) return 'water';
                return 'grass';
            }

            update() {
                // Move vehicles
                this.vehicles.forEach(v => {
                    v.x += v.speed;
                    if (v.x > width + 200) v.x = -width - 200;
                    if (v.x < -width - 200) v.x = width + 200;
                });
                // Move logs
                this.logs.forEach(l => {
                    l.x += l.speed;
                    if (l.x > width + 400) l.x = -width - 400;
                    if (l.x < -width - 400) l.x = width + 400;
                });
            }

            draw() {
                const zRel = this.z - camera.z;
                if (zRel < -CONFIG.fov || zRel > CONFIG.drawDistance * CONFIG.blockSize) return;

                const pStart = project(-width, 0, this.z);
                const pEnd = project(width, 0, this.z);
                const pStartNext = project(-width, 0, this.z + CONFIG.blockSize);
                const pEndNext = project(width, 0, this.z + CONFIG.blockSize);

                // Draw Ground Plane
                ctx.beginPath();
                ctx.moveTo(pStart.x, pStart.y);
                ctx.lineTo(pEnd.x, pEnd.y);
                ctx.lineTo(pEndNext.x, pEndNext.y);
                ctx.lineTo(pStartNext.x, pStartNext.y);
                ctx.closePath();

                if (this.type === 'grass') {
                    ctx.fillStyle = (Math.floor(this.z / CONFIG.blockSize) % 2 === 0) 
                        ? `rgb(${CONFIG.colors.grass.join(',')})` 
                        : `rgb(${CONFIG.colors.grassDark.join(',')})`;
                } else if (this.type === 'road') {
                    ctx.fillStyle = `rgb(${CONFIG.colors.road.join(',')})`;
                } else if (this.type === 'water') {
                    // Simple animated water effect
                    const waveOffset = Math.sin(time * 0.005 + this.z) * 5;
                    ctx.fillStyle = `rgb(${CONFIG.colors.water.join(',')})`;
                }
                ctx.fill();

                // Draw details (lines, logs)
                if (this.type === 'road') {
                    // Road Lines
                    ctx.beginPath();
                    const lineStart = project(-width/4, 0, this.z);
                    const lineEnd = project(width/4, 0, this.z);
                    ctx.moveTo(lineStart.x, lineStart.y);
                    ctx.lineTo(lineEnd.x, lineEnd.y);
                    ctx.strokeStyle = `rgba(${CONFIG.colors.roadLine.join(',')}, 0.5)`;
                    ctx.lineWidth = 2 * pStart.scale;
                    ctx.stroke();
                } else if (this.type === 'water') {
                    // Water ripples
                    ctx.strokeStyle = `rgba(${CONFIG.colors.waterLight.join(',')}, 0.3)`;
                    ctx.lineWidth = 2 * pStart.scale;
                    for(let i=-1; i<=1; i+=0.5) {
                        const s = project(i * (width/3), 0, this.z);
                        const e = project(i * (width/3) + 50, 0, this.z);
                        ctx.beginPath();
                        ctx.moveTo(s.x, s.y);
                        ctx.lineTo(e.x, e.y);
                        ctx.stroke();
                    }
                }
            }
        }

        // --- Drawing Helpers (Pseudo-3D Cuboids) ---
        
        function drawBox(x, y, z, w, h, d, color, isLog = false) {
            const p = project(x, y, z);
            const scale = p.scale;
            
            const hw = w * scale / 2;
            const hh = h * scale;
            const hd = d * scale / 2;

            // Front Face
            ctx.fillStyle = color;
            ctx.fillRect(p.x - hw, p.y - hh, hw*2, hh);
            
            // Top Face (Lighter)
            const topColor = isLog ? '#8d6e63' : lighten(color, 20);
            ctx.fillStyle = topColor;
            ctx.beginPath();
            ctx.moveTo(p.x - hw, p.y - hh);
            ctx.lineTo(p.x - hw + hd, p.y - hh - hd); // Top Left
            ctx.lineTo(p.x + hw + hd, p.y - hh - hd); // Top Right
            ctx.lineTo(p.x + hw, p.y - hh);
            ctx.fill();

            // Side Face (Darker) - Right side
            const sideColor = isLog ? '#5d4037' : darken(color, 20);
            ctx.fillStyle = sideColor;
            ctx.beginPath();
            ctx.moveTo(p.x + hw, p.y - hh);
            ctx.lineTo(p.x + hw + hd, p.y - hh - hd);
            ctx.lineTo(p.x + hw + hd, p.y - hd);
            ctx.lineTo(p.x + hw, p.y);
            ctx.fill();
        }

        function lighten(hex, percent) {
            // Simplified hex lighten
            return hex; // Placeholder for brevity, using simple logic in drawBox
        }
        function darken(hex, percent) {
            return hex;
        }

        // --- The Game Object ---

        const game = {
            init: () => {
                // Initial Lanes
                for(let i=0; i<CONFIG.drawDistance; i++) {
                    lanes.push(new Lane(i));
                }
                
                // Input
                window.addEventListener('keydown', (e) => {
                    if(e.key === 'ArrowUp') game.movePlayer(0, -1);
                    if(e.key === 'ArrowDown') game.movePlayer(0, 1);
                    if(e.key === 'ArrowLeft') game.movePlayer(-1, 0);
                    if(e.key === 'ArrowRight') game.movePlayer(1, 0);
                });

                requestAnimationFrame(game.loop);
            },

            movePlayer: (dx, dy) => {
                // Simple grid movement logic
                // In this visual demo, we just move on the Z axis mostly to simulate crossing
                // We lock X to a grid
                
                const gridSize = width / 10; // Virtual grid
                
                // Current lane index
                const currentLaneIdx = Math.round(player.z / CONFIG.blockSize);
                
                // Apply movement
                if (dy === -1) { // Forward
                    player.z += CONFIG.blockSize;
                    player.targetY = 0; // Reset jump
                    player.squish = 0.7; // Squish effect
                    score++;
                    document.getElementById('score').innerText = score;
                    
                    // Camera follow
                    camera.z += CONFIG.blockSize;
                    
                    // Generate new lane
                    lanes.push(new Lane(lanes.length));
                    lanes.shift(); // Remove old
                } 
                else if (dy === 1) { // Back
                    if(player.z > 0) {
                        player.z -= CONFIG.blockSize;
                        camera.z -= CONFIG.blockSize;
                    }
                }
                else if (dx !== 0) { // Side
                    player.x += dx * 80; // Move pixels
                    player.targetRot = dx * 0.2;
                    player.squish = 0.8;
                }
            },

            update: () => {
                time += 16;
                
                // Smooth Camera
                // Ideally camera follows player, but for the "Crossy Road" feel, 
                // the camera snaps or lags slightly. Here we sync perfectly for smoothness.
                
                // Player Physics (Squish bounce)
                player.squish = lerp(player.squish, 1, 0.1);
                player.rot = lerp(player.rot, player.targetRot, 0.1);
                player.targetRot = lerp(player.targetRot, 0, 0.05);

                // Update Lanes
                lanes.forEach(lane => lane.update());

                // Collision Logic (Visual only - prevent falling into water if no log)
                const currentLane = lanes.find(l => Math.abs(l.z - player.z) < 10);
                if (currentLane && currentLane.type === 'water') {
                    let onLog = false;
                    currentLane.logs.forEach(log => {
                        if (player.x > log.x - log.length/2 && player.x < log.x + log.length/2) {
                            onLog = true;
                            player.x += log.speed; // Ride the log
                        }
                    });
                    if (!onLog) {
                        // Fall logic (not implemented fully, just reset)
                        // player.y += 10; 
                    }
                }
            },

            draw: () => {
                // 1. Sky
                const grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, `rgb(${CONFIG.colors.skyTop.join(',')})`);
                grad.addColorStop(1, `rgb(${CONFIG.colors.skyBot.join(',')})`);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                // 2. Sort Drawables by Z (Painter's Algorithm)
                // We need to combine lanes, vehicles, logs, player, and trees into one list
                
                let drawables = [];

                // Add Lanes (Ground)
                lanes.forEach(l => {
                    drawables.push({ type: 'lane', obj: l, z: l.z });
                    // Add decorations
                    l.decorations.forEach(d => {
                        drawables.push({ type: 'deco', obj: d, z: l.z });
                    });
                    // Add Vehicles
                    l.vehicles.forEach(v => {
                        drawables.push({ type: 'vehicle', obj: v, z: l.z });
                    });
                    // Add Logs
                    l.logs.forEach(lg => {
                        drawables.push({ type: 'log', obj: lg, z: l.z });
                    });
                });

                // Add Player
                drawables.push({ type: 'player', z: player.z });

                // Sort
                drawables.sort((a, b) => a.z - b.z);

                // 3. Draw Loop
                drawables.forEach(item => {
                    if (item.type === 'lane') item.obj.draw();
                    
                    if (item.type === 'deco') {
                        const d = item.obj;
                        const p = project(d.x, 0, item.z);
                        if (d.type === 'tree') {
                            // Trunk
                            drawBox(d.x, 0, item.z, 10*p.scale, 40*p.scale, 10*p.scale, '#795548');
                            // Leaves
                            drawBox(d.x, 40*p.scale, item.z, 40*p.scale, 50*p.scale, 40*p.scale, '#4caf50');
                        } else {
                            drawBox(d.x, 0, item.z, 20*p.scale, 15*p.scale, 20*p.scale, '#8bc34a');
                        }
                    }

                    if (item.type === 'vehicle') {
                        const v = item.obj;
                        // Draw vehicle body
                        drawBox(v.x, 0, item.z, v.width, v.height, v.width*0.8, v.color);
                        // Draw wheels (simplified)
                        const wheelP = project(v.x, 0, item.z);
                        ctx.fillStyle = '#333';
                        ctx.fillRect(wheelP.x - v.width/2*scale, wheelP.y - v.height/2*scale, v.width/4*scale, v.height/2*scale);
                    }

                    if (item.type === 'log') {
                        const l = item.obj;
                        drawBox(l.x, 0, item.z, l.length, 20, 20, '#795548', true);
                    }

                    if (item.type === 'player') {
                        // Draw Player (The "Charming Animal" - A Cube Chicken)
                        const p = project(player.x, 0, player.z);
                        const s = p.scale;
                        
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        
                        // Shadow
                        ctx.fillStyle = 'rgba(0,0,0,0.2)';
                        ctx.beginPath();
                        ctx.ellipse(0, 0, 20*s, 10*s, 0, 0, Math.PI*2);
                        ctx.fill();

                        // Squish effect
                        const scaleY = player.squish;
                        const scaleX = 1 + (1 - player.squish) * 0.5;
                        ctx.scale(scaleX, scaleY);

                        // Legs
                        ctx.fillStyle = '#f39c12';
                        ctx.fillRect(-10*s, -20*s, 5*s, 20*s);
                        ctx.fillRect(5*s, -20*s, 5*s, 20*s);

                        // Body
                        drawBox(0, -20*s, 0, 30*s, 30*s, 30*s, '#ffffff'); // White body
                        
                        // Comb (Red thing on head)
                        ctx.fillStyle = '#e74c3c';
                        ctx.fillRect(-5*s, -55*s, 10*s, 10*s);

                        // Beak
                        ctx.fillStyle = '#f1c40f';
                        ctx.beginPath();
                        ctx.moveTo(15*s, -40*s);
                        ctx.lineTo(25*s, -35*s);
                        ctx.lineTo(15*s, -30*s);
                        ctx.fill();

                        // Eyes
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(10*s, -45*s, 2*s, 0, Math.PI*2);
                        ctx.fill();

                        ctx.restore();
                    }
                });
            },

            loop: () => {
                game.update();
                game.draw();
                requestAnimationFrame(game.loop);
            }
        };

        // Start
        game.init();

    </script>
</body>
</html>
