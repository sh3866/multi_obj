<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crossy Road Redesign</title>
    <style>
        :root {
            --ui-primary: #ffffff;
            --ui-bg: rgba(255, 255, 255, 0.9);
            --ui-shadow: 0 4px 12px rgba(0,0,0,0.15);
            --btn-color: #f0f4f8;
            --btn-shadow: #bdc3c7;
            --accent: #ff6b6b;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        /* HUD Top - Integrated Sky Bar */
        .hud-top {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .score-container {
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 24px;
            border-radius: 16px;
            box-shadow: var(--ui-shadow);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateY(0);
            animation: slideDown 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .score-label {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #7f8c8d;
            margin-bottom: 2px;
        }

        .score-val {
            font-size: 28px;
            font-weight: 900;
            color: #2d3436;
            line-height: 1;
        }

        .score-val.best { 
            color: var(--accent);
            font-size: 20px;
        }

        /* Controls Area */
        .controls-area {
            padding: 20px;
            padding-bottom: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            background: linear-gradient(to top, rgba(0,0,0,0.2) 0%, transparent 100%);
        }

        .d-pad {
            display: grid;
            grid-template-columns: 70px 70px 70px;
            grid-template-rows: 70px 70px;
            gap: 12px;
        }

        .btn {
            width: 70px;
            height: 70px;
            background: var(--btn-color);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
            cursor: pointer;
            transition: all 0.08s ease;
            /* Tactile 3D Button */
            box-shadow: 
                0 8px 0 var(--btn-shadow), 
                0 12px 15px rgba(0,0,0,0.2);
            position: relative;
            top: 0;
            border: 2px solid #fff;
        }

        .btn:active, .btn.pressed {
            top: 8px;
            box-shadow: 
                0 0 0 var(--btn-shadow), 
                inset 0 4px 8px rgba(0,0,0,0.15);
            background: #eef2f5;
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        /* SVG Icons */
        .icon { width: 28px; height: 28px; fill: currentColor; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Adjustments */
        @media (max-width: 500px) {
            .d-pad { transform: scale(0.9); }
            .hud-top { padding: 15px; }
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="score-container">
                <div class="score-label">Score</div>
                <div class="score-val" id="score">0</div>
            </div>
            <div class="score-container">
                <div class="score-label">Best</div>
                <div class="score-val best" id="best">42</div>
            </div>
        </div>

        <div class="controls-area">
            <div class="d-pad">
                <div class="btn btn-up" id="btn-up">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7-7 7 7"/></svg>
                </div>
                <div class="btn btn-left" id="btn-left">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </div>
                <div class="btn btn-down" id="btn-down">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
                </div>
                <div class="btn btn-right" id="btn-right">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        /**
         * CROSSY ROAD REDESIGN
         * Technical Focus: 2.5D Perspective, Painter's Algorithm, Procedural Geometry
         */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height;

        // --- Configuration & Design Palette ---
        const CONFIG = {
            fov: 350,
            blockSize: 80, // Reduced to fit more on screen
            drawDistance: 20,
            horizonOffset: 120,
            colors: {
                skyTop: '#4facfe',
                skyBot: '#00f2fe',
                grassLight: '#a8e063',
                grassDark: '#56ab2f',
                grassNoise: 'rgba(0,0,0,0.03)',
                roadBase: '#535c68',
                roadLine: '#f1c40f',
                waterBase: '#4facfe',
                waterDeep: '#00f2fe',
                carRed: '#ff6b6b',
                carBlue: '#54a0ff',
                carOrange: '#ff9f43',
                wood: '#8d6e63',
                woodDark: '#5d4037',
                playerBody: '#ffffff',
                playerComb: '#ff6b6b',
                playerBeak: '#feca57'
            }
        };

        // --- State ---
        let camera = { z: 0 };
        let player = { 
            x: 0, 
            z: 0, 
            targetRot: 0,
            rot: 0,
            squish: 1,
            scale: 1.5 // Scale up player by 1.5x
        };
        let lanes = [];
        let score = 0;
        let time = 0;

        // --- Resize Handling ---
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Math Helpers ---
        const project = (x, y, z) => {
            const camZ = camera.z;
            const relZ = z - camZ;
            
            // Perspective projection
            // Prevent division by zero or negative scale
            const dist = Math.max(10, CONFIG.fov + relZ);
            const scale = CONFIG.fov / dist;
            
            // Center X, Project Y based on depth
            const x2d = (x * scale) + (width / 2);
            const y2d = ((y + relZ) * scale) + (height / 2) - CONFIG.horizonOffset;
            
            return { x: x2d, y: y2d, scale: scale };
        };

        const lerp = (a, b, t) => a + (b - a) * t;
        const rand = (min, max) => Math.random() * (max - min) + min;

        // --- Classes ---

        class Lane {
            constructor(zIndex) {
                this.z = zIndex * CONFIG.blockSize;
                this.type = this.determineType(zIndex);
                this.vehicles = [];
                this.logs = [];
                this.decorations = [];
                this.offsetX = Math.random() * 1000; // For texture movement

                this.generateContent();
            }

            determineType(z) {
                if (z < 3) return 'grass';
                // Pattern: Grass, Road, Water, Road, Grass
                const mod = z % 5;
                if (mod === 1 || mod === 2) return 'road';
                if (mod === 3) return 'water';
                return 'grass';
            }

            generateContent() {
                if (this.type === 'road') {
                    const count = Math.floor(rand(2, 4));
                    for(let i=0; i<count; i++) {
                        // Ensure cars don't overlap initially
                        const direction = Math.random() > 0.5 ? 1 : -1;
                        const xPos = rand(-1000, 1000);
                        this.vehicles.push({
                            x: xPos,
                            speed: rand(3, 7) * direction,
                            color: [CONFIG.colors.carRed, CONFIG.colors.carBlue, CONFIG.colors.carOrange][Math.floor(Math.random()*3)],
                            width: rand(60, 80),
                            height: rand(35, 45),
                            depth: rand(50, 60)
                        });
                    }
                } else if (this.type === 'water') {
                    const count = Math.floor(rand(2, 3));
                    for(let i=0; i<count; i++) {
                        const direction = Math.random() > 0.5 ? 1 : -1;
                        this.logs.push({
                            x: rand(-1000, 1000),
                            speed: rand(2, 4) * direction,
                            length: rand(160, 350),
                            width: 35
                        });
                    }
                } else {
                    // Grass decorations
                    const count = Math.floor(rand(5, 12));
                    for(let i=0; i<count; i++) {
                        this.decorations.push({
                            x: rand(-1200, 1200),
                            type: Math.random() > 0.7 ? 'tree' : 'bush',
                            scale: rand(0.8, 1.4),
                            colorVar: Math.random()
                        });
                    }
                }
            }

            update() {
                this.vehicles.forEach(v => {
                    v.x += v.speed;
                    // Wrap around
                    if (v.speed > 0 && v.x > 1500) v.x = -1500;
                    if (v.speed < 0 && v.x < -1500) v.x = 1500;
                });
                this.logs.forEach(l => {
                    l.x += l.speed;
                    if (l.speed > 0 && l.x > 1500) l.x = -1500;
                    if (l.speed < 0 && l.x < -1500) l.x = 1500;
                });
            }

            draw() {
                const zRel = this.z - camera.z;
                if (zRel < -CONFIG.fov || zRel > CONFIG.drawDistance * CONFIG.blockSize) return;

                // Draw the strip
                // We draw a trapezoid for the lane
                const pStart = project(-1500, 0, this.z);
                const pEnd = project(1500, 0, this.z);
                const pStartNext = project(-1500, 0, this.z + CONFIG.blockSize);
                const pEndNext = project(1500, 0, this.z + CONFIG.blockSize);

                ctx.beginPath();
                ctx.moveTo(pStart.x, pStart.y);
                ctx.lineTo(pEnd.x, pEnd.y);
                ctx.lineTo(pEndNext.x, pEndNext.y);
                ctx.lineTo(pStartNext.x, pStartNext.y);
                ctx.closePath();

                // Fill Base
                if (this.type === 'grass') {
                    const isAlt = Math.floor(this.z / CONFIG.blockSize) % 2 === 0;
                    ctx.fillStyle = isAlt ? CONFIG.colors.grassLight : CONFIG.colors.grassDark;
                    ctx.fill();
                    
                    // Add subtle noise/texture lines
                    ctx.save();
                    ctx.clip();
                    ctx.fillStyle = CONFIG.colors.grassNoise;
                    // Draw some random noise rects
                    const scale = pStart.scale;
                    for(let i=0; i<10; i++) {
                        const nx = (Math.sin(this.z + i) * 1000);
                        const ny = (Math.cos(this.z + i) * 50);
                        const np = project(nx, 0, this.z);
                        ctx.fillRect(np.x, np.y, 20 * scale, 20 * scale);
                    }
                    ctx.restore();

                } else if (this.type === 'road') {
                    ctx.fillStyle = CONFIG.colors.roadBase;
                    ctx.fill();
                    
                    // Road markings (center line)
                    ctx.beginPath();
                    const lineStart = project(-1500, 1, this.z); // Slightly above ground
                    const lineEnd = project(1500, 1, this.z);
                    const lineStartNext = project(-1500, 1, this.z + CONFIG.blockSize);
                    const lineEndNext = project(1500, 1, this.z + CONFIG.blockSize);
                    
                    ctx.moveTo(lineStart.x, lineStart.y);
                    ctx.lineTo(lineEnd.x, lineEnd.y);
                    ctx.lineTo(lineEndNext.x, lineEndNext.y);
                    ctx.lineTo(lineStartNext.x, lineStartNext.y);
                    ctx.fillStyle = 'rgba(255,255,255,0.1)';
                    ctx.fill();

                } else {
                    // Water
                    ctx.fillStyle = CONFIG.colors.waterBase;
                    ctx.fill();
                    // Water highlight
                    ctx.fillStyle = CONFIG.colors.waterDeep;
                    ctx.globalAlpha = 0.3;
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
            }
        }

        // --- Drawing Helpers ---

        // Draw a 3D Cube
        function drawCube(x, y, z, w, h, d, color, shadow = true) {
            const p = project(x, y, z);
            const s = p.scale;
            
            // Dimensions in screen space
            const hw = w * s / 2;
            const hh = h * s;
            const hd = d * s / 2; // Depth offset

            if (shadow) {
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.ellipse(p.x + 5*s, p.y + 5*s, hw + 2*s, hd/1.5, 0, 0, Math.PI*2);
                ctx.fill();
            }

            // 1. Front Face (Darkest)
            ctx.fillStyle = color;
            ctx.fillRect(p.x - hw, p.y - hh, hw*2, hh);

            // 2. Right Face (Darker) - Visible if looking from left/front
            ctx.fillStyle = adjustColor(color, -20);
            ctx.beginPath();
            ctx.moveTo(p.x + hw, p.y - hh);
            ctx.lineTo(p.x + hw + hd, p.y - hh - hd);
            ctx.lineTo(p.x + hw + hd, p.y - hd);
            ctx.lineTo(p.x + hw, p.y);
            ctx.fill();

            // 3. Top Face (Lightest)
            ctx.fillStyle = adjustColor(color, 40);
            ctx.beginPath();
            ctx.moveTo(p.x - hw, p.y - hh);
            ctx.lineTo(p.x - hw + hd, p.y - hh - hd);
            ctx.lineTo(p.x + hw + hd, p.y - hh - hd);
            ctx.lineTo(p.x + hw, p.y - hh);
            ctx.fill();
            
            // Outline for crispness
            ctx.strokeStyle = adjustColor(color, -10);
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        // Draw a Cone (Tree)
        function drawCone(x, y, z, w, h, color) {
            const p = project(x, y, z);
            const s = p.scale;
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(p.x, p.y, w*s/2, w*s/4, 0, 0, Math.PI*2);
            ctx.fill();

            // Cone Base (Trunk)
            const trunkH = h * 0.2;
            ctx.fillStyle = CONFIG.colors.woodDark;
            ctx.fillRect(p.x - (w*s/6), p.y - trunkH*s, w*s/3, trunkH*s);

            // Cone Leaves
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - h*s); // Top
            ctx.lineTo(p.x + w*s/2, p.y - trunkH*s); // Right
            ctx.lineTo(p.x - w*s/2, p.y - trunkH*s); // Left
            ctx.fill();

            // Detail line on cone
            ctx.strokeStyle = adjustColor(color, -20);
            ctx.lineWidth = 2 * s;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - h*s);
            ctx.lineTo(p.x, p.y - trunkH*s);
            ctx.stroke();
        }

        function adjustColor(hex, percent) {
            let r = parseInt(hex.substring(1,3), 16);
            let g = parseInt(hex.substring(3,5), 16);
            let b = parseInt(hex.substring(5,7), 16);
            r = Math.min(255, Math.max(0, r + percent));
            g = Math.min(255, Math.max(0, g + percent));
            b = Math.min(255, Math.max(0, b + percent));
            return `rgb(${r},${g},${b})`;
        }

        // --- The Game Object ---

        const game = {
            init: () => {
                // Initial Lanes
                for(let i=0; i<CONFIG.drawDistance; i++) {
                    lanes.push(new Lane(i));
                }
                
                // Inputs
                window.addEventListener('keydown', (e) => {
                    if(e.key === 'ArrowUp') game.movePlayer(0, -1);
                    if(e.key === 'ArrowDown') game.movePlayer(0, 1);
                    if(e.key === 'ArrowLeft') game.movePlayer(-1, 0);
                    if(e.key === 'ArrowRight') game.movePlayer(1, 0);
                });

                const bindBtn = (id, dx, dy) => {
                    const btn = document.getElementById(id);
                    const trigger = (e) => {
                        e.preventDefault();
                        btn.classList.add('pressed');
                        game.movePlayer(dx, dy);
                        setTimeout(() => btn.classList.remove('pressed'), 150);
                    };
                    btn.addEventListener('mousedown', trigger);
                    btn.addEventListener('touchstart', trigger);
                };
                bindBtn('btn-up', 0, -1);
                bindBtn('btn-down', 0, 1);
                bindBtn('btn-left', -1, 0);
                bindBtn('btn-right', 1, 0);

                requestAnimationFrame(game.loop);
            },

            movePlayer: (dx, dy) => {
                const currentLaneIdx = Math.round(player.z / CONFIG.blockSize);
                
                // Forward
                if (dy === -1) {
                    player.z += CONFIG.blockSize;
                    player.squish = 0.6;
                    score++;
                    document.getElementById('score').innerText = score;
                    camera.z += CONFIG.blockSize;
                    
                    lanes.push(new Lane(lanes.length));
                    lanes.shift();
                } 
                // Back
                else if (dy === 1) {
                    if(player.z > 0) {
                        player.z -= CONFIG.blockSize;
                        camera.z -= CONFIG.blockSize;
                    }
                }
                // Side
                else if (dx !== 0) {
                    const gridSize = 60; // Tighter grid for movement
                    let currentSlot = Math.round(player.x / gridSize);
                    player.x = (currentSlot + dx) * gridSize;
                    
                    player.targetRot = dx * 0.5;
                    player.squish = 0.8;
                }
            },

            update: () => {
                time += 16;
                
                // Animation Physics
                player.squish = lerp(player.squish, 1, 0.15);
                player.rot = lerp(player.rot, player.targetRot, 0.15);
                player.targetRot = lerp(player.targetRot, 0, 0.05);

                lanes.forEach(lane => lane.update());

                // Collision Logic
                const currentLane = lanes.find(l => Math.abs(l.z - player.z) < 10);
                
                if (currentLane) {
                    if (currentLane.type === 'water') {
                        let onLog = false;
                        currentLane.logs.forEach(log => {
                            // Simple AABB check
                            if (player.x > log.x - log.length/2 + 10 && player.x < log.x + log.length/2 - 10) {
                                onLog = true;
                                player.x += log.speed; // Move with log
                            }
                        });
                        if (!onLog) {
                            // Death logic (simplified: squish)
                            player.squish = 0.1; 
                        }
                    }
                    
                    if (currentLane.type === 'road') {
                        currentLane.vehicles.forEach(v => {
                            // Car collision
                            if (Math.abs(player.x - v.x) < v.width/2 + 15 && Math.abs(player.z - currentLane.z) < 10) {
                                player.squish = 0.1;
                            }
                        });
                    }
                }
            },

            draw: () => {
                // 1. Sky Gradient
                const grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, CONFIG.colors.skyTop);
                grad.addColorStop(1, CONFIG.colors.skyBot);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                // 2. Draw Queue (Painter's Algorithm)
                let drawables = [];

                lanes.forEach(l => {
                    drawables.push({ type: 'lane', obj: l, z: l.z });
                    
                    l.decorations.forEach(d => {
                        drawables.push({ type: 'deco', obj: d, z: l.z });
                    });
                    
                    // Logs are on water, drawn before player usually
                    l.logs.forEach(lg => {
                        drawables.push({ type: 'log', obj: lg, z: l.z });
                    });

                    l.vehicles.forEach(v => {
                        drawables.push({ type: 'vehicle', obj: v, z: l.z });
                    });
                });

                drawables.push({ type: 'player', z: player.z });

                // Sort by Z depth
                drawables.sort((a, b) => a.z - b.z);

                // 3. Render Loop
                drawables.forEach(item => {
                    if (item.type === 'lane') item.obj.draw();
                    
                    if (item.type === 'deco') {
                        const d = item.obj;
                        if (d.type === 'tree') {
                            // Tree Trunk
                            drawCube(d.x, 0, item.z, 10*d.scale, 20*d.scale, 10*d.scale, CONFIG.colors.woodDark);
                            // Tree Top (Cone)
                            drawCone(d.x, 20*d.scale, item.z, 40*d.scale, 50*d.scale, CONFIG.colors.grassDark);
                        } else {
                            // Bush (Cube)
                            drawCube(d.x, 0, item.z, 30*d.scale, 25*d.scale, 30*d.scale, '#8BC34A');
                        }
                    }

                    if (item.type === 'vehicle') {
                        const v = item.obj;
                        // Car Body
                        drawCube(v.x, 0, item.z, v.width, v.height, v.depth, v.color);
                        
                        // Car details (Windshield)
                        const vp = project(v.x, v.height, item.z);
                        const vs = vp.scale;
                        ctx.fillStyle = '#333';
                        ctx.fillRect(vp.x - (v.width*vs/2) + 5*vs, vp.y - 5*vs, v.width*vs - 10*vs, 5*vs);
                    }

                    if (item.type === 'log') {
                        const l = item.obj;
                        drawCube(l.x, 0, item.z, l.length, 20, l.width, CONFIG.colors.wood, true);
                    }

                    if (item.type === 'player') {
                        const p = project(player.x, 0, player.z);
                        const s = p.scale * player.scale; // Apply scale up
                        
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(player.rot);

                        // Squish effect
                        const scaleY = player.squish;
                        const scaleX = 1 + (1 - player.squish) * 0.3;
                        ctx.scale(scaleX, scaleY);

                        // Legs
                        ctx.fillStyle = '#F39C12';
                        ctx.fillRect(-10*s, -15*s, 6*s, 15*s);
                        ctx.fillRect(4*s, -15*s, 6*s, 15*s);

                        // Body (White Cube)
                        drawCube(0, -15*s, 0, 30*s, 30*s, 30*s, CONFIG.colors.playerBody);
                        
                        // Comb (Red)
                        ctx.fillStyle = CONFIG.colors.playerComb;
                        ctx.fillRect(-5*s, -48*s, 10*s, 8*s);

                        // Beak (Yellow)
                        ctx.fillStyle = CONFIG.colors.playerBeak;
                        ctx.beginPath();
                        ctx.moveTo(12*s, -38*s);
                        ctx.lineTo(24*s, -34*s);
                        ctx.lineTo(12*s, -28*s);
                        ctx.fill();

                        // Eye (Black)
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(8*s, -40*s, 2.5*s, 0, Math.PI*2);
                        ctx.fill();

                        ctx.restore();
                    }
                });
            },

            loop: () => {
                game.update();
                game.draw();
                requestAnimationFrame(game.loop);
            }
        };

        // Start
        game.init();

    </script>
</body>
</html>
