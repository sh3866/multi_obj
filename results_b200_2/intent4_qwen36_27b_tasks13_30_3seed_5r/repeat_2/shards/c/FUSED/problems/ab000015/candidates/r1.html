<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alpine Rush: Descent</title>
    <style>
        :root {
            --primary: #00f2ff;
            --danger: #ff2a6d;
            --glass: rgba(16, 33, 65, 0.4);
            --glass-border: rgba(255, 255, 255, 0.15);
            --ui-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020617;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--ui-text);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- HUD: TOP --- */
        .hud-top {
            display: flex;
            justify-content: space-between;
            padding: 24px;
            width: 100%;
            align-items: flex-start;
        }

        .hud-panel {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 10px 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 100px;
            position: relative;
            overflow: hidden;
        }

        /* Decorative tech line */
        .hud-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            opacity: 0.7;
        }

        .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.8;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .value-group {
            display: flex;
            align-items: baseline;
        }

        .value {
            font-size: 32px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .unit {
            font-size: 12px;
            font-weight: 600;
            margin-left: 4px;
            opacity: 0.7;
        }

        .speed-val { color: var(--primary); text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }
        .dist-val { color: var(--ui-text); }

        /* --- HUD: PROGRESS --- */
        .progress-track {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            transition: width 0.1s linear;
        }

        /* --- DASHBOARD CONTROLS (Bottom) --- */
        .dashboard {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 20px;
            pointer-events: auto; /* Enable clicks */
        }

        .dash-cluster {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.8) 0%, rgba(15, 23, 42, 0.4) 100%);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255,255,255,0.2);
            border-radius: 24px 24px 0 0;
            padding: 20px 30px;
            display: flex;
            gap: 20px;
            align-items: center;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
        }

        /* Steering Buttons */
        .steer-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.1s ease;
            position: relative;
            overflow: hidden;
        }

        .steer-btn:active, .steer-btn.active {
            background: rgba(0, 242, 255, 0.2);
            border-color: var(--primary);
            transform: scale(0.95);
            box-shadow: 0 0 15px var(--primary);
        }

        .steer-icon {
            width: 24px;
            height: 24px;
            fill: white;
        }

        /* Brake Button */
        .brake-trigger {
            width: 90px;
            height: 50px;
            background: rgba(255, 42, 109, 0.1);
            border: 1px solid rgba(255, 42, 109, 0.5);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--danger);
            text-transform: uppercase;
            transition: all 0.1s;
            margin-left: 20px;
        }

        .brake-trigger:active, .brake-trigger.active {
            background: var(--danger);
            color: white;
            box-shadow: 0 0 20px var(--danger);
        }

        /* Grain Overlay */
        .noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            z-index: 10;
        }

        /* Speed Lines Container */
        #speed-lines-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            mix-blend-mode: screen;
        }

    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <canvas id="speed-lines-canvas"></canvas>
    <div class="noise"></div>

    <div class="ui-layer">
        <!-- HUD -->
        <div class="hud-top">
            <div class="hud-panel">
                <span class="label">Speed</span>
                <div class="value-group">
                    <span class="value speed-val" id="speedDisplay">0</span>
                    <span class="unit">KM/H</span>
                </div>
            </div>

            <div class="hud-panel">
                <span class="label">Distance</span>
                <div class="value-group">
                    <span class="value dist-val" id="distDisplay">0.0</span>
                    <span class="unit">KM</span>
                </div>
            </div>
        </div>

        <div class="progress-track">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <!-- DASHBOARD CONTROLS -->
        <div class="dashboard">
            <div class="dash-cluster">
                <div class="steer-btn" id="btnLeft">
                    <svg class="steer-icon" viewBox="0 0 24 24">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                    </svg>
                </div>
                <div class="steer-btn" id="btnRight">
                    <svg class="steer-icon" viewBox="0 0 24 24">
                        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                    </svg>
                </div>
                <div class="brake-trigger" id="btnBrake">Brake</div>
            </div>
        </div>
    </div>
</div>

<script>
    /**
     * ALPINE RUSH ENGINE v2
     * Enhanced Visuals: Parallax, Particle FX, Glowing Track
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const speedCanvas = document.getElementById('speed-lines-canvas');
    const sCtx = speedCanvas.getContext('2d');

    // UI Elements
    const speedDisplay = document.getElementById('speedDisplay');
    const distDisplay = document.getElementById('distDisplay');
    const progressBar = document.getElementById('progressBar');
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnBrake = document.getElementById('btnBrake');

    // State
    let width, height;
    let cx, cy;
    let frame = 0;
    
    // Game Physics
    const state = {
        speed: 0,
        targetSpeed: 110,
        distance: 0,
        playerX: 0, // -1 to 1
        playerTilt: 0,
        isBraking: false,
        roadWidth: 2200,
        segmentLength: 150,
        cameraHeight: 800,
        fov: 80,
        drawDistance: 300
    };

    // Input
    const input = { left: false, right: false, brake: false };

    // World Objects
    const world = {
        trees: [],
        obstacles: []
    };

    // --- Initialization ---

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        
        // Handle High DPI
        const dpr = window.devicePixelRatio || 1;
        
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(dpr, dpr);

        speedCanvas.width = width * dpr;
        speedCanvas.height = height * dpr;
        speedCanvas.style.width = width + 'px';
        speedCanvas.style.height = height + 'px';
        sCtx.scale(dpr, dpr);

        cx = width / 2;
        cy = height / 2;
    }

    function init() {
        resize();
        window.addEventListener('resize', resize);
        setupInputs();
        generateWorld();
        
        // Initial speed boost for immediate feeling
        state.speed = 50;
        requestAnimationFrame(loop);
    }

    function generateWorld() {
        // Trees
        for(let i=0; i<80; i++) {
            world.trees.push({
                z: Math.random() * 6000,
                x: (Math.random() * 2 - 1) * 5000, // Wide spread
                type: Math.random() > 0.8 ? 'bush' : 'pine',
                scale: Math.random() * 0.5 + 0.8
            });
        }
        // Obstacles
        for(let i=0; i<30; i++) {
            world.obstacles.push({
                z: 1000 + i * 600 + Math.random() * 300,
                x: (Math.random() * 2 - 1) * 1200,
                type: Math.random() > 0.4 ? 'gate' : 'rock'
            });
        }
    }

    function setupInputs() {
        const setKey = (k, v) => {
            if(k === 'ArrowLeft') input.left = v;
            if(k === 'ArrowRight') input.right = v;
            if(k === 'ArrowDown' || k === ' ') input.brake = v;
        };

        document.addEventListener('keydown', e => setKey(e.key, true));
        document.addEventListener('keyup', e => setKey(e.key, false));

        const bindTouch = (el, key) => {
            const start = (e) => { e.preventDefault(); input[key] = true; el.classList.add('active'); };
            const end = (e) => { e.preventDefault(); input[key] = false; el.classList.remove('active'); };
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
            el.addEventListener('touchstart', start);
            el.addEventListener('touchend', end);
        };

        bindTouch(btnLeft, 'left');
        bindTouch(btnRight, 'right');
        bindTouch(btnBrake, 'brake');
    }

    // --- Rendering ---

    function project(x, y, z) {
        const scale = state.fov / (state.fov + z);
        const x2d = (x * scale) + cx;
        // Horizon is roughly at cy + 50
        const y2d = ((y - state.cameraHeight) * scale) + cy + 50; 
        return { x: x2d, y: y2d, scale: scale };
    }

    function drawSky() {
        // Deep Alpine Gradient
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, '#0f172a'); // Midnight
        grad.addColorStop(0.3, '#3b82f6'); // Blue
        grad.addColorStop(0.6, '#bae6fd'); // Sky
        grad.addColorStop(1, '#f0f9ff'); // Snow haze
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // Sun/Glow
        const sunGrad = ctx.createRadialGradient(cx, height * 0.4, 20, cx, height * 0.4, 600);
        sunGrad.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
        sunGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.1)');
        sunGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = sunGrad;
        ctx.fillRect(0, 0, width, height);
    }

    function drawMountains() {
        // Parallax mountains
        const offset = (frame * state.speed * 0.05) % 2000;
        
        ctx.save();
        ctx.beginPath();
        // Far Layer
        ctx.moveTo(0, cy + 100);
        for(let i = -200; i < width + 200; i += 30) {
            // Procedural jagged peaks
            const h = Math.sin((i + offset * 0.2) * 0.003) * 100 + 
                      Math.cos((i + offset * 0.2) * 0.01) * 40;
            ctx.lineTo(i, (cy + 100) - h);
        }
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.fillStyle = '#1e293b'; // Dark silhouette
        ctx.fill();

        // Near Layer (Snowy)
        ctx.beginPath();
        ctx.moveTo(0, cy + 120);
        for(let i = -200; i < width + 200; i += 40) {
            const h = Math.sin((i + offset * 0.5) * 0.005) * 80 + 
                      Math.cos((i + offset * 0.5) * 0.02) * 30;
            ctx.lineTo(i, (cy + 120) - h);
        }
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.fillStyle = '#cbd5e1'; // Snow
        ctx.fill();
        
        ctx.restore();
    }

    function drawSnowField() {
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(0, cy + 100, width, height - (cy + 100));
    }

    function drawTrack() {
        const trackLeft = -state.roadWidth / 2;
        const trackRight = state.roadWidth / 2;
        const horizonY = cy + 100;

        // Clip area for the track
        ctx.save();
        ctx.beginPath();
        const p1 = project(trackLeft, 0, 10);
        const p2 = project(trackRight, 0, 10);
        const p3 = project(trackRight, 0, 4000);
        const p4 = project(trackLeft, 0, 4000);
        
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.lineTo(p4.x, p4.y);
        ctx.closePath();
        ctx.clip();

        // Draw Texture (Horizontal lines moving)
        const speedOffset = (frame * state.speed * 1.5) % state.segmentLength;
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.15)'; // Faint texture
        ctx.lineWidth = 2;

        for (let z = 4000; z > 0; z -= state.segmentLength) {
            const drawZ = z - speedOffset;
            if (drawZ < 10) continue;
            
            const pL = project(trackLeft, 0, drawZ);
            const pR = project(trackRight, 0, drawZ);
            
            ctx.beginPath();
            ctx.moveTo(pL.x, pL.y);
            ctx.lineTo(pR.x, pR.y);
            ctx.stroke();
        }
        ctx.restore();

        // Draw Glowing Borders
        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00f2ff';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;

        // Left Line
        ctx.beginPath();
        for(let z=0; z<4000; z+=50) {
            const p = project(trackLeft, 0, z);
            if(z===0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();

        // Right Line
        ctx.beginPath();
        for(let z=0; z<4000; z+=50) {
            const p = project(trackRight, 0, z);
            if(z===0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        ctx.restore();
    }

    function drawTree(tree) {
        // Calculate relative Z based on movement
        let z = tree.z - (frame * state.speed * 2.5);
        if (z < 10) z += 6000; // Loop

        // Parallax X
        const relX = tree.x - (state.playerX * 2000);
        const p = project(relX, 0, z);

        if (p.scale <= 0) return;

        const size = 300 * p.scale * tree.scale;

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, size/2, size/6, 0, 0, Math.PI*2);
        ctx.fill();

        // Tree Body (Pine)
        ctx.fillStyle = '#0f172a'; // Dark Slate
        ctx.beginPath();
        ctx.moveTo(p.x, p.y - size);
        ctx.lineTo(p.x - size/2, p.y);
        ctx.lineTo(p.x + size/2, p.y);
        ctx.fill();
        
        // Snow on top (simple triangle)
        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.moveTo(p.x, p.y - size);
        ctx.lineTo(p.x - size/6, p.y - size * 0.6);
        ctx.lineTo(p.x + size/6, p.y - size * 0.6);
        ctx.fill();
    }

    function drawObstacle(obs) {
        let z = obs.z - (frame * state.speed * 2.5);
        if (z < 10) z += 6000;
        
        const relX = obs.x - (state.playerX * state.roadWidth);
        const p = project(relX, 0, z);
        
        if (p.scale <= 0) return;

        const size = 200 * p.scale;

        if (obs.type === 'gate') {
            // Blue Arch Gate
            ctx.strokeStyle = '#00f2ff';
            ctx.lineWidth = 6 * p.scale;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00f2ff';
            
            ctx.beginPath();
            ctx.arc(p.x, p.y - size, size, Math.PI, 0);
            ctx.stroke();
            
            // Banner
            ctx.fillStyle = 'rgba(0, 242, 255, 0.3)';
            ctx.fillRect(p.x - size, p.y - size, size * 2, size * 0.5);
            
        } else {
            // Jagged Rock
            ctx.fillStyle = '#334155';
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.moveTo(p.x - size/2, p.y);
            ctx.lineTo(p.x - size/3, p.y - size/2);
            ctx.lineTo(p.x + size/4, p.y - size/1.5);
            ctx.lineTo(p.x + size/2, p.y);
            ctx.fill();
        }
        ctx.shadowBlur = 0;
    }

    function drawPlayer() {
        // Player is fixed at bottom center, but tilts
        const p = project(0, 0, 10); // Just in front of camera
        
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(state.playerTilt * 0.8);

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 50, 15, 0, 0, Math.PI*2);
        ctx.fill();

        // Skier Silhouette
        // Helmet
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, -70, 15, 0, Math.PI*2);
        ctx.fill();
        
        // Body
        ctx.fillStyle = '#ff2a6d'; // Danger Red/Pink
        ctx.beginPath();
        ctx.moveTo(-15, -70);
        ctx.lineTo(15, -70);
        ctx.lineTo(20, -40);
        ctx.lineTo(-20, -40);
        ctx.fill();

        // Skis (Glowing)
        ctx.strokeStyle = '#00f2ff';
        ctx.lineWidth = 5;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00f2ff';
        ctx.lineCap = 'round';
        
        ctx.beginPath();
        ctx.moveTo(-20, -40);
        ctx.lineTo(-40, 10); // Left ski
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(20, -40);
        ctx.lineTo(40, 10); // Right ski
        ctx.stroke();

        ctx.restore();
    }

    // Speed Lines Overlay (Separate Canvas)
    function drawSpeedLines() {
        sCtx.clearRect(0, 0, width, height);
        
        if(state.speed < 60) return;

        const intensity = (state.speed - 60) / 80; // 0 to 1
        const count = Math.floor(intensity * 30);
        
        sCtx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        sCtx.lineWidth = 2;

        for(let i=0; i<count; i++) {
            const x = Math.random() * width;
            const y = Math.random() * height;
            const len = 50 + Math.random() * 100;
            
            sCtx.beginPath();
            sCtx.moveTo(x, y);
            // Lines radiate from center slightly or just go down
            sCtx.lineTo(x + (Math.random()-0.5)*10, y + len);
            sCtx.stroke();
        }
    }

    // --- Main Loop ---

    function update() {
        // Physics
        if (input.brake) {
            state.targetSpeed = Math.max(20, state.targetSpeed - 3);
            state.isBraking = true;
        } else {
            state.targetSpeed = Math.min(160, state.targetSpeed + 0.5);
            state.isBraking = false;
        }
        
        state.speed += (state.targetSpeed - state.speed) * 0.1;

        // Steering
        if (input.left) {
            state.playerX = Math.max(-1, state.playerX - 0.04);
            state.playerTilt = Math.max(-1, state.playerTilt - 0.08);
        } else if (input.right) {
            state.playerX = Math.min(1, state.playerX + 0.04);
            state.playerTilt = Math.min(1, state.playerTilt + 0.08);
        } else {
            state.playerTilt += (0 - state.playerTilt) * 0.1;
        }

        // Stats
        state.distance += state.speed * 0.0005;
        
        // UI Updates
        speedDisplay.innerText = Math.floor(state.speed);
        distDisplay.innerText = state.distance.toFixed(2);
        progressBar.style.width = Math.min(100, state.distance * 2) + '%';

        // Speed Pulse Effect on UI
        if(state.speed > 130) {
            const pulse = 1 + Math.sin(frame * 0.5) * 0.02;
            speedDisplay.style.transform = `scale(${pulse})`;
            speedDisplay.style.textShadow = `0 0 ${Math.random()*20}px var(--primary)`;
        } else {
            speedDisplay.style.transform = 'scale(1)';
            speedDisplay.style.textShadow = 'none';
        }

        frame++;
    }

    function loop() {
        ctx.clearRect(0, 0, width, height);

        update();

        // 1. Background
        drawSky();
        drawMountains();
        drawSnowField();

        // 2. Track
        drawTrack();

        // 3. World Objects (Painter's Algo)
        // Sort by Z descending (draw far to near)
        // We generate Z dynamically in draw functions, so we just iterate.
        // Since trees/obstacles are generated with random Z, we should ideally sort them once.
        // But for this simple loop, we just draw them. To fix z-fighting, we'd need a render list.
        // Simplified: Draw trees first, then obstacles (mostly).
        
        world.trees.forEach(drawTree);
        world.obstacles.forEach(drawObstacle);

        // 4. Player
        drawPlayer();

        // 5. Speed FX
        drawSpeedLines();

        // 6. Vignette
        const grad = ctx.createRadialGradient(cx, cy, height/3, cx, cy, height);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.5)');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,width,height);

        requestAnimationFrame(loop);
    }

    init();
</script>
