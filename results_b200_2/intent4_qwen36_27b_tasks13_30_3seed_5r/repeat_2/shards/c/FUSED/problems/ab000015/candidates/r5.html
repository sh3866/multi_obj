<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alpine Rush: High Velocity</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-orange: #ff9d00;
            --neon-red: #ff2a2a;
            --glass-bg: rgba(10, 20, 40, 0.6);
            --glass-border: rgba(255, 255, 255, 0.3);
            --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050a14;
            font-family: var(--font-ui);
            color: white;
        }

        /* --- LAYOUT & LAYERS --- */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* FX Layer for particles/speed lines */
        #fx-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            mix-blend-mode: screen;
        }

        /* Vignette - Subtle to focus center */
        .overlay-fx {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            background: radial-gradient(circle at center, transparent 60%, rgba(0,10,30,0.8) 100%);
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        /* --- TOP HUD --- */
        .hud-top {
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* Progress Bar - Compact & Sleek */
        .progress-container {
            width: 100%;
            max-width: 500px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffffff, var(--neon-cyan));
            width: 100%;
            box-shadow: 0 0 10px var(--neon-cyan);
            transform-origin: left;
            border-radius: 2px;
        }

        /* Stats Row */
        .stats-row {
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: space-between;
            pointer-events: none;
        }

        .stat-box {
            background: linear-gradient(135deg, rgba(10, 20, 40, 0.8), rgba(10, 20, 40, 0.4));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-left: 4px solid var(--neon-cyan);
            padding: 12px 24px;
            border-radius: 8px;
            transform: skewX(-15deg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            min-width: 140px;
            position: relative;
            overflow: hidden;
        }

        /* Frosty Edge Highlight */
        .stat-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
        }

        .stat-box.speed-box { border-left-color: var(--neon-orange); }

        .stat-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.7);
            display: block;
            margin-bottom: 4px;
            transform: skewX(15deg);
        }

        .stat-value {
            font-size: 38px;
            font-weight: 800;
            font-family: var(--font-mono);
            color: white;
            display: block;
            transform: skewX(15deg);
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
            line-height: 1;
        }

        .stat-unit {
            font-size: 14px;
            color: var(--neon-cyan);
            margin-left: 8px;
            font-weight: 600;
            opacity: 0.9;
        }

        /* --- CONTROLS --- */
        .controls-area {
            padding: 0 30px 40px 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            pointer-events: none; 
            margin-bottom: 20px;
        }

        /* D-Pad - Minimalist & Glassy */
        .d-pad {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .ctrl-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            color: rgba(255,255,255,0.9);
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .ctrl-btn svg { width: 28px; height: 28px; fill: currentColor; }

        .ctrl-btn:active, .ctrl-btn.active {
            background: rgba(0, 243, 255, 0.2);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            transform: scale(0.95);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        /* Brake / Action - Refined */
        .action-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.1);
            /* Icy Blue Theme */
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.1); 
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 1px;
            /* Red Icon Color */
            color: var(--neon-red);
            text-transform: uppercase;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: auto;
            text-shadow: 0 0 5px rgba(255, 42, 42, 0.5);
            backdrop-filter: blur(4px);
        }

        .action-btn svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        .action-btn:active, .action-btn.active {
            background: rgba(255, 42, 42, 0.2);
            border-color: var(--neon-red);
            color: #ff5555;
            transform: scale(0.95);
            box-shadow: 0 0 25px rgba(255, 42, 42, 0.3);
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-0.5deg); }
            20% { transform: translate(-2px, 0px) rotate(0.5deg); }
            30% { transform: translate(2px, 1px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(0.5deg); }
            50% { transform: translate(-1px, 2px) rotate(-0.5deg); }
            60% { transform: translate(-2px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-0.5deg); }
            80% { transform: translate(-1px, -1px) rotate(0.5deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(0deg); }
        }

        .shake-effect {
            animation: shake 0.15s infinite;
        }

    </style>
</head>
<body>

<div id="game-container">
    <!-- Main Render -->
    <canvas id="gameCanvas"></canvas>
    <!-- FX Layer -->
    <canvas id="fx-canvas"></canvas>
    <!-- Overlays -->
    <div class="overlay-fx"></div>

    <!-- UI -->
    <div class="ui-layer">
        
        <div class="hud-top">
            <!-- Progress Bar -->
            <div class="progress-container">
                <div class="progress-fill" id="progressBar"></div>
            </div>

            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-box">
                    <span class="stat-label">Distance</span>
                    <span class="stat-value"><span id="distDisplay">0.00</span><span class="stat-unit">KM</span></span>
                </div>
                <div class="stat-box speed-box">
                    <span class="stat-label">Velocity</span>
                    <span class="stat-value"><span id="speedDisplay">0</span><span class="stat-unit">KM/H</span></span>
                </div>
            </div>
        </div>

        <div class="controls-area">
            <div class="d-pad">
                <div class="ctrl-btn" id="btnLeft">
                    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                </div>
                <div class="ctrl-btn" id="btnRight">
                    <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </div>
            </div>

            <div class="action-btn" id="btnBrake">
                <!-- Using Icon for cleaner look -->
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11H7v-2h10v2z"/></svg>
            </div>
        </div>
    </div>
</div>

<script>
    /**
     * ALPINE RUSH ENGINE v6 - VISUAL REDESIGN
     * 
     * Key Design Changes:
     * 1. Rider: Significantly scaled up, white high-contrast silhouette with cyan accents.
     * 2. Path: Solid glowing cyan lane markers replacing faint dashed lines.
     * 3. Perspective: Lowered foreground elements, mountains pushed back/faded.
     * 4. Atmosphere: Icy blue/white palette, heavy snow particle systems.
     * 5. Speed: Radial speed lines from center, screen shake at high velocity.
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');

    // UI Elements
    const speedDisplay = document.getElementById('speedDisplay');
    const distDisplay = document.getElementById('distDisplay');
    const progressBar = document.getElementById('progressBar');
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnBrake = document.getElementById('btnBrake');
    const gameContainer = document.getElementById('game-container');

    // Config
    let width, height, dpr;
    let cx, cy;
    let frame = 0;

    // Game State
    const state = {
        speed: 0,
        targetSpeed: 160,
        distance: 0,
        playerX: 0, 
        playerTilt: 0,
        isBraking: false,
        roadWidth: 2000,
        cameraHeight: 400, // Lowered camera for immersion
        fov: 80,
        segmentLength: 200,
    };

    // Input
    const input = { left: false, right: false, brake: false };

    // World Generation
    const world = {
        obstacles: [],
        trees: [],
        particles: []
    };

    // --- Init & Resize ---

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(dpr, dpr);

        fxCanvas.width = width * dpr;
        fxCanvas.height = height * dpr;
        fxCanvas.style.width = width + 'px';
        fxCanvas.style.height = height + 'px';
        fxCtx.scale(dpr, dpr);

        cx = width / 2;
        cy = height / 2;
    }

    function init() {
        resize();
        window.addEventListener('resize', resize);
        setupInputs();
        generateWorld();
        state.speed = 120;
        requestAnimationFrame(loop);
    }

    function generateWorld() {
        // Generate Trees - pushed further out for better perspective
        for(let i=0; i<150; i++) {
            world.trees.push({
                z: Math.random() * 10000,
                x: (Math.random() * 2 - 1) * 10000, 
                scale: Math.random() * 0.8 + 0.5,
                type: 'pine'
            });
        }
        // Generate Rocks
        for(let i=0; i<60; i++) {
            world.trees.push({
                z: Math.random() * 10000,
                x: (Math.random() * 2 - 1) * 10000,
                scale: Math.random() * 0.6 + 0.4,
                type: 'rock'
            });
        }
        // Generate Obstacles
        for(let i=0; i<60; i++) {
            world.obstacles.push({
                z: 2000 + i * 350 + Math.random() * 100,
                x: (Math.random() * 2 - 1) * 1200,
                type: Math.random() > 0.5 ? 'gate' : 'barrier'
            });
        }
    }

    function setupInputs() {
        const setKey = (k, v) => {
            if(k === 'ArrowLeft') input.left = v;
            if(k === 'ArrowRight') input.right = v;
            if(k === 'ArrowDown' || k === ' ') input.brake = v;
        };

        document.addEventListener('keydown', e => setKey(e.key, true));
        document.addEventListener('keyup', e => setKey(e.key, false));

        const bindTouch = (el, key) => {
            const start = (e) => { e.preventDefault(); input[key] = true; el.classList.add('active'); };
            const end = (e) => { e.preventDefault(); input[key] = false; el.classList.remove('active'); };
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
            el.addEventListener('touchstart', start);
            el.addEventListener('touchend', end);
        };

        bindTouch(btnLeft, 'left');
        bindTouch(btnRight, 'right');
        bindTouch(btnBrake, 'brake');
    }

    // --- Math & Projection ---

    function project(x, y, z) {
        // Perspective projection
        const scale = state.fov / (state.fov + z);
        // Center horizontally, position vertically based on camera height
        const x2d = (x * scale) + cx;
        const y2d = ((y - state.cameraHeight) * scale) + cy + 120; // Horizon adjustment
        return { x: x2d, y: y2d, scale: scale };
    }

    // --- Rendering Helpers ---

    function drawSky() {
        // CRITIQUE FIX: Crisp, cold alpine gradient
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, '#0f2027'); // Dark Blue top
        grad.addColorStop(0.5, '#203a43'); // Mid Blue
        grad.addColorStop(1, '#2c5364'); // Horizon Blue
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);
    }

    function drawMountains() {
        const offset = (frame * state.speed * 0.05) % width;
        
        ctx.save();
        
        // Far layer - Faded blue
        ctx.beginPath();
        ctx.moveTo(0, height);
        for(let i = -200; i < width + 200; i += 40) {
            // Smoother mountains
            const h = Math.sin((i + offset * 0.1) * 0.003) * 200 + 
                      Math.cos((i + offset * 0.1) * 0.008) * 100;
            ctx.lineTo(i, cy - 100 - h);
        }
        ctx.lineTo(width, height);
        ctx.fillStyle = '#1a2a6c';
        ctx.fill();
        
        // Snow caps - distinct white triangles on peaks
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.beginPath();
        for(let i = -200; i < width + 200; i += 40) {
             const h = Math.sin((i + offset * 0.1) * 0.003) * 200 + 
                       Math.cos((i + offset * 0.1) * 0.008) * 100;
             if(h > 120) {
                 ctx.moveTo(i, cy - 100 - h);
                 ctx.lineTo(i - 15, cy - 100 - h + 40);
                 ctx.lineTo(i + 15, cy - 100 - h + 40);
             }
        }
        ctx.fill();

        // Mid layer - Darker, closer
        ctx.beginPath();
        ctx.moveTo(0, height);
        for(let i = -200; i < width + 200; i += 30) {
            const h = Math.sin((i + offset * 0.5) * 0.008) * 150 + 
                      Math.cos((i + offset * 0.5) * 0.015) * 80;
            ctx.lineTo(i, cy + 20 - h);
        }
        ctx.lineTo(width, height);
        ctx.fillStyle = '#0f172a';
        ctx.fill();
        
        ctx.restore();
    }

    function drawTrack() {
        // CRITIQUE FIX: Textured Snowy Slope & Solid Lane Markers
        const tl = -state.roadWidth / 2;
        const tr = state.roadWidth / 2;
        const drawDist = 8000;

        ctx.save();
        ctx.beginPath();
        const p1 = project(tl, 0, 10);
        const p2 = project(tr, 0, 10);
        const p3 = project(tr, 0, drawDist);
        const p4 = project(tl, 0, drawDist);
        
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.lineTo(p4.x, p4.y);
        ctx.closePath();
        ctx.clip();

        // Draw Snow Texture (Frost)
        ctx.fillStyle = 'rgba(200, 230, 255, 0.15)';
        const speedOffset = (frame * state.speed * 3) % 100;
        for(let i=0; i<width*3; i+=15) {
            // Create "scratches" in the snow
            let y = (Math.random() * height) + speedOffset;
            if (y > height) y -= height;
            ctx.fillRect(i, y, 2, 10 + Math.random() * 20);
        }

        // Draw Route Lines - SOLID GLOWING TRACK
        // CRITIQUE FIX: No dashed lines, solid glowing edges
        
        // Glow
        ctx.shadowBlur = 20;
        ctx.shadowColor = 'var(--neon-cyan)';
        ctx.lineWidth = 6;
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.8)';

        // Left Edge
        ctx.beginPath();
        for(let z=10; z<drawDist; z+=50) {
            const p = project(tl, 0, z);
            if(z===10) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();

        // Right Edge
        ctx.beginPath();
        for(let z=10; z<drawDist; z+=50) {
            const p = project(tr, 0, z);
            if(z===10) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        
        // Inner Lane Markers (Fainter)
        ctx.shadowBlur = 10;
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        
        // Center line (solid)
        ctx.beginPath();
        for(let z=10; z<drawDist; z+=50) {
            const p = project(0, 0, z);
            if(z===10) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        
        ctx.restore();
    }

    function drawObstacle(obs) {
        let z = obs.z - (frame * state.speed * 3);
        if (z < 10) z += 10000;

        const relX = obs.x - (state.playerX * state.roadWidth);
        const p = project(relX, 0, z);
        
        if (p.scale <= 0) return;

        const size = 350 * p.scale; // Increased size

        ctx.save();
        ctx.translate(p.x, p.y);

        if (obs.type === 'gate') {
            // CRITIQUE FIX: High Contrast Neon Gate
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00f3ff';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 8 * p.scale;
            
            // Arch shape
            ctx.beginPath();
            ctx.moveTo(-size, 0);
            ctx.lineTo(-size, -size * 1.5);
            ctx.quadraticCurveTo(0, -size * 2.2, size, -size * 1.5);
            ctx.lineTo(size, 0);
            ctx.stroke();

            // Inner glow fill
            ctx.fillStyle = 'rgba(0, 243, 255, 0.3)';
            ctx.fill();

        } else {
            // CRITIQUE FIX: High Visual Weight Obstacle (Danger Rock)
            // Bright Orange/Red for danger
            ctx.fillStyle = '#1e293b'; // Dark slate core
            ctx.strokeStyle = '#ff9d00'; // Neon Orange
            ctx.lineWidth = 5 * p.scale;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff9d00';

            ctx.beginPath();
            ctx.moveTo(-size/2, 0);
            ctx.lineTo(-size/3, -size/1.2);
            ctx.lineTo(size/4, -size/1.8);
            ctx.lineTo(size/2, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }
        ctx.restore();
    }

    function drawTree(tree) {
        let z = tree.z - (frame * state.speed * 3);
        if (z < 10) z += 10000;
        
        const relX = tree.x - (state.playerX * 2000);
        const p = project(relX, 0, z);
        if (p.scale <= 0) return;

        const size = 600 * p.scale * tree.scale; // Larger trees

        ctx.save();
        ctx.translate(p.x, p.y);

        if(tree.type === 'pine') {
            // Pine Tree - Dark silhouette
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.moveTo(0, -size);
            ctx.lineTo(-size/2, 0);
            ctx.lineTo(size/2, 0);
            ctx.fill();

            // Snow Cap - Distinct White
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(0, -size);
            ctx.lineTo(-size/4, -size*0.7);
            ctx.lineTo(size/4, -size*0.7);
            ctx.fill();
        } else {
            // Rock
            ctx.fillStyle = '#334155';
            ctx.beginPath();
            ctx.arc(0, -size/4, size/3, 0, Math.PI*2);
            ctx.fill();
            // Snow on top
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.beginPath();
            ctx.arc(0, -size/4, size/4, Math.PI, 0);
            ctx.fill();
        }

        ctx.restore();
    }

    function drawPlayer() {
        // CRITIQUE FIX: Anchor Rider at bottom center, Scaled UP
        const p = project(0, 0, 10); 
        
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(state.playerTilt * 0.8);

        // Shadow - Darkens the snow
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.beginPath();
        ctx.ellipse(0, 10, 90, 20, 0, 0, Math.PI*2);
        ctx.fill();

        // CRITIQUE FIX: High Contrast Silhouette (White/Cyan)
        
        // Skis (Glowing Blue, wide)
        ctx.strokeStyle = '#00f3ff';
        ctx.lineWidth = 14;
        ctx.lineCap = 'round';
        ctx.shadowBlur = 25;
        ctx.shadowColor = '#00f3ff';

        // Left Ski
        ctx.beginPath();
        ctx.moveTo(-40, -50);
        ctx.quadraticCurveTo(-45, 0, -90, 40);
        ctx.stroke();

        // Right Ski
        ctx.beginPath();
        ctx.moveTo(40, -50);
        ctx.quadraticCurveTo(45, 0, 90, 40);
        ctx.stroke();

        // Torso (Distinct Color - Red)
        ctx.fillStyle = '#ff0055';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ff0055';
        ctx.beginPath();
        ctx.moveTo(-30, -100);
        ctx.lineTo(30, -100);
        ctx.lineTo(45, -50);
        ctx.lineTo(-45, -50);
        ctx.fill();

        // CRITIQUE FIX: High Contrast Silhouette (White Body)
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ffffff';
        
        // Helmet
        ctx.beginPath();
        ctx.arc(0, -135, 28, 0, Math.PI*2);
        ctx.fill();
        
        // Visor (Cyan)
        ctx.fillStyle = '#00f3ff';
        ctx.beginPath();
        ctx.arc(0, -135, 28, 0, Math.PI, false); // Half circle
        ctx.fill();

        ctx.restore();
    }

    // --- FX ---

    function drawSpeedLines() {
        fxCtx.clearRect(0, 0, width, height);
        
        if(state.speed < 80) return;

        const intensity = (state.speed - 80) / 120; 
        const count = Math.floor(intensity * 60); 
        
        fxCtx.lineWidth = 2;
        fxCtx.lineCap = 'round';

        for(let i=0; i<count; i++) {
            // CRITIQUE FIX: Radial speed lines emanating from center
            // Polar coordinates
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * Math.min(width, height) * 0.8;
            
            const x = cx + Math.cos(angle) * dist;
            const y = cy + Math.sin(angle) * dist;

            // Length of line based on distance from center
            const len = 50 + (dist / (Math.min(width,height)/2)) * 150 * intensity;
            
            // Direction is away from center
            const dx = Math.cos(angle) * len;
            const dy = Math.sin(angle) * len;

            fxCtx.strokeStyle = `rgba(255, 255, 255, ${Math.random() * 0.5 * intensity})`;
            
            fxCtx.beginPath();
            fxCtx.moveTo(x, y);
            fxCtx.lineTo(x + dx, y + dy);
            fxCtx.stroke();
        }
    }

    function drawSnowSpray() {
        // CRITIQUE FIX: Snow Spray Particles trailing rider
        const p = project(0, 0, 10);
        
        // Add new particles
        if (state.speed > 60) {
            for(let i=0; i<5; i++) {
                world.particles.push({
                    x: p.x + (Math.random() * 60 - 30),
                    y: p.y + (Math.random() * 20 - 10),
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() * 5) + 5,
                    life: 1.0,
                    size: Math.random() * 6 + 2
                });
            }
        }

        // Update and Draw
        for (let i = world.particles.length - 1; i >= 0; i--) {
            let part = world.particles[i];
            part.x += part.vx;
            part.y += part.vy;
            part.life -= 0.04;
            part.size *= 0.96;

            if (part.life <= 0) {
                world.particles.splice(i, 1);
            } else {
                fxCtx.fillStyle = `rgba(255, 255, 255, ${part.life})`;
                fxCtx.beginPath();
                fxCtx.arc(part.x, part.y, part.size, 0, Math.PI * 2);
                fxCtx.fill();
            }
        }
    }

    // --- Main Loop ---

    function update() {
        // Physics
        if (input.brake) {
            state.targetSpeed = Math.max(40, state.targetSpeed - 10);
            state.isBraking = true;
        } else {
            state.targetSpeed = Math.min(220, state.targetSpeed + 1.5);
            state.isBraking = false;
        }
        
        state.speed += (state.targetSpeed - state.speed) * 0.05;

        // Steering
        const steerSpeed = 0.04;
        if (input.left) {
            state.playerX = Math.max(-1, state.playerX - steerSpeed);
            state.playerTilt = Math.max(-0.8, state.playerTilt - 0.05);
        } else if (input.right) {
            state.playerX = Math.min(1, state.playerX + steerSpeed);
            state.playerTilt = Math.min(0.8, state.playerTilt + 0.05);
        } else {
            state.playerTilt += (0 - state.playerTilt) * 0.1;
        }

        // Stats
        state.distance += state.speed * 0.0003;
        
        speedDisplay.innerText = Math.floor(state.speed);
        distDisplay.innerText = state.distance.toFixed(2);
        
        const progress = (state.distance % 5) / 5 * 100;
        progressBar.style.width = progress + '%';

        // Screen Shake at high speed
        if (state.speed > 170) {
            gameContainer.classList.add('shake-effect');
        } else {
            gameContainer.classList.remove('shake-effect');
        }

        // Speed Color Change
        if (state.speed > 190) {
            speedDisplay.style.color = 'var(--neon-red)';
            speedDisplay.style.textShadow = '0 0 20px var(--neon-red)';
        } else if (state.speed > 140) {
            speedDisplay.style.color = 'var(--neon-orange)';
            speedDisplay.style.textShadow = '0 0 15px var(--neon-orange)';
        } else {
            speedDisplay.style.color = 'white';
            speedDisplay.style.textShadow = '0 0 10px rgba(255,255,255,0.5)';
        }

        frame++;
    }

    function loop() {
        ctx.clearRect(0, 0, width, height);

        update();

        // 1. Environment
        drawSky();
        drawMountains();
        drawTrack();

        // 2. World Objects
        const renderList = [];
        
        world.trees.forEach(t => {
            let z = t.z - (frame * state.speed * 3);
            while(z < 10) z += 10000;
            renderList.push({ type: 'tree', obj: t, z: z });
        });

        world.obstacles.forEach(o => {
            let z = o.z - (frame * state.speed * 3);
            while(z < 10) z += 10000;
            renderList.push({ type: 'obs', obj: o, z: z });
        });

        renderList.sort((a, b) => b.z - a.z);

        renderList.forEach(item => {
            if(item.type === 'tree') drawTree(item.obj);
            else drawObstacle(item.obj);
        });

        // 3. Player
        drawPlayer();

        // 4. FX (Speed lines + Snow Spray)
        drawSpeedLines();
        drawSnowSpray();

        requestAnimationFrame(loop);
    }

    init();
</script>
</body>
</html>
