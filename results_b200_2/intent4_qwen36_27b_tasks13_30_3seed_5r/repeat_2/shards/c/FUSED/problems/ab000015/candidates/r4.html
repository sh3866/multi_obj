<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alpine Rush: High Velocity</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-orange: #ff9d00;
            --neon-red: #ff2a2a;
            --glass-bg: rgba(10, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.2);
            --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050a14;
            font-family: var(--font-ui);
            color: white;
        }

        /* --- LAYOUT & LAYERS --- */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* FX Layer for particles/speed lines */
        #fx-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            mix-blend-mode: screen;
        }

        /* Vignette - Subtle to focus center */
        .overlay-fx {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            background: radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.6) 100%);
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        /* --- TOP HUD --- */
        .hud-top {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* Progress Bar - Thick & Focal Point */
        .progress-container {
            width: 100%;
            max-width: 400px;
            height: 16px; /* Thicker */
            background: rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), #ffffff);
            width: 100%;
            box-shadow: 0 0 15px var(--neon-cyan);
            transform-origin: left;
            border-radius: 2px;
        }

        /* Stats Row */
        .stats-row {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: space-between;
            pointer-events: none;
        }

        .stat-box {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-left: 6px solid var(--neon-cyan);
            padding: 10px 20px;
            border-radius: 4px;
            transform: skewX(-12deg);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            min-width: 130px;
        }

        .stat-box.speed-box { border-left-color: var(--neon-orange); }

        .stat-label {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.6);
            display: block;
            margin-bottom: 2px;
            transform: skewX(12deg);
        }

        .stat-value {
            font-size: 34px;
            font-weight: 800;
            font-family: var(--font-mono);
            color: white;
            display: block;
            transform: skewX(12deg);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            line-height: 1;
        }

        .stat-unit {
            font-size: 14px;
            color: var(--neon-cyan);
            margin-left: 8px;
            font-weight: 700;
            opacity: 0.8;
        }

        /* --- CONTROLS --- */
        .controls-area {
            padding: 20px 30px 40px 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            pointer-events: none; /* Let clicks pass through container, catch on buttons */
            margin-bottom: 20px;
        }

        /* D-Pad - Tactile & Distinct */
        .d-pad {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .ctrl-btn {
            width: 70px;
            height: 70px;
            border-radius: 12px; /* Squircle for grip feel */
            background: rgba(20, 30, 50, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-bottom: 6px solid rgba(0, 0, 0, 0.4); /* Physical depth */
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.05s linear;
            color: rgba(255,255,255,0.8);
            backdrop-filter: blur(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .ctrl-btn svg { width: 32px; height: 32px; fill: currentColor; }

        .ctrl-btn:active, .ctrl-btn.active {
            background: rgba(0, 243, 255, 0.15);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            transform: translateY(4px);
            border-bottom-width: 2px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }

        /* Brake / Action - High Contrast */
        .action-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(255, 42, 42, 0.1);
            border: 3px solid var(--neon-red);
            border-bottom: 8px solid rgba(150, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 1px;
            color: var(--neon-red);
            text-transform: uppercase;
            transition: all 0.05s linear;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            pointer-events: auto;
            text-shadow: 0 0 10px rgba(255, 42, 42, 0.5);
        }

        .action-btn:active, .action-btn.active {
            background: var(--neon-red);
            color: white;
            transform: translateY(4px);
            border-bottom-width: 4px;
            box-shadow: 0 0 30px var(--neon-red);
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(0deg); }
        }

        .shake-effect {
            animation: shake 0.2s infinite;
        }

    </style>
</head>
<body>

<div id="game-container">
    <!-- Main Render -->
    <canvas id="gameCanvas"></canvas>
    <!-- FX Layer -->
    <canvas id="fx-canvas"></canvas>
    <!-- Overlays -->
    <div class="overlay-fx"></div>

    <!-- UI -->
    <div class="ui-layer">
        
        <div class="hud-top">
            <!-- Progress Bar -->
            <div class="progress-container">
                <div class="progress-fill" id="progressBar"></div>
            </div>

            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-box">
                    <span class="stat-label">Distance</span>
                    <span class="stat-value"><span id="distDisplay">0.00</span><span class="stat-unit">KM</span></span>
                </div>
                <div class="stat-box speed-box">
                    <span class="stat-label">Velocity</span>
                    <span class="stat-value"><span id="speedDisplay">0</span><span class="stat-unit">KM/H</span></span>
                </div>
            </div>
        </div>

        <div class="controls-area">
            <div class="d-pad">
                <div class="ctrl-btn" id="btnLeft">
                    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                </div>
                <div class="ctrl-btn" id="btnRight">
                    <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </div>
            </div>

            <div class="action-btn" id="btnBrake">
                Brake
            </div>
        </div>
    </div>
</div>

<script>
    /**
     * ALPINE RUSH ENGINE v5 - VISUAL REDESIGN
     * Changes applied per critique:
     * 1. Alpine Identity: Snowy mountains, distinct snow spray particles, neon only for UI/Gates.
     * 2. Readability: Rider silhouette is white/bright, obstacles are larger and darker.
     * 3. Hierarchy: Thicker progress bar, peripheral speed lines (clear vision cone).
     * 4. Controls: Tactile, 3D-styled buttons.
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');

    // UI Elements
    const speedDisplay = document.getElementById('speedDisplay');
    const distDisplay = document.getElementById('distDisplay');
    const progressBar = document.getElementById('progressBar');
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnBrake = document.getElementById('btnBrake');
    const gameContainer = document.getElementById('game-container');

    // Config
    let width, height, dpr;
    let cx, cy;
    let frame = 0;

    // Game State
    const state = {
        speed: 0,
        targetSpeed: 140,
        distance: 0,
        playerX: 0, 
        playerTilt: 0,
        isBraking: false,
        roadWidth: 2200,
        cameraHeight: 600, 
        fov: 100,
        segmentLength: 200,
        rumbleFreq: 0
    };

    // Input
    const input = { left: false, right: false, brake: false };

    // World Generation
    const world = {
        obstacles: [],
        trees: [],
        particles: []
    };

    // --- Init & Resize ---

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(dpr, dpr);

        fxCanvas.width = width * dpr;
        fxCanvas.height = height * dpr;
        fxCanvas.style.width = width + 'px';
        fxCanvas.style.height = height + 'px';
        fxCtx.scale(dpr, dpr);

        cx = width / 2;
        cy = height / 2;
    }

    function init() {
        resize();
        window.addEventListener('resize', resize);
        setupInputs();
        generateWorld();
        state.speed = 100;
        requestAnimationFrame(loop);
    }

    function generateWorld() {
        // Generate Trees
        for(let i=0; i<120; i++) {
            world.trees.push({
                z: Math.random() * 8000,
                x: (Math.random() * 2 - 1) * 8000, // Wider spread
                scale: Math.random() * 0.5 + 0.8,
                type: 'pine'
            });
        }
        // Generate Rocks
        for(let i=0; i<40; i++) {
            world.trees.push({
                z: Math.random() * 8000,
                x: (Math.random() * 2 - 1) * 8000,
                scale: Math.random() * 0.5 + 0.5,
                type: 'rock'
            });
        }
        // Generate Obstacles
        for(let i=0; i<50; i++) {
            world.obstacles.push({
                z: 1500 + i * 400 + Math.random() * 200,
                x: (Math.random() * 2 - 1) * 1400,
                type: Math.random() > 0.4 ? 'gate' : 'barrier'
            });
        }
    }

    function setupInputs() {
        const setKey = (k, v) => {
            if(k === 'ArrowLeft') input.left = v;
            if(k === 'ArrowRight') input.right = v;
            if(k === 'ArrowDown' || k === ' ') input.brake = v;
        };

        document.addEventListener('keydown', e => setKey(e.key, true));
        document.addEventListener('keyup', e => setKey(e.key, false));

        const bindTouch = (el, key) => {
            const start = (e) => { e.preventDefault(); input[key] = true; el.classList.add('active'); };
            const end = (e) => { e.preventDefault(); input[key] = false; el.classList.remove('active'); };
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
            el.addEventListener('touchstart', start);
            el.addEventListener('touchend', end);
        };

        bindTouch(btnLeft, 'left');
        bindTouch(btnRight, 'right');
        bindTouch(btnBrake, 'brake');
    }

    // --- Math & Projection ---

    function project(x, y, z) {
        const scale = state.fov / (state.fov + z);
        const x2d = (x * scale) + cx;
        const y2d = ((y - state.cameraHeight) * scale) + cy + 80; // Horizon slightly lower
        return { x: x2d, y: y2d, scale: scale };
    }

    // --- Rendering Helpers ---

    function drawSky() {
        // CRITIQUE FIX: Alpine Identity - Brighter, icy gradient
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, '#1e3c72'); // Deep Alpine Blue
        grad.addColorStop(0.4, '#2a5298');
        grad.addColorStop(0.8, '#87ceeb'); // Light Blue
        grad.addColorStop(1, '#e0f7fa'); // Icy White
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);
    }

    function drawMountains() {
        const offset = (frame * state.speed * 0.05) % width;
        
        ctx.save();
        
        // Far layer (Blueish)
        ctx.beginPath();
        ctx.moveTo(0, height);
        for(let i = -200; i < width + 200; i += 40) {
            const h = Math.sin((i + offset * 0.1) * 0.005) * 150 + 
                      Math.cos((i + offset * 0.1) * 0.01) * 80;
            ctx.lineTo(i, cy - 50 - h);
        }
        ctx.lineTo(width, height);
        ctx.fillStyle = '#1a2a6c';
        ctx.fill();
        
        // Snow caps on mountains
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.beginPath();
        for(let i = -200; i < width + 200; i += 40) {
             const h = Math.sin((i + offset * 0.1) * 0.005) * 150 + 
                       Math.cos((i + offset * 0.1) * 0.01) * 80;
             if(h > 100) ctx.lineTo(i, cy - 50 - h + 20);
        }
        ctx.fill();

        // Mid layer (Darker, more jagged)
        ctx.beginPath();
        ctx.moveTo(0, height);
        for(let i = -200; i < width + 200; i += 30) {
            const h = Math.sin((i + offset * 0.5) * 0.01) * 100 + 
                      Math.cos((i + offset * 0.5) * 0.02) * 60;
            ctx.lineTo(i, cy + 50 - h);
        }
        ctx.lineTo(width, height);
        ctx.fillStyle = '#0f172a';
        ctx.fill();
        
        ctx.restore();
    }

    function drawTrack() {
        // CRITIQUE FIX: Textured Snowy Slope
        const tl = -state.roadWidth / 2;
        const tr = state.roadWidth / 2;
        const drawDist = 6000;

        ctx.save();
        ctx.beginPath();
        const p1 = project(tl, 0, 10);
        const p2 = project(tr, 0, 10);
        const p3 = project(tr, 0, drawDist);
        const p4 = project(tl, 0, drawDist);
        
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.lineTo(p4.x, p4.y);
        ctx.closePath();
        ctx.clip();

        // Draw Snow Texture (Subtle Noise)
        // We simulate noise by drawing many small semi-transparent lines
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        const speedOffset = (frame * state.speed * 2) % 100;
        for(let i=0; i<width*2; i+=20) {
            let y = Math.random() * height;
            ctx.moveTo(i, y);
            ctx.lineTo(i, y + Math.random() * 50);
        }
        ctx.stroke();

        // Draw Route Lines (Gates path)
        ctx.lineWidth = 4;
        ctx.setLineDash([40, 60]); // Dashed lines
        
        for (let z = drawDist; z > 10; z -= state.segmentLength) {
            const drawZ = z - (frame * state.speed * 3) % state.segmentLength;
            if (drawZ < 10) continue;
            
            const pL = project(tl, 0, drawZ);
            const pR = project(tr, 0, drawZ);
            
            // Fade out in distance
            const alpha = Math.max(0, 1 - (drawZ / drawDist));
            
            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.6})`;
            ctx.beginPath();
            ctx.moveTo(pL.x, pL.y);
            ctx.lineTo(pR.x, pR.y);
            ctx.stroke();
        }

        // Track Edges - Glowing Neon V-lines
        ctx.setLineDash([]);
        ctx.lineWidth = 5;
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.6)';
        ctx.shadowBlur = 15;
        ctx.shadowColor = 'rgba(0, 243, 255, 0.8)';

        // Left Edge
        ctx.beginPath();
        for(let z=10; z<drawDist; z+=10) {
            const p = project(tl, 0, z);
            if(z===10) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();

        // Right Edge
        ctx.beginPath();
        for(let z=10; z<drawDist; z+=10) {
            const p = project(tr, 0, z);
            if(z===10) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        
        ctx.restore();
    }

    function drawObstacle(obs) {
        let z = obs.z - (frame * state.speed * 3);
        if (z < 10) z += 8000;

        const relX = obs.x - (state.playerX * state.roadWidth);
        const p = project(relX, 0, z);
        
        if (p.scale <= 0) return;

        const size = 300 * p.scale; // Increased size

        ctx.save();
        ctx.translate(p.x, p.y);

        if (obs.type === 'gate') {
            // CRITIQUE FIX: High Contrast Neon Gate
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#00f3ff';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 10 * p.scale;
            
            // Arch shape
            ctx.beginPath();
            ctx.moveTo(-size, 0);
            ctx.lineTo(-size, -size * 1.8);
            ctx.quadraticCurveTo(0, -size * 2.5, size, -size * 1.8);
            ctx.lineTo(size, 0);
            ctx.stroke();

            // Inner glow
            ctx.fillStyle = 'rgba(0, 243, 255, 0.4)';
            ctx.fill();

        } else {
            // CRITIQUE FIX: High Visual Weight Obstacle (Rock)
            ctx.fillStyle = '#1e293b'; // Dark slate
            ctx.strokeStyle = '#ff9d00'; // Neon Orange
            ctx.lineWidth = 6 * p.scale;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff9d00';

            ctx.beginPath();
            ctx.moveTo(-size/2, 0);
            ctx.lineTo(-size/3, -size/1.2);
            ctx.lineTo(size/4, -size/1.8);
            ctx.lineTo(size/2, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }
        ctx.restore();
    }

    function drawTree(tree) {
        let z = tree.z - (frame * state.speed * 3);
        if (z < 10) z += 8000;
        
        const relX = tree.x - (state.playerX * 2000);
        const p = project(relX, 0, z);
        if (p.scale <= 0) return;

        const size = 500 * p.scale * tree.scale; // Larger trees

        ctx.save();
        ctx.translate(p.x, p.y);

        if(tree.type === 'pine') {
            // Pine Tree
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.moveTo(0, -size);
            ctx.lineTo(-size/2, 0);
            ctx.lineTo(size/2, 0);
            ctx.fill();

            // Snow Cap
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(0, -size);
            ctx.lineTo(-size/4, -size*0.7);
            ctx.lineTo(size/4, -size*0.7);
            ctx.fill();
        } else {
            // Rock
            ctx.fillStyle = '#334155';
            ctx.beginPath();
            ctx.arc(0, -size/4, size/3, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.5)'; // Snow on top
            ctx.beginPath();
            ctx.arc(0, -size/4, size/4, Math.PI, 0);
            ctx.fill();
        }

        ctx.restore();
    }

    function drawPlayer() {
        // CRITIQUE FIX: Anchor Rider at bottom center
        const p = project(0, 0, 10); 
        
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(state.playerTilt * 0.8);

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 60, 15, 0, 0, Math.PI*2);
        ctx.fill();

        // CRITIQUE FIX: High Contrast Silhouette (White)
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ffffff';
        
        // Helmet
        ctx.beginPath();
        ctx.arc(0, -95, 22, 0, Math.PI*2);
        ctx.fill();
        
        // Torso (Distinct Color)
        ctx.fillStyle = '#ff0055';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ff0055';
        ctx.beginPath();
        ctx.moveTo(-22, -95);
        ctx.lineTo(22, -95);
        ctx.lineTo(35, -45);
        ctx.lineTo(-35, -45);
        ctx.fill();

        // Skis (Glowing Blue, extended)
        ctx.strokeStyle = '#00f3ff';
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        ctx.shadowBlur = 25;
        ctx.shadowColor = '#00f3ff';

        // Left Ski
        ctx.beginPath();
        ctx.moveTo(-30, -45);
        ctx.quadraticCurveTo(-35, -10, -60, 25);
        ctx.stroke();

        // Right Ski
        ctx.beginPath();
        ctx.moveTo(30, -45);
        ctx.quadraticCurveTo(35, -10, 60, 25);
        ctx.stroke();

        ctx.restore();
    }

    // --- FX ---

    function drawSpeedLines() {
        fxCtx.clearRect(0, 0, width, height);
        
        if(state.speed < 100) return;

        const intensity = (state.speed - 100) / 100; 
        const count = Math.floor(intensity * 40); 
        
        fxCtx.lineWidth = 3;
        fxCtx.lineCap = 'round';

        for(let i=0; i<count; i++) {
            // CRITIQUE FIX: Peripheral speed lines only (Vision Cone)
            // Don't draw lines in the center 40% of screen
            let x = Math.random() * width;
            let y = Math.random() * height;
            
            // Check if x is in center zone
            const centerX = width / 2;
            const centerZone = width * 0.4;
            if (x > centerX - centerZone && x < centerX + centerZone) continue;

            const len = 100 + Math.random() * 150 * intensity;
            const angle = Math.atan2(y - cy, x - cx) + Math.PI; 
            
            fxCtx.strokeStyle = `rgba(255, 255, 255, ${Math.random() * 0.4 * intensity})`;
            
            fxCtx.beginPath();
            fxCtx.moveTo(x, y);
            fxCtx.lineTo(x + Math.cos(angle) * len, y + Math.sin(angle) * len);
            fxCtx.stroke();
        }
    }

    function drawSnowSpray() {
        // CRITIQUE FIX: Snow Spray Particles trailing rider
        const p = project(0, 0, 10);
        
        // Add new particles
        if (state.speed > 60) {
            for(let i=0; i<3; i++) {
                world.particles.push({
                    x: p.x + (Math.random() * 40 - 20),
                    y: p.y + (Math.random() * 20 - 10),
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() * 5) + 2,
                    life: 1.0,
                    size: Math.random() * 5 + 2
                });
            }
        }

        // Update and Draw
        for (let i = world.particles.length - 1; i >= 0; i--) {
            let part = world.particles[i];
            part.x += part.vx;
            part.y += part.vy;
            part.life -= 0.05;
            part.size *= 0.95;

            if (part.life <= 0) {
                world.particles.splice(i, 1);
            } else {
                fxCtx.fillStyle = `rgba(255, 255, 255, ${part.life})`;
                fxCtx.beginPath();
                fxCtx.arc(part.x, part.y, part.size, 0, Math.PI * 2);
                fxCtx.fill();
            }
        }
    }

    // --- Main Loop ---

    function update() {
        // Physics
        if (input.brake) {
            state.targetSpeed = Math.max(40, state.targetSpeed - 8);
            state.isBraking = true;
        } else {
            state.targetSpeed = Math.min(200, state.targetSpeed + 1);
            state.isBraking = false;
        }
        
        state.speed += (state.targetSpeed - state.speed) * 0.05;

        // Steering
        const steerSpeed = 0.04;
        if (input.left) {
            state.playerX = Math.max(-1, state.playerX - steerSpeed);
            state.playerTilt = Math.max(-0.8, state.playerTilt - 0.05);
        } else if (input.right) {
            state.playerX = Math.min(1, state.playerX + steerSpeed);
            state.playerTilt = Math.min(0.8, state.playerTilt + 0.05);
        } else {
            state.playerTilt += (0 - state.playerTilt) * 0.1;
        }

        // Stats
        state.distance += state.speed * 0.0002;
        
        speedDisplay.innerText = Math.floor(state.speed);
        distDisplay.innerText = state.distance.toFixed(2);
        
        const progress = (state.distance % 5) / 5 * 100;
        progressBar.style.width = progress + '%';

        // Screen Shake at high speed
        if (state.speed > 160) {
            gameContainer.classList.add('shake-effect');
        } else {
            gameContainer.classList.remove('shake-effect');
        }

        // Speed Color Change
        if (state.speed > 180) {
            speedDisplay.style.color = 'var(--neon-red)';
            speedDisplay.style.textShadow = '0 0 15px var(--neon-red)';
        } else if (state.speed > 140) {
            speedDisplay.style.color = 'var(--neon-orange)';
            speedDisplay.style.textShadow = '0 0 10px var(--neon-orange)';
        } else {
            speedDisplay.style.color = 'white';
            speedDisplay.style.textShadow = 'none';
        }

        frame++;
    }

    function loop() {
        ctx.clearRect(0, 0, width, height);

        update();

        // 1. Environment
        drawSky();
        drawMountains();
        drawTrack();

        // 2. World Objects
        const renderList = [];
        
        world.trees.forEach(t => {
            let z = t.z - (frame * state.speed * 3);
            while(z < 10) z += 8000;
            renderList.push({ type: 'tree', obj: t, z: z });
        });

        world.obstacles.forEach(o => {
            let z = o.z - (frame * state.speed * 3);
            while(z < 10) z += 8000;
            renderList.push({ type: 'obs', obj: o, z: z });
        });

        renderList.sort((a, b) => b.z - a.z);

        renderList.forEach(item => {
            if(item.type === 'tree') drawTree(item.obj);
            else drawObstacle(item.obj);
        });

        // 3. Player
        drawPlayer();

        // 4. FX (Speed lines + Snow Spray)
        drawSpeedLines();
        drawSnowSpray();

        requestAnimationFrame(loop);
    }

    init();
</script>
</body>
