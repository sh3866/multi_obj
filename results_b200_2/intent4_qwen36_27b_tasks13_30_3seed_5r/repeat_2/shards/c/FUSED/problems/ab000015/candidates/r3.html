<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alpine Rush: Velocity</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --neon-orange: #ff9d00;
            --glass-bg: rgba(10, 15, 30, 0.6);
            --glass-border: rgba(255, 255, 255, 0.15);
            --font-ui: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020617;
            font-family: var(--font-ui);
            color: white;
        }

        /* --- LAYOUT & LAYERS --- */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Speed Lines Overlay */
        #fx-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            mix-blend-mode: screen;
        }

        /* Vignette & Grain */
        .overlay-fx {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.7) 100%);
        }

        .noise {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.04;
            z-index: 4;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        /* --- TOP HUD --- */
        .hud-top {
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* Progress Bar - Thicker per critique */
        .progress-container {
            width: 100%;
            max-width: 500px;
            height: 12px; /* Increased from 6px */
            background: rgba(0, 0, 0, 0.4);
            border-radius: 6px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), #ffffff);
            width: 100%;
            box-shadow: 0 0 15px var(--neon-cyan);
            transform-origin: left;
            border-radius: 6px;
        }

        /* Stats Row */
        .stats-row {
            display: flex;
            gap: 16px;
            width: 100%;
            justify-content: space-between;
            pointer-events: none;
        }

        .stat-box {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-left: 4px solid var(--neon-cyan);
            padding: 8px 24px;
            border-radius: 8px;
            transform: skewX(-10deg);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            min-width: 140px;
        }

        .stat-box.speed-box { border-left-color: var(--neon-orange); }

        .stat-label {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.7);
            display: block;
            margin-bottom: 4px;
            transform: skewX(10deg);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            font-family: var(--font-mono);
            color: white;
            display: block;
            transform: skewX(10deg);
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
            line-height: 1;
        }

        .stat-unit {
            font-size: 14px;
            color: var(--neon-cyan);
            margin-left: 6px;
            font-weight: 600;
        }

        /* --- CONTROLS --- */
        .controls-area {
            padding: 40px 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            pointer-events: auto;
            margin-bottom: 20px;
        }

        /* D-Pad - High Contrast per critique */
        .d-pad {
            display: flex;
            gap: 20px;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px 25px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
        }

        .ctrl-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.8); /* High contrast border */
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            color: #ffffff; /* White arrows */
        }

        .ctrl-btn svg { width: 28px; height: 28px; fill: currentColor; filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); }

        .ctrl-btn:active, .ctrl-btn.active {
            background: rgba(0, 243, 255, 0.2);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            transform: scale(0.92);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        /* Brake / Action */
        .action-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(255, 0, 85, 0.15);
            border: 2px solid var(--neon-pink);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 1px;
            color: var(--neon-pink);
            text-transform: uppercase;
            transition: all 0.1s;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
        }

        .action-btn:active, .action-btn.active {
            background: var(--neon-pink);
            color: white;
            transform: scale(0.95);
            box-shadow: 0 0 30px var(--neon-pink);
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(0deg); }
        }

        .shake-effect {
            animation: shake 0.2s infinite;
        }

    </style>
</head>
<body>

<div id="game-container">
    <!-- Main Render -->
    <canvas id="gameCanvas"></canvas>
    <!-- FX Layer -->
    <canvas id="fx-canvas"></canvas>
    <!-- Overlays -->
    <div class="overlay-fx"></div>
    <div class="noise"></div>

    <!-- UI -->
    <div class="ui-layer">
        
        <div class="hud-top">
            <!-- Progress Bar -->
            <div class="progress-container">
                <div class="progress-fill" id="progressBar"></div>
            </div>

            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-box">
                    <span class="stat-label">Distance</span>
                    <span class="stat-value"><span id="distDisplay">0.00</span><span class="stat-unit">KM</span></span>
                </div>
                <div class="stat-box speed-box">
                    <span class="stat-label">Velocity</span>
                    <span class="stat-value"><span id="speedDisplay">0</span><span class="stat-unit">KM/H</span></span>
                </div>
            </div>
        </div>

        <div class="controls-area">
            <div class="d-pad">
                <div class="ctrl-btn" id="btnLeft">
                    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                </div>
                <div class="ctrl-btn" id="btnRight">
                    <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </div>
            </div>

            <div class="action-btn" id="btnBrake">
                Brake
            </div>
        </div>
    </div>
</div>

<script>
    /**
     * ALPINE RUSH ENGINE v4 - VISUAL REDESIGN
     * Changes: 
     * 1. Removed grey block (sky gradient extends to bottom).
     * 2. Rider anchored at bottom center.
     * 3. Enhanced Speed lines & Glowing Track Edges.
     * 4. High Contrast Gates.
     * 5. Refined UI hierarchy.
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');

    // UI Elements
    const speedDisplay = document.getElementById('speedDisplay');
    const distDisplay = document.getElementById('distDisplay');
    const progressBar = document.getElementById('progressBar');
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnBrake = document.getElementById('btnBrake');
    const gameContainer = document.getElementById('game-container');

    // Config
    let width, height, dpr;
    let cx, cy;
    let frame = 0;

    // Game State
    const state = {
        speed: 0,
        targetSpeed: 140,
        distance: 0,
        playerX: 0, 
        playerTilt: 0,
        isBraking: false,
        roadWidth: 2400,
        cameraHeight: 800, // Adjusted for perspective
        fov: 100,
        segmentLength: 200,
        rumbleFreq: 0
    };

    // Input
    const input = { left: false, right: false, brake: false };

    // World Generation
    const world = {
        obstacles: [],
        trees: [],
        particles: []
    };

    // --- Init & Resize ---

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(dpr, dpr);

        fxCanvas.width = width * dpr;
        fxCanvas.height = height * dpr;
        fxCanvas.style.width = width + 'px';
        fxCanvas.style.height = height + 'px';
        fxCtx.scale(dpr, dpr);

        cx = width / 2;
        cy = height / 2;
    }

    function init() {
        resize();
        window.addEventListener('resize', resize);
        setupInputs();
        generateWorld();
        state.speed = 80;
        requestAnimationFrame(loop);
    }

    function generateWorld() {
        for(let i=0; i<100; i++) {
            world.trees.push({
                z: Math.random() * 8000,
                x: (Math.random() * 2 - 1) * 6000,
                scale: Math.random() * 0.5 + 0.8,
                type: Math.random() > 0.7 ? 'pine' : 'rock'
            });
        }
        for(let i=0; i<40; i++) {
            world.obstacles.push({
                z: 1500 + i * 400 + Math.random() * 200,
                x: (Math.random() * 2 - 1) * 1400,
                type: Math.random() > 0.5 ? 'gate' : 'barrier'
            });
        }
    }

    function setupInputs() {
        const setKey = (k, v) => {
            if(k === 'ArrowLeft') input.left = v;
            if(k === 'ArrowRight') input.right = v;
            if(k === 'ArrowDown' || k === ' ') input.brake = v;
        };

        document.addEventListener('keydown', e => setKey(e.key, true));
        document.addEventListener('keyup', e => setKey(e.key, false));

        const bindTouch = (el, key) => {
            const start = (e) => { e.preventDefault(); input[key] = true; el.classList.add('active'); };
            const end = (e) => { e.preventDefault(); input[key] = false; el.classList.remove('active'); };
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
            el.addEventListener('touchstart', start);
            el.addEventListener('touchend', end);
        };

        bindTouch(btnLeft, 'left');
        bindTouch(btnRight, 'right');
        bindTouch(btnBrake, 'brake');
    }

    // --- Math & Projection ---

    function project(x, y, z) {
        const scale = state.fov / (state.fov + z);
        const x2d = (x * scale) + cx;
        // Camera height adjusted to place horizon lower, extending track to bottom
        const y2d = ((y - state.cameraHeight) * scale) + cy + 50; 
        return { x: x2d, y: y2d, scale: scale };
    }

    // --- Rendering Helpers ---

    function drawSky() {
        // CRITIQUE FIX: Eliminate grey block, extend dramatic slope gradient to bottom
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, '#020024'); // Deep Night
        grad.addColorStop(0.4, '#090979'); // Horizon
        grad.addColorStop(0.8, '#00d4ff'); // Icy Blue
        grad.addColorStop(1, '#e0f7fa'); // Bright Ice Bottom
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);
    }

    function drawMountains() {
        const offset = (frame * state.speed * 0.02) % width;
        
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(0, height);
        
        // Far layer (Blueish)
        for(let i = -200; i < width + 200; i += 60) {
            const h = Math.sin((i + offset * 0.2) * 0.005) * 100 + 
                      Math.cos((i + offset * 0.2) * 0.01) * 50;
            ctx.lineTo(i, cy + 50 - h);
        }
        ctx.lineTo(width, height);
        ctx.fillStyle = '#1a2a6c';
        ctx.fill();

        // Mid layer (Darker)
        ctx.beginPath();
        ctx.moveTo(0, height);
        for(let i = -200; i < width + 200; i += 40) {
            const h = Math.sin((i + offset * 0.5) * 0.008) * 80 + 
                      Math.cos((i + offset * 0.5) * 0.02) * 40;
            ctx.lineTo(i, cy + 100 - h);
        }
        ctx.lineTo(width, height);
        ctx.fillStyle = '#061124';
        ctx.fill();
        ctx.restore();
    }

    function drawTrack() {
        // The ground is handled by the sky gradient now, but we draw the track shape
        
        const tl = -state.roadWidth / 2;
        const tr = state.roadWidth / 2;
        const drawDist = 6000;

        ctx.save();
        ctx.beginPath();
        const p1 = project(tl, 0, 10);
        const p2 = project(tr, 0, 10);
        const p3 = project(tr, 0, drawDist);
        const p4 = project(tl, 0, drawDist);
        
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.lineTo(p4.x, p4.y);
        ctx.closePath();
        ctx.clip();

        // CRITIQUE FIX: Dashed pattern for readable route
        const speedOffset = (frame * state.speed * 3) % state.segmentLength;
        
        ctx.lineWidth = 3;
        ctx.setLineDash([20, 20]); // Dashed lines
        
        for (let z = drawDist; z > 10; z -= state.segmentLength) {
            const drawZ = z - speedOffset;
            if (drawZ < 10) continue;
            
            const pL = project(tl, 0, drawZ);
            const pR = project(tr, 0, drawZ);
            
            const alpha = Math.max(0, 1 - (drawZ / drawDist));
            
            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.4})`;
            ctx.beginPath();
            ctx.moveTo(pL.x, pL.y);
            ctx.lineTo(pR.x, pR.y);
            ctx.stroke();
        }

        // CRITIQUE FIX: Glowing Edges (Blue V-lines)
        ctx.setLineDash([]); // Reset dash for edges
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#00f3ff'; // Bright Cyan
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#00f3ff';

        // Left Edge
        ctx.beginPath();
        for(let z=10; z<drawDist; z+=50) {
            const p = project(tl, 0, z);
            if(z===10) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();

        // Right Edge
        ctx.beginPath();
        for(let z=10; z<drawDist; z+=50) {
            const p = project(tr, 0, z);
            if(z===10) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        ctx.restore();
    }

    function drawObstacle(obs) {
        let z = obs.z - (frame * state.speed * 3);
        if (z < 10) z += 8000;

        const relX = obs.x - (state.playerX * state.roadWidth);
        const p = project(relX, 0, z);
        
        if (p.scale <= 0) return;

        const size = 250 * p.scale;

        ctx.save();
        ctx.translate(p.x, p.y);

        if (obs.type === 'gate') {
            // CRITIQUE FIX: High Contrast Gate (Glowing Arch)
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#00f3ff';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 8 * p.scale;
            
            // Arch shape
            ctx.beginPath();
            ctx.moveTo(-size, 0);
            ctx.lineTo(-size, -size * 1.5);
            ctx.quadraticCurveTo(0, -size * 2.2, size, -size * 1.5);
            ctx.lineTo(size, 0);
            ctx.stroke();

            // Inner glow
            ctx.fillStyle = 'rgba(0, 243, 255, 0.3)';
            ctx.fill();

            // Banner
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(-size, -size * 1.6, size * 2, size * 0.5);
            
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${14 * p.scale}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText("CHECKPOINT", 0, -size * 1.35);

        } else {
            // Danger Obstacle
            ctx.fillStyle = '#1e293b';
            ctx.strokeStyle = '#ff9d00'; // Orange
            ctx.lineWidth = 5 * p.scale;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff9d00';

            ctx.beginPath();
            ctx.moveTo(-size/2, 0);
            ctx.lineTo(-size/3, -size/1.5);
            ctx.lineTo(size/4, -size/1.2);
            ctx.lineTo(size/2, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }
        ctx.restore();
    }

    function drawTree(tree) {
        let z = tree.z - (frame * state.speed * 3);
        if (z < 10) z += 8000;
        
        const relX = tree.x - (state.playerX * 2000);
        const p = project(relX, 0, z);
        if (p.scale <= 0) return;

        const size = 400 * p.scale * tree.scale;

        ctx.save();
        ctx.translate(p.x, p.y);

        // Pine Tree
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.moveTo(0, -size);
        ctx.lineTo(-size/2, 0);
        ctx.lineTo(size/2, 0);
        ctx.fill();

        // Snow Cap
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(0, -size);
        ctx.lineTo(-size/4, -size*0.7);
        ctx.lineTo(size/4, -size*0.7);
        ctx.fill();

        ctx.restore();
    }

    function drawPlayer() {
        // CRITIQUE FIX: Anchor Rider at bottom center
        const p = project(0, 0, 10); 
        
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(state.playerTilt * 0.8);

        // Shadow (larger to ground the player)
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 70, 20, 0, 0, Math.PI*2);
        ctx.fill();

        // Sleek Skier/Sled Silhouette
        // Helmet
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, -90, 20, 0, Math.PI*2);
        ctx.fill();
        
        // Torso (Dynamic Pink)
        ctx.fillStyle = '#ff0055';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ff0055';
        ctx.beginPath();
        ctx.moveTo(-20, -90);
        ctx.lineTo(20, -90);
        ctx.lineTo(30, -40);
        ctx.lineTo(-30, -40);
        ctx.fill();

        // Skis (Glowing Blue, extended)
        ctx.strokeStyle = '#00f3ff';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#00f3ff';

        // Left Ski
        ctx.beginPath();
        ctx.moveTo(-30, -40);
        ctx.quadraticCurveTo(-35, -10, -55, 20);
        ctx.stroke();

        // Right Ski
        ctx.beginPath();
        ctx.moveTo(30, -40);
        ctx.quadraticCurveTo(35, -10, 55, 20);
        ctx.stroke();

        ctx.restore();
    }

    function drawSpeedLines() {
        fxCtx.clearRect(0, 0, width, height);
        
        if(state.speed < 80) return;

        const intensity = (state.speed - 80) / 100; 
        const count = Math.floor(intensity * 60); // More lines
        
        fxCtx.lineWidth = 2;
        fxCtx.lineCap = 'round';

        for(let i=0; i<count; i++) {
            const x = Math.random() * width;
            const y = Math.random() * height;
            const len = 100 + Math.random() * 200 * intensity;
            
            // CRITIQUE FIX: Radiate from center for velocity sensation
            // Calculate angle from center to point
            const angle = Math.atan2(y - cy, x - cx) + Math.PI; 
            
            fxCtx.strokeStyle = `rgba(255, 255, 255, ${Math.random() * 0.6 * intensity})`;
            
            fxCtx.beginPath();
            fxCtx.moveTo(x, y);
            fxCtx.lineTo(x + Math.cos(angle) * len, y + Math.sin(angle) * len);
            fxCtx.stroke();
        }
    }

    // --- Main Loop ---

    function update() {
        // Physics
        if (input.brake) {
            state.targetSpeed = Math.max(20, state.targetSpeed - 5);
            state.isBraking = true;
        } else {
            state.targetSpeed = Math.min(180, state.targetSpeed + 0.5);
            state.isBraking = false;
        }
        
        state.speed += (state.targetSpeed - state.speed) * 0.05;

        // Steering
        const steerSpeed = 0.03;
        if (input.left) {
            state.playerX = Math.max(-1, state.playerX - steerSpeed);
            state.playerTilt = Math.max(-0.8, state.playerTilt - 0.05);
        } else if (input.right) {
            state.playerX = Math.min(1, state.playerX + steerSpeed);
            state.playerTilt = Math.min(0.8, state.playerTilt + 0.05);
        } else {
            state.playerTilt += (0 - state.playerTilt) * 0.1;
        }

        // Stats
        state.distance += state.speed * 0.0002;
        
        speedDisplay.innerText = Math.floor(state.speed);
        distDisplay.innerText = state.distance.toFixed(2);
        
        const progress = (state.distance % 5) / 5 * 100;
        progressBar.style.width = progress + '%';

        if (state.speed > 140) {
            gameContainer.classList.add('shake-effect');
        } else {
            gameContainer.classList.remove('shake-effect');
        }

        if(state.speed > 160) {
            speedDisplay.style.color = 'var(--neon-pink)';
            speedDisplay.style.textShadow = '0 0 10px var(--neon-pink)';
        } else {
            speedDisplay.style.color = 'white';
            speedDisplay.style.textShadow = 'none';
        }

        frame++;
    }

    function loop() {
        ctx.clearRect(0, 0, width, height);

        update();

        // 1. Environment
        drawSky(); // Covers whole screen now
        drawMountains();
        drawTrack();

        // 2. World Objects
        const renderList = [];
        
        world.trees.forEach(t => {
            let z = t.z - (frame * state.speed * 3);
            while(z < 10) z += 8000;
            renderList.push({ type: 'tree', obj: t, z: z });
        });

        world.obstacles.forEach(o => {
            let z = o.z - (frame * state.speed * 3);
            while(z < 10) z += 8000;
            renderList.push({ type: 'obs', obj: o, z: z });
        });

        renderList.sort((a, b) => b.z - a.z);

        renderList.forEach(item => {
            if(item.type === 'tree') drawTree(item.obj);
            else drawObstacle(item.obj);
        });

        // 3. Player (Anchored)
        drawPlayer();

        // 4. FX
        drawSpeedLines();

        requestAnimationFrame(loop);
    }

    init();
</script>
</body>
</html>
