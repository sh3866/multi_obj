<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金継ぎ | The Golden Fern Kimono</title>
    <style>
        :root {
            /* Palette: Deep Indigo & Gold (Authentic Japanese Formal) */
            --bg-deep: #0a1118;
            --bg-gradient: radial-gradient(circle at center, #16222e 0%, #05080a 100%);
            
            --text-primary: #e8e4d9; /* Rice Paper White */
            --text-secondary: #8c969f;
            --accent-gold: #d4af37; /* Kinsei Gold */
            
            /* Kimono Variables (Indigo Silk) */
            --k-base: #1a2b42;
            --k-dark: #0d1621;
            --k-light: #263b57;
            --k-sheen: #3e5a82;
            
            /* Obi Variables (Cinnabar Red) */
            --o-base: #8a2424;
            --o-dark: #5e1212;
            --o-light: #b33636;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            background-image: var(--bg-gradient);
            color: var(--text-primary);
            font-family: "Georgia", "Times New Roman", serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Subtle Paper/Noise Texture Overlay */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        /* Layout: Centered Showcase with Floating UI */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3rem;
        }

        /* Typography */
        .header-text {
            text-align: center;
            opacity: 0.9;
        }

        .kanji-title {
            font-size: 2.5rem;
            letter-spacing: 0.2em;
            margin-bottom: 0.5rem;
            background: linear-gradient(to bottom, #fff, #999);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .latin-sub {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--accent-gold);
            opacity: 0.8;
        }

        .vertical-label {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 0.7rem;
            letter-spacing: 0.4em;
            color: var(--text-secondary);
            opacity: 0.6;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }

        .left-label { left: 2rem; }
        .right-label { right: 2rem; }

        /* Main Stage */
        .stage {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* SVG Styling */
        .kimono-svg {
            height: 92vh;
            width: auto;
            /* Soft, atmospheric glow */
            filter: drop-shadow(0 20px 50px rgba(0,0,0,0.6));
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Controls - Minimal Floating Pill */
        .controls {
            pointer-events: auto;
            align-self: center;
            margin-bottom: 2rem;
            display: flex;
            gap: 2rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.8rem 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 50px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .control-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-secondary);
        }

        .swatch {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
            position: relative;
        }
        
        .swatch::after {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border-radius: 50%;
            border: 1px solid transparent;
            transition: border-color 0.3s;
        }
        
        .swatch:hover { transform: scale(1.1); }
        .swatch.active { border-color: var(--accent-gold); box-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }

        /* Responsive */
        @media (max-width: 768px) {
            .vertical-label { display: none; }
            .kimono-svg { height: 80vh; }
            .controls { padding: 0.5rem 1.5rem; width: 90%; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- UI Layer -->
    <div class="ui-layer">
        <div class="header-text">
            <h1 class="kanji-title">秋の文様</h1>
            <div class="latin-sub">Autumn Fern Pattern / 2024 Collection</div>
        </div>

        <div class="vertical-label left-label">
            伝統的工芸品 <br> TRADITIONAL CRAFT
        </div>
        
        <div class="vertical-label right-label">
            手描き友禅 <br> HAND PAINTED YUZEN
        </div>

        <div class="controls">
            <div class="control-group">
                <span class="control-label">Dye</span>
                <div class="swatch active" data-color="indigo" style="background-color: #1a2b42;" title="Ai (Indigo)"></div>
                <div class="swatch" data-color="brown" style="background-color: #3e2723;" title="Chairo (Brown)"></div>
                <div class="swatch" data-color="black" style="background-color: #111111;" title="Kuro (Black)"></div>
            </div>
            <div class="control-group" style="border-left: 1px solid rgba(255,255,255,0.1); padding-left: 1.5rem;">
                <button id="toggle-pattern" style="background:none; border:none; color:var(--text-primary); cursor:pointer; font-family:inherit; font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase;">
                    Hide Pattern
                </button>
            </div>
        </div>
    </div>

    <!-- Main Stage -->
    <div class="stage">
        <!-- 
            SVG Canvas: 800x1100 for elegant proportions.
            ViewBox centered.
        -->
        <svg class="kimono-svg" viewBox="0 0 800 1100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 1. Fabric Sheen (Silk Gradient) -->
                <linearGradient id="kimono-body-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--k-dark);stop-opacity:1" />
                    <stop offset="15%" style="stop-color:var(--k-base);stop-opacity:1" />
                    <stop offset="50%" style="stop-color:var(--k-sheen);stop-opacity:1" /> <!-- Highlight -->
                    <stop offset="85%" style="stop-color:var(--k-base);stop-opacity:1" />
                    <stop offset="100%" style="stop-color:var(--k-dark);stop-opacity:1" />
                </linearGradient>

                <linearGradient id="obi-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--o-dark);stop-opacity:1" />
                    <stop offset="40%" style="stop-color:var(--o-light);stop-opacity:1" />
                    <stop offset="60%" style="stop-color:var(--o-light);stop-opacity:1" />
                    <stop offset="100%" style="stop-color:var(--o-dark);stop-opacity:1" />
                </linearGradient>

                <!-- 2. The Pattern: Stylized Fern (Washi) -->
                <!-- Using Gold to contrast against deep indigo -->
                <pattern id="pattern-fern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                    <rect width="100" height="100" fill="transparent" />
                    
                    <g stroke="var(--accent-gold)" fill="none" opacity="0.6">
                        <!-- Main Stem -->
                        <path d="M50,0 L50,100" stroke-width="1" />
                        
                        <!-- Left Fronds -->
                        <path d="M50,20 Q20,10 10,30 Q25,35 50,20" />
                        <path d="M50,50 Q20,40 10,60 Q25,65 50,50" />
                        <path d="M50,80 Q20,70 10,90 Q25,95 50,80" />
                        
                        <!-- Right Fronds -->
                        <path d="M50,20 Q80,10 90,30 Q75,35 50,20" />
                        <path d="M50,50 Q80,40 90,60 Q75,65 50,50" />
                        <path d="M50,80 Q80,70 90,90 Q75,95 50,80" />
                    </g>
                    
                    <!-- Gold Dust (Maki-e effect) -->
                    <circle cx="30" cy="40" r="1" fill="var(--accent-gold)" opacity="0.4"/>
                    <circle cx="70" cy="70" r="1.5" fill="var(--accent-gold)" opacity="0.4"/>
                </pattern>

                <!-- Obi Pattern (Geometric) -->
                <pattern id="pattern-obi" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                    <rect width="20" height="20" fill="transparent"/>
                    <path d="M0,10 L20,10 M10,0 L10,20" stroke="#000" stroke-width="0.5" opacity="0.3"/>
                    <path d="M0,0 L20,20 M20,0 L0,20" stroke="var(--accent-gold)" stroke-width="0.5" opacity="0.2"/>
                </pattern>

                <!-- Shadow Filter for Depth -->
                <filter id="inner-shadow">
                    <feOffset dx="0" dy="0"/>
                    <feGaussianBlur stdDeviation="5" result="offset-blur"/>
                    <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                    <feFlood flood-color="black" flood-opacity="0.5" result="color"/>
                    <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                    <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
                </filter>
            </defs>

            <!-- GROUP: Centered in ViewBox -->
            <g id="kimono-group" transform="translate(400, 550)">
                
                <!-- LEFT SLEEVE (Sode) -->
                <g id="left-sleeve">
                    <!-- Sleeve Bag -->
                    <path d="M-90,-320 C-90,-380 -220,-380 -220,-320 L-220,180 C-220,200 -210,200 -210,180 L-210,-310 L-90,-310 Z" 
                          fill="url(#kimono-body-grad)" />
                    <path d="M-90,-320 C-90,-380 -220,-380 -220,-320 L-220,180 C-220,200 -210,200 -210,180 L-210,-310 L-90,-310 Z" 
                          fill="url(#pattern-fern)" />
                    
                    <!-- Sleeve Cuff (Katabira) -->
                    <rect x="-220" y="-380" width="10" height="580" fill="#fdfbf7" /> <!-- White lining peek -->
                    <rect x="-210" y="-380" width="2" height="580" fill="var(--k-dark)" /> <!-- Stitch line -->
                    
                    <!-- Sleeve Folds -->
                    <path d="M-200,-350 Q-180,-200 -180,150" stroke="rgba(0,0,0,0.2)" stroke-width="2" fill="none" />
                    <path d="M-215,-350 Q-195,-100 -195,160" stroke="rgba(255,255,255,0.05)" stroke-width="1" fill="none" />
                </g>

                <!-- LEFT SKIRT (Suso) -->
                <path d="M-80,-320 L-80,500 Q-80,540 -100,540 L-220,540 Q-200,520 -180,-320 Z" fill="url(#kimono-body-grad)" />
                <path d="M-80,-320 L-80,500 Q-80,540 -100,540 L-220,540 Q-200,520 -180,-320 Z" fill="url(#pattern-fern)" />

                <!-- RIGHT SKIRT (Suso) -->
                <path d="M80,-320 L80,500 Q80,540 100,540 L220,540 Q200,520 180,-320 Z" fill="url(#kimono-body-grad)" />
                <path d="M80,-320 L80,500 Q80,540 100,540 L220,540 Q200,520 180,-320 Z" fill="url(#pattern-fern)" />

                <!-- RIGHT SLEEVE (Sode) -->
                <g id="right-sleeve">
                    <!-- Sleeve Bag -->
                    <path d="M90,-320 C90,-380 220,-380 220,-320 L220,180 C220,200 210,200 210,180 L210,-310 L90,-310 Z" 
                          fill="url(#kimono-body-grad)" />
                    <path d="M90,-320 C90,-380 220,-380 220,-320 L220,180 C220,200 210,200 210,180 L210,-310 L90,-310 Z" 
                          fill="url(#pattern-fern)" />
                    
                    <!-- Sleeve Cuff -->
                    <rect x="220" y="-380" width="10" height="580" fill="#fdfbf7" />
                    <rect x="208" y="-380" width="2" height="580" fill="var(--k-dark)" />
                    
                    <!-- Sleeve Folds -->
                    <path d="M200,-350 Q180,-200 180,150" stroke="rgba(0,0,0,0.2)" stroke-width="2" fill="none" />
                </g>

                <!-- MAIN BODY / TORSO -->
                <!-- Center panel to anchor the garment -->
                <path d="M-80,-320 L80,-320 L80,540 L-80,540 Z" fill="url(#kimono-body-grad)" />
                <path d="M-80,-320 L80,-320 L80,540 L-80,540 Z" fill="url(#pattern-fern)" />

                <!-- Center Seams (Suriage) -->
                <path d="M0,-320 L0,540" stroke="rgba(0,0,0,0.3)" stroke-width="1.5" fill="none" />
                <path d="M-75,-320 L-75,540" stroke="rgba(0,0,0,0.1)" stroke-width="1" fill="none" />
                <path d="M75,-320 L75,540" stroke="rgba(0,0,0,0.1)" stroke-width="1" fill="none" />

                <!-- 3. The Collar (Eri) - Critical for Authenticity -->
                <!-- Under Collar (Right side tucked in) -->
                <path d="M70,-320 Q35,-300 0,-280 L0,-260 Q40,-280 80,-320 Z" fill="#fdfbf7" />
                
                <!-- Outer Collar (Left side over right) - The 'Eri' -->
                <!-- Top edge -->
                <path d="M-70,-320 Q-35,-300 0,-280 L0,450 Q-5,450 -10,450 L-10,-270 Q-40,-290 -80,-320 Z" fill="#fdfbf7" />
                <!-- Collar Shadow -->
                <path d="M-70,-320 Q-35,-300 0,-280" stroke="rgba(0,0,0,0.2)" stroke-width="2" fill="none" />
                
                <!-- Gold Trim on Collar (Fuki-e) -->
                <path d="M-68,-318 Q-34,-298 0,-278" stroke="var(--accent-gold)" stroke-width="1.5" fill="none" opacity="0.8" />

                <!-- 4. The Obi (Sash) - Focused & Prominent -->
                <g id="obi-group" transform="translate(0, 40)">
                    
                    <!-- Obi Main Band (Front) -->
                    <path d="M-85,0 L85,0 L85,100 L-85,100 Z" fill="url(#obi-grad)" />
                    <path d="M-85,0 L85,0 L85,100 L-85,100 Z" fill="url(#pattern-obi)" />
                    
                    <!-- Obi Folds (Vertical texture) -->
                    <g stroke="var(--o-dark)" stroke-width="1.5" opacity="0.4">
                        <path d="M-70,0 L-70,100" />
                        <path d="M-50,0 L-50,100" />
                        <path d="M-30,0 L-30,100" />
                        <path d="M-10,0 L-10,100" />
                        <path d="M10,0 L10,100" />
                        <path d="M30,0 L30,100" />
                        <path d="M50,0 L50,100" />
                        <path d="M70,0 L70,100" />
                    </g>
                    
                    <!-- Obi Edge (Oro) -->
                    <line x1="-85" y1="0" x2="85" y2="0" stroke="var(--accent-gold)" stroke-width="2" />
                    <line x1="-85" y1="100" x2="85" y2="100" stroke="var(--accent-gold)" stroke-width="2" />

                    <!-- 5. The Knot (Musubi) - Taige Style -->
                    <g transform="translate(0, 50)">
                        <!-- Top Loop -->
                        <path d="M-40,-10 C-40,-50 40,-50 40,-10 L40,20 C20,10 0,10 -20,20 Z" fill="url(#obi-grad)" filter="url(#inner-shadow)"/>
                        <path d="M-40,-10 C-40,-50 40,-50 40,-10 L40,20 C20,10 0,10 -20,20 Z" fill="url(#pattern-obi)" />
                        
                        <!-- Bottom Loop (Dangling) -->
                        <path d="M-30,20 C-30,80 30,80 30,20 L30,-10 L-30,-10 Z" fill="url(#obi-grad)" />
                        <path d="M-30,20 C-30,80 30,80 30,20 L30,-10 L-30,-10 Z" fill="url(#pattern-obi)" />
                        
                        <!-- Knot Details (Folds) -->
                        <path d="M-20,-10 L0,50 L20,-10" stroke="var(--o-dark)" stroke-width="1" fill="none" opacity="0.6" />
                        
                        <!-- Gold Accents on Knot -->
                        <path d="M-35,-10 L35,-10" stroke="var(--accent-gold)" stroke-width="1.5" />
                    </g>
                </g>

                <!-- 6. Hem Folds (Suriage) -->
                <!-- Adds volume to the bottom of the skirt -->
                <path d="M-200,450 Q-100,480 0,460 T200,450" stroke="rgba(0,0,0,0.4)" stroke-width="3" fill="none" filter="blur(2px)"/>
                <path d="M-190,470 Q-100,500 0,480 T190,470" stroke="rgba(0,0,0,0.3)" stroke-width="2" fill="none" />

            </g>
        </svg>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const stage = document.querySelector('.kimono-svg');
            const root = document.documentElement;
            const swatches = document.querySelectorAll('.swatch');
            const toggleBtn = document.getElementById('toggle-pattern');
            const patternElements = document.querySelectorAll('[fill="url(#pattern-fern)"]');
            
            let patternVisible = true;

            // 1. Subtle 3D Tilt Effect
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth / 2 - e.clientX) / 60;
                const y = (window.innerHeight / 2 - e.clientY) / 60;
                stage.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
            });

            // 2. Color Logic
            const palettes = {
                'indigo': { 
                    base: '#1a2b42', dark: '#0d1621', light: '#263b57', sheen: '#3e5a82',
                    obiBase: '#8a2424', obiDark: '#5e1212', obiLight: '#b33636' 
                },
                'brown': { 
                    base: '#3e2723', dark: '#251512', light: '#5d4037', sheen: '#795548',
                    obiBase: '#d4af37', obiDark: '#b8962e', obiLight: '#f0c94b' // Gold Obi
                },
                'black': { 
                    base: '#1a1a1a', dark: '#000000', light: '#2a2a2a', sheen: '#444444',
                    obiBase: '#8a2424', obiDark: '#5e1212', obiLight: '#b33636' 
                }
            };

            swatches.forEach(swatch => {
                swatch.addEventListener('click', () => {
                    swatches.forEach(s => s.classList.remove('active'));
                    swatch.classList.add('active');

                    const colorKey = swatch.getAttribute('data-color');
                    const p = palettes[colorKey];

                    // Smooth transition via CSS variables
                    root.style.setProperty('--k-base', p.base);
                    root.style.setProperty('--k-dark', p.dark);
                    root.style.setProperty('--k-light', p.light);
                    root.style.setProperty('--k-sheen', p.sheen);
                    
                    root.style.setProperty('--o-base', p.obiBase);
                    root.style.setProperty('--o-dark', p.obiDark);
                    root.style.setProperty('--o-light', p.obiLight);
                });
            });

            // 3. Pattern Toggle
            toggleBtn.addEventListener('click', () => {
                patternVisible = !patternVisible;
                patternElements.forEach(path => {
                    path.style.transition = "opacity 0.5s ease";
                    path.style.opacity = patternVisible ? "1" : "0";
                });
                toggleBtn.textContent = patternVisible ? "Hide Pattern" : "Show Pattern";
            });
        });
    </script>
</body>
</html>
