<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金継ぎ | The Golden Fern Kimono</title>
    <style>
        :root {
            /* Palette: Deep Indigo & Gold (Authentic Japanese Formal) */
            --bg-deep: #05080a;
            --bg-gradient: radial-gradient(circle at center, #16222e 0%, #05080a 100%);
            
            --text-primary: #f0f0f0;
            --text-secondary: #8c969f;
            --accent-gold: #d4af37;
            
            /* Kimono Variables (Indigo Silk) */
            --k-base: #1a2b42;
            --k-dark: #0d1621;
            --k-light: #263b57;
            --k-sheen: #3e5a82;
            
            /* Obi Variables (Cinnabar Red) */
            --o-base: #8a2424;
            --o-dark: #5e1212;
            --o-light: #b33636;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            background-image: var(--bg-gradient);
            color: var(--text-primary);
            font-family: "Georgia", "Times New Roman", serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Subtle Paper/Noise Texture Overlay */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        /* Layout: Centered Showcase with Floating UI */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3rem;
        }

        /* Typography */
        .header-text {
            text-align: center;
            opacity: 0.9;
        }

        .kanji-title {
            font-size: 3.5rem;
            letter-spacing: 0.3em;
            margin-bottom: 0.5rem;
            background: linear-gradient(to bottom, #fff, #ccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .latin-sub {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            color: var(--accent-gold);
            opacity: 0.9;
            font-weight: bold;
        }

        .vertical-label {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 0.85rem;
            letter-spacing: 0.6em;
            color: var(--text-secondary);
            opacity: 0.7;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            text-transform: uppercase;
        }

        .left-label { left: 2rem; }
        .right-label { right: 2rem; }

        /* Main Stage */
        .stage {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        /* SVG Styling */
        .kimono-svg {
            height: 90vh;
            width: auto;
            filter: drop-shadow(0 30px 60px rgba(0,0,0,0.8));
            transition: transform 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Controls - Refined UI */
        .controls {
            pointer-events: auto;
            align-self: center;
            margin-bottom: 2rem;
            display: flex;
            gap: 3rem;
            background: rgba(10, 15, 20, 0.6);
            padding: 1rem 3rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .control-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-secondary);
            font-weight: bold;
        }

        .swatch {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        /* Active state ring */
        .swatch::after {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%;
            border: 1px solid transparent;
            transition: border-color 0.3s;
        }
        
        .swatch:hover { transform: scale(1.1); }
        .swatch.active { border-color: #fff; box-shadow: 0 0 15px var(--accent-gold); }
        .swatch.active::after { border-color: var(--accent-gold); }

        /* Pattern Toggle Button */
        .toggle-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-secondary);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.4rem 1rem;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .toggle-btn:hover {
            color: #fff;
            border-color: #fff;
        }

        .toggle-btn.active {
            background: rgba(255,255,255,0.1);
            color: var(--accent-gold);
            border-color: var(--accent-gold);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .vertical-label { display: none; }
            .kimono-svg { height: 75vh; }
            .controls { padding: 0.8rem 1.5rem; width: 90%; justify-content: center; gap: 1.5rem; }
            .kanji-title { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <!-- UI Layer -->
    <div class="ui-layer">
        <div class="header-text">
            <h1 class="kanji-title">秋の文様</h1>
            <div class="latin-sub">Autumn Fern Pattern / 2024 Collection</div>
        </div>

        <div class="vertical-label left-label">
            伝統的工芸品 <br> TRADITIONAL CRAFT
        </div>
        
        <div class="vertical-label right-label">
            手描き友禅 <br> HAND PAINTED YUZEN
        </div>

        <div class="controls">
            <div class="control-group">
                <span class="control-label">Base Dye</span>
                <div class="swatch active" data-color="indigo" style="background-color: #1a2b42;" title="Ai (Indigo)"></div>
                <div class="swatch" data-color="brown" style="background-color: #3e2723;" title="Chairo (Brown)"></div>
                <div class="swatch" data-color="black" style="background-color: #111111;" title="Kuro (Black)"></div>
            </div>
            
            <div style="width: 1px; height: 20px; background: rgba(255,255,255,0.15);"></div>

            <div class="control-group">
                <button id="toggle-pattern" class="toggle-btn active">
                    Show Pattern
                </button>
            </div>
        </div>
    </div>

    <!-- Main Stage -->
    <div class="stage">
        <!-- 
            SVG Canvas: 800x1100 for elegant proportions.
            ViewBox centered.
        -->
        <svg class="kimono-svg" viewBox="0 0 800 1100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 1. Fabric Sheen (Silk Gradient) - Softer transition -->
                <linearGradient id="kimono-body-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--k-dark);stop-opacity:1" />
                    <stop offset="20%" style="stop-color:var(--k-base);stop-opacity:1" />
                    <stop offset="50%" style="stop-color:var(--k-sheen);stop-opacity:1" /> <!-- Highlight -->
                    <stop offset="80%" style="stop-color:var(--k-base);stop-opacity:1" />
                    <stop offset="100%" style="stop-color:var(--k-dark);stop-opacity:1" />
                </linearGradient>

                <!-- Sleeve Gradient (Vertical drape) -->
                <linearGradient id="sleeve-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--k-dark);stop-opacity:1" />
                    <stop offset="40%" style="stop-color:var(--k-base);stop-opacity:1" />
                    <stop offset="100%" style="stop-color:var(--k-sheen);stop-opacity:0.8" />
                </linearGradient>

                <!-- Obi Gradient (Horizontal) -->
                <linearGradient id="obi-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--o-dark);stop-opacity:1" />
                    <stop offset="40%" style="stop-color:var(--o-light);stop-opacity:1" />
                    <stop offset="60%" style="stop-color:var(--o-light);stop-opacity:1" />
                    <stop offset="100%" style="stop-color:var(--o-dark);stop-opacity:1" />
                </linearGradient>

                <!-- 2. The Pattern: Stylized Fern (Washi) -->
                <pattern id="pattern-fern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                    <rect width="100" height="100" fill="transparent" />
                    
                    <g stroke="var(--accent-gold)" fill="none" opacity="0.7">
                        <!-- Main Stem -->
                        <path d="M50,0 L50,100" stroke-width="1" />
                        
                        <!-- Left Fronds -->
                        <path d="M50,20 Q20,10 10,30 Q25,35 50,20" stroke-width="1.2"/>
                        <path d="M50,50 Q20,40 10,60 Q25,65 50,50" stroke-width="1.2"/>
                        <path d="M50,80 Q20,70 10,90 Q25,95 50,80" stroke-width="1.2"/>
                        
                        <!-- Right Fronds -->
                        <path d="M50,20 Q80,10 90,30 Q75,35 50,20" stroke-width="1.2"/>
                        <path d="M50,50 Q80,40 90,60 Q75,65 50,50" stroke-width="1.2"/>
                        <path d="M50,80 Q80,70 90,90 Q75,95 50,80" stroke-width="1.2"/>
                    </g>
                    
                    <!-- Gold Dust (Maki-e effect) -->
                    <circle cx="30" cy="40" r="1.5" fill="var(--accent-gold)" opacity="0.5"/>
                    <circle cx="70" cy="70" r="2" fill="var(--accent-gold)" opacity="0.5"/>
                    <circle cx="50" cy="90" r="1" fill="var(--accent-gold)" opacity="0.5"/>
                </pattern>

                <!-- Obi Pattern (Geometric) -->
                <pattern id="pattern-obi" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                    <rect width="20" height="20" fill="transparent"/>
                    <path d="M0,10 L20,10 M10,0 L10,20" stroke="#000" stroke-width="0.5" opacity="0.3"/>
                    <path d="M0,0 L20,20 M20,0 L0,20" stroke="var(--accent-gold)" stroke-width="0.5" opacity="0.2"/>
                </pattern>

                <!-- 3. Lighting Mask (Simulates depth/folds) -->
                <!-- Dark edges, lighter center -->
                <linearGradient id="lighting-mask-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:black;stop-opacity:0.6" />
                    <stop offset="25%" style="stop-color:white;stop-opacity:0.1" />
                    <stop offset="50%" style="stop-color:white;stop-opacity:0.4" /> <!-- Highlight -->
                    <stop offset="75%" style="stop-color:white;stop-opacity:0.1" />
                    <stop offset="100%" style="stop-color:black;stop-opacity:0.6" />
                </linearGradient>

                <!-- Mask for the pattern to respect lighting -->
                <mask id="lighting-mask">
                    <rect x="-300" y="-400" width="600" height="1000" fill="url(#lighting-mask-grad)" />
                </mask>

                <!-- Shadow Filter for Depth -->
                <filter id="inner-shadow">
                    <feOffset dx="0" dy="0"/>
                    <feGaussianBlur stdDeviation="5" result="offset-blur"/>
                    <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                    <feFlood flood-color="black" flood-opacity="0.5" result="color"/>
                    <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                    <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
                </filter>

                <!-- Soft Drop Shadow for Collar -->
                <filter id="drop-shadow-sm">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
                    <feOffset dx="0" dy="4" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.5"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>
            </defs>

            <!-- GROUP: Centered in ViewBox -->
            <g id="kimono-group" transform="translate(400, 550)">
                
                <!-- LEFT SLEEVE (Sode) -->
                <g id="left-sleeve">
                    <!-- Sleeve Base -->
                    <path d="M-90,-320 C-90,-380 -220,-380 -220,-320 L-220,180 C-220,200 -210,200 -210,180 L-210,-310 L-90,-310 Z" 
                          fill="url(#sleeve-grad)" />
                    
                    <!-- Pattern Layer (Masked for lighting depth) -->
                    <path d="M-90,-320 C-90,-380 -220,-380 -220,-320 L-220,180 C-220,200 -210,200 -210,180 L-210,-310 L-90,-310 Z" 
                          fill="url(#pattern-fern)" class="pattern-layer" />
                    
                    <!-- Sleeve Folds (Soft Gradients instead of lines) -->
                    <path d="M-200,-350 Q-180,-200 -180,150" stroke="rgba(0,0,0,0.15)" stroke-width="4" fill="none" filter="blur(1px)"/>
                    
                    <!-- Sleeve Cuff (Katabira) - Tapered -->
                    <path d="M-220,-380 L-210,-380 L-205,180 L-215,180 Z" fill="#fdfbf7" /> 
                </g>

                <!-- LEFT SKIRT (Suso) -->
                <path d="M-80,-320 L-80,500 Q-80,540 -100,540 L-220,540 Q-200,520 -180,-320 Z" fill="url(#kimono-body-grad)" />
                <path d="M-80,-320 L-80,500 Q-80,540 -100,540 L-220,540 Q-200,520 -180,-320 Z" fill="url(#pattern-fern)" class="pattern-layer" />

                <!-- RIGHT SKIRT (Suso) -->
                <path d="M80,-320 L80,500 Q80,540 100,540 L220,540 Q200,520 180,-320 Z" fill="url(#kimono-body-grad)" />
                <path d="M80,-320 L80,500 Q80,540 100,540 L220,540 Q200,520 180,-320 Z" fill="url(#pattern-fern)" class="pattern-layer" />

                <!-- RIGHT SLEEVE (Sode) -->
                <g id="right-sleeve">
                    <!-- Sleeve Base -->
                    <path d="M90,-320 C90,-380 220,-380 220,-320 L220,180 C220,200 210,200 210,180 L210,-310 L90,-310 Z" 
                          fill="url(#sleeve-grad)" />
                    
                    <!-- Pattern Layer -->
                    <path d="M90,-320 C90,-380 220,-380 220,-320 L220,180 C220,200 210,200 210,180 L210,-310 L90,-310 Z" 
                          fill="url(#pattern-fern)" class="pattern-layer" />
                    
                    <!-- Sleeve Folds -->
                    <path d="M200,-350 Q180,-200 180,150" stroke="rgba(0,0,0,0.15)" stroke-width="4" fill="none" filter="blur(1px)"/>
                    
                    <!-- Sleeve Cuff -->
                    <path d="M220,-380 L210,-380 L205,180 L215,180 Z" fill="#fdfbf7" />
                </g>

                <!-- MAIN BODY / TORSO -->
                <path d="M-80,-320 L80,-320 L80,540 L-80,540 Z" fill="url(#kimono-body-grad)" />
                <!-- Apply mask to pattern here to simulate body curvature lighting -->
                <g mask="url(#lighting-mask)">
                    <path d="M-80,-320 L80,-320 L80,540 L-80,540 Z" fill="url(#pattern-fern)" class="pattern-layer" />
                </g>

                <!-- 3. The Collar (Eri) - Refined -->
                <g filter="url(#drop-shadow-sm)">
                    <!-- Under Collar (Right side tucked in) -->
                    <path d="M70,-320 Q35,-300 0,-280 L0,-260 Q40,-280 80,-320 Z" fill="#fdfbf7" />
                    
                    <!-- Outer Collar (Left side over right) -->
                    <path d="M-70,-320 Q-35,-300 0,-280 L0,450 Q-5,450 -10,450 L-10,-270 Q-40,-290 -80,-320 Z" fill="#fdfbf7" />
                </g>
                
                <!-- Gold Trim on Collar (Fuki-e) -->
                <path d="M-68,-318 Q-34,-298 0,-278" stroke="var(--accent-gold)" stroke-width="1.5" fill="none" opacity="0.8" />

                <!-- 4. The Obi (Sash) - Redesigned for Structure -->
                <g id="obi-group" transform="translate(0, 40)">
                    
                    <!-- Obi Main Band (Front) - Slight curve for waist -->
                    <path d="M-85,0 Q0,5 85,0 L85,100 Q0,105 -85,100 Z" fill="url(#obi-grad)" />
                    <path d="M-85,0 Q0,5 85,0 L85,100 Q0,105 -85,100 Z" fill="url(#pattern-obi)" class="pattern-layer" />
                    
                    <!-- Obi Folds (Vertical texture) - Subtle -->
                    <g stroke="var(--o-dark)" stroke-width="1.5" opacity="0.3">
                        <path d="M-70,0 L-70,100" />
                        <path d="M-50,0 L-50,100" />
                        <path d="M-30,0 L-30,100" />
                        <path d="M-10,0 L-10,100" />
                        <path d="M10,0 L10,100" />
                        <path d="M30,0 L30,100" />
                        <path d="M50,0 L50,100" />
                        <path d="M70,0 L70,100" />
                    </g>
                    
                    <!-- Obi Edge (Oro) -->
                    <path d="M-85,0 Q0,5 85,0" stroke="var(--accent-gold)" stroke-width="2" fill="none" />
                    <path d="M-85,100 Q0,105 85,100" stroke="var(--accent-gold)" stroke-width="2" fill="none" />

                    <!-- 5. The Knot (Musubi) - Taige Style (Traditional Butterfly) -->
                    <g transform="translate(0, 50)">
                        <!-- Top Loop (Structured) -->
                        <path d="M-45,-10 C-45,-60 45,-60 45,-10 L45,20 C25,10 0,10 -25,20 Z" fill="url(#obi-grad)" filter="url(#inner-shadow)"/>
                        <path d="M-45,-10 C-45,-60 45,-60 45,-10 L45,20 C25,10 0,10 -25,20 Z" fill="url(#pattern-obi)" class="pattern-layer" />
                        
                        <!-- Bottom Loop (Dangling) -->
                        <path d="M-35,20 C-35,90 35,90 35,20 L35,-10 L-35,-10 Z" fill="url(#obi-grad)" />
                        <path d="M-35,20 C-35,90 35,90 35,20 L35,-10 L-35,-10 Z" fill="url(#pattern-obi)" class="pattern-layer" />
                        
                        <!-- Knot Details (Folds) -->
                        <path d="M-20,-10 L0,50 L20,-10" stroke="var(--o-dark)" stroke-width="1" fill="none" opacity="0.6" />
                        
                        <!-- Gold Accents on Knot -->
                        <path d="M-40,-10 L40,-10" stroke="var(--accent-gold)" stroke-width="1.5" fill="none" />
                        <path d="M-30,20 L30,20" stroke="var(--accent-gold)" stroke-width="1.5" fill="none" />
                    </g>
                </g>

                <!-- 6. Hem Folds (Suriage) - Soft Shadows -->
                <path d="M-200,450 Q-100,480 0,460 T200,450" stroke="rgba(0,0,0,0.3)" stroke-width="4" fill="none" filter="blur(3px)"/>
                <path d="M-190,470 Q-100,500 0,480 T190,470" stroke="rgba(0,0,0,0.2)" stroke-width="2" fill="none" />

            </g>
        </svg>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const stage = document.querySelector('.kimono-svg');
            const root = document.documentElement;
            const swatches = document.querySelectorAll('.swatch');
            const toggleBtn = document.getElementById('toggle-pattern');
            const patternLayers = document.querySelectorAll('.pattern-layer');
            
            let patternVisible = true;

            // 1. Subtle 3D Tilt Effect
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth / 2 - e.clientX) / 80;
                const y = (window.innerHeight / 2 - e.clientY) / 80;
                stage.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
            });

            // 2. Color Logic
            const palettes = {
                'indigo': { 
                    base: '#1a2b42', dark: '#0d1621', light: '#263b57', sheen: '#3e5a82',
                    obiBase: '#8a2424', obiDark: '#5e1212', obiLight: '#b33636' 
                },
                'brown': { 
                    base: '#3e2723', dark: '#251512', light: '#5d4037', sheen: '#795548',
                    obiBase: '#d4af37', obiDark: '#b8962e', obiLight: '#f0c94b' // Gold Obi
                },
                'black': { 
                    base: '#1a1a1a', dark: '#000000', light: '#2a2a2a', sheen: '#444444',
                    obiBase: '#8a2424', obiDark: '#5e1212', obiLight: '#b33636' 
                }
            };

            swatches.forEach(swatch => {
                swatch.addEventListener('click', () => {
                    swatches.forEach(s => s.classList.remove('active'));
                    swatch.classList.add('active');

                    const colorKey = swatch.getAttribute('data-color');
                    const p = palettes[colorKey];

                    // Smooth transition via CSS variables
                    root.style.setProperty('--k-base', p.base);
                    root.style.setProperty('--k-dark', p.dark);
                    root.style.setProperty('--k-light', p.light);
                    root.style.setProperty('--k-sheen', p.sheen);
                    
                    root.style.setProperty('--o-base', p.obiBase);
                    root.style.setProperty('--o-dark', p.obiDark);
                    root.style.setProperty('--o-light', p.obiLight);
                });
            });

            // 3. Pattern Toggle
            toggleBtn.addEventListener('click', () => {
                patternVisible = !patternVisible;
                
                // Toggle class for active state styling
                if(patternVisible) {
                    toggleBtn.classList.add('active');
                    toggleBtn.textContent = "Show Pattern";
                } else {
                    toggleBtn.classList.remove('active');
                    toggleBtn.textContent = "Hide Pattern";
                }

                patternLayers.forEach(path => {
                    path.style.transition = "opacity 0.5s ease";
                    path.style.opacity = patternVisible ? "1" : "0";
                });
            });
        });
    </script>
</body>
</html>
