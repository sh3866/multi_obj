<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WABI-SABI | The Autumn Fern Kimono</title>
    <style>
        :root {
            /* Palette: Restrained, Earthy, Traditional */
            --bg-color: #e6e2d8; /* Washi Paper */
            --text-primary: #2c2c2c; /* Sumi Ink */
            --text-secondary: #6e6e6e;
            --accent-red: #8a3324; /* Benizari / Cinnabar */
            
            /* Kimono Variables (Default: Deep Indigo) */
            --k-base: #1c2e38;
            --k-dark: #0f181e;
            --k-light: #2a404d;
            --k-sheen: #4a606d;
            
            /* Obi Variables */
            --o-base: #8a3324;
            --o-dark: #5e2218;
            --o-light: #a84636;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: "Georgia", "Times New Roman", serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Grain Texture for Washi Paper feel */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        /* Layout Grid */
        .layout-grid {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: 250px 1fr 250px;
            grid-template-rows: 80px 1fr 100px;
            height: 100%;
            width: 100%;
            padding: 2rem;
        }

        /* Header */
        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(44, 44, 44, 0.1);
        }

        .brand {
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .brand-sub {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-left: 1rem;
            font-weight: normal;
            text-transform: none;
        }

        /* Vertical Typography (Japanese Style) */
        .vertical-col {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            line-height: 2;
            color: var(--text-secondary);
            max-height: 300px;
        }

        /* Main Stage */
        main {
            grid-column: 2 / 3;
            grid-row: 2 / 3;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* SVG Styling */
        .kimono-svg {
            height: 90%;
            width: auto;
            filter: drop-shadow(0 25px 40px rgba(0,0,0,0.12));
            transition: transform 0.15s ease-out;
        }

        /* Controls */
        .controls {
            position: absolute;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1.5rem;
            background: rgba(230, 226, 216, 0.9);
            padding: 0.8rem 2rem;
            border: 1px solid rgba(44, 44, 44, 0.1);
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .control-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
        }

        .swatch {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        
        .swatch:hover { transform: scale(1.1); }
        .swatch.active { border: 1px solid var(--text-primary); box-shadow: 0 0 0 2px var(--bg-color); }

        /* Footer Info */
        .info-panel {
            grid-column: 3 / 4;
            grid-row: 2 / 3;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-right: 1rem;
            text-align: right;
        }

        .info-title {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            font-weight: normal;
        }

        .info-desc {
            font-size: 0.8rem;
            line-height: 1.6;
            color: var(--text-secondary);
            max-width: 200px;
            margin-left: auto;
        }

        /* Mobile Adjustments */
        @media (max-width: 900px) {
            .layout-grid {
                grid-template-columns: 1fr;
                grid-template-rows: 60px 1fr auto;
                padding: 1rem;
            }
            .vertical-col, .info-panel { display: none; }
            header { border-bottom: none; }
            .controls { bottom: 1rem; width: 90%; justify-content: center; }
            .kimono-svg { height: 65vh; }
        }
    </style>
</head>
<body>

    <div class="layout-grid">
        <header>
            <div class="brand">
                和服 <span style="font-weight:normal; opacity:0.6">KIMONO</span>
                <span class="brand-sub">Digital Archive</span>
            </div>
            <div class="vertical-text">
                秋のフジ / AUTUMN FERN / 2024 COLLECTION
            </div>
        </header>

        <div class="vertical-col">
            <!-- Decorative vertical line -->
            <div style="width:1px; height: 100px; background: rgba(44,44,44,0.1); margin-bottom: 20px;"></div>
            <div class="vertical-text">
                伝統的工芸品
            </div>
        </div>

        <main>
            <!-- SVG Canvas Extended for Full Length -->
            <svg class="kimono-svg" viewBox="0 0 600 1100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- 1. Gradients for Fabric Sheen (Silk Simulation) -->
                    <linearGradient id="kimono-body-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:var(--k-dark);stop-opacity:1" />
                        <stop offset="20%" style="stop-color:var(--k-base);stop-opacity:1" />
                        <stop offset="50%" style="stop-color:var(--k-sheen);stop-opacity:1" /> <!-- Sheen -->
                        <stop offset="80%" style="stop-color:var(--k-base);stop-opacity:1" />
                        <stop offset="100%" style="stop-color:var(--k-dark);stop-opacity:1" />
                    </linearGradient>

                    <linearGradient id="obi-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:var(--o-dark);stop-opacity:1" />
                        <stop offset="30%" style="stop-color:var(--o-light);stop-opacity:1" />
                        <stop offset="70%" style="stop-color:var(--o-light);stop-opacity:1" />
                        <stop offset="100%" style="stop-color:var(--o-dark);stop-opacity:1" />
                    </linearGradient>

                    <!-- 2. Enhanced Pattern (Higher Contrast, Texture) -->
                    <pattern id="pattern-fern" x="0" y="0" width="80" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
                        <!-- Background Base -->
                        <rect width="80" height="120" fill="transparent" />
                        
                        <!-- Stylized Fern Motif (Kochi) -->
                        <g stroke="var(--k-light)" stroke-width="1.5" fill="none" opacity="0.4">
                            <path d="M40,10 C55,30 40,50 40,50" />
                            <path d="M40,10 C25,30 40,50 40,50" />
                            <path d="M40,50 C65,70 40,90 40,90" />
                            <path d="M40,50 C15,70 40,90 40,90" />
                            <path d="M40,90 C55,110 40,130 40,130" />
                            <path d="M40,90 C25,110 40,130 40,130" />
                            <!-- Leaflets -->
                            <path d="M40,20 L50,25 M40,20 L30,25" stroke-width="0.5"/>
                            <path d="M40,60 L60,65 M40,60 L20,65" stroke-width="0.5"/>
                            <path d="M40,100 L50,105 M40,100 L30,105" stroke-width="0.5"/>
                        </g>
                        <!-- Gold Accents (Yūzen Silk dots) -->
                        <circle cx="20" cy="30" r="1.5" fill="#d4af37" opacity="0.6"/>
                        <circle cx="60" cy="90" r="1.5" fill="#d4af37" opacity="0.6"/>
                        <circle cx="40" cy="110" r="1" fill="#d4af37" opacity="0.4"/>
                    </pattern>

                    <!-- Obi Pattern -->
                    <pattern id="pattern-obi" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
                        <rect width="30" height="30" fill="transparent"/>
                        <path d="M0,15 L30,15 M15,0 L15,30" stroke="#5e2218" stroke-width="1" opacity="0.3"/>
                        <circle cx="15" cy="15" r="2" fill="none" stroke="#5e2218" stroke-width="0.5" opacity="0.5"/>
                    </pattern>

                    <!-- 3. Fold Shadow Gradient -->
                    <linearGradient id="fold-shadow" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:rgba(0,0,0,0.6)" />
                        <stop offset="50%" style="stop-color:rgba(0,0,0,0)" />
                        <stop offset="100%" style="stop-color:rgba(0,0,0,0.6)" />
                    </linearGradient>
                </defs>

                <g id="kimono-group" transform="translate(300, 550)">
                    
                    <!-- LEFT SLEEVE (Tate-sode) -->
                    <g transform="rotate(12)">
                        <path d="M-70,-280 L-200,-280 L-200,150 L-70,150 Z" fill="url(#kimono-body-grad)" />
                        <path d="M-70,-280 L-200,-280 L-200,150 L-70,150 Z" fill="url(#pattern-fern)" />
                        <!-- Sleeve Cuff Shadow -->
                        <path d="M-195,-280 L-195,150 L-185,150 L-185,-280 Z" fill="rgba(0,0,0,0.3)" />
                    </g>

                    <!-- LEFT SKIRT PANEL -->
                    <path d="M-60,-280 L-60,450 Q-70,480 -90,480 L-160,480 Q-150,450 -140,-280 Z" fill="url(#kimono-body-grad)" />
                    <path d="M-60,-280 L-60,450 Q-70,480 -90,480 L-160,480 Q-150,450 -140,-280 Z" fill="url(#pattern-fern)" />

                    <!-- RIGHT SKIRT PANEL -->
                    <path d="M60,-280 L60,450 Q70,480 90,480 L160,480 Q150,450 140,-280 Z" fill="url(#kimono-body-grad)" />
                    <path d="M60,-280 L60,450 Q70,480 90,480 L160,480 Q150,450 140,-280 Z" fill="url(#pattern-fern)" />

                    <!-- RIGHT SLEEVE (Tate-sode) -->
                    <g transform="rotate(-12)">
                        <path d="M70,-280 L200,-280 L200,150 L70,150 Z" fill="url(#kimono-body-grad)" />
                        <path d="M70,-280 L200,-280 L200,150 L70,150 Z" fill="url(#pattern-fern)" />
                        <!-- Sleeve Cuff Shadow -->
                        <path d="M185,-280 L185,150 L195,150 L195,-280 Z" fill="rgba(0,0,0,0.3)" />
                    </g>

                    <!-- MAIN BODY / TORSO -->
                    <path d="M-60,-280 L60,-280 L60,480 L-60,480 Z" fill="url(#kimono-body-grad)" />
                    <path d="M-60,-280 L60,-280 L60,480 L-60,480 Z" fill="url(#pattern-fern)" />

                    <!-- 4. Realistic Folds (Overlapping Paths) -->
                    <!-- Center Seam Shadow -->
                    <path d="M-2,-280 L-2,480" stroke="rgba(0,0,0,0.4)" stroke-width="3" opacity="0.5" filter="blur(1px)"/>
                    
                    <!-- Hem Folds -->
                    <path d="M-150,400 Q-100,420 -60,400" stroke="rgba(0,0,0,0.3)" stroke-width="2" fill="none" />
                    <path d="M150,400 Q100,420 60,400" stroke="rgba(0,0,0,0.3)" stroke-width="2" fill="none" />

                    <!-- 5. Collar (Eri) - Layered Depth -->
                    <!-- Outer Left Collar -->
                    <path d="M-55,-290 Q-20,-270 0,-250 L0,350 Q-5,350 -10,350 L-10,-250 Q-30,-270 -60,-290 Z" fill="#fdfbf7" />
                    <!-- Outer Right Collar (Peeking out) -->
                    <path d="M55,-290 Q20,-270 0,-250 L0,-230 Q25,-250 60,-290 Z" fill="#fdfbf7" />
                    
                    <!-- Inner Collar (Darker edge for depth) -->
                    <path d="M-52,-288 Q-18,-268 0,-248 L0,348 Q-7,348 -12,348 L-12,-248 Q-32,-268 -58,-288 Z" fill="var(--k-dark)" opacity="0.3" />

                    <!-- 6. The Obi (Sash) - Layered & Textured -->
                    <g transform="translate(0, 40)">
                        <!-- Main Obi Band -->
                        <path d="M-70,0 L70,0 L70,80 L-70,80 Z" fill="url(#obi-grad)" />
                        <path d="M-70,0 L70,0 L70,80 L-70,80 Z" fill="url(#pattern-obi)" />
                        
                        <!-- Obi Folds (Vertical lines) -->
                        <path d="M-60,0 L-60,80 M-40,0 L-40,80 M-20,0 L-20,80 M0,0 L0,80 M20,0 L20,80 M40,0 L40,80 M60,0 L60,80" stroke="var(--o-dark)" stroke-width="1" opacity="0.4" />

                        <!-- Obi Knot (Taige) Front -->
                        <g transform="translate(0, 40)">
                            <!-- Main Knot Shape -->
                            <path d="M-45,0 L45,0 L50,45 L0,55 L-50,45 Z" fill="url(#obi-grad)" />
                            <path d="M-45,0 L45,0 L50,45 L0,55 L-50,45 Z" fill="url(#pattern-obi)" />
                            
                            <!-- Knot Folds -->
                            <path d="M-45,0 L0,55 L45,0" stroke="var(--o-dark)" stroke-width="2" fill="none" opacity="0.5"/>
                            <path d="M-20,10 L0,45 M20,10 L0,45" stroke="var(--o-dark)" stroke-width="1" fill="none" opacity="0.4"/>
                            
                            <!-- Gold Trim -->
                            <path d="M-40,5 L40,5 L42,40 L0,48 L-42,40 Z" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.8"/>
                        </g>
                    </g>
                </g>
            </svg>
        </main>

        <div class="info-panel">
            <h3 class="info-title">Tomesode</h3>
            <p class="info-desc">
                A formal kimono worn by married women. The design features the "Autumn Fern" (Aki no Fuji) motif, hand-painted using the Yūzen technique.
            </p>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="control-group">
                <span class="control-label">Silk Dye</span>
                <div class="swatch active" data-color="indigo" style="background-color: #1c2e38;" title="Deep Indigo"></div>
                <div class="swatch" data-color="brown" style="background-color: #3e2723;" title="Dark Earth"></div>
                <div class="swatch" data-color="grey" style="background-color: #263238;" title="Blue Grey"></div>
            </div>
            <div class="control-group" style="border-left: 1px solid #ccc; padding-left: 1.5rem;">
                <button id="toggle-pattern" style="background:none; border:none; color:var(--text-primary); cursor:pointer; font-family:inherit; font-size:0.7rem; letter-spacing:0.05em; text-decoration:underline;">
                    Toggle Pattern
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const stage = document.querySelector('.kimono-svg');
            const root = document.documentElement;
            const swatches = document.querySelectorAll('.swatch');
            const togglePatternBtn = document.getElementById('toggle-pattern');
            const patternElements = document.querySelectorAll('[fill="url(#pattern-fern)"]');
            
            let patternVisible = true;

            // 1. Subtle Parallax
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth / 2 - e.clientX) / 80;
                const y = (window.innerHeight / 2 - e.clientY) / 80;
                stage.style.transform = `translate(${x}px, ${y}px)`;
            });

            // 2. Color Logic
            const palettes = {
                'indigo': { 
                    base: '#1c2e38', dark: '#0f181e', light: '#2a404d', sheen: '#4a606d',
                    obiBase: '#8a3324', obiDark: '#5e2218', obiLight: '#a84636' 
                },
                'brown': { 
                    base: '#3e2723', dark: '#251512', light: '#5d4037', sheen: '#795548',
                    obiBase: '#d4af37', obiDark: '#b8962e', obiLight: '#f0c94b' // Gold Obi for Brown
                },
                'grey': { 
                    base: '#263238', dark: '#151c21', light: '#37474f', sheen: '#546e7a',
                    obiBase: '#c62828', obiDark: '#8e0000', obiLight: '#e53935' // Red Obi for Grey
                }
            };

            swatches.forEach(swatch => {
                swatch.addEventListener('click', () => {
                    swatches.forEach(s => s.classList.remove('active'));
                    swatch.classList.add('active');

                    const colorKey = swatch.getAttribute('data-color');
                    const p = palettes[colorKey];

                    root.style.setProperty('--k-base', p.base);
                    root.style.setProperty('--k-dark', p.dark);
                    root.style.setProperty('--k-light', p.light);
                    root.style.setProperty('--k-sheen', p.sheen);
                    
                    root.style.setProperty('--o-base', p.obiBase);
                    root.style.setProperty('--o-dark', p.obiDark);
                    root.style.setProperty('--o-light', p.obiLight);
                });
            });

            // 3. Pattern Toggle
            togglePatternBtn.addEventListener('click', () => {
                patternVisible = !patternVisible;
                
                // Toggle visibility of the pattern overlay layer in the SVG
                // We select the paths that use the pattern fill
                const patternPaths = document.querySelectorAll('path[fill="url(#pattern-fern)"]');
                
                patternPaths.forEach(path => {
                    if(patternVisible) {
                        path.style.opacity = "1";
                    } else {
                        path.style.opacity = "0";
                    }
                });
            });
        });
    </script>
</body>
</html>
