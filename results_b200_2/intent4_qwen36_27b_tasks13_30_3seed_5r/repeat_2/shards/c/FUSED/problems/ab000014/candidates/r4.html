<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秋の文様 | Autumn Kimono Collection</title>
    <style>
        :root {
            /* Palette: Deep Indigo & Gold */
            --bg-deep: #0a0f14;
            --bg-gradient: radial-gradient(ellipse at 50% 30%, #1a2530 0%, #05080a 100%);
            
            --text-primary: #e0e0e0;
            --text-secondary: #8b9bb4;
            --accent-gold: #d4af37;
            --accent-gold-dim: #8a7020;
            
            /* Kimono Variables (Indigo Silk) */
            --k-base: #1a2b42;
            --k-dark: #0d1621;
            --k-light: #263b57;
            --k-sheen: #3e5a82;
            
            /* Obi Variables (Cinnabar Red) */
            --o-base: #8a2424;
            --o-dark: #5e1212;
            --o-light: #b33636;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            background-image: var(--bg-gradient);
            color: var(--text-primary);
            font-family: "Hiragino Mincho ProN", "Yu Mincho", "Georgia", serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Subtle Washi Paper Texture */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.06'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
            opacity: 0.8;
        }

        /* UI Layer */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
        }

        /* Typography */
        .header-text {
            text-align: center;
            opacity: 0;
            animation: fadeIn 1.5s ease-out forwards 0.5s;
        }

        .kanji-title {
            font-size: 2.5rem;
            letter-spacing: 0.4em;
            margin-bottom: 0.8rem;
            color: var(--text-primary);
            font-weight: normal;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .latin-sub {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--accent-gold);
            opacity: 0.8;
        }

        /* Controls - Minimalist "Tag" Style */
        .controls-container {
            align-self: center;
            margin-bottom: 2rem;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            opacity: 0;
            animation: slideUp 1s ease-out forwards 1s;
        }

        .controls-tag {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            padding: 0.8rem 2rem;
            border-radius: 2px;
            display: flex;
            gap: 2rem;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .control-label {
            font-family: "Helvetica Neue", sans-serif;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-secondary);
            border-right: 1px solid rgba(255,255,255,0.1);
            padding-right: 1rem;
            margin-right: 0.5rem;
        }

        .swatch {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .swatch:hover { transform: scale(1.15); }
        
        .swatch.active { 
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .toggle-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-secondary);
            cursor: pointer;
            font-family: "Helvetica Neue", sans-serif;
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.4rem 1.2rem;
            transition: all 0.3s ease;
        }

        .toggle-btn:hover {
            color: #fff;
            border-color: #fff;
        }

        .toggle-btn.active {
            background: rgba(212, 175, 55, 0.15);
            color: var(--accent-gold);
            border-color: var(--accent-gold);
        }

        /* Stage */
        .stage {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1500px;
        }

        .kimono-svg {
            height: 92vh;
            width: auto;
            /* Subtle breathing animation */
            animation: breathe 6s ease-in-out infinite alternate;
            filter: drop-shadow(0 20px 50px rgba(0,0,0,0.6));
            transform-style: preserve-3d;
        }

        @keyframes breathe {
            0% { transform: scale(1) translateY(0); }
            100% { transform: scale(1.01) translateY(-5px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 0.9; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .kimono-svg { height: 80vh; }
            .kanji-title { font-size: 1.8rem; }
            .controls-tag { padding: 0.6rem 1rem; gap: 1rem; }
            .control-label { display: none; } /* Save space on mobile */
        }
    </style>
</head>
<body>

    <!-- UI Layer -->
    <div class="ui-layer">
        <div class="header-text">
            <h1 class="kanji-title">秋の文様</h1>
            <div class="latin-sub">Autumn Fern Collection</div>
        </div>

        <div class="controls-container">
            <div class="controls-tag">
                <div class="control-group">
                    <span class="control-label">Dye</span>
                    <div class="swatch active" data-color="indigo" style="background-color: #1a2b42;" title="Ai (Indigo)"></div>
                    <div class="swatch" data-color="brown" style="background-color: #3e2723;" title="Chairo (Brown)"></div>
                    <div class="swatch" data-color="black" style="background-color: #111111;" title="Kuro (Black)"></div>
                </div>
                
                <div class="control-group">
                    <button id="toggle-pattern" class="toggle-btn active">
                        Pattern
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Stage -->
    <div class="stage">
        <!-- 
            SVG Canvas: 800x1100
            Focus on geometric precision and fabric drape.
        -->
        <svg class="kimono-svg" viewBox="0 0 800 1100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 1. Fabric Gradients (Silk Luster) -->
                <!-- Body Gradient: Simulates cylindrical drape -->
                <linearGradient id="kimono-body-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--k-dark);stop-opacity:1" />
                    <stop offset="15%" style="stop-color:var(--k-base);stop-opacity:1" />
                    <stop offset="40%" style="stop-color:var(--k-sheen);stop-opacity:1" /> <!-- Highlight -->
                    <stop offset="60%" style="stop-color:var(--k-sheen);stop-opacity:0.8" />
                    <stop offset="85%" style="stop-color:var(--k-base);stop-opacity:1" />
                    <stop offset="100%" style="stop-color:var(--k-dark);stop-opacity:1" />
                </linearGradient>

                <!-- Sleeve Gradient: Simulates hanging T-shape -->
                <linearGradient id="sleeve-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--k-dark);stop-opacity:1" />
                    <stop offset="50%" style="stop-color:var(--k-sheen);stop-opacity:0.9" />
                    <stop offset="100%" style="stop-color:var(--k-dark);stop-opacity:1" />
                </linearGradient>

                <!-- Obi Gradient -->
                <linearGradient id="obi-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--o-dark);stop-opacity:1" />
                    <stop offset="30%" style="stop-color:var(--o-light);stop-opacity:1" />
                    <stop offset="70%" style="stop-color:var(--o-light);stop-opacity:1" />
                    <stop offset="100%" style="stop-color:var(--o-dark);stop-opacity:1" />
                </linearGradient>

                <!-- 2. Pattern: Autumn Fern (Washi) -->
                <pattern id="pattern-fern" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                    <rect width="120" height="120" fill="transparent" />
                    <g stroke="var(--accent-gold)" fill="none" opacity="0.6">
                        <!-- Stylized Fern Frond -->
                        <path d="M60,10 L60,110" stroke-width="1" opacity="0.5"/>
                        <path d="M60,30 Q30,20 20,40 Q35,50 60,30" stroke-width="1.5"/>
                        <path d="M60,60 Q30,50 20,70 Q35,80 60,60" stroke-width="1.5"/>
                        <path d="M60,90 Q30,80 20,100 Q35,110 60,90" stroke-width="1.5"/>
                        
                        <path d="M60,30 Q90,20 100,40 Q85,50 60,30" stroke-width="1.5"/>
                        <path d="M60,60 Q90,50 100,70 Q85,80 60,60" stroke-width="1.5"/>
                        <path d="M60,90 Q90,80 100,100 Q85,110 60,90" stroke-width="1.5"/>
                    </g>
                    <!-- Maki-e Gold Dust -->
                    <circle cx="60" cy="20" r="1.5" fill="var(--accent-gold)" opacity="0.6"/>
                    <circle cx="40" cy="55" r="1" fill="var(--accent-gold)" opacity="0.6"/>
                    <circle cx="80" cy="85" r="1" fill="var(--accent-gold)" opacity="0.6"/>
                </pattern>

                <!-- Obi Pattern -->
                <pattern id="pattern-obi" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
                    <rect width="30" height="30" fill="transparent"/>
                    <path d="M0,15 L30,15 M15,0 L15,30" stroke="#000" stroke-width="0.5" opacity="0.2"/>
                    <path d="M0,0 L30,30 M30,0 L0,30" stroke="var(--accent-gold)" stroke-width="0.5" opacity="0.3"/>
                </pattern>

                <!-- 3. Lighting & Shadows -->
                <!-- Vignette Mask for Pattern to fade in shadows -->
                <linearGradient id="lighting-mask-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:black;stop-opacity:0" />
                    <stop offset="15%" style="stop-color:white;stop-opacity:0.3" />
                    <stop offset="50%" style="stop-color:white;stop-opacity:0.7" />
                    <stop offset="85%" style="stop-color:white;stop-opacity:0.3" />
                    <stop offset="100%" style="stop-color:black;stop-opacity:0" />
                </linearGradient>
                <mask id="lighting-mask">
                    <rect x="-400" y="-500" width="800" height="1000" fill="url(#lighting-mask-grad)" />
                </mask>

                <!-- Drop Shadow for Collar -->
                <filter id="drop-shadow-sm">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
                    <feOffset dx="0" dy="3" result="offsetblur"/>
                    <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
                    <feMerge> <feMergeNode/> <feMergeNode in="SourceGraphic"/> </feMerge>
                </filter>

                <!-- Inner Shadow for Obi Knot -->
                <filter id="inner-shadow">
                    <feOffset dx="0" dy="0"/>
                    <feGaussianBlur stdDeviation="3" result="offset-blur"/>
                    <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                    <feFlood flood-color="black" flood-opacity="0.6" result="color"/>
                    <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                    <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
                </filter>
            </defs>

            <!-- GROUP: Centered -->
            <g id="kimono-group" transform="translate(400, 550)">
                
                <!-- ================= BACK / INSIDE LAYERS ================= -->
                
                <!-- Left Sleeve (Sode) - T-Shaped -->
                <g id="left-sleeve">
                    <!-- Main Sleeve Body -->
                    <path d="M-80,-280 L-260,-280 C-280,-280 -280,-260 -280,-240 L-280,180 C-280,200 -260,200 -260,180 L-260,-260 L-80,-260 Z" 
                          fill="url(#sleeve-grad)" />
                    
                    <!-- Pattern Layer -->
                    <path d="M-80,-280 L-260,-280 C-280,-280 -280,-260 -280,-240 L-280,180 C-280,200 -260,200 -260,180 L-260,-260 L-80,-260 Z" 
                          fill="url(#pattern-fern)" class="pattern-layer" />
                    
                    <!-- Sleeve Cuff (Katabira) -->
                    <path d="M-280,-280 L-270,-280 L-270,180 L-280,180 Z" fill="#fdfbf7" opacity="0.9"/>
                    
                    <!-- Drape Lines -->
                    <path d="M-250,-270 L-250,170" stroke="rgba(0,0,0,0.1)" stroke-width="2" fill="none" />
                </g>

                <!-- Right Sleeve (Sode) -->
                <g id="right-sleeve">
                    <path d="M80,-280 L260,-280 C280,-280 280,-260 280,-240 L280,180 C280,200 260,200 260,180 L260,-260 L80,-260 Z" 
                          fill="url(#sleeve-grad)" />
                    <path d="M80,-280 L260,-280 C280,-280 280,-260 280,-240 L280,180 C280,200 260,200 260,180 L260,-260 L80,-260 Z" 
                          fill="url(#pattern-fern)" class="pattern-layer" />
                    <path d="M280,-280 L270,-280 L270,180 L280,180 Z" fill="#fdfbf7" opacity="0.9"/>
                    <path d="M250,-270 L250,170" stroke="rgba(0,0,0,0.1)" stroke-width="2" fill="none" />
                </g>

                <!-- ================= FRONT LAYERS ================= -->

                <!-- Left Skirt (Suso) - Overlap -->
                <g id="left-skirt">
                    <path d="M-70,-280 L-70,500 Q-70,540 -90,540 L-220,540 Q-200,520 -180,-280 Z" fill="url(#kimono-body-grad)" />
                    <!-- Apply Lighting Mask to Pattern -->
                    <g mask="url(#lighting-mask)">
                        <path d="M-70,-280 L-70,500 Q-70,540 -90,540 L-220,540 Q-200,520 -180,-280 Z" fill="url(#pattern-fern)" class="pattern-layer" />
                    </g>
                </g>

                <!-- Right Skirt (Suso) - Underlap -->
                <g id="right-skirt">
                    <path d="M70,-280 L70,500 Q70,540 90,540 L220,540 Q200,520 180,-280 Z" fill="url(#kimono-body-grad)" />
                    <g mask="url(#lighting-mask)">
                        <path d="M70,-280 L70,500 Q70,540 90,540 L220,540 Q200,520 180,-280 Z" fill="url(#pattern-fern)" class="pattern-layer" />
                    </g>
                </g>

                <!-- Main Torso (Upper) -->
                <g id="torso">
                    <!-- Neckline Cutout Area (Simulated by layering) -->
                    <path d="M-70,-280 L70,-280 L70,-180 L-70,-180 Z" fill="url(#kimono-body-grad)" />
                    <g mask="url(#lighting-mask)">
                        <path d="M-70,-280 L70,-280 L70,-180 L-70,-180 Z" fill="url(#pattern-fern)" class="pattern-layer" />
                    </g>
                </g>

                <!-- ================= COLLAR (ERI) ================= -->
                <g filter="url(#drop-shadow-sm)">
                    <!-- Right Collar (Under) - Tucked in -->
                    <path d="M60,-280 Q30,-260 0,-240 L0,-220 Q35,-240 75,-280 Z" fill="#fdfbf7" />
                    
                    <!-- Left Collar (Over) - The 'Eri' -->
                    <!-- Curves naturally down the front opening -->
                    <path d="M-60,-280 Q-30,-260 0,-240 L0,450 Q-5,450 -10,450 L-10,-230 Q-35,-250 -80,-280 Z" fill="#fdfbf7" />
                </g>
                
                <!-- Collar Gold Trim -->
                <path d="M-58,-278 Q-29,-258 0,-238" stroke="var(--accent-gold)" stroke-width="1" fill="none" opacity="0.7" />

                <!-- ================= OBI (SASH) ================= -->
                <g id="obi-group" transform="translate(0, 40)">
                    
                    <!-- Obi Front Band (Wide, curved) -->
                    <path d="M-75,0 Q0,10 75,0 L75,120 Q0,130 -75,120 Z" fill="url(#obi-grad)" />
                    <path d="M-75,0 Q0,10 75,0 L75,120 Q0,130 -75,120 Z" fill="url(#pattern-obi)" class="pattern-layer" />
                    
                    <!-- Obi Folds (Vertical pleats) -->
                    <g stroke="var(--o-dark)" stroke-width="1" opacity="0.3">
                        <path d="M-60,0 L-60,120" /> <path d="M-40,0 L-40,120" />
                        <path d="M-20,0 L-20,120" /> <path d="M0,0 L0,120" />
                        <path d="M20,0 L20,120" /> <path d="M40,0 L40,120" />
                        <path d="M60,0 L60,120" />
                    </g>
                    
                    <!-- Obi Edges (Oro) -->
                    <path d="M-75,0 Q0,10 75,0" stroke="var(--accent-gold)" stroke-width="2" fill="none" />
                    <path d="M-75,120 Q0,130 75,120" stroke="var(--accent-gold)" stroke-width="2" fill="none" />

                    <!-- ================= KNOT (MUSUBI) - TAIGE STYLE ================= -->
                    <g transform="translate(0, 60)">
                        <!-- Top Loop (Butterfly Wing) -->
                        <path d="M-50,-10 C-50,-70 50,-70 50,-10 L50,20 C30,10 0,10 -30,20 Z" fill="url(#obi-grad)" filter="url(#inner-shadow)"/>
                        <path d="M-50,-10 C-50,-70 50,-70 50,-10 L50,20 C30,10 0,10 -30,20 Z" fill="url(#pattern-obi)" class="pattern-layer" />
                        
                        <!-- Bottom Loop (Dangling) -->
                        <path d="M-40,20 C-40,100 40,100 40,20 L40,-10 L-40,-10 Z" fill="url(#obi-grad)" />
                        <path d="M-40,20 C-40,100 40,100 40,20 L40,-10 L-40,-10 Z" fill="url(#pattern-obi)" class="pattern-layer" />
                        
                        <!-- Knot Details -->
                        <path d="M-25,-10 L0,50 L25,-10" stroke="var(--o-dark)" stroke-width="1" fill="none" opacity="0.5" />
                        
                        <!-- Gold Accents -->
                        <path d="M-45,-10 L45,-10" stroke="var(--accent-gold)" stroke-width="1.5" fill="none" />
                        <path d="M-35,20 L35,20" stroke="var(--accent-gold)" stroke-width="1.5" fill="none" />
                    </g>
                </g>

                <!-- ================= HEM DETAILS ================= -->
                <!-- Hem Folds (Suriage) -->
                <path d="M-200,480 Q-100,510 0,490 T200,480" stroke="rgba(0,0,0,0.4)" stroke-width="3" fill="none" filter="blur(2px)"/>
                <path d="M-210,500 Q-100,530 0,510 T210,500" stroke="rgba(0,0,0,0.2)" stroke-width="1" fill="none" />

            </g>
        </svg>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const stage = document.querySelector('.kimono-svg');
            const root = document.documentElement;
            const swatches = document.querySelectorAll('.swatch');
            const toggleBtn = document.getElementById('toggle-pattern');
            const patternLayers = document.querySelectorAll('.pattern-layer');
            
            let patternVisible = true;

            // 1. Subtle 3D Tilt Effect (Refined for smoother feel)
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth / 2 - e.clientX) / 100;
                const y = (window.innerHeight / 2 - e.clientY) / 100;
                // Apply rotation but preserve the breathing scale
                stage.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
            });

            // 2. Color Logic
            const palettes = {
                'indigo': { 
                    base: '#1a2b42', dark: '#0d1621', light: '#263b57', sheen: '#3e5a82',
                    obiBase: '#8a2424', obiDark: '#5e1212', obiLight: '#b33636' 
                },
                'brown': { 
                    base: '#3e2723', dark: '#251512', light: '#5d4037', sheen: '#795548',
                    obiBase: '#d4af37', obiDark: '#b8962e', obiLight: '#f0c94b' 
                },
                'black': { 
                    base: '#1a1a1a', dark: '#000000', light: '#2a2a2a', sheen: '#444444',
                    obiBase: '#8a2424', obiDark: '#5e1212', obiLight: '#b33636' 
                }
            };

            swatches.forEach(swatch => {
                swatch.addEventListener('click', () => {
                    swatches.forEach(s => s.classList.remove('active'));
                    swatch.classList.add('active');

                    const colorKey = swatch.getAttribute('data-color');
                    const p = palettes[colorKey];

                    // Smooth transition via CSS variables
                    root.style.setProperty('--k-base', p.base);
                    root.style.setProperty('--k-dark', p.dark);
                    root.style.setProperty('--k-light', p.light);
                    root.style.setProperty('--k-sheen', p.sheen);
                    
                    root.style.setProperty('--o-base', p.obiBase);
                    root.style.setProperty('--o-dark', p.obiDark);
                    root.style.setProperty('--o-light', p.obiLight);
                });
            });

            // 3. Pattern Toggle
            toggleBtn.addEventListener('click', () => {
                patternVisible = !patternVisible;
                
                if(patternVisible) {
                    toggleBtn.classList.add('active');
                } else {
                    toggleBtn.classList.remove('active');
                }

                patternLayers.forEach(path => {
                    path.style.transition = "opacity 0.5s ease";
                    path.style.opacity = patternVisible ? "1" : "0";
                });
            });
        });
    </script>
</body>
</html>
