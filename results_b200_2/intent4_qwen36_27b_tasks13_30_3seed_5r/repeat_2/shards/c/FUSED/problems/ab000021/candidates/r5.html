<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Architecture Topology</title>
<style>
    :root {
        /* Palette: Technical Deep Space */
        --bg-color: #0b0c10;
        --grid-color: rgba(255, 255, 255, 0.04); /* < 10% opacity */
        
        --panel-fill: #151922;
        --panel-stroke: #2e364a;
        
        --text-main: #E6EDF3;
        --text-muted: #7d8590;
        --text-accent: #58a6ff;

        /* Signal Colors: Neon Technical */
        --color-data: #00e5ff;       /* Cyan - Data */
        --color-instruction: #d500f9; /* Magenta - Instructions */
        --color-control: #00e676;    /* Green - Control */
        --color-io: #ffab00;         /* Amber - I/O Stream */

        /* Typography */
        --font-ui: system-ui, -apple-system, sans-serif;
        --font-mono: "SF Mono", "Menlo", "Monaco", "Consolas", "Courier New", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background-color: var(--bg-color);
        /* Faint Grid */
        background-image: 
            linear-gradient(var(--grid-color) 1px, transparent 1px),
            linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
        background-size: 30px 30px;
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* UI Overlay Layer */
    .ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 100;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 30px 40px;
    }

    /* Header & Legend Group */
    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        pointer-events: auto;
    }

    header {
        max-width: 400px;
    }

    h1 {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--text-main);
        margin-bottom: 0.25rem;
        font-family: var(--font-ui);
    }

    .subtitle {
        color: var(--text-muted);
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        border-left: 2px solid var(--color-data);
        padding-left: 10px;
    }

    /* Legend */
    .legend {
        display: flex;
        gap: 20px;
        background: rgba(21, 25, 34, 0.8);
        padding: 10px 20px;
        border: 1px solid var(--panel-stroke);
        border-radius: 4px;
        backdrop-filter: blur(4px);
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.65rem;
        font-weight: 600;
        color: var(--text-muted);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        font-family: var(--font-mono);
    }

    .legend-line {
        width: 20px;
        height: 2px;
        position: relative;
    }

    /* SVG Container */
    #diagram-container {
        flex: 1;
        width: 100%;
        position: relative;
        z-index: 10;
    }

    svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* Component Styles */
    .component-group {
        cursor: pointer;
        transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .component-group:hover {
        transform: translateY(-2px);
    }

    /* Standard Box */
    .comp-bg {
        fill: var(--panel-fill);
        stroke: var(--panel-stroke);
        stroke-width: 1px;
        rx: 4px;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }

    .component-group:hover .comp-bg {
        stroke: var(--text-muted);
        filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5));
    }

    /* CPU: Hierarchy emphasis */
    .cpu-bg {
        fill: #1a202c;
        stroke: var(--text-main);
        stroke-width: 2px;
        rx: 6px;
        filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.1));
    }
    
    /* Typography */
    .comp-label {
        fill: var(--text-main);
        font-size: 13px;
        font-weight: 700;
        text-anchor: middle;
        font-family: var(--font-ui);
        letter-spacing: 0.01em;
    }

    .comp-sub {
        fill: var(--text-muted);
        font-size: 9px;
        font-weight: 600;
        text-anchor: middle;
        font-family: var(--font-mono);
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }

    .comp-icon {
        stroke: var(--text-accent);
        stroke-width: 1.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.8;
    }

    /* Paths: Orthogonal & Bundled */
    .path-bg {
        fill: none;
        stroke-width: 2px;
        stroke-linejoin: miter;
        stroke-linecap: square;
        opacity: 0.2;
    }

    /* Particles */
    .particle {
        fill: none;
        stroke-width: 3px;
        stroke-linecap: round;
        stroke-linejoin: miter;
        filter: drop-shadow(0 0 4px currentColor);
    }

    /* Animation: Moving packets */
    @keyframes flow {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
    }

    .p-data { stroke: var(--color-data); stroke-dasharray: 10 90; animation: flow 1.5s linear infinite; }
    .p-instruction { stroke: var(--color-instruction); stroke-dasharray: 10 90; animation: flow 1.2s linear infinite; }
    .p-control { stroke: var(--color-control); stroke-dasharray: 4 96; animation: flow 2s linear infinite; }
    .p-io { stroke: var(--color-io); stroke-dasharray: 15 85; animation: flow 1.8s linear infinite; }

    /* Interactive States */
    .dimmed {
        opacity: 0.08;
        transition: opacity 0.2s ease;
        filter: grayscale(100%);
    }
    
    .highlight-group .path-bg {
        opacity: 0.8;
        stroke-width: 3px;
    }
    
    .path-label {
        fill: var(--text-muted);
        font-size: 9px;
        font-weight: 700;
        font-family: var(--font-mono);
        text-anchor: middle;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
    }
    
    .highlight-group .path-label {
        opacity: 1;
        fill: var(--text-main);
    }

</style>
</head>
<body>

    <div class="ui-layer">
        <div class="top-bar">
            <header>
                <h1>System Topology</h1>
                <div class="subtitle">Data & Control Flow Architecture</div>
            </header>

            <div class="legend">
                <div class="legend-item" style="color: var(--color-data)">
                    <div class="legend-line" style="background: var(--color-data)"></div>
                    <span>Data Bus</span>
                </div>
                <div class="legend-item" style="color: var(--color-instruction)">
                    <div class="legend-line" style="border-top: 2px dashed var(--color-instruction); height:0"></div>
                    <span>Instructions</span>
                </div>
                <div class="legend-item" style="color: var(--color-control)">
                    <div class="legend-line" style="border-top: 2px dotted var(--color-control); height:0"></div>
                    <span>Control</span>
                </div>
                <div class="legend-item" style="color: var(--color-io)">
                    <div class="legend-line" style="border-top: 2px solid var(--color-io); height:0"></div>
                    <span>I/O Stream</span>
                </div>
            </div>
        </div>
    </div>

    <div id="diagram-container">
        <svg id="main-svg" viewBox="0 0 1100 700" preserveAspectRatio="xMidYMid meet">
            <defs>
                <!-- Arrowhead Markers -->
                <marker id="arrow-data" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-data)" />
                </marker>
                <marker id="arrow-instruction" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-instruction)" />
                </marker>
                <marker id="arrow-control" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-control)" />
                </marker>
                <marker id="arrow-io" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-io)" />
                </marker>
            </defs>
            
            <g id="paths-layer"></g>
            <g id="particles-layer"></g>
            <g id="components-layer"></g>
        </svg>
    </div>

<script>
    const svg = document.getElementById('main-svg');
    const pathsLayer = document.getElementById('paths-layer');
    const particlesLayer = document.getElementById('particles-layer');
    const componentsLayer = document.getElementById('components-layer');

    const createSVG = (tag, attrs) => {
        const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
        return el;
    };

    // --- Configuration ---
    // Layout: Central Cluster (Core) vs Peripheral Ring
    const components = [
        // CORE
        { id: 'cpu', label: 'CPU', sub: 'Central Unit', x: 550, y: 350, w: 140, h: 100, type: 'cpu', icon: 'cpu' },
        { id: 'ram', label: 'Memory', sub: 'High Speed RAM', x: 550, y: 180, w: 120, h: 70, type: 'standard', icon: 'ram' },
        { id: 'gpu', label: 'GPU', sub: 'Graphics Cluster', x: 820, y: 350, w: 120, h: 70, type: 'standard', icon: 'gpu' },
        { id: 'storage', label: 'Storage', sub: 'NVMe SSD', x: 550, y: 520, w: 120, h: 70, type: 'standard', icon: 'hdd' },
        
        // PERIPHERALS
        { id: 'input', label: 'Input', sub: 'Keyboard / Mouse', x: 250, y: 220, w: 110, h: 70, type: 'standard', icon: 'mouse' },
        { id: 'output', label: 'Output', sub: 'Display / Audio', x: 250, y: 480, w: 110, h: 70, type: 'standard', icon: 'monitor' },
        { id: 'network', label: 'Network', sub: 'Ethernet / Wi-Fi', x: 820, y: 550, w: 110, h: 70, type: 'standard', icon: 'wifi' }
    ];

    // Connections
    const connections = [
        // CPU <-> Memory
        { from: 'ram', to: 'cpu', type: 'instruction', label: 'Fetch' },
        { from: 'cpu', to: 'ram', type: 'data', label: 'Store' },
        
        // CPU <-> GPU
        { from: 'cpu', to: 'gpu', type: 'instruction', label: 'Render' },
        { from: 'gpu', to: 'cpu', type: 'data', label: 'Result' },

        // Storage <-> RAM
        { from: 'storage', to: 'ram', type: 'data', label: 'Load' },
        { from: 'ram', to: 'storage', type: 'data', label: 'Write' },

        // Input/Output (I/O + Control) - Bundled
        { from: 'input', to: 'cpu', type: 'io', label: 'Events', bundle: 'io-bundle-1' },
        { from: 'cpu', to: 'input', type: 'control', label: 'Poll', bundle: 'io-bundle-1' },
        
        { from: 'cpu', to: 'output', type: 'io', label: 'Stream', bundle: 'io-bundle-2' },
        { from: 'output', to: 'cpu', type: 'control', label: 'Sync', bundle: 'io-bundle-2' },

        // Network
        { from: 'network', to: 'cpu', type: 'data', label: 'Inbound' },
        { from: 'cpu', to: 'network', type: 'data', label: 'Outbound' },
    ];

    // --- Icons ---
    const drawIcon = (id, x, y) => {
        let g = createSVG('g', { transform: `translate(${x}, ${y})` });
        let pathData = "";
        
        // Technical line icons
        if(id === 'cpu') {
            pathData = "M4 4h16v16H4zM9 9h6v6H9zM12 1v3M12 20v3M1 12h3M20 12h3";
        } else if (id === 'ram') {
            pathData = "M4 4h16v16H4zM4 8h16M4 12h16M4 16h16";
        } else if (id === 'gpu') {
            pathData = "M4 4h16v16H4zM8 12l2-2 2 2 2-2"; 
        } else if (id === 'hdd') {
            pathData = "M4 4h16v16H4zM12 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4z";
        } else if (id === 'mouse') {
            pathData = "M9 4h6a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM12 8v4";
        } else if (id === 'monitor') {
            pathData = "M4 4h16v10H4zM9 18h6M12 14v4";
        } else if (id === 'wifi') {
            pathData = "M12 18v-2M8 14a4 4 0 0 1 8 0M4 10a8 8 0 0 1 16 0";
        }

        g.appendChild(createSVG('path', { 
            d: pathData, 
            stroke: 'currentColor', 
            'stroke-width': 1.5, 
            fill: 'none',
            'stroke-linecap': 'round',
            'stroke-linejoin': 'round'
        }));
        return g;
    };

    // --- Render Components ---
    const compMap = {}; 

    components.forEach(c => {
        const g = createSVG('g', { 
            class: 'component-group', 
            transform: `translate(${c.x - c.w/2}, ${c.y - c.h/2})`,
            'data-id': c.id
        });

        // Box
        const rectClass = c.type === 'cpu' ? 'cpu-bg' : 'comp-bg';
        const rect = createSVG('rect', { 
            class: rectClass, 
            width: c.w, height: c.h 
        });
        
        // CPU Accents (Corners)
        if(c.type === 'cpu') {
            const accentSize = 6;
            // Top Left
            g.appendChild(createSVG('path', { d: `M2 ${accentSize} L2 2 L${accentSize} 2`, class: 'cpu-accent' }));
            // Top Right
            g.appendChild(createSVG('path', { d: `M${c.w-2} ${accentSize} L${c.w-2} 2 L${c.w-accentSize} 2`, class: 'cpu-accent' }));
            // Bottom Left
            g.appendChild(createSVG('path', { d: `M2 ${c.h-accentSize} L2 ${c.h} L${accentSize} ${c.h}`, class: 'cpu-accent' }));
            // Bottom Right
            g.appendChild(createSVG('path', { d: `M${c.w-2} ${c.h-accentSize} L${c.w-2} ${c.h} L${c.w-accentSize} ${c.h}`, class: 'cpu-accent' }));
        }

        // Icon
        const icon = drawIcon(c.icon, c.w/2 - 10, 16);
        icon.style.color = "var(--text-muted)"; 

        // Labels
        const textLabel = createSVG('text', { x: c.w/2, y: c.h - 24, class: 'comp-label' });
        textLabel.textContent = c.label;
        
        const textSub = createSVG('text', { x: c.w/2, y: c.h - 10, class: 'comp-sub' });
        textSub.textContent = c.sub;

        g.appendChild(rect);
        g.appendChild(icon);
        g.appendChild(textLabel);
        g.appendChild(textSub);
        
        componentsLayer.appendChild(g);
        compMap[c.id] = c;

        // Hover Logic
        g.addEventListener('mouseenter', () => highlightPath(c.id));
        g.addEventListener('mouseleave', () => resetHighlight());
    });

    // --- Render Paths (Orthogonal Logic) ---
    
    // Helper to find the best exit point on a rectangle for Manhattan routing
    const getManhattanEdge = (rect, targetX, targetY) => {
        const dx = targetX - rect.x;
        const dy = targetY - rect.y;
        
        // Simple logic: if mostly horizontal, use side; if mostly vertical, use top/bottom
        // To prevent overlap, we check the sign.
        // We add an offset to handle "bundles" (e.g. +5px or -5px)
        const offsetX = rect.w / 2;
        const offsetY = rect.h / 2;
        
        // Default center points
        let x = rect.x;
        let y = rect.y;
        let side = 'unknown'; // top, bottom, left, right

        // Determine primary axis
        if (Math.abs(dx) > Math.abs(dy)) {
            // Horizontal dominant
            if (dx > 0) { x = rect.x + offsetX; side = 'right'; }
            else { x = rect.x - offsetX; side = 'left'; }
        } else {
            // Vertical dominant
            if (dy > 0) { y = rect.y + offsetY; side = 'bottom'; }
            else { y = rect.y - offsetY; side = 'top'; }
        }
        
        // Special handling for bundles (Input/Output connections)
        // If it's an input/output connection, we force a slight offset based on type
        // This logic is simplified: we will apply the offset in the path generation
        return { x, y, side };
    };

    const getPathD = (c1, c2, type, bundleId) => {
        // Determine start and end points
        // For bundles, we manually tweak the start/end y to create parallel lines
        let start = getManhattanEdge(c1, c2.x, c2.y);
        let end = getManhattanEdge(c2, c1.x, c1.y);

        // Bundle Offset Logic
        // If it's a bundle connection, shift the start and end points slightly apart
        let offset = 0;
        if (bundleId === 'io-bundle-1') {
            // Input <-> CPU
            offset = (type === 'io') ? 8 : -8;
        } else if (bundleId === 'io-bundle-2') {
            // Output <-> CPU
            offset = (type === 'io') ? -8 : 8;
        }

        // Apply offset to Start Point
        if (start.side === 'top' || start.side === 'bottom') start.x += offset;
        else start.y += offset;

        // Apply offset to End Point
        // The offset direction depends on the side we are entering
        if (end.side === 'top' || end.side === 'bottom') end.x -= offset;
        else end.y -= offset;

        // Construct Manhattan Path (Right Angles)
        // Strategy: Exit -> Turn -> Midpoint -> Turn -> Enter
        // We calculate a "midpoint" in space that acts as the turning corner
        
        // If horizontal relationship
        let pathStr = "";
        
        // Determine if the main flow is horizontal or vertical
        if (Math.abs(c1.x - c2.x) > Math.abs(c1.y - c2.y)) {
            // Horizontal Flow (e.g. Input -> CPU)
            // M Start -> Horizontal to MidX -> Vertical to EndY -> Horizontal to End
            const midX = (start.x + end.x) / 2;
            pathStr = `M ${start.x} ${start.y} L ${midX} ${start.y} L ${midX} ${end.y} L ${end.x} ${end.y}`;
        } else {
            // Vertical Flow (e.g. RAM -> CPU)
            // M Start -> Vertical to MidY -> Horizontal to EndX -> Vertical to End
            const midY = (start.y + end.y) / 2;
            pathStr = `M ${start.x} ${start.y} L ${start.x} ${midY} L ${end.x} ${midY} L ${end.x} ${end.y}`;
        }

        return {
            d: pathStr,
            midX: (start.x + end.x) / 2,
            midY: (start.y + end.y) / 2
        };
    };

    // Line styles
    const getLineStyle = (type) => {
        switch(type) {
            case 'data': return 'none'; // Solid
            case 'instruction': return '6 4'; // Dashed
            case 'control': return '2 4'; // Dotted
            case 'io': return '10 4 2 4'; // Dash-Dot
            default: return 'none';
        }
    };

    const pathGroups = [];

    connections.forEach((conn, index) => {
        const start = compMap[conn.from];
        const end = compMap[conn.to];
        
        const g = createSVG('g', { 
            class: 'connection-group', 
            'data-from': conn.from, 
            'data-to': conn.to 
        });

        const pathData = getPathD(start, end, conn.type, conn.bundle);
        const trackColor = `var(--color-${conn.type})`;

        // 1. Hit Area
        const hitPath = createSVG('path', {
            d: pathData.d,
            class: 'path-bg-active',
            stroke: 'transparent',
            'stroke-width': '15' // Wide hit area for hover
        });

        // 2. Visible Track
        const visiblePath = createSVG('path', {
            d: pathData.d,
            class: 'path-bg',
            stroke: trackColor,
            'stroke-dasharray': getLineStyle(conn.type),
            'marker-end': `url(#arrow-${conn.type})`
        });

        // 3. Particle
        const particle = createSVG('path', {
            d: pathData.d,
            class: `particle p-${conn.type}`,
            style: `animation-delay: ${Math.random() * 2}s`
        });
        
        // 4. Label
        const label = createSVG('text', {
            x: pathData.midX,
            y: pathData.midY - 8,
            class: 'path-label'
        });
        label.textContent = conn.label;

        g.appendChild(hitPath);
        g.appendChild(visiblePath);
        g.appendChild(particle);
        g.appendChild(label);

        pathsLayer.appendChild(g);
        pathGroups.push({ group: g, from: conn.from, to: conn.to });
    });

    // --- Interactivity ---

    function highlightPath(activeId) {
        // Dim everything
        document.querySelectorAll('.connection-group').forEach(el => el.classList.add('dimmed'));
        document.querySelectorAll('.component-group').forEach(el => {
            if(el.getAttribute('data-id') !== activeId) el.classList.add('dimmed');
        });

        // Highlight connected
        const connectedGroups = pathGroups.filter(p => p.from === activeId || p.to === activeId);
        
        connectedGroups.forEach(p => {
            p.group.classList.remove('dimmed');
            p.group.classList.add('highlight-group');
            
            // Speed up particle
            const particle = p.group.querySelector('.particle');
            if(particle) particle.style.animationDuration = '0.6s';
        });
    }

    function resetHighlight() {
        document.querySelectorAll('.connection-group').forEach(el => {
            el.classList.remove('dimmed');
            el.classList.remove('highlight-group');
            const particle = el.querySelector('.particle');
            if(particle) particle.style.animationDuration = '';
        });
        document.querySelectorAll('.component-group').forEach(el => el.classList.remove('dimmed'));
    }

</script>
</body>
</html>
