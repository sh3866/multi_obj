<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Architecture Topology</title>
<style>
    :root {
        /* Palette: Flat Technical Dark */
        --bg-color: #0F1115;
        --grid-color: #1A1D24;
        
        --panel-fill: #16191F;
        --panel-stroke: #2D3342;
        
        --text-main: #E2E8F0;
        --text-muted: #64748B;
        --text-accent: #94A3B8;

        /* Signal Colors: Distinct & Flat */
        --color-data: #38BDF8;       /* Cyan - Data */
        --color-instruction: #A78BFA; /* Purple - Instructions */
        --color-control: #34D399;    /* Green - Control */
        --color-io: #FBBF24;         /* Amber - I/O Stream */

        /* Typography */
        --font-ui: system-ui, -apple-system, sans-serif;
        --font-mono: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background-color: var(--bg-color);
        /* Subtle technical grid */
        background-image: 
            linear-gradient(var(--grid-color) 1px, transparent 1px),
            linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
        background-size: 40px 40px;
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* UI Overlay Layer */
    .ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 20;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 40px;
    }

    /* Header */
    header {
        text-align: center;
        pointer-events: auto;
    }

    h1 {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: var(--text-main);
        text-transform: uppercase;
        margin-bottom: 0.5rem;
        font-family: var(--font-mono); /* Technical header */
    }

    .subtitle {
        color: var(--text-muted);
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        border-top: 1px solid var(--panel-stroke);
        display: inline-block;
        padding-top: 8px;
    }

    /* Legend */
    .legend {
        align-self: center;
        display: flex;
        gap: 24px;
        background: rgba(15, 17, 21, 0.9);
        padding: 12px 24px;
        border: 1px solid var(--panel-stroke);
        backdrop-filter: blur(8px);
        pointer-events: auto;
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--text-accent);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        font-family: var(--font-mono);
    }

    .legend-line {
        width: 24px;
        height: 2px;
        position: relative;
    }
    
    /* SVG Container */
    #diagram-container {
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 1;
    }

    svg {
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    /* Component Styles: Flat Technical */
    .component-group {
        cursor: pointer;
        transition: transform 0.2s ease;
    }

    .component-group:hover {
        transform: scale(1.02);
    }

    /* Standard Box */
    .comp-bg {
        fill: var(--panel-fill);
        stroke: var(--panel-stroke);
        stroke-width: 1.5px; /* Crisp 1px-ish border */
        rx: 4px; /* Slight rounding */
    }

    .component-group:hover .comp-bg {
        stroke: var(--text-main);
        fill: #1E222B;
    }

    /* CPU: Specialized Core Styling */
    .cpu-bg {
        fill: #1A1E26;
        stroke: var(--text-main);
        stroke-width: 2px;
        rx: 6px;
    }
    
    /* Corner accents for CPU */
    .cpu-accent {
        fill: none;
        stroke: var(--color-data);
        stroke-width: 2px;
        opacity: 0.6;
    }

    /* Typography */
    .comp-label {
        fill: var(--text-main);
        font-size: 14px;
        font-weight: 700;
        text-anchor: middle;
        font-family: var(--font-mono); /* Monospace labels */
        letter-spacing: 0.02em;
    }

    .comp-sub {
        fill: var(--text-muted);
        font-size: 10px;
        font-weight: 500;
        text-anchor: middle;
        font-family: var(--font-mono);
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }

    .comp-icon {
        stroke: var(--text-accent);
        stroke-width: 1.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: stroke 0.2s;
    }

    .component-group:hover .comp-icon {
        stroke: var(--text-main);
    }

    /* Paths: Flat & Precise */
    .path-bg {
        fill: none;
        stroke-width: 2px;
        stroke-linecap: square; /* Technical look */
        opacity: 0.4;
    }

    .path-bg-active {
        opacity: 0.1;
        stroke: transparent;
        stroke-width: 20px; /* Hit area */
    }

    /* Particle Animation */
    .particle {
        fill: none;
        stroke-width: 2px;
        stroke-linecap: round;
        stroke-dasharray: 1 150; 
    }

    @keyframes flow {
        0% { stroke-dashoffset: 150; }
        100% { stroke-dashoffset: 0; }
    }

    .p-data { stroke: var(--color-data); animation: flow 2s linear infinite; }
    .p-instruction { stroke: var(--color-instruction); animation: flow 1.5s linear infinite; }
    .p-control { stroke: var(--color-control); animation: flow 2.5s linear infinite; }
    .p-io { stroke: var(--color-io); animation: flow 2s linear infinite; }

    /* Interactive States */
    .dimmed {
        opacity: 0.1;
        transition: opacity 0.3s ease;
        filter: grayscale(100%);
    }
    
    .highlight-group .path-bg {
        opacity: 0.8;
        stroke-width: 3px;
    }
    
    .path-label {
        fill: var(--text-muted);
        font-size: 9px;
        font-weight: 700;
        font-family: var(--font-mono);
        text-anchor: middle;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        background: var(--bg-color); /* Hack for SVG text bg */
    }
    
    /* Create a text box effect using a rect behind text is hard in pure SVG, 
       so we rely on the background color being solid or just showing text */
    .highlight-group .path-label {
        opacity: 1;
        fill: var(--text-main);
    }

</style>
</head>
<body>

    <div class="ui-layer">
        <header>
            <h1>System Architecture</h1>
            <div class="subtitle">Core Logic & Peripheral Topology</div>
        </header>

        <div class="legend">
            <div class="legend-item" style="color: var(--color-data)">
                <div class="legend-line" style="background: var(--color-data)"></div>
                <span>Data Bus</span>
            </div>
            <div class="legend-item" style="color: var(--color-instruction)">
                <div class="legend-line" style="border-top: 2px dashed var(--color-instruction); height:0"></div>
                <span>Instruction</span>
            </div>
            <div class="legend-item" style="color: var(--color-control)">
                <div class="legend-line" style="border-top: 2px dotted var(--color-control); height:0"></div>
                <span>Control</span>
            </div>
            <div class="legend-item" style="color: var(--color-io)">
                <div class="legend-line" style="border-top: 2px solid var(--color-io); border-style: dashed; height:0"></div>
                <span>I/O Stream</span>
            </div>
        </div>
    </div>

    <div id="diagram-container">
        <svg id="main-svg" viewBox="0 0 1100 700" preserveAspectRatio="xMidYMid meet">
            <defs>
                <!-- Arrowhead Markers -->
                <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-data)" />
                </marker>
                <marker id="arrow-instruction" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-instruction)" />
                </marker>
                <marker id="arrow-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-control)" />
                </marker>
                <marker id="arrow-io" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-io)" />
                </marker>
            </defs>
            
            <g id="paths-layer"></g>
            <g id="particles-layer"></g>
            <g id="components-layer"></g>
        </svg>
    </div>

<script>
    const svg = document.getElementById('main-svg');
    const pathsLayer = document.getElementById('paths-layer');
    const particlesLayer = document.getElementById('particles-layer');
    const componentsLayer = document.getElementById('components-layer');

    const createSVG = (tag, attrs) => {
        const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
        return el;
    };

    // --- Configuration ---
    // Layout: Central Cluster (Core) vs Peripheral Ring
    const components = [
        // CORE
        { id: 'cpu', label: 'CPU', sub: 'Central Unit', x: 550, y: 350, w: 140, h: 100, type: 'cpu', icon: 'cpu' },
        { id: 'ram', label: 'Memory', sub: 'High Speed RAM', x: 550, y: 180, w: 120, h: 70, type: 'standard', icon: 'ram' },
        { id: 'gpu', label: 'GPU', sub: 'Graphics Cluster', x: 820, y: 350, w: 120, h: 70, type: 'standard', icon: 'gpu' },
        { id: 'storage', label: 'Storage', sub: 'NVMe SSD', x: 550, y: 520, w: 120, h: 70, type: 'standard', icon: 'hdd' },
        
        // PERIPHERALS
        { id: 'input', label: 'Input', sub: 'Keyboard / Mouse', x: 250, y: 220, w: 110, h: 70, type: 'standard', icon: 'mouse' },
        { id: 'output', label: 'Output', sub: 'Display / Audio', x: 250, y: 480, w: 110, h: 70, type: 'standard', icon: 'monitor' },
        { id: 'network', label: 'Network', sub: 'Ethernet / Wi-Fi', x: 820, y: 550, w: 110, h: 70, type: 'standard', icon: 'wifi' }
    ];

    // Connections
    const connections = [
        // CPU <-> Memory
        { from: 'ram', to: 'cpu', type: 'instruction', label: 'Fetch' },
        { from: 'cpu', to: 'ram', type: 'data', label: 'Store' },
        
        // CPU <-> GPU
        { from: 'cpu', to: 'gpu', type: 'instruction', label: 'Render' },
        { from: 'gpu', to: 'cpu', type: 'data', label: 'Result' },

        // Storage <-> RAM
        { from: 'storage', to: 'ram', type: 'data', label: 'Load' },
        { from: 'ram', to: 'storage', type: 'data', label: 'Write' },

        // Input/Output (I/O + Control)
        { from: 'input', to: 'cpu', type: 'io', label: 'Events' },
        { from: 'cpu', to: 'input', type: 'control', label: 'Poll' },
        
        { from: 'cpu', to: 'output', type: 'io', label: 'Stream' },
        { from: 'output', to: 'cpu', type: 'control', label: 'Sync' },

        // Network
        { from: 'network', to: 'cpu', type: 'data', label: 'Inbound' },
        { from: 'cpu', to: 'network', type: 'data', label: 'Outbound' },
    ];

    // --- Icons ---
    const drawIcon = (id, x, y) => {
        let g = createSVG('g', { transform: `translate(${x}, ${y})` });
        let pathData = "";
        
        // Technical line icons
        if(id === 'cpu') {
            pathData = "M4 4h16v16H4zM9 9h6v6H9zM12 1v3M12 20v3M1 12h3M20 12h3";
        } else if (id === 'ram') {
            pathData = "M4 4h16v16H4zM4 8h16M4 12h16M4 16h16";
        } else if (id === 'gpu') {
            pathData = "M4 4h16v16H4zM8 12l2-2 2 2 2-2"; // Abstract GPU
        } else if (id === 'hdd') {
            pathData = "M4 4h16v16H4zM12 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4z";
        } else if (id === 'mouse') {
            pathData = "M9 4h6a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM12 8v4";
        } else if (id === 'monitor') {
            pathData = "M4 4h16v10H4zM9 18h6M12 14v4";
        } else if (id === 'wifi') {
            pathData = "M12 18v-2M8 14a4 4 0 0 1 8 0M4 10a8 8 0 0 1 16 0";
        }

        g.appendChild(createSVG('path', { 
            d: pathData, 
            stroke: 'currentColor', 
            'stroke-width': 1.5, 
            fill: 'none',
            'stroke-linecap': 'round',
            'stroke-linejoin': 'round'
        }));
        return g;
    };

    // --- Render Components ---
    const compMap = {}; 

    components.forEach(c => {
        const g = createSVG('g', { 
            class: 'component-group', 
            transform: `translate(${c.x - c.w/2}, ${c.y - c.h/2})`,
            'data-id': c.id
        });

        // Box
        const rectClass = c.type === 'cpu' ? 'cpu-bg' : 'comp-bg';
        const rect = createSVG('rect', { 
            class: rectClass, 
            width: c.w, height: c.h 
        });
        
        // CPU Accents (Corners)
        if(c.type === 'cpu') {
            const accentSize = 6;
            // Top Left
            g.appendChild(createSVG('path', { d: `M2 ${accentSize} L2 2 L${accentSize} 2`, class: 'cpu-accent' }));
            // Top Right
            g.appendChild(createSVG('path', { d: `M${c.w-2} ${accentSize} L${c.w-2} 2 L${c.w-accentSize} 2`, class: 'cpu-accent' }));
            // Bottom Left
            g.appendChild(createSVG('path', { d: `M2 ${c.h-accentSize} L2 ${c.h} L${accentSize} ${c.h}`, class: 'cpu-accent' }));
            // Bottom Right
            g.appendChild(createSVG('path', { d: `M${c.w-2} ${c.h-accentSize} L${c.w-2} ${c.h} L${c.w-accentSize} ${c.h}`, class: 'cpu-accent' }));
        }

        // Icon
        const icon = drawIcon(c.icon, c.w/2 - 10, 16);
        icon.style.color = "var(--text-muted)"; 

        // Labels
        const textLabel = createSVG('text', { x: c.w/2, y: c.h - 24, class: 'comp-label' });
        textLabel.textContent = c.label;
        
        const textSub = createSVG('text', { x: c.w/2, y: c.h - 10, class: 'comp-sub' });
        textSub.textContent = c.sub;

        g.appendChild(rect);
        g.appendChild(icon);
        g.appendChild(textLabel);
        g.appendChild(textSub);
        
        componentsLayer.appendChild(g);
        compMap[c.id] = c;

        // Hover Logic
        g.addEventListener('mouseenter', () => highlightPath(c.id));
        g.addEventListener('mouseleave', () => resetHighlight());
    });

    // --- Render Paths ---
    
    // Calculate edge points for flat, orthogonal-ish curves
    const getEdgePoint = (rect, target) => {
        const dx = target.x - rect.x;
        const dy = target.y - rect.y;
        const angle = Math.atan2(dy, dx);
        
        const hw = rect.w / 2;
        const hh = rect.h / 2;
        
        // Determine which edge is closest
        let x, y;
        const absCos = Math.abs(Math.cos(angle));
        const absSin = Math.abs(Math.sin(angle));
        
        // Hit test for rectangle edge
        if (hw * absSin < hh * absCos) {
            // Left or Right
            x = Math.sign(dx) * hw;
            y = x * Math.tan(angle);
        } else {
            // Top or Bottom
            y = Math.sign(dy) * hh;
            x = y / Math.tan(angle);
        }
        
        return { x: rect.x + x, y: rect.y + y, angle };
    };

    const getPathD = (c1, c2) => {
        const startEdge = getEdgePoint(c1, c2);
        const endEdge = getEdgePoint(c2, c1);
        
        // Cubic Bezier control points
        // Pull control points back towards the center of the source/target to create a smooth "S" curve
        const dist = 80; 
        
        // Control point 1 (Start): move along the tangent of the exit
        const cp1x = startEdge.x + Math.cos(startEdge.angle) * dist;
        const cp1y = startEdge.y + Math.sin(startEdge.angle) * dist;
        
        // Control point 2 (End): move against the tangent of the entry
        const cp2x = endEdge.x - Math.cos(Math.atan2(c1.y - c2.y, c1.x - c2.x)) * dist;
        const cp2y = endEdge.y - Math.sin(Math.atan2(c1.y - c2.y, c1.x - c2.x)) * dist;

        return {
            d: `M ${startEdge.x} ${startEdge.y} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${endEdge.x} ${endEdge.y}`,
            midX: (startEdge.x + endEdge.x) / 2,
            midY: (startEdge.y + endEdge.y) / 2
        };
    };

    // Line styles
    const getLineStyle = (type) => {
        switch(type) {
            case 'data': return 'none'; // Solid
            case 'instruction': return '6 4'; // Dashed
            case 'control': return '2 4'; // Dotted
            case 'io': return '10 4 2 4'; // Dash-Dot
            default: return 'none';
        }
    };

    const pathGroups = [];

    connections.forEach((conn, index) => {
        const start = compMap[conn.from];
        const end = compMap[conn.to];
        
        const g = createSVG('g', { 
            class: 'connection-group', 
            'data-from': conn.from, 
            'data-to': conn.to 
        });

        const pathData = getPathD(start, end);
        const trackColor = `var(--color-${conn.type})`;

        // 1. Hit Area
        const hitPath = createSVG('path', {
            d: pathData.d,
            class: 'path-bg-active'
        });

        // 2. Visible Track
        const visiblePath = createSVG('path', {
            d: pathData.d,
            class: 'path-bg',
            stroke: trackColor,
            'stroke-dasharray': getLineStyle(conn.type),
            'marker-end': `url(#arrow-${conn.type})`
        });

        // 3. Particle
        const particle = createSVG('path', {
            d: pathData.d,
            class: `particle p-${conn.type}`,
            style: `animation-delay: ${Math.random() * 2}s`
        });
        
        // 4. Label (Centered on curve)
        const label = createSVG('text', {
            x: pathData.midX,
            y: pathData.midY - 8,
            class: 'path-label'
        });
        label.textContent = conn.label;

        g.appendChild(hitPath);
        g.appendChild(visiblePath);
        g.appendChild(particle);
        g.appendChild(label);

        pathsLayer.appendChild(g);
        pathGroups.push({ group: g, from: conn.from, to: conn.to });
    });

    // --- Interactivity ---

    function highlightPath(activeId) {
        // Dim everything
        document.querySelectorAll('.connection-group').forEach(el => el.classList.add('dimmed'));
        document.querySelectorAll('.component-group').forEach(el => {
            if(el.getAttribute('data-id') !== activeId) el.classList.add('dimmed');
        });

        // Highlight connected
        const connectedGroups = pathGroups.filter(p => p.from === activeId || p.to === activeId);
        
        connectedGroups.forEach(p => {
            p.group.classList.remove('dimmed');
            p.group.classList.add('highlight-group');
            
            // Speed up particle
            const particle = p.group.querySelector('.particle');
            if(particle) particle.style.animationDuration = '0.6s';
        });
    }

    function resetHighlight() {
        document.querySelectorAll('.connection-group').forEach(el => {
            el.classList.remove('dimmed');
            el.classList.remove('highlight-group');
            const particle = el.querySelector('.particle');
            if(particle) particle.style.animationDuration = '';
        });
        document.querySelectorAll('.component-group').forEach(el => el.classList.remove('dimmed'));
    }

</script>
</body>
</html>
