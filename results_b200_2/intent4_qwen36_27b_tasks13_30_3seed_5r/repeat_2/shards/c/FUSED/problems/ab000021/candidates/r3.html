<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Architecture & Data Flow</title>
<style>
    :root {
        /* Palette: Professional Technical Dark */
        --bg-color: #0B0C10;
        --panel-bg: #1F2026;
        --panel-border: #45464F;
        
        --text-main: #FFFFFF;
        --text-sub: #A0A0A0;
        --text-dim: #6C707A;

        /* Signal Colors (Refined for Contrast) */
        --color-data: #38BDF8;       /* Bright Sky Blue */
        --color-instruction: #C084FC; /* Bright Purple */
        --color-control: #4ADE80;    /* Bright Green */
        --color-io: #FACC15;         /* Bright Yellow */

        /* Typography */
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-tech: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background-color: var(--bg-color);
        /* Subtle Grid */
        background-image: 
            radial-gradient(circle at 1px 1px, #2A2B33 1px, transparent 0);
        background-size: 40px 40px;
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* UI Overlay */
    .ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
    }

    /* Title - Top Center */
    header {
        position: absolute;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        pointer-events: auto;
    }

    h1 {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 0.2rem;
        color: var(--text-main);
        text-transform: uppercase;
        text-shadow: 0 0 20px rgba(255,255,255,0.1);
    }

    .subtitle {
        color: var(--text-sub);
        font-size: 0.85rem;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
    }

    /* Legend - Bottom Center */
    .legend {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 32px;
        background: rgba(20, 20, 25, 0.85);
        padding: 16px 32px;
        border-radius: 8px;
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(12px);
        pointer-events: auto;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--text-main);
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }

    .legend-icon {
        width: 30px;
        height: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    /* SVG Container */
    #diagram-container {
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 1;
    }

    svg {
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    /* Component Styles */
    .component-group {
        cursor: pointer;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .component-group:hover {
        transform: translateY(-5px) scale(1.02);
        z-index: 100;
    }

    /* Standard Component Box */
    .comp-bg {
        fill: var(--panel-bg);
        stroke: var(--panel-border);
        stroke-width: 2;
        rx: 8;
        filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
        transition: stroke 0.3s, filter 0.3s;
    }

    .component-group:hover .comp-bg {
        stroke: #fff;
        filter: drop-shadow(0 8px 20px rgba(0,0,0,0.5));
    }

    /* CPU: The Hub - Special Styling */
    .cpu-box {
        fill: #1e1e24;
        stroke: #fff;
        stroke-width: 2;
        rx: 12;
        filter: drop-shadow(0 0 15px rgba(255,255,255,0.15));
    }

    /* CPU Pulse Animation */
    .cpu-pulse {
        fill: none;
        stroke: rgba(255,255,255,0.3);
        stroke-width: 1;
        rx: 14;
        transform-origin: center;
        animation: pulse 3s infinite ease-out;
    }

    @keyframes pulse {
        0% { transform: scale(1); opacity: 0.8; }
        100% { transform: scale(1.15); opacity: 0; }
    }

    .comp-icon {
        fill: none;
        stroke: var(--text-sub);
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: stroke 0.3s;
    }

    .component-group:hover .comp-icon {
        stroke: #fff;
    }

    /* Typography */
    .comp-label {
        fill: var(--text-main);
        font-size: 16px;
        font-weight: 700;
        text-anchor: middle;
        font-family: var(--font-ui);
        letter-spacing: -0.01em;
    }

    .comp-sub {
        fill: var(--text-sub);
        font-size: 11px;
        font-weight: 600;
        text-anchor: middle;
        font-family: var(--font-tech); /* Monospace for tech feel */
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }

    /* Path Styles */
    /* Critique 1: Strict Line Semantics */
    .path-bg {
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        opacity: 0.3;
    }

    /* Particles */
    .particle {
        fill: none;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 1 200; 
        filter: drop-shadow(0 0 6px currentColor);
    }

    /* Animations */
    @keyframes flow-particle {
        0% { stroke-dashoffset: 200; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
    }

    .p-data { stroke: var(--color-data); animation: flow-particle 3s linear infinite; }
    .p-instruction { stroke: var(--color-instruction); animation: flow-particle 2.5s linear infinite; }
    .p-control { stroke: var(--color-control); animation: flow-particle 2s linear infinite; }
    .p-io { stroke: var(--color-io); animation: flow-particle 3s linear infinite; }

    /* Interactive States */
    .dimmed {
        opacity: 0.15 !important;
        transition: opacity 0.4s ease;
        filter: grayscale(100%);
    }
    
    /* Inline Labels on Lines */
    .path-label {
        fill: var(--text-dim);
        font-size: 10px;
        font-weight: 700;
        font-family: var(--font-tech);
        text-anchor: middle;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        paint-order: stroke;
        stroke: var(--bg-color);
        stroke-width: 3px;
    }
    
    /* Show label for connected paths when component is hovered */
    .highlight-group .path-label {
        opacity: 1;
        fill: #fff;
    }

</style>
</head>
<body>

    <div class="ui-layer">
        <header>
            <h1>System Architecture</h1>
            <div class="subtitle">Information Flow & Component Topology</div>
        </header>

        <div class="legend">
            <!-- Legend Icons match Critique styles -->
            <div class="legend-item" style="color: var(--color-data)">
                <div class="legend-icon">
                    <svg width="30" height="16">
                        <path d="M2 8 L28 8" stroke="currentColor" stroke-width="2" stroke-dasharray="none"/>
                        <path d="M24 4 L28 8 L24 12" fill="currentColor"/>
                    </svg>
                </div>
                <span>Data</span>
            </div>
            <div class="legend-item" style="color: var(--color-instruction)">
                <div class="legend-icon">
                    <svg width="30" height="16">
                        <path d="M2 8 L28 8" stroke="currentColor" stroke-width="2" stroke-dasharray="4 2"/>
                        <path d="M24 4 L28 8 L24 12" fill="currentColor"/>
                    </svg>
                </div>
                <span>Instruction</span>
            </div>
            <div class="legend-item" style="color: var(--color-control)">
                <div class="legend-icon">
                    <svg width="30" height="16">
                        <path d="M2 8 L28 8" stroke="currentColor" stroke-width="2" stroke-dasharray="1 3"/>
                        <path d="M24 4 L28 8 L24 12" fill="currentColor"/>
                    </svg>
                </div>
                <span>Control</span>
            </div>
            <div class="legend-item" style="color: var(--color-io)">
                <div class="legend-icon">
                    <svg width="30" height="16">
                        <path d="M2 8 L28 8" stroke="currentColor" stroke-width="2" stroke-dasharray="8 2 2 2"/>
                        <path d="M24 4 L28 8 L24 12" fill="currentColor"/>
                    </svg>
                </div>
                <span>I/O Stream</span>
            </div>
        </div>
    </div>

    <div id="diagram-container">
        <svg id="main-svg" viewBox="0 0 1100 750" preserveAspectRatio="xMidYMid meet">
            <defs>
                <!-- Arrowhead Markers -->
                <marker id="arrow-data" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-data)" />
                </marker>
                <marker id="arrow-instruction" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-instruction)" />
                </marker>
                <marker id="arrow-control" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-control)" />
                </marker>
                <marker id="arrow-io" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-io)" />
                </marker>
            </defs>
            
            <g id="paths-layer"></g>
            <g id="particles-layer"></g>
            <g id="components-layer"></g>
        </svg>
    </div>

<script>
    // --- Configuration ---
    const svg = document.getElementById('main-svg');
    const pathsLayer = document.getElementById('paths-layer');
    const particlesLayer = document.getElementById('particles-layer');
    const componentsLayer = document.getElementById('components-layer');

    // Helper to create SVG elements
    const createSVG = (tag, attrs) => {
        const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
        return el;
    };

    // Component Positions (x, y center)
    // Critique 2: Balanced Layout. Network on Right. Input/Output on Left.
    const components = [
        { id: 'cpu', label: 'CPU', sub: 'Central Processing', x: 550, y: 375, w: 160, h: 120, type: 'cpu', icon: 'cpu' },
        { id: 'ram', label: 'Memory', sub: 'High Speed RAM', x: 550, y: 160, w: 120, h: 80, type: 'standard', icon: 'ram' },
        { id: 'gpu', label: 'GPU', sub: 'Graphics Cluster', x: 880, y: 375, w: 120, h: 80, type: 'standard', icon: 'gpu' },
        { id: 'storage', label: 'Storage', sub: 'NVMe SSD', x: 550, y: 590, w: 120, h: 80, type: 'standard', icon: 'hdd' },
        { id: 'input', label: 'Input', sub: 'Keyboard / Mouse', x: 220, y: 250, w: 120, h: 80, type: 'standard', icon: 'mouse' },
        { id: 'output', label: 'Output', sub: 'Display / Audio', x: 220, y: 500, w: 120, h: 80, type: 'standard', icon: 'monitor' },
        { id: 'network', label: 'Network', sub: 'Ethernet / Wi-Fi', x: 880, y: 550, w: 120, h: 80, type: 'standard', icon: 'wifi' }
    ];

    // Connections - Updated Logic per Critique
    // Critique 1: Parallel lines for CPU-RAM, CPU-GPU. I/O lines for Input/Output.
    const connections = [
        // CPU <-> Memory (Fetch-Decode-Execute Cycle)
        { from: 'ram', to: 'cpu', type: 'instruction', label: 'Fetch' },
        { from: 'cpu', to: 'ram', type: 'data', label: 'Store' },
        
        // CPU <-> GPU
        { from: 'cpu', to: 'gpu', type: 'instruction', label: 'Render Cmd' },
        { from: 'gpu', to: 'cpu', type: 'data', label: 'Buffer' }, // Changed to Data (Results)

        // Storage <-> RAM (Data transfer)
        { from: 'storage', to: 'ram', type: 'data', label: 'Load' },
        { from: 'ram', to: 'storage', type: 'data', label: 'Write' },

        // Input/Output (I/O and Control)
        { from: 'input', to: 'cpu', type: 'io', label: 'Events' },
        { from: 'cpu', to: 'input', type: 'control', label: 'Poll' },
        
        { from: 'cpu', to: 'output', type: 'io', label: 'Frame' },
        { from: 'output', to: 'cpu', type: 'control', label: 'VSync' },

        // Network (Data flow)
        { from: 'network', to: 'cpu', type: 'data', label: 'Inbound' },
        { from: 'cpu', to: 'network', type: 'data', label: 'Outbound' },
    ];

    // --- Drawing Icons ---
    const drawIcon = (id, x, y) => {
        let g = createSVG('g', { transform: `translate(${x}, ${y})` });
        let pathData = "";
        
        // Icons drawn on 24x24 grid
        if(id === 'cpu') {
            pathData = "M6 6h12v12H6zM10 10h4v4H10zM12 2v2M12 20v2M2 12h2M20 12h2";
        } else if (id === 'ram') {
            pathData = "M6 4h12v16H6zM6 8h12M6 12h12M6 16h12";
        } else if (id === 'gpu') {
            pathData = "M6 4h12v16H6zM10 12l2-2 2 2 2-2";
        } else if (id === 'hdd') {
            pathData = "M6 4h12v16H6zM12 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4z";
        } else if (id === 'mouse') {
            pathData = "M9 4h6a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM12 8v4";
        } else if (id === 'monitor') {
            pathData = "M6 4h12v10H6zM9 18h6M12 14v4";
        } else if (id === 'wifi') {
            pathData = "M12 18v-2M8 14a4 4 0 0 1 8 0M4 10a8 8 0 0 1 16 0";
        }

        g.appendChild(createSVG('path', { 
            d: pathData, 
            stroke: 'currentColor', 
            'stroke-width': 1.5, 
            fill: 'none',
            'stroke-linecap': 'round',
            'stroke-linejoin': 'round'
        }));
        return g;
    };

    // --- Render Components ---
    const compMap = {}; 

    components.forEach(c => {
        const g = createSVG('g', { 
            class: 'component-group', 
            transform: `translate(${c.x - c.w/2}, ${c.y - c.h/2})`,
            'data-id': c.id
        });

        // CPU Pulse Effect
        if(c.type === 'cpu') {
            const pulse = createSVG('rect', {
                class: 'cpu-pulse',
                width: c.w, height: c.h
            });
            g.appendChild(pulse);
        }

        // Box
        const rectClass = c.type === 'cpu' ? 'cpu-box' : 'comp-bg';
        const rect = createSVG('rect', { 
            class: rectClass, 
            width: c.w, height: c.h 
        });
        
        // Icon (Centered horizontally, top aligned)
        const icon = drawIcon(c.icon, c.w/2 - 12, 20);
        icon.style.color = "var(--text-sub)"; 

        // Labels
        const textLabel = createSVG('text', { x: c.w/2, y: c.h - 30, class: 'comp-label' });
        textLabel.textContent = c.label;
        
        const textSub = createSVG('text', { x: c.w/2, y: c.h - 12, class: 'comp-sub' });
        textSub.textContent = c.sub;

        g.appendChild(rect);
        g.appendChild(icon);
        g.appendChild(textLabel);
        g.appendChild(textSub);
        
        componentsLayer.appendChild(g);
        compMap[c.id] = c;

        // Hover Logic
        g.addEventListener('mouseenter', () => highlightPath(c.id));
        g.addEventListener('mouseleave', () => resetHighlight());
    });

    // --- Render Paths ---
    
    // Advanced Bezier Logic to hit exact box edges
    const getEdgePoint = (rect, target) => {
        const dx = target.x - rect.x;
        const dy = target.y - rect.y;
        const angle = Math.atan2(dy, dx);
        
        const hw = rect.w / 2;
        const hh = rect.h / 2;
        
        let x, y;
        const absCos = Math.abs(Math.cos(angle));
        const absSin = Math.abs(Math.sin(angle));
        
        if (hw * absSin < hh * absCos) {
            x = Math.sign(dx) * hw;
            y = x * Math.tan(angle);
        } else {
            y = Math.sign(dy) * hh;
            x = y / Math.tan(angle);
        }
        
        return { x: rect.x + x, y: rect.y + y, angle };
    };

    const getPathD = (c1, c2) => {
        const startEdge = getEdgePoint(c1, c2);
        const endEdge = getEdgePoint(c2, c1);
        
        // Control points logic for smooth curves
        const dist = 90; // curvature strength
        
        const cp1x = startEdge.x + Math.cos(startEdge.angle) * dist;
        const cp1y = startEdge.y + Math.sin(startEdge.angle) * dist;
        
        const cp2x = endEdge.x - Math.cos(Math.atan2(c1.y - c2.y, c1.x - c2.x)) * dist;
        const cp2y = endEdge.y - Math.sin(Math.atan2(c1.y - c2.y, c1.x - c2.x)) * dist;

        return {
            d: `M ${startEdge.x} ${startEdge.y} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${endEdge.x} ${endEdge.y}`,
            midX: (startEdge.x + endEdge.x) / 2,
            midY: (startEdge.y + endEdge.y) / 2
        };
    };

    // Helper for Line Styles (Critique 1)
    const getLineStyle = (type) => {
        switch(type) {
            case 'data': return 'none'; // Solid
            case 'instruction': return '6 4'; // Dashed
            case 'control': return '2 4'; // Dotted
            case 'io': return '10 4 2 4'; // Dash-Dot
            default: return 'none';
        }
    };

    const pathGroups = [];

    connections.forEach((conn, index) => {
        const start = compMap[conn.from];
        const end = compMap[conn.to];
        
        const g = createSVG('g', { 
            class: 'connection-group', 
            'data-from': conn.from, 
            'data-to': conn.to 
        });

        const pathData = getPathD(start, end);
        const trackColor = `var(--color-${conn.type})`;

        // 1. Background Track (Hit area)
        const bgPath = createSVG('path', {
            d: pathData.d,
            stroke: 'transparent',
            'stroke-width': 30,
            fill: 'none',
            class: 'hit-area'
        });

        // 2. Visible Track (Base Line)
        const visiblePath = createSVG('path', {
            d: pathData.d,
            class: 'path-bg',
            stroke: trackColor,
            'stroke-dasharray': getLineStyle(conn.type),
            'marker-end': `url(#arrow-${conn.type})`
        });

        // 3. Glowing Particle
        const particle = createSVG('path', {
            d: pathData.d,
            class: `particle p-${conn.type}`,
            style: `animation-delay: ${Math.random() * 2}s`
        });
        
        // 4. Inline Label
        const label = createSVG('text', {
            x: pathData.midX,
            y: pathData.midY - 10,
            class: 'path-label'
        });
        label.textContent = conn.label;

        g.appendChild(bgPath);
        g.appendChild(visiblePath);
        g.appendChild(particle);
        g.appendChild(label);

        pathsLayer.appendChild(g);
        pathGroups.push({ group: g, from: conn.from, to: conn.to });
    });

    // --- Interactivity ---

    function highlightPath(activeId) {
        // Dim all
        document.querySelectorAll('.connection-group').forEach(el => el.classList.add('dimmed'));
        document.querySelectorAll('.component-group').forEach(el => {
            if(el.getAttribute('data-id') !== activeId) el.classList.add('dimmed');
        });

        // Highlight connected
        const connectedGroups = pathGroups.filter(p => p.from === activeId || p.to === activeId);
        
        connectedGroups.forEach(p => {
            p.group.classList.remove('dimmed');
            p.group.classList.add('highlight-group'); // Show labels
            p.group.style.opacity = '1';
            
            // Speed up animation
            const particle = p.group.querySelector('.particle');
            if(particle) particle.style.animationDuration = '0.8s';
        });
    }

    function resetHighlight() {
        document.querySelectorAll('.connection-group').forEach(el => {
            el.classList.remove('dimmed');
            el.classList.remove('highlight-group');
            el.style.opacity = '';
            const particle = el.querySelector('.particle');
            if(particle) particle.style.animationDuration = '';
        });
        document.querySelectorAll('.component-group').forEach(el => el.classList.remove('dimmed'));
    }

</script>
</body>
</html>
