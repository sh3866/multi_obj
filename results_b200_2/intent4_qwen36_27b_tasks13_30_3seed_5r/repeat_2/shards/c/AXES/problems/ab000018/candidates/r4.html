<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crossy Road Redesign</title>
    <style>
        :root {
            --ui-primary: #2d3436;
            --ui-accent: #fdcb6e; /* Warm yellow */
            --ui-surface: #ffffff;
            --ui-shadow: rgba(45, 52, 54, 0.2);
            --btn-bg: #dfe6e9;
            --btn-active: #b2bec3;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            overscroll-behavior: none;
        }

        /* --- UI LAYER --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 20;
        }

        /* --- HUD: Low-Poly Style --- */
        .hud-top {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            box-sizing: border-box;
            pointer-events: none;
            /* Perspective tilt to match game world */
            transform: perspective(800px) rotateX(10deg) translateY(-10px);
            transform-origin: top center;
        }

        .score-card {
            background: var(--ui-surface);
            padding: 0;
            /* Faceted shape using clip-path */
            clip-path: polygon(10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%, 0 10%);
            box-shadow: 5px 5px 0px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 100px;
            border: 3px solid var(--ui-primary);
            transform: skewX(-5deg);
        }

        .score-header {
            width: 100%;
            text-align: center;
            padding: 8px 0 4px 0;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--ui-primary);
            background: #f1f2f6;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 80%);
        }

        .score-content {
            padding: 5px 0 12px 0;
        }

        .score-val {
            font-size: 42px;
            font-weight: 900;
            color: var(--ui-primary);
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        /* --- CONTROLS: D-Pad --- */
        /* Re-positioned to bottom center/right for better hierarchy */
        .controls-area {
            padding: 20px;
            display: flex;
            justify-content: center; /* Centered for two-thumb play or accessibility */
            align-items: center;
            pointer-events: auto;
            margin-bottom: 30px;
            transform: perspective(800px) rotateX(10deg) translateY(10px);
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(2, 70px);
            gap: 12px;
        }

        .btn {
            width: 70px;
            height: 70px;
            background: var(--btn-bg);
            /* Faceted button look */
            clip-path: polygon(10% 0, 100% 0, 100% 85%, 90% 100%, 0 100%, 0 15%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--ui-primary);
            cursor: pointer;
            transition: transform 0.05s;
            /* Hard shadow for depth */
            box-shadow: 0 6px 0 #636e72;
            position: relative;
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #636e72;
            background: var(--btn-active);
        }

        /* Grid Positioning for Cross Shape */
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        /* Icon Styling */
        .icon { width: 32px; height: 32px; fill: var(--ui-primary); }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

    </style>
</head>
<body>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div class="hud-top">
            <div class="score-card">
                <div class="score-header">Score</div>
                <div class="score-content">
                    <div class="score-val" id="score">0</div>
                </div>
            </div>
            <div class="score-card">
                <div class="score-header">Best</div>
                <div class="score-content">
                    <div class="score-val" id="best">42</div>
                </div>
            </div>
        </div>

        <div class="controls-area">
            <div class="d-pad">
                <div class="btn btn-up" onclick="game.movePlayer(0, -1)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 4L4 14h5v7h6v-7h5z"/></svg>
                </div>
                <div class="btn btn-left" onclick="game.movePlayer(-1, 0)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M4 12l10-8v5h7v6h-7v5z"/></svg>
                </div>
                <div class="btn btn-down" onclick="game.movePlayer(0, 1)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 20l8-10h-5V3h-6v7H4z"/></svg>
                </div>
                <div class="btn btn-right" onclick="game.movePlayer(1, 0)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M20 12L10 20v-5H3v-6h7V6z"/></svg>
                </div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        /**
         * CROSSY ROAD REDESIGN
         * Focus: 2.5D Perspective, Low-Poly Aesthetic, Visual Rhythm, Strong Hierarchy
         */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height;

        // --- Configuration ---
        const CONFIG = {
            fov: 350, // Field of view
            blockSize: 120, // Chunky blocks
            lanes: 25,
            drawDistance: 22, 
            colors: {
                skyTop: '#74b9ff',      // Light Blue
                skyBot: '#a29bfe',      // Soft Purple (Horizon)
                grassLight: '#55efc4',  // Mint
                grassDark: '#00b894',   // Darker Green
                roadBase: '#636e72',    // Grey Asphalt
                roadLine: '#dfe6e9',    // White Concrete
                waterBase: '#0984e3',   // Deep Blue
                waterLight: '#74b9ff'   // Light Blue
            }
        };

        // --- State ---
        let camera = { z: 0 };
        let player = { 
            x: 0, y: 0, z: 0, 
            targetY: 0, 
            squish: 1, 
            rot: 0, targetRot: 0, 
            jumpTime: 0,
            onLog: false 
        };
        let lanes = [];
        let score = 0;
        let time = 0;

        // --- Resize Handling ---
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Math Helpers ---
        const project = (x, y, z) => {
            // Adjust horizon line to 35% from top to give more vertical space to gameplay
            const horizonY = height * 0.35;
            const scale = CONFIG.fov / (CONFIG.fov + z - camera.z);
            const x2d = (x * scale) + (width / 2);
            const y2d = (y * scale) + horizonY; 
            return { x: x2d, y: y2d, scale: scale };
        };

        const lerp = (a, b, t) => a + (b - a) * t;
        const rand = (min, max) => Math.random() * (max - min) + min;

        // --- Color Helpers ---
        const hexToRgb = (hex) => {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        };

        const rgbToHex = (r, g, b) => "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);

        const lighten = (hex, amount) => {
            const c = hexToRgb(hex);
            if(!c) return hex;
            return rgbToHex(
                Math.min(255, c.r + (255 - c.r) * amount),
                Math.min(255, c.g + (255 - c.g) * amount),
                Math.min(255, c.b + (255 - c.b) * amount)
            );
        };

        const darken = (hex, amount) => {
            const c = hexToRgb(hex);
            if(!c) return hex;
            return rgbToHex(
                Math.max(0, c.r * (1 - amount)),
                Math.max(0, c.g * (1 - amount)),
                Math.max(0, c.b * (1 - amount))
            );
        };

        // --- Classes ---

        class Lane {
            constructor(zIndex) {
                this.z = zIndex * CONFIG.blockSize;
                this.type = this.determineType(zIndex);
                this.vehicles = [];
                this.logs = [];
                this.decorations = [];

                // Content Generation
                if (this.type === 'road') {
                    const count = Math.floor(rand(2, 4));
                    for(let i=0; i<count; i++) {
                        let safeX = false;
                        let v = {};
                        let attempts = 0;
                        while(!safeX && attempts < 15) {
                            v = {
                                x: rand(-width * 2, width * 2),
                                speed: rand(4, 8) * (Math.random() > 0.5 ? 1 : -1),
                                color: Math.random() > 0.5 ? '#ff7675' : '#ffeaa7', // Pastel Red/Yellow
                                width: rand(80, 120),
                                height: rand(50, 70),
                                depth: rand(60, 80)
                            };
                            safeX = this.vehicles.every(oldV => Math.abs(oldV.x - v.x) > 200);
                            attempts++;
                        }
                        if(safeX) this.vehicles.push(v);
                    }
                } else if (this.type === 'water') {
                    const count = Math.floor(rand(2, 4));
                    for(let i=0; i<count; i++) {
                        this.logs.push({
                            x: rand(-width * 2, width * 2),
                            speed: rand(2, 4) * (Math.random() > 0.5 ? 1 : -1),
                            length: rand(180, 320),
                            height: 30,
                            width: 50
                        });
                    }
                } else {
                    // Grass Decorations
                    const count = Math.floor(rand(3, 6));
                    for(let i=0; i<count; i++) {
                        let xPos = rand(-width/1.5, width/1.5);
                        // Keep spawn area clear
                        if (zIndex < 3 && Math.abs(xPos) < 100) xPos += (xPos > 0 ? 150 : -150);

                        this.decorations.push({
                            x: xPos,
                            type: Math.random() > 0.6 ? 'tree' : 'bush',
                            scale: rand(0.8, 1.2),
                            variant: Math.floor(Math.random() * 3)
                        });
                    }
                }
            }

            determineType(z) {
                if (z < 3) return 'grass'; 
                const mod = z % 5;
                if (mod === 1) return 'road';
                if (mod === 2) return 'water';
                return 'grass';
            }

            update() {
                this.vehicles.forEach(v => {
                    v.x += v.speed;
                    if (v.speed > 0 && v.x > width * 2) v.x = -width * 2;
                    if (v.speed < 0 && v.x < -width * 2) v.x = width * 2;
                });
                this.logs.forEach(l => {
                    l.x += l.speed;
                    if (l.speed > 0 && l.x > width * 2) l.x = -width * 2;
                    if (l.speed < 0 && l.x < -width * 2) l.x = width * 2;
                });
            }

            draw() {
                const zRel = this.z - camera.z;
                if (zRel < -CONFIG.fov || zRel > CONFIG.drawDistance * CONFIG.blockSize) return;

                const pStart = project(-width * 4, 0, this.z);
                const pEnd = project(width * 4, 0, this.z);
                const pStartNext = project(-width * 4, 0, this.z + CONFIG.blockSize);
                const pEndNext = project(width * 4, 0, this.z + CONFIG.blockSize);

                // Draw Ground Plane
                ctx.beginPath();
                ctx.moveTo(pStart.x, pStart.y);
                ctx.lineTo(pEnd.x, pEnd.y);
                ctx.lineTo(pEndNext.x, pEndNext.y);
                ctx.lineTo(pStartNext.x, pStartNext.y);
                ctx.closePath();

                // Base Color
                let baseColor;
                if (this.type === 'grass') {
                    baseColor = (Math.floor(this.z / CONFIG.blockSize) % 2 === 0) 
                        ? CONFIG.colors.grassLight 
                        : CONFIG.colors.grassDark;
                } else if (this.type === 'road') {
                    baseColor = CONFIG.colors.roadBase;
                } else if (this.type === 'water') {
                    baseColor = CONFIG.colors.waterBase;
                }
                ctx.fillStyle = baseColor;
                ctx.fill();

                // Texture/Details
                if (this.type === 'road') {
                    ctx.beginPath();
                    const lineStart = project(-width/3, 0, this.z);
                    const lineEnd = project(width/3, 0, this.z);
                    ctx.moveTo(lineStart.x, lineStart.y);
                    ctx.lineTo(lineEnd.x, lineEnd.y);
                    ctx.strokeStyle = CONFIG.colors.roadLine;
                    ctx.lineWidth = Math.max(2, 10 * pStart.scale);
                    ctx.setLineDash([25 * pStart.scale, 35 * pStart.scale]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                } else if (this.type === 'water') {
                    // Water shimmer lines
                    ctx.strokeStyle = CONFIG.colors.waterLight;
                    ctx.lineWidth = Math.max(1, 4 * pStart.scale);
                    ctx.globalAlpha = 0.3;
                    for(let i=-1; i<=1; i+=0.5) {
                        const s = project(i * (width/2), 0, this.z);
                        const e = project(i * (width/2) + 150, 0, this.z);
                        ctx.beginPath();
                        ctx.moveTo(s.x, s.y);
                        ctx.lineTo(e.x, e.y);
                        ctx.stroke();
                    }
                    ctx.globalAlpha = 1.0;
                }
            }
        }

        // --- 3D Drawing Primitives ---
        
        function drawBox(x, y, z, w, h, d, colorHex) {
            const p = project(x, y, z);
            const scale = p.scale;
            
            const hw = w * scale / 2;
            const hh = h * scale;
            const hd = d * scale / 2;

            // Shadow on ground (if y > 0)
            if (y > 0) {
                const groundP = project(x, 0, z);
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.beginPath();
                ctx.ellipse(groundP.x, groundP.y, hw * 1.1, hd * 0.7, 0, 0, Math.PI*2);
                ctx.fill();
            }

            // 1. Front Face (Main Color)
            ctx.fillStyle = colorHex;
            ctx.fillRect(p.x - hw, p.y - hh, hw*2, hh);

            // 2. Top Face (Lighter)
            ctx.fillStyle = lighten(colorHex, 0.4);
            ctx.beginPath();
            ctx.moveTo(p.x - hw, p.y - hh);
            ctx.lineTo(p.x - hw + hd, p.y - hh - hd); 
            ctx.lineTo(p.x + hw + hd, p.y - hh - hd); 
            ctx.lineTo(p.x + hw, p.y - hh);
            ctx.fill();

            // 3. Side Face (Darker)
            ctx.fillStyle = darken(colorHex, 0.25);
            ctx.beginPath();
            ctx.moveTo(p.x + hw, p.y - hh);
            ctx.lineTo(p.x + hw + hd, p.y - hh - hd);
            ctx.lineTo(p.x + hw + hd, p.y - hd);
            ctx.lineTo(p.x + hw, p.y);
            ctx.fill();
        }

        // --- The Game Object ---

        const game = {
            init: () => {
                // Initial Lanes
                for(let i=0; i<CONFIG.drawDistance; i++) {
                    lanes.push(new Lane(i));
                }
                
                // Input
                window.addEventListener('keydown', (e) => {
                    if(e.key === 'ArrowUp' || e.key === 'w') game.movePlayer(0, -1);
                    if(e.key === 'ArrowDown' || e.key === 's') game.movePlayer(0, 1);
                    if(e.key === 'ArrowLeft' || e.key === 'a') game.movePlayer(-1, 0);
                    if(e.key === 'ArrowRight' || e.key === 'd') game.movePlayer(1, 0);
                });

                requestAnimationFrame(game.loop);
            },

            movePlayer: (dx, dy) => {
                if (dx !== 0) {
                    player.x += dx * 80;
                    player.targetRot = dx * 0.4;
                    player.squish = 0.5; // Exaggerated squash
                }
                
                if (dy === -1) { // Forward
                    player.z += CONFIG.blockSize;
                    player.jumpTime = 12; 
                    score++;
                    document.getElementById('score').innerText = score;
                    
                    // Camera follow
                    camera.z += CONFIG.blockSize;
                    
                    // Infinite scroll logic
                    lanes.push(new Lane(lanes.length));
                    lanes.shift();
                } 
                else if (dy === 1) { // Back
                    if(player.z > 0) {
                        player.z -= CONFIG.blockSize;
                        camera.z -= CONFIG.blockSize;
                    }
                }
            },

            update: () => {
                time += 16;
                
                // Player Physics
                player.squish = lerp(player.squish, 1, 0.1);
                player.rot = lerp(player.rot, player.targetRot, 0.15);
                player.targetRot = lerp(player.targetRot, 0, 0.05);

                // Jump Arc
                if (player.jumpTime > 0) {
                    player.jumpTime--;
                    player.y = Math.sin((player.jumpTime / 12) * Math.PI) * 60;
                    player.onLog = false; 
                } else {
                    player.y = 0;
                    // Check logs
                    const currentLane = lanes.find(l => Math.abs(l.z - player.z) < 10);
                    if (currentLane && currentLane.type === 'water') {
                        let onLog = false;
                        currentLane.logs.forEach(log => {
                            if (player.x > log.x - log.length/2 && player.x < log.x + log.length/2) {
                                onLog = true;
                                player.x += log.speed; // Ride log
                            }
                        });
                        player.onLog = onLog;
                    } else {
                        player.onLog = false;
                    }
                }

                lanes.forEach(lane => lane.update());
            },

            draw: () => {
                // 1. Sky (Gradient)
                const grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, CONFIG.colors.skyTop);
                grad.addColorStop(0.5, CONFIG.colors.skyBot);
                grad.addColorStop(1, CONFIG.colors.skyBot);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                // 2. Collect Drawables
                let drawables = [];
                lanes.forEach(l => {
                    drawables.push({ type: 'lane', obj: l, z: l.z });
                    l.decorations.forEach(d => drawables.push({ type: 'deco', obj: d, z: l.z }));
                    l.vehicles.forEach(v => drawables.push({ type: 'vehicle', obj: v, z: l.z }));
                    l.logs.forEach(lg => drawables.push({ type: 'log', obj: lg, z: l.z }));
                });
                
                drawables.push({ type: 'player', z: player.z });

                // Sort by Z (Painter's Algorithm)
                drawables.sort((a, b) => a.z - b.z);

                // 3. Render Loop
                drawables.forEach(item => {
                    if (item.type === 'lane') item.obj.draw();
                    
                    if (item.type === 'deco') {
                        const d = item.obj;
                        if (d.type === 'tree') {
                            // Trunk
                            drawBox(d.x, 0, item.z, 20, 45, 20, '#6c5ce7'); // Purple trunk
                            // Leaves (Layered)
                            drawBox(d.x, 40, item.z, 65, 60, 65, '#00cec9'); // Teal Leaves
                            drawBox(d.x, 80, item.z, 45, 40, 45, '#55efc4'); // Lighter Top
                        } else {
                            // Bush
                            drawBox(d.x, 0, item.z, 40, 30, 40, '#00b894'); // Green Bush
                            drawBox(d.x, 20, item.z, 30, 25, 30, '#55efc4'); // Light Top
                        }
                    }

                    if (item.type === 'vehicle') {
                        const v = item.obj;
                        // Wheels
                        drawBox(v.x - v.width/2.2, 0, item.z, 20, 22, 20, '#2d3436');
                        drawBox(v.x + v.width/2.2, 0, item.z, 20, 22, 20, '#2d3436');
                        // Body
                        drawBox(v.x, 25, item.z, v.width, v.height, v.depth, v.color);
                        // Roof/Window (Detail)
                        drawBox(v.x, 25 + v.height/2, item.z, v.width * 0.8, v.height * 0.4, v.depth * 0.9, '#dfe6e9');
                    }

                    if (item.type === 'log') {
                        const l = item.obj;
                        drawBox(l.x, 8, item.z, l.length, l.height, l.width, '#e17055'); // Orange Log
                        // Log end detail
                        drawBox(l.x - l.length/2, 8, item.z, 10, l.height, l.width, '#fab1a0');
                    }

                    if (item.type === 'player') {
                        const p = project(player.x, player.y, player.z);
                        const s = p.scale;
                        
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        
                        // Squish & Rotate
                        const scaleY = player.squish;
                        const scaleX = 1 + (1 - player.squish) * 0.6;
                        ctx.scale(scaleX, scaleY);
                        ctx.rotate(player.rot);

                        // Shadow
                        ctx.fillStyle = 'rgba(0,0,0,0.2)';
                        ctx.beginPath();
                        ctx.ellipse(0, 0, 22*s, 12*s, 0, 0, Math.PI*2);
                        ctx.fill();

                        // Legs
                        ctx.fillStyle = '#fdcb6e'; // Yellow legs
                        ctx.fillRect(-12*s, -18*s, 10*s, 18*s);
                        ctx.fillRect(2*s, -18*s, 10*s, 18*s);

                        // Body (White)
                        drawBox(0, -18*s, 0, 42*s, 42*s, 42*s, '#ffffff');

                        // Comb (Red)
                        ctx.fillStyle = '#d63031';
                        ctx.fillRect(-8*s, -65*s, 16*s, 16*s);

                        // Beak (Orange)
                        ctx.fillStyle = '#e17055';
                        ctx.beginPath();
                        ctx.moveTo(22*s, -52*s);
                        ctx.lineTo(38*s, -45*s);
                        ctx.lineTo(22*s, -35*s);
                        ctx.fill();

                        // Eyes
                        ctx.fillStyle = '#2d3436';
                        ctx.beginPath();
                        ctx.arc(14*s, -58*s, 5*s, 0, Math.PI*2);
                        ctx.fill();
                        
                        // Blush
                        ctx.fillStyle = '#ff7675';
                        ctx.globalAlpha = 0.5;
                        ctx.beginPath();
                        ctx.arc(16*s, -45*s, 4*s, 0, Math.PI*2);
                        ctx.fill();
                        ctx.globalAlpha = 1.0;

                        ctx.restore();
                    }
                });
            },

            loop: () => {
                game.update();
                game.draw();
                requestAnimationFrame(game.loop);
            }
        };

        // Start
        game.init();

    </script>
</body>
</html>
