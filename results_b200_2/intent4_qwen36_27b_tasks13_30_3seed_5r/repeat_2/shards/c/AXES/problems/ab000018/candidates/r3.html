<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crossy Road Redesign</title>
    <style>
        :root {
            --ui-primary: #2c3e50;
            --ui-accent: #f1c40f;
            --ui-surface: #ffffff;
            --ui-shadow: rgba(0,0,0,0.25);
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            /* System font stack for performance and clean look */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            overscroll-behavior: none;
        }

        /* --- UI LAYER --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 20;
        }

        /* --- HUD: Score Cards --- */
        /* Critique Fix: Unified design language, playful typography, consistent containers */
        .hud-top {
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            box-sizing: border-box;
            pointer-events: none;
        }

        .score-card {
            background: var(--ui-surface);
            padding: 0;
            border-radius: 16px;
            box-shadow: 0 8px 24px var(--ui-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 90px;
            transform: translateY(0);
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 4px solid transparent; /* Placeholder for border alignment */
        }

        /* Playful "sticker" look */
        .score-card.score { border-color: var(--ui-accent); }
        .score-card.best { border-color: #3498db; }

        .score-header {
            width: 100%;
            text-align: center;
            padding: 6px 0 2px 0;
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--ui-primary);
            opacity: 0.6;
        }

        .score-content {
            padding-bottom: 8px;
        }

        .score-val {
            font-size: 36px;
            font-weight: 900;
            color: var(--ui-primary);
            line-height: 1;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 0 rgba(0,0,0,0.1);
        }

        /* --- CONTROLS: D-Pad --- */
        /* Critique Fix: Mathematically aligned cross, consistent spacing */
        .controls-area {
            padding: 30px;
            display: flex;
            justify-content: flex-start;
            align-items: flex-end;
            pointer-events: auto;
            margin-bottom: 20px;
            margin-left: 20px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
        }

        .btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--ui-primary);
            cursor: pointer;
            transition: all 0.08s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 0 #bdc3c7, 0 10px 15px rgba(0,0,0,0.15);
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        /* Specific Button Styling */
        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #bdc3c7, inset 0 4px 8px rgba(0,0,0,0.1);
        }

        /* Grid Positioning for Cross Shape */
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        /* Icon Styling */
        .icon { width: 28px; height: 28px; fill: var(--ui-primary); stroke: var(--ui-primary); stroke-width: 2px; stroke-linecap: round; stroke-linejoin: round; }

        /* Canvas */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

    </style>
</head>
<body>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div class="hud-top">
            <div class="score-card score">
                <div class="score-header">Score</div>
                <div class="score-content">
                    <div class="score-val" id="score">0</div>
                </div>
            </div>
            <div class="score-card best">
                <div class="score-header">Best</div>
                <div class="score-content">
                    <div class="score-val" id="best">42</div>
                </div>
            </div>
        </div>

        <div class="controls-area">
            <div class="d-pad">
                <div class="btn btn-up" onclick="game.movePlayer(0, -1)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 5l-8 8h6v8h4v-8h6z" stroke="none"/></svg>
                </div>
                <div class="btn btn-left" onclick="game.movePlayer(-1, 0)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M5 12l8-8v6h8v4h-8v6z" stroke="none"/></svg>
                </div>
                <div class="btn btn-down" onclick="game.movePlayer(0, 1)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 19l8-8h-6v-8h-4v8h-6z" stroke="none"/></svg>
                </div>
                <div class="btn btn-right" onclick="game.movePlayer(1, 0)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M19 12l-8 8v-6h-8v-4h8v-6z" stroke="none"/></svg>
                </div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        /**
         * CROSSY ROAD REDESIGN
         * Focus: 2.5D Perspective, Low-Poly Aesthetic, Visual Rhythm
         */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height;

        // --- Configuration ---
        const CONFIG = {
            fov: 400, // Adjusted for "sweet spot" perspective
            blockSize: 140, // Larger blocks for "chunky" feel
            lanes: 25,
            drawDistance: 20, 
            colors: {
                skyTop: '#4a69bd',      // Deep Blue
                skyBot: '#e55039',      // Sunset Orange
                grassLight: '#78e08f',  // Mint Green
                grassDark: '#38ada9',   // Teal Green
                roadBase: '#353b48',    // Dark Asphalt
                roadLine: '#f5f6fa',    // Light Concrete
                waterBase: '#00d2d3',   // Cyan
                waterLight: '#55efc4'   // Light Aqua
            }
        };

        // --- State ---
        let camera = { z: 0 };
        let player = { 
            x: 0, y: 0, z: 0, 
            targetY: 0, 
            squish: 1, 
            rot: 0, targetRot: 0, 
            jumpTime: 0,
            onLog: false 
        };
        let lanes = [];
        let score = 0;
        let time = 0;

        // --- Resize Handling ---
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Math Helpers ---
        const project = (x, y, z) => {
            const scale = CONFIG.fov / (CONFIG.fov + z - camera.z);
            const x2d = (x * scale) + (width / 2);
            // Horizon line placed at 40% from top to maximize gameplay area
            const y2d = (y * scale) + (height * 0.45); 
            return { x: x2d, y: y2d, scale: scale };
        };

        const lerp = (a, b, t) => a + (b - a) * t;
        const rand = (min, max) => Math.random() * (max - min) + min;

        // --- Color Helpers ---
        // Simple hex manipulation for lighting
        const hexToRgb = (hex) => {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        };

        const rgbToHex = (r, g, b) => "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);

        const lighten = (hex, amount) => {
            const c = hexToRgb(hex);
            if(!c) return hex;
            return rgbToHex(
                Math.min(255, c.r + (255 - c.r) * amount),
                Math.min(255, c.g + (255 - c.g) * amount),
                Math.min(255, c.b + (255 - c.b) * amount)
            );
        };

        const darken = (hex, amount) => {
            const c = hexToRgb(hex);
            if(!c) return hex;
            return rgbToHex(
                Math.max(0, c.r * (1 - amount)),
                Math.max(0, c.g * (1 - amount)),
                Math.max(0, c.b * (1 - amount))
            );
        };

        // --- Classes ---

        class Lane {
            constructor(zIndex) {
                this.z = zIndex * CONFIG.blockSize;
                this.type = this.determineType(zIndex);
                this.vehicles = [];
                this.logs = [];
                this.decorations = [];

                // Content Generation
                if (this.type === 'road') {
                    const count = Math.floor(rand(2, 4));
                    for(let i=0; i<count; i++) {
                        // Ensure vehicles don't overlap too much
                        let safeX = false;
                        let v = {};
                        let attempts = 0;
                        while(!safeX && attempts < 15) {
                            v = {
                                x: rand(-width * 2, width * 2),
                                speed: rand(3, 7) * (Math.random() > 0.5 ? 1 : -1),
                                color: Math.random() > 0.5 ? '#e74c3c' : '#f1c40f', // Red or Yellow
                                width: rand(70, 100),
                                height: rand(45, 60),
                                depth: rand(50, 60)
                            };
                            safeX = this.vehicles.every(oldV => Math.abs(oldV.x - v.x) > 180);
                            attempts++;
                        }
                        if(safeX) this.vehicles.push(v);
                    }
                } else if (this.type === 'water') {
                    const count = Math.floor(rand(2, 4));
                    for(let i=0; i<count; i++) {
                        this.logs.push({
                            x: rand(-width * 2, width * 2),
                            speed: rand(1.5, 3.5) * (Math.random() > 0.5 ? 1 : -1),
                            length: rand(160, 300),
                            height: 25,
                            width: 45
                        });
                    }
                } else {
                    // Grass Decorations
                    const count = Math.floor(rand(3, 6));
                    for(let i=0; i<count; i++) {
                        let xPos = rand(-width/1.5, width/1.5);
                        // Keep spawn area clear
                        if (zIndex < 3 && Math.abs(xPos) < 100) xPos += (xPos > 0 ? 150 : -150);

                        this.decorations.push({
                            x: xPos,
                            type: Math.random() > 0.7 ? 'tree' : 'bush',
                            scale: rand(0.8, 1.3),
                            variant: Math.floor(Math.random() * 3)
                        });
                    }
                }
            }

            determineType(z) {
                if (z < 3) return 'grass'; // Safe start
                // Pattern: Grass, Road, Water, Grass
                const mod = z % 5;
                if (mod === 1) return 'road';
                if (mod === 2) return 'water';
                return 'grass';
            }

            update() {
                this.vehicles.forEach(v => {
                    v.x += v.speed;
                    if (v.speed > 0 && v.x > width * 2) v.x = -width * 2;
                    if (v.speed < 0 && v.x < -width * 2) v.x = width * 2;
                });
                this.logs.forEach(l => {
                    l.x += l.speed;
                    if (l.speed > 0 && l.x > width * 2) l.x = -width * 2;
                    if (l.speed < 0 && l.x < -width * 2) l.x = width * 2;
                });
            }

            draw() {
                const zRel = this.z - camera.z;
                if (zRel < -CONFIG.fov || zRel > CONFIG.drawDistance * CONFIG.blockSize) return;

                const pStart = project(-width * 4, 0, this.z);
                const pEnd = project(width * 4, 0, this.z);
                const pStartNext = project(-width * 4, 0, this.z + CONFIG.blockSize);
                const pEndNext = project(width * 4, 0, this.z + CONFIG.blockSize);

                // Draw Ground Plane
                ctx.beginPath();
                ctx.moveTo(pStart.x, pStart.y);
                ctx.lineTo(pEnd.x, pEnd.y);
                ctx.lineTo(pEndNext.x, pEndNext.y);
                ctx.lineTo(pStartNext.x, pStartNext.y);
                ctx.closePath();

                // Base Color
                let baseColor;
                if (this.type === 'grass') {
                    baseColor = (Math.floor(this.z / CONFIG.blockSize) % 2 === 0) 
                        ? CONFIG.colors.grassLight 
                        : CONFIG.colors.grassDark;
                } else if (this.type === 'road') {
                    baseColor = CONFIG.colors.roadBase;
                } else if (this.type === 'water') {
                    baseColor = CONFIG.colors.waterBase;
                }
                ctx.fillStyle = baseColor;
                ctx.fill();

                // Texture/Details
                if (this.type === 'road') {
                    ctx.beginPath();
                    const lineStart = project(-width/3, 0, this.z);
                    const lineEnd = project(width/3, 0, this.z);
                    ctx.moveTo(lineStart.x, lineStart.y);
                    ctx.lineTo(lineEnd.x, lineEnd.y);
                    ctx.strokeStyle = CONFIG.colors.roadLine;
                    ctx.lineWidth = Math.max(2, 8 * pStart.scale);
                    ctx.setLineDash([20 * pStart.scale, 30 * pStart.scale]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                } else if (this.type === 'water') {
                    // Water shimmer lines
                    ctx.strokeStyle = CONFIG.colors.waterLight;
                    ctx.lineWidth = Math.max(1, 3 * pStart.scale);
                    ctx.globalAlpha = 0.4;
                    for(let i=-1; i<=1; i+=0.4) {
                        const s = project(i * (width/2), 0, this.z);
                        const e = project(i * (width/2) + 100, 0, this.z);
                        ctx.beginPath();
                        ctx.moveTo(s.x, s.y);
                        ctx.lineTo(e.x, e.y);
                        ctx.stroke();
                    }
                    ctx.globalAlpha = 1.0;
                }
            }
        }

        // --- 3D Drawing Primitives ---
        
        // Draws a low-poly box with 3 visible faces
        function drawBox(x, y, z, w, h, d, colorHex) {
            const p = project(x, y, z);
            const scale = p.scale;
            
            const hw = w * scale / 2;
            const hh = h * scale;
            const hd = d * scale / 2;

            // Shadow on ground (if y > 0)
            if (y > 0) {
                const groundP = project(x, 0, z);
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.ellipse(groundP.x, groundP.y, hw * 1.2, hd * 0.8, 0, 0, Math.PI*2);
                ctx.fill();
            }

            // 1. Front Face
            ctx.fillStyle = colorHex;
            ctx.fillRect(p.x - hw, p.y - hh, hw*2, hh);

            // 2. Top Face (Lighter)
            ctx.fillStyle = lighten(colorHex, 0.3);
            ctx.beginPath();
            ctx.moveTo(p.x - hw, p.y - hh);
            ctx.lineTo(p.x - hw + hd, p.y - hh - hd); 
            ctx.lineTo(p.x + hw + hd, p.y - hh - hd); 
            ctx.lineTo(p.x + hw, p.y - hh);
            ctx.fill();

            // 3. Side Face (Darker)
            ctx.fillStyle = darken(colorHex, 0.2);
            ctx.beginPath();
            ctx.moveTo(p.x + hw, p.y - hh);
            ctx.lineTo(p.x + hw + hd, p.y - hh - hd);
            ctx.lineTo(p.x + hw + hd, p.y - hd);
            ctx.lineTo(p.x + hw, p.y);
            ctx.fill();
        }

        // --- The Game Object ---

        const game = {
            init: () => {
                // Initial Lanes
                for(let i=0; i<CONFIG.drawDistance; i++) {
                    lanes.push(new Lane(i));
                }
                
                // Input
                window.addEventListener('keydown', (e) => {
                    if(e.key === 'ArrowUp' || e.key === 'w') game.movePlayer(0, -1);
                    if(e.key === 'ArrowDown' || e.key === 's') game.movePlayer(0, 1);
                    if(e.key === 'ArrowLeft' || e.key === 'a') game.movePlayer(-1, 0);
                    if(e.key === 'ArrowRight' || e.key === 'd') game.movePlayer(1, 0);
                });

                requestAnimationFrame(game.loop);
            },

            movePlayer: (dx, dy) => {
                if (dx !== 0) {
                    player.x += dx * 80;
                    player.targetRot = dx * 0.5;
                    player.squish = 0.6; // Exaggerated squash
                }
                
                if (dy === -1) { // Forward
                    player.z += CONFIG.blockSize;
                    player.jumpTime = 15; 
                    score++;
                    document.getElementById('score').innerText = score;
                    
                    // Camera follow
                    camera.z += CONFIG.blockSize;
                    
                    // Infinite scroll logic
                    lanes.push(new Lane(lanes.length));
                    lanes.shift();
                } 
                else if (dy === 1) { // Back
                    if(player.z > 0) {
                        player.z -= CONFIG.blockSize;
                        camera.z -= CONFIG.blockSize;
                    }
                }
            },

            update: () => {
                time += 16;
                
                // Player Physics
                player.squish = lerp(player.squish, 1, 0.1);
                player.rot = lerp(player.rot, player.targetRot, 0.15);
                player.targetRot = lerp(player.targetRot, 0, 0.05);

                // Jump Arc
                if (player.jumpTime > 0) {
                    player.jumpTime--;
                    player.y = Math.sin((player.jumpTime / 15) * Math.PI) * 50;
                    player.onLog = false; // In air, not on log
                } else {
                    player.y = 0;
                    // Check logs
                    const currentLane = lanes.find(l => Math.abs(l.z - player.z) < 10);
                    if (currentLane && currentLane.type === 'water') {
                        let onLog = false;
                        currentLane.logs.forEach(log => {
                            if (player.x > log.x - log.length/2 && player.x < log.x + log.length/2) {
                                onLog = true;
                                player.x += log.speed; // Ride log
                            }
                        });
                        player.onLog = onLog;
                    } else {
                        player.onLog = false;
                    }
                }

                lanes.forEach(lane => lane.update());
            },

            draw: () => {
                // 1. Sky (Gradient)
                const grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, CONFIG.colors.skyTop);
                grad.addColorStop(0.5, CONFIG.colors.skyBot);
                grad.addColorStop(1, CONFIG.colors.skyBot);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                // 2. Collect Drawables
                let drawables = [];
                lanes.forEach(l => {
                    drawables.push({ type: 'lane', obj: l, z: l.z });
                    l.decorations.forEach(d => drawables.push({ type: 'deco', obj: d, z: l.z }));
                    l.vehicles.forEach(v => drawables.push({ type: 'vehicle', obj: v, z: l.z }));
                    l.logs.forEach(lg => drawables.push({ type: 'log', obj: lg, z: l.z }));
                });
                
                // Player Z is actual Z + jump height for sorting purposes (though strictly we sort by Z plane)
                drawables.push({ type: 'player', z: player.z });

                // Sort by Z (Painter's Algorithm)
                drawables.sort((a, b) => a.z - b.z);

                // 3. Render Loop
                drawables.forEach(item => {
                    if (item.type === 'lane') item.obj.draw();
                    
                    if (item.type === 'deco') {
                        const d = item.obj;
                        if (d.type === 'tree') {
                            // Trunk
                            drawBox(d.x, 0, item.z, 18, 40, 18, '#8e44ad'); // Purple trunk for style
                            // Leaves
                            drawBox(d.x, 35, item.z, 60, 55, 60, '#2ecc71'); // Emerald leaves
                        } else {
                            // Bush
                            drawBox(d.x, 0, item.z, 35, 28, 35, '#1abc9c'); // Turquoise bush
                        }
                    }

                    if (item.type === 'vehicle') {
                        const v = item.obj;
                        // Wheels
                        drawBox(v.x - v.width/2.5, 0, item.z, 18, 20, 18, '#2c3e50');
                        drawBox(v.x + v.width/2.5, 0, item.z, 18, 20, 18, '#2c3e50');
                        // Body
                        drawBox(v.x, 25, item.z, v.width, v.height, v.depth, v.color);
                    }

                    if (item.type === 'log') {
                        const l = item.obj;
                        drawBox(l.x, 5, item.z, l.length, l.height, l.width, '#d35400'); // Pumpkin log
                    }

                    if (item.type === 'player') {
                        const p = project(player.x, player.y, player.z);
                        const s = p.scale;
                        
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        
                        // Squish & Rotate
                        const scaleY = player.squish;
                        const scaleX = 1 + (1 - player.squish) * 0.8;
                        ctx.scale(scaleX, scaleY);
                        ctx.rotate(player.rot);

                        // Shadow
                        ctx.fillStyle = 'rgba(0,0,0,0.2)';
                        ctx.beginPath();
                        ctx.ellipse(0, 0, 20*s, 10*s, 0, 0, Math.PI*2);
                        ctx.fill();

                        // Legs (Orange)
                        ctx.fillStyle = '#e67e22';
                        ctx.fillRect(-12*s, -20*s, 9*s, 20*s);
                        ctx.fillRect(3*s, -20*s, 9*s, 20*s);

                        // Body (White) - Main block
                        drawBox(0, -20*s, 0, 40*s, 40*s, 40*s, '#ecf0f1');

                        // Comb (Red)
                        ctx.fillStyle = '#e74c3c';
                        ctx.fillRect(-8*s, -65*s, 16*s, 15*s);

                        // Beak (Yellow)
                        ctx.fillStyle = '#f1c40f';
                        ctx.beginPath();
                        ctx.moveTo(20*s, -52*s);
                        ctx.lineTo(35*s, -45*s);
                        ctx.lineTo(20*s, -35*s);
                        ctx.fill();

                        // Eyes (Black)
                        ctx.fillStyle = '#2c3e50';
                        ctx.beginPath();
                        ctx.arc(12*s, -58*s, 4*s, 0, Math.PI*2);
                        ctx.fill();
                        
                        // Blush (Pink)
                        ctx.fillStyle = '#fd79a8';
                        ctx.globalAlpha = 0.6;
                        ctx.beginPath();
                        ctx.arc(15*s, -45*s, 3*s, 0, Math.PI*2);
                        ctx.fill();
                        ctx.globalAlpha = 1.0;

                        ctx.restore();
                    }
                });
            },

            loop: () => {
                game.update();
                game.draw();
                requestAnimationFrame(game.loop);
            }
        };

        // Start
        game.init();

    </script>
</body>
</html>
