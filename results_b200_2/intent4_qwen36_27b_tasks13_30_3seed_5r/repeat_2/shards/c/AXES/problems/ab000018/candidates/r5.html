<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crossy Road: Low Poly Redesign</title>
    <style>
        :root {
            --ui-bg: #ffffff;
            --ui-text: #2d3436;
            --ui-shadow: rgba(0, 0, 0, 0.15);
            --accent: #ff7675;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #2d3436;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            overscroll-behavior: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- UI LAYER --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 20;
        }

        /* --- HUD: Diegetic "Billboard" Style --- */
        .hud-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding-top: 40px;
            transform: perspective(800px) rotateX(15deg) scale(0.9);
            transform-origin: top center;
        }

        .billboard {
            background: var(--ui-bg);
            padding: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 110px;
            border-radius: 4px;
            box-shadow: 
                0 15px 30px rgba(0,0,0,0.15), 
                0 5px 0 #dfe6e9; /* 3D Edge */
        }

        /* The wooden pole connecting the billboard */
        .billboard::after {
            content: '';
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 30px;
            background: #b2bec3;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        .score-label {
            background: #dfe6e9;
            width: 100%;
            text-align: center;
            padding: 8px 0;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--ui-text);
            border-bottom: 2px solid #b2bec3;
        }

        .score-value {
            padding: 12px 0;
            font-size: 36px;
            font-weight: 900;
            color: var(--ui-text);
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        /* --- CONTROLS: Tactile D-Pad --- */
        .controls-wrapper {
            padding-bottom: 40px;
            display: flex;
            justify-content: center;
            pointer-events: auto;
        }

        .d-pad {
            display: grid;
            grid-template-columns: 80px 80px 80px;
            grid-template-rows: 80px 80px;
            gap: 15px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
        }

        .btn {
            width: 80px;
            height: 80px;
            background: #ffffff;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Tactile 3D Look */
            box-shadow: 
                0 8px 0 #b2bec3, 
                0 15px 20px rgba(0,0,0,0.1);
            border: 2px solid #dfe6e9;
        }

        .btn:active {
            transform: translateY(8px);
            box-shadow: 
                0 0 0 #b2bec3, 
                inset 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Grid Positioning */
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        .icon { width: 36px; height: 36px; fill: #2d3436; pointer-events: none; }
        
        /* Highlight the Up button slightly to indicate primary action */
        .btn-up {
            background: #fff;
        }
    </style>
</head>
<body>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div class="hud-container">
            <div class="billboard">
                <div class="score-label">Score</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="billboard">
                <div class="score-label">Best</div>
                <div class="score-value" id="best">42</div>
            </div>
        </div>

        <div class="controls-wrapper">
            <div class="d-pad">
                <div class="btn btn-up" onclick="game.movePlayer(0, -1)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 4l-8 8h6v8h4v-8h6z"/></svg>
                </div>
                <div class="btn btn-left" onclick="game.movePlayer(-1, 0)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M4 12l8-8v6h8v4h-8v6z"/></svg>
                </div>
                <div class="btn btn-down" onclick="game.movePlayer(0, 1)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 20l8-8h-6v-8h-4v8h-6z"/></svg>
                </div>
                <div class="btn btn-right" onclick="game.movePlayer(1, 0)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M20 12l-8 8v-6h-8v-4h8v-6z"/></svg>
                </div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        /**
         * CROSSY ROAD VISUAL REDESIGN
         * Focus: 2.5D Perspective, Chunky Low-Poly Geometry, Strong Visual Hierarchy
         */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height;

        // --- Configuration ---
        const CONFIG = {
            fov: 400, // Field of view - tighter for more depth
            blockSize: 100, // Grid unit
            lanes: 30,
            drawDistance: 25, 
            // Semantic Color Palette
            colors: {
                skyTop: '#4facfe',
                skyBot: '#00f2fe',
                grass1: '#55efc4', // Mint
                grass2: '#00b894', // Emerald
                road: '#636e72',   // Asphalt
                roadLine: '#ffffff',
                water: '#0984e3',  // Deep Blue
                treeTrunk: '#e17055', // Burnt Orange
                treeLeaves: '#00b894',
                cloud: '#ffffff'
            }
        };

        // --- State ---
        let camera = { z: 0 };
        let player = { 
            x: 0, y: 0, z: 0, 
            targetY: 0, 
            squish: 1, 
            rot: 0, targetRot: 0, 
            jumpTime: 0,
            onLog: false 
        };
        let lanes = [];
        let clouds = [];
        let score = 0;
        let time = 0;

        // --- Resize Handling ---
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            
            // Generate Clouds based on screen width
            clouds = [];
            for(let i=0; i<15; i++) {
                clouds.push({
                    x: (Math.random() * width * 2) - width,
                    y: Math.random() * (height * 0.4), // Top 40%
                    z: Math.random() * 2000, // Depth
                    scale: Math.random() * 0.5 + 0.5,
                    speed: Math.random() * 0.5 + 0.1
                });
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Math Helpers ---
        const project = (x, y, z) => {
            // Horizon at 35% down the screen
            const horizonY = height * 0.35;
            // Relative Z
            const rz = z - camera.z;
            
            // Don't project if behind camera
            if (rz < -CONFIG.fov) return { x: 0, y: 0, scale: 0, visible: false };
            
            const scale = CONFIG.fov / (CONFIG.fov + rz);
            const x2d = (x * scale) + (width / 2);
            const y2d = (y * scale) + horizonY; 
            return { x: x2d, y: y2d, scale: scale, visible: true };
        };

        const lerp = (a, b, t) => a + (b - a) * t;
        const rand = (min, max) => Math.random() * (max - min) + min;

        // --- Color Helpers ---
        const hexToRgb = (hex) => {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        };

        const rgbToHex = (r, g, b) => "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);

        const lighten = (hex, amount) => {
            const c = hexToRgb(hex);
            if(!c) return hex;
            return rgbToHex(
                Math.min(255, c.r + (255 - c.r) * amount),
                Math.min(255, c.g + (255 - c.g) * amount),
                Math.min(255, c.b + (255 - c.b) * amount)
            );
        };

        const darken = (hex, amount) => {
            const c = hexToRgb(hex);
            if(!c) return hex;
            return rgbToHex(
                Math.max(0, c.r * (1 - amount)),
                Math.max(0, c.g * (1 - amount)),
                Math.max(0, c.b * (1 - amount))
            );
        };

        // --- Classes ---

        class Lane {
            constructor(zIndex) {
                this.z = zIndex * CONFIG.blockSize;
                this.type = this.determineType(zIndex);
                this.vehicles = [];
                this.logs = [];
                this.decorations = [];

                // Content Generation
                if (this.type === 'road') {
                    const count = Math.floor(rand(2, 4));
                    for(let i=0; i<count; i++) {
                        let safeX = false;
                        let v = {};
                        let attempts = 0;
                        // Try to place cars without overlapping
                        while(!safeX && attempts < 10) {
                            v = {
                                x: rand(-width * 1.5, width * 1.5),
                                speed: rand(3, 7) * (Math.random() > 0.5 ? 1 : -1),
                                color: this.getRandomCarColor(),
                                width: rand(90, 130),
                                height: rand(50, 70),
                                depth: rand(60, 80)
                            };
                            safeX = this.vehicles.every(oldV => Math.abs(oldV.x - v.x) > 200);
                            attempts++;
                        }
                        if(safeX) this.vehicles.push(v);
                    }
                } else if (this.type === 'water') {
                    const count = Math.floor(rand(2, 4));
                    for(let i=0; i<count; i++) {
                        this.logs.push({
                            x: rand(-width * 1.5, width * 1.5),
                            speed: rand(2, 4) * (Math.random() > 0.5 ? 1 : -1),
                            length: rand(180, 350),
                            height: 25,
                            width: 60
                        });
                    }
                } else {
                    // Grass Decorations
                    const count = Math.floor(rand(3, 6));
                    for(let i=0; i<count; i++) {
                        let xPos = rand(-width/1.2, width/1.2);
                        // Keep spawn area clear
                        if (zIndex < 3 && Math.abs(xPos) < 100) xPos += (xPos > 0 ? 150 : -150);

                        this.decorations.push({
                            x: xPos,
                            type: Math.random() > 0.6 ? 'tree' : 'bush',
                            scale: rand(0.9, 1.3),
                            variant: Math.floor(Math.random() * 3)
                        });
                    }
                }
            }

            getRandomCarColor() {
                const carColors = ['#ff7675', '#ffeaa7', '#74b9ff', '#a29bfe', '#fdcb6e'];
                return carColors[Math.floor(Math.random() * carColors.length)];
            }

            determineType(z) {
                if (z < 3) return 'grass'; 
                const mod = z % 6;
                if (mod === 1 || mod === 5) return 'road';
                if (mod === 3) return 'water';
                return 'grass';
            }

            update() {
                this.vehicles.forEach(v => {
                    v.x += v.speed;
                    if (v.speed > 0 && v.x > width * 2) v.x = -width * 2;
                    if (v.speed < 0 && v.x < -width * 2) v.x = width * 2;
                });
                this.logs.forEach(l => {
                    l.x += l.speed;
                    if (l.speed > 0 && l.x > width * 2) l.x = -width * 2;
                    if (l.speed < 0 && l.x < -width * 2) l.x = width * 2;
                });
            }

            draw() {
                const zRel = this.z - camera.z;
                if (zRel < -CONFIG.fov || zRel > CONFIG.drawDistance * CONFIG.blockSize) return;

                const pStart = project(-width * 5, 0, this.z);
                const pEnd = project(width * 5, 0, this.z);
                const pStartNext = project(-width * 5, 0, this.z + CONFIG.blockSize);
                const pEndNext = project(width * 5, 0, this.z + CONFIG.blockSize);

                // Draw Ground Plane
                ctx.beginPath();
                ctx.moveTo(pStart.x, pStart.y);
                ctx.lineTo(pEnd.x, pEnd.y);
                ctx.lineTo(pEndNext.x, pEndNext.y);
                ctx.lineTo(pStartNext.x, pStartNext.y);
                ctx.closePath();

                // Base Color
                let baseColor;
                if (this.type === 'grass') {
                    baseColor = (Math.floor(this.z / CONFIG.blockSize) % 2 === 0) 
                        ? CONFIG.colors.grass1 
                        : CONFIG.colors.grass2;
                } else if (this.type === 'road') {
                    baseColor = CONFIG.colors.road;
                } else if (this.type === 'water') {
                    baseColor = CONFIG.colors.water;
                }
                ctx.fillStyle = baseColor;
                ctx.fill();

                // Texture/Details
                if (this.type === 'road') {
                    ctx.beginPath();
                    const lineStart = project(-width/3, 0, this.z);
                    const lineEnd = project(width/3, 0, this.z);
                    ctx.moveTo(lineStart.x, lineStart.y);
                    ctx.lineTo(lineEnd.x, lineEnd.y);
                    ctx.strokeStyle = CONFIG.colors.roadLine;
                    ctx.lineWidth = Math.max(2, 12 * pStart.scale);
                    ctx.setLineDash([30 * pStart.scale, 40 * pStart.scale]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                } else if (this.type === 'water') {
                    // Water shimmer lines
                    ctx.strokeStyle = '#74b9ff';
                    ctx.lineWidth = Math.max(1, 5 * pStart.scale);
                    ctx.globalAlpha = 0.4;
                    for(let i=-1; i<=1; i+=0.4) {
                        const s = project(i * (width/2), 0, this.z);
                        const e = project(i * (width/2) + 200, 0, this.z);
                        ctx.beginPath();
                        ctx.moveTo(s.x, s.y);
                        ctx.lineTo(e.x, e.y);
                        ctx.stroke();
                    }
                    ctx.globalAlpha = 1.0;
                }
            }
        }

        // --- 3D Drawing Primitives ---
        
        // Draws a chunky cube
        function drawBox(x, y, z, w, h, d, colorHex) {
            const p = project(x, y, z);
            if (!p.visible) return;
            const scale = p.scale;
            
            const hw = w * scale / 2;
            const hh = h * scale;
            const hd = d * scale / 2;

            // Shadow on ground (if y > 0)
            if (y > 0) {
                const groundP = project(x, 0, z);
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.beginPath();
                ctx.ellipse(groundP.x, groundP.y, hw * 1.1, hd * 0.8, 0, 0, Math.PI*2);
                ctx.fill();
            }

            // 1. Front Face (Main Color)
            ctx.fillStyle = colorHex;
            ctx.fillRect(p.x - hw, p.y - hh, hw*2, hh);

            // 2. Top Face (Lighter)
            ctx.fillStyle = lighten(colorHex, 0.5);
            ctx.beginPath();
            ctx.moveTo(p.x - hw, p.y - hh);
            ctx.lineTo(p.x - hw + hd, p.y - hh - hd); 
            ctx.lineTo(p.x + hw + hd, p.y - hh - hd); 
            ctx.lineTo(p.x + hw, p.y - hh);
            ctx.fill();

            // 3. Side Face (Darker)
            ctx.fillStyle = darken(colorHex, 0.3);
            ctx.beginPath();
            ctx.moveTo(p.x + hw, p.y - hh);
            ctx.lineTo(p.x + hw + hd, p.y - hh - hd);
            ctx.lineTo(p.x + hw + hd, p.y - hd);
            ctx.lineTo(p.x + hw, p.y);
            ctx.fill();
        }

        // --- The Game Object ---

        const game = {
            init: () => {
                // Initial Lanes
                for(let i=0; i<CONFIG.drawDistance; i++) {
                    lanes.push(new Lane(i));
                }
                
                // Input
                window.addEventListener('keydown', (e) => {
                    if(e.key === 'ArrowUp' || e.key === 'w') game.movePlayer(0, -1);
                    if(e.key === 'ArrowDown' || e.key === 's') game.movePlayer(0, 1);
                    if(e.key === 'ArrowLeft' || e.key === 'a') game.movePlayer(-1, 0);
                    if(e.key === 'ArrowRight' || e.key === 'd') game.movePlayer(1, 0);
                });

                requestAnimationFrame(game.loop);
            },

            movePlayer: (dx, dy) => {
                if (dx !== 0) {
                    player.x += dx * 80;
                    player.targetRot = dx * 0.4;
                    player.squish = 0.5; // Exaggerated squash
                }
                
                if (dy === -1) { // Forward
                    player.z += CONFIG.blockSize;
                    player.jumpTime = 14; 
                    score++;
                    document.getElementById('score').innerText = score;
                    
                    // Camera follow
                    camera.z += CONFIG.blockSize;
                    
                    // Infinite scroll logic
                    lanes.push(new Lane(lanes.length));
                    lanes.shift();
                } 
                else if (dy === 1) { // Back
                    if(player.z > 0) {
                        player.z -= CONFIG.blockSize;
                        camera.z -= CONFIG.blockSize;
                    }
                }
            },

            update: () => {
                time += 16;
                
                // Player Physics
                player.squish = lerp(player.squish, 1, 0.1);
                player.rot = lerp(player.rot, player.targetRot, 0.15);
                player.targetRot = lerp(player.targetRot, 0, 0.05);

                // Jump Arc
                if (player.jumpTime > 0) {
                    player.jumpTime--;
                    player.y = Math.sin((player.jumpTime / 14) * Math.PI) * 70;
                    player.onLog = false; 
                } else {
                    player.y = 0;
                    // Check logs
                    const currentLane = lanes.find(l => Math.abs(l.z - player.z) < 10);
                    if (currentLane && currentLane.type === 'water') {
                        let onLog = false;
                        currentLane.logs.forEach(log => {
                            if (player.x > log.x - log.length/2 && player.x < log.x + log.length/2) {
                                onLog = true;
                                player.x += log.speed; // Ride log
                            }
                        });
                        player.onLog = onLog;
                    } else {
                        player.onLog = false;
                    }
                }

                // Cloud Animation
                clouds.forEach(c => {
                    c.x -= c.speed;
                    if (c.x < -width * 2) c.x = width * 2;
                });

                lanes.forEach(lane => lane.update());
            },

            draw: () => {
                // 1. Sky (Gradient)
                const grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, CONFIG.colors.skyTop);
                grad.addColorStop(1, CONFIG.colors.skyBot);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                // 2. Draw Clouds (Parallax Background)
                ctx.fillStyle = CONFIG.colors.cloud;
                ctx.globalAlpha = 0.6;
                clouds.forEach(c => {
                    // Simple cloud projection without full 3D engine for perf
                    const scale = CONFIG.fov / (CONFIG.fov + c.z);
                    const cx = (c.x * scale) + (width / 2);
                    const cy = (c.y * scale) + (height * 0.35);
                    const r = 40 * scale * c.scale;
                    
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI*2);
                    ctx.arc(cx + r*0.8, cy - r*0.2, r*0.8, 0, Math.PI*2);
                    ctx.arc(cx - r*0.8, cy - r*0.2, r*0.8, 0, Math.PI*2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1.0;

                // 3. Collect Drawables
                let drawables = [];
                lanes.forEach(l => {
                    drawables.push({ type: 'lane', obj: l, z: l.z });
                    l.decorations.forEach(d => drawables.push({ type: 'deco', obj: d, z: l.z }));
                    l.vehicles.forEach(v => drawables.push({ type: 'vehicle', obj: v, z: l.z }));
                    l.logs.forEach(lg => drawables.push({ type: 'log', obj: lg, z: l.z }));
                });
                
                drawables.push({ type: 'player', z: player.z });

                // Sort by Z (Painter's Algorithm)
                drawables.sort((a, b) => a.z - b.z);

                // 4. Render Loop
                drawables.forEach(item => {
                    if (item.type === 'lane') item.obj.draw();
                    
                    if (item.type === 'deco') {
                        const d = item.obj;
                        if (d.type === 'tree') {
                            // Trunk
                            drawBox(d.x, 0, item.z, 25, 50, 25, CONFIG.colors.treeTrunk);
                            // Leaves (Layered Cubes for Low Poly look)
                            drawBox(d.x, 50, item.z, 70, 65, 70, CONFIG.colors.treeLeaves);
                            drawBox(d.x, 90, item.z, 50, 45, 50, lighten(CONFIG.colors.treeLeaves, 0.2));
                        } else {
                            // Bush
                            drawBox(d.x, 0, item.z, 45, 35, 45, CONFIG.colors.treeLeaves);
                            drawBox(d.x, 25, item.z, 35, 30, 35, lighten(CONFIG.colors.treeLeaves, 0.3));
                        }
                    }

                    if (item.type === 'vehicle') {
                        const v = item.obj;
                        // Wheels
                        drawBox(v.x - v.width/2.2, 0, item.z, 22, 25, 22, '#2d3436');
                        drawBox(v.x + v.width/2.2, 0, item.z, 22, 25, 22, '#2d3436');
                        // Body
                        drawBox(v.x, 30, item.z, v.width, v.height, v.depth, v.color);
                        // Roof/Window
                        drawBox(v.x, 30 + v.height/2, item.z, v.width * 0.85, v.height * 0.45, v.depth * 0.9, '#ffffff');
                    }

                    if (item.type === 'log') {
                        const l = item.obj;
                        drawBox(l.x, 10, item.z, l.length, l.height, l.width, '#e17055'); // Orange Log
                        // Log End detail
                        drawBox(l.x - l.length/2, 10, item.z, 15, l.height, l.width, '#fab1a0');
                    }

                    if (item.type === 'player') {
                        const p = project(player.x, player.y, player.z);
                        const s = p.scale;
                        
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        
                        // Squish & Rotate
                        const scaleY = player.squish;
                        const scaleX = 1 + (1 - player.squish) * 0.6;
                        ctx.scale(scaleX, scaleY);
                        ctx.rotate(player.rot);

                        // Shadow
                        ctx.fillStyle = 'rgba(0,0,0,0.2)';
                        ctx.beginPath();
                        ctx.ellipse(0, 0, 24*s, 14*s, 0, 0, Math.PI*2);
                        ctx.fill();

                        // Legs
                        ctx.fillStyle = '#fdcb6e'; // Yellow legs
                        ctx.fillRect(-14*s, -20*s, 12*s, 20*s);
                        ctx.fillRect(2*s, -20*s, 12*s, 20*s);

                        // Body (White)
                        drawBox(0, -20*s, 0, 46*s, 46*s, 46*s, '#ffffff');

                        // Comb (Red)
                        ctx.fillStyle = '#d63031';
                        ctx.fillRect(-10*s, -70*s, 20*s, 18*s);

                        // Beak (Orange)
                        ctx.fillStyle = '#e17055';
                        ctx.beginPath();
                        ctx.moveTo(26*s, -56*s);
                        ctx.lineTo(42*s, -48*s);
                        ctx.lineTo(26*s, -38*s);
                        ctx.fill();

                        // Eyes
                        ctx.fillStyle = '#2d3436';
                        ctx.beginPath();
                        ctx.arc(18*s, -64*s, 6*s, 0, Math.PI*2);
                        ctx.fill();
                        
                        // Blush
                        ctx.fillStyle = '#ff7675';
                        ctx.globalAlpha = 0.6;
                        ctx.beginPath();
                        ctx.arc(20*s, -50*s, 5*s, 0, Math.PI*2);
                        ctx.fill();
                        ctx.globalAlpha = 1.0;

                        ctx.restore();
                    }
                });
            },

            loop: () => {
                game.update();
                game.draw();
                requestAnimationFrame(game.loop);
            }
        };

        // Start
        game.init();

    </script>
</body>
</html>
