<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crossy Road - Visual Redesign</title>
    <style>
        :root {
            --sky-top: #2c3e50;
            --sky-bottom: #4ca1af;
            --ui-primary: #f1c40f;
            --ui-dark: #2c3e50;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #222;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* UI Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        /* HUD - Top */
        .hud-top {
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        .score-box {
            background: rgba(255, 255, 255, 0.95);
            color: var(--ui-dark);
            padding: 8px 12px;
            border-radius: 4px; /* Sharper corners per critique */
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
            text-align: center;
            min-width: 70px;
            transform: translateY(-10px);
            opacity: 0;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: relative;
            overflow: hidden;
        }

        .score-box::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: var(--ui-primary);
        }

        .score-label {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7f8c8d;
            margin-bottom: 2px;
        }

        .score-val {
            font-size: 28px;
            font-weight: 900;
            color: var(--ui-dark);
            line-height: 1;
        }

        .score-val.best {
            color: #e67e22;
        }

        /* Controls - Bottom Left */
        .controls-area {
            padding: 20px;
            display: flex;
            justify-content: flex-start; /* Align Left */
            align-items: flex-end;
            pointer-events: auto;
            margin-bottom: 20px;
            margin-left: 20px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: 64px 64px 64px;
            grid-template-rows: 64px 64px;
            gap: 12px;
        }

        .btn {
            width: 64px;
            height: 64px;
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            border-radius: 24px; /* Softer, organic corners */
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--ui-dark);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 
                0 8px 0 #bdc3c7, 
                0 10px 10px rgba(0,0,0,0.2);
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: translateY(8px);
            box-shadow: 
                0 0 0 #bdc3c7, 
                inset 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Inner tactile detail */
        .btn::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border-radius: 20px;
            background: rgba(255,255,255,0.4);
            pointer-events: none;
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        /* SVG Icons */
        .icon { width: 28px; height: 28px; fill: currentColor; filter: drop-shadow(0 1px 0 rgba(0,0,0,0.1)); }

        /* Canvas */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(20px) scale(0.8); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Vignette Overlay */
        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.4) 100%);
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="vignette"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="score-box">
                <div class="score-label">Score</div>
                <div class="score-val" id="score">0</div>
            </div>
            <div class="score-box" style="animation-delay: 0.1s;">
                <div class="score-label">Best</div>
                <div class="score-val best" id="best">12</div>
            </div>
        </div>

        <div class="controls-area">
            <div class="d-pad">
                <div class="btn btn-up" onclick="game.movePlayer(0, -1)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
                </div>
                <div class="btn btn-left" onclick="game.movePlayer(-1, 0)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z"/></svg>
                </div>
                <div class="btn btn-down" onclick="game.movePlayer(0, 1)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
                </div>
                <div class="btn btn-right" onclick="game.movePlayer(1, 0)">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        /**
         * CROSSY ROAD VISUAL REDESIGN
         * Focus: Depth, Material Grammar, Color, Hierarchy
         */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height;

        // --- Configuration ---
        const CONFIG = {
            fov: 280, // Slightly wider for better perspective
            blockSize: 100,
            lanes: 15,
            drawDistance: 25, // Draw further for depth
            colors: {
                skyTop: [44, 62, 80],   // Darker Blue/Grey
                skyBot: [76, 175, 188], // Teal-ish
                grassLight: [118, 201, 79], // #76C94F
                grassDark: [84, 169, 50],   // #54A932
                roadBase: [52, 59, 72],     // Dark Asphalt
                roadLine: [241, 196, 15],   // Yellow
                waterBase: [41, 128, 185],  // Blue
                waterLight: [135, 206, 250] // Light Blue
            }
        };

        // --- State ---
        let camera = { z: 0 };
        let player = { x: 0, y: 0, z: 0, targetY: 0, squish: 1, rot: 0, targetRot: 0, jumpTime: 0 };
        let lanes = [];
        let score = 0;
        let time = 0;

        // --- Resize Handling ---
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Math Helpers ---
        const project = (x, y, z) => {
            const scale = CONFIG.fov / (CONFIG.fov + z - camera.z);
            const x2d = (x * scale) + (width / 2);
            // Horizon line is roughly at height/2 + 100
            const y2d = (y * scale) + (height / 2) + 100; 
            return { x: x2d, y: y2d, scale: scale };
        };

        const lerp = (a, b, t) => a + (b - a) * t;
        const rand = (min, max) => Math.random() * (max - min) + min;

        // --- Color Helpers for Material Grammar ---
        // Takes RGB array, returns hex string
        const rgbToHex = (rgb) => {
            return "#" + ((1 << 24) + (rgb[0] << 16) + (rgb[1] << 8) + rgb[2]).toString(16).slice(1);
        };

        const lighten = (rgb, percent) => {
            const r = Math.min(255, rgb[0] + (255 - rgb[0]) * percent);
            const g = Math.min(255, rgb[1] + (255 - rgb[1]) * percent);
            const b = Math.min(255, rgb[2] + (255 - rgb[2]) * percent);
            return rgbToHex([r, g, b]);
        };

        const darken = (rgb, percent) => {
            const r = Math.max(0, rgb[0] * (1 - percent));
            const g = Math.max(0, rgb[1] * (1 - percent));
            const b = Math.max(0, rgb[2] * (1 - percent));
            return rgbToHex([r, g, b]);
        };

        // --- Classes ---

        class Lane {
            constructor(zIndex) {
                this.z = zIndex * CONFIG.blockSize;
                this.type = this.determineType(zIndex);
                this.vehicles = [];
                this.logs = [];
                this.decorations = [];

                // Generate content
                if (this.type === 'road') {
                    const count = Math.floor(rand(2, 4));
                    for(let i=0; i<count; i++) {
                        // Ensure cars don't spawn on top of each other initially
                        let safeX = false;
                        let v = {};
                        let attempts = 0;
                        while(!safeX && attempts < 10) {
                            v = {
                                x: rand(-width * 1.5, width * 1.5),
                                speed: rand(2, 5) * (Math.random() > 0.5 ? 1 : -1),
                                color: Math.random() > 0.5 ? [231, 76, 60] : [243, 156, 18], // Red or Orange
                                width: rand(50, 80),
                                height: rand(35, 50),
                                depth: rand(30, 40)
                            };
                            safeX = this.vehicles.every(oldV => Math.abs(oldV.x - v.x) > 150);
                            attempts++;
                        }
                        if(safeX) this.vehicles.push(v);
                    }
                } else if (this.type === 'water') {
                    const count = Math.floor(rand(2, 3));
                    for(let i=0; i<count; i++) {
                        this.logs.push({
                            x: rand(-width * 1.5, width * 1.5),
                            speed: rand(0.5, 2) * (Math.random() > 0.5 ? 1 : -1),
                            length: rand(120, 250),
                            height: 15,
                            width: 30
                        });
                    }
                } else {
                    // Grass decorations
                    const count = Math.floor(rand(2, 6));
                    for(let i=0; i<count; i++) {
                        this.decorations.push({
                            x: rand(-width/1.2, width/1.2),
                            type: Math.random() > 0.6 ? 'tree' : 'bush',
                            scale: rand(0.8, 1.5),
                            colorOffset: Math.random() > 0.5 ? 1 : -1 // Visual variety
                        });
                    }
                }
            }

            determineType(z) {
                if (z < 3) return 'grass'; // Safe start
                // Pattern: Grass, Road, Road, Water, Grass
                const mod = z % 5;
                if (mod === 1 || mod === 2) return 'road';
                if (mod === 3) return 'water';
                return 'grass';
            }

            update() {
                this.vehicles.forEach(v => {
                    v.x += v.speed;
                    if (v.x > width * 2) v.x = -width * 2;
                    if (v.x < -width * 2) v.x = width * 2;
                });
                this.logs.forEach(l => {
                    l.x += l.speed;
                    if (l.x > width * 2) l.x = -width * 2;
                    if (l.x < -width * 2) l.x = width * 2;
                });
            }

            draw() {
                const zRel = this.z - camera.z;
                if (zRel < -CONFIG.fov || zRel > CONFIG.drawDistance * CONFIG.blockSize) return;

                const pStart = project(-width * 2, 0, this.z);
                const pEnd = project(width * 2, 0, this.z);
                const pStartNext = project(-width * 2, 0, this.z + CONFIG.blockSize);
                const pEndNext = project(width * 2, 0, this.z + CONFIG.blockSize);

                // Draw Ground Plane
                ctx.beginPath();
                ctx.moveTo(pStart.x, pStart.y);
                ctx.lineTo(pEnd.x, pEnd.y);
                ctx.lineTo(pEndNext.x, pEndNext.y);
                ctx.lineTo(pStartNext.x, pStartNext.y);
                ctx.closePath();

                // Material Grammar: Base Color
                let baseColor;
                if (this.type === 'grass') {
                    baseColor = (Math.floor(this.z / CONFIG.blockSize) % 2 === 0) 
                        ? CONFIG.colors.grassLight 
                        : CONFIG.colors.grassDark;
                } else if (this.type === 'road') {
                    baseColor = CONFIG.colors.roadBase;
                } else if (this.type === 'water') {
                    baseColor = CONFIG.colors.waterBase;
                }
                ctx.fillStyle = rgbToHex(baseColor);
                ctx.fill();

                // Details
                if (this.type === 'road') {
                    // Road Lines
                    ctx.beginPath();
                    const lineStart = project(-width/4, 0, this.z);
                    const lineEnd = project(width/4, 0, this.z);
                    ctx.moveTo(lineStart.x, lineStart.y);
                    ctx.lineTo(lineEnd.x, lineEnd.y);
                    ctx.strokeStyle = `rgba(${CONFIG.colors.roadLine.join(',')}, 0.6)`;
                    ctx.lineWidth = Math.max(1, 4 * pStart.scale);
                    ctx.setLineDash([10 * pStart.scale, 15 * pStart.scale]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                } else if (this.type === 'water') {
                    // Water Ripples
                    ctx.strokeStyle = `rgba(${CONFIG.colors.waterLight.join(',')}, 0.4)`;
                    ctx.lineWidth = Math.max(1, 3 * pStart.scale);
                    for(let i=-1; i<=1; i+=0.6) {
                        const s = project(i * (width/3), 0, this.z);
                        const e = project(i * (width/3) + 60, 0, this.z);
                        ctx.beginPath();
                        ctx.moveTo(s.x, s.y);
                        ctx.lineTo(e.x, e.y);
                        ctx.stroke();
                    }
                }
            }
        }

        // --- 3D Drawing Primitives ---
        
        // Draws a low-poly box with lighting
        function drawBox(x, y, z, w, h, d, colorRGB, isLog = false) {
            const p = project(x, y, z);
            const scale = p.scale;
            
            const hw = w * scale / 2;
            const hh = h * scale;
            const hd = d * scale / 2;

            // 1. Front Face (Base Color)
            ctx.fillStyle = rgbToHex(colorRGB);
            ctx.fillRect(p.x - hw, p.y - hh, hw*2, hh);

            // 2. Top Face (Lighter)
            ctx.fillStyle = lighten(colorRGB, 0.3);
            ctx.beginPath();
            ctx.moveTo(p.x - hw, p.y - hh);
            ctx.lineTo(p.x - hw + hd, p.y - hh - hd); // Top Left
            ctx.lineTo(p.x + hw + hd, p.y - hh - hd); // Top Right
            ctx.lineTo(p.x + hw, p.y - hh);
            ctx.fill();

            // 3. Side Face (Darker) - Right side
            ctx.fillStyle = darken(colorRGB, 0.2);
            ctx.beginPath();
            ctx.moveTo(p.x + hw, p.y - hh);
            ctx.lineTo(p.x + hw + hd, p.y - hh - hd);
            ctx.lineTo(p.x + hw + hd, p.y - hd);
            ctx.lineTo(p.x + hw, p.y);
            ctx.fill();
            
            // Shadow on ground (simple ellipse)
            if (y > 0) {
                const groundP = project(x, 0, z);
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.beginPath();
                ctx.ellipse(groundP.x, groundP.y, hw * 1.2, hd * 0.8, 0, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // --- The Game Object ---

        const game = {
            init: () => {
                // Initial Lanes
                for(let i=0; i<CONFIG.drawDistance; i++) {
                    lanes.push(new Lane(i));
                }
                
                // Input
                window.addEventListener('keydown', (e) => {
                    if(e.key === 'ArrowUp') game.movePlayer(0, -1);
                    if(e.key === 'ArrowDown') game.movePlayer(0, 1);
                    if(e.key === 'ArrowLeft') game.movePlayer(-1, 0);
                    if(e.key === 'ArrowRight') game.movePlayer(1, 0);
                });

                requestAnimationFrame(game.loop);
            },

            movePlayer: (dx, dy) => {
                // Snap to grid X
                if (dx !== 0) {
                    player.x += dx * 60; // 60px grid snap
                    player.targetRot = dx * 0.3;
                    player.squish = 0.8; // Squish
                }
                
                // Move Z
                if (dy === -1) { // Forward
                    player.z += CONFIG.blockSize;
                    player.jumpTime = 10; // Trigger jump
                    score++;
                    document.getElementById('score').innerText = score;
                    camera.z += CONFIG.blockSize;
                    lanes.push(new Lane(lanes.length));
                    lanes.shift();
                } 
                else if (dy === 1) { // Back
                    if(player.z > 0) {
                        player.z -= CONFIG.blockSize;
                        camera.z -= CONFIG.blockSize;
                    }
                }
            },

            update: () => {
                time += 16;
                
                // Player Physics
                player.squish = lerp(player.squish, 1, 0.15);
                player.rot = lerp(player.rot, player.targetRot, 0.1);
                player.targetRot = lerp(player.targetRot, 0, 0.05);

                // Jump Arc
                if (player.jumpTime > 0) {
                    player.jumpTime--;
                    // Parabola
                    player.y = Math.sin((player.jumpTime / 10) * Math.PI) * 30;
                } else {
                    player.y = 0;
                    // Check logs
                    const currentLane = lanes.find(l => Math.abs(l.z - player.z) < 10);
                    if (currentLane && currentLane.type === 'water') {
                        let onLog = false;
                        currentLane.logs.forEach(log => {
                            if (player.x > log.x - log.length/2 && player.x < log.x + log.length/2) {
                                onLog = true;
                                player.x += log.speed; // Ride log
                            }
                        });
                        // If not on log, fall (reset for demo)
                        if (!onLog && player.y === 0) {
                            // Simple reset for demo
                            // player.z -= CONFIG.blockSize; 
                            // camera.z -= CONFIG.blockSize;
                        }
                    }
                }

                lanes.forEach(lane => lane.update());
            },

            draw: () => {
                // 1. Sky (Gradient)
                const grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, rgbToHex(CONFIG.colors.skyTop));
                grad.addColorStop(1, rgbToHex(CONFIG.colors.skyBot));
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                // 2. Collect Drawables
                let drawables = [];
                lanes.forEach(l => {
                    drawables.push({ type: 'lane', obj: l, z: l.z });
                    l.decorations.forEach(d => drawables.push({ type: 'deco', obj: d, z: l.z }));
                    l.vehicles.forEach(v => drawables.push({ type: 'vehicle', obj: v, z: l.z }));
                    l.logs.forEach(lg => drawables.push({ type: 'log', obj: lg, z: l.z }));
                });
                drawables.push({ type: 'player', z: player.z + player.y }); // Sort by height for jump

                // Sort by Z (Painter's Algorithm)
                drawables.sort((a, b) => a.z - b.z);

                // 3. Render Loop
                drawables.forEach(item => {
                    if (item.type === 'lane') item.obj.draw();
                    
                    if (item.type === 'deco') {
                        const d = item.obj;
                        if (d.type === 'tree') {
                            // Trunk
                            drawBox(d.x, 0, item.z, 12, 30, 12, [101, 67, 33]); // #654321
                            // Leaves (Double layer for low-poly look)
                            drawBox(d.x, 25, item.z, 40, 40, 40, [76, 175, 80]); // #4CAF50
                        } else {
                            // Bush
                            drawBox(d.x, 0, item.z, 25, 20, 25, [102, 187, 106]); // #66BB6A
                        }
                    }

                    if (item.type === 'vehicle') {
                        const v = item.obj;
                        // Wheels
                        drawBox(v.x - v.width/2.5, 0, item.z, 10, 15, 10, [30,30,30]);
                        drawBox(v.x + v.width/2.5, 0, item.z, 10, 15, 10, [30,30,30]);
                        // Body
                        drawBox(v.x, 15, item.z, v.width, v.height, v.depth, v.color);
                    }

                    if (item.type === 'log') {
                        const l = item.obj;
                        drawBox(l.x, 0, item.z, l.length, l.height, l.width, [121, 85, 72]); // Brown
                    }

                    if (item.type === 'player') {
                        const p = project(player.x, player.y, player.z);
                        const s = p.scale;
                        
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        
                        // Squish & Rotate
                        const scaleY = player.squish;
                        const scaleX = 1 + (1 - player.squish) * 0.6;
                        ctx.scale(scaleX, scaleY);
                        ctx.rotate(player.rot);

                        // Legs (Orange)
                        ctx.fillStyle = '#e67e22';
                        ctx.fillRect(-8*s, -15*s, 6*s, 15*s);
                        ctx.fillRect(2*s, -15*s, 6*s, 15*s);

                        // Body (White) - Low Poly Box
                        drawBox(0, -15*s, 0, 28*s, 28*s, 28*s, [245, 245, 245]);

                        // Comb (Red)
                        ctx.fillStyle = '#e74c3c';
                        ctx.fillRect(-4*s, -48*s, 8*s, 8*s);

                        // Beak (Yellow)
                        ctx.fillStyle = '#f1c40f';
                        ctx.beginPath();
                        ctx.moveTo(14*s, -35*s);
                        ctx.lineTo(24*s, -30*s);
                        ctx.lineTo(14*s, -25*s);
                        ctx.fill();

                        // Eyes (Black)
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(8*s, -40*s, 2.5*s, 0, Math.PI*2);
                        ctx.fill();

                        ctx.restore();
                    }
                });
            },

            loop: () => {
                game.update();
                game.draw();
                requestAnimationFrame(game.loop);
            }
        };

        // Start
        game.init();

    </script>
</body>
</html>
