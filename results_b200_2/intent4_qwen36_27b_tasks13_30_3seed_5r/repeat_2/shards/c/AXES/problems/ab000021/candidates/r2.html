<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Architecture & Information Flow</title>
<style>
    :root {
        /* Palette */
        --bg-dark: #050505;
        --bg-panel: #0f0f11;
        --border-panel: #222225;
        
        /* Signal Colors - Neon & High Contrast */
        --col-data: #00e5ff;      /* Cyan - Data */
        --col-instr: #ff0055;     /* Pink - Instructions */
        --col-ctrl: #00ff66;      /* Lime - Control */
        --col-io: #ffcc00;        /* Yellow - I/O */
        
        /* Typography */
        --text-main: #e0e0e0;
        --text-dim: #777777;
        --font-stack: "Inter", "Segoe UI", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", "Fira Code", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background-color: var(--bg-dark);
        /* Subtle Circuit Grid */
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 40px 40px;
        color: var(--text-main);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- UI Overlay --- */
    .ui-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 10;
        padding: 30px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        pointer-events: auto;
    }

    .title-block h1 {
        font-size: 1.8rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #fff;
        margin-bottom: 4px;
        text-transform: uppercase;
    }
    
    .title-block p {
        color: var(--text-dim);
        font-size: 0.85rem;
        font-family: var(--font-mono);
        max-width: 350px;
        line-height: 1.4;
    }

    /* Legend - Demoted, Dark, Bottom Left */
    .legend-panel {
        pointer-events: auto;
        background: rgba(15, 15, 17, 0.8);
        border: 1px solid var(--border-panel);
        padding: 12px 20px;
        border-radius: 4px;
        display: flex;
        gap: 24px;
        backdrop-filter: blur(4px);
        align-self: flex-start; /* Bottom Left */
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-dim);
    }

    .l-sample { width: 20px; height: 2px; position: relative; }
    .ls-data { background: var(--col-data); box-shadow: 0 0 5px var(--col-data); }
    .ls-instr { 
        background: transparent; 
        border-top: 2px dashed var(--col-instr); 
        box-shadow: 0 0 5px var(--col-instr);
    }
    .ls-ctrl { 
        background: transparent; 
        border-bottom: 2px dotted var(--col-ctrl); 
        box-shadow: 0 0 5px var(--col-ctrl);
    }
    .ls-io { background: var(--col-io); opacity: 0.8; }

    /* --- Diagram Container --- */
    #diagram-container {
        flex: 1;
        width: 100%;
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    svg {
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    /* --- Component Styling --- */
    .component-group {
        cursor: pointer;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .component-group:hover {
        transform: scale(1.02);
        z-index: 100;
    }

    /* Standard Peripheral Box */
    .comp-box {
        fill: var(--bg-panel);
        stroke: var(--border-panel);
        stroke-width: 1;
        filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
        transition: stroke 0.2s, filter 0.2s;
    }

    .component-group:hover .comp-box {
        stroke: #444;
        filter: drop-shadow(0 0 15px rgba(255,255,255,0.05));
    }

    /* CPU - The "Sun" */
    .cpu-container {
        /* Hexagon shape approximated via path in SVG, but styled here */
    }
    .cpu-bg {
        fill: #0a0a0c;
        stroke: var(--col-instr);
        stroke-width: 2;
        filter: drop-shadow(0 0 20px rgba(255, 0, 85, 0.15));
    }
    .cpu-inner {
        fill: none;
        stroke: rgba(255, 255, 255, 0.1);
        stroke-width: 1;
    }

    /* Typography */
    .lbl-main {
        fill: #fff;
        font-size: 14px;
        font-weight: 700;
        text-anchor: middle;
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }
    .lbl-sub {
        fill: var(--text-dim);
        font-size: 10px;
        font-family: var(--font-mono);
        text-anchor: middle;
        letter-spacing: 0.02em;
    }

    /* --- Path Styling --- */
    .path-bg {
        fill: none;
        stroke: #1a1a1c;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .path-active {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    /* 1. Data: Thick, Fluid */
    .p-data {
        stroke: var(--col-data);
        stroke-width: 2.5;
        filter: drop-shadow(0 0 4px var(--col-data));
    }

    /* 2. Instructions: Rigid, Segmented */
    .p-instr {
        stroke: var(--col-instr);
        stroke-width: 2;
        stroke-dasharray: 8 4;
        filter: drop-shadow(0 0 3px var(--col-instr));
    }

    /* 3. Control: Thin, Dashed */
    .p-ctrl {
        stroke: var(--col-ctrl);
        stroke-width: 1.5;
        stroke-dasharray: 2 4;
        opacity: 0.8;
    }

    /* 4. I/O: Bidirectional feel */
    .p-io {
        stroke: var(--col-io);
        stroke-width: 2;
        opacity: 0.7;
    }

    /* --- Animation --- */
    @keyframes flow { to { stroke-dashoffset: -24; } }
    
    .anim-flow { animation: flow 1s linear infinite; }

    .particle {
        fill: none;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 1 100; 
        filter: drop-shadow(0 0 6px currentColor);
        animation: particle-move 2s linear infinite;
    }

    @keyframes particle-move {
        0% { stroke-dashoffset: 100; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
    }

    /* --- Interaction States --- */
    .dimmed { opacity: 0.1; transition: opacity 0.3s; }
    .highlighted { opacity: 1; transition: opacity 0.3s; }
    
    .label-tag {
        font-size: 9px;
        font-family: var(--font-mono);
        fill: #fff;
        opacity: 0;
        pointer-events: none;
    }
    
    .label-bg { opacity: 0; }
    .highlighted .label-tag { opacity: 1; }
    .highlighted .label-bg { opacity: 1; }

</style>
</head>
<body>

    <div class="ui-layer">
        <header>
            <div class="title-block">
                <h1>System Architecture</h1>
                <p>Von Neumann Model: Information Flow, Control Signals, and I/O Topology.</p>
            </div>
        </header>

        <div class="legend-panel">
            <div class="legend-item">
                <div class="l-sample ls-data"></div>
                <span>Data Stream</span>
            </div>
            <div class="legend-item">
                <div class="l-sample ls-instr"></div>
                <span>Instructions</span>
            </div>
            <div class="legend-item">
                <div class="l-sample ls-ctrl"></div>
                <span>Control</span>
            </div>
            <div class="legend-item">
                <div class="l-sample ls-io"></div>
                <span>I/O Traffic</span>
            </div>
        </div>
    </div>

    <div id="diagram-container">
        <svg id="main-svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet">
            <defs>
                <!-- Arrowheads -->
                <marker id="arrow-data" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <path d="M0,0 L8,3 L0,6" fill="var(--col-data)" />
                </marker>
                <marker id="arrow-instr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <path d="M0,0 L8,3 L0,6" fill="var(--col-instr)" />
                </marker>
                <marker id="arrow-ctrl" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <path d="M0,0 L8,3 L0,6" fill="var(--col-ctrl)" />
                </marker>
                <marker id="arrow-io" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <path d="M0,0 L8,3 L0,6" fill="var(--col-io)" />
                </marker>
            </defs>
            
            <g id="paths-layer"></g>
            <g id="components-layer"></g>
        </svg>
    </div>

<script>
    const svg = document.getElementById('main-svg');
    const pathsLayer = document.getElementById('paths-layer');
    const componentsLayer = document.getElementById('components-layer');

    const createSVG = (tag, attrs) => {
        const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
        return el;
    };

    // --- Layout Configuration ---
    // Star Topology: CPU Center, Peripherals Radiating
    const components = [
        { id: 'cpu', label: 'CPU', sub: 'Processing Core', x: 500, y: 350, w: 160, h: 120, type: 'cpu', icon: 'cpu' },
        { id: 'ram', label: 'Memory', sub: 'High-Speed RAM', x: 500, y: 140, w: 130, h: 70, type: 'std', icon: 'ram' },
        { id: 'storage', label: 'Storage', sub: 'NVMe Array', x: 500, y: 560, w: 130, h: 70, type: 'std', icon: 'hdd' },
        { id: 'gpu', label: 'GPU', sub: 'Graphics Unit', x: 820, y: 350, w: 130, h: 90, type: 'std', icon: 'gpu' },
        { id: 'input', label: 'Input', sub: 'Peripherals', x: 180, y: 200, w: 120, h: 80, type: 'std', icon: 'mouse' },
        { id: 'output', label: 'Output', sub: 'Display', x: 180, y: 500, w: 120, h: 80, type: 'std', icon: 'monitor' },
        { id: 'network', label: 'Network', sub: 'Interface', x: 180, y: 350, w: 120, h: 80, type: 'std', icon: 'wifi' }
    ];

    const connections = [
        // CPU <-> RAM
        { from: 'ram', to: 'cpu', type: 'instr', label: 'Fetch' },
        { from: 'cpu', to: 'ram', type: 'data', label: 'Store' },
        
        // CPU <-> GPU
        { from: 'cpu', to: 'gpu', type: 'data', label: 'Payload' },
        { from: 'gpu', to: 'cpu', type: 'ctrl', label: 'IRQ' },
        
        // Storage <-> RAM
        { from: 'storage', to: 'ram', type: 'data', label: 'DMA Load' },
        
        // CPU <-> Peripherals
        { from: 'input', to: 'cpu', type: 'ctrl', label: 'Events' },
        { from: 'cpu', to: 'output', type: 'data', label: 'Pixels' },
        { from: 'network', to: 'cpu', type: 'io', label: 'Rx' },
        { from: 'cpu', to: 'network', type: 'io', label: 'Tx' },
        
        // CPU <-> Storage
        { from: 'storage', to: 'cpu', type: 'data', label: 'Direct' }
    ];

    // --- Drawing Helpers ---

    const drawIcon = (type, x, y) => {
        const g = createSVG('g', { transform: `translate(${x}, ${y})` });
        const s = "#888"; // Icon color
        const w = 1.5;
        
        if(type === 'cpu') {
            // Hexagon-ish Core
            g.appendChild(createSVG('path', { d:"M-15 -15 L15 -15 L25 0 L15 15 L-15 15 L-25 0 Z", fill:'none', stroke:'#fff', 'stroke-width':2 }));
            g.appendChild(createSVG('rect', { x:-6, y:-6, width:12, height:12, rx:1, fill:'#fff' }));
            // Pins
            g.appendChild(createSVG('path', { d:"M-25 -10v-4 M25 -10v-4 M-25 10v4 M25 10v4", stroke:'#fff', 'stroke-width':2, 'stroke-linecap':'round'}));
        } else if (type === 'ram') {
            g.appendChild(createSVG('rect', { x:-14, y:-8, width:28, height:16, rx:2, fill:'none', stroke:s, 'stroke-width':w }));
            g.appendChild(createSVG('path', { d:"M-14 -2h28 M-14 2h28", stroke:s, 'stroke-width':w }));
            g.appendChild(createSVG('path', { d:"M-8 -8v-3 M-2 -8v-3 M4 -8v-3 M10 -8v-3", stroke:s, 'stroke-width':w }));
        } else if (type === 'gpu') {
            g.appendChild(createSVG('rect', { x:-14, y:-10, width:28, height:20, rx:2, fill:'none', stroke:s, 'stroke-width':w }));
            g.appendChild(createSVG('circle', { cx:0, cy:0, r:4, fill:'none', stroke:s, 'stroke-width':w }));
            g.appendChild(createSVG('path', { d:"M-14 10v4 M-4 10v4 M4 10v4 M14 10v4", stroke:s, 'stroke-width':w }));
        } else if (type === 'hdd') {
            g.appendChild(createSVG('rect', { x:-14, y:-10, width:28, height:20, rx:2, fill:'none', stroke:s, 'stroke-width':w }));
            g.appendChild(createSVG('circle', { cx:0, cy:0, r:6, fill:'none', stroke:s, 'stroke-width':w }));
            g.appendChild(createSVG('path', { d:"M-14 6h28", stroke:s, 'stroke-width':w }));
        } else if (type === 'mouse') {
            g.appendChild(createSVG('rect', { x:-6, y:-10, width:12, height:20, rx:6, fill:'none', stroke:s, 'stroke-width':w }));
            g.appendChild(createSVG('line', { x1:0, y1:-10, x2:0, y2:0, stroke:s, 'stroke-width':w }));
        } else if (type === 'monitor') {
            g.appendChild(createSVG('rect', { x:-14, y:-10, width:28, height:16, rx:1, fill:'none', stroke:s, 'stroke-width':w }));
            g.appendChild(createSVG('path', { d:"M-6 6v4 M6 6v4 M-8 10h16", stroke:s, 'stroke-width':w }));
        } else if (type === 'wifi') {
            g.appendChild(createSVG('path', { d:"M-8 6a10 10 0 0 1 16 0 M-4 3a5 5 0 0 1 8 0 M0 0v2", fill:'none', stroke:s, 'stroke-width':w, 'stroke-linecap':'round'}));
        }
        return g;
    };

    // Orthogonal Routing (Manhattan style)
    const getPathD = (c1, c2) => {
        const isVert = Math.abs(c1.y - c2.y) > Math.abs(c1.x - c2.x);
        
        if (isVert) {
            // Vertical connection
            const midY = (c1.y + c2.y) / 2;
            const yDir = c2.y > c1.y ? 1 : -1;
            const startY = c1.y + (yDir * c1.h/2);
            const endY = c2.y - (yDir * c2.h/2);
            return `M ${c1.x} ${startY} L ${c1.x} ${midY} L ${c2.x} ${midY} L ${c2.x} ${endY}`;
        } else {
            // Horizontal connection
            const midX = (c1.x + c2.x) / 2;
            const xDir = c2.x > c1.x ? 1 : -1;
            const startX = c1.x + (xDir * c1.w/2);
            const endX = c2.x - (xDir * c2.w/2);
            return `M ${startX} ${c1.y} L ${midX} ${c1.y} L ${midX} ${c2.y} L ${endX} ${c2.y}`;
        }
    };

    // --- Render ---
    const compMap = {};

    // 1. Draw Components
    components.forEach(c => {
        const g = createSVG('g', { 
            class: 'component-group', 
            transform: `translate(${c.x - c.w/2}, ${c.y - c.h/2})`,
            'data-id': c.id
        });

        if (c.type === 'cpu') {
            // Draw Hexagon for CPU
            const cx = c.w/2, cy = c.h/2;
            const r = c.h/2;
            const pts = [];
            for(let i=0; i<6; i++) {
                const angle = (i * 60) * Math.PI / 180;
                pts.push(`${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)}`);
            }
            const poly = createSVG('polygon', { points: pts.join(' '), class: 'cpu-bg' });
            g.appendChild(poly);
            g.appendChild(createSVG('polygon', { points: pts.join(' '), class: 'cpu-inner', transform: `translate(${cx},${cy}) scale(0.85) translate(${-cx},${-cy})` }));
        } else {
            // Standard Box
            g.appendChild(createSVG('rect', { width: c.w, height: c.h, rx: 6, class: 'comp-box' }));
        }

        // Icon & Text
        const icon = drawIcon(c.icon, c.w/2, c.h/2 - 12);
        const t1 = createSVG('text', { x: c.w/2, y: c.h - 22, class: 'lbl-main' });
        t1.textContent = c.label;
        const t2 = createSVG('text', { x: c.w/2, y: c.h - 10, class: 'lbl-sub' });
        t2.textContent = c.sub;

        g.appendChild(icon);
        g.appendChild(t1);
        g.appendChild(t2);
        componentsLayer.appendChild(g);
        compMap[c.id] = c;
    });

    // 2. Draw Paths
    const pathGroups = {};

    connections.forEach((conn) => {
        const start = compMap[conn.from];
        const end = compMap[conn.to];
        const d = getPathD(start, end);

        const g = createSVG('g', { 
            class: 'connection-group', 
            'data-from': conn.from, 
            'data-to': conn.to,
            'data-type': conn.type
        });

        // Invisible Hit
        g.appendChild(createSVG('path', { d: d, stroke: 'transparent', 'stroke-width': 20, fill: 'none' }));
        
        // Background Trace
        g.appendChild(createSVG('path', { d: d, class: 'path-bg' }));

        // Active Line
        const activeClass = conn.type === 'instr' ? 'p-instr' : (conn.type === 'ctrl' ? 'p-ctrl' : (conn.type === 'io' ? 'p-io' : 'p-data'));
        const markerId = `arrow-${conn.type === 'instr' ? 'instr' : (conn.type === 'ctrl' ? 'ctrl' : (conn.type === 'io' ? 'io' : 'data'))}`;
        
        const activePath = createSVG('path', {
            d: d,
            class: `path-active ${activeClass}`,
            'marker-end': `url(#${markerId})`
        });
        
        // Add animation class if needed
        if(conn.type === 'instr' || conn.type === 'ctrl') activePath.classList.add('anim-flow');

        g.appendChild(activePath);

        // Particle
        const particle = createSVG('path', {
            d: d,
            class: `particle p-${conn.type === 'instr' ? 'instr' : (conn.type === 'ctrl' ? 'ctrl' : (conn.type === 'io' ? 'io' : 'data'))}`,
            style: `animation-delay: ${Math.random() * 2}s; animation-duration: ${1.5 + Math.random()}s; color: var(--col-${conn.type === 'instr' ? 'instr' : (conn.type === 'ctrl' ? 'ctrl' : (conn.type === 'io' ? 'io' : 'data'))});`
        });
        g.appendChild(particle);

        // Label
        // Calculate midpoint of the path for label placement
        // For orthogonal paths, the middle segment is usually the best place
        const midX = (start.x + end.x) / 2;
        const midY = (start.y + end.y) / 2;
        
        const lBg = createSVG('rect', { x: midX - 25, y: midY - 8, width: 50, height: 16, rx: 2, fill: '#000', stroke: '#333', 'stroke-width':1, class: 'label-bg' });
        const lTxt = createSVG('text', { x: midX, y: midY + 3, class: 'label-tag', 'text-anchor': 'middle' });
        lTxt.textContent = conn.label;

        g.appendChild(lBg);
        g.appendChild(lTxt);

        pathsLayer.appendChild(g);

        if (!pathGroups[conn.from]) pathGroups[conn.from] = [];
        if (!pathGroups[conn.to]) pathGroups[conn.to] = [];
        pathGroups[conn.from].push(g);
        pathGroups[conn.to].push(g);
    });

    // --- Interaction ---
    function highlightPath(activeId) {
        document.querySelectorAll('.connection-group').forEach(el => el.classList.add('dimmed'));
        document.querySelectorAll('.component-group').forEach(el => {
            if(el.getAttribute('data-id') !== activeId) el.classList.add('dimmed');
        });

        const activeComp = document.querySelector(`.component-group[data-id="${activeId}"]`);
        if(activeComp) activeComp.classList.remove('dimmed');

        const connectedGroups = pathGroups[activeId] || [];
        
        connectedGroups.forEach(g => {
            g.classList.remove('dimmed');
            g.classList.add('highlighted');
            
            // Speed up particles
            const p = g.querySelector('.particle');
            if(p) p.style.animationDuration = '0.6s';
        });

        connectedGroups.forEach(g => {
            const from = g.getAttribute('data-from');
            const to = g.getAttribute('data-to');
            if(from !== activeId) document.querySelector(`.component-group[data-id="${from}"]`).classList.remove('dimmed');
            if(to !== activeId) document.querySelector(`.component-group[data-id="${to}"]`).classList.remove('dimmed');
        });
    }

    function resetHighlight() {
        document.querySelectorAll('.connection-group').forEach(el => {
            el.classList.remove('dimmed', 'highlighted');
            el.querySelector('.particle').style.animationDuration = '';
        });
        document.querySelectorAll('.component-group').forEach(el => el.classList.remove('dimmed'));
    }

    document.querySelectorAll('.component-group').forEach(el => {
        el.addEventListener('mouseenter', () => highlightPath(el.getAttribute('data-id')));
        el.addEventListener('mouseleave', resetHighlight);
    });

</script>
</body>
</html>
