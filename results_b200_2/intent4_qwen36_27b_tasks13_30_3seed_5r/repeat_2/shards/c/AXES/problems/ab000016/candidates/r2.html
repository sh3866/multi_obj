<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLARIS RUNNER</title>
<style>
    :root {
        --bg-top: #2b1055;
        --bg-mid: #7597de;
        --bg-bot: #fea49f;
        --accent-sun: #ff3c00;
        --accent-sun-top: #ff9900;
        --ui-text: #ffffff;
        --ui-glow: #ffcc00;
        --font-retro: 'Courier New', Courier, monospace;
        --ground-line: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: #000;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: var(--font-retro);
        overflow: hidden;
    }

    /* --- GAME CONTAINER --- */
    .game-container {
        position: relative;
        width: 100%;
        max-width: 900px;
        aspect-ratio: 16/9;
        background: linear-gradient(to bottom, var(--bg-top) 0%, var(--bg-mid) 60%, var(--bg-bot) 100%);
        overflow: hidden;
        border: 2px solid #333;
        box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    /* --- LAYERS (Parallax) --- */
    .layer {
        position: absolute;
        left: 0;
        width: 200%;
        height: 100%;
        pointer-events: none;
    }

    /* The Sun */
    .sun {
        position: absolute;
        bottom: 35%;
        right: 25%;
        width: 120px;
        height: 120px;
        background: linear-gradient(to top, var(--accent-sun), var(--accent-sun-top));
        border-radius: 50%;
        box-shadow: 0 0 40px var(--accent-sun);
        z-index: 1;
    }
    /* Sun Retro Stripes */
    .sun::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: repeating-linear-gradient(
            to bottom,
            transparent 0%,
            transparent 60%,
            var(--bg-mid) 60%,
            var(--bg-mid) 62%,
            transparent 62%,
            transparent 75%,
            var(--bg-mid) 75%,
            var(--bg-mid) 76%,
            transparent 76%,
            transparent 90%,
            var(--bg-mid) 90%,
            var(--bg-mid) 92%
        );
        border-radius: 50%;
    }

    /* Distant Mountains */
    .mountains {
        bottom: 120px;
        height: 200px;
        background-image: 
            linear-gradient(135deg, rgba(20,10,40,0.9) 25%, transparent 25%),
            linear-gradient(225deg, rgba(20,10,40,0.9) 25%, transparent 25%),
            linear-gradient(315deg, rgba(20,10,40,0.9) 25%, transparent 25%),
            linear-gradient(45deg, rgba(20,10,40,0.9) 25%, transparent 25%);
        background-size: 100px 200px;
        background-position: 0 0, 50px 0, 0 0, 50px 0;
        animation: scrollParallax 30s linear infinite;
    }

    /* Mid-ground Hills */
    .hills {
        bottom: 120px;
        height: 100px;
        background: #1a0b2e;
        clip-path: polygon(0% 100%, 0% 40%, 15% 60%, 30% 20%, 45% 50%, 60% 10%, 75% 40%, 90% 15%, 100% 30%, 100% 100%);
        animation: scrollParallax 15s linear infinite;
    }

    @keyframes scrollParallax {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }

    /* --- GROUND --- */
    .ground {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 120px;
        background: #000;
        z-index: 10;
    }

    .ground-top-line {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: var(--ground-line);
        box-shadow: 0 0 10px var(--ground-line);
    }

    .ground-details {
        position: absolute;
        top: 0;
        left: 0;
        width: 200%;
        height: 100%;
        background-image: 
            linear-gradient(90deg, rgba(255,255,255,0.1) 2px, transparent 2px),
            linear-gradient(90deg, rgba(255,255,255,0.1) 2px, transparent 2px);
        background-size: 100px 100%, 40px 100%;
        background-position: 0 0, 20px 0;
        opacity: 0.3;
        animation: scrollGround 0.5s linear infinite;
    }

    @keyframes scrollGround {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100px); }
    }

    /* --- HUD --- */
    .hud {
        position: absolute;
        top: 20px;
        left: 20px;
        right: 20px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        z-index: 50;
        font-weight: bold;
        text-transform: uppercase;
        color: var(--ui-text);
        text-shadow: 2px 2px 0px #000;
    }

    .score-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .score-label {
        font-size: 0.75rem;
        opacity: 0.8;
        letter-spacing: 1px;
    }

    .score-val {
        font-size: 2rem;
        line-height: 1;
        letter-spacing: 2px;
    }

    .high-score {
        font-size: 0.9rem;
        color: var(--ui-glow);
        text-shadow: 0 0 5px var(--ui-glow);
    }

    .speed-group {
        text-align: right;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
    }

    .speed-val {
        font-size: 1.5rem;
        color: var(--ui-glow);
    }

    /* --- JUMP CUE --- */
    .jump-cue {
        position: absolute;
        bottom: 140px;
        left: 80px;
        display: flex;
        align-items: center;
        gap: 12px;
        opacity: 0; /* Hidden by default, shown via JS */
        transition: opacity 0.3s;
        z-index: 40;
        pointer-events: none;
    }

    .jump-cue.visible {
        opacity: 1;
        animation: floatCue 1.5s ease-in-out infinite;
    }

    .key-cap {
        width: 32px;
        height: 32px;
        background: rgba(0,0,0,0.5);
        border: 2px solid #fff;
        border-radius: 6px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 0.8rem;
        font-weight: bold;
        color: #fff;
        box-shadow: 0 4px 0 #000;
    }

    .cue-text {
        font-size: 1rem;
        color: #fff;
        text-shadow: 1px 1px 0 #000;
        letter-spacing: 1px;
    }

    @keyframes floatCue {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
    }

    /* --- GAMEPLAY ENTITIES --- */
    .viewport {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 20;
    }

    /* DINO */
    .dino {
        position: absolute;
        bottom: 120px; /* Ground Height */
        left: 80px;
        width: 60px;
        height: 60px;
    }

    .dino svg {
        fill: #000;
        width: 100%;
        height: 100%;
        /* Slight outline for readability against dark mountains */
        filter: drop-shadow(0px 0px 1px rgba(255,255,255,0.5)); 
    }

    .dino.running svg .leg-l { animation: runLeg 0.2s infinite alternate; transform-origin: bottom; }
    .dino.running svg .leg-r { animation: runLeg 0.2s infinite alternate-reverse; transform-origin: bottom; }
    
    @keyframes runLeg {
        0% { transform: rotate(-15deg); }
        100% { transform: rotate(15deg); }
    }

    /* OBSTACLES */
    .obstacle {
        position: absolute;
        bottom: 120px;
        will-change: transform;
    }
    
    .obstacle svg {
        width: 100%;
        height: 100%;
        fill: #000;
        filter: drop-shadow(0px 0px 1px rgba(255,255,255,0.5));
    }

    .obstacle.bird {
        bottom: 200px; /* Flying height */
        width: 50px;
        height: 30px;
    }
    
    .obstacle.bird svg .wing {
        animation: flap 0.4s infinite alternate;
        transform-origin: center;
    }
    @keyframes flap {
        from { transform: scaleY(1); }
        to { transform: scaleY(-1); }
    }

    /* --- OVERLAYS --- */
    .overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.3);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 90;
        backdrop-filter: blur(2px);
        transition: opacity 0.3s;
    }
    
    .overlay.hidden {
        opacity: 0;
        pointer-events: none;
    }

    .overlay h1 {
        font-size: 3.5rem;
        color: #fff;
        text-shadow: 4px 4px 0px #000;
        margin-bottom: 10px;
        letter-spacing: -2px;
        font-weight: 900;
        font-style: italic;
    }
    
    .overlay p {
        font-size: 1.2rem;
        color: #fff;
        background: #000;
        padding: 5px 15px;
        border-radius: 4px;
    }

    .blink-text {
        animation: blink 1s steps(2, start) infinite;
    }

    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
    }

    /* Scanlines */
    .scanlines {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 100;
    }

</style>
</head>
<body>

    <div class="game-container">
        
        <!-- Background Layers -->
        <div class="sun"></div>
        <div class="layer mountains"></div>
        <div class="layer hills"></div>

        <!-- HUD -->
        <div class="hud">
            <div class="score-group">
                <span class="score-label">SCORE</span>
                <span class="score-val" id="scoreDisplay">0000</span>
                <span class="high-score" id="highScoreDisplay">HI: 0420</span>
            </div>
            <div class="speed-group">
                <span class="score-label">VELOCITY</span>
                <div style="display:flex; align-items: baseline; gap: 4px;">
                    <span class="speed-val" id="speedDisplay">012</span>
                    <span style="font-size: 0.8rem; opacity: 0.8;">KM/H</span>
                </div>
            </div>
        </div>

        <!-- Jump Instruction -->
        <div class="jump-cue" id="jumpCue">
            <div class="key-cap">SP</div>
            <span class="cue-text">JUMP</span>
        </div>

        <!-- Viewport -->
        <div class="viewport" id="viewport">
            <!-- Player -->
            <div class="dino running" id="player">
                <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <path d="M58,10 H48 V18 H42 V24 H38 V18 H28 V10 H18 V30 H12 V40 H8 V50 H16 V58 H24 V50 H32 V58 H40 V42 H46 V36 H52 V26 H58 Z" />
                    <circle cx="46" cy="14" r="2" fill="#fff" /> <!-- Eye -->
                </svg>
            </div>
            
            <!-- Obstacles Container -->
            <div id="obstacleContainer"></div>
        </div>

        <!-- Ground -->
        <div class="ground">
            <div class="ground-top-line"></div>
            <div class="ground-details"></div>
        </div>

        <!-- Overlays -->
        <div class="overlay" id="startScreen">
            <h1>SOLARIS</h1>
            <p class="blink-text">PRESS SPACE TO START</p>
        </div>

        <div class="overlay hidden" id="gameOverScreen">
            <h1 style="color: #ff4444; text-shadow: 4px 4px 0 #000;">CRASHED</h1>
            <p>SCORE: <span id="finalScore">0000</span></p>
            <p class="blink-text" style="margin-top: 15px; font-size: 0.9rem;">PRESS SPACE TO RESTART</p>
        </div>

        <!-- Visual FX -->
        <div class="scanlines"></div>
    </div>

<script>
    // --- CONFIGURATION ---
    const GRAVITY = 0.6;
    const JUMP_FORCE = 13;
    const GAME_SPEED_START = 6;
    const SPAWN_RATE = 1800; 
    
    // --- STATE ---
    let isPlaying = false;
    let isGameOver = false;
    let score = 0;
    let highScore = 420;
    let gameSpeed = GAME_SPEED_START;
    let lastTime = 0;
    let spawnTimer = 0;
    let obstacles = [];
    let animationFrameId;

    // --- DOM ELEMENTS ---
    const player = document.getElementById('player');
    const viewport = document.getElementById('viewport');
    const obstacleContainer = document.getElementById('obstacleContainer');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const highScoreDisplay = document.getElementById('highScoreDisplay');
    const speedDisplay = document.getElementById('speedDisplay');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScore = document.getElementById('finalScore');
    const jumpCue = document.getElementById('jumpCue');
    const groundDetails = document.querySelector('.ground-details');

    // --- ASSETS (SVG TEMPLATES) ---
    const cactusSVG = `
        <svg viewBox="0 0 40 60" xmlns="http://www.w3.org/2000/svg">
            <path d="M10,60 V20 H5 V10 H15 V0 H25 V10 H35 V20 H30 V60 Z" />
        </svg>
    `;
    
    const birdSVG = `
        <svg viewBox="0 0 50 40" xmlns="http://www.w3.org/2000/svg">
            <path class="wing" d="M0,20 Q12,0 25,20 T50,20 Q37,40 25,20 T0,20" />
        </svg>
    `;

    // --- GAME LOOP ---
    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const deltaTime = timestamp - lastTime;
        lastTime = timestamp;

        if (isPlaying && !isGameOver) {
            update(deltaTime);
            draw();
            spawnManager(deltaTime);
        }

        animationFrameId = requestAnimationFrame(gameLoop);
    }

    // --- UPDATE LOGIC ---
    function update(dt) {
        // Physics for Dino
        if (player.dy !== undefined) {
            player.y += player.dy;
            player.dy -= GRAVITY; 

            // Floor collision
            if (player.y <= 0) {
                player.y = 0;
                player.dy = 0;
                player.classList.remove('jumping');
                player.classList.add('running');
            }
        }

        // Move Obstacles
        obstacles.forEach((obs, index) => {
            obs.x -= gameSpeed;
            
            // Cleanup off-screen
            if (obs.x < -100) {
                obs.element.remove();
                obstacles.splice(index, 1);
                score += 10;
                scoreDisplay.innerText = score.toString().padStart(4, '0');
                
                // Speed ramp
                if(score % 100 === 0) {
                    gameSpeed += 0.5;
                    let displaySpeed = Math.floor(12 + (gameSpeed - GAME_SPEED_START) * 2);
                    speedDisplay.innerText = displaySpeed.toString().padStart(3, '0');
                    
                    // Visual feedback for speed up
                    groundDetails.style.animationDuration = (0.5 - (gameSpeed/50)) + 's';
                }
            }

            // Collision Detection
            // Dino hitbox: Left: 80, Width: 64, Bottom: 120 + y
            const dinoRect = {
                l: 80 + 10, 
                r: 80 + 54,
                b: 120 + player.y,
                t: 120 + player.y + 54
            };

            const obsRect = {
                l: obs.x + 5,
                r: obs.x + obs.width - 5,
                b: obs.type === 'bird' ? 200 : 120, 
                t: obs.type === 'bird' ? 200 + 30 : 120 + obs.height
            };

            if (
                dinoRect.l < obsRect.r &&
                dinoRect.r > obsRect.l &&
                dinoRect.b < obsRect.t &&
                dinoRect.t > obsRect.b
            ) {
                gameOver();
            }
        });
    }

    // --- RENDER ---
    function draw() {
        // Render Dino
        player.style.bottom = (120 + player.y) + 'px';

        // Render Obstacles
        obstacles.forEach(obs => {
            obs.element.style.transform = `translateX(${obs.x}px)`;
        });
    }

    // --- SPAWNER ---
    function spawnManager(dt) {
        spawnTimer += dt;
        const currentSpawnRate = Math.max(800, SPAWN_RATE / (gameSpeed / GAME_SPEED_START));
        
        if (spawnTimer > currentSpawnRate) {
            spawnTimer = 0;
            createObstacle();
        }
    }

    function createObstacle() {
        const type = Math.random() > 0.6 ? 'bird' : 'cactus';
        const el = document.createElement('div');
        el.classList.add('obstacle');
        if (type === 'bird') el.classList.add('bird');
        
        el.innerHTML = type === 'cactus' ? cactusSVG : birdSVG;
        
        obstacleContainer.appendChild(el);

        obstacles.push({
            element: el,
            x: 1100,
            width: type === 'cactus' ? 40 : 50,
            height: type === 'cactus' ? 60 : 40,
            type: type
        });
    }

    // --- CONTROLS ---
    function jump() {
        if (!isPlaying && !isGameOver) {
            startGame();
            return;
        }
        if (isGameOver) {
            resetGame();
            return;
        }

        if (player.y === 0) {
            player.dy = JUMP_FORCE;
            player.classList.remove('running');
            player.classList.add('jumping');
        }
    }

    function startGame() {
        isPlaying = true;
        startScreen.classList.add('hidden');
        jumpCue.classList.add('visible');
        player.y = 0;
        player.dy = 0;
        player.classList.add('running');
        lastTime = 0;
    }

    function resetGame() {
        isGameOver = false;
        isPlaying = true;
        score = 0;
        gameSpeed = GAME_SPEED_START;
        
        scoreDisplay.innerText = '0000';
        speedDisplay.innerText = '012';
        highScoreDisplay.innerText = 'HI: ' + highScore.toString().padStart(4, '0');
        groundDetails.style.animationDuration = '0.5s';

        obstacles.forEach(o => o.element.remove());
        obstacles = [];
        
        gameOverScreen.classList.add('hidden');
        startScreen.classList.add('hidden');
        jumpCue.classList.add('visible');
        
        player.y = 0;
        player.dy = 0;
        player.classList.remove('jumping');
        player.classList.add('running');
        lastTime = 0;
    }

    function gameOver() {
        isGameOver = true;
        isPlaying = false;
        player.classList.remove('running');
        player.classList.remove('jumping');
        jumpCue.classList.remove('visible');
        
        if (score > highScore) {
            highScore = score;
            highScoreDisplay.innerText = 'HI: ' + highScore.toString().padStart(4, '0');
        }

        finalScore.innerText = score.toString().padStart(4, '0');
        gameOverScreen.classList.remove('hidden');
    }

    // --- INITIALIZATION ---
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            jump();
        }
    });

    // Initial Render
    requestAnimationFrame(gameLoop);

</script>
</body>
</html>
