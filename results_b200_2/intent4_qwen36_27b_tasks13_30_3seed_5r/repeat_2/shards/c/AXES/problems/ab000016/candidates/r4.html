<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLARIS RUNNER</title>
<style>
    /* --- RESET & BASE --- */
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    :root {
        /* Palette: High Contrast Synthwave / Modern Retro */
        --bg-top: #0f0c29;
        --bg-mid: #302b63;
        --bg-bot: #24243e;
        
        --accent-primary: #00f3ff; /* Cyan */
        --accent-secondary: #ff0055; /* Hot Pink */
        --accent-tertiary: #ffe600; /* Yellow */
        
        --ground-color: #050505;
        --grid-line: rgba(255, 0, 85, 0.4);
        
        --ui-text: #ffffff;
        
        /* System Font Stack for crisp rendering without external requests */
        --font-stack: 'Courier New', 'Lucida Console', monospace;
    }

    body {
        background-color: #000;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: var(--font-stack);
        overflow: hidden;
        color: var(--ui-text);
    }

    /* --- GAME CONTAINER --- */
    .game-container {
        position: relative;
        width: 100%;
        max-width: 1024px;
        aspect-ratio: 16/9;
        background: linear-gradient(to bottom, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bot) 100%);
        overflow: hidden;
        box-shadow: 0 0 100px rgba(0, 243, 255, 0.1);
        border: 1px solid #333;
    }

    /* --- BACKGROUND LAYERS --- */
    .layer {
        position: absolute;
        left: 0;
        width: 200%;
        height: 100%;
        pointer-events: none;
    }

    /* The Sun */
    .sun {
        position: absolute;
        bottom: 28%; /* Horizon placement */
        left: 50%;
        transform: translateX(-50%);
        width: 180px;
        height: 180px;
        background: linear-gradient(to top, var(--accent-secondary), var(--accent-tertiary));
        border-radius: 50%;
        z-index: 1;
        box-shadow: 0 0 40px rgba(255, 0, 85, 0.6);
        /* Retro Stripe Cutouts */
        -webkit-mask-image: linear-gradient(
            to bottom,
            black 0%, black 40%,
            transparent 40%, transparent 44%,
            black 44%, black 55%,
            transparent 55%, transparent 60%,
            black 60%, black 75%,
            transparent 75%, transparent 82%,
            black 82%, black 100%
        );
        mask-image: linear-gradient(
            to bottom,
            black 0%, black 40%,
            transparent 40%, transparent 44%,
            black 44%, black 55%,
            transparent 55%, transparent 60%,
            black 60%, black 75%,
            transparent 75%, transparent 82%,
            black 82%, black 100%
        );
    }

    /* Distant Mountains */
    .mountains {
        bottom: 150px;
        height: 300px;
        z-index: 2;
        background-color: #120a2e;
        opacity: 0.8;
        clip-path: polygon(
            0% 100%, 0% 60%, 5% 60%, 10% 40%, 15% 60%, 15% 70%, 
            20% 40%, 25% 60%, 30% 60%, 35% 30%, 40% 60%, 
            45% 60%, 50% 20%, 55% 60%, 60% 60%, 65% 40%, 
            70% 60%, 75% 50%, 80% 60%, 85% 30%, 90% 60%, 
            100% 60%, 100% 100%
        );
        animation: scrollParallax 60s linear infinite;
    }

    /* Mid-ground Hills */
    .hills {
        bottom: 150px;
        height: 200px;
        z-index: 3;
        background-color: #1a103c;
        clip-path: polygon(
            0% 100%, 0% 50%, 10% 70%, 20% 50%, 30% 70%, 
            40% 40%, 50% 60%, 60% 30%, 70% 60%, 80% 40%, 
            90% 60%, 100% 50%, 100% 100%
        );
        animation: scrollParallax 30s linear infinite;
    }

    @keyframes scrollParallax {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }

    /* --- GROUND (Layered & Grid) --- */
    .ground {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 150px;
        background: var(--ground-color);
        z-index: 10;
        /* Horizon Line */
        border-top: 2px solid var(--accent-secondary);
        box-shadow: 0 -10px 20px rgba(255, 0, 85, 0.2);
    }

    /* Perspective Grid */
    .ground-details {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
            linear-gradient(0deg, transparent 24%, var(--grid-line) 25%, var(--grid-line) 26%, transparent 27%,transparent 74%, var(--grid-line) 75%, var(--grid-line) 76%, transparent 77%, transparent),
            linear-gradient(90deg, transparent 24%, var(--grid-line) 25%, var(--grid-line) 26%, transparent 27%,transparent 74%, var(--grid-line) 75%, var(--grid-line) 76%, transparent 77%, transparent);
        background-size: 60px 60px;
        /* Fade out at top */
        mask-image: linear-gradient(to bottom, transparent, black 40%);
        -webkit-mask-image: linear-gradient(to bottom, transparent, black 40%);
        animation: scrollGround 0.5s linear infinite;
    }

    @keyframes scrollGround {
        0% { background-position: 0 0; }
        100% { background-position: -60px 0; }
    }

    /* --- HUD (Refined & High Contrast) --- */
    .hud {
        position: absolute;
        top: 24px;
        right: 24px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        z-index: 50;
        font-family: var(--font-stack);
    }

    .score-row {
        display: flex;
        align-items: baseline;
        gap: 16px;
        text-shadow: 2px 2px 0px #000;
    }

    .score-val {
        font-size: 2.5rem;
        font-weight: bold;
        line-height: 1;
        color: var(--ui-text);
        letter-spacing: -2px;
    }

    .speed-indicator {
        font-size: 1rem;
        color: var(--accent-primary);
        border: 1px solid var(--accent-primary);
        padding: 2px 6px;
        border-radius: 2px;
        background: rgba(0,0,0,0.5);
    }

    .high-score {
        font-size: 0.8rem;
        color: rgba(255,255,255,0.6);
        text-shadow: 1px 1px 0 #000;
        margin-top: 2px;
        letter-spacing: 1px;
    }

    /* --- GAME TITLE (Integrated) --- */
    .game-title {
        position: absolute;
        top: 24px;
        left: 24px;
        z-index: 50;
        font-size: 1.2rem;
        font-weight: 900;
        color: var(--accent-primary);
        text-transform: uppercase;
        letter-spacing: 2px;
        text-shadow: 2px 2px 0px #000;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .game-title::before {
        content: '';
        display: block;
        width: 12px;
        height: 12px;
        background: var(--accent-secondary);
        box-shadow: 2px 2px 0 #000;
    }

    /* --- JUMP CUE (Footer) --- */
    .jump-cue {
        position: absolute;
        bottom: 24px;
        left: 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 40;
        pointer-events: none;
        opacity: 0.9;
        text-shadow: 2px 2px 0 #000;
        transition: opacity 0.3s;
    }

    .key-cap {
        width: 32px;
        height: 32px;
        background: #fff;
        border: 2px solid #000;
        border-radius: 4px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 0.8rem;
        font-weight: bold;
        color: #000;
        box-shadow: 0 4px 0 #888;
    }

    .cue-text {
        font-size: 0.9rem;
        font-weight: bold;
        letter-spacing: 1px;
    }

    /* --- GAMEPLAY ENTITIES --- */
    .viewport {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 20;
    }

    /* DINO (Refined Silhouette) */
    .dino {
        position: absolute;
        bottom: 150px;
        left: 100px;
        width: 50px;
        height: 50px;
    }

    .dino svg {
        fill: var(--accent-primary); /* Neon Cyan */
        width: 100%;
        height: 100%;
        filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.5));
    }

    .dino.running svg .leg-l { animation: runLeg 0.1s infinite alternate; transform-origin: 18px 46px; }
    .dino.running svg .leg-r { animation: runLeg 0.1s infinite alternate-reverse; transform-origin: 26px 46px; }
    
    @keyframes runLeg {
        0% { transform: translateY(-2px) rotate(-10deg); }
        100% { transform: translateY(2px) rotate(10deg); }
    }

    /* OBSTACLES */
    .obstacle {
        position: absolute;
        bottom: 150px;
        will-change: transform;
    }
    
    .obstacle svg {
        width: 100%;
        height: 100%;
        fill: var(--accent-secondary); /* Hot Pink */
        filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.5));
    }

    .obstacle.bird {
        bottom: 250px;
        width: 50px;
        height: 30px;
    }
    
    .obstacle.bird svg .wing {
        animation: flap 0.2s infinite alternate;
        transform-origin: center;
    }
    @keyframes flap {
        from { transform: scaleY(1); }
        to { transform: scaleY(-0.5) translateY(2px); }
    }

    /* --- OVERLAYS --- */
    .overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(15, 12, 41, 0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 90;
        backdrop-filter: blur(4px);
        transition: opacity 0.3s;
    }
    
    .overlay.hidden {
        opacity: 0;
        pointer-events: none;
    }

    .overlay h1 {
        font-size: 3rem;
        color: #fff;
        text-shadow: 4px 4px 0px var(--accent-secondary);
        margin-bottom: 20px;
        letter-spacing: 4px;
        text-transform: uppercase;
        font-weight: 900;
        text-align: center;
    }
    
    .overlay p {
        font-size: 1.2rem;
        color: var(--accent-primary);
        background: #000;
        padding: 12px 24px;
        border: 2px solid var(--accent-primary);
        font-weight: bold;
        box-shadow: 4px 4px 0 rgba(0, 243, 255, 0.4);
    }

    .blink-text {
        animation: blink 1s steps(2, start) infinite;
    }

    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
    }

    /* --- CRT SCANLINES --- */
    .scanlines {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(
            to bottom,
            rgba(255,255,255,0),
            rgba(255,255,255,0) 2px,
            rgba(0,0,0,0.1) 2px,
            rgba(0,0,0,0.1) 4px
        );
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 100;
        box-shadow: inset 0 0 80px rgba(0,0,0,0.6);
    }

</style>
</head>
<body>

    <div class="game-container">
        
        <!-- Background Layers -->
        <div class="sun"></div>
        <div class="layer mountains"></div>
        <div class="layer hills"></div>

        <!-- Header HUD -->
        <div class="game-title">SOLARIS</div>
        
        <div class="hud">
            <div class="score-row">
                <span class="score-val" id="scoreDisplay">0000</span>
                <span class="speed-indicator" id="speedDisplay">012</span>
            </div>
            <span class="high-score" id="highScoreDisplay">HI 0420</span>
        </div>

        <!-- Footer UI -->
        <div class="jump-cue" id="jumpCue">
            <div class="key-cap">SP</div>
            <span class="cue-text">JUMP</span>
        </div>

        <!-- Viewport -->
        <div class="viewport" id="viewport">
            <!-- Player -->
            <div class="dino running" id="player">
                <!-- Crisp Vector Dino -->
                <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <!-- Body Silhouette -->
                    <path d="M52,10 H42 V14 H38 V20 H34 V14 H24 V6 H12 V26 H6 V36 H2 V46 H10 V54 H18 V46 H26 V54 H34 V38 H40 V32 H46 V22 H52 Z" />
                    <!-- Eye -->
                    <rect x="44" y="12" width="4" height="4" fill="#000" />
                    <!-- Legs (Animated) -->
                    <path class="leg-l" d="M14,54 V64 H20 V54 Z" />
                    <path class="leg-r" d="M22,54 V64 H28 V54 Z" />
                </svg>
            </div>
            
            <!-- Obstacles Container -->
            <div id="obstacleContainer"></div>
        </div>

        <!-- Ground -->
        <div class="ground">
            <div class="ground-details"></div>
        </div>

        <!-- Overlays -->
        <div class="overlay" id="startScreen">
            <h1>SOLARIS RUNNER</h1>
            <p class="blink-text">PRESS SPACE TO START</p>
        </div>

        <div class="overlay hidden" id="gameOverScreen">
            <h1 style="color: var(--accent-secondary);">CRASHED</h1>
            <p>SCORE: <span id="finalScore">0000</span></p>
            <p class="blink-text" style="margin-top: 20px; font-size: 0.9rem; background: transparent; border: none; color: #fff; text-shadow: 1px 1px 0 #000;">PRESS SPACE TO RESTART</p>
        </div>

        <!-- Visual FX -->
        <div class="scanlines"></div>
    </div>

<script>
    // --- CONFIGURATION ---
    const GRAVITY = 0.65;
    const JUMP_FORCE = 14;
    const GAME_SPEED_START = 8;
    const SPAWN_RATE = 1600; 
    
    // --- STATE ---
    let isPlaying = false;
    let isGameOver = false;
    let score = 0;
    let highScore = 420;
    let gameSpeed = GAME_SPEED_START;
    let lastTime = 0;
    let spawnTimer = 0;
    let obstacles = [];
    let animationFrameId;

    // --- DOM ELEMENTS ---
    const player = document.getElementById('player');
    const viewport = document.getElementById('viewport');
    const obstacleContainer = document.getElementById('obstacleContainer');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const highScoreDisplay = document.getElementById('highScoreDisplay');
    const speedDisplay = document.getElementById('speedDisplay');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScore = document.getElementById('finalScore');
    const jumpCue = document.getElementById('jumpCue');
    const groundDetails = document.querySelector('.ground-details');

    // --- ASSETS (SVG TEMPLATES) ---
    const cactusSVG = `
        <svg viewBox="0 0 40 60" xmlns="http://www.w3.org/2000/svg">
            <path d="M12,60 V20 H6 V10 H16 V0 H24 V10 H34 V20 H28 V60 Z" />
        </svg>
    `;
    
    const birdSVG = `
        <svg viewBox="0 0 50 40" xmlns="http://www.w3.org/2000/svg">
            <path class="wing" d="M0,20 Q12,0 25,20 T50,20 Q37,40 25,20 T0,20" />
        </svg>
    `;

    // --- GAME LOOP ---
    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const deltaTime = timestamp - lastTime;
        lastTime = timestamp;

        if (isPlaying && !isGameOver) {
            update(deltaTime);
            draw();
            spawnManager(deltaTime);
        }

        animationFrameId = requestAnimationFrame(gameLoop);
    }

    // --- UPDATE LOGIC ---
    function update(dt) {
        // Physics for Dino
        if (player.dy !== undefined) {
            player.y += player.dy;
            player.dy -= GRAVITY; 

            // Floor collision
            if (player.y <= 0) {
                player.y = 0;
                player.dy = 0;
                player.classList.remove('jumping');
                player.classList.add('running');
            }
        }

        // Move Obstacles
        obstacles.forEach((obs, index) => {
            obs.x -= gameSpeed;
            
            // Cleanup off-screen
            if (obs.x < -100) {
                obs.element.remove();
                obstacles.splice(index, 1);
                score += 10;
                scoreDisplay.innerText = score.toString().padStart(4, '0');
                
                // Speed ramp
                if(score % 100 === 0) {
                    gameSpeed += 0.5;
                    let displaySpeed = Math.floor(12 + (gameSpeed - GAME_SPEED_START) * 2);
                    speedDisplay.innerText = displaySpeed.toString().padStart(3, '0');
                    
                    // Visual feedback for speed up (faster ground scroll)
                    groundDetails.style.animationDuration = (0.5 - (gameSpeed/150)) + 's';
                }
            }

            // Collision Detection
            // Tighter Hitbox for better gameplay feel
            const dinoRect = {
                l: 100 + 14, 
                r: 100 + 46,
                b: 150 + player.y,
                t: 150 + player.y + 46
            };

            const obsRect = {
                l: obs.x + 6,
                r: obs.x + obs.width - 6,
                b: obs.type === 'bird' ? 250 : 150, // Match CSS bottom
                t: obs.type === 'bird' ? 250 + 30 : 150 + obs.height
            };

            if (
                dinoRect.l < obsRect.r &&
                dinoRect.r > obsRect.l &&
                dinoRect.b < obsRect.t &&
                dinoRect.t > obsRect.b
            ) {
                gameOver();
            }
        });
    }

    // --- RENDER ---
    function draw() {
        // Render Dino
        player.style.bottom = (150 + player.y) + 'px';

        // Render Obstacles
        obstacles.forEach(obs => {
            obs.element.style.transform = `translateX(${obs.x}px)`;
        });
    }

    // --- SPAWNER ---
    function spawnManager(dt) {
        spawnTimer += dt;
        // Randomize spawn slightly to feel organic
        const currentSpawnRate = Math.max(800, SPAWN_RATE / (gameSpeed / GAME_SPEED_START));
        
        if (spawnTimer > currentSpawnRate) {
            spawnTimer = 0;
            createObstacle();
        }
    }

    function createObstacle() {
        // Logic to prevent impossible jumps (simple random for now)
        const type = Math.random() > 0.6 ? 'bird' : 'cactus';
        const el = document.createElement('div');
        el.classList.add('obstacle');
        if (type === 'bird') el.classList.add('bird');
        
        el.innerHTML = type === 'cactus' ? cactusSVG : birdSVG;
        
        obstacleContainer.appendChild(el);

        obstacles.push({
            element: el,
            x: 1100,
            width: type === 'cactus' ? 40 : 50,
            height: type === 'cactus' ? 60 : 40,
            type: type
        });
    }

    // --- CONTROLS ---
    function jump() {
        if (!isPlaying && !isGameOver) {
            startGame();
            return;
        }
        if (isGameOver) {
            resetGame();
            return;
        }

        if (player.y === 0) {
            player.dy = JUMP_FORCE;
            player.classList.remove('running');
            player.classList.add('jumping');
        }
    }

    function startGame() {
        isPlaying = true;
        startScreen.classList.add('hidden');
        jumpCue.style.opacity = '0.5'; // Dim cue slightly during play
        player.y = 0;
        player.dy = 0;
        player.classList.add('running');
        lastTime = 0;
    }

    function resetGame() {
        isGameOver = false;
        isPlaying = true;
        score = 0;
        gameSpeed = GAME_SPEED_START;
        
        scoreDisplay.innerText = '0000';
        speedDisplay.innerText = '012';
        highScoreDisplay.innerText = 'HI ' + highScore.toString().padStart(4, '0');
        groundDetails.style.animationDuration = '0.5s';

        obstacles.forEach(o => o.element.remove());
        obstacles = [];
        
        gameOverScreen.classList.add('hidden');
        startScreen.classList.add('hidden');
        jumpCue.style.opacity = '0.5';
        
        player.y = 0;
        player.dy = 0;
        player.classList.remove('jumping');
        player.classList.add('running');
        lastTime = 0;
    }

    function gameOver() {
        isGameOver = true;
        isPlaying = false;
        player.classList.remove('running');
        player.classList.remove('jumping');
        jumpCue.style.opacity = '0'; // Hide cue on crash
        
        if (score > highScore) {
            highScore = score;
            highScoreDisplay.innerText = 'HI ' + highScore.toString().padStart(4, '0');
        }

        finalScore.innerText = score.toString().padStart(4, '0');
        gameOverScreen.classList.remove('hidden');
    }

    // --- INITIALIZATION ---
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            jump();
        }
    });

    // Initial Render
    requestAnimationFrame(gameLoop);

</script>
</body>
</html>
