<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON RUNNER // REVISED</title>
<style>
    :root {
        --bg-deep: #050505;
        --bg-horizon: #111;
        --accent-cyan: #00f3ff;
        --accent-pink: #ff0055;
        --accent-yellow: #ffe600;
        --text-main: #ffffff;
        --text-dim: #888;
        --font-stack: 'Courier New', Courier, monospace;
        
        --ground-height: 60px;
        --game-width: 1000px;
        --game-height: 500px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: #000;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: var(--font-stack);
        overflow: hidden;
        color: var(--text-main);
    }

    /* --- LAYOUT CONTAINER --- */
    .game-machine {
        position: relative;
        width: 100%;
        max-width: var(--game-width);
        height: 100%;
        max-height: var(--game-height);
        background: linear-gradient(to bottom, #0b0c10 0%, #1f2833 100%);
        overflow: hidden;
        border: 1px solid #333;
        box-shadow: 0 0 50px rgba(0, 243, 255, 0.1);
    }

    /* --- BACKGROUND LAYERS (Parallax) --- */
    .layer {
        position: absolute;
        left: 0;
        bottom: var(--ground-height);
        width: 200%; /* Double width for looping */
        height: 100%;
        pointer-events: none;
    }

    /* Stars / Dust */
    .layer-dust {
        background-image: 
            radial-gradient(white 1px, transparent 1px),
            radial-gradient(white 1px, transparent 1px);
        background-size: 50px 50px, 150px 150px;
        background-position: 0 0, 25px 25px;
        opacity: 0.2;
        animation: scrollBg 10s linear infinite;
    }

    /* Distant Dunes */
    .layer-dunes {
        bottom: 0;
        height: 150px;
        background: 
            linear-gradient(135deg, transparent 50%, rgba(20,20,20,0.8) 50%),
            linear-gradient(225deg, transparent 50%, rgba(30,30,30,0.9) 50%);
        background-size: 100px 100px;
        opacity: 0.6;
        animation: scrollBg 20s linear infinite;
    }
    
    /* Mid-ground Dunes */
    .layer-mid {
        bottom: 0;
        height: 80px;
        background: 
            linear-gradient(135deg, #000 50%, transparent 50%),
            linear-gradient(225deg, #000 50%, transparent 50%);
        background-size: 200px 100px;
        opacity: 0.8;
        animation: scrollBg 12s linear infinite;
    }

    @keyframes scrollBg {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }

    /* --- GROUND --- */
    .ground {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: var(--ground-height);
        background: #050505;
        border-top: 2px solid var(--accent-cyan);
        box-shadow: 0 0 15px var(--accent-cyan);
        z-index: 10;
    }

    /* Moving grid on ground */
    .ground-grid {
        position: absolute;
        top: 0;
        left: 0;
        width: 200%;
        height: 100%;
        background-image: linear-gradient(90deg, rgba(0, 243, 255, 0.2) 1px, transparent 1px);
        background-size: 40px 100%;
        animation: scrollGround 0.5s linear infinite;
    }

    @keyframes scrollGround {
        0% { transform: translateX(0); }
        100% { transform: translateX(-40px); }
    }

    /* --- HUD --- */
    .hud {
        position: absolute;
        top: 20px;
        left: 20px;
        right: 20px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        z-index: 50;
        text-transform: uppercase;
        font-weight: bold;
        letter-spacing: 1px;
    }

    .hud-left {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }

    .hud-right {
        text-align: right;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
    }

    .label {
        font-size: 0.7rem;
        color: var(--text-dim);
        letter-spacing: 2px;
    }

    .score-val {
        font-size: 1.8rem;
        color: var(--text-main);
        text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
    }

    .high-val {
        color: var(--accent-yellow);
        font-size: 1rem;
    }

    .speed-box {
        display: flex;
        align-items: baseline;
        gap: 5px;
    }
    .speed-val { font-size: 1.5rem; color: var(--accent-pink); }
    .speed-unit { font-size: 0.8rem; color: var(--text-dim); }

    /* --- JUMP INSTRUCTION (Diegetic) --- */
    .jump-cue {
        position: absolute;
        bottom: 80px; /* Just above ground */
        left: 80px; /* Near Dino */
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0.8;
        animation: pulseCue 2s infinite;
    }
    
    .key-icon {
        width: 24px;
        height: 24px;
        border: 2px solid var(--text-main);
        border-radius: 4px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 0.8rem;
        box-shadow: 0 4px 0 rgba(0,0,0,0.5);
    }

    .cue-text {
        font-size: 0.8rem;
        letter-spacing: 2px;
        font-weight: bold;
    }

    @keyframes pulseCue {
        0%, 100% { opacity: 0.4; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-5px); }
    }

    /* --- GAMEPLAY ENTITIES --- */
    .viewport {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 20;
    }

    /* DINO */
    .dino {
        position: absolute;
        bottom: var(--ground-height);
        left: 80px;
        width: 64px;
        height: 64px;
        will-change: transform;
    }

    .dino svg {
        fill: var(--accent-cyan);
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 8px var(--accent-cyan));
    }

    /* Animations */
    .dino.running svg {
        animation: bob 0.3s infinite alternate;
    }
    @keyframes bob {
        from { transform: translateY(0); }
        to { transform: translateY(-4px); }
    }

    /* OBSTACLES */
    .obstacle {
        position: absolute;
        bottom: var(--ground-height);
        width: 40px;
        height: 60px;
        will-change: transform;
    }
    
    .obstacle svg {
        width: 100%;
        height: 100%;
        fill: var(--accent-pink);
        filter: drop-shadow(0 0 5px var(--accent-pink));
    }

    .obstacle.bird {
        bottom: 120px; /* Flying height */
        width: 50px;
        height: 40px;
    }

    /* --- SCANLINES OVERLAY --- */
    .scanlines {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px);
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 100;
        opacity: 0.3;
    }
    
    /* CRT Vignette */
    .vignette {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
        pointer-events: none;
        z-index: 99;
    }

    /* --- GAME OVER / START OVERLAY --- */
    .overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.6);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 90;
        backdrop-filter: blur(2px);
        transition: opacity 0.3s;
    }
    
    .overlay.hidden {
        opacity: 0;
        pointer-events: none;
    }

    .overlay h1 {
        font-size: 3rem;
        color: var(--accent-cyan);
        text-shadow: 0 0 10px var(--accent-cyan);
        margin-bottom: 10px;
        letter-spacing: 5px;
    }
    
    .overlay p {
        font-size: 1.2rem;
        color: var(--text-main);
        margin-bottom: 20px;
    }

    .blink-text {
        animation: blink 1s infinite;
    }

    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
    }

</style>
</head>
<body>

    <div class="game-machine">
        
        <!-- Background Layers -->
        <div class="layer layer-dust"></div>
        <div class="layer layer-dunes"></div>
        <div class="layer layer-mid"></div>

        <!-- HUD -->
        <div class="hud">
            <div class="hud-left">
                <span class="label">SCORE</span>
                <span class="score-val" id="scoreDisplay">0000</span>
                <span class="high-val" id="highScoreDisplay">HI: 0420</span>
            </div>
            <div class="hud-right">
                <div class="speed-box">
                    <span class="speed-val" id="speedDisplay">012</span>
                    <span class="speed-unit">KM/H</span>
                </div>
            </div>
        </div>

        <!-- Diegetic Jump Instruction -->
        <div class="jump-cue" id="jumpCue">
            <div class="key-icon">SP</div>
            <span class="cue-text">JUMP</span>
        </div>

        <!-- Viewport (Game Area) -->
        <div class="viewport" id="viewport">
            <!-- Player -->
            <div class="dino running" id="player">
                <!-- Crisp Silhouette SVG -->
                <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <path d="M58,10 H48 V18 H42 V24 H38 V18 H28 V10 H18 V30 H12 V40 H8 V50 H16 V58 H24 V50 H32 V58 H40 V42 H46 V36 H52 V26 H58 Z" />
                    <circle cx="46" cy="14" r="2" fill="#000" /> <!-- Eye -->
                </svg>
            </div>
            
            <!-- Obstacles Container -->
            <div id="obstacleContainer"></div>
        </div>

        <!-- Ground -->
        <div class="ground">
            <div class="ground-grid"></div>
        </div>

        <!-- Overlays -->
        <div class="overlay" id="startScreen">
            <h1>NEON RUNNER</h1>
            <p class="blink-text">PRESS SPACE TO INITIATE</p>
        </div>

        <div class="overlay hidden" id="gameOverScreen">
            <h1 style="color: var(--accent-pink); text-shadow: 0 0 10px var(--accent-pink);">CRASHED</h1>
            <p>FINAL SCORE: <span id="finalScore">0000</span></p>
            <p class="blink-text" style="font-size: 0.9rem; margin-top: 20px;">PRESS SPACE TO REBOOT</p>
        </div>

        <!-- Visual Effects -->
        <div class="scanlines"></div>
        <div class="vignette"></div>
    </div>

<script>
    // --- CONFIGURATION ---
    const GRAVITY = 0.6;
    const JUMP_FORCE = 12;
    const GAME_SPEED_START = 6;
    const SPAWN_RATE = 1500; 
    
    // --- STATE ---
    let isPlaying = false;
    let isGameOver = false;
    let score = 0;
    let highScore = 420;
    let gameSpeed = GAME_SPEED_START;
    let lastTime = 0;
    let spawnTimer = 0;
    let obstacles = [];
    let animationFrameId;

    // --- DOM ELEMENTS ---
    const player = document.getElementById('player');
    const viewport = document.getElementById('viewport');
    const obstacleContainer = document.getElementById('obstacleContainer');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const highScoreDisplay = document.getElementById('highScoreDisplay');
    const speedDisplay = document.getElementById('speedDisplay');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScore = document.getElementById('finalScore');
    const jumpCue = document.getElementById('jumpCue');

    // --- ASSETS (SVG TEMPLATES) ---
    const cactusSVG = `
        <svg viewBox="0 0 40 60" xmlns="http://www.w3.org/2000/svg">
            <path d="M10,60 V20 H5 V10 H15 V0 H25 V10 H35 V20 H30 V60 Z" />
        </svg>
    `;
    
    const birdSVG = `
        <svg viewBox="0 0 50 40" xmlns="http://www.w3.org/2000/svg">
            <path d="M0,20 Q12,0 25,20 T50,20 Q37,40 25,20 T0,20" />
        </svg>
    `;

    // --- GAME LOOP ---
    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const deltaTime = timestamp - lastTime;
        lastTime = timestamp;

        if (isPlaying && !isGameOver) {
            update(deltaTime);
            draw();
            spawnManager(deltaTime);
        }

        animationFrameId = requestAnimationFrame(gameLoop);
    }

    // --- UPDATE LOGIC ---
    function update(dt) {
        // Physics for Dino
        if (player.dy !== undefined) {
            player.y += player.dy;
            player.dy -= GRAVITY; 

            // Floor collision
            if (player.y <= 0) {
                player.y = 0;
                player.dy = 0;
                player.classList.remove('jumping');
                player.classList.add('running');
            }
        }

        // Move Obstacles
        obstacles.forEach((obs, index) => {
            obs.x -= gameSpeed;
            
            // Cleanup off-screen
            if (obs.x < -100) {
                obs.element.remove();
                obstacles.splice(index, 1);
                score += 10;
                scoreDisplay.innerText = score.toString().padStart(4, '0');
                
                // Increase speed slightly every 50 points
                if(score % 50 === 0) {
                    gameSpeed += 0.5;
                    // Update speed display
                    let displaySpeed = Math.floor(12 + (gameSpeed - GAME_SPEED_START) * 2);
                    speedDisplay.innerText = displaySpeed.toString().padStart(3, '0');
                }
            }

            // Collision Detection
            // Dino hitbox: Left: 80, Width: 64, Bottom: 60 + y
            const dinoRect = {
                l: 80 + 10, // padding
                r: 80 + 54,
                b: 60 + player.y,
                t: 60 + player.y + 54
            };

            const obsRect = {
                l: obs.x + 5,
                r: obs.x + obs.width - 5,
                b: obs.type === 'bird' ? 120 : 60, 
                t: obs.type === 'bird' ? 120 + 30 : 60 + obs.height
            };

            // AABB Collision
            if (
                dinoRect.l < obsRect.r &&
                dinoRect.r > obsRect.l &&
                dinoRect.b < obsRect.t &&
                dinoRect.t > obsRect.b
            ) {
                gameOver();
            }
        });
    }

    // --- RENDER ---
    function draw() {
        // Render Dino
        player.style.bottom = (60 + player.y) + 'px';

        // Render Obstacles
        obstacles.forEach(obs => {
            obs.element.style.transform = `translateX(${obs.x}px)`;
        });
    }

    // --- SPAWNER ---
    function spawnManager(dt) {
        spawnTimer += dt;
        // Adjust spawn rate based on speed
        const currentSpawnRate = Math.max(800, SPAWN_RATE / (gameSpeed / GAME_SPEED_START));
        
        if (spawnTimer > currentSpawnRate) {
            spawnTimer = 0;
            createObstacle();
        }
    }

    function createObstacle() {
        // Randomize obstacle type (70% cactus, 30% bird)
        const type = Math.random() > 0.7 ? 'bird' : 'cactus';
        const el = document.createElement('div');
        el.classList.add('obstacle');
        if (type === 'bird') el.classList.add('bird');
        
        el.innerHTML = type === 'cactus' ? cactusSVG : birdSVG;
        
        obstacleContainer.appendChild(el);

        obstacles.push({
            element: el,
            x: 1100, // Start off screen
            width: type === 'cactus' ? 40 : 50,
            height: type === 'cactus' ? 60 : 40,
            type: type
        });
    }

    // --- CONTROLS ---
    function jump() {
        if (!isPlaying && !isGameOver) {
            startGame();
            return;
        }
        if (isGameOver) {
            resetGame();
            return;
        }

        // Only jump if on ground
        if (player.y === 0) {
            player.dy = JUMP_FORCE;
            player.classList.remove('running');
            player.classList.add('jumping');
        }
    }

    function startGame() {
        isPlaying = true;
        startScreen.classList.add('hidden');
        jumpCue.style.opacity = '1'; // Show jump cue
        player.y = 0;
        player.dy = 0;
        player.classList.add('running');
        lastTime = 0; // Reset time delta
    }

    function resetGame() {
        isGameOver = false;
        isPlaying = true;
        score = 0;
        gameSpeed = GAME_SPEED_START;
        
        scoreDisplay.innerText = '0000';
        speedDisplay.innerText = '012';
        highScoreDisplay.innerText = 'HI: ' + highScore.toString().padStart(4, '0');
        
        // Clear obstacles
        obstacles.forEach(o => o.element.remove());
        obstacles = [];
        
        gameOverScreen.classList.add('hidden');
        startScreen.classList.add('hidden');
        jumpCue.style.opacity = '1';
        
        player.y = 0;
        player.dy = 0;
        player.classList.remove('jumping');
        player.classList.add('running');
        lastTime = 0;
    }

    function gameOver() {
        isGameOver = true;
        isPlaying = false;
        player.classList.remove('running');
        player.classList.remove('jumping');
        jumpCue.style.opacity = '0'; // Hide jump cue
        
        // Update High Score
        if (score > highScore) {
            highScore = score;
            highScoreDisplay.innerText = 'HI: ' + highScore.toString().padStart(4, '0');
        }

        finalScore.innerText = score.toString().padStart(4, '0');
        gameOverScreen.classList.remove('hidden');
    }

    // --- INITIALIZATION ---
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault(); // Prevent scrolling
            jump();
        }
    });

    // Initial Render
    requestAnimationFrame(gameLoop);

</script>
</body>
</html>
