<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLARIS RUNNER</title>
<style>
    /* --- RESET & BASE --- */
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    :root {
        /* Palette: Dusk/Sunset */
        --bg-top: #1a0b2e;
        --bg-mid: #431256;
        --bg-bot: #ba4272;
        --accent-sun: #ff5f6d;
        --accent-sun-core: #ffc371;
        --ground-fg: #12051f;
        --ground-bg: #2d1245;
        --ui-text: #ffffff;
        --ui-accent: #00f3ff; /* Cyan for UI pop */
        --font-pixel: 'Courier New', 'Lucida Console', monospace; /* System Monospace as fallback */
    }

    body {
        background-color: #050505;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: var(--font-pixel);
        overflow: hidden;
    }

    /* --- GAME CONTAINER --- */
    .game-container {
        position: relative;
        width: 100%;
        max-width: 960px;
        aspect-ratio: 16/9;
        background: linear-gradient(to bottom, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bot) 100%);
        overflow: hidden;
        border: 4px solid #000;
        box-shadow: 0 0 0 2px #333, 0 0 50px rgba(0,0,0,0.8);
        image-rendering: pixelated; /* Crucial for retro feel */
    }

    /* --- BACKGROUND LAYERS --- */
    .layer {
        position: absolute;
        left: 0;
        width: 200%;
        height: 100%;
        pointer-events: none;
    }

    /* The Sun (Vaporwave Style) */
    .sun {
        position: absolute;
        bottom: 38%; /* Just above horizon */
        right: 30%;
        width: 140px;
        height: 140px;
        background: linear-gradient(to top, var(--accent-sun), var(--accent-sun-core));
        border-radius: 50%;
        z-index: 1;
        /* Hard retro stripes using mask or background tricks */
        box-shadow: 0 0 20px rgba(255, 95, 109, 0.4);
    }
    
    .sun::after {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        border-radius: 50%;
        background: repeating-linear-gradient(
            to bottom,
            transparent 0%,
            transparent 85%,
            var(--bg-mid) 85%,
            var(--bg-mid) 88%,
            transparent 88%,
            transparent 92%,
            var(--bg-mid) 92%,
            var(--bg-mid) 93%,
            transparent 93%,
            transparent 100%
        );
    }

    /* Distant Mountains (Slower Parallax) */
    .mountains {
        bottom: 120px;
        height: 250px;
        z-index: 2;
        background-color: var(--ground-bg);
        /* Creating jagged peaks with CSS gradients */
        clip-path: polygon(
            0% 100%, 
            0% 60%, 5% 60%, 10% 40%, 15% 60%, 15% 70%, 
            20% 40%, 25% 60%, 30% 60%, 35% 30%, 40% 60%, 
            45% 60%, 50% 20%, 55% 60%, 60% 60%, 65% 40%, 
            70% 60%, 75% 50%, 80% 60%, 85% 30%, 90% 60%, 
            100% 60%, 100% 100%
        );
        animation: scrollParallax 40s linear infinite;
        opacity: 0.8;
    }

    /* Mid-ground Hills (Faster Parallax) */
    .hills {
        bottom: 120px;
        height: 150px;
        z-index: 3;
        background-color: #1e0a30;
        clip-path: polygon(
            0% 100%, 0% 50%, 10% 70%, 20% 50%, 30% 70%, 
            40% 40%, 50% 60%, 60% 30%, 70% 60%, 80% 40%, 
            90% 60%, 100% 50%, 100% 100%
        );
        animation: scrollParallax 20s linear infinite;
    }

    @keyframes scrollParallax {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }

    /* --- GROUND --- */
    .ground {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 120px;
        background: var(--ground-fg);
        z-index: 10;
        border-top: 4px solid #000;
    }

    /* The textured surface of the ground */
    .ground-details {
        position: absolute;
        top: 4px;
        left: 0;
        width: 200%;
        height: 100%;
        /* Pixelated noise pattern */
        background-image: 
            linear-gradient(90deg, rgba(255,255,255,0.05) 2px, transparent 2px),
            linear-gradient(90deg, rgba(0,0,0,0.3) 2px, transparent 2px);
        background-size: 60px 100%, 20px 100%;
        animation: scrollGround 0.4s linear infinite;
    }

    @keyframes scrollGround {
        0% { transform: translateX(0); }
        100% { transform: translateX(-60px); }
    }

    /* --- HUD (Unified & High Contrast) --- */
    .hud {
        position: absolute;
        top: 20px;
        right: 30px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        z-index: 50;
        color: var(--ui-text);
        /* Hard Shadow for readability */
        text-shadow: 2px 2px 0px #000;
    }

    .score-block {
        background: rgba(0, 0, 0, 0.6);
        border: 2px solid #fff;
        padding: 8px 16px;
        min-width: 180px;
        box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
    }

    .score-label {
        font-size: 0.7rem;
        color: var(--ui-accent);
        letter-spacing: 2px;
        margin-bottom: 2px;
        display: block;
    }

    .score-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
    }

    .score-val {
        font-size: 1.8rem;
        font-weight: bold;
        letter-spacing: 2px;
        line-height: 1;
    }

    .speed-val {
        font-size: 1rem;
        color: var(--ui-accent);
    }

    .high-score {
        font-size: 0.8rem;
        color: #ccc;
        margin-top: 4px;
        display: block;
        text-align: right;
        border-top: 1px solid rgba(255,255,255,0.3);
        padding-top: 4px;
    }

    /* --- TITLE (Demoted & Retro) --- */
    .game-title {
        position: absolute;
        top: 20px;
        left: 30px;
        z-index: 50;
        font-size: 1.5rem;
        font-weight: 900;
        color: #fff;
        letter-spacing: 4px;
        text-shadow: 3px 3px 0px #000;
        font-style: normal;
    }

    /* --- JUMP CUE (Persistent) --- */
    .jump-cue {
        position: absolute;
        bottom: 150px;
        left: 80px;
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 40;
        pointer-events: none;
        opacity: 0.8;
    }

    .key-cap {
        width: 40px;
        height: 40px;
        background: #fff;
        border: 4px solid #000;
        border-radius: 4px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1rem;
        font-weight: bold;
        color: #000;
        box-shadow: 0 4px 0 #000;
    }

    .cue-text {
        font-size: 1.2rem;
        color: #fff;
        text-shadow: 2px 2px 0 #000;
        font-weight: bold;
        letter-spacing: 1px;
    }

    /* --- GAMEPLAY ENTITIES --- */
    .viewport {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 20;
    }

    /* DINO */
    .dino {
        position: absolute;
        bottom: 120px;
        left: 80px;
        width: 64px;
        height: 64px;
        transition: bottom 0.1s;
    }

    .dino svg {
        fill: #000; /* Silhouette */
        width: 100%;
        height: 100%;
        /* Outline for contrast against dark mountains */
        filter: drop-shadow(2px 2px 0px rgba(255,255,255,0.3)); 
    }

    /* Leg Animation */
    .dino.running svg .leg-l { animation: runLeg 0.15s infinite alternate; transform-origin: 24px 56px; }
    .dino.running svg .leg-r { animation: runLeg 0.15s infinite alternate-reverse; transform-origin: 32px 56px; }
    
    @keyframes runLeg {
        0% { transform: rotate(-20deg) translateY(-2px); }
        100% { transform: rotate(20deg) translateY(0px); }
    }

    /* OBSTACLES */
    .obstacle {
        position: absolute;
        bottom: 120px;
        will-change: transform;
    }
    
    .obstacle svg {
        width: 100%;
        height: 100%;
        fill: #000;
        filter: drop-shadow(2px 2px 0px rgba(255,255,255,0.3));
    }

    .obstacle.bird {
        bottom: 220px; /* Higher flying */
        width: 50px;
        height: 40px;
    }
    
    .obstacle.bird svg .wing {
        animation: flap 0.3s infinite alternate;
        transform-origin: center;
    }
    @keyframes flap {
        from { transform: scaleY(1); }
        to { transform: scaleY(-0.8) translateY(4px); }
    }

    /* --- OVERLAYS --- */
    .overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.4);
        display: flex;
        flex-direction: column;
        justify-content: flex-end; /* Push content to bottom */
        align-items: center;
        padding-bottom: 15%;
        z-index: 90;
        backdrop-filter: blur(1px);
        transition: opacity 0.3s;
    }
    
    .overlay.hidden {
        opacity: 0;
        pointer-events: none;
    }

    .overlay h1 {
        font-size: 2rem;
        color: #fff;
        text-shadow: 3px 3px 0px #000;
        margin-bottom: 15px;
        letter-spacing: 2px;
        font-weight: 900;
    }
    
    .overlay p {
        font-size: 1rem;
        color: #fff;
        background: #000;
        padding: 10px 20px;
        border: 2px solid #fff;
        font-weight: bold;
    }

    .blink-text {
        animation: blink 1s steps(2, start) infinite;
    }

    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
    }

    /* --- SCANLINES (Tactile) --- */
    .scanlines {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(
            to bottom,
            rgba(255,255,255,0),
            rgba(255,255,255,0) 2px,
            rgba(0,0,0,0.15) 2px,
            rgba(0,0,0,0.15) 4px
        );
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 100;
        /* Subtle grain */
        box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
    }

</style>
</head>
<body>

    <div class="game-container">
        
        <!-- Background Layers -->
        <div class="sun"></div>
        <div class="layer mountains"></div>
        <div class="layer hills"></div>

        <!-- Title (Demoted) -->
        <div class="game-title">SOLARIS</div>

        <!-- HUD (Unified Block) -->
        <div class="hud">
            <div class="score-block">
                <div class="score-row">
                    <span class="score-val" id="scoreDisplay">0000</span>
                    <span class="speed-val"><span id="speedDisplay">012</span> KM/H</span>
                </div>
                <span class="score-label">SCORE / VELOCITY</span>
                <span class="high-score" id="highScoreDisplay">HI: 0420</span>
            </div>
        </div>

        <!-- Jump Instruction (Persistent) -->
        <div class="jump-cue" id="jumpCue">
            <div class="key-cap">SP</div>
            <span class="cue-text">JUMP</span>
        </div>

        <!-- Viewport -->
        <div class="viewport" id="viewport">
            <!-- Player -->
            <div class="dino running" id="player">
                <!-- Refined Pixel Dino SVG -->
                <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <!-- Body -->
                    <path d="M56,12 H46 V16 H42 V22 H38 V16 H28 V8 H16 V28 H10 V38 H6 V48 H14 V56 H22 V48 H30 V56 H38 V40 H44 V34 H50 V24 H56 Z" />
                    <!-- Eye -->
                    <circle cx="48" cy="14" r="2" fill="#fff" />
                    <!-- Legs (Animated) -->
                    <path class="leg-l" d="M18,56 V64 H24 V56 Z" />
                    <path class="leg-r" d="M26,56 V64 H32 V56 Z" />
                </svg>
            </div>
            
            <!-- Obstacles Container -->
            <div id="obstacleContainer"></div>
        </div>

        <!-- Ground -->
        <div class="ground">
            <div class="ground-details"></div>
        </div>

        <!-- Overlays -->
        <div class="overlay" id="startScreen">
            <h1>SOLARIS RUNNER</h1>
            <p class="blink-text">PRESS SPACE TO START</p>
        </div>

        <div class="overlay hidden" id="gameOverScreen">
            <h1 style="color: #ff4444; text-shadow: 3px 3px 0 #000;">CRASHED</h1>
            <p>SCORE: <span id="finalScore">0000</span></p>
            <p class="blink-text" style="margin-top: 15px; font-size: 0.9rem; background: transparent; border: none; color: #fff; text-shadow: 1px 1px 0 #000;">PRESS SPACE TO RESTART</p>
        </div>

        <!-- Visual FX -->
        <div class="scanlines"></div>
    </div>

<script>
    // --- CONFIGURATION ---
    const GRAVITY = 0.6;
    const JUMP_FORCE = 13;
    const GAME_SPEED_START = 6;
    const SPAWN_RATE = 1800; 
    
    // --- STATE ---
    let isPlaying = false;
    let isGameOver = false;
    let score = 0;
    let highScore = 420;
    let gameSpeed = GAME_SPEED_START;
    let lastTime = 0;
    let spawnTimer = 0;
    let obstacles = [];
    let animationFrameId;

    // --- DOM ELEMENTS ---
    const player = document.getElementById('player');
    const viewport = document.getElementById('viewport');
    const obstacleContainer = document.getElementById('obstacleContainer');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const highScoreDisplay = document.getElementById('highScoreDisplay');
    const speedDisplay = document.getElementById('speedDisplay');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScore = document.getElementById('finalScore');
    const jumpCue = document.getElementById('jumpCue');
    const groundDetails = document.querySelector('.ground-details');

    // --- ASSETS (SVG TEMPLATES) ---
    const cactusSVG = `
        <svg viewBox="0 0 40 60" xmlns="http://www.w3.org/2000/svg">
            <path d="M10,60 V20 H5 V10 H15 V0 H25 V10 H35 V20 H30 V60 Z" />
        </svg>
    `;
    
    const birdSVG = `
        <svg viewBox="0 0 50 40" xmlns="http://www.w3.org/2000/svg">
            <path class="wing" d="M0,20 Q12,0 25,20 T50,20 Q37,40 25,20 T0,20" />
        </svg>
    `;

    // --- GAME LOOP ---
    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const deltaTime = timestamp - lastTime;
        lastTime = timestamp;

        if (isPlaying && !isGameOver) {
            update(deltaTime);
            draw();
            spawnManager(deltaTime);
        }

        animationFrameId = requestAnimationFrame(gameLoop);
    }

    // --- UPDATE LOGIC ---
    function update(dt) {
        // Physics for Dino
        if (player.dy !== undefined) {
            player.y += player.dy;
            player.dy -= GRAVITY; 

            // Floor collision
            if (player.y <= 0) {
                player.y = 0;
                player.dy = 0;
                player.classList.remove('jumping');
                player.classList.add('running');
            }
        }

        // Move Obstacles
        obstacles.forEach((obs, index) => {
            obs.x -= gameSpeed;
            
            // Cleanup off-screen
            if (obs.x < -100) {
                obs.element.remove();
                obstacles.splice(index, 1);
                score += 10;
                scoreDisplay.innerText = score.toString().padStart(4, '0');
                
                // Speed ramp
                if(score % 100 === 0) {
                    gameSpeed += 0.5;
                    let displaySpeed = Math.floor(12 + (gameSpeed - GAME_SPEED_START) * 2);
                    speedDisplay.innerText = displaySpeed.toString().padStart(3, '0');
                    
                    // Visual feedback for speed up (faster ground scroll)
                    groundDetails.style.animationDuration = (0.4 - (gameSpeed/100)) + 's';
                }
            }

            // Collision Detection
            // Dino hitbox: Left: 80, Width: 64, Bottom: 120 + y
            // Adjusted for tighter gameplay feel
            const dinoRect = {
                l: 80 + 12, 
                r: 80 + 52,
                b: 120 + player.y,
                t: 120 + player.y + 52
            };

            const obsRect = {
                l: obs.x + 5,
                r: obs.x + obs.width - 5,
                b: obs.type === 'bird' ? 220 : 120, // Match CSS bottom
                t: obs.type === 'bird' ? 220 + 40 : 120 + obs.height
            };

            if (
                dinoRect.l < obsRect.r &&
                dinoRect.r > obsRect.l &&
                dinoRect.b < obsRect.t &&
                dinoRect.t > obsRect.b
            ) {
                gameOver();
            }
        });
    }

    // --- RENDER ---
    function draw() {
        // Render Dino
        player.style.bottom = (120 + player.y) + 'px';

        // Render Obstacles
        obstacles.forEach(obs => {
            obs.element.style.transform = `translateX(${obs.x}px)`;
        });
    }

    // --- SPAWNER ---
    function spawnManager(dt) {
        spawnTimer += dt;
        // Randomize spawn slightly to feel organic
        const currentSpawnRate = Math.max(800, SPAWN_RATE / (gameSpeed / GAME_SPEED_START));
        
        if (spawnTimer > currentSpawnRate) {
            spawnTimer = 0;
            createObstacle();
        }
    }

    function createObstacle() {
        // Logic to prevent impossible jumps (simple random for now)
        const type = Math.random() > 0.6 ? 'bird' : 'cactus';
        const el = document.createElement('div');
        el.classList.add('obstacle');
        if (type === 'bird') el.classList.add('bird');
        
        el.innerHTML = type === 'cactus' ? cactusSVG : birdSVG;
        
        obstacleContainer.appendChild(el);

        obstacles.push({
            element: el,
            x: 1100,
            width: type === 'cactus' ? 40 : 50,
            height: type === 'cactus' ? 60 : 40,
            type: type
        });
    }

    // --- CONTROLS ---
    function jump() {
        if (!isPlaying && !isGameOver) {
            startGame();
            return;
        }
        if (isGameOver) {
            resetGame();
            return;
        }

        if (player.y === 0) {
            player.dy = JUMP_FORCE;
            player.classList.remove('running');
            player.classList.add('jumping');
        }
    }

    function startGame() {
        isPlaying = true;
        startScreen.classList.add('hidden');
        jumpCue.classList.add('visible');
        player.y = 0;
        player.dy = 0;
        player.classList.add('running');
        lastTime = 0;
    }

    function resetGame() {
        isGameOver = false;
        isPlaying = true;
        score = 0;
        gameSpeed = GAME_SPEED_START;
        
        scoreDisplay.innerText = '0000';
        speedDisplay.innerText = '012';
        highScoreDisplay.innerText = 'HI: ' + highScore.toString().padStart(4, '0');
        groundDetails.style.animationDuration = '0.4s';

        obstacles.forEach(o => o.element.remove());
        obstacles = [];
        
        gameOverScreen.classList.add('hidden');
        startScreen.classList.add('hidden');
        jumpCue.classList.add('visible');
        
        player.y = 0;
        player.dy = 0;
        player.classList.remove('jumping');
        player.classList.add('running');
        lastTime = 0;
    }

    function gameOver() {
        isGameOver = true;
        isPlaying = false;
        player.classList.remove('running');
        player.classList.remove('jumping');
        jumpCue.classList.remove('visible');
        
        if (score > highScore) {
            highScore = score;
            highScoreDisplay.innerText = 'HI: ' + highScore.toString().padStart(4, '0');
        }

        finalScore.innerText = score.toString().padStart(4, '0');
        gameOverScreen.classList.remove('hidden');
    }

    // --- INITIALIZATION ---
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            jump();
        }
    });

    // Initial Render
    requestAnimationFrame(gameLoop);

</script>
</body>
</html>
