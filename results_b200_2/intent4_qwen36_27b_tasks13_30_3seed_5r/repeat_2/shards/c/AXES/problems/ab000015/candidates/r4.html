<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alpine Rush: Velocity</title>
    <style>
        :root {
            /* Alpine Neon Palette */
            --sky-deep: #020617;
            --sky-horizon: #0f172a;
            --snow-highlight: #f0f9ff;
            --neon-cyan: #06b6d4;
            --neon-pink: #ec4899;
            --glass-bg: rgba(2, 6, 23, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-blur: 12px;
            
            /* Typography */
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-display: "Courier New", Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--sky-deep);
            font-family: var(--font-ui);
            color: white;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        /* --- HUD: TOP (Split Hierarchy) --- */
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 20px 24px;
            margin-top: env(safe-area-inset-top);
            width: 100%;
        }

        .hud-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 8px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .label {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--neon-cyan);
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .value {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            line-height: 1;
            text-shadow: 0 0 8px rgba(255,255,255,0.4);
        }

        .unit {
            font-size: 10px;
            color: #94a3b8;
            margin-left: 3px;
            font-weight: 600;
        }

        /* --- PROGRESS BAR (Compact, Centered) --- */
        .progress-container {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 20;
        }

        .progress-label {
            font-size: 10px;
            font-weight: 700;
            color: rgba(255,255,255,0.6);
            letter-spacing: 1px;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(0,0,0,0.4);
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            box-shadow: 0 0 10px var(--neon-pink);
            transition: width 0.1s linear;
        }

        /* --- CONTROLS (Floating, Minimal) --- */
        .controls-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 30px 40px 30px;
            padding-bottom: max(40px, env(safe-area-inset-bottom));
            pointer-events: auto;
            width: 100%;
        }

        .d-pad {
            display: flex;
            gap: 24px;
        }

        .btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .btn:active, .btn.active {
            transform: scale(0.90);
            background: rgba(255,255,255,0.1);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
        }

        .btn svg {
            width: 28px;
            height: 28px;
            fill: #fff;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .btn-brake {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.3);
        }
        
        .btn-brake:active, .btn-brake.active {
            background: rgba(239, 68, 68, 0.4);
            border-color: #fca5a5;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }

        .btn-brake svg {
            fill: #fca5a5;
        }

        /* --- FX --- */
        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 40%, rgba(2, 6, 23, 0.8) 100%);
            z-index: 5;
        }

        /* Chromatic Aberration / Scanlines Overlay */
        .overlay-fx {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 6;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div class="vignette"></div>
    <div class="overlay-fx"></div>

    <div class="ui-layer">
        
        <!-- TOP HUD (Split Layout) -->
        <div class="hud-top">
            <!-- Left: Velocity -->
            <div class="hud-panel">
                <span class="label">Velocity</span>
                <div class="value">
                    <span id="speedDisplay">0</span><span class="unit">km/h</span>
                </div>
            </div>

            <!-- Right: Distance -->
            <div class="hud-panel">
                <span class="label">Distance</span>
                <div class="value">
                    <span id="distDisplay">0.0</span><span class="unit">km</span>
                </div>
            </div>
        </div>

        <!-- CENTER: PROGRESS BAR -->
        <div class="progress-container">
            <span class="progress-label">SECTOR 4</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressBar"></div>
            </div>
        </div>

        <!-- BOTTOM: CONTROLS -->
        <div class="controls-area">
            <div class="d-pad">
                <div class="btn" id="btnLeft">
                    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                </div>
                <div class="btn" id="btnRight">
                    <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </div>
            </div>
            
            <div class="btn btn-brake" id="btnBrake">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
            </div>
        </div>
    </div>
</div>

<script>
    /**
     * ALPINE RUSH ENGINE v4 (Design Revision)
     * Focus: 
     * 1. Alpine Identity (Mountains, Snow, Cold Palette)
     * 2. Visual Hierarchy (Split HUD, Floating Controls)
     * 3. Readability (High contrast obstacles, clear path)
     * 4. Speed Sensation (Motion blur, particles, camera shake)
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    // UI References
    const speedDisplay = document.getElementById('speedDisplay');
    const distDisplay = document.getElementById('distDisplay');
    const progressBar = document.getElementById('progressBar');
    
    // Buttons
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnBrake = document.getElementById('btnBrake');

    // Config
    let width, height;
    let cx, cy;
    let frame = 0;
    
    // Game State
    const state = {
        speed: 0,
        maxSpeed: 240,
        distance: 0,
        playerX: 0, // -1 to 1
        playerTilt: 0,
        isBraking: false,
        roadWidth: 3000, // Wider road
        segmentLength: 200,
        cameraHeight: 1000,
        fov: 100, 
        drawDistance: 8000,
        progress: 0
    };

    const input = { left: false, right: false, brake: false };
    const obstacles = [];

    // --- Initialization ---

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        
        // Handle High DPI
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        
        ctx.scale(dpr, dpr);
        cx = width / 2;
        cy = height / 2;
    }

    function init() {
        resize();
        window.addEventListener('resize', resize);
        setupInputs();
        generateWorld();
        requestAnimationFrame(loop);
    }

    function generateWorld() {
        // Generate initial obstacles
        for(let i=0; i<60; i++) {
            spawnObstacle(1000 + i * 800);
        }
    }

    function spawnObstacle(zStart) {
        // 70% Gates, 30% Rocks
        const type = Math.random() > 0.3 ? 'gate' : 'rock';
        const lane = (Math.random() * 2 - 1); 
        
        obstacles.push({
            z: zStart + (Math.random() * 400),
            x: lane * (state.roadWidth * 0.6), 
            type: type,
            passed: false
        });
    }

    // --- Input Handling ---

    function setupInputs() {
        const bindKey = (k, dir) => {
            document.addEventListener('keydown', e => { if(e.key === k) input[dir] = true; });
            document.addEventListener('keyup', e => { if(e.key === k) input[dir] = false; });
        };

        bindKey('ArrowLeft', 'left');
        bindKey('ArrowRight', 'right');
        bindKey('ArrowDown', 'brake');
        bindKey(' ', 'brake');

        const bindTouch = (el, dir) => {
            const start = (e) => { e.preventDefault(); input[dir] = true; el.classList.add('active'); };
            const end = (e) => { e.preventDefault(); input[dir] = false; el.classList.remove('active'); };
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
            el.addEventListener('mouseleave', end);
            el.addEventListener('touchstart', start, {passive: false});
            el.addEventListener('touchend', end, {passive: false});
        };

        bindTouch(btnLeft, 'left');
        bindTouch(btnRight, 'right');
        bindTouch(btnBrake, 'brake');
    }

    // --- Rendering Logic ---

    function project(x, y, z) {
        // Camera shake based on speed (increases with speed)
        const shakeX = (state.speed / state.maxSpeed) * (Math.random() * 6 - 3);
        const shakeY = (state.speed / state.maxSpeed) * (Math.random() * 6 - 3);
        
        // Perspective projection
        const scale = state.fov / (state.fov + z);
        const x2d = ((x - (state.playerX * state.roadWidth/2)) * scale) + cx + shakeX;
        // Horizon is at cy + 100 (lowered slightly for better downhill feel)
        const y2d = ((y - state.cameraHeight) * scale) + (cy + 100) + shakeY;
        
        return { x: x2d, y: y2d, scale: scale };
    }

    function drawSky() {
        // Deep Alpine Night Gradient
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, '#020617'); // Space Black
        grad.addColorStop(0.5, '#0f172a'); // Deep Blue
        grad.addColorStop(1, '#1e293b'); // Slate Horizon
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);
    }

    function drawMountains() {
        const horizonY = cy + 100;
        const scroll = (state.distance * 10000) % width;

        // Layer 1: Distant Peaks (Low contrast)
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.moveTo(0, height);
        for(let i=0; i<=width; i+=50) {
            const h = Math.sin((i + scroll * 0.02) * 0.005) * 200 + 
                      Math.cos((i + scroll * 0.02) * 0.015) * 100;
            ctx.lineTo(i, horizonY - 150 - h);
        }
        ctx.lineTo(width, height);
        ctx.fill();

        // Layer 2: Closer Peaks (Higher contrast, snow caps)
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.moveTo(0, height);
        for(let i=0; i<=width; i+=40) {
            const h = Math.sin((i + scroll * 0.1) * 0.008) * 120 + 
                      Math.cos((i + scroll * 0.1) * 0.02) * 80;
            ctx.lineTo(i, horizonY - 80 - h);
        }
        ctx.lineTo(width, height);
        ctx.fill();
        
        // Snow caps on Layer 2
        ctx.fillStyle = '#334155';
        ctx.beginPath();
        for(let i=0; i<=width; i+=40) {
            const h = Math.sin((i + scroll * 0.1) * 0.008) * 120 + 
                      Math.cos((i + scroll * 0.1) * 0.02) * 80;
            const peakY = horizonY - 80 - h;
            ctx.moveTo(i-20, peakY + 30);
            ctx.lineTo(i, peakY);
            ctx.lineTo(i+20, peakY + 30);
        }
        ctx.fill();
    }

    function drawIceField() {
        const horizonY = cy + 100;
        
        // Base Ice (White/Grey)
        ctx.fillStyle = '#e2e8f0'; 
        ctx.fillRect(0, horizonY, width, height - horizonY);
        
        // Atmospheric Depth (Fade to white at horizon)
        const grad = ctx.createLinearGradient(0, horizonY, 0, height);
        grad.addColorStop(0, 'rgba(226, 232, 224, 0.9)');
        grad.addColorStop(0.2, 'rgba(255,255,255,0)');
        grad.addColorStop(1, 'rgba(255,255,255,0.1)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, horizonY, width, height - horizonY);
    }

    function drawTrack() {
        const trackLeft = -state.roadWidth / 2;
        const trackRight = state.roadWidth / 2;

        ctx.save();
        
        // Define the playable area
        const p1 = project(trackLeft, 0, 10);
        const p2 = project(trackRight, 0, 10);
        const p3 = project(trackRight, 0, state.drawDistance);
        const p4 = project(trackLeft, 0, state.drawDistance);

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.lineTo(p4.x, p4.y);
        ctx.closePath();
        ctx.clip();

        // Motion Blur / Speed Lines
        // Draw lines rushing towards camera
        const offset = (frame * state.speed * 4) % state.segmentLength;
        const lineCount = 15;
        
        for(let i = -lineCount; i <= lineCount; i++) {
            const x = i * (state.roadWidth / (lineCount*2));
            const near = project(x, 0, 10);
            const far = project(x, 0, state.drawDistance);
            
            // Dynamic opacity based on speed
            const opacity = Math.min(1, state.speed / 100);
            
            const grad = ctx.createLinearGradient(near.x, near.y, far.x, far.y);
            grad.addColorStop(0, `rgba(255,255,255,${opacity})`);
            grad.addColorStop(0.1, `rgba(255,255,255,0)`);
            grad.addColorStop(0.9, `rgba(255,255,255,0)`);
            grad.addColorStop(1, `rgba(255,255,255,${opacity * 0.5})`);

            ctx.strokeStyle = grad;
            ctx.lineWidth = 3 + (i*i); 
            ctx.beginPath();
            ctx.moveTo(near.x, near.y);
            ctx.lineTo(far.x, far.y);
            ctx.stroke();
        }

        // Track Borders (Neon Cyan - Clear Definition)
        ctx.shadowBlur = 20;
        ctx.shadowColor = getComputedStyle(document.documentElement).getPropertyValue('--neon-cyan').trim();
        ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--neon-cyan').trim();
        ctx.lineWidth = 12;
        ctx.lineCap = 'round';

        // Left Border
        ctx.beginPath();
        for(let z=0; z<state.drawDistance; z+=100) {
            const p = project(trackLeft, 0, z);
            if(z===0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();

        // Right Border
        ctx.beginPath();
        for(let z=0; z<state.drawDistance; z+=100) {
            const p = project(trackRight, 0, z);
            if(z===0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();

        ctx.restore();
    }

    function drawObstacles() {
        // Sort far to near (Painter's Algorithm)
        const visibleObs = obstacles.map(obs => {
            let z = obs.z - (frame * state.speed * 4); // Move relative to camera
            
            // Wrap logic
            if (z < 10) {
                obs.z += 10000 + Math.random() * 5000;
                obs.type = Math.random() > 0.4 ? 'gate' : 'rock';
                obs.x = (Math.random() * 2 - 1) * (state.roadWidth * 0.8);
                z = obs.z - (frame * state.speed * 4);
            }
            return { ...obs, z };
        }).sort((a, b) => b.z - a.z);

        visibleObs.forEach(obs => {
            if (obs.z < 10 || obs.z > state.drawDistance) return;

            const relX = obs.x - (state.playerX * state.roadWidth/2);
            const p = project(relX, 0, obs.z);
            const size = 500 * p.scale; // Base size

            if (obs.type === 'gate') {
                // NEON GATE
                ctx.save();
                ctx.translate(p.x, p.y);
                
                const pink = getComputedStyle(document.documentElement).getPropertyValue('--neon-pink').trim();
                
                // Poles
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = Math.max(2, 8 * p.scale);
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-size, 0);
                ctx.lineTo(-size, -size * 1.5);
                ctx.moveTo(size, 0);
                ctx.lineTo(size, -size * 1.5);
                ctx.stroke();

                // Neon Tape
                ctx.shadowBlur = 15;
                ctx.shadowColor = pink;
                ctx.strokeStyle = pink;
                ctx.lineWidth = Math.max(3, 15 * p.scale);
                ctx.beginPath();
                ctx.moveTo(-size, -size * 1.5);
                ctx.lineTo(size, -size * 1.5);
                ctx.stroke();
                
                // Tape Fill (Translucent)
                ctx.fillStyle = 'rgba(236, 72, 153, 0.2)';
                ctx.fillRect(-size, -size * 1.5, size*2, size * 0.5);
                
                ctx.restore();

            } else {
                // ICE ROCK
                ctx.save();
                ctx.translate(p.x, p.y);
                
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.ellipse(0, 0, size/1.2, size/4, 0, 0, Math.PI*2);
                ctx.fill();

                // Rock Body (Dark Slate)
                ctx.fillStyle = '#1e293b';
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.moveTo(-size/2, 0);
                ctx.lineTo(-size/3, -size/1.5);
                ctx.lineTo(size/4, -size/1.8);
                ctx.lineTo(size/2, -size/3);
                ctx.lineTo(size/2, 0);
                ctx.fill();
                
                // Snow Cap (Highlight)
                ctx.fillStyle = '#f8fafc';
                ctx.beginPath();
                ctx.moveTo(-size/3, -size/1.5);
                ctx.lineTo(size/4, -size/1.8);
                ctx.lineTo(0, -size/2.5);
                ctx.fill();
                
                ctx.restore();
            }
        });
    }

    function drawPlayer() {
        // Player Anchor (Fixed Z, moves with X)
        const p = project(0, 0, 100); // Slightly in front of camera
        
        ctx.save();
        ctx.translate(p.x, p.y);
        
        // Lean Physics
        const lean = state.playerTilt * 0.6;
        ctx.rotate(lean);

        // Scale pulse (Breathing effect)
        const scale = 1 + (Math.sin(frame * 25) * 0.02 * (state.speed/state.maxSpeed));
        ctx.scale(scale, scale);

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.ellipse(0, 10, 60, 15, 0, 0, Math.PI*2);
        ctx.fill();

        // --- RIDER (Detailed Silhouette) ---
        
        // Skis (Cyan Neon)
        const cyan = getComputedStyle(document.documentElement).getPropertyValue('--neon-cyan').trim();
        ctx.strokeStyle = cyan;
        ctx.lineWidth = 12;
        ctx.lineCap = 'round';
        ctx.shadowBlur = 20;
        ctx.shadowColor = cyan;
        
        const spread = 45 + Math.abs(lean) * 40;
        
        // Left Ski
        ctx.beginPath();
        ctx.moveTo(-15, -30);
        ctx.lineTo(-spread, 60); 
        ctx.stroke();
        
        // Right Ski
        ctx.beginPath();
        ctx.moveTo(15, -30);
        ctx.lineTo(spread, 60); 
        ctx.stroke();

        // Body (White Suit)
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(-25, -90); // Left shoulder
        ctx.quadraticCurveTo(0, -65, 25, -90); // Chest
        ctx.lineTo(35, -40); // Hip R
        ctx.lineTo(-35, -40); // Hip L
        ctx.fill();

        // Backpack/Jacket detail
        ctx.fillStyle = '#cbd5e1';
        ctx.beginPath();
        ctx.moveTo(-20, -85);
        ctx.lineTo(20, -85);
        ctx.lineTo(25, -65);
        ctx.lineTo(-25, -65);
        ctx.fill();

        // Helmet (Dark)
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(0, -105, 22, 0, Math.PI*2);
        ctx.fill();
        
        // Goggles (Reflective Pink)
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--neon-pink').trim();
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'rgba(236, 72, 153, 0.8)';
        ctx.fillRect(-16, -110, 32, 10);

        ctx.restore(); // Reset rotation for trails

        // --- SNOW WAKE / TRAILS ---
        ctx.save();
        ctx.translate(p.x, p.y); 
        
        // Create streaks behind the rider
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 5;
        ctx.shadowBlur = 0;
        
        const trailCount = 8;
        for(let i=0; i<trailCount; i++) {
            const lx = (Math.random() - 0.5) * 60;
            const ly = 50 + Math.random() * 15;
            const len = 150 + (state.speed * 2);
            const angle = (Math.random() * 0.4 - 0.2) + lean; // Fan out
            
            ctx.beginPath();
            ctx.moveTo(lx, ly);
            ctx.lineTo(lx + Math.sin(angle) * len, ly + Math.cos(angle) * len);
            ctx.stroke();
        }
        ctx.restore();
    }

    function drawParticles() {
        // High Speed Snow Streaks (Tunnel Vision effect)
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';

        // More particles at higher speeds
        const count = Math.floor(10 + (state.speed / 10));
        
        for(let i=0; i<count; i++) {
            const rx = Math.random() * width;
            const ry = Math.random() * height;
            const len = 50 + (state.speed * 3);
            
            // Angle: Vertical + slight outward from center
            const dx = rx - cx;
            const dy = ry - cy;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const angle = Math.atan2(dy, dx) + Math.PI/2; // Perpendicular to radius
            
            ctx.beginPath();
            ctx.moveTo(rx, ry);
            ctx.lineTo(rx + Math.cos(angle) * len, ry + Math.sin(angle) * len);
            ctx.stroke();
        }
        ctx.restore();
    }

    // --- Main Loop ---

    function update() {
        // Physics
        if (input.brake) {
            state.speed = Math.max(0, state.speed - 5);
            state.isBraking = true;
        } else {
            state.speed = Math.min(state.maxSpeed, state.speed + 1.2);
            state.isBraking = false;
        }

        // Steering
        const turnSpeed = 0.07 * (state.speed / 60); 
        if (input.left) {
            state.playerX = Math.max(-1.2, state.playerX - turnSpeed);
            state.playerTilt = Math.max(-0.9, state.playerTilt - 0.1);
        } else if (input.right) {
            state.playerX = Math.min(1.2, state.playerX + turnSpeed);
            state.playerTilt = Math.min(0.9, state.playerTilt + 0.1);
        } else {
            // Return to center
            state.playerTilt += (0 - state.playerTilt) * 0.1;
        }

        // Distance & Progress
        state.distance += state.speed * 0.0008;
        state.progress = (state.distance % 10) / 10 * 100;

        // UI Updates
        speedDisplay.innerText = Math.floor(state.speed);
        distDisplay.innerText = state.distance.toFixed(1);
        
        // Dynamic Color Shift for Speed
        if(state.speed > 180) {
            speedDisplay.style.color = getComputedStyle(document.documentElement).getPropertyValue('--neon-pink').trim();
        } else {
            speedDisplay.style.color = '#ffffff';
        }

        progressBar.style.width = `${state.progress}%`;

        frame++;
    }

    function loop() {
        ctx.clearRect(0, 0, width, height);

        update();

        // Render Order
        drawSky();
        drawMountains();
        drawIceField();
        drawTrack();
        drawObstacles();
        drawPlayer();
        drawParticles();

        requestAnimationFrame(loop);
    }

    // Start
    init();

</script>
</body>
</html>
