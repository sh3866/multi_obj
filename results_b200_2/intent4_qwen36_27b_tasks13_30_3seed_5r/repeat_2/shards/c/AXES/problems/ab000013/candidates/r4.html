<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Metro Tuk-Tuk | Urban Icon</title>
    <style>
        :root {
            --bg-dark: #1a1a1a;
            --bg-panel: #242424;
            --text-main: #f0f0f0;
            --text-muted: #888;
            --accent: #ff9900; /* Street Light Orange */
            
            /* Rickshaw Palette Variables */
            --body-main: #FFC107;
            --body-light: #FFE082;
            --body-dark: #F57F17;
            --roof-main: #D32F2F;
            --roof-dark: #B71C1C;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ambient Background Texture */
        .ambient-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 70% 30%, #3a3a3a 0%, #111 80%);
        }
        
        /* Grain Overlay for "Lived-in" feel */
        .grain-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.08;
            pointer-events: none;
            z-index: 10;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
        }

        /* Main Layout Grid */
        .layout-grid {
            position: relative;
            z-index: 1;
            width: 96vw;
            height: 92vh;
            display: grid;
            grid-template-columns: 1.8fr 1fr;
            gap: 2rem;
            max-width: 1600px;
        }

        /* Left: Visual Stage */
        .visual-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px; /* For 3D tilt */
        }

        /* The Vehicle Container - allows for subtle rotation */
        .vehicle-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: rotateY(2deg) rotateX(1deg);
            transition: transform 0.5s ease;
        }

        svg#rickshaw-svg {
            width: 100%;
            height: 100%;
            max-height: 850px;
            overflow: visible;
            /* Grounding shadow is handled inside SVG now */
        }

        /* Right: Info Panel */
        .info-panel {
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform: translateX(-10px);
        }

        /* Typography */
        .header-group {
            margin-bottom: auto;
        }

        .brand-tag {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 10px;
            display: block;
            border-left: 3px solid var(--accent);
            padding-left: 10px;
        }

        h1 {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 4.5rem;
            line-height: 0.9;
            color: #fff;
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: -2px;
            background: linear-gradient(to bottom, #fff, #bbb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 1rem;
            color: #aaa;
            line-height: 1.6;
            max-width: 400px;
            font-weight: 300;
        }

        /* Specs */
        .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
            border-top: 1px solid rgba(255,255,255,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 20px 0;
        }

        .spec-item h3 {
            font-size: 0.7rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .spec-item p {
            font-size: 1.2rem;
            color: #eee;
            font-weight: 500;
        }

        /* Controls */
        .controls-area {
            margin-top: 20px;
        }
        
        .controls-label {
            font-size: 0.7rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: block;
        }

        .color-options {
            display: flex;
            gap: 15px;
        }

        .color-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .color-btn:hover { transform: scale(1.15); }
        .color-btn.active { border-color: #fff; transform: scale(1.15); box-shadow: 0 0 15px rgba(255,255,255,0.3); }

        /* Responsive */
        @media (max-width: 1024px) {
            .layout-grid {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
                height: 100vh;
                width: 100vw;
            }
            .visual-stage { height: 50vh; }
            .info-panel { 
                height: 50vh; 
                border-left: none; 
                border-top: 1px solid #333;
                padding: 30px;
            }
            h1 { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>
    <div class="grain-overlay"></div>

    <div class="layout-grid">
        
        <!-- VISUAL AREA -->
        <div class="visual-stage">
            <div class="vehicle-container">
                <svg id="rickshaw-svg" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Shadows -->
                        <filter id="contact-shadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="5" />
                            <feOffset dx="0" dy="15" />
                            <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
                        </filter>

                        <!-- Body Gradients (Yellow) -->
                        <linearGradient id="body-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" class="stop-light" style="stop-color:#FFE082" />
                            <stop offset="40%" class="stop-main" style="stop-color:#FFC107" />
                            <stop offset="100%" class="stop-dark" style="stop-color:#F57F17" />
                        </linearGradient>
                        
                        <!-- Roof Gradients (Red) -->
                        <linearGradient id="roof-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#EF5350" />
                            <stop offset="50%" style="stop-color:#D32F2F" />
                            <stop offset="100%" style="stop-color:#B71C1C" />
                        </linearGradient>

                        <!-- Glass -->
                        <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#81D4FA;stop-opacity:0.5" />
                            <stop offset="100%" style="stop-color:#0277BD;stop-opacity:0.9" />
                        </linearGradient>

                        <!-- Chrome/Metal -->
                        <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#eee" />
                            <stop offset="50%" style="stop-color:#999" />
                            <stop offset="100%" style="stop-color:#444" />
                        </linearGradient>

                        <!-- Tire -->
                        <linearGradient id="tire-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#333" />
                            <stop offset="80%" style="stop-color:#111" />
                            <stop offset="100%" style="stop-color:#000" />
                        </linearGradient>

                        <!-- Wheel Rim Pattern -->
                        <pattern id="rim-pattern" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                            <rect width="10" height="20" fill="#444" />
                            <rect x="10" width="10" height="20" fill="#222" />
                        </pattern>
                    </defs>

                    <!-- ================= CONTACT SHADOWS ================= -->
                    <!-- Main Vehicle Shadow -->
                    <ellipse cx="500" cy="680" rx="320" ry="35" fill="#000" opacity="0.8" filter="url(#contact-shadow)" />
                    <!-- Wheel specific shadows -->
                    <ellipse cx="280" cy="675" rx="60" ry="15" fill="#000" opacity="0.9" filter="url(#contact-shadow)" />
                    <ellipse cx="720" cy="675" rx="60" ry="15" fill="#000" opacity="0.9" filter="url(#contact-shadow)" />
                    <ellipse cx="550" cy="680" rx="50" ry="12" fill="#000" opacity="0.9" filter="url(#contact-shadow)" />

                    <!-- ================= ANIMATION GROUP (Suspension) ================= -->
                    <g class="suspension" style="transform-origin: 500px 600px;">
                        
                        <!-- ================= REAR AXLE & WHEELS ================= -->
                        <!-- Rear Axle Bar -->
                        <rect x="250" y="640" width="500" height="15" fill="#222" rx="5" />
                        <rect x="250" y="655" width="500" height="5" fill="#111" />

                        <!-- Rear Left Wheel (Foreground) -->
                        <g transform="translate(280, 675)">
                            <circle cx="0" cy="0" r="65" fill="url(#tire-grad)" />
                            <!-- Rim -->
                            <circle cx="0" cy="0" r="45" fill="#333" />
                            <circle cx="0" cy="0" r="42" fill="url(#chrome-grad)" />
                            <circle cx="0" cy="0" r="25" fill="#222" />
                            <!-- Spokes -->
                            <g class="wheel-spin" style="transform-origin: 0 0;">
                                <path d="M-45,0 L45,0 M0,-45 L0,45 M-32,-32 L32,32 M-32,32 L32,-32" stroke="#111" stroke-width="6" />
                            </g>
                            <!-- Hubcap -->
                            <circle cx="0" cy="0" r="15" fill="#555" />
                        </g>

                        <!-- Rear Right Wheel (Background) -->
                        <g transform="translate(720, 675)">
                            <circle cx="0" cy="0" r="65" fill="url(#tire-grad)" />
                            <circle cx="0" cy="0" r="45" fill="#333" />
                            <circle cx="0" cy="0" r="42" fill="url(#chrome-grad)" />
                            <circle cx="0" cy="0" r="25" fill="#222" />
                            <g class="wheel-spin" style="transform-origin: 0 0;">
                                <path d="M-45,0 L45,0 M0,-45 L0,45 M-32,-32 L32,32 M-32,32 L32,-32" stroke="#111" stroke-width="6" />
                            </g>
                            <circle cx="0" cy="0" r="15" fill="#555" />
                        </g>

                        <!-- Rear Mudguards -->
                        <path d="M 215,675 A 65,65 0 0,1 345,675" fill="none" stroke="#111" stroke-width="12" />
                        <path d="M 655,675 A 65,65 0 0,1 785,675" fill="none" stroke="#111" stroke-width="12" />


                        <!-- ================= CABIN BODY (3/4 Perspective) ================= -->
                        
                        <!-- Left Side Panel (Visible) -->
                        <path d="M 250,400 L 250,640 L 450,640 L 450,400 Z" fill="url(#body-grad-light)" />
                        <!-- Panel Crease -->
                        <path d="M 250,500 L 450,500" stroke="#D4A017" stroke-width="2" opacity="0.5" />
                        
                        <!-- Right Side Panel (Receding) -->
                        <path d="M 450,400 L 650,400 L 650,640 L 450,640 Z" fill="url(#body-grad-light)" />
                        <!-- Shadow on Right Panel -->
                        <path d="M 450,400 L 650,400 L 650,640 L 450,640 Z" fill="rgba(0,0,0,0.2)" />

                        <!-- Interior / Seat (Visible through glass) -->
                        <path d="M 270,500 L 430,500 L 430,580 L 270,580 Z" fill="#800000" />
                        <line x1="270" y1="520" x2="430" y2="520" stroke="#fff" stroke-width="2" opacity="0.3" />

                        <!-- Front Fender Assembly -->
                        <!-- Left Fender -->
                        <path d="M 450,400 L 450,640 L 580,640 L 580,450 Z" fill="url(#body-grad-light)" />
                        <!-- Right Fender -->
                        <path d="M 450,400 L 650,400 L 650,640 L 580,640 Z" fill="url(#body-grad-light)" />
                        <path d="M 450,400 L 650,400 L 650,640 L 580,640 Z" fill="rgba(0,0,0,0.15)" />

                        <!-- Front Grille Area -->
                        <path d="M 460,550 L 640,550 L 640,630 L 460,630 Z" fill="#222" />
                        <!-- Grille Slats -->
                        <line x1="460" y1="570" x2="640" y2="570" stroke="#111" stroke-width="8" />
                        <line x1="460" y1="595" x2="640" y2="595" stroke="#111" stroke-width="8" />
                        <line x1="460" y1="620" x2="640" y2="620" stroke="#111" stroke-width="8" />

                        <!-- License Plate -->
                        <g transform="translate(540, 565)">
                            <rect x="0" y="0" width="70" height="30" fill="#fff" stroke="#333" rx="2" />
                            <text x="35" y="20" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">MH-04</text>
                        </g>


                        <!-- ================= FRONT ASSEMBLY (The "Tuk" part) ================= -->
                        
                        <!-- Steering Column -->
                        <path d="M 550,450 L 580,450 L 600,380 L 570,380 Z" fill="#444" />
                        
                        <!-- Handlebars -->
                        <path d="M 550,380 L 700,380" stroke="#111" stroke-width="12" stroke-linecap="round" />
                        <!-- Grips -->
                        <rect x="540" y="374" width="25" height="12" fill="#111" rx="3" />
                        <rect x="695" y="374" width="25" height="12" fill="#111" rx="3" />

                        <!-- Mirrors -->
                        <g transform="translate(550, 380)">
                            <path d="M 0,0 L -20,-60" stroke="#333" stroke-width="4" />
                            <ellipse cx="-20" cy="-60" rx="8" ry="18" fill="url(#chrome-grad)" />
                        </g>
                        <g transform="translate(700, 380)">
                            <path d="M 0,0 L 20,-60" stroke="#333" stroke-width="4" />
                            <ellipse cx="20" cy="-60" rx="8" ry="18" fill="url(#chrome-grad)" />
                        </g>

                        <!-- Front Wheel (Single, Centered) -->
                        <g transform="translate(625, 680)">
                            <!-- Fork -->
                            <path d="M 0,0 L -15,-320" stroke="#555" stroke-width="14" stroke-linecap="round" />
                            <path d="M 0,0 L 15,-320" stroke="#555" stroke-width="14" stroke-linecap="round" />
                            
                            <!-- Tire -->
                            <ellipse cx="0" cy="0" rx="65" ry="25" fill="url(#tire-grad)" />
                            <!-- Rim -->
                            <ellipse cx="0" cy="0" rx="45" ry="18" fill="#ccc" />
                            <ellipse cx="0" cy="0" rx="20" ry="8" fill="#555" />
                            
                            <!-- Spokes -->
                            <g class="wheel-spin" style="transform-origin: 0 0;">
                                <ellipse cx="0" cy="0" rx="40" ry="15" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="8 8" />
                            </g>
                        </g>

                        <!-- Headlight (Round, Classic) -->
                        <g transform="translate(610, 480)">
                            <path d="M-10,-15 Q20,-15 25,0 Q20,15 -10,15 Z" fill="url(#chrome-grad)" />
                            <circle cx="0" cy="0" r="14" fill="#fff" stroke="#444" stroke-width="2" />
                            <circle cx="0" cy="0" r="8" fill="#ffeb3b" />
                            <!-- Light Beam (Subtle) -->
                            <path d="M 10,0 L 150,-80 L 150,80 Z" fill="url(#beam-grad)" opacity="0.1" />
                        </g>
                        <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#ffeb3b;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#ffeb3b;stop-opacity:0" />
                        </linearGradient>

                        <!-- Driver (Simplified Silhouette) -->
                        <g transform="translate(580, 380)">
                            <!-- Turban -->
                            <path d="M-15,-60 C-25,-80 15,-80 15,-60 Z" fill="#fff" />
                            <circle cx="0" cy="-50" r="15" fill="#d35400" />
                            <!-- Body -->
                            <path d="M-20,-40 C-30,10 -10,40 10,40 L 30,40 C 40,10 20,-40 20,-40 Z" fill="#ecf0f1" />
                        </g>


                        <!-- ================= ROOF & CABIN TOP ================= -->
                        
                        <!-- Windshield (Glass) -->
                        <path d="M 450,400 L 650,400 L 650,280 L 450,280 Z" fill="url(#glass-grad)" stroke="#555" stroke-width="3" />
                        <!-- Windshield Reflection -->
                        <path d="M 460,390 L 540,390 L 540,300 L 460,300 Z" fill="rgba(255,255,255,0.2)" />

                        <!-- Canopy Roof (Red) -->
                        <!-- Top Surface -->
                        <path d="M 230,380 Q 440,250 670,380 L 670,400 Q 440,270 230,400 Z" fill="url(#roof-grad)" />
                        <!-- Side Edge Thickness -->
                        <path d="M 230,380 L 230,400 Q 440,270 670,400 L 670,380 Q 440,250 230,380 Z" fill="#B71C1C" />
                        
                        <!-- Roof Highlight -->
                        <path d="M 230,380 Q 440,250 670,380" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round" />

                        <!-- Roof Spire -->
                        <g transform="translate(450, 265)">
                            <path d="M -8,10 L 0,-60 L 8,10 Z" fill="url(#chrome-grad)" />
                            <circle cx="0" cy="-60" r="12" fill="#f1c40f" />
                        </g>

                        <!-- Flag -->
                        <g transform="translate(450, 195)">
                            <path d="M 0,0 Q 40,20 80,0 L 80,-30 Q 40,-10 0,0 Z" fill="#e74c3c" />
                            <path d="M 0,0 Q 40,25 80,5 L 80,-25 Q 40,-5 0,0 Z" fill="#3498db" transform="translate(5,5)" />
                        </g>

                        <!-- Ornamental Decals (Ganesha) -->
                        <g transform="translate(280, 420)">
                            <circle cx="0" cy="0" r="20" fill="#fff" opacity="0.9" />
                            <circle cx="0" cy="0" r="15" fill="#e74c3c" />
                            <text x="0" y="5" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">G</text>
                        </g>
                        
                        <!-- Rust/Weathering Details -->
                        <g opacity="0.6">
                            <path d="M 450,630 L 460,640 L 455,635 Z" fill="#8D6E63" />
                            <circle cx="640" cy="630" r="2" fill="#8D6E63" />
                            <path d="M 250,635 L 260,640 L 255,638 Z" fill="#8D6E63" />
                        </g>

                    </g>
                </svg>
            </div>
        </div>

        <!-- INFO AREA -->
        <div class="info-panel">
            <div class="header-group">
                <span class="brand-tag">Heritage Series</span>
                <h1>Metro<br>Tuk-Tuk</h1>
                <p class="tagline">
                    The pulse of the city. A masterclass in compact engineering, designed for the chaos and charm of the streets.
                </p>
            </div>

            <div class="specs-grid">
                <div class="spec-item">
                    <h3>Engine</h3>
                    <p>3-Cyl Diesel</p>
                </div>
                <div class="spec-item">
                    <h3>Capacity</h3>
                    <p>3 Passengers</p>
                </div>
                <div class="spec-item">
                    <h3>Top Speed</h3>
                    <p>80 km/h</p>
                </div>
                <div class="spec-item">
                    <h3>Chassis</h3>
                    <p>Tri-Wheel</p>
                </div>
            </div>

            <div class="controls-area">
                <span class="controls-label">Exterior Finish</span>
                <div class="color-options">
                    <!-- Yellow -->
                    <div class="color-btn active" style="background-color: #FFC107;" onclick="changeColor('#FFE082', '#FFC107', '#F57F17', this)"></div>
                    <!-- Green (CNG) -->
                    <div class="color-btn" style="background-color: #4CAF50;" onclick="changeColor('#A5D6A7', '#4CAF50', '#1B5E20', this)"></div>
                    <!-- Blue (Electric) -->
                    <div class="color-btn" style="background-color: #2196F3;" onclick="changeColor('#90CAF9', '#2196F3', '#0D47A1', this)"></div>
                    <!-- Teal -->
                    <div class="color-btn" style="background-color: #009688;" onclick="changeColor('#80CBC4', '#009688', '#004D40', this)"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function changeColor(light, main, dark, element) {
            // Update Active Button State
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            element.classList.add('active');

            // Update SVG Gradient Stops
            const stops = document.querySelectorAll('#body-grad-light stop');
            if(stops.length >= 3) {
                stops[0].style.stopColor = light;
                stops[1].style.stopColor = main;
                stops[2].style.stopColor = dark;
            }
        }

        // CSS Animation Injection
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes spin {
                100% { transform: rotate(360deg); }
            }
            @keyframes bounce {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(4px); }
            }
            .wheel-spin {
                animation: spin 3s linear infinite;
            }
            .suspension {
                animation: bounce 4s ease-in-out infinite;
            }
        `;
        document.head.appendChild(styleSheet);
    </script>
</body>
</html>
