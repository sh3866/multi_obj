<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Royal Tuk-Tuk | Heritage Series</title>
    <style>
        :root {
            --bg-gradient-start: #2c3e50;
            --bg-gradient-end: #0f172a;
            --text-main: #ffffff;
            --text-accent: #f1c40f;
            --panel-bg: rgba(255, 255, 255, 0.08);
            --font-display: 'Georgia', 'Times New Roman', serif;
            --font-body: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: var(--font-body);
            color: var(--text-main);
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ambient Background Elements */
        .ambient-light {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background: 
                radial-gradient(circle at 80% 20%, rgba(255, 160, 0, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(52, 152, 219, 0.1) 0%, transparent 40%);
        }

        /* Main Showcase Card */
        .showcase-card {
            position: relative;
            width: 90vw;
            height: 85vh;
            max-width: 1600px;
            background: rgba(20, 20, 30, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 50px 100px -20px rgba(0,0,0,0.7),
                inset 0 0 0 1px rgba(255,255,255,0.05);
            display: flex;
            overflow: hidden;
            z-index: 1;
        }

        /* Visual Area */
        .visual-area {
            flex: 1.6;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 60%, rgba(255,255,255,0.03) 0%, transparent 70%);
        }

        /* Text Area */
        .info-area {
            flex: 1;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.2));
            position: relative;
        }

        /* Decorative Line */
        .info-area::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: linear-gradient(to bottom, var(--text-accent), transparent);
            opacity: 0.5;
        }

        /* Typography */
        h1 {
            font-family: var(--font-display);
            font-size: 5rem;
            line-height: 0.9;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(to bottom, #fff, #bbb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: var(--text-accent);
            margin-bottom: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        .desc {
            color: rgba(255,255,255,0.7);
            line-height: 1.6;
            margin-bottom: 40px;
            font-size: 1.1rem;
            max-width: 500px;
            border-left: 1px solid rgba(255,255,255,0.2);
            padding-left: 20px;
        }

        /* Specs Grid */
        .specs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .spec-item h3 {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .spec-item p {
            font-size: 1.2rem;
            font-weight: 300;
            color: #fff;
        }

        /* Color Picker */
        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .controls span {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.5);
        }

        .colors {
            display: flex;
            gap: 12px;
        }

        .color-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.active {
            border-color: #fff;
            transform: scale(1.15);
        }

        /* SVG Styles */
        #rickshaw-svg {
            width: 100%;
            height: 100%;
            max-height: 800px;
            overflow: visible;
            filter: drop-shadow(0 30px 40px rgba(0,0,0,0.6));
        }

        /* Animations */
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        @keyframes smoke {
            0% { transform: translate(0,0) scale(1); opacity: 0.6; }
            100% { transform: translate(-50px, -20px) scale(2); opacity: 0; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(2px); }
        }

        .wheel-spin {
            transform-origin: center;
            animation: spin 3s linear infinite;
        }

        .suspension {
            animation: bounce 2s ease-in-out infinite;
        }

        .smoke-puff {
            animation: smoke 2s linear infinite;
            transform-origin: center;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .showcase-card {
                flex-direction: column-reverse;
                height: 95vh;
                width: 98vw;
            }
            .info-area {
                padding: 30px;
                flex: 0 0 auto;
                height: 40%;
            }
            .visual-area {
                height: 60%;
            }
            h1 { font-size: 3rem; }
            .specs { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <div class="ambient-light"></div>

    <div class="showcase-card">
        <!-- Visual Area -->
        <div class="visual-area">
            <svg id="rickshaw-svg" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Filters -->
                    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="15" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>

                    <!-- Gradients: Body (Yellow) -->
                    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:var(--accent-yellow);stop-opacity:1" />
                        <stop offset="60%" style="stop-color:#DAA520;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#8a6d0b;stop-opacity:1" />
                    </linearGradient>

                    <!-- Gradients: Roof (Red) -->
                    <linearGradient id="roof-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#ff5252;stop-opacity:1" />
                        <stop offset="40%" style="stop-color:#D32F2F;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#8e0000;stop-opacity:1" />
                    </linearGradient>

                    <!-- Gradients: Glass -->
                    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:0.7" />
                        <stop offset="50%" style="stop-color:#0288d1;stop-opacity:0.4" />
                        <stop offset="100%" style="stop-color:#01579b;stop-opacity:0.8" />
                    </linearGradient>

                    <!-- Gradients: Chrome -->
                    <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
                        <stop offset="30%" style="stop-color:#bbb;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#fff;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#555;stop-opacity:1" />
                    </linearGradient>

                    <!-- Gradients: Tire -->
                    <linearGradient id="tire-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#111;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#000;stop-opacity:1" />
                    </linearGradient>

                    <!-- Light Beam -->
                    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#fff;stop-opacity:0.6" />
                        <stop offset="40%" style="stop-color:#fff;stop-opacity:0.1" />
                        <stop offset="100%" style="stop-color:#fff;stop-opacity:0" />
                    </linearGradient>
                </defs>

                <!-- Ground Shadow -->
                <ellipse cx="520" cy="730" rx="380" ry="45" fill="rgba(0,0,0,0.6)" filter="blur(15px)" />

                <!-- Exhaust Smoke -->
                <g transform="translate(780, 680)">
                    <circle cx="0" cy="0" r="20" fill="#aaa" class="smoke-puff" style="animation-delay: 0s;" />
                    <circle cx="0" cy="0" r="20" fill="#aaa" class="smoke-puff" style="animation-delay: 1s;" />
                </g>

                <g class="suspension">
                    
                    <!-- ================= REAR WHEELS ================= -->
                    <!-- Left Rear Wheel (Far) -->
                    <g transform="translate(260, 650)">
                        <!-- Axle/Suspension Link -->
                        <line x1="0" y1="-30" x2="0" y2="0" stroke="#444" stroke-width="8" />
                        <ellipse cx="0" cy="0" rx="95" ry="38" fill="url(#tire-grad)" />
                        <ellipse cx="0" cy="0" rx="70" ry="28" fill="#333" />
                        <g class="wheel-spin" style="transform-origin: 0 0;">
                            <circle cx="0" cy="0" r="40" fill="none" stroke="#555" stroke-width="6" />
                            <path d="M0,-40 L0,40 M-40,0 L40,0" stroke="#555" stroke-width="6" />
                        </g>
                        <!-- Mudguard (Far) -->
                        <path d="M-100,0 A100,40 0 0,1 100,0" fill="none" stroke="#111" stroke-width="16" />
                    </g>

                    <!-- Right Rear Wheel (Near) -->
                    <g transform="translate(760, 650)">
                        <line x1="0" y1="-30" x2="0" y2="0" stroke="#444" stroke-width="8" />
                        <ellipse cx="0" cy="0" rx="95" ry="38" fill="url(#tire-grad)" />
                        <ellipse cx="0" cy="0" rx="70" ry="28" fill="#333" />
                        <g class="wheel-spin" style="transform-origin: 0 0;">
                            <circle cx="0" cy="0" r="40" fill="none" stroke="#555" stroke-width="6" />
                            <path d="M0,-40 L0,40 M-40,0 L40,0" stroke="#555" stroke-width="6" />
                        </g>
                        <!-- Mudguard (Near) -->
                        <path d="M-100,0 A100,40 0 0,1 100,0" fill="none" stroke="#222" stroke-width="16" />
                    </g>

                    <!-- ================= CABIN BODY ================= -->
                    <!-- Floor -->
                    <path d="M 260,550 L 460,550 L 660,620 L 440,680 Z" fill="#222" />
                    
                    <!-- Left Side Panel (Facing Viewer) -->
                    <path d="M 260,320 L 260,550 L 460,550 L 460,320 Z" fill="url(#body-grad)" />
                    <!-- Panel Trim -->
                    <rect x="260" y="320" width="200" height="230" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="4" />
                    
                    <!-- Window Area (Left) -->
                    <path d="M 280,340 L 440,340 L 440,480 L 280,480 Z" fill="#111" />
                    <!-- Glass Reflection -->
                    <path d="M 280,340 L 440,340 L 440,400 L 280,400 Z" fill="rgba(255,255,255,0.1)" />
                    
                    <!-- Seat Bench (Left) -->
                    <path d="M 280,480 L 440,480 L 440,540 L 280,540 Z" fill="#800000" />
                    <!-- Seat Pinstripe -->
                    <line x1="280" y1="500" x2="440" y2="500" stroke="#fff" stroke-width="2" opacity="0.3" />

                    <!-- Right Side Panel (Receding) -->
                    <path d="M 460,320 L 660,400 L 660,620 L 460,550 Z" fill="url(#body-grad)" />
                    <!-- Right Side Shadow -->
                    <path d="M 460,320 L 660,400 L 660,620 L 460,550 Z" fill="rgba(0,0,0,0.25)" />
                    
                    <!-- Right Window Area -->
                    <path d="M 480,335 L 640,405 L 640,580 L 480,510 Z" fill="#111" />

                    <!-- Front Fender (Left) -->
                    <path d="M 460,320 L 460,550 L 630,590 L 630,410 Z" fill="url(#body-grad)" />
                    <!-- Front Grille Detail -->
                    <path d="M 480,500 L 610,530 L 610,570 L 480,540 Z" fill="#333" />
                    <line x1="480" y1="510" x2="610" y2="540" stroke="#000" stroke-width="4" />
                    <line x1="480" y1="520" x2="610" y2="550" stroke="#000" stroke-width="4" />
                    <line x1="480" y1="530" x2="610" y2="560" stroke="#000" stroke-width="4" />

                    <!-- License Plate -->
                    <g transform="translate(530, 560)">
                        <rect x="0" y="0" width="50" height="25" fill="#fff" stroke="#333" rx="2" />
                        <text x="25" y="17" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#000">MH-04</text>
                    </g>

                    <!-- ================= FRONT ASSEMBLY ================= -->
                    <!-- Steering Column -->
                    <path d="M 610,450 L 650,460 L 710,340 L 670,330 Z" fill="#333" />
                    
                    <!-- Handlebars -->
                    <path d="M 650,340 L 750,340" stroke="#111" stroke-width="12" stroke-linecap="round" />
                    <!-- Grips -->
                    <rect x="640" y="334" width="15" height="12" fill="#111" rx="2" />
                    <rect x="740" y="334" width="15" height="12" fill="#111" rx="2" />

                    <!-- Mirrors -->
                    <g transform="translate(650, 340)">
                        <path d="M 0,0 L -10,-40" stroke="#333" stroke-width="4" />
                        <ellipse cx="-10" cy="-40" rx="10" ry="18" fill="url(#chrome-grad)" />
                    </g>
                    <g transform="translate(750, 340)">
                        <path d="M 0,0 L 10,-40" stroke="#333" stroke-width="4" />
                        <ellipse cx="10" cy="-40" rx="10" ry="18" fill="url(#chrome-grad)" />
                    </g>

                    <!-- Front Wheel -->
                    <g transform="translate(720, 620)">
                        <!-- Fork -->
                        <path d="M 0,0 L -10,-280" stroke="#444" stroke-width="14" stroke-linecap="round" />
                        <!-- Tire -->
                        <ellipse cx="0" cy="0" rx="95" ry="38" fill="url(#tire-grad)" />
                        <ellipse cx="0" cy="0" rx="70" ry="28" fill="#333" />
                        <g class="wheel-spin" style="transform-origin: 0 0;">
                            <circle cx="0" cy="0" r="40" fill="none" stroke="#555" stroke-width="6" />
                            <path d="M0,-40 L0,40 M-40,0 L40,0" stroke="#555" stroke-width="6" />
                        </g>
                        <!-- Mudguard -->
                        <path d="M-100,0 A100,40 0 0,1 100,0" fill="none" stroke="#222" stroke-width="16" />
                    </g>

                    <!-- Headlight -->
                    <g transform="translate(680, 460)">
                        <path d="M-10,-20 Q30,-20 40,20 Q30,50 -10,20 Z" fill="url(#chrome-grad)" />
                        <circle cx="15" cy="0" r="20" fill="#fff" stroke="#444" stroke-width="2" />
                        <circle cx="15" cy="0" r="12" fill="#ffeb3b" filter="url(#glow)" />
                        <!-- Beam -->
                        <path d="M 30,-15 L 800,-100 L 800,150 L 30,15 Z" fill="url(#beam-grad)" style="mix-blend-mode: screen;" />
                    </g>

                    <!-- Driver (Abstracted) -->
                    <g transform="translate(620, 360)">
                        <circle cx="0" cy="-40" r="16" fill="#d35400" /> <!-- Head -->
                        <path d="M-15,-45 C-15,-65 15,-65 15,-45 Z" fill="#fff" /> <!-- Turban -->
                        <path d="M-15,-20 C-25,20 -10,40 10,40 L 25,40 C 35,20 15,-20 15,-20 Z" fill="#ecf0f1" /> <!-- Shirt -->
                    </g>

                    <!-- ================= ROOF & CABIN TOP ================= -->
                    <!-- Windshield -->
                    <path d="M 460,320 L 630,410 L 630,310 L 460,220 Z" fill="url(#glass-grad)" stroke="#555" stroke-width="3" />
                    <!-- Windshield Reflection -->
                    <path d="M 470,310 L 530,335 L 530,270 L 470,240 Z" fill="rgba(255,255,255,0.2)" />

                    <!-- Canopy Roof -->
                    <path d="M 240,300 Q 460,140 680,320 L 680,420 Q 460,260 240,320 Z" fill="url(#roof-grad)" stroke="#8e0000" stroke-width="2" />
                    <!-- Roof Highlight -->
                    <path d="M 240,300 Q 460,140 680,320" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4" />
                    
                    <!-- Roof Spire -->
                    <g transform="translate(460, 210)">
                        <path d="M -10,10 L 0,-40 L 10,10 Z" fill="url(#chrome-grad)" />
                        <circle cx="0" cy="-40" r="8" fill="#f1c40f" />
                    </g>

                    <!-- Flag -->
                    <g transform="translate(460, 160)">
                        <path d="M 0,0 Q 30,10 50,0 L 50,-20 Q 30,-10 0,0 Z" fill="#e74c3c" />
                        <path d="M 0,0 Q 30,15 50,5 L 50,-15 Q 30,-5 0,0 Z" fill="#3498db" transform="translate(5,5)" />
                    </g>

                </g>
            </svg>
        </div>

        <!-- Info Area -->
        <div class="info-area">
            <h2>Heritage Series</h2>
            <h1>Royal Metro</h1>
            <p class="desc">
                A modern reimagining of the iconic Indian auto-rickshaw. 
                Combining the agility of the three-wheel structure with 
                premium aesthetics and a vibrant street-inspired palette.
            </p>

            <div class="specs">
                <div class="spec-item">
                    <h3>Engine</h3>
                    <p>3-Cyl Diesel</p>
                </div>
                <div class="spec-item">
                    <h3>Capacity</h3>
                    <p>3 Passengers</p>
                </div>
                <div class="spec-item">
                    <h3>Top Speed</h3>
                    <p>80 km/h</p>
                </div>
            </div>

            <div class="controls">
                <span>Exterior Finish</span>
                <div class="colors">
                    <!-- Yellow -->
                    <div class="color-btn active" style="background-color: #FFC107;" onclick="changeColor('#FFC107', '#DAA520', '#8a6d0b', this)"></div>
                    <!-- Red -->
                    <div class="color-btn" style="background-color: #D32F2F;" onclick="changeColor('#D32F2F', '#B71C1C', '#7f0000', this)"></div>
                    <!-- Teal -->
                    <div class="color-btn" style="background-color: #009688;" onclick="changeColor('#009688', '#00796B', '#004d40', this)"></div>
                    <!-- Blue -->
                    <div class="color-btn" style="background-color: #1976D2;" onclick="changeColor('#1976D2', '#1565C0', '#0d47a1', this)"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function changeColor(primary, secondary, tertiary, element) {
            // Update Active Button State
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            element.classList.add('active');

            // Update SVG Gradient
            const bodyGrad = document.getElementById('body-grad');
            bodyGrad.children[0].style.stopColor = primary;
            bodyGrad.children[1].style.stopColor = secondary;
            bodyGrad.children[2].style.stopColor = tertiary;
        }
    </script>
</body>
</html>
