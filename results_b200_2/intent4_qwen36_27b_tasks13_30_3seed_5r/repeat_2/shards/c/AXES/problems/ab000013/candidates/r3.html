<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Rickshaw | Street Edition</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --text-dark: #1a1a1a;
            --text-muted: #666;
            --accent-color: #FFC107;
            --rickshaw-yellow: #FFC107;
            --rickshaw-red: #D32F2F;
            --rickshaw-green: #388E3C;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Background Noise Texture for "Street" feel */
        .noise-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
        }

        /* Main Container */
        .showcase-container {
            position: relative;
            width: 95vw;
            height: 90vh;
            max-width: 1600px;
            background: #fff;
            border-radius: 4px;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.1),
                0 0 0 1px rgba(0,0,0,0.05);
            display: grid;
            grid-template-columns: 1.5fr 1fr; /* Vehicle gets more space */
            overflow: hidden;
            z-index: 1;
        }

        /* Left Panel: Visual */
        .visual-panel {
            position: relative;
            background: radial-gradient(circle at 60% 60%, #ffffff 0%, #eef2f3 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Street Lines Decoration */
        .street-lines {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: repeating-linear-gradient(
                90deg,
                #333 0px,
                #333 40px,
                transparent 40px,
                transparent 80px
            );
            opacity: 0.1;
            transform: perspective(500px) rotateX(60deg) translateY(50px);
            transform-origin: bottom;
        }

        /* SVG Styling */
        #rickshaw-svg {
            width: 110%; /* Scale up */
            height: 110%;
            max-height: 900px;
            overflow: visible;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.3));
        }

        /* Right Panel: Info */
        .info-panel {
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #fff;
            border-left: 1px solid rgba(0,0,0,0.05);
            position: relative;
        }

        /* Typography */
        .brand-tag {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: block;
        }

        h1 {
            font-family: 'Arial Black', 'Impact', sans-serif; /* Bold, expressive */
            font-size: 3.5rem;
            line-height: 0.95;
            color: var(--text-dark);
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .tagline {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 40px;
            font-weight: 400;
        }

        /* Specs Layout */
        .specs-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: auto; /* Push down */
        }

        .spec-block h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #999;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .spec-block p {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        /* Controls */
        .controls-area {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }

        .controls-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 15px;
            display: block;
        }

        .color-options {
            display: flex;
            gap: 15px;
        }

        .color-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.active {
            border-color: var(--text-dark);
            transform: scale(1.1);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .showcase-container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
                height: 100vh;
                width: 100vw;
                border-radius: 0;
            }
            .visual-panel { height: 55vh; }
            .info-panel { 
                padding: 30px; 
                border-left: none; 
                border-top: 1px solid #eee;
                overflow-y: auto;
            }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="noise-overlay"></div>

    <div class="showcase-container">
        <!-- Visual Area -->
        <div class="visual-panel">
            <div class="street-lines"></div>
            <svg id="rickshaw-svg" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Filters -->
                    <filter id="shadow-blur" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="15" />
                    </filter>

                    <!-- Gradients: Body (Yellow) -->
                    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#FFE082;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#FFC107;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#F57F17;stop-opacity:1" />
                    </linearGradient>

                    <!-- Gradients: Roof (Red) -->
                    <linearGradient id="roof-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#EF5350;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#D32F2F;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#B71C1C;stop-opacity:1" />
                    </linearGradient>

                    <!-- Gradients: Glass -->
                    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#81D4FA;stop-opacity:0.6" />
                        <stop offset="100%" style="stop-color:#0277BD;stop-opacity:0.8" />
                    </linearGradient>

                    <!-- Gradients: Chrome -->
                    <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
                        <stop offset="40%" style="stop-color:#999;stop-opacity:1" />
                        <stop offset="60%" style="stop-color:#fff;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#555;stop-opacity:1" />
                    </linearGradient>

                    <!-- Gradients: Tire -->
                    <linearGradient id="tire-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#424242;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
                    </linearGradient>
                </defs>

                <!-- Ground Shadow -->
                <ellipse cx="500" cy="680" rx="350" ry="40" fill="rgba(0,0,0,0.3)" filter="url(#shadow-blur)" />

                <!-- Animation Group -->
                <g class="suspension" style="transform-origin: 500px 600px; animation: bounce 3s ease-in-out infinite;">
                    
                    <!-- ================= REAR WHEELS ================= -->
                    <!-- Left Rear Wheel -->
                    <g transform="translate(300, 640)">
                        <!-- Suspension/Axle -->
                        <rect x="-10" y="-30" width="20" height="40" fill="#333" rx="5" />
                        <!-- Tire -->
                        <ellipse cx="0" cy="0" rx="90" ry="35" fill="url(#tire-grad)" />
                        <!-- Rim -->
                        <ellipse cx="0" cy="0" rx="60" ry="22" fill="#ccc" />
                        <g class="wheel-spin" style="transform-origin: 0 0;">
                            <circle cx="0" cy="0" r="35" fill="none" stroke="#555" stroke-width="4" stroke-dasharray="10 10" />
                        </g>
                        <!-- Mudguard (Back) -->
                        <path d="M-90,0 A90,35 0 0,1 90,0" fill="none" stroke="#222" stroke-width="20" />
                    </g>

                    <!-- Right Rear Wheel -->
                    <g transform="translate(700, 640)">
                        <rect x="-10" y="-30" width="20" height="40" fill="#333" rx="5" />
                        <ellipse cx="0" cy="0" rx="90" ry="35" fill="url(#tire-grad)" />
                        <ellipse cx="0" cy="0" rx="60" ry="22" fill="#ccc" />
                        <g class="wheel-spin" style="transform-origin: 0 0;">
                            <circle cx="0" cy="0" r="35" fill="none" stroke="#555" stroke-width="4" stroke-dasharray="10 10" />
                        </g>
                        <!-- Mudguard (Front) -->
                        <path d="M-90,0 A90,35 0 0,1 90,0" fill="none" stroke="#333" stroke-width="20" />
                    </g>

                    <!-- ================= CABIN BODY ================= -->
                    <!-- Floor/Chassis -->
                    <path d="M 300,580 L 450,580 L 650,580 L 700,640 L 300,640 Z" fill="#222" />
                    
                    <!-- Left Side Panel (Facing Viewer) -->
                    <path d="M 300,350 L 300,580 L 450,580 L 450,350 Z" fill="url(#body-grad)" />
                    <!-- Panel Lines -->
                    <line x1="300" y1="450" x2="450" y2="450" stroke="#F57F17" stroke-width="3" opacity="0.5" />
                    
                    <!-- Window Area (Left) -->
                    <path d="M 315,370 L 435,370 L 435,500 L 315,500 Z" fill="#111" />
                    <!-- Window Glass -->
                    <path d="M 320,375 L 430,375 L 430,495 L 320,495 Z" fill="url(#glass-grad)" />
                    
                    <!-- Seat Bench (Left) -->
                    <path d="M 315,500 L 435,500 L 435,570 L 315,570 Z" fill="#800000" />
                    <!-- Seat Pinstripe -->
                    <line x1="315" y1="520" x2="435" y2="520" stroke="#fff" stroke-width="2" opacity="0.4" />
                    <line x1="315" y1="530" x2="435" y2="530" stroke="#fff" stroke-width="2" opacity="0.4" />

                    <!-- Right Side Panel (Receding) -->
                    <path d="M 450,350 L 650,350 L 650,580 L 450,580 Z" fill="url(#body-grad)" />
                    <!-- Shadow overlay for depth -->
                    <path d="M 450,350 L 650,350 L 650,580 L 450,580 Z" fill="rgba(0,0,0,0.15)" />
                    
                    <!-- Right Window Area -->
                    <path d="M 465,370 L 635,370 L 635,500 L 465,500 Z" fill="#111" />
                    <path d="M 470,375 L 630,375 L 630,495 L 470,495 Z" fill="url(#glass-grad)" />

                    <!-- Front Fender (Left) -->
                    <path d="M 450,350 L 450,580 L 620,580 L 620,420 Z" fill="url(#body-grad)" />
                    
                    <!-- Front Grille Detail -->
                    <path d="M 460,540 L 610,540 L 610,580 L 460,580 Z" fill="#333" />
                    <line x1="460" y1="550" x2="610" y2="550" stroke="#111" stroke-width="5" />
                    <line x1="460" y1="565" x2="610" y2="565" stroke="#111" stroke-width="5" />

                    <!-- License Plate -->
                    <g transform="translate(520, 555)">
                        <rect x="0" y="0" width="60" height="25" fill="#fff" stroke="#333" rx="2" />
                        <text x="30" y="17" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#000">MH-12</text>
                    </g>

                    <!-- ================= FRONT ASSEMBLY ================= -->
                    <!-- Steering Column -->
                    <path d="M 580,450 L 620,450 L 680,350 L 640,340 Z" fill="#444" />
                    
                    <!-- Handlebars -->
                    <path d="M 640,340 L 740,340" stroke="#111" stroke-width="14" stroke-linecap="round" />
                    <!-- Grips -->
                    <rect x="630" y="333" width="20" height="14" fill="#111" rx="4" />
                    <rect x="730" y="333" width="20" height="14" fill="#111" rx="4" />

                    <!-- Mirrors -->
                    <g transform="translate(640, 340)">
                        <path d="M 0,0 L -10,-50" stroke="#333" stroke-width="5" />
                        <ellipse cx="-10" cy="-50" rx="12" ry="22" fill="url(#chrome-grad)" />
                    </g>
                    <g transform="translate(740, 340)">
                        <path d="M 0,0 L 10,-50" stroke="#333" stroke-width="5" />
                        <ellipse cx="10" cy="-50" rx="12" ry="22" fill="url(#chrome-grad)" />
                    </g>

                    <!-- Front Wheel (Single) -->
                    <g transform="translate(690, 620)">
                        <!-- Fork -->
                        <path d="M 0,0 L -10,-300" stroke="#555" stroke-width="16" stroke-linecap="round" />
                        <!-- Tire -->
                        <ellipse cx="0" cy="0" rx="90" ry="35" fill="url(#tire-grad)" />
                        <ellipse cx="0" cy="0" rx="60" ry="22" fill="#ccc" />
                        <g class="wheel-spin" style="transform-origin: 0 0;">
                            <circle cx="0" cy="0" r="35" fill="none" stroke="#555" stroke-width="4" stroke-dasharray="10 10" />
                        </g>
                        <!-- Mudguard -->
                        <path d="M-90,0 A90,35 0 0,1 90,0" fill="none" stroke="#222" stroke-width="20" />
                    </g>

                    <!-- Headlight -->
                    <g transform="translate(650, 480)">
                        <path d="M-10,-15 Q20,-15 30,15 Q20,45 -10,15 Z" fill="url(#chrome-grad)" />
                        <circle cx="10" cy="0" r="15" fill="#fff" stroke="#444" stroke-width="2" />
                        <circle cx="10" cy="0" r="8" fill="#ffeb3b" />
                    </g>

                    <!-- Driver (Abstracted) -->
                    <g transform="translate(600, 360)">
                        <circle cx="0" cy="-40" r="18" fill="#d35400" /> <!-- Head -->
                        <path d="M-20,-45 C-20,-70 20,-70 20,-45 Z" fill="#fff" /> <!-- Turban -->
                        <path d="M-20,-20 C-30,30 -10,50 10,50 L 30,50 C 40,30 20,-20 20,-20 Z" fill="#ecf0f1" /> <!-- Shirt -->
                    </g>

                    <!-- ================= ROOF & CABIN TOP ================= -->
                    <!-- Windshield (Glass) -->
                    <path d="M 450,350 L 620,350 L 620,250 L 450,250 Z" fill="url(#glass-grad)" stroke="#555" stroke-width="2" />
                    <!-- Windshield Reflection -->
                    <path d="M 460,340 L 520,340 L 520,260 L 460,260 Z" fill="rgba(255,255,255,0.3)" />

                    <!-- Canopy Roof -->
                    <path d="M 280,330 Q 450,200 640,330 L 640,420 Q 450,300 280,420 Z" fill="url(#roof-grad)" stroke="#8e0000" stroke-width="2" />
                    <!-- Roof Highlight -->
                    <path d="M 280,330 Q 450,200 640,330" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="6" stroke-linecap="round" />
                    
                    <!-- Roof Spire -->
                    <g transform="translate(450, 240)">
                        <path d="M -10,10 L 0,-50 L 10,10 Z" fill="url(#chrome-grad)" />
                        <circle cx="0" cy="-50" r="10" fill="#f1c40f" />
                    </g>

                    <!-- Flag -->
                    <g transform="translate(450, 180)">
                        <path d="M 0,0 Q 30,15 60,0 L 60,-25 Q 30,-10 0,0 Z" fill="#e74c3c" />
                        <path d="M 0,0 Q 30,20 60,5 L 60,-20 Q 30,-5 0,0 Z" fill="#3498db" transform="translate(5,5)" />
                    </g>

                    <!-- Ornamental Details (Stickers/Decals) -->
                    <g transform="translate(320, 400)">
                        <circle cx="0" cy="0" r="15" fill="#fff" opacity="0.8" />
                        <circle cx="0" cy="0" r="10" fill="#e74c3c" />
                        <text x="0" y="4" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">G</text>
                    </g>

                </g>
            </svg>
        </div>

        <!-- Info Area -->
        <div class="info-panel">
            <div>
                <span class="brand-tag">Heritage Series</span>
                <h1>Royal<br>Metro</h1>
                <p class="tagline">
                    The heartbeat of the city. A modern reimagining of the iconic three-wheeler, built for agility and style.
                </p>

                <div class="specs-container">
                    <div class="spec-block">
                        <h3>Engine</h3>
                        <p>3-Cyl Diesel</p>
                    </div>
                    <div class="spec-block">
                        <h3>Capacity</h3>
                        <p>3 Passengers</p>
                    </div>
                    <div class="spec-block">
                        <h3>Top Speed</h3>
                        <p>80 km/h</p>
                    </div>
                    <div class="spec-block">
                        <h3>Chassis</h3>
                        <p>Tri-Wheel</p>
                    </div>
                </div>
            </div>

            <div class="controls-area">
                <span class="controls-label">Exterior Finish</span>
                <div class="color-options">
                    <!-- Yellow -->
                    <div class="color-btn active" style="background-color: #FFC107;" onclick="changeColor('#FFE082', '#FFC107', '#F57F17', this)"></div>
                    <!-- Green -->
                    <div class="color-btn" style="background-color: #388E3C;" onclick="changeColor('#81C784', '#388E3C', '#1B5E20', this)"></div>
                    <!-- Blue -->
                    <div class="color-btn" style="background-color: #1976D2;" onclick="changeColor('#64B5F6', '#1976D2', '#0D47A1', this)"></div>
                    <!-- Teal -->
                    <div class="color-btn" style="background-color: #009688;" onclick="changeColor('#80CBC4', '#009688', '#004D40', this)"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function changeColor(light, main, dark, element) {
            // Update Active Button State
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            element.classList.add('active');

            // Update SVG Gradient
            const bodyGrad = document.getElementById('body-grad');
            bodyGrad.children[0].style.stopColor = light;
            bodyGrad.children[1].style.stopColor = main;
            bodyGrad.children[2].style.stopColor = dark;
        }

        // CSS Animation Injection
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes spin {
                100% { transform: rotate(360deg); }
            }
            @keyframes bounce {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(3px); }
            }
            .wheel-spin {
                animation: spin 4s linear infinite;
            }
            .suspension {
                animation: bounce 3s ease-in-out infinite;
            }
        `;
        document.head.appendChild(styleSheet);
    </script>
</body>
</html>
