<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Tuk-Tuk | Urban Heritage</title>
    <style>
        :root {
            --bg-dark: #0f1014;
            --bg-accent: #1a1c23;
            --text-main: #f0f0f0;
            --text-muted: #9e9ea7;
            --accent-orange: #FF5722;
            --accent-yellow: #FFC107;
            
            /* Rickshaw Palette Variables (Dynamic) */
            --paint-light: #FFE082;
            --paint-main: #FFC107;
            --paint-dark: #F57F17;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Dynamic Background - Bokeh Effect */
        .ambient-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            background: 
                radial-gradient(circle at 80% 20%, rgba(255, 87, 34, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(33, 150, 243, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #1a1c23 0%, #0f1014 100%);
        }

        /* Grain Overlay for Texture */
        .grain-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.06;
            pointer-events: none;
            z-index: 10;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
        }

        /* Layout Container */
        .layout-container {
            position: relative;
            z-index: 2;
            width: 96vw;
            height: 90vh;
            display: grid;
            grid-template-columns: 1.5fr 0.8fr;
            gap: 4rem;
            max-width: 1800px;
        }

        /* Left: The Stage */
        .visual-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Subtle lighting gradient behind the car */
            background: radial-gradient(circle at center, rgba(255,255,255,0.03) 0%, transparent 70%);
        }

        /* SVG Styling */
        svg#rickshaw-svg {
            width: 100%;
            height: 100%;
            max-height: 800px;
            overflow: visible;
            filter: drop-shadow(0px 20px 30px rgba(0,0,0,0.6));
        }

        /* Right: Typography & Info */
        .info-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 2rem;
            border-left: 1px solid rgba(255,255,255,0.1);
        }

        .brand-tag {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent-orange);
            margin-bottom: 1rem;
            display: inline-block;
            border-bottom: 2px solid var(--accent-orange);
            padding-bottom: 5px;
            width: fit-content;
        }

        h1 {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 5rem;
            line-height: 0.9;
            color: #fff;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            letter-spacing: -1px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .tagline {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 3rem;
            max-width: 450px;
            font-weight: 300;
            border-left: 1px solid rgba(255,255,255,0.2);
            padding-left: 20px;
        }

        /* Specs Grid */
        .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .spec-item h3 {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .spec-item p {
            font-size: 1.4rem;
            color: #fff;
            font-weight: 400;
            font-family: monospace;
        }

        /* Interactive Controls */
        .controls-area {
            background: rgba(255,255,255,0.03);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .controls-label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: block;
        }

        .color-options {
            display: flex;
            gap: 15px;
        }

        .color-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
            position: relative;
        }

        .color-btn:hover { transform: scale(1.1); border-color: #fff; }
        .color-btn.active { border-color: #fff; transform: scale(1.15); box-shadow: 0 0 15px rgba(255,255,255,0.2); }

        /* Responsive */
        @media (max-width: 1024px) {
            .layout-container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
                height: 100vh;
                gap: 0;
            }
            .visual-stage { height: 55vh; background: none; }
            .info-panel { 
                height: 45vh; 
                border-left: none; 
                border-top: 1px solid rgba(255,255,255,0.1);
                padding: 2rem 5%;
                background: linear-gradient(to top, var(--bg-dark), transparent);
            }
            h1 { font-size: 3.5rem; }
            .specs-grid { grid-template-columns: 1fr 1fr 1fr 1fr; gap: 1rem; }
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>
    <div class="grain-overlay"></div>

    <div class="layout-container">
        
        <!-- VISUAL AREA -->
        <div class="visual-stage">
            <svg id="rickshaw-svg" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Contact Shadow -->
                    <filter id="contact-shadow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="15" />
                        <feOffset dx="0" dy="25" />
                        <feComponentTransfer><feFuncA type="linear" slope="0.8"/></feComponentTransfer>
                    </filter>

                    <!-- Body Paint Gradient (Dynamic) -->
                    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" class="stop-light" style="stop-color: var(--paint-light)" />
                        <stop offset="30%" class="stop-main" style="stop-color: var(--paint-main)" />
                        <stop offset="100%" class="stop-dark" style="stop-color: var(--paint-dark)" />
                    </linearGradient>
                    
                    <!-- Roof Gradient (Red) -->
                    <linearGradient id="roof-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#ef5350" />
                        <stop offset="50%" style="stop-color:#d32f2f" />
                        <stop offset="100%" style="stop-color:#b71c1c" />
                    </linearGradient>

                    <!-- Chrome Gradient -->
                    <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#fff" />
                        <stop offset="40%" style="stop-color:#aaa" />
                        <stop offset="100%" style="stop-color:#555" />
                    </linearGradient>

                    <!-- Tire Gradient -->
                    <linearGradient id="tire-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#444" />
                        <stop offset="50%" style="stop-color:#111" />
                        <stop offset="100%" style="stop-color:#000" />
                    </linearGradient>
                    
                    <!-- Glass Gradient -->
                    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#81D4FA;stop-opacity:0.6" />
                        <stop offset="100%" style="stop-color:#0277BD;stop-opacity:0.9" />
                    </linearGradient>
                </defs>

                <!-- ================= GROUND SHADOW ================= -->
                <ellipse cx="500" cy="660" rx="350" ry="40" fill="#000" opacity="0.8" filter="url(#contact-shadow)" />

                <!-- ================= ANIMATION GROUP ================= -->
                <g class="suspension">
                    
                    <!-- ================= REAR AXLE ================= -->
                    <!-- Axle Bar -->
                    <rect x="260" y="630" width="480" height="20" rx="5" fill="#222" />
                    <rect x="260" y="645" width="480" height="5" fill="#111" />

                    <!-- Left Rear Wheel (Background) -->
                    <g transform="translate(300, 650)">
                        <ellipse cx="0" cy="0" rx="60" ry="20" fill="url(#tire-grad)" />
                        <ellipse cx="0" cy="0" rx="40" ry="12" fill="#333" />
                        <ellipse cx="0" cy="0" rx="20" ry="6" fill="#555" />
                    </g>

                    <!-- Right Rear Wheel (Foreground) -->
                    <g transform="translate(700, 650)">
                        <ellipse cx="0" cy="0" rx="60" ry="20" fill="url(#tire-grad)" />
                        <ellipse cx="0" cy="0" rx="40" ry="12" fill="#333" />
                        <ellipse cx="0" cy="0" rx="20" ry="6" fill="#555" />
                    </g>

                    <!-- Rear Mudguards (Chrome) -->
                    <path d="M 240,650 A 60,20 0 0,1 360,650" fill="none" stroke="url(#chrome-grad)" stroke-width="8" />
                    <path d="M 640,650 A 60,20 0 0,1 760,650" fill="none" stroke="url(#chrome-grad)" stroke-width="8" />


                    <!-- ================= CABIN BODY (3/4 PERSPECTIVE) ================= -->
                    
                    <!-- Side Panel (Left/Visible) -->
                    <path d="M 280,420 L 280,620 Q 350,650 480,640 L 480,420 Z" fill="url(#body-grad)" />
                    
                    <!-- Side Panel (Right/Receding) -->
                    <path d="M 480,420 L 680,420 Q 750,450 750,620 L 480,640 Z" fill="url(#body-grad)" />
                    <!-- Shadow on Right Panel -->
                    <path d="M 480,420 L 680,420 Q 750,450 750,620 L 480,640 Z" fill="rgba(0,0,0,0.25)" />
                    
                    <!-- Door Line -->
                    <path d="M 480,420 L 480,640" stroke="rgba(0,0,0,0.2)" stroke-width="2" />

                    <!-- Interior (Visible) -->
                    <path d="M 300,500 L 460,500 L 460,580 L 300,580 Z" fill="#3e2723" opacity="0.8" />
                    <!-- Seat Stripes -->
                    <line x1="300" y1="520" x2="460" y2="520" stroke="#d32f2f" stroke-width="4" opacity="0.8" />
                    <line x1="300" y1="540" x2="460" y2="540" stroke="#d32f2f" stroke-width="4" opacity="0.8" />

                    <!-- Front Fender (Left/Visible) -->
                    <path d="M 480,420 L 480,640 L 620,640 L 620,480 Z" fill="url(#body-grad)" />
                    
                    <!-- Front Fender (Right/Receding) -->
                    <path d="M 480,420 L 680,420 L 680,620 L 620,640 Z" fill="url(#body-grad)" />
                    <path d="M 480,420 L 680,420 L 680,620 L 620,640 Z" fill="rgba(0,0,0,0.15)" />

                    <!-- Front Grille Area -->
                    <path d="M 490,560 L 670,560 L 670,630 L 490,630 Z" fill="#222" />
                    <!-- Grille Slats -->
                    <line x1="490" y1="580" x2="670" y2="580" stroke="#111" stroke-width="6" />
                    <line x1="490" y1="600" x2="670" y2="600" stroke="#111" stroke-width="6" />
                    <line x1="490" y1="620" x2="670" y2="620" stroke="#111" stroke-width="6" />

                    <!-- License Plate -->
                    <g transform="translate(570, 570)">
                        <rect x="0" y="0" width="60" height="25" fill="#fff" stroke="#333" rx="2" />
                        <text x="30" y="17" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#000">MH-04</text>
                    </g>

                    <!-- Ornamental Decals -->
                    <!-- Ganesha Sticker -->
                    <g transform="translate(320, 450)">
                        <circle cx="0" cy="0" r="25" fill="#fff" opacity="0.9" />
                        <circle cx="0" cy="0" r="20" fill="#e74c3c" />
                        <text x="0" y="6" font-family="serif" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">G</text>
                        <text x="0" y="-8" font-size="8" fill="#fff" text-anchor="middle" opacity="0.8">JAI</text>
                    </g>
                    
                    <!-- Floral Pattern -->
                    <path d="M 290,550 Q 300,540 310,550 Q 320,560 330,550" fill="none" stroke="#fff" stroke-width="2" opacity="0.5" />

                    <!-- ================= FRONT ASSEMBLY (The "Tuk") ================= -->
                    
                    <!-- Steering Column -->
                    <path d="M 580,480 L 610,480 L 630,400 L 600,400 Z" fill="#444" />
                    
                    <!-- Handlebars -->
                    <path d="M 560,400 L 720,400" stroke="#111" stroke-width="14" stroke-linecap="round" />
                    <!-- Grips -->
                    <rect x="545" y="393" width="30" height="14" fill="#111" rx="4" />
                    <rect x="715" y="393" width="30" height="14" fill="#111" rx="4" />

                    <!-- Mirrors -->
                    <g transform="translate(560, 400)">
                        <path d="M 0,0 L -25,-70" stroke="#333" stroke-width="5" />
                        <ellipse cx="-25" cy="-70" rx="10" ry="22" fill="url(#chrome-grad)" />
                    </g>
                    <g transform="translate(720, 400)">
                        <path d="M 0,0 L 25,-70" stroke="#333" stroke-width="5" />
                        <ellipse cx="25" cy="-70" rx="10" ry="22" fill="url(#chrome-grad)" />
                    </g>

                    <!-- Front Wheel (Single, Centered) -->
                    <g transform="translate(640, 660)">
                        <!-- Fork -->
                        <path d="M 0,0 L -15,-260" stroke="#555" stroke-width="16" stroke-linecap="round" />
                        <path d="M 0,0 L 15,-260" stroke="#555" stroke-width="16" stroke-linecap="round" />
                        
                        <!-- Tire -->
                        <ellipse cx="0" cy="0" rx="60" ry="22" fill="url(#tire-grad)" />
                        <!-- Rim -->
                        <ellipse cx="0" cy="0" rx="40" ry="14" fill="url(#chrome-grad)" />
                        <ellipse cx="0" cy="0" rx="15" ry="6" fill="#444" />
                        
                        <!-- Spokes -->
                        <g class="wheel-spin" style="transform-origin: 0 0;">
                            <ellipse cx="0" cy="0" rx="35" ry="12" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="8 8" />
                        </g>
                    </g>

                    <!-- Front Mudguard -->
                    <path d="M 580,660 A 60,22 0 0,1 700,660" fill="none" stroke="url(#chrome-grad)" stroke-width="8" />

                    <!-- Headlight (Distinct Object) -->
                    <g transform="translate(620, 510)">
                        <!-- Housing -->
                        <path d="M-15,-15 Q25,-15 30,0 Q25,15 -15,15 Z" fill="url(#chrome-grad)" />
                        <!-- Lens -->
                        <circle cx="0" cy="0" r="16" fill="#fff" stroke="#333" stroke-width="2" />
                        <circle cx="0" cy="0" r="10" fill="#ffeb3b" />
                        <!-- Reflection -->
                        <path d="M -8,-8 Q 0,-10 8,-8" fill="none" stroke="#fff" stroke-width="2" opacity="0.8" />
                    </g>

                    <!-- Driver (Simplified) -->
                    <g transform="translate(600, 400)">
                        <!-- Head/Turban -->
                        <path d="M-10,-50 C-20,-70 20,-70 20,-50 Z" fill="#fff" />
                        <circle cx="0" cy="-40" r="14" fill="#d35400" />
                        <!-- Body -->
                        <path d="M-20,-30 C-30,20 -10,50 10,50 L 30,50 C 40,20 20,-30 20,-30 Z" fill="#ecf0f1" />
                        <!-- Hands on bars -->
                        <circle cx="-30" cy="0" r="5" fill="#d35400" />
                        <circle cx="50" cy="0" r="5" fill="#d35400" />
                    </g>


                    <!-- ================= ROOF & CANOPY ================= -->
                    
                    <!-- Windshield (Glass) -->
                    <path d="M 480,420 L 680,420 L 680,300 L 480,300 Z" fill="url(#glass-grad)" stroke="#555" stroke-width="3" />
                    <!-- Windshield Reflection -->
                    <path d="M 490,410 L 550,410 L 550,320 L 490,320 Z" fill="rgba(255,255,255,0.3)" />

                    <!-- Canopy Roof (Red) -->
                    <!-- Top Surface -->
                    <path d="M 260,380 Q 470,250 700,380 L 700,400 Q 470,270 260,400 Z" fill="url(#roof-grad)" />
                    <!-- Side Edge Thickness -->
                    <path d="M 260,380 L 260,400 Q 470,270 700,400 L 700,380 Q 470,250 260,380 Z" fill="#b71c1c" />
                    
                    <!-- Roof Highlight -->
                    <path d="M 260,380 Q 470,250 700,380" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="4" stroke-linecap="round" />

                    <!-- Roof Spire -->
                    <g transform="translate(480, 265)">
                        <path d="M -8,10 L 0,-60 L 8,10 Z" fill="url(#chrome-grad)" />
                        <circle cx="0" cy="-60" r="14" fill="#f1c40f" />
                    </g>

                    <!-- Flag -->
                    <g transform="translate(480, 195)">
                        <path d="M 0,0 Q 40,20 80,0 L 80,-30 Q 40,-10 0,0 Z" fill="#e74c3c" />
                        <path d="M 0,0 Q 40,25 80,5 L 80,-25 Q 40,-5 0,0 Z" fill="#3498db" transform="translate(5,5)" />
                    </g>

                    <!-- Weathering/Rust Details -->
                    <g opacity="0.7">
                        <path d="M 480,630 L 490,640 L 485,635 Z" fill="#8D6E63" />
                        <circle cx="670" cy="630" r="2" fill="#8D6E63" />
                        <path d="M 280,635 L 290,640 L 285,638 Z" fill="#8D6E63" />
                    </g>

                </g>
            </svg>
        </div>

        <!-- INFO AREA -->
        <div class="info-panel">
            <div class="header-group">
                <span class="brand-tag">Heritage Series</span>
                <h1>Metro<br>Tuk-Tuk</h1>
                <p class="tagline">
                    The pulse of the city. A masterclass in compact engineering, designed for the chaos and charm of the streets.
                </p>
            </div>

            <div class="specs-grid">
                <div class="spec-item">
                    <h3>Engine</h3>
                    <p>3-Cyl Diesel</p>
                </div>
                <div class="spec-item">
                    <h3>Capacity</h3>
                    <p>3 Pax</p>
                </div>
                <div class="spec-item">
                    <h3>Top Speed</h3>
                    <p>80 km/h</p>
                </div>
                <div class="spec-item">
                    <h3>Chassis</h3>
                    <p>Tri-Wheel</p>
                </div>
            </div>

            <div class="controls-area">
                <span class="controls-label">Exterior Finish</span>
                <div class="color-options">
                    <!-- Yellow -->
                    <div class="color-btn active" style="background-color: #FFC107;" onclick="changeColor('#FFE082', '#FFC107', '#F57F17', this)"></div>
                    <!-- Green (CNG) -->
                    <div class="color-btn" style="background-color: #4CAF50;" onclick="changeColor('#A5D6A7', '#4CAF50', '#1B5E20', this)"></div>
                    <!-- Blue (Electric) -->
                    <div class="color-btn" style="background-color: #2196F3;" onclick="changeColor('#90CAF9', '#2196F3', '#0D47A1', this)"></div>
                    <!-- Teal -->
                    <div class="color-btn" style="background-color: #009688;" onclick="changeColor('#80CBC4', '#009688', '#004D40', this)"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function changeColor(light, main, dark, element) {
            // Update Active Button State
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            element.classList.add('active');

            // Update CSS Variables for Gradients
            document.documentElement.style.setProperty('--paint-light', light);
            document.documentElement.style.setProperty('--paint-main', main);
            document.documentElement.style.setProperty('--paint-dark', dark);
        }

        // CSS Animation Injection
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes spin {
                100% { transform: rotate(360deg); }
            }
            @keyframes bounce {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(4px); }
            }
            .wheel-spin {
                animation: spin 3s linear infinite;
            }
            .suspension {
                animation: bounce 4s ease-in-out infinite;
            }
        `;
        document.head.appendChild(styleSheet);
    </script>
</body>
</html>
