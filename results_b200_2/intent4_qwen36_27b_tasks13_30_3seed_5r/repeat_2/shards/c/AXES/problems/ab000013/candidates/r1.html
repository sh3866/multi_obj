<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Royal Tuk-Tuk | Heritage Series</title>
    <style>
        :root {
            --bg-dark: #111111;
            --bg-panel: #1a1a1a;
            --text-main: #f0f0f0;
            --text-muted: #a0a0a0;
            --accent-yellow: #FFC107;
            --accent-yellow-dark: #DAA520;
            --accent-red: #D32F2F;
            --accent-red-dark: #B71C1C;
            --accent-chrome: #C0C0C0;
            --font-stack: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            /* subtle noise texture for "lived-in" feel */
            background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000000 100%);
        }

        /* Layout Container */
        .showcase-container {
            position: relative;
            width: 95vw;
            height: 90vh;
            max-width: 1600px;
            background: linear-gradient(135deg, #222 0%, #151515 100%);
            border-radius: 12px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
            display: flex;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* Left Side: Visual */
        .visual-area {
            flex: 1.4;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Ambient glow behind the vehicle */
            background-image: 
                radial-gradient(circle at 40% 60%, rgba(255, 193, 7, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 60% 80%, rgba(211, 47, 47, 0.1) 0%, transparent 50%);
            z-index: 1;
        }

        /* Right Side: Info */
        .info-area {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: rgba(20, 20, 20, 0.95);
            border-left: 1px solid rgba(255,255,255,0.05);
            z-index: 2;
        }

        /* Typography */
        h1 {
            font-size: 4rem;
            line-height: 0.9;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 5px;
            background: linear-gradient(to right, #fff, #ccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        h2 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--accent-yellow);
            margin-bottom: 35px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        h2::before {
            content: '';
            display: block;
            width: 30px;
            height: 3px;
            background-color: var(--accent-yellow);
        }

        p.desc {
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 40px;
            font-size: 1.05rem;
            font-weight: 400;
            border-left: 2px solid rgba(255,255,255,0.1);
            padding-left: 20px;
        }

        /* Feature List */
        .specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: auto;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
        }

        .spec-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .spec-value {
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
        }

        /* Interactive Elements */
        .color-picker {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        
        .color-picker span {
            display: block;
            font-size: 0.75rem;
            margin-bottom: 15px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .colors {
            display: flex;
            gap: 20px;
        }

        .color-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .color-btn:hover {
            transform: translateY(-3px);
            border-color: rgba(255,255,255,0.5);
        }

        .color-btn.active {
            border-color: #fff;
            transform: scale(1.1);
        }
        
        .color-btn.active::after {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 50%;
        }

        /* SVG Styling */
        #rickshaw-svg {
            width: 100%;
            height: 100%;
            max-height: 700px;
            overflow: visible;
            /* Soft drop shadow for the whole object */
            filter: drop-shadow(0 25px 40px rgba(0,0,0,0.6));
        }

        /* Animations */
        .wheel-spin {
            transform-origin: center;
            animation: spin 1.5s linear infinite;
        }

        .suspension {
            animation: bounce 0.6s ease-in-out infinite alternate;
            transform-origin: center;
        }

        .flag-wave {
            animation: wave 2s ease-in-out infinite alternate;
            transform-origin: top left;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes bounce {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(4px) rotate(0.2deg); }
        }
        
        @keyframes wave {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(5deg) skewX(2deg); }
        }

        /* Responsive */
        @media (max-width: 900px) {
            .showcase-container {
                flex-direction: column-reverse;
                height: 98vh;
                border-radius: 0;
            }
            .info-area {
                padding: 30px;
                flex: 0 0 auto;
                height: 45%;
                border-left: none;
                border-top: 1px solid rgba(255,255,255,0.05);
            }
            .visual-area {
                height: 55%;
                background-image: radial-gradient(circle at 50% 80%, rgba(255, 193, 7, 0.15) 0%, transparent 60%);
            }
            h1 { font-size: 2.8rem; }
            #rickshaw-svg { max-width: 90%; }
        }
    </style>
</head>
<body>

    <div class="showcase-container">
        <!-- Visual Area -->
        <div class="visual-area">
            <!-- 
                SVG ViewBox: 0 0 1000 800
                Perspective: 3/4 Right facing
            -->
            <svg id="rickshaw-svg" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Body Gradients (Yellow) -->
                    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:var(--accent-yellow);stop-opacity:1" />
                        <stop offset="70%" style="stop-color:var(--accent-yellow-dark);stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#8a6d0b;stop-opacity:1" />
                    </linearGradient>
                    
                    <!-- Roof Gradients (Red) -->
                    <linearGradient id="roof-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#ff5252;stop-opacity:1" />
                        <stop offset="30%" style="stop-color:var(--accent-red);stop-opacity:1" />
                        <stop offset="100%" style="stop-color:var(--accent-red-dark);stop-opacity:1" />
                    </linearGradient>

                    <!-- Glass Gradient -->
                    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#81d4fa;stop-opacity:0.6" />
                        <stop offset="50%" style="stop-color:#29b6f6;stop-opacity:0.3" />
                        <stop offset="100%" style="stop-color:#0277bd;stop-opacity:0.7" />
                    </linearGradient>

                    <!-- Chrome/Metal -->
                    <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
                        <stop offset="40%" style="stop-color:#9e9e9e;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#424242;stop-opacity:1" />
                    </linearGradient>

                    <!-- Tire Gradient -->
                    <radialGradient id="tire-grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                        <stop offset="85%" style="stop-color:#333;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#111;stop-opacity:1" />
                    </radialGradient>

                    <!-- Light Beam -->
                    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#fff;stop-opacity:0.3" />
                        <stop offset="100%" style="stop-color:#fff;stop-opacity:0" />
                    </linearGradient>
                </defs>

                <!-- Ground Shadow (Matches perspective) -->
                <ellipse cx="500" cy="720" rx="320" ry="35" fill="rgba(0,0,0,0.5)" filter="blur(10px)" />

                <g class="suspension">
                    
                    <!-- ================= REAR CABIN (Depth) ================= -->
                    <!-- Back Wall (visible inside) -->
                    <path d="M 280,450 L 280,300 L 450,300 L 450,450 Z" fill="#1a1a1a" />
                    <!-- Back Seat Bench -->
                    <path d="M 280,430 L 450,430 L 450,450 L 280,450 Z" fill="#333" />
                    <!-- Back Seat Backrest -->
                    <path d="M 280,300 L 450,300 L 450,380 L 280,380 Z" fill="#222" />
                    <!-- Seat Stripes -->
                    <path d="M 300,300 L 300,380 M 330,300 L 330,380 M 360,300 L 360,380 M 390,300 L 390,380 M 420,300 L 420,380" stroke="#444" stroke-width="2" />

                    <!-- ================= REAR WHEELS (Perspective) ================= -->
                    <!-- Wheel 1 (Far Left) -->
                    <g transform="translate(250, 650)">
                        <!-- Tire -->
                        <ellipse cx="0" cy="0" rx="100" ry="40" fill="url(#tire-grad)" stroke="#222" stroke-width="2" />
                        <!-- Rim -->
                        <ellipse cx="0" cy="0" rx="75" ry="30" fill="#555" />
                        <!-- Spokes -->
                        <g class="wheel-spin" style="transform-origin: 0 0;">
                            <ellipse cx="0" cy="0" rx="60" ry="25" fill="none" stroke="#333" stroke-width="4" />
                        </g>
                        <!-- Mudguard -->
                        <path d="M-110,0 A110,45 0 0,1 110,0" fill="none" stroke="#000" stroke-width="12" />
                    </g>

                    <!-- Wheel 2 (Far Right) -->
                    <g transform="translate(750, 650)">
                        <ellipse cx="0" cy="0" rx="100" ry="40" fill="url(#tire-grad)" stroke="#222" stroke-width="2" />
                        <ellipse cx="0" cy="0" rx="75" ry="30" fill="#555" />
                        <g class="wheel-spin" style="transform-origin: 0 0;">
                             <ellipse cx="0" cy="0" rx="60" ry="25" fill="none" stroke="#333" stroke-width="4" />
                        </g>
                        <path d="M-110,0 A110,45 0 0,1 110,0" fill="none" stroke="#000" stroke-width="12" />
                    </g>

                    <!-- ================= BODY SHELL ================= -->
                    <!-- Floor -->
                    <path d="M 280,500 L 480,500 L 680,580 L 550,620 Z" fill="url(#body-grad)" />
                    
                    <!-- Left Side Panel (Facing viewer) -->
                    <path d="M 280,300 L 280,500 L 480,500 L 480,300 Z" fill="url(#body-grad)" stroke="#b7950b" stroke-width="1" />
                    <!-- Left Panel Detail (Grille/Vents) -->
                    <path d="M 300,350 L 460,350 L 460,480 L 300,480 Z" fill="rgba(0,0,0,0.1)" />
                    <path d="M 310,360 L 450,360 M 310,370 L 450,370 M 310,380 L 450,380 M 310,390 L 450,390" stroke="rgba(0,0,0,0.2)" stroke-width="3" />

                    <!-- Right Side Panel (Receding) -->
                    <path d="M 480,300 L 680,380 L 680,580 L 480,500 Z" fill="url(#body-grad)" stroke="#b7950b" stroke-width="1" />
                    <!-- Right Panel Shadow -->
                    <path d="M 480,300 L 680,380 L 680,580 L 480,500 Z" fill="rgba(0,0,0,0.15)" />

                    <!-- Front Fender (Left) -->
                    <path d="M 480,300 L 480,500 L 650,550 L 650,350 Z" fill="url(#body-grad)" />
                    <!-- Front Fender Highlight -->
                    <path d="M 480,300 L 650,350 L 650,400 L 480,350 Z" fill="rgba(255,255,255,0.2)" />

                    <!-- ================= FRONT CHASSIS ================= -->
                    <!-- Steering Column / Neck -->
                    <path d="M 630,350 L 680,380 L 720,300 L 670,270 Z" fill="#333" />
                    
                    <!-- Headlamp Housing -->
                    <g transform="translate(680, 380)">
                        <path d="M-10,-20 Q30,-20 40,20 Q30,50 -10,20 Z" fill="url(#chrome-grad)" />
                        <circle cx="15" cy="0" r="22" fill="#fff" stroke="#555" stroke-width="3" />
                        <circle cx="15" cy="0" r="15" fill="#ffeb3b" opacity="0.8" />
                        <!-- Headlight Beam -->
                        <path d="M 30,-15 L 600,-100 L 600,150 L 30,15 Z" fill="url(#beam-grad)" style="mix-blend-mode: screen;" />
                    </g>

                    <!-- Front Wheel (3/4 View) -->
                    <g transform="translate(720, 620)">
                        <!-- Fork -->
                        <path d="M 0,0 L -30,-200" stroke="#444" stroke-width="12" stroke-linecap="round" />
                        <!-- Tire -->
                        <ellipse cx="0" cy="0" rx="90" ry="35" fill="url(#tire-grad)" stroke="#222" stroke-width="2" />
                        <!-- Rim -->
                        <ellipse cx="0" cy="0" rx="65" ry="25" fill="#555" />
                        <!-- Spokes -->
                        <g class="wheel-spin" style="transform-origin: 0 0;">
                             <ellipse cx="0" cy="0" rx="50" ry="18" fill="none" stroke="#333" stroke-width="3" />
                        </g>
                        <!-- Mudguard -->
                        <path d="M-100,0 A100,40 0 0,1 100,0" fill="none" stroke="#000" stroke-width="10" />
                    </g>

                    <!-- ================= HANDLEBARS & DRIVER ================= -->
                    <!-- Handlebars -->
                    <path d="M 600,280 L 740,280" stroke="#222" stroke-width="10" stroke-linecap="round" />
                    <path d="M 600,280 L 600,250" stroke="#222" stroke-width="8" />
                    <path d="M 740,280 L 740,250" stroke="#222" stroke-width="8" />
                    
                    <!-- Mirrors -->
                    <g transform="translate(600, 250)">
                        <path d="M 0,0 L -20,-30" stroke="#222" stroke-width="4" />
                        <ellipse cx="-20" cy="-30" rx="8" ry="15" fill="url(#chrome-grad)" />
                    </g>
                    <g transform="translate(740, 250)">
                        <path d="M 0,0 L 20,-30" stroke="#222" stroke-width="4" />
                        <ellipse cx="20" cy="-30" rx="8" ry="15" fill="url(#chrome-grad)" />
                    </g>

                    <!-- Driver (Simplified) -->
                    <g transform="translate(620, 320)">
                        <!-- Head -->
                        <circle cx="0" cy="-40" r="18" fill="#d35400" />
                        <!-- Turban/Cap -->
                        <path d="M-20,-45 C-20,-70 20,-70 20,-45 Z" fill="#fff" />
                        <!-- Body -->
                        <path d="M-20,-20 C-30,20 -10,40 10,40 L 30,40 C 40,20 20,-20 20,-20 Z" fill="#fff" />
                    </g>

                    <!-- ================= ROOF & CABIN FRONT ================= -->
                    <!-- Windshield -->
                    <path d="M 480,300 L 650,350 L 650,250 L 480,200 Z" fill="url(#glass-grad)" stroke="#7f8c8d" stroke-width="2" />
                    <!-- Windshield Reflection -->
                    <path d="M 490,290 L 550,310 L 550,240 L 490,220 Z" fill="rgba(255,255,255,0.1)" />

                    <!-- Canopy Roof (Curved) -->
                    <path d="M 250,280 Q 480,120 700,280 L 720,380 Q 480,220 280,300 Z" fill="url(#roof-grad)" stroke="#b71c1c" stroke-width="1" />
                    <!-- Roof Highlight (3D Curve) -->
                    <path d="M 250,280 Q 480,120 700,280" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />

                    <!-- Roof Spire (Ornament) -->
                    <g transform="translate(480, 190)">
                        <path d="M -10,10 L 0,-40 L 10,10 Z" fill="url(#chrome-grad)" />
                        <circle cx="0" cy="-40" r="8" fill="var(--accent-yellow)" />
                    </g>

                    <!-- Flag (Prayer flag detail) -->
                    <g transform="translate(480, 150)">
                        <path class="flag-wave" d="M 0,0 Q 30,10 50,0 L 50,-20 Q 30,-10 0,0 Z" fill="#ff5252" />
                        <path class="flag-wave" d="M 0,0 Q 30,15 50,5 L 50,-15 Q 30,-5 0,0 Z" fill="#2196f3" transform="translate(5,5)" />
                    </g>

                    <!-- License Plate -->
                    <g transform="translate(580, 530)">
                        <rect x="0" y="0" width="60" height="30" fill="#fff" stroke="#333" rx="3" />
                        <text x="30" y="20" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">MH-04</text>
                    </g>

                </g>
            </svg>
        </div>

        <!-- Info Area -->
        <div class="info-area">
            <h2>Heritage Series</h2>
            <h1>Royal Metro</h1>
            <p class="desc">
                A modern reimagining of the iconic Indian auto-rickshaw. 
                Combining the agility of the three-wheel structure with 
                premium aesthetics and a vibrant street-inspired palette.
            </p>

            <div class="specs">
                <div class="spec-item">
                    <span class="spec-label">Engine</span>
                    <span class="spec-value">3-Cyl Diesel</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">Capacity</span>
                    <span class="spec-value">3 Passengers</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">Top Speed</span>
                    <span class="spec-value">80 km/h</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">Origin</span>
                    <span class="spec-value">Mumbai, IN</span>
                </div>
            </div>

            <div class="color-picker">
                <span>Exterior Finish</span>
                <div class="colors">
                    <!-- Yellow -->
                    <div class="color-btn active" style="background-color: #FFC107;" onclick="changeColor('#FFC107', '#DAA520', '#8a6d0b', this)"></div>
                    <!-- Red -->
                    <div class="color-btn" style="background-color: #D32F2F;" onclick="changeColor('#D32F2F', '#B71C1C', '#7f0000', this)"></div>
                    <!-- Teal -->
                    <div class="color-btn" style="background-color: #009688;" onclick="changeColor('#009688', '#00796B', '#004d40', this)"></div>
                    <!-- Blue -->
                    <div class="color-btn" style="background-color: #1976D2;" onclick="changeColor('#1976D2', '#1565C0', '#0d47a1', this)"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function changeColor(primary, secondary, tertiary, element) {
            // Update Active Button State
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            element.classList.add('active');

            // Update SVG Gradient
            const bodyGrad = document.getElementById('body-grad');
            bodyGrad.children[0].style.stopColor = primary;
            bodyGrad.children[1].style.stopColor = secondary;
            bodyGrad.children[2].style.stopColor = tertiary;
            
            // Update CSS Variable for consistency if needed elsewhere
            // document.documentElement.style.setProperty('--accent-yellow', primary);
        }
    </script>
</body>
</html>
