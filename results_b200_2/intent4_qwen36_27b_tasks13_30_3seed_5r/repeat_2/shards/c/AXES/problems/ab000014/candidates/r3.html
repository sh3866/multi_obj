<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMONO | Asanoha Collection</title>
    <style>
        :root {
            /* Palette - Refined & Muted */
            --bg-color: #F2EFE9; /* High-quality paper tone */
            --ink-color: #1A1A1A; /* Deep Sumi Ink */
            --accent-color: #B04030; /* Vermilion */
            --gold-color: #C5A065;
            
            /* Kimono Colors - Dynamic */
            --kimono-base: #2b4a5f; /* Deep Indigo */
            --kimono-dark: #1a303f;
            --kimono-light: #4a6b82;
            
            --obi-color: #8a3324;
            --obi-dark: #5e2016;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--ink-color);
            font-family: "Georgia", "Times New Roman", serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 100px; /* Main stage | Vertical text column */
            grid-template-rows: auto 1fr auto;
            position: relative;
        }

        /* Washi Texture Overlay */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.06'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        /* Vignette */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.05) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* Header */
        header {
            grid-column: 1 / -1;
            padding: 2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
        }

        .brand {
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            font-weight: bold;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            border-bottom: 1px solid var(--ink-color);
            padding-bottom: 0.5rem;
        }

        .brand-jp {
            font-size: 2rem;
            line-height: 1;
            opacity: 0.9;
        }

        /* Main Stage */
        main {
            grid-column: 1 / 2;
            grid-row: 2 / 3;
            position: relative;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        .kimono-stage {
            height: 90vh;
            width: auto;
            filter: drop-shadow(0 40px 60px rgba(0,0,0,0.12));
            transition: transform 0.1s ease-out;
            transform-origin: center center;
        }

        /* Vertical Text Column (Right) */
        .sidebar-right {
            grid-column: 2 / 3;
            grid-row: 2 / 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 0.75rem;
            letter-spacing: 0.5em;
            font-weight: bold;
            color: var(--ink-color);
            border-right: 2px solid var(--ink-color);
            padding-right: 1.5rem;
            height: 60vh;
            text-transform: uppercase;
        }

        /* Footer */
        footer {
            grid-column: 1 / 2;
            grid-row: 3 / 4;
            padding: 2rem 3rem;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .meta {
            font-size: 0.8rem;
            line-height: 1.8;
            max-width: 200px;
        }

        .meta strong {
            font-weight: bold;
            color: var(--accent-color);
        }

        /* Controls - Integrated into footer, no glassmorphism */
        .controls {
            display: flex;
            align-items: center;
            gap: 2rem;
            background: transparent;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--ink-color);
            opacity: 0.7;
        }

        /* Color Buttons */
        .color-options {
            display: flex;
            gap: 15px;
        }

        .color-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            background-clip: padding-box;
        }

        .color-btn:hover {
            transform: scale(1.15);
        }

        .color-btn.active::after {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border: 1px solid var(--ink-color);
            border-radius: 50%;
        }

        /* Toggle */
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .toggle-btn {
            width: 40px;
            height: 20px;
            background: #ccc;
            border-radius: 20px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-btn.active {
            background: var(--kimono-base);
        }

        .toggle-knob {
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .toggle-btn.active .toggle-knob {
            transform: translateX(20px);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            body {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
            }
            .sidebar-right { display: none; }
            main { grid-column: 1; }
            footer { grid-column: 1; flex-direction: column; gap: 2rem; align-items: center; }
            .kimono-stage { height: 70vh; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span class="brand-jp">和服</span>
            <span>Kimono Studio</span>
        </div>
        <div class="brand" style="border:none; text-align: right;">
            <span style="font-size: 1.2rem; font-weight: normal;">Collection 04</span>
        </div>
    </header>

    <div class="sidebar-right">
        <div class="vertical-text">
            TRADITIONAL CRAFTSMANSHIP / 伝統的工芸品
        </div>
    </div>

    <main>
        <!-- SVG Drawing Area -->
        <!-- viewBox adjusted to accommodate wide T-sleeves and long hem -->
        <svg class="kimono-stage" viewBox="0 0 900 1100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Fabric Gradient for 3D Drape -->
                <linearGradient id="fabric-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:rgb(0,0,0);stop-opacity:0.4" />
                    <stop offset="15%" style="stop-color:rgb(0,0,0);stop-opacity:0" />
                    <stop offset="50%" style="stop-color:rgb(255,255,255);stop-opacity:0.05" />
                    <stop offset="85%" style="stop-color:rgb(0,0,0);stop-opacity:0" />
                    <stop offset="100%" style="stop-color:rgb(0,0,0);stop-opacity:0.4" />
                </linearGradient>

                <!-- Obi Gradient for Silk Sheen -->
                <linearGradient id="obi-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:rgb(0,0,0);stop-opacity:0.6" />
                    <stop offset="20%" style="stop-color:rgb(255,255,255);stop-opacity:0.1" />
                    <stop offset="50%" style="stop-color:rgb(0,0,0);stop-opacity:0" />
                    <stop offset="80%" style="stop-color:rgb(255,255,255);stop-opacity:0.1" />
                    <stop offset="100%" style="stop-color:rgb(0,0,0);stop-opacity:0.6" />
                </linearGradient>

                <!-- Asanoha (Hemp Leaf) Pattern - Refined -->
                <pattern id="pattern-asanoha" x="0" y="0" width="60" height="104" patternUnits="userSpaceOnUse" patternTransform="scale(0.85)">
                    <rect width="60" height="104" fill="var(--kimono-base)" />
                    <!-- Geometric Hemp Leaf Motif -->
                    <g stroke="var(--kimono-light)" stroke-width="1.5" fill="none" opacity="0.4">
                        <!-- Center Hexagon -->
                        <polygon points="30,52 0,34 0,16 30,-2 60,16 60,34" />
                        <!-- Radiating Lines -->
                        <line x1="30" y1="52" x2="30" y2="104" />
                        <line x1="0" y1="34" x2="-30" y2="52" />
                        <line x1="60" y1="34" x2="90" y2="52" />
                        <line x1="0" y1="16" x2="-30" y2="-2" />
                        <line x1="60" y1="16" x2="90" y2="-2" />
                        <!-- Inner Details -->
                        <circle cx="30" cy="52" r="5" fill="var(--kimono-light)" opacity="0.3"/>
                    </g>
                </pattern>
            </defs>

            <!-- Group translated to center -->
            <g id="kimono-group" transform="translate(450, 150)">
                
                <!-- 1. Left Sleeve (Sode) - T-Shaped & Wide -->
                <g id="left-sleeve">
                    <!-- Sleeve Panel -->
                    <path d="M-70,-180 Q-120,-200 -250,-180 L-250,80 Q-250,110 -220,110 L-70,110 Z" fill="var(--kimono-base)" class="svg-pattern-fill" />
                    <!-- Sleeve Shadow/Depth -->
                    <path d="M-70,-180 Q-120,-200 -250,-180 L-250,80 Q-250,110 -220,110 L-70,110 Z" fill="url(#fabric-gradient)" opacity="0.5" />
                    <!-- Sleeve Opening (Sode-guchi) Highlight -->
                    <path d="M-245,-175 L-245,85" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
                    <!-- Underarm seam shadow -->
                    <path d="M-70,-180 L-70,110" stroke="rgba(0,0,0,0.1)" stroke-width="1" />
                </g>

                <!-- 2. Right Sleeve (Sode) - T-Shaped & Wide -->
                <g id="right-sleeve">
                    <path d="M70,-180 Q120,-200 250,-180 L250,80 Q250,110 220,110 L70,110 Z" fill="var(--kimono-base)" class="svg-pattern-fill" />
                    <path d="M70,-180 Q120,-200 250,-180 L250,80 Q250,110 220,110 L70,110 Z" fill="url(#fabric-gradient)" opacity="0.5" />
                </g>

                <!-- 3. Left Skirt Panel (Furisode drape) -->
                <!-- Adjusted to flow naturally from the sleeve joint -->
                <path d="M-70,-180 L-70,900 Q-70,920 -100,920 L-200,920 Q-220,920 -220,880 L-130,-180 Z" fill="var(--kimono-base)" class="svg-pattern-fill" />
                
                <!-- 4. Right Skirt Panel -->
                <path d="M70,-180 L70,900 Q70,920 100,920 L200,920 Q220,920 220,880 L130,-180 Z" fill="var(--kimono-base)" class="svg-pattern-fill" />

                <!-- 5. Main Torso -->
                <path d="M-70,-180 L70,-180 L70,900 L-70,900 Z" fill="var(--kimono-base)" class="svg-pattern-fill" />
                
                <!-- 6. Under-collar (Uchikake) - Visible overlap -->
                <path d="M-65,-170 L65,-170 L65,900 L-65,900 Z" fill="var(--kimono-dark)" opacity="0.3" />

                <!-- 7. Outer Collar (Eri) - Refined Geometry & Crossed -->
                <!-- Right Collar (Top layer) - White silk -->
                <path d="M50,-180 Q30,-150 0,-120 L0,900 Q-5,900 -5,900 L-5,-120 Q20,-150 40,-180 Z" fill="#fdfbf7" />
                <!-- Left Collar (Under layer - visible at neck) -->
                <path d="M-50,-180 Q-30,-150 0,-120 L0,-100 Q-30,-130 -55,-180 Z" fill="#fdfbf7" />
                <!-- Collar Shadow -->
                <path d="M-5,-120 L-5,900" stroke="rgba(0,0,0,0.08)" stroke-width="4" />

                <!-- 8. The Obi (Sash) - Volumetric, Wide & Textured -->
                <g transform="translate(0, 450)">
                    <!-- Obi Band (Wraps around) - Wider -->
                    <path d="M-85,-35 L85,-35 L85,85 L-85,85 Z" fill="var(--obi-color)" />
                    <!-- Obi Texture/Pattern -->
                    <path d="M-85,-35 L85,-35 L85,85 L-85,85 Z" fill="url(#obi-gradient)" />
                    
                    <!-- Gold Stripes on Obi -->
                    <line x1="-85" y1="-20" x2="85" y2="-20" stroke="var(--kimono-pattern)" stroke-width="1.5" opacity="0.8"/>
                    <line x1="-85" y1="70" x2="85" y2="70" stroke="var(--kimono-pattern)" stroke-width="1.5" opacity="0.8"/>
                    
                    <!-- Obi Knot (Taiko Musubi) - Front View -->
                    <g transform="translate(0, 25)">
                        <!-- Main Knot Body -->
                        <path d="M-75,-20 Q0,10 75,-20 L75,40 Q0,70 -75,40 Z" fill="var(--obi-color)" />
                        <!-- Knot Shadows -->
                        <path d="M-75,-20 L-75,40 Q-35,50 0,40 L0,-20 Z" fill="rgba(0,0,0,0.3)" />
                        <path d="M75,-20 L75,40 Q35,50 0,40 L0,-20 Z" fill="rgba(0,0,0,0.2)" />
                        
                        <!-- Center Decoration (O-bi no nagashi tails simplified) -->
                        <path d="M-15,40 L-15,110 L15,110 L15,40 Z" fill="var(--obi-dark)" />
                        <!-- Gold trim -->
                        <path d="M-70,-15 L70,-15" stroke="var(--kimono-pattern)" stroke-width="1.5" opacity="0.8"/>
                        <path d="M-70,35 L70,35" stroke="var(--kimono-pattern)" stroke-width="1.5" opacity="0.8"/>
                    </g>
                </g>

                <!-- 9. Fabric Folds & Shading -->
                <!-- Center Seam Shadow -->
                <path d="M0,-180 L0,450" stroke="black" stroke-width="2" opacity="0.15" />
                <path d="M0,550 L0,900" stroke="black" stroke-width="1.5" opacity="0.1" />
                
                <!-- Hem Folds - More organic -->
                <path d="M-110,800 Q-115,860 -110,900" stroke="black" stroke-width="2" opacity="0.15" fill="none" />
                <path d="M-90,830 Q-95,870 -90,900" stroke="black" stroke-width="2" opacity="0.15" fill="none" />
                <path d="M110,800 Q115,860 110,900" stroke="black" stroke-width="2" opacity="0.15" fill="none" />
                <path d="M90,830 Q95,870 90,900" stroke="black" stroke-width="2" opacity="0.15" fill="none" />
            </g>
        </svg>
    </main>

    <footer>
        <div class="meta">
            <p>Collection: <strong>Asanoha</strong></p>
            <p>Material: <strong>Yūzen Silk</strong></p>
            <p>Technique: <strong>Hand-dyed</strong></p>
        </div>

        <div class="controls">
            <div class="control-group">
                <span class="label">Colorway</span>
                <div class="color-options">
                    <button class="color-btn active" data-color="#2b4a5f" style="background-color: #2b4a5f;" aria-label="Indigo"></button>
                    <button class="color-btn" data-color="#8a3324" style="background-color: #8a3324;" aria-label="Vermilion"></button>
                    <button class="color-btn" data-color="#3e5f3a" style="background-color: #3e5f3a;" aria-label="Moss"></button>
                </div>
            </div>
            <div class="control-group">
                <span class="label">Detail</span>
                <div class="toggle-container">
                    <span class="toggle-label">Pattern</span>
                    <div class="toggle-btn active" id="pattern-toggle">
                        <div class="toggle-knob"></div>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const stage = document.querySelector('.kimono-stage');
            const root = document.documentElement;
            const colorBtns = document.querySelectorAll('.color-btn');
            const patternToggle = document.getElementById('pattern-toggle');
            
            let patternVisible = true;

            // 1. Subtle Parallax / Hover Effect
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth / 2 - e.clientX) / 100;
                const y = (window.innerHeight / 2 - e.clientY) / 100;
                
                // Limit rotation to avoid extreme angles
                const rx = Math.max(-3, Math.min(3, y));
                const ry = Math.max(-3, Math.min(3, x));

                stage.style.transform = `rotateY(${ry}deg) rotateX(${rx}deg)`;
            });

            // 2. Color Switching Logic
            const colors = {
                '#2b4a5f': { base: '#2b4a5f', dark: '#1a303f', light: '#4a6b82', obi: '#8a3324' }, // Indigo
                '#8a3324': { base: '#8a3324', dark: '#5e2016', light: '#b04a38', obi: '#2b4a5f' }, // Vermilion
                '#3e5f3a': { base: '#3e5f3a', dark: '#284026', light: '#5d7f58', obi: '#c5a065' }  // Moss
            };

            colorBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // UI Update
                    colorBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    // Color Update
                    const colorHex = btn.getAttribute('data-color');
                    const palette = colors[colorHex];

                    root.style.setProperty('--kimono-base', palette.base);
                    root.style.setProperty('--kimono-dark', palette.dark);
                    root.style.setProperty('--kimono-light', palette.light);
                    root.style.setProperty('--obi-color', palette.obi);
                    root.style.setProperty('--obi-dark', palette.base); // Invert obi logic slightly
                });
            });

            // 3. Pattern Toggle
            patternToggle.addEventListener('click', () => {
                const patternElements = document.querySelectorAll('.svg-pattern-fill');
                patternVisible = !patternVisible;
                
                patternToggle.classList.toggle('active');

                patternElements.forEach(el => {
                    if (patternVisible) {
                        el.style.fill = ''; // Revert to CSS class definition (url(#pattern...))
                    } else {
                        el.style.fill = 'var(--kimono-base)'; // Solid color
                    }
                });
            });
        });
    </script>
</body>
</html>
