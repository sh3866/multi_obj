<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical AI Behavior Analysis</title>
    <style>
        :root {
            --bg-dark: #0b0d14;
            --bg-panel: rgba(11, 13, 20, 0.85);
            --grid-line: rgba(255, 255, 255, 0.03);
            --accent-cyan: #00f0ff;
            --accent-cyan-dim: rgba(0, 240, 255, 0.2);
            --accent-red: #ff2a2a;
            --accent-red-dim: rgba(255, 42, 42, 0.15);
            --accent-amber: #ffcc00;
            --accent-amber-dim: rgba(255, 204, 0, 0.15);
            --accent-blue: #4a9eff;
            --accent-blue-dim: rgba(74, 158, 255, 0.15);
            --accent-magenta: #ff0055;
            --text-main: #e0e6ed;
            --text-muted: #6b768a;
            --border-light: rgba(255, 255, 255, 0.1);
            
            /* Typography */
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-data: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* --- Arena Container --- */
        #arena-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 60px 60px;
            cursor: crosshair;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- Scanlines --- */
        #arena-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 5;
        }

        /* --- UI Overlays --- */
        
        /* Header (Top Left) */
        .hud-header {
            position: absolute;
            top: 24px;
            left: 30px;
            z-index: 20;
            pointer-events: none;
        }
        .hud-header h1 {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-cyan);
            margin-bottom: 2px;
        }
        .hud-header h2 {
            font-size: 16px;
            font-weight: 400;
            color: var(--text-main);
            opacity: 0.8;
        }

        /* Legend (Top Right) */
        .hud-legend {
            position: absolute;
            top: 20px;
            right: 30px;
            background: var(--bg-panel);
            backdrop-filter: blur(8px);
            padding: 15px 20px;
            border: 1px solid var(--border-light);
            border-radius: 2px;
            z-index: 20;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .legend-title {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 11px;
            color: var(--text-main);
            font-family: var(--font-ui);
            font-weight: 500;
        }
        .legend-item:last-child { margin-bottom: 0; }
        .legend-swatch {
            width: 10px;
            height: 10px;
            margin-right: 10px;
            transform: rotate(45deg);
        }
        .swatch-patrol { background: var(--accent-blue); box-shadow: 0 0 5px var(--accent-blue); }
        .swatch-alert { background: var(--accent-amber); box-shadow: 0 0 5px var(--accent-amber); }
        .swatch-chase { background: var(--accent-red); box-shadow: 0 0 5px var(--accent-red); }
        .swatch-attack { background: var(--accent-magenta); box-shadow: 0 0 5px var(--accent-magenta); }

        /* Player Status (Bottom Left) */
        .hud-player-status {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 220px;
            z-index: 20;
            pointer-events: none;
        }
        .status-label {
            font-family: var(--font-data);
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .bar-outer {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            position: relative;
            transform: skewX(-15deg);
        }
        .bar-inner {
            height: 100%;
            background: var(--accent-cyan);
            width: 85%;
            box-shadow: 0 0 10px var(--accent-cyan);
            position: relative;
        }
        .bar-inner::after {
            content: '';
            position: absolute;
            right: 0; top: 0; bottom: 0;
            width: 2px;
            background: #fff;
            box-shadow: 0 0 8px #fff;
        }

        /* Tooltip */
        #tooltip {
            position: absolute;
            background: rgba(10, 12, 18, 0.95);
            border: 1px solid var(--border-light);
            padding: 12px 16px;
            border-radius: 2px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            transform: translate(20px, 20px);
            z-index: 100;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            min-width: 140px;
        }
        #tooltip h3 {
            font-size: 11px;
            color: #fff;
            margin-bottom: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .tt-row {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            margin-bottom: 2px;
        }
        .tt-label { color: var(--text-muted); }
        .tt-val { font-family: var(--font-data); font-weight: 700; }
    </style>
</head>
<body>

<div id="arena-container">
    <canvas id="gameCanvas"></canvas>
    
    <!-- Header -->
    <div class="hud-header">
        <h1>System Analysis</h1>
        <h2>Enemy AI Behavior</h2>
    </div>

    <!-- Legend -->
    <div class="hud-legend">
        <div class="legend-title">AI Logic States</div>
        <div class="legend-item"><div class="legend-swatch swatch-patrol"></div>PATROL</div>
        <div class="legend-item"><div class="legend-swatch swatch-alert"></div>ALERT</div>
        <div class="legend-item"><div class="legend-swatch swatch-chase"></div>CHASE</div>
        <div class="legend-item"><div class="legend-swatch swatch-attack"></div>ATTACK</div>
    </div>

    <!-- Player Status -->
    <div class="hud-player-status">
        <div class="status-label">
            <span>UNIT INTEGRITY</span>
            <span>85%</span>
        </div>
        <div class="bar-outer">
            <div class="bar-inner"></div>
        </div>
        <div class="status-label" style="margin-top: 8px;">
            <span>COORDS</span>
            <span id="player-coords">000, 000</span>
        </div>
    </div>

    <!-- Tooltip -->
    <div id="tooltip">
        <h3 id="tt-title">Hostile Unit</h3>
        <div class="tt-row">
            <span class="tt-label">State</span>
            <span class="tt-val" id="tt-state">IDLE</span>
        </div>
        <div class="tt-row">
            <span class="tt-label">Dist</span>
            <span class="tt-val" id="tt-dist">0m</span>
        </div>
    </div>
</div>

<script>
/**
 * Vector Utility
 */
class Vec2 {
    constructor(x, y) { this.x = x; this.y = y; }
    add(v) { return new Vec2(this.x + v.x, this.y + v.y); }
    sub(v) { return new Vec2(this.x - v.x, this.y - v.y); }
    mult(n) { return new Vec2(this.x * n, this.y * n); }
    mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
    normalize() {
        let m = this.mag();
        return m === 0 ? new Vec2(0, 0) : new Vec2(this.x / m, this.y / m);
    }
    dist(v) { return Math.sqrt(Math.pow(this.x - v.x, 2) + Math.pow(this.y - v.y, 2)); }
    copy() { return new Vec2(this.x, this.y); }
}

/**
 * Configuration
 */
const COLORS = {
    player: '#00f0ff',
    wall: '#161b26',
    wallBorder: '#2a3548',
    patrol: '#4a9eff',
    alert: '#ffcc00',
    chase: '#ff2a2a',
    attack: '#ff0055',
    path: 'rgba(255, 255, 255, 0.2)'
};

const STATES = {
    PATROL: 'patrol',
    ALERT: 'alert',
    CHASE: 'chase',
    ATTACK: 'attack'
};

/**
 * Game Objects
 */
class Wall {
    constructor(x, y, w, h) {
        this.x = x; this.y = y; this.w = w; this.h = h;
    }
    
    draw(ctx) {
        ctx.save();
        // Shadow
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 5;
        ctx.fillStyle = '#000';
        ctx.fillRect(this.x, this.y, this.w, this.h);
        
        ctx.shadowColor = 'transparent';
        
        // Body
        ctx.fillStyle = COLORS.wall;
        ctx.fillRect(this.x, this.y, this.w, this.h);
        
        // Top Bevel
        ctx.fillStyle = '#232c3d';
        ctx.fillRect(this.x, this.y, this.w, 4);
        
        // Border
        ctx.strokeStyle = COLORS.wallBorder;
        ctx.lineWidth = 1;
        ctx.strokeRect(this.x, this.y, this.w, this.h);
        
        // Tech detail (diagonal line)
        ctx.strokeStyle = 'rgba(0,0,0,0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y + this.h);
        ctx.lineTo(this.x + this.w, this.y);
        ctx.stroke();
        
        ctx.restore();
    }
}

class Player {
    constructor(x, y) {
        this.pos = new Vec2(x, y);
        this.target = new Vec2(x, y);
        this.radius = 14; // Increased scale
        this.speed = 5;
        this.angle = 0;
        this.trail = [];
    }

    update() {
        let dir = this.target.sub(this.pos);
        let dist = dir.mag();
        
        if (dist > 2) {
            dir = dir.normalize().mult(this.speed);
            this.pos = this.pos.add(dir);
            this.angle = Math.atan2(dir.y, dir.x);
        }

        // Trail
        if (dist > 2) {
            this.trail.push(this.pos.copy());
            if (this.trail.length > 15) this.trail.shift();
        } else {
            if (this.trail.length > 0) this.trail.shift();
        }
    }

    draw(ctx) {
        // Draw Reticle / Target Lines
        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        ctx.rotate(this.angle);
        
        // Crosshair lines
        ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-25, 0); ctx.lineTo(-15, 0);
        ctx.moveTo(15, 0); ctx.lineTo(25, 0);
        ctx.moveTo(0, -25); ctx.lineTo(0, -15);
        ctx.moveTo(0, 15); ctx.lineTo(0, 25);
        ctx.stroke();

        // Orbiting dots
        const time = Date.now() / 500;
        ctx.fillStyle = COLORS.player;
        ctx.beginPath();
        ctx.arc(Math.cos(time) * 20, Math.sin(time) * 20, 2, 0, Math.PI*2);
        ctx.arc(Math.cos(time + Math.PI) * 20, Math.sin(time + Math.PI) * 20, 2, 0, Math.PI*2);
        ctx.fill();

        ctx.restore();

        // Draw Trail
        if (this.trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(this.trail[0].x, this.trail[0].y);
            for (let i = 1; i < this.trail.length; i++) {
                ctx.lineTo(this.trail[i].x, this.trail[i].y);
            }
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // Draw Body
        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        ctx.rotate(this.angle);

        // Glow
        ctx.shadowColor = COLORS.player;
        ctx.shadowBlur = 20;

        // Triangle
        ctx.fillStyle = COLORS.player;
        ctx.beginPath();
        ctx.moveTo(16, 0); 
        ctx.lineTo(-10, 10);
        ctx.lineTo(-6, 0); 
        ctx.lineTo(-10, -10);
        ctx.closePath();
        ctx.fill();

        // Inner Core
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(2, 0, 3, 0, Math.PI*2);
        ctx.fill();

        ctx.restore();
    }
}

class Enemy {
    constructor(x, y, patrolPoints, forcedState = null) {
        this.pos = new Vec2(x, y);
        this.patrolPoints = patrolPoints;
        this.currentPatrolIdx = 0;
        this.radius = 10;
        this.angle = 0;
        this.speed = 1.5;
        
        this.state = forcedState || STATES.PATROL;
        this.isForced = forcedState !== null;
        
        // AI Params
        this.visionRange = 160;
        this.visionAngle = Math.PI / 2.2; 
        this.attackRange = 110;
        
        this.alertTimer = 0;
        this.lastKnownPos = null;
        this.pulse = 0;
        
        // Attack cooldown
        this.attackCooldown = 0;
    }

    update(player, walls) {
        // Logic for demo states
        if (this.isForced) {
            if (this.state === STATES.ATTACK || this.state === STATES.CHASE) {
                let vecToPlayer = player.pos.sub(this.pos);
                this.angle = Math.atan2(vecToPlayer.y, vecToPlayer.x);
                
                // Move if chase
                if(this.state === STATES.CHASE) {
                    this.moveTo(player.pos, 2.5);
                } else if (this.state === STATES.ATTACK) {
                    // Bobbing in place
                    this.pos.y += Math.sin(Date.now() / 200) * 0.2;
                    this.attackCooldown--;
                }
            } else if (this.state === STATES.PATROL) {
                this.moveTo(this.patrolPoints[this.currentPatrolIdx], 1.5);
                if (this.pos.dist(this.patrolPoints[this.currentPatrolIdx]) < 5) {
                    this.currentPatrolIdx = (this.currentPatrolIdx + 1) % this.patrolPoints.length;
                }
            } else if (this.state === STATES.ALERT) {
                this.angle += Math.sin(Date.now() / 150) * 0.1;
            }
            return;
        }

        // Real Logic (if not forced)
        let distToPlayer = this.pos.dist(player.pos);
        let vecToPlayer = player.pos.sub(this.pos);
        let angleToPlayer = Math.atan2(vecToPlayer.y, vecToPlayer.x);
        
        let angleDiff = angleToPlayer - this.angle;
        while (angleDiff <= -Math.PI) angleDiff += Math.PI*2;
        while (angleDiff > Math.PI) angleDiff -= Math.PI*2;

        switch (this.state) {
            case STATES.PATROL:
                if (distToPlayer < this.visionRange && Math.abs(angleDiff) < this.visionAngle / 2) {
                    this.state = STATES.CHASE;
                    this.lastKnownPos = player.pos.copy();
                } else {
                    this.moveTo(this.patrolPoints[this.currentPatrolIdx], 1);
                    if (this.pos.dist(this.patrolPoints[this.currentPatrolIdx]) < 5) {
                        this.currentPatrolIdx = (this.currentPatrolIdx + 1) % this.patrolPoints.length;
                    }
                }
                break;
            case STATES.CHASE:
                if (distToPlayer < this.visionRange && Math.abs(angleDiff) < this.visionAngle / 2) {
                    this.lastKnownPos = player.pos.copy();
                    if (distToPlayer < this.attackRange) {
                        this.state = STATES.ATTACK;
                    } else {
                        this.moveTo(player.pos, 2.5);
                    }
                } else {
                    this.state = STATES.ALERT;
                    this.alertTimer = 120;
                }
                break;
            case STATES.ATTACK:
                this.angle = angleToPlayer;
                if (distToPlayer > this.visionRange) {
                    this.state = STATES.ALERT;
                }
                break;
            case STATES.ALERT:
                this.moveTo(this.lastKnownPos, 2);
                this.alertTimer--;
                if (this.alertTimer <= 0 || this.pos.dist(this.lastKnownPos) < 5) {
                    this.state = STATES.PATROL;
                }
                break;
        }
    }

    moveTo(target, spd) {
        let dir = target.sub(this.pos);
        let dist = dir.mag();
        if (dist > 1) {
            this.angle = Math.atan2(dir.y, dir.x);
            dir = dir.normalize().mult(spd);
            this.pos = this.pos.add(dir);
        }
    }

    draw(ctx, isSelected) {
        let color = COLORS.patrol;
        if (this.state === STATES.ALERT) color = COLORS.alert;
        if (this.state === STATES.CHASE) color = COLORS.chase;
        if (this.state === STATES.ATTACK) color = COLORS.attack;

        // --- 1. Visualize Relationships (Lines) ---
        // Line of Sight / Targeting Beam
        if (this.state === STATES.CHASE || this.state === STATES.ATTACK) {
            ctx.beginPath();
            ctx.moveTo(this.pos.x, this.pos.y);
            // Find player (we can pass player to draw, or use global, but let's keep it self contained if possible. 
            // Actually, for this demo, we can just draw a line to where the player IS if visible.
            // We'll handle drawing the connection in the main loop for simplicity, or just draw a short beam here.
            ctx.lineTo(this.pos.x + Math.cos(this.angle) * 100, this.pos.y + Math.sin(this.angle) * 100);
            ctx.strokeStyle = `rgba(255, 42, 42, 0.3)`;
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        ctx.rotate(this.angle);

        this.pulse = (Math.sin(Date.now() / 300) + 1) / 2;

        // --- 2. Sharp Geometric Cones ---
        // Linear gradient from source (opaque) to edge (transparent)
        // We need to rotate the gradient or use a specific gradient type.
        // A linear gradient pointing outwards works best for a cone tip.
        let grad = ctx.createLinearGradient(0, 0, this.visionRange, 0);
        let baseColorRGB = this.hexToRgb(color);
        
        grad.addColorStop(0, `rgba(${baseColorRGB}, 0.4)`);
        grad.addColorStop(0.6, `rgba(${baseColorRGB}, 0.1)`);
        grad.addColorStop(1, `rgba(${baseColorRGB}, 0)`);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, this.visionRange, -this.visionAngle/2, this.visionAngle/2);
        ctx.closePath();
        ctx.fill();

        // --- 3. Attack Range (Solid thin stroke or low opacity fill) ---
        if (this.state === STATES.ATTACK) {
            ctx.restore(); // Unrotate for circle
            ctx.save();
            ctx.translate(this.pos.x, this.pos.y);
            
            ctx.beginPath();
            ctx.arc(0, 0, this.attackRange, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 0, 85, 0.6)`;
            ctx.lineWidth = 1;
            ctx.stroke();
            
            ctx.fillStyle = `rgba(255, 0, 85, 0.05)`;
            ctx.fill();
        }
        ctx.restore(); // Back to rotated

        // --- 4. Attack Visuals (Projectile) ---
        if (this.state === STATES.ATTACK && this.attackCooldown <= 0) {
            // Visual "Shot"
            ctx.save();
            ctx.translate(this.pos.x, this.pos.y);
            ctx.rotate(this.angle);
            
            // Draw laser beam
            ctx.shadowColor = COLORS.attack;
            ctx.shadowBlur = 10;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(10, 0);
            ctx.lineTo(100, 0); // Length of shot
            ctx.stroke();
            
            ctx.restore();
            
            // Simple cooldown logic just for visual
            if(Math.random() > 0.95) this.attackCooldown = 10; 
        }

        // --- 5. Unit Body ---
        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        ctx.rotate(this.angle);
        
        ctx.shadowColor = color;
        ctx.shadowBlur = 15;
        ctx.fillStyle = '#1a1d24';
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        
        ctx.beginPath();
        if (this.state === STATES.ATTACK) {
            // Aggressive triangle
            ctx.moveTo(14, 0);
            ctx.lineTo(-9, 9);
            ctx.lineTo(-9, -9);
        } else {
            // Diamond
            ctx.moveTo(12, 0);
            ctx.lineTo(0, 9);
            ctx.lineTo(-12, 0);
            ctx.lineTo(0, -9);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // --- 6. State Label with Backing Plate ---
        this.drawLabel(ctx, this.state.toUpperCase(), color);
        
        // Selection Ring
        if (isSelected) {
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(this.pos.x, this.pos.y, 22, 0, Math.PI*2);
            ctx.stroke();
        }
    }

    drawLabel(ctx, text, color) {
        ctx.save();
        const yOff = -28;
        const padding = 6;
        
        ctx.font = 'bold 11px "Inter", sans-serif';
        const width = ctx.measureText(text).width;
        
        // Backing Plate (Dark drop shadow / semi-transparent)
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.beginPath();
        // Rounded rect manually
        const bx = this.pos.x - width/2 - padding;
        const by = this.pos.y + yOff - 10;
        const bw = width + padding*2;
        const bh = 16;
        
        ctx.roundRect(bx, by, bw, bh, 2);
        ctx.fill();
        
        // Border
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.stroke();

        // Text
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, this.pos.x, this.pos.y + yOff + 1);
        
        ctx.restore();
    }

    hexToRgb(hex) {
        // Expand shorthand form (e.g. "03F") to full form (e.g. "0033FF")
        var shorthandRegex = /^#?([a-f\d])([a-f\d])([a-f\d])$/i;
        hex = hex.replace(shorthandRegex, function(m, r, g, b) {
            return r + r + g + g + b + b;
        });
        var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? 
            parseInt(result[1], 16) + ', ' + parseInt(result[2], 16) + ', ' + parseInt(result[3], 16) 
            : '255, 255, 255';
    }
}

/**
 * Main System
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
const ttState = document.getElementById('tt-state');
const ttDist = document.getElementById('tt-dist');
const playerCoordsEl = document.getElementById('player-coords');

let width, height;
let player;
let enemies = [];
let walls = [];
let mousePos = new Vec2(0,0);
let selectedEnemy = null;

function resize() {
    width = canvas.parentElement.offsetWidth;
    height = canvas.parentElement.offsetHeight;
    canvas.width = width;
    canvas.height = height;
    initLevel();
}

function initLevel() {
    // Player
    player = new Player(width * 0.2, height * 0.7);
    player.target = new Vec2(width * 0.2, height * 0.7);

    // Walls
    walls = [
        new Wall(width * 0.4, height * 0.2, 20, height * 0.5),
        new Wall(width * 0.7, height * 0.6, width * 0.2, 20),
        new Wall(width * 0.1, height * 0.3, width * 0.15, 20),
    ];

    // Enemies
    // 1. ATTACK
    enemies.push(new Enemy(width * 0.8, height * 0.7, [
        new Vec2(width * 0.8, height * 0.6),
        new Vec2(width * 0.9, height * 0.8)
    ], STATES.ATTACK));

    // 2. ALERT
    enemies.push(new Enemy(width * 0.3, height * 0.4, [
        new Vec2(width * 0.3, height * 0.3),
        new Vec2(width * 0.3, height * 0.5)
    ], STATES.ALERT));

    // 3. PATROL
    enemies.push(new Enemy(width * 0.5, height * 0.15, [
        new Vec2(width * 0.4, height * 0.15),
        new Vec2(width * 0.6, height * 0.15)
    ], STATES.PATROL));
    
    // 4. CHASE (Instantiated per Critique)
    enemies.push(new Enemy(width * 0.5, height * 0.8, [
        new Vec2(width * 0.5, height * 0.8),
        new Vec2(width * 0.5, height * 0.9)
    ], STATES.CHASE));
}

// Interaction
window.addEventListener('resize', resize);
canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mousePos = new Vec2(e.clientX - rect.left, e.clientY - rect.top);
    player.target = mousePos;

    // Update UI Coords
    playerCoordsEl.innerText = `${Math.round(player.pos.x)}, ${Math.round(player.pos.y)}`;

    let hovered = null;
    enemies.forEach(en => {
        if (en.pos.dist(mousePos) < 30) hovered = en;
    });

    if (hovered) {
        selectedEnemy = hovered;
        canvas.style.cursor = 'pointer';
        tooltip.style.opacity = 1;
        tooltip.style.left = (e.clientX + 20) + 'px';
        tooltip.style.top = (e.clientY + 20) + 'px';
        
        ttState.innerText = hovered.state.toUpperCase();
        ttDist.innerText = Math.round(hovered.pos.dist(player.pos)) + "m";
        
        // Color logic
        let col = '#fff';
        if(hovered.state === STATES.PATROL) col = COLORS.patrol;
        if(hovered.state === STATES.ALERT) col = COLORS.alert;
        if(hovered.state === STATES.CHASE) col = COLORS.chase;
        if(hovered.state === STATES.ATTACK) col = COLORS.attack;
        ttState.style.color = col;

    } else {
        selectedEnemy = null;
        canvas.style.cursor = 'crosshair';
        tooltip.style.opacity = 0;
    }
});

function drawPatrolPaths() {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]); // Dotted line for pathfinding data
    
    enemies.forEach(en => {
        // Draw full route for patrol
        if (en.state === STATES.PATROL) {
            ctx.beginPath();
            ctx.moveTo(en.patrolPoints[0].x, en.patrolPoints[0].y);
            for(let i=1; i<en.patrolPoints.length; i++) {
                ctx.lineTo(en.patrolPoints[i].x, en.patrolPoints[i].y);
            }
            ctx.closePath();
            ctx.stroke();
            
            // Waypoint markers
            en.patrolPoints.forEach(p => {
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
                ctx.fill();
            });
        }
    });

    // Draw Chase Path (Critique Item 2)
    enemies.forEach(en => {
        if (en.state === STATES.CHASE) {
            ctx.strokeStyle = 'rgba(255, 42, 42, 0.3)';
            ctx.beginPath();
            ctx.moveTo(en.pos.x, en.pos.y);
            ctx.lineTo(player.pos.x, player.pos.y);
            ctx.stroke();
        }
    });

    ctx.setLineDash([]);
    ctx.restore();
}

function animate() {
    ctx.clearRect(0, 0, width, height);

    // Logic
    player.update();
    enemies.forEach(en => en.update(player, walls));

    // Draw Layers
    drawPatrolPaths();
    
    walls.forEach(w => w.draw(ctx));
    
    // Sort by Y
    const renderList = [...enemies, player].sort((a, b) => a.pos.y - b.pos.y);
    
    renderList.forEach(obj => {
        if (obj instanceof Enemy) {
            obj.draw(ctx, obj === selectedEnemy);
        } else {
            obj.draw(ctx);
        }
    });

    // Draw Player-AI Relationships (Critique Item 2) - Visual Link
    // Only draw if enemy is targeting player (Chase/Attack)
    ctx.save();
    enemies.forEach(en => {
        if (en.state === STATES.CHASE || en.state === STATES.ATTACK) {
            ctx.beginPath();
            ctx.moveTo(en.pos.x, en.pos.y);
            ctx.lineTo(player.pos.x, player.pos.y);
            ctx.strokeStyle = 'rgba(255, 42, 42, 0.2)';
            ctx.lineWidth = 1;
            ctx.setLineDash([2, 4]);
            ctx.stroke();
            
            // Midpoint indicator
            const midX = (en.pos.x + player.pos.x) / 2;
            const midY = (en.pos.y + player.pos.y) / 2;
            ctx.fillStyle = 'rgba(255, 42, 42, 0.5)';
            ctx.beginPath();
            ctx.arc(midX, midY, 2, 0, Math.PI*2);
            ctx.fill();
        }
    });
    ctx.setLineDash([]);
    ctx.restore();

    requestAnimationFrame(animate);
}

// Init
resize();
animate();

</script>
</body>
