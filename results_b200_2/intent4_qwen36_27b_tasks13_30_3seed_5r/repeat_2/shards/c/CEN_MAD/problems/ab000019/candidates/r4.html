<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical AI Behavior Analysis - Revised</title>
    <style>
        :root {
            --bg-dark: #05070a;
            --grid-line: rgba(255, 255, 255, 0.015); /* Reduced opacity per Critique 4 */
            --panel-bg: rgba(10, 12, 16, 0.6);
            --panel-border: rgba(255, 255, 255, 0.1);
            
            /* State Colors */
            --col-patrol: #4a9eff;
            --col-alert: #ffcc00;
            --col-chase: #ff6600;
            --col-attack: #ff2a2a;
            --col-player: #00f0ff;
            --col-wall: #1a202c;
            
            --text-main: #e0e6ed;
            --text-muted: #8892a0;
            
            /* Fonts */
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "Consolas", "Monaco", "Courier New", monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* --- Arena Container --- */
        #arena-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
            cursor: crosshair;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- CRT Overlay Effect (Subtle) --- */
        #arena-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.05) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.6);
        }

        /* --- UI Overlays --- */
        
        /* Header (Top Left) */
        .hud-header {
            position: absolute;
            top: 24px;
            left: 30px;
            z-index: 20;
            pointer-events: none;
            border-left: 3px solid var(--col-player);
            padding-left: 15px;
        }
        .hud-header h1 {
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--col-player);
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }
        .hud-header h2 {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-main);
            opacity: 0.8;
            margin-bottom: 15px;
        }

        /* --- Legend (Top Left, under Header) - Critique 2 --- */
        .hud-legend {
            display: flex;
            gap: 15px;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(4px);
        }

        .legend-item {
            display: flex;
            align-items: center;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        
        .legend-swatch {
            width: 8px;
            height: 8px;
            margin-right: 6px;
            transform: rotate(45deg); /* Diamond shape */
            box-shadow: 0 0 4px currentColor;
        }

        /* --- Player HUD (Bottom Center, Floating) - Critique 2 --- */
        .player-hud {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            background: var(--panel-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 12px 16px;
            z-index: 20;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Connecting Line for HUD */
        .hud-anchor {
            position: absolute;
            top: -100px; /* Dynamic via JS usually, but CSS static here for demo */
            left: 50%;
            width: 1px;
            height: 100px;
            background: linear-gradient(to top, var(--col-player), transparent);
            opacity: 0.3;
            pointer-events: none;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-label {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status-value {
            font-family: var(--font-mono);
            font-size: 10px;
            color: #fff;
            font-weight: 600;
        }

        .integrity-bar-outer {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            border-radius: 2px;
        }
        .integrity-bar-inner {
            height: 100%;
            background: var(--col-player);
            width: 85%;
            box-shadow: 0 0 8px var(--col-player);
        }

        /* Tooltip */
        #tooltip {
            position: absolute;
            background: rgba(5, 7, 10, 0.9);
            border: 1px solid var(--panel-border);
            padding: 10px 14px;
            border-radius: 2px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
            transform: translate(15px, 15px);
            z-index: 100;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            min-width: 100px;
        }
        #tooltip h3 {
            font-size: 9px;
            color: #fff;
            margin-bottom: 4px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }
        .tt-row {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            margin-bottom: 2px;
        }
        .tt-label { color: var(--text-muted); }
        .tt-val { font-family: var(--font-mono); font-weight: 700; }

    </style>
</head>
<body>

<div id="arena-container">
    <canvas id="gameCanvas"></canvas>
    
    <!-- Header & Legend (Top Left) -->
    <div class="hud-header">
        <h1>System Analysis</h1>
        <h2>AI Behavioral States</h2>
        
        <!-- Legend moved here per Critique 2 -->
        <div class="hud-legend">
            <div class="legend-item" style="color: var(--col-patrol)">
                <div class="legend-swatch" style="background: var(--col-patrol)"></div>PATROL
            </div>
            <div class="legend-item" style="color: var(--col-alert)">
                <div class="legend-swatch" style="background: var(--col-alert)"></div>ALERT
            </div>
            <div class="legend-item" style="color: var(--col-chase)">
                <div class="legend-swatch" style="background: var(--col-chase)"></div>CHASE
            </div>
            <div class="legend-item" style="color: var(--col-attack)">
                <div class="legend-swatch" style="background: var(--col-attack)"></div>ATTACK
            </div>
        </div>
    </div>

    <!-- Player HUD (Bottom Center) -->
    <div class="player-hud" id="playerHud">
        <div class="hud-anchor" id="hudAnchor"></div>
        <div class="status-row">
            <span class="status-label">Unit Integrity</span>
            <span class="status-value" style="color: var(--col-player)">85%</span>
        </div>
        <div class="integrity-bar-outer">
            <div class="integrity-bar-inner"></div>
        </div>
        <div class="status-row" style="margin-top: 4px;">
            <span class="status-label">Target Coords</span>
            <span class="status-value" id="player-coords">000, 000</span>
        </div>
    </div>

    <!-- Tooltip -->
    <div id="tooltip">
        <h3 id="tt-title">Hostile Unit</h3>
        <div class="tt-row">
            <span class="tt-label">State</span>
            <span class="tt-val" id="tt-state">IDLE</span>
        </div>
        <div class="tt-row">
            <span class="tt-label">Dist</span>
            <span class="tt-val" id="tt-dist">0m</span>
        </div>
    </div>
</div>

<script>
/**
 * Vector Utility
 */
class Vec2 {
    constructor(x, y) { this.x = x; this.y = y; }
    add(v) { return new Vec2(this.x + v.x, this.y + v.y); }
    sub(v) { return new Vec2(this.x - v.x, this.y - v.y); }
    mult(n) { return new Vec2(this.x * n, this.y * n); }
    mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
    normalize() {
        let m = this.mag();
        return m === 0 ? new Vec2(0, 0) : new Vec2(this.x / m, this.y / m);
    }
    dist(v) { return Math.sqrt(Math.pow(this.x - v.x, 2) + Math.pow(this.y - v.y, 2)); }
    copy() { return new Vec2(this.x, this.y); }
}

/**
 * Configuration
 */
const COLORS = {
    player: '#00f0ff',
    wall: '#1a202c',
    wallStroke: '#3a4b66',
    patrol: '#4a9eff',
    alert: '#ffcc00',
    chase: '#ff6600',
    attack: '#ff2a2a'
};

const STATES = {
    PATROL: 'patrol',
    ALERT: 'alert',
    CHASE: 'chase',
    ATTACK: 'attack'
};

/**
 * Game Objects
 */
class Wall {
    constructor(x, y, w, h) {
        this.x = x; this.y = y; this.w = w; this.h = h;
    }
    
    draw(ctx) {
        ctx.save();
        // Shadow for depth
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 15;
        ctx.shadowOffsetY = 5;
        
        // Body
        ctx.fillStyle = COLORS.wall;
        ctx.fillRect(this.x, this.y, this.w, this.h);
        
        ctx.shadowColor = 'transparent';
        
        // "Hard Light" Edge
        ctx.strokeStyle = COLORS.wallStroke;
        ctx.lineWidth = 2;
        ctx.strokeRect(this.x + 1, this.y + 1, this.w - 2, this.h - 2);
        
        // Top Bevel
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.fillRect(this.x, this.y, this.w, 4);
        
        ctx.restore();
    }
}

class Player {
    constructor(x, y) {
        this.pos = new Vec2(x, y);
        this.target = new Vec2(x, y);
        this.radius = 12;
        this.speed = 6;
        this.angle = 0;
        this.trail = [];
    }

    update() {
        let dir = this.target.sub(this.pos);
        let dist = dir.mag();
        
        if (dist > 2) {
            dir = dir.normalize().mult(this.speed);
            this.pos = this.pos.add(dir);
            this.angle = Math.atan2(dir.y, dir.x);
        }

        // Trail logic
        if (dist > 2) {
            this.trail.push(this.pos.copy());
            if (this.trail.length > 15) this.trail.shift();
        } else {
            if (this.trail.length > 0) this.trail.shift();
        }
    }

    draw(ctx) {
        // Draw Trail
        if (this.trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(this.trail[0].x, this.trail[0].y);
            for (let i = 1; i < this.trail.length; i++) {
                ctx.lineTo(this.trail[i].x, this.trail[i].y);
            }
            // Gradient trail
            let grad = ctx.createLinearGradient(this.trail[0].x, this.trail[0].y, this.pos.x, this.pos.y);
            grad.addColorStop(0, 'rgba(0, 240, 255, 0)');
            grad.addColorStop(1, 'rgba(0, 240, 255, 0.3)');
            ctx.strokeStyle = grad;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        // Sonar Pulse
        const time = Date.now() / 1000;
        const pulseScale = 1 + Math.sin(time * 3) * 0.2;
        
        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        
        // Outer Ring (Targeting Reticle feel)
        ctx.beginPath();
        ctx.arc(0, 0, this.radius * 2.2, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(0, 240, 255, 0.2)`;
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Breathing Pulse
        ctx.beginPath();
        ctx.arc(0, 0, this.radius * 1.5 * pulseScale, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(0, 240, 255, ${0.4 - (pulseScale - 1)})`;
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.rotate(this.angle);

        // Player Shape (Command Aesthetic - Critique 4)
        ctx.shadowColor = COLORS.player;
        ctx.shadowBlur = 20;
        
        // Core
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(14, 0);
        ctx.lineTo(-8, 8);
        ctx.lineTo(-8, -8);
        ctx.closePath();
        ctx.fill();

        // Inner detail
        ctx.fillStyle = COLORS.player;
        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.lineTo(-4, 4);
        ctx.lineTo(-4, -4);
        ctx.fill();

        ctx.restore();
    }
}

class Enemy {
    constructor(x, y, patrolPoints, forcedState = null) {
        this.pos = new Vec2(x, y);
        this.patrolPoints = patrolPoints;
        this.currentPatrolIdx = 0;
        this.radius = 10;
        this.angle = 0;
        this.speed = 1.5;
        
        this.state = forcedState || STATES.PATROL;
        this.isForced = forcedState !== null;
        
        // AI Params
        this.visionRange = 160;
        this.visionAngle = Math.PI / 2.2; 
        this.attackRange = 110;
        
        this.alertTimer = 0;
        this.lastKnownPos = null;
        this.trail = []; // For Chase velocity (Critique 4)
    }

    update(player, walls) {
        // Logic for demo states
        if (this.isForced) {
            if (this.state === STATES.ATTACK || this.state === STATES.CHASE) {
                let vecToPlayer = player.pos.sub(this.pos);
                this.angle = Math.atan2(vecToPlayer.y, vecToPlayer.x);
                
                if(this.state === STATES.CHASE) {
                    // Add to trail
                    this.trail.push(this.pos.copy());
                    if(this.trail.length > 8) this.trail.shift();
                    
                    this.moveTo(player.pos, 2.5);
                } else if (this.state === STATES.ATTACK) {
                    // Bobbing in place
                    this.pos.y += Math.sin(Date.now() / 200) * 0.2;
                    this.trail = []; // Clear trail when attacking
                }
            } else if (this.state === STATES.PATROL) {
                this.moveTo(this.patrolPoints[this.currentPatrolIdx], 1.5);
                if (this.pos.dist(this.patrolPoints[this.currentPatrolIdx]) < 5) {
                    this.currentPatrolIdx = (this.currentPatrolIdx + 1) % this.patrolPoints.length;
                }
            } else if (this.state === STATES.ALERT) {
                this.angle += Math.sin(Date.now() / 150) * 0.1;
            }
            return;
        }

        // Real Logic
        let distToPlayer = this.pos.dist(player.pos);
        let vecToPlayer = player.pos.sub(this.pos);
        let angleToPlayer = Math.atan2(vecToPlayer.y, vecToPlayer.x);
        
        let angleDiff = angleToPlayer - this.angle;
        while (angleDiff <= -Math.PI) angleDiff += Math.PI*2;
        while (angleDiff > Math.PI) angleDiff -= Math.PI*2;

        switch (this.state) {
            case STATES.PATROL:
                if (distToPlayer < this.visionRange && Math.abs(angleDiff) < this.visionAngle / 2) {
                    this.state = STATES.CHASE;
                    this.lastKnownPos = player.pos.copy();
                } else {
                    this.moveTo(this.patrolPoints[this.currentPatrolIdx], 1);
                    if (this.pos.dist(this.patrolPoints[this.currentPatrolIdx]) < 5) {
                        this.currentPatrolIdx = (this.currentPatrolIdx + 1) % this.patrolPoints.length;
                    }
                }
                break;
            case STATES.CHASE:
                if (distToPlayer < this.visionRange && Math.abs(angleDiff) < this.visionAngle / 2) {
                    this.lastKnownPos = player.pos.copy();
                    if (distToPlayer < this.attackRange) {
                        this.state = STATES.ATTACK;
                    } else {
                        this.moveTo(player.pos, 2.5);
                    }
                } else {
                    this.state = STATES.ALERT;
                    this.alertTimer = 120;
                }
                break;
            case STATES.ATTACK:
                this.angle = angleToPlayer;
                if (distToPlayer > this.visionRange) {
                    this.state = STATES.ALERT;
                }
                break;
            case STATES.ALERT:
                this.moveTo(this.lastKnownPos, 2);
                this.alertTimer--;
                if (this.alertTimer <= 0 || this.pos.dist(this.lastKnownPos) < 5) {
                    this.state = STATES.PATROL;
                }
                break;
        }
    }

    moveTo(target, spd) {
        let dir = target.sub(this.pos);
        let dist = dir.mag();
        if (dist > 1) {
            this.angle = Math.atan2(dir.y, dir.x);
            dir = dir.normalize().mult(spd);
            this.pos = this.pos.add(dir);
        }
    }

    draw(ctx, isSelected) {
        let color = COLORS.patrol;
        
        if (this.state === STATES.ALERT) color = COLORS.alert;
        if (this.state === STATES.CHASE) color = COLORS.chase;
        if (this.state === STATES.ATTACK) color = COLORS.attack;

        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        ctx.rotate(this.angle);

        // --- 1. Vision Cone (Standardized Gradient - Critique 3) ---
        // All cones use gradient now, but Chase/Attack are brighter
        let grad = ctx.createLinearGradient(0, 0, this.visionRange, 0);
        let rgb = this.hexToRgb(color);
        
        // Opacity based on state (Critique 4)
        let alphaStart = 0.1;
        if(this.state === STATES.CHASE) alphaStart = 0.5; // High visibility
        if(this.state === STATES.ATTACK) alphaStart = 0.6; // Highest visibility
        
        grad.addColorStop(0, `rgba(${rgb}, ${alphaStart})`);
        grad.addColorStop(1, `rgba(${rgb}, 0)`);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, this.visionRange, -this.visionAngle/2, this.visionAngle/2);
        ctx.closePath();
        ctx.fill();

        // --- 2. Attack Range Ring (Only for Attack state) ---
        if (this.state === STATES.ATTACK) {
            ctx.beginPath();
            ctx.arc(0, 0, this.attackRange, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(${rgb}, 0.4)`;
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.fillStyle = `rgba(${rgb}, 0.05)`;
            ctx.fill();
        }

        ctx.restore(); // Unrotate for body drawing
        
        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        ctx.rotate(this.angle);

        // --- 3. Standardized Diamond Shape (Critique 3) ---
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#0b0d14'; // Dark hollow center
        ctx.strokeStyle = color;
        ctx.lineWidth = 2; // Standardized stroke
        
        ctx.beginPath();
        ctx.moveTo(12, 0); // Right
        ctx.lineTo(0, 9);  // Bottom
        ctx.lineTo(-12, 0); // Left
        ctx.lineTo(0, -9); // Top
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // --- 4. Unified State Label (Critique 3) ---
        this.drawLabel(ctx, this.state.toUpperCase(), color);
    }

    drawLabel(ctx, text, color) {
        ctx.save();
        const yOff = -30;
        
        ctx.font = 'bold 10px -apple-system, sans-serif';
        const width = ctx.measureText(text).width;
        const padding = 6;
        const pillHeight = 16;
        
        const bx = this.pos.x - width/2 - padding;
        const by = this.pos.y + yOff - pillHeight/2;
        const bw = width + padding*2;
        
        // Connecting line
        ctx.beginPath();
        ctx.moveTo(this.pos.x, this.pos.y - 10);
        ctx.lineTo(this.pos.x, by + pillHeight);
        ctx.strokeStyle = `rgba(255,255,255,0.2)`;
        ctx.lineWidth = 1;
        ctx.stroke();

        // Pill Background
        ctx.fillStyle = 'rgba(10, 12, 16, 0.9)';
        ctx.beginPath();
        ctx.roundRect(bx, by, bw, pillHeight, 2); // 2px radius per Critique 3
        ctx.fill();
        
        // Pill Border
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5; // 1.5px stroke per Critique 3
        ctx.stroke();

        // Text
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, this.pos.x, this.pos.y + yOff);
        
        ctx.restore();
    }

    hexToRgb(hex) {
        var shorthandRegex = /^#?([a-f\d])([a-f\d])([a-f\d])$/i;
        hex = hex.replace(shorthandRegex, function(m, r, g, b) { return r + r + g + g + b + b; });
        var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? parseInt(result[1], 16) + ', ' + parseInt(result[2], 16) + ', ' + parseInt(result[3], 16) : '255, 255, 255';
    }
}

/**
 * Main System
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
const ttState = document.getElementById('tt-state');
const ttDist = document.getElementById('tt-dist');
const playerCoordsEl = document.getElementById('player-coords');
const playerHud = document.getElementById('playerHud');
const hudAnchor = document.getElementById('hudAnchor');

let width, height;
let player;
let enemies = [];
let walls = [];
let mousePos = new Vec2(0,0);
let selectedEnemy = null;

function resize() {
    width = canvas.parentElement.offsetWidth;
    height = canvas.parentElement.offsetHeight;
    canvas.width = width;
    canvas.height = height;
    initLevel();
}

function initLevel() {
    // Player (Bottom Left quadrant)
    player = new Player(width * 0.2, height * 0.7);
    player.target = new Vec2(width * 0.2, height * 0.7);

    // Walls (Central Vertical Wall for pathfinding demo)
    walls = [
        new Wall(width * 0.4, height * 0.2, 20, height * 0.6),
        new Wall(width * 0.7, height * 0.6, width * 0.2, 20),
        new Wall(width * 0.1, height * 0.3, width * 0.15, 20),
    ];

    // Enemies
    
    // 1. ATTACK (Closer to player - Critique 1)
    enemies.push(new Enemy(width * 0.35, height * 0.85, [
        new Vec2(width * 0.35, height * 0.85),
        new Vec2(width * 0.4, height * 0.9)
    ], STATES.ATTACK));

    // 2. ALERT (Center-Left)
    enemies.push(new Enemy(width * 0.3, height * 0.4, [
        new Vec2(width * 0.3, height * 0.3),
        new Vec2(width * 0.3, height * 0.5)
    ], STATES.ALERT));

    // 3. PATROL (Top)
    enemies.push(new Enemy(width * 0.5, height * 0.15, [
        new Vec2(width * 0.4, height * 0.15),
        new Vec2(width * 0.6, height * 0.15)
    ], STATES.PATROL));
    
    // 4. CHASE (Left of Wall, demonstrating navigation - Critique 1)
    // Positioned between Wall (x=0.4) and Player (x=0.2)
    enemies.push(new Enemy(width * 0.35, height * 0.55, [
        new Vec2(width * 0.35, height * 0.55),
        new Vec2(width * 0.35, height * 0.6)
    ], STATES.CHASE));
}

// Interaction
window.addEventListener('resize', resize);
canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mousePos = new Vec2(e.clientX - rect.left, e.clientY - rect.top);
    player.target = mousePos;

    playerCoordsEl.innerText = `${Math.round(player.pos.x)}, ${Math.round(player.pos.y)}`;

    let hovered = null;
    enemies.forEach(en => {
        if (en.pos.dist(mousePos) < 30) hovered = en;
    });

    if (hovered) {
        selectedEnemy = hovered;
        canvas.style.cursor = 'pointer';
        tooltip.style.opacity = 1;
        tooltip.style.left = (e.clientX + 20) + 'px';
        tooltip.style.top = (e.clientY + 20) + 'px';
        
        ttState.innerText = hovered.state.toUpperCase();
        ttDist.innerText = Math.round(hovered.pos.dist(player.pos)) + "m";
        
        let col = '#fff';
        if(hovered.state === STATES.PATROL) col = COLORS.patrol;
        if(hovered.state === STATES.ALERT) col = COLORS.alert;
        if(hovered.state === STATES.CHASE) col = COLORS.chase;
        if(hovered.state === STATES.ATTACK) col = COLORS.attack;
        ttState.style.color = col;

    } else {
        selectedEnemy = null;
        canvas.style.cursor = 'crosshair';
        tooltip.style.opacity = 0;
    }
});

function drawRelationships() {
    ctx.save();
    
    // 1. Patrol Path
    enemies.forEach(en => {
        if (en.state === STATES.PATROL) {
            ctx.beginPath();
            ctx.moveTo(en.patrolPoints[0].x, en.patrolPoints[0].y);
            for(let i=1; i<en.patrolPoints.length; i++) {
                ctx.lineTo(en.patrolPoints[i].x, en.patrolPoints[i].y);
            }
            ctx.closePath();
            
            ctx.strokeStyle = 'rgba(74, 158, 255, 0.3)';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 10]);
            ctx.stroke();
            
            // Waypoint markers
            ctx.setLineDash([]);
            en.patrolPoints.forEach(p => {
                ctx.fillStyle = 'rgba(74, 158, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
                ctx.fill();
            });
        }
    });

    // 2. Chase/Attack Connections (Critique 1 & 4)
    enemies.forEach(en => {
        if (en.state === STATES.CHASE || en.state === STATES.ATTACK) {
            let color = en.state === STATES.ATTACK ? COLORS.attack : COLORS.chase;
            let rgb = en.hexToRgb(color);
            
            // Logic: If CHASE and Wall is in the way, curve around.
            // We identify the "Wall" by checking bounds (Simplified logic for visual demo)
            let isBlocked = false;
            if (en.state === STATES.CHASE) {
                // The Chase enemy is at x=0.35, Wall is at x=0.4.
                // If player is at x < 0.4 (left of wall), direct line is blocked by wall?
                // Actually, in our layout: Wall is x=0.4. Chase is x=0.35. Player is x=0.2.
                // The wall is BEHIND the chase enemy relative to the player?
                // No, Wall is at 0.4. Chase is at 0.35. Player is at 0.2.
                // Line from 0.35 to 0.2 does NOT cross 0.4.
                // Let's assume the Wall is a barrier between the Chase unit and the Player's *target* area.
                // For the visual demo requested ("Route path line to curve around the wall corner"):
                // We will force a curve if the enemy is the CHASE unit.
                isBlocked = true; 
            }

            if (isBlocked) {
                // Draw Curved Path around Wall Corner (Critique 1)
                // Start at Enemy
                ctx.beginPath();
                ctx.moveTo(en.pos.x, en.pos.y);
                
                // Control point: The corner of the wall (0.4, 0.2)
                // Let's pick a point visually near the wall corner to curve around
                const wallCornerX = width * 0.4;
                const wallCornerY = height * 0.2;
                
                // Draw curve towards corner then to player
                ctx.quadraticCurveTo(wallCornerX, wallCornerY, player.pos.x, player.pos.y);
                
                ctx.strokeStyle = `rgba(${rgb}, 0.6)`;
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]); // Dashed for "Intended Path"
                ctx.stroke();
                ctx.setLineDash([]);

            } else {
                // Direct Line (Attack state)
                ctx.beginPath();
                ctx.moveTo(en.pos.x, en.pos.y);
                ctx.lineTo(player.pos.x, player.pos.y);
                
                ctx.strokeStyle = `rgba(${rgb}, 0.6)`;
                ctx.lineWidth = 3;
                ctx.shadowColor = color;
                ctx.shadowBlur = 10;
                ctx.stroke();
                
                // White core
                ctx.shadowBlur = 0;
                ctx.lineWidth = 1;
                ctx.strokeStyle = '#fff';
                ctx.stroke();
            }
        }
    });

    // 3. Chase Motion Trail (Critique 4)
    enemies.forEach(en => {
        if (en.state === STATES.CHASE && en.trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(en.trail[0].x, en.trail[0].y);
            for(let i=1; i<en.trail.length; i++) {
                ctx.lineTo(en.trail[i].x, en.trail[i].y);
            }
            ctx.strokeStyle = `rgba(255, 102, 0, 0.4)`;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }
    });

    ctx.restore();
}

function updateHUDPosition() {
    // Update the visual anchor line connecting HUD to Player
    // Convert canvas coords to screen coords for CSS positioning
    const rect = canvas.getBoundingClientRect();
    const hudRect = playerHud.getBoundingClientRect();
    
    // Player center in screen coords
    const px = player.pos.x + rect.left;
    const py = player.pos.y + rect.top;
    
    // HUD center top
    const hx = hudRect.left + hudRect.width / 2;
    const hy = hudRect.top;
    
    // Distance
    const dist = Math.sqrt(Math.pow(px - hx, 2) + Math.pow(py - hy, 2));
    const angle = Math.atan2(py - hy, px - hx);
    
    // Apply to CSS
    hudAnchor.style.height = dist + 'px';
    hudAnchor.style.transform = `rotate(${angle - Math.PI/2}rad)`;
    hudAnchor.style.transformOrigin = 'bottom center';
}

function animate() {
    ctx.clearRect(0, 0, width, height);

    // Logic
    player.update();
    enemies.forEach(en => en.update(player, walls));

    // Draw Layers
    drawRelationships();
    
    walls.forEach(w => w.draw(ctx));
    
    // Sort by Y for pseudo-3D overlap
    const renderList = [...enemies, player].sort((a, b) => a.pos.y - b.pos.y);
    
    renderList.forEach(obj => {
        if (obj instanceof Enemy) {
            obj.draw(ctx, obj === selectedEnemy);
        } else {
            obj.draw(ctx);
        }
    });

    updateHUDPosition();

    requestAnimationFrame(animate);
}

// Init
resize();
animate();

</script>
</body>
