<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical AI Behavior Analysis</title>
    <style>
        :root {
            --bg-dark: #05070a;
            --grid-line: rgba(255, 255, 255, 0.03);
            --panel-bg: rgba(10, 12, 16, 0.85);
            --panel-border: rgba(255, 255, 255, 0.15);
            
            /* State Colors */
            --col-patrol: #4a9eff;
            --col-alert: #ffcc00;
            --col-chase: #ff6600;
            --col-attack: #ff2a2a;
            --col-player: #00f0ff;
            --col-wall: #1a202c;
            
            --text-main: #e0e6ed;
            --text-muted: #8892a0;
            
            /* Fonts */
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "Consolas", "Monaco", "Courier New", monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* --- Arena Container --- */
        #arena-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 50px 50px;
            cursor: crosshair;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- CRT Overlay Effect --- */
        #arena-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
        }

        /* --- UI Overlays --- */
        
        /* Header (Top Left) */
        .hud-header {
            position: absolute;
            top: 24px;
            left: 30px;
            z-index: 20;
            pointer-events: none;
            border-left: 3px solid var(--col-player);
            padding-left: 15px;
        }
        .hud-header h1 {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--col-player);
            margin-bottom: 4px;
        }
        .hud-header h2 {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-main);
            opacity: 0.9;
        }

        /* --- Command Dashboard (Bottom Left) --- */
        .command-dashboard {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 280px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            padding: 20px;
            z-index: 20;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .dash-section-title {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }

        /* Legend Grid */
        .legend-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .legend-swatch {
            width: 8px;
            height: 8px;
            margin-right: 8px;
            transform: rotate(45deg);
            box-shadow: 0 0 5px currentColor;
        }
        
        /* Unit Integrity */
        .integrity-container {
            margin-top: 5px;
        }
        .status-label {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .bar-outer {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            position: relative;
            transform: skewX(-20deg);
            overflow: hidden;
        }
        .bar-inner {
            height: 100%;
            background: var(--col-player);
            width: 85%;
            box-shadow: 0 0 10px var(--col-player);
            position: relative;
        }

        /* Tooltip */
        #tooltip {
            position: absolute;
            background: rgba(5, 7, 10, 0.95);
            border: 1px solid var(--panel-border);
            padding: 12px 16px;
            border-radius: 2px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
            transform: translate(15px, 15px);
            z-index: 100;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            min-width: 120px;
        }
        #tooltip h3 {
            font-size: 10px;
            color: #fff;
            margin-bottom: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }
        .tt-row {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            margin-bottom: 2px;
        }
        .tt-label { color: var(--text-muted); }
        .tt-val { font-family: var(--font-mono); font-weight: 700; }

    </style>
</head>
<body>

<div id="arena-container">
    <canvas id="gameCanvas"></canvas>
    
    <!-- Header -->
    <div class="hud-header">
        <h1>System Analysis</h1>
        <h2>AI Behavioral States</h2>
    </div>

    <!-- Command Dashboard (Unified Panel) -->
    <div class="command-dashboard">
        <div>
            <div class="dash-section-title">AI Logic States</div>
            <div class="legend-grid">
                <div class="legend-item" style="color: var(--col-patrol)">
                    <div class="legend-swatch" style="background: var(--col-patrol)"></div>PATROL
                </div>
                <div class="legend-item" style="color: var(--col-alert)">
                    <div class="legend-swatch" style="background: var(--col-alert)"></div>ALERT
                </div>
                <div class="legend-item" style="color: var(--col-chase)">
                    <div class="legend-swatch" style="background: var(--col-chase)"></div>CHASE
                </div>
                <div class="legend-item" style="color: var(--col-attack)">
                    <div class="legend-swatch" style="background: var(--col-attack)"></div>ATTACK
                </div>
            </div>
        </div>

        <div class="integrity-container">
            <div class="status-label">
                <span>UNIT INTEGRITY</span>
                <span>85%</span>
            </div>
            <div class="bar-outer">
                <div class="bar-inner"></div>
            </div>
            <div class="status-label" style="margin-top: 8px;">
                <span>COORDS</span>
                <span id="player-coords">000, 000</span>
            </div>
        </div>
    </div>

    <!-- Tooltip -->
    <div id="tooltip">
        <h3 id="tt-title">Hostile Unit</h3>
        <div class="tt-row">
            <span class="tt-label">State</span>
            <span class="tt-val" id="tt-state">IDLE</span>
        </div>
        <div class="tt-row">
            <span class="tt-label">Dist</span>
            <span class="tt-val" id="tt-dist">0m</span>
        </div>
    </div>
</div>

<script>
/**
 * Vector Utility
 */
class Vec2 {
    constructor(x, y) { this.x = x; this.y = y; }
    add(v) { return new Vec2(this.x + v.x, this.y + v.y); }
    sub(v) { return new Vec2(this.x - v.x, this.y - v.y); }
    mult(n) { return new Vec2(this.x * n, this.y * n); }
    mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
    normalize() {
        let m = this.mag();
        return m === 0 ? new Vec2(0, 0) : new Vec2(this.x / m, this.y / m);
    }
    dist(v) { return Math.sqrt(Math.pow(this.x - v.x, 2) + Math.pow(this.y - v.y, 2)); }
    copy() { return new Vec2(this.x, this.y); }
}

/**
 * Configuration
 */
const COLORS = {
    player: '#00f0ff',
    wall: '#1a202c',
    wallStroke: '#3a4b66',
    patrol: '#4a9eff',
    alert: '#ffcc00',
    chase: '#ff6600',
    attack: '#ff2a2a'
};

const STATES = {
    PATROL: 'patrol',
    ALERT: 'alert',
    CHASE: 'chase',
    ATTACK: 'attack'
};

/**
 * Game Objects
 */
class Wall {
    constructor(x, y, w, h) {
        this.x = x; this.y = y; this.w = w; this.h = h;
    }
    
    draw(ctx) {
        ctx.save();
        // Shadow for depth
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 15;
        ctx.shadowOffsetY = 5;
        
        // Body
        ctx.fillStyle = COLORS.wall;
        ctx.fillRect(this.x, this.y, this.w, this.h);
        
        ctx.shadowColor = 'transparent';
        
        // "Hard Light" Edge
        ctx.strokeStyle = COLORS.wallStroke;
        ctx.lineWidth = 2;
        ctx.strokeRect(this.x + 1, this.y + 1, this.w - 2, this.h - 2);
        
        // Top Bevel (Simulated 3D)
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.fillRect(this.x, this.y, this.w, 4);
        
        ctx.restore();
    }
}

class Player {
    constructor(x, y) {
        this.pos = new Vec2(x, y);
        this.target = new Vec2(x, y);
        this.radius = 12;
        this.speed = 5;
        this.angle = 0;
        this.trail = [];
    }

    update() {
        let dir = this.target.sub(this.pos);
        let dist = dir.mag();
        
        if (dist > 2) {
            dir = dir.normalize().mult(this.speed);
            this.pos = this.pos.add(dir);
            this.angle = Math.atan2(dir.y, dir.x);
        }

        // Trail
        if (dist > 2) {
            this.trail.push(this.pos.copy());
            if (this.trail.length > 12) this.trail.shift();
        } else {
            if (this.trail.length > 0) this.trail.shift();
        }
    }

    draw(ctx) {
        // Draw Trail
        if (this.trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(this.trail[0].x, this.trail[0].y);
            for (let i = 1; i < this.trail.length; i++) {
                ctx.lineTo(this.trail[i].x, this.trail[i].y);
            }
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // Sonar Pulse (Breathing)
        const time = Date.now() / 1000;
        const pulseScale = 1 + Math.sin(time * 3) * 0.3;
        
        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        
        // Sonar Ring
        ctx.beginPath();
        ctx.arc(0, 0, this.radius * 2.5 * pulseScale, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(0, 240, 255, ${0.3 - (pulseScale - 1)})`;
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.rotate(this.angle);

        // Player Shape (Clean Triangle)
        ctx.shadowColor = COLORS.player;
        ctx.shadowBlur = 15;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(14, 0);
        ctx.lineTo(-8, 8);
        ctx.lineTo(-8, -8);
        ctx.closePath();
        ctx.fill();

        // Inner detail
        ctx.fillStyle = COLORS.player;
        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.lineTo(-4, 4);
        ctx.lineTo(-4, -4);
        ctx.fill();

        ctx.restore();
    }
}

class Enemy {
    constructor(x, y, patrolPoints, forcedState = null) {
        this.pos = new Vec2(x, y);
        this.patrolPoints = patrolPoints;
        this.currentPatrolIdx = 0;
        this.radius = 10;
        this.angle = 0;
        this.speed = 1.5;
        
        this.state = forcedState || STATES.PATROL;
        this.isForced = forcedState !== null;
        
        // AI Params
        this.visionRange = 160;
        this.visionAngle = Math.PI / 2.2; 
        this.attackRange = 110;
        
        this.alertTimer = 0;
        this.lastKnownPos = null;
    }

    update(player, walls) {
        // Logic for demo states
        if (this.isForced) {
            if (this.state === STATES.ATTACK || this.state === STATES.CHASE) {
                let vecToPlayer = player.pos.sub(this.pos);
                this.angle = Math.atan2(vecToPlayer.y, vecToPlayer.x);
                
                if(this.state === STATES.CHASE) {
                    this.moveTo(player.pos, 2.5);
                } else if (this.state === STATES.ATTACK) {
                    // Bobbing in place
                    this.pos.y += Math.sin(Date.now() / 200) * 0.2;
                }
            } else if (this.state === STATES.PATROL) {
                this.moveTo(this.patrolPoints[this.currentPatrolIdx], 1.5);
                if (this.pos.dist(this.patrolPoints[this.currentPatrolIdx]) < 5) {
                    this.currentPatrolIdx = (this.currentPatrolIdx + 1) % this.patrolPoints.length;
                }
            } else if (this.state === STATES.ALERT) {
                this.angle += Math.sin(Date.now() / 150) * 0.1;
            }
            return;
        }

        // Real Logic
        let distToPlayer = this.pos.dist(player.pos);
        let vecToPlayer = player.pos.sub(this.pos);
        let angleToPlayer = Math.atan2(vecToPlayer.y, vecToPlayer.x);
        
        let angleDiff = angleToPlayer - this.angle;
        while (angleDiff <= -Math.PI) angleDiff += Math.PI*2;
        while (angleDiff > Math.PI) angleDiff -= Math.PI*2;

        switch (this.state) {
            case STATES.PATROL:
                if (distToPlayer < this.visionRange && Math.abs(angleDiff) < this.visionAngle / 2) {
                    this.state = STATES.CHASE;
                    this.lastKnownPos = player.pos.copy();
                } else {
                    this.moveTo(this.patrolPoints[this.currentPatrolIdx], 1);
                    if (this.pos.dist(this.patrolPoints[this.currentPatrolIdx]) < 5) {
                        this.currentPatrolIdx = (this.currentPatrolIdx + 1) % this.patrolPoints.length;
                    }
                }
                break;
            case STATES.CHASE:
                if (distToPlayer < this.visionRange && Math.abs(angleDiff) < this.visionAngle / 2) {
                    this.lastKnownPos = player.pos.copy();
                    if (distToPlayer < this.attackRange) {
                        this.state = STATES.ATTACK;
                    } else {
                        this.moveTo(player.pos, 2.5);
                    }
                } else {
                    this.state = STATES.ALERT;
                    this.alertTimer = 120;
                }
                break;
            case STATES.ATTACK:
                this.angle = angleToPlayer;
                if (distToPlayer > this.visionRange) {
                    this.state = STATES.ALERT;
                }
                break;
            case STATES.ALERT:
                this.moveTo(this.lastKnownPos, 2);
                this.alertTimer--;
                if (this.alertTimer <= 0 || this.pos.dist(this.lastKnownPos) < 5) {
                    this.state = STATES.PATROL;
                }
                break;
        }
    }

    moveTo(target, spd) {
        let dir = target.sub(this.pos);
        let dist = dir.mag();
        if (dist > 1) {
            this.angle = Math.atan2(dir.y, dir.x);
            dir = dir.normalize().mult(spd);
            this.pos = this.pos.add(dir);
        }
    }

    draw(ctx, isSelected) {
        let color = COLORS.patrol;
        let opacity = 0.15; // Default low opacity (Critique 1)
        
        if (this.state === STATES.ALERT) {
            color = COLORS.alert;
            opacity = 0.2; 
        }
        if (this.state === STATES.CHASE) {
            color = COLORS.chase;
            opacity = 0.6;
        }
        if (this.state === STATES.ATTACK) {
            color = COLORS.attack;
            opacity = 0.8;
        }

        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        ctx.rotate(this.angle);

        // --- 1. Vision Cone (Opacity Hierarchy) ---
        let grad = ctx.createLinearGradient(0, 0, this.visionRange, 0);
        let rgb = this.hexToRgb(color);
        
        // Critique 1: Attack is solid/pulsating, others are background context
        let alphaStart = this.state === STATES.ATTACK ? 0.6 : opacity;
        let alphaEnd = this.state === STATES.ATTACK ? 0.2 : 0;

        grad.addColorStop(0, `rgba(${rgb}, ${alphaStart})`);
        grad.addColorStop(1, `rgba(${rgb}, ${alphaEnd})`);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, this.visionRange, -this.visionAngle/2, this.visionAngle/2);
        ctx.closePath();
        ctx.fill();

        // --- 2. Attack Range Ring (Only for Attack state) ---
        if (this.state === STATES.ATTACK) {
            ctx.beginPath();
            ctx.arc(0, 0, this.attackRange, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(${rgb}, 0.4)`;
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.fillStyle = `rgba(${rgb}, 0.05)`;
            ctx.fill();
        }

        ctx.restore(); // Unrotate for body drawing to keep orientation correct relative to screen if needed, but we want body to rotate.
        
        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        ctx.rotate(this.angle);

        // --- 3. Standardized Diamond Shape ---
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#0b0d14'; // Dark core
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        
        ctx.beginPath();
        ctx.moveTo(12, 0); // Right
        ctx.lineTo(0, 9);  // Bottom
        ctx.lineTo(-12, 0); // Left
        ctx.lineTo(0, -9); // Top
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // --- 4. Unified State Label ---
        this.drawLabel(ctx, this.state.toUpperCase(), color);
    }

    drawLabel(ctx, text, color) {
        ctx.save();
        const yOff = -30;
        
        ctx.font = 'bold 10px -apple-system, sans-serif';
        const width = ctx.measureText(text).width;
        const padding = 6;
        const pillHeight = 16;
        
        const bx = this.pos.x - width/2 - padding;
        const by = this.pos.y + yOff - pillHeight/2;
        const bw = width + padding*2;
        
        // Connecting line (Critique 4)
        ctx.beginPath();
        ctx.moveTo(this.pos.x, this.pos.y - 10);
        ctx.lineTo(this.pos.x, by + pillHeight);
        ctx.strokeStyle = `rgba(255,255,255,0.2)`;
        ctx.lineWidth = 1;
        ctx.stroke();

        // Pill Background
        ctx.fillStyle = 'rgba(10, 12, 16, 0.9)';
        ctx.beginPath();
        ctx.roundRect(bx, by, bw, pillHeight, 3);
        ctx.fill();
        
        // Pill Border
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.stroke();

        // Text
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, this.pos.x, this.pos.y + yOff);
        
        ctx.restore();
    }

    hexToRgb(hex) {
        var shorthandRegex = /^#?([a-f\d])([a-f\d])([a-f\d])$/i;
        hex = hex.replace(shorthandRegex, function(m, r, g, b) { return r + r + g + g + b + b; });
        var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? parseInt(result[1], 16) + ', ' + parseInt(result[2], 16) + ', ' + parseInt(result[3], 16) : '255, 255, 255';
    }
}

/**
 * Main System
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
const ttState = document.getElementById('tt-state');
const ttDist = document.getElementById('tt-dist');
const playerCoordsEl = document.getElementById('player-coords');

let width, height;
let player;
let enemies = [];
let walls = [];
let mousePos = new Vec2(0,0);
let selectedEnemy = null;

function resize() {
    width = canvas.parentElement.offsetWidth;
    height = canvas.parentElement.offsetHeight;
    canvas.width = width;
    canvas.height = height;
    initLevel();
}

function initLevel() {
    // Player
    player = new Player(width * 0.2, height * 0.7);
    player.target = new Vec2(width * 0.2, height * 0.7);

    // Walls
    walls = [
        new Wall(width * 0.4, height * 0.2, 20, height * 0.5),
        new Wall(width * 0.7, height * 0.6, width * 0.2, 20),
        new Wall(width * 0.1, height * 0.3, width * 0.15, 20),
    ];

    // Enemies
    // 1. ATTACK
    enemies.push(new Enemy(width * 0.8, height * 0.7, [
        new Vec2(width * 0.8, height * 0.6),
        new Vec2(width * 0.9, height * 0.8)
    ], STATES.ATTACK));

    // 2. ALERT
    enemies.push(new Enemy(width * 0.3, height * 0.4, [
        new Vec2(width * 0.3, height * 0.3),
        new Vec2(width * 0.3, height * 0.5)
    ], STATES.ALERT));

    // 3. PATROL
    enemies.push(new Enemy(width * 0.5, height * 0.15, [
        new Vec2(width * 0.4, height * 0.15),
        new Vec2(width * 0.6, height * 0.15)
    ], STATES.PATROL));
    
    // 4. CHASE
    enemies.push(new Enemy(width * 0.5, height * 0.8, [
        new Vec2(width * 0.5, height * 0.8),
        new Vec2(width * 0.5, height * 0.9)
    ], STATES.CHASE));
}

// Interaction
window.addEventListener('resize', resize);
canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mousePos = new Vec2(e.clientX - rect.left, e.clientY - rect.top);
    player.target = mousePos;

    playerCoordsEl.innerText = `${Math.round(player.pos.x)}, ${Math.round(player.pos.y)}`;

    let hovered = null;
    enemies.forEach(en => {
        if (en.pos.dist(mousePos) < 30) hovered = en;
    });

    if (hovered) {
        selectedEnemy = hovered;
        canvas.style.cursor = 'pointer';
        tooltip.style.opacity = 1;
        tooltip.style.left = (e.clientX + 20) + 'px';
        tooltip.style.top = (e.clientY + 20) + 'px';
        
        ttState.innerText = hovered.state.toUpperCase();
        ttDist.innerText = Math.round(hovered.pos.dist(player.pos)) + "m";
        
        let col = '#fff';
        if(hovered.state === STATES.PATROL) col = COLORS.patrol;
        if(hovered.state === STATES.ALERT) col = COLORS.alert;
        if(hovered.state === STATES.CHASE) col = COLORS.chase;
        if(hovered.state === STATES.ATTACK) col = COLORS.attack;
        ttState.style.color = col;

    } else {
        selectedEnemy = null;
        canvas.style.cursor = 'crosshair';
        tooltip.style.opacity = 0;
    }
});

function drawRelationships() {
    ctx.save();
    
    // 1. Patrol Path (Critique 2)
    enemies.forEach(en => {
        if (en.state === STATES.PATROL) {
            ctx.beginPath();
            ctx.moveTo(en.patrolPoints[0].x, en.patrolPoints[0].y);
            for(let i=1; i<en.patrolPoints.length; i++) {
                ctx.lineTo(en.patrolPoints[i].x, en.patrolPoints[i].y);
            }
            ctx.closePath();
            
            ctx.strokeStyle = 'rgba(74, 158, 255, 0.3)'; // Blue tint
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 10]); // Distinct Dashed Loop
            ctx.stroke();
            
            // Waypoint markers
            ctx.setLineDash([]);
            en.patrolPoints.forEach(p => {
                ctx.fillStyle = 'rgba(74, 158, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
                ctx.fill();
            });
        }
    });

    // 2. Chase/Attack Heat Trail (Critique 2)
    enemies.forEach(en => {
        if (en.state === STATES.CHASE || en.state === STATES.ATTACK) {
            ctx.beginPath();
            ctx.moveTo(en.pos.x, en.pos.y);
            ctx.lineTo(player.pos.x, player.pos.y);
            
            let color = en.state === STATES.ATTACK ? COLORS.attack : COLORS.chase;
            let rgb = en.hexToRgb(color);
            
            // Glowing Vector Line
            ctx.strokeStyle = `rgba(${rgb}, 0.6)`;
            ctx.lineWidth = 3;
            ctx.shadowColor = color;
            ctx.shadowBlur = 10;
            ctx.stroke();
            
            // Reset shadow
            ctx.shadowBlur = 0;
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#fff';
            ctx.stroke(); // White core for high contrast
        }
    });

    ctx.setLineDash([]);
    ctx.restore();
}

function animate() {
    ctx.clearRect(0, 0, width, height);

    // Logic
    player.update();
    enemies.forEach(en => en.update(player, walls));

    // Draw Layers
    drawRelationships();
    
    walls.forEach(w => w.draw(ctx));
    
    // Sort by Y for pseudo-3D overlap
    const renderList = [...enemies, player].sort((a, b) => a.pos.y - b.pos.y);
    
    renderList.forEach(obj => {
        if (obj instanceof Enemy) {
            obj.draw(ctx, obj === selectedEnemy);
        } else {
            obj.draw(ctx);
        }
    });

    requestAnimationFrame(animate);
}

// Init
resize();
animate();

</script>
