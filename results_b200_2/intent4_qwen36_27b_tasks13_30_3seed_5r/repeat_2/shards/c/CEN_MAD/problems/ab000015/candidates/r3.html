<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alpine Velocity: Downhill Rush</title>
    <style>
        :root {
            --alpine-blue: #0ea5e9;
            --ice-white: #f8fafc;
            --deep-shadow: #0f172a;
            --danger-red: #ef4444;
            --glass-bg: rgba(15, 23, 42, 0.25);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-highlight: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--deep-shadow);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--ice-white);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
            padding: 20px;
        }

        /* --- GLASSMORPHISM UTILITIES --- */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        /* --- TOP HUD --- */
        .top-hud {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* Progress Bar (Top Center) */
        .progress-container {
            width: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--alpine-blue), #fff);
            width: 0%;
            border-radius: 2px;
            box-shadow: 0 0 15px var(--alpine-blue);
            transition: width 0.1s linear;
        }

        .progress-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 4px;
            opacity: 0.8;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* Stats Row */
        .stats-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        /* Speed (Top Left) */
        .speed-box {
            display: flex;
            flex-direction: column;
        }
        
        .speed-val {
            font-size: 42px;
            font-weight: 900;
            font-style: italic;
            line-height: 1;
            color: #fff;
            text-shadow: 0 0 15px rgba(14, 165, 233, 0.8);
            font-variant-numeric: tabular-nums;
        }

        .speed-unit {
            font-size: 12px;
            font-weight: 600;
            color: var(--alpine-blue);
            letter-spacing: 1px;
            margin-top: 4px;
            margin-left: 4px;
        }

        /* Distance (Top Right) */
        .dist-box {
            text-align: right;
        }

        .dist-val {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .dist-unit {
            font-size: 12px;
            opacity: 0.7;
        }

        /* --- CONTROLS --- */
        .controls-area {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 20px;
            pointer-events: auto;
        }

        .d-pad {
            display: flex;
            gap: 20px;
            background: var(--glass-bg);
            padding: 10px;
            border-radius: 40px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .control-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.1s ease;
            position: relative;
            overflow: hidden;
        }

        .control-btn:active, .control-btn.active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.25);
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        .control-btn svg {
            width: 28px;
            height: 28px;
            fill: white;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
        }

        /* Pause Button */
        .pause-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            cursor: pointer;
        }
        
        .pause-btn:active {
            background: rgba(255, 255, 255, 0.25);
        }

        .pause-icon {
            width: 18px;
            height: 22px;
            border-left: 4px solid white;
            border-right: 4px solid white;
            box-sizing: border-box;
        }

    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
        <!-- TOP HUD -->
        <div class="top-hud">
            
            <!-- Progress (Center) -->
            <div class="progress-container glass">
                <div class="progress-track">
                    <div class="progress-fill" id="progressBar"></div>
                </div>
                <div class="progress-label">Sect 4 / 8</div>
            </div>

            <!-- Stats (Left/Right) -->
            <div class="stats-row">
                <div class="speed-box">
                    <div class="speed-val" id="speedDisplay">0</div>
                    <div class="speed-unit">KM/H</div>
                </div>
                <div class="dist-box">
                    <div class="dist-val" id="distDisplay">0.0</div>
                    <div class="dist-unit">KM TRAVELED</div>
                </div>
            </div>
        </div>

        <!-- BOTTOM CONTROLS -->
        <div class="controls-area">
            <div class="d-pad">
                <div class="control-btn" id="btnLeft">
                    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                </div>
                <div class="control-btn" id="btnRight">
                    <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </div>
            </div>
            
            <div class="pause-btn" id="btnPause">
                <div class="pause-icon"></div>
            </div>
        </div>
    </div>
</div>

<script>
    /**
     * ALPINE VELOCITY ENGINE
     * Focus: Visual Polish, Speed Sensation, 3D Projection
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    // UI Elements
    const speedDisplay = document.getElementById('speedDisplay');
    const distDisplay = document.getElementById('distDisplay');
    const progressBar = document.getElementById('progressBar');
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');

    // State
    let width, height;
    let cx, cy;
    let frame = 0;
    
    // Game Physics State
    const state = {
        speed: 0,
        targetSpeed: 150, // High start
        distance: 0,
        playerX: 0, // -1 to 1
        playerTilt: 0,
        roadWidth: 1600,
        segmentLength: 120,
        cameraHeight: 800, 
        fov: 120, 
        drawDistance: 3500
    };

    // Input State
    const input = {
        left: false,
        right: false
    };

    // Assets
    const obstacles = [];
    const speedLines = [];

    // --- Initialization ---

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(dpr, dpr);
        cx = width / 2;
        cy = height / 2;
    }

    function init() {
        resize();
        window.addEventListener('resize', resize);
        setupInputs();
        generateWorld();
        requestAnimationFrame(loop);
    }

    function generateWorld() {
        // Generate Obstacles
        for(let i=0; i<50; i++) {
            obstacles.push({
                z: 200 + i * 400 + Math.random() * 100,
                x: (Math.random() * 1.4 - 0.7) * state.roadWidth, 
                type: Math.random() > 0.6 ? 'gate' : 'rock',
                passed: false
            });
        }
        // Generate Speed Lines
        for(let i=0; i<60; i++) {
            speedLines.push({
                x: Math.random() * 2000 - 1000,
                y: Math.random() * 1000 - 500,
                z: Math.random() * state.drawDistance,
                length: Math.random() * 0.5 + 0.5
            });
        }
    }

    // --- Input Handling ---

    function setupInputs() {
        document.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft') input.left = true;
            if(e.key === 'ArrowRight') input.right = true;
        });
        document.addEventListener('keyup', (e) => {
            if(e.key === 'ArrowLeft') input.left = false;
            if(e.key === 'ArrowRight') input.right = false;
        });

        const addTouch = (elem, key) => {
            const activate = (e) => { 
                if(e.cancelable) e.preventDefault(); 
                input[key] = true; 
                elem.classList.add('active'); 
            };
            const deactivate = (e) => { 
                if(e.cancelable) e.preventDefault(); 
                input[key] = false; 
                elem.classList.remove('active'); 
            };

            elem.addEventListener('mousedown', activate);
            elem.addEventListener('mouseup', deactivate);
            elem.addEventListener('mouseleave', deactivate);
            elem.addEventListener('touchstart', activate, {passive: false});
            elem.addEventListener('touchend', deactivate, {passive: false});
        };

        addTouch(btnLeft, 'left');
        addTouch(btnRight, 'right');
    }

    // --- Rendering Helpers ---

    function project(x, y, z) {
        if (z <= 0) return { x: 0, y: 0, scale: 0 };
        // Perspective projection
        const scale = state.fov / (state.fov + z);
        // Horizon is roughly at 40% down the screen for a steep downhill view
        const horizonY = cy + (height * 0.15); 
        const y2d = ((y - state.cameraHeight) * scale) + horizonY + (height * 0.15);
        const x2d = (x * scale) + cx;
        return { x: x2d, y: y2d, scale: scale };
    }

    function drawEnvironment() {
        // 1. Sky (Deep Alpine Gradient)
        const skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.5);
        skyGrad.addColorStop(0, '#020617'); // Very dark blue top
        skyGrad.addColorStop(0.6, '#1e3a8a'); // Deep blue
        skyGrad.addColorStop(1, '#38bdf8'); // Horizon light
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, width, height);

        // 2. Mountains (Parallax)
        const speedFactor = state.speed * 0.01;
        const offset = (frame * speedFactor) % width;
        
        ctx.save();
        
        // Far Mountains (Dark)
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.moveTo(0, cy + 40);
        for(let i=0; i<=width; i+=30) {
            const noise = Math.sin((i - offset) * 0.008) * 50 + Math.cos((i - offset) * 0.02) * 20;
            ctx.lineTo(i, (cy + 40) - Math.abs(noise));
        }
        ctx.lineTo(width, cy + 40);
        ctx.lineTo(0, cy + 40);
        ctx.fill();

        // Near Mountains (Snowy peaks)
        ctx.fillStyle = '#cbd5e1';
        ctx.beginPath();
        ctx.moveTo(0, cy + 80);
        for(let i=0; i<=width; i+=20) {
            const noise = Math.sin((i - offset * 2) * 0.015) * 60 + Math.cos((i - offset * 2) * 0.04) * 30;
            ctx.lineTo(i, (cy + 80) - Math.abs(noise));
        }
        ctx.lineTo(width, cy + 80);
        ctx.lineTo(0, cy + 80);
        ctx.fill();
        ctx.restore();
    }

    function drawSlope() {
        const horizonY = cy + (height * 0.35);
        
        // Ground Gradient (Ice Blue to White)
        const groundGrad = ctx.createLinearGradient(0, horizonY, 0, height);
        groundGrad.addColorStop(0, '#bae6fd'); // Horizon blend
        groundGrad.addColorStop(0.3, '#e0f2fe'); // Mid ice
        groundGrad.addColorStop(1, '#ffffff'); // Foreground snow
        
        ctx.fillStyle = groundGrad;
        ctx.beginPath();
        ctx.moveTo(0, horizonY);
        ctx.lineTo(width, horizonY);
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.fill();

        // 3. Grid (Perspective Lines)
        
        // Glowing Road Edges
        const drawEdge = (xPos) => {
            const pStart = project(xPos, 0, 10);
            const pEnd = project(xPos, 0, state.drawDistance);
            
            ctx.beginPath();
            ctx.moveTo(pStart.x, pStart.y);
            ctx.lineTo(pEnd.x, pEnd.y);
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#0ea5e9';
            ctx.shadowColor = '#0ea5e9';
            ctx.shadowBlur = 20;
            ctx.stroke();
            ctx.shadowBlur = 0;
        };

        drawEdge(-state.roadWidth/2);
        drawEdge(state.roadWidth/2);

        // Horizontal Speed Lines (Grid)
        const offset = (frame * state.speed * 2) % state.segmentLength;
        ctx.lineWidth = 2;
        
        for (let z = state.drawDistance; z > 0; z -= state.segmentLength) {
            const drawZ = z - offset;
            if (drawZ < 10) continue;
            
            const pL = project(-state.roadWidth/2, 0, drawZ);
            const pR = project(state.roadWidth/2, 0, drawZ);
            
            // Fade logic
            const alpha = Math.min(1, (drawZ / 1500));
            ctx.globalAlpha = alpha * 0.4;
            ctx.strokeStyle = '#0ea5e9';
            
            ctx.beginPath();
            ctx.moveTo(pL.x, pL.y);
            ctx.lineTo(pR.x, pR.y);
            ctx.stroke();
        }
        ctx.globalAlpha = 1.0;
    }

    function drawObstacle(obs) {
        // Move obstacle towards camera
        let z = obs.z - (frame * state.speed * 2);
        
        // Wrap around logic
        if (z < 10) {
            z += 50 * state.segmentLength;
            obs.x = (Math.random() * 1.6 - 0.8) * state.roadWidth; 
        }
        
        // Calculate relative X
        const relX = obs.x - (state.playerX * state.roadWidth);
        const p = project(relX, 0, z);
        
        if (p.scale <= 0) return;

        const size = 300 * p.scale;

        ctx.save();
        ctx.translate(p.x, p.y);
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        ctx.beginPath();
        ctx.ellipse(0, 0, size, size*0.3, 0, 0, Math.PI*2);
        ctx.fill();

        if (obs.type === 'gate') {
            // Alpine Gate (Red/Blue)
            const postH = size * 3;
            
            // Banner
            ctx.fillStyle = '#ef4444';
            ctx.shadowColor = '#ef4444';
            ctx.shadowBlur = 15;
            ctx.fillRect(-size, -postH, size*2, size*0.6);
            ctx.shadowBlur = 0;

            // Posts
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 5 * p.scale;
            ctx.beginPath();
            ctx.moveTo(-size, 0); ctx.lineTo(-size, -postH);
            ctx.moveTo(size, 0); ctx.lineTo(size, -postH);
            ctx.stroke();

        } else {
            // Ice Rock
            ctx.fillStyle = '#f1f5f9';
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#0ea5e9';
            ctx.shadowBlur = 10;
            
            ctx.beginPath();
            ctx.moveTo(-size*0.6, 0);
            ctx.lineTo(-size*0.3, -size*1.2);
            ctx.lineTo(size*0.2, -size*1.5);
            ctx.lineTo(size*0.6, -size*0.8);
            ctx.lineTo(size*0.7, 0);
            ctx.fill();
            ctx.stroke();
            ctx.shadowBlur = 0;
        }
        ctx.restore();
    }

    function drawPlayer() {
        // Rider
        const p = project(0, 0, 10); 
        const tilt = state.playerTilt;
        
        ctx.save();
        ctx.translate(p.x, p.y - 30); 
        ctx.rotate(tilt * 0.4); 

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.beginPath();
        ctx.ellipse(0, 30, 30 + Math.abs(tilt)*20, 12, 0, 0, Math.PI*2);
        ctx.fill();

        // --- Skier Character ---
        
        // Skis (Cyan Glow)
        ctx.strokeStyle = '#0ea5e9';
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        ctx.shadowColor = '#0ea5e9';
        ctx.shadowBlur = 15;
        
        ctx.beginPath(); ctx.moveTo(-15, 20); ctx.lineTo(-35, 65); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(15, 20); ctx.lineTo(35, 65); ctx.stroke();
        ctx.shadowBlur = 0;

        // Body
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(0, 0, 20, 28, 0, 0, Math.PI*2);
        ctx.fill();
        
        // Helmet
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(0, -22, 16, 0, Math.PI*2);
        ctx.fill();
        
        // Goggles (Red reflection)
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(0, -22, 16, -0.3, 0.3);
        ctx.fill();

        ctx.restore();
    }

    function drawEffects() {
        // Speed Lines / Motion Blur
        const numLines = Math.floor(state.speed / 3);
        
        for(let i=0; i<numLines; i++) {
            const x = Math.random() * width;
            const y = Math.random() * height;
            const len = 50 + Math.random() * 100;
            const angle = Math.PI / 4 + (state.playerTilt * 0.3);
            
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + Math.cos(angle)*len, y + Math.sin(angle)*len);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // 3D Snow Particles
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        speedLines.forEach(p => {
            // Move Z
            p.z -= state.speed * 8;
            if(p.z < 0) {
                p.z = state.drawDistance;
                p.x = Math.random() * 2000 - 1000;
                p.y = Math.random() * 1000 - 500;
            }
            
            const relX = p.x - (state.playerX * state.roadWidth);
            const proj = project(relX, p.y, p.z);
            
            if(proj.scale > 0) {
                const size = 3 * proj.scale * 10;
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, size, 0, Math.PI*2);
                ctx.fill();
            }
        });

        // Vignette (Darker edges for focus)
        const grad = ctx.createRadialGradient(cx, cy, height/3, cx, cy, height);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.7)');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,width,height);
    }

    // --- Main Loop ---

    function update() {
        // Physics
        if (!input.left && !input.right) {
             // Auto accelerate slightly if no input
             state.targetSpeed = Math.min(220, state.targetSpeed + 0.5); 
        }
        
        state.speed += (state.targetSpeed - state.speed) * 0.05;

        // Steering
        const steerSpeed = 0.05;
        if (input.left) {
            state.playerX = Math.max(-1, state.playerX - steerSpeed);
            state.playerTilt = Math.max(-0.7, state.playerTilt - 0.08);
        } else if (input.right) {
            state.playerX = Math.min(1, state.playerX + steerSpeed);
            state.playerTilt = Math.min(0.7, state.playerTilt + 0.08);
        } else {
            state.playerTilt += (0 - state.playerTilt) * 0.1;
        }

        state.distance += state.speed * 0.0005;
        
        // UI Updates
        speedDisplay.innerText = Math.floor(state.speed);
        distDisplay.innerText = state.distance.toFixed(1);
        const progress = (state.distance % 10) / 10 * 100;
        progressBar.style.width = `${progress}%`;

        frame++;
    }

    function loop() {
        ctx.clearRect(0, 0, width, height);

        update();

        // 1. Environment (Sky + Mountains)
        drawEnvironment();

        // 2. Slope (Grid)
        drawSlope();

        // 3. Obstacles (Sorted by depth)
        obstacles.sort((a, b) => {
            const zA = a.z - (frame * state.speed * 2);
            const zB = b.z - (frame * state.speed * 2);
            return zB - zA;
        });
        obstacles.forEach(obs => drawObstacle(obs));

        // 4. Player
        drawPlayer();

        // 5. Effects (Speed lines, Snow, Vignette)
        drawEffects();

        requestAnimationFrame(loop);
    }

    // Start
    init();

</script>
</body>
</html>
