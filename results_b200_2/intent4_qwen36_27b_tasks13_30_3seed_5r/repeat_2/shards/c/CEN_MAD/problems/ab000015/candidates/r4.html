<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alpine Velocity: Downhill Rush</title>
    <style>
        :root {
            --alpine-blue: #0ea5e9;
            --ice-white: #f8fafc;
            --deep-shadow: #0f172a;
            --danger-red: #ef4444;
            --glass-bg: rgba(15, 23, 42, 0.15); /* More transparent */
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--deep-shadow);
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; /* System sans-serif */
            color: var(--ice-white);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
            padding: 24px;
        }

        /* --- TOP HUD: DATA ZONE --- */
        .top-hud {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        /* Left: Speed */
        .speed-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-shadow: 0 4px 12px rgba(0,0,0,0.5);
        }
        
        .speed-val {
            font-size: 56px;
            font-weight: 900;
            font-style: italic; /* Kinetic typography */
            line-height: 0.9;
            color: #fff;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
        }

        .speed-unit {
            font-size: 14px;
            font-weight: 800;
            color: var(--alpine-blue);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Right: Stats & Progress */
        .stats-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.5);
        }

        .dist-box {
            text-align: right;
        }

        .dist-val {
            font-size: 28px;
            font-weight: 700;
            font-style: italic;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }

        .dist-unit {
            font-size: 12px;
            opacity: 0.8;
            font-weight: 600;
            color: var(--alpine-blue);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Progress Bar (Compact) */
        .progress-container {
            width: 220px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            border-radius: 4px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--alpine-blue);
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #fff;
            width: 0%;
            box-shadow: 0 0 10px #fff;
            transition: width 0.1s linear;
        }

        /* --- CONTROLS: FLOATING & LARGE --- */
        .controls-area {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 10px;
            pointer-events: auto;
        }

        .d-pad {
            display: flex;
            gap: 24px;
        }

        .control-btn {
            width: 80px; /* Enlarged */
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08); /* Floating glass */
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .control-btn:active, .control-btn.active {
            transform: scale(0.90);
            background: rgba(255, 255, 255, 0.25);
            border-color: #fff;
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
        }

        .control-btn svg {
            width: 36px;
            height: 36px;
            fill: white;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        /* Pause Button */
        .pause-btn {
            width: 64px;
            height: 64px;
            border-radius: 16px; /* Squircle */
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            cursor: pointer;
            margin-left: 20px;
        }
        
        .pause-btn:active {
            background: rgba(255, 255, 255, 0.25);
        }

        .pause-icon {
            width: 20px;
            height: 24px;
            border-left: 4px solid white;
            border-right: 4px solid white;
            box-sizing: border-box;
        }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            .speed-val { font-size: 42px; }
            .control-btn { width: 70px; height: 70px; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
        <!-- TOP HUD -->
        <div class="top-hud">
            
            <!-- Speed (Left) -->
            <div class="speed-box">
                <div class="speed-val" id="speedDisplay">0</div>
                <div class="speed-unit">KM/H</div>
            </div>

            <!-- Stats & Progress (Right) -->
            <div class="stats-container">
                <div class="dist-box">
                    <div class="dist-val" id="distDisplay">0.0</div>
                    <div class="dist-unit">KM TRAVELED</div>
                </div>

                <div class="progress-container">
                    <div class="progress-header">
                        <span>Sect 4/8</span>
                        <span id="progressPct">0%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="progressBar"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- BOTTOM CONTROLS -->
        <div class="controls-area">
            <div class="d-pad">
                <div class="control-btn" id="btnLeft">
                    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                </div>
                <div class="control-btn" id="btnRight">
                    <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </div>
            </div>
            
            <div class="pause-btn" id="btnPause">
                <div class="pause-icon"></div>
            </div>
        </div>
    </div>
</div>

<script>
    /**
     * ALPINE VELOCITY ENGINE - REVISED
     * Focus: 1. Perspective (Close-up Chase), 2. Hierarchy (Obstacles Big), 
     * 3. Visual Polish (Crystalline/Speed)
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    // UI Elements
    const speedDisplay = document.getElementById('speedDisplay');
    const distDisplay = document.getElementById('distDisplay');
    const progressBar = document.getElementById('progressBar');
    const progressPct = document.getElementById('progressPct');
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');

    // State
    let width, height;
    let cx, cy;
    let frame = 0;
    
    // Game Physics State
    const state = {
        speed: 0,
        targetSpeed: 180, // Higher speed for 165km/h feel
        distance: 0,
        playerX: 0, // -1 to 1
        playerTilt: 0,
        roadWidth: 1400,
        segmentLength: 100,
        // Camera adjustments for "Chase View"
        cameraHeight: 1200, 
        cameraDepth: 0.83,
        fov: 100, 
        drawDistance: 3000
    };

    // Input State
    const input = {
        left: false,
        right: false
    };

    // Assets
    const obstacles = [];
    const speedLines = [];
    const particles = []; // Ice spray

    // --- Initialization ---

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(dpr, dpr);
        cx = width / 2;
        cy = height / 2;
    }

    function init() {
        resize();
        window.addEventListener('resize', resize);
        setupInputs();
        generateWorld();
        requestAnimationFrame(loop);
    }

    function generateWorld() {
        // Generate Obstacles
        for(let i=0; i<40; i++) {
            obstacles.push({
                z: 500 + i * 300 + Math.random() * 100,
                x: (Math.random() * 1.2 - 0.6) * state.roadWidth, 
                type: Math.random() > 0.5 ? 'gate' : 'rock',
                passed: false
            });
        }
        // Generate Speed Lines
        for(let i=0; i<80; i++) {
            speedLines.push({
                x: Math.random() * 2000 - 1000,
                y: Math.random() * 1000 - 500,
                z: Math.random() * state.drawDistance,
                length: Math.random() * 0.5 + 0.5
            });
        }
    }

    // --- Input Handling ---

    function setupInputs() {
        document.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft') input.left = true;
            if(e.key === 'ArrowRight') input.right = true;
        });
        document.addEventListener('keyup', (e) => {
            if(e.key === 'ArrowLeft') input.left = false;
            if(e.key === 'ArrowRight') input.right = false;
        });

        const addTouch = (elem, key) => {
            const activate = (e) => { 
                if(e.cancelable) e.preventDefault(); 
                input[key] = true; 
                elem.classList.add('active'); 
            };
            const deactivate = (e) => { 
                if(e.cancelable) e.preventDefault(); 
                input[key] = false; 
                elem.classList.remove('active'); 
            };

            elem.addEventListener('mousedown', activate);
            elem.addEventListener('mouseup', deactivate);
            elem.addEventListener('mouseleave', deactivate);
            elem.addEventListener('touchstart', activate, {passive: false});
            elem.addEventListener('touchend', deactivate, {passive: false});
        };

        addTouch(btnLeft, 'left');
        addTouch(btnRight, 'right');
    }

    // --- Rendering Helpers ---

    function project(x, y, z) {
        if (z <= 0) return { x: 0, y: 0, scale: 0 };
        // Perspective projection
        const scale = state.fov / (state.fov + z);
        // Horizon pushed high (top 20% of screen)
        const horizonY = cy - (height * 0.3); 
        
        // y2d calculation adjusted for steep downhill view
        const y2d = ((y - state.cameraHeight) * scale) + horizonY + (height * 0.4);
        const x2d = (x * scale) + cx;
        
        return { x: x2d, y: y2d, scale: scale };
    }

    function drawEnvironment() {
        // 1. Sky (Deep Alpine Gradient)
        const skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.5);
        skyGrad.addColorStop(0, '#020617'); // Very dark blue top
        skyGrad.addColorStop(0.5, '#1e3a8a'); // Deep blue
        skyGrad.addColorStop(1, '#38bdf8'); // Horizon light
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, width, height);

        // 2. Mountains (Parallax - simplified for performance)
        // Using a static path but offsetting texture logic if we had textures. 
        // Here we just draw jagged lines.
        const speedFactor = state.speed * 0.05;
        const offset = (frame * speedFactor) % 1000;
        
        ctx.save();
        
        // Far Mountains (Dark)
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.moveTo(0, height * 0.3);
        for(let i=0; i<=width; i+=50) {
            const noise = Math.sin((i - offset) * 0.005) * 80 + Math.cos((i - offset) * 0.01) * 40;
            ctx.lineTo(i, (height * 0.3) - Math.abs(noise));
        }
        ctx.lineTo(width, height * 0.3);
        ctx.lineTo(0, height * 0.3);
        ctx.fill();
        ctx.restore();
    }

    function drawSlope() {
        const horizonY = cy - (height * 0.3); // Match project function
        
        // Ground Gradient (Ice Blue to White)
        // Steep gradient to simulate the slope dropping away
        const groundGrad = ctx.createLinearGradient(0, horizonY, 0, height);
        groundGrad.addColorStop(0, '#7dd3fc'); // Horizon blend
        groundGrad.addColorStop(0.2, '#e0f2fe'); // Mid ice
        groundGrad.addColorStop(1, '#ffffff'); // Foreground snow
        
        ctx.fillStyle = groundGrad;
        ctx.beginPath();
        ctx.moveTo(0, horizonY);
        ctx.lineTo(width, horizonY);
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.fill();

        // 3. Grid (Perspective Lines)
        
        // Glowing Road Edges
        const drawEdge = (xPos) => {
            const pStart = project(xPos, 0, 10);
            const pEnd = project(xPos, 0, state.drawDistance);
            
            ctx.beginPath();
            ctx.moveTo(pStart.x, pStart.y);
            ctx.lineTo(pEnd.x, pEnd.y);
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#0ea5e9';
            ctx.shadowColor = '#0ea5e9';
            ctx.shadowBlur = 20;
            ctx.stroke();
            ctx.shadowBlur = 0;
        };

        drawEdge(-state.roadWidth/2);
        drawEdge(state.roadWidth/2);

        // Horizontal Speed Lines (Grid) - Thicker and faster
        const offset = (frame * state.speed * 3) % state.segmentLength;
        
        for (let z = state.drawDistance; z > 0; z -= state.segmentLength) {
            const drawZ = z - offset;
            if (drawZ < 10) continue;
            
            const pL = project(-state.roadWidth/2, 0, drawZ);
            const pR = project(state.roadWidth/2, 0, drawZ);
            
            // Fade logic
            const alpha = Math.min(1, (drawZ / 1000));
            ctx.globalAlpha = alpha * 0.5;
            ctx.strokeStyle = '#0ea5e9';
            ctx.lineWidth = 2; // Thicker
            
            ctx.beginPath();
            ctx.moveTo(pL.x, pL.y);
            ctx.lineTo(pR.x, pR.y);
            ctx.stroke();
        }
        ctx.globalAlpha = 1.0;
    }

    function drawObstacle(obs) {
        // Move obstacle towards camera
        let z = obs.z - (frame * state.speed * 3); // Faster movement relative to frame
        
        // Wrap around logic
        if (z < 10) {
            z += 40 * state.segmentLength;
            obs.x = (Math.random() * 1.4 - 0.7) * state.roadWidth; 
            obs.type = Math.random() > 0.5 ? 'gate' : 'rock';
        }
        
        // Calculate relative X
        const relX = obs.x - (state.playerX * state.roadWidth);
        const p = project(relX, 0, z);
        
        if (p.scale <= 0) return;

        // ENLARGE OBSTACLES (Critique Point 2)
        const size = 600 * p.scale; // Was 300, now 600

        ctx.save();
        ctx.translate(p.x, p.y);
        
        // Shadow (Grounding)
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(0, 0, size, size*0.3, 0, 0, Math.PI*2);
        ctx.fill();

        if (obs.type === 'gate') {
            // Alpine Gate (Red/Blue)
            const postH = size * 4; // Taller
            
            // Banner (Translucent with sharp edges)
            ctx.fillStyle = 'rgba(239, 68, 68, 0.8)';
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            
            // Jagged shape for danger
            ctx.beginPath();
            ctx.moveTo(-size, -postH);
            ctx.lineTo(size, -postH);
            ctx.lineTo(size, -postH + size*0.8);
            ctx.lineTo(-size, -postH + size*0.8);
            ctx.fill();
            ctx.stroke();

            // Posts
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 8 * p.scale;
            ctx.shadowColor = '#000';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(-size, 0); ctx.lineTo(-size, -postH);
            ctx.moveTo(size, 0); ctx.lineTo(size, -postH);
            ctx.stroke();
            ctx.shadowBlur = 0;

        } else {
            // Ice Rock
            ctx.fillStyle = '#f8fafc';
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#0ea5e9';
            ctx.shadowBlur = 15;
            
            // Jagged Rock Shape
            ctx.beginPath();
            ctx.moveTo(-size*0.6, 0);
            ctx.lineTo(-size*0.3, -size*1.5);
            ctx.lineTo(size*0.1, -size*1.8);
            ctx.lineTo(size*0.5, -size*1.2);
            ctx.lineTo(size*0.7, 0);
            ctx.fill();
            ctx.stroke();
            
            // Specular Highlight (Ice Shine)
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.beginPath();
            ctx.moveTo(-size*0.3, -size*1.5);
            ctx.lineTo(-size*0.1, -size*1.1);
            ctx.lineTo(-size*0.5, -size*0.5);
            ctx.fill();
            
            ctx.shadowBlur = 0;
        }
        ctx.restore();
    }

    function drawPlayer() {
        // Rider
        // Position fixed at lower center (Critique Point 1)
        // We use project(0,0,10) but we want it grounded. 
        // Let's manually position it to ensure it's big (15-20% height)
        
        const tilt = state.playerTilt;
        const riderScreenX = cx;
        const riderScreenY = height * 0.82; // Fixed position on screen
        
        ctx.save();
        ctx.translate(riderScreenX, riderScreenY); 
        ctx.rotate(tilt * 0.6); // Lean into turns

        // Shadow (Big, distinct)
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(0, 40, 60 + Math.abs(tilt)*30, 20, 0, 0, Math.PI*2);
        ctx.fill();

        // --- Skier Character (Detailed) ---
        
        // Skis (Cyan Glow)
        ctx.strokeStyle = '#0ea5e9';
        ctx.lineWidth = 14;
        ctx.lineCap = 'round';
        ctx.shadowColor = '#0ea5e9';
        ctx.shadowBlur = 20;
        
        ctx.beginPath(); ctx.moveTo(-20, 30); ctx.lineTo(-45, 90); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(20, 30); ctx.lineTo(45, 90); ctx.stroke();
        ctx.shadowBlur = 0;

        // Body (Suit)
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        // Crouched aerodynamic shape
        ctx.moveTo(-30, 0);
        ctx.quadraticCurveTo(0, -60, 30, 0); // Shoulders
        ctx.lineTo(25, 30); // Legs
        ctx.quadraticCurveTo(0, 40, -25, 30); // Knees
        ctx.fill();
        
        // Suit details (Blue stripe)
        ctx.fillStyle = '#0ea5e9';
        ctx.beginPath();
        ctx.moveTo(-10, -40); ctx.lineTo(-10, 10);
        ctx.moveTo(10, -40); ctx.lineTo(10, 10);
        ctx.fill();

        // Helmet
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(0, -45, 22, 0, Math.PI*2);
        ctx.fill();
        
        // Goggles (Red reflection)
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(0, -45, 22, -0.4, 0.4);
        ctx.fill();

        // Ice Spray (Particles behind skis)
        // Spawn particles
        if (state.speed > 100) {
            for(let k=0; k<3; k++) {
                particles.push({
                    x: (Math.random() * 40 - 20) + riderScreenX,
                    y: 80 + riderScreenY,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() * 10) + 5,
                    life: 1.0
                });
            }
        }

        ctx.restore();
    }

    function drawParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;

            if (p.life <= 0) {
                particles.splice(i, 1);
                continue;
            }

            ctx.globalAlpha = p.life;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    function drawEffects() {
        // Speed Lines / Motion Blur (Radial/Thick)
        // Draw lines originating from center-top to bottom
        const numLines = Math.floor(state.speed / 4);
        
        for(let i=0; i<numLines; i++) {
            const x = Math.random() * width;
            const y = Math.random() * height;
            const len = 100 + Math.random() * 200; // Longer streaks
            
            // Angle based on player tilt
            const angle = (Math.PI / 2) + (state.playerTilt * 0.5); // Vertical-ish
            
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + Math.cos(angle)*len, y + Math.sin(angle)*len);
            
            // Gradient for streak
            const grad = ctx.createLinearGradient(x, y, x + Math.cos(angle)*len, y + Math.sin(angle)*len);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0.4)');
            
            ctx.strokeStyle = grad;
            ctx.lineWidth = 4; // Thicker
            ctx.stroke();
        }

        // 3D Snow Particles (Background)
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        speedLines.forEach(p => {
            // Move Z
            p.z -= state.speed * 10; // Faster movement
            if(p.z < 0) {
                p.z = state.drawDistance;
                p.x = Math.random() * 2000 - 1000;
                p.y = Math.random() * 1000 - 500;
            }
            
            const relX = p.x - (state.playerX * state.roadWidth);
            const proj = project(relX, p.y, p.z);
            
            if(proj.scale > 0) {
                const size = 5 * proj.scale * 15;
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, size, 0, Math.PI*2);
                ctx.fill();
            }
        });

        // Vignette (Darker edges for focus)
        const grad = ctx.createRadialGradient(cx, cy, height/3, cx, cy, height);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.6)');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,width,height);
    }

    // --- Main Loop ---

    function update() {
        // Physics
        if (!input.left && !input.right) {
             // Auto accelerate slightly if no input
             state.targetSpeed = Math.min(240, state.targetSpeed + 0.5); 
        }
        
        state.speed += (state.targetSpeed - state.speed) * 0.05;

        // Steering
        const steerSpeed = 0.06;
        if (input.left) {
            state.playerX = Math.max(-1, state.playerX - steerSpeed);
            state.playerTilt = Math.max(-0.8, state.playerTilt - 0.08);
        } else if (input.right) {
            state.playerX = Math.min(1, state.playerX + steerSpeed);
            state.playerTilt = Math.min(0.8, state.playerTilt + 0.08);
        } else {
            state.playerTilt += (0 - state.playerTilt) * 0.1;
        }

        state.distance += state.speed * 0.0005;
        
        // UI Updates
        speedDisplay.innerText = Math.floor(state.speed);
        distDisplay.innerText = state.distance.toFixed(1);
        const progress = (state.distance % 10) / 10 * 100;
        progressBar.style.width = `${progress}%`;
        progressPct.innerText = `${Math.floor(progress)}%`;

        frame++;
    }

    function loop() {
        ctx.clearRect(0, 0, width, height);

        update();

        // 1. Environment (Sky + Mountains)
        drawEnvironment();

        // 2. Slope (Grid)
        drawSlope();

        // 3. Obstacles (Sorted by depth)
        // Sort based on current Z relative to camera
        obstacles.sort((a, b) => {
            const zA = a.z - (frame * state.speed * 3);
            const zB = b.z - (frame * state.speed * 3);
            return zB - zA;
        });
        obstacles.forEach(obs => drawObstacle(obs));

        // 4. Player
        drawPlayer();

        // 5. Particles (Spray)
        drawParticles();

        // 6. Effects (Speed lines, Snow, Vignette)
        drawEffects();

        requestAnimationFrame(loop);
    }

    // Start
    init();

</script>
</body>
</html>
