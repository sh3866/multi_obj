<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alpine Rush: Descent</title>
    <style>
        :root {
            --deep-indigo: #0f172a;
            --ice-blue: #38bdf8;
            --snow-white: #f8fafc;
            --danger-red: #f43f5e;
            
            /* Glassmorphism Variables */
            --glass-bg: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-highlight: rgba(255, 255, 255, 0.05);
            --blur-strength: 12px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Prevent browser zooming/scrolling */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--deep-indigo);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--snow-white);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            /* CSS Motion Blur for background mountains */
            filter: blur(1px); 
        }

        /* UI OVERLAYS */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            z-index: 10;
        }

        /* GLASSMORPHISM UTILITY CLASS */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-strength));
            -webkit-backdrop-filter: blur(var(--blur-strength));
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight); /* Top highlight */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* TOP BAR */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .stats-panel {
            border-radius: 16px;
            padding: 12px 24px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 120px;
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.6);
            font-weight: 700;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .stat-unit {
            font-size: 14px;
            font-weight: 600;
            opacity: 0.8;
            margin-left: 6px;
            color: var(--ice-blue);
        }

        .speed-value {
            color: var(--snow-white);
        }

        /* PROGRESS BAR */
        .progress-container {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            backdrop-filter: blur(4px);
        }

        .progress-fill {
            height: 100%;
            background: var(--ice-blue);
            width: 45%;
            border-radius: 10px;
            box-shadow: 0 0 15px var(--ice-blue);
            transition: width 0.1s linear;
        }

        /* CONTROLS AREA */
        .controls-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 10px;
            pointer-events: auto;
        }

        .control-pad {
            width: 80px;
            height: 80px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-strength));
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }
        
        /* Subtle inner glow for controls */
        .control-pad::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent);
            border-radius: 24px 24px 0 0;
        }

        .control-pad:active, .control-pad.active {
            transform: scale(0.92);
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.4);
        }

        .control-icon {
            width: 32px;
            height: 32px;
            fill: white;
            opacity: 0.9;
        }

        .brake-btn {
            border-color: rgba(244, 63, 94, 0.3);
            background: rgba(244, 63, 94, 0.15);
        }
        
        .brake-btn:active, .brake-btn.active {
            background: rgba(244, 63, 94, 0.4);
            border-color: var(--danger-red);
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.4);
        }

        .brake-text {
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1px;
            color: var(--danger-red);
            text-shadow: 0 0 10px rgba(244,63,94,0.5);
        }

        /* GRAIN OVERLAY */
        .noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            z-index: 5;
        }

    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="noise"></div>

    <div class="ui-layer">
        <!-- TOP HUD -->
        <div class="top-bar">
            <div class="stats-panel glass-panel">
                <span class="stat-label">Speed</span>
                <div style="display:flex; align-items: baseline;">
                    <span class="stat-value speed-value" id="speedDisplay">0</span>
                    <span class="stat-unit">KM/H</span>
                </div>
            </div>

            <div class="stats-panel glass-panel" style="align-items: flex-end;">
                <span class="stat-label">Distance</span>
                <div style="display:flex; align-items: baseline;">
                    <span class="stat-value" id="distDisplay">0.0</span>
                    <span class="stat-unit">KM</span>
                </div>
            </div>
        </div>

        <!-- PROGRESS -->
        <div class="progress-container">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <!-- CONTROLS -->
        <div class="controls-area">
            <div style="display: flex; gap: 20px;">
                <div class="control-pad" id="btnLeft">
                    <svg class="control-icon" viewBox="0 0 24 24">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                    </svg>
                </div>
                <div class="control-pad" id="btnRight">
                    <svg class="control-icon" viewBox="0 0 24 24">
                        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                    </svg>
                </div>
            </div>
            
            <div class="control-pad brake-btn" id="btnBrake">
                <span class="brake-text">STOP</span>
            </div>
        </div>
    </div>
</div>

<script>
    /**
     * ALPINE RUSH ENGINE
     * Pseudo-3D Tunnel Engine
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    // UI Elements
    const speedDisplay = document.getElementById('speedDisplay');
    const distDisplay = document.getElementById('distDisplay');
    const progressBar = document.getElementById('progressBar');
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnBrake = document.getElementById('btnBrake');

    // State
    let width, height;
    let cx, cy;
    let frame = 0;
    
    // Game Physics State
    const state = {
        speed: 0,
        targetSpeed: 80,
        distance: 0,
        playerX: 0, // -1 (left) to 1 (right)
        playerTilt: 0,
        isBraking: false,
        roadWidth: 1800,
        segmentLength: 150,
        cameraHeight: 1200, // Higher camera for wider view
        fov: 120,
        drawDistance: 4000
    };

    // Input State
    const input = {
        left: false,
        right: false,
        brake: false
    };

    // Assets
    const obstacles = [];

    // --- Initialization ---

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * window.devicePixelRatio;
        canvas.height = height * window.devicePixelRatio;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        cx = width / 2;
        cy = height / 2;
    }

    function init() {
        resize();
        window.addEventListener('resize', resize);
        setupInputs();
        generateWorld();
        requestAnimationFrame(loop);
    }

    function generateWorld() {
        // Generate obstacles (gates/rocks)
        for(let i=0; i<30; i++) {
            obstacles.push({
                z: 500 + i * 400 + Math.random() * 200,
                x: (Math.random() * 2 - 1) * (state.roadWidth * 0.8),
                type: Math.random() > 0.4 ? 'gate' : 'rock'
            });
        }
    }

    // --- Input Handling ---

    function setupInputs() {
        document.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft') input.left = true;
            if(e.key === 'ArrowRight') input.right = true;
            if(e.key === 'ArrowDown' || e.key === ' ') input.brake = true;
        });
        document.addEventListener('keyup', (e) => {
            if(e.key === 'ArrowLeft') input.left = false;
            if(e.key === 'ArrowRight') input.right = false;
            if(e.key === 'ArrowDown' || e.key === ' ') input.brake = false;
        });

        const addTouch = (elem, key) => {
            const activate = (e) => { 
                if(e.cancelable) e.preventDefault(); 
                input[key] = true; 
                elem.classList.add('active'); 
            };
            const deactivate = (e) => { 
                if(e.cancelable) e.preventDefault(); 
                input[key] = false; 
                elem.classList.remove('active'); 
            };

            elem.addEventListener('mousedown', activate);
            elem.addEventListener('mouseup', deactivate);
            elem.addEventListener('mouseleave', deactivate);
            elem.addEventListener('touchstart', activate, {passive: false});
            elem.addEventListener('touchend', deactivate, {passive: false});
        };

        addTouch(btnLeft, 'left');
        addTouch(btnRight, 'right');
        addTouch(btnBrake, 'brake');
    }

    // --- Rendering Helpers ---

    // Project 3D world coordinates to 2D screen
    function project(x, y, z) {
        // Adjust Z so camera is at 0
        const zShift = z; 
        if (zShift <= 0) return { x: 0, y: 0, scale: 0 };

        const scale = state.fov / (state.fov + zShift);
        const x2d = (x * scale) + cx;
        const y2d = ((y - state.cameraHeight) * scale) + cy + (height * 0.15); // Horizon pushed down slightly
        return { x: x2d, y: y2d, scale: scale };
    }

    function drawSky() {
        // Deep Indigo Gradient
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, '#020617'); // Almost black indigo
        gradient.addColorStop(0.4, '#1e1b4b'); // Deep blue
        gradient.addColorStop(0.8, '#312e81'); // Lighter indigo
        gradient.addColorStop(1, '#0f172a'); // Snow horizon blend
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
    }

    function drawMountains() {
        // Draw mountains that move very slowly (parallax)
        const speedFactor = state.speed * 0.05;
        const offset = (frame * speedFactor) % width;

        ctx.save();
        // Motion blur effect via multiple passes with opacity
        ctx.globalAlpha = 0.4;
        ctx.fillStyle = '#1e293b';
        
        // Draw 3 layers of mountains for depth
        for(let layer=0; layer<3; layer++) {
            ctx.beginPath();
            ctx.moveTo(0, cy + 150);
            
            const amplitude = 60 - (layer * 10);
            const frequency = 0.003 + (layer * 0.001);
            const yOffset = (cy + 100) - (layer * 20);
            
            for(let i=0; i<=width; i+=20) {
                // Procedural noise for jagged peaks
                const noise = Math.sin((i - offset * (layer+1)*0.5) * frequency) * amplitude + 
                              Math.cos((i - offset * (layer+1)*0.5) * frequency * 3) * (amplitude/2);
                ctx.lineTo(i, yOffset - noise);
            }
            ctx.lineTo(width, cy + 150);
            ctx.lineTo(0, cy + 150);
            ctx.fill();
        }
        ctx.restore();
    }

    function drawTunnel() {
        // The 3D Grid 'Tunnel'
        const horizonY = cy + (height * 0.15); // Matches project() offset
        
        // Draw Ground (Snow)
        const groundGrad = ctx.createLinearGradient(0, horizonY, 0, height);
        groundGrad.addColorStop(0, '#312e81'); // Distant snow matches sky
        groundGrad.addColorStop(0.1, '#cbd5e1'); // Mid snow
        groundGrad.addColorStop(1, '#f8fafc'); // Close snow
        
        ctx.fillStyle = groundGrad;
        ctx.beginPath();
        ctx.moveTo(0, horizonY);
        ctx.lineTo(width, horizonY);
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.fill();

        // Draw Grid Lines (Perspective)
        ctx.lineWidth = 2;
        
        // Vertical lines (Road Edges & Center)
        const drawLine = (xPos, color, width) => {
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.beginPath();
            
            // Start from screen bottom (approx z=10) to horizon
            const pStart = project(xPos, 0, 10);
            const pEnd = project(xPos, 0, state.drawDistance);
            
            ctx.moveTo(pStart.x, pStart.y);
            ctx.lineTo(pEnd.x, pEnd.y);
            ctx.stroke();
        };

        // Road Edges (Glowing)
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#38bdf8';
        drawLine(-state.roadWidth/2, '#38bdf8', 3);
        drawLine(state.roadWidth/2, '#38bdf8', 3);
        
        // Center Line (Dashed)
        ctx.shadowBlur = 0;
        ctx.setLineDash([20, 40]);
        ctx.lineDashOffset = -(frame * state.speed * 2); // Animate dash
        drawLine(0, 'rgba(255,255,255,0.3)', 2);
        ctx.setLineDash([]); // Reset

        // Horizontal Grid Lines (Speed lines on ground)
        const offset = (frame * state.speed * 2) % state.segmentLength;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        
        for (let z = state.drawDistance; z > 0; z -= state.segmentLength) {
            const drawZ = z - offset;
            if (drawZ < 10) continue;
            
            const pL = project(-state.roadWidth/2, 0, drawZ);
            const pR = project(state.roadWidth/2, 0, drawZ);
            
            // Fade out distant lines
            const alpha = Math.min(1, (drawZ / 1000));
            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.2})`;
            
            ctx.beginPath();
            ctx.moveTo(pL.x, pL.y);
            ctx.lineTo(pR.x, pR.y);
            ctx.stroke();
        }
    }

    function drawObstacle(obs) {
        // Move obstacle towards camera
        let z = obs.z - (frame * state.speed * 2);
        
        // Wrap around logic
        if (z < 10) z += 30 * state.segmentLength; // Reset to far distance
        
        // Calculate relative X based on player steering
        // The world moves opposite to player
        const relX = obs.x - (state.playerX * state.roadWidth);
        const p = project(relX, 0, z);
        
        if (p.scale <= 0) return;

        const size = 200 * p.scale;

        ctx.save();
        ctx.translate(p.x, p.y);
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(0, 0, size, size*0.3, 0, 0, Math.PI*2);
        ctx.fill();

        if (obs.type === 'gate') {
            // Red/Blue Gate
            ctx.strokeStyle = '#f43f5e'; // Red
            ctx.lineWidth = 4 * p.scale;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#f43f5e';
            
            // Gate Posts
            const postH = size * 1.5;
            
            ctx.beginPath();
            ctx.moveTo(-size*0.8, 0);
            ctx.lineTo(-size*0.8, -postH);
            ctx.moveTo(size*0.8, 0);
            ctx.lineTo(size*0.8, -postH);
            ctx.stroke();

            // Banner
            ctx.fillStyle = 'rgba(244, 63, 94, 0.6)';
            ctx.fillRect(-size*0.8, -postH, size*1.6, size*0.6);
            
            // Text on banner (simplified)
            ctx.fillStyle = 'white';
            ctx.font = `bold ${12*p.scale}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText("GATE", 0, -postH + (size*0.4));

        } else {
            // Rock / Snowbank
            ctx.fillStyle = '#64748b'; // Slate
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.moveTo(-size*0.5, 0);
            ctx.lineTo(-size*0.2, -size*0.8);
            ctx.lineTo(size*0.4, -size*0.6);
            ctx.lineTo(size*0.6, 0);
            ctx.fill();
            
            // Snow on top
            ctx.fillStyle = '#f1f5f9';
            ctx.beginPath();
            ctx.moveTo(-size*0.2, -size*0.8);
            ctx.lineTo(size*0.4, -size*0.6);
            ctx.lineTo(size*0.2, -size*0.4);
            ctx.lineTo(-size*0.1, -size*0.5);
            ctx.fill();
        }
        ctx.restore();
    }

    function drawPlayer() {
        // Player is fixed at bottom-center, but tilts
        const p = project(0, 0, 10); // Just in front of camera
        const tilt = state.playerTilt;
        
        ctx.save();
        // Position slightly above the projected ground to simulate standing on it
        ctx.translate(p.x, p.y - 60); 
        ctx.rotate(tilt * 0.4); 

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.ellipse(0, 60, 30 + Math.abs(tilt)*20, 10, 0, 0, Math.PI*2);
        ctx.fill();

        // --- Stylized Skier ---
        
        // Skis (Long, thin)
        ctx.strokeStyle = '#0ea5e9'; // Cyan skis
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        
        // Left Ski
        ctx.beginPath();
        ctx.moveTo(-12, 40);
        ctx.lineTo(-25, 80);
        ctx.stroke();
        
        // Right Ski
        ctx.beginPath();
        ctx.moveTo(12, 40);
        ctx.lineTo(25, 80);
        ctx.stroke();

        // Body (Aerodynamic Tuck)
        ctx.fillStyle = '#ffffff'; // White suit
        
        // Torso
        ctx.beginPath();
        ctx.ellipse(0, 10, 14, 20, 0, 0, Math.PI*2);
        ctx.fill();
        
        // Helmet
        ctx.fillStyle = '#0f172a'; // Dark helmet
        ctx.beginPath();
        ctx.arc(0, -15, 12, 0, Math.PI*2);
        ctx.fill();
        
        // Goggles (Reflective)
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath();
        ctx.arc(0, -15, 12, -0.2, 0.2); // Front slice
        ctx.fill();

        // Motion Blur Trails (Speed lines behind player)
        // These are drawn relative to player position
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 3;
        for(let i=0; i<3; i++) {
            const offset = (Math.random() - 0.5) * 30;
            ctx.beginPath();
            ctx.moveTo(offset, 80);
            ctx.lineTo(offset - (tilt*50), 150 + (Math.random()*50));
            ctx.stroke();
        }

        ctx.restore();
    }

    function drawSpeedLines() {
        // Diagonal streaks in the air
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 2;
        const numLines = Math.floor(state.speed / 10); // More lines at higher speed
        
        for(let i=0; i<numLines; i++) {
            const x = Math.random() * width;
            const y = Math.random() * height;
            const len = 50 + Math.random() * 100;
            const angle = Math.PI / 4 + (state.playerTilt * 0.2); // Angle changes with turn
            
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + Math.cos(angle)*len, y + Math.sin(angle)*len);
            ctx.stroke();
        }
    }

    // --- Main Loop ---

    function update() {
        // Physics
        if (input.brake) {
            state.targetSpeed = Math.max(0, state.targetSpeed - 4);
            state.isBraking = true;
        } else {
            state.targetSpeed = Math.min(180, state.targetSpeed + 0.5);
            state.isBraking = false;
        }
        
        // Smooth speed interpolation
        state.speed += (state.targetSpeed - state.speed) * 0.05;

        // Steering
        const steerSpeed = 0.04;
        if (input.left) {
            state.playerX = Math.max(-1, state.playerX - steerSpeed);
            state.playerTilt = Math.max(-0.6, state.playerTilt - 0.05);
        } else if (input.right) {
            state.playerX = Math.min(1, state.playerX + steerSpeed);
            state.playerTilt = Math.min(0.6, state.playerTilt + 0.05);
        } else {
            // Return to center tilt
            state.playerTilt += (0 - state.playerTilt) * 0.1;
        }

        // Distance
        state.distance += state.speed * 0.0005;
        
        // Update UI
        speedDisplay.innerText = Math.floor(state.speed);
        distDisplay.innerText = state.distance.toFixed(1);
        
        // Progress Bar animation
        const progress = (state.distance % 10) / 10 * 100;
        progressBar.style.width = `${progress}%`;

        frame++;
    }

    function loop() {
        ctx.clearRect(0, 0, width, height);

        update();

        // 1. Environment
        drawSky();
        drawMountains();

        // 2. Tunnel / Road
        drawTunnel();

        // 3. World Objects (Sorted by Z for painter's algo)
        // We sort dynamically because obstacles wrap around
        obstacles.sort((a, b) => {
            const zA = a.z - (frame * state.speed * 2);
            const zB = b.z - (frame * state.speed * 2);
            return zB - zA; // Draw far objects first
        });

        obstacles.forEach(obs => {
            drawObstacle(obs);
        });

        // 4. Player (Always on top)
        drawPlayer();

        // 5. Effects
        drawSpeedLines();

        // 6. Vignette (Dramatic lighting)
        const grad = ctx.createRadialGradient(cx, cy, height/3, cx, cy, height);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.7)');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,width,height);

        requestAnimationFrame(loop);
    }

    // Start
    init();

</script>
</body>
</html>
