<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Architecture: Information Flow</title>
<style>
    :root {
        /* Palette - Blueprint Theme */
        --bg-color: #0d1117;
        --grid-color: #1f2937;
        --grid-major: #374151;
        
        --panel-fill: #161b22;
        --panel-stroke: #30363d;
        --panel-highlight: #58a6ff;
        
        /* Typography */
        --text-main: #e6edf3;
        --text-muted: #8b949e;
        --text-header: #c9d1d9;
        
        /* Semantic Signal Colors */
        --col-data: #58a6ff;      /* Blue - Data */
        --col-instr: #d2a8ff;     /* Purple - Instructions */
        --col-ctrl: #7ee787;      /* Green - Control */
        --col-io: #f2cc60;        /* Yellow - I/O */
        
        /* UI Elements */
        --font-stack: "Roboto Mono", "Courier New", Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background-color: var(--bg-color);
        /* Technical Dot Grid Pattern */
        background-image: 
            radial-gradient(var(--grid-color) 1px, transparent 1px),
            radial-gradient(var(--grid-color) 1px, transparent 1px);
        background-size: 20px 20px;
        background-position: 0 0, 10px 10px;
        
        color: var(--text-main);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- UI Overlay --- */
    .ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 20;
        padding: 30px;
    }

    header {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        pointer-events: auto;
        border-left: 4px solid var(--col-data);
        padding-left: 16px;
    }

    h1 {
        font-size: 1.8rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 0.25rem;
        color: var(--text-main);
        text-transform: uppercase;
    }

    .subtitle {
        color: var(--text-muted);
        font-size: 0.85rem;
        font-weight: 400;
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }

    /* Legend: Bottom Right (Demoted) */
    .legend {
        position: absolute;
        bottom: 30px;
        right: 30px;
        display: flex;
        gap: 20px;
        background: rgba(22, 27, 34, 0.9);
        padding: 12px 20px;
        border: 1px solid var(--panel-stroke);
        border-radius: 4px;
        pointer-events: auto;
        z-index: 21;
        backdrop-filter: blur(4px);
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.75rem;
        font-weight: 400;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }

    /* Legend Line Indicators */
    .line-indicator {
        width: 20px;
        height: 2px;
        position: relative;
    }
    .line-solid { background-color: currentColor; }
    .line-dashed { 
        background: repeating-linear-gradient(90deg, currentColor 0, currentColor 4px, transparent 4px, transparent 8px); 
    }
    .line-dotted { 
        background: repeating-linear-gradient(90deg, currentColor 0, currentColor 2px, transparent 2px, transparent 6px); 
    }

    /* --- SVG Container --- */
    #diagram-container {
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    svg {
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    /* --- Zones --- */
    /* Stronger Grouping Containers */
    .zone {
        rx: 4px;
        stroke-width: 1;
        stroke-dasharray: 5 5;
        fill: rgba(22, 27, 34, 0.5);
        stroke: var(--grid-major);
    }

    .zone-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 700;
        fill: var(--text-muted);
        opacity: 0.8;
        text-anchor: start;
    }

    /* --- Components --- */
    .component-group {
        cursor: pointer;
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .component-group:hover {
        transform: translateY(-3px);
    }

    /* Standard Rounded Rect */
    .comp-bg {
        fill: var(--panel-fill);
        stroke: var(--panel-stroke);
        stroke-width: 2;
        rx: 6px;
        filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
        transition: stroke 0.2s, fill 0.2s;
    }
    
    .component-group:hover .comp-bg {
        stroke: var(--text-muted);
        fill: #1c2128;
    }

    /* CPU Hexagon - Dominant Presence */
    .cpu-bg {
        fill: var(--panel-fill);
        stroke: var(--text-main);
        stroke-width: 3;
        filter: drop-shadow(0 0 15px rgba(255,255,255,0.05));
    }
    
    /* Storage Stack - Cylinder/Stack Visual */
    .storage-layer {
        fill: var(--panel-fill);
        stroke: var(--panel-stroke);
        stroke-width: 2;
    }

    .comp-icon {
        fill: none;
        stroke: var(--text-muted);
        stroke-width: 2;
        stroke-linecap: square;
        stroke-linejoin: miter;
        transition: stroke 0.2s;
    }
    
    .component-group:hover .comp-icon {
        stroke: var(--text-main);
    }

    .comp-label {
        fill: var(--text-main);
        font-size: 13px;
        font-weight: 700;
        text-anchor: middle;
        letter-spacing: 0.05em;
        pointer-events: none;
        text-transform: uppercase;
    }

    .comp-sub {
        fill: var(--text-muted);
        font-size: 10px;
        text-anchor: middle;
        font-weight: 400;
        pointer-events: none;
        letter-spacing: 0.05em;
    }

    /* --- Connectors (Lines) --- */
    /* Orthogonal Grid Routing */
    .path-bg {
        fill: none;
        stroke: rgba(255,255,255,0.03);
        stroke-width: 8; /* Increased hit area */
        stroke-linejoin: round;
        stroke-linecap: round;
    }

    .path-active {
        fill: none;
        stroke-width: 2;
        stroke-linejoin: miter; /* Sharp corners for blueprint look */
        stroke-linecap: square;
    }

    /* Styles */
    .style-data { stroke: var(--col-data); stroke-dasharray: none; }
    .style-instr { stroke: var(--col-instr); stroke-dasharray: 2 4; } /* Dotted */
    .style-ctrl { stroke: var(--col-ctrl); stroke-dasharray: 6 4; } /* Dashed */
    .style-io { stroke: var(--col-io); stroke-dasharray: none; }

    /* Animations */
    @keyframes flow-particle {
        0% { stroke-dashoffset: 100; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
    }

    .particle {
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: 1 100; /* Single packet */
        filter: drop-shadow(0 0 2px currentColor);
        animation: flow-particle 2s linear infinite;
    }

    .p-data { stroke: var(--col-data); }
    .p-instr { stroke: var(--col-instr); animation-duration: 1.2s; }
    .p-ctrl { stroke: var(--col-ctrl); animation-duration: 2.5s; }
    .p-io { stroke: var(--col-io); }

    /* Hover States */
    .dimmed {
        opacity: 0.15 !important;
        transition: opacity 0.3s;
    }
    
</style>
</head>
<body>

    <div class="ui-layer">
        <header>
            <h1>System Architecture</h1>
            <div class="subtitle">Information Flow &amp; Component Topology</div>
        </header>

        <!-- Legend Bottom Right -->
        <div class="legend">
            <div class="legend-item" style="color: var(--col-data)">
                <div class="line-indicator line-solid"></div>
                <span>Data</span>
            </div>
            <div class="legend-item" style="color: var(--col-instr)">
                <div class="line-indicator line-dotted"></div>
                <span>Instructions</span>
            </div>
            <div class="legend-item" style="color: var(--col-ctrl)">
                <div class="line-indicator line-dashed"></div>
                <span>Control</span>
            </div>
            <div class="legend-item" style="color: var(--col-io)">
                <div class="line-indicator line-solid"></div>
                <span>I/O Stream</span>
            </div>
        </div>
    </div>

    <div id="diagram-container">
        <svg id="main-svg" viewBox="0 0 1000 750" preserveAspectRatio="xMidYMid meet">
            <defs>
                <!-- Arrowhead Marker - Proportional to line weight -->
                <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <path d="M0,0 L8,3 L0,6" fill="currentColor" stroke="none" />
                </marker>
            </defs>
            
            <!-- Background Zones -->
            <g id="zones-layer"></g>
            
            <!-- Paths (Lines) -->
            <g id="paths-layer"></g>
            
            <!-- Animated Particles -->
            <g id="particles-layer"></g>
            
            <!-- Components (Boxes) -->
            <g id="components-layer"></g>
        </svg>
    </div>

<script>
    // --- Configuration ---
    const svg = document.getElementById('main-svg');
    const zonesLayer = document.getElementById('zones-layer');
    const pathsLayer = document.getElementById('paths-layer');
    const particlesLayer = document.getElementById('particles-layer');
    const componentsLayer = document.getElementById('components-layer');

    const createSVG = (tag, attrs) => {
        const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
        return el;
    };

    // Component Data - Refined Layout
    // Grid: 
    // Y=150: RAM (Top Center), Output (Top Left)
    // Y=350: Input (Left), CPU (Center), GPU (Right)
    // Y=550: Network (Bottom Left), Storage (Bottom Center)
    const components = [
        { id: 'cpu', label: 'CPU', sub: 'Processing Unit', x: 500, y: 350, w: 180, h: 140, type: 'cpu', icon: 'cpu' },
        { id: 'ram', label: 'Memory', sub: 'System RAM', x: 500, y: 150, w: 120, h: 80, type: 'standard', icon: 'ram' },
        { id: 'gpu', label: 'GPU', sub: 'Graphics', x: 750, y: 350, w: 120, h: 80, type: 'standard', icon: 'gpu' },
        { id: 'storage', label: 'Storage', sub: 'NVMe Array', x: 500, y: 550, w: 120, h: 80, type: 'storage', icon: 'hdd' },
        { id: 'input', label: 'Input', sub: 'Keyboard / Mouse', x: 250, y: 350, w: 120, h: 80, type: 'standard', icon: 'mouse' },
        { id: 'output', label: 'Output', sub: 'Display', x: 250, y: 150, w: 120, h: 80, type: 'standard', icon: 'monitor' },
        { id: 'network', label: 'Network', sub: 'Interface', x: 250, y: 550, w: 120, h: 80, type: 'standard', icon: 'router' }
    ];

    // Connections
    const connections = [
        // Fetch-Execute Cycle
        { from: 'storage', to: 'ram', type: 'instr', label: 'Load Instructions' },
        { from: 'ram', to: 'cpu', type: 'instr', label: 'Fetch' },
        
        // CPU <-> Memory (Data)
        { from: 'ram', to: 'cpu', type: 'data', label: 'Read/Write Data' },
        
        // CPU <-> Storage (Control)
        { from: 'cpu', to: 'storage', type: 'ctrl', label: 'I/O Control' },
        
        // CPU <-> GPU (Data)
        { from: 'cpu', to: 'gpu', type: 'data', label: 'Render Data' },
        { from: 'gpu', to: 'cpu', type: 'ctrl', label: 'Sync' },
        
        // Input <-> CPU
        { from: 'input', to: 'cpu', type: 'data', label: 'User Input' },
        
        // CPU <-> Output (I/O Stream) - Fixed Flow Logic
        { from: 'cpu', to: 'output', type: 'io', label: 'Video Signal' },
        { from: 'gpu', to: 'output', type: 'io', label: 'Frame Buffer' },
        
        // Network <-> CPU
        { from: 'network', to: 'cpu', type: 'data', label: 'Inbound' },
        { from: 'cpu', to: 'network', type: 'data', label: 'Outbound' }
    ];

    // --- Draw Zones ---
    function drawZones() {
        // Core Zone (Right)
        const coreZone = createSVG('rect', {
            class: 'zone',
            x: 400, y: 80, width: 460, height: 540
        });
        const coreLabel = createSVG('text', { x: 420, y: 115, class: 'zone-label' });
        coreLabel.textContent = 'CORE PROCESSING';
        zonesLayer.appendChild(coreZone);
        zonesLayer.appendChild(coreLabel);

        // Peripheral Zone (Left)
        const periphZone = createSVG('rect', {
            class: 'zone',
            x: 150, y: 80, width: 340, height: 540
        });
        const periphLabel = createSVG('text', { x: 170, y: 115, class: 'zone-label' });
        periphLabel.textContent = 'PERIPHERALS & I/O';
        zonesLayer.appendChild(periphZone);
        zonesLayer.appendChild(periphLabel);
    }

    // --- Draw Icons ---
    const drawIcon = (id, x, y) => {
        let g = createSVG('g', { transform: `translate(${x}, ${y})` });
        const stroke = { stroke: 'currentColor', 'stroke-width': 2, fill: 'none', 'stroke-linecap': 'square', 'stroke-linejoin': 'miter' };

        if(id === 'cpu') {
            g.appendChild(createSVG('rect', { x:-10, y:-10, width:20, height:20, ...stroke }));
            g.appendChild(createSVG('rect', { x:-4, y:-4, width:8, height:8, fill: 'currentColor', stroke: 'none' }));
        } else if (id === 'ram') {
            g.appendChild(createSVG('rect', { x:-12, y:-8, width:24, height:16, ...stroke }));
            g.appendChild(createSVG('path', { d:"M-8 -2v12 M-4 -2v12 M0 -2v12 M4 -2v12 M8 -2v12", ...stroke, 'stroke-width': 1 }));
        } else if (id === 'gpu') {
            g.appendChild(createSVG('rect', { x:-12, y:-8, width:24, height:16, ...stroke }));
            g.appendChild(createSVG('path', { d:"M-6 0h12 M-6 4h6", ...stroke }));
        } else if (id === 'hdd') {
            g.appendChild(createSVG('rect', { x:-12, y:-6, width:24, height:12, ...stroke }));
            g.appendChild(createSVG('circle', { cx:0, cy:0, r:3, ...stroke }));
        } else if (id === 'mouse') {
            g.appendChild(createSVG('rect', { x:-6, y:-10, width:12, height:20, rx:4, ...stroke }));
            g.appendChild(createSVG('line', { x1:0, y1:-10, x2:0, y2:-4, ...stroke }));
        } else if (id === 'monitor') {
            g.appendChild(createSVG('rect', { x:-12, y:-8, width:24, height:14, ...stroke }));
            g.appendChild(createSVG('path', { d:"M-6 6v4h12v-4", ...stroke }));
        } else if (id === 'router') {
            g.appendChild(createSVG('rect', { x:-12, y:-6, width:24, height:12, ...stroke }));
            g.appendChild(createSVG('path', { d:"M-4 0a4 4 0 0 1 8 0", ...stroke }));
            g.appendChild(createSVG('path', { d:"M-7 3a7 7 0 0 1 14 0", ...stroke }));
        }
        return g;
    };

    // --- Render Components ---
    const compMap = {}; 

    components.forEach(c => {
        const g = createSVG('g', { 
            class: 'component-group', 
            transform: `translate(${c.x}, ${c.y})`,
            'data-id': c.id
        });

        let shape;
        if (c.type === 'cpu') {
            // Hexagon
            const r = 75; // Larger radius for dominance
            const points = [];
            for (let i = 0; i < 6; i++) {
                const angle_deg = 60 * i - 30;
                const angle_rad = Math.PI / 180 * angle_deg;
                points.push(`${r * Math.cos(angle_rad)},${r * Math.sin(angle_rad)}`);
            }
            shape = createSVG('polygon', { points: points.join(' '), class: 'cpu-bg' });
            // Inner detail
            const innerR = 60;
            const innerPoints = [];
            for (let i = 0; i < 6; i++) {
                const angle_deg = 60 * i - 30;
                const angle_rad = Math.PI / 180 * angle_deg;
                innerPoints.push(`${innerR * Math.cos(angle_rad)},${innerR * Math.sin(angle_rad)}`);
            }
            g.appendChild(createSVG('polygon', { points: innerPoints.join(' '), fill: 'none', stroke: 'currentColor', 'stroke-opacity': 0.2, 'stroke-width': 1 }));

        } else if (c.type === 'storage') {
            // Stack / Cylinder Visual
            const layers = 3;
            for(let i=0; i<layers; i++) {
                const yOffset = (i * 15) - 20;
                g.appendChild(createSVG('path', { 
                    d: `M -60 ${yOffset} L -60 ${yOffset+15} L 60 ${yOffset+15} L 60 ${yOffset} A 60 10 0 0 0 -60 ${yOffset} Z`,
                    class: 'storage-layer'
                }));
                g.appendChild(createSVG('ellipse', { 
                    cx: 0, cy: yOffset, rx: 60, ry: 10,
                    class: 'storage-layer', fill: 'rgba(255,255,255,0.02)'
                }));
            }
            // Main container rect to hold the icon/text visually
            shape = createSVG('rect', { x: -60, y: -40, width: 120, height: 80, fill: 'transparent', stroke: 'none' });
        } else {
            // Standard Rounded Rect
            shape = createSVG('rect', { 
                class: 'comp-bg',
                x: -c.w/2, y: -c.h/2,
                width: c.w, height: c.h 
            });
        }
        
        // Icon
        const icon = drawIcon(c.icon, 0, -15);
        icon.setAttribute('class', 'comp-icon');
        icon.setAttribute('transform', `translate(-12, -20)`);

        // Labels
        const textLabel = createSVG('text', { x: 0, y: 15, class: 'comp-label' });
        textLabel.textContent = c.label;
        
        const textSub = createSVG('text', { x: 0, y: 30, class: 'comp-sub' });
        textSub.textContent = c.sub;

        g.appendChild(shape);
        g.appendChild(icon);
        g.appendChild(textLabel);
        g.appendChild(textSub);
        
        componentsLayer.appendChild(g);
        compMap[c.id] = c;

        // Hover Logic
        g.addEventListener('mouseenter', () => highlightPath(c.id));
        g.addEventListener('mouseleave', () => resetHighlight());
    });

    // --- Render Paths (Orthogonal) ---
    const pathGroups = {}; 

    // Orthogonal Path Generator (Manhattan)
    const getOrthoPath = (c1, c2, offsetIndex, totalCount) => {
        const dx = c2.x - c1.x;
        const dy = c2.y - c1.y;
        
        // Calculate Offset for parallel lines
        const offsetMag = 12;
        const shift = (offsetIndex * 2 - (totalCount - 1)) * offsetMag;

        let path = "";

        // Logic: Determine primary axis
        if (Math.abs(dy) > Math.abs(dx)) {
            // Vertical Dominant
            const xShift = shift * 0.5;
            const startY = dy > 0 ? c1.y + c1.h/2 : c1.y - c1.h/2;
            const endY = dy > 0 ? c2.y - c2.h/2 : c2.y + c2.h/2;
            
            // Path: Down -> Shift -> Down -> To Center
            path = `M ${c1.x} ${startY} 
                    L ${c1.x} ${(startY + endY)/2} 
                    L ${c2.x + xShift} ${(startY + endY)/2} 
                    L ${c2.x + xShift} ${endY} 
                    L ${c2.x} ${endY}`;
        } else {
            // Horizontal Dominant
            const yShift = shift * 0.5;
            const startX = dx > 0 ? c1.x + c1.w/2 : c1.x - c1.w/2;
            const endX = dx > 0 ? c2.x - c2.w/2 : c2.x + c2.w/2;

            // Path: Right -> Shift -> Right -> Up/Down -> Center
            path = `M ${startX} ${c1.y} 
                    L ${(startX + endX)/2} ${c1.y} 
                    L ${(startX + endX)/2} ${c2.y + yShift} 
                    L ${endX} ${c2.y + yShift} 
                    L ${endX} ${c2.y}`;
        }
        
        // Special Case: Vertical Center Stack (CPU <-> RAM)
        if (Math.abs(dx) < 5 && Math.abs(dy) > 10) {
             const xShift = shift;
             const startY = dy > 0 ? c1.y + c1.h/2 : c1.y - c1.h/2;
             const endY = dy > 0 ? c2.y - c2.h/2 : c2.y + c2.h/2;
             path = `M ${c1.x} ${startY} 
                     L ${c1.x + xShift} ${startY} 
                     L ${c1.x + xShift} ${endY} 
                     L ${c2.x} ${endY}`;
        }

        return path;
    };

    const connectionCount = {};

    connections.forEach((conn, index) => {
        const start = compMap[conn.from];
        const end = compMap[conn.to];
        
        const pairKey = [conn.from, conn.to].sort().join('-');
        if (!connectionCount[pairKey]) connectionCount[pairKey] = 0;
        const offsetIndex = connectionCount[pairKey];
        connectionCount[pairKey]++;

        const g = createSVG('g', { class: 'connection-group', 'data-from': conn.from, 'data-to': conn.to });

        const pathD = getOrthoPath(start, end, offsetIndex, connectionCount[pairKey]);
        const trackColor = `var(--col-${conn.type})`;

        // 1. Hit Area
        const bgPath = createSVG('path', {
            d: pathD,
            stroke: 'transparent',
            'stroke-width': 24,
            fill: 'none',
            class: 'hit-area'
        });

        // 2. Visible Track (Subtle)
        const visiblePath = createSVG('path', {
            d: pathD,
            class: 'path-bg',
            stroke: trackColor,
            'stroke-opacity': 0.1
        });

        // 3. Active Semantic Line
        const activePath = createSVG('path', {
            d: pathD,
            class: `path-active style-${conn.type}`,
            'marker-end': 'url(#arrowhead)',
            style: `color: ${trackColor}`
        });

        // 4. Particle
        const particle = createSVG('path', {
            d: pathD,
            class: `particle p-${conn.type}`,
            style: `animation-delay: ${Math.random() * 2}s; color: ${trackColor}`
        });

        g.appendChild(bgPath);
        g.appendChild(visiblePath);
        g.appendChild(activePath);
        g.appendChild(particle);

        pathsLayer.appendChild(g);
        
        if (!pathGroups[conn.from]) pathGroups[conn.from] = [];
        if (!pathGroups[conn.to]) pathGroups[conn.to] = [];
        pathGroups[conn.from].push(g);
        pathGroups[conn.to].push(g);
    });

    // --- Interactivity ---
    function highlightPath(activeId) {
        document.querySelectorAll('.connection-group').forEach(el => el.classList.add('dimmed'));
        document.querySelectorAll('.component-group').forEach(el => {
            if(el.getAttribute('data-id') !== activeId) el.classList.add('dimmed');
        });

        const connectedGroups = pathGroups[activeId] || [];
        connectedGroups.forEach(g => {
            g.classList.remove('dimmed');
            g.style.opacity = '1';
            // Speed up particles on hover
            const particle = g.querySelector('.particle');
            if(particle) particle.style.animationDuration = '0.8s';
        });
    }

    function resetHighlight() {
        document.querySelectorAll('.connection-group').forEach(el => {
            el.classList.remove('dimmed');
            el.style.opacity = '';
            el.querySelector('.particle').style.animationDuration = '';
        });
        document.querySelectorAll('.component-group').forEach(el => el.classList.remove('dimmed'));
    }

    // Initialize
    drawZones();

</script>
</body>
</html>
