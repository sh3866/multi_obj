<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMONO | Wabi-Sabi Collection</title>
    <style>
        :root {
            /* Palette */
            --bg-color: #e8e4d9;
            --ink-color: #2c2c2c;
            --accent-color: #b03a28;
            
            /* Default Kimono Palette (Indigo) */
            --kimono-base: #1c2e38;
            --kimono-dark: #0f181e;
            --kimono-light: #3a5565;
            --kimono-highlight: #5e8296;

            /* UI */
            --font-serif: "Georgia", "Times New Roman", serif;
            --font-sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--ink-color);
            font-family: var(--font-serif);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: grid;
            grid-template-rows: auto 1fr auto;
            position: relative;
        }

        /* Washi Paper Texture */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        /* --- Header & Metadata (Left Aligned) --- */
        header {
            position: relative;
            z-index: 10;
            padding: 3rem 4rem 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .brand {
            font-size: 1.4rem;
            letter-spacing: 0.15em;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--ink-color);
            display: inline-block;
            padding-bottom: 0.5rem;
            width: fit-content;
        }

        .meta-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-top: 4rem; /* Space from brand */
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .meta-label {
            font-family: var(--font-sans);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #666;
        }

        .meta-value {
            font-size: 1.1rem;
            font-style: italic;
        }

        /* --- Main Stage --- */
        main {
            position: relative;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 4rem; /* Visual balance */
        }

        .kimono-stage {
            height: 92vh;
            width: auto;
            /* Subtle shadow to lift from paper */
            filter: drop-shadow(0 25px 40px rgba(0,0,0,0.15));
            transition: transform 0.1s ease-out;
            transform-origin: center center;
        }

        /* --- Footer / Controls --- */
        footer {
            position: relative;
            z-index: 10;
            padding: 0 4rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .controls {
            display: flex;
            gap: 3rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .label {
            font-family: var(--font-sans);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #666;
        }

        /* Color Swatches */
        .swatch-group {
            display: flex;
            gap: 0.8rem;
        }

        .swatch {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .swatch:hover {
            transform: scale(1.1);
        }

        .swatch.active {
            box-shadow: 0 0 0 2px var(--bg-color), 0 0 0 4px var(--ink-color);
        }

        /* Toggle Button */
        .btn-toggle {
            background: transparent;
            border: 1px solid var(--ink-color);
            color: var(--ink-color);
            padding: 0.6rem 1.5rem;
            font-family: var(--font-sans);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.05em;
        }

        .btn-toggle:hover {
            background: var(--ink-color);
            color: var(--bg-color);
        }

        /* Vertical Text Decoration */
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-family: var(--font-sans);
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            opacity: 0.4;
            height: 180px;
            text-transform: uppercase;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header { padding: 2rem 1.5rem 0; }
            .meta-container { margin-top: 2rem; }
            footer { padding: 0 1.5rem 2rem; flex-direction: column; align-items: flex-start; gap: 2rem; }
            .controls { gap: 2rem; }
            .vertical-text { display: none; }
            .kimono-stage { height: 80vh; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            和服
            <span style="display:block; font-size:0.5rem; font-weight:normal; letter-spacing:0.1em; margin-top:4px; opacity:0.7; text-transform:none;">Kimono Atelier</span>
        </div>
        
        <div class="meta-container">
            <div class="meta-item">
                <span class="meta-label">Collection</span>
                <span class="meta-value">Autumn Fern (秋のシダ)</span>
            </div>
            <div class="meta-item">
                <span class="meta-label">Material</span>
                <span class="meta-value">Hand-woven Silk Haboté</span>
            </div>
            <div class="meta-item">
                <span class="meta-label">Dyeing Technique</span>
                <span class="meta-value">Yūzen Resist Dye</span>
            </div>
        </div>
    </header>

    <main>
        <!-- 
            SVG Redraw: 
            1. Centered vertically.
            2. T-Shaped sleeves (Sode) fully extended.
            3. Full length body (Furi).
            4. Volumetric Obi with knot.
            5. Clipped patterns.
        -->
        <svg class="kimono-stage" viewBox="0 0 800 1100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Fabric Sheen Gradient -->
                <linearGradient id="fabric-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:rgba(255,255,255,0.05)" />
                    <stop offset="50%" style="stop-color:rgba(255,255,255,0)" />
                    <stop offset="100%" style="stop-color:rgba(0,0,0,0.2)" />
                </linearGradient>

                <!-- Obi Gradient -->
                <linearGradient id="obi-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:rgba(0,0,0,0.4)" />
                    <stop offset="20%" style="stop-color:rgba(255,255,255,0.1)" />
                    <stop offset="50%" style="stop-color:rgba(0,0,0,0.1)" />
                    <stop offset="80%" style="stop-color:rgba(255,255,255,0.1)" />
                    <stop offset="100%" style="stop-color:rgba(0,0,0,0.4)" />
                </linearGradient>

                <!-- The Autumn Fern Pattern (Kochi) -->
                <pattern id="pattern-fern" x="0" y="0" width="80" height="160" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
                    <rect width="80" height="160" fill="var(--kimono-base)" />
                    <!-- Stylized Fern Motif -->
                    <g fill="var(--kimono-light)" opacity="0.5">
                        <path d="M40,20 C60,40 60,80 40,100 C20,80 20,40 40,20 Z" />
                        <path d="M40,100 C70,120 70,160 40,180 C10,160 10,120 40,100 Z" opacity="0.8"/>
                        <!-- Details -->
                        <path d="M40,20 L40,180" stroke="var(--kimono-dark)" stroke-width="1" opacity="0.5"/>
                    </g>
                    <!-- Gold Accents -->
                    <circle cx="20" cy="30" r="1.5" fill="#d4af37" opacity="0.6"/>
                    <circle cx="60" cy="110" r="1.5" fill="#d4af37" opacity="0.6"/>
                </pattern>

                <!-- Obi Pattern (Kamon/Geometric) -->
                <pattern id="pattern-obi" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
                    <rect width="30" height="30" fill="#b03a28" />
                    <path d="M15,5 L25,15 L15,25 L5,15 Z" fill="#7a2519" opacity="0.5"/>
                    <circle cx="15" cy="15" r="2" fill="#d4af37" opacity="0.8"/>
                </pattern>

                <!-- Clip Path for the Garment -->
                <clipPath id="garment-clip">
                    <!-- Left Sleeve (T-Shape) -->
                    <path d="M300,350 L100,350 L100,650 L280,650 Z" />
                    <!-- Right Sleeve (T-Shape) -->
                    <path d="M500,350 L700,350 L700,650 L520,650 Z" />
                    <!-- Left Body Panel -->
                    <path d="M350,200 L350,1050 L150,1050 L250,200 Z" />
                    <!-- Right Body Panel -->
                    <path d="M450,200 L450,1050 L650,1050 L550,200 Z" />
                </clipPath>
            </defs>

            <g id="kimono-group" transform="translate(0, 0)">
                
                <!-- 1. Base Silhouette with Pattern (Clipped) -->
                <g clip-path="url(#garment-clip)">
                    <!-- Fill with pattern -->
                    <rect x="0" y="0" width="800" height="1100" class="svg-pattern-fill" fill="url(#pattern-fern)" />
                    
                    <!-- Add Sheen/Gradient Overlay -->
                    <rect x="0" y="0" width="800" height="1100" fill="url(#fabric-sheen)" />
                    
                    <!-- Depth Shadows (Folds) -->
                    <!-- Under Obi Shadow -->
                    <rect x="100" y="580" width="600" height="15" fill="rgba(0,0,0,0.3)" />
                    <!-- Sleeve Creases -->
                    <line x1="280" y1="350" x2="280" y2="650" stroke="rgba(0,0,0,0.2)" stroke-width="2" />
                    <line x1="520" y1="350" x2="520" y2="650" stroke="rgba(0,0,0,0.2)" stroke-width="2" />
                </g>

                <!-- 2. The Obi (Sash) - Volumetric -->
                <g transform="translate(0, 500)">
                    <!-- Main Obi Band -->
                    <path d="M260,0 L540,0 L520,90 L280,90 Z" fill="url(#pattern-obi)" />
                    <!-- Obi Sheen -->
                    <path d="M260,0 L540,0 L520,90 L280,90 Z" fill="url(#obi-sheen)" />
                    
                    <!-- Obi Knot (Musubi) - Simplified Taiko Knot -->
                    <g transform="translate(400, 45)">
                        <!-- Back of knot -->
                        <path d="M-120,-20 Q-150,45 -120,110 L120,110 Q150,45 120,-20 Z" fill="#8a2015" />
                        <!-- Front of knot -->
                        <path d="M-100,-30 Q0,0 100,-30 L110,100 Q0,120 -110,100 Z" fill="#b03a28" />
                        <!-- Gold Trim -->
                        <path d="M-95,-25 L95,-25" stroke="#d4af37" stroke-width="2" opacity="0.8" />
                        <path d="M-105,95 L105,95" stroke="#d4af37" stroke-width="2" opacity="0.8" />
                    </g>
                </g>

                <!-- 3. The Collar (Eri) - Crossed V-shape -->
                <g id="collar-group">
                    <!-- Left Collar (Top Layer) -->
                    <path d="M400,180 L340,240 L340,520 L360,520 L360,240 L400,200 Z" fill="#fdfbf7" />
                    <!-- Left Collar Shadow (Inner) -->
                    <path d="M340,240 L355,250 L355,520 L360,520 Z" fill="rgba(0,0,0,0.05)" />

                    <!-- Right Collar (Bottom Layer - visible at neck) -->
                    <path d="M400,180 L460,240 L460,260 L440,240 L400,200 Z" fill="#fdfbf7" />
                    
                    <!-- Collar Intersection Shadow -->
                    <path d="M340,240 L400,200 L400,210 L350,250 Z" fill="rgba(0,0,0,0.1)" />
                </g>

            </g>
        </svg>
    </main>

    <footer>
        <div class="controls">
            <div class="control-group">
                <span class="label">Colorway</span>
                <div class="swatch-group">
                    <div class="swatch active" style="background-color: #1c2e38;" data-color="#1c2e38" data-dark="#0f181e" data-light="#3a5565" data-highlight="#5e8296"></div>
                    <div class="swatch" style="background-color: #3e2723;" data-color="#3e2723" data-dark="#281815" data-light="#5d4037" data-highlight="#8d6e63"></div>
                    <div class="swatch" style="background-color: #2e4033;" data-color="#2e4033" data-dark="#1a261e" data-light="#4a6352" data-highlight="#6b8c78"></div>
                </div>
            </div>
            <div class="control-group">
                <span class="label">Detail View</span>
                <button id="toggle-pattern" class="btn-toggle">Hide Pattern</button>
            </div>
        </div>

        <div class="vertical-text">
            Traditional Craft / 2024 / Kyoto
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const stage = document.querySelector('.kimono-stage');
            const root = document.documentElement;
            const swatches = document.querySelectorAll('.swatch');
            const toggleBtn = document.getElementById('toggle-pattern');
            const patternFill = document.querySelector('.svg-pattern-fill');
            
            let patternVisible = true;

            // 1. Subtle Parallax Effect
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth / 2 - e.clientX) / 80;
                const y = (window.innerHeight / 2 - e.clientY) / 80;
                
                // Limit rotation to keep it elegant
                stage.style.transform = `perspective(1000px) rotateY(${x}deg) rotateX(${y}deg)`;
            });

            // 2. Color Switching Logic
            swatches.forEach(swatch => {
                swatch.addEventListener('click', () => {
                    // UI State
                    swatches.forEach(s => s.classList.remove('active'));
                    swatch.classList.add('active');

                    // Apply Colors
                    const base = swatch.getAttribute('data-color');
                    const dark = swatch.getAttribute('data-dark');
                    const light = swatch.getAttribute('data-light');
                    const highlight = swatch.getAttribute('data-highlight');

                    root.style.setProperty('--kimono-base', base);
                    root.style.setProperty('--kimono-dark', dark);
                    root.style.setProperty('--kimono-light', light);
                    root.style.setProperty('--kimono-highlight', highlight);
                });
            });

            // 3. Pattern Toggle Logic
            toggleBtn.addEventListener('click', () => {
                patternVisible = !patternVisible;
                
                if (patternVisible) {
                    patternFill.setAttribute('fill', 'url(#pattern-fern)');
                    toggleBtn.textContent = "Hide Pattern";
                    toggleBtn.classList.remove('active');
                } else {
                    // Revert to solid base color
                    patternFill.setAttribute('fill', 'var(--kimono-base)');
                    toggleBtn.textContent = "Show Pattern";
                    toggleBtn.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
