<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimono | Autumn Fern Collection</title>
    <style>
        :root {
            /* Background & UI */
            --bg-color: #F2F0EB; /* Warmer, paper-like tone */
            --ink-color: #1A1A1A;
            --text-muted: #666666;
            --accent-gold: #C5A059;
            
            /* Kimono Palette (Default: Deep Indigo/Autumn) */
            --kimono-base: #182b38;
            --kimono-dark: #0d161b;
            --kimono-light: #2c4a5e;
            --kimono-accent: #8c2f39; /* Obi Red */
            
            /* Typography */
            --font-serif: "Garamond", "Georgia", "Times New Roman", serif;
            --font-sans: "Helvetica Neue", "Arial", sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--ink-color);
            font-family: var(--font-serif);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Subtle Grain Texture Overlay */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        /* --- Center Stage: The Kimono --- */
        .stage-center {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            perspective: 1500px;
        }

        .kimono-svg {
            height: 92vh; /* Occupies majority of vertical space */
            width: auto;
            /* Refined drop shadow for separation */
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.15));
            transition: transform 0.1s ease-out;
            transform-origin: center center;
        }

        /* --- Right Margin: Typography & Controls --- */
        .stage-right {
            position: absolute;
            right: 4rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to stage */
        }

        /* Vertical Typography (Tategaki) - Reduced Scale */
        .vertical-group {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            display: flex;
            margin-bottom: 3rem;
        }

        .vertical-title {
            font-size: 2rem; /* Reduced scale */
            line-height: 1.4;
            font-weight: 400;
            letter-spacing: 0.15em;
            color: var(--ink-color);
            opacity: 0.9;
            margin-left: 1.5rem;
        }

        .vertical-subtitle {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-family: var(--font-sans);
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
            border-left: 1px solid var(--ink-color);
            padding-left: 1rem;
        }

        /* Controls Area - Interactive */
        .controls-area {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px);
            padding: 1.5rem;
            border-radius: 2px;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .meta-label {
            font-family: var(--font-sans);
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            display: block;
        }

        .swatch-group {
            display: flex;
            gap: 0.8rem;
        }

        .swatch {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .swatch:hover { transform: scale(1.15); }
        .swatch.active {
            box-shadow: 0 0 0 2px var(--bg-color), 0 0 0 3px var(--ink-color);
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--ink-color);
            color: var(--ink-color);
            padding: 0.5rem 1.5rem;
            font-family: var(--font-sans);
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }

        .action-btn:hover {
            background: var(--ink-color);
            color: var(--bg-color);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .stage-right {
                right: 2rem;
            }
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .kimono-svg { height: 70vh; }
            .stage-right {
                position: relative;
                right: auto;
                top: auto;
                transform: none;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                width: 100%;
                padding: 1rem 2rem;
                margin-top: -2rem;
            }
            .vertical-group { display: none; }
            .controls-area {
                width: 100%;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                background: transparent;
                border: none;
                padding: 0;
                backdrop-filter: none;
            }
        }
    </style>
</head>
<body>

    <!-- Center Stage: Visual Focus -->
    <section class="stage-center">
        <svg class="kimono-svg" viewBox="0 0 600 1100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 1. AUTHENTIC PATTERN: Stylized Ferns & Autumn Leaves -->
                <pattern id="fern-pattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
                    <!-- Background Base -->
                    <rect width="60" height="60" fill="var(--kimono-base)" />
                    
                    <!-- Fern Group (Warabi) -->
                    <g stroke="var(--kimono-light)" stroke-width="1" fill="none" opacity="0.7">
                        <!-- Main stem -->
                        <path d="M30,5 Q35,30 30,55" />
                        <!-- Fronds Left -->
                        <path d="M30,15 Q20,10 15,15 Q20,20 30,15" fill="var(--kimono-light)" opacity="0.5" />
                        <path d="M30,25 Q20,20 15,25 Q20,30 30,25" fill="var(--kimono-light)" opacity="0.5" />
                        <path d="M30,35 Q20,30 15,35 Q20,40 30,35" fill="var(--kimono-light)" opacity="0.5" />
                        <path d="M30,45 Q20,40 15,45 Q20,50 30,45" fill="var(--kimono-light)" opacity="0.5" />
                        <!-- Fronds Right -->
                        <path d="M30,15 Q40,10 45,15 Q40,20 30,15" fill="var(--kimono-light)" opacity="0.5" />
                        <path d="M30,25 Q40,20 45,25 Q40,30 30,25" fill="var(--kimono-light)" opacity="0.5" />
                        <path d="M30,35 Q40,30 45,35 Q40,40 30,35" fill="var(--kimono-light)" opacity="0.5" />
                        <path d="M30,45 Q40,40 45,45 Q40,50 30,45" fill="var(--kimono-light)" opacity="0.5" />
                    </g>

                    <!-- Autumn Leaf Accent (Momiji) -->
                    <path d="M10,45 Q15,35 20,45 Q15,55 10,45" fill="var(--kimono-accent)" opacity="0.3" transform="rotate(45 15 45)" />

                    <!-- Muted Gold Dots (Kintsugi feel) -->
                    <circle cx="50" cy="10" r="1" fill="#C5A059" opacity="0.6"/>
                    <circle cx="10" cy="50" r="1" fill="#C5A059" opacity="0.6"/>
                </pattern>

                <!-- 2. OBI PATTERN: Distinct & Structured -->
                <pattern id="obi-pattern" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                    <rect width="30" height="30" fill="var(--kimono-accent)" />
                    <path d="M0,15 L30,15 M15,0 L15,30" stroke="#5a1b22" stroke-width="1" opacity="0.5"/>
                    <circle cx="15" cy="15" r="4" fill="#C5A059" opacity="0.4"/>
                </pattern>

                <!-- Gradients for Volume & Depth -->
                <linearGradient id="kimono-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:var(--kimono-light); stop-opacity:0.2" />
                    <stop offset="50%" style="stop-color:transparent" />
                    <stop offset="100%" style="stop-color:var(--kimono-dark); stop-opacity:0.7" />
                </linearGradient>

                <linearGradient id="obi-shine" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:rgba(0,0,0,0.4)" />
                    <stop offset="50%" style="stop-color:rgba(255,255,255,0.1)" />
                    <stop offset="100%" style="stop-color:rgba(0,0,0,0.4)" />
                </linearGradient>
            </defs>

            <g id="kimono-layer" transform="translate(0, 50)">
                
                <!-- MASTER CLIP PATH: Full Length, T-Shaped Sleeves -->
                <clipPath id="kimono-silhouette">
                    <!-- Main Body (Wide at bottom) -->
                    <path d="M260,100 
                             C240,100 230,120 230,150 
                             C220,250 200,450 180,900 
                             C170,1000 150,1050 150,1050 
                             L450,1050 
                             C450,1050 430,1000 420,900 
                             C400,450 380,250 370,150 
                             C370,120 360,100 340,100 Z" />
                    
                    <!-- Left T-Sleeve (Sode) - Furisode Style -->
                    <path d="M230,150 
                             C150,150 100,160 80,170 
                             L80,500 
                             C80,520 100,530 120,530 
                             L230,530 Z" />
                    
                    <!-- Right T-Sleeve (Sode) - Furisode Style -->
                    <path d="M370,150 
                             C450,150 500,160 520,170 
                             L520,500 
                             C520,520 500,530 480,530 
                             L370,530 Z" />
                </clipPath>

                <!-- 1. Fabric Body (Clipped) -->
                <g clip-path="url(#kimono-silhouette)">
                    <!-- Pattern Fill -->
                    <rect x="0" y="0" width="600" height="1100" fill="url(#fern-pattern)" class="pattern-target" />
                    <!-- Gradient Overlay for Volume -->
                    <rect x="0" y="0" width="600" height="1100" fill="url(#kimono-gradient)" />
                </g>

                <!-- 2. The Obi (Sash) - Expanded & Prominent -->
                <g transform="translate(0, 550)">
                    <!-- Obi Band Wrap -->
                    <path d="M195,0 L405,0 L400,120 L200,120 Z" fill="url(#obi-pattern)" />
                    <path d="M195,0 L405,0 L400,120 L200,120 Z" fill="url(#obi-shine)" />
                    
                    <!-- Obi Knot (Musubi) - Taiko Style -->
                    <g transform="translate(300, 60)">
                        <!-- Back Depth -->
                        <path d="M-120,-30 Q-150,60 -120,150 L120,150 Q150,60 120,-30 Z" fill="rgba(0,0,0,0.5)" />
                        <!-- Front Body -->
                        <path d="M-110,-20 Q0,10 110,-20 L115,130 Q0,160 -115,130 Z" fill="var(--kimono-accent)" />
                        <!-- Texture Lines on Knot -->
                        <path d="M-110,-20 Q0,10 110,-20" stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none"/>
                        <path d="M-115,130 Q0,160 115,130" stroke="rgba(0,0,0,0.2)" stroke-width="2" fill="none"/>
                        <!-- Gold Cord Detail -->
                        <path d="M0,-20 L0,140" stroke="#C5A059" stroke-width="2" stroke-dasharray="4 2" opacity="0.8"/>
                    </g>
                </g>

                <!-- 3. Collar Construction (Eri) - V-Shape with Lining -->
                <g id="collar-layer">
                    <!-- Right Collar (Under Layer - Skin Color) -->
                    <path d="M340,100 L390,100 L390,130 L350,160 L340,100 Z" fill="#FDFBF7" />
                    
                    <!-- Left Collar (Top Layer - Black/Dark) -->
                    <path d="M260,100 L310,100 L310,130 L270,160 L260,100 Z" fill="#1a1a1a" />
                    
                    <!-- Inner Collar Shadow (Depth) -->
                    <path d="M260,100 L310,100 L310,110 L270,160 L260,100 Z" fill="rgba(0,0,0,0.1)" />
                </g>

                <!-- 4. Hemline Details (Nagajuban peek) -->
                <path d="M155,1020 L445,1020" stroke="#FDFBF7" stroke-width="4" opacity="0.8" />
                <path d="M150,1045 L450,1045" stroke="#FDFBF7" stroke-width="2" opacity="0.5" />
            </g>
        </svg>
    </section>

    <!-- Right Margin: Typography & Info -->
    <section class="stage-right">
        <div class="vertical-group">
            <div class="vertical-title">
                秋のシダ
                <span style="font-size: 0.5em; opacity: 0.7; margin-left: 0.5rem;">Autumn Fern</span>
            </div>
            <div class="vertical-subtitle">
                Traditional Craft / Kyoto
            </div>
        </div>

        <div class="controls-area">
            <div>
                <span class="meta-label">Colorway</span>
                <div class="swatch-group">
                    <!-- Indigo (Default) -->
                    <div class="swatch active" style="background-color: #182b38;" 
                         data-base="#182b38" data-dark="#0d161b" data-light="#2c4a5e" data-accent="#8c2f39"></div>
                    <!-- Deep Brown -->
                    <div class="swatch" style="background-color: #3e2723;" 
                         data-base="#3e2723" data-dark="#281815" data-light="#5d4037" data-accent="#6d4c41"></div>
                    <!-- Forest -->
                    <div class="swatch" style="background-color: #2e4033;" 
                         data-base="#2e4033" data-dark="#1a261e" data-light="#4a6352" data-accent="#558b2f"></div>
                </div>
            </div>
            
            <button id="toggle-pattern" class="action-btn">Hide Pattern</button>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const svg = document.querySelector('.kimono-svg');
            const root = document.documentElement;
            const swatches = document.querySelectorAll('.swatch');
            const toggleBtn = document.getElementById('toggle-pattern');
            const patternTarget = document.querySelector('.pattern-target');
            
            let patternVisible = true;

            // 1. Subtle Parallax Interaction
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth / 2 - e.clientX) / 150;
                const y = (window.innerHeight / 2 - e.clientY) / 150;
                
                // Subtle rotation and translation
                svg.style.transform = `perspective(1500px) rotateY(${x}deg) rotateX(${-y}deg) translateY(${y*0.5}px)`;
            });

            // 2. Color Switching Logic
            swatches.forEach(swatch => {
                swatch.addEventListener('click', () => {
                    // Update UI
                    swatches.forEach(s => s.classList.remove('active'));
                    swatch.classList.add('active');

                    // Update CSS Variables
                    root.style.setProperty('--kimono-base', swatch.dataset.base);
                    root.style.setProperty('--kimono-dark', swatch.dataset.dark);
                    root.style.setProperty('--kimono-light', swatch.dataset.light);
                    root.style.setProperty('--kimono-accent', swatch.dataset.accent);
                });
            });

            // 3. Pattern Toggle Logic
            toggleBtn.addEventListener('click', () => {
                patternVisible = !patternVisible;
                
                if (patternVisible) {
                    patternTarget.setAttribute('fill', 'url(#fern-pattern)');
                    toggleBtn.textContent = "Hide Pattern";
                } else {
                    patternTarget.setAttribute('fill', 'var(--kimono-base)');
                    toggleBtn.textContent = "Show Pattern";
                }
            });
        });
    </script>
</body>
</html>
