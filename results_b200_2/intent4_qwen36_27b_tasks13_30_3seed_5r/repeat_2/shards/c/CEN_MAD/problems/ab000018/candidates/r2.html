<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crossy Road - Design Revision</title>
    <style>
        :root {
            --ui-bg: rgba(20, 20, 20, 0.6);
            --ui-border: rgba(255, 255, 255, 0.2);
            --ui-accent: #ffcc00;
            --ui-text: #ffffff;
            --pad-color: rgba(255, 255, 255, 0.15);
            --pad-active: rgba(255, 255, 255, 0.4);
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #333;
            /* Use a system font stack that looks pixelated/clean */
            font-family: "Courier New", Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* Canvas Layer */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* HUD: Top Corners */
        .hud-top {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
            pointer-events: none;
        }

        .hud-box {
            background: var(--ui-bg);
            border: 2px solid var(--ui-border);
            backdrop-filter: blur(4px);
            padding: 8px 16px;
            border-radius: 8px;
            color: var(--ui-text);
            text-align: center;
            min-width: 80px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .hud-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
            margin-bottom: 2px;
            font-weight: bold;
        }

        .hud-val {
            font-size: 28px;
            font-weight: 900;
            line-height: 1;
            color: #fff;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        .hud-val.best {
            color: var(--ui-accent);
        }

        /* Controls: Bottom Left, Compact */
        .controls-area {
            position: absolute;
            bottom: 30px;
            left: 30px;
            pointer-events: auto;
            width: 140px;
            height: 140px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        
        .controls-area:hover, .controls-area:active {
            opacity: 1;
        }

        .d-pad {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .btn {
            position: absolute;
            width: 44px;
            height: 44px;
            background: var(--pad-color);
            border: 1px solid var(--ui-border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(2px);
        }

        .btn:active, .btn.active {
            transform: scale(0.9);
            background: var(--pad-active);
            border-color: #fff;
        }

        /* D-Pad Layout */
        .btn-up { top: 0; left: 48px; }
        .btn-left { top: 48px; left: 0; }
        .btn-down { top: 48px; left: 48px; }
        .btn-right { top: 48px; left: 96px; }

        /* Arrows */
        .arrow {
            width: 0; 
            height: 0; 
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 12px solid #fff;
            filter: drop-shadow(0 1px 1px rgba(0,0,0,0.5));
        }
        .btn-up .arrow { transform: rotate(0deg); margin-top: 2px; }
        .btn-down .arrow { transform: rotate(180deg); margin-bottom: 2px; }
        .btn-left .arrow { transform: rotate(-90deg); margin-left: 2px; }
        .btn-right .arrow { transform: rotate(90deg); margin-right: 2px; }

    </style>
</head>
<body>

    <div id="ui-layer">
        <!-- HUD -->
        <div class="hud-top">
            <div class="hud-box">
                <div class="hud-label">Score</div>
                <div class="hud-val" id="score">0</div>
            </div>
            <div class="hud-box">
                <div class="hud-label">Best</div>
                <div class="hud-val best" id="best">12</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls-area">
            <div class="d-pad">
                <div class="btn btn-up" id="btn-up" ontouchstart="handleInput(0, -1, event)" onmousedown="handleInput(0, -1, event)">
                    <div class="arrow"></div>
                </div>
                <div class="btn btn-left" id="btn-left" ontouchstart="handleInput(-1, 0, event)" onmousedown="handleInput(-1, 0, event)">
                    <div class="arrow"></div>
                </div>
                <div class="btn btn-down" id="btn-down" ontouchstart="handleInput(0, 1, event)" onmousedown="handleInput(0, 1, event)">
                    <div class="arrow"></div>
                </div>
                <div class="btn btn-right" id="btn-right" ontouchstart="handleInput(1, 0, event)" onmousedown="handleInput(1, 0, event)">
                    <div class="arrow"></div>
                </div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        /**
         * REVISED DESIGN IMPLEMENTATION
         * Focus: 2.5D Perspective, Clear Legibility, Playful Aesthetics
         */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height;

        // --- Configuration ---
        const CONFIG = {
            // Perspective setup
            fov: 300, 
            blockSize: 100,
            lanes: 20,
            drawDistance: 25,
            horizonY: 0.35, // Horizon at 35% of screen height
            
            // Color Palette
            colors: {
                skyTop: [64, 158, 255],   // Vibrant Blue
                skyBot: [160, 224, 255],  // Light Blue
                grassLight: [150, 215, 80], // Bright Green
                grassDark: [110, 180, 50],  // Darker Green
                road: [60, 60, 65],       // Asphalt
                roadLine: [255, 255, 255], // White dashed
                water: [41, 128, 185],    // Deep Blue
                waterHighlight: [52, 152, 219],
                treeTrunk: [139, 69, 19],
                treeLeaves: [46, 204, 113],
                shadow: 'rgba(0,0,0,0.2)'
            }
        };

        // --- State ---
        let camera = { z: 0 };
        let player = { 
            x: 0, y: 0, z: 0, 
            targetY: 0, 
            squish: 1, 
            rot: 0, 
            targetRot: 0
        };
        let lanes = [];
        let score = 0;
        let time = 0;

        // --- Resize Handling ---
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            CONFIG.horizonY = height * 0.35;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Math Helpers ---
        
        // 2.5D Projection Logic
        const project = (x, y, z) => {
            const zRel = z - camera.z;
            if (zRel < -CONFIG.fov + 50) return null;

            const scale = CONFIG.fov / (CONFIG.fov + zRel);
            
            const x2d = (x * scale) + (width / 2);
            const y2d = CONFIG.horizonY - (y * scale) + (height / 2); 

            return { x: x2d, y: y2d, scale: scale };
        };

        const lerp = (a, b, t) => a + (b - a) * t;
        const rand = (min, max) => Math.random() * (max - min) + min;

        // --- Classes ---

        class Lane {
            constructor(zIndex) {
                this.z = zIndex * CONFIG.blockSize;
                this.type = this.determineType(zIndex);
                this.vehicles = [];
                this.logs = [];
                this.decorations = [];

                // Content Generation
                if (this.type === 'road') {
                    const count = Math.floor(rand(2, 4));
                    const direction = (Math.floor(zIndex / 2) % 2 === 0) ? 1 : -1;
                    
                    for(let i=0; i<count; i++) {
                        this.vehicles.push({
                            x: rand(-1500, 1500),
                            speed: rand(5, 9) * direction,
                            color: ['#e74c3c', '#f39c12', '#3498db', '#9b59b6'][Math.floor(Math.random()*4)],
                            width: rand(70, 100),
                            height: rand(40, 50),
                            depth: rand(50, 60)
                        });
                    }
                } else if (this.type === 'water') {
                    const count = Math.floor(rand(2, 3));
                    const direction = (zIndex % 2 === 0) ? 1 : -1;
                    for(let i=0; i<count; i++) {
                        this.logs.push({
                            x: rand(-1500, 1500),
                            speed: rand(1, 3) * direction,
                            length: rand(250, 450)
                        });
                    }
                } else {
                    // Grass decorations
                    const count = Math.floor(rand(4, 8));
                    for(let i=0; i<count; i++) {
                        this.decorations.push({
                            x: rand(-1200, 1200),
                            type: Math.random() > 0.6 ? 'tree' : 'bush',
                            scale: rand(0.8, 1.2)
                        });
                    }
                }
            }

            determineType(z) {
                if (z < 5) return 'grass';
                // Rhythmic Pattern: Grass -> Road -> Road -> Water -> Grass
                const mod = z % 5;
                if (mod === 1 || mod === 2) return 'road';
                if (mod === 3) return 'water';
                return 'grass';
            }

            update() {
                this.vehicles.forEach(v => {
                    v.x += v.speed;
                    if (v.speed > 0 && v.x > 2000) v.x = -2000;
                    if (v.speed < 0 && v.x < -2000) v.x = 2000;
                });
                this.logs.forEach(l => {
                    l.x += l.speed;
                    if (l.speed > 0 && l.x > 2000) l.x = -2000;
                    if (l.speed < 0 && l.x < -2000) l.x = 2000;
                });
            }

            draw() {
                if (this.z - camera.z < -CONFIG.fov || this.z - camera.z > CONFIG.drawDistance * CONFIG.blockSize) return;

                const w = 3000; 
                const pStart = project(-w, 0, this.z);
                const pEnd = project(w, 0, this.z);
                const pStartNext = project(-w, 0, this.z + CONFIG.blockSize);
                const pEndNext = project(w, 0, this.z + CONFIG.blockSize);

                if (!pStart || !pEnd) return;

                ctx.beginPath();
                ctx.moveTo(pStart.x, pStart.y);
                ctx.lineTo(pEnd.x, pEnd.y);
                ctx.lineTo(pEndNext.x, pEndNext.y);
                ctx.lineTo(pStartNext.x, pStartNext.y);
                ctx.closePath();

                // Base Colors
                if (this.type === 'grass') {
                    ctx.fillStyle = (Math.floor(this.z / CONFIG.blockSize) % 2 === 0) 
                        ? `rgb(${CONFIG.colors.grassLight.join(',')})` 
                        : `rgb(${CONFIG.colors.grassDark.join(',')})`;
                } else if (this.type === 'road') {
                    ctx.fillStyle = `rgb(${CONFIG.colors.road.join(',')})`;
                } else if (this.type === 'water') {
                    ctx.fillStyle = `rgb(${CONFIG.colors.water.join(',')})`;
                }
                ctx.fill();

                // Details
                if (this.type === 'road') {
                    ctx.beginPath();
                    const lineStart = project(-w/3, 0, this.z);
                    const lineEnd = project(w/3, 0, this.z);
                    ctx.moveTo(lineStart.x, lineStart.y);
                    ctx.lineTo(lineEnd.x, lineEnd.y);
                    ctx.strokeStyle = `rgba(255, 255, 255, 0.4)`;
                    ctx.lineWidth = 4 * pStart.scale;
                    ctx.setLineDash([30 * pStart.scale, 30 * pStart.scale]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                } else if (this.type === 'water') {
                    // Simple wave lines
                    ctx.strokeStyle = `rgba(255, 255, 255, 0.15)`;
                    ctx.lineWidth = 2 * pStart.scale;
                    for(let i=-1; i<=1; i+=0.5) {
                        const s = project(i * (w/4), 0, this.z);
                        const e = project(i * (w/4) + 150, 0, this.z);
                        ctx.beginPath();
                        ctx.moveTo(s.x, s.y);
                        ctx.lineTo(e.x, e.y);
                        ctx.stroke();
                    }
                }
            }
        }

        // --- Drawing Helpers ---
        
        // Draw a 3D Cuboid
        function drawBox(x, y, z, w, h, d, color) {
            const p = project(x, y, z);
            if(!p) return;
            const scale = p.scale;
            
            // Dimensions
            const hw = w * scale / 2;
            const hh = h * scale;
            const hd = d * scale / 2;

            // Color Logic (Simple shading)
            const baseColor = color;
            const topColor = adjustColor(baseColor, 30); // Lighter
            const sideColor = adjustColor(baseColor, -20); // Darker

            // 1. Top Face
            ctx.fillStyle = topColor;
            ctx.beginPath();
            ctx.moveTo(p.x - hw, p.y - hh); 
            ctx.lineTo(p.x - hw + hd, p.y - hh - hd); 
            ctx.lineTo(p.x + hw + hd, p.y - hh - hd); 
            ctx.lineTo(p.x + hw, p.y - hh); 
            ctx.fill();

            // 2. Front Face
            ctx.fillStyle = baseColor;
            ctx.fillRect(p.x - hw, p.y - hh, hw*2, hh);

            // 3. Right Face (Shadow)
            ctx.fillStyle = sideColor;
            ctx.beginPath();
            ctx.moveTo(p.x + hw, p.y - hh);
            ctx.lineTo(p.x + hw + hd, p.y - hh - hd);
            ctx.lineTo(p.x + hw + hd, p.y - hd);
            ctx.lineTo(p.x + hw, p.y);
            ctx.fill();
        }

        // Helper for color adjustment
        function adjustColor(hex, amount) {
            // Assuming hex is RGB array or string
            if (Array.isArray(hex)) {
                return `rgb(${hex.map(c => Math.min(255, Math.max(0, c + amount))).join(',')})`;
            }
            // Fallback for simple hex strings
            return hex; 
        }

        // --- Input Handling ---
        function handleInput(dx, dy, event) {
            if(event) event.preventDefault();
            game.movePlayer(dx, dy);
        }

        // --- The Game Object ---

        const game = {
            init: () => {
                for(let i=0; i<CONFIG.drawDistance; i++) {
                    lanes.push(new Lane(i));
                }
                
                window.addEventListener('keydown', (e) => {
                    if(e.key === 'ArrowUp' || e.key === 'w') game.movePlayer(0, -1);
                    if(e.key === 'ArrowDown' || e.key === 's') game.movePlayer(0, 1);
                    if(e.key === 'ArrowLeft' || e.key === 'a') game.movePlayer(-1, 0);
                    if(e.key === 'ArrowRight' || e.key === 'd') game.movePlayer(1, 0);
                });

                requestAnimationFrame(game.loop);
            },

            movePlayer: (dx, dy) => {
                const currentLaneIdx = Math.round(player.z / CONFIG.blockSize);
                
                const btnId = dy === -1 ? 'btn-up' : dy === 1 ? 'btn-down' : dx === -1 ? 'btn-left' : 'btn-right';
                const btn = document.getElementById(btnId);
                if(btn) {
                    btn.classList.add('active');
                    setTimeout(() => btn.classList.remove('active'), 150);
                }

                if (dy === -1) { // Forward
                    player.z += CONFIG.blockSize;
                    player.squish = 0.6; 
                    score++;
                    document.getElementById('score').innerText = score;
                    camera.z += CONFIG.blockSize;
                    lanes.push(new Lane(lanes.length));
                    lanes.shift(); 
                } 
                else if (dy === 1) { // Back
                    if(player.z > 0) {
                        player.z -= CONFIG.blockSize;
                        camera.z -= CONFIG.blockSize;
                        player.squish = 0.6;
                    }
                }
                else if (dx !== 0) { // Side
                    player.x += dx * 100;
                    if(player.x > 1000) player.x = 1000;
                    if(player.x < -1000) player.x = -1000;
                    
                    player.targetRot = dx * 0.3;
                    player.squish = 0.7;
                }
            },

            update: () => {
                time += 16;
                
                player.squish = lerp(player.squish, 1, 0.1);
                player.rot = lerp(player.rot, player.targetRot, 0.1);
                player.targetRot = lerp(player.targetRot, 0, 0.05);

                lanes.forEach(lane => lane.update());

                // Water Logic
                const currentLane = lanes.find(l => Math.abs(l.z - player.z) < 10);
                if (currentLane && currentLane.type === 'water') {
                    let onLog = false;
                    currentLane.logs.forEach(log => {
                        if (player.x > log.x - log.length/2 && player.x < log.x + log.length/2) {
                            onLog = true;
                            player.x += log.speed; 
                        }
                    });
                }
            },

            draw: () => {
                // 1. Sky
                const grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, `rgb(${CONFIG.colors.skyTop.join(',')})`);
                grad.addColorStop(1, `rgb(${CONFIG.colors.skyBot.join(',')})`);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                // 2. Prepare Draw List
                let drawables = [];

                lanes.forEach(l => {
                    drawables.push({ type: 'lane', obj: l, z: l.z });
                    l.decorations.forEach(d => drawables.push({ type: 'deco', obj: d, z: l.z }));
                    l.vehicles.forEach(v => drawables.push({ type: 'vehicle', obj: v, z: l.z }));
                    l.logs.forEach(lg => drawables.push({ type: 'log', obj: lg, z: l.z }));
                });

                drawables.push({ type: 'player', z: player.z });
                drawables.sort((a, b) => a.z - b.z);

                // 3. Render Loop
                drawables.forEach(item => {
                    if (item.type === 'lane') item.obj.draw();
                    
                    if (item.type === 'deco') {
                        const d = item.obj;
                        if (d.type === 'tree') {
                            // Shadow
                            const p = project(d.x, 0, item.z);
                            if(p) {
                                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                                ctx.beginPath();
                                ctx.ellipse(p.x, p.y, 40*p.scale, 20*p.scale, 0, 0, Math.PI*2);
                                ctx.fill();
                            }

                            drawBox(d.x, 0, item.z, 20, 70, 20, CONFIG.colors.treeTrunk);
                            drawBox(d.x, 70, item.z, 70, 70, 70, CONFIG.colors.treeLeaves);
                            drawBox(d.x, 110, item.z, 50, 50, 50, CONFIG.colors.treeLeaves);
                        } else {
                            drawBox(d.x, 0, item.z, 40, 30, 40, CONFIG.colors.treeLeaves);
                        }
                    }

                    if (item.type === 'vehicle') {
                        const v = item.obj;
                        // Shadow
                        const p = project(v.x, 0, item.z);
                        if(p) {
                            ctx.fillStyle = 'rgba(0,0,0,0.2)';
                            ctx.beginPath();
                            ctx.ellipse(p.x, p.y, (v.width/2)*p.scale, (v.width/4)*p.scale, 0, 0, Math.PI*2);
                            ctx.fill();
                        }

                        // Body
                        drawBox(v.x, 0, item.z, v.width, v.height, v.depth, v.color);
                        // Roof (Lighter)
                        drawBox(v.x, v.height, item.z, v.width * 0.8, v.height * 0.6, v.depth * 0.8, adjustColor(v.color, 40));
                    }

                    if (item.type === 'log') {
                        const l = item.obj;
                        // Shadow
                        const p = project(l.x, 0, item.z);
                        if(p) {
                            ctx.fillStyle = 'rgba(0,0,0,0.2)';
                            ctx.beginPath();
                            ctx.ellipse(p.x, p.y, (l.length/2)*p.scale, 15*p.scale, 0, 0, Math.PI*2);
                            ctx.fill();
                        }
                        drawBox(l.x, 0, item.z, l.length, 25, 25, '#8d6e63');
                    }

                    if (item.type === 'player') {
                        const p = project(player.x, 0, player.z);
                        if(!p) return;
                        
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        
                        // Shadow
                        ctx.fillStyle = 'rgba(0,0,0,0.3)';
                        ctx.beginPath();
                        ctx.ellipse(0, 0, 25*p.scale, 12*p.scale, 0, 0, Math.PI*2);
                        ctx.fill();

                        // Squish Scale
                        const scaleY = player.squish;
                        const scaleX = 1 + (1 - player.squish) * 0.6;
                        ctx.scale(scaleX, scaleY);

                        // --- Drawing the "Charming Animal" (Chicken) ---
                        const s = p.scale;
                        
                        // Legs
                        ctx.fillStyle = '#f39c12';
                        ctx.fillRect(-10*s, -25*s, 8*s, 25*s);
                        ctx.fillRect(2*s, -25*s, 8*s, 25*s);

                        // Body (White Cube)
                        drawBoxLocal(0, -25*s, 0, 40*s, 40*s, 40*s, '#FFFFFF');

                        // Comb
                        ctx.fillStyle = '#e74c3c';
                        ctx.fillRect(5*s, -70*s, 10*s, 10*s);

                        // Beak
                        ctx.fillStyle = '#f1c40f';
                        ctx.beginPath();
                        ctx.moveTo(20*s, -50*s);
                        ctx.lineTo(30*s, -45*s);
                        ctx.lineTo(20*s, -40*s);
                        ctx.fill();

                        // Eyes
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(15*s, -55*s, 3*s, 0, Math.PI*2); 
                        ctx.arc(15*s, -45*s, 3*s, 0, Math.PI*2); 
                        ctx.fill();

                        ctx.restore();
                    }
                });
            },

            loop: () => {
                game.update();
                game.draw();
                requestAnimationFrame(game.loop);
            }
        };

        // Helper to draw a box locally (relative to translated context)
        function drawBoxLocal(x, y, z, w, h, d, color) {
            // Top
            ctx.fillStyle = adjustColor(color, 30);
            ctx.fillRect(x - w/2, y - h, w, h/2); 
            
            // Front
            ctx.fillStyle = color;
            ctx.fillRect(x - w/2, y - h, w, h);
            
            // Side
            ctx.fillStyle = adjustColor(color, -20);
            ctx.fillRect(x + w/2, y - h, d/2, h);
        }

        // Start
        game.init();

    </script>
</body>
</html>
