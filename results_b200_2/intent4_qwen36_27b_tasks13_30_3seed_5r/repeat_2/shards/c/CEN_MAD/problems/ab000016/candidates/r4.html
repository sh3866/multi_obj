<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON DESERT RUNNER</title>
<style>
    :root {
        /* Design System: Modern-Retro / Synthwave */
        --font-stack: 'Courier New', 'Lucida Console', monospace;
        
        /* Palette: High Contrast */
        --sky-top: #1a0b2e;      /* Deep Dusk Purple */
        --sky-horizon: #ff007f;  /* Neon Magenta */
        --sky-bottom: #00f0ff;   /* Cyan */
        
        --ground-top: #ff7b00;   /* Terracotta/Burnt Orange */
        --ground-mid: #cc5200;
        --ground-bottom: #5a1a00;
        
        --silhouette: #10051c;   /* Near black for sharp contrast */
        --ui-color: #ffffff;
        --ui-accent: #00f0ff;
        
        --ground-height: 14vh;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: none; /* Critical for pixel look */
    }

    body {
        background-color: #000;
        color: var(--ui-color);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* --- LAYOUT & ATMOSPHERE --- */
    
    .game-container {
        position: relative;
        width: 100%;
        height: 100%;
        max-width: 1200px; /* Widescreen aspect constraint */
        overflow: hidden;
        /* Gradient Sky: Deep Purple to Cyan */
        background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-horizon) 60%, var(--sky-bottom) 100%);
    }

    /* The Sun - Pixelated Vector */
    .sun {
        position: absolute;
        top: 12%;
        right: 18%;
        width: 140px;
        height: 140px;
        z-index: 1;
        opacity: 0.8;
        /* Using a stepped polygon to simulate a pixelated circle */
        clip-path: polygon(
            20% 0%, 80% 0%, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0% 80%, 0% 20%
        );
        background: #ffcc00;
        box-shadow: 0 0 40px #ffcc00;
    }
    /* Sun stripes (Synthwave style) */
    .sun::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 10px,
            var(--sky-top) 10px,
            var(--sky-top) 15px
        );
    }

    /* --- GROUND & HORIZON --- */
    
    .ground {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: var(--ground-height);
        z-index: 10;
        /* Hard Horizon Line */
        border-top: 4px solid var(--silhouette);
        /* Earth tones gradient */
        background: linear-gradient(to bottom, var(--ground-top), var(--ground-bottom));
    }

    /* Moving Ground Texture (Grid Lines) */
    .ground-texture {
        position: absolute;
        top: 0;
        left: 0;
        width: 200%;
        height: 100%;
        background-image: 
            linear-gradient(90deg, rgba(0,0,0,0.2) 2px, transparent 2px),
            linear-gradient(0deg, rgba(0,0,0,0.2) 2px, transparent 2px);
        background-size: 40px 40px;
        /* Perspective trick */
        transform: perspective(200px) rotateX(20deg) scale(1.5);
        transform-origin: bottom;
        animation: moveGround 1s linear infinite;
    }

    @keyframes moveGround {
        from { transform: perspective(200px) rotateX(20deg) scale(1.5) translateX(0); }
        to { transform: perspective(200px) rotateX(20deg) scale(1.5) translateX(-40px); }
    }

    /* --- HUD --- */
    .hud {
        position: absolute;
        top: 20px;
        right: 30px;
        z-index: 30;
        text-align: right;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        pointer-events: none;
    }

    .hud-row {
        display: flex;
        align-items: baseline;
        justify-content: flex-end;
        gap: 10px;
    }

    .score-label {
        font-size: 0.8rem;
        color: rgba(255,255,255,0.6);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .score-value {
        font-size: 2rem;
        font-weight: 900;
        color: var(--ui-color);
        text-shadow: 2px 2px 0px var(--silhouette);
        font-variant-numeric: tabular-nums;
    }

    .high-score {
        font-size: 1rem;
        color: var(--ui-accent);
        margin-top: 4px;
        text-shadow: 1px 1px 0px var(--silhouette);
    }

    .speed-meter {
        position: absolute;
        top: 25px;
        left: 30px;
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 8px;
        pointer-events: none;
    }
    
    .speed-bar {
        width: 60px;
        height: 8px;
        background: rgba(0,0,0,0.3);
        border: 1px solid var(--silhouette);
    }
    .speed-fill {
        width: 30%;
        height: 100%;
        background: var(--ui-accent);
    }

    /* --- SPRITES & ACTOR --- */
    .viewport {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 5;
    }

    .sprite {
        position: absolute;
        bottom: var(--ground-height);
        /* The Pixel Rule: Force aliased rendering */
        image-rendering: pixelated; 
        image-rendering: crisp-edges;
        will-change: transform;
    }

    /* Hero: Dino */
    .dino {
        left: 15%;
        width: 120px; /* Significantly larger */
        height: 120px;
        z-index: 20;
    }

    .dino svg {
        fill: var(--silhouette);
        width: 100%;
        height: 100%;
        /* Hard shadow */
        filter: drop-shadow(4px 4px 0px rgba(255, 255, 255, 0.2));
    }

    .dino.running svg {
        animation: bob 0.2s infinite alternate;
    }
    
    @keyframes bob {
        from { transform: translateY(0); }
        to { transform: translateY(-3px); }
    }

    /* Obstacles */
    .obstacle svg {
        fill: var(--silhouette);
        width: 100%;
        height: 100%;
        filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.2));
    }

    /* --- INSTRUCTIONS (Above Actor) --- */
    .instruction-group {
        position: absolute;
        bottom: calc(var(--ground-height) + 140px); /* Directly above dino */
        left: 15%;
        width: 120px;
        text-align: center;
        z-index: 30;
        pointer-events: none;
        transition: opacity 0.3s;
    }

    .instruction-text {
        font-size: 0.9rem;
        font-weight: 800;
        color: var(--ui-color);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
        text-shadow: 2px 2px 0px var(--silhouette);
        animation: blink 1s infinite steps(2, start);
    }

    /* Pixel Art Keycap */
    .key-cap {
        display: inline-block;
        width: 60px;
        height: 28px;
        background: #eee;
        border: 2px solid var(--silhouette);
        border-radius: 2px;
        position: relative;
        box-shadow: 4px 4px 0px rgba(0,0,0,0.4);
    }
    
    .key-cap::after {
        content: 'SPACE';
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        font-size: 0.7rem;
        font-weight: 900;
        color: #333;
        letter-spacing: 0.5px;
    }

    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
    }

    /* --- CRT OVERLAY --- */
    .scanlines {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(
            to bottom,
            rgba(255,255,255,0),
            rgba(255,255,255,0) 50%,
            rgba(0,0,0,0.1) 50%,
            rgba(0,0,0,0.1)
        );
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 100;
        mix-blend-mode: overlay;
    }

</style>
</head>
<body>

    <div class="scanlines"></div>

    <div class="game-container">
        <!-- Background -->
        <div class="sun"></div>

        <!-- HUD -->
        <div class="speed-meter">
            <div class="speed-bar"><div class="speed-fill" id="speedFill"></div></div>
            <span class="score-label" style="color:white; text-shadow:1px 1px 0 #000">SPD</span>
        </div>

        <div class="hud">
            <div class="hud-row">
                <span class="score-label">Score</span>
                <span class="score-value" id="score">0000</span>
            </div>
            <div class="high-score">HI <span id="highScore">0000</span></div>
        </div>

        <!-- VIEWPORT -->
        <div class="viewport" id="gameArea">
            
            <!-- Instruction Group (Above Dino) -->
            <div class="instruction-group" id="instructionGroup">
                <div class="instruction-text">Press Space</div>
                <div class="key-cap"></div>
            </div>

            <!-- Player: Dino -->
            <div class="sprite dino" id="dino">
                <!-- Pixel Perfect SVG Path -->
                <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
                    <path d="
                        M20 4 H28 V8 H26 V12 H24 V16 H22 V20 H28 V24 H26 V28 H22 V24 H18 V28 H14 V24 H10 V20 H6 V16 H10 V12 H14 V8 H18 V4 Z
                        M26 6 H28 V8 H26 Z
                    " />
                </svg>
            </div>

            <!-- Obstacles Container -->
            <div id="obstacles"></div>

            <!-- Ground -->
            <div class="ground">
                <div class="ground-texture"></div>
            </div>
        </div>
    </div>

<script>
    // --- CONFIGURATION ---
    const GRAVITY = 0.65;
    const JUMP_FORCE = 14;
    const GAME_SPEED_START = 7;
    const SPAWN_RATE = 1400; 
    
    // --- STATE ---
    let isPlaying = false;
    let isGameOver = false;
    let score = 0;
    let highScore = 0;
    let gameSpeed = GAME_SPEED_START;
    let lastTime = 0;
    let spawnTimer = 0;
    let obstacles = [];
    let animationFrameId;
    let dinoY = 0;
    let dinoVelocity = 0;

    // --- DOM ELEMENTS ---
    const dino = document.getElementById('dino');
    const gameArea = document.getElementById('gameArea');
    const obstacleContainer = document.getElementById('obstacles');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const speedFill = document.getElementById('speedFill');
    const instructionGroup = document.getElementById('instructionGroup');

    // --- ASSETS (SVG TEMPLATES) ---
    
    // Cactus (Pixelated style)
    const cactusSVG = `
        <svg viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
            <path d="M8 32 V12 H4 V8 H8 V0 H12 V8 H16 V4 H20 V12 H16 V32 Z" />
        </svg>
    `;
    
    // Pterodactyl (Flying)
    const birdSVG = `
        <svg viewBox="0 0 32 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
            <path d="M0 8 L8 8 L12 12 L16 8 H24 V10 H20 L16 14 L12 10 L8 10 Z M4 8 L8 2 L12 8 Z" />
        </svg>
    `;

    // --- GAME LOOP ---
    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const deltaTime = timestamp - lastTime;
        lastTime = timestamp;

        if (isPlaying && !isGameOver) {
            updatePhysics(deltaTime);
            updateObstacles(deltaTime);
            spawnManager(deltaTime);
            draw();
        }

        animationFrameId = requestAnimationFrame(gameLoop);
    }

    // --- PHYSICS ---
    function updatePhysics(dt) {
        dinoY += dinoVelocity;
        dinoVelocity -= GRAVITY;

        // Ground collision
        if (dinoY <= 0) {
            dinoY = 0;
            dinoVelocity = 0;
            dino.classList.remove('jumping');
        } else {
            dino.classList.add('jumping');
        }
    }

    // --- OBSTACLES ---
    function spawnManager(dt) {
        spawnTimer += dt;
        // Spawn rate depends on speed
        const currentRate = SPAWN_RATE / (gameSpeed / GAME_SPEED_START);
        
        if (spawnTimer > currentRate) {
            spawnTimer = 0;
            if(Math.random() > 0.2) createObstacle();
        }
    }

    function createObstacle() {
        const type = Math.random() > 0.6 ? 'bird' : 'cactus';
        const el = document.createElement('div');
        el.classList.add('sprite', 'obstacle');
        
        el.innerHTML = type === 'cactus' ? cactusSVG : birdSVG;
        el.style.left = '0px'; 
        
        obstacleContainer.appendChild(el);

        // Define hitboxes and properties
        obstacles.push({
            element: el,
            x: window.innerWidth + 50, // Start off screen right
            y: 0, 
            width: type === 'bird' ? 40 : 20, // Visual width approx
            height: type === 'bird' ? 20 : 32,
            type: type
        });
    }

    function updateObstacles(dt) {
        obstacles.forEach((obs, index) => {
            obs.x -= gameSpeed;
            
            // Cleanup
            if (obs.x < -100) {
                obs.element.remove();
                obstacles.splice(index, 1);
                score += 10;
                scoreEl.innerText = score.toString().padStart(4, '0');
                
                // Speed progression
                if(score % 50 === 0) {
                    gameSpeed += 0.5;
                    updateSpeedUI();
                }
            }

            // Collision Logic
            // Dino is fixed at left 15%, width 120px.
            // We need to calculate absolute pixel positions for collision.
            const dinoRect = {
                l: (gameArea.clientWidth * 0.15) + 20, // Padding
                r: (gameArea.clientWidth * 0.15) + 100,
                b: dinoY, // Relative to ground line
                t: 120 + dinoY
            };

            // Obstacle rect
            // Bird needs to be higher up
            const obsHeightOffset = obs.type === 'bird' ? 80 : 0;
            
            const obsRect = {
                l: obs.x + 5,
                r: obs.x + obs.width + 10,
                b: obsHeightOffset,
                t: obsHeightOffset + obs.height
            };

            // AABB Check
            if (
                dinoRect.l < obsRect.r &&
                dinoRect.r > obsRect.l &&
                dinoRect.b < obsRect.t &&
                dinoRect.t > obsRect.b
            ) {
                gameOver();
            }
        });
    }

    // --- RENDER ---
    function draw() {
        // Render Dino Jump
        dino.style.bottom = `calc(var(--ground-height) + ${dinoY}px)`;

        // Render Obstacles
        obstacles.forEach(obs => {
            obs.element.style.transform = `translateX(${obs.x}px)`;
            // If bird, position higher
            if(obs.type === 'bird') {
                obs.element.style.bottom = `calc(var(--ground-height) + 80px)`;
            } else {
                obs.element.style.bottom = `var(--ground-height)`;
            }
        });
    }

    function updateSpeedUI() {
        // Cap visual bar at 100%
        const percent = Math.min(100, ((gameSpeed - GAME_SPEED_START) / 10) * 100 + 30);
        speedFill.style.width = `${percent}%`;
    }

    // --- CONTROLS ---
    function jump() {
        if (!isPlaying) {
            startGame();
            return;
        }
        if (isGameOver) {
            resetGame();
            return;
        }

        // Jump only if grounded
        if (dinoY <= 1) {
            dinoVelocity = JUMP_FORCE;
        }
    }

    function startGame() {
        isPlaying = true;
        instructionGroup.style.opacity = '0'; // Hide instructions
        dino.classList.add('running');
        dinoY = 0;
        dinoVelocity = 0;
        updateSpeedUI();
    }

    function resetGame() {
        isGameOver = false;
        isPlaying = true;
        score = 0;
        gameSpeed = GAME_SPEED_START;
        scoreEl.innerText = '0000';
        
        // Clear obstacles
        obstacles.forEach(o => o.element.remove());
        obstacles = [];
        
        instructionGroup.style.opacity = '0';
        instructionGroup.innerHTML = `
            <div class="instruction-text">Press Space</div>
            <div class="key-cap"></div>
        `;
        dino.classList.remove('jumping');
        dino.classList.add('running');
        updateSpeedUI();
    }

    function gameOver() {
        isGameOver = true;
        isPlaying = false;
        dino.classList.remove('running');
        dino.classList.remove('jumping');
        
        // High Score Logic
        if(score > highScore) {
            highScore = score;
            highScoreEl.innerText = highScore.toString().padStart(4, '0');
        }

        // Update Instruction UI for Game Over
        instructionGroup.innerHTML = `
            <div class="instruction-text" style="color:var(--ground-top)">CRASHED!</div>
            <div class="key-cap"></div>
        `;
        instructionGroup.style.opacity = '1';
    }

    // --- EVENTS ---
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            jump();
        }
    });

    // Start Loop
    requestAnimationFrame(gameLoop);

</script>
</body>
</html>
