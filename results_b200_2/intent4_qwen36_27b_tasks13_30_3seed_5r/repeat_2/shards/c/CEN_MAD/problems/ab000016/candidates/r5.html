<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON PREHISTORIC RUNNER</title>
<style>
    :root {
        /* Design System: Modern-Retro / Synthwave */
        --font-main: 'Courier New', 'Lucida Console', monospace; /* System monospace stack */
        
        /* Palette: High Contrast Sunset */
        --bg-top: #050011;        /* Deep Space Purple */
        --bg-horizon: #2a004d;    /* Dark Violet */
        --sun-core: #ff0055;      /* Neon Pink */
        --sun-grad: #ffcc00;      /* Electric Yellow */
        
        --ground-main: #120824;   /* Very dark purple/black */
        --ground-grid: #ff00aa;   /* Neon Grid Lines */
        
        --silhouette: #05000a;    /* Near absolute black */
        --ui-text: #ffffff;
        --ui-accent: #00f0ff;     /* Cyan */
        
        --ground-height: 100px;   /* Fixed px for collision consistency */
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: none;
    }

    body {
        background-color: #000;
        color: var(--ui-text);
        font-family: var(--font-main);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* --- 1. UNIFIED RENDERING PIPELINE --- */
    /* Force pixelated rendering on the entire game container to fix mixed-media look */
    .game-container {
        position: relative;
        width: 100%;
        height: 100%;
        max-width: 1400px;
        overflow: hidden;
        image-rendering: pixelated; 
        image-rendering: crisp-edges;
        /* 2. BACKGROUND: Stylized Sunset */
        background: linear-gradient(to bottom, var(--bg-top) 0%, var(--bg-horizon) 70%, var(--ground-main) 100%);
    }

    /* --- 2. GEOMETRIC SUN --- */
    .sun-container {
        position: absolute;
        top: 15%;
        left: 50%;
        transform: translateX(-50%);
        width: 300px;
        height: 300px;
        z-index: 1;
        pointer-events: none;
    }

    .sun {
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, var(--sun-grad), var(--sun-core));
        /* Retro Grid Sun Effect */
        clip-path: polygon(
            0% 0%, 100% 0%, 100% 100%, 0% 100% /* Base box */
        );
        mask: 
            linear-gradient(to bottom, 
                black 0%, black 10%, 
                transparent 10%, transparent 12%,
                black 12%, black 25%,
                transparent 25%, transparent 28%,
                black 28%, black 45%,
                transparent 45%, transparent 50%,
                black 50%, black 70%,
                transparent 70%, transparent 76%,
                black 76%, black 100%
            );
        -webkit-mask: 
            linear-gradient(to bottom, 
                black 0%, black 10%, 
                transparent 10%, transparent 12%,
                black 12%, black 25%,
                transparent 25%, transparent 28%,
                black 28%, black 45%,
                transparent 45%, transparent 50%,
                black 50%, black 70%,
                transparent 70%, transparent 76%,
                black 76%, black 100%
            );
        opacity: 0.9;
        filter: drop-shadow(0 0 20px var(--sun-core));
    }

    /* --- 3. CORRECT GROUND GEOMETRY --- */
    .ground {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: var(--ground-height);
        z-index: 10;
        background-color: var(--ground-main);
        border-top: 4px solid var(--ui-accent); /* Horizon Line */
        overflow: hidden;
    }

    /* 2D Horizontal Grid Texture */
    .ground-grid {
        position: absolute;
        top: 0;
        left: 0;
        width: 200%;
        height: 100%;
        background-image: 
            linear-gradient(90deg, var(--ground-grid) 1px, transparent 1px),
            linear-gradient(0deg, var(--ground-grid) 1px, transparent 1px);
        background-size: 80px 40px;
        opacity: 0.3;
        animation: scrollGrid 0.5s linear infinite;
    }

    @keyframes scrollGrid {
        from { transform: translateX(0); }
        to { transform: translateX(-80px); }
    }

    /* --- 6. RESTRUCTURED UI & HIERARCHY --- */
    .hud {
        position: absolute;
        top: 30px;
        right: 40px;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        font-family: var(--font-main);
        pointer-events: none;
    }

    .score-block {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        line-height: 1;
    }

    .score-label {
        font-size: 0.75rem;
        color: var(--ui-accent);
        letter-spacing: 2px;
        margin-bottom: 4px;
        text-shadow: 1px 1px 0 #000;
    }

    .score-value {
        font-size: 2.5rem;
        font-weight: 900;
        color: var(--ui-text);
        text-shadow: 4px 4px 0px var(--silhouette);
        font-variant-numeric: tabular-nums;
        letter-spacing: -2px;
    }

    .high-score {
        font-size: 1rem;
        color: rgba(255,255,255,0.7);
        margin-top: 8px;
        text-shadow: 1px 1px 0 #000;
    }

    /* Speed Indicator */
    .speed-indicator {
        position: absolute;
        top: 30px;
        left: 40px;
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .speed-bar-container {
        width: 100px;
        height: 10px;
        background: rgba(0,0,0,0.5);
        border: 2px solid var(--silhouette);
        position: relative;
    }

    .speed-fill {
        height: 100%;
        background: var(--ui-accent);
        width: 20%;
        transition: width 0.2s;
        box-shadow: 0 0 10px var(--ui-accent);
    }

    .speed-label {
        font-size: 0.8rem;
        font-weight: bold;
        color: var(--ui-text);
        text-shadow: 1px 1px 0 #000;
    }

    /* --- SPRITES & ACTOR --- */
    .viewport {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 20;
    }

    .sprite {
        position: absolute;
        bottom: var(--ground-height);
        image-rendering: pixelated;
        will-change: transform;
    }

    /* 4. REFINED CHARACTER SILHOUETTE */
    .dino {
        left: 100px;
        width: 80px;
        height: 80px;
        z-index: 30;
    }

    .dino svg {
        fill: var(--silhouette);
        width: 100%;
        height: 100%;
        /* Rim Light */
        filter: drop-shadow(-2px -2px 0px var(--ui-accent)) drop-shadow(2px 2px 0px rgba(0,0,0,0.5));
    }

    .dino.running svg {
        animation: runBob 0.2s infinite alternate;
    }
    
    @keyframes runBob {
        from { transform: translateY(0); }
        to { transform: translateY(-2px); }
    }

    /* 5. REPLACE ABSTRACT OBSTACLES */
    .obstacle svg {
        fill: var(--silhouette);
        width: 100%;
        height: 100%;
        filter: drop-shadow(2px 2px 0px rgba(255,0,85,0.3)); /* Slight neon tint shadow */
    }

    /* --- INSTRUCTION --- */
    .instruction-group {
        position: absolute;
        bottom: calc(var(--ground-height) + 100px); /* Above Dino */
        left: 100px;
        width: 120px;
        text-align: center;
        z-index: 40;
        pointer-events: none;
        transition: opacity 0.3s;
    }

    .instruction-text {
        font-size: 0.8rem;
        font-weight: 900;
        color: var(--ui-text);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 10px;
        text-shadow: 2px 2px 0px var(--silhouette);
        animation: blink 1s infinite steps(2, start);
    }

    /* Pixel Keycap */
    .key-cap {
        display: inline-block;
        width: 50px;
        height: 24px;
        background: var(--ui-text);
        border: 2px solid var(--silhouette);
        position: relative;
        box-shadow: 3px 3px 0px var(--silhouette);
    }
    
    .key-cap::after {
        content: 'SPACE';
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        font-size: 0.6rem;
        font-weight: 900;
        color: var(--silhouette);
        letter-spacing: 0.5px;
    }

    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
    }

    /* CRT Overlay */
    .scanlines {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(
            to bottom,
            rgba(255,255,255,0),
            rgba(255,255,255,0) 50%,
            rgba(0,0,0,0.15) 50%,
            rgba(0,0,0,0.15)
        );
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 100;
        mix-blend-mode: overlay;
    }

</style>
</head>
<body>

    <div class="scanlines"></div>

    <div class="game-container">
        <!-- Background Elements -->
        <div class="sun-container">
            <div class="sun"></div>
        </div>

        <!-- HUD -->
        <div class="speed-indicator">
            <span class="speed-label">SPD</span>
            <div class="speed-bar-container">
                <div class="speed-fill" id="speedFill"></div>
            </div>
        </div>

        <div class="hud">
            <div class="score-block">
                <span class="score-label">SCORE</span>
                <span class="score-value" id="score">0000</span>
            </div>
            <div class="high-score">HI <span id="highScore">0000</span></div>
        </div>

        <!-- VIEWPORT -->
        <div class="viewport" id="gameArea">
            
            <!-- Instruction Group -->
            <div class="instruction-group" id="instructionGroup">
                <div class="instruction-text">PRESS SPACE</div>
                <div class="key-cap"></div>
            </div>

            <!-- Player: Dino -->
            <div class="sprite dino" id="dino">
                <!-- Pixel Perfect Dino Silhouette (8x8 Grid mapped to SVG) -->
                <svg viewBox="0 0 8 8" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
                    <path d="
                        M 5 0 H 7 V 1 H 8 V 3 H 7 V 4 H 5 V 6 H 7 V 8 H 6 V 7 H 5 V 6 H 4 V 8 H 3 V 6 H 1 V 4 H 3 V 2 H 4 V 0 Z
                        M 7 1 H 8 V 2 H 7 Z
                    " />
                </svg>
            </div>

            <!-- Obstacles Container -->
            <div id="obstacles"></div>

            <!-- Ground -->
            <div class="ground">
                <div class="ground-grid" id="groundGrid"></div>
            </div>
        </div>
    </div>

<script>
    // --- CONFIGURATION ---
    const GRAVITY = 0.7;
    const JUMP_FORCE = 13;
    const GAME_SPEED_START = 8;
    const SPAWN_RATE = 1200; 
    
    // --- STATE ---
    let isPlaying = false;
    let isGameOver = false;
    let score = 0;
    let highScore = 0;
    let gameSpeed = GAME_SPEED_START;
    let lastTime = 0;
    let spawnTimer = 0;
    let obstacles = [];
    let animationFrameId;
    let dinoY = 0;
    let dinoVelocity = 0;
    let groundGridOffset = 0;

    // --- DOM ELEMENTS ---
    const dino = document.getElementById('dino');
    const gameArea = document.getElementById('gameArea');
    const obstacleContainer = document.getElementById('obstacles');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const speedFill = document.getElementById('speedFill');
    const instructionGroup = document.getElementById('instructionGroup');
    const groundGrid = document.getElementById('groundGrid');

    // --- ASSETS (SVG TEMPLATES) ---
    
    // 5. REPLACE ABSTRACT OBSTACLES: Cactus
    const cactusSVG = `
        <svg viewBox="0 0 10 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
            <path d="
                M 3 16 V 6 H 1 V 4 H 3 V 0 H 5 V 4 H 7 V 2 H 9 V 6 H 7 V 16 Z
            " />
        </svg>
    `;
    
    // 5. REPLACE ABSTRACT OBSTACLES: Pterodactyl
    const birdSVG = `
        <svg viewBox="0 0 12 6" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
            <path d="
                M 0 3 H 3 L 5 5 L 7 3 H 10 V 4 H 8 L 6 6 L 5 4 L 3 4 Z
                M 2 3 L 4 1 L 5 3 Z
            " />
        </svg>
    `;

    // --- GAME LOOP ---
    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const deltaTime = timestamp - lastTime;
        lastTime = timestamp;

        if (isPlaying && !isGameOver) {
            updatePhysics(deltaTime);
            updateObstacles(deltaTime);
            spawnManager(deltaTime);
            draw();
            updateGround(deltaTime);
        }

        animationFrameId = requestAnimationFrame(gameLoop);
    }

    // --- PHYSICS ---
    function updatePhysics(dt) {
        dinoY += dinoVelocity;
        dinoVelocity -= GRAVITY;

        // Ground collision
        if (dinoY <= 0) {
            dinoY = 0;
            dinoVelocity = 0;
            dino.classList.remove('jumping');
        } else {
            dino.classList.add('jumping');
        }
    }

    // --- OBSTACLES ---
    function spawnManager(dt) {
        spawnTimer += dt;
        // Spawn rate depends on speed
        const currentRate = SPAWN_RATE / (gameSpeed / GAME_SPEED_START);
        
        if (spawnTimer > currentRate) {
            spawnTimer = 0;
            if(Math.random() > 0.1) createObstacle();
        }
    }

    function createObstacle() {
        const type = Math.random() > 0.7 ? 'bird' : 'cactus';
        const el = document.createElement('div');
        el.classList.add('sprite', 'obstacle');
        
        el.innerHTML = type === 'cactus' ? cactusSVG : birdSVG;
        
        obstacleContainer.appendChild(el);

        obstacles.push({
            element: el,
            x: window.innerWidth + 50, 
            width: type === 'bird' ? 60 : 30, 
            height: type === 'bird' ? 30 : 50,
            type: type
        });
    }

    function updateObstacles(dt) {
        obstacles.forEach((obs, index) => {
            obs.x -= gameSpeed;
            
            // Cleanup
            if (obs.x < -100) {
                obs.element.remove();
                obstacles.splice(index, 1);
                score += 10;
                scoreEl.innerText = score.toString().padStart(4, '0');
                
                // Speed progression
                if(score % 100 === 0) {
                    gameSpeed += 0.5;
                    updateSpeedUI();
                }
            }

            // Collision Logic
            // Dino is fixed at left 100px, width 80px.
            const dinoRect = {
                l: 100 + 15, // Padding for hitbox forgiveness
                r: 100 + 65,
                b: dinoY, 
                t: 80 + dinoY
            };

            // Obstacle rect
            const obsHeightOffset = obs.type === 'bird' ? 60 : 0; // Bird flies higher
            
            const obsRect = {
                l: obs.x + 5,
                r: obs.x + obs.width - 5,
                b: obsHeightOffset,
                t: obsHeightOffset + obs.height
            };

            // AABB Check
            if (
                dinoRect.l < obsRect.r &&
                dinoRect.r > obsRect.l &&
                dinoRect.b < obsRect.t &&
                dinoRect.t > obsRect.b
            ) {
                gameOver();
            }
        });
    }

    // --- RENDER ---
    function draw() {
        // Render Dino Jump
        dino.style.bottom = `calc(var(--ground-height) + ${dinoY}px)`;

        // Render Obstacles
        obstacles.forEach(obs => {
            obs.element.style.transform = `translateX(${obs.x}px)`;
            // Set size and vertical position
            if(obs.type === 'bird') {
                obs.element.style.width = '60px';
                obs.element.style.height = '30px';
                obs.element.style.bottom = `calc(var(--ground-height) + 60px)`;
            } else {
                obs.element.style.width = '30px';
                obs.element.style.height = '50px';
                obs.element.style.bottom = `var(--ground-height)`;
            }
        });
    }

    function updateGround(dt) {
        // Animate grid manually to sync with game speed
        groundGridOffset = (groundGridOffset + gameSpeed) % 80;
        groundGrid.style.transform = `translateX(-${groundGridOffset}px)`;
    }

    function updateSpeedUI() {
        // Cap visual bar at 100%
        const percent = Math.min(100, ((gameSpeed - GAME_SPEED_START) / 15) * 100 + 20);
        speedFill.style.width = `${percent}%`;
    }

    // --- CONTROLS ---
    function jump() {
        if (!isPlaying) {
            startGame();
            return;
        }
        if (isGameOver) {
            resetGame();
            return;
        }

        // Jump only if grounded
        if (dinoY <= 1) {
            dinoVelocity = JUMP_FORCE;
        }
    }

    function startGame() {
        isPlaying = true;
        instructionGroup.style.opacity = '0';
        dino.classList.add('running');
        dinoY = 0;
        dinoVelocity = 0;
        updateSpeedUI();
    }

    function resetGame() {
        isGameOver = false;
        isPlaying = true;
        score = 0;
        gameSpeed = GAME_SPEED_START;
        scoreEl.innerText = '0000';
        
        // Clear obstacles
        obstacles.forEach(o => o.element.remove());
        obstacles = [];
        
        instructionGroup.style.opacity = '0';
        instructionGroup.innerHTML = `
            <div class="instruction-text">PRESS SPACE</div>
            <div class="key-cap"></div>
        `;
        dino.classList.remove('jumping');
        dino.classList.add('running');
        updateSpeedUI();
    }

    function gameOver() {
        isGameOver = true;
        isPlaying = false;
        dino.classList.remove('running');
        dino.classList.remove('jumping');
        
        // High Score Logic
        if(score > highScore) {
            highScore = score;
            highScoreEl.innerText = highScore.toString().padStart(4, '0');
        }

        // Update Instruction UI for Game Over
        instructionGroup.innerHTML = `
            <div class="instruction-text" style="color:var(--sun-core)">CRASHED!</div>
            <div class="key-cap"></div>
        `;
        instructionGroup.style.opacity = '1';
    }

    // --- EVENTS ---
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            jump();
        }
    });

    // Start Loop
    requestAnimationFrame(gameLoop);

</script>
</body>
</html>
