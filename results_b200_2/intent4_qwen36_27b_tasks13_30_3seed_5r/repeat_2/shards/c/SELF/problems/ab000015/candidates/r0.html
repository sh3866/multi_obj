<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alpine Rush: Descent</title>
    <style>
        :root {
            --sky-top: #0f172a;
            --sky-bot: #38bdf8;
            --snow-light: #f8fafc;
            --snow-dark: #cbd5e1;
            --accent: #f43f5e; /* Danger/Speed */
            --ui-bg: rgba(15, 23, 42, 0.6);
            --ui-border: rgba(255, 255, 255, 0.1);
            --glass: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI OVERLAYS */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass to controls */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        /* TOP BAR */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .stats-panel {
            background: var(--ui-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--ui-border);
            padding: 12px 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 140px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
            font-weight: 700;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .stat-unit {
            font-size: 14px;
            font-weight: 600;
            opacity: 0.8;
            margin-left: 4px;
        }

        .speed-value {
            color: var(--accent);
        }

        /* PROGRESS BAR */
        .progress-container {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 6px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #ffffff);
            width: 45%;
            border-radius: 10px;
            box-shadow: 0 0 10px #38bdf8;
        }

        /* CONTROLS AREA */
        .controls-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 20px;
            pointer-events: auto;
        }

        .control-pad {
            width: 120px;
            height: 120px;
            background: var(--glass);
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            transition: transform 0.1s, background 0.1s;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .control-pad:active, .control-pad.active {
            background: rgba(255,255,255,0.3);
            transform: scale(0.95);
        }

        .control-icon {
            width: 40px;
            height: 40px;
            fill: white;
        }

        .brake-btn {
            width: 80px;
            height: 80px;
            background: rgba(244, 63, 94, 0.2);
            border: 2px solid rgba(244, 63, 94, 0.4);
            color: white;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 20px;
        }

        .brake-btn:active {
            background: rgba(244, 63, 94, 0.5);
        }

        /* GRAIN OVERLAY */
        .noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* HINT TEXT */
        .hint {
            position: absolute;
            bottom: 160px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            letter-spacing: 2px;
            opacity: 0.6;
            text-transform: uppercase;
        }

    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="noise"></div>

    <div class="ui-layer">
        <!-- TOP HUD -->
        <div class="top-bar">
            <div class="stats-panel">
                <span class="stat-label">Speed</span>
                <div style="display:flex; align-items: baseline;">
                    <span class="stat-value speed-value" id="speedDisplay">84</span>
                    <span class="stat-unit">KM/H</span>
                </div>
            </div>

            <div class="stats-panel" style="text-align: right;">
                <span class="stat-label">Distance</span>
                <div style="display:flex; align-items: baseline; justify-content: flex-end;">
                    <span class="stat-value" id="distDisplay">12.4</span>
                    <span class="stat-unit">KM</span>
                </div>
            </div>
        </div>

        <!-- PROGRESS -->
        <div class="progress-container">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <!-- HINT -->
        <div class="hint">Use Arrow Keys or Tap to Steer</div>

        <!-- CONTROLS -->
        <div class="controls-area">
            <div style="display: flex; gap: 15px;">
                <div class="control-pad" id="btnLeft">
                    <svg class="control-icon" viewBox="0 0 24 24">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                    </svg>
                </div>
                <div class="control-pad" id="btnRight">
                    <svg class="control-icon" viewBox="0 0 24 24">
                        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                    </svg>
                </div>
            </div>
            
            <div class="control-pad brake-btn" id="btnBrake">
                BRAKE
            </div>
        </div>
    </div>
</div>

<script>
    /**
     * ALPINE RUSH ENGINE
     * A pseudo-3D rendering engine using Canvas API.
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for no transparency on base

    // UI Elements
    const speedDisplay = document.getElementById('speedDisplay');
    const distDisplay = document.getElementById('distDisplay');
    const progressBar = document.getElementById('progressBar');
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnBrake = document.getElementById('btnBrake');

    // State
    let width, height;
    let cx, cy;
    let frame = 0;
    
    // Game Physics State
    const state = {
        speed: 84,
        targetSpeed: 84,
        distance: 12.4,
        playerX: 0, // -1 to 1
        playerTilt: 0,
        isBraking: false,
        roadWidth: 2000,
        segmentLength: 200,
        cameraHeight: 1000,
        fov: 100,
        drawDistance: 300
    };

    // Input State
    const input = {
        left: false,
        right: false,
        brake: false
    };

    // Assets (Procedural generation logic)
    const trees = [];
    const obstacles = [];

    // --- Initialization ---

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * window.devicePixelRatio;
        canvas.height = height * window.devicePixelRatio;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        cx = width / 2;
        cy = height / 2;
    }

    function init() {
        resize();
        window.addEventListener('resize', resize);
        setupInputs();
        generateWorld();
        requestAnimationFrame(loop);
    }

    function generateWorld() {
        // Generate random trees
        for(let i=0; i<50; i++) {
            trees.push({
                z: Math.random() * 5000,
                x: (Math.random() * 2 - 1) * 4000,
                scale: Math.random() * 0.5 + 0.5
            });
        }
        // Generate obstacles (gates/rocks)
        for(let i=0; i<20; i++) {
            obstacles.push({
                z: 500 + i * 400 + Math.random() * 200,
                x: (Math.random() * 2 - 1) * 1000,
                type: Math.random() > 0.5 ? 'gate' : 'rock'
            });
        }
    }

    // --- Input Handling ---

    function setupInputs() {
        // Keyboard
        document.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft') input.left = true;
            if(e.key === 'ArrowRight') input.right = true;
            if(e.key === 'ArrowDown' || e.key === ' ') input.brake = true;
        });
        document.addEventListener('keyup', (e) => {
            if(e.key === 'ArrowLeft') input.left = false;
            if(e.key === 'ArrowRight') input.right = false;
            if(e.key === 'ArrowDown' || e.key === ' ') input.brake = false;
        });

        // Touch/Mouse
        const addTouch = (elem, key) => {
            elem.addEventListener('mousedown', () => { input[key] = true; elem.classList.add('active'); });
            elem.addEventListener('mouseup', () => { input[key] = false; elem.classList.remove('active'); });
            elem.addEventListener('touchstart', (e) => { e.preventDefault(); input[key] = true; elem.classList.add('active'); });
            elem.addEventListener('touchend', (e) => { e.preventDefault(); input[key] = false; elem.classList.remove('active'); });
        };

        addTouch(btnLeft, 'left');
        addTouch(btnRight, 'right');
        addTouch(btnBrake, 'brake');
    }

    // --- Rendering Helpers ---

    function project(x, y, z) {
        const scale = state.fov / (state.fov + z);
        const x2d = (x * scale) + cx;
        const y2d = ((y - state.cameraHeight) * scale) + cy + 150; // +150 to push horizon down
        return { x: x2d, y: y2d, scale: scale };
    }

    function drawSky() {
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, '#0f172a'); // Dark Blue
        gradient.addColorStop(0.4, '#38bdf8'); // Sky Blue
        gradient.addColorStop(1, '#f8fafc'); // White/Snow
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        // Sun
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        const sunGrad = ctx.createRadialGradient(cx, height * 0.3, 10, cx, height * 0.3, 300);
        sunGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
        sunGrad.addColorStop(0.2, 'rgba(255, 255, 255, 0.5)');
        sunGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = sunGrad;
        ctx.fillRect(0, 0, width, height);
        ctx.restore();
    }

    function drawMountains() {
        // Simple procedural mountains on horizon
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.moveTo(0, cy + 100);
        for(let i=0; i<=width; i+=50) {
            const h = Math.sin(i * 0.005 + frame * 0.0001) * 100 + 
                      Math.cos(i * 0.02) * 50;
            ctx.lineTo(i, (cy + 100) - h);
        }
        ctx.lineTo(width, cy + 100);
        ctx.fill();

        // Snow caps
        ctx.fillStyle = '#e2e8f0';
        ctx.beginPath();
        for(let i=0; i<=width; i+=50) {
            const h = Math.sin(i * 0.005 + frame * 0.0001) * 100 + 
                      Math.cos(i * 0.02) * 50;
            const peakY = (cy + 100) - h;
            if(h > 40) {
                ctx.moveTo(i - 20, peakY + 20);
                ctx.lineTo(i, peakY);
                ctx.lineTo(i + 20, peakY + 20);
            }
        }
        ctx.fill();
    }

    function drawSnowField() {
        // The infinite white slope
        ctx.fillStyle = '#f1f5f9';
        ctx.beginPath();
        ctx.moveTo(0, cy + 150);
        ctx.lineTo(width, cy + 150);
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.fill();
    }

    function drawRoad() {
        // Draw the track using segments
        const horizonY = cy + 150;
        
        // Track bounds
        const trackLeft = -state.roadWidth / 2;
        const trackRight = state.roadWidth / 2;

        // Draw speed lines / texture on ground
        ctx.save();
        ctx.beginPath();
        // Clip to road shape
        const p1 = project(trackLeft, 0, 10);
        const p2 = project(trackRight, 0, 10);
        const p3 = project(trackRight, 0, 5000);
        const p4 = project(trackLeft, 0, 5000);
        
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.lineTo(p4.x, p4.y);
        ctx.clip();

        // Draw horizontal grid lines to simulate speed
        const offset = (frame * state.speed * 0.5) % state.segmentLength;
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.3)';
        ctx.lineWidth = 2;

        for (let z = 5000; z > 0; z -= state.segmentLength) {
            const drawZ = z - offset;
            if (drawZ < 10) continue;
            
            const pL = project(trackLeft, 0, drawZ);
            const pR = project(trackRight, 0, drawZ);
            
            ctx.beginPath();
            ctx.moveTo(pL.x, pL.y);
            ctx.lineTo(pR.x, pR.y);
            ctx.stroke();
        }

        // Track Borders (Glowing)
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#38bdf8';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 4;
        
        // Left border
        ctx.beginPath();
        for(let z=0; z<5000; z+=100) {
            const p = project(trackLeft, 0, z);
            if(z===0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();

        // Right border
        ctx.beginPath();
        for(let z=0; z<5000; z+=100) {
            const p = project(trackRight, 0, z);
            if(z===0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();

        ctx.restore();
    }

    function drawTree(x, y, z) {
        const p = project(x, y, z);
        if (p.scale <= 0) return;

        const size = 200 * p.scale;
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, size/2, size/6, 0, 0, Math.PI*2);
        ctx.fill();

        // Tree (Pine shape)
        ctx.fillStyle = '#0f172a'; // Dark silhouette
        ctx.beginPath();
        ctx.moveTo(p.x, p.y - size);
        ctx.lineTo(p.x - size/2, p.y);
        ctx.lineTo(p.x + size/2, p.y);
        ctx.fill();
    }

    function drawObstacle(obs) {
        // Move obstacle towards camera
        let z = obs.z - (frame * state.speed * 2);
        
        // Wrap around
        if (z < 10) z += 5000;
        
        // Player collision logic (simple)
        // Player is at playerX (normalized -1 to 1). Road is -1000 to 1000.
        // Convert playerX to world units: playerX * 1000.
        // But for visual placement, we just draw relative to playerX.
        
        const relX = obs.x - (state.playerX * state.roadWidth/2);
        const p = project(relX, 0, z);
        
        if (p.scale <= 0) return;

        const size = 150 * p.scale;

        if (obs.type === 'gate') {
            // Draw Gate
            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = 5 * p.scale;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#f43f5e';
            
            ctx.beginPath();
            ctx.moveTo(p.x - size, p.y);
            ctx.lineTo(p.x - size, p.y - size * 1.5);
            ctx.lineTo(p.x + size, p.y - size * 1.5);
            ctx.lineTo(p.x + size, p.y);
            ctx.stroke();
            
            // Gate Banner
            ctx.fillStyle = 'rgba(244, 63, 94, 0.2)';
            ctx.fillRect(p.x - size, p.y - size * 1.5, size * 2, size * 0.8);
            
        } else {
            // Rock
            ctx.fillStyle = '#475569';
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(p.x, p.y - size/2, size/2, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.shadowBlur = 0; // Reset
    }

    function drawPlayer() {
        const p = project(0, 0, 10); // Just below camera
        const tilt = state.playerTilt;
        
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(tilt * 0.5); // Lean into turn

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 40, 15, 0, 0, Math.PI*2);
        ctx.fill();

        // Skier Body (Abstract/Stylized)
        // Helmet
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, -60, 12, 0, Math.PI*2);
        ctx.fill();
        
        // Suit
        ctx.fillStyle = '#f43f5e'; // Bright accent suit
        ctx.beginPath();
        ctx.moveTo(-10, -60);
        ctx.lineTo(10, -60);
        ctx.lineTo(15, -30); // Legs spread
        ctx.lineTo(-15, -30);
        ctx.fill();

        // Skis
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        
        // Left Ski
        ctx.beginPath();
        ctx.moveTo(-15, -30);
        ctx.lineTo(-35, 10);
        ctx.stroke();
        
        // Right Ski
        ctx.beginPath();
        ctx.moveTo(15, -30);
        ctx.lineTo(35, 10);
        ctx.stroke();

        // Speed lines behind player
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 2;
        for(let i=0; i<5; i++) {
            const lx = (Math.random() - 0.5) * 40;
            const ly = (Math.random()) * 20;
            ctx.beginPath();
            ctx.moveTo(lx, ly);
            ctx.lineTo(lx, ly + 20 + state.speed/2);
            ctx.stroke();
        }

        ctx.restore();
    }

    function drawParticles() {
        // Snow particles
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        for(let i=0; i<20; i++) {
            const x = (Math.sin(frame * 0.1 + i) * width) + width/2;
            const y = (Math.cos(frame * 0.05 + i * 10) * height) + height/2;
            const size = Math.random() * 3;
            ctx.fillRect(x, y, size, size);
        }
    }

    // --- Main Loop ---

    function update() {
        // Physics
        if (input.brake) {
            state.targetSpeed = Math.max(20, state.targetSpeed - 2);
            state.isBraking = true;
        } else {
            state.targetSpeed = Math.min(140, state.targetSpeed + 0.5);
            state.isBraking = false;
        }
        
        // Smooth speed interpolation
        state.speed += (state.targetSpeed - state.speed) * 0.1;

        // Steering
        if (input.left) {
            state.playerX = Math.max(-1, state.playerX - 0.03);
            state.playerTilt = Math.max(-0.5, state.playerTilt - 0.05);
        } else if (input.right) {
            state.playerX = Math.min(1, state.playerX + 0.03);
            state.playerTilt = Math.min(0.5, state.playerTilt + 0.05);
        } else {
            // Return to center tilt
            state.playerTilt += (0 - state.playerTilt) * 0.1;
        }

        // Distance
        state.distance += state.speed * 0.001;
        
        // Update UI
        speedDisplay.innerText = Math.floor(state.speed);
        distDisplay.innerText = state.distance.toFixed(1);
        
        // Pulse effect on speed if high
        if(state.speed > 120) {
            speedDisplay.style.transform = `scale(${1 + Math.sin(frame * 0.2) * 0.05})`;
        } else {
            speedDisplay.style.transform = 'scale(1)';
        }

        frame++;
    }

    function loop() {
        ctx.clearRect(0, 0, width, height);

        update();

        // 1. Environment
        drawSky();
        drawMountains();
        drawSnowField();

        // 2. Road
        drawRoad();

        // 3. World Objects (Sorted by Z for painter's algo)
        // Trees
        trees.forEach(tree => {
            let z = tree.z - (frame * state.speed * 2);
            if(z < 0) z += 5000;
            // Parallax effect for trees based on playerX
            const parallaxX = tree.x - (state.playerX * 2000); 
            drawTree(parallaxX, 0, z);
        });

        // Obstacles
        obstacles.forEach(obs => {
            drawObstacle(obs);
        });

        // 4. Player (Always on top)
        drawPlayer();

        // 5. Effects
        drawParticles();

        // 6. Vignette
        const grad = ctx.createRadialGradient(cx, cy, height/3, cx, cy, height);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.6)');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,width,height);

        requestAnimationFrame(loop);
    }

    // Start
    init();

</script>
</body>
</html>
