<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON RUNNER // REBOOT</title>
<style>
    :root {
        --bg-deep: #030305;
        --bg-panel: #08080c;
        --neon-cyan: #00f3ff;
        --neon-pink: #ff0055;
        --neon-yellow: #fcee0a;
        --text-white: #ffffff;
        --text-dim: #5c677d;
        --font-mono: 'Courier New', Courier, monospace;
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

    body {
        background-color: #000;
        color: var(--text-white);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: var(--font-ui);
    }

    /* --- ATMOSPHERE --- */
    .crt-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
        background-size: 100% 3px;
        pointer-events: none;
        z-index: 100;
        opacity: 0.6;
    }
    
    .ambient-glow {
        position: absolute; width: 100%; height: 100%;
        background: radial-gradient(circle at 50% 80%, rgba(0, 243, 255, 0.08) 0%, transparent 60%);
        pointer-events: none; z-index: 0;
    }

    /* --- MAIN INTERFACE --- */
    .interface-container {
        position: relative;
        width: 95vw;
        max-width: 1000px;
        aspect-ratio: 16/9;
        background: var(--bg-panel);
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 
            0 0 0 1px #000,
            0 40px 80px rgba(0,0,0,0.8),
            0 0 50px rgba(0, 243, 255, 0.05);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-radius: 2px;
        z-index: 10;
    }

    /* --- HUD --- */
    .hud {
        height: 70px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 40px;
        background: linear-gradient(to bottom, rgba(15, 16, 22, 0.9), rgba(8, 8, 12, 0.9));
        position: relative;
        z-index: 20;
        backdrop-filter: blur(5px);
    }

    .hud-group {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }
    
    .hud-group.center { align-items: center; flex-grow: 1; }
    .hud-group.right { align-items: flex-end; }

    .hud-label {
        font-family: var(--font-mono);
        font-size: 0.6rem;
        color: var(--text-dim);
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 2px;
    }

    .hud-value {
        font-family: var(--font-mono);
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--text-white);
        letter-spacing: -1px;
        font-variant-numeric: tabular-nums;
    }

    .hud-value.highlight { color: var(--neon-yellow); text-shadow: 0 0 10px rgba(252, 238, 10, 0.2); }
    .hud-value.speed { color: var(--neon-pink); text-shadow: 0 0 10px rgba(255, 0, 85, 0.2); }

    .sys-indicator {
        display: flex; align-items: center; gap: 8px;
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: var(--neon-cyan);
        letter-spacing: 1px;
    }
    
    .sys-dot {
        width: 6px; height: 6px; background: var(--neon-cyan);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--neon-cyan);
        animation: pulse 2s infinite;
    }

    /* --- GAME VIEWPORT --- */
    .viewport {
        flex-grow: 1;
        position: relative;
        overflow: hidden;
        background: linear-gradient(to bottom, #050508 0%, #0a0a12 100%);
    }

    /* Background Elements */
    .stars {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background-image: 
            radial-gradient(1px 1px at 10% 10%, rgba(255,255,255,0.3), transparent),
            radial-gradient(1px 1px at 30% 40%, rgba(255,255,255,0.2), transparent),
            radial-gradient(2px 2px at 70% 20%, rgba(255,255,255,0.4), transparent),
            radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,0.3), transparent);
        background-size: 200px 200px;
        opacity: 0.5;
    }

    .mountains {
        position: absolute; bottom: 0; left: 0; width: 200%; height: 30%;
        background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="none"><path d="M0,300 L100,150 L250,280 L400,100 L600,250 L800,80 L1000,200 L1200,300 Z" fill="%230d0d14"/></svg>');
        background-size: 50% 100%;
        opacity: 0.8;
        filter: drop-shadow(0 -5px 10px rgba(0, 243, 255, 0.05));
    }

    .grid-floor {
        position: absolute; bottom: 0; left: 0; width: 200%; height: 30%;
        background-image: 
            linear-gradient(rgba(0, 243, 255, 0.15) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 243, 255, 0.15) 1px, transparent 1px);
        background-size: 60px 60px;
        transform: perspective(400px) rotateX(60deg) translateY(40px) translateZ(-50px);
        transform-origin: bottom center;
        animation: gridMove 0.8s linear infinite;
        mask-image: linear-gradient(to top, rgba(0,0,0,1), transparent 40%);
        -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1), transparent 40%);
    }

    .ground-line {
        position: absolute; bottom: 0; left: 0; width: 100%; height: 2px;
        background: var(--neon-cyan);
        box-shadow: 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-cyan);
        z-index: 5;
    }

    /* --- ENTITIES --- */
    .entity { position: absolute; will-change: transform; }

    /* Player */
    .player {
        bottom: 0; left: 10%;
        width: 48px; height: 48px;
        color: var(--neon-cyan);
        z-index: 20;
        filter: drop-shadow(0 0 10px var(--neon-cyan));
        transition: opacity 0.2s;
    }
    .player svg { width: 100%; height: 100%; fill: currentColor; }
    
    /* Obstacles */
    .obstacle {
        color: var(--neon-pink);
        filter: drop-shadow(0 0 8px var(--neon-pink));
    }
    .obstacle svg { width: 100%; height: 100%; fill: currentColor; }

    /* --- OVERLAYS --- */
    .overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        background: rgba(3, 3, 5, 0.7);
        backdrop-filter: blur(4px);
        z-index: 50;
        transition: opacity 0.3s ease;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }

    .title {
        font-family: var(--font-mono);
        font-size: 3.5rem; font-weight: 900;
        letter-spacing: 8px;
        color: #fff;
        text-transform: uppercase;
        margin-bottom: 10px;
        position: relative;
    }
    
    /* Glitch Effect */
    .title::before, .title::after {
        content: "NEON RUNNER";
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: transparent;
    }
    .title::before { color: var(--neon-cyan); z-index: -1; transform: translate(-2px, 0); opacity: 0.7; }
    .title::after { color: var(--neon-pink); z-index: -2; transform: translate(2px, 0); opacity: 0.7; }

    .btn-start {
        margin-top: 30px;
        padding: 14px 40px;
        background: transparent;
        border: 1px solid rgba(255,255,255,0.2);
        color: var(--text-white);
        font-family: var(--font-mono);
        font-size: 1rem;
        letter-spacing: 3px;
        cursor: pointer;
        transition: all 0.2s;
        position: relative;
        overflow: hidden;
    }
    
    .btn-start:hover {
        border-color: var(--neon-cyan);
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        text-shadow: 0 0 5px var(--neon-cyan);
        background: rgba(0, 243, 255, 0.05);
    }

    .instruction {
        margin-top: 20px;
        color: var(--text-dim);
        font-size: 0.8rem;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    /* --- ANIMATIONS --- */
    @keyframes gridMove {
        0% { transform: perspective(400px) rotateX(60deg) translateY(40px) translateZ(-50px) translateX(0); }
        100% { transform: perspective(400px) rotateX(60deg) translateY(40px) translateZ(-50px) translateX(-60px); }
    }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    @keyframes glitch-anim {
        0% { transform: translate(0) }
        20% { transform: translate(-3px, 3px) }
        40% { transform: translate(-3px, -3px) }
        60% { transform: translate(3px, 3px) }
        80% { transform: translate(3px, -3px) }
        100% { transform: translate(0) }
    }

    .shake { animation: glitch-anim 0.25s cubic-bezier(.36,.07,.19,.97) both; }

    /* Mobile Adjustments */
    @media (max-width: 600px) {
        .interface-container { width: 100vw; height: 100vh; border: none; border-radius: 0; }
        .hud { padding: 0 20px; }
        .title { font-size: 2rem; }
    }
</style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div class="crt-overlay"></div>

    <div class="interface-container" id="gameFrame">
        
        <!-- HUD -->
        <div class="hud">
            <div class="sys-indicator">
                <div class="sys-dot"></div>
                <span>SYS.ONLINE</span>
            </div>

            <div class="hud-group center">
                <span class="hud-label">Score</span>
                <span class="hud-value" id="scoreDisplay">0000</span>
            </div>

            <div class="hud-group center">
                <span class="hud-label">High Score</span>
                <span class="hud-value highlight" id="highScoreDisplay">0000</span>
            </div>

            <div class="hud-group right">
                <span class="hud-label">Velocity</span>
                <div style="display: flex; align-items: baseline;">
                    <span class="hud-value speed" id="speedDisplay">00</span>
                    <span style="font-size: 0.7rem; color: var(--text-dim); margin-left: 4px; font-family: var(--font-mono);">KM/H</span>
                </div>
            </div>
        </div>

        <!-- GAME VIEWPORT -->
        <div class="viewport" id="gameArea">
            
            <!-- Background Layers -->
            <div class="stars"></div>
            <div class="mountains" id="bgMountains"></div>
            <div class="grid-floor"></div>
            <div class="ground-line"></div>

            <!-- Player -->
            <div class="entity player" id="player">
                <!-- Clean Geometric Dino -->
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22,8 H20 V6 H16 V4 H14 V2 H10 V4 H8 V6 H4 V10 H6 V14 H4 V18 H6 V22 H10 V20 H14 V24 H18 V20 H22 V16 H24 V12 H22 V8 Z" />
                </svg>
            </div>

            <!-- Obstacles -->
            <div id="obstacleLayer"></div>

            <!-- UI Overlay -->
            <div class="overlay" id="uiOverlay">
                <div class="title">NEON RUNNER</div>
                <div class="instruction" id="statusText">SYSTEM READY</div>
                <button class="btn-start" id="startBtn">INITIALIZE</button>
            </div>
        </div>
    </div>

<script>
    // --- CONFIGURATION ---
    const CONFIG = {
        gravity: 0.6,
        jumpForce: 14,
        startSpeed: 9,
        maxSpeed: 30,
        spawnMin: 1000,
        spawnMax: 2500
    };

    // --- STATE ---
    let state = {
        isPlaying: false,
        isGameOver: false,
        score: 0,
        highScore: 0,
        speed: CONFIG.startSpeed,
        lastTime: 0,
        spawnTimer: 0,
        playerY: 0,
        playerVY: 0,
        isJumping: false
    };

    // --- DOM REFS ---
    const els = {
        frame: document.getElementById('gameFrame'),
        player: document.getElementById('player'),
        obstacleLayer: document.getElementById('obstacleLayer'),
        score: document.getElementById('scoreDisplay'),
        highScore: document.getElementById('highScoreDisplay'),
        speed: document.getElementById('speedDisplay'),
        overlay: document.getElementById('uiOverlay'),
        statusText: document.getElementById('statusText'),
        startBtn: document.getElementById('startBtn'),
        mountains: document.getElementById('bgMountains')
    };

    let obstacles = [];
    let animationId;

    // --- ASSETS (SVG Paths) ---
    const SVGS = {
        cactus: `<svg viewBox="0 0 24 24"><path d="M10,24 V10 H6 V6 H10 V0 H14 V6 H18 V10 H14 V24 Z" /></svg>`,
        bird: `<svg viewBox="0 0 24 24"><path d="M4,12 L10,6 L14,10 L18,4 L20,8 L14,14 L10,10 Z" /></svg>`
    };

    // --- CORE FUNCTIONS ---

    function init() {
        state.score = 0;
        state.speed = CONFIG.startSpeed;
        state.isGameOver = false;
        state.isPlaying = false;
        state.playerY = 0;
        state.playerVY = 0;
        state.isJumping = false;

        els.obstacleLayer.innerHTML = '';
        obstacles = [];

        updateHUD();
        els.overlay.classList.remove('hidden');
        els.statusText.innerText = "SYSTEM READY";
        els.startBtn.innerText = "INITIALIZE";
        els.frame.classList.remove('shake');
        els.player.style.transform = `translateY(0px)`;
        els.player.style.opacity = '0.3'; // Dim when not playing
    }

    function startGame() {
        state.isPlaying = true;
        state.lastTime = performance.now();
        els.overlay.classList.add('hidden');
        els.player.style.opacity = '1';
        requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        state.isPlaying = false;
        state.isGameOver = true;
        els.frame.classList.add('shake');
        
        if (state.score > state.highScore) {
            state.highScore = Math.floor(state.score);
            els.highScore.innerText = state.highScore.toString().padStart(4, '0');
        }

        els.statusText.innerText = "CRITICAL FAILURE";
        els.startBtn.innerText = "REBOOT SYSTEM";
        els.overlay.classList.remove('hidden');
        els.player.style.opacity = '0.5';
    }

    function jump() {
        if (!state.isPlaying && !state.isGameOver) {
            startGame();
            return;
        }
        if (state.isGameOver) {
            init();
            return;
        }

        if (!state.isJumping) {
            state.isJumping = true;
            state.playerVY = CONFIG.jumpForce;
        }
    }

    // --- GAME LOOP ---

    function gameLoop(timestamp) {
        if (!state.isPlaying) return;

        const dt = timestamp - state.lastTime;
        state.lastTime = timestamp;

        updatePhysics();
        updateObstacles(dt);
        checkCollisions();
        updateHUD();

        requestAnimationFrame(gameLoop);
    }

    function updatePhysics() {
        state.playerY += state.playerVY;
        state.playerVY -= CONFIG.gravity;

        if (state.playerY <= 0) {
            state.playerY = 0;
            state.playerVY = 0;
            state.isJumping = false;
        }

        // Visuals: Invert Y for CSS translate
        els.player.style.transform = `translateY(${-state.playerY}px)`;
        
        // Parallax Mountains
        const mountainOffset = -(state.score * 0.5) % 500;
        els.mountains.style.transform = `translateX(${mountainOffset}px)`;
    }

    function updateObstacles(dt) {
        state.spawnTimer += dt;
        const currentSpawnRate = Math.max(CONFIG.spawnMin, CONFIG.spawnMax - (state.speed * 25));
        
        if (state.spawnTimer > currentSpawnRate) {
            spawnObstacle();
            state.spawnTimer = 0;
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.x -= state.speed;
            obs.el.style.transform = `translateX(${obs.x}px)`;

            if (obs.x < -100) {
                obs.el.remove();
                obstacles.splice(i, 1);
                state.score += 10;
                
                if (state.speed < CONFIG.maxSpeed) {
                    state.speed += 0.01;
                }
            }
        }
    }

    function spawnObstacle() {
        const type = Math.random() > 0.7 ? 'bird' : 'cactus';
        const el = document.createElement('div');
        el.className = `entity obstacle ${type}`;
        el.innerHTML = SVGS[type];
        
        // Initial Position (Right side of viewport)
        const startX = els.gameArea.clientWidth || 900; 
        el.style.transform = `translateX(${startX}px)`;
        
        // Dimensions
        let width = 30, height = 50, yOffset = 0;
        if (type === 'bird') {
            width = 40; height = 30; yOffset = 90; // Flying height
        }
        
        el.style.bottom = `${yOffset}px`;

        els.obstacleLayer.appendChild(el);

        obstacles.push({
            el: el,
            x: startX,
            type: type,
            width: width,
            height: height,
            yOffset: yOffset
        });
    }

    function checkCollisions() {
        // Player Hitbox (Approximation for smoother feel)
        const pX = (els.gameArea.clientWidth * 0.1) + 10; 
        const pW = 24; 
        const pH = 36; 
        const pY = state.playerY; 

        for (let obs of obstacles) {
            // Obstacle Hitbox
            const oX = obs.x + 5;
            const oW = obs.width - 10;
            const oH = obs.height;
            const oY = obs.yOffset;

            // AABB
            const hCol = (pX < oX + oW) && (pX + pW > oX);
            const vCol = (pY < oY + oH) && (pY + pH > oY);

            if (hCol && vCol) {
                gameOver();
                break;
            }
        }
    }

    function updateHUD() {
        els.score.innerText = Math.floor(state.score).toString().padStart(4, '0');
        els.speed.innerText = Math.floor(state.speed * 3).toString().padStart(2, '0');
    }

    // --- INPUT ---
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            jump();
        }
    });

    els.startBtn.addEventListener('click', jump);

    // Touch support
    window.addEventListener('touchstart', (e) => {
        e.preventDefault();
        jump();
    }, {passive: false});

    // --- BOOT ---
    init();

</script>
</body>
</html>
