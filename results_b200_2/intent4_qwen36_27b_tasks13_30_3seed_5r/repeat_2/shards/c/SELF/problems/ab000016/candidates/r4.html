<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON RUNNER // PROTOCOL</title>
<style>
    :root {
        --bg-deep: #050508;
        --bg-panel: #0a0a12;
        --primary: #00f3ff;
        --secondary: #ff0055;
        --accent: #fcee0a;
        --text-main: #e6f1ff;
        --text-dim: #6c7a96;
        --font-mono: 'Courier New', Courier, monospace;
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: var(--font-ui);
        /* Deep ambient background */
        background: radial-gradient(circle at 50% 120%, #1a1a2e 0%, #000 70%);
    }

    /* --- CRT & ATMOSPHERE --- */
    .scanlines {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 100;
    }
    
    .vignette {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
        pointer-events: none;
        z-index: 99;
    }

    /* --- MAIN INTERFACE --- */
    .interface-container {
        position: relative;
        width: 90vw;
        max-width: 900px;
        aspect-ratio: 16/9;
        max-height: 80vh;
        background: var(--bg-panel);
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 
            0 0 0 1px #000,
            0 30px 60px rgba(0,0,0,0.6),
            0 0 40px rgba(0, 243, 255, 0.05);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-radius: 4px;
    }

    /* --- HUD --- */
    .hud {
        height: 80px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 40px;
        background: linear-gradient(to bottom, #0f1016, #0a0a12);
        position: relative;
        z-index: 10;
    }

    .hud::after {
        content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 1px;
        background: linear-gradient(90deg, transparent, var(--primary), transparent);
        opacity: 0.5;
    }

    .hud-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .hud-label {
        font-family: var(--font-mono);
        font-size: 0.65rem;
        color: var(--text-dim);
        letter-spacing: 1.5px;
        text-transform: uppercase;
    }

    .hud-value {
        font-family: var(--font-mono);
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--text-main);
        text-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        letter-spacing: -1px;
    }

    .hud-value.highlight { color: var(--accent); text-shadow: 0 0 10px rgba(252, 238, 10, 0.3); }
    .hud-value.danger { color: var(--secondary); text-shadow: 0 0 10px rgba(255, 0, 85, 0.3); }

    .system-status {
        display: flex; align-items: center; gap: 10px;
    }

    .status-dot {
        width: 8px; height: 8px; background: var(--primary);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--primary);
        animation: pulse 2s infinite;
    }

    /* --- GAME VIEWPORT --- */
    .viewport {
        flex-grow: 1;
        position: relative;
        overflow: hidden;
        background: linear-gradient(to bottom, #0b0c10 0%, #12121a 100%);
    }

    /* Parallax Backgrounds */
    .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    
    .grid-floor {
        position: absolute; bottom: 0; left: 0; width: 200%; height: 40%;
        background-image: 
            linear-gradient(rgba(0, 243, 255, 0.1) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 243, 255, 0.1) 1px, transparent 1px);
        background-size: 40px 40px;
        transform: perspective(400px) rotateX(60deg) translateY(100px) translateZ(-100px);
        transform-origin: bottom center;
        animation: gridMove 1s linear infinite;
        mask-image: linear-gradient(to top, rgba(0,0,0,1), transparent);
    }

    .mountain-silhouette {
        position: absolute; bottom: 20%; left: 0; width: 200%; height: 150px;
        background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" preserveAspectRatio="none"><path d="M0,150 L150,50 L300,150 L450,80 L600,150 L750,20 L1000,150 Z" fill="%23151520"/></svg>');
        background-size: 50% 100%;
        opacity: 0.6;
    }

    /* Ground Line */
    .ground-line {
        position: absolute; bottom: 0; left: 0; width: 100%; height: 2px;
        background: var(--primary);
        box-shadow: 0 0 15px var(--primary), 0 0 30px var(--primary);
        z-index: 5;
    }

    /* --- ENTITIES --- */
    .entity { position: absolute; will-change: transform; }

    /* Player */
    .player {
        bottom: 0; left: 10%;
        width: 40px; height: 40px;
        color: var(--primary);
        z-index: 20;
        filter: drop-shadow(0 0 8px var(--primary));
    }
    
    .player svg { width: 100%; height: 100%; fill: currentColor; }
    
    /* Obstacles */
    .obstacle {
        color: var(--secondary);
        filter: drop-shadow(0 0 5px var(--secondary));
    }
    .obstacle svg { width: 100%; height: 100%; fill: currentColor; }

    /* --- OVERLAYS --- */
    .overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        background: rgba(5, 5, 8, 0.85);
        backdrop-filter: blur(8px);
        z-index: 50;
        transition: opacity 0.4s ease;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }

    .title {
        font-family: var(--font-mono);
        font-size: 3rem; font-weight: 900;
        letter-spacing: 10px;
        color: #fff;
        text-transform: uppercase;
        text-shadow: 4px 0 var(--secondary), -4px 0 var(--primary);
        margin-bottom: 20px;
        position: relative;
    }

    .btn-start {
        margin-top: 30px;
        padding: 12px 30px;
        background: transparent;
        border: 1px solid var(--text-dim);
        color: var(--text-main);
        font-family: var(--font-mono);
        font-size: 1rem;
        letter-spacing: 2px;
        cursor: pointer;
        transition: all 0.2s;
        position: relative;
        overflow: hidden;
    }
    
    .btn-start:hover {
        border-color: var(--primary);
        box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        text-shadow: 0 0 5px var(--primary);
    }

    .instruction {
        margin-top: 15px;
        color: var(--text-dim);
        font-size: 0.8rem;
        letter-spacing: 2px;
    }

    /* --- ANIMATIONS --- */
    @keyframes gridMove {
        0% { transform: perspective(400px) rotateX(60deg) translateY(100px) translateZ(-100px) translateX(0); }
        100% { transform: perspective(400px) rotateX(60deg) translateY(100px) translateZ(-100px) translateX(-40px); }
    }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    @keyframes glitch-anim {
        0% { transform: translate(0) }
        20% { transform: translate(-2px, 2px) }
        40% { transform: translate(-2px, -2px) }
        60% { transform: translate(2px, 2px) }
        80% { transform: translate(2px, -2px) }
        100% { transform: translate(0) }
    }

    .shake { animation: glitch-anim 0.3s cubic-bezier(.36,.07,.19,.97) both; }

</style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div class="interface-container" id="gameFrame">
        
        <!-- HUD -->
        <div class="hud">
            <div class="system-status">
                <div class="status-dot"></div>
                <span class="hud-label" style="color:var(--accent)">SYS.ONLINE</span>
            </div>

            <div class="hud-group" style="align-items: center;">
                <span class="hud-label">Score</span>
                <span class="hud-value" id="scoreDisplay">0000</span>
            </div>

            <div class="hud-group" style="align-items: center;">
                <span class="hud-label">High Score</span>
                <span class="hud-value highlight" id="highScoreDisplay">0420</span>
            </div>

            <div class="hud-group" style="align-items: flex-end;">
                <span class="hud-label">Velocity</span>
                <div style="display: flex; align-items: baseline;">
                    <span class="hud-value danger" id="speedDisplay">00</span>
                    <span style="font-size: 0.8rem; color: var(--text-dim); margin-left: 4px;">KM/H</span>
                </div>
            </div>
        </div>

        <!-- GAME VIEWPORT -->
        <div class="viewport" id="gameArea">
            
            <!-- Background Layers -->
            <div class="layer mountain-silhouette" id="bgMountains"></div>
            <div class="layer grid-floor"></div>
            <div class="ground-line"></div>

            <!-- Player -->
            <div class="entity player" id="player">
                <!-- Stylized Dino SVG -->
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21,7 H19 V5 H15 V3 H13 V1 H9 V3 H7 V5 H3 V9 H5 V13 H3 V17 H5 V21 H9 V19 H13 V23 H17 V19 H21 V15 H23 V11 H21 V7 Z" />
                </svg>
            </div>

            <!-- Obstacles -->
            <div id="obstacleLayer"></div>

            <!-- UI Overlay -->
            <div class="overlay" id="uiOverlay">
                <div class="title">NEON RUNNER</div>
                <div class="instruction" id="statusText">SYSTEM READY</div>
                <button class="btn-start" id="startBtn">INITIALIZE</button>
            </div>
        </div>
    </div>

<script>
    // --- CONFIGURATION ---
    const CONFIG = {
        gravity: 0.7,
        jumpForce: 15,
        startSpeed: 8,
        maxSpeed: 28,
        spawnMin: 1200,
        spawnMax: 2800
    };

    // --- STATE ---
    let state = {
        isPlaying: false,
        isGameOver: false,
        score: 0,
        highScore: 420,
        speed: CONFIG.startSpeed,
        lastTime: 0,
        spawnTimer: 0,
        playerY: 0,
        playerVY: 0,
        isJumping: false
    };

    // --- DOM REFS ---
    const els = {
        frame: document.getElementById('gameFrame'),
        player: document.getElementById('player'),
        obstacleLayer: document.getElementById('obstacleLayer'),
        score: document.getElementById('scoreDisplay'),
        highScore: document.getElementById('highScoreDisplay'),
        speed: document.getElementById('speedDisplay'),
        overlay: document.getElementById('uiOverlay'),
        statusText: document.getElementById('statusText'),
        startBtn: document.getElementById('startBtn'),
        mountains: document.getElementById('bgMountains')
    };

    let obstacles = [];
    let animationId;

    // --- ASSETS (SVG Paths) ---
    const SVGS = {
        cactus: `<svg viewBox="0 0 24 24"><path d="M10,24 V10 H6 V6 H10 V0 H14 V6 H18 V10 H14 V24 Z" /></svg>`,
        bird: `<svg viewBox="0 0 24 24"><path d="M4,12 L10,6 L14,10 L18,4 L20,8 L14,14 L10,10 Z" /></svg>`
    };

    // --- CORE FUNCTIONS ---

    function init() {
        state.score = 0;
        state.speed = CONFIG.startSpeed;
        state.isGameOver = false;
        state.isPlaying = false;
        state.playerY = 0;
        state.playerVY = 0;
        state.isJumping = false;

        els.obstacleLayer.innerHTML = '';
        obstacles = [];

        updateHUD();
        els.overlay.classList.remove('hidden');
        els.statusText.innerText = "SYSTEM READY";
        els.startBtn.innerText = "INITIALIZE";
        els.frame.classList.remove('shake');
        els.player.style.transform = `translateY(0px)`;
        els.player.style.opacity = '0.5'; // Dim when not playing
    }

    function startGame() {
        state.isPlaying = true;
        state.lastTime = performance.now();
        els.overlay.classList.add('hidden');
        els.player.style.opacity = '1';
        requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        state.isPlaying = false;
        state.isGameOver = true;
        els.frame.classList.add('shake');
        
        if (state.score > state.highScore) {
            state.highScore = Math.floor(state.score);
            els.highScore.innerText = state.highScore.toString().padStart(4, '0');
        }

        els.statusText.innerText = "CRITICAL FAILURE";
        els.startBtn.innerText = "REBOOT SYSTEM";
        els.overlay.classList.remove('hidden');
        els.player.style.opacity = '0.5';
    }

    function jump() {
        if (!state.isPlaying && !state.isGameOver) {
            startGame();
            return;
        }
        if (state.isGameOver) {
            init();
            return;
        }

        if (!state.isJumping) {
            state.isJumping = true;
            state.playerVY = CONFIG.jumpForce;
        }
    }

    // --- GAME LOOP ---

    function gameLoop(timestamp) {
        if (!state.isPlaying) return;

        const dt = timestamp - state.lastTime;
        state.lastTime = timestamp;

        updatePhysics();
        updateObstacles(dt);
        checkCollisions();
        updateHUD();

        requestAnimationFrame(gameLoop);
    }

    function updatePhysics() {
        state.playerY += state.playerVY;
        state.playerVY -= CONFIG.gravity;

        if (state.playerY <= 0) {
            state.playerY = 0;
            state.playerVY = 0;
            state.isJumping = false;
        }

        // Visuals: Invert Y for CSS translate
        els.player.style.transform = `translateY(${-state.playerY}px)`;
        
        // Parallax Mountains
        const mountainOffset = -(state.score * 0.5) % 500;
        els.mountains.style.transform = `translateX(${mountainOffset}px)`;
    }

    function updateObstacles(dt) {
        state.spawnTimer += dt;
        const currentSpawnRate = Math.max(CONFIG.spawnMin, CONFIG.spawnMax - (state.speed * 30));
        
        if (state.spawnTimer > currentSpawnRate) {
            spawnObstacle();
            state.spawnTimer = 0;
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.x -= state.speed;
            obs.el.style.transform = `translateX(${obs.x}px)`;

            if (obs.x < -100) {
                obs.el.remove();
                obstacles.splice(i, 1);
                state.score += 10;
                
                if (state.speed < CONFIG.maxSpeed) {
                    state.speed += 0.02;
                }
            }
        }
    }

    function spawnObstacle() {
        const type = Math.random() > 0.7 ? 'bird' : 'cactus';
        const el = document.createElement('div');
        el.className = `entity obstacle ${type}`;
        el.innerHTML = SVGS[type];
        
        // Initial Position (Right side of viewport)
        const startX = els.gameArea.clientWidth || 900; 
        el.style.transform = `translateX(${startX}px)`;
        
        // Dimensions
        let width = 30, height = 50, yOffset = 0;
        if (type === 'bird') {
            width = 40; height = 30; yOffset = 90; // Flying height
        }
        
        el.style.bottom = `${yOffset}px`;

        els.obstacleLayer.appendChild(el);

        obstacles.push({
            el: el,
            x: startX,
            type: type,
            width: width,
            height: height,
            yOffset: yOffset
        });
    }

    function checkCollisions() {
        // Player Hitbox
        const pX = 10 + 5; // 10% of viewport approx + margin
        const pW = 30; 
        const pH = 40; 
        const pY = state.playerY; 

        for (let obs of obstacles) {
            // Obstacle Hitbox
            const oX = obs.x + 5;
            const oW = obs.width - 10;
            const oH = obs.height;
            const oY = obs.yOffset;

            // AABB
            const hCol = (pX < oX + oW) && (pX + pW > oX);
            const vCol = (pY < oY + oH) && (pY + pH > oY);

            if (hCol && vCol) {
                gameOver();
                break;
            }
        }
    }

    function updateHUD() {
        els.score.innerText = Math.floor(state.score).toString().padStart(4, '0');
        els.speed.innerText = Math.floor(state.speed * 3).toString().padStart(2, '0');
    }

    // --- INPUT ---
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            jump();
        }
    });

    els.startBtn.addEventListener('click', jump);

    // Touch support
    window.addEventListener('touchstart', (e) => {
        e.preventDefault();
        jump();
    }, {passive: false});

    // --- BOOT ---
    init();

</script>
</body>
</html>
