<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON RUNNER // SYSTEM ONLINE</title>
<style>
    :root {
        --bg-dark: #050505;
        --bg-panel: #0b0c10;
        --neon-cyan: #00f3ff;
        --neon-pink: #ff0055;
        --neon-yellow: #fcee0a;
        --text-dim: #8892b0;
        --text-bright: #e6f1ff;
        
        --font-stack: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

    body {
        background-color: var(--bg-dark);
        color: var(--text-bright);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        /* Subtle background grid for depth */
        background-image: 
            radial-gradient(circle at 50% 50%, #111 0%, #000 100%);
    }

    /* --- CRT / SCANLINE OVERLAY --- */
    .crt-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
        z-index: 999;
        opacity: 0.6;
    }
    
    .vignette {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
        pointer-events: none;
        z-index: 998;
    }

    /* --- MAIN DEVICE CONTAINER --- */
    .device-frame {
        position: relative;
        width: 95vw;
        max-width: 1000px;
        height: 70vh;
        max-height: 600px;
        background: var(--bg-panel);
        border: 1px solid #333;
        box-shadow: 
            0 0 0 1px #000,
            0 20px 50px rgba(0,0,0,0.8),
            0 0 20px rgba(0, 243, 255, 0.1); /* Subtle glow */
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* --- HUD --- */
    .hud-bar {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 20px 30px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        background: linear-gradient(to bottom, rgba(0,0,0,0.2), transparent);
        z-index: 10;
    }

    .hud-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .hud-label {
        font-size: 0.7rem;
        color: var(--text-dim);
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    .hud-value {
        font-size: 1.5rem;
        font-weight: bold;
        color: var(--text-bright);
        text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        font-variant-numeric: tabular-nums;
    }

    .hud-value.highlight {
        color: var(--neon-yellow);
        text-shadow: 0 0 8px rgba(252, 238, 10, 0.4);
    }

    .speed-box {
        text-align: right;
    }
    
    .speed-val {
        color: var(--neon-pink);
        font-size: 1.8rem;
        font-weight: 800;
        text-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
    }

    .speed-unit {
        font-size: 0.8rem;
        color: var(--text-dim);
        vertical-align: super;
        margin-left: 4px;
    }

    /* --- STATUS INDICATOR --- */
    .status-indicator {
        position: absolute;
        top: 20px;
        left: 30px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.65rem;
        color: var(--neon-yellow);
        opacity: 0.8;
        z-index: 11;
        transform: translateY(-25px); /* Slight offset */
    }
    
    .led {
        width: 6px;
        height: 6px;
        background-color: var(--neon-yellow);
        border-radius: 50%;
        box-shadow: 0 0 5px var(--neon-yellow);
        animation: blink 2s infinite;
    }

    /* --- GAME VIEWPORT --- */
    .game-viewport {
        position: relative;
        flex-grow: 1;
        background: linear-gradient(to bottom, #0b0c10 0%, #151820 100%);
        overflow: hidden;
        perspective: 1000px;
    }

    /* --- BACKGROUND LAYERS (Parallax) --- */
    .bg-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
    }

    .stars {
        background-image: 
            radial-gradient(white 1px, transparent 1px),
            radial-gradient(white 1px, transparent 1px);
        background-size: 50px 50px;
        background-position: 0 0, 25px 25px;
        opacity: 0.1;
    }

    .mountains {
        bottom: 60px; top: auto; height: 200px;
        background: 
            linear-gradient(135deg, transparent 33%, #1a1d29 33%, #1a1d29 66%, transparent 66%),
            linear-gradient(225deg, transparent 33%, #1a1d29 33%, #1a1d29 66%, transparent 66%);
        background-size: 100px 200px;
        opacity: 0.3;
        transform: translateZ(-100px) scale(1.2);
    }

    /* --- GROUND --- */
    .ground {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 60px;
        background: #050505;
        border-top: 2px solid var(--neon-cyan);
        box-shadow: 0 -10px 30px rgba(0, 243, 255, 0.15);
        z-index: 5;
    }

    /* Grid floor effect */
    .ground::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 200%; height: 100%;
        background-image: linear-gradient(90deg, rgba(0, 243, 255, 0.3) 1px, transparent 1px);
        background-size: 50px 100%;
        transform: perspective(200px) rotateX(60deg) translateY(20px) translateZ(-20px);
        animation: gridScroll 1s linear infinite;
    }

    /* --- CHARACTERS & OBSTACLES --- */
    .entity {
        position: absolute;
        bottom: 60px; /* Ground level */
        will-change: transform;
        filter: drop-shadow(0 0 5px currentColor);
    }

    /* Player Dino */
    .player {
        left: 80px;
        width: 50px;
        height: 50px;
        color: var(--neon-cyan);
        z-index: 20;
        transition: transform 0.1s;
    }
    
    .player svg { width: 100%; height: 100%; fill: currentColor; }
    
    .player.jumping { animation: jump-anim 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
    .player.running { animation: run-anim 0.3s infinite alternate; }

    /* Obstacles */
    .obstacle {
        color: var(--neon-pink);
        z-index: 15;
    }
    
    .obstacle svg { width: 100%; height: 100%; fill: currentColor; }

    .obstacle.bird {
        bottom: 150px; /* Flying height */
        width: 40px; height: 30px;
    }
    
    .obstacle.cactus {
        width: 30px; height: 50px;
    }

    /* --- UI OVERLAYS --- */
    .overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(5, 5, 5, 0.7);
        backdrop-filter: blur(4px);
        z-index: 50;
        transition: opacity 0.3s ease;
    }

    .overlay.hidden { opacity: 0; pointer-events: none; }

    .title-text {
        font-size: 2.5rem;
        font-weight: 900;
        letter-spacing: 8px;
        color: #fff;
        text-transform: uppercase;
        margin-bottom: 10px;
        text-shadow: 2px 2px 0px var(--neon-pink), -2px -2px 0px var(--neon-cyan);
    }

    .sub-text {
        font-size: 1rem;
        color: var(--text-dim);
        letter-spacing: 2px;
        margin-bottom: 20px;
    }

    .key-hint {
        border: 2px solid var(--text-dim);
        padding: 8px 20px;
        border-radius: 4px;
        color: #fff;
        font-weight: bold;
        background: rgba(255,255,255,0.05);
        box-shadow: 0 4px 0 rgba(0,0,0,0.5);
        animation: pulse 2s infinite;
    }

    /* --- ANIMATIONS --- */
    @keyframes gridScroll {
        0% { background-position: 0 0; }
        100% { background-position: -50px 0; }
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    
    @keyframes run-anim {
        0% { transform: translateY(0) skewX(0deg); }
        100% { transform: translateY(-2px) skewX(-2deg); }
    }

    @keyframes jump-anim {
        0% { bottom: 60px; }
        50% { bottom: 220px; }
        100% { bottom: 60px; }
    }

    @keyframes pulse {
        0% { transform: scale(1); box-shadow: 0 4px 0 rgba(0,0,0,0.5); }
        50% { transform: scale(1.05); box-shadow: 0 6px 0 rgba(0,0,0,0.5); }
        100% { transform: scale(1); box-shadow: 0 4px 0 rgba(0,0,0,0.5); }
    }

    @keyframes crash-shake {
        0% { transform: translate(1px, 1px) rotate(0deg); }
        10% { transform: translate(-1px, -2px) rotate(-1deg); }
        20% { transform: translate(-3px, 0px) rotate(1deg); }
        30% { transform: translate(3px, 2px) rotate(0deg); }
        40% { transform: translate(1px, -1px) rotate(1deg); }
        50% { transform: translate(-1px, 2px) rotate(-1deg); }
        60% { transform: translate(-3px, 1px) rotate(0deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
    }

    .shake { animation: crash-shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

</style>
</head>
<body>

    <div class="crt-overlay"></div>
    <div class="vignette"></div>

    <div class="device-frame" id="gameFrame">
        
        <!-- HUD -->
        <div class="hud-bar">
            <div class="status-indicator">
                <div class="led"></div>
                <span>SYSTEM: NOMINAL</span>
            </div>
            
            <div class="hud-group">
                <span class="hud-label">Score</span>
                <span class="hud-value" id="scoreDisplay">0000</span>
            </div>

            <div class="hud-group" style="align-items: center;">
                <span class="hud-label">Best</span>
                <span class="hud-value highlight" id="highScoreDisplay">0420</span>
            </div>

            <div class="hud-group speed-box">
                <span class="hud-label">Velocity</span>
                <span class="speed-val" id="speedDisplay">12</span>
                <span class="speed-unit">KM/H</span>
            </div>
        </div>

        <!-- GAME AREA -->
        <div class="game-viewport" id="gameArea">
            <!-- Parallax Backgrounds -->
            <div class="bg-layer stars"></div>
            <div class="bg-layer mountains" id="bgMountains"></div>

            <!-- Ground -->
            <div class="ground"></div>

            <!-- Player -->
            <div class="entity player" id="player">
                <!-- Clean, geometric D-Sprite -->
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20,6 H18 V4 H14 V2 H12 V0 H8 V2 H6 V4 H2 V8 H4 V12 H2 V16 H4 V20 H8 V18 H12 V22 H16 V18 H20 V14 H22 V10 H20 V6 Z" />
                </svg>
            </div>

            <!-- Obstacles Container -->
            <div id="obstacleLayer"></div>

            <!-- Start/Game Over Overlay -->
            <div class="overlay" id="uiOverlay">
                <div class="title-text">NEON RUNNER</div>
                <div class="sub-text" id="statusText">PRESS SPACE TO INITIATE</div>
                <div class="key-hint">SPACE</div>
            </div>
        </div>
    </div>

<script>
    // --- CONFIGURATION ---
    const CONFIG = {
        gravity: 0.65,
        jumpForce: 14,
        startSpeed: 7,
        maxSpeed: 25,
        spawnRateMin: 1000,
        spawnRateMax: 2500
    };

    // --- STATE ---
    let state = {
        isPlaying: false,
        isGameOver: false,
        score: 0,
        highScore: 0,
        speed: CONFIG.startSpeed,
        lastTime: 0,
        spawnTimer: 0,
        playerY: 0,
        playerVY: 0,
        isJumping: false
    };

    // --- DOM REFS ---
    const els = {
        frame: document.getElementById('gameFrame'),
        player: document.getElementById('player'),
        obstacleLayer: document.getElementById('obstacleLayer'),
        score: document.getElementById('scoreDisplay'),
        highScore: document.getElementById('highScoreDisplay'),
        speed: document.getElementById('speedDisplay'),
        overlay: document.getElementById('uiOverlay'),
        statusText: document.getElementById('statusText'),
        mountains: document.getElementById('bgMountains')
    };

    let obstacles = [];
    let animationId;

    // --- ASSETS ---
    // Simple SVG paths for obstacles
    const SVGS = {
        cactus: `<svg viewBox="0 0 24 24"><path d="M10,24 V10 H6 V6 H10 V0 H14 V6 H18 V10 H14 V24 Z" /></svg>`,
        bird: `<svg viewBox="0 0 24 24"><path d="M4,12 L10,6 L14,10 L18,4 L20,8 L14,14 L10,10 Z" /></svg>`
    };

    // --- CORE FUNCTIONS ---

    function init() {
        // Reset State
        state.score = 0;
        state.speed = CONFIG.startSpeed;
        state.isGameOver = false;
        state.isPlaying = false;
        state.playerY = 0;
        state.playerVY = 0;
        state.isJumping = false;

        // Clear Obstacles
        els.obstacleLayer.innerHTML = '';
        obstacles = [];

        // UI Reset
        updateHUD();
        els.overlay.classList.remove('hidden');
        els.statusText.innerText = "PRESS SPACE TO INITIATE";
        els.frame.classList.remove('shake');
        els.player.classList.remove('running');
        els.player.style.transform = `translateY(0px)`;
    }

    function startGame() {
        state.isPlaying = true;
        state.lastTime = performance.now();
        els.overlay.classList.add('hidden');
        els.player.classList.add('running');
        requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        state.isPlaying = false;
        state.isGameOver = true;
        els.player.classList.remove('running');
        els.frame.classList.add('shake');
        
        // Update High Score
        if (state.score > state.highScore) {
            state.highScore = Math.floor(state.score);
            els.highScore.innerText = state.highScore.toString().padStart(4, '0');
        }

        els.statusText.innerText = "SYSTEM FAILURE // REBOOT?";
        els.overlay.classList.remove('hidden');
    }

    function jump() {
        if (!state.isPlaying && !state.isGameOver) {
            startGame();
            return;
        }
        if (state.isGameOver) {
            init();
            return;
        }

        if (!state.isJumping) {
            state.isJumping = true;
            state.playerVY = CONFIG.jumpForce;
            els.player.classList.remove('running'); // Stop running anim while in air
            els.player.classList.add('jumping');
            
            // Remove jumping class after animation finishes to allow re-trigger
            setTimeout(() => {
                els.player.classList.remove('jumping');
                if(state.isPlaying) els.player.classList.add('running');
            }, 600);
        }
    }

    // --- GAME LOOP ---

    function gameLoop(timestamp) {
        if (!state.isPlaying) return;

        const dt = timestamp - state.lastTime;
        state.lastTime = timestamp;

        updatePhysics();
        updateObstacles(dt);
        checkCollisions();
        updateHUD();

        requestAnimationFrame(gameLoop);
    }

    function updatePhysics() {
        // Jump Physics
        state.playerY += state.playerVY;
        state.playerVY -= CONFIG.gravity;

        // Ground Hit
        if (state.playerY <= 0) {
            state.playerY = 0;
            state.playerVY = 0;
            state.isJumping = false;
        }

        // Apply visual transform (inverted because CSS translateY goes up with negative)
        els.player.style.transform = `translateY(${-state.playerY}px)`;
    }

    function updateObstacles(dt) {
        // Spawn Logic
        state.spawnTimer += dt;
        const currentSpawnRate = Math.max(CONFIG.spawnRateMin, CONFIG.spawnRateMax - (state.speed * 20));
        
        if (state.spawnTimer > currentSpawnRate) {
            spawnObstacle();
            state.spawnTimer = 0;
        }

        // Move Obstacles
        // Move background mountains slightly for parallax
        els.mountains.style.transform = `translateX(${-state.speed * 0.5}px)`;

        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.x -= state.speed;
            obs.el.style.transform = `translateX(${obs.x}px)`;

            // Cleanup
            if (obs.x < -100) {
                obs.el.remove();
                obstacles.splice(i, 1);
                state.score += 10;
                
                // Speed ramp up
                if (state.speed < CONFIG.maxSpeed) {
                    state.speed += 0.05;
                }
            }
        }
    }

    function spawnObstacle() {
        const type = Math.random() > 0.7 ? 'bird' : 'cactus';
        const el = document.createElement('div');
        el.className = `entity obstacle ${type}`;
        el.innerHTML = SVGS[type];
        
        // Initial Position
        const startX = 1000; // Off screen right
        el.style.transform = `translateX(${startX}px)`;
        
        els.obstacleLayer.appendChild(el);

        obstacles.push({
            el: el,
            x: startX,
            type: type,
            width: type === 'bird' ? 40 : 30,
            height: type === 'bird' ? 30 : 50,
            yOffset: type === 'bird' ? 150 : 60 // Bird is higher
        });
    }

    function checkCollisions() {
        // Player Hitbox (approximate)
        const pX = 80 + 10; // Left padding
        const pW = 30; // Width forgiveness
        const pH = 50;
        const pY = state.playerY; // Height from ground

        for (let obs of obstacles) {
            // Obstacle Hitbox
            const oX = obs.x + 5;
            const oW = obs.width - 10;
            const oH = obs.height;
            const oY = obs.type === 'bird' ? 90 : 0; // Bird is floating higher

            // AABB Collision
            // Note: Y is relative to ground (0), so we check overlap on Y axis
            // Player Top: pY + pH. Player Bottom: pY
            // Obs Top: oY + oH. Obs Bottom: oY
            
            const horizontalCollision = (pX < oX + oW) && (pX + pW > oX);
            const verticalCollision = (pY < oY + oH) && (pY + pH > oY);

            if (horizontalCollision && verticalCollision) {
                gameOver();
                break;
            }
        }
    }

    function updateHUD() {
        els.score.innerText = Math.floor(state.score).toString().padStart(4, '0');
        els.speed.innerText = Math.floor(state.speed * 2); // Fake KM/H scaling
    }

    // --- INPUT ---
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault(); // Prevent scrolling
            jump();
        }
    });

    // Touch support for mobile
    window.addEventListener('touchstart', (e) => {
        e.preventDefault();
        jump();
    }, {passive: false});

    // --- BOOT ---
    init();

</script>
</body>
</html>
