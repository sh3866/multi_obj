<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Architecture Topology</title>
<style>
    :root {
        --bg-dark: #020617;
        --bg-panel: #0f172a;
        --bg-panel-hover: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #64748b;
        
        /* Palette - Neon/Technical */
        --c-instruction: #d946ef; /* Fuchsia */
        --c-data: #0ea5e9;        /* Sky Blue */
        --c-control: #10b981;     /* Emerald */
        --c-io: #f59e0b;          /* Amber */
        
        --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background-color: var(--bg-dark);
        /* Technical Grid Pattern */
        background-image: 
            radial-gradient(circle at center, rgba(148, 163, 184, 0.1) 1px, transparent 1px),
            linear-gradient(rgba(148, 163, 184, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(148, 163, 184, 0.05) 1px, transparent 1px);
        background-size: 30px 30px, 30px 30px, 30px 30px;
        color: var(--text-main);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* UI Overlay */
    .ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    header {
        align-self: flex-start;
    }

    h1 {
        font-size: 3rem;
        font-weight: 800;
        letter-spacing: -0.05em;
        margin-bottom: 0.25rem;
        color: #fff;
        text-shadow: 0 0 20px rgba(255,255,255,0.1);
    }

    .subtitle {
        color: var(--text-muted);
        font-size: 0.9rem;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        border-left: 4px solid var(--c-data);
        padding-left: 16px;
        background: linear-gradient(90deg, rgba(14, 165, 233, 0.1), transparent);
    }

    .legend-container {
        align-self: flex-start;
        background: rgba(2, 6, 23, 0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 16px 32px;
        border-radius: 100px; /* Pill shape */
        border: 1px solid rgba(255,255,255,0.1);
        display: flex;
        gap: 32px;
        box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7);
        pointer-events: auto;
        margin-bottom: 20px;
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--text-muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transition: color 0.3s;
    }
    
    .legend-item:hover { color: var(--text-main); }

    .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        position: relative;
        box-shadow: 0 0 10px currentColor;
    }

    /* SVG Container */
    #diagram-container {
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 1;
    }

    svg {
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    /* Component Styles */
    .component-group {
        cursor: pointer;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .component-group:hover {
        transform: translateY(-5px);
    }

    .comp-bg {
        fill: rgba(15, 23, 42, 0.9);
        stroke-width: 2;
        rx: 20;
        filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
        transition: all 0.3s ease;
    }
    
    .component-group:hover .comp-bg {
        fill: var(--bg-panel-hover);
        stroke-width: 2;
        filter: drop-shadow(0 0 25px rgba(255,255,255,0.15));
    }

    .comp-icon {
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .comp-label {
        fill: var(--text-main);
        font-size: 20px;
        font-weight: 800;
        text-anchor: middle;
        font-family: var(--font-stack);
        letter-spacing: -0.03em;
    }

    .comp-sub {
        fill: var(--text-muted);
        font-size: 11px;
        text-anchor: middle;
        font-family: var(--font-stack);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        font-weight: 600;
        opacity: 0.8;
    }

    /* Connection Styles */
    .path-bg {
        fill: none;
        stroke: rgba(255,255,255,0.03);
        stroke-width: 4;
        stroke-linecap: round;
    }

    .path-active {
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: 8 16;
        opacity: 0.3;
        animation: dash 3s linear infinite;
    }

    /* Flow Particles */
    .particle {
        fill: none;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-dasharray: 10 150; /* Single head */
        filter: url(#glow);
        opacity: 0.8;
    }

    /* Animations */
    @keyframes dash {
        to { stroke-dashoffset: -48; }
    }
    
    @keyframes flow-particle {
        0% { stroke-dashoffset: 150; }
        100% { stroke-dashoffset: 0; }
    }

    .p-instruction { stroke: var(--c-instruction); animation: flow-particle 2.5s linear infinite; }
    .p-data { stroke: var(--c-data); animation: flow-particle 3s linear infinite; }
    .p-control { stroke: var(--c-control); animation: flow-particle 2s linear infinite; }
    .p-io { stroke: var(--c-io); animation: flow-particle 2.8s linear infinite; }

    /* Dimming Logic */
    .dimmed {
        opacity: 0.15 !important;
        transition: opacity 0.4s ease;
        filter: grayscale(1);
    }
    
    .highlighted {
        opacity: 1 !important;
        filter: drop-shadow(0 0 8px currentColor);
    }
    
    .highlighted .path-bg {
        stroke: rgba(255,255,255,0.1);
        stroke-width: 6;
    }

</style>
</head>
<body>

    <div class="ui-layer">
        <header>
            <h1>SYSTEM ARCHITECTURE</h1>
            <div class="subtitle">Information Flow &amp; Component Topology</div>
        </header>

        <div class="legend-container">
            <div class="legend-item">
                <div class="dot" style="background-color: var(--c-instruction); color: var(--c-instruction)"></div>
                <span>Instructions</span>
            </div>
            <div class="legend-item">
                <div class="dot" style="background-color: var(--c-data); color: var(--c-data)"></div>
                <span>Data</span>
            </div>
            <div class="legend-item">
                <div class="dot" style="background-color: var(--c-control); color: var(--c-control)"></div>
                <span>Control</span>
            </div>
            <div class="legend-item">
                <div class="dot" style="background-color: var(--c-io); color: var(--c-io)"></div>
                <span>I/O Stream</span>
            </div>
        </div>
    </div>

    <div id="diagram-container">
        <svg id="main-svg" viewBox="0 0 1100 800" preserveAspectRatio="xMidYMid meet">
            <defs>
                <!-- Improved Glow Filter -->
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="4" result="blur" />
                    <feMerge>
                        <feMergeNode in="blur" />
                        <feMergeNode in="blur" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
                
                <!-- Drop Shadow for Cards -->
                <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
                </filter>
            </defs>
            
            <g id="paths-layer"></g>
            <g id="particles-layer"></g>
            <g id="components-layer"></g>
        </svg>
    </div>

<script>
    // --- Configuration ---
    const svg = document.getElementById('main-svg');
    const pathsLayer = document.getElementById('paths-layer');
    const particlesLayer = document.getElementById('particles-layer');
    const componentsLayer = document.getElementById('components-layer');

    const createSVG = (tag, attrs) => {
        const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
        return el;
    };

    // --- Data Definitions ---
    
    // Component Positions (x, y center) - Expanded layout for breathing room
    const components = [
        { id: 'cpu', label: 'CPU', sub: 'Central Processing', x: 550, y: 400, color: 'var(--c-instruction)', icon: 'cpu' },
        { id: 'ram', label: 'Memory', sub: 'High Speed RAM', x: 550, y: 180, color: 'var(--c-data)', icon: 'ram' },
        { id: 'gpu', label: 'GPU', sub: 'Graphics Processing', x: 850, y: 400, color: 'var(--c-data)', icon: 'gpu' },
        { id: 'storage', label: 'Storage', sub: 'NVMe SSD', x: 550, y: 620, color: 'var(--c-io)', icon: 'hdd' },
        { id: 'input', label: 'Input', sub: 'Keyboard / Mouse', x: 250, y: 400, color: 'var(--c-control)', icon: 'mouse' },
        { id: 'output', label: 'Output', sub: 'Display / Audio', x: 250, y: 180, color: 'var(--c-control)', icon: 'monitor' },
        { id: 'network', label: 'Network', sub: 'Ethernet / Wi-Fi', x: 250, y: 620, color: 'var(--c-control)', icon: 'wifi' }
    ];

    // Connections
    const connections = [
        { from: 'ram', to: 'cpu', type: 'instruction', label: 'Fetch' },
        { from: 'cpu', to: 'ram', type: 'data', label: 'Store' },
        { from: 'cpu', to: 'gpu', type: 'data', label: 'Render Data' },
        { from: 'gpu', to: 'cpu', type: 'control', label: 'Sync' },
        { from: 'storage', to: 'ram', type: 'data', label: 'Load' },
        { from: 'ram', to: 'storage', type: 'data', label: 'Cache' },
        { from: 'input', to: 'cpu', type: 'control', label: 'Events' },
        { from: 'cpu', to: 'output', type: 'data', label: 'Display' },
        { from: 'network', to: 'cpu', type: 'data', label: 'Packets' },
        { from: 'cpu', to: 'network', type: 'data', label: 'Response' },
        { from: 'storage', to: 'cpu', type: 'data', label: 'Direct' }
    ];

    // --- Drawing Icons ---
    // More detailed, polished icons
    const drawIcon = (id, x, y) => {
        let g = createSVG('g', { transform: `translate(${x-16}, ${y-16})` });
        
        const paths = {
            cpu: "M7 7h12v12H7z M10 10h6v6H10z M13 3v4 M13 17v4 M3 13h4 M17 13h4",
            ram: "M5 5h14v14H5z M5 9h14 M5 13h14 M5 17h14 M8 2v3 M16 2v3 M8 18v3 M16 18v3",
            gpu: "M5 5h14v14H5z M9 13l2-2 2 2 2-2 2 2", // Graph line
            hdd: "M5 5h14v14H5z M12 11a3 3 0 1 0 0 6 3 3 0 0 0 0-6z M12 14a1 1 0 1 0 0 2 1 1 0 0 0 0-2z",
            mouse: "M9 4h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z M12 9v3",
            monitor: "M4 4h16v12H4z M9 20h6 M12 16v4",
            wifi: "M12 18v-2 M8 14a5 5 0 0 1 8 0 M4 10a9 9 0 0 1 16 0"
        };

        g.appendChild(createSVG('path', { 
            d: paths[id], 
            stroke: 'currentColor', 
            'stroke-width': 2, 
            fill: 'none',
            'stroke-linecap': 'round',
            'stroke-linejoin': 'round'
        }));
        
        return g;
    };

    // --- Render Components ---
    const compMap = {};

    components.forEach(c => {
        const g = createSVG('g', { 
            class: 'component-group', 
            transform: `translate(${c.x - 80}, ${c.y - 50})`,
            'data-id': c.id
        });

        const rect = createSVG('rect', { 
            class: 'comp-bg', 
            width: 160, height: 100,
            stroke: c.color,
            filter: 'url(#card-shadow)'
        });
        
        const icon = drawIcon(c.icon, 80, 45);
        icon.style.color = c.color;
        icon.style.filter = `drop-shadow(0 0 6px ${c.color})`;

        const textLabel = createSVG('text', { x: 80, y: 85, class: 'comp-label' });
        textLabel.textContent = c.label;
        
        const textSub = createSVG('text', { x: 80, y: 105, class: 'comp-sub' });
        textSub.textContent = c.sub;

        g.appendChild(rect);
        g.appendChild(icon);
        g.appendChild(textLabel);
        g.appendChild(textSub);
        
        componentsLayer.appendChild(g);
        compMap[c.id] = c;

        // Hover Logic
        g.addEventListener('mouseenter', () => highlightPath(c.id));
        g.addEventListener('mouseleave', () => resetHighlight());
    });

    // --- Render Paths ---
    
    const getPathD = (c1, c2) => {
        // Calculate control points for a smooth S-curve
        const dx = c2.x - c1.x;
        const dy = c2.y - c1.y;
        
        let cp1x = c1.x, cp1y = c1.y;
        let cp2x = c2.x, cp2y = c2.y;

        const dist = Math.sqrt(dx*dx + dy*dy);
        const tension = Math.min(dist * 0.4, 100);

        if (Math.abs(dy) > Math.abs(dx)) {
            cp1y = c1.y + (dy > 0 ? tension : -tension);
            cp2y = c2.y + (dy > 0 ? -tension : tension);
        } else {
            cp1x = c1.x + (dx > 0 ? tension : -tension);
            cp2x = c2.x + (dx > 0 ? -tension : tension);
        }

        return `M ${c1.x} ${c1.y} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${c2.x} ${c2.y}`;
    };

    const pathGroups = {};

    connections.forEach((conn, index) => {
        const start = compMap[conn.from];
        const end = compMap[conn.to];
        
        const g = createSVG('g', { class: 'connection-group', 'data-from': conn.from, 'data-to': conn.to });

        const pathD = getPathD(start, end);
        
        // Invisible hit area for hover detection on lines if needed (optional, currently handled by nodes)
        const bgPath = createSVG('path', {
            d: pathD,
            stroke: 'transparent',
            'stroke-width': 30,
            fill: 'none',
            class: 'hit-area'
        });

        const trackColor = `var(--c-${conn.type})`;
        
        // Visible track
        const visiblePath = createSVG('path', {
            d: pathD,
            class: 'path-bg',
            stroke: trackColor,
            'stroke-opacity': 0.2
        });

        // Dashed moving line
        const activePath = createSVG('path', {
            d: pathD,
            class: 'path-active',
            stroke: trackColor,
            'stroke-dashoffset': index % 2 === 0 ? 0 : 12
        });

        // Glowing particle
        const particle = createSVG('path', {
            d: pathD,
            class: `particle p-${conn.type}`,
            style: `animation-delay: ${Math.random() * 3}s`
        });

        g.appendChild(bgPath);
        g.appendChild(visiblePath);
        g.appendChild(activePath);
        g.appendChild(particle);

        pathsLayer.appendChild(g);
        
        if (!pathGroups[conn.from]) pathGroups[conn.from] = [];
        if (!pathGroups[conn.to]) pathGroups[conn.to] = [];
        pathGroups[conn.from].push(g);
        pathGroups[conn.to].push(g);
    });

    // --- Interactivity ---

    function highlightPath(activeId) {
        document.querySelectorAll('.connection-group').forEach(el => el.classList.add('dimmed'));
        document.querySelectorAll('.component-group').forEach(el => {
            if(el.getAttribute('data-id') !== activeId) el.classList.add('dimmed');
        });

        const connectedGroups = pathGroups[activeId] || [];
        connectedGroups.forEach(g => {
            g.classList.remove('dimmed');
            g.classList.add('highlighted');
            // Extract color variable value for inline style
            const colorVar = g.querySelector('.path-active').getAttribute('stroke');
            g.style.color = colorVar;
        });
    }

    function resetHighlight() {
        document.querySelectorAll('.connection-group').forEach(el => {
            el.classList.remove('dimmed', 'highlighted');
            el.style.color = '';
        });
        document.querySelectorAll('.component-group').forEach(el => el.classList.remove('dimmed'));
    }

</script>
</body>
</html>
