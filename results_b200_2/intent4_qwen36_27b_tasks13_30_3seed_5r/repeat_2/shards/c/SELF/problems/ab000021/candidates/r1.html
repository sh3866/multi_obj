<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Architecture Topology</title>
<style>
    :root {
        --bg-dark: #0f172a;
        --bg-card: #1e293b;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        
        /* Palette */
        --c-instruction: #f472b6; /* Pink */
        --c-data: #38bdf8;        /* Cyan */
        --c-control: #a3e635;     /* Lime */
        --c-io: #fbbf24;          /* Amber */
        
        --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background-color: var(--bg-dark);
        background-image: 
            radial-gradient(circle at center, rgba(56, 189, 248, 0.03) 0%, transparent 70%),
            radial-gradient(circle at 50% 50%, #334155 1px, transparent 1px);
        background-size: 100% 100%, 40px 40px;
        color: var(--text-primary);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* UI Overlay */
    .ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    header {
        align-self: flex-start;
    }

    h1 {
        font-size: 2.2rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin-bottom: 0.5rem;
        text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }

    .subtitle {
        color: var(--text-secondary);
        font-size: 0.95rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    .legend-container {
        align-self: flex-start;
        background: rgba(30, 41, 59, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 16px 24px;
        border-radius: 16px;
        border: 1px solid rgba(255,255,255,0.1);
        display: flex;
        gap: 28px;
        box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        pointer-events: auto;
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-secondary);
        transition: color 0.3s;
    }
    
    .legend-item:hover { color: var(--text-primary); }

    .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        box-shadow: 0 0 8px currentColor;
    }

    /* SVG Container */
    #diagram-container {
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 1;
    }

    svg {
        width: 100%;
        height: 100%;
    }

    /* Component Styles */
    .component-group {
        cursor: pointer;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .component-group:hover {
        transform: scale(1.05);
    }

    .comp-bg {
        fill: rgba(15, 23, 42, 0.85);
        stroke-width: 2;
        rx: 12;
        filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4));
        transition: stroke-width 0.3s, fill 0.3s;
    }
    
    .component-group:hover .comp-bg {
        fill: rgba(30, 41, 59, 0.95);
        stroke-width: 3;
    }

    .comp-icon {
        fill: var(--text-secondary);
        transition: fill 0.3s;
    }

    .component-group:hover .comp-icon {
        fill: var(--text-primary);
    }

    .comp-label {
        fill: var(--text-primary);
        font-size: 16px;
        font-weight: 700;
        text-anchor: middle;
        font-family: var(--font-stack);
        letter-spacing: -0.02em;
    }

    .comp-sub {
        fill: var(--text-secondary);
        font-size: 11px;
        text-anchor: middle;
        font-family: var(--font-stack);
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }

    /* Connection Styles */
    .path-bg {
        fill: none;
        stroke: rgba(255,255,255,0.04);
        stroke-width: 4;
        stroke-linecap: round;
    }

    .path-active {
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: 5 15;
        opacity: 0.6;
        animation: dash 1.5s linear infinite;
    }

    /* Flow Particles */
    .particle {
        fill: none;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 2 100;
        filter: url(#glow);
        opacity: 0.8;
    }

    /* Animations */
    @keyframes dash {
        to { stroke-dashoffset: -20; }
    }
    
    @keyframes flow-particle {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
    }

    .p-instruction { stroke: var(--c-instruction); animation: flow-particle 2s linear infinite; }
    .p-data { stroke: var(--c-data); animation: flow-particle 2.5s linear infinite; }
    .p-control { stroke: var(--c-control); animation: flow-particle 1.8s linear infinite; }
    .p-io { stroke: var(--c-io); animation: flow-particle 2.2s linear infinite; }

    /* Dimming Logic */
    .dimmed {
        opacity: 0.15 !important;
        transition: opacity 0.4s ease;
        filter: grayscale(0.8);
    }
    
    .highlighted {
        opacity: 1 !important;
        filter: drop-shadow(0 0 8px currentColor);
    }

</style>
</head>
<body>

    <div class="ui-layer">
        <header>
            <h1>SYSTEM ARCHITECTURE</h1>
            <div class="subtitle">Information Flow &amp; Component Topology</div>
        </header>

        <div class="legend-container">
            <div class="legend-item">
                <div class="dot" style="background-color: var(--c-instruction); color: var(--c-instruction)"></div>
                <span>Instructions</span>
            </div>
            <div class="legend-item">
                <div class="dot" style="background-color: var(--c-data); color: var(--c-data)"></div>
                <span>Data</span>
            </div>
            <div class="legend-item">
                <div class="dot" style="background-color: var(--c-control); color: var(--c-control)"></div>
                <span>Control</span>
            </div>
            <div class="legend-item">
                <div class="dot" style="background-color: var(--c-io); color: var(--c-io)"></div>
                <span>I/O Stream</span>
            </div>
        </div>
    </div>

    <div id="diagram-container">
        <svg id="main-svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet">
            <defs>
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="4" result="blur" />
                    <feMerge>
                        <feMergeNode in="blur" />
                        <feMergeNode in="blur" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
            </defs>
            
            <g id="paths-layer"></g>
            <g id="particles-layer"></g>
            <g id="components-layer"></g>
        </svg>
    </div>

<script>
    // --- Configuration ---
    const svg = document.getElementById('main-svg');
    const pathsLayer = document.getElementById('paths-layer');
    const particlesLayer = document.getElementById('particles-layer');
    const componentsLayer = document.getElementById('components-layer');

    const createSVG = (tag, attrs) => {
        const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
        return el;
    };

    // --- Data Definitions ---
    
    // Component Positions (x, y center)
    // Layout: CPU Center, RAM Top, Storage Bottom, GPU Right, Input/Output/Net Left
    const components = [
        { id: 'cpu', label: 'CPU', sub: 'Central Processing', x: 500, y: 350, color: 'var(--c-instruction)', icon: 'cpu' },
        { id: 'ram', label: 'Memory', sub: 'High Speed RAM', x: 500, y: 150, color: 'var(--c-data)', icon: 'ram' },
        { id: 'gpu', label: 'GPU', sub: 'Graphics Processing', x: 750, y: 350, color: 'var(--c-data)', icon: 'gpu' },
        { id: 'storage', label: 'Storage', sub: 'NVMe SSD', x: 500, y: 550, color: 'var(--c-io)', icon: 'hdd' },
        { id: 'input', label: 'Input', sub: 'Keyboard / Mouse', x: 250, y: 350, color: 'var(--c-control)', icon: 'mouse' },
        { id: 'output', label: 'Output', sub: 'Display / Audio', x: 250, y: 150, color: 'var(--c-control)', icon: 'monitor' },
        { id: 'network', label: 'Network', sub: 'Ethernet / Wi-Fi', x: 250, y: 550, color: 'var(--c-control)', icon: 'wifi' }
    ];

    // Connections
    const connections = [
        { from: 'ram', to: 'cpu', type: 'instruction', label: 'Fetch' },
        { from: 'cpu', to: 'ram', type: 'data', label: 'Store' },
        { from: 'cpu', to: 'gpu', type: 'data', label: 'Render Data' },
        { from: 'gpu', to: 'cpu', type: 'control', label: 'Sync' },
        { from: 'storage', to: 'ram', type: 'data', label: 'Load' },
        { from: 'ram', to: 'storage', type: 'data', label: 'Cache' },
        { from: 'input', to: 'cpu', type: 'control', label: 'Events' },
        { from: 'cpu', to: 'output', type: 'data', label: 'Display' },
        { from: 'network', to: 'cpu', type: 'data', label: 'Packets' },
        { from: 'cpu', to: 'network', type: 'data', label: 'Response' },
        { from: 'storage', to: 'cpu', type: 'data', label: 'Direct' }
    ];

    // --- Drawing Icons ---
    const drawIcon = (id, x, y) => {
        let g = createSVG('g', { transform: `translate(${x-14}, ${y-14})` });
        
        // Icon Paths
        const paths = {
            cpu: "M6 6h12v12H6z M9 9h6v6H9z M12 2v4 M12 18v4 M2 12h4 M18 12h4",
            ram: "M4 4h16v16H4z M4 8h16 M4 12h16 M4 16h16",
            gpu: "M4 4h16v16H4z M8 12l3-3 3 3 3-3",
            hdd: "M4 4h16v16H4z M12 10a3 3 0 1 0 0 6 3 3 0 0 0 0-6z",
            mouse: "M8 4h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z M12 8v4",
            monitor: "M4 4h16v12H4z M8 20h8 M12 16v4",
            wifi: "M12 18v-2 M8 14a5 5 0 0 1 8 0 M4 10a9 9 0 0 1 16 0"
        };

        g.appendChild(createSVG('path', { 
            d: paths[id], 
            stroke: 'currentColor', 
            'stroke-width': 2, 
            fill: 'none',
            'stroke-linecap': 'round',
            'stroke-linejoin': 'round'
        }));
        
        return g;
    };

    // --- Render Components ---
    const compMap = {};

    components.forEach(c => {
        const g = createSVG('g', { 
            class: 'component-group', 
            transform: `translate(${c.x - 70}, ${c.y - 45})`,
            'data-id': c.id
        });

        const rect = createSVG('rect', { 
            class: 'comp-bg', 
            width: 140, height: 90,
            stroke: c.color
        });
        
        const icon = drawIcon(c.icon, 70, 40);
        icon.style.color = c.color;

        const textLabel = createSVG('text', { x: 70, y: 75, class: 'comp-label' });
        textLabel.textContent = c.label;
        
        const textSub = createSVG('text', { x: 70, y: 92, class: 'comp-sub' });
        textSub.textContent = c.sub;

        g.appendChild(rect);
        g.appendChild(icon);
        g.appendChild(textLabel);
        g.appendChild(textSub);
        
        componentsLayer.appendChild(g);
        compMap[c.id] = c;

        // Hover Logic
        g.addEventListener('mouseenter', () => highlightPath(c.id));
        g.addEventListener('mouseleave', () => resetHighlight());
    });

    // --- Render Paths ---
    
    const getPathD = (c1, c2) => {
        // Calculate control points for a smooth S-curve
        const dx = c2.x - c1.x;
        const dy = c2.y - c1.y;
        
        // Heuristic for control points
        let cp1x = c1.x, cp1y = c1.y;
        let cp2x = c2.x, cp2y = c2.y;

        const dist = Math.sqrt(dx*dx + dy*dy);
        const tension = Math.min(dist * 0.35, 80);

        if (Math.abs(dy) > Math.abs(dx)) {
            cp1y = c1.y + (dy > 0 ? tension : -tension);
            cp2y = c2.y + (dy > 0 ? -tension : tension);
        } else {
            cp1x = c1.x + (dx > 0 ? tension : -tension);
            cp2x = c2.x + (dx > 0 ? -tension : tension);
        }

        return `M ${c1.x} ${c1.y} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${c2.x} ${c2.y}`;
    };

    const pathGroups = {};

    connections.forEach((conn, index) => {
        const start = compMap[conn.from];
        const end = compMap[conn.to];
        
        const g = createSVG('g', { class: 'connection-group', 'data-from': conn.from, 'data-to': conn.to });

        // 1. Background Track
        const pathD = getPathD(start, end);
        
        const bgPath = createSVG('path', {
            d: pathD,
            stroke: 'transparent',
            'stroke-width': 30,
            fill: 'none',
            class: 'hit-area'
        });

        const trackColor = `var(--c-${conn.type})`;
        
        const visiblePath = createSVG('path', {
            d: pathD,
            class: 'path-bg',
            stroke: trackColor,
            'stroke-opacity': 0.15
        });

        const activePath = createSVG('path', {
            d: pathD,
            class: 'path-active',
            stroke: trackColor,
            'stroke-dashoffset': index % 2 === 0 ? 0 : 10
        });

        const particle = createSVG('path', {
            d: pathD,
            class: `particle p-${conn.type}`,
            style: `animation-delay: ${Math.random() * 2}s`
        });

        g.appendChild(bgPath);
        g.appendChild(visiblePath);
        g.appendChild(activePath);
        g.appendChild(particle);

        pathsLayer.appendChild(g);
        
        if (!pathGroups[conn.from]) pathGroups[conn.from] = [];
        if (!pathGroups[conn.to]) pathGroups[conn.to] = [];
        pathGroups[conn.from].push(g);
        pathGroups[conn.to].push(g);
    });

    // --- Interactivity ---

    function highlightPath(activeId) {
        document.querySelectorAll('.connection-group').forEach(el => el.classList.add('dimmed'));
        document.querySelectorAll('.component-group').forEach(el => {
            if(el.getAttribute('data-id') !== activeId) el.classList.add('dimmed');
        });

        const connectedGroups = pathGroups[activeId] || [];
        connectedGroups.forEach(g => {
            g.classList.remove('dimmed');
            g.classList.add('highlighted');
            g.style.color = getComputedStyle(g.querySelector('.path-active')).stroke;
        });
    }

    function resetHighlight() {
        document.querySelectorAll('.connection-group').forEach(el => {
            el.classList.remove('dimmed', 'highlighted');
            el.style.color = '';
        });
        document.querySelectorAll('.component-group').forEach(el => el.classList.remove('dimmed'));
    }

</script>
</body>
</html>
