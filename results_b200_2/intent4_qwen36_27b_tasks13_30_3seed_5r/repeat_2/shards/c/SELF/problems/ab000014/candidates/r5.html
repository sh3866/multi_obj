<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimono | Tomesode Collection</title>
    <style>
        :root {
            /* Refined Palette: Deep Indigo & Vermilion */
            --bg-color: #F4F1EB;
            --text-primary: #2A2A2A;
            --text-secondary: #666666;
            --accent-red: #B23A2A;
            
            /* Kimono Variables */
            --k-base: #1C2E38;
            --k-shadow: #121F26;
            --k-highlight: #2D4554;
            --k-obi: #B23A2A;
            --k-obi-dark: #802316;
            --k-gold: #D4AF37;
            --k-collar: #FDFBF7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: "Georgia", "Times New Roman", serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr auto;
            position: relative;
        }

        /* Sophisticated Grain Texture */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 999;
        }

        /* Typography & Layout */
        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 4rem 5rem 2rem;
            z-index: 10;
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .brand-jp {
            font-size: 2.5rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            line-height: 1;
            color: var(--text-primary);
        }

        .brand-en {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(44,44,44,0.2);
            padding-bottom: 8px;
            width: fit-content;
        }

        .meta {
            text-align: right;
            font-size: 1.1rem;
            line-height: 1.6;
            font-style: italic;
            color: var(--text-primary);
            max-width: 300px;
        }

        .meta strong {
            font-weight: normal;
            color: var(--accent-red);
            font-style: normal;
            font-family: system-ui, sans-serif;
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            display: block;
            margin-bottom: -0.2rem;
            margin-top: 1rem;
            opacity: 0.8;
        }

        /* Main Stage */
        main {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
            perspective: 1200px;
        }

        /* SVG Container */
        .kimono-container {
            height: 85vh;
            width: auto;
            /* High-end soft shadow */
            filter: drop-shadow(0 40px 60px rgba(0,0,0,0.15));
            transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: transform;
        }

        /* SVG Classes */
        .k-fill { fill: var(--k-base); transition: fill 0.8s ease; }
        .k-shadow { fill: var(--k-shadow); transition: fill 0.8s ease; }
        .k-highlight { fill: var(--k-highlight); transition: fill 0.8s ease; }
        .k-obi { fill: var(--k-obi); transition: fill 0.8s ease; }
        .k-obi-dark { fill: var(--k-obi-dark); transition: fill 0.8s ease; }
        .k-gold { stroke: var(--k-gold); transition: stroke 0.8s ease; }
        .k-collar { fill: var(--k-collar); transition: fill 0.8s ease; }

        /* Patterns */
        .pattern-fern { fill: url(#p-fern); }
        .pattern-obi { fill: url(#p-obi); }

        /* Controls */
        .controls-bar {
            grid-column: 1 / -1;
            padding: 2rem 5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 10;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .label {
            font-family: system-ui, sans-serif;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-secondary);
            opacity: 0.7;
        }

        .color-swatches {
            display: flex;
            gap: 1.5rem;
        }

        .swatch {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.05);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .swatch:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.15); }
        
        .swatch.active::after {
            content: '';
            position: absolute;
            top: -6px; left: -6px; right: -6px; bottom: -6px;
            border: 1px solid var(--text-primary);
            border-radius: 50%;
            opacity: 0.3;
        }

        .vertical-deco {
            position: absolute;
            right: 5rem;
            bottom: 9rem;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-family: system-ui, sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.4em;
            color: var(--text-secondary);
            opacity: 0.5;
            max-height: 300px;
            font-weight: 300;
        }

        /* Animations */
        .fade-up {
            animation: fadeUp 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }
        
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            header, .controls-bar { padding: 1.5rem; }
            .kimono-container { height: 65vh; }
            .vertical-deco { display: none; }
            .meta { display: none; }
            .brand-jp { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <header class="fade-up">
        <div class="brand">
            <span class="brand-jp">和服</span>
            <span class="brand-en">Kimono Studio</span>
        </div>
        <div class="meta">
            <strong>Collection</strong> Autumn Fern (Kochi)
            <strong>Material</strong> Yūzen Silk
            <strong>Dyeing</strong> Hand-painted
        </div>
    </header>

    <main class="fade-up delay-1">
        <!-- SVG Canvas -->
        <svg class="kimono-container" viewBox="0 0 600 950" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Gradients for Depth -->
                <linearGradient id="grad-sleeve" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--k-shadow);stop-opacity:0.6" />
                    <stop offset="20%" style="stop-color:var(--k-shadow);stop-opacity:0.0" />
                    <stop offset="80%" style="stop-color:var(--k-shadow);stop-opacity:0.0" />
                    <stop offset="100%" style="stop-color:var(--k-shadow);stop-opacity:0.6" />
                </linearGradient>

                <linearGradient id="grad-obi" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--k-obi-dark);stop-opacity:0.8" />
                    <stop offset="15%" style="stop-color:var(--k-obi-dark);stop-opacity:0.0" />
                    <stop offset="85%" style="stop-color:var(--k-obi-dark);stop-opacity:0.0" />
                    <stop offset="100%" style="stop-color:var(--k-obi-dark);stop-opacity:0.8" />
                </linearGradient>

                <!-- Pattern: Kochi Fern (More Organic) -->
                <pattern id="p-fern" x="0" y="0" width="140" height="180" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
                    <rect width="140" height="180" fill="var(--k-base)" />
                    <g opacity="0.6">
                        <!-- Fern Leaves -->
                        <path d="M70,20 C90,50 70,80 70,80 C50,50 70,20 70,20 Z" fill="var(--k-highlight)" />
                        <path d="M70,80 C105,115 70,155 70,155 C35,115 70,80 70,80 Z" fill="var(--k-highlight)" />
                        <path d="M70,20 C40,50 70,80 70,80 Z" fill="var(--k-highlight)" opacity="0.5"/>
                        <path d="M70,80 C45,115 70,155 70,155 Z" fill="var(--k-highlight)" opacity="0.5"/>
                        
                        <!-- Gold Accents (Kogin Stitch style dots) -->
                        <circle cx="40" cy="50" r="1.5" fill="var(--k-gold)" opacity="0.7"/>
                        <circle cx="100" cy="100" r="1.5" fill="var(--k-gold)" opacity="0.7"/>
                        <circle cx="70" cy="130" r="1" fill="var(--k-gold)" opacity="0.5"/>
                        <circle cx="50" cy="160" r="1" fill="var(--k-gold)" opacity="0.4"/>
                        <circle cx="90" cy="40" r="1" fill="var(--k-gold)" opacity="0.4"/>
                    </g>
                </pattern>

                <!-- Pattern: Obi Weave -->
                <pattern id="p-obi" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
                    <rect width="24" height="24" fill="var(--k-obi)" />
                    <path d="M0,12 L24,12 M12,0 L12,24" stroke="var(--k-obi-dark)" stroke-width="0.5" opacity="0.3"/>
                    <circle cx="12" cy="12" r="2" fill="var(--k-gold)" opacity="0.2"/>
                </pattern>
            </defs>

            <g id="kimono-art" transform="translate(300, 475)">
                
                <!-- 1. Left Sleeve (Tate-sode) - More Angled -->
                <g transform="rotate(4)">
                    <path d="M-65,-280 L-200,-280 L-200,130 L-65,130 Z" class="k-fill pattern-fern" />
                    <path d="M-65,-280 L-200,-280 L-200,130 L-65,130 Z" fill="url(#grad-sleeve)" />
                    <!-- Sleeve Cuff Line -->
                    <path d="M-200,-280 L-200,130" stroke="rgba(0,0,0,0.15)" stroke-width="1" />
                </g>

                <!-- 2. Left Skirt Panel (Hakama-style) - Curved Bottom -->
                <path d="M-50,-280 L-50,480 Q-60,510 -80,510 L-160,510 Q-160,490 -140,-280 Z" class="k-fill pattern-fern" />

                <!-- 3. Right Skirt Panel -->
                <path d="M50,-280 L50,480 Q60,510 80,510 L160,510 Q160,490 140,-280 Z" class="k-fill pattern-fern" />

                <!-- 4. Right Sleeve (Tate-sode) -->
                <g transform="rotate(-4)">
                    <path d="M65,-280 L200,-280 L200,130 L65,130 Z" class="k-fill pattern-fern" />
                    <path d="M65,-280 L200,-280 L200,130 L65,130 Z" fill="url(#grad-sleeve)" />
                    <path d="M200,-280 L200,130" stroke="rgba(0,0,0,0.15)" stroke-width="1" />
                </g>

                <!-- 5. Main Torso Base -->
                <path d="M-50,-280 L50,-280 L50,510 L-50,510 Z" class="k-fill pattern-fern" />

                <!-- 6. Collar (Eri) - Refined V-Neck -->
                <!-- Left Collar (Top Layer) -->
                <path d="M-45,-295 Q-20,-275 0,-255 L0,415 Q-5,415 -10,415 L-10,-255 Q-30,-275 -50,-295 Z" class="k-collar" />
                
                <!-- Right Collar (Bottom Layer) -->
                <path d="M45,-295 Q20,-275 0,-255 L0,-235 Q25,-255 50,-295 Z" class="k-collar" />
                
                <!-- Collar Crease -->
                <path d="M-5,-255 L-5,415" stroke="rgba(0,0,0,0.06)" stroke-width="1" />

                <!-- 7. The Obi (Sash) -->
                <g transform="translate(0, 80)">
                    <!-- Obi Band -->
                    <path d="M-70,0 L70,0 L70,100 L-70,100 Z" class="k-obi pattern-obi" />
                    <path d="M-70,0 L70,0 L70,100 L-70,100 Z" fill="url(#grad-obi)" />

                    <!-- Obi Knot (Taige) - More Structured -->
                    <g transform="translate(0, 50)">
                        <!-- Main Knot Shape -->
                        <path d="M-40,0 L40,0 L40,60 L0,70 L-40,60 Z" class="k-obi" />
                        <path d="M-40,0 L40,0 L40,60 L0,70 L-40,60 Z" fill="rgba(0,0,0,0.1)" />
                        
                        <!-- Knot Detailing (Gold Trim) -->
                        <path d="M-30,5 L30,5 L30,45 L0,55 L-30,45 Z" fill="none" class="k-gold" stroke-width="1.5" opacity="0.9"/>
                        <path d="M-15,10 L15,10 L15,35 L0,43 L-15,35 Z" class="k-obi-dark" opacity="0.4"/>
                    </g>
                </g>

                <!-- 8. Fabric Folds (Vector Polish) -->
                <!-- Center Seam -->
                <path d="M0,-280 L0,80" stroke="black" stroke-width="1.5" opacity="0.1" />
                <path d="M0,180 L0,510" stroke="black" stroke-width="1" opacity="0.06" />
                
                <!-- Sleeve Cuff Folds -->
                <path d="M-65,-130 L-195,-130 L-195,-125 L-65,-125" stroke="black" stroke-width="1" opacity="0.1" />
                <path d="M65,-130 L195,-130 L195,-125 L65,-125" stroke="black" stroke-width="1" opacity="0.1" />
            </g>
        </svg>
    </main>

    <div class="vertical-deco fade-up delay-2">
        伝統的工芸品 / TRADITIONAL CRAFT / 2024
    </div>

    <div class="controls-bar fade-up delay-2">
        <div class="control-group">
            <span class="label">Colorway</span>
            <div class="color-swatches">
                <button class="swatch active" data-color="#1c2e38" style="background-color: #1c2e38;" aria-label="Indigo"></button>
                <button class="swatch" data-color="#3e2723" style="background-color: #3e2723;" aria-label="Dark Brown"></button>
                <button class="swatch" data-color="#263238" style="background-color: #263238;" aria-label="Blue Grey"></button>
            </div>
        </div>

        <div class="control-group" style="align-items: flex-end;">
            <span class="label">Details</span>
            <div style="font-size: 0.9rem; color: var(--text-primary); max-width: 250px; text-align: right; line-height: 1.5;">
                The Tomesode features a T-shaped silhouette and a rigid collar (eri).
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const stage = document.querySelector('.kimono-container');
            const root = document.documentElement;
            const swatches = document.querySelectorAll('.swatch');
            
            // 1. Subtle Parallax Effect
            // Limits rotation to prevent extreme distortion
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth / 2 - e.clientX) / 100;
                const y = (window.innerHeight / 2 - e.clientY) / 100;
                
                stage.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
            });

            // 2. Color Switching Logic
            const palettes = {
                '#1c2e38': { 
                    base: '#1c2e38', 
                    shadow: '#121F26', 
                    highlight: '#2D4554',
                    obi: '#B23A2A',
                    obiDark: '#802316'
                },
                '#3e2723': { 
                    base: '#3e2723', 
                    shadow: '#281815', 
                    highlight: '#5d4037',
                    obi: '#4E342E',
                    obiDark: '#3E2723'
                },
                '#263238': { 
                    base: '#263238', 
                    shadow: '#151c21', 
                    highlight: '#37474f',
                    obi: '#B71C1C',
                    obiDark: '#880E4F'
                }
            };

            swatches.forEach(btn => {
                btn.addEventListener('click', () => {
                    // UI Update
                    swatches.forEach(s => s.classList.remove('active'));
                    btn.classList.add('active');

                    // Apply Colors
                    const colorHex = btn.getAttribute('data-color');
                    const p = palettes[colorHex];

                    root.style.setProperty('--k-base', p.base);
                    root.style.setProperty('--k-shadow', p.shadow);
                    root.style.setProperty('--k-highlight', p.highlight);
                    root.style.setProperty('--k-obi', p.obi);
                    root.style.setProperty('--k-obi-dark', p.obiDark);
                });
            });
        });
    </script>
</body>
</html>
