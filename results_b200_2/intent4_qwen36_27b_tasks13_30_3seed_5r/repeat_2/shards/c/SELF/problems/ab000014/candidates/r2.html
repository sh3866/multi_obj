<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimono | Tomesode Collection</title>
    <style>
        :root {
            /* Palette - Deep Indigo Theme */
            --bg-color: #EBE6DF;
            --bg-texture: #E0DAD2;
            --text-primary: #2A2A2A;
            --text-secondary: #666666;
            --accent-red: #A83B2B;
            
            /* Kimono Colors - Dynamic */
            --k-base: #1C2E38;
            --k-shadow: #111E26;
            --k-highlight: #2A404D;
            --k-obi: #A83B2B;
            --k-obi-dark: #7A2519;
            --k-gold: #C5A059;
            --k-collar: #F9F7F2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: "Georgia", "Times New Roman", serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr auto;
            position: relative;
        }

        /* Grain Texture Overlay */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 999;
        }

        /* Typography & UI */
        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 3rem 4rem;
            z-index: 10;
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .brand-jp {
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            line-height: 1;
            color: var(--text-primary);
        }

        .brand-en {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--text-secondary);
            padding-bottom: 4px;
            width: fit-content;
        }

        .meta {
            text-align: right;
            font-size: 0.95rem;
            line-height: 2;
            font-style: italic;
        }

        .meta strong {
            font-weight: normal;
            color: var(--accent-red);
            font-style: normal;
            font-family: system-ui, sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            display: block;
            margin-bottom: -0.4rem;
            margin-top: 0.5rem;
        }

        /* Main Stage */
        main {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
        }

        /* SVG Container */
        .kimono-container {
            height: 85vh;
            width: auto;
            /* Soft, expansive shadow for depth */
            filter: drop-shadow(0 40px 60px rgba(0,0,0,0.15));
            transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: transform;
        }

        /* SVG Specifics */
        .k-fill { fill: var(--k-base); transition: fill 0.5s ease; }
        .k-shadow { fill: var(--k-shadow); transition: fill 0.5s ease; }
        .k-highlight { fill: var(--k-highlight); transition: fill 0.5s ease; }
        .k-obi { fill: var(--k-obi); transition: fill 0.5s ease; }
        .k-obi-dark { fill: var(--k-obi-dark); transition: fill 0.5s ease; }
        .k-gold { stroke: var(--k-gold); transition: stroke 0.5s ease; }
        .k-collar { fill: var(--k-collar); transition: fill 0.5s ease; }

        /* Pattern Definitions */
        .pattern-fern { fill: url(#p-fern); }
        .pattern-obi { fill: url(#p-obi); }

        /* Controls */
        .controls-bar {
            grid-column: 1 / -1;
            padding: 2rem 4rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 10;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .label {
            font-family: system-ui, sans-serif;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-secondary);
            opacity: 0.7;
        }

        .color-swatches {
            display: flex;
            gap: 1rem;
        }

        .swatch {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
        }

        .swatch:hover { transform: scale(1.15); }
        .swatch.active::after {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border: 1px solid var(--text-primary);
            border-radius: 50%;
        }

        .vertical-deco {
            position: absolute;
            right: 4rem;
            bottom: 6rem;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-family: system-ui, sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            color: var(--text-secondary);
            opacity: 0.5;
            max-height: 300px;
        }

        /* Animation */
        .fade-up {
            animation: fadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            header, .controls-bar { padding: 1.5rem; }
            .kimono-container { height: 65vh; }
            .vertical-deco { display: none; }
            .meta { display: none; }
        }
    </style>
</head>
<body>

    <header class="fade-up">
        <div class="brand">
            <span class="brand-jp">和服</span>
            <span class="brand-en">Kimono Studio</span>
        </div>
        <div class="meta">
            <strong>Collection</strong> Autumn Fern (Kochi)
            <strong>Material</strong> Yūzen Silk
            <strong>Dyeing</strong> Hand-painted
        </div>
    </header>

    <main class="fade-up delay-1">
        <!-- SVG Canvas -->
        <svg class="kimono-container" viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Gradients -->
                <linearGradient id="grad-sleeve" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--k-shadow);stop-opacity:0.6" />
                    <stop offset="20%" style="stop-color:var(--k-shadow);stop-opacity:0.1" />
                    <stop offset="80%" style="stop-color:var(--k-shadow);stop-opacity:0.1" />
                    <stop offset="100%" style="stop-color:var(--k-shadow);stop-opacity:0.6" />
                </linearGradient>

                <linearGradient id="grad-obi" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--k-obi-dark);stop-opacity:0.8" />
                    <stop offset="15%" style="stop-color:var(--k-obi-dark);stop-opacity:0.1" />
                    <stop offset="85%" style="stop-color:var(--k-obi-dark);stop-opacity:0.1" />
                    <stop offset="100%" style="stop-color:var(--k-obi-dark);stop-opacity:0.8" />
                </linearGradient>

                <!-- Fern Pattern (Kochi) -->
                <pattern id="p-fern" x="0" y="0" width="100" height="150" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
                    <rect width="100" height="150" fill="var(--k-base)" />
                    <g opacity="0.6">
                        <!-- Stylized Leaves -->
                        <path d="M50,10 C65,35 50,60 50,60 C35,35 50,10 50,10 Z" fill="var(--k-highlight)" />
                        <path d="M50,60 C80,85 50,110 50,110 C20,85 50,60 50,60 Z" fill="var(--k-highlight)" />
                        <path d="M50,110 C65,135 50,160 50,160 C35,135 50,110 50,110 Z" fill="var(--k-highlight)" opacity="0.8"/>
                        <!-- Gold Dots (Chirimen texture simulation) -->
                        <circle cx="25" cy="40" r="1.5" fill="var(--k-gold)" opacity="0.5"/>
                        <circle cx="75" cy="90" r="1.5" fill="var(--k-gold)" opacity="0.5"/>
                        <circle cx="50" cy="85" r="1" fill="var(--k-gold)" opacity="0.3"/>
                    </g>
                </pattern>

                <!-- Obi Pattern -->
                <pattern id="p-obi" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
                    <rect width="30" height="30" fill="var(--k-obi)" />
                    <path d="M0,15 L30,15 M15,0 L15,30" stroke="var(--k-obi-dark)" stroke-width="1" opacity="0.3"/>
                    <circle cx="15" cy="15" r="2" fill="var(--k-gold)" opacity="0.4"/>
                </pattern>
            </defs>

            <g id="kimono-art" transform="translate(300, 450)">
                
                <!-- 1. Left Sleeve (Tate-sode) -->
                <g transform="rotate(8)">
                    <!-- Sleeve Shape -->
                    <path d="M-75,-260 L-195,-260 L-195,100 L-75,100 Z" class="k-fill pattern-fern" />
                    <!-- Sleeve Shadow Overlay -->
                    <path d="M-75,-260 L-195,-260 L-195,100 L-75,100 Z" fill="url(#grad-sleeve)" />
                    <!-- Cuff Line -->
                    <path d="M-195,-260 L-195,100" stroke="rgba(0,0,0,0.1)" stroke-width="1" />
                </g>

                <!-- 2. Left Skirt Panel (Hakama-style drape) -->
                <path d="M-55,-260 L-55,450 Q-65,480 -85,480 L-155,480 Q-155,460 -135,-260 Z" class="k-fill pattern-fern" />

                <!-- 3. Right Skirt Panel -->
                <path d="M55,-260 L55,450 Q65,480 85,480 L155,480 Q155,460 135,-260 Z" class="k-fill pattern-fern" />

                <!-- 4. Right Sleeve (Tate-sode) - Overlapping -->
                <g transform="rotate(-8)">
                    <path d="M75,-260 L195,-260 L195,100 L75,100 Z" class="k-fill pattern-fern" />
                    <path d="M75,-260 L195,-260 L195,100 L75,100 Z" fill="url(#grad-sleeve)" />
                    <path d="M195,-260 L195,100" stroke="rgba(0,0,0,0.1)" stroke-width="1" />
                </g>

                <!-- 5. Main Torso Base -->
                <path d="M-55,-260 L55,-260 L55,480 L-55,480 Z" class="k-fill pattern-fern" />

                <!-- 6. Collar (Eri) -->
                <!-- Left Collar (Top Layer) -->
                <path d="M-45,-275 Q-20,-255 0,-235 L0,380 Q-5,380 -10,380 L-10,-235 Q-30,-255 -50,-275 Z" class="k-collar" />
                
                <!-- Right Collar (Bottom Layer - Visible at neck) -->
                <path d="M45,-275 Q20,-255 0,-235 L0,-215 Q25,-235 50,-275 Z" class="k-collar" />
                
                <!-- Collar Crease -->
                <path d="M-5,-235 L-5,380" stroke="rgba(0,0,0,0.05)" stroke-width="1" />

                <!-- 7. The Obi (Sash) -->
                <g transform="translate(0, 70)">
                    <!-- Obi Band -->
                    <path d="M-75,0 L75,0 L75,90 L-75,90 Z" class="k-obi pattern-obi" />
                    <!-- Obi Shadow -->
                    <path d="M-75,0 L75,0 L75,90 L-75,90 Z" fill="url(#grad-obi)" />

                    <!-- Obi Knot (Taige) Front -->
                    <g transform="translate(0, 45)">
                        <!-- Main Knot Shape -->
                        <path d="M-45,0 L45,0 L45,50 L0,60 L-45,50 Z" class="k-obi" />
                        <!-- Knot Shadow -->
                        <path d="M-45,0 L45,0 L45,50 L0,60 L-45,50 Z" fill="rgba(0,0,0,0.15)" />
                        
                        <!-- Knot Detailing (Gold Trim) -->
                        <path d="M-35,5 L35,5 L35,35 L0,45 L-35,35 Z" fill="none" class="k-gold" stroke-width="1.5" opacity="0.7"/>
                        <path d="M-20,10 L20,10 L20,30 L0,38 L-20,30 Z" class="k-obi-dark" opacity="0.3"/>
                    </g>
                </g>

                <!-- 8. Fabric Folds (Vector Polish) -->
                <!-- Center Seam -->
                <path d="M0,-260 L0,70" stroke="black" stroke-width="1.5" opacity="0.15" />
                <path d="M0,160 L0,480" stroke="black" stroke-width="1" opacity="0.08" />
                
                <!-- Sleeve Cuff Folds -->
                <path d="M-75,-110 L-185,-110 L-185,-105 L-75,-105" stroke="black" stroke-width="1" opacity="0.1" />
                <path d="M75,-110 L185,-110 L185,-105 L75,-105" stroke="black" stroke-width="1" opacity="0.1" />
            </g>
        </svg>
    </main>

    <div class="vertical-deco fade-up delay-2">
        伝統的工芸品 / TRADITIONAL CRAFT / 2024
    </div>

    <div class="controls-bar fade-up delay-2">
        <div class="control-group">
            <span class="label">Colorway</span>
            <div class="color-swatches">
                <button class="swatch active" data-color="#1c2e38" style="background-color: #1c2e38;" aria-label="Indigo"></button>
                <button class="swatch" data-color="#3e2723" style="background-color: #3e2723;" aria-label="Dark Brown"></button>
                <button class="swatch" data-color="#263238" style="background-color: #263238;" aria-label="Blue Grey"></button>
            </div>
        </div>

        <div class="control-group" style="align-items: flex-end;">
            <span class="label">Details</span>
            <div style="font-size: 0.85rem; color: var(--text-primary); max-width: 250px; text-align: right; line-height: 1.5;">
                The Tomesode features a T-shaped silhouette and a rigid collar (eri).
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const stage = document.querySelector('.kimono-container');
            const root = document.documentElement;
            const swatches = document.querySelectorAll('.swatch');
            
            // 1. Subtle Parallax Effect
            // Limits rotation to prevent extreme distortion
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth / 2 - e.clientX) / 80;
                const y = (window.innerHeight / 2 - e.clientY) / 80;
                
                stage.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
            });

            // 2. Color Switching Logic
            const palettes = {
                '#1c2e38': { 
                    base: '#1c2e38', 
                    shadow: '#111E26', 
                    highlight: '#2A404D',
                    obi: '#A83B2B',
                    obiDark: '#7A2519'
                },
                '#3e2723': { 
                    base: '#3e2723', 
                    shadow: '#281815', 
                    highlight: '#5d4037',
                    obi: '#4E342E',
                    obiDark: '#3E2723'
                },
                '#263238': { 
                    base: '#263238', 
                    shadow: '#151c21', 
                    highlight: '#37474f',
                    obi: '#B71C1C',
                    obiDark: '#880E4F'
                }
            };

            swatches.forEach(btn => {
                btn.addEventListener('click', () => {
                    // UI Update
                    swatches.forEach(s => s.classList.remove('active'));
                    btn.classList.add('active');

                    // Apply Colors
                    const colorHex = btn.getAttribute('data-color');
                    const p = palettes[colorHex];

                    root.style.setProperty('--k-base', p.base);
                    root.style.setProperty('--k-shadow', p.shadow);
                    root.style.setProperty('--k-highlight', p.highlight);
                    root.style.setProperty('--k-obi', p.obi);
                    root.style.setProperty('--k-obi-dark', p.obiDark);
                });
            });
        });
    </script>
</body>
</html>
