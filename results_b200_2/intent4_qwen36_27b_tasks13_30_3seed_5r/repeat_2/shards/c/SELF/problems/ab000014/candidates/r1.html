<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMONO | Wabi-Sabi Collection</title>
    <style>
        :root {
            /* Refined Palette */
            --bg-color: #E8E4D9; /* Warm Washi */
            --text-main: #1A1A1A; /* Sumi Ink */
            --text-muted: #555555;
            --accent-color: #B03A28; /* Vermilion */
            
            /* Default Kimono Colors (Deep Indigo) */
            --kimono-base: #1C2E38;
            --kimono-dark: #0F181E;
            --kimono-light: #2A404D;
            
            --obi-color: #B03A28;
            --obi-dark: #7A2519;
            --gold: #D4AF37;
            --collar-white: #FDFBF7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: "Georgia", "Times New Roman", serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: grid;
            grid-template-rows: auto 1fr auto;
            grid-template-columns: 5rem 1fr 5rem;
            position: relative;
        }

        /* Paper Texture */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        /* UI Layout */
        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 2rem 4rem;
            z-index: 10;
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .brand-jp {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 0.1em;
            line-height: 1;
        }

        .brand-en {
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-top: 8px;
            opacity: 0.7;
            border-bottom: 1px solid var(--text-main);
            padding-bottom: 2px;
        }

        .meta {
            text-align: right;
            font-size: 0.85rem;
            line-height: 1.8;
            max-width: 220px;
            font-feature-settings: "pnum";
        }

        .meta strong {
            font-weight: normal;
            color: var(--accent-color);
            font-family: sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            display: block;
            margin-bottom: 2px;
        }

        /* Main Stage */
        main {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            z-index: 5;
            position: relative;
        }

        /* SVG Styling */
        .kimono-stage {
            height: 88vh;
            width: auto;
            /* High-end shadow */
            filter: drop-shadow(0 30px 40px rgba(0,0,0,0.25));
            transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform-style: preserve-3d;
        }

        .pattern-fill { fill: url(#pattern-fern); }
        .obi-fill { fill: url(#pattern-obi); }
        
        /* Fabric Depth Gradients */
        .gradient-overlay {
            mix-blend-mode: multiply;
            pointer-events: none;
        }

        /* Controls */
        .controls-container {
            grid-column: 1 / 4;
            padding: 0 4rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 10;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .label {
            font-family: sans-serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
        }

        .color-options {
            display: flex;
            gap: 1rem;
        }

        button.color-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }

        button.color-btn:hover {
            transform: scale(1.1);
        }

        button.color-btn.active {
            box-shadow: 0 0 0 2px var(--bg-color), 0 0 0 4px var(--text-main);
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--text-main);
            color: var(--text-main);
            padding: 0.6rem 1.5rem;
            font-family: sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: var(--text-main);
            color: var(--bg-color);
        }

        /* Footer Info */
        .info-block {
            max-width: 300px;
            font-size: 0.95rem;
            line-height: 1.7;
            opacity: 0.9;
        }
        
        .info-block h3 {
            font-size: 1rem;
            font-weight: normal;
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
        }

        /* Vertical Decorative Text */
        .vertical-text {
            position: absolute;
            right: 4rem;
            bottom: 4rem;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            color: var(--text-muted);
            opacity: 0.6;
            font-family: sans-serif;
        }

        /* Animation */
        .fade-in { animation: fadeIn 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            body { grid-template-columns: 1.5rem 1fr 1.5rem; }
            header, .controls-container { padding: 1rem 1.5rem; }
            .kimono-stage { height: 70vh; }
            .vertical-text { display: none; }
            .meta { display: none; }
            .controls-container { flex-direction: column; align-items: flex-start; gap: 2rem; }
        }
    </style>
</head>
<body>

    <header class="fade-in">
        <div class="brand">
            <span class="brand-jp">和服</span>
            <span class="brand-en">Kimono Studio</span>
        </div>
        <div class="meta">
            <strong>Collection</strong> Autumn Fern
            <strong>Material</strong> Yūzen Silk
            <strong>Dyeing</strong> Hand-painted
        </div>
    </header>

    <main>
        <!-- SVG Drawing Area -->
        <svg class="kimono-stage" viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Gradients for Fabric Depth -->
                <linearGradient id="fabric-shadow" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:rgb(0,0,0);stop-opacity:0.7" />
                    <stop offset="15%" style="stop-color:rgb(0,0,0);stop-opacity:0.1" />
                    <stop offset="85%" style="stop-color:rgb(0,0,0);stop-opacity:0.1" />
                    <stop offset="100%" style="stop-color:rgb(0,0,0);stop-opacity:0.7" />
                </linearGradient>

                <linearGradient id="obi-shadow" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:rgb(0,0,0);stop-opacity:0.8" />
                    <stop offset="40%" style="stop-color:rgb(0,0,0);stop-opacity:0.1" />
                    <stop offset="60%" style="stop-color:rgb(0,0,0);stop-opacity:0.1" />
                    <stop offset="100%" style="stop-color:rgb(0,0,0);stop-opacity:0.8" />
                </linearGradient>

                <!-- The "Autumn Fern" Pattern (Kochi) -->
                <pattern id="pattern-fern" x="0" y="0" width="80" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(10)">
                    <rect width="80" height="120" fill="var(--kimono-base)" />
                    <!-- Stylized Fern Motif -->
                    <g fill="var(--kimono-light)" opacity="0.5">
                        <path d="M40,10 C55,30 40,50 40,50 C25,30 40,10 40,10 Z" />
                        <path d="M40,50 C65,70 40,90 40,90 C15,70 40,50 40,50 Z" />
                        <path d="M40,90 C55,110 40,130 40,130 C25,110 40,90 40,90 Z" opacity="0.6"/>
                    </g>
                    <!-- Gold accent dots -->
                    <circle cx="20" cy="25" r="1.5" fill="var(--gold)" opacity="0.6"/>
                    <circle cx="60" cy="85" r="1.5" fill="var(--gold)" opacity="0.6"/>
                    <circle cx="40" cy="70" r="1" fill="var(--gold)" opacity="0.4"/>
                </pattern>

                <!-- Obi Pattern -->
                <pattern id="pattern-obi" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
                    <rect width="24" height="24" fill="var(--obi-color)" />
                    <path d="M0,12 L24,12 M12,0 L12,24" stroke="var(--obi-dark)" stroke-width="1" opacity="0.4"/>
                    <circle cx="12" cy="12" r="2" fill="var(--gold)" opacity="0.3"/>
                </pattern>
            </defs>

            <g id="kimono-group" transform="translate(300, 450)">
                
                <!-- 1. Left Sleeve (Tate-sode) - Behind Body -->
                <g transform="rotate(12)">
                    <path d="M-70,-250 L-190,-250 L-190,110 L-70,110 Z" fill="var(--kimono-base)" class="pattern-fill" />
                    <!-- Sleeve Shadow -->
                    <path d="M-70,-250 L-190,-250 L-190,110 L-70,110 Z" fill="url(#fabric-shadow)" opacity="0.4" />
                </g>

                <!-- 2. Left Skirt Panel (Back layer) -->
                <path d="M-55,-250 L-55,450 Q-60,480 -80,480 L-150,480 Q-150,460 -130,-250 Z" fill="var(--kimono-base)" class="pattern-fill" />

                <!-- 3. Right Skirt Panel (Back layer) -->
                <path d="M55,-250 L55,450 Q60,480 80,480 L150,480 Q150,460 130,-250 Z" fill="var(--kimono-base)" class="pattern-fill" />

                <!-- 4. Right Sleeve (Tate-sode) - Overlapping -->
                <g transform="rotate(-12)">
                    <path d="M70,-250 L190,-250 L190,110 L70,110 Z" fill="var(--kimono-base)" class="pattern-fill" />
                    <!-- Sleeve Shadow -->
                    <path d="M70,-250 L190,-250 L190,110 L70,110 Z" fill="url(#fabric-shadow)" opacity="0.4" />
                </g>

                <!-- 5. Main Body / Torso -->
                <path d="M-55,-250 L55,-250 L55,480 L-55,480 Z" fill="var(--kimono-base)" class="pattern-fill" />
                
                <!-- 6. Collar (Eri) - The White Edge -->
                <!-- Left Collar -->
                <path d="M-45,-265 Q-20,-245 0,-225 L0,350 Q-5,350 -10,350 L-10,-225 Q-30,-245 -50,-265 Z" fill="var(--collar-white)" />
                <!-- Right Collar (Visible at neck) -->
                <path d="M45,-265 Q20,-245 0,-225 L0,-205 Q25,-225 50,-265 Z" fill="var(--collar-white)" />
                
                <!-- Collar Crease -->
                <path d="M-5,-225 L-5,350" stroke="rgba(0,0,0,0.05)" stroke-width="1" />

                <!-- 7. The Obi (Sash) -->
                <g transform="translate(0, 60)">
                    <!-- Obi Main Band -->
                    <path d="M-70,0 L70,0 L70,80 L-70,80 Z" fill="var(--obi-color)" class="obi-fill" />
                    
                    <!-- Obi Shadows/Folds -->
                    <path d="M-70,0 L70,0 L70,80 L-70,80 Z" fill="url(#obi-shadow)" />

                    <!-- Obi Head (Taige) - Front Knot -->
                    <g transform="translate(0, 40)">
                        <!-- Main Knot Body -->
                        <path d="M-45,0 L45,0 L45,45 L0,55 L-45,45 Z" fill="var(--obi-color)" />
                        <path d="M-45,0 L45,0 L45,45 L0,55 L-45,45 Z" fill="rgba(0,0,0,0.15)" />
                        
                        <!-- Knot Details (Folding) -->
                        <path d="M-35,5 L35,5 L35,35 L0,45 L-35,35 Z" fill="none" stroke="var(--gold)" stroke-width="1.5" opacity="0.5"/>
                        <path d="M-20,10 L20,10 L20,30 L0,38 L-20,30 Z" fill="var(--obi-dark)" opacity="0.2"/>
                    </g>

                    <!-- Obi Back (Noshi) - Visible hint -->
                    <path d="M-25,0 Q0,25 25,0 L25,60 Q0,85 -25,60 Z" fill="var(--obi-dark)" opacity="0.6"/>
                </g>

                <!-- 8. Fabric Folds & Shading (Vector Polish) -->
                <!-- Center Seam Shadow -->
                <path d="M0,-250 L0,60" stroke="black" stroke-width="2" opacity="0.2" />
                <path d="M0,140 L0,480" stroke="black" stroke-width="1.5" opacity="0.1" />

                <!-- Sleeve Cuff Folds -->
                <path d="M-70,-100 L-180,-100 L-180,-95 L-70,-95" stroke="black" stroke-width="1" opacity="0.15" />
                <path d="M70,-100 L180,-100 L180,-95 L70,-95" stroke="black" stroke-width="1" opacity="0.15" />
            </g>
        </svg>
    </main>

    <div class="vertical-text">
        伝統的工芸品 / TRADITIONAL CRAFT / 2024
    </div>

    <div class="controls-container fade-in">
        <div class="control-group">
            <span class="label">Colorway</span>
            <div class="color-options">
                <button class="color-btn active" data-color="#1c2e38" style="background-color: #1c2e38;" aria-label="Indigo"></button>
                <button class="color-btn" data-color="#3e2723" style="background-color: #3e2723;" aria-label="Brown"></button>
                <button class="color-btn" data-color="#263238" style="background-color: #263238;" aria-label="Blue Grey"></button>
            </div>
        </div>

        <div class="info-block">
            <h3>The Art of Layering</h3>
            <p>
                A digital reconstruction of the Tomesode. Note the T-shaped silhouette, 
                the rigid collar (eri), and the precise pleating of the Obi.
            </p>
        </div>

        <div class="control-group" style="align-items: flex-end;">
            <span class="label">View</span>
            <button id="toggle-pattern" class="action-btn">Toggle Pattern</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const stage = document.querySelector('.kimono-stage');
            const root = document.documentElement;
            const colorBtns = document.querySelectorAll('.color-btn');
            const togglePatternBtn = document.getElementById('toggle-pattern');
            
            let patternVisible = true;

            // 1. Subtle Parallax / Hover Effect
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth / 2 - e.clientX) / 60;
                const y = (window.innerHeight / 2 - e.clientY) / 60;
                
                stage.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
            });

            // 2. Color Switching Logic
            const colors = {
                '#1c2e38': { base: '#1c2e38', dark: '#0f181e', light: '#2a404d' }, // Indigo
                '#3e2723': { base: '#3e2723', dark: '#281815', light: '#5d4037' }, // Brown
                '#263238': { base: '#263238', dark: '#151c21', light: '#37474f' }  // Blue Grey
            };

            colorBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // UI Update
                    colorBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    // Color Update
                    const colorHex = btn.getAttribute('data-color');
                    const palette = colors[colorHex];

                    root.style.setProperty('--kimono-base', palette.base);
                    root.style.setProperty('--kimono-dark', palette.dark);
                    root.style.setProperty('--kimono-light', palette.light);
                });
            });

            // 3. Pattern Toggle
            togglePatternBtn.addEventListener('click', () => {
                const patternElements = document.querySelectorAll('.pattern-fill');
                patternVisible = !patternVisible;
                
                patternElements.forEach(el => {
                    if (patternVisible) {
                        el.style.fill = ''; 
                    } else {
                        el.style.fill = 'var(--kimono-base)';
                    }
                });

                togglePatternBtn.classList.toggle('active');
            });
        });
    </script>
</body>
</html>
