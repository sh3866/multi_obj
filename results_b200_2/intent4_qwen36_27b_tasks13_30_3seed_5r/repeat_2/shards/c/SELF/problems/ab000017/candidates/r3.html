<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE CUBE - Professional Puzzle</title>
<style>
  :root {
    /* Palette - Deep Space Premium */
    --bg-dark: #050508;
    --bg-panel: rgba(22, 24, 30, 0.65);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-highlight: rgba(255, 255, 255, 0.04);
    
    /* Accent */
    --primary: #00f0ff;
    --primary-dim: rgba(0, 240, 255, 0.2);
    --text-main: #ffffff;
    --text-muted: #7a8296;

    /* Sticker Colors - High Contrast Matte */
    --c-white: #fdfdfd;
    --c-yellow: #ffcc00;
    --c-red: #ef2525;
    --c-orange: #ff8800;
    --c-green: #00b342;
    --c-blue: #0051ff;
    --c-plastic: #0a0a0a;
    --c-border: #1a1a1a;

    /* Dimensions */
    --unit: 60px;
    --gap: 4px;
    --anim-speed: 0.3s;
  }

  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    height: 100vh;
    background-color: var(--bg-dark);
    /* Subtle radial gradient for depth */
    background-image: radial-gradient(circle at 50% 40%, #14161e 0%, var(--bg-dark) 80%);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* --- UI: Header & Nav --- */
  header {
    height: 70px;
    padding: 0 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 100;
    position: relative;
  }

  .brand {
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 14px;
    text-transform: uppercase;
  }
  .brand span { color: var(--primary); }
  .brand svg { width: 28px; height: 28px; color: var(--text-main); filter: drop-shadow(0 0 5px var(--primary-dim)); }

  /* --- UI: Size Selector --- */
  .size-selector {
    background: var(--bg-panel);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 4px;
    display: flex;
    gap: 4px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  
  .size-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 8px 16px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.25s ease;
    font-family: inherit;
  }
  
  .size-btn:hover { color: var(--text-main); }
  .size-btn.active {
    background: var(--text-main);
    color: var(--bg-dark);
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }

  /* --- Main Scene --- */
  main {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1200px;
    overflow: hidden;
  }

  /* 3D Stage */
  .scene {
    width: calc(var(--unit) * 3); /* Dynamic */
    height: calc(var(--unit) * 3);
    transform-style: preserve-3d;
    transform: rotateX(-25deg) rotateY(-35deg);
    transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
    cursor: grab;
    /* Center point */
    margin-left: calc(var(--unit) * 1.5);
    margin-top: calc(var(--unit) * 1.5);
  }
  .scene:active { cursor: grabbing; }

  .cube-assembly {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
  }

  /* Cubie Construction */
  .cubie {
    position: absolute;
    width: var(--unit);
    height: var(--unit);
    transform-style: preserve-3d;
    will-change: transform;
  }

  .face {
    position: absolute;
    width: 100%;
    height: 100%;
    background-color: var(--c-plastic);
    /* Modern rounded corners */
    border-radius: 6px;
    /* Subtle bevel */
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    backface-visibility: hidden;
    border: 1px solid #000; /* Sharp edge definition */
  }

  .sticker {
    position: absolute;
    top: var(--gap); left: var(--gap); right: var(--gap); bottom: var(--gap);
    border-radius: 30%; /* "Squircle" sticker shape */
    /* Realistic sticker depth */
    box-shadow: 
      inset 0 0 0 1px rgba(0,0,0,0.1),
      inset 0 0 0 2px rgba(255,255,255,0.15), /* Rim highlight */
      0 1px 2px rgba(0,0,0,0.4);
    transition: background 0.2s;
  }
  
  /* Inner face plastic texture */
  .face-inner {
    background: var(--c-plastic);
    border: 1px solid #111;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
  }

  /* Face Transforms */
  .f-U { transform: rotateX(90deg) translateZ(calc(var(--unit)/2)); }
  .f-D { transform: rotateX(-90deg) translateZ(calc(var(--unit)/2)); }
  .f-F { transform: translateZ(calc(var(--unit)/2)); }
  .f-B { transform: rotateY(180deg) translateZ(calc(var(--unit)/2)); }
  .f-R { transform: rotateY(90deg) translateZ(calc(var(--unit)/2)); }
  .f-L { transform: rotateY(-90deg) translateZ(calc(var(--unit)/2)); }

  /* Sticker Colors */
  .s-U .sticker { background: var(--c-white); }
  .s-D .sticker { background: var(--c-yellow); }
  .s-F .sticker { background: var(--c-green); }
  .s-B .sticker { background: var(--c-blue); }
  .s-R .sticker { background: var(--c-red); }
  .s-L .sticker { background: var(--c-orange); }

  /* --- HUD: Stats --- */
  .hud-container {
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    pointer-events: none;
    z-index: 10;
  }

  .stat-card {
    background: rgba(10, 12, 16, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    padding: 10px 28px;
    border-radius: 14px;
    text-align: center;
    min-width: 120px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .stat-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
    margin-bottom: 2px;
    font-weight: 700;
  }

  .stat-value {
    font-family: "SF Mono", "Roboto Mono", "Courier New", monospace;
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1;
    letter-spacing: -1px;
  }
  .stat-value.timer { 
    color: var(--primary); 
    text-shadow: 0 0 15px var(--primary-dim);
  }

  /* --- Side Panel: Scramble --- */
  .info-panel {
    position: absolute;
    right: 50px;
    top: 50%;
    transform: translateY(-50%);
    width: 260px;
    background: var(--bg-panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 28px;
    box-shadow: -10px 10px 40px rgba(0,0,0,0.2);
    z-index: 50;
  }

  .panel-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    border-bottom: 1px solid var(--glass-border);
    padding-bottom: 12px;
    margin-bottom: 16px;
    font-weight: 700;
  }

  .scramble-text {
    font-family: "SF Mono", "Roboto Mono", monospace;
    font-size: 0.95rem;
    line-height: 1.8;
    color: var(--text-main);
    word-spacing: 6px;
    margin-bottom: 24px;
    min-height: 45px;
    letter-spacing: 1px;
  }

  .tip-text {
    font-size: 0.85rem;
    color: var(--text-muted);
    line-height: 1.5;
  }

  /* --- Controls: Bottom Bar --- */
  .controls-bar {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    padding: 8px;
    border-radius: 28px;
    background: rgba(10, 12, 16, 0.75);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--glass-border);
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    z-index: 100;
  }

  .btn {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    color: var(--text-main);
    padding: 14px 28px;
    border-radius: 22px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
    display: flex;
    align-items: center;
    gap: 10px;
    letter-spacing: 0.5px;
  }

  .btn:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.1);
    transform: translateY(-2px);
  }

  .btn:active { transform: scale(0.96); }

  .btn-primary {
    background: var(--primary);
    color: #000;
    border: none;
    box-shadow: 0 0 20px var(--primary-dim);
  }
  .btn-primary:hover { 
    background: #33f7ff; 
    box-shadow: 0 0 30px var(--primary-dim);
    color: #000;
  }

  /* Responsive */
  @media (max-width: 900px) {
    .info-panel { display: none; }
    .controls-bar { width: 90%; justify-content: space-between; }
    .hud-container { width: 90%; justify-content: center; }
    :root { --unit: 48px; }
    header { padding: 0 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
      <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
      <line x1="12" y1="22.08" x2="12" y2="12"></line>
    </svg>
    THE <span>CUBE</span>
  </div>

  <div class="size-selector">
    <button class="size-btn" onclick="initCube(2)">2×2</button>
    <button class="size-btn active" onclick="initCube(3)">3×3</button>
    <button class="size-btn" onclick="initCube(4)">4×4</button>
    <button class="size-btn" onclick="initCube(5)">5×5</button>
  </div>
</header>

<main id="scene-container">
  
  <div class="hud-container">
    <div class="stat-card">
      <div class="stat-label">Moves</div>
      <div class="stat-value" id="move-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Time</div>
      <div class="stat-value timer" id="timer">00:00</div>
    </div>
  </div>

  <div class="scene" id="scene">
    <div class="cube-assembly" id="cube"></div>
  </div>

  <div class="info-panel">
    <div class="panel-title">Current Scramble</div>
    <div class="scramble-text" id="scramble-display">Ready to start.</div>
    <div class="panel-title">Tip</div>
    <div class="tip-text">
      Drag background to rotate view.<br>
      Use controls to slice layers.
    </div>
  </div>

  <div class="controls-bar">
    <button class="btn" onclick="undoMove()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
      Undo
    </button>
    <button class="btn" onclick="resetTimer()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
      Reset
    </button>
    <button class="btn btn-primary" onclick="scrambleCube()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
      Scramble
    </button>
  </div>

</main>

<script>
  // --- Constants ---
  const COLORS = {
    U: 's-U', D: 's-D', F: 's-F', B: 's-B', R: 's-R', L: 's-L', X: 'face-inner'
  };
  
  let N = 3;
  let cubies = [];
  let moveHistory = [];
  let isAnimating = false;
  
  let startTime = null;
  let timerInterval = null;
  
  let rotX = -25;
  let rotY = -35;
  let isDragging = false;
  let lastMouseX = 0;
  let lastMouseY = 0;

  const cubeEl = document.getElementById('cube');
  const sceneEl = document.getElementById('scene');
  const moveCountEl = document.getElementById('move-count');
  const timerEl = document.getElementById('timer');
  const scrambleEl = document.getElementById('scramble-display');

  // --- Initialization ---
  function initCube(size) {
    N = size;
    cubies = [];
    cubeEl.innerHTML = '';
    moveHistory = [];
    moveCountEl.innerText = '0';
    scrambleEl.innerText = 'Ready to start.';
    scrambleEl.style.color = 'var(--text-muted)';
    scrambleEl.style.fontStyle = 'italic';
    resetTimer();
    
    // UI Updates
    document.querySelectorAll('.size-btn').forEach(b => {
      b.classList.toggle('active', b.innerText.startsWith(size + '×'));
    });

    // Create Grid
    const offset = (N - 1) / 2;
    for (let x = 0; x < N; x++) {
      for (let y = 0; y < N; y++) {
        for (let z = 0; z < N; z++) {
          createCubie(x, y, z, offset);
        }
      }
    }
    
    // Center the scene based on cube size
    // We use margins in CSS to center the transform origin
    sceneEl.style.width = `calc(var(--unit) * ${N})`;
    sceneEl.style.height = `calc(var(--unit) * ${N})`;
    sceneEl.style.marginLeft = `calc(var(--unit) * ${N/2})`;
    sceneEl.style.marginTop = `calc(var(--unit) * ${N/2})`;
    
    rotX = -25;
    rotY = -35;
    updateSceneRotation();
  }

  function createCubie(x, y, z, offset) {
    const el = document.createElement('div');
    el.className = 'cubie';
    
    // Determine which faces have stickers
    // x: 0(L) to N-1(R)
    // y: 0(U) to N-1(D)
    // z: 0(B) to N-1(F)
    
    let faces = [];
    
    if (z === N-1) faces.push(`<div class="face f-F ${COLORS.F}"><div class="sticker"></div></div>`);
    if (z === 0) faces.push(`<div class="face f-B ${COLORS.B}"><div class="sticker"></div></div>`);
    
    if (x === N-1) faces.push(`<div class="face f-R ${COLORS.R}"><div class="sticker"></div></div>`);
    if (x === 0) faces.push(`<div class="face f-L ${COLORS.L}"><div class="sticker"></div></div>`);
    
    if (y === 0) faces.push(`<div class="face f-U ${COLORS.U}"><div class="sticker"></div></div>`);
    if (y === N-1) faces.push(`<div class="face f-D ${COLORS.D}"><div class="sticker"></div></div>`);
    
    // Inner faces (plastic)
    if (z !== 0 && z !== N-1) faces.push(`<div class="face f-F ${COLORS.X}"></div><div class="face f-B ${COLORS.X}"></div>`);
    if (x !== 0 && x !== N-1) faces.push(`<div class="face f-R ${COLORS.X}"></div><div class="face f-L ${COLORS.X}"></div>`);
    if (y !== 0 && y !== N-1) faces.push(`<div class="face f-U ${COLORS.X}"></div><div class="face f-D ${COLORS.X}"></div>`);

    el.innerHTML = faces.join('');

    const sizePx = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--unit')) + parseInt(getComputedStyle(document.documentElement).getPropertyValue('--gap'));
    const px = (x - offset) * sizePx;
    const py = (y - offset) * sizePx;
    const pz = (z - offset) * sizePx;
    
    el.style.transform = `translate3d(${px}px, ${py}px, ${pz}px)`;
    
    const cubieData = {
      el: el,
      coords: {x, y, z},
      rotation: '' 
    };

    cubies.push(cubieData);
    cubeEl.appendChild(el);
  }

  // --- Interaction ---
  sceneEl.addEventListener('mousedown', e => {
    isDragging = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  });

  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const deltaX = e.clientX - lastMouseX;
    const deltaY = e.clientY - lastMouseY;
    rotY += deltaX * 0.5;
    rotX -= deltaY * 0.5;
    rotX = Math.max(-90, Math.min(90, rotX));
    updateSceneRotation();
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  });

  window.addEventListener('mouseup', () => isDragging = false);
  
  // Touch
  sceneEl.addEventListener('touchstart', e => {
    isDragging = true;
    lastMouseX = e.touches[0].clientX;
    lastMouseY = e.touches[0].clientY;
  }, {passive: false});
  
  window.addEventListener('touchmove', e => {
    if (!isDragging) return;
    const deltaX = e.touches[0].clientX - lastMouseX;
    const deltaY = e.touches[0].clientY - lastMouseY;
    rotY += deltaX * 0.5;
    rotX -= deltaY * 0.5;
    rotX = Math.max(-90, Math.min(90, rotX));
    updateSceneRotation();
    lastMouseX = e.touches[0].clientX;
    lastMouseY = e.touches[0].clientY;
  }, {passive: false});
  
  window.addEventListener('touchend', () => isDragging = false);

  function updateSceneRotation() {
    sceneEl.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
  }

  // --- Logic ---
  function rotateSlice(axis, index, direction) {
    if (isAnimating) return;
    isAnimating = true;

    const sliceCubies = cubies.filter(c => c.coords[axis] === index);
    
    const pivot = document.createElement('div');
    pivot.style.position = 'absolute';
    pivot.style.transformStyle = 'preserve-3d';
    pivot.style.width = '100%';
    pivot.style.height = '100%';
    cubeEl.appendChild(pivot);

    sliceCubies.forEach(c => pivot.appendChild(c.el));

    const deg = 90 * direction;
    let rotateStr = '';
    if (axis === 'x') rotateStr = `rotateX(${deg}deg)`;
    if (axis === 'y') rotateStr = `rotateY(${deg}deg)`; 
    if (axis === 'z') rotateStr = `rotateZ(${deg}deg)`;

    pivot.style.transition = `transform ${getComputedStyle(document.documentElement).getPropertyValue('--anim-speed')} cubic-bezier(0.4, 0.0, 0.2, 1)`;
    pivot.style.transform = rotateStr;

    setTimeout(() => {
      sliceCubies.forEach(c => {
        const {x, y, z} = c.coords;
        let oldY = c.coords.y, oldZ = c.coords.z, oldX = c.coords.x;

        if (axis === 'x') {
          if (direction === 1) { c.coords.y = oldZ; c.coords.z = (N-1) - oldY; }
          else { c.coords.z = oldY; c.coords.y = (N-1) - oldZ; }
        } else if (axis === 'y') {
          if (direction === 1) { c.coords.x = (N-1) - oldZ; c.coords.z = oldX; }
          else { c.coords.z = (N-1) - oldX; c.coords.x = oldZ; }
        } else if (axis === 'z') {
          if (direction === 1) { c.coords.x = oldY; c.coords.y = (N-1) - oldX; }
          else { c.coords.y = oldX; c.coords.x = (N-1) - oldY; }
        }

        const offset = (N - 1) / 2;
        const sizePx = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--unit')) + parseInt(getComputedStyle(document.documentElement).getPropertyValue('--gap'));
        const px = (c.coords.x - offset) * sizePx;
        const py = (c.coords.y - offset) * sizePx;
        const pz = (c.coords.z - offset) * sizePx;
        
        c.rotation = rotateStr + ' ' + c.rotation;
        c.el.style.transform = c.rotation + ` translate3d(${px}px, ${py}px, ${pz}px)`;
        cubeEl.appendChild(c.el);
      });
      pivot.remove();
      isAnimating = false;
    }, 350);
  }

  function scrambleCube() {
    if (isAnimating) return;
    resetTimer();
    startTimer();
    moveHistory = [];
    moveCountEl.innerText = '0';
    scrambleEl.innerText = '';
    scrambleEl.style.color = 'var(--text-main)';
    scrambleEl.style.fontStyle = 'normal';
    
    const moves = 20;
    let count = 0;
    
    const interval = setInterval(() => {
      if (count >= moves) { clearInterval(interval); return; }
      
      const axes = ['x', 'y', 'z'];
      const axis = axes[Math.floor(Math.random() * 3)];
      const index = Math.floor(Math.random() * N);
      const dir = Math.random() > 0.5 ? 1 : -1;
      
      performMove(axis, index, dir, true);
      count++;
    }, 350);
  }

  function performMove(axis, index, dir, record = true) {
    rotateSlice(axis, index, dir);
    
    if (record) {
      moveHistory.push({axis, index, dir});
      moveCountEl.innerText = moveHistory.length;
      
      let label = axis.toUpperCase();
      // Map index to number for display (1-based)
      label += (index + 1);
      if (dir === -1) label += "'";
      
      scrambleEl.innerText += label + ' ';
    }
  }

  function undoMove() {
    if (isAnimating || moveHistory.length === 0) return;
    const last = moveHistory.pop();
    moveCountEl.innerText = moveHistory.length;
    
    // Update text
    let currentText = scrambleEl.innerText.trim();
    if(currentText.length > 0) {
       scrambleEl.innerText = currentText.slice(0, -1 * (currentText.split(' ').pop().length + 1));
    }
    
    performMove(last.axis, last.index, last.dir * -1, false);
  }

  function resetTimer() {
    clearInterval(timerInterval);
    timerEl.innerText = "00:00";
    startTime = null;
  }

  function startTimer() {
    if (startTime) return;
    startTime = Date.now();
    timerInterval = setInterval(() => {
      const delta = Math.floor((Date.now() - startTime) / 1000);
      const m = Math.floor(delta / 60).toString().padStart(2, '0');
      const s = (delta % 60).toString().padStart(2, '0');
      timerEl.innerText = `${m}:${s}`;
    }, 1000);
  }

  // Start
  initCube(3);

</script>
</body>
