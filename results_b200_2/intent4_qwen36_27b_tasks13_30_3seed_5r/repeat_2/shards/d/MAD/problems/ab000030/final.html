<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Hub // Battle Ready</title>
<style>
    :root {
        /* 8. Refine 'Cyber' Aesthetic: Rich Gradients */
        --bg-app: #0b0c15;
        --bg-panel: linear-gradient(180deg, #1a1c29 0%, #13151f 100%);
        --bg-card: rgba(255, 255, 255, 0.03);
        --bg-card-hover: rgba(255, 255, 255, 0.06);
        --bg-card-active: rgba(255, 255, 255, 0.08);
        
        /* 7. Neon Accents */
        --neon-cyan: #00f2ea;
        --neon-magenta: #ff0055;
        --neon-gold: #ffd700;
        
        --status-online: #10b981;
        --status-ingame: #3b82f6;
        --status-offline: #64748b;
        
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-subtle: rgba(255, 255, 255, 0.08);

        /* 8. Typography */
        --font-stack: 'Inter', 'Segoe UI', Roboto, Helvetica, sans-serif;
    }

    * { box-sizing: border-box; outline: none; user-select: none; }

    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        font-family: var(--font-stack);
        background-color: var(--bg-app);
        /* 7. Aesthetic: Deep Noise Texture */
        background-image: 
            radial-gradient(circle at 20% 20%, rgba(0, 242, 234, 0.05) 0%, transparent 40%),
            radial-gradient(circle at 80% 80%, rgba(255, 0, 85, 0.05) 0%, transparent 40%),
            url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.07'/%3E%3C/svg%3E");
        color: var(--text-main);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* 1. Resolve Layout: Strict 3-Column Z-Pattern */
    .app-container {
        width: 1440px;
        height: 900px;
        display: grid;
        /* Left (Context) | Center (Selection) | Right (Detail) */
        grid-template-columns: 280px 1fr 360px; 
        gap: 24px;
        padding: 24px;
    }

    /* --- Shared Panel Style --- */
    .glass-panel {
        background: var(--bg-panel);
        border: 1px solid var(--border-subtle);
        /* 6. Geometric Discipline: 12px for panels */
        border-radius: 12px; 
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    /* --- Scrollbar --- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* --- 5. Avatar Grammar --- */
    .avatar-wrap {
        position: relative;
        width: 48px;
        height: 48px;
        flex-shrink: 0;
    }
    
    .avatar-wrap.large { width: 64px; height: 64px; }
    .avatar-wrap.hero { width: 120px; height: 120px; }

    .avatar-img {
        width: 100%;
        height: 100%;
        /* 6. Geometric Discipline: 50% for avatars */
        border-radius: 50%; 
        object-fit: cover;
        border: 2px solid rgba(255,255,255,0.1);
        background: #1e2235;
    }

    /* 5. Status Indicator: 25% size, bottom-right, stroke border */
    .status-indicator {
        position: absolute;
        bottom: 0;
        right: 0;
        width: 25%;
        height: 25%;
        border-radius: 50%;
        border: 2px solid #1a1c29; /* Matches panel bg to create separation */
        z-index: 2;
    }

    .status-dot {
        width: 100%; height: 100%; border-radius: 50%;
    }

    /* --- LEFT COLUMN (Context/Party) --- */
    .sidebar-left {
        padding: 24px;
        gap: 24px;
    }

    .profile-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--border-subtle);
        margin-bottom: 8px;
    }

    .player-name { 
        font-size: 1.1rem; 
        /* 8. Typography: Semi-Bold */
        font-weight: 600; 
        margin: 12px 0 4px 0; 
        letter-spacing: 0.3px; 
    }
    
    .player-meta {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    /* 8. Typography: Badges visual weight */
    .rank-badge {
        background: rgba(255, 215, 0, 0.1);
        color: var(--neon-gold);
        border: 1px solid rgba(255, 215, 0, 0.2);
        font-size: 0.65rem;
        font-weight: 600;
        padding: 4px 8px;
        /* 6. Geometric Discipline: 8px */
        border-radius: 8px; 
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .level-badge {
        color: var(--text-muted);
        font-size: 0.8rem;
        font-weight: 400;
    }

    /* Party Section */
    .party-section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
    }

    .section-title {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--text-muted);
        font-weight: 600;
    }

    .party-list { display: flex; flex-direction: column; gap: 12px; }

    .party-card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px;
        /* 6. Geometric Discipline: 12px */
        border-radius: 12px;
        background: var(--bg-card);
        border: 1px solid transparent;
        transition: 0.2s;
        cursor: pointer;
    }
    
    .party-card:hover { background: var(--bg-card-hover); }

    .party-info { overflow: hidden; }
    .party-name { 
        font-size: 0.85rem; 
        font-weight: 600; 
        display: block; 
        white-space: nowrap; 
        overflow: hidden; 
        text-overflow: ellipsis; 
        color: var(--text-main); 
    }
    .party-game { 
        font-size: 0.75rem; 
        color: var(--status-ingame); 
        font-weight: 400; 
        margin-top: 2px;
        display: block;
    }

    /* --- CENTER COLUMN (Selection) --- */
    .main-content { padding: 0; }

    .list-header {
        padding: 24px;
        border-bottom: 1px solid var(--border-subtle);
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .column-title {
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    /* 4. Demote 'Add Friend' (Ghost style) */
    .btn-add-friend {
        background: transparent;
        color: var(--text-main);
        border: 1px solid var(--border-subtle);
        font-weight: 500;
        padding: 8px 16px;
        /* 6. Geometric Discipline: 8px */
        border-radius: 8px; 
        font-size: 0.85rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: 0.2s;
    }
    .btn-add-friend:hover { 
        background: var(--bg-card-hover); 
        border-color: var(--text-muted);
    }

    /* Tabs */
    .tabs-row { display: flex; gap: 8px; }

    .tab-item {
        padding: 8px 16px;
        /* 6. Geometric Discipline: 8px */
        border-radius: 8px; 
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--text-muted);
        cursor: pointer;
        transition: 0.2s;
        background: transparent;
    }
    .tab-item:hover { color: var(--text-main); background: var(--bg-card); }
    
    /* 2. Fix Pending Requests Visibility (Active State Styling) */
    .tab-item.active {
        background: var(--bg-card-active);
        color: var(--text-main);
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .tab-badge {
        background: var(--neon-magenta);
        color: white;
        font-size: 0.65rem;
        padding: 2px 6px;
        border-radius: 4px;
        margin-left: 6px;
        font-weight: 600;
    }

    /* Search */
    .search-container { padding: 16px 24px; border-bottom: 1px solid var(--border-subtle); }
    .search-input-wrap { position: relative; }
    
    .search-input {
        width: 100%;
        background: rgba(0,0,0,0.2);
        border: 1px solid transparent;
        padding: 12px 16px 12px 40px;
        /* 6. Geometric Discipline: 8px */
        border-radius: 8px;
        color: var(--text-main);
        font-size: 0.9rem;
        transition: 0.2s;
    }
    .search-input:focus {
        border-color: var(--neon-cyan);
        background: rgba(0,0,0,0.3);
        box-shadow: 0 0 0 2px rgba(0, 242, 234, 0.1);
    }
    
    .search-icon {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
    }

    /* List Area */
    .friends-list { flex: 1; overflow-y: auto; padding: 24px; }

    /* 7. Cyber Aesthetic: Active Row Styling */
    .list-item {
        display: flex;
        align-items: center;
        padding: 16px;
        margin-bottom: 12px;
        /* 6. Geometric Discipline: 12px */
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
        background: var(--bg-card);
        border: 1px solid transparent;
    }

    .list-item:hover {
        background: var(--bg-card-hover);
        transform: translateX(4px);
    }

    .list-item.selected {
        background: var(--bg-card-active);
        border: 1px solid rgba(0, 242, 234, 0.3); /* Cyan Glow Border */
        box-shadow: 0 0 15px rgba(0, 242, 234, 0.05);
    }
    .list-item.selected::before {
        content: '';
        position: absolute;
        left: 0;
        top: 16px;
        bottom: 16px;
        width: 3px;
        background: var(--neon-cyan);
        border-radius: 0 4px 4px 0;
        box-shadow: 0 0 10px var(--neon-cyan);
    }

    .list-details { flex: 1; }
    .list-name { 
        font-weight: 600; 
        font-size: 0.95rem; 
        color: var(--text-main); 
    }
    .list-status { 
        font-size: 0.8rem; 
        color: var(--text-muted); 
        margin-top: 4px; 
        font-weight: 400; 
    }

    /* Request Actions */
    .request-actions { display: flex; gap: 8px; }
    .btn-req {
        border: none;
        padding: 8px 16px;
        /* 6. Geometric Discipline: 8px */
        border-radius: 8px; 
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }
    .btn-accept { background: var(--status-online); color: #fff; }
    .btn-accept:hover { filter: brightness(1.1); }
    .btn-decline { background: rgba(255,255,255,0.05); color: var(--text-muted); }
    .btn-decline:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }

    /* --- RIGHT COLUMN (Detail/Action) --- */
    .sidebar-right { padding: 0; }

    .detail-content {
        padding: 40px 32px;
        display: flex;
        flex-direction: column;
        height: 100%;
        position: relative;
        /* Subtle gradient for detail area */
        background: linear-gradient(180deg, rgba(0, 242, 234, 0.03) 0%, transparent 40%);
    }

    .detail-header { text-align: center; margin-bottom: 32px; }
    
    .detail-avatar-container {
        margin: 0 auto 20px;
        position: relative;
    }
    
    /* 7. Cyber Aesthetic: Neon Glow for selected avatar */
    .detail-avatar-container::after {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        background: linear-gradient(45deg, var(--neon-cyan), transparent);
        z-index: -1;
        opacity: 0.5;
        filter: blur(4px);
    }

    .detail-name { 
        font-size: 1.75rem; 
        font-weight: 600; 
        margin: 0; 
        letter-spacing: 0.5px; 
    }
    
    .detail-rank { 
        display: inline-block; 
        margin-top: 12px; 
        padding: 6px 12px; 
        /* 6. Geometric Discipline: 8px */
        border-radius: 8px; 
        font-size: 0.75rem; 
        font-weight: 600; 
        text-transform: uppercase; 
        background: rgba(255,255,255,0.05);
        color: var(--text-main);
        border: 1px solid var(--border-subtle);
        letter-spacing: 1px;
    }

    .status-pill {
        margin-top: 16px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        background: rgba(59, 130, 246, 0.1);
        color: var(--status-ingame);
        /* 6. Geometric Discipline: 8px */
        border-radius: 8px; 
        font-size: 0.8rem;
        font-weight: 500;
        border: 1px solid rgba(59, 130, 246, 0.2);
    }

    /* Stats Grid */
    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: auto;
    }

    .stat-card {
        background: rgba(0,0,0,0.2);
        padding: 16px;
        /* 6. Geometric Discipline: 12px */
        border-radius: 12px;
        text-align: center;
        border: 1px solid var(--border-subtle);
    }
    .stat-val { 
        display: block; 
        font-size: 1.25rem; 
        font-weight: 600; 
        color: var(--text-main); 
        margin-bottom: 4px; 
    }
    .stat-label { 
        font-size: 0.7rem; 
        color: var(--text-muted); 
        text-transform: uppercase; 
        letter-spacing: 0.5px; 
        font-weight: 500; 
    }

    /* 3. Clarify Action Buttons */
    .detail-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 32px;
    }

    .action-btn {
        width: 100%;
        padding: 14px;
        border: none;
        /* 6. Geometric Discipline: 8px */
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 600;
        font-family: var(--font-stack);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.2s ease;
        letter-spacing: 0.5px;
    }

    /* 7. Cyber Aesthetic: No neon on buttons, but distinct styles */
    .btn-primary {
        background: var(--text-main);
        color: var(--bg-app);
    }
    .btn-primary:hover {
        background: #fff;
        box-shadow: 0 0 15px rgba(255,255,255,0.3);
        transform: translateY(-2px);
    }

    .btn-secondary {
        background: transparent;
        color: var(--neon-magenta);
        border: 1px solid var(--neon-magenta);
    }
    .btn-secondary:hover {
        background: rgba(255, 0, 85, 0.1);
        box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
        transform: translateY(-2px);
    }

    /* Icons */
    svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

<div class="app-container">

    <!-- LEFT COLUMN: Context (Profile + Party) -->
    <aside class="glass-panel sidebar-left">
        
        <!-- Profile Header -->
        <div class="profile-header">
            <div class="avatar-wrap large">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23444'/%3E%3Cstop offset='1' stop-color='%23222'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' fill='url(%23g)'/%3E%3Ccircle cx='50' cy='40' r='20' fill='%23feca57'/%3E%3Cpath d='M20 90 Q50 60 80 90' fill='%23feca57'/%3E%3C/svg%3E" class="avatar-img" alt="Me">
                <div class="status-indicator">
                    <div class="status-dot" style="background: var(--status-online);"></div>
                </div>
            </div>
            <h2 class="player-name">NeonRider</h2>
            <div class="player-meta">
                <span class="rank-badge">Grandmaster</span>
                <span class="level-badge">Lvl 84</span>
            </div>
        </div>

        <!-- Active Party -->
        <div class="party-section">
            <div class="party-section-header">
                <div class="section-title">Active Party (3/4)</div>
                <svg width="16" height="16" viewBox="0 0 24 24" style="color: var(--text-muted); cursor: pointer;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            </div>
            <div class="party-list">
                <!-- Member 1 -->
                <div class="party-card">
                    <div class="avatar-wrap">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23222f3e'/%3E%3Ccircle cx='50' cy='50' r='25' fill='%234cc9f0'/%3E%3C/svg%3E" alt="User">
                        <div class="status-indicator"><div class="status-dot" style="background: var(--status-ingame)"></div></div>
                    </div>
                    <div class="party-info">
                        <span class="party-name">CyberWolf</span>
                        <span class="party-game">Battle Arena</span>
                    </div>
                </div>
                <!-- Member 2 -->
                <div class="party-card">
                    <div class="avatar-wrap">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%233e222f'/%3E%3Ccircle cx='50' cy='50' r='25' fill='%23ff6b6b'/%3E%3C/svg%3E" alt="User">
                        <div class="status-indicator"><div class="status-dot" style="background: var(--status-online)"></div></div>
                    </div>
                    <div class="party-info">
                        <span class="party-name">Viper_X</span>
                        <span class="party-game">In Lobby</span>
                    </div>
                </div>
                <!-- Member 3 -->
                <div class="party-card">
                    <div class="avatar-wrap">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%233e3e22'/%3E%3Ccircle cx='50' cy='50' r='25' fill='%23feca57'/%3E%3C/svg%3E" alt="User">
                        <div class="status-indicator"><div class="status-dot" style="background: var(--status-online)"></div></div>
                    </div>
                    <div class="party-info">
                        <span class="party-name">NovaStar</span>
                        <span class="party-game">In Lobby</span>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <!-- CENTER COLUMN: List -->
    <section class="glass-panel main-content">
        
        <!-- Header -->
        <div class="list-header">
            <div class="header-top">
                <div class="column-title">FRIENDS</div>
                <!-- 4. Demoted Add Friend Button -->
                <button class="btn-add-friend">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                    Add Friend
                </button>
            </div>
            
            <!-- Tabs -->
            <div class="tabs-row">
                <div class="tab-item" id="tab-friends" onclick="switchTab('friends')">Friends</div>
                <div class="tab-item" id="tab-online" onclick="switchTab('online')">Online</div>
                <!-- 2. Fix Pending Requests Visibility (Active by default) -->
                <div class="tab-item active" id="tab-requests" onclick="switchTab('requests')">Requests <span class="tab-badge">3</span></div>
            </div>
        </div>

        <!-- Search -->
        <div class="search-container">
            <div class="search-input-wrap">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" class="search-input" placeholder="Search by name...">
            </div>
        </div>

        <!-- List Container -->
        <div class="friends-list" id="listContainer">
            <!-- JS Injected -->
        </div>
    </section>

    <!-- RIGHT COLUMN: Detail -->
    <aside class="glass-panel sidebar-right">
        
        <div class="detail-content">
            <div class="detail-header">
                <div class="detail-avatar-container">
                    <div class="avatar-wrap hero">
                        <img id="detailImg" src="" alt="Detail">
                        <div class="status-indicator">
                            <div id="detailStatusDot" class="status-dot" style="background: var(--status-ingame)"></div>
                        </div>
                    </div>
                </div>
                <h2 class="detail-name" id="detailName">CyberWolf</h2>
                <span class="detail-rank" id="detailRank">Diamond II</span>
                <div class="status-pill">
                    <svg width="12" height="12" viewBox="0 0 24 24" style="fill:currentColor; stroke:none;"><circle cx="12" cy="12" r="10"/></svg>
                    <span id="detailStatus">Playing Battle Arena</span>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-val">1,240</span>
                    <span class="stat-label">Wins</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val">86%</span>
                    <span class="stat-label">Win Rate</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val">45</span>
                    <span class="stat-label">Matches</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val">Lvl 72</span>
                    <span class="stat-label">Level</span>
                </div>
            </div>

            <!-- 3. Clarify Action Buttons -->
            <div class="detail-actions">
                <!-- 3. Explicitly label 'Invite to Party' -->
                <button class="action-btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                    Invite to Party
                </button>
                <!-- 3. Explicitly label 'Challenge' -->
                <button class="action-btn btn-secondary">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"></path><path d="M13 19l6-6"></path><path d="M16 16l4 4"></path><path d="M19 21l2-2"></path></svg>
                    Challenge
                </button>
            </div>
        </div>
    </aside>

</div>

<script>
    const friends = [
        { id: 1, name: "CyberWolf", status: "ingame", game: "Battle Arena", color: "#4cc9f0", rank: "Diamond II" },
        { id: 2, name: "Viper_X", status: "online", game: "In Lobby", color: "#ff6b6b", rank: "Platinum I" },
        { id: 3, name: "NovaStar", status: "online", game: "In Lobby", color: "#feca57", rank: "Master" },
        { id: 4, name: "GhostShell", status: "offline", game: "Last seen 2h ago", color: "#a9b1d6", rank: "Gold III" },
        { id: 5, name: "PixelPunk", status: "ingame", game: "Ranked 5v5", color: "#a29bfe", rank: "Silver I" },
        { id: 6, name: "IronClad", status: "online", game: "In Lobby", color: "#74b9ff", rank: "Platinum III" },
        { id: 7, name: "ShadowMerk", status: "offline", game: "Last seen yesterday", color: "#636e72", rank: "Diamond I" },
        { id: 8, name: "LunaTide", status: "ingame", game: "Co-op Raid", color: "#00cec9", rank: "Grandmaster" }
    ];

    const requests = [
        { id: 101, name: "DragonSlayer", color: "#ff4757", rank: "Gold I" },
        { id: 102, name: "MysticMage", color: "#70a1ff", rank: "Silver II" },
        { id: 103, name: "RogueOne", color: "#2ed573", rank: "Bronze I" }
    ];

    const listContainer = document.getElementById('listContainer');
    let currentTab = 'requests'; // 2. Default to Requests to show state

    function getStatusColor(status) {
        if(status === 'ingame') return 'var(--status-ingame)';
        if(status === 'online') return 'var(--status-online)';
        return 'var(--status-offline)';
    }

    function switchTab(tab) {
        currentTab = tab;
        // Update Tab UI
        document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
        document.getElementById(`tab-${tab}`).classList.add('active');
        
        // Re-render list
        renderList();
    }

    function renderList() {
        listContainer.innerHTML = '';
        
        if (currentTab === 'requests') {
            // 2. Render Requests
            requests.forEach(req => {
                const item = document.createElement('div');
                item.className = 'list-item'; // Reusing list-item style for consistency
                const svgCode = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2324283b'/%3E%3Ccircle cx='50' cy='50' r='35' fill='${encodeURIComponent(req.color)}' opacity='0.8'/%3E%3C/svg%3E`;
                
                item.innerHTML = `
                    <div class="avatar-wrap">
                        <img src="${svgCode}" alt="${req.name}" class="avatar-img">
                    </div>
                    <div class="list-details" style="flex:1">
                        <div class="list-name">${req.name}</div>
                        <div class="list-status" style="color:var(--neon-gold)">Friend Request</div>
                    </div>
                    <div class="request-actions">
                        <button class="btn-req btn-accept">Accept</button>
                        <button class="btn-req btn-decline">Decline</button>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        } else {
            // Render Friends
            const filtered = currentTab === 'online' 
                ? friends.filter(f => f.status !== 'offline') 
                : friends;

            filtered.forEach(friend => {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.onclick = () => selectFriend(friend, item);

                const statusText = friend.status === 'ingame' ? `Playing ${friend.game}` : (friend.status === 'online' ? 'Online' : 'Offline');
                const svgCode = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2324283b'/%3E%3Ccircle cx='50' cy='50' r='35' fill='${encodeURIComponent(friend.color)}' opacity='0.8'/%3E%3C/svg%3E`;

                item.innerHTML = `
                    <div class="avatar-wrap">
                        <img src="${svgCode}" alt="${friend.name}" class="avatar-img">
                        <div class="status-indicator">
                            <div class="status-dot" style="background:${getStatusColor(friend.status)}"></div>
                        </div>
                    </div>
                    <div class="list-details">
                        <div class="list-name">${friend.name}</div>
                        <div class="list-status">${statusText}</div>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }
    }

    function selectFriend(friend, element) {
        document.querySelectorAll('.list-item').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');

        // Update Right Panel
        document.getElementById('detailName').innerText = friend.name;
        document.getElementById('detailRank').innerText = friend.rank;
        
        const statusText = friend.status === 'ingame' ? `Playing ${friend.game}` : (friend.status === 'online' ? 'Online' : 'Offline');
        document.getElementById('detailStatus').innerText = statusText;
        
        // Update Detail Avatar
        const svgCode = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2324283b'/%3E%3Ccircle cx='50' cy='50' r='35' fill='${encodeURIComponent(friend.color)}' opacity='0.8'/%3E%3C/svg%3E`;
        document.getElementById('detailImg').src = svgCode;
        document.getElementById('detailStatusDot').style.background = getStatusColor(friend.status);
    }

    // Initialize
    renderList();
    
    // Auto-select a friend to show state on load (switch to friends tab first for demo)
    window.onload = () => {
        switchTab('friends');
        setTimeout(() => {
            const first = document.querySelector('.list-item');
            if(first) first.click();
        }, 100);
    };
</script>
</body>
</html>
