<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Hub // Aetheria</title>
<style>
    :root {
        --bg-app: #0b0c10;
        --bg-panel: #15161e;
        --bg-panel-alt: #1c1e29;
        --bg-input: #101116;
        
        --accent-primary: #ff9f43; /* Warm Sunset Orange */
        --accent-primary-glow: rgba(255, 159, 67, 0.4);
        --accent-secondary: #54a0ff; /* Electric Blue */
        --accent-success: #1dd1a1; /* Mint Green */
        --accent-danger: #ff6b6b; /* Coral Red */
        --accent-gold: #feca57;
        
        --text-main: #ffffff;
        --text-muted: #8b92a5;
        --text-dim: #4b5168;
        
        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-active: rgba(255, 159, 67, 0.6);
        
        --font-stack: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        
        --shadow-card: 0 8px 32px rgba(0,0,0,0.5);
        
        /* Unified Radius: 8px for all cards/inputs as per Critique 5 */
        --r-sm: 8px;
        --r-md: 8px; 
        --r-lg: 12px; /* Used for main container */
        --r-squircle: 24px; /* For avatars */
    }

    * { box-sizing: border-box; outline: none; user-select: none; }
    
    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-app);
        color: var(--text-main);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        background-image: 
            radial-gradient(circle at 15% 30%, rgba(255, 159, 67, 0.05) 0%, transparent 40%),
            radial-gradient(circle at 85% 80%, rgba(84, 160, 255, 0.05) 0%, transparent 40%),
            linear-gradient(135deg, #0b0c10 0%, #12141d 100%);
    }

    /* --- Layout Container --- */
    .app-container {
        width: 1280px;
        height: 850px;
        background: var(--bg-panel);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-card), 0 0 0 1px var(--border-subtle);
        display: grid;
        grid-template-columns: 280px 1fr 360px; /* Adjusted widths */
        overflow: hidden;
        position: relative;
    }

    /* --- Scrollbar --- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2d3e; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3f58; }

    /* --- Left Sidebar (Profile & Party) --- */
    .sidebar {
        background: rgba(0,0,0,0.2);
        border-right: 1px solid var(--border-subtle);
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    .profile-card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border-subtle);
    }

    .avatar-wrapper {
        position: relative;
        width: 56px;
        height: 56px;
        flex-shrink: 0;
    }

    .avatar-img {
        width: 100%;
        height: 100%;
        border-radius: var(--r-squircle);
        background: #2a2d3e;
        border: 2px solid rgba(255,255,255,0.1);
        object-fit: cover;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .status-indicator {
        position: absolute;
        bottom: 0px;
        right: 0px;
        width: 14px;
        height: 14px;
        background: var(--accent-success);
        border: 3px solid var(--bg-panel);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--accent-success);
        z-index: 2;
    }

    .profile-info h2 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.3px;
    }

    .rank-badge {
        display: inline-block;
        background: linear-gradient(135deg, #feca57 0%, #ff9f43 100%);
        color: #1a1d29;
        font-size: 0.65rem;
        font-weight: 800;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: var(--r-sm);
        margin-top: 4px;
        box-shadow: 0 2px 10px rgba(254, 202, 87, 0.3);
        letter-spacing: 0.5px;
    }

    /* --- Party Section: Unified Card Visual (Critique 4) --- */
    .party-section {
        flex: 1;
        position: relative;
    }

    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }
    
    .section-title {
        color: var(--text-muted);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        font-weight: 700;
    }

    /* The "Squad" Container - Unified Background */
    .squad-container {
        background: rgba(255,255,255,0.03); /* Unified card background */
        border: 1px solid var(--border-subtle);
        border-radius: var(--r-md);
        padding: 8px;
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .party-member {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 8px;
        border-radius: var(--r-sm);
        position: relative;
        transition: background 0.2s;
        cursor: default;
    }

    .party-member:hover {
        background: rgba(255,255,255,0.04);
    }

    .mini-avatar {
        width: 36px;
        height: 36px;
        border-radius: var(--r-squircle);
        position: relative;
        background: #333;
        border: 2px solid rgba(255,255,255,0.05);
        box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        flex-shrink: 0;
    }

    .mini-avatar img { width: 100%; height: 100%; border-radius: 20px; object-fit: cover; }
    
    .mini-status {
        position: absolute;
        bottom: -2px; right: -2px;
        width: 10px; height: 10px;
        border-radius: 50%;
        border: 2px solid var(--bg-panel);
    }

    .member-details {
        flex: 1;
        z-index: 1;
        overflow: hidden;
    }
    .member-name { font-size: 0.9rem; font-weight: 600; display: block; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .member-game { font-size: 0.75rem; color: var(--accent-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* --- Main Content (Requests & List) --- */
    .main-content {
        display: flex;
        flex-direction: column;
        background: var(--bg-panel);
        position: relative;
        z-index: 1;
        overflow: hidden;
    }

    /* Header Area */
    .main-header {
        padding: 24px 32px 0 32px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
    }

    .add-friend-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--border-subtle);
        color: var(--text-main);
        padding: 8px 16px;
        border-radius: var(--r-sm);
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }
    .add-friend-btn:hover {
        background: rgba(255,255,255,0.1);
        border-color: var(--text-muted);
    }

    /* Request Row (Moved to Top - Critique 3) */
    .requests-scroll-container {
        padding: 16px 32px;
        display: flex;
        gap: 12px;
        overflow-x: auto;
        border-bottom: 1px solid var(--border-subtle);
        flex-shrink: 0;
        scrollbar-width: none; 
    }
    .requests-scroll-container::-webkit-scrollbar { display: none; }

    .request-card {
        flex: 0 0 220px;
        background: var(--bg-panel-alt);
        border-radius: var(--r-sm);
        padding: 12px;
        border: 1px solid var(--border-subtle);
        display: flex;
        flex-direction: column;
        gap: 10px;
        position: relative;
        transition: transform 0.2s, border-color 0.2s;
    }
    
    .request-card:hover {
        transform: translateY(-2px);
        border-color: var(--accent-secondary);
    }

    .req-user {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .req-avatar {
        width: 36px; height: 36px; border-radius: var(--r-squircle);
        background: #333;
        overflow: hidden;
    }
    .req-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .req-info {
        flex: 1;
    }
    .req-name { font-weight: 600; font-size: 0.9rem; display: block; }
    .req-time { font-size: 0.7rem; color: var(--text-muted); }

    .req-actions {
        display: flex;
        gap: 8px;
        margin-top: auto;
    }

    .btn {
        padding: 6px 0;
        border-radius: var(--r-sm);
        border: none;
        font-weight: 600;
        font-size: 0.8rem;
        cursor: pointer;
        transition: 0.2s;
        text-align: center;
        flex: 1;
    }

    .btn-accept {
        background: var(--accent-secondary);
        color: #fff;
        box-shadow: 0 2px 8px rgba(84, 160, 255, 0.3);
    }
    .btn-accept:hover { background: #4088e0; }

    .btn-decline {
        background: transparent;
        color: var(--text-muted);
        flex: 0;
        padding: 6px 10px;
    }
    .btn-decline:hover { color: var(--accent-danger); background: rgba(255, 107, 107, 0.1); }

    /* Search & List */
    .search-area {
        padding: 20px 32px;
        flex-shrink: 0;
    }

    .search-bar {
        position: relative;
        width: 100%;
    }

    .search-bar input {
        width: 100%;
        background: var(--bg-input);
        border: 1px solid var(--border-subtle);
        padding: 12px 16px 12px 44px;
        border-radius: var(--r-sm); /* 8px */
        color: var(--text-main);
        font-size: 0.95rem;
        transition: 0.2s;
    }

    .search-bar input:focus {
        border-color: var(--accent-primary);
        box-shadow: 0 0 0 2px rgba(255, 159, 67, 0.15);
        background: #151720;
    }

    .search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        width: 18px;
        height: 18px;
    }

    .tabs {
        display: flex;
        gap: 8px;
        margin-top: 12px;
    }

    .tab {
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-muted);
        cursor: pointer;
        transition: 0.2s;
        background: transparent;
        border: 1px solid transparent;
    }

    .tab:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
    
    .tab.active {
        background: rgba(255, 159, 67, 0.1);
        color: var(--accent-primary);
        border-color: rgba(255, 159, 67, 0.2);
    }

    .friend-list-container {
        flex: 1;
        overflow-y: auto;
        padding: 0 32px 32px 32px;
    }

    .friend-item {
        display: flex;
        align-items: center;
        padding: 12px;
        border-radius: var(--r-sm);
        cursor: pointer;
        transition: all 0.2s ease;
        border: 1px solid transparent;
        margin-bottom: 8px;
        position: relative;
    }

    .friend-item:hover {
        background: rgba(255,255,255,0.03);
    }

    /* Critique 5: Selected State Change */
    .friend-item.selected {
        background: rgba(255, 255, 255, 0.1); /* 10% White Background */
        border-color: transparent; /* Remove heavy stroke */
        box-shadow: none;
    }
    
    /* Subtle accent indicator on left for selected, keeping link to orange theme */
    .friend-item.selected::before {
        content: '';
        position: absolute;
        left: 0; top: 12px; bottom: 12px;
        width: 3px;
        background: var(--accent-primary);
        border-radius: 0 4px 4px 0;
    }

    .friend-avatar {
        width: 48px;
        height: 48px;
        border-radius: var(--r-squircle);
        position: relative;
        margin-right: 16px;
        background: #222;
        flex-shrink: 0;
    }
    
    .friend-avatar img { width: 100%; height: 100%; border-radius: var(--r-squircle); object-fit: cover;}

    .friend-status-indicator {
        position: absolute;
        bottom: -2px;
        right: -2px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2.5px solid var(--bg-panel);
    }

    .friend-info { flex: 1; }
    .friend-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; color: var(--text-main); }
    .friend-status-text { font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    
    .status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
    .status-dot.online { background: var(--accent-success); box-shadow: 0 0 6px var(--accent-success); }
    .status-dot.ingame { background: var(--accent-secondary); box-shadow: 0 0 6px var(--accent-secondary); }
    .status-dot.offline { background: var(--text-dim); }

    .friend-actions {
        display: flex;
        gap: 8px;
        opacity: 0;
        transform: translateX(10px);
        transition: 0.2s;
    }

    .friend-item:hover .friend-actions, 
    .friend-item.selected .friend-actions {
        opacity: 1;
        transform: translateX(0);
    }

    .action-icon-btn {
        width: 32px;
        height: 32px;
        border-radius: var(--r-sm);
        border: 1px solid var(--border-subtle);
        background: rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text-muted);
        transition: 0.2s;
    }

    .action-icon-btn:hover {
        background: var(--accent-primary);
        color: #fff;
        border-color: var(--accent-primary);
        transform: translateY(-1px);
    }

    /* --- Right Panel (Details) --- */
    .details-panel {
        background: var(--bg-panel-alt);
        border-left: 1px solid var(--border-subtle);
        display: flex;
        flex-direction: column;
        padding: 0;
        position: relative;
    }

    /* Critique 6: Game UI Polish - Grid Texture Background */
    .details-panel::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 20px 20px;
        pointer-events: none;
        z-index: 0;
        mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
    }

    .detail-view {
        display: flex;
        flex-direction: column;
        height: 100%;
        position: relative;
        z-index: 1;
        animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideIn {
        from { opacity: 0; transform: translateX(20px); }
        to { opacity: 1; transform: translateX(0); }
    }

    .detail-header {
        padding: 40px 24px 20px;
        text-align: center;
        background: linear-gradient(180deg, rgba(255,159,67,0.05) 0%, transparent 100%);
        position: relative;
    }
    
    .back-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: 0.2s;
        padding: 6px 10px;
        border-radius: var(--r-sm);
    }
    .back-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }

    .detail-avatar {
        width: 90px;
        height: 90px;
        border-radius: var(--r-squircle);
        margin: 0 auto 16px;
        border: 3px solid var(--bg-panel);
        box-shadow: 0 0 25px rgba(255, 159, 67, 0.2);
        background: #333;
    }
    .detail-avatar img { width: 100%; height: 100%; border-radius: 22px; }

    .detail-name { font-size: 1.4rem; font-weight: 800; margin: 0; letter-spacing: 0.5px; }
    
    .detail-rank-badge {
        display: inline-block;
        margin-top: 8px;
        padding: 4px 12px;
        border-radius: var(--r-sm);
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .detail-status { color: var(--text-muted); font-size: 0.85rem; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; }

    .detail-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 20px 24px;
    }

    .stat-box {
        background: rgba(0,0,0,0.3);
        border: 1px solid var(--border-subtle);
        padding: 14px;
        border-radius: var(--r-sm); /* 8px */
        text-align: center;
    }
    .stat-val { display: block; font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
    .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

    /* Critique 2: Primary Actions */
    .detail-actions {
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: auto;
    }

    .btn-primary {
        background: var(--accent-primary);
        color: #1a1d29;
        font-weight: 700;
        padding: 14px;
        border-radius: var(--r-sm); /* 8px */
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(255, 159, 67, 0.3);
        transition: 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 0.95rem;
    }
    .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.1); }

    .btn-secondary {
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--border-subtle);
        color: var(--text-main);
        font-weight: 600;
        padding: 12px;
        border-radius: var(--r-sm);
        cursor: pointer;
        transition: 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); border-color: var(--text-muted); }

    .btn-battle {
        background: rgba(255, 107, 107, 0.08);
        color: var(--accent-danger);
        border: 1px solid rgba(255, 107, 107, 0.2);
    }
    .btn-battle:hover { background: var(--accent-danger); color: white; border-color: var(--accent-danger); }

    /* --- SVG Icons --- */
    svg { fill: currentColor; }

    /* --- Utility --- */
    .hidden { display: none !important; }
</style>
</head>
<body>

<div class="app-container">
    
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="profile-card">
            <div class="avatar-wrapper">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233a3f58'/%3E%3Cstop offset='1' stop-color='%232a2d3e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' fill='url(%23g)'/%3E%3Ccircle cx='50' cy='40' r='20' fill='%23feca57'/%3E%3Cpath d='M20 90 Q50 60 80 90' fill='%23feca57'/%3E%3C/svg%3E" alt="Me" class="avatar-img">
                <div class="status-indicator"></div>
            </div>
            <div class="profile-info">
                <h2>NeonRider</h2>
                <span class="rank-badge">Grandmaster</span>
            </div>
        </div>

        <div class="party-section">
            <div class="section-header">
                <span class="section-title">Active Party (3/4)</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-muted)"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
            </div>
            
            <!-- Unified Squad Container -->
            <div class="squad-container">
                <!-- Party Member 1 -->
                <div class="party-member">
                    <div class="mini-avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23222f3e'/%3E%3Ccircle cx='50' cy='50' r='25' fill='%2354a0ff'/%3E%3C/svg%3E" alt="User">
                        <div class="mini-status" style="background: var(--accent-secondary)"></div>
                    </div>
                    <div class="member-details">
                        <span class="member-name">CyberWolf</span>
                        <span class="member-game">Battle Arena</span>
                    </div>
                </div>
                <!-- Party Member 2 -->
                <div class="party-member">
                    <div class="mini-avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%233e222f'/%3E%3Ccircle cx='50' cy='50' r='25' fill='%23ff6b6b'/%3E%3C/svg%3E" alt="User">
                        <div class="mini-status" style="background: var(--accent-success)"></div>
                    </div>
                    <div class="member-details">
                        <span class="member-name">Viper_X</span>
                        <span class="member-game">In Lobby</span>
                    </div>
                </div>
                <!-- Party Member 3 (Added to fill squad visual) -->
                <div class="party-member">
                    <div class="mini-avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%233e3e22'/%3E%3Ccircle cx='50' cy='50' r='25' fill='%23feca57'/%3E%3C/svg%3E" alt="User">
                        <div class="mini-status" style="background: var(--accent-success)"></div>
                    </div>
                    <div class="member-details">
                        <span class="member-name">NovaStar</span>
                        <span class="member-game">In Lobby</span>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <section class="main-content">
        
        <!-- Header with Add Friend -->
        <div class="main-header">
            <div style="font-size: 1.2rem; font-weight: 700;">Social</div>
            <button class="add-friend-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                Add Friend
            </button>

        <!-- Horizontal Scrollable Requests (Moved from Right Sidebar - Critique 3) -->
        <div class="requests-scroll-container">
            <!-- Request 1 -->
            <div class="request-card">
                <div class="req-user">
                    <div class="req-avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%232d3436'/%3E%3Cpath d='M50 20 L80 80 L20 80 Z' fill='%23a29bfe'/%3E%3C/svg%3E" alt="User">

                        <span class="req-name">Glitch_Monkey</span>

                    </div>
                </div>
                <div class="req-actions">
                    <button class="btn btn-accept">Accept</button>
                    <button class="btn btn-decline">Decline</button>
                </div>
            </div>

            <!-- Request 2 -->
            <div class="request-card">
                <div class="req-user">
                    <div class="req-avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23636e72'/%3E%3Ccircle cx='50' cy='50' r='30' fill='%2300b894'/%3E%3C/svg%3E" alt="User">
                    </div>
                    <div class="req-info">
                        <span class="req-name">EcoWarrior</span>
                        <span class="req-time">1h ago</span>
                    </div>
                </div>
                <div class="req-actions">
                    <button class="btn btn-accept">Accept</button>
                    <button class="btn btn-decline">Decline</button>
                </div>
            </div>
            
             <!-- Request 3 -->
             <div class="request-card">
                <div class="req-user">
                    <div class="req-avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000000'/%3E%3Ccircle cx='50' cy='50' r='30' fill='%23ffffff'/%3E%3C/svg%3E" alt="User">
                    </div>
                    <div class="req-info">
                        <span class="req-name">ZeroCool</span>
                        <span class="req-time">5h ago</span>
                    </div>
                </div>
                <div class="req-actions">
                    <button class="btn btn-accept">Accept</button>
                    <button class="btn btn-decline">Decline</button>
                </div>
            </div>
        </div>

        <!-- Search Area -->
        <div class="search-area">
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                <input type="text" placeholder="Search friends...">
            </div>
            <div class="tabs">
                <div class="tab active">All Friends</div>
                <div class="tab">Online</div>
                <div class="tab">In Game</div>
            </div>
        </div>

        <!-- Friend List -->
        <div class="friend-list-container" id="friendList">
            <!-- Populated by JS -->
        </div>
    </section>

    <!-- RIGHT PANEL -->
    <aside class="details-panel">
        
        <!-- VIEW: Selected Friend Detail (Critique 1) -->
        <div id="detailView" class="detail-view">
            <div class="detail-header">
                <div class="back-btn" onclick="closeDetail()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    Back
                </div>
                <div class="detail-avatar">
                    <img id="detailImg" src="" alt="Detail">
                </div>
                <h2 class="detail-name" id="detailName">Name</h2>
                <span class="detail-rank-badge" id="detailRank">Rank</span>
                <div class="detail-status">
                    <span class="status-dot" id="detailDot"></span>
                    <span id="detailStatusText">Status</span>
                </div>
            </div>

            <div class="detail-stats">
                <div class="stat-box">
                    <span class="stat-val">1,240</span>
                    <span class="stat-label">Wins</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val">86%</span>
                    <span class="stat-label">Win Rate</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val">45</span>
                    <span class="stat-label">Matches</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val">Lvl 72</span>
                    <span class="stat-label">Level</span>
                </div>
            </div>

            <!-- Critique 2: Primary Actions -->
            <div class="detail-actions">
                <button class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                    Invite to Game
                </button>
                <button class="btn btn-secondary btn-battle">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"></path><path d="M13 19l6-6"></path><path d="M16 16l4 4"></path><path d="M19 21l2-2"></path></svg>
                    Challenge to Battle
                </button>
            </div>
        </div>

    </aside>

</div>

<script>
    // Mock Data
    const friends = [
        { id: 1, name: "CyberWolf", status: "ingame", game: "Battle Arena", avatar: "%23222f3e", color: "%2354a0ff", rank: "Diamond II" },
        { id: 2, name: "Viper_X", status: "online", game: "In Lobby", avatar: "%233e222f", color: "%23ff6b6b", rank: "Platinum I" },
        { id: 3, name: "NovaStar", status: "online", game: "In Lobby", avatar: "%233e3e22", color: "%23feca57", rank: "Master" },
        { id: 4, name: "GhostShell", status: "offline", game: "Last seen 2h ago", avatar: "%23222222", color: "%23dfe6e9", rank: "Gold III" },
        { id: 5, name: "PixelPunk", status: "ingame", game: "Ranked 5v5", avatar: "%233e223e", color: "%23a29bfe", rank: "Silver I" },
        { id: 6, name: "IronClad", status: "online", game: "In Lobby", avatar: "%23333333", color: "%2374b9ff", rank: "Platinum III" },
        { id: 7, name: "ShadowMerk", status: "offline", game: "Last seen yesterday", avatar: "%231e1e1e", color: "%23636e72", rank: "Diamond I" },
        { id: 8, name: "LunaTide", status: "ingame", game: "Co-op Raid", avatar: "%231e2b30", color: "%2300cec9", rank: "Grandmaster" }
    ];

    const listContainer = document.getElementById('friendList');
    const detailView = document.getElementById('detailView');

    // Helper to get status color variable
    function getStatusColor(status) {
        if(status === 'ingame') return 'var(--accent-secondary)';
        if(status === 'online') return 'var(--accent-success)';
        return 'var(--text-dim)';
    }

    // Render Helper
    function renderFriends() {
        listContainer.innerHTML = '';
        friends.forEach(friend => {
            const isOnline = friend.status === 'online';
            const isGame = friend.status === 'ingame';
            
            const dotClass = friend.status === 'ingame' ? 'ingame' : (friend.status === 'online' ? 'online' : 'offline');
            const statusText = isGame ? `Playing ${friend.game}` : (isOnline ? 'Online' : 'Offline');

            const item = document.createElement('div');
            item.className = 'friend-item';
            item.onclick = () => selectFriend(friend, item);

            // Generate a simple SVG avatar based on data
            const avatarSvg = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='${friend.avatar}'/%3E%3Ccircle cx='50' cy='50' r='30' fill='${friend.color}' opacity='0.8'/%3E%3C/svg%3E`;

            item.innerHTML = `
                <div class="friend-avatar">
                    <img src="${avatarSvg}" alt="${friend.name}">
                    <div class="friend-status-indicator" style="background:${getStatusColor(friend.status)}"></div>
                </div>
                <div class="friend-info">
                    <div class="friend-name">${friend.name}</div>
                    <div class="friend-status-text">
                        <span class="status-dot ${dotClass}"></span>
                        ${statusText}
                    </div>
                </div>
                <div class="friend-actions">
                    <div class="action-icon-btn" title="Message">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    </div>
                    ${isOnline ? `
                    <div class="action-icon-btn" title="Invite">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                    </div>` : ''}
                </div>
            `;
            listContainer.appendChild(item);
        });
    }

    // Select Logic
    function selectFriend(friend, element) {
        // Highlight UI
        document.querySelectorAll('.friend-item').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');

        // Populate Detail Panel (Critique 1)
        const nameEl = document.getElementById('detailName');
        const rankEl = document.getElementById('detailRank');
        const dotEl = document.getElementById('detailDot');
        const statusEl = document.getElementById('detailStatusText');
        const imgEl = document.getElementById('detailImg');

        nameEl.innerText = friend.name;
        rankEl.innerText = friend.rank;
        
        // Style the rank badge based on rank (Simple logic for demo)
        if(friend.rank.includes('Grandmaster') || friend.rank.includes('Master')) {
            rankEl.style.background = 'linear-gradient(135deg, #feca57 0%, #ff9f43 100%)';
            rankEl.style.color = '#1a1d29';
        } else if (friend.rank.includes('Diamond')) {
            rankEl.style.background = 'linear-gradient(135deg, #74b9ff 0%, #0984e3 100%)';
            rankEl.style.color = '#fff';
        } else {
            rankEl.style.background = 'linear-gradient(135deg, #dfe6e9 0%, #b2bec3 100%)';
            rankEl.style.color = '#2d3436';
        }

        // Status
        dotEl.className = `status-dot ${friend.status === 'ingame' ? 'ingame' : (friend.status === 'online' ? 'online' : 'offline')}`;
        statusEl.innerText = friend.game;
        
        // Image
        const avatarSvg = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='${friend.avatar}'/%3E%3Ccircle cx='50' cy='50' r='30' fill='${friend.color}' opacity='0.8'/%3E%3C/svg%3E`;
        imgEl.src = avatarSvg;

        // Ensure view is active (if it was closed)
        detailView.classList.remove('hidden');
    }

    function closeDetail() {
        detailView.classList.add('hidden');
        document.querySelectorAll('.friend-item').forEach(el => el.classList.remove('selected'));
    }

    // Initialize
    renderFriends();

    // Auto-select first friend (CyberWolf) to demonstrate the selected state immediately
    window.onload = () => {
        const firstItem = document.querySelector('.friend-item');
        if(firstItem) {
            // Trigger click event on first item
            firstItem.click();
        }
    };

</script>
</body>
</html>
