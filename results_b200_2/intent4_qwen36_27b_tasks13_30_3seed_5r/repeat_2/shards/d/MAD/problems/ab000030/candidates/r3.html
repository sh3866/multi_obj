<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Hub // Aetheria Revised</title>
<style>
    :root {
        /* 2. Visual System: Deep Warm Charcoal/Slate Gradient */
        --bg-app-start: #1a1b26;
        --bg-app-end: #24283b;
        
        /* Glassmorphism Variables */
        --glass-bg: rgba(30, 32, 48, 0.65);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-blur: blur(20px);
        
        /* 2. Visual System: Warm Amber/Neon Coral Accent */
        --accent-primary: #ff8c42; /* Warm Amber/Coral */
        --accent-primary-hover: #ff9f5c;
        --accent-glow: rgba(255, 140, 66, 0.35);
        
        /* Status Colors */
        --status-online: #2cb67d; /* Mint */
        --status-ingame: #4cc9f0; /* Cyan */
        --status-offline: #565f89;
        
        /* Text */
        --text-main: #eceff4;
        --text-muted: #a9b1d6;
        --text-dim: #565f89;
        
        /* 3. Component Standardization */
        --radius-card: 12px;
        --radius-pill: 999px; /* Fully rounded buttons */
        --radius-8: 8px;
        
        --font-stack: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; outline: none; user-select: none; }
    
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        font-family: var(--font-stack);
        /* 2. Background Gradient */
        background: linear-gradient(135deg, var(--bg-app-start) 0%, var(--bg-app-end) 100%);
        color: var(--text-main);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* --- Layout: Three Column Fix --- */
    .app-container {
        width: 1400px;
        height: 900px;
        display: grid;
        grid-template-columns: 300px 1fr 340px; /* Left Context, Center List, Right Detail */
        gap: 16px;
        padding: 20px;
    }

    /* --- Shared Glassmorphism Container Style --- */
    .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-card);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Scrollbar --- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* --- LEFT COLUMN (Context) --- */
    .sidebar-left {
        padding: 24px;
        gap: 24px;
    }

    /* 1. Layout: Expanded Profile Header */
    .profile-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--glass-border);
        margin-bottom: 8px;
    }

    .avatar-container {
        position: relative;
        width: 80px;
        height: 80px;
        margin-bottom: 12px;
    }

    /* 3. Standardization: Unified Circular Avatar */
    .avatar-img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid rgba(255,255,255,0.1);
        background: #2a2d3e;
    }

    /* 3. Standardization: Fixed Status Dot Position */
    .status-dot-large {
        position: absolute;
        bottom: 2px;
        right: 2px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 3px solid var(--bg-app-end); /* Matches container bg for clean cut */
        background: var(--status-online);
        box-shadow: 0 0 10px var(--status-online);
        z-index: 2;
    }

    .player-name { font-size: 1.25rem; font-weight: 700; margin: 0; }
    
    .player-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
    }

    .rank-badge {
        background: linear-gradient(135deg, #feca57 0%, #ff9f43 100%);
        color: #1a1b26;
        font-size: 0.7rem;
        font-weight: 800;
        padding: 4px 10px;
        border-radius: var(--radius-8);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .level-badge {
        color: var(--text-muted);
        font-size: 0.85rem;
        font-weight: 600;
    }

    /* Active Party Section */
    .party-section-title {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--text-muted);
        margin-bottom: 12px;
        font-weight: 700;
    }

    .party-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .party-card {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(255,255,255,0.03);
        padding: 10px;
        border-radius: var(--radius-8);
        border: 1px solid transparent;
        transition: 0.2s;
    }
    
    .party-card:hover { background: rgba(255,255,255,0.06); }

    .party-avatar-wrap {
        width: 40px;
        height: 40px;
        position: relative;
        flex-shrink: 0;
    }
    
    .party-avatar-wrap img {
        width: 100%; height: 100%; border-radius: 50%;
    }
    
    .mini-status {
        position: absolute;
        bottom: 0; right: 0;
        width: 12px; height: 12px;
        border-radius: 50%;
        border: 2px solid var(--bg-app-end);
    }

    .party-info {
        overflow: hidden;
    }
    .party-name { font-size: 0.9rem; font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .party-game { font-size: 0.75rem; color: var(--status-ingame); }

    /* --- CENTER COLUMN (List) --- */
    .main-content {
        padding: 0;
        position: relative;
    }

    .list-header {
        padding: 24px;
        border-bottom: 1px solid var(--glass-border);
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    /* 3. Standardization: Pill Buttons */
    .btn {
        border: none;
        font-family: var(--font-stack);
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .btn-pill {
        border-radius: var(--radius-pill);
        padding: 10px 20px;
        font-size: 0.9rem;
    }

    /* 3. Standardization: Primary Button (Solid Accent) */
    .btn-primary {
        background: var(--accent-primary);
        color: #1a1b26;
        box-shadow: 0 4px 15px var(--accent-glow);
    }
    .btn-primary:hover {
        background: var(--accent-primary-hover);
        transform: translateY(-1px);
    }

    /* 3. Standardization: Secondary Button (Outline) */
    .btn-secondary {
        background: transparent;
        border: 1px solid var(--accent-primary);
        color: var(--accent-primary);
    }
    .btn-secondary:hover {
        background: rgba(255, 140, 66, 0.1);
    }
    
    .btn-ghost {
        background: rgba(255,255,255,0.05);
        color: var(--text-main);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); }

    /* 1. Layout: Tabs Row */
    .tabs-row {
        display: flex;
        gap: 4px;
        background: rgba(0,0,0,0.2);
        padding: 4px;
        border-radius: var(--radius-pill);
        width: fit-content;
    }

    .tab-item {
        padding: 8px 16px;
        border-radius: var(--radius-pill);
        font-size: 0.85rem;
        color: var(--text-muted);
        cursor: pointer;
        transition: 0.2s;
    }
    .tab-item:hover { color: var(--text-main); }
    .tab-item.active {
        background: rgba(255,255,255,0.1);
        color: var(--text-main);
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .tab-badge {
        background: var(--accent-primary);
        color: #1a1b26;
        font-size: 0.7rem;
        padding: 2px 6px;
        border-radius: 10px;
        margin-left: 6px;
        font-weight: 800;
    }

    /* Search Area */
    .search-container {
        padding: 16px 24px;
    }
    
    .search-input-wrap {
        position: relative;
    }
    
    .search-input {
        width: 100%;
        background: rgba(0,0,0,0.2);
        border: 1px solid var(--glass-border);
        padding: 12px 16px 12px 44px;
        border-radius: var(--radius-8);
        color: var(--text-main);
        font-size: 0.95rem;
    }
    .search-input:focus {
        border-color: var(--accent-primary);
        background: rgba(0,0,0,0.3);
    }
    
    .search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
    }

    /* List Area */
    .friends-list {
        flex: 1;
        overflow-y: auto;
        padding: 0 24px 24px 24px;
    }

    .friend-item {
        display: flex;
        align-items: center;
        padding: 16px;
        margin-bottom: 8px;
        border-radius: var(--radius-8);
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
        border: 1px solid transparent;
    }

    .friend-item:hover {
        background: rgba(255,255,255,0.03);
    }

    /* 4. Selection State: Subtle tint + Left Accent Bar */
    .friend-item.selected {
        background: rgba(255, 140, 66, 0.08); /* Subtle warm tint */
        border-color: rgba(255, 140, 66, 0.2);
    }
    .friend-item.selected::before {
        content: '';
        position: absolute;
        left: 0;
        top: 16px;
        bottom: 16px;
        width: 4px;
        background: var(--accent-primary);
        border-radius: 0 4px 4px 0;
        box-shadow: 0 0 8px var(--accent-glow);
    }

    .friend-avatar-lg {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        position: relative;
        margin-right: 16px;
        flex-shrink: 0;
    }
    .friend-avatar-lg img { width: 100%; height: 100%; border-radius: 50%; }
    
    .friend-status-dot {
        position: absolute;
        bottom: 0; right: 0;
        width: 14px; height: 14px;
        border-radius: 50%;
        border: 2px solid var(--bg-app-end);
    }

    .friend-details { flex: 1; }
    .friend-name { font-weight: 600; font-size: 1rem; color: var(--text-main); }
    .friend-status-text { font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; margin-top: 4px; }

    /* --- RIGHT COLUMN (Detail) --- */
    .sidebar-right {
        padding: 0;
    }

    .detail-content {
        padding: 32px 24px;
        display: flex;
        flex-direction: column;
        height: 100%;
        position: relative;
        background: radial-gradient(circle at 50% 0%, rgba(255, 140, 66, 0.05), transparent 60%);
    }

    .detail-header { text-align: center; margin-bottom: 24px; }
    
    .detail-avatar-lg {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        margin: 0 auto 16px;
        border: 3px solid rgba(255,255,255,0.1);
        box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        position: relative;
    }
    .detail-avatar-lg img { width: 100%; height: 100%; border-radius: 50%; }

    .detail-name { font-size: 1.5rem; font-weight: 800; margin: 0; letter-spacing: 0.5px; }
    .detail-rank { 
        display: inline-block; 
        margin-top: 8px; 
        padding: 4px 12px; 
        border-radius: var(--radius-8); 
        font-size: 0.75rem; 
        font-weight: 700; 
        text-transform: uppercase; 
        background: rgba(255,255,255,0.1);
        color: var(--text-main);
    }

    /* Stats Grid */
    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: auto;
    }

    .stat-card {
        background: rgba(0,0,0,0.2);
        padding: 12px;
        border-radius: var(--radius-8);
        text-align: center;
        border: 1px solid rgba(255,255,255,0.05);
    }
    .stat-val { display: block; font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
    .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

    /* 4. Actionability: Distinct Buttons */
    .detail-actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 24px;
    }

    /* Dominant Visual Element */
    .action-btn-main {
        width: 100%;
        padding: 14px;
        font-size: 1rem;
        box-shadow: 0 4px 20px var(--accent-glow);
    }

    /* Distinct Secondary Button */
    .action-btn-secondary {
        width: 100%;
        padding: 12px;
        border-width: 1px;
        color: var(--text-main); /* White text for outline */
        border-color: rgba(255,255,255,0.2);
        background: transparent;
    }
    .action-btn-secondary:hover {
        border-color: var(--text-main);
        background: rgba(255,255,255,0.05);
    }

    /* Icons */
    svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

</style>
</head>
<body>

<div class="app-container">

    <!-- LEFT COLUMN: Context (Profile + Party) -->
    <aside class="glass-panel sidebar-left">
        
        <!-- Expanded Profile Header -->
        <div class="profile-header">
            <div class="avatar-container">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23444'/%3E%3Cstop offset='1' stop-color='%23222'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' fill='url(%23g)'/%3E%3Ccircle cx='50' cy='40' r='20' fill='%23feca57'/%3E%3Cpath d='M20 90 Q50 60 80 90' fill='%23feca57'/%3E%3C/svg%3E" class="avatar-img" alt="Me">
                <div class="status-dot-large"></div>
            </div>
            <h2 class="player-name">NeonRider</h2>
            <div class="player-meta">
                <span class="rank-badge">Grandmaster</span>
                <span class="level-badge">Lvl 84</span>
            </div>
        </div>

        <!-- Active Party -->
        <div class="party-section">
            <div class="party-section-title">Active Party (3/4)</div>
            <div class="party-list">
                <!-- Member 1 -->
                <div class="party-card">
                    <div class="party-avatar-wrap">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23222f3e'/%3E%3Ccircle cx='50' cy='50' r='25' fill='%234cc9f0'/%3E%3C/svg%3E" alt="User">
                        <div class="mini-status" style="background: var(--status-ingame)"></div>
                    </div>
                    <div class="party-info">
                        <span class="party-name">CyberWolf</span>
                        <span class="party-game">Battle Arena</span>
                    </div>
                </div>
                <!-- Member 2 -->
                <div class="party-card">
                    <div class="party-avatar-wrap">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%233e222f'/%3E%3Ccircle cx='50' cy='50' r='25' fill='%23ff6b6b'/%3E%3C/svg%3E" alt="User">
                        <div class="mini-status" style="background: var(--status-online)"></div>
                    </div>
                    <div class="party-info">
                        <span class="party-name">Viper_X</span>
                        <span class="party-game">In Lobby</span>
                    </div>
                </div>
                <!-- Member 3 -->
                <div class="party-card">
                    <div class="party-avatar-wrap">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%233e3e22'/%3E%3Ccircle cx='50' cy='50' r='25' fill='%23feca57'/%3E%3C/svg%3E" alt="User">
                        <div class="mini-status" style="background: var(--status-online)"></div>
                    </div>
                    <div class="party-info">
                        <span class="party-name">NovaStar</span>
                        <span class="party-game">In Lobby</span>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <!-- CENTER COLUMN: List -->
    <section class="glass-panel main-content">
        
        <!-- Header with Tabs -->
        <div class="list-header">
            <div class="header-top">
                <div style="font-size: 1.25rem; font-weight: 700;">Friends</div>
                <button class="btn btn-pill btn-ghost">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                    Add Friend
                </button>
            </div>
            
            <!-- 1. Layout: Tabs Row (Requests moved here) -->
            <div class="tabs-row">
                <div class="tab-item active">All Friends</div>
                <div class="tab-item">Online</div>
                <div class="tab-item">Requests <span class="tab-badge">3</span></div>
            </div>
        </div>

        <!-- Search -->
        <div class="search-container">
            <div class="search-input-wrap">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" class="search-input" placeholder="Search by name...">
            </div>
        </div>

        <!-- List -->
        <div class="friends-list" id="friendList">
            <!-- JS Injected -->
        </div>
    </section>

    <!-- RIGHT COLUMN: Detail -->
    <aside class="glass-panel sidebar-right">
        
        <div class="detail-content">
            <div class="detail-header">
                <div class="detail-avatar-lg">
                    <img id="detailImg" src="" alt="Detail">
                </div>
                <h2 class="detail-name" id="detailName">CyberWolf</h2>
                <span class="detail-rank" id="detailRank">Diamond II</span>
                <div style="margin-top: 10px; color: var(--status-ingame); font-size: 0.9rem; font-weight: 600;">
                    <span style="display:inline-block; width: 8px; height: 8px; background: currentColor; border-radius: 50%; margin-right: 6px; box-shadow: 0 0 8px currentColor;"></span>
                    <span id="detailStatus">Playing Battle Arena</span>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-val">1,240</span>
                    <span class="stat-label">Wins</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val">86%</span>
                    <span class="stat-label">Win Rate</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val">45</span>
                    <span class="stat-label">Matches</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val">Lvl 72</span>
                    <span class="stat-label">Level</span>
                </div>
            </div>

            <!-- 4. Actionability: Dominant Invite + Distinct Battle -->
            <div class="detail-actions">
                <button class="btn btn-primary btn-pill action-btn-main">
                    <svg width="20" height="20" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                    Invite to Game
                </button>
                <button class="btn btn-secondary btn-pill action-btn-secondary">
                    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"></path><path d="M13 19l6-6"></path><path d="M16 16l4 4"></path><path d="M19 21l2-2"></path></svg>
                    Challenge to Battle
                </button>
            </div>
        </div>
    </aside>

</div>

<script>
    const friends = [
        { id: 1, name: "CyberWolf", status: "ingame", game: "Battle Arena", color: "#4cc9f0", rank: "Diamond II" },
        { id: 2, name: "Viper_X", status: "online", game: "In Lobby", color: "#ff6b6b", rank: "Platinum I" },
        { id: 3, name: "NovaStar", status: "online", game: "In Lobby", color: "#feca57", rank: "Master" },
        { id: 4, name: "GhostShell", status: "offline", game: "Last seen 2h ago", color: "#a9b1d6", rank: "Gold III" },
        { id: 5, name: "PixelPunk", status: "ingame", game: "Ranked 5v5", color: "#a29bfe", rank: "Silver I" },
        { id: 6, name: "IronClad", status: "online", game: "In Lobby", color: "#74b9ff", rank: "Platinum III" },
        { id: 7, name: "ShadowMerk", status: "offline", game: "Last seen yesterday", color: "#636e72", rank: "Diamond I" },
        { id: 8, name: "LunaTide", status: "ingame", game: "Co-op Raid", color: "#00cec9", rank: "Grandmaster" }
    ];

    const listContainer = document.getElementById('friendList');
    
    function getStatusColor(status) {
        if(status === 'ingame') return 'var(--status-ingame)';
        if(status === 'online') return 'var(--status-online)';
        return 'var(--status-offline)';
    }

    function renderFriends() {
        listContainer.innerHTML = '';
        friends.forEach(friend => {
            const item = document.createElement('div');
            item.className = 'friend-item';
            item.onclick = () => selectFriend(friend, item);

            const statusText = friend.status === 'ingame' ? `Playing ${friend.game}` : (friend.status === 'online' ? 'Online' : 'Offline');

            // Generate simple SVG avatar
            const svgCode = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2324283b'/%3E%3Ccircle cx='50' cy='50' r='35' fill='${encodeURIComponent(friend.color)}' opacity='0.8'/%3E%3C/svg%3E`;

            item.innerHTML = `
                <div class="friend-avatar-lg">
                    <img src="${svgCode}" alt="${friend.name}">
                    <div class="friend-status-dot" style="background:${getStatusColor(friend.status)}"></div>
                </div>
                <div class="friend-details">
                    <div class="friend-name">${friend.name}</div>
                    <div class="friend-status-text">${statusText}</div>
                </div>
            `;
            listContainer.appendChild(item);
        });
    }

    function selectFriend(friend, element) {
        document.querySelectorAll('.friend-item').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');

        // Update Right Panel
        document.getElementById('detailName').innerText = friend.name;
        document.getElementById('detailRank').innerText = friend.rank;
        document.getElementById('detailStatus').innerText = friend.status === 'ingame' ? `Playing ${friend.game}` : (friend.status === 'online' ? 'Online' : 'Offline');
        
        const svgCode = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2324283b'/%3E%3Ccircle cx='50' cy='50' r='35' fill='${encodeURIComponent(friend.color)}' opacity='0.8'/%3E%3C/svg%3E`;
        document.getElementById('detailImg').src = svgCode;
    }

    // Initialize
    renderFriends();
    
    // Auto-select first to show state
    window.onload = () => {
        const first = document.querySelector('.friend-item');
        if(first) first.click();
    };
</script>
</body>
</html>
