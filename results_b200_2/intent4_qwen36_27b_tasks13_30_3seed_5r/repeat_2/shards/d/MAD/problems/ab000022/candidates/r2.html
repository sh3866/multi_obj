<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Bounce: Cyber Diorama</title>
    <style>
        :root {
            --bg-deep: #050510;
            --bg-mid: #120824;
            --accent-cyan: #00f2ff;
            --accent-pink: #ff00cc;
            --accent-yellow: #ffcc00;
            --accent-green: #00ff99;
            --font-main: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
            --hud-bg: rgba(5, 5, 15, 0.85);
            --hud-border: 1px solid rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-deep);
            color: white;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- BACKGROUND CANVAS --- */
        #bg-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        /* --- UI LAYOUT GRID --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 80px 1fr 120px;
            padding: 20px 40px;
            pointer-events: none; /* Let clicks pass to canvas where empty */
        }

        /* --- SHARED UI SHAPES --- */
        .cyber-box {
            background: var(--hud-bg);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.15);
            pointer-events: auto;
            /* Chamfered corners */
            clip-path: polygon(
                15px 0, 100% 0, 
                100% calc(100% - 15px), calc(100% - 15px) 100%, 
                0 100%, 0 15px
            );
        }

        .cyber-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, var(--accent-cyan), transparent);
        }

        /* --- 1. TOP LEFT: TITLE --- */
        .header-area {
            grid-column: 1;
            grid-row: 1;
            display: flex;
            align-items: center;
        }

        .game-title {
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-style: italic;
            color: #fff;
            text-shadow: 2px 2px 0px var(--accent-pink), -1px -1px 0 var(--accent-cyan);
            position: relative;
        }
        .game-title span { color: var(--accent-cyan); }

        /* --- 2. TOP CENTER: LEVEL SELECT --- */
        .level-selector {
            grid-column: 2;
            grid-row: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        .level-card {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 8px 25px;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--accent-yellow);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.2);
            transition: transform 0.2s;
            cursor: pointer;
        }
        .level-card:hover { transform: scale(1.05); background: rgba(255, 204, 0, 0.1); }

        .level-icon {
            font-size: 1.5rem;
            color: var(--accent-yellow);
            text-shadow: 0 0 10px var(--accent-yellow);
        }
        .level-text {
            display: flex;
            flex-direction: column;
        }
        .level-label { font-size: 0.6rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .level-name { font-size: 1.1rem; font-weight: bold; font-family: monospace; }

        /* --- 3. TOP RIGHT: HUD CLUSTER --- */
        .hud-cluster {
            grid-column: 3;
            grid-row: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            justify-content: center;
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px 15px;
            background: rgba(0,0,0,0.4);
            border-right: 3px solid var(--accent-cyan);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 10px 100%, 0 calc(100% - 10px));
            min-width: 140px;
        }
        .hud-item.score { border-color: var(--accent-green); }
        
        .hud-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
        .hud-val { font-family: monospace; font-weight: bold; font-size: 1rem; letter-spacing: 1px; }

        /* --- 4. BOTTOM LEFT: CONTROLS --- */
        .controls-area {
            grid-column: 1;
            grid-row: 3;
            display: flex;
            align-items: flex-end;
        }

        .controls-panel {
            padding: 15px;
            width: 220px;
        }
        .controls-title {
            font-size: 0.7rem;
            color: var(--accent-cyan);
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(0, 242, 255, 0.3);
            padding-bottom: 5px;
        }

        .key-row { display: flex; gap: 10px; margin-bottom: 8px; align-items: center; }
        .key-cap {
            width: 28px; height: 28px;
            background: #222;
            border: 1px solid #444;
            border-bottom: 3px solid #000;
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-family: monospace; font-size: 0.8rem; font-weight: bold;
            clip-path: polygon(3px 0, 100% 0, 100% calc(100% - 3px), calc(100% - 3px) 100%, 0 100%, 0 3px);
        }
        .key-desc { font-size: 0.75rem; color: #ccc; }

        /* --- 5. BOTTOM CENTER: START BUTTON --- */
        .action-area {
            grid-column: 2;
            grid-row: 3;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 10px;
            pointer-events: none;
        }

        .start-btn {
            pointer-events: auto;
            position: relative;
            background: linear-gradient(135deg, var(--accent-pink), #9900cc);
            color: white;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            padding: 15px 60px;
            border: none;
            cursor: pointer;
            letter-spacing: 2px;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            box-shadow: 0 0 30px rgba(255, 0, 204, 0.4);
            transition: all 0.2s;
            /* Diegetic look */
            text-shadow: 0 2px 0 rgba(0,0,0,0.5);
        }

        .start-btn:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 0 50px rgba(255, 0, 204, 0.7), inset 0 0 20px rgba(255,255,255,0.2);
            text-shadow: 0 0 10px white;
        }
        
        .start-btn:active { transform: scale(0.98); }

        /* Decorative lines on button */
        .start-btn::after {
            content: '';
            position: absolute;
            bottom: 5px; left: 5px; right: 5px; top: 5px;
            border: 1px solid rgba(255,255,255,0.3);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            pointer-events: none;
        }

        /* Responsive adjustments */
        @media (max-width: 900px) {
            .ui-layer { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; padding: 10px; }
            .header-area { grid-row: 1; }
            .level-selector { grid-row: 1; margin-left: auto; margin-right: 10px; }
            .hud-cluster { display: none; } /* Hide on mobile */
            .controls-area { display: none; } /* Hide on mobile */
            .action-area { grid-row: 4; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="ui-layer">
        <!-- 1. Top Left: Title -->
        <header class="header-area">
            <div class="game-title">Neon <span>Bounce</span></div>
        </header>

        <!-- 2. Top Center: Level Select -->
        <div class="level-selector">
            <div class="level-card">
                <div class="level-icon">⚡</div>
                <div class="level-text">
                    <div class="level-label">Sector 1</div>
                    <div class="level-name">CYBER PLAINS</div>
                </div>
            </div>
        </div>

        <!-- 3. Top Right: HUD Cluster -->
        <div class="hud-cluster">
            <div class="hud-item">
                <div class="hud-icon" style="color:var(--accent-yellow)">◉</div>
                <div class="hud-val">0,240</div>
            </div>
            <div class="hud-item score">
                <div class="hud-icon" style="color:var(--accent-green)">★</div>
                <div class="hud-val">98,500</div>
            </div>
        </div>

        <!-- 4. Bottom Left: Controls -->
        <div class="controls-area">
            <div class="controls-panel cyber-box">
                <div class="controls-title">Controls</div>
                <div class="key-row">
                    <div class="key-cap">Z</div>
                    <div class="key-cap">X</div>
                    <div class="key-desc">Jump / Dash</div>
                </div>
                <div class="key-row">
                    <div class="key-cap">←</div>
                    <div class="key-cap">→</div>
                    <div class="key-desc">Move</div>
                </div>
            </div>
        </div>

        <!-- 5. Bottom Center: Start Button -->
        <div class="action-area">
            <button class="start-btn" onclick="startGame()">START ADVENTURE</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // --- CONFIGURATION ---
        const COLORS = {
            skyTop: '#050510',
            skyBot: '#2a0a3b',
            sunGrad1: '#ff00cc',
            sunGrad2: '#ffcc00',
            gridLine: 'rgba(0, 242, 255, 0.15)',
            gridHighlight: 'rgba(255, 0, 204, 0.3)',
            heroMain: '#00f2ff',
            heroDark: '#0099aa',
            platform: '#1a1a2e',
            platformEdge: '#00ff99',
            coin: '#ffcc00',
            enemy: '#ff0055',
            goal: '#ffffff'
        };

        // --- RESIZE ---
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- ENTITIES ---

        function drawSky(time) {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, COLORS.skyTop);
            grad.addColorStop(0.6, COLORS.skyBot);
            grad.addColorStop(1, '#000');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Stars
            ctx.fillStyle = '#fff';
            for(let i=0; i<50; i++) {
                const x = (Math.sin(i * 132.1) * 43758.5453) % width;
                const y = (Math.cos(i * 432.1) * 43758.5453) % (height * 0.6);
                const size = Math.abs(Math.sin(time * 0.001 + i)) * 2;
                if (x > 0 && y > 0) {
                    ctx.globalAlpha = 0.5 + Math.sin(time * 0.005 + i) * 0.5;
                    ctx.fillRect(x, y, size, size);
                }
            }
            ctx.globalAlpha = 1;
        }

        function drawSun(time) {
            const cx = width * 0.5;
            const cy = height * 0.35;
            const r = Math.min(width, height) * 0.18;

            // Glow
            ctx.shadowBlur = 60;
            ctx.shadowColor = COLORS.sunGrad1;
            
            // Gradient
            const grad = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
            grad.addColorStop(0, COLORS.sunGrad1);
            grad.addColorStop(1, COLORS.sunGrad2);
            ctx.fillStyle = grad;

            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();

            // Retro Stripes (Masking)
            ctx.shadowBlur = 0;
            ctx.fillStyle = COLORS.skyBot; // Match sky bottom to "cut" the sun
            for(let i = 0; i < 8; i++) {
                const y = cy + (10 + i * 12);
                const h = 2 + i * 1.5;
                if (y < cy + r) {
                    ctx.fillRect(cx - r, y, r * 2, h);
                }
            }
        }

        function drawGrid(time) {
            const horizonY = height * 0.55;
            const centerX = width * 0.5;
            
            ctx.save();
            ctx.beginPath();
            // Clip to below horizon
            ctx.rect(0, horizonY, width, height - horizonY);
            ctx.clip();

            // Moving Vertical Lines (Perspective)
            ctx.strokeStyle = COLORS.gridLine;
            ctx.lineWidth = 2;
            
            // Calculate offset for movement
            const speed = 2;
            const offset = (time * speed) % 100;

            // Horizontal Lines
            for(let i = 0; i < 20; i++) {
                // Exponential spacing for perspective
                const perspective = Math.pow(i / 20, 2.5);
                const y = horizonY + (height - horizonY) * perspective;
                
                // Animate Y position slightly for "scrolling" effect
                // Note: True infinite scroll logic is complex with perspective, 
                // so we simulate it by shifting the "ground" texture or just fading.
                // Here we draw static perspective lines.
                
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            // Radiating Lines
            for(let i = -20; i <= 20; i++) {
                const xBase = centerX + (i * 100);
                ctx.beginPath();
                ctx.moveTo(centerX, horizonY); // Vanishing point
                ctx.lineTo(xBase * 4, height); // Spread out at bottom
                ctx.stroke();
            }
            
            // Ground fill
            const groundGrad = ctx.createLinearGradient(0, horizonY, 0, height);
            groundGrad.addColorStop(0, 'rgba(20, 0, 40, 0.8)');
            groundGrad.addColorStop(1, 'rgba(0, 0, 0, 1)');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, horizonY, width, height - horizonY);

            ctx.restore();
        }

        function drawMountains(time) {
            const baseY = height * 0.55;
            
            // Layer 1 (Far)
            ctx.fillStyle = '#120524';
            ctx.beginPath();
            ctx.moveTo(0, height);
            for(let x = 0; x <= width; x += 10) {
                const y = baseY - 50 + Math.sin(x * 0.005 + time * 0.0002) * 30;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height);
            ctx.fill();

            // Layer 2 (Mid - darker)
            ctx.fillStyle = '#0a0212';
            ctx.beginPath();
            ctx.moveTo(0, height);
            for(let x = 0; x <= width; x += 10) {
                const y = baseY + 20 + Math.sin(x * 0.01 + time * 0.0005) * 20;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height);
            ctx.fill();
        }

        // --- CYBER DIORAMA (Gameplay Elements) ---
        
        function drawPlatform(x, y, w, h) {
            ctx.fillStyle = COLORS.platform;
            ctx.strokeStyle = COLORS.platformEdge;
            ctx.lineWidth = 2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = COLORS.platformEdge;

            // Draw chamfered rect
            const chamfer = 5;
            ctx.beginPath();
            ctx.moveTo(x + chamfer, y);
            ctx.lineTo(x + w - chamfer, y);
            ctx.lineTo(x + w, y + chamfer);
            ctx.lineTo(x + w, y + h - chamfer);
            ctx.lineTo(x + w - chamfer, y + h);
            ctx.lineTo(x + chamfer, y + h);
            ctx.lineTo(x, y + h - chamfer);
            ctx.lineTo(x, y + chamfer);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Tech details
            ctx.fillStyle = COLORS.platformEdge;
            ctx.fillRect(x + 10, y + h/2 - 2, w - 20, 4);
            ctx.shadowBlur = 0;
        }

        function drawCoin(x, y, time) {
            ctx.save();
            ctx.translate(x, y);
            const scale = Math.abs(Math.sin(time * 0.005));
            ctx.scale(scale, 1);
            
            ctx.fillStyle = COLORS.coin;
            ctx.shadowBlur = 15;
            ctx.shadowColor = COLORS.coin;
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 0, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawEnemy(x, y, time) {
            ctx.save();
            ctx.translate(x, y);
            const bob = Math.sin(time * 0.008) * 10;
            ctx.translate(0, bob);

            ctx.fillStyle = COLORS.enemy;
            ctx.shadowBlur = 15;
            ctx.shadowColor = COLORS.enemy;
            
            // Spiky shape
            ctx.beginPath();
            ctx.moveTo(0, -15);
            ctx.lineTo(12, 10);
            ctx.lineTo(0, 20);
            ctx.lineTo(-12, 10);
            ctx.closePath();
            ctx.fill();

            // Eye
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(0, -5, 4, 0, Math.PI*2);
            ctx.fill();

            ctx.restore();
        }

        function drawGoal(x, y) {
            ctx.save();
            // Pole
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#fff';
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y - 120);
            ctx.stroke();

            // Flag
            ctx.fillStyle = COLORS.sunGrad1;
            ctx.shadowColor = COLORS.sunGrad1;
            ctx.beginPath();
            ctx.moveTo(x, y - 120);
            ctx.lineTo(x + 40, y - 100);
            ctx.lineTo(x, y - 80);
            ctx.fill();
            
            // Base
            ctx.fillStyle = COLORS.heroMain;
            ctx.shadowColor = COLORS.heroMain;
            ctx.fillRect(x - 10, y - 10, 20, 10);
            
            ctx.restore();
        }

        function drawDiorama(time) {
            const groundY = height * 0.75;
            const scale = Math.min(width, height) / 800; // Scale elements based on screen

            ctx.save();
            ctx.scale(scale, scale);
            
            // Adjust coordinates based on scale
            const baseX = width * 0.2 / scale; 
            const baseY = groundY / scale;

            // 1. Main Ground Platform (Hero stands here)
            drawPlatform(baseX, baseY, 400, 40);

            // 2. Floating Platform (Mid)
            drawPlatform(baseX + 350, baseY - 120, 120, 30);

            // 3. High Platform
            drawPlatform(baseX + 550, baseY - 250, 100, 30);

            // 4. Coins
            drawCoin(baseX + 410, baseY - 160, time);
            drawCoin(baseX + 600, baseY - 290, time + 1000);

            // 5. Enemy
            drawEnemy(baseX + 500, baseY - 60, time);

            // 6. Goal
            drawGoal(baseX + 700, baseY);

            ctx.restore();
        }

        function drawHero(time) {
            // Hero sits on the main platform
            const groundY = height * 0.75;
            const heroX = width * 0.28;
            const bounce = Math.abs(Math.sin(time * 0.008)) * 5; // Idle bounce
            const heroY = groundY - 40 - bounce;

            ctx.save();
            ctx.translate(heroX, heroY);

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath();
            ctx.ellipse(0, 40 + bounce, 20, 5, 0, 0, Math.PI*2);
            ctx.fill();

            // Glow
            ctx.shadowBlur = 20;
            ctx.shadowColor = COLORS.heroMain;

            // Body
            ctx.fillStyle = COLORS.heroMain;
            ctx.beginPath();
            ctx.arc(0, 0, 25, 0, Math.PI*2);
            ctx.fill();

            // Face Mask
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 0, 18, 0, Math.PI*2);
            ctx.fill();

            // Eyes (Looking at goal)
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(6, -4, 3, 0, Math.PI*2);
            ctx.arc(-6, -4, 3, 0, Math.PI*2);
            ctx.fill();

            // Ears
            ctx.fillStyle = COLORS.heroMain;
            ctx.beginPath();
            ctx.arc(-20, -15, 8, 0, Math.PI*2);
            ctx.arc(20, -15, 8, 0, Math.PI*2);
            ctx.fill();

            // Shoes
            ctx.fillStyle = COLORS.sunGrad1; // Orange/Red
            ctx.beginPath();
            ctx.ellipse(-12, 25, 10, 6, 0, 0, Math.PI*2);
            ctx.ellipse(12, 25, 10, 6, 0, 0, Math.PI*2);
            ctx.fill();

            // Scarf (Flowing left)
            ctx.strokeStyle = COLORS.sunGrad1;
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 10;
            ctx.shadowColor = COLORS.sunGrad1;
            ctx.beginPath();
            ctx.moveTo(-15, -5);
            ctx.quadraticCurveTo(-40, -10 + Math.sin(time*0.01)*5, -60, 5 + Math.sin(time*0.01)*10);
            ctx.stroke();

            ctx.restore();
        }

        // --- MAIN LOOP ---
        function animate(time) {
            ctx.clearRect(0, 0, width, height);

            drawSky(time);
            drawSun(time);
            drawGrid(time);
            drawMountains(time);
            drawDiorama(time); // The level preview
            drawHero(time);

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        function startGame() {
            const btn = document.querySelector('.start-btn');
            const originalText = btn.innerText;
            
            // Glitch effect simulation
            let count = 0;
            const interval = setInterval(() => {
                const chars = '!@#$%^&*()_+-=[]{}|;:,.<>?';
                const char = chars[Math.floor(Math.random() * chars.length)];
                btn.innerText = btn.innerText.charAt(0) + char + btn.innerText.substring(2);
                btn.style.color = `hsl(${Math.random()*360}, 100%, 50%)`;
                count++;
                if(count > 10) {
                    clearInterval(interval);
                    btn.innerText = "LOADING...";
                    btn.style.color = "white";
                    setTimeout(() => {
                        alert("WELCOME TO CYBER PLAINS");
                        btn.innerText = originalText;
                    }, 500);
                }
            }, 50);
        }

    </script>
</body>
</html>
