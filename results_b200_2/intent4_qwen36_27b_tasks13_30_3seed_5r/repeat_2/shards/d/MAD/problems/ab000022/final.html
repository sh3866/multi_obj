<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital Quest: Sky High</title>
    <style>
        :root {
            --bg-sky-top: #3a7bd5;
            --bg-sky-bot: #00d2ff;
            --primary-color: #ff3f34;
            --secondary-color: #2ecc71;
            --accent-yellow: #f1c40f;
            --wood-dark: #8d6e63;
            --wood-light: #d7ccc8;
            --font-ui: 'Segoe UI', 'Verdana', sans-serif;
            --font-title: 'Arial Black', 'Impact', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: var(--font-ui);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-sky-top);
        }

        /* --- CANVAS LAYER --- */
        #game-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: auto 1fr auto;
            padding: 40px;
            pointer-events: none;
        }

        /* --- SHARED UI COMPONENTS --- */
        .ui-panel {
            pointer-events: auto;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .ui-panel:hover { transform: translateY(-2px); }

        /* --- 1. HEADER: TITLE (Top Left) --- */
        .header-area {
            grid-column: 1 / 2;
            grid-row: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .game-title {
            font-family: var(--font-title);
            font-size: 4.5rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            line-height: 0.9;
            text-shadow: 
                4px 4px 0px var(--primary-color), 
                8px 8px 0px rgba(0,0,0,0.2),
                0 0 20px rgba(255,255,255,0.5);
            letter-spacing: -2px;
            transform: skewX(-5deg);
            margin-bottom: 10px;
        }
        
        .game-subtitle {
            font-size: 1.2rem;
            color: #fff;
            font-weight: 800;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.95;
        }

        /* --- 2. WORLD SELECT (Diegetic: Wooden Sign) --- */
        /* Replaces the sterile white box with a wooden signpost graphic */
        .world-selector {
            position: relative;
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 280px;
            padding: 10px 20px;
            background: linear-gradient(to bottom, #8d6e63, #5d4037);
            border-radius: 8px;
            box-shadow: 
                0 4px 0 #3e2723, 
                0 10px 20px rgba(0,0,0,0.3);
            border: 2px solid #4e342e;
            transform: perspective(500px) rotateX(5deg);
        }

        /* Wood Grain Texture (CSS pattern) */
        .world-selector::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.1) 3px);
            opacity: 0.3;
            border-radius: 6px;
        }

        /* Nails */
        .nail {
            position: absolute;
            width: 8px; height: 8px;
            background: #333;
            border-radius: 50%;
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.3);
            z-index: 2;
        }
        .nail.tl { top: 8px; left: 8px; }
        .nail.tr { top: 8px; right: 8px; }
        .nail.bl { bottom: 8px; left: 8px; }
        .nail.br { bottom: 8px; right: 8px; }

        .world-icon {
            width: 40px; height: 40px;
            background: #fff;
            border: 2px solid #333;
            border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-title);
            font-size: 1rem;
            color: #333;
            z-index: 2;
            transform: rotate(-3deg);
        }

        .world-text {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
            z-index: 2;
        }
        .world-label { font-size: 0.7rem; text-transform: uppercase; color: #d7ccc8; font-weight: 700; letter-spacing: 1px; }
        .world-name { font-size: 1.2rem; font-weight: 800; color: #fff; text-shadow: 1px 1px 0 #000; }

        /* --- 3. HUD (Diegetic: Cloud Containers) --- */
        .hud-area {
            grid-column: 3 / 4;
            grid-row: 1;
            display: flex;
            justify-content: flex-end;
            gap: 25px;
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 1.5rem;
            min-width: 140px;
            justify-content: flex-end;
            /* Cloud Shape Background */
            background: #fff;
            border-radius: 50px;
            padding: 8px 25px 8px 20px;
            box-shadow: 
                0 8px 0 rgba(0,0,0,0.05), 
                0 15px 30px rgba(0,0,0,0.1);
            position: relative;
            color: #333;
        }

        /* Cloud "puffs" using pseudo elements */
        .hud-item::before, .hud-item::after {
            content: '';
            position: absolute;
            background: #fff;
            border-radius: 50%;
            z-index: -1;
        }
        .hud-item::before { width: 30px; height: 30px; top: -10px; left: 20px; }
        .hud-item::after { width: 40px; height: 40px; top: -15px; right: 30px; }

        .hud-icon {
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            color: #fff;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .hud-icon.coins { background: var(--accent-yellow); }
        .hud-icon.score { background: var(--primary-color); }

        /* --- 4. CONTROLS (Bottom Center) --- */
        /* Moved to center for better hierarchy */
        .controls-area {
            grid-column: 2 / 3;
            grid-row: 3;
            justify-self: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .controls-label { 
            font-size: 0.8rem; 
            font-weight: 800; 
            color: rgba(255,255,255,0.7); 
            text-transform: uppercase; 
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .controls-box {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            padding: 12px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .key-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Unified Geometry: Identical keycaps */
        .key-cap {
            background: #fff;
            border: 2px solid rgba(0,0,0,0.1);
            border-bottom: 6px solid rgba(0,0,0,0.15);
            border-radius: 10px;
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900;
            font-size: 1.1rem;
            color: #2f3542;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
            font-family: var(--font-title);
        }
        
        .key-cap.action { 
            background: var(--primary-color); 
            color: #fff;
            border-color: rgba(192, 57, 43, 0.5);
            border-bottom-color: #c0392b;
            width: 50px; /* Slightly wider for text */
        }

        .key-label {
            font-size: 0.8rem;
            font-weight: 800;
            color: #fff;
            margin-left: 5px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* --- 5. START BUTTON (Bottom Right - Prominent) --- */
        .action-area {
            grid-column: 3 / 4;
            grid-row: 3;
            justify-self: end;
            align-self: end;
            pointer-events: none;
            margin-bottom: 20px;
        }

        .start-btn {
            pointer-events: auto;
            background: var(--primary-color);
            color: #fff;
            font-family: var(--font-title);
            font-size: 1.8rem;
            text-transform: uppercase;
            padding: 25px 60px;
            border: 4px solid #fff;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 
                0 10px 0 #c0392b, 
                0 20px 40px rgba(255, 71, 87, 0.4);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-shadow: 0 2px 0 rgba(0,0,0,0.2);
            position: relative;
            letter-spacing: 2px;
            /* Floating Animation */
            animation: floatBtn 3s ease-in-out infinite;
        }

        .start-btn:hover {
            transform: translateY(-6px) scale(1.05);
            box-shadow: 
                0 16px 0 #c0392b, 
                0 30px 50px rgba(255, 71, 87, 0.6);
            background: #ff5e6c;
            animation: none; /* Stop floating on hover */
        }
        
        .start-btn:active {
            transform: translateY(4px) scale(0.98);
            box-shadow: 
                0 4px 0 #c0392b, 
                0 10px 20px rgba(255, 71, 87, 0.4);
        }

        @keyframes floatBtn {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Responsive */
        @media (max-width: 900px) {
            .ui-layer { grid-template-columns: 1fr; padding: 20px; }
            .header-area { grid-row: 1; align-items: center; text-align: center; }
            .game-title { font-size: 3rem; }
            .world-selector { margin: 10px auto; transform: none; }
            .hud-area { grid-row: 1; position: absolute; right: 20px; top: 20px; gap: 10px; }
            .hud-item { min-width: auto; padding: 5px 15px 5px 10px; font-size: 1.2rem; }
            .controls-area { display: none; } /* Hide controls on mobile to save space */
            .action-area { grid-row: 3; justify-self: center; width: 100%; text-align: center; }
            .start-btn { width: 100%; padding: 20px; font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <div class="ui-layer">
        <!-- 1. Top Left: Title & World Select -->
        <header class="header-area">
            <div>
                <div class="game-title">Orbital<br>Quest</div>
                <div class="game-subtitle">The Sky High Adventure</div>
            </div>
            
            <!-- Diegetic Wooden Sign -->
            <div class="world-selector ui-panel">
                <div class="nail tl"></div><div class="nail tr"></div>
                <div class="nail bl"></div><div class="nail br"></div>
                <div class="world-icon">1-1</div>
                <div class="world-text">
                    <div class="world-label">World 1</div>
                    <div class="world-name">Cloud Kingdom</div>
                </div>
            </div>
        </header>

        <!-- 2. Top Right: HUD (Clouds) -->
        <div class="hud-area">
            <div class="hud-item ui-panel">
                <span>00</span>
                <div class="hud-icon coins">●</div>
            </div>
            <div class="hud-item ui-panel">
                <span>000000</span>
                <div class="hud-icon score">★</div>
            </div>
        </div>

        <!-- 3. Bottom Center: Controls -->
        <div class="controls-area">
            <div class="controls-label">Controls</div>
            <div class="controls-box">
                <div class="key-group">
                    <div class="key-cap">←</div>
                    <div class="key-cap">→</div>
                </div>
                <div class="key-group">
                    <div class="key-cap action">Z</div>
                    <span class="key-label">JUMP</span>
                </div>
            </div>
        </div>

        <!-- 4. Bottom Right: Start Button -->
        <div class="action-area">
            <button class="start-btn" onclick="startGame()">START ADVENTURE</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // --- CONFIGURATION ---
        const COLORS = {
            skyTop: '#3a7bd5',
            skyBot: '#00d2ff',
            // Parallax Cloud Colors (Atmospheric Perspective)
            cloudFar: 'rgba(230, 240, 255, 0.6)',
            cloudMid: 'rgba(240, 248, 255, 0.8)',
            cloudNear: 'rgba(255, 255, 255, 0.95)',
            grassTop: '#2ecc71',
            grassSide: '#27ae60',
            dirt: '#8d6e63',
            dirtDark: '#5d4037',
            coin: '#f1c40f',
            hero: '#ff3f34',
            heroShoe: '#2c3e50',
            castle: '#ecf0f1',
            flag: '#e74c3c'
        };

        // --- RESIZE ---
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- DRAWING HELPERS ---
        function drawRoundedRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // --- LAYER 1: DEPTH BACKGROUND (Parallax Clouds) ---
        function drawParallaxClouds(time) {
            const drawCloudShape = (x, y, scale, color) => {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(scale, scale);
                ctx.fillStyle = color;
                ctx.beginPath();
                // Fluffy cloud shape
                ctx.arc(0, 0, 40, 0, Math.PI * 2);
                ctx.arc(40, -15, 50, 0, Math.PI * 2);
                ctx.arc(90, 0, 40, 0, Math.PI * 2);
                ctx.arc(40, 10, 40, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            };

            // Layer 1: Far Background (Lighter, Smaller, Slower)
            for(let i=0; i<5; i++) {
                let x = ((time * 0.02 + i * 350) % (width + 400)) - 200;
                drawCloudShape(x, height * 0.2 + (i%2)*60, 0.6, COLORS.cloudFar);
            }

            // Layer 2: Mid Background (Darker, Medium, Medium Speed)
            for(let i=0; i<4; i++) {
                let x = ((time * 0.06 + i * 450 + 200) % (width + 500)) - 250;
                drawCloudShape(x, height * 0.35 + (i%2)*50, 1.0, COLORS.cloudMid);
            }

            // Layer 3: Near Background (White, Large, Faster)
            for(let i=0; i<3; i++) {
                let x = ((time * 0.12 + i * 600 + 100) % (width + 600)) - 300;
                drawCloudShape(x, height * 0.5 + (i%2)*80, 1.5, COLORS.cloudNear);
            }
        }

        // --- LAYER 2: CONNECTING PATH (Visual Storytelling) ---
        function drawPath(time) {
            const groundY = height * 0.75;
            const scale = Math.min(width, height) / 800;
            
            ctx.save();
            ctx.translate(width * 0.15, 0);
            
            // Draw a winding path of semi-transparent clouds/steps
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            
            // Step 1 (From Hero)
            let p1 = {x: 200, y: groundY - 20};
            // Step 2
            let p2 = {x: 350, y: groundY - 80};
            // Step 3
            let p3 = {x: 500, y: groundY - 120};
            // Step 4 (Towards Castle)
            let p4 = {x: 700, y: groundY - 100};

            const drawStep = (p) => {
                ctx.beginPath();
                ctx.ellipse(p.x, p.y, 30*scale, 10*scale, 0, 0, Math.PI*2);
                ctx.fill();
            };

            drawStep(p1); drawStep(p2); drawStep(p3); drawStep(p4);
            
            ctx.restore();
        }

        // --- LAYER 3: FOREGROUND (Diorama) ---
        function drawDiorama(time) {
            const groundY = height * 0.75;
            const scale = Math.min(width, height) / 800;
            
            ctx.save();
            ctx.translate(width * 0.15, 0); 
            
            // --- PLATFORMS ---
            const drawGrassBlock = (x, y, w, h) => {
                // Dirt/Side
                ctx.fillStyle = COLORS.dirt;
                drawRoundedRect(x, y, w, h, 5*scale);
                ctx.fill();
                
                // Grass Top
                ctx.fillStyle = COLORS.grassTop;
                drawRoundedRect(x - 2*scale, y, w + 4*scale, 20*scale, 6*scale);
                ctx.fill();

                // Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(x + 5*scale, y + 2*scale, w - 10*scale, 4*scale);
            };

            // 1. Main Ground (Hero Stand)
            drawGrassBlock(0, groundY, 350 * scale, 150 * scale);

            // 2. Floating Platforms
            drawGrassBlock(400 * scale, groundY - 100 * scale, 120 * scale, 40 * scale);
            drawGrassBlock(580 * scale, groundY - 200 * scale, 120 * scale, 40 * scale);

            // 3. The Goal (Castle Structure)
            const goalX = 850 * scale;
            const goalY = groundY;
            
            // Base
            ctx.fillStyle = COLORS.castle;
            ctx.fillRect(goalX, goalY - 140*scale, 70*scale, 140*scale);
            
            // Battlements
            ctx.fillStyle = '#bdc3c7';
            ctx.fillRect(goalX, goalY - 150*scale, 15*scale, 20*scale);
            ctx.fillRect(goalX + 25*scale, goalY - 150*scale, 15*scale, 20*scale);
            ctx.fillRect(goalX + 50*scale, goalY - 150*scale, 15*scale, 20*scale);

            // Door
            ctx.fillStyle = '#2f3542';
            ctx.beginPath();
            ctx.arc(goalX + 35*scale, goalY, 20*scale, Math.PI, 0);
            ctx.fill();

            // Flag Pole
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(goalX + 35*scale, goalY - 150*scale);
            ctx.lineTo(goalX + 35*scale, goalY - 240*scale);
            ctx.stroke();

            // Flag (Waving)
            ctx.fillStyle = COLORS.flag;
            ctx.beginPath();
            const wave = Math.sin(time * 0.01) * 5;
            ctx.moveTo(goalX + 35*scale, goalY - 240*scale);
            ctx.quadraticCurveTo(goalX + 60*scale, goalY - 230*scale + wave, goalX + 85*scale, goalY - 240*scale + wave);
            ctx.lineTo(goalX + 35*scale, goalY - 210*scale);
            ctx.fill();

            // 4. Coins (Animated)
            const drawCoin = (cx, cy) => {
                ctx.save();
                ctx.translate(cx, cy);
                const squish = Math.abs(Math.sin(time * 0.008));
                ctx.scale(squish, 1);
                
                // Sparkle
                if (Math.sin(time * 0.02 + cx) > 0.8) {
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(15*scale, -10*scale, 3*scale, 0, Math.PI*2);
                    ctx.fill();
                }

                ctx.fillStyle = COLORS.coin;
                ctx.beginPath();
                ctx.arc(0, 0, 15*scale, 0, Math.PI*2);
                ctx.fill();
                // Shine
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(-5*scale, -5*scale, 5*scale, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            };

            drawCoin(460*scale, groundY - 140*scale);
            drawCoin(640*scale, groundY - 240*scale);
            drawCoin(700*scale, groundY - 140*scale);

            // 5. Enemy
            const enemyX = 250 * scale;
            const enemyY = groundY - 30 * scale;
            const bounce = Math.abs(Math.sin(time * 0.005)) * 5;
            
            ctx.save();
            ctx.translate(enemyX, enemyY + bounce);
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(0, 30*scale - bounce, 20*scale, 5*scale, 0, 0, Math.PI*2);
            ctx.fill();

            // Body
            ctx.fillStyle = '#8e44ad';
            ctx.beginPath();
            ctx.moveTo(0, -25*scale);
            ctx.bezierCurveTo(-30*scale, -25*scale, -30*scale, 15*scale, 0, 15*scale);
            ctx.bezierCurveTo(30*scale, 15*scale, 30*scale, -25*scale, 0, -25*scale);
            ctx.fill();
            
            // Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-10*scale, -5*scale, 8*scale, 0, Math.PI*2);
            ctx.arc(10*scale, -5*scale, 8*scale, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(-10*scale, -5*scale, 3*scale, 0, Math.PI*2);
            ctx.arc(10*scale, -5*scale, 3*scale, 0, Math.PI*2);
            ctx.fill();
            
            // Feet
            ctx.fillStyle = '#222';
            const walk = Math.sin(time * 0.01) * 5;
            ctx.beginPath();
            ctx.ellipse(-12*scale + walk, 15*scale, 10*scale, 6*scale, 0, 0, Math.PI*2);
            ctx.ellipse(12*scale - walk, 15*scale, 10*scale, 6*scale, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();

            ctx.restore();
        }

        // --- HERO (Squash & Stretch Animation) ---
        function drawHero(time) {
            const groundY = height * 0.75;
            const heroX = width * 0.25;
            const bounce = Math.abs(Math.sin(time * 0.008)) * 8;
            const heroY = groundY - 50 - bounce;
            const scale = Math.min(width, height) / 800;

            ctx.save();
            ctx.translate(heroX, heroY);

            // Squash and Stretch Transform
            // When jumping (high), stretch. When landing (low), squash.
            // Simplified: Sin wave inverse for stretch
            const stretch = 1 + (bounce / 100); 
            const squash = 1 - (bounce / 150);
            ctx.scale(squash, stretch);

            // Drop Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(0, 50 + bounce, 25*scale, 8*scale, 0, 0, Math.PI*2);
            ctx.fill();

            // --- MASCOT CHARACTER ---
            // 1. Shoes
            ctx.fillStyle = COLORS.heroShoe;
            ctx.beginPath();
            ctx.ellipse(-14*scale, 40*scale, 14*scale, 8*scale, 0, 0, Math.PI*2);
            ctx.ellipse(14*scale, 40*scale, 14*scale, 8*scale, 0, 0, Math.PI*2);
            ctx.fill();

            // 2. Body (Red Circle)
            ctx.fillStyle = COLORS.hero;
            ctx.beginPath();
            ctx.arc(0, 0, 38*scale, 0, Math.PI*2);
            ctx.fill();

            // 3. White Belly
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 5*scale, 26*scale, 0, Math.PI*2);
            ctx.fill();

            // 4. Face
            // Eyes
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.ellipse(-12*scale, -8*scale, 6*scale, 12*scale, 0, 0, Math.PI*2);
            ctx.ellipse(12*scale, -8*scale, 6*scale, 12*scale, 0, 0, Math.PI*2);
            ctx.fill();
            // Eye Highlights
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-9*scale, -12*scale, 3*scale, 0, Math.PI*2);
            ctx.arc(15*scale, -12*scale, 3*scale, 0, Math.PI*2);
            ctx.fill();

            // 5. Head Crest
            ctx.fillStyle = COLORS.hero;
            ctx.beginPath();
            ctx.moveTo(-12*scale, -32*scale);
            ctx.lineTo(0, -55*scale);
            ctx.lineTo(12*scale, -32*scale);
            ctx.fill();

            // 6. Gloves
            ctx.fillStyle = '#fff';
            // Left hand (waving)
            ctx.beginPath();
            ctx.arc(-35*scale, 10*scale + Math.sin(time*0.01)*5, 12*scale, 0, Math.PI*2);
            ctx.fill();
            // Right hand (on hip)
            ctx.beginPath();
            ctx.arc(35*scale, 10*scale, 12*scale, 0, Math.PI*2);
            ctx.fill();

            ctx.restore();
        }

        // --- PARTICLES (Goal Glow) ---
        function drawParticles(time) {
            const scale = Math.min(width, height) / 800;
            const goalX = width * 0.15 + 850 * scale;
            const goalY = height * 0.75 - 200 * scale;

            // Glow behind castle
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            const grad = ctx.createRadialGradient(goalX, goalY, 10, goalX, goalY, 100);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.4)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(goalX, goalY, 100, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();

            // Sparkles
            for(let i=0; i<5; i++) {
                let offset = i * 100;
                let px = goalX + Math.sin(time * 0.005 + offset) * 40;
                let py = goalY + Math.cos(time * 0.007 + offset) * 30;
                let alpha = Math.abs(Math.sin(time * 0.01 + offset));
                
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(px, py, 4*scale, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // --- MAIN LOOP ---
        function animate(time) {
            ctx.clearRect(0, 0, width, height);

            // 1. Sky
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, COLORS.skyTop);
            grad.addColorStop(1, COLORS.skyBot);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 2. Background Layers (Parallax Clouds)
            drawParallaxClouds(time);

            // 3. Connecting Path
            drawPath(time);

            // 4. Foreground Diorama
            drawDiorama(time);
            
            // 5. Hero
            drawHero(time);

            // 6. Effects
            drawParticles(time);

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        function startGame() {
            const btn = document.querySelector('.start-btn');
            const originalText = btn.innerText;
            btn.innerText = "LOADING...";
            
            // Visual feedback
            document.body.style.transition = "filter 0.5s";
            document.body.style.filter = "brightness(1.5) blur(2px)";
            
            setTimeout(() => {
                alert("Welcome to Orbital Quest!");
                document.body.style.filter = "none";
                btn.innerText = originalText;
            }, 800);
        }

    </script>
</body>
