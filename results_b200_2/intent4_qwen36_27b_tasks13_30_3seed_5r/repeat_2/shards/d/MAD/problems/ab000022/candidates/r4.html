<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital Quest: Sky High</title>
    <style>
        :root {
            --bg-sky-top: #4facfe;
            --bg-sky-bot: #00f2fe;
            --primary-color: #ff4757;
            --secondary-color: #2ed573;
            --accent-yellow: #ffa502;
            --ui-bg: rgba(255, 255, 255, 0.9);
            --ui-shadow: 0 10px 20px rgba(0,0,0,0.15); /* Soft, diffuse shadow */
            --border-radius: 16px;
            --font-ui: 'Verdana', 'Segoe UI', sans-serif;
            --font-title: 'Arial Black', 'Impact', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: var(--font-ui);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-sky-top);
        }

        /* --- CANVAS LAYER --- */
        #game-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: auto 1fr auto;
            padding: 40px;
            pointer-events: none;
        }

        /* --- SHARED UI COMPONENTS --- */
        .ui-panel {
            background: var(--ui-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--ui-shadow);
            padding: 15px 25px;
            pointer-events: auto;
            color: #333;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(4px); /* Modern glass feel */
        }

        .ui-panel:hover {
            transform: translateY(-2px);
        }

        /* --- 1. HEADER: TITLE (Top Left) --- */
        .header-area {
            grid-column: 1 / 2;
            grid-row: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .game-title {
            font-family: var(--font-title);
            font-size: 3.5rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            line-height: 0.9;
            text-shadow: 4px 4px 0px #ff4757, 8px 8px 0px rgba(0,0,0,0.15);
            letter-spacing: -1px;
            transform: skewX(-5deg);
        }
        
        .game-subtitle {
            font-size: 1.1rem;
            color: #fff;
            font-weight: 800;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
            margin-top: 5px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* --- 2. WORLD SELECT (Top Left, Below Title) --- */
        .world-selector {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 260px;
            border-left: 6px solid var(--secondary-color);
        }

        .world-icon {
            width: 44px; height: 44px;
            background: #f1f2f6;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-title);
            font-size: 1rem;
            color: var(--primary-color);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }

        .world-text {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }
        .world-label { font-size: 0.75rem; text-transform: uppercase; color: #7f8fa6; font-weight: 700; letter-spacing: 1px; }
        .world-name { font-size: 1.1rem; font-weight: 800; color: #2f3542; }

        /* --- 3. HUD (Top Right) --- */
        .hud-area {
            grid-column: 3 / 4;
            grid-row: 1;
            display: flex;
            justify-content: flex-end;
            gap: 20px;
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 1.4rem;
            min-width: 130px;
            justify-content: flex-end;
            border-right: 6px solid var(--accent-yellow);
        }

        .hud-icon {
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            color: #fff;
            box-shadow: 0 3px 0 rgba(0,0,0,0.2);
        }

        .hud-icon.coins { background: var(--accent-yellow); }
        .hud-icon.score { background: var(--primary-color); }

        /* --- 4. CONTROLS (Bottom Left - Rebalanced) --- */
        .controls-area {
            grid-column: 1 / 2;
            grid-row: 3;
            justify-self: start;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .controls-label { 
            font-size: 0.75rem; 
            font-weight: 800; 
            color: rgba(255,255,255,0.8); 
            text-transform: uppercase; 
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .controls-box {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .key-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .key-cap {
            background: #fff;
            border: 1px solid rgba(0,0,0,0.1);
            border-bottom: 4px solid rgba(0,0,0,0.15); /* Tactile depth */
            border-radius: 8px;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900;
            font-size: 1rem;
            color: #2f3542;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .key-cap.large { width: 90px; }
        .key-cap.action { 
            background: var(--primary-color); 
            color: #fff;
            border-color: rgba(192, 57, 43, 0.5);
            border-bottom-color: #c0392b;
        }

        /* --- 5. START BUTTON (Bottom Right - Rebalanced) --- */
        .action-area {
            grid-column: 3 / 4;
            grid-row: 3;
            justify-self: end;
            pointer-events: none;
        }

        .start-btn {
            pointer-events: auto;
            background: var(--primary-color);
            color: #fff;
            font-family: var(--font-title);
            font-size: 1.6rem;
            text-transform: uppercase;
            padding: 22px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            /* Modern Flat 2.0: No glossy gradient, solid vibrant color */
            box-shadow: 0 6px 0 #c0392b, 0 15px 25px rgba(255, 71, 87, 0.4);
            transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-shadow: 0 2px 0 rgba(0,0,0,0.2);
            position: relative;
            letter-spacing: 1px;
            border: 4px solid rgba(255,255,255,0.2); /* Subtle inner border/glow */
        }

        .start-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 0 #c0392b, 0 20px 35px rgba(255, 71, 87, 0.5);
            background: #ff5e6c;
        }
        
        .start-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #c0392b, 0 5px 10px rgba(255, 71, 87, 0.4);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .ui-layer { grid-template-columns: 1fr; padding: 20px; }
            .header-area { grid-row: 1; align-items: center; text-align: center; }
            .world-selector { margin: 0 auto; border-left: none; border-bottom: 6px solid var(--secondary-color); }
            .hud-area { grid-row: 1; position: absolute; right: 20px; top: 20px; }
            .controls-area { display: none; }
            .action-area { grid-row: 3; justify-self: center; margin-top: 20px; }
        }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <div class="ui-layer">
        <!-- 1. Top Left: Title & World Select -->
        <header class="header-area">
            <div>
                <div class="game-title">Orbital<br>Quest</div>
                <div class="game-subtitle">The Sky High Adventure</div>
            </div>
            
            <div class="world-selector ui-panel">
                <div class="world-icon">1-1</div>
                <div class="world-text">
                    <div class="world-label">World 1</div>
                    <div class="world-name">Cloud Kingdom</div>
                </div>
            </div>
        </header>

        <!-- 2. Top Right: HUD -->
        <div class="hud-area">
            <div class="hud-item ui-panel">
                <span>00</span>
                <div class="hud-icon coins">●</div>
            </div>
            <div class="hud-item ui-panel">
                <span>000000</span>
                <div class="hud-icon score">★</div>
            </div>
        </div>

        <!-- 3. Bottom Left: Controls (Rebalanced) -->
        <div class="controls-area">
            <div class="controls-label">Controls</div>
            <div class="ui-panel controls-box">
                <div class="key-group">
                    <div class="key-cap">←</div>
                    <div class="key-cap">→</div>
                </div>
                <div class="key-group">
                    <div class="key-cap large action">Z</div>
                    <span style="font-size: 0.8rem; font-weight: 800; color: #555;">JUMP</span>
                </div>
            </div>
        </div>

        <!-- 4. Bottom Right: Start Button (Rebalanced) -->
        <div class="action-area">
            <button class="start-btn" onclick="startGame()">START ADVENTURE</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // --- CONFIGURATION ---
        const COLORS = {
            skyTop: '#4facfe',
            skyBot: '#00f2fe',
            mountainFar: 'rgba(255, 255, 255, 0.3)',
            mountainMid: 'rgba(255, 255, 255, 0.5)',
            grassTop: '#7bed9f',
            grassSide: '#2ed573',
            grassDark: '#26af61',
            dirt: '#e1b12c',
            dirtDark: '#fbc531',
            coin: '#ffa502',
            hero: '#ff4757',
            heroShoe: '#2f3542',
            castle: '#dcdde1',
            flag: '#ff4757'
        };

        // --- RESIZE ---
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- DRAWING HELPERS ---
        function drawRoundedRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // --- LAYER 1: FAR BACKGROUND (Mountains) ---
        function drawMountains(time) {
            // Far Mountains (Low Opacity)
            ctx.fillStyle = COLORS.mountainFar;
            ctx.beginPath();
            ctx.moveTo(0, height);
            for(let x=0; x<=width; x+=10) {
                // Slow parallax
                let px = x - (time * 0.05); 
                let y = height * 0.6 - Math.sin(px * 0.003) * 80 - Math.cos(px * 0.007) * 40;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height);
            ctx.fill();

            // Mid Mountains (Higher Opacity, slightly darker)
            ctx.fillStyle = COLORS.mountainMid;
            ctx.beginPath();
            ctx.moveTo(0, height);
            for(let x=0; x<=width; x+=10) {
                let px = x - (time * 0.1);
                let y = height * 0.7 - Math.sin(px * 0.005 + 2) * 60 - Math.cos(px * 0.01) * 30;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height);
            ctx.fill();
        }

        // --- LAYER 2: MID BACKGROUND (Clouds) ---
        function drawClouds(time) {
            // Varied opacity and scale for depth
            const drawCloudShape = (x, y, scale) => {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(scale, scale);
                ctx.beginPath();
                ctx.arc(0, 0, 40, 0, Math.PI * 2);
                ctx.arc(40, -15, 50, 0, Math.PI * 2);
                ctx.arc(90, 0, 40, 0, Math.PI * 2);
                ctx.arc(40, 10, 40, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            };

            // Cloud Layer A (Back)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            for(let i=0; i<4; i++) {
                let x = ((time * 0.08 + i * 400) % (width + 300)) - 150;
                drawCloudShape(x, height * 0.3 + (i%2)*80, 0.8);
            }

            // Cloud Layer B (Front)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            for(let i=0; i<3; i++) {
                let x = ((time * 0.15 + i * 500 + 200) % (width + 400)) - 200;
                drawCloudShape(x, height * 0.45 + (i%2)*40, 1.2);
            }
        }

        // --- LAYER 3: FOREGROUND (Diorama) ---
        function drawDiorama(time) {
            const groundY = height * 0.75;
            const scale = Math.min(width, height) / 800;
            
            // Offset to center the "scene" slightly right to balance UI
            ctx.save();
            ctx.translate(width * 0.15, 0); 
            
            // --- PLATFORMS ---
            // Helper to draw a "Grass" block
            const drawGrassBlock = (x, y, w, h) => {
                // Dirt/Side
                ctx.fillStyle = COLORS.grassSide;
                ctx.fillRect(x, y, w, h);
                // Grass Top (with "fluff" texture)
                ctx.fillStyle = COLORS.grassTop;
                // Main top rect
                ctx.fillRect(x, y, w, 15 * scale);
                // Fluff tufts
                ctx.fillStyle = COLORS.grassDark;
                for(let i=0; i<w; i+=15*scale) {
                    ctx.beginPath();
                    ctx.arc(x + i + 5*scale, y + 15*scale, 5*scale, 0, Math.PI, true);
                    ctx.fill();
                }
                // Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(x, y, w, 4*scale);
            };

            // 1. Main Ground (Hero Stand)
            drawGrassBlock(0, groundY, 350 * scale, 150 * scale);

            // 2. Floating Platforms
            drawGrassBlock(400 * scale, groundY - 100 * scale, 120 * scale, 40 * scale);
            drawGrassBlock(580 * scale, groundY - 200 * scale, 120 * scale, 40 * scale);

            // 3. The Goal (Castle Structure) - Replaced Triangle
            const goalX = 850 * scale;
            const goalY = groundY;
            
            // Base
            ctx.fillStyle = COLORS.castle;
            ctx.fillRect(goalX, goalY - 140*scale, 70*scale, 140*scale);
            
            // Battlements
            ctx.fillStyle = '#bdc3c7';
            ctx.fillRect(goalX, goalY - 150*scale, 15*scale, 20*scale);
            ctx.fillRect(goalX + 25*scale, goalY - 150*scale, 15*scale, 20*scale);
            ctx.fillRect(goalX + 50*scale, goalY - 150*scale, 15*scale, 20*scale);

            // Door
            ctx.fillStyle = '#2f3542';
            ctx.beginPath();
            ctx.arc(goalX + 35*scale, goalY, 20*scale, Math.PI, 0);
            ctx.fill();

            // Flag Pole
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(goalX + 35*scale, goalY - 150*scale);
            ctx.lineTo(goalX + 35*scale, goalY - 240*scale);
            ctx.stroke();

            // Flag (Waving)
            ctx.fillStyle = COLORS.flag;
            ctx.beginPath();
            const wave = Math.sin(time * 0.01) * 5;
            ctx.moveTo(goalX + 35*scale, goalY - 240*scale);
            ctx.quadraticCurveTo(goalX + 60*scale, goalY - 230*scale + wave, goalX + 85*scale, goalY - 240*scale + wave);
            ctx.lineTo(goalX + 35*scale, goalY - 210*scale);
            ctx.fill();

            // 4. Coins (Animated + Particles)
            const drawCoin = (cx, cy) => {
                ctx.save();
                ctx.translate(cx, cy);
                const squish = Math.abs(Math.sin(time * 0.008));
                ctx.scale(squish, 1);
                
                // Particle Sparkle near coin
                if (Math.sin(time * 0.02 + cx) > 0.8) {
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(15*scale, -10*scale, 3*scale, 0, Math.PI*2);
                    ctx.fill();
                }

                ctx.fillStyle = COLORS.coin;
                ctx.beginPath();
                ctx.arc(0, 0, 15*scale, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#ffeaa7';
                ctx.beginPath();
                ctx.arc(-3*scale, -3*scale, 5*scale, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            };

            drawCoin(460*scale, groundY - 140*scale);
            drawCoin(640*scale, groundY - 240*scale);
            drawCoin(700*scale, groundY - 140*scale);

            // 5. Enemy (Goomba-style)
            const enemyX = 250 * scale;
            const enemyY = groundY - 30 * scale;
            const bounce = Math.abs(Math.sin(time * 0.005)) * 5;
            
            ctx.save();
            ctx.translate(enemyX, enemyY + bounce);
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(0, 30*scale - bounce, 20*scale, 5*scale, 0, 0, Math.PI*2);
            ctx.fill();

            // Body
            ctx.fillStyle = '#8e44ad';
            ctx.beginPath();
            ctx.moveTo(0, -25*scale);
            ctx.bezierCurveTo(-30*scale, -25*scale, -30*scale, 15*scale, 0, 15*scale);
            ctx.bezierCurveTo(30*scale, 15*scale, 30*scale, -25*scale, 0, -25*scale);
            ctx.fill();
            // Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-10*scale, -5*scale, 8*scale, 0, Math.PI*2);
            ctx.arc(10*scale, -5*scale, 8*scale, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(-10*scale, -5*scale, 3*scale, 0, Math.PI*2);
            ctx.arc(10*scale, -5*scale, 3*scale, 0, Math.PI*2);
            ctx.fill();
            // Feet
            ctx.fillStyle = '#222';
            const walk = Math.sin(time * 0.01) * 5;
            ctx.beginPath();
            ctx.ellipse(-12*scale + walk, 15*scale, 10*scale, 6*scale, 0, 0, Math.PI*2);
            ctx.ellipse(12*scale - walk, 15*scale, 10*scale, 6*scale, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();

            ctx.restore();
        }

        // --- HERO ---
        function drawHero(time) {
            const groundY = height * 0.75;
            const heroX = width * 0.25;
            const bounce = Math.abs(Math.sin(time * 0.008)) * 8;
            const heroY = groundY - 50 - bounce;
            const scale = Math.min(width, height) / 800;

            ctx.save();
            ctx.translate(heroX, heroY);

            // Drop Shadow (Grounding)
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(0, 50 + bounce, 25*scale, 8*scale, 0, 0, Math.PI*2);
            ctx.fill();

            // --- MASCOT CHARACTER ---
            // 1. Shoes
            ctx.fillStyle = COLORS.heroShoe;
            ctx.beginPath();
            ctx.ellipse(-14*scale, 40*scale, 14*scale, 8*scale, 0, 0, Math.PI*2);
            ctx.ellipse(14*scale, 40*scale, 14*scale, 8*scale, 0, 0, Math.PI*2);
            ctx.fill();

            // 2. Body (Red Circle)
            ctx.fillStyle = COLORS.hero;
            ctx.beginPath();
            ctx.arc(0, 0, 38*scale, 0, Math.PI*2);
            ctx.fill();

            // 3. White Belly
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 5*scale, 26*scale, 0, Math.PI*2);
            ctx.fill();

            // 4. Face
            // Eyes
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.ellipse(-12*scale, -8*scale, 6*scale, 12*scale, 0, 0, Math.PI*2);
            ctx.ellipse(12*scale, -8*scale, 6*scale, 12*scale, 0, 0, Math.PI*2);
            ctx.fill();
            // Eye Highlights
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-9*scale, -12*scale, 3*scale, 0, Math.PI*2);
            ctx.arc(15*scale, -12*scale, 3*scale, 0, Math.PI*2);
            ctx.fill();

            // 5. Head Crest
            ctx.fillStyle = COLORS.hero;
            ctx.beginPath();
            ctx.moveTo(-12*scale, -32*scale);
            ctx.lineTo(0, -55*scale);
            ctx.lineTo(12*scale, -32*scale);
            ctx.fill();

            // 6. Gloves
            ctx.fillStyle = '#fff';
            // Left hand (waving)
            ctx.beginPath();
            ctx.arc(-35*scale, 10*scale + Math.sin(time*0.01)*5, 12*scale, 0, Math.PI*2);
            ctx.fill();
            // Right hand (on hip)
            ctx.beginPath();
            ctx.arc(35*scale, 10*scale, 12*scale, 0, Math.PI*2);
            ctx.fill();

            ctx.restore();
        }

        // --- PARTICLES (Sparkles near goal) ---
        function drawParticles(time) {
            const scale = Math.min(width, height) / 800;
            const goalX = width * 0.15 + 850 * scale;
            const goalY = height * 0.75 - 200 * scale;

            for(let i=0; i<5; i++) {
                let offset = i * 100;
                let px = goalX + Math.sin(time * 0.005 + offset) * 40;
                let py = goalY + Math.cos(time * 0.007 + offset) * 30;
                let alpha = Math.abs(Math.sin(time * 0.01 + offset));
                
                ctx.fillStyle = `rgba(255, 215, 0, ${alpha})`;
                ctx.beginPath();
                // Star shape
                ctx.arc(px, py, 4*scale, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // --- MAIN LOOP ---
        function animate(time) {
            ctx.clearRect(0, 0, width, height);

            // 1. Sky
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, COLORS.skyTop);
            grad.addColorStop(1, COLORS.skyBot);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 2. Background Layers (Parallax)
            drawMountains(time);
            drawClouds(time);

            // 3. Foreground Diorama
            drawDiorama(time);
            
            // 4. Hero
            drawHero(time);

            // 5. Effects
            drawParticles(time);

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        function startGame() {
            const btn = document.querySelector('.start-btn');
            const originalText = btn.innerText;
            btn.innerText = "LOADING...";
            
            // Visual feedback
            document.body.style.transition = "filter 0.5s";
            document.body.style.filter = "brightness(1.5) blur(2px)";
            
            setTimeout(() => {
                alert("Welcome to Orbital Quest!");
                document.body.style.filter = "none";
                btn.innerText = originalText;
            }, 800);
        }

    </script>
</body>
</html>
