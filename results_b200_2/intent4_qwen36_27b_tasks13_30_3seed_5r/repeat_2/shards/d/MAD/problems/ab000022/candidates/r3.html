<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital Quest: Sky High</title>
    <style>
        :root {
            --bg-sky-top: #4facfe;
            --bg-sky-bot: #00f2fe;
            --primary-color: #ff4757; /* Mascot Red */
            --secondary-color: #2ed573; /* Platform Green */
            --accent-yellow: #ffa502; /* Coin Gold */
            --ui-bg: rgba(255, 255, 255, 0.9);
            --ui-shadow: rgba(0, 0, 0, 0.15);
            --font-ui: 'Verdana', 'Segoe UI', sans-serif;
            --border-radius: 16px; /* Unified Radius */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: var(--font-ui);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-sky-top);
        }

        /* --- CANVAS LAYER --- */
        #game-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            display: grid;
            /* 3 Column Grid: Left (Title/Controls), Center (Empty for Hero), Right (HUD) */
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: auto 1fr auto;
            padding: 40px;
            pointer-events: none;
        }

        /* --- SHARED UI COMPONENTS --- */
        .ui-panel {
            background: var(--ui-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 8px 0 var(--ui-shadow), 0 15px 30px rgba(0,0,0,0.1);
            padding: 15px 25px;
            pointer-events: auto;
            color: #333;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .ui-panel:hover {
            transform: translateY(-3px);
        }

        /* --- 1. HEADER: TITLE (Top Left) --- */
        .header-area {
            grid-column: 1 / 2;
            grid-row: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .game-title {
            font-size: 3.5rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            line-height: 0.9;
            text-shadow: 4px 4px 0px #ff4757, 8px 8px 0px rgba(0,0,0,0.2);
            font-family: 'Arial Black', sans-serif;
            letter-spacing: -1px;
        }
        
        .game-subtitle {
            font-size: 1.2rem;
            color: #fff;
            font-weight: bold;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
            margin-top: -5px;
        }

        /* --- 2. WORLD SELECT (Top Left, Below Title) --- */
        .world-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 240px;
            border: 3px solid #fff;
        }

        .world-icon {
            width: 40px; height: 40px;
            background: #fff;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
            color: var(--primary-color);
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.1);
        }

        .world-text {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }
        .world-label { font-size: 0.7rem; text-transform: uppercase; color: #666; font-weight: bold; letter-spacing: 1px; }
        .world-name { font-size: 1rem; font-weight: 800; color: #222; }

        /* --- 3. HUD (Top Right) --- */
        .hud-area {
            grid-column: 3 / 4;
            grid-row: 1;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.2rem;
            min-width: 120px;
            justify-content: flex-end;
        }

        .hud-icon {
            width: 24px; height: 24px;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            color: #fff;
        }

        .hud-icon.coins { background: var(--accent-yellow); box-shadow: 0 3px 0 #cc8400; }
        .hud-icon.score { background: var(--primary-color); box-shadow: 0 3px 0 #c0392b; }

        /* --- 4. CONTROLS (Bottom Right, near Hero action) --- */
        .controls-area {
            grid-column: 3 / 4;
            grid-row: 3;
            justify-self: end;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .controls-label { font-size: 0.8rem; font-weight: bold; color: #666; text-transform: uppercase; }

        .key-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .key-cap {
            background: #fff;
            border: 2px solid #ddd;
            border-bottom: 4px solid #bbb;
            border-radius: 6px;
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            color: #333;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }
        
        .key-cap.large { width: 80px; }
        .key-cap.action { border-color: var(--primary-color); color: var(--primary-color); }

        /* --- 5. START BUTTON (Bottom Center) --- */
        .action-area {
            grid-column: 2 / 3;
            grid-row: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .start-btn {
            pointer-events: auto;
            background: var(--primary-color);
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            font-size: 1.8rem;
            text-transform: uppercase;
            padding: 20px 60px;
            border: none;
            border-radius: 50px; /* Fully rounded pill shape */
            cursor: pointer;
            box-shadow: 0 8px 0 #c0392b, 0 15px 20px rgba(255, 71, 87, 0.4);
            transition: all 0.1s;
            text-shadow: 0 2px 0 rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .start-btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.4), transparent);
            border-radius: 50px 50px 0 0;
        }

        .start-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 0 #c0392b, 0 20px 30px rgba(255, 71, 87, 0.5);
        }
        
        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #c0392b;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .ui-layer { grid-template-columns: 1fr; padding: 20px; }
            .header-area { grid-row: 1; align-items: center; text-align: center; }
            .world-selector { margin: 0 auto; }
            .hud-area { grid-row: 1; position: absolute; right: 20px; top: 80px; }
            .controls-area { display: none; }
            .action-area { grid-row: 3; margin-top: 20px; }
        }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <div class="ui-layer">
        <!-- 1. Top Left: Title & World Select -->
        <header class="header-area">
            <div>
                <div class="game-title">Orbital<br>Quest</div>
                <div class="game-subtitle">The Sky High Adventure</div>
            </div>
            
            <div class="world-selector ui-panel">
                <div class="world-icon">1-1</div>
                <div class="world-text">
                    <div class="world-label">World 1</div>
                    <div class="world-name">Cloud Kingdom</div>
                </div>
            </div>
        </header>

        <!-- 2. Top Right: HUD -->
        <div class="hud-area">
            <div class="hud-item ui-panel">
                <span>00</span>
                <div class="hud-icon coins">●</div>
            </div>
            <div class="hud-item ui-panel">
                <span>000000</span>
                <div class="hud-icon score">★</div>
            </div>
        </div>

        <!-- 3. Bottom Right: Controls -->
        <div class="controls-area">
            <div class="controls-label">Controls</div>
            <div class="ui-panel" style="padding: 10px 15px;">
                <div class="key-group" style="margin-bottom: 8px;">
                    <div class="key-cap">←</div>
                    <div class="key-cap">→</div>
                    <span style="font-size: 0.8rem; font-weight: bold;">Move</span>
                </div>
                <div class="key-group">
                    <div class="key-cap large action">Z</div>
                    <span style="font-size: 0.8rem; font-weight: bold;">Jump</span>
                </div>
            </div>
        </div>

        <!-- 4. Bottom Center: Start Button -->
        <div class="action-area">
            <button class="start-btn" onclick="startGame()">START ADVENTURE</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // --- CONFIGURATION ---
        const COLORS = {
            skyTop: '#4facfe',
            skyBot: '#00f2fe',
            cloudFar: 'rgba(255, 255, 255, 0.4)',
            cloudNear: '#fff',
            grassTop: '#7bed9f',
            grassSide: '#2ed573',
            dirt: '#57606f',
            dirtDark: '#2f3542',
            coin: '#ffa502',
            hero: '#ff4757',
            heroShoe: '#2f3542'
        };

        // --- RESIZE ---
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- DRAWING HELPERS ---
        function drawRoundedRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function drawBlock(x, y, size) {
            // 3D Block Effect
            const offset = size * 0.2; // Depth
            
            // Side Face (Darker)
            ctx.fillStyle = COLORS.grassSide;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y + size);
            ctx.lineTo(x + offset, y + size + offset);
            ctx.lineTo(x + offset, y + offset);
            ctx.closePath();
            ctx.fill();

            // Top Face (Lighter)
            ctx.fillStyle = COLORS.grassTop;
            ctx.fillRect(x, y, size, size);

            // Texture detail (simple grass tufts)
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.arc(x + size*0.3, y + size*0.3, size*0.1, 0, Math.PI*2);
            ctx.fill();
        }

        // --- ENTITIES ---

        function drawSky(time) {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, COLORS.skyTop);
            grad.addColorStop(1, COLORS.skyBot);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        function drawCloud(x, y, scale, speed) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(0, 0, 30, 0, Math.PI * 2);
            ctx.arc(25, -10, 35, 0, Math.PI * 2);
            ctx.arc(50, 0, 30, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawBackground(time) {
            // Far Clouds
            for(let i=0; i<5; i++) {
                let x = ((time * 0.02 + i * 300) % (width + 200)) - 100;
                drawCloud(x, height * 0.3 + (i%2)*50, 1.5 + (i%2), 0.5);
            }
            
            // Distant Hills
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.beginPath();
            ctx.moveTo(0, height * 0.75);
            for(let x=0; x<=width; x+=50) {
                ctx.lineTo(x, height * 0.75 - Math.sin(x*0.01 + time*0.0005)*50);
            }
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.fill();
        }

        function drawDiorama(time) {
            // Setup perspective/positioning
            const groundY = height * 0.75;
            const scale = Math.min(width, height) / 800;
            
            ctx.save();
            ctx.translate(width * 0.1, 0); // Offset to right slightly
            
            // --- LEVEL ELEMENTS ---
            
            // 1. Main Ground (Where Hero stands)
            drawBlock(0, groundY, 400 * scale);

            // 2. Floating Platforms
            drawBlock(450 * scale, groundY - 120 * scale, 100 * scale);
            drawBlock(600 * scale, groundY - 220 * scale, 100 * scale);

            // 3. Goal (Castle/Tower)
            const goalX = 800 * scale;
            const goalY = groundY;
            // Castle Base
            ctx.fillStyle = '#dcdde1';
            ctx.fillRect(goalX, goalY - 150*scale, 60*scale, 150*scale);
            // Castle Top
            ctx.fillStyle = '#ff4757';
            ctx.beginPath();
            ctx.moveTo(goalX - 10*scale, goalY - 150*scale);
            ctx.lineTo(goalX + 30*scale, goalY - 200*scale);
            ctx.lineTo(goalX + 70*scale, goalY - 150*scale);
            ctx.fill();
            // Flag
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(goalX + 30*scale, goalY - 200*scale);
            ctx.lineTo(goalX + 30*scale, goalY - 260*scale);
            ctx.stroke();
            ctx.fillStyle = '#2ed573';
            ctx.beginPath();
            ctx.moveTo(goalX + 30*scale, goalY - 260*scale);
            ctx.lineTo(goalX + 60*scale, goalY - 245*scale);
            ctx.lineTo(goalX + 30*scale, goalY - 230*scale);
            ctx.fill();


            // 4. Coins (Animated)
            const drawCoin = (cx, cy) => {
                ctx.save();
                ctx.translate(cx, cy);
                const squish = Math.abs(Math.sin(time * 0.008));
                ctx.scale(squish, 1);
                ctx.fillStyle = COLORS.coin;
                ctx.beginPath();
                ctx.arc(0, 0, 15*scale, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#ffeaa7';
                ctx.beginPath();
                ctx.arc(-3*scale, -3*scale, 5*scale, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            };

            drawCoin(500*scale, groundY - 160*scale);
            drawCoin(650*scale, groundY - 260*scale);
            drawCoin(700*scale, groundY - 150*scale);

            // 5. Enemy (Goomba-style)
            const enemyX = 250 * scale;
            const enemyY = groundY - 30 * scale;
            const bounce = Math.sin(time * 0.005) * 5;
            
            ctx.save();
            ctx.translate(enemyX, enemyY + bounce);
            // Head
            ctx.fillStyle = '#8e44ad'; // Purple mushroom
            ctx.beginPath();
            ctx.moveTo(0, -20*scale);
            ctx.bezierCurveTo(-25*scale, -20*scale, -25*scale, 10*scale, 0, 10*scale);
            ctx.bezierCurveTo(25*scale, 10*scale, 25*scale, -20*scale, 0, -20*scale);
            ctx.fill();
            // Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-8*scale, -5*scale, 6*scale, 0, Math.PI*2);
            ctx.arc(8*scale, -5*scale, 6*scale, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(-8*scale, -5*scale, 2*scale, 0, Math.PI*2);
            ctx.arc(8*scale, -5*scale, 2*scale, 0, Math.PI*2);
            ctx.fill();
            // Feet
            ctx.fillStyle = '#222';
            const walk = Math.sin(time * 0.01) * 5;
            ctx.beginPath();
            ctx.ellipse(-10*scale + walk, 10*scale, 8*scale, 5*scale, 0, 0, Math.PI*2);
            ctx.ellipse(10*scale - walk, 10*scale, 8*scale, 5*scale, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();

            ctx.restore();
        }

        function drawHero(time) {
            // Position: On the first platform
            const groundY = height * 0.75;
            const heroX = width * 0.25;
            const bounce = Math.abs(Math.sin(time * 0.008)) * 8; // Idle breathing
            const heroY = groundY - 50 - bounce;
            const scale = Math.min(width, height) / 800;

            ctx.save();
            ctx.translate(heroX, heroY);

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(0, 50 + bounce, 20*scale, 6*scale, 0, 0, Math.PI*2);
            ctx.fill();

            // --- MASCOT CHARACTER ---
            // 1. Shoes
            ctx.fillStyle = COLORS.heroShoe;
            ctx.beginPath();
            ctx.ellipse(-12*scale, 40*scale, 12*scale, 8*scale, 0, 0, Math.PI*2);
            ctx.ellipse(12*scale, 40*scale, 12*scale, 8*scale, 0, 0, Math.PI*2);
            ctx.fill();

            // 2. Body (Red Circle)
            ctx.fillStyle = COLORS.hero;
            ctx.beginPath();
            ctx.arc(0, 0, 35*scale, 0, Math.PI*2);
            ctx.fill();

            // 3. White Belly
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 5*scale, 25*scale, 0, Math.PI*2);
            ctx.fill();

            // 4. Face (Mask style)
            // Eyes
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.ellipse(-10*scale, -5*scale, 5*scale, 10*scale, 0, 0, Math.PI*2);
            ctx.ellipse(10*scale, -5*scale, 5*scale, 10*scale, 0, 0, Math.PI*2);
            ctx.fill();
            // Eye Highlights
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-8*scale, -8*scale, 2*scale, 0, Math.PI*2);
            ctx.arc(12*scale, -8*scale, 2*scale, 0, Math.PI*2);
            ctx.fill();

            // 5. Head Crest (Spikes)
            ctx.fillStyle = COLORS.hero;
            ctx.beginPath();
            ctx.moveTo(-10*scale, -30*scale);
            ctx.lineTo(0, -50*scale);
            ctx.lineTo(10*scale, -30*scale);
            ctx.fill();

            // 6. Gloves/Hands
            ctx.fillStyle = '#fff';
            // Left hand (waving?)
            ctx.beginPath();
            ctx.arc(-30*scale, 10*scale + Math.sin(time*0.01)*5, 10*scale, 0, Math.PI*2);
            ctx.fill();
            // Right hand (on hip)
            ctx.beginPath();
            ctx.arc(30*scale, 10*scale, 10*scale, 0, Math.PI*2);
            ctx.fill();

            ctx.restore();
        }

        // --- MAIN LOOP ---
        function animate(time) {
            ctx.clearRect(0, 0, width, height);

            drawSky(time);
            drawBackground(time);
            drawDiorama(time);
            drawHero(time);

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        function startGame() {
            const btn = document.querySelector('.start-btn');
            btn.innerText = "LOADING...";
            setTimeout(() => {
                // Simple transition effect
                document.body.style.transition = "filter 0.5s";
                document.body.style.filter = "brightness(2) blur(10px)";
                setTimeout(() => {
                    alert("Welcome to Orbital Quest!");
                    document.body.style.filter = "none";
                    btn.innerText = "START ADVENTURE";
                }, 500);
            }, 800);
        }

    </script>
</body>
</html>
