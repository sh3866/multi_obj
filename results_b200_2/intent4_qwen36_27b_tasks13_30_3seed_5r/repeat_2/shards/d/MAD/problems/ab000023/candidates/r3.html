<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Industrial Play Sign | 3D Product Render</title>
<style>
  :root {
    /* Environment */
    --bg-wall-top: #e0e0e0;
    --bg-wall-bot: #c4c4c4;
    --bg-floor-top: #c4c4c4;
    --bg-floor-bot: #8a8a8a;
    
    /* Object Materials */
    --sign-face: #ffffff;
    --sign-extrusion: #d4d4d4; /* Flat grey for 3D block */
    --sign-rim: #ffffff;      /* Sharp white edge */
    
    /* Hardware */
    --metal-matte: #2a2a2a;
    --metal-rim: #444444;
    
    /* Emblem */
    --brand-red: #E60000;
    --brand-red-dark: #990000;
    --brand-red-light: #ff3333;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    background-color: #d0d0d0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1000px;
  }

  /* --- STUDIO CONTEXT (CRITIQUE 3) --- */
  .studio-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    transform-style: preserve-3d;
  }

  /* Wall */
  .wall {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 55%;
    background: linear-gradient(to bottom, var(--bg-wall-top), var(--bg-wall-bot));
    z-index: 1;
  }

  /* Floor */
  .floor {
    position: absolute;
    top: 55%; left: 0; width: 100%; height: 45%;
    background: linear-gradient(to bottom, var(--bg-floor-top), var(--bg-floor-bot));
    transform: rotateX(60deg);
    transform-origin: top;
    z-index: 2;
    border-top: 1px solid rgba(0,0,0,0.05);
  }

  /* Vignette */
  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 40%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.25) 100%);
    pointer-events: none;
    z-index: 20;
  }

  /* --- PRODUCT STAGE --- */
  .product-stage {
    position: relative;
    width: 340px;
    height: 340px;
    transform-style: preserve-3d;
    /* Default pose */
    transform: rotateX(10deg) rotateY(-10deg);
    transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 10;
  }

  /* --- THE SIGN (CRITIQUE 1: 3D EXTRUSION) --- */
  .sign-assembly {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform-style: preserve-3d;
  }

  /* Front Face */
  .sign-face {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: var(--sign-face);
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 5;
    backface-visibility: hidden;
    /* Noise Texture (SVG Data URI) for Materiality */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
  }

  /* Extrusion Block (Right/Bottom) */
  .sign-extrusion {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border-radius: 12px;
    background: var(--sign-extrusion);
    /* Push back and shift right/down to create block */
    transform: translateZ(-24px) translateX(24px) translateY(24px);
    z-index: 4;
    backface-visibility: hidden;
  }

  /* Rim Light (Left Edge) */
  .sign-rim {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border-radius: 12px;
    /* Thin white strip on the left */
    border-left: 1px solid var(--sign-rim);
    border-top: 1px solid rgba(255,255,255,0.6);
    /* Push back and shift left */
    transform: translateZ(-1px) translateX(-1px) translateY(-1px);
    z-index: 3;
    backface-visibility: hidden;
    pointer-events: none;
  }

  /* Hardware Shadow on Face */
  .hardware-shadow {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    border-radius: 12px;
    /* Sharp shadow from bracket */
    background: radial-gradient(circle at 50% 0%, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.05) 20%, transparent 40%);
    transform: translateZ(1px);
    z-index: 6;
    pointer-events: none;
  }

  /* --- HARDWARE (CRITIQUE 2: INDUSTRIAL BRACKET) --- */
  .mount-bracket {
    position: absolute;
    top: -30px;
    left: 50%;
    width: 140px;
    height: 40px;
    background: linear-gradient(to bottom, #333, #111);
    /* Shape the bracket */
    clip-path: polygon(10% 0, 90% 0, 100% 100%, 0% 100%);
    border-radius: 2px;
    transform: translateX(-50%) translateZ(-12px); /* Centered on thickness */
    z-index: 3;
    /* Drop shadow onto the sign face */
    box-shadow: 0 10px 15px rgba(0,0,0,0.4);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 8px;
  }

  /* Bracket Rim Light */
  .mount-bracket::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to bottom, rgba(255,255,255,0.2), transparent);
    clip-path: polygon(10% 0, 90% 0, 100% 100%, 0% 100%);
    pointer-events: none;
  }

  .bolt {
    width: 8px; height: 8px;
    background: radial-gradient(circle at 30% 30%, #888, #222);
    border-radius: 50%;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
    margin: 0 20px;
    position: relative;
  }
  /* Hex slot */
  .bolt::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 4px; height: 4px;
    background: #111;
    transform: translate(-50%, -50%) rotate(45deg);
  }

  /* --- EMBLEM (CRITIQUE 5: GLOSSY & POLISHED) --- */
  .emblem-container {
    width: 120px;
    height: 120px;
    position: relative;
    z-index: 10;
    /* Physical drop shadow */
    filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
  }

  .emblem-circle {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    /* Rich Red Gradient */
    background: radial-gradient(circle at 30% 30%, var(--brand-red-light) 0%, var(--brand-red) 50%, var(--brand-red-dark) 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
  }

  /* Glass Specular Reflection */
  .emblem-gloss {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    /* Sharp, high-contrast reflection */
    background: linear-gradient(135deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.5) 20%, rgba(255,255,255,0) 60%);
    border-radius: 50%;
    z-index: 2;
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  /* The Triangle - SVG for Geometric Crispness */
  .play-icon {
    width: 44px;
    height: 44px;
    fill: #ffffff;
    z-index: 1;
    /* Optical center adjustment */
    margin-left: 4px; 
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.25));
  }

  /* --- FLOOR SHADOW (CRITIQUE 3: PERSPECTIVE ANCHOR) --- */
  .floor-shadow {
    position: absolute;
    top: 50%; left: 50%;
    width: 400px;
    height: 120px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.1) 60%, transparent 80%);
    /* Anchor to floor */
    transform: translate3d(-50%, 220px, 0) rotateX(60deg); 
    filter: blur(8px);
    z-index: 3;
    pointer-events: none;
    transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* --- TEXT (CRITIQUE 5: LEGIBILITY) --- */
  .text-overlay {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    pointer-events: none;
    text-align: center;
    width: 100%;
  }

  .text-main {
    color: #333;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.9;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }
  
  .text-sub {
    display: block;
    margin-top: 4px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #555;
    opacity: 0.7;
  }

</style>
</head>
<body>

  <div class="studio-container">
    <!-- Background Context -->
    <div class="wall"></div>
    <div class="floor"></div>
    <div class="vignette"></div>

    <!-- Main Product Stage -->
    <div class="product-stage" id="stage">
      
      <!-- 3D Sign Assembly -->
      <div class="sign-assembly">
        <!-- Extrusion Layer (Behind) -->
        <div class="sign-extrusion"></div>
        
        <!-- Rim Light Layer (Behind Face) -->
        <div class="sign-rim"></div>
        
        <!-- Front Face -->
        <div class="sign-face">
          <!-- Hardware Shadow onto Face -->
          <div class="hardware-shadow"></div>
          
          <!-- The Emblem -->
          <div class="emblem-container">
            <div class="emblem-circle">
              <div class="emblem-gloss"></div>
              <!-- SVG Triangle -->
              <svg class="play-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 5v14l11-7z"/>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Mounting Hardware -->
      <div class="mount-bracket">
        <div class="bolt"></div>
        <div class="bolt"></div>
      </div>

      <!-- Floor Shadow -->
      <div class="floor-shadow" id="shadow"></div>

    </div>

    <div class="text-overlay">
      <span class="text-main">Hover to Rotate</span>
      <span class="text-sub">Industrial Grade • Matte Finish</span>
    </div>
  </div>

<script>
  const stage = document.getElementById('stage');
  const shadow = document.getElementById('shadow');
  const container = document.querySelector('.studio-container');

  // Mouse interaction for parallax/rotation
  container.addEventListener('mousemove', (e) => {
    const { innerWidth, innerHeight } = window;
    
    // Normalized coordinates (-1 to 1)
    const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
    const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);

    // Rotation Constraints
    const maxRot = 15;
    
    // Calculate Rotation
    // RotateY follows X mouse movement
    // RotateX follows Y mouse movement (inverted)
    const rotY = x * maxRot;
    const rotX = -y * maxRot + 10; // +10 maintains the "looking down" angle

    stage.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;

    // Dynamic Shadow Logic
    // Light is Top-Left.
    // If we rotate object Right (positive Y), shadow moves Right.
    // If we rotate object Up (negative X), shadow moves Down.
    // Base position is Bottom-Right (X: 40px, Y: 220px)
    
    const baseShadowX = 40; 
    const baseShadowY = 220; 

    // Move shadow based on rotation to simulate fixed light source
    const shadowMoveX = baseShadowX + (rotY * 2.5); 
    const shadowMoveY = baseShadowY + (rotX * 1.5);
    
    // Scale/Opacity based on height (RotateX)
    const scale = 1 - (y * 0.15); // Compress slightly based on perspective
    const opacity = 0.7 - (y * 0.15); // Fade slightly when high

    shadow.style.transform = `translate3d(calc(-50% + ${shadowMoveX}px), ${shadowMoveY}px, 0) rotateX(60deg) scale(${scale})`;
    shadow.style.opacity = opacity;
  });

  // Reset on leave
  container.addEventListener('mouseleave', () => {
    stage.style.transform = `rotateX(10deg) rotateY(-10deg)`;
    shadow.style.transform = `translate3d(-10%, 220px, 0) rotateX(60deg)`;
    shadow.style.opacity = 0.7;
  });

</script>
</body>
</html>
