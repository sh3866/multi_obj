<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Render | 3D Signage</title>
<style>
  :root {
    /* Environment */
    --bg-wall: #1e1e24;
    --bg-floor: #141417;
    --floor-line: #2a2a30;
    
    /* Sign Materials */
    --sign-face: #ffffff;
    --sign-side-top: #e0e0e5;
    --sign-side-bot: #9999a0;
    
    /* Hardware */
    --metal-dark: #111111;
    --metal-mid: #333333;
    --metal-light: #555555;
    
    /* Emblem */
    --brand-red: #ff1a1a;
    --brand-red-shadow: #b30000;
    --brand-red-highlight: #ff8080;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    background-color: var(--bg-wall);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1200px;
  }

  /* --- STUDIO CONTEXT --- */
  .studio-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    transform-style: preserve-3d;
  }

  /* Wall */
  .wall {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, #25252b 0%, var(--bg-wall) 100%);
    z-index: 1;
  }

  /* Floor Plane */
  .floor {
    position: absolute;
    bottom: 0; left: -50%; width: 200%; height: 50%;
    background: var(--bg-floor);
    transform: rotateX(60deg);
    transform-origin: top center;
    z-index: 2;
    border-top: 1px solid var(--floor-line);
    box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
  }

  /* Vignette & Lighting */
  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0.6) 90%);
    pointer-events: none;
    z-index: 20;
  }

  /* --- PRODUCT STAGE --- */
  .product-stage {
    position: relative;
    width: 360px;
    height: 480px; /* Taller portrait aspect */
    transform-style: preserve-3d;
    /* Default pose: Slight tilt */
    transform: rotateX(8deg) rotateY(-12deg);
    transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 10;
    margin-top: -100px; /* Lift slightly */
  }

  /* --- THE SIGN (3D EXTRUSION) --- */
  .sign-assembly {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform-style: preserve-3d;
  }

  /* Front Face */
  .sign-face {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: var(--sign-face);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 5;
    backface-visibility: hidden;
    /* Subtle paper texture */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
  }

  /* Extrusion Block (The thickness) */
  .sign-extrusion {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border-radius: 16px;
    /* Gradient simulates lighting on the side face */
    background: linear-gradient(to bottom, var(--sign-side-top), var(--sign-side-bot));
    /* Push back and shift right to create depth */
    transform: translateZ(-20px) translateX(20px);
    z-index: 4;
    backface-visibility: hidden;
  }

  /* Hardware Shadow on Face (From Bracket) */
  .hardware-shadow {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    border-radius: 16px;
    /* Shadow cast by the L-bracket */
    background: radial-gradient(circle at 50% 0%, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.05) 30%, transparent 60%);
    transform: translateZ(1px);
    z-index: 6;
    pointer-events: none;
  }

  /* --- HARDWARE (L-BRACKET) --- */
  .mount-bracket {
    position: absolute;
    top: -40px;
    left: 50%;
    width: 120px;
    height: 50px;
    /* Metallic Gradient */
    background: linear-gradient(to bottom, var(--metal-light), var(--metal-dark));
    /* Shape the L-Bracket */
    clip-path: polygon(10% 0, 90% 0, 100% 100%, 0% 100%);
    transform: translateX(-50%) translateZ(-10px); /* Centered on the extrusion depth */
    z-index: 3;
    /* Cast shadow onto the board */
    box-shadow: 0 12px 18px rgba(0,0,0,0.6);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 12px;
  }

  /* Bracket Highlight */
  .mount-bracket::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to bottom, rgba(255,255,255,0.3), transparent);
    clip-path: polygon(10% 0, 90% 0, 100% 100%, 0% 100%);
    pointer-events: none;
  }

  /* Screws/Bolts */
  .bolt {
    width: 10px; height: 10px;
    background: radial-gradient(circle at 30% 30%, #666, #111);
    border-radius: 50%;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.9), 0 1px 0 rgba(255,255,255,0.2);
    margin: 0 25px;
    position: relative;
  }
  /* Phillips head detail */
  .bolt::before {
    content: '+';
    position: absolute;
    top: 50%; left: 50%;
    width: 100%; height: 100%;
    transform: translate(-50%, -50%);
    font-size: 10px;
    color: #000;
    line-height: 0;
    text-align: center;
    opacity: 0.8;
  }

  /* --- EMBLEM (REDESIGNED) --- */
  .emblem-container {
    width: 140px;
    height: 140px;
    position: relative;
    z-index: 10;
    /* Outer drop shadow for depth */
    filter: drop-shadow(0 12px 16px rgba(0,0,0,0.25));
  }

  .emblem-circle {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    /* Rich 3D Red Gradient */
    background: radial-gradient(circle at 30% 30%, var(--brand-red-highlight) 0%, var(--brand-red) 40%, var(--brand-red-shadow) 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
    /* Inner bevel */
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.1), inset 0 0 20px rgba(0,0,0,0.2);
  }

  /* Glass Specular Reflection (Glossy Badge) */
  .emblem-gloss {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.4) 20%, rgba(255,255,255,0) 50%);
    border-radius: 50%;
    z-index: 2;
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  /* The Play Triangle */
  .play-icon {
    width: 50px;
    height: 50px;
    fill: #ffffff;
    z-index: 1;
    /* Optical center adjustment */
    margin-left: 6px; 
    /* Inner shadow to make triangle look inset */
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
  }

  /* --- CONTACT SHADOW --- */
  .floor-shadow {
    position: absolute;
    top: 50%; left: 50%;
    width: 300px;
    height: 80px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 70%);
    /* Anchor to floor plane directly beneath sign */
    transform: translate3d(-50%, 260px, 0) rotateX(60deg); 
    filter: blur(12px);
    z-index: 3;
    pointer-events: none;
    transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* --- TYPOGRAPHY --- */
  .text-overlay {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    pointer-events: none;
    text-align: center;
    width: 100%;
  }

  .text-main {
    color: #1a1a1a; /* Dark Charcoal */
    font-size: 20px; /* Increased Size */
    font-weight: 900; /* Heavy Weight */
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.9;
    text-shadow: 0 1px 0 rgba(255,255,255,0.2);
  }
  
  .text-sub {
    display: block;
    margin-top: 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: #444;
    opacity: 0.8;
  }

</style>
</head>
<body>

  <div class="studio-container">
    <!-- Background Context -->
    <div class="wall"></div>
    <div class="floor"></div>
    <div class="vignette"></div>

    <!-- Main Product Stage -->
    <div class="product-stage" id="stage">
      
      <!-- 3D Sign Assembly -->
      <div class="sign-assembly">
        
        <!-- Extrusion Layer (The physical thickness) -->
        <div class="sign-extrusion"></div>
        
        <!-- Front Face -->
        <div class="sign-face">
          <!-- Hardware Shadow onto Face -->
          <div class="hardware-shadow"></div>
          
          <!-- The Emblem -->
          <div class="emblem-container">
            <div class="emblem-circle">
              <div class="emblem-gloss"></div>
              <!-- SVG Triangle -->
              <svg class="play-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 5v14l11-7z"/>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Mounting Hardware (L-Bracket) -->
      <div class="mount-bracket">
        <div class="bolt"></div>
        <div class="bolt"></div>
      </div>

      <!-- Floor Shadow (Contact) -->
      <div class="floor-shadow" id="shadow"></div>

    </div>

    <div class="text-overlay">
      <span class="text-main">Hover to Rotate</span>
      <span class="text-sub">Premium Finish • Solid Core</span>
    </div>
  </div>

<script>
  const stage = document.getElementById('stage');
  const shadow = document.getElementById('shadow');
  const container = document.querySelector('.studio-container');

  // Mouse interaction for parallax/rotation
  container.addEventListener('mousemove', (e) => {
    const { innerWidth, innerHeight } = window;
    
    // Normalized coordinates (-1 to 1)
    const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
    const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);

    // Rotation Constraints
    const maxRot = 12;
    
    // Calculate Rotation
    const rotY = x * maxRot;
    const rotX = -y * maxRot + 8; // +8 maintains the "looking down" angle

    stage.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;

    // Dynamic Shadow Logic
    // Light is Top-Left.
    // Shadow moves opposite to light source relative to object.
    // If object rotates Right, shadow moves Right (away from center).
    
    const baseShadowX = 0; 
    const baseShadowY = 260; 

    // Move shadow based on rotation
    const shadowMoveX = baseShadowX + (rotY * 3); 
    const shadowMoveY = baseShadowY + (rotX * 1.5);
    
    // Scale/Opacity based on height (RotateX)
    // If we tilt up (negative Y), shadow moves further and gets lighter/smaller
    const scale = 1 - (y * 0.2); 
    const opacity = 0.8 - (y * 0.3);

    shadow.style.transform = `translate3d(calc(-50% + ${shadowMoveX}px), ${shadowMoveY}px, 0) rotateX(60deg) scale(${scale})`;
    shadow.style.opacity = Math.max(0.2, opacity);
  });

  // Reset on leave
  container.addEventListener('mouseleave', () => {
    stage.style.transform = `rotateX(8deg) rotateY(-12deg)`;
    shadow.style.transform = `translate3d(-50%, 260px, 0) rotateX(60deg)`;
    shadow.style.opacity = 0.8;
  });

</script>
</body>
</html>
