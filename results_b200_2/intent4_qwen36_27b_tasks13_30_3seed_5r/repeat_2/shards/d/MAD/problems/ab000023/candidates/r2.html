<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play Sign | Refined Product Render</title>
<style>
  :root {
    /* Environment */
    --bg-wall-top: #f0f2f5;
    --bg-wall-bot: #dcdfe4;
    --bg-floor-top: #dcdfe4;
    --bg-floor-bot: #b8bcc3;
    
    /* Object Materials */
    --sign-face: #ffffff;
    --sign-side-highlight: #f0f2f5;
    --sign-side-shadow: #b0b5ba;
    --metal-light: #fdfdfd;
    --metal-mid: #d1d5db;
    --metal-dark: #9ca3af;
    
    /* Emblem */
    --brand-red: #FF0000;
    --brand-red-dark: #cc0000;
    --brand-red-light: #ff4d4d;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    background-color: #e0e3e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1200px; /* Deep perspective */
  }

  /* --- STUDIO ENVIRONMENT (CRITIQUE 2) --- */
  .studio-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    transform-style: preserve-3d;
  }

  /* Wall */
  .wall {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 50%;
    background: linear-gradient(to bottom, var(--bg-wall-top), var(--bg-wall-bot));
    transform-origin: bottom;
    transform: rotateX(0deg); /* Flat for now, depth handled by perspective */
    z-index: 1;
  }

  /* Floor */
  .floor {
    position: absolute;
    top: 50%; left: 0; width: 100%; height: 50%;
    background: linear-gradient(to bottom, var(--bg-floor-top), var(--bg-floor-bot));
    transform: rotateX(45deg);
    transform-origin: top;
    z-index: 2;
    /* Horizon line visual trick */
    border-top: 1px solid rgba(0,0,0,0.05); 
  }

  /* Vignette */
  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.15) 100%);
    pointer-events: none;
    z-index: 20;
  }

  /* --- PRODUCT STAGE --- */
  .product-stage {
    position: relative;
    width: 360px;
    height: 360px;
    transform-style: preserve-3d;
    /* Default pose: Slight tilt, looking at camera */
    transform: rotateX(5deg) rotateY(-5deg);
    transition: transform 0.1s ease-out;
    z-index: 10;
  }

  /* --- THE SIGN (CRITIQUE 3: UNIFIED 3D PROFILE) --- */
  
  /* The Sign Container (holds Front and Side) */
  .sign-assembly {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform-style: preserve-3d;
  }

  /* Front Face */
  .sign-face {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: var(--sign-face);
    border-radius: 24px;
    /* Subtle inner shadow for depth */
    box-shadow: inset 0 0 20px rgba(0,0,0,0.02);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 5;
    backface-visibility: hidden;
  }

  /* Side Profile (Thickness) - Positioned behind and shifted */
  .sign-side {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border-radius: 24px;
    /* Gradient simulates volume from top light */
    background: linear-gradient(to bottom, var(--sign-side-highlight), var(--sign-side-shadow));
    /* 
       Logic: We translate Z negative to move it back, 
       and translate X/Y positive to simulate the thickness block 
       when the light is top-left.
    */
    transform: translateZ(-24px) translateX(24px) translateY(24px); 
    z-index: 4;
    /* Ensure side doesn't clip */
    backface-visibility: hidden; 
  }
  
  /* Hardware Shadow (CRITIQUE 5) */
  .hardware-shadow {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    border-radius: 24px;
    background: radial-gradient(circle at 50% 0%, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0) 40%);
    transform: translateZ(1px); /* Just in front of face */
    z-index: 6;
    pointer-events: none;
  }

  /* --- HARDWARE (CRITIQUE 5) --- */
  .mount-bracket {
    position: absolute;
    top: -24px; /* Sits on top edge */
    left: 50%;
    width: 160px;
    height: 30px;
    background: linear-gradient(to bottom, var(--metal-light), var(--metal-mid));
    border-radius: 4px 4px 0 0;
    transform: translateX(-50%) translateZ(-12px); /* Centered on thickness */
    z-index: 3;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 20px;
  }

  /* Metallic Shine */
  .mount-bracket::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
    border-radius: inherit;
    opacity: 0.5;
  }

  .screw {
    width: 10px; height: 10px;
    background: radial-gradient(circle at 30% 30%, #fff, #888);
    border-radius: 50%;
    box-shadow: 0 1px 2px rgba(0,0,0,0.5);
    margin-bottom: 6px;
  }
  /* Screw head slot */
  .screw::after {
    content: '';
    position: absolute;
    top: 50%; left: 2px; right: 2px;
    height: 1px;
    background: #555;
    transform: rotate(45deg);
  }

  /* --- EMBLEM (CRITIQUE 4: GEOMETRIC AUTHORITY) --- */
  .emblem-container {
    width: 140px;
    height: 140px;
    position: relative;
    z-index: 10;
    /* Subtle shadow on the sign face */
    filter: drop-shadow(0 8px 12px rgba(0,0,0,0.25)); 
  }

  .emblem-circle {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    /* Crisp Red Gradient (Light source Top-Left) */
    background: radial-gradient(circle at 35% 30%, var(--brand-red-light) 0%, var(--brand-red) 40%, var(--brand-red-dark) 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
    /* Physical rim highlight */
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
  }

  /* Glossy Lens Effect */
  .emblem-gloss {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    /* Sharp reflection */
    background: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.4) 30%, rgba(255,255,255,0) 60%);
    border-radius: 50%;
    z-index: 2;
    pointer-events: none;
  }

  /* The Triangle - SVG for crispness */
  .play-icon {
    width: 50px;
    height: 50px;
    fill: #ffffff;
    z-index: 1;
    /* Slight optical offset to center */
    margin-left: 4px; 
    /* Filter for the triangle itself */
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
  }

  /* --- FLOOR SHADOW (CRITIQUE 1: UNIFY LIGHTING) --- */
  /* 
     Light is Top-Left.
     Object casts shadow to Bottom-Right.
  */
  .floor-shadow {
    position: absolute;
    top: 50%; left: 50%;
    width: 380px;
    height: 100px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 70%);
    /* 
       Translate X/Y: Move to Bottom-Right relative to object center
       Rotate X: Flatten to floor plane
    */
    transform: translate3d(-50%, 200px, 0) rotateX(60deg); 
    filter: blur(12px);
    z-index: 3; /* Behind object, on floor */
    opacity: 0.8;
    transition: transform 0.1s ease-out, opacity 0.1s ease-out;
    pointer-events: none;
  }

  .hint {
    position: absolute;
    bottom: 20px;
    color: #666;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    opacity: 0.5;
    z-index: 30;
  }

</style>
</head>
<body>

  <div class="studio-container">
    <!-- Background Context -->
    <div class="wall"></div>
    <div class="floor"></div>
    <div class="vignette"></div>

    <!-- Main Product Stage -->
    <div class="product-stage" id="stage">
      
      <!-- 3D Sign Assembly -->
      <div class="sign-assembly">
        <!-- Thickness Layer (Behind) -->
        <div class="sign-side"></div>
        
        <!-- Front Face -->
        <div class="sign-face">
          <!-- Hardware Shadow onto Face -->
          <div class="hardware-shadow"></div>
          
          <!-- The Emblem -->
          <div class="emblem-container">
            <div class="emblem-circle">
              <div class="emblem-gloss"></div>
              <!-- SVG Triangle for Geometric Crispness -->
              <svg class="play-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 5v14l11-7z"/>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Mounting Hardware -->
      <div class="mount-bracket">
        <div class="screw"></div>
        <div class="screw"></div>
      </div>

      <!-- Floor Shadow -->
      <div class="floor-shadow" id="shadow"></div>

    </div>

    <div class="hint">Hover to rotate</div>
  </div>

<script>
  const stage = document.getElementById('stage');
  const shadow = document.getElementById('shadow');
  const container = document.querySelector('.studio-container');

  // Mouse interaction for parallax/rotation
  container.addEventListener('mousemove', (e) => {
    const { innerWidth, innerHeight } = window;
    
    // Normalized coordinates (-1 to 1)
    const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
    const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);

    // Rotation Constraints
    const maxRot = 12;
    
    // Calculate Rotation
    // RotateY follows X mouse movement
    // RotateX follows Y mouse movement (inverted)
    const rotY = x * maxRot;
    const rotX = -y * maxRot + 5; // +5 maintains the "looking down" angle

    stage.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;

    // Dynamic Shadow Logic
    // Light is Top-Left.
    // If we rotate object Right (positive Y), shadow moves Right.
    // If we rotate object Up (negative X), shadow moves Down.
    // Base position is Bottom-Right (X: 40px, Y: 200px)
    
    const baseShadowX = 40; // Offset for light source
    const baseShadowY = 200; // Distance to floor

    // Move shadow based on rotation to simulate fixed light source
    const shadowMoveX = baseShadowX + (rotY * 2); 
    const shadowMoveY = baseShadowY + (rotX * 2);
    
    // Scale/Opacity based on height (RotateX)
    // If object tilts up (less rotX), shadow gets smaller/darker (closer to light?)
    // If object tilts down (more rotX), shadow gets larger/further
    
    const scale = 1 - (y * 0.1); // Compress slightly based on perspective
    const opacity = 0.6 - (y * 0.2); // Fade slightly when high

    shadow.style.transform = `translate3d(calc(-50% + ${shadowMoveX}px), ${shadowMoveY}px, 0) rotateX(60deg) scale(${scale})`;
    shadow.style.opacity = opacity;
  });

  // Reset on leave
  container.addEventListener('mouseleave', () => {
    stage.style.transform = `rotateX(5deg) rotateY(-5deg)`;
    shadow.style.transform = `translate3d(-10%, 200px, 0) rotateX(60deg)`;
    shadow.style.opacity = 0.8;
  });

</script>
</body>
</html>
