<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Product Render | Video Signage</title>
<style>
  :root {
    /* Environment */
    --bg-wall: #18181b;
    --bg-floor: #0f0f11;
    --floor-border: #27272a;
    
    /* Sign Materials */
    --sign-face: #ffffff;
    --sign-face-subtle: #fdfdfd;
    --sign-edge-light: #ffffff;
    --sign-edge-mid: #e5e5e5;
    --sign-edge-dark: #b0b0b0;
    
    /* Hardware */
    --metal-dark: #0f172a;
    --metal-mid: #334155;
    --metal-light: #64748b;
    --metal-highlight: #94a3b8;
    
    /* Emblem */
    --brand-red: #ff0000;
    --brand-red-dark: #cc0000;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    background-color: var(--bg-wall);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1000px;
  }

  /* --- STUDIO CONTEXT --- */
  .studio-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    transform-style: preserve-3d;
  }

  /* Wall */
  .wall {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 40%, #2a2a30 0%, var(--bg-wall) 60%);
    z-index: 1;
  }

  /* Floor Plane */
  .floor {
    position: absolute;
    bottom: -20%; left: -50%; width: 200%; height: 80%;
    background: var(--bg-floor);
    transform: rotateX(60deg);
    transform-origin: top center;
    z-index: 2;
    border-top: 1px solid var(--floor-border);
    box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
  }

  /* Vignette & Lighting */
  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(0,0,0,0.8) 100%);
    pointer-events: none;
    z-index: 20;
  }

  /* --- PRODUCT STAGE --- */
  .product-stage {
    position: relative;
    width: 340px;
    height: 460px;
    transform-style: preserve-3d;
    /* Default pose */
    transform: rotateX(10deg) rotateY(0deg);
    transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 10;
  }

  /* --- THE SIGN (3D EXTRUSION) --- */
  .sign-assembly {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform-style: preserve-3d;
  }

  /* Front Face: Clean, White, Matte */
  .sign-face {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: var(--sign-face);
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 5;
    backface-visibility: hidden;
    /* Very subtle gradient to prevent flatness, but keep it white */
    background: linear-gradient(135deg, #ffffff 0%, #f8f8f8 100%);
    /* Soft inner border for definition */
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.03);
  }

  /* Extrusion Block (The physical thickness) */
  .sign-extrusion {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border-radius: 12px;
    /* Simulating the side thickness */
    background: linear-gradient(to right, var(--sign-edge-dark), var(--sign-edge-mid));
    /* Push back and shift right to create depth */
    transform: translateZ(-24px) translateX(24px);
    z-index: 4;
    backface-visibility: hidden;
  }

  /* Rim Light / Edge Highlight */
  .sign-edge-highlight {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border-radius: 12px;
    /* This creates the "sharp rim light" requested */
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.8), inset 2px 0 5px rgba(255,255,255,0.4);
    transform: translateZ(-24px);
    z-index: 5;
    pointer-events: none;
    backface-visibility: hidden;
  }

  /* Shadow cast BY the sign ON the wall */
  .wall-shadow {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.15);
    border-radius: 12px;
    filter: blur(20px);
    transform: translateZ(-30px) translateX(40px) translateY(20px) scale(0.98);
    z-index: 3;
    opacity: 0.6;
    pointer-events: none;
  }

  /* Shadow cast BY the bracket ON the face */
  .hardware-shadow {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    border-radius: 12px;
    /* Shadow cast by the L-bracket */
    background: radial-gradient(circle at 50% 0%, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.05) 40%, transparent 70%);
    transform: translateZ(1px);
    z-index: 6;
    pointer-events: none;
  }

  /* --- HARDWARE (L-BRACKET) --- */
  /* Redesigned: Heavy duty, metallic, overlapping */
  .mount-bracket {
    position: absolute;
    top: -30px;
    left: 50%;
    width: 140px;
    height: 60px;
    /* Brushed Steel Gradient */
    background: linear-gradient(to bottom, var(--metal-highlight) 0%, var(--metal-mid) 50%, var(--metal-dark) 100%);
    /* Shape the L-Bracket */
    clip-path: polygon(5% 0, 95% 0, 100% 100%, 0% 100%);
    /* Physically overlap the sign by sitting in front (Z-index) and overlapping Y */
    transform: translateX(-50%) translateZ(26px); 
    z-index: 15;
    /* Drop shadow for 3D separation */
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 15px;
  }

  /* Metallic Texture Overlay */
  .mount-bracket::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      90deg,
      rgba(255,255,255,0.1) 0px,
      transparent 2px,
      transparent 4px
    );
    clip-path: polygon(5% 0, 95% 0, 100% 100%, 0% 100%);
    pointer-events: none;
  }

  /* Screws/Bolts */
  .bolt {
    width: 12px; height: 12px;
    background: radial-gradient(circle at 30% 30%, #777, #111);
    border-radius: 50%;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.9), 0 1px 0 rgba(255,255,255,0.3);
    margin: 0 35px;
    position: relative;
    z-index: 16;
  }
  /* Phillips head detail */
  .bolt::before {
    content: '+';
    position: absolute;
    top: 50%; left: 50%;
    width: 100%; height: 100%;
    transform: translate(-50%, -50%);
    font-size: 12px;
    color: #000;
    line-height: 0;
    text-align: center;
    opacity: 0.6;
    font-weight: bold;
  }

  /* --- EMBLEM (REDESIGNED) --- */
  /* Flat, crisp vector shape with drop shadow */
  .emblem-container {
    width: 160px;
    height: 160px;
    position: relative;
    z-index: 10;
    /* Distinct drop shadow to sit ON the surface */
    filter: drop-shadow(0 15px 20px rgba(0,0,0,0.2));
  }

  .emblem-circle {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    /* Flat authoritative red */
    background-color: var(--brand-red);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
    /* Subtle inner gradient for depth without gloss */
    background: radial-gradient(circle at 50% 50%, var(--brand-red) 0%, var(--brand-red-dark) 100%);
  }

  /* The Play Triangle */
  .play-icon {
    width: 56px;
    height: 56px;
    fill: #ffffff;
    z-index: 1;
    /* Optical center adjustment for triangle */
    margin-left: 8px; 
  }

  /* --- CONTACT SHADOW --- */
  /* Distinct, soft drop shadow beneath the sign */
  .floor-shadow {
    position: absolute;
    top: 50%; left: 50%;
    width: 320px;
    height: 100px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 70%);
    /* Anchor to floor plane directly beneath sign */
    transform: translate3d(-50%, 280px, 0) rotateX(60deg); 
    filter: blur(15px);
    z-index: 3;
    pointer-events: none;
    transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

</style>
</head>
<body>

  <div class="studio-container">
    <!-- Background Context -->
    <div class="wall"></div>
    <div class="floor"></div>
    <div class="vignette"></div>

    <!-- Main Product Stage -->
    <div class="product-stage" id="stage">
      
      <!-- Wall Shadow (Behind Sign) -->
      <div class="wall-shadow"></div>

      <!-- 3D Sign Assembly -->
      <div class="sign-assembly">
        
        <!-- Extrusion Layer (The physical thickness) -->
        <div class="sign-extrusion"></div>
        
        <!-- Edge Highlight (Rim Light) -->
        <div class="sign-edge-highlight"></div>

        <!-- Front Face -->
        <div class="sign-face">
          <!-- Hardware Shadow onto Face -->
          <div class="hardware-shadow"></div>
          
          <!-- The Emblem -->
          <div class="emblem-container">
            <div class="emblem-circle">
              <!-- SVG Triangle: Flat, Crisp -->
              <svg class="play-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 5v14l11-7z"/>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Mounting Hardware (L-Bracket) -->
      <div class="mount-bracket">
        <div class="bolt"></div>
        <div class="bolt"></div>
      </div>

      <!-- Floor Shadow (Contact) -->
      <div class="floor-shadow" id="shadow"></div>

    </div>

  </div>

<script>
  const stage = document.getElementById('stage');
  const shadow = document.getElementById('shadow');
  const container = document.querySelector('.studio-container');

  // Mouse interaction for parallax/rotation
  container.addEventListener('mousemove', (e) => {
    const { innerWidth, innerHeight } = window;
    
    // Normalized coordinates (-1 to 1)
    const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
    const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);

    // Rotation Constraints
    const maxRot = 15;
    
    // Calculate Rotation
    const rotY = x * maxRot;
    const rotX = -y * maxRot + 10; // +10 maintains the "looking down" angle

    stage.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;

    // Dynamic Shadow Logic
    // Shadow moves opposite to light source relative to object.
    const baseShadowX = 0; 
    const baseShadowY = 280; 

    // Move shadow based on rotation
    // If object rotates Right (positive Y), shadow moves Left relative to object center in 3D space,
    // but since we are projecting on the floor plane (Z=0), we need to offset X.
    const shadowMoveX = baseShadowX + (rotY * 4); 
    const shadowMoveY = baseShadowY + (rotX * 2);
    
    // Scale/Opacity based on height (RotateX)
    const scale = 1 - (y * 0.1); 
    const opacity = 0.8 - (y * 0.2);

    shadow.style.transform = `translate3d(calc(-50% + ${shadowMoveX}px), ${shadowMoveY}px, 0) rotateX(60deg) scale(${scale})`;
    shadow.style.opacity = Math.max(0.2, opacity);
  });

  // Reset on leave
  container.addEventListener('mouseleave', () => {
    stage.style.transform = `rotateX(10deg) rotateY(0deg)`;
    shadow.style.transform = `translate3d(-50%, 280px, 0) rotateX(60deg)`;
    shadow.style.opacity = 0.8;
  });

</script>
</body>
</html>
