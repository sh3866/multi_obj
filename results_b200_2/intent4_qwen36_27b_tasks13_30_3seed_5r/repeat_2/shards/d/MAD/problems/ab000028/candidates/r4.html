<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Descent // The Edge</title>
<style>
  :root {
    --bg-dark: #1a1f2c;
    --bg-light: #eef2f5;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-dark);
    font-family: system-ui, -apple-system, sans-serif;
  }

  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: block;
  }

  #scene {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Animations */
  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-15px) rotate(1deg); }
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-1deg); }
    50% { transform: rotate(1.5deg); }
  }

  @keyframes windShear {
    0% { transform: translateX(0) translateZ(0); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.6; }
    100% { transform: translateX(-400px) translateZ(0); opacity: 0; }
  }

  /* Classes */
  .parachute-system {
    /* Positioning for center-right foreground */
    transform-origin: 0px 0px;
    animation: float 6s ease-in-out infinite;
  }

  .canopy-group {
    transform-origin: 50% 100%;
    animation: sway 7s ease-in-out infinite;
  }

  .wind-streak {
    stroke: #ffffff;
    stroke-linecap: round;
    fill: none;
    filter: blur(2px);
    animation: windShear 4s linear infinite;
  }
  
  .wind-streak.slow { animation-duration: 6s; }
  .wind-streak.fast { animation-duration: 3s; }

  /* Depth Layers */
  .depth-layer {
    will-change: transform;
    transition: transform 0.1s linear;
  }

</style>
</head>
<body>

<div id="viewport">
  <!-- No Typography Overlay per Design Critique -->

  <svg id="scene" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Atmospheric Gradient: Warm foreground (left) to Cool background (right) -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#DCE4E8;stop-opacity:1" /> <!-- Warm/Desaturated -->
        <stop offset="60%" style="stop-color:#7A909E;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#2B3A4A;stop-opacity:1" /> <!-- Cool/Deep Blue -->
      </linearGradient>

      <!-- Canopy Gradient: Safety Orange with depth -->
      <radialGradient id="canopyGrad" cx="40%" cy="40%" r="70%">
        <stop offset="0%" style="stop-color:#FF8A65;stop-opacity:1" />
        <stop offset="40%" style="stop-color:#FF5722;stop-opacity:1" />
        <stop offset="85%" style="stop-color:#D84315;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#BF360C;stop-opacity:1" />
      </radialGradient>

      <!-- Mesh Gradients for Cliff -->
      <linearGradient id="cliffFront" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#546E7A;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#263238;stop-opacity:1" />
      </linearGradient>
      
      <linearGradient id="cliffRust" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#8D6E63;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#4E342E;stop-opacity:1" />
      </linearGradient>

      <linearGradient id="cliffDeep" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#1C262B;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
      </linearGradient>

      <!-- Blur for distant mountains -->
      <filter id="atmosBlur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="4" />
      </filter>
    </defs>

    <!-- 1. Background Sky -->
    <rect width="1200" height="900" fill="url(#skyGrad)" />

    <!-- 2. Distant Landscape (Depth) -->
    <g id="depth-layer" class="depth-layer" filter="url(#atmosBlur)">
      <!-- Layer 1: Furthest (Cool, low opacity) -->
      <path fill="#4A6070" opacity="0.6" d="M0,800 L200,700 L450,750 L700,650 L900,720 L1200,600 L1200,900 L0,900 Z" />
      <!-- Layer 2: Mid-ground (Darker, more distinct) -->
      <path fill="#354F5E" opacity="0.8" d="M0,850 L150,780 L350,820 L600,750 L850,800 L1200,700 L1200,900 L0,900 Z" />
      <!-- Layer 3: Closer (Almost solid) -->
      <path fill="#263238" opacity="0.9" d="M0,900 L100,820 L300,860 L500,800 L1200,850 L1200,900 Z" />
    </g>

    <!-- 3. The Cliff (Right Side - Jagged Mesh) -->
    <g id="cliff-mesh">
      <!-- Main Mass - Slate -->
      <path fill="url(#cliffFront)" d="M1200,0 L950,0 L980,150 L900,300 L960,450 L880,600 L1000,750 L920,900 L1200,900 Z" />
      
      <!-- Deep Shadows / Crevices - Charcoal -->
      <path fill="url(#cliffDeep)" d="M950,0 L980,150 L900,300 L950,150 Z" />
      <path fill="url(#cliffDeep)" d="M900,300 L960,450 L920,400 Z" />
      <path fill="url(#cliffDeep)" d="M880,600 L1000,750 L950,650 Z" />
      <path fill="url(#cliffDeep)" d="M920,900 L1200,900 L1200,800 L1050,850 Z" />

      <!-- Rust Layers (Geological Texture) -->
      <path fill="url(#cliffRust)" d="M950,0 L1200,0 L1200,200 L980,150 L950,100 Z" opacity="0.8"/>
      <path fill="url(#cliffRust)" d="M960,450 L1200,400 L1200,650 L880,600 Z" opacity="0.6"/>
      <path fill="url(#cliffRust)" d="M1000,750 L1200,700 L1200,900 L920,900 Z" opacity="0.7"/>

      <!-- Sharp Facet Highlights (Windward side) -->
      <path fill="#78909C" opacity="0.4" d="M1200,0 L1100,150 L980,150 Z" />
      <path fill="#78909C" opacity="0.4" d="M1200,400 L1000,450 L960,450 Z" />
    </g>

    <!-- 4. Motion System (Wind Streaks) -->
    <!-- Diagonal lines sweeping left, connecting cliff to parachute -->
    <g id="wind-layer" class="depth-layer">
      <path class="wind-streak fast" stroke-width="2" d="M1100,200 L800,350" style="animation-delay: 0s;" />
      <path class="wind-streak slow" stroke-width="1.5" d="M1050,350 L750,500" style="animation-delay: 1.2s;" />
      <path class="wind-streak fast" stroke-width="3" d="M1150,500 L850,650" style="animation-delay: 0.5s;" />
      <path class="wind-streak slow" stroke-width="1" d="M1000,100 L700,250" style="animation-delay: 2.0s;" />
      <path class="wind-streak fast" stroke-width="2" d="M1200,600 L900,750" style="animation-delay: 0.8s;" />
      <path class="wind-streak slow" stroke-width="2" d="M900,400 L500,600" style="animation-delay: 1.5s;" />
    </g>

    <!-- 5. Parachute Subject (Center-Right Foreground) -->
    <!-- Translated to center-right (x: 600, y: 350) -->
    <g id="subject" class="parachute-system" transform="translate(600, 350)">
      
      <!-- The Canopy (Large, Taut) -->
      <g class="canopy-group">
        <!-- Main Dome -->
        <path d="M-180,20 C-180,140 -90,180 0,180 C90,180 180,140 180,20 C180,-100 90,-130 0,-130 C-90,-130 -180,-100 -180,20 Z" fill="url(#canopyGrad)" />
        
        <!-- Canopy Ribs (Structure) -->
        <g stroke="#A63A18" stroke-width="3" fill="none" opacity="0.5">
          <path d="M0,-130 Q0,20 0,180" />
          <path d="M-60,-120 Q-30,20 -40,180" />
          <path d="M60,-120 Q30,20 40,180" />
          <path d="M-120,-60 Q-60,20 -80,180" />
          <path d="M120,-60 Q60,20 80,180" />
        </g>
        
        <!-- Top Highlight (Specular) -->
        <path d="M-30,-120 C0,-140 30,-140 40,-120 C30,-90 0,-90 -30,-120 Z" fill="rgba(255,255,255,0.4)" />
      </g>

      <!-- Suspension Lines (Taut, White) -->
      <!-- Connecting canopy bottom (y:180) to harness (y:380) -->
      <g stroke="#FFFFFF" stroke-width="1.5" opacity="0.85" fill="none">
        <!-- Left Cluster -->
        <path d="M-180,20 L-35,380" />
        <path d="M-120,160 L-35,380" />
        <path d="M-60,170 L-35,380" />
        <!-- Right Cluster -->
        <path d="M180,20 L35,380" />
        <path d="M120,160 L35,380" />
        <path d="M60,170 L35,380" />
      </g>

      <!-- The Human Figure -->
      <g transform="translate(0, 380)">
        <!-- Harness -->
        <path d="M-18,-5 L18,-5 L18,25 L-18,25 Z" fill="#37474F" stroke="#1C262B" stroke-width="1"/>
        <!-- Toggles -->
        <rect x="-25" y="5" width="8" height="15" fill="#263238" />
        <rect x="17" y="5" width="8" height="15" fill="#263238" />
        
        <!-- Body Silhouette -->
        <g fill="#1A1F2C">
          <!-- Head -->
          <circle cx="0" cy="-25" r="11" />
          <!-- Torso -->
          <path d="M-12,-15 L12,-15 L10,40 L-10,40 Z" />
          <!-- Arms (Reaching down) -->
          <path d="M-10,-5 L-25,25 L-20,30 L-10,20 Z" />
          <path d="M10,-5 L25,25 L20,30 L10,20 Z" />
          <!-- Legs (Hanging) -->
          <path d="M-10,40 L-20,90 L-8,95 L-2,45 Z" />
          <path d="M10,40 L20,90 L8,95 L2,45 Z" />
        </g>
      </g>

    </g>

  </svg>
</div>

<script>
  // Minimal parallax logic
  // Runs immediately, no gating
  
  const depthLayer = document.getElementById('depth-layer');
  const windLayer = document.getElementById('wind-layer');

  document.addEventListener('mousemove', (e) => {
    // Normalize mouse position -1 to 1
    const x = (e.clientX / window.innerWidth - 0.5) * 2; 
    const y = (e.clientY / window.innerHeight - 0.5) * 2;

    // Move background mountains opposite to mouse (Depth)
    if(depthLayer) {
      depthLayer.style.transform = `translate(${x * -30}px, ${y * -15}px)`;
    }

    // Move wind faster in direction of mouse (Speed)
    if(windLayer) {
      windLayer.style.transform = `translate(${x * 50}px, ${y * 25}px)`;
    }
  });
</script>
</body>
</html>
