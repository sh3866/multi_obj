<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verticality // The Edge</title>
<style>
  :root {
    --font-main: 'Helvetica Neue', 'Segoe UI', 'Roboto', 'Arial', sans-serif;
    --color-sky-top: #2B3A4A;
    --color-sky-bot: #D6E4F0;
    --color-accent: #FF4500; /* Safety Orange */
    --color-text: #0F172A;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--color-sky-top);
    font-family: var(--font-main);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Layout Container */
  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* The SVG Scene */
  #scene {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Typography Overlay */
  .title-overlay {
    position: absolute;
    bottom: 5rem;
    left: 4rem;
    z-index: 30;
    pointer-events: none;
    /* Ensure text is readable against any background */
    text-shadow: 0 4px 20px rgba(255, 255, 255, 0.8);
  }

  .title-label {
    font-size: 18px;
    font-weight: 800;
    /* Critique: Increase tracking to match headline width */
    letter-spacing: 1.2em; 
    text-transform: uppercase;
    color: var(--color-accent);
    margin-bottom: 1rem;
    display: block;
    background: rgba(255,255,255,0.95);
    padding: 6px 12px;
    display: inline-block;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  .title-main {
    font-size: clamp(3rem, 7vw, 7rem);
    line-height: 0.85;
    font-weight: 900;
    color: var(--color-text);
    letter-spacing: -0.04em;
    margin: 0;
    text-transform: uppercase;
  }

  /* SVG Animations */
  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(1.5deg); }
  }

  @keyframes sway {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(3deg); }
  }

  @keyframes windShear {
    0% { transform: translateX(0) scaleX(1); opacity: 0; }
    20% { opacity: 0.6; }
    80% { opacity: 0.6; }
    100% { transform: translateX(-300px) scaleX(1.2); opacity: 0; }
  }

  /* Subject Classes */
  .parachute-system {
    /* Critique: Re-center composition. Upper-middle/right quadrant */
    transform-origin: 650px 250px;
    animation: float 6.5s ease-in-out infinite;
  }

  .canopy-group {
    transform-origin: 50% 100%;
    animation: sway 7s ease-in-out infinite;
  }

  .wind-streak {
    fill: rgba(255, 255, 255, 0.4);
    filter: blur(4px);
    animation: windShear 5s linear infinite;
  }

  /* SVG Styles */
  .cliff-face {
    stroke-linejoin: round;
  }
  
  /* Haze Filter for depth */
  .haze {
    filter: blur(2px);
  }

</style>
</head>
<body>

<div id="viewport">
  
  <!-- Typography Overlay -->
  <div class="title-overlay">
    <span class="title-label">Verticality</span>
    <h1 class="title-main">The<br>Edge.</h1>
  </div>

  <!-- The Scene -->
  <svg id="scene" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Sky Gradient: Cool Blue to Warm Horizon -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#2B3A4A;stop-opacity:1" />
        <stop offset="40%" style="stop-color:#638397;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#D6E4F0;stop-opacity:1" />
      </linearGradient>

      <!-- Canopy Gradient: High Contrast Safety Orange -->
      <radialGradient id="canopyGrad" cx="50%" cy="30%" r="70%">
        <stop offset="0%" style="stop-color:#FF7043;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#FF4500;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#B71C1C;stop-opacity:1" />
      </radialGradient>

      <!-- Facet Gradients for Cliff -->
      <linearGradient id="cliffSide" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#455A64;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#263238;stop-opacity:1" />
      </linearGradient>
      
      <linearGradient id="cliffFront" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#546E7A;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#37474F;stop-opacity:1" />
      </linearGradient>
      
      <linearGradient id="cliffShadow" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#1C262B;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
      </linearGradient>

      <!-- Wind Streak Shape -->
      <filter id="blurFilter">
        <feGaussianBlur in="SourceGraphic" stdDeviation="3" />
      </filter>
    </defs>

    <!-- Background Sky -->
    <rect width="1200" height="900" fill="url(#skyGrad)" />

    <!-- Distant Landscape (Atmospheric Depth) -->
    <g id="depth-layer" class="haze">
      <!-- Far Peaks (Low opacity, cool tone) -->
      <path fill="#8CA8BC" opacity="0.3" d="M0,650 L150,580 L350,620 L600,500 L850,590 L1200,520 L1200,900 L0,900 Z" />
      <!-- Mid Peaks (Slightly darker) -->
      <path fill="#5A788C" opacity="0.5" d="M0,750 L200,680 L450,740 L700,650 L950,720 L1200,650 L1200,900 L0,900 Z" />
    </g>

    <!-- Wind Streaks (Motion Cues) -->
    <!-- Critique: Tapered, diagonal, connecting cliff to subject -->
    <g id="wind-layer">
      <path class="wind-streak" d="M900,300 L600,350 L600,355 L900,310 Z" style="animation-delay: 0s;" />
      <path class="wind-streak" d="M950,450 L550,500 L550,505 L950,460 Z" style="animation-delay: 1.5s;" />
      <path class="wind-streak" d="M850,150 L650,200 L650,205 L850,160 Z" style="animation-delay: 0.8s;" />
      <path class="wind-streak" d="M1000,600 L650,650 L650,655 L1000,610 Z" style="animation-delay: 2.2s;" />
    </g>

    <!-- The Cliff (Vertical Monolith) -->
    <!-- Critique: Faceted, low-poly, distinct layers, right side -->
    <g id="cliff-geometry">
      
      <!-- Layer 1: Deep Back Shadow -->
      <path class="cliff-face" fill="url(#cliffShadow)" d="M800,0 L900,50 L850,150 L950,300 L900,450 L1000,600 L950,750 L1200,900 L1200,0 Z" />
      
      <!-- Layer 2: Main Front Face (Faceted) -->
      <!-- Top Left Facet -->
      <path class="cliff-face" fill="url(#cliffFront)" d="M800,0 L900,50 L820,100 L750,50 Z" />
      <!-- Mid Left Facet (Overhang) -->
      <path class="cliff-face" fill="#455A64" d="M820,100 L900,50 L850,150 L780,180 Z" />
      <!-- Lower Left Facet -->
      <path class="cliff-face" fill="#37474F" d="M780,180 L850,150 L950,300 L880,320 Z" />
      <!-- Bottom Massive Facet -->
      <path class="cliff-face" fill="url(#cliffSide)" d="M880,320 L950,300 L900,450 L1000,600 L950,750 L1100,850 L1200,900 L1200,0 Z" />

      <!-- Rock Strata / Texture Lines (Geological detail) -->
      <g stroke="#263238" stroke-width="2" fill="none" opacity="0.4">
        <path d="M820,100 L950,120" />
        <path d="M780,180 L920,200" />
        <path d="M880,320 L1000,340" />
        <path d="M950,450 L1080,480" />
        <path d="M1000,600 L1150,630" />
      </g>
      
      <!-- Deep Crevices -->
      <path d="M850,150 L880,220 L860,250" fill="none" stroke="#000000" stroke-width="4" opacity="0.3"/>
      <path d="M900,450 L940,550 L920,600" fill="none" stroke="#000000" stroke-width="6" opacity="0.4"/>
    </g>

    <!-- Parachute Subject Group -->
    <!-- Critique: High contrast, suspended figure, taut lines -->
    <g id="subject" class="parachute-system" transform="translate(650, 250)">
      
      <!-- The Canopy (Fully Inflated) -->
      <g class="canopy-group">
        <!-- Main Dome Shape -->
        <path d="M-140,40 C-140,110 -80,140 0,140 C80,140 140,110 140,40 C140,-60 80,-90 0,-90 C-80,-90 -140,-60 -140,40 Z" fill="url(#canopyGrad)" />
        
        <!-- Canopy Ribs (Structure) -->
        <g stroke="#9E2A2B" stroke-width="2.5" fill="none" opacity="0.6">
          <path d="M0,-90 Q0,20 0,140" />
          <path d="M-70,-80 Q-35,20 -40,140" />
          <path d="M70,-80 Q35,20 40,140" />
          <path d="M-120,-30 Q-60,20 -80,140" />
          <path d="M120,-30 Q60,20 80,140" />
        </g>
        
        <!-- Top Highlight (Gloss) -->
        <path d="M-40,-80 C0,-100 40,-100 50,-80 C40,-60 0,-60 -40,-80 Z" fill="rgba(255,255,255,0.3)" />
      </g>

      <!-- Suspension Lines (Taut, White) -->
      <!-- Connecting canopy bottom (approx y:140) to harness (approx y:250) -->
      <g stroke="#FFFFFF" stroke-width="1.5" opacity="0.9" fill="none">
        <!-- Left Cluster -->
        <path d="M-140,40 L-30,250" />
        <path d="M-70,80 L-30,250" />
        <path d="M-30,130 L-30,250" />
        <!-- Right Cluster -->
        <path d="M140,40 L30,250" />
        <path d="M70,80 L30,250" />
        <path d="M30,130 L30,250" />
      </g>

      <!-- The Human Figure (Geometric Silhouette) -->
      <g transform="translate(0, 250)">
        <!-- Harness/Chest Pack -->
        <path d="M-15,-5 L15,-5 L15,20 L-15,20 Z" fill="#263238" stroke="#000" stroke-width="1"/>
        
        <!-- Body Silhouette (Solid Geometry) -->
        <g fill="#0F172A">
          <!-- Head -->
          <circle cx="0" cy="-25" r="9" />
          <!-- Torso -->
          <path d="M-10,-15 L10,-15 L8,35 L-8,35 Z" />
          <!-- Arms (Reaching down for toggles) -->
          <path d="M-8,-5 L-25,20 L-20,25 L-8,15 Z" />
          <path d="M8,-5 L25,20 L20,25 L8,15 Z" />
          <!-- Legs (Hanging, relaxed) -->
          <path d="M-8,35 L-18,80 L-8,85 L-2,40 Z" />
          <path d="M8,35 L18,80 L8,85 L2,40 Z" />
        </g>
      </g>

    </g>

    <!-- Foreground Elements (Scale reference) -->
    <!-- Small silhouettes at bottom to emphasize height -->
    <g opacity="0.9">
       <path d="M-50,900 L100,720 L250,900 Z" fill="#0F172A" />
       <path d="M1100,900 L1300,750 L1500,900 Z" fill="#0F172A" />
    </g>

  </svg>
</div>

<script>
  // Minimal interaction logic for subtle parallax
  // Runs immediately, no gating
  
  const scene = document.getElementById('scene');
  const depthLayer = document.getElementById('depth-layer');
  const windLayer = document.getElementById('wind-layer');

  // Parallax on Mouse Move
  document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 2; // -1 to 1
    const y = (e.clientY / window.innerHeight - 0.5) * 2;

    // Move background mountains slightly opposite to mouse
    // Using transform directly on the SVG group
    depthLayer.style.transform = `translate(${x * -20}px, ${y * -10}px)`;

    // Move wind layer slightly more to simulate speed
    windLayer.style.transform = `translate(${x * 30}px, ${y * 15}px)`;
  });

</script>
</body>
</html>
