<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verticality // The Edge</title>
<style>
  :root {
    --font-main: 'Helvetica Neue', 'Segoe UI', 'Roboto', 'Arial', sans-serif;
    --color-sky-top: #5D778E;
    --color-sky-bot: #F0F4F8;
    --color-accent: #D93025;
    --color-text: #101820;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--color-sky-top);
    font-family: var(--font-main);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Layout Container */
  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* The SVG Scene */
  #scene {
    width: 100%;
    height: 100%;
    display: block;
    /* Subtle zoom out effect on load to emphasize scale */
    animation: cinematicZoom 20s ease-out forwards;
  }

  /* Typography Overlay */
  .title-overlay {
    position: absolute;
    bottom: 4rem;
    left: 4rem;
    z-index: 20;
    pointer-events: none;
    mix-blend-mode: multiply;
  }

  .title-label {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--color-accent);
    margin-bottom: 0.5rem;
    display: block;
    background: rgba(255,255,255,0.8);
    display: inline-block;
    padding: 4px 8px;
  }

  .title-main {
    font-size: clamp(3rem, 6vw, 6rem);
    line-height: 0.9;
    font-weight: 800;
    color: var(--color-text);
    letter-spacing: -0.03em;
    margin: 0;
    text-transform: uppercase;
    text-shadow: 0 10px 30px rgba(255,255,255,0.5);
  }

  /* Animations */
  @keyframes cinematicZoom {
    0% { transform: scale(1.05); }
    100% { transform: scale(1.0); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-15px) rotate(1deg); }
  }

  @keyframes windFlow {
    0% { transform: translateX(0) translateZ(0); opacity: 0; }
    10% { opacity: 0.5; }
    90% { opacity: 0.5; }
    100% { transform: translateX(-200px) translateZ(0); opacity: 0; }
  }

  @keyframes sway {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(2deg); }
  }

  /* Subject Classes */
  .parachute-system {
    /* Center the action in the upper frame */
    transform-origin: 50% 40%; 
    animation: float 6s ease-in-out infinite;
  }

  .canopy-group {
    transform-origin: 50% 100%;
    animation: sway 7s ease-in-out infinite;
  }

  .wind-streak {
    stroke: rgba(255, 255, 255, 0.6);
    stroke-linecap: round;
    animation: windFlow 4s linear infinite;
  }

  /* SVG Styles */
  .cliff-face {
    stroke-width: 1px;
    stroke-linejoin: round;
  }
  
  /* Haze Filter */
  .haze {
    filter: blur(3px);
  }

</style>
</head>
<body>

<div id="viewport">
  
  <!-- Typography Overlay (Refined Editorial Style) -->
  <div class="title-overlay">
    <span class="title-label">Verticality</span>
    <h1 class="title-main">The<br>Edge.</h1>
  </div>

  <!-- The Scene -->
  <svg id="scene" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Sky Gradient: Atmospheric Depth -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#3E5C76;stop-opacity:1" />
        <stop offset="30%" style="stop-color:#7A9EAD;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#E8EEF2;stop-opacity:1" />
      </linearGradient>

      <!-- Canopy Gradient: High Contrast Red -->
      <radialGradient id="canopyGrad" cx="50%" cy="20%" r="90%">
        <stop offset="0%" style="stop-color:#FF5252;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#D93025;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#8B0000;stop-opacity:1" />
      </radialGradient>

      <!-- Cliff Gradients: Geological Depth -->
      <linearGradient id="cliffLight" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#546E7A;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#37474F;stop-opacity:1" />
      </linearGradient>
      
      <linearGradient id="cliffDark" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#263238;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#101820;stop-opacity:1" />
      </linearGradient>
    </defs>

    <!-- Background Sky -->
    <rect width="1200" height="900" fill="url(#skyGrad)" />

    <!-- Distant Landscape (Atmospheric Haze) -->
    <g id="depth-layer" class="haze">
      <!-- Far Peaks -->
      <path fill="#A3B8CC" opacity="0.4" d="M0,600 L100,500 L250,550 L400,450 L600,520 L800,480 L1000,550 L1200,450 L1200,900 L0,900 Z" />
      <!-- Mid Peaks -->
      <path fill="#7A9EAD" opacity="0.6" d="M0,700 L150,620 L350,680 L550,580 L750,650 L950,580 L1200,650 L1200,900 L0,900 Z" />
    </g>

    <!-- Wind Streaks (Motion Cues) -->
    <g id="wind-layer">
      <path class="wind-streak" d="M300,100 L500,120" stroke-width="2" style="animation-delay: 0s;" />
      <path class="wind-streak" d="M150,300 L450,350" stroke-width="3" style="animation-delay: 1.2s;" />
      <path class="wind-streak" d="M600,200 L850,230" stroke-width="1.5" style="animation-delay: 0.5s;" />
      <path class="wind-streak" d="M200,500 L600,560" stroke-width="4" style="animation-delay: 2s;" />
      <path class="wind-streak" d="M800,400 L1100,450" stroke-width="2" style="animation-delay: 0.8s;" />
      <path class="wind-streak" d="M400,700 L800,750" stroke-width="3" style="animation-delay: 1.5s;" />
    </g>

    <!-- The Cliff (Vertical Monolith) -->
    <!-- Positioned on the right, jagged, high contrast -->
    <g id="cliff-geometry">
      <!-- Main Monolith Shape -->
      <path class="cliff-face" fill="url(#cliffDark)" stroke="#1a252f" d="M850,0 L920,50 L880,120 L950,200 L900,300 L980,400 L930,500 L1000,600 L950,700 L1050,800 L1200,900 L1200,0 Z" />
      
      <!-- Facets / Texture (Lighting from Left) -->
      <!-- Facet 1: Top Edge -->
      <path class="cliff-face" fill="url(#cliffLight)" d="M850,0 L920,50 L880,120 L820,80 Z" />
      <!-- Facet 2: Mid Overhang -->
      <path class="cliff-face" fill="#455A64" d="M880,120 L950,200 L900,300 L840,220 Z" />
      <!-- Facet 3: Lower Buttress -->
      <path class="cliff-face" fill="#37474F" d="M900,300 L980,400 L930,500 L860,420 Z" />
      
      <!-- Deep Crevices (Shadows) -->
      <path d="M880,120 L900,180 L860,220" fill="none" stroke="#101820" stroke-width="3" opacity="0.5"/>
      <path d="M900,300 L940,380 L900,450" fill="none" stroke="#101820" stroke-width="4" opacity="0.6"/>
      
      <!-- Rock Strata Lines -->
      <path d="M860,100 L940,180" stroke="#78909C" stroke-width="1" opacity="0.3" fill="none"/>
      <path d="M850,250 L960,350" stroke="#78909C" stroke-width="2" opacity="0.2" fill="none"/>
      <path d="M870,400 L980,500" stroke="#78909C" stroke-width="1" opacity="0.3" fill="none"/>
    </g>

    <!-- Parachute Subject Group -->
    <!-- Dominant element in upper frame, centered -->
    <g id="subject" class="parachute-system" transform="translate(600, 280)">
      
      <!-- The Canopy (Fully Inflated, Large Scale) -->
      <g class="canopy-group" transform="scale(1.6)">
        <!-- Main Dome Shape -->
        <path d="M-120,30 C-120,90 -70,120 0,120 C70,120 120,90 120,30 C120,-50 70,-80 0,-80 C-70,-80 -120,-50 -120,30 Z" fill="url(#canopyGrad)" />
        
        <!-- Canopy Ribs (Structure) -->
        <g stroke="#5A0000" stroke-width="2" fill="none" opacity="0.3">
          <path d="M0,-80 Q0,20 0,120" />
          <path d="M-60,-75 Q-30,20 -40,120" />
          <path d="M60,-75 Q30,20 40,120" />
          <path d="M-100,-40 Q-50,20 -80,120" />
          <path d="M100,-40 Q50,20 80,120" />
        </g>
        
        <!-- Top Highlight (Gloss) -->
        <path d="M-30,-70 C0,-90 30,-90 40,-70 C30,-50 0,-50 -30,-70 Z" fill="rgba(255,255,255,0.2)" />
      </g>

      <!-- Suspension Lines (Taut, White, Visible) -->
      <!-- Connecting canopy bottom (approx y:120) to harness (approx y:220) -->
      <g stroke="#FFFFFF" stroke-width="1.5" opacity="0.85" fill="none">
        <!-- Left Cluster -->
        <path d="M-192,192 L-30,260" />
        <path d="M-64,192 L-30,260" />
        <path d="M0,192 L-30,260" />
        <!-- Right Cluster -->
        <path d="M192,192 L30,260" />
        <path d="M64,192 L30,260" />
        <path d="M0,192 L30,260" />
      </g>

      <!-- The Human Figure (Geometric Silhouette) -->
      <g transform="translate(0, 260)">
        <!-- Harness/Chest Pack -->
        <path d="M-12,-5 L12,-5 L12,15 L-12,15 Z" fill="#263238" stroke="#101820" stroke-width="1"/>
        
        <!-- Body Silhouette (Solid Geometry) -->
        <g fill="#101820">
          <!-- Head -->
          <circle cx="0" cy="-20" r="8" />
          <!-- Torso -->
          <path d="M-8,-12 L8,-12 L6,30 L-6,30 Z" />
          <!-- Arms (Reaching down for toggles) -->
          <path d="M-6,-5 L-20,15 L-15,20 L-5,10 Z" />
          <path d="M6,-5 L20,15 L15,20 L5,10 Z" />
          <!-- Legs (Hanging, relaxed) -->
          <path d="M-6,30 L-15,70 L-5,75 L0,35 Z" />
          <path d="M6,30 L15,70 L5,75 L0,35 Z" />
        </g>
      </g>

    </g>

    <!-- Foreground Elements (Scale reference) -->
    <g opacity="0.8">
       <path d="M-50,900 L80,750 L200,900 Z" fill="#101820" />
       <path d="M1150,900 L1280,780 L1400,900 Z" fill="#101820" />
    </g>

  </svg>
</div>

<script>
  // Minimal interaction logic for subtle parallax
  // No UI gating, runs immediately
  
  const scene = document.getElementById('scene');
  const depthLayer = document.getElementById('depth-layer');
  const subject = document.getElementById('subject');
  const windLayer = document.getElementById('wind-layer');

  // Parallax on Mouse Move
  document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 2; // -1 to 1
    const y = (e.clientY / window.innerHeight - 0.5) * 2;

    // Move background mountains slightly opposite to mouse
    // Using transform directly on the SVG group
    depthLayer.style.transform = `translate(${x * -15}px, ${y * -10}px)`;

    // Move subject slightly with mouse (closer parallax)
    // We use a separate group transform to not conflict with CSS animation
    // Note: CSS animation handles the 'float'. We add a slight translation offset here.
    // Since we can't easily mix CSS keyframes and JS transforms without overwriting,
    // we will apply this offset to the container 'viewport' or use CSS variables.
    // Simplest approach: offset the wind layer.
    windLayer.style.transform = `translate(${x * 20}px, ${y * 10}px)`;
  });

</script>
</body>
</html>
