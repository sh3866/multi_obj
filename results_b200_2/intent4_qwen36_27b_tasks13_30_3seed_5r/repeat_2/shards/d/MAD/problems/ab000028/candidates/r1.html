<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verticality // The Edge</title>
<style>
  :root {
    --font-geo: 'Helvetica Neue', 'Segoe UI', 'Roboto', 'Arial', sans-serif;
    --color-text: #1a1a1a;
    --color-text-muted: #555;
    --color-accent: #E74C3C;
    --color-ui-bg: rgba(255, 255, 255, 0.85);
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #f0f2f5;
    font-family: var(--font-geo);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Layout Container */
  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  /* The SVG Scene */
  #scene {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* UI Overlay Grid */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
    display: grid;
    grid-template-columns: 80px 1fr 320px;
    grid-template-rows: 80px 1fr 80px;
    padding: 2rem;
    box-sizing: border-box;
  }

  /* --- Typography & Branding (Top Left) --- */
  .brand-group {
    grid-column: 1;
    grid-row: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: flex-start;
  }

  .brand-eyebrow {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--color-text-muted);
    margin-bottom: 8px;
    display: block;
  }

  .brand-headline {
    font-size: 32px;
    line-height: 1;
    font-weight: 800;
    color: var(--color-text);
    letter-spacing: -0.02em;
    margin: 0;
  }

  /* --- Data Readouts (Top Right) --- */
  .data-container {
    grid-column: 3;
    grid-row: 1;
    background: var(--color-ui-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 1.5rem;
    border-radius: 4px;
    border: 1px solid rgba(0,0,0,0.05);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
  }

  .data-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid rgba(0,0,0,0.05);
    padding-bottom: 4px;
  }
  
  .data-row:last-child {
    border-bottom: none;
  }

  .data-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--color-text-muted);
    font-weight: 600;
  }

  .data-value {
    font-size: 16px;
    font-weight: 700;
    color: var(--color-text);
    font-feature-settings: "tnum"; /* Tabular numbers */
  }

  .status-indicator {
    color: var(--color-accent);
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--color-accent);
    border-radius: 50%;
    margin-right: 6px;
    box-shadow: 0 0 0 2px rgba(231, 76, 60, 0.2);
  }

  /* --- Motion Controls (Bottom Left) --- */
  .controls-area {
    grid-column: 1;
    grid-row: 3;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    pointer-events: auto;
  }

  .control-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.1);
    background: var(--color-ui-bg);
    backdrop-filter: blur(4px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-text);
    transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .control-btn:hover {
    border-color: var(--color-text);
    transform: scale(1.05);
    background: #fff;
  }
  
  .control-btn svg {
    width: 20px;
    height: 20px;
    stroke-width: 2;
  }

  /* --- Animations --- */
  
  /* Gentle float for the whole group */
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
  }

  /* Sway for the canopy specifically */
  @keyframes sway {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(1.5deg); }
  }

  /* Wind lines movement */
  @keyframes windFlow {
    0% { transform: translateX(0) scaleX(1); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.6; }
    100% { transform: translateX(-150px) scaleX(0.8); opacity: 0; }
  }

  .parachute-system {
    /* Start at center-left roughly (x: 35%, y: 30%) relative to viewBox */
    /* ViewBox 1200x800 -> 35% = 420, 30% = 240 */
    transform-origin: center bottom;
    animation: float 5s ease-in-out infinite;
  }

  .canopy-top {
    transform-origin: center bottom;
    animation: sway 6s ease-in-out infinite;
  }

  .wind-streak {
    stroke: #fff;
    stroke-linecap: round;
    opacity: 0;
    animation: windFlow 4s linear infinite;
  }

  /* SVG Styles */
  .cliff-facet {
    stroke: none;
  }
  
  .cliff-highlight {
    fill: #607d8b; /* Slate Blue */
  }
  
  .cliff-shadow {
    fill: #37474f; /* Darker Slate */
  }
  
  .cliff-core {
    fill: #263238; /* Charcoal */
  }

  /* Depth layers */
  .mountain-far { fill: #dbe2e8; opacity: 0.6; filter: blur(4px); }
  .mountain-mid { fill: #cfd8dc; opacity: 0.8; filter: blur(2px); }

</style>
</head>
<body>

<div id="viewport">
  
  <!-- UI Overlay -->
  <div class="ui-layer">
    
    <!-- Branding Group -->
    <div class="brand-group">
      <span class="brand-eyebrow">Verticality</span>
      <h1 class="brand-headline">THE<br>EDGE.</h1>
    </div>

    <!-- Data Readouts -->
    <div class="data-container">
      <div class="data-row">
        <span class="data-label">Altitude</span>
        <span class="data-value">2,450m</span>
      </div>
      <div class="data-row">
        <span class="data-label">Wind Speed</span>
        <span class="data-value">14.2 km/h</span>
      </div>
      <div class="data-row">
        <span class="data-label">Status</span>
        <span class="data-value"><span class="status-indicator"></span>SAFE DESCENT</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls-area">
      <button class="control-btn" id="windToggle" title="Toggle Wind">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2" />
        </svg>
      </button>
      <button class="control-btn" id="zoomToggle" title="Zoom View">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
          <line x1="11" y1="8" x2="11" y2="14" />
          <line x1="8" y1="11" x2="14" y2="11" />
        </svg>
      </button>
    </div>

  </div>

  <!-- The Scene -->
  <svg id="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Sky Gradient: Light Blue to White -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#A9CCE3;stop-opacity:1" />
        <stop offset="40%" style="stop-color:#E6F1F8;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
      </linearGradient>

      <!-- Canopy Gradient -->
      <radialGradient id="canopyGrad" cx="50%" cy="10%" r="90%">
        <stop offset="0%" style="stop-color:#FF5252;stop-opacity:1" />
        <stop offset="60%" style="stop-color:#E53935;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#B71C1C;stop-opacity:1" />
      </radialGradient>

      <!-- Facet Highlight Gradient -->
      <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#78909C;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#546E7A;stop-opacity:1" />
      </linearGradient>
    </defs>

    <!-- Background Sky -->
    <rect width="1200" height="800" fill="url(#skyGrad)" />

    <!-- Distant Mountains (Atmospheric Depth) -->
    <g id="depth-layer">
      <!-- Far Layer -->
      <path class="mountain-far" d="M0,650 L150,550 L350,620 L600,480 L850,600 L1100,520 L1200,580 L1200,800 L0,800 Z" />
      <!-- Mid Layer -->
      <path class="mountain-mid" d="M0,700 L200,620 L450,720 L750,580 L1000,680 L1200,600 L1200,800 L0,800 Z" />
    </g>

    <!-- Wind Streaks (Motion Cues) -->
    <g id="wind-layer">
      <!-- Tapered lines flowing top-left to bottom-right -->
      <path class="wind-streak" d="M400,100 L600,150" stroke-width="2" style="animation-delay: 0s; animation-duration: 3s;" />
      <path class="wind-streak" d="M200,300 L500,380" stroke-width="3" style="animation-delay: 1s; animation-duration: 3.5s;" />
      <path class="wind-streak" d="M500,400 L800,450" stroke-width="1" style="animation-delay: 0.5s; animation-duration: 2.8s;" />
      <path class="wind-streak" d="M100,500 L450,550" stroke-width="4" style="animation-delay: 1.5s; animation-duration: 4s;" />
      <path class="wind-streak" d="M700,200 L950,220" stroke-width="2" style="animation-delay: 0.2s; animation-duration: 3.2s;" />
      <path class="wind-streak" d="M800,600 L1100,650" stroke-width="3" style="animation-delay: 2s; animation-duration: 3s;" />
    </g>

    <!-- The Cliff (Massive, Faceted, Geological) -->
    <!-- Positioned on the right to create negative space on the left for the parachutist -->
    <g id="cliff-geometry">
      <!-- Facet 1: Top Left Highlight (Slate Blue) -->
      <path class="cliff-facet" fill="url(#facetLight)" d="M650,0 L950,0 L800,250 L600,150 Z" />
      <!-- Facet 2: Top Right Shadow -->
      <path class="cliff-facet" fill="#455A64" d="M950,0 L1200,0 L1200,250 L800,250 Z" />
      
      <!-- Facet 3: Mid Left (Main Face) -->
      <path class="cliff-facet" fill="#546E7A" d="M600,150 L800,250 L700,500 L500,400 Z" />
      <!-- Facet 4: Mid Right (Recessed) -->
      <path class="cliff-facet" fill="#37474F" d="M800,250 L1200,250 L1200,600 L700,500 Z" />
      
      <!-- Facet 5: Bottom Left (Dark) -->
      <path class="cliff-facet" fill="#263238" d="M500,400 L700,500 L600,800 L400,800 Z" />
      <!-- Facet 6: Bottom Right (Deep Shadow) -->
      <path class="cliff-facet" fill="#1C2833" d="M700,500 L1200,600 L1200,800 L600,800 Z" />
      
      <!-- Detail Lines (Strata) -->
      <path d="M650,0 L600,150" stroke="#78909C" stroke-width="1" fill="none" opacity="0.3"/>
      <path d="M500,400 L700,500 L1200,600" stroke="#546E7A" stroke-width="2" fill="none" opacity="0.2"/>
      <path d="M400,800 L600,800" stroke="#37474F" stroke-width="2" fill="none" opacity="0.5"/>
    </g>

    <!-- Parachute Subject Group -->
    <!-- Scaled up 200%, positioned at x:35%, y:30% -->
    <g id="subject" class="parachute-system" transform="translate(420, 240)">
      
      <!-- The Canopy (Fully Inflated) -->
      <!-- Scaled up from original ~200px width to ~400px width -->
      <g class="canopy-top" transform="scale(1.8)">
        <path d="M-100,20 C-100,80 -60,100 0,100 C60,100 100,80 100,20 C100,-40 60,-60 0,-60 C-60,-60 -100,-40 -100,20 Z" fill="url(#canopyGrad)" />
        
        <!-- Canopy Ribs (Structure) -->
        <g stroke="#8E0000" stroke-width="2" fill="none" opacity="0.4">
          <path d="M0,-60 L0,100" />
          <path d="M-50,-55 L-25,100" />
          <path d="M50,-55 L25,100" />
          <path d="M-80,-30 L-40,100" />
          <path d="M80,-30 L40,100" />
        </g>
      </g>

      <!-- Suspension Lines (Taut) -->
      <!-- Connecting canopy bottom to harness -->
      <g stroke="#FFF" stroke-width="1.5" opacity="0.9" fill="none">
        <!-- Left Cluster -->
        <path d="M-180,140 L-20,240" />
        <path d="M-90,180 L-20,240" />
        <path d="M0,180 L-20,240" />
        <!-- Right Cluster -->
        <path d="M180,140 L20,240" />
        <path d="M90,180 L20,240" />
        <path d="M0,180 L20,240" />
      </g>

      <!-- The Human Figure (Harness & Body) -->
      <g transform="translate(0, 240)">
        <!-- Harness Pack -->
        <path d="M-15,0 L15,0 L15,20 L-15,20 Z" fill="#333" />
        
        <!-- Body Silhouette -->
        <g stroke="#1a1a1a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <!-- Head -->
          <circle cx="0" cy="-15" r="8" fill="#1a1a1a" stroke="none" />
          <!-- Torso -->
          <path d="M0,0 L0,40" />
          <!-- Arms (Reaching for toggles) -->
          <path d="M0,5 L-15,25" />
          <path d="M0,5 L15,25" />
          <!-- Legs (Hanging) -->
          <path d="M0,40 L-10,70" />
          <path d="M0,40 L10,70" />
        </g>
      </g>

    </g>

    <!-- Foreground Elements (Depth) -->
    <g opacity="0.9">
       <path d="M-50,800 L100,650 L250,800 Z" fill="#263238" opacity="0.6" />
       <path d="M1100,800 L1250,700 L1350,800 Z" fill="#263238" opacity="0.6" />
    </g>

  </svg>
</div>

<script>
  // Interaction Logic
  
  const scene = document.getElementById('scene');
  const windLayer = document.getElementById('wind-layer');
  const windStreaks = document.querySelectorAll('.wind-streak');
  const windToggle = document.getElementById('windToggle');
  const zoomToggle = document.getElementById('zoomToggle');
  
  let isHighWind = false;
  let isZoomed = false;

  // Toggle Wind Effect
  windToggle.addEventListener('click', () => {
    isHighWind = !isHighWind;
    
    if (isHighWind) {
      // Intensify wind
      windLayer.style.opacity = "1";
      windStreaks.forEach(streak => {
        const currentDuration = parseFloat(getComputedStyle(streak).animationDuration);
        streak.style.animationDuration = (currentDuration * 0.4) + 's'; // Faster
        streak.style.opacity = "0.9"; // More visible
      });
      windToggle.style.borderColor = 'var(--color-accent)';
      windToggle.style.color = 'var(--color-accent)';
    } else {
      // Reset wind
      windLayer.style.opacity = "0.6";
      windStreaks.forEach(streak => {
        // Reset to roughly original durations (randomized slightly)
        const base = 3 + Math.random();
        streak.style.animationDuration = base + 's';
        streak.style.opacity = ""; 
      });
      windToggle.style.borderColor = 'rgba(0,0,0,0.1)';
      windToggle.style.color = 'var(--color-text)';
    }
  });

  // Toggle Zoom / Scale
  zoomToggle.addEventListener('click', () => {
    isZoomed = !isZoomed;
    
    // Apply transform to the SVG scene to zoom into the subject area
    // Subject is roughly at x:420, y:240. 
    // We translate to center that, then scale up.
    if (isZoomed) {
      scene.style.transition = "transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1)";
      // Center the view roughly on the parachutist
      scene.style.transformOrigin = "35% 30%";
      scene.style.transform = "scale(1.5)";
    } else {
      scene.style.transformOrigin = "center center";
      scene.style.transform = "scale(1)";
    }
  });

  // Subtle Parallax Effect on Mouse Move
  // Adds life to the scene without breaking the layout
  document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 2; // -1 to 1
    const y = (e.clientY / window.innerHeight - 0.5) * 2;

    // Move background mountains slightly opposite to mouse
    const depthLayer = document.getElementById('depth-layer');
    depthLayer.style.transform = `translate(${x * -10}px, ${y * -5}px)`;

    // Move cliff slightly less
    const cliff = document.getElementById('cliff-geometry');
    cliff.style.transform = `translate(${x * -5}px, ${y * -2}px)`;
    
    // Move subject slightly with mouse (parallax)
    const subject = document.getElementById('subject');
    // We append this to the existing transform logic by using CSS variables or just offset
    // Since the animation handles the float, we apply a slight offset here
    subject.style.transform = `translate(${x * 5}px, ${y * 5}px)`; 
  });

</script>
</body>
</html>
