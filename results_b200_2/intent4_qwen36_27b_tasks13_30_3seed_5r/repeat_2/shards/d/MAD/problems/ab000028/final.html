<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Descent // The Edge - Revised</title>
<style>
  :root {
    --bg-dark: #0f172a;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-dark);
    font-family: system-ui, -apple-system, sans-serif;
  }

  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: block;
    background-color: var(--bg-dark);
  }

  #scene {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Animations */
  @keyframes float {
    0%, 100% { transform: translate(0px, 0px); }
    50% { transform: translate(-8px, 12px); }
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-2deg) scale(1); }
    50% { transform: rotate(2deg) scale(1.02); }
  }

  @keyframes windShear {
    0% { transform: translateX(100px) skewX(-30deg); opacity: 0; }
    20% { opacity: 0.7; }
    80% { opacity: 0.7; }
    100% { transform: translateX(-600px) skewX(-30deg); opacity: 0; }
  }

  /* Classes */
  .parachute-system {
    /* Centered Left-Middle Third */
    transform-origin: center;
    animation: float 5s ease-in-out infinite;
  }

  .canopy-group {
    transform-origin: 50% 100%;
    animation: sway 6s ease-in-out infinite;
  }

  .wind-streak {
    fill: rgba(255, 255, 255, 0.4);
    filter: blur(3px);
    animation: windShear 3s linear infinite;
    will-change: transform, opacity;
  }
  
  .wind-streak.slow { animation-duration: 5s; opacity: 0.3; }
  .wind-streak.fast { animation-duration: 2s; opacity: 0.6; }
  .wind-streak.thick { fill: rgba(255, 255, 255, 0.2); filter: blur(8px); }

  /* Depth Layers */
  .depth-layer {
    will-change: transform;
    transition: transform 0.1s linear;
  }
</style>
</head>
<body>

<div id="viewport">
  <svg id="scene" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- 2. Atmospheric Depth: Cool Slate Blues -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
        <stop offset="40%" style="stop-color:#5D7285;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#8BA1B5;stop-opacity:1" />
      </linearGradient>

      <!-- 3. Unified Lighting: Canopy (Top-Left Light) -->
      <radialGradient id="canopyGrad" cx="30%" cy="30%" r="80%">
        <stop offset="0%" style="stop-color:#FF8A65;stop-opacity:1" /> <!-- Highlight -->
        <stop offset="35%" style="stop-color:#F4511E;stop-opacity:1" /> <!-- Midtone -->
        <stop offset="75%" style="stop-color:#BF360C;stop-opacity:1" /> <!-- Shadow -->
        <stop offset="100%" style="stop-color:#870000;stop-opacity:1" /> <!-- Deep Shadow -->
      </radialGradient>

      <!-- 3. Unified Lighting: Cliff (Slate/Steel Blue, Cool) -->
      <linearGradient id="cliffFront" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#37474F;stop-opacity:1" /> <!-- Lit Edge -->
        <stop offset="40%" style="stop-color:#263238;stop-opacity:1" /> <!-- Midtone -->
        <stop offset="100%" style="stop-color:#101518;stop-opacity:1" /> <!-- Deep Shadow -->
      </linearGradient>
      
      <!-- Cliff Texture: Desaturated Slate -->
      <linearGradient id="cliffTexture" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#455A64;stop-opacity:0.4" />
        <stop offset="100%" style="stop-color:#000000;stop-opacity:0.8" />
      </linearGradient>

      <!-- Rim Light Filter -->
      <filter id="rimLight" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="-3" dy="-3" stdDeviation="4" flood-color="#81D4FA" flood-opacity="0.3" />
      </filter>

      <!-- Blur for distant mountains -->
      <filter id="atmosBlur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" />
      </filter>
    </defs>

    <!-- 1. Background Sky -->
    <rect width="1200" height="900" fill="url(#skyGrad)" />

    <!-- 2. Distant Landscape (Semi-transparent Mountain Silhouettes) -->
    <g id="depth-layer" class="depth-layer" filter="url(#atmosBlur)">
      <!-- Layer 1: Furthest (Hazy Blue) -->
      <path fill="#607D8B" opacity="0.5" d="M0,750 L250,650 L500,720 L800,600 L1200,750 L1200,900 L0,900 Z" />
      <!-- Layer 2: Mid-ground (Darker Slate) -->
      <path fill="#455A64" opacity="0.7" d="M0,820 L200,750 L450,800 L750,700 L1000,850 L1200,780 L1200,900 L0,900 Z" />
      <!-- Layer 3: Closer (Deep Blue-Grey) -->
      <path fill="#37474F" opacity="0.9" d="M0,900 L150,850 L400,880 L600,830 L900,900 L1200,850 L1200,900 Z" />
    </g>

    <!-- 3. The Cliff (Right Side - Receding but Framing) -->
    <g id="cliff-mesh">
      <!-- Main Mass - Cool Slate -->
      <path fill="url(#cliffFront)" d="M1200,0 L1050,0 L1080,120 L1020,280 L1060,420 L980,580 L1100,720 L1020,900 L1200,900 Z" />
      
      <!-- Rock Layers / Strata (Geological Texture) -->
      <path fill="url(#cliffTexture)" d="M1050,0 L1200,0 L1200,200 L1080,120 L1050,150 Z" opacity="0.6"/>
      <path fill="url(#cliffTexture)" d="M1060,420 L1200,380 L1200,620 L980,580 Z" opacity="0.5"/>
      <path fill="url(#cliffTexture)" d="M1100,720 L1200,680 L1200,900 L1020,900 Z" opacity="0.7"/>

      <!-- Deep Shadows / Crevices -->
      <path fill="#000000" opacity="0.4" d="M1020,280 L1060,420 L1000,380 Z" />
      <path fill="#000000" opacity="0.5" d="M980,580 L1100,720 L1040,660 Z" />

      <!-- 3. Rim Light on Cliff Edge (Windward) -->
      <path fill="none" stroke="#90A4AE" stroke-width="2" opacity="0.3" d="M1050,0 L1080,120 L1020,280 L1060,420 L980,580 L1100,720 L1020,900" />
    </g>

    <!-- 5. Dynamic Motion Cues (Tapered, Motion-Blurred Shapes) -->
    <!-- Sweeping from Right (Cliff) to Left (Figure) -->
    <g id="wind-layer" class="depth-layer">
      <!-- Fast, thin streaks -->
      <path class="wind-streak fast" d="M1100,300 L850,400 L840,402 L1090,302 Z" style="animation-delay: 0.1s;" />
      <path class="wind-streak fast" d="M1150,550 L800,700 L790,703 L1140,553 Z" style="animation-delay: 0.8s;" />
      <path class="wind-streak fast" d="M1000,150 L700,250 L690,252 L990,152 Z" style="animation-delay: 1.5s;" />
      
      <!-- Slow, thick, atmospheric streaks -->
      <path class="wind-streak slow thick" d="M1200,400 L600,600 L580,620 L1180,420 Z" style="animation-delay: 0.4s;" />
      <path class="wind-streak slow thick" d="M1100,100 L500,300 L480,320 L1080,120 Z" style="animation-delay: 2.2s;" />
      <path class="wind-streak slow thick" d="M1200,700 L700,800 L680,820 L1180,720 Z" style="animation-delay: 1.0s;" />
    </g>

    <!-- 4. Parachute Subject (Centered in Left-Middle Third: x~350, y~350) -->
    <g id="subject" class="parachute-system" transform="translate(350, 350)">
      
      <!-- The Canopy -->
      <g class="canopy-group">
        <!-- Main Dome -->
        <path d="M-200,20 C-200,160 -100,200 0,200 C100,200 200,160 200,20 C200,-120 100,-160 0,-160 C-100,-160 -200,-120 -200,20 Z" fill="url(#canopyGrad)" />
        
        <!-- 4. Structural Shading (Ribs) -->
        <g stroke="#870000" stroke-width="2" fill="none" opacity="0.4">
          <path d="M0,-160 Q0,20 0,200" />
          <path d="M-70,-140 Q-35,20 -50,200" />
          <path d="M70,-140 Q35,20 50,200" />
          <path d="M-140,-60 Q-70,20 -100,200" />
          <path d="M140,-60 Q70,20 100,200" />
        </g>
        
        <!-- 3. Rim Light on Canopy (Top Left) -->
        <path d="M-120,-140 C-50,-160 50,-160 120,-140" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.3" filter="url(#rimLight)"/>
      </g>

      <!-- 4. Suspension Lines (Thicker, Slight Curve for Tension) -->
      <g stroke="#FFFFFF" stroke-width="2.5" opacity="0.9" fill="none" stroke-linecap="round">
        <!-- Left Cluster -->
        <path d="M-200,20 Q-60,150 -40,420" />
        <path d="M-140,160 Q-50,180 -40,420" />
        <path d="M-70,190 Q-20,200 -40,420" />
        <!-- Right Cluster -->
        <path d="M200,20 Q60,150 40,420" />
        <path d="M140,160 Q50,180 40,420" />
        <path d="M70,190 Q20,200 40,420" />
      </g>

      <!-- The Human Figure (High-Contrast Silhouette with Gear) -->
      <g transform="translate(0, 420)" filter="url(#rimLight)">
        <!-- Harness -->
        <path d="M-20,-10 L20,-10 L20,30 L-20,30 Z" fill="#1A1F2C" />
        <rect x="-28" y="5" width="10" height="20" fill="#000000" />
        <rect x="18" y="5" width="10" height="20" fill="#000000" />
        
        <!-- Body Silhouette -->
        <g fill="#0B1018">
          <!-- Head -->
          <circle cx="0" cy="-30" r="12" />
          <!-- Torso -->
          <path d="M-14,-18 L14,-18 L12,45 L-12,45 Z" />
          <!-- Arms (Reaching down/holding toggles) -->
          <path d="M-12,-5 L-30,25 L-25,30 L-10,20 Z" />
          <path d="M12,-5 L30,25 L25,30 L10,20 Z" />
          <!-- Legs (Hanging) -->
          <path d="M-10,45 L-22,100 L-10,105 L-2,50 Z" />
          <path d="M10,45 L22,100 L10,105 L2,50 Z" />
        </g>
      </g>

    </g>

  </svg>
</div>

<script>
  // Minimal parallax logic
  // Runs immediately, no gating
  
  const depthLayer = document.getElementById('depth-layer');
  const windLayer = document.getElementById('wind-layer');
  const subject = document.getElementById('subject');

  document.addEventListener('mousemove', (e) => {
    // Normalize mouse position -1 to 1
    const x = (e.clientX / window.innerWidth - 0.5) * 2; 
    const y = (e.clientY / window.innerHeight - 0.5) * 2;

    // Move background mountains opposite to mouse (Depth)
    if(depthLayer) {
      depthLayer.style.transform = `translate(${x * -20}px, ${y * -10}px)`;
    }

    // Move wind faster in direction of mouse (Speed)
    if(windLayer) {
      windLayer.style.transform = `translate(${x * 40}px, ${y * 20}px)`;
    }
    
    // Move subject slightly for scale (Parallax Foreground)
    if(subject) {
        // We apply this to a wrapper or modify the transform carefully to not break animation
        // Since the animation handles the transform, we can't easily mix CSS transforms here without JS animation frame.
        // Keeping subject static relative to frame for stability of the float animation.
    }
  });
</script>
</body>
</html>
