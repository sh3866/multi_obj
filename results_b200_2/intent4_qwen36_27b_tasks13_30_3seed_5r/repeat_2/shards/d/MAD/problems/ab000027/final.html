<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trifolium pratense | Botanical Study</title>
<style>
  :root {
    /* Typography */
    --font-serif: 'Georgia', 'Times New Roman', serif;
    --font-mono: 'Courier New', Courier, monospace;
    
    /* Palette: Warm Paper & Ink */
    --bg-color: #F7F5F0; 
    --ink-primary: #1A241A;
    --ink-faint: #7A857A;
    --ink-accent: #4A5B4A;

    /* Palette: Botanical */
    --grid-color: #E0E0E0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-color);
    color: var(--ink-primary);
    font-family: var(--font-serif);
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Layout Container */
  .study-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr;
  }

  /* Background Grid (Field Note Aesthetic) */
  .bg-grid {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.4;
    z-index: 0;
    pointer-events: none;
  }

  /* Typography Layer */
  .typography-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 4rem 5vw;
    z-index: 10;
  }

  /* Header: Top Left */
  .header-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    align-self: flex-start;
    border-left: 3px solid var(--ink-accent);
    padding-left: 1.5rem;
  }

  .figure-label {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .scientific-name {
    font-size: 3rem;
    line-height: 1;
    font-weight: 400;
    color: var(--ink-primary);
    letter-spacing: -0.02em;
    font-style: italic;
  }

  .scientific-sub {
    font-family: var(--font-mono);
    font-style: normal;
    font-size: 0.85rem;
    color: var(--ink-faint);
    margin-top: 0.2rem;
    letter-spacing: 0.05em;
  }

  /* Footer: Bottom Right (Diagonal Balance) */
  .footer-note {
    align-self: flex-end;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.5rem;
    text-align: right;
  }

  .data-block {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-faint);
    line-height: 1.6;
    max-width: 220px;
    border-right: 1px solid var(--ink-faint);
    padding-right: 1rem;
    opacity: 0.8;
  }

  /* Visual Specimen */
  .visual-container {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  svg.specimen-svg {
    width: 100%;
    height: 100%;
    max-width: 800px;
    overflow: visible;
    /* Subtle organic movement */
    animation: sway 18s ease-in-out infinite alternate;
    transform-origin: 50% 85%;
  }

  @keyframes sway {
    0% { transform: rotate(-1deg) skewX(-0.5deg); }
    100% { transform: rotate(1.5deg) skewX(0.5deg); }
  }

  /* SVG Styles */
  .vein-structure {
    fill: none;
    stroke: #1F331F;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  
  .vein-main { stroke-width: 2.5; opacity: 0.35; }
  .vein-secondary { stroke-width: 1.5; opacity: 0.25; }
  .vein-fine { stroke-width: 0.5; opacity: 0.15; }

  .stem-structure {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .measurement-line {
    stroke: var(--ink-faint);
    stroke-width: 0.5;
    stroke-dasharray: 2 4;
    fill: none;
    opacity: 0.6;
  }

  /* Responsive Adjustments */
  @media (max-width: 768px) {
    .typography-layer { padding: 2rem; }
    .scientific-name { font-size: 2rem; }
    .footer-note { align-self: flex-start; margin-top: auto; text-align: left; }
    .data-block { border-right: none; border-top: 1px solid var(--ink-faint); padding-right: 0; padding-top: 0.5rem; }
    .header-group { border-left: none; padding-left: 0; border-bottom: 2px solid var(--ink-accent); padding-bottom: 1rem; }
  }
</style>
</head>
<body>

  <div class="study-container">
    
    <!-- Background Grid -->
    <div class="bg-grid"></div>

    <!-- Typography Layer -->
    <div class="typography-layer">
      <div class="header-group">
        <div class="figure-label">Fig. 01 — Trifolium</div>
        <h1 class="scientific-name">Trifolium</h1>
        <div class="scientific-sub">pratense</div>
      </div>

      <div class="footer-note">
        <div class="data-block">
          <strong>SPECIMEN DATA</strong><br>
          HABITAT: Cultivated Fields<br>
          DATE: Oct 14, 2023<br>
          COLLECTOR: J. Doe<br>
          SCALE: 1:1
        </div>
      </div>
    </div>

    <!-- Visual Specimen -->
    <div class="visual-container">
      <svg class="specimen-svg" viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
        <defs>
          
          <!-- 
             GRADIENTS: 
             Rich, volumetric greens. 
             Deep forest at base/veins, bright lime at edges/highlights.
          -->
          <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2E462E" /> <!-- Deep Base -->
            <stop offset="40%" stop-color="#4A7A4A" /> <!-- Mid Body -->
            <stop offset="80%" stop-color="#659F65" /> <!-- Bright Body -->
            <stop offset="100%" stop-color="#3A5F3A" /> <!-- Darker Tip -->
          </linearGradient>

          <!-- Radial gradient for subtle "light" on the leaf surface -->
          <radialGradient id="leaf-shine" cx="40%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#A3D9A3" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#A3D9A3" stop-opacity="0"/>
          </radialGradient>

          <!-- Stem Gradient -->
          <linearGradient id="stem-grad" x1="0%" y1="100%" x2="0%" y2="0%">
             <stop offset="0%" stop-color="#364B36" />
             <stop offset="100%" stop-color="#5A7A5A" />
          </linearGradient>

          <!-- 
             CORDATE LEAF GEOMETRY
             Perfect heart shape with rounded lobes.
          -->
          <path id="cordate-leaf" d="
            M 0,0 
            C -8,-12 -22,-18 -32,-8 
            C -55,-25 -55,-70 -25,-90 
            C -5,-105 5,-105 25,-90 
            C 55,-70 55,-25 32,-8 
            C 22,-18 8,-12 0,0 
          " />

          <!-- Serration Pattern (Teeth) -->
          <!-- A small sawtooth path to be stamped along the edges -->
          <path id="serration-unit" d="M 0,0 L 3,-4 L 6,0 L 9,-4 L 12,0" fill="none" />

          <!-- Clip path for veins -->
          <clipPath id="leaf-clip">
             <use href="#cordate-leaf" />
          </clipPath>

        </defs>

        <!-- 1. STEM & ANATOMY -->
        <g id="stem-group">
          <!-- Main Stalk (Thick, organic curve) -->
          <path d="M 300,800 C 290,650 320,550 300,400" fill="none" stroke="url(#stem-grad)" stroke-width="10" stroke-linecap="round"/>
          
          <!-- Stem Texture (Subtle vertical striations) -->
          <path d="M 300,800 C 290,650 320,550 300,400" fill="none" stroke="#2E462E" stroke-width="1" stroke-dasharray="4 15" opacity="0.15" transform="translate(-2,0)"/>
          <path d="M 300,800 C 290,650 320,550 300,400" fill="none" stroke="#2E462E" stroke-width="1" stroke-dasharray="4 15" opacity="0.15" transform="translate(2,0)"/>

          <!-- Petioles (Connecting stalks) -->
          <!-- Left Petiole -->
          <path d="M 302,420 C 240,390 190,320 150,290" fill="none" stroke="url(#stem-grad)" stroke-width="6" stroke-linecap="round"/>
          <!-- Right Petiole -->
          <path d="M 298,420 C 360,390 410,320 450,290" fill="none" stroke="url(#stem-grad)" stroke-width="6" stroke-linecap="round"/>
          <!-- Top Petiole -->
          <path d="M 300,400 C 305,340 300,290 300,240" fill="none" stroke="url(#stem-grad)" stroke-width="7" stroke-linecap="round"/>
          
          <!-- Stipules (Leafy structures at base of petioles) -->
          <path d="M 295,420 C 280,410 270,430 285,440 C 295,430 295,420 295,420" fill="#5A7A5A" opacity="0.9"/>
          <path d="M 305,420 C 320,410 330,430 315,440 C 305,430 305,420 305,420" fill="#5A7A5A" opacity="0.9"/>
        </g>

        <!-- 2. THE LEAVES -->
        <g id="leaves-group">
          
          <!-- LEFT LEAFLET -->
          <g transform="translate(150, 290) rotate(-40) scale(0.9)">
            <!-- Base Shape -->
            <use href="#cordate-leaf" fill="url(#leaf-grad)" stroke="#2E462E" stroke-width="0.5"/>
            <!-- Shine Overlay -->
            <use href="#cordate-leaf" fill="url(#leaf-shine)"/>
            
            <!-- Serrations (Applied manually to outer curves for precision) -->
            <!-- Left Curve -->
            <use href="#serration-unit" x="-20" y="-50" transform="rotate(-40) scale(1.5)" stroke="#2E462E" stroke-width="1.5" fill="none"/>
            <use href="#serration-unit" x="-40" y="-30" transform="rotate(-20) scale(1.5)" stroke="#2E462E" stroke-width="1.5" fill="none"/>
            <!-- Right Curve -->
            <use href="#serration-unit" x="-5" y="-85" transform="rotate(10) scale(1.5)" stroke="#2E462E" stroke-width="1.5" fill="none"/>
            <use href="#serration-unit" x="20" y="-60" transform="rotate(30) scale(1.5)" stroke="#2E462E" stroke-width="1.5" fill="none"/>

            <!-- Venation (Clipped to leaf shape) -->
            <g clip-path="url(#leaf-clip)">
              <g class="vein-structure">
                <!-- Midrib -->
                <path d="M 0,0 Q -5,-30 -10,-95" class="vein-main" />
                <!-- Primary Branches -->
                <path d="M -5,-20 Q -30,-30 -45,-20" class="vein-secondary" />
                <path d="M -8,-40 Q -30,-50 -40,-40" class="vein-secondary" />
                <path d="M -10,-60 Q -30,-70 -35,-65" class="vein-secondary" />
                <path d="M -5,-20 Q 20,-30 35,-20" class="vein-secondary" />
                <path d="M -8,-40 Q 20,-50 30,-40" class="vein-secondary" />
                <path d="M -10,-60 Q 15,-70 25,-65" class="vein-secondary" />
                <!-- Reticulation (Fine mesh) -->
                <path d="M -20,-25 Q -25,-20 -15,-15" class="vein-fine" />
                <path d="M 10,-25 Q 15,-20 5,-15" class="vein-fine" />
                <path d="M -25,-45 Q -30,-40 -20,-35" class="vein-fine" />
              </g>
            </g>
          </g>

          <!-- RIGHT LEAFLET -->
          <g transform="translate(450, 290) rotate(40) scale(0.9)">
            <!-- Base Shape -->
            <use href="#cordate-leaf" fill="url(#leaf-grad)" stroke="#2E462E" stroke-width="0.5"/>
            <use href="#cordate-leaf" fill="url(#leaf-shine)"/>
            
            <!-- Serrations -->
            <use href="#serration-unit" x="20" y="-50" transform="rotate(40) scale(1.5)" stroke="#2E462E" stroke-width="1.5" fill="none"/>
            <use href="#serration-unit" x="40" y="-30" transform="rotate(20) scale(1.5)" stroke="#2E462E" stroke-width="1.5" fill="none"/>
            <use href="#serration-unit" x="5" y="-85" transform="rotate(-10) scale(1.5)" stroke="#2E462E" stroke-width="1.5" fill="none"/>
            <use href="#serration-unit" x="-20" y="-60" transform="rotate(-30) scale(1.5)" stroke="#2E462E" stroke-width="1.5" fill="none"/>

            <!-- Venation -->
            <g clip-path="url(#leaf-clip)">
              <g class="vein-structure">
                <path d="M 0,0 Q 5,-30 10,-95" class="vein-main" />
                <path d="M 5,-20 Q 30,-30 45,-20" class="vein-secondary" />
                <path d="M 8,-40 Q 30,-50 40,-40" class="vein-secondary" />
                <path d="M 10,-60 Q 30,-70 35,-65" class="vein-secondary" />
                <path d="M 5,-20 Q -20,-30 -35,-20" class="vein-secondary" />
                <path d="M 8,-40 Q -20,-50 -30,-40" class="vein-secondary" />
                <path d="M 10,-60 Q -15,-70 -25,-65" class="vein-secondary" />
                <path d="M 20,-25 Q 25,-20 15,-15" class="vein-fine" />
                <path d="M -10,-25 Q -15,-20 -5,-15" class="vein-fine" />
              </g>
            </g>
          </g>

          <!-- TOP LEAFLET (Dominant) -->
          <g transform="translate(300, 240) rotate(0) scale(1.2)">
            <!-- Base Shape -->
            <use href="#cordate-leaf" fill="url(#leaf-grad)" stroke="#2E462E" stroke-width="0.5"/>
            <use href="#cordate-leaf" fill="url(#leaf-shine)"/>
            
            <!-- Serrations -->
            <use href="#serration-unit" x="-30" y="-60" transform="rotate(-30) scale(1.5)" stroke="#2E462E" stroke-width="1.5" fill="none"/>
            <use href="#serration-unit" x="-45" y="-30" transform="rotate(-10) scale(1.5)" stroke="#2E462E" stroke-width="1.5" fill="none"/>
            <use href="#serration-unit" x="-10" y="-90" transform="rotate(0) scale(1.5)" stroke="#2E462E" stroke-width="1.5" fill="none"/>
            <use href="#serration-unit" x="45" y="-30" transform="rotate(10) scale(1.5)" stroke="#2E462E" stroke-width="1.5" fill="none"/>
            <use href="#serration-unit" x="30" y="-60" transform="rotate(30) scale(1.5)" stroke="#2E462E" stroke-width="1.5" fill="none"/>

            <!-- Venation (Detailed) -->
            <g clip-path="url(#leaf-clip)">
              <g class="vein-structure">
                <path d="M 0,0 Q 0,-40 0,-95" class="vein-main" />
                <path d="M 0,-20 Q -25,-30 -45,-20" class="vein-secondary" />
                <path d="M 0,-45 Q -25,-55 -40,-45" class="vein-secondary" />
                <path d="M 0,-70 Q -20,-80 -30,-75" class="vein-secondary" />
                
                <path d="M 0,-20 Q 25,-30 45,-20" class="vein-secondary" />
                <path d="M 0,-45 Q 25,-55 40,-45" class="vein-secondary" />
                <path d="M 0,-70 Q 20,-80 30,-75" class="vein-secondary" />

                <!-- Fine mesh -->
                <path d="M -20,-25 Q -25,-20 -15,-15" class="vein-fine" />
                <path d="M 20,-25 Q 25,-20 15,-15" class="vein-fine" />
                <path d="M -25,-50 Q -30,-45 -20,-40" class="vein-fine" />
                <path d="M 25,-50 Q 30,-45 20,-40" class="vein-fine" />
                <path d="M -15,-75 Q -20,-70 -10,-65" class="vein-fine" />
                <path d="M 15,-75 Q 20,-70 10,-65" class="vein-fine" />
              </g>
            </g>
          </g>

        </g>

        <!-- 3. ANNOTATIONS (Polished & Restrained) -->
        <g id="annotations">
          
          <!-- Measurement Lines (Clean, framing the plant) -->
          <!-- Height Marker -->
          <line x1="80" y1="240" x2="80" y2="600" class="measurement-line" />
          <line x1="75" y1="240" x2="85" y2="240" class="measurement-line" />
          <line x1="75" y1="600" x2="85" y2="600" class="measurement-line" />
          <text x="70" y="420" font-family="var(--font-mono)" font-size="9" fill="var(--ink-faint)" text-anchor="middle" transform="rotate(-90, 70, 420)" letter-spacing="1">150mm</text>

          <!-- Width Marker -->
          <line x1="150" y1="680" x2="450" y2="680" class="measurement-line" />
          <line x1="150" y1="675" x2="150" y2="685" class="measurement-line" />
          <line x1="450" y1="675" x2="450" y2="685" class="measurement-line" />
          <text x="300" y="695" font-family="var(--font-mono)" font-size="9" fill="var(--ink-faint)" text-anchor="middle" letter-spacing="1">120mm</text>

          <!-- Annotation: Denticles (Clean, solid line) -->
          <g transform="translate(0,0)">
             <!-- Solid line from label to feature -->
             <path d="M 360,180 Q 400,160 420,180" class="measurement-line" stroke="var(--ink-faint)" stroke-width="1" stroke-dasharray="none" opacity="0.5"/>
             <circle cx="360" cy="180" r="1.5" fill="var(--ink-faint)" />
             <text x="425" y="184" font-family="var(--font-mono)" font-size="9" fill="var(--ink-faint)" letter-spacing="0.05em">denticles</text>
          </g>
          
          <!-- Annotation: Node -->
          <g transform="translate(0,0)">
             <path d="M 300,420 Q 360,460 390,460" class="measurement-line" stroke="var(--ink-faint)" stroke-width="1" stroke-dasharray="none" opacity="0.5"/>
             <circle cx="300" cy="420" r="1.5" fill="var(--ink-faint)" />
             <text x="395" y="464" font-family="var(--font-mono)" font-size="9" fill="var(--ink-faint)" letter-spacing="0.05em">petiole node</text>
          </g>
        </g>

      </svg>
    </div>
  </div>

</body>
</html>
