<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trifolium pratense | Botanical Study</title>
<style>
  :root {
    /* Typography */
    --font-serif: 'Georgia', 'Times New Roman', serif;
    --font-mono: 'Courier New', Courier, monospace;
    
    /* Palette: Stone & Ink (Refined) */
    --bg-color: #F4F5F0; 
    --ink-primary: #2C3E2C;
    --ink-faint: #6B7C6B;
    --ink-accent: #4A6B4A;

    /* Palette: Botanical (Gradients defined in SVG) */
    --stem-color: #4B664B;
    --stem-dark: #364B36;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-color);
    color: var(--ink-primary);
    font-family: var(--font-serif);
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Layout Container */
  .study-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr;
  }

  /* Typography Layer */
  .typography-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 3.5rem 5vw;
    z-index: 10;
  }

  /* Header: Top Left */
  .header-group {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    align-self: flex-start;
  }

  .figure-label {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink-faint);
    border-bottom: 1px solid var(--ink-faint);
    padding-bottom: 6px;
    width: fit-content;
  }

  .scientific-name {
    font-size: 2.4rem;
    line-height: 1.1;
    font-weight: normal;
    color: var(--ink-primary);
    letter-spacing: -0.03em;
    font-style: italic;
  }

  .scientific-sub {
    font-family: var(--font-mono);
    font-style: normal;
    font-size: 0.9rem;
    color: var(--ink-faint);
    margin-top: 0.4rem;
    letter-spacing: 0.05em;
  }

  /* Footer: Bottom Left (Shifted for diagonal balance) */
  .footer-note {
    align-self: flex-end;
    display: flex;
    flex-direction: column;
    align-items: flex-start; /* Changed from flex-end */
    gap: 1rem;
  }

  .data-block {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--ink-faint);
    line-height: 1.6;
    text-align: left; /* Changed from right */
    opacity: 0.9;
    max-width: 200px;
    border-left: 2px solid var(--ink-faint);
    padding-left: 12px;
  }

  /* Visual Specimen */
  .visual-container {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  svg.specimen-svg {
    width: 100%;
    height: 100%;
    max-width: 900px;
    overflow: visible;
    /* Subtle organic movement */
    animation: sway 16s ease-in-out infinite alternate;
    transform-origin: 50% 90%;
  }

  @keyframes sway {
    0% { transform: rotate(-1.5deg) skewX(-0.5deg); }
    100% { transform: rotate(1.5deg) skewX(0.5deg); }
  }

  /* SVG Styles */
  .vein-structure {
    fill: none;
    stroke: #2F4F2F;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  
  .vein-main { stroke-width: 2.5; opacity: 0.4; }
  .vein-secondary { stroke-width: 1.2; opacity: 0.3; }
  .vein-fine { stroke-width: 0.5; opacity: 0.2; }

  .stem-structure {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .scale-bar {
    stroke: var(--ink-faint);
    stroke-width: 1;
  }

  .annotation-line {
    stroke: var(--ink-faint);
    stroke-width: 0.75;
    fill: none;
    opacity: 0.7;
  }

  /* Responsive Adjustments */
  @media (max-width: 768px) {
    .typography-layer { padding: 2rem; }
    .scientific-name { font-size: 1.8rem; }
    .footer-note { align-self: flex-start; margin-top: auto; }
    .data-block { border-left: none; padding-left: 0; border-top: 1px solid var(--ink-faint); padding-top: 10px; }
  }
</style>
</head>
<body>

  <div class="study-container">
    
    <!-- Typography Layer -->
    <div class="typography-layer">
      <div class="header-group">
        <div class="figure-label">Fig. 1 — Specimen</div>
        <h1 class="scientific-name">Trifolium</h1>
        <div class="scientific-sub">pratense</div>
      </div>

      <div class="footer-note">
        <div class="data-block">
          <strong>Specimen Data</strong><br>
          Habitat: Cultivated fields<br>
          Date: Oct 14, 2023<br>
          Collector: J. Doe<br>
          Scale: 1:1
        </div>
      </div>
    </div>

    <!-- Visual Specimen -->
    <div class="visual-container">
      <svg class="specimen-svg" viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg">
        <defs>
          
          <!-- Organic Serration: Smooth scallops instead of jagged teeth -->
          <path id="organic-serration" d="M0,0 C5,-3 10,0 15,0 C20,-3 25,0 30,0 C35,-3 40,0 45,0 C50,-3 55,0 60,0 C65,-3 70,0 75,0" />

          <!-- 
             GRADIENTS: To create volume and translucency.
             Leaf Gradient: Darker at base (shadow), lighter at mid-vein, dark green at edges.
          -->
          <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#3A5F3A" /> <!-- Base Shadow -->
            <stop offset="30%" stop-color="#658F65" /> <!-- Mid Body -->
            <stop offset="70%" stop-color="#527A52" /> <!-- Lower Body -->
            <stop offset="100%" stop-color="#2E462E" /> <!-- Tip Shadow -->
          </linearGradient>

          <!-- Radial gradient for subtle "light" on the leaf surface -->
          <radialGradient id="leaf-shine" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#8CB38C" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#8CB38C" stop-opacity="0"/>
          </radialGradient>

          <!-- 
             CORDATE LEAF GEOMETRY
             Explicitly drawn to create the "heart" indentation at the base.
          -->
          <path id="cordate-leaf" d="
            M 0,0 
            C -10,-10 -25,-15 -35,-5  /* Left Lobe Start */
            C -60,-20 -60,-60 -30,-80 /* Left Curve to Tip */
            C -10,-95 10,-95 30,-80   /* Tip Curve */
            C 60,-60 60,-20 35,-5     /* Right Curve to Base */
            C 25,-15 10,-10 0,0       /* Right Lobe End (Indentation) */
          " />

          <!-- Clip path for veins -->
          <clipPath id="leaf-clip">
             <use href="#cordate-leaf" />
          </clipPath>

          <!-- Stem Gradient for tapering look -->
          <linearGradient id="stem-grad" x1="0%" y1="100%" x2="0%" y2="0%">
             <stop offset="0%" stop-color="#364B36" />
             <stop offset="100%" stop-color="#5A7A5A" />
          </linearGradient>
        </defs>

        <!-- 1. STEM & ANATOMY -->
        <g id="stem-group">
          <!-- Main Stalk (Thick, organic curve) -->
          <path d="M 300,700 C 290,550 315,450 300,300" fill="none" stroke="url(#stem-grad)" stroke-width="8" stroke-linecap="round"/>
          
          <!-- Stem Texture (Veins) -->
          <path d="M 300,700 C 290,550 315,450 300,300" fill="none" stroke="#2E462E" stroke-width="1" stroke-dasharray="8 12" opacity="0.2"/>

          <!-- Petioles (Connecting stalks) -->
          <!-- Left Petiole -->
          <path d="M 302,340 C 250,310 200,240 160,210" fill="none" stroke="url(#stem-grad)" stroke-width="5" stroke-linecap="round"/>
          <!-- Right Petiole -->
          <path d="M 298,340 C 350,310 400,240 440,210" fill="none" stroke="url(#stem-grad)" stroke-width="5" stroke-linecap="round"/>
          <!-- Top Petiole -->
          <path d="M 300,300 C 305,240 300,190 300,140" fill="none" stroke="url(#stem-grad)" stroke-width="6" stroke-linecap="round"/>
          
          <!-- Stipules (Leafy structures at base of petioles) -->
          <path d="M 295,340 C 280,330 270,350 285,360 C 295,350 295,340 295,340" fill="#5A7A5A" opacity="0.8"/>
          <path d="M 305,340 C 320,330 330,350 315,360 C 305,350 305,340 305,340" fill="#5A7A5A" opacity="0.8"/>
        </g>

        <!-- 2. THE LEAVES -->
        <g id="leaves-group">
          
          <!-- LEFT LEAFLET -->
          <!-- Positioned at end of left petiole, rotated outward -->
          <g transform="translate(160, 210) rotate(-35) scale(0.85)">
            <!-- Base Shape -->
            <use href="#cordate-leaf" fill="url(#leaf-grad)" stroke="#2E462E" stroke-width="1"/>
            <!-- Shine Overlay -->
            <use href="#cordate-leaf" fill="url(#leaf-shine)"/>
            
            <!-- Serrations (Refined Denticles) -->
            <!-- Applied to the outer curves -->
            <use href="#organic-serration" x="-50" y="-55" transform="rotate(-45) scale(1.2)" stroke="#2E462E" stroke-width="1.5" fill="none"/>
            <use href="#organic-serration" x="-10" y="-85" transform="rotate(10) scale(1.2)" stroke="#2E462E" stroke-width="1.5" fill="none"/>

            <!-- Venation (Clipped to leaf shape) -->
            <g clip-path="url(#leaf-clip)">
              <g class="vein-structure">
                <!-- Midrib -->
                <path d="M 0,0 Q -5,-30 -10,-90" class="vein-main" />
                <!-- Primary Branches -->
                <path d="M -5,-20 Q -30,-30 -45,-20" class="vein-secondary" />
                <path d="M -8,-40 Q -30,-50 -40,-40" class="vein-secondary" />
                <path d="M -10,-60 Q -30,-70 -35,-65" class="vein-secondary" />
                <path d="M -5,-20 Q 20,-30 35,-20" class="vein-secondary" />
                <path d="M -8,-40 Q 20,-50 30,-40" class="vein-secondary" />
                <path d="M -10,-60 Q 15,-70 25,-65" class="vein-secondary" />
                <!-- Reticulation (Fine mesh) -->
                <path d="M -20,-25 Q -25,-20 -15,-15" class="vein-fine" />
                <path d="M 10,-25 Q 15,-20 5,-15" class="vein-fine" />
                <path d="M -25,-45 Q -30,-40 -20,-35" class="vein-fine" />
              </g>
            </g>
          </g>

          <!-- RIGHT LEAFLET -->
          <g transform="translate(440, 210) rotate(35) scale(0.85)">
            <!-- Base Shape -->
            <use href="#cordate-leaf" fill="url(#leaf-grad)" stroke="#2E462E" stroke-width="1"/>
            <use href="#cordate-leaf" fill="url(#leaf-shine)"/>
            
            <!-- Serrations -->
            <use href="#organic-serration" x="10" y="-85" transform="rotate(-10) scale(1.2)" stroke="#2E462E" stroke-width="1.5" fill="none"/>
            <use href="#organic-serration" x="50" y="-55" transform="rotate(45) scale(1.2)" stroke="#2E462E" stroke-width="1.5" fill="none"/>

            <!-- Venation -->
            <g clip-path="url(#leaf-clip)">
              <g class="vein-structure">
                <path d="M 0,0 Q 5,-30 10,-90" class="vein-main" />
                <path d="M 5,-20 Q 30,-30 45,-20" class="vein-secondary" />
                <path d="M 8,-40 Q 30,-50 40,-40" class="vein-secondary" />
                <path d="M 10,-60 Q 30,-70 35,-65" class="vein-secondary" />
                <path d="M 5,-20 Q -20,-30 -35,-20" class="vein-secondary" />
                <path d="M 8,-40 Q -20,-50 -30,-40" class="vein-secondary" />
                <path d="M 10,-60 Q -15,-70 -25,-65" class="vein-secondary" />
                <path d="M 20,-25 Q 25,-20 15,-15" class="vein-fine" />
                <path d="M -10,-25 Q -15,-20 -5,-15" class="vein-fine" />
              </g>
            </g>
          </g>

          <!-- TOP LEAFLET (Dominant) -->
          <!-- Larger scale, straight up -->
          <g transform="translate(300, 140) rotate(0) scale(1.15)">
            <!-- Base Shape -->
            <use href="#cordate-leaf" fill="url(#leaf-grad)" stroke="#2E462E" stroke-width="1"/>
            <use href="#cordate-leaf" fill="url(#leaf-shine)"/>
            
            <!-- Serrations -->
            <use href="#organic-serration" x="-45" y="-60" transform="rotate(-30) scale(1.2)" stroke="#2E462E" stroke-width="1.5" fill="none"/>
            <use href="#organic-serration" x="-10" y="-90" transform="rotate(0) scale(1.2)" stroke="#2E462E" stroke-width="1.5" fill="none"/>
            <use href="#organic-serration" x="35" y="-60" transform="rotate(30) scale(1.2)" stroke="#2E462E" stroke-width="1.5" fill="none"/>

            <!-- Venation (Detailed) -->
            <g clip-path="url(#leaf-clip)">
              <g class="vein-structure">
                <path d="M 0,0 Q 0,-40 0,-90" class="vein-main" />
                <path d="M 0,-20 Q -25,-30 -45,-20" class="vein-secondary" />
                <path d="M 0,-45 Q -25,-55 -40,-45" class="vein-secondary" />
                <path d="M 0,-70 Q -20,-80 -30,-75" class="vein-secondary" />
                
                <path d="M 0,-20 Q 25,-30 45,-20" class="vein-secondary" />
                <path d="M 0,-45 Q 25,-55 40,-45" class="vein-secondary" />
                <path d="M 0,-70 Q 20,-80 30,-75" class="vein-secondary" />

                <!-- Fine mesh -->
                <path d="M -20,-25 Q -25,-20 -15,-15" class="vein-fine" />
                <path d="M 20,-25 Q 25,-20 15,-15" class="vein-fine" />
                <path d="M -25,-50 Q -30,-45 -20,-40" class="vein-fine" />
                <path d="M 25,-50 Q 30,-45 20,-40" class="vein-fine" />
                <path d="M -15,-75 Q -20,-70 -10,-65" class="vein-fine" />
                <path d="M 15,-75 Q 20,-70 10,-65" class="vein-fine" />
              </g>
            </g>
          </g>

        </g>

        <!-- 3. ANNOTATIONS (Polished) -->
        <g id="annotations">
          <!-- Scale Bar (Bottom Left area) -->
          <g transform="translate(100, 620)">
            <line x1="0" y1="0" x2="40" y2="0" class="scale-bar" stroke-width="1.5" />
            <line x1="0" y1="-3" x2="0" y2="3" class="scale-bar" stroke-width="1.5" />
            <line x1="40" y1="-3" x2="40" y2="3" class="scale-bar" stroke-width="1.5" />
            <text x="20" y="14" font-family="var(--font-mono)" font-size="9" fill="var(--ink-faint)" text-anchor="middle" letter-spacing="1">10mm</text>
          </g>

          <!-- Annotation: Denticles (Clean, solid line) -->
          <g transform="translate(0,0)">
             <!-- Solid line from label to feature -->
             <path d="M 360,110 Q 380,110 400,120" class="annotation-line" />
             <circle cx="360" cy="110" r="1.5" fill="var(--ink-faint)" />
             <text x="405" y="124" font-family="var(--font-mono)" font-size="9" fill="var(--ink-faint)" letter-spacing="0.05em">denticles</text>
          </g>
          
          <!-- Annotation: Node -->
          <g transform="translate(0,0)">
             <path d="M 300,340 Q 340,360 370,360" class="annotation-line" />
             <circle cx="300" cy="340" r="1.5" fill="var(--ink-faint)" />
             <text x="375" y="364" font-family="var(--font-mono)" font-size="9" fill="var(--ink-faint)" letter-spacing="0.05em">petiole node</text>
          </g>
        </g>

      </svg>
    </div>
  </div>

</body>
</html>
