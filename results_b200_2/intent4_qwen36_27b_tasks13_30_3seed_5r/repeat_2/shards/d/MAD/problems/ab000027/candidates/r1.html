<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trifolium pratense | Botanical Study</title>
<style>
  :root {
    /* Typography */
    --font-serif: 'Georgia', 'Times New Roman', serif;
    --font-mono: 'Courier New', Courier, monospace;
    
    /* Palette: Stone & Ink */
    --bg-color: #F4F5F0; 
    --ink-primary: #2C2C2C;
    --ink-faint: #666666;
    --ink-accent: #A63737; /* Muted Rust */

    /* Palette: Botanical (Layered) */
    --leaf-dark: #2F522F;
    --leaf-mid: #4A7A4A;
    --leaf-light: #85B085;
    --leaf-highlight: #D0E0D0;
    --stem-color: #3D5C3D;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-color);
    color: var(--ink-primary);
    font-family: var(--font-serif);
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Layout Container */
  .study-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr; /* Split layout */
    grid-template-rows: 1fr;
  }

  /* Left Column: Typography */
  .typography-column {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 4rem 5vw;
    z-index: 2;
  }

  .header-group {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .figure-label {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    border-bottom: 1px solid var(--ink-faint);
    padding-bottom: 0.5rem;
    width: fit-content;
  }

  .scientific-name {
    font-size: 3.5rem;
    line-height: 0.9;
    font-weight: normal;
    color: var(--ink-primary);
    margin-left: -0.2rem; /* Optical adjustment */
  }

  .scientific-sub {
    font-style: italic;
    font-size: 1.2rem;
    color: var(--ink-faint);
    margin-top: 0.5rem;
  }

  .footer-quote {
    font-size: 1rem;
    line-height: 1.6;
    max-width: 240px;
    color: var(--ink-faint);
    font-style: italic;
    border-left: 2px solid var(--ink-accent);
    padding-left: 1rem;
  }

  /* Right Column: Visual Specimen */
  .visual-column {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* SVG Styling */
  svg.specimen-svg {
    width: 80%;
    height: 80%;
    max-width: 600px;
    overflow: visible;
    /* Subtle organic movement */
    animation: sway 8s ease-in-out infinite alternate;
    transform-origin: bottom center;
  }

  @keyframes sway {
    0% { transform: rotate(-1deg) skewX(0deg); }
    100% { transform: rotate(1deg) skewX(1deg); }
  }

  /* SVG Element Styles */
  .stem-path {
    fill: none;
    stroke: var(--stem-color);
    stroke-width: 14;
    stroke-linecap: round;
    filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.15));
  }
  
  .stem-detail {
    fill: none;
    stroke: rgba(255,255,255,0.2);
    stroke-width: 2;
    stroke-dasharray: 2 4;
  }

  .leaflet-base {
    stroke: var(--leaf-dark);
    stroke-width: 1.5;
    stroke-linejoin: round;
  }

  .vein-main {
    fill: none;
    stroke: var(--leaf-dark);
    stroke-width: 1.5;
    opacity: 0.6;
    stroke-linecap: round;
  }

  .vein-branch {
    fill: none;
    stroke: var(--leaf-dark);
    stroke-width: 1;
    opacity: 0.4;
    stroke-linecap: round;
  }

  .highlight-layer {
    fill: rgba(255, 255, 255, 0.15);
    mix-blend-mode: overlay;
  }

  /* Responsive Adjustments */
  @media (max-width: 768px) {
    .study-container {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
    }
    .typography-column {
      padding: 2rem;
      height: auto;
      order: 1;
    }
    .visual-column {
      height: 60vh;
      order: 2;
    }
    .scientific-name { font-size: 2.5rem; }
    .footer-quote { display: none; } /* Hide quote on mobile to save space */
  }
</style>
</head>
<body>

  <div class="study-container">
    
    <!-- Left: Typography -->
    <div class="typography-column">
      <div class="header-group">
        <div class="figure-label">Fig. 1</div>
        <h1 class="scientific-name">Trifolium</h1>
        <div class="scientific-sub">pratense</div>
      </div>

      <div class="footer-quote">
        "The humble clover, rich in nitrogen,<br>
        sustains the soil it rests upon."
      </div>
    </div>

    <!-- Right: The Specimen -->
    <div class="visual-column">
      <svg class="specimen-svg" viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Organic Gradients -->
          <linearGradient id="stemGrad" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#2A402A" />
            <stop offset="40%" stop-color="#4A7A4A" />
            <stop offset="100%" stop-color="#6B9E6B" />
          </linearGradient>

          <radialGradient id="leafGradMain" cx="50%" cy="50%" r="60%" fx="50%" fy="40%">
            <stop offset="0%" stop-color="#85B085" />
            <stop offset="60%" stop-color="#4A7A4A" />
            <stop offset="100%" stop-color="#2F522F" />
          </radialGradient>

          <radialGradient id="leafGradSide" cx="50%" cy="50%" r="60%">
            <stop offset="0%" stop-color="#6B9E6B" />
            <stop offset="70%" stop-color="#3D5C3D" />
            <stop offset="100%" stop-color="#1E331E" />
          </radialGradient>

          <!-- Soft Shadow for Leaves -->
          <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.2"/>
          </filter>
        </defs>

        <!-- 1. The Stem (Organic Curve) -->
        <g id="stem-group">
          <!-- Main Stem -->
          <path d="M 250,580 Q 230,400 250,250" fill="none" stroke="url(#stemGrad)" stroke-width="14" stroke-linecap="round"/>
          <!-- Stem Highlight/Texture -->
          <path d="M 250,580 Q 230,400 250,250" class="stem-detail" transform="translate(-2,0)"/>
          
          <!-- Petioles (Leaves connectors) -->
          <path d="M 248,320 Q 180,280 150,180" fill="none" stroke="url(#stemGrad)" stroke-width="8" stroke-linecap="round"/>
          <path d="M 252,320 Q 320,280 350,180" fill="none" stroke="url(#stemGrad)" stroke-width="8" stroke-linecap="round"/>
          <path d="M 250,250 Q 255,200 250,120" fill="none" stroke="url(#stemGrad)" stroke-width="8" stroke-linecap="round"/>
        </g>

        <!-- 2. The Leaves (Organic, Asymmetrical) -->
        <g id="leaves-group" filter="url(#leafShadow)">
          
          <!-- Left Leaflet -->
          <g transform="translate(150, 180) rotate(-35) scale(0.85)">
            <!-- Base Shape -->
            <path d="M 0,0 
                     C -30,-80 -120,-90 -110,-10 
                     C -100,80 -30,90 0,0 Z" 
                  fill="url(#leafGradSide)" class="leaflet-base"/>
            
            <!-- Venation -->
            <g>
              <path d="M 0,0 Q -30,-10 -100,-5" class="vein-main"/>
              <!-- Pinnate branches left -->
              <path d="M -20,-10 Q -40,-40 -50,-50" class="vein-branch"/>
              <path d="M -40,-8 Q -70,-30 -80,-40" class="vein-branch"/>
              <!-- Pinnate branches right -->
              <path d="M -20,-5 Q -40,20 -50,30" class="vein-branch"/>
              <path d="M -50,-2 Q -70,20 -80,30" class="vein-branch"/>
            </g>

            <!-- Soft Serrations (Indentations) -->
            <g fill="url(#leafGradSide)">
              <path d="M -30,-70 L -38,-78 L -42,-68 Z" />
              <path d="M -60,-85 L -70,-95 L -75,-80 Z" />
              <path d="M -90,-60 L -100,-70 L -102,-55 Z" />
            </g>
          </g>

          <!-- Right Leaflet -->
          <g transform="translate(350, 180) rotate(35) scale(0.85)">
            <!-- Base Shape (Mirrored Logic) -->
            <path d="M 0,0 
                     C 30,-80 120,-90 110,-10 
                     C 100,80 30,90 0,0 Z" 
                  fill="url(#leafGradSide)" class="leaflet-base"/>
            
            <!-- Venation -->
            <g>
              <path d="M 0,0 Q 30,-10 100,-5" class="vein-main"/>
              <!-- Pinnate branches left -->
              <path d="M 20,-10 Q 40,-40 50,-50" class="vein-branch"/>
              <path d="M 40,-8 Q 70,-30 80,-40" class="vein-branch"/>
              <!-- Pinnate branches right -->
              <path d="M 20,-5 Q 40,20 50,30" class="vein-branch"/>
              <path d="M 50,-2 Q 70,20 80,30" class="vein-branch"/>
            </g>

            <!-- Soft Serrations -->
            <g fill="url(#leafGradSide)">
              <path d="M 30,-70 L 38,-78 L 42,-68 Z" />
              <path d="M 60,-85 L 70,-95 L 75,-80 Z" />
              <path d="M 90,-60 L 100,-70 L 102,-55 Z" />
            </g>
          </g>

          <!-- Top Leaflet (Dominant) -->
          <g transform="translate(250, 120) rotate(5) scale(1.1)">
            <!-- Base Shape -->
            <path d="M 0,0 
                     C -40,-100 -130,-110 -120,-15 
                     C -110,90 -40,100 0,0 Z" 
                  fill="url(#leafGradMain)" class="leaflet-base"/>

            <!-- Venation -->
            <g>
              <path d="M 0,0 Q -10,-30 -100,-40" class="vein-main"/>
              <!-- Pinnate branches left -->
              <path d="M -25,-25 Q -50,-60 -60,-75" class="vein-branch"/>
              <path d="M -50,-30 Q -80,-50 -90,-60" class="vein-branch"/>
              <path d="M -75,-35 Q -100,-45 -110,-50" class="vein-branch"/>
              <!-- Pinnate branches right -->
              <path d="M -20,-15 Q -40,20 -50,30" class="vein-branch"/>
              <path d="M -45,-20 Q -70,10 -80,20" class="vein-branch"/>
              <path d="M -70,-25 Q -90,0 -100,10" class="vein-branch"/>
            </g>

            <!-- Highlight/Texture Layer -->
            <path d="M -20,-50 Q -50,-80 -80,-60 Q -50,-30 -20,-50 Z" class="highlight-layer"/>

            <!-- Soft Serrations -->
            <g fill="url(#leafGradMain)">
              <path d="M -40,-90 L -50,-100 L -55,-85 Z" />
              <path d="M -80,-100 L -95,-110 L -95,-95 Z" />
              <path d="M -110,-60 L -125,-70 L -120,-55 Z" />
            </g>
          </g>

        </g>
      </svg>
    </div>
  </div>

</body>
</html>
