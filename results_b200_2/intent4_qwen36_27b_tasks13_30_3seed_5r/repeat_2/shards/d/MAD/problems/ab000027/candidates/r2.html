<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trifolium pratense | Botanical Study</title>
<style>
  :root {
    /* Typography */
    --font-serif: 'Georgia', 'Times New Roman', serif;
    --font-mono: 'Courier New', Courier, monospace;
    
    /* Palette: Stone & Ink (Refined) */
    --bg-color: #F4F5F0; 
    --ink-primary: #2C2C2C;
    --ink-faint: #666666;
    --ink-accent: #4A7A4A; /* Muted Green for accent lines */

    /* Palette: Botanical (Strict Flat System) */
    --leaf-base: #5C8A5C;
    --leaf-shadow: #3D663D;
    --leaf-highlight: #85B085;
    --stem-color: #3D5C3D;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-color);
    color: var(--ink-primary);
    font-family: var(--font-serif);
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Layout Container */
  .study-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr;
  }

  /* Typography Layer */
  .typography-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* Let clicks pass through to canvas/svg if needed */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 3rem 4vw;
    z-index: 10;
  }

  /* Header: Top Left */
  .header-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    align-self: flex-start;
  }

  .figure-label {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-faint);
    opacity: 0.8;
  }

  .scientific-name {
    font-size: 2rem; /* Reduced scale */
    line-height: 0.9;
    font-weight: normal;
    color: var(--ink-primary);
    letter-spacing: -0.02em;
  }

  .scientific-sub {
    font-style: italic;
    font-size: 1.1rem;
    color: var(--ink-faint);
    margin-top: 0.2rem;
  }

  /* Footer: Bottom Right (Anchoring) */
  .footer-note {
    align-self: flex-end;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1.5rem;
  }

  .quote-block {
    font-size: 0.95rem;
    line-height: 1.6;
    max-width: 280px;
    color: var(--ink-faint);
    font-style: italic;
    text-align: right;
    border-right: 2px solid var(--ink-accent); /* Changed to Green */
    padding-right: 1rem;
  }

  /* Visual Specimen */
  .visual-container {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  svg.specimen-svg {
    width: 100%;
    height: 100%;
    max-width: 900px;
    overflow: visible;
    /* Subtle organic movement */
    animation: sway 12s ease-in-out infinite alternate;
    transform-origin: 50% 90%;
  }

  @keyframes sway {
    0% { transform: rotate(-1.5deg) skewX(0deg); }
    100% { transform: rotate(1.5deg) skewX(0.5deg); }
  }

  /* SVG Styles */
  .leaf-shape {
    stroke: var(--leaf-shadow);
    stroke-width: 1;
    stroke-linejoin: round;
  }
  
  .vein-structure {
    fill: none;
    stroke: var(--leaf-shadow);
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.6;
  }
  
  .vein-fine {
    fill: none;
    stroke: var(--leaf-shadow);
    stroke-width: 0.75;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.4;
  }

  .mottle {
    opacity: 0.4;
    mix-blend-mode: multiply;
  }

  .scale-bar {
    stroke: var(--ink-faint);
    stroke-width: 1;
  }

  /* Responsive Adjustments */
  @media (max-width: 768px) {
    .typography-layer {
      padding: 2rem;
    }
    .scientific-name { font-size: 1.5rem; }
    .quote-block { max-width: 200px; font-size: 0.85rem; }
    .footer-note { align-self: center; align-items: center; text-align: center; }
    .quote-block { border-right: none; border-bottom: 1px solid var(--ink-accent); padding-bottom: 0.5rem; padding-right: 0; }
  }
</style>
</head>
<body>

  <div class="study-container">
    
    <!-- Typography Layer (Absolute positioning over canvas) -->
    <div class="typography-layer">
      <div class="header-group">
        <div class="figure-label">Fig. 1 — Specimen</div>
        <h1 class="scientific-name">Trifolium</h1>
        <div class="scientific-sub">pratense</div>
      </div>

      <div class="footer-note">
        <div class="quote-block">
          "The humble clover, rich in nitrogen,<br>
          sustains the soil it rests upon."
        </div>
      </div>
    </div>

    <!-- Visual Specimen -->
    <div class="visual-container">
      <svg class="specimen-svg" viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- 
            RECONSTRUCT GEOMETRY: 
            Define a base leaf shape that is Cordate (Heart-shaped) with serrations 
            integrated directly into the path.
          -->
          <path id="cordate-leaf" d="
            M 0,0 
            C 10,-15 25,-20 35,-15 
            C 45,-10 55,5 60,15
            C 65,25 75,20 80,30
            C 85,40 90,35 95,45
            C 100,55 95,65 90,75
            C 85,85 70,90 55,85
            C 40,80 25,85 15,75
            C 5,65 -5,60 -15,50
            C -25,30 -35,10 -30,-10
            C -25,-30 -10,-15 0,0 Z
          " />
        </defs>

        <!-- 1. The Stem (Organic Taper) -->
        <g id="stem-group">
          <!-- Main Stalk: Tapered, curved, flat color -->
          <path d="M 300,680 C 290,500 310,350 300,200" fill="none" stroke="var(--stem-color)" stroke-width="8" stroke-linecap="round"/>
          
          <!-- Petioles (Connectors) -->
          <!-- Left Petiole -->
          <path d="M 298,350 C 250,320 200,250 160,220" fill="none" stroke="var(--stem-color)" stroke-width="5" stroke-linecap="round"/>
          <!-- Right Petiole -->
          <path d="M 302,350 C 350,320 400,250 440,220" fill="none" stroke="var(--stem-color)" stroke-width="5" stroke-linecap="round"/>
          <!-- Top Petiole -->
          <path d="M 300,200 C 302,150 300,100 300,50" fill="none" stroke="var(--stem-color)" stroke-width="6" stroke-linecap="round"/>
        </g>

        <!-- 2. The Leaves (Flat Organic Style) -->
        <g id="leaves-group">
          
          <!-- LEFT LEAFLET -->
          <g transform="translate(160, 220) rotate(-45) scale(0.9)">
            <!-- Base Fill -->
            <use href="#cordate-leaf" fill="var(--leaf-base)" class="leaf-shape"/>
            
            <!-- Shadow Mottling (Natural Variation) -->
            <circle cx="40" cy="40" r="30" fill="var(--leaf-shadow)" class="mottle"/>
            <circle cx="80" cy="60" r="20" fill="var(--leaf-shadow)" class="mottle"/>
            <!-- Highlight Mottling -->
            <circle cx="20" cy="20" r="25" fill="var(--leaf-highlight)" class="mottle" opacity="0.3"/>

            <!-- Venation (Pinnate Structure) -->
            <g class="vein-structure">
              <!-- Midrib -->
              <path d="M 0,0 Q 40,10 95,45" />
              <!-- Primary Branches -->
              <path d="M 20,5 Q 10,30 -10,20" />
              <path d="M 20,5 Q 40,-20 60,-10" />
              <path d="M 40,10 Q 30,40 10,35" />
              <path d="M 40,10 Q 60,-10 80,0" />
              <path d="M 60,15 Q 50,45 30,45" />
              <path d="M 60,15 Q 80,-5 95,10" />
              <!-- Secondary Branches (Fainter) -->
              <path d="M 15,20 Q 30,25 40,20" class="vein-fine" />
              <path d="M 50,5 Q 60,15 70,10" class="vein-fine" />
            </g>
          </g>

          <!-- RIGHT LEAFLET -->
          <g transform="translate(440, 220) rotate(45) scale(0.9)">
            <!-- Base Fill -->
            <use href="#cordate-leaf" fill="var(--leaf-base)" class="leaf-shape"/>
            
            <!-- Shadow Mottling -->
            <circle cx="40" cy="40" r="30" fill="var(--leaf-shadow)" class="mottle"/>
            <circle cx="20" cy="60" r="25" fill="var(--leaf-shadow)" class="mottle"/>
            <!-- Highlight Mottling -->
            <circle cx="60" cy="20" r="30" fill="var(--leaf-highlight)" class="mottle" opacity="0.3"/>

            <!-- Venation -->
            <g class="vein-structure">
              <!-- Midrib -->
              <path d="M 0,0 Q 40,10 95,45" />
              <!-- Primary Branches -->
              <path d="M 20,5 Q 10,30 -10,20" />
              <path d="M 20,5 Q 40,-20 60,-10" />
              <path d="M 40,10 Q 30,40 10,35" />
              <path d="M 40,10 Q 60,-10 80,0" />
              <path d="M 60,15 Q 50,45 30,45" />
              <path d="M 60,15 Q 80,-5 95,10" />
              <!-- Secondary Branches -->
              <path d="M 15,20 Q 30,25 40,20" class="vein-fine" />
              <path d="M 50,5 Q 60,15 70,10" class="vein-fine" />
            </g>
          </g>

          <!-- TOP LEAFLET (Dominant) -->
          <g transform="translate(300, 50) rotate(5) scale(1.1)">
            <!-- Base Fill -->
            <use href="#cordate-leaf" fill="var(--leaf-base)" class="leaf-shape"/>
            
            <!-- Shadow Mottling (Darker center for depth) -->
            <circle cx="50" cy="50" r="40" fill="var(--leaf-shadow)" class="mottle"/>
            <circle cx="80" cy="40" r="25" fill="var(--leaf-shadow)" class="mottle"/>
            <!-- Highlight Mottling (Edges) -->
            <circle cx="10" cy="20" r="30" fill="var(--leaf-highlight)" class="mottle" opacity="0.4"/>

            <!-- Venation -->
            <g class="vein-structure">
              <!-- Midrib -->
              <path d="M 0,0 Q 40,10 95,45" />
              <!-- Primary Branches (Stronger) -->
              <path d="M 20,5 Q 10,30 -10,20" />
              <path d="M 20,5 Q 40,-20 60,-10" />
              <path d="M 40,10 Q 30,40 10,35" />
              <path d="M 40,10 Q 60,-10 80,0" />
              <path d="M 60,15 Q 50,45 30,45" />
              <path d="M 60,15 Q 80,-5 95,10" />
              <!-- Secondary Branches -->
              <path d="M 15,20 Q 30,25 40,20" class="vein-fine" />
              <path d="M 50,5 Q 60,15 70,10" class="vein-fine" />
              <path d="M 75,20 Q 85,30 90,25" class="vein-fine" />
            </g>
          </g>

        </g>

        <!-- 3. Scientific Accents -->
        <g id="annotations">
          <!-- Scale Bar -->
          <g transform="translate(50, 650)">
            <line x1="0" y1="0" x2="50" y2="0" class="scale-bar" />
            <line x1="0" y1="-3" x2="0" y2="3" class="scale-bar" />
            <line x1="50" y1="-3" x2="50" y2="3" class="scale-bar" />
            <text x="0" y="15" font-family="var(--font-mono)" font-size="10" fill="var(--ink-faint)">10mm</text>
          </g>
        </g>

      </svg>
    </div>
  </div>

</body>
</html>
