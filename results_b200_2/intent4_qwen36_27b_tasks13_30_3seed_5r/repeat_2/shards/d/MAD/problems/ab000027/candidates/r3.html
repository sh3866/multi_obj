<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trifolium pratense | Botanical Study</title>
<style>
  :root {
    /* Typography */
    --font-serif: 'Georgia', 'Times New Roman', serif;
    --font-mono: 'Courier New', Courier, monospace;
    
    /* Palette: Stone & Ink (Refined) */
    --bg-color: #F7F8F2; 
    --ink-primary: #2A3B2A;
    --ink-faint: #6B7C6B;
    --ink-accent: #4A6B4A;

    /* Palette: Botanical (Strict Flat System) */
    --leaf-base: #658F65;
    --leaf-shadow: #3E633E;
    --leaf-highlight: #8CB38C;
    --stem-color: #3F5D3F;
    --paper-texture: rgba(0,0,0,0.02);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-color);
    color: var(--ink-primary);
    font-family: var(--font-serif);
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Layout Container */
  .study-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr;
  }

  /* Typography Layer */
  .typography-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 3rem 4vw;
    z-index: 10;
  }

  /* Header: Top Left */
  .header-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    align-self: flex-start;
  }

  .figure-label {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-faint);
    border-bottom: 1px solid var(--ink-faint);
    padding-bottom: 4px;
    width: fit-content;
  }

  .scientific-name {
    font-size: 2.2rem;
    line-height: 1;
    font-weight: normal;
    color: var(--ink-primary);
    letter-spacing: -0.02em;
  }

  .scientific-sub {
    font-family: var(--font-mono);
    font-style: normal;
    font-size: 0.9rem;
    color: var(--ink-faint);
    margin-top: 0.5rem;
    letter-spacing: 0.05em;
  }

  /* Footer: Bottom Right (Anchoring) */
  .footer-note {
    align-self: flex-end;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1rem;
  }

  .data-block {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--ink-faint);
    line-height: 1.4;
    text-align: right;
    opacity: 0.8;
  }

  /* Visual Specimen */
  .visual-container {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  svg.specimen-svg {
    width: 100%;
    height: 100%;
    max-width: 800px;
    overflow: visible;
    /* Subtle organic movement */
    animation: sway 14s ease-in-out infinite alternate;
    transform-origin: 50% 85%;
  }

  @keyframes sway {
    0% { transform: rotate(-1deg) skewX(0deg); }
    100% { transform: rotate(1deg) skewX(0.2deg); }
  }

  /* SVG Styles */
  .leaf-shape {
    stroke: var(--leaf-shadow);
    stroke-width: 1.5;
    stroke-linejoin: round;
  }
  
  .vein-structure {
    fill: none;
    stroke: var(--leaf-shadow);
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.5;
  }
  
  .vein-fine {
    fill: none;
    stroke: var(--leaf-shadow);
    stroke-width: 0.75;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.3;
  }

  .mottle {
    mix-blend-mode: multiply;
  }

  .scale-bar {
    stroke: var(--ink-faint);
    stroke-width: 1;
  }

  .annotation-line {
    stroke: var(--ink-faint);
    stroke-width: 0.75;
    fill: none;
    stroke-dasharray: 2 2;
    opacity: 0.6;
  }

  /* Responsive Adjustments */
  @media (max-width: 768px) {
    .typography-layer { padding: 2rem; }
    .scientific-name { font-size: 1.6rem; }
    .footer-note { align-self: center; align-items: center; text-align: center; }
  }
</style>
</head>
<body>

  <div class="study-container">
    
    <!-- Typography Layer (Absolute positioning over canvas) -->
    <div class="typography-layer">
      <div class="header-group">
        <div class="figure-label">Fig. 1 — Specimen</div>
        <h1 class="scientific-name">Trifolium</h1>
        <div class="scientific-sub">pratense</div>
      </div>

      <div class="footer-note">
        <div class="data-block">
          Habitat: Cultivated fields<br>
          Date: Oct 14<br>
          Scale: 1:1
        </div>
      </div>
    </div>

    <!-- Visual Specimen -->
    <div class="visual-container">
      <svg class="specimen-svg" viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- 
            RECONSTRUCT GEOMETRY: 
            1. Define a base leaf shape that is Cordate (Heart-shaped).
            2. Serrations are defined as a jagged path segment.
          -->
          
          <!-- Serration Pattern (Sawtooth) -->
          <path id="serration" d="M 0,0 L 4,-3 L 8,0 L 12,-3 L 16,0 L 20,-3 L 24,0 L 28,-3 L 32,0 L 36,-3 L 40,0" />

          <!-- 
            The Leaflet Path:
            Starts at base (0,0), curves up to the "shoulders" (indentation), 
            then traces the lobes. The edges use the serration path.
          -->
          <path id="cordate-leaf" d="
            M 0,0 
            C -15,-20 -30,-15 -40,-5 
            C -35,-25 -20,-60 10,-80 
            C 30,-60 45,-25 40,-5 
            C 30,-15 15,-20 0,0 Z
          " />

          <!-- Gradient for natural color variation (Lighter at base, darker at tip) -->
          <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="var(--leaf-highlight)" />
            <stop offset="40%" stop-color="var(--leaf-base)" />
            <stop offset="100%" stop-color="var(--leaf-shadow)" />
          </linearGradient>

          <!-- Clip path to keep veins inside the leaf -->
          <clipPath id="leaf-clip">
             <use href="#cordate-leaf" />
          </clipPath>
        </defs>

        <!-- 1. The Stem (Organic Taper) -->
        <g id="stem-group">
          <!-- Main Stalk -->
          <path d="M 300,680 C 290,550 310,450 300,300" fill="none" stroke="var(--stem-color)" stroke-width="6" stroke-linecap="round"/>
          
          <!-- Petioles (The branching structure) -->
          <!-- Left Petiole -->
          <path d="M 298,350 C 250,320 200,250 160,220" fill="none" stroke="var(--stem-color)" stroke-width="4" stroke-linecap="round"/>
          <!-- Right Petiole -->
          <path d="M 302,350 C 350,320 400,250 440,220" fill="none" stroke="var(--stem-color)" stroke-width="4" stroke-linecap="round"/>
          <!-- Top Petiole -->
          <path d="M 300,300 C 302,250 300,200 300,150" fill="none" stroke="var(--stem-color)" stroke-width="5" stroke-linecap="round"/>
          
          <!-- Stem Veins (Subtle texture) -->
          <path d="M 300,680 C 290,550 310,450 300,300" fill="none" stroke="#2E462E" stroke-width="1" stroke-dasharray="10 5" opacity="0.3"/>
        </g>

        <!-- 2. The Leaves (Flat Organic Style) -->
        <g id="leaves-group">
          
          <!-- LEFT LEAFLET -->
          <g transform="translate(160, 220) rotate(-45) scale(0.9)">
            <!-- Base Fill with Gradient -->
            <use href="#cordate-leaf" fill="url(#leaf-grad)" class="leaf-shape"/>
            
            <!-- Serration Overlay (Jagged edges) -->
            <!-- Top Lobe Edge -->
            <use href="#serration" x="12" y="-65" transform="rotate(15)" stroke="var(--leaf-shadow)" stroke-width="1" fill="none"/>
            <!-- Bottom Lobe Edge -->
            <use href="#serration" x="-12" y="-65" transform="rotate(-15)" stroke="var(--leaf-shadow)" stroke-width="1" fill="none"/>

            <!-- Shadow Mottling (Natural Variation) -->
            <circle cx="10" cy="-20" r="30" fill="var(--leaf-shadow)" class="mottle" opacity="0.2"/>

            <!-- Venation (Pinnate Structure) -->
            <g class="vein-structure">
              <!-- Midrib -->
              <path d="M 0,0 Q -5,-30 0,-75" />
              <!-- Primary Branches -->
              <path d="M -2,-15 Q -25,-20 -30,-10" />
              <path d="M -2,-15 Q 20,-25 25,-15" />
              <path d="M -3,-35 Q -25,-40 -30,-30" />
              <path d="M -3,-35 Q 20,-45 25,-35" />
              <path d="M -4,-55 Q -20,-60 -20,-50" />
              <path d="M -4,-55 Q 20,-65 20,-55" />
              <!-- Secondary Branches -->
              <path d="M -15,-18 Q -20,-10 -10,-5" class="vein-fine" />
              <path d="M 10,-20 Q 15,-10 5,-5" class="vein-fine" />
            </g>
          </g>

          <!-- RIGHT LEAFLET -->
          <g transform="translate(440, 220) rotate(45) scale(0.9)">
            <!-- Base Fill -->
            <use href="#cordate-leaf" fill="url(#leaf-grad)" class="leaf-shape"/>
            
            <!-- Serration Overlay -->
            <use href="#serration" x="-12" y="-65" transform="rotate(-15)" stroke="var(--leaf-shadow)" stroke-width="1" fill="none"/>
            <use href="#serration" x="12" y="-65" transform="rotate(15)" stroke="var(--leaf-shadow)" stroke-width="1" fill="none"/>

            <!-- Shadow Mottling -->
            <circle cx="-10" cy="-20" r="30" fill="var(--leaf-shadow)" class="mottle" opacity="0.2"/>

            <!-- Venation -->
            <g class="vein-structure">
              <!-- Midrib -->
              <path d="M 0,0 Q 5,-30 0,-75" />
              <!-- Primary Branches -->
              <path d="M 2,-15 Q 25,-20 30,-10" />
              <path d="M 2,-15 Q -20,-25 -25,-15" />
              <path d="M 3,-35 Q 25,-40 30,-30" />
              <path d="M 3,-35 Q -20,-45 -25,-35" />
              <path d="M 4,-55 Q 20,-60 20,-50" />
              <path d="M 4,-55 Q -20,-65 -20,-55" />
              <!-- Secondary Branches -->
              <path d="M 15,-18 Q 20,-10 10,-5" class="vein-fine" />
              <path d="M -10,-20 Q -15,-10 -5,-5" class="vein-fine" />
            </g>
          </g>

          <!-- TOP LEAFLET (Dominant) -->
          <g transform="translate(300, 150) rotate(5) scale(1.1)">
            <!-- Base Fill -->
            <use href="#cordate-leaf" fill="url(#leaf-grad)" class="leaf-shape"/>
            
            <!-- Serration Overlay -->
            <use href="#serration" x="10" y="-60" transform="rotate(10)" stroke="var(--leaf-shadow)" stroke-width="1" fill="none"/>
            <use href="#serration" x="-10" y="-60" transform="rotate(-10)" stroke="var(--leaf-shadow)" stroke-width="1" fill="none"/>

            <!-- Shadow Mottling (Darker center for depth) -->
            <circle cx="0" cy="-40" r="40" fill="var(--leaf-shadow)" class="mottle" opacity="0.15"/>
            <!-- Highlight Mottling (Edges) -->
            <circle cx="-15" cy="-15" r="20" fill="var(--leaf-highlight)" class="mottle" opacity="0.3"/>

            <!-- Venation -->
            <g class="vein-structure">
              <!-- Midrib -->
              <path d="M 0,0 Q 0,-40 0,-80" />
              <!-- Primary Branches (Stronger) -->
              <path d="M 0,-15 Q -25,-20 -30,-10" />
              <path d="M 0,-15 Q 25,-20 30,-10" />
              <path d="M 0,-35 Q -25,-40 -30,-30" />
              <path d="M 0,-35 Q 25,-40 30,-30" />
              <path d="M 0,-55 Q -20,-60 -20,-50" />
              <path d="M 0,-55 Q 20,-60 20,-50" />
              <!-- Secondary Branches -->
              <path d="M -15,-18 Q -20,-10 -10,-5" class="vein-fine" />
              <path d="M 15,-18 Q 20,-10 10,-5" class="vein-fine" />
              <path d="M -15,-35 Q -20,-25 -10,-20" class="vein-fine" />
              <path d="M 15,-35 Q 20,-25 10,-20" class="vein-fine" />
            </g>
          </g>

        </g>

        <!-- 3. Scientific Accents -->
        <g id="annotations">
          <!-- Scale Bar -->
          <g transform="translate(480, 650)">
            <line x1="0" y1="0" x2="50" y2="0" class="scale-bar" />
            <line x1="0" y1="-4" x2="0" y2="4" class="scale-bar" />
            <line x1="50" y1="-4" x2="50" y2="4" class="scale-bar" />
            <text x="25" y="15" font-family="var(--font-mono)" font-size="10" fill="var(--ink-faint)" text-anchor="middle">10mm</text>
          </g>

          <!-- Annotation Line: Serration -->
          <g transform="translate(0,0)">
             <!-- Dashed line pointing to top leaf serration -->
             <path d="M 350,110 Q 380,90 420,100" class="annotation-line" />
             <text x="425" y="104" font-family="var(--font-mono)" font-size="8" fill="var(--ink-faint)">denticles</text>
          </g>
          
          <!-- Annotation Line: Node -->
          <g transform="translate(0,0)">
             <path d="M 310,350 Q 340,370 360,370" class="annotation-line" />
             <text x="365" y="374" font-family="var(--font-mono)" font-size="8" fill="var(--ink-faint)">node</text>
          </g>
        </g>

      </svg>
    </div>
  </div>

</body>
</html>
