<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Series 5 | Precision Flush</title>
<style>
    :root {
        --bg-color: #EAE8E4;
        --text-main: #1C1C1C;
        --text-muted: #555555;
        --accent: #000000;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--bg-color);
        /* Subtle architectural noise texture via inline SVG data URI */
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
        color: var(--text-main);
        font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', sans-serif;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
    }

    /* Layout */
    .container {
        display: grid;
        grid-template-columns: 1fr 1.1fr;
        width: 100%;
        height: 100%;
    }

    /* Left: Typography & Hierarchy */
    .content-side {
        padding: 6rem 5rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
        z-index: 10;
    }

    h1 {
        font-size: 5rem;
        font-weight: 400;
        letter-spacing: -0.03em;
        line-height: 0.9;
        margin-bottom: 2rem;
        color: var(--text-main);
        font-feature-settings: "ss01";
    }

    h1 span {
        font-weight: 700;
        display: block;
        margin-top: 0.5rem;
    }

    .tagline {
        font-size: 1.125rem;
        line-height: 1.6;
        color: var(--text-muted);
        max-width: 420px;
        margin-bottom: 4rem;
        border-left: 1px solid var(--text-main);
        padding-left: 1.5rem;
    }

    .features {
        display: flex;
        gap: 4rem;
    }

    .feature-item h3 {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        margin-bottom: 0.75rem;
        color: var(--text-main);
        font-weight: 600;
    }

    .feature-item p {
        font-size: 0.95rem;
        color: var(--text-muted);
        line-height: 1.5;
    }

    /* Right: Visual Stage */
    .visual-side {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Vignette for context */
        background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.05) 100%);
    }

    /* SVG Container */
    .product-stage {
        width: 100%;
        height: 90%;
        position: relative;
        z-index: 2;
        /* Sophisticated grounding shadow */
        filter: drop-shadow(0px 60px 40px rgba(0,0,0,0.15));
    }

    /* SVG Styles */
    .porcelain-light { fill: url(#grad-porcelain-light); }
    .porcelain-dark { fill: url(#grad-porcelain-dark); }
    .chrome { fill: url(#grad-chrome); }
    .water-surface { fill: url(#grad-water); }
    
    /* Vortex Animation */
    .vortex-group {
        transform-origin: 300px 415px;
        opacity: 0;
        transition: opacity 0.3s ease;
    }
    
    .vortex-active {
        animation: spin-vortex 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes spin-vortex {
        0% { transform: scale(0.1) rotate(0deg); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: scale(1.2) rotate(360deg); opacity: 0; }
    }

    /* Mobile Responsive */
    @media (max-width: 1000px) {
        .container { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
        .content-side { padding: 3rem 2rem; order: 2; justify-content: flex-start; }
        .visual-side { order: 1; height: 50vh; }
        h1 { font-size: 3.5rem; }
        .features { display: none; }
    }
</style>
</head>
<body>

<div class="container">
    <div class="content-side">
        <h1>Aura<span>Series 5.</span></h1>
        <div class="tagline">
            Engineered for silence. Sculpted for serenity. 
            The Aura Series 5 combines hydro-dynamic efficiency 
            with a refined, heavy-gauge ceramic aesthetic.
        </div>

        <div class="features">
            <div class="feature-item">
                <h3>Hydro-Clean</h3>
                <p>360° rimless spray</p>
            </div>
            <div class="feature-item">
                <h3>Silent Flush</h3>
                <p>Whisper-quiet valve</p>
            </div>
        </div>
    </div>

    <div class="visual-side">
        <svg class="product-stage" viewBox="0 0 600 700" preserveAspectRatio="xMidYMid meet">
            <defs>
                <!-- 1. MATERIAL REALISM: High Contrast Gradients -->
                
                <!-- Main Porcelain (Glossy White with deep shadows) -->
                <linearGradient id="grad-porcelain-light" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#B0B0B0" /> <!-- Deep Shadow Left -->
                    <stop offset="15%" style="stop-color:#FFFFFF" /> <!-- Specular Highlight -->
                    <stop offset="40%" style="stop-color:#F9FAFB" /> <!-- Midtone -->
                    <stop offset="85%" style="stop-color:#D1D5DB" /> <!-- Shadow Right -->
                    <stop offset="100%" style="stop-color:#9CA3AF" /> <!-- Deep Shadow Edge -->
                </linearGradient>

                <!-- Darker Porcelain (For depth/interiors) -->
                <linearGradient id="grad-porcelain-dark" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#6B7280" />
                    <stop offset="50%" style="stop-color:#E5E7EB" />
                    <stop offset="100%" style="stop-color:#6B7280" />
                </linearGradient>

                <!-- Chrome (Metallic) -->
                <linearGradient id="grad-chrome" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#9CA3AF" />
                    <stop offset="20%" style="stop-color:#F3F4F6" />
                    <stop offset="50%" style="stop-color:#D1D5DB" />
                    <stop offset="100%" style="stop-color:#6B7280" />
                </linearGradient>

                <!-- Water Gradient -->
                <linearGradient id="grad-water" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#E0F2FE" />
                    <stop offset="100%" style="stop-color:#7DD3FC" />
                </linearGradient>

                <!-- Floor Shadow Gradient -->
                <radialGradient id="grad-shadow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#000;stop-opacity:0.2" />
                    <stop offset="100%" style="stop-color:#000;stop-opacity:0" />
                </radialGradient>
            </defs>

            <!-- 4. GROUNDING: Floor Shadow -->
            <ellipse cx="300" cy="620" rx="160" ry="25" fill="url(#grad-shadow)" />

            <!-- 4. GROUNDING: Plumbing Base (Pedestal) -->
            <g id="plumbing-base">
                <!-- Flange -->
                <rect x="260" y="610" width="80" height="8" rx="2" class="chrome" />
                <!-- Base connection -->
                <path d="M270,610 L270,620 L330,620 L330,610 Z" fill="#9CA3AF" />
            </g>

            <!-- 1. MATERIAL REALISM: Bowl Outer Shell -->
            <g id="bowl-outer">
                <!-- Main Body -->
                <path d="M180,420 
                         C180,520 220,580 300,580 
                         C380,580 420,520 420,420 
                         L420,360 
                         C420,340 400,330 380,330 
                         L220,330 
                         C200,330 180,340 180,360 Z" 
                      class="porcelain-light" />
                
                <!-- Sharp Specular Highlight (Left Edge) -->
                <path d="M195,380 C195,480 220,540 280,560" 
                      stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.8" fill="none" />
            </g>

            <!-- 1. MATERIAL REALISM: Tank -->
            <g id="tank">
                <!-- Tank Body -->
                <path d="M210,180 L390,180 
                         C405,180 410,190 410,205 
                         L410,380 
                         C410,395 395,405 380,405 
                         L220,405 
                         C205,405 190,395 190,380 
                         L190,205 
                         C190,190 195,180 210,180 Z" 
                      class="porcelain-light" />
                
                <!-- Tank Top Lid (Thickness) -->
                <path d="M205,175 L395,175 
                         C405,175 410,180 410,185 
                         L410,195 L190,195 L190,185 
                         C190,180 195,175 205,175 Z" 
                      class="porcelain-dark" />
                
                <!-- Tank Specular Highlight -->
                <path d="M205,200 L205,370 C205,380 210,390 215,390" 
                      stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round" />

                <!-- 1. MATERIAL REALISM: Flush Handle (Visible) -->
                <g transform="translate(410, 250)">
                    <!-- Connector -->
                    <rect x="0" y="0" width="15" height="30" class="chrome" />
                    <!-- Lever -->
                    <rect x="10" y="-5" width="45" height="10" rx="3" class="chrome" />
                    <!-- Lever Highlight -->
                    <rect x="12" y="-3" width="40" height="2" fill="#FFF" opacity="0.5" />
                </g>
            </g>

            <!-- 2. VISUALIZING THE FLUSH: Water & Vortex -->
            <g id="bowl-inner">
                <!-- Water Surface -->
                <ellipse cx="300" cy="415" rx="110" ry="40" class="water-surface" id="waterSurface" />
                
                <!-- The Vortex (Hidden by default) -->
                <g class="vortex-group" id="vortexGroup">
                    <!-- Swirl 1 -->
                    <path d="M300,415 Q320,380 300,370 Q280,360 260,380 Q240,410 300,415" fill="#BAE6FD" opacity="0.8" />
                    <!-- Swirl 2 -->
                    <path d="M300,415 Q340,410 350,390 Q360,370 330,360 Q290,350 300,415" fill="#E0F2FE" opacity="0.9" />
                    <!-- Center Depth -->
                    <ellipse cx="300" cy="400" rx="15" ry="5" fill="#0EA5E9" opacity="0.6" />
                </g>
            </g>

            <!-- 1. MATERIAL REALISM: Rim & Seat -->
            <g id="rim-seat">
                <!-- Outer Rim (Thickness) -->
                <path d="M180,360 C180,380 250,400 300,400 C350,400 420,380 420,360 
                         L415,350 C415,370 350,390 300,390 C250,390 185,370 185,350 Z" 
                      class="porcelain-dark" />
                
                <!-- Seat -->
                <path d="M190,355 C190,375 250,395 300,395 C350,395 410,375 410,355 
                         L405,345 C405,365 350,385 300,385 C250,385 195,365 195,345 Z" 
                      class="porcelain-dark" />
                
                <!-- Seat Top -->
                <path d="M195,345 C195,365 250,385 300,385 C350,385 405,365 405,345 
                         C405,335 350,325 300,325 C250,325 195,335 195,345 Z" 
                      class="porcelain-light" />
                
                <!-- Seat Specular -->
                <ellipse cx="300" cy="350" rx="50" ry="8" fill="#FFFFFF" opacity="0.5" />
            </g>

        </svg>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const vortexGroup = document.getElementById('vortexGroup');
        const waterSurface = document.getElementById('waterSurface');
        let isFlushing = false;

        // 2. VISUALIZING THE FLUSH: Auto-trigger or manual interaction
        // We will make it auto-trigger on load for the "Visual Cue", 
        // and clickable anywhere on the visual side to re-trigger.
        
        const triggerFlush = () => {
            if (isFlushing) return;
            isFlushing = true;

            // 1. Water drops
            waterSurface.style.transition = "transform 0.4s cubic-bezier(0.6, 0.04, 0.98, 0.335)";
            waterSurface.style.transform = "scale(0.85) translateY(15px)";

            // 2. Vortex Spin
            vortexGroup.style.opacity = "1";
            vortexGroup.classList.add('vortex-active');

            // 3. Reset sequence
            setTimeout(() => {
                // Refill water
                waterSurface.style.transition = "transform 2s ease-out";
                waterSurface.style.transform = "scale(1) translateY(0)";
            }, 1000);

            setTimeout(() => {
                vortexGroup.classList.remove('vortex-active');
                vortexGroup.style.opacity = "0";
                isFlushing = false;
            }, 2500);
        };

        // Initial demo after short delay
        setTimeout(triggerFlush, 1000);

        // Allow user interaction
        document.querySelector('.visual-side').addEventListener('click', triggerFlush);
    });
</script>
</body>
</html>
