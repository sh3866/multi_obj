<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Series 5 | Precision Flush</title>
<style>
    :root {
        --bg-color: #F2F2F0;
        --text-main: #1A1A1A;
        --text-muted: #666666;
        --accent: #000000;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', sans-serif;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
    }

    /* Layout */
    .container {
        display: grid;
        grid-template-columns: 1fr 1.2fr;
        width: 100%;
        height: 100%;
    }

    /* Left: Typography & Hierarchy */
    .content-side {
        padding: 6rem 4rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
        z-index: 10;
    }

    /* 5. TYPOGRAPHY: Unified geometric sans-serif, cleaner hierarchy */
    h1 {
        font-size: 4.5rem;
        font-weight: 300;
        letter-spacing: -0.04em;
        line-height: 1;
        margin-bottom: 2.5rem;
        color: var(--text-main);
    }

    h1 strong {
        font-weight: 600;
        display: block;
        margin-top: 0.5rem;
    }

    /* 5. TYPOGRAPHY: Vertical rule aligned to body text */
    .tagline {
        font-size: 1.1rem;
        line-height: 1.6;
        color: var(--text-muted);
        max-width: 400px;
        margin-bottom: 4rem;
        border-left: 2px solid var(--accent); /* Thicker, more distinct rule */
        padding-left: 1.5rem;
    }

    .features {
        display: flex;
        gap: 4rem;
    }

    .feature-item h3 {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        margin-bottom: 0.75rem;
        color: var(--text-main);
        font-weight: 700;
    }

    .feature-item p {
        font-size: 0.95rem;
        color: var(--text-muted);
        line-height: 1.5;
    }

    /* Right: Visual Stage */
    .visual-side {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        /* 4. CONTEXT: Subtle architectural background */
        background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.5) 0%, rgba(0,0,0,0.02) 100%);
        overflow: hidden;
    }

    /* 4. CONTEXT: Blurred architectural element (Plant) */
    .bg-element {
        position: absolute;
        right: -5%;
        top: 10%;
        width: 40%;
        height: 80%;
        opacity: 0.4;
        filter: blur(12px);
        z-index: 0;
        pointer-events: none;
    }

    /* SVG Container */
    .product-stage {
        width: 90%;
        height: 95%;
        position: relative;
        z-index: 2;
        /* 4. GROUNDING: Soft directional drop shadow */
        filter: drop-shadow(0px 40px 60px rgba(0,0,0,0.12));
        cursor: pointer;
        transition: transform 0.5s ease;
    }

    .product-stage:hover {
        transform: scale(1.01);
    }

    /* SVG Styles */
    .chrome { fill: url(#grad-chrome); }
    .water-surface { fill: url(#grad-water); }
    
    /* 3. WATER & ACTION: Animation */
    .vortex-group {
        transform-origin: 300px 415px;
        opacity: 0;
        pointer-events: none;
    }
    
    .vortex-active {
        animation: spin-vortex 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes spin-vortex {
        0% { transform: scale(0.1) rotate(0deg); opacity: 0; }
        15% { opacity: 1; }
        60% { opacity: 1; }
        100% { transform: scale(1.5) rotate(720deg); opacity: 0; }
    }

    /* Mobile Responsive */
    @media (max-width: 1000px) {
        .container { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
        .content-side { padding: 3rem 2rem; order: 2; justify-content: flex-start; }
        .visual-side { order: 1; height: 50vh; }
        h1 { font-size: 3rem; }
        .features { display: none; }
        .bg-element { right: -20%; top: 0; width: 60%; }
    }
</style>
</head>
<body>

<div class="container">
    <div class="content-side">
        <h1>Aura <strong>Series 5.</strong></h1>
        <div class="tagline">
            Engineered for silence. Sculpted for serenity. 
            The Aura Series 5 combines hydro-dynamic efficiency 
            with a refined, heavy-gauge ceramic aesthetic.
        </div>

        <div class="features">
            <div class="feature-item">
                <h3>Hydro-Clean</h3>
                <p>360° rimless spray</p>
            </div>
            <div class="feature-item">
                <h3>Silent Flush</h3>
                <p>Whisper-quiet valve</p>
            </div>
        </div>
    </div>

    <div class="visual-side">
        <!-- 4. CONTEXT: Background Plant Silhouette -->
        <svg class="bg-element" viewBox="0 0 100 100" preserveAspectRatio="none">
            <path d="M50,100 Q50,50 20,20 Q40,40 50,100 M50,100 Q50,50 80,20 Q60,40 50,100 M50,100 Q50,60 50,10" stroke="#A3A3A3" stroke-width="2" fill="none" />
        </svg>

        <svg class="product-stage" viewBox="0 0 600 750" preserveAspectRatio="xMidYMid meet">
            <defs>
                <!-- 2. MATERIAL REALISM: Complex Gradients -->
                
                <!-- Main Porcelain (Glossy White with curvature) -->
                <linearGradient id="grad-porcelain-light" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#D1D5DB" /> <!-- Shadow Left -->
                    <stop offset="12%" style="stop-color:#FFFFFF" /> <!-- Sharp Highlight -->
                    <stop offset="40%" style="stop-color:#F3F4F6" /> <!-- Midtone -->
                    <stop offset="80%" style="stop-color:#E5E7EB" /> <!-- Soft Shadow -->
                    <stop offset="100%" style="stop-color:#9CA3AF" /> <!-- Deep Edge -->
                </linearGradient>

                <!-- Darker Porcelain (For depth/interiors) -->
                <linearGradient id="grad-porcelain-dark" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#6B7280" />
                    <stop offset="50%" style="stop-color:#E5E7EB" />
                    <stop offset="100%" style="stop-color:#6B7280" />
                </linearGradient>

                <!-- 2. MATERIAL REALISM: Metallic Chrome -->
                <linearGradient id="grad-chrome" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#9CA3AF" />
                    <stop offset="25%" style="stop-color:#F3F4F6" />
                    <stop offset="50%" style="stop-color:#D1D5DB" />
                    <stop offset="75%" style="stop-color:#F3F4F6" />
                    <stop offset="100%" style="stop-color:#6B7280" />
                </linearGradient>

                <!-- 3. WATER & ACTION: Water Gradient with Depth -->
                <linearGradient id="grad-water" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#E0F2FE" />
                    <stop offset="50%" style="stop-color:#BAE6FD" />
                    <stop offset="100%" style="stop-color:#0284C7" /> <!-- Darker bottom for depth -->
                </linearGradient>

                <!-- Floor Shadow Gradient -->
                <radialGradient id="grad-shadow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#000;stop-opacity:0.25" />
                    <stop offset="100%" style="stop-color:#000;stop-opacity:0" />
                </radialGradient>
            </defs>

            <!-- 4. GROUNDING: Floor Shadow -->
            <ellipse cx="300" cy="680" rx="180" ry="30" fill="url(#grad-shadow)" />

            <!-- 1. ANATOMY: Plumbing Base (Realistic Supply Line) -->
            <g id="plumbing-base">
                <!-- Supply Line (Metal Pipe) -->
                <path d="M220,400 L220,680 L260,680" fill="none" stroke="url(#grad-chrome)" stroke-width="6" stroke-linejoin="round" />
                <!-- Wall Connector -->
                <rect x="215" y="395" width="10" height="15" class="chrome" />
                <!-- Floor Flange -->
                <ellipse cx="260" cy="680" rx="15" ry="4" class="chrome" />
            </g>

            <!-- 2. MATERIAL REALISM: Bowl Outer Shell -->
            <g id="bowl-outer">
                <!-- Main Body -->
                <path d="M180,420 
                         C180,520 220,580 300,580 
                         C380,580 420,520 420,420 
                         L420,360 
                         C420,340 400,330 380,330 
                         L220,330 
                         C200,330 180,340 180,360 Z" 
                      fill="url(#grad-porcelain-light)" />
                
                <!-- Sharp Specular Highlight (Left Edge) -->
                <path d="M195,380 C195,480 220,540 280,560" 
                      stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.9" fill="none" />
            </g>

            <!-- 1. ANATOMY & 2. MATERIAL REALISM: Tank -->
            <g id="tank">
                <!-- Tank Body -->
                <path d="M210,180 L390,180 
                         C405,180 410,190 410,205 
                         L410,380 
                         C410,395 395,405 380,405 
                         L220,405 
                         C205,405 190,395 190,380 
                         L190,205 
                         C190,190 195,180 210,180 Z" 
                      fill="url(#grad-porcelain-light)" />
                
                <!-- 1. ANATOMY: Tank Lid (Distinct, raised cap) -->
                <path d="M200,170 L400,170 
                         C415,170 415,180 400,180 
                         L200,180 
                         C185,180 185,170 200,170 Z" 
                      fill="url(#grad-porcelain-dark)" />
                
                <!-- Tank Specular Highlight -->
                <path d="M205,200 L205,370 C205,380 210,390 215,390" 
                      stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.7" stroke-linecap="round" />

                <!-- 2. MATERIAL REALISM: Flush Handle (Chrome & Bevels) -->
                <g transform="translate(410, 250)">
                    <!-- Connector -->
                    <rect x="0" y="0" width="15" height="30" class="chrome" />
                    <!-- Lever (Thick, metallic) -->
                    <rect x="10" y="-8" width="50" height="14" rx="4" class="chrome" />
                    <!-- Lever Highlight -->
                    <rect x="12" y="-6" width="45" height="3" fill="#FFF" opacity="0.6" />
                    <!-- Lever Shadow -->
                    <rect x="12" y="2" width="45" height="3" fill="#000" opacity="0.2" />
                </g>
            </g>

            <!-- 3. WATER & ACTION: Water & Vortex -->
            <g id="bowl-inner">
                <!-- Water Surface -->
                <ellipse cx="300" cy="415" rx="110" ry="40" class="water-surface" id="waterSurface" opacity="0.9" />
                
                <!-- The Vortex (Semi-transparent swirl) -->
                <g class="vortex-group" id="vortexGroup">
                    <!-- Swirl 1 -->
                    <path d="M300,415 Q320,380 300,370 Q280,360 260,380 Q240,410 300,415" fill="#E0F2FE" opacity="0.8" />
                    <!-- Swirl 2 -->
                    <path d="M300,415 Q340,410 350,390 Q360,370 330,360 Q290,350 300,415" fill="#BAE6FD" opacity="0.9" />
                    <!-- Center Depth -->
                    <ellipse cx="300" cy="400" rx="15" ry="5" fill="#0284C7" opacity="0.6" />
                </g>
            </g>

            <!-- 1. ANATOMY: Rim & Seat -->
            <g id="rim-seat">
                <!-- Outer Rim (Thickness) -->
                <path d="M180,360 C180,380 250,400 300,400 C350,400 420,380 420,360 
                         L415,350 C415,370 350,390 300,390 C250,390 185,370 185,350 Z" 
                      fill="url(#grad-porcelain-dark)" />
                
                <!-- 1. ANATOMY: Toilet Seat (Distinct Ring) -->
                <path d="M190,355 C190,375 250,395 300,395 C350,395 410,375 410,355 
                         L405,345 C405,365 350,385 300,385 C250,385 195,365 195,345 Z" 
                      fill="url(#grad-porcelain-dark)" />
                
                <!-- Seat Top (Glossy) -->
                <path d="M195,345 C195,365 250,385 300,385 C350,385 405,365 405,345 
                         C405,335 350,325 300,325 C250,325 195,335 195,345 Z" 
                      fill="url(#grad-porcelain-light)" />
                
                <!-- Seat Specular -->
                <ellipse cx="300" cy="350" rx="50" ry="8" fill="#FFFFFF" opacity="0.6" />
            </g>

        </svg>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const vortexGroup = document.getElementById('vortexGroup');
        const waterSurface = document.getElementById('waterSurface');
        let isFlushing = false;

        const triggerFlush = () => {
            if (isFlushing) return;
            isFlushing = true;

            // 1. Water drops (Scale down to simulate depth)
            waterSurface.style.transition = "transform 0.4s cubic-bezier(0.6, 0.04, 0.98, 0.335)";
            waterSurface.style.transform = "scale(0.85) translateY(15px)";

            // 2. Vortex Spin
            vortexGroup.style.opacity = "1";
            vortexGroup.classList.add('vortex-active');

            // 3. Reset sequence (Refill)
            setTimeout(() => {
                waterSurface.style.transition = "transform 2.5s ease-out";
                waterSurface.style.transform = "scale(1) translateY(0)";
            }, 1200);

            setTimeout(() => {
                vortexGroup.classList.remove('vortex-active');
                vortexGroup.style.opacity = "0";
                isFlushing = false;
            }, 3000);
        };

        // Initial demo after short delay
        setTimeout(triggerFlush, 1500);

        // Allow user interaction
        document.querySelector('.visual-side').addEventListener('click', triggerFlush);
    });
</script>
</body>
</html>
