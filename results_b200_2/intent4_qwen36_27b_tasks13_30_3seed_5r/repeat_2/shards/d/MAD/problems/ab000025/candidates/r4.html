<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Haptic | Design Revision</title>
<style>
    :root {
        --bg: #EAE8E3;
        --text: #1A1A1A;
        --font-main: "Helvetica Neue", Helvetica, Arial, sans-serif;
        --font-mono: "Menlo", "Courier New", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font-main);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    /* Grain Overlay - Editorial Texture */
    .grain {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 20;
        opacity: 0.05;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Layout */
    main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        perspective: 1500px; /* Deeper perspective for macro feel */
    }

    .art-stage {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    svg {
        /* Fill the vertical space for the macro crop */
        height: 105vh; 
        width: auto;
        /* Subtle initial shadow */
        filter: drop-shadow(0 20px 50px rgba(0,0,0,0.15));
        will-change: transform;
        transition: transform 0.1s cubic-bezier(0.1, 0.7, 1.0, 0.1);
    }

    /* Minimal UI Overlay - keeping it out of the crop */
    .ui-layer {
        position: absolute;
        bottom: 2rem;
        left: 2rem;
        z-index: 30;
        pointer-events: none;
    }
    
    .meta-tag {
        font-family: var(--font-mono);
        font-size: 0.65rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #666;
        display: flex;
        align-items: center;
        gap: 1rem;
    }
    
    .meta-tag span {
        display: block;
        width: 20px;
        height: 1px;
        background: #999;
    }

    /* Animation classes */
    .interactive-group { will-change: transform; }
</style>
</head>
<body>

    <div class="grain"></div>

    <main>
        <div class="art-stage">
            <!-- 
                REVISION: 
                - ViewBox changed to a vertical "Macro" crop (800x1200).
                - Removed abstract blocks.
                - Implemented organic path drawing for hand anatomy.
                - Added 2.5D lighting and gradients.
            -->
            <svg viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- 1. SKIN MATERIALS (Organic & Warm) -->
                    <linearGradient id="skinHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FDE0CC" /> 
                        <stop offset="100%" stop-color="#E8B49D" /> 
                    </linearGradient>
                    
                    <linearGradient id="skinMidtone" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#E5B095" /> 
                        <stop offset="100%" stop-color="#B87D5B" /> 
                    </linearGradient>

                    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#9C5C38" /> 
                        <stop offset="100%" stop-color="#5E3015" /> 
                    </linearGradient>

                    <!-- Finger Joint Gradient (Darker at crease) -->
                    <linearGradient id="creaseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#000" stop-opacity="0"/>
                        <stop offset="50%" stop-color="#4A2510" stop-opacity="0.6"/>
                        <stop offset="100%" stop-color="#000" stop-opacity="0"/>
                    </linearGradient>

                    <!-- 2. DEVICE MATERIALS (2.5D Metallic & Glass) -->
                    <linearGradient id="deviceBody" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#111111" />
                        <stop offset="10%" stop-color="#333333" /> <!-- Bevel Highlight -->
                        <stop offset="15%" stop-color="#1A1A1A" />
                        <stop offset="85%" stop-color="#1A1A1A" />
                        <stop offset="95%" stop-color="#050505" /> <!-- Shadow Edge -->
                        <stop offset="100%" stop-color="#000000" />
                    </linearGradient>

                    <linearGradient id="deviceSide" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#000000" />
                        <stop offset="100%" stop-color="#222222" />
                    </linearGradient>

                    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#1A1C20" />
                        <stop offset="50%" stop-color="#0D0E12" />
                        <stop offset="100%" stop-color="#050507" />
                    </linearGradient>

                    <!-- Glass Reflection Gradient -->
                    <linearGradient id="glassGlare" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
                        <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.0" />
                        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
                    </linearGradient>

                    <!-- 3. FILTERS -->
                    <!-- Soft shadow for the hand casting onto the phone -->
                    <filter id="handShadow" x="-20%" y="-20%" width="150%" height="150%">
                        <feGaussianBlur stdDeviation="8" result="blur" />
                        <feOffset dx="-5" dy="5" result="offsetBlur" />
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.5"/>
                        </feComponentTransfer>
                    </filter>

                    <!-- Blur for background elements (Depth of Field) -->
                    <filter id="bokeh">
                        <feGaussianBlur stdDeviation="15" />
                    </filter>
                </defs>

                <!-- BACKGROUND: Subtle, out of focus shapes to imply environment -->
                <g opacity="0.3" filter="url(#bokeh)">
                    <circle cx="100" cy="800" r="200" fill="#D4D0C8" />
                    <circle cx="700" cy="200" r="300" fill="#C8C5BD" />
                </g>

                <g id="scene" class="interactive-group">
                    
                    <!-- LAYER 1: BACK FINGERS (The Grip) -->
                    <!-- These wrap around the LEFT side of the phone -->
                    <g id="fingers-back" transform="translate(0,0)">
                        
                        <!-- Index Finger (Top) -->
                        <g id="finger-index">
                            <!-- Tip -->
                            <path d="M280,300 Q260,280 240,310 L240,360 Q270,360 280,340 Z" fill="url(#skinHighlight)" />
                            <!-- Middle Segment -->
                            <path d="M280,340 L240,360 L250,420 L290,400 Z" fill="url(#skinMidtone)" />
                            <!-- Base/Crease -->
                            <path d="M250,420 L290,400 L310,440 L260,460 Z" fill="url(#skinShadow)" />
                            <!-- Crease Line -->
                            <path d="M252,425 Q275,415 295,405" stroke="#4A2510" stroke-width="2" fill="none" opacity="0.4" />
                        </g>

                        <!-- Middle Finger (Longest) -->
                        <g id="finger-middle">
                            <path d="M275,410 Q250,390 230,420 L230,480 Q260,480 275,460 Z" fill="url(#skinHighlight)" />
                            <path d="M275,460 L230,480 L240,550 L285,530 Z" fill="url(#skinMidtone)" />
                            <path d="M240,550 L285,530 L305,570 L250,590 Z" fill="url(#skinShadow)" />
                            <path d="M242,555 Q265,545 285,535" stroke="#4A2510" stroke-width="2" fill="none" opacity="0.4" />
                        </g>

                        <!-- Ring Finger -->
                        <g id="finger-ring">
                            <path d="M270,520 Q245,500 225,530 L225,590 Q255,590 270,570 Z" fill="url(#skinHighlight)" />
                            <path d="M270,570 L225,590 L235,660 L280,640 Z" fill="url(#skinMidtone)" />
                            <path d="M235,660 L280,640 L300,680 L245,700 Z" fill="url(#skinShadow)" />
                            <path d="M237,665 Q260,655 280,645" stroke="#4A2510" stroke-width="2" fill="none" opacity="0.4" />
                        </g>

                        <!-- Pinky Finger (Bottom) -->
                        <g id="finger-pinky">
                            <path d="M265,630 Q240,610 220,640 L220,700 Q250,700 265,680 Z" fill="url(#skinHighlight)" />
                            <path d="M265,680 L220,700 L230,760 L275,740 Z" fill="url(#skinMidtone)" />
                            <path d="M230,760 L275,740 L295,780 L240,800 Z" fill="url(#skinShadow)" />
                            <path d="M232,765 Q255,755 275,745" stroke="#4A2510" stroke-width="2" fill="none" opacity="0.4" />
                        </g>
                    </g>

                    <!-- LAYER 2: THE DEVICE (Phone) -->
                    <g id="phone-device">
                        <!-- Phone Body (Thickness illusion) -->
                        <rect x="220" y="50" width="220" height="1050" rx="40" fill="url(#deviceBody)" />
                        <!-- Left Edge Highlight (Metallic Bevel) -->
                        <path d="M222,90 L222,1010" stroke="#FFFFFF" stroke-width="1" opacity="0.3" />
                        <!-- Right Edge Shadow -->
                        <path d="M438,90 L438,1010" stroke="#000000" stroke-width="4" opacity="0.4" />

                        <!-- Screen Area -->
                        <rect x="230" y="60" width="200" height="1030" rx="32" fill="url(#screenGlass)" />
                        
                        <!-- Screen Content (Abstract UI) -->
                        <g clip-path="url(#screenClip)">
                            <!-- Abstract UI Elements -->
                            <rect x="250" y="200" width="160" height="120" rx="16" fill="#FFFFFF" opacity="0.03" />
                            <rect x="250" y="350" width="160" height="250" rx="16" fill="#FFFFFF" opacity="0.02" />
                            <rect x="260" y="220" width="100" height="10" rx="5" fill="#FFFFFF" opacity="0.08" />
                            <rect x="260" y="240" width="140" height="8" rx="4" fill="#FFFFFF" opacity="0.05" />
                            <rect x="260" y="380" width="120" height="12" rx="6" fill="#FFFFFF" opacity="0.08" />
                            <rect x="260" y="410" width="140" height="8" rx="4" fill="#FFFFFF" opacity="0.04" />
                            <rect x="260" y="430" width="140" height="8" rx="4" fill="#FFFFFF" opacity="0.04" />
                        </g>

                        <!-- Screen Glare (Glass Reflection) -->
                        <path d="M150,100 L550,100 L450,1100 L100,1100 Z" fill="url(#glassGlare)" style="mix-blend-mode: overlay;" />
                        
                        <!-- Hardware Details -->
                        <rect x="300" y="90" width="40" height="6" rx="3" fill="#000000" opacity="0.8" /> <!-- Speaker -->
                        <circle cx="360" cy="93" r="4" fill="#000000" /> <!-- Camera -->
                        <circle cx="360" cy="93" r="1.5" fill="#222222" /> <!-- Lens -->
                    </g>

                    <!-- LAYER 3: FRONT HAND (Palm, Wrist, Thumb) -->
                    <!-- This overlaps the phone to create depth -->
                    <g id="hand-front">
                        
                        <!-- Palm & Wrist Base -->
                        <path d="M250,700 Q200,850 180,1200 L450,1200 Q400,900 350,750 Z" fill="url(#skinMidtone)" />
                        <!-- Palm Depth Shadow -->
                        <path d="M250,700 Q200,850 180,1200 L450,1200 Q400,900 350,750 Z" fill="url(#skinShadow)" opacity="0.3" />

                        <!-- THUMB (The Focal Point) -->
                        <g id="thumb">
                            <!-- Thumb Cast Shadow ON THE PHONE SCREEN -->
                            <!-- This is crucial for the "2.5D" feel -->
                            <path d="M340,600 Q420,580 480,650 L480,700 Q400,650 340,680 Z" fill="#000000" opacity="0.5" filter="url(#handShadow)" style="mix-blend-mode: multiply;" />

                            <!-- Thumb Proximal Phalanx (Base) -->
                            <path d="M320,650 Q380,600 420,550 L380,500 Q340,580 290,620 Z" fill="url(#skinHighlight)" />
                            
                            <!-- Thumb Distal Phalanx (Tip) -->
                            <path d="M410,540 Q460,500 480,560 L440,600 Q400,580 380,510 Z" fill="url(#skinMidtone)" />
                            
                            <!-- Joint Crease (IP Joint) -->
                            <path d="M390,560 Q410,550 430,570" stroke="#5E3015" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round" />
                            
                            <!-- Thumbnail -->
                            <path d="M450,555 Q465,545 475,565 Q460,575 445,565 Z" fill="#FFF0E6" opacity="0.8" />
                            <path d="M450,555 Q465,545 475,565" stroke="#E3B89A" stroke-width="1" fill="none" />
                        </g>

                    </g>
                </g>

                <!-- Clip Path for Screen Content -->
                <clipPath id="screenClip">
                    <rect x="230" y="60" width="200" height="1030" rx="32" />
                </clipPath>
            </svg>
        </div>
    </main>

    <div class="ui-layer">
        <div class="meta-tag">
            <span></span>
            View: Macro / 85mm
        </div>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const svgElement = document.querySelector('svg');
        const thumbGroup = document.querySelector('#thumb');
        const fingersGroup = document.querySelector('#fingers-back');
        const palmGroup = document.querySelector('#hand-front');
        
        // Parallax Configuration
        const config = {
            sceneRotation: 8, // Max degrees
            thumbParallax: 25, // Pixels
            fingersParallax: -10 // Pixels (moves opposite or slower)
        };

        document.addEventListener('mousemove', (e) => {
            // Normalized coordinates (-1 to 1)
            const xNorm = (e.clientX / window.innerWidth) * 2 - 1;
            const yNorm = (e.clientY / window.innerHeight) * 2 - 1;

            // 1. Device Rotation (Subtle)
            const rotateY = xNorm * (config.sceneRotation * 0.5);
            const rotateX = -yNorm * (config.sceneRotation * 0.5);
            svgElement.style.transform = `rotateY(${rotateY}deg) rotateX(${rotateX}deg)`;

            // 2. Depth Parallax
            
            // Thumb is closest to camera -> moves most
            if(thumbGroup) {
                const tx = xNorm * config.thumbParallax;
                const ty = yNorm * config.thumbParallax;
                thumbGroup.style.transform = `translate(${tx}px, ${ty}px)`;
            }

            // Palm is mid-ground -> moves moderately
            if(palmGroup) {
                const tx = xNorm * (config.thumbParallax * 0.6);
                const ty = yNorm * (config.thumbParallax * 0.6);
                palmGroup.style.transform = `translate(${tx}px, ${ty}px)`;
            }

            // Back fingers are furthest -> move least
            if(fingersGroup) {
                const tx = xNorm * config.fingersParallax;
                const ty = yNorm * config.fingersParallax;
                fingersGroup.style.transform = `translate(${tx}px, ${ty}px)`;
            }
        });

        // Reset on mouse leave
        document.addEventListener('mouseleave', () => {
            svgElement.style.transform = `rotateY(0deg) rotateX(0deg)`;
            if(thumbGroup) thumbGroup.style.transform = `translate(0px, 0px)`;
            if(palmGroup) palmGroup.style.transform = `translate(0px, 0px)`;
            if(fingersGroup) fingersGroup.style.transform = `translate(0px, 0px)`;
        });
    });
</script>
</body>
</html>
