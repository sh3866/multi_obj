<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactile Reality | Macro Editorial</title>
<style>
    :root {
        --bg: #EBE9E4;
        --text: #111111;
        --accent: #FF4D4D;
        --font-main: "Helvetica Neue", Helvetica, Arial, sans-serif;
        --font-mono: "Menlo", "Courier New", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font-main);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    /* Grain Overlay for Editorial Texture */
    .grain {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 20;
        opacity: 0.06;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Layout & Typography */
    header {
        position: absolute;
        top: 2rem;
        left: 2.5rem;
        z-index: 10;
        width: calc(100% - 5rem);
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        pointer-events: none; /* Let clicks pass through to SVG */
    }

    .brand {
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        color: var(--text);
    }

    .meta {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: #666;
        text-align: right;
        line-height: 1.4;
    }

    /* Main Stage */
    main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        perspective: 1000px;
    }

    .art-stage {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    svg {
        height: 95vh;
        width: auto;
        /* Subtle shadow for the whole object */
        filter: drop-shadow(0 40px 80px rgba(0,0,0,0.15));
        will-change: transform;
        transition: transform 0.1s ease-out;
    }

    /* Floating Typography */
    .overlay-text {
        position: absolute;
        top: 15%;
        right: 8%; /* Moved to Top-Right per Critique 4 */
        z-index: 5;
        text-align: right;
        pointer-events: none;
        mix-blend-mode: multiply;
    }

    .big-type {
        font-size: 6.5vw; 
        line-height: 0.85;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: #0a0a0a;
        text-transform: uppercase;
        margin-bottom: 1rem;
    }

    .sub-type {
        font-size: 1.1vw;
        font-weight: 500;
        display: block;
        max-width: 300px;
        margin-left: auto;
        line-height: 1.3;
        color: #333;
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    /* Interactive Hint */
    .hint {
        position: absolute;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%);
        font-family: var(--font-mono);
        font-size: 0.6rem;
        text-transform: uppercase;
        color: #888;
        display: flex;
        align-items: center;
        gap: 0.8rem;
        opacity: 0.7;
        z-index: 10;
    }
    .hint::before, .hint::after {
        content: '';
        width: 6px;
        height: 6px;
        border: 1px solid #888;
        border-radius: 50%;
    }

    /* SVG Specifics */
    .interactive-group { will-change: transform; }
</style>
</head>
<body>

    <div class="grain"></div>

    <header>
        <div class="brand">Studio Vector</div>
        <div class="meta">
            PROJECT: HAPTIC<br>
            VIEW: MACRO / 85MM<br>
            STATUS: FINAL
        </div>
    </header>

    <main>
        <!-- CRITIQUE 4: Moved to Top-Right to balance the visual weight of the hand -->
        <div class="overlay-text">
            <div class="big-type">Tactile<br>Reality</div>
            <span class="sub-type">Precision engineering meets biological intent. The grip that connects us.</span>
        </div>

        <div class="art-stage">
            <!-- CRITIQUE 1: ViewBox tightly cropped to focus on the hand/phone interaction -->
            <!-- 0 0 600 800 focuses on the center of action -->
            <svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- CRITIQUE 3: Unified Lighting Gradients -->
                    
                    <!-- Skin: Soft, organic, warm -->
                    <linearGradient id="skinBase" x1="10%" y1="0%" x2="90%" y2="100%">
                        <stop offset="0%" stop-color="#F2D8C5" /> <!-- Highlight -->
                        <stop offset="40%" stop-color="#E3B89A" /> <!-- Midtone -->
                        <stop offset="100%" stop-color="#A86A4A" /> <!-- Shadow -->
                    </linearGradient>

                    <radialGradient id="skinShadow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#8C5A3C" stop-opacity="0" />
                        <stop offset="100%" stop-color="#5A3520" stop-opacity="0.8" />
                    </radialGradient>

                    <linearGradient id="nailGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#FCEAE0" />
                        <stop offset="100%" stop-color="#E3B89A" />
                    </linearGradient>

                    <!-- Phone: Hard, metallic, cool -->
                    <!-- CRITIQUE 3: Unified solid compound path look via gradient -->
                    <linearGradient id="phoneBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#1a1a1a" />
                        <stop offset="15%" stop-color="#4a4a4a" /> <!-- Edge Light -->
                        <stop offset="50%" stop-color="#0a0a0a" />
                        <stop offset="100%" stop-color="#000000" />
                    </linearGradient>

                    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#2B2B38" />
                        <stop offset="100%" stop-color="#050508" />
                    </linearGradient>

                    <!-- Filters -->
                    <filter id="softBlur">
                        <feGaussianBlur stdDeviation="4" />
                    </filter>
                    <filter id="contactShadow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="2" />
                        <feOffset dx="2" dy="4" />
                        <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
                    </filter>
                    
                    <!-- Clip Path for Screen Content -->
                    <clipPath id="screenClip">
                        <rect x="225" y="50" width="190" height="700" rx="20" />
                    </clipPath>
                </defs>

                <!-- Background Context -->
                <rect width="100%" height="100%" fill="transparent" />

                <g id="scene" class="interactive-group">
                    
                    <!-- CRITIQUE 2: Reconstructed Anatomy - Fingers wrapping back/side -->
                    <g id="fingers-back">
                        <!-- Index Finger (Top) -->
                        <g transform="translate(0,0)">
                            <!-- Phalanx 1 (Proximal) -->
                            <path d="M260,220 Q290,190 320,210 L310,260 Q280,250 260,240 Z" fill="url(#skinBase)" />
                            <!-- Phalanx 2 (Middle) -->
                            <path d="M315,215 Q345,220 340,270 L305,290 Q280,270 295,240 Z" fill="url(#skinBase)" />
                            <!-- Phalanx 3 (Distal - Tip) -->
                            <path d="M335,275 Q360,280 350,320 L310,330 Q300,290 315,260 Z" fill="url(#skinBase)" />
                            <!-- Nail -->
                            <path d="M345,300 Q355,298 348,315 L335,318 Z" fill="url(#nailGrad)" />
                            <!-- Joint Crease -->
                            <path d="M325,265 Q330,270 328,280" fill="none" stroke="#8C5A3C" stroke-width="1.5" opacity="0.4" stroke-linecap="round" />
                        </g>

                        <!-- Middle Finger -->
                        <g transform="translate(0,0)">
                            <path d="M240,280 Q270,260 295,285 L285,335 Q255,325 235,300 Z" fill="url(#skinBase)" />
                            <path d="M290,290 Q315,300 310,350 L275,370 Q250,350 265,315 Z" fill="url(#skinBase)" />
                            <path d="M305,355 Q330,360 320,400 L280,410 Q270,370 285,345 Z" fill="url(#skinBase)" />
                            <!-- Nail -->
                            <path d="M315,380 Q325,378 318,395 L305,398 Z" fill="url(#nailGrad)" />
                             <!-- Joint Crease -->
                             <path d="M295,345 Q300,350 298,360" fill="none" stroke="#8C5A3C" stroke-width="1.5" opacity="0.4" stroke-linecap="round" />
                        </g>

                        <!-- Ring Finger -->
                        <g transform="translate(0,0)">
                            <path d="M220,340 Q250,330 270,355 L260,405 Q230,395 210,370 Z" fill="url(#skinBase)" />
                            <path d="M265,360 Q285,370 280,420 L245,440 Q220,420 235,385 Z" fill="url(#skinBase)" />
                            <path d="M275,425 Q295,430 285,470 L250,480 Q240,440 255,415 Z" fill="url(#skinBase)" />
                            <!-- Nail -->
                            <path d="M280,450 Q290,448 283,465 L270,468 Z" fill="url(#nailGrad)" />
                        </g>

                        <!-- Pinky Finger -->
                        <g transform="translate(0,0)">
                            <path d="M200,400 Q230,400 240,425 L230,470 Q200,460 190,430 Z" fill="url(#skinBase)" />
                            <path d="M235,430 Q255,440 245,485 L215,495 Q205,460 220,425 Z" fill="url(#skinBase)" />
                            <!-- Nail -->
                            <path d="M240,470 Q250,468 243,485 L230,488 Z" fill="url(#nailGrad)" />
                        </g>
                    </g>

                    <!-- CRITIQUE 3: Phone with Unified Bezel -->
                    <g id="phone-device">
                        <!-- Main Body (Solid Compound Path feel) -->
                        <rect x="200" y="0" width="220" height="800" rx="35" fill="url(#phoneBodyGrad)" />
                        
                        <!-- Bezel Highlights (Top Left Light Source) -->
                        <rect x="202" y="2" width="216" height="796" rx="33" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.15" />
                        <path d="M200,35 L200,765 A35,35 0 0,0 235,800 L435,800" fill="none" stroke="#000" stroke-width="4" opacity="0.6" /> <!-- Bottom/Right shadow edge -->

                        <!-- Screen Area -->
                        <rect x="212" y="12" width="196" height="776" rx="25" fill="url(#screenGlass)" />

                        <!-- Screen Content (Abstract UI) -->
                        <g clip-path="url(#screenClip)">
                            <!-- Wallpaper -->
                            <rect x="212" y="12" width="196" height="776" fill="#15151A" />
                            
                            <!-- Abstract UI Cards -->
                            <rect x="225" y="150" width="170" height="120" rx="12" fill="#FFFFFF" opacity="0.05" />
                            <rect x="225" y="300" width="170" height="180" rx="12" fill="#FFFFFF" opacity="0.03" />
                            
                            <!-- UI Lines -->
                            <rect x="240" y="170" width="100" height="8" rx="4" fill="#FFFFFF" opacity="0.1" />
                            <rect x="240" y="190" width="140" height="6" rx="3" fill="#FFFFFF" opacity="0.05" />
                            <rect x="240" y="320" width="120" height="8" rx="4" fill="#FFFFFF" opacity="0.1" />
                            
                            <!-- Glare Reflection -->
                            <path d="M180,0 L450,0 L450,400 L180,600 Z" fill="#FFFFFF" opacity="0.03" />
                        </g>

                        <!-- Hardware Details -->
                        <g transform="translate(0, 0)">
                            <!-- Speaker -->
                            <rect x="295" y="45" width="30" height="4" rx="2" fill="#050505" opacity="0.8" />
                            <!-- Camera -->
                            <circle cx="300" cy="47" r="2.5" fill="#000" />
                            <circle cx="300" cy="47" r="1" fill="#222" />
                        </g>
                    </g>

                    <!-- CRITIQUE 2 & 3: Hand (Front Layer - Thumb & Palm) -->
                    <g id="hand-front">
                        <!-- Palm Base -->
                        <path d="M180,600 Q140,700 160,800 L320,800 Q350,700 320,600 Z" fill="url(#skinBase)" />
                        <!-- Palm Shadow (Depth) -->
                        <path d="M180,600 Q140,700 160,800 L320,800 Q350,700 320,600 Z" fill="url(#skinShadow)" opacity="0.5" />

                        <!-- Thumb Construction -->
                        <g id="thumb">
                            <!-- Proximal Phalanx (Base) -->
                            <path d="M280,550 Q340,520 360,450 L320,430 Q300,490 250,520 Z" fill="url(#skinBase)" />
                            <!-- Distal Phalanx (Tip) -->
                            <path d="M350,445 Q380,400 370,350 L330,360 Q340,410 320,430 Z" fill="url(#skinBase)" />
                            
                            <!-- Joint Creases -->
                            <path d="M335,455 Q345,465 340,480" fill="none" stroke="#8C5A3C" stroke-width="2" opacity="0.6" stroke-linecap="round" />
                            <path d="M350,400 Q360,405 355,415" fill="none" stroke="#8C5A3C" stroke-width="1.5" opacity="0.5" stroke-linecap="round" />

                            <!-- Nail -->
                            <path d="M365,355 Q375,350 372,340 Q365,342 358,350 Z" fill="url(#nailGrad)" />
                            <path d="M362,348 Q368,344 365,350" fill="none" stroke="#D49A78" stroke-width="1" opacity="0.6" />
                        </g>

                        <!-- CRITIQUE 3: Cast Shadow on Phone (The Pressure Point) -->
                        <!-- This shadow proves the hand is touching the device -->
                        <path d="M310,400 Q340,390 370,420 L360,460 Q330,460 300,430 Z" fill="#000000" opacity="0.5" filter="url(#contactShadow)" style="mix-blend-mode: multiply;" />
                    </g>

                </g>
            </svg>
        </div>
    </main>

    <div class="hint">
        <span>Interactive Depth</span>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const svgElement = document.querySelector('svg');
        const thumbGroup = document.querySelector('#thumb');
        const fingersGroup = document.querySelector('#fingers-back');
        
        // Parallax / Tilt Effect
        document.addEventListener('mousemove', (e) => {
            // Calculate normalized mouse position (-1 to 1)
            const xNorm = (e.clientX / window.innerWidth) * 2 - 1;
            const yNorm = (e.clientY / window.innerHeight) * 2 - 1;

            // 1. Rotate entire scene slightly (3D feel)
            // Rotating around center
            const rotateY = xNorm * 5; // Max 5 deg rotation
            const rotateX = -yNorm * 5;
            svgElement.style.transform = `rotateY(${rotateY}deg) rotateX(${rotateX}deg)`;

            // 2. Parallax layers (Simulating depth of field / macro focus)
            // Thumb moves faster than fingers (closer to camera)
            // Fingers move slower or opposite direction (further away)
            
            if(thumbGroup) {
                const moveX = xNorm * 8;
                const moveY = yNorm * 8;
                thumbGroup.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }

            if(fingersGroup) {
                const moveX = xNorm * -3; // Moves opposite to create depth
                const moveY = yNorm * -3;
                fingersGroup.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }
        });

        // Reset on mouse leave
        document.addEventListener('mouseleave', () => {
            svgElement.style.transform = `rotateY(0deg) rotateX(0deg)`;
            if(thumbGroup) thumbGroup.style.transform = `translate(0px, 0px)`;
            if(fingersGroup) fingersGroup.style.transform = `translate(0px, 0px)`;
        });
    });
</script>
</body>
</html>
