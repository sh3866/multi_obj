<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Grip | Editorial Illustration</title>
<style>
    :root {
        --bg: #EAE8E3;
        --text: #1a1a1a;
        --accent: #D9534F;
        --font-main: "Helvetica Neue", Helvetica, Arial, sans-serif;
        --font-mono: "Menlo", "Courier New", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font-main);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    /* Grain Overlay for Editorial Texture */
    .grain {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 10;
        opacity: 0.04;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* UI Layout */
    header {
        padding: 1.5rem 2.5rem;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        z-index: 5;
    }

    h1 {
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        text-transform: uppercase;
    }

    .meta {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: #666;
        text-align: right;
        line-height: 1.4;
    }

    main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* The SVG Container */
    .art-stage {
        width: 100%;
        height: 100%;
        max-width: 1200px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    svg {
        height: 85vh;
        width: auto;
        filter: drop-shadow(0 30px 60px rgba(0,0,0,0.2));
        transition: transform 0.1s ease-out;
    }

    /* Typography Overlay on Image */
    .overlay-text {
        position: absolute;
        top: 12%;
        left: 6%;
        z-index: 2;
        mix-blend-mode: multiply;
        pointer-events: none;
    }

    /* CRITIQUE 4: Reduced scale significantly (approx 60%) */
    .big-type {
        font-size: 5vw; 
        line-height: 0.9;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #111;
        text-transform: uppercase;
        opacity: 0.85;
    }

    .sub-type {
        font-size: 1.2vw;
        font-weight: 400;
        margin-top: 0.8rem;
        display: block;
        max-width: 280px;
        line-height: 1.4;
        color: #333;
    }

    /* Interactive Hint */
    .hint {
        position: absolute;
        bottom: 1.5rem;
        right: 2.5rem;
        font-family: var(--font-mono);
        font-size: 0.65rem;
        text-transform: uppercase;
        color: #888;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    .hint::before {
        content: '';
        width: 20px;
        height: 1px;
        background: #888;
    }

    /* SVG Styles */
    .skin-shadow { fill: url(#skinShadow); }
    .skin-base { fill: url(#skinBase); }
    .skin-highlight { fill: url(#skinHighlight); }
    .phone-body { fill: url(#phoneGradient); }
    .screen-glass { fill: url(#screenGradient); }
    
    /* Animation classes */
    .interactive-group { transition: transform 0.1s ease-out; }

</style>
</head>
<body>

    <div class="grain"></div>

    <header>
        <h1>Anatomy of Interaction</h1>
        <div class="meta">
            FIG. 05 — MACRO LENS<br>
            RENDER: VECTOR/SVG<br>
            SCALE: 1:1
        </div>
    </header>

    <main>
        <!-- CRITIQUE 4: Moved to center/left to balance visual weight -->
        <div class="overlay-text">
            <div class="big-type">Tactile<br>Reality</div>
            <span class="sub-type">The intersection of biological intent and digital response.</span>
        </div>

        <div class="art-stage">
            <!-- CRITIQUE 2: Aggressive Crop - ViewBox changed to zoom in on the grip -->
            <!-- CRITIQUE 1 & 3: Reconstructed Anatomy & Depth -->
            <svg viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- CRITIQUE 1: Detailed Skin Gradients -->
                    <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#E8C3A6" />
                        <stop offset="60%" stop-color="#D49A78" />
                        <stop offset="100%" stop-color="#A86A4A" />
                    </linearGradient>
                    
                    <radialGradient id="skinShadow" cx="20%" cy="20%" r="90%">
                        <stop offset="0%" stop-color="#D49A78" stop-opacity="0" />
                        <stop offset="80%" stop-color="#7A4F34" stop-opacity="0.6" />
                        <stop offset="100%" stop-color="#5A3520" stop-opacity="0.9" />
                    </radialGradient>

                    <linearGradient id="skinHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
                         <stop offset="0%" stop-color="#FCEAE0" stop-opacity="0.4"/>
                         <stop offset="100%" stop-color="#FCEAE0" stop-opacity="0"/>
                    </linearGradient>

                    <!-- Phone Hardware Gradients -->
                    <linearGradient id="phoneGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#050505" />
                        <stop offset="10%" stop-color="#333333" /> <!-- Edge Light -->
                        <stop offset="50%" stop-color="#111111" />
                        <stop offset="100%" stop-color="#000000" />
                    </linearGradient>
                    
                    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#2B2B38" />
                        <stop offset="50%" stop-color="#16161E" />
                        <stop offset="100%" stop-color="#050508" />
                    </linearGradient>

                    <!-- Filters -->
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="4" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                    
                    <filter id="shadowBlur">
                        <feGaussianBlur stdDeviation="3" />
                    </filter>

                    <!-- Clip Paths -->
                    <clipPath id="phoneClip">
                        <rect x="200" y="50" width="220" height="600" rx="30" />
                    </clipPath>
                </defs>

                <!-- Background (Cleaned up) -->
                <circle cx="350" cy="350" r="400" fill="#E0DED8" opacity="0.4" />

                <g id="scene" class="interactive-group">
                    
                    <!-- CRITIQUE 1: Detailed Fingers (Back Layer) -->
                    <!-- Distinct Phalanges and Knuckles -->
                    <g id="fingers" transform="translate(0,0)">
                        
                        <!-- Index Finger -->
                        <!-- Proximal -->
                        <path d="M280,160 Q310,140 340,170 L330,210 Q300,200 280,190 Z" class="skin-base" />
                        <!-- Middle -->
                        <path d="M330,175 Q355,180 355,210 L325,240 Q300,230 295,205 Z" class="skin-base" />
                        <!-- Distal (Tip) -->
                        <path d="M350,210 Q370,220 360,245 L325,240 Q320,215 330,195 Z" class="skin-base" />
                        <!-- Knuckle Joint -->
                        <path d="M335,180 Q340,185 335,190" fill="none" stroke="#A86A4A" stroke-width="2" opacity="0.5"/>
                        <!-- Nail -->
                        <path d="M355,225 Q362,222 358,235 L345,238 Z" fill="#F0D0B5" opacity="0.8" />

                        <!-- Middle Finger -->
                        <!-- Proximal -->
                        <path d="M260,200 Q290,190 315,220 L305,260 Q275,250 255,230 Z" class="skin-base" />
                        <!-- Middle -->
                        <path d="M310,225 Q330,235 325,270 L295,300 Q270,290 270,255 Z" class="skin-base" />
                        <!-- Distal (Tip) -->
                        <path d="M320,270 Q340,280 330,310 L295,300 Q290,275 305,255 Z" class="skin-base" />
                        <!-- Knuckle Joint -->
                        <path d="M312,235 Q318,240 312,245" fill="none" stroke="#A86A4A" stroke-width="2" opacity="0.5"/>
                        <!-- Nail -->
                        <path d="M325,285 Q332,282 328,295 L315,298 Z" fill="#F0D0B5" opacity="0.8" />

                        <!-- Ring Finger -->
                        <!-- Proximal -->
                        <path d="M240,250 Q270,250 290,280 L280,320 Q250,310 235,280 Z" class="skin-base" />
                        <!-- Middle -->
                        <path d="M285,285 Q300,300 295,330 L265,360 Q240,350 240,315 Z" class="skin-base" />
                        <!-- Distal (Tip) -->
                        <path d="M290,330 Q305,340 295,365 L265,360 Q260,335 275,315 Z" class="skin-base" />
                        <!-- Knuckle Joint -->
                        <path d="M288,295 Q294,300 288,305" fill="none" stroke="#A86A4A" stroke-width="2" opacity="0.5"/>
                        <!-- Nail -->
                        <path d="M290,345 Q297,342 293,355 L280,358 Z" fill="#F0D0B5" opacity="0.8" />

                        <!-- Pinky Finger (Shortest) -->
                        <!-- Proximal -->
                        <path d="M220,310 Q250,320 260,350 L250,380 Q220,370 210,340 Z" class="skin-base" />
                        <!-- Distal (Tip) -->
                        <path d="M255,355 Q270,370 260,395 L240,390 Q230,365 245,345 Z" class="skin-base" />
                        <!-- Nail -->
                        <path d="M255,375 Q262,372 258,385 L245,388 Z" fill="#F0D0B5" opacity="0.8" />
                    </g>

                    <!-- CRITIQUE 3: The Smartphone with Hardware Details -->
                    <g id="phone">
                        <!-- Main Body -->
                        <rect x="200" y="50" width="220" height="600" rx="30" class="phone-body" />
                        
                        <!-- Metallic Rim Highlight -->
                        <rect x="202" y="52" width="216" height="596" rx="28" fill="none" stroke="#555" stroke-width="1" opacity="0.5" />
                        <rect x="198" y="48" width="224" height="604" rx="32" fill="none" stroke="#000" stroke-width="3" opacity="0.8" />

                        <!-- Screen Area -->
                        <rect x="208" y="58" width="204" height="584" rx="22" class="screen-glass" />

                        <!-- Screen Content (Abstract UI) -->
                        <g clip-path="url(#phoneClip)">
                            <!-- Abstract Wallpaper -->
                            <rect x="208" y="58" width="204" height="584" fill="#1A1A24" />
                            
                            <!-- UI Elements -->
                            <rect x="220" y="120" width="180" height="100" rx="10" fill="#FFFFFF" opacity="0.03" />
                            <rect x="220" y="250" width="180" height="150" rx="10" fill="#FFFFFF" opacity="0.02" />
                            
                            <!-- CRITIQUE 3: Screen Glare (Realistic Lighting) -->
                            <path d="M190,50 L450,50 L450,300 L190,600 Z" fill="white" opacity="0.04" />
                            
                            <!-- Glowing Notification -->
                            <circle cx="370" cy="100" r="3" fill="#D9534F" filter="url(#glow)" />
                        </g>

                        <!-- CRITIQUE 3: Hardware Details (Camera/Speaker) -->
                        <g transform="translate(0, 50)">
                            <!-- Speaker Slit -->
                            <rect x="295" y="65" width="30" height="4" rx="2" fill="#000" opacity="0.8" />
                            <!-- Camera Lens -->
                            <circle cx="300" cy="67" r="1.5" fill="#111" />
                            <circle cx="300" cy="67" r="0.5" fill="#333" />
                        </g>
                    </g>

                    <!-- CRITIQUE 1 & 3: The Hand (Front Layer - Thumb & Palm) -->
                    <g id="palm-thumb" class="interactive-thumb">
                        <!-- Palm Base (Connecting to wrist) -->
                        <path d="M180,500 Q150,650 180,750 L320,750 Q340,600 320,500 Z" class="skin-base" />
                        <!-- Palm Shadow -->
                        <path d="M180,500 Q150,650 180,750 L320,750 Q340,600 320,500 Z" class="skin-shadow" opacity="0.4" />
                        
                        <!-- CRITIQUE 1: Detailed Thumb Construction -->
                        <!-- Proximal Phalanx (Thick base) -->
                        <path d="M280,520 Q330,500 350,440 L320,420 Q300,470 260,490 Z" class="skin-base" />
                        <!-- Distal Phalanx (Tip) -->
                        <path d="M340,435 Q370,400 360,360 L330,370 Q340,410 320,425 Z" class="skin-base" />
                        
                        <!-- Skin Texture / Joint Lines -->
                        <path d="M330,440 Q340,450 335,460" fill="none" stroke="#8C5A3C" stroke-width="2" opacity="0.6" stroke-linecap="round" />
                        <path d="M345,390 Q355,395 350,405" fill="none" stroke="#8C5A3C" stroke-width="1.5" opacity="0.5" stroke-linecap="round" />

                        <!-- Nail (Detailed) -->
                        <path d="M358,365 Q365,360 362,355 Q355,358 350,365 Z" fill="#F5D0B5" opacity="0.9" />
                        <path d="M355,362 Q360,358 358,365" fill="none" stroke="#E0B090" stroke-width="1" opacity="0.6" />

                        <!-- CRITIQUE 3: Cast Shadow on Phone -->
                        <!-- The shadow follows the curve of the thumb onto the screen -->
                        <path d="M310,400 Q340,390 360,420 L350,460 Q320,460 300,430 Z" fill="black" opacity="0.4" filter="url(#shadowBlur)" style="mix-blend-mode: multiply;" />
                    </g>

                </g>
            </svg>
        </div>
    </main>

    <div class="hint">
        <span>Move cursor to interact</span>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const svgElement = document.querySelector('svg');
        const thumbGroup = document.querySelector('.interactive-thumb');
        
        // Parallax / Tilt Effect
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 80;
            const y = (window.innerHeight / 2 - e.pageY) / 80;

            // Subtle rotation of the entire SVG
            svgElement.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;

            // Thumb interaction (slight movement to simulate breathing/holding tension)
            // Moving thumb independently creates a "living" feel
            if(thumbGroup) {
                const thumbX = x * 0.8;
                const thumbY = y * 0.8;
                thumbGroup.style.transform = `translate(${thumbX}px, ${thumbY}px)`;
            }
        });

        // Reset on mouse leave
        document.addEventListener('mouseleave', () => {
            svgElement.style.transform = `rotateY(0deg) rotateX(0deg)`;
            if(thumbGroup) thumbGroup.style.transform = `translate(0px, 0px)`;
        });
    });
</script>
</body>
</html>
