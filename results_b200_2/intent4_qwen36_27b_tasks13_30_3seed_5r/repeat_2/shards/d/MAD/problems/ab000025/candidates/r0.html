<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Grip | Editorial Illustration</title>
<style>
    :root {
        --bg: #EAE8E3;
        --text: #1a1a1a;
        --accent: #D9534F;
        --font-main: "Helvetica Neue", Helvetica, Arial, sans-serif;
        --font-mono: "Menlo", "Courier New", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font-main);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    /* Grain Overlay for Editorial Texture */
    .grain {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 10;
        opacity: 0.04;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* UI Layout */
    header {
        padding: 2rem 3rem;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        z-index: 5;
    }

    h1 {
        font-size: 1.2rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        text-transform: uppercase;
    }

    .meta {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: #666;
        text-align: right;
        line-height: 1.4;
    }

    main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* The SVG Container */
    .art-stage {
        width: 100%;
        height: 100%;
        max-width: 1400px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    svg {
        height: 90vh;
        width: auto;
        filter: drop-shadow(0 20px 40px rgba(0,0,0,0.15));
        transition: transform 0.1s ease-out;
    }

    /* Typography Overlay on Image */
    .overlay-text {
        position: absolute;
        top: 15%;
        left: 8%;
        z-index: 2;
        mix-blend-mode: multiply;
        pointer-events: none;
    }

    .big-type {
        font-size: 8vw;
        line-height: 0.85;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: #111;
        text-transform: uppercase;
        opacity: 0.9;
    }

    .sub-type {
        font-size: 1.5vw;
        font-weight: 500;
        margin-top: 1rem;
        display: block;
        max-width: 300px;
    }

    /* Interactive Hint */
    .hint {
        position: absolute;
        bottom: 2rem;
        right: 3rem;
        font-family: var(--font-mono);
        font-size: 0.7rem;
        text-transform: uppercase;
        color: #888;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    .hint::before {
        content: '';
        width: 20px;
        height: 1px;
        background: #888;
    }

    /* SVG Styles */
    .skin-shadow { fill: url(#skinShadow); }
    .skin-base { fill: url(#skinBase); }
    .phone-body { fill: url(#phoneGradient); }
    .screen-glass { fill: url(#screenGradient); }
    .screen-content { fill: url(#screenContent); }
    
    /* Animation classes */
    .thumb-move { transition: transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1); }

</style>
</head>
<body>

    <div class="grain"></div>

    <header>
        <h1>Anatomy of Interaction</h1>
        <div class="meta">
            FIG. 04 — CLOSE UP<br>
            RENDER: VECTOR/SVG<br>
            SCALE: 1:1
        </div>
    </header>

    <main>
        <div class="overlay-text">
            <div class="big-type">Tactile<br>Reality</div>
            <span class="sub-type">The intersection of biological intent and digital response.</span>
        </div>

        <div class="art-stage">
            <!-- SVG Illustration Start -->
            <svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Gradients for Skin -->
                    <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#EAC0A6" />
                        <stop offset="50%" stop-color="#DFA689" />
                        <stop offset="100%" stop-color="#C68E68" />
                    </linearGradient>
                    <radialGradient id="skinShadow" cx="30%" cy="30%" r="70%">
                        <stop offset="0%" stop-color="#EAC0A6" stop-opacity="0" />
                        <stop offset="80%" stop-color="#A86A4A" stop-opacity="0.4" />
                        <stop offset="100%" stop-color="#7A4F34" stop-opacity="0.8" />
                    </radialGradient>

                    <!-- Gradients for Phone -->
                    <linearGradient id="phoneGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#1A1A1A" />
                        <stop offset="15%" stop-color="#333333" /> <!-- Edge Highlight -->
                        <stop offset="50%" stop-color="#111111" />
                        <stop offset="100%" stop-color="#0A0A0A" />
                    </linearGradient>
                    
                    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#2A2A35" />
                        <stop offset="50%" stop-color="#15151A" />
                        <stop offset="100%" stop-color="#050508" />
                    </linearGradient>

                    <!-- Screen Glow -->
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="5" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                    
                    <!-- Clip Paths -->
                    <clipPath id="phoneClip">
                        <rect x="200" y="150" width="220" height="460" rx="30" />
                    </clipPath>
                </defs>

                <!-- Background Blob (Subtle) -->
                <circle cx="350" cy="450" r="300" fill="#E0DED8" opacity="0.5" />

                <g id="scene" transform="translate(0, 0)">
                    
                    <!-- 1. The Hand (Back Layer - Fingers) -->
                    <g id="fingers" transform="translate(0,0)">
                        <!-- Index -->
                        <path d="M280,200 Q330,180 350,220 L310,320 Q290,330 280,300 Z" class="skin-base" />
                        <path d="M280,200 Q330,180 350,220 L310,320 Q290,330 280,300 Z" class="skin-shadow" opacity="0.6" />
                        
                        <!-- Middle -->
                        <path d="M260,220 Q310,220 330,260 L290,350 Q270,360 260,330 Z" class="skin-base" />
                        <path d="M260,220 Q310,220 330,260 L290,350 Q270,360 260,330 Z" class="skin-shadow" opacity="0.7" />

                        <!-- Ring -->
                        <path d="M240,250 Q290,270 300,310 L260,380 Q240,390 230,350 Z" class="skin-base" />
                        <path d="M240,250 Q290,270 300,310 L260,380 Q240,390 230,350 Z" class="skin-shadow" opacity="0.8" />

                        <!-- Pinky (Shortest, wrapped tight) -->
                        <path d="M220,290 Q270,320 270,350 L240,400 Q220,400 210,360 Z" class="skin-base" />
                        <path d="M220,290 Q270,320 270,350 L240,400 Q220,400 210,360 Z" class="skin-shadow" opacity="0.9" />
                    </g>

                    <!-- 2. The Smartphone -->
                    <g id="phone">
                        <!-- Main Body -->
                        <rect x="200" y="150" width="220" height="460" rx="30" class="phone-body" />
                        
                        <!-- Metallic Rim Highlight -->
                        <rect x="202" y="152" width="216" height="456" rx="28" fill="none" stroke="#555" stroke-width="1" opacity="0.5" />
                        <rect x="199" y="149" width="222" height="462" rx="31" fill="none" stroke="#111" stroke-width="2" />

                        <!-- Screen Area -->
                        <rect x="208" y="158" width="204" height="444" rx="22" class="screen-glass" />

                        <!-- Screen Content (Abstract UI) -->
                        <g clip-path="url(#phoneClip)">
                            <!-- Wallpapers/Gradient -->
                            <rect x="208" y="158" width="204" height="444" fill="url(#screenContent)" />
                            <!-- UI Elements -->
                            <rect x="220" y="180" width="180" height="120" rx="10" fill="#FFFFFF" opacity="0.05" />
                            <rect x="220" y="320" width="180" height="80" rx="10" fill="#FFFFFF" opacity="0.03" />
                            
                            <!-- Dynamic Light Reflection on Screen -->
                            <path d="M200,150 L450,150 L450,250 L200,450 Z" fill="white" opacity="0.03" />
                            
                            <!-- Glowing Notification -->
                            <circle cx="380" cy="200" r="4" fill="#D9534F" filter="url(#glow)" />
                        </g>

                        <!-- Front Camera/Speaker -->
                        <rect x="290" y="165" width="40" height="4" rx="2" fill="#000" opacity="0.8" />
                        <circle cx="300" cy="167" r="1.5" fill="#111" />
                    </g>

                    <!-- 3. The Hand (Front Layer - Thumb & Palm) -->
                    <g id="palm-thumb" class="thumb-move">
                        <!-- Palm Base connecting to wrist -->
                        <path d="M180,500 Q150,600 180,750 L300,750 Q320,600 300,500 Z" class="skin-base" />
                        <path d="M180,500 Q150,600 180,750 L300,750 Q320,600 300,500 Z" class="skin-shadow" opacity="0.5" />
                        
                        <!-- The Thumb (The Focal Point) -->
                        <!-- Proximal Phalanx -->
                        <path d="M280,520 Q320,500 340,450 L310,430 Q290,470 260,490 Z" class="skin-base" />
                        <!-- Distal Phalanx (Tip) -->
                        <path d="M330,440 Q360,410 350,380 L320,390 Q330,420 310,435 Z" class="skin-base" />
                        
                        <!-- Thumb Joint Detail -->
                        <path d="M320,440 Q330,450 325,460" fill="none" stroke="#B07050" stroke-width="2" opacity="0.6" stroke-linecap="round" />
                        
                        <!-- Nail -->
                        <path d="M348,385 Q355,380 352,375 Q345,378 340,385 Z" fill="#F5D0B5" opacity="0.8" />
                        <path d="M345,382 Q350,378 348,385" fill="none" stroke="#E0B090" stroke-width="1" opacity="0.5" />

                        <!-- Contact Shadow on Phone (Cast by Thumb) -->
                        <path d="M300,400 Q330,390 350,420 L340,450 Q310,450 290,430 Z" fill="black" opacity="0.3" filter="url(#glow)" style="mix-blend-mode: multiply;" />
                    </g>

                </g>
            </svg>
        </div>
    </main>

    <div class="hint">
        <span>Move cursor to interact</span>
    </div>

<script>
    // Interaction Logic
    document.addEventListener('DOMContentLoaded', () => {
        const svgElement = document.querySelector('svg');
        const thumbGroup = document.getElementById('palm-thumb');
        const phoneGroup = document.getElementById('phone');
        
        // Parallax / Tilt Effect
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 60;
            const y = (window.innerHeight / 2 - e.pageY) / 60;

            // Subtle rotation of the entire SVG
            svgElement.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;

            // Thumb interaction (slight movement to simulate breathing/holding)
            // Only move the thumb slightly relative to the rest
            if(thumbGroup) {
                const thumbX = x * 0.5;
                const thumbY = y * 0.5;
                thumbGroup.style.transform = `translate(${thumbX}px, ${thumbY}px)`;
            }
        });

        // Reset on mouse leave
        document.addEventListener('mouseleave', () => {
            svgElement.style.transform = `rotateY(0deg) rotateX(0deg)`;
            if(thumbGroup) thumbGroup.style.transform = `translate(0px, 0px)`;
        });
    });
</script>
</body>
</html>
