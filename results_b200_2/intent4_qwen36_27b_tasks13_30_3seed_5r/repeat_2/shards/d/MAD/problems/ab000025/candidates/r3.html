<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactile Reality | Macro Editorial</title>
<style>
    :root {
        --bg: #EBE9E4;
        --text: #111111;
        --accent: #FF4D4D;
        --font-main: "Helvetica Neue", Helvetica, Arial, sans-serif;
        --font-mono: "Menlo", "Courier New", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font-main);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    /* Grain Overlay for Editorial Texture */
    .grain {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 20;
        opacity: 0.06;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Layout & Typography */
    header {
        position: absolute;
        top: 2rem;
        left: 2.5rem;
        z-index: 10;
        width: calc(100% - 5rem);
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        pointer-events: none;
    }

    .brand {
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        color: var(--text);
    }

    .meta {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: #666;
        text-align: right;
        line-height: 1.4;
    }

    /* Main Stage */
    main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        perspective: 1200px;
    }

    .art-stage {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    svg {
        height: 95vh;
        width: auto;
        filter: drop-shadow(0 30px 60px rgba(0,0,0,0.2));
        will-change: transform;
        transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Floating Typography */
    .overlay-text {
        position: absolute;
        top: 18%;
        right: 8%;
        z-index: 5;
        text-align: right;
        pointer-events: none;
        mix-blend-mode: multiply;
    }

    .big-type {
        font-size: 6.5vw; 
        line-height: 0.85;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: #0a0a0a;
        text-transform: uppercase;
        margin-bottom: 1rem;
    }

    .sub-type {
        font-size: 1.1vw;
        font-weight: 500;
        display: block;
        max-width: 300px;
        margin-left: auto;
        line-height: 1.3;
        color: #333;
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    /* Interactive Hint */
    .hint {
        position: absolute;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%);
        font-family: var(--font-mono);
        font-size: 0.6rem;
        text-transform: uppercase;
        color: #888;
        display: flex;
        align-items: center;
        gap: 0.8rem;
        opacity: 0.7;
        z-index: 10;
    }
    .hint::before, .hint::after {
        content: '';
        width: 6px;
        height: 6px;
        border: 1px solid #888;
        border-radius: 50%;
    }

    /* SVG Specifics */
    .interactive-group { will-change: transform; }
</style>
</head>
<body>

    <div class="grain"></div>

    <header>
        <div class="brand">Studio Vector</div>
        <div class="meta">
            PROJECT: HAPTIC<br>
            VIEW: MACRO / 85MM<br>
            STATUS: FINAL
        </div>
    </header>

    <main>
        <div class="overlay-text">
            <div class="big-type">Tactile<br>Reality</div>
            <span class="sub-type">Precision engineering meets biological intent. The grip that connects us.</span>
        </div>

        <div class="art-stage">
            <!-- ViewBox adjusted for full device framing -->
            <svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Skin: Soft, organic, warm with realistic gradients -->
                    <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#F5D0B8" /> <!-- Highlight -->
                        <stop offset="50%" stop-color="#E0B298" /> <!-- Midtone -->
                        <stop offset="100%" stop-color="#A86A4A" /> <!-- Shadow -->
                    </linearGradient>
                    
                    <!-- Skin Shadow for Depth -->
                    <radialGradient id="skinShadow" cx="60%" cy="60%" r="60%">
                        <stop offset="0%" stop-color="#8C5A3C" stop-opacity="0" />
                        <stop offset="100%" stop-color="#4A2C18" stop-opacity="0.6" />
                    </radialGradient>

                    <!-- Nail Gradient -->
                    <linearGradient id="nailGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#FFF0E6" />
                        <stop offset="100%" stop-color="#E3B89A" />
                    </linearGradient>

                    <!-- Phone Body: Dark, metallic -->
                    <linearGradient id="phoneBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#2a2a2a" />
                        <stop offset="20%" stop-color="#4a4a4a" /> <!-- Edge highlight -->
                        <stop offset="50%" stop-color="#111111" />
                        <stop offset="100%" stop-color="#050505" />
                    </linearGradient>

                    <!-- Screen Glass: Reflective void -->
                    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#22222B" />
                        <stop offset="100%" stop-color="#08080A" />
                    </linearGradient>

                    <!-- Filters -->
                    <filter id="softBlur">
                        <feGaussianBlur stdDeviation="6" />
                    </filter>
                    
                    <!-- Contact Shadow for Hand on Phone -->
                    <filter id="contactShadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="4" />
                        <feOffset dx="-2" dy="2" />
                        <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
                    </filter>
                    
                    <!-- Screen Clip -->
                    <clipPath id="screenClip">
                        <rect x="300" y="80" width="160" height="760" rx="20" />
                    </clipPath>
                </defs>

                <!-- Background Context -->
                <rect width="100%" height="100%" fill="transparent" />

                <g id="scene" class="interactive-group">
                    
                    <!-- LAYER 1: Back Fingers (Index, Middle, Ring, Pinky) -->
                    <!-- These wrap around the RIGHT edge of the phone -->
                    <g id="fingers-back">
                        <!-- Index Finger -->
                        <g transform="translate(0,0)">
                            <!-- Phalanx 1 -->
                            <path d="M300,250 Q340,230 380,250 L380,300 Q340,310 300,290 Z" fill="url(#skinBase)" />
                            <!-- Phalanx 2 -->
                            <path d="M375,255 Q410,260 410,310 L385,310 Q380,270 375,255 Z" fill="url(#skinBase)" />
                            <!-- Phalanx 3 (Tip) -->
                            <path d="M405,265 Q435,270 430,315 L405,315 Q400,280 405,265 Z" fill="url(#skinBase)" />
                            <!-- Nail -->
                            <path d="M415,280 Q425,280 422,300 L410,300 Z" fill="url(#nailGrad)" />
                            <!-- Joint Crease -->
                            <path d="M380,295 Q390,300 385,310" fill="none" stroke="#8C5A3C" stroke-width="1.5" opacity="0.5" stroke-linecap="round" />
                        </g>

                        <!-- Middle Finger -->
                        <g transform="translate(0,0)">
                            <path d="M290,320 Q330,300 370,320 L370,370 Q330,390 290,360 Z" fill="url(#skinBase)" />
                            <path d="M365,325 Q400,330 400,380 L375,380 Q370,340 365,325 Z" fill="url(#skinBase)" />
                            <path d="M395,335 Q425,340 420,385 L395,385 Q390,350 395,335 Z" fill="url(#skinBase)" />
                            <!-- Nail -->
                            <path d="M405,350 Q415,350 412,370 L400,370 Z" fill="url(#nailGrad)" />
                             <!-- Joint Crease -->
                             <path d="M370,365 Q380,370 375,380" fill="none" stroke="#8C5A3C" stroke-width="1.5" opacity="0.5" stroke-linecap="round" />
                        </g>

                        <!-- Ring Finger -->
                        <g transform="translate(0,0)">
                            <path d="M280,390 Q320,380 350,395 L350,445 Q310,465 280,430 Z" fill="url(#skinBase)" />
                            <path d="M345,400 Q375,405 375,455 L350,455 Q345,415 345,400 Z" fill="url(#skinBase)" />
                            <path d="M370,410 Q395,415 390,460 L370,460 Q365,425 370,410 Z" fill="url(#skinBase)" />
                            <!-- Nail -->
                            <path d="M380,425 Q390,425 387,445 L375,445 Z" fill="url(#nailGrad)" />
                        </g>

                        <!-- Pinky Finger -->
                        <g transform="translate(0,0)">
                            <path d="M270,460 Q300,460 330,475 L330,520 Q290,530 270,500 Z" fill="url(#skinBase)" />
                            <path d="M325,480 Q350,485 350,530 L325,530 Q320,495 325,480 Z" fill="url(#skinBase)" />
                            <!-- Nail -->
                            <path d="M335,495 Q345,495 342,515 L330,515 Z" fill="url(#nailGrad)" />
                        </g>
                    </g>

                    <!-- LAYER 2: The Phone -->
                    <g id="phone-device">
                        <!-- Main Body -->
                        <rect x="280" y="20" width="180" height="880" rx="30" fill="url(#phoneBodyGrad)" />
                        
                        <!-- Bezel Highlights -->
                        <rect x="282" y="22" width="176" height="876" rx="28" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.2" />
                        <path d="M280,50 L280,930 A30,30 0 0,0 310,960 L460,960" fill="none" stroke="#000" stroke-width="6" opacity="0.5" />

                        <!-- Screen Area -->
                        <rect x="292" y="32" width="156" height="856" rx="20" fill="url(#screenGlass)" />

                        <!-- Screen Content (Abstract UI) -->
                        <g clip-path="url(#screenClip)">
                            <!-- Wallpaper -->
                            <rect x="292" y="32" width="156" height="856" fill="#15151A" />
                            
                            <!-- Abstract UI Cards -->
                            <rect x="305" y="200" width="130" height="100" rx="12" fill="#FFFFFF" opacity="0.05" />
                            <rect x="305" y="330" width="130" height="140" rx="12" fill="#FFFFFF" opacity="0.03" />
                            
                            <!-- UI Lines -->
                            <rect x="320" y="220" width="80" height="8" rx="4" fill="#FFFFFF" opacity="0.1" />
                            <rect x="320" y="240" width="110" height="6" rx="3" fill="#FFFFFF" opacity="0.05" />
                            <rect x="320" y="350" width="90" height="8" rx="4" fill="#FFFFFF" opacity="0.1" />
                            
                            <!-- Glare Reflection -->
                            <path d="M250,0 L500,0 L500,400 L250,700 Z" fill="#FFFFFF" opacity="0.04" />
                        </g>

                        <!-- Hardware Details (Notch/Camera) -->
                        <g transform="translate(0, 0)">
                            <!-- Speaker -->
                            <rect x="340" y="60" width="30" height="4" rx="2" fill="#050505" opacity="0.8" />
                            <!-- Camera -->
                            <circle cx="365" cy="62" r="3" fill="#000" />
                            <circle cx="365" cy="62" r="1.5" fill="#222" />
                        </g>
                    </g>

                    <!-- LAYER 3: Hand (Front Layer - Palm & Thumb) -->
                    <g id="hand-front">
                        <!-- Palm Base -->
                        <!-- Connects seamlessly to wrist and fingers -->
                        <path d="M260,700 Q220,800 240,1000 L400,1000 Q420,800 380,700 Z" fill="url(#skinBase)" />
                        <!-- Palm Shadow (Depth) -->
                        <path d="M260,700 Q220,800 240,1000 L400,1000 Q420,800 380,700 Z" fill="url(#skinShadow)" opacity="0.4" />

                        <!-- Thumb Construction -->
                        <g id="thumb">
                            <!-- Proximal Phalanx (Base) -->
                            <path d="M350,650 Q400,620 420,550 L380,530 Q360,600 320,630 Z" fill="url(#skinBase)" />
                            <!-- Distal Phalanx (Tip) -->
                            <path d="M410,545 Q440,500 430,450 L390,460 Q400,510 380,530 Z" fill="url(#skinBase)" />
                            
                            <!-- Joint Creases -->
                            <path d="M395,555 Q405,565 400,580" fill="none" stroke="#8C5A3C" stroke-width="2" opacity="0.6" stroke-linecap="round" />
                            <path d="M410,500 Q420,505 415,515" fill="none" stroke="#8C5A3C" stroke-width="1.5" opacity="0.5" stroke-linecap="round" />

                            <!-- Nail -->
                            <path d="M425,455 Q435,450 432,440 Q425,442 418,450 Z" fill="url(#nailGrad)" />
                            <path d="M422,448 Q428,444 425,450" fill="none" stroke="#D49A78" stroke-width="1" opacity="0.6" />
                        </g>

                        <!-- CRITICAL: Cast Shadow on Phone (The Pressure Point) -->
                        <!-- This shadow sits ON TOP of the screen, proving the thumb is in front -->
                        <path d="M380,460 Q410,450 440,480 L430,520 Q400,520 370,490 Z" fill="#000000" opacity="0.6" filter="url(#contactShadow)" style="mix-blend-mode: multiply;" />
                    </g>

                </g>
            </svg>
        </div>
    </main>

    <div class="hint">
        <span>Interactive Depth</span>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const svgElement = document.querySelector('svg');
        const thumbGroup = document.querySelector('#thumb');
        const fingersGroup = document.querySelector('#fingers-back');
        
        // Parallax / Tilt Effect
        document.addEventListener('mousemove', (e) => {
            // Calculate normalized mouse position (-1 to 1)
            const xNorm = (e.clientX / window.innerWidth) * 2 - 1;
            const yNorm = (e.clientY / window.innerHeight) * 2 - 1;

            // 1. Rotate entire scene slightly (3D feel)
            const rotateY = xNorm * 5; 
            const rotateX = -yNorm * 5;
            svgElement.style.transform = `rotateY(${rotateY}deg) rotateX(${rotateX}deg)`;

            // 2. Parallax layers (Simulating depth of field / macro focus)
            // Thumb moves faster than fingers (closer to camera)
            if(thumbGroup) {
                const moveX = xNorm * 12;
                const moveY = yNorm * 12;
                thumbGroup.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }

            // Fingers move slower or opposite direction (further away)
            if(fingersGroup) {
                const moveX = xNorm * -4; 
                const moveY = yNorm * -4;
                fingersGroup.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }
        });

        // Reset on mouse leave
        document.addEventListener('mouseleave', () => {
            svgElement.style.transform = `rotateY(0deg) rotateX(0deg)`;
            if(thumbGroup) thumbGroup.style.transform = `translate(0px, 0px)`;
            if(fingersGroup) fingersGroup.style.transform = `translate(0px, 0px)`;
        });
    });
</script>
</body>
</html>
