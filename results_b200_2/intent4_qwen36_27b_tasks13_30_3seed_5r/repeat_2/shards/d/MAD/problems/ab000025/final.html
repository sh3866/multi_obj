<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Haptic | Design Revision</title>
<style>
    :root {
        --bg: #EAE8E3;
        --text: #1A1A1A;
        --font-main: "Helvetica Neue", Helvetica, Arial, sans-serif;
        --font-mono: "Menlo", "Courier New", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font-main);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    /* Grain Overlay - Editorial Texture */
    .grain {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 20;
        opacity: 0.04;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Layout */
    main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        perspective: 1200px;
    }

    .art-stage {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    svg {
        /* Fill the vertical space for the macro crop */
        height: 110vh; 
        width: auto;
        /* Subtle initial shadow */
        filter: drop-shadow(0 20px 60px rgba(0,0,0,0.2));
        will-change: transform;
        transition: transform 0.1s cubic-bezier(0.1, 0.7, 1.0, 0.1);
    }

    /* Minimal UI Overlay */
    .ui-layer {
        position: absolute;
        bottom: 2rem;
        left: 2rem;
        z-index: 30;
        pointer-events: none;
    }
    
    .meta-tag {
        font-family: var(--font-mono);
        font-size: 0.6rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #888; /* Reduced opacity for cleaner background */
        display: flex;
        align-items: center;
        gap: 0.75rem;
        opacity: 0.6;
    }
    
    .meta-tag span {
        display: block;
        width: 15px;
        height: 1px;
        background: #999;
    }

    /* Animation classes */
    .interactive-group { will-change: transform; }
</style>
</head>
<body>

    <div class="grain"></div>

    <main>
        <div class="art-stage">
            <!-- 
                REVISION 2.0:
                - ViewBox: 600x1000 (Radical Crop).
                - Focus: Lower hand, lower phone body, intense grip detail.
                - Anatomy: Organic curves, distinct knuckles, nail beds.
                - Lighting: Unified directional light (Top-Right).
            -->
            <svg viewBox="0 0 600 1000" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- 1. SKIN MATERIALS -->
                    <linearGradient id="skinHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FDE0CC" /> 
                        <stop offset="100%" stop-color="#E8B49D" /> 
                    </linearGradient>
                    
                    <linearGradient id="skinMidtone" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#DFA98F" /> 
                        <stop offset="100%" stop-color="#C28363" /> 
                    </linearGradient>

                    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#A66F51" /> 
                        <stop offset="100%" stop-color="#70432A" /> 
                    </linearGradient>

                    <!-- 2. DEVICE MATERIALS -->
                    <linearGradient id="deviceBody" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#151515" />
                        <stop offset="15%" stop-color="#3A3A3A" /> <!-- Rim Light -->
                        <stop offset="20%" stop-color="#1A1A1A" />
                        <stop offset="90%" stop-color="#111111" />
                        <stop offset="100%" stop-color="#000000" />
                    </linearGradient>

                    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#181A20" />
                        <stop offset="50%" stop-color="#0B0C0F" />
                        <stop offset="100%" stop-color="#050507" />
                    </linearGradient>

                    <linearGradient id="glassGlare" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.1" />
                        <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" />
                        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
                    </linearGradient>

                    <!-- 3. FILTERS -->
                    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="12" result="blur" />
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.6"/>
                        </feComponentTransfer>
                    </filter>

                    <filter id="contactShadow" x="-20%" y="-20%" width="150%" height="150%">
                        <feGaussianBlur stdDeviation="4" result="blur" />
                        <feOffset dx="-2" dy="2" result="offsetBlur" />
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.8"/>
                        </feComponentTransfer>
                    </filter>

                    <filter id="bokeh">
                        <feGaussianBlur stdDeviation="20" />
                    </filter>
                    
                    <clipPath id="screenClip">
                        <rect x="210" y="80" width="180" height="840" rx="24" />
                    </clipPath>
                </defs>

                <!-- BACKGROUND: Clean, smooth, intentional -->
                <rect width="100%" height="100%" fill="#EAE8E3" />
                <g opacity="0.4" filter="url(#bokeh)">
                    <circle cx="450" cy="200" r="250" fill="#D4D0C8" />
                    <circle cx="100" cy="800" r="300" fill="#D8D5CE" />
                </g>

                <g id="scene" class="interactive-group">
                    
                    <!-- LAYER 1: BACK FINGERS (The Grip) -->
                    <!-- Fingers wrap around the LEFT edge -->
                    <g id="fingers-back" transform="translate(0,0)">
                        
                        <!-- Index Finger -->
                        <g id="finger-index" transform="translate(0, 20)">
                            <!-- Tip -->
                            <path d="M220,280 Q190,260 170,300 L170,350 Q200,350 220,330 Z" fill="url(#skinHighlight)" />
                            <!-- Middle -->
                            <path d="M220,330 L170,350 L180,410 L220,390 Z" fill="url(#skinMidtone)" />
                            <!-- Base/Crease -->
                            <path d="M180,410 L220,390 L240,430 L190,450 Z" fill="url(#skinShadow)" />
                            <!-- Knuckle Crease -->
                            <path d="M185,415 Q205,405 220,395" stroke="#5E3015" stroke-width="2" fill="none" opacity="0.5" />
                            <!-- Nail -->
                            <path d="M175,305 Q190,295 205,310 Q190,320 175,310 Z" fill="#FDF5EE" opacity="0.6" />
                        </g>

                        <!-- Middle Finger -->
                        <g id="finger-middle" transform="translate(0, 30)">
                            <path d="M215,400 Q180,380 160,420 L160,480 Q190,480 215,460 Z" fill="url(#skinHighlight)" />
                            <path d="M215,460 L160,480 L170,550 L220,530 Z" fill="url(#skinMidtone)" />
                            <path d="M170,550 L220,530 L240,570 L180,590 Z" fill="url(#skinShadow)" />
                            <path d="M175,555 Q195,545 215,535" stroke="#5E3015" stroke-width="2" fill="none" opacity="0.5" />
                            <path d="M165,425 Q180,415 195,430 Q180,440 165,430 Z" fill="#FDF5EE" opacity="0.6" />
                        </g>

                        <!-- Ring Finger -->
                        <g id="finger-ring" transform="translate(0, 25)">
                            <path d="M210,520 Q175,500 155,540 L155,600 Q185,600 210,580 Z" fill="url(#skinHighlight)" />
                            <path d="M210,580 L155,600 L165,670 L215,650 Z" fill="url(#skinMidtone)" />
                            <path d="M165,670 L215,650 L235,690 L175,710 Z" fill="url(#skinShadow)" />
                            <path d="M170,675 Q190,665 210,655" stroke="#5E3015" stroke-width="2" fill="none" opacity="0.5" />
                        </g>

                        <!-- Pinky Finger -->
                        <g id="finger-pinky" transform="translate(0, 15)">
                            <path d="M205,640 Q170,620 150,660 L150,720 Q180,720 205,700 Z" fill="url(#skinHighlight)" />
                            <path d="M205,700 L150,720 L160,780 L210,760 Z" fill="url(#skinMidtone)" />
                            <path d="M160,780 L210,760 L230,800 L170,820 Z" fill="url(#skinShadow)" />
                            <path d="M165,785 Q185,775 205,765" stroke="#5E3015" stroke-width="2" fill="none" opacity="0.5" />
                        </g>
                    </g>

                    <!-- LAYER 2: THE DEVICE (Phone) -->
                    <g id="phone-device">
                        <!-- Phone Body -->
                        <rect x="200" y="50" width="220" height="900" rx="35" fill="url(#deviceBody)" />
                        
                        <!-- Screen Area -->
                        <rect x="210" y="60" width="200" height="880" rx="24" fill="url(#screenGlass)" />
                        
                        <!-- Screen Content (Abstract UI) -->
                        <g clip-path="url(#screenClip)">
                            <rect x="230" y="200" width="160" height="120" rx="16" fill="#FFFFFF" opacity="0.04" />
                            <rect x="230" y="350" width="160" height="250" rx="16" fill="#FFFFFF" opacity="0.03" />
                            <rect x="240" y="220" width="100" height="10" rx="5" fill="#FFFFFF" opacity="0.1" />
                            <rect x="240" y="240" width="140" height="8" rx="4" fill="#FFFFFF" opacity="0.06" />
                            <rect x="240" y="380" width="120" height="12" rx="6" fill="#FFFFFF" opacity="0.1" />
                            <rect x="240" y="410" width="140" height="8" rx="4" fill="#FFFFFF" opacity="0.05" />
                        </g>

                        <!-- Screen Glare -->
                        <path d="M150,100 L550,100 L450,1100 L100,1100 Z" fill="url(#glassGlare)" style="mix-blend-mode: overlay;" />
                        
                        <!-- Hardware Details (Top Bezel) -->
                        <rect x="270" y="95" width="40" height="6" rx="3" fill="#000000" opacity="0.8" /> <!-- Speaker -->
                        <circle cx="340" cy="98" r="4" fill="#000000" /> <!-- Camera -->
                        <circle cx="340" cy="98" r="1.5" fill="#222222" /> <!-- Lens -->
                    </g>

                    <!-- LAYER 3: FRONT HAND (Palm, Wrist, Thumb) -->
                    <g id="hand-front">
                        
                        <!-- Palm & Wrist Base -->
                        <!-- Curves to support the phone weight -->
                        <path d="M180,750 Q150,900 120,1100 L350,1100 Q300,900 250,750 Z" fill="url(#skinMidtone)" />
                        
                        <!-- Palm Depth Shadow -->
                        <path d="M180,750 Q150,900 120,1100 L350,1100 Q300,900 250,750 Z" fill="url(#skinShadow)" opacity="0.4" />

                        <!-- THUMB (The Focal Point) -->
                        <g id="thumb">
                            <!-- Thumb Cast Shadow ON THE PHONE SCREEN -->
                            <path d="M320,550 Q400,530 450,600 L450,650 Q370,600 320,630 Z" fill="#000000" opacity="0.6" filter="url(#contactShadow)" style="mix-blend-mode: multiply;" />

                            <!-- Thumb Proximal Phalanx (Base) -->
                            <path d="M300,600 Q360,550 400,500 L360,450 Q320,530 270,570 Z" fill="url(#skinHighlight)" />
                            
                            <!-- Thumb Distal Phalanx (Tip) -->
                            <path d="M390,490 Q440,450 460,510 L420,550 Q380,530 360,460 Z" fill="url(#skinMidtone)" />
                            
                            <!-- Joint Crease (IP Joint) -->
                            <path d="M370,510 Q390,500 410,520" stroke="#5E3015" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round" />
                            
                            <!-- Thumbnail -->
                            <path d="M430,505 Q445,495 455,515 Q440,525 425,515 Z" fill="#FFF0E6" opacity="0.85" />
                            <path d="M430,505 Q445,495 455,515" stroke="#E3B89A" stroke-width="1" fill="none" />
                        </g>

                    </g>
                </g>
            </svg>
        </div>
    </main>

    <div class="ui-layer">
        <div class="meta-tag">
            <span></span>
            Rev 2.0 / Crop: Tight
        </div>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const svgElement = document.querySelector('svg');
        const thumbGroup = document.querySelector('#thumb');
        const fingersGroup = document.querySelector('#fingers-back');
        const palmGroup = document.querySelector('#hand-front');
        
        // Parallax Configuration
        const config = {
            sceneRotation: 6, // Reduced for tighter crop
            thumbParallax: 20, // Pixels
            fingersParallax: -8 // Pixels
        };

        document.addEventListener('mousemove', (e) => {
            // Normalized coordinates (-1 to 1)
            const xNorm = (e.clientX / window.innerWidth) * 2 - 1;
            const yNorm = (e.clientY / window.innerHeight) * 2 - 1;

            // 1. Device Rotation (Subtle)
            const rotateY = xNorm * (config.sceneRotation * 0.5);
            const rotateX = -yNorm * (config.sceneRotation * 0.5);
            svgElement.style.transform = `rotateY(${rotateY}deg) rotateX(${rotateX}deg)`;

            // 2. Depth Parallax
            
            // Thumb is closest to camera -> moves most
            if(thumbGroup) {
                const tx = xNorm * config.thumbParallax;
                const ty = yNorm * config.thumbParallax;
                thumbGroup.style.transform = `translate(${tx}px, ${ty}px)`;
            }

            // Palm is mid-ground -> moves moderately
            if(palmGroup) {
                const tx = xNorm * (config.thumbParallax * 0.6);
                const ty = yNorm * (config.thumbParallax * 0.6);
                palmGroup.style.transform = `translate(${tx}px, ${ty}px)`;
            }

            // Back fingers are furthest -> move least
            if(fingersGroup) {
                const tx = xNorm * config.fingersParallax;
                const ty = yNorm * config.fingersParallax;
                fingersGroup.style.transform = `translate(${tx}px, ${ty}px)`;
            }
        });

        // Reset on mouse leave
        document.addEventListener('mouseleave', () => {
            svgElement.style.transform = `rotateY(0deg) rotateX(0deg)`;
            if(thumbGroup) thumbGroup.style.transform = `translate(0px, 0px)`;
            if(palmGroup) palmGroup.style.transform = `translate(0px, 0px)`;
            if(fingersGroup) fingersGroup.style.transform = `translate(0px, 0px)`;
        });
    });
</script>
</body>
</html>
