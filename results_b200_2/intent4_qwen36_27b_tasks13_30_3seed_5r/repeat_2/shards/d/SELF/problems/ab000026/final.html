<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Play with Tiles</title>
<style>
  :root {
    /* Palette: Rich, tactile, premium */
    --wood-dark: #110a06;
    --wood-light: #2a1a12;
    --felt-top: #1b4d3e;
    --felt-mid: #0f2e25;
    --felt-bot: #040e0b;
    --tile-body: #f0ece4;
    --tile-shadow: #dcd4c3;
    --tile-black: #151515;
    --accent-gold: #f4d068;
    --accent-gold-dim: #b89f4b;
    --accent-red: #c94040;
    --ui-bg: rgba(0, 0, 0, 0.3);
    --ui-border: rgba(255, 255, 255, 0.1);
    --font-main: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    overflow: hidden;
    background-color: var(--wood-dark);
    font-family: var(--font-main);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* --- The Master Table --- */
  #game-container {
    position: relative;
    width: 100%; height: 100%;
    max-width: 1920px;
    display: flex;
    flex-direction: column;
    /* Wood Frame Texture */
    background: 
      radial-gradient(circle at 50% 50%, #3d261e 0%, #1a0f0a 70%, #000 100%);
    border: 12px solid #0a0604;
    box-shadow: inset 0 0 40px #000;
  }

  /* --- Felt Surface --- */
  #felt-surface {
    position: absolute;
    inset: 20px;
    border-radius: 24px;
    /* Felt Gradient */
    background: 
      radial-gradient(circle at 50% 30%, rgba(255,255,255,0.05) 0%, transparent 50%),
      linear-gradient(to bottom, var(--felt-top), var(--felt-mid) 60%, var(--felt-bot) 100%);
    box-shadow: 
      inset 0 0 100px rgba(0,0,0,0.9),
      0 0 0 1px rgba(255,255,255,0.05);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Felt Noise Texture */
  #felt-surface::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
    opacity: 0.6;
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  /* --- HUD --- */
  header {
    height: 90px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 48px;
    z-index: 20;
    background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, transparent 100%);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .brand-icon {
    width: 36px; height: 36px;
    background: var(--tile-body);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    border: 2px solid var(--accent-gold);
  }
  .brand-icon svg { width: 20px; height: 20px; }

  .brand-text {
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 2px;
    color: var(--accent-gold);
    text-transform: uppercase;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }

  .score-pill {
    background: var(--ui-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--ui-border);
    border-radius: 50px;
    padding: 10px 32px;
    display: flex;
    gap: 48px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }

  .score-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 40px;
  }

  .score-label { 
    font-size: 0.6rem; 
    color: #aaa; 
    text-transform: uppercase; 
    letter-spacing: 2px;
    margin-bottom: 4px; 
    font-weight: 700;
  }
  .score-val { 
    font-size: 1.5rem; 
    font-weight: 800; 
    font-variant-numeric: tabular-nums;
    color: #eee;
    line-height: 1;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }
  .score-val.active { 
    color: var(--accent-gold); 
    text-shadow: 0 0 20px rgba(244, 208, 104, 0.4);
  }

  /* --- The Board (Center) --- */
  #play-area {
    flex: 1;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  #board-chain {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 120px;
    min-width: min-content;
    min-height: 100px;
    transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* --- Player Zone (Bottom) --- */
  #player-zone {
    height: 240px;
    position: relative;
    z-index: 15;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 60px 48px 60px;
    background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 40%, transparent 100%);
  }

  #hand-container {
    display: flex;
    gap: 16px;
    padding-bottom: 20px;
    align-items: flex-end;
    flex: 1;
    justify-content: center;
    perspective: 1000px;
    height: 100%;
  }

  /* --- Tile Component --- */
  .tile {
    width: 64px;
    height: 128px;
    background: var(--tile-body);
    border-radius: 8px;
    position: relative;
    /* Realistic 3D Bevel & Shadow */
    box-shadow: 
      inset 1px 1px 2px rgba(255,255,255,0.9),
      inset -1px -1px 2px rgba(0,0,0,0.1),
      2px 2px 0px var(--tile-shadow),
      4px 8px 16px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s;
    border: 1px solid #ccc;
    /* Subtle texture on tile face */
    background-image: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 100%);
  }

  /* The Divider Line */
  .tile::after {
    content: '';
    position: absolute;
    top: 50%; left: 12px; right: 12px;
    height: 1px;
    background: rgba(0,0,0,0.2);
    box-shadow: 0 1px 0 rgba(255,255,255,0.8);
    z-index: 2;
  }

  .tile-half {
    flex: 1;
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 12px;
  }

  /* Pips - Embossed look */
  .pip {
    background: var(--tile-black);
    border-radius: 50%;
    width: 11px;
    height: 11px;
    align-self: center;
    justify-self: center;
    box-shadow: 
      inset 0 1px 2px rgba(0,0,0,1), 
      0 1px 0 rgba(255,255,255,0.1);
  }
  
  /* Pip Position Logic */
  .pip:nth-child(1) { grid-area: 1 / 1; }
  .pip:nth-child(2) { grid-area: 1 / 3; }
  .pip:nth-child(3) { grid-area: 2 / 2; }
  .pip:nth-child(4) { grid-area: 3 / 1; }
  .pip:nth-child(5) { grid-area: 3 / 3; }
  .pip:nth-child(6) { grid-area: 2 / 1; }
  .pip:nth-child(7) { grid-area: 2 / 3; }

  /* Visibility Classes */
  .count-1 .pip { grid-area: 2 / 2 !important; width: 13px; height: 13px; }
  .count-2 .pip:nth-child(n+3) { display: none; }
  .count-3 .pip:nth-child(1), .count-3 .pip:nth-child(2), .count-3 .pip:nth-child(4), .count-3 .pip:nth-child(5), .count-3 .pip:nth-child(6), .count-3 .pip:nth-child(7) { display: none; }
  .count-4 .pip:nth-child(3), .count-4 .pip:nth-child(6), .count-4 .pip:nth-child(7) { display: none; }
  .count-5 .pip:nth-child(6), .count-5 .pip:nth-child(7) { display: none; }
  .count-6 .pip:nth-child(3) { display: none; }

  /* Interactions */
  .tile.valid:hover {
    transform: translateY(-48px) scale(1.1);
    box-shadow: 0 30px 50px rgba(0,0,0,0.6), 2px 2px 0px var(--tile-shadow);
    z-index: 100;
    border-color: var(--accent-gold);
  }
  
  .tile.disabled {
    filter: brightness(0.85) grayscale(0.6);
    cursor: default;
    opacity: 0.6;
    transform: translateY(16px);
  }

  /* Board Tiles (Horizontal) */
  .tile.board-tile {
    width: 128px;
    height: 64px;
    flex-direction: row;
    transform: none !important;
    margin: 0 3px;
    cursor: default;
    box-shadow: 
      1px 1px 0px var(--tile-shadow), 
      2px 4px 10px rgba(0,0,0,0.5);
  }
  .tile.board-tile::after {
    width: 1px; height: 100%;
    top: 12px; left: 50%;
    transform: translateX(-50%);
  }
  
  /* Doubles on Board */
  .tile.board-tile.rot-90 { 
    transform: rotate(90deg) !important;
    margin: 0 16px;
    z-index: 2;
  }

  /* --- Controls --- */
  .draw-pile {
    width: 64px;
    height: 128px;
    background: linear-gradient(135deg, #3e2b22, #1f1410);
    border-radius: 8px;
    position: relative;
    box-shadow: 
      2px 2px 0 #111, 
      4px 8px 20px rgba(0,0,0,0.6);
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 1px solid rgba(255,255,255,0.08);
    transition: transform 0.2s;
  }
  .draw-pile::before {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 6px;
  }
  .draw-pile:hover { transform: translateY(-4px); }
  .draw-label {
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.7);
    text-transform: uppercase;
  }

  .action-btn {
    background: linear-gradient(to bottom, #4a3b32, #2e241e);
    border: none;
    color: #fff;
    padding: 16px 48px;
    border-radius: 8px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 0.9rem;
    cursor: pointer;
    box-shadow: 
      0 6px 0 #1a0f0a, 
      0 10px 20px rgba(0,0,0,0.5);
    transition: all 0.1s;
    border: 1px solid rgba(255,255,255,0.1);
    min-width: 140px;
  }
  .action-btn:active {
    transform: translateY(6px);
    box-shadow: 0 0 0 #1a0f0a, inset 0 2px 5px rgba(0,0,0,0.6);
  }
  .action-btn:disabled {
    background: #222;
    box-shadow: none;
    color: #555;
    cursor: not-allowed;
    transform: none;
    border-color: transparent;
    opacity: 0.7;
  }

  /* --- Match Cue (Floating) --- */
  #match-cue {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(255,255,255,0.95);
    color: #1a1a1a;
    padding: 12px 36px;
    border-radius: 50px;
    font-size: 0.9rem;
    font-weight: 800;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    z-index: 100;
    border: 2px solid var(--accent-gold);
    transition: opacity 0.4s, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #match-cue.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Animations */
  @keyframes dealTile {
    from { opacity: 0; transform: translateY(60px) scale(0.8); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .tile { animation: dealTile 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }

  /* Responsive adjustments */
  @media (max-width: 768px) {
    #felt-surface { inset: 8px; }
    #player-zone { padding: 0 20px 20px 20px; height: 180px; }
    .tile { width: 45px; height: 90px; }
    .tile.board-tile { width: 90px; height: 45px; }
    .tile.board-tile.rot-90 { margin: 0 6px; }
    #hand-container { gap: 6px; }
    header { padding: 0 15px; }
    .brand { font-size: 0.9rem; }
  }
</style>
</head>
<body>

<div id="game-container">
  <div id="felt-surface">
    
    <header>
      <div class="brand">
        <div class="brand-icon">
          <!-- Polished SVG Logo -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="2" width="16" height="20" rx="4" fill="#f4f1ea"/>
            <rect x="4" y="2" width="16" height="20" rx="4" stroke="#e5c565" stroke-width="2"/>
            <line x1="12" y1="2" x2="12" y2="22" stroke="#1a1a1a" stroke-width="1" opacity="0.2"/>
            <circle cx="8" cy="6" r="1.5" fill="#1a1a1a"/>
            <circle cx="16" cy="18" r="1.5" fill="#1a1a1a"/>
          </svg>
        </div>
        <div class="brand-text">Play with Tiles</div>
      </div>
      <div class="score-pill">
        <div class="score-block">
          <span class="score-label">You</span>
          <span class="score-val active" id="score-player">0</span>
        </div>
        <div class="score-block">
          <span class="score-label">Opp</span>
          <span class="score-val" id="score-opp">0</span>
        </div>
      </div>
    </header>

    <div id="play-area">
      <div id="match-cue">Match: 6 or 4</div>
      <div id="board-chain"></div>
    </div>

    <div id="player-zone">
      <div class="draw-pile" id="draw-btn">
        <span class="draw-label">Draw</span>
      </div>
      
      <div id="hand-container">
        <!-- Hand renders here -->
      </div>

      <button class="action-btn" id="pass-btn" disabled>Pass</button>
    </div>

  </div>
</div>

<script>
  // --- Game Logic ---
  class Tile {
    constructor(v1, v2, id) {
      this.v1 = v1;
      this.v2 = v2;
      this.id = id;
      this.isDouble = v1 === v2;
    }
  }

  const GameState = {
    deck: [],
    board: [],
    playerHand: [],
    opponentHand: [],
    turn: 'player',
    ends: { left: null, right: null },
    scores: { player: 0, opponent: 0 }
  };

  // Pip Grid Positions (1-9)
  const pipMap = {
    0: [],
    1: [5],
    2: [3, 7],
    3: [3, 5, 7],
    4: [1, 3, 7, 9],
    5: [1, 3, 5, 7, 9],
    6: [1, 3, 4, 6, 7, 9]
  };

  function initGame() {
    let idCounter = 0;
    for (let i = 0; i <= 6; i++) {
      for (let j = i; j <= 6; j++) {
        GameState.deck.push(new Tile(i, j, idCounter++));
      }
    }
    // Shuffle
    GameState.deck.sort(() => Math.random() - 0.5);
    GameState.playerHand = GameState.deck.splice(0, 7);
    GameState.opponentHand = GameState.deck.splice(0, 7);
    updateUI();
    checkTurn();
  }

  function createTileElement(tile, isBoard = false) {
    const el = document.createElement('div');
    el.className = `tile ${isBoard ? 'board-tile' : ''}`;
    el.dataset.id = tile.id;

    const halves = [tile.v1, tile.v2];
    halves.forEach(val => {
      const half = document.createElement('div');
      half.className = `tile-half count-${val}`;
      // Create 9 potential pip slots, show/hide based on value
      for(let i=1; i<=9; i++) {
        const pip = document.createElement('div');
        if(pipMap[val].includes(i)) pip.className = 'pip';
        half.appendChild(pip);
      }
      el.appendChild(half);
    });
    return el;
  }

  function renderHand() {
    const container = document.getElementById('hand-container');
    container.innerHTML = '';
    GameState.playerHand.forEach((tile, index) => {
      const el = createTileElement(tile);
      const isValid = isValidMove(tile);
      if (!isValid && GameState.turn === 'player') {
        el.classList.add('disabled');
      } else if (isValid && GameState.turn === 'player') {
        el.classList.add('valid');
      }
      el.style.animationDelay = `${index * 0.05}s`;
      el.addEventListener('click', () => {
        if (GameState.turn === 'player' && isValid) playTile(tile);
      });
      container.appendChild(el);
    });
  }

  function renderBoard() {
    const container = document.getElementById('board-chain');
    container.innerHTML = '';
    GameState.board.forEach(item => {
      const el = createTileElement(item.tile, true);
      if (item.tile.isDouble) el.classList.add('rot-90');
      if (item.orientation === 1) el.style.flexDirection = 'row-reverse';
      container.appendChild(el);
    });
    
    // Auto-scroll to center if needed
    const tableArea = document.getElementById('play-area');
    if (container.scrollWidth > tableArea.clientWidth) {
        tableArea.scrollLeft = (container.scrollWidth - tableArea.clientWidth) / 2;
    }
    updateMatchCue();
  }

  function updateUI() {
    renderHand();
    renderBoard();
    document.getElementById('score-player').innerText = GameState.scores.player;
    document.getElementById('score-opp').innerText = GameState.scores.opponent;
    
    document.getElementById('score-player').classList.toggle('active', GameState.turn === 'player');
    document.getElementById('score-opp').classList.toggle('active', GameState.turn === 'opponent');

    const drawBtn = document.getElementById('draw-btn');
    const passBtn = document.getElementById('pass-btn');

    if (GameState.turn === 'player') {
      drawBtn.style.opacity = '1';
      drawBtn.style.pointerEvents = 'auto';
      passBtn.disabled = canDrawOrPlay();
    } else {
      drawBtn.style.opacity = '0.5';
      drawBtn.style.pointerEvents = 'none';
      passBtn.disabled = true;
    }
  }

  function updateMatchCue() {
    const cue = document.getElementById('match-cue');
    if (GameState.board.length === 0) {
      cue.classList.remove('visible');
      return;
    }
    let leftVal = GameState.ends.left;
    let rightVal = GameState.ends.right;
    if (leftVal === rightVal) {
      cue.innerText = `Match: ${leftVal}`;
    } else {
      cue.innerText = `Match: ${leftVal} or ${rightVal}`;
    }
    cue.classList.add('visible');
  }

  function isValidMove(tile) {
    if (GameState.board.length === 0) return true;
    const { left, right } = GameState.ends;
    return (tile.v1 === left || tile.v2 === left || tile.v1 === right || tile.v2 === right);
  }

  function canDrawOrPlay() {
    if (GameState.deck.length > 0) return false;
    return !GameState.playerHand.some(t => isValidMove(t));
  }

  function playTile(tile) {
    GameState.playerHand = GameState.playerHand.filter(t => t.id !== tile.id);
    placeTileOnBoard(tile, 'player');
    GameState.turn = 'opponent';
    updateUI();
    setTimeout(aiTurn, 1000);
  }

  function placeTileOnBoard(tile, player) {
    if (GameState.board.length === 0) {
      GameState.board.push({ tile: tile, orientation: 0 });
      GameState.ends = { left: tile.v1, right: tile.v2 };
      return;
    }
    
    const { left, right } = GameState.ends;
    
    // Try Right
    if (tile.v1 === right || tile.v2 === right) {
      if (tile.v1 === right) {
        GameState.board.push({ tile: tile, orientation: 0 });
        GameState.ends.right = tile.v2;
      } else {
        GameState.board.push({ tile: tile, orientation: 1 });
        GameState.ends.right = tile.v1;
      }
      return;
    } 
    // Try Left
    else if (tile.v1 === left || tile.v2 === left) {
      if (tile.v2 === left) {
        GameState.board.unshift({ tile: tile, orientation: 0 });
        GameState.ends.left = tile.v1;
      } else {
        GameState.board.unshift({ tile: tile, orientation: 1 });
        GameState.ends.left = tile.v2;
      }
    }
  }

  function drawTile() {
    if (GameState.deck.length > 0 && GameState.turn === 'player') {
      const tile = GameState.deck.pop();
      GameState.playerHand.push(tile);
      updateUI();
    }
  }

  function passTurn() {
    if (GameState.turn === 'player' && canDrawOrPlay()) {
      GameState.turn = 'opponent';
      updateUI();
      setTimeout(aiTurn, 1000);
    }
  }

  function aiTurn() {
    const validTiles = GameState.opponentHand.filter(t => isValidMove(t));
    if (validTiles.length > 0) {
      placeTileOnBoard(validTiles[0], 'opponent');
      GameState.opponentHand = GameState.opponentHand.filter(t => t.id !== validTiles[0].id);
    } else if (GameState.deck.length > 0) {
      GameState.opponentHand.push(GameState.deck.pop());
    }
    
    if (GameState.opponentHand.length === 0) {
      // Simple win condition
      // In a real game, we'd calculate points
    }
    
    GameState.turn = 'player';
    updateUI();
  }

  function checkTurn() {
    updateUI();
  }

  document.getElementById('draw-btn').addEventListener('click', drawTile);
  document.getElementById('pass-btn').addEventListener('click', passTurn);
  initGame();

</script>
</body>
</html>
