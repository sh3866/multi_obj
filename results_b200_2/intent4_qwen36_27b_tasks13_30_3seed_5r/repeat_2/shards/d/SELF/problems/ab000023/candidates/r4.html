<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Product Render: Play Emblem</title>
<style>
  :root {
    --bg-top: #f8f9fa;
    --bg-bottom: #dfe4ea;
    --brand-red: #ff2a38;
    --brand-red-dark: #c40015;
    --brand-red-light: #ff6b76;
    --mat-white: #ffffff;
    --mat-edge: #e0e0e0;
    --shadow-color: rgba(15, 15, 20, 0.15);
    --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: radial-gradient(circle at 50% 30%, var(--bg-top), var(--bg-bottom));
    font-family: var(--font-stack);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #333;
    -webkit-font-smoothing: antialiased;
    perspective: 1500px; /* Deep perspective for subtle parallax */
  }

  /* Ambient Light Overlay */
  .ambient-light {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 60%);
    pointer-events: none;
    z-index: 2;
  }

  /* Main Scene Container */
  .scene {
    position: relative;
    width: 500px;
    height: 600px;
    transform-style: preserve-3d;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* The Sign Object */
  .sign-assembly {
    position: relative;
    width: 420px;
    height: 420px;
    transform-style: preserve-3d;
    transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
    will-change: transform;
  }

  /* 1. The Sign Face (Front) */
  .sign-face {
    position: absolute;
    inset: 0;
    background: var(--mat-white);
    border-radius: 60px;
    transform: translateZ(30px);
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 
      inset 0 0 0 1px rgba(255,255,255,1), /* Perfect edge */
      inset 0 0 0 2px rgba(0,0,0,0.02), /* Subtle depth edge */
      inset 0 10px 30px rgba(255,255,255,0.5); /* Inner highlight */
  }

  /* 2. The Sign Thickness (3D Extrusion) */
  .sign-depth {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, #f2f2f2, #dcdcdc);
    border-radius: 60px;
    transform: translateZ(0px);
    /* The physical edge shadow */
    box-shadow: 
      0 20px 50px -10px rgba(0,0,0,0.2),
      0 5px 15px rgba(0,0,0,0.1);
  }
  
  /* 3. Wall Mount Bracket (Industrial Polish) */
  .mount-plate {
    position: absolute;
    top: -40px;
    left: 50%;
    transform: translateX(-50%) translateZ(15px);
    width: 120px;
    height: 60px;
    background: linear-gradient(135deg, #f0f0f0 0%, #dcdcdc 100%);
    border-radius: 8px 8px 0 0;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    z-index: -1;
  }

  /* Screws */
  .screw {
    position: absolute;
    top: 12px;
    width: 10px;
    height: 10px;
    background: radial-gradient(circle, #a0a0a0 30%, #e0e0e0 100%);
    border-radius: 50%;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.4), 0 1px 0 rgba(255,255,255,0.8);
  }
  .screw::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 6px; height: 2px;
    background: #888;
    transform: translate(-50%, -50%) rotate(45deg);
  }
  .screw.left { left: 20px; }
  .screw.right { right: 20px; }

  /* 4. The Emblem (The Red Button) */
  .emblem-container {
    position: relative;
    width: 180px;
    height: 180px;
    transform-style: preserve-3d;
    transform: translateZ(60px); /* Floating above surface */
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  
  .sign-assembly:hover .emblem-container {
    transform: translateZ(80px) scale(1.05);
  }

  .emblem-sphere {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    /* Complex 3D Sphere Gradient */
    background: radial-gradient(circle at 35% 30%, var(--brand-red-light) 0%, var(--brand-red) 40%, var(--brand-red-dark) 100%);
    position: relative;
    box-shadow: 
      0 30px 60px -10px rgba(255, 42, 56, 0.4), /* Colored Bloom */
      0 20px 40px rgba(0,0,0,0.3), /* Drop Shadow */
      inset 0 10px 20px rgba(255,255,255,0.3), /* Top Specular */
      inset 0 -10px 30px rgba(0,0,0,0.3); /* Bottom Ambient Occlusion */
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Glossy Reflection */
  .emblem-gloss {
    position: absolute;
    top: 12%;
    left: 18%;
    width: 35%;
    height: 25%;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 100%);
    transform: rotate(-45deg);
    filter: blur(3px);
    pointer-events: none;
  }

  /* The Play Icon */
  .play-icon {
    width: 54px;
    height: 54px;
    fill: white;
    margin-left: 4px; /* Optical Centering */
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    transition: transform 0.3s ease;
  }

  .emblem-container:hover .play-icon {
    transform: scale(1.1);
    margin-left: 8px;
  }

  /* Floor Shadow */
  .floor-shadow {
    position: absolute;
    bottom: -150px;
    left: 50%;
    width: 300px;
    height: 60px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0) 70%);
    transform: translateX(-50%) rotateX(60deg);
    filter: blur(20px);
    z-index: -2;
    transition: transform 0.1s ease-out;
  }

  /* UI Overlay */
  .ui-layer {
    position: absolute;
    bottom: 8vh;
    left: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    z-index: 10;
    pointer-events: none;
  }

  .status-badge {
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.8);
    padding: 10px 24px;
    border-radius: 100px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.05);
  }

  .dot {
    width: 8px;
    height: 8px;
    background-color: var(--brand-red);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--brand-red);
    position: relative;
  }
  
  .dot::after {
    content: '';
    position: absolute;
    inset: -4px;
    border: 1px solid var(--brand-red);
    border-radius: 50%;
    opacity: 0;
    animation: pulse-ring 2s infinite;
  }

  .text {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--brand-red);
    text-transform: uppercase;
  }

  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(2.5); opacity: 0; }
  }

</style>
</head>
<body>

  <div class="ambient-light"></div>

  <div class="scene">
    
    <div class="sign-assembly" id="sign">
      
      <!-- 3D Depth Layer -->
      <div class="sign-depth"></div>

      <!-- Wall Mount -->
      <div class="mount-plate">
        <div class="screw left"></div>
        <div class="screw right"></div>
      </div>

      <!-- Front Face -->
      <div class="sign-face">
        
        <!-- Floating Emblem -->
        <div class="emblem-container">
          <div class="emblem-sphere">
            <div class="emblem-gloss"></div>
            <svg class="play-icon" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </div>
        </div>

      </div>
    </div>

    <!-- Dynamic Floor Shadow -->
    <div class="floor-shadow" id="shadow"></div>

  </div>

  <!-- UI Elements -->
  <div class="ui-layer">
    <div class="status-badge">
      <div class="dot"></div>
      <span class="text">Streaming Live</span>
    </div>
  </div>

  <script>
    const sign = document.getElementById('sign');
    const shadow = document.getElementById('shadow');
    
    // Configuration
    const maxTilt = 10; // Degrees
    const maxShadowOffset = 30; // Pixels
    
    // State
    let currentX = 0;
    let currentY = 0;
    let targetX = 0;
    let targetY = 0;

    // Animation Loop
    function animate() {
      // Lerp for smooth physics
      currentX += (targetX - currentX) * 0.08;
      currentY += (targetY - currentY) * 0.08;

      // Apply rotation
      sign.style.transform = `rotateX(${-currentY}deg) rotateY(${currentX}deg)`;

      // Move shadow in opposite direction to simulate light source
      const shadowX = -currentX * 2.5;
      const shadowY = -currentY * 1.5;
      
      // Flatten shadow when object tilts up
      const shadowScaleX = 1 - (Math.abs(currentY) / 40);
      
      shadow.style.transform = `translate(calc(-50% + ${shadowX}px), ${shadowY}px) scaleX(${shadowScaleX})`;

      requestAnimationFrame(animate);
    }
    
    animate();

    // Event Listeners
    document.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      
      // Normalize -1 to 1
      const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
      const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);

      targetX = x * maxTilt;
      targetY = y * maxTilt;
    });

    document.addEventListener('mouseleave', () => {
      targetX = 0;
      targetY = 0;
    });
  </script>
</body>
</html>
