<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play Button Sign | Premium Product Visual</title>
<style>
  :root {
    --bg-color: #e4e6e9;
    --bg-gradient-start: #f4f5f7;
    --bg-gradient-end: #dcdfe4;
    --sign-white: #ffffff;
    --sign-edge: #f0f0f0;
    --emblem-red: #ff1f3d;
    --emblem-red-dark: #cc001a;
    --emblem-shadow: rgba(255, 31, 61, 0.45);
    --text-main: #1a1a1a;
    --text-muted: #7a7d84;
    --ui-bg: rgba(255, 255, 255, 0.85);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-color);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--text-main);
    cursor: default;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Scene Container */
  .scene-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1800px;
    /* High-end studio lighting background */
    background: radial-gradient(ellipse at 50% 20%, var(--bg-gradient-start) 0%, var(--bg-color) 60%, var(--bg-gradient-end) 100%);
    overflow: hidden;
  }

  /* Ambient Light Glow behind sign */
  .scene-container::before {
    content: '';
    position: absolute;
    top: 20%;
    left: 50%;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 0;
  }

  /* Main 3D Object Wrapper */
  .sign-wrapper {
    position: relative;
    width: 420px;
    height: 420px;
    transform-style: preserve-3d;
    transform: rotateX(0deg) rotateY(0deg);
    transition: transform 0.1s linear; /* Fast response for parallax */
    z-index: 10;
    will-change: transform;
  }

  /* The Sign Face */
  .sign-board {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: var(--sign-white);
    border-radius: 44px;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Complex shadow system for realistic depth and floating effect */
    box-shadow: 
      inset 0 0 0 1px rgba(255,255,255,0.8), /* Edge highlight */
      inset 0 0 0 2px rgba(0,0,0,0.03), /* Inner edge definition */
      0 10px 30px rgba(0,0,0,0.05),
      0 30px 60px rgba(0,0,0,0.1), /* Deep drop shadow */
      0 0 0 1px rgba(0,0,0,0.02); /* Crisp outline */
    overflow: visible; /* Allow emblem glow to spill out slightly */
    transform: translateZ(20px); /* Lift face */
    /* Subtle grain texture for material realism */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
  }

  /* The 3D Thickness (Side of the board) - Simulated via pseudo element behind */
  .sign-thickness {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #e0e0e0 0%, #d5d5d5 50%, #e8e8e8 100%);
    border-radius: 44px;
    transform: translateZ(0px);
    /* Shadow cast by the thickness onto the wall */
    box-shadow: 0 25px 50px -10px rgba(0,0,0,0.25);
    z-index: -1;
  }
  
  /* Inner bevel for the thickness edge */
  .sign-thickness::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 44px;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
  }

  /* Mounting Bracket - Wall Plate (More industrial/sleek) */
  .mount-plate {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%) translateZ(-10px);
    width: 120px;
    height: 36px;
    background: linear-gradient(to bottom, #f7f7f7, #e8e8e8);
    border-radius: 10px 10px 4px 4px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.9);
    z-index: -2;
    border: 1px solid rgba(0,0,0,0.05);
    border-bottom: none;
  }
  
  /* Screws on the bracket */
  .mount-plate::before, .mount-plate::after {
    content: '';
    position: absolute;
    top: 12px;
    width: 10px;
    height: 10px;
    background: #d0d0d0;
    border-radius: 50%;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.4), 0 1px 0 rgba(255,255,255,0.6);
  }
  .mount-plate::before { left: 20px; }
  .mount-plate::after { right: 20px; }

  /* Connecting arm (Hidden mostly, but adds depth) */
  .mount-arm {
    position: absolute;
    top: -5px;
    left: 50%;
    transform: translateX(-50%) translateZ(-5px);
    width: 20px;
    height: 15px;
    background: #dcdcdc;
    z-index: -1;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  /* The Emblem Container */
  .emblem-container {
    position: relative;
    width: 170px;
    height: 170px;
    border-radius: 50%;
    /* Premium Red Gradient - More depth */
    background: radial-gradient(circle at 35% 30%, #ff4d6d 0%, #ff1f3d 40%, #cc001a 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    /* Complex shadow for "glowing" and physical depth */
    box-shadow: 
      0 15px 40px var(--emblem-shadow), /* Red bloom */
      0 10px 20px rgba(0,0,0,0.25), /* Drop shadow */
      inset 0 2px 8px rgba(255,255,255,0.6), /* Top highlight */
      inset 0 -8px 20px rgba(0,0,0,0.3); /* Bottom depth */
    transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    transform: translateZ(10px); /* Pop out from board */
  }

  .sign-wrapper:hover .emblem-container {
    transform: translateZ(25px) scale(1.05);
    box-shadow: 
      0 25px 60px var(--emblem-shadow),
      0 15px 30px rgba(0,0,0,0.3),
      inset 0 2px 8px rgba(255,255,255,0.6),
      inset 0 -8px 20px rgba(0,0,0,0.3);
  }

  /* Glossy reflection on the red circle - More realistic glass/plastic look */
  .emblem-gloss {
    position: absolute;
    top: 8%;
    left: 12%;
    width: 45%;
    height: 35%;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 100%);
    transform: rotate(45deg);
    filter: blur(3px);
    pointer-events: none;
  }

  /* Secondary smaller reflection */
  .emblem-gloss::after {
    content: '';
    position: absolute;
    bottom: -150%;
    right: 20%;
    width: 15px;
    height: 15px;
    background: rgba(255,255,255,0.4);
    border-radius: 50%;
    filter: blur(2px);
  }

  /* The Play Triangle - SVG for crispness */
  .play-icon {
    width: 56px;
    height: 56px;
    fill: white;
    /* Offset slightly right for optical centering */
    margin-left: 8px; 
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.3));
    transition: margin 0.5s ease, fill 0.3s ease;
  }

  .sign-wrapper:hover .play-icon {
    margin-left: 12px;
    fill: #ffffff;
  }

  /* Floor Shadow - More realistic contact shadow */
  .floor-shadow {
    position: absolute;
    bottom: -150px;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    height: 80px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 70%);
    filter: blur(20px);
    z-index: -2;
    transition: all 0.1s linear;
  }

  /* Typography / UI Layer - More polished, minimal */
  .ui-layer {
    position: absolute;
    bottom: 8vh;
    text-align: center;
    width: 100%;
    z-index: 20;
    pointer-events: none;
    opacity: 0.95;
  }

  h1 {
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 16px;
    text-shadow: 0 1px 2px rgba(255,255,255,0.9);
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    font-family: 'SF Mono', 'Courier New', Courier, monospace;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--emblem-red);
    background: var(--ui-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 8px 20px;
    border-radius: 100px;
    border: 1px solid rgba(255,255,255,0.6);
    box-shadow: 0 8px 30px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.05);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background-color: var(--emblem-red);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--emblem-red);
    position: relative;
  }
  
  /* Pulsing ring around dot */
  .status-dot::after {
    content: '';
    position: absolute;
    top: -2px; left: -2px; right: -2px; bottom: -2px;
    border-radius: 50%;
    border: 1px solid var(--emblem-red);
    animation: pulse-ring 2s infinite;
  }

  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(2.2); opacity: 0; }
  }

  /* Decorative Background Elements - Subtle grid for scale */
  .bg-lines {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
    background-image: 
      linear-gradient(to right, rgba(0,0,0,0.03) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,0,0,0.03) 1px, transparent 1px);
    background-size: 100px 100px;
    mask-image: radial-gradient(circle at 50% 50%, black 0%, transparent 60%);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, black 0%, transparent 60%);
  }

</style>
</head>
<body>

  <div class="scene-container">
    
    <!-- Subtle Background Grid -->
    <div class="bg-lines"></div>

    <!-- Main Product Assembly -->
    <div class="sign-wrapper" id="product">
      
      <!-- Mounting Hardware (Back) -->
      <div class="mount-plate"></div>
      <div class="mount-arm"></div>

      <!-- The Sign Board -->
      <div class="sign-board">
        <!-- The Red Emblem -->
        <div class="emblem-container">
          <div class="emblem-gloss"></div>
          <!-- SVG Play Icon for perfect geometry -->
          <svg class="play-icon" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
      </div>
      
      <!-- 3D Thickness -->
      <div class="sign-thickness"></div>
    </div>

    <!-- Floor Shadow -->
    <div class="floor-shadow" id="floor-shadow"></div>

    <!-- Typography / Context -->
    <div class="ui-layer">
      <h1>System Status</h1>
      <div class="status-badge">
        <div class="status-dot"></div>
        STREAMING LIVE
      </div>
    </div>

  </div>

  <script>
    // Interactive Parallax Effect
    const container = document.querySelector('.scene-container');
    const product = document.getElementById('product');
    const shadow = document.getElementById('floor-shadow');

    // Configuration
    const maxRotation = 10; // Max degrees to tilt (reduced for more subtle, premium feel)
    let currentX = 0;
    let currentY = 0;
    let targetX = 0;
    let targetY = 0;

    // Smooth animation loop
    function animate() {
      // Linear interpolation for smooth movement
      currentX += (targetX - currentX) * 0.1;
      currentY += (targetY - currentY) * 0.1;

      product.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;
      
      // Shadow logic
      const shadowX = -currentY * 15; 
      const shadowY = currentX * 15; 
      const shadowScale = 1 - (Math.abs(currentX) + Math.abs(currentY)) * 0.005;
      const shadowOpacity = 0.3 - (Math.abs(currentX) + Math.abs(currentY)) * 0.005;

      shadow.style.transform = `translate(calc(-50% + ${shadowX}px), ${shadowY}px) scale(${shadowScale})`;
      shadow.style.opacity = Math.max(0.1, shadowOpacity);

      requestAnimationFrame(animate);
    }
    animate();

    container.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      
      // Calculate mouse position relative to center (-1 to 1)
      const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
      const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);

      // Set targets
      // RotateY based on X movement, RotateX based on Y movement
      targetY = x * maxRotation;
      targetX = -y * maxRotation;
    });

    container.addEventListener('mouseleave', () => {
      // Smoothly reset targets to 0
      targetX = 0;
      targetY = 0;
    });
  </script>
</body>
</html>
