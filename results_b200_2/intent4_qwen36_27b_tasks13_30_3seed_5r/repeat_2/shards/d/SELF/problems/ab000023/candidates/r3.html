<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Play Button Sign</title>
<style>
  :root {
    --bg-color: #eef1f5;
    --sign-surface: #ffffff;
    --sign-depth: #e8eaed;
    --sign-shadow: rgba(20, 20, 25, 0.15);
    --brand-red: #FF2040;
    --brand-red-dark: #C4001D;
    --brand-red-light: #FF5C7C;
    --text-primary: #1f2328;
    --text-secondary: #6b7280;
    --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-color);
    font-family: var(--font-stack);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  /* Background Studio Gradient */
  .studio-bg {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 30%, #ffffff 0%, #eef1f5 40%, #dce0e6 100%);
    z-index: 0;
  }

  /* Main 3D Scene Container */
  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1200px;
    z-index: 1;
  }

  /* The Sign Object Assembly */
  .sign-assembly {
    position: relative;
    width: 440px;
    height: 440px;
    transform-style: preserve-3d;
    transition: transform 0.1s ease-out;
    will-change: transform;
  }

  /* 1. The Sign Face (Front) */
  .sign-face {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: var(--sign-surface);
    border-radius: 50px;
    transform: translateZ(20px);
    display: flex;
    justify-content: center;
    align-items: center;
    
    /* Material Realism */
    box-shadow: 
      inset 0 0 0 1px rgba(255,255,255,0.8), /* Rim light */
      inset 0 0 0 2px rgba(0,0,0,0.02); /* Inner edge */
    
    /* Subtle Noise Texture */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.02'/%3E%3C/svg%3E");
  }

  /* 2. The Sign Thickness (Back/Depth) */
  .sign-depth {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, #f0f0f0, #dcdcdc);
    border-radius: 50px;
    transform: translateZ(0px);
    box-shadow: 
      0 30px 60px -10px rgba(0,0,0,0.2),
      0 10px 20px rgba(0,0,0,0.1);
  }

  /* 3. Mounting Bracket (Industrial Detail) */
  .mount-bracket {
    position: absolute;
    top: -25px;
    left: 50%;
    transform: translateX(-50%) translateZ(-5px);
    width: 140px;
    height: 40px;
    background: linear-gradient(to bottom, #f5f5f5, #e0e0e0);
    border-radius: 12px 12px 0 0;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    display: flex;
    justify-content: space-between;
    padding: 0 25px;
    align-items: center;
  }
  
  /* Screws */
  .mount-bracket::before, .mount-bracket::after {
    content: '';
    width: 12px;
    height: 12px;
    background: #d1d1d1;
    border-radius: 50%;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.3), 0 1px 0 rgba(255,255,255,0.8);
  }

  /* 4. The Emblem (The Star) */
  .emblem-wrapper {
    position: relative;
    width: 160px;
    height: 160px;
    transform: translateZ(40px); /* Floats above surface */
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .sign-assembly:hover .emblem-wrapper {
    transform: translateZ(60px) scale(1.05);
  }

  .emblem-body {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    /* Complex Red Gradient for 3D Sphere Look */
    background: radial-gradient(circle at 35% 30%, var(--brand-red-light) 0%, var(--brand-red) 40%, var(--brand-red-dark) 100%);
    
    /* Multi-layered shadows for depth and "glow" */
    box-shadow: 
      0 20px 40px -5px rgba(255, 32, 64, 0.4), /* Red Bloom */
      0 15px 25px rgba(0,0,0,0.25), /* Drop Shadow */
      inset 0 5px 15px rgba(255,255,255,0.5), /* Top Specular */
      inset 0 -10px 20px rgba(0,0,0,0.2); /* Bottom Rim */
  }

  /* Glossy Overlay */
  .emblem-gloss {
    position: absolute;
    top: 10%;
    left: 15%;
    width: 45%;
    height: 35%;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 100%);
    transform: rotate(-45deg);
    filter: blur(2px);
  }

  /* The Play Icon */
  .play-icon {
    width: 50px;
    height: 50px;
    fill: white;
    margin-left: 6px; /* Optical centering */
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
    transition: all 0.3s ease;
  }

  .emblem-wrapper:hover .play-icon {
    margin-left: 10px;
    transform: scale(1.05);
  }

  /* Floor Shadow */
  .floor-shadow {
    position: absolute;
    bottom: -180px;
    left: 50%;
    width: 80%;
    height: 60px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0) 70%);
    transform: translateX(-50%);
    filter: blur(15px);
    z-index: -1;
    transition: transform 0.1s ease-out;
  }

  /* UI Overlay Layer */
  .ui-overlay {
    position: absolute;
    bottom: 10vh;
    left: 0; 
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    z-index: 10;
    pointer-events: none;
  }

  .label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-secondary);
    text-shadow: 0 1px 2px rgba(255,255,255,0.5);
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 8px 20px;
    border-radius: 100px;
    border: 1px solid rgba(255,255,255,0.8);
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
  }

  .status-indicator {
    width: 8px;
    height: 8px;
    background: var(--brand-red);
    border-radius: 50%;
    position: relative;
  }

  .status-indicator::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 1px solid var(--brand-red);
    opacity: 0;
    animation: pulse 2s infinite;
  }

  .status-text {
    font-size: 11px;
    font-weight: 700;
    color: var(--brand-red);
    letter-spacing: 0.05em;
  }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(2); opacity: 0; }
  }

</style>
</head>
<body>

  <div class="studio-bg"></div>

  <div class="scene">
    
    <div class="sign-assembly" id="sign">
      
      <!-- Back/Depth -->
      <div class="sign-depth"></div>
      
      <!-- Mounting Bracket -->
      <div class="mount-bracket"></div>

      <!-- Front Face -->
      <div class="sign-face">
        
        <!-- Emblem -->
        <div class="emblem-wrapper">
          <div class="emblem-body">
            <div class="emblem-gloss"></div>
            <svg class="play-icon" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </div>
        </div>

      </div>
    </div>

    <!-- Dynamic Floor Shadow -->
    <div class="floor-shadow" id="shadow"></div>

  </div>

  <!-- UI Elements -->
  <div class="ui-overlay">
    <span class="label">System Active</span>
    <div class="status-pill">
      <div class="status-indicator"></div>
      <span class="status-text">STREAMING LIVE</span>
    </div>
  </div>

  <script>
    const sign = document.getElementById('sign');
    const shadow = document.getElementById('shadow');
    
    // Configuration for the parallax effect
    const maxTilt = 12; // Degrees
    
    // Current state
    let currentX = 0;
    let currentY = 0;
    let targetX = 0;
    let targetY = 0;

    // Animation Loop
    function animate() {
      // Lerp (Linear Interpolation) for smoothness
      currentX += (targetX - currentX) * 0.08;
      currentY += (targetY - currentY) * 0.08;

      // Apply rotation to sign
      // Note: Y rotation comes from X mouse movement, X rotation from Y mouse movement
      sign.style.transform = `rotateX(${-currentY}deg) rotateY(${currentX}deg)`;

      // Apply inverse movement to shadow to simulate light source position
      const shadowX = currentX * 20;
      const shadowY = currentY * 10;
      // Scale shadow smaller when object tilts up (simulating height)
      const shadowScale = 1 - (Math.abs(currentY) / 50);
      
      shadow.style.transform = `translate(calc(-50% + ${shadowX}px), ${shadowY}px) scale(${shadowScale})`;

      requestAnimationFrame(animate);
    }
    
    animate();

    // Event Listeners
    document.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      
      // Normalize mouse position: -1 to 1
      const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
      const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);

      // Set targets
      targetX = x * maxTilt;
      targetY = y * maxTilt;
    });

    // Reset on leave
    document.addEventListener('mouseleave', () => {
      targetX = 0;
      targetY = 0;
    });
  </script>
</body>
</html>
