<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play Button Sign | Premium Product Visual</title>
<style>
  :root {
    --bg-color: #e0e2e5;
    --bg-highlight: #f5f7fa;
    --sign-white: #ffffff;
    --emblem-red: #ff0033;
    --emblem-red-dark: #cc0026;
    --text-main: #1a1a1a;
    --text-muted: #888888;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-color);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--text-main);
    cursor: default;
  }

  /* Scene Container */
  .scene-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1500px;
    /* High-end studio lighting background */
    background: radial-gradient(ellipse at 50% 30%, var(--bg-highlight) 0%, var(--bg-color) 70%);
  }

  /* Main 3D Object Wrapper */
  .sign-wrapper {
    position: relative;
    width: 400px;
    height: 400px;
    transform-style: preserve-3d;
    transform: rotateX(0deg) rotateY(0deg);
    transition: transform 0.1s linear; /* Fast response for parallax */
    z-index: 10;
  }

  /* The Sign Face */
  .sign-board {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: var(--sign-white);
    border-radius: 32px;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Multi-layered shadow for realistic depth */
    box-shadow: 
      inset 0 0 0 1px rgba(0,0,0,0.03), /* Edge definition */
      0 2px 4px rgba(0,0,0,0.02),
      0 10px 20px rgba(0,0,0,0.05),
      0 40px 80px rgba(0,0,0,0.15); /* Deep ambient shadow */
    overflow: hidden;
    transform: translateZ(15px); /* Lift face slightly */
  }

  /* Subtle noise texture for material realism */
  .sign-board::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.02'/%3E%3C/svg%3E");
    pointer-events: none;
    opacity: 0.8;
  }

  /* The 3D Thickness (Side of the board) */
  .sign-thickness {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: #e6e6e6;
    border-radius: 32px;
    /* Darker gradient to simulate side lighting */
    background: linear-gradient(90deg, #dcdcdc 0%, #e6e6e6 20%, #f0f0f0 100%);
    transform: translateZ(0px);
    box-shadow: 
      0 20px 50px rgba(0,0,0,0.2);
  }

  /* Mounting Bracket - Wall Plate */
  .mount-plate {
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%) translateZ(-2px);
    width: 100px;
    height: 40px;
    background: linear-gradient(to bottom, #f0f0f0, #dcdcdc);
    border-radius: 8px 8px 4px 4px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    z-index: -1;
    border-bottom: 1px solid rgba(0,0,0,0.1);
  }
  
  /* Screws on the bracket */
  .mount-plate::before, .mount-plate::after {
    content: '';
    position: absolute;
    top: 12px;
    width: 8px;
    height: 8px;
    background: #ccc;
    border-radius: 50%;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.3), 0 1px 0 rgba(255,255,255,0.5);
  }
  .mount-plate::before { left: 15px; }
  .mount-plate::after { right: 15px; }

  /* Connecting arm */
  .mount-arm {
    position: absolute;
    top: -15px;
    left: 50%;
    transform: translateX(-50%) translateZ(-2px);
    width: 16px;
    height: 20px;
    background: #dcdcdc;
    z-index: -1;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  /* The Emblem Container */
  .emblem-container {
    position: relative;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    /* Premium Red Gradient */
    background: radial-gradient(circle at 30% 30%, #ff3355 0%, #ff0033 40%, #cc0026 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    /* Complex shadow for "glowing" effect */
    box-shadow: 
      0 10px 30px rgba(255, 0, 51, 0.4), /* Red bloom */
      0 5px 15px rgba(0,0,0,0.2), /* Drop shadow */
      inset 0 2px 5px rgba(255,255,255,0.5), /* Top highlight */
      inset 0 -5px 15px rgba(0,0,0,0.2); /* Bottom depth */
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .sign-wrapper:hover .emblem-container {
    transform: scale(1.08);
  }

  /* Glossy reflection on the red circle */
  .emblem-gloss {
    position: absolute;
    top: 5%;
    left: 10%;
    width: 40%;
    height: 30%;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 100%);
    transform: rotate(45deg);
    filter: blur(2px);
    pointer-events: none;
  }

  /* The Play Triangle - SVG for crispness */
  .play-icon {
    width: 50px;
    height: 50px;
    fill: white;
    /* Offset slightly right for optical centering */
    margin-left: 6px; 
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
    transition: margin 0.4s ease;
  }

  .sign-wrapper:hover .play-icon {
    margin-left: 10px;
  }

  /* Floor Shadow */
  .floor-shadow {
    position: absolute;
    bottom: -120px; /* Position relative to sign center */
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 60px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0) 70%);
    filter: blur(15px);
    z-index: -2;
    transition: all 0.1s linear;
  }

  /* Typography / UI Layer */
  .ui-layer {
    position: absolute;
    bottom: 10vh;
    text-align: center;
    width: 100%;
    z-index: 20;
    pointer-events: none;
    opacity: 0.9;
  }

  h1 {
    font-size: 13px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 12px;
    text-shadow: 0 1px 2px rgba(255,255,255,0.8);
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-family: 'Courier New', Courier, monospace;
    font-weight: 700;
    color: var(--emblem-red);
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(5px);
    padding: 6px 16px;
    border-radius: 100px;
    border: 1px solid rgba(0,0,0,0.05);
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  }

  .status-dot {
    width: 6px;
    height: 6px;
    background-color: var(--emblem-red);
    border-radius: 50%;
    box-shadow: 0 0 5px var(--emblem-red);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* Decorative Background Elements (Subtle) */
  .bg-lines {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.3;
  }
  
  .bg-line-v {
    position: absolute;
    left: 50%;
    top: 0;
    width: 1px;
    height: 100%;
    background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.05) 50%, transparent 60%);
  }

</style>
</head>
<body>

  <div class="scene-container">
    
    <!-- Subtle Background Line -->
    <div class="bg-lines">
      <div class="bg-line-v"></div>
    </div>

    <!-- Main Product Assembly -->
    <div class="sign-wrapper" id="product">
      
      <!-- Mounting Hardware (Back) -->
      <div class="mount-plate"></div>
      <div class="mount-arm"></div>

      <!-- The Sign Board -->
      <div class="sign-board">
        <!-- The Red Emblem -->
        <div class="emblem-container">
          <div class="emblem-gloss"></div>
          <!-- SVG Play Icon for perfect geometry -->
          <svg class="play-icon" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
      </div>
      
      <!-- 3D Thickness -->
      <div class="sign-thickness"></div>
    </div>

    <!-- Floor Shadow -->
    <div class="floor-shadow" id="floor-shadow"></div>

    <!-- Typography / Context -->
    <div class="ui-layer">
      <h1>System Status</h1>
      <div class="status-badge">
        <div class="status-dot"></div>
        STREAMING LIVE
      </div>
    </div>

  </div>

  <script>
    // Interactive Parallax Effect
    const container = document.querySelector('.scene-container');
    const product = document.getElementById('product');
    const shadow = document.getElementById('floor-shadow');

    // Configuration
    const maxRotation = 12; // Max degrees to tilt

    container.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      
      // Calculate mouse position relative to center (-1 to 1)
      const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
      const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);

      // Apply rotation (invert X for natural feel)
      // RotateY based on X movement, RotateX based on Y movement
      const rotateY = x * maxRotation;
      const rotateX = -y * maxRotation;

      product.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
      
      // Move shadow opposite to tilt to simulate light source staying fixed
      // Shadow moves opposite to X/Y
      const shadowX = -x * 20; 
      const shadowY = y * 10; // Slight vertical shift
      
      shadow.style.transform = `translate(calc(-50% + ${shadowX}px), ${shadowY}px)`;
      shadow.style.opacity = 0.25 + (Math.abs(x) * 0.1); // Shadow gets slightly darker/stronger at angles
    });

    container.addEventListener('mouseleave', () => {
      // Smoothly reset
      product.style.transition = 'transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
      product.style.transform = `rotateX(0deg) rotateY(0deg)`;
      shadow.style.transform = `translateX(-50%)`;
      
      setTimeout(() => {
        product.style.transition = 'transform 0.1s linear'; // Reset transition for next mouse move
      }, 500);
    });
  </script>
</body>
</html>
