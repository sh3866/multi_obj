<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Product Render: Play Emblem</title>
<style>
  :root {
    /* Palette: Premium Studio Lighting */
    --bg-gradient-start: #ffffff;
    --bg-gradient-end: #eef2f5;
    
    --brand-red: #ff3333;
    --brand-red-shadow: #b30000;
    --brand-red-highlight: #ff9999;
    
    --mat-white: #ffffff;
    --mat-edge: #f0f2f5;
    --mat-shadow: rgba(20, 30, 50, 0.12);
    
    --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(circle at 50% 30%, var(--bg-gradient-start), var(--bg-gradient-end));
    font-family: var(--font-stack);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #333;
    -webkit-font-smoothing: antialiased;
    perspective: 1200px;
  }

  /* Subtle Studio Grid Texture */
  .bg-texture {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Main Scene Container */
  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1;
  }

  /* The Sign Object */
  .sign-assembly {
    position: relative;
    width: 400px;
    height: 400px;
    transform-style: preserve-3d;
    transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
    will-change: transform;
  }

  /* 1. The Sign Face (Front) - High Polish White */
  .sign-face {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #ffffff 0%, #fdfdfd 100%);
    border-radius: 70px;
    transform: translateZ(20px);
    display: flex;
    justify-content: center;
    align-items: center;
    /* Soft, premium border */
    border: 1px solid rgba(255,255,255,0.8);
    box-shadow: 
      inset 0 2px 10px rgba(255,255,255,1), /* Top inner highlight */
      inset 0 -2px 10px rgba(0,0,0,0.02); /* Bottom inner shadow */
  }

  /* 2. The Sign Thickness (3D Extrusion) */
  .sign-depth {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, #e0e0e0, #d0d0d0);
    border-radius: 70px;
    transform: translateZ(0px);
    box-shadow: 
      0 30px 60px -15px rgba(0,0,0,0.3), /* Deep drop shadow */
      0 10px 20px rgba(0,0,0,0.1);       /* Close drop shadow */
  }

  /* 3. Mounting Hardware - Minimalist Metal */
  .mount-plate {
    position: absolute;
    top: -50px;
    left: 50%;
    transform: translateX(-50%) translateZ(10px);
    width: 100px;
    height: 50px;
    background: linear-gradient(to bottom, #f7f7f7, #e0e0e0);
    border-radius: 12px 12px 0 0;
    border: 1px solid rgba(255,255,255,0.5);
    border-bottom: none;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    z-index: -1;
    display: flex;
    justify-content: space-between;
    padding: 0 25px;
    align-items: flex-start;
  }

  /* Screws - Realistic Metal Detail */
  .screw {
    width: 8px;
    height: 8px;
    background: radial-gradient(circle at 30% 30%, #fff, #aaa);
    border-radius: 50%;
    margin-top: 15px;
    box-shadow: 
      inset 0 1px 2px rgba(0,0,0,0.3),
      0 1px 0 rgba(255,255,255,0.5);
    position: relative;
  }
  .screw::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 5px; height: 1.5px;
    background: #666;
    transform: translate(-50%, -50%) rotate(45deg);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.5);
  }
  .screw::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 5px; height: 1.5px;
    background: #666;
    transform: translate(-50%, -50%) rotate(-45deg);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.5);
  }

  /* 4. The Emblem (The Red Button) */
  .emblem-container {
    position: relative;
    width: 160px;
    height: 160px;
    transform-style: preserve-3d;
    /* Floating effect */
    transform: translateZ(50px); 
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  
  .sign-assembly:hover .emblem-container {
    transform: translateZ(70px) scale(1.05);
  }

  .emblem-sphere {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    /* High-end Glossy Sphere Gradient */
    background: radial-gradient(circle at 30% 30%, 
      var(--brand-red-highlight) 0%, 
      var(--brand-red) 40%, 
      var(--brand-red-shadow) 100%);
    position: relative;
    /* Complex Lighting Shadows */
    box-shadow: 
      0 25px 50px -12px rgba(255, 50, 50, 0.4), /* Colored Bloom */
      0 20px 40px rgba(0,0,0,0.25),             /* Drop Shadow */
      inset 0 8px 20px rgba(255,255,255,0.4),   /* Top Specular */
      inset 0 -8px 20px rgba(0,0,0,0.2);        /* Bottom Ambient Occlusion */
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Glossy Reflection - The "Apple" Shine */
  .emblem-gloss {
    position: absolute;
    top: 10%;
    left: 15%;
    width: 40%;
    height: 30%;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 100%);
    transform: rotate(-45deg);
    filter: blur(4px);
    pointer-events: none;
  }

  /* The Play Icon - Geometrically Crisp */
  .play-icon {
    width: 48px;
    height: 48px;
    fill: #ffffff;
    /* Optical Centering Shift */
    margin-left: 5px; 
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
    transition: transform 0.3s ease;
  }

  .emblem-container:hover .play-icon {
    transform: scale(1.1);
    margin-left: 9px;
  }

  /* Floor Shadow - Dynamic */
  .floor-shadow {
    position: absolute;
    bottom: -160px;
    left: 50%;
    width: 280px;
    height: 80px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0) 70%);
    transform: translateX(-50%) rotateX(60deg);
    filter: blur(15px);
    z-index: -2;
    transition: transform 0.1s ease-out;
  }

  /* UI Overlay - Clean & Minimal */
  .ui-layer {
    position: absolute;
    bottom: 6vh;
    left: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    z-index: 10;
    pointer-events: none;
  }

  .status-badge {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.6);
    padding: 12px 28px;
    border-radius: 100px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.04);
  }

  .dot {
    width: 8px;
    height: 8px;
    background-color: var(--brand-red);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--brand-red);
    position: relative;
  }
  
  .dot::after {
    content: '';
    position: absolute;
    inset: -4px;
    border: 1px solid var(--brand-red);
    border-radius: 50%;
    opacity: 0;
    animation: pulse-ring 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
  }

  .text {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.15em;
    color: var(--brand-red);
    text-transform: uppercase;
  }

  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(2.5); opacity: 0; }
  }

</style>
</head>
<body>

  <div class="bg-texture"></div>

  <div class="scene">
    
    <div class="sign-assembly" id="sign">
      
      <!-- 3D Depth Layer -->
      <div class="sign-depth"></div>

      <!-- Wall Mount -->
      <div class="mount-plate">
        <div class="screw"></div>
        <div class="screw"></div>
      </div>

      <!-- Front Face -->
      <div class="sign-face">
        
        <!-- Floating Emblem -->
        <div class="emblem-container">
          <div class="emblem-sphere">
            <div class="emblem-gloss"></div>
            <!-- Crisp SVG Path -->
            <svg class="play-icon" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </div>
        </div>

      </div>
    </div>

    <!-- Dynamic Floor Shadow -->
    <div class="floor-shadow" id="shadow"></div>

  </div>

  <!-- UI Elements -->
  <div class="ui-layer">
    <div class="status-badge">
      <div class="dot"></div>
      <span class="text">Streaming Live</span>
    </div>
  </div>

  <script>
    const sign = document.getElementById('sign');
    const shadow = document.getElementById('shadow');
    
    // Configuration
    const maxTilt = 8; // Degrees - slightly less for more subtle, premium feel
    const maxShadowOffset = 25; // Pixels
    
    // State
    let currentX = 0;
    let currentY = 0;
    let targetX = 0;
    let targetY = 0;

    // Animation Loop
    function animate() {
      // Lerp for smooth physics (0.08 = smooth weight)
      currentX += (targetX - currentX) * 0.08;
      currentY += (targetY - currentY) * 0.08;

      // Apply rotation
      sign.style.transform = `rotateX(${-currentY}deg) rotateY(${currentX}deg)`;

      // Move shadow in opposite direction to simulate light source
      // Shadow moves opposite to tilt
      const shadowX = -currentX * 3;
      const shadowY = -currentY * 2;
      
      // Flatten shadow when object tilts up (Y-axis rotation)
      const shadowScaleX = 1 - (Math.abs(currentY) / 60);
      
      shadow.style.transform = `translate(calc(-50% + ${shadowX}px), ${shadowY}px) scaleX(${shadowScaleX})`;

      requestAnimationFrame(animate);
    }
    
    animate();

    // Event Listeners
    document.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      
      // Normalize -1 to 1
      const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
      const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);

      targetX = x * maxTilt;
      targetY = y * maxTilt;
    });

    document.addEventListener('mouseleave', () => {
      targetX = 0;
      targetY = 0;
    });
  </script>
</body>
</html>
