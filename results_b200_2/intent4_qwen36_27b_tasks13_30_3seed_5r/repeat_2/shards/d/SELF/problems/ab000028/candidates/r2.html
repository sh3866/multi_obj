<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verticality // The Descent</title>
<style>
  :root {
    /* Palette: High-Contrast Editorial */
    --c-sky-deep: #0F172A;
    --c-sky-mid: #38BDF8;
    --c-sky-glow: #FDE047;
    --c-sky-heat: #F97316;
    
    --c-rock-shadow: #020617;
    --c-rock-face: #1E293B;
    --c-rock-highlight: #334155;
    
    --c-accent: #EF4444; /* Parachute Red */
    --c-accent-dark: #991B1B;
    
    --c-ui-text: #F8FAFC;
    --c-ui-dim: #94A3B8;
  }

  * { box-sizing: border-box; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--c-sky-deep);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* 
    LAYOUT STRATEGY 
    We use a 16:9 aspect ratio container centered in the viewport 
    to ensure the composition works perfectly on any screen.
  */
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  #composition {
    width: 100%;
    height: 100%;
    max-width: 177.78vh; /* 16:9 Aspect Ratio constraint */
    max-height: 56.25vw;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(0,0,0,0.5);
  }

  /* SVG Scene Layer */
  #scene-svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* UI Overlay Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
    padding: 4vw;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr auto;
  }

  /* Typography */
  .brand {
    grid-column: 1;
    grid-row: 1;
  }

  .brand h1 {
    font-size: clamp(14px, 1.5vw, 24px);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-weight: 800;
    color: var(--c-ui-text);
    margin: 0;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  }

  .data-panel {
    grid-column: 2;
    grid-row: 1;
    text-align: right;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }

  .data-row {
    font-size: clamp(10px, 1.2vw, 16px);
    color: var(--c-ui-dim);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }

  .data-value {
    color: var(--c-ui-text);
    font-weight: 700;
    font-size: 1.1em;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background-color: var(--c-accent);
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }

  .editorial {
    grid-column: 1;
    grid-row: 3;
    max-width: 40%;
  }

  .editorial h2 {
    font-size: clamp(40px, 6vw, 96px);
    line-height: 0.85;
    font-weight: 900;
    color: var(--c-ui-text);
    margin: 0;
    letter-spacing: -0.03em;
    text-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  .editorial p {
    margin-top: 20px;
    font-size: clamp(12px, 1vw, 16px);
    line-height: 1.5;
    color: var(--c-ui-text);
    max-width: 300px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    opacity: 0.9;
  }

  /* Interactive Controls */
  .controls {
    grid-column: 1;
    grid-row: 3;
    align-self: end;
    pointer-events: auto;
    display: flex;
    gap: 15px;
    margin-top: 20px;
  }

  .btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--c-ui-text);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .btn:hover {
    background: var(--c-accent);
    border-color: var(--c-accent);
    transform: scale(1.1);
  }

  .btn svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
  }

  /* Animations */
  @keyframes pulse {
    0% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-25px); }
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-1deg); }
    50% { transform: rotate(1deg); }
  }

  @keyframes drift {
    0% { transform: translateX(0) scaleX(1); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.6; }
    100% { transform: translateX(-300px) scaleX(1.2); opacity: 0; }
  }

  /* Class for JS toggles */
  .wind-active .wind-line {
    stroke-width: 2.5px !important;
    animation-duration: 1.5s !important;
    stroke: #fff;
  }
  
  .wind-active #subject-group {
    animation: float 2s ease-in-out infinite, sway 2s ease-in-out infinite !important;
  }

  #subject-group {
    animation: float 6s ease-in-out infinite, sway 10s ease-in-out infinite;
    transform-origin: 50% 100%;
  }

</style>
</head>
<body>

<div id="stage">
  <div id="composition">
    
    <!-- The Visual Scene -->
    <svg id="scene-svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- Sky: Atmospheric Depth -->
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0F172A" />
          <stop offset="35%" stop-color="#334155" />
          <stop offset="70%" stop-color="#F59E0B" />
          <stop offset="100%" stop-color="#EF4444" />
        </linearGradient>

        <!-- Canopy: Complex Lighting -->
        <radialGradient id="canopyGrad" cx="30%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#FF6B6B" />
          <stop offset="40%" stop-color="#EF4444" />
          <stop offset="100%" stop-color="#7F1D1D" />
        </radialGradient>

        <!-- Cliff Face: Geometric Depth -->
        <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#020617" />
          <stop offset="60%" stop-color="#1E293B" />
          <stop offset="100%" stop-color="#334155" />
        </linearGradient>

        <!-- Blur for distant elements -->
        <filter id="blurFar" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="8"/>
        </filter>
        
        <!-- Drop Shadow for Canopy -->
        <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="15" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
        </filter>
      </defs>

      <!-- 1. Background Sky -->
      <rect width="1200" height="675" fill="url(#skyGrad)" />

      <!-- 2. Distant Mountains (Atmospheric Perspective) -->
      <g id="bg-mountains" opacity="0.5">
        <path d="M0,675 L0,500 L150,450 L300,550 L450,480 L600,600 L1200,400 L1200,675 Z" fill="#475569" filter="url(#blurFar)" />
        <path d="M-100,675 L200,580 L500,675 Z" fill="#334155" opacity="0.6" />
      </g>

      <!-- 3. The Cliff (Foreground Right) -->
      <!-- Composed of stacked geometric shapes to suggest rock layers -->
      <g id="cliff-group" transform="translate(650, -50)">
        <!-- Base Shape -->
        <path d="M0,0 L300,0 L300,750 L0,750 Z" fill="url(#cliffGrad)" />
        
        <!-- The "Edge" - Jagged silhouette -->
        <path d="M0,0 L150,0 L180,80 L120,160 L200,300 L140,400 L220,550 L160,650 L240,750 L0,750 Z" fill="url(#cliffGrad)" />
        
        <!-- Strata Lines (Texture) -->
        <g stroke="#0F172A" stroke-width="2" opacity="0.4">
          <line x1="0" y1="80" x2="180" y2="80" />
          <line x1="0" y1="160" x2="120" y2="160" />
          <line x1="0" y1="300" x2="200" y2="300" />
          <line x1="0" y1="400" x2="140" y2="400" />
          <line x1="0" y1="550" x2="220" y2="550" />
          <line x1="0" y1="650" x2="160" y2="650" />
        </g>
        
        <!-- Shadow cast by the edge onto the face -->
        <path d="M0,0 L150,0 L180,80 L120,160 L200,300 L140,400 L220,550 L160,650 L240,750 L240,750 L240,750 L180,750 L150,650 L210,550 L130,400 L190,300 L110,160 L160,80 L150,0 Z" fill="#000" opacity="0.3" filter="url(#blurFar)"/>
      </g>

      <!-- 4. The Parachute Subject -->
      <!-- Positioned left-center to balance the heavy cliff on the right -->
      <g id="subject-group" transform="translate(400, 220)">
        
        <!-- Suspension Lines (Taut, converging) -->
        <g stroke="white" stroke-width="1.5" opacity="0.8">
          <!-- Left side lines -->
          <line x1="-120" y1="40" x2="-10" y2="140" />
          <line x1="-60" y1="70" x2="-10" y2="140" />
          <line x1="0" y1="80" x2="-10" y2="140" />
          <!-- Right side lines -->
          <line x1="120" y1="40" x2="10" y2="140" />
          <line x1="60" y1="70" x2="10" y2="140" />
          <line x1="0" y1="80" x2="10" y2="140" />
        </g>

        <!-- The Human Figure -->
        <!-- Using a stylized, slightly abstract silhouette for better editorial look -->
        <g id="rigger" transform="translate(0, 140)">
          <!-- Harness/Body -->
          <path d="M-10,0 L10,0 L12,60 L-12,60 Z" fill="#0F172A" />
          <!-- Head -->
          <circle cx="0" cy="-10" r="8" fill="#0F172A" />
          <!-- Arms (Control lines) -->
          <path d="M-10,10 Q-30,20 -40,40" stroke="#0F172A" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M10,10 Q30,20 40,40" stroke="#0F172A" stroke-width="4" fill="none" stroke-linecap="round"/>
        </g>

        <!-- The Canopy -->
        <g filter="url(#dropShadow)">
          <!-- Main Canopy Shape -->
          <path d="M-130,20 Q-65,90 0,90 Q65,90 130,20 Q65,-20 0,-20 Q-65,-20 -130,20 Z" fill="url(#canopyGrad)" />
          
          <!-- Canopy Panels/Ribs (Adds 3D volume) -->
          <g stroke="#7F1D1D" stroke-width="1" opacity="0.5">
            <path d="M0,-20 L0,90" />
            <path d="M-40,-15 L-20,90" />
            <path d="M40,-15 L20,90" />
            <path d="M-80,-5 L-40,90" />
            <path d="M80,-5 L40,90" />
          </g>
        </g>
      </g>

      <!-- 5. Foreground Wind (Dynamic Cues) -->
      <g id="wind-container">
        <path class="wind-line" d="M-100,300 Q50,280 200,310" fill="none" stroke="white" stroke-width="1" opacity="0.3" style="animation: drift 4s linear infinite;" />
        <path class="wind-line" d="M300,450 Q450,430 600,460" fill="none" stroke="white" stroke-width="1.5" opacity="0.2" style="animation: drift 6s linear infinite; animation-delay: 1s;" />
        <path class="wind-line" d="M100,150 Q200,140 300,160" fill="none" stroke="white" stroke-width="0.5" opacity="0.4" style="animation: drift 3s linear infinite; animation-delay: 0.5s;" />
      </g>

    </svg>

    <!-- UI Overlay -->
    <div class="ui-layer">
      <div class="brand">
        <h1>Verticality</h1>
      </div>
      
      <div class="data-panel">
        <div class="data-row">
          <span>ALTITUDE</span>
          <span class="data-value">2,450m</span>
        </div>
        <div class="data-row">
          <span>WIND</span>
          <span class="data-value">12km/h NW</span>
        </div>
        <div class="data-row">
          <span>STATUS</span>
          <span class="status-dot"></span>
          <span class="data-value" style="color: var(--c-accent);">DESCENT</span>
        </div>
      </div>

      <div class="editorial">
        <h2>THE<br>EDGE.</h2>
        <p>Navigating the vertical gap between geology and gravity. A study in tension, scale, and the physics of flight.</p>
      </div>

      <div class="controls">
        <button class="btn" id="windToggle" title="Toggle Wind Force">
          <svg viewBox="0 0 24 24">
            <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="btn" id="zoomToggle" title="Toggle Perspective">
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8" stroke-linecap="round" stroke-linejoin="round"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65" stroke-linecap="round" stroke-linejoin="round"></line>
          </svg>
        </button>
      </div>
    </div>

  </div>
</div>

<script>
  // Logic for Interactivity
  const composition = document.getElementById('composition');
  const windToggle = document.getElementById('windToggle');
  const zoomToggle = document.getElementById('zoomToggle');
  const bgMountains = document.getElementById('bg-mountains');
  const cliffGroup = document.getElementById('cliff-group');
  const subjectGroup = document.getElementById('subject-group');

  let isZoomed = false;
  let isHighWind = false;

  // Toggle Wind
  windToggle.addEventListener('click', () => {
    isHighWind = !isHighWind;
    if (isHighWind) {
      composition.classList.add('wind-active');
      windToggle.style.background = 'var(--c-accent)';
      windToggle.style.borderColor = 'var(--c-accent)';
    } else {
      composition.classList.remove('wind-active');
      windToggle.style.background = 'rgba(255,255,255,0.1)';
      windToggle.style.borderColor = 'rgba(255,255,255,0.2)';
    }
  });

  // Toggle Zoom (Simulated Camera Move)
  zoomToggle.addEventListener('click', () => {
    isZoomed = !isZoomed;
    if (isZoomed) {
      composition.style.transition = "transform 0.8s cubic-bezier(0.25, 1, 0.5, 1)";
      composition.style.transform = "scale(1.2) translate(-5%, -2%)";
      zoomToggle.style.background = 'var(--c-accent)';
    } else {
      composition.style.transition = "transform 0.8s cubic-bezier(0.25, 1, 0.5, 1)";
      composition.style.transform = "scale(1) translate(0, 0)";
      zoomToggle.style.background = 'rgba(255,255,255,0.1)';
    }
  });

  // Parallax Effect
  document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 2; // -1 to 1
    const y = (e.clientY / window.innerHeight - 0.5) * 2;

    // Move background mountains slowly
    bgMountains.style.transform = `translate(${x * 10}px, ${y * 5}px)`;
    
    // Move cliff faster (closer)
    cliffGroup.style.transform = `translate(${650 + x * -20}px, ${-50 + y * -10}px)`;
    
    // Move subject slightly for depth
    // We use a requestAnimationFrame for smoother updates if needed, but direct style is fine for this scale
    subjectGroup.style.transform = `translate(${400 + x * 15}px, ${220 + y * 15}px)`;
  });
</script>
</body>
</html>
