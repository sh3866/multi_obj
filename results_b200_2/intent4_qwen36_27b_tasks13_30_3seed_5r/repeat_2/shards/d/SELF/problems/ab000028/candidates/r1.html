<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verticality // The Descent</title>
<style>
  :root {
    --c-sky-top: #2B4162;
    --c-sky-mid: #FAF0CA;
    --c-sky-bot: #FF9F1C;
    --c-cliff-back: #1F2833;
    --c-cliff-front: #485461;
    --c-accent: #E71D36;
    --c-white: #FDFDFD;
    --c-text: #1F2833;
    --c-text-light: #606C76;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #000;
  }

  /* The Scene */
  #scene {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* UI Overlay Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
    display: grid;
    grid-template-columns: 5vw 1fr 5vw;
    grid-template-rows: 5vh 1fr 15vh;
    box-sizing: border-box;
  }

  /* Typography & Branding */
  .brand {
    grid-column: 1;
    grid-row: 1;
    padding: 40px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }

  .brand h1 {
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--c-text);
    margin: 0;
    position: relative;
  }
  
  .brand h1::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 100%;
    height: 2px;
    background: var(--c-accent);
  }

  /* Data Readouts */
  .data-panel {
    grid-column: 3;
    grid-row: 1;
    padding: 40px;
    text-align: right;
    font-family: "SF Mono", "Roboto Mono", "Courier New", monospace;
    font-size: 11px;
    color: var(--c-text-light);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    mix-blend-mode: multiply;
  }

  .data-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  
  .data-label { opacity: 0.7; }
  .data-value { font-weight: 700; color: var(--c-text); font-size: 13px; }
  .status-desc { color: var(--c-accent); font-weight: 800; letter-spacing: 0.05em; }

  /* Bottom Editorial Text */
  .editorial {
    grid-column: 1;
    grid-row: 3;
    padding: 0 5vw;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
  }

  .editorial h2 {
    font-size: clamp(32px, 5vw, 64px);
    line-height: 0.85;
    font-weight: 900;
    color: var(--c-text);
    margin: 0;
    letter-spacing: -0.02em;
    mix-blend-mode: multiply;
  }

  .editorial p {
    margin-top: 16px;
    font-size: 13px;
    max-width: 320px;
    line-height: 1.6;
    color: var(--c-text-light);
    mix-blend-mode: multiply;
  }

  /* Controls */
  .controls {
    grid-column: 1;
    grid-row: 3;
    padding: 0 5vw;
    display: flex;
    align-items: flex-end;
    gap: 15px;
    pointer-events: auto;
    margin-top: 20px;
  }

  .btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(31, 40, 51, 0.2);
    color: var(--c-text);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }

  .btn:hover {
    background: var(--c-accent);
    border-color: var(--c-accent);
    color: var(--c-white);
    transform: translateY(-2px);
  }

  /* SVG Animations */
  @keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-20px); }
    100% { transform: translateY(0px); }
  }

  @keyframes sway {
    0% { transform: rotate(-2deg); }
    50% { transform: rotate(2deg); }
    100% { transform: rotate(-2deg); }
  }

  @keyframes drift {
    0% { transform: translateX(0); opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { transform: translateX(-200px); opacity: 0; }
  }

  @keyframes pulse {
    0% { opacity: 0.3; }
    50% { opacity: 0.8; }
    100% { opacity: 0.3; }
  }

  .parachute-group {
    animation: float 8s ease-in-out infinite, sway 12s ease-in-out infinite;
    transform-origin: center bottom;
  }

  .wind-line {
    stroke: var(--c-white);
    stroke-width: 1.5;
    stroke-linecap: round;
    fill: none;
    opacity: 0.4;
  }
  
  .cloud-far {
    animation: drift 40s linear infinite;
  }
  .cloud-mid {
    animation: drift 25s linear infinite;
  }

</style>
</head>
<body>

<div id="viewport">
  
  <!-- UI Overlay -->
  <div class="ui-layer">
    <div class="brand">
      <h1>Verticality</h1>
    </div>
    
    <div class="data-panel">
      <div class="data-row">
        <span class="data-label">ALTITUDE</span>
        <span class="data-value">2,450m</span>
      </div>
      <div class="data-row">
        <span class="data-label">WIND</span>
        <span class="data-value">12km/h NW</span>
      </div>
      <div class="data-row">
        <span class="data-label">STATUS</span>
        <span class="data-value status-desc">DESCENT</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="windToggle" title="Toggle Wind">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
        </svg>
      </button>
      <button class="btn" id="zoomToggle" title="Toggle View">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </div>

    <div class="editorial">
      <h2>THE<br>EDGE.</h2>
      <p>Navigating the vertical gap between geology and gravity. A study in tension, scale, and the physics of flight.</p>
    </div>
  </div>

  <!-- The Scene -->
  <svg id="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Sky Gradient: Deep Blue to Golden Hour -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:var(--c-sky-top);stop-opacity:1" />
        <stop offset="40%" style="stop-color:#A9CCE3;stop-opacity:1" />
        <stop offset="80%" style="stop-color:var(--c-sky-bot);stop-opacity:1" />
        <stop offset="100%" style="stop-color:#F15BB5;stop-opacity:0.5" />
      </linearGradient>

      <!-- Canopy Gradient: High Contrast Red -->
      <radialGradient id="canopyGrad" cx="50%" cy="30%" r="70%">
        <stop offset="0%" style="stop-color:#FF3333;stop-opacity:1" />
        <stop offset="80%" style="stop-color:#B30000;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#660000;stop-opacity:1" />
      </radialGradient>

      <!-- Cliff Gradients for 3D feel -->
      <linearGradient id="cliffGradBack" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#1F2833;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#2C3E50;stop-opacity:1" />
      </linearGradient>
      
      <linearGradient id="cliffGradFront" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#485461;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#839294;stop-opacity:1" />
      </linearGradient>

      <!-- Shadows -->
      <filter id="blurShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="15"/>
        <feComponentTransfer>
          <feFuncA type="linear" slope="0.4"/>
        </feComponentTransfer>
      </filter>
      
      <filter id="blurHeavy" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="40"/>
      </filter>
    </defs>

    <!-- Background Sky -->
    <rect width="1200" height="800" fill="url(#skyGrad)" />

    <!-- Distant Landscape (Depth) -->
    <g opacity="0.6">
      <!-- Far Mountains -->
      <path d="M-100,700 L200,550 L500,700 L800,500 L1300,750 L1300,800 L-100,800 Z" fill="#D2B48C" filter="url(#blurHeavy)" opacity="0.4" />
      
      <!-- Clouds -->
      <path class="cloud-far" d="M1200,200 Q1300,180 1400,200 Q1500,220 1600,200" stroke="white" stroke-width="40" fill="none" opacity="0.3" />
      <path class="cloud-mid" d="M-200,300 Q-100,280 0,300 Q100,320 200,300" stroke="white" stroke-width="60" fill="none" opacity="0.2" style="animation-delay: -10s;" />
    </g>

    <!-- Main Cliff Face (The Edge) -->
    <g id="cliff-group">
      <!-- Cliff Back Layer (Shadowed) -->
      <path d="M550,-50 L700,-50 L750,100 L720,250 L820,400 L780,550 L880,700 L820,850 L550,850 Z" fill="url(#cliffGradBack)" filter="url(#blurShadow)" />
      
      <!-- Cliff Front Layer (The Edge) -->
      <path d="M450,-50 L600,-50 L650,100 L620,250 L720,400 L680,550 L780,700 L720,850 L450,850 Z" fill="url(#cliffGradFront)" />
      
      <!-- Geometric Texture (Strata Lines) -->
      <path d="M500,100 L640,100 M500,250 L620,250 M500,400 L720,400 M500,550 L680,550 M500,700 L780,700" stroke="#2C3E50" stroke-width="2" opacity="0.3" />
      <path d="M550,0 L550,850" stroke="#2C3E50" stroke-width="4" opacity="0.2" />
    </g>

    <!-- Parachute Subject Group -->
    <g id="subject" class="parachute-group" transform="translate(350, 250)">
      
      <!-- Suspension Lines (Taut) -->
      <g stroke="var(--c-white)" stroke-width="1.5" opacity="0.9">
        <line x1="-90" y1="70" x2="-15" y2="160" />
        <line x1="-40" y1="85" x2="-15" y2="160" />
        <line x1="0" y1="90" x2="-15" y2="160" />
        <line x1="40" y1="85" x2="-15" y2="160" />
        <line x1="90" y1="70" x2="-15" y2="160" />
        
        <line x1="-90" y1="70" x2="15" y2="160" />
        <line x1="-40" y1="85" x2="15" y2="160" />
        <line x1="0" y1="90" x2="15" y2="160" />
        <line x1="40" y1="85" x2="15" y2="160" />
        <line x1="90" y1="70" x2="15" y2="160" />
      </g>

      <!-- The Human Figure (Silhouette) -->
      <g transform="translate(0, 160)">
        <!-- Body -->
        <path d="M-6,0 C-12,20 -6,40 0,50 L0,70 L12,70 L12,50 C18,40 12,20 6,0 Z" fill="#1F2833" />
        <!-- Head -->
        <circle cx="6" cy="-6" r="7" fill="#1F2833" />
        <!-- Arms -->
        <path d="M-6,6 Q-20,15 -25,10" stroke="#1F2833" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M18,6 Q30,15 35,10" stroke="#1F2833" stroke-width="4" fill="none" stroke-linecap="round"/>
        <!-- Legs -->
        <path d="M0,70 L-8,100 L-15,100" stroke="#1F2833" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M12,70 L20,100 L15,100" stroke="#1F2833" stroke-width="5" fill="none" stroke-linecap="round"/>
      </g>

      <!-- The Canopy -->
      <path d="M-110,20 Q-50,90 0,90 Q50,90 110,20 Q50,0 0,0 Q-50,0 -110,20 Z" fill="url(#canopyGrad)" />
      <!-- Canopy Ribs (Detail) -->
      <path d="M0,0 L0,90" stroke="#800000" stroke-width="1.5" fill="none" opacity="0.6"/>
      <path d="M-50,5 L-25,90" stroke="#800000" stroke-width="1.5" fill="none" opacity="0.6"/>
      <path d="M50,5 L25,90" stroke="#800000" stroke-width="1.5" fill="none" opacity="0.6"/>
      <path d="M-80,15 L-40,90" stroke="#800000" stroke-width="1.5" fill="none" opacity="0.6"/>
      <path d="M80,15 L40,90" stroke="#800000" stroke-width="1.5" fill="none" opacity="0.6"/>

    </g>

    <!-- Foreground Wind Lines (Dynamic) -->
    <g id="wind-container">
      <path class="wind-line" d="M100,200 Q200,210 300,200" style="animation: drift 3s linear infinite;" />
      <path class="wind-line" d="M600,300 Q700,320 800,300" style="animation: drift 2.5s linear infinite; animation-delay: 0.5s;" />
      <path class="wind-line" d="M200,500 Q350,510 500,490" style="animation: drift 4s linear infinite; animation-delay: 1s;" />
      <path class="wind-line" d="M800,100 Q900,110 1000,90" style="animation: drift 3.2s linear infinite; animation-delay: 0.2s;" />
    </g>

  </svg>
</div>

<script>
  const scene = document.getElementById('scene');
  const windContainer = document.getElementById('wind-container');
  const subject = document.getElementById('subject');
  const windToggle = document.getElementById('windToggle');
  const zoomToggle = document.getElementById('zoomToggle');
  const cliffGroup = document.getElementById('cliff-group');

  let isZoomed = false;
  let windState = 'normal';

  // Toggle Wind Effect
  windToggle.addEventListener('click', () => {
    if (windState === 'normal') {
      // High Wind
      windState = 'high';
      windContainer.style.opacity = "1";
      document.querySelectorAll('.wind-line').forEach(line => {
        line.style.strokeWidth = "3";
        line.style.animationDuration = (parseFloat(line.style.animationDuration || 3) * 0.5) + 's';
      });
      subject.style.animation = 'float 3s ease-in-out infinite, sway 4s ease-in-out infinite';
      subject.style.transform = 'translate(350px, 250px) rotate(10deg)';
      
      windToggle.style.background = 'var(--c-accent)';
      windToggle.style.color = 'var(--c-white)';
      windToggle.style.borderColor = 'var(--c-accent)';
    } else {
      // Normal Wind
      windState = 'normal';
      windContainer.style.opacity = "0.4";
      document.querySelectorAll('.wind-line').forEach(line => {
        line.style.strokeWidth = "1.5";
        line.style.animationDuration = '3s';
      });
      subject.style.animation = 'float 8s ease-in-out infinite, sway 12s ease-in-out infinite';
      subject.style.transform = 'translate(350px, 250px)';
      
      windToggle.style.background = 'rgba(255,255,255,0.1)';
      windToggle.style.color = 'var(--c-text)';
      windToggle.style.borderColor = 'rgba(31, 40, 51, 0.2)';
    }
  });

  // Toggle Zoom / Scale
  zoomToggle.addEventListener('click', () => {
    isZoomed = !isZoomed;
    const targetScale = isZoomed ? "scale(1.15)" : "scale(1)";
    const targetTranslate = isZoomed ? "translate(-50px, -50px)" : "translate(0, 0)";
    
    scene.style.transition = "transform 1s cubic-bezier(0.25, 1, 0.5, 1)";
    scene.style.transform = `${targetScale} ${targetTranslate}`;
  });

  // Parallax Effect on Mouse Move
  document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5);
    const y = (e.clientY / window.innerHeight - 0.5);

    // Move the cliff slightly (Depth)
    cliffGroup.style.transform = `translate(${-x * 30}px, ${-y * 20}px)`;
    
    // Move subject slightly (Foreground/Subject Depth)
    // We apply this to the inner group, not the animated wrapper if possible, 
    // but here we modify the transform of the subject carefully
    if(windState === 'normal') {
        subject.style.transform = `translate(${350 + (x * 40)}px, ${250 + (y * 30)}px)`;
    }
  });
</script>
</body>
</html>
