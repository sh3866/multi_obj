<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verticality // The Descent</title>
<style>
  :root {
    /* 
      PALETTE: 
      Cinematic "Golden Hour" Noir.
      High contrast between the sun-bathed sky and the deep shadows of the cliff.
    */
    --c-sky-deep: #0F172A;
    --c-sky-mid: #334155;
    --c-sky-sun: #F59E0B;
    --c-sky-glow: #EF4444;
    
    --c-rock-shadow: #020617;
    --c-rock-lit: #334155;
    --c-rock-accent: #475569;
    
    --c-parachute: #DC2626;
    --c-parachute-light: #FCA5A5;
    --c-parachute-dark: #7F1D1D;
    
    --c-text-primary: #F8FAFC;
    --c-text-secondary: #94A3B8;
    
    --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --font-mono: 'Courier New', Courier, monospace;
  }

  * { box-sizing: border-box; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--c-sky-deep);
    font-family: var(--font-display);
    -webkit-font-smoothing: antialiased;
  }

  /* 
    LAYOUT: 
    Full screen immersive container.
  */
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  #composition {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
    transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  #scene-svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* UI LAYER - Glassmorphism */
  .ui-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    padding: clamp(24px, 4vw, 80px);
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr auto;
    z-index: 10;
  }

  /* Typography & Brand */
  .brand {
    grid-column: 1;
    grid-row: 1;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand::before {
    content: '';
    display: block;
    width: 4px;
    height: 24px;
    background: var(--c-parachute);
    transform: skewX(-20deg);
  }

  .brand h1 {
    font-size: clamp(12px, 1.5vw, 20px);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--c-text-primary);
    margin: 0;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  /* Data HUD */
  .data-panel {
    grid-column: 2;
    grid-row: 1;
    text-align: right;
    font-family: var(--font-mono);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 20px;
    border-radius: 4px;
    border-left: 1px solid rgba(255,255,255,0.1);
  }

  .data-row {
    font-size: clamp(10px, 1.2vw, 14px);
    color: var(--c-text-secondary);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 16px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .data-value {
    color: var(--c-text-primary);
    font-weight: 700;
    text-shadow: 0 0 10px rgba(255,255,255,0.2);
  }

  .status-indicator {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pulse-dot {
    width: 8px;
    height: 8px;
    background-color: var(--c-parachute);
    border-radius: 50%;
    box-shadow: 0 0 15px var(--c-parachute);
    animation: pulse 1.5s infinite ease-in-out;
  }

  /* Editorial Content */
  .editorial {
    grid-column: 1;
    grid-row: 3;
    max-width: 60%;
    position: relative;
    z-index: 5;
  }

  .editorial h2 {
    font-size: clamp(48px, 9vw, 140px);
    line-height: 0.8;
    font-weight: 900;
    color: var(--c-text-primary);
    margin: 0;
    letter-spacing: -0.03em;
    text-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  .editorial p {
    margin-top: 24px;
    font-size: clamp(12px, 1.1vw, 16px);
    line-height: 1.6;
    color: var(--c-text-primary);
    max-width: 360px;
    font-weight: 300;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    background: linear-gradient(90deg, rgba(15,23,42,0.8) 0%, rgba(15,23,42,0) 100%);
    padding: 10px 20px;
  }

  /* Controls */
  .controls {
    grid-column: 1;
    grid-row: 3;
    align-self: end;
    pointer-events: auto;
    display: flex;
    gap: 16px;
    margin-top: 40px;
  }

  .btn {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--c-text-primary);
    width: 56px;
    height: 56px;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }

  .btn:hover {
    background: var(--c-parachute);
    border-color: var(--c-parachute);
    transform: translateY(-4px);
    box-shadow: 0 10px 20px rgba(220, 38, 38, 0.4);
  }

  .btn svg {
    width: 24px;
    height: 24px;
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ANIMATIONS */
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 15px var(--c-parachute); }
    50% { opacity: 0.6; transform: scale(0.8); box-shadow: 0 0 5px var(--c-parachute); }
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-1deg) translateY(0); }
    50% { transform: rotate(1deg) translateY(-15px); }
  }

  @keyframes wind-drift {
    0% { transform: translateX(0) scaleX(0.5); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% { transform: translateX(-500px) scaleX(1.2); opacity: 0; }
  }

  @keyframes dust-float {
    0% { transform: translate(0, 0); opacity: 0; }
    50% { opacity: 0.6; }
    100% { transform: translate(-100px, 50px); opacity: 0; }
  }

  /* JS State Classes */
  .wind-active .wind-line {
    animation-duration: 0.8s !important;
    stroke-width: 2.5px !important;
    stroke: var(--c-text-primary) !important;
    opacity: 0.9 !important;
  }
  
  .wind-active #subject-group {
    animation: sway 1.2s ease-in-out infinite !important;
  }

  #subject-group {
    animation: sway 5s ease-in-out infinite;
    transform-origin: 50% 100%;
    transition: transform 0.5s ease;
  }

</style>
</head>
<body>

<div id="stage">
  <div id="composition">
    
    <svg id="scene-svg" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- 
          GRADIENTS: 
          Rich, high-dynamic range colors.
        -->
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0B132B" />
          <stop offset="30%" stop-color="#1C2541" />
          <stop offset="70%" stop-color="#F77F00" />
          <stop offset="95%" stop-color="#FCBF49" />
          <stop offset="100%" stop-color="#FCBF49" />
        </linearGradient>

        <!-- Cliff Gradient: Darker for depth, lighter edge for contrast -->
        <linearGradient id="cliffFaceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#000000" />
          <stop offset="60%" stop-color="#0B132B" />
          <stop offset="100%" stop-color="#3D5A80" />
        </linearGradient>

        <!-- Canopy Gradient: Volumetric red -->
        <radialGradient id="canopyGrad" cx="20%" cy="20%" r="90%">
          <stop offset="0%" stop-color="#FCA5A5" />
          <stop offset="20%" stop-color="#DC2626" />
          <stop offset="70%" stop-color="#991B1B" />
          <stop offset="100%" stop-color="#450A0A" />
        </radialGradient>

        <!-- Filters -->
        <filter id="blurFar" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="15"/>
        </filter>
        
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="4" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
        </filter>
        
        <!-- Dust/Atmosphere Blur -->
        <filter id="dustBlur">
          <feGaussianBlur stdDeviation="2" />
        </filter>
      </defs>

      <!-- 1. BACKGROUND SKY -->
      <rect width="1440" height="800" fill="url(#skyGrad)" />

      <!-- 2. DISTANT MOUNTAINS (Parallax Layer 1) -->
      <g id="bg-mountains" opacity="0.7">
        <!-- Layer 1: Faintest -->
        <path d="M0,800 L0,600 L200,550 L500,650 L800,500 L1200,600 L1440,550 L1440,800 Z" fill="#1C2541" filter="url(#blurFar)" />
        <!-- Layer 2: Closer -->
        <path d="M-200,800 L100,700 L400,800 Z" fill="#0B132B" opacity="0.9" filter="url(#blurFar)" />
      </g>

      <!-- 3. THE CLIFF (Parallax Layer 2 - Foreground Right) -->
      <!-- 
         Design Improvement: 
         Massive scale. Occupies right 30% of screen. 
         Geometric "cut" edge for modern editorial aesthetic.
      -->
      <g id="cliff-group" transform="translate(1000, -50)">
        
        <!-- Base Mass -->
        <path d="M0,0 L440,0 L440,900 L0,900 Z" fill="url(#cliffFaceGrad)" />
        
        <!-- The "Cut" Edge (Jagged Silhouette) -->
        <!-- Creating a sharp, dangerous looking rock face -->
        <path d="M0,0 L350,0 L380,120 L300,260 L360,420 L280,580 L350,740 L280,900 L0,900 Z" fill="url(#cliffFaceGrad)" />
        
        <!-- Geologic Strata (Texture Lines) -->
        <g stroke="#000000" stroke-width="4" opacity="0.4" stroke-linecap="round">
          <path d="M0,120 L380,120" />
          <path d="M0,260 L300,260" />
          <path d="M0,420 L360,420" />
          <path d="M0,580 L280,580" />
          <path d="M0,740 L350,740" />
        </g>

        <!-- Shadow Cast by Edge (Depth) -->
        <path d="M0,0 L350,0 L380,120 L300,260 L360,420 L280,580 L350,740 L280,900 L350,900 L280,740 L360,580 L280,420 L360,260 L280,120 L350,0 Z" fill="#000" opacity="0.5" filter="url(#blurFar)"/>
        
        <!-- Highlight on Edge -->
        <path d="M350,0 L380,120 L300,260 L360,420 L280,580 L350,740 L280,900" stroke="#475569" stroke-width="2" fill="none" opacity="0.5" />
      </g>

      <!-- 4. THE PARACHUTE SUBJECT (Parallax Layer 3 - Midground Left) -->
      <!-- Positioned left-center to balance the cliff -->
      <g id="subject-group" transform="translate(400, 250)">
        
        <!-- Suspension Lines (Taut, converging) -->
        <g stroke="#F8FAFC" stroke-width="1.5" opacity="0.8">
          <!-- Left side -->
          <line x1="-130" y1="60" x2="-15" y2="180" />
          <line x1="-60" y1="90" x2="-15" y2="180" />
          <line x1="0" y1="100" x2="-15" y2="180" />
          <!-- Right side -->
          <line x1="130" y1="60" x2="15" y2="180" />
          <line x1="60" y1="90" x2="15" y2="180" />
          <line x1="0" y1="100" x2="15" y2="180" />
        </g>

        <!-- The Human Figure (Stylized Silhouette) -->
        <g id="rigger" transform="translate(0, 180)">
          <!-- Body/Harness -->
          <path d="M-15,0 L15,0 L18,80 L-18,80 Z" fill="#020617" />
          <!-- Head -->
          <circle cx="0" cy="-15" r="10" fill="#020617" />
          <!-- Arms (Braking toggles) -->
          <path d="M-15,20 Q-40,35 -55,60" stroke="#020617" stroke-width="6" fill="none" stroke-linecap="round"/>
          <path d="M15,20 Q40,35 55,60" stroke="#020617" stroke-width="6" fill="none" stroke-linecap="round"/>
          <!-- Toggles -->
          <rect x="-60" y="60" width="10" height="20" rx="2" fill="#333" transform="rotate(-15 -55 70)" />
          <rect x="50" y="60" width="10" height="20" rx="2" fill="#333" transform="rotate(15 55 70)" />
        </g>

        <!-- The Canopy -->
        <g filter="url(#dropShadow)">
          <!-- Main Canopy Shape (3D Crescent) -->
          <path d="M-160,40 Q-80,130 0,130 Q80,130 160,40 Q80,-40 0,-40 Q-80,-40 -160,40 Z" fill="url(#canopyGrad)" />
          
          <!-- Canopy Ribs (Structure) -->
          <g stroke="#450A0A" stroke-width="2" opacity="0.5">
            <path d="M0,-40 L0,130" />
            <path d="M-50,-30 L-20,130" />
            <path d="M50,-30 L20,130" />
            <path d="M-100,-10 L-40,130" />
            <path d="M100,-10 L40,130" />
          </g>
          
          <!-- Highlight on Canopy -->
          <path d="M-120,20 Q-60,80 0,80 Q60,80 120,20" stroke="rgba(255,255,255,0.2)" stroke-width="3" fill="none" />
        </g>
      </g>

      <!-- 5. FOREGROUND WIND & DUST (Dynamic Cues) -->
      <g id="wind-container">
        <!-- Wind Lines -->
        <path class="wind-line" d="M-100,300 Q50,280 200,310" fill="none" stroke="white" stroke-width="1" opacity="0.3" style="animation: wind-drift 5s linear infinite;" />
        <path class="wind-line" d="M200,500 Q350,480 500,510" fill="none" stroke="white" stroke-width="1.5" opacity="0.2" style="animation: wind-drift 7s linear infinite; animation-delay: 2s;" />
        <path class="wind-line" d="M-50,150 Q50,140 150,160" fill="none" stroke="white" stroke-width="0.5" opacity="0.5" style="animation: wind-drift 4s linear infinite; animation-delay: 1s;" />
        
        <!-- Dust Particles from Cliff -->
        <g id="dust-particles" fill="#FCBF49" filter="url(#dustBlur)">
          <circle cx="1000" cy="600" r="3" style="animation: dust-float 4s linear infinite;" />
          <circle cx="1050" cy="700" r="4" style="animation: dust-float 5s linear infinite; animation-delay: 1s;" />
          <circle cx="980" cy="500" r="2" style="animation: dust-float 3s linear infinite; animation-delay: 2s;" />
          <circle cx="1100" cy="650" r="5" style="animation: dust-float 6s linear infinite; animation-delay: 0.5s;" />
        </g>
      </g>

    </svg>

    <!-- UI Overlay -->
    <div class="ui-layer">
      <div class="brand">
        <h1>Verticality</h1>
      </div>
      
      <div class="data-panel">
        <div class="data-row">
          <span>Altitude</span>
          <span class="data-value">2,450M</span>
        </div>
        <div class="data-row">
          <span>Wind</span>
          <span class="data-value">12KM/H NW</span>
        </div>
        <div class="data-row status-indicator">
          <span>Status</span>
          <div class="pulse-dot"></div>
          <span class="data-value" style="color: var(--c-parachute);">DESCENT</span>
        </div>
      </div>

      <div class="editorial">
        <h2>THE<br>EDGE.</h2>
        <p>Navigating the vertical gap between geology and gravity. A study in tension, scale, and the physics of flight.</p>
      </div>

      <div class="controls">
        <button class="btn" id="windToggle" title="Toggle Wind Force">
          <svg viewBox="0 0 24 24">
            <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2" />
          </svg>
        </button>
        <button class="btn" id="zoomToggle" title="Toggle Perspective">
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </button>
      </div>
    </div>

  </div>
</div>

<script>
  // Logic for Interactivity
  const composition = document.getElementById('composition');
  const windToggle = document.getElementById('windToggle');
  const zoomToggle = document.getElementById('zoomToggle');
  const bgMountains = document.getElementById('bg-mountains');
  const cliffGroup = document.getElementById('cliff-group');
  const subjectGroup = document.getElementById('subject-group');

  let isZoomed = false;
  let isHighWind = false;

  // Toggle Wind
  windToggle.addEventListener('click', () => {
    isHighWind = !isHighWind;
    if (isHighWind) {
      composition.classList.add('wind-active');
      windToggle.style.background = 'var(--c-parachute)';
      windToggle.style.borderColor = 'var(--c-parachute)';
    } else {
      composition.classList.remove('wind-active');
      windToggle.style.background = 'rgba(255,255,255,0.03)';
      windToggle.style.borderColor = 'rgba(255,255,255,0.15)';
    }
  });

  // Toggle Zoom (Simulated Camera Move)
  zoomToggle.addEventListener('click', () => {
    isZoomed = !isZoomed;
    if (isZoomed) {
      composition.style.transform = "scale(1.15) translate(-5%, -2%)";
      zoomToggle.style.background = 'var(--c-parachute)';
    } else {
      composition.style.transform = "scale(1) translate(0, 0)";
      zoomToggle.style.background = 'rgba(255,255,255,0.03)';
    }
  });

  // Parallax Effect
  document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 2; // -1 to 1
    const y = (e.clientY / window.innerHeight - 0.5) * 2;

    // Move background mountains slowly (Far)
    bgMountains.style.transform = `translate(${x * 20}px, ${y * 10}px)`;
    
    // Move cliff faster (Close)
    // Base transform is translate(1000, -50)
    cliffGroup.style.transform = `translate(${1000 + x * -30}px, ${-50 + y * -15}px)`;
    
    // Move subject slightly (Mid)
    // Base transform is translate(400, 250)
    subjectGroup.style.transform = `translate(${400 + x * 15}px, ${250 + y * 15}px)`;
  });
</script>
</body>
</html>
