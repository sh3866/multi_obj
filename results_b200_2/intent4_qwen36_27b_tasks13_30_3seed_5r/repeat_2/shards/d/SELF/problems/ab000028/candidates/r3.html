<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verticality // The Descent</title>
<style>
  :root {
    /* 
      PALETTE: 
      Refined for cinematic contrast. 
      Deep atmospheric blues, sharp slate greys for geology, 
      and a vibrant crimson accent for the parachute.
    */
    --c-sky-top: #020617;
    --c-sky-horizon: #334155;
    --c-sky-sun: #F59E0B;
    
    --c-rock-dark: #0F172A;
    --c-rock-mid: #1E293B;
    --c-rock-light: #334155;
    --c-rock-edge: #475569;
    
    --c-accent: #EF4444;
    --c-accent-glow: rgba(239, 68, 68, 0.4);
    
    --c-text-main: #F8FAFC;
    --c-text-muted: #94A3B8;
    
    --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --font-mono: 'Courier New', Courier, monospace;
  }

  * { box-sizing: border-box; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--c-sky-top);
    font-family: var(--font-display);
    -webkit-font-smoothing: antialiased;
  }

  /* 
    LAYOUT: 
    Fixed aspect ratio container to preserve composition integrity across devices.
  */
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  #composition {
    width: 100%;
    height: 100%;
    max-width: 177.78vh; /* 16:9 Aspect Ratio */
    max-height: 56.25vw;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(0,0,0,0.6);
    transition: transform 1s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  #scene-svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* UI LAYER */
  .ui-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    padding: clamp(20px, 4vw, 60px);
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr auto;
    z-index: 10;
  }

  /* Typography & Brand */
  .brand {
    grid-column: 1;
    grid-row: 1;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand::before {
    content: '';
    display: block;
    width: 20px;
    height: 2px;
    background: var(--c-accent);
  }

  .brand h1 {
    font-size: clamp(12px, 1.2vw, 18px);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--c-text-main);
    margin: 0;
    opacity: 0.9;
  }

  /* Data HUD */
  .data-panel {
    grid-column: 2;
    grid-row: 1;
    text-align: right;
    font-family: var(--font-mono);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  .data-row {
    font-size: clamp(10px, 1vw, 14px);
    color: var(--c-text-muted);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .data-value {
    color: var(--c-text-main);
    font-weight: 700;
  }

  .status-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pulse-dot {
    width: 6px;
    height: 6px;
    background-color: var(--c-accent);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--c-accent-glow);
    animation: pulse 2s infinite ease-in-out;
  }

  /* Editorial Content */
  .editorial {
    grid-column: 1;
    grid-row: 3;
    max-width: 50%;
    position: relative;
    z-index: 5;
  }

  .editorial h2 {
    font-size: clamp(48px, 7vw, 110px);
    line-height: 0.85;
    font-weight: 900;
    color: var(--c-text-main);
    margin: 0;
    letter-spacing: -0.02em;
    text-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .editorial p {
    margin-top: 24px;
    font-size: clamp(12px, 1vw, 16px);
    line-height: 1.6;
    color: var(--c-text-main);
    max-width: 320px;
    font-weight: 400;
    opacity: 0.8;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }

  /* Controls */
  .controls {
    grid-column: 1;
    grid-row: 3;
    align-self: end;
    pointer-events: auto;
    display: flex;
    gap: 16px;
    margin-top: 30px;
  }

  .btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--c-text-main);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .btn:hover {
    background: var(--c-accent);
    border-color: var(--c-accent);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px var(--c-accent-glow);
  }

  .btn svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ANIMATIONS */
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-2deg) translateY(0); }
    50% { transform: rotate(2deg) translateY(-10px); }
  }

  @keyframes wind-drift {
    0% { transform: translateX(0) scaleX(1); opacity: 0; }
    20% { opacity: 0.6; }
    80% { opacity: 0.6; }
    100% { transform: translateX(-400px) scaleX(1.1); opacity: 0; }
  }

  /* JS State Classes */
  .wind-active .wind-line {
    animation-duration: 1.2s !important;
    stroke-width: 2px !important;
    opacity: 0.8 !important;
  }
  
  .wind-active #subject-group {
    animation: sway 1.5s ease-in-out infinite !important;
  }

  #subject-group {
    animation: sway 6s ease-in-out infinite;
    transform-origin: 50% 100%;
  }

</style>
</head>
<body>

<div id="stage">
  <div id="composition">
    
    <svg id="scene-svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- 
          GRADIENTS: 
          Refined for "Golden Hour" depth. 
        -->
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="var(--c-sky-top)" />
          <stop offset="40%" stop-color="var(--c-sky-horizon)" />
          <stop offset="85%" stop-color="var(--c-sky-sun)" />
          <stop offset="100%" stop-color="#EF4444" />
        </linearGradient>

        <linearGradient id="cliffFaceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="var(--c-rock-dark)" />
          <stop offset="40%" stop-color="var(--c-rock-mid)" />
          <stop offset="100%" stop-color="var(--c-rock-edge)" />
        </linearGradient>

        <radialGradient id="canopyGrad" cx="30%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#FF6B6B" />
          <stop offset="30%" stop-color="#EF4444" />
          <stop offset="80%" stop-color="#991B1B" />
          <stop offset="100%" stop-color="#450A0A" />
        </radialGradient>

        <!-- Filters -->
        <filter id="blurFar" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="12"/>
        </filter>
        
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="5" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="20" stdDeviation="15" flood-color="#000" flood-opacity="0.4"/>
        </filter>
      </defs>

      <!-- 1. BACKGROUND SKY -->
      <rect width="1200" height="675" fill="url(#skyGrad)" />

      <!-- 2. DISTANT MOUNTAINS (Parallax Layer 1) -->
      <g id="bg-mountains" opacity="0.6">
        <!-- Soft, hazy silhouettes -->
        <path d="M0,675 L0,550 L100,520 L250,580 L400,500 L600,600 L1200,450 L1200,675 Z" fill="#475569" filter="url(#blurFar)" />
        <path d="M-200,675 L100,620 L300,675 Z" fill="#334155" opacity="0.8" filter="url(#blurFar)" />
      </g>

      <!-- 3. THE CLIFF (Parallax Layer 2 - Foreground) -->
      <!-- 
         Design Improvement: 
         Moved to right side to create a strong "L" composition. 
         Geometric layering for a modern, editorial look.
      -->
      <g id="cliff-group" transform="translate(700, -20)">
        
        <!-- Base Mass -->
        <path d="M0,0 L400,0 L400,750 L0,750 Z" fill="url(#cliffFaceGrad)" />
        
        <!-- The "Cut" Edge (Jagged Silhouette) -->
        <path d="M0,0 L250,0 L280,100 L200,220 L260,350 L180,480 L250,620 L180,750 L0,750 Z" fill="url(#cliffFaceGrad)" />
        
        <!-- Geologic Strata (Texture Lines) -->
        <g stroke="#0F172A" stroke-width="3" opacity="0.3" stroke-linecap="round">
          <path d="M0,100 L280,100" />
          <path d="M0,220 L200,220" />
          <path d="M0,350 L260,350" />
          <path d="M0,480 L180,480" />
          <path d="M0,620 L250,620" />
        </g>

        <!-- Shadow Cast by Edge (Depth) -->
        <path d="M0,0 L250,0 L280,100 L200,220 L260,350 L180,480 L250,620 L180,750 L250,750 L200,620 L270,480 L190,350 L270,220 L190,100 L250,0 Z" fill="#000" opacity="0.2" filter="url(#blurFar)"/>
      </g>

      <!-- 4. THE PARACHUTE SUBJECT (Parallax Layer 3 - Midground) -->
      <!-- Positioned left-center to balance the cliff -->
      <g id="subject-group" transform="translate(350, 200)">
        
        <!-- Suspension Lines (Taut, converging) -->
        <g stroke="white" stroke-width="1.5" opacity="0.7">
          <!-- Left side -->
          <line x1="-110" y1="50" x2="-15" y2="160" />
          <line x1="-50" y1="80" x2="-15" y2="160" />
          <line x1="0" y1="90" x2="-15" y2="160" />
          <!-- Right side -->
          <line x1="110" y1="50" x2="15" y2="160" />
          <line x1="50" y1="80" x2="15" y2="160" />
          <line x1="0" y1="90" x2="15" y2="160" />
        </g>

        <!-- The Human Figure (Stylized Silhouette) -->
        <g id="rigger" transform="translate(0, 160)">
          <!-- Body/Harness -->
          <path d="M-12,0 L12,0 L14,70 L-14,70 Z" fill="#020617" />
          <!-- Head -->
          <circle cx="0" cy="-12" r="9" fill="#020617" />
          <!-- Arms (Braking toggles) -->
          <path d="M-12,15 Q-35,30 -45,50" stroke="#020617" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M12,15 Q35,30 45,50" stroke="#020617" stroke-width="5" fill="none" stroke-linecap="round"/>
        </g>

        <!-- The Canopy -->
        <g filter="url(#dropShadow)">
          <!-- Main Canopy Shape (3D Crescent) -->
          <path d="M-140,30 Q-70,110 0,110 Q70,110 140,30 Q70,-30 0,-30 Q-70,-30 -140,30 Z" fill="url(#canopyGrad)" />
          
          <!-- Canopy Ribs (Structure) -->
          <g stroke="#450A0A" stroke-width="1.5" opacity="0.6">
            <path d="M0,-30 L0,110" />
            <path d="M-45,-20 L-20,110" />
            <path d="M45,-20 L20,110" />
            <path d="M-90,-5 L-40,110" />
            <path d="M90,-5 L40,110" />
          </g>
        </g>
      </g>

      <!-- 5. FOREGROUND WIND (Dynamic Cues) -->
      <g id="wind-container">
        <path class="wind-line" d="M-100,250 Q50,230 200,260" fill="none" stroke="white" stroke-width="1" opacity="0.3" style="animation: wind-drift 5s linear infinite;" />
        <path class="wind-line" d="M200,450 Q350,430 500,460" fill="none" stroke="white" stroke-width="1.5" opacity="0.2" style="animation: wind-drift 7s linear infinite; animation-delay: 2s;" />
        <path class="wind-line" d="M-50,100 Q50,90 150,110" fill="none" stroke="white" stroke-width="0.5" opacity="0.5" style="animation: wind-drift 4s linear infinite; animation-delay: 1s;" />
      </g>

    </svg>

    <!-- UI Overlay -->
    <div class="ui-layer">
      <div class="brand">
        <h1>Verticality</h1>
      </div>
      
      <div class="data-panel">
        <div class="data-row">
          <span>Altitude</span>
          <span class="data-value">2,450m</span>
        </div>
        <div class="data-row">
          <span>Wind</span>
          <span class="data-value">12km/h NW</span>
        </div>
        <div class="data-row status-indicator">
          <span>Status</span>
          <div class="pulse-dot"></div>
          <span class="data-value" style="color: var(--c-accent);">DESCENT</span>
        </div>
      </div>

      <div class="editorial">
        <h2>THE<br>EDGE.</h2>
        <p>Navigating the vertical gap between geology and gravity. A study in tension, scale, and the physics of flight.</p>
      </div>

      <div class="controls">
        <button class="btn" id="windToggle" title="Toggle Wind Force">
          <svg viewBox="0 0 24 24">
            <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2" />
          </svg>
        </button>
        <button class="btn" id="zoomToggle" title="Toggle Perspective">
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </button>
      </div>
    </div>

  </div>
</div>

<script>
  // Logic for Interactivity
  const composition = document.getElementById('composition');
  const windToggle = document.getElementById('windToggle');
  const zoomToggle = document.getElementById('zoomToggle');
  const bgMountains = document.getElementById('bg-mountains');
  const cliffGroup = document.getElementById('cliff-group');
  const subjectGroup = document.getElementById('subject-group');

  let isZoomed = false;
  let isHighWind = false;

  // Toggle Wind
  windToggle.addEventListener('click', () => {
    isHighWind = !isHighWind;
    if (isHighWind) {
      composition.classList.add('wind-active');
      windToggle.style.background = 'var(--c-accent)';
      windToggle.style.borderColor = 'var(--c-accent)';
    } else {
      composition.classList.remove('wind-active');
      windToggle.style.background = 'rgba(255,255,255,0.05)';
      windToggle.style.borderColor = 'rgba(255,255,255,0.1)';
    }
  });

  // Toggle Zoom (Simulated Camera Move)
  zoomToggle.addEventListener('click', () => {
    isZoomed = !isZoomed;
    if (isZoomed) {
      composition.style.transform = "scale(1.2) translate(-5%, -2%)";
      zoomToggle.style.background = 'var(--c-accent)';
    } else {
      composition.style.transform = "scale(1) translate(0, 0)";
      zoomToggle.style.background = 'rgba(255,255,255,0.05)';
    }
  });

  // Parallax Effect
  document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 2; // -1 to 1
    const y = (e.clientY / window.innerHeight - 0.5) * 2;

    // Move background mountains slowly (Far)
    bgMountains.style.transform = `translate(${x * 15}px, ${y * 8}px)`;
    
    // Move cliff faster (Close)
    // Base transform is translate(700, -20)
    cliffGroup.style.transform = `translate(${700 + x * -25}px, ${-20 + y * -12}px)`;
    
    // Move subject slightly (Mid)
    // Base transform is translate(350, 200)
    subjectGroup.style.transform = `translate(${350 + x * 10}px, ${200 + y * 10}px)`;
  });
</script>
</body>
</html>
