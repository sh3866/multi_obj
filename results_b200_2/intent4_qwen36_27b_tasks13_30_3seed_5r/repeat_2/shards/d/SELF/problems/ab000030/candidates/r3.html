<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Hub // Aetheria</title>
<style>
    :root {
        /* Palette - Deep Space & Neon */
        --bg-body: #0b0c10;
        --bg-app: #12141a;
        --bg-surface: #1b1e26;
        --bg-surface-hover: #242833;
        --bg-glass: rgba(27, 30, 38, 0.7);
        
        --primary: #ff9d00; /* Amber Gold */
        --primary-glow: rgba(255, 157, 0, 0.4);
        --secondary: #4facfe; /* Cyan */
        --secondary-glow: rgba(79, 172, 254, 0.4);
        --success: #00f260; /* Neon Green */
        --danger: #ff416c; /* Hot Red/Pink */
        
        --text-main: #ffffff;
        --text-muted: #9ca3af;
        --text-dim: #6b7280;
        
        --border: rgba(255, 255, 255, 0.08);
        --border-active: rgba(255, 157, 0, 0.3);
        
        --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        
        --radius-lg: 24px;
        --radius-md: 16px;
        --radius-sm: 12px;
        
        --shadow-card: 0 8px 32px rgba(0,0,0,0.2);
        --shadow-glow: 0 0 20px var(--primary-glow);
    }

    * { box-sizing: border-box; outline: none; user-select: none; }
    
    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-body);
        color: var(--text-main);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        background-image: 
            radial-gradient(circle at 10% 20%, rgba(79, 172, 254, 0.08) 0%, transparent 40%),
            radial-gradient(circle at 90% 80%, rgba(255, 157, 0, 0.08) 0%, transparent 40%);
    }

    /* --- Main App Shell --- */
    .app-container {
        width: 1500px;
        height: 950px;
        background: var(--bg-app);
        border-radius: 40px;
        box-shadow: 0 40px 100px -20px rgba(0,0,0,0.8), 0 0 0 1px var(--border);
        display: grid;
        grid-template-columns: 340px 1fr 420px;
        overflow: hidden;
        position: relative;
    }

    /* --- Scrollbar --- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* --- Sidebar --- */
    .sidebar {
        background: rgba(0,0,0,0.2);
        border-right: 1px solid var(--border);
        padding: 40px 30px;
        display: flex;
        flex-direction: column;
        gap: 50px;
    }

    .profile-card {
        text-align: center;
        position: relative;
    }

    .avatar-ring {
        width: 110px;
        height: 110px;
        margin: 0 auto 20px;
        border-radius: 32px;
        padding: 4px;
        background: linear-gradient(135deg, var(--primary), #ff512f);
        box-shadow: 0 10px 30px rgba(255, 81, 47, 0.3);
        position: relative;
    }

    .avatar-img {
        width: 100%;
        height: 100%;
        border-radius: 28px;
        background: var(--bg-surface);
        object-fit: cover;
        border: 3px solid var(--bg-app);
    }

    .status-badge {
        position: absolute;
        bottom: 5px;
        right: 5px;
        width: 22px;
        height: 22px;
        background: var(--success);
        border: 4px solid var(--bg-app);
        border-radius: 50%;
        z-index: 2;
        box-shadow: 0 0 10px var(--success);
    }

    .profile-info h2 {
        margin: 0;
        font-size: 1.6rem;
        font-weight: 800;
        letter-spacing: -0.5px;
    }

    .profile-title {
        color: var(--primary);
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-top: 8px;
        display: inline-block;
        background: rgba(255, 157, 0, 0.1);
        padding: 4px 12px;
        border-radius: 20px;
    }

    .party-section h3 {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .party-count {
        color: var(--text-main);
        background: var(--bg-surface);
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 0.7rem;
    }

    .party-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .party-member {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px;
        background: var(--bg-surface);
        border-radius: var(--radius-md);
        border: 1px solid transparent;
        transition: all 0.2s;
        cursor: pointer;
    }

    .party-member:hover {
        background: var(--bg-surface-hover);
        border-color: var(--border);
        transform: translateY(-2px);
    }

    .mini-avatar {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: #333;
        position: relative;
        flex-shrink: 0;
    }
    
    .mini-avatar img { width: 100%; height: 100%; border-radius: 14px; object-fit: cover; }
    
    .mini-status {
        position: absolute;
        bottom: -2px; right: -2px;
        width: 12px; height: 12px;
        border-radius: 50%;
        border: 3px solid var(--bg-surface);
    }

    .member-info { flex: 1; }
    .member-name { font-size: 0.95rem; font-weight: 700; color: var(--text-main); display: block; }
    .member-status { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; display: block; }

    /* --- Main Content --- */
    .main-content {
        display: flex;
        flex-direction: column;
        background: transparent;
        position: relative;
    }

    .header-area {
        padding: 50px 50px 30px 50px;
        display: flex;
        flex-direction: column;
        gap: 30px;
    }

    .search-wrapper {
        position: relative;
    }

    .search-input {
        width: 100%;
        background: var(--bg-surface);
        border: 1px solid var(--border);
        padding: 18px 20px 18px 55px;
        border-radius: 20px;
        color: var(--text-main);
        font-size: 1rem;
        font-weight: 500;
        transition: 0.3s;
    }

    .search-input:focus {
        background: var(--bg-surface-hover);
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(255, 157, 0, 0.1);
    }

    .search-icon {
        position: absolute;
        left: 22px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
    }

    .filter-tabs {
        display: flex;
        gap: 10px;
    }

    .tab {
        padding: 10px 24px;
        border-radius: 14px;
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.2s;
        background: transparent;
    }

    .tab:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
    
    .tab.active {
        background: var(--primary);
        color: #000;
        box-shadow: 0 4px 15px rgba(255, 157, 0, 0.3);
    }

    .friend-list {
        flex: 1;
        overflow-y: auto;
        padding: 0 50px 50px 50px;
    }

    .friend-item {
        display: flex;
        align-items: center;
        padding: 20px;
        border-radius: var(--radius-lg);
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        border: 1px solid transparent;
        margin-bottom: 12px;
        background: rgba(255,255,255,0.01);
    }

    .friend-item:hover {
        background: var(--bg-surface);
        border-color: var(--border);
        transform: translateX(4px);
    }

    .friend-item.selected {
        background: var(--bg-surface-hover);
        border-color: var(--primary);
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .friend-avatar {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        position: relative;
        margin-right: 20px;
        background: #222;
        flex-shrink: 0;
    }
    
    .friend-avatar img { width: 100%; height: 100%; border-radius: 18px; object-fit: cover;}

    .friend-details { flex: 1; }
    .friend-name { font-weight: 700; font-size: 1.15rem; margin-bottom: 8px; color: var(--text-main); letter-spacing: 0.2px; }
    .friend-meta { font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 8px; font-weight: 500; }
    
    .status-pill {
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    
    .status-pill.online { background: rgba(0, 242, 96, 0.15); color: var(--success); }
    .status-pill.ingame { background: rgba(79, 172, 254, 0.15); color: var(--secondary); }
    .status-pill.offline { background: rgba(255,255,255,0.05); color: var(--text-dim); }

    .friend-actions {
        display: flex;
        gap: 10px;
        opacity: 0;
        transform: translateX(10px);
        transition: 0.2s;
    }

    .friend-item:hover .friend-actions, 
    .friend-item.selected .friend-actions {
        opacity: 1;
        transform: translateX(0);
    }

    .icon-btn {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.03);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text-muted);
        transition: 0.2s;
    }

    .icon-btn:hover {
        background: var(--bg-surface-hover);
        color: var(--text-main);
        border-color: var(--text-muted);
    }
    
    .icon-btn.primary:hover {
        background: var(--primary);
        color: #000;
        border-color: var(--primary);
        box-shadow: 0 0 15px var(--primary-glow);
    }

    /* --- Right Panel --- */
    .details-panel {
        background: var(--bg-surface);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        position: relative;
    }

    .panel-header {
        padding: 30px;
        border-bottom: 1px solid var(--border);
        font-weight: 800;
        font-size: 1.2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .badge {
        background: var(--danger);
        color: white;
        font-size: 0.7rem;
        padding: 6px 14px;
        border-radius: 20px;
        font-weight: 800;
        box-shadow: 0 4px 12px rgba(255, 65, 108, 0.4);
    }

    .requests-list {
        flex: 1;
        overflow-y: auto;
        padding: 30px;
    }

    .request-card {
        background: var(--bg-app);
        border-radius: var(--radius-lg);
        padding: 24px;
        margin-bottom: 20px;
        border: 1px solid var(--border);
        position: relative;
        overflow: hidden;
        transition: 0.3s;
    }
    
    .request-card:hover {
        border-color: var(--secondary);
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .request-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; bottom: 0; width: 4px;
        background: var(--secondary);
    }

    .request-user {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
    }

    .req-avatar {
        width: 52px; height: 52px; border-radius: 16px;
        background: #333;
    }
    .req-avatar img { width: 100%; height: 100%; border-radius: 16px; }

    .req-name { font-weight: 700; font-size: 1.1rem; color: var(--text-main); }
    .req-time { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }

    .req-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .btn {
        padding: 14px 0;
        border-radius: 14px;
        border: none;
        font-weight: 700;
        font-size: 0.9rem;
        cursor: pointer;
        transition: 0.2s;
        text-align: center;
    }

    .btn-accept {
        background: var(--secondary);
        color: #000;
    }
    .btn-accept:hover { background: #7ce0ff; box-shadow: 0 0 15px var(--secondary-glow); }

    .btn-decline {
        background: rgba(255,255,255,0.05);
        color: var(--text-muted);
        border: 1px solid var(--border);
    }
    .btn-decline:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }

    /* --- Detail View --- */
    .detail-view {
        display: none;
        flex-direction: column;
        height: 100%;
        animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        background: var(--bg-surface);
    }

    @keyframes slideIn {
        from { opacity: 0; transform: translateX(20px); }
        to { opacity: 1; transform: translateX(0); }
    }

    .detail-header {
        padding: 60px 30px 30px;
        text-align: center;
        background: linear-gradient(180deg, rgba(255, 157, 0, 0.05) 0%, transparent 100%);
        position: relative;
    }
    
    .back-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: 0.2s;
        padding: 8px 16px;
        border-radius: 12px;
        font-weight: 600;
    }
    .back-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }

    .detail-avatar {
        width: 130px;
        height: 130px;
        border-radius: 36px;
        margin: 0 auto 20px;
        border: 4px solid var(--bg-surface);
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        background: #333;
        position: relative;
        z-index: 2;
    }
    .detail-avatar img { width: 100%; height: 100%; border-radius: 32px; }

    .detail-name { font-size: 2rem; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
    .detail-rank { color: var(--primary); font-weight: 800; font-size: 0.9rem; margin-top: 10px; display: block; text-transform: uppercase; letter-spacing: 1.5px; }
    .detail-status { color: var(--text-muted); font-size: 0.9rem; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500; }

    .detail-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        padding: 30px;
        margin-top: 10px;
    }

    .stat-box {
        background: rgba(255,255,255,0.03);
        padding: 20px;
        border-radius: 20px;
        text-align: center;
        border: 1px solid var(--border);
        transition: 0.3s;
    }
    .stat-box:hover { border-color: var(--border-active); background: rgba(255,255,255,0.05); }
    .stat-val { display: block; font-size: 1.5rem; font-weight: 800; color: var(--text-main); margin-bottom: 4px; }
    .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }

    .detail-actions {
        padding: 30px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: auto;
        margin-bottom: 20px;
    }

    .btn-primary {
        background: var(--primary);
        color: #000;
        font-weight: 800;
        padding: 18px;
        border-radius: 18px;
        border: none;
        cursor: pointer;
        box-shadow: 0 10px 30px -5px var(--primary-glow);
        transition: 0.2s;
        font-size: 1rem;
        letter-spacing: 0.5px;
    }
    .btn-primary:hover { transform: translateY(-3px); filter: brightness(1.1); }

    .btn-secondary {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-main);
        font-weight: 700;
        padding: 16px;
        border-radius: 18px;
        cursor: pointer;
        transition: 0.2s;
        font-size: 0.95rem;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.05); border-color: var(--text-muted); }

    .btn-battle {
        background: rgba(255, 65, 108, 0.1);
        color: var(--danger);
        border: 1px solid rgba(255, 65, 108, 0.2);
    }
    .btn-battle:hover { background: var(--danger); color: white; box-shadow: 0 10px 30px -5px rgba(255, 65, 108, 0.4); border-color: transparent; }

    /* --- SVG Icons --- */
    svg { fill: currentColor; }

    /* --- Utility Classes --- */
    .hidden { display: none !important; }

</style>
</head>
<body>

<div class="app-container">
    
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="profile-card">
            <div class="avatar-ring">
                <!-- Inline SVG Avatar for "Me" -->
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23ff9d00'/%3E%3Cstop offset='100%25' stop-color='%23ff512f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='28' fill='%23222'/%3E%3Ccircle cx='50' cy='40' r='22' fill='url(%23g)'/%3E%3Cpath d='M20 95 Q50 65 80 95' fill='url(%23g)'/%3E%3C/svg%3E" alt="Me" class="avatar-img">
                <div class="status-badge"></div>
            </div>
            <div class="profile-info">
                <h2>NeonRider</h2>
                <span class="profile-title">Grandmaster</span>
            </div>
        </div>

        <div class="party-section">
            <h3>Active Party <span class="party-count">3/4</span></h3>
            <div class="party-list">
                <!-- Party Member 1 -->
                <div class="party-member">
                    <div class="mini-avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%231b263c'/%3E%3Ccircle cx='50' cy='50' r='25' fill='%234facfe'/%3E%3C/svg%3E" alt="User">
                        <div class="mini-status" style="background: var(--secondary); box-shadow: 0 0 8px var(--secondary);"></div>
                    </div>
                    <div class="member-info">
                        <span class="member-name">CyberWolf</span>
                        <span class="member-status">In Game: Battle Arena</span>
                    </div>
                </div>
                <!-- Party Member 2 -->
                <div class="party-member">
                    <div class="mini-avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%233c1b26'/%3E%3Ccircle cx='50' cy='50' r='25' fill='%23ff416c'/%3E%3C/svg%3E" alt="User">
                        <div class="mini-status" style="background: var(--success); box-shadow: 0 0 8px var(--success);"></div>
                    </div>
                    <div class="member-info">
                        <span class="member-name">Viper_X</span>
                        <span class="member-status">In Lobby</span>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <section class="main-content">
        <div class="header-area">
            <div class="search-wrapper">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" class="search-input" placeholder="Search friends by name or ID...">
            </div>
            <div class="filter-tabs">
                <div class="tab active">All Friends</div>
                <div class="tab">Online</div>
                <div class="tab">In Game</div>
            </div>
        </div>

        <div class="friend-list" id="friendList">
            <!-- Populated by JS -->
        </div>
    </section>

    <!-- RIGHT PANEL -->
    <aside class="details-panel">
        
        <!-- VIEW 1: Friend Requests -->
        <div id="requestsView" style="display: flex; flex-direction: column; height: 100%;">
            <div class="panel-header">
                <span>Requests</span>
                <span class="badge">3 New</span>
            </div>
            
            <div class="requests-list">
                <!-- Request 1 -->
                <div class="request-card">
                    <div class="request-user">
                        <div class="req-avatar">
                            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%232d3436'/%3E%3Cpath d='M50 20 L80 80 L20 80 Z' fill='%23a29bfe'/%3E%3C/svg%3E" alt="User">
                        </div>
                        <div>
                            <div class="req-name">Glitch_Monkey</div>
                            <div class="req-time">Invited 2m ago</div>
                        </div>
                    </div>
                    <div class="req-actions">
                        <button class="btn btn-accept">Accept</button>
                        <button class="btn btn-decline">Decline</button>
                    </div>
                </div>

                <!-- Request 2 -->
                <div class="request-card">
                    <div class="request-user">
                        <div class="req-avatar">
                            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%23636e72'/%3E%3Ccircle cx='50' cy='50' r='30' fill='%2300f260'/%3E%3C/svg%3E" alt="User">
                        </div>
                        <div>
                            <div class="req-name">EcoWarrior</div>
                            <div class="req-time">Invited 1h ago</div>
                        </div>
                    </div>
                    <div class="req-actions">
                        <button class="btn btn-accept">Accept</button>
                        <button class="btn btn-decline">Decline</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- VIEW 2: Selected Friend Detail -->
        <div id="detailView" class="detail-view hidden">
            <div class="detail-header">
                <div class="back-btn" onclick="closeDetail()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    Back
                </div>
                <div class="detail-avatar">
                    <img id="detailImg" src="" alt="Detail">
                </div>
                <h2 class="detail-name" id="detailName">Name</h2>
                <span class="detail-rank" id="detailRank">Rank</span>
                <div class="detail-status">
                    <span id="detailStatusText">Status</span>
                </div>
            </div>

            <div class="detail-stats">
                <div class="stat-box">
                    <span class="stat-val">1,240</span>
                    <span class="stat-label">Wins</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val">86%</span>
                    <span class="stat-label">Win Rate</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val">45</span>
                    <span class="stat-label">Matches</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val">Lvl 72</span>
                    <span class="stat-label">Level</span>
                </div>
            </div>

            <div class="detail-actions">
                <button class="btn btn-primary">Invite to Game</button>
                <button class="btn btn-secondary">Message</button>
                <button class="btn btn-secondary btn-battle">Challenge to Battle</button>
            </div>
        </div>

    </aside>

</div>

<script>
    // Mock Data
    const friends = [
        { id: 1, name: "CyberWolf", status: "ingame", game: "Battle Arena", avatar: "%231b263c", color: "%234facfe", rank: "Diamond II" },
        { id: 2, name: "Viper_X", status: "online", game: "In Lobby", avatar: "%233c1b26", color: "%23ff416c", rank: "Platinum I" },
        { id: 3, name: "NovaStar", status: "online", game: "In Lobby", avatar: "%233c3c1b", color: "%23ff9d00", rank: "Master" },
        { id: 4, name: "GhostShell", status: "offline", game: "Last seen 2h ago", avatar: "%23222222", color: "%23dfe6e9", rank: "Gold III" },
        { id: 5, name: "PixelPunk", status: "ingame", game: "Ranked 5v5", avatar: "%233c1b3c", color: "%23a29bfe", rank: "Silver I" },
        { id: 6, name: "IronClad", status: "online", game: "In Lobby", avatar: "%23333333", color: "%2374b9ff", rank: "Platinum III" },
        { id: 7, name: "ShadowMerk", status: "offline", game: "Last seen yesterday", avatar: "%231e1e1e", color: "%23636e72", rank: "Diamond I" },
        { id: 8, name: "LunaTide", status: "ingame", game: "Co-op Raid", avatar: "%231e2b30", color: "%2300f260", rank: "Grandmaster" }
    ];

    const listContainer = document.getElementById('friendList');
    const requestsView = document.getElementById('requestsView');
    const detailView = document.getElementById('detailView');

    // Render Helper
    function renderFriends() {
        listContainer.innerHTML = '';
        friends.forEach(friend => {
            const isOnline = friend.status === 'online';
            const isGame = friend.status === 'ingame';
            
            const pillClass = friend.status === 'ingame' ? 'ingame' : (friend.status === 'online' ? 'online' : 'offline');
            const statusText = isGame ? `Playing ${friend.game}` : (isOnline ? 'Online' : 'Offline');

            const item = document.createElement('div');
            item.className = 'friend-item';
            item.onclick = () => selectFriend(friend, item);

            // Generate a simple SVG avatar based on data
            const avatarSvg = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='${friend.avatar}'/%3E%3Ccircle cx='50' cy='50' r='30' fill='${friend.color}' opacity='0.8'/%3E%3C/svg%3E`;

            item.innerHTML = `
                <div class="friend-avatar">
                    <img src="${avatarSvg}" alt="${friend.name}">
                    <div class="status-badge" style="bottom:2px; right:2px; width:14px; height:14px; border-width:3px; background:${isGame ? 'var(--secondary)' : (isOnline ? 'var(--success)' : 'var(--text-dim)')}; box-shadow: 0 0 8px ${isGame ? 'var(--secondary)' : (isOnline ? 'var(--success)' : 'transparent')}"></div>
                </div>
                <div class="friend-details">
                    <div class="friend-name">${friend.name}</div>
                    <div class="friend-meta">
                        <span class="status-pill ${pillClass}">${statusText}</span>
                    </div>
                </div>
                <div class="friend-actions">
                    <div class="icon-btn" title="Message">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    </div>
                    ${isOnline ? `
                    <div class="icon-btn primary" title="Invite">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                    </div>` : ''}
                </div>
            `;
            listContainer.appendChild(item);
        });
    }

    // Select Logic
    function selectFriend(friend, element) {
        // Highlight UI
        document.querySelectorAll('.friend-item').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');

        // Populate Detail Panel
        document.getElementById('detailName').innerText = friend.name;
        document.getElementById('detailRank').innerText = friend.rank;
        
        const statusText = friend.status === 'ingame' ? `Playing ${friend.game}` : (friend.status === 'online' ? 'Online' : 'Offline');
        document.getElementById('detailStatusText').innerText = statusText;
        
        const avatarSvg = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='${friend.avatar}'/%3E%3Ccircle cx='50' cy='50' r='30' fill='${friend.color}' opacity='0.8'/%3E%3C/svg%3E`;
        document.getElementById('detailImg').src = avatarSvg;

        // Switch Panel View
        requestsView.style.display = 'none';
        detailView.classList.remove('hidden');
    }

    function closeDetail() {
        detailView.classList.add('hidden');
        requestsView.style.display = 'flex';
        document.querySelectorAll('.friend-item').forEach(el => el.classList.remove('selected'));
    }

    // Initialize
    renderFriends();

</script>
</body>
</html>
