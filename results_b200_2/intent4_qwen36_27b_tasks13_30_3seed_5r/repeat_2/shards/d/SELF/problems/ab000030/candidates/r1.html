<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Hub // Aetheria</title>
<style>
    :root {
        --bg-body: #0b0c10;
        --bg-app: #15171e;
        --bg-panel: #1a1d26;
        --bg-hover: rgba(255, 255, 255, 0.04);
        --bg-active: rgba(255, 255, 255, 0.08);
        
        --accent-primary: #fca311; /* Gold */
        --accent-secondary: #4cc9f0; /* Cyan */
        --accent-success: #00ff88; /* Neon Green */
        --accent-danger: #ff4757; /* Red */
        
        --text-main: #ffffff;
        --text-muted: #8b92a5;
        --text-dim: #4b5168;
        
        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-glow: rgba(252, 163, 17, 0.3);
        
        --font-stack: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        
        --shadow-deep: 0 20px 50px rgba(0,0,0,0.5);
        --shadow-glow: 0 0 15px rgba(252, 163, 17, 0.2);
    }

    * { box-sizing: border-box; outline: none; user-select: none; }
    
    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-body);
        color: var(--text-main);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        /* Ambient Background */
        background-image: 
            radial-gradient(circle at 15% 30%, rgba(76, 201, 240, 0.05) 0%, transparent 40%),
            radial-gradient(circle at 85% 70%, rgba(252, 163, 17, 0.05) 0%, transparent 40%);
    }

    /* --- Main App Shell --- */
    .app-container {
        width: 1280px;
        height: 850px;
        background: var(--bg-app);
        border-radius: 24px;
        box-shadow: var(--shadow-deep), 0 0 0 1px var(--border-subtle);
        display: grid;
        grid-template-columns: 300px 1fr 360px;
        overflow: hidden;
        position: relative;
    }

    /* --- Scrollbar --- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* --- Sidebar (Profile & Party) --- */
    .sidebar {
        background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, transparent 100%);
        border-right: 1px solid var(--border-subtle);
        padding: 32px 24px;
        display: flex;
        flex-direction: column;
        gap: 32px;
    }

    .profile-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        position: relative;
    }

    .avatar-wrapper {
        position: relative;
        width: 80px;
        height: 80px;
        margin-bottom: 16px;
    }

    .avatar-img {
        width: 100%;
        height: 100%;
        border-radius: 20px;
        background: #2a2d3e;
        border: 2px solid var(--accent-primary);
        box-shadow: 0 0 20px rgba(252, 163, 17, 0.15);
        object-fit: cover;
    }

    .status-indicator {
        position: absolute;
        bottom: -4px;
        right: -4px;
        width: 20px;
        height: 20px;
        background: var(--accent-success);
        border: 4px solid var(--bg-app);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--accent-success);
        z-index: 2;
    }

    .profile-info h2 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    .profile-info .title {
        color: var(--accent-primary);
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 6px;
        display: block;
        text-shadow: 0 0 10px rgba(252, 163, 17, 0.4);
    }

    .party-section {
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        padding: 0 4px;
    }

    .section-title {
        color: var(--text-muted);
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
    }

    .party-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .party-member {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        background: var(--bg-panel);
        border-radius: 16px;
        border: 1px solid transparent;
        transition: all 0.2s;
        cursor: pointer;
    }

    .party-member:hover {
        background: var(--bg-hover);
        border-color: var(--border-subtle);
        transform: translateX(4px);
    }

    .mini-avatar {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: #333;
        position: relative;
        flex-shrink: 0;
    }

    .mini-avatar img { width: 100%; height: 100%; border-radius: 12px; object-fit: cover; }
    
    .mini-status {
        position: absolute;
        bottom: -2px; right: -2px;
        width: 12px; height: 12px;
        border-radius: 50%;
        border: 2px solid var(--bg-panel);
    }

    .member-details {
        flex: 1;
        min-width: 0; /* Text truncation fix */
    }
    .member-name { font-size: 0.9rem; font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .member-game { font-size: 0.75rem; color: var(--text-muted); display: block; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* --- Main Content (Friends List) --- */
    .main-content {
        display: flex;
        flex-direction: column;
        background: transparent;
        position: relative;
    }

    .search-header {
        padding: 32px 32px 20px 32px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        background: linear-gradient(180deg, var(--bg-app) 80%, transparent 100%);
        z-index: 10;
    }

    .search-bar {
        position: relative;
        width: 100%;
    }

    .search-bar input {
        width: 100%;
        background: rgba(0,0,0,0.2);
        border: 1px solid var(--border-subtle);
        padding: 14px 16px 14px 48px;
        border-radius: 16px;
        color: var(--text-main);
        font-size: 0.95rem;
        transition: 0.2s;
    }

    .search-bar input:focus {
        background: rgba(0,0,0,0.3);
        border-color: var(--accent-primary);
        box-shadow: 0 0 0 2px rgba(252, 163, 17, 0.1);
    }

    .search-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        width: 18px;
        height: 18px;
        pointer-events: none;
    }

    .tabs {
        display: flex;
        gap: 12px;
    }

    .tab {
        padding: 10px 20px;
        border-radius: 12px;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.2s;
        background: transparent;
        border: 1px solid transparent;
    }

    .tab:hover { 
        color: var(--text-main);
        background: var(--bg-hover);
    }
    
    .tab.active {
        background: var(--accent-primary);
        color: #000;
        box-shadow: var(--shadow-glow);
        border-color: transparent;
    }

    .friend-list-container {
        flex: 1;
        overflow-y: auto;
        padding: 10px 32px 40px 32px;
    }

    .friend-item {
        display: flex;
        align-items: center;
        padding: 16px 20px;
        border-radius: 16px;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        border: 1px solid transparent;
        margin-bottom: 8px;
        background: transparent;
    }

    .friend-item:hover {
        background: var(--bg-hover);
        transform: scale(1.01);
    }

    .friend-item.selected {
        background: var(--bg-active);
        border-color: var(--border-glow);
        box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }

    .friend-avatar {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        position: relative;
        margin-right: 16px;
        background: #222;
        flex-shrink: 0;
    }
    
    .friend-avatar img { width: 100%; height: 100%; border-radius: 14px; object-fit: cover;}

    .friend-info { flex: 1; min-width: 0; }
    .friend-name { font-weight: 600; font-size: 1.05rem; margin-bottom: 4px; letter-spacing: 0.3px; }
    .friend-status-text { font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
    
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status-dot.online { background: var(--accent-success); box-shadow: 0 0 8px var(--accent-success); }
    .status-dot.ingame { background: var(--accent-secondary); box-shadow: 0 0 8px var(--accent-secondary); }
    .status-dot.offline { background: var(--text-dim); }

    .friend-actions {
        display: flex;
        gap: 10px;
        opacity: 0;
        transform: translateX(10px);
        transition: 0.2s;
    }

    .friend-item:hover .friend-actions, 
    .friend-item.selected .friend-actions {
        opacity: 1;
        transform: translateX(0);
    }

    .action-icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: 1px solid var(--border-subtle);
        background: rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text-muted);
        transition: 0.2s;
    }

    .action-icon-btn:hover {
        background: var(--accent-primary);
        color: #000;
        border-color: var(--accent-primary);
        transform: translateY(-2px);
    }
    
    .action-icon-btn.danger:hover {
        background: var(--accent-danger);
        border-color: var(--accent-danger);
        color: white;
    }

    /* --- Right Panel (Details & Requests) --- */
    .details-panel {
        background: var(--bg-panel);
        border-left: 1px solid var(--border-subtle);
        display: flex;
        flex-direction: column;
        position: relative;
    }

    .panel-header {
        padding: 28px;
        border-bottom: 1px solid var(--border-subtle);
        font-weight: 700;
        font-size: 1.2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0,0,0,0.1);
    }

    .badge {
        background: var(--accent-danger);
        color: white;
        font-size: 0.75rem;
        padding: 4px 10px;
        border-radius: 12px;
        font-weight: 700;
        box-shadow: 0 0 10px rgba(255, 71, 87, 0.3);
    }

    .requests-list {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
    }

    .request-card {
        background: var(--bg-app);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 16px;
        border: 1px solid var(--border-subtle);
        position: relative;
        overflow: hidden;
        transition: 0.2s;
    }
    
    .request-card:hover {
        border-color: rgba(255,255,255,0.15);
    }

    .request-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; bottom: 0; width: 4px;
        background: var(--accent-secondary);
        box-shadow: 0 0 10px var(--accent-secondary);
    }

    .request-user {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 18px;
    }

    .req-avatar {
        width: 44px; height: 44px; border-radius: 12px;
        background: #333;
    }
    .req-avatar img { width: 100%; height: 100%; border-radius: 12px; }

    .req-name { font-weight: 600; font-size: 1rem; color: var(--text-main); }
    .req-time { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

    .req-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .btn {
        padding: 10px 0;
        border-radius: 10px;
        border: none;
        font-weight: 600;
        font-size: 0.85rem;
        cursor: pointer;
        transition: 0.2s;
        text-align: center;
    }

    .btn-accept {
        background: var(--accent-secondary);
        color: #000;
    }
    .btn-accept:hover { background: #7ce0ff; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(76, 201, 240, 0.3); }

    .btn-decline {
        background: rgba(255,255,255,0.05);
        color: var(--text-muted);
    }
    .btn-decline:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }

    /* --- Detail View (Overlay) --- */
    .detail-view {
        display: none;
        flex-direction: column;
        height: 100%;
        animation: slideIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        background: var(--bg-panel);
    }

    @keyframes slideIn {
        from { opacity: 0; transform: translateX(20px); }
        to { opacity: 1; transform: translateX(0); }
    }

    .detail-header {
        padding: 40px 24px;
        text-align: center;
        background: linear-gradient(180deg, rgba(252, 163, 17, 0.08) 0%, transparent 100%);
        position: relative;
    }
    
    .back-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: 0.2s;
        padding: 8px;
        border-radius: 8px;
    }
    .back-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }

    .detail-avatar {
        width: 110px;
        height: 110px;
        border-radius: 28px;
        margin: 0 auto 20px;
        border: 3px solid var(--bg-panel);
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        background: #333;
        position: relative;
    }
    .detail-avatar img { width: 100%; height: 100%; border-radius: 25px; }

    .detail-name { font-size: 1.6rem; font-weight: 800; margin: 0; letter-spacing: 0.5px; }
    .detail-rank { color: var(--accent-primary); font-weight: 700; font-size: 0.9rem; margin-top: 8px; display: block; text-transform: uppercase; letter-spacing: 1px; }
    .detail-status { color: var(--text-muted); font-size: 0.85rem; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }

    .detail-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        padding: 24px;
        margin-top: 10px;
    }

    .stat-box {
        background: rgba(255,255,255,0.03);
        padding: 16px;
        border-radius: 16px;
        text-align: center;
        border: 1px solid transparent;
        transition: 0.2s;
    }
    .stat-box:hover { border-color: var(--border-subtle); background: rgba(255,255,255,0.05); }
    .stat-val { display: block; font-size: 1.3rem; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
    .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }

    .detail-actions {
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: auto;
        margin-bottom: 10px;
    }

    .btn-primary {
        background: var(--accent-primary);
        color: #000;
        font-weight: 700;
        padding: 14px;
        border-radius: 14px;
        border: none;
        cursor: pointer;
        box-shadow: var(--shadow-glow);
        transition: 0.2s;
        font-size: 0.95rem;
    }
    .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.1); }

    .btn-secondary {
        background: transparent;
        border: 1px solid var(--border-subtle);
        color: var(--text-main);
        font-weight: 600;
        padding: 12px;
        border-radius: 14px;
        cursor: pointer;
        transition: 0.2s;
        font-size: 0.9rem;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.05); border-color: var(--text-muted); }

    .btn-battle {
        background: rgba(255, 71, 87, 0.1);
        color: var(--accent-danger);
        border: 1px solid rgba(255, 71, 87, 0.2);
    }
    .btn-battle:hover { background: var(--accent-danger); color: white; box-shadow: 0 0 15px rgba(255, 71, 87, 0.3); }

    /* --- SVG Icons --- */
    svg { fill: currentColor; }

    /* --- Utility Classes --- */
    .hidden { display: none !important; }
    .text-accent { color: var(--accent-primary); }
    .text-blue { color: var(--accent-secondary); }

</style>
</head>
<body>

<div class="app-container">
    
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="profile-card">
            <div class="avatar-wrapper">
                <!-- Inline SVG Avatar for "Me" -->
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232a2d3e'/%3E%3Ccircle cx='50' cy='40' r='22' fill='%23fca311'/%3E%3Cpath d='M20 95 Q50 65 80 95' fill='%23fca311'/%3E%3C/svg%3E" alt="Me" class="avatar-img">
                <div class="status-indicator"></div>
            </div>
            <div class="profile-info">
                <h2>NeonRider</h2>
                <span class="title">Grandmaster</span>
            </div>
        </div>

        <div class="party-section">
            <div class="section-header">
                <span class="section-title">Active Party (3/4)</span>
            </div>
            <div class="party-list">
                <!-- Party Member 1 -->
                <div class="party-member">
                    <div class="mini-avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23222f3e'/%3E%3Ccircle cx='50' cy='50' r='25' fill='%234cc9f0'/%3E%3C/svg%3E" alt="User">
                        <div class="mini-status" style="background: var(--accent-secondary)"></div>
                    </div>
                    <div class="member-details">
                        <span class="member-name">CyberWolf</span>
                        <span class="member-game">In Game: Battle Arena</span>
                    </div>
                </div>
                <!-- Party Member 2 -->
                <div class="party-member">
                    <div class="mini-avatar">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%233e222f'/%3E%3Ccircle cx='50' cy='50' r='25' fill='%23ff4757'/%3E%3C/svg%3E" alt="User">
                        <div class="mini-status" style="background: var(--accent-success)"></div>
                    </div>
                    <div class="member-details">
                        <span class="member-name">Viper_X</span>
                        <span class="member-game">In Lobby</span>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <section class="main-content">
        <div class="search-header">
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                <input type="text" placeholder="Search friends by name or ID...">
            </div>
            <div class="tabs">
                <div class="tab active">All Friends</div>
                <div class="tab">Online</div>
                <div class="tab">In Game</div>
            </div>
        </div>

        <div class="friend-list-container" id="friendList">
            <!-- Populated by JS -->
        </div>
    </section>

    <!-- RIGHT PANEL -->
    <aside class="details-panel">
        
        <!-- VIEW 1: Friend Requests -->
        <div id="requestsView" style="display: flex; flex-direction: column; height: 100%;">
            <div class="panel-header">
                <span>Requests</span>
                <span class="badge">3</span>
            </div>
            
            <div class="requests-list">
                <!-- Request 1 -->
                <div class="request-card">
                    <div class="request-user">
                        <div class="req-avatar">
                            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232d3436'/%3E%3Cpath d='M50 20 L80 80 L20 80 Z' fill='%23a29bfe'/%3E%3C/svg%3E" alt="User">
                        </div>
                        <div>
                            <div class="req-name">Glitch_Monkey</div>
                            <div class="req-time">Invited 2m ago</div>
                        </div>
                    </div>
                    <div class="req-actions">
                        <button class="btn btn-accept">Accept</button>
                        <button class="btn btn-decline">Decline</button>
                    </div>
                </div>

                <!-- Request 2 -->
                <div class="request-card">
                    <div class="request-user">
                        <div class="req-avatar">
                            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23636e72'/%3E%3Ccircle cx='50' cy='50' r='30' fill='%2300ff88'/%3E%3C/svg%3E" alt="User">
                        </div>
                        <div>
                            <div class="req-name">EcoWarrior</div>
                            <div class="req-time">Invited 1h ago</div>
                        </div>
                    </div>
                    <div class="req-actions">
                        <button class="btn btn-accept">Accept</button>
                        <button class="btn btn-decline">Decline</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- VIEW 2: Selected Friend Detail -->
        <div id="detailView" class="detail-view hidden">
            <div class="detail-header">
                <div class="back-btn" onclick="closeDetail()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    Back
                </div>
                <div class="detail-avatar">
                    <img id="detailImg" src="" alt="Detail">
                </div>
                <h2 class="detail-name" id="detailName">Name</h2>
                <span class="detail-rank" id="detailRank">Rank</span>
                <div class="detail-status">
                    <span class="status-dot" id="detailDot"></span>
                    <span id="detailStatusText">Status</span>
                </div>
            </div>

            <div class="detail-stats">
                <div class="stat-box">
                    <span class="stat-val">1,240</span>
                    <span class="stat-label">Wins</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val">86%</span>
                    <span class="stat-label">Win Rate</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val">45</span>
                    <span class="stat-label">Matches</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val">Lvl 72</span>
                    <span class="stat-label">Level</span>
                </div>
            </div>

            <div class="detail-actions">
                <button class="btn btn-primary">Invite to Game</button>
                <button class="btn btn-secondary">Message</button>
                <button class="btn btn-secondary btn-battle">Challenge to Battle</button>
            </div>
        </div>

    </aside>

</div>

<script>
    // Mock Data
    const friends = [
        { id: 1, name: "CyberWolf", status: "ingame", game: "Battle Arena", avatar: "%23222f3e", color: "%234cc9f0", rank: "Diamond II" },
        { id: 2, name: "Viper_X", status: "online", game: "In Lobby", avatar: "%233e222f", color: "%23ff4757", rank: "Platinum I" },
        { id: 3, name: "NovaStar", status: "online", game: "In Lobby", avatar: "%233e3e22", color: "%23fca311", rank: "Master" },
        { id: 4, name: "GhostShell", status: "offline", game: "Last seen 2h ago", avatar: "%23222222", color: "%23dfe6e9", rank: "Gold III" },
        { id: 5, name: "PixelPunk", status: "ingame", game: "Ranked 5v5", avatar: "%233e223e", color: "%23a29bfe", rank: "Silver I" },
        { id: 6, name: "IronClad", status: "online", game: "In Lobby", avatar: "%23333333", color: "%2374b9ff", rank: "Platinum III" },
        { id: 7, name: "ShadowMerk", status: "offline", game: "Last seen yesterday", avatar: "%231e1e1e", color: "%23636e72", rank: "Diamond I" },
        { id: 8, name: "LunaTide", status: "ingame", game: "Co-op Raid", avatar: "%231e2b30", color: "%2300ff88", rank: "Grandmaster" }
    ];

    const listContainer = document.getElementById('friendList');
    const requestsView = document.getElementById('requestsView');
    const detailView = document.getElementById('detailView');

    // Render Helper
    function renderFriends() {
        listContainer.innerHTML = '';
        friends.forEach(friend => {
            const isOnline = friend.status === 'online';
            const isGame = friend.status === 'ingame';
            
            const dotClass = friend.status === 'ingame' ? 'ingame' : (friend.status === 'online' ? 'online' : 'offline');
            const statusText = isGame ? `Playing ${friend.game}` : (isOnline ? 'Online' : 'Offline');

            const item = document.createElement('div');
            item.className = 'friend-item';
            item.onclick = () => selectFriend(friend, item);

            // Generate a simple SVG avatar based on data
            // Using a rounded rect (rx=20) for modern look
            const avatarSvg = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='${friend.avatar}'/%3E%3Ccircle cx='50' cy='50' r='30' fill='${friend.color}' opacity='0.8'/%3E%3C/svg%3E`;

            item.innerHTML = `
                <div class="friend-avatar">
                    <img src="${avatarSvg}" alt="${friend.name}">
                    <div class="status-indicator" style="bottom:-2px; right:-2px; width:14px; height:14px; border-width:3px; background:var(--accent-${dotClass === 'ingame' ? 'secondary' : (dotClass === 'online' ? 'success' : 'dim')})"></div>
                </div>
                <div class="friend-info">
                    <div class="friend-name">${friend.name}</div>
                    <div class="friend-status-text">
                        <span class="status-dot ${dotClass}"></span>
                        ${statusText}
                    </div>
                </div>
                <div class="friend-actions">
                    <div class="action-icon-btn" title="Message">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    </div>
                    ${isOnline ? `
                    <div class="action-icon-btn" title="Invite">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                    </div>` : ''}
                </div>
            `;
            listContainer.appendChild(item);
        });
    }

    // Select Logic
    function selectFriend(friend, element) {
        // Highlight UI
        document.querySelectorAll('.friend-item').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');

        // Populate Detail Panel
        document.getElementById('detailName').innerText = friend.name;
        document.getElementById('detailRank').innerText = friend.rank;
        
        const dot = document.getElementById('detailDot');
        dot.className = `status-dot ${friend.status === 'ingame' ? 'ingame' : (friend.status === 'online' ? 'online' : 'offline')}`;
        document.getElementById('detailStatusText').innerText = friend.game;
        
        const avatarSvg = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='${friend.avatar}'/%3E%3Ccircle cx='50' cy='50' r='30' fill='${friend.color}' opacity='0.8'/%3E%3C/svg%3E`;
        document.getElementById('detailImg').src = avatarSvg;

        // Switch Panel View
        requestsView.style.display = 'none';
        detailView.classList.remove('hidden');
    }

    function closeDetail() {
        detailView.classList.add('hidden');
        requestsView.style.display = 'flex';
        document.querySelectorAll('.friend-item').forEach(el => el.classList.remove('selected'));
    }

    // Initialize
    renderFriends();

</script>
</body>
</html>
