<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Bounce: The Lost Glitch</title>
    <style>
        :root {
            --bg-deep: #05020a;
            --bg-card: rgba(20, 10, 40, 0.6);
            --bg-card-solid: #1a0b2e;
            --primary: #ff00cc;
            --secondary: #00f2ff;
            --accent: #ffcc00;
            --success: #00ff99;
            --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --font-display: 'Arial Black', 'Impact', sans-serif;
            --font-mono: 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-deep);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- LAYOUT GRID --- */
        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 80px 1fr 80px;
            z-index: 10;
            pointer-events: none;
        }

        .interactive { pointer-events: auto; }

        /* --- HEADER --- */
        header {
            grid-column: 1 / -1;
            grid-row: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 60px;
            z-index: 20;
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .logo-text {
            font-family: var(--font-display);
            font-size: 3.2rem;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: -1px;
            /* Gradient Text */
            background: linear-gradient(135deg, var(--secondary), #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Glow */
            filter: drop-shadow(0 0 20px rgba(0, 242, 255, 0.4));
            transform: skewX(-6deg);
        }

        .subtitle {
            font-size: 0.85rem;
            letter-spacing: 8px;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            font-weight: 600;
            transform: skewX(-6deg);
            margin-left: 5px;
        }

        .btn-secondary {
            background: rgba(0, 242, 255, 0.1);
            border: 2px solid var(--secondary);
            color: var(--secondary);
            padding: 12px 35px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
        }

        .btn-secondary:hover {
            background: var(--secondary);
            color: #000;
            box-shadow: 0 0 30px var(--secondary);
            transform: translateY(-2px);
        }

        /* --- LEFT SIDEBAR (Stats) --- */
        .sidebar-left {
            grid-column: 1;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
            padding-left: 60px;
            align-items: flex-start;
        }

        .stat-row {
            display: flex;
            align-items: center;
            gap: 15px;
            background: linear-gradient(90deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 0 16px 16px 0;
            border-left: 6px solid transparent;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 240px;
            position: relative;
            overflow: hidden;
        }

        .stat-row::after {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.5), transparent);
            opacity: 0.5;
        }

        .stat-row:hover { transform: translateX(10px); }

        .stat-row.coins { border-color: var(--accent); }
        .stat-row.score { border-color: var(--success); }
        .stat-row.hearts { border-color: var(--primary); }

        .stat-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-content h3 {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .stat-content .value {
            font-family: var(--font-mono);
            font-weight: 900;
            font-size: 1.4rem;
            letter-spacing: -1px;
        }

        .coins .value { color: var(--accent); text-shadow: 0 0 15px rgba(255, 204, 0, 0.6); }
        .score .value { color: var(--success); text-shadow: 0 0 15px rgba(0, 255, 153, 0.6); }
        .hearts .value { color: var(--primary); text-shadow: 0 0 15px rgba(255, 0, 204, 0.6); }

        /* --- RIGHT SIDEBAR (World & Controls) --- */
        .sidebar-right {
            grid-column: 2;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            padding-right: 60px;
            gap: 25px;
        }

        .widget-card {
            background: linear-gradient(270deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            backdrop-filter: blur(10px);
            border-radius: 16px 0 0 16px;
            padding: 20px 25px;
            border-right: 6px solid var(--secondary);
            width: 260px;
            text-align: right;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
        }

        .widget-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #aaa;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .widget-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--success);
            text-shadow: 0 0 20px rgba(0, 255, 153, 0.4);
            margin-bottom: 15px;
            font-family: var(--font-display);
        }

        .world-nav {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .nav-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .nav-btn:hover {
            background: var(--secondary);
            color: black;
            border-color: var(--secondary);
            box-shadow: 0 0 15px var(--secondary);
        }

        /* Controls Grid */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px 20px;
            align-items: center;
            font-size: 0.85rem;
            color: #ccc;
        }

        .key-cap {
            background: linear-gradient(to bottom, #333, #111);
            border: 1px solid #444;
            border-bottom: 4px solid #000;
            border-radius: 6px;
            padding: 6px 12px;
            font-family: var(--font-mono);
            font-weight: bold;
            text-align: center;
            box-shadow: 0 4px 5px rgba(0,0,0,0.4);
            min-width: 35px;
            color: #fff;
        }

        /* --- CENTER HERO CARD --- */
        .hero-center {
            grid-column: 1 / -1;
            grid-row: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
            margin-top: 20px; /* Slight offset to align with canvas action */
        }

        .hero-card {
            background: rgba(10, 5, 20, 0.75);
            backdrop-filter: blur(25px);
            border-top: 4px solid var(--primary);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 60px 80px;
            text-align: center;
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.6),
                inset 0 0 0 1px rgba(255,255,255,0.1);
            max-width: 700px;
            width: 90%;
            position: relative;
            animation: float 6s ease-in-out infinite;
            transform: translateY(0);
        }

        /* Decorative glow */
        .hero-card::before {
            content: '';
            position: absolute;
            top: -50px; left: 50%;
            transform: translateX(-50%);
            width: 300px; height: 100px;
            background: radial-gradient(circle, rgba(255,0,204,0.3) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
            filter: blur(20px);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .level-tag {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--secondary);
            margin-bottom: 20px;
            text-transform: uppercase;
            border: 1px solid rgba(0, 242, 255, 0.2);
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: 2.5rem;
            color: white;
            margin-bottom: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .hero-desc {
            color: #ddd;
            font-size: 1.1rem;
            line-height: 1.7;
            margin-bottom: 40px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            font-weight: 400;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--primary), #a200ff);
            color: white;
            border: none;
            padding: 22px 70px;
            font-size: 1.6rem;
            font-family: var(--font-display);
            font-weight: 900;
            letter-spacing: 3px;
            border-radius: 60px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 
                0 10px 30px rgba(255, 0, 204, 0.4),
                inset 0 2px 0 rgba(255,255,255,0.3);
            text-shadow: 0 2px 2px rgba(0,0,0,0.2);
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }

        .btn-primary:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 20px 50px rgba(255, 0, 204, 0.6);
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* --- FOOTER --- */
        footer {
            grid-column: 1 / -1;
            grid-row: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            opacity: 0.8;
        }

        .social-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            cursor: pointer;
            color: #aaa;
        }

        .social-icon:hover {
            background: var(--secondary);
            color: black;
            transform: translateY(-5px);
            box-shadow: 0 0 20px var(--secondary);
            border-color: var(--secondary);
        }

        /* --- CANVAS BACKGROUND --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 1024px) {
            .ui-container {
                grid-template-columns: 1fr;
                grid-template-rows: 80px auto auto auto;
            }
            .sidebar-left, .sidebar-right {
                display: none;
            }
            .hero-center {
                grid-row: 2 / 4;
                margin-top: 0;
            }
            header { padding: 0 20px; }
            .logo-text { font-size: 2rem; }
        }
    </style>
</head>

        <!-- Center Hero -->
        <div class="hero-center">

                <div class="level-tag">Level 1-1</div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- PALETTE ---
        const colors = {
            skyTop: '#05020a',
            skyMid: '#1a0b2e',
            skyBot: '#2d1b4e',
            neonPink: '#ff00cc',
            neonCyan: '#00f2ff',
            neonYellow: '#ffcc00',
            neonGreen: '#00ff99',
            grid: 'rgba(0, 242, 255, 0.15)'
        };

        // --- ENTITIES ---

        function drawSky() {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, colors.skyTop);
            grad.addColorStop(0.6, colors.skyMid);
            grad.addColorStop(1, colors.skyBot);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        function drawSun(time) {
            ctx.save();
            const sunX = width / 2;
            const sunY = height * 0.35;
            const radius = Math.min(width, height) * 0.25;

            // Glow
            ctx.shadowBlur = 80;
            ctx.shadowColor = colors.neonPink;

            // Gradient Sun
            const grad = ctx.createLinearGradient(sunX, sunY - radius, sunX, sunY + radius);
            grad.addColorStop(0, '#ffcc00');
            grad.addColorStop(0.5, '#ff00cc');
            grad.addColorStop(1, '#9900ff');
            ctx.fillStyle = grad;

            ctx.beginPath();
            ctx.arc(sunX, sunY, radius, 0, Math.PI * 2);
            ctx.fill();

            // Retro Stripes
            ctx.shadowBlur = 0;
            ctx.fillStyle = colors.skyMid; // Match background to "cut"
            const stripeHeight = 8;
            const gap = 12;
            
            for(let i = 0; i < 15; i++) {
                let y = sunY + (20 + i * (stripeHeight + gap));
                if (y < sunY + radius) {
                    let h = y - sunY;
                    let w = Math.sqrt(Math.max(0, radius*radius - h*h));
                    // Make stripes wider at bottom for perspective
                    ctx.fillRect(sunX - w, y, w * 2, stripeHeight + (i*0.5));
                }
            }
            ctx.restore();
        }

        function drawGrid(time) {
            ctx.save();
            const horizon = height * 0.55;
            
            // Fade out grid at horizon
            const grad = ctx.createLinearGradient(0, horizon, 0, height);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(0.1, colors.grid);
            grad.addColorStop(1, 'rgba(0, 242, 255, 0.4)');
            
            ctx.strokeStyle = grad;
            ctx.lineWidth = 2;

            const centerX = width / 2;
            const numLines = 50;
            
            // Vertical Lines
            for(let i = -numLines; i <= numLines; i++) {
                let xBottom = centerX + (i * 90);
                ctx.beginPath();
                ctx.moveTo(centerX, horizon);
                ctx.lineTo(xBottom, height);
                ctx.stroke();
            }

            // Horizontal Lines (Moving)
            let offset = (time * 0.15) % 100;
            
            for(let i = 0; i < 30; i++) {
                let y = horizon + Math.pow(i, 2.5) * 0.6 + offset;
                if(y > height) continue;

                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawMountains(time) {
            ctx.save();
            
            // Far Layer
            ctx.fillStyle = '#120626';
            ctx.beginPath();
            ctx.moveTo(0, height);
            for(let x = 0; x <= width; x+=20) {
                let y = height * 0.55;
                y += Math.sin((x + time * 0.01) * 0.005) * 50;
                y += Math.sin((x + time * 0.01) * 0.02) * 15;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height);
            ctx.fill();

            // Near Layer
            ctx.fillStyle = '#1e0e36';
            ctx.beginPath();
            ctx.moveTo(0, height);
            for(let x = 0; x <= width; x+=20) {
                let y = height * 0.6;
                y += Math.sin((x + time * 0.03) * 0.008) * 70;
                y += Math.sin((x + time * 0.03) * 0.03) * 20;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height);
            ctx.fill();

            ctx.restore();
        }

        // --- GAME ELEMENTS ---

        function drawPlatform(x, y, w, h) {
            ctx.save();
            ctx.translate(x, y);
            
            ctx.shadowBlur = 20;
            ctx.shadowColor = colors.neonGreen;
            
            ctx.fillStyle = '#05020a';
            ctx.strokeStyle = colors.neonGreen;
            ctx.lineWidth = 4;
            
            ctx.beginPath();
            ctx.roundRect(0, 0, w, h, 8);
            ctx.fill();
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.fillStyle = colors.neonGreen;
            ctx.fillRect(10, 10, w - 20, 4);
            
            ctx.fillStyle = '#000';
            ctx.fillRect(20, h, 10, 10);
            ctx.fillRect(w - 30, h, 10, 10);

            ctx.restore();
        }

        function drawCoin(x, y, time) {
            ctx.save();
            ctx.translate(x, y);
            
            const bob = Math.sin(time * 0.008) * 10;
            ctx.translate(0, bob);

            const scale = Math.abs(Math.sin(time * 0.01));
            ctx.scale(scale, 1);

            ctx.shadowBlur = 25;
            ctx.shadowColor = colors.neonYellow;
            ctx.fillStyle = colors.neonYellow;
            
            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 0, 12, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawEnemy(x, y, time) {
            ctx.save();
            ctx.translate(x, y);
            
            const float = Math.sin(time * 0.005) * 20;
            ctx.translate(0, float);

            ctx.shadowBlur = 25;
            ctx.shadowColor = '#ff0055';
            ctx.fillStyle = '#ff0055';
            
            ctx.beginPath();
            ctx.moveTo(0, -30);
            ctx.lineTo(25, 20);
            ctx.lineTo(0, 35);
            ctx.lineTo(-25, 20);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-8, -5, 6, 0, Math.PI*2);
            ctx.arc(8, -5, 6, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(-8, -5, 2, 0, Math.PI*2);
            ctx.arc(8, -5, 2, 0, Math.PI*2);
            ctx.fill();

            ctx.restore();
        }

        function drawHero(time) {
            ctx.save();
            
            const bounce = Math.sin(time * 0.006) * 10;
            const hX = width * 0.25;
            const hY = height * 0.6 + bounce;

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath();
            ctx.ellipse(hX, height * 0.6 + 60, 30, 10, 0, 0, Math.PI*2);
            ctx.fill();

            ctx.shadowBlur = 25;
            ctx.shadowColor = colors.neonCyan;

            // Body
            ctx.fillStyle = colors.neonCyan;
            ctx.beginPath();
            ctx.arc(hX, hY, 35, 0, Math.PI * 2);
            ctx.fill();

            // Face Mask
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(hX, hY, 25, 0, Math.PI * 2);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(hX + 10, hY - 5, 5, 0, Math.PI * 2);
            ctx.arc(hX - 10, hY - 5, 5, 0, Math.PI * 2);
            ctx.fill();

            // Ears
            ctx.fillStyle = colors.neonCyan;
            ctx.beginPath();
            ctx.arc(hX - 30, hY - 20, 12, 0, Math.PI * 2);
            ctx.arc(hX + 30, hY - 20, 12, 0, Math.PI * 2);
            ctx.fill();

            // Shoes
            ctx.fillStyle = '#ff5500';
            ctx.beginPath();
            ctx.ellipse(hX - 20, hY + 32, 14, 8, -0.2, 0, Math.PI * 2);
            ctx.ellipse(hX + 20, hY + 32, 14, 8, 0.2, 0, Math.PI * 2);
            ctx.fill();

            // Scarf
            ctx.strokeStyle = colors.neonPink;
            ctx.lineWidth = 12;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(hX - 25, hY - 5);
            ctx.quadraticCurveTo(hX - 60, hY - 20 + Math.sin(time*0.01)*10, hX - 90, hY + 10 + Math.sin(time*0.01)*20);
            ctx.stroke();

            ctx.restore();
        }

        function drawGoal(x, y) {
            ctx.save();
            
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 6;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#fff';
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y - 140);
            ctx.stroke();

            ctx.fillStyle = colors.neonPink;
            ctx.shadowColor = colors.neonPink;
            ctx.beginPath();
            ctx.moveTo(x, y - 140);
            ctx.lineTo(x + 60, y - 110);
            ctx.lineTo(x, y - 80);
            ctx.fill();
            
            ctx.fillStyle = colors.neonCyan;
            ctx.shadowColor = colors.neonCyan;
            ctx.fillRect(x - 20, y - 20, 40, 20);
            
            ctx.restore();
        }

        function drawLevelElements(time) {
            drawPlatform(width * 0.55, height * 0.55, 160, 30);
            drawPlatform(width * 0.72, height * 0.42, 120, 30);
            drawCoin(width * 0.63, height * 0.45, time);
            drawEnemy(width * 0.85, height * 0.55, time);
            drawGoal(width * 0.9, height * 0.6);
        }

        // --- MAIN LOOP ---
        function animate(time) {
            ctx.clearRect(0, 0, width, height);

            drawSky();
            drawSun(time);
            drawGrid(time);
            drawMountains(time);
            drawLevelElements(time);
            drawHero(time);

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        function startGame() {
            const btn = document.querySelector('.btn-primary');
            const originalText = btn.innerText;
            
            btn.innerText = "LOADING...";
            btn.style.transform = "scale(0.95)";
            
            setTimeout(() => {
                alert("Game Start! (Demo Mode)");
                btn.innerText = originalText;
                btn.style.transform = "scale(1)";
            }, 600);
        }

    </script>
</body>
</html>
