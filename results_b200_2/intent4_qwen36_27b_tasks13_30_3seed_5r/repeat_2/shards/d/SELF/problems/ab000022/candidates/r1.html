<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Bounce: The Lost Glitch</title>
    <style>
        :root {
            --bg-sky-top: #0f0c29;
            --bg-sky-mid: #302b63;
            --bg-sky-bot: #24243e;
            --accent-primary: #ff00cc;
            --accent-secondary: #333399;
            --accent-highlight: #00f2ff;
            --accent-warning: #ffcc00;
            --accent-success: #00ff99;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: var(--font-main);
            background-color: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            color: white;
        }

        /* --- BACKGROUND CANVAS --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* --- UI OVERLAY --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-rows: 80px 1fr 80px;
            grid-template-columns: 1fr 1fr; /* Split for asymmetry */
            pointer-events: none;
        }

        /* --- HEADER --- */
        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            pointer-events: auto;
        }

        .game-logo {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(to right, var(--accent-highlight), var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 0px 20px rgba(0, 242, 255, 0.4));
            transform: skew(-10deg);
            position: relative;
        }

        .game-logo::after {
            content: 'THE LOST GLITCH';
            position: absolute;
            bottom: -15px;
            left: 0;
            font-size: 0.8rem;
            letter-spacing: 6px;
            color: #fff;
            opacity: 0.7;
            -webkit-text-fill-color: white;
            background: none;
            transform: skew(10deg); /* Counter skew */
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--accent-highlight);
            color: var(--accent-highlight);
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(5px);
            text-transform: uppercase;
        }

        .settings-btn:hover {
            background: var(--accent-highlight);
            color: #000;
            box-shadow: 0 0 20px var(--accent-highlight);
            transform: scale(1.05);
        }

        /* --- LEFT PANEL (Stats) --- */
        .panel-left {
            grid-column: 1;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
            padding-left: 50px;
            pointer-events: auto;
        }

        .stat-card {
            background: rgba(15, 12, 41, 0.6);
            backdrop-filter: blur(10px);
            border-left: 5px solid;
            padding: 15px 20px;
            border-radius: 0 12px 12px 0;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 220px;
        }

        .stat-card:hover { transform: translateX(10px); }
        .stat-card.coins { border-color: var(--accent-warning); }
        .stat-card.score { border-color: var(--accent-success); }
        .stat-card.hearts { border-color: var(--accent-primary); }

        .stat-icon svg { width: 32px; height: 32px; filter: drop-shadow(0 0 5px currentColor); }
        
        .stat-info h4 { font-size: 0.7rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .stat-info span { font-size: 1.4rem; font-weight: 900; font-family: monospace; }
        .stat-card.coins .stat-info span { color: var(--accent-warning); }
        .stat-card.score .stat-info span { color: var(--accent-success); }
        .stat-card.hearts .stat-info span { color: var(--accent-primary); }

        /* --- CENTER HERO AREA --- */
        .hero-section {
            grid-column: 1 / -1;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end; /* Push to bottom */
            padding-bottom: 40px;
            pointer-events: none;
            position: relative;
        }

        .hero-card {
            pointer-events: auto;
            background: rgba(10, 10, 30, 0.85);
            backdrop-filter: blur(15px);
            border-top: 4px solid var(--accent-primary);
            padding: 40px 60px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            max-width: 600px;
            width: 90%;
            position: relative;
            overflow: hidden;
            animation: floatCard 6s ease-in-out infinite;
            transform: translateY(0);
        }

        /* Decorative glow behind card */
        .hero-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,0,204,0.15) 0%, transparent 70%);
            z-index: -1;
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .hero-title {
            font-size: 1.5rem;
            color: var(--accent-warning);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 10px;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }

        .hero-desc {
            font-size: 1.1rem;
            color: #ddd;
            margin-bottom: 30px;
            line-height: 1.6;
            font-weight: 500;
        }

        .start-btn {
            background: linear-gradient(135deg, var(--accent-primary), #a200ff);
            color: white;
            border: none;
            padding: 20px 70px;
            font-size: 1.6rem;
            font-weight: 900;
            border-radius: 60px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(255, 0, 204, 0.4);
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            font-family: var(--font-main);
        }

        .start-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.6s;
        }

        .start-btn:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 0, 204, 0.7);
        }
        
        .start-btn:hover::after {
            left: 100%;
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        /* --- RIGHT PANEL (World & Controls) --- */
        .panel-right {
            grid-column: 2;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding-right: 50px;
            justify-content: center;
            gap: 30px;
            pointer-events: auto;
        }

        .world-selector {
            background: rgba(0,0,0,0.6);
            padding: 20px;
            border-radius: 12px;
            border-right: 5px solid var(--accent-success);
            text-align: right;
            backdrop-filter: blur(5px);
            min-width: 200px;
        }

        .world-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #aaa;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .world-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent-success);
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 153, 0.4);
        }

        .arrows {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .arrow {
            width: 30px;
            height: 30px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
            background: rgba(255,255,255,0.05);
        }
        .arrow:hover { border-color: var(--accent-success); color: var(--accent-success); background: rgba(0,255,153,0.1); }

        .controls-guide {
            background: rgba(0,0,0,0.6);
            padding: 20px;
            border-radius: 12px;
            border-right: 5px solid var(--accent-highlight);
            text-align: right;
            backdrop-filter: blur(5px);
        }
        
        .key-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 15px;
            margin-bottom: 8px;
        }
        
        .key {
            background: linear-gradient(to bottom, #444, #222);
            border: 1px solid #666;
            border-bottom: 4px solid #111;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: monospace;
            color: white;
            min-width: 30px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .action-text { font-size: 0.9rem; color: #ccc; font-weight: 500; }

        /* --- FOOTER --- */
        footer {
            grid-column: 1 / -1;
            grid-row: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            pointer-events: auto;
        }

        .social-link {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .social-link:hover { background: var(--accent-highlight); color: black; transform: translateY(-5px) rotate(10deg); box-shadow: 0 0 15px var(--accent-highlight); border-color: var(--accent-highlight); }

        /* Responsive */
        @media (max-width: 1000px) {
            .ui-layer {
                grid-template-columns: 1fr;
                grid-template-rows: 80px auto auto auto;
            }
            .panel-left, .panel-right {
                display: none; /* Hide side panels on smaller screens */
            }
            header { padding: 0 20px; }
            .game-logo { font-size: 2rem; }
            .hero-section { grid-row: 2 / 4; justify-content: center; }
            .hero-card { padding: 30px; }
            .start-btn { padding: 15px 50px; font-size: 1.2rem; }
        }

    </style>
</head>
<body>

    <!-- Background Drawing -->
    <canvas id="bg-canvas"></canvas>

    <!-- UI Overlay -->
    <div class="ui-layer">
        
        <!-- Top Bar -->
        <header>
            <div class="game-logo">Neon Bounce</div>

        <!-- Right Panel (Controls & World) -->
        <div class="panel-right">

                    <div class="key">Z</div>

                <div class="key-row">
                    <span class="action-text">Dash</span>

    <script>
        // --- CANVAS DRAWING LOGIC ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        
        // Resize handling
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Colors
        const colors = {
            skyTop: '#0f0c29',
            skyMid: '#302b63',
            skyBot: '#24243e',
            neonPink: '#ff00cc',
            neonCyan: '#00f2ff',
            neonYellow: '#ffcc00',
            neonGreen: '#00ff99',
            darkPurple: '#1a0b2e',
            grid: 'rgba(255, 255, 255, 0.08)'
        };

        // --- ENTITIES ---

        // 1. Background Grid (Retro Wave style)
        function drawGrid(time) {
            ctx.save();
            // Perspective floor
            const horizon = height * 0.45;
            const gridY = horizon;
            
            // Vertical lines
            ctx.strokeStyle = colors.grid;
            ctx.lineWidth = 1;
            const centerX = width / 2;
            
            // Moving vertical lines
            for (let i = -30; i <= 30; i++) {
                let x = centerX + (i * 80);
                // Simple parallax shift
                x += Math.sin(time * 0.0003) * 30;
                
                ctx.beginPath();
                ctx.moveTo(centerX + (i * 15), gridY); // Vanishing point
                ctx.lineTo(x * 3, height); // Spread out at bottom
                ctx.stroke();
            }

            // Horizontal moving lines
            let offset = (time * 0.15) % 40;
            for (let i = 0; i < 25; i++) {
                let y = gridY + Math.pow(i, 2.2) + offset;
                if(y > height) y -= (height - gridY);
                
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            ctx.restore();
        }

        // 2. Sun/Moon
        function drawSun(time) {
            ctx.save();
            const sunX = width / 2;
            const sunY = height * 0.35;
            const radius = Math.min(width, height) * 0.18;

            // Gradient
            const grad = ctx.createLinearGradient(sunX, sunY - radius, sunX, sunY + radius);
            grad.addColorStop(0, colors.neonPink);
            grad.addColorStop(1, colors.neonYellow);

            ctx.fillStyle = grad;
            ctx.shadowBlur = 40;
            ctx.shadowColor = colors.neonPink;
            ctx.beginPath();
            ctx.arc(sunX, sunY, radius, 0, Math.PI * 2);
            ctx.fill();

            // Stripes through sun
            ctx.fillStyle = colors.skyMid; // Mask color
            ctx.shadowBlur = 0;
            for(let i = 0; i < 10; i++) {
                let h = 4 + i * 3;
                let y = sunY + (15 + i * 14);
                if (y < sunY + radius) {
                    ctx.fillRect(sunX - radius, y, radius * 2, h);
                }
            }
            ctx.restore();
        }

        // 3. Mountains (Parallax)
        function drawMountains(time, layer) {
            ctx.save();
            const speed = layer === 1 ? 0.01 : 0.03;
            const yOffset = layer === 1 ? height * 0.42 : height * 0.55;
            const color = layer === 1 ? '#120626' : '#1e0e36';
            const scale = layer === 1 ? 1.5 : 1;

            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, height);

            for (let x = 0; x <= width; x += 10) {
                // Simple noise function simulation
                let y = yOffset;
                y += Math.sin((x + time * speed) * 0.004 * scale) * 60;
                y += Math.sin((x + time * speed) * 0.01 * scale) * 30;
                y += Math.sin((x + time * speed) * 0.02) * 10;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.fill();
            ctx.restore();
        }

        // 4. The Hero (Sprite drawn with code)
        function drawHero(time) {
            ctx.save();
            
            // Floating animation
            const bounce = Math.sin(time * 0.006) * 15;
            const hX = width * 0.25;
            const hY = height * 0.6 + bounce;

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.ellipse(hX, height * 0.6 + 70, 25, 8, 0, 0, Math.PI*2);
            ctx.fill();

            // Body (Blue)
            ctx.fillStyle = colors.neonCyan;
            ctx.shadowBlur = 15;
            ctx.shadowColor = colors.neonCyan;
            ctx.beginPath();
            ctx.arc(hX, hY, 30, 0, Math.PI * 2);
            ctx.fill();

            // Inner face mask (White)
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(hX, hY, 22, 0, Math.PI * 2);
            ctx.fill();

            // Eyes (Black) - looking right
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(hX + 8, hY - 5, 4, 0, Math.PI * 2);
            ctx.arc(hX - 8, hY - 5, 4, 0, Math.PI * 2);
            ctx.fill();

            // Ears (Blue)
            ctx.fillStyle = colors.neonCyan;
            ctx.beginPath();
            ctx.arc(hX - 25, hY - 18, 10, 0, Math.PI * 2); // Left ear
            ctx.arc(hX + 25, hY - 18, 10, 0, Math.PI * 2); // Right ear
            ctx.fill();

            // Shoes (Red/Orange)
            ctx.fillStyle = '#ff5500';
            ctx.beginPath();
            ctx.ellipse(hX - 18, hY + 28, 12, 7, -0.2, 0, Math.PI * 2);
            ctx.ellipse(hX + 18, hY + 28, 12, 7, 0.2, 0, Math.PI * 2);
            ctx.fill();

            // Scarf (Pink) flowing
            ctx.strokeStyle = colors.neonPink;
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(hX - 20, hY - 5);
            ctx.quadraticCurveTo(hX - 50, hY - 15 + Math.sin(time*0.01)*8, hX - 80, hY + 5 + Math.sin(time*0.01)*15);
            ctx.stroke();

            ctx.restore();
        }

        // 5. Floating Elements (Coins, Platforms)
        function drawLevelElements(time) {
            ctx.save();
            
            // Platform 1
            const p1X = width * 0.6;
            const p1Y = height * 0.55;
            drawPlatform(p1X, p1Y, 140, 25);

            // Platform 2
            const p2X = width * 0.75;
            const p2Y = height * 0.45;
            drawPlatform(p2X, p2Y, 100, 25);

            // Coin
            const coinX = p1X + 70;
            const coinY = p1Y - 50 + Math.sin(time * 0.008) * 15;
            drawCoin(coinX, coinY, time);

            // Enemy (Floating Ghost)
            const enemyX = width * 0.85;
            const enemyY = height * 0.6 + Math.sin(time * 0.004) * 25;
            drawEnemy(enemyX, enemyY, time);

            // Distant Goal Flag
            const goalX = width * 0.9;
            const goalY = height * 0.5; // On ground
            drawGoal(goalX, goalY);

            ctx.restore();
        }

        function drawPlatform(x, y, w, h) {
            ctx.fillStyle = '#111';
            ctx.strokeStyle = colors.neonGreen;
            ctx.lineWidth = 3;
            ctx.shadowBlur = 10;
            ctx.shadowColor = colors.neonGreen;
            
            // Rounded rect
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 8);
            ctx.fill();
            ctx.stroke();
            
            // Tech details
            ctx.fillStyle = colors.neonGreen;
            ctx.shadowBlur = 0;
            ctx.fillRect(x + 15, y + 8, 15, 6);
            ctx.fillRect(x + w - 30, y + 8, 15, 6);
        }

        function drawCoin(x, y, time) {
            ctx.save();
            ctx.translate(x, y);
            // Spin effect via scaleX
            const scale = Math.abs(Math.sin(time * 0.01));
            ctx.scale(scale, 1);
            
            ctx.fillStyle = colors.neonYellow;
            ctx.shadowBlur = 15;
            ctx.shadowColor = colors.neonYellow;
            
            ctx.beginPath();
            ctx.arc(0, 0, 15, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawEnemy(x, y, time) {
            ctx.save();
            ctx.translate(x, y);
            
            // Body
            ctx.fillStyle = '#ff0055';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff0055';
            
            // Spiky shape
            ctx.beginPath();
            ctx.moveTo(0, -25);
            ctx.lineTo(20, 15);
            ctx.lineTo(0, 30);
            ctx.lineTo(-20, 15);
            ctx.closePath();
            ctx.fill();
            
            // Eye
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(0, -5, 8, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(0, -5, 3, 0, Math.PI*2);
            ctx.fill();

            ctx.restore();
        }

        function drawGoal(x, y) {
            ctx.save();
            // Pole
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 6;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#fff';
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y - 120);
            ctx.stroke();

            // Flag
            ctx.fillStyle = colors.neonPink;
            ctx.shadowColor = colors.neonPink;
            ctx.beginPath();
            ctx.moveTo(x, y - 120);
            ctx.lineTo(x + 50, y - 100);
            ctx.lineTo(x, y - 80);
            ctx.fill();
            
            // Base
            ctx.fillStyle = colors.neonCyan;
            ctx.shadowColor = colors.neonCyan;
            ctx.fillRect(x - 15, y - 15, 30, 15);
            ctx.restore();
        }

        // --- MAIN LOOP ---
        function animate(time) {
            // Clear
            ctx.clearRect(0, 0, width, height);

            // Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, colors.skyTop);
            grad.addColorStop(0.5, colors.skyMid);
            grad.addColorStop(1, colors.skyBot);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Draw Layers
            drawSun(time);
            drawGrid(time);
            drawMountains(time, 1); // Far
            drawLevelElements(time);
            drawMountains(time, 2); // Near
            drawHero(time);

            requestAnimationFrame(animate);
        }

        // Start loop
        requestAnimationFrame(animate);

        // --- INTERACTIVITY ---
        function startGame() {
            const btn = document.querySelector('.start-btn');
            btn.innerHTML = "LOADING...";
            btn.style.transform = "scale(0.95)";
            
            // Simulate a loading effect or transition
            setTimeout(() => {
                alert("Game Start! (Demo Mode)");
                btn.innerHTML = "START ADVENTURE";
                btn.style.transform = "scale(1)";
            }, 500);
        }

    </script>
</body>
</html>
