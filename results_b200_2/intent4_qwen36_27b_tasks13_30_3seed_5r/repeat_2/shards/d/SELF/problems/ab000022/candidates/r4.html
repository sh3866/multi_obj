<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Bounce: The Lost Glitch</title>
    <style>
        :root {
            --c-bg: #0a0514;
            --c-primary: #ff00cc;
            --c-secondary: #00f2ff;
            --c-accent: #ffcc00;
            --c-success: #00ff99;
            --c-glass: rgba(20, 15, 35, 0.65);
            --c-glass-border: rgba(255, 255, 255, 0.12);
            --font-head: 'Impact', 'Arial Black', sans-serif;
            --font-body: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            --font-mono: 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--c-bg);
            color: white;
            font-family: var(--font-body);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* --- CANVAS LAYER --- */
        #world-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- UI OVERLAY LAYER --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            grid-template-rows: 80px 1fr 80px;
            pointer-events: none; /* Let clicks pass to interactive elements */
        }

        /* --- HEADER --- */
        header {
            grid-column: 1 / -1;
            grid-row: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            pointer-events: auto;
        }

        .logo-group {
            display: flex;
            flex-direction: column;
            transform: skewX(-10deg);
        }

        .logo-title {
            font-family: var(--font-head);
            font-size: 3.5rem;
            line-height: 0.9;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(to right, var(--c-secondary), #fff, var(--c-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 0, 204, 0.5));
        }

        .logo-sub {
            font-size: 0.9rem;
            letter-spacing: 6px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 700;
            margin-top: 5px;
        }

        .btn-pill {
            background: rgba(0, 242, 255, 0.1);
            border: 2px solid var(--c-secondary);
            color: var(--c-secondary);
            padding: 10px 30px;
            border-radius: 50px;
            font-weight: 800;
            letter-spacing: 2px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
        }

        .btn-pill:hover {
            background: var(--c-secondary);
            color: #000;
            box-shadow: 0 0 30px var(--c-secondary);
        }

        /* --- LEFT SIDEBAR (Stats) --- */
        .sidebar-left {
            grid-column: 1;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 40px;
            gap: 20px;
            pointer-events: auto;
        }

        .stat-pill {
            display: flex;
            align-items: center;
            gap: 15px;
            background: linear-gradient(90deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.01) 100%);
            border-left: 6px solid transparent;
            padding: 15px 25px;
            border-radius: 0 16px 16px 0;
            backdrop-filter: blur(10px);
            transition: transform 0.2s;
        }

        .stat-pill:hover { transform: translateX(10px); }

        .stat-pill.coins { border-color: var(--c-accent); }
        .stat-pill.score { border-color: var(--c-success); }
        .stat-pill.lives { border-color: var(--c-primary); }

        .icon-box {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .stat-info h4 { font-size: 0.7rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; }
        .stat-info .val { font-family: var(--font-mono); font-size: 1.4rem; font-weight: 900; }

        /* --- CENTER HERO CARD --- */
        .hero-center {
            grid-column: 2;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            position: relative;
        }

        /* The main content card */
        .main-card {
            pointer-events: auto;
            background: rgba(10, 5, 20, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 4px solid var(--c-primary);
            border-radius: 30px;
            padding: 50px 60px;
            text-align: center;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            position: relative;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .level-badge {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--c-secondary);
            color: var(--c-secondary);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 15px;
            display: inline-block;
        }

        .hero-title {
            font-family: var(--font-head);
            font-size: 3rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .hero-desc {
            color: #ddd;
            line-height: 1.6;
            margin-bottom: 35px;
            font-size: 1.1rem;
        }

        .btn-start {
            background: linear-gradient(90deg, var(--c-primary), #a200ff);
            border: none;
            color: white;
            padding: 20px 60px;
            font-family: var(--font-head);
            font-size: 1.8rem;
            letter-spacing: 3px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 0, 204, 0.4);
            transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .btn-start::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }

        .btn-start:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 20px 50px rgba(255, 0, 204, 0.6);
        }
        
        .btn-start:hover::after { left: 100%; }

        /* --- RIGHT SIDEBAR (World & Controls) --- */
        .sidebar-right {
            grid-column: 3;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-right: 40px;
            gap: 25px;
            pointer-events: auto;
            align-items: flex-end;
        }

        .widget {
            background: linear-gradient(270deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            backdrop-filter: blur(10px);
            border-radius: 16px 0 0 16px;
            padding: 20px 30px;
            border-right: 6px solid var(--c-secondary);
            width: 280px;
            text-align: right;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .widget h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #aaa;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .widget .big-text {
            font-family: var(--font-head);
            font-size: 2rem;
            color: var(--c-success);
            text-shadow: 0 0 15px rgba(0, 255, 153, 0.4);
        }

        .key-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px 20px;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #ccc;
        }

        .key {
            background: #222;
            border: 1px solid #444;
            border-bottom: 3px solid #000;
            border-radius: 6px;
            padding: 5px 10px;
            text-align: center;
            font-family: var(--font-mono);
            font-weight: bold;
            color: #fff;
            min-width: 35px;
            display: inline-block;
            box-shadow: 0 4px 4px rgba(0,0,0,0.4);
        }

        /* --- FOOTER --- */
        footer {
            grid-column: 1 / -1;
            grid-row: 3;
            display: flex;
            justify-content: center;
            gap: 30px;
            pointer-events: auto;
        }

        .social-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            cursor: pointer;
        }

        .social-icon:hover {
            background: var(--c-secondary);
            color: black;
            transform: translateY(-5px);
            box-shadow: 0 0 20px var(--c-secondary);
        }

        /* Responsive */
        @media (max-width: 1100px) {
            .ui-layer {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
            }
            .sidebar-left, .sidebar-right { display: none; }
            .hero-center { grid-column: 1; grid-row: 2; }
            header { grid-row: 1; padding: 20px; }
            footer { grid-row: 3; padding-bottom: 20px; }
        }
    </style>
</head>
<body>

    <!-- UI Overlay -->

        <header>
            <div class="logo-group">

        <!-- Center Hero Card -->

                    The grid is glitching, and the Glitch-Bats are taking over.

                <div class="big-text">Neon Valley</div>
                <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:10px;">

            <div class="widget">
                <h3>Controls</h3>

                    <span>Jump</span> <span class="key">Z</span>

                    <span>Move</span> <span style="display:flex; gap:5px;"><span class="key">←</span><span class="key">→</span></span>

    <script>
        const canvas = document.getElementById('world-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- PALETTE ---
        const palette = {
            bgTop: '#05020a',
            bgBot: '#1a0b2e',
            sunGrad: ['#ffcc00', '#ff00cc', '#9900ff'],
            grid: 'rgba(0, 242, 255, 0.15)',
            neonGreen: '#00ff99',
            neonPink: '#ff00cc',
            neonCyan: '#00f2ff',
            neonYellow: '#ffcc00'
        };

        // --- ENTITIES ---

        function drawBackground(time) {
            // Sky
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, palette.bgTop);
            grad.addColorStop(0.5, palette.bgBot);
            grad.addColorStop(1, '#2d1b4e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Sun
            const sunY = height * 0.35;
            const radius = Math.min(width, height) * 0.22;
            
            ctx.save();
            ctx.shadowBlur = 100;
            ctx.shadowColor = palette.neonPink;
            
            const sunGrad = ctx.createLinearGradient(0, sunY - radius, 0, sunY + radius);
            sunGrad.addColorStop(0, palette.sunGrad[0]);
            sunGrad.addColorStop(0.5, palette.sunGrad[1]);
            sunGrad.addColorStop(1, palette.sunGrad[2]);
            ctx.fillStyle = sunGrad;
            
            ctx.beginPath();
            ctx.arc(width/2, sunY, radius, 0, Math.PI*2);
            ctx.fill();
            
            // Retro Sun Stripes
            ctx.shadowBlur = 0;
            ctx.fillStyle = palette.bgBot; // Matches horizon
            for(let i=0; i<10; i++) {
                let y = sunY + (20 + i * 18);
                let h = 6 + (i*1.5);
                let w = Math.sqrt(Math.max(0, radius*radius - (y-sunY)*(y-sunY)));
                if(y < sunY + radius) ctx.fillRect(width/2 - w, y, w*2, h);
            }
            ctx.restore();
        }

        function drawGrid(time) {
            ctx.save();
            const horizon = height * 0.55;
            
            // Fade
            const grad = ctx.createLinearGradient(0, horizon, 0, height);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(0.2, palette.grid);
            grad.addColorStop(1, 'rgba(0, 242, 255, 0.4)');
            
            ctx.strokeStyle = grad;
            ctx.lineWidth = 2;
            
            // Verticals
            const cx = width / 2;
            for(let i=-40; i<=40; i++) {
                let xBot = cx + (i * 120);
                ctx.beginPath();
                ctx.moveTo(cx, horizon);
                ctx.lineTo(xBot, height);
                ctx.stroke();
            }
            
            // Horizontals (Moving)
            let offset = (time * 0.2) % 100;
            for(let i=0; i<20; i++) {
                let y = horizon + Math.pow(i, 2.2) * 1.5 + offset;
                if(y > height) continue;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawMountains(time) {
            ctx.save();
            ctx.fillStyle = '#120626';
            ctx.beginPath();
            ctx.moveTo(0, height);
            for(let x=0; x<=width; x+=30) {
                let y = height * 0.55;
                y += Math.sin((x + time*0.05)*0.005) * 60;
                y += Math.sin((x + time*0.05)*0.02) * 10;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height);
            ctx.fill();
            ctx.restore();
        }

        // --- GAMEPLAY ELEMENTS ---

        function drawPlatform(x, y, w, h) {
            ctx.save();
            ctx.translate(x, y);
            ctx.shadowBlur = 15;
            ctx.shadowColor = palette.neonGreen;
            
            // Main block
            ctx.fillStyle = '#05020a';
            ctx.strokeStyle = palette.neonGreen;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(0, 0, w, h, 6);
            ctx.fill();
            ctx.stroke();

            // Details
            ctx.fillStyle = palette.neonGreen;
            ctx.fillRect(10, 8, w-20, 4);
            
            // Legs
            ctx.fillStyle = '#000';
            ctx.fillRect(20, h, 8, 10);
            ctx.fillRect(w-28, h, 8, 10);
            ctx.restore();
        }

        function drawCoin(x, y, time) {
            ctx.save();
            ctx.translate(x, y + Math.sin(time*0.005)*10);
            const scale = Math.abs(Math.sin(time*0.01));
            ctx.scale(scale, 1);
            
            ctx.shadowBlur = 20;
            ctx.shadowColor = palette.neonYellow;
            ctx.fillStyle = palette.neonYellow;
            ctx.beginPath();
            ctx.arc(0, 0, 18, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
        }

        function drawEnemy(x, y, time) {
            ctx.save();
            ctx.translate(x, y + Math.sin(time*0.003)*15);
            
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff0055';
            ctx.fillStyle = '#ff0055';
            
            // Triangle shape
            ctx.beginPath();
            ctx.moveTo(0, -30);
            ctx.lineTo(25, 20);
            ctx.lineTo(0, 35);
            ctx.lineTo(-25, 20);
            ctx.closePath();
            ctx.fill();
            
            // Eyes
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-8, -5, 6, 0, Math.PI*2);
            ctx.arc(8, -5, 6, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
        }

        function drawHero(time) {
            ctx.save();
            const hX = width * 0.25;
            const hY = height * 0.6 + Math.sin(time*0.005)*10;
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath();
            ctx.ellipse(hX, height*0.6 + 60, 25, 8, 0, 0, Math.PI*2);
            ctx.fill();

            // Hero Body
            ctx.shadowBlur = 20;
            ctx.shadowColor = palette.neonCyan;
            ctx.fillStyle = palette.neonCyan;
            ctx.beginPath();
            ctx.arc(hX, hY, 32, 0, Math.PI*2);
            ctx.fill();

            // Mask/Face
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(hX, hY, 22, 0, Math.PI*2);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(hX+9, hY-5, 4, 0, Math.PI*2);
            ctx.arc(hX-9, hY-5, 4, 0, Math.PI*2);
            ctx.fill();

            // Ears
            ctx.fillStyle = palette.neonCyan;
            ctx.beginPath();
            ctx.arc(hX-28, hY-15, 10, 0, Math.PI*2);
            ctx.arc(hX+28, hY-15, 10, 0, Math.PI*2);
            ctx.fill();

            // Scarf
            ctx.strokeStyle = palette.neonPink;
            ctx.lineWidth = 12;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(hX-20, hY-5);
            ctx.quadraticCurveTo(hX-60, hY-15 + Math.sin(time*0.01)*10, hX-90, hY+10 + Math.sin(time*0.01)*15);
            ctx.stroke();

            // Shoes
            ctx.fillStyle = '#ff5500';
            ctx.beginPath();
            ctx.ellipse(hX-15, hY+30, 12, 7, -0.2, 0, Math.PI*2);
            ctx.ellipse(hX+15, hY+30, 12, 7, 0.2, 0, Math.PI*2);
            ctx.fill();

            ctx.restore();
        }

        function drawGoal(x, y) {
            ctx.save();
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#fff';
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y-140);
            ctx.stroke();

            ctx.fillStyle = palette.neonPink;
            ctx.shadowColor = palette.neonPink;
            ctx.beginPath();
            ctx.moveTo(x, y-140);
            ctx.lineTo(x+60, y-110);
            ctx.lineTo(x, y-80);
            ctx.fill();
            ctx.restore();
        }

        function drawLevel(time) {
            drawPlatform(width*0.55, height*0.55, 160, 30);
            drawPlatform(width*0.72, height*0.42, 120, 30);
            drawCoin(width*0.63, height*0.45, time);
            drawEnemy(width*0.85, height*0.55, time);
            drawGoal(width*0.9, height*0.6);
        }

        function animate(time) {
            ctx.clearRect(0, 0, width, height);
            
            drawBackground(time);
            drawGrid(time);
            drawMountains(time);
            drawLevel(time);
            drawHero(time);

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        function startAdventure() {
            const btn = document.querySelector('.btn-start');
            btn.innerText = "LOADING...";
            btn.style.transform = "scale(0.95)";
            setTimeout(() => {
                alert("Game Start! (Demo Mode)");
                btn.innerText = "START ADVENTURE";
                btn.style.transform = "scale(1)";
            }, 600);
        }
    </script>
</body>
</html>
