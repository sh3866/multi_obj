<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trifolium repens | Botanical Study</title>
<style>
  :root {
    --bg-paper: #F9F9F7;
    --ink-dark: #1C2E1C;
    --ink-mid: #4A5E4A;
    --ink-light: #7A8F7A;
    --accent-red: #A8463E;
    --font-serif: 'Georgia', 'Times New Roman', serif;
    --font-mono: 'Courier New', Courier, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-paper);
    color: var(--ink-dark);
    font-family: var(--font-serif);
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    cursor: crosshair;
  }

  /* Subtle Paper Grain Texture */
  .texture-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  /* Main Layout */
  .study-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 1400px;
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    z-index: 1;
  }

  /* Left Column: Typography */
  .text-column {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 6rem;
    border-right: 1px solid rgba(28, 46, 28, 0.1);
  }

  h1 {
    font-size: 4.5rem;
    font-weight: 400;
    letter-spacing: -0.03em;
    line-height: 0.9;
    margin-bottom: 0.5rem;
    color: var(--ink-dark);
  }

  h2 {
    font-family: var(--font-mono);
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--ink-mid);
    margin-bottom: 2rem;
    display: inline-block;
  }

  .divider {
    width: 100%;
    height: 1px;
    background-color: var(--ink-mid);
    margin-bottom: 2rem;
    opacity: 0.3;
  }

  .meta-data {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--ink-light);
    letter-spacing: 0.1em;
    margin-bottom: 4rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .description {
    font-size: 1.1rem;
    line-height: 1.7;
    color: var(--ink-mid);
    max-width: 380px;
    font-style: italic;
  }

  /* Right Column: Visuals */
  .visual-column {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* The Stamp */
  .stamp {
    position: absolute;
    top: 15%;
    right: 10%;
    border: 2px solid var(--accent-red);
    color: var(--accent-red);
    padding: 8px 12px;
    font-family: var(--font-mono);
    font-weight: bold;
    text-transform: uppercase;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    transform: rotate(3deg);
    opacity: 0.8;
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: 10;
    background: rgba(249, 249, 247, 0.6);
  }

  /* SVG Container */
  .svg-wrapper {
    width: 85%;
    height: 85%;
    position: relative;
    transition: transform 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  svg.clover-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0px 30px 40px rgba(28, 46, 28, 0.12));
  }

  /* Annotations */
  .annotation-line {
    stroke: var(--ink-mid);
    stroke-width: 1px;
    fill: none;
    opacity: 0.5;
  }
  
  .annotation-dot {
    fill: var(--ink-dark);
  }

  .annotation-text {
    font-family: var(--font-mono);
    font-size: 10px;
    fill: var(--ink-dark);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* Responsive */
  @media (max-width: 1000px) {
    .study-container {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
      max-width: 600px;
    }
    .text-column {
      border-right: none;
      border-bottom: 1px solid rgba(28, 46, 28, 0.1);
      padding: 2rem;
      align-items: center;
      text-align: center;
    }
    h1 { font-size: 3rem; }
    .meta-data { margin-bottom: 2rem; }
    .visual-column { height: 500px; }
    .stamp { top: 5%; right: 5%; }
  }
</style>
</head>
<body>

  <div class="texture-overlay"></div>

  <div class="study-container">
    
    <!-- Text Column -->
    <div class="text-column">
      <h1>Trifolium</h1>
      <h2>Leguminosae</h2>
      <div class="divider"></div>
      
      <div class="meta-data">
        <span>LAT 45.4211 N</span>
        <span>LON 75.6978 W</span>
        <span style="color: var(--accent-red);">ALT 142 M</span>
      </div>

      <p class="description">
        "The humble clover, rich in nitrogen, sustains the soil it rests upon. A staple of the temperate field."
      </p>
    </div>

    <!-- Visual Column -->
    <div class="visual-column">
      <div class="stamp">Verified Specimen</div>
      
      <div class="svg-wrapper" id="svgWrapper">
        <svg class="clover-svg" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Stem Gradient -->
            <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
              <stop offset="0%" style="stop-color:#1C2E1C;stop-opacity:1" />
              <stop offset="40%" style="stop-color:#3A5A3A;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#6B8E6B;stop-opacity:1" />
            </linearGradient>

            <!-- Leaf Gradient: Complex organic shading -->
            <radialGradient id="leafGrad" cx="50%" cy="50%" r="70%" fx="45%" fy="40%">
              <stop offset="0%" style="stop-color:#9CB89C;stop-opacity:1" /> <!-- Highlight -->
              <stop offset="30%" style="stop-color:#5C8A5C;stop-opacity:1" /> <!-- Midtone -->
              <stop offset="80%" style="stop-color:#2F4F2F;stop-opacity:1" /> <!-- Shadow -->
              <stop offset="100%" style="stop-color:#1C2E1C;stop-opacity:1" /> <!-- Rim -->
            </radialGradient>

            <!-- Leaflet Shape Definition for reuse -->
            <!-- A realistic heart/obcordate shape with subtle lobes -->
            <path id="leaflet-shape" d="M 0,0 C -40,-30 -60,-10 -55,30 C -50,70 -20,90 0,90 C 20,90 50,70 55,30 C 60,-10 40,-30 0,0 Z" />
          </defs>

          <!-- Stem Group -->
          <g id="stem-group">
            <!-- Main Stem - Slightly curved organic line -->
            <path d="M 300,580 Q 305,400 300,250" 
                  fill="none" 
                  stroke="url(#stemGrad)" 
                  stroke-width="6" 
                  stroke-linecap="round" />
            
            <!-- Stem Texture/Hairs (subtle) -->
            <path d="M 302,500 L 305,490 M 298,450 L 295,440 M 303,350 L 306,340" 
                  stroke="#2F4F2F" stroke-width="1" opacity="0.6" stroke-linecap="round"/>
          </g>

          <!-- Leaves Group -->
          <g id="leaves-group">
            
            <!-- LEFT LEAF -->
            <g transform="translate(300, 250) rotate(-45) scale(0.95)">
              <!-- Petiole -->
              <path d="M 0,0 L 0,-40" stroke="url(#stemGrad)" stroke-width="4" stroke-linecap="round"/>
              
              <!-- Leaf Body -->
              <use href="#leaflet-shape" fill="url(#leafGrad)" stroke="#1C2E1C" stroke-width="0.5"/>
              
              <!-- Veins (Pinnate) -->
              <g stroke="#1C2E1C" stroke-width="0.8" fill="none" opacity="0.4" stroke-linecap="round">
                <path d="M 0,10 Q 2,50 0,85" stroke-width="1.2" />
                <path d="M -1,20 Q -25,20 -45,30" />
                <path d="M -1,40 Q -40,40 -50,50" />
                <path d="M 1,20 Q 25,20 45,30" />
                <path d="M 1,40 Q 40,40 50,50" />
                <!-- Secondary Veins -->
                <path d="M -20,25 L -30,35 M 20,25 L 30,35" stroke-width="0.5" opacity="0.6"/>
              </g>

              <!-- Serrations (Crenations) -->
              <g fill="#1C2E1C">
                 <path d="M -55,0 C -60,-5 -65,-5 -60,5 Z" />
                 <path d="M -50,20 C -58,20 -58,28 -50,30 Z" />
                 <path d="M 55,0 C 60,-5 65,-5 60,5 Z" />
                 <path d="M 50,20 C 58,20 58,28 50,30 Z" />
              </g>
            </g>

            <!-- RIGHT LEAF -->
            <g transform="translate(300, 250) rotate(45) scale(0.95)">
               <!-- Petiole -->
               <path d="M 0,0 L 0,-40" stroke="url(#stemGrad)" stroke-width="4" stroke-linecap="round"/>
               
               <!-- Leaf Body -->
               <use href="#leaflet-shape" fill="url(#leafGrad)" stroke="#1C2E1C" stroke-width="0.5"/>
               
               <!-- Veins -->
               <g stroke="#1C2E1C" stroke-width="0.8" fill="none" opacity="0.4" stroke-linecap="round">
                 <path d="M 0,10 Q 2,50 0,85" stroke-width="1.2" />
                 <path d="M -1,20 Q -25,20 -45,30" />
                 <path d="M -1,40 Q -40,40 -50,50" />
                 <path d="M 1,20 Q 25,20 45,30" />
                 <path d="M 1,40 Q 40,40 50,50" />
                 <path d="M -20,25 L -30,35 M 20,25 L 30,35" stroke-width="0.5" opacity="0.6"/>
               </g>

               <!-- Serrations -->
               <g fill="#1C2E1C">
                 <path d="M -55,0 C -60,-5 -65,-5 -60,5 Z" />
                 <path d="M -50,20 C -58,20 -58,28 -50,30 Z" />
                 <path d="M 55,0 C 60,-5 65,-5 60,5 Z" />
                 <path d="M 50,20 C 58,20 58,28 50,30 Z" />
               </g>
            </g>

            <!-- TOP LEAF (Dominant) -->
            <g transform="translate(300, 250) rotate(0) scale(1.15)">
              <!-- Petiole -->
              <path d="M 0,0 L 0,-50" stroke="url(#stemGrad)" stroke-width="5" stroke-linecap="round"/>
              
              <!-- Leaf Body -->
              <use href="#leaflet-shape" fill="url(#leafGrad)" stroke="#1C2E1C" stroke-width="0.5"/>
              
              <!-- Veins -->
              <g stroke="#1C2E1C" stroke-width="0.8" fill="none" opacity="0.4" stroke-linecap="round">
                <path d="M 0,10 Q 2,50 0,85" stroke-width="1.2" />
                <path d="M -1,25 Q -30,25 -55,35" />
                <path d="M -1,50 Q -50,50 -60,60" />
                <path d="M 1,25 Q 30,25 55,35" />
                <path d="M 1,50 Q 50,50 60,60" />
                <path d="M -25,30 L -35,40 M 25,30 L 35,40" stroke-width="0.5" opacity="0.6"/>
              </g>

              <!-- Serrations -->
              <g fill="#1C2E1C">
                 <path d="M -55,0 C -60,-5 -65,-5 -60,5 Z" />
                 <path d="M -50,20 C -58,20 -58,28 -50,30 Z" />
                 <path d="M 55,0 C 60,-5 65,-5 60,5 Z" />
                 <path d="M 50,20 C 58,20 58,28 50,30 Z" />
              </g>
            </g>
          </g>

          <!-- Scientific Annotations -->
          <g class="annotation-group">
            <!-- Serration Note -->
            <polyline points="220,180 180,160 120,160" class="annotation-line" />
            <circle cx="220" cy="180" r="2" class="annotation-dot" />
            <text x="115" y="163" class="annotation-text" text-anchor="end">Serration</text>
            
            <!-- Vein Note -->
            <polyline points="400,220 450,190 500,190" class="annotation-line" />
            <circle cx="400" cy="220" r="2" class="annotation-dot" />
            <text x="505" y="193" class="annotation-text" text-anchor="start">Venation</text>
          </g>
        </svg>
      </div>
    </div>

  </div>

  <script>
    // Parallax Logic
    const wrapper = document.getElementById('svgWrapper');
    const leaves = document.querySelectorAll('#leaves-group > g');
    
    document.addEventListener('mousemove', (e) => {
      // Calculate distance from center
      const x = (window.innerWidth / 2 - e.pageX) / 40;
      const y = (window.innerHeight / 2 - e.pageY) / 40;

      // Move wrapper slightly
      wrapper.style.transform = `translate(${x}px, ${y}px)`;

      // Move leaves more (parallax depth)
      leaves.forEach((leaf, index) => {
        // Add slight rotation variance per leaf for organic feel
        const depth = 2.5; 
        leaf.style.transform = `translate(${x * depth}px, ${y * depth}px)`;
      });
    });
  </script>
</body>
</html>
