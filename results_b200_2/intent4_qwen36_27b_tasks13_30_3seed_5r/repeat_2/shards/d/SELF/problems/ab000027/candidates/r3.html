<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trifolium repens | Botanical Study</title>
<style>
  :root {
    --bg-paper: #F2F2EE;
    --ink-dark: #1A241A;
    --ink-mid: #3E4F3E;
    --ink-light: #6B7D6B;
    --accent-red: #A6463E;
    --font-serif: 'Georgia', 'Times New Roman', serif;
    --font-mono: 'Courier New', Courier, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-paper);
    color: var(--ink-dark);
    font-family: var(--font-serif);
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    cursor: crosshair;
  }

  /* Realistic Paper Grain Texture */
  .texture-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.06'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    mix-blend-mode: multiply;
  }

  /* Main Layout */
  .study-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 1600px;
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    z-index: 1;
  }

  /* Left Column: Typography */
  .text-column {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 8rem;
    border-right: 1px solid rgba(26, 36, 26, 0.1);
  }

  h1 {
    font-size: 5rem;
    font-weight: 400;
    letter-spacing: -0.04em;
    line-height: 0.85;
    margin-bottom: 0.5rem;
    color: var(--ink-dark);
    font-variant: small-caps;
  }

  h2 {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: var(--ink-mid);
    margin-bottom: 3rem;
    display: inline-block;
    border-bottom: 1px solid var(--ink-light);
    padding-bottom: 5px;
  }

  .meta-data {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--ink-light);
    letter-spacing: 0.1em;
    margin-bottom: 5rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    line-height: 1.6;
  }

  .description {
    font-size: 1.2rem;
    line-height: 1.8;
    color: var(--ink-mid);
    max-width: 420px;
    font-style: italic;
    position: relative;
  }
  
  .description::before {
    content: '"';
    position: absolute;
    top: -20px;
    left: -30px;
    font-size: 4rem;
    color: var(--ink-light);
    opacity: 0.3;
    font-family: var(--font-serif);
  }

  /* Right Column: Visuals */
  .visual-column {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* The Stamp */
  .stamp {
    position: absolute;
    top: 18%;
    right: 15%;
    border: 2px solid var(--accent-red);
    color: var(--accent-red);
    padding: 10px 14px;
    font-family: var(--font-mono);
    font-weight: bold;
    text-transform: uppercase;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    transform: rotate(4deg);
    opacity: 0.85;
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: 10;
    background: rgba(242, 242, 238, 0.4);
  }

  /* SVG Container */
  .svg-wrapper {
    width: 90%;
    height: 90%;
    position: relative;
    transition: transform 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  svg.clover-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0px 40px 60px rgba(26, 36, 26, 0.15));
  }

  /* Annotations */
  .annotation-line {
    stroke: var(--ink-mid);
    stroke-width: 0.5px;
    fill: none;
    opacity: 0.6;
  }
  
  .annotation-dot {
    fill: var(--ink-dark);
  }

  .annotation-text {
    font-family: var(--font-mono);
    font-size: 9px;
    fill: var(--ink-mid);
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }

  /* Responsive */
  @media (max-width: 1100px) {
    .study-container {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
      max-width: 600px;
    }
    .text-column {
      border-right: none;
      border-bottom: 1px solid rgba(26, 36, 26, 0.1);
      padding: 3rem 2rem;
      align-items: center;
      text-align: center;
    }
    h1 { font-size: 3.5rem; }
    .meta-data { margin-bottom: 2rem; align-items: center; }
    .description { font-size: 1rem; }
    .description::before { display: none; }
    .visual-column { height: 550px; }
    .stamp { top: 5%; right: 5%; transform: rotate(2deg); }
  }
</style>
</head>
<body>

  <div class="texture-overlay"></div>

  <div class="study-container">
    
    <!-- Text Column -->
    <div class="text-column">
      <h1>Trifolium</h1>
      <h2>Leguminosae</h2>
      
      <div class="meta-data">
        <span>LAT 45.4211 N</span>
        <span>LON 75.6978 W</span>
        <span style="color: var(--accent-red);">ALT 142 M</span>
        <span style="margin-top: 10px; opacity: 0.6;">SPECIMEN #4092-A</span>
      </div>

      <p class="description">
        The humble clover, rich in nitrogen, sustains the soil it rests upon. A staple of the temperate field, characterized by its trifoliate leaves and crenated margins.
      </p>
    </div>

    <!-- Visual Column -->
    <div class="visual-column">
      <div class="stamp">Verified Specimen</div>
      
      <div class="svg-wrapper" id="svgWrapper">
        <svg class="clover-svg" viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Stem Gradient: Darker, more realistic -->
            <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
              <stop offset="0%" style="stop-color:#1A241A;stop-opacity:1" />
              <stop offset="50%" style="stop-color:#3A523A;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#5C7A5C;stop-opacity:1" />
            </linearGradient>

            <!-- Leaf Gradient: Radial for volume -->
            <radialGradient id="leafGrad" cx="50%" cy="50%" r="75%" fx="40%" fy="30%">
              <stop offset="0%" style="stop-color:#8FB08F;stop-opacity:1" /> 
              <stop offset="40%" style="stop-color:#4F754F;stop-opacity:1" /> 
              <stop offset="90%" style="stop-color:#253D25;stop-opacity:1" /> 
              <stop offset="100%" style="stop-color:#1A241A;stop-opacity:1" /> 
            </radialGradient>

            <!-- Vein Gradient: Fades at tips -->
            <linearGradient id="veinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#1A241A;stop-opacity:0.8" />
              <stop offset="100%" style="stop-color:#1A241A;stop-opacity:0.1" />
            </linearGradient>

            <!-- Drop shadow for depth within leaves -->
            <filter id="innerShadow">
              <feOffset dx="0" dy="3"/>
              <feGaussianBlur stdDeviation="3" result="offset-blur"/>
              <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
              <feFlood flood-color="black" flood-opacity="0.2" result="color"/>
              <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
              <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
            </filter>

            <!-- Reusable Leaflet Shape: More organic, asymmetrical -->
            <path id="leaflet-shape" d="M 0,0 C -20,-20 -40,-10 -45,20 C -50,50 -25,80 0,80 C 25,80 50,50 45,20 C 40,-10 20,-20 0,0 Z" />
          </defs>

          <!-- Stem Group -->
          <g id="stem-group">
            <!-- Main Stem -->
            <path d="M 300,680 C 300,500 305,400 300,250" 
                  fill="none" 
                  stroke="url(#stemGrad)" 
                  stroke-width="7" 
                  stroke-linecap="round" />
            
            <!-- Stem Hairs (Fine detail) -->
            <g stroke="#253D25" stroke-width="0.5" opacity="0.7" stroke-linecap="round">
                <path d="M 303,600 L 308,590 M 297,550 L 292,540 M 304,400 L 309,390 M 298,300 L 293,290" />
                <path d="M 302,500 L 306,492 M 299,450 L 294,442" />
            </g>
          </g>

          <!-- Leaves Group -->
          <g id="leaves-group">
            
            <!-- LEFT LEAF -->
            <g transform="translate(300, 250) rotate(-45) scale(0.9)">
              <!-- Petiole -->
              <path d="M 0,0 L 0,-45" stroke="url(#stemGrad)" stroke-width="4" stroke-linecap="round"/>
              
              <!-- Leaf Body -->
              <use href="#leaflet-shape" fill="url(#leafGrad)" filter="url(#innerShadow)"/>
              
              <!-- Veins -->
              <g stroke="url(#veinGrad)" stroke-width="0.8" fill="none" stroke-linecap="round">
                <path d="M 0,10 Q 1,50 0,75" stroke-width="1.2" />
                <path d="M -1,20 Q -25,20 -42,30" />
                <path d="M -1,40 Q -35,40 -45,50" />
                <path d="M 1,20 Q 25,20 42,30" />
                <path d="M 1,40 Q 35,40 45,50" />
                <!-- Secondary Veins -->
                <path d="M -15,25 L -25,35 M 15,25 L 25,35 M -20,50 L -28,58 M 20,50 L 28,58" stroke-width="0.5" opacity="0.5"/>
              </g>

              <!-- Serrations (Crenations) - Darker, more defined -->
              <g fill="#1A241A">
                 <path d="M -45,-5 C -50,-10 -55,-5 -50,5 Z" />
                 <path d="M -48,15 C -55,15 -55,25 -48,25 Z" />
                 <path d="M -42,35 C -50,35 -50,45 -42,45 Z" />
                 <path d="M 45,-5 C 50,-10 55,-5 50,5 Z" />
                 <path d="M 48,15 C 55,15 55,25 48,25 Z" />
                 <path d="M 42,35 C 50,35 50,45 42,45 Z" />
              </g>
              
              <!-- White Clover V-Shape Marking (Subtle) -->
              <path d="M -10,30 L 0,45 L 10,30" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.15" stroke-linecap="round" />
            </g>

            <!-- RIGHT LEAF -->
            <g transform="translate(300, 250) rotate(45) scale(0.9)">
               <!-- Petiole -->
               <path d="M 0,0 L 0,-45" stroke="url(#stemGrad)" stroke-width="4" stroke-linecap="round"/>
               
               <!-- Leaf Body -->
               <use href="#leaflet-shape" fill="url(#leafGrad)" filter="url(#innerShadow)"/>
               
               <!-- Veins -->
               <g stroke="url(#veinGrad)" stroke-width="0.8" fill="none" stroke-linecap="round">
                 <path d="M 0,10 Q 1,50 0,75" stroke-width="1.2" />
                 <path d="M -1,20 Q -25,20 -42,30" />
                 <path d="M -1,40 Q -35,40 -45,50" />
                 <path d="M 1,20 Q 25,20 42,30" />
                 <path d="M 1,40 Q 35,40 45,50" />
                 <path d="M -15,25 L -25,35 M 15,25 L 25,35 M -20,50 L -28,58 M 20,50 L 28,58" stroke-width="0.5" opacity="0.5"/>
               </g>

               <!-- Serrations -->
               <g fill="#1A241A">
                 <path d="M -45,-5 C -50,-10 -55,-5 -50,5 Z" />
                 <path d="M -48,15 C -55,15 -55,25 -48,25 Z" />
                 <path d="M -42,35 C -50,35 -50,45 -42,45 Z" />
                 <path d="M 45,-5 C 50,-10 55,-5 50,5 Z" />
                 <path d="M 48,15 C 55,15 55,25 48,25 Z" />
                 <path d="M 42,35 C 50,35 50,45 42,45 Z" />
               </g>

               <!-- White Clover V-Shape Marking -->
               <path d="M -10,30 L 0,45 L 10,30" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.15" stroke-linecap="round" />
            </g>

            <!-- TOP LEAF (Dominant) -->
            <g transform="translate(300, 250) rotate(0) scale(1.1)">
              <!-- Petiole -->
              <path d="M 0,0 L 0,-55" stroke="url(#stemGrad)" stroke-width="5" stroke-linecap="round"/>
              
              <!-- Leaf Body -->
              <use href="#leaflet-shape" fill="url(#leafGrad)" filter="url(#innerShadow)"/>
              
              <!-- Veins -->
              <g stroke="url(#veinGrad)" stroke-width="0.8" fill="none" stroke-linecap="round">
                <path d="M 0,10 Q 1,50 0,75" stroke-width="1.2" />
                <path d="M -1,25 Q -30,25 -50,35" />
                <path d="M -1,50 Q -50,50 -55,60" />
                <path d="M 1,25 Q 30,25 50,35" />
                <path d="M 1,50 Q 50,50 55,60" />
                <path d="M -20,30 L -30,40 M 20,30 L 30,40 M -25,55 L -32,62 M 25,55 L 32,62" stroke-width="0.5" opacity="0.5"/>
              </g>

              <!-- Serrations -->
              <g fill="#1A241A">
                 <path d="M -50,-5 C -55,-10 -60,-5 -55,5 Z" />
                 <path d="M -52,15 C -60,15 -60,25 -52,25 Z" />
                 <path d="M -45,35 C -53,35 -53,45 -45,45 Z" />
                 <path d="M 50,-5 C 55,-10 60,-5 55,5 Z" />
                 <path d="M 52,15 C 60,15 60,25 52,25 Z" />
                 <path d="M 45,35 C 53,35 53,45 45,45 Z" />
              </g>

              <!-- White Clover V-Shape Marking (More visible on top leaf) -->
              <path d="M -15,35 L 0,55 L 15,35" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.2" stroke-linecap="round" />
            </g>
          </g>

          <!-- Scientific Annotations -->
          <g class="annotation-group">
            <!-- Serration Note -->
            <polyline points="220,190 180,160 120,160" class="annotation-line" />
            <circle cx="220" cy="190" r="1.5" class="annotation-dot" />
            <text x="115" y="163" class="annotation-text" text-anchor="end">Serration</text>
            
            <!-- Vein Note -->
            <polyline points="400,220 450,190 510,190" class="annotation-line" />
            <circle cx="400" cy="220" r="1.5" class="annotation-dot" />
            <text x="515" y="193" class="annotation-text" text-anchor="start">Venation</text>
          </g>
        </svg>
      </div>
    </div>

  </div>

  <script>
    // Parallax Logic
    const wrapper = document.getElementById('svgWrapper');
    const leaves = document.querySelectorAll('#leaves-group > g');
    
    document.addEventListener('mousemove', (e) => {
      // Calculate distance from center (normalized -1 to 1)
      const x = (window.innerWidth / 2 - e.pageX) / window.innerWidth;
      const y = (window.innerHeight / 2 - e.pageY) / window.innerHeight;

      // Move wrapper slightly
      wrapper.style.transform = `translate(${x * 15}px, ${y * 15}px)`;

      // Move leaves more (parallax depth)
      leaves.forEach((leaf, index) => {
        // Add slight rotation variance per leaf for organic feel
        const depth = 2.5; 
        // We must preserve the original transform (rotate/scale) defined in SVG
        // However, since the SVG uses transform attributes, we can't easily append CSS transforms 
        // without overwriting them unless we use a nested group.
        // To keep it simple and robust, we'll just translate the whole leaf group slightly.
        // Note: This is a visual approximation.
        leaf.style.transform = `translate(${x * 25}px, ${y * 25}px)`;
      });
    });
  </script>
</body>
</html>
