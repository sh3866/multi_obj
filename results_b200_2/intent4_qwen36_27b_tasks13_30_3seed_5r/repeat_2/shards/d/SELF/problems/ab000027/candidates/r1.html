<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trifolium pratense | Botanical Study</title>
<style>
  :root {
    --bg-color: #F7F8F5; /* Cleaner, warmer paper */
    --ink-primary: #1A2F1A; /* Deep botanical green-black */
    --ink-secondary: #546E54; /* Muted text */
    --accent-red: #B8463E; /* Antique red ink */
    --grid-color: #E6E9E2;
    --line-color: #D1D6CE;
    
    /* Typography */
    --font-serif: 'Georgia', 'Times New Roman', serif;
    --font-mono: 'Courier New', Courier, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-color);
    color: var(--ink-primary);
    font-family: var(--font-serif);
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Paper Grain Texture */
  .texture-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: radial-gradient(var(--grid-color) 1px, transparent 1px);
    background-size: 32px 32px;
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }

  /* Main Container */
  .study-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 1200px;
    max-height: 900px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    z-index: 1;
  }

  /* Typography Styles */
  h1 {
    font-size: 3rem;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 0.25rem;
  }

  h2 {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--ink-secondary);
    margin-bottom: 1rem;
    border-bottom: 1px solid var(--ink-secondary);
    padding-bottom: 0.5rem;
    display: inline-block;
    width: 100%;
  }

  p {
    font-size: 0.95rem;
    line-height: 1.6;
    color: var(--ink-secondary);
    max-width: 320px;
  }

  .meta-data {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: #889;
    letter-spacing: 0.05em;
    margin-top: 1.5rem;
    display: flex;
    gap: 1.5rem;
  }

  /* Layout Sections */
  .header-section {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 4rem;
  }

  .image-section {
    grid-column: 2 / 3;
    grid-row: 1 / 3;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  .footer-section {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 4rem;
    align-items: flex-start;
  }

  /* The Stamp */
  .stamp {
    position: absolute;
    top: 15%;
    right: 15%;
    border: 2px solid var(--accent-red);
    color: var(--accent-red);
    padding: 10px 14px;
    font-family: var(--font-mono);
    font-weight: bold;
    text-transform: uppercase;
    font-size: 0.7rem;
    transform: rotate(4deg);
    opacity: 0.85;
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: 10;
  }

  /* SVG Styling */
  svg.clover-svg {
    width: 80%;
    height: 80%;
    overflow: visible;
    filter: drop-shadow(0px 20px 30px rgba(26, 47, 26, 0.15));
    transition: transform 0.1s linear;
  }

  /* Annotations */
  .annotation-group {
    pointer-events: none;
  }
  
  .annotation-line {
    stroke: var(--ink-secondary);
    stroke-width: 0.5px;
    fill: none;
    opacity: 0.6;
  }

  .annotation-text {
    font-family: var(--font-mono);
    font-size: 10px;
    fill: var(--ink-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* Responsive */
  @media (max-width: 900px) {
    .study-container {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      height: auto;
      padding: 2rem 0;
    }
    .header-section, .footer-section {
      padding: 2rem;
      align-items: center;
      text-align: center;
    }
    .image-section {
      height: 400px;
      order: -1;
    }
    p { margin: 0 auto; }
    .meta-data { justify-content: center; }
    .stamp { top: 5%; right: 5%; }
  }
</style>
</head>
<body>

  <div class="texture-overlay"></div>

  <div class="study-container">
    
    <!-- Header -->
    <div class="header-section">
      <h1>Trifolium</h1>
      <h2>Leguminosae</h2>
      <div class="meta-data">
        <span>LAT 45.4211 N</span>
        <span>LON 75.6978 W</span>
      </div>
    </div>

    <!-- Main Visual -->
    <div class="image-section">
      <div class="stamp">Verified Specimen</div>
      
      <svg class="clover-svg" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Stem Gradient: Darker at base, lighter at top -->
          <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" style="stop-color:#1A2F1A;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#3A5A3A;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#6B8E6B;stop-opacity:1" />
          </linearGradient>

          <!-- Leaf Gradient: Radial for volume -->
          <radialGradient id="leafGrad" cx="50%" cy="50%" r="75%" fx="40%" fy="40%">
            <stop offset="0%" style="stop-color:#8FB38F;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#5C8A5C;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#2F4F2F;stop-opacity:1" />
          </radialGradient>

          <!-- Vein Pattern -->
          <pattern id="veinPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
             <path d="M 0,20 Q 20,20 40,20" stroke="#1A2F1A" stroke-width="0.5" fill="none" opacity="0.3" />
          </pattern>
        </defs>

        <!-- Stem Group -->
        <g id="stem-group">
          <!-- Main Stem -->
          <path d="M 300,550 Q 310,400 300,250" 
                fill="none" 
                stroke="url(#stemGrad)" 
                stroke-width="8" 
                stroke-linecap="round" />
        </g>

        <!-- Leaves Group -->
        <g id="leaves-group">
          
          <!-- LEFT LEAF -->
          <g transform="translate(300, 250) rotate(-35) scale(0.9)">
            <!-- Petiole -->
            <path d="M 0,0 L 0,-40" stroke="url(#stemGrad)" stroke-width="5" stroke-linecap="round"/>
            
            <!-- Leaf Body -->
            <path class="leaflet" d="M 0,0 C -50,-60 -90,-40 -80,10 C -70,60 -20,80 0,80 C 20,80 70,60 80,10 C 90,-40 50,-60 0,0 Z" 
                  fill="url(#leafGrad)" stroke="#2F4F2F" stroke-width="1"/>
            
            <!-- Veins -->
            <g stroke="#1A2F1A" stroke-width="1" fill="none" opacity="0.4" stroke-linecap="round">
              <path d="M 0,10 Q 5,40 0,75" stroke-width="1.5" />
              <path d="M -2,20 Q -30,20 -50,15" />
              <path d="M -2,40 Q -50,40 -65,25" />
              <path d="M 2,20 Q 30,20 50,15" />
              <path d="M 2,40 Q 50,40 65,25" />
            </g>

            <!-- Serrations (Teeth) -->
            <g fill="#2F4F2F">
               <path d="M -65,-30 L -75,-40 L -68,-25 Z" />
               <path d="M -80,0 L -90,0 L -82,10 Z" />
               <path d="M 65,-30 L 75,-40 L 68,-25 Z" />
               <path d="M 80,0 L 90,0 L 82,10 Z" />
            </g>
          </g>

          <!-- RIGHT LEAF -->
          <g transform="translate(300, 250) rotate(35) scale(0.9)">
             <!-- Petiole -->
             <path d="M 0,0 L 0,-40" stroke="url(#stemGrad)" stroke-width="5" stroke-linecap="round"/>
             
             <!-- Leaf Body -->
             <path class="leaflet" d="M 0,0 C -50,-60 -90,-40 -80,10 C -70,60 -20,80 0,80 C 20,80 70,60 80,10 C 90,-40 50,-60 0,0 Z" 
                   fill="url(#leafGrad)" stroke="#2F4F2F" stroke-width="1"/>
             
             <!-- Veins -->
             <g stroke="#1A2F1A" stroke-width="1" fill="none" opacity="0.4" stroke-linecap="round">
               <path d="M 0,10 Q 5,40 0,75" stroke-width="1.5" />
               <path d="M -2,20 Q -30,20 -50,15" />
               <path d="M -2,40 Q -50,40 -65,25" />
               <path d="M 2,20 Q 30,20 50,15" />
               <path d="M 2,40 Q 50,40 65,25" />
             </g>

             <!-- Serrations -->
             <g fill="#2F4F2F">
               <path d="M -65,-30 L -75,-40 L -68,-25 Z" />
               <path d="M -80,0 L -90,0 L -82,10 Z" />
               <path d="M 65,-30 L 75,-40 L 68,-25 Z" />
               <path d="M 80,0 L 90,0 L 82,10 Z" />
             </g>
          </g>

          <!-- TOP LEAF (Dominant) -->
          <g transform="translate(300, 250) rotate(0) scale(1.1)">
            <!-- Petiole -->
            <path d="M 0,0 L 0,-50" stroke="url(#stemGrad)" stroke-width="6" stroke-linecap="round"/>
            
            <!-- Leaf Body -->
            <path class="leaflet" d="M 0,0 C -60,-70 -110,-50 -100,10 C -90,70 -30,90 0,90 C 30,90 90,70 100,10 C 110,-50 60,-70 0,0 Z" 
                  fill="url(#leafGrad)" stroke="#2F4F2F" stroke-width="1"/>
            
            <!-- Veins -->
            <g stroke="#1A2F1A" stroke-width="1" fill="none" opacity="0.4" stroke-linecap="round">
              <path d="M 0,10 Q 5,40 0,85" stroke-width="1.5" />
              <path d="M -2,25 Q -40,25 -70,15" />
              <path d="M -2,50 Q -60,50 -80,30" />
              <path d="M 2,25 Q 40,25 70,15" />
              <path d="M 2,50 Q 60,50 80,30" />
            </g>

            <!-- Serrations -->
            <g fill="#2F4F2F">
               <path d="M -80,-40 L -90,-50 L -85,-35 Z" />
               <path d="M -95,0 L -105,0 L -98,10 Z" />
               <path d="M 80,-40 L 90,-50 L 85,-35 Z" />
               <path d="M 95,0 L 105,0 L 98,10 Z" />
            </g>
          </g>
        </g>

        <!-- Annotations -->
        <g class="annotation-group">
          <!-- Serration Note -->
          <path d="M 200,130 L 150,100 L 100,100" class="annotation-line" />
          <circle cx="200" cy="130" r="2" fill="#546E54" />
          <text x="90" y="104" class="annotation-text" text-anchor="end">Serration</text>
          
          <!-- Vein Note -->
          <path d="M 400,180 L 450,150 L 500,150" class="annotation-line" />
          <circle cx="400" cy="180" r="2" fill="#546E54" />
          <text x="510" y="154" class="annotation-text" text-anchor="start">Venation</text>
        </g>
      </svg>
    </div>

    <!-- Footer -->
    <div class="footer-section">
      <p>
        "The humble clover, rich in nitrogen, sustains the soil it rests upon. A staple of the temperate field."
      </p>
    </div>

  </div>

  <script>
    // Refined Parallax Effect
    // Calculates mouse position relative to center and applies subtle rotation/translation
    document.addEventListener('mousemove', (e) => {
      const x = (window.innerWidth - e.pageX * 2) / 200;
      const y = (window.innerHeight - e.pageY * 2) / 200;

      const svg = document.querySelector('.clover-svg');
      // Subtle movement for the whole SVG
      svg.style.transform = `translate(${x}px, ${y}px)`;

      // Parallax for leaves (they move slightly more than the stem to simulate depth)
      const leaves = document.querySelectorAll('.leaflet');
      leaves.forEach((leaf, index) => {
        const depth = 1.5; 
        // We use transform-origin: center bottom implicitly via CSS logic or just translate
        leaf.style.transform = `translate(${x * depth}px, ${y * depth}px)`;
      });
    });
  </script>
</body>
</html>
