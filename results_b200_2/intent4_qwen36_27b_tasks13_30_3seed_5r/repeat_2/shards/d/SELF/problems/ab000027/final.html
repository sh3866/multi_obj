<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trifolium repens | Field Study 04</title>
<style>
  :root {
    --bg-paper: #F3F3F0;
    --ink-dark: #182618;
    --ink-mid: #3D4F3D;
    --ink-light: #7C8F7C;
    --accent-red: #A6463E;
    --accent-red-faint: rgba(166, 70, 62, 0.15);
    --font-serif: 'Georgia', 'Times New Roman', serif;
    --font-mono: 'Courier New', Courier, monospace;
    --font-sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-paper);
    color: var(--ink-dark);
    font-family: var(--font-serif);
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    cursor: crosshair;
  }

  /* Refined Paper Grain Texture */
  .texture-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    mix-blend-mode: multiply;
  }

  /* Layout Grid */
  .study-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 1800px;
    display: grid;
    grid-template-columns: 1fr 1.5fr; /* More space for the specimen */
    z-index: 1;
  }

  /* Left Column: Typography */
  .text-column {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 6vw;
    border-right: 1px solid rgba(24, 38, 24, 0.08);
    position: relative;
  }

  /* Decorative vertical line accent */
  .text-column::after {
    content: '';
    position: absolute;
    left: 0;
    top: 15%;
    bottom: 15%;
    width: 1px;
    background: var(--ink-dark);
    opacity: 0.1;
  }

  h1 {
    font-size: 5.5rem;
    font-weight: 400;
    letter-spacing: -0.03em;
    line-height: 0.9;
    margin-bottom: 0.25rem;
    color: var(--ink-dark);
    font-variant: small-caps;
  }

  h2 {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.3em;
    color: var(--ink-mid);
    margin-bottom: 4rem;
    display: inline-block;
    padding-left: 10px;
    border-left: 2px solid var(--ink-dark);
  }

  .meta-data {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-light);
    letter-spacing: 0.1em;
    margin-bottom: 6rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    line-height: 1.6;
    text-transform: uppercase;
  }

  .description {
    font-size: 1.15rem;
    line-height: 1.9;
    color: var(--ink-mid);
    max-width: 400px;
    font-style: italic;
    position: relative;
    padding-left: 2rem;
  }
  
  .description::before {
    content: '"';
    position: absolute;
    top: -15px;
    left: -5px;
    font-size: 4rem;
    color: var(--ink-light);
    opacity: 0.2;
    font-family: var(--font-serif);
    font-style: normal;
  }

  /* Right Column: Visuals */
  .visual-column {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: radial-gradient(circle at center, rgba(255,255,255,0.4) 0%, transparent 70%);
  }

  /* The Stamp - More organic ink bleed */
  .stamp {
    position: absolute;
    top: 12%;
    right: 12%;
    border: 2px solid var(--accent-red);
    color: var(--accent-red);
    padding: 8px 12px;
    font-family: var(--font-mono);
    font-weight: bold;
    text-transform: uppercase;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    transform: rotate(5deg);
    opacity: 0.8;
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: 10;
    background: var(--accent-red-faint);
    box-shadow: 1px 1px 0px var(--accent-red);
  }

  /* SVG Container */
  .svg-wrapper {
    width: 85%;
    height: 85%;
    position: relative;
    transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    will-change: transform;
  }

  svg.clover-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0px 25px 40px rgba(24, 38, 24, 0.1));
  }

  /* Annotations - Refined */
  .annotation-line {
    stroke: var(--ink-mid);
    stroke-width: 0.5px;
    fill: none;
    opacity: 0.4;
  }
  
  .annotation-dot {
    fill: var(--ink-dark);
    opacity: 0.6;
  }

  .annotation-text {
    font-family: var(--font-mono);
    font-size: 8px;
    fill: var(--ink-mid);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    font-weight: 600;
  }

  /* Responsive */
  @media (max-width: 1100px) {
    .study-container {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
      max-width: 600px;
    }
    .text-column {
      border-right: none;
      border-bottom: 1px solid rgba(24, 38, 24, 0.1);
      padding: 2rem 2rem;
      align-items: center;
      text-align: center;
    }
    .text-column::after { display: none; }
    h1 { font-size: 3.5rem; }
    h2 { border-left: none; border-bottom: 1px solid var(--ink-dark); padding-left: 0; padding-bottom: 5px; margin-bottom: 2rem;}
    .meta-data { margin-bottom: 2rem; align-items: center; }
    .description { font-size: 1rem; padding-left: 0; }
    .description::before { display: none; }
    .visual-column { height: 500px; }
    .stamp { top: 2%; right: 2%; transform: rotate(3deg) scale(0.8); }
  }
</style>
</head>
<body>

  <div class="texture-overlay"></div>

  <div class="study-container">
    
    <!-- Text Column -->
    <div class="text-column">
      <h1>Trifolium</h1>
      <h2>Leguminosae</h2>
      
      <div class="meta-data">
        <span>Lat 45.4211 N</span>
        <span>Lon 75.6978 W</span>
        <span style="color: var(--accent-red);">Alt 142 M</span>
        <span style="margin-top: 15px; opacity: 0.5;">Specimen #4092-A</span>
      </div>

      <p class="description">
        The humble clover, rich in nitrogen, sustains the soil it rests upon. A staple of the temperate field, characterized by its trifoliate leaves and crenated margins.
      </p>
    </div>

    <!-- Visual Column -->
    <div class="visual-column">
      <div class="stamp">Verified Specimen</div>
      
      <div class="svg-wrapper" id="svgWrapper">
        <svg class="clover-svg" viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Stem Gradient: Subtle depth -->
            <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
              <stop offset="0%" style="stop-color:#182618;stop-opacity:1" />
              <stop offset="40%" style="stop-color:#2F452F;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#5C7A5C;stop-opacity:1" />
            </linearGradient>

            <!-- Leaf Gradient: Complex 3D volume -->
            <radialGradient id="leafGrad" cx="50%" cy="50%" r="80%" fx="50%" fy="40%">
              <stop offset="0%" style="stop-color:#6B8C6B;stop-opacity:1" /> 
              <stop offset="60%" style="stop-color:#3D5A3D;stop-opacity:1" /> 
              <stop offset="90%" style="stop-color:#253D25;stop-opacity:1" /> 
              <stop offset="100%" style="stop-color:#182618;stop-opacity:1" /> 
            </radialGradient>

            <!-- Vein Gradient: Fades at tips -->
            <linearGradient id="veinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#182618;stop-opacity:0.9" />
              <stop offset="100%" style="stop-color:#182618;stop-opacity:0.05" />
            </linearGradient>

            <!-- Drop shadow for depth within leaves -->
            <filter id="innerShadow">
              <feOffset dx="0" dy="4"/>
              <feGaussianBlur stdDeviation="4" result="offset-blur"/>
              <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
              <feFlood flood-color="black" flood-opacity="0.3" result="color"/>
              <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
              <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
            </filter>
            
            <!-- Serration Shadow -->
             <filter id="serrationShadow">
              <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#182618" flood-opacity="0.4"/>
            </filter>

            <!-- Reusable Leaflet Shape: More organic, asymmetrical -->
            <path id="leaflet-shape" d="M 0,0 C -18,-25 -42,-12 -48,20 C -52,55 -28,85 0,85 C 28,85 52,55 48,20 C 42,-12 18,-25 0,0 Z" />
          </defs>

          <!-- Stem Group -->
          <g id="stem-group">
            <!-- Main Stem -->
            <path d="M 300,680 C 300,500 305,400 300,250" 
                  fill="none" 
                  stroke="url(#stemGrad)" 
                  stroke-width="6" 
                  stroke-linecap="round" />
            
            <!-- Stem Hairs (Fine detail) -->
            <g stroke="#182618" stroke-width="0.5" opacity="0.6" stroke-linecap="round">
                <path d="M 302,600 L 307,590 M 297,550 L 292,540 M 303,400 L 308,390 M 298,300 L 293,290" />
                <path d="M 301,500 L 305,492 M 299,450 L 294,442" />
            </g>
          </g>

          <!-- Leaves Group -->
          <g id="leaves-group">
            
            <!-- LEFT LEAF -->
            <g transform="translate(300, 250) rotate(-40) scale(0.95)">
              <!-- Petiole -->
              <path d="M 0,0 L 0,-50" stroke="url(#stemGrad)" stroke-width="3.5" stroke-linecap="round"/>
              
              <!-- Leaf Body -->
              <use href="#leaflet-shape" fill="url(#leafGrad)" filter="url(#innerShadow)"/>
              
              <!-- Veins -->
              <g stroke="url(#veinGrad)" stroke-width="0.8" fill="none" stroke-linecap="round">
                <path d="M 0,10 Q 1,50 0,80" stroke-width="1.2" />
                <path d="M -1,20 Q -25,20 -45,30" />
                <path d="M -1,40 Q -35,40 -48,50" />
                <path d="M 1,20 Q 25,20 45,30" />
                <path d="M 1,40 Q 35,40 48,50" />
                <!-- Secondary Veins -->
                <path d="M -15,25 L -25,35 M 15,25 L 25,35 M -20,50 L -28,58 M 20,50 L 28,58" stroke-width="0.5" opacity="0.5"/>
              </g>

              <!-- Serrations (Crenations) - Organic, slightly detached look -->
              <g fill="#182618" filter="url(#serrationShadow)">
                 <path d="M -48,5 C -53,0 -58,5 -53,10 Z" />
                 <path d="M -50,20 C -57,20 -57,30 -50,30 Z" />
                 <path d="M -45,35 C -53,35 -53,45 -45,45 Z" />
                 <path d="M 48,5 C 53,0 58,5 53,10 Z" />
                 <path d="M 50,20 C 57,20 57,30 50,30 Z" />
                 <path d="M 45,35 C 53,35 53,45 45,45 Z" />
              </g>
              
              <!-- White Clover V-Shape Marking (Subtle) -->
              <path d="M -10,30 L 0,45 L 10,30" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.12" stroke-linecap="round" />
            </g>

            <!-- RIGHT LEAF -->
            <g transform="translate(300, 250) rotate(40) scale(0.95)">
               <!-- Petiole -->
               <path d="M 0,0 L 0,-50" stroke="url(#stemGrad)" stroke-width="3.5" stroke-linecap="round"/>
               
               <!-- Leaf Body -->
               <use href="#leaflet-shape" fill="url(#leafGrad)" filter="url(#innerShadow)"/>
               
               <!-- Veins -->
               <g stroke="url(#veinGrad)" stroke-width="0.8" fill="none" stroke-linecap="round">
                 <path d="M 0,10 Q 1,50 0,80" stroke-width="1.2" />
                 <path d="M -1,20 Q -25,20 -45,30" />
                 <path d="M -1,40 Q -35,40 -48,50" />
                 <path d="M 1,20 Q 25,20 45,30" />
                 <path d="M 1,40 Q 35,40 48,50" />
                 <path d="M -15,25 L -25,35 M 15,25 L 25,35 M -20,50 L -28,58 M 20,50 L 28,58" stroke-width="0.5" opacity="0.5"/>
               </g>

               <!-- Serrations -->
               <g fill="#182618" filter="url(#serrationShadow)">
                 <path d="M -48,5 C -53,0 -58,5 -53,10 Z" />
                 <path d="M -50,20 C -57,20 -57,30 -50,30 Z" />
                 <path d="M -45,35 C -53,35 -53,45 -45,45 Z" />
                 <path d="M 48,5 C 53,0 58,5 53,10 Z" />
                 <path d="M 50,20 C 57,20 57,30 50,30 Z" />
                 <path d="M 45,35 C 53,35 53,45 45,45 Z" />
               </g>

               <!-- White Clover V-Shape Marking -->
               <path d="M -10,30 L 0,45 L 10,30" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.12" stroke-linecap="round" />
            </g>

            <!-- TOP LEAF (Dominant) -->
            <g transform="translate(300, 250) rotate(0) scale(1.15)">
              <!-- Petiole -->
              <path d="M 0,0 L 0,-60" stroke="url(#stemGrad)" stroke-width="4.5" stroke-linecap="round"/>
              
              <!-- Leaf Body -->
              <use href="#leaflet-shape" fill="url(#leafGrad)" filter="url(#innerShadow)"/>
              
              <!-- Veins -->
              <g stroke="url(#veinGrad)" stroke-width="0.8" fill="none" stroke-linecap="round">
                <path d="M 0,10 Q 1,50 0,80" stroke-width="1.2" />
                <path d="M -1,25 Q -30,25 -50,35" />
                <path d="M -1,50 Q -50,50 -55,60" />
                <path d="M 1,25 Q 30,25 50,35" />
                <path d="M 1,50 Q 50,50 55,60" />
                <path d="M -20,30 L -30,40 M 20,30 L 30,40 M -25,55 L -32,62 M 25,55 L 32,62" stroke-width="0.5" opacity="0.5"/>
              </g>

              <!-- Serrations -->
              <g fill="#182618" filter="url(#serrationShadow)">
                 <path d="M -50,5 C -55,0 -60,5 -55,10 Z" />
                 <path d="M -52,20 C -60,20 -60,30 -52,30 Z" />
                 <path d="M -45,35 C -53,35 -53,45 -45,45 Z" />
                 <path d="M 50,5 C 55,0 60,5 55,10 Z" />
                 <path d="M 52,20 C 60,20 60,30 52,30 Z" />
                 <path d="M 45,35 C 53,35 53,45 45,45 Z" />
              </g>

              <!-- White Clover V-Shape Marking (More visible on top leaf) -->
              <path d="M -15,35 L 0,55 L 15,35" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.18" stroke-linecap="round" />
            </g>
          </g>

          <!-- Scientific Annotations -->
          <g class="annotation-group">
            <!-- Serration Note -->
            <polyline points="230,180 180,150 120,150" class="annotation-line" />
            <circle cx="230" cy="180" r="1.5" class="annotation-dot" />
            <text x="115" y="153" class="annotation-text" text-anchor="end">Serration</text>
            
            <!-- Vein Note -->
            <polyline points="390,210 450,180 520,180" class="annotation-line" />
            <circle cx="390" cy="210" r="1.5" class="annotation-dot" />
            <text x="525" y="183" class="annotation-text" text-anchor="start">Venation</text>
          </g>
        </svg>
      </div>
    </div>

  </div>

  <script>
    // Parallax Logic
    const wrapper = document.getElementById('svgWrapper');
    const leaves = document.querySelectorAll('#leaves-group > g');
    
    document.addEventListener('mousemove', (e) => {
      // Calculate distance from center (normalized -1 to 1)
      const x = (window.innerWidth / 2 - e.pageX) / window.innerWidth;
      const y = (window.innerHeight / 2 - e.pageY) / window.innerHeight;

      // Move wrapper slightly
      wrapper.style.transform = `translate(${x * 15}px, ${y * 15}px)`;

      // Move leaves more (parallax depth)
      leaves.forEach((leaf, index) => {
        // Add slight rotation variance per leaf for organic feel
        const depth = 2.5; 
        // We must preserve the original transform (rotate/scale) defined in SVG
        // However, since the SVG uses transform attributes, we can't easily append CSS transforms 
        // without overwriting them unless we use a nested group.
        // To keep it simple and robust, we'll just translate the whole leaf group slightly.
        // Note: This is a visual approximation.
        leaf.style.transform = `translate(${x * 25}px, ${y * 25}px)`;
      });
    });
  </script>
</body>
</html>
