<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactile Reality | Editorial Illustration</title>
<style>
    :root {
        --bg: #EBEAE6;
        --text: #1A1A1A;
        --text-muted: #777777;
        --font-display: "Helvetica Neue", "Arial Black", sans-serif;
        --font-body: "Helvetica Neue", "Helvetica", Arial, sans-serif;
        --font-mono: "Menlo", "Consolas", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    /* High-End Noise Overlay */
    .grain {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 10;
        opacity: 0.06;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* UI Layout */
    header {
        padding: 3.5rem 5rem;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        z-index: 5;
    }

    h1 {
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        color: var(--text);
    }

    .meta {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: var(--text-muted);
        text-align: right;
        line-height: 1.5;
        letter-spacing: 0.05em;
    }

    main {
        flex: 1;
        display: flex;
        position: relative;
        overflow: hidden;
        align-items: center;
    }

    /* Typography Layout - Editorial Style */
    .text-block {
        width: 45%;
        padding-left: 8vw;
        z-index: 2;
        position: relative;
    }

    .big-type {
        font-family: var(--font-display);
        font-size: 7.5vw;
        line-height: 0.9;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: var(--text);
        text-transform: uppercase;
        position: relative;
        margin-bottom: 3rem;
    }
    
    .big-type span {
        display: block;
    }

    .sub-type {
        font-size: 1.1rem;
        font-weight: 400;
        max-width: 340px;
        line-height: 1.6;
        color: var(--text);
    }

    /* The SVG Container */
    .art-stage {
        width: 55%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    svg {
        height: 95vh;
        width: auto;
        filter: drop-shadow(0 50px 100px rgba(0,0,0,0.15));
        transition: transform 0.1s ease-out;
        transform-style: preserve-3d;
    }

    /* Interactive Hint */
    .hint {
        position: absolute;
        bottom: 3.5rem;
        right: 5rem;
        font-family: var(--font-mono);
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 1rem;
        letter-spacing: 0.1em;
        z-index: 5;
    }
    .hint::before {
        content: '';
        width: 30px;
        height: 1px;
        background: var(--text-muted);
    }

    /* Responsive adjustments */
    @media (max-width: 900px) {
        body { overflow-y: auto; height: auto; }
        header, .hint { padding: 1.5rem; }
        main { flex-direction: column; height: auto; padding-top: 2rem;}
        .text-block { width: 100%; padding: 0 2rem; align-items: center; text-align: center; margin-bottom: 2rem;}
        .art-stage { width: 100%; height: 50vh; }
        .big-type { font-size: 15vw; }
        svg { height: 100%; }
        .sub-type { margin: 1.5rem auto 0; }
    }
</style>
</head>
<body>

    <div class="grain"></div>

    <header>
        <h1>Anatomy of Interaction</h1>
        <div class="meta">
            FIG. 04 — CLOSE UP<br>
            RENDER: VECTOR/SVG<br>
            SCALE: 1:1
        </div>
    </header>

    <main>
        <div class="text-block">
            <div class="big-type">
                <span>Tactile</span>
                <span>Reality</span>
            </div>
            <p class="sub-type">
                The intersection of biological intent and digital response. A study in grip, pressure, and the warmth of the hand against cold glass.
            </p>
        </div>

        <div class="art-stage">
            <!-- SVG Illustration Start -->
            <svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Skin Gradients: Refined for realism -->
                    <linearGradient id="skinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#F5D0B8" /> <!-- Highlight -->
                        <stop offset="40%" stop-color="#E0AC8F" /> <!-- Base -->
                        <stop offset="100%" stop-color="#B87D5C" /> <!-- Deep Shadow -->
                    </linearGradient>
                    
                    <linearGradient id="thumbGradient" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#C48562" />
                        <stop offset="100%" stop-color="#F5D0B8" />
                    </linearGradient>
                    
                    <linearGradient id="palmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#E8B89A" />
                        <stop offset="100%" stop-color="#9E6847" />
                    </linearGradient>

                    <!-- Phone Gradients: Titanium Finish -->
                    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#1A1A1A" />
                        <stop offset="15%" stop-color="#3A3A3A" /> <!-- Rim Light -->
                        <stop offset="50%" stop-color="#0D0D0D" />
                        <stop offset="100%" stop-color="#000000" />
                    </linearGradient>
                    
                    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#15151A" />
                        <stop offset="100%" stop-color="#050508" />
                    </linearGradient>

                    <!-- Glass Reflection -->
                    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="white" stop-opacity="0.15" />
                        <stop offset="30%" stop-color="white" stop-opacity="0.02" />
                        <stop offset="100%" stop-color="white" stop-opacity="0" />
                    </linearGradient>

                    <!-- Filters -->
                    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
                        <feGaussianBlur stdDeviation="8" result="blur" />
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.6"/>
                        </feComponentTransfer>
                        <feOffset dx="2" dy="8" />
                        <feMerge>
                            <feMergeNode/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                    
                    <filter id="skinBlur">
                        <feGaussianBlur stdDeviation="1.5" />
                    </filter>

                    <clipPath id="phoneClip">
                        <rect x="180" y="120" width="180" height="500" rx="24" />
                    </clipPath>
                    
                    <clipPath id="screenClip">
                        <rect x="184" y="124" width="172" height="492" rx="20" />
                    </clipPath>
                </defs>

                <!-- Background Depth -->
                <circle cx="250" cy="400" r="250" fill="#E5E3DD" opacity="0.5" filter="blur(60px)" />

                <g id="scene" transform="translate(0, 0)">
                    
                    <!-- 1. The Hand - Back Layer (Fingers wrapping around right edge) -->
                    <g id="fingers-back" filter="url(#skinBlur)">
                        <!-- Index Finger -->
                        <path d="M330,220 C370,200 410,210 410,250 C410,290 370,310 350,300 C340,290 340,260 330,220 Z" fill="url(#skinGradient)" />
                        <!-- Index Joint Shadow -->
                        <path d="M350,300 C370,290 390,260 380,230 C370,240 350,260 340,280 Z" fill="#A66D50" opacity="0.7" />

                        <!-- Middle Finger -->
                        <path d="M320,270 C360,260 400,270 400,310 C400,350 360,370 340,360 C330,350 320,320 320,270 Z" fill="url(#skinGradient)" />
                        <path d="M340,360 C360,350 380,320 370,290 C360,300 340,320 330,340 Z" fill="#A66D50" opacity="0.7" />

                        <!-- Ring Finger -->
                        <path d="M310,320 C350,320 390,330 380,370 C370,410 330,430 310,420 C300,410 300,380 310,320 Z" fill="url(#skinGradient)" />
                        <path d="M310,420 C330,410 350,380 340,350 C330,360 310,380 300,400 Z" fill="#A66D50" opacity="0.7" />

                        <!-- Pinky Finger -->
                        <path d="M300,370 C340,380 370,390 360,430 C350,470 310,490 290,480 C280,470 280,440 300,370 Z" fill="url(#skinGradient)" />
                    </g>

                    <!-- 2. The Smartphone -->
                    <g id="phone">
                        <!-- Main Body (Titanium) -->
                        <rect x="180" y="120" width="180" height="500" rx="24" fill="url(#metalGradient)" />
                        
                        <!-- Screen Area -->
                        <rect x="184" y="124" width="172" height="492" rx="20" fill="url(#screenGradient)" />

                        <!-- Screen Content (Abstract UI) -->
                        <g clip-path="url(#screenClip)">
                            <!-- Wallpaper Abstract -->
                            <path d="M180,350 Q250,250 400,450 L400,650 L180,650 Z" fill="#111" opacity="0.4" />
                            <path d="M180,400 Q250,350 400,500 L400,650 L180,650 Z" fill="#1A1A1A" opacity="0.5" />
                            
                            <!-- UI Cards -->
                            <rect x="200" y="180" width="140" height="90" rx="12" fill="#FFFFFF" opacity="0.06" />
                            <rect x="200" y="290" width="140" height="160" rx="12" fill="#FFFFFF" opacity="0.03" />
                            
                            <!-- Notification Dot -->
                            <circle cx="320" cy="160" r="4" fill="#FF5252" />

                            <!-- Glossy Reflection (Glass) -->
                            <path d="M180,120 L360,120 L360,300 L180,500 Z" fill="url(#glassReflection)" />
                        </g>

                        <!-- Speaker/Camera Island -->
                        <rect x="240" y="132" width="60" height="6" rx="3" fill="#050505" />
                    </g>

                    <!-- 3. The Hand - Front Layer (Thumb & Palm) -->
                    <g id="palm-thumb" class="interactive-part">
                        
                        <!-- Wrist/Palm Base -->
                        <path d="M160,550 C140,650 150,750 180,850 L320,850 C330,750 340,650 320,550 Z" fill="url(#palmGradient)" />
                        <!-- Palm Creases (More organic) -->
                        <path d="M170,600 Q210,630 250,590" fill="none" stroke="#8A5538" stroke-width="2.5" opacity="0.4" stroke-linecap="round" />
                        <path d="M160,700 Q190,730 230,710" fill="none" stroke="#8A5538" stroke-width="2.5" opacity="0.4" stroke-linecap="round" />
                        <path d="M220,550 Q240,600 230,650" fill="none" stroke="#8A5538" stroke-width="1.5" opacity="0.3" stroke-linecap="round" />

                        <!-- The Thumb (Detailed Anatomy) -->
                        <!-- Proximal Phalanx -->
                        <path d="M290,560 C330,540 360,490 370,440 C380,390 350,380 330,410 C310,440 290,490 270,520 Z" fill="url(#thumbGradient)" />
                        
                        <!-- Interphalangeal Joint (The bend) -->
                        <path d="M340,420 C360,410 370,430 360,450 C350,470 330,470 320,450 Z" fill="#9E6847" opacity="0.8" />
                        
                        <!-- Distal Phalanx (Tip) -->
                        <path d="M330,410 C350,380 370,360 360,340 C350,320 330,340 320,370 Z" fill="url(#thumbGradient)" />

                        <!-- Nail Bed -->
                        <path d="M358,345 C365,335 375,345 365,360 C355,370 350,360 358,345 Z" fill="#F5D0B5" opacity="0.9" />
                        <!-- Nail Highlight -->
                        <path d="M360,348 C363,343 370,348 365,355" fill="none" stroke="white" stroke-width="1" opacity="0.6" />

                        <!-- Contact Shadow (Thumb pressing into phone) -->
                        <!-- This creates the 3D effect of pressing -->
                        <path d="M290,440 C320,420 350,430 360,460 C370,490 340,520 300,520 Z" fill="#000" opacity="0.3" filter="url(#softShadow)" style="mix-blend-mode: multiply;" />
                    </g>

                    <!-- 4. Highlights & Polish -->
                    <!-- Light rim on fingers -->
                    <path d="M340,240 C370,220 390,230 400,250" fill="none" stroke="#F4D0B8" stroke-width="2" opacity="0.5" />
                    <path d="M330,290 C360,280 380,290 390,310" fill="none" stroke="#F4D0B8" stroke-width="2" opacity="0.5" />
                    
                    <!-- Phone Edge Highlight -->
                    <path d="M182,140 L182,600" stroke="white" stroke-width="1.5" opacity="0.25" />
                    <path d="M358,140 L358,600" stroke="white" stroke-width="0.5" opacity="0.1" />

                </g>
            </svg>
        </div>
    </main>

    <div class="hint">
        <span>Move cursor to interact</span>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const svgElement = document.querySelector('svg');
        const thumbGroup = document.getElementById('palm-thumb');
        const textBlock = document.querySelector('.text-block');
        
        const onMouseMove = (e) => {
            const { innerWidth, innerHeight } = window;
            const x = (e.clientX - innerWidth / 2) / innerWidth;
            const y = (e.clientY - innerHeight / 2) / innerHeight;

            // 1. Parallax for SVG (3D Tilt)
            const rotateY = x * 12;
            const rotateX = y * -12;
            
            svgElement.style.transform = `perspective(1200px) rotateY(${rotateY}deg) rotateX(${rotateX}deg) scale(1.03)`;

            // 2. Thumb Interaction (Simulate breathing/grip)
            if(thumbGroup) {
                const thumbX = x * -15;
                const thumbY = y * -15;
                thumbGroup.style.transform = `translate(${thumbX}px, ${thumbY}px)`;
            }

            // 3. Text Parallax
            if(textBlock) {
                textBlock.style.transform = `translate(${x * -20}px, ${y * -20}px)`;
            }
        };

        const onMouseLeave = () => {
            svgElement.style.transform = `perspective(1200px) rotateY(0deg) rotateX(0deg) scale(1)`;
            if(thumbGroup) thumbGroup.style.transform = `translate(0px, 0px)`;
            if(textBlock) textBlock.style.transform = `translate(0px, 0px)`;
        };

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseleave', onMouseLeave);
    });
</script>
</body>
</html>
