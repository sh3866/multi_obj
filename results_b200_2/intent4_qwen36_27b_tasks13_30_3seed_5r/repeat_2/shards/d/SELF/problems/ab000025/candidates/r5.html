<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactile Reality | Editorial Illustration</title>
<style>
    :root {
        --bg: #EBEAE6;
        --text: #1A1A1A;
        --text-muted: #666666;
        --font-display: "Helvetica Neue", "Arial Black", sans-serif;
        --font-body: "Helvetica Neue", "Helvetica", Arial, sans-serif;
        --font-mono: "Menlo", "Consolas", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
        -webkit-font-smoothing: antialiased;
    }

    /* High-End Noise Overlay */
    .grain {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 10;
        opacity: 0.04;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* UI Layout */
    header {
        padding: 4rem 5rem;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        z-index: 5;
    }

    h1 {
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        color: var(--text);
    }

    .meta {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: var(--text-muted);
        text-align: right;
        line-height: 1.6;
        letter-spacing: 0.05em;
    }

    main {
        flex: 1;
        display: flex;
        position: relative;
        overflow: hidden;
        align-items: center;
    }

    /* Typography Layout */
    .text-block {
        width: 40%;
        padding-left: 8vw;
        z-index: 2;
        position: relative;
    }

    .big-type {
        font-family: var(--font-display);
        font-size: 6.5vw;
        line-height: 0.95;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: var(--text);
        text-transform: uppercase;
        position: relative;
        margin-bottom: 2.5rem;
    }
    
    .big-type span {
        display: block;
    }

    .sub-type {
        font-size: 1.15rem;
        font-weight: 400;
        max-width: 320px;
        line-height: 1.65;
        color: var(--text);
        opacity: 0.85;
    }

    /* The SVG Container */
    .art-stage {
        flex: 1;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    svg {
        height: 92vh;
        width: auto;
        transition: transform 0.1s ease-out;
        transform-style: preserve-3d;
    }

    /* Interactive Hint */
    .hint {
        position: absolute;
        bottom: 3.5rem;
        right: 5rem;
        font-family: var(--font-mono);
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 1rem;
        letter-spacing: 0.1em;
        z-index: 5;
    }
    .hint::before {
        content: '';
        width: 40px;
        height: 1px;
        background: var(--text-muted);
    }

    /* Responsive adjustments */
    @media (max-width: 900px) {
        body { overflow-y: auto; height: auto; }
        header, .hint { padding: 1.5rem; }
        main { flex-direction: column; height: auto; padding-top: 2rem;}
        .text-block { width: 100%; padding: 0 2rem; align-items: center; text-align: center; margin-bottom: 2rem;}
        .art-stage { width: 100%; height: 50vh; }
        .big-type { font-size: 14vw; }
        svg { height: 100%; }
        .sub-type { margin: 1.5rem auto 0; }
    }
</style>
</head>
<body>

    <div class="grain"></div>

    <header>
        <h1>Anatomy of Interaction</h1>
        <div class="meta">
            FIG. 04 — CLOSE UP<br>
            RENDER: VECTOR/SVG<br>
            SCALE: 1:1
        </div>
    </header>

    <main>
        <div class="text-block">
            <div class="big-type">
                <span>Tactile</span>
                <span>Reality</span>
            </div>
            <p class="sub-type">
                The intersection of biological intent and digital response. A study in grip, pressure, and the warmth of the hand against cold glass.
            </p>
        </div>

        <div class="art-stage">
            <!-- SVG Illustration Start -->
            <svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Skin Gradients: Complex layering for subsurface scattering -->
                    <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#F2C5A8" /> 
                        <stop offset="50%" stop-color="#E0AC8F" /> 
                        <stop offset="100%" stop-color="#B87D5C" /> 
                    </linearGradient>
                    
                    <linearGradient id="skinShadow" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#8D5535" stop-opacity="0.6"/>
                        <stop offset="100%" stop-color="#8D5535" stop-opacity="0"/>
                    </linearGradient>

                    <radialGradient id="fingerPad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#F5D0B8" />
                        <stop offset="80%" stop-color="#D99E7D" />
                        <stop offset="100%" stop-color="#B87D5C" />
                    </radialGradient>

                    <!-- Phone Gradients: Premium Titanium -->
                    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#2A2A2A" />
                        <stop offset="10%" stop-color="#4A4A4A" /> 
                        <stop offset="50%" stop-color="#151515" />
                        <stop offset="100%" stop-color="#000000" />
                    </linearGradient>
                    
                    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#1C1C21" />
                        <stop offset="100%" stop-color="#08080A" />
                    </linearGradient>

                    <!-- Glass Reflections -->
                    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="white" stop-opacity="0.12" />
                        <stop offset="35%" stop-color="white" stop-opacity="0.01" />
                        <stop offset="100%" stop-color="white" stop-opacity="0" />
                    </linearGradient>

                    <linearGradient id="edgeLight" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="white" stop-opacity="0.1" />
                        <stop offset="50%" stop-color="white" stop-opacity="0.5" />
                        <stop offset="100%" stop-color="white" stop-opacity="0.1" />
                    </linearGradient>

                    <!-- Filters -->
                    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="6" result="blur" />
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.5"/>
                        </feComponentTransfer>
                        <feOffset dx="4" dy="12" />
                        <feMerge>
                            <feMergeNode/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                    
                    <filter id="blurSkin">
                        <feGaussianBlur stdDeviation="2" />
                    </filter>

                    <filter id="blurScreen">
                        <feGaussianBlur stdDeviation="8" />
                    </filter>

                    <!-- Clipping Paths -->
                    <clipPath id="phoneClip">
                        <rect x="200" y="100" width="160" height="600" rx="24" />
                    </clipPath>
                    
                    <clipPath id="screenClip">
                        <rect x="204" y="104" width="152" height="592" rx="20" />
                    </clipPath>
                </defs>

                <!-- Background Depth -->
                <circle cx="300" cy="400" r="300" fill="#E5E3DD" opacity="0.4" filter="blur(80px)" />

                <g id="scene" transform="translate(0, 0)">
                    
                    <!-- 1. The Hand - Back Layer (Fingers wrapping around right edge) -->
                    <g id="fingers-back" filter="url(#blurSkin)">
                        
                        <!-- Index Finger (Top) -->
                        <g transform="translate(350, 250)">
                            <path d="M0,0 C40,-20 80,-10 80,40 C80,90 40,100 10,90 C-10,80 -10,40 0,0 Z" fill="url(#skinBase)" />
                            <path d="M20,40 Q50,40 60,70" fill="none" stroke="#8D5535" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
                        </g>

                        <!-- Middle Finger -->
                        <g transform="translate(355, 340)">
                            <path d="M0,0 C40,-10 90,0 90,50 C90,100 50,110 10,100 C-10,90 -10,50 0,0 Z" fill="url(#skinBase)" />
                            <path d="M25,50 Q55,50 65,80" fill="none" stroke="#8D5535" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
                        </g>

                        <!-- Ring Finger -->
                        <g transform="translate(345, 430)">
                            <path d="M0,0 C35,0 85,10 80,60 C75,110 35,120 5,110 C-15,100 -10,60 0,0 Z" fill="url(#skinBase)" />
                            <path d="M20,50 Q50,50 60,80" fill="none" stroke="#8D5535" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
                        </g>

                        <!-- Pinky Finger (Bottom) -->
                        <g transform="translate(330, 520)">
                            <path d="M0,0 C30,10 60,20 60,70 C60,120 20,130 -5,120 C-25,110 -20,70 0,0 Z" fill="url(#skinBase)" />
                        </g>
                    </g>

                    <!-- 2. The Smartphone -->
                    <g id="phone">
                        <!-- Main Body (Titanium) -->
                        <rect x="200" y="100" width="160" height="600" rx="24" fill="url(#metalGradient)" />
                        
                        <!-- Screen Area -->
                        <rect x="204" y="104" width="152" height="592" rx="20" fill="url(#screenGradient)" />

                        <!-- Screen Content (Abstract UI - Blurred) -->
                        <g clip-path="url(#screenClip)">
                            <!-- Wallpaper Abstract -->
                            <path d="M200,350 Q300,250 400,450 L400,650 L200,650 Z" fill="#222" opacity="0.5" filter="url(#blurScreen)" />
                            <path d="M200,400 Q300,350 400,500 L400,650 L200,650 Z" fill="#111" opacity="0.6" filter="url(#blurScreen)" />
                            
                            <!-- UI Cards -->
                            <rect x="220" y="250" width="112" height="80" rx="12" fill="#FFFFFF" opacity="0.04" />
                            <rect x="220" y="350" width="112" height="160" rx="12" fill="#FFFFFF" opacity="0.02" />
                            
                            <!-- Notification Dot -->
                            <circle cx="330" cy="140" r="3.5" fill="#FF453A" />

                            <!-- Glossy Reflection (Glass) -->
                            <path d="M200,100 L360,100 L360,350 L200,550 Z" fill="url(#glassReflection)" />
                        </g>

                        <!-- Speaker/Camera Island -->
                        <rect x="250" y="118" width="60" height="6" rx="3" fill="#050505" />
                    </g>

                    <!-- 3. The Hand - Front Layer (Thumb & Palm) -->
                    <g id="palm-thumb" class="interactive-part">
                        
                        <!-- Wrist/Palm Base -->
                        <path d="M180,650 C160,750 170,850 200,950 L350,950 C360,850 370,750 350,650 Z" fill="url(#skinBase)" />
                        
                        <!-- Palm Creases (Organic lines) -->
                        <path d="M190,700 Q230,730 270,690" fill="none" stroke="#8D5535" stroke-width="2" opacity="0.3" stroke-linecap="round" filter="url(#blurSkin)" />
                        <path d="M180,800 Q210,830 250,810" fill="none" stroke="#8D5535" stroke-width="2" opacity="0.3" stroke-linecap="round" filter="url(#blurSkin)" />

                        <!-- The Thumb (Detailed Anatomy) -->
                        <g transform="translate(0,0)">
                            <!-- Proximal Phalanx -->
                            <path d="M280,580 C320,560 350,510 360,460 C370,410 340,400 320,430 C300,460 280,510 260,540 Z" fill="url(#skinBase)" />
                            
                            <!-- Interphalangeal Joint (The bend) -->
                            <path d="M330,440 C350,430 360,450 350,470 C340,490 320,490 310,470 Z" fill="#9E6847" opacity="0.6" filter="url(#blurSkin)" />
                            
                            <!-- Distal Phalanx (Tip) -->
                            <path d="M320,430 C340,400 360,380 350,360 C340,340 320,360 310,390 Z" fill="url(#skinBase)" />

                            <!-- Nail Bed -->
                            <path d="M348,365 C355,355 365,365 355,380 C345,390 340,380 348,365 Z" fill="#F5D0B5" opacity="0.95" />
                            <!-- Nail Highlight -->
                            <path d="M350,368 C353,363 360,368 355,375" fill="none" stroke="white" stroke-width="1.5" opacity="0.7" />

                            <!-- Contact Shadow (Thumb pressing into phone) -->
                            <!-- This creates the 3D effect of pressing -->
                            <path d="M280,460 C310,440 340,450 350,480 C360,510 330,540 290,540 Z" fill="#000" opacity="0.25" filter="url(#softShadow)" style="mix-blend-mode: multiply;" />
                        </g>
                    </g>

                    <!-- 4. Highlights & Polish -->
                    <!-- Light rim on fingers -->
                    <path d="M360,270 C390,250 410,260 420,280" fill="none" stroke="#F4D0B8" stroke-width="2" opacity="0.6" filter="url(#blurSkin)" />
                    <path d="M365,360 C395,350 415,360 425,380" fill="none" stroke="#F4D0B8" stroke-width="2" opacity="0.6" filter="url(#blurSkin)" />
                    
                    <!-- Phone Edge Highlight -->
                    <path d="M202,120 L202,680" stroke="white" stroke-width="1.5" opacity="0.2" />
                    <path d="M358,120 L358,680" stroke="white" stroke-width="0.5" opacity="0.1" />

                </g>
            </svg>
        </div>
    </main>

    <div class="hint">
        <span>Move cursor to interact</span>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const svgElement = document.querySelector('svg');
        const thumbGroup = document.getElementById('palm-thumb');
        const textBlock = document.querySelector('.text-block');
        
        const onMouseMove = (e) => {
            const { innerWidth, innerHeight } = window;
            const x = (e.clientX - innerWidth / 2) / innerWidth;
            const y = (e.clientY - innerHeight / 2) / innerHeight;

            // 1. Parallax for SVG (3D Tilt)
            const rotateY = x * 10;
            const rotateX = y * -10;
            
            svgElement.style.transform = `perspective(1200px) rotateY(${rotateY}deg) rotateX(${rotateX}deg) scale(1.02)`;

            // 2. Thumb Interaction (Simulate breathing/grip)
            if(thumbGroup) {
                const thumbX = x * -12;
                const thumbY = y * -12;
                thumbGroup.style.transform = `translate(${thumbX}px, ${thumbY}px)`;
            }

            // 3. Text Parallax
            if(textBlock) {
                textBlock.style.transform = `translate(${x * -15}px, ${y * -15}px)`;
            }
        };

        const onMouseLeave = () => {
            svgElement.style.transform = `perspective(1200px) rotateY(0deg) rotateX(0deg) scale(1)`;
            if(thumbGroup) thumbGroup.style.transform = `translate(0px, 0px)`;
            if(textBlock) textBlock.style.transform = `translate(0px, 0px)`;
        };

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseleave', onMouseLeave);
    });
</script>
</body>
</html>
