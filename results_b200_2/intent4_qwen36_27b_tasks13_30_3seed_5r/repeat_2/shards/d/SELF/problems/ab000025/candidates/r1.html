<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactile Reality | Editorial Illustration</title>
<style>
    :root {
        --bg: #EBEAE6;
        --text: #222222;
        --text-muted: #666666;
        --font-display: "Helvetica Neue", "Arial Black", sans-serif;
        --font-body: "Helvetica Neue", "Helvetica", Arial, sans-serif;
        --font-mono: "Menlo", "Consolas", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    /* High-End Noise Overlay */
    .grain {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 10;
        opacity: 0.06;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* UI Layout */
    header {
        padding: 2.5rem 4rem;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        z-index: 5;
    }

    h1 {
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        color: var(--text);
    }

    .meta {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: var(--text-muted);
        text-align: right;
        line-height: 1.5;
        letter-spacing: 0.05em;
    }

    main {
        flex: 1;
        display: flex;
        position: relative;
        overflow: hidden;
    }

    /* Typography Layout - Editorial Style */
    .text-block {
        width: 50%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-left: 6vw;
        z-index: 2;
        position: relative;
    }

    .big-type {
        font-family: var(--font-display);
        font-size: 9vw;
        line-height: 0.85;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: var(--text);
        text-transform: uppercase;
        mix-blend-mode: multiply;
        position: relative;
    }
    
    .big-type span {
        display: block;
    }

    .sub-type {
        font-size: 1.1rem;
        font-weight: 400;
        margin-top: 2rem;
        max-width: 320px;
        line-height: 1.4;
        color: var(--text);
    }

    /* The SVG Container */
    .art-stage {
        width: 50%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    svg {
        height: 85vh;
        width: auto;
        /* Sophisticated shadow for depth */
        filter: drop-shadow(0 30px 60px rgba(0,0,0,0.25));
        transition: transform 0.15s ease-out;
        transform-style: preserve-3d;
    }

    /* Interactive Hint */
    .hint {
        position: absolute;
        bottom: 3rem;
        right: 4rem;
        font-family: var(--font-mono);
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 1rem;
        letter-spacing: 0.1em;
        z-index: 5;
    }
    .hint::before {
        content: '';
        width: 30px;
        height: 1px;
        background: var(--text-muted);
    }

    /* SVG Specifics */
    .skin-highlight { fill: #F4D0B8; }
    .skin-base { fill: #DCA787; }
    .skin-shadow { fill: #A66D50; }
    .skin-dark { fill: #7A4F34; }
    
    .phone-metal { fill: url(#metalGradient); }
    .screen-dark { fill: url(#screenGradient); }
    
    /* Animation classes */
    .interactive-part { transition: transform 0.2s cubic-bezier(0.25, 0.1, 0.25, 1); }

    /* Responsive adjustments */
    @media (max-width: 900px) {
        body { overflow-y: auto; height: auto; }
        header, .hint { padding: 1.5rem; }
        main { flex-direction: column; height: auto; padding-top: 2rem;}
        .text-block { width: 100%; padding: 0 2rem; align-items: center; text-align: center; margin-bottom: 2rem;}
        .art-stage { width: 100%; height: 50vh; }
        .big-type { font-size: 15vw; }
        svg { height: 100%; }
        .sub-type { margin: 1.5rem auto 0; }
    }
</style>
</head>
<body>

    <div class="grain"></div>

    <header>
        <h1>Anatomy of Interaction</h1>
        <div class="meta">
            FIG. 04 — CLOSE UP<br>
            RENDER: VECTOR/SVG<br>
            SCALE: 1:1
        </div>
    </header>

    <main>
        <div class="text-block">
            <div class="big-type">
                <span>Tactile</span>
                <span>Reality</span>
            </div>
            <p class="sub-type">
                The intersection of biological intent and digital response. A study in grip, pressure, and the warmth of the hand against cold glass.
            </p>
        </div>

        <div class="art-stage">
            <!-- SVG Illustration Start -->
            <svg viewBox="0 0 500 750" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Skin Gradients -->
                    <linearGradient id="skinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#F2C3A3" /> <!-- Highlight -->
                        <stop offset="60%" stop-color="#DCA787" /> <!-- Base -->
                        <stop offset="100%" stop-color="#A66D50" /> <!-- Shadow -->
                    </linearGradient>
                    
                    <radialGradient id="thumbPad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#EAB59A" />
                        <stop offset="100%" stop-color="#C68E68" />
                    </radialGradient>

                    <!-- Phone Gradients -->
                    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#2A2A2A" />
                        <stop offset="20%" stop-color="#444444" /> <!-- Rim Light -->
                        <stop offset="50%" stop-color="#111111" />
                        <stop offset="100%" stop-color="#050505" />
                    </linearGradient>
                    
                    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#2A2A35" />
                        <stop offset="40%" stop-color="#1A1A20" />
                        <stop offset="100%" stop-color="#050508" />
                    </linearGradient>

                    <!-- Glass Reflection Gradient -->
                    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="white" stop-opacity="0.15" />
                        <stop offset="50%" stop-color="white" stop-opacity="0.02" />
                        <stop offset="100%" stop-color="white" stop-opacity="0" />
                    </linearGradient>

                    <!-- Filters -->
                    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="8" result="blur" />
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.6"/>
                        </feComponentTransfer>
                        <feOffset dx="5" dy="10" />
                        <feMerge>
                            <feMergeNode/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                    
                    <filter id="skinBlur">
                        <feGaussianBlur stdDeviation="1.5" />
                    </filter>

                    <clipPath id="phoneClip">
                        <rect x="180" y="100" width="200" height="480" rx="24" />
                    </clipPath>
                </defs>

                <!-- 1. Background Elements (Abstract Depth) -->
                <circle cx="250" cy="350" r="220" fill="#E0DED8" opacity="0.4" filter="blur(40px)" />

                <g id="scene" transform="translate(0, 0)">
                    
                    <!-- 2. The Hand - Back Layer (Fingers wrapping around) -->
                    <!-- Using organic curves for anatomy -->
                    <g id="fingers-back" filter="url(#skinBlur)">
                        <!-- Index Finger (Top) -->
                        <path d="M260,180 C300,160 340,170 350,200 C360,230 330,260 310,270 C290,280 280,250 280,220 Z" class="skin-base" />
                        <!-- Index Joint Shadow -->
                        <path d="M310,270 C330,260 350,230 340,200 C330,210 310,230 300,250 Z" class="skin-shadow" opacity="0.6" />

                        <!-- Middle Finger -->
                        <path d="M250,220 C290,210 330,220 340,250 C350,280 320,310 300,320 C280,330 270,300 270,260 Z" class="skin-base" />
                        <path d="M300,320 C320,310 340,280 330,250 C320,260 300,280 290,300 Z" class="skin-shadow" opacity="0.6" />

                        <!-- Ring Finger -->
                        <path d="M240,260 C280,260 320,270 320,300 C320,330 290,360 270,370 C250,380 250,350 250,310 Z" class="skin-base" />
                        <path d="M270,370 C290,360 310,330 300,300 C290,310 270,330 260,350 Z" class="skin-shadow" opacity="0.6" />

                        <!-- Pinky Finger (Bottom) -->
                        <path d="M230,300 C270,310 300,320 300,350 C300,380 270,410 250,420 C230,430 230,400 230,360 Z" class="skin-base" />
                    </g>

                    <!-- 3. The Smartphone -->
                    <g id="phone">
                        <!-- Main Body (Titanium/Metal) -->
                        <rect x="180" y="100" width="200" height="480" rx="24" class="phone-metal" />
                        
                        <!-- Inner Bezel -->
                        <rect x="184" y="104" width="192" height="472" rx="20" fill="#000" />
                        
                        <!-- Screen Area -->
                        <rect x="184" y="104" width="192" height="472" rx="20" class="screen-dark" />

                        <!-- Screen Content (Abstract UI) -->
                        <g clip-path="url(#phoneClip)">
                            <!-- Wallpaper Abstract -->
                            <path d="M180,300 Q250,200 380,400 L380,600 L180,600 Z" fill="#111" opacity="0.5" />
                            
                            <!-- UI Cards -->
                            <rect x="200" y="160" width="160" height="100" rx="12" fill="#FFFFFF" opacity="0.08" />
                            <rect x="200" y="280" width="160" height="80" rx="12" fill="#FFFFFF" opacity="0.05" />
                            
                            <!-- Notification Dot -->
                            <circle cx="340" cy="140" r="4" fill="#FF5252" />

                            <!-- Glossy Reflection (Glass) -->
                            <path d="M180,100 L380,100 L380,250 L180,450 Z" fill="url(#glassReflection)" />
                        </g>

                        <!-- Speaker/Camera Island -->
                        <rect x="250" y="112" width="60" height="6" rx="3" fill="#050505" />
                    </g>

                    <!-- 4. The Hand - Front Layer (Thumb & Palm) -->
                    <!-- This is the primary interaction point -->
                    <g id="palm-thumb" class="interactive-part">
                        
                        <!-- Wrist/Palm Base -->
                        <path d="M160,500 C140,600 150,700 180,800 L320,800 C330,700 340,600 320,500 Z" class="skin-base" />
                        <!-- Palm Creases -->
                        <path d="M160,550 Q200,580 240,540" fill="none" stroke="#A66D50" stroke-width="2" opacity="0.5" stroke-linecap="round" />
                        <path d="M150,650 Q180,680 220,660" fill="none" stroke="#A66D50" stroke-width="2" opacity="0.5" stroke-linecap="round" />

                        <!-- The Thumb (Detailed Anatomy) -->
                        <!-- Proximal Phalanx -->
                        <path d="M280,520 C320,500 350,450 360,400 C370,350 340,340 320,370 C300,400 280,450 260,480 Z" class="skin-base" />
                        
                        <!-- Interphalangeal Joint (The bend) -->
                        <path d="M330,380 C350,370 360,390 350,410 C340,430 320,430 310,410 Z" class="skin-shadow" opacity="0.8" />
                        
                        <!-- Distal Phalanx (Tip) -->
                        <path d="M320,370 C340,340 360,320 350,300 C340,280 320,300 310,330 Z" class="skin-base" />

                        <!-- Nail Bed -->
                        <path d="M348,305 C355,295 365,305 355,320 C345,330 340,320 348,305 Z" fill="#F5D0B5" opacity="0.9" />
                        <!-- Nail Highlight -->
                        <path d="M350,308 C353,303 360,308 355,315" fill="none" stroke="white" stroke-width="1" opacity="0.5" />

                        <!-- Contact Shadow (Thumb pressing into phone) -->
                        <!-- This creates the 3D effect of pressing -->
                        <path d="M280,400 C310,380 340,390 350,420 C360,450 330,480 290,480 Z" fill="#000" opacity="0.4" filter="url(#softShadow)" style="mix-blend-mode: multiply;" />
                    </g>

                    <!-- 5. Highlights & Polish -->
                    <!-- Light rim on fingers -->
                    <path d="M280,200 C310,180 330,190 340,210" fill="none" stroke="#F4D0B8" stroke-width="1.5" opacity="0.6" />
                    <path d="M260,220 C290,210 310,220 320,240" fill="none" stroke="#F4D0B8" stroke-width="1.5" opacity="0.6" />
                    
                    <!-- Phone Edge Highlight -->
                    <path d="M182,120 L182,560" stroke="white" stroke-width="1" opacity="0.2" />

                </g>
            </svg>
        </div>
    </main>

    <div class="hint">
        <span>Move cursor to interact</span>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const svgElement = document.querySelector('svg');
        const thumbGroup = document.getElementById('palm-thumb');
        const textBlock = document.querySelector('.text-block');
        
        // State
        let bounds;

        const onMouseMove = (e) => {
            const { innerWidth, innerHeight } = window;
            const x = (e.clientX - innerWidth / 2) / innerWidth;
            const y = (e.clientY - innerHeight / 2) / innerHeight;

            // 1. Parallax for SVG (3D Tilt)
            // Rotate slightly based on mouse position
            const rotateY = x * 10; // Max 10deg rotation
            const rotateX = y * -10; // Max 10deg rotation
            
            svgElement.style.transform = `perspective(1000px) rotateY(${rotateY}deg) rotateX(${rotateX}deg) scale(1.02)`;

            // 2. Thumb Interaction (Simulate breathing/grip)
            // Move thumb slightly opposite to tilt for depth
            if(thumbGroup) {
                const thumbX = x * -10;
                const thumbY = y * -10;
                thumbGroup.style.transform = `translate(${thumbX}px, ${thumbY}px)`;
            }

            // 3. Text Parallax (Subtle)
            if(textBlock) {
                textBlock.style.transform = `translate(${x * -15}px, ${y * -15}px)`;
            }
        };

        const onMouseLeave = () => {
            svgElement.style.transform = `perspective(1000px) rotateY(0deg) rotateX(0deg) scale(1)`;
            if(thumbGroup) thumbGroup.style.transform = `translate(0px, 0px)`;
            if(textBlock) textBlock.style.transform = `translate(0px, 0px)`;
        };

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseleave', onMouseLeave);
    });
</script>
</body>
</html>
