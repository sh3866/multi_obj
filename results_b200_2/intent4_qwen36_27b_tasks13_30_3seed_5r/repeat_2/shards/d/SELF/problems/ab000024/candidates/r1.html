<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura | The Modern Flush</title>
<style>
    :root {
        --bg-color: #F2F0EB;
        --bg-accent: #E8E5DF;
        --text-main: #1C1C1C;
        --text-muted: #666666;
        --accent: #111111;
        --highlight: #FFFFFF;
        --ceramic-base: #F5F5F7;
        --ceramic-shadow: #D1D5DB;
        --water-surface: #E0F2FE;
        --water-depth: #7DD3FC;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* Layout */
    .container {
        display: grid;
        grid-template-columns: 1fr 1.2fr;
        height: 100%;
        width: 100%;
        position: relative;
    }

    /* Left Side: Content */
    .content-side {
        padding: 5rem 4rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        z-index: 10;
    }

    h1 {
        font-size: 4.5rem;
        font-weight: 400;
        letter-spacing: -0.03em;
        line-height: 0.95;
        margin-bottom: 2rem;
        color: var(--accent);
    }

    h1 span {
        font-weight: 700;
        display: block;
    }

    .tagline {
        font-size: 1.15rem;
        line-height: 1.6;
        color: var(--text-muted);
        max-width: 420px;
        margin-bottom: 3.5rem;
        padding-left: 1.5rem;
        border-left: 1px solid var(--text-muted);
    }

    .features {
        display: flex;
        gap: 3rem;
        margin-bottom: 4rem;
    }

    .feature-item h3 {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: 0.5rem;
        color: var(--text-main);
    }

    .feature-item p {
        font-size: 0.95rem;
        color: var(--text-muted);
        font-weight: 400;
    }

    /* Flush Button */
    .flush-btn {
        display: inline-flex;
        align-items: center;
        gap: 1.2rem;
        background: var(--accent);
        color: white;
        border: none;
        padding: 1.2rem 3rem;
        font-size: 0.9rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        width: fit-content;
        border-radius: 2px;
    }

    .flush-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    .flush-btn:active {
        transform: translateY(0);
        box-shadow: none;
    }

    .flush-btn svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
        transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .flush-btn:hover svg {
        transform: rotate(180deg);
    }

    /* Right Side: Visual Stage */
    .visual-side {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 60% 60%, #FFFFFF 0%, var(--bg-color) 70%);
        overflow: hidden;
    }

    /* Background Decor */
    .bg-circle {
        position: absolute;
        border-radius: 50%;
        background: var(--bg-accent);
        opacity: 0.6;
        z-index: 1;
    }
    .bg-c-1 { width: 600px; height: 600px; right: -150px; top: 50%; transform: translateY(-50%); }
    .bg-c-2 { width: 250px; height: 250px; left: 10%; bottom: 10%; opacity: 0.4; }

    /* SVG Stage */
    .product-stage {
        width: 90%;
        height: 85%;
        position: relative;
        z-index: 2;
        /* Ground shadow */
        filter: drop-shadow(0px 50px 30px rgba(0,0,0,0.08));
    }

    /* SVG Styles */
    .ceramic-body { fill: url(#grad-ceramic); stroke: #B0B0B0; stroke-width: 0.5; }
    .ceramic-dark { fill: url(#grad-ceramic-dark); stroke: #999; stroke-width: 0.5; }
    .chrome { fill: url(#grad-chrome); stroke: #888; stroke-width: 0.5; }
    .water { fill: url(#grad-water); opacity: 0.95; }
    .rim { fill: url(#grad-ceramic); stroke: #E5E7EB; stroke-width: 1; }

    /* Animations */
    .water-surface {
        transform-origin: center;
    }
    .splash-particle {
        opacity: 0;
    }

    @keyframes vortex {
        0% { transform: scale(0.1); opacity: 0.2; }
        100% { transform: scale(1.8); opacity: 0; }
    }

    /* Mobile */
    @media (max-width: 900px) {
        .container { grid-template-columns: 1fr; grid-template-rows: 1fr 1.5fr; }
        .content-side { padding: 2rem; order: 2; justify-content: flex-start; }
        .visual-side { order: 1; height: 60vh; }
        h1 { font-size: 3rem; }
        .bg-c-1 { width: 300px; height: 300px; }
    }
</style>
</head>
<body>

<div class="container">
    <div class="content-side">
        <h1>Aura<span>Series 5.</span></h1>
        <div class="tagline">
            Engineered for silence. Sculpted for serenity. 
            The Aura Series 5 combines hydro-dynamic efficiency 
            with a timeless ceramic aesthetic.
        </div>

        <div class="features">
            <div class="feature-item">
                <h3>Hydro-Clean</h3>
                <p>360° rimless spray</p>
            </div>
            <div class="feature-item">
                <h3>Silent Flush</h3>
                <p>Whisper-quiet valve</p>
            </div>
        </div>

        <button class="flush-btn" id="flushTrigger">
            <span>ACTIVATE FLUSH</span>
            <svg viewBox="0 0 24 24">
                <path d="M12,2C12,2 5,10 5,15C5,18.87 8.13,22 12,22C15.87,22 19,18.87 19,15C19,10 12,2 12,2M12,20C9.24,20 7,17.76 7,15C7,12.5 10,7.5 12,4.5C14,7.5 17,12.5 17,15C17,17.76 14.76,20 12,20Z" />
            </svg>
        </button>
    </div>

    <div class="visual-side">
        <div class="bg-circle bg-c-1"></div>
        <div class="bg-circle bg-c-2"></div>

        <svg class="product-stage" viewBox="0 0 600 700" preserveAspectRatio="xMidYMid meet">
            <defs>
                <!-- Gradients -->
                <linearGradient id="grad-ceramic" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#E0E0E0;stop-opacity:1" />
                    <stop offset="15%" style="stop-color:#FFFFFF;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#F9FAFB;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#D1D5DB;stop-opacity:1" />
                </linearGradient>

                <linearGradient id="grad-ceramic-dark" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#9CA3AF;stop-opacity:1" />
                    <stop offset="40%" style="stop-color:#E5E7EB;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#9CA3AF;stop-opacity:1" />
                </linearGradient>

                <linearGradient id="grad-chrome" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#9CA3AF;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#F3F4F6;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#6B7280;stop-opacity:1" />
                </linearGradient>

                <linearGradient id="grad-water" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#BAE6FD;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#7DD3FC;stop-opacity:1" />
                </linearGradient>

                <radialGradient id="vortex-grad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#000;stop-opacity:0.6" />
                    <stop offset="100%" style="stop-color:#000;stop-opacity:0" />
                </radialGradient>
            </defs>

            <!-- Floor Shadow -->
            <ellipse cx="300" cy="650" rx="160" ry="20" fill="#000" opacity="0.12" filter="blur(8px)" />

            <!-- PLUMBING / BASE -->
            <g id="base">
                <!-- Flange -->
                <rect x="270" y="640" width="60" height="8" rx="2" class="chrome" />
                <!-- Bolts -->
                <circle cx="275" cy="644" r="2" fill="#555" />
                <circle cx="325" cy="644" r="2" fill="#555" />
            </g>

            <!-- BOWL INTERIOR -->
            <g id="bowl-inner">
                <!-- Water Surface -->
                <ellipse cx="300" cy="480" rx="130" ry="50" class="water" id="waterSurface" />
                <!-- Vortex (Hidden) -->
                <ellipse cx="300" cy="480" rx="100" ry="35" fill="url(#vortex-grad)" id="vortex" opacity="0" />
                <!-- Splash Particles -->
                <g id="splashGroup">
                    <circle cx="280" cy="460" r="4" fill="#fff" class="splash-particle" />
                    <circle cx="320" cy="450" r="3" fill="#fff" class="splash-particle" />
                    <circle cx="300" cy="440" r="5" fill="#fff" class="splash-particle" />
                    <circle cx="290" cy="490" r="2" fill="#fff" class="splash-particle" />
                </g>
            </g>

            <!-- TANK -->
            <g id="tank">
                <!-- Tank Body -->
                <path d="M200,250 L400,250 C415,250 420,255 420,270 L420,420 C420,435 410,440 400,440 L200,440 C190,440 180,435 180,420 L180,270 C180,255 185,250 200,250 Z" class="ceramic-body" />
                
                <!-- Tank Lid -->
                <path d="M185,245 L415,245 C420,245 425,250 425,255 L425,260 L175,260 L175,255 C175,250 180,245 185,245 Z" class="ceramic-dark" />
                
                <!-- Gloss Highlight -->
                <path d="M195,260 L195,430 C195,435 200,440 205,440" stroke="white" stroke-width="6" fill="none" opacity="0.6" stroke-linecap="round" filter="blur(1px)"/>

                <!-- Flush Button -->
                <rect x="280" y="240" width="40" height="8" rx="2" class="chrome" />
                <circle cx="300" cy="235" r="12" class="chrome" id="flushButtonVisual" />
                <circle cx="300" cy="235" r="10" fill="#E5E7EB" />
            </g>

            <!-- BOWL EXTERIOR -->
            <g id="bowl-outer">
                <!-- Main Shell -->
                <path d="M170,480 C170,600 210,640 300,640 C390,640 430,600 430,480 L430,420 C430,410 420,400 400,400 L200,400 C180,400 170,410 170,420 Z" class="ceramic-body" />
                
                <!-- Front Curve Highlight -->
                <path d="M190,500 C190,600 230,630 300,630" stroke="white" stroke-width="8" fill="none" opacity="0.3" stroke-linecap="round" filter="blur(2px)"/>

                <!-- The Rim -->
                <path d="M170,420 C170,440 240,460 300,460 C360,460 430,440 430,420 L420,410 C420,430 360,450 300,450 C240,450 180,430 180,410 Z" class="ceramic-body" />
                
                <!-- Shadow under rim -->
                <path d="M180,430 C180,440 240,455 300,455 C360,455 420,440 420,430" stroke="#9CA3AF" stroke-width="2" fill="none" opacity="0.4" filter="blur(1px)"/>
            </g>

            <!-- SEAT & LID -->
            <g id="seat">
                <!-- Seat Thickness -->
                <path d="M180,415 C180,435 240,455 300,455 C360,455 420,435 420,415 L415,405 C415,425 360,445 300,445 C240,445 185,425 185,405 Z" class="ceramic-dark" />
                <!-- Seat Top -->
                <path d="M185,405 C185,425 240,445 300,445 C360,445 415,425 415,405 C415,395 360,385 300,385 C240,385 185,395 185,405 Z" class="ceramic-body" />
                
                <!-- Seat Highlight -->
                <ellipse cx="300" cy="410" rx="70" ry="12" fill="white" opacity="0.4" />
            </g>
        </svg>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const flushBtn = document.getElementById('flushTrigger');
        const waterSurface = document.getElementById('waterSurface');
        const vortex = document.getElementById('vortex');
        const splashGroup = document.getElementById('splashGroup');
        const particles = document.querySelectorAll('.splash-particle');
        const flushButtonVisual = document.getElementById('flushButtonVisual');

        let isFlushing = false;

        flushBtn.addEventListener('click', () => {
            if (isFlushing) return;
            isFlushing = true;

            // 1. Button Press
            flushButtonVisual.style.transform = "translateY(3px)";
            setTimeout(() => {
                flushButtonVisual.style.transform = "translateY(0)";
            }, 150);

            // 2. Water Drop
            waterSurface.style.transition = "transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)";
            waterSurface.style.transform = "scale(0.85) translateY(15px)";
            
            // 3. Vortex Spin
            vortex.style.transition = "none";
            vortex.style.opacity = "1";
            vortex.style.transform = "scale(0.1)";
            
            requestAnimationFrame(() => {
                vortex.style.transition = "transform 0.8s ease-in, opacity 0.8s ease-in";
                vortex.style.transform = "scale(1.8) rotate(180deg)";
                vortex.style.opacity = "0";
            });

            // 4. Splash
            particles.forEach((p, i) => {
                p.style.transition = `all 0.3s ease-out ${i * 0.05}s`;
                p.style.opacity = "1";
                const tx = (Math.random() - 0.5) * 40;
                const ty = -(Math.random() * 50 + 20);
                p.style.transform = `translate(${tx}px, ${ty}px)`;
            });

            // 5. Reset
            setTimeout(() => {
                particles.forEach(p => {
                    p.style.transition = "none";
                    p.style.opacity = "0";
                    p.style.transform = "none";
                });

                waterSurface.style.transition = "transform 2.5s cubic-bezier(0.2, 0.8, 0.2, 1)";
                waterSurface.style.transform = "scale(1) translateY(0)";

                setTimeout(() => {
                    isFlushing = false;
                }, 2500);
            }, 1000);
        });
    });
</script>
</body>
</html>
