<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Series 5 | Ceramic Perfection</title>
    <style>
        :root {
            --bg-color: #F4F2EE;
            --text-main: #18181B;
            --text-muted: #71717A;
            --accent: #18181B;
            --white: #FFFFFF;
            --shadow-soft: 0 20px 40px -10px rgba(0,0,0,0.05);
            --shadow-sharp: 0 4px 12px rgba(0,0,0,0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Background Elements */
        .ambient-light {
            position: absolute;
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.8) 0%, rgba(244,242,238,0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .grid-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
            background-size: 100px 100px;
            z-index: 0;
            opacity: 0.5;
        }

        /* Layout */
        .main-wrapper {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            width: 100%;
            max-width: 1400px;
            height: 90vh;
            position: relative;
            z-index: 1;
            padding: 0 4vw;
        }

        /* Left: Content */
        .content-col {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-right: 2rem;
        }

        .brand-tag {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            display: inline-block;
            border-bottom: 1px solid var(--text-muted);
            padding-bottom: 0.5rem;
            width: fit-content;
        }

        h1 {
            font-size: clamp(3rem, 5vw, 5.5rem);
            font-weight: 200;
            line-height: 1.1;
            letter-spacing: -0.04em;
            color: var(--text-main);
            margin-bottom: 2rem;
        }

        h1 strong {
            font-weight: 600;
            font-style: italic;
        }

        .description {
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--text-muted);
            max-width: 400px;
            margin-bottom: 3rem;
        }

        .features-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .feature h4 {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .feature p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Interaction */
        .cta-wrapper {
            position: relative;
        }

        .flush-btn {
            background: var(--accent);
            color: var(--white);
            border: none;
            padding: 1.2rem 3rem;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: var(--shadow-sharp);
        }

        .flush-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .flush-btn:active {
            transform: scale(0.98);
        }

        .flush-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Right: Product Stage */
        .visual-col {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SVG Styles */
        .svg-container {
            width: 100%;
            height: 100%;
            max-width: 650px;
            filter: drop-shadow(0px 30px 40px rgba(0,0,0,0.1));
        }

        /* SVG Classes for Animation */
        .water-surface {
            transform-origin: 300px 450px;
            transition: transform 0.3s ease-out;
        }
        
        .vortex {
            transform-origin: 300px 450px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .chrome-button {
            transition: transform 0.1s ease-out;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .main-wrapper {
                grid-template-columns: 1fr;
                height: auto;
                padding: 4rem 2rem;
                gap: 4rem;
            }
            body {
                overflow-y: auto;
            }
            .content-col {
                padding-right: 0;
                text-align: center;
                align-items: center;
            }
            .features-grid {
                text-align: left;
            }
            .brand-tag { margin: 0 auto 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="grid-lines"></div>
    <div class="ambient-light"></div>

    <div class="main-wrapper">
        <!-- Content Column -->
        <div class="content-col">
            <span class="brand-tag">Aura Collection</span>
            <h1>The Art of<br><strong>Hydro-Ceramics.</strong></h1>
            <p class="description">
                Precision-engineered for silence. Sculpted for serenity. 
                The Series 5 combines hydro-dynamic efficiency with a timeless, 
                seamless ceramic aesthetic.
            </p>

            <div class="features-grid">
                <div class="feature">
                    <h4>Hydro-Clean</h4>
                    <p>360° rimless spray technology</p>
                </div>
                <div class="feature">
                    <h4>Silent Flush</h4>
                    <p>Whisper-quiet valve mechanics</p>
                </div>
            </div>

            <div class="cta-wrapper">
                <button class="flush-btn" id="flushBtn">
                    <span>ACTIVATE FLUSH</span>
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C12 2 5 10 5 15C5 18.87 8.13 22 12 22C15.87 22 19 18.87 19 15C19 10 12 2 12 2Z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Visual Column -->
        <div class="visual-col">
            <svg class="svg-container" viewBox="0 0 600 700" preserveAspectRatio="xMidYMid meet">
                <defs>
                    <!-- Ceramic Gradients -->
                    <linearGradient id="grad-ceramic-body" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#D1D5DB;stop-opacity:1" />
                        <stop offset="20%" style="stop-color:#FFFFFF;stop-opacity:1" />
                        <stop offset="60%" style="stop-color:#F3F4F6;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#9CA3AF;stop-opacity:1" />
                    </linearGradient>

                    <linearGradient id="grad-ceramic-side" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#E5E7EB;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#9CA3AF;stop-opacity:1" />
                    </linearGradient>

                    <!-- Chrome/Metal Gradients -->
                    <linearGradient id="grad-chrome" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#9CA3AF;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#F3F4F6;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#4B5563;stop-opacity:1" />
                    </linearGradient>

                    <!-- Water Gradients -->
                    <radialGradient id="grad-water" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#E0F2FE;stop-opacity:0.9" />
                        <stop offset="80%" style="stop-color:#7DD3FC;stop-opacity:0.9" />
                        <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:0.9" />
                    </radialGradient>

                    <radialGradient id="grad-shadow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#000;stop-opacity:0.1" />
                        <stop offset="100%" style="stop-color:#000;stop-opacity:0" />
                    </radialGradient>
                    
                    <!-- Filter for gloss -->
                    <filter id="blur-small">
                        <feGaussianBlur in="SourceGraphic" stdDeviation="1" />
                    </filter>
                </defs>

                <!-- Base Shadow -->
                <ellipse cx="300" cy="640" rx="140" ry="15" fill="#000" opacity="0.15" filter="blur(6px)" />

                <!-- PLUMBING (Behind Bowl) -->
                <g id="plumbing">
                    <rect x="285" y="620" width="30" height="20" fill="url(#grad-chrome)" rx="2" />
                    <rect x="275" y="635" width="50" height="6" fill="#333" rx="2" />
                    <!-- Bolts -->
                    <circle cx="280" cy="638" r="2" fill="#555" />
                    <circle cx="320" cy="638" r="2" fill="#555" />
                </g>

                <!-- TANK (Back) -->
                <g id="tank-group">
                    <!-- Tank Body -->
                    <path d="M190,200 L410,200 C420,200 425,205 425,215 L425,380 C425,390 415,395 400,395 L200,395 C185,395 175,390 175,380 L175,215 C175,205 180,200 190,200 Z" fill="url(#grad-ceramic-body)" />
                    
                    <!-- Tank Lid -->
                    <path d="M180,195 L420,195 C430,195 430,205 420,205 L180,205 C170,205 170,195 180,195 Z" fill="url(#grad-ceramic-side)" />
                    
                    <!-- Flush Button (Top) -->
                    <g class="chrome-button" id="tankButton">
                        <rect x="285" y="185" width="30" height="8" rx="2" fill="url(#grad-chrome)" />
                        <circle cx="300" cy="182" r="12" fill="url(#grad-chrome)" />
                        <circle cx="300" cy="182" r="9" fill="#E5E7EB" />
                        <circle cx="298" cy="180" r="2" fill="#fff" opacity="0.6" /> <!-- Specular -->
                    </g>

                    <!-- Tank Highlight -->
                    <path d="M185,210 L185,380 C185,390 190,395 195,395" stroke="white" stroke-width="4" fill="none" opacity="0.7" filter="url(#blur-small)" stroke-linecap="round"/>
                </g>

                <!-- BOWL INTERIOR -->
                <g id="bowl-interior">
                    <!-- Inner Bowl Depth -->
                    <ellipse cx="300" cy="430" rx="140" ry="60" fill="url(#grad-ceramic-side)" />
                    
                    <!-- Water -->
                    <g class="water-surface" id="waterGroup">
                        <ellipse cx="300" cy="450" rx="125" ry="50" fill="url(#grad-water)" />
                        <ellipse cx="300" cy="450" rx="120" ry="45" fill="none" stroke="#BAE6FD" stroke-width="1" opacity="0.5" />
                    </g>

                    <!-- Vortex Animation Layer -->
                    <g class="vortex" id="vortexGroup">
                        <path d="M300,450 Q320,420 300,400" stroke="white" stroke-width="2" fill="none" opacity="0.5" />
                        <circle cx="300" cy="450" r="30" fill="none" stroke="white" stroke-width="2" opacity="0.3" />
                        <circle cx="300" cy="450" r="60" fill="none" stroke="white" stroke-width="1" opacity="0.2" />
                    </g>
                </g>

                <!-- BOWL EXTERIOR -->
                <g id="bowl-outer">
                    <!-- Main Shell -->
                    <path d="M170,420 C170,550 210,620 300,620 C390,620 430,550 430,420 L430,380 C430,370 410,360 380,360 L220,360 C190,360 170,370 170,380 Z" fill="url(#grad-ceramic-body)" />
                    
                    <!-- Front Highlight -->
                    <path d="M185,450 C185,550 220,600 280,610" stroke="white" stroke-width="8" fill="none" opacity="0.4" filter="url(#blur-small)" stroke-linecap="round"/>
                    
                    <!-- Rim -->
                    <path d="M165,380 C165,410 240,440 300,440 C360,440 435,410 435,380 L430,370 C430,400 360,430 300,430 C240,430 170,400 170,370 Z" fill="url(#grad-ceramic-body)" />
                    
                    <!-- Rim Shadow -->
                    <path d="M170,380 C170,410 240,440 300,440 C360,440 430,410 430,380" stroke="#000" stroke-width="2" fill="none" opacity="0.05" filter="url(#blur-small)"/>
                </g>

                <!-- SEAT -->
                <g id="seat-group">
                    <!-- Seat Thickness/Underside -->
                    <path d="M175,375 C175,400 240,420 300,420 C360,420 425,400 425,375 L420,365 C420,390 360,410 300,410 C240,410 180,390 180,365 Z" fill="url(#grad-ceramic-side)" />
                    
                    <!-- Seat Top -->
                    <path d="M180,365 C180,390 240,410 300,410 C360,410 420,390 420,365 C420,350 360,340 300,340 C240,340 180,350 180,365 Z" fill="url(#grad-ceramic-body)" />
                    
                    <!-- Seat Gloss -->
                    <ellipse cx="300" cy="370" rx="70" ry="10" fill="white" opacity="0.5" filter="url(#blur-small)" />
                </g>
            </svg>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const flushBtn = document.getElementById('flushBtn');
            const waterGroup = document.getElementById('waterGroup');
            const vortexGroup = document.getElementById('vortexGroup');
            const tankButton = document.getElementById('tankButton');

            let isFlushing = false;

            flushBtn.addEventListener('click', () => {
                if (isFlushing) return;
                isFlushing = true;

                // 1. Button Press Animation
                tankButton.style.transform = "translateY(4px)";
                setTimeout(() => {
                    tankButton.style.transform = "translateY(0)";
                }, 150);

                // 2. Water Drop & Vortex
                setTimeout(() => {
                    // Water drops
                    waterGroup.style.transform = "scale(0.85) translateY(15px)";
                    
                    // Vortex appears and spins
                    vortexGroup.style.opacity = "1";
                    vortexGroup.style.transform = "scale(0.5) rotate(0deg)";
                    
                    // Animate vortex scaling and spinning
                    vortexGroup.style.transition = "transform 1.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 1.5s ease-in";
                    vortexGroup.style.transform = "scale(2.5) rotate(360deg)";
                    vortexGroup.style.opacity = "0";

                }, 100);

                // 3. Water Reset
                setTimeout(() => {
                    waterGroup.style.transition = "transform 2s cubic-bezier(0.2, 0.8, 0.2, 1)";
                    waterGroup.style.transform = "scale(1) translateY(0)";
                    
                    // Reset Vortex state
                    vortexGroup.style.transition = "none";
                    vortexGroup.style.opacity = "0";
                    vortexGroup.style.transform = "scale(0.5) rotate(0deg)";

                    isFlushing = false;
                }, 1500);
            });
        });
    </script>
</body>
</html>
