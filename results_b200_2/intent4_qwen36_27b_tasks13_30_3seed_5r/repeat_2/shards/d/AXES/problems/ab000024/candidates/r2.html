<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Series 5 | Hydro-Luxury</title>
<style>
    :root {
        /* Palette: Architectural Slate, Ceramic White, Hydro Blue */
        --bg-dark: #020617;
        --bg-surface: #0f172a;
        --text-primary: #f8fafc;
        --text-secondary: #64748b;
        --accent: #38bdf8;
        --accent-dim: #0ea5e9;
        --chrome-light: #f1f5f9;
        --chrome-dark: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background-color: var(--bg-dark);
        color: var(--text-primary);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Architectural Background Vibe */
        background: 
            linear-gradient(to bottom, rgba(2, 6, 23, 0.9), rgba(2, 6, 23, 0.6)),
            repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 100px),
            linear-gradient(to bottom, #1e293b 0%, #0f172a 100%);
    }

    /* Layout Container */
    .stage {
        display: grid;
        grid-template-columns: 350px 1fr;
        width: 100%;
        height: 100%;
        max-width: 1600px;
        position: relative;
    }

    /* LEFT: Content Column */
    .content-side {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 3rem;
        z-index: 10;
        position: relative;
        border-right: 1px solid rgba(255,255,255,0.05);
        background: linear-gradient(to right, rgba(2, 6, 23, 0.9), transparent);
    }

    /* Typography */
    h1 {
        font-size: 3.5rem;
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 0.95;
        margin-bottom: 0.5rem;
        color: #fff;
    }

    h1 .sub {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 1rem;
    }

    .tagline {
        font-size: 1rem;
        line-height: 1.6;
        color: var(--text-secondary);
        margin-bottom: 3rem;
        font-weight: 400;
    }

    /* Specs Grid */
    .specs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
        margin-bottom: 4rem;
    }

    .spec-item {
        display: flex;
        flex-direction: column;
    }

    .spec-item h3 {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-secondary);
        margin-bottom: 0.4rem;
        font-weight: 600;
    }

    .spec-item p {
        font-size: 1.1rem;
        font-weight: 500;
        color: var(--text-primary);
        font-variant-numeric: tabular-nums;
    }

    /* Interactive Button */
    .flush-trigger {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: var(--text-primary);
        padding: 1rem 1.5rem;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        width: fit-content;
        backdrop-filter: blur(8px);
        border-radius: 4px;
    }

    .flush-trigger:hover {
        background: rgba(56, 189, 248, 0.1);
        border-color: var(--accent);
        color: var(--accent);
        transform: translateY(-2px);
        box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.2);
    }

    .flush-trigger svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
    }

    /* RIGHT: Visual Stage */
    .visual-side {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* Ambient Lighting */
    .ambient-light {
        position: absolute;
        width: 800px;
        height: 800px;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, transparent 70%);
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        z-index: 0;
        pointer-events: none;
    }

    /* SVG Container */
    .product-svg {
        width: 100%;
        height: 100%;
        z-index: 5;
        /* No filter drop-shadow, handled inside SVG for realism */
    }

    /* SVG Styling Classes */
    .ceramic-body { fill: url(#grad-ceramic-body); }
    .ceramic-dark { fill: url(#grad-ceramic-dark); }
    .chrome { fill: url(#grad-chrome); }
    .chrome-dark { fill: url(#grad-chrome-dark); }
    .water-surface { fill: url(#grad-water); }
    .water-highlight { fill: #ffffff; opacity: 0.6; }
    .plumbing { fill: #1e293b; }

    /* Animation Groups */
    .flush-lever { transform-origin: 215px 345px; transition: transform 0.1s ease-in; }
    .water-group { transition: transform 0.3s ease-in, opacity 0.3s ease-in; transform-origin: 400px 350px; }
    .vortex-group { opacity: 0; transform-origin: 400px 350px; transition: transform 0.5s linear, opacity 0.2s ease; }
    .splash-drop { opacity: 0; transform-origin: center; }

    /* Responsive */
    @media (max-width: 1024px) {
        .stage { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
        .content-side { 
            border-right: none; 
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 2rem;
            background: var(--bg-dark);
            order: 2;
        }
        .visual-side { order: 1; height: 60vh; }
        h1 { font-size: 2.5rem; }
    }
</style>
</head>
<body>

<div class="stage">
    <!-- LEFT: Information -->
    <div class="content-side">
        <h1><span class="sub">Aura Series 5</span>Hydro-Luxury<br>Sanitation</h1>
        <p class="tagline">
            Sculptural ceramic design meets advanced hydro-dynamics. 
            Experience the Rimless Vortex system engineered for absolute silence.
        </p>

        <div class="specs">
            <div class="spec-item">
                <h3>Volume</h3>
                <p>3.8L / 1.28 GPF</p>
            </div>
            <div class="spec-item">
                <h3>Finish</h3>
                <p>Glossy Snow</p>
            </div>
            <div class="spec-item">
                <h3>System</h3>
                <p>Rimless Vortex</p>
            </div>
            <div class="spec-item">
                <h3>Material</h3>
                <p>Vit. Porcelain</p>
            </div>
        </div>

        <button class="flush-trigger" id="flushBtn">
            <span>Simulate Flush</span>
            <svg viewBox="0 0 24 24">
                <path d="M12 2C12 2 5 10 5 15C5 18.87 8.13 22 12 22C15.87 22 19 18.87 19 15C19 10 12 2 12 2M12 20C9.24 20 7 17.76 7 15C7 12.5 10 7.5 12 4.5C14 7.5 17 12.5 17 15C17 17.76 14.76 20 12 20Z" />
            </svg>
        </button>
    </div>

    <!-- RIGHT: Product Illustration -->
    <div class="visual-side">
        <div class="ambient-light"></div>

        <svg class="product-svg" viewBox="0 0 800 700" preserveAspectRatio="xMidYMid meet">
            <defs>
                <!-- 1. Ceramic Body Gradient (Sculptural Volume) -->
                <linearGradient id="grad-ceramic-body" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#cbd5e1" /> <!-- Left Shadow -->
                    <stop offset="15%" style="stop-color:#ffffff" /> <!-- Main Highlight -->
                    <stop offset="45%" style="stop-color:#f8fafc" /> <!-- Mid Tone -->
                    <stop offset="85%" style="stop-color:#e2e8f0" /> <!-- Right Shadow -->
                    <stop offset="100%" style="stop-color:#94a3b8" /> <!-- Deep Edge -->
                </linearGradient>

                <!-- 2. Ceramic Shadow (Undercuts) -->
                <linearGradient id="grad-ceramic-dark" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#64748b" />
                    <stop offset="100%" style="stop-color:#334155" />
                </linearGradient>

                <!-- 3. Brushed Chrome -->
                <linearGradient id="grad-chrome" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#f8fafc" />
                    <stop offset="40%" style="stop-color:#94a3b8" />
                    <stop offset="60%" style="stop-color:#f1f5f9" />
                    <stop offset="100%" style="stop-color:#475569" />
                </linearGradient>
                
                <linearGradient id="grad-chrome-dark" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#475569" />
                    <stop offset="100%" style="stop-color:#1e293b" />
                </linearGradient>

                <!-- 4. Water Depth -->
                <radialGradient id="grad-water" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#7dd3fc; stop-opacity:0.8" />
                    <stop offset="80%" style="stop-color:#0ea5e9; stop-opacity:0.9" />
                    <stop offset="100%" style="stop-color:#0369a1; stop-opacity:1" />
                </radialGradient>

                <!-- 5. Floor Shadow Blur -->
                <filter id="blur-shadow">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="10" />
                </filter>
            </defs>

            <!-- Floor Shadow -->
            <ellipse cx="400" cy="655" rx="260" ry="35" fill="#000" opacity="0.6" filter="url(#blur-shadow)" />

            <!-- PLUMBING BASE (Visible as requested) -->
            <g id="plumbing">
                <!-- Wall Connection (Subtle) -->
                <rect x="330" y="640" width="140" height="15" fill="#1e293b" opacity="0.8" />
                <!-- Floor Flange -->
                <ellipse cx="400" cy="650" rx="100" ry="15" class="plumbing" />
                <ellipse cx="400" cy="650" rx="95" ry="12" class="chrome" opacity="0.3" /> <!-- Reflection -->
            </g>

            <!-- TANK (Back Layer) -->
            <g id="tank">
                <!-- Tank Back/Side (Depth) -->
                <path d="M250,250 L550,250 C560,250 570,260 570,280 L570,480 C570,520 540,530 500,530 L300,530 C260,530 230,520 230,480 L230,280 C230,260 240,250 250,250 Z" class="ceramic-body" />
                
                <!-- Tank Top Lid -->
                <path d="M230,250 L570,250 C570,250 560,230 530,230 L270,230 C240,230 230,250 230,250 Z" class="ceramic-body" />
                <!-- Lid Edge Shadow -->
                <path d="M230,250 L570,250 L570,255 C570,260 560,265 530,265 L270,265 C240,265 230,260 230,255 Z" class="ceramic-dark" opacity="0.5" />

                <!-- Glossy Highlight (Vertical) -->
                <path d="M250,280 L250,480" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity="0.4" filter="url(#blur-shadow)" />
                
                <!-- Flush Handle (Clearly Visible) -->
                <g id="handle-assembly">
                    <!-- Mount Base -->
                    <rect x="225" y="330" width="10" height="40" rx="2" class="chrome" />
                    <!-- The Lever -->
                    <g class="flush-lever">
                        <rect x="210" y="335" width="45" height="12" rx="6" class="chrome" />
                        <circle cx="255" cy="341" r="6" class="chrome-dark" /> <!-- End Cap -->
                    </g>
                </g>
            </g>

            <!-- BOWL (Front Layer) -->
            <g id="bowl">
                <!-- Bowl Exterior -->
                <path d="M210,400 C210,620 300,660 400,660 C500,660 590,620 590,400 L590,380 C590,360 570,350 550,350 L250,350 C230,350 210,360 210,380 Z" class="ceramic-body" />
                
                <!-- Bowl Front Specular Highlight -->
                <path d="M240,450 C240,580 300,630 400,630" stroke="#fff" stroke-width="15" stroke-linecap="round" opacity="0.3" filter="url(#blur-shadow)" fill="none" />

                <!-- Rim (Lip) -->
                <path d="M230,350 C230,390 320,410 400,410 C480,410 570,390 570,350 L560,340 C560,375 480,395 400,395 C320,395 240,375 240,340 Z" class="ceramic-dark" />

                <!-- The Hole / Inner Depth -->
                <ellipse cx="400" cy="350" rx="160" ry="48" fill="#0f172a" /> <!-- Dark Void -->
                
                <!-- Inner Bowl Wall Highlight -->
                <path d="M245,350 C245,380 320,400 400,400 C480,400 555,380 555,350" stroke="#cbd5e1" stroke-width="2" fill="none" opacity="0.5" />

                <!-- Water Surface -->
                <g class="water-group">
                    <ellipse cx="400" cy="350" rx="150" ry="44" class="water-surface" />
                    <!-- Water Specular Highlight -->
                    <ellipse cx="360" cy="345" rx="50" ry="12" class="water-highlight" transform="rotate(-15 360 345)" />
                </g>

                <!-- Vortex Animation Layer -->
                <g class="vortex-group">
                    <!-- Swirl Shape -->
                    <path d="M400,350 C400,350 320,380 340,400 C360,420 420,400 440,380 C460,360 420,340 400,350" fill="#38bdf8" opacity="0.4" />
                    <ellipse cx="400" cy="350" rx="150" ry="44" fill="url(#grad-water)" opacity="0.8" />
                </g>

                <!-- Splash Particles -->
                <g id="splash-particles">
                    <circle cx="380" cy="350" r="4" fill="#fff" class="splash-drop" />
                    <circle cx="420" cy="340" r="5" fill="#fff" class="splash-drop" />
                    <circle cx="390" cy="330" r="3" fill="#fff" class="splash-drop" />
                    <circle cx="410" cy="360" r="4" fill="#fff" class="splash-drop" />
                    <circle cx="370" cy="365" r="2" fill="#fff" class="splash-drop" />
                </g>
            </g>
            
            <!-- SEAT (Resting on top) -->
            <g id="seat">
                <!-- Seat Thickness (Side) -->
                <path d="M240,350 C240,390 320,410 400,410 C480,410 560,390 560,350 L550,340 C550,375 480,395 400,395 C320,395 250,375 250,340 Z" class="ceramic-dark" />
                <!-- Seat Top -->
                <path d="M250,340 C250,375 320,395 400,395 C480,395 550,375 550,340 C550,320 480,310 400,310 C320,310 250,320 250,340 Z" class="ceramic-body" />
                <!-- Seat Gloss -->
                <ellipse cx="400" cy="350" rx="90" ry="20" fill="#fff" opacity="0.15" />
            </g>

        </svg>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const flushBtn = document.getElementById('flushBtn');
        const lever = document.querySelector('.flush-lever');
        const waterGroup = document.querySelector('.water-group');
        const vortexGroup = document.querySelector('.vortex-group');
        const particles = document.querySelectorAll('.splash-drop');
        let isFlushing = false;

        flushBtn.addEventListener('click', () => {
            if (isFlushing) return;
            isFlushing = true;

            // 1. Lever Animation (Press down)
            lever.style.transform = 'rotate(-25deg)';
            
            setTimeout(() => {
                lever.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                lever.style.transform = 'rotate(0deg)';
            }, 150);

            // 2. Water Drop (Drain effect)
            waterGroup.style.transform = 'scale(0.9) translateY(15px)';
            waterGroup.style.opacity = '0.2';

            // 3. Vortex Spin (Spin in)
            vortexGroup.style.opacity = '1';
            vortexGroup.style.transform = 'rotate(720deg) scale(0.8)';

            // 4. Splash Particles (Explosion)
            particles.forEach((p, i) => {
                p.style.transition = `all 0.5s ease-out ${i * 0.03}s`;
                p.style.opacity = '1';
                const tx = (Math.random() - 0.5) * 60;
                const ty = -(Math.random() * 40 + 20);
                p.style.transform = `translate(${tx}px, ${ty}px) scale(0.5)`;
            });

            // 5. Reset Sequence
            setTimeout(() => {
                // Hide particles
                particles.forEach(p => {
                    p.style.transition = 'none';
                    p.style.opacity = '0';
                    p.style.transform = 'none';
                });

                // Reset Vortex
                vortexGroup.style.transform = 'rotate(0deg) scale(1)';
                vortexGroup.style.opacity = '0';

                // Refill Water (Fill effect)
                waterGroup.style.transition = 'all 1.2s cubic-bezier(0.4, 0, 0.2, 1)';
                waterGroup.style.transform = 'scale(1) translateY(0)';
                waterGroup.style.opacity = '1';

                setTimeout(() => {
                    isFlushing = false;
                }, 1200);

            }, 900);
        });
    });
</script>
</body>
</html>
