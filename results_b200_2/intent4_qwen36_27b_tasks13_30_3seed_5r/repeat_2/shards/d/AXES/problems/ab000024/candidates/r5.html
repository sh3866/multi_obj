<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Series 5 | Hydro-Luxury</title>
<style>
    :root {
        /* Palette: Deep Slate, Ceramic White, Electric Hydro */
        --bg-deep: #020617;
        --bg-surface: #0f172a;
        --text-primary: #ffffff;
        --text-secondary: #94a3b8;
        --accent: #38bdf8;
        --accent-glow: rgba(56, 189, 248, 0.6);
        --accent-solid: #0ea5e9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(to bottom, #0f172a 0%, #020617 100%);
    }

    /* Layout Container */
    .stage {
        display: grid;
        grid-template-columns: 40% 60%;
        width: 100%;
        height: 100%;
        max-width: 2400px;
        position: relative;
    }

    /* LEFT: Content Column */
    .content-side {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 6rem;
        z-index: 10;
        position: relative;
        /* Subtle grid background for architectural feel */
        background-image: 
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 40px 40px;
    }

    /* Typography: Hierarchy Correction */
    h1 {
        font-size: 4rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 0.9;
        margin-bottom: 1rem;
        color: #fff;
        text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    h1 .sub {
        display: block;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 1.5rem;
        text-shadow: 0 0 10px var(--accent-glow);
    }

    .tagline {
        font-size: 1.125rem;
        line-height: 1.6;
        color: var(--text-secondary);
        margin-bottom: 4rem;
        font-weight: 300;
        max-width: 400px;
        border-left: 2px solid var(--accent);
        padding-left: 2rem;
    }

    /* Specs Grid: Refined */
    .specs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3rem;
        margin-bottom: 5rem;
        border-top: 1px solid rgba(255,255,255,0.1);
        padding-top: 2rem;
    }

    .spec-item {
        display: flex;
        flex-direction: column;
    }

    .spec-item h3 {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-secondary);
        margin-bottom: 0.5rem;
        font-weight: 600;
    }

    .spec-item p {
        font-size: 1.25rem;
        font-weight: 500;
        color: var(--text-primary);
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.01em;
    }

    /* Interactive Button: Elevated Hierarchy */
    .flush-trigger {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: var(--accent-solid);
        color: #fff;
        padding: 1.25rem 2.5rem;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        width: fit-content;
        border-radius: 8px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        border: 1px solid rgba(255,255,255,0.2);
    }

    .flush-trigger:hover {
        background: #0284c7;
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(14, 165, 233, 0.5);
    }

    .flush-trigger svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
    }

    /* RIGHT: Visual Stage */
    .visual-side {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* Ambient Lighting */
    .ambient-light {
        position: absolute;
        width: 900px;
        height: 900px;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.1) 0%, transparent 60%);
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1;
        pointer-events: none;
    }

    /* SVG Container */
    .product-svg {
        width: 100%;
        height: 100%;
        z-index: 5;
        max-height: 90vh;
        animation: floatIn 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes floatIn {
        from { transform: translateY(40px); opacity: 0; filter: blur(10px); }
        to { transform: translateY(0); opacity: 1; filter: blur(0); }
    }

    /* SVG Styling */
    .ceramic-body { fill: url(#grad-ceramic-body); }
    .ceramic-shadow { fill: url(#grad-ceramic-shadow); }
    .chrome { fill: url(#grad-chrome); }
    .water-surface { fill: url(#grad-water); }
    
    /* Animation Groups */
    .flush-lever { transform-origin: 215px 345px; transition: transform 0.1s ease-in; }
    .water-group { transition: transform 0.3s ease-in, opacity 0.3s ease-in; transform-origin: 400px 350px; }
    .vortex-group { opacity: 0; transform-origin: 400px 350px; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease; }
    .splash-drop { opacity: 0; transform-origin: center; }

    /* Responsive */
    @media (max-width: 1024px) {
        .stage { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
        .content-side { 
            padding: 2rem;
            background: var(--bg-deep);
            order: 2;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .visual-side { order: 1; height: 45vh; }
        h1 { font-size: 2.5rem; }
        .specs { grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    }
</style>
</head>
<body>

<div class="stage">
    <!-- LEFT: Information -->
    <div class="content-side">
        <h1><span class="sub">Aura Series 5</span>Hydro-Luxury<br>Sanitation</h1>
        <p class="tagline">
            Sculptural ceramic design meets advanced hydro-dynamics. 
            Experience the Rimless Vortex system engineered for absolute silence.
        </p>

        <div class="specs">
            <div class="spec-item">
                <h3>Volume</h3>
                <p>3.8L / 1.28 GPF</p>
            </div>
            <div class="spec-item">
                <h3>Finish</h3>
                <p>Glossy Snow</p>
            </div>
            <div class="spec-item">
                <h3>System</h3>
                <p>Rimless Vortex</p>
            </div>
            <div class="spec-item">
                <h3>Material</h3>
                <p>Vit. Porcelain</p>
            </div>
        </div>

        <button class="flush-trigger" id="flushBtn">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C12 2 5 10 5 15C5 18.87 8.13 22 12 22C15.87 22 19 18.87 19 15C19 10 12 2 12 2M12 20C9.24 20 7 17.76 7 15C7 12.5 10 7.5 12 4.5C14 7.5 17 12.5 17 15C17 17.76 14.76 20 12 20Z" />
            </svg>
            <span>Simulate Flush</span>
        </button>
    </div>

    <!-- RIGHT: Product Illustration -->
    <div class="visual-side">
        <div class="ambient-light"></div>

        <svg class="product-svg" viewBox="0 0 800 700" preserveAspectRatio="xMidYMid meet">
            <defs>
                <!-- 1. Ceramic Body Gradient (Complex Mesh Simulation) -->
                <linearGradient id="grad-ceramic-body" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#64748b" /> <!-- Shadow Left -->
                    <stop offset="15%" style="stop-color:#f8fafc" /> <!-- Transition -->
                    <stop offset="30%" style="stop-color:#ffffff" /> <!-- Main Highlight -->
                    <stop offset="55%" style="stop-color:#f1f5f9" /> <!-- Mid Tone -->
                    <stop offset="85%" style="stop-color:#94a3b8" /> <!-- Shadow Right -->
                    <stop offset="100%" style="stop-color:#334155" /> <!-- Deep Edge Right -->
                </linearGradient>

                <!-- 2. Ceramic Shadow (Undercuts & Crevices) -->
                <linearGradient id="grad-ceramic-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#475569" />
                    <stop offset="100%" style="stop-color:#1e293b" />
                </linearGradient>

                <!-- 3. Brushed Chrome -->
                <linearGradient id="grad-chrome" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ffffff" />
                    <stop offset="40%" style="stop-color:#cbd5e1" />
                    <stop offset="60%" style="stop-color:#f8fafc" />
                    <stop offset="100%" style="stop-color:#64748b" />
                </linearGradient>
                
                <!-- 4. Water Depth -->
                <radialGradient id="grad-water" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#e0f2fe; stop-opacity:0.8" />
                    <stop offset="60%" style="stop-color:#38bdf8; stop-opacity:0.9" />
                    <stop offset="100%" style="stop-color:#0284c7; stop-opacity:1" />
                </radialGradient>

                <!-- 5. Floor Shadow Blur -->
                <filter id="blur-shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="25" />
                </filter>
                
                <!-- 6. Specular Blur -->
                <filter id="blur-specular" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="5" />
                </filter>
            </defs>

            <!-- Floor Shadow (Grounding) -->
            <ellipse cx="400" cy="665" rx="280" ry="40" fill="#000" opacity="0.9" filter="url(#blur-shadow)" />

            <!-- PLUMBING BASE (Visible as requested) -->
            <g id="plumbing">
                <!-- Wall Connection (Subtle) -->
                <path d="M340,650 L460,650 L460,660 L340,660 Z" fill="#020617" opacity="0.9" />
                <!-- Floor Flange -->
                <ellipse cx="400" cy="660" rx="110" ry="12" class="chrome" opacity="0.3" />
                <!-- Visible Pipe Base -->
                <path d="M360,655 L440,655 L440,670 L360,670 Z" fill="#0f172a" />
            </g>

            <!-- TANK (Back Layer) -->
            <g id="tank">
                <!-- Tank Back/Side (Depth) -->
                <path d="M260,260 L540,260 C555,260 565,270 565,290 L565,490 C565,530 530,540 490,540 L310,540 C270,540 235,530 235,490 L235,290 C235,270 245,260 260,260 Z" class="ceramic-body" />
                
                <!-- Tank Top Lid -->
                <path d="M235,260 L565,260 C565,260 555,240 525,240 L275,240 C245,240 235,260 235,260 Z" class="ceramic-body" />
                
                <!-- Lid Edge Shadow -->
                <path d="M235,260 L565,260 L565,265 C565,270 555,275 525,275 L275,275 C245,275 235,270 235,265 Z" class="ceramic-shadow" opacity="0.4" />

                <!-- Glossy Highlight (Vertical) -->
                <path d="M260,290 L260,490" stroke="#fff" stroke-width="20" stroke-linecap="round" opacity="0.7" filter="url(#blur-specular)" />
                
                <!-- Flush Handle (Clearly Visible) -->
                <g id="handle-assembly">
                    <!-- Mount Base -->
                    <rect x="230" y="330" width="15" height="50" rx="3" class="chrome" />
                    <!-- The Lever -->
                    <g class="flush-lever">
                        <rect x="210" y="335" width="50" height="14" rx="7" class="chrome" />
                        <circle cx="255" cy="342" r="8" class="chrome" /> <!-- End Cap -->
                        <circle cx="255" cy="342" r="3" fill="#fff" opacity="0.8" /> <!-- Cap Detail -->
                    </g>
                </g>
            </g>

            <!-- BOWL (Front Layer) -->
            <g id="bowl">
                <!-- Bowl Exterior -->
                <path d="M210,410 C210,630 300,670 400,670 C500,670 590,630 590,410 L590,390 C590,370 570,360 550,360 L250,360 C230,360 210,370 210,390 Z" class="ceramic-body" />
                
                <!-- Bowl Front Specular Highlight -->
                <path d="M240,460 C240,590 300,640 400,640" stroke="#fff" stroke-width="18" stroke-linecap="round" opacity="0.5" filter="url(#blur-specular)" fill="none" />

                <!-- Rim (Lip) -->
                <path d="M230,360 C230,400 320,420 400,420 C480,420 570,400 570,360 L560,350 C560,385 480,405 400,405 C320,405 240,385 240,350 Z" class="ceramic-shadow" />

                <!-- The Hole / Inner Depth -->
                <ellipse cx="400" cy="360" rx="165" ry="50" fill="#020617" /> <!-- Dark Void -->
                
                <!-- Inner Bowl Wall Highlight -->
                <path d="M240,360 C240,390 320,410 400,410 C480,410 560,390 560,360" stroke="#cbd5e1" stroke-width="3" fill="none" opacity="0.3" />

                <!-- Water Surface -->
                <g class="water-group">
                    <ellipse cx="400" cy="360" rx="155" ry="46" class="water-surface" />
                    <!-- Water Specular Highlight -->
                    <ellipse cx="360" cy="355" rx="60" ry="15" fill="#ffffff" opacity="0.5" transform="rotate(-15 360 355)" filter="url(#blur-specular)" />
                </g>

                <!-- Vortex Animation Layer -->
                <g class="vortex-group">
                    <!-- Swirl Shape -->
                    <path d="M400,360 C400,360 300,400 330,430 C360,460 440,430 470,400 C500,370 440,340 400,360" fill="#38bdf8" opacity="0.6" />
                    <ellipse cx="400" cy="360" rx="155" ry="46" fill="url(#grad-water)" opacity="0.9" />
                </g>

                <!-- Splash Particles -->
                <g id="splash-particles">
                    <circle cx="380" cy="360" r="4" fill="#fff" class="splash-drop" />
                    <circle cx="420" cy="350" r="5" fill="#fff" class="splash-drop" />
                    <circle cx="390" cy="340" r="3" fill="#fff" class="splash-drop" />
                    <circle cx="410" cy="370" r="4" fill="#fff" class="splash-drop" />
                    <circle cx="370" cy="375" r="2" fill="#fff" class="splash-drop" />
                </g>
            </g>
            
            <!-- SEAT (Resting on top) -->
            <g id="seat">
                <!-- Seat Thickness (Side) -->
                <path d="M240,360 C240,400 320,420 400,420 C480,420 560,400 560,360 L550,350 C550,385 480,405 400,405 C320,405 250,385 250,350 Z" class="ceramic-shadow" />
                <!-- Seat Top -->
                <path d="M250,350 C250,385 320,405 400,405 C480,405 550,385 550,350 C550,330 480,320 400,320 C320,320 250,330 250,350 Z" class="ceramic-body" />
                <!-- Seat Gloss -->
                <ellipse cx="400" cy="360" rx="90" ry="25" fill="#fff" opacity="0.15" filter="url(#blur-specular)" />
            </g>

        </svg>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const flushBtn = document.getElementById('flushBtn');
        const lever = document.querySelector('.flush-lever');
        const waterGroup = document.querySelector('.water-group');
        const vortexGroup = document.querySelector('.vortex-group');
        const particles = document.querySelectorAll('.splash-drop');
        let isFlushing = false;

        flushBtn.addEventListener('click', () => {
            if (isFlushing) return;
            isFlushing = true;

            // 1. Lever Animation (Press down)
            lever.style.transform = 'rotate(-25deg)';
            
            setTimeout(() => {
                lever.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                lever.style.transform = 'rotate(0deg)';
            }, 150);

            // 2. Water Drop (Drain effect)
            waterGroup.style.transform = 'scale(0.8) translateY(20px)';
            waterGroup.style.opacity = '0.1';

            // 3. Vortex Spin (Spin in)
            vortexGroup.style.opacity = '1';
            vortexGroup.style.transform = 'rotate(720deg) scale(0.7)';

            // 4. Splash Particles (Explosion)
            particles.forEach((p, i) => {
                p.style.transition = `all 0.6s cubic-bezier(0.1, 0.7, 1.0, 0.1) ${i * 0.05}s`;
                p.style.opacity = '1';
                const tx = (Math.random() - 0.5) * 80;
                const ty = -(Math.random() * 50 + 30);
                p.style.transform = `translate(${tx}px, ${ty}px) scale(0.2)`;
            });

            // 5. Reset Sequence
            setTimeout(() => {
                // Hide particles
                particles.forEach(p => {
                    p.style.transition = 'none';
                    p.style.opacity = '0';
                    p.style.transform = 'none';
                });

                // Reset Vortex
                vortexGroup.style.transform = 'rotate(0deg) scale(1)';
                vortexGroup.style.opacity = '0';

                // Refill Water (Fill effect)
                waterGroup.style.transition = 'all 1.5s cubic-bezier(0.4, 0, 0.2, 1)';
                waterGroup.style.transform = 'scale(1) translateY(0)';
                waterGroup.style.opacity = '1';

                setTimeout(() => {
                    isFlushing = false;
                }, 1500);

            }, 1000);
        });
    });
</script>
</body>
</html>
