<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Series 5 | Hydro-Luxury Flush</title>
<style>
    :root {
        /* Palette: Deep Slate, Ceramic White, Chrome, Hydro Blue */
        --bg-dark: #0f172a;
        --bg-light: #1e293b;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent: #38bdf8;
        --accent-glow: rgba(56, 189, 248, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background-color: var(--bg-dark);
        background: radial-gradient(circle at 70% 60%, #1e293b 0%, #020617 100%);
        color: var(--text-primary);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .stage {
        display: grid;
        grid-template-columns: 1fr 1.2fr;
        width: 100%;
        height: 100%;
        max-width: 1600px;
        position: relative;
    }

    /* LEFT: Typography & Context */
    .content-side {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 4rem 6rem;
        z-index: 10;
        position: relative;
    }

    h1 {
        font-size: 4rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.1;
        margin-bottom: 1rem;
        background: linear-gradient(to right, #fff, #94a3b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    h1 span {
        display: block;
        font-weight: 300;
        font-size: 1.2rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
        -webkit-text-fill-color: var(--accent);
        margin-bottom: 0.5rem;
    }

    .tagline {
        font-size: 1.1rem;
        line-height: 1.6;
        color: var(--text-secondary);
        max-width: 450px;
        margin-bottom: 3rem;
        border-left: 1px solid var(--accent);
        padding-left: 1.5rem;
    }

    .specs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
        margin-bottom: 4rem;
    }

    .spec-item h3 {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-secondary);
        margin-bottom: 0.5rem;
    }

    .spec-item p {
        font-size: 1.25rem;
        font-weight: 500;
        color: var(--text-primary);
    }

    /* The Interactive Trigger */
    .flush-trigger {
        display: inline-flex;
        align-items: center;
        gap: 1rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--text-primary);
        padding: 1rem 2rem;
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.3s ease;
        width: fit-content;
        backdrop-filter: blur(10px);
    }

    .flush-trigger:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: var(--accent);
        box-shadow: 0 0 20px var(--accent-glow);
    }

    .flush-trigger svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
    }

    /* RIGHT: Visual Stage */
    .visual-side {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* Background Grid/Tiles */
    .bg-grid {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image: 
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
        -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
        z-index: 1;
    }

    .glow-spot {
        position: absolute;
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        opacity: 0.15;
        z-index: 0;
        pointer-events: none;
    }

    /* SVG Container */
    .product-svg {
        width: 90%;
        height: 90%;
        z-index: 5;
        filter: drop-shadow(0 30px 40px rgba(0,0,0,0.6));
    }

    /* SVG Classes */
    .ceramic-main { fill: url(#grad-ceramic-main); stroke: none; }
    .ceramic-shadow { fill: url(#grad-ceramic-shadow); stroke: none; }
    .chrome-metal { fill: url(#grad-chrome); stroke: none; }
    .water-body { fill: url(#grad-water); opacity: 0.9; }
    .water-highlight { fill: #fff; opacity: 0.4; filter: blur(2px); }
    
    /* Animation Groups */
    .flush-group { opacity: 0; transform-origin: 350px 350px; }
    .drop { opacity: 0; }

    /* Responsive */
    @media (max-width: 1024px) {
        .stage { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        .content-side { padding: 2rem; order: 2; justify-content: flex-start; }
        .visual-side { order: 1; }
        h1 { font-size: 2.5rem; }
        .specs { grid-template-columns: 1fr; gap: 1rem; }
    }
</style>
</head>
<body>

<div class="stage">
    <div class="content-side">
        <h1><span>Aura Series 5</span>Hydro-Luxury<br>Sanitation</h1>
        <div class="tagline">
            Experience the intersection of advanced hydro-dynamics and sculptural ceramic design. Engineered for silence, refined for the modern home.
        </div>

        <div class="specs">
            <div class="spec-item">
                <h3>Volume</h3>
                <p>3.8L / 1.28 GPF</p>
            </div>
            <div class="spec-item">
                <h3>Finish</h3>
                <p>Glossy Snow</p>
            </div>
            <div class="spec-item">
                <h3>System</h3>
                <p>Rimless Vortex</p>
            </div>
            <div class="spec-item">
                <h3>Handle</h3>
                <p>Brushed Chrome</p>
            </div>
        </div>

        <button class="flush-trigger" id="flushBtn">
            <span>Simulate Flush</span>
            <svg viewBox="0 0 24 24">
                <path d="M12 2C12 2 5 10 5 15C5 18.87 8.13 22 12 22C15.87 22 19 18.87 19 15C19 10 12 2 12 2M12 20C9.24 20 7 17.76 7 15C7 12.5 10 7.5 12 4.5C14 7.5 17 12.5 17 15C17 17.76 14.76 20 12 20Z" />
            </svg>
        </button>
    </div>

    <div class="visual-side">
        <div class="bg-grid"></div>
        <div class="glow-spot"></div>

        <svg class="product-svg" viewBox="0 0 800 700" preserveAspectRatio="xMidYMid meet">
            <defs>
                <!-- 1. Ceramic Gradients (High Contrast) -->
                <linearGradient id="grad-ceramic-main" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#e2e8f0" /> <!-- Left Edge -->
                    <stop offset="15%" style="stop-color:#ffffff" /> <!-- Highlight -->
                    <stop offset="50%" style="stop-color:#f8fafc" /> <!-- Mid -->
                    <stop offset="90%" style="stop-color:#cbd5e1" /> <!-- Shadow -->
                    <stop offset="100%" style="stop-color:#94a3b8" /> <!-- Deep Shadow -->
                </linearGradient>

                <linearGradient id="grad-ceramic-shadow" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#64748b" />
                    <stop offset="50%" style="stop-color:#94a3b8" />
                    <stop offset="100%" style="stop-color:#475569" />
                </linearGradient>

                <!-- 2. Chrome Gradient -->
                <linearGradient id="grad-chrome" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#94a3b8" />
                    <stop offset="40%" style="stop-color:#f1f5f9" />
                    <stop offset="60%" style="stop-color:#f1f5f9" />
                    <stop offset="100%" style="stop-color:#64748b" />
                </linearGradient>

                <!-- 3. Water Gradient (Deep Blue) -->
                <linearGradient id="grad-water" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#bae6fd; stop-opacity:0.9" />
                    <stop offset="100%" style="stop-color:#0ea5e9; stop-opacity:1" />
                </linearGradient>
                
                <!-- Vortex Mask -->
                <radialGradient id="grad-vortex" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#000; stop-opacity:0" />
                    <stop offset="70%" style="stop-color:#000; stop-opacity:0.2" />
                    <stop offset="100%" style="stop-color:#000; stop-opacity:0.8" />
                </radialGradient>
            </defs>

            <!-- Floor Shadow -->
            <ellipse cx="400" cy="660" rx="250" ry="30" fill="#000" opacity="0.5" filter="blur(15px)" />

            <!-- PLUMBING BASE -->
            <g id="plumbing">
                <!-- Wall connection pipe (background) -->
                <rect x="320" y="600" width="160" height="20" fill="#334155" />
                <!-- Floor Flange -->
                <ellipse cx="400" cy="655" rx="90" ry="12" fill="url(#grad-chrome)" />
                <rect x="396" y="620" width="8" height="40" fill="url(#grad-chrome)" />
            </g>

            <!-- TANK (Back Layer) -->
            <g id="tank">
                <!-- Tank Body (3/4 Perspective) -->
                <path d="M280,250 L520,250 C550,250 560,260 560,290 L560,460 C560,500 530,510 490,510 L310,510 C270,510 240,500 240,460 L240,290 C240,260 250,250 280,250 Z" class="ceramic-main" />
                
                <!-- Tank Top Lid -->
                <path d="M240,250 L560,250 C560,250 550,230 520,230 L280,230 C250,230 240,250 240,250 Z" class="ceramic-shadow" />
                
                <!-- Tank Gloss Highlight -->
                <path d="M260,280 L260,480 C260,490 265,500 275,500" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity="0.3" fill="none" />
                
                <!-- Flush Handle (Side Mounted) -->
                <g id="handle-assembly">
                    <!-- Mounting Base -->
                    <path d="M230,350 L240,350 L240,390 L230,390 Z" class="chrome-metal" />
                    <!-- The Lever (Animated) -->
                    <g id="flush-lever" transform="translate(235, 370)">
                        <rect x="-10" y="-5" width="40" height="10" rx="3" class="chrome-metal" />
                        <circle cx="20" cy="0" r="8" class="chrome-metal" />
                    </g>
                </g>
            </g>

            <!-- BOWL (Front Layer) -->
            <g id="bowl">
                <!-- Bowl Exterior -->
                <path d="M220,400 C220,580 300,640 400,640 C500,640 580,580 580,400 L580,380 C580,360 560,350 540,350 L260,350 C240,350 220,360 220,380 Z" class="ceramic-main" />
                
                <!-- Bowl Front Highlight -->
                <path d="M250,450 C250,580 310,620 400,620" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity="0.2" fill="none" />

                <!-- Bowl Rim (Top Lip) -->
                <path d="M240,350 C240,390 320,410 400,410 C480,410 560,390 560,350 L550,340 C550,375 480,395 400,395 C320,395 250,375 250,340 Z" class="ceramic-shadow" />
                
                <!-- The Hole / Inner Depth -->
                <ellipse cx="400" cy="350" rx="150" ry="45" fill="#0f172a" /> <!-- Dark void -->
                
                <!-- Water Surface -->
                <g id="water-group">
                    <ellipse cx="400" cy="350" rx="140" ry="40" class="water-body" />
                    <!-- Water Specular Highlight -->
                    <ellipse cx="360" cy="345" rx="40" ry="10" class="water-highlight" transform="rotate(-10 360 345)" />
                </g>

                <!-- Vortex (Hidden initially) -->
                <g id="vortex-group" opacity="0">
                    <ellipse cx="400" cy="350" rx="140" ry="40" fill="url(#grad-vortex)" />
                    <path d="M400,350 Q350,350 350,380 Q350,410 400,410 Q450,410 450,380 Q450,350 400,350" fill="none" stroke="#bae6fd" stroke-width="2" opacity="0.5" />
                </g>

                <!-- Splash Particles (Hidden) -->
                <g id="splash-particles">
                    <circle cx="380" cy="350" r="3" fill="#fff" class="drop" />
                    <circle cx="420" cy="340" r="4" fill="#fff" class="drop" />
                    <circle cx="390" cy="330" r="2" fill="#fff" class="drop" />
                    <circle cx="410" cy="360" r="3" fill="#fff" class="drop" />
                </g>
            </g>
            
            <!-- Seat (Resting on top) -->
            <g id="seat">
                 <!-- Seat Thickness -->
                 <path d="M250,350 C250,390 320,410 400,410 C480,410 550,390 550,350 L540,340 C540,375 480,395 400,395 C320,395 260,375 260,340 Z" class="ceramic-shadow" />
                 <!-- Seat Top -->
                 <path d="M260,340 C260,375 320,395 400,395 C480,395 540,375 540,340 C540,320 480,310 400,310 C320,310 260,320 260,340 Z" class="ceramic-main" />
                 <!-- Seat Gloss -->
                 <ellipse cx="400" cy="350" rx="80" ry="15" fill="#fff" opacity="0.2" />
            </g>

        </svg>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const flushBtn = document.getElementById('flushBtn');
        const lever = document.getElementById('flush-lever');
        const waterGroup = document.getElementById('water-group');
        const vortexGroup = document.getElementById('vortex-group');
        const particles = document.querySelectorAll('.drop');
        let isFlushing = false;

        flushBtn.addEventListener('click', () => {
            if (isFlushing) return;
            isFlushing = true;

            // 1. Lever Animation (Rotate down)
            lever.style.transition = 'transform 0.1s ease-in';
            lever.style.transform = 'rotate(-20deg)';
            
            setTimeout(() => {
                lever.style.transition = 'transform 0.3s ease-out';
                lever.style.transform = 'rotate(0deg)';
            }, 150);

            // 2. Water Drop (Scale down/fade)
            waterGroup.style.transition = 'all 0.4s ease-in';
            waterGroup.style.transform = 'scale(0.8) translateY(20px)';
            waterGroup.style.opacity = '0.5';

            // 3. Vortex Spin (Fade in and rotate)
            vortexGroup.style.transition = 'all 0.5s ease-in';
            vortexGroup.style.opacity = '1';
            vortexGroup.style.transform = 'rotate(360deg) scale(1.1)';

            // 4. Splash Particles
            particles.forEach((p, i) => {
                p.style.transition = `all 0.4s ease-out ${i * 0.05}s`;
                p.style.opacity = '1';
                // Randomize splash direction
                const tx = (Math.random() - 0.5) * 40;
                const ty = -(Math.random() * 30 + 10);
                p.style.transform = `translate(${tx}px, ${ty}px)`;
            });

            // 5. Reset Sequence
            setTimeout(() => {
                // Hide particles
                particles.forEach(p => {
                    p.style.transition = 'none';
                    p.style.opacity = '0';
                    p.style.transform = 'none';
                });

                // Reset Vortex
                vortexGroup.style.opacity = '0';
                vortexGroup.style.transform = 'rotate(0deg) scale(1)';

                // Refill Water
                waterGroup.style.transition = 'all 1.5s cubic-bezier(0.2, 0.8, 0.2, 1)';
                waterGroup.style.transform = 'scale(1) translateY(0)';
                waterGroup.style.opacity = '0.9';

                setTimeout(() => {
                    isFlushing = false;
                }, 1500);

            }, 800);
        });
    });
</script>
</body>
</html>
