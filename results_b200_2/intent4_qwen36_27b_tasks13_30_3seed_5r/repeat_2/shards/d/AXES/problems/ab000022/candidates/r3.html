<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Bounce: The Lost Glitch</title>
    <style>
        :root {
            /* Palette: Cyberpunk / Retro-Futurism */
            --bg-deep: #050510;
            --neon-pink: #ff00cc;
            --neon-cyan: #00f2ff;
            --neon-yellow: #ffcc00;
            --neon-green: #00ff99;
            --neon-purple: #bd00ff;
            
            /* UI System */
            --glass-bg: rgba(10, 10, 20, 0.4);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-highlight: rgba(255, 255, 255, 0.05);
            
            /* Unified Geometry */
            --radius-lg: 16px;
            --radius-md: 8px;
            
            /* Typography */
            --font-display: 'Arial Black', 'Impact', sans-serif;
            --font-ui: 'Segoe UI', 'Roboto', Helvetica, sans-serif;
            --font-mono: 'Courier New', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-deep);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            color: white;
        }

        /* --- CANVAS BACKGROUND --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Scanlines Overlay */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            z-index: 1;
            pointer-events: none;
            opacity: 0.6;
        }

        /* --- UI LAYOUT --- */
        .ui-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 250px 1fr 300px;
            grid-template-rows: 100px 1fr 100px;
            padding: 30px;
            pointer-events: none; /* Let clicks pass through to canvas if needed */
        }

        /* --- COMPONENT: GLASS PANEL --- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 16px;
            pointer-events: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, border-color 0.2s;
        }

        /* --- HEADER: TITLE & METADATA (Top Left) --- */
        .header-left {
            grid-column: 1;
            grid-row: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            pointer-events: auto;
        }

        .game-title {
            font-family: var(--font-display);
            font-size: 2.8rem;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: -1px;
            background: linear-gradient(180deg, #fff 0%, var(--neon-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 0px rgba(0, 242, 255, 0.3));
            margin-bottom: 8px;
            position: relative;
        }
        
        /* Glitch Text Effect */
        .game-title::before, .game-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.5;
        }
        .game-title::before {
            color: var(--neon-pink);
            z-index: -1;
            transform: translate(-2px, -2px);
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }
        .game-title::after {
            color: var(--neon-cyan);
            z-index: -2;
            transform: translate(2px, 2px);
            clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
            animation: glitch-anim 2s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip-path: inset(20% 0 80% 0); }
            20% { clip-path: inset(60% 0 10% 0); }
            40% { clip-path: inset(40% 0 50% 0); }
            60% { clip-path: inset(80% 0 5% 0); }
            80% { clip-path: inset(10% 0 60% 0); }
            100% { clip-path: inset(30% 0 30% 0); }
        }

        .game-subtitle {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--neon-pink);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
            margin-left: 4px;
            text-shadow: 0 0 8px var(--neon-pink);
            margin-bottom: 20px;
        }

        /* Metadata Group (Level + Stats) */
        .meta-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .level-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--neon-cyan);
            padding: 4px 12px;
            border-radius: 4px;
            width: fit-content;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
        }

        .level-text {
            font-family: var(--font-mono);
            color: var(--neon-cyan);
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .stats-row {
            display: flex;
            gap: 12px;
        }

        .stat-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 0.8rem;
            font-family: var(--font-mono);
            color: #fff;
        }
        
        .stat-icon { width: 16px; height: 16px; }

        /* --- HEADER: WORLD SELECTOR (Top Right) --- */
        .world-selector {
            grid-column: 3;
            grid-row: 1;
            justify-self: end;
            display: flex;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            pointer-events: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .world-info { text-align: right; margin-right: 15px; }
        .world-name { color: #fff; font-weight: bold; font-size: 1rem; text-shadow: 0 0 5px var(--neon-cyan); }
        .world-sub { color: var(--neon-cyan); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }

        .world-card {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #222, #000);
            border: 2px solid var(--neon-green);
            border-radius: 8px;
            display: grid;
            place-items: center;
            color: var(--neon-green);
            font-weight: 900;
            font-family: var(--font-display);
            font-size: 1.2rem;
            box-shadow: 0 0 15px rgba(0, 255, 153, 0.2);
            position: relative;
        }
        
        .world-card::after {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1px dashed rgba(0, 255, 153, 0.5);
            border-radius: 4px;
        }

        /* --- MAIN STAGE (Center) --- */
        .main-stage {
            grid-column: 2;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end; /* Push button to bottom of center area */
            padding-bottom: 40px;
            pointer-events: none;
        }

        /* Start Button */
        .start-btn-container {
            pointer-events: auto;
            position: relative;
            z-index: 20;
        }

        .start-btn {
            position: relative;
            background: linear-gradient(180deg, var(--neon-pink) 0%, #c2009d 100%);
            border: 2px solid rgba(255,255,255,0.2);
            color: white;
            font-family: var(--font-display);
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            padding: 18px 60px;
            cursor: pointer;
            border-radius: var(--radius-lg);
            
            /* Flat but glowing look */
            box-shadow: 
                0 0 20px rgba(255, 0, 204, 0.4),
                0 10px 0 #7a005c,
                0 15px 20px rgba(0,0,0,0.4);
            
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .start-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
            transform: translateX(-100%);
            animation: shine 4s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%); }
            20% { transform: translateX(100%); }
            100% { transform: translateX(100%); }
        }

        .start-btn:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 0 30px rgba(255, 0, 204, 0.6),
                0 14px 0 #7a005c,
                0 20px 30px rgba(0,0,0,0.5);
            filter: brightness(1.1);
        }

        .start-btn:active {
            transform: translateY(8px);
            box-shadow: 
                0 0 10px rgba(255, 0, 204, 0.4),
                0 2px 0 #7a005c,
                0 5px 10px rgba(0,0,0,0.4);
        }

        /* --- CONTROLS (Bottom Left) --- */
        .controls-panel {
            grid-column: 1;
            grid-row: 3;
            align-self: start;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: auto;
            /* Subtle Glass */
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-md);
            padding: 12px;
            font-size: 0.8rem;
        }

        .controls-header {
            font-size: 0.7rem;
            font-weight: bold;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            opacity: 0.8;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 0;
        }

        .key-cap {
            width: 24px;
            height: 24px;
            background: #2a2a35;
            border-radius: 4px;
            border-top: 1px solid #555;
            border-bottom: 2px solid #111;
            display: grid;
            place-items: center;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: bold;
            color: #eee;
            box-shadow: 0 2px 2px rgba(0,0,0,0.5);
        }

        .key-cap.active {
            background: var(--neon-cyan);
            color: #000;
            border-bottom-color: #005566;
            box-shadow: 0 0 5px var(--neon-cyan);
        }

        .control-label {
            color: #aaa;
            font-size: 0.8rem;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 900px) {
            .ui-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr auto;
                padding: 15px;
            }
            .header-left { grid-column: 1; grid-row: 1; flex-direction: row; align-items: center; gap: 20px; margin-bottom: 10px; }
            .game-title { font-size: 1.8rem; margin-bottom: 0; }
            .game-subtitle { display: none; }
            .meta-group { flex-direction: row; }
            .world-selector { grid-column: 1; grid-row: 2; justify-self: center; margin-bottom: 10px; }
            .main-stage { grid-column: 1; grid-row: 3; justify-content: center; }
            .controls-panel { grid-column: 1; grid-row: 4; justify-content: center; width: auto; margin: 0 auto; }
        }
    </style>
</head>
<body>

    <!-- 1. BACKGROUND CANVAS -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- 2. SCANLINES OVERLAY -->
    <div class="scanlines"></div>

    <!-- 3. UI LAYER -->
    <div class="ui-container">
        
        <!-- HEADER: Title & Meta -->
        <header class="header-left">
            <div>
                <h1 class="game-title" data-text="NEON BOUNCE">NEON BOUNCE</h1>
                <div class="game-subtitle">The Lost Glitch</div>
            </div>
            
            <div class="meta-group">
                <div class="level-badge">
                    <span class="level-text">LV 1-1</span>
                </div>
                
                <div class="stats-row">
                    <div class="stat-pill">
                        <svg class="stat-icon" style="color: var(--neon-yellow);" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
                        <span>1,240</span>
                    </div>
                    <div class="stat-pill">
                        <svg class="stat-icon" style="color: var(--neon-pink);" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <span>x 3</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- HEADER: World Selector -->
        <div class="world-selector">
            <div class="world-info">
                <div class="world-name">CYBER PLAINS</div>
                <div class="world-sub">SECTOR 01</div>
            </div>
            <div class="world-card">1</div>
        </div>

        <!-- MAIN CENTER -->
        <main class="main-stage">
            <!-- Button is the only UI element here to unblock the view -->
            <div class="start-btn-container">
                <button class="start-btn" onclick="startGame()">Start Adventure</button>
            </div>
        </main>

        <!-- CONTROLS GUIDE -->
        <div class="controls-panel">
            <div class="controls-header">INPUT</div>
            <div class="control-row">
                <span class="control-label">Jump</span>
                <div class="key-cap active">Z</div>
            </div>
            <div class="control-row">
                <span class="control-label">Dash</span>
                <div class="key-cap">X</div>
            </div>
            <div class="control-row">
                <span class="control-label">Move</span>
                <div style="display: flex; gap: 4px;">
                    <div class="key-cap">←</div>
                    <div class="key-cap">→</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        /**
         * VISUAL DESIGN REVISED:
         * 1. Atmosphere: Added scanlines, reduced sun intensity, improved grid depth.
         * 2. Mascot: Redesigned hero to be a distinct, expressive "Glitch" character (Blue sphere, big shoes, scarf).
         * 3. Level: Added visible platforms, goal flag, coins, and enemies (Bat & Box) to show gameplay.
         * 4. Hierarchy: Cleaned up UI to focus on Title -> Scene -> Button.
         */

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        const colors = {
            skyTop: '#050510',
            skyMid: '#1a0b2e',
            skyBot: '#2d1b4e',
            neonPink: '#ff00cc',
            neonCyan: '#00f2ff',
            neonYellow: '#ffcc00',
            neonGreen: '#00ff99',
            gridLine: 'rgba(0, 242, 255, 0.15)',
            platform: '#1a1a24',
            platformBorder: '#00f2ff'
        };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- DRAWING FUNCTIONS ---

        // 1. Background
        function drawBackground(time) {
            // Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, colors.skyTop);
            grad.addColorStop(0.6, colors.skyMid);
            grad.addColorStop(1, colors.skyBot);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Retro Sun (Reduced scale & opacity)
            const sunY = height * 0.4;
            const sunR = Math.min(width, height) * 0.2;
            
            // Sun Glow
            ctx.shadowBlur = 50;
            ctx.shadowColor = 'rgba(255, 0, 204, 0.5)';
            const sunGrad = ctx.createLinearGradient(0, sunY - sunR, 0, sunY + sunR);
            sunGrad.addColorStop(0, colors.neonPink);
            sunGrad.addColorStop(1, colors.neonYellow);
            ctx.fillStyle = sunGrad;
            
            ctx.beginPath();
            ctx.arc(width * 0.5, sunY, sunR, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Sun Stripes
            ctx.fillStyle = colors.skyMid; 
            for(let i = 0; i < 10; i++) {
                let h = 4 + i * 4;
                let y = sunY + (20 + i * 12);
                if (y < sunY + sunR) {
                    ctx.fillRect(width * 0.5 - sunR, y, sunR * 2, h);
                }
            }

            // Perspective Grid Floor
            ctx.save();
            ctx.strokeStyle = colors.gridLine;
            ctx.lineWidth = 2;
            
            const horizonY = height * 0.4;
            const cx = width / 2;
            
            // Vertical lines
            for (let i = -20; i <= 20; i++) {
                ctx.beginPath();
                ctx.moveTo(cx + (i * 5), horizonY); 
                ctx.lineTo(cx + (i * 400), height); 
                ctx.stroke();
            }

            // Horizontal moving lines
            let offset = (time * 0.1) % 100;
            for (let i = 0; i < 20; i++) {
                let y = horizonY + Math.pow(i, 2.5) + offset;
                if (y > height) y -= (height - horizonY);
                
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            ctx.restore();
        }

        // 2. The Level Preview
        function drawLevel(time) {
            const groundY = height * 0.8;
            
            // Ground Base
            ctx.fillStyle = '#080812';
            ctx.fillRect(0, groundY, width, height - groundY);
            
            // Ground Top Border
            ctx.strokeStyle = colors.neonPink;
            ctx.lineWidth = 4;
            ctx.shadowBlur = 10;
            ctx.shadowColor = colors.neonPink;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(width, groundY);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // --- PLATFORMS ---
            // Platform 1 (Hero Stand)
            drawPlatform(width * 0.2, groundY - 60, 240, 60);
            
            // Platform 2 (Mid air)
            drawPlatform(width * 0.55, groundY - 180, 160, 40);
            
            // Platform 3 (Higher)
            drawPlatform(width * 0.8, groundY - 260, 120, 40);

            // --- GOAL ---
            drawGoal(width * 0.92, groundY - 60);

            // --- COINS ---
            drawCoin(width * 0.55 + 80, groundY - 220, time);
            drawCoin(width * 0.55 + 120, groundY - 220, time + 100);
            drawCoin(width * 0.8 + 60, groundY - 300, time + 200);

            // --- ENEMIES ---
            // Glitch Bat
            drawEnemy(width * 0.65, groundY - 120, time);
            
            // Ground Enemy
            drawGroundEnemy(width * 0.7, groundY, time);
        }

        function drawPlatform(x, y, w, h) {
            ctx.save();
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(x + 10, y + 10, w, h);

            // Body
            ctx.fillStyle = colors.platform;
            ctx.strokeStyle = colors.platformBorder;
            ctx.lineWidth = 2;
            ctx.shadowBlur = 8;
            ctx.shadowColor = colors.platformBorder;
            
            ctx.beginPath();
            // Rounded rect manually for older browser support if needed, but roundRect is standard now
            ctx.roundRect(x, y, w, h, 6);
            ctx.fill();
            ctx.stroke();
            
            // Tech Lines
            ctx.fillStyle = 'rgba(0, 242, 255, 0.3)';
            ctx.fillRect(x + 15, y + h/2 - 2, w - 30, 4);
            ctx.restore();
        }

        function drawGoal(x, y) {
            ctx.save();
            // Pole
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 5;
            ctx.shadowColor = '#fff';
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y - 150);
            ctx.stroke();

            // Flag
            ctx.fillStyle = colors.neonPink;
            ctx.shadowBlur = 15;
            ctx.shadowColor = colors.neonPink;
            ctx.beginPath();
            ctx.moveTo(x, y - 150);
            ctx.lineTo(x + 70, y - 120);
            ctx.lineTo(x, y - 90);
            ctx.fill();
            
            // Base
            ctx.fillStyle = '#333';
            ctx.shadowBlur = 0;
            ctx.fillRect(x - 20, y - 20, 40, 20);
            ctx.restore();
        }

        function drawCoin(x, y, time) {
            ctx.save();
            ctx.translate(x, y);
            const bob = Math.sin(time * 0.005) * 10;
            ctx.translate(0, bob);
            
            const scale = Math.abs(Math.sin(time * 0.01));
            ctx.scale(scale, 1);

            ctx.fillStyle = colors.neonYellow;
            ctx.shadowBlur = 10;
            ctx.shadowColor = colors.neonYellow;
            
            ctx.beginPath();
            ctx.arc(0, 0, 14, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 0, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawEnemy(x, y, time) {
            ctx.save();
            ctx.translate(x, y);
            const float = Math.sin(time * 0.004) * 15;
            ctx.translate(0, float);

            // Body (Diamond)
            ctx.fillStyle = '#ff0055';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff0055';
            
            ctx.beginPath();
            ctx.moveTo(0, -25);
            ctx.lineTo(20, 0);
            ctx.lineTo(0, 25);
            ctx.lineTo(-20, 0);
            ctx.closePath();
            ctx.fill();

            // Eye
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(0, 0, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
        
        function drawGroundEnemy(x, y, time) {
            ctx.save();
            ctx.translate(x, y);
            ctx.translate(0, Math.abs(Math.sin(time * 0.01)) * 5);

            ctx.fillStyle = '#8800ff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#8800ff';
            ctx.fillRect(-15, -30, 30, 30);
            
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(-10, -20, 8, 8);
            ctx.fillRect(2, -20, 8, 8);
            ctx.restore();
        }

        // 3. The Hero (Foreground Mascot)
        function drawHero(time) {
            ctx.save();
            
            // Position: On Platform 1
            const platX = width * 0.2 + 120; 
            const groundY = height * 0.8;
            const platY = groundY - 60;
            
            const hX = platX;
            const hY = platY - 50; 

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath();
            ctx.ellipse(hX, platY, 22, 7, 0, 0, Math.PI*2);
            ctx.fill();

            // Idle Animation
            const breathe = Math.sin(time * 0.006) * 3;

            // Body (Cyan Sphere)
            ctx.fillStyle = colors.neonCyan;
            ctx.shadowBlur = 20;
            ctx.shadowColor = colors.neonCyan;
            
            ctx.beginPath();
            ctx.arc(hX, hY + breathe, 30, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Face Mask (White)
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(hX, hY + breathe, 22, 0, Math.PI * 2);
            ctx.fill();

            // Eyes (Looking right)
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(hX + 10, hY - 5 + breathe, 5, 0, Math.PI * 2);
            ctx.arc(hX - 2, hY - 5 + breathe, 5, 0, Math.PI * 2);
            ctx.fill();

            // Ears (Cyan)
            ctx.fillStyle = colors.neonCyan;
            ctx.beginPath();
            ctx.arc(hX - 24, hY - 22 + breathe, 10, 0, Math.PI * 2);
            ctx.arc(hX + 24, hY - 22 + breathe, 10, 0, Math.PI * 2);
            ctx.fill();

            // Shoes (Orange)
            ctx.fillStyle = '#ff5500';
            ctx.beginPath();
            ctx.ellipse(hX - 14, platY - 8, 12, 7, 0, 0, Math.PI * 2);
            ctx.ellipse(hX + 14, platY - 8, 12, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            // Scarf (Pink Flowing)
            ctx.strokeStyle = colors.neonPink;
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 5;
            ctx.shadowColor = colors.neonPink;
            ctx.beginPath();
            ctx.moveTo(hX - 15, hY - 5 + breathe);
            // Dynamic curve
            const wave = Math.sin(time * 0.01) * 15;
            ctx.quadraticCurveTo(hX - 45, hY - 10 + wave, hX - 70, hY + 10 + wave);
            ctx.stroke();

            ctx.restore();
        }

        // --- MAIN LOOP ---
        function animate(time) {
            ctx.clearRect(0, 0, width, height);

            drawBackground(time);
            drawLevel(time);
            drawHero(time);

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        function startGame() {
            const btn = document.querySelector('.start-btn');
            const originalText = btn.innerText;
            
            btn.style.transform = "translateY(8px)";
            btn.style.boxShadow = "0 0 10px rgba(255, 0, 204, 0.4), 0 2px 0 #7a005c";
            
            btn.innerText = "INITIALIZING...";
            
            setTimeout(() => {
                alert("Game Start! (Demo Mode)");
                btn.innerText = originalText;
                btn.style.transform = "";
                btn.style.boxShadow = "";
            }, 600);
        }
    </script>
</body>
