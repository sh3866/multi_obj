<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Bounce: The Lost Glitch</title>
    <style>
        :root {
            /* Palette: Cyberpunk / Retro-Futurism */
            --bg-deep: #050510;
            --neon-pink: #ff00cc;
            --neon-cyan: #00f2ff;
            --neon-yellow: #ffcc00;
            --neon-green: #00ff99;
            --neon-purple: #bd00ff;
            
            /* UI System */
            --glass-bg: rgba(10, 10, 20, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.05);
            
            /* Typography */
            --font-display: 'Impact', 'Arial Black', sans-serif;
            --font-ui: 'Segoe UI', 'Roboto', Helvetica, sans-serif;
            --font-mono: 'Courier New', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-deep);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            color: white;
        }

        /* --- CANVAS BACKGROUND --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* CRT Scanlines & Vignette */
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%),
                radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.6) 100%);
            background-size: 100% 4px, 100% 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.8;
        }

        /* --- UI LAYOUT --- */
        .ui-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: grid;
            /* 3 Columns: Left UI, Center Stage, Right UI */
            grid-template-columns: 280px 1fr 280px;
            grid-template-rows: auto 1fr auto;
            padding: 30px;
            pointer-events: none; /* Pass clicks to canvas */
        }

        /* --- COMPONENT: GLASS PANEL --- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid var(--glass-border);
            border-radius: 8px;
            padding: 16px;
            pointer-events: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }

        /* Decorative corner accent */
        .glass-panel::after {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 20px; height: 20px;
            background: linear-gradient(135deg, transparent 50%, var(--neon-cyan) 50%);
            opacity: 0.5;
        }

        /* --- HEADER: TITLE & METADATA (Top Left) --- */
        .header-left {
            grid-column: 1;
            grid-row: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .title-group {
            position: relative;
        }

        .game-title {
            font-family: var(--font-display);
            font-size: 4rem;
            line-height: 0.85;
            text-transform: uppercase;
            letter-spacing: -2px;
            color: white;
            /* 3D Layered Text Effect */
            text-shadow: 
                4px 4px 0px var(--neon-pink),
                -2px -2px 0px var(--neon-cyan);
            margin-bottom: 8px;
            filter: drop-shadow(0 0 15px rgba(255, 0, 204, 0.4));
        }
        
        /* Glitch Animation */
        .game-title span {
            display: inline-block;
            position: relative;
        }
        .game-title span::before, .game-title span::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-deep); /* Mask background */
        }
        .game-title span::before {
            left: 2px; text-shadow: -1px 0 var(--neon-cyan);
            clip-path: inset(20% 0 30% 0);
            animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
        }
        .game-title span::after {
            left: -2px; text-shadow: -1px 0 var(--neon-pink);
            clip-path: inset(50% 0 10% 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); }
            20% { clip-path: inset(10% 0 10% 0); }
            40% { clip-path: inset(50% 0 40% 0); }
            60% { clip-path: inset(30% 0 20% 0); }
            80% { clip-path: inset(80% 0 5% 0); }
            100% { clip-path: inset(5% 0 60% 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); }
            20% { clip-path: inset(80% 0 5% 0); }
            40% { clip-path: inset(30% 0 10% 0); }
            60% { clip-path: inset(5% 0 80% 0); }
            80% { clip-path: inset(40% 0 20% 0); }
            100% { clip-path: inset(60% 0 30% 0); }
        }

        .game-subtitle {
            font-family: var(--font-display);
            font-size: 1.4rem;
            color: var(--neon-yellow);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 900;
            text-shadow: 0 0 10px var(--neon-yellow);
            transform: skewX(-10deg);
            margin-left: 5px;
        }

        /* HUD: Stats */
        .hud-stats {
            display: flex;
            gap: 15px;
        }

        .stat-box {
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--neon-cyan);
            padding: 8px 12px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
            position: relative;
        }
        
        /* Scanline effect inside stats */
        .stat-box::before {
            content: ''; position: absolute; top:0; left:0; width:100%; height:100%;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.5) 3px);
            opacity: 0.3;
        }

        .stat-icon {
            width: 24px; height: 24px;
            filter: drop-shadow(0 0 5px currentColor);
        }

        .stat-value {
            font-family: var(--font-mono);
            font-weight: bold;
            font-size: 1.1rem;
            color: #fff;
            letter-spacing: 1px;
        }

        /* --- HEADER: WORLD SELECTOR (Top Right) --- */
        .world-selector {
            grid-column: 3;
            grid-row: 1;
            justify-self: end;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .world-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .world-item {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 4px;
            color: rgba(255,255,255,0.5);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 200px;
            transition: all 0.2s;
        }

        .world-item.active {
            background: rgba(0, 242, 255, 0.1);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
            transform: translateX(-5px);
        }

        .world-item.active::before {
            content: '>>>';
            margin-right: 8px;
            color: var(--neon-pink);
        }

        .world-item.locked {
            opacity: 0.4;
            text-decoration: line-through;
        }

        /* --- MAIN STAGE (Center) --- */
        .main-stage {
            grid-column: 2;
            grid-row: 2;
            /* Button is now at the bottom of the screen */
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 40px;
            pointer-events: none;
        }

        /* Start Button - Glassmorphism + Neon */
        .start-btn-container {
            pointer-events: auto;
            position: relative;
            z-index: 20;
        }

        .start-btn {
            position: relative;
            background: rgba(20, 20, 40, 0.6);
            backdrop-filter: blur(8px);
            border: 2px solid var(--neon-pink);
            color: white;
            font-family: var(--font-display);
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            padding: 20px 70px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Neon Glow */
            box-shadow: 
                0 0 15px var(--neon-pink),
                inset 0 0 20px rgba(255, 0, 204, 0.2);
            
            overflow: hidden;
            transform: skewX(-10deg);
        }

        .start-btn span {
            display: block;
            transform: skewX(10deg); /* Un-skew text */
        }

        /* Button Hover Effects */
        .start-btn:hover {
            background: var(--neon-pink);
            color: #fff;
            box-shadow: 
                0 0 30px var(--neon-pink),
                0 0 60px var(--neon-pink);
            transform: skewX(-10deg) scale(1.05);
            border-color: white;
        }

        .start-btn:active {
            transform: skewX(-10deg) scale(0.95);
        }

        /* --- CONTROLS (Bottom Left) --- */
        .controls-panel {
            grid-column: 1;
            grid-row: 3;
            align-self: end;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
        }

        .controls-header {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
            margin-bottom: 4px;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .key-cap {
            width: 28px;
            height: 28px;
            background: #2a2a35;
            border-radius: 4px;
            border-top: 1px solid #555;
            border-bottom: 3px solid #111;
            display: grid;
            place-items: center;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 2px 2px rgba(0,0,0,0.5);
        }

        .key-cap.active {
            background: var(--neon-cyan);
            color: #000;
            border-bottom-color: #005566;
            box-shadow: 0 0 8px var(--neon-cyan);
        }

        .control-label {
            color: #aaa;
            font-size: 0.8rem;
            font-family: var(--font-mono);
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 1000px) {
            .ui-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr auto;
                padding: 15px;
            }
            .header-left { grid-column: 1; grid-row: 1; flex-direction: row; align-items: center; justify-content: space-between; }
            .game-title { font-size: 2.5rem; }
            .world-selector { display: none; } /* Hide world list on small screens to save space */
            .main-stage { grid-column: 1; grid-row: 3; }
            .controls-panel { grid-column: 1; grid-row: 4; justify-content: center; width: auto; margin: 0 auto; }
        }
    </style>
</head>
<body>

    <!-- 1. BACKGROUND CANVAS -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- 2. CRT OVERLAY -->
    <div class="crt-overlay"></div>

    <!-- 3. UI LAYER -->
    <div class="ui-container">
        
        <!-- HEADER: Title & Meta -->
        <header class="header-left">
            <div class="title-group">
                <h1 class="game-title"><span data-text="NEON BOUNCE">NEON BOUNCE</span></h1>
                <div class="game-subtitle">The Lost Glitch</div>
            </div>
            
            <!-- HUD: Stats -->
            <div class="hud-stats">
                <div class="stat-box">
                    <svg class="stat-icon" style="color: var(--neon-yellow);" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6z"/>
                        <circle cx="12" cy="12" r="5" fill="rgba(255,255,255,0.3)"/>
                    </svg>
                    <span class="stat-value">1,240</span>
                </div>
                <div class="stat-box">
                    <svg class="stat-icon" style="color: var(--neon-pink);" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                    <span class="stat-value">x 3</span>
                </div>
            </div>
        </header>

        <!-- HEADER: World Selector -->
        <div class="world-selector">
            <div class="world-list">
                <div class="world-item active">
                    <span>CYBER PLAINS</span>
                    <span>LV 1</span>
                </div>
                <div class="world-item">
                    <span>NEON SECTOR</span>
                    <span>LV 2</span>
                </div>
                <div class="world-item locked">
                    <span>GLITCH CORE</span>
                    <span>???</span>
                </div>
            </div>
        </div>

        <!-- MAIN CENTER -->
        <main class="main-stage">
            <div class="start-btn-container">
                <button class="start-btn" onclick="startGame()">
                    <span>Start Adventure</span>
                </button>
            </div>
        </main>

        <!-- CONTROLS GUIDE -->
        <div class="controls-panel">
            <div class="controls-header">SYSTEM INPUT</div>
            <div class="control-row">
                <span class="control-label">JUMP</span>
                <div class="key-cap active">Z</div>
            </div>
            <div class="control-row">
                <span class="control-label">DASH</span>
                <div class="key-cap">X</div>
            </div>
            <div class="control-row">
                <span class="control-label">MOVE</span>
                <div style="display: flex; gap: 4px;">
                    <div class="key-cap">←</div>
                    <div class="key-cap">→</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        /**
         * VISUAL DESIGN REVISED:
         * 1. Atmosphere: Added scanlines, reduced sun intensity, improved grid depth.
         * 2. Mascot: Redesigned hero to be a distinct, expressive "Glitch" character (Blue sphere, big shoes, scarf).
         * 3. Level: Added visible platforms, goal flag, coins, and enemies (Bat & Box) to show gameplay.
         * 4. Hierarchy: Cleaned up UI to focus on Title -> Scene -> Button.
         */

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        const colors = {
            skyTop: '#050510',
            skyMid: '#1a0b2e',
            skyBot: '#2d1b4e',
            neonPink: '#ff00cc',
            neonCyan: '#00f2ff',
            neonYellow: '#ffcc00',
            neonGreen: '#00ff99',
            gridLine: 'rgba(0, 242, 255, 0.15)',
            platform: '#1a1a24',
            platformBorder: '#00f2ff'
        };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- DRAWING FUNCTIONS ---

        // 1. Background
        function drawBackground(time) {
            // Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, colors.skyTop);
            grad.addColorStop(0.6, colors.skyMid);
            grad.addColorStop(1, colors.skyBot);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Retro Sun (Reduced scale & opacity)
            const sunY = height * 0.4;
            const sunR = Math.min(width, height) * 0.15; // Smaller sun
            
            // Sun Glow
            ctx.shadowBlur = 60;
            ctx.shadowColor = 'rgba(255, 0, 204, 0.4)';
            const sunGrad = ctx.createLinearGradient(0, sunY - sunR, 0, sunY + sunR);
            sunGrad.addColorStop(0, colors.neonPink);
            sunGrad.addColorStop(1, colors.neonYellow);
            ctx.fillStyle = sunGrad;
            
            ctx.beginPath();
            ctx.arc(width * 0.5, sunY, sunR, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Sun Stripes (Retro style)
            ctx.fillStyle = colors.skyMid; 
            for(let i = 0; i < 12; i++) {
                let h = 4 + i * 4;
                let y = sunY + (20 + i * 10);
                if (y < sunY + sunR) {
                    ctx.fillRect(width * 0.5 - sunR, y, sunR * 2, h);
                }
            }

            // Perspective Grid Floor (Warped Terrain)
            ctx.save();
            ctx.strokeStyle = colors.gridLine;
            ctx.lineWidth = 2;
            
            const horizonY = height * 0.55; // Horizon pushed down
            const cx = width / 2;
            
            // Vertical lines
            for (let i = -20; i <= 20; i++) {
                ctx.beginPath();
                // Curve the lines slightly for a "warping" effect
                let curve = Math.sin(i * 0.5 + time * 0.001) * 20;
                ctx.moveTo(cx + (i * 5), horizonY); 
                ctx.quadraticCurveTo(cx + (i * 200) + curve, height * 0.8, cx + (i * 400), height); 
                ctx.stroke();
            }

            // Horizontal moving lines
            let offset = (time * 0.15) % 100;
            for (let i = 0; i < 15; i++) {
                let y = horizonY + Math.pow(i, 2.5) + offset;
                if (y > height) y -= (height - horizonY);
                
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            ctx.restore();
        }

        // 2. The Level Preview
        function drawLevel(time) {
            const groundY = height * 0.85;
            
            // Ground Base
            ctx.fillStyle = '#080812';
            ctx.fillRect(0, groundY, width, height - groundY);
            
            // Ground Top Border
            ctx.strokeStyle = colors.neonPink;
            ctx.lineWidth = 4;
            ctx.shadowBlur = 10;
            ctx.shadowColor = colors.neonPink;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(width, groundY);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // --- PLATFORMS ---
            // Platform 1 (Hero Stand)
            drawPlatform(width * 0.25, groundY - 80, 200, 80);
            
            // Platform 2 (Mid air)
            drawPlatform(width * 0.55, groundY - 200, 180, 40);
            
            // Platform 3 (Higher)
            drawPlatform(width * 0.8, groundY - 320, 140, 40);

            // --- GOAL ---
            drawGoal(width * 0.92, groundY - 80);

            // --- COINS ---
            drawCoin(width * 0.55 + 90, groundY - 240, time);
            drawCoin(width * 0.55 + 130, groundY - 240, time + 100);
            drawCoin(width * 0.8 + 70, groundY - 360, time + 200);

            // --- ENEMIES ---
            // Glitch Bat
            drawEnemy(width * 0.65, groundY - 140, time);
            
            // Ground Enemy
            drawGroundEnemy(width * 0.7, groundY, time);
        }

        function drawPlatform(x, y, w, h) {
            ctx.save();
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(x + 15, y + 15, w, h);

            // Body
            ctx.fillStyle = colors.platform;
            ctx.strokeStyle = colors.platformBorder;
            ctx.lineWidth = 3;
            ctx.shadowBlur = 10;
            ctx.shadowColor = colors.platformBorder;
            
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 6);
            ctx.fill();
            ctx.stroke();
            
            // Tech Lines
            ctx.fillStyle = 'rgba(0, 242, 255, 0.4)';
            ctx.fillRect(x + 20, y + h/2 - 2, w - 40, 4);
            
            // Glitch artifact on platform
            if(Math.random() > 0.95) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fillRect(x + Math.random()*w, y + Math.random()*h, 10, 2);
            }

            ctx.restore();
        }

        function drawGoal(x, y) {
            ctx.save();
            // Pole
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 5;
            ctx.shadowColor = '#fff';
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y - 150);
            ctx.stroke();

            // Flag
            ctx.fillStyle = colors.neonPink;
            ctx.shadowBlur = 15;
            ctx.shadowColor = colors.neonPink;
            ctx.beginPath();
            ctx.moveTo(x, y - 150);
            ctx.lineTo(x + 70, y - 120);
            ctx.lineTo(x, y - 90);
            ctx.fill();
            
            // Base
            ctx.fillStyle = '#333';
            ctx.shadowBlur = 0;
            ctx.fillRect(x - 20, y - 20, 40, 20);
            ctx.restore();
        }

        function drawCoin(x, y, time) {
            ctx.save();
            ctx.translate(x, y);
            const bob = Math.sin(time * 0.005) * 10;
            ctx.translate(0, bob);
            
            const scale = Math.abs(Math.sin(time * 0.01));
            ctx.scale(scale, 1);

            ctx.fillStyle = colors.neonYellow;
            ctx.shadowBlur = 15;
            ctx.shadowColor = colors.neonYellow;
            
            ctx.beginPath();
            ctx.arc(0, 0, 14, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 0, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawEnemy(x, y, time) {
            ctx.save();
            ctx.translate(x, y);
            const float = Math.sin(time * 0.004) * 15;
            ctx.translate(0, float);

            // Body (Diamond)
            ctx.fillStyle = '#ff0055';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff0055';
            
            ctx.beginPath();
            ctx.moveTo(0, -25);
            ctx.lineTo(20, 0);
            ctx.lineTo(0, 25);
            ctx.lineTo(-20, 0);
            ctx.closePath();
            ctx.fill();

            // Eye
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(0, 0, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
        
        function drawGroundEnemy(x, y, time) {
            ctx.save();
            ctx.translate(x, y);
            ctx.translate(0, Math.abs(Math.sin(time * 0.01)) * 5);

            ctx.fillStyle = '#8800ff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#8800ff';
            ctx.fillRect(-15, -30, 30, 30);
            
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(-10, -20, 8, 8);
            ctx.fillRect(2, -20, 8, 8);
            ctx.restore();
        }

        // 3. The Hero (Foreground Mascot)
        function drawHero(time) {
            ctx.save();
            
            // Position: On Platform 1
            const platX = width * 0.25 + 100; 
            const groundY = height * 0.85;
            const platY = groundY - 80;
            
            const hX = platX;
            const hY = platY - 60; 

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath();
            ctx.ellipse(hX, platY, 25, 8, 0, 0, Math.PI*2);
            ctx.fill();

            // Idle Animation
            const breathe = Math.sin(time * 0.006) * 4;

            // Body (Cyan Sphere)
            ctx.fillStyle = colors.neonCyan;
            ctx.shadowBlur = 25;
            ctx.shadowColor = colors.neonCyan;
            
            ctx.beginPath();
            ctx.arc(hX, hY + breathe, 35, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Face Mask (White)
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(hX, hY + 5 + breathe, 26, 0, Math.PI * 2);
            ctx.fill();

            // Eyes (Looking right)
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(hX + 12, hY + breathe, 6, 0, Math.PI * 2);
            ctx.arc(hX - 4, hY + breathe, 6, 0, Math.PI * 2);
            ctx.fill();

            // Ears (Cyan)
            ctx.fillStyle = colors.neonCyan;
            ctx.beginPath();
            ctx.arc(hX - 28, hY - 25 + breathe, 12, 0, Math.PI * 2);
            ctx.arc(hX + 28, hY - 25 + breathe, 12, 0, Math.PI * 2);
            ctx.fill();

            // Shoes (Orange - Big Mascot Style)
            ctx.fillStyle = '#ff5500';
            ctx.beginPath();
            ctx.ellipse(hX - 16, platY - 10, 16, 9, 0, 0, Math.PI * 2);
            ctx.ellipse(hX + 16, platY - 10, 16, 9, 0, 0, Math.PI * 2);
            ctx.fill();

            // Scarf (Pink Flowing)
            ctx.strokeStyle = colors.neonPink;
            ctx.lineWidth = 12;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 10;
            ctx.shadowColor = colors.neonPink;
            ctx.beginPath();
            ctx.moveTo(hX - 15, hY - 5 + breathe);
            // Dynamic curve
            const wave = Math.sin(time * 0.01) * 20;
            ctx.quadraticCurveTo(hX - 50, hY - 10 + wave, hX - 80, hY + 10 + wave);
            ctx.stroke();

            ctx.restore();
        }

        // --- MAIN LOOP ---
        function animate(time) {
            ctx.clearRect(0, 0, width, height);

            drawBackground(time);
            drawLevel(time);
            drawHero(time);

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        function startGame() {
            const btn = document.querySelector('.start-btn');
            const originalText = btn.querySelector('span').innerText;
            
            btn.style.transform = "skewX(-10deg) scale(0.95)";
            
            btn.querySelector('span').innerText = "LOADING...";
            
            setTimeout(() => {
                alert("Game Start! (Demo Mode)");
                btn.querySelector('span').innerText = originalText;
                btn.style.transform = "skewX(-10deg)";
            }, 600);
        }
    </script>
</body>
</html>
