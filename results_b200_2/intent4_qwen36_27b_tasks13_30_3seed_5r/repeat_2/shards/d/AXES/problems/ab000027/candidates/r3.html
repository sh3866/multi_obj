<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trifolium Specimen Study</title>
<style>
  :root {
    /* Colors: Natural, muted, botanical ink & pigment palette */
    --bg-paper: #F2F0E9;
    --ink-main: #2A302C;
    --ink-light: #6B736B;
    --ink-faint: #9BA39B;
    
    --green-dark: #2F4F36;
    --green-mid: #4A7052;
    --green-light: #7A9E7D;
    --green-pale: #C1D8C2;
    --green-highlight: #E8F3E8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-paper);
    color: var(--ink-main);
    font-family: 'Garamond', 'Georgia', 'Times New Roman', serif;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    /* Simulate paper texture using noise */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
  }

  .study-container {
    position: relative;
    width: 100vmin;
    height: 100vmin;
    max-width: 1000px;
    max-height: 1000px;
    /* Slight rotation to simulate paper on a desk */
    transform: rotate(-1deg); 
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Typography */
  .typo-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  .header-block {
    position: absolute;
    top: 6%;
    left: 5%;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .fig-label {
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--ink-light);
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--ink-light);
    padding-bottom: 4px;
    width: 120px;
  }

  .title-block {
    margin-top: 0.5rem;
  }

  .title-main {
    font-size: 3.5rem;
    font-weight: 400;
    font-style: italic;
    color: var(--ink-main);
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .title-sub {
    font-size: 1rem;
    font-weight: 400;
    color: var(--ink-light);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    margin-top: 0.2rem;
  }

  .meta-data {
    position: absolute;
    bottom: 6%;
    left: 5%;
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.7rem;
    color: var(--ink-light);
    line-height: 1.4;
    opacity: 0.8;
  }

  /* SVG Styles */
  svg.plant-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .stem-line {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .vein-stroke {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .annotation-group {
    opacity: 0.8;
  }
  
  .annotation-line {
    stroke: var(--ink-light);
    stroke-width: 0.5pt;
    fill: none;
    vector-effect: non-scaling-stroke;
  }

  .annotation-text {
    font-family: 'Garamond', serif;
    font-size: 12px;
    fill: var(--ink-light);
    letter-spacing: 0.05em;
    font-style: italic;
  }

</style>
</head>
<body>

  <div class="study-container">
    
    <!-- Typography Layer -->
    <div class="typo-layer">
      <div class="header-block">
        <div class="fig-label">FIG. I</div>
        <div class="title-block">
          <h1 class="title-main">Trifolium</h1>
          <h2 class="title-sub">Leguminosae</h2>
        </div>
      </div>
      
      <div class="meta-data">
        COLLECTED: 14 MAY 1924<br>
        LOC: 45.4211° N, 75.6919° W<br>
        ALT: 142M
      </div>
    </div>

    <!-- The Specimen -->
    <svg class="plant-svg" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 
          Leaf Gradient: 
          Simulates light hitting a slightly cupped leaf.
          Pale center (highlight), mid-green, dark edges (shadow).
        -->
        <radialGradient id="leafFill" cx="45%" cy="55%" r="75%" fx="45%" fy="55%">
          <stop offset="0%" stop-color="var(--green-pale)" />
          <stop offset="40%" stop-color="var(--green-mid)" />
          <stop offset="85%" stop-color="var(--green-dark)" />
          <stop offset="100%" stop-color="#1A2E20" />
        </radialGradient>

        <!-- 
          Stem Gradient: 
          Simulates cylindrical volume.
        -->
        <linearGradient id="stemFill" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#1A2E20" />
          <stop offset="40%" stop-color="var(--green-dark)" />
          <stop offset="80%" stop-color="var(--green-mid)" />
          <stop offset="100%" stop-color="var(--green-light)" />
        </linearGradient>

        <!-- 
          Leaflet Path:
          Hand-drawn style cordate shape.
          Includes a distinct notch (sinus) at the base and organic serrations along the edge.
        -->
        <path id="leaflet-shape" 
              d="M 0,0
                 C -5,-15 -15,-25 -25,-25
                 C -40,-25 -55,-15 -65,-5
                 L -68,-8 L -64,-12 L -68,-15 L -62,-18
                 C -85,-25 -95,-15 -90,-5
                 L -93,-2 L -98,-6 L -95,0 L -98,4
                 C -95,25 -75,40 -55,45
                 L -52,47 L -50,42 L -48,46 L -45,48
                 C -25,50 -10,45 -5,35
                 C 0,25 0,10 0,0
                 Z
                 M 0,0
                 C 5,-15 15,-25 25,-25
                 C 40,-25 55,-15 65,-5
                 L 68,-8 L 64,-12 L 68,-15 L 62,-18
                 C 85,-25 95,-15 90,-5
                 L 93,-2 L 98,-6 L 95,0 L 98,4
                 C 95,25 75,40 55,45
                 L 52,47 L 50,42 L 48,46 L 45,48
                 C 25,50 10,45 5,35
                 C 0,25 0,10 0,0
                 Z" 
              fill="url(#leafFill)" />

        <!-- 
          Vein Network:
          Organic, slightly irregular branching.
        -->
        <g id="leaflet-veins" stroke="var(--green-dark)" opacity="0.6">
          <!-- Midrib -->
          <path d="M 0,0 C 0,15 -2,30 0,42" stroke-width="2.5" class="vein-stroke" />
          
          <!-- Secondary Veins Left -->
          <path d="M -2,8 C -15,10 -30,5 -50,0" stroke-width="1.5" class="vein-stroke" />
          <path d="M -2,18 C -20,22 -40,18 -60,15" stroke-width="1.2" class="vein-stroke" />
          <path d="M -2,28 C -10,32 -25,32 -40,28" stroke-width="1" class="vein-stroke" />
          <path d="M -2,38 C -8,42 -15,42 -22,38" stroke-width="0.8" class="vein-stroke" />
          
          <!-- Tertiary Veins Left (Interconnecting) -->
          <path d="M -15,10 L -25,20" stroke-width="0.5" class="vein-stroke" />
          <path d="M -35,8 L -45,18" stroke-width="0.5" class="vein-stroke" />
          <path d="M -25,20 L -35,30" stroke-width="0.5" class="vein-stroke" />

          <!-- Secondary Veins Right -->
          <path d="M 2,8 C 15,10 30,5 50,0" stroke-width="1.5" class="vein-stroke" />
          <path d="M 2,18 C 20,22 40,18 60,15" stroke-width="1.2" class="vein-stroke" />
          <path d="M 2,28 C 10,32 25,32 40,28" stroke-width="1" class="vein-stroke" />
          <path d="M 2,38 C 8,42 15,42 22,38" stroke-width="0.8" class="vein-stroke" />

          <!-- Tertiary Veins Right -->
          <path d="M 15,10 L 25,20" stroke-width="0.5" class="vein-stroke" />
          <path d="M 35,8 L 45,18" stroke-width="0.5" class="vein-stroke" />
          <path d="M 25,20 L 35,30" stroke-width="0.5" class="vein-stroke" />
        </g>

      </defs>

      <!-- Main Stem Group -->
      <g id="stem-group">
        <!-- Curved Main Stem (Organic S-Curve) -->
        <path d="M 400,750 C 420,650 370,500 400,380" 
              fill="none" 
              stroke="url(#stemFill)" 
              stroke-width="12" 
              class="stem-line" />
        
        <!-- Stem Highlight (Volume) -->
        <path d="M 400,750 C 420,650 370,500 400,380" 
              fill="none" 
              stroke="#FFFFFF" 
              stroke-width="1.5" 
              opacity="0.2"
              transform="translate(-3, 0)" 
              class="stem-line" />

        <!-- Petioles (Connecting stems) -->
        <!-- Left Petiole -->
        <path d="M 396,380 C 360,360 320,310 280,290" 
              fill="none" stroke="url(#stemFill)" stroke-width="8" class="stem-line"/>
        <!-- Right Petiole -->
        <path d="M 404,380 C 440,360 480,310 520,290" 
              fill="none" stroke="url(#stemFill)" stroke-width="8" class="stem-line"/>
        <!-- Top Petiole -->
        <path d="M 400,380 C 400,340 395,240 400,160" 
              fill="none" stroke="url(#stemFill)" stroke-width="8" class="stem-line"/>
      </g>

      <!-- Leaves Group -->
      <g id="leaves-group">
        
        <!-- Left Leaflet (Slightly angled down) -->
        <g class="leaflet-group" transform="translate(280, 290) rotate(-50) scale(0.95)">
          <use href="#leaflet-shape" />
          <use href="#leaflet-veins" />
          <!-- Edge definition for clarity -->
          <use href="#leaflet-shape" fill="none" stroke="var(--green-dark)" stroke-width="1" opacity="0.4" />
        </g>

        <!-- Right Leaflet (Slightly angled down) -->
        <g class="leaflet-group" transform="translate(520, 290) rotate(50) scale(0.95)">
          <use href="#leaflet-shape" />
          <use href="#leaflet-veins" />
          <use href="#leaflet-shape" fill="none" stroke="var(--green-dark)" stroke-width="1" opacity="0.4" />
        </g>

        <!-- Top Leaflet (Dominant, upright) -->
        <g class="leaflet-group" transform="translate(400, 160) rotate(0) scale(1.15)">
          <use href="#leaflet-shape" />
          <use href="#leaflet-veins" />
          <use href="#leaflet-shape" fill="none" stroke="var(--green-dark)" stroke-width="1" opacity="0.4" />
        </g>

      </g>

      <!-- Scientific Annotations -->
      <g id="annotations" class="annotation-group">
        
        <!-- Serration Callout -->
        <g transform="translate(0, 0)">
          <!-- Target Point on Left Leaf Edge -->
          <circle cx="215" cy="260" r="1.5" fill="var(--ink-light)" />
          <!-- Line -->
          <path class="annotation-line" d="M 215,260 C 180,230 150,230 130,220" />
          <!-- Label -->
          <text x="125" y="224" class="annotation-text" text-anchor="end">Serration</text>
        </g>
        
        <!-- Venation Callout -->
        <g transform="translate(0, 0)">
          <!-- Target Point on Top Leaf Center -->
          <circle cx="400" cy="210" r="1.5" fill="var(--ink-light)" />
          <!-- Line -->
          <path class="annotation-line" d="M 400,210 C 450,190 500,190 530,180" />
          <!-- Label -->
          <text x="535" y="184" class="annotation-text" text-anchor="start">Venation</text>
        </g>

        <!-- Petiole Callout -->
        <g transform="translate(0, 0)">
           <!-- Target Point on Stem -->
           <circle cx="370" cy="340" r="1.5" fill="var(--ink-light)" />
           <!-- Line -->
           <path class="annotation-line" d="M 370,340 C 340,370 320,390 300,400" />
           <!-- Label -->
           <text x="295" y="404" class="annotation-text" text-anchor="end">Petiole</text>
        </g>

      </g>

    </svg>
  </div>

</body>
</html>
