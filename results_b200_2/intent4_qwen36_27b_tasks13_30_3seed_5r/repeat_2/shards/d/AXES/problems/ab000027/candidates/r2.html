<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trifolium pratense | Specimen Study</title>
<style>
  :root {
    --bg-paper: #F4F1EB;
    --ink-color: #2C332C;
    --ink-faint: #6D766D;
    
    /* Palette */
    --green-deep: #1E3F20;
    --green-mid: #4B6E41;
    --green-light: #8DA885;
    --green-pale: #C6D7C0;
    --green-highlight: #E3EFE0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-paper);
    color: var(--ink-color);
    font-family: 'Garamond', 'Georgia', serif;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    /* Subtle paper noise */
    background-image: radial-gradient(#dcd8cf 1px, transparent 1px);
    background-size: 20px 20px;
  }

  .study-container {
    position: relative;
    width: 90vmin;
    height: 90vmin;
    max-width: 900px;
    max-height: 900px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Typography System */
  .text-block {
    position: absolute;
    font-family: 'Garamond', 'Georgia', serif;
    color: var(--ink-color);
    pointer-events: none;
    z-index: 10;
  }

  /* Top Left: Figure Label */
  .label-fig {
    top: 5%;
    left: 5%;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.8;
    border-left: 2px solid var(--ink-color);
    padding-left: 12px;
    line-height: 1.5;
  }
  .label-fig span {
    display: block;
    font-size: 0.7rem;
    color: var(--ink-faint);
    font-style: italic;
    text-transform: none;
    margin-top: 4px;
  }

  /* Bottom Left: Title Block (Anchored) */
  .label-title {
    bottom: 5%;
    left: 5%;
    text-align: left;
  }
  .label-title h1 {
    font-size: 2.2rem;
    font-weight: 400;
    font-style: italic;
    letter-spacing: -0.02em;
    margin-bottom: 0.1rem;
  }
  .label-title h2 {
    font-size: 0.9rem;
    font-weight: 400;
    letter-spacing: 0.05em;
    color: var(--ink-faint);
    text-transform: uppercase;
  }

  /* SVG Styles */
  svg.plant-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    /* Subtle organic sway */
    animation: sway 12s ease-in-out infinite alternate;
    transform-origin: bottom center;
  }

  @keyframes sway {
    0% { transform: rotate(-0.5deg) skewX(-0.5deg); }
    100% { transform: rotate(0.5deg) skewX(0.5deg); }
  }

  .vein-stroke {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  
  .annotation-line {
    stroke: var(--ink-faint);
    stroke-width: 0.5;
    fill: none;
    stroke-dasharray: 3 3;
    opacity: 0.6;
  }
  
  .annotation-dot {
    fill: var(--ink-color);
  }

  .annotation-text {
    font-family: 'Garamond', serif;
    font-size: 11px;
    fill: var(--ink-faint);
    letter-spacing: 0.05em;
    text-transform: lowercase;
  }

</style>
</head>
<body>

  <div class="study-container">
    
    <!-- Top Left Metadata -->
    <div class="text-block label-fig">
      Fig. I.
      <span>Collected: 14 May 1924</span>
    </div>

    <!-- Bottom Left Title -->
    <div class="text-block label-title">
      <h1>Trifolium</h1>
      <h2>Leguminosae</h2>
    </div>

    <!-- The Specimen -->
    <svg class="plant-svg" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 
          Watercolor-style gradient:
          Pale center (light hitting it) -> Mid Green -> Dark Edge 
        -->
        <radialGradient id="leafFill" cx="50%" cy="40%" r="75%" fx="50%" fy="30%">
          <stop offset="0%" stop-color="var(--green-highlight)" />
          <stop offset="35%" stop-color="var(--green-light)" />
          <stop offset="70%" stop-color="var(--green-mid)" />
          <stop offset="95%" stop-color="var(--green-deep)" />
          <stop offset="100%" stop-color="#142916" />
        </radialGradient>

        <!-- Stem Gradient -->
        <linearGradient id="stemFill" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="var(--green-deep)" />
          <stop offset="50%" stop-color="var(--green-mid)" />
          <stop offset="100%" stop-color="var(--green-light)" />
        </linearGradient>

        <!-- Complex Leaflet Path with Organic Serrations -->
        <path id="leaflet-path" d="
          M 0,0
          C -15,-10 -25,-30 -20,-50
          C -25,-65 -10,-80 0,-85
          C 10,-80 25,-65 20,-50
          C 25,-30 15,-10 0,0
          Z
          M 0,0
          C -35,-20 -80,-25 -100,-10
          C -115,5 -110,30 -90,45
          C -75,60 -50,65 -30,60
          C -15,55 -5,40 0,0
          Z
          M 0,0
          C 35,-20 80,-25 100,-10
          C 115,5 110,30 90,45
          C 75,60 50,65 30,60
          C 15,55 5,40 0,0
          Z
        " fill="url(#leafFill)" stroke="none" />

        <!-- 
           A more detailed leaflet path that includes the serrations directly in the geometry 
           to avoid the "floating triangle" look.
        -->
        <path id="leaflet-shape-detailed" 
              d="M 0,0
                 C -10,-20 -20,-40 -15,-60
                 L -12,-62 L -18,-60 L -14,-63 L -20,-60
                 C -30,-65 -45,-65 -60,-60
                 L -62,-58 L -65,-62 L -68,-57 L -72,-60
                 C -90,-50 -105,-30 -100,-10
                 L -102,-8 L -108,-12 L -105,-5 L -108,0
                 C -105,20 -95,35 -80,45
                 L -78,47 L -75,42 L -72,46 L -70,48
                 C -55,55 -35,55 -20,45
                 C -10,35 -5,20 0,0
                 Z
                 M 0,0
                 C 10,-20 20,-40 15,-60
                 L 12,-62 L 18,-60 L 14,-63 L 20,-60
                 C 30,-65 45,-65 60,-60
                 L 62,-58 L 65,-62 L 68,-57 L 72,-60
                 C 90,-50 105,-30 100,-10
                 L 102,-8 L 108,-12 L 105,-5 L 108,0
                 C 105,20 95,35 80,45
                 L 78,47 L 75,42 L 72,46 L 70,48
                 C 55,55 35,55 20,45
                 C 10,35 5,20 0,0
                 Z" 
              fill="url(#leafFill)" />
      
        <!-- Vein Template -->
        <g id="leaflet-veins" stroke="var(--green-deep)" opacity="0.4">
          <!-- Midrib -->
          <path d="M 0,0 C 0,20 0,40 0,55" stroke-width="2.5" class="vein-stroke" />
          
          <!-- Secondary Veins Left -->
          <path d="M -2,10 C -20,15 -40,10 -60,0" stroke-width="1.5" class="vein-stroke" />
          <path d="M -2,20 C -25,25 -50,20 -75,15" stroke-width="1.2" class="vein-stroke" />
          <path d="M -2,30 C -15,35 -30,35 -45,30" stroke-width="1" class="vein-stroke" />
          <path d="M -2,40 C -10,45 -20,45 -30,40" stroke-width="0.8" class="vein-stroke" />
          
          <!-- Tertiary Veins Left (Cross-hatching) -->
          <path d="M -15,12 L -25,22" stroke-width="0.5" class="vein-stroke" />
          <path d="M -40,12 L -50,22" stroke-width="0.5" class="vein-stroke" />
          <path d="M -30,22 L -40,32" stroke-width="0.5" class="vein-stroke" />

          <!-- Secondary Veins Right -->
          <path d="M 2,10 C 20,15 40,10 60,0" stroke-width="1.5" class="vein-stroke" />
          <path d="M 2,20 C 25,25 50,20 75,15" stroke-width="1.2" class="vein-stroke" />
          <path d="M 2,30 C 15,35 30,35 45,30" stroke-width="1" class="vein-stroke" />
          <path d="M 2,40 C 10,45 20,45 30,40" stroke-width="0.8" class="vein-stroke" />

          <!-- Tertiary Veins Right -->
          <path d="M 15,12 L 25,22" stroke-width="0.5" class="vein-stroke" />
          <path d="M 40,12 L 50,22" stroke-width="0.5" class="vein-stroke" />
          <path d="M 30,22 L 40,32" stroke-width="0.5" class="vein-stroke" />
        </g>

      </defs>

      <!-- Main Stem Group -->
      <g id="stem-group">
        <!-- Curved Main Stem (Thicker for stability) -->
        <path d="M 400,780 C 440,650 370,480 400,320" 
              fill="none" 
              stroke="url(#stemFill)" 
              stroke-width="14" 
              stroke-linecap="round" />
        
        <!-- Stem Texture/Highlight -->
        <path d="M 400,780 C 440,650 370,480 400,320" 
              fill="none" 
              stroke="#FFFFFF" 
              stroke-width="2" 
              opacity="0.15"
              transform="translate(-2, 0)" />

        <!-- Petioles (Connecting stems) -->
        <!-- Left Petiole -->
        <path d="M 395,320 C 360,300 320,260 290,250" 
              fill="none" stroke="url(#stemFill)" stroke-width="10" stroke-linecap="round"/>
        <!-- Right Petiole -->
        <path d="M 405,320 C 440,300 480,260 510,250" 
              fill="none" stroke="url(#stemFill)" stroke-width="10" stroke-linecap="round"/>
        <!-- Top Petiole -->
        <path d="M 400,320 C 400,280 395,200 400,150" 
              fill="none" stroke="url(#stemFill)" stroke-width="10" stroke-linecap="round"/>
      </g>

      <!-- Leaves Group -->
      <g id="leaves-group">
        
        <!-- Left Leaflet -->
        <g class="leaflet-group" transform="translate(290, 250) rotate(-60) scale(0.9)">
          <use href="#leaflet-shape-detailed" />
          <use href="#leaflet-veins" />
          <!-- Subtle inner shadow/highlight for volume -->
          <path d="M 0,0 C -35,-20 -80,-25 -100,-10 C -115,5 -110,30 -90,45 C -75,60 -50,65 -30,60 C -15,55 -5,40 0,0 Z" 
                fill="none" stroke="var(--green-deep)" stroke-width="1" opacity="0.3" />
        </g>

        <!-- Right Leaflet -->
        <g class="leaflet-group" transform="translate(510, 250) rotate(60) scale(0.9)">
          <use href="#leaflet-shape-detailed" />
          <use href="#leaflet-veins" />
          <path d="M 0,0 C 35,-20 80,-25 100,-10 C 115,5 110,30 90,45 C 75,60 50,65 30,60 C 15,55 5,40 0,0 Z" 
                fill="none" stroke="var(--green-deep)" stroke-width="1" opacity="0.3" />
        </g>

        <!-- Top Leaflet (Dominant) -->
        <g class="leaflet-group" transform="translate(400, 150) rotate(5) scale(1.1)">
          <use href="#leaflet-shape-detailed" />
          <use href="#leaflet-veins" />
          <!-- Highlight on the center leaf to make it pop -->
          <path d="M 0,0 C -10,-20 -20,-40 -15,-60 ... Z" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.2" transform="translate(0, -5) scale(0.9)"/>
        </g>

      </g>

      <!-- Scientific Annotations -->
      <g id="annotations">
        <!-- Serration Callout -->
        <path class="annotation-line" d="M 300,150 C 250,120 200,120 180,110" />
        <circle class="annotation-dot" cx="300" cy="150" r="1.5" />
        <text x="175" y="114" class="annotation-text" text-anchor="end">Serration</text>
        
        <!-- Vein Callout -->
        <path class="annotation-line" d="M 450,220 C 500,200 550,200 600,190" />
        <circle class="annotation-dot" cx="450" cy="220" r="1.5" />
        <text x="605" y="194" class="annotation-text" text-anchor="start">Venation</text>
      </g>

    </svg>
  </div>

</body>
</html>
