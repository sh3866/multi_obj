<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trifolium pratense | Botanical Study</title>
<style>
  :root {
    --bg-color: #F2F0E9; /* Warm, archival paper tone */
    --bg-texture: #E6E4DC;
    --ink-color: #2E332E; /* Dark organic green-black */
    --ink-light: #5A605A;
    --accent-line: #8C968C;
    
    /* Clover Palette - Watercolor/Cellular */
    --c-leaf-base: #6B8E23;
    --c-leaf-light: #8FBC8F;
    --c-leaf-dark: #2F4F2F;
    --c-leaf-highlight: #A4D6A4;
    --c-vein: #3B5323;
    --c-stem: #556B2F;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-color);
    color: var(--ink-color);
    font-family: 'Garamond', 'Georgia', 'Times New Roman', serif;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* Paper Texture Overlay */
  .paper-texture {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    mix-blend-mode: multiply;
  }

  /* Main Container */
  .specimen-frame {
    position: relative;
    width: 95vmin;
    height: 95vmin;
    max-width: 1000px;
    max-height: 1000px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1;
  }

  /* Typography System */
  .annotation {
    position: absolute;
    font-size: 0.8rem;
    color: var(--ink-color);
    opacity: 0.85;
    pointer-events: none;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    font-weight: 400;
    line-height: 1.4;
  }

  /* Top Left - Figure Label */
  .annotation.fig-label { 
    top: 6%; 
    left: 6%; 
    text-align: left; 
    border-bottom: 1px solid var(--ink-light);
    padding-bottom: 8px;
  }
  .annotation.fig-label span {
    display: block;
    font-size: 0.7rem;
    opacity: 0.7;
    margin-top: 4px;
    font-family: 'Courier New', monospace;
    text-transform: none;
    letter-spacing: 0.05em;
  }

  /* Bottom Right - Title Block (Rebalanced) */
  .annotation.title-block { 
    bottom: 8%; 
    right: 6%; 
    text-align: right; 
  }
  .annotation.title-block h1 {
    font-size: 2rem;
    font-weight: 400;
    font-style: italic;
    text-transform: none;
    letter-spacing: 0.02em;
    margin-bottom: 0.2rem;
  }
  .annotation.title-block h2 {
    font-size: 0.9rem;
    font-weight: 400;
    font-family: 'Courier New', monospace;
    color: var(--ink-light);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* Annotation Lines */
  .annotation-line {
    stroke: var(--ink-color);
    stroke-width: 0.5;
    fill: none;
    opacity: 0.4;
    stroke-dasharray: 2 2;
  }
  
  .annotation-dot {
    fill: var(--ink-color);
    opacity: 0.6;
  }

  /* SVG Styling */
  svg.clover-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    /* Organic breathing */
    animation: breathe 8s ease-in-out infinite alternate;
    transform-origin: bottom center;
  }

  @keyframes breathe {
    0% { transform: scale(1) rotate(-0.5deg); }
    100% { transform: scale(1.01) rotate(0.5deg); }
  }

  /* Leaflet Styling */
  .leaflet-shape {
    transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
  }
  
  /* Subtle hover interaction */
  .leaflet-group:hover .leaflet-shape {
    filter: brightness(1.05);
    transform: scale(1.01);
  }
  
  .leaflet-group {
    transition: transform 0.6s ease;
  }

  /* Veins */
  .vein {
    fill: none;
    stroke: var(--c-vein);
    stroke-linecap: round;
    opacity: 0.7;
  }

</style>
</head>
<body>

  <div class="paper-texture"></div>

  <div class="specimen-frame">
    
    <!-- Top Left: Figure Label -->
    <div class="annotation fig-label">
      Fig. I.
      <span>Collected: 14 May 1924</span>
    </div>

    <!-- Bottom Right: Title (Balanced) -->
    <div class="annotation title-block">
      <h1>Trifolium</h1>
      <h2>Leguminosae</h2>
    </div>

    <!-- The Specimen -->
    <svg class="clover-svg" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Filter for Soft Rim Light (No harsh drop shadows) -->
        <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="15" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <!-- Leaf Gradient: Radial to simulate volume -->
        <radialGradient id="leafGrad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
          <stop offset="0%" style="stop-color:#A4D6A4;stop-opacity:1" />
          <stop offset="40%" style="stop-color:#6B8E23;stop-opacity:1" />
          <stop offset="80%" style="stop-color:#2F4F2F;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#1A2F1A;stop-opacity:1" />
        </radialGradient>

        <!-- Stem Gradient -->
        <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" style="stop-color:#2F4F2F;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#6B8E23;stop-opacity:1" />
        </linearGradient>

        <!-- Reusable Leaflet Definition (Organic Serrations) -->
        <g id="organic-leaflet">
          <!-- Main Body -->
          <path d="M 0,0 
                   C -45,-65 -110,-60 -110,0 
                   C -110,65 -45,85 0,85 
                   C 45,85 110,65 110,0 
                   C 110,-60 45,-65 0,0 Z" 
                fill="url(#leafGrad)" 
                filter="url(#soft-glow)"/>
          
          <!-- "Watercolor" Texture Spots (Simulating cellular structure) -->
          <g fill="#5C8A5C" opacity="0.3">
            <circle cx="-40" cy="-20" r="15" />
            <circle cx="30" cy="30" r="20" />
            <circle cx="-60" cy="40" r="12" />
            <circle cx="50" cy="-10" r="18" />
          </g>

          <!-- Serrations (Teeth) - Smooth, rounded bezier curves -->
          <g fill="#2F4F2F">
            <!-- Left side -->
            <path d="M -25,-48 Q -32,-58 -30,-42 Z" />
            <path d="M -55,-58 Q -65,-68 -60,-52 Z" />
            <path d="M -90,-35 Q -100,-45 -92,-28 Z" />
            <path d="M -105,5 Q -115,5 -105,15 Z" />
            <path d="M -80,50 Q -90,60 -85,55 Z" />
            
            <!-- Right side -->
            <path d="M 25,-48 Q 32,-58 30,-42 Z" />
            <path d="M 55,-58 Q 65,-68 60,-52 Z" />
            <path d="M 90,-35 Q 100,-45 92,-28 Z" />
            <path d="M 105,5 Q 115,5 105,15 Z" />
            <path d="M 80,50 Q 90,60 85,55 Z" />
          </g>

          <!-- Veins - Tapering naturally -->
          <g class="vein">
            <!-- Central Midrib -->
            <path d="M 0,5 Q 5,45 0,80" stroke-width="2" />
            
            <!-- Left Branches -->
            <path d="M -2,15 Q -30,15 -55,10" stroke-width="1.2" />
            <path d="M -2,30 Q -50,30 -75,20" stroke-width="1" />
            <path d="M -2,50 Q -40,50 -60,40" stroke-width="0.8" />
            <path d="M -2,65 Q -20,70 -30,75" stroke-width="0.5" />
            
            <!-- Right Branches -->
            <path d="M 2,15 Q 30,15 55,10" stroke-width="1.2" />
            <path d="M 2,30 Q 50,30 75,20" stroke-width="1" />
            <path d="M 2,50 Q 40,50 60,40" stroke-width="0.8" />
            <path d="M 2,65 Q 20,70 30,75" stroke-width="0.5" />
          </g>
        </g>
      </defs>

      <!-- Stem Group -->
      <g id="stem-group">
        <!-- Curved Main Stem -->
        <path d="M 400,750 C 430,600 380,450 400,300" 
              fill="none" 
              stroke="url(#stemGrad)" 
              stroke-width="10" 
              stroke-linecap="round" />
        
        <!-- Petioles (connecting stem to leaves) -->
        <!-- Left -->
        <path d="M 390,290 C 350,270 310,220 280,210" 
              fill="none" stroke="url(#stemGrad)" stroke-width="7" stroke-linecap="round"/>
        <!-- Right -->
        <path d="M 410,290 C 450,270 490,220 520,210" 
              fill="none" stroke="url(#stemGrad)" stroke-width="7" stroke-linecap="round"/>
        <!-- Top -->
        <path d="M 400,300 C 400,260 395,210 400,160" 
              fill="none" stroke="url(#stemGrad)" stroke-width="7" stroke-linecap="round"/>
      </g>

      <!-- Leaves Group -->
      <g id="leaves-group">
        <!-- Left Leaf (Slightly rotated) -->
        <g class="leaflet-group" transform="translate(280, 210) rotate(-55) scale(0.85)">
          <use href="#organic-leaflet" class="leaflet-shape" />
        </g>

        <!-- Right Leaf (Slightly rotated) -->
        <g class="leaflet-group" transform="translate(520, 210) rotate(55) scale(0.85)">
          <use href="#organic-leaflet" class="leaflet-shape" />
        </g>

        <!-- Top Leaf (Dominant, slightly larger) -->
        <g class="leaflet-group" transform="translate(400, 160) rotate(5) scale(1.05)">
          <use href="#organic-leaflet" class="leaflet-shape" />
        </g>
      </g>

      <!-- Scientific Annotations -->
      <g id="annotations">
        <!-- Line pointing to Serration -->
        <path class="annotation-line" d="M 320,140 C 250,100 200,100 150,90" />
        <circle class="annotation-dot" cx="320" cy="140" r="2" />
        <text x="145" y="94" font-family="Courier New, monospace" font-size="10" fill="#5A605A" text-anchor="end" letter-spacing="0.05em">Serration</text>
        
        <!-- Line pointing to Vein -->
        <path class="annotation-line" d="M 440,220 C 500,200 550,200 600,190" />
        <circle class="annotation-dot" cx="440" cy="220" r="2" />
        <text x="605" y="194" font-family="Courier New, monospace" font-size="10" fill="#5A605A" text-anchor="start" letter-spacing="0.05em">Venation</text>
      </g>

    </svg>
  </div>

  <script>
    // Subtle Parallax for depth
    document.addEventListener('mousemove', (e) => {
      const x = (window.innerWidth - e.pageX * 2) / 250;
      const y = (window.innerHeight - e.pageY * 2) / 250;

      const svg = document.querySelector('.clover-svg');
      const leaves = document.querySelectorAll('.leaflet-group');
      
      // Move the whole SVG slightly
      svg.style.transform = `translate(${x}px, ${y}px)`;

      // Move leaves slightly more for depth
      leaves.forEach((leaf, index) => {
        const depth = index === 2 ? 2.5 : 1.2; // Top leaf moves more
        // Combine with existing transform logic if needed, but simple translate works here
        leaf.style.transform = `translate(${x * depth}px, ${y * depth}px)`;
      });
    });
  </script>
</body>
</html>
