<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trifolium Specimen Study — Revised</title>
<style>
  :root {
    /* 
      Visual System: Flat, layered vector tones. 
      No heavy 3D gradients.
      Colors are distinct, organic greens.
    */
    --bg-paper: #F7F6F1;
    --ink-main: #1A2620;
    --ink-light: #5E6B60;
    --ink-faint: #A3AFA6;
    
    /* Leaf Palette: Flat colors for layering */
    --green-body: #557A59;      /* Mid-tone body */
    --green-shadow: #3D5A40;    /* Flat shadow for depth */
    --green-vein: #2C422E;      /* Dark organic vein */
    --green-highlight: #749B78; /* Lighter tone for secondary leaflets */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-paper);
    color: var(--ink-main);
    font-family: 'Garamond', 'Georgia', 'Times New Roman', serif;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    /* Subtle paper grain using inline SVG data URI */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
  }

  .study-container {
    position: relative;
    width: 100vmin;
    height: 100vmin;
    max-width: 1000px;
    max-height: 1000px;
    /* Removed rotation for a cleaner, more scientific layout */
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Typography Layer: Z-Pattern Layout */
  .typo-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  /* Title: Top Left */
  .header-block {
    position: absolute;
    top: 6%;
    left: 6%;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  .fig-label {
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--ink-light);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .title-block {
    margin-top: 0.5rem;
  }

  .title-main {
    font-size: 3.5rem;
    font-weight: 400;
    font-style: italic;
    color: var(--ink-main);
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .title-sub {
    font-size: 0.9rem;
    font-weight: 400;
    color: var(--ink-light);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    margin-top: 0.5rem;
    border-top: 1px solid var(--ink-faint);
    padding-top: 0.5rem;
    width: 120px;
  }

  /* Metadata: Bottom Left (Aligned with title) */
  .meta-data {
    position: absolute;
    bottom: 6%;
    left: 6%;
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.7rem;
    color: var(--ink-light);
    line-height: 1.6;
    text-align: left;
    border-left: 2px solid var(--ink-main);
    padding-left: 1rem;
  }
  
  .meta-row {
    display: flex;
    gap: 0.5em;
  }
  .meta-val { color: var(--ink-main); }

  /* SVG Styles */
  svg.plant-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Flat rendering classes */
  .leaf-body {
    fill: var(--green-body);
    stroke: var(--green-shadow);
    stroke-width: 1;
    stroke-linejoin: round;
  }
  
  .leaf-body-secondary {
    fill: var(--green-highlight);
    stroke: var(--green-body);
    stroke-width: 1;
    stroke-linejoin: round;
  }

  .leaf-shadow {
    fill: var(--green-shadow);
    opacity: 0.4;
  }

  .stem-stroke {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .vein-stroke {
    fill: none;
    stroke: var(--green-vein);
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.7;
  }

  /* Annotations: Restrained, precise */
  .annotation-group {
    opacity: 0.9;
  }
  
  .annotation-line {
    stroke: var(--ink-light);
    stroke-width: 0.5pt;
    fill: none;
    vector-effect: non-scaling-stroke;
  }

  .annotation-text {
    font-family: 'Garamond', serif;
    font-size: 11px;
    fill: var(--ink-light);
    letter-spacing: 0.05em;
    font-style: italic;
  }

  /* Inset Detail Box Styles */
  .inset-border {
    fill: none;
    stroke: var(--ink-light);
    stroke-width: 1;
    stroke-dasharray: 2 2;
  }
  .inset-bg {
    fill: var(--bg-paper);
    opacity: 0.9;
  }

</style>
</head>
<body>

  <div class="study-container">
    
    <!-- Typography Layer -->
    <div class="typo-layer">
      <div class="header-block">
        <div class="fig-label">Fig. I</div>
        <div class="title-block">
          <h1 class="title-main">Trifolium</h1>
          <h2 class="title-sub">Botanical Study</h2>
        </div>
      </div>
      
      <div class="meta-data">
        <div class="meta-row"><span>COLLECTED:</span> <span class="meta-val">14 MAY 1924</span></div>
        <div class="meta-row"><span>LOC:</span> <span class="meta-val">45.4211° N</span></div>
        <div class="meta-row"><span>ALT:</span> <span class="meta-val">142M</span></div>
      </div>
    </div>

    <!-- The Specimen -->
    <svg class="plant-svg" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 
          Leaflet Path: 
          Cordate (Heart) shape.
          Smooth bezier curves.
          Subtle serration (small notches) along the edge.
          Origin is at the base (sinus).
        -->
        <path id="leaflet-shape" 
              d="M 0,0
                 C -10,-15 -25,-25 -40,-25
                 C -70,-25 -90,-15 -100,-5
                 L -105,-8 L -98,-15 L -103,-20 L -95,-25
                 C -115,-35 -125,-25 -115,-10
                 L -118,-5 L -125,-10 L -120,0 L -125,5
                 C -120,35 -90,55 -60,60
                 L -58,62 L -55,56 L -52,60 L -48,62
                 C -25,65 -8,55 -2,35
                 C 0,20 0,10 0,0
                 Z
                 M 0,0
                 C 10,-15 25,-25 40,-25
                 C 70,-25 90,-15 100,-5
                 L 105,-8 L 98,-15 L 103,-20 L 95,-25
                 C 115,-35 125,-25 115,-10
                 L 118,-5 L 125,-10 L 120,0 L 125,5
                 C 120,35 90,55 60,60
                 L 58,62 L 55,56 L 52,60 L 48,62
                 C 25,65 8,55 2,35
                 C 0,20 0,10 0,0
                 Z" />

        <!-- 
          Vein Network:
          Pinnate venation pattern.
        -->
        <g id="leaflet-veins">
          <!-- Midrib -->
          <path d="M 0,0 C 0,15 -2,30 0,48" stroke-width="2" class="vein-stroke" />
          
          <!-- Secondary Veins Left -->
          <path d="M -2,8 C -15,10 -35,5 -55,0" stroke-width="1.2" class="vein-stroke" />
          <path d="M -2,18 C -20,22 -40,18 -60,15" stroke-width="1" class="vein-stroke" />
          <path d="M -2,28 C -10,32 -25,32 -40,28" stroke-width="0.8" class="vein-stroke" />
          <path d="M -2,38 C -8,42 -15,42 -22,38" stroke-width="0.6" class="vein-stroke" />
          
          <!-- Tertiary Veins Left -->
          <path d="M -15,10 L -25,20" stroke-width="0.5" class="vein-stroke" />
          <path d="M -35,8 L -45,18" stroke-width="0.5" class="vein-stroke" />
          <path d="M -25,20 L -35,30" stroke-width="0.5" class="vein-stroke" />

          <!-- Secondary Veins Right -->
          <path d="M 2,8 C 15,10 35,5 55,0" stroke-width="1.2" class="vein-stroke" />
          <path d="M 2,18 C 20,22 40,18 60,15" stroke-width="1" class="vein-stroke" />
          <path d="M 2,28 C 10,32 25,32 40,28" stroke-width="0.8" class="vein-stroke" />
          <path d="M 2,38 C 8,42 15,42 22,38" stroke-width="0.6" class="vein-stroke" />

          <!-- Tertiary Veins Right -->
          <path d="M 15,10 L 25,20" stroke-width="0.5" class="vein-stroke" />
          <path d="M 35,8 L 45,18" stroke-width="0.5" class="vein-stroke" />
          <path d="M 25,20 L 35,30" stroke-width="0.5" class="vein-stroke" />
        </g>

        <!-- Magnifier Lens Clip Path -->
        <clipPath id="inset-clip">
          <rect x="750" y="750" width="180" height="180" />
        </clipPath>
      </defs>

      <!-- Main Stem Group -->
      <g id="stem-group">
        <!-- Curved Main Stem (Organic S-Curve) -->
        <path d="M 500,920 C 520,800 470,650 500,480" 
              fill="none" stroke="var(--green-shadow)" stroke-width="12" class="stem-stroke" />
        
        <!-- Petioles (Connecting stems) -->
        <!-- Left Petiole -->
        <path d="M 498,480 C 450,450 380,380 320,330" 
              fill="none" stroke="var(--green-shadow)" stroke-width="9" class="stem-stroke"/>
        <!-- Right Petiole -->
        <path d="M 502,480 C 550,450 620,380 680,330" 
              fill="none" stroke="var(--green-shadow)" stroke-width="9" class="stem-stroke"/>
        <!-- Top Petiole -->
        <path d="M 500,480 C 500,400 495,300 500,180" 
              fill="none" stroke="var(--green-shadow)" stroke-width="9" class="stem-stroke"/>
      </g>

      <!-- Leaves Group -->
      <g id="leaves-group">
        
        <!-- Left Leaflet (Slightly angled down, rotated) -->
        <!-- Secondary tone for variety -->
        <g class="leaflet-group" transform="translate(320, 330) rotate(-65) scale(1.1)">
          <!-- Flat Shadow Layer -->
          <use href="#leaflet-shape" class="leaf-shadow" transform="translate(3, 5)" />
          <!-- Main Body -->
          <use href="#leaflet-shape" class="leaf-body-secondary" />
          <!-- Veins -->
          <use href="#leaflet-veins" />
        </g>

        <!-- Right Leaflet (Slightly angled down, rotated) -->
        <!-- Secondary tone for variety -->
        <g class="leaflet-group" transform="translate(680, 330) rotate(65) scale(1.1)">
          <!-- Flat Shadow Layer -->
          <use href="#leaflet-shape" class="leaf-shadow" transform="translate(3, 5)" />
          <!-- Main Body -->
          <use href="#leaflet-shape" class="leaf-body-secondary" />
          <!-- Veins -->
          <use href="#leaflet-veins" />
        </g>

        <!-- Top Leaflet (Dominant, upright, slightly larger) -->
        <g class="leaflet-group" transform="translate(500, 180) rotate(0) scale(1.3)">
          <!-- Flat Shadow Layer -->
          <use href="#leaflet-shape" class="leaf-shadow" transform="translate(4, 6)" />
          <!-- Main Body -->
          <use href="#leaflet-shape" class="leaf-body" />
          <!-- Veins -->
          <use href="#leaflet-veins" />
        </g>

      </g>

      <!-- Scientific Annotations (Restrained) -->
      <g id="annotations" class="annotation-group">
        
        <!-- Serration Callout (From Right) -->
        <g transform="translate(0, 0)">
          <!-- Target Point -->
          <circle cx="680" cy="270" r="2" fill="var(--ink-main)" />
          <!-- Line -->
          <path class="annotation-line" d="M 680,270 L 720,270 L 720,250" />
          <!-- Label -->
          <text x="725" y="253" class="annotation-text" text-anchor="start">Marginal Serration</text>
        </g>
        
        <!-- Venation Callout (From Left) -->
        <g transform="translate(0, 0)">
          <!-- Target Point -->
          <circle cx="400" cy="280" r="2" fill="var(--ink-main)" />
          <!-- Line -->
          <path class="annotation-line" d="M 400,280 L 360,280 L 360,260" />
          <!-- Label -->
          <text x="355" y="263" class="annotation-text" text-anchor="end">Pinnate Venation</text>
        </g>

      </g>

      <!-- Specimen Detail Inset (Magnified view) -->
      <g id="detail-inset" transform="translate(0,0)">
        <!-- Inset Background & Border -->
        <rect x="740" y="740" width="200" height="200" class="inset-bg" />
        <rect x="740" y="740" width="200" height="200" class="inset-border" />
        
        <!-- Label -->
        <text x="750" y="730" class="annotation-text" font-weight="bold">Detail: Venation</text>

        <!-- Magnified Content -->
        <g clip-path="url(#inset-clip)">
          <!-- Shifted and scaled version of the top leaflet to fit in the box -->
          <g transform="translate(750, 750) scale(2.5) rotate(-10)">
             <!-- We draw the top leaflet again here, zoomed in -->
             <use href="#leaflet-shape" class="leaf-body" />
             <use href="#leaflet-veins" stroke-width="1.5" /> <!-- Thicker veins for detail -->
          </g>
        </g>
      </g>

    </svg>
  </div>

</body>
</html>
