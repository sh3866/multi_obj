<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trifolium Specimen Study — Revised</title>
<style>
  :root {
    /* Colors: Natural, muted, botanical ink & pigment palette */
    --bg-paper: #F4F2EB;
    --ink-main: #222B24;
    --ink-light: #5C665E;
    --ink-faint: #8F9890;
    
    --green-dark: #243E28;
    --green-mid: #3F6643;
    --green-light: #6B906E;
    --green-pale: #A4C2A6;
    --green-highlight: #DCE8DC;
    --green-accent: #88B08A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-paper);
    color: var(--ink-main);
    font-family: 'Garamond', 'Georgia', 'Times New Roman', serif;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    /* Subtle noise texture for paper feel */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.06'/%3E%3C/svg%3E");
  }

  .study-container {
    position: relative;
    width: 100vmin;
    height: 100vmin;
    max-width: 1200px;
    max-height: 1200px;
    /* Slight rotation to simulate paper on a desk */
    transform: rotate(-0.5deg); 
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Typography */
  .typo-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  .header-block {
    position: absolute;
    top: 8%;
    left: 8%;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .fig-label {
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--ink-light);
    letter-spacing: 0.1em;
    border-bottom: 2px solid var(--ink-light);
    padding-bottom: 6px;
    width: 100px;
  }

  .title-block {
    margin-top: 0.8rem;
  }

  .title-main {
    font-size: 4.5rem;
    font-weight: 400;
    font-style: italic;
    color: var(--ink-main);
    letter-spacing: -0.03em;
    line-height: 0.9;
  }

  .title-sub {
    font-size: 1.2rem;
    font-weight: 400;
    color: var(--ink-light);
    text-transform: uppercase;
    letter-spacing: 0.25em;
    margin-top: 0.4rem;
  }

  .meta-data {
    position: absolute;
    bottom: 8%;
    right: 8%;
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.8rem;
    color: var(--ink-light);
    line-height: 1.6;
    text-align: right;
    opacity: 0.9;
  }
  
  .meta-label {
    font-weight: bold;
    color: var(--ink-main);
    margin-right: 0.5em;
  }

  /* SVG Styles */
  svg.plant-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .stem-line {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .vein-stroke {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .annotation-group {
    opacity: 0.85;
  }
  
  .annotation-line {
    stroke: var(--ink-light);
    stroke-width: 1pt;
    fill: none;
    vector-effect: non-scaling-stroke;
  }

  .annotation-text {
    font-family: 'Garamond', serif;
    font-size: 14px;
    fill: var(--ink-main);
    letter-spacing: 0.05em;
    font-style: italic;
    font-weight: 600;
  }
  
  /* Grid lines for "field note" feel */
  .grid-line {
    stroke: var(--ink-faint);
    stroke-width: 0.5;
    stroke-dasharray: 2 4;
    opacity: 0.3;
  }

</style>
</head>
<body>

  <div class="study-container">
    
    <!-- Typography Layer -->
    <div class="typo-layer">
      <div class="header-block">
        <div class="fig-label">FIG. I</div>
        <div class="title-block">
          <h1 class="title-main">Trifolium</h1>
          <h2 class="title-sub">Botanical Study</h2>
        </div>
      </div>
      
      <div class="meta-data">
        <div><span class="meta-label">COLLECTED:</span> 14 MAY 1924</div>
        <div><span class="meta-label">LOC:</span> 45.4211° N, 75.6919° W</div>
        <div><span class="meta-label">ALT:</span> 142M</div>
      </div>
    </div>

    <!-- The Specimen -->
    <svg class="plant-svg" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 
          Leaf Gradient: 
          Simulates light hitting a slightly cupped leaf.
          Pale center (highlight), mid-green, dark edges (shadow).
        -->
        <radialGradient id="leafFill" cx="50%" cy="40%" r="70%" fx="50%" fy="40%">
          <stop offset="0%" stop-color="var(--green-highlight)" />
          <stop offset="20%" stop-color="var(--green-pale)" />
          <stop offset="60%" stop-color="var(--green-mid)" />
          <stop offset="90%" stop-color="var(--green-dark)" />
          <stop offset="100%" stop-color="#152618" />
        </radialGradient>

        <!-- 
          Stem Gradient: 
          Simulates cylindrical volume.
        -->
        <linearGradient id="stemFill" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#152618" />
          <stop offset="50%" stop-color="var(--green-dark)" />
          <stop offset="100%" stop-color="var(--green-mid)" />
        </linearGradient>

        <!-- 
          Leaflet Path:
          Hand-drawn style cordate shape.
          Includes a distinct notch (sinus) at the base and organic serrations along the edge.
          Center is at 0,0.
        -->
        <path id="leaflet-shape" 
              d="M 0,0
                 C -8,-20 -20,-30 -35,-30
                 C -60,-30 -80,-20 -90,-10
                 L -95,-14 L -90,-20 L -96,-25 L -88,-30
                 C -110,-40 -120,-30 -110,-15
                 L -114,-10 L -120,-15 L -115,-5 L -120,2
                 C -115,30 -90,50 -65,55
                 L -62,58 L -60,52 L -58,56 L -55,58
                 C -30,60 -12,55 -5,40
                 C 0,28 0,12 0,0
                 Z
                 M 0,0
                 C 8,-20 20,-30 35,-30
                 C 60,-30 80,-20 90,-10
                 L 95,-14 L 90,-20 L 96,-25 L 88,-30
                 C 110,-40 120,-30 110,-15
                 L 114,-10 L 120,-15 L 115,-5 L 120,2
                 C 115,30 90,50 65,55
                 L 62,58 L 60,52 L 58,56 L 55,58
                 C 30,60 12,55 5,40
                 C 0,28 0,12 0,0
                 Z" 
              fill="url(#leafFill)" />

        <!-- 
          Vein Network:
          Organic, slightly irregular branching.
        -->
        <g id="leaflet-veins" stroke="var(--green-dark)" opacity="0.5">
          <!-- Midrib -->
          <path d="M 0,0 C 0,15 -2,30 0,42" stroke-width="2.5" class="vein-stroke" />
          
          <!-- Secondary Veins Left -->
          <path d="M -2,8 C -15,10 -30,5 -50,0" stroke-width="1.5" class="vein-stroke" />
          <path d="M -2,18 C -20,22 -40,18 -60,15" stroke-width="1.2" class="vein-stroke" />
          <path d="M -2,28 C -10,32 -25,32 -40,28" stroke-width="1" class="vein-stroke" />
          <path d="M -2,38 C -8,42 -15,42 -22,38" stroke-width="0.8" class="vein-stroke" />
          
          <!-- Tertiary Veins Left (Interconnecting) -->
          <path d="M -15,10 L -25,20" stroke-width="0.5" class="vein-stroke" />
          <path d="M -35,8 L -45,18" stroke-width="0.5" class="vein-stroke" />
          <path d="M -25,20 L -35,30" stroke-width="0.5" class="vein-stroke" />

          <!-- Secondary Veins Right -->
          <path d="M 2,8 C 15,10 30,5 50,0" stroke-width="1.5" class="vein-stroke" />
          <path d="M 2,18 C 20,22 40,18 60,15" stroke-width="1.2" class="vein-stroke" />
          <path d="M 2,28 C 10,32 25,32 40,28" stroke-width="1" class="vein-stroke" />
          <path d="M 2,38 C 8,42 15,42 22,38" stroke-width="0.8" class="vein-stroke" />

          <!-- Tertiary Veins Right -->
          <path d="M 15,10 L 25,20" stroke-width="0.5" class="vein-stroke" />
          <path d="M 35,8 L 45,18" stroke-width="0.5" class="vein-stroke" />
          <path d="M 25,20 L 35,30" stroke-width="0.5" class="vein-stroke" />
        </g>

        <!-- Drop Shadow Filter for leaves -->
        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
          <feOffset dx="5" dy="10" result="offsetblur" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.3" />
          </feComponentTransfer>
          <feMerge> 
            <feMergeNode />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

      </defs>

      <!-- Background Grid (Field Note Aesthetic) -->
      <g id="grid">
        <line x1="500" y1="0" x2="500" y2="1000" class="grid-line" />
        <line x1="0" y1="500" x2="1000" y2="500" class="grid-line" />
        <circle cx="500" cy="500" r="350" class="grid-line" />
      </g>

      <!-- Main Stem Group -->
      <g id="stem-group">
        <!-- Curved Main Stem (Organic S-Curve) -->
        <!-- Starting from bottom center, curving slightly left then right to center -->
        <path d="M 500,950 C 530,800 460,650 500,480" 
              fill="none" 
              stroke="url(#stemFill)" 
              stroke-width="14" 
              class="stem-line" />
        
        <!-- Stem Highlight (Volume) -->
        <path d="M 500,950 C 530,800 460,650 500,480" 
              fill="none" 
              stroke="#FFFFFF" 
              stroke-width="2" 
              opacity="0.15"
              transform="translate(-4, 0)" 
              class="stem-line" />

        <!-- Petioles (Connecting stems) -->
        <!-- Left Petiole -->
        <path d="M 496,480 C 450,450 380,380 320,330" 
              fill="none" stroke="url(#stemFill)" stroke-width="10" class="stem-line"/>
        <!-- Right Petiole -->
        <path d="M 504,480 C 550,450 620,380 680,330" 
              fill="none" stroke="url(#stemFill)" stroke-width="10" class="stem-line"/>
        <!-- Top Petiole -->
        <path d="M 500,480 C 500,400 495,300 500,180" 
              fill="none" stroke="url(#stemFill)" stroke-width="10" class="stem-line"/>
      </g>

      <!-- Leaves Group -->
      <g id="leaves-group" filter="url(#dropShadow)">
        
        <!-- Left Leaflet (Slightly angled down, rotated) -->
        <g class="leaflet-group" transform="translate(320, 330) rotate(-65) scale(1.2)">
          <use href="#leaflet-shape" />
          <use href="#leaflet-veins" />
          <!-- Edge definition -->
          <use href="#leaflet-shape" fill="none" stroke="var(--green-dark)" stroke-width="1.5" opacity="0.3" />
        </g>

        <!-- Right Leaflet (Slightly angled down, rotated) -->
        <g class="leaflet-group" transform="translate(680, 330) rotate(65) scale(1.2)">
          <use href="#leaflet-shape" />
          <use href="#leaflet-veins" />
          <use href="#leaflet-shape" fill="none" stroke="var(--green-dark)" stroke-width="1.5" opacity="0.3" />
        </g>

        <!-- Top Leaflet (Dominant, upright, slightly larger) -->
        <g class="leaflet-group" transform="translate(500, 180) rotate(0) scale(1.4)">
          <use href="#leaflet-shape" />
          <use href="#leaflet-veins" />
          <use href="#leaflet-shape" fill="none" stroke="var(--green-dark)" stroke-width="1.5" opacity="0.3" />
        </g>

      </g>

      <!-- Scientific Annotations -->
      <g id="annotations" class="annotation-group">
        
        <!-- Serration Callout -->
        <g transform="translate(0, 0)">
          <!-- Target Point on Left Leaf Edge -->
          <circle cx="220" cy="290" r="2" fill="var(--ink-main)" />
          <!-- Line -->
          <path class="annotation-line" d="M 220,290 C 180,260 150,250 130,240" />
          <!-- Label -->
          <text x="125" y="244" class="annotation-text" text-anchor="end">Serration</text>
        </g>
        
        <!-- Venation Callout -->
        <g transform="translate(0, 0)">
          <!-- Target Point on Top Leaf Center -->
          <circle cx="500" cy="260" r="2" fill="var(--ink-main)" />
          <!-- Line -->
          <path class="annotation-line" d="M 500,260 C 560,240 620,240 660,230" />
          <!-- Label -->
          <text x="665" y="234" class="annotation-text" text-anchor="start">Venation</text>
        </g>

        <!-- Petiole Callout -->
        <g transform="translate(0, 0)">
           <!-- Target Point on Stem -->
           <circle cx="460" cy="440" r="2" fill="var(--ink-main)" />
           <!-- Line -->
           <path class="annotation-line" d="M 460,440 C 420,470 390,490 370,500" />
           <!-- Label -->
           <text x="365" y="504" class="annotation-text" text-anchor="end">Petiole</text>
        </g>

      </g>

    </svg>
  </div>

</body>
</html>
