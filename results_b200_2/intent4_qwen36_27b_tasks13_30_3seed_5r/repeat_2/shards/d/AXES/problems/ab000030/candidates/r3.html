<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Hub // Aetheria</title>
<style>
    :root {
        /* Palette - Cyberpunk / Neon Noir */
        --bg-app: #090a0f;
        --bg-panel: #13161f;
        --bg-surface: #1c202e;
        --bg-surface-hover: #252a3b;
        
        --accent-cyan: #00f3ff;
        --accent-cyan-dim: rgba(0, 243, 255, 0.15);
        --accent-red: #ff2a38;
        --accent-red-dim: rgba(255, 42, 56, 0.15);
        --accent-gold: #ffd700;
        --accent-gold-dim: rgba(255, 215, 0, 0.15);
        --accent-green: #00ff9d;
        --accent-green-dim: rgba(0, 255, 157, 0.15);
        
        --text-main: #ffffff;
        --text-muted: #8b9bb4;
        --text-dark: #4a5568;

        --border-light: 1px solid rgba(255, 255, 255, 0.06);
        --border-cyan: 1px solid rgba(0, 243, 255, 0.3);
        
        --font-stack: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        
        --shadow-glow: 0 0 15px rgba(0, 243, 255, 0.2);
        --shadow-red: 0 0 15px rgba(255, 42, 56, 0.2);
        
        --radius: 8px;
    }

    * { box-sizing: border-box; outline: none; user-select: none; }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-app);
        color: var(--text-main);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        /* Background Texture: Grid + Noise */
        background-image: 
            linear-gradient(rgba(18, 20, 30, 0.95), rgba(18, 20, 30, 0.95)),
            linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 100% 100%, 40px 40px, 40px 40px;
    }

    /* --- App Container --- */
    .app-container {
        width: 1440px;
        height: 900px;
        background: var(--bg-app);
        border-radius: 12px;
        box-shadow: 0 20px 80px rgba(0,0,0,0.6);
        display: grid;
        grid-template-columns: 340px 1fr 360px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.08);
        position: relative;
    }

    /* --- Scrollbar --- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-cyan); }

    /* --- 1. Left Panel (Profile & Party) --- */
    .left-panel {
        background: linear-gradient(180deg, rgba(20,25,35,0.95) 0%, rgba(10,12,18,0.95) 100%);
        border-right: var(--border-light);
        display: flex;
        flex-direction: column;
        padding: 24px;
        z-index: 10;
    }

    /* Profile Header */
    .profile-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 30px;
        position: relative;
    }

    .avatar-frame {
        position: relative;
        width: 100px;
        height: 100px;
        margin-bottom: 16px;
    }

    .avatar-img {
        width: 100%;
        height: 100%;
        border-radius: var(--radius);
        object-fit: cover;
        border: 2px solid var(--accent-cyan);
        box-shadow: var(--shadow-glow);
    }

    /* Rank Badge - Metallic/3D feel */
    .rank-badge {
        position: absolute;
        top: -10px;
        right: -10px;
        background: linear-gradient(135deg, #ffd700, #b8860b);
        color: #000;
        font-size: 0.6rem;
        font-weight: 800;
        padding: 4px 8px;
        border-radius: 4px;
        text-transform: uppercase;
        letter-spacing: 1px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        transform: rotate(5deg);
        border: 1px solid #fff;
    }

    .profile-name {
        font-size: 1.5rem;
        font-weight: 700;
        text-align: center;
        letter-spacing: 0.5px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .profile-title {
        color: var(--accent-cyan);
        font-size: 0.85rem;
        font-weight: 600;
        margin-top: 4px;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    /* Party Section */
    .party-section {
        background: rgba(0,0,0,0.2);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: var(--radius);
        padding: 16px;
        position: relative;
        overflow: hidden;
    }

    .party-section::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 4px; height: 100%;
        background: var(--accent-cyan);
        box-shadow: 0 0 10px var(--accent-cyan);
    }

    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .section-title {
        color: var(--text-main);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-weight: 700;
    }

    .party-count {
        color: var(--accent-cyan);
        font-size: 0.8rem;
        font-weight: 700;
        font-family: monospace;
    }

    .party-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
    }

    .party-member-card {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 4px;
        padding: 10px;
        display: flex;
        align-items: center;
        gap: 12px;
        transition: 0.2s;
        cursor: pointer;
        position: relative;
    }

    .party-member-card:hover {
        background: var(--bg-surface-hover);
        border-color: var(--accent-cyan-dim);
    }

    .party-avatar {
        width: 40px;
        height: 40px;
        border-radius: 4px;
        object-fit: cover;
    }

    .party-info {
        flex: 1;
        overflow: hidden;
    }

    .party-name {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-main);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .party-status {
        font-size: 0.7rem;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .status-dot {
        width: 6px; height: 6px; border-radius: 50%;
    }
    .dot-online { background: var(--accent-green); box-shadow: 0 0 5px var(--accent-green); }
    .dot-ingame { background: var(--accent-gold); box-shadow: 0 0 5px var(--accent-gold); }
    .dot-offline { background: var(--text-dark); }

    /* --- 2. Middle Panel (Friends List) --- */
    .main-panel {
        display: flex;
        flex-direction: column;
        background: rgba(0,0,0,0.2);
        position: relative;
    }

    .top-bar {
        padding: 24px 32px;
        background: rgba(19, 22, 31, 0.95);
        border-bottom: var(--border-light);
        backdrop-filter: blur(10px);
        z-index: 5;
    }

    .controls-row {
        display: flex;
        gap: 16px;
        margin-bottom: 20px;
    }

    .search-wrapper {
        flex: 1;
        position: relative;
    }

    .search-input {
        width: 100%;
        background: rgba(0,0,0,0.3);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 12px 16px 12px 44px;
        border-radius: var(--radius);
        color: var(--text-main);
        font-size: 0.95rem;
        transition: 0.2s;
    }

    .search-input:focus {
        border-color: var(--accent-cyan);
        box-shadow: 0 0 0 1px var(--accent-cyan-dim);
    }

    .search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
    }

    .btn-add-friend {
        background: transparent;
        border: 1px solid var(--text-muted);
        color: var(--text-muted);
        padding: 0 20px;
        border-radius: var(--radius);
        font-weight: 600;
        font-size: 0.85rem;
        cursor: pointer;
        transition: 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .btn-add-friend:hover {
        border-color: var(--text-main);
        color: var(--text-main);
        background: rgba(255,255,255,0.05);
    }

    .filter-tabs {
        display: flex;
        gap: 24px;
    }

    .filter-tab {
        color: var(--text-muted);
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        padding-bottom: 4px;
        border-bottom: 2px solid transparent;
        transition: 0.2s;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .filter-tab:hover { color: var(--text-main); }
    
    .filter-tab.active {
        color: var(--accent-cyan);
        border-bottom-color: var(--accent-cyan);
    }

    .friends-scroll-area {
        flex: 1;
        overflow-y: auto;
        padding: 24px 32px;
    }

    .friend-row {
        display: flex;
        align-items: center;
        padding: 16px 20px;
        margin-bottom: 12px;
        border-radius: var(--radius);
        cursor: pointer;
        transition: all 0.2s ease;
        border: 1px solid transparent;
        position: relative;
        background: rgba(255,255,255,0.01);
    }

    .friend-row:hover {
        background: rgba(255,255,255,0.04);
        transform: translateX(4px);
    }

    .friend-row.selected {
        background: linear-gradient(90deg, var(--accent-cyan-dim) 0%, transparent 100%);
        border: 1px solid rgba(0, 243, 255, 0.2);
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .friend-avatar-col {
        position: relative;
        width: 50px;
        height: 50px;
        margin-right: 16px;
    }

    .friend-avatar {
        width: 100%;
        height: 100%;
        border-radius: var(--radius);
        object-fit: cover;
        border: 1px solid rgba(255,255,255,0.1);
    }

    .friend-info {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .friend-name {
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--text-main);
    }

    .friend-meta {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .friend-status-pill {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 2px 8px;
        border-radius: 2px;
    }

    .pill-online { color: var(--accent-green); }
    .pill-ingame { color: var(--accent-gold); }
    .pill-offline { color: var(--text-dark); }

    .friend-game-text {
        font-size: 0.8rem;
        color: var(--text-muted);
    }

    /* --- 3. Right Panel (Detail & Requests) --- */
    .right-panel {
        background: var(--bg-panel);
        border-left: var(--border-light);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* VIEW: Detail Panel */
    .detail-view {
        height: 100%;
        display: none; /* Controlled by JS */
        flex-direction: column;
        animation: slideIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    
    .detail-view.active { display: flex; }

    @keyframes slideIn {
        from { opacity: 0; transform: translateX(20px); }
        to { opacity: 1; transform: translateX(0); }
    }

    .detail-header {
        padding: 24px;
        border-bottom: var(--border-light);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .close-detail {
        background: transparent;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        transition: 0.2s;
    }
    .close-detail:hover { color: var(--text-main); }

    .detail-hero {
        padding: 32px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: radial-gradient(circle at 50% 0%, rgba(0, 243, 255, 0.08) 0%, transparent 60%);
    }

    .detail-avatar-large {
        width: 100px;
        height: 100px;
        border-radius: var(--radius);
        border: 2px solid rgba(255,255,255,0.1);
        object-fit: cover;
        margin-bottom: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .detail-name { font-size: 1.6rem; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
    
    .detail-rank { 
        color: var(--accent-gold); 
        font-size: 0.8rem; 
        font-weight: 700; 
        text-transform: uppercase; 
        letter-spacing: 1px;
        margin-top: 6px;
        display: inline-block;
        background: var(--accent-gold-dim);
        padding: 4px 12px;
        border-radius: 20px;
        border: 1px solid rgba(255, 215, 0, 0.3);
    }

    .detail-stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background: rgba(255,255,255,0.05); /* Grid lines */
        margin: 24px;
        border-radius: var(--radius);
        overflow: hidden;
    }

    .stat-card {
        background: var(--bg-surface);
        padding: 20px;
        text-align: center;
    }

    .stat-val { display: block; font-size: 1.4rem; font-weight: 700; color: var(--text-main); font-family: monospace; }
    .stat-lbl { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

    .detail-actions-area {
        margin-top: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .action-btn {
        width: 100%;
        padding: 16px;
        border-radius: 4px;
        border: none;
        font-weight: 800;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: 0.2s;
        position: relative;
        overflow: hidden;
    }

    /* Thematic: Invite is clean, Battle is aggressive */
    .btn-invite {
        background: var(--accent-cyan);
        color: #000;
        box-shadow: 0 4px 15px var(--accent-cyan-dim);
    }
    .btn-invite:hover { 
        background: #fff; 
        box-shadow: 0 0 20px var(--accent-cyan);
    }

    .btn-battle {
        background: transparent;
        color: var(--accent-red);
        border: 1px solid var(--accent-red);
        clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }
    .btn-battle:hover { 
        background: var(--accent-red); 
        color: #fff;
        box-shadow: var(--shadow-red);
    }

    .btn-msg {
        background: transparent;
        border: 1px solid rgba(255,255,255,0.1);
        color: var(--text-muted);
        font-size: 0.8rem;
    }
    .btn-msg:hover { border-color: var(--text-muted); color: var(--text-main); }

    /* VIEW: Requests */
    .requests-view {
        height: 100%;
        display: flex;
        flex-direction: column;
    }

    .requests-header {
        padding: 24px;
        border-bottom: var(--border-light);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .req-badge {
        background: var(--accent-red);
        color: white;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 0.7rem;
        font-weight: 800;
    }

    .requests-list {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
    }

    .request-card {
        background: var(--bg-surface);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        transition: 0.2s;
    }

    .request-card:hover {
        border-color: rgba(255,255,255,0.1);
        transform: translateY(-2px);
    }

    .req-top {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .req-avatar {
        width: 44px; height: 44px;
        border-radius: var(--radius);
        object-fit: cover;
        border: 1px solid rgba(255,255,255,0.1);
    }

    .req-info h4 { margin: 0; font-size: 0.95rem; color: var(--text-main); font-weight: 600; }
    .req-info p { margin: 4px 0 0; font-size: 0.75rem; color: var(--text-muted); }

    .req-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .req-btn {
        padding: 8px 0;
        border-radius: 4px;
        border: none;
        font-weight: 700;
        font-size: 0.75rem;
        text-transform: uppercase;
        cursor: pointer;
        transition: 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    .req-accept { background: var(--accent-green); color: #000; }
    .req-accept:hover { filter: brightness(1.1); }

    .req-decline { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); }
    .req-decline:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }

    /* SVG Icons */
    svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

</style>
</head>
<body>

<div class="app-container">
    
    <!-- LEFT PANEL: Profile & Party -->
    <aside class="left-panel">
        <div class="profile-header">
            <div class="avatar-frame">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300f3ff'/%3E%3Cstop offset='1' stop-color='%230051ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='8' fill='%231c202e'/%3E%3Cpath d='M50 20 C30 20 20 40 20 60 C20 80 50 90 50 90 C50 90 80 80 80 60 C80 40 70 20 50 20' fill='url(%23g)'/%3E%3C/svg%3E" alt="Me" class="avatar-img">
                <div class="rank-badge">Grandmaster</div>
            </div>
            <h1 class="profile-name">NeonRider</h1>
            <span class="profile-title">Lvl 92 • Cyberpunk</span>
        </div>

        <div class="party-section">
            <div class="section-header">
                <span class="section-title">Active Party</span>
                <span class="party-count">3 / 4</span>
            </div>
            <div class="party-grid" id="partyGrid">
                <!-- Populated by JS -->
            </div>
        </div>
    </aside>

    <!-- MAIN PANEL: Friends List -->
    <section class="main-panel">
        <div class="top-bar">
            <div class="controls-row">
                <div class="search-wrapper">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" class="search-input" placeholder="Search callsign, clan...">
                </div>
                <button class="btn-add-friend">
                    <svg width="18" height="18" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Add
                </button>
            </div>
            <div class="filter-tabs">
                <div class="filter-tab active">All Friends <span style="opacity:0.5; font-size:0.8em; margin-left:4px;">42</span></div>
                <div class="filter-tab">Online <span style="opacity:0.5; font-size:0.8em; margin-left:4px;">12</span></div>
                <div class="filter-tab">In Game <span style="opacity:0.5; font-size:0.8em; margin-left:4px;">4</span></div>
            </div>
        </div>

        <div class="friends-scroll-area" id="friendList">
            <!-- Populated by JS -->
        </div>
    </section>

    <!-- RIGHT PANEL: Contextual (Detail or Requests) -->
    <aside class="right-panel">
        
        <!-- Requests View (Default) -->
        <div id="requestsView" class="requests-view">
            <div class="requests-header">
                <span class="section-title" style="font-size: 0.9rem; color: var(--text-main);">Incoming Requests</span>
                <span class="req-badge">3 New</span>
            </div>
            <div class="requests-list">
                <!-- Request 1 -->
                <div class="request-card">
                    <div class="req-top">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='8' fill='%232d3436'/%3E%3Cpath d='M50 20 L80 80 L20 80 Z' fill='%23a29bfe'/%3E%3C/svg%3E" class="req-avatar" alt="User">
                        <div class="req-info">
                            <h4>Glitch_Monkey</h4>
                            <p>Requested 2m ago</p>
                        </div>
                    </div>
                    <div class="req-actions">
                        <button class="req-btn req-accept">Accept</button>
                        <button class="req-btn req-decline">Decline</button>
                    </div>
                </div>

                <!-- Request 2 -->
                <div class="request-card">
                    <div class="req-top">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='8' fill='%23636e72'/%3E%3Ccircle cx='50' cy='50' r='30' fill='%2300ff9d'/%3E%3C/svg%3E" class="req-avatar" alt="User">
                        <div class="req-info">
                            <h4>EcoWarrior</h4>
                            <p>Requested 1h ago</p>
                        </div>
                    </div>
                    <div class="req-actions">
                        <button class="req-btn req-accept">Accept</button>
                        <button class="req-btn req-decline">Decline</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Detail View (Overlay) -->
        <div id="detailView" class="detail-view">
            <div class="detail-header">
                <span class="section-title">Player Profile</span>
                <button class="close-detail" onclick="closeDetail()">
                    <svg width="24" height="24" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            
            <div class="detail-hero">
                <img id="detailAvatar" class="detail-avatar-large" src="" alt="Detail">
                <h2 id="detailName" class="detail-name">Name</h2>
                <span id="detailRank" class="detail-rank">Rank</span>
            </div>

            <div class="detail-stats-grid">
                <div class="stat-card">
                    <span class="stat-val">1,240</span>
                    <span class="stat-lbl">Wins</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val">86%</span>
                    <span class="stat-lbl">Win Rate</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val">45</span>
                    <span class="stat-lbl">Matches</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val">Lvl 72</span>
                    <span class="stat-lbl">Level</span>
                </div>
            </div>

            <div class="detail-actions-area">
                <button class="action-btn btn-invite">
                    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                    Invite to Party
                </button>
                <button class="action-btn btn-battle">
                    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M14.5 17.5L3 6V3h3l11.5 11.5m-4 4l5-5"></path><path d="M16 3h5v5"></path></svg>
                    Challenge
                </button>
                <button class="action-btn btn-msg">
                    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Message
                </button>
            </div>
        </div>

    </aside>

</div>

<script>
    // --- Data ---
    const partyMembers = [
        { name: "CyberWolf", status: "ingame", game: "Battle Arena", color: "#54a0ff", shape: "triangle" },
        { name: "Viper_X", status: "online", game: "In Lobby", color: "#ff4757", shape: "circle" },
        { name: "NovaStar", status: "online", game: "In Lobby", color: "#feca57", shape: "square" }
    ];

    const friends = [
        { id: 1, name: "CyberWolf", status: "ingame", game: "Battle Arena", rank: "Diamond II", color: "#54a0ff", shape: "triangle" },
        { id: 2, name: "Viper_X", status: "online", game: "In Lobby", rank: "Platinum I", color: "#ff4757", shape: "circle" },
        { id: 3, name: "NovaStar", status: "online", game: "In Lobby", rank: "Master", color: "#feca57", shape: "square" },
        { id: 4, name: "GhostShell", status: "offline", game: "Last seen 2h ago", rank: "Gold III", color: "#dfe6e9", shape: "hex" },
        { id: 5, name: "PixelPunk", status: "ingame", game: "Ranked 5v5", rank: "Silver I", color: "#a29bfe", shape: "star" },
        { id: 6, name: "IronClad", status: "online", game: "In Lobby", rank: "Platinum III", color: "#74b9ff", shape: "shield" },
        { id: 7, name: "ShadowMerk", status: "offline", game: "Last seen yesterday", rank: "Diamond I", color: "#636e72", shape: "diamond" },
        { id: 8, name: "LunaTide", status: "ingame", game: "Co-op Raid", rank: "Grandmaster", color: "#00cec9", shape: "moon" }
    ];

    // --- Render Functions ---
    
    // Helper to generate SVG Avatars
    function getAvatarSVG(color, shape, size=100) {
        const bg = '#1c202e';
        let shapePath = '';
        
        switch(shape) {
            case 'triangle': shapePath = `<path d="M50 25 L80 80 L20 80 Z" fill="${color}"/>`; break;
            case 'circle': shapePath = `<circle cx="50" cy="50" r="30" fill="${color}"/>`; break;
            case 'square': shapePath = `<rect x="25" y="25" width="50" height="50" rx="4" fill="${color}"/>`; break;
            case 'hex': shapePath = `<polygon points="50,20 80,35 80,65 50,80 20,65 20,35" fill="${color}"/>`; break;
            case 'star': shapePath = `<polygon points="50,15 61,35 85,35 65,50 75,75 50,60 25,75 35,50 15,35 39,35" fill="${color}"/>`; break;
            case 'shield': shapePath = `<path d="M25 25 L75 25 L75 50 C75 75 50 85 50 85 C50 85 25 75 25 50 Z" fill="${color}"/>`; break;
            case 'diamond': shapePath = `<polygon points="50,20 80,50 50,80 20,50" fill="${color}"/>`; break;
            case 'moon': shapePath = `<path d="M50 20 A30 30 0 1 0 50 80 A20 20 0 1 1 50 20" fill="${color}"/>`; break;
            default: shapePath = `<circle cx="50" cy="50" r="30" fill="${color}"/>`;
        }

        return `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='8' fill='${encodeURIComponent(bg)}'/%3E${shapePath}%3C/svg%3E`;
    }

    function renderParty() {
        const grid = document.getElementById('partyGrid');
        grid.innerHTML = '';
        partyMembers.forEach(member => {
            const avatar = getAvatarSVG(member.color, member.shape);
            const card = document.createElement('div');
            card.className = 'party-member-card';
            card.onclick = () => selectFriendById(member.name);
            
            const statusClass = member.status === 'online' ? 'dot-online' : 'dot-ingame';
            const statusText = member.status === 'online' ? 'Online' : member.game;

            card.innerHTML = `
                <img src="${avatar}" class="party-avatar" alt="${member.name}">
                <div class="party-info">
                    <div class="party-name">${member.name}</div>
                    <div class="party-status">
                        <div class="status-dot ${statusClass}"></div>
                        ${statusText}
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function renderFriends() {
        const list = document.getElementById('friendList');
        list.innerHTML = '';
        
        friends.forEach(friend => {
            const avatar = getAvatarSVG(friend.color, friend.shape);
            const row = document.createElement('div');
            row.className = 'friend-item friend-row';
            row.onclick = () => selectFriend(friend, row);

            // Status Logic
            let statusText = 'Offline';
            let pillClass = 'pill-offline';
            let gameText = '';

            if(friend.status === 'online') { 
                statusText = 'Online'; 
                pillClass = 'pill-online'; 
            }
            if(friend.status === 'ingame') { 
                statusText = 'In Game'; 
                pillClass = 'pill-ingame'; 
                gameText = friend.game;
            }

            row.innerHTML = `
                <div class="friend-avatar-col">
                    <img src="${avatar}" class="friend-avatar" alt="${friend.name}">
                </div>
                <div class="friend-info">
                    <div class="friend-name">${friend.name}</div>
                    <div class="friend-meta">
                        <span class="friend-status-pill ${pillClass}">${statusText}</span>
                        ${gameText ? `<span class="friend-game-text">• ${gameText}</span>` : ''}
                    </div>
                </div>
            `;
            list.appendChild(row);
        });
    }

    // --- Interaction Logic ---

    function selectFriend(friend, element) {
        // Highlight List Item
        document.querySelectorAll('.friend-row').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');

        // Populate Detail Panel
        document.getElementById('detailName').innerText = friend.name;
        document.getElementById('detailRank').innerText = friend.rank;
        
        const avatar = getAvatarSVG(friend.color, friend.shape);
        document.getElementById('detailAvatar').src = avatar;

        // Switch View
        const reqs = document.getElementById('requestsView');
        const detail = document.getElementById('detailView');
        
        reqs.style.display = 'none';
        detail.classList.add('active');
    }

    function selectFriendById(name) {
        const friend = friends.find(f => f.name === name);
        if(friend) {
            const rows = Array.from(document.querySelectorAll('.friend-row'));
            const targetRow = rows.find(r => r.innerHTML.includes(friend.name));
            if(targetRow) selectFriend(friend, targetRow);
        }
    }

    function closeDetail() {
        const detail = document.getElementById('detailView');
        detail.classList.remove('active');
        
        const reqs = document.getElementById('requestsView');
        reqs.style.display = 'flex';
        document.querySelectorAll('.friend-row').forEach(el => el.classList.remove('selected'));
    }

    // Init
    renderParty();
    renderFriends();

</script>
</body>
</html>
