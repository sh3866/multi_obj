<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Hub // Aetheria</title>
<style>
    :root {
        /* Core Palette - Deep Space & Neon */
        --bg-deep: #0b0c10;
        --bg-panel: #1f2833;
        --bg-panel-translucent: rgba(31, 40, 51, 0.85);
        --bg-surface: #45a29e; /* Cyan Teal */
        --bg-surface-dark: #2c3e50;
        --bg-surface-hover: #34495e;

        /* Accents */
        --accent-primary: #66fcf1; /* Electric Cyan */
        --accent-primary-dim: rgba(102, 252, 241, 0.1);
        --accent-gold: #f1c40f; /* Legendary/Rank */
        --accent-danger: #ff3e3e; /* Battle/Decline */
        --accent-success: #2ecc71; /* Online/Accept */
        --accent-purple: #a29bfe; /* Party/Magic */

        /* Text */
        --text-main: #ffffff;
        --text-muted: #c5c6c7;
        --text-dark: #808e9b;

        /* UI Elements */
        --border-subtle: 1px solid rgba(255, 255, 255, 0.08);
        --border-glow: 0 0 10px rgba(102, 252, 241, 0.3);
        --glass-panel: blur(12px);
        
        /* Typography */
        --font-stack: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        
        /* Effects */
        --shadow-card: 0 10px 30px rgba(0,0,0,0.4);
        --radius-sm: 8px;
        --radius-md: 16px;
        --radius-lg: 24px;
    }

    * { box-sizing: border-box; outline: none; user-select: none; }
    
    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        /* Dynamic Background */
        background: 
            radial-gradient(circle at 10% 20%, rgba(102, 252, 241, 0.08) 0%, transparent 30%),
            radial-gradient(circle at 90% 80%, rgba(162, 155, 254, 0.08) 0%, transparent 30%),
            var(--bg-deep);
    }

    /* --- Main Container --- */
    .app-container {
        width: 1400px;
        height: 880px;
        background: rgba(11, 12, 16, 0.6);
        backdrop-filter: var(--glass-panel);
        border-radius: var(--radius-lg);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.1);
        display: grid;
        /* Layout: Left Panel (Profile/Party) | Main List | Detail/Requests */
        grid-template-columns: 320px 1fr 380px;
        overflow: hidden;
        position: relative;
    }

    /* --- Scrollbar --- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* --- 1. Left Panel (Profile & Active Party) --- */
    .left-panel {
        background: rgba(0,0,0,0.2);
        border-right: var(--border-subtle);
        display: flex;
        flex-direction: column;
        padding: 32px;
        gap: 40px;
    }

    /* Profile Header */
    .profile-header {
        display: flex;
        align-items: center;
        gap: 16px;
    }

    .avatar-container {
        position: relative;
        width: 80px;
        height: 80px;
        flex-shrink: 0;
    }

    .avatar-img {
        width: 100%;
        height: 100%;
        border-radius: var(--radius-md);
        object-fit: cover;
        border: 2px solid rgba(255,255,255,0.1);
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .rank-badge {
        position: absolute;
        bottom: -8px;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(135deg, var(--accent-gold), #f39c12);
        color: #000;
        font-size: 0.65rem;
        font-weight: 800;
        padding: 4px 10px;
        border-radius: 20px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        box-shadow: 0 4px 10px rgba(241, 196, 15, 0.4);
        white-space: nowrap;
    }

    .profile-text h1 {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    .profile-text .level {
        color: var(--accent-primary);
        font-size: 0.9rem;
        font-weight: 600;
        margin-top: 4px;
        display: block;
    }

    /* Active Party Section */
    .party-section {
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding: 0 4px;
    }

    .section-title {
        color: var(--text-muted);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-weight: 700;
    }

    .party-count {
        color: var(--accent-primary);
        font-size: 0.8rem;
        font-weight: 700;
        background: var(--accent-primary-dim);
        padding: 2px 8px;
        border-radius: 4px;
    }

    .party-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .party-member-card {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: var(--radius-sm);
        padding: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 8px;
        transition: 0.2s;
        cursor: pointer;
    }

    .party-member-card:hover {
        background: rgba(255,255,255,0.06);
        border-color: var(--accent-primary);
        transform: translateY(-2px);
    }

    .party-avatar-wrapper {
        position: relative;
        width: 48px;
        height: 48px;
    }

    .party-avatar {
        width: 100%;
        height: 100%;
        border-radius: 12px;
        object-fit: cover;
    }

    .status-indicator {
        position: absolute;
        bottom: -2px;
        right: -2px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid var(--bg-deep);
    }
    
    .status-indicator.online { background: var(--accent-success); box-shadow: 0 0 8px var(--accent-success); }
    .status-indicator.ingame { background: var(--accent-gold); box-shadow: 0 0 8px var(--accent-gold); }
    .status-indicator.offline { background: var(--text-dark); }

    .party-name {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-main);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
    }

    .party-status {
        font-size: 0.7rem;
        color: var(--text-muted);
    }

    /* --- 2. Middle Panel (Friends List) --- */
    .main-panel {
        display: flex;
        flex-direction: column;
        position: relative;
    }

    .top-bar {
        padding: 32px;
        background: linear-gradient(180deg, rgba(11,12,16,0.9) 0%, transparent 100%);
        z-index: 10;
    }

    .controls-row {
        display: flex;
        gap: 16px;
        margin-bottom: 24px;
    }

    .search-wrapper {
        flex: 1;
        position: relative;
    }

    .search-input {
        width: 100%;
        background: rgba(0,0,0,0.3);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 12px 16px 12px 44px;
        border-radius: var(--radius-sm);
        color: var(--text-main);
        font-size: 0.95rem;
        transition: 0.2s;
    }

    .search-input:focus {
        border-color: var(--accent-primary);
        box-shadow: 0 0 0 2px var(--accent-primary-dim);
        background: rgba(0,0,0,0.5);
    }

    .search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-dark);
        pointer-events: none;
    }

    .btn-add-friend {
        background: var(--accent-primary);
        color: #000;
        border: none;
        padding: 0 24px;
        border-radius: var(--radius-sm);
        font-weight: 700;
        font-size: 0.9rem;
        cursor: pointer;
        transition: 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 15px rgba(102, 252, 241, 0.3);
    }

    .btn-add-friend:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 252, 241, 0.5);
    }

    .filter-tabs {
        display: flex;
        gap: 8px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        padding-bottom: 16px;
    }

    .filter-tab {
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-dark);
        cursor: pointer;
        transition: 0.2s;
    }

    .filter-tab:hover { color: var(--text-muted); }
    
    .filter-tab.active {
        background: rgba(255,255,255,0.1);
        color: var(--text-main);
    }

    .filter-tab .count {
        margin-left: 6px;
        opacity: 0.6;
        font-size: 0.75rem;
    }

    .friends-scroll-area {
        flex: 1;
        overflow-y: auto;
        padding: 16px 32px;
    }

    .friend-row {
        display: flex;
        align-items: center;
        padding: 16px;
        border-radius: var(--radius-md);
        margin-bottom: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
        border: 1px solid transparent;
        position: relative;
    }

    .friend-row:hover {
        background: rgba(255,255,255,0.04);
        transform: translateX(4px);
    }

    .friend-row.selected {
        background: linear-gradient(90deg, rgba(102, 252, 241, 0.1) 0%, transparent 100%);
        border-color: rgba(102, 252, 241, 0.2);
    }
    
    .friend-row.selected::before {
        content: '';
        position: absolute;
        left: 0; top: 50%;
        transform: translateY(-50%);
        width: 4px; height: 24px;
        background: var(--accent-primary);
        border-radius: 0 4px 4px 0;
    }

    .friend-avatar-col {
        position: relative;
        width: 56px;
        height: 56px;
        margin-right: 16px;
    }

    .friend-avatar {
        width: 100%;
        height: 100%;
        border-radius: var(--radius-md);
        object-fit: cover;
    }

    .friend-info {
        flex: 1;
    }

    .friend-name {
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 4px;
    }

    .friend-status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.75rem;
        font-weight: 600;
    }

    .pill-online { background: rgba(46, 204, 113, 0.15); color: var(--accent-success); }
    .pill-ingame { background: rgba(241, 196, 15, 0.15); color: var(--accent-gold); }
    .pill-offline { background: rgba(255,255,255,0.05); color: var(--text-dark); }

    /* --- 3. Right Panel (Detail & Requests) --- */
    .right-panel {
        background: rgba(0,0,0,0.2);
        border-left: var(--border-subtle);
        position: relative;
        overflow: hidden;
    }

    /* VIEW: Detail Panel */
    .detail-view {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: var(--bg-panel);
        z-index: 20;
        transform: translateX(100%);
        transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        display: flex;
        flex-direction: column;
    }

    .detail-view.active {
        transform: translateX(0);
    }

    .detail-hero {
        height: 220px;
        background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.6) 100%),
                    radial-gradient(circle at 50% 0%, rgba(102, 252, 241, 0.2) 0%, transparent 70%);
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .close-detail {
        position: absolute;
        top: 20px; left: 20px;
        width: 36px; height: 36px;
        border-radius: 50%;
        background: rgba(0,0,0,0.3);
        border: 1px solid rgba(255,255,255,0.1);
        color: var(--text-main);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: 0.2s;
        z-index: 30;
    }
    .close-detail:hover { background: rgba(255,255,255,0.1); }

    .detail-avatar-large {
        width: 120px;
        height: 120px;
        border-radius: 28px;
        border: 3px solid rgba(255,255,255,0.2);
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        object-fit: cover;
        margin-bottom: 16px;
    }

    .detail-name { font-size: 1.8rem; font-weight: 800; margin: 0; }
    .detail-rank { 
        color: var(--accent-gold); 
        font-size: 0.9rem; 
        font-weight: 700; 
        text-transform: uppercase; 
        letter-spacing: 1px;
        margin-top: 4px;
    }

    .detail-stats-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding: 24px;
    }

    .stat-card {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.05);
        padding: 16px;
        border-radius: var(--radius-sm);
        text-align: center;
    }

    .stat-val { display: block; font-size: 1.2rem; font-weight: 700; color: var(--text-main); }
    .stat-lbl { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

    .detail-actions-area {
        margin-top: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: rgba(0,0,0,0.2);
    }

    .action-btn {
        width: 100%;
        padding: 14px;
        border-radius: var(--radius-sm);
        border: none;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: 0.2s;
    }

    .btn-invite {
        background: var(--accent-primary);
        color: #000;
        box-shadow: 0 4px 15px rgba(102, 252, 241, 0.3);
    }
    .btn-invite:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102, 252, 241, 0.5); }

    .btn-battle {
        background: rgba(255, 62, 62, 0.1);
        color: var(--accent-danger);
        border: 1px solid rgba(255, 62, 62, 0.3);
    }
    .btn-battle:hover { background: var(--accent-danger); color: #fff; }

    .btn-msg {
        background: transparent;
        border: 1px solid rgba(255,255,255,0.1);
        color: var(--text-muted);
    }
    .btn-msg:hover { border-color: var(--text-muted); color: var(--text-main); }

    /* VIEW: Requests */
    .requests-view {
        height: 100%;
        display: flex;
        flex-direction: column;
        transition: opacity 0.2s;
    }

    .requests-header {
        padding: 32px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: var(--border-subtle);
    }

    .req-badge {
        background: var(--accent-danger);
        color: white;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.75rem;
        font-weight: 700;
        box-shadow: 0 0 10px rgba(255, 62, 62, 0.4);
    }

    .requests-list {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
    }

    .request-card {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: var(--radius-md);
        padding: 20px;
        margin-bottom: 16px;
        position: relative;
        overflow: hidden;
        transition: 0.2s;
    }

    .request-card:hover {
        border-color: rgba(255,255,255,0.15);
        transform: translateY(-2px);
    }

    .req-top {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 16px;
    }

    .req-avatar {
        width: 48px; height: 48px;
        border-radius: 12px;
        object-fit: cover;
    }

    .req-info h4 { margin: 0; font-size: 1rem; color: var(--text-main); }
    .req-info p { margin: 4px 0 0; font-size: 0.8rem; color: var(--text-muted); }

    .req-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .req-btn {
        padding: 8px 0;
        border-radius: 8px;
        border: none;
        font-weight: 600;
        font-size: 0.85rem;
        cursor: pointer;
        transition: 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    .req-accept { background: var(--accent-success); color: #000; }
    .req-accept:hover { filter: brightness(1.1); }

    .req-decline { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); }
    .req-decline:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }

    /* SVG Icons */
    svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

</style>
</head>
<body>

<div class="app-container">
    
    <!-- LEFT PANEL: Profile & Party -->
    <aside class="left-panel">
        <div class="profile-header">
            <div class="avatar-container">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2366fcf1'/%3E%3Cstop offset='1' stop-color='%23a29bfe'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='16' fill='%231f2833'/%3E%3Cpath d='M50 25 C35 25 25 40 25 55 C25 75 50 85 50 85 C50 85 75 75 75 55 C75 40 65 25 50 25' fill='url(%23g)'/%3E%3C/svg%3E" alt="Me" class="avatar-img">
                <div class="rank-badge">Grandmaster</div>
            </div>
            <div class="profile-text">
                <h1>NeonRider</h1>
                <span class="level">Lvl 92 • Cyberpunk</span>
            </div>
        </div>

        <div class="party-section">
            <div class="section-header">
                <span class="section-title">Active Party</span>
                <span class="party-count">3/4</span>
            </div>
            <div class="party-grid" id="partyGrid">
                <!-- Populated by JS -->
            </div>
        </div>
    </aside>

    <!-- MAIN PANEL: Friends List -->
    <section class="main-panel">
        <div class="top-bar">
            <div class="controls-row">
                <div class="search-wrapper">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" class="search-input" placeholder="Search friends, clans...">
                </div>
                <button class="btn-add-friend">
                    <svg width="18" height="18" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Add Friend
                </button>
            </div>
            <div class="filter-tabs">
                <div class="filter-tab active">All Friends <span class="count">42</span></div>
                <div class="filter-tab">Online <span class="count">12</span></div>
                <div class="filter-tab">In Game <span class="count">4</span></div>
            </div>
        </div>

        <div class="friends-scroll-area" id="friendList">
            <!-- Populated by JS -->
        </div>
    </section>

    <!-- RIGHT PANEL: Contextual (Detail or Requests) -->
    <aside class="right-panel">
        
        <!-- Requests View (Default) -->
        <div id="requestsView" class="requests-view">
            <div class="requests-header">
                <span class="section-title" style="font-size: 1rem; color: #fff;">Friend Requests</span>
                <span class="req-badge">3 New</span>
            </div>
            <div class="requests-list">
                <!-- Request 1 -->
                <div class="request-card">
                    <div class="req-top">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='12' fill='%232d3436'/%3E%3Cpath d='M50 20 L80 80 L20 80 Z' fill='%23a29bfe'/%3E%3C/svg%3E" class="req-avatar" alt="User">
                        <div class="req-info">
                            <h4>Glitch_Monkey</h4>
                            <p>Requested 2m ago</p>
                        </div>
                    </div>
                    <div class="req-actions">
                        <button class="req-btn req-accept">
                            <svg width="16" height="16" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            Accept
                        </button>
                        <button class="req-btn req-decline">Decline</button>
                    </div>
                </div>

                <!-- Request 2 -->
                <div class="request-card">
                    <div class="req-top">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='12' fill='%23636e72'/%3E%3Ccircle cx='50' cy='50' r='30' fill='%232ed573'/%3E%3C/svg%3E" class="req-avatar" alt="User">
                        <div class="req-info">
                            <h4>EcoWarrior</h4>
                            <p>Requested 1h ago</p>
                        </div>
                    </div>
                    <div class="req-actions">
                        <button class="req-btn req-accept">
                            <svg width="16" height="16" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            Accept
                        </button>
                        <button class="req-btn req-decline">Decline</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Detail View (Overlay) -->
        <div id="detailView" class="detail-view">
            <div class="close-detail" onclick="closeDetail()">
                <svg width="20" height="20" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>
            
            <div class="detail-hero">
                <img id="detailAvatar" class="detail-avatar-large" src="" alt="Detail">
                <h2 id="detailName" class="detail-name">Name</h2>
                <span id="detailRank" class="detail-rank">Rank</span>
            </div>

            <div class="detail-stats-grid">
                <div class="stat-card">
                    <span class="stat-val">1,240</span>
                    <span class="stat-lbl">Wins</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val">86%</span>
                    <span class="stat-lbl">Win Rate</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val">45</span>
                    <span class="stat-lbl">Matches</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val">Lvl 72</span>
                    <span class="stat-lbl">Level</span>
                </div>
            </div>

            <div class="detail-actions-area">
                <button class="action-btn btn-invite">
                    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                    Invite to Game
                </button>
                <button class="action-btn btn-battle">
                    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M14.5 17.5L3 6V3h3l11.5 11.5m-4 4l5-5"></path><path d="M16 3h5v5"></path></svg>
                    Challenge to Battle
                </button>
                <button class="action-btn btn-msg">
                    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Send Message
                </button>
            </div>
        </div>

    </aside>

</div>

<script>
    // --- Data ---
    const partyMembers = [
        { name: "CyberWolf", status: "ingame", game: "Battle Arena", color: "#54a0ff", shape: "triangle" },
        { name: "Viper_X", status: "online", game: "In Lobby", color: "#ff4757", shape: "circle" },
        { name: "NovaStar", status: "online", game: "In Lobby", color: "#feca57", shape: "square" }
    ];

    const friends = [
        { id: 1, name: "CyberWolf", status: "ingame", game: "Battle Arena", rank: "Diamond II", color: "#54a0ff", shape: "triangle" },
        { id: 2, name: "Viper_X", status: "online", game: "In Lobby", rank: "Platinum I", color: "#ff4757", shape: "circle" },
        { id: 3, name: "NovaStar", status: "online", game: "In Lobby", rank: "Master", color: "#feca57", shape: "square" },
        { id: 4, name: "GhostShell", status: "offline", game: "Last seen 2h ago", rank: "Gold III", color: "#dfe6e9", shape: "hex" },
        { id: 5, name: "PixelPunk", status: "ingame", game: "Ranked 5v5", rank: "Silver I", color: "#a29bfe", shape: "star" },
        { id: 6, name: "IronClad", status: "online", game: "In Lobby", rank: "Platinum III", color: "#74b9ff", shape: "shield" },
        { id: 7, name: "ShadowMerk", status: "offline", game: "Last seen yesterday", rank: "Diamond I", color: "#636e72", shape: "diamond" },
        { id: 8, name: "LunaTide", status: "ingame", game: "Co-op Raid", rank: "Grandmaster", color: "#00cec9", shape: "moon" }
    ];

    // --- Render Functions ---
    
    // Helper to generate SVG Avatars
    function getAvatarSVG(color, shape, size=100) {
        const bg = '#1f2833';
        let shapePath = '';
        
        switch(shape) {
            case 'triangle': shapePath = `<path d="M50 25 L80 80 L20 80 Z" fill="${color}"/>`; break;
            case 'circle': shapePath = `<circle cx="50" cy="50" r="30" fill="${color}"/>`; break;
            case 'square': shapePath = `<rect x="25" y="25" width="50" height="50" rx="4" fill="${color}"/>`; break;
            case 'hex': shapePath = `<polygon points="50,20 80,35 80,65 50,80 20,65 20,35" fill="${color}"/>`; break;
            case 'star': shapePath = `<polygon points="50,15 61,35 85,35 65,50 75,75 50,60 25,75 35,50 15,35 39,35" fill="${color}"/>`; break;
            case 'shield': shapePath = `<path d="M25 25 L75 25 L75 50 C75 75 50 85 50 85 C50 85 25 75 25 50 Z" fill="${color}"/>`; break;
            case 'diamond': shapePath = `<polygon points="50,20 80,50 50,80 20,50" fill="${color}"/>`; break;
            case 'moon': shapePath = `<path d="M50 20 A30 30 0 1 0 50 80 A20 20 0 1 1 50 20" fill="${color}"/>`; break;
            default: shapePath = `<circle cx="50" cy="50" r="30" fill="${color}"/>`;
        }

        return `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='${encodeURIComponent(bg)}'/%3E${shapePath}%3C/svg%3E`;
    }

    function renderParty() {
        const grid = document.getElementById('partyGrid');
        grid.innerHTML = '';
        partyMembers.forEach(member => {
            const avatar = getAvatarSVG(member.color, member.shape);
            const card = document.createElement('div');
            card.className = 'party-member-card';
            card.onclick = () => selectFriendById(member.name); // Simple lookup for demo
            
            card.innerHTML = `
                <div class="party-avatar-wrapper">
                    <img src="${avatar}" class="party-avatar" alt="${member.name}">
                    <div class="status-indicator ${member.status}"></div>
                </div>
                <span class="party-name">${member.name}</span>
                <span class="party-status" style="color: var(--accent-${member.status === 'online' ? 'success' : 'gold'})">${member.game}</span>
            `;
            grid.appendChild(card);
        });
    }

    function renderFriends() {
        const list = document.getElementById('friendList');
        list.innerHTML = '';
        
        friends.forEach(friend => {
            const avatar = getAvatarSVG(friend.color, friend.shape);
            const row = document.createElement('div');
            row.className = 'friend-item friend-row';
            row.onclick = () => selectFriend(friend, row);

            // Status Pill Logic
            let pillClass = 'pill-offline';
            let statusText = 'Offline';
            if(friend.status === 'online') { pillClass = 'pill-online'; statusText = 'Online'; }
            if(friend.status === 'ingame') { pillClass = 'pill-ingame'; statusText = `Playing ${friend.game}`; }

            row.innerHTML = `
                <div class="friend-avatar-col">
                    <img src="${avatar}" class="friend-avatar" alt="${friend.name}">
                    <div class="status-indicator ${friend.status}"></div>
                </div>
                <div class="friend-info">
                    <div class="friend-name">${friend.name}</div>
                    <div class="friend-status-pill ${pillClass}">
                        <svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="12" r="10"/></svg>
                        ${statusText}
                    </div>
                </div>
            `;
            list.appendChild(row);
        });
    }

    // --- Interaction Logic ---

    function selectFriend(friend, element) {
        // Highlight List Item
        document.querySelectorAll('.friend-row').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');

        // Populate Detail Panel
        document.getElementById('detailName').innerText = friend.name;
        document.getElementById('detailRank').innerText = friend.rank;
        
        const avatar = getAvatarSVG(friend.color, friend.shape);
        document.getElementById('detailAvatar').src = avatar;

        // Switch View
        document.getElementById('requestsView').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('requestsView').style.display = 'none';
            document.getElementById('detailView').classList.add('active');
        }, 200);
    }

    function selectFriendById(name) {
        const friend = friends.find(f => f.name === name);
        if(friend) {
            const element = document.querySelector(`.friend-row[onclick*="${friend.id}"]`); // Simplified selection
            // Find element by index or re-render logic if needed, but for demo:
            const rows = Array.from(document.querySelectorAll('.friend-row'));
            const targetRow = rows.find(r => r.innerHTML.includes(friend.name));
            if(targetRow) selectFriend(friend, targetRow);
        }
    }

    function closeDetail() {
        const detail = document.getElementById('detailView');
        detail.classList.remove('active');
        
        setTimeout(() => {
            const reqs = document.getElementById('requestsView');
            reqs.style.display = 'flex';
            // Trigger reflow
            void reqs.offsetWidth; 
            reqs.style.opacity = '1';
            document.querySelectorAll('.friend-row').forEach(el => el.classList.remove('selected'));
        }, 300);
    }

    // Init
    renderParty();
    renderFriends();

</script>
</body>
</html>
