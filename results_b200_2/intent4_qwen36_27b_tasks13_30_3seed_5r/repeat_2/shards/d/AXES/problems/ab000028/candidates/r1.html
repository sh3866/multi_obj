<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verticality // The Descent</title>
<style>
  :root {
    --c-sky-top: #1a2639;
    --c-sky-bot: #5d7285;
    --c-cliff-dark: #0f1215;
    --c-cliff-light: #2c353e;
    --c-accent: #FF3B30; /* Apple Red for high contrast */
    --c-text-main: #F2F2F2;
    --c-text-muted: #8CA0B5;
    --font-display: "Impact", "Haettenschweiler", "Arial Narrow Bold", sans-serif;
    --font-ui: "Courier New", Courier, monospace;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--c-sky-top);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--c-text-main);
  }

  /* Layout Container */
  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* The SVG Scene */
  #scene {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* UI Overlay Layer - Editorial Grid */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
    display: grid;
    grid-template-columns: 80px 1fr 80px;
    grid-template-rows: 100px 1fr 120px;
    padding: 40px;
    box-sizing: border-box;
  }

  /* Typography */
  .header-group {
    grid-column: 1 / span 3;
    grid-row: 1;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    mix-blend-mode: difference; /* Ensures visibility over bright or dark sky */
  }

  .brand h1 {
    font-family: var(--font-display);
    font-size: 24px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 0;
    color: var(--c-text-main);
    opacity: 0.9;
  }

  .brand span {
    display: block;
    font-family: var(--font-ui);
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--c-accent);
    margin-bottom: 5px;
    font-weight: bold;
  }

  /* Data Readout (Top Right) */
  .data-panel {
    text-align: right;
    font-family: var(--font-ui);
    font-size: 11px;
    line-height: 1.4;
    color: var(--c-text-muted);
    border-right: 1px solid var(--c-accent);
    padding-right: 10px;
  }

  .data-row {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  
  .data-val {
    color: var(--c-text-main);
    font-weight: bold;
  }

  /* Main Headline (Bottom Left) */
  .editorial {
    grid-column: 1 / span 2;
    grid-row: 3;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start;
    mix-blend-mode: difference;
  }

  .editorial h2 {
    font-family: var(--font-display);
    font-size: clamp(48px, 8vw, 120px);
    line-height: 0.85;
    font-weight: 400;
    color: var(--c-text-main);
    margin: 0;
    text-transform: uppercase;
    letter-spacing: -2px;
  }

  .editorial p {
    margin-top: 15px;
    font-family: var(--font-ui);
    font-size: 12px;
    max-width: 350px;
    line-height: 1.6;
    color: var(--c-text-muted);
    border-left: 2px solid var(--c-accent);
    padding-left: 15px;
  }

  /* Controls (Bottom Right) */
  .controls {
    grid-column: 3;
    grid-row: 3;
    display: flex;
    justify-content: flex-end;
    align-items: flex-end;
    pointer-events: auto;
    gap: 15px;
  }

  .btn {
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--c-text-main);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn:hover {
    border-color: var(--c-accent);
    color: var(--c-accent);
    transform: scale(1.1);
  }

  /* Animations */
  @keyframes float {
    0% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(1deg); }
    100% { transform: translateY(0px) rotate(0deg); }
  }

  @keyframes wind-stream {
    0% { stroke-dashoffset: 1000; }
    100% { stroke-dashoffset: 0; }
  }

  @keyframes pulse-opacity {
    0% { opacity: 0.3; }
    50% { opacity: 0.8; }
    100% { opacity: 0.3; }
  }

  .parachute-group {
    transform-origin: center 60%;
    animation: float 6s ease-in-out infinite;
  }

  .wind-line {
    stroke: rgba(255, 255, 255, 0.15);
    stroke-linecap: round;
    fill: none;
    stroke-dasharray: 100 400;
    animation: wind-stream 8s linear infinite;
  }

  .wind-line.fast {
    stroke-dasharray: 50 200;
    animation-duration: 4s;
  }

  /* SVG Filters */
  .blur-bg { filter: blur(6px); }
  .blur-far { filter: blur(12px); opacity: 0.6; }

</style>
</head>
<body>

<div id="viewport">
  
  <!-- UI Overlay -->
  <div class="ui-layer">
    <div class="header-group">
      <div class="brand">
        <span>PROJECT 04</span>
        <h1>Verticality</h1>
      </div>
      
      <div class="data-panel">
        <div class="data-row">ALT <span class="data-val">2,450m</span></div>
        <div class="data-row">SPD <span class="data-val">4.2m/s</span></div>
        <div class="data-row">WIND <span class="data-val">NW 12kt</span></div>
        <div class="data-row">STATUS <span class="data-val" style="color:var(--c-accent)">DESCENT</span></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="windToggle" title="Toggle Wind Intensity">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
        </svg>
      </button>
      <button class="btn" id="zoomToggle" title="Toggle View">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
          <line x1="11" y1="8" x2="11" y2="14"></line>
        </svg>
      </button>
    </div>

    <div class="editorial">
      <h2>The<br>Edge.</h2>
      <p>Geological strata meets the physics of flight. A study in tension, atmospheric scale, and the visceral danger of the vertical drop.</p>
    </div>
  </div>

  <!-- The Scene -->
  <svg id="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Sky Gradient (Atmospheric) -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#1a2639;stop-opacity:1" />
        <stop offset="40%" style="stop-color:#2c4055;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#8ba3b5;stop-opacity:1" />
      </linearGradient>

      <!-- Canopy Gradient (Volumetric) -->
      <radialGradient id="canopyGrad" cx="50%" cy="30%" r="70%">
        <stop offset="0%" style="stop-color:#FF5E52;stop-opacity:1" />
        <stop offset="70%" style="stop-color:#D70015;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#99000D;stop-opacity:1" />
      </radialGradient>

      <!-- Cliff Gradient (Depth) -->
      <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#1a1f24;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#2c353e;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#0f1215;stop-opacity:1" />
      </linearGradient>

      <!-- Depth Blur Filter -->
      <filter id="blurFilter">
        <feGaussianBlur in="SourceGraphic" stdDeviation="4" />
      </filter>
    </defs>

    <!-- Background Sky -->
    <rect width="1200" height="800" fill="url(#skyGrad)" />

    <!-- Distant Mountains (Scale) -->
    <g class="blur-far" fill="#4A6075">
      <path d="M0,650 L150,550 L300,600 L500,480 L700,620 L900,500 L1200,650 L1200,800 L0,800 Z" opacity="0.4" />
      <path d="M0,700 L200,620 L400,680 L600,580 L800,700 L1200,600 L1200,800 L0,800 Z" opacity="0.6" />
    </g>

    <!-- Wind Lines (Atmosphere) -->
    <g id="wind-container" opacity="0.5">
      <path class="wind-line" d="M-100,150 Q400,120 1300,180" />
      <path class="wind-line fast" d="M-100,350 Q400,300 1300,400" />
      <path class="wind-line" d="M-100,550 Q400,520 1300,600" />
      <path class="wind-line fast" d="M-100,700 Q400,680 1300,750" />
    </g>

    <!-- Main Cliff Face (Foreground Right) -->
    <!-- Redrawn for massive scale and geological texture -->
    <g id="cliff" filter="url(#blurFilter)">
      <!-- Base Shape -->
      <path d="M850,0 L1200,0 L1200,800 L950,800 L900,700 L980,600 L850,500 L920,400 L800,300 L880,200 L850,100 Z" fill="url(#cliffGrad)" />
      
      <!-- Strata / Layers (Polished) -->
      <path d="M850,0 L1200,0 L1200,800 L950,800 L900,700 L980,600 L850,500 L920,400 L800,300 L880,200 L850,100 L830,100 L790,200 L870,300 L790,400 L830,500 L750,600 L800,700 L750,800 L800,800 Z" fill="#15191d" opacity="0.6" />
      
      <!-- Jagged Detail Lines -->
      <path d="M880,200 L950,220" stroke="#000" stroke-width="2" opacity="0.5" />
      <path d="M850,500 L920,520" stroke="#000" stroke-width="2" opacity="0.5" />
      <path d="M900,700 L980,720" stroke="#000" stroke-width="2" opacity="0.5" />
    </g>

    <!-- Parachute Subject Group (Re-centered & Scaled) -->
    <!-- Positioned to show proximity to cliff but safety of canopy -->
    <g id="subject" class="parachute-group" transform="translate(600, 350)">
      
      <!-- Suspension Lines (Taut, varied thickness) -->
      <g stroke="#FFF" stroke-opacity="0.8">
        <!-- Left Set -->
        <line x1="-140" y1="60" x2="-20" y2="160" stroke-width="1" />
        <line x1="-80" y1="80" x2="-20" y2="160" stroke-width="1.5" />
        <line x1="-20" y1="90" x2="-20" y2="160" stroke-width="2" />
        <!-- Right Set -->
        <line x1="20" y1="90" x2="20" y2="160" stroke-width="2" />
        <line x1="80" y1="80" x2="20" y2="160" stroke-width="1.5" />
        <line x1="140" y1="60" x2="20" y2="160" stroke-width="1" />
      </g>

      <!-- The Human Figure (Silhouette) -->
      <g transform="translate(0, 160)">
        <!-- Body -->
        <path d="M-8,0 C-15,20 -8,40 0,50 L0,80 L16,80 L16,50 C24,40 15,20 8,0 Z" fill="#0a0a0a" />
        <!-- Head -->
        <circle cx="8" cy="-8" r="8" fill="#0a0a0a" />
        <!-- Helmet Highlight -->
        <circle cx="6" cy="-10" r="2" fill="#444" />
        <!-- Arms (Tension) -->
        <path d="M-5,10 Q-25,30 -30,20" stroke="#0a0a0a" stroke-width="5" fill="none" stroke-linecap="round" />
        <path d="M21,10 Q41,30 46,20" stroke="#0a0a0a" stroke-width="5" fill="none" stroke-linecap="round" />
        <!-- Legs -->
        <path d="M0,80 L-10,120 L-20,120" stroke="#0a0a0a" stroke-width="6" fill="none" stroke-linecap="round" />
        <path d="M16,80 L26,120 L16,120" stroke="#0a0a0a" stroke-width="6" fill="none" stroke-linecap="round" />
      </g>

      <!-- The Canopy (Inflated, Volumetric) -->
      <path d="M-180,20 Q-90,100 0,100 Q90,100 180,20 Q90,-20 0,-20 Q-90,-20 -180,20 Z" fill="url(#canopyGrad)" />
      
      <!-- Canopy Ribs (Editorial Detail) -->
      <g stroke="#800000" stroke-width="2" opacity="0.4" fill="none">
        <path d="M0,-20 L0,100" />
        <path d="M-60,-10 L-30,100" />
        <path d="M60,-10 L30,100" />
        <path d="M-120,0 L-60,100" />
        <path d="M120,0 L60,100" />
      </g>
    </g>

    <!-- Foreground Elements (Depth/Obstruction) -->
    <path class="blur-bg" d="M-50,850 L100,600 L200,850 Z" fill="#0f1215" opacity="0.8" />
    <path class="blur-bg" d="M1100,850 L1200,700 L1300,850 Z" fill="#0f1215" opacity="0.8" />

  </svg>
</div>

<script>
  const scene = document.getElementById('scene');
  const windContainer = document.getElementById('wind-container');
  const subject = document.getElementById('subject');
  const windToggle = document.getElementById('windToggle');
  const zoomToggle = document.getElementById('zoomToggle');

  let isZoomed = false;
  let windState = 1; // 1 = normal, 2 = high

  // Toggle Wind
  windToggle.addEventListener('click', () => {
    if (windState === 1) {
      // High Wind
      windContainer.style.opacity = "1";
      document.querySelectorAll('.wind-line').forEach(line => {
        line.style.animationDuration = '2s'; // Faster
      });
      subject.style.animation = 'float 2s ease-in-out infinite'; // More frantic
      windToggle.style.borderColor = 'var(--c-accent)';
      windToggle.style.color = 'var(--c-accent)';
      windState = 2;
    } else {
      // Normal Wind
      windContainer.style.opacity = "0.5";
      document.querySelectorAll('.wind-line').forEach(line => {
        line.style.animationDuration = '8s'; // Slower
      });
      subject.style.animation = 'float 6s ease-in-out infinite'; // Calm
      windToggle.style.borderColor = 'rgba(255,255,255,0.2)';
      windToggle.style.color = 'var(--c-text-main)';
      windState = 1;
    }
  });

  // Toggle Zoom
  zoomToggle.addEventListener('click', () => {
    isZoomed = !isZoomed;
    const scale = isZoomed ? "scale(1.15)" : "scale(1)";
    const translate = isZoomed ? "translate(50px, -20px)" : "translate(0,0)";
    
    scene.style.transition = "transform 0.8s cubic-bezier(0.16, 1, 0.3, 1)";
    scene.style.transform = `${scale} ${translate}`;
    
    // Visual feedback on button
    zoomToggle.style.transform = isZoomed ? "scale(0.9)" : "scale(1)";
  });

  // Subtle Parallax on Mouse Move
  document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 2; // -1 to 1
    const y = (e.clientY / window.innerHeight - 0.5) * 2;

    // Parallax for subject (moves opposite to mouse to simulate depth)
    const subjectX = x * -15;
    const subjectY = y * -15;
    
    // Note: We append this to the existing transform if possible, 
    // but for simplicity in vanilla JS without complex matrix math, 
    // we apply a slight offset to the SVG container itself for the background
    // and let the CSS animation handle the subject.
    
    // To make it robust, we'll only shift the background layer (cliff)
    const cliff = document.getElementById('cliff');
    cliff.style.transform = `translate(${x * 20}px, ${y * 20}px)`;
  });

</script>
</body>
</html>
