<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Descent // Editorial Illustration</title>
<style>
  :root {
    /* Palette: High Contrast, Editorial */
    --c-bg-top: #0F172A;
    --c-bg-horizon: #1E293B;
    --c-cliff-face: #020617;
    --c-cliff-highlight: #334155;
    --c-accent: #FF3B30; /* The Red Canopy */
    --c-accent-glow: rgba(255, 59, 48, 0.4);
    --c-ui-text: #F8FAFC;
    --c-ui-dim: #94A3B8;
    
    /* Typography */
    --font-sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-mono: "Courier New", Courier, monospace;
  }

  * { box-sizing: border-box; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--c-bg-top);
    font-family: var(--font-sans);
    overflow: hidden;
    color: var(--c-ui-text);
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* --- The Scene (SVG Layer) --- */
  #scene-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    /* Prevents scaling artifacts */
    shape-rendering: geometricPrecision; 
    will-change: transform;
  }

  /* --- The UI (Overlay Layer) --- */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none; /* Let clicks pass through to potential canvas interactions */
    padding: 3rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Unified UI Container Style */
  .ui-card {
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-left: 3px solid var(--c-accent);
    padding: 1rem;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    pointer-events: auto;
    max-width: 220px;
    transition: transform 0.3s ease;
  }

  .ui-card:hover {
    border-left-color: #fff;
  }

  /* Top Bar */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .brand h1 {
    margin: 0;
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    line-height: 1;
  }
  .brand span {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--c-accent);
    margin-top: 0.25rem;
    letter-spacing: 0.05em;
  }

  /* Bottom Bar */
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  /* Editorial Text */
  .editorial-content {
    max-width: 320px;
  }
  .headline {
    font-size: 3.5rem;
    line-height: 0.85;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    margin: 0 0 1rem 0;
    color: #fff;
    text-shadow: 0 4px 12px rgba(0,0,0,0.5);
  }
  .copy {
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--c-ui-dim);
    max-width: 280px;
    border-left: 1px solid var(--c-ui-dim);
    padding-left: 1rem;
  }

  /* HUD Data */
  .hud-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 4px;
    font-family: var(--font-mono);
    font-size: 0.8rem;
  }
  .hud-row {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding: 4px 0;
  }
  .hud-row:last-child { border-bottom: none; }
  .label { color: var(--c-ui-dim); text-transform: uppercase; }
  .val { font-weight: 700; color: #fff; }
  .val.alert { color: var(--c-accent); }

  /* Animations */
  @keyframes float-parachute {
    0% { transform: translate(0px, 0px) rotate(0deg); }
    33% { transform: translate(8px, -15px) rotate(1.5deg); }
    66% { transform: translate(-6px, -8px) rotate(-1deg); }
    100% { transform: translate(0px, 0px) rotate(0deg); }
  }

  @keyframes wind-flow {
    0% { stroke-dashoffset: 1000; }
    100% { stroke-dashoffset: -500; }
  }

  .parachute-system {
    transform-origin: center;
    animation: float-parachute 7s ease-in-out infinite;
  }

  .wind-streak {
    fill: none;
    stroke: rgba(255, 255, 255, 0.08);
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-dasharray: 100 900;
    animation: wind-flow 15s linear infinite;
  }
  .wind-streak.fast {
    stroke: rgba(255, 255, 255, 0.15);
    stroke-width: 2;
    stroke-dasharray: 50 1100;
    animation-duration: 6s;
  }

</style>
</head>
<body>

<div id="stage">

  <!-- UI Overlay -->
  <div class="ui-layer">
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <h1>The Descent</h1>
        <span>Fig 01. // Verticality</span>
      </div>
      
      <!-- Right Side HUD -->
      <div class="ui-card">
        <div class="hud-grid">
          <div class="hud-row">
            <span class="label">Altitude</span>
            <span class="val">3,450m</span>
          </div>
          <div class="hud-row">
            <span class="label">Velocity</span>
            <span class="val">5.2 m/s</span>
          </div>
          <div class="hud-row">
            <span class="label">Wind</span>
            <span class="val">NW 18kt</span>
          </div>
          <div class="hud-row">
            <span class="label">Status</span>
            <span class="val alert">CRITICAL</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="editorial-content">
        <h2 class="headline">The<br>Edge</h2>
        <p class="copy">
          Geological permanence vs. atmospheric fragility. 
          The descent is controlled, but the margin for error is zero.
        </p>
      </div>
    </div>
  </div>

  <!-- The Scene: High Fidelity SVG -->
  <svg id="scene-svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- 1. Sky Gradient -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#05080a" />
        <stop offset="50%" stop-color="#14202e" />
        <stop offset="100%" stop-color="#2c3e50" />
      </linearGradient>

      <!-- 2. Canopy Gradient (Volumetric Red) -->
      <radialGradient id="canopyGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
        <stop offset="0%" stop-color="#FF8A80" />
        <stop offset="25%" stop-color="#FF3B30" />
        <stop offset="70%" stop-color="#991B1B" />
        <stop offset="100%" stop-color="#450a0a" />
      </radialGradient>

      <!-- 3. Cliff Gradient (Dark Mass) -->
      <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#1e293b" />
        <stop offset="20%" stop-color="#0f172a" />
        <stop offset="100%" stop-color="#020617" />
      </linearGradient>

      <!-- 4. Rim Light for Cliff -->
      <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
        <stop offset="100%" stop-color="rgba(255,255,255,0)" />
      </linearGradient>
      
      <!-- 5. Mist Gradient -->
      <linearGradient id="mistGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#2c3e50" stop-opacity="0" />
        <stop offset="100%" stop-color="#2c3e50" stop-opacity="0.8" />
      </linearGradient>

      <!-- 6. Filter for atmospheric haze -->
      <filter id="blurHaze" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" />
      </filter>
    </defs>

    <!-- 1. Background -->
    <rect width="1200" height="800" fill="url(#skyGrad)" />

    <!-- 2. Distant Mountains (Atmospheric Depth) -->
    <g id="mountains" fill="#1e293b" opacity="0.4">
      <!-- Far Left Range -->
      <path d="M-200,700 L100,450 L300,600 L500,400 L800,700 Z" />
      <!-- Far Right Range -->
      <path d="M900,800 L1100,500 L1300,650 L1500,800 Z" />
    </g>

    <!-- 3. The Cliff (Foreground Right - Massive & Jagged) -->
    <g id="cliff" transform="translate(0,0)">
      <!-- Base Shape -->
      <path d="M900,0 
               L1200,0 
               L1200,800 
               L850,800 
               L880,650 
               L820,550 
               L920,450 
               L850,350 
               L950,250 
               L880,150 
               L920,50 
               Z" 
            fill="url(#cliffGrad)" />
      
      <!-- Rim Light (Separation) -->
      <path d="M900,0 L920,50 L880,150 L950,250 L850,350 L920,450 L820,550 L880,650 L850,800" 
            fill="none" stroke="url(#rimLight)" stroke-width="4" />

      <!-- Geological Strata (Texture) -->
      <g stroke="#000" stroke-opacity="0.4" stroke-width="2">
        <path d="M920,50 L1200,50 L1200,150 L880,150 Z" fill="#1a2333" />
        <path d="M950,250 L1200,250 L1200,350 L850,350 Z" fill="#151e2b" />
        <path d="M920,450 L1200,450 L1200,550 L820,550 Z" fill="#111827" />
        <path d="M880,650 L1200,650 L1200,800 L850,800 Z" fill="#0f131a" />
      </g>
      
      <!-- Jagged details / Cracks -->
      <g stroke="#000" stroke-width="2" fill="none" opacity="0.6">
        <path d="M910,80 L930,100 L900,120" />
        <path d="M860,300 L880,320 L850,340" />
        <path d="M910,480 L930,500" />
      </g>
    </g>

    <!-- 4. Wind & Motion Cues -->
    <g id="wind-layer">
      <!-- Ambient Wind -->
      <path class="wind-streak" d="M-100,150 Q400,100 1300,200" />
      <path class="wind-streak" d="M-100,400 Q600,350 1300,450" />
      <path class="wind-streak" d="M-100,650 Q500,600 1300,700" />
      
      <!-- Fast Gusts (Action) -->
      <path class="wind-streak fast" d="M-100,250 Q300,200 1300,300" />
      <path class="wind-streak fast" d="M-100,550 Q800,500 1300,600" />
      <path class="wind-streak fast" d="M-100,100 Q700,50 1300,150" />
    </g>

    <!-- 5. The Subject (Parachute & Human) -->
    <!-- Positioned Center-Left to balance the heavy Cliff on the Right -->
    <g id="parachute-system" class="parachute-system" transform="translate(500, 250)">
      
      <!-- Harness Lines (Taut, connecting figure to canopy) -->
      <!-- Using a path to simulate a bundle of lines -->
      <g stroke="#ffffff" stroke-width="1" opacity="0.8">
        <line x1="-180" y1="60" x2="-15" y2="280" />
        <line x1="-175" y1="62" x2="-15" y2="280" />
        <line x1="-185" y1="58" x2="-15" y2="280" />
        
        <line x1="-50" y1="90" x2="-15" y2="280" />
        <line x1="-45" y1="92" x2="-15" y2="280" />
        
        <line x1="50" y1="90" x2="15" y2="280" />
        <line x1="45" y1="92" x2="15" y2="280" />
        
        <line x1="180" y1="60" x2="15" y2="280" />
        <line x1="175" y1="62" x2="15" y2="280" />
        <line x1="185" y1="58" x2="15" y2="280" />
      </g>

      <!-- The Human Figure (Detailed Silhouette) -->
      <g transform="translate(0, 280)">
        <!-- Body (Suit) -->
        <path d="M-12,0 C-20,30 -15,60 0,70 L0,120 L22,120 L22,70 C30,60 20,30 12,0 Z" fill="#020617" />
        
        <!-- Helmet -->
        <circle cx="10" cy="-15" r="12" fill="#020617" />
        <!-- Visor Reflection -->
        <path d="M6,-18 Q12,-20 16,-14" stroke="#475569" stroke-width="2" fill="none" />
        
        <!-- Arms (Holding toggles) -->
        <path d="M-10,20 Q-45,50 -45,45" stroke="#020617" stroke-width="8" fill="none" stroke-linecap="round" />
        <path d="M24,20 Q55,50 55,45" stroke="#020617" stroke-width="8" fill="none" stroke-linecap="round" />
        
        <!-- Legs (Dangling) -->
        <path d="M0,120 L-15,160 L-30,160" stroke="#020617" stroke-width="9" fill="none" stroke-linecap="round" />
        <path d="M22,120 L35,160 L20,160" stroke="#020617" stroke-width="9" fill="none" stroke-linecap="round" />
      </g>

      <!-- The Canopy (Fully Inflated) -->
      <!-- Main Bell Shape -->
      <path d="M-240,10 Q-120,130 0,130 Q120,130 240,10 Q120,-50 0,-50 Q-120,-50 -240,10 Z" fill="url(#canopyGrad)" />
      
      <!-- Canopy Ribs (Adding volume/structure) -->
      <g stroke="#7f1d1d" stroke-width="3" opacity="0.6" fill="none">
        <path d="M0,-50 L0,130" />
        <path d="M-80,-30 L-40,130" />
        <path d="M80,-30 L40,130" />
        <path d="M-160,-10 L-80,130" />
        <path d="M160,-10 L80,130" />
      </g>
      
      <!-- Top Highlight (Light source) -->
      <path d="M-100,-45 Q0,-55 100,-45 Q0,-35 -100,-45 Z" fill="rgba(255,255,255,0.15)" />
    </g>

    <!-- 6. Foreground Mist (Depth) -->
    <rect x="0" y="500" width="1200" height="300" fill="url(#mistGrad)" opacity="0.4" filter="url(#blurHaze)" />

  </svg>
</div>

<script>
  const scene = document.getElementById('scene-svg');
  const mountains = document.getElementById('mountains');
  const cliff = document.getElementById('cliff');
  const parachute = document.getElementById('parachute-system');
  const windLayer = document.getElementById('wind-layer');

  // 1. Parallax Effect on Mouse Move
  // Creates the feeling of 3D depth between background, subject, and foreground
  document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 2; // -1 to 1
    const y = (e.clientY / window.innerHeight - 0.5) * 2;

    // Background moves slightly
    mountains.style.transform = `translate(${x * 10}px, ${y * 5}px)`;
    
    // Subject moves moderately
    parachute.style.transform = `translate(${500 + x * 20}px, ${250 + y * 15}px)`;
    // Note: We are overriding the CSS translate center, so we add the base 500/250 back
    
    // Cliff (Foreground) moves the most
    cliff.style.transform = `translate(${x * 30}px, ${y * 15}px)`;
  });

  // 2. Interactive "Wind Gust" on Click
  // Simulates a sudden change in atmospheric conditions
  document.addEventListener('click', () => {
    const gustStrength = 15;
    const gustDuration = 1000; // ms
    
    // Animate parachute violently
    const originalAnim = parachute.style.animation;
    parachute.style.transition = 'transform 0.2s ease-out';
    parachute.style.transform = `translate(${500 - gustStrength}px, ${250 + gustStrength}px) rotate(-5deg)`;
    
    // Speed up wind lines
    windLayer.style.transition = 'opacity 0.2s';
    windLayer.style.opacity = '1';
    
    setTimeout(() => {
      parachute.style.transform = ''; // Reset to CSS animation
      windLayer.style.opacity = ''; // Reset
    }, gustDuration);
  });

</script>
</body>
</html>
