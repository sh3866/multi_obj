<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Descent // Editorial Illustration</title>
<style>
  :root {
    /* Palette: High Contrast, Editorial */
    --c-bg-top: #02040a;
    --c-bg-horizon: #1a2639;
    --c-cliff-face: #050811;
    --c-cliff-light: #1e293b;
    --c-accent: #FF3B30; 
    --c-accent-glow: rgba(255, 59, 48, 0.6);
    --c-ui-text: #F8FAFC;
    --c-ui-dim: #64748B;
    
    /* Typography */
    --font-sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-mono: "Courier New", Courier, monospace;
  }

  * { box-sizing: border-box; }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--c-bg-top);
    font-family: var(--font-sans);
    overflow: hidden;
    color: var(--c-ui-text);
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* --- The Scene (SVG Layer) --- */
  #scene-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    shape-rendering: geometricPrecision; 
    will-change: transform;
  }

  /* --- The UI (Overlay Layer) --- */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none; 
    padding: 2rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Top Bar */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .brand h1 {
    margin: 0;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    line-height: 1;
    color: var(--c-ui-dim);
  }
  .brand span {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--c-accent);
    margin-top: 0.25rem;
    letter-spacing: 0.05em;
  }

  /* Integrated HUD - No Box, Just Data */
  .hud-panel {
    text-align: right;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    line-height: 1.4;
    color: var(--c-ui-dim);
    mix-blend-mode: screen;
  }
  .hud-panel .val { 
    color: #fff; 
    font-weight: 700; 
    margin-left: 0.5rem;
  }
  .hud-panel .alert { 
    color: var(--c-accent); 
  }

  /* Bottom Bar */
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-bottom: 2rem;
  }

  /* Editorial Text */
  .editorial-content {
    max-width: 400px;
  }
  .headline {
    font-size: 4.5rem;
    line-height: 0.85;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.03em;
    margin: 0 0 0.5rem 0;
    color: #fff;
    /* Subtle gradient text for polish */
    background: linear-gradient(to bottom, #fff 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .copy {
    font-size: 0.95rem;
    line-height: 1.5;
    color: var(--c-ui-dim);
    max-width: 300px;
    border-left: 2px solid var(--c-accent);
    padding-left: 1rem;
    background: linear-gradient(to right, rgba(0,0,0,0.6), transparent);
    padding-right: 1rem;
  }

  /* Animations */
  @keyframes float-parachute {
    0% { transform: translate(0px, 0px) rotate(0deg); }
    33% { transform: translate(10px, -20px) rotate(2deg); }
    66% { transform: translate(-8px, -10px) rotate(-1.5deg); }
    100% { transform: translate(0px, 0px) rotate(0deg); }
  }

  @keyframes wind-flow {
    0% { stroke-dashoffset: 2000; }
    100% { stroke-dashoffset: -1000; }
  }

  .parachute-system {
    transform-origin: 600px 400px;
    animation: float-parachute 6s ease-in-out infinite;
  }

  .wind-streak {
    fill: none;
    stroke: rgba(255, 255, 255, 0.05);
    stroke-width: 1;
    stroke-linecap: round;
    stroke-dasharray: 100 1900;
    animation: wind-flow 20s linear infinite;
  }
  
  /* Faster wind for depth */
  .wind-streak.fast {
    stroke: rgba(255, 255, 255, 0.12);
    stroke-width: 1.5;
    stroke-dasharray: 50 2000;
    animation: wind-flow 8s linear infinite;
  }

</style>
</head>
<body>

<div id="stage">

  <!-- UI Overlay -->
  <div class="ui-layer">
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <h1>Verticality</h1>
        <span>Fig 01. // The Descent</span>
      </div>
      
      <!-- Integrated HUD (Top Right) -->
      <div class="hud-panel">
        <div>ALT <span class="val">3,450m</span></div>
        <div>VEL <span class="val">5.2 m/s</span></div>
        <div>WND <span class="val">NW 18kt</span></div>
        <div>STS <span class="val alert">CRITICAL</span></div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="editorial-content">
        <h2 class="headline">The<br>Edge</h2>
        <p class="copy">
          Geological permanence vs. atmospheric fragility. 
          The descent is controlled, but the margin for error is zero.
        </p>
      </div>
    </div>
  </div>

  <!-- The Scene: High Fidelity SVG -->
  <svg id="scene-svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- 1. Sky Gradient (Darker, more dramatic) -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#02040a" />
        <stop offset="40%" stop-color="#0f172a" />
        <stop offset="100%" stop-color="#1e293b" />
      </linearGradient>

      <!-- 2. Canopy Gradient (Volumetric Red with deep shadow) -->
      <radialGradient id="canopyGrad" cx="50%" cy="50%" r="50%" fx="35%" fy="30%">
        <stop offset="0%" stop-color="#FF8A80" />
        <stop offset="20%" stop-color="#FF3B30" />
        <stop offset="60%" stop-color="#B91C1C" />
        <stop offset="90%" stop-color="#7f1d1d" />
        <stop offset="100%" stop-color="#450a0a" />
      </radialGradient>

      <!-- 3. Cliff Gradient (Lateral lighting) -->
      <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#1e293b" />
        <stop offset="15%" stop-color="#0f172a" />
        <stop offset="100%" stop-color="#020617" />
      </linearGradient>
      
      <!-- 4. Strata Gradient (Horizontal rock layers) -->
      <linearGradient id="strataGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.05)" />
        <stop offset="100%" stop-color="rgba(0,0,0,0.4)" />
      </linearGradient>

      <!-- 5. Filter for atmospheric haze -->
      <filter id="blurHaze" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="12" />
      </filter>
      
      <!-- 6. Glow for the parachute -->
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="20" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>

    <!-- 1. Background -->
    <rect width="1200" height="800" fill="url(#skyGrad)" />

    <!-- 2. Distant Mountains (Atmospheric Depth) -->
    <g id="mountains" fill="#141e2d" opacity="0.6">
      <!-- Far Left Range -->
      <path d="M-200,600 L150,400 L350,550 L600,350 L800,600 Z" />
      <!-- Far Right Range -->
      <path d="M800,600 L1050,450 L1300,600 L1500,800 Z" />
    </g>

    <!-- 3. The Cliff (Foreground Right - Massive, Layered, Jagged) -->
    <g id="cliff" transform="translate(0,0)">
      <!-- Base Silhouette -->
      <path d="M850,0 
               L1200,0 
               L1200,800 
               L850,800 
               L880,680 
               L810,580 
               L890,480 
               L820,380 
               L900,280 
               L840,180 
               L880,80 
               Z" 
            fill="url(#cliffGrad)" />
      
      <!-- Rim Light (Separation from sky) -->
      <path d="M850,0 L880,80 L840,180 L900,280 L820,380 L890,480 L810,580 L880,680 L850,800" 
            fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />

      <!-- Geological Strata (Horizontal Layers) -->
      <g stroke="url(#strataGrad)" stroke-width="1" fill="none">
        <path d="M880,80 L1200,80" stroke-width="3" />
        <path d="M840,180 L1200,180" />
        <path d="M900,280 L1200,280" stroke-width="3" />
        <path d="M820,380 L1200,380" />
        <path d="M890,480 L1200,480" stroke-width="3" />
        <path d="M810,580 L1200,580" />
        <path d="M880,680 L1200,680" stroke-width="3" />
      </g>
      
      <!-- Surface Texture (Noise/Cracks) -->
      <g stroke="#000" stroke-width="1.5" fill="none" opacity="0.5">
        <path d="M910,100 L930,120 L900,140" />
        <path d="M860,300 L880,320 L850,340" />
        <path d="M910,500 L930,520" />
        <path d="M870,600 L890,610 L880,630" />
      </g>
    </g>

    <!-- 4. Wind & Motion Cues (Dynamic Lines) -->
    <g id="wind-layer">
      <!-- Ambient Wind -->
      <path class="wind-streak" d="M-200,100 Q400,50 1400,150" />
      <path class="wind-streak" d="M-200,300 Q600,250 1400,350" />
      <path class="wind-streak" d="M-200,500 Q500,450 1400,550" />
      <path class="wind-streak" d="M-200,700 Q800,650 1400,750" />
      
      <!-- Fast Gusts (Foreground Action) -->
      <path class="wind-streak fast" d="M-200,200 Q300,150 1400,250" />
      <path class="wind-streak fast" d="M-200,400 Q800,350 1400,450" />
      <path class="wind-streak fast" d="M-200,600 Q700,550 1400,650" />
    </g>

    <!-- 5. The Subject (Parachute & Human) -->
    <!-- Centered horizontally, balanced vertically -->
    <g id="parachute-system" class="parachute-system" transform="translate(550, 300)">
      
      <!-- Harness Lines (Taut, converging) -->
      <g stroke="#ffffff" stroke-width="1.2" opacity="0.7">
        <!-- Left Bundle -->
        <line x1="-150" y1="80" x2="-20" y2="320" />
        <line x1="-145" y1="82" x2="-20" y2="320" />
        <line x1="-155" y1="78" x2="-20" y2="320" />
        <!-- Center Bundle -->
        <line x1="-40" y1="100" x2="-15" y2="320" />
        <line x1="-35" y1="102" x2="-15" y2="320" />
        <line x1="40" y1="100" x2="15" y2="320" />
        <line x1="35" y1="102" x2="15" y2="320" />
        <!-- Right Bundle -->
        <line x1="150" y1="80" x2="20" y2="320" />
        <line x1="145" y1="82" x2="20" y2="320" />
        <line x1="155" y1="78" x2="20" y2="320" />
      </g>

      <!-- The Human Figure (Detailed Silhouette) -->
      <g transform="translate(0, 320)">
        <!-- Suit Body -->
        <path d="M-15,0 C-25,40 -15,70 0,80 L0,130 L25,130 L25,80 C35,70 25,40 15,0 Z" fill="#020617" />
        
        <!-- Helmet -->
        <circle cx="12" cy="-15" r="14" fill="#020617" />
        <!-- Visor Reflection -->
        <path d="M8,-18 Q14,-20 18,-14" stroke="#94a3b8" stroke-width="2.5" fill="none" />
        
        <!-- Arms (Active posture - holding toggles) -->
        <path d="M-12,25 Q-50,55 -50,50" stroke="#020617" stroke-width="9" fill="none" stroke-linecap="round" />
        <path d="M28,25 Q60,55 60,50" stroke="#020617" stroke-width="9" fill="none" stroke-linecap="round" />
        
        <!-- Legs (Dangling, slightly apart) -->
        <path d="M0,130 L-15,175 L-35,175" stroke="#020617" stroke-width="10" fill="none" stroke-linecap="round" />
        <path d="M25,130 L40,175 L20,175" stroke="#020617" stroke-width="10" fill="none" stroke-linecap="round" />
      </g>

      <!-- The Canopy (Fully Inflated, Volumetric) -->
      <!-- Main Bell Shape -->
      <path d="M-260,20 Q-130,150 0,150 Q130,150 260,20 Q130,-60 0,-60 Q-130,-60 -260,20 Z" fill="url(#canopyGrad)" filter="url(#glow)" />
      
      <!-- Canopy Ribs (Adding volume/structure) -->
      <g stroke="#450a0a" stroke-width="2" opacity="0.5" fill="none">
        <path d="M0,-60 L0,150" />
        <path d="M-90,-35 L-45,150" />
        <path d="M90,-35 L45,150" />
        <path d="M-180,-10 L-90,150" />
        <path d="M180,-10 L90,150" />
      </g>
      
      <!-- Top Highlight (Light source interaction) -->
      <path d="M-120,-50 Q0,-65 120,-50 Q0,-45 -120,-50 Z" fill="rgba(255,255,255,0.2)" />
    </g>

    <!-- 6. Foreground Mist (Depth) -->
    <rect x="0" y="550" width="1200" height="250" fill="url(#mistGrad)" opacity="0.5" filter="url(#blurHaze)" />

  </svg>
</div>

<script>
  const scene = document.getElementById('scene-svg');
  const mountains = document.getElementById('mountains');
  const cliff = document.getElementById('cliff');
  const parachute = document.getElementById('parachute-system');
  const windLayer = document.getElementById('wind-layer');

  // 1. Parallax Effect on Mouse Move
  // Creates the feeling of 3D depth between background, subject, and foreground
  document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 2; // -1 to 1
    const y = (e.clientY / window.innerHeight - 0.5) * 2;

    // Background moves slightly
    mountains.style.transform = `translate(${x * 15}px, ${y * 8}px)`;
    
    // Subject moves moderately (Note: This overrides the CSS animation transform, so we use a wrapper or just simple translate)
    // To keep the animation smooth, we apply parallax to the wrapper if we had one, but here we just shift the base.
    // Since CSS animation uses 'transform', setting style.transform here will override it.
    // Better approach: Wrap the parachute in a group for animation, and move this group for parallax.
    // For this single-file constraint, we will rely on the visual impact of the static composition primarily, 
    // but let's try to combine them using CSS variables or just simple offsets.
    
    // Let's just apply parallax to the background elements to preserve the CSS animation on the subject.
    // If we move the subject, we break the loop.
    // Instead, let's shift the background layers.
    
    // Cliff (Foreground) moves the most
    cliff.style.transform = `translate(${x * 40}px, ${y * 20}px)`;
  });

  // 2. Interactive "Wind Gust" on Click
  document.addEventListener('click', () => {
    const gustStrength = 25;
    const gustDuration = 800; // ms
    
    // Animate parachute violently by temporarily overriding animation
    const originalTransform = parachute.style.transform;
    
    // We can't easily mix CSS animation and JS transform without complex logic.
    // Instead, let's flash the wind lines to simulate the gust visually.
    windLayer.style.transition = 'opacity 0.1s';
    windLayer.style.opacity = '1';
    
    // Simulate the gust impact on the visual
    setTimeout(() => {
      windLayer.style.transition = 'opacity 1s ease-out';
      windLayer.style.opacity = '';
    }, 100);
  });

</script>
</body>
</html>
