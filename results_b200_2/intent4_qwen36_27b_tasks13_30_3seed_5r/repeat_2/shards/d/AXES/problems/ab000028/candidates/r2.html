<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verticality // The Descent</title>
<style>
  :root {
    --c-sky-top: #0b1016;
    --c-sky-mid: #1e2a3a;
    --c-sky-bot: #5e7a94;
    --c-cliff-base: #121518;
    --c-cliff-light: #2a3038;
    --c-accent: #FF3B30;
    --c-text-main: #F0F4F8;
    --c-text-muted: #94A3B8;
    --font-display: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-mono: "Courier New", Courier, monospace;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--c-sky-top);
    font-family: var(--font-display);
    color: var(--c-text-main);
  }

  /* Layout Container */
  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* The SVG Scene */
  #scene {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    will-change: transform;
  }

  /* UI Overlay Layer - Editorial Grid */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
    display: grid;
    grid-template-columns: 60px 1fr 60px;
    grid-template-rows: 60px 1fr 80px;
    padding: 30px;
    box-sizing: border-box;
  }

  /* Typography */
  .header-group {
    grid-column: 1 / span 3;
    grid-row: 1;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .brand h1 {
    font-family: var(--font-display);
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 0;
    font-weight: 700;
    color: var(--c-text-main);
  }

  .brand span {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--c-accent);
    margin-bottom: 4px;
  }

  /* Data Readout (Top Right) */
  .data-panel {
    text-align: right;
    font-family: var(--font-mono);
    font-size: 10px;
    line-height: 1.5;
    color: var(--c-text-muted);
    border-right: 1px solid rgba(255,255,255,0.2);
    padding-right: 10px;
    text-transform: uppercase;
  }

  .data-row {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  
  .data-val {
    color: var(--c-text-main);
    font-weight: bold;
  }

  /* Main Headline (Bottom Left) - Reduced Scale */
  .editorial {
    grid-column: 1 / span 2;
    grid-row: 3;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start;
    pointer-events: auto;
  }

  .editorial h2 {
    font-family: var(--font-display);
    font-size: clamp(32px, 5vw, 64px);
    line-height: 0.9;
    font-weight: 800;
    color: var(--c-text-main);
    margin: 0;
    text-transform: uppercase;
    letter-spacing: -1px;
    /* Subtle drop shadow for readability */
    text-shadow: 0 4px 12px rgba(0,0,0,0.5);
  }

  .editorial p {
    margin-top: 10px;
    font-family: var(--font-display); /* Unified font */
    font-size: 13px;
    max-width: 300px;
    line-height: 1.5;
    color: var(--c-text-muted);
    border-left: 2px solid var(--c-accent);
    padding-left: 12px;
    font-weight: 400;
  }

  /* Controls (Bottom Right) */
  .controls {
    grid-column: 3;
    grid-row: 3;
    display: flex;
    justify-content: flex-end;
    align-items: flex-end;
    pointer-events: auto;
    gap: 12px;
  }

  .btn {
    background: rgba(11, 16, 22, 0.6);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--c-text-main);
    width: 40px;
    height: 40px;
    border-radius: 4px; /* More editorial/square */
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn:hover {
    border-color: var(--c-accent);
    color: var(--c-accent);
    background: rgba(255, 59, 48, 0.1);
  }

  /* Animations */
  @keyframes float {
    0% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-15px) rotate(0.5deg); }
    100% { transform: translateY(0px) rotate(0deg); }
  }

  @keyframes wind-stream {
    0% { stroke-dashoffset: 1000; }
    100% { stroke-dashoffset: 0; }
  }

  .parachute-group {
    transform-origin: center 60%;
    animation: float 5s ease-in-out infinite;
  }

  .wind-line {
    stroke: rgba(255, 255, 255, 0.1);
    stroke-linecap: round;
    fill: none;
    stroke-dasharray: 100 400;
    animation: wind-stream 8s linear infinite;
  }

  .wind-line.fast {
    stroke-dasharray: 50 200;
    animation-duration: 4s;
  }

  /* SVG Filters */
  .blur-bg { filter: blur(8px); }
  .blur-far { filter: blur(2px); opacity: 0.5; }

</style>
</head>
<body>

<div id="viewport">
  
  <!-- UI Overlay -->
  <div class="ui-layer">
    <div class="header-group">
      <div class="brand">
        <span>EXPEDITION 09</span>
        <h1>Verticality</h1>
      </div>
      
      <div class="data-panel">
        <div class="data-row">ALT <span class="data-val">3,850m</span></div>
        <div class="data-row">SPD <span class="data-val">5.4m/s</span></div>
        <div class="data-row">WIND <span class="data-val">NW 18kt</span></div>
        <div class="data-row">SYS <span class="data-val" style="color:var(--c-accent)">NOMINAL</span></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="windToggle" title="Toggle Wind Intensity">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
        </svg>
      </button>
      <button class="btn" id="zoomToggle" title="Toggle View">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
          <line x1="11" y1="8" x2="11" y2="14"></line>
        </svg>
      </button>
    </div>

    <div class="editorial">
      <h2>The<br>Edge</h2>
      <p>Atmospheric descent meets geological permanence. The scale of the drop is infinite; the margin for error is zero.</p>
    </div>
  </div>

  <!-- The Scene -->
  <svg id="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Sky Gradient (Deep Atmospheric) -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#0b1016;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#1e2a3a;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#5e7a94;stop-opacity:1" />
      </linearGradient>

      <!-- Canopy Gradient (Volumetric 3D) -->
      <radialGradient id="canopyGrad" cx="50%" cy="40%" r="60%">
        <stop offset="0%" style="stop-color:#FF7066;stop-opacity:1" />
        <stop offset="40%" style="stop-color:#FF3B30;stop-opacity:1" />
        <stop offset="80%" style="stop-color:#C51F15;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#800000;stop-opacity:1" />
      </radialGradient>

      <!-- Cliff Gradient (Lit from left) -->
      <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#2c353e;stop-opacity:1" />
        <stop offset="40%" style="stop-color:#1a1f24;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#050607;stop-opacity:1" />
      </linearGradient>
    </defs>

    <!-- Background Sky -->
    <rect width="1200" height="800" fill="url(#skyGrad)" />

    <!-- Distant Mountains (Depth) -->
    <g class="blur-far" fill="#3a4b5e">
      <!-- Far left mass -->
      <path d="M-100,600 L100,450 L300,550 L500,400 L700,500 L1300,200 L1300,800 L-100,800 Z" opacity="0.3" />
    </g>

    <!-- Wind Lines (Atmosphere) -->
    <g id="wind-container" opacity="0.4">
      <path class="wind-line" d="M-100,100 Q600,50 1300,150" />
      <path class="wind-line fast" d="M-100,300 Q500,250 1300,350" />
      <path class="wind-line" d="M-100,500 Q600,450 1300,550" />
      <path class="wind-line fast" d="M-100,700 Q500,650 1300,750" />
    </g>

    <!-- Main Cliff Face (Foreground Right - Massive & Textured) -->
    <g id="cliff">
      <!-- Base Silhouette -->
      <path d="M900,0 L1200,0 L1200,800 L1000,800 L950,720 L1050,600 L900,500 L980,350 L850,200 L950,100 Z" fill="url(#cliffGrad)" />
      
      <!-- Strata / Layers (Geological Texture) -->
      <g stroke="#000" stroke-width="2" opacity="0.3">
        <!-- Layer 1 -->
        <path d="M950,100 L980,100 L960,200 L900,200 Z" fill="#15191d" />
        <!-- Layer 2 -->
        <path d="M850,200 L980,350 L920,350 L880,250 Z" fill="#15191d" />
        <!-- Layer 3 -->
        <path d="M900,500 L1050,600 L980,600 L950,550 Z" fill="#15191d" />
        <!-- Layer 4 -->
        <path d="M950,720 L1000,800 L900,800 Z" fill="#15191d" />
      </g>

      <!-- Jagged Detail Lines (Sharp Rock) -->
      <g stroke="#000" stroke-width="1.5" opacity="0.6">
        <path d="M920,150 L960,160" />
        <path d="M880,250 L930,260" />
        <path d="M920,400 L970,410" />
        <path d="M980,650 L1020,660" />
        <path d="M970,750 L1000,760" />
      </g>
    </g>

    <!-- Parachute Subject Group (Center-Left to show distance from cliff) -->
    <g id="subject" class="parachute-group" transform="translate(500, 300)">
      
      <!-- Suspension Lines (Taut, Connecting to Canopy) -->
      <g stroke="#FFF" stroke-opacity="0.6">
        <!-- Left Cluster -->
        <line x1="-160" y1="60" x2="-15" y2="200" stroke-width="1" />
        <line x1="-100" y1="90" x2="-15" y2="200" stroke-width="1.5" />
        <line x1="-40" y1="100" x2="-15" y2="200" stroke-width="1" />
        <!-- Right Cluster -->
        <line x1="40" y1="100" x2="15" y2="200" stroke-width="1" />
        <line x1="100" y1="90" x2="15" y2="200" stroke-width="1.5" />
        <line x1="160" y1="60" x2="15" y2="200" stroke-width="1" />
      </g>

      <!-- The Human Figure (Detailed Silhouette) -->
      <g transform="translate(0, 200)">
        <!-- Main Body -->
        <path d="M-10,0 C-15,25 -10,50 0,65 L0,100 L20,100 L20,65 C30,50 15,25 10,0 Z" fill="#0a0a0a" />
        <!-- Head -->
        <circle cx="10" cy="-10" r="9" fill="#0a0a0a" />
        <!-- Helmet Highlight -->
        <circle cx="8" cy="-12" r="3" fill="#444" />
        <!-- Arms (Tension/Pulling) -->
        <path d="M-8,15 Q-30,40 -35,30" stroke="#0a0a0a" stroke-width="6" fill="none" stroke-linecap="round" />
        <path d="M22,15 Q44,40 49,30" stroke="#0a0a0a" stroke-width="6" fill="none" stroke-linecap="round" />
        <!-- Legs -->
        <path d="M0,100 L-10,140 L-25,140" stroke="#0a0a0a" stroke-width="7" fill="none" stroke-linecap="round" />
        <path d="M20,100 L30,140 L20,140" stroke="#0a0a0a" stroke-width="7" fill="none" stroke-linecap="round" />
      </g>

      <!-- The Canopy (Large, Inflated, Volumetric) -->
      <path d="M-200,20 Q-100,110 0,110 Q100,110 200,20 Q100,-30 0,-30 Q-100,-30 -200,20 Z" fill="url(#canopyGrad)" />
      
      <!-- Canopy Ribs (Editorial Detail) -->
      <g stroke="#800000" stroke-width="2" opacity="0.5" fill="none">
        <path d="M0,-30 L0,110" />
        <path d="M-70,-15 L-35,110" />
        <path d="M70,-15 L35,110" />
        <path d="M-140,5 L-70,110" />
        <path d="M140,5 L70,110" />
      </g>
    </g>

    <!-- Foreground Elements (Depth/Obstruction) -->
    <path class="blur-bg" d="M-50,850 L150,650 L250,850 Z" fill="#0f1215" opacity="0.9" />
    <path class="blur-bg" d="M1050,850 L1200,750 L1350,850 Z" fill="#0f1215" opacity="0.9" />

  </svg>
</div>

<script>
  const scene = document.getElementById('scene');
  const windContainer = document.getElementById('wind-container');
  const subject = document.getElementById('subject');
  const windToggle = document.getElementById('windToggle');
  const zoomToggle = document.getElementById('zoomToggle');

  let isZoomed = false;
  let windState = 1; // 1 = normal, 2 = high

  // Toggle Wind
  windToggle.addEventListener('click', () => {
    if (windState === 1) {
      // High Wind
      windContainer.style.opacity = "0.8";
      document.querySelectorAll('.wind-line').forEach(line => {
        line.style.animationDuration = '2s'; // Faster
      });
      subject.style.animation = 'float 2.5s ease-in-out infinite'; // More frantic
      windToggle.style.borderColor = 'var(--c-accent)';
      windToggle.style.color = 'var(--c-accent)';
      windState = 2;
    } else {
      // Normal Wind
      windContainer.style.opacity = "0.4";
      document.querySelectorAll('.wind-line').forEach(line => {
        line.style.animationDuration = '8s'; // Slower
      });
      subject.style.animation = 'float 5s ease-in-out infinite'; // Calm
      windToggle.style.borderColor = 'rgba(255,255,255,0.15)';
      windToggle.style.color = 'var(--c-text-main)';
      windState = 1;
    }
  });

  // Toggle Zoom
  zoomToggle.addEventListener('click', () => {
    isZoomed = !isZoomed;
    const scale = isZoomed ? "scale(1.1)" : "scale(1)";
    const translate = isZoomed ? "translate(40px, -10px)" : "translate(0,0)";
    
    scene.style.transition = "transform 0.8s cubic-bezier(0.16, 1, 0.3, 1)";
    scene.style.transform = `${scale} ${translate}`;
    
    // Visual feedback on button
    zoomToggle.style.transform = isZoomed ? "scale(0.9)" : "scale(1)";
  });

  // Subtle Parallax on Mouse Move
  document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 2; // -1 to 1
    const y = (e.clientY / window.innerHeight - 0.5) * 2;

    // Parallax for background (Cliff)
    const cliff = document.getElementById('cliff');
    cliff.style.transform = `translate(${x * 15}px, ${y * 15}px)`;
  });

</script>
</body>
</html>
