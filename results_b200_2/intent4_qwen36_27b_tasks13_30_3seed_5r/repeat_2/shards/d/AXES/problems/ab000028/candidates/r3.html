<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verticality // The Descent</title>
<style>
  :root {
    --c-sky-top: #05080a;
    --c-sky-mid: #14202e;
    --c-sky-horizon: #3b4d61;
    --c-cliff-dark: #08090a;
    --c-cliff-light: #232830;
    --c-accent: #FF453A;
    --c-text-main: #ffffff;
    --c-text-muted: #8fa4b8;
    --font-display: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-mono: "Courier New", Courier, monospace;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--c-sky-top);
    font-family: var(--font-display);
    color: var(--c-text-main);
  }

  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* The Scene Layer */
  #scene {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    /* Ensure sharp edges for the vector art */
    shape-rendering: geometricPrecision; 
  }

  /* UI Overlay Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
    padding: 40px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Top Bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    width: 100%;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .brand h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--c-text-main);
    opacity: 0.9;
  }
  .brand span {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--c-accent);
    font-weight: 600;
    letter-spacing: 1px;
  }

  /* Data Readout - High Contrast, Monospace */
  .data-panel {
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.4;
    color: var(--c-text-main);
    background: rgba(0, 0, 0, 0.4);
    padding: 8px 12px;
    border-left: 2px solid var(--c-accent);
    backdrop-filter: blur(4px);
    text-transform: uppercase;
    min-width: 140px;
  }
  .data-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
  }
  .data-label { color: var(--c-text-muted); }
  .data-val { font-weight: 700; }

  /* Bottom Bar */
  .bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    width: 100%;
  }

  /* Editorial Headline - Subordinated */
  .editorial {
    max-width: 280px;
    pointer-events: auto;
  }
  .editorial h2 {
    margin: 0;
    font-size: 28px;
    line-height: 0.95;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: -0.5px;
    color: var(--c-text-main);
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }
  .editorial p {
    margin-top: 12px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--c-text-muted);
    font-weight: 400;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 10px;
    pointer-events: auto;
  }
  .btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: var(--c-text-main);
    width: 36px;
    height: 36px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }
  .btn:hover {
    background: rgba(255, 255, 255, 0.15);
    border-color: var(--c-text-main);
  }
  .btn.active {
    background: var(--c-accent);
    border-color: var(--c-accent);
  }

  /* Animations */
  @keyframes float {
    0% { transform: translate(0px, 0px) rotate(0deg); }
    33% { transform: translate(5px, -10px) rotate(1deg); }
    66% { transform: translate(-5px, -5px) rotate(-1deg); }
    100% { transform: translate(0px, 0px) rotate(0deg); }
  }

  @keyframes wind-stream {
    0% { stroke-dashoffset: 1000; }
    100% { stroke-dashoffset: 0; }
  }

  .parachute-group {
    /* Center pivot for bobbing */
    transform-origin: 600px 300px;
    animation: float 6s ease-in-out infinite;
  }

  .wind-line {
    stroke: rgba(255, 255, 255, 0.05);
    stroke-linecap: round;
    fill: none;
    stroke-dasharray: 150 850;
    animation: wind-stream 12s linear infinite;
  }
  
  .wind-line.gust {
    stroke: rgba(255, 255, 255, 0.1);
    stroke-dasharray: 80 920;
    animation: wind-stream 7s linear infinite;
  }

</style>
</head>
<body>

<div id="viewport">
  
  <!-- UI Overlay -->
  <div class="ui-layer">
    <div class="top-bar">
      <div class="brand">
        <span>EXPEDITION 09</span>
        <h1>Verticality</h1>
      </div>
      
      <div class="data-panel">
        <div class="data-row"><span class="data-label">ALT</span> <span class="data-val">3,850m</span></div>
        <div class="data-row"><span class="data-label">SPD</span> <span class="data-val">5.4m/s</span></div>
        <div class="data-row"><span class="data-label">WIND</span> <span class="data-val">NW 18kt</span></div>
        <div class="data-row"><span class="data-label">SYS</span> <span class="data-val" style="color:var(--c-accent)">NOMINAL</span></div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="editorial">
        <h2>The<br>Edge</h2>
        <p>Atmospheric descent meets geological permanence. The scale of the drop is infinite; the margin for error is zero.</p>
      </div>

      <div class="controls">
        <button class="btn" id="windToggle" title="Toggle Wind Intensity">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
          </svg>
        </button>
        <button class="btn" id="zoomToggle" title="Zoom View">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="11" y1="8" x2="11" y2="14"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- The Scene -->
  <svg id="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Sky Gradient: Deep Atmospheric Depth -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#05080a;stop-opacity:1" />
        <stop offset="60%" style="stop-color:#14202e;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#3b4d61;stop-opacity:1" />
      </linearGradient>

      <!-- Canopy Gradient: Volumetric Red -->
      <radialGradient id="canopyGrad" cx="30%" cy="30%" r="70%">
        <stop offset="0%" style="stop-color:#FF8A80;stop-opacity:1" />
        <stop offset="30%" style="stop-color:#FF3B30;stop-opacity:1" />
        <stop offset="75%" style="stop-color:#B00020;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#580000;stop-opacity:1" />
      </radialGradient>

      <!-- Cliff Gradient: High Contrast Edge -->
      <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#2a3542;stop-opacity:1" />
        <stop offset="10%" style="stop-color:#15191e;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#030405;stop-opacity:1" />
      </linearGradient>
      
      <!-- Distant Mist -->
      <linearGradient id="mistGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#3b4d61;stop-opacity:0" />
        <stop offset="100%" style="stop-color:#3b4d61;stop-opacity:0.8" />
      </linearGradient>
    </defs>

    <!-- 1. Background Sky -->
    <rect width="1200" height="800" fill="url(#skyGrad)" />

    <!-- 2. Distant Mountains (Scale & Depth) -->
    <g id="distant-mountains" fill="#243242" opacity="0.6">
      <!-- Left Mass -->
      <path d="M-100,650 L150,450 L400,600 L600,480 L800,650 L1200,650 Z" />
      <!-- Right Mass (Closer, Darker) -->
      <path d="M800,800 L950,550 L1100,650 L1300,500 L1300,800 Z" fill="#1a2533" opacity="0.8"/>
    </g>
    
    <!-- Atmospheric Mist Layer -->
    <rect x="0" y="500" width="1200" height="300" fill="url(#mistGrad)" opacity="0.5" />

    <!-- 3. Wind Lines (Motion Cues) -->
    <g id="wind-container" opacity="0.6">
      <!-- Slow background wind -->
      <path class="wind-line" d="M-100,150 Q600,100 1300,200" />
      <path class="wind-line" d="M-100,400 Q500,350 1300,450" />
      <path class="wind-line" d="M-100,650 Q600,600 1300,700" />
      
      <!-- Fast foreground gusts -->
      <path class="wind-line gust" d="M-100,250 Q400,200 1300,300" />
      <path class="wind-line gust" d="M-100,550 Q700,500 1300,600" />
    </g>

    <!-- 4. Main Cliff Face (Foreground Right - Geological Layers) -->
    <!-- Repositioned to dominate the right side, creating a wall of danger -->
    <g id="cliff" transform="translate(0, 0)">
      <!-- Base Silhouette (Massive) -->
      <path d="M850,0 L1200,0 L1200,800 L900,800 L880,700 L950,600 L850,500 L920,400 L800,300 L880,200 L850,100 Z" fill="url(#cliffGrad)" />
      
      <!-- Strata / Layers (Geological Texture - Angled Planes) -->
      <g stroke="#000" stroke-width="3" stroke-opacity="0.5">
        <!-- Layer 1 (Top) -->
        <path d="M850,100 L880,200 L1200,200 L1200,100 Z" fill="#1a1f24" />
        <!-- Layer 2 -->
        <path d="M800,300 L920,400 L1200,380 L1200,300 Z" fill="#111418" />
        <!-- Layer 3 -->
        <path d="M850,500 L950,600 L1200,550 L1200,500 Z" fill="#15191d" />
        <!-- Layer 4 (Bottom) -->
        <path d="M880,700 L900,800 L1200,750 L1200,700 Z" fill="#0f1215" />
      </g>

      <!-- Jagged Detail Lines (Sharp Rock) -->
      <g stroke="#000" stroke-width="1.5" stroke-opacity="0.8">
        <path d="M860,150 L870,160" />
        <path d="M820,320 L840,330" />
        <path d="M860,520 L880,530" />
        <path d="M890,720 L910,730" />
      </g>
      
      <!-- Highlight Edge (Separation from Sky) -->
      <path d="M850,0 L850,100 L880,200 L800,300 L920,400 L850,500 L950,600 L880,700 L900,800" 
            fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
    </g>

    <!-- 5. Parachute Subject Group (Center-Left, Suspended) -->
    <!-- Moved closer to center to balance composition, but clearly separated from cliff -->
    <g id="subject" class="parachute-group" transform="translate(550, 280)">
      
      <!-- Suspension Lines (Taut, High Contrast) -->
      <g stroke="#FFFFFF" stroke-opacity="0.8">
        <!-- Left Cluster -->
        <line x1="-180" y1="50" x2="-20" y2="220" stroke-width="1.5" />
        <line x1="-100" y1="100" x2="-20" y2="220" stroke-width="1.5" />
        <line x1="-30" y1="110" x2="-20" y2="220" stroke-width="1" />
        <!-- Right Cluster -->
        <line x1="30" y1="110" x2="20" y2="220" stroke-width="1" />
        <line x1="100" y1="100" x2="20" y2="220" stroke-width="1.5" />
        <line x1="180" y1="50" x2="20" y2="220" stroke-width="1.5" />
      </g>

      <!-- The Human Figure (Dynamic Suspended Posture) -->
      <g transform="translate(0, 220)">
        <!-- Body (Sitting/Hanging) -->
        <path d="M-12,0 C-18,30 -12,60 0,70 L0,110 L22,110 L22,70 C32,60 18,30 12,0 Z" fill="#050505" />
        
        <!-- Head (Helmet) -->
        <circle cx="10" cy="-12" r="10" fill="#050505" />
        <circle cx="8" cy="-14" r="3" fill="#555" /> <!-- Visor Highlight -->
        
        <!-- Arms (Holding toggles/tension) -->
        <path d="M-10,20 Q-40,50 -45,40" stroke="#050505" stroke-width="7" fill="none" stroke-linecap="round" />
        <path d="M24,20 Q54,50 59,40" stroke="#050505" stroke-width="7" fill="none" stroke-linecap="round" />
        
        <!-- Legs (Dangling) -->
        <path d="M0,110 L-15,150 L-30,150" stroke="#050505" stroke-width="8" fill="none" stroke-linecap="round" />
        <path d="M22,110 L35,150 L20,150" stroke="#050505" stroke-width="8" fill="none" stroke-linecap="round" />
      </g>

      <!-- The Canopy (Large, Inflated, Volumetric) -->
      <!-- Scaled up to anchor top of frame -->
      <path d="M-220,10 Q-110,120 0,120 Q110,120 220,10 Q110,-40 0,-40 Q-110,-40 -220,10 Z" fill="url(#canopyGrad)" />
      
      <!-- Canopy Ribs (Editorial Detail) -->
      <g stroke="#800000" stroke-width="3" opacity="0.4" fill="none">
        <path d="M0,-40 L0,120" />
        <path d="M-80,-20 L-40,120" />
        <path d="M80,-20 L40,120" />
        <path d="M-160,0 L-80,120" />
        <path d="M160,0 L80,120" />
      </g>
      
      <!-- Subtle Drop Shadow for Canopy -->
      <ellipse cx="0" cy="120" rx="150" ry="20" fill="rgba(0,0,0,0.2)" filter="blur(5px)" />
    </g>

    <!-- 6. Foreground Elements (Depth/Obstruction) -->
    <!-- Adds a sense of looking past an obstacle -->
    <path class="blur-bg" d="M-50,850 L200,650 L350,850 Z" fill="#030405" opacity="0.8" />
    <path class="blur-bg" d="M1050,850 L1200,750 L1350,850 Z" fill="#030405" opacity="0.9" />

  </svg>
</div>

<script>
  const scene = document.getElementById('scene');
  const windContainer = document.getElementById('wind-container');
  const subject = document.getElementById('subject');
  const windToggle = document.getElementById('windToggle');
  const zoomToggle = document.getElementById('zoomToggle');

  let isZoomed = false;
  let windState = 1;

  // Toggle Wind Intensity
  windToggle.addEventListener('click', () => {
    if (windState === 1) {
      // High Wind
      windContainer.style.opacity = "1";
      windContainer.style.transition = "opacity 0.5s";
      document.querySelectorAll('.wind-line').forEach(line => {
        line.style.animationDuration = '2.5s'; // Faster
      });
      subject.style.animation = 'float 2.5s ease-in-out infinite'; // More frantic bobbing
      windToggle.classList.add('active');
      windState = 2;
    } else {
      // Normal Wind
      windContainer.style.opacity = "0.6";
      document.querySelectorAll('.wind-line').forEach(line => {
        line.style.animationDuration = '12s'; // Slower
      });
      subject.style.animation = 'float 6s ease-in-out infinite'; // Calm
      windToggle.classList.remove('active');
      windState = 1;
    }
  });

  // Toggle Zoom (Simulates camera zoom)
  zoomToggle.addEventListener('click', () => {
    isZoomed = !isZoomed;
    const scale = isZoomed ? "scale(1.2)" : "scale(1)";
    const translate = isZoomed ? "translate(20px, -20px)" : "translate(0,0)";
    
    scene.style.transition = "transform 0.8s cubic-bezier(0.16, 1, 0.3, 1)";
    scene.style.transform = `${scale} ${translate}`;
    
    zoomToggle.classList.toggle('active');
  });

  // Subtle Parallax on Mouse Move (Adds 3D feel)
  document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 2; // -1 to 1
    const y = (e.clientY / window.innerHeight - 0.5) * 2;

    // Move cliff slightly more than background to create depth
    const cliff = document.getElementById('cliff');
    // Parallax factor: 20px
    cliff.style.transform = `translate(${x * 20}px, ${y * 10}px)`;
    
    // Move distant mountains slightly less
    const mountains = document.getElementById('distant-mountains');
    mountains.style.transform = `translate(${x * 5}px, ${y * 2}px)`;
  });

</script>
</body>
</html>
