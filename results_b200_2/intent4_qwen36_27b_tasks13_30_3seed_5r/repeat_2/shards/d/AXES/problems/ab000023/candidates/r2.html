<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play Series | Studio Product View</title>
<style>
  :root {
    /* Palette: High Contrast, Studio Lighting */
    --bg-top: #eef2f6;
    --bg-bottom: #cdd5df;
    --sign-face: #ffffff;
    --sign-edge: #e2e6eb;
    --sign-side-shadow: #d1d6dd;
    --emblem-red: #ff1a1a;
    --emblem-shadow: #cc0000;
    --metal-light: #f3f4f6;
    --metal-dark: #9ca3af;
    --text-main: #1f2937;
    --text-sub: #6b7280;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    background: linear-gradient(to bottom, var(--bg-top) 0%, var(--bg-bottom) 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1200px; /* Deep perspective for realistic depth */
  }

  /* 
    STUDIO SCENE CONTAINER 
    Holds the spatial arrangement. 
  */
  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
  }

  /* 
    FLOOR PLANE 
    Creates the "Storefront/Studio" ground.
  */
  .floor {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 100%; /* Extend deep */
    background: linear-gradient(to bottom, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.05) 100%);
    transform-origin: top center;
    transform: rotateX(75deg) translateY(100px);
    pointer-events: none;
    z-index: 0;
  }

  /* 
    PRODUCT ASSEMBLY
    The main container for the sign and hardware.
  */
  .product-assembly {
    position: relative;
    width: 450px; /* Increased scale significantly */
    height: 450px;
    transform-style: preserve-3d;
    /* Default studio angle: slightly tilted back and to the side */
    transform: rotateX(-5deg) rotateY(15deg) translateY(20px);
    transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    z-index: 10;
  }

  /* 
    SIGN THICKNESS (The extrusion)
    We use a thick box-shadow on a base element to simulate the side profile
    of the physical sign.
  */
  .sign-body {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--sign-edge);
    border-radius: 24px;
    /* 
      The magic of the 3D sign: 
      A large offset shadow creates the "side" of the board.
      translateZ(0) keeps it in the base plane.
    */
    box-shadow: 
      12px 12px 0px var(--sign-side-shadow), /* The physical thickness profile */
      13px 13px 0px rgba(0,0,0,0.05), /* Darker edge for bevel illusion */
      0px 40px 80px rgba(0,0,0,0.25); /* The cast shadow on the floor/wall */
    transform: translateZ(0);
  }

  /* 
    SIGN FACE (The pristine white front)
    Floats above the body.
  */
  .sign-face {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--sign-face);
    border-radius: 24px;
    /* Subtle gradient to simulate studio lighting on white plastic/metal */
    background: radial-gradient(circle at 30% 30%, #ffffff 0%, #f8f9fa 100%);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05); /* Edge definition */
    transform: translateZ(12px); /* Matches the shadow offset */
    display: flex;
    justify-content: center;
    align-items: center;
    backface-visibility: hidden;
  }

  /* 
    EMBLEM CONTAINER
    The red circle.
  */
  .emblem-base {
    width: 220px; /* Dominant size */
    height: 220px;
    border-radius: 50%;
    background: var(--emblem-red);
    position: relative;
    /* Lifted off the sign face */
    transform: translateZ(20px);
    display: flex;
    justify-content: center;
    align-items: center;
    
    /* Complex shadow for the emblem to pop */
    box-shadow: 
      0 10px 20px rgba(0,0,0,0.15), /* Drop shadow */
      0 4px 0px var(--emblem-shadow), /* 3D Lip */
      inset 0 8px 20px rgba(255,255,255,0.3), /* Top Gloss/Highlight */
      inset 0 -8px 20px rgba(0,0,0,0.15); /* Bottom Inner Shadow */
  }

  /* 
    PLAY ICON (Triangle)
    Pure geometric crispness.
  */
  .play-icon {
    width: 0; 
    height: 0; 
    border-top: 45px solid transparent;
    border-bottom: 45px solid transparent;
    border-left: 75px solid #ffffff;
    margin-left: 10px; /* Optical centering correction */
    filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.15));
    transform: translateZ(5px); /* Slightly proud of the red circle */
  }

  /* 
    HARDWARE / MOUNTING
    Adds the "Physical Object" credibility.
  */
  .hardware-plate {
    position: absolute;
    top: -30px;
    left: 50%;
    width: 140px;
    height: 60px;
    background: linear-gradient(to bottom, var(--metal-light), var(--metal-dark));
    transform: translateX(-50%) rotateX(90deg) translateZ(-30px);
    transform-origin: bottom center;
    border-radius: 8px 8px 0 0;
    box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
    z-index: 5;
  }

  .hardware-screw {
    position: absolute;
    width: 12px;
    height: 12px;
    background: radial-gradient(circle at 30% 30%, #fff, #bbb);
    border-radius: 50%;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.5), 0 2px 4px rgba(0,0,0,0.2);
    top: 20px;
  }
  .hardware-screw::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 8px; height: 2px;
    background: #555;
    transform: translate(-50%, -50%) rotate(45deg);
  }
  .hardware-screw.left { left: 15px; }
  .hardware-screw.right { right: 15px; }

  /* 
    SHADOW CAST ON FLOOR
    Dynamic element that grounds the object.
  */
  .cast-shadow {
    position: absolute;
    width: 400px;
    height: 100px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 70%);
    top: 100%;
    left: 50%;
    transform: translateX(-50%) rotateX(75deg) translateY(80px);
    filter: blur(15px);
    opacity: 0.6;
    z-index: -1;
    pointer-events: none;
    transition: all 0.3s ease;
  }

  /* 
    TYPOGRAPHY
    Clean, subordinate label.
  */
  .label-container {
    position: absolute;
    bottom: 8vh;
    width: 100%;
    text-align: center;
    z-index: 20;
    pointer-events: none;
  }

  .label-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-main);
    margin-bottom: 4px;
  }

  .label-sub {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: var(--text-sub);
    text-transform: uppercase;
  }

  /* Interactive Hover States */
  .product-assembly:hover {
    /* Move slightly closer and straighten */
    transform: rotateX(0deg) rotateY(0deg) scale(1.05) translateY(0px);
  }
  
  .product-assembly:hover .cast-shadow {
    /* Shadow shrinks and intensifies as object lifts/straightens */
    transform: translateX(-50%) rotateX(75deg) translateY(40px) scale(0.8);
    opacity: 0.8;
    filter: blur(10px);
  }

</style>
</head>
<body>

  <div class="scene" id="scene">
    
    <!-- The Floor Context -->
    <div class="floor"></div>

    <!-- The Main Product -->
    <div class="product-assembly" id="product">
      
      <!-- Hardware Plate (Sits "behind/above" the sign face) -->
      <div class="hardware-plate">
        <div class="hardware-screw left"></div>
        <div class="hardware-screw right"></div>
      </div>

      <!-- The Sign Body (Thickness & Shadow) -->
      <div class="sign-body"></div>

      <!-- The Sign Face (White Front) -->
      <div class="sign-face">
        <div class="emblem-base">
          <div class="play-icon"></div>
        </div>
      </div>

      <!-- Floor Shadow -->
      <div class="cast-shadow" id="shadow"></div>

    </div>

    <!-- Typography Label -->
    <div class="label-container">
      <div class="label-title">Play Series</div>
      <div class="label-sub">Exterior Grade Signage</div>
    </div>

  </div>

  <script>
    // Subtle Parallax Interaction
    // Moves the product slightly based on mouse position to enhance 3D feel
    const scene = document.getElementById('scene');
    const product = document.getElementById('product');
    const shadow = document.getElementById('shadow');

    scene.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      // Calculate normalized mouse position (-1 to 1)
      const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
      const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);

      // Apply rotation (inverted for natural feel)
      // Limits: +/- 10 degrees
      const rotateX = -y * 10; 
      const rotateY = x * 15;

      // Only apply if not hovering (hover overrides with straight-on view)
      if (!product.matches(':hover')) {
        product.style.transform = `rotateX(${-5 + rotateX}deg) rotateY(${15 + rotateY}deg) translateY(20px)`;
        
        // Move shadow opposite to rotation
        shadow.style.transform = `translateX(calc(-50% + ${-x * 30}px)) rotateX(75deg) translateY(80px)`;
      }
    });

    scene.addEventListener('mouseleave', () => {
      product.style.transform = `rotateX(-5deg) rotateY(15deg) translateY(20px)`;
      shadow.style.transform = `translateX(-50%) rotateX(75deg) translateY(80px)`;
    });
  </script>
</body>
</html>
