<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play Series | Exterior Signage Concept</title>
<style>
  :root {
    /* Palette: Premium Studio */
    --bg-floor: #e8ebee;
    --bg-wall: #f4f6f8;
    --bg-shadow: #d1d5db;
    
    /* Sign Material */
    --sign-face: #ffffff;
    --sign-face-dim: #f8f9fa;
    --sign-edge-top: #e2e8f0;
    --sign-edge-side: #cbd5e1;
    --sign-edge-bottom: #94a3b8;
    
    /* Emblem */
    --red-primary: #ff2a2a;
    --red-shadow: #cc0000;
    --red-highlight: #ff6b6b;
    
    /* Hardware */
    --metal-light: #f1f5f9;
    --metal-mid: #cbd5e1;
    --metal-dark: #94a3b8;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    background-color: var(--bg-floor);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1400px; /* Deep, realistic perspective */
  }

  /* 
    ENVIRONMENT: Studio Context 
    Creating a physical space with a wall and floor plane.
  */
  .studio-environment {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, var(--bg-wall) 0%, var(--bg-floor) 45%, var(--bg-shadow) 100%);
    z-index: -1;
  }

  /* 
    SCENE CONTAINER
  */
  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
  }

  /* 
    PRODUCT ASSEMBLY
    Critique Fix: 0 Degrees Rotation. Stable, authoritative, upright.
  */
  .product-assembly {
    position: relative;
    width: 480px;
    height: 560px;
    transform-style: preserve-3d;
    /* Upright position, slight tilt to show thickness but remain readable */
    transform: rotateX(2deg) rotateY(-10deg);
    transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    margin-top: -40px; /* Slight visual lift */
  }

  /* 
    HARDWARE MOUNTING
    Critique Fix: Visible, physically connecting to "wall".
  */
  .mounting-hardware {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    transform-style: preserve-3d;
    z-index: 0;
  }

  /* The L-Bracket */
  .bracket {
    position: absolute;
    width: 90px;
    height: 80px;
    transform-style: preserve-3d;
  }

  .bracket-face {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, var(--metal-light), var(--metal-mid));
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 6px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }

  .bracket-arm {
    position: absolute;
    top: 0;
    right: 0; /* Attached to back */
    width: 80px;
    height: 100%;
    background: linear-gradient(to right, var(--metal-dark), var(--metal-mid));
    transform-origin: top right;
    transform: rotateY(-90deg) translateZ(-1px);
    border-radius: 0 4px 4px 0;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }

  .bracket.left {
    top: 60px;
    left: 50px;
    transform: translateZ(-20px); /* Pushed back against wall */
  }

  .bracket.right {
    top: 60px;
    right: 50px;
    transform: translateZ(-20px);
  }

  /* Screws */
  .screw {
    position: absolute;
    width: 14px;
    height: 14px;
    background: radial-gradient(circle at 35% 35%, #fff, #aaa);
    border-radius: 50%;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(255,255,255,0.8);
  }
  
  .screw::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 8px; height: 1px;
    background: #555;
    transform: translate(-50%, -50%) rotate(45deg);
    box-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }

  .bracket.left .screw { top: 15px; left: 15px; }
  .bracket.right .screw { top: 15px; right: 15px; }

  /* 
    SIGN BODY (The 3D Object)
    Critique Fix: True 3D Extrusion using CSS layers.
  */
  .sign-body {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 24px;
    transform-style: preserve-3d;
  }

  /* The "Side" Thickness - simulating material depth */
  .sign-side {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 24px;
    /* 
      This box-shadow trick creates a solid 3D extrusion 
      that rotates with the object, unlike a static shadow.
    */
    box-shadow: 
      0 0 0 20px var(--sign-edge-side), /* The thick side */
      0 0 0 22px rgba(0,0,0,0.15);      /* The bottom edge rim */
    transform: translateZ(-10px); /* Push back to be the base */
  }

  /* The "Top" Face - Pristine White */
  .sign-face {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 24px;
    background: 
      linear-gradient(135deg, #ffffff 0%, #fcfcfc 50%, #f0f2f5 100%);
    box-shadow: 
      inset 0 0 0 1px rgba(255,255,255,1), /* Sharp highlight edge */
      inset 0 0 20px rgba(0,0,0,0.02);    /* Subtle ambient occlusion */
    transform: translateZ(10px); /* Lift to match extrusion */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden; /* Ensure nothing clips */
  }
  
  /* 
    FLOOR SHADOW
    Critique Fix: Grounded cast shadow.
  */
  .floor-shadow {
    position: absolute;
    bottom: -120px; /* Distance from sign to floor */
    left: 10%;
    width: 80%;
    height: 60px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0) 70%);
    transform: rotateX(90deg) translateZ(-100px); /* Flatten on floor plane */
    filter: blur(15px);
    pointer-events: none;
    z-index: -1;
  }

  /* 
    EMBLEM (Red Play Button)
    Critique Fix: Geometrically crisp, dominant, glossy.
  */
  .emblem-container {
    position: relative;
    width: 220px;
    height: 220px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 40px; /* Spacing from text */
    transform-style: preserve-3d;
    transform: translateZ(15px); /* Raised from surface */
  }

  /* The Red Circle */
  .emblem-circle {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--red-highlight), var(--red-primary) 60%, var(--red-shadow) 100%);
    box-shadow: 
      0 20px 40px rgba(200, 0, 0, 0.3), /* Red ambient glow */
      0 10px 20px rgba(0,0,0,0.2),      /* Drop shadow */
      inset 0 4px 10px rgba(255,255,255,0.5), /* Top Gloss */
      inset 0 -5px 15px rgba(0,0,0,0.2);     /* Bottom Depth */
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* Specular Highlight (Gloss) */
  .emblem-circle::after {
    content: '';
    position: absolute;
    top: 8%;
    left: 15%;
    width: 40%;
    height: 30%;
    border-radius: 50%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.7), rgba(255,255,255,0));
    filter: blur(5px);
    transform: rotate(-45deg);
  }

  /* 
    PLAY ICON (Triangle)
    Critique Fix: Perfect geometry, optical centering.
  */
  .play-icon {
    width: 0; 
    height: 0; 
    border-top: 48px solid transparent;
    border-bottom: 48px solid transparent;
    border-left: 80px solid #ffffff;
    /* Optical Centering: Shift right slightly */
    margin-left: 10px; 
    filter: drop-shadow(3px 4px 6px rgba(0,0,0,0.25));
    transform: translateZ(5px); /* Pop out slightly */
  }

  /* 
    TYPOGRAPHY
    Critique Fix: Integrated into sign, high contrast, clear hierarchy.
  */
  .label-container {
    position: absolute;
    bottom: 50px; /* Inside the sign face */
    width: 100%;
    text-align: center;
    transform: translateZ(16px); /* Slightly raised */
  }

  .label-title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #111111; /* High contrast black */
    margin-bottom: 6px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  .label-sub {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.2em;
    color: #555555; /* Subordinate dark grey */
    text-transform: uppercase;
  }

  /* 
    INTERACTIVITY
  */
  .product-assembly:hover {
    transform: rotateX(0deg) rotateY(0deg) scale(1.02) translateZ(10px);
  }

</style>
</head>
<body>

  <!-- Studio Background -->
  <div class="studio-environment"></div>

  <div class="scene" id="scene">
    
    <!-- The Product Group -->
    <div class="product-assembly" id="product">
      
      <!-- Floor Shadow (Grounding) -->
      <div class="floor-shadow"></div>

      <!-- Mounting Hardware (Wall Mounts) -->
      <div class="mounting-hardware">
        <div class="bracket left">
          <div class="bracket-face"></div>
          <div class="bracket-arm"></div>
          <div class="screw"></div>
        </div>
        <div class="bracket right">
          <div class="bracket-face"></div>
          <div class="bracket-arm"></div>
          <div class="screw"></div>
        </div>
      </div>

      <!-- The Physical Sign Body -->
      <div class="sign-body">
        <!-- 3D Extrusion (Sides) -->
        <div class="sign-side"></div>
        
        <!-- Front Face (White Material) -->
        <div class="sign-face">
          
          <!-- The Emblem -->
          <div class="emblem-container">
            <div class="emblem-circle">
              <div class="play-icon"></div>
            </div>
          </div>

          <!-- Integrated Typography -->
          <div class="label-container">
            <div class="label-title">Play Series</div>
            <div class="label-sub">Exterior Grade Signage</div>
          </div>

        </div>
      </div>

    </div>

  </div>

  <script>
    // Subtle Parallax Interaction
    // Adds life to the scene without breaking the 3D illusion
    const scene = document.getElementById('scene');
    const product = document.getElementById('product');

    // Initial default transform
    const defaultRotateX = 2;
    const defaultRotateY = -10;

    scene.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      // Normalized mouse coordinates (-1 to 1)
      const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
      const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);

      // Only apply parallax if not hovering (hover state overrides)
      if (!product.matches(':hover')) {
        // Subtle rotation based on mouse position
        // Limits applied to keep it stable
        const rotateX = defaultRotateX + (y * -4); 
        const rotateY = defaultRotateY + (x * 5);
        
        product.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
      }
    });

    scene.addEventListener('mouseleave', () => {
      product.style.transform = `rotateX(${defaultRotateX}deg) rotateY(${defaultRotateY}deg)`;
    });
  </script>
</body>
</html>
