<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play Series | Premium Signage Concept</title>
<style>
  :root {
    /* Palette: Studio Commercial */
    --bg-color: #eef1f5;
    --text-main: #1a1a1a;
    --text-sub: #555555;
    
    /* Material Colors */
    --sign-face: #ffffff;
    --sign-edge-light: #d1d5db;
    --sign-edge-dark: #9ca3af;
    --emblem-red: #ff2a2a;
    --emblem-dark: #cc0000;
    
    /* Hardware */
    --metal-light: #f8f9fa;
    --metal-mid: #d1d5db;
    --metal-dark: #9ca3af;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    /* Studio Lighting Background */
    background: radial-gradient(circle at 50% 40%, #ffffff 0%, var(--bg-color) 50%, #dce1e8 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1200px; /* Deep perspective for realism */
  }

  /* 
    SCENE CONTAINER 
  */
  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
  }

  /* 
    FLOOR PLANE 
    Grounding element to anchor shadows.
  */
  .floor {
    position: absolute;
    width: 300%;
    height: 300%;
    background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(0,0,0,0.08) 100%);
    transform-origin: center top;
    transform: translateY(25vh) rotateX(85deg);
    pointer-events: none;
    z-index: 0;
  }

  /* 
    PRODUCT ASSEMBLY
  */
  .product-assembly {
    position: relative;
    width: 500px;
    height: 500px;
    transform-style: preserve-3d;
    /* Initial Pose: Angled */
    transform: rotateX(10deg) rotateY(-15deg);
    transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* 
    HARDWARE MOUNTING
    Industrial wall brackets to anchor the object.
  */
  .mounting-hardware {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    transform-style: preserve-3d;
  }

  .bracket {
    position: absolute;
    width: 80px;
    height: 100px;
    background: linear-gradient(135deg, var(--metal-light), var(--metal-mid));
    border-radius: 8px;
    box-shadow: 
      0 4px 10px rgba(0,0,0,0.1),
      inset 0 1px 0 rgba(255,255,255,0.8);
    /* Positioning brackets top-left and top-right */
    transform-style: preserve-3d;
  }

  .bracket::before {
    /* The L-shaped arm going back to the "wall" */
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 60px;
    height: 100%;
    background: linear-gradient(to right, var(--metal-dark), var(--metal-mid));
    transform-origin: top right;
    transform: rotateY(-90deg) translateZ(-1px); /* Thickness */
    border-radius: 0 4px 4px 0;
  }

  .bracket.left {
    top: 40px;
    left: 40px;
    transform: translateZ(-18px); /* Behind sign */
  }

  .bracket.right {
    top: 40px;
    right: 40px;
    transform: translateZ(-18px); /* Behind sign */
  }

  .screw-head {
    position: absolute;
    width: 12px;
    height: 12px;
    background: radial-gradient(circle at 30% 30%, #fff, #aaa);
    border-radius: 50%;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.2);
  }
  
  .bracket .screw-head::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 8px; height: 1px;
    background: #666;
    transform: translate(-50%, -50%) rotate(45deg);
  }

  .bracket.left .screw-head { top: 15px; left: 15px; }
  .bracket.right .screw-head { top: 15px; right: 15px; }

  /* 
    SIGN BODY (The Thickness)
    Critique Fix: Unified materiality, correct geometry.
    Using a thick border-box approach to simulate extrusion.
  */
  .sign-body {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 32px;
    background: var(--sign-edge-light);
    
    /* 
      3D Extrusion via Box Shadow 
      1. The side profile (thickness)
      2. The dark edge (ambient occlusion)
      3. The floor shadow (cast shadow)
    */
    box-shadow: 
      0 0 0 18px var(--sign-edge-dark), /* The physical side profile */
      0 0 0 20px rgba(0,0,0,0.05),      /* Darker edge for depth */
      0 60px 100px rgba(0,0,0,0.35);    /* The cast shadow on the floor */
    
    transform: translateZ(0);
  }

  /* 
    SIGN FACE (The Pristine White Front)
    Critique Fix: Cool-toned gradient, noise texture, physical presence.
  */
  .sign-face {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 32px;
    /* Lighting gradient: Top-Left Light source */
    background: linear-gradient(135deg, #ffffff 0%, #fcfcfc 50%, #f0f2f5 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.9); /* Highlight rim */
    transform: translateZ(18px); /* Lifted to match extrusion shadow */
    display: flex;
    justify-content: center;
    align-items: center;
    backface-visibility: hidden;
    
    /* Subtle noise texture for "Matte" feel */
    background-image: 
      linear-gradient(135deg, #ffffff 0%, #fcfcfc 50%, #f0f2f5 100%),
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
  }

  /* 
    EMBLEM (The Red Play Button)
    Critique Fix: Geometrically crisp, high contrast, glossy enamel.
  */
  .emblem-container {
    position: relative;
    width: 240px;
    height: 240px;
    display: flex;
    justify-content: center;
    align-items: center;
    transform: translateZ(25px); /* Pops out from sign */
  }

  /* Recessed channel effect */
  .emblem-container::before {
    content: '';
    position: absolute;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,0,0,0.02) 0%, rgba(0,0,0,0.08) 70%);
    transform: translateZ(-2px);
    filter: blur(2px);
  }

  .emblem-circle {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    /* Rich, premium red gradient */
    background: radial-gradient(circle at 35% 35%, #ff5252 0%, #ff1a1a 40%, #cc0000 100%);
    
    box-shadow: 
      0 20px 40px rgba(180, 0, 0, 0.3), /* Red ambient glow */
      0 10px 20px rgba(0,0,0,0.2),      /* Drop shadow */
      inset 0 4px 10px rgba(255,255,255,0.4), /* Top Gloss */
      inset 0 -10px 20px rgba(0,0,0,0.2);     /* Inner Depth */
      
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* Specular Highlight (The "Gloss") */
  .emblem-circle::after {
    content: '';
    position: absolute;
    top: 10%;
    left: 15%;
    width: 35%;
    height: 25%;
    border-radius: 50%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.6), rgba(255,255,255,0));
    filter: blur(4px);
    transform: rotate(-45deg);
  }

  /* 
    PLAY ICON (The Triangle)
    Critique Fix: Geometrically crisp, perfectly centered.
  */
  .play-icon {
    width: 0; 
    height: 0; 
    border-top: 50px solid transparent;
    border-bottom: 50px solid transparent;
    border-left: 85px solid #ffffff;
    /* Optical Centering: Shift right slightly */
    margin-left: 12px; 
    filter: drop-shadow(4px 6px 8px rgba(0,0,0,0.25));
    transform: translateZ(5px); /* Slight relief above the red circle */
  }

  /* 
    TYPOGRAPHY
    Critique Fix: Strong hierarchy, anchored at bottom.
  */
  .label-container {
    position: absolute;
    bottom: 10vh;
    width: 100%;
    text-align: center;
    z-index: 100;
    pointer-events: none;
    /* Match the perspective of the scene roughly */
    transform: translateZ(0);
  }

  .label-title {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-main);
    margin-bottom: 8px;
    text-shadow: 0 2px 10px rgba(255,255,255,0.5);
  }

  .label-sub {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.25em;
    color: #4b5563; /* Darker grey for legibility */
    text-transform: uppercase;
    opacity: 0.9;
    background: rgba(255,255,255,0.6); /* Subtle backing for readability */
    padding: 4px 12px;
    border-radius: 4px;
    display: inline-block;
    backdrop-filter: blur(2px);
  }

  /* 
    INTERACTIVITY
    Hover to "Straighten" the sign.
  */
  .product-assembly:hover {
    transform: rotateX(0deg) rotateY(0deg) scale(1.02) translateZ(20px);
  }

</style>
</head>
<body>

  <div class="scene" id="scene">
    
    <!-- Contextual Floor -->
    <div class="floor"></div>

    <!-- The Product Group -->
    <div class="product-assembly" id="product">
      
      <!-- Mounting Hardware (Behind the sign) -->
      <div class="mounting-hardware">
        <div class="bracket left">
          <div class="screw-head"></div>
        </div>
        <div class="bracket right">
          <div class="screw-head"></div>
        </div>
      </div>

      <!-- The Physical Sign Body (Thickness) -->
      <div class="sign-body"></div>

      <!-- The Front Face -->
      <div class="sign-face">
        <div class="emblem-container">
          <div class="emblem-circle">
            <div class="play-icon"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- Product Label -->
    <div class="label-container">
      <div class="label-title">Play Series</div>
      <div class="label-sub">Exterior Grade Signage</div>
    </div>

  </div>

  <script>
    // Subtle Parallax Interaction
    // Adds life to the scene without breaking the 3D illusion
    const scene = document.getElementById('scene');
    const product = document.getElementById('product');

    // Initial default transform
    const defaultRotateX = 10;
    const defaultRotateY = -15;

    scene.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      // Normalized mouse coordinates (-1 to 1)
      const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
      const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);

      // Only apply parallax if not hovering (hover state overrides)
      if (!product.matches(':hover')) {
        // Subtle rotation based on mouse position
        const rotateX = defaultRotateX + (y * -8); 
        const rotateY = defaultRotateY + (x * 10);
        
        product.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
      }
    });

    scene.addEventListener('mouseleave', () => {
      product.style.transform = `rotateX(${defaultRotateX}deg) rotateY(${defaultRotateY}deg)`;
    });
  </script>
</body>
</html>
