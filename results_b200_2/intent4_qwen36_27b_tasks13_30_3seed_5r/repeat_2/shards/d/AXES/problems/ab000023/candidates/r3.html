<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play Series | Premium Signage Concept</title>
<style>
  :root {
    /* Palette: Studio Commercial */
    --bg-color: #eef1f5;
    --text-main: #1a1a1a;
    --text-sub: #555555;
    
    /* Material Colors */
    --sign-face: #ffffff;
    --sign-edge: #e0e4e9;
    --sign-shadow-side: #b0b6be;
    --emblem-red: #ff2a2a;
    --emblem-dark: #cc0000;
    --emblem-shadow: rgba(0,0,0,0.25);
    
    /* Hardware */
    --metal-light: #f8f9fa;
    --metal-mid: #d1d5db;
    --metal-dark: #9ca3af;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #ffffff 0%, var(--bg-color) 60%, #dce1e8 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1500px;
  }

  /* 
    SCENE CONTAINER 
    Holds the 3D space.
  */
  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
  }

  /* 
    FLOOR PLANE 
    Subtle ground plane to anchor the shadow.
  */
  .floor {
    position: absolute;
    width: 200%;
    height: 200%;
    background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(0,0,0,0.03) 100%);
    transform-origin: center top;
    transform: translateY(20vh) rotateX(80deg);
    pointer-events: none;
    z-index: 0;
  }

  /* 
    PRODUCT ASSEMBLY
    The group that rotates.
  */
  .product-assembly {
    position: relative;
    width: 500px;
    height: 500px;
    transform-style: preserve-3d;
    /* Initial Studio Pose: Angled slightly */
    transform: rotateX(8deg) rotateY(-12deg) translateZ(0);
    transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* 
    HARDWARE MOUNTING (The Stand/Bracket)
    Added to fulfill "Physical Object" requirement.
    Placed behind the sign.
  */
  .mounting-bracket {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 120px;
    height: 300px;
    transform: translate(-50%, -50%) translateZ(-20px); /* Behind sign */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .bracket-plate {
    width: 140px;
    height: 80px;
    background: linear-gradient(to bottom, var(--metal-light), var(--metal-mid));
    border-radius: 12px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    position: relative;
    display: flex;
    justify-content: space-around;
    align-items: center;
  }
  
  /* Screws on bracket */
  .screw {
    width: 10px;
    height: 10px;
    background: radial-gradient(circle at 30% 30%, #fff, #aaa);
    border-radius: 50%;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
    position: relative;
  }
  .screw::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 6px; height: 1px;
    background: #555;
    transform: translate(-50%, -50%) rotate(45deg);
  }

  .bracket-arm {
    width: 60px;
    height: 200px;
    background: linear-gradient(to right, var(--metal-dark), var(--metal-light) 40%, var(--metal-dark));
    margin-top: -10px; /* Connects to plate */
    z-index: -1;
    box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
  }

  /* 
    SIGN BODY (The Thickness)
    Critique Fix: Unified materiality, correct geometry.
  */
  .sign-body {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 32px;
    background: var(--sign-edge);
    /* 
      Creates the 3D extrusion. 
      We use a large, solid offset shadow to simulate the side of the board.
    */
    box-shadow: 
      18px 18px 0px var(--sign-shadow-side), /* The physical side profile */
      20px 20px 0px rgba(0,0,0,0.05),       /* Darker edge for depth */
      0px 60px 100px rgba(0,0,0,0.3);       /* The cast shadow on the floor */
    transform: translateZ(0);
  }

  /* 
    SIGN FACE (The Pristine White Front)
    Critique Fix: Cool-toned gradient, no grey band.
  */
  .sign-face {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 32px;
    /* Subtle lighting gradient: Top-Left Light */
    background: linear-gradient(135deg, #ffffff 0%, #fcfcfc 40%, #f3f5f8 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.8); /* Highlight rim */
    transform: translateZ(18px); /* Lifted to match extrusion shadow */
    display: flex;
    justify-content: center;
    align-items: center;
    backface-visibility: hidden;
  }

  /* 
    EMBLEM (The Red Play Button)
    Critique Fix: High contrast, glossy enamel look, dominant.
  */
  .emblem-container {
    position: relative;
    width: 260px;
    height: 260px;
    display: flex;
    justify-content: center;
    align-items: center;
    transform: translateZ(25px); /* Pops out from sign */
  }

  .emblem-circle {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    /* Rich, premium red gradient */
    background: radial-gradient(circle at 35% 35%, #ff5252 0%, #ff1a1a 40%, #cc0000 100%);
    box-shadow: 
      0 20px 40px rgba(180, 0, 0, 0.3), /* Red ambient glow */
      0 10px 20px rgba(0,0,0,0.2),      /* Drop shadow */
      inset 0 4px 10px rgba(255,255,255,0.4), /* Top Gloss */
      inset 0 -10px 20px rgba(0,0,0,0.2);     /* Inner Depth */
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* Specular Highlight (The "Gloss") */
  .emblem-circle::after {
    content: '';
    position: absolute;
    top: 10%;
    left: 15%;
    width: 35%;
    height: 25%;
    border-radius: 50%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.6), rgba(255,255,255,0));
    filter: blur(4px);
    transform: rotate(-45deg);
  }

  /* 
    PLAY ICON (The Triangle)
    Critique Fix: Geometrically crisp, perfectly centered.
  */
  .play-icon {
    width: 0; 
    height: 0; 
    border-top: 55px solid transparent;
    border-bottom: 55px solid transparent;
    border-left: 95px solid #ffffff;
    /* Optical Centering: Shift right slightly */
    margin-left: 15px; 
    filter: drop-shadow(4px 6px 8px rgba(0,0,0,0.25));
    transform: translateZ(5px); /* Slight relief above the red circle */
  }

  /* 
    TYPOGRAPHY
    Critique Fix: Strong hierarchy, anchored at bottom.
  */
  .label-container {
    position: absolute;
    bottom: 12vh;
    width: 100%;
    text-align: center;
    z-index: 100;
    pointer-events: none;
    /* Match the perspective of the scene roughly */
    transform: translateZ(0);
  }

  .label-title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-main);
    margin-bottom: 8px;
    text-shadow: 0 2px 10px rgba(255,255,255,0.5);
  }

  .label-sub {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.2em;
    color: var(--text-sub);
    text-transform: uppercase;
    opacity: 0.8;
  }

  /* 
    INTERACTIVITY
    Hover to "Straighten" the sign.
  */
  .product-assembly:hover {
    transform: rotateX(0deg) rotateY(0deg) scale(1.02) translateZ(20px);
  }

</style>
</head>
<body>

  <div class="scene" id="scene">
    
    <!-- Contextual Floor -->
    <div class="floor"></div>

    <!-- The Product Group -->
    <div class="product-assembly" id="product">
      
      <!-- Mounting Hardware (Behind the sign) -->
      <div class="mounting-bracket">
        <div class="bracket-plate">
          <div class="screw"></div>
          <div class="screw"></div>
        </div>
        <div class="bracket-arm"></div>
      </div>

      <!-- The Physical Sign Body (Thickness) -->
      <div class="sign-body"></div>

      <!-- The Front Face -->
      <div class="sign-face">
        <div class="emblem-container">
          <div class="emblem-circle">
            <div class="play-icon"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- Product Label -->
    <div class="label-container">
      <div class="label-title">Play Series</div>
      <div class="label-sub">Exterior Grade Signage</div>
    </div>

  </div>

  <script>
    // Subtle Parallax Interaction
    // Adds life to the scene without breaking the 3D illusion
    const scene = document.getElementById('scene');
    const product = document.getElementById('product');

    // Initial default transform
    const defaultRotateX = 8;
    const defaultRotateY = -12;

    scene.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      // Normalized mouse coordinates (-1 to 1)
      const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
      const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);

      // Only apply parallax if not hovering (hover state overrides)
      if (!product.matches(':hover')) {
        // Subtle rotation based on mouse position
        const rotateX = defaultRotateX + (y * -8); 
        const rotateY = defaultRotateY + (x * 10);
        
        product.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(0)`;
      }
    });

    scene.addEventListener('mouseleave', () => {
      product.style.transform = `rotateX(${defaultRotateX}deg) rotateY(${defaultRotateY}deg) translateZ(0)`;
    });
  </script>
</body>
</html>
