<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Grip | Editorial Macro</title>
<style>
    :root {
        --bg: #0F0F10;
        --text: #EAE8E3;
        --text-muted: #666666;
        --accent: #FF4757;
        --font-main: "Helvetica Neue", Helvetica, Arial, sans-serif;
        --font-mono: "Menlo", "Courier New", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font-main);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    /* High-end Film Grain */
    .grain {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 50;
        opacity: 0.06;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* UI Hierarchy: Demoted */
    header {
        padding: 2rem 3rem;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        z-index: 10;
        mix-blend-mode: difference;
        opacity: 0.8;
    }

    h1 {
        font-size: 0.75rem;
        font-weight: 400;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text);
    }

    .meta {
        font-family: var(--font-mono);
        font-size: 0.65rem;
        color: var(--text-muted);
        text-align: right;
        line-height: 1.4;
        letter-spacing: 0.05em;
    }

    main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        perspective: 1200px;
    }

    .art-stage {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    svg {
        height: 105vh;
        width: auto;
        /* Subtle vignette on the SVG itself via mask if needed, but we rely on bg */
        filter: drop-shadow(0 20px 50px rgba(0,0,0,0.5));
        transition: transform 0.1s ease-out;
    }

    /* Corner Typography */
    .overlay-text {
        position: absolute;
        bottom: 2rem;
        left: 3rem;
        z-index: 5;
        pointer-events: none;
    }

    .big-type {
        font-size: 1rem;
        line-height: 1.1;
        font-weight: 300;
        letter-spacing: 0.02em;
        color: var(--text);
        text-transform: uppercase;
        opacity: 0.2; /* Demoted opacity */
        border-left: 1px solid rgba(255,255,255,0.3);
        padding-left: 1.2rem;
    }

    .hint {
        position: absolute;
        bottom: 2rem;
        right: 3rem;
        font-family: var(--font-mono);
        font-size: 0.6rem;
        text-transform: uppercase;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 0.8rem;
        opacity: 0.4; /* Significantly dimmed */
        z-index: 10;
    }
    
    .hint::before {
        content: '';
        width: 6px;
        height: 6px;
        border: 1px solid var(--text-muted);
        border-radius: 50%;
        display: inline-block;
    }

</style>
</head>
<body>

    <div class="grain"></div>

    <header>
        <h1>Fig. 01: Grip Anatomy</h1>
        <div class="meta">
            MACRO 100MM<br>
            F/1.4 • 1/500S
        </div>
    </header>

    <main>
        <div class="overlay-text">
            <div class="big-type">Tactile Interface<br>Biological / Digital</div>
        </div>

        <div class="art-stage">
            <!-- SVG Illustration: Deep Zoom, High Fidelity -->
            <svg viewBox="0 0 600 1000" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Filters -->
                    <filter id="bgBlur" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="60" />
                    </filter>
                    
                    <filter id="softFocus" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="1.5" />
                    </filter>

                    <filter id="shadowBlur">
                        <feGaussianBlur stdDeviation="4" />
                    </filter>

                    <!-- Complex Skin Gradients (Subsurface Scattering simulation) -->
                    <linearGradient id="skinMain" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#8B5A2B" /> <!-- Deep Shadow -->
                        <stop offset="50%" stop-color="#C68649" /> <!-- Midtone -->
                        <stop offset="90%" stop-color="#FAD6B1" /> <!-- Highlight -->
                        <stop offset="100%" stop-color="#FCEFE6" /> <!-- Specular -->
                    </linearGradient>

                    <linearGradient id="skinDeep" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#5E3A18" />
                        <stop offset="100%" stop-color="#8B5A2B" />
                    </linearGradient>

                    <radialGradient id="thumbTipGrad" cx="80%" cy="20%" r="90%">
                        <stop offset="0%" stop-color="#FAD6B1" />
                        <stop offset="60%" stop-color="#E0A984" />
                        <stop offset="100%" stop-color="#A66A48" />
                    </radialGradient>

                    <!-- Phone Materials -->
                    <linearGradient id="phoneFrame" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#333" />
                        <stop offset="50%" stop-color="#111" />
                        <stop offset="100%" stop-color="#000" />
                    </linearGradient>

                    <linearGradient id="screenBase" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#0a0a0c" />
                        <stop offset="100%" stop-color="#16161a" />
                    </linearGradient>

                    <!-- Glare -->
                    <linearGradient id="glare" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="white" stop-opacity="0.25" />
                        <stop offset="35%" stop-color="white" stop-opacity="0.05" />
                        <stop offset="50%" stop-color="white" stop-opacity="0" />
                        <stop offset="100%" stop-color="white" stop-opacity="0" />
                    </linearGradient>
                </defs>

                <!-- 1. Background: Deep Bokeh -->
                <g opacity="0.8">
                    <rect width="100%" height="100%" fill="#151515" />
                    <circle cx="400" cy="400" r="300" fill="#222" filter="url(#bgBlur)" opacity="0.6" />
                    <circle cx="100" cy="800" r="400" fill="#1a1a1a" filter="url(#bgBlur)" />
                </g>

                <g id="scene">

                    <!-- 2. Back Fingers (Supporting the phone from behind/right) -->
                    <g id="fingers-back" filter="url(#softFocus)">
                        <!-- The fingers wrapping around the right edge -->
                        <!-- Index -->
                        <path d="M360,320 C410,320 430,350 420,380 C410,410 380,410 370,400 L360,380 Z" fill="url(#skinDeep)" />
                        <!-- Middle -->
                        <path d="M365,420 C420,420 440,450 430,490 C420,530 380,530 370,510 L360,480 Z" fill="url(#skinDeep)" />
                        <!-- Ring -->
                        <path d="M360,520 C410,520 420,550 410,590 C400,630 370,630 360,610 L350,580 Z" fill="url(#skinDeep)" />
                        
                        <!-- Knuckle Definitions (Subtle lines) -->
                        <path d="M400,360 C410,365 415,375 405,385" stroke="#5E3A18" stroke-width="2" fill="none" opacity="0.6"/>
                        <path d="M405,470 C415,475 420,485 410,495" stroke="#5E3A18" stroke-width="2" fill="none" opacity="0.6"/>
                    </g>

                    <!-- 3. The Smartphone (The Object) -->
                    <g id="phone" transform="translate(150, 150)">
                        <!-- Main Body -->
                        <rect x="0" y="0" width="220" height="520" rx="32" fill="url(#phoneFrame)" />
                        
                        <!-- Screen -->
                        <rect x="8" y="8" width="204" height="504" rx="26" fill="url(#screenBase)" />
                        
                        <!-- Screen Content (Abstract but realistic) -->
                        <g opacity="0.9">
                            <!-- Header Area -->
                            <rect x="25" y="60" width="100" height="12" rx="4" fill="#333" />
                            
                            <!-- Main Visual -->
                            <rect x="25" y="100" width="170" height="220" rx="16" fill="#111" stroke="#222" stroke-width="1" />
                            
                            <!-- Graph Line -->
                            <path d="M35,260 Q80,220 120,240 T180,160" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" />
                            <circle cx="180" cy="160" r="4" fill="var(--accent)" />
                            <circle cx="180" cy="160" r="10" fill="var(--accent)" opacity="0.2" />
                            
                            <!-- Text Blocks -->
                            <rect x="25" y="350" width="140" height="8" rx="4" fill="#2a2a2a" />
                            <rect x="25" y="370" width="160" height="6" rx="3" fill="#222" />
                            <rect x="25" y="385" width="120" height="6" rx="3" fill="#222" />
                            
                            <!-- Bottom Dock -->
                            <rect x="25" y="460" width="170" height="24" rx="12" fill="#1a1a1a" />
                        </g>

                        <!-- Hardware Details -->
                        <!-- Notch / Dynamic Island -->
                        <rect x="70" y="15" width="80" height="16" rx="8" fill="#000" />
                        <circle cx="135" cy="23" r="3" fill="#111" /> <!-- Camera -->
                        
                        <!-- Side Buttons (Left side relative to screen, visible) -->
                        <rect x="-2" y="100" width="3" height="30" rx="1" fill="#222" />
                        <rect x="-2" y="140" width="3" height="30" rx="1" fill="#222" />
                        <rect x="219" y="120" width="3" height="40" rx="1" fill="#222" />

                        <!-- Glass Reflection (Diagonal) -->
                        <path d="M-20,-20 L250,200 L250,550 L-20,550 Z" fill="url(#glare)" style="mix-blend-mode: overlay;" pointer-events="none" />
                    </g>

                    <!-- 4. Foreground Hand (The Grip) -->
                    <!-- This is the focal point: Sharp, detailed, organic -->
                    <g id="hand-foreground">
                        
                        <!-- Palm/Wrist Base (Bottom Left) -->
                        <path d="M-50,1100 Q100,900 250,750 L300,700 Q150,850 0,1100 Z" fill="url(#skinDeep)" />

                        <!-- Thumb Group -->
                        <g id="thumb">
                            <!-- Thenar Eminence (Fleshy base) -->
                            <path d="M260,760 C300,700 340,650 360,600 C380,550 400,580 380,630 C360,680 320,740 260,760 Z" fill="url(#skinMain)" />
                            
                            <!-- Thumb Proximal Phalanx -->
                            <path d="M360,600 C390,550 420,510 440,480 C460,450 430,430 410,460 C390,490 360,530 360,600 Z" fill="url(#skinMain)" />
                            
                            <!-- Thumb Distal Phalanx (Tip) -->
                            <path d="M440,480 C470,450 490,430 480,400 C470,370 440,380 420,410 C400,440 410,450 440,480 Z" fill="url(#thumbTipGrad)" />

                            <!-- Anatomical Creases (Joints) -->
                            <path d="M420,510 C430,500 440,510 450,520" stroke="#7A4F34" stroke-width="1.5" fill="none" opacity="0.7" stroke-linecap="round" />
                            <path d="M460,440 C470,430 480,440 485,450" stroke="#7A4F34" stroke-width="1.5" fill="none" opacity="0.7" stroke-linecap="round" />
                            
                            <!-- Nail Bed -->
                            <path d="M485,415 C490,405 485,395 475,395 C470,395 465,405 470,415 Z" fill="#EBCBB6" opacity="0.8" />
                            <path d="M482,412 L475,408" stroke="white" stroke-width="1" opacity="0.5" /> <!-- Highlight -->
                        </g>

                        <!-- Contact Shadows (Critical for realism) -->
                        <!-- Shadow cast by thumb onto the phone screen -->
                        <path d="M450,430 C470,410 490,420 500,450 C510,480 480,500 450,480 C420,460 430,440 450,430 Z" 
                              fill="#000" opacity="0.4" filter="url(#shadowBlur)" 
                              transform="translate(150, 150)" style="mix-blend-mode: multiply;" pointer-events="none" />
                        
                        <!-- Shadow cast by phone onto the palm -->
                        <path d="M250,750 L300,700 L300,750 Z" fill="black" opacity="0.3" filter="url(#shadowBlur)" />

                    </g>
                </g>
            </svg>
        </div>
    </main>

    <div class="hint">
        <span>Interact</span>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const svgElement = document.querySelector('svg');
        const thumbGroup = document.getElementById('hand-foreground');
        const phoneGroup = document.getElementById('phone');
        
        // Initial positions for transform restoration
        const initialPhoneTransform = "translate(150px, 150px)";

        document.addEventListener('mousemove', (e) => {
            // Calculate mouse position relative to center
            const x = (window.innerWidth / 2 - e.pageX) / 60; 
            const y = (window.innerHeight / 2 - e.pageY) / 60;

            // 1. Rotate the entire SVG slightly (Parallax)
            // Use a subtle rotation to simulate the hand holding the phone at an angle
            svgElement.style.transform = `rotateY(${x * 0.8}deg) rotateX(${-y * 0.8}deg) scale(1.02)`;

            // 2. Parallax Layers
            // The thumb is closest to the "camera", so it moves the most
            if(thumbGroup) {
                const thumbX = x * 2.5; 
                const thumbY = y * 2.5;
                thumbGroup.style.transform = `translate(${thumbX}px, ${thumbY}px)`;
            }
            
            // The phone is in the middle, moves moderately
            if(phoneGroup) {
                const phoneX = x * 1.2;
                const phoneY = y * 1.2;
                phoneGroup.style.transform = `translate(${150 + phoneX}px, ${150 + phoneY}px)`;
            }
        });

        // Reset on mouse leave
        document.addEventListener('mouseleave', () => {
            svgElement.style.transform = `rotateY(0deg) rotateX(0deg) scale(1)`;
            if(thumbGroup) thumbGroup.style.transform = `translate(0px, 0px)`;
            if(phoneGroup) phoneGroup.style.transform = initialPhoneTransform;
        });
    });
</script>
</body>
</html>
