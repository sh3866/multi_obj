<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Grip | Editorial Close-Up</title>
<style>
    :root {
        --bg: #111111;
        --text: #EAE8E3;
        --text-muted: #888888;
        --accent: #D9534F;
        --font-main: "Helvetica Neue", Helvetica, Arial, sans-serif;
        --font-mono: "Menlo", "Courier New", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font-main);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    /* Subtle Film Grain */
    .grain {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 20;
        opacity: 0.07;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Minimal UI Layout */
    header {
        padding: 1.5rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        z-index: 10;
        mix-blend-mode: difference;
    }

    h1 {
        font-size: 0.85rem;
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        opacity: 0.8;
    }

    .meta {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: var(--text-muted);
        text-align: right;
        line-height: 1.4;
        opacity: 0.6;
    }

    main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        perspective: 1000px;
    }

    /* The SVG Container - Tight Crop */
    .art-stage {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        /* Center the view on the right side of the phone/hand cluster */
        transform: scale(1.1); 
    }

    svg {
        height: 110vh;
        width: auto;
        filter: drop-shadow(0 30px 60px rgba(0,0,0,0.6));
        transition: transform 0.1s linear;
        will-change: transform;
    }

    /* Secondary Typography - Demoted */
    .overlay-text {
        position: absolute;
        bottom: 2rem;
        left: 2rem;
        z-index: 5;
        pointer-events: none;
    }

    .big-type {
        font-size: 1.2rem;
        line-height: 1;
        font-weight: 400;
        letter-spacing: -0.02em;
        color: var(--text);
        text-transform: uppercase;
        opacity: 0.4;
        border-left: 1px solid var(--text);
        padding-left: 1rem;
    }

    /* Interactive Hint - High Contrast */
    .hint {
        position: absolute;
        bottom: 2rem;
        right: 2rem;
        font-family: var(--font-mono);
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 0.5rem;
        opacity: 0.7;
        z-index: 10;
    }
    .hint::before {
        content: '';
        width: 12px;
        height: 12px;
        border: 1px solid var(--text);
        border-radius: 50%;
        display: inline-block;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.8); opacity: 0.5; }
        100% { transform: scale(1); opacity: 1; }
    }

</style>
</head>
<body>

    <div class="grain"></div>

    <header>
        <h1>Fig. 01: The Grip</h1>
        <div class="meta">
            MACRO LENS<br>
            f/1.8 • 1/200s
        </div>
    </header>

    <main>
        <!-- Overlay text demoted to bottom corner -->
        <div class="overlay-text">
            <div class="big-type">Tactile Reality<br><span style="font-weight:300; font-size:0.8em; display:block; margin-top:4px; opacity:0.6;">Biological Intent / Digital Response</span></div>
        </div>

        <div class="art-stage">
            <!-- SVG Illustration Start: Tight Crop, High Detail -->
            <svg viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Background Blur -->
                    <filter id="bgBlur" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="40" />
                    </filter>

                    <!-- Skin Gradients -->
                    <linearGradient id="skinWarm" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FAD6B1" />
                        <stop offset="40%" stop-color="#E0A984" />
                        <stop offset="100%" stop-color="#A66A48" />
                    </linearGradient>
                    
                    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#D08E6A" />
                        <stop offset="100%" stop-color="#6E3B20" />
                    </linearGradient>

                    <!-- Phone Body Gradients -->
                    <linearGradient id="phoneBezel" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#2A2A2A" />
                        <stop offset="50%" stop-color="#111111" />
                        <stop offset="100%" stop-color="#050505" />
                    </linearGradient>

                    <linearGradient id="screenDark" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#1A1C20" />
                        <stop offset="100%" stop-color="#08080A" />
                    </linearGradient>

                    <!-- Glass Reflection -->
                    <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="white" stop-opacity="0.15" />
                        <stop offset="40%" stop-color="white" stop-opacity="0" />
                        <stop offset="100%" stop-color="white" stop-opacity="0" />
                    </linearGradient>

                    <!-- Blur for depth of field -->
                    <filter id="dof" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="2" />
                    </filter>
                </defs>

                <!-- 1. Background: Abstract Bokeh -->
                <g opacity="0.6">
                    <circle cx="400" cy="600" r="400" fill="#222" filter="url(#bgBlur)" />
                    <circle cx="200" cy="300" r="200" fill="#333" filter="url(#bgBlur)" opacity="0.5" />
                    <circle cx="600" cy="800" r="250" fill="#1a1a1a" filter="url(#bgBlur)" />
                </g>

                <g id="scene" transform="translate(0, 0)">

                    <!-- 2. The Hand: Back Fingers (Wrapping around right edge) -->
                    <!-- These provide the structural hold -->
                    <g id="fingers-back">
                        <!-- Index Finger -->
                        <path d="M560,350 Q640,360 630,420 Q620,480 580,500 L550,480 Q580,460 580,420 Q580,380 560,370 Z" fill="url(#skinWarm)" />
                        <!-- Middle Finger -->
                        <path d="M550,450 Q640,460 630,530 Q620,600 570,620 L540,590 Q580,570 580,530 Q580,490 550,470 Z" fill="url(#skinWarm)" />
                        <!-- Ring Finger -->
                        <path d="M540,550 Q620,560 610,630 Q600,700 550,720 L520,690 Q560,670 560,630 Q560,590 540,570 Z" fill="url(#skinShadow)" />
                        
                        <!-- Finger Details (Knuckles/Joints) -->
                        <path d="M610,380 Q600,390 615,400" fill="none" stroke="#8A4B2E" stroke-width="2" opacity="0.4" filter="url(#dof)"/>
                        <path d="M605,490 Q595,500 610,510" fill="none" stroke="#8A4B2E" stroke-width="2" opacity="0.4" filter="url(#dof)"/>
                    </g>

                    <!-- 3. The Smartphone (Middle Layer) -->
                    <g id="phone" transform="translate(300, 200)">
                        <!-- Phone Body -->
                        <rect x="0" y="0" width="240" height="500" rx="35" fill="url(#phoneBezel)" />
                        
                        <!-- Screen -->
                        <rect x="10" y="10" width="220" height="480" rx="28" fill="url(#screenDark)" />
                        
                        <!-- Screen UI / Content -->
                        <g opacity="0.8">
                            <!-- App Card -->
                            <rect x="30" y="100" width="180" height="180" rx="20" fill="#222" />
                            <!-- Abstract Graph -->
                            <path d="M50,240 L90,200 L130,220 L190,160" fill="none" stroke="#D9534F" stroke-width="4" stroke-linecap="round" />
                            <circle cx="190" cy="160" r="4" fill="#D9534F" />
                            <circle cx="90" cy="200" r="4" fill="#555" />
                            
                            <!-- Text Lines -->
                            <rect x="30" y="310" width="120" height="10" rx="5" fill="#444" />
                            <rect x="30" y="340" width="160" height="6" rx="3" fill="#333" />
                            <rect x="30" y="360" width="140" height="6" rx="3" fill="#333" />
                        </g>

                        <!-- Hardware Details -->
                        <!-- Speaker Grille -->
                        <rect x="100" y="25" width="40" height="4" rx="2" fill="#000" opacity="0.8" />
                        <!-- Camera Lens -->
                        <circle cx="120" cy="27" r="3" fill="#111" />
                        <circle cx="120" cy="27" r="1.5" fill="#0a0a0a" />
                        <!-- Side Buttons (Volume/Power) -->
                        <rect x="-3" y="120" width="4" height="40" rx="1" fill="#222" />
                        <rect x="-3" y="170" width="4" height="40" rx="1" fill="#222" />
                        <rect x="239" y="150" width="4" height="60" rx="1" fill="#222" />

                        <!-- Glass Reflection Overlay -->
                        <rect x="10" y="10" width="220" height="480" rx="28" fill="url(#glassShine)" pointer-events="none" />
                    </g>

                    <!-- 4. The Hand: Foreground (Thumb & Palm) -->
                    <g id="hand-foreground" transform="translate(0,0)">
                        <!-- Palm Base (Wrist area coming from bottom left) -->
                        <path d="M-50,1200 Q150,1000 250,850 L350,800 Q200,950 50,1200 Z" fill="url(#skinShadow)" />
                        
                        <!-- Thumb Base (Thenar Eminence - fleshy part) -->
                        <path d="M250,850 Q300,750 400,650 L380,620 Q280,720 220,820 Z" fill="url(#skinWarm)" />
                        
                        <!-- Thumb Proximal Phalanx -->
                        <path d="M390,640 Q450,580 480,520 L450,490 Q420,540 370,600 Z" fill="url(#skinWarm)" />
                        
                        <!-- Thumb Distal Phalanx (Tip) -->
                        <path d="M470,510 Q510,460 500,420 L470,430 Q480,470 450,500 Z" fill="url(#skinWarm)" />

                        <!-- Thumb Joint Creases -->
                        <path d="M440,540 Q450,530 460,550" fill="none" stroke="#7A4F34" stroke-width="2" opacity="0.6" stroke-linecap="round" />
                        <path d="M480,460 Q490,450 495,470" fill="none" stroke="#7A4F34" stroke-width="2" opacity="0.6" stroke-linecap="round" />

                        <!-- Nail -->
                        <path d="M498,425 Q505,420 502,415 Q495,418 490,425 Z" fill="#EBCBB6" opacity="0.9" />
                        <!-- Nail Highlight -->
                        <path d="M498,422 Q500,420 499,418" fill="none" stroke="white" stroke-width="1" opacity="0.5" />

                        <!-- Contact Shadow on Phone (Cast by Thumb) -->
                        <!-- This creates the physical link between skin and glass -->
                        <path d="M460,480 Q490,470 510,500 L500,530 Q470,530 450,500 Z" fill="black" opacity="0.3" filter="url(#dof)" style="mix-blend-mode: multiply;" transform="translate(300, 200)" />
                    </g>
                </g>
            </svg>
        </div>
    </main>

    <div class="hint">
        <span>Interact</span>
    </div>

<script>
    // Interaction Logic
    document.addEventListener('DOMContentLoaded', () => {
        const svgElement = document.querySelector('svg');
        const thumbGroup = document.getElementById('hand-foreground');
        const phoneGroup = document.getElementById('phone');
        
        // Smooth Parallax Effect
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 40; // Reduced sensitivity for elegance
            const y = (window.innerHeight / 2 - e.pageY) / 40;

            // Rotate the entire composition slightly
            svgElement.style.transform = `rotateY(${x * 0.5}deg) rotateX(${-y * 0.5}deg)`;

            // Subtle parallax on the hand relative to the phone
            // This simulates the depth of the hand being closer to the lens
            if(thumbGroup) {
                const thumbX = x * 1.5; // Moves more than background
                const thumbY = y * 1.5;
                thumbGroup.style.transform = `translate(${thumbX}px, ${thumbY}px)`;
            }
            
            // Phone moves slightly less, simulating it being held in the middle
            if(phoneGroup) {
                const phoneX = x * 0.8;
                const phoneY = y * 0.8;
                phoneGroup.style.transform = `translate(${300 + phoneX}px, ${200 + phoneY}px)`;
            }
        });

        // Reset on mouse leave
        document.addEventListener('mouseleave', () => {
            svgElement.style.transform = `rotateY(0deg) rotateX(0deg)`;
            if(thumbGroup) thumbGroup.style.transform = `translate(0px, 0px)`;
            if(phoneGroup) phoneGroup.style.transform = `translate(300px, 200px)`;
        });
    });
</script>
</body>
</html>
