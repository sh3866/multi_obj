<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fig. 02: The Grip | Editorial Revision</title>
<style>
    :root {
        --bg: #050505;
        --text-primary: #EAEAEA;
        --text-secondary: #555555;
        --accent: #FF3333;
        --font-ui: "Helvetica Neue", "Helvetica", "Arial", sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg);
        color: var(--text-primary);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1500px;
    }

    /* --- Post-Processing --- */
    .overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 100;
        overflow: hidden;
    }

    /* Subtle Noise */
    .grain {
        position: absolute;
        top: -50%; left: -50%; width: 200%; height: 200%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
        opacity: 0.6;
        mix-blend-mode: overlay;
    }

    /* Stronger Vignette for Editorial Focus */
    .vignette {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at 50% 50%, transparent 20%, rgba(0,0,0,0.8) 90%);
    }

    /* --- UI Layout: Minimal & Demoted --- */
    header {
        position: absolute;
        top: 2.5rem;
        left: 3rem;
        z-index: 50;
        opacity: 0.6; /* Demoted */
        transition: opacity 0.3s;
    }
    
    header:hover { opacity: 1; }

    .label-top {
        font-size: 0.6rem;
        letter-spacing: 0.2em;
        color: var(--text-secondary);
        margin-bottom: 0.5rem;
        border-left: 1px solid var(--accent);
        padding-left: 0.5rem;
    }

    .label-title {
        font-size: 0.9rem;
        font-weight: 500;
        letter-spacing: 0.05em;
        color: var(--text-primary);
        text-transform: uppercase;
    }

    .meta-data {
        position: absolute;
        top: 2.5rem;
        right: 3rem;
        text-align: right;
        z-index: 50;
        opacity: 0.4; /* Demoted */
    }

    .meta-item {
        font-size: 0.6rem;
        color: var(--text-secondary);
        line-height: 1.4;
        letter-spacing: 0.05em;
    }

    .meta-accent {
        color: var(--accent);
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
    }
    
    .meta-accent::before {
        content: '';
        display: block;
        width: 4px;
        height: 4px;
        background-color: var(--accent);
        border-radius: 50%;
        animation: blink 3s infinite;
    }

    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
    }

    /* --- The Stage --- */
    main {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    svg {
        height: 105vh; /* Taller to accommodate macro crop */
        width: auto;
        max-width: 100%;
        /* High Contrast Rim Light Effect via SVG, drop shadow adds depth */
        filter: drop-shadow(0 20px 60px rgba(0,0,0,1));
        will-change: transform;
    }

    .footer-info {
        position: absolute;
        bottom: 2.5rem;
        left: 3rem;
        z-index: 50;
        opacity: 0.5; /* Demoted */
    }

    .big-label {
        font-size: 0.65rem;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-secondary);
        line-height: 1.5;
    }

</style>
</head>
<body>

    <!-- Visual Overlays -->
    <div class="overlay">
        <div class="grain"></div>
        <div class="vignette"></div>
    </div>

    <!-- UI Frame -->
    <header>
        <div class="label-top">FIG. 02</div>
        <div class="label-title">Biological Interface</div>
    </header>

    <div class="meta-data">
        <div class="meta-item">MACRO 105MM f/1.2</div>
        <div class="meta-item">ISO 400 • 1/1000S</div>
        <div class="meta-item meta-accent">REC</div>
    </div>

    <main>
        <div class="footer-info">
            <div class="big-label">
                Subject: Grip Analysis<br>
                Status: Active
            </div>
        </div>

        <div class="scene-container">
            <!-- SVG Illustration -->
            <!-- viewBox is tighter to simulate the "Macro/Close-up" crop -->
            <svg viewBox="0 0 1000 1400" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
                <defs>
                    <!-- Filters -->
                    <filter id="blur-bg" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="25" />
                    </filter>
                    <filter id="blur-soft" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="3" />
                    </filter>
                    <filter id="blur-heavy" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="6" />
                    </filter>
                    <filter id="glow-red" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="8" result="blur" />
                        <feMerge>
                            <feMergeNode in="blur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>

                    <!-- Skin Gradients (Realistic Subsurface Scattering) -->
                    <radialGradient id="skin-base" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                        <stop offset="0%" stop-color="#D4A58A" />
                        <stop offset="60%" stop-color="#A8765C" />
                        <stop offset="100%" stop-color="#754932" />
                    </radialGradient>

                    <radialGradient id="skin-highlight" cx="30%" cy="30%" r="70%">
                        <stop offset="0%" stop-color="#F2D0BC" stop-opacity="0.8" />
                        <stop offset="100%" stop-color="#A8765C" stop-opacity="0" />
                    </radialGradient>

                    <!-- Screen Emission -->
                    <radialGradient id="screen-ambient" cx="50%" cy="50%" r="60%">
                        <stop offset="0%" stop-color="#FF3333" stop-opacity="0.15" />
                        <stop offset="100%" stop-color="#FF3333" stop-opacity="0" />
                    </radialGradient>

                    <!-- Device Materials -->
                    <linearGradient id="metal-frame" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#111" />
                        <stop offset="10%" stop-color="#444" />
                        <stop offset="20%" stop-color="#222" />
                        <stop offset="80%" stop-color="#222" />
                        <stop offset="90%" stop-color="#555" />
                        <stop offset="100%" stop-color="#000" />
                    </linearGradient>

                    <linearGradient id="glass-glare" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
                        <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.0" />
                        <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0.0" />
                        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
                    </linearGradient>

                    <!-- Clip Path -->
                    <clipPath id="screen-clip">
                        <rect x="400" y="200" width="320" height="800" rx="40" />
                    </clipPath>
                </defs>

                <!-- 1. Background -->
                <g id="background">
                    <rect width="100%" height="100%" fill="var(--bg)" />
                    <!-- Abstract light spill -->
                    <circle cx="600" cy="600" r="500" fill="#111" filter="url(#blur-bg)" />
                </g>

                <!-- 2. The Smartphone (Detailed) -->
                <g id="device" transform="translate(0, 0) rotate(-5)">
                    
                    <!-- Phone Chassis -->
                    <rect x="385" y="185" width="350" height="830" rx="45" fill="url(#metal-frame)" />
                    
                    <!-- Screen Base -->
                    <rect x="400" y="200" width="320" height="800" rx="40" fill="#030303" />

                    <!-- Screen Content (Clipped) -->
                    <g clip-path="url(#screen-clip)">
                        <!-- Grid -->
                        <path d="M400,300 L720,300 M400,400 L720,400 M400,500 L720,500 M400,600 L720,600 M400,700 L720,700 M400,800 L720,800 M400,900 L720,900" stroke="#222" stroke-width="1" opacity="0.2"/>
                        
                        <!-- Glowing Red Graph -->
                        <g transform="translate(0, 50)">
                            <!-- Glow Layer -->
                            <path d="M420,600 C460,600 480,450 550,480 S620,250 680,280" fill="none" stroke="var(--accent)" stroke-width="6" filter="url(#glow-red)" opacity="0.8" />
                            <!-- Core Line -->
                            <path d="M420,600 C460,600 480,450 550,480 S620,250 680,280" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" />
                            
                            <!-- Data Point -->
                            <circle cx="680" cy="280" r="4" fill="#fff" />
                            <circle cx="680" cy="280" r="12" fill="var(--accent)" opacity="0.6" filter="url(#blur-soft)" />
                        </g>

                        <!-- Abstract UI Text -->
                        <rect x="430" y="280" width="120" height="6" rx="3" fill="#fff" opacity="0.9" />
                        <rect x="430" y="295" width="60" height="4" rx="2" fill="#666" />
                        
                        <!-- Bottom Dock -->
                        <rect x="430" y="860" width="220" height="40" rx="20" fill="#1a1a1a" stroke="#333" stroke-width="1" />
                    </g>

                    <!-- Screen Reflection -->
                    <rect x="400" y="200" width="320" height="800" rx="40" fill="url(#glass-glare)" pointer-events="none" />
                    
                    <!-- Hardware -->
                    <rect x="480" y="215" width="100" height="30" rx="15" fill="#000" />
                    <circle cx="560" cy="230" r="6" fill="#111" />
                    <circle cx="560" cy="230" r="2" fill="#222" />
                </g>

                <!-- 3. The Hand (Organic, Anatomical) -->
                <g id="hand-assembly">
                    
                    <!-- A. Palm & Wrist (Background) -->
                    <!-- Larger, fleshy base connecting to wrist -->
                    <path id="palm" d="M650,900 
                             C700,1000 750,1100 950,1150 
                             L950,1500 
                             L300,1500 
                             Q500,1200 650,900 Z" 
                          fill="url(#skin-base)" />
                          
                    <!-- Palm Creases -->
                    <path d="M680,950 Q750,980 850,1050" stroke="#6B422D" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
                    <path d="M650,1000 Q700,1050 800,1100" stroke="#6B422D" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>

                    <!-- B. Back Fingers (Wrapping Right Edge) -->
                    <g id="fingers-back">
                        <!-- Index Finger -->
                        <path d="M680,400 
                                 C720,380 780,390 790,440 
                                 C800,490 750,510 700,500 
                                 L680,480 Z" 
                              fill="url(#skin-base)" />
                        <!-- Index Knuckles/Joints -->
                        <path d="M730,430 Q750,435 760,450" stroke="#6B422D" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
                        <path d="M770,460 Q780,465 785,475" stroke="#6B422D" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>

                        <!-- Middle Finger -->
                        <path d="M680,490 
                                 C730,480 790,500 800,560 
                                 C810,620 760,630 710,610 
                                 L680,590 Z" 
                              fill="url(#skin-base)" />
                        <path d="M740,530 Q760,535 770,550" stroke="#6B422D" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>

                        <!-- Ring Finger -->
                        <path d="M680,580 
                                 C720,570 770,590 780,650 
                                 C790,710 740,720 700,700 
                                 L680,680 Z" 
                              fill="url(#skin-base)" />
                        <path d="M730,630 Q750,635 760,650" stroke="#6B422D" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
                    </g>

                    <!-- C. Foreground Thumb (The Hero) -->
                    <g id="thumb-group">
                        <!-- Thenar Eminence (Fleshy Base) -->
                        <path d="M650,900 
                                 C700,850 750,750 760,680 
                                 C770,600 820,640 790,710 
                                 C760,780 700,850 650,900 Z" 
                              fill="url(#skin-base)" />
                        
                        <!-- Thumb Proximal Phalanx -->
                        <path d="M760,680 
                                 C800,620 850,550 870,500 
                                 C890,450 850,420 820,460 
                                 C780,510 740,600 760,680 Z" 
                              fill="url(#skin-base)" />
                        
                        <!-- Thumb Distal Phalanx -->
                        <path d="M870,500 
                                 C900,450 920,400 900,350 
                                 C880,300 840,320 820,360 
                                 C800,400 830,450 870,500 Z" 
                              fill="url(#skin-base)" />

                        <!-- Nail Bed (Anatomical Detail) -->
                        <path d="M895,370 
                                 C902,355 898,340 888,340 
                                 C880,340 875,355 880,370 Z" 
                              fill="#FCEFE6" opacity="0.5" />
                        <!-- Nail Highlight -->
                        <path d="M892,368 L885,362" stroke="white" stroke-width="1.5" opacity="0.8" stroke-linecap="round" />

                        <!-- Thumb Joint Crease -->
                        <path d="M840,520 C850,510 860,520 870,530" stroke="#6B422D" stroke-width="2.5" fill="none" opacity="0.7" stroke-linecap="round" />
                        
                        <!-- Skin Texture -->
                        <path d="M820,480 Q830,470 840,480" stroke="#8B5A3D" stroke-width="1.5" fill="none" opacity="0.5" />
                    </g>

                    <!-- D. Lighting & Shadows (Crucial for Realism) -->
                    
                    <!-- Shadow cast BY thumb ONTO the phone screen -->
                    <!-- Placed visually "on top" of the screen but "under" the thumb tip -->
                    <g id="contact-shadows" style="mix-blend-mode: multiply; opacity: 0.9;" filter="url(#blur-soft)">
                        <!-- Main shadow blob -->
                        <path d="M800,380 
                                 C830,360 860,370 880,400 
                                 C900,430 870,460 830,440 
                                 C790,420 780,400 800,380 Z" 
                              fill="#000" />
                    </g>

                    <!-- Screen Glow on Thumb (Subsurface Scattering Simulation) -->
                    <!-- The phone screen is glowing, lighting up the side of the thumb facing it -->
                    <path d="M820,360 
                             C840,320 880,300 900,350 
                             C920,400 900,450 870,500 
                             C850,450 830,400 820,360 Z" 
                          fill="var(--accent)" opacity="0.25" style="mix-blend-mode: screen;" filter="url(#blur-heavy)" />

                    <!-- Specular Highlight on skin (Top of thumb) -->
                    <path d="M880,420 C890,410 900,410 900,400" stroke="white" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round" filter="url(#blur-soft)" />

                </g>
            </svg>
        </div>
    </main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const svgElement = document.querySelector('svg');
        const thumbGroup = document.getElementById('thumb-group');
        const fingersBack = document.getElementById('fingers-back');
        const palm = document.getElementById('palm');
        const device = document.getElementById('device');
        const contactShadows = document.getElementById('contact-shadows');
        
        // Configuration
        const sensitivity = 80; // Lower = more movement
        const thumbSens = 2.5; // Foreground moves most
        const deviceSens = 0.3; // Background moves least
        
        // Initial state
        let targetX = 0;
        let targetY = 0;
        let currentX = 0;
        let currentY = 0;

        // Smooth animation loop
        function animate() {
            // Linear interpolation (Lerp) for smoothness
            currentX += (targetX - currentX) * 0.08;
            currentY += (targetY - currentY) * 0.08;

            // Apply transforms
            // 1. Parallax Rotation (Subtle tilt)
            svgElement.style.transform = `rotateY(${currentX * 0.3}deg) rotateX(${-currentY * 0.3}deg)`;

            // 2. Layered Parallax Translation
            // Thumb moves most (closest to viewer)
            if(thumbGroup) {
                thumbGroup.style.transform = `translate(${currentX * thumbSens}px, ${currentY * thumbSens}px)`;
            }
            
            // Palm moves moderately
            if(palm) {
                palm.style.transform = `translate(${currentX * 1.5}px, ${currentY * 1.5}px)`;
            }

            // Fingers back move slightly less
            if(fingersBack) {
                fingersBack.style.transform = `translate(${currentX * 1.2}px, ${currentY * 1.2}px)`;
            }

            // Device moves least (furthest back)
            if(device) {
                // Note: Keep the initial -5deg rotation
                device.style.transform = `translate(${currentX * deviceSens}px, ${currentY * deviceSens}px) rotate(-5deg)`;
            }

            // 3. Dynamic Shadow Adjustment (Simulates changing distance/angle)
            // As thumb moves closer (right/down), shadow gets sharper/darker
            if(contactShadows) {
                // Calculate distance from center to determine "pressure"
                const dist = Math.sqrt(currentX*currentX + currentY*currentY);
                const blurVal = 4 - (dist / 20); // Closer = less blur
                const opacityVal = 0.9 + (dist / 150); // Closer = darker
                
                contactShadows.style.filter = `blur(${Math.max(1, blurVal)}px)`;
                contactShadows.style.opacity = Math.min(0.98, opacityVal);
            }

            requestAnimationFrame(animate);
        }

        document.addEventListener('mousemove', (e) => {
            // Calculate center relative position
            const x = (window.innerWidth / 2 - e.pageX); 
            const y = (window.innerHeight / 2 - e.pageY);

            targetX = x / sensitivity;
            targetY = y / sensitivity;
        });

        // Start loop
        animate();
    });
</script>
</body>
</html>
