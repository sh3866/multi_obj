<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fig. 02: The Grip | Editorial Revision</title>
<style>
    :root {
        --bg: #030303;
        --text-primary: #E8E8E8;
        --text-secondary: #666666;
        --accent: #FF2A2A;
        --font-ui: "Helvetica Neue", "Helvetica", "Arial", sans-serif;
        --font-tech: "Courier New", "Menlo", "Monaco", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg);
        color: var(--text-primary);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1200px;
        /* Subtle texture for background */
        background-image: radial-gradient(circle at 50% 50%, #111 0%, #000 100%);
    }

    /* --- Post-Processing Overlays --- */
    .overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 100;
        overflow: hidden;
    }

    /* Film Grain */
    .grain {
        position: absolute;
        top: -50%; left: -50%; width: 200%; height: 200%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.06'/%3E%3C/svg%3E");
        animation: grainAnim 0.4s steps(4) infinite;
        opacity: 0.8;
        mix-blend-mode: overlay;
    }

    @keyframes grainAnim {
        0%, 100% { transform: translate(0,0); }
        25% { transform: translate(-5%,-5%); }
        50% { transform: translate(5%,5%); }
        75% { transform: translate(-5%,5%); }
    }

    /* Vignette */
    .vignette {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at 50% 50%, transparent 30%, rgba(0,0,0,0.6) 100%);
    }

    /* --- UI Layout: Editorial Frame --- */
    header {
        position: absolute;
        top: 3rem;
        left: 3.5rem;
        z-index: 50;
        mix-blend-mode: exclusion;
    }

    .label-top {
        font-family: var(--font-tech);
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        color: var(--text-secondary);
        margin-bottom: 0.5rem;
        border-left: 2px solid var(--accent);
        padding-left: 0.5rem;
    }

    .label-title {
        font-size: 1.2rem;
        font-weight: 600;
        letter-spacing: -0.03em;
        color: var(--text-primary);
        text-transform: uppercase;
    }

    .meta-data {
        position: absolute;
        top: 3rem;
        right: 3.5rem;
        text-align: right;
        z-index: 50;
        mix-blend-mode: exclusion;
    }

    .meta-item {
        font-family: var(--font-tech);
        font-size: 0.65rem;
        color: var(--text-secondary);
        line-height: 1.6;
        letter-spacing: 0.05em;
    }

    .meta-accent {
        color: var(--accent);
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
    }
    
    .meta-accent::before {
        content: '';
        display: block;
        width: 6px;
        height: 6px;
        background-color: var(--accent);
        border-radius: 50%;
        animation: blink 2s infinite;
    }

    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
    }

    /* --- The Stage --- */
    main {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    .scene-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        transform-style: preserve-3d;
    }

    svg {
        height: 110vh;
        width: auto;
        max-width: 100%;
        /* Soft drop shadow for the whole composition */
        filter: drop-shadow(0 30px 80px rgba(0,0,0,0.9));
        will-change: transform;
    }

    /* Bottom Info */
    .footer-info {
        position: absolute;
        bottom: 3rem;
        left: 3.5rem;
        z-index: 50;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        mix-blend-mode: exclusion;
    }

    .big-label {
        font-size: 0.75rem;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-secondary);
        max-width: 250px;
        line-height: 1.5;
    }

    .big-label span {
        color: var(--text-primary);
        font-weight: 600;
    }

</style>
</head>
<body>

    <!-- Visual Overlays -->
    <div class="overlay">
        <div class="grain"></div>
        <div class="vignette"></div>
    </div>

    <!-- UI Frame -->
    <header>
        <div class="label-top">FIG. 02</div>
        <div class="label-title">Tactile Interface</div>
    </header>

    <div class="meta-data">
        <div class="meta-item">MACRO 105MM f/1.2</div>
        <div class="meta-item">ISO 400 • 1/1000S</div>
        <div class="meta-item meta-accent">REC</div>
    </div>

    <main>
        <div class="footer-info">
            <div class="big-label">
                <span>Subject:</span> Biological Grip<br>
                <span>Object:</span> Glass / Metal<br>
                <span>Status:</span> Active
            </div>
        </div>

        <div class="scene-container">
            <!-- SVG Illustration -->
            <svg viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
                <defs>
                    <!-- Filters -->
                    <filter id="blur-bg" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="15" />
                    </filter>
                    <filter id="blur-soft" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="2.5" />
                    </filter>
                    <filter id="blur-shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="4" />
                    </filter>

                    <!-- Skin Gradients (Warm, realistic subsurface) -->
                    <!-- Main skin tone -->
                    <linearGradient id="skin-base" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#E8CBB4" />
                        <stop offset="40%" stop-color="#C49072" />
                        <stop offset="100%" stop-color="#8A5A42" />
                    </linearGradient>

                    <!-- Shadowed skin tone (under fingers) -->
                    <linearGradient id="skin-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#A67055" />
                        <stop offset="100%" stop-color="#5E3A28" />
                    </linearGradient>

                    <!-- Screen Glow Gradient -->
                    <radialGradient id="screen-glow" cx="50%" cy="50%" r="70%">
                        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2" />
                        <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05" />
                        <stop offset="100%" stop-color="#000000" stop-opacity="0" />
                    </radialGradient>

                    <!-- Glass Reflection -->
                    <linearGradient id="glass-glare" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
                        <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.0" />
                        <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.0" />
                        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
                    </linearGradient>

                    <!-- Device Edge Gradient -->
                    <linearGradient id="metal-edge" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#222" />
                        <stop offset="10%" stop-color="#555" />
                        <stop offset="50%" stop-color="#111" />
                        <stop offset="90%" stop-color="#333" />
                        <stop offset="100%" stop-color="#000" />
                    </linearGradient>

                    <!-- Clip path for screen content -->
                    <clipPath id="screen-clip">
                        <rect x="345" y="145" width="270" height="630" rx="28" />
                    </clipPath>
                </defs>

                <!-- 1. Background: Deep, dark void -->
                <g id="background">
                    <rect width="100%" height="100%" fill="var(--bg)" />
                    <!-- Subtle ambient light shapes -->
                    <circle cx="650" cy="450" r="350" fill="#151515" filter="url(#blur-bg)" />
                    <circle cx="250" cy="850" r="450" fill="#0a0a0a" filter="url(#blur-bg)" />
                </g>

                <!-- 2. The Smartphone (Centered, Tilted) -->
                <g id="device" transform="translate(0, -20) rotate(-4)">
                    
                    <!-- Phone Body / Chassis (Metal Frame) -->
                    <rect x="335" y="135" width="280" height="640" rx="36" fill="url(#metal-edge)" />
                    
                    <!-- Screen Base (Black) -->
                    <rect x="345" y="145" width="270" height="630" rx="28" fill="#050505" />

                    <!-- Screen Content (Clipped) -->
                    <g clip-path="url(#screen-clip)">
                        <!-- Background Grid for Tech feel -->
                        <path d="M345,245 L615,245 M345,345 L615,345 M345,445 L615,445 M345,545 L615,545" stroke="#222" stroke-width="1" opacity="0.3"/>
                        
                        <!-- Abstract Graph UI (The Red Line) -->
                        <g transform="translate(0, -20)">
                            <path d="M360,380 C400,380 420,300 480,320 S540,200 580,220" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" />
                            <path d="M360,380 C400,380 420,300 480,320 S540,200 580,220" fill="none" stroke="#FF5555" stroke-width="8" opacity="0.2" filter="url(#blur-soft)" />
                            
                            <!-- Data Points -->
                            <circle cx="580" cy="220" r="5" fill="#fff" />
                            <circle cx="580" cy="220" r="16" fill="var(--accent)" opacity="0.4" filter="url(#blur-soft)" />
                            
                            <!-- UI Text Placeholders (Clean, crisp) -->
                            <rect x="370" y="200" width="160" height="4" rx="2" fill="#fff" opacity="0.8" />
                            <rect x="370" y="215" width="80" height="4" rx="2" fill="#666" />
                            
                            <!-- Bottom Dock Area -->
                            <rect x="370" y="680" width="180" height="40" rx="20" fill="#1a1a1a" stroke="#333" stroke-width="1" />
                            <circle cx="410" cy="700" r="12" fill="#333" />
                            <circle cx="460" cy="700" r="12" fill="#333" />
                            <circle cx="510" cy="700" r="12" fill="#333" />
                        </g>
                    </g>

                    <!-- Glass Reflection Layer -->
                    <rect x="345" y="145" width="270" height="630" rx="28" fill="url(#glass-glare)" pointer-events="none" />
                    
                    <!-- Hardware Details -->
                    <!-- Dynamic Island / Notch -->
                    <rect x="435" y="158" width="85" height="26" rx="13" fill="#000" />
                    <circle cx="505" cy="171" r="5" fill="#111" /> <!-- Camera lens -->
                    <circle cx="505" cy="171" r="2" fill="#222" /> <!-- Aperture -->
                    <circle cx="505" cy="171" r="1" fill="#555" /> <!-- Glint -->
                </g>

                <!-- 3. The Hand (Organic, Layered) -->
                <g id="hand-assembly">
                    
                    <!-- A. Palm & Wrist (Background Layer) -->
                    <!-- Organic shape connecting to arm -->
                    <path id="palm" d="M580,750 
                             C600,850 650,950 800,1000 
                             L800,1250 
                             L350,1250 
                             Q450,1050 580,750 Z" 
                          fill="url(#skin-shadow)" />

                    <!-- B. Back Fingers (Wrapping around the right edge) -->
                    <g id="fingers-back">
                        <!-- Index Finger (Top) -->
                        <!-- Note: The path curves over the edge of the phone (x=620) -->
                        <path d="M610,290 
                                 C650,270 710,280 720,330 
                                 C730,380 680,400 640,390 
                                 L610,370 Z" 
                              fill="url(#skin-shadow)" />
                        <!-- Index Finger Joint Lines -->
                        <path d="M650,320 Q670,325 680,340" stroke="#5E3A28" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
                        
                        <!-- Middle Finger (Middle) -->
                        <path d="M610,380 
                                 C660,370 720,390 730,450 
                                 C740,510 680,520 640,500 
                                 L610,480 Z" 
                              fill="url(#skin-shadow)" />
                        <path d="M660,420 Q680,425 690,440" stroke="#5E3A28" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>

                        <!-- Ring Finger (Bottom) -->
                        <path d="M610,470 
                                 C650,460 700,480 710,540 
                                 C720,600 670,610 640,590 
                                 L610,570 Z" 
                              fill="url(#skin-shadow)" />
                        <path d="M650,520 Q670,525 680,540" stroke="#5E3A28" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
                    </g>

                    <!-- C. Foreground Thumb (The Hero) -->
                    <g id="thumb-group">
                        <!-- Thenar Eminence (Fleshy base of thumb) -->
                        <!-- Overlaps the bottom of the screen to show grip depth -->
                        <path d="M590,760 
                                 C630,720 660,650 670,590 
                                 C680,530 710,560 690,620 
                                 C670,680 620,740 590,760 Z" 
                              fill="url(#skin-base)" />
                        
                        <!-- Thumb Proximal Phalanx (Lower Joint) -->
                        <path d="M670,590 
                                 C700,540 730,500 750,470 
                                 C770,440 740,420 720,450 
                                 C700,480 670,520 670,590 Z" 
                              fill="url(#skin-base)" />
                        
                        <!-- Thumb Distal Phalanx (Tip) -->
                        <path d="M750,470 
                                 C780,440 800,420 790,390 
                                 C780,360 750,370 730,400 
                                 C710,430 720,440 750,470 Z" 
                              fill="url(#skin-base)" />

                        <!-- Nail Bed (Anatomical Detail) -->
                        <path d="M785,405 
                                 C792,395 788,385 778,385 
                                 C770,385 765,395 770,405 Z" 
                              fill="#FCEFE6" opacity="0.6" />
                        <!-- Nail Highlight -->
                        <path d="M782,402 L775,398" stroke="white" stroke-width="1.5" opacity="0.7" stroke-linecap="round" />

                        <!-- Thumb Joint Crease -->
                        <path d="M730,500 C740,490 750,500 760,510" stroke="#7A4F34" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round" />
                        
                        <!-- Skin Texture / Lines -->
                        <path d="M710,470 Q720,460 730,470" stroke="#A66A48" stroke-width="1.5" fill="none" opacity="0.6" />
                        <path d="M690,510 Q700,500 710,510" stroke="#A66A48" stroke-width="1.5" fill="none" opacity="0.6" />
                    </g>

                    <!-- D. Lighting & Shadows (Crucial for Realism) -->
                    
                    <!-- Shadow cast BY thumb ONTO the phone screen -->
                    <!-- Placed visually "on top" of the screen but "under" the thumb tip -->
                    <g id="contact-shadows" style="mix-blend-mode: multiply; opacity: 0.85;" filter="url(#blur-shadow)">
                        <!-- Main shadow blob -->
                        <path d="M710,430 
                                 C730,410 750,420 760,450 
                                 C770,480 740,500 710,480 
                                 C680,460 690,440 710,430 Z" 
                              fill="#000" />
                    </g>

                    <!-- Rim Light / Screen Glow on Thumb -->
                    <!-- The phone screen is glowing, lighting up the side of the thumb facing it -->
                    <path d="M750,470 
                             C780,440 800,420 790,390 
                             C780,360 750,370 730,400 
                             C740,420 760,440 750,470 Z" 
                          fill="#fff" opacity="0.15" style="mix-blend-mode: screen;" filter="url(#blur-soft)" />
                    
                    <!-- Specular Highlight on skin (Top of thumb) -->
                    <path d="M770,440 C780,430 790,430 790,420" stroke="white" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" filter="url(#blur-soft)" />

                </g>
            </svg>
        </div>
    </main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const svgElement = document.querySelector('svg');
        const thumbGroup = document.getElementById('thumb-group');
        const fingersBack = document.getElementById('fingers-back');
        const palm = document.getElementById('palm');
        const device = document.getElementById('device');
        const contactShadows = document.getElementById('contact-shadows');
        
        // Configuration
        const sensitivity = 50; // Lower = more movement
        const thumbSens = 2.2; // Foreground moves most
        const deviceSens = 0.4; // Background moves least
        
        // Initial state
        let targetX = 0;
        let targetY = 0;
        let currentX = 0;
        let currentY = 0;

        // Smooth animation loop
        function animate() {
            // Linear interpolation (Lerp) for smoothness
            currentX += (targetX - currentX) * 0.08;
            currentY += (targetY - currentY) * 0.08;

            // Apply transforms
            // 1. Parallax Rotation (Subtle tilt)
            svgElement.style.transform = `rotateY(${currentX * 0.2}deg) rotateX(${-currentY * 0.2}deg)`;

            // 2. Layered Parallax Translation
            // Thumb moves most (closest to viewer)
            if(thumbGroup) {
                thumbGroup.style.transform = `translate(${currentX * thumbSens}px, ${currentY * thumbSens}px)`;
            }
            
            // Palm moves moderately
            if(palm) {
                palm.style.transform = `translate(${currentX * 1.5}px, ${currentY * 1.5}px)`;
            }

            // Fingers back move slightly less
            if(fingersBack) {
                fingersBack.style.transform = `translate(${currentX * 1.2}px, ${currentY * 1.2}px)`;
            }

            // Device moves least (furthest back)
            if(device) {
                // Note: Keep the initial -4deg rotation
                device.style.transform = `translate(${currentX * deviceSens}px, ${currentY * deviceSens}px) rotate(-4deg)`;
            }

            // 3. Dynamic Shadow Adjustment (Simulates changing distance/angle)
            // As thumb moves closer (right/down), shadow gets sharper/darker
            if(contactShadows) {
                // Calculate distance from center to determine "pressure"
                const dist = Math.sqrt(currentX*currentX + currentY*currentY);
                const blurVal = 5 - (dist / 15); // Closer = less blur
                const opacityVal = 0.85 + (dist / 100); // Closer = darker
                
                contactShadows.style.filter = `blur(${Math.max(1, blurVal)}px)`;
                contactShadows.style.opacity = Math.min(0.95, opacityVal);
            }

            requestAnimationFrame(animate);
        }

        document.addEventListener('mousemove', (e) => {
            // Calculate center relative position
            const x = (window.innerWidth / 2 - e.pageX); 
            const y = (window.innerHeight / 2 - e.pageY);

            targetX = x / sensitivity;
            targetY = y / sensitivity;
        });

        // Start loop
        animate();
    });
</script>
</body>
</html>
