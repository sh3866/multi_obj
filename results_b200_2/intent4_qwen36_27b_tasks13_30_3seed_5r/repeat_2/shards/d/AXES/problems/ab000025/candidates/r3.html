<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fig. 02: The Grip | Editorial Revision</title>
<style>
    :root {
        --bg: #080808;
        --text-primary: #F0F0F0;
        --text-secondary: #888888;
        --accent: #FF3B30;
        --font-ui: "Helvetica Neue", "Arial", sans-serif;
        --font-tech: "Courier New", "Menlo", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg);
        color: var(--text-primary);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1500px;
    }

    /* High-End Grain & Vignette Overlay */
    .overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 100;
    }

    .grain {
        position: absolute;
        top: -50%; left: -50%; width: 200%; height: 200%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
        opacity: 0.5;
        animation: grainAnim 0.5s steps(10) infinite;
    }

    @keyframes grainAnim {
        0%, 100% { transform: translate(0,0); }
        10% { transform: translate(-5%,-10%); }
        20% { transform: translate(-15%,5%); }
        30% { transform: translate(7%,-25%); }
        40% { transform: translate(-5%,25%); }
        50% { transform: translate(-15%,10%); }
        60% { transform: translate(15%,0%); }
        70% { transform: translate(0%,15%); }
        80% { transform: translate(3%,35%); }
        90% { transform: translate(-10%,10%); }
    }

    /* UI Layout: Editorial Frame */
    header {
        position: absolute;
        top: 2.5rem;
        left: 3rem;
        z-index: 50;
        mix-blend-mode: exclusion;
    }

    .label-top {
        font-family: var(--font-tech);
        font-size: 0.65rem;
        letter-spacing: 0.05em;
        color: var(--text-primary);
        opacity: 0.6;
        margin-bottom: 0.5rem;
    }

    .label-title {
        font-size: 1rem;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: var(--text-primary);
    }

    .meta-data {
        position: absolute;
        top: 2.5rem;
        right: 3rem;
        text-align: right;
        z-index: 50;
        mix-blend-mode: exclusion;
    }

    .meta-item {
        font-family: var(--font-tech);
        font-size: 0.6rem;
        color: var(--text-secondary);
        line-height: 1.4;
        letter-spacing: 0.05em;
    }

    .meta-accent {
        color: var(--accent);
    }

    /* The Stage */
    main {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    .scene-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        transform-style: preserve-3d;
    }

    svg {
        height: 110vh;
        width: auto;
        max-width: 100%;
        filter: drop-shadow(0 25px 60px rgba(0,0,0,0.8));
        will-change: transform;
    }

    /* Bottom Info */
    .footer-info {
        position: absolute;
        bottom: 3rem;
        left: 3rem;
        z-index: 50;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        mix-blend-mode: exclusion;
    }

    .big-label {
        font-size: 0.85rem;
        font-weight: 300;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
        max-width: 200px;
        line-height: 1.4;
    }

    .big-label span {
        color: var(--text-primary);
        font-weight: 500;
    }

</style>
</head>
<body>

    <!-- Visual Overlays -->
    <div class="overlay">
        <div class="grain"></div>
    </div>

    <!-- UI Frame -->
    <header>
        <div class="label-top">FIG. 02</div>
        <div class="label-title">Tactile Interface</div>
    </header>

    <div class="meta-data">
        <div class="meta-item">MACRO 105MM</div>
        <div class="meta-item">F/1.2 • 1/1000S</div>
        <div class="meta-item meta-accent">REC ●</div>
    </div>

    <main>
        <div class="footer-info">
            <div class="big-label">
                <span>Subject:</span> Biological Grip<br>
                <span>Object:</span> Glass / Metal
            </div>
        </div>

        <div class="scene-container">
            <!-- SVG Illustration -->
            <svg viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
                <defs>
                    <!-- Filters for Depth of Field -->
                    <filter id="blur-bg" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="12" />
                    </filter>
                    <filter id="blur-hand" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="0.8" />
                    </filter>
                    
                    <!-- Skin Gradients (Warm, realistic subsurface) -->
                    <linearGradient id="skin-tone-light" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FAD6B1" />
                        <stop offset="40%" stop-color="#E0A984" />
                        <stop offset="80%" stop-color="#A66A48" />
                        <stop offset="100%" stop-color="#6D3B26" />
                    </linearGradient>

                    <linearGradient id="skin-tone-dark" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#D49A82" />
                        <stop offset="50%" stop-color="#8B5A2B" />
                        <stop offset="100%" stop-color="#4A2A16" />
                    </linearGradient>

                    <!-- Screen Glow Gradient -->
                    <radialGradient id="screen-glow" cx="50%" cy="50%" r="70%">
                        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
                        <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0" />
                        <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
                    </radialGradient>

                    <!-- Glass Reflection -->
                    <linearGradient id="glass-glare" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
                        <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.0" />
                        <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.0" />
                        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
                    </linearGradient>

                    <linearGradient id="metal-edge" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#1a1a1a" />
                        <stop offset="20%" stop-color="#444" />
                        <stop offset="50%" stop-color="#111" />
                        <stop offset="100%" stop-color="#000" />
                    </linearGradient>

                    <!-- Clip path for screen content -->
                    <clipPath id="screen-clip">
                        <rect x="350" y="150" width="260" height="620" rx="24" />
                    </clipPath>
                </defs>

                <!-- 1. Background: Deep, dark void with subtle context -->
                <g id="background">
                    <rect width="100%" height="100%" fill="#080808" />
                    <!-- Abstract light source shape -->
                    <circle cx="600" cy="400" r="300" fill="#111" filter="url(#blur-bg)" />
                    <circle cx="300" cy="900" r="400" fill="#0a0a0a" filter="url(#blur-bg)" />
                </g>

                <!-- 2. The Smartphone (Centered, Tilted) -->
                <g id="device" transform="translate(0, -20) rotate(-5)">
                    
                    <!-- Phone Body / Chassis -->
                    <rect x="340" y="140" width="280" height="640" rx="32" fill="#050505" stroke="#222" stroke-width="1" />
                    
                    <!-- Screen Base (Black) -->
                    <rect x="350" y="150" width="260" height="620" rx="24" fill="#000" />

                    <!-- Screen Content (Clipped) -->
                    <g clip-path="url(#screen-clip)">
                        <!-- Abstract Graph UI -->
                        <rect x="380" y="220" width="190" height="180" fill="#0a0a0a" rx="12" />
                        
                        <!-- The Red Graph Line -->
                        <path d="M390,350 Q450,280 500,320 T560,250" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" />
                        
                        <!-- Data Points -->
                        <circle cx="560" cy="250" r="4" fill="#fff" />
                        <circle cx="560" cy="250" r="12" fill="var(--accent)" opacity="0.3" />
                        
                        <!-- UI Text Placeholders -->
                        <rect x="380" y="440" width="140" height="8" rx="4" fill="#333" />
                        <rect x="380" y="460" width="100" height="6" rx="3" fill="#222" />
                        <rect x="380" y="475" width="120" height="6" rx="3" fill="#222" />
                        
                        <!-- Bottom Dock -->
                        <rect x="380" y="680" width="190" height="40" rx="20" fill="#1a1a1a" />
                        <circle cx="420" cy="700" r="10" fill="#333" />
                        <circle cx="460" cy="700" r="10" fill="#333" />
                        <circle cx="500" cy="700" r="10" fill="#333" />
                    </g>

                    <!-- Glass Reflection Layer -->
                    <rect x="350" y="150" width="260" height="620" rx="24" fill="url(#glass-glare)" pointer-events="none" />
                    
                    <!-- Hardware Details -->
                    <!-- Dynamic Island -->
                    <rect x="440" y="160" width="80" height="24" rx="12" fill="#000" />
                    <circle cx="505" cy="172" r="4" fill="#111" /> <!-- Camera lens -->
                    <circle cx="505" cy="172" r="1.5" fill="#333" /> <!-- Aperture -->
                </g>

                <!-- 3. The Hand (Organic, Layered) -->
                <g id="hand-assembly" filter="url(#blur-hand)">
                    
                    <!-- A. Back Fingers (Wrapping around the right edge) -->
                    <g id="fingers-back" transform="translate(10, 10)">
                        <!-- Index Finger -->
                        <path d="M620,300 C680,280 720,320 710,360 C700,390 660,390 640,370 L620,360 Z" fill="url(#skin-tone-dark)" />
                        <!-- Middle Finger -->
                        <path d="M620,390 C690,380 730,420 720,470 C710,510 660,510 640,490 L620,470 Z" fill="url(#skin-tone-dark)" />
                        <!-- Ring Finger -->
                        <path d="M620,480 C680,470 710,510 700,560 C690,600 650,600 640,580 L620,560 Z" fill="url(#skin-tone-dark)" />
                        
                        <!-- Finger Joints (Subtle lines) -->
                        <path d="M660,330 C670,335 675,345 665,355" stroke="#5E3A18" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
                        <path d="M670,430 C680,435 685,445 675,455" stroke="#5E3A18" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
                        <path d="M660,530 C670,535 675,545 665,555" stroke="#5E3A18" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
                    </g>

                    <!-- B. Palm & Wrist (Bottom Right) -->
                    <path id="palm" d="M600,800 Q650,950 800,1000 L800,1200 L400,1200 Q450,1000 600,800 Z" fill="url(#skin-tone-dark)" />

                    <!-- C. Foreground Thumb (The Hero) -->
                    <g id="thumb-group">
                        <!-- Thenar Eminence (Fleshy base) -->
                        <path d="M580,750 C620,700 650,650 660,600 C680,550 700,580 680,630 C660,680 620,740 580,750 Z" fill="url(#skin-tone-light)" />
                        
                        <!-- Thumb Proximal Phalanx (Lower Joint) -->
                        <path d="M660,600 C690,550 720,510 740,480 C760,450 730,430 710,460 C690,490 660,530 660,600 Z" fill="url(#skin-tone-light)" />
                        
                        <!-- Thumb Distal Phalanx (Tip) -->
                        <path d="M740,480 C770,450 790,430 780,400 C770,370 740,380 720,410 C700,440 710,450 740,480 Z" fill="url(#skin-tone-light)" />

                        <!-- Nail Bed -->
                        <path d="M785,415 C790,405 785,395 775,395 C770,395 765,405 770,415 Z" fill="#FCEFE6" opacity="0.7" />
                        <path d="M782,412 L775,408" stroke="white" stroke-width="1" opacity="0.6" /> <!-- Highlight -->

                        <!-- Thumb Joint Crease -->
                        <path d="M720,510 C730,500 740,510 750,520" stroke="#7A4F34" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round" />
                        
                        <!-- Skin Texture / Lines (Knuckles) -->
                        <path d="M700,480 Q710,470 720,480" stroke="#A66A48" stroke-width="1" fill="none" opacity="0.5" />
                        <path d="M680,520 Q690,510 700,520" stroke="#A66A48" stroke-width="1" fill="none" opacity="0.5" />
                    </g>

                    <!-- D. Lighting & Shadows (Crucial for Realism) -->
                    
                    <!-- Shadow cast BY thumb ONTO the phone screen -->
                    <!-- Note: This is placed visually "on top" of the screen but "under" the thumb tip -->
                    <g id="contact-shadows" style="mix-blend-mode: multiply; opacity: 0.8;">
                        <path d="M700,420 C720,400 740,410 750,440 C760,470 730,490 700,470 C670,450 680,430 700,420 Z" 
                              fill="#000" filter="url(#blur-hand)" />
                    </g>

                    <!-- Rim Light / Screen Glow on Thumb -->
                    <!-- The phone screen is glowing, lighting up the side of the thumb facing it -->
                    <path d="M740,480 C770,450 790,430 780,400 C770,370 740,380 720,410 C730,430 750,450 740,480 Z" 
                          fill="#fff" opacity="0.15" style="mix-blend-mode: screen;" filter="url(#blur-hand)" />
                    
                    <!-- Specular Highlight on skin (Top of thumb) -->
                    <path d="M760,430 C770,420 780,420 780,410" stroke="white" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round" />

                </g>
            </svg>
        </div>
    </main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const svgElement = document.querySelector('svg');
        const thumbGroup = document.getElementById('thumb-group');
        const fingersBack = document.getElementById('fingers-back');
        const palm = document.getElementById('palm');
        const device = document.getElementById('device');
        const contactShadows = document.getElementById('contact-shadows');
        
        // Configuration
        const sensitivity = 40; // Lower = more movement
        const thumbSens = 1.8;
        const deviceSens = 0.5;
        
        // Initial state
        let targetX = 0;
        let targetY = 0;
        let currentX = 0;
        let currentY = 0;

        // Smooth animation loop
        function animate() {
            // Linear interpolation for smoothness
            currentX += (targetX - currentX) * 0.1;
            currentY += (targetY - currentY) * 0.1;

            // Apply transforms
            // 1. Parallax Rotation
            svgElement.style.transform = `rotateY(${currentX * 0.5}deg) rotateX(${-currentY * 0.5}deg)`;

            // 2. Layered Parallax Translation
            // Thumb moves most (closest)
            if(thumbGroup) {
                thumbGroup.style.transform = `translate(${currentX * thumbSens}px, ${currentY * thumbSens}px)`;
            }
            
            // Palm moves moderately
            if(palm) {
                palm.style.transform = `translate(${currentX * 1.2}px, ${currentY * 1.2}px)`;
            }

            // Fingers back move slightly less
            if(fingersBack) {
                fingersBack.style.transform = `translate(${currentX * 1.0}px, ${currentY * 1.0}px)`;
            }

            // Device moves least (furthest back)
            if(device) {
                device.style.transform = `translate(${currentX * deviceSens}px, ${currentY * deviceSens}px) rotate(-5deg)`;
            }

            // 3. Dynamic Shadow Adjustment (Simulates changing distance)
            // As thumb moves closer (right/down), shadow gets sharper/darker
            if(contactShadows) {
                const blurVal = 3 - (Math.abs(currentX) / 20);
                const opacityVal = 0.8 - (Math.abs(currentX) / 100);
                contactShadows.style.filter = `blur(${Math.max(0, blurVal)}px)`;
                contactShadows.style.opacity = Math.max(0.2, opacityVal);
            }

            requestAnimationFrame(animate);
        }

        document.addEventListener('mousemove', (e) => {
            // Calculate center relative position
            const x = (window.innerWidth / 2 - e.pageX); 
            const y = (window.innerHeight / 2 - e.pageY);

            targetX = x / sensitivity;
            targetY = y / sensitivity;
        });

        // Start loop
        animate();
    });
</script>
</body>
</html>
