<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Play with Tiles</title>
<style>
  :root {
    /* Palette: Premium Board Game Identity */
    --bg-wood: #2c1e18;
    --bg-wood-dark: #1a110e;
    --felt-primary: #355e48;
    --felt-secondary: #254434;
    --felt-highlight: #4a7a62;
    
    --tile-cream: #fdfbf7;
    --tile-side: #e3dfd6;
    --tile-depth: #bbaea0;
    --pip-black: #1c1c1c;
    
    --ui-gold: #ffd700;
    --ui-gold-dim: #b89b00;
    --ui-red: #c62828;
    --ui-blue: #0277bd;
    
    --shadow-heavy: 0 15px 35px rgba(0,0,0,0.5);
    --shadow-tile: 0 4px 8px rgba(0,0,0,0.3);
    
    --font-display: 'Georgia', 'Times New Roman', serif;
    --font-ui: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

  body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: var(--bg-wood);
    background-image: 
      radial-gradient(circle at 50% 30%, #4a3b32 0%, var(--bg-wood-dark) 90%),
      repeating-linear-gradient(45deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 2px, transparent 2px, transparent 8px);
    font-family: var(--font-ui);
    color: #fff;
    display: flex;
    flex-direction: column;
  }

  /* --- The Tabletop --- */
  #tabletop {
    position: relative;
    flex: 1;
    margin: 20px;
    border-radius: 60px;
    box-shadow: 
      inset 0 0 0 10px #1a110e, /* Dark rim */
      inset 0 0 60px rgba(0,0,0,0.8), /* Vignette */
      0 20px 50px rgba(0,0,0,0.6); /* Drop shadow on floor */
    background: radial-gradient(ellipse at center, var(--felt-primary) 0%, var(--felt-secondary) 85%);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Felt Texture Overlay */
  #tabletop::before {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: overlay;
  }

  /* --- UI Header --- */
  header {
    position: absolute;
    top: 0; left: 0; width: 100%;
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 20;
    background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent);
  }

  .brand {
    font-family: var(--font-display);
    font-size: 1.5rem;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    gap: 10px;
    font-style: italic;
  }

  .score-pill {
    display: flex;
    gap: 15px;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(5px);
    padding: 8px 20px;
    border-radius: 30px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }

  .score-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 40px;
  }
  .score-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; }
  .score-val { font-size: 1.2rem; font-weight: bold; font-family: var(--font-display); color: #fff; }
  
  .active-turn .score-val { color: var(--ui-gold); text-shadow: 0 0 10px var(--ui-gold-dim); }
  .active-turn::after {
    content: ''; display: block; width: 6px; height: 6px; background: var(--ui-gold);
    border-radius: 50%; margin-top: 4px; box-shadow: 0 0 8px var(--ui-gold);
  }

  /* --- Match Cue (Rule/Value) --- */
  #match-cue {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    color: var(--ui-gold);
    padding: 8px 24px;
    border-radius: 20px;
    font-size: 0.9rem;
    font-weight: 600;
    border: 1px solid rgba(255, 215, 0, 0.3);
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    opacity: 0;
    transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events: none;
    z-index: 20;
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  #match-cue.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* --- Board Area (The Chain) --- */
  #board-viewport {
    position: relative;
    flex: 1;
    width: 100%;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1200px;
  }

  #board-chain {
    display: flex;
    align-items: center;
    padding: 100px; /* Large buffer for scrolling */
    transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    /* Slight tilt for 3D perspective */
    transform: rotateX(15deg) scale(1);
    transform-origin: center center;
  }

  /* --- Player Zone --- */
  #player-zone {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 180px;
    background: linear-gradient(to top, rgba(20,20,20,0.95) 0%, rgba(20,20,20,0.6) 60%, transparent 100%);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 40px 30px 40px;
    z-index: 30;
  }

  /* Action Buttons */
  .action-cluster {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 80px;
    margin-bottom: 10px;
  }

  .action-btn {
    border: none;
    border-radius: 8px;
    font-weight: 800;
    font-size: 0.75rem;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.1s ease;
    letter-spacing: 1px;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    position: relative;
  }
  
  .action-btn:active { transform: translateY(2px); box-shadow: 0 1px 2px rgba(0,0,0,0.5) !important; }
  .action-btn:disabled { filter: grayscale(1) brightness(0.6); cursor: not-allowed; transform: none; }

  /* Wood Button */
  #draw-btn {
    background: repeating-linear-gradient(90deg, #5d4037, #5d4037 2px, #3e2723 2px, #3e2723 4px);
    box-shadow: 0 4px 0 #281815, 0 6px 10px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 12px 0;
  }

  /* Stone Button */
  #pass-btn {
    background: linear-gradient(to bottom, #546e7a, #37474f);
    box-shadow: 0 4px 0 #263238, 0 6px 10px rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 12px 0;
  }

  /* --- Tile Rack --- */
  #hand-container {
    display: flex;
    justify-content: center;
    flex: 1;
    padding: 0 20px;
    perspective: 800px;
    align-items: flex-end;
    gap: 6px; /* Tighter gap */
  }

  /* --- Domino Component (High Fidelity) --- */
  .tile {
    width: 50px;
    height: 100px;
    position: relative;
    cursor: pointer;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
    transform-origin: bottom center;
    z-index: 1;
  }

  /* 3D Extrusion Layers */
  .tile-body {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: var(--tile-depth);
    border-radius: 6px;
    box-shadow: 4px 6px 10px rgba(0,0,0,0.4);
    transform: translateZ(0);
  }

  /* The Top Face */
  .tile-inner {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    border-radius: 6px;
    background: var(--tile-cream);
    /* Bevel Effect */
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5), inset 0 0 10px rgba(0,0,0,0.05);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 2;
  }

  /* Divider Line */
  .tile-inner::before {
    content: '';
    position: absolute;
    top: 50%; left: 6px; right: 6px;
    height: 1px;
    background: rgba(0,0,0,0.15);
    box-shadow: 0 1px 0 rgba(255,255,255,0.8);
    transform: translateY(-50%);
    z-index: 5;
  }

  .tile-half {
    flex: 1;
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 5px;
  }

  /* Pips (Ink Dots) */
  .pip {
    background: var(--pip-black);
    border-radius: 50%;
    width: 9px;
    height: 9px;
    align-self: center;
    justify-self: center;
    /* Indented look */
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.8), inset 0 -1px 1px rgba(255,255,255,0.1);
  }

  /* Interaction States */
  .tile:hover {
    transform: translateY(-25px) scale(1.08);
    z-index: 100;
  }
  
  .tile.disabled {
    filter: brightness(0.85) grayscale(0.6);
    cursor: default;
    transform: translateY(10px) scale(0.95);
    z-index: 0;
  }
  .tile.disabled:hover { transform: translateY(10px) scale(0.95); }

  /* --- Board Tiles (Horizontal Layout) --- */
  .tile.board-tile {
    width: 100px;
    height: 50px;
    transform: none; /* Reset hover translation for board */
    margin: 0 2px;
  }

  .tile.board-tile .tile-body {
    box-shadow: 2px 4px 6px rgba(0,0,0,0.3);
  }

  .tile.board-tile .tile-inner {
    flex-direction: row;
  }
  .tile.board-tile .tile-inner::before {
    width: 1px; height: 85%;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }

  /* Doubles on board (Vertical) */
  .tile.board-tile.is-double {
    width: 50px;
    height: 100px;
    flex-direction: column;
    margin: 0 8px;
  }
  .tile.board-tile.is-double .tile-inner {
    flex-direction: column;
  }
  .tile.board-tile.is-double .tile-inner::before {
    width: 85%; height: 1px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }

  /* --- Drop Zones (Ghost Tiles) --- */
  .drop-zone {
    width: 50px;
    height: 100px;
    border: 2px dashed rgba(255, 215, 0, 0.4);
    border-radius: 8px;
    background: rgba(255, 215, 0, 0.05);
    margin: 0 10px;
    animation: pulse 2s infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255, 215, 0, 0.6);
    font-size: 0.8rem;
    font-weight: bold;
    text-transform: uppercase;
    pointer-events: none;
  }
  
  .drop-zone.horizontal {
    width: 100px;
    height: 50px;
  }

  @keyframes pulse {
    0% { opacity: 0.4; transform: scale(0.95); }
    50% { opacity: 0.8; transform: scale(1.05); }
    100% { opacity: 0.4; transform: scale(0.95); }
  }

  /* Pip Positioning Grid (1-9) */
  .pip:nth-child(1) { grid-area: 1 / 1; } 
  .pip:nth-child(2) { grid-area: 1 / 3; } 
  .pip:nth-child(3) { grid-area: 2 / 2; } 
  .pip:nth-child(4) { grid-area: 3 / 1; } 
  .pip:nth-child(5) { grid-area: 3 / 3; } 
  .pip:nth-child(6) { grid-area: 2 / 1; } 
  .pip:nth-child(7) { grid-area: 2 / 3; }
  
  .p-hidden { display: none; }

  /* SVG Icons */
  .icon { width: 18px; height: 18px; fill: currentColor; }

</style>
</head>
<body>

<div id="tabletop">
  <header>
    <div class="brand">
      <!-- Stylized Domino Icon -->
      <svg class="icon" viewBox="0 0 24 24" style="fill:var(--ui-gold); width: 28px; height: 28px;">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 9h-2V7h-2v5H6v2h2v5h2v-5h2v-2z"/>
      </svg>
      Play with Tiles
    </div>
    <div class="score-pill">
      <div class="score-item" id="score-block-player">
        <span class="score-label">You</span>
        <span class="score-val" id="score-player">0</span>
      </div>
      <div class="score-item" id="score-block-opp">
        <span class="score-label">Opp</span>
        <span class="score-val" id="score-opp">0</span>
      </div>
    </div>
  </header>

  <div id="match-cue">Match: 6 or 2</div>

  <div id="board-viewport">
    <div id="board-chain">
      <!-- Chain renders here -->
    </div>
  </div>

  <div id="player-zone">
    <div class="action-cluster">
      <button class="action-btn" id="draw-btn">
        <svg class="icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
        Draw
      </button>
      <button class="action-btn" id="pass-btn" disabled>
        Pass
      </button>
    </div>
    
    <div id="hand-container">
      <!-- Hand renders here -->
    </div>
    
    <!-- Spacer for balance -->
    <div style="width: 80px;"></div> 
  </div>
</div>

<script>
  /**
   * DOMINO GAME ENGINE
   */

  class Tile {
    constructor(v1, v2, id) {
      this.v1 = v1;
      this.v2 = v2;
      this.id = id;
      this.isDouble = v1 === v2;
    }
  }

  const GameState = {
    deck: [],
    board: [], 
    playerHand: [],
    opponentHand: [],
    turn: 'player',
    ends: { left: null, right: null },
    scores: { player: 0, opponent: 0 }
  };

  // Grid positions 1-9 (3x3)
  const pipMap = {
    0: [],
    1: [5],
    2: [3, 7],
    3: [3, 5, 7],
    4: [1, 3, 7, 9],
    5: [1, 3, 5, 7, 9],
    6: [1, 3, 4, 6, 7, 9]
  };

  function initGame() {
    // Generate Deck
    let idCounter = 0;
    for (let i = 0; i <= 6; i++) {
      for (let j = i; j <= 6; j++) {
        GameState.deck.push(new Tile(i, j, idCounter++));
      }
    }
    
    // Shuffle
    GameState.deck.sort(() => Math.random() - 0.5);

    // Deal
    GameState.playerHand = GameState.deck.splice(0, 7);
    GameState.opponentHand = GameState.deck.splice(0, 7);

    // Start Game
    updateUI();
    checkTurn();
  }

  // --- Rendering ---

  function createTileElement(tile, isBoard = false) {
    const el = document.createElement('div');
    el.className = `tile ${isBoard ? 'board-tile' : ''}`;
    if (isBoard && tile.isDouble) el.classList.add('is-double');
    el.dataset.id = tile.id;

    // 3D Body
    const body = document.createElement('div');
    body.className = 'tile-body';
    el.appendChild(body);

    const inner = document.createElement('div');
    inner.className = 'tile-inner';

    const halves = [tile.v1, tile.v2];
    
    halves.forEach(val => {
      const half = document.createElement('div');
      half.className = 'tile-half';
      
      // Create 9 slots, fill active ones
      for(let i=1; i<=9; i++) {
        const pip = document.createElement('div');
        pip.className = 'pip';
        if(!pipMap[val].includes(i)) {
          pip.classList.add('p-hidden');
        }
        half.appendChild(pip);
      }
      inner.appendChild(half);
    });
    
    el.appendChild(inner);
    return el;
  }

  function renderHand() {
    const container = document.getElementById('hand-container');
    container.innerHTML = '';

    GameState.playerHand.forEach(tile => {
      const el = createTileElement(tile);
      const isValid = isValidMove(tile);
      
      if (!isValid && GameState.turn === 'player') {
        el.classList.add('disabled');
      } else {
        el.addEventListener('click', () => {
          if (GameState.turn === 'player') playTile(tile);
        });
      }
      container.appendChild(el);
    });
  }

  function renderBoard() {
    const container = document.getElementById('board-chain');
    container.innerHTML = '';

    // Add Left Drop Zone
    if (GameState.board.length > 0) {
      const leftZone = document.createElement('div');
      leftZone.className = `drop-zone ${GameState.ends.left === GameState.ends.right ? '' : 'horizontal'}`;
      leftZone.innerText = GameState.ends.left;
      container.appendChild(leftZone);
    }

    GameState.board.forEach(item => {
      const el = createTileElement(item.tile, true);
      
      // Handle visual orientation (swapping halves)
      const inner = el.querySelector('.tile-inner');
      if (item.orientation === 1 && !item.tile.isDouble) {
        // Flex reverse for board tiles
        inner.style.flexDirection = 'row-reverse';
      }
      
      container.appendChild(el);
    });

    // Add Right Drop Zone
    if (GameState.board.length > 0) {
      const rightZone = document.createElement('div');
      rightZone.className = `drop-zone ${GameState.ends.left === GameState.ends.right ? '' : 'horizontal'}`;
      rightZone.innerText = GameState.ends.right;
      container.appendChild(rightZone);
    }

    // Auto-scroll logic (center the board roughly)
    setTimeout(() => {
        const boardWidth = container.scrollWidth;
        const viewWidth = container.parentElement.clientWidth;
        if (boardWidth > viewWidth) {
            // Center the content
            container.style.transform = `rotateX(15deg) translateX(-${(boardWidth - viewWidth) / 2}px)`;
        } else {
            container.style.transform = `rotateX(15deg) translateX(0)`;
        }
    }, 50);

    updateMatchCue();
  }

  function updateUI() {
    renderHand();
    renderBoard();
    document.getElementById('score-player').innerText = GameState.scores.player;
    document.getElementById('score-opp').innerText = GameState.scores.opponent;
    
    // Turn Indicator
    const pBlock = document.getElementById('score-block-player');
    const oBlock = document.getElementById('score-block-opp');
    if(GameState.turn === 'player') {
        pBlock.classList.add('active-turn');
        oBlock.classList.remove('active-turn');
    } else {
        pBlock.classList.remove('active-turn');
        oBlock.classList.add('active-turn');
    }

    const drawBtn = document.getElementById('draw-btn');
    const passBtn = document.getElementById('pass-btn');

    // Update Controls
    if (GameState.turn === 'player') {
      drawBtn.disabled = GameState.deck.length === 0;
      passBtn.disabled = !canDrawOrPlay(); 
      
      // Visual feedback for empty deck
      if(GameState.deck.length === 0) {
          drawBtn.style.opacity = '0.5';
      } else {
          drawBtn.style.opacity = '1';
      }
    } else {
      drawBtn.disabled = true;
      passBtn.disabled = true;
      drawBtn.style.opacity = '0.5';
    }
  }

  function updateMatchCue() {
    const cue = document.getElementById('match-cue');
    if (GameState.board.length === 0) {
      cue.classList.remove('visible');
      return;
    }
    
    let leftVal = GameState.ends.left;
    let rightVal = GameState.ends.right;
    
    if (leftVal === rightVal) {
      cue.innerText = `Match: ${leftVal}`;
    } else {
      cue.innerText = `Match: ${leftVal} or ${rightVal}`;
    }
    cue.classList.add('visible');
  }

  // --- Game Logic ---

  function isValidMove(tile) {
    if (GameState.board.length === 0) return true;
    const { left, right } = GameState.ends;
    if (tile.v1 === left || tile.v2 === left) return true;
    if (tile.v1 === right || tile.v2 === right) return true;
    return false;
  }

  function canDrawOrPlay() {
    if (GameState.deck.length > 0) return false;
    return !GameState.playerHand.some(t => isValidMove(t));
  }

  function playTile(tile) {
    GameState.playerHand = GameState.playerHand.filter(t => t.id !== tile.id);

    if (GameState.board.length === 0) {
      GameState.board.push({ tile: tile, orientation: 0 });
      GameState.ends = { left: tile.v1, right: tile.v2 };
    } else {
      const { left, right } = GameState.ends;
      
      // Logic: Try to play on Right, then Left
      // Note: In a real game, user picks side. Here we auto-resolve for simplicity.
      
      if (tile.v1 === right || tile.v2 === right) {
        // Play Right
        if (tile.v1 === right) {
          GameState.board.push({ tile: tile, orientation: 0 }); // [v1|v2] matches [right]
          GameState.ends.right = tile.v2;
        } else {
          GameState.board.push({ tile: tile, orientation: 1 }); // [v2|v1] matches [right]
          GameState.ends.right = tile.v1;
        }
      } else if (tile.v1 === left || tile.v2 === left) {
        // Play Left
        if (tile.v2 === left) {
          GameState.board.unshift({ tile: tile, orientation: 0 }); // [v1|v2] matches [left]
          GameState.ends.left = tile.v1;
        } else {
          GameState.board.unshift({ tile: tile, orientation: 1 }); // [v2|v1] matches [left]
          GameState.ends.left = tile.v2;
        }
      }
    }

    GameState.turn = 'opponent';
    updateUI();
    setTimeout(aiTurn, 1000);
  }

  function drawTile() {
    if (GameState.deck.length > 0 && GameState.turn === 'player') {
      const tile = GameState.deck.pop();
      GameState.playerHand.push(tile);
      updateUI();
    }
  }

  function passTurn() {
    if (GameState.turn === 'player' && canDrawOrPlay()) {
      GameState.turn = 'opponent';
      updateUI();
      setTimeout(aiTurn, 1000);
    }
  }

  function checkTurn() {
    // Check if game over
    if (GameState.playerHand.length === 0) {
      // Simple win condition visual
      document.getElementById('match-cue').innerText = "You Win!";
      document.getElementById('match-cue').classList.add('visible');
      // Reset after delay
      setTimeout(() => resetGame(), 3000);
    } else if (GameState.opponentHand.length === 0) {
      document.getElementById('match-cue').innerText = "Opponent Wins!";
      document.getElementById('match-cue').classList.add('visible');
      setTimeout(() => resetGame(), 3000);
    }
  }

  function aiTurn() {
    const validTiles = GameState.opponentHand.filter(t => isValidMove(t));

    if (validTiles.length > 0) {
      const tileToPlay = validTiles[0];
      GameState.opponentHand = GameState.opponentHand.filter(t => t.id !== tileToPlay.id);
      
      if (GameState.board.length === 0) {
        GameState.board.push({ tile: tileToPlay, orientation: 0 });
        GameState.ends = { left: tileToPlay.v1, right: tileToPlay.v2 };
      } else {
        const { left, right } = GameState.ends;
        // AI Logic: Play right if possible, else left
        if (tileToPlay.v1 === right || tileToPlay.v2 === right) {
           if (tileToPlay.v1 === right) {
            GameState.board.push({ tile: tileToPlay, orientation: 0 });
            GameState.ends.right = tileToPlay.v2;
          } else {
            GameState.board.push({ tile: tileToPlay, orientation: 1 });
            GameState.ends.right = tileToPlay.v1;
          }
        } else {
           if (tileToPlay.v2 === left) {
            GameState.board.unshift({ tile: tileToPlay, orientation: 0 });
            GameState.ends.left = tileToPlay.v1;
          } else {
            GameState.board.unshift({ tile: tileToPlay, orientation: 1 });
            GameState.ends.left = tileToPlay.v2;
          }
        }
      }
    } else if (GameState.deck.length > 0) {
      GameState.opponentHand.push(GameState.deck.pop());
    } else {
        // Pass
    }

    checkTurn();
    GameState.turn = 'player';
    updateUI();
  }

  function resetGame() {
    GameState.board = [];
    GameState.deck = [];
    GameState.playerHand = [];
    GameState.opponentHand = [];
    GameState.ends = { left: null, right: null };
    initGame();
  }

  document.getElementById('draw-btn').addEventListener('click', drawTile);
  document.getElementById('pass-btn').addEventListener('click', passTurn);

  initGame();

</script>
</body>
