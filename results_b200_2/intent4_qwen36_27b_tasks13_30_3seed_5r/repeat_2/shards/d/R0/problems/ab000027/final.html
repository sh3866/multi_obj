<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trifolium pratense | Botanical Study</title>
<style>
  :root {
    --bg-color: #F4F5F0; /* Stone paper */
    --ink-color: #2C2C2C; /* Soft black */
    --accent-red: #A63737; /* Muted red for stamps/notes */
    --grid-color: #E0E2D9;
    
    /* Palette for the Clover */
    --c-stem-base: #4A6B4A;
    --c-stem-light: #6B8E6B;
    --c-leaf-dark: #355E35;
    --c-leaf-mid: #5C8A5C;
    --c-leaf-light: #8FB38F;
    --c-leaf-highlight: #C5D9C5;
    --c-vein: #2A452A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-color);
    color: var(--ink-color);
    font-family: 'Georgia', 'Times New Roman', serif;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* Background Texture */
  .texture-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: radial-gradient(var(--grid-color) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.6;
    pointer-events: none;
    z-index: 0;
  }

  /* Main Container */
  .specimen-frame {
    position: relative;
    width: 90vmin;
    height: 90vmin;
    max-width: 900px;
    max-height: 900px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1;
  }

  /* Typography & Accents */
  .annotation {
    position: absolute;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    color: var(--ink-color);
    opacity: 0.8;
    pointer-events: none;
  }

  .annotation.top-left { top: 5%; left: 5%; text-align: left; }
  .annotation.bottom-right { bottom: 5%; right: 5%; text-align: right; font-style: italic; }
  
  .label-line {
    stroke: var(--ink-color);
    stroke-width: 1;
    opacity: 0.4;
  }

  .stamp {
    position: absolute;
    top: 10%;
    right: 10%;
    border: 2px solid var(--accent-red);
    color: var(--accent-red);
    padding: 8px 12px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    text-transform: uppercase;
    font-size: 0.75rem;
    transform: rotate(-6deg);
    opacity: 0.8;
    mix-blend-mode: multiply;
  }

  .title-block {
    position: absolute;
    bottom: 15%;
    left: 10%;
  }
  
  .title-block h1 {
    font-size: 2.5rem;
    font-weight: normal;
    line-height: 1;
    margin-bottom: 0.5rem;
  }
  
  .title-block h2 {
    font-size: 1rem;
    font-weight: normal;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    border-bottom: 1px solid var(--ink-color);
    padding-bottom: 4px;
    display: inline-block;
  }

  /* SVG Styling */
  svg.clover-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    /* Subtle breathing animation */
    animation: breathe 6s ease-in-out infinite alternate;
    transform-origin: bottom center;
  }

  @keyframes breathe {
    0% { transform: scale(1) rotate(0deg); }
    100% { transform: scale(1.02) rotate(0.5deg); }
  }

  /* Interactive Hover */
  .leaflet {
    transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    cursor: pointer;
    transform-origin: center bottom;
  }
  
  .leaflet:hover {
    transform: translateY(-5px) scale(1.02);
  }

  /* Technical details */
  .coords {
    font-family: 'Courier New', monospace;
    font-size: 0.7rem;
    color: #666;
    margin-top: 5px;
  }

</style>
</head>
<body>

  <div class="texture-overlay"></div>

  <div class="specimen-frame">
    
    <!-- UI Elements -->
    <div class="annotation top-left">
      <strong>Fig. 1</strong><br>
      Trifolium pratense<br>
      <span style="font-size: 0.7em; color: #666;">Red Clover</span>
    </div>

    <div class="stamp">
      Verified<br>
      Specimen
    </div>

    <div class="title-block">
      <h1>Trifolium</h1>
      <h2>Leguminosae</h2>
      <div class="coords">LAT 45.4211 N &nbsp; LON 75.6978 W</div>
    </div>

    <div class="annotation bottom-right">
      "The humble clover, rich in nitrogen,<br>
      sustains the soil it rests upon."
    </div>

    <!-- The Specimen -->
    <svg class="clover-svg" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gradients for natural depth -->
        <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" style="stop-color:#2A452A;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#6B8E6B;stop-opacity:1" />
        </linearGradient>

        <radialGradient id="leafGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
          <stop offset="0%" style="stop-color:#8FB38F;stop-opacity:1" />
          <stop offset="60%" style="stop-color:#5C8A5C;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#355E35;stop-opacity:1" />
        </radialGradient>

        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
          <feOffset dx="2" dy="4" result="offsetblur"/>
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.15"/>
          </feComponentTransfer>
          <feMerge> 
            <feMergeNode/>
            <feMergeNode in="SourceGraphic"/> 
          </feMerge>
        </filter>

        <!-- Reusable Leaflet Definition -->
        <g id="perfect-leaflet">
          <!-- Main Leaf Shape -->
          <path d="M 0,0 
                   C -40,-60 -100,-60 -100,0 
                   C -100,60 -40,80 0,80 
                   C 40,80 100,60 100,0 
                   C 100,-60 40,-60 0,0 Z" 
                fill="url(#leafGrad)" 
                stroke="#2A452A" 
                stroke-width="1.5"
                stroke-linejoin="round"/>
          
          <!-- Veins -->
          <g stroke="#2A452A" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round">
            <!-- Central Vein -->
            <path d="M 0,0 Q 5,40 0,75" />
            <!-- Side Veins -->
            <path d="M -2,15 Q -30,15 -50,10" />
            <path d="M -2,30 Q -50,30 -70,20" />
            <path d="M -2,50 Q -40,50 -60,40" />
            
            <path d="M 2,15 Q 30,15 50,10" />
            <path d="M 2,30 Q 50,30 70,20" />
            <path d="M 2,50 Q 40,50 60,40" />
          </g>

          <!-- Serrations (Teeth) - Hand placed for organic feel -->
          <g fill="#355E35">
            <!-- Left side -->
            <path d="M -20,-45 L -28,-55 L -30,-40 Z" />
            <path d="M -50,-55 L -60,-65 L -55,-50 Z" />
            <path d="M -85,-35 L -95,-45 L -85,-25 Z" />
            <path d="M -95,10 L -105,10 L -95,20 Z" />
            
            <!-- Right side -->
            <path d="M 20,-45 L 28,-55 L 30,-40 Z" />
            <path d="M 50,-55 L 60,-65 L 55,-50 Z" />
            <path d="M 85,-35 L 95,-45 L 85,-25 Z" />
            <path d="M 95,10 L 105,10 L 95,20 Z" />
          </g>
        </g>
      </defs>

      <!-- Stem Group -->
      <g id="stem-group" filter="url(#dropShadow)">
        <!-- Main Stem -->
        <path d="M 400,750 Q 420,500 400,300" 
              fill="none" 
              stroke="url(#stemGrad)" 
              stroke-width="12" 
              stroke-linecap="round" />
        
        <!-- Petioles (connecting stem to leaves) -->
        <!-- Left -->
        <path d="M 400,300 Q 380,280 300,200" 
              fill="none" stroke="url(#stemGrad)" stroke-width="8" stroke-linecap="round"/>
        <!-- Right -->
        <path d="M 400,300 Q 420,280 500,200" 
              fill="none" stroke="url(#stemGrad)" stroke-width="8" stroke-linecap="round"/>
        <!-- Top -->
        <path d="M 400,300 Q 405,250 400,150" 
              fill="none" stroke="url(#stemGrad)" stroke-width="8" stroke-linecap="round"/>
      </g>

      <!-- Leaves Group -->
      <g id="leaves-group" filter="url(#dropShadow)">
        <!-- Left Leaf -->
        <g transform="translate(300, 200) rotate(-45) scale(0.9)">
          <use href="#perfect-leaflet" class="leaflet" />
        </g>

        <!-- Right Leaf -->
        <g transform="translate(500, 200) rotate(45) scale(0.9)">
          <use href="#perfect-leaflet" class="leaflet" />
        </g>

        <!-- Top Leaf (Dominant) -->
        <g transform="translate(400, 150) rotate(0) scale(1.1)">
          <use href="#perfect-leaflet" class="leaflet" />
        </g>
      </g>

      <!-- Scientific Annotations on SVG -->
      <g stroke="#666" stroke-width="1" fill="none" opacity="0.7">
        <!-- Line pointing to serration -->
        <path d="M 300,120 L 200,100 L 150,100" />
        <text x="140" y="105" font-family="monospace" font-size="10" fill="#666" stroke="none">Serration</text>
        
        <!-- Line pointing to vein -->
        <path d="M 450,180 L 550,150 L 600,150" />
        <text x="610" y="155" font-family="monospace" font-size="10" fill="#666" stroke="none">Venation</text>
      </g>

    </svg>
  </div>

  <script>
    // Minimal JS to add a subtle parallax effect on mouse move
    // This adds a layer of polish without interfering with the static beauty
    document.addEventListener('mousemove', (e) => {
      const x = (window.innerWidth - e.pageX * 2) / 100;
      const y = (window.innerHeight - e.pageY * 2) / 100;

      const svg = document.querySelector('.clover-svg');
      const leaves = document.querySelectorAll('.leaflet');
      
      // Move the whole SVG slightly
      svg.style.transform = `translate(${x}px, ${y}px)`;

      // Move leaves slightly more for depth (parallax)
      leaves.forEach((leaf, index) => {
        const depth = index === 2 ? 1.5 : 0.5; // Top leaf moves more
        leaf.style.transform = `translate(${x * depth}px, ${y * depth}px)`;
      });
    });
  </script>
</body>
</html>
