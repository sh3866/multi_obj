<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura | The Modern Flush</title>
<style>
    :root {
        --bg-color: #F4F2EE;
        --bg-accent: #EBE9E3;
        --text-main: #1A1A1A;
        --text-muted: #555555;
        --accent-metal: #2A2A2A;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--bg-color);
        /* Softened Context: Subtle warm gradient instead of blueprint grid */
        background-image: radial-gradient(circle at 50% 30%, #FFFFFF 0%, var(--bg-color) 60%, var(--bg-accent) 100%);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Layout: Centered Stage */
    .stage {
        width: 100%;
        height: 100%;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* SVG Container */
    .product-stage {
        width: 100%;
        max-width: 750px;
        height: auto;
        /* Grounding Shadow for the entire unit */
        filter: drop-shadow(0px 50px 70px rgba(0,0,0,0.15));
    }

    /* SVG Animation Classes */
    .water-surface {
        transform-origin: 300px 450px;
    }
    
    .handle-group {
        transform-origin: 415px 280px;
        cursor: pointer;
        transition: transform 0.1s ease;
    }

    .handle-group:active {
        transform: rotate(15deg);
    }

    .ripple {
        transform-origin: 300px 450px;
        transform: scale(0);
        opacity: 0;
    }

    .splash-particle {
        opacity: 0;
    }

    /* Keyframes */
    @keyframes whoosh-handle {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(15deg); }
    }

    @keyframes ripple-expand {
        0% { transform: scale(0.2); opacity: 0.8; stroke-width: 2px; }
        100% { transform: scale(2.0); opacity: 0; stroke-width: 0.5px; }
    }

    @keyframes vortex-spin {
        0% { transform: scale(0.1) rotate(0deg); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 0.8; }
        100% { transform: scale(1.5) rotate(360deg); opacity: 0; }
    }

    @keyframes water-level-drop {
        0% { transform: scale(1) translateY(0); }
        100% { transform: scale(0.5) translateY(50px); }
    }

    @keyframes water-level-refill {
        0% { transform: scale(0.5) translateY(50px); }
        100% { transform: scale(1) translateY(0); }
    }

    @keyframes particle-burst {
        0% { transform: translate(0,0) scale(0.5); opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 0; }
    }

    /* Typography & Card: Integrated Text */
    .title-overlay {
        position: absolute;
        bottom: 10%;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 10;
        pointer-events: none;
        /* Removed heavy box, using subtle text shadow/blend for legibility */
        mix-blend-mode: multiply;
    }

    .title-overlay h1 {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--text-main);
        margin-bottom: 0.25rem;
        text-shadow: 0px 2px 10px rgba(255,255,255,0.8);
    }

    .title-overlay p {
        font-size: 0.85rem;
        color: var(--text-muted);
        letter-spacing: 0.1em;
        font-weight: 500;
        text-shadow: 0px 1px 5px rgba(255,255,255,0.9);
    }

    /* Mobile Adjustments */
    @media (max-width: 600px) {
        .title-overlay { bottom: 8%; width: 90%; }
        .title-overlay h1 { font-size: 1.1rem; }
    }
</style>
</head>
<body>

<div class="stage">
    <svg class="product-stage" viewBox="0 0 600 750" preserveAspectRatio="xMidYMid meet">
        <defs>
            <!-- 
              MATERIAL REALISM: 
              Multi-stop gradients for porcelain sheen.
            -->
            
            <!-- Main Body Ceramic: Light from top-left -->
            <linearGradient id="grad-ceramic-body" x1="10%" y1="0%" x2="90%" y2="80%">
                <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                <stop offset="15%" style="stop-color:#FFFFFF;stop-opacity:1" /> <!-- Sharp Highlight -->
                <stop offset="35%" style="stop-color:#F4F4F4;stop-opacity:1" />
                <stop offset="85%" style="stop-color:#E0E0E0;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#C4C4C4;stop-opacity:1" /> <!-- Deep Shadow -->
            </linearGradient>

            <!-- Bowl Interior (Darker for depth) -->
            <linearGradient id="grad-ceramic-interior" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#808080;stop-opacity:1" />
            </linearGradient>

            <!-- Chrome/Plumbing Gradient -->
            <linearGradient id="grad-chrome" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#9CA3AF;stop-opacity:1" />
                <stop offset="20%" style="stop-color:#F3F4F6;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#6B7280;stop-opacity:1" />
                <stop offset="80%" style="stop-color:#D1D5DB;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#4B5563;stop-opacity:1" />
            </linearGradient>

            <!-- Water Gradient -->
            <linearGradient id="grad-water" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#E0F2FE;stop-opacity:0.95" />
                <stop offset="50%" style="stop-color:#BAE6FD;stop-opacity:0.95" />
                <stop offset="100%" style="stop-color:#7DD3FC;stop-opacity:0.95" />
            </linearGradient>
            
            <!-- Vortex Gradient -->
            <radialGradient id="grad-vortex" cx="50%" cy="50%" r="50%">
                <stop offset="0%" style="stop-color:#0284C7;stop-opacity:0.9" />
                <stop offset="40%" style="stop-color:#0EA5E9;stop-opacity:0.4" />
                <stop offset="100%" style="stop-color:#E0F2FE;stop-opacity:0" />
            </radialGradient>

            <!-- Shadow Blur -->
            <filter id="shadow-blur" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="8" />
            </filter>
            
            <!-- Soft Drop Shadow for Floor Anchor -->
            <filter id="floor-shadow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="15" />
            </filter>
        </defs>

        <!-- 1. FLOOR & BASE PLUMBING (Grounding the Object) -->
        <g id="base-plumbing">
            <!-- Floor Line / Anchor -->
            <line x1="100" y1="680" x2="500" y2="680" stroke="#D0CDC6" stroke-width="2" stroke-linecap="round" />
            
            <!-- Floor Shadow -->
            <ellipse cx="300" cy="680" rx="140" ry="15" fill="#000000" opacity="0.15" filter="url(#floor-shadow)" />

            <!-- Floor Flange -->
            <ellipse cx="300" cy="675" rx="45" ry="10" fill="url(#grad-chrome)" stroke="#9CA3AF" stroke-width="1"/>
            <ellipse cx="300" cy="673" rx="35" ry="7" fill="#4B5563" />
        </g>

        <!-- 2. TANK (Back Layer) -->
        <g id="tank">
            <!-- Tank Body -->
            <!-- Path with rounded corners for a modern look -->
            <path d="M220,190 L380,190 C395,190 400,195 400,210 L400,400 C400,415 395,420 380,420 L220,420 C205,420 200,415 200,400 L200,210 C200,195 205,190 220,190 Z" fill="url(#grad-ceramic-body)" />
            
            <!-- 
               CRITIQUE FIX: Elevate Tank Lid
               Redrawn as a 3D object with top surface and side thickness.
            -->
            <g id="tank-lid">
                <!-- Side Edge (Thickness) -->
                <path d="M210,185 L390,185 C398,185 405,190 405,195 L405,200 L195,200 L195,195 C195,190 202,185 210,185 Z" fill="#D1D5DB" />
                <!-- Top Surface -->
                <path d="M210,185 L390,185 C398,185 405,190 405,195 L195,195 C195,190 202,185 210,185 Z" fill="#FFFFFF" />
            </g>

            <!-- GLOSSY HIGHLIGHTS (The "Rim Light") -->
            <!-- Left Edge Reflection -->
            <path d="M215,205 L215,390 C215,398 220,402 228,402" stroke="white" stroke-width="6" fill="none" opacity="0.8" stroke-linecap="round" filter="url(#shadow-blur)" />
            <!-- Sharp Top Edge Highlight -->
            <path d="M220,192 L380,192" stroke="white" stroke-width="2" fill="none" opacity="0.6" />
        </g>

        <!-- 3. BOWL (Middle Layer) -->
        <g id="bowl-group">
            <!-- Main Bowl Shape -->
            <path d="M200,410 C200,530 240,590 300,590 C360,590 400,530 400,410 L400,370 C400,350 380,340 350,340 L250,340 C220,340 200,350 200,370 Z" fill="url(#grad-ceramic-body)" />
            
            <!-- Interior Shadow (Depth inside the bowl) -->
            <path d="M210,410 C210,510 240,560 300,560 C360,560 390,510 390,410" fill="none" stroke="#9CA3AF" stroke-width="40" opacity="0.2" filter="url(#shadow-blur)" />

            <!-- The Rim (Lip) -->
            <path d="M190,370 C190,400 250,420 300,420 C350,420 410,400 410,370 L410,360 C410,390 350,410 300,410 C250,410 190,390 190,360 Z" fill="url(#grad-ceramic-body)" />
            
            <!-- Front Specular Highlight -->
            <path d="M220,430 C220,510 260,550 300,550" stroke="white" stroke-width="8" fill="none" opacity="0.4" stroke-linecap="round" filter="url(#shadow-blur)" />
        </g>

        <!-- 4. SEAT & LID (Geometry Fix: Lid Open, Seat Down) -->
        <g id="seat-lid-group">
            <!-- THE LID (Open, vertical against tank) -->
            <g id="lid-open">
                <!-- Side thickness of the lid -->
                <path d="M210,190 L210,70 C210,60 220,55 230,55 L370,55 C380,55 390,60 390,70 L390,190 Z" fill="#E5E7EB" />
                <!-- Top surface of the lid (facing camera) -->
                <path d="M215,190 L215,75 C215,65 225,60 235,60 L365,60 C375,60 385,65 385,75 L385,190 Z" fill="url(#grad-ceramic-body)" />
                <!-- Lid Highlight -->
                <path d="M220,180 L220,80 C220,70 225,65 230,65" stroke="white" stroke-width="4" fill="none" opacity="0.6" />
            </g>

            <!-- THE SEAT (Down, on bowl) -->
            <g id="seat-down">
                <!-- Seat Thickness (Underside shadow) -->
                <path d="M200,365 C200,385 250,405 300,405 C350,405 400,385 400,365 L395,355 C395,375 350,395 300,395 C250,395 205,375 205,355 Z" fill="#D1D5DB" />
                <!-- Seat Top Surface -->
                <path d="M205,355 C205,375 250,395 300,395 C350,395 395,375 395,355 C395,345 350,335 300,335 C250,335 205,345 205,355 Z" fill="url(#grad-ceramic-body)" />
                <!-- Seat Hole (Visual cue for depth) -->
                <path d="M240,365 C240,380 270,390 300,390 C330,390 360,380 360,365 C360,350 330,340 300,340 C270,340 240,350 240,365 Z" fill="#9CA3AF" opacity="0.1" />
                <!-- Seat Highlight -->
                <ellipse cx="300" cy="360" rx="50" ry="8" fill="white" opacity="0.3" />
            </g>
        </g>

        <!-- 5. INTERIOR WATER & ACTION (Hidden behind seat rim) -->
        <g id="interior">
            <!-- Water Surface -->
            <ellipse cx="300" cy="450" rx="110" ry="35" fill="url(#grad-water)" class="water-surface" id="waterSurface" />
            
            <!-- Vortex Effect -->
            <circle cx="300" cy="450" r="70" fill="url(#grad-vortex)" id="vortex" opacity="0" style="transform-origin: 300px 450px;" />

            <!-- Ripples -->
            <ellipse cx="300" cy="450" rx="100" ry="30" fill="none" stroke="#FFFFFF" class="ripple" id="ripple1" />
            <ellipse cx="300" cy="450" rx="100" ry="30" fill="none" stroke="#FFFFFF" class="ripple" id="ripple2" />
            <ellipse cx="300" cy="450" rx="100" ry="30" fill="none" stroke="#FFFFFF" class="ripple" id="ripple3" />

            <!-- Splash Particles -->
            <g id="splashGroup">
                <circle cx="280" cy="420" r="3" fill="#fff" class="splash-particle" style="--tx: -40px; --ty: -60px;" />
                <circle cx="320" cy="410" r="2" fill="#fff" class="splash-particle" style="--tx: 40px; --ty: -50px;" />
                <circle cx="300" cy="400" r="4" fill="#fff" class="splash-particle" style="--tx: 0px; --ty: -80px;" />
                <circle cx="290" cy="450" r="2" fill="#fff" class="splash-particle" style="--tx: -20px; --ty: -30px;" />
                <circle cx="310" cy="460" r="2" fill="#fff" class="splash-particle" style="--tx: 30px; --ty: -40px;" />
            </g>
        </g>

        <!-- 6. HANDLE (Foreground, Metallic, Enlarged) -->
        <g id="flusher">
            <!-- Handle Arm (Rod) -->
            <rect x="400" y="276" width="55" height="8" rx="4" fill="url(#grad-chrome)" class="handle-rod" />
            
            <!-- Handle Knob (Button/Head) -->
            <g class="handle-group" id="handleGroup">
                <!-- Base of knob -->
                <rect x="435" y="270" width="15" height="20" rx="2" fill="url(#grad-chrome)" />
                <!-- The Button Head -->
                <rect x="445" y="268" width="25" height="24" rx="4" fill="url(#grad-chrome)" stroke="#fff" stroke-width="0.5" />
                <!-- Button Highlight -->
                <rect x="447" y="270" width="20" height="3" rx="1" fill="white" opacity="0.6" />
            </g>
        </g>
    </svg>

    <div class="title-overlay">
        <h1>Aura Series 5</h1>
        <p>Hydro-Clean &bull; Silent Flush</p>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const waterSurface = document.getElementById('waterSurface');
        const vortex = document.getElementById('vortex');
        const ripples = [
            document.getElementById('ripple1'),
            document.getElementById('ripple2'),
            document.getElementById('ripple3')
        ];
        const particles = document.querySelectorAll('.splash-particle');
        const handleGroup = document.getElementById('handleGroup');
        
        let isFlushing = false;

        // Function to trigger the flush animation
        function triggerFlush() {
            if (isFlushing) return;
            isFlushing = true;

            // 1. Handle Physical Movement
            handleGroup.style.transition = 'transform 0.2s cubic-bezier(0.4, 0, 0.2, 1)';
            handleGroup.style.transform = 'rotate(15deg)';

            // 2. Water Drop & Vortex (Delayed slightly after handle press)
            setTimeout(() => {
                // Water level drops
                waterSurface.style.transition = 'transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
                waterSurface.style.transform = 'scale(0.5) translateY(50px)';

                // Vortex spins in
                vortex.style.animation = 'none';
                vortex.offsetHeight; /* trigger reflow */
                vortex.style.animation = 'vortex-spin 1.2s ease-in-out forwards';

                // Particles burst
                particles.forEach((p, i) => {
                    p.style.animation = `particle-burst 0.7s ease-out ${i * 0.05}s forwards`;
                });

                // Ripples expand
                ripples.forEach((r, i) => {
                    r.style.animation = `ripple-expand 1.5s ease-out ${i * 0.3}s forwards`;
                });

            }, 200); 

            // 3. Reset Handle
            setTimeout(() => {
                handleGroup.style.transform = 'rotate(0deg)';
            }, 400);

            // 4. Refill Sequence
            setTimeout(() => {
                // Reset Particles
                particles.forEach(p => {
                    p.style.animation = 'none';
                    p.style.opacity = '0';
                });

                // Reset Ripples
                ripples.forEach(r => {
                    r.style.animation = 'none';
                    r.style.transform = 'scale(0)';
                    r.style.opacity = '0';
                });

                // Water Refill (Slow rise)
                waterSurface.style.transition = 'transform 2.5s cubic-bezier(0.2, 0.8, 0.2, 1)';
                waterSurface.style.transform = 'scale(1) translateY(0)';

                // Cleanup
                setTimeout(() => {
                    vortex.style.opacity = '0';
                    isFlushing = false;
                }, 2500);

            }, 1400);
        }

        // Auto-play the animation on load to demonstrate
        setTimeout(triggerFlush, 1000);
        
        // Loop the animation every 8 seconds
        setInterval(triggerFlush, 8000);

        // Allow user to click handle to trigger manually
        handleGroup.addEventListener('click', triggerFlush);
    });
</script>
</body>
</html>
