<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura | The Modern Flush</title>
<style>
    :root {
        --bg-color: #F4F2EE;
        --text-main: #1A1A1A;
        --text-muted: #6B6B6B;
        --accent: #2B2B2B;
        --highlight: #FFFFFF;
        --ceramic-white: #FDFDFD;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Layout: Centered Stage */
    .stage {
        width: 100%;
        max-width: 800px;
        height: 80vh;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* SVG Container */
    .product-stage {
        width: 100%;
        height: 100%;
        /* Subtle drop shadow for the whole object */
        filter: drop-shadow(0px 30px 40px rgba(0,0,0,0.08));
    }

    /* SVG Styles */
    .water-surface {
        transform-origin: 300px 420px;
    }
    
    .handle-whoosh {
        opacity: 0;
        transform-origin: 415px 280px;
    }

    .ripple {
        transform-origin: 300px 420px;
        transform: scale(0);
        opacity: 0;
    }

    .splash-particle {
        opacity: 0;
    }

    /* Keyframes */
    @keyframes whoosh {
        0% { transform: rotate(0deg) scale(0.8); opacity: 0.6; stroke-dashoffset: 0; }
        100% { transform: rotate(45deg) scale(1.2); opacity: 0; stroke-dashoffset: 20; }
    }

    @keyframes ripple-anim {
        0% { transform: scale(0.2); opacity: 0.8; stroke-width: 2px; }
        100% { transform: scale(1.5); opacity: 0; stroke-width: 0.5px; }
    }

    @keyframes vortex-spin {
        0% { transform: scale(0.1) rotate(0deg); opacity: 0; }
        20% { opacity: 0.6; }
        100% { transform: scale(1.2) rotate(360deg); opacity: 0; }
    }

    @keyframes water-level-drop {
        0% { transform: scale(1) translateY(0); }
        100% { transform: scale(0.6) translateY(15px); }
    }

    @keyframes water-level-refill {
        0% { transform: scale(0.6) translateY(15px); }
        100% { transform: scale(1) translateY(0); }
    }

    @keyframes particle-burst {
        0% { transform: translate(0,0) scale(0.5); opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 0; }
    }

    /* Typography */
    .title-card {
        position: absolute;
        bottom: 5%;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 10;
        pointer-events: none;
    }

    .title-card h1 {
        font-size: 1.5rem;
        font-weight: 300;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-main);
        margin-bottom: 0.25rem;
    }

    .title-card p {
        font-size: 0.8rem;
        color: var(--text-muted);
        letter-spacing: 0.1em;
    }

    /* Mobile Adjustments */
    @media (max-width: 600px) {
        .stage { height: 60vh; }
    }
</style>
</head>
<body>

<div class="stage">
    <svg class="product-stage" viewBox="0 0 600 650" preserveAspectRatio="xMidYMid meet">
        <defs>
            <!-- Complex Ceramic Gradient (Radial for dimensionality) -->
            <radialGradient id="grad-ceramic-body" cx="35%" cy="30%" r="90%" fx="35%" fy="30%">
                <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                <stop offset="40%" style="stop-color:#F3F4F6;stop-opacity:1" />
                <stop offset="85%" style="stop-color:#D1D5DB;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#9CA3AF;stop-opacity:1" />
            </radialGradient>

            <!-- Darker Ceramic for depth/shadows -->
            <radialGradient id="grad-ceramic-dark" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                <stop offset="0%" style="stop-color:#E5E7EB;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#9CA3AF;stop-opacity:1" />
            </radialGradient>

            <!-- Chrome/Plumbing Gradient -->
            <linearGradient id="grad-chrome" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#D1D5DB;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#9CA3AF;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#4B5563;stop-opacity:1" />
            </linearGradient>

            <!-- Water Gradient -->
            <linearGradient id="grad-water" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#E0F2FE;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#7DD3FC;stop-opacity:1" />
            </linearGradient>
            
            <!-- Vortex Gradient -->
            <radialGradient id="grad-vortex" cx="50%" cy="50%" r="50%">
                <stop offset="0%" style="stop-color:#0284C7;stop-opacity:0.8" />
                <stop offset="60%" style="stop-color:#38BDF8;stop-opacity:0.2" />
                <stop offset="100%" style="stop-color:#E0F2FE;stop-opacity:0" />
            </radialGradient>

            <!-- Shadow Filter -->
            <filter id="shadow-blur" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="15" />
            </filter>
        </defs>

        <!-- BACKGROUND CONTEXT: Floor Plane -->
        <g id="context-floor">
            <!-- Floor Line -->
            <line x1="50" y1="580" x2="550" y2="580" stroke="#E5E7EB" stroke-width="1" />
            <!-- Base Shadow -->
            <ellipse cx="300" cy="580" rx="180" ry="20" fill="#000" opacity="0.15" filter="url(#shadow-blur)" />
            <!-- Trapway/Plumbing Base Connection -->
            <path d="M280,550 L280,580 C280,590 320,590 320,580 L320,550 Z" fill="#D1D5DB" />
            <rect x="270" y="575" width="60" height="8" rx="2" fill="url(#grad-chrome)" />
        </g>

        <!-- TANK (Back) -->
        <g id="tank">
            <!-- Tank Body -->
            <path d="M210,200 L390,200 C400,200 405,205 405,215 L405,380 C405,390 395,400 380,400 L220,400 C205,400 195,390 195,380 L195,215 C195,205 200,200 210,200 Z" fill="url(#grad-ceramic-body)" />
            
            <!-- Tank Top Lid -->
            <path d="M200,195 L390,195 C400,195 405,200 405,205 L405,210 L195,210 L195,205 C195,200 200,195 210,195 Z" fill="url(#grad-ceramic-dark)" />
            
            <!-- Glossy Highlight (Left edge) -->
            <path d="M215,210 L215,380 C215,390 220,395 225,395" stroke="white" stroke-width="5" fill="none" opacity="0.6" stroke-linecap="round" />
            <!-- Secondary Highlight (Top edge) -->
            <path d="M210,205 L390,205" stroke="white" stroke-width="2" fill="none" opacity="0.4" />
        </g>

        <!-- BOWL & SEAT -->
        <g id="bowl-group">
            <!-- Main Bowl Shape -->
            <path d="M180,420 C180,520 220,550 300,550 C380,550 420,520 420,420 L420,360 C420,350 410,340 400,340 L200,340 C190,340 180,350 180,360 Z" fill="url(#grad-ceramic-body)" />
            
            <!-- Front Specular Highlight -->
            <path d="M200,400 C200,500 230,530 300,530" stroke="white" stroke-width="8" fill="none" opacity="0.5" stroke-linecap="round" filter="url(#shadow-blur)" />
            
            <!-- The Rim (Lip) -->
            <path d="M180,360 C180,380 250,400 300,400 C350,400 420,380 420,360 L410,350 C410,370 350,390 300,390 C250,390 190,370 190,350 Z" fill="url(#grad-ceramic-body)" />
            <!-- Rim Shadow (Depth cue) -->
            <path d="M190,380 C190,390 250,405 300,405 C350,405 410,390 410,380" stroke="#9CA3AF" stroke-width="2" fill="none" opacity="0.3" />

            <!-- Seat -->
            <g id="seat">
                <!-- Seat Thickness -->
                <path d="M190,355 C190,375 250,395 300,395 C350,395 410,375 410,355 L405,345 C405,365 350,385 300,385 C250,385 195,365 195,345 Z" fill="url(#grad-ceramic-dark)" />
                <!-- Seat Top Surface -->
                <path d="M195,345 C195,365 250,385 300,385 C350,385 405,365 405,345 C405,335 350,325 300,325 C250,325 195,335 195,345 Z" fill="url(#grad-ceramic-body)" />
                <!-- Seat Highlight -->
                <ellipse cx="300" cy="350" rx="60" ry="10" fill="white" opacity="0.4" />
            </g>
        </g>

        <!-- INTERIOR & WATER (Inside Bowl) -->
        <g id="interior">
            <!-- Water Surface -->
            <ellipse cx="300" cy="420" rx="120" ry="45" fill="url(#grad-water)" class="water-surface" id="waterSurface" />
            
            <!-- Vortex Effect (Center of water) -->
            <circle cx="300" cy="420" r="80" fill="url(#grad-vortex)" id="vortex" opacity="0" style="transform-origin: 300px 420px;" />

            <!-- Ripples (Animated) -->
            <ellipse cx="300" cy="420" rx="100" ry="35" fill="none" stroke="#BAE6FD" class="ripple" id="ripple1" />
            <ellipse cx="300" cy="420" rx="100" ry="35" fill="none" stroke="#BAE6FD" class="ripple" id="ripple2" />
            <ellipse cx="300" cy="420" rx="100" ry="35" fill="none" stroke="#BAE6FD" class="ripple" id="ripple3" />

            <!-- Splash Particles -->
            <g id="splashGroup">
                <circle cx="280" cy="400" r="3" fill="#fff" class="splash-particle" style="--tx: -30px; --ty: -40px;" />
                <circle cx="320" cy="390" r="2" fill="#fff" class="splash-particle" style="--tx: 30px; --ty: -30px;" />
                <circle cx="300" cy="380" r="4" fill="#fff" class="splash-particle" style="--tx: 0px; --ty: -50px;" />
                <circle cx="290" cy="430" r="2" fill="#fff" class="splash-particle" style="--tx: -20px; --ty: -20px;" />
                <circle cx="310" cy="440" r="2" fill="#fff" class="splash-particle" style="--tx: 20px; --ty: -20px;" />
            </g>
        </g>

        <!-- HANDLE & FLUSH MECHANISM (Right side) -->
        <g id="flusher">
            <!-- Handle Arm -->
            <path d="M395,280 L435,280" stroke="url(#grad-chrome)" stroke-width="6" stroke-linecap="round" />
            <!-- Handle Knob -->
            <circle cx="440" cy="280" r="8" fill="url(#grad-chrome)" />
            
            <!-- Whoosh Effect Lines (Hidden) -->
            <g class="handle-whoosh" id="whooshGroup">
                <path d="M415,260 Q430,280 415,300" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="5,5" />
                <path d="M425,250 Q445,280 425,310" fill="none" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="2,4" />
            </g>
        </g>
    </svg>

    <div class="title-card">
        <h1>Aura Series 5</h1>
        <p>Hydro-Clean • Silent Flush</p>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const waterSurface = document.getElementById('waterSurface');
        const vortex = document.getElementById('vortex');
        const ripples = [
            document.getElementById('ripple1'),
            document.getElementById('ripple2'),
            document.getElementById('ripple3')
        ];
        const particles = document.querySelectorAll('.splash-particle');
        const whooshGroup = document.getElementById('whooshGroup');
        
        let isFlushing = false;

        // Function to trigger the flush animation
        function triggerFlush() {
            if (isFlushing) return;
            isFlushing = true;

            // 1. Handle Whoosh
            whooshGroup.style.animation = 'none';
            whooshGroup.offsetHeight; /* trigger reflow */
            whooshGroup.style.animation = 'whoosh 0.4s ease-out forwards';

            // 2. Water Drop & Vortex
            setTimeout(() => {
                // Water level drops
                waterSurface.style.transition = 'transform 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
                waterSurface.style.transform = 'scale(0.6) translateY(15px)';

                // Vortex spins in
                vortex.style.animation = 'none';
                vortex.offsetHeight;
                vortex.style.animation = 'vortex-spin 1s ease-in-out forwards';

                // Particles burst
                particles.forEach((p, i) => {
                    p.style.animation = `particle-burst 0.6s ease-out ${i * 0.05}s forwards`;
                });

                // Ripples expand
                ripples.forEach((r, i) => {
                    r.style.animation = `ripple-anim 1.2s ease-out ${i * 0.2}s forwards`;
                });

            }, 200); // Slight delay after handle

            // 3. Refill Sequence
            setTimeout(() => {
                // Reset Particles
                particles.forEach(p => {
                    p.style.animation = 'none';
                    p.style.opacity = '0';
                });

                // Reset Ripples
                ripples.forEach(r => {
                    r.style.animation = 'none';
                    r.style.transform = 'scale(0)';
                    r.style.opacity = '0';
                });

                // Water Refill
                waterSurface.style.transition = 'transform 2s cubic-bezier(0.2, 0.8, 0.2, 1)';
                waterSurface.style.transform = 'scale(1) translateY(0)';

                // Cleanup
                setTimeout(() => {
                    whooshGroup.style.opacity = '0';
                    vortex.style.opacity = '0';
                    isFlushing = false;
                }, 2000);

            }, 1200);
        }

        // Auto-play the animation on load to demonstrate
        setTimeout(triggerFlush, 1000);
        
        // Loop the animation every 6 seconds
        setInterval(triggerFlush, 6000);
    });
</script>
</body>
</html>
