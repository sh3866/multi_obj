<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura | The Modern Flush</title>
<style>
    :root {
        --bg-color: #EAE8E3;
        --bg-pattern: #E0DED9;
        --text-main: #1C1C1C;
        --text-muted: #666666;
        --accent-metal: #2A2A2A;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--bg-color);
        /* Subtle tile grid pattern for context */
        background-image: 
            linear-gradient(var(--bg-pattern) 1px, transparent 1px),
            linear-gradient(90deg, var(--bg-pattern) 1px, transparent 1px);
        background-size: 40px 40px;
        color: var(--text-main);
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Layout: Centered Stage */
    .stage {
        width: 100%;
        height: 100%;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* SVG Container */
    .product-stage {
        width: 100%;
        max-width: 700px;
        height: auto;
        /* Soft, grounded shadow for the entire unit */
        filter: drop-shadow(0px 40px 60px rgba(0,0,0,0.12));
    }

    /* SVG Animation Classes */
    .water-surface {
        transform-origin: 300px 435px;
    }
    
    .handle-group {
        transform-origin: 410px 280px;
        cursor: pointer;
    }

    .handle-group:hover .handle-rod {
        fill: #555; /* Slight darkening on hover */
    }

    .ripple {
        transform-origin: 300px 435px;
        transform: scale(0);
        opacity: 0;
    }

    .splash-particle {
        opacity: 0;
    }

    /* Keyframes */
    @keyframes whoosh-handle {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(15deg); }
    }

    @keyframes ripple-expand {
        0% { transform: scale(0.2); opacity: 0.8; stroke-width: 3px; }
        100% { transform: scale(2.0); opacity: 0; stroke-width: 1px; }
    }

    @keyframes vortex-spin {
        0% { transform: scale(0.1) rotate(0deg); opacity: 0; }
        20% { opacity: 0.9; }
        80% { opacity: 0.8; }
        100% { transform: scale(1.5) rotate(360deg); opacity: 0; }
    }

    @keyframes water-level-drop {
        0% { transform: scale(1) translateY(0); }
        100% { transform: scale(0.5) translateY(40px); }
    }

    @keyframes water-level-refill {
        0% { transform: scale(0.5) translateY(40px); }
        100% { transform: scale(1) translateY(0); }
    }

    @keyframes particle-burst {
        0% { transform: translate(0,0) scale(0.5); opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 0; }
    }

    /* Typography & Card */
    .title-card {
        position: absolute;
        bottom: 8%;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 10;
        pointer-events: none;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(8px);
        padding: 1rem 2rem;
        border-radius: 4px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        border: 1px solid rgba(255,255,255,0.5);
    }

    .title-card h1 {
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--text-main);
        margin-bottom: 0.25rem;
    }

    .title-card p {
        font-size: 0.75rem;
        color: var(--text-muted);
        letter-spacing: 0.05em;
        font-weight: 400;
    }

    /* Mobile Adjustments */
    @media (max-width: 600px) {
        .title-card { bottom: 5%; width: 80%; }
        .title-card h1 { font-size: 1rem; }
    }
</style>
</head>
<body>

<div class="stage">
    <svg class="product-stage" viewBox="0 0 600 700" preserveAspectRatio="xMidYMid meet">
        <defs>
            <!-- 
              MATERIAL REALISM: 
              Complex gradients with sharp white stops for glossy ceramic.
              x1/y1/y2 control the angle of light.
            -->
            
            <!-- Main Body Ceramic: Light from top-left -->
            <linearGradient id="grad-ceramic-body" x1="10%" y1="0%" x2="90%" y2="80%">
                <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                <stop offset="15%" style="stop-color:#FFFFFF;stop-opacity:1" /> <!-- Sharp Highlight -->
                <stop offset="30%" style="stop-color:#F8F9FA;stop-opacity:1" />
                <stop offset="80%" style="stop-color:#E2E5E9;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#B0B5BD;stop-opacity:1" /> <!-- Deep Shadow -->
            </linearGradient>

            <!-- Bowl Interior (Darker) -->
            <linearGradient id="grad-ceramic-interior" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#D1D5DB;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#9CA3AF;stop-opacity:1" />
            </linearGradient>

            <!-- Chrome/Plumbing Gradient -->
            <linearGradient id="grad-chrome" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#9CA3AF;stop-opacity:1" />
                <stop offset="20%" style="stop-color:#F3F4F6;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#6B7280;stop-opacity:1" />
                <stop offset="80%" style="stop-color:#D1D5DB;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#4B5563;stop-opacity:1" />
            </linearGradient>

            <!-- Water Gradient -->
            <linearGradient id="grad-water" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#E0F2FE;stop-opacity:0.9" />
                <stop offset="50%" style="stop-color:#BAE6FD;stop-opacity:0.9" />
                <stop offset="100%" style="stop-color:#7DD3FC;stop-opacity:0.9" />
            </linearGradient>
            
            <!-- Vortex Gradient -->
            <radialGradient id="grad-vortex" cx="50%" cy="50%" r="50%">
                <stop offset="0%" style="stop-color:#0284C7;stop-opacity:0.9" />
                <stop offset="40%" style="stop-color:#0EA5E9;stop-opacity:0.4" />
                <stop offset="100%" style="stop-color:#E0F2FE;stop-opacity:0" />
            </radialGradient>

            <!-- Shadow Blur -->
            <filter id="shadow-blur" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="10" />
            </filter>
        </defs>

        <!-- 1. FLOOR & BASE PLUMBING (Context) -->
        <g id="base-plumbing">
            <!-- Floor Flange -->
            <ellipse cx="300" cy="630" rx="40" ry="8" fill="url(#grad-chrome)" stroke="#9CA3AF" stroke-width="1"/>
            <ellipse cx="300" cy="628" rx="30" ry="5" fill="#4B5563" />
            <!-- Wax Ring hint (dark gap) -->
            <ellipse cx="300" cy="626" rx="35" ry="6" fill="#333" opacity="0.2" />
        </g>

        <!-- 2. TANK (Back Layer) -->
        <g id="tank">
            <!-- Tank Body -->
            <!-- Using a path with rounded corners for a modern look -->
            <path d="M220,180 L380,180 C395,180 400,185 400,200 L400,390 C400,405 395,410 380,410 L220,410 C205,410 200,405 200,390 L200,200 C200,185 205,180 220,180 Z" fill="url(#grad-ceramic-body)" />
            
            <!-- Tank Top Lid -->
            <path d="M210,175 L390,175 C400,175 405,180 405,185 L405,190 L195,190 L195,185 C195,180 200,175 210,175 Z" fill="url(#grad-ceramic-body)" />
            <!-- Lid Top Surface -->
            <path d="M210,175 L390,175 C400,175 405,180 405,185 L195,185 C195,180 200,175 210,175 Z" fill="#FFFFFF" />

            <!-- GLOSSY HIGHLIGHTS (The "Rim Light") -->
            <!-- Left Edge Reflection -->
            <path d="M215,195 L215,390 C215,398 220,402 228,402" stroke="white" stroke-width="6" fill="none" opacity="0.8" stroke-linecap="round" filter="url(#shadow-blur)" />
            <!-- Sharp Top Edge Highlight -->
            <path d="M220,182 L380,182" stroke="white" stroke-width="2" fill="none" opacity="0.6" />
        </g>

        <!-- 3. BOWL (Middle Layer) -->
        <g id="bowl-group">
            <!-- Main Bowl Shape -->
            <path d="M200,400 C200,520 240,580 300,580 C360,580 400,520 400,400 L400,360 C400,340 380,330 350,330 L250,330 C220,330 200,340 200,360 Z" fill="url(#grad-ceramic-body)" />
            
            <!-- Interior Shadow (Depth inside the bowl) -->
            <path d="M210,400 C210,500 240,550 300,550 C360,550 390,500 390,400" fill="none" stroke="#9CA3AF" stroke-width="40" opacity="0.2" filter="url(#shadow-blur)" />

            <!-- The Rim (Lip) -->
            <path d="M190,360 C190,390 250,410 300,410 C350,410 410,390 410,360 L410,350 C410,380 350,400 300,400 C250,400 190,380 190,350 Z" fill="url(#grad-ceramic-body)" />
            
            <!-- Front Specular Highlight -->
            <path d="M220,420 C220,500 260,540 300,540" stroke="white" stroke-width="8" fill="none" opacity="0.4" stroke-linecap="round" filter="url(#shadow-blur)" />
        </g>

        <!-- 4. SEAT & LID (Geometry Fix: Lid Open, Seat Down) -->
        <g id="seat-lid-group">
            <!-- 
              Geometry Logic: 
              The Lid is resting against the tank (Open).
              The Seat is resting on the bowl rim (Down).
            -->
            
            <!-- THE LID (Open, vertical against tank) -->
            <g id="lid-open">
                <!-- Side thickness of the lid -->
                <path d="M210,180 L210,60 C210,50 220,45 230,45 L370,45 C380,45 390,50 390,60 L390,180 Z" fill="#E5E7EB" />
                <!-- Top surface of the lid (facing camera) -->
                <path d="M215,180 L215,65 C215,55 225,50 235,50 L365,50 C375,50 385,55 385,65 L385,180 Z" fill="url(#grad-ceramic-body)" />
                <!-- Lid Highlight -->
                <path d="M220,170 L220,70 C220,60 225,55 230,55" stroke="white" stroke-width="4" fill="none" opacity="0.6" />
            </g>

            <!-- THE SEAT (Down, on bowl) -->
            <g id="seat-down">
                <!-- Seat Thickness (Underside shadow) -->
                <path d="M200,355 C200,375 250,395 300,395 C350,395 400,375 400,355 L395,345 C395,365 350,385 300,385 C250,385 205,365 205,345 Z" fill="#D1D5DB" />
                <!-- Seat Top Surface -->
                <path d="M205,345 C205,365 250,385 300,385 C350,385 395,365 395,345 C395,335 350,325 300,325 C250,325 205,335 205,345 Z" fill="url(#grad-ceramic-body)" />
                <!-- Seat Hole (Visual cue for depth) -->
                <path d="M240,355 C240,370 270,380 300,380 C330,380 360,370 360,355 C360,340 330,330 300,330 C270,330 240,340 240,355 Z" fill="#9CA3AF" opacity="0.1" />
                <!-- Seat Highlight -->
                <ellipse cx="300" cy="350" rx="50" ry="8" fill="white" opacity="0.3" />
            </g>
        </g>

        <!-- 5. INTERIOR WATER & ACTION (Hidden behind seat rim) -->
        <g id="interior">
            <!-- Water Surface -->
            <ellipse cx="300" cy="435" rx="110" ry="35" fill="url(#grad-water)" class="water-surface" id="waterSurface" />
            
            <!-- Vortex Effect -->
            <circle cx="300" cy="435" r="70" fill="url(#grad-vortex)" id="vortex" opacity="0" style="transform-origin: 300px 435px;" />

            <!-- Ripples -->
            <ellipse cx="300" cy="435" rx="100" ry="30" fill="none" stroke="#FFFFFF" class="ripple" id="ripple1" />
            <ellipse cx="300" cy="435" rx="100" ry="30" fill="none" stroke="#FFFFFF" class="ripple" id="ripple2" />
            <ellipse cx="300" cy="435" rx="100" ry="30" fill="none" stroke="#FFFFFF" class="ripple" id="ripple3" />

            <!-- Splash Particles -->
            <g id="splashGroup">
                <circle cx="280" cy="410" r="3" fill="#fff" class="splash-particle" style="--tx: -40px; --ty: -60px;" />
                <circle cx="320" cy="400" r="2" fill="#fff" class="splash-particle" style="--tx: 40px; --ty: -50px;" />
                <circle cx="300" cy="390" r="4" fill="#fff" class="splash-particle" style="--tx: 0px; --ty: -80px;" />
                <circle cx="290" cy="440" r="2" fill="#fff" class="splash-particle" style="--tx: -20px; --ty: -30px;" />
                <circle cx="310" cy="450" r="2" fill="#fff" class="splash-particle" style="--tx: 30px; --ty: -40px;" />
            </g>
        </g>

        <!-- 6. HANDLE (Foreground, Metallic, Enlarged) -->
        <g id="flusher">
            <!-- Handle Arm (Rod) -->
            <rect x="395" y="276" width="50" height="8" rx="4" fill="url(#grad-chrome)" class="handle-rod" />
            
            <!-- Handle Knob (Button/Head) -->
            <g class="handle-group" id="handleGroup">
                <!-- Base of knob -->
                <rect x="430" y="270" width="15" height="20" rx="2" fill="url(#grad-chrome)" />
                <!-- The Button Head -->
                <rect x="440" y="268" width="25" height="24" rx="4" fill="url(#grad-chrome)" stroke="#fff" stroke-width="0.5" />
                <!-- Button Highlight -->
                <rect x="442" y="270" width="20" height="3" rx="1" fill="white" opacity="0.6" />
            </g>
        </g>
    </svg>

    <div class="title-card">
        <h1>Aura Series 5</h1>
        <p>Hydro-Clean &bull; Silent Flush</p>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const waterSurface = document.getElementById('waterSurface');
        const vortex = document.getElementById('vortex');
        const ripples = [
            document.getElementById('ripple1'),
            document.getElementById('ripple2'),
            document.getElementById('ripple3')
        ];
        const particles = document.querySelectorAll('.splash-particle');
        const handleGroup = document.getElementById('handleGroup');
        
        let isFlushing = false;

        // Function to trigger the flush animation
        function triggerFlush() {
            if (isFlushing) return;
            isFlushing = true;

            // 1. Handle Physical Movement
            handleGroup.style.transition = 'transform 0.2s cubic-bezier(0.4, 0, 0.2, 1)';
            handleGroup.style.transform = 'rotate(15deg)';

            // 2. Water Drop & Vortex (Delayed slightly after handle press)
            setTimeout(() => {
                // Water level drops
                waterSurface.style.transition = 'transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
                waterSurface.style.transform = 'scale(0.5) translateY(40px)';

                // Vortex spins in
                vortex.style.animation = 'none';
                vortex.offsetHeight; /* trigger reflow */
                vortex.style.animation = 'vortex-spin 1.2s ease-in-out forwards';

                // Particles burst
                particles.forEach((p, i) => {
                    p.style.animation = `particle-burst 0.7s ease-out ${i * 0.05}s forwards`;
                });

                // Ripples expand
                ripples.forEach((r, i) => {
                    r.style.animation = `ripple-expand 1.5s ease-out ${i * 0.3}s forwards`;
                });

            }, 200); 

            // 3. Reset Handle
            setTimeout(() => {
                handleGroup.style.transform = 'rotate(0deg)';
            }, 400);

            // 4. Refill Sequence
            setTimeout(() => {
                // Reset Particles
                particles.forEach(p => {
                    p.style.animation = 'none';
                    p.style.opacity = '0';
                });

                // Reset Ripples
                ripples.forEach(r => {
                    r.style.animation = 'none';
                    r.style.transform = 'scale(0)';
                    r.style.opacity = '0';
                });

                // Water Refill (Slow rise)
                waterSurface.style.transition = 'transform 2.5s cubic-bezier(0.2, 0.8, 0.2, 1)';
                waterSurface.style.transform = 'scale(1) translateY(0)';

                // Cleanup
                setTimeout(() => {
                    vortex.style.opacity = '0';
                    isFlushing = false;
                }, 2500);

            }, 1400);
        }

        // Auto-play the animation on load to demonstrate
        setTimeout(triggerFlush, 1000);
        
        // Loop the animation every 8 seconds
        setInterval(triggerFlush, 8000);

        // Allow user to click handle to trigger manually
        handleGroup.addEventListener('click', triggerFlush);
    });
</script>
</body>
</html>
