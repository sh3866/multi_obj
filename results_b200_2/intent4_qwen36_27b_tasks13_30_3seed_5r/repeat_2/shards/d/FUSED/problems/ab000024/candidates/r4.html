<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura | The Modern Flush</title>
<style>
    :root {
        --bg-dark: #2A2B2E;
        --bg-gradient-start: #3E4045;
        --bg-gradient-end: #1A1A1C;
        --text-main: #F0F0F0;
        --text-muted: #A0A0A0;
        --accent-gold: #D4AF37;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--bg-dark);
        /* Warm ambient light gradient */
        background-image: radial-gradient(circle at 50% 20%, var(--bg-gradient-start) 0%, var(--bg-dark) 40%, var(--bg-gradient-end) 100%);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Layout: Centered Stage */
    .stage {
        width: 100%;
        height: 100%;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* SVG Container */
    .product-stage {
        width: 100%;
        max-width: 700px;
        height: auto;
        /* Soft diffuse contact shadow for grounding */
        filter: drop-shadow(0px 40px 60px rgba(0,0,0,0.6));
    }

    /* SVG Animation Classes */
    .water-surface {
        transform-origin: 300px 460px;
    }
    
    .handle-group {
        transform-origin: 405px 280px;
        cursor: pointer;
        transition: transform 0.1s ease;
    }

    .handle-group:hover {
        /* Subtle hover cue */
        filter: brightness(1.1);
    }

    .handle-group:active {
        transform: rotate(12deg);
    }

    .ripple {
        transform-origin: 300px 460px;
        transform: scale(0);
        opacity: 0;
    }

    .splash-particle {
        opacity: 0;
    }

    /* Keyframes */
    @keyframes whoosh-handle {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(12deg); }
    }

    @keyframes ripple-expand {
        0% { transform: scale(0.2); opacity: 0.8; stroke-width: 3px; }
        100% { transform: scale(2.5); opacity: 0; stroke-width: 0.5px; }
    }

    @keyframes vortex-spin {
        0% { transform: scale(0.1) rotate(0deg); opacity: 0; }
        20% { opacity: 0.9; }
        80% { opacity: 0.7; }
        100% { transform: scale(1.8) rotate(360deg); opacity: 0; }
    }

    @keyframes water-level-drop {
        0% { transform: scale(1) translateY(0); }
        100% { transform: scale(0.4) translateY(60px); }
    }

    @keyframes water-level-refill {
        0% { transform: scale(0.4) translateY(60px); }
        100% { transform: scale(1) translateY(0); }
    }

    @keyframes particle-burst {
        0% { transform: translate(0,0) scale(0.5); opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 0; }
    }

    /* Typography & Composition */
    .title-overlay {
        position: absolute;
        bottom: 8%;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 10;
        pointer-events: none;
    }

    /* Badge Style */
    .badge {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 12px 24px;
        border-radius: 30px;
        display: inline-block;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .title-overlay h1 {
        font-size: 1.2rem;
        font-weight: 600;
        letter-spacing: 0.2em; /* Tracked out */
        text-transform: uppercase;
        color: var(--text-main);
        margin: 0;
        text-shadow: 0px 2px 4px rgba(0,0,0,0.5);
    }

    .title-overlay p {
        font-size: 0.7rem;
        color: var(--text-muted);
        letter-spacing: 0.15em;
        font-weight: 400;
        margin-top: 4px;
        text-transform: uppercase;
    }

    /* Mobile Adjustments */
    @media (max-width: 600px) {
        .title-overlay { bottom: 5%; width: 90%; }
        .title-overlay h1 { font-size: 1rem; }
    }
</style>
</head>
<body>

<div class="stage">
    <svg class="product-stage" viewBox="0 0 600 750" preserveAspectRatio="xMidYMid meet">
        <defs>
            <!-- 
              MATERIAL REALISM: 
              Refined ceramic gradients for high-end finish.
            -->
            
            <!-- Main Body Ceramic: Sharp highlights, smooth shadows -->
            <linearGradient id="grad-ceramic-body" x1="15%" y1="0%" x2="85%" y2="100%">
                <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                <stop offset="15%" style="stop-color:#FFFFFF;stop-opacity:1" /> <!-- Sharp Rim Light -->
                <stop offset="30%" style="stop-color:#F8F8F8;stop-opacity:1" />
                <stop offset="80%" style="stop-color:#D8D8D8;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#B0B0B0;stop-opacity:1" /> <!-- Deep Shadow -->
            </linearGradient>

            <!-- Bowl Interior (Deep shadow) -->
            <linearGradient id="grad-ceramic-interior" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#707070;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#333333;stop-opacity:1" />
            </linearGradient>

            <!-- Chrome/Plumbing Gradient (High Contrast) -->
            <linearGradient id="grad-chrome" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#666;stop-opacity:1" />
                <stop offset="15%" style="stop-color:#EEE;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#444;stop-opacity:1" />
                <stop offset="85%" style="stop-color:#CCC;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#333;stop-opacity:1" />
            </linearGradient>

            <!-- Water Gradient (Realistic depth) -->
            <linearGradient id="grad-water" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#E0F7FA;stop-opacity:0.9" />
                <stop offset="50%" style="stop-color:#4DD0E1;stop-opacity:0.85" />
                <stop offset="100%" style="stop-color:#00BCD4;stop-opacity:0.95" />
            </linearGradient>
            
            <!-- Vortex Gradient -->
            <radialGradient id="grad-vortex" cx="50%" cy="50%" r="50%">
                <stop offset="0%" style="stop-color:#006064;stop-opacity:0.9" />
                <stop offset="40%" style="stop-color:#0097A7;stop-opacity:0.5" />
                <stop offset="100%" style="stop-color:#E0F7FA;stop-opacity:0" />
            </radialGradient>

            <!-- Shadow Blur -->
            <filter id="shadow-blur" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="4" />
            </filter>
        </defs>

        <!-- 1. FLOOR & BASE PLUMBING (Subtle Trapway) -->
        <g id="base-plumbing">
            <!-- Floor Shadow -->
            <ellipse cx="300" cy="690" rx="160" ry="12" fill="#000000" opacity="0.5" filter="url(#shadow-blur)" />
            
            <!-- Wall Connection / Trapway Curve -->
            <path d="M280,680 L280,640 C280,620 300,620 300,640 L300,680" fill="url(#grad-chrome)" opacity="0.8"/>
            <circle cx="300" cy="680" r="10" fill="#222" opacity="0.9"/>
        </g>

        <!-- 2. TANK (Back Layer) -->
        <g id="tank">
            <!-- Tank Body -->
            <path d="M220,200 L380,200 C390,200 395,205 395,215 L395,410 C395,420 390,425 380,425 L220,425 C210,425 205,420 205,410 L205,215 C205,205 210,200 220,200 Z" fill="url(#grad-ceramic-body)" />
            
            <!-- Tank Lid -->
            <g id="tank-lid">
                <!-- Side Edge -->
                <path d="M215,195 L385,195 C392,195 398,200 398,205 L398,210 L202,210 L202,205 C202,200 208,195 215,195 Z" fill="#E0E0E0" />
                <!-- Top Surface -->
                <path d="M215,195 L385,195 C392,195 398,200 398,205 L202,205 C202,200 208,195 215,195 Z" fill="#FFFFFF" />
            </g>

            <!-- GLOSSY HIGHLIGHTS (Rim Light) -->
            <!-- Left Edge -->
            <path d="M212,215 L212,400 C212,410 215,415 222,415" stroke="white" stroke-width="8" fill="none" opacity="0.9" stroke-linecap="round" filter="url(#shadow-blur)" />
            <!-- Top Edge -->
            <path d="M220,202 L380,202" stroke="white" stroke-width="2" fill="none" opacity="0.8" />
        </g>

        <!-- 3. BOWL (Middle Layer) -->
        <g id="bowl-group">
            <!-- Main Bowl Shape -->
            <path d="M205,415 C205,540 245,600 300,600 C355,600 395,540 395,415 L395,380 C395,360 375,350 345,350 L255,350 C225,350 205,360 205,380 Z" fill="url(#grad-ceramic-body)" />
            
            <!-- Interior Shadow -->
            <path d="M215,415 C215,520 245,570 300,570 C355,570 385,520 385,415" fill="none" stroke="#000000" stroke-width="50" opacity="0.15" filter="url(#shadow-blur)" />

            <!-- The Rim (Lip) -->
            <path d="M195,380 C195,410 255,430 300,430 C345,430 405,410 405,380 L405,370 C405,400 345,420 300,420 C255,420 195,400 195,370 Z" fill="url(#grad-ceramic-body)" />
            
            <!-- Front Specular Highlight -->
            <path d="M230,440 C230,520 270,560 300,560" stroke="white" stroke-width="6" fill="none" opacity="0.3" stroke-linecap="round" filter="url(#shadow-blur)" />
        </g>

        <!-- 4. SEAT & LID -->
        <g id="seat-lid-group">
            <!-- THE LID (Open, vertical) -->
            <g id="lid-open">
                <!-- Side thickness -->
                <path d="M215,200 L215,80 C215,70 225,65 235,65 L365,65 C375,65 385,70 385,80 L385,200 Z" fill="#EAEAEA" />
                <!-- Top Surface -->
                <path d="M220,200 L220,85 C220,75 230,70 240,70 L360,70 C370,70 380,75 380,85 L380,200 Z" fill="url(#grad-ceramic-body)" />
                <!-- Lid Highlight -->
                <path d="M225,190 L225,90 C225,80 230,75 235,75" stroke="white" stroke-width="4" fill="none" opacity="0.7" />
            </g>

            <!-- THE SEAT (Down) -->
            <g id="seat-down">
                <!-- Seat Thickness -->
                <path d="M205,375 C205,395 255,415 300,415 C345,415 395,395 395,375 L390,365 C390,385 345,405 300,405 C255,405 210,385 210,365 Z" fill="#D0D0D0" />
                <!-- Seat Top Surface -->
                <path d="M210,365 C210,385 255,405 300,405 C345,405 390,385 390,365 C390,355 345,345 300,345 C255,345 210,355 210,365 Z" fill="url(#grad-ceramic-body)" />
                <!-- Seat Hole -->
                <path d="M245,375 C245,390 275,400 300,400 C325,400 355,390 355,375 C355,360 325,350 300,350 C275,350 245,360 245,375 Z" fill="#444444" opacity="0.2" />
                <!-- Seat Highlight -->
                <ellipse cx="300" cy="370" rx="55" ry="8" fill="white" opacity="0.4" />
            </g>
        </g>

        <!-- 5. INTERIOR WATER & ACTION -->
        <g id="interior">
            <!-- Realistic Water Surface -->
            <ellipse cx="300" cy="460" rx="105" ry="32" fill="url(#grad-water)" class="water-surface" id="waterSurface" />
            
            <!-- Reflection Line -->
            <ellipse cx="300" cy="460" rx="80" ry="20" fill="none" stroke="white" stroke-width="1" opacity="0.4" class="water-surface" />

            <!-- Vortex Effect -->
            <circle cx="300" cy="460" r="70" fill="url(#grad-vortex)" id="vortex" opacity="0" style="transform-origin: 300px 460px;" />

            <!-- Ripples -->
            <ellipse cx="300" cy="460" rx="90" ry="25" fill="none" stroke="#FFFFFF" class="ripple" id="ripple1" />
            <ellipse cx="300" cy="460" rx="90" ry="25" fill="none" stroke="#FFFFFF" class="ripple" id="ripple2" />
            <ellipse cx="300" cy="460" rx="90" ry="25" fill="none" stroke="#FFFFFF" class="ripple" id="ripple3" />

            <!-- Splash Particles -->
            <g id="splashGroup">
                <circle cx="280" cy="430" r="3" fill="#E0F7FA" class="splash-particle" style="--tx: -50px; --ty: -70px;" />
                <circle cx="320" cy="420" r="2" fill="#E0F7FA" class="splash-particle" style="--tx: 50px; --ty: -60px;" />
                <circle cx="300" cy="410" r="4" fill="#E0F7FA" class="splash-particle" style="--tx: 0px; --ty: -90px;" />
                <circle cx="290" cy="460" r="2" fill="#E0F7FA" class="splash-particle" style="--tx: -30px; --ty: -40px;" />
                <circle cx="310" cy="470" r="2" fill="#E0F7FA" class="splash-particle" style="--tx: 40px; --ty: -50px;" />
            </g>
        </g>

        <!-- 6. HANDLE (Foreground, Metallic) -->
        <g id="flusher">
            <!-- Handle Arm -->
            <rect x="395" y="276" width="50" height="8" rx="4" fill="url(#grad-chrome)" />
            
            <!-- Handle Knob -->
            <g class="handle-group" id="handleGroup">
                <!-- Base -->
                <rect x="430" y="270" width="12" height="20" rx="2" fill="url(#grad-chrome)" />
                <!-- Button Head -->
                <rect x="438" y="268" width="22" height="24" rx="4" fill="url(#grad-chrome)" stroke="#fff" stroke-width="0.5" />
                <!-- Button Highlight -->
                <rect x="440" y="270" width="18" height="2" rx="1" fill="white" opacity="0.8" />
            </g>
        </g>
    </svg>

    <div class="title-overlay">
        <div class="badge">
            <h1>Aura Series 5</h1>
            <p>Hydro-Clean &bull; Silent Flush</p>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const waterSurface = document.getElementById('waterSurface');
        const vortex = document.getElementById('vortex');
        const ripples = [
            document.getElementById('ripple1'),
            document.getElementById('ripple2'),
            document.getElementById('ripple3')
        ];
        const particles = document.querySelectorAll('.splash-particle');
        const handleGroup = document.getElementById('handleGroup');
        
        let isFlushing = false;

        // Function to trigger the flush animation
        function triggerFlush() {
            if (isFlushing) return;
            isFlushing = true;

            // 1. Handle Physical Movement
            handleGroup.style.transition = 'transform 0.15s cubic-bezier(0.4, 0, 0.2, 1)';
            handleGroup.style.transform = 'rotate(12deg)';

            // 2. Water Drop & Vortex (Delayed slightly after handle press)
            setTimeout(() => {
                // Water level drops
                waterSurface.style.transition = 'transform 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
                waterSurface.style.transform = 'scale(0.4) translateY(60px)';

                // Vortex spins in
                vortex.style.animation = 'none';
                vortex.offsetHeight; /* trigger reflow */
                vortex.style.animation = 'vortex-spin 1.2s ease-in-out forwards';

                // Particles burst
                particles.forEach((p, i) => {
                    p.style.animation = `particle-burst 0.7s ease-out ${i * 0.05}s forwards`;
                });

                // Ripples expand
                ripples.forEach((r, i) => {
                    r.style.animation = `ripple-expand 1.5s ease-out ${i * 0.3}s forwards`;
                });

            }, 200); 

            // 3. Reset Handle
            setTimeout(() => {
                handleGroup.style.transform = 'rotate(0deg)';
            }, 400);

            // 4. Refill Sequence
            setTimeout(() => {
                // Reset Particles
                particles.forEach(p => {
                    p.style.animation = 'none';
                    p.style.opacity = '0';
                });

                // Reset Ripples
                ripples.forEach(r => {
                    r.style.animation = 'none';
                    r.style.transform = 'scale(0)';
                    r.style.opacity = '0';
                });

                // Water Refill (Slow rise)
                waterSurface.style.transition = 'transform 2.5s cubic-bezier(0.2, 0.8, 0.2, 1)';
                waterSurface.style.transform = 'scale(1) translateY(0)';

                // Cleanup
                setTimeout(() => {
                    vortex.style.opacity = '0';
                    isFlushing = false;
                }, 2500);

            }, 1400);
        }

        // Auto-play the animation on load to demonstrate
        setTimeout(triggerFlush, 1000);
        
        // Loop the animation every 8 seconds
        setInterval(triggerFlush, 8000);

        // Allow user to click handle to trigger manually
        handleGroup.addEventListener('click', triggerFlush);
    });
</script>
</body>
</html>
