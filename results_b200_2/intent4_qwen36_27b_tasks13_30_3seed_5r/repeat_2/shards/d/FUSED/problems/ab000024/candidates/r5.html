<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Series 5 | Product Illustration</title>
<style>
    :root {
        --bg-wall: #EBEBEB;
        --bg-floor: #D1D1D1;
        --text-dark: #222222;
        --text-muted: #666666;
        --accent-blue: #00A8E8;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        /* Critique: Ground the composition with a split background (Wall/Floor) */
        background: linear-gradient(to bottom, var(--bg-wall) 0%, var(--bg-wall) 65%, var(--bg-floor) 65%, var(--bg-floor) 100%);
        color: var(--text-dark);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* Critique: Subtle background texture (Tile Grid) */
    .bg-texture {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 65%; /* Only on the wall */
        background-image: 
            linear-gradient(to right, rgba(0,0,0,0.03) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(0,0,0,0.03) 1px, transparent 1px);
        background-size: 100px 100px;
        pointer-events: none;
        z-index: 0;
    }

    /* Layout: Centered Stage */
    .stage {
        width: 100%;
        height: 100%;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1;
    }

    /* SVG Container */
    .product-stage {
        width: 100%;
        max-width: 750px; /* Slightly wider for better context */
        height: auto;
        /* Critique: Grounding shadow applied via SVG, but keep a soft drop shadow for the whole object */
        filter: drop-shadow(0px 20px 40px rgba(0,0,0,0.15));
    }

    /* SVG Animation Classes */
    .water-surface {
        transform-origin: 300px 480px;
    }
    
    .handle-group {
        transform-origin: 405px 280px;
        cursor: pointer;
        transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .handle-group:hover {
        filter: brightness(1.05);
    }

    .handle-group:active {
        transform: rotate(12deg);
    }

    .ripple {
        transform-origin: 300px 480px;
        transform: scale(0);
        opacity: 0;
    }

    .splash-particle {
        opacity: 0;
    }

    /* Keyframes */
    @keyframes ripple-expand {
        0% { transform: scale(0.2); opacity: 0.8; stroke-width: 2px; }
        100% { transform: scale(2.2); opacity: 0; stroke-width: 0.5px; }
    }

    @keyframes vortex-spin {
        0% { transform: scale(0.1) rotate(0deg); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.6; }
        100% { transform: scale(1.6) rotate(360deg); opacity: 0; }
    }

    @keyframes particle-burst {
        0% { transform: translate(0,0) scale(0.5); opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 0; }
    }

    /* Typography & Composition */
    .title-overlay {
        position: absolute;
        bottom: 6%;
        right: 5%; /* Shifted right for asymmetry */
        text-align: right;
        z-index: 10;
        pointer-events: none;
    }

    /* Critique: Product card aesthetic, subtle integration */
    .badge {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        padding: 16px 28px;
        border-radius: 4px;
        display: inline-block;
        box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }

    .title-overlay h1 {
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--text-dark);
        margin: 0;
    }

    .title-overlay p {
        font-size: 0.75rem;
        color: var(--text-muted);
        letter-spacing: 0.05em;
        font-weight: 400;
        margin-top: 6px;
        text-transform: uppercase;
    }

    /* Mobile Adjustments */
    @media (max-width: 600px) {
        .title-overlay { bottom: 3%; right: 50%; transform: translateX(50%); text-align: center; width: 90%; }
        .product-stage { max-width: 90%; }
    }
</style>
</head>
<body>

<div class="bg-texture"></div>

<div class="stage">
    <!-- ViewBox adjusted to accommodate floor plane better -->
    <svg class="product-stage" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid meet">
        <defs>
            <!-- 
              MATERIAL REALISM: 
              Multi-stop radial gradients for ceramic depth and gloss.
            -->
            
            <!-- Main Body Ceramic: Complex reflection mapping -->
            <radialGradient id="grad-ceramic-body" cx="35%" cy="40%" r="80%">
                <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                <stop offset="20%" style="stop-color:#FFFFFF;stop-opacity:1" /> <!-- Bright Specular -->
                <stop offset="50%" style="stop-color:#F2F2F2;stop-opacity:1" />
                <stop offset="85%" style="stop-color:#D0D0D0;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#A8A8A8;stop-opacity:1" /> <!-- Deep Shadow -->
            </radialGradient>

            <!-- Bowl Interior (Deep recess) -->
            <linearGradient id="grad-ceramic-interior" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#888888;stop-opacity:1" />
                <stop offset="40%" style="stop-color:#444444;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#222222;stop-opacity:1" />
            </linearGradient>

            <!-- Chrome/Plumbing Gradient (Sharp reflections) -->
            <linearGradient id="grad-chrome" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#888;stop-opacity:1" />
                <stop offset="20%" style="stop-color:#FFF;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#555;stop-opacity:1" />
                <stop offset="80%" style="stop-color:#DDD;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#444;stop-opacity:1" />
            </linearGradient>

            <!-- Water Gradient (Dynamic depth) -->
            <linearGradient id="grad-water" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#E0F7FA;stop-opacity:0.95" />
                <stop offset="50%" style="stop-color:#4DD0E1;stop-opacity:0.9" />
                <stop offset="100%" style="stop-color:#0097A7;stop-opacity:0.95" />
            </linearGradient>
            
            <!-- Vortex Gradient -->
            <radialGradient id="grad-vortex" cx="50%" cy="50%" r="50%">
                <stop offset="0%" style="stop-color:#006064;stop-opacity:0.9" />
                <stop offset="40%" style="stop-color:#0097A7;stop-opacity:0.5" />
                <stop offset="100%" style="stop-color:#E0F7FA;stop-opacity:0" />
            </radialGradient>

            <!-- Shadow Blur -->
            <filter id="shadow-blur" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="5" />
            </filter>
            
            <!-- Floor Shadow Blur -->
            <filter id="floor-shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="15" />
            </filter>

            <!-- Blur for reflection -->
            <filter id="reflection-blur" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="4" />
            </filter>
        </defs>

        <!-- 1. FLOOR PLANE & SHADOW (Grounding) -->
        <g id="floor-context">
            <!-- Floor Line -->
            <line x1="0" y1="680" x2="600" y2="680" stroke="#C0C0C0" stroke-width="1" opacity="0.5" />
            
            <!-- Ground Shadow -->
            <ellipse cx="300" cy="680" rx="180" ry="25" fill="#000000" opacity="0.2" filter="url(#floor-shadow)" />
        </g>

        <!-- 2. PLUMBING BASE (More substantial) -->
        <g id="base-plumbing">
            <!-- Wall Trapway Connection -->
            <path d="M285,680 L285,650 C285,635 315,635 315,650 L315,680" fill="url(#grad-chrome)" />
            <!-- Flange Connection -->
            <path d="M270,680 L330,680 L325,670 L275,670 Z" fill="#888" />
            <rect x="295" y="670" width="10" height="10" fill="#333" opacity="0.3" />
        </g>

        <!-- 3. TANK (Back Layer) -->
        <g id="tank">
            <!-- Tank Body -->
            <path d="M220,200 L380,200 C392,200 398,208 398,220 L398,410 C398,422 392,428 380,428 L220,428 C208,428 202,422 202,410 L202,220 C202,208 208,200 220,200 Z" fill="url(#grad-ceramic-body)" />
            
            <!-- Tank Lid -->
            <g id="tank-lid">
                <!-- Top Surface -->
                <path d="M212,195 L388,195 C395,195 400,200 400,205 L200,205 C200,200 205,195 212,195 Z" fill="#FFFFFF" />
                <!-- Edge -->
                <path d="M200,205 L400,205 L398,212 L202,212 Z" fill="#E8E8E8" />
            </g>

            <!-- GLOSSY HIGHLIGHTS (Rim Light) -->
            <!-- Left Edge Highlight -->
            <path d="M208,220 L208,405 C208,415 212,420 220,420" stroke="white" stroke-width="6" fill="none" opacity="0.9" stroke-linecap="round" filter="url(#shadow-blur)" />
            <!-- Top Rim Highlight -->
            <path d="M215,198 L385,198" stroke="white" stroke-width="2" fill="none" opacity="0.9" />
        </g>

        <!-- 4. BOWL (Middle Layer) -->
        <g id="bowl-group">
            <!-- Main Bowl Shape -->
            <path d="M202,418 C202,550 245,610 300,610 C355,610 398,550 398,418 L398,385 C398,365 378,355 348,355 L252,355 C222,355 202,365 202,385 Z" fill="url(#grad-ceramic-body)" />
            
            <!-- Interior Depth Shadow -->
            <path d="M215,420 C215,530 245,580 300,580 C355,580 385,530 385,420" fill="none" stroke="#000000" stroke-width="40" opacity="0.15" filter="url(#shadow-blur)" />

            <!-- The Rim (Lip) -->
            <path d="M192,385 C192,415 255,435 300,435 C345,435 408,415 408,385 L408,375 C408,405 345,425 300,425 C255,425 192,405 192,375 Z" fill="url(#grad-ceramic-body)" />
            
            <!-- Front Specular Highlight -->
            <path d="M235,450 C235,530 270,570 300,570" stroke="white" stroke-width="8" fill="none" opacity="0.4" stroke-linecap="round" filter="url(#shadow-blur)" />
        </g>

        <!-- 5. SEAT & LID (Refined Anatomy) -->
        <g id="seat-lid-group">
            <!-- THE LID (Open, vertical) -->
            <g id="lid-open">
                <!-- Side thickness (Darker) -->
                <path d="M215,200 L215,70 C215,60 225,55 235,55 L365,55 C375,55 385,60 385,70 L385,200 Z" fill="#E0E0E0" />
                <!-- Top Surface -->
                <path d="M220,200 L220,75 C220,65 230,60 240,60 L360,60 C370,60 380,65 380,75 L380,200 Z" fill="url(#grad-ceramic-body)" />
                <!-- Lid Highlight -->
                <path d="M225,190 L225,80 C225,70 230,65 235,65" stroke="white" stroke-width="4" fill="none" opacity="0.7" />
            </g>

            <!-- THE SEAT (Down) - Clearly resting on rim -->
            <g id="seat-down">
                <!-- Seat Thickness (Side) -->
                <path d="M205,378 C205,398 255,418 300,418 C345,418 395,398 395,378 L390,368 C390,388 345,408 300,408 C255,408 210,388 210,368 Z" fill="#D0D0D0" />
                <!-- Seat Top Surface -->
                <path d="M210,368 C210,388 255,408 300,408 C345,408 390,388 390,368 C390,358 345,348 300,348 C255,348 210,358 210,368 Z" fill="url(#grad-ceramic-body)" />
                <!-- Seat Hole (Shadow) -->
                <path d="M245,378 C245,393 275,403 300,403 C325,403 355,393 355,378 C355,363 325,353 300,353 C275,353 245,363 245,378 Z" fill="#444444" opacity="0.15" filter="url(#shadow-blur)" />
                <!-- Seat Highlight -->
                <ellipse cx="300" cy="373" rx="55" ry="8" fill="white" opacity="0.5" />
            </g>
        </g>

        <!-- 6. INTERIOR WATER & ACTION (Dynamic Swirl) -->
        <g id="interior">
            <!-- Realistic Water Surface -->
            <ellipse cx="300" cy="480" rx="105" ry="32" fill="url(#grad-water)" class="water-surface" id="waterSurface" />
            
            <!-- Reflection Line -->
            <ellipse cx="300" cy="480" rx="80" ry="20" fill="none" stroke="white" stroke-width="1.5" opacity="0.5" class="water-surface" />

            <!-- Vortex Effect -->
            <circle cx="300" cy="480" r="70" fill="url(#grad-vortex)" id="vortex" opacity="0" style="transform-origin: 300px 480px;" />

            <!-- Ripples -->
            <ellipse cx="300" cy="480" rx="90" ry="25" fill="none" stroke="#FFFFFF" class="ripple" id="ripple1" />
            <ellipse cx="300" cy="480" rx="90" ry="25" fill="none" stroke="#FFFFFF" class="ripple" id="ripple2" />
            <ellipse cx="300" cy="480" rx="90" ry="25" fill="none" stroke="#FFFFFF" class="ripple" id="ripple3" />

            <!-- Splash Particles -->
            <g id="splashGroup">
                <circle cx="280" cy="450" r="3" fill="#E0F7FA" class="splash-particle" style="--tx: -50px; --ty: -70px;" />
                <circle cx="320" cy="440" r="2" fill="#E0F7FA" class="splash-particle" style="--tx: 50px; --ty: -60px;" />
                <circle cx="300" cy="430" r="4" fill="#E0F7FA" class="splash-particle" style="--tx: 0px; --ty: -90px;" />
                <circle cx="290" cy="480" r="2" fill="#E0F7FA" class="splash-particle" style="--tx: -30px; --ty: -40px;" />
                <circle cx="310" cy="490" r="2" fill="#E0F7FA" class="splash-particle" style="--tx: 40px; --ty: -50px;" />
            </g>
        </g>

        <!-- 7. HANDLE (Foreground, Metallic) -->
        <g id="flusher">
            <!-- Handle Arm -->
            <rect x="398" y="276" width="50" height="8" rx="4" fill="url(#grad-chrome)" />
            
            <!-- Handle Knob -->
            <g class="handle-group" id="handleGroup">
                <!-- Base -->
                <rect x="432" y="270" width="12" height="20" rx="2" fill="url(#grad-chrome)" />
                <!-- Button Head -->
                <rect x="440" y="268" width="24" height="24" rx="4" fill="url(#grad-chrome)" stroke="#fff" stroke-width="0.5" />
                <!-- Button Highlight -->
                <rect x="442" y="270" width="20" height="2" rx="1" fill="white" opacity="0.8" />
            </g>
        </g>
    </svg>

    <div class="title-overlay">
        <div class="badge">
            <h1>Aura Series 5</h1>
            <p>Hydro-Clean &bull; Silent Flush</p>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const waterSurface = document.getElementById('waterSurface');
        const vortex = document.getElementById('vortex');
        const ripples = [
            document.getElementById('ripple1'),
            document.getElementById('ripple2'),
            document.getElementById('ripple3')
        ];
        const particles = document.querySelectorAll('.splash-particle');
        const handleGroup = document.getElementById('handleGroup');
        
        let isFlushing = false;

        // Function to trigger the flush animation
        function triggerFlush() {
            if (isFlushing) return;
            isFlushing = true;

            // 1. Handle Physical Movement
            handleGroup.style.transition = 'transform 0.15s cubic-bezier(0.4, 0, 0.2, 1)';
            handleGroup.style.transform = 'rotate(12deg)';

            // 2. Water Drop & Vortex (Delayed slightly after handle press)
            setTimeout(() => {
                // Water level drops
                waterSurface.style.transition = 'transform 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
                waterSurface.style.transform = 'scale(0.4) translateY(60px)';

                // Vortex spins in
                vortex.style.animation = 'none';
                vortex.offsetHeight; /* trigger reflow */
                vortex.style.animation = 'vortex-spin 1.2s ease-in-out forwards';

                // Particles burst
                particles.forEach((p, i) => {
                    p.style.animation = `particle-burst 0.7s ease-out ${i * 0.05}s forwards`;
                });

                // Ripples expand
                ripples.forEach((r, i) => {
                    r.style.animation = `ripple-expand 1.5s ease-out ${i * 0.3}s forwards`;
                });

            }, 200); 

            // 3. Reset Handle
            setTimeout(() => {
                handleGroup.style.transform = 'rotate(0deg)';
            }, 400);

            // 4. Refill Sequence
            setTimeout(() => {
                // Reset Particles
                particles.forEach(p => {
                    p.style.animation = 'none';
                    p.style.opacity = '0';
                });

                // Reset Ripples
                ripples.forEach(r => {
                    r.style.animation = 'none';
                    r.style.transform = 'scale(0)';
                    r.style.opacity = '0';
                });

                // Water Refill (Slow rise)
                waterSurface.style.transition = 'transform 2.5s cubic-bezier(0.2, 0.8, 0.2, 1)';
                waterSurface.style.transform = 'scale(1) translateY(0)';

                // Cleanup
                setTimeout(() => {
                    vortex.style.opacity = '0';
                    isFlushing = false;
                }, 2500);

            }, 1400);
        }

        // Auto-play the animation on load to demonstrate
        setTimeout(triggerFlush, 1000);
        
        // Loop the animation every 8 seconds
        setInterval(triggerFlush, 8000);

        // Allow user to click handle to trigger manually
        handleGroup.addEventListener('click', triggerFlush);
    });
</script>
</body>
</html>
