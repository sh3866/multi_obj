<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce: Glitch Quest</title>
    <style>
        :root {
            --sky-top: #87CEEB;
            --sky-mid: #E0F6FF;
            --sky-bot: #FFF8E1;
            --grass: #32CD32;
            --grass-dark: #228B22;
            --dirt: #8B4513;
            --accent-pink: #FF1493;
            --accent-cyan: #00FFFF;
            --accent-yellow: #FFD700;
            --accent-red: #FF4500;
            --font-main: 'Segoe UI', 'Arial Black', sans-serif;
            --font-display: 'Arial Black', Impact, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--sky-top);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            color: white;
        }

        /* --- CANVAS BACKGROUND --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* --- UI OVERLAY --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-rows: 80px 1fr 60px;
            grid-template-columns: 1fr 1fr; /* Split for centering */
            pointer-events: none;
        }

        /* --- TOP BAR (Consolidated Stats) --- */
        .top-bar {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            pointer-events: auto;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), transparent);
        }

        .game-logo {
            font-family: var(--font-display);
            font-size: 3rem;
            color: var(--accent-yellow);
            text-transform: uppercase;
            /* 3D Bubbly Effect */
            text-shadow: 
                3px 3px 0px var(--accent-pink),
                6px 6px 0px #000,
                -1px -1px 0 #fff;
            transform: skew(-5deg) rotate(-2deg);
            letter-spacing: 2px;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.3));
        }

        .stats-container {
            display: flex;
            gap: 20px;
        }

        .stat-pill {
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid #000;
            border-radius: 50px;
            padding: 5px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            color: #333;
            font-weight: 900;
            font-size: 1.1rem;
        }

        .stat-icon { font-size: 1.2rem; }

        /* --- MAIN CONTENT AREA --- */
        .main-content {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: center; /* Center the card */
            position: relative;
            pointer-events: none;
        }

        /* --- HERO CARD --- */
        .hero-card {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 4px solid #000;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.2);
            max-width: 450px;
            width: 90%;
            color: #333;
            position: relative;
            /* Animation */
            animation: floatCard 4s ease-in-out infinite;
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(1deg); }
        }

        .world-badge {
            background: var(--accent-pink);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 2px 2px 0 #000;
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: 2rem;
            color: #000;
            margin-bottom: 10px;
            line-height: 1.1;
        }

        .hero-desc {
            font-size: 1rem;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* --- START BUTTON (Game Interaction) --- */
        .start-btn {
            background: var(--accent-cyan);
            color: #000;
            border: 3px solid #000;
            padding: 15px 50px;
            font-size: 1.5rem;
            font-family: var(--font-display);
            text-transform: uppercase;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 6px 0 #005f63; /* 3D depth */
            transition: all 0.1s;
            width: 100%;
        }

        .start-btn:hover {
            background: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #005f63;
        }

        .start-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #005f63;
        }

        /* --- SIDE PANELS (Right Side Grouping) --- */
        .panel-right {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            pointer-events: auto;
            width: 280px;
        }

        .panel-box {
            background: rgba(0, 0, 0, 0.7);
            border: 3px solid white;
            border-radius: 15px;
            padding: 20px;
            color: white;
            backdrop-filter: blur(5px);
        }

        .panel-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-yellow);
            margin-bottom: 10px;
            font-weight: bold;
        }

        /* Controls */
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .control-row:last-child { margin-bottom: 0; }

        .key {
            background: #eee;
            color: #333;
            border: 2px solid #999;
            border-bottom: 4px solid #666;
            border-radius: 6px;
            padding: 4px 10px;
            font-family: monospace;
            font-weight: bold;
            font-size: 0.9rem;
            min-width: 30px;
            text-align: center;
        }

        .world-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .world-name {
            font-weight: bold;
            font-size: 1.2rem;
        }

        .world-nav {
            display: flex;
            gap: 5px;
        }
        .nav-btn {
            background: var(--accent-pink);
            border: 2px solid white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
        }
        .nav-btn:hover { background: white; color: var(--accent-pink); }

        /* --- HERO SPRITE (CSS) --- */
        /* We position this absolute so it sits "in" the world, not in the card */
        .hero-sprite-wrapper {
            position: absolute;
            left: 15%;
            bottom: 12%; /* Sit on the "ground" */
            width: 120px;
            height: 140px;
            z-index: 5;
            pointer-events: none;
            /* Bounce Animation */
            animation: heroBounce 1.5s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
        }

        @keyframes heroBounce {
            0%, 100% { transform: translateY(0) scaleY(1); }
            10% { transform: translateY(0) scaleY(1.1) scaleX(0.9); } /* Squat */
            50% { transform: translateY(-60px) scaleY(1.1); } /* Jump */
            60% { transform: translateY(-60px) scaleY(0.9); } /* Stretch air */
            90% { transform: translateY(0) scaleY(0.9) scaleX(1.1); } /* Land squash */
        }

        /* CSS Hero Construction */
        .hero-body {
            width: 80px;
            height: 80px;
            background: var(--accent-cyan);
            border-radius: 40%;
            border: 3px solid #000;
            position: absolute;
            bottom: 0;
            left: 20px;
            box-shadow: inset -5px -5px 0 rgba(0,0,0,0.2);
        }
        
        .hero-face {
            width: 60px;
            height: 45px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 15px;
            left: 10px;
            border: 2px solid #000;
        }

        .hero-eyes {
            display: flex;
            gap: 15px;
            position: absolute;
            top: 12px;
            left: 15px;
        }
        .eye {
            width: 10px;
            height: 16px;
            background: #000;
            border-radius: 50%;
        }

        .hero-shoes {
            width: 90px;
            height: 20px;
            background: var(--accent-red);
            border-radius: 10px 10px 20px 20px;
            position: absolute;
            bottom: -10px;
            left: 15px;
            border: 2px solid #000;
            z-index: -1;
        }

        .hero-scarf {
            width: 40px;
            height: 15px;
            background: var(--accent-pink);
            position: absolute;
            top: 5px;
            right: -20px;
            border-radius: 5px;
            transform-origin: left center;
            animation: scarfFlow 1s ease-in-out infinite alternate;
            border: 2px solid #000;
        }

        @keyframes scarfFlow {
            from { transform: rotate(10deg) translateX(0); }
            to { transform: rotate(30deg) translateX(10px); }
        }

        /* --- FOOTER --- */
        footer {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            pointer-events: auto;
            padding-bottom: 10px;
        }

        .social-link {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            border: 3px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            transition: 0.2s;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }
        .social-link:hover { transform: translateY(-3px); box-shadow: 0 7px 0 rgba(0,0,0,0.2); background: var(--accent-yellow); }

        /* Responsive */
        @media (max-width: 900px) {
            .panel-right { display: none; }
            .game-logo { font-size: 2rem; }
            .hero-sprite-wrapper { left: 5%; bottom: 15%; transform: scale(0.8); }
        }
    </style>
</head>
<body>

    <!-- Background Canvas (The World) -->
    <canvas id="bg-canvas"></canvas>

    <!-- The Hero Character (CSS Layer) -->
    <div class="hero-sprite-wrapper">
        <div class="hero-body">
            <div class="hero-face">
                <div class="hero-eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
            </div>
            <div class="hero-scarf"></div>
        </div>
        <div class="hero-shoes"></div>
    </div>

    <!-- UI Overlay -->
    <div class="ui-layer">
        
        <!-- Top Bar: Logo & Stats -->
        <header class="top-bar">
            <div class="game-logo">Bounce!</div>
            
            <div class="stats-container">
                <div class="stat-pill">
                    <span class="stat-icon">🪙</span>
                    <span>240</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-icon">💎</span>
                    <span>12</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-icon">❤️</span>
                    <span>3</span>
                </div>
            </div>
        </header>

        <!-- Main Center -->
        <div class="main-content">
            <div class="hero-card">
                <div class="world-badge">World 1-1</div>
                <h1 class="hero-title">Neon Valley</h1>
                <p class="hero-desc">
                    The glitch-bats have taken over the grid! Jump high and bounce back to save the system.
                </p>
                <button class="start-btn" onclick="startGame()">Start Adventure</button>
            </div>
        </div>

        <!-- Right Panel: Controls & World Select -->
        <div class="panel-right">
            
            <!-- World Selector -->
            <div class="panel-box">
                <div class="panel-title">Select Sector</div>
                <div class="world-selector">
                    <div class="world-name">Neon Valley</div>
                    <div class="world-nav">
                        <div class="nav-btn">◄</div>
                        <div class="nav-btn">►</div>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="panel-box">
                <div class="panel-title">Controls</div>
                <div class="control-row">
                    <span>Jump</span>
                    <div class="key">Z</div>
                </div>
                <div class="control-row">
                    <span>Super Bounce</span>
                    <div class="key">X</div>
                </div>
                <div class="control-row">
                    <span>Move</span>
                    <div style="display:flex; gap:2px;">
                        <div class="key">←</div>
                        <div class="key">→</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            <div class="social-link">🐦</div>
            <div class="social-link">📷</div>
            <div class="social-link">🎮</div>
        </footer>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const colors = {
            sky: ['#87CEEB', '#E0F6FF'],
            grass: '#32CD32',
            grassDark: '#228B22',
            dirt: '#8B4513',
            dirtDark: '#5D4037',
            block: '#FF8C00',
            blockQ: '#FFD700',
            coin: '#FFD700',
            enemy: '#800080'
        };

        // --- DRAWING HELPERS ---

        function drawCloud(x, y, scale) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(x, y, 30 * scale, 0, Math.PI * 2);
            ctx.arc(x + 25 * scale, y - 10 * scale, 35 * scale, 0, Math.PI * 2);
            ctx.arc(x + 50 * scale, y, 30 * scale, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawMountain(x, y, w, h) {
            ctx.fillStyle = '#98FB98'; // Pale green distant mountains
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + w/2, y - h);
            ctx.lineTo(x + w, y);
            ctx.fill();
        }

        function drawPlatform(x, y, type = 'normal') {
            const w = 60;
            const h = 40;

            if (type === 'ground') {
                // Top Grass
                ctx.fillStyle = colors.grass;
                ctx.fillRect(x, y, w, 10);
                // Dirt
                ctx.fillStyle = colors.dirt;
                ctx.fillRect(x, y + 10, w, 30);
                // Details
                ctx.fillStyle = colors.dirtDark;
                ctx.fillRect(x + 10, y + 20, 10, 10);
                ctx.fillRect(x + 40, y + 15, 5, 5);
            } else if (type === 'brick') {
                ctx.fillStyle = colors.block;
                ctx.fillRect(x, y, w, h);
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000';
                ctx.strokeRect(x, y, w, h);
                // Brick lines
                ctx.beginPath();
                ctx.moveTo(x, y + h/2); ctx.lineTo(x + w, y + h/2);
                ctx.moveTo(x + w/2, y); ctx.lineTo(x + w/2, y + h/2);
                ctx.moveTo(x + w/4, y + h/2); ctx.lineTo(x + w/4, y + h);
                ctx.moveTo(x + w*0.75, y + h/2); ctx.lineTo(x + w*0.75, y + h);
                ctx.stroke();
            } else if (type === 'question') {
                ctx.fillStyle = colors.blockQ;
                ctx.fillRect(x, y, w, h);
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000';
                ctx.strokeRect(x, y, w, h);
                // Bolts
                ctx.fillStyle = '#B8860B';
                ctx.fillRect(x+2, y+2, 4, 4);
                ctx.fillRect(x+w-6, y+2, 4, 4);
                ctx.fillRect(x+2, y+h-6, 4, 4);
                ctx.fillRect(x+w-6, y+h-6, 4, 4);
                // Question Mark
                ctx.fillStyle = '#000';
                ctx.font = 'bold 30px Arial';
                ctx.fillText('?', x + 20, y + 30);
            }
        }

        function drawCoin(x, y, time) {
            const bounce = Math.sin(time * 0.005 + x) * 5;
            const widthScale = Math.abs(Math.cos(time * 0.003 + x));
            
            ctx.save();
            ctx.translate(x, y + bounce);
            ctx.scale(widthScale, 1);
            
            ctx.fillStyle = colors.coin;
            ctx.beginPath();
            ctx.arc(0, 0, 12, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#DAA520';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Shine
            if(widthScale > 0.5) {
                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.ellipse(-3, -3, 2, 4, 0, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.restore();
        }

        function drawGlitchBat(x, y, time) {
            ctx.save();
            ctx.translate(x, y + Math.sin(time*0.008)*10);
            
            // Glitch effect (random offset)
            if(Math.random() > 0.9) {
                ctx.translate((Math.random()-0.5)*5, (Math.random()-0.5)*5);
            }

            ctx.fillStyle = colors.enemy;
            // Body
            ctx.beginPath();
            ctx.moveTo(0, -10);
            ctx.lineTo(20, 0);
            ctx.lineTo(0, 10);
            ctx.lineTo(-20, 0);
            ctx.fill();
            
            // Wings
            ctx.fillStyle = '#550055';
            ctx.beginPath();
            ctx.moveTo(-15, 0);
            ctx.lineTo(-35, -10 + Math.sin(time*0.02)*5);
            ctx.lineTo(-20, 5);
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(15, 0);
            ctx.lineTo(35, -10 + Math.sin(time*0.02)*5);
            ctx.lineTo(20, 5);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#fff';
            ctx.fillRect(-5, -2, 4, 4);
            ctx.fillRect(1, -2, 4, 4);

            ctx.restore();
        }

        // --- MAIN SCENE ---
        function animate(time) {
            ctx.clearRect(0, 0, width, height);

            // 1. Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, colors.sky[0]);
            grad.addColorStop(1, colors.sky[1]);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 2. Parallax Clouds
            drawCloud(100 + (time * 0.02) % (width + 200), 100, 1);
            drawCloud(400 + (time * 0.01) % (width + 200), 150, 1.5);
            drawCloud(800 + (time * 0.015) % (width + 200), 80, 0.8);

            // 3. Distant Mountains
            drawMountain(0, height * 0.6, width, height * 0.4);

            // 4. Ground Layer (Bottom of screen)
            const groundY = height * 0.85;
            // Draw infinite scrolling ground
            ctx.fillStyle = colors.grass;
            ctx.fillRect(0, groundY, width, 10);
            ctx.fillStyle = colors.dirt;
            ctx.fillRect(0, groundY + 10, width, height - groundY);
            
            // Add grid pattern to dirt for "retro" feel
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 2;
            const offset = (time * 0.1) % 50;
            for(let i = -50; i < width; i+=50) {
                ctx.beginPath();
                ctx.moveTo(i - offset, groundY + 10);
                ctx.lineTo(i - offset - 50, height);
                ctx.stroke();
            }

            // 5. Foreground Platforms (The "Level" design)
            // We place these relative to screen width to create the "preview" look
            
            // Hero's Platform (Left)
            drawPlatform(width * 0.1, groundY, 'ground');
            drawPlatform(width * 0.16, groundY, 'ground');
            
            // Floating Course (Right)
            const startX = width * 0.35;
            const startY = height * 0.65;
            
            // Platform chain
            drawPlatform(startX, startY, 'brick');
            drawPlatform(startX + 70, startY - 40, 'question');
            drawPlatform(startX + 140, startY - 80, 'brick');
            drawPlatform(startX + 210, startY - 40, 'brick');
            drawPlatform(startX + 280, startY, 'brick'); // Landing

            // Coins
            drawCoin(startX + 35, startY - 30, time);
            drawCoin(startX + 105, startY - 70, time);
            drawCoin(startX + 175, startY - 110, time);
            drawCoin(startX + 245, startY - 70, time);

            // Enemy
            drawGlitchBat(startX + 200, startY - 80, time);

            // Flag Pole (Goal)
            ctx.fillStyle = '#fff';
            ctx.fillRect(startX + 320, startY - 120, 5, 120);
            ctx.fillStyle = 'red';
            ctx.beginPath();
            ctx.moveTo(startX + 325, startY - 120);
            ctx.lineTo(startX + 360, startY - 105);
            ctx.lineTo(startX + 325, startY - 90);
            ctx.fill();


            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        function startGame() {
            const btn = document.querySelector('.start-btn');
            const originalText = btn.innerText;
            
            // Visual feedback
            btn.innerText = "LOADING...";
            
            setTimeout(() => {
                alert("Level 1-1 Starting!");
                btn.innerText = originalText;
            }, 800);
        }
    </script>
</body>
</html>
