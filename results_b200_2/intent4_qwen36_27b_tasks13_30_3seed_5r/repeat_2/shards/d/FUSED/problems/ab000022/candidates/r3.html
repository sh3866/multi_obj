<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitch Quest: Neon Valley</title>
    <style>
        :root {
            --c-bg-top: #2b1055;
            --c-bg-bot: #7597de;
            --c-primary: #ffea00; /* Yellow */
            --c-secondary: #00ffff; /* Cyan */
            --c-accent: #ff007f; /* Pink */
            --c-ui-bg: rgba(16, 20, 40, 0.75);
            --c-ui-border: rgba(255, 255, 255, 0.4);
            
            --font-display: 'Arial Black', Impact, sans-serif;
            --font-ui: 'Segoe UI', 'Roboto', Helvetica, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--c-bg-top);
            font-family: var(--font-ui);
            color: white;
        }

        /* --- BACKGROUND CANVAS --- */
        #world-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr 1fr; /* Split Screen Layout */
            grid-template-rows: auto 1fr auto;
            pointer-events: none;
        }

        /* --- TOP HUD (Left Side) --- */
        .top-hud {
            grid-column: 1;
            grid-row: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 40px 40px 0 40px;
            pointer-events: auto;
        }

        .game-title {
            font-family: var(--font-display);
            font-size: 5rem;
            line-height: 0.9;
            color: var(--c-secondary);
            text-transform: uppercase;
            transform: skewX(-5deg);
            text-shadow: 
                4px 4px 0 var(--c-accent),
                0 0 20px rgba(0, 255, 255, 0.5);
            margin-bottom: 10px;
            letter-spacing: -2px;
        }

        .game-subtitle {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: var(--c-primary);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-left: 5px;
            text-shadow: 2px 2px 0 #000;
        }

        /* --- HERO CARD (Left Side, Center) --- */
        .hero-info-card {
            grid-column: 1;
            grid-row: 2;
            align-self: center;
            padding: 0 40px;
            pointer-events: auto;
            max-width: 450px;
        }

        .card-content {
            background: var(--c-ui-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--c-ui-border);
            border-left: 6px solid var(--c-secondary);
            border-radius: 0 20px 20px 0;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            transform: skewX(-5deg);
        }

        .card-inner {
            transform: skewX(5deg); /* Counter skew text */
        }

        .hero-desc {
            font-size: 1.1rem;
            color: #e0e0e0;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .start-btn {
            background: var(--c-primary);
            color: #000;
            border: none;
            padding: 16px 40px;
            font-size: 1.4rem;
            font-family: var(--font-display);
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            position: relative;
            box-shadow: 0 6px 0 #b3b300, 0 10px 20px rgba(0,0,0,0.3);
            transition: all 0.1s;
            overflow: hidden;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #b3b300, 0 15px 30px rgba(0,0,0,0.4);
        }

        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b3b300, 0 5px 10px rgba(0,0,0,0.3);
        }

        /* --- BOTTOM HUD (Left Side, Bottom) --- */
        .bottom-hud {
            grid-column: 1;
            grid-row: 3;
            padding: 0 40px 40px 40px;
            display: flex;
            align-items: flex-end;
            gap: 20px;
            pointer-events: auto;
        }

        .controls-box {
            background: var(--c-ui-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--c-ui-border);
            padding: 10px 20px;
            border-radius: 12px;
            display: flex;
            gap: 15px;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #fff;
        }

        .key {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.5);
            border-bottom: 3px solid rgba(255,255,255,0.5);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
            font-size: 0.8rem;
        }

        /* --- RIGHT SIDE HUD (World & Stats) --- */
        .right-hud {
            grid-column: 2;
            grid-row: 1;
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 40px;
            pointer-events: auto;
            gap: 20px;
        }

        .world-selector {
            background: var(--c-ui-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--c-ui-border);
            border-radius: 12px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.2s;
            min-width: 180px;
        }
        .world-selector:hover { background: rgba(255,255,255,0.15); transform: scale(1.02); }

        .world-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #aaa;
            letter-spacing: 1px;
        }

        .world-name {
            font-weight: bold;
            color: var(--c-primary);
        }

        .stats-container {
            display: flex;
            gap: 10px;
        }

        .stat-pill {
            background: var(--c-ui-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--c-ui-border);
            border-radius: 50px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .stat-icon { font-size: 1.2rem; }

        /* --- HERO SPRITE (CSS) --- */
        /* Positioned to overlap the split line */
        .hero-container {
            position: absolute;
            left: 45%; /* Straddling the split */
            bottom: 18%; /* Ground level */
            width: 160px;
            height: 200px;
            z-index: 5;
            pointer-events: none;
            animation: heroJump 2.5s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
        }

        @keyframes heroJump {
            0%, 100% { transform: translateY(0) scaleY(1); }
            10% { transform: translateY(10px) scaleY(0.9); } /* Crouch */
            50% { transform: translateY(-120px) scaleY(1.1); } /* Peak */
            90% { transform: translateY(5px) scaleY(0.95); } /* Land bounce */
        }

        /* Shadow under hero */
        .hero-shadow {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 20px;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            filter: blur(4px);
            animation: shadowScale 2.5s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
        }

        @keyframes shadowScale {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.6; }
            50% { transform: translateX(-50%) scale(0.4); opacity: 0.2; }
        }

        .hero-body {
            width: 100px;
            height: 100px;
            background: var(--c-secondary);
            border-radius: 45%;
            border: 4px solid #000;
            position: absolute;
            bottom: 20px;
            left: 30px;
            z-index: 2;
            box-shadow: inset -8px -8px 0 rgba(0,0,0,0.2);
        }
        
        .hero-visors {
            width: 90px;
            height: 40px;
            background: #111;
            border-radius: 20px;
            position: absolute;
            top: 30px;
            left: 5px;
            z-index: 3;
            border: 3px solid #000;
            overflow: hidden;
        }

        .visor-light {
            width: 30px;
            height: 15px;
            background: var(--c-accent);
            position: absolute;
            top: 12px;
            border-radius: 8px;
            box-shadow: 0 0 15px var(--c-accent);
            animation: blink 4s infinite;
        }
        .vl-left { left: 10px; }
        .vl-right { right: 10px; }

        @keyframes blink {
            0%, 96%, 100% { opacity: 1; }
            98% { opacity: 0.2; }
        }

        .hero-shoes {
            width: 110px;
            height: 35px;
            background: var(--c-accent);
            border-radius: 20px 20px 30px 30px;
            position: absolute;
            bottom: 0;
            left: 25px;
            border: 4px solid #000;
            z-index: 1;
        }

        .hero-scarf {
            width: 80px;
            height: 20px;
            background: var(--c-primary);
            position: absolute;
            top: 15px;
            right: -40px;
            z-index: 0;
            border-radius: 5px;
            transform-origin: left center;
            animation: scarfFlow 1s ease-in-out infinite alternate;
            border: 3px solid #000;
        }

        @keyframes scarfFlow {
            from { transform: rotate(-10deg) translateX(0); }
            to { transform: rotate(25deg) translateX(25px); }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 900px) {
            .ui-layer {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
            }
            .top-hud {
                grid-column: 1;
                padding: 20px;
            }
            .game-title { font-size: 3rem; }
            .right-hud {
                grid-column: 1;
                grid-row: 1;
                justify-content: space-between;
                padding: 20px;
            }
            .hero-info-card {
                grid-column: 1;
                grid-row: 2;
                padding: 20px;
                align-self: flex-end; /* Push to bottom */
            }
            .card-content {
                border-left: none;
                border-top: 6px solid var(--c-secondary);
                border-radius: 15px;
                transform: none;
            }
            .card-inner { transform: none; }
            .bottom-hud { display: none; } /* Hide controls on mobile */
            .hero-container { left: 50%; transform: translateX(-50%) scale(0.8); }
        }
    </style>
</head>
<body>

    <!-- Background World Canvas -->
    <canvas id="world-canvas"></canvas>

    <!-- The Hero Character -->
    <div class="hero-container">
        <div class="hero-shadow"></div>
        <div class="hero-body">
            <div class="hero-visors">
                <div class="visor-light vl-left"></div>
                <div class="visor-light vl-right"></div>
            </div>
            <div class="hero-scarf"></div>
        </div>
        <div class="hero-shoes"></div>
    </div>

    <!-- UI Overlay -->
    <div class="ui-layer">
        
        <!-- Top Left: Title -->
        <header class="top-hud">
            <div class="game-title">Glitch<br>Quest</div>
            <div class="game-subtitle">System Breach</div>
        </header>

        <!-- Top Right: Stats & World -->
        <div class="right-hud">
            <div class="world-selector">
                <div>
                    <div class="world-label">Current Zone</div>
                    <div class="world-name">Neon Valley</div>
                </div>
                <div style="font-size: 1.5rem; color: #fff;">▼</div>
            </div>

            <div class="stats-container">
                <div class="stat-pill">
                    <span class="stat-icon">🪙</span> 094
                </div>
                <div class="stat-pill">
                    <span class="stat-icon">🔑</span> 03
                </div>
            </div>
        </div>

        <!-- Bottom Left: Hero Info & Start -->
        <div class="hero-info-card">
            <div class="card-content">
                <div class="card-inner">
                    <p class="hero-desc">
                        The code is corrupted. Jump across the glitching data streams, collect memory chips, and reach the Firewall before the system resets.
                    </p>
                    <button class="start-btn" onclick="startGame()">Start Adventure</button>
                </div>
            </div>
        </div>

        <!-- Bottom Left (Absolute): Controls -->
        <div class="bottom-hud">
            <div class="controls-box">
                <div class="control-item"><span class="key">Z</span> Jump</div>
                <div class="control-item"><span class="key">X</span> Dash</div>
                <div class="control-item"><span class="key">C</span> Shoot</div>
            </div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('world-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const colors = {
            skyTop: '#2b1055',
            skyBot: '#7597de',
            gridLine: 'rgba(255, 255, 255, 0.15)',
            hillFar: '#3e1e6a',
            hillMid: '#582885',
            ground: '#1a0b2e',
            groundTop: '#ff007f',
            block: '#00ffff',
            blockAlt: '#bd00ff',
            coin: '#ffea00',
            enemy: '#ff0055',
            goal: '#ffffff'
        };

        // --- DRAWING HELPERS ---

        function drawStar(x, y, time) {
            const flicker = Math.sin(time * 0.005 + x) * 0.5 + 0.5;
            ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + flicker * 0.7})`;
            ctx.beginPath();
            ctx.arc(x, y, 1.5, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawMountain(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + w/2, y - h);
            ctx.lineTo(x + w, y);
            ctx.fill();
            
            // Add tech details
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.moveTo(x + w/2, y - h);
            ctx.lineTo(x + w/2 + 20, y - h + 40);
            ctx.lineTo(x + w/2 - 20, y - h + 40);
            ctx.fill();
        }

        function drawPlatform(x, y, w, h, type) {
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(x + 8, y + 8, w, h);

            // Main block
            ctx.fillStyle = type === 'ground' ? colors.ground : colors.block;
            ctx.fillRect(x, y, w, h);
            
            // Border/Highlight
            ctx.strokeStyle = type === 'ground' ? colors.groundTop : '#fff';
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, w, h);

            // Tech details
            if (type !== 'ground') {
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(x + 8, y + 8, w - 16, 8);
                ctx.fillStyle = colors.coin;
                ctx.fillRect(x + w - 15, y + h - 15, 10, 10);
            }
        }

        function drawCoin(x, y, time) {
            const bounce = Math.sin(time * 0.005 + x) * 10;
            const scaleX = Math.abs(Math.cos(time * 0.003 + x));
            
            ctx.save();
            ctx.translate(x, y + bounce);
            ctx.scale(scaleX, 1);
            
            // Glow
            ctx.shadowBlur = 15;
            ctx.shadowColor = colors.coin;
            
            ctx.fillStyle = colors.coin;
            ctx.beginPath();
            ctx.arc(0, 0, 14, 0, Math.PI*2);
            ctx.fill();
            
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.restore();
        }

        function drawGlitchBat(x, y, time) {
            ctx.save();
            ctx.translate(x, y + Math.sin(time*0.008)*20);
            
            // Glitch effect
            const glitchX = (Math.random() - 0.5) * 15;
            const glitchY = (Math.random() - 0.5) * 15;
            if(Math.random() > 0.8) ctx.translate(glitchX, glitchY);

            // Body (Diamond shape)
            ctx.fillStyle = colors.enemy;
            ctx.beginPath();
            ctx.moveTo(0, -15);
            ctx.lineTo(20, 0);
            ctx.lineTo(0, 15);
            ctx.lineTo(-20, 0);
            ctx.fill();

            // Wings (Flapping)
            const wingAngle = Math.sin(time * 0.02) * 0.5;
            
            ctx.fillStyle = '#ff5588';
            // Left Wing
            ctx.beginPath();
            ctx.moveTo(-15, 0);
            ctx.lineTo(-40, -15 + (Math.sin(time*0.02)*15));
            ctx.lineTo(-30, 15);
            ctx.fill();
            
            // Right Wing
            ctx.beginPath();
            ctx.moveTo(15, 0);
            ctx.lineTo(40, -15 + (Math.sin(time*0.02)*15));
            ctx.lineTo(30, 15);
            ctx.fill();

            // Eye
            ctx.fillStyle = '#fff';
            ctx.fillRect(-5, -3, 10, 6);

            ctx.restore();
        }

        function drawGoal(x, y) {
            // Pole
            ctx.fillStyle = '#fff';
            ctx.fillRect(x, y - 180, 6, 180);
            
            // Flag (Triangle)
            ctx.fillStyle = colors.block;
            ctx.beginPath();
            ctx.moveTo(x + 6, y - 180);
            ctx.lineTo(x + 60, y - 150);
            ctx.lineTo(x + 6, y - 120);
            ctx.fill();

            // Glow base
            ctx.shadowBlur = 25;
            ctx.shadowColor = colors.goal;
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.beginPath();
            ctx.arc(x + 3, y, 15, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // --- MAIN SCENE ---
        function animate(time) {
            ctx.clearRect(0, 0, width, height);

            // 1. Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, colors.skyTop);
            grad.addColorStop(1, colors.skyBot);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 2. Stars
            for(let i=0; i<50; i++) {
                drawStar((i * 137) % width, (i * 67) % (height/2), time);
            }

            // 3. Distant Hills (Parallax)
            const parallaxX = time * 0.05;
            drawMountain(0 - (parallaxX % 800), height * 0.7, 800, 200, colors.hillFar);
            drawMountain(400 - (parallaxX % 800), height * 0.7, 800, 200, colors.hillFar);
            
            // Mid Hills
            const parallaxMid = time * 0.1;
            drawMountain(100 - (parallaxMid % 1000), height * 0.8, 600, 150, colors.hillMid);
            drawMountain(600 - (parallaxMid % 1000), height * 0.8, 600, 150, colors.hillMid);

            // 4. Ground Layer
            const groundY = height * 0.82;
            
            // Grid floor effect
            ctx.fillStyle = colors.ground;
            ctx.fillRect(0, groundY, width, height - groundY);
            
            // Grid lines
            ctx.strokeStyle = colors.gridLine;
            ctx.lineWidth = 2;
            const gridOffset = (time * 0.2) % 50;
            
            ctx.beginPath();
            // Verticals
            for(let i = -50; i < width; i+=50) {
                ctx.moveTo(i - gridOffset, groundY);
                ctx.lineTo(i - gridOffset - 100, height); // Perspective slant
            }
            // Horizontals
            for(let i = 0; i < height - groundY; i+=40) {
                ctx.moveTo(0, groundY + i);
                ctx.lineTo(width, groundY + i);
            }
            ctx.stroke();

            // Ground Top Highlight
            ctx.fillStyle = colors.groundTop;
            ctx.fillRect(0, groundY, width, 6);

            // 5. Level Geometry (The "Preview")
            
            // Hero Platform (Left side, under hero)
            drawPlatform(width * 0.15, groundY, 300, 40, 'ground');

            // Floating Platforms sequence (Right side)
            const startX = width * 0.45;
            const startY = height * 0.65;

            drawPlatform(startX, startY, 100, 35, 'brick');
            drawPlatform(startX + 140, startY - 80, 100, 35, 'brick');
            drawPlatform(startX + 280, startY - 30, 100, 35, 'brick');
            drawPlatform(startX + 420, startY - 100, 150, 40, 'brick'); // Goal platform

            // Coins
            drawCoin(startX + 50, startY - 50, time);
            drawCoin(startX + 190, startY - 130, time);
            drawCoin(startX + 330, startY - 80, time);
            drawCoin(startX + 360, startY - 100, time);

            // Enemy
            drawGlitchBat(startX + 230, startY - 80, time);
            drawGlitchBat(startX + 400, startY - 150, time);

            // Goal
            drawGoal(startX + 480, startY - 60);

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        function startGame() {
            const btn = document.querySelector('.start-btn');
            const originalText = btn.innerText;
            btn.innerText = "INITIALIZING...";
            btn.style.background = "#fff";
            
            // Simple visual feedback
            setTimeout(() => {
                alert("Game Launching...");
                btn.innerText = originalText;
                btn.style.background = "";
            }, 800);
        }
    </script>
</body>
</html>
