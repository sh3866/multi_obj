<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLITCH QUEST: NEON VALLEY</title>
    <style>
        :root {
            /* REVISED PALETTE: Brighter, Joyful, Saturated */
            --c-sky-top: #00a8ff;
            --c-sky-mid: #73d2ff;
            --c-sky-bot: #b3e0ff;
            
            --c-primary: #ffea00; /* Electric Yellow */
            --c-secondary: #00f0ff; /* Neon Cyan */
            --c-accent: #ff0055; /* Hot Pink */
            --c-hero: #ff4d4d; /* Hero Red */
            --c-text: #ffffff;
            
            --c-ui-bg: rgba(255, 255, 255, 0.15);
            --c-ui-border: rgba(255, 255, 255, 0.4);
            
            --font-display: 'Arial Black', 'Impact', 'Helvetica Neue', sans-serif;
            --font-ui: 'Verdana', 'Segoe UI', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(to bottom, var(--c-sky-top), var(--c-sky-mid) 50%, var(--c-sky-bot));
            font-family: var(--font-ui);
            color: var(--c-text);
        }

        /* --- CANVAS (World) --- */
        #world-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
        }

        /* --- HEADER / TITLE (Top Left - Joyful Identity) --- */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: auto;
        }

        .title-block {
            position: relative;
            transform: rotate(-2deg);
            animation: title-float 4s ease-in-out infinite;
        }

        .game-title {
            font-family: var(--font-display);
            font-size: 5rem;
            line-height: 0.9;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: -2px;
            position: relative;
            display: inline-block;
            /* Pop Shadow */
            text-shadow: 
                5px 5px 0px var(--c-accent),
                10px 10px 0px rgba(0,0,0,0.1);
            transform: skewY(-3deg);
        }

        /* Glitch layers for the title */
        .game-title span {
            display: block;
            position: relative;
        }
        
        .game-title span::before {
            content: attr(data-text);
            position: absolute;
            left: -3px;
            top: 0;
            width: 100%;
            color: var(--c-secondary);
            z-index: -1;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            animation: glitch-clip-1 2s infinite linear alternate-reverse;
        }
        
        .game-title span::after {
            content: attr(data-text);
            position: absolute;
            left: 3px;
            top: 0;
            width: 100%;
            color: var(--c-primary);
            z-index: -2;
            clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
            animation: glitch-clip-2 3s infinite linear alternate-reverse;
        }

        .game-subtitle {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: var(--c-text);
            background: var(--c-primary);
            display: inline-block;
            padding: 4px 12px;
            transform: skewX(-10deg) rotate(1deg);
            margin-top: 5px;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- MISSION TEXT (Moved to Top Left, integrated) --- */
        .mission-text-container {
            margin-top: 15px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            padding: 8px 15px;
            border-left: 4px solid var(--c-secondary);
            max-width: 300px;
            transform: skewX(-5deg);
        }

        .mission-text {
            font-size: 0.85rem;
            line-height: 1.3;
            color: #fff;
            font-weight: bold;
            text-transform: uppercase;
            transform: skewX(5deg); /* Counter-skew text */
        }
        
        .mission-text strong { color: var(--c-primary); }

        /* --- HUD (Top Right - Refined) --- */
        .unified-hud {
            background: var(--c-ui-bg);
            border: 2px solid var(--c-ui-border);
            border-right: 6px solid var(--c-secondary);
            padding: 10px 25px;
            display: flex;
            gap: 25px;
            align-items: center;
            backdrop-filter: blur(10px);
            transform: skewX(-10deg);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-radius: 4px;
        }

        .hud-group {
            display: flex;
            flex-direction: column;
            transform: skewX(10deg); /* Counter skew content */
        }

        .hud-label { font-size: 0.65rem; color: rgba(255,255,255,0.8); text-transform: uppercase; letter-spacing: 1px; }
        .hud-value { font-family: var(--font-display); font-size: 1.4rem; color: #fff; text-shadow: 2px 2px 0 rgba(0,0,0,0.2); }

        .hud-divider { width: 2px; height: 35px; background: rgba(255,255,255,0.3); transform: skewX(0deg); }

        .stat-row { display: flex; gap: 12px; }
        .stat-item { 
            display: flex; align-items: center; gap: 6px; 
            background: rgba(0,0,0,0.2); padding: 4px 10px; 
            border-radius: 20px; font-weight: bold; font-size: 1rem;
            box-shadow: inset 1px 1px 0 rgba(255,255,255,0.2);
        }

        /* --- BOTTOM AREA (Start Button & Controls) --- */
        .bottom-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            padding-bottom: 2rem;
        }

        /* Controls (Bottom Left) */
        .controls-guide {
            pointer-events: auto;
            display: flex;
            gap: 15px;
            background: var(--c-ui-bg);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid var(--c-ui-border);
            backdrop-filter: blur(5px);
        }

        .key-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .key-cap {
            width: 36px; height: 36px;
            background: #fff;
            border-bottom: 4px solid #ccc;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-display);
            font-size: 1rem;
            color: #333;
            box-shadow: 0 4px 0 #999;
        }
        .key-cap:active { transform: translateY(4px); box-shadow: 0 0 0 #999; border-bottom: none; }

        .key-label { font-size: 0.6rem; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; color: #fff; text-shadow: 1px 1px 0 #000; }

        /* Start Button (Bottom Center - Floating) */
        .start-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            animation: btn-float 3s ease-in-out infinite;
        }

        .start-btn {
            background: var(--c-primary);
            color: #000;
            border: 4px solid #fff;
            font-family: var(--font-display);
            font-size: 1.8rem;
            text-transform: uppercase;
            cursor: pointer;
            padding: 15px 50px;
            border-radius: 50px;
            letter-spacing: 1px;
            transition: all 0.2s;
            box-shadow: 0 10px 0 #ccbb00, 0 20px 20px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .start-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            transition: 0.5s;
        }

        .start-btn:hover {
            transform: translateY(-5px);
            background: #fff;
            color: var(--c-primary);
            box-shadow: 0 15px 0 #ddd, 0 25px 30px rgba(0,0,0,0.2);
        }
        
        .start-btn:hover::after { left: 100%; }

        .start-btn:active { 
            transform: translateY(5px); 
            box-shadow: 0 5px 0 #ccbb00;
        }

        .world-selector {
            font-size: 0.9rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.4);
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
            pointer-events: auto;
            transition: background 0.2s;
        }
        .world-selector:hover { background: var(--c-accent); }

        /* --- HERO (CSS - Left Foreground) --- */
        .hero-wrapper {
            position: absolute;
            bottom: 12%; /* Adjusted for terrain */
            left: 15%; /* Left Foreground */
            width: 140px; height: 160px;
            z-index: 5;
            animation: hero-bounce 2s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
            transform-origin: bottom center;
            filter: drop-shadow(5px 10px 5px rgba(0,0,0,0.3));
        }

        .hero-shadow {
            position: absolute; bottom: 0; left: 50%;
            width: 70px; height: 15px;
            background: rgba(0,0,0,0.4);
            border-radius: 50%;
            transform: translateX(-50%);
            filter: blur(4px);
            animation: shadow-fade 2s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
        }

        .hero-body {
            position: absolute; bottom: 15px; left: 30px;
            width: 80px; height: 85px;
            background: var(--c-hero);
            border: 4px solid #000;
            border-radius: 45% 45% 40% 40%;
            box-shadow: inset -8px -8px 0 rgba(0,0,0,0.15);
            z-index: 2;
        }

        .hero-visor {
            position: absolute; top: 25px; left: 5px;
            width: 70px; height: 30px;
            background: #222;
            border-radius: 15px;
            border: 3px solid #000;
            overflow: hidden;
        }
        .visor-light {
            position: absolute; top: 8px;
            width: 22px; height: 10px;
            background: #fff;
            border-radius: 5px;
            box-shadow: 0 0 8px #fff;
            animation: blink 4s infinite;
        }
        .vl-l { left: 8px; } .vl-r { right: 8px; }

        .hero-scarf {
            position: absolute; top: 15px; right: -25px;
            width: 70px; height: 18px;
            background: var(--c-primary);
            border: 3px solid #000;
            border-radius: 5px;
            z-index: 1;
            transform-origin: left center;
            animation: scarf-wave 0.4s ease-in-out infinite alternate;
        }

        .hero-legs {
            position: absolute; bottom: 0; left: 35px;
            width: 70px; height: 30px;
            background: #0044aa;
            border-radius: 15px 15px 20px 20px;
            border: 3px solid #000;
            border-top: none;
            z-index: 1;
        }

        /* Animations */
        @keyframes hero-bounce {
            0%, 100% { transform: translateY(0) scaleY(1); }
            10% { transform: translateY(10px) scaleY(0.9); }
            50% { transform: translateY(-120px) scaleY(1.15); }
            80% { transform: translateY(5px) scaleY(0.95); }
        }

        @keyframes shadow-fade {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.5; }
            50% { transform: translateX(-50%) scale(0.4); opacity: 0.1; }
        }

        @keyframes scarf-wave {
            from { transform: rotate(-10deg) skewX(-15deg); }
            to { transform: rotate(10deg) skewX(15deg) translateX(5px); }
        }

        @keyframes title-float {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-10px) rotate(-2deg); }
        }

        @keyframes btn-float {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        @keyframes glitch-clip-1 {
            0% { transform: translate(0,0); }
            20% { transform: translate(-3px, 2px); }
            40% { transform: translate(3px, -2px); }
            60% { transform: translate(0,0); }
            100% { transform: translate(0,0); }
        }
        @keyframes glitch-clip-2 {
            0% { transform: translate(0,0); }
            20% { transform: translate(3px, -2px); }
            40% { transform: translate(-3px, 2px); }
            60% { transform: translate(0,0); }
            100% { transform: translate(0,0); }
        }
        @keyframes blink {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .game-title { font-size: 3rem; }
            .ui-layer { padding: 1rem; }
            .hero-wrapper { left: 10%; bottom: 10%; transform: scale(0.8); }
            .controls-guide { display: none; }
            .header-area { flex-direction: column; gap: 5px; }
            .unified-hud { width: 100%; justify-content: space-between; padding: 8px 15px; }
            .mission-text-container { display: none; } /* Hide mission text on small screens */
        }
    </style>
</head>
<body>

    <canvas id="world-canvas"></canvas>

    <!-- Hero Character -->
    <div class="hero-wrapper">
        <div class="hero-shadow"></div>
        <div class="hero-body">
            <div class="hero-visor">
                <div class="visor-light vl-l"></div>
                <div class="visor-light vl-r"></div>
            </div>
            <div class="hero-scarf"></div>
        </div>
        <div class="hero-legs"></div>
    </div>

    <!-- UI Overlay -->
    <div class="ui-layer">
        
        <header class="header-area">
            <div class="title-block">
                <div class="game-title">
                    <span data-text="GLITCH">GLITCH</span>
                    <span data-text="QUEST">QUEST</span>
                </div>
                <div class="game-subtitle">Neon Valley</div>
                
                <!-- Mission Text Moved Here -->
                <div class="mission-text-container">
                    <p class="mission-text">
                        <strong>MISSION:</strong> Reach the firewall before the reset!
                    </p>
                </div>
            </div>

            <div class="unified-hud">
                <div class="hud-group">
                    <span class="hud-label">Zone</span>
                    <span class="hud-value" style="color:var(--c-primary)">01-A</span>
                </div>
                <div class="hud-divider"></div>
                <div class="stat-row">
                    <div class="stat-item" style="color: #ffea00; text-shadow: 1px 1px 0 #000;">
                        <span>🪙</span> <span>94</span>
                    </div>
                    <div class="stat-item" style="color: #ff007f; text-shadow: 1px 1px 0 #000;">
                        <span>🔑</span> <span>03</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="bottom-area">
            
            <div class="controls-guide">
                <div class="key-card">
                    <div class="key-cap">Z</div>
                    <div class="key-label">Jump</div>
                </div>
                <div class="key-card">
                    <div class="key-cap">X</div>
                    <div class="key-label">Dash</div>
                </div>
                <div class="key-card">
                    <div class="key-cap">C</div>
                    <div class="key-label">Hack</div>
                </div>
            </div>

            <!-- Start Button Centered Bottom -->
            <div class="start-container">
                <div class="world-selector" onclick="alert('World Map Coming Soon!')">
                    🌍 World 1-1 ▾
                </div>
                <button class="start-btn" onclick="startGame()">Start Adventure</button>
            </div>

        </div>
    </div>

    <script>
        const canvas = document.getElementById('world-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- PALETTE (Bright & Joyful) ---
        const c = {
            mtnFar: '#a0d8ef',
            mtnMid: '#63b8e6',
            mtnNear: '#3d8ec9',
            grass: '#55c468',
            grassDark: '#3da350',
            dirt: '#e0a468',
            plat: '#ffea00', // Yellow blocks
            platBorder: '#d4b200',
            coin: '#ffea00',
            coinGlow: '#fff',
            enemy: '#ff0055',
            goal: '#00f0ff'
        };

        // --- UTILS ---
        function drawRect(x, y, w, h, fill, stroke) {
            ctx.fillStyle = fill;
            ctx.fillRect(x, y, w, h);
            if(stroke) {
                ctx.strokeStyle = stroke;
                ctx.lineWidth = 4;
                ctx.strokeRect(x, y, w, h);
            }
        }

        function drawCloud(x, y, scale, opacity) {
            ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
            ctx.beginPath();
            ctx.arc(x, y, 30 * scale, 0, Math.PI * 2);
            ctx.arc(x + 25 * scale, y - 15 * scale, 35 * scale, 0, Math.PI * 2);
            ctx.arc(x + 50 * scale, y, 30 * scale, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawPlatform(x, y, w, h, type = 'normal') {
            // Main Block
            ctx.fillStyle = type === 'goal' ? '#fff' : c.plat;
            ctx.fillRect(x, y, w, h);
            
            // 3D Depth (Side)
            ctx.fillStyle = type === 'goal' ? '#ddd' : c.platBorder;
            ctx.fillRect(x, y + h, w, 10);

            // Border
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, w, h);

            // Decoration (Question mark or bricks)
            if(type === 'normal') {
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(x + 5, y + 5, 5, 5);
                ctx.fillRect(x + w - 10, y + 5, 5, 5);
                ctx.fillRect(x + 5, y + h - 10, 5, 5);
                ctx.fillRect(x + w - 10, y + h - 10, 5, 5);
            }
        }

        function drawCoin(x, y, t) {
            const bounce = Math.sin(t * 0.005 + x) * 10;
            const spin = Math.abs(Math.cos(t * 0.003 + x));
            
            ctx.save();
            ctx.translate(x, y + bounce);
            ctx.scale(spin, 1);
            
            // Glow
            ctx.shadowBlur = 15;
            ctx.shadowColor = c.coin;
            
            // Coin Body
            ctx.fillStyle = c.coin;
            ctx.beginPath();
            ctx.arc(0, 0, 14, 0, Math.PI*2);
            ctx.fill();
            
            // Border
            ctx.strokeStyle = '#b39200';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Inner detail
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 0, 6, 0, Math.PI*2);
            ctx.fill();
            
            ctx.restore();
        }

        function drawEnemy(x, y, t) {
            ctx.save();
            ctx.translate(x, y);
            
            // Hover effect
            const hover = Math.sin(t * 0.008) * 5;
            ctx.translate(0, hover);

            // Jitter
            const jx = (Math.random() - 0.5) * 2;
            ctx.translate(jx, 0);

            // Body (Diamond shape)
            ctx.fillStyle = c.enemy;
            ctx.beginPath();
            ctx.moveTo(0, -20);
            ctx.lineTo(20, 0);
            ctx.lineTo(0, 20);
            ctx.lineTo(-20, 0);
            ctx.fill();
            
            // Outline
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Angry Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(-10, -5);
            ctx.lineTo(-2, 0);
            ctx.lineTo(-10, 5);
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(10, -5);
            ctx.lineTo(2, 0);
            ctx.lineTo(10, 5);
            ctx.fill();
            
            ctx.restore();
        }

        function drawGoal(x, y, t) {
            // Pole
            ctx.fillStyle = '#fff';
            ctx.fillRect(x, y - 120, 6, 120);
            
            // Glitching Flag
            ctx.fillStyle = c.goal;
            ctx.beginPath();
            ctx.moveTo(x + 6, y - 120);
            ctx.lineTo(x + 50, y - 100 + Math.sin(t*0.01)*5);
            ctx.lineTo(x + 6, y - 80);
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Glow
            ctx.shadowBlur = 20;
            ctx.shadowColor = c.goal;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(x + 3, y - 120, 8, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // --- SCENE RENDERING ---
        function drawLayer(time) {
            // 1. Clear (Gradient handled by CSS background)

            // 2. Parallax Clouds
            drawCloud(100 - (time * 0.02) % (width + 200), 100, 1.5, 0.6);
            drawCloud(400 - (time * 0.01) % (width + 200), 150, 1, 0.4);
            drawCloud(800 - (time * 0.03) % (width + 200), 80, 2, 0.5);

            // 3. Mountains (Parallax)
            // Far
            ctx.fillStyle = c.mtnFar;
            ctx.beginPath();
            ctx.moveTo(0, height);
            for(let i=0; i<=width; i+=50) {
                let h = 150 + Math.sin(i * 0.005 + time * 0.0002) * 80;
                ctx.lineTo(i - (time * 0.1) % 200, height - h);
            }
            ctx.lineTo(width, height);
            ctx.fill();

            // Mid
            ctx.fillStyle = c.mtnMid;
            ctx.beginPath();
            ctx.moveTo(0, height);
            for(let i=0; i<=width; i+=40) {
                let h = 200 + Math.cos(i * 0.01 + time * 0.0005) * 60;
                ctx.lineTo(i - (time * 0.2) % 160, height - h);
            }
            ctx.lineTo(width, height);
            ctx.fill();

            // 4. Terrain (Glitchy Ground)
            const groundY = height * 0.75;
            
            // Draw "Glitch" Grid Floor
            ctx.fillStyle = c.grass;
            ctx.fillRect(0, groundY, width, height - groundY);
            
            // Grid Lines
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            
            // Horizontal moving lines
            const gridOffset = (time * 0.5) % 50;
            for(let i=0; i < (height - groundY); i+=50) {
                let y = groundY + i;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            
            // Vertical perspective lines
            for(let i=-100; i < width + 100; i+=100) {
                ctx.beginPath();
                ctx.moveTo(i - gridOffset, groundY);
                ctx.lineTo((i - gridOffset) - 300, height); // Slant left
                ctx.stroke();
            }

            // 5. Platforms
            // Platform 1 (Hero Stand - Left)
            drawPlatform(width * 0.10, groundY - 40, 220, 40);
            
            // Platform 2 (Mid)
            drawPlatform(width * 0.35, groundY - 120, 140, 40);
            
            // Platform 3 (High)
            drawPlatform(width * 0.55, groundY - 250, 160, 40);
            
            // Platform 4 (Goal - Right)
            drawPlatform(width * 0.75, groundY - 180, 200, 40, 'goal');

            // 6. Entities
            // Coins
            drawCoin(width * 0.40, groundY - 160, time);
            drawCoin(width * 0.45, groundY - 160, time);
            drawCoin(width * 0.60, groundY - 300, time);

            // Enemies
            drawEnemy(width * 0.50, groundY - 160, time);
            drawEnemy(width * 0.80, groundY - 220, time);

            // Goal
            drawGoal(width * 0.83, groundY - 180, time);
        }

        function animate(time) {
            ctx.clearRect(0, 0, width, height);
            drawLayer(time);
            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        function startGame() {
            const btn = document.querySelector('.start-btn');
            btn.innerHTML = "LOADING...";
            
            // Simple visual feedback
            document.body.style.transition = "filter 0.5s";
            document.body.style.filter = "contrast(1.5) hue-rotate(90deg)";
            
            setTimeout(() => {
                alert("System Breach Initiated. Welcome to Neon Valley.");
                document.body.style.filter = "none";
                btn.innerHTML = "START ADVENTURE";
            }, 800);
        }
    </script>
</body>
</html>
