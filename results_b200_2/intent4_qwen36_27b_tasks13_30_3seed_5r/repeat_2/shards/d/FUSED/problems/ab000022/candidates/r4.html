<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLITCH QUEST: NEON VALLEY</title>
    <style>
        :root {
            --c-bg-deep: #050011;
            --c-bg-mid: #1a0b2e;
            --c-primary: #ffea00; /* Yellow */
            --c-secondary: #00ffff; /* Cyan */
            --c-accent: #ff007f; /* Pink */
            --c-text: #ffffff;
            --c-ui-bg: rgba(10, 10, 20, 0.85);
            
            --font-display: 'Arial Black', Impact, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--c-bg-deep);
            font-family: var(--font-mono);
            color: var(--c-text);
        }

        /* --- CANVAS --- */
        #world-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
        }

        /* --- HEADER / TITLE --- */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: auto;
        }

        .title-block {
            position: relative;
        }

        .game-title {
            font-family: var(--font-display);
            font-size: 4.5rem;
            line-height: 0.85;
            color: var(--c-secondary);
            text-transform: uppercase;
            letter-spacing: -2px;
            position: relative;
            display: inline-block;
            mix-blend-mode: screen;
            text-shadow: 4px 4px 0px var(--c-accent);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }

        .game-title::before, .game-title::after {
            content: "GLITCH\nQUEST";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--c-bg-deep);
            overflow: hidden;
        }
        
        .game-title::before {
            left: 2px;
            text-shadow: -2px 0 var(--c-accent);
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            animation: glitch-anim-2 2s infinite linear alternate-reverse;
        }
        
        .game-title::after {
            left: -2px;
            text-shadow: -2px 0 var(--c-primary);
            clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        .game-subtitle {
            font-family: var(--font-mono);
            font-size: 1rem;
            color: var(--c-primary);
            letter-spacing: 2px;
            margin-top: 5px;
            background: rgba(0,0,0,0.5);
            display: inline-block;
            padding: 2px 8px;
            border-left: 3px solid var(--c-primary);
        }

        /* --- UNIFIED HUD (Top Right) --- */
        .unified-hud {
            background: var(--c-ui-bg);
            border: 1px solid rgba(255,255,255,0.2);
            border-right: 4px solid var(--c-secondary);
            padding: 10px 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            backdrop-filter: blur(5px);
            transform: skewX(-10deg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .hud-group {
            display: flex;
            flex-direction: column;
        }

        .hud-label { font-size: 0.6rem; color: #888; text-transform: uppercase; }
        .hud-value { font-family: var(--font-display); font-size: 1.2rem; color: #fff; }

        .hud-divider { width: 1px; height: 30px; background: rgba(255,255,255,0.2); }

        .stat-row { display: flex; gap: 10px; }
        .stat-item { 
            display: flex; align-items: center; gap: 5px; 
            background: rgba(255,255,255,0.1); padding: 2px 8px; 
            border-radius: 4px; font-weight: bold; font-size: 0.9rem;
        }

        /* --- MISSION CARD & CTA (Bottom Left) --- */
        .bottom-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
        }

        .mission-panel {
            pointer-events: auto;
            display: flex;
            gap: 0;
            transform: skewX(-5deg);
            max-width: 400px;
            position: relative;
        }

        .mission-card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--c-secondary);
            border-right: none;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Scanline effect on card */
        .mission-card::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(transparent 50%, rgba(0, 255, 255, 0.05) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }

        .mission-text {
            font-size: 0.9rem;
            line-height: 1.4;
            color: #ccc;
            margin-bottom: 0;
            font-family: var(--font-mono);
        }

        .mission-text strong { color: var(--c-secondary); }

        .cta-container {
            background: var(--c-primary);
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 5px 5px 0 rgba(0,0,0,0.5);
            transform: skewX(5deg); /* Counter skew for button area if needed, but here we keep panel skewed */
            border: 1px solid var(--c-primary);
        }

        .start-btn {
            background: #000;
            color: var(--c-primary);
            border: none;
            font-family: var(--font-display);
            font-size: 1.5rem;
            text-transform: uppercase;
            cursor: pointer;
            padding: 10px 20px;
            letter-spacing: 1px;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            transform: skewX(5deg); /* Un-skew text inside skewed container */
        }

        .start-btn:hover {
            background: var(--c-secondary);
            color: #000;
            box-shadow: 0 0 20px var(--c-secondary);
            transform: skewX(5deg) scale(1.05);
        }

        .start-btn:active { transform: skewX(5deg) scale(0.95); }

        /* --- CONTROLS (Bottom Right) --- */
        .controls-guide {
            pointer-events: auto;
            display: flex;
            gap: 15px;
            opacity: 0.7;
        }

        .key-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .key-cap {
            width: 40px; height: 40px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            border-bottom: 4px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: #fff;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }

        .key-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }

        /* --- HERO (CSS) --- */
        .hero-wrapper {
            position: absolute;
            bottom: 15%;
            left: 30%; /* Positioned on first platform */
            width: 120px; height: 140px;
            z-index: 5;
            animation: hero-bounce 2s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
            transform-origin: bottom center;
        }

        /* Hero Shadow */
        .hero-shadow {
            position: absolute; bottom: 0; left: 50%;
            width: 60px; height: 15px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            transform: translateX(-50%);
            filter: blur(4px);
            animation: shadow-fade 2s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
        }

        /* Hero Body */
        .hero-body {
            position: absolute; bottom: 10px; left: 20px;
            width: 70px; height: 70px;
            background: var(--c-secondary);
            border: 3px solid #000;
            border-radius: 40% 40% 45% 45%;
            box-shadow: inset -5px -5px 0 rgba(0,0,0,0.2);
            z-index: 2;
        }

        /* Hero Visor */
        .hero-visor {
            position: absolute; top: 20px; left: 5px;
            width: 60px; height: 25px;
            background: #111;
            border-radius: 15px;
            border: 2px solid #000;
            overflow: hidden;
        }
        .visor-light {
            position: absolute; top: 8px;
            width: 20px; height: 8px;
            background: var(--c-accent);
            border-radius: 4px;
            box-shadow: 0 0 10px var(--c-accent);
        }
        .vl-l { left: 10px; } .vl-r { right: 10px; }

        /* Hero Scarf */
        .hero-scarf {
            position: absolute; top: 15px; right: -20px;
            width: 60px; height: 15px;
            background: var(--c-primary);
            border: 2px solid #000;
            border-radius: 5px;
            z-index: 1;
            transform-origin: left center;
            animation: scarf-wave 0.5s ease-in-out infinite alternate;
        }

        /* Hero Legs */
        .hero-legs {
            position: absolute; bottom: 0; left: 25px;
            width: 60px; height: 25px;
            background: var(--c-accent);
            border-radius: 15px 15px 20px 20px;
            border: 3px solid #000;
            z-index: 1;
        }

        /* Animations */
        @keyframes hero-bounce {
            0%, 100% { transform: translateY(0) scaleY(1); }
            10% { transform: translateY(10px) scaleY(0.9); }
            50% { transform: translateY(-100px) scaleY(1.1); }
            80% { transform: translateY(5px) scaleY(0.95); }
        }

        @keyframes shadow-fade {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.6; }
            50% { transform: translateX(-50%) scale(0.3); opacity: 0.1; }
        }

        @keyframes scarf-wave {
            from { transform: rotate(-5deg) skewX(-10deg); }
            to { transform: rotate(15deg) skewX(10deg) translateX(5px); }
        }

        @keyframes glitch-anim {
            0% { transform: skew(0deg); }
            20% { transform: skew(-2deg); }
            40% { transform: skew(2deg); }
            60% { transform: skew(0deg); }
            80% { transform: skew(5deg); }
            100% { transform: skew(0deg); }
        }
        @keyframes glitch-anim-2 {
            0% { transform: translate(0,0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(2px, -2px); }
            60% { transform: translate(0,0); }
            80% { transform: translate(2px, 2px); }
            100% { transform: translate(0,0); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .game-title { font-size: 2.5rem; }
            .ui-layer { padding: 1rem; }
            .hero-wrapper { left: 20%; bottom: 12%; }
            .mission-panel { max-width: 250px; }
            .controls-guide { display: none; }
            .header-area { flex-direction: column; gap: 10px; }
            .unified-hud { width: 100%; justify-content: space-between; padding: 8px 15px; }
        }
    </style>
</head>
<body>

    <canvas id="world-canvas"></canvas>

    <!-- Hero Character -->
    <div class="hero-wrapper">
        <div class="hero-shadow"></div>
        <div class="hero-body">
            <div class="hero-visor">
                <div class="visor-light vl-l"></div>
                <div class="visor-light vl-r"></div>
            </div>
            <div class="hero-scarf"></div>
        </div>
        <div class="hero-legs"></div>
    </div>

    <!-- UI Overlay -->
    <div class="ui-layer">
        
        <header class="header-area">
            <div class="title-block">
                <div class="game-title">GLITCH<br>QUEST</div>
                <div class="game-subtitle">SYSTEM BREACH: NEON VALLEY</div>
            </div>

            <div class="unified-hud">
                <div class="hud-group">
                    <span class="hud-label">Zone</span>
                    <span class="hud-value" style="color:var(--c-primary)">01-A</span>
                </div>
                <div class="hud-divider"></div>
                <div class="stat-row">
                    <div class="stat-item" style="color: #ffea00;">
                        <span>🪙</span> <span>94</span>
                    </div>
                    <div class="stat-item" style="color: #ff007f;">
                        <span>🔑</span> <span>03</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="bottom-area">
            
            <div class="mission-panel">
                <div class="mission-card">
                    <p class="mission-text">
                        <strong>MISSION:</strong> Navigate the corrupted data streams. Avoid memory leaks. Reach the firewall before system reset.
                    </p>
                </div>
                <div class="cta-container">
                    <button class="start-btn" onclick="startGame()">Start<br>Adventure</button>
                </div>
            </div>

            <div class="controls-guide">
                <div class="key-card">
                    <div class="key-cap">Z</div>
                    <div class="key-label">Jump</div>
                </div>
                <div class="key-card">
                    <div class="key-cap">X</div>
                    <div class="key-label">Dash</div>
                </div>
                <div class="key-card">
                    <div class="key-cap">C</div>
                    <div class="key-label">Hack</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const canvas = document.getElementById('world-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- PALETTE ---
        const c = {
            bgTop: '#050011',
            bgBot: '#2b1055',
            grid: 'rgba(0, 255, 255, 0.15)',
            mtnFar: '#1a0b2e',
            mtnMid: '#3e1e6a',
            plat: '#00ffff',
            platDark: '#008888',
            coin: '#ffea00',
            enemy: '#ff007f',
            goal: '#ffffff'
        };

        // --- UTILS ---
        function drawRect(x, y, w, h, color, border=false) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
            if(border) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, w, h);
            }
        }

        function drawDataBlock(x, y, w, h) {
            // Main block
            ctx.fillStyle = 'rgba(0, 255, 255, 0.1)';
            ctx.fillRect(x, y, w, h);
            
            // Glitch border
            ctx.strokeStyle = c.plat;
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, w, h);

            // Inner tech details
            ctx.fillStyle = c.plat;
            ctx.fillRect(x + 5, y + 5, w - 10, 4); // Top bar
            ctx.fillRect(x + 5, y + h - 9, w - 10, 4); // Bottom bar
            
            // Random glitch line
            if(Math.random() > 0.95) {
                ctx.fillStyle = '#fff';
                ctx.fillRect(x, y + Math.random()*h, w, 2);
            }
        }

        function drawCoin(x, y, t) {
            const bounce = Math.sin(t * 0.005 + x) * 10;
            const spin = Math.abs(Math.cos(t * 0.003 + x));
            
            ctx.save();
            ctx.translate(x, y + bounce);
            ctx.scale(spin, 1);
            
            ctx.shadowBlur = 10;
            ctx.shadowColor = c.coin;
            ctx.fillStyle = c.coin;
            ctx.beginPath();
            ctx.arc(0, 0, 12, 0, Math.PI*2);
            ctx.fill();
            
            // Inner detail
            ctx.fillStyle = '#fff';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('$', 0, 1);
            
            ctx.restore();
        }

        function drawGlitchEnemy(x, y, t) {
            ctx.save();
            ctx.translate(x, y);
            
            // Jitter
            const jx = (Math.random() - 0.5) * 4;
            const jy = (Math.random() - 0.5) * 4;
            ctx.translate(jx, jy);

            // Body
            ctx.fillStyle = c.enemy;
            ctx.beginPath();
            ctx.moveTo(0, -15);
            ctx.lineTo(15, 0);
            ctx.lineTo(0, 15);
            ctx.lineTo(-15, 0);
            ctx.fill();

            // Eye
            ctx.fillStyle = '#fff';
            ctx.fillRect(-4, -4, 8, 4);
            
            ctx.restore();
        }

        // --- SCENE RENDERING ---
        function drawLayer(time) {
            // 1. Background Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, c.bgTop);
            grad.addColorStop(1, c.bgBot);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 2. Stars / Particles
            ctx.fillStyle = '#fff';
            for(let i=0; i<100; i++) {
                let sx = (i * 137) % width;
                let sy = (i * 67) % (height * 0.6);
                // Parallax shift
                sx -= (time * 0.02) % width;
                if(sx < 0) sx += width;
                
                let alpha = (Math.sin(time * 0.005 + i) + 1) / 2 * 0.8;
                ctx.globalAlpha = alpha;
                ctx.fillRect(sx, sy, 2, 2);
            }
            ctx.globalAlpha = 1;

            // 3. Mountains (Parallax)
            // Far
            ctx.fillStyle = c.mtnFar;
            ctx.beginPath();
            ctx.moveTo(0, height);
            for(let i=0; i<=width; i+=100) {
                let h = 100 + Math.sin(i * 0.01 + time * 0.0005) * 50;
                ctx.lineTo(i - (time * 0.1) % 200, height - h);
            }
            ctx.lineTo(width, height);
            ctx.fill();

            // Mid
            ctx.fillStyle = c.mtnMid;
            ctx.beginPath();
            ctx.moveTo(0, height);
            for(let i=0; i<=width; i+=80) {
                let h = 150 + Math.cos(i * 0.02 + time * 0.001) * 40;
                ctx.lineTo(i - (time * 0.2) % 160, height - h);
            }
            ctx.lineTo(width, height);
            ctx.fill();

            // 4. Grid Floor
            const groundY = height * 0.75;
            
            // Grid lines perspective
            ctx.strokeStyle = c.grid;
            ctx.lineWidth = 1;
            ctx.beginPath();
            // Horizontals
            for(let i=0; i < height - groundY; i+=40) {
                let y = groundY + i;
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
            }
            // Verticals (slanted)
            const gridSpeed = (time * 0.5) % 100;
            for(let i=-100; i < width + 100; i+=100) {
                ctx.moveTo(i - gridSpeed, groundY);
                ctx.lineTo((i - gridSpeed) - 200, height);
            }
            ctx.stroke();

            // 5. Platforms (Midground)
            // Platform 1 (Hero Stand)
            drawDataBlock(width * 0.15, groundY, 200, 40);
            
            // Platform 2
            drawDataBlock(width * 0.38, groundY - 100, 120, 30);
            
            // Platform 3 (High)
            drawDataBlock(width * 0.55, groundY - 220, 150, 35);
            
            // Platform 4 (Goal)
            drawDataBlock(width * 0.75, groundY - 150, 180, 40);

            // 6. Entities
            // Coins
            drawCoin(width * 0.42, groundY - 140, time);
            drawCoin(width * 0.46, groundY - 140, time);
            drawCoin(width * 0.60, groundY - 260, time);

            // Enemies
            drawGlitchEnemy(width * 0.50, groundY - 150, time);
            drawGlitchEnemy(width * 0.80, groundY - 190, time);

            // Goal (The "Firewall")
            const gx = width * 0.82;
            const gy = groundY - 150;
            
            // Pole
            ctx.fillStyle = '#fff';
            ctx.fillRect(gx, gy - 100, 4, 100);
            
            // Glitching Flag/Data
            ctx.fillStyle = c.plat;
            ctx.beginPath();
            ctx.moveTo(gx + 4, gy - 100);
            ctx.lineTo(gx + 40, gy - 80);
            ctx.lineTo(gx + 4, gy - 60);
            ctx.fill();
            
            // Glow
            ctx.shadowBlur = 20;
            ctx.shadowColor = c.plat;
            ctx.fillStyle = '#fff';
            ctx.fillRect(gx - 2, gy - 100, 8, 4);
            ctx.shadowBlur = 0;
        }

        function animate(time) {
            ctx.clearRect(0, 0, width, height);
            drawLayer(time);
            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        function startGame() {
            const btn = document.querySelector('.start-btn');
            btn.innerHTML = "LOADING...";
            btn.style.background = "#fff";
            btn.style.color = "#000";
            
            // Simulate loading
            setTimeout(() => {
                alert("System Breach Initiated. Welcome to Neon Valley.");
                btn.innerHTML = "START<br>ADVENTURE";
                btn.style.background = "#000";
                btn.style.color = "var(--c-primary)";
            }, 1000);
        }
    </script>
</body>
</html>
