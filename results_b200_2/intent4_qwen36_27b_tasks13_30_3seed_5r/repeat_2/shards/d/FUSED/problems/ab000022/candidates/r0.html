<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Bounce: The Lost Glitch</title>
    <style>
        :root {
            --bg-sky-top: #0f0c29;
            --bg-sky-mid: #302b63;
            --bg-sky-bot: #24243e;
            --accent-primary: #ff00cc; /* Neon Pink */
            --accent-secondary: #333399; /* Deep Blue */
            --accent-highlight: #00f2ff; /* Cyan */
            --accent-warning: #ffcc00; /* Gold */
            --accent-success: #00ff99; /* Lime */
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: var(--font-main);
            background-color: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            color: white;
        }

        /* --- BACKGROUND CANVAS --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* --- UI OVERLAY --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-rows: 60px 1fr 120px;
            grid-template-columns: 300px 1fr 300px;
            pointer-events: none; /* Let clicks pass to interactive elements */
        }

        /* --- HEADER --- */
        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            pointer-events: auto;
        }

        .game-logo {
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(to right, var(--accent-highlight), var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 15px rgba(0, 242, 255, 0.3);
            filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.5));
            transform: skew(-5deg);
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--accent-highlight);
            color: var(--accent-highlight);
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
        }

        .settings-btn:hover {
            background: var(--accent-highlight);
            color: #000;
            box-shadow: 0 0 15px var(--accent-highlight);
        }

        /* --- MAIN CONTENT AREA --- */
        .main-content {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            pointer-events: none;
        }

        /* --- HERO CARD (Center) --- */
        .hero-card {
            pointer-events: auto;
            background: rgba(15, 12, 41, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--accent-primary);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 90%;
            transform: translateY(0);
            transition: transform 0.3s ease;
            animation: floatCard 6s ease-in-out infinite;
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .hero-title {
            font-size: 1.2rem;
            color: var(--accent-warning);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .hero-desc {
            font-size: 1rem;
            color: #ddd;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* --- START BUTTON --- */
        .start-btn {
            background: linear-gradient(135deg, var(--accent-primary), #a200ff);
            color: white;
            border: none;
            padding: 18px 60px;
            font-size: 1.5rem;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 25px rgba(255, 0, 204, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            position: relative;
            overflow: hidden;
        }

        .start-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 35px rgba(255, 0, 204, 0.6);
        }
        
        .start-btn:hover::after {
            left: 100%;
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        /* --- SIDE PANELS --- */
        .panel {
            grid-row: 2;
            padding: 20px;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-left { grid-column: 1; align-items: flex-start; }
        .panel-right { grid-column: 3; align-items: flex-end; text-align: right; }

        /* --- WORLD SELECTOR --- */
        .world-selector {
            background: rgba(0,0,0,0.4);
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid var(--accent-success);
        }

        .world-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #aaa;
            margin-bottom: 5px;
        }

        .world-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-success);
        }

        .arrows {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .arrow {
            width: 24px;
            height: 24px;
            border: 1px solid #666;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .arrow:hover { border-color: white; color: white; }

        /* --- STATS --- */
        .stat-box {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,255,255,0.05);
            padding: 10px 20px;
            border-radius: 8px;
        }
        .panel-right .stat-box { flex-direction: row-reverse; }

        .stat-icon {
            width: 30px;
            height: 30px;
        }

        .stat-info h4 { font-size: 0.7rem; color: #888; text-transform: uppercase; }
        .stat-info span { font-size: 1.1rem; font-weight: bold; color: var(--accent-warning); }

        /* --- CONTROLS --- */
        .controls-guide {
            background: rgba(0,0,0,0.4);
            padding: 15px;
            border-radius: 12px;
            border-right: 4px solid var(--accent-highlight);
        }
        
        .key-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 5px;
        }
        
        .key {
            background: #333;
            border: 1px solid #555;
            border-bottom: 3px solid #111;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-family: monospace;
            color: white;
            min-width: 20px;
            text-align: center;
        }

        .action-text { font-size: 0.85rem; color: #ccc; }

        /* --- FOOTER --- */
        footer {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            pointer-events: auto;
            margin-bottom: 20px;
        }

        .social-link {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            cursor: pointer;
        }
        .social-link:hover { background: var(--accent-highlight); color: black; transform: translateY(-3px); }

        /* Responsive */
        @media (max-width: 900px) {
            .ui-layer {
                grid-template-columns: 1fr;
                grid-template-rows: 60px auto 1fr auto;
                padding-bottom: 20px;
            }
            .panel { display: none; } /* Hide side panels on mobile for cleaner look */
            .main-content { grid-row: 2 / 4; }
            footer { grid-row: 4; }
            .hero-card { width: 95%; }
        }

    </style>
</head>

    <script>
        // --- CANVAS DRAWING LOGIC ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        
        // Resize handling
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Colors
        const colors = {
            skyTop: '#0f0c29',
            skyMid: '#302b63',
            skyBot: '#24243e',
            neonPink: '#ff00cc',
            neonCyan: '#00f2ff',
            neonYellow: '#ffcc00',
            neonGreen: '#00ff99',
            darkPurple: '#1a0b2e',
            grid: 'rgba(255, 255, 255, 0.05)'
        };

        // --- ENTITIES ---

        // 1. Background Grid (Retro Wave style)
        function drawGrid(time) {
            ctx.save();
            // Perspective floor
            const horizon = height * 0.4;
            const gridY = horizon;
            
            // Vertical lines
            ctx.strokeStyle = colors.grid;
            ctx.lineWidth = 1;
            const centerX = width / 2;
            
            // Moving vertical lines
            for (let i = -20; i <= 20; i++) {
                let x = centerX + (i * 100);
                // Simple parallax shift
                x += Math.sin(time * 0.0005) * 20;
                
                ctx.beginPath();
                ctx.moveTo(centerX + (i * 20), gridY); // Vanishing point
                ctx.lineTo(x * 3, height); // Spread out at bottom
                ctx.stroke();
            }

            // Horizontal moving lines
            let offset = (time * 0.1) % 50;
            for (let i = 0; i < 20; i++) {
                let y = gridY + Math.pow(i, 2.2) + offset;
                if(y > height) y -= (height - gridY);
                
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            ctx.restore();
        }

        // 2. Sun/Moon
        function drawSun(time) {
            ctx.save();
            const sunX = width / 2;
            const sunY = height * 0.35;
            const radius = Math.min(width, height) * 0.15;

            // Gradient
            const grad = ctx.createLinearGradient(sunX, sunY - radius, sunX, sunY + radius);
            grad.addColorStop(0, colors.neonPink);
            grad.addColorStop(1, colors.neonYellow);

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(sunX, sunY, radius, 0, Math.PI * 2);
            ctx.fill();

            // Stripes through sun
            ctx.fillStyle = colors.skyMid; // Mask color
            for(let i = 0; i < 10; i++) {
                let h = 4 + i * 2;
                let y = sunY + (10 + i * 12);
                if (y < sunY + radius) {
                    ctx.fillRect(sunX - radius, y, radius * 2, h);
                }
            }
            ctx.restore();
        }

        // 3. Mountains (Parallax)
        function drawMountains(time, layer) {
            ctx.save();
            const speed = layer === 1 ? 0.02 : 0.05;
            const yOffset = layer === 1 ? height * 0.4 : height * 0.55;
            const color = layer === 1 ? '#120626' : '#1e0e36';
            const scale = layer === 1 ? 1.5 : 1;

            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, height);

            for (let x = 0; x <= width; x += 5) {
                // Simple noise function simulation
                let y = yOffset;
                y += Math.sin((x + time * speed) * 0.005 * scale) * 50;
                y += Math.sin((x + time * speed) * 0.01 * scale) * 25;
                y += Math.sin((x + time * speed) * 0.02) * 10;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.fill();
            ctx.restore();
        }

        // 4. The Hero (Sprite drawn with code)
        function drawHero(time) {
            ctx.save();
            
            // Floating animation
            const bounce = Math.sin(time * 0.005) * 10;
            const hX = width * 0.25;
            const hY = height * 0.6 + bounce;

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(hX, height * 0.6 + 60, 20, 5, 0, 0, Math.PI*2);
            ctx.fill();

            // Body (Blue)
            ctx.fillStyle = colors.neonCyan;
            ctx.beginPath();
            ctx.arc(hX, hY, 25, 0, Math.PI * 2);
            ctx.fill();

            // Inner face mask (White)
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(hX, hY, 18, 0, Math.PI * 2);
            ctx.fill();

            // Eyes (Black) - looking right
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(hX + 6, hY - 4, 3, 0, Math.PI * 2);
            ctx.arc(hX - 6, hY - 4, 3, 0, Math.PI * 2);
            ctx.fill();

            // Ears (Blue)
            ctx.fillStyle = colors.neonCyan;
            ctx.beginPath();
            ctx.arc(hX - 20, hY - 15, 8, 0, Math.PI * 2); // Left ear
            ctx.arc(hX + 20, hY - 15, 8, 0, Math.PI * 2); // Right ear
            ctx.fill();

            // Shoes (Red/Orange)
            ctx.fillStyle = '#ff5500';
            ctx.beginPath();
            ctx.ellipse(hX - 15, hY + 25, 10, 6, -0.2, 0, Math.PI * 2);
            ctx.ellipse(hX + 15, hY + 25, 10, 6, 0.2, 0, Math.PI * 2);
            ctx.fill();

            // Scarf (Pink) flowing
            ctx.strokeStyle = colors.neonPink;
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(hX - 15, hY - 5);
            ctx.quadraticCurveTo(hX - 40, hY - 10 + Math.sin(time*0.01)*5, hX - 60, hY + 5 + Math.sin(time*0.01)*10);
            ctx.stroke();

            ctx.restore();
        }

        // 5. Floating Elements (Coins, Platforms)
        function drawLevelElements(time) {
            ctx.save();
            
            // Platform 1
            const p1X = width * 0.6;
            const p1Y = height * 0.55;
            drawPlatform(p1X, p1Y, 120, 20);

            // Platform 2
            const p2X = width * 0.75;
            const p2Y = height * 0.45;
            drawPlatform(p2X, p2Y, 80, 20);

            // Coin
            const coinX = p1X + 60;
            const coinY = p1Y - 40 + Math.sin(time * 0.008) * 10;
            drawCoin(coinX, coinY, time);

            // Enemy (Floating Ghost)
            const enemyX = width * 0.85;
            const enemyY = height * 0.6 + Math.sin(time * 0.003) * 20;
            drawEnemy(enemyX, enemyY, time);

            // Distant Goal Flag
            const goalX = width * 0.9;
            const goalY = height * 0.5; // On ground
            drawGoal(goalX, goalY);

            ctx.restore();
        }

        function drawPlatform(x, y, w, h) {
            ctx.fillStyle = '#222';
            ctx.strokeStyle = colors.neonGreen;
            ctx.lineWidth = 2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = colors.neonGreen;
            
            // Rounded rect
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 5);
            ctx.fill();
            ctx.stroke();
            
            // Tech details
            ctx.fillStyle = colors.neonGreen;
            ctx.fillRect(x + 10, y + 5, 10, 4);
            ctx.fillRect(x + w - 20, y + 5, 10, 4);
            
            ctx.shadowBlur = 0;
        }

        function drawCoin(x, y, time) {
            ctx.save();
            ctx.translate(x, y);
            // Spin effect via scaleX
            const scale = Math.abs(Math.sin(time * 0.01));
            ctx.scale(scale, 1);
            
            ctx.fillStyle = colors.neonYellow;
            ctx.shadowBlur = 10;
            ctx.shadowColor = colors.neonYellow;
            
            ctx.beginPath();
            ctx.arc(0, 0, 12, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 0, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawEnemy(x, y, time) {
            ctx.save();
            ctx.translate(x, y);
            
            // Bobbing handled in caller, just drawing shape
            
            // Body
            ctx.fillStyle = '#ff0055';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff0055';
            
            // Spiky shape
            ctx.beginPath();
            ctx.moveTo(0, -20);
            ctx.lineTo(15, 10);
            ctx.lineTo(0, 25);
            ctx.lineTo(-15, 10);
            ctx.closePath();
            ctx.fill();
            
            // Eye
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, -5, 6, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(0, -5, 2, 0, Math.PI*2);
            ctx.fill();

            ctx.restore();
        }

        function drawGoal(x, y) {
            ctx.save();
            // Pole
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y - 100);
            ctx.stroke();

            // Flag
            ctx.fillStyle = colors.neonPink;
            ctx.beginPath();
            ctx.moveTo(x, y - 100);
            ctx.lineTo(x + 40, y - 80);
            ctx.lineTo(x, y - 60);
            ctx.fill();
            
            // Base
            ctx.fillStyle = colors.neonCyan;
            ctx.fillRect(x - 10, y - 10, 20, 10);
            ctx.restore();
        }

        // --- MAIN LOOP ---
        function animate(time) {
            // Clear
            ctx.clearRect(0, 0, width, height);

            // Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, colors.skyTop);
            grad.addColorStop(0.5, colors.skyMid);
            grad.addColorStop(1, colors.skyBot);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Draw Layers
            drawSun(time);
            drawGrid(time);
            drawMountains(time, 1); // Far
            drawLevelElements(time);
            drawMountains(time, 2); // Near
            drawHero(time);

            requestAnimationFrame(animate);
        }

        // Start loop
        requestAnimationFrame(animate);

        // --- INTERACTIVITY ---
        function startGame() {
            const btn = document.querySelector('.start-btn');
            btn.innerHTML = "LOADING...";
            btn.style.transform = "scale(0.95)";
            
            // Simulate a loading effect or transition
            setTimeout(() => {
                alert("Game Start! (Demo Mode)");
                btn.innerHTML = "START ADVENTURE";
                btn.style.transform = "scale(1)";
            }, 500);
        }

        // Simple hover effect on panels
        document.querySelectorAll('.panel').forEach(p => {
            p.addEventListener('mouseenter', () => {
                p.style.background = 'rgba(255,255,255,0.05)';
            });
            p.addEventListener('mouseleave', () => {
                p.style.background = 'transparent';
            });
        });

    </script>
</body>
</html>
