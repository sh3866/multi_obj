<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitch Quest: Neon Valley</title>
    <style>
        :root {
            --c-sky-top: #2b1055;
            --c-sky-bot: #7597de;
            --c-accent-pink: #ff007f;
            --c-accent-cyan: #00ffff;
            --c-accent-yellow: #ffea00;
            --c-accent-purple: #bd00ff;
            --c-ui-bg: rgba(10, 15, 30, 0.65);
            --c-ui-border: rgba(255, 255, 255, 0.3);
            
            --font-display: 'Arial Black', Impact, sans-serif;
            --font-ui: 'Segoe UI', 'Roboto', Helvetica, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--c-sky-top);
            font-family: var(--font-ui);
            color: white;
        }

        /* --- BACKGROUND CANVAS --- */
        #world-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 80px 1fr 100px;
            pointer-events: none; /* Let clicks pass through empty areas */
        }

        /* --- TOP HUD (Consolidated) --- */
        .top-hud {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            pointer-events: auto;
        }

        .game-title {
            font-family: var(--font-display);
            font-size: 2.5rem;
            color: var(--c-accent-cyan);
            text-transform: uppercase;
            transform: skewX(-10deg);
            text-shadow: 3px 3px 0 var(--c-accent-pink);
            letter-spacing: -1px;
        }

        .hud-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* HUD Panel (Glassmorphism) */
        .hud-panel {
            background: var(--c-ui-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--c-ui-border);
            border-radius: 12px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            font-size: 1.1rem;
            color: #fff;
        }

        .stat-icon {
            font-size: 1.2rem;
        }

        /* --- WORLD SELECTOR (Integrated into HUD) --- */
        .world-selector {
            background: var(--c-ui-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--c-ui-border);
            border-radius: 12px;
            padding: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .world-selector:hover { transform: scale(1.05); background: rgba(255,255,255,0.15); }

        .world-name {
            padding: 0 10px;
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--c-accent-yellow);
            text-transform: uppercase;
        }

        .world-arrow {
            width: 30px;
            height: 30px;
            background: var(--c-accent-pink);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        /* --- CONTROLS GUIDE (Mini HUD) --- */
        .controls-hud {
            margin-left: 10px;
            font-size: 0.8rem;
            opacity: 0.8;
            text-align: right;
            line-height: 1.2;
        }
        .key-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            border: 1px solid rgba(255,255,255,0.4);
            margin: 0 2px;
        }

        /* --- MAIN CONTENT (Hero Card) --- */
        .main-content {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .hero-card {
            pointer-events: auto;
            background: rgba(20, 20, 40, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 2px solid var(--c-accent-cyan);
            border-bottom: 2px solid var(--c-accent-pink);
            border-radius: 20px;
            padding: 50px 60px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 90%;
            position: relative;
            animation: cardFloat 6s ease-in-out infinite;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .hero-card h2 {
            font-family: var(--font-display);
            font-size: 3rem;
            color: white;
            margin-bottom: 10px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .hero-card p {
            font-size: 1.1rem;
            color: #ddd;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .start-btn {
            background: var(--c-accent-cyan);
            color: #000;
            border: none;
            padding: 18px 60px;
            font-size: 1.5rem;
            font-family: var(--font-display);
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            box-shadow: 
                0 0 20px rgba(0, 255, 255, 0.4),
                inset 0 -5px 0 rgba(0,0,0,0.2);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .start-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            transition: 0.5s;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.6);
            background: #fff;
        }
        
        .start-btn:hover::before {
            left: 100%;
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        /* --- HERO SPRITE (CSS) --- */
        /* Placed dynamically in the "world" */
        .hero-container {
            position: absolute;
            left: 20%;
            bottom: 14%; /* Aligns with ground level */
            width: 100px;
            height: 120px;
            z-index: 5;
            pointer-events: none;
            animation: heroIdle 2s ease-in-out infinite;
        }

        @keyframes heroIdle {
            0%, 100% { transform: translateY(0) scaleY(1); }
            50% { transform: translateY(-5px) scaleY(1.05); }
        }

        .hero-body {
            width: 70px;
            height: 70px;
            background: var(--c-accent-cyan);
            border-radius: 35%;
            border: 3px solid #000;
            position: absolute;
            bottom: 10px;
            left: 15px;
            z-index: 2;
            box-shadow: inset -5px -5px 0 rgba(0,0,0,0.2);
        }
        
        .hero-visors {
            width: 60px;
            height: 25px;
            background: #111;
            border-radius: 15px;
            position: absolute;
            top: 20px;
            left: 5px;
            z-index: 3;
            border: 2px solid #000;
            overflow: hidden;
        }

        .visor-light {
            width: 20px;
            height: 10px;
            background: var(--c-accent-pink);
            position: absolute;
            top: 8px;
            border-radius: 5px;
            box-shadow: 0 0 10px var(--c-accent-pink);
        }
        .vl-left { left: 8px; }
        .vl-right { right: 8px; }

        .hero-shoes {
            width: 80px;
            height: 25px;
            background: var(--c-accent-pink);
            border-radius: 15px 15px 25px 25px;
            position: absolute;
            bottom: 0;
            left: 10px;
            border: 3px solid #000;
            z-index: 1;
        }

        .hero-scarf {
            width: 50px;
            height: 15px;
            background: var(--c-accent-yellow);
            position: absolute;
            top: 10px;
            right: -25px;
            z-index: 0;
            border-radius: 5px;
            transform-origin: left center;
            animation: scarfFlow 1.5s ease-in-out infinite alternate;
            border: 2px solid #000;
        }

        @keyframes scarfFlow {
            from { transform: rotate(-10deg) translateX(0); }
            to { transform: rotate(20deg) translateX(15px); }
        }

        /* --- UTILS --- */
        @media (max-width: 900px) {
            .game-title { font-size: 1.5rem; }
            .hud-panel { display: none; } /* Hide stats on mobile */
            .world-selector { display: none; }
            .controls-hud { display: none; }
            .hero-card { padding: 30px; width: 95%; }
            .hero-card h2 { font-size: 2rem; }
            .hero-container { left: 10%; transform: scale(0.8); }
        }
    </style>
</head>
<body>

    <!-- Background World Canvas -->
    <canvas id="world-canvas"></canvas>

    <!-- The Hero Character -->
    <div class="hero-container">
        <div class="hero-body">
            <div class="hero-visors">
                <div class="visor-light vl-left"></div>
                <div class="visor-light vl-right"></div>
            </div>
            <div class="hero-scarf"></div>
        </div>
        <div class="hero-shoes"></div>
    </div>

    <!-- UI Overlay -->
    <div class="ui-layer">
        
        <!-- Top Bar: Logo & HUD -->
        <header class="top-hud">
            <div class="game-title">Glitch Quest</div>
            
            <div class="hud-right">
                <!-- World Selector -->
                <div class="world-selector">
                    <div class="world-name">Neon Valley</div>
                    <div class="world-arrow">▼</div>
                </div>

                <!-- Stats -->
                <div class="hud-panel">
                    <div class="stat-item"><span class="stat-icon">🪙</span> 094</div>
                    <div class="stat-item"><span class="stat-icon">🔑</span> 03</div>
                    <div class="stat-item"><span class="stat-icon">❤️</span> x3</div>
                </div>

                <!-- Controls Mini-Guide -->
                <div class="hud-panel controls-hud">
                    <div><span class="key-badge">Z</span> Jump</div>
                    <div><span class="key-badge">X</span> Dash</div>
                </div>
            </div>
        </header>

        <!-- Main Center: Hero Card -->
        <div class="main-content">
            <div class="hero-card">
                <h2>System Breach</h2>
                <p>
                    The code is corrupted. Jump across the glitching data streams, collect memory chips, and reach the Firewall before the system resets.
                </p>
                <button class="start-btn" onclick="startGame()">Start Adventure</button>
            </div>
        </div>

        <!-- Footer Area (Empty/Clean) -->
        <!-- Removed social icons as requested -->
    </div>

    <script>
        const canvas = document.getElementById('world-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const colors = {
            skyTop: '#2b1055',
            skyBot: '#7597de',
            gridLine: 'rgba(255, 255, 255, 0.15)',
            gridAccent: 'rgba(0, 255, 255, 0.1)',
            hillFar: '#3e1e6a',
            hillMid: '#582885',
            ground: '#1a0b2e',
            groundTop: '#ff007f',
            block: '#00ffff',
            blockAlt: '#bd00ff',
            coin: '#ffea00',
            enemy: '#ff0055',
            goal: '#ffffff'
        };

        // --- DRAWING HELPERS ---

        function drawStar(x, y, time) {
            const flicker = Math.sin(time * 0.005 + x) * 0.5 + 0.5;
            ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + flicker * 0.7})`;
            ctx.beginPath();
            ctx.arc(x, y, 1.5, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawMountain(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + w/2, y - h);
            ctx.lineTo(x + w, y);
            ctx.fill();
            
            // Add tech details
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.moveTo(x + w/2, y - h);
            ctx.lineTo(x + w/2 + 20, y - h + 40);
            ctx.lineTo(x + w/2 - 20, y - h + 40);
            ctx.fill();
        }

        function drawPlatform(x, y, w, h, type) {
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(x + 5, y + 5, w, h);

            // Main block
            ctx.fillStyle = type === 'ground' ? colors.ground : colors.block;
            ctx.fillRect(x, y, w, h);
            
            // Border/Highlight
            ctx.strokeStyle = type === 'ground' ? colors.groundTop : '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, w, h);

            // Tech details
            if (type !== 'ground') {
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(x + 5, y + 5, w - 10, 5);
                ctx.fillStyle = colors.coin;
                ctx.fillRect(x + w - 10, y + h - 10, 5, 5);
            }
        }

        function drawCoin(x, y, time) {
            const bounce = Math.sin(time * 0.005 + x) * 8;
            const scaleX = Math.abs(Math.cos(time * 0.003 + x));
            
            ctx.save();
            ctx.translate(x, y + bounce);
            ctx.scale(scaleX, 1);
            
            // Glow
            ctx.shadowBlur = 10;
            ctx.shadowColor = colors.coin;
            
            ctx.fillStyle = colors.coin;
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI*2);
            ctx.fill();
            
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.restore();
        }

        function drawGlitchBat(x, y, time) {
            ctx.save();
            ctx.translate(x, y + Math.sin(time*0.008)*15);
            
            // Glitch effect
            const glitchX = (Math.random() - 0.5) * 10;
            const glitchY = (Math.random() - 0.5) * 10;
            if(Math.random() > 0.8) ctx.translate(glitchX, glitchY);

            // Body (Diamond shape)
            ctx.fillStyle = colors.enemy;
            ctx.beginPath();
            ctx.moveTo(0, -10);
            ctx.lineTo(15, 0);
            ctx.lineTo(0, 10);
            ctx.lineTo(-15, 0);
            ctx.fill();

            // Wings (Flapping)
            const wingAngle = Math.sin(time * 0.02) * 0.5;
            
            ctx.fillStyle = '#ff5588';
            // Left Wing
            ctx.beginPath();
            ctx.moveTo(-10, 0);
            ctx.lineTo(-30, -10 + (Math.sin(time*0.02)*10));
            ctx.lineTo(-20, 10);
            ctx.fill();
            
            // Right Wing
            ctx.beginPath();
            ctx.moveTo(10, 0);
            ctx.lineTo(30, -10 + (Math.sin(time*0.02)*10));
            ctx.lineTo(20, 10);
            ctx.fill();

            // Eye
            ctx.fillStyle = '#fff';
            ctx.fillRect(-3, -2, 6, 4);

            ctx.restore();
        }

        function drawGoal(x, y) {
            // Pole
            ctx.fillStyle = '#fff';
            ctx.fillRect(x, y - 150, 4, 150);
            
            // Flag (Triangle)
            ctx.fillStyle = colors.block;
            ctx.beginPath();
            ctx.moveTo(x + 4, y - 150);
            ctx.lineTo(x + 50, y - 130);
            ctx.lineTo(x + 4, y - 110);
            ctx.fill();

            // Glow base
            ctx.shadowBlur = 20;
            ctx.shadowColor = colors.goal;
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.beginPath();
            ctx.arc(x + 2, y, 10, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // --- MAIN SCENE ---
        function animate(time) {
            ctx.clearRect(0, 0, width, height);

            // 1. Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, colors.skyTop);
            grad.addColorStop(1, colors.skyBot);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 2. Stars
            for(let i=0; i<50; i++) {
                drawStar((i * 137) % width, (i * 67) % (height/2), time);
            }

            // 3. Distant Hills (Parallax)
            const parallaxX = time * 0.05;
            drawMountain(0 - (parallaxX % 800), height * 0.7, 800, 200, colors.hillFar);
            drawMountain(400 - (parallaxX % 800), height * 0.7, 800, 200, colors.hillFar);
            
            // Mid Hills
            const parallaxMid = time * 0.1;
            drawMountain(100 - (parallaxMid % 1000), height * 0.8, 600, 150, colors.hillMid);
            drawMountain(600 - (parallaxMid % 1000), height * 0.8, 600, 150, colors.hillMid);

            // 4. Ground Layer
            const groundY = height * 0.85;
            
            // Grid floor effect
            ctx.fillStyle = colors.ground;
            ctx.fillRect(0, groundY, width, height - groundY);
            
            // Grid lines
            ctx.strokeStyle = colors.gridLine;
            ctx.lineWidth = 2;
            const gridOffset = (time * 0.2) % 50;
            
            ctx.beginPath();
            // Verticals
            for(let i = -50; i < width; i+=50) {
                ctx.moveTo(i - gridOffset, groundY);
                ctx.lineTo(i - gridOffset - 100, height); // Perspective slant
            }
            // Horizontals
            for(let i = 0; i < height - groundY; i+=40) {
                ctx.moveTo(0, groundY + i);
                ctx.lineTo(width, groundY + i);
            }
            ctx.stroke();

            // Ground Top Highlight
            ctx.fillStyle = colors.groundTop;
            ctx.fillRect(0, groundY, width, 5);

            // 5. Level Geometry (The "Preview")
            
            // Hero Platform
            drawPlatform(width * 0.15, groundY, 200, 40, 'ground');

            // Floating Platforms sequence
            const startX = width * 0.4;
            const startY = height * 0.65;

            drawPlatform(startX, startY, 80, 30, 'brick');
            drawPlatform(startX + 120, startY - 60, 80, 30, 'brick');
            drawPlatform(startX + 240, startY - 20, 80, 30, 'brick');
            drawPlatform(startX + 360, startY - 80, 120, 30, 'brick'); // Goal platform

            // Coins
            drawCoin(startX + 40, startY - 40, time);
            drawCoin(startX + 160, startY - 100, time);
            drawCoin(startX + 280, startY - 60, time);
            drawCoin(startX + 300, startY - 80, time);

            // Enemy
            drawGlitchBat(startX + 200, startY - 60, time);
            drawGlitchBat(startX + 380, startY - 120, time);

            // Goal
            drawGoal(startX + 420, startY - 50);

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        function startGame() {
            const btn = document.querySelector('.start-btn');
            btn.innerText = "LOADING...";
            btn.style.background = "#fff";
            setTimeout(() => {
                alert("Game Launching...");
                btn.innerText = "Start Adventure";
                btn.style.background = "";
            }, 600);
        }
    </script>
</body>
</html>
