<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play Sign | Product Visual</title>
<style>
  :root {
    --bg-top: #f0f2f5;
    --bg-bottom: #dcdfe4;
    --sign-face: #ffffff;
    --sign-side: #e8eaed;
    --sign-shadow: rgba(0,0,0,0.15);
    --emblem-red: #e60000;
    --emblem-dark: #b30000;
    --metal-light: #f5f5f7;
    --metal-dark: #a1a1a6;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-bottom);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1500px; /* Deep perspective */
  }

  /* Studio Backdrop */
  .studio-backdrop {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at 50% 30%, #ffffff 0%, var(--bg-top) 40%, var(--bg-bottom) 100%);
    z-index: 0;
  }

  /* Floor Reflection Line */
  .floor-line {
    position: absolute;
    bottom: 25%;
    left: 0;
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.05) 20%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.05) 80%, transparent 100%);
    z-index: 1;
  }

  /* Scene Container for 3D positioning */
  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
  }

  /* The Sign Assembly */
  .sign-assembly {
    position: relative;
    width: 400px;
    height: 400px;
    transform-style: preserve-3d;
    /* Initial angle */
    transform: rotateX(5deg) rotateY(-5deg);
    transition: transform 0.1s ease-out; /* Smooth follow */
    cursor: pointer;
  }

  /* --- Mounting Hardware (Bracket) --- */
  .bracket {
    position: absolute;
    top: -40px; /* Behind the sign */
    left: 50%;
    width: 220px;
    height: 140px;
    transform: translateX(-50%) translateZ(-20px);
    transform-style: preserve-3d;
    z-index: 1;
  }

  /* The vertical arm attached to wall */
  .bracket-arm {
    position: absolute;
    top: 0;
    left: 50%;
    width: 12px;
    height: 100%;
    transform: translateX(-50%) rotateX(90deg) translateY(-20px);
    transform-origin: top;
    background: linear-gradient(90deg, var(--metal-dark), var(--metal-light), var(--metal-dark));
    border-radius: 2px;
    box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
  }
  
  /* The horizontal plate holding the sign */
  .bracket-plate {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 180px;
    height: 12px;
    transform: translateX(-50%) rotateX(90deg);
    background: linear-gradient(90deg, var(--metal-dark), var(--metal-light), var(--metal-dark));
    border-radius: 4px;
    box-shadow: 0 10px 15px rgba(0,0,0,0.1);
  }

  /* Screws on bracket */
  .screw {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #ccc;
    border-radius: 50%;
    box-shadow: inset 1px 1px 2px rgba(0,0,0,0.5);
  }
  .screw::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 3px; height: 1px;
    background: #555;
    transform: translate(-50%, -50%) rotate(45deg);
  }
  .screw-top { top: 10px; left: 10px; }
  .screw-bottom { bottom: 10px; right: 10px; }


  /* --- The Sign Slab --- */
  .sign-face {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: var(--sign-face);
    border-radius: 32px;
    transform: translateZ(0);
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
    /* High-gloss material simulation */
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.9);
    overflow: hidden;
  }

  /* Subtle inner gradient for curvature */
  .sign-face::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 32px;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,1) 0%, rgba(245,245,245,1) 100%);
    z-index: -1;
  }

  /* The 3D Thickness (Extrusion) */
  /* We construct the 3D block using pseudo-elements and a dedicated div for the back */
  
  /* Back Face */
  .sign-back {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #d1d1d1;
    border-radius: 32px;
    transform: translateZ(-20px);
    z-index: 5;
  }

  /* Side Faces (Bottom and Right visible from default angle) */
  .sign-side-bottom {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 20px;
    background: linear-gradient(to bottom, #e6e6e6, #d1d1d1);
    transform-origin: bottom;
    transform: rotateX(-90deg) translateY(100%); /* Flip out */
    /* Correction for rounded corners approximation */
    transform: rotateX(-90deg) translateY(10px) translateZ(-10px); 
    /* Note: Perfect rounded extrusion in pure CSS is complex, using flat planes for clean look */
    border-radius: 0 0 32px 32px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }

  .sign-side-right {
    position: absolute;
    top: 0; right: 0;
    width: 20px; height: 100%;
    background: linear-gradient(to right, #e6e6e6, #d1d1d1);
    transform-origin: right;
    transform: rotateY(90deg) translateX(100%);
    transform: rotateY(90deg) translateX(10px) translateZ(-10px);
    border-radius: 0 32px 32px 0;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }

  /* --- The Emblem --- */
  .emblem-wrapper {
    position: relative;
    width: 200px;
    height: 200px;
    transform-style: preserve-3d;
    transform: translateZ(15px); /* Floats slightly off the face */
  }

  .emblem-circle {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff3333, var(--emblem-red), var(--emblem-dark));
    box-shadow: 
      0 20px 40px rgba(200, 0, 0, 0.25), /* Soft colored shadow */
      inset 0 2px 10px rgba(255,255,255,0.4), /* Top gloss */
      inset 0 -5px 15px rgba(0,0,0,0.15); /* Bottom depth */
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Glossy reflection on the emblem */
  .emblem-gloss {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 100%);
    opacity: 0.8;
    pointer-events: none;
  }

  .play-triangle {
    width: 0; 
    height: 0; 
    border-top: 32px solid transparent;
    border-bottom: 32px solid transparent; 
    border-left: 52px solid white;
    margin-left: 6px; /* Optical centering */
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
    position: relative;
    z-index: 2;
  }

  /* --- LED Indicator --- */
  .led-indicator {
    position: absolute;
    top: 32px;
    right: 32px;
    width: 8px;
    height: 8px;
    background: #333;
    border-radius: 50%;
    transform: translateZ(2px);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
    z-index: 11;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  
  .led-light {
    width: 4px;
    height: 4px;
    background: #ff3333;
    border-radius: 50%;
    box-shadow: 
      0 0 4px #ff0000,
      0 0 8px #ff0000;
    animation: pulse 2s infinite ease-in-out;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.8; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 10px #ff0000; }
  }

  /* --- Shadows on the Wall/Floor --- */
  /* Contact shadow behind the bracket */
  .bracket-shadow {
    position: absolute;
    top: -10px;
    left: 50%;
    width: 120px;
    height: 60px;
    transform: translateX(-50%) translateZ(-22px);
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.2) 0%, transparent 70%);
    filter: blur(4px);
    z-index: 0;
  }

  /* Cast shadow of the sign on the wall */
  .sign-wall-shadow {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    border-radius: 32px;
    transform: translateZ(-25px) translateX(15px) translateY(15px);
    filter: blur(20px);
    opacity: 0.15;
    z-index: 0;
  }

  /* Floor reflection/shadow */
  .floor-shadow {
    position: absolute;
    bottom: -120px; /* Distance to floor */
    left: 50%;
    transform: translateX(-50%) rotateX(80deg); /* Flatten onto floor */
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, transparent 60%);
    filter: blur(15px);
    transform-origin: center;
    z-index: 0;
    opacity: 0.6;
  }

  /* Interactive Hover States */
  .sign-assembly:hover .emblem-circle {
    box-shadow: 
      0 25px 50px rgba(200, 0, 0, 0.35),
      inset 0 2px 10px rgba(255,255,255,0.5),
      inset 0 -5px 15px rgba(0,0,0,0.15);
  }
  
  .sign-assembly:hover .play-triangle {
    margin-left: 10px; /* Subtle movement */
  }

</style>
</head>
<body>

  <div class="studio-backdrop"></div>
  <div class="floor-line"></div>

  <div class="scene">
    
    <div class="sign-assembly" id="signAssembly">
      
      <!-- Wall Shadows -->
      <div class="bracket-shadow"></div>
      <div class="sign-wall-shadow"></div>

      <!-- Mounting Hardware (Behind Sign) -->
      <div class="bracket">
        <div class="bracket-arm">
          <div class="screw screw-top"></div>
        </div>
        <div class="bracket-plate">
          <div class="screw screw-bottom"></div>
        </div>
      </div>

      <!-- The 3D Sign Object -->
      <div class="sign-back"></div>
      <div class="sign-side-bottom"></div>
      <div class="sign-side-right"></div>
      
      <!-- Front Face -->
      <div class="sign-face">
        <!-- Status LED -->
        <div class="led-indicator">
          <div class="led-light"></div>
        </div>

        <!-- The Emblem -->
        <div class="emblem-wrapper">
          <div class="emblem-circle">
            <div class="emblem-gloss"></div>
            <div class="play-triangle"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- Floor Shadow (Stays on floor while sign moves) -->
    <div class="floor-shadow" id="floorShadow"></div>

  </div>

  <script>
    const assembly = document.getElementById('signAssembly');
    const floorShadow = document.getElementById('floorShadow');
    const scene = document.querySelector('.scene');

    // Configuration
    const maxRotation = 10; // degrees
    const maxShadowOffset = 30; // pixels

    scene.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      
      // Calculate mouse position relative to center (-1 to 1)
      const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
      const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);

      // Rotate the sign based on mouse position
      // Note: RotateX is inverted to simulate looking up/down naturally
      const rotateX = -y * maxRotation;
      const rotateY = x * maxRotation;

      // Apply transform with a slight base tilt for the "product shot" look
      assembly.style.transform = `rotateX(${5 + rotateX}deg) rotateY(${-5 + rotateY}deg)`;

      // Move the floor shadow in opposite direction of light source (mouse)
      // If mouse is right (positive X), shadow moves left (negative X)
      const shadowX = -x * maxShadowOffset;
      const shadowY = -y * (maxShadowOffset / 2); // Less vertical movement
      
      floorShadow.style.transform = `translateX(calc(-50% + ${shadowX}px)) translateY(${shadowY}px)`;
    });

    scene.addEventListener('mouseleave', () => {
      // Reset to default "Product Shot" angle
      assembly.style.transform = `rotateX(5deg) rotateY(-5deg)`;
      floorShadow.style.transform = `translateX(-50%)`;
    });
  </script>
</body>
</html>
