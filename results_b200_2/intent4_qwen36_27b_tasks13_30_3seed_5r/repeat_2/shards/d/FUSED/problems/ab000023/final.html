<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play Sign | Refined Product Visual</title>
<style>
  :root {
    /* --- Environment --- */
    --bg-wall-top: #f4f4f6;
    --bg-wall-bottom: #e0e0e4;
    --bg-floor-top: #dcdde0;
    --bg-floor-bottom: #c4c6cb;
    
    /* --- Sign Material: Pristine White --- */
    --sign-face-light: #ffffff;
    --sign-face-base: #f9f9fb;
    --sign-face-dark: #e1e2e6;
    
    /* --- Sign Edge: Thick Extrusion --- */
    --edge-light: #f2f2f2;
    --edge-mid: #dcdde0;
    --edge-dark: #b0b1b5;
    --edge-shadow: #8a8c92;

    /* --- Emblem: Red & White --- */
    --red-highlight: #ff5c64;
    --red-base: #e62127;
    --red-shadow: #a81015;
    --red-deep: #7a0b0f;
    
    /* --- Hardware: Matte Metal --- */
    --metal-light: #f0f0f0;
    --metal-base: #b0b1b5;
    --metal-dark: #7a7c82;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: system-ui, -apple-system, sans-serif;
    perspective: 1000px;
    /* Light grey wall plane behind everything */
    background: radial-gradient(circle at 50% 20%, var(--bg-wall-top), var(--bg-wall-bottom));
  }

  /* --- Environment: Minimal Studio --- */
  .studio-env {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  /* Floor Plane */
  .floor-plane {
    position: absolute;
    top: 50%; /* Horizon line */
    left: -50%;
    width: 200%;
    height: 100%;
    background: linear-gradient(to bottom, var(--bg-floor-top), var(--bg-floor-bottom));
    transform: rotateX(75deg);
    transform-origin: top center;
    box-shadow: inset 0 0 100px rgba(0,0,0,0.1);
  }

  /* --- 3D Scene Container --- */
  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
    z-index: 10;
  }

  /* --- The Sign Assembly --- */
  .sign-assembly {
    position: relative;
    width: 300px;
    height: 300px;
    transform-style: preserve-3d;
    /* Base Pose: Slight angle to show depth */
    transform: rotateX(10deg) rotateY(-20deg);
    transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    cursor: pointer;
  }

  /* --- Mounting Hardware (Screws) --- */
  /* Anchored at top corners, physically attached */
  .mounting-hardware {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    pointer-events: none;
    z-index: 1; /* In front of the sign face */
  }

  .screw {
    position: absolute;
    width: 12px;
    height: 12px;
    background: radial-gradient(circle at 30% 30%, var(--metal-light), var(--metal-base));
    border-radius: 50%;
    box-shadow: 
      0 1px 2px rgba(0,0,0,0.4),
      inset 0 0 2px rgba(255,255,255,0.5);
    transform: translateZ(22px); /* Slightly protruding */
  }

  .screw::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 6px; height: 2px;
    background: #555;
    transform: translate(-50%, -50%) rotate(45deg);
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.5);
  }

  .screw-top-left { top: 20px; left: 20px; }
  .screw-top-right { top: 20px; right: 20px; }

  /* --- The Sign Slab (Extruded Object) --- */
  .sign-container {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
  }

  /* Back Face (Hidden mostly, but provides shadow anchor) */
  .sign-back {
    position: absolute;
    inset: 0;
    background: #dcdde0;
    border-radius: 12px;
    transform: translateZ(-20px);
    box-shadow: 0 0 60px rgba(0,0,0,0.3);
  }

  /* Side Extrusions: Exaggerated Thickness (40px) */
  /* Right Edge */
  .side-right {
    position: absolute;
    top: 0; right: 0;
    width: 40px;
    height: 100%;
    background: linear-gradient(to right, var(--edge-light), var(--edge-dark));
    transform-origin: right;
    transform: rotateY(90deg) translateZ(0px); /* CSS 3D fix */
    border-radius: 0 12px 12px 0;
    /* Fix for translateZ on rotated element to align perfectly */
    transform: rotateY(90deg) translateX(0px);
    left: 100%;
    width: 40px;
    margin-left: -40px;
  }
  /* Correct positioning for right face */
  .side-right {
    position: absolute;
    top: 0; right: -40px;
    width: 40px;
    height: 100%;
    background: linear-gradient(to right, var(--edge-light), var(--edge-dark));
    transform-origin: left;
    transform: rotateY(90deg);
    border-radius: 0 12px 12px 0;
  }

  /* Bottom Edge */
  .side-bottom {
    position: absolute;
    bottom: -40px; left: 0;
    width: 100%;
    height: 40px;
    background: linear-gradient(to bottom, var(--edge-mid), var(--edge-shadow));
    transform-origin: top;
    transform: rotateX(90deg);
    border-radius: 0 0 12px 12px;
  }

  /* Front Face */
  .sign-face {
    position: absolute;
    inset: 0;
    /* Subtle Linear Gradient: Lighter top-left, darker bottom-right */
    background: linear-gradient(135deg, var(--sign-face-light) 0%, var(--sign-face-base) 40%, var(--sign-face-dark) 100%);
    border-radius: 12px;
    transform: translateZ(0);
    /* Inner rim light */
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.9), inset 0 0 30px rgba(255,255,255,0.2);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* --- The Emblem (Refined) --- */
  .emblem {
    position: relative;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    /* Deep Red Volume */
    background: radial-gradient(circle at 30% 30%, var(--red-highlight), var(--red-base) 60%, var(--red-shadow) 100%);
    
    /* Shadows: Outer for depth, Inner for "embossed" feel */
    box-shadow: 
      0 10px 30px rgba(168, 16, 21, 0.3), /* Soft colored shadow */
      inset 0 2px 5px rgba(255,255,255,0.5), /* Top specular */
      inset 0 -5px 10px rgba(0,0,0,0.25); /* Bottom inner shadow */
      
    display: flex;
    justify-content: center;
    align-items: center;
    transform: translateZ(8px); /* Floating slightly above face */
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* The Play Triangle (SVG) */
  .triangle {
    width: 50px;
    height: 50px;
    margin-left: 4px; /* Optical centering */
    fill: #ffffff;
    /* Crisp drop shadow for 3D pop */
    filter: drop-shadow(2px 4px 3px rgba(0,0,0,0.25));
    /* Sharp Geometry */
    transform: skewX(-5deg);
  }

  /* Glossy Highlight (Sphere Reflection) */
  .emblem::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.1) 20%, transparent 60%);
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  /* --- Shadows --- */
  
  /* Wall Shadow (Behind assembly) */
  .wall-shadow {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    border-radius: 12px;
    transform: translateZ(-50px) translateX(60px) translateY(60px);
    filter: blur(40px);
    opacity: 0.15;
    z-index: -2;
    pointer-events: none;
  }

  /* Floor Shadow (Grounding) */
  .floor-shadow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 300px;
    height: 300px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.3) 0%, transparent 70%);
    transform: translate(-50%, -50%) translateZ(-150px) rotateX(90deg) scale(1.5);
    filter: blur(15px);
    pointer-events: none;
    z-index: -1;
  }

  /* --- Interaction --- */
  .sign-assembly:hover .emblem {
    transform: translateZ(12px) scale(1.05);
    box-shadow: 
      0 20px 40px rgba(168, 16, 21, 0.4),
      inset 0 2px 5px rgba(255,255,255,0.5),
      inset 0 -5px 10px rgba(0,0,0,0.25);
  }

</style>
</head>
<body>

  <div class="studio-env">
    <div class="floor-plane"></div>
  </div>

  <div class="scene">
    
    <div class="sign-assembly" id="signAssembly">
      
      <!-- Shadows -->
      <div class="wall-shadow"></div>
      <div class="floor-shadow"></div>

      <!-- The 3D Sign Object -->
      <div class="sign-container">
        <div class="sign-back"></div>
        <div class="side-right"></div>
        <div class="side-bottom"></div>
        
        <div class="sign-face">
          <div class="emblem">
            <!-- SVG Triangle for crisp geometry -->
            <svg class="triangle" viewBox="0 0 100 100" preserveAspectRatio="none">
              <defs>
                <filter id="inner-shadow">
                  <feOffset dx="-2" dy="-2"/>
                  <feGaussianBlur stdDeviation="2" result="offset-blur"/>
                  <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                  <feFlood flood-color="black" flood-opacity="0.1" result="color"/>
                  <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                  <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
                </filter>
                <linearGradient id="white-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff" />
                  <stop offset="100%" stop-color="#f0f0f0" />
                </linearGradient>
              </defs>
              <path d="M20,20 L80,50 L20,80 Z" fill="url(#white-grad)" filter="url(#inner-shadow)" />
            </svg>
          </div>
        </div>
      </div>

      <!-- Mounting Hardware (Screws) -->
      <div class="mounting-hardware">
        <div class="screw screw-top-left"></div>
        <div class="screw screw-top-right"></div>
      </div>

    </div>

  </div>

  <script>
    const assembly = document.getElementById('signAssembly');
    const scene = document.querySelector('.scene');

    // Configuration
    const maxRotation = 10; // degrees

    scene.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      
      // Calculate mouse position relative to center (-1 to 1)
      const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
      const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);

      // Rotate the sign based on mouse position
      // Base angles: rotateX(10deg) rotateY(-20deg)
      // We interpolate slightly towards the mouse
      const rotateX = 10 - (y * maxRotation);
      const rotateY = -20 + (x * maxRotation);

      assembly.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    scene.addEventListener('mouseleave', () => {
      // Reset to default "Product Shot" angle
      assembly.style.transform = `rotateX(10deg) rotateY(-20deg)`;
    });
  </script>
</body>
</html>
