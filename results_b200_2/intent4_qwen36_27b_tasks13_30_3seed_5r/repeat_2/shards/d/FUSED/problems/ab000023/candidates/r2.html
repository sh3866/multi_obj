<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play Sign | Product Visual</title>
<style>
  :root {
    /* Color Palette */
    --bg-top: #e8e9eb;
    --bg-bottom: #c7c9cc;
    
    --sign-face: #ffffff;
    --sign-side: #dcdde0;
    --sign-side-shadow: #c2c4c8;
    
    --emblem-red: #D91B24; /* Flat, high-quality red */
    --emblem-red-dark: #b0151c; /* Subtle shading */
    
    --metal-light: #f7f7f7;
    --metal-mid: #d1d1d1;
    --metal-dark: #9a9a9a;
    
    --shadow-color: rgba(0, 0, 0, 0.15);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-bottom);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1200px;
  }

  /* --- Scene Environment --- */
  .studio-backdrop {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 20%, #ffffff 0%, var(--bg-top) 50%, var(--bg-bottom) 100%);
    z-index: 0;
  }

  /* Floor Horizon Line */
  .floor-line {
    position: absolute;
    bottom: 30%;
    left: 0;
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.1) 20%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.1) 80%, transparent 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* --- 3D Scene Container --- */
  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
  }

  /* --- The Sign Assembly --- */
  .sign-assembly {
    position: relative;
    width: 360px;
    height: 360px;
    transform-style: preserve-3d;
    /* Base Angle: Slight tilt up and right */
    transform: rotateX(8deg) rotateY(-12deg);
    transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    cursor: pointer;
  }

  /* --- Mounting Hardware (The Stand) --- */
  /* Placed behind the sign to support it */
  .stand {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100px;
    height: 100px;
    transform: translate(-50%, -50%) translateZ(-30px); /* Push back */
    transform-style: preserve-3d;
    z-index: 1;
  }

  /* Vertical Wall Mount */
  .stand-plate {
    position: absolute;
    top: 0; left: 50%;
    width: 60px;
    height: 100%;
    transform: translateX(-50%) rotateX(-90deg) translateY(50%); /* Flattened against wall */
    background: linear-gradient(to bottom, var(--metal-mid), var(--metal-dark));
    border-radius: 4px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
  }

  /* Horizontal Arm holding the sign */
  .stand-arm {
    position: absolute;
    bottom: 0; left: 50%;
    width: 200px;
    height: 12px;
    transform: translateX(-50%) rotateX(90deg) translateY(6px);
    background: linear-gradient(to right, var(--metal-dark), var(--metal-light), var(--metal-dark));
    border-radius: 2px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }

  /* Screws for hardware realism */
  .screw {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #555;
    border-radius: 50%;
    box-shadow: inset 1px 1px 2px rgba(255,255,255,0.3), 1px 1px 2px rgba(0,0,0,0.5);
  }
  .screw::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 6px; height: 1px;
    background: #222;
    transform: translate(-50%, -50%) rotate(45deg);
  }
  .screw-1 { top: 15px; left: 10px; }
  .screw-2 { bottom: 15px; right: 10px; }


  /* --- The Sign Slab (Extruded Object) --- */
  .sign-container {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
  }

  /* Back Face */
  .sign-back {
    position: absolute;
    inset: 0;
    background: #dcdde0;
    border-radius: 28px;
    transform: translateZ(-20px);
    box-shadow: 0 0 20px rgba(0,0,0,0.2);
  }

  /* Front Face */
  .sign-face {
    position: absolute;
    inset: 0;
    background: var(--sign-face);
    border-radius: 28px;
    transform: translateZ(0);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.8); /* Rim light */
    display: flex;
    justify-content: center;
    align-items: center;
    /* Subtle texture/gradient for material weight */
    background: linear-gradient(135deg, #ffffff 0%, #f9f9fa 100%);
  }

  /* Side Extrusions (The "Thickness") */
  /* We use 20px depth */
  .side-right {
    position: absolute;
    top: 0; right: 0;
    width: 20px;
    height: 100%;
    background: linear-gradient(to right, #e8eaed, #dcdde0);
    transform-origin: right;
    transform: rotateY(90deg) translateX(10px);
    border-radius: 0 28px 28px 0;
    box-shadow: inset 2px 0 5px rgba(0,0,0,0.05);
  }

  .side-bottom {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    height: 20px;
    background: linear-gradient(to bottom, #e8eaed, #cfcfd2);
    transform-origin: bottom;
    transform: rotateX(-90deg) translateY(10px);
    border-radius: 0 0 28px 28px;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
  }

  /* --- The Emblem (Refined) --- */
  .emblem {
    position: relative;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    /* Flat high-quality red, subtle gradient for shape definition, not gloss */
    background: radial-gradient(circle at 40% 40%, #e0252d, var(--emblem-red) 60%, var(--emblem-red-dark));
    box-shadow: 
      0 10px 25px rgba(180, 0, 0, 0.2), /* Soft colored drop shadow */
      inset 0 1px 1px rgba(255,255,255,0.2); /* Subtle edge highlight */
    display: flex;
    justify-content: center;
    align-items: center;
    transform: translateZ(2px); /* Slight emboss */
  }

  /* The Play Triangle */
  .triangle {
    width: 0;
    height: 0;
    border-top: 28px solid transparent;
    border-bottom: 28px solid transparent;
    border-left: 46px solid #ffffff;
    margin-left: 8px; /* Optical centering */
    /* Crisp shadow for the triangle to stand out */
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
  }

  /* --- Shadows --- */
  
  /* Wall Shadow (Behind the whole assembly) */
  .wall-shadow {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    border-radius: 28px;
    transform: translateZ(-40px) translateX(20px) translateY(20px);
    filter: blur(25px);
    opacity: 0.15;
    z-index: -1;
  }

  /* Floor Shadow (Grounding) */
  .floor-shadow {
    position: absolute;
    bottom: -140px;
    left: 50%;
    width: 320px;
    height: 60px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.25) 0%, transparent 70%);
    transform: translateX(-50%) rotateX(85deg);
    filter: blur(8px);
    z-index: -2;
    opacity: 0.8;
    transition: transform 0.2s ease-out;
  }

  /* --- Interaction --- */
  .sign-assembly:hover .emblem {
    transform: translateZ(2px) scale(1.02);
    transition: transform 0.3s ease;
  }

</style>
</head>
<body>

  <div class="studio-backdrop"></div>
  <div class="floor-line"></div>

  <div class="scene">
    
    <div class="sign-assembly" id="signAssembly">
      
      <!-- Shadows -->
      <div class="wall-shadow"></div>
      <div class="floor-shadow" id="floorShadow"></div>

      <!-- Mounting Hardware (Stand) -->
      <div class="stand">
        <div class="stand-plate">
          <div class="screw screw-1"></div>
        </div>
        <div class="stand-arm">
          <div class="screw screw-2"></div>
        </div>
      </div>

      <!-- The 3D Sign Object -->
      <div class="sign-container">
        <div class="sign-back"></div>
        <div class="side-right"></div>
        <div class="side-bottom"></div>
        
        <div class="sign-face">
          <div class="emblem">
            <div class="triangle"></div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script>
    const assembly = document.getElementById('signAssembly');
    const floorShadow = document.getElementById('floorShadow');
    const scene = document.querySelector('.scene');

    // Configuration
    const maxRotation = 12; // degrees
    const maxShadowOffset = 40; // pixels

    scene.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      
      // Calculate mouse position relative to center (-1 to 1)
      const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
      const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);

      // Rotate the sign based on mouse position
      // We add the base rotation (8deg X, -12deg Y) to the dynamic rotation
      const rotateX = 8 - (y * maxRotation);
      const rotateY = -12 + (x * maxRotation);

      assembly.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

      // Move the floor shadow
      // Shadow moves opposite to the object's apparent light source shift
      const shadowX = -x * maxShadowOffset;
      const shadowY = y * (maxShadowOffset / 3);
      
      // We keep the base transform logic for the floor shadow
      floorShadow.style.transform = `translateX(calc(-50% + ${shadowX}px)) translateY(${shadowY}px) rotateX(85deg)`;
    });

    scene.addEventListener('mouseleave', () => {
      // Reset to default "Product Shot" angle
      assembly.style.transform = `rotateX(8deg) rotateY(-12deg)`;
      floorShadow.style.transform = `translateX(-50%) rotateX(85deg)`;
    });
  </script>
</body>
</html>
