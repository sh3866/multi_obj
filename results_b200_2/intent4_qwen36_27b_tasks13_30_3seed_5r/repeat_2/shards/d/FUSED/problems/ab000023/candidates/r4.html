<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play Sign | Product Visual</title>
<style>
  :root {
    /* --- Color Palette: Studio & Product --- */
    --bg-studio-top: #2a2d35;
    --bg-studio-bottom: #121418;
    --bg-floor: #0e0f12;
    
    /* Sign Material: High-gloss White */
    --sign-face-highlight: #ffffff;
    --sign-face-base: #fcfcfc;
    --sign-face-shadow: #e6e8eb;
    
    /* Sign Edge: Physical Thickness */
    --edge-light: #ffffff;
    --edge-mid: #d1d3d6;
    --edge-dark: #aeb0b5;
    
    /* Emblem: Deep Red & Crisp White */
    --red-light: #ff4d56;
    --red-mid: #e62127;
    --red-dark: #a81015;
    --red-deep: #7a0b0f;
    
    /* Mounting Hardware: Brushed Steel */
    --metal-1: #c0c2c6;
    --metal-2: #8a8c92;
    --metal-dark: #4a4c52;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-floor);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: system-ui, -apple-system, sans-serif;
    perspective: 1200px;
  }

  /* --- Environment: Dark Studio --- */
  .studio-env {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: radial-gradient(circle at 50% 30%, var(--bg-studio-top) 0%, var(--bg-studio-bottom) 80%);
    overflow: hidden;
  }

  /* The Floor Plane */
  .floor-plane {
    position: absolute;
    top: 60%;
    left: -50%;
    width: 200%;
    height: 100%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.03), var(--bg-floor));
    transform: rotateX(60deg);
    transform-origin: top center;
    pointer-events: none;
  }

  /* Soft Reflection on Floor */
  .floor-reflection {
    position: absolute;
    top: 60%;
    left: 50%;
    width: 400px;
    height: 200px;
    background: radial-gradient(ellipse at center, rgba(230, 33, 39, 0.15) 0%, transparent 70%);
    transform: translateX(-50%) rotateX(60deg) scaleY(0.3);
    filter: blur(20px);
    pointer-events: none;
    z-index: 1;
  }

  /* --- 3D Scene Container --- */
  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
    z-index: 10;
  }

  /* --- The Sign Assembly --- */
  .sign-assembly {
    position: relative;
    width: 340px;
    height: 340px;
    transform-style: preserve-3d;
    /* Base Pose: Floating slightly, angled for drama */
    transform: rotateX(12deg) rotateY(-18deg);
    transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
    cursor: pointer;
  }

  /* --- Mounting Hardware (Industrial L-Bracket) --- */
  .mounting-bracket {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100px;
    height: 100px;
    transform: translate(-50%, -50%) translateZ(-25px);
    transform-style: preserve-3d;
    z-index: -1; /* Behind sign */
  }

  /* Vertical Arm of Bracket */
  .bracket-arm-v {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 14px;
    height: 120px;
    transform: translateX(-50%) rotateX(90deg) translateY(60px);
    background: linear-gradient(90deg, var(--metal-dark), var(--metal-1) 30%, var(--metal-2) 100%);
    border-radius: 2px;
    box-shadow: 2px 0 5px rgba(0,0,0,0.4);
  }

  /* Horizontal Base of Bracket */
  .bracket-arm-h {
    position: absolute;
    left: 50%;
    bottom: -120px; /* Extends down from pivot */
    width: 140px;
    height: 14px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, var(--metal-dark), var(--metal-1) 20%, var(--metal-2) 100%);
    border-radius: 2px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }

  /* Bracket Screws */
  .bolt {
    position: absolute;
    width: 6px;
    height: 6px;
    background: radial-gradient(circle at 30% 30%, #fff, #555);
    border-radius: 50%;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
  }
  .bolt-1 { top: 10px; left: 4px; }
  .bolt-2 { bottom: 10px; left: 4px; }

  /* --- The Sign Slab (Extruded Object) --- */
  .sign-container {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
  }

  /* Back Face */
  .sign-back {
    position: absolute;
    inset: 0;
    background: #dcdde0;
    border-radius: 24px;
    transform: translateZ(-20px);
    box-shadow: 0 0 40px rgba(0,0,0,0.3); /* Deep shadow behind */
  }

  /* Front Face */
  .sign-face {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 30%, var(--sign-face-highlight), var(--sign-face-base) 40%, var(--sign-face-shadow) 100%);
    border-radius: 24px;
    transform: translateZ(0);
    /* Inner rim light for glass/plastic feel */
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.8), inset 0 0 20px rgba(255,255,255,0.4);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* --- Side Extrusions (The "Thickness") --- */
  /* Right Edge: Gradient for beveling */
  .side-right {
    position: absolute;
    top: 0; right: 0;
    width: 20px;
    height: 100%;
    background: linear-gradient(to right, var(--edge-mid), var(--edge-dark) 80%, var(--edge-light));
    transform-origin: right;
    transform: rotateY(90deg) translateX(10px);
    border-radius: 0 24px 24px 0;
    box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
  }

  /* Bottom Edge */
  .side-bottom {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    height: 20px;
    background: linear-gradient(to bottom, var(--edge-mid), var(--edge-dark));
    transform-origin: bottom;
    transform: rotateX(-90deg) translateY(10px);
    border-radius: 0 0 24px 24px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }

  /* --- The Emblem (Refined) --- */
  .emblem {
    position: relative;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    /* Deep Red Volume */
    background: radial-gradient(circle at 30% 30%, var(--red-light), var(--red-mid) 60%, var(--red-dark) 100%);
    
    /* Shadows: Outer for depth, Inner for the "inlay" look */
    box-shadow: 
      0 15px 35px rgba(180, 0, 0, 0.35), 
      inset 0 2px 4px rgba(255,255,255,0.4), 
      inset 0 -4px 8px rgba(0,0,0,0.3);
      
    display: flex;
    justify-content: center;
    align-items: center;
    transform: translateZ(4px); /* Physical emboss */
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* The Play Triangle */
  .triangle {
    /* Using SVG for perfect geometry and inner shadow */
    width: 60px;
    height: 60px;
    margin-left: 6px; /* Optical centering */
    fill: #ffffff;
    filter: drop-shadow(4px 6px 4px rgba(0,0,0,0.3));
    transform: skewX(-8deg); /* Dynamic shape */
  }

  /* Glossy Highlight (Sphere Reflection) */
  .emblem::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.1) 20%, transparent 60%);
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  /* --- Shadows --- */
  
  /* Wall Shadow (Behind assembly) */
  .wall-shadow {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    border-radius: 24px;
    transform: translateZ(-80px) translateX(40px) translateY(40px);
    filter: blur(50px);
    opacity: 0.4;
    z-index: -2;
    pointer-events: none;
  }

  /* --- Interaction --- */
  .sign-assembly:hover .emblem {
    transform: translateZ(4px) scale(1.05);
    box-shadow: 
      0 20px 45px rgba(180, 0, 0, 0.45), 
      inset 0 2px 4px rgba(255,255,255,0.4), 
      inset 0 -4px 8px rgba(0,0,0,0.3);
  }

</style>
</head>
<body>

  <div class="studio-env">
    <div class="floor-plane"></div>
    <div class="floor-reflection"></div>
  </div>

  <div class="scene">
    
    <div class="sign-assembly" id="signAssembly">
      
      <!-- Shadows -->
      <div class="wall-shadow"></div>

      <!-- Mounting Hardware -->
      <div class="mounting-bracket">
        <div class="bracket-arm-v">
          <div class="bolt bolt-1"></div>
          <div class="bolt bolt-2"></div>
        </div>
        <div class="bracket-arm-h"></div>
      </div>

      <!-- The 3D Sign Object -->
      <div class="sign-container">
        <div class="sign-back"></div>
        <div class="side-right"></div>
        <div class="side-bottom"></div>
        
        <div class="sign-face">
          <div class="emblem">
            <!-- SVG Triangle for crisp geometry -->
            <svg class="triangle" viewBox="0 0 100 100">
              <defs>
                <filter id="inner-shadow">
                  <feOffset dx="-2" dy="-2"/>
                  <feGaussianBlur stdDeviation="2" result="offset-blur"/>
                  <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                  <feFlood flood-color="black" flood-opacity="0.2" result="color"/>
                  <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                  <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
                </filter>
                <linearGradient id="white-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff" />
                  <stop offset="100%" stop-color="#f0f0f0" />
                </linearGradient>
              </defs>
              <path d="M20,20 L80,50 L20,80 Z" fill="url(#white-grad)" filter="url(#inner-shadow)" />
            </svg>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script>
    const assembly = document.getElementById('signAssembly');
    const scene = document.querySelector('.scene');

    // Configuration
    const maxRotation = 12; // degrees

    scene.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      
      // Calculate mouse position relative to center (-1 to 1)
      const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
      const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);

      // Rotate the sign based on mouse position
      // Base angles: rotateX(12deg) rotateY(-18deg)
      // We interpolate slightly towards the mouse
      const rotateX = 12 - (y * maxRotation);
      const rotateY = -18 + (x * maxRotation);

      assembly.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    scene.addEventListener('mouseleave', () => {
      // Reset to default "Product Shot" angle
      assembly.style.transform = `rotateX(12deg) rotateY(-18deg)`;
    });
  </script>
</body>
</html>
