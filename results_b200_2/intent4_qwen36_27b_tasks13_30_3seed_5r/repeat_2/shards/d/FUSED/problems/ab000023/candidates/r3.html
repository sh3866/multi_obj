<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play Sign | Product Visual</title>
<style>
  :root {
    /* Color Palette - Polished & Clean */
    --bg-top: #f2f3f5;
    --bg-bottom: #dcdfe4;
    
    --sign-face-top: #ffffff;
    --sign-face-bottom: #f4f5f7; /* Subtle ambient occlusion */
    
    --sign-edge-top: #e0e0e0;
    --sign-edge-side: #b0b2b8; /* Darker for volume */
    --sign-edge-bottom: #8a8d95;
    
    --emblem-red-light: #ff2e3b;
    --emblem-red-base: #E62127;
    --emblem-red-shadow: #a81015;
    
    --metal-base: #e0e0e0;
    --metal-highlight: #ffffff;
    --metal-shadow: #a0a0a0;
    
    --shadow-color: rgba(0, 0, 0, 0.12);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-bottom);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1500px; /* Deeper perspective for realism */
  }

  /* --- Scene Environment --- */
  .studio-backdrop {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 30%, #ffffff 0%, var(--bg-top) 40%, var(--bg-bottom) 100%);
    z-index: 0;
  }

  /* Horizon / Floor Reflection Line */
  .floor-line {
    position: absolute;
    bottom: 35%;
    left: 0;
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.8) 20%, rgba(255,255,255,0.8) 80%, transparent 100%);
    z-index: 1;
    pointer-events: none;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }

  /* --- 3D Scene Container --- */
  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
  }

  /* --- The Sign Assembly --- */
  .sign-assembly {
    position: relative;
    width: 380px;
    height: 380px;
    transform-style: preserve-3d;
    /* Base Angle: Slight tilt up and right for commercial look */
    transform: rotateX(10deg) rotateY(-15deg);
    transition: transform 0.1s linear; /* Smoother mouse tracking */
    cursor: pointer;
  }

  /* --- Mounting Hardware (The Stand) --- */
  /* Redesigned: Minimalist Acrylic/Base Stand */
  .stand {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 120px;
    height: 100px;
    transform: translate(-50%, -50%) translateZ(-30px); 
    transform-style: preserve-3d;
    z-index: 1;
  }

  /* The Base Plate (Acrylic look) */
  .stand-base {
    position: absolute;
    bottom: 0; 
    left: 50%;
    width: 140px;
    height: 120px;
    transform: translateX(-50%) rotateX(90deg) translateY(60px) translateZ(20px);
    background: linear-gradient(135deg, rgba(255,255,255,0.4), rgba(200,200,200,0.1));
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 8px;
    backdrop-filter: blur(2px); /* Simulate glass */
    box-shadow: 0 0 15px rgba(255,255,255,0.2);
  }

  /* The Vertical Support Arm */
  .stand-arm {
    position: absolute;
    top: 0; left: 50%;
    width: 16px;
    height: 160px;
    transform: translateX(-50%) translateZ(20px);
    background: linear-gradient(to right, var(--metal-shadow), var(--metal-base) 40%, var(--metal-highlight));
    border-radius: 4px;
    box-shadow: 2px 0 10px rgba(0,0,0,0.1);
  }
  
  /* Hardware Screws */
  .screw {
    position: absolute;
    width: 10px;
    height: 10px;
    background: radial-gradient(circle at 30% 30%, #eee, #999);
    border-radius: 50%;
    box-shadow: 1px 1px 2px rgba(0,0,0,0.3);
  }
  .screw::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 8px; height: 1px;
    background: #555;
    transform: translate(-50%, -50%) rotate(45deg);
    box-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }
  .screw-1 { top: 20px; left: 0; transform: translateZ(8px); }
  .screw-2 { bottom: 20px; left: 0; transform: translateZ(8px); }


  /* --- The Sign Slab (Extruded Object) --- */
  .sign-container {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
  }

  /* Back Face */
  .sign-back {
    position: absolute;
    inset: 0;
    background: #dcdde0;
    border-radius: 32px;
    transform: translateZ(-20px);
    box-shadow: 0 0 30px rgba(0,0,0,0.1);
  }

  /* Front Face */
  .sign-face {
    position: absolute;
    inset: 0;
    /* Subtle gradient for curvature/ambient occlusion */
    background: linear-gradient(145deg, var(--sign-face-top) 0%, var(--sign-face-bottom) 100%);
    border-radius: 32px;
    transform: translateZ(0);
    /* Inner rim light */
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.9), inset 2px 2px 5px rgba(255,255,255,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Side Extrusions (The "Thickness") */
  /* 20px depth */
  
  /* Right Edge */
  .side-right {
    position: absolute;
    top: 0; right: 0;
    width: 20px;
    height: 100%;
    background: linear-gradient(to right, var(--sign-edge-side), var(--sign-edge-bottom));
    transform-origin: right;
    transform: rotateY(90deg) translateX(10px);
    border-radius: 0 32px 32px 0;
    /* Edge highlight */
    box-shadow: inset 1px 0 0 rgba(255,255,255,0.2);
  }

  /* Bottom Edge */
  .side-bottom {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    height: 20px;
    background: linear-gradient(to bottom, var(--sign-edge-side), var(--sign-edge-bottom));
    transform-origin: bottom;
    transform: rotateX(-90deg) translateY(10px);
    border-radius: 0 0 32px 32px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
  }

  /* --- The Emblem (Refined) --- */
  .emblem {
    position: relative;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    /* Multi-stop gradient for physical volume */
    background: radial-gradient(circle at 35% 35%, var(--emblem-red-light), var(--emblem-red-base) 50%, var(--emblem-red-shadow) 100%);
    
    /* Shadows: Outer for depth, Inner for the "inlay" look */
    box-shadow: 
      0 15px 35px rgba(180, 0, 0, 0.25), /* Soft colored drop shadow */
      inset 0 2px 5px rgba(255,255,255,0.3), /* Top bevel highlight */
      inset 0 -2px 5px rgba(0,0,0,0.2); /* Bottom bevel shadow */
      
    display: flex;
    justify-content: center;
    align-items: center;
    transform: translateZ(2px); /* Slight physical emboss */
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* The Play Triangle */
  .triangle {
    width: 0;
    height: 0;
    border-top: 32px solid transparent;
    border-bottom: 32px solid transparent;
    border-left: 56px solid #ffffff;
    margin-left: 10px; /* Optical centering */
    
    /* Crisp shadow for the triangle to stand out from the red circle */
    filter: drop-shadow(4px 4px 6px rgba(0,0,0,0.25));
    transform: skewX(-5deg); /* Dynamic shape */
    transform-origin: center;
  }

  /* --- Shadows --- */
  
  /* Wall Shadow (Behind the whole assembly) */
  .wall-shadow {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    border-radius: 32px;
    transform: translateZ(-60px) translateX(30px) translateY(30px);
    filter: blur(40px);
    opacity: 0.15;
    z-index: -1;
    pointer-events: none;
  }

  /* Floor Shadow (Grounding) */
  .floor-shadow {
    position: absolute;
    bottom: -160px;
    left: 50%;
    width: 360px;
    height: 80px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.2) 0%, transparent 70%);
    transform: translateX(-50%) rotateX(90deg);
    filter: blur(12px);
    z-index: -2;
    opacity: 0.9;
    pointer-events: none;
  }

  /* --- Interaction --- */
  .sign-assembly:hover .emblem {
    transform: translateZ(2px) scale(1.05);
    box-shadow: 
      0 20px 40px rgba(180, 0, 0, 0.3),
      inset 0 2px 5px rgba(255,255,255,0.3),
      inset 0 -2px 5px rgba(0,0,0,0.2);
  }
  .sign-assembly:hover .triangle {
    transform: skewX(-5deg) scale(1.05);
  }

</style>
</head>
<body>

  <div class="studio-backdrop"></div>
  <div class="floor-line"></div>

  <div class="scene">
    
    <div class="sign-assembly" id="signAssembly">
      
      <!-- Shadows -->
      <div class="wall-shadow"></div>
      <div class="floor-shadow" id="floorShadow"></div>

      <!-- Mounting Hardware (Stand) -->
      <div class="stand">
        <div class="stand-base"></div>
        <div class="stand-arm">
          <div class="screw screw-1"></div>
          <div class="screw screw-2"></div>
        </div>
      </div>

      <!-- The 3D Sign Object -->
      <div class="sign-container">
        <div class="sign-back"></div>
        <div class="side-right"></div>
        <div class="side-bottom"></div>
        
        <div class="sign-face">
          <div class="emblem">
            <div class="triangle"></div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script>
    const assembly = document.getElementById('signAssembly');
    const floorShadow = document.getElementById('floorShadow');
    const scene = document.querySelector('.scene');

    // Configuration
    const maxRotation = 15; // degrees
    const maxShadowOffset = 50; // pixels

    scene.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      
      // Calculate mouse position relative to center (-1 to 1)
      const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
      const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);

      // Rotate the sign based on mouse position
      // We add the base rotation (10deg X, -15deg Y) to the dynamic rotation
      const rotateX = 10 - (y * maxRotation);
      const rotateY = -15 + (x * maxRotation);

      assembly.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

      // Move the floor shadow
      // Shadow moves opposite to the object's apparent light source shift
      const shadowX = -x * maxShadowOffset;
      const shadowY = y * (maxShadowOffset / 4);
      
      // We keep the base transform logic for the floor shadow
      floorShadow.style.transform = `translateX(calc(-50% + ${shadowX}px)) translateY(${shadowY}px) rotateX(90deg)`;
    });

    scene.addEventListener('mouseleave', () => {
      // Reset to default "Product Shot" angle
      assembly.style.transform = `rotateX(10deg) rotateY(-15deg)`;
      floorShadow.style.transform = `translateX(-50%) rotateX(90deg)`;
    });
  </script>
</body>
</html>
