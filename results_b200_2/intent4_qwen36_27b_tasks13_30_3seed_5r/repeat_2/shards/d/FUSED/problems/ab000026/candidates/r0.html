<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Play with Tiles</title>
<style>
  :root {
    --felt: #1b4d3e;
    --felt-dark: #12362b;
    --wood: #5d4037;
    --wood-light: #8d6e63;
    --tile-body: #f5f5f0;
    --tile-dark: #2c2c2c;
    --pip-color: #1a1a1a;
    --accent: #d4af37; /* Gold */
    --ui-bg: rgba(20, 30, 25, 0.85);
    --text-light: #e0e0e0;
    --highlight: rgba(255, 215, 0, 0.4);
    --shadow: rgba(0,0,0,0.5);
    --font-stack: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  
  body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: var(--felt);
    background-image: 
      radial-gradient(circle at center, var(--felt) 0%, var(--felt-dark) 100%);
    font-family: var(--font-stack);
    display: flex;
    flex-direction: column;
    color: var(--text-light);
  }

  /* Texture Overlay for Felt */
  body::after {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  /* --- Layout --- */
  
  #game-container {
    position: relative;
    flex: 1;
    display: grid;
    grid-template-rows: 60px 1fr 140px;
    grid-template-columns: 1fr;
    z-index: 1;
  }

  /* Header / HUD */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
  }

  .brand {
    font-weight: 700;
    font-size: 1.2rem;
    letter-spacing: 1px;
    color: var(--accent);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .score-pill {
    background: var(--ui-bg);
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
    font-size: 0.9rem;
    font-weight: 600;
    display: flex;
    gap: 16px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }

  .score-pill span strong { color: var(--accent); }

  /* The Table (Play Area) */
  #table-area {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden; /* The chain scrolls inside this */
  }

  #board-chain {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 100px; /* Space for rotation */
    transform-origin: center center;
    transition: transform 0.3s ease;
  }

  /* Player Zone */
  #player-zone {
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px 20px 20px;
    position: relative;
  }

  /* --- Components --- */

  /* The Tile Component */
  .tile {
    width: 40px;
    height: 80px;
    background: var(--tile-body);
    border-radius: 4px;
    position: relative;
    box-shadow: 
      2px 2px 5px rgba(0,0,0,0.4),
      inset 0 0 0 1px rgba(255,255,255,0.5);
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.15s;
    transform-style: preserve-3d;
    margin: 0 2px;
  }

  .tile::before {
    content: '';
    position: absolute;
    top: 50%; left: 0; right: 0;
    height: 2px;
    background: rgba(0,0,0,0.15);
    transform: translateY(-50%);
    box-shadow: 0 1px 0 rgba(255,255,255,0.8);
  }

  .tile-half {
    flex: 1;
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 4px;
  }

  /* Pips */
  .pip {
    background: var(--pip-color);
    border-radius: 50%;
    width: 6px;
    height: 6px;
    align-self: center;
    justify-self: center;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
  }

  /* Pip positioning logic */
  .pip:nth-child(1) { grid-area: 1 / 1; } /* TL */
  .pip:nth-child(2) { grid-area: 1 / 3; } /* TR */
  .pip:nth-child(3) { grid-area: 2 / 2; } /* C */
  .pip:nth-child(4) { grid-area: 3 / 1; } /* BL */
  .pip:nth-child(5) { grid-area: 3 / 3; } /* BR */
  .pip:nth-child(6) { grid-area: 2 / 1; } /* ML */
  .pip:nth-child(7) { grid-area: 2 / 3; } /* MR */

  /* Specific layouts for pip counts */
  .count-1 .pip { grid-area: 2 / 2 !important; width: 8px; height: 8px; }
  .count-2 .pip:nth-child(n+3) { display: none; }
  .count-3 .pip:nth-child(1) { display: none; }
  .count-3 .pip:nth-child(2) { display: none; }
  .count-3 .pip:nth-child(4) { display: none; }
  .count-3 .pip:nth-child(5) { display: none; }
  .count-3 .pip:nth-child(6) { display: none; }
  .count-3 .pip:nth-child(7) { display: none; }
  
  /* Correct specific layouts via JS generation or complex CSS classes. 
     For this demo, I'll use a simpler class system for pip rendering. */

  /* Tile States */
  .tile:hover {
    transform: translateY(-15px);
    box-shadow: 0 15px 25px rgba(0,0,0,0.5);
    z-index: 10;
  }

  .tile.disabled {
    filter: brightness(0.8);
    cursor: not-allowed;
    opacity: 0.8;
  }
  .tile.disabled:hover { transform: none; box-shadow: none; }

  /* Board Tiles (Horizontal) */
  .tile.board-tile {
    width: 80px;
    height: 40px;
    flex-direction: row;
    transform: none; /* Reset hover for board initially */
  }
  .tile.board-tile::before {
    width: 2px; height: 100%;
    top: 0; left: 50%;
    transform: translateX(-50%);
  }
  .tile.board-tile:hover { transform: scale(1.1); }
  
  /* Rotations for board */
  .tile.rot-90 { transform: rotate(90deg); margin: 0 10px; }
  
  /* Draw Pile */
  .draw-pile {
    width: 40px;
    height: 80px;
    background: var(--wood);
    border-radius: 4px;
    position: relative;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  
  .draw-pile::before, .draw-pile::after {
    content: '';
    position: absolute;
    width: 100%; height: 100%;
    background: var(--wood);
    border-radius: 4px;
    top: 0; left: 0;
  }
  .draw-pile::before { transform: translate(-2px, 2px); }
  .draw-pile::after { transform: translate(-4px, 4px); }
  
  .draw-label {
    z-index: 2;
    color: rgba(255,255,255,0.5);
    font-size: 0.7rem;
    font-weight: bold;
    text-transform: uppercase;
    pointer-events: none;
  }

  /* Action Buttons */
  .action-btn {
    background: var(--wood-light);
    border: none;
    color: #fff;
    padding: 10px 24px;
    border-radius: 4px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--wood), 0 5px 10px rgba(0,0,0,0.4);
    transition: all 0.1s;
  }
  .action-btn:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 var(--wood), inset 0 2px 5px rgba(0,0,0,0.4);
  }
  .action-btn:disabled {
    background: #555;
    box-shadow: none;
    cursor: not-allowed;
    transform: none;
    color: #888;
  }

  /* Match Cue */
  #match-cue {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.9);
    color: #000;
    padding: 8px 16px;
    border-radius: 4px;
    font-size: 0.9rem;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 100;
  }
  #match-cue.visible { opacity: 1; }

  /* SVG Icons */
  .icon { width: 20px; height: 20px; fill: currentColor; }

</style>
</head>
<body>

<div id="game-container">
  <header>
    <div class="brand">
      <svg class="icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 9h-2V7h-2v5H6v2h2v5h2v-5h2v-2z"/></svg>
      Play with Tiles
    </div>
    <div class="score-pill">
      <span>You: <strong id="score-player">0</strong></span>
      <span>Opp: <strong id="score-opp">0</strong></span>
    </div>
  </header>

  <div id="table-area">
    <div id="match-cue">Needs 6 or 4</div>
    <div id="board-chain">
      <!-- Chain renders here -->
    </div>
  </div>

  <div id="player-zone">
    <div class="draw-pile" id="draw-btn">
      <span class="draw-label">Draw</span>
    </div>
    
    <div id="hand-container" style="display:flex; gap: 4px;">
      <!-- Hand renders here -->
    </div>

    <button class="action-btn" id="pass-btn" disabled>Pass</button>
  </div>
</div>

<script>
  /**
   * DOMINO GAME LOGIC & RENDERER
   */

  // --- Data Structures ---
  class Tile {
    constructor(v1, v2, id) {
      this.v1 = v1;
      this.v2 = v2;
      this.id = id;
      this.rotation = 0; // 0, 90, 180, 270
      this.isDouble = v1 === v2;
    }
  }

  const GameState = {
    deck: [],
    board: [], // Array of { tile, orientation: 'normal'|'flipped'|'rotated' }
    playerHand: [],
    opponentHand: [],
    turn: 'player', // 'player' or 'opponent'
    ends: { left: null, right: null }, // Values exposed at ends of chain
    scores: { player: 0, opponent: 0 }
  };

  // --- Pip Logic ---
  // Grid positions 1-9 (3x3)
  // 1 2 3
  // 4 5 6
  // 7 8 9
  const pipMap = {
    0: [],
    1: [5],
    2: [3, 7],
    3: [3, 5, 7],
    4: [1, 3, 7, 9],
    5: [1, 3, 5, 7, 9],
    6: [1, 3, 4, 6, 7, 9]
  };

  // --- Initialization ---
  function initGame() {
    // Generate Deck
    let idCounter = 0;
    for (let i = 0; i <= 6; i++) {
      for (let j = i; j <= 6; j++) {
        GameState.deck.push(new Tile(i, j, idCounter++));
      }
    }
    
    // Shuffle
    GameState.deck.sort(() => Math.random() - 0.5);

    // Deal
    GameState.playerHand = GameState.deck.splice(0, 7);
    GameState.opponentHand = GameState.deck.splice(0, 7);

    // Start Game
    updateUI();
    checkTurn();
  }

  // --- Rendering ---

  function createTileElement(tile, isBoard = false) {
    const el = document.createElement('div');
    el.className = `tile ${isBoard ? 'board-tile' : ''}`;
    el.dataset.id = tile.id;

    // Create two halves
    const halves = [tile.v1, tile.v2];
    
    halves.forEach(val => {
      const half = document.createElement('div');
      half.className = 'tile-half';
      
      // Add pips based on value
      const pips = pipMap[val];
      // Create 9 slots, fill active ones
      for(let i=1; i<=9; i++) {
        const pip = document.createElement('div');
        if(pips.includes(i)) {
          pip.className = 'pip';
        }
        half.appendChild(pip);
      }
      el.appendChild(half);
    });

    return el;
  }

  function renderHand() {
    const container = document.getElementById('hand-container');
    container.innerHTML = '';

    GameState.playerHand.forEach(tile => {
      const el = createTileElement(tile);
      // Check validity
      const isValid = isValidMove(tile);
      if (!isValid && GameState.turn === 'player') {
        el.classList.add('disabled');
      }
      
      el.addEventListener('click', () => {
        if (GameState.turn === 'player' && isValid) {
          playTile(tile);
        }
      });
      container.appendChild(el);
    });
  }

  function renderBoard() {
    const container = document.getElementById('board-chain');
    container.innerHTML = '';

    GameState.board.forEach(item => {
      const el = createTileElement(item.tile, true);
      
      // Apply rotation styles
      // item.orientation: 0 (v1 left, v2 right), 1 (v1 right, v2 left)
      // If double, we rotate 90deg
      
      if (item.tile.isDouble) {
        el.classList.add('rot-90');
        // For doubles, visual orientation doesn't change connectivity logic much visually
        // but let's flip halves if needed? Standard dominoes rotate doubles 90deg.
      } else {
        // If orientation is 1 (flipped), we need to swap visual halves
        if (item.orientation === 1) {
          el.style.flexDirection = 'row-reverse';
        }
      }
      container.appendChild(el);
    });

    updateMatchCue();
  }

  function updateUI() {
    renderHand();
    renderBoard();
    document.getElementById('score-player').innerText = GameState.scores.player;
    document.getElementById('score-opp').innerText = GameState.scores.opponent;
    
    const drawBtn = document.getElementById('draw-btn');
    const passBtn = document.getElementById('pass-btn');

    // Update Controls
    if (GameState.turn === 'player') {
      drawBtn.style.opacity = '1';
      drawBtn.style.pointerEvents = 'auto';
      passBtn.disabled = canDrawOrPlay(); // Can only pass if no moves AND empty deck
    } else {
      drawBtn.style.opacity = '0.5';
      drawBtn.style.pointerEvents = 'none';
      passBtn.disabled = true;
    }
  }

  function updateMatchCue() {
    const cue = document.getElementById('match-cue');
    if (GameState.board.length === 0) {
      cue.classList.remove('visible');
      return;
    }
    
    // Logic: Show what values are needed
    let leftVal = GameState.ends.left;
    let rightVal = GameState.ends.right;

    // If single tile, ends are same.
    // If multiple, ends are different.
    
    if (leftVal === rightVal) {
      cue.innerText = `Match: ${leftVal}`;
    } else {
      cue.innerText = `Match: ${leftVal} or ${rightVal}`;
    }
    cue.classList.add('visible');
  }

  // --- Game Logic ---

  function isValidMove(tile) {
    if (GameState.board.length === 0) return true;
    
    // Check if tile matches either end
    const { left, right } = GameState.ends;
    
    // Match Left
    if (tile.v1 === left || tile.v2 === left) return true;
    // Match Right
    if (tile.v1 === right || tile.v2 === right) return true;

    return false;
  }

  function canDrawOrPlay() {
    if (GameState.deck.length > 0) return false;
    // Check if any tile in hand is playable
    return !GameState.playerHand.some(t => isValidMove(t));
  }

  function playTile(tile) {
    // Remove from hand
    GameState.playerHand = GameState.playerHand.filter(t => t.id !== tile.id);

    // Place on board
    if (GameState.board.length === 0) {
      // First tile
      GameState.board.push({ tile: tile, orientation: 0 });
      GameState.ends = { left: tile.v1, right: tile.v2 };
    } else {
      // Logic to determine side and orientation
      const { left, right } = GameState.ends;
      
      // Prioritize Right side if ambiguous? Or random?
      // Let's check Right match
      if (tile.v1 === right || tile.v2 === right) {
        // Play on Right
        // We need the side touching 'right' to match.
        // If tile.v1 === right, order is [v1, v2] -> [v2 is new end]
        // If tile.v2 === right, order is [v2, v1] -> [v1 is new end] (Orientation 1)
        
        if (tile.v1 === right) {
          GameState.board.push({ tile: tile, orientation: 0 });
          GameState.ends.right = tile.v2;
        } else {
          GameState.board.push({ tile: tile, orientation: 1 });
          GameState.ends.right = tile.v1;
        }
      } 
      // Check Left match
      else if (tile.v1 === left || tile.v2 === left) {
        // Play on Left (Unshift)
        // If tile.v2 === left, order is [v1, v2] -> [v1 is new end] (Orientation 0)
        // If tile.v1 === left, order is [v2, v1] -> [v2 is new end] (Orientation 1)
        
        if (tile.v2 === left) {
          GameState.board.unshift({ tile: tile, orientation: 0 });
          GameState.ends.left = tile.v1;
        } else {
          GameState.board.unshift({ tile: tile, orientation: 1 });
          GameState.ends.left = tile.v2;
        }
      }
    }

    GameState.turn = 'opponent';
    updateUI();
    
    // Trigger AI turn
    setTimeout(aiTurn, 1000);
  }

  function drawTile() {
    if (GameState.deck.length > 0 && GameState.turn === 'player') {
      const tile = GameState.deck.pop();
      GameState.playerHand.push(tile);
      updateUI();
    }
  }

  function passTurn() {
    if (GameState.turn === 'player' && canDrawOrPlay()) {
      GameState.turn = 'opponent';
      updateUI();
      setTimeout(aiTurn, 1000);
    }
  }

  // --- Simple AI ---
  function aiTurn() {
    // 1. Check hand for valid moves
    let moveFound = false;
    const validTiles = GameState.opponentHand.filter(t => isValidMove(t));

    if (validTiles.length > 0) {
      // Pick random valid tile (simple strategy)
      const tileToPlay = validTiles[0];
      
      // Remove from AI hand
      GameState.opponentHand = GameState.opponentHand.filter(t => t.id !== tileToPlay.id);
      
      // Place on board (Same logic as player)
      if (GameState.board.length === 0) {
        GameState.board.push({ tile: tileToPlay, orientation: 0 });
        GameState.ends = { left: tileToPlay.v1, right: tileToPlay.v2 };
      } else {
        const { left, right } = GameState.ends;
        
        if (tileToPlay.v1 === right || tileToPlay.v2 === right) {
           if (tileToPlay.v1 === right) {
            GameState.board.push({ tile: tileToPlay, orientation: 0 });
            GameState.ends.right = tileToPlay.v2;
          } else {
            GameState.board.push({ tile: tileToPlay, orientation: 1 });
            GameState.ends.right = tileToPlay.v1;
          }
        } else {
           if (tileToPlay.v2 === left) {
            GameState.board.unshift({ tile: tileToPlay, orientation: 0 });
            GameState.ends.left = tileToPlay.v1;
          } else {
            GameState.board.unshift({ tile: tileToPlay, orientation: 1 });
            GameState.ends.left = tileToPlay.v2;
          }
        }
      }
      moveFound = true;
    } else if (GameState.deck.length > 0) {
      // Draw
      GameState.opponentHand.push(GameState.deck.pop());
      // AI draws once then passes? Or draws until match? Standard rules vary. 
      // Let's make AI draw once then pass for simplicity.
      moveFound = true; // technically an action taken
    }

    // Check Win Condition (Empty Hand)
    if (GameState.playerHand.length === 0) {
      alert("You Win!");
      resetGame();
      return;
    }
    if (GameState.opponentHand.length === 0) {
      alert("Opponent Wins!");
      resetGame();
      return;
    }

    // Check Blocked Game (Both pass) - Simplified check
    // If AI had no moves and deck empty, and Player had no moves...
    // For this demo, we just switch turn back.
    
    GameState.turn = 'player';
    updateUI();
  }

  function resetGame() {
    GameState.board = [];
    GameState.deck = [];
    GameState.playerHand = [];
    GameState.opponentHand = [];
    GameState.ends = { left: null, right: null };
    initGame();
  }

  // --- Event Listeners ---
  document.getElementById('draw-btn').addEventListener('click', drawTile);
  document.getElementById('pass-btn').addEventListener('click', passTurn);

  // --- Start ---
  initGame();

</script>
</body>
</html>
