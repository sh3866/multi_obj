<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Study: The Grip - Design Revision</title>
<style>
    :root {
        --bg-dark: #050505;
        --bg-light: #1a1a1d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg-dark);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #fff;
    }

    /* Background Atmosphere */
    .background-glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, #1f2229 0%, #000000 100%);
        z-index: 0;
    }

    /* Main Stage */
    .stage {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1500px; /* Deeper perspective */
        z-index: 1;
    }

    svg {
        height: 92vh;
        width: auto;
        max-width: 100%;
        /* Initial soft shadow */
        filter: drop-shadow(0px 40px 80px rgba(0,0,0,0.9));
        will-change: transform;
        transition: transform 0.05s ease-out; /* Snappier response */
    }

    /* Subtle breathing animation */
    @keyframes breathe {
        0%, 100% { transform: scale(1) translateY(0); }
        50% { transform: scale(1.005) translateY(-3px); }
    }
    
    .anim-breathe {
        animation: breathe 6s ease-in-out infinite;
        transform-origin: center center;
    }

    /* Subtle noise overlay for texture */
    .noise {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        opacity: 0.04;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

</style>
</head>
<body>

    <div class="background-glow"></div>
    <div class="noise"></div>

    <main class="stage">
        <!-- 
            REVISED SVG:
            - Anatomy: Complete redraw of hand structure.
            - Lighting: Cool blue reflected light from screen, warm ambient rim light.
            - Device: Dual camera bump, speaker grille, specific UI context.
            - Composition: Centered, macro view.
        -->
        <svg id="artwork" viewBox="0 0 500 900" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- FILTERS -->
                <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="3" />
                </filter>
                <filter id="blurHeavy" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="15" />
                </filter>
                <filter id="blurScreenGlow">
                    <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

                <!-- SKIN GRADIENTS -->
                <!-- Base Skin: Warm, organic -->
                <linearGradient id="skinWarm" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#E8B49A" />
                    <stop offset="50%" stop-color="#C28F73" />
                    <stop offset="100%" stop-color="#8A5A42" />
                </linearGradient>

                <!-- Reflected Light: Cool blue from screen onto fingers -->
                <radialGradient id="screenReflect" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#6482CB" stop-opacity="0.6"/>
                    <stop offset="100%" stop-color="#2b3a55" stop-opacity="0"/>
                </radialGradient>

                <!-- Ambient Rim Light (Top Right) -->
                <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FFF" stop-opacity="0.8"/>
                    <stop offset="20%" stop-color="#FFF" stop-opacity="0.1"/>
                    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
                </linearGradient>

                <!-- Shadows -->
                <linearGradient id="deepShadow" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#3e2723" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="#1a100e" stop-opacity="0.9"/>
                </linearGradient>

                <!-- DEVICE GRADIENTS -->
                <!-- Titanium Frame -->
                <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#444" />
                    <stop offset="20%" stop-color="#888" />
                    <stop offset="50%" stop-color="#333" />
                    <stop offset="80%" stop-color="#555" />
                    <stop offset="100%" stop-color="#111" />
                </linearGradient>

                <!-- Screen Surface -->
                <linearGradient id="screenBase" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#0d0d0d" />
                    <stop offset="100%" stop-color="#050505" />
                </linearGradient>

                <!-- Screen Glare -->
                <linearGradient id="glare" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#fff" stop-opacity="0.08" />
                    <stop offset="50%" stop-color="#fff" stop-opacity="0.0" />
                    <stop offset="52%" stop-color="#fff" stop-opacity="0.12" />
                    <stop offset="100%" stop-color="#fff" stop-opacity="0.0" />
                </linearGradient>
            </defs>

            <!-- ================= LAYER 1: BACKGROUND FINGERS (Right Hand) ================= -->
            <g id="fingers-back">
                <!-- Cast Shadow of fingers on the phone back -->
                <path d="M170,200 L170,800 L210,800 L210,200 Z" fill="#000" opacity="0.6" filter="url(#blurHeavy)" />

                <!-- Pinky -->
                <g transform="translate(0,0)">
                    <path d="M175,720 C140,720 130,700 130,680 C130,660 150,650 175,660 L175,720 Z" fill="url(#skinWarm)" />
                    <!-- Crease -->
                    <path d="M145,680 Q155,690 165,685" stroke="#6d4c41" stroke-width="2" fill="none" opacity="0.6" />
                    <!-- Nail hint -->
                    <path d="M135,670 Q140,665 145,670" stroke="#e0ac98" stroke-width="2" fill="none" opacity="0.5" />
                </g>

                <!-- Ring Finger -->
                <g transform="translate(0,0)">
                    <path d="M175,640 C130,640 120,610 120,580 C120,550 145,540 175,550 L175,640 Z" fill="url(#skinWarm)" />
                    <!-- Crease -->
                    <path d="M135,600 Q145,610 155,605" stroke="#6d4c41" stroke-width="2" fill="none" opacity="0.6" />
                    <!-- Nail hint -->
                    <path d="M125,590 Q130,585 135,590" stroke="#e0ac98" stroke-width="2" fill="none" opacity="0.5" />
                </g>

                <!-- Middle Finger -->
                <g transform="translate(0,0)">
                    <path d="M175,560 C130,560 115,530 115,490 C115,460 140,450 175,460 L175,560 Z" fill="url(#skinWarm)" />
                    <!-- Crease -->
                    <path d="M130,520 Q140,530 150,525" stroke="#6d4c41" stroke-width="2" fill="none" opacity="0.6" />
                    <!-- Nail hint -->
                    <path d="M120,500 Q125,495 130,500" stroke="#e0ac98" stroke-width="2" fill="none" opacity="0.5" />
                </g>

                <!-- Index Finger (Wrapping over edge) -->
                <g transform="translate(0,0)">
                    <!-- Base -->
                    <path d="M175,480 C130,480 115,450 115,410 C115,380 140,370 175,380 L175,480 Z" fill="url(#skinWarm)" />
                    <!-- Tip over edge -->
                    <path d="M120,380 C125,350 160,350 175,370 C165,390 135,390 120,380 Z" fill="url(#skinWarm)" />
                    <!-- Knuckle/Crease -->
                    <path d="M130,430 Q140,440 150,435" stroke="#6d4c41" stroke-width="2" fill="none" opacity="0.6" />
                    <!-- Nail -->
                    <path d="M125,385 Q135,380 140,385" stroke="#e0ac98" stroke-width="2" fill="none" opacity="0.5" />
                </g>
            </g>


            <!-- ================= LAYER 2: THE DEVICE ================= -->
            <g id="device">
                <!-- Drop Shadow -->
                <rect x="150" y="110" width="140" height="760" rx="30" fill="#000" opacity="0.7" filter="url(#blurHeavy)" transform="translate(10, 20)" />

                <!-- Titanium Body -->
                <rect x="150" y="100" width="140" height="760" rx="30" fill="url(#titanium)" />
                
                <!-- Edge Highlight (Left) -->
                <path d="M152,102 L152,858" stroke="#fff" stroke-width="1" opacity="0.3" />
                <!-- Edge Shadow (Right) -->
                <path d="M288,102 L288,858" stroke="#000" stroke-width="2" opacity="0.5" />

                <!-- Screen Base -->
                <rect x="158" y="108" width="124" height="744" rx="24" fill="url(#screenBase)" />

                <!-- UI Elements -->
                <g id="ui">
                    <!-- Status Bar -->
                    <rect x="170" y="120" width="10" height="10" rx="2" fill="#333" />
                    <rect x="250" y="120" width="25" height="10" rx="2" fill="#333" />
                    
                    <!-- Card 1 -->
                    <rect x="170" y="200" width="100" height="120" rx="15" fill="#1a1a1a" />
                    <rect x="180" y="220" width="50" height="8" rx="4" fill="#333" />
                    <rect x="180" y="240" width="80" height="4" rx="2" fill="#222" />
                    
                    <!-- Card 2 -->
                    <rect x="170" y="340" width="100" height="120" rx="15" fill="#1a1a1a" />
                    <circle cx="220" cy="400" r="25" fill="#222" />
                    <rect x="255" y="395" width="40" height="10" rx="5" fill="#333" />
                </g>

                <!-- Glass Glare -->
                <path d="M100,50 L350,50 L200,900 L50,900 Z" fill="url(#glare)" style="mix-blend-mode: overlay;" />

                <!-- Camera Module (Rear) - Visible via Index Finger gap or implied -->
                <!-- Actually, let's put the camera on the back, obscured by fingers, but add the notch on front -->
                
                <!-- Dynamic Island / Notch -->
                <rect x="200" y="115" width="60" height="20" rx="10" fill="#000" />
                <circle cx="245" cy="125" r="4" fill="#111" /> <!-- Lens -->
                <circle cx="245" cy="125" r="1" fill="#444" /> <!-- Glint -->
                <circle cx="215" cy="125" r="2" fill="#222" /> <!-- Sensor -->

                <!-- Speaker Grille (Top) -->
                <rect x="220" y="105" width="20" height="2" rx="1" fill="#222" />

                <!-- Side Buttons -->
                <rect x="148" y="250" width="4" height="30" rx="2" fill="#111" /> <!-- Action -->
                <rect x="288" y="250" width="4" height="40" rx="2" fill="#111" /> <!-- Vol Up -->
                <rect x="288" y="300" width="4" height="40" rx="2" fill="#111" /> <!-- Vol Down -->
            </g>


            <!-- ================= LAYER 3: HAND FRONT (Palm & Thumb) ================= -->
            <g id="hand-front">
                
                <!-- Palm Base (Bottom Left) -->
                <path d="M-50,950 L120,850 C180,800 220,750 230,700 L230,950 Z" fill="url(#skinWarm)" />
                
                <!-- Cast Shadow: Fingers onto Palm -->
                <path d="M230,450 L230,700 C180,800 120,850 -50,950 Z" fill="#000" opacity="0.3" filter="url(#blurSoft)" />

                <!-- Thenar Eminence (Thumb Muscle) -->
                <path d="M160,800 C200,750 240,770 240,730 C240,690 200,670 160,700 C140,730 140,770 160,800 Z" fill="url(#skinWarm)" />
                
                <!-- Muscle Striations -->
                <path d="M180,730 Q200,750 210,780" stroke="#8d6e63" stroke-width="1.5" fill="none" opacity="0.4" filter="url(#blurSoft)" />
                <path d="M190,710 Q210,730 220,760" stroke="#8d6e63" stroke-width="1.5" fill="none" opacity="0.4" filter="url(#blurSoft)" />

                <!-- THUMB GROUP -->
                <g id="thumb">
                    <!-- Cast Shadow: Thumb onto Screen -->
                    <ellipse cx="270" cy="450" rx="18" ry="70" fill="#000" opacity="0.7" filter="url(#blurSoft)" transform="rotate(-15, 270, 450)" />

                    <!-- Thumb Base (Proximal) -->
                    <path d="M190,720 C220,670 240,620 240,570 C240,520 220,470 220,450 C200,450 180,520 170,620 Z" fill="url(#skinWarm)" />
                    
                    <!-- Thumb Tip (Distal) -->
                    <path d="M220,450 C240,420 250,390 250,350 C250,320 230,320 220,350 C210,390 200,420 220,450 Z" fill="url(#skinWarm)" />

                    <!-- Rim Light (Warm Ambient) -->
                    <path d="M220,450 C240,420 250,390 250,350" stroke="url(#rimLight)" stroke-width="2" fill="none" />

                    <!-- Reflected Light (Cool Screen Glow) on Thumb Side -->
                    <path d="M220,450 C200,480 190,550 200,650 C210,700 220,720 220,720 L240,570 C240,520 220,470 220,450 Z" fill="url(#screenReflect)" />

                    <!-- IP Joint (Knuckle) -->
                    <path d="M215,445 Q225,455 235,440" stroke="#5d4037" stroke-width="3" fill="none" stroke-linecap="round" />
                    <!-- Joint Highlight -->
                    <path d="M220,452 Q225,455 230,445" stroke="#e0ac98" stroke-width="1.5" fill="none" opacity="0.6" />

                    <!-- Nail Bed -->
                    <path d="M235,360 Q245,350 240,330 Q230,330 225,360 Z" fill="#F5D0B5" opacity="0.9" />
                    <!-- Nail Highlight -->
                    <path d="M238,355 Q240,350 238,340" stroke="#fff" stroke-width="1" opacity="0.7" />
                    <!-- Cuticle -->
                    <path d="M228,362 Q235,365 240,360" stroke="#a1887f" stroke-width="1" fill="none" />

                    <!-- Contact Highlight (Skin pressing glass) -->
                    <path d="M225,400 Q240,410 245,430" stroke="#fff" stroke-width="1" opacity="0.5" filter="url(#blurSoft)" />
                </g>
            </g>

        </svg>
    </main>

<script>
    // Interaction Logic: Parallax & Tilt
    document.addEventListener('DOMContentLoaded', () => {
        const svgElement = document.getElementById('artwork');
        const thumbGroup = document.getElementById('thumb');
        const fingersBack = document.getElementById('fingers-back');
        const deviceGroup = document.getElementById('device');
        
        // Config
        const sensitivity = 10; // Rotation intensity
        const parallaxFactor = 0.02; // Translation intensity

        // Smooth animation state
        let currentX = 0;
        let currentY = 0;
        let targetX = 0;
        let targetY = 0;

        document.addEventListener('mousemove', (e) => {
            // Normalize mouse position -1 to 1
            targetX = (e.pageX / window.innerWidth) * 2 - 1;
            targetY = (e.pageY / window.innerHeight) * 2 - 1;
        });

        // Animation Loop for smooth interpolation
        function animate() {
            // Lerp (Linear Interpolation) for smoothness
            const ease = 0.1;
            currentX += (targetX - currentX) * ease;
            currentY += (targetY - currentY) * ease;

            // 1. Device Tilt (Inverse rotation)
            const rotateY = -currentX * sensitivity; 
            const rotateX = currentY * sensitivity;

            svgElement.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

            // 2. Parallax Depth Layers
            
            // Thumb (Front) moves most, opposite to mouse (closer)
            if(thumbGroup) {
                const moveX = -currentX * 30; 
                const moveY = -currentY * 30;
                thumbGroup.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }

            // Device (Middle) moves slightly
            if(deviceGroup) {
                const moveX = -currentX * 8;
                const moveY = -currentY * 8;
                deviceGroup.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }

            // Fingers (Back) moves least, same direction (further away)
            if(fingersBack) {
                const moveX = currentX * 12;
                const moveY = currentY * 12;
                fingersBack.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>
</body>
</html>
