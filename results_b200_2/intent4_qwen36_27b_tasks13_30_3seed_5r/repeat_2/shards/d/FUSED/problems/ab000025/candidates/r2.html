<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Study: The Grip</title>
<style>
    :root {
        --bg-color: #121214;
        --text-primary: #f0f0f0;
        --text-secondary: #888888;
        --font-sans: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
        --font-mono: "SF Mono", "Menlo", "Courier New", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-family: var(--font-sans);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1500px; /* Deep perspective for 3D tilt */
    }

    /* Cinematic Vignette & Grain */
    .overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 20;
        background: radial-gradient(circle at center, transparent 0%, #000000 120%);
        box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
    }

    .grain {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 21;
        opacity: 0.04;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* UI Elements */
    header {
        position: absolute;
        top: 2.5rem;
        left: 2.5rem;
        z-index: 30;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    h1 {
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-primary);
    }

    .subtitle {
        font-size: 0.7rem;
        color: var(--text-secondary);
        font-weight: 400;
    }

    .meta {
        position: absolute;
        bottom: 2.5rem;
        right: 2.5rem;
        font-family: var(--font-mono);
        font-size: 0.65rem;
        color: var(--text-secondary);
        text-align: right;
        line-height: 1.6;
        z-index: 30;
        border-right: 1px solid #333;
        padding-right: 1rem;
    }

    /* Main Stage */
    .stage {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    svg {
        height: 90vh;
        width: auto;
        max-width: 100%;
        filter: drop-shadow(0px 20px 40px rgba(0,0,0,0.5));
        transition: transform 0.1s cubic-bezier(0.1, 0.8, 0.2, 1);
        will-change: transform;
    }

    /* Subtle floating animation */
    @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
    }
    .anim-float {
        animation: float 6s ease-in-out infinite;
    }

</style>
</head>
<body>

    <div class="overlay"></div>
    <div class="grain"></div>

    <header>
        <h1>The Grip</h1>
        <span class="subtitle">Macro Illustration Series 04</span>
    </header>

    <div class="meta">
        SCALE: 400%<br>
        LENS: 100mm MACRO<br>
        LIGHTING: RIM / KEY<br>
        STATUS: ACTIVE
    </div>

    <main class="stage">
        <!-- 
            REVISED SVG ARCHITECTURE:
            - ViewBox: 0 0 800 1000 (Vertical format)
            - Composition: Tight crop on hand and device.
            - Lighting: Directional light from Top-Right.
        -->
        <svg id="artwork" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- SKIN GRADIENTS -->
                <!-- Base Skin: Warm tone with shadow gradient -->
                <linearGradient id="skinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#E5C3A8" /> <!-- Light -->
                    <stop offset="50%" stop-color="#D19E7E" /> <!-- Mid -->
                    <stop offset="100%" stop-color="#A86A4A" /> <!-- Shadow -->
                </linearGradient>

                <!-- Deep Shadow for crevices -->
                <linearGradient id="skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#8B4513" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="#3E1D04" stop-opacity="0.9"/>
                </linearGradient>

                <!-- PHONE MATERIALS -->
                <!-- Titanium/Aluminum Body -->
                <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#2a2a2a" />
                    <stop offset="30%" stop-color="#111" />
                    <stop offset="70%" stop-color="#1a1a1a" />
                    <stop offset="100%" stop-color="#050505" />
                </linearGradient>

                <!-- Screen Reflection (Glass Glare) -->
                <linearGradient id="screenGlare" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0.1)" />
                    <stop offset="30%" stop-color="rgba(255,255,255,0.0)" />
                    <stop offset="32%" stop-color="rgba(255,255,255,0.15)" />
                    <stop offset="100%" stop-color="rgba(255,255,255,0.0)" />
                </linearGradient>

                <!-- SCREEN CONTENT (Abstract) -->
                <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#0f0f12" />
                    <stop offset="100%" stop-color="#1a1a20" />
                </linearGradient>

                <!-- FILTERS -->
                <!-- Soft Blur for shadows -->
                <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="8" />
                </filter>
                
                <!-- Sharp Blur for skin detail -->
                <filter id="blurSkin" x="-10%" y="-10%" width="120%" height="120%">
                    <feGaussianBlur stdDeviation="1.5" />
                </filter>

                <!-- Clip for screen content -->
                <clipPath id="screenClip">
                    <rect x="260" y="160" width="200" height="640" rx="20" />
                </clipPath>
            </defs>

            <!-- BACKGROUND (Subtle Gradient) -->
            <rect width="100%" height="100%" fill="#121214" />

            <g id="scene" class="anim-float">
                
                <!-- ================= LAYER 1: FINGERS BEHIND PHONE ================= -->
                <!-- These wrap around the left edge and provide the base grip -->
                <g id="fingers-back">
                    
                    <!-- Pinky (Bottom, tightest grip) -->
                    <g transform="translate(0,0)">
                        <path d="M320,750 C320,700 280,680 260,700 C250,720 270,760 320,750 Z" fill="url(#skinGradient)" />
                        <!-- Crease -->
                        <path d="M280,720 Q290,730 300,725" stroke="#8B5A2B" stroke-width="2" fill="none" opacity="0.6"/>
                    </g>

                    <!-- Ring Finger -->
                    <g transform="translate(0,0)">
                        <path d="M325,680 C325,630 280,610 260,630 C250,650 270,690 325,680 Z" fill="url(#skinGradient)" />
                        <!-- Crease -->
                        <path d="M280,650 Q290,660 300,655" stroke="#8B5A2B" stroke-width="2" fill="none" opacity="0.6"/>
                        <!-- Nail hint -->
                        <path d="M265,640 Q270,635 275,645" stroke="#E0B090" stroke-width="1" fill="none" opacity="0.5"/>
                    </g>

                    <!-- Middle Finger -->
                    <g transform="translate(0,0)">
                        <path d="M330,610 C330,560 280,540 260,560 C250,580 270,620 330,610 Z" fill="url(#skinGradient)" />
                        <!-- Crease -->
                        <path d="M280,580 Q290,590 300,585" stroke="#8B5A2B" stroke-width="2" fill="none" opacity="0.6"/>
                        <!-- Nail -->
                        <path d="M265,570 Q270,565 275,575" stroke="#E0B090" stroke-width="1" fill="none" opacity="0.5"/>
                    </g>

                    <!-- Index Finger (Top, thumb of the back hand) -->
                    <g transform="translate(0,0)">
                        <!-- Proximal/Middle -->
                        <path d="M335,540 C335,490 280,470 260,490 C250,510 270,550 335,540 Z" fill="url(#skinGradient)" />
                        <!-- Distal (Tip over edge) -->
                        <path d="M270,495 C280,470 300,475 310,490 C300,510 280,510 270,495 Z" fill="url(#skinGradient)" />
                        
                        <!-- IP Joint Crease -->
                        <path d="M290,495 Q300,505 310,495" stroke="#8B5A2B" stroke-width="2.5" fill="none" opacity="0.7" stroke-linecap="round"/>
                        
                        <!-- Nail Bed -->
                        <path d="M285,480 Q290,475 295,485" stroke="#E0B090" stroke-width="1.5" fill="none" opacity="0.6"/>
                    </g>

                </g>


                <!-- ================= LAYER 2: THE SMARTPHONE ================= -->
                <g id="phone">
                    <!-- Cast Shadow (Device onto Background) -->
                    <rect x="250" y="150" width="220" height="680" rx="30" fill="#000" opacity="0.6" filter="url(#blurSoft)" transform="translate(20, 30)" />

                    <!-- Device Body (Titanium) -->
                    <rect x="240" y="140" width="220" height="680" rx="30" fill="url(#phoneBody)" />
                    
                    <!-- Bezel Highlights (Edge definition) -->
                    <!-- Left Edge Highlight -->
                    <path d="M242,145 L242,815" stroke="#fff" stroke-width="1" opacity="0.2" />
                    <!-- Top Edge Highlight -->
                    <path d="M245,142 L455,142" stroke="#fff" stroke-width="1" opacity="0.15" />
                    <!-- Right Edge (Shadow side) -->
                    <path d="M458,145 L458,815" stroke="#000" stroke-width="2" opacity="0.5" />

                    <!-- Screen Area -->
                    <rect x="255" y="155" width="190" height="650" rx="20" fill="url(#screenBg)" />

                    <!-- Screen Content (Clipped) -->
                    <g clip-path="url(#screenClip)">
                        <!-- Abstract UI Elements -->
                        <!-- Top Card -->
                        <rect x="270" y="220" width="160" height="120" rx="16" fill="#1e1e24" stroke="#333" stroke-width="1" />
                        <circle cx="295" cy="265" r="15" fill="#333" />
                        <rect x="325" y="255" width="80" height="8" rx="4" fill="#333" />
                        <rect x="325" y="275" width="50" height="6" rx="3" fill="#222" />

                        <!-- List Items -->
                        <rect x="270" y="370" width="160" height="60" rx="12" fill="#1e1e24" stroke="#333" stroke-width="1" />
                        <rect x="285" y="390" width="100" height="8" rx="4" fill="#333" />
                        
                        <rect x="270" y="450" width="160" height="60" rx="12" fill="#1e1e24" stroke="#333" stroke-width="1" />
                        <rect x="285" y="470" width="120" height="8" rx="4" fill="#333" />

                        <!-- Glare Overlay -->
                        <path d="M200,100 L500,100 L350,900 L100,900 Z" fill="url(#screenGlare)" />
                    </g>

                    <!-- Dynamic Island / Camera -->
                    <rect x="300" y="165" width="90" height="24" rx="12" fill="#000" />
                    <circle cx="370" cy="177" r="5" fill="#111" /> <!-- Lens -->
                    <circle cx="370" cy="177" r="2" fill="#333" /> <!-- Glint -->
                    <circle cx="320" cy="177" r="2" fill="#222" /> <!-- Sensor -->

                    <!-- Side Buttons -->
                    <!-- Volume Up -->
                    <rect x="458" y="250" width="4" height="40" rx="2" fill="#1a1a1a" />
                    <!-- Volume Down -->
                    <rect x="458" y="300" width="4" height="40" rx="2" fill="#1a1a1a" />
                    <!-- Action Button -->
                    <rect x="238" y="280" width="4" height="30" rx="2" fill="#1a1a1a" />

                </g>


                <!-- ================= LAYER 3: HAND IN FRONT (Palm & Thumb) ================= -->
                <g id="hand-front">
                    
                    <!-- Palm Base (Supporting from bottom left) -->
                    <path d="M100,1000 L250,900 C300,850 320,800 320,750 L320,1000 Z" fill="url(#skinGradient)" />
                    
                    <!-- Cast Shadow: Fingers Behind onto Palm (Depth cue) -->
                    <path d="M320,500 L320,800 C300,820 280,830 250,850 Z" fill="#000" opacity="0.15" filter="url(#blurSoft)" />

                    <!-- Thenar Eminence (Thumb Muscle) -->
                    <!-- This defines the fleshy part of the palm -->
                    <path d="M250,700 C280,650 320,680 320,750 C320,800 280,850 220,850 C200,800 220,750 250,700 Z" fill="url(#skinGradient)" />
                    <!-- Muscle striations -->
                    <path d="M260,720 Q280,740 290,770" stroke="#8B5A2B" stroke-width="1.5" fill="none" opacity="0.3" filter="url(#blurSkin)" />
                    <path d="M270,740 Q290,760 300,790" stroke="#8B5A2B" stroke-width="1.5" fill="none" opacity="0.3" filter="url(#blurSkin)" />

                    <!-- THUMB ASSEMBLY (The focal point) -->
                    <g id="thumb">
                        
                        <!-- Cast Shadow: Thumb onto Screen -->
                        <!-- This is crucial for depth -->
                        <ellipse cx="340" cy="480" rx="30" ry="60" fill="#000" opacity="0.4" filter="url(#blurSoft)" transform="rotate(-15, 340, 480)" />

                        <!-- Proximal Phalanx (Base) -->
                        <path d="M280,750 C310,700 330,650 330,600 C330,550 310,500 310,480 C290,480 270,550 260,650 Z" fill="url(#skinGradient)" />
                        
                        <!-- Distal Phalanx (Tip) -->
                        <path d="M310,480 C330,450 340,420 340,380 C340,350 320,350 310,380 C300,420 290,450 310,480 Z" fill="url(#skinGradient)" />

                        <!-- IP Joint (Knuckle) Detail -->
                        <!-- Skin fold -->
                        <path d="M305,475 Q315,485 325,470" stroke="#9E6B42" stroke-width="3" fill="none" stroke-linecap="round" />
                        <!-- Highlight on knuckle -->
                        <path d="M310,482 Q315,485 320,475" stroke="#EAC0A6" stroke-width="1.5" fill="none" opacity="0.6" />

                        <!-- Nail Detail -->
                        <!-- Nail Bed -->
                        <path d="M325,390 Q335,380 330,360 Q320,360 315,390 Z" fill="#F5D0B5" opacity="0.8" />
                        <!-- Highlight -->
                        <path d="M328,385 Q330,380 328,370" stroke="#fff" stroke-width="1" opacity="0.5" />
                        <!-- Cuticle -->
                        <path d="M318,392 Q325,395 330,390" stroke="#C68E68" stroke-width="1" fill="none" />

                        <!-- Contact Highlight (Finger touching screen) -->
                        <!-- White line where skin presses against glass -->
                        <path d="M315,420 Q330,430 335,450" stroke="#fff" stroke-width="1" opacity="0.3" filter="url(#blurSoft)" />

                    </g>
                </g>

            </g>
        </svg>
    </main>

<script>
    // Interaction Logic: Parallax & Tilt
    document.addEventListener('DOMContentLoaded', () => {
        const svgElement = document.getElementById('artwork');
        const thumbGroup = document.getElementById('thumb');
        const fingersBack = document.getElementById('fingers-back');
        
        // Config
        const sensitivity = 12; // Rotation intensity
        const parallaxFactor = 0.02; // Translation intensity

        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / window.innerWidth;
            const y = (window.innerHeight / 2 - e.pageY) / window.innerHeight;

            // 1. Device Tilt
            const rotateY = x * sensitivity; 
            const rotateX = -y * sensitivity;

            svgElement.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

            // 2. Parallax Depth
            // Thumb (Front) moves more in opposite direction
            if(thumbGroup) {
                const moveX = -x * 30; 
                const moveY = -y * 30;
                thumbGroup.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }

            // Fingers (Back) move less, same direction as tilt to look further away
            if(fingersBack) {
                const moveX = x * 15;
                const moveY = y * 15;
                fingersBack.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }
        });

        // Reset
        document.addEventListener('mouseleave', () => {
            svgElement.style.transform = `rotateX(0deg) rotateY(0deg)`;
            if(thumbGroup) thumbGroup.style.transform = `translate(0px, 0px)`;
            if(fingersBack) fingersBack.style.transform = `translate(0px, 0px)`;
        });
    });
</script>
</body>
</html>
