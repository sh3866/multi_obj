<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Study: The Grip - Design Revision</title>
<style>
    :root {
        --bg-dark: #030303;
        --bg-accent: #121212;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg-dark);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #fff;
    }

    /* Background Atmosphere */
    .background-glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 60%, #1a1c20 0%, #000000 80%);
        z-index: 0;
    }

    /* Main Stage */
    .stage {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1200px;
        z-index: 1;
    }

    svg {
        height: 95vh;
        width: auto;
        max-width: 100%;
        /* Deep shadow for the whole object */
        filter: drop-shadow(0px 30px 60px rgba(0,0,0,0.8));
        will-change: transform;
        transition: transform 0.05s linear; 
    }

    /* Noise overlay for film grain texture */
    .noise {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        opacity: 0.07;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

</style>
</head>
<body>

    <div class="background-glow"></div>
    <div class="noise"></div>

    <main class="stage">
        <!-- 
            REDESIGNED SVG:
            1. Anatomy: Complete overhaul. Fingers taper, knuckles distinct, thumb shows tension.
            2. Lighting: Complex subsurface scattering (reds/oranges) vs cool screen reflection.
            3. Phone: Brighter bezel, active screen, clear camera module.
            4. Composition: Tighter crop, wrist fades into shadow.
        -->
        <svg id="artwork" viewBox="0 0 400 800" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- FILTERS -->
                <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="2.5" />
                </filter>
                <filter id="blurHeavy" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="12" />
                </filter>
                
                <!-- SKIN GRADIENTS -->
                <!-- Complex skin tone: Base -->
                <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#E5B99F" />
                    <stop offset="40%" stop-color="#C4927A" />
                    <stop offset="100%" stop-color="#8D5E45" />
                </linearGradient>

                <!-- Subsurface Scattering (Warm Red/Orange in crevices) -->
                <linearGradient id="sssWarm" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FF8A65" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="#BF360C" stop-opacity="0.2"/>
                </linearGradient>

                <!-- Screen Reflection (Cool Blue) -->
                <linearGradient id="screenReflect" x1="100%" y1="100%" x2="0%" y2="0%">
                    <stop offset="0%" stop-color="#4FC3F7" stop-opacity="0.7"/>
                    <stop offset="40%" stop-color="#1976D2" stop-opacity="0.3"/>
                    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
                </linearGradient>

                <!-- Ambient Rim Light (Warm) -->
                <linearGradient id="rimLight" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.6"/>
                    <stop offset="50%" stop-color="#FFD54F" stop-opacity="0.1"/>
                    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
                </linearGradient>

                <!-- DEVICE GRADIENTS -->
                <!-- Titanium/Aluminum Frame -->
                <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#2c2c2c" />
                    <stop offset="15%" stop-color="#8a8a8a" />
                    <stop offset="50%" stop-color="#4a4a4a" />
                    <stop offset="85%" stop-color="#9a9a9a" />
                    <stop offset="100%" stop-color="#1a1a1a" />
                </linearGradient>

                <!-- Screen Surface -->
                <linearGradient id="screenBase" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#121212" />
                    <stop offset="100%" stop-color="#050505" />
                </linearGradient>

                <!-- Screen Glare -->
                <linearGradient id="glare" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#fff" stop-opacity="0.05" />
                    <stop offset="50%" stop-color="#fff" stop-opacity="0.0" />
                    <stop offset="55%" stop-color="#fff" stop-opacity="0.15" />
                    <stop offset="100%" stop-color="#fff" stop-opacity="0.0" />
                </linearGradient>
            </defs>

            <!-- ================= LAYER 1: BACKGROUND FINGERS (Right Hand) ================= -->
            <g id="fingers-back">
                <!-- Cast Shadow on Phone Back -->
                <path d="M120,200 L120,800 L180,800 L180,200 Z" fill="#000" opacity="0.8" filter="url(#blurHeavy)" />

                <!-- Pinky (Tapered, distinct joint) -->
                <g transform="translate(0,0)">
                    <!-- Finger Body -->
                    <path d="M125,720 C115,720 105,710 105,690 C105,670 115,660 125,670 L125,720 Z" fill="url(#skinBase)" />
                    <!-- SSS Highlight in crease -->
                    <path d="M112,690 Q115,700 120,695" stroke="url(#sssWarm)" stroke-width="2" fill="none" />
                    <!-- Nail -->
                    <path d="M108,685 Q110,680 112,685" stroke="#D7CCC8" stroke-width="1.5" fill="none" opacity="0.6" />
                </g>

                <!-- Ring Finger -->
                <g transform="translate(0,0)">
                    <path d="M125,640 C110,640 100,620 100,590 C100,560 115,550 125,560 L125,640 Z" fill="url(#skinBase)" />
                    <!-- PIP Joint -->
                    <path d="M110,610 Q115,615 120,610" stroke="#5D4037" stroke-width="2" fill="none" opacity="0.8" />
                    <path d="M112,608 Q115,610 118,608" stroke="url(#sssWarm)" stroke-width="1" fill="none" />
                    <!-- Nail -->
                    <path d="M103,595 Q105,590 108,595" stroke="#D7CCC8" stroke-width="1.5" fill="none" opacity="0.6" />
                </g>

                <!-- Middle Finger -->
                <g transform="translate(0,0)">
                    <path d="M125,560 C105,560 95,540 95,500 C95,470 110,460 125,470 L125,560 Z" fill="url(#skinBase)" />
                    <!-- PIP Joint -->
                    <path d="M105,520 Q110,525 115,520" stroke="#5D4037" stroke-width="2" fill="none" opacity="0.8" />
                    <path d="M108,518 Q110,520 112,518" stroke="url(#sssWarm)" stroke-width="1" fill="none" />
                    <!-- Nail -->
                    <path d="M98,505 Q100,500 103,505" stroke="#D7CCC8" stroke-width="1.5" fill="none" opacity="0.6" />
                </g>

                <!-- Index Finger (Wrapping over edge) -->
                <g transform="translate(0,0)">
                    <!-- Base -->
                    <path d="M125,480 C100,480 90,450 90,410 C90,380 115,370 125,380 L125,480 Z" fill="url(#skinBase)" />
                    <!-- Tip over edge -->
                    <path d="M95,380 C100,350 130,350 125,370 C120,390 100,390 95,380 Z" fill="url(#skinBase)" />
                    
                    <!-- Knuckles (MCP/PIP) - Visible tension -->
                    <path d="M105,430 Q115,440 125,435" stroke="#4E342E" stroke-width="2.5" fill="none" />
                    <path d="M108,432 Q115,438 120,435" stroke="url(#sssWarm)" stroke-width="1" fill="none" opacity="0.8"/>
                    
                    <!-- Nail -->
                    <path d="M100,385 Q105,380 110,385" stroke="#D7CCC8" stroke-width="1.5" fill="none" opacity="0.6" />
                </g>
            </g>


            <!-- ================= LAYER 2: THE DEVICE ================= -->
            <g id="device">
                <!-- Drop Shadow -->
                <rect x="130" y="110" width="140" height="760" rx="30" fill="#000" opacity="0.8" filter="url(#blurHeavy)" transform="translate(10, 20)" />

                <!-- Titanium Body -->
                <rect x="130" y="100" width="140" height="760" rx="30" fill="url(#titanium)" />
                
                <!-- Edge Highlight (Left) -->
                <path d="M132,102 L132,858" stroke="#fff" stroke-width="1.5" opacity="0.4" />
                <!-- Edge Shadow (Right) -->
                <path d="M268,102 L268,858" stroke="#000" stroke-width="2" opacity="0.6" />

                <!-- Screen Base -->
                <rect x="138" y="108" width="124" height="744" rx="24" fill="url(#screenBase)" />

                <!-- UI Elements (Subtle, to imply active state) -->
                <g id="ui">
                    <!-- Status Bar -->
                    <rect x="150" y="120" width="10" height="10" rx="2" fill="#333" />
                    <rect x="230" y="120" width="25" height="10" rx="2" fill="#333" />
                    
                    <!-- Card 1 (App UI) -->
                    <rect x="150" y="200" width="100" height="140" rx="12" fill="#1a1a1a" />
                    <!-- Image placeholder -->
                    <rect x="160" y="210" width="80" height="60" rx="4" fill="#252525" />
                    <rect x="160" y="280" width="60" height="6" rx="3" fill="#333" />
                    <rect x="160" y="295" width="40" height="4" rx="2" fill="#222" />
                    
                    <!-- Card 2 -->
                    <rect x="150" y="360" width="100" height="100" rx="12" fill="#1a1a1a" />
                    <circle cx="200" cy="410" r="20" fill="#252525" />
                </g>

                <!-- Glass Glare -->
                <path d="M80,50 L330,50 L180,900 L30,900 Z" fill="url(#glare)" style="mix-blend-mode: overlay;" />

                <!-- Dynamic Island / Notch -->
                <rect x="180" y="115" width="60" height="20" rx="10" fill="#000" />
                <circle cx="225" cy="125" r="4" fill="#111" /> <!-- Lens -->
                <circle cx="225" cy="125" r="1.5" fill="#555" /> <!-- Glint -->
                <circle cx="195" cy="125" r="2" fill="#222" /> <!-- Sensor -->

                <!-- Speaker Grille -->
                <rect x="200" y="105" width="20" height="2" rx="1" fill="#222" />

                <!-- Side Buttons -->
                <rect x="128" y="250" width="4" height="30" rx="2" fill="#111" /> <!-- Action -->
                <rect x="268" y="250" width="4" height="40" rx="2" fill="#111" /> <!-- Vol Up -->
                <rect x="268" y="300" width="4" height="40" rx="2" fill="#111" /> <!-- Vol Down -->
            </g>


            <!-- ================= LAYER 3: HAND FRONT (Palm & Thumb) ================= -->
            <g id="hand-front">
                
                <!-- Palm Base (Bottom Left) -->
                <path d="M-50,950 L100,850 C160,800 200,750 210,700 L210,950 Z" fill="url(#skinBase)" />
                
                <!-- Cast Shadow: Fingers onto Palm -->
                <path d="M210,450 L210,700 C160,800 100,850 -50,950 Z" fill="#000" opacity="0.4" filter="url(#blurSoft)" />

                <!-- Thenar Eminence (Thumb Muscle) -->
                <path d="M140,800 C180,750 220,770 220,730 C220,690 180,670 140,700 C120,730 120,770 140,800 Z" fill="url(#skinBase)" />
                
                <!-- Muscle Striations (Tension lines) -->
                <path d="M160,730 Q180,750 190,780" stroke="#795548" stroke-width="2" fill="none" opacity="0.5" filter="url(#blurSoft)" />
                <path d="M170,710 Q190,730 200,760" stroke="#795548" stroke-width="2" fill="none" opacity="0.5" filter="url(#blurSoft)" />

                <!-- THUMB GROUP -->
                <g id="thumb">
                    <!-- Cast Shadow: Thumb onto Screen -->
                    <ellipse cx="250" cy="450" rx="18" ry="70" fill="#000" opacity="0.7" filter="url(#blurSoft)" transform="rotate(-15, 250, 450)" />

                    <!-- Thumb Base (Proximal) -->
                    <path d="M170,720 C200,670 220,620 220,570 C220,520 200,470 200,450 C180,450 160,520 150,620 Z" fill="url(#skinBase)" />
                    
                    <!-- Thumb Tip (Distal) -->
                    <path d="M200,450 C220,420 230,390 230,350 C230,320 210,320 200,350 C190,390 180,420 200,450 Z" fill="url(#skinBase)" />

                    <!-- Rim Light (Warm Ambient) - Top Edge of Thumb -->
                    <path d="M200,450 C220,420 230,390 230,350" stroke="url(#rimLight)" stroke-width="3" fill="none" filter="url(#blurSoft)" />

                    <!-- Reflected Light (Cool Screen Glow) on Inner Thumb Side -->
                    <path d="M200,450 C180,480 170,550 180,650 C190,700 200,720 200,720 L220,570 C220,520 200,470 200,450 Z" fill="url(#screenReflect)" opacity="0.8" style="mix-blend-mode: screen;" />

                    <!-- IP Joint (Knuckle) - Detailed -->
                    <path d="M195,445 Q205,455 215,440" stroke="#4E342E" stroke-width="3" fill="none" stroke-linecap="round" />
                    <!-- Joint Highlight -->
                    <path d="M200,452 Q205,455 210,445" stroke="#D7CCC8" stroke-width="1.5" fill="none" opacity="0.7" />

                    <!-- Nail Bed -->
                    <path d="M215,360 Q225,350 220,330 Q210,330 205,360 Z" fill="#F5D0B5" opacity="0.9" />
                    <!-- Nail Highlight -->
                    <path d="M218,355 Q220,350 218,340" stroke="#fff" stroke-width="1" opacity="0.8" />
                    <!-- Cuticle -->
                    <path d="M208,362 Q215,365 220,360" stroke="#8D6E63" stroke-width="1.5" fill="none" />

                    <!-- Contact Highlight (Skin pressing glass) -->
                    <path d="M205,400 Q220,410 225,430" stroke="#fff" stroke-width="1.5" opacity="0.6" filter="url(#blurSoft)" />
                </g>
            </g>

        </svg>
    </main>

<script>
    // Interaction Logic: Parallax & Tilt
    document.addEventListener('DOMContentLoaded', () => {
        const svgElement = document.getElementById('artwork');
        const thumbGroup = document.getElementById('thumb');
        const fingersBack = document.getElementById('fingers-back');
        const deviceGroup = document.getElementById('device');
        
        // Config
        const sensitivity = 8; // Rotation intensity
        const parallaxFactor = 0.02; // Translation intensity

        // Smooth animation state
        let currentX = 0;
        let currentY = 0;
        let targetX = 0;
        let targetY = 0;

        document.addEventListener('mousemove', (e) => {
            // Normalize mouse position -1 to 1
            targetX = (e.pageX / window.innerWidth) * 2 - 1;
            targetY = (e.pageY / window.innerHeight) * 2 - 1;
        });

        // Animation Loop for smooth interpolation
        function animate() {
            // Lerp (Linear Interpolation) for smoothness
            const ease = 0.1;
            currentX += (targetX - currentX) * ease;
            currentY += (targetY - currentY) * ease;

            // 1. Device Tilt (Inverse rotation)
            const rotateY = -currentX * sensitivity; 
            const rotateX = currentY * sensitivity;

            svgElement.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

            // 2. Parallax Depth Layers
            
            // Thumb (Front) moves most, opposite to mouse (closer)
            if(thumbGroup) {
                const moveX = -currentX * 25; 
                const moveY = -currentY * 25;
                thumbGroup.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }

            // Device (Middle) moves slightly
            if(deviceGroup) {
                const moveX = -currentX * 6;
                const moveY = -currentY * 6;
                deviceGroup.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }

            // Fingers (Back) moves least, same direction (further away)
            if(fingersBack) {
                const moveX = currentX * 10;
                const moveY = currentY * 10;
                fingersBack.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }

            requestAnimationFrame(animate);
        }

        animate();
    });
</script>
</body>
</html>
