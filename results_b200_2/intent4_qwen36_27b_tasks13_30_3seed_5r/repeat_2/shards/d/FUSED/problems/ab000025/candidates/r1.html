<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Grip | Macro Illustration</title>
<style>
    :root {
        --bg: #1a1a1c;
        --text: #e0e0e0;
        --accent: #ff4d4d;
        --font-main: "Helvetica Neue", Helvetica, Arial, sans-serif;
        --font-mono: "Menlo", "Courier New", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font-main);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* Grain Overlay for Film/Editorial Texture */
    .grain {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 20;
        opacity: 0.07;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* UI Layout - Minimalist Corner Anchors */
    header {
        position: absolute;
        top: 2rem;
        left: 2rem;
        z-index: 10;
        mix-blend-mode: difference;
    }

    h1 {
        font-size: 0.9rem;
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        opacity: 0.8;
    }

    .meta {
        position: absolute;
        bottom: 2rem;
        right: 2rem;
        font-family: var(--font-mono);
        font-size: 0.65rem;
        color: #888;
        text-align: right;
        line-height: 1.5;
        z-index: 10;
        mix-blend-mode: difference;
    }

    /* The SVG Container */
    .art-stage {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1200px; /* Essential for 3D tilt */
    }

    svg {
        height: 100vh;
        width: auto;
        max-width: 100%;
        /* No static drop shadow, shadows are internal now */
        will-change: transform;
        transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* SVG Internal Styles */
    .skin-highlight { fill: #EAC0A6; }
    .skin-shadow { fill: #A86A4A; }
    .phone-metal { fill: #2a2a2a; }
    
    /* Subtle breathing animation for the grip */
    @keyframes breathe {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(1px); }
    }
    .grip-anim {
        animation: breathe 4s ease-in-out infinite;
    }

</style>
</head>
<body>

    <div class="grain"></div>

    <header>
        <h1>Subject: Grip</h1>
    </header>

    <div class="meta">
        SCALE: 400%<br>
        LENS: 100mm MACRO<br>
        F/2.8
    </div>

    <main class="art-stage">
        <!-- 
            REVISED SVG:
            1. ViewBox cropped to focus on hand/phone.
            2. Anatomy completely redrawn with specific phalanges.
            3. Device polished with rim lights and notch.
            4. Lighting logic overhauled for depth.
        -->
        <svg id="illustration" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Skin Tones -->
                <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#EAC0A6" /> <!-- Highlight -->
                    <stop offset="60%" stop-color="#DFA689" /> <!-- Midtone -->
                    <stop offset="100%" stop-color="#C68E68" /> <!-- Shadow -->
                </linearGradient>

                <!-- Phone Body Gradients -->
                <linearGradient id="phoneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#111" />
                    <stop offset="50%" stop-color="#050505" />
                    <stop offset="100%" stop-color="#1a1a1a" />
                </linearGradient>

                <!-- Screen Reflection -->
                <linearGradient id="screenReflection" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
                    <stop offset="40%" stop-color="rgba(255,255,255,0.0)" />
                    <stop offset="42%" stop-color="rgba(255,255,255,0.0)" />
                    <stop offset="45%" stop-color="rgba(255,255,255,0.08)" />
                    <stop offset="100%" stop-color="rgba(255,255,255,0.0)" />
                </linearGradient>

                <!-- Shadows -->
                <filter id="contactShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="6" result="blur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="1.5" />
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <filter id="rimLight" x="-5%" y="-5%" width="110%" height="110%">
                    <feGaussianBlur stdDeviation="2" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>

                <!-- Clip Paths for Screen Content -->
                <clipPath id="screenClip">
                    <rect x="245" y="140" width="210" height="660" rx="25" />
                </clipPath>
            </defs>

            <!-- Background (Dark to emphasize the device rim light) -->
            <rect width="100%" height="100%" fill="#1a1a1c" />

            <g id="scene" class="grip-anim">
                
                <!-- LAYER 1: Fingers Behind Phone -->
                <g id="fingers-back">
                    <!-- Index Finger (Wrapping around left edge) -->
                    <g transform="translate(0, 0)">
                        <!-- Proximal -->
                        <path d="M360,250 Q400,220 420,260 L400,320 Q380,340 360,300 Z" fill="url(#skinBase)" />
                        <!-- Middle -->
                        <path d="M380,280 Q410,260 430,290 L410,350 Q390,360 370,330 Z" fill="url(#skinBase)" />
                        <!-- Distal (Tip wrapping over edge) -->
                        <path d="M410,320 Q440,310 450,340 L430,380 Q400,380 400,350 Z" fill="url(#skinBase)" />
                        <!-- Knuckle Crease -->
                        <path d="M390,290 Q405,285 415,300" stroke="#B07050" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
                        <!-- Nail Bed Hint -->
                        <path d="M435,330 Q445,325 445,335 L435,345 Z" fill="#F5D0B5" opacity="0.6" />
                    </g>

                    <!-- Middle Finger -->
                    <g transform="translate(0, 20)">
                        <path d="M350,280 Q390,260 410,300 L390,370 Q370,380 350,340 Z" fill="url(#skinBase)" />
                        <!-- Knuckle -->
                        <path d="M380,310 Q395,305 405,320" stroke="#B07050" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
                    </g>
                </g>

                <!-- LAYER 2: The Smartphone -->
                <g id="phone">
                    <!-- Drop shadow on background -->
                    <rect x="230" y="135" width="230" height="680" rx="35" fill="#000" opacity="0.6" filter="url(#contactShadow)" transform="translate(10, 10)" />

                    <!-- Main Body (Metallic) -->
                    <rect x="235" y="130" width="220" height="670" rx="35" fill="url(#phoneGradient)" />
                    
                    <!-- Bezel Edge (The "Rim Light") -->
                    <rect x="235" y="130" width="220" height="670" rx="35" fill="none" stroke="#555" stroke-width="1" opacity="0.8" />
                    <path d="M237,135 L237,795" stroke="#fff" stroke-width="1.5" opacity="0.3" filter="url(#rimLight)" /> <!-- Top Left Highlight -->

                    <!-- Screen (Glass) -->
                    <rect x="245" y="140" width="210" height="660" rx="25" fill="#0a0a0f" />

                    <!-- Screen Content (Abstract UI) -->
                    <g clip-path="url(#screenClip)">
                        <!-- Wallpaper -->
                        <rect x="245" y="140" width="210" height="660" fill="#111" />
                        <circle cx="350" cy="300" r="150" fill="#222" opacity="0.5" />
                        
                        <!-- Abstract UI Cards -->
                        <rect x="260" y="200" width="180" height="100" rx="12" fill="#fff" opacity="0.05" />
                        <rect x="260" y="320" width="180" height="40" rx="8" fill="#fff" opacity="0.05" />
                        <rect x="260" y="380" width="120" height="40" rx="8" fill="#fff" opacity="0.05" />

                        <!-- Diagonal Glare -->
                        <path d="M200,100 L500,100 L400,800 L100,800 Z" fill="url(#screenReflection)" />
                    </g>

                    <!-- Camera Notch / Dynamic Island -->
                    <rect x="310" y="150" width="80" height="24" rx="12" fill="#000" />
                    <circle cx="365" cy="162" r="4" fill="#1a1a1a" /> <!-- Lens -->
                    <circle cx="365" cy="162" r="1.5" fill="#333" /> <!-- Inner -->
                    <circle cx="325" cy="162" r="2" fill="#222" /> <!-- Speaker/Sensor -->
                </g>

                <!-- LAYER 3: Fingers in Front (Thumb & Palm) -->
                <g id="fingers-front">
                    
                    <!-- Palm Base -->
                    <path d="M150,600 Q250,550 300,650 L350,950 L150,950 Q100,800 150,600 Z" fill="url(#skinBase)" />
                    
                    <!-- Thenar Eminence (Thumb Muscle) -->
                    <path d="M220,550 Q280,500 320,580 Q300,650 220,650 Z" fill="url(#skinBase)" />
                    <!-- Muscle Definition Lines -->
                    <path d="M240,580 Q270,600 290,620" stroke="#B07050" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>

                    <!-- Thumb Assembly -->
                    <g id="thumb" transform="translate(0,0)">
                        <!-- Proximal Phalanx -->
                        <path d="M280,600 Q320,560 350,500 L320,470 Q290,530 250,570 Z" fill="url(#skinBase)" />
                        
                        <!-- Distal Phalanx (Tip) -->
                        <path d="M335,490 Q370,460 380,420 L350,400 Q330,440 310,470 Z" fill="url(#skinBase)" />
                        
                        <!-- Knuckle Crease (IP Joint) -->
                        <path d="M315,485 Q330,495 345,480" stroke="#A86A4A" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>
                        
                        <!-- Nail -->
                        <path d="M378,415 Q390,405 385,390 Q375,395 365,405 Z" fill="#F5D0B5" opacity="0.9" />
                        <path d="M375,410 Q380,408 378,415" stroke="#E0B090" stroke-width="1" opacity="0.6" fill="none" />

                        <!-- Contact Shadow: Thumb on Screen -->
                        <ellipse cx="340" cy="440" rx="25" ry="40" fill="#000" opacity="0.4" filter="url(#contactShadow)" transform="rotate(-20, 340, 440)" />
                    </g>
                </g>

            </g>
        </svg>
    </main>

<script>
    // Interaction Logic
    // 1. Parallax Tilt: The hand/phone tilts based on mouse position to create depth.
    // 2. Parallax Shift: The thumb moves slightly faster than the phone to simulate separation.
    document.addEventListener('DOMContentLoaded', () => {
        const svgElement = document.getElementById('illustration');
        const thumbGroup = document.getElementById('thumb');
        const fingersBack = document.getElementById('fingers-back');
        
        // Configuration
        const sensitivity = 15; // Degrees of rotation
        const thumbShiftFactor = 0.015; // How much the thumb moves relative to mouse

        document.addEventListener('mousemove', (e) => {
            // Get mouse position relative to center of screen
            const x = (window.innerWidth / 2 - e.pageX) / window.innerWidth;
            const y = (window.innerHeight / 2 - e.pageY) / window.innerHeight;

            // 1. Rotate the whole device (Tilt)
            // Negative X mouse -> Positive Y rotation (tilt right)
            // Negative Y mouse -> Negative X rotation (tilt up)
            const rotateY = x * sensitivity; 
            const rotateX = -y * sensitivity;

            svgElement.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

            // 2. Move the thumb (Parallax Depth)
            // Thumb is in front, so it should shift opposite to tilt slightly to enhance 3D feel
            if(thumbGroup) {
                const moveX = x * 20; // px
                const moveY = y * 20; // px
                thumbGroup.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }

            // 3. Move background fingers (Parallax Depth)
            // They are behind, so they move less/differently
            if(fingersBack) {
                const moveX = -x * 5;
                const moveY = -y * 5;
                fingersBack.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }
        });

        // Reset on leave
        document.addEventListener('mouseleave', () => {
            svgElement.style.transform = `rotateX(0deg) rotateY(0deg)`;
            if(thumbGroup) thumbGroup.style.transform = `translate(0px, 0px)`;
            if(fingersBack) fingersBack.style.transform = `translate(0px, 0px)`;
        });
    });
</script>
</body>
</html>
