<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Study: The Grip - Revised</title>
<style>
    :root {
        --bg-color: #0a0a0c;
        --bg-accent: #161618;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg-color);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #fff;
    }

    /* Deep Vignette */
    .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, transparent 40%, #000000 100%);
        pointer-events: none;
        z-index: 10;
    }

    /* Main Stage */
    .stage {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1200px;
    }

    svg {
        height: 95vh;
        width: auto;
        max-width: 100%;
        filter: drop-shadow(0px 30px 60px rgba(0,0,0,0.8));
        will-change: transform;
        /* Smooth out the mouse tracking */
        transition: transform 0.1s linear; 
    }

    /* Subtle breathing animation */
    @keyframes breathe {
        0%, 100% { transform: scale(1) translateY(0); }
        50% { transform: scale(1.01) translateY(-4px); }
    }
    
    .anim-breathe {
        animation: breathe 8s ease-in-out infinite;
        transform-origin: center center;
    }

</style>
</head>
<body>

    <div class="vignette"></div>

    <main class="stage">
        <!-- 
            REVISED SVG:
            - Macro Composition: ViewBox focused tight on the grip.
            - Anatomy: Distinct fingers, knuckles, nail beds, and webbing.
            - Lighting: Rim light on fingers, occlusion shadows at contact points.
            - Device: Titanium edge, screen glare, camera detail.
        -->
        <svg id="artwork" viewBox="0 0 600 1000" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- FILTERS -->
                <filter id="blurContact" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="4" />
                </filter>
                <filter id="blurDeep" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="12" />
                </filter>
                <filter id="skinSmooth">
                    <feGaussianBlur stdDeviation="0.8" />
                </filter>

                <!-- GRADIENTS: SKIN -->
                <!-- Main Skin Tone: Warm, natural -->
                <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#E6B89C" />
                    <stop offset="40%" stop-color="#D49A7D" />
                    <stop offset="100%" stop-color="#A86A4A" />
                </linearGradient>
                
                <!-- Rim Light Highlight (Top Right) -->
                <linearGradient id="skinRim" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FFF0E0" stop-opacity="0.6"/>
                    <stop offset="50%" stop-color="#FFF0E0" stop-opacity="0.0"/>
                </linearGradient>

                <!-- Crevice Shadow -->
                <linearGradient id="skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#8B5A2B" stop-opacity="0.4"/>
                    <stop offset="100%" stop-color="#4A2511" stop-opacity="0.8"/>
                </linearGradient>

                <!-- GRADIENTS: DEVICE -->
                <!-- Titanium Frame -->
                <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#3a3a3c" />
                    <stop offset="20%" stop-color="#1c1c1e" />
                    <stop offset="80%" stop-color="#2c2c2e" />
                    <stop offset="100%" stop-color="#000000" />
                </linearGradient>

                <!-- Screen Dark -->
                <linearGradient id="screenDark" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#080808" />
                    <stop offset="100%" stop-color="#040404" />
                </linearGradient>

                <!-- Glare -->
                <linearGradient id="glare" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#fff" stop-opacity="0.15" />
                    <stop offset="40%" stop-color="#fff" stop-opacity="0.0" />
                    <stop offset="42%" stop-color="#fff" stop-opacity="0.1" />
                    <stop offset="100%" stop-color="#fff" stop-opacity="0.0" />
                </linearGradient>
            </defs>

            <!-- BACKGROUND -->
            <rect width="100%" height="100%" fill="url(#screenDark)" />

            <g id="scene" class="anim-breathe">
                
                <!-- ================= LAYER 1: FINGERS BEHIND (The Back Hand) ================= -->
                <g id="fingers-back">
                    <!-- Cast Shadow from fingers onto phone back -->
                    <path d="M280,300 L280,850 L320,850 L320,300 Z" fill="#000" opacity="0.5" filter="url(#blurDeep)" transform="translate(10, 0)" />

                    <!-- Pinky -->
                    <g>
                        <!-- Base Phalanx -->
                        <path d="M300,820 C260,820 240,800 240,780 C240,760 260,750 290,760 C300,765 305,780 305,820 Z" fill="url(#skinBase)" />
                        <!-- Nail -->
                        <path d="M245,775 Q255,770 260,775" stroke="#F0C0A0" stroke-width="2" fill="none" opacity="0.6" />
                        <!-- Crease -->
                        <path d="M265,775 Q275,785 285,780" stroke="#8B5A2B" stroke-width="1.5" fill="none" opacity="0.5" />
                    </g>

                    <!-- Ring Finger -->
                    <g>
                        <path d="M305,740 C260,740 235,720 235,690 C235,660 260,650 290,660 C300,665 310,680 310,740 Z" fill="url(#skinBase)" />
                        <!-- Nail -->
                        <path d="M240,695 Q250,690 255,695" stroke="#F0C0A0" stroke-width="2" fill="none" opacity="0.6" />
                        <!-- Crease -->
                        <path d="M265,695 Q275,705 285,700" stroke="#8B5A2B" stroke-width="1.5" fill="none" opacity="0.5" />
                    </g>

                    <!-- Middle Finger -->
                    <g>
                        <path d="M310,660 C260,660 235,640 235,610 C235,580 260,570 290,580 C300,585 315,600 315,660 Z" fill="url(#skinBase)" />
                        <!-- Nail -->
                        <path d="M240,615 Q250,610 255,615" stroke="#F0C0A0" stroke-width="2" fill="none" opacity="0.6" />
                        <!-- Crease -->
                        <path d="M265,615 Q275,625 285,620" stroke="#8B5A2B" stroke-width="1.5" fill="none" opacity="0.5" />
                    </g>

                    <!-- Index Finger (Wrapping over edge) -->
                    <g>
                        <!-- Proximal/Middle -->
                        <path d="M315,580 C260,580 235,560 235,530 C235,500 260,490 290,500 C300,505 320,520 320,580 Z" fill="url(#skinBase)" />
                        <!-- Tip (Over edge) -->
                        <path d="M245,505 C250,480 280,480 290,500 C280,520 250,520 245,505 Z" fill="url(#skinBase)" />
                        
                        <!-- Joint Detail -->
                        <path d="M265,530 Q275,540 285,535" stroke="#8B5A2B" stroke-width="2" fill="none" opacity="0.6" />
                        <!-- Nail -->
                        <path d="M245,510 Q255,505 260,510" stroke="#F0C0A0" stroke-width="2" fill="none" opacity="0.6" />
                    </g>
                </g>


                <!-- ================= LAYER 2: THE DEVICE ================= -->
                <g id="device">
                    <!-- Drop Shadow -->
                    <rect x="230" y="130" width="160" height="800" rx="35" fill="#000" opacity="0.8" filter="url(#blurDeep)" transform="translate(15, 20)" />

                    <!-- Titanium Body -->
                    <rect x="220" y="120" width="160" height="800" rx="35" fill="url(#titanium)" />
                    
                    <!-- Metallic Rim Highlight (Left) -->
                    <path d="M222,122 L222,918" stroke="#fff" stroke-width="1" opacity="0.4" />
                    <!-- Metallic Rim Highlight (Top) -->
                    <path d="M224,122 L376,122" stroke="#fff" stroke-width="1" opacity="0.3" />
                    <!-- Shadow Edge (Right) -->
                    <path d="M378,122 L378,918" stroke="#000" stroke-width="4" opacity="0.6" />

                    <!-- Screen -->
                    <rect x="230" y="130" width="140" height="780" rx="28" fill="url(#screenDark)" />
                    
                    <!-- Screen UI (Abstract) -->
                    <g opacity="0.8">
                        <!-- Status Bar -->
                        <rect x="250" y="145" width="10" height="10" rx="2" fill="#333" />
                        <rect x="340" y="145" width="20" height="10" rx="2" fill="#333" />
                        
                        <!-- Content Block 1 -->
                        <rect x="245" y="200" width="110" height="140" rx="12" fill="#111" />
                        <rect x="255" y="220" width="60" height="6" rx="3" fill="#333" />
                        <rect x="255" y="235" width="90" height="4" rx="2" fill="#222" />
                        
                        <!-- Content Block 2 -->
                        <rect x="245" y="360" width="110" height="80" rx="12" fill="#111" />
                        <circle cx="265" cy="400" r="15" fill="#222" />
                        <rect x="290" y="395" width="50" height="4" rx="2" fill="#333" />
                    </g>

                    <!-- Glare Overlay (Glass Reflection) -->
                    <path d="M180,100 L450,100 L300,950 L150,950 Z" fill="url(#glare)" style="mix-blend-mode: overlay;" />

                    <!-- Camera Island (Dynamic Island style) -->
                    <rect x="275" y="145" width="70" height="22" rx="11" fill="#000" />
                    <circle cx="330" cy="156" r="5" fill="#111" /> <!-- Lens -->
                    <circle cx="330" cy="156" r="1.5" fill="#333" /> <!-- Glint -->
                    <circle cx="290" cy="156" r="2" fill="#222" /> <!-- Sensor -->

                    <!-- Buttons -->
                    <rect x="378" y="240" width="4" height="40" rx="2" fill="#111" /> <!-- Vol Up -->
                    <rect x="378" y="290" width="4" height="40" rx="2" fill="#111" /> <!-- Vol Down -->
                    <rect x="218" y="270" width="4" height="30" rx="2" fill="#111" /> <!-- Action -->
                </g>


                <!-- ================= LAYER 3: HAND FRONT (Palm & Thumb) ================= -->
                <g id="hand-front">
                    
                    <!-- Palm Base (Bottom Left) -->
                    <path d="M-50,1050 L150,950 C200,900 250,850 280,800 L280,1050 Z" fill="url(#skinBase)" />
                    
                    <!-- Cast Shadow: Fingers Behind onto Palm -->
                    <path d="M280,500 L280,800 C250,850 200,900 150,950 Z" fill="#000" opacity="0.2" filter="url(#blurContact)" />

                    <!-- Thenar Eminence (Thumb Muscle) -->
                    <path d="M220,850 C250,800 290,820 290,780 C290,740 250,720 220,750 C200,780 200,820 220,850 Z" fill="url(#skinBase)" />
                    
                    <!-- Muscle Striations (Anatomy detail) -->
                    <path d="M240,780 Q260,800 270,830" stroke="#8B5A2B" stroke-width="1.5" fill="none" opacity="0.3" filter="url(#skinSmooth)" />
                    <path d="M250,760 Q270,780 280,810" stroke="#8B5A2B" stroke-width="1.5" fill="none" opacity="0.3" filter="url(#skinSmooth)" />

                    <!-- THUMB GROUP -->
                    <g id="thumb">
                        <!-- Cast Shadow: Thumb onto Screen -->
                        <!-- Critical for depth -->
                        <ellipse cx="330" cy="450" rx="20" ry="70" fill="#000" opacity="0.6" filter="url(#blurContact)" transform="rotate(-10, 330, 450)" />

                        <!-- Thumb Base (Proximal) -->
                        <path d="M250,750 C280,700 300,650 300,600 C300,550 280,500 280,480 C260,480 240,550 230,650 Z" fill="url(#skinBase)" />
                        
                        <!-- Thumb Tip (Distal) -->
                        <path d="M280,480 C300,450 310,420 310,380 C310,350 290,350 280,380 C270,420 260,450 280,480 Z" fill="url(#skinBase)" />

                        <!-- Rim Light on Thumb Tip -->
                        <path d="M280,480 C300,450 310,420 310,380" stroke="url(#skinRim)" stroke-width="3" fill="none" />

                        <!-- IP Joint (Knuckle) -->
                        <path d="M275,475 Q285,485 295,470" stroke="#8B5A2B" stroke-width="3" fill="none" stroke-linecap="round" />
                        <!-- Joint Highlight -->
                        <path d="M280,482 Q285,485 290,475" stroke="#EAC0A6" stroke-width="1.5" fill="none" opacity="0.5" />

                        <!-- Nail Bed -->
                        <path d="M295,390 Q305,380 300,360 Q290,360 285,390 Z" fill="#F5D0B5" opacity="0.9" />
                        <!-- Nail Highlight -->
                        <path d="M298,385 Q300,380 298,370" stroke="#fff" stroke-width="1" opacity="0.6" />
                        <!-- Cuticle -->
                        <path d="M288,392 Q295,395 300,390" stroke="#C68E68" stroke-width="1" fill="none" />

                        <!-- Contact Highlight (Skin pressing glass) -->
                        <path d="M285,420 Q300,430 305,450" stroke="#fff" stroke-width="1" opacity="0.4" filter="url(#blurContact)" />
                    </g>
                </g>

            </g>
        </svg>
    </main>

<script>
    // Interaction Logic: Parallax & Tilt
    document.addEventListener('DOMContentLoaded', () => {
        const svgElement = document.getElementById('artwork');
        const thumbGroup = document.getElementById('thumb');
        const fingersBack = document.getElementById('fingers-back');
        const deviceGroup = document.getElementById('device');
        
        // Config
        const sensitivity = 8; // Rotation intensity
        const parallaxFactor = 0.015; // Translation intensity

        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / window.innerWidth;
            const y = (window.innerHeight / 2 - e.pageY) / window.innerHeight;

            // 1. Device Tilt
            const rotateY = x * sensitivity; 
            const rotateX = -y * sensitivity;

            svgElement.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

            // 2. Parallax Depth Layers
            
            // Thumb (Front) moves most, opposite to mouse (closer)
            if(thumbGroup) {
                const moveX = -x * 40; 
                const moveY = -y * 40;
                thumbGroup.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }

            // Device (Middle) moves slightly
            if(deviceGroup) {
                const moveX = -x * 10;
                const moveY = -y * 10;
                deviceGroup.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }

            // Fingers (Back) moves least, same direction (further away)
            if(fingersBack) {
                const moveX = x * 15;
                const moveY = y * 15;
                fingersBack.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }
        });

        // Reset on leave
        document.addEventListener('mouseleave', () => {
            svgElement.style.transform = `rotateX(0deg) rotateY(0deg)`;
            if(thumbGroup) thumbGroup.style.transform = `translate(0px, 0px)`;
            if(fingersBack) fingersBack.style.transform = `translate(0px, 0px)`;
            if(deviceGroup) deviceGroup.style.transform = `translate(0px, 0px)`;
        });
    });
</script>
</body>
</html>
