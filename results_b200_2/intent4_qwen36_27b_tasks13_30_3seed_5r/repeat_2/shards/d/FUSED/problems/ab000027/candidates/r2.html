<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trifolium pratense | Field Study</title>
<style>
  :root {
    --bg-color: #F2F4EB; /* Warm, slightly yellowed paper */
    --ink-color: #2A332A;
    --accent-color: #8B3A3A; /* Dried ink red */
    --grid-color: #D0D4C5;
    
    /* Palette for Botanical Elements */
    --c-stem-dark: #2F4F2F;
    --c-stem-light: #557F55;
    --c-vein: #1E331E;
    --c-leaf-base: #5A8F5A;
    --c-leaf-light: #88B888;
    --c-leaf-shadow: #3A6F3A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-color);
    color: var(--ink-color);
    font-family: 'Courier New', Courier, monospace; /* Field note font */
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  /* Paper Grain Texture */
  .texture-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    mix-blend-mode: multiply;
  }

  .specimen-frame {
    position: relative;
    width: 85vmin;
    height: 85vmin;
    max-width: 900px;
    max-height: 900px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1;
  }

  /* Typography & Annotations */
  .annotation {
    position: absolute;
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--ink-color);
    opacity: 0.85;
    pointer-events: none;
    line-height: 1.3;
    z-index: 10;
  }

  /* Main Title Anchor - Bottom Center */
  .title-block {
    position: absolute;
    bottom: 5%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
  }
  
  .title-block h1 {
    font-family: 'Georgia', serif; /* Scientific Latin */
    font-size: 1.6rem;
    font-weight: 400;
    font-style: italic;
    line-height: 1;
    margin-bottom: 0.4rem;
    letter-spacing: 0.02em;
  }
  
  .title-block h2 {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: #555;
    border-top: 1px solid var(--ink-color);
    padding-top: 0.4rem;
    display: inline-block;
  }

  .coords {
    font-size: 0.6rem;
    color: #777;
    margin-top: 6px;
    display: block;
    opacity: 0.7;
  }

  /* Top Right Metadata */
  .meta-block {
    position: absolute;
    top: 5%;
    right: 5%;
    text-align: right;
    font-size: 0.7rem;
    line-height: 1.4;
    color: #666;
  }

  /* SVG Styling */
  svg.clover-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    /* Subtle organic wobble animation */
    animation: breathe 8s ease-in-out infinite alternate;
  }

  @keyframes breathe {
    0% { transform: scale(1) rotate(0deg); }
    100% { transform: scale(1.01) rotate(0.2deg); }
  }

  /* Leaflet interaction */
  .leaflet {
    transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
  }

</style>
</head>
<body>

  <div class="texture-overlay"></div>

  <div class="specimen-frame">
    
    <!-- UI Elements -->
    <div class="meta-block">
      <strong>Fig. 1</strong><br>
      Specimen A-49<br>
      <span style="opacity:0.6">Collected: 14.06.2023</span>
    </div>

    <div class="title-block">
      <h1>Trifolium pratense</h1>
      <h2>Leguminosae</h2>
      <span class="coords">LAT 45.4211 N &nbsp; LON 75.6978 W &nbsp; | &nbsp; ALT 120m</span>
    </div>

    <!-- The Specimen -->
    <svg class="clover-svg" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 
          Filter: "Hand-drawn" Ink Bleed 
          Combines a slight blur with a displacement map to make lines look like ink on paper 
        -->
        <filter id="ink-bleed" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G" result="displaced" />
          <feGaussianBlur in="displaced" stdDeviation="0.3" result="blurred" />
          <feMerge>
            <feMergeNode in="blurred"/>
          </feMerge>
        </filter>

        <!-- Filter: Depth Shadow for Leaves -->
        <filter id="leaf-shadow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
          <feOffset dx="4" dy="8" result="offsetblur"/>
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.12"/>
          </feComponentTransfer>
          <feMerge> 
            <feMergeNode/>
            <feMergeNode in="SourceGraphic"/> 
          </feMerge>
        </filter>

        <!-- Complex Leaflet Shape: Cordate + Serration -->
        <g id="organic-leaflet">
          <!-- 
            Path Breakdown:
            1. Base at 0,0.
            2. Curves up to a deep cleft (heart shape).
            3. Right lobe with jagged, organic serrations (C commands).
            4. Bottom tip with slight asymmetry.
            5. Left lobe with jagged serrations.
          -->
          <path d="M 0,0 
                   C -5,-20 -15,-35 -15,-40 
                   C -40,-70 -80,-75 -110,-50 
                   C -115,-45 -110,-35 -105,-35 
                   C -100,-45 -90,-40 -85,-45 
                   C -70,-60 -30,-50 -20,-30 
                   C -25,-10 -20,10 -25,30 
                   C -35,60 -45,90 -25,125 
                   C -10,145 0,150 0,155 
                   C 10,150 20,145 35,125 
                   C 55,90 45,60 35,30 
                   C 30,10 25,-10 20,-30 
                   C 30,-50 70,-60 85,-45 
                   C 90,-40 100,-45 105,-35 
                   C 110,-35 115,-45 110,-50 
                   C 80,-75 40,-70 15,-40 
                   C 15,-35 5,-20 0,0 Z" 
                fill="url(#leafGrad)" 
                stroke="var(--c-vein)" 
                stroke-width="1.5"
                stroke-linejoin="round" />
          
          <!-- Inner Color Variation / Wash -->
          <path d="M 0,10 C -10,-10 -20,-20 -20,-30 C -40,-50 -70,-55 -90,-35 C -95,-30 -90,-20 -85,-20 C -75,-30 -65,-25 -60,-30 C -45,-45 -15,-40 -10,-20 C -15,0 -10,20 -15,40 C -25,65 -35,90 -20,115 C -10,130 0,135 0,140 C 10,135 20,130 30,115 C 45,90 35,65 25,40 C 20,20 15,0 10,-20 C 15,-40 45,-45 60,-30 C 65,-25 75,-30 85,-20 C 90,-20 95,-30 90,-35 C 70,-55 40,-50 20,-30 C 20,-20 10,-10 0,10 Z"
                fill="var(--c-leaf-light)" opacity="0.3" stroke="none" />

          <!-- Complex Branching Veins (Pinnate) -->
          <g stroke="var(--c-vein)" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <!-- Midrib -->
            <path d="M 0,5 Q 2,80 0,148" stroke-width="2" opacity="0.6" />
            
            <!-- Primary Veins (Left) -->
            <path d="M -1,25 Q -30,35 -60,55" stroke-width="1.5" opacity="0.5" />
            <path d="M -2,50 Q -40,70 -70,90" stroke-width="1.5" opacity="0.5" />
            <path d="M -1,75 Q -25,95 -45,115" stroke-width="1.2" opacity="0.5" />
            <path d="M 0,100 Q -10,115 -20,130" stroke-width="1" opacity="0.5" />

            <!-- Primary Veins (Right) -->
            <path d="M 1,25 Q 30,30 60,50" stroke-width="1.5" opacity="0.5" />
            <path d="M 2,50 Q 40,65 70,85" stroke-width="1.5" opacity="0.5" />
            <path d="M 1,75 Q 25,90 45,110" stroke-width="1.2" opacity="0.5" />
            <path d="M 0,100 Q 10,115 20,130" stroke-width="1" opacity="0.5" />

            <!-- Secondary Veins (The Mesh) -->
            <path d="M -30,40 Q -40,35 -50,40" stroke-width="0.8" opacity="0.3" />
            <path d="M -50,60 Q -60,55 -70,60" stroke-width="0.8" opacity="0.3" />
            <path d="M -35,80 Q -45,75 -55,80" stroke-width="0.8" opacity="0.3" />
            
            <path d="M 30,35 Q 40,30 50,35" stroke-width="0.8" opacity="0.3" />
            <path d="M 50,55 Q 60,50 70,55" stroke-width="0.8" opacity="0.3" />
            <path d="M 35,75 Q 45,70 55,75" stroke-width="0.8" opacity="0.3" />
          </g>
        </g>

        <!-- Gradients -->
        <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:var(--c-leaf-light);stop-opacity:1" />
          <stop offset="50%" style="stop-color:var(--c-leaf-base);stop-opacity:1" />
          <stop offset="100%" style="stop-color:var(--c-leaf-shadow);stop-opacity:1" />
        </linearGradient>

        <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" style="stop-color:var(--c-stem-dark);stop-opacity:1" />
          <stop offset="100%" style="stop-color:var(--c-stem-light);stop-opacity:1" />
        </linearGradient>

      </defs>

      <!-- Callout Lines (Drawn first to sit behind) -->
      <g stroke="#555" stroke-width="1" fill="none" opacity="0.7">
        <!-- Serration Callout -->
        <path d="M 160,120 Q 120,100 100,80" />
        <circle cx="160" cy="120" r="2" fill="#555" stroke="none"/>
        
        <!-- Venation Callout -->
        <path d="M 520,160 Q 560,150 580,130" />
        <circle cx="520" cy="160" r="2" fill="#555" stroke="none"/>
      </g>

      <!-- Stem Group -->
      <g id="stem-group" filter="url(#ink-bleed)">
        <!-- Main Stem (Organic S-Curve) -->
        <!-- Note: 'd' path is slightly jittered manually to look hand-drawn -->
        <path d="M 400,760 
                 C 398,620 405,480 395,320 
                 C 392,260 408,220 400,180" 
              fill="none" 
              stroke="url(#stemGrad)" 
              stroke-width="11" 
              stroke-linecap="round" />
        
        <!-- Petioles -->
        <!-- Left Petiole -->
        <path d="M 400,180 Q 340,170 275,145" 
              fill="none" stroke="url(#stemGrad)" stroke-width="7" stroke-linecap="round"/>
        <!-- Right Petiole -->
        <path d="M 400,180 Q 460,170 525,145" 
              fill="none" stroke="url(#stemGrad)" stroke-width="7" stroke-linecap="round"/>
      </g>

      <!-- Leaves Group -->
      <g id="leaves-group" filter="url(#leaf-shadow)">
        
        <!-- Left Leaf (Slightly lower, rotated) -->
        <g transform="translate(275, 145) rotate(-40) scale(0.9)">
          <use href="#organic-leaflet" class="leaflet" data-depth="0.6" />
        </g>

        <!-- Right Leaf (Slightly higher, rotated) -->
        <g transform="translate(525, 145) rotate(45) scale(0.9)">
          <use href="#organic-leaflet" class="leaflet" data-depth="0.6" />
        </g>

        <!-- Top Leaf (Dominant, Center) -->
        <g transform="translate(400, 180) rotate(-1) scale(1.1)">
          <use href="#organic-leaflet" class="leaflet" data-depth="1.0" />
        </g>

      </g>

      <!-- Annotation Text (SVG Text for layout stability) -->
      <g fill="#444" font-family="'Courier New', monospace" font-size="10" letter-spacing="0.1em" opacity="0.8">
        <text x="85" y="75">Marginal Serration</text>
        <text x="590" y="125">Pinnate Venation</text>
      </g>

    </svg>
  </div>

  <script>
    // Refined Parallax Effect
    // Calculates mouse position relative to center and applies subtle translation
    // to the SVG groups to create a sense of depth.
    document.addEventListener('mousemove', (e) => {
      const x = (window.innerWidth - e.pageX * 2) / 150;
      const y = (window.innerHeight - e.pageY * 2) / 150;

      const svg = document.querySelector('.clover-svg');
      const leaves = document.querySelectorAll('.leaflet');
      
      // Move the entire stem/stem-group slightly less than leaves
      svg.style.transform = `translate(${x * 0.3}px, ${y * 0.3}px)`;

      // Parallax for individual leaves
      leaves.forEach((leaf) => {
        const depth = parseFloat(leaf.getAttribute('data-depth')) || 0;
        // Move leaves more than the stem to simulate them being closer to the viewer
        leaf.style.transform = `translate(${x * depth}px, ${y * depth}px)`;
      });
    });
  </script>
</body>
</html>
