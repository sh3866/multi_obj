<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trifolium pratense | Botanical Study</title>
<style>
  :root {
    --bg-paper: #F0F2E8;
    --ink-primary: #2C3327;
    --ink-faint: #6B7365;
    --accent-line: #8A9482;
    --font-serif: 'Georgia', 'Times New Roman', serif;
    --font-mono: 'Courier New', Courier, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-paper);
    color: var(--ink-primary);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: var(--font-serif);
  }

  /* Paper Texture - Generated via SVG Noise */
  .texture-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.4'/%3E%3C/svg%3E");
  }

  /* Layout Container */
  .canvas-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 1200px;
    max-height: 1200px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1;
  }

  /* Typography & Annotations */
  .annotation-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  /* Title Hierarchy */
  .title-block {
    position: absolute;
    top: 5%;
    left: 5%;
  }

  .species-name {
    font-size: 2.5rem;
    font-style: italic;
    font-weight: 400;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--ink-primary);
    margin-bottom: 0.25rem;
  }

  .family-name {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--ink-faint);
    border-bottom: 2px solid var(--ink-primary);
    display: inline-block;
    padding-bottom: 4px;
    margin-bottom: 1rem;
  }

  /* Metadata Block */
  .meta-block {
    position: absolute;
    top: 5%;
    right: 5%;
    text-align: right;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    line-height: 1.5;
    color: var(--ink-faint);
  }

  .meta-block strong {
    color: var(--ink-primary);
    font-weight: 700;
  }

  /* Field Notes */
  .field-notes {
    position: absolute;
    bottom: 5%;
    left: 5%;
    max-width: 300px;
    font-family: var(--font-mono);
    font-size: 0.65rem;
    line-height: 1.6;
    color: var(--ink-faint);
    border-left: 1px solid var(--accent-line);
    padding-left: 1rem;
  }

  /* SVG Styling */
  svg.specimen-svg {
    width: 80%;
    height: 80%;
    overflow: visible;
    /* Smooth entry animation */
    animation: float 6s ease-in-out infinite alternate;
  }

  @keyframes float {
    0% { transform: translateY(0px); }
    100% { transform: translateY(-10px); }
  }

  /* Interactive Hover for Details */
  .detail-group:hover path {
    filter: brightness(1.1);
    transition: filter 0.3s ease;
  }

</style>
</head>
<body>

  <div class="texture-overlay"></div>

  <div class="canvas-container">
    
    <!-- Typography Overlay -->
    <div class="annotation-layer">
      
      <div class="title-block">
        <h1 class="species-name">Trifolium pratense</h1>
        <div class="family-name">Fabaceae</div>
      </div>

      <div class="meta-block">
        <strong>FIG. A-04</strong><br>
        COLLECTED: 12.06.2023<br>
        LOC: 45.4211° N, 75.6978° W<br>
        ALT: 120m ASL
      </div>

      <div class="field-notes">
        <strong>NOTES:</strong><br>
        Specimen exhibits distinct cordate leaflets with serrated margins. Venation is pinnate with prominent midrib. Observed in partial shade, soil pH approx 6.8.
      </div>

    </div>

    <!-- The Specimen -->
    <svg class="specimen-svg" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 
          1. Advanced Leaf Gradient 
          Simulates light hitting a curved surface. 
          Radial for organic feel, offset to top-left.
        -->
        <radialGradient id="leafSurface" cx="40%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#98C985" /> <!-- Highlight -->
          <stop offset="45%" stop-color="#5A8548" /> <!-- Base Green -->
          <stop offset="85%" stop-color="#355630" /> <!-- Shadow -->
          <stop offset="100%" stop-color="#243C21" /> <!-- Deep Shadow -->
        </radialGradient>

        <!-- 
          2. Serration Pattern 
          A zig-zag path used to stroke the leaf outline to create teeth.
        -->
        <pattern id="serrationPattern" x="0" y="0" width="8" height="4" patternUnits="userSpaceOnUse">
          <path d="M 0 4 L 4 0 L 8 4" stroke="#243C21" stroke-width="1.5" fill="none" opacity="0.3"/>
        </pattern>

        <!-- 
          3. Drop Shadow for Depth 
        -->
        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
          <feOffset dx="5" dy="10" result="offsetblur"/>
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.15"/>
          </feComponentTransfer>
          <feMerge> 
            <feMergeNode/>
            <feMergeNode in="SourceGraphic"/> 
          </feMerge>
        </filter>

        <!-- 
          4. The Heart Shape (Cordate) 
          Carefully plotted bezier curves to ensure a deep sinus at the base.
        -->
        <g id="cordate-leaflet">
          <!-- Main Body -->
          <path d="M 0,0 
                   C -10,-25 -30,-40 -40,-50 
                   C -70,-80 -100,-70 -110,-40 
                   C -120,-10 -90,20 -80,40 
                   C -70,80 -50,110 -30,120 
                   C -15,130 0,135 0,135 
                   C 15,135 30,120 50,90 
                   C 70,60 80,30 70,0 
                   C 60,-30 30,-50 0,0 Z" 
                fill="url(#leafSurface)" />
          
          <!-- Serrated Edge Overlay (Visual trick: stroke the path with a zigzag pattern) -->
          <!-- We duplicate the path but stroke it with a very specific jagged pattern to simulate teeth -->
          <path d="M 0,0 
                   C -10,-25 -30,-40 -40,-50 
                   C -70,-80 -100,-70 -110,-40 
                   C -120,-10 -90,20 -80,40 
                   C -70,80 -50,110 -30,120 
                   C -15,130 0,135 0,135 
                   C 15,135 30,120 50,90 
                   C 70,60 80,30 70,0 
                   C 60,-30 30,-50 0,0 Z" 
                fill="none" stroke="url(#serrationPattern)" stroke-width="4" opacity="0.8" />

          <!-- 
             5. Complex Venation 
             Pinnate structure with secondary branching.
          -->
          <g stroke="#1E3320" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
            <!-- Midrib -->
            <path d="M 0,5 Q 5,70 0,130" stroke-width="2" />
            
            <!-- Primary Lateral Veins -->
            <path d="M 0,30 Q -30,30 -60,50" stroke-width="1.2" />
            <path d="M 2,60 Q -25,70 -50,90" stroke-width="1.2" />
            <path d="M 1,90 Q -15,100 -30,115" stroke-width="1" />
            
            <path d="M 0,30 Q 30,30 60,50" stroke-width="1.2" />
            <path d="M -2,60 Q 25,70 50,90" stroke-width="1.2" />
            <path d="M -1,90 Q 15,100 30,115" stroke-width="1" />

            <!-- Secondary Veins (The Mesh) -->
            <g stroke-width="0.5" opacity="0.7">
               <!-- Left Side Mesh -->
               <path d="M -15,40 Q -20,35 -30,45" />
               <path d="M -30,55 Q -40,50 -50,60" />
               <path d="M -20,75 Q -25,80 -40,85" />
               <path d="M -10,105 Q -15,110 -25,115" />
               
               <!-- Right Side Mesh -->
               <path d="M 15,40 Q 20,35 30,45" />
               <path d="M 30,55 Q 40,50 50,60" />
               <path d="M 20,75 Q 25,80 40,85" />
               <path d="M 10,105 Q 15,110 25,115" />
            </g>
          </g>
        </g>
      </defs>

      <!-- 
        Stem Construction 
        Using a filled path for better gradient control than a stroked line.
      -->
      <g id="stem-group" filter="url(#dropShadow)">
        <!-- Main Stem -->
        <path d="M 395,700 
                 C 390,500 410,400 395,280 
                 C 390,220 405,180 400,150" 
              fill="none" 
              stroke="#4A6B42" 
              stroke-width="12" 
              stroke-linecap="round" />
              
        <!-- Petiole Left -->
        <path d="M 398,150 Q 350,140 300,110" 
              fill="none" stroke="#4A6B42" stroke-width="8" stroke-linecap="round"/>
              
        <!-- Petiole Right -->
        <path d="M 402,150 Q 450,140 500,110" 
              fill="none" stroke="#4A6B42" stroke-width="8" stroke-linecap="round"/>
      </g>

      <!-- 
        Leaves Group 
        Layered: Back leaves first, then front leaf.
      -->
      <g id="leaves-group">
        
        <!-- Left Leaflet (Slightly darker, rotated) -->
        <g transform="translate(300, 110) rotate(-45) scale(0.9)">
          <use href="#cordate-leaflet" filter="url(#dropShadow)" />
        </g>

        <!-- Right Leaflet (Slightly darker, rotated) -->
        <g transform="translate(500, 110) rotate(45) scale(0.9)">
          <use href="#cordate-leaflet" filter="url(#dropShadow)" />
        </g>

        <!-- Top Leaflet (Dominant, Center, Full Light) -->
        <g transform="translate(400, 150) rotate(-5) scale(1.05)">
          <use href="#cordate-leaflet" filter="url(#dropShadow)" />
        </g>

      </g>

      <!-- Scientific Callouts -->
      <!-- Drawn with precise lines and minimal circles -->
      <g stroke="#8A9482" stroke-width="1" fill="none">
        
        <!-- Callout 1: Serration -->
        <path d="M 240,100 L 180,100 L 180,80" />
        <circle cx="240" cy="100" r="1.5" fill="#8A9482" stroke="none"/>
        <text x="185" y="75" fill="#6B7365" font-family="'Courier New', monospace" font-size="10" letter-spacing="0.05em">SERRATED MARGIN</text>

        <!-- Callout 2: Venation -->
        <path d="M 420,160 L 480,160 L 480,130" />
        <circle cx="420" cy="160" r="1.5" fill="#8A9482" stroke="none"/>
        <text x="485" y="125" fill="#6B7365" font-family="'Courier New', monospace" font-size="10" letter-spacing="0.05em">PINNATE VEINS</text>

        <!-- Callout 3: Cordate Base -->
        <path d="M 400,150 L 460,150 L 460,170" />
        <circle cx="400" cy="150" r="1.5" fill="#8A9482" stroke="none"/>
        <text x="465" y="175" fill="#6B7365" font-family="'Courier New', monospace" font-size="10" letter-spacing="0.05em">CORDATE BASE</text>

      </g>

    </svg>
  </div>

</body>
</html>
