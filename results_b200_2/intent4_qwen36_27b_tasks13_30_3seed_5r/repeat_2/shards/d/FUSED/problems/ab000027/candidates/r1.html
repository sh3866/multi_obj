<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trifolium pratense | Botanical Study</title>
<style>
  :root {
    --bg-color: #F4F5F0;
    --ink-color: #2C332C;
    --accent-color: #8B4545;
    --grid-color: #E0E2D9;
    
    /* Refined Palette */
    --c-stem-dark: #3A5F3A;
    --c-stem-light: #6B8E6B;
    --c-vein: #2A452A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-color);
    color: var(--ink-color);
    font-family: 'Georgia', 'Times New Roman', serif;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* Subtle paper texture */
  .texture-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      radial-gradient(var(--grid-color) 1px, transparent 1px),
      radial-gradient(var(--grid-color) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: 0 0, 20px 20px;
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
  }

  .specimen-frame {
    position: relative;
    width: 90vmin;
    height: 90vmin;
    max-width: 900px;
    max-height: 900px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1;
  }

  /* Typography */
  .annotation {
    position: absolute;
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    color: var(--ink-color);
    opacity: 0.7;
    pointer-events: none;
    line-height: 1.4;
  }

  .annotation.top-left { top: 8%; left: 8%; text-align: left; }
  .annotation.bottom-right { bottom: 8%; right: 8%; text-align: right; font-style: italic; }
  
  .title-block {
    position: absolute;
    bottom: 12%;
    left: 8%;
  }
  
  .title-block h1 {
    font-size: 2rem;
    font-weight: normal;
    line-height: 1;
    margin-bottom: 0.2rem;
    letter-spacing: -0.02em;
  }
  
  .title-block h2 {
    font-size: 0.8rem;
    font-weight: normal;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: #555;
  }

  .coords {
    font-family: 'Courier New', monospace;
    font-size: 0.65rem;
    color: #777;
    margin-top: 8px;
    display: block;
  }

  /* SVG Styling */
  svg.clover-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    transform-origin: center bottom;
    will-change: transform;
  }

  /* Animation for the parallax hover */
  .leaflet {
    transition: transform 0.3s ease-out;
  }

</style>
</head>
<body>

  <div class="texture-overlay"></div>

  <div class="specimen-frame">
    
    <!-- UI Elements -->
    <div class="annotation top-left">
      <strong>Fig. 1</strong><br>
      Trifolium pratense<br>
      <span style="font-size: 0.8em; color: #666;">Red Clover</span>
    </div>

    <div class="title-block">
      <h1>Trifolium</h1>
      <h2>Leguminosae</h2>
      <span class="coords">LAT 45.4211 N &nbsp; LON 75.6978 W</span>
    </div>

    <div class="annotation bottom-right">
      "The humble clover, rich in nitrogen,<br>
      sustains the soil it rests upon."
    </div>

    <!-- The Specimen -->
    <svg class="clover-svg" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Filter for depth -->
        <filter id="leaf-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
          <feOffset dx="3" dy="6" result="offsetblur"/>
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.15"/>
          </feComponentTransfer>
          <feMerge> 
            <feMergeNode/>
            <feMergeNode in="SourceGraphic"/> 
          </feMerge>
        </filter>

        <!-- Complex Leaf Gradient -->
        <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#A8CFA8;stop-opacity:1" /> <!-- Light top -->
          <stop offset="40%" style="stop-color:#6B9B6B;stop-opacity:1" /> <!-- Mid green -->
          <stop offset="100%" style="stop-color:#3A5F3A;stop-opacity:1" /> <!-- Dark bottom -->
        </linearGradient>

        <!-- Stem Gradient -->
        <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" style="stop-color:#2A452A;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#5C8A5C;stop-opacity:1" />
        </linearGradient>

        <!-- Organic Leaflet Definition -->
        <g id="organic-leaflet">
          <!-- 
            Path Construction:
            - S-curve Serrations: Using C commands to create smooth, organic notches.
            - Asymmetry: Coordinates are slightly offset (e.g., -105 vs -102).
          -->
          <path d="M 0,0 
                   C -10,-20 -15,-40 -20,-40 
                   C -35,-65 -60,-80 -90,-75 
                   C -100,-72 -105,-60 -102,-55 
                   C -95,-50 -80,-55 -75,-60 
                   C -60,-70 -30,-65 -15,-45 
                   C -20,-25 -25,0 -30,20 
                   C -40,50 -50,80 -30,110 
                   C -15,130 0,125 0,130 
                   C 15,125 30,130 45,110 
                   C 65,75 60,30 45,10 
                   C 35,-15 25,-30 0,0 Z" 
                fill="url(#leafGrad)" 
                stroke="none" />
          
          <!-- Vein Structure -->
          <g stroke="#2A452A" stroke-width="1.2" fill="none" opacity="0.4" stroke-linecap="round" stroke-linejoin="round">
            <!-- Central Midrib -->
            <path d="M 0,0 Q 5,60 0,125" stroke-width="1.5" />
            
            <!-- Left Veins (Pinnate) -->
            <path d="M -2,20 Q -30,30 -50,45" />
            <path d="M -3,40 Q -40,55 -60,70" />
            <path d="M -2,60 Q -30,80 -50,95" />
            <path d="M -1,80 Q -20,100 -35,110" />
            
            <!-- Right Veins -->
            <path d="M 2,20 Q 30,25 50,40" />
            <path d="M 3,40 Q 40,50 55,65" />
            <path d="M 2,60 Q 30,75 45,90" />
            <path d="M 1,80 Q 20,100 35,110" />

            <!-- Fine Veins (Sub-mesh) -->
            <path d="M -35,35 Q -45,35 -50,45" stroke-width="0.5" opacity="0.5"/>
            <path d="M -40,60 Q -50,60 -60,70" stroke-width="0.5" opacity="0.5"/>
            <path d="M 35,30 Q 45,30 50,40" stroke-width="0.5" opacity="0.5"/>
            <path d="M 40,55 Q 50,55 55,65" stroke-width="0.5" opacity="0.5"/>
          </g>
        </g>
      </defs>

      <!-- Stem Group -->
      <g id="stem-group">
        <!-- Main Stem (Natural S-Curve) -->
        <path d="M 400,750 
                 C 400,600 380,450 400,300 
                 C 410,250 410,220 400,180" 
              fill="none" 
              stroke="url(#stemGrad)" 
              stroke-width="10" 
              stroke-linecap="round" />
        
        <!-- Petioles -->
        <!-- Left Petiole -->
        <path d="M 400,180 Q 350,160 280,140" 
              fill="none" stroke="url(#stemGrad)" stroke-width="6" stroke-linecap="round"/>
        <!-- Right Petiole -->
        <path d="M 400,180 Q 450,160 520,140" 
              fill="none" stroke="url(#stemGrad)" stroke-width="6" stroke-linecap="round"/>
      </g>

      <!-- Leaves Group -->
      <!-- 
         Using individual transforms for organic placement.
         Rotations are not perfect integers to simulate nature.
      -->
      <g id="leaves-group" filter="url(#leaf-shadow)">
        
        <!-- Left Leaf -->
        <g transform="translate(280, 140) rotate(-35) scale(0.95)">
          <use href="#organic-leaflet" class="leaflet" data-depth="0.5" />
        </g>

        <!-- Right Leaf -->
        <g transform="translate(520, 140) rotate(42) scale(0.92)">
          <use href="#organic-leaflet" class="leaflet" data-depth="0.5" />
        </g>

        <!-- Top Leaf (Dominant) -->
        <g transform="translate(400, 180) rotate(-2) scale(1.1)">
          <use href="#organic-leaflet" class="leaflet" data-depth="1.2" />
        </g>

      </g>

      <!-- Refined Annotations -->
      <g stroke="#666" stroke-width="0.5" fill="none" opacity="0.6">
        
        <!-- Serration Callout -->
        <path d="M 210,110 Q 180,100 160,80" />
        <circle cx="210" cy="110" r="1.5" fill="#666" stroke="none"/>
        <text x="155" y="85" font-family="'Courier New', monospace" font-size="10" fill="#666" stroke="none" letter-spacing="0.05em">Marginal Serration</text>
        
        <!-- Venation Callout -->
        <path d="M 480,140 Q 520,130 550,110" />
        <circle cx="480" cy="140" r="1.5" fill="#666" stroke="none"/>
        <text x="555" y="115" font-family="'Courier New', monospace" font-size="10" fill="#666" stroke="none" letter-spacing="0.05em">Pinnate Venation</text>

      </g>

    </svg>
  </div>

  <script>
    // Enhanced Parallax Effect
    // Moves the leaves slightly differently based on mouse position to create depth
    document.addEventListener('mousemove', (e) => {
      const x = (window.innerWidth - e.pageX * 2) / 120; // Reduced sensitivity for elegance
      const y = (window.innerHeight - e.pageY * 2) / 120;

      const svg = document.querySelector('.clover-svg');
      const leaves = document.querySelectorAll('.leaflet');
      
      // Subtle movement for the whole SVG
      svg.style.transform = `translate(${x * 0.5}px, ${y * 0.5}px)`;

      // Parallax for individual leaves
      leaves.forEach((leaf) => {
        const depth = parseFloat(leaf.getAttribute('data-depth')) || 0;
        // Apply transform relative to the leaf's local center
        // Note: Since we are inside a transformed group, we need to be careful.
        // For this demo, we apply a translate to the <use> element itself.
        leaf.style.transform = `translate(${x * depth}px, ${y * depth}px)`;
      });
    });
  </script>
</body>
</html>
