<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE EDGE // Descent</title>
<style>
  :root {
    --c-sky-deep: #0f172a;
    --c-sky-mid: #4338ca;
    --c-sky-horizon: #f59e0b;
    --c-sky-glow: #fef08a;
    
    --c-rock-shadow: #020617;
    --c-rock-base: #1e293b;
    --c-rock-face: #334155;
    --c-rock-lit: #475569;
    
    --c-canvas: #ef4444;
    --c-canvas-dark: #991b1b;
    --c-line: rgba(255, 255, 255, 0.8);
    
    --font-display: 'Impact', 'Arial Black', sans-serif;
    --font-ui: 'Courier New', Courier, monospace;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--c-sky-deep);
    font-family: var(--font-ui);
  }

  /* Main Canvas Container */
  #canvas {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* Background Sky Gradient (CSS fallback + SVG source) */
  .bg-sky {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, var(--c-sky-deep) 0%, var(--c-sky-mid) 40%, var(--c-sky-horizon) 90%, var(--c-sky-glow) 100%);
    z-index: 0;
  }

  /* SVG Scene Layer */
  #scene-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* UI Overlay Layer */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 3rem;
    box-sizing: border-box;
    color: white;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  /* Typography & HUD Elements */
  .hud-text {
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.9;
  }

  /* Top Left: Title */
  .header-title {
    font-family: var(--font-display);
    font-size: 4rem;
    line-height: 0.85;
    letter-spacing: -0.02em;
    margin: 0;
    position: relative;
  }
  
  .header-title::after {
    content: '';
    display: block;
    width: 60px;
    height: 4px;
    background: var(--c-canvas);
    margin-top: 1rem;
  }

  /* Top Right: Telemetry */
  .telemetry-block {
    text-align: right;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    align-items: flex-end;
  }
  
  .telemetry-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  
  .telemetry-val {
    font-weight: bold;
    color: var(--c-sky-horizon);
  }

  /* Bottom Left: Narrative */
  .narrative-block {
    max-width: 350px;
    position: relative;
  }

  .narrative-block::before {
    content: '';
    position: absolute;
    left: -1rem;
    top: 0;
    bottom: 0;
    width: 2px;
    background: linear-gradient(to bottom, var(--c-canvas), transparent);
  }

  .narrative-desc {
    font-size: 0.9rem;
    line-height: 1.6;
    margin-top: 1rem;
    opacity: 0.8;
  }

  /* Bottom Right: Status Indicators */
  .status-block {
    display: flex;
    gap: 2rem;
    align-items: flex-end;
  }
  
  .indicator {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    align-items: flex-end;
  }

  .bar-graph {
    display: flex;
    gap: 2px;
    height: 20px;
    align-items: flex-end;
  }
  
  .bar {
    width: 4px;
    background: white;
    opacity: 0.5;
  }

  /* Animations */
  @keyframes wind-drift {
    0% { transform: translateY(0) skewY(5deg); }
    50% { transform: translateY(-20px) skewY(5deg); }
    100% { transform: translateY(0) skewY(5deg); }
  }

  @keyframes sway {
    0% { transform: rotate(0deg) translateX(0); }
    50% { transform: rotate(2deg) translateX(10px); }
    100% { transform: rotate(0deg) translateX(0); }
  }

  .wind-lines {
    animation: wind-drift 1.5s linear infinite;
  }

  .subject-group {
    transform-origin: center;
    animation: sway 6s ease-in-out infinite;
  }

</style>
</head>
<body>

<div id="canvas">
  <div class="bg-sky"></div>

  <!-- The Scene -->
  <svg id="scene-svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Filters -->
      <filter id="blur-far">
        <feGaussianBlur stdDeviation="6" />
      </filter>
      <filter id="blur-mid">
        <feGaussianBlur stdDeviation="2" />
      </filter>
      <filter id="glow">
        <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
        <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <!-- Gradients -->
      <linearGradient id="cliff-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:var(--c-rock-face)" />
        <stop offset="40%" style="stop-color:var(--c-rock-base)" />
        <stop offset="100%" style="stop-color:var(--c-rock-shadow)" />
      </linearGradient>
      
      <linearGradient id="canopy-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#fca5a5" />
        <stop offset="50%" style="stop-color:#ef4444" />
        <stop offset="100%" style="stop-color:#7f1d1d" />
      </linearGradient>

      <pattern id="noise" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
        <rect width="100" height="100" fill="none"/>
        <circle cx="10" cy="10" r="1" fill="black" opacity="0.2"/>
        <circle cx="50" cy="50" r="2" fill="black" opacity="0.1"/>
        <circle cx="80" cy="20" r="1" fill="black" opacity="0.2"/>
      </pattern>
    </defs>

    <!-- 1. Distant Landscape (Atmospheric Depth) -->
    <g id="distant-mountains" opacity="0.6" filter="url(#blur-far)">
      <path d="M0,800 L0,600 L150,550 L300,650 L450,500 L600,600 L750,450 L900,650 L1200,550 L1200,800 Z" fill="#0f172a" opacity="0.8" />
      <path d="M0,800 L0,650 L200,600 L400,700 L600,550 L800,680 L1000,500 L1200,600 L1200,800 Z" fill="#020617" opacity="0.9" />
    </g>

    <!-- 2. The Cliff (The Anchor - Right Side) -->
    <g id="cliff-group" transform="translate(0, 0)">
      <!-- Main Mass -->
      <path d="M800,-50 L1250,-50 L1250,850 L900,850 L850,700 L950,550 L800,400 L920,250 L850,100 Z" 
            fill="url(#cliff-grad)" />
      
      <!-- Noise Texture -->
      <path d="M800,-50 L1250,-50 L1250,850 L900,850 L850,700 L950,550 L800,400 L920,250 L850,100 Z" 
            fill="url(#noise)" style="mix-blend-mode: multiply;" />

      <!-- Strata / Rock Layers (Geological Weight) -->
      <g fill="none" stroke-width="4" opacity="0.6">
        <!-- Top Layer -->
        <path d="M850,100 L1250,100" stroke="#000" />
        <path d="M850,100 L860,110" stroke="white" stroke-width="2" />
        
        <!-- Middle Layer -->
        <path d="M800,400 L1250,400" stroke="#000" />
        <path d="M800,400 L810,410" stroke="white" stroke-width="2" />
        
        <!-- Lower Layer -->
        <path d="M850,700 L1250,700" stroke="#000" />
        <path d="M850,700 L860,710" stroke="white" stroke-width="2" />
      </g>

      <!-- Facet Highlights (3D feel) -->
      <polygon points="850,100 920,250 800,400" fill="rgba(255,255,255,0.05)" />
      <polygon points="950,550 900,850 1250,850 1250,550" fill="rgba(0,0,0,0.2)" />
    </g>

    <!-- 3. Wind / Motion Cues -->
    <g id="wind-lines" class="wind-lines" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.3">
      <line x1="100" y1="-100" x2="150" y2="900" />
      <line x1="300" y1="-200" x2="350" y2="800" />
      <line x1="500" y1="-50" x2="550" y2="850" />
      <line x1="700" y1="-150" x2="750" y2="750" />
      <line x1="900" y1="-100" x2="950" y2="900" />
      <line x1="1100" y1="-50" x2="1150" y2="800" />
    </g>

    <!-- 4. The Subject (Parachutist - Left Center) -->
    <g id="subject" class="subject-group" transform="translate(450, 350)">
      
      <!-- Harness Lines -->
      <g stroke="var(--c-line)" stroke-width="1.5" stroke-linecap="round">
        <!-- Left Lines -->
        <line x1="-160" y1="60" x2="-10" y2="220" />
        <line x1="-100" y1="90" x2="-10" y2="220" />
        <line x1="-40" y1="100" x2="-10" y2="220" />
        <!-- Right Lines -->
        <line x1="40" y1="100" x2="10" y2="220" />
        <line x1="100" y1="90" x2="10" y2="220" />
        <line x1="160" y1="60" x2="10" y2="220" />
      </g>

      <!-- The Human (Silhouette) -->
      <g transform="translate(0, 220)">
        <!-- Backpack -->
        <rect x="-15" y="-10" width="30" height="40" rx="5" fill="#000" />
        <!-- Body -->
        <path d="M-10,30 L10,30 L15,90 L-15,90 Z" fill="#000" />
        <!-- Head -->
        <circle cx="0" cy="15" r="10" fill="#000" />
        <!-- Arms (Reaching up slightly) -->
        <path d="M-10,30 Q-30,40 -40,20" stroke="#000" stroke-width="6" fill="none" stroke-linecap="round" />
        <path d="M10,30 Q30,40 40,20" stroke="#000" stroke-width="6" fill="none" stroke-linecap="round" />
        <!-- Legs -->
        <path d="M-10,90 L-20,140" stroke="#000" stroke-width="8" stroke-linecap="round" />
        <path d="M10,90 L20,140" stroke="#000" stroke-width="8" stroke-linecap="round" />
      </g>

      <!-- The Canopy (Inflated) -->
      <g transform="translate(0, 0)">
        <!-- Main Dome Shape -->
        <path d="M-220,60 Q-110,180 0,180 Q110,180 220,60 Q110,-40 0,-40 Q-110,-40 -220,60 Z" 
              fill="url(#canopy-grad)" filter="url(#glow)" />
        
        <!-- Ribs (Structure) -->
        <g stroke="#450a0a" stroke-width="1" opacity="0.5" fill="none">
          <path d="M0,-40 L0,180" />
          <path d="M-60,-20 L-30,180" />
          <path d="M60,-20 L30,180" />
          <path d="M-120,0 L-60,180" />
          <path d="M120,0 L60,180" />
          <path d="M-180,30 L-90,180" />
          <path d="M180,30 L90,180" />
        </g>
        
        <!-- Bottom Shadow -->
        <path d="M-220,60 Q0,160 220,60 Q0,120 -220,60" fill="#000" opacity="0.2" />
      </g>
    </g>

  </svg>

  <!-- UI Overlay -->
  <div class="ui-layer">
    
    <!-- Top Header -->
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
      <div>
        <h1 class="header-title">THE<br>EDGE</h1>
        <div class="hud-text" style="margin-top: 1rem;">Verticality Study // 05</div>
      </div>
      
      <div class="telemetry-block hud-text">
        <div class="telemetry-row">ALT <span class="telemetry-val">4,200m</span></div>
        <div class="telemetry-row">VEL <span class="telemetry-val">5.4 m/s</span></div>
        <div class="telemetry-row">WIND <span class="telemetry-val">18 km/h NW</span></div>
      </div>
    </div>

    <!-- Bottom Footer -->
    <div style="display: flex; justify-content: space-between; align-items: flex-end;">
      <div class="narrative-block">
        <div class="hud-text" style="color: var(--c-sky-horizon);">Mission Status: Safe Descent</div>
        <p class="narrative-desc">
          Suspended between geological time and gravity. 
          A study in atmospheric depth, structural tension, 
          and the physics of descent.
        </p>
      </div>

      <div class="status-block hud-text">
        <div class="indicator">
          <span>SIGNAL</span>
          <div class="bar-graph">
            <div class="bar" style="height: 10px;"></div>
            <div class="bar" style="height: 15px;"></div>
            <div class="bar" style="height: 20px;"></div>
            <div class="bar" style="height: 12px;"></div>
          </div>
        </div>
        <div class="indicator">
          <span>REC</span>
          <div style="width: 8px; height: 8px; background: #ef4444; border-radius: 50%; animation: pulse 1s infinite;"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  // Subtle Parallax Effect
  const canvas = document.getElementById('canvas');
  const cliff = document.getElementById('cliff-group');
  const subject = document.getElementById('subject');
  const wind = document.getElementById('wind-lines');
  const mountains = document.getElementById('distant-mountains');

  document.addEventListener('mousemove', (e) => {
    // Normalize mouse position from -1 to 1
    const x = (e.clientX / window.innerWidth - 0.5) * 2;
    const y = (e.clientY / window.innerHeight - 0.5) * 2;

    // Move elements at different speeds based on depth
    // Mountains (Far): Move least
    mountains.style.transform = `translate(${x * 10}px, ${y * 5}px)`;
    
    // Cliff (Mid): Move moderate
    cliff.style.transform = `translate(${x * 20}px, ${y * 10}px)`;
    
    // Wind (Foreground): Move fast
    wind.style.transform = `translate(${x * 40}px, ${y * 20}px)`;
    
    // Subject (Close): Move moderate but opposite to wind for tension
    subject.style.transform = `translate(${450 + x * 15}px, ${350 + y * 15}px)`;
  });

  // Add pulse animation to REC dot
  const styleSheet = document.createElement("style");
  styleSheet.innerText = `
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }
  `;
  document.head.appendChild(styleSheet);
</script>
</body>
</html>
