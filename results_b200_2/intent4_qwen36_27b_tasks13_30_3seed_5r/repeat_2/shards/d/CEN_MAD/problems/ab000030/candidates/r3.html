<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Hub // Emberia</title>
<style>
    :root {
        /* Palette: Deep Atmosphere & Warm Ember */
        --bg-deep: #0f0c29;
        --bg-mid: #302b63;
        --bg-shallow: #24243e;
        
        --surface-card: rgba(255, 255, 255, 0.03);
        --surface-card-hover: rgba(255, 255, 255, 0.06);
        --surface-highlight: rgba(255, 255, 255, 0.1);
        
        /* Warm Accents */
        --accent-primary: #ff9f43; /* Amber/Ember */
        --accent-primary-glow: rgba(255, 159, 67, 0.4);
        --accent-secondary: #ff6b6b; /* Coral/Red for Battle */
        --accent-secondary-glow: rgba(255, 107, 107, 0.4);
        
        --status-online: #00d2d3; /* Teal contrast */
        --status-ingame: #ff9f43; /* Amber glow */
        --status-offline: #576574;
        
        --text-main: #ffffff;
        --text-muted: #a4b0be;
        --text-dim: #57606f;
        
        --border-radius: 12px;
        
        --font-stack: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; outline: none; user-select: none; }
    
    body {
        margin: 0;
        padding: 0;
        /* Atmospheric Gradient Background */
        background: radial-gradient(circle at 50% 100%, #4a1c40 0%, #24243e 40%, #0f0c29 100%);
        color: var(--text-main);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* --- Layout Container --- */
    .app-container {
        width: 1280px;
        height: 840px;
        background: rgba(18, 18, 28, 0.85);
        backdrop-filter: blur(20px);
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
        display: grid;
        grid-template-columns: 1fr 380px;
        overflow: hidden;
        position: relative;
        border: 1px solid rgba(255,255,255,0.08);
    }

    /* --- Scrollbar --- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* --- Avatar System --- */
    .avatar-wrapper {
        position: relative;
        flex-shrink: 0;
        border-radius: var(--border-radius); /* Squircle */
        overflow: visible;
        background: #2d3436;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
    }
    
    .avatar-img {
        width: 100%;
        height: 100%;
        border-radius: var(--border-radius);
        object-fit: cover;
        display: block;
    }

    .status-dot {
        position: absolute;
        bottom: -4px;
        right: -4px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 3px solid rgba(30, 30, 46, 0.9); /* Dark border to separate from bg */
        z-index: 2;
    }
    
    .status-dot.online { background: var(--status-online); box-shadow: 0 0 8px var(--status-online); }
    .status-dot.ingame { background: var(--status-ingame); box-shadow: 0 0 8px var(--status-ingame); }
    .status-dot.offline { background: var(--status-offline); }

    /* --- LEFT COLUMN --- */
    .main-column {
        display: flex;
        flex-direction: column;
        border-right: 1px solid rgba(255,255,255,0.05);
        position: relative;
        background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, transparent 100%);
    }

    /* 1. Top Bar: Profile + Party Strip */
    .top-bar {
        display: flex;
        align-items: center;
        padding: 16px 24px;
        background: rgba(0,0,0,0.2);
        border-bottom: 1px solid rgba(255,255,255,0.05);
        gap: 24px;
    }

    /* Player Profile (Top Left) */
    .player-profile {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-right: 24px;
        border-right: 1px solid rgba(255,255,255,0.1);
        min-width: 200px;
    }

    .player-profile .avatar-wrapper { width: 48px; height: 48px; }
    
    .player-info { display: flex; flex-direction: column; }
    .player-name { font-weight: 700; font-size: 1rem; color: #fff; }
    .player-level { font-size: 0.75rem; color: var(--accent-primary); font-weight: 600; letter-spacing: 0.5px; }

    /* Active Party Strip (Reduced Height) */
    .party-strip {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 16px;
        overflow: hidden;
    }

    .party-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-muted);
        font-weight: 700;
        white-space: nowrap;
    }

    .party-members {
        display: flex;
        gap: 12px;
    }

    .party-member {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255,255,255,0.05);
        padding: 6px 12px 6px 6px;
        border-radius: var(--border-radius);
        border: 1px solid transparent;
        transition: 0.2s;
    }
    
    .party-member:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.1); }
    .party-member .avatar-wrapper { width: 32px; height: 32px; }
    .party-member .status-dot { width: 12px; height: 12px; bottom: -2px; right: -2px; border-width: 2px; }
    .party-member-name { font-size: 0.85rem; font-weight: 600; color: #fff; }

    /* Requests Badge (Floating) */
    .nav-actions {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .btn-icon-badge {
        position: relative;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        width: 40px;
        height: 40px;
        border-radius: var(--border-radius);
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: 0.2s;
    }
    
    .btn-icon-badge:hover { color: #fff; background: rgba(255,255,255,0.1); }
    
    .badge-count {
        position: absolute;
        top: -6px;
        right: -6px;
        background: var(--accent-secondary);
        color: #fff;
        font-size: 0.7rem;
        font-weight: 700;
        height: 20px;
        width: 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid rgba(18, 18, 28, 0.9);
        box-shadow: 0 0 10px var(--accent-secondary-glow);
        animation: pulse 2s infinite;
    }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

    /* 2. Search & Add (Grouped Container) */
    .input-group {
        margin: 20px 24px 10px;
        display: flex;
        gap: 0; /* Combined container */
        background: rgba(0,0,0,0.2);
        border-radius: var(--border-radius);
        padding: 4px;
        border: 1px solid rgba(255,255,255,0.05);
    }

    .search-box {
        flex: 1;
        position: relative;
    }

    .search-input {
        width: 100%;
        background: transparent;
        border: none;
        padding: 12px 16px 12px 44px;
        color: #fff;
        font-size: 0.95rem;
    }
    
    .search-input::placeholder { color: var(--text-dim); }
    
    .search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-dim);
        width: 18px;
        height: 18px;
    }

    .btn-add {
        background: var(--surface-card);
        border: none;
        border-left: 1px solid rgba(255,255,255,0.05);
        color: var(--text-main);
        padding: 0 20px;
        font-weight: 600;
        font-size: 0.9rem;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    .btn-add:hover { background: var(--surface-highlight); }

    /* 3. Filters */
    .filters {
        padding: 0 24px 10px;
        display: flex;
        gap: 16px;
    }
    
    .filter-pill {
        font-size: 0.8rem;
        color: var(--text-muted);
        cursor: pointer;
        padding-bottom: 2px;
        border-bottom: 2px solid transparent;
        transition: 0.2s;
    }
    
    .filter-pill:hover { color: var(--text-main); }
    .filter-pill.active { color: var(--accent-primary); border-color: var(--accent-primary); }

    /* 4. Friends List */
    .friends-list {
        flex: 1;
        overflow-y: auto;
        padding: 10px 24px 24px;
    }

    .friend-item {
        display: flex;
        align-items: center;
        padding: 14px 16px;
        border-radius: var(--border-radius);
        margin-bottom: 6px;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        border: 1px solid transparent;
        position: relative;
        background: transparent;
    }

    .friend-item:hover {
        background: var(--surface-card-hover);
    }

    .friend-item.selected {
        background: rgba(255, 159, 67, 0.1); /* Amber tint */
        border-color: rgba(255, 159, 67, 0.3);
    }

    /* Status differentiation */
    .friend-item.status-ingame {
        background: linear-gradient(90deg, rgba(255, 159, 67, 0.05) 0%, transparent 100%);
        border-left: 3px solid var(--accent-primary);
        padding-left: 13px; /* Compensate for border */
    }
    
    .friend-item.status-offline { opacity: 0.6; }
    .friend-item.status-offline:hover { opacity: 1; }

    .friend-item .avatar-wrapper { width: 52px; height: 52px; margin-right: 16px; }

    .friend-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    
    .friend-name {
        font-size: 1rem;
        font-weight: 700;
        color: #fff;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    .rank-badge {
        font-size: 0.65rem;
        padding: 2px 6px;
        border-radius: 4px;
        background: rgba(255,255,255,0.1);
        color: var(--text-muted);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .friend-status {
        font-size: 0.8rem;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .status-text-highlight { color: var(--accent-primary); font-weight: 500; }

    /* --- RIGHT PANEL (Detail) --- */
    .right-panel {
        background: rgba(15, 15, 25, 0.6);
        display: flex;
        flex-direction: column;
        border-left: 1px solid rgba(255,255,255,0.05);
        position: relative;
    }

    .detail-header {
        padding: 40px 30px 20px;
        text-align: center;
        background: radial-gradient(circle at top, rgba(255, 159, 67, 0.1) 0%, transparent 60%);
    }

    .detail-avatar {
        width: 100px;
        height: 100px;
        margin: 0 auto 16px;
        border: 2px solid rgba(255,255,255,0.1);
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .detail-name { font-size: 1.5rem; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
    
    .detail-rank {
        display: inline-block;
        margin-top: 8px;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        padding: 4px 12px;
        border-radius: 20px;
        background: rgba(255, 159, 67, 0.15);
        color: var(--accent-primary);
        box-shadow: 0 0 15px rgba(255, 159, 67, 0.1);
    }

    .detail-status-line {
        margin-top: 8px;
        font-size: 0.9rem;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    /* Action Buttons (Priority) */
    .action-row {
        padding: 20px 30px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .btn-action {
        padding: 14px;
        border-radius: var(--border-radius);
        border: none;
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: #fff;
    }

    /* Invite: Amber */
    .btn-invite {
        background: linear-gradient(135deg, #ff9f43 0%, #e58e26 100%);
        box-shadow: 0 4px 15px rgba(255, 159, 67, 0.3);
    }
    .btn-invite:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(255, 159, 67, 0.5);
        filter: brightness(1.1);
    }

    /* Battle: Coral/Red */
    .btn-battle {
        background: rgba(255, 107, 107, 0.15);
        border: 1px solid rgba(255, 107, 107, 0.4);
        color: #ff6b6b;
    }
    .btn-battle:hover {
        background: var(--accent-secondary);
        color: #fff;
        border-color: var(--accent-secondary);
        box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        transform: translateY(-2px);
    }

    /* Secondary Stats */
    .stats-container {
        padding: 0 30px 20px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .stat-box {
        background: var(--surface-card);
        border-radius: var(--border-radius);
        padding: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255,255,255,0.03);
    }

    .stat-value { font-size: 1.25rem; font-weight: 700; color: #fff; }
    .stat-label { font-size: 0.7rem; text-transform: uppercase; color: var(--text-dim); letter-spacing: 1px; margin-top: 4px; }

    /* Graphical Ring */
    .ring-container { position: relative; width: 60px; height: 60px; margin-bottom: 4px; }
    .ring-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
    .ring-bg { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 4; }
    .ring-fill { fill: none; stroke: var(--accent-primary); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 150; stroke-dashoffset: 40; }

    /* Message Button (Bottom) */
    .footer-actions {
        margin-top: auto;
        padding: 20px 30px;
    }
    
    .btn-msg {
        width: 100%;
        background: transparent;
        border: 1px solid rgba(255,255,255,0.1);
        color: var(--text-muted);
        padding: 12px;
        border-radius: var(--border-radius);
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }
    .btn-msg:hover { background: rgba(255,255,255,0.05); color: #fff; border-color: rgba(255,255,255,0.2); }

    /* --- SVG Icons --- */
    svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .icon-sm { width: 16px; height: 16px; }
    .icon-xs { width: 12px; height: 12px; }

    /* --- Request View (Hidden by default) --- */
    .request-view {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(15, 15, 25, 0.95);
        backdrop-filter: blur(10px);
        z-index: 10;
        padding: 24px;
        display: none;
        flex-direction: column;
        animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    
    .request-view.active { display: flex; }

    .req-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .req-title { font-size: 1.2rem; font-weight: 700; }
    .btn-close { background: none; border: none; color: var(--text-muted); cursor: pointer; }
    .btn-close:hover { color: #fff; }

    .req-item {
        background: var(--surface-card);
        border-radius: var(--border-radius);
        padding: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
        border: 1px solid rgba(255,255,255,0.05);
    }
    
    .req-item .avatar-wrapper { width: 44px; height: 44px; }
    .req-info { flex: 1; }
    .req-name { font-weight: 700; display: block; font-size: 0.95rem; }
    .req-time { font-size: 0.75rem; color: var(--text-muted); }
    
    .req-actions { display: flex; gap: 8px; }
    .btn-circle { width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .btn-accept { background: var(--status-online); color: #000; }
    .btn-accept:hover { box-shadow: 0 0 10px var(--status-online); transform: scale(1.1); }
    .btn-decline { background: rgba(255,255,255,0.1); color: var(--text-muted); }
    .btn-decline:hover { background: rgba(255,255,255,0.2); color: #fff; }

</style>
</head>
<body>

<div class="app-container">
    
    <!-- LEFT COLUMN -->
    <main class="main-column">
        
        <!-- 1. Top Bar -->
        <header class="top-bar">
            <!-- Player Profile -->
            <div class="player-profile">
                <div class="avatar-wrapper">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%232a2d3e'/%3E%3Ccircle cx='50' cy='40' r='20' fill='%23ff9f43'/%3E%3Cpath d='M20 90 Q50 60 80 90' fill='%23ff9f43'/%3E%3C/svg%3E" class="avatar-img" alt="Me">
                    <div class="status-dot online"></div>
                </div>
                <div class="player-info">
                    <div class="player-name">NeonRider</div>
                    <div class="player-level">LVL 42</div>
                </div>
            </div>

            <!-- Active Party Strip -->
            <div class="party-strip">
                <div class="party-label">Party (3/4)</div>
                <div class="party-members">
                    <!-- Member 1 -->
                    <div class="party-member">
                        <div class="avatar-wrapper">
                            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23222f3e'/%3E%3Ccircle cx='50' cy='50' r='25' fill='%2300d2d3'/%3E%3C/svg%3E" class="avatar-img" alt="User">
                            <div class="status-dot ingame"></div>
                        </div>
                        <div class="party-member-name">CyberWolf</div>
                    </div>
                    <!-- Member 2 -->
                    <div class="party-member">
                        <div class="avatar-wrapper">
                            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%233e222f'/%3E%3Ccircle cx='50' cy='50' r='25' fill='%23ff6b6b'/%3E%3C/svg%3E" class="avatar-img" alt="User">
                            <div class="status-dot online"></div>
                        </div>
                        <div class="party-member-name">Viper_X</div>
                    </div>
                </div>
            </div>

            <!-- Nav Actions (Requests Badge) -->
            <div class="nav-actions">
                <div class="btn-icon-badge" onclick="toggleRequests()">
                    <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                    <div class="badge-count">3</div>
                </div>
            </div>
        </header>

        <!-- 2. Search & Add Group -->
        <div class="input-group">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" class="search-input" placeholder="Search friends...">
            </div>
            <button class="btn-add">
                <svg class="icon-sm" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Add Friend
            </button>
        </div>

        <!-- 3. Filters -->
        <div class="filters">
            <div class="filter-pill active">All</div>
            <div class="filter-pill">Online</div>
            <div class="filter-pill">In Game</div>
        </div>

        <!-- 4. Friends List -->
        <div class="friends-list" id="friendList">
            <!-- Populated by JS -->
        </div>
    </main>

    <!-- RIGHT PANEL -->
    <aside class="right-panel">
        
        <!-- Detail View -->
        <div class="detail-header">
            <div class="avatar-wrapper detail-avatar">
                <img id="detailImg" src="" class="avatar-img" alt="Detail">
                <div class="status-dot" id="detailBadge"></div>
            </div>
            <h2 class="detail-name" id="detailName">CyberWolf</h2>
            <div class="detail-rank" id="detailRank">Diamond II</div>
            <div class="detail-status-line">
                <svg class="icon-xs" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span id="detailStatusText">In Game: Battle Arena</span>
            </div>
        </div>

        <!-- Primary Actions -->
        <div class="action-row">
            <button class="btn-action btn-invite">
                <svg class="icon-sm" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                Invite
            </button>
            <button class="btn-action btn-battle">
                <svg class="icon-sm" viewBox="0 0 24 24"><path d="M14.5 17.5L3 6V3h3l11.5 11.5m-5-5L21 3v3"></path></svg>
                Battle
            </button>
        </div>

        <!-- Secondary Stats -->
        <div class="stats-container">
            <div class="stat-box">
                <div class="ring-container">
                    <svg class="ring-svg" viewBox="0 0 50 50">
                        <circle class="ring-bg" cx="25" cy="25" r="20"></circle>
                        <circle class="ring-fill" cx="25" cy="25" r="20"></circle>
                    </svg>
                </div>
                <span class="stat-value">86%</span>
                <span class="stat-label">Win Rate</span>
            </div>
            <div class="stat-box">
                <svg class="icon-sm" style="color:var(--text-dim); margin-bottom:4px" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
                <span class="stat-value">1,240</span>
                <span class="stat-label">Total Wins</span>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer-actions">
            <button class="btn-msg">Send Message</button>
        </div>

        <!-- Requests Overlay -->
        <div class="request-view" id="requestView">
            <div class="req-header">
                <div class="req-title">Friend Requests</div>
                <button class="btn-close" onclick="toggleRequests()">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="req-item">
                <div class="avatar-wrapper">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%232d3436'/%3E%3Cpath d='M50 20 L80 80 L20 80 Z' fill='%23a29bfe'/%3E%3C/svg%3E" class="avatar-img" alt="User">
                </div>
                <div class="req-info">
                    <div class="req-name">Glitch_Monkey</div>
                    <div class="req-time">2 mins ago</div>
                </div>
                <div class="req-actions">
                    <button class="btn-circle btn-accept"><svg class="icon-xs" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></button>
                    <button class="btn-circle btn-decline"><svg class="icon-xs" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
                </div>
            </div>
            <div class="req-item">
                <div class="avatar-wrapper">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23636e72'/%3E%3Ccircle cx='50' cy='50' r='30' fill='%2300d2d3'/%3E%3C/svg%3E" class="avatar-img" alt="User">
                </div>
                <div class="req-info">
                    <div class="req-name">EcoWarrior</div>
                    <div class="req-time">1 hour ago</div>
                </div>
                <div class="req-actions">
                    <button class="btn-circle btn-accept"><svg class="icon-xs" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></button>
                    <button class="btn-circle btn-decline"><svg class="icon-xs" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
                </div>
            </div>
        </div>

    </aside>

</div>

<script>
    // Mock Data
    const friends = [
        { id: 1, name: "CyberWolf", status: "ingame", game: "Battle Arena", avatar: "%23222f3e", color: "%2300d2d3", rank: "Diamond II" },
        { id: 2, name: "Viper_X", status: "online", game: "In Lobby", avatar: "%233e222f", color: "%23ff6b6b", rank: "Platinum I" },
        { id: 3, name: "NovaStar", status: "online", game: "In Lobby", avatar: "%233e3e22", color: "%23ff9f43", rank: "Master" },
        { id: 4, name: "GhostShell", status: "offline", game: "Last seen 2h ago", avatar: "%23222222", color: "%2357606f", rank: "Gold III" },
        { id: 5, name: "PixelPunk", status: "ingame", game: "Ranked 5v5", avatar: "%233e223e", color: "%23a29bfe", rank: "Silver I" },
        { id: 6, name: "IronClad", status: "online", game: "In Lobby", avatar: "%23333333", color: "%2374b9ff", rank: "Platinum III" },
        { id: 7, name: "ShadowMerk", status: "offline", game: "Last seen yesterday", avatar: "%231e1e1e", color: "%23636e72", rank: "Diamond I" },
        { id: 8, name: "LunaTide", status: "ingame", game: "Co-op Raid", avatar: "%231e2b30", color: "%2300d2d3", rank: "Grandmaster" }
    ];

    const listContainer = document.getElementById('friendList');
    
    // Render Helper
    function renderFriends() {
        listContainer.innerHTML = '';
        friends.forEach(friend => {
            const item = document.createElement('div');
            // Add class for styling based on status
            item.className = `friend-item status-${friend.status}`;
            if(friend.id === 1) item.classList.add('selected');
            
            item.onclick = () => selectFriend(friend, item);

            // SVG Avatar
            const avatarSvg = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='${friend.avatar}'/%3E%3Ccircle cx='50' cy='50' r='30' fill='${friend.color}' opacity='0.8'/%3E%3C/svg%3E`;

            let statusHtml = '';
            if(friend.status === 'ingame') {
                statusHtml = `<span class="status-text-highlight">●</span> ${friend.game}`;
            } else if (friend.status === 'online') {
                statusHtml = `<span style="color:var(--status-online)">●</span> Online`;
            } else {
                statusHtml = `<span style="color:var(--status-offline)">●</span> ${friend.game}`;
            }

            item.innerHTML = `
                <div class="avatar-wrapper">
                    <img src="${avatarSvg}" class="avatar-img" alt="${friend.name}">
                    <div class="status-dot ${friend.status}"></div>
                </div>
                <div class="friend-info">
                    <div class="friend-name">
                        ${friend.name}
                        <span class="rank-badge">${friend.rank}</span>
                    </div>
                    <div class="friend-status">${statusHtml}</div>
                </div>
            `;
            listContainer.appendChild(item);
        });
    }

    // Toggle Request View
    function toggleRequests() {
        const view = document.getElementById('requestView');
        view.classList.toggle('active');
    }

    // Select Logic
    function selectFriend(friend, element) {
        // Highlight UI
        document.querySelectorAll('.friend-item').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');

        // Update Detail Panel
        document.getElementById('detailName').innerText = friend.name;
        document.getElementById('detailRank').innerText = friend.rank;
        
        const badge = document.getElementById('detailBadge');
        badge.className = 'status-dot ' + friend.status;

        const statusText = document.getElementById('detailStatusText');
        if(friend.status === 'ingame') {
            statusText.innerText = `Playing ${friend.game}`;
            statusText.style.color = 'var(--accent-primary)';
        } else if (friend.status === 'online') {
            statusText.innerText = 'Online';
            statusText.style.color = 'var(--status-online)';
        } else {
            statusText.innerText = 'Offline';
            statusText.style.color = 'var(--text-dim)';
        }
        
        // Update Avatar
        const avatarSvg = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='${friend.avatar}'/%3E%3Ccircle cx='50' cy='50' r='30' fill='${friend.color}' opacity='0.8'/%3E%3C/svg%3E`;
        document.getElementById('detailImg').src = avatarSvg;
    }

    // Initialize
    renderFriends();
    selectFriend(friends[0], document.querySelector('.friend-item'));

</script>
</body>
</html>
