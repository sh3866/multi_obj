<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trifolium | Botanical Study</title>
<style>
  :root {
    /* Palette: Refined Botanical / Cel-Shaded */
    --bg-color: #F4F5F0; /* Warm paper tone */
    --ink-color: #2C332C; /* Deep organic grey-green */
    --line-color: #6B7C6B; /* Annotation grey */
    
    --font-serif: 'Garamond', 'Georgia', serif;
    --font-mono: 'Courier New', Courier, monospace;
    --font-sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-color);
    color: var(--ink-color);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  /* Layout Container */
  .study-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 1280px;
    max-height: 800px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Typography & Metadata */
  .header-title {
    position: absolute;
    top: 6vh;
    left: 8vw;
    z-index: 2;
  }

  .header-title h1 {
    font-family: var(--font-serif);
    font-size: 3.5rem;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin-bottom: 0.1em;
    color: var(--ink-color);
  }

  .header-title h2 {
    font-family: var(--font-sans);
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--line-color);
  }

  .metadata {
    position: absolute;
    bottom: 6vh;
    right: 8vw;
    text-align: right;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    line-height: 1.6;
    color: var(--line-color);
    max-width: 250px;
    border-right: 1px solid var(--ink-color);
    padding-right: 1rem;
  }

  .metadata span {
    display: block;
  }

  .metadata strong {
    color: var(--ink-color);
    font-weight: 700;
  }

  /* SVG Styling */
  svg.plant-svg {
    width: 100%;
    height: 100%;
    max-width: 1280px;
    max-height: 800px;
    overflow: visible;
  }

  /* Cel-Shading Classes */
  .leaf-base { fill: #65965C; stroke: #2C332C; stroke-width: 1.5; stroke-linejoin: round; }
  .leaf-shadow { fill: #3F6239; opacity: 0.6; mix-blend-mode: multiply; }
  .leaf-highlight { fill: #88B581; opacity: 0.7; }
  .vein { fill: none; stroke: #2C332C; stroke-width: 1; stroke-linecap: round; opacity: 0.4; }
  .stem { fill: #4A6B45; stroke: #2C332C; stroke-width: 1.5; stroke-linecap: round; }
  
  /* Annotation Lines */
  .annotation-group {
    pointer-events: none;
  }
  .ann-line {
    stroke: var(--line-color);
    stroke-width: 0.5;
    fill: none;
    opacity: 0.8;
  }
  .ann-dot {
    fill: var(--ink-color);
  }
  .ann-text {
    font-family: var(--font-mono);
    font-size: 10px;
    fill: var(--ink-color);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

</style>
</head>
<body>

  <div class="study-container">
    
    <!-- Header -->
    <div class="header-title">
      <h1>Trifolium</h1>
      <h2>Field Study No. 04</h2>
    </div>

    <!-- Metadata -->
    <div class="metadata">
      <strong>Fig. 1.</strong> Specimen<br>
      <span>COLLECTION: 2023-05-14</span>
      <span>LOC: 45.4211° N, 75.6978° W</span>
      <span>STATUS: VERIFIED</span>
    </div>

    <!-- The Specimen -->
    <svg class="plant-svg" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Reusable Serrated Leaflet Definition -->
        <g id="detailed-leaflet">
          <!-- Base Shape with Serrations -->
          <path class="leaf-base" d="M 0,0 
                   C -5,-15 -15,-30 -30,-35 
                   L -35,-45 L -25,-40 
                   C -60,-45 -80,-30 -90,-10 
                   L -100,-10 L -90,0 
                   C -95,25 -80,55 -50,65 
                   L -60,75 L -50,70 
                   C -30,80 0,80 0,80 
                   C 30,80 60,75 70,65 
                   L 80,75 L 75,65 
                   C 100,55 110,25 105,0 
                   L 115,-5 L 100,-10 
                   C 95,-30 75,-45 50,-40 
                   L 60,-50 L 50,-35 
                   C 30,-30 15,-15 0,0 Z" />
          
          <!-- Cel-Shaded Shadow Layer (Bottom Right) -->
          <path class="leaf-shadow" d="M 0,0 
                   C 30,-30 50,-35 50,-35 
                   L 60,-50 L 50,-35 
                   C 75,-45 95,-30 105,0 
                   L 115,-5 L 100,-10 
                   C 110,25 100,55 70,65 
                   L 80,75 L 75,65 
                   C 60,75 30,80 0,80 Z" />

          <!-- Cel-Shaded Highlight Layer (Top Left) -->
          <path class="leaf-highlight" d="M 0,0 
                   C -5,-15 -15,-30 -30,-35 
                   L -35,-45 L -25,-40 
                   C -60,-45 -80,-30 -90,-10 
                   L -100,-10 L -90,0 
                   C -95,25 -80,55 -50,65 
                   L -60,75 L -50,70 
                   C -30,80 0,80 0,80 
                   C 0,0 0,0 0,0 Z" />

          <!-- Veins -->
          <g class="vein">
            <!-- Midrib -->
            <path d="M 0,0 Q 5,40 0,78" stroke-width="1.5" />
            <!-- Left Secondary -->
            <path d="M -2,15 Q -30,10 -70,5" />
            <path d="M -4,35 Q -40,30 -75,25" />
            <path d="M -5,55 Q -30,50 -55,45" />
            <!-- Right Secondary -->
            <path d="M 2,15 Q 30,10 70,5" />
            <path d="M 4,35 Q 40,30 75,25" />
            <path d="M 5,55 Q 30,50 55,45" />
          </g>
        </g>
      </defs>

      <!-- 1. Main Stem -->
      <g id="stem-structure">
        <!-- Stem Base -->
        <path class="stem" d="M 640,780 C 640,600 600,450 640,300" stroke-width="12" />
        <!-- Stem Highlight (Cel-shade strip) -->
        <path fill="none" stroke="#6B8F66" stroke-width="3" d="M 640,780 C 640,600 600,450 640,300" stroke-linecap="round" />
      </g>

      <!-- 2. The Clover Head (Trifolium) -->
      <!-- Positioned at the top of the main stem -->
      <g id="clover-head" transform="translate(640, 300)">
        
        <!-- Connecting Petioles -->
        <g class="stem" stroke-width="6">
          <!-- Left Petiole -->
          <path d="M 0,0 Q -30,-10 -60,-40" />
          <!-- Right Petiole -->
          <path d="M 0,0 Q 30,-10 60,-40" />
          <!-- Center Petiole -->
          <path d="M 0,0 Q 0,-20 0,-60" />
        </g>

        <!-- Left Leaflet -->
        <g transform="translate(-60, -40) rotate(-55) scale(0.85)">
          <use href="#detailed-leaflet" />
        </g>

        <!-- Right Leaflet -->
        <g transform="translate(60, -40) rotate(55) scale(0.85)">
          <use href="#detailed-leaflet" />
        </g>

        <!-- Center Leaflet (Dominant) -->
        <g transform="translate(0, -60) rotate(0) scale(1.1)">
          <use href="#detailed-leaflet" />
        </g>

        <!-- Junction Shadow (Visual glue) -->
        <circle cx="0" cy="0" r="8" fill="#2C332C" opacity="0.3" filter="blur(2px)"/>

      </g>

      <!-- 3. Annotations -->
      <g class="annotation-group">
        
        <!-- Annotation 1: Serration -->
        <g transform="translate(0,0)">
          <!-- Line -->
          <path class="ann-line" d="M 520,220 L 400,180 L 300,180" />
          <!-- Dot -->
          <circle class="ann-dot" cx="520" cy="220" r="2" />
          <!-- Text -->
          <text class="ann-text" x="290" y="184" text-anchor="end">Marginal Serration</text>
        </g>

        <!-- Annotation 2: Venation -->
        <g transform="translate(0,0)">
          <!-- Line -->
          <path class="ann-line" d="M 640,260 L 800,200 L 950,200" />
          <!-- Dot -->
          <circle class="ann-dot" cx="640" cy="260" r="2" />
          <!-- Text -->
          <text class="ann-text" x="960" y="204" text-anchor="start">Pinnate Venation</text>
        </g>

        <!-- Annotation 3: Stem -->
        <g transform="translate(0,0)">
          <!-- Line -->
          <path class="ann-line" d="M 630,500 L 500,550 L 350,550" />
          <!-- Dot -->
          <circle class="ann-dot" cx="630" cy="500" r="2" />
          <!-- Text -->
          <text class="ann-text" x="340" y="554" text-anchor="end">Internode</text>
        </g>

      </g>

    </svg>
  </div>

  <script>
    // Subtle parallax interaction
    // Moves the plant slightly based on mouse position to give life
    document.addEventListener('mousemove', (e) => {
      const x = (window.innerWidth - e.pageX * 2) / 150;
      const y = (window.innerHeight - e.pageY * 2) / 150;

      const plant = document.getElementById('clover-head');
      const stem = document.getElementById('stem-structure');
      
      // Parallax factors
      if(plant) {
        plant.style.transform = `translate(calc(640px + ${x * 2}px), calc(300px + ${y * 2}px))`;
      }
      if(stem) {
        stem.style.transform = `translate(${x * 1}px, ${y * 1}px)`;
      }
    });
  </script>
</body>
</html>
