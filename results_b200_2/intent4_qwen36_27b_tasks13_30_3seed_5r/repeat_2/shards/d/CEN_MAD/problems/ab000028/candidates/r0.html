<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascent // The Descent</title>
<style>
  :root {
    --bg-sky-top: #87CEEB;
    --bg-sky-bot: #F5F5DC;
    --cliff-dark: #2B2B2B;
    --cliff-light: #555555;
    --accent: #E74C3C;
    --text-main: #1a1a1a;
    --text-muted: #555;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-sky-bot);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Layout Structure */
  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* The SVG Scene */
  #scene {
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* UI Overlay Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* Let clicks pass through to SVG if needed */
    z-index: 10;
    display: grid;
    grid-template-columns: 60px 1fr 60px;
    grid-template-rows: 60px 1fr 100px;
  }

  /* Typography & Branding */
  .brand {
    grid-column: 2;
    grid-row: 1;
    padding: 30px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
  }

  .brand h1 {
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 800;
    color: var(--text-main);
    margin: 0;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 4px;
  }

  /* Data Readouts */
  .data-panel {
    grid-column: 3;
    grid-row: 1;
    padding: 30px;
    text-align: right;
    font-family: "Courier New", Courier, monospace;
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
  }

  .data-value {
    font-weight: bold;
    color: var(--text-main);
    font-size: 14px;
  }

  /* Bottom Editorial Text */
  .editorial {
    grid-column: 2;
    grid-row: 3;
    padding: 0 30px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start;
  }

  .editorial h2 {
    font-size: 48px;
    line-height: 0.9;
    font-weight: 900;
    color: var(--text-main);
    margin: 0;
    letter-spacing: -1px;
    mix-blend-mode: multiply;
  }

  .editorial p {
    margin-top: 10px;
    font-size: 14px;
    max-width: 400px;
    line-height: 1.5;
    color: var(--text-muted);
  }

  /* Controls */
  .controls {
    grid-column: 1;
    grid-row: 3;
    padding: 30px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    pointer-events: auto;
  }

  .btn {
    background: none;
    border: 1px solid var(--text-muted);
    color: var(--text-muted);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: scale(1.1);
  }

  /* SVG Animations */
  @keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
    100% { transform: translateY(0px); }
  }

  @keyframes sway {
    0% { transform: rotate(-1deg); }
    50% { transform: rotate(1deg); }
    100% { transform: rotate(-1deg); }
  }

  @keyframes wind {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50px); opacity: 0; }
  }

  .parachute-group {
    animation: float 6s ease-in-out infinite;
    transform-origin: center bottom;
  }

  .wind-line {
    stroke: rgba(255, 255, 255, 0.6);
    stroke-width: 2;
    stroke-linecap: round;
    fill: none;
    animation: wind 2s linear infinite;
  }
  
  /* Depth Blur */
  .blur-bg {
    filter: blur(3px);
    opacity: 0.7;
  }
  
  .blur-far {
    filter: blur(8px);
    opacity: 0.5;
  }

</style>
</head>
<body>

<div id="viewport">
  
  <!-- UI Overlay -->
  <div class="ui-layer">
    <div class="brand">
      <h1>Verticality</h1>
    </div>
    
    <div class="data-panel">
      <div>ALTITUDE <span class="data-value">2,450m</span></div>
      <div>WIND <span class="data-value">12km/h NW</span></div>
      <div>STATUS <span class="data-value" style="color:var(--accent)">DESCENT</span></div>
    </div>

    <div class="controls">
      <button class="btn" id="windToggle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
        </svg>
      </button>
      <button class="btn" id="zoomToggle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </div>

    <div class="editorial">
      <h2>THE<br>EDGE.</h2>
      <p>Navigating the vertical gap between geology and gravity. A study in tension, scale, and the physics of flight.</p>
    </div>
  </div>

  <!-- The Scene -->
  <svg id="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Sky Gradient -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#A9CCE3;stop-opacity:1" />
        <stop offset="60%" style="stop-color:#FDFEFE;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#F5F5DC;stop-opacity:1" />
      </linearGradient>

      <!-- Canopy Gradient -->
      <radialGradient id="canopyGrad" cx="50%" cy="0%" r="100%">
        <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
      </radialGradient>

      <!-- Cliff Shadow -->
      <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
        <feOffset dx="10" dy="20" result="offsetblur"/>
        <feComponentTransfer>
          <feFuncA type="linear" slope="0.5"/>
        </feComponentTransfer>
        <feMerge> 
          <feMergeNode/>
          <feMergeNode in="SourceGraphic"/> 
        </feMerge>
      </filter>
    </defs>

    <!-- Background Sky -->
    <rect width="1200" height="800" fill="url(#skyGrad)" />

    <!-- Far Mountains (Depth) -->
    <path class="blur-far" d="M0,600 L200,450 L400,550 L600,400 L900,600 L1200,450 L1200,800 L0,800 Z" fill="#D2B48C" opacity="0.4" />
    <path class="blur-far" d="M0,650 L300,500 L500,600 L800,480 L1200,600 L1200,800 L0,800 Z" fill="#C19A6B" opacity="0.5" />

    <!-- Mid-ground Clouds / Wind Lines -->
    <g id="wind-container" opacity="0.6">
      <path class="wind-line" d="M100,200 Q200,210 300,200" style="animation-duration: 3s; animation-delay: 0s;" />
      <path class="wind-line" d="M600,300 Q700,320 800,300" style="animation-duration: 2.5s; animation-delay: 0.5s;" />
      <path class="wind-line" d="M200,500 Q350,510 500,490" style="animation-duration: 4s; animation-delay: 1s;" />
      <path class="wind-line" d="M800,100 Q900,110 1000,90" style="animation-duration: 3.2s; animation-delay: 0.2s;" />
    </g>

    <!-- Main Cliff Face (Right Side) -->
    <g id="cliff" filter="url(#dropShadow)">
      <!-- Base Rock -->
      <path d="M600,0 L700,0 L750,100 L720,200 L800,350 L760,450 L850,600 L800,700 L900,800 L600,800 Z" fill="#34495E" />
      
      <!-- Rock Layers (Strata) -->
      <path d="M600,0 L700,0 L750,100 L720,200 L800,350 L760,450 L850,600 L800,700 L900,800 L880,800 L820,700 L900,600 L800,450 L820,350 L740,200 L770,100 L680,0 Z" fill="#2C3E50" />
      
      <!-- Texture / Cracks -->
      <path d="M650,100 L700,150 L680,200" stroke="#1a252f" stroke-width="2" fill="none" opacity="0.5"/>
      <path d="M720,300 L780,320 L760,380" stroke="#1a252f" stroke-width="3" fill="none" opacity="0.5"/>
      <path d="M780,500 L830,520 L810,600" stroke="#1a252f" stroke-width="2" fill="none" opacity="0.5"/>
    </g>

    <!-- Parachute Subject Group -->
    <g id="subject" class="parachute-group" transform="translate(350, 250)">
      
      <!-- Suspension Lines -->
      <g stroke="#FFF" stroke-width="1.5" opacity="0.8">
        <line x1="-80" y1="60" x2="-10" y2="140" />
        <line x1="-40" y1="75" x2="-10" y2="140" />
        <line x1="0" y1="80" x2="-10" y2="140" />
        <line x1="40" y1="75" x2="-10" y2="140" />
        <line x1="80" y1="60" x2="-10" y2="140" />
        
        <line x1="-80" y1="60" x2="10" y2="140" />
        <line x1="-40" y1="75" x2="10" y2="140" />
        <line x1="0" y1="80" x2="10" y2="140" />
        <line x1="40" y1="75" x2="10" y2="140" />
        <line x1="80" y1="60" x2="10" y2="140" />
      </g>

      <!-- The Human Figure -->
      <g transform="translate(0, 140)">
        <!-- Body -->
        <path d="M-5,0 C-10,15 -5,30 0,40 L0,60 L10,60 L10,40 C15,30 10,15 5,0 Z" fill="#111" />
        <!-- Head -->
        <circle cx="5" cy="-5" r="6" fill="#111" />
        <!-- Arms (holding toggles) -->
        <path d="M-5,5 Q-15,15 -20,10" stroke="#111" stroke-width="3" fill="none" />
        <path d="M15,5 Q25,15 30,10" stroke="#111" stroke-width="3" fill="none" />
        <!-- Legs -->
        <path d="M0,60 L-5,90 L-10,90" stroke="#111" stroke-width="4" fill="none" />
        <path d="M10,60 L15,90 L10,90" stroke="#111" stroke-width="4" fill="none" />
      </g>

      <!-- The Canopy -->
      <path d="M-100,20 Q-50,80 0,80 Q50,80 100,20 Q50,0 0,0 Q-50,0 -100,20 Z" fill="url(#canopyGrad)" />
      <!-- Canopy Ribs/Detail -->
      <path d="M0,0 L0,80" stroke="#C0392B" stroke-width="1" fill="none" opacity="0.5"/>
      <path d="M-50,5 L-25,80" stroke="#C0392B" stroke-width="1" fill="none" opacity="0.5"/>
      <path d="M50,5 L25,80" stroke="#C0392B" stroke-width="1" fill="none" opacity="0.5"/>
      <path d="M-80,15 L-40,80" stroke="#C0392B" stroke-width="1" fill="none" opacity="0.5"/>
      <path d="M80,15 L40,80" stroke="#C0392B" stroke-width="1" fill="none" opacity="0.5"/>

    </g>

    <!-- Foreground Elements (Depth) -->
    <path class="blur-bg" d="M-50,800 L50,600 L100,800 Z" fill="#2C3E50" opacity="0.8" />
    <path class="blur-bg" d="M1250,800 L1150,650 L1200,800 Z" fill="#2C3E50" opacity="0.8" />

  </svg>
</div>

<script>
  // Interaction Logic
  
  const scene = document.getElementById('scene');
  const windContainer = document.getElementById('wind-container');
  const subject = document.getElementById('subject');
  const windToggle = document.getElementById('windToggle');
  const zoomToggle = document.getElementById('zoomToggle');

  let isZoomed = false;
  let windSpeed = 1;

  // Toggle Wind Effect
  windToggle.addEventListener('click', () => {
    if (windSpeed === 1) {
      // Increase wind
      windContainer.style.opacity = "1";
      document.querySelectorAll('.wind-line').forEach(line => {
        line.style.animationDuration = (parseFloat(line.style.animationDuration) * 0.5) + 's';
      });
      // Sway parachute more
      subject.style.animation = 'float 2s ease-in-out infinite, sway 4s ease-in-out infinite';
      windSpeed = 2;
      windToggle.style.borderColor = 'var(--accent)';
      windToggle.style.color = 'var(--accent)';
    } else {
      // Reset wind
      windContainer.style.opacity = "0.6";
      document.querySelectorAll('.wind-line').forEach(line => {
        line.style.animationDuration = '2s'; // reset roughly
      });
      subject.style.animation = 'float 6s ease-in-out infinite';
      windSpeed = 1;
      windToggle.style.borderColor = '';
      windToggle.style.color = '';
    }
  });

  // Toggle Zoom / Scale
  zoomToggle.addEventListener('click', () => {
    isZoomed = !isZoomed;
    const targetTransform = isZoomed ? "scale(1.2) translate(0, -50px)" : "scale(1)";
    const transition = "transform 1s cubic-bezier(0.25, 1, 0.5, 1)";
    
    scene.style.transition = transition;
    scene.style.transform = targetTransform;
    
    // Update UI icon state visually
    zoomToggle.style.transform = isZoomed ? "rotate(90deg)" : "rotate(0deg)";
    zoomToggle.style.transition = "transform 0.3s";
  });

  // Parallax Effect on Mouse Move
  document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 20;
    const y = (e.clientY / window.innerHeight - 0.5) * 20;

    // Move the background slightly opposite to mouse
    const bg = document.getElementById('cliff');
    bg.style.transform = `translate(${-x * 0.5}px, ${-y * 0.5}px)`;
    
    // Move subject slightly with mouse (parallax)
    // Note: This interacts with the animation, so we use CSS variables or careful transforms
    // For simplicity in this constrained environment, we just shift the group slightly
    const currentTransform = isZoomed ? "scale(1.2) translate(0, -50px)" : "scale(1)";
    scene.style.transform = `${currentTransform} translate(${x * 0.2}px, ${y * 0.2}px)`;
  });

</script>
</body>
</html>
