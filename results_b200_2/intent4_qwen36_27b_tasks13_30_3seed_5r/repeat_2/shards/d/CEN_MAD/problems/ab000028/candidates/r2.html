<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verticality // The Descent - Redesign</title>
<style>
  :root {
    /* Palette: Editorial, High Contrast, Atmospheric */
    --sky-top: #1A202C;
    --sky-mid: #4A5568;
    --sky-horizon: #F6AD55;
    
    --cliff-dark: #0F172A;
    --cliff-light: #1E293B;
    --cliff-accent: #334155;
    
    --canopy-primary: #E53E3E;
    --canopy-shadow: #C53030;
    --canopy-highlight: #FC8181;
    
    --text-color: #F7FAFC;
    --text-muted: #A0AEC0;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--sky-top);
    font-family: "SF Mono", "Roboto Mono", "Menlo", "Courier New", monospace;
    -webkit-font-smoothing: antialiased;
  }

  /* Layout Structure */
  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* The SVG Scene */
  #scene {
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* UI Overlay Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
    display: grid;
    grid-template-columns: 80px 1fr 80px;
    grid-template-rows: 80px 1fr 80px;
  }

  /* Typography & Data */
  .data-panel {
    grid-column: 3;
    grid-row: 1;
    padding: 40px;
    text-align: right;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--text-muted);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    mix-blend-mode: difference;
  }

  .data-row {
    display: flex;
    align-items: center;
    gap: 12px;
    text-transform: uppercase;
  }

  .data-value {
    color: var(--text-color);
    font-size: 13px;
    font-weight: 700;
  }

  .status-indicator {
    display: inline-block;
    width: 8px;
    height: 8px;
    background-color: var(--canopy-primary);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--canopy-primary);
    animation: blink 2s infinite;
  }

  /* Animations */
  @keyframes float {
    0% { transform: translate(0px, 0px) rotate(0deg); }
    33% { transform: translate(5px, -15px) rotate(1deg); }
    66% { transform: translate(-5px, -5px) rotate(-1deg); }
    100% { transform: translate(0px, 0px) rotate(0deg); }
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  @keyframes drift {
    from { transform: translateX(100px); opacity: 0; }
    20% { opacity: 0.5; }
    80% { opacity: 0.5; }
    to { transform: translateX(-400px); opacity: 0; }
  }

  .parachute-group {
    animation: float 10s ease-in-out infinite;
    transform-origin: center bottom;
  }

  .wind-streak {
    stroke: var(--text-color);
    stroke-linecap: round;
    fill: none;
    opacity: 0;
  }

  /* SVG Depth Filters */
  .atmosphere-blur {
    filter: blur(6px);
    opacity: 0.7;
  }
  
  .atmosphere-blur-heavy {
    filter: blur(12px);
    opacity: 0.4;
  }

</style>
</head>
<body>

<div id="viewport">
  
  <!-- UI Overlay (Refined) -->
  <div class="ui-layer">
    <!-- Top Left Empty -->
    
    <!-- Top Right Data -->
    <div class="data-panel">
      <div class="data-row">ALTITUDE <span class="data-value">2,450m</span></div>
      <div class="data-row">WIND <span class="data-value">12km/h NW</span></div>
      <div class="data-row">STATUS <span class="data-value" style="color:var(--canopy-primary)">DESCENT</span> <span class="status-indicator"></span></div>
    </div>

    <!-- Bottom Left Empty (Settings removed) -->
  </div>

  <!-- The Scene -->
  <svg id="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Sky Gradient: Cool Top to Warm Horizon -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:var(--sky-top);stop-opacity:1" />
        <stop offset="60%" style="stop-color:var(--sky-mid);stop-opacity:1" />
        <stop offset="100%" style="stop-color:var(--sky-horizon);stop-opacity:1" />
      </linearGradient>

      <!-- Canopy Flat Shading Gradient -->
      <linearGradient id="canopyFlat" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:var(--canopy-primary);stop-opacity:1" />
        <stop offset="100%" style="stop-color:var(--canopy-shadow);stop-opacity:1" />
      </linearGradient>

      <!-- Cliff Shadow Filter -->
      <filter id="cliffShadow" x="-20%" y="-10%" width="140%" height="120%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
        <feOffset dx="-40" dy="20" result="offsetblur"/>
        <feComponentTransfer>
          <feFuncA type="linear" slope="0.5"/>
        </feComponentTransfer>
        <feMerge> 
          <feMergeNode/>
          <feMergeNode in="SourceGraphic"/> 
        </feMerge>
      </filter>
    </defs>

    <!-- 1. Background Sky -->
    <rect width="1200" height="800" fill="url(#skyGrad)" />

    <!-- 2. Distant Mountains (Atmospheric Depth) -->
    <g class="atmosphere-blur-heavy" fill="#2D3748">
      <path d="M-100,800 L-100,500 L100,450 L300,600 L500,400 L800,550 L1300,300 L1300,800 Z" />
    </g>
    <g class="atmosphere-blur" fill="#4A5568">
      <path d="M-100,800 L-100,600 L150,500 L350,650 L600,450 L900,600 L1300,500 L1300,800 Z" />
    </g>

    <!-- 3. Main Cliff Face (Right Side - Foreground) -->
    <g id="cliff" filter="url(#cliffShadow)">
      <!-- Base Silhouette -->
      <path d="M600,0 L1300,0 L1300,800 L700,800 L650,750 L720,600 L680,450 L750,300 L680,150 L780,0 Z" fill="var(--cliff-dark)" />
      
      <!-- Strata Layer 1 (Lighter) -->
      <path d="M620,0 L780,0 L700,150 L770,300 L690,450 L750,600 L670,750 L720,800 L690,800 L650,750 L720,600 L680,450 L750,300 L680,150 Z" fill="var(--cliff-light)" />
      
      <!-- Strata Layer 2 (Dark Cut) -->
      <path d="M640,0 L780,0 L710,150 L760,300 L700,450 L730,600 L660,750 L700,800 L680,800 L660,750 L720,600 L690,450 L750,300 L690,150 Z" fill="var(--cliff-accent)" opacity="0.5" />
      
      <!-- Rock Details / Texture -->
      <g fill="#000000" opacity="0.3">
        <polygon points="700,150 720,160 710,180" />
        <polygon points="730,300 750,310 740,330" />
        <polygon points="690,450 710,460 700,480" />
        <polygon points="710,600 730,610 720,630" />
      </g>
    </g>

    <!-- 4. Wind & Debris (Motion Cues) -->
    <g id="wind-container">
      <!-- Fast Streaks -->
      <path class="wind-streak" d="M1100,150 L900,180" stroke-width="2" style="animation: drift 2s linear infinite 0.1s;" />
      <path class="wind-streak" d="M1200,300 L850,320" stroke-width="1" style="animation: drift 3s linear infinite 1.2s;" />
      <path class="wind-streak" d="M1050,450 L700,480" stroke-width="3" style="animation: drift 2.5s linear infinite 0.5s;" />
      <path class="wind-streak" d="M1150,600 L800,610" stroke-width="2" style="animation: drift 3.5s linear infinite 0.8s;" />
      
      <!-- Debris Particles -->
      <circle cx="1100" cy="200" r="2" fill="#FFF" style="animation: drift 4s linear infinite 0.2s;" opacity="0" />
      <circle cx="1250" cy="400" r="1.5" fill="#FFF" style="animation: drift 3s linear infinite 1.5s;" opacity="0" />
    </g>

    <!-- 5. Parachute Subject Group (Center-Left, x=350) -->
    <g id="subject" class="parachute-group" transform="translate(350, 300)">
      
      <!-- Suspension Lines (Taut) -->
      <g stroke="rgba(255,255,255,0.8)" stroke-width="1.5" fill="none">
        <line x1="-160" y1="100" x2="-15" y2="240" />
        <line x1="-100" y1="120" x2="-15" y2="240" />
        <line x1="-40" y1="130" x2="-15" y2="240" />
        <line x1="40" y1="130" x2="15" y2="240" />
        <line x1="100" y1="120" x2="15" y2="240" />
        <line x1="160" y1="100" x2="15" y2="240" />
      </g>

      <!-- The Human Figure (Geometric Vector Character) -->
      <g transform="translate(0, 240)">
        <!-- Harness/Body -->
        <path d="M-15,0 L15,0 L20,50 L-20,50 Z" fill="#2D3748" />
        <path d="M-15,0 L15,0 L15,10 L-15,10 Z" fill="#4A5568" /> <!-- Chest strap -->
        
        <!-- Head & Helmet -->
        <circle cx="0" cy="-15" r="12" fill="#E2E8F0" /> <!-- Helmet Shell -->
        <path d="M-12,-15 Q0,-25 12,-15 L12,-5 Q0,-15 -12,-5 Z" fill="#2D3748" /> <!-- Visor -->
        <circle cx="0" cy="-15" r="12" fill="none" stroke="#718096" stroke-width="1" /> <!-- Rim -->
        
        <!-- Arms (Reaching for toggles) -->
        <path d="M-15,10 Q-35,30 -30,25" stroke="#2D3748" stroke-width="8" stroke-linecap="round" fill="none" />
        <path d="M15,10 Q35,30 30,25" stroke="#2D3748" stroke-width="8" stroke-linecap="round" fill="none" />
        
        <!-- Legs (Splayed, Geometric) -->
        <path d="M-10,50 L-25,90 L-35,95" stroke="#2D3748" stroke-width="10" stroke-linecap="round" fill="none" />
        <path d="M10,50 L25,90 L15,100" stroke="#2D3748" stroke-width="10" stroke-linecap="round" fill="none" />
      </g>

      <!-- The Canopy (Fully Inflated, Flat Shading) -->
      <g transform="translate(0, 100)">
        <!-- Main Dome -->
        <path d="M-200,0 Q-100,100 0,100 Q100,100 200,0 Q100,-50 0,-50 Q-100,-50 -200,0 Z" fill="url(#canopyFlat)" />
        
        <!-- Flat Shading Blocks (Geometric) -->
        <path d="M-200,0 Q-100,100 0,100 L0,0 Q-100,-50 -200,0 Z" fill="var(--canopy-shadow)" opacity="0.4" />
        <path d="M0,0 L0,100 Q100,100 200,0 Q100,-50 0,0 Z" fill="#000" opacity="0.1" />
        
        <!-- Structural Ribs -->
        <g stroke="var(--canopy-highlight)" stroke-width="2" fill="none" opacity="0.5">
          <path d="M0,-50 L0,100" />
          <path d="M-50,-45 L-25,100" />
          <path d="M50,-45 L25,100" />
          <path d="M-100,-25 L-50,100" />
          <path d="M100,-25 L50,100" />
          <path d="M-150,0 L-75,100" />
          <path d="M150,0 L75,100" />
        </g>
      </g>

    </g>

    <!-- Foreground Elements (Depth Framing) -->
    <path class="atmosphere-blur" d="M-100,900 L150,600 L300,900 Z" fill="#000" opacity="0.6" />
    <path class="atmosphere-blur" d="M1300,900 L1050,650 L1200,900 Z" fill="#000" opacity="0.6" />

  </svg>
</div>

<script>
  // Minimal Interaction Logic
  
  const scene = document.getElementById('scene');
  const subject = document.getElementById('subject');
  const cliff = document.getElementById('cliff');

  // Subtle Parallax on Mouse Move
  document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5);
    const y = (e.clientY / window.innerHeight - 0.5);

    // Move the background slightly opposite to mouse
    // Only move cliff, keep text/UI static
    if(cliff) {
        cliff.style.transform = `translate(${-x * 20}px, ${-y * 10}px)`;
    }
    
    // Move subject slightly with mouse (parallax)
    // We modify the transform of the group, but preserve the animation via CSS variables or simply offset
    // Note: CSS Animation 'float' takes precedence on transform, so we wrap the float group in a static group
    // For this implementation, we shift the scene container slightly
    scene.style.transform = `translate(${x * 10}px, ${y * 10}px)`;
  });

</script>
</body>
</html>
