<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verticality // The Descent - Design Revision</title>
<style>
  :root {
    /* Palette: Editorial, Atmospheric, High Contrast */
    --sky-top: #0B0F19;       /* Deep Night */
    --sky-horizon: #1E293B;   /* Dark Slate */
    --sky-glow: #F97316;      /* Sunset Orange */
    
    --cliff-shadow: #020617;  /* Near Black */
    --cliff-base: #1E293B;    /* Slate */
    --cliff-light: #475569;   /* Highlighted Slate */
    --cliff-sun: #FDBA74;     /* Sunlit Edge */

    --canopy-front: #DC2626;  /* Deep Red */
    --canopy-shadow: #7F1D1D; /* Dark Red */
    --canopy-sun: #FCA5A5;    /* Blown out highlight */
    
    --figure-color: #0F172A;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--sky-top);
    /* System fonts only for performance and offline safety */
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  #scene {
    width: 100%;
    height: 100%;
    display: block;
    /* Subtle scaling to ensure no white edges on retina displays */
    transform-origin: center;
  }

  /* Animations */
  @keyframes drift {
    0% { transform: translateX(0) translateY(0); }
    100% { transform: translateX(-150px) translateY(50px); }
  }

  @keyframes sway {
    0% { transform: rotate(-2deg) translateX(-5px); }
    50% { transform: rotate(2deg) translateX(5px); }
    100% { transform: rotate(-2deg) translateX(-5px); }
  }

  @keyframes wind-flow {
    0% { stroke-dashoffset: 100; opacity: 0; }
    20% { opacity: 0.5; }
    80% { opacity: 0.5; }
    100% { stroke-dashoffset: 0; opacity: 0; }
  }

  .wind-line {
    stroke: rgba(255, 255, 255, 0.15);
    stroke-linecap: round;
    fill: none;
    stroke-dasharray: 20 40;
    animation: wind-flow 3s linear infinite;
  }

  /* Parachute sway group */
  .parachute-system {
    animation: sway 8s ease-in-out infinite;
    transform-origin: 360px 320px; /* Pivot at the harness point */
  }

</style>
</head>
<body>

<div id="viewport">
  <svg id="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Sky Gradient: Smooth transition from deep night to sunset horizon -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="var(--sky-top)" />
        <stop offset="60%" stop-color="var(--sky-horizon)" />
        <stop offset="100%" stop-color="var(--sky-glow)" />
      </linearGradient>

      <!-- Sun Glow Radial -->
      <radialGradient id="sunGlow" cx="0%" cy="100%" r="50%">
        <stop offset="0%" stop-color="var(--sky-glow)" stop-opacity="0.6" />
        <stop offset="100%" stop-color="var(--sky-glow)" stop-opacity="0" />
      </radialGradient>

      <!-- Canopy Gradient (Simulating 3D volume with light from bottom-left) -->
      <linearGradient id="canopyGrad" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="var(--canopy-sun)" />
        <stop offset="30%" stop-color="var(--canopy-front)" />
        <stop offset="100%" stop-color="var(--canopy-shadow)" />
      </linearGradient>
    </defs>

    <!-- 1. Background Atmosphere -->
    <rect width="1200" height="800" fill="url(#skyGrad)" />
    <!-- Sun Light Source (Bottom Left) -->
    <circle cx="0" cy="800" r="900" fill="url(#sunGlow)" />

    <!-- 2. Distant Landscape (Atmospheric Depth) -->
    <!-- Layer 1: Very far -->
    <path d="M0,800 L0,600 L150,550 L300,650 L500,500 L700,600 L1200,450 L1200,800 Z" fill="#1E293B" opacity="0.4" />
    <!-- Layer 2: Mid-distance -->
    <path d="M0,800 L0,650 L200,600 L400,700 L650,580 L900,650 L1200,550 L1200,800 Z" fill="#334155" opacity="0.6" />

    <!-- 3. The Cliff (Right Side - Foreground) -->
    <!-- Occupies right 25% (approx x:900 to 1200). Low-poly style. -->
    <g id="cliff-face">
      <!-- Main Silhouette Base -->
      <path d="M900,0 L1200,0 L1200,800 L950,800 L920,700 L980,550 L910,400 L990,250 L930,100 L1000,0 Z" fill="var(--cliff-shadow)" />
      
      <!-- Facet 1: Main Face (Shadowed) -->
      <path d="M950,800 L920,700 L980,550 L910,400 L990,250 L930,100 L1000,0 L1200,0 L1200,800 Z" fill="var(--cliff-base)" />
      
      <!-- Facet 2: Inner Depth (Darker) -->
      <path d="M980,550 L910,400 L990,250 L1050,250 L1100,400 L1050,550 Z" fill="var(--cliff-shadow)" />
      <path d="M920,700 L980,550 L1050,550 L1000,700 Z" fill="var(--cliff-shadow)" />

      <!-- Facet 3: Left Edge (Sunlit - Light Source from Bottom Left) -->
      <path d="M900,0 L1000,0 L930,100 L990,250 L910,400 L980,550 L920,700 L950,800 L930,800 L910,700 L960,550 L900,400 L970,250 L910,100 Z" fill="var(--cliff-light)" />
      
      <!-- Facet 4: Sharp Highlights (Sunlit Ridge) -->
      <path d="M900,400 L960,550 L930,700 L920,700 L950,800 L920,800 L900,700 Z" fill="var(--cliff-sun)" opacity="0.8" />
      <path d="M900,0 L910,100 L970,250 L990,250 L930,100 L1000,0 Z" fill="var(--cliff-sun)" opacity="0.6" />

      <!-- Horizontal Strata Lines (Rock Layers) -->
      <g stroke="var(--cliff-shadow)" stroke-width="2" opacity="0.5">
        <line x1="910" y1="400" x2="1000" y2="400" />
        <line x1="920" y1="700" x2="1050" y2="700" />
        <line x1="930" y1="100" x2="1050" y2="100" />
      </g>
    </g>

    <!-- 4. Motion Cues (Wind Streaks) -->
    <!-- Diagonal lines moving across the negative space -->
    <g id="wind-layer">
      <path class="wind-line" d="M1100,200 L600,300" stroke-width="2" style="animation-duration: 2.5s; animation-delay: 0.1s;" />
      <path class="wind-line" d="M1000,400 L500,500" stroke-width="3" style="animation-duration: 3s; animation-delay: 1.2s;" />
      <path class="wind-line" d="M1200,600 L700,700" stroke-width="1" style="animation-duration: 2s; animation-delay: 0.5s;" />
      <path class="wind-line" d="M950,100 L400,250" stroke-width="2" style="animation-duration: 2.8s; animation-delay: 0.8s;" />
    </g>

    <!-- 5. The Parachute System (Center-Left, Scaled Up) -->
    <!-- Position: x=360 (30%), y=320 (40%). Scale: 2.5x -->
    <g id="subject" class="parachute-system" transform="translate(360, 320) scale(2.5)">
      
      <!-- Suspension Lines (Taut, connecting to harness) -->
      <!-- Left Side Lines -->
      <line x1="-150" y1="80" x2="-10" y2="240" stroke="#94A3B8" stroke-width="1.5" opacity="0.7" />
      <line x1="-80" y1="100" x2="-10" y2="240" stroke="#94A3B8" stroke-width="1.5" opacity="0.7" />
      <line x1="-20" y1="110" x2="-10" y2="240" stroke="#94A3B8" stroke-width="1.5" opacity="0.7" />
      <!-- Right Side Lines -->
      <line x1="20" y1="110" x2="10" y2="240" stroke="#475569" stroke-width="1.5" opacity="0.7" />
      <line x1="80" y1="100" x2="10" y2="240" stroke="#475569" stroke-width="1.5" opacity="0.7" />
      <line x1="150" y1="80" x2="10" y2="240" stroke="#475569" stroke-width="1.5" opacity="0.7" />

      <!-- The Canopy (3D Volume with Cells) -->
      <g transform="translate(0, 100)">
        <!-- Main Dome Shape -->
        <path d="M-200,0 Q-100,110 0,110 Q100,110 200,0 Q100,-60 0,-60 Q-100,-60 -200,0 Z" fill="url(#canopyGrad)" />
        
        <!-- Cell Segments (Ribs) to show inflation -->
        <g fill="var(--canopy-shadow)" opacity="0.2">
          <path d="M-150,0 L-120,110 L-100,110 L-100,0 Z" />
          <path d="M-50,0 L-20,110 L0,110 L0,0 Z" />
          <path d="M50,0 L20,110 L0,110 L0,0 Z" />
          <path d="M150,0 L120,110 L100,110 L100,0 Z" />
        </g>

        <!-- Structural Ribs (Lines) -->
        <g stroke="var(--canopy-shadow)" stroke-width="1" fill="none" opacity="0.4">
          <path d="M0,-60 L0,110" />
          <path d="M-50,-55 L-25,110" />
          <path d="M50,-55 L25,110" />
          <path d="M-100,-30 L-50,110" />
          <path d="M100,-30 L50,110" />
        </g>
      </g>

      <!-- The Human Figure (Distinct Silhouette) -->
      <g transform="translate(0, 240)">
        <!-- Harness Body -->
        <path d="M-12,0 L12,0 L16,45 L-16,45 Z" fill="var(--figure-color)" />
        
        <!-- Head -->
        <circle cx="0" cy="-15" r="11" fill="#F1F5F9" />
        <path d="M-10,-15 Q0,-22 10,-15 L10,-8 Q0,-18 -10,-8 Z" fill="#0F172A" /> <!-- Visor -->
        
        <!-- Arms (Gripping toggles) -->
        <path d="M-12,5 Q-25,20 -20,30" stroke="var(--figure-color)" stroke-width="7" stroke-linecap="round" fill="none" />
        <path d="M12,5 Q25,20 20,30" stroke="var(--figure-color)" stroke-width="7" stroke-linecap="round" fill="none" />
        
        <!-- Legs (Dangling) -->
        <path d="M-10,45 L-20,90 L-25,95" stroke="var(--figure-color)" stroke-width="8" stroke-linecap="round" fill="none" />
        <path d="M10,45 L20,90 L15,100" stroke="var(--figure-color)" stroke-width="8" stroke-linecap="round" fill="none" />
      </g>
    </g>

    <!-- Foreground Framing (Subtle) -->
    <path d="M-50,900 L100,650 L250,900 Z" fill="#000" opacity="0.5" />
  </svg>
</div>

<script>
  // Parallax Interaction
  // Adds depth by moving the foreground (cliff) and subject 
  // at different rates relative to the background.
  
  const scene = document.getElementById('scene');
  const cliff = document.getElementById('cliff-face');
  const subject = document.getElementById('subject');
  const windLayer = document.getElementById('wind-layer');

  document.addEventListener('mousemove', (e) => {
    // Normalized coordinates (-1 to 1)
    const x = (e.clientX / window.innerWidth - 0.5) * 2;
    const y = (e.clientY / window.innerHeight - 0.5) * 2;

    // Move Scene Background (Mountains) slightly
    scene.style.transform = `translate(${x * 5}px, ${y * 5}px)`;

    // Move Cliff (Foreground) more aggressively
    // Note: We must preserve the initial transform logic if any, 
    // but here we just set the translation.
    cliff.style.transform = `translate(${-x * 20}px, ${-y * 15}px)`;

    // Move Subject (Parachute) moderately
    // The CSS animation handles the sway, we add parallax translation
    subject.style.transform = `translate(360px, 320px) scale(2.5) translate(${x * 10}px, ${y * 10}px)`;

    // Move Wind Lines for extra speed sensation
    windLayer.style.transform = `translate(${x * 30}px, ${y * 20}px)`;
  });
</script>
</body>
</html>
