<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verticality // The Descent - Redesign</title>
<style>
  :root {
    /* Palette: Editorial, High Contrast, Atmospheric */
    --bg-deep: #020617;
    --bg-horizon: #1E293B;
    --accent-sun: #F97316;
    
    --cliff-shadow: #020617;
    --cliff-base: #1E293B;
    --cliff-light: #475569;
    --cliff-highlight: #FDBA74;

    --canopy-light: #EF4444;
    --canopy-mid: #991B1B;
    --canopy-dark: #450A0A;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-deep);
    font-family: system-ui, -apple-system, sans-serif;
  }

  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Animations */
  @keyframes sway {
    0% { transform: rotate(-1deg) translateY(0px); }
    50% { transform: rotate(1.5deg) translateY(-10px); }
    100% { transform: rotate(-1deg) translateY(0px); }
  }

  @keyframes wind-drift {
    0% { transform: translateX(100px); opacity: 0; }
    20% { opacity: 0.6; }
    80% { opacity: 0.6; }
    100% { transform: translateX(-300px); opacity: 0; }
  }

  .wind-streak {
    stroke: rgba(255, 255, 255, 0.3);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-dasharray: 50 100;
    animation: wind-drift 2.5s linear infinite;
  }

  .parachute-rig {
    /* Pivot point at the harness connection */
    transform-origin: 0px 0px; 
    animation: sway 6s ease-in-out infinite;
  }
</style>
</head>
<body>

<div id="viewport">
  <!-- viewBox set to 1200x800 for high res canvas -->
  <svg id="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Sky Gradient -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="var(--bg-deep)" />
        <stop offset="50%" stop-color="#0F172A" />
        <stop offset="100%" stop-color="#334155" />
      </linearGradient>

      <!-- Sun Glow -->
      <radialGradient id="sunGlow" cx="0%" cy="100%" r="70%">
        <stop offset="0%" stop-color="#F97316" stop-opacity="0.4" />
        <stop offset="50%" stop-color="#F97316" stop-opacity="0.1" />
        <stop offset="100%" stop-color="#F97316" stop-opacity="0" />
      </radialGradient>

      <!-- Canopy Gradient (Light source from bottom-left) -->
      <radialGradient id="canopyGrad" cx="20%" cy="80%" r="80%">
        <stop offset="0%" stop-color="var(--canopy-light)" />
        <stop offset="40%" stop-color="var(--canopy-mid)" />
        <stop offset="100%" stop-color="var(--canopy-dark)" />
      </radialGradient>
      
      <!-- Cliff Facet Gradients -->
      <linearGradient id="cliffSun" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="var(--cliff-highlight)" />
        <stop offset="100%" stop-color="var(--cliff-light)" />
      </linearGradient>
    </defs>

    <!-- 1. Background Atmosphere -->
    <rect width="1200" height="800" fill="url(#skyGrad)" />
    <circle cx="0" cy="800" r="1000" fill="url(#sunGlow)" />

    <!-- 2. Distant Landscape (Atmospheric Perspective) -->
    <g id="mountains-back" opacity="0.3">
      <path d="M0,800 L0,550 L150,480 L300,580 L500,400 L700,550 L900,450 L1200,350 L1200,800 Z" fill="#1E293B" />
    </g>
    <g id="mountains-mid" opacity="0.5">
      <path d="M0,800 L0,600 L250,500 L450,650 L750,500 L1000,600 L1200,500 L1200,800 Z" fill="#334155" />
    </g>

    <!-- 3. The Cliff (Right Side - Foreground, Jagged Geometry) -->
    <g id="cliff-face">
      <!-- Base Shadow Face -->
      <path d="M950,0 L1200,0 L1200,800 L950,800 L970,700 L930,600 L980,500 L940,400 L990,300 L950,200 L1000,100 L960,0 Z" fill="var(--cliff-shadow)" />
      
      <!-- Inner Depth Face (Darker) -->
      <path d="M950,800 L970,700 L930,600 L980,500 L940,400 L990,300 L950,200 L1000,100 L960,0 L1200,0 L1200,800 Z" fill="var(--cliff-base)" opacity="0.8" />

      <!-- Sunlit Edge (Left Side of Cliff) -->
      <path d="M950,0 L960,0 L1000,100 L950,200 L990,300 L940,400 L980,500 L930,600 L970,700 L950,800 L930,800 L910,700 L960,600 L920,500 L970,400 L930,300 L980,200 L940,100 Z" fill="url(#cliffSun)" />
      
      <!-- Rock Striations / Layers -->
      <g stroke="var(--cliff-shadow)" stroke-width="3" opacity="0.4">
        <path d="M940,400 L1050,400" />
        <path d="M930,600 L1000,600" />
        <path d="M950,200 L1080,200" />
        <path d="M960,0 L1020,0" />
      </g>
    </g>

    <!-- 4. Wind Cues -->
    <g id="wind-layer">
      <path class="wind-streak" d="M1200,200 L1000,250" style="animation-delay: 0.1s;" />
      <path class="wind-streak" d="M1100,400 L800,450" style="animation-delay: 1.2s;" />
      <path class="wind-streak" d="M1200,600 L900,650" style="animation-delay: 0.5s;" />
      <path class="wind-streak" d="M1000,100 L700,150" style="animation-delay: 0.8s;" />
    </g>

    <!-- 5. The Parachute System -->
    <!-- Positioned Center-Left (30%, 40%) -> x:360, y:320 -->
    <!-- Scaled Up significantly for impact -->
    <g id="subject" transform="translate(360, 320) scale(2.2)">
      
      <g class="parachute-rig">
        
        <!-- Suspension Lines (Crisp, Taut) -->
        <!-- Connecting Canopy (y=-100) to Harness (y=0) -->
        <g stroke="#E2E8F0" stroke-width="1.5" opacity="0.8">
          <!-- Left Lines -->
          <line x1="-180" y1="-100" x2="-10" y2="0" />
          <line x1="-100" y1="-120" x2="-10" y2="0" />
          <line x1="-20" y1="-120" x2="-10" y2="0" />
          <!-- Right Lines (Slightly darker for depth) -->
          <line x1="20" y1="-120" x2="10" y2="0" stroke="#94A3B8" />
          <line x1="100" y1="-120" x2="10" y2="0" stroke="#94A3B8" />
          <line x1="180" y1="-100" x2="10" y2="0" stroke="#94A3B8" />
        </g>

        <!-- The Canopy (3D Volume) -->
        <!-- Centered at x:0, y:-100 -->
        <g transform="translate(0, -100)">
          <!-- Main Shape -->
          <path d="M-220,0 Q0,-140 220,0 Q100,40 0,40 Q-100,40 -220,0 Z" fill="url(#canopyGrad)" />
          
          <!-- Structural Ribs (To avoid 'flat blob' look) -->
          <g stroke="var(--canopy-dark)" stroke-width="2" opacity="0.3">
            <path d="M0,-130 L0,40" />
            <path d="M-60,-120 L-30,40" />
            <path d="M60,-120 L30,40" />
            <path d="M-120,-80 L-60,40" />
            <path d="M120,-80 L60,40" />
            <path d="M-180,-30 L-100,40" />
            <path d="M180,-30 L100,40" />
          </g>
          
          <!-- Cell Shading (Highlight/Shadow bands) -->
          <path d="M-100,40 Q0,60 100,40 L100,0 Q0,20 -100,0 Z" fill="rgba(0,0,0,0.2)" />
        </g>

        <!-- The Human Figure (Dynamic Silhouette) -->
        <!-- Positioned at harness point (0,0) -->
        <g transform="translate(0, 0)">
          
          <!-- Back Leg (Darker) -->
          <path d="M-5,40 L-15,90 L-25,95" stroke="#020617" stroke-width="8" stroke-linecap="round" fill="none" />
          
          <!-- Torso (Leaning back against wind) -->
          <path d="M-12,0 L12,0 L18,50 L-18,50 Z" fill="#0F172A" />
          
          <!-- Harness/Rig -->
          <rect x="-15" y="0" width="30" height="15" rx="2" fill="#334155" />
          
          <!-- Front Leg -->
          <path d="M5,40 L20,90 L15,100" stroke="#1E293B" stroke-width="9" stroke-linecap="round" fill="none" />
          
          <!-- Arms (Active pose, holding toggles) -->
          <path d="M-12,10 Q-30,25 -25,35" stroke="#0F172A" stroke-width="6" stroke-linecap="round" fill="none" />
          <path d="M12,10 Q30,25 25,35" stroke="#0F172A" stroke-width="6" stroke-linecap="round" fill="none" />
          
          <!-- Head -->
          <circle cx="-5" cy="-15" r="12" fill="#F1F5F9" />
          <!-- Helmet Detail -->
          <path d="M-15,-15 Q-5,-28 5,-15 L5,-5 Q-5,-15 -15,-5 Z" fill="#1E293B" />
        </g>

      </g>
    </g>
  </svg>
</div>

<script>
  // Parallax Interaction
  // Creates depth by moving layers at different speeds
  
  const scene = document.getElementById('scene');
  const mountainsBack = document.getElementById('mountains-back');
  const mountainsMid = document.getElementById('mountains-mid');
  const cliff = document.getElementById('cliff-face');
  const windLayer = document.getElementById('wind-layer');
  
  // Note: We do not move the subject (parachutist) with the mouse, 
  // or we move it very little, to keep the protagonist anchored visually.
  
  document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 2; // -1 to 1
    const y = (e.clientY / window.innerHeight - 0.5) * 2;

    // Background mountains move very slowly (far away)
    mountainsBack.style.transform = `translate(${x * 5}px, ${y * 2}px)`;
    
    // Mid mountains move slightly faster
    mountainsMid.style.transform = `translate(${x * 10}px, ${y * 5}px)`;

    // Wind lines move faster than background to imply speed
    windLayer.style.transform = `translate(${x * 40}px, ${y * 10}px)`;

    // Cliff moves opposite to mouse (or faster) to frame the subject
    // Since the cliff is on the right, moving it left (negative x) when mouse is right (positive x) 
    // creates a sense of the cliff looming closer.
    cliff.style.transform = `translate(${-x * 15}px, ${-y * 10}px)`;
  });
</script>
</body>
</html>
