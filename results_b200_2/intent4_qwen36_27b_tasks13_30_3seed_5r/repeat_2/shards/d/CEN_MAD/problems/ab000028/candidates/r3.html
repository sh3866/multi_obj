<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verticality // The Descent - Final Revision</title>
<style>
  :root {
    /* Palette: Editorial, Flat UI, Atmospheric */
    --sky-top: #0F172A;
    --sky-mid: #334155;
    --sky-horizon: #F6AD55;
    
    --cliff-face: #1E293B;
    --cliff-shadow: #0F172A;
    --cliff-highlight: #475569;
    --cliff-detail: #020617;
    
    --canopy-primary: #EF4444;
    --canopy-shadow: #B91C1C;
    --canopy-highlight: #FCA5A5;
    
    --text-color: #F8FAFC;
    --text-muted: #94A3B8;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--sky-top);
    font-family: "SF Mono", "Roboto Mono", "Menlo", "Courier New", monospace;
    -webkit-font-smoothing: antialiased;
  }

  /* Layout Structure */
  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* The SVG Scene */
  #scene {
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* UI Overlay Layer */
  .ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
    display: grid;
    grid-template-columns: 40px 1fr 40px;
    grid-template-rows: 40px 1fr 40px;
    padding: 40px;
    box-sizing: border-box;
    opacity: 0.7; /* HUD Opacity reduced */
  }

  /* Typography & Data */
  .data-panel {
    grid-column: 2 / 4; /* Align right */
    grid-row: 1;
    padding-right: 20px;
    text-align: right;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 6px;
  }

  .data-row {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 12px;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 2px;
  }

  .data-value {
    color: var(--text-color);
    font-size: 14px;
    font-weight: 700;
    min-width: 60px;
    text-align: right;
  }

  .status-indicator {
    display: inline-block;
    width: 6px;
    height: 6px;
    background-color: var(--canopy-primary);
    box-shadow: 0 0 8px var(--canopy-primary);
    animation: blink 1.5s infinite;
  }

  /* Animations */
  @keyframes float {
    0% { transform: translate(0px, 0px) rotate(0deg); }
    33% { transform: translate(8px, -20px) rotate(1.5deg); }
    66% { transform: translate(-8px, -10px) rotate(-1.5deg); }
    100% { transform: translate(0px, 0px) rotate(0deg); }
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  @keyframes wind-drift {
    0% { transform: translate(100vw, 0); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.6; }
    100% { transform: translate(-20vw, 0); opacity: 0; }
  }

  .parachute-group {
    animation: float 12s ease-in-out infinite;
    transform-origin: 0px 250px; /* Pivot at harness */
  }

  .wind-streak {
    stroke: #FFF;
    stroke-linecap: round;
    fill: none;
  }

</style>
</head>
<body>

<div id="viewport">
  
  <!-- UI Overlay (Refined) -->
  <div class="ui-layer">
    <!-- Top Right Data -->
    <div class="data-panel">
      <div class="data-row">ALT <span class="data-value">4,200m</span></div>
      <div class="data-row">WIND <span class="data-value">14kts NW</span></div>
      <div class="data-row">STATUS <span class="data-value" style="color:var(--canopy-primary)">SAFE DESCENT</span> <span class="status-indicator"></span></div>
    </div>
  </div>

  <!-- The Scene -->
  <!-- viewBox set to 1200x800. Composition centered-left (x~360), Cliff right (x>900) -->
  <svg id="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Flat Sky Gradient -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:var(--sky-top);stop-opacity:1" />
        <stop offset="45%" style="stop-color:var(--sky-mid);stop-opacity:1" />
        <stop offset="100%" style="stop-color:var(--sky-horizon);stop-opacity:1" />
      </linearGradient>
    </defs>

    <!-- 1. Background Sky -->
    <rect width="1200" height="800" fill="url(#skyGrad)" />

    <!-- 2. Distant Mountains (Atmospheric Depth - Stepped Polygons) -->
    <g opacity="0.4" fill="#1E293B">
      <path d="M0,800 L0,650 L200,550 L450,680 L700,500 L1200,700 L1200,800 Z" />
    </g>
    <g opacity="0.6" fill="#334155">
      <path d="M0,800 L0,700 L150,620 L350,750 L600,600 L900,720 L1200,650 L1200,800 Z" />
    </g>
    <g opacity="0.8" fill="#475569">
      <path d="M0,800 L0,750 L100,680 L400,780 L750,680 L1000,760 L1200,700 L1200,800 Z" />
    </g>

    <!-- 3. Main Cliff Face (Right Side - Foreground) -->
    <!-- Solid continuous path, right 25% (starts x=900) -->
    <g id="cliff">
      <!-- Main Silhouette -->
      <path d="M900,0 L1200,0 L1200,800 L950,800 L920,700 L980,550 L910,400 L990,250 L930,100 L1000,0 Z" fill="var(--cliff-face)" />
      
      <!-- Sharp Shadow Polygon (Volume without blur) -->
      <path d="M900,0 L1000,0 L930,100 L990,250 L910,400 L980,550 L920,700 L950,800 L930,800 L910,700 L960,550 L900,400 L970,250 L910,100 Z" fill="var(--cliff-shadow)" />
      
      <!-- Internal Geometric Strata (Rock Layers) -->
      <path d="M940,100 L990,250 L920,400 L990,550 L930,700 L960,700 L890,550 L960,400 L890,250 L950,100 Z" fill="var(--cliff-highlight)" opacity="0.3" />
      <path d="M980,0 L1050,0 L950,100 L1020,250 L940,400 L1010,550 L960,700 L1000,700 L930,550 L1000,400 L920,250 L990,100 Z" fill="var(--cliff-detail)" opacity="0.4" />
      
      <!-- Texture / Cracks -->
      <path d="M950,300 L970,310 M930,450 L950,460 M960,600 L980,610" stroke="var(--cliff-shadow)" stroke-width="4" stroke-linecap="square" />
    </g>

    <!-- 4. Wind & Debris (Motion Cues - Diagonal Streaks) -->
    <!-- Moving diagonally up-left to down-right logic, or rather across screen to show wind direction -->
    <g id="wind-container">
      <path class="wind-streak" d="M1000,100 L800,150" stroke-width="2" style="animation: wind-drift 2s linear infinite 0s;" />
      <path class="wind-streak" d="M1200,250 L900,320" stroke-width="1" style="animation: wind-drift 3s linear infinite 1s;" />
      <path class="wind-streak" d="M1100,450 L700,550" stroke-width="3" style="animation: wind-drift 2.5s linear infinite 0.5s;" />
      <path class="wind-streak" d="M1300,650 L950,750" stroke-width="2" style="animation: wind-drift 3.5s linear infinite 1.5s;" />
      <path class="wind-streak" d="M1050,50 L850,100" stroke-width="1.5" style="animation: wind-drift 2.2s linear infinite 0.8s;" />
    </g>

    <!-- 5. Parachute Subject Group -->
    <!-- Center-Left: x=360 (30%), y=320 (40%). Scaled up 2.5x -->
    <g id="subject" class="parachute-group" transform="translate(360, 320) scale(2.5)">
      
      <!-- Suspension Lines (Thick, Taut, Converging) -->
      <g stroke="#E2E8F0" stroke-width="0.8" fill="none">
        <!-- Left side lines -->
        <line x1="-160" y1="100" x2="-10" y2="240" />
        <line x1="-100" y1="120" x2="-10" y2="240" />
        <line x1="-40" y1="130" x2="-10" y2="240" />
        <!-- Right side lines -->
        <line x1="40" y1="130" x2="10" y2="240" />
        <line x1="100" y1="120" x2="10" y2="240" />
        <line x1="160" y1="100" x2="10" y2="240" />
      </g>

      <!-- The Human Figure (Distinct Silhouette) -->
      <g transform="translate(0, 240)">
        <!-- Harness -->
        <path d="M-12,0 L12,0 L15,45 L-15,45 Z" fill="#1E293B" />
        
        <!-- Head & Helmet -->
        <circle cx="0" cy="-12" r="10" fill="#F1F5F9" />
        <path d="M-10,-12 Q0,-20 10,-12 L10,-5 Q0,-15 -10,-5 Z" fill="#0F172A" /> <!-- Visor -->
        
        <!-- Arms (Gripping toggles/lines) -->
        <!-- Left Arm -->
        <path d="M-12,5 Q-25,20 -20,30" stroke="#1E293B" stroke-width="7" stroke-linecap="round" fill="none" />
        <!-- Right Arm -->
        <path d="M12,5 Q25,20 20,30" stroke="#1E293B" stroke-width="7" stroke-linecap="round" fill="none" />
        
        <!-- Legs (Dangling, Geometric) -->
        <!-- Left Leg -->
        <path d="M-10,45 L-20,85 L-25,90" stroke="#1E293B" stroke-width="8" stroke-linecap="round" fill="none" />
        <!-- Right Leg -->
        <path d="M10,45 L20,85 L15,95" stroke="#1E293B" stroke-width="8" stroke-linecap="round" fill="none" />
      </g>

      <!-- The Canopy (Fully Inflated, 3D Curve) -->
      <g transform="translate(0, 100)">
        <!-- Main Dome (Lighter Red) -->
        <path d="M-200,0 Q-100,100 0,100 Q100,100 200,0 Q100,-50 0,-50 Q-100,-50 -200,0 Z" fill="var(--canopy-primary)" />
        
        <!-- Secondary Polygon for 3D Curve (Darker Red) -->
        <path d="M-200,0 Q-100,100 0,100 L0,0 Q-100,-50 -200,0 Z" fill="var(--canopy-shadow)" />
        
        <!-- Highlight/Rim for volume -->
        <path d="M-200,0 Q-100,-50 0,-50 Q100,-50 200,0 Q100,20 0,20 Q-100,20 -200,0 Z" fill="var(--canopy-highlight)" opacity="0.4" />
        
        <!-- Structural Ribs -->
        <g stroke="var(--canopy-shadow)" stroke-width="2" fill="none" opacity="0.3">
          <path d="M0,-50 L0,100" />
          <path d="M-50,-45 L-25,100" />
          <path d="M50,-45 L25,100" />
          <path d="M-100,-25 L-50,100" />
          <path d="M100,-25 L50,100" />
          <path d="M-150,0 L-75,100" />
          <path d="M150,0 L75,100" />
        </g>
      </g>

    </g>

    <!-- Foreground Depth Elements (Optional framing) -->
    <path d="M-100,900 L150,600 L300,900 Z" fill="#0F172A" opacity="0.8" />
    <path d="M1300,900 L1050,650 L1200,900 Z" fill="#0F172A" opacity="0.8" />

  </svg>
</div>

<script>
  // Minimal Interaction Logic for Parallax
  
  const scene = document.getElementById('scene');
  const cliff = document.getElementById('cliff');
  const subject = document.getElementById('subject');

  document.addEventListener('mousemove', (e) => {
    // Normalized coordinates -1 to 1
    const x = (e.clientX / window.innerWidth - 0.5) * 2;
    const y = (e.clientY / window.innerHeight - 0.5) * 2;

    // Parallax: Move background elements slightly opposite to mouse
    // Move cliff slightly (it's foreground, so it moves more)
    if(cliff) {
        // We translate the cliff group itself
        cliff.style.transform = `translate(${-x * 15}px, ${-y * 10}px)`;
    }
    
    // Move the entire scene container slightly to create camera shift
    // This moves the background mountains more than the cliff relative to viewport
    scene.style.transform = `translate(${x * 5}px, ${y * 5}px)`;
  });

</script>
</body>
</html>
