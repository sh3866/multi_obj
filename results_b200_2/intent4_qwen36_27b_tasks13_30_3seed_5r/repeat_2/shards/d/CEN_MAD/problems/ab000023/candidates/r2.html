<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Visual | Play Sign</title>
<style>
  :root {
    --bg-wall: #e8eaed;
    --bg-floor: #d1d5da;
    --wall-floor-line: #cfcfcf;
    --sign-face: #ffffff;
    --sign-edge: #dcdcdc;
    --sign-edge-shadow: #a0a0a0;
    --emblem-red: #ff1a1a;
    --emblem-shadow: #990000;
    --metal-light: #ffffff;
    --metal-mid: #b0b0b0;
    --metal-dark: #666666;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: var(--bg-wall);
  }

  /* 1. & 2. Environment & Composition */
  .scene {
    position: relative;
    width: 1280px;
    height: 800px;
    /* Scale this container to fit smaller screens while maintaining aspect ratio */
    transform-origin: center center;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: var(--bg-wall);
  }

  /* Horizon Line (Top 60% / Bottom 40%) */
  .floor {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 40%; /* Bottom 40% */
    background: linear-gradient(to bottom, var(--bg-floor) 0%, #bfbfbf 100%);
    border-top: 1px solid var(--wall-floor-line);
    z-index: 1;
  }

  /* Subtle vignette for studio lighting feel */
  .scene::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0) 40%, rgba(0,0,0,0.1) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* 3. Main Object Wrapper */
  /* Centered in the 1280x800 canvas */
  .product-wrapper {
    position: relative;
    width: 480px;
    height: 480px;
    transform-style: preserve-3d;
    z-index: 10;
    /* Default resting pose: slightly tilted */
    transform: rotateX(4deg) rotateY(-4deg) translateY(-80px);
    transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  /* 4. Sign Materiality (The Board) */
  .sign-face {
    position: absolute;
    width: 100%;
    height: 100%;
    background-color: var(--sign-face);
    border-radius: 24px;
    /* Crisp edge highlight */
    box-shadow: inset 0 1px 0 0 rgba(255,255,255,1);
    transform: translateZ(20px); /* Push forward from thickness */
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 5;
    /* Subtle noise texture for realism */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  }

  /* Thickness Extrusions */
  .sign-edge-top {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 20px;
    background: linear-gradient(to bottom, #ffffff, #e8e8e8);
    border-radius: 24px 24px 0 0;
    transform: rotateX(-90deg) translateY(-10px);
    transform-origin: top;
    z-index: 4;
  }

  .sign-edge-right {
    position: absolute;
    top: 0; right: 0;
    width: 20px; height: 100%;
    background: linear-gradient(to right, #d4d4d4, #a0a0a0);
    border-radius: 0 24px 24px 0;
    transform: rotateY(90deg) translateX(10px);
    transform-origin: right;
    z-index: 4;
  }
  
  .sign-edge-bottom {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 20px;
    background: linear-gradient(to bottom, #a0a0a0, #808080);
    border-radius: 0 0 24px 24px;
    transform: rotateX(-90deg) translateY(460px); /* 480 - 20 */
    transform-origin: bottom;
    z-index: 4;
  }

  /* 5. Mounting Hardware (Heavy Acrylic Stand) */
  .mount-stand {
    position: absolute;
    bottom: -20px; /* Sits on the floor plane */
    left: 50%;
    transform: translateX(-50%) translateZ(10px); /* Centered on thickness */
    width: 120px;
    height: 60px;
    z-index: 6;
    pointer-events: none;
  }

  /* The Base Plate (Floor contact) */
  .mount-base {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 16px;
    background: linear-gradient(to bottom, #a0a0a0, #707070);
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }

  /* The Vertical Pillar */
  .mount-pillar {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 50px;
    background: linear-gradient(90deg, #b0b0b0, #f0f0f0 50%, #b0b0b0);
    border-radius: 4px 4px 0 0;
    box-shadow: 2px 0 5px rgba(0,0,0,0.1);
  }

  /* 6. The Emblem (Red Play Button) */
  .emblem {
    position: relative;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    /* Deep red gradient for volume */
    background: radial-gradient(circle at 35% 35%, #ff4d4d 0%, #ff1a1a 40%, #b30000 100%);
    box-shadow: 
      0 10px 20px rgba(180, 0, 0, 0.3), /* Cast shadow on sign */
      inset 0 2px 5px rgba(255,255,255,0.6), /* Top rim light */
      inset 0 -5px 15px rgba(0,0,0,0.2); /* Bottom inner shadow */
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Specular Highlight */
  .emblem::before {
    content: '';
    position: absolute;
    top: 10%;
    left: 15%;
    width: 40%;
    height: 30%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%);
    transform: rotate(-45deg);
    border-radius: 50%;
    filter: blur(2px);
  }

  /* Play Triangle */
  .play-icon {
    width: 0; 
    height: 0; 
    border-top: 36px solid transparent;
    border-bottom: 36px solid transparent; 
    border-left: 60px solid #ffffff;
    margin-left: 8px; /* Optical centering */
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
    transition: all 0.3s ease;
  }

  /* 7. Shadow System */
  /* Contact Shadow (Behind sign, on wall) */
  .shadow-wall {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    border-radius: 24px;
    /* Light source is Top-Left, so shadow is Bottom-Right */
    transform: translateZ(-5px) translateX(25px) translateY(35px);
    filter: blur(12px);
    opacity: 0.4;
    z-index: 0;
  }

  /* Floor Shadow (Cast by stand onto floor) */
  .shadow-floor {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 250px;
    height: 40px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 70%);
    transform: translate(-50%, -50%) translateY(280px); /* Push down to floor plane */
    filter: blur(8px);
    z-index: 0;
    pointer-events: none;
  }

  /* Interaction States */
  .product-wrapper:hover {
    transform: rotateX(0deg) rotateY(0deg) translateY(-100px);
  }
  
  .product-wrapper:hover .emblem {
    transform: scale(1.05);
  }

  /* Responsive Scaling */
  @media (max-width: 1280px) {
    .scene {
      transform: scale(calc(100vw / 1280));
    }
  }
  @media (max-height: 800px) {
    .scene {
      transform: scale(calc(100vh / 800));
    }
  }
  @media (max-width: 800px) {
    .scene {
      /* Prioritize width on mobile, accept overflow or scale down significantly */
      transform: scale(calc(100vw / 1280));
    }
  }
</style>
</head>
<body>

  <div class="scene" id="scene">
    
    <!-- Floor Plane (Bottom 40%) -->
    <div class="floor"></div>

    <!-- Product Object -->
    <div class="product-wrapper" id="product">
      
      <!-- Shadow Layers -->
      <div class="shadow-wall"></div>
      <div class="shadow-floor"></div>

      <!-- Thickness Edges -->
      <div class="sign-edge-top"></div>
      <div class="sign-edge-right"></div>
      <div class="sign-edge-bottom"></div>

      <!-- The Face -->
      <div class="sign-face">
        <div class="emblem">
          <div class="play-icon"></div>
        </div>
      </div>

      <!-- Mounting Hardware (Stand) -->
      <div class="mount-stand">
        <div class="mount-pillar"></div>
        <div class="mount-base"></div>
      </div>

    </div>

  </div>

  <script>
    // Interactive parallax effect to enhance "Studio" feel
    const scene = document.getElementById('scene');
    const product = document.getElementById('product');
    const shadowWall = document.querySelector('.shadow-wall');
    const shadowFloor = document.querySelector('.shadow-floor');

    // Base transform values
    const baseRotateX = 4;
    const baseRotateY = -4;
    const baseTranslateY = -80;

    scene.addEventListener('mousemove', (e) => {
      const rect = scene.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      // Normalize mouse position relative to scene center (-1 to 1)
      const x = (e.clientX - centerX) / (rect.width / 2);
      const y = (e.clientY - centerY) / (rect.height / 2);

      // Calculate rotation (limited range)
      // Light source is Top-Left, so we rotate slightly towards mouse
      const rotateX = baseRotateX + (y * -8); 
      const rotateY = baseRotateY + (x * 8);  

      // Apply to product
      product.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(${baseTranslateY}px)`;

      // Move shadows opposite to light source (which acts like mouse position here)
      // If mouse is Right (x=1), shadow moves Left (negative x)
      shadowWall.style.transform = `translateZ(-5px) translateX(${25 - (x * 20)}px) translateY(${35 - (y * 10)}px)`;
      
      // Floor shadow moves more aggressively
      shadowFloor.style.transform = `translate(calc(-50% - ${x * 40}px), calc(-50% - ${y * 20}px)) translateY(280px)`;
    });

    scene.addEventListener('mouseleave', () => {
      // Reset to default
      product.style.transform = `rotateX(${baseRotateX}deg) rotateY(${baseRotateY}deg) translateY(${baseTranslateY}px)`;
      shadowWall.style.transform = `translateZ(-5px) translateX(25px) translateY(35px)`;
      shadowFloor.style.transform = `translate(-50%, -50%) translateY(280px)`;
    });
  </script>
</body>
</html>
