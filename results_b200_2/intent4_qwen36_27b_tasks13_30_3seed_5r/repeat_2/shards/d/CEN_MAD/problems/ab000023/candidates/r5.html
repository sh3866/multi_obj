<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Product Visualization | 3D Play Emblem</title>
<style>
  :root {
    /* Lighting & Environment */
    --bg-studio-top: #f4f6f9;
    --bg-studio-bottom: #cfd4dc;
    
    /* Sign Material */
    --sign-face-light: #ffffff;
    --sign-face-shadow: #eceef1;
    --sign-edge-right: #bcc0c7;
    --sign-edge-bottom: #9ea3ac;
    
    /* Emblem Material */
    --emblem-red-base: #e53935;
    --emblem-red-dark: #b71c1c;
    --emblem-red-light: #ff5252;
    --emblem-triangle: #ffffff;
    
    /* Hardware Material */
    --metal-light: #e0e3e7;
    --metal-mid: #a1a5ab;
    --metal-dark: #63686f;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    /* Smooth continuous studio gradient */
    background: radial-gradient(circle at 50% 30%, var(--bg-studio-top), var(--bg-studio-bottom) 80%);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: system-ui, -apple-system, sans-serif;
    cursor: default;
  }

  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1200px; /* Perspective depth */
  }

  /* 
   * PRODUCT GROUP
   * The main container for the 3D assembly
   */
  .product-assembly {
    position: relative;
    width: 440px;
    height: 600px; /* Taller to accommodate wider base */
    transform-style: preserve-3d;
    /* Initial resting pose */
    transform: rotateX(2deg) rotateY(-10deg) translateY(0px); 
    transition: transform 0.1s linear;
  }

  /* 
   * SHADOWS
   * Soft, diffused shadows to ground the object
   */
  .shadow-floor {
    position: absolute;
    top: 520px; /* Aligned with base of stand */
    left: 50%;
    width: 320px;
    height: 80px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 70%);
    transform: translateX(-50%) rotateX(90deg) skewX(-20deg);
    filter: blur(15px);
    z-index: -1;
    pointer-events: none;
  }

  .shadow-wall {
    position: absolute;
    top: 20px;
    right: -80px;
    width: 450px;
    height: 450px;
    background: rgba(0,0,0,0.08);
    filter: blur(40px);
    transform: rotateY(90deg) translateZ(-100px);
    z-index: -2;
    pointer-events: none;
  }

  /* 
   * THE SIGN (3D BLOCK)
   * Constructed via CSS 3D Transforms
   */
  .sign-block {
    position: absolute;
    top: 0;
    left: 0; /* Aligned with stand center */
    width: 440px;
    height: 380px;
    transform-style: preserve-3d;
  }

  /* 1. Front Face */
  .sign-face {
    position: absolute;
    inset: 0;
    border-radius: 40px;
    /* Subtle linear gradient for materiality (Top-Left Light) */
    background: linear-gradient(145deg, var(--sign-face-light) 0%, var(--sign-face-shadow) 100%);
    /* Inner rim light to define edge */
    box-shadow: 
      inset 2px 2px 0px rgba(255,255,255,1), 
      inset -2px -2px 5px rgba(0,0,0,0.05);
    transform: translateZ(40px); /* Thickness depth */
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
  }

  /* 2. Right Extrusion (Shadow side) */
  .sign-side-right {
    position: absolute;
    top: 0;
    right: 0;
    width: 40px; /* Thickness */
    height: 100%;
    background: linear-gradient(to right, #cfd3da, #aeb2ba);
    border-radius: 0 40px 40px 0;
    /* Mapping to right edge */
    transform-origin: right;
    transform: rotateY(90deg) translateZ(0px) translateX(40px);
    z-index: 1;
  }

  /* 3. Bottom Extrusion (Darkest side) */
  .sign-side-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 40px; /* Thickness */
    background: linear-gradient(to bottom, #9ea3ac, #8a9099);
    border-radius: 0 0 40px 40px;
    /* Mapping to bottom edge */
    transform-origin: bottom;
    transform: rotateX(-90deg) translateZ(0px) translateY(40px);
    z-index: 1;
  }

  /* Specular Highlight on Top Edge (Glass/Acrylic feel) */
  .sign-highlight-edge {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 40px;
    background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 30%);
    transform: translateZ(41px);
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  /* 
   * MOUNTING HARDWARE
   * Distinct metallic stand connecting to floor
   */
  .stand-assembly {
    position: absolute;
    bottom: -180px; /* Extends below sign */
    left: 50%;
    transform: translateX(-50%) translateZ(20px); /* Centered on thickness */
    width: 180px;
    height: 200px;
    z-index: 1;
  }

  /* Vertical Pillar */
  .stand-pillar {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 36px; /* Wider for stability */
    height: 150px;
    background: linear-gradient(90deg, var(--metal-dark), var(--metal-light) 40%, var(--metal-dark));
    border-radius: 4px;
    /* Taper effect */
    clip-path: polygon(15% 0, 85% 0, 100% 100%, 0% 100%);
    z-index: 1;
  }

  /* Bracket (The connection point) */
  .bracket {
    position: absolute;
    bottom: 140px; /* Top of pillar */
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 30px;
    background: linear-gradient(to bottom, var(--metal-mid), var(--metal-dark));
    border-radius: 4px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    z-index: 2; /* In front of pillar */
  }
  
  /* Shadow from bracket onto sign face */
  .bracket-shadow {
    position: absolute;
    bottom: -1px; /* Just touching the bottom of the sign face */
    left: 50%;
    transform: translateX(-50%) translateZ(41px);
    width: 50px;
    height: 15px;
    background: rgba(0,0,0,0.15);
    filter: blur(4px);
    border-radius: 50%;
    z-index: 3;
  }

  /* Base Plate */
  .stand-base {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 180px; /* Wider base */
    height: 30px;
    background: linear-gradient(to bottom, var(--metal-light), var(--metal-mid));
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    border-bottom: 1px solid rgba(0,0,0,0.1);
    /* Metallic sheen */
    overflow: hidden;
  }
  
  .stand-base::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.6) 50%, transparent 100%);
    opacity: 0.7;
  }

  /* 
   * THE EMBLEM (Play Button)
   * Physical badge with bevel and glass sheen
   */
  .emblem-container {
    position: relative;
    width: 220px; /* Increased scale */
    height: 220px;
    /* Floats slightly off surface */
    transform: translateZ(10px); 
  }

  .emblem-badge {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    /* Deep red gradient */
    background: radial-gradient(circle at 35% 35%, var(--emblem-red-light) 0%, var(--emblem-red-base) 60%, var(--emblem-red-dark) 100%);
    
    /* Physical depth stack */
    box-shadow: 
      /* Drop shadow on sign */
      10px 20px 30px rgba(0,0,0,0.25), 
      -5px -5px 15px rgba(255,255,255,0.15),
      
      /* Inner Bevel */
      inset 6px 6px 12px rgba(255,255,255,0.35),
      inset -6px -6px 12px rgba(0,0,0,0.35);
      
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* Metallic Rim */
  .emblem-rim {
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.5);
    box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
    pointer-events: none;
  }

  /* Glass Sheen (Top Left) */
  .emblem-sheen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 50%);
    pointer-events: none;
  }

  /* The Triangle */
  .play-icon {
    width: 0;
    height: 0;
    border-top: 32px solid transparent;
    border-bottom: 32px solid transparent;
    border-left: 54px solid var(--emblem-triangle);
    /* Optical centering */
    margin-left: 10px;
    filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.25));
    /* Slight rotation to match lighting perspective */
    transform: skewY(-2deg);
  }

  /* Subtle Noise Texture for realism */
  .noise-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.04;
    mix-blend-mode: multiply;
    z-index: 100;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* Responsive Scaling */
  @media (max-width: 600px) {
    .scene { transform: scale(0.6); }
  }
  @media (min-width: 601px) and (max-width: 1000px) {
    .scene { transform: scale(0.85); }
  }

</style>
</head>
<body>

  <div class="scene" id="scene">
    
    <!-- Product Assembly -->
    <div class="product-assembly" id="product">
      
      <!-- Shadows -->
      <div class="shadow-floor" id="shadowFloor"></div>
      <div class="shadow-wall" id="shadowWall"></div>

      <!-- The 3D Sign Block -->
      <div class="sign-block">
        
        <!-- Thickness Extrusions -->
        <div class="sign-side-right"></div>
        <div class="sign-side-bottom"></div>

        <!-- Front Face -->
        <div class="sign-face">
          <!-- Specular highlight overlay -->
          <div class="sign-highlight-edge"></div>
          
          <!-- Shadow from bracket connection -->
          <div class="bracket-shadow"></div>

          <!-- The Emblem -->
          <div class="emblem-container">
            <div class="emblem-badge">
              <div class="emblem-rim"></div>
              <div class="emblem-sheen"></div>
              <div class="play-icon"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- The Stand (Behind the front face, but attached to bottom) -->
      <div class="stand-assembly">
        <div class="stand-pillar"></div>
        <div class="bracket"></div> <!-- Visible hardware -->
        <div class="stand-base"></div>
      </div>

    </div>

    <!-- Global Texture -->
    <div class="noise-overlay"></div>

  </div>

  <script>
    /**
     * INTERACTIVE PARALLAX
     * Subtle movement to sell the 3D volume
     */
    const scene = document.getElementById('scene');
    const product = document.getElementById('product');
    const shadowFloor = document.getElementById('shadowFloor');
    const shadowWall = document.getElementById('shadowWall');

    const config = {
      rotationSens: 6, // Max degrees (reduced for stability)
      shadowSens: 35,  // Max pixels
      baseRotX: 2,
      baseRotY: -10
    };

    scene.addEventListener('mousemove', (e) => {
      const rect = scene.getBoundingClientRect();
      // Normalized coordinates (-1 to 1)
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;

      // Rotate sign
      const rotY = config.baseRotY + (x * config.rotationSens * 2);
      const rotX = config.baseRotX + (y * -config.rotationSens * 2);
      
      product.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) translateY(0px)`;

      // Move Shadows (Opposite direction)
      const shadowX = -x * config.shadowSens;
      const shadowY = -y * config.shadowSens;

      shadowFloor.style.transform = `translate(calc(-50% + ${shadowX}px), ${shadowY}px) rotateX(90deg) skewX(-20deg)`;
      shadowWall.style.transform = `rotateY(90deg) translateZ(-100px) translate(${shadowX * 0.5}px, ${shadowY * 0.5}px)`;
    });

    // Reset on leave
    scene.addEventListener('mouseleave', () => {
      product.style.transition = 'transform 0.4s ease';
      product.style.transform = `rotateX(${config.baseRotX}deg) rotateY(${config.baseRotY}deg) translateY(0px)`;
      
      shadowFloor.style.transition = 'transform 0.4s ease';
      shadowFloor.style.transform = `translateX(-50%) rotateX(90deg) skewX(-20deg)`;
      
      shadowWall.style.transition = 'transform 0.4s ease';
      shadowWall.style.transform = `rotateY(90deg) translateZ(-100px)`;

      setTimeout(() => {
        product.style.transition = 'transform 0.1s linear';
        shadowFloor.style.transition = 'transform 0.1s linear';
        shadowWall.style.transition = 'transform 0.1s linear';
      }, 400);
    });
  </script>
</body>
</html>
