<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Product Visualization | Play Emblem</title>
<style>
  :root {
    /* Lighting & Environment */
    --light-source-x: 20%;
    --light-source-y: 10%;
    --bg-wall-top: #e0e5ec;
    --bg-wall-bottom: #cfd6df;
    --bg-floor: #aeb5bf;
    --bg-floor-deep: #8a929e;
    --horizon-line: rgba(255,255,255,0.3);
    
    /* Sign Material */
    --sign-white: #ffffff;
    --sign-side-right: #d1d4db; /* Shadow side */
    --sign-side-bottom: #b8bcc6; /* Bottom edge */
    --sign-highlight: #ffffff;
    --sign-occlusion: rgba(0,0,0,0.15);
    
    /* Emblem Material */
    --emblem-base: #d62828;
    --emblem-shadow: #8a1c1c;
    --emblem-highlight: #ff4d4d;
    --emblem-triangle: #ffffff;
    
    /* Hardware Material */
    --chrome-light: #f0f0f0;
    --chrome-mid: #b0b5b9;
    --chrome-dark: #787e84;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    background: linear-gradient(to bottom, var(--bg-wall-top), var(--bg-wall-bottom));
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: system-ui, -apple-system, sans-serif;
  }

  /* 
   * SCENE CONTAINER 
   * Acts as the canvas for our 2.5D composition 
   */
  .scene {
    position: relative;
    width: 1200px;
    height: 800px;
    transform-origin: center center;
    perspective: 1200px; /* Adds depth perception for hover */
    overflow: hidden;
    /* Responsive scaling */
    transform: scale(1);
  }

  /* 
   * BACKGROUND LAYERS 
   * Studio context with horizon line
   */
  .studio-floor {
    position: absolute;
    top: 55%; /* Horizon line position */
    left: 0;
    width: 100%;
    height: 45%;
    background: linear-gradient(180deg, var(--bg-floor) 0%, var(--bg-floor-deep) 100%);
    transform-origin: top center;
    transform: rotateX(20deg); /* Angled floor plane */
    border-top: 1px solid var(--horizon-line);
    z-index: 0;
  }

  /* Soft studio vignette */
  .scene::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 40% 30%, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0.15) 100%);
    pointer-events: none;
    z-index: 50;
  }

  /* 
   * PRODUCT GROUP
   * Holds the sign, stand, and shadows together
   */
  .product-group {
    position: absolute;
    top: 50%;
    left: 50%;
    /* Initial resting position */
    transform: translate(-50%, -55%); 
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
    transition: transform 0.1s linear; /* Smooth JS updates */
  }

  /* 
   * SHADOW SYSTEM (Top-Left Light Source -> Bottom-Right Shadows)
   */
  
  /* 1. Wall Shadow (Behind the sign, simulating distance from wall) */
  .shadow-wall {
    position: absolute;
    top: 20px; /* Offset down */
    left: 20px; /* Offset right */
    width: 400px;
    height: 400px;
    background: rgba(0,0,0,0.15);
    border-radius: 30px;
    filter: blur(15px);
    transform: skewX(-10deg) scale(0.95);
    z-index: -1;
    transition: transform 0.1s linear;
  }

  /* 2. Floor Shadow (Cast by the stand) */
  .shadow-floor {
    position: absolute;
    top: 180px; /* Near the base of the stand */
    left: 50%;
    width: 300px;
    height: 60px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 70%);
    transform: translateX(-50%) skewX(-20deg);
    filter: blur(8px);
    z-index: 0;
    transition: transform 0.1s linear;
  }

  /* 
   * THE SIGN (The Slab Effect)
   * Constructed using CSS 3D transforms to create physical volume
   */
  .sign {
    position: relative;
    width: 400px;
    height: 400px;
    transform-style: preserve-3d;
    /* Slight tilt to show off the volume */
    transform: rotateX(5deg) rotateY(-5deg); 
  }

  /* Front Face */
  .sign-face {
    position: absolute;
    inset: 0;
    background-color: var(--sign-white);
    border-radius: 30px;
    /* Crisp edge highlight (Rim Light) */
    box-shadow: 
      inset 2px 2px 0px rgba(255,255,255,1), /* Top Left Highlight */
      inset 0 0 0 1px rgba(0,0,0,0.05); /* Subtle outline */
    display: flex;
    justify-content: center;
    align-items: center;
    transform: translateZ(20px); /* Pushes face forward to match thickness */
    z-index: 2;
  }

  /* Thickness Extrusion (Right Side - Shadowed) */
  .sign-edge-right {
    position: absolute;
    top: 0;
    right: 0;
    width: 20px; /* Thickness depth */
    height: 100%;
    background: linear-gradient(to right, var(--sign-side-right), #aeb2ba);
    border-radius: 0 30px 30px 0;
    transform-origin: right;
    transform: rotateY(90deg) translateZ(0px) translateX(20px); /* Maps to right edge */
    /* Fix for border-radius on 3D transforms */
    mask-image: linear-gradient(to right, black 95%, transparent 100%);
    z-index: 1;
  }

  /* Thickness Extrusion (Bottom Side - Mid Tone) */
  .sign-edge-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 20px; /* Thickness depth */
    background: linear-gradient(to bottom, var(--sign-side-bottom), #9ea4ae);
    border-radius: 0 0 30px 30px;
    transform-origin: bottom;
    transform: rotateX(-90deg) translateZ(0px) translateY(20px); /* Maps to bottom edge */
    mask-image: linear-gradient(to bottom, black 95%, transparent 100%);
    z-index: 1;
  }

  /* 
   * MOUNTING HARDWARE (The Stand)
   * Replaces vague blob with geometric metallic bracket
   */
  .mount-bracket {
    position: absolute;
    bottom: -25px; /* Sits on bottom edge of sign */
    left: 50%;
    transform: translateX(-50%) translateZ(10px); /* Centered on thickness */
    width: 100px;
    height: 100px;
    z-index: 3;
  }

  /* Vertical Pillar of the stand */
  .bracket-pillar {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: 30px;
    height: 60px;
    background: linear-gradient(90deg, var(--chrome-dark), var(--chrome-light) 40%, var(--chrome-dark));
    border-radius: 4px;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
  }

  /* Horizontal Base Plate of the stand */
  .bracket-base {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 16px;
    background: linear-gradient(to bottom, var(--chrome-light), var(--chrome-mid));
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    border-bottom: 1px solid rgba(0,0,0,0.1);
  }

  /* Hardware Shadow on Sign Face */
  .bracket-shadow {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%) translateZ(21px); /* Just in front of face */
    width: 100px;
    height: 20px;
    background: rgba(0,0,0,0.15);
    filter: blur(6px);
    z-index: 1;
  }

  /* 
   * THE EMBLEM (Play Button)
   * Physical badge look, not a sticker
   */
  .emblem-container {
    position: relative;
    width: 160px;
    height: 160px;
  }

  .emblem {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    /* Matte/Plastic finish gradient */
    background: radial-gradient(circle at 30% 30%, var(--emblem-highlight) 0%, var(--emblem-base) 60%, var(--emblem-shadow) 100%);
    
    /* Complex shadow stack for 3D volume */
    box-shadow: 
      /* 1. Drop shadow on the white sign (Bottom Right) */
      12px 12px 20px rgba(0,0,0,0.25), 
      -2px -2px 10px rgba(255,255,255,0.5), /* Subtle rim light reflection */
      
      /* 2. Inner Bevel (Physical button edge) */
      inset 2px 2px 5px rgba(255,255,255,0.4),
      inset -3px -3px 8px rgba(0,0,0,0.3);
      
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 10;
  }

  /* The Play Triangle */
  .play-triangle {
    width: 0; 
    height: 0; 
    border-top: 28px solid transparent;
    border-bottom: 28px solid transparent; 
    border-left: 45px solid var(--emblem-triangle);
    
    /* Crispness */
    filter: drop-shadow(1px 1px 0px rgba(0,0,0,0.1));
    
    /* Optical Centering adjustment */
    margin-left: 6px; 
    position: relative;
    z-index: 11;
  }

  /* SVG Noise Overlay for texture (Inline Data URI to avoid external requests) */
  .noise-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    opacity: 0.04;
    mix-blend-mode: multiply;
    z-index: 100;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* Responsive Scaling */
  @media (max-width: 1200px) {
    .scene { transform: scale(calc(100vw / 1200)); }
  }
  @media (max-height: 800px) {
    .scene { transform: scale(calc(100vh / 800)); }
  }
  @media (max-width: 800px) {
    .scene { transform: scale(calc(100vw / 1200)); }
  }

</style>
</head>
<body>

  <div class="scene" id="scene">
    
    <!-- 1. Studio Context -->
    <div class="studio-floor"></div>

    <!-- 2. The Product Assembly -->
    <div class="product-group" id="product">
      
      <!-- Shadows (Behind object) -->
      <div class="shadow-wall" id="shadowWall"></div>
      <div class="shadow-floor" id="shadowFloor"></div>

      <!-- The Sign Volume -->
      <div class="sign" id="signBody">
        
        <!-- Mounting Bracket (Attached to back/bottom) -->
        <div class="mount-bracket">
          <div class="bracket-pillar"></div>
          <div class="bracket-base"></div>
        </div>
        
        <!-- Shadow of bracket cast onto sign face -->
        <div class="bracket-shadow"></div>

        <!-- Thickness Extrusions -->
        <div class="sign-edge-right"></div>
        <div class="sign-edge-bottom"></div>

        <!-- Front Face -->
        <div class="sign-face">
          
          <!-- The Emblem -->
          <div class="emblem-container">
            <div class="emblem">
              <div class="play-triangle"></div>
            </div>
          </div>

        </div>
      </div>

    </div>

    <!-- Global Texture Overlay -->
    <div class="noise-overlay"></div>

  </div>

  <script>
    /**
     * INTERACTIVE LIGHTING & PARALLAX
     * Simulates the object reacting to the user's cursor position
     * to reinforce the 3D volume and "Top-Left Light Source" logic.
     */
    const scene = document.getElementById('scene');
    const product = document.getElementById('product');
    const signBody = document.getElementById('signBody');
    const shadowWall = document.getElementById('shadowWall');
    const shadowFloor = document.getElementById('shadowFloor');

    // Configuration
    const maxRotation = 15; // Degrees
    const maxShadowOffset = 20; // Pixels

    scene.addEventListener('mousemove', (e) => {
      const rect = scene.getBoundingClientRect();
      
      // Calculate mouse position relative to center (-1 to 1)
      const x = (e.clientX - (rect.left + rect.width / 2)) / (rect.width / 2);
      const y = (e.clientY - (rect.top + rect.height / 2)) / (rect.height / 2);

      // 1. Rotate the Sign (Parallax)
      // Rotate X based on Y mouse (tilt up/down)
      // Rotate Y based on X mouse (tilt left/right)
      // Note: Light is top-left, so we bias rotation slightly to catch the light
      const rotateX = (y * -maxRotation) + 5; // Base 5deg tilt
      const rotateY = (x * maxRotation) - 5;  // Base -5deg tilt

      signBody.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

      // 2. Move Shadows (Opposite to light/mouse)
      // If mouse is Right (x=1), shadow moves Left (negative)
      // If mouse is Bottom (y=1), shadow moves Up (negative)
      const shadowX = -x * maxShadowOffset;
      const shadowY = -y * maxShadowOffset;

      // Wall shadow moves slightly less (further away)
      shadowWall.style.transform = `skewX(-10deg) scale(0.95) translate(${shadowX * 0.5}px, ${shadowY * 0.5}px)`;
      
      // Floor shadow moves more aggressively (closer to object base)
      shadowFloor.style.transform = `translate(calc(-50% + ${shadowX * 1.5}px), calc(0px + ${shadowY * 0.8}px)) skewX(-20deg)`;
    });

    // Reset on mouse leave
    scene.addEventListener('mouseleave', () => {
      signBody.style.transition = 'transform 0.5s ease';
      signBody.style.transform = `rotateX(5deg) rotateY(-5deg)`;
      
      shadowWall.style.transition = 'transform 0.5s ease';
      shadowWall.style.transform = `skewX(-10deg) scale(0.95)`;
      
      shadowFloor.style.transition = 'transform 0.5s ease';
      shadowFloor.style.transform = `translateX(-50%) skewX(-20deg)`;

      // Remove transition after animation settles to keep mousemove snappy
      setTimeout(() => {
        signBody.style.transition = '';
        shadowWall.style.transition = '';
        shadowFloor.style.transition = '';
      }, 500);
    });
  </script>
</body>
</html>
