<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play Sign | Product Visual</title>
<style>
  :root {
    --bg-studio: #eef0f2;
    --bg-floor: #dcdfe3;
    --sign-face: #ffffff;
    --sign-edge-top: #f0f0f0;
    --sign-edge-side: #b8b8b8;
    --sign-edge-bottom: #9e9e9e;
    --red-primary: #ff1a1a;
    --red-shadow: #a30000;
    --metal-light: #ffffff;
    --metal-mid: #b0b0b0;
    --metal-dark: #707070;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-studio);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Studio Environment */
  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 40%, #ffffff 0%, #eef0f2 50%, #dcdfe3 100%);
    perspective: 1500px;
    overflow: hidden;
  }

  /* The Floor Plane (Bottom 20%) */
  .floor {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 22%; /* Slightly more than 20% to ensure contact */
    background: linear-gradient(to bottom, #dcdfe3 0%, #cfd2d6 100%);
    border-top: 1px solid rgba(0,0,0,0.05);
    transform-origin: bottom;
    z-index: 0;
    /* Mask for soft blend into background */
    mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%);
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%);
  }

  /* Main Object Wrapper */
  .product-wrapper {
    position: relative;
    width: 440px;
    height: 440px;
    transform-style: preserve-3d;
    /* Default resting pose */
    transform: rotateX(4deg) rotateY(-4deg) translateY(-60px);
    transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    z-index: 10;
  }

  /* 1. The Sign Face */
  .sign-face {
    position: absolute;
    width: 100%;
    height: 100%;
    background-color: var(--sign-face);
    border-radius: 28px;
    /* Subtle texture for realism */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.02'/%3E%3C/svg%3E");
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
    transform: translateZ(20px); /* Push forward from thickness */
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 5;
  }

  /* 2. The Thickness (Extrusion) */
  /* Top Edge */
  .edge-top {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 20px;
    background: linear-gradient(to bottom, #ffffff, #e8e8e8);
    border-radius: 28px 28px 0 0;
    transform: rotateX(-90deg) translateZ(0px) translateY(-10px);
    transform-origin: top;
    z-index: 4;
  }

  /* Side Edge (Right) - Simulating depth */
  .edge-right {
    position: absolute;
    top: 0;
    right: 0;
    width: 20px;
    height: 100%;
    background: linear-gradient(to right, #d4d4d4, #a8a8a8);
    border-radius: 0 28px 28px 0;
    transform: rotateY(90deg) translateZ(0px) translateX(10px);
    transform-origin: right;
    z-index: 4;
  }
  
  /* Bottom Edge (Front face of the thickness) */
  .edge-bottom {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 20px;
    background: linear-gradient(to bottom, #b0b0b0, #8a8a8a);
    border-radius: 0 0 28px 28px;
    transform: rotateX(-90deg) translateZ(0px) translateY(420px); /* 440 - 20 */
    transform-origin: bottom;
    z-index: 4;
  }

  /* 3. Mounting Hardware (D-Ring Bracket) */
  .mount-bracket {
    position: absolute;
    top: -20px; /* Sits on top edge */
    left: 50%;
    transform: translateX(-50%) translateZ(10px); /* Centered on thickness */
    width: 80px;
    height: 40px;
    z-index: 6;
    pointer-events: none;
  }

  /* The U-Bolt / Clevis */
  .mount-bolt {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 24px;
    background: linear-gradient(90deg, #777, #fff 40%, #777);
    border-radius: 2px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }

  /* The D-Ring */
  .mount-ring {
    position: absolute;
    top: 2px;
    left: 50%;
    transform: translateX(-50%);
    width: 28px;
    height: 36px;
    border: 4px solid #999;
    border-bottom: none;
    border-radius: 14px 14px 0 0;
    background: transparent;
    box-shadow: 0 4px 5px rgba(0,0,0,0.2);
  }
  
  /* Ring Highlight */
  .mount-ring::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 100%;
    height: 100%;
    border: 1px solid rgba(255,255,255,0.4);
    border-bottom: none;
    border-radius: 14px 14px 0 0;
  }

  /* 4. The Emblem (Red Play Button) */
  .emblem {
    position: relative;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    /* Multi-stop radial gradient for volume */
    background: radial-gradient(circle at 35% 35%, #ff5252 0%, #ff1a1a 50%, #b30000 100%);
    box-shadow: 
      0 15px 35px rgba(180, 0, 0, 0.4), /* Deep ambient shadow */
      inset 0 2px 5px rgba(255,255,255,0.5), /* Top rim light */
      inset 0 -5px 15px rgba(0,0,0,0.2); /* Bottom shadow */
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Glossy Specular Highlight */
  .emblem::before {
    content: '';
    position: absolute;
    top: 12%;
    left: 18%;
    width: 35%;
    height: 25%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0) 70%);
    transform: rotate(-45deg);
    border-radius: 50%;
    filter: blur(1px);
  }

  /* The Play Triangle */
  .play-icon {
    width: 0; 
    height: 0; 
    border-top: 32px solid transparent;
    border-bottom: 32px solid transparent; 
    border-left: 52px solid #ffffff;
    margin-left: 6px; /* Optical centering */
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
    transition: all 0.3s ease;
  }

  /* 5. Shadow System */
  /* Contact Shadow (Tight, behind sign) */
  .shadow-contact {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    border-radius: 28px;
    transform: translateZ(-5px) translateX(15px) translateY(25px);
    filter: blur(10px);
    opacity: 0.6;
    z-index: 0;
  }

  /* Floor Shadow (Wide, diffuse, on the floor plane) */
  .shadow-floor {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 300px;
    height: 60px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 70%);
    transform: translate(-50%, -50%) translateY(260px) scale(1.2); /* Push down to floor */
    filter: blur(15px);
    z-index: 0;
    pointer-events: none;
  }

  /* Interaction States */
  .product-wrapper:hover {
    transform: rotateX(0deg) rotateY(0deg) translateY(-70px);
  }
  
  .product-wrapper:hover .emblem {
    transform: scale(1.05);
  }

  .product-wrapper:hover .shadow-contact {
    transform: translateZ(-5px) translateX(5px) translateY(15px);
    filter: blur(15px);
    opacity: 0.4;
  }
  
  .product-wrapper:hover .shadow-floor {
    transform: translate(-50%, -50%) translateY(250px) scale(1.1);
    opacity: 0.5;
  }

</style>
</head>
<body>

  <div class="scene">
    
    <!-- Floor Plane -->
    <div class="floor"></div>

    <!-- Product Object -->
    <div class="product-wrapper" id="product">
      
      <!-- Shadow Layers -->
      <div class="shadow-contact"></div>
      <div class="shadow-floor"></div>

      <!-- Thickness Edges -->
      <div class="edge-top"></div>
      <div class="edge-right"></div>
      <div class="edge-bottom"></div>

      <!-- The Face -->
      <div class="sign-face">
        <div class="emblem">
          <div class="play-icon"></div>
        </div>
      </div>

      <!-- Mounting Hardware -->
      <div class="mount-bracket">
        <div class="mount-ring"></div>
        <div class="mount-bolt"></div>
      </div>

    </div>

  </div>

  <script>
    // Interactive parallax effect
    const scene = document.querySelector('.scene');
    const product = document.getElementById('product');
    const shadowContact = document.querySelector('.shadow-contact');
    const shadowFloor = document.querySelector('.shadow-floor');

    scene.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      // Normalize mouse position -1 to 1
      const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
      const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);

      // Calculate rotation (limited range)
      const rotateX = -y * 12; // Tilt up/down
      const rotateY = x * 12;  // Turn left/right

      // Apply to product
      // Note: We add the base rotation (-4deg Y) to the mouse movement
      product.style.transform = `rotateX(${4 + rotateX}deg) rotateY(${-4 + rotateY}deg) translateY(-60px)`;

      // Move shadows opposite to light source (mouse)
      // Contact shadow moves slightly
      shadowContact.style.transform = `translateZ(-5px) translateX(${15 - (x * 10)}px) translateY(${25 - (y * 5)}px)`;
      
      // Floor shadow moves more aggressively
      shadowFloor.style.transform = `translate(calc(-50% - ${x * 30}px), calc(-50% - ${y * 20}px)) translateY(260px) scale(1.2)`;
    });

    scene.addEventListener('mouseleave', () => {
      // Reset to default
      product.style.transform = `rotateX(4deg) rotateY(-4deg) translateY(-60px)`;
      shadowContact.style.transform = `translateZ(-5px) translateX(15px) translateY(25px)`;
      shadowFloor.style.transform = `translate(-50%, -50%) translateY(260px) scale(1.2)`;
    });
  </script>
</body>
</html>
