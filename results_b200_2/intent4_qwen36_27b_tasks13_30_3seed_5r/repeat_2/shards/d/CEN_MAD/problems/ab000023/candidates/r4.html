<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Product Visualization | 3D Play Emblem</title>
<style>
  :root {
    /* Lighting & Environment */
    --bg-studio-top: #f0f2f5;
    --bg-studio-bottom: #dcdfe4;
    --bg-floor-top: #e8eaed;
    --bg-floor-bottom: #b0b5bd;
    
    /* Sign Material */
    --sign-face-base: #ffffff;
    --sign-face-shadow: #f4f6f8;
    --sign-edge-right: #c4c8d0;
    --sign-edge-bottom: #9ea3ac;
    --sign-highlight: #ffffff;
    
    /* Emblem Material */
    --emblem-red-base: #e53935;
    --emblem-red-dark: #b71c1c;
    --emblem-red-light: #ff5252;
    --emblem-triangle: #ffffff;
    
    /* Hardware Material */
    --metal-light: #e0e3e7;
    --metal-mid: #a1a5ab;
    --metal-dark: #63686f;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    /* Smooth continuous studio gradient (Fixing Horizon Line) */
    background: radial-gradient(circle at 50% 40%, var(--bg-studio-top), var(--bg-studio-bottom) 60%, var(--bg-floor-bottom) 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: system-ui, -apple-system, sans-serif;
    cursor: default;
  }

  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 1400px;
    max-height: 900px;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1500px; /* Stronger perspective */
  }

  /* 
   * PRODUCT GROUP
   * The main container for the 3D assembly
   */
  .product-assembly {
    position: relative;
    width: 420px;
    height: 500px; /* Taller to accommodate stand */
    transform-style: preserve-3d;
    /* Initial resting pose */
    transform: rotateX(4deg) rotateY(-8deg) translateY(-50px); 
    transition: transform 0.1s linear;
  }

  /* 
   * SHADOWS
   * Soft, diffused shadows to ground the object
   */
  .shadow-floor {
    position: absolute;
    top: 320px; /* Aligned with base of stand */
    left: 50%;
    width: 300px;
    height: 60px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0) 70%);
    transform: translateX(-50%) rotateX(90deg) skewX(-20deg);
    filter: blur(12px);
    z-index: -1;
    pointer-events: none;
  }

  .shadow-wall {
    position: absolute;
    top: 10px;
    right: -60px;
    width: 400px;
    height: 400px;
    background: rgba(0,0,0,0.1);
    filter: blur(30px);
    transform: rotateY(90deg) translateZ(-50px);
    z-index: -2;
    pointer-events: none;
  }

  /* 
   * THE SIGN (3D BLOCK)
   * Constructed via CSS 3D Transforms
   */
  .sign-block {
    position: absolute;
    top: 0;
    left: 10px; /* Center relative to stand */
    width: 400px;
    height: 400px;
    transform-style: preserve-3d;
  }

  /* 1. Front Face */
  .sign-face {
    position: absolute;
    inset: 0;
    border-radius: 32px;
    /* Subtle linear gradient for materiality (Top-Left Light) */
    background: linear-gradient(135deg, var(--sign-face-base) 0%, var(--sign-face-shadow) 100%);
    /* Inner rim light */
    box-shadow: 
      inset 1px 1px 0px rgba(255,255,255,1), 
      inset -2px -2px 0px rgba(0,0,0,0.03);
    transform: translateZ(30px); /* Thickness depth */
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
  }

  /* 2. Right Extrusion (Shadow side) */
  .sign-side-right {
    position: absolute;
    top: 0;
    right: 0;
    width: 30px; /* Thickness */
    height: 100%;
    background: linear-gradient(to right, var(--sign-edge-right), #aeb2ba);
    border-radius: 0 32px 32px 0;
    /* Mapping to right edge */
    transform-origin: right;
    transform: rotateY(90deg) translateZ(0px) translateX(30px);
    mask-image: linear-gradient(to right, black 90%, transparent 100%);
    z-index: 1;
  }

  /* 3. Bottom Extrusion (Darkest side) */
  .sign-side-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 30px; /* Thickness */
    background: linear-gradient(to bottom, var(--sign-edge-bottom), #8a9099);
    border-radius: 0 0 32px 32px;
    /* Mapping to bottom edge */
    transform-origin: bottom;
    transform: rotateX(-90deg) translateZ(0px) translateY(30px);
    mask-image: linear-gradient(to bottom, black 90%, transparent 100%);
    z-index: 1;
  }

  /* Specular Highlight on Top Edge (Glass/Acrylic feel) */
  .sign-highlight-edge {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 32px;
    background: linear-gradient(135deg, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 40%);
    transform: translateZ(31px);
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  /* 
   * MOUNTING HARDWARE
   * Distinct metallic stand connecting to floor
   */
  .stand-assembly {
    position: absolute;
    bottom: -120px; /* Extends below sign */
    left: 50%;
    transform: translateX(-50%) translateZ(15px); /* Centered on thickness */
    width: 160px;
    height: 140px;
    z-index: 1;
  }

  /* Vertical Pillar */
  .stand-pillar {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 100px;
    background: linear-gradient(90deg, var(--metal-dark), var(--metal-light) 40%, var(--metal-dark));
    border-radius: 4px;
    /* Taper effect */
    clip-path: polygon(10% 0, 90% 0, 100% 100%, 0% 100%);
  }

  /* Base Plate */
  .stand-base {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    height: 24px;
    background: linear-gradient(to bottom, var(--metal-light), var(--metal-mid));
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    border-bottom: 1px solid rgba(0,0,0,0.1);
    /* Metallic sheen */
    overflow: hidden;
  }
  
  .stand-base::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.5) 50%, transparent 100%);
    opacity: 0.6;
  }

  /* Connection point (Shadow on sign) */
  .stand-connection-shadow {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%) translateZ(31px);
    width: 40px;
    height: 10px;
    background: rgba(0,0,0,0.2);
    filter: blur(5px);
    border-radius: 50%;
    z-index: 3;
  }

  /* 
   * THE EMBLEM (Play Button)
   * Physical badge with bevel and glass sheen
   */
  .emblem-container {
    position: relative;
    width: 180px;
    height: 180px;
    /* Floats slightly off surface */
    transform: translateZ(5px); 
  }

  .emblem-badge {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    /* Deep red gradient */
    background: radial-gradient(circle at 35% 35%, var(--emblem-red-light) 0%, var(--emblem-red-base) 60%, var(--emblem-red-dark) 100%);
    
    /* Physical depth stack */
    box-shadow: 
      /* Drop shadow on sign */
      10px 15px 25px rgba(0,0,0,0.3), 
      -3px -3px 10px rgba(255,255,255,0.2),
      
      /* Inner Bevel */
      inset 4px 4px 8px rgba(255,255,255,0.3),
      inset -4px -4px 10px rgba(0,0,0,0.3);
      
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* Metallic Rim */
  .emblem-rim {
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.4);
    box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
    pointer-events: none;
  }

  /* Glass Sheen (Top Left) */
  .emblem-sheen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 50%);
    pointer-events: none;
  }

  /* The Triangle */
  .play-icon {
    width: 0;
    height: 0;
    border-top: 26px solid transparent;
    border-bottom: 26px solid transparent;
    border-left: 44px solid var(--emblem-triangle);
    /* Optical centering */
    margin-left: 6px;
    filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.2));
  }

  /* Subtle Noise Texture for realism */
  .noise-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.05;
    mix-blend-mode: multiply;
    z-index: 100;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* Responsive Scaling */
  @media (max-width: 600px) {
    .scene { transform: scale(0.6); }
  }
  @media (min-width: 601px) and (max-width: 1000px) {
    .scene { transform: scale(0.8); }
  }

</style>
</head>
<body>

  <div class="scene" id="scene">
    
    <!-- Product Assembly -->
    <div class="product-assembly" id="product">
      
      <!-- Shadows -->
      <div class="shadow-floor" id="shadowFloor"></div>
      <div class="shadow-wall" id="shadowWall"></div>

      <!-- The 3D Sign Block -->
      <div class="sign-block">
        
        <!-- Thickness Extrusions -->
        <div class="sign-side-right"></div>
        <div class="sign-side-bottom"></div>

        <!-- Front Face -->
        <div class="sign-face">
          <!-- Specular highlight overlay -->
          <div class="sign-highlight-edge"></div>
          
          <!-- Shadow from stand connection -->
          <div class="stand-connection-shadow"></div>

          <!-- The Emblem -->
          <div class="emblem-container">
            <div class="emblem-badge">
              <div class="emblem-rim"></div>
              <div class="emblem-sheen"></div>
              <div class="play-icon"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- The Stand (Behind the front face, but attached to bottom) -->
      <div class="stand-assembly">
        <div class="stand-pillar"></div>
        <div class="stand-base"></div>
      </div>

    </div>

    <!-- Global Texture -->
    <div class="noise-overlay"></div>

  </div>

  <script>
    /**
     * INTERACTIVE PARALLAX
     * Subtle movement to sell the 3D volume
     */
    const scene = document.getElementById('scene');
    const product = document.getElementById('product');
    const shadowFloor = document.getElementById('shadowFloor');
    const shadowWall = document.getElementById('shadowWall');

    const config = {
      rotationSens: 8, // Max degrees
      shadowSens: 30,  // Max pixels
      baseRotX: 4,
      baseRotY: -8
    };

    scene.addEventListener('mousemove', (e) => {
      const rect = scene.getBoundingClientRect();
      // Normalized coordinates (-1 to 1)
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;

      // Rotate sign
      // Note: Mouse X affects Y rotation, Mouse Y affects X rotation
      const rotY = config.baseRotY + (x * config.rotationSens * 2);
      const rotX = config.baseRotX + (y * -config.rotationSens * 2);
      
      product.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) translateY(-50px)`;

      // Move Shadows (Opposite direction)
      const shadowX = -x * config.shadowSens;
      const shadowY = -y * config.shadowSens;

      shadowFloor.style.transform = `translate(calc(-50% + ${shadowX}px), ${shadowY}px) rotateX(90deg) skewX(-20deg)`;
      shadowWall.style.transform = `rotateY(90deg) translateZ(-50px) translate(${shadowX * 0.5}px, ${shadowY * 0.5}px)`;
    });

    // Reset on leave
    scene.addEventListener('mouseleave', () => {
      product.style.transition = 'transform 0.4s ease';
      product.style.transform = `rotateX(${config.baseRotX}deg) rotateY(${config.baseRotY}deg) translateY(-50px)`;
      
      shadowFloor.style.transition = 'transform 0.4s ease';
      shadowFloor.style.transform = `translateX(-50%) rotateX(90deg) skewX(-20deg)`;
      
      shadowWall.style.transition = 'transform 0.4s ease';
      shadowWall.style.transform = `rotateY(90deg) translateZ(-50px)`;

      setTimeout(() => {
        product.style.transition = 'transform 0.1s linear';
        shadowFloor.style.transition = 'transform 0.1s linear';
        shadowWall.style.transition = 'transform 0.1s linear';
      }, 400);
    });
  </script>
</body>
</html>
