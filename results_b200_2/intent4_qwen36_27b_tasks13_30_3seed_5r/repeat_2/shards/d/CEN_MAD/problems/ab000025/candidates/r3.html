<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editorial Close-Up: The Grip</title>
<style>
    :root {
        --bg-dark: #080808;
        --bg-accent: #1c1c1c;
        --text-meta: #555555;
        --font-main: "Helvetica Neue", Helvetica, Arial, sans-serif;
        --font-mono: "Menlo", "Courier New", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg-dark);
        background: radial-gradient(circle at 50% 40%, var(--bg-accent) 0%, var(--bg-dark) 100%);
        color: #fff;
        font-family: var(--font-main);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    /* Film Grain Overlay */
    .grain {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 10;
        opacity: 0.06;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* UI Layout - Minimalist */
    header {
        padding: 1.5rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        z-index: 5;
        font-family: var(--font-mono);
        font-size: 0.6rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-meta);
        opacity: 0.4; /* Reduced opacity per critique */
        transition: opacity 0.3s ease;
    }

    .meta-right {
        text-align: right;
        line-height: 1.5;
    }

    main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        perspective: 1000px;
    }

    /* The SVG Container */
    .art-stage {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    svg {
        height: 110vh; /* Taller to fill vertical space */
        width: auto;
        max-width: 100%;
        filter: drop-shadow(0px 20px 50px rgba(0,0,0,0.8));
        transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
        transform-style: preserve-3d;
    }

</style>
</head>
<body>

    <div class="grain"></div>

    <header>
        <div class="meta-left">
            Project: Haptic<br>
            View: Macro
        </div>
        <div class="meta-right">
            FIG. 05 — REVISION<br>
            SCALE: 1:1
        </div>
    </header>

    <main>
        <div class="art-stage">
            <!-- 
                REBUILT SVG 
                ViewBox: 0 0 800 1200 (Vertical crop for close-up)
                Center of action is roughly 400, 600
            -->
            <svg viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- SKIN GRADIENTS -->
                    <!-- Base Skin: Warmer, more organic -->
                    <radialGradient id="skinBase" cx="30%" cy="30%" r="90%">
                        <stop offset="0%" stop-color="#F2D0B8" />
                        <stop offset="50%" stop-color="#E0A685" />
                        <stop offset="100%" stop-color="#A86E4A" />
                    </radialGradient>
                    
                    <!-- Deep Shadow (Creases) -->
                    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#000" stop-opacity="0" />
                        <stop offset="100%" stop-color="#4a2e1e" stop-opacity="0.9" />
                    </linearGradient>

                    <!-- Rim Light Gradient -->
                    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#FFF" stop-opacity="0" />
                        <stop offset="80%" stop-color="#FFF" stop-opacity="0.8" />
                        <stop offset="100%" stop-color="#FFF" stop-opacity="0" />
                    </linearGradient>

                    <!-- PHONE MATERIALS -->
                    <!-- Titanium Bezel -->
                    <linearGradient id="phoneBezel" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#1a1a1a" />
                        <stop offset="15%" stop-color="#4a4a4a" />
                        <stop offset="50%" stop-color="#2a2a2a" />
                        <stop offset="100%" stop-color="#000" />
                    </linearGradient>
                    
                    <!-- Screen Glass -->
                    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#1e1e28" />
                        <stop offset="100%" stop-color="#050508" />
                    </linearGradient>

                    <!-- Glare -->
                    <linearGradient id="glare" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#fff" stop-opacity="0.1" />
                        <stop offset="30%" stop-color="#fff" stop-opacity="0.0" />
                    </linearGradient>

                    <!-- FILTERS -->
                    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="4" />
                    </filter>
                    
                    <filter id="shadowBlur" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="8" />
                    </filter>

                    <filter id="glowRed" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="2" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>

                <!-- 1. BACKGROUND HAND (Fingers wrapping around back) -->
                <!-- These are positioned behind the phone body -->
                <g id="fingers-back">
                    <!-- Index Finger (Top) -->
                    <g transform="translate(360, 200) rotate(10)">
                        <!-- Finger Body -->
                        <path d="M0,40 Q80,0 200,20 L190,100 Q80,90 0,70 Z" fill="url(#skinBase)" />
                        <!-- Shadow -->
                        <path d="M0,40 Q80,0 200,20 L190,100 Q80,90 0,70 Z" fill="url(#skinShadow)" opacity="0.5" />
                        <!-- Knuckle Highlight -->
                        <path d="M100,15 Q110,5 130,15" fill="none" stroke="#F2D0B8" stroke-width="4" opacity="0.6" filter="url(#blurSoft)" />
                        <!-- Nail -->
                        <path d="M190,25 Q205,20 200,40 Q190,45 190,25" fill="#F5D0B5" opacity="0.8" />
                    </g>

                    <!-- Middle Finger -->
                    <g transform="translate(350, 320) rotate(5)">
                         <path d="M0,40 Q80,10 210,30 L200,110 Q80,90 0,70 Z" fill="url(#skinBase)" />
                         <path d="M0,40 Q80,10 210,30 L200,110 Q80,90 0,70 Z" fill="url(#skinShadow)" opacity="0.6" />
                         <path d="M110,20 Q120,10 140,20" fill="none" stroke="#F2D0B8" stroke-width="4" opacity="0.5" filter="url(#blurSoft)" />
                         <!-- Nail -->
                         <path d="M205,35 Q220,30 215,50 Q205,55 205,35" fill="#F5D0B5" opacity="0.8" />
                    </g>

                    <!-- Ring Finger -->
                    <g transform="translate(340, 440) rotate(0)">
                         <path d="M0,40 Q70,20 200,40 L190,120 Q70,100 0,80 Z" fill="url(#skinBase)" />
                         <path d="M0,40 Q70,20 200,40 L190,120 Q70,100 0,80 Z" fill="url(#skinShadow)" opacity="0.7" />
                         <!-- Nail -->
                         <path d="M195,45 Q210,40 205,60 Q195,65 195,45" fill="#F5D0B5" opacity="0.8" />
                    </g>

                    <!-- Pinky Finger -->
                    <g transform="translate(330, 560) rotate(-5)">
                         <path d="M0,40 Q60,30 180,50 L170,130 Q60,110 0,80 Z" fill="url(#skinBase)" />
                         <path d="M0,40 Q60,30 180,50 L170,130 Q60,110 0,80 Z" fill="url(#skinShadow)" opacity="0.8" />
                         <!-- Nail -->
                         <path d="M175,55 Q190,50 185,70 Q175,75 175,55" fill="#F5D0B5" opacity="0.8" />
                    </g>
                </g>

                <!-- 2. THE SMARTPHONE -->
                <!-- Centered vertically, slightly offset left to balance thumb -->
                <g id="phone">
                    <!-- Main Body -->
                    <rect x="280" y="-50" width="320" height="1300" rx="36" fill="url(#phoneBezel)" />
                    
                    <!-- RIGHT EDGE SPECULAR (Critique Point 3) -->
                    <!-- Creates a sharp white line on the right to separate from dark bg -->
                    <rect x="596" y="-40" width="4" height="1280" rx="2" fill="#FFFFFF" opacity="0.3" filter="url(#blurSoft)" />
                    <rect x="598" y="-40" width="2" height="1280" rx="1" fill="#FFFFFF" opacity="0.8" />

                    <!-- Screen Area -->
                    <rect x="295" y="-35" width="290" height="1270" rx="24" fill="url(#screenGlass)" />

                    <!-- Screen Content -->
                    <g clip-path="url(#screenClip)">
                        <clipPath id="screenClip">
                            <rect x="295" y="-35" width="290" height="1270" rx="24" />
                        </clipPath>
                        
                        <!-- Abstract UI -->
                        <rect x="315" y="200" width="250" height="150" rx="12" fill="#FFFFFF" opacity="0.02" />
                        <rect x="315" y="400" width="250" height="100" rx="12" fill="#FFFFFF" opacity="0.01" />
                        
                        <!-- Glare -->
                        <path d="M295,-35 L585,-35 L585,200 L295,500 Z" fill="url(#glare)" />
                        
                        <!-- Hardware Details (Critique Point 4) -->
                        <!-- Speaker Grille -->
                        <rect x="410" y="-20" width="60" height="4" rx="2" fill="#000" opacity="0.8" />
                        <!-- Earpiece Mesh Detail -->
                        <line x1="420" y1="-18" x2="460" y2="-18" stroke="#333" stroke-width="1" />
                        <!-- Camera Lens -->
                        <circle cx="330" cy="-20" r="4" fill="#0a0a0a" stroke="#333" stroke-width="1" />
                        <circle cx="330" cy="-20" r="1.5" fill="#1a1a2e" />
                        
                        <!-- Red Indicator Light -->
                        <circle cx="540" cy="-20" r="2" fill="#FF3B30" filter="url(#glowRed)" />
                    </g>
                </g>

                <!-- 3. THE HAND (Front Layer - Palm & Thumb) -->
                <g id="palm-thumb">
                    
                    <!-- Palm Base -->
                    <path d="M-50,600 Q50,800 150,1250 L500,1250 Q400,800 350,600 Z" fill="url(#skinBase)" />
                    
                    <!-- Palm Creases (Anatomy) -->
                    <path d="M100,700 Q200,720 300,650" fill="none" stroke="#7A4B30" stroke-width="4" opacity="0.5" stroke-linecap="round" filter="url(#blurSoft)"/>
                    <path d="M150,550 Q100,600 80,700" fill="none" stroke="#7A4B30" stroke-width="3" opacity="0.4" stroke-linecap="round" filter="url(#blurSoft)"/>

                    <!-- The Thumb -->
                    <g transform="translate(0,0)">
                        <!-- Contact Shadow: Cast by thumb onto screen -->
                        <!-- Must be behind thumb but over screen -->
                        <path d="M350,500 Q420,480 450,520 L460,580 Q400,600 350,580 Z" fill="#000" opacity="0.6" filter="url(#shadowBlur)" style="mix-blend-mode: multiply;" />

                        <!-- Proximal Phalanx (Base) -->
                        <path d="M250,600 Q350,550 400,480 L360,450 Q320,500 220,560 Z" fill="url(#skinBase)" />
                        
                        <!-- Distal Phalanx (Tip) -->
                        <path d="M390,470 Q450,430 460,400 L410,410 Q430,440 380,460 Z" fill="url(#skinBase)" />
                        
                        <!-- Webbing Area (Between thumb and index) -->
                        <path d="M250,600 Q300,580 350,600" fill="none" stroke="#8C5A3C" stroke-width="2" opacity="0.3" />

                        <!-- Knuckle Joint (Visible protrusion) -->
                        <path d="M380,480 Q400,470 410,480" fill="none" stroke="#F2D0B8" stroke-width="3" opacity="0.7" stroke-linecap="round" />
                        
                        <!-- Fingernail (Critique Point 2) -->
                        <path d="M455,405 Q465,395 460,390 Q450,395 445,405 Z" fill="#F5D0B5" opacity="0.9" />
                        <!-- Nail Highlight -->
                        <path d="M450,400 Q455,395 452,402" fill="none" stroke="#FFF" stroke-width="1" opacity="0.8" />

                        <!-- Rim Light on Thumb (Critique Point 3) -->
                        <!-- Separates the thumb from the dark phone screen -->
                        <path d="M220,560 Q320,500 360,450 L380,460" fill="none" stroke="#FFF" stroke-width="1.5" opacity="0.4" filter="url(#blurSoft)" />
                        <path d="M360,450 L410,410" fill="none" stroke="#FFF" stroke-width="1" opacity="0.5" filter="url(#blurSoft)" />
                    </g>
                </g>

            </svg>
        </div>
    </main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const svgElement = document.querySelector('svg');
        const thumbGroup = document.getElementById('palm-thumb');
        
        // Subtle Parallax Effect
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 150; // Reduced sensitivity
            const y = (window.innerHeight / 2 - e.pageY) / 150;

            svgElement.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;

            // Thumb moves slightly differently to create depth
            if(thumbGroup) {
                const thumbX = x * 0.2; 
                const thumbY = y * 0.2;
                thumbGroup.style.transform = `translate(${thumbX}px, ${thumbY}px)`;
            }
        });

        // Reset on leave
        document.addEventListener('mouseleave', () => {
            svgElement.style.transform = `rotateY(0deg) rotateX(0deg)`;
            if(thumbGroup) thumbGroup.style.transform = `translate(0px, 0px)`;
        });
    });
</script>
</body>
</html>
