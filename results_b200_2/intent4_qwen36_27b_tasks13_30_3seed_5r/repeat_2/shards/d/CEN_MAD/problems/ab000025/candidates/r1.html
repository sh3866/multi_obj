<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editorial Close-Up: The Grip</title>
<style>
    :root {
        --bg: #D8D6D1; /* Editorial Paper Tone */
        --text: #1a1a1a;
        --font-main: "Helvetica Neue", Helvetica, Arial, sans-serif;
        --font-mono: "Menlo", "Courier New", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font-main);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    /* Grain Overlay for Editorial Texture */
    .grain {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 10;
        opacity: 0.06;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* UI Layout */
    header {
        padding: 1.5rem 2.5rem;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        z-index: 5;
        font-family: var(--font-mono);
        font-size: 0.7rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #555;
    }

    .meta-right {
        text-align: right;
        line-height: 1.5;
    }

    main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        perspective: 1000px; /* For 3D tilt */
    }

    /* The SVG Container */
    .art-stage {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    svg {
        /* Tight crop settings */
        height: 95vh; 
        width: auto;
        max-width: 90vw;
        filter: drop-shadow(0 30px 60px rgba(0,0,0,0.2));
        transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
        transform-style: preserve-3d;
    }

    /* Subtle Metadata Overlay */
    .overlay-data {
        position: absolute;
        bottom: 2rem;
        left: 2.5rem;
        font-family: var(--font-mono);
        font-size: 0.65rem;
        color: #666;
        display: flex;
        gap: 1rem;
        z-index: 5;
    }

    .data-point {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    .data-point::before {
        content: '';
        display: block;
        width: 4px;
        height: 4px;
        background: #666;
        border-radius: 50%;
    }

</style>
</head>
<body>

    <div class="grain"></div>

    <header>
        <div class="meta-left">
            Project: Haptic Interface<br>
            View: Macro Detail
        </div>
        <div class="meta-right">
            FIG. 04 — CLOSE UP<br>
            RENDER: VECTOR/SVG<br>
            SCALE: 1:1
        </div>
    </header>

    <main>
        <div class="art-stage">
            <!-- SVG Illustration Start -->
            <!-- ViewBox tightly cropped to focus on the interaction -->
            <svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Skin Gradients -->
                    <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#EAC0A6" />
                        <stop offset="40%" stop-color="#DFA689" />
                        <stop offset="100%" stop-color="#C68E68" />
                    </linearGradient>
                    
                    <!-- Complex shadow for realistic skin depth -->
                    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#000" stop-opacity="0" />
                        <stop offset="70%" stop-color="#000" stop-opacity="0.2" />
                        <stop offset="100%" stop-color="#3e2723" stop-opacity="0.6" />
                    </linearGradient>

                    <!-- Phone Gradients -->
                    <linearGradient id="phoneGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#1A1A1A" />
                        <stop offset="10%" stop-color="#444" /> <!-- Edge Rim Light -->
                        <stop offset="50%" stop-color="#111" />
                        <stop offset="100%" stop-color="#050505" />
                    </linearGradient>
                    
                    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3a3a45" />
                        <stop offset="50%" stop-color="#1a1a20" />
                        <stop offset="100%" stop-color="#050508" />
                    </linearGradient>

                    <!-- Filters -->
                    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="4" />
                    </filter>
                    
                    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="2" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>

                    <!-- Clip Paths -->
                    <clipPath id="phoneClip">
                        <rect x="180" y="50" width="240" height="500" rx="35" />
                    </clipPath>
                </defs>

                <!-- 1. Background Hand (Fingers wrapping around back) -->
                <!-- These are drawn first to appear behind the phone -->
                <g id="fingers-back" transform="translate(0,0)">
                    <!-- Index Finger -->
                    <path d="M220,180 Q280,150 320,180 L300,250 Q260,260 220,230 Z" fill="url(#skinBase)" />
                    <!-- Shadow on Index -->
                    <path d="M220,180 Q280,150 320,180 L300,250 Q260,260 220,230 Z" fill="url(#skinShadow)" opacity="0.5" />
                    
                    <!-- Middle Finger -->
                    <path d="M210,240 Q270,230 310,260 L290,330 Q250,340 210,310 Z" fill="url(#skinBase)" />
                    <path d="M210,240 Q270,230 310,260 L290,330 Q250,340 210,310 Z" fill="url(#skinShadow)" opacity="0.6" />

                    <!-- Ring Finger -->
                    <path d="M200,300 Q260,300 290,330 L270,400 Q230,410 200,370 Z" fill="url(#skinBase)" />
                    <path d="M200,300 Q260,300 290,330 L270,400 Q230,410 200,370 Z" fill="url(#skinShadow)" opacity="0.7" />

                    <!-- Pinky Finger (Shortest) -->
                    <path d="M190,360 Q250,370 270,400 L250,450 Q210,450 190,410 Z" fill="url(#skinBase)" />
                    <path d="M190,360 Q250,370 270,400 L250,450 Q210,450 190,410 Z" fill="url(#skinShadow)" opacity="0.8" />
                </g>

                <!-- 2. The Smartphone -->
                <g id="phone">
                    <!-- Main Body -->
                    <rect x="180" y="50" width="240" height="500" rx="35" fill="url(#phoneGradient)" />
                    
                    <!-- Metallic Rim Highlight (Top Edge) -->
                    <rect x="182" y="52" width="236" height="496" rx="33" fill="none" stroke="#888" stroke-width="1.5" opacity="0.4" />
                    <!-- Darker Outer Edge -->
                    <rect x="179" y="49" width="242" height="502" rx="36" fill="none" stroke="#000" stroke-width="2" opacity="0.3" />

                    <!-- Screen Area -->
                    <rect x="190" y="60" width="220" height="480" rx="28" fill="url(#screenGradient)" />

                    <!-- Screen Content (Abstract UI) -->
                    <g clip-path="url(#phoneClip)">
                        <!-- Abstract Wallpaper Gradient -->
                        <rect x="190" y="60" width="220" height="480" fill="#151520" />
                        
                        <!-- UI Elements -->
                        <rect x="205" y="120" width="190" height="140" rx="12" fill="#FFFFFF" opacity="0.05" />
                        <rect x="205" y="290" width="190" height="100" rx="12" fill="#FFFFFF" opacity="0.03" />
                        
                        <!-- Dynamic Light Reflection (Realistic Glare) -->
                        <path d="M180,50 L450,50 L450,200 L180,450 Z" fill="url(#screenGradient)" opacity="0.3" filter="url(#softBlur)" />
                        <path d="M180,50 L450,50 L450,150 L180,350 Z" fill="white" opacity="0.04" filter="url(#softBlur)" />
                        
                        <!-- Glowing Notification -->
                        <circle cx="385" cy="100" r="3" fill="#FF4B4B" filter="url(#glow)" />
                    </g>

                    <!-- Front Camera/Speaker -->
                    <rect x="285" y="75" width="50" height="4" rx="2" fill="#000" opacity="0.6" />
                    <circle cx="310" cy="77" r="1.5" fill="#111" />
                </g>

                <!-- 3. The Hand (Front Layer - Thumb & Palm) -->
                <!-- This is drawn last to overlap the screen -->
                <g id="palm-thumb" class="thumb-move">
                    
                    <!-- Contact Shadow: Cast by thumb onto screen -->
                    <!-- Placed BEFORE the thumb but AFTER the phone/screen -->
                    <path d="M280,420 Q320,400 350,430 L360,480 Q320,500 280,480 Z" fill="#000" opacity="0.4" filter="url(#softBlur)" style="mix-blend-mode: multiply;" />

                    <!-- Palm Base connecting to wrist -->
                    <path d="M150,500 Q120,650 160,800 L280,800 Q300,650 280,500 Z" fill="url(#skinBase)" />
                    <path d="M150,500 Q120,650 160,800 L280,800 Q300,650 280,500 Z" fill="url(#skinShadow)" opacity="0.4" />
                    
                    <!-- The Thumb (The Focal Point) -->
                    <!-- Proximal Phalanx (Base) -->
                    <path d="M260,520 Q300,500 330,450 L300,430 Q280,470 240,490 Z" fill="url(#skinBase)" />
                    <path d="M260,520 Q300,500 330,450 L300,430 Q280,470 240,490 Z" fill="url(#skinShadow)" opacity="0.3" />
                    
                    <!-- Distal Phalanx (Tip) -->
                    <path d="M320,440 Q360,410 350,380 L320,390 Q330,420 310,435 Z" fill="url(#skinBase)" />
                    
                    <!-- Knuckle Crease Detail -->
                    <path d="M315,445 Q325,455 320,465" fill="none" stroke="#A05C38" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
                    
                    <!-- Fingernail -->
                    <path d="M348,385 Q355,380 352,375 Q345,378 340,385 Z" fill="#F5D0B5" opacity="0.9" />
                    <!-- Nail Highlight -->
                    <path d="M345,382 Q350,378 348,385" fill="none" stroke="#FFF" stroke-width="0.5" opacity="0.4" />

                    <!-- Skin Highlight (Warm light on knuckle) -->
                    <path d="M330,440 Q340,430 350,440" fill="none" stroke="#FADCB8" stroke-width="2" opacity="0.5" filter="url(#softBlur)" />
                </g>

            </svg>
        </div>
    </main>

    <div class="overlay-data">
        <div class="data-point">ZOOM: 2.4x</div>
        <div class="data-point">DEPTH: ACTIVE</div>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const svgElement = document.querySelector('svg');
        const thumbGroup = document.getElementById('palm-thumb');
        
        // Parallax / Tilt Effect Logic
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 80; // Reduced sensitivity for subtlety
            const y = (window.innerHeight / 2 - e.pageY) / 80;

            // Subtle rotation of the entire SVG
            svgElement.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;

            // Thumb interaction (slight movement to simulate breathing/holding)
            if(thumbGroup) {
                // Thumb moves slightly less than the body to create depth
                const thumbX = x * 0.2; 
                const thumbY = y * 0.2;
                thumbGroup.style.transform = `translate(${thumbX}px, ${thumbY}px)`;
            }
        });

        // Reset on mouse leave
        document.addEventListener('mouseleave', () => {
            svgElement.style.transform = `rotateY(0deg) rotateX(0deg)`;
            if(thumbGroup) thumbGroup.style.transform = `translate(0px, 0px)`;
        });
    });
</script>
</body>
</html>
