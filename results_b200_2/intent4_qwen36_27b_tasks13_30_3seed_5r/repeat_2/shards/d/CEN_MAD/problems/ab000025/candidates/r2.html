<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editorial Close-Up: The Grip</title>
<style>
    :root {
        --bg-dark: #0a0a0a;
        --bg-accent: #141414;
        --text-meta: #666666;
        --font-main: "Helvetica Neue", Helvetica, Arial, sans-serif;
        --font-mono: "Menlo", "Courier New", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: var(--bg-dark);
        background: radial-gradient(circle at center, var(--bg-accent) 0%, var(--bg-dark) 100%);
        color: #fff;
        font-family: var(--font-main);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    /* Film Grain Overlay for Editorial Texture */
    .grain {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 10;
        opacity: 0.07;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* UI Layout */
    header {
        padding: 2rem 3rem;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        z-index: 5;
        font-family: var(--font-mono);
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-meta);
        mix-blend-mode: screen;
    }

    .meta-right {
        text-align: right;
        line-height: 1.6;
    }

    main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        perspective: 1200px;
    }

    /* The SVG Container */
    .art-stage {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    svg {
        height: 100vh; 
        width: auto;
        max-width: 100%;
        /* No drop shadow, relying on internal lighting for depth */
        transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
        transform-style: preserve-3d;
        will-change: transform;
    }

    /* Subtle Metadata Overlay */
    .overlay-data {
        position: absolute;
        bottom: 2.5rem;
        left: 3rem;
        font-family: var(--font-mono);
        font-size: 0.65rem;
        color: var(--text-meta);
        display: flex;
        gap: 1.5rem;
        z-index: 5;
        mix-blend-mode: screen;
    }

    .data-point {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    .data-point::before {
        content: '';
        display: block;
        width: 4px;
        height: 4px;
        background: var(--text-meta);
        border-radius: 50%;
        box-shadow: 0 0 4px rgba(255,255,255,0.2);
    }

</style>
</head>
<body>

    <div class="grain"></div>

    <header>
        <div class="meta-left">
            Project: Haptic Interface<br>
            View: Macro Detail
        </div>
        <div class="meta-right">
            FIG. 04 — CLOSE UP<br>
            RENDER: VECTOR/SVG<br>
            SCALE: 1:1
        </div>
    </header>

    <main>
        <div class="art-stage">
            <!-- 
                SVG Illustration Start 
                ViewBox: 1280x800. 
                Composition: Centered hand, cropped phone.
            -->
            <svg viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- SKIN GRADIENTS (Volumetric) -->
                    <!-- Base Skin: Warm, organic -->
                    <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#E8C3A6" />
                        <stop offset="40%" stop-color="#D6A084" />
                        <stop offset="100%" stop-color="#B07D60" />
                    </linearGradient>
                    
                    <!-- Deep Shadow (Creases, Palm) -->
                    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#000" stop-opacity="0" />
                        <stop offset="80%" stop-color="#5a3e2e" stop-opacity="0.8" />
                        <stop offset="100%" stop-color="#3e2723" stop-opacity="0.95" />
                    </linearGradient>

                    <!-- Highlight (Knuckles, Bone structure) -->
                    <linearGradient id="skinHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#FFF0E0" stop-opacity="0" />
                        <stop offset="50%" stop-color="#FFF0E0" stop-opacity="0.6" />
                        <stop offset="100%" stop-color="#FFF0E0" stop-opacity="0" />
                    </linearGradient>

                    <!-- PHONE GRADIENTS -->
                    <!-- Titanium/Aluminum Bezel -->
                    <linearGradient id="phoneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#2A2A2A" />
                        <stop offset="20%" stop-color="#555" /> <!-- Edge Light -->
                        <stop offset="50%" stop-color="#1A1A1A" />
                        <stop offset="100%" stop-color="#050505" />
                    </linearGradient>
                    
                    <!-- Screen Glass -->
                    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#1a1a24" />
                        <stop offset="50%" stop-color="#0a0a10" />
                        <stop offset="100%" stop-color="#000000" />
                    </linearGradient>

                    <!-- Reflection Gradient -->
                    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#fff" stop-opacity="0.15" />
                        <stop offset="40%" stop-color="#fff" stop-opacity="0.0" />
                    </linearGradient>

                    <!-- FILTERS -->
                    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="6" />
                    </filter>
                    
                    <filter id="shadowBlur" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="12" />
                    </filter>

                    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="3" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>

                    <!-- Clip Paths -->
                    <clipPath id="phoneClip">
                        <rect x="400" y="-100" width="380" height="1000" rx="40" />
                    </clipPath>
                </defs>

                <!-- 1. BACKGROUND HAND (Fingers wrapping around back) -->
                <!-- Positioned behind phone, showing grip pressure -->
                <g id="fingers-back" transform="translate(0,0)">
                    <!-- Index Finger (Top) -->
                    <g transform="translate(400, 50) rotate(5)">
                        <!-- Finger Body -->
                        <path d="M0,20 Q60,-20 140,10 L130,80 Q60,60 0,50 Z" fill="url(#skinBase)" />
                        <!-- Shadow under finger -->
                        <path d="M0,20 Q60,-20 140,10 L130,80 Q60,60 0,50 Z" fill="url(#skinShadow)" opacity="0.6" />
                        <!-- Knuckle Highlight -->
                        <path d="M80,0 Q90,-10 100,5" fill="none" stroke="#EAC0A6" stroke-width="3" opacity="0.4" filter="url(#softBlur)" />
                        <!-- Nail -->
                        <path d="M135,15 Q145,10 140,25 Q130,25 135,15" fill="#F5D0B5" opacity="0.7" />
                    </g>

                    <!-- Middle Finger -->
                    <g transform="translate(395, 130) rotate(2)">
                         <path d="M0,20 Q60,-10 150,20 L140,90 Q60,70 0,50 Z" fill="url(#skinBase)" />
                         <path d="M0,20 Q60,-10 150,20 L140,90 Q60,70 0,50 Z" fill="url(#skinShadow)" opacity="0.7" />
                         <path d="M90,10 Q100,0 110,15" fill="none" stroke="#EAC0A6" stroke-width="3" opacity="0.3" filter="url(#softBlur)" />
                         <!-- Nail -->
                         <path d="M145,25 Q155,20 150,35 Q140,35 145,25" fill="#F5D0B5" opacity="0.7" />
                    </g>

                    <!-- Ring Finger -->
                    <g transform="translate(390, 210) rotate(-2)">
                         <path d="M0,20 Q60,0 140,30 L130,100 Q60,80 0,50 Z" fill="url(#skinBase)" />
                         <path d="M0,20 Q60,0 140,30 L130,100 Q60,80 0,50 Z" fill="url(#skinShadow)" opacity="0.8" />
                         <path d="M135,35 Q145,30 140,45 Q130,45 135,35" fill="#F5D0B5" opacity="0.7" />
                    </g>

                    <!-- Pinky Finger (Bottom) -->
                    <g transform="translate(385, 290) rotate(-5)">
                         <path d="M0,20 Q50,10 120,40 L110,100 Q50,80 0,50 Z" fill="url(#skinBase)" />
                         <path d="M0,20 Q50,10 120,40 L110,100 Q50,80 0,50 Z" fill="url(#skinShadow)" opacity="0.9" />
                         <!-- Nail -->
                         <path d="M115,45 Q125,40 120,55 Q110,55 115,45" fill="#F5D0B5" opacity="0.7" />
                    </g>
                </g>

                <!-- 2. THE SMARTPHONE -->
                <g id="phone">
                    <!-- Main Body (Cropped top/bottom) -->
                    <rect x="400" y="-100" width="380" height="1000" rx="40" fill="url(#phoneGradient)" />
                    
                    <!-- Metallic Rim Highlight (Left Edge - Light Source) -->
                    <rect x="402" y="-98" width="376" height="996" rx="38" fill="none" stroke="#999" stroke-width="1" opacity="0.5" />
                    <path d="M402,-98 L402,898" stroke="#FFF" stroke-width="2" opacity="0.3" filter="url(#softBlur)" />

                    <!-- Screen Area -->
                    <rect x="415" y="-85" width="350" height="970" rx="25" fill="url(#screenGradient)" />

                    <!-- Screen Content (Abstract UI) -->
                    <g clip-path="url(#phoneClip)">
                        <!-- Abstract Wallpaper Gradient -->
                        <rect x="415" y="-85" width="350" height="970" fill="#151520" />
                        
                        <!-- UI Elements (Dark Mode) -->
                        <rect x="435" y="100" width="310" height="180" rx="16" fill="#FFFFFF" opacity="0.03" />
                        <rect x="435" y="320" width="310" height="140" rx="16" fill="#FFFFFF" opacity="0.02" />
                        <rect x="435" y="500" width="310" height="140" rx="16" fill="#FFFFFF" opacity="0.02" />
                        
                        <!-- Dynamic Light Reflection (Realistic Glare) -->
                        <!-- Aligns with top-left light source -->
                        <path d="M400,-100 L800,-100 L800,200 L400,600 Z" fill="url(#glassReflect)" opacity="0.4" filter="url(#softBlur)" />
                        
                        <!-- Glowing Notification -->
                        <circle cx="735" cy="50" r="4" fill="#FF4B4B" filter="url(#glow)" />
                    </g>

                    <!-- Front Camera/Speaker -->
                    <rect x="550" y="-60" width="80" height="6" rx="3" fill="#000" opacity="0.8" />
                    <circle cx="590" cy="-57" r="2.5" fill="#111" />
                </g>

                <!-- 3. THE HAND (Front Layer - Thumb & Palm) -->
                <!-- This is drawn last to overlap the screen -->
                <g id="palm-thumb" class="thumb-move">
                    
                    <!-- Contact Shadow: Cast by thumb onto screen -->
                    <!-- Placed BEFORE the thumb but AFTER the phone/screen -->
                    <path d="M580,450 Q620,430 650,460 L660,510 Q620,530 580,510 Z" fill="#000" opacity="0.5" filter="url(#shadowBlur)" style="mix-blend-mode: multiply;" />

                    <!-- Palm Base connecting to wrist -->
                    <path d="M250,400 Q200,600 300,850 L500,850 Q450,600 450,400 Z" fill="url(#skinBase)" />
                    <!-- Palm Creases -->
                    <path d="M320,600 Q380,620 420,550" fill="none" stroke="#8C5A3C" stroke-width="3" opacity="0.4" stroke-linecap="round" filter="url(#softBlur)"/>
                    <path d="M350,500 Q300,550 280,650" fill="none" stroke="#8C5A3C" stroke-width="2" opacity="0.3" stroke-linecap="round" filter="url(#softBlur)"/>
                    
                    <!-- The Thumb (The Focal Point) -->
                    <g transform="translate(0,0)">
                        <!-- Proximal Phalanx (Base) -->
                        <path d="M420,480 Q480,460 520,400 L480,380 Q440,420 400,460 Z" fill="url(#skinBase)" />
                        <path d="M420,480 Q480,460 520,400 L480,380 Q440,420 400,460 Z" fill="url(#skinShadow)" opacity="0.2" />
                        
                        <!-- Distal Phalanx (Tip) -->
                        <path d="M510,390 Q560,360 550,330 L510,340 Q530,370 500,385 Z" fill="url(#skinBase)" />
                        
                        <!-- Knuckle Joint Detail (Protrusion) -->
                        <path d="M490,400 Q510,390 520,400" fill="none" stroke="#EAC0A6" stroke-width="2" opacity="0.5" stroke-linecap="round" />
                        
                        <!-- Fingernail -->
                        <path d="M545,335 Q555,325 550,320 Q540,325 535,335 Z" fill="#F5D0B5" opacity="0.9" />
                        <!-- Nail Highlight (Specular) -->
                        <path d="M540,330 Q545,325 542,332" fill="none" stroke="#FFF" stroke-width="1" opacity="0.6" />

                        <!-- Skin Highlight (Warm light on knuckle) -->
                        <path d="M510,390 Q520,380 530,390" fill="none" stroke="#FADCB8" stroke-width="3" opacity="0.6" filter="url(#softBlur)" />
                        
                        <!-- Rim Light on Thumb (Separating from dark phone) -->
                        <path d="M420,480 Q480,460 520,400 L510,390" fill="none" stroke="#FFF" stroke-width="1" opacity="0.3" filter="url(#softBlur)" />
                    </g>
                </g>

            </svg>
        </div>
    </main>

    <div class="overlay-data">
        <div class="data-point">ZOOM: 4.2x</div>
        <div class="data-point">DEPTH: ACTIVE</div>
        <div class="data-point">ISO: 800</div>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const svgElement = document.querySelector('svg');
        const thumbGroup = document.getElementById('palm-thumb');
        
        // Parallax / Tilt Effect Logic
        // Adjusted for a larger scale feel
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 120; // Subtler rotation for large scale
            const y = (window.innerHeight / 2 - e.pageY) / 120;

            // Subtle rotation of the entire SVG
            svgElement.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;

            // Thumb interaction (slight movement to simulate breathing/holding)
            if(thumbGroup) {
                // Thumb moves slightly less than the body to create depth
                const thumbX = x * 0.3; 
                const thumbY = y * 0.3;
                thumbGroup.style.transform = `translate(${thumbX}px, ${thumbY}px)`;
            }
        });

        // Reset on mouse leave
        document.addEventListener('mouseleave', () => {
            svgElement.style.transform = `rotateY(0deg) rotateX(0deg)`;
            if(thumbGroup) thumbGroup.style.transform = `translate(0px, 0px)`;
        });
    });
</script>
</body>
</html>
