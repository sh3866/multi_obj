<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jump Jump: Cloudy Kingdom</title>
    <style>
        :root {
            --sky-top: #4facfe;
            --sky-bot: #00f2fe;
            --grass-light: #96c93d;
            --grass-dark: #56ab2f;
            --dirt-light: #e6a15c;
            --dirt-dark: #c06c35;
            --brick: #b75e28;
            --ui-bg: #fff8e7;
            --ui-border: #4a3b2a;
            --ui-shadow: #cfaa78;
            --btn-primary: #ff9f1c;
            --btn-primary-dark: #d97904;
            --text-main: #33271a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(to bottom, var(--sky-top), var(--sky-bot));
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            color: var(--text-main);
        }

        /* --- LAYOUT GRID --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 100px 1fr 140px;
            padding: 30px 40px;
            pointer-events: none; /* Let clicks pass through to canvas if needed */
        }

        /* --- COMMON UI COMPONENTS (Chunky Style) --- */
        .chunky-panel {
            background: var(--ui-bg);
            border: 4px solid var(--ui-border);
            border-radius: 16px;
            box-shadow: 0 6px 0 var(--ui-border);
            pointer-events: auto;
            transition: transform 0.1s;
        }

        .icon-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
            font-size: 1.2rem;
            color: var(--ui-border);
            text-shadow: 1px 1px 0 #fff;
        }

        /* --- TOP HEADER (Stats & Controls) --- */
        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        /* Left: Stats */
        .stats-bar {
            display: flex;
            gap: 20px;
            padding: 10px 24px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .coin-icon {
            width: 24px;
            height: 24px;
            background: #ffd700;
            border: 2px solid #b8860b;
            border-radius: 50%;
            box-shadow: inset 2px 2px 0 #fff7cc;
            position: relative;
        }
        .coin-icon::after {
            content: '$';
            position: absolute;
            top: -2px;
            left: 4px;
            font-size: 16px;
            color: #b8860b;
        }

        .heart-icon {
            width: 24px;
            height: 24px;
            background: #ff4757;
            border: 2px solid #b33939;
            border-radius: 50% 50% 0 0;
            transform: rotate(-45deg);
            box-shadow: inset 2px -2px 0 #ff7675;
        }
        .heart-container {
            transform: rotate(45deg);
            display: flex;
            gap: 2px;
        }

        /* Right: Controls & World */
        .controls-bar {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .world-selector {
            padding: 8px 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            line-height: 1;
        }
        .world-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #888;
            font-weight: 700;
        }
        .world-name {
            font-size: 1rem;
            color: var(--ui-border);
            font-weight: 800;
        }

        .keys-guide {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: #555;
            padding: 8px 16px;
        }
        .key {
            background: #fff;
            border: 2px solid #aaa;
            border-radius: 6px;
            padding: 4px 8px;
            box-shadow: 0 3px 0 #aaa;
            font-family: monospace;
            color: #333;
        }

        /* --- CENTER STAGE (Game Preview) --- */
        .stage-center {
            grid-column: 1 / -1;
            grid-row: 2;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        /* The Canvas Container acts as the "Level Preview" window */
        .preview-window {
            width: 80%;
            height: 100%;
            position: relative;
            /* CSS 2.5D Effect */
            transform: perspective(1000px) rotateY(-5deg) scale(0.95);
            transform-origin: center center;
            transition: transform 0.3s ease;
            pointer-events: auto;
        }
        
        .preview-window:hover {
            transform: perspective(1000px) rotateY(0deg) scale(1);
        }

        .preview-window canvas {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            /* Clip the canvas to the rounded corners */
            overflow: hidden; 
            /* Drop shadow for the "screen" */
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            border: 8px solid #fff;
            outline: 4px solid var(--ui-border);
        }

        /* Floating Title Overlay */
        .game-title {
            position: absolute;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
            pointer-events: none;
        }
        .game-title h1 {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; /* Playful fallback */
            font-size: 5rem;
            color: #fff;
            -webkit-text-stroke: 3px var(--ui-border);
            text-shadow: 4px 4px 0 var(--ui-border), 0 10px 20px rgba(0,0,0,0.2);
            letter-spacing: -2px;
            line-height: 1;
        }
        .game-title span {
            display: block;
            font-size: 1.5rem;
            color: #fff;
            -webkit-text-stroke: 1.5px var(--ui-border);
            text-shadow: 2px 2px 0 var(--ui-border);
            margin-top: -10px;
            font-weight: 800;
            background: var(--btn-primary);
            display: inline-block;
            padding: 5px 20px;
            border-radius: 20px;
            border: 2px solid var(--ui-border);
        }

        /* --- BOTTOM ACTION --- */
        .action-footer {
            grid-column: 1 / -1;
            grid-row: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .start-btn {
            pointer-events: auto;
            background: var(--btn-primary);
            color: #fff;
            border: 4px solid var(--ui-border);
            padding: 20px 60px;
            font-size: 2rem;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            /* 3D Button Effect */
            box-shadow: 0 8px 0 var(--btn-primary-dark), 0 15px 20px rgba(0,0,0,0.2);
            transition: all 0.1s;
            position: relative;
            overflow: hidden;
            font-family: 'Comic Sans MS', sans-serif; /* Matching the title vibe */
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 0 var(--btn-primary-dark), 0 20px 30px rgba(0,0,0,0.2);
            background: #ffad42;
        }

        .start-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 var(--btn-primary-dark), 0 0 0 rgba(0,0,0,0);
        }

        /* Shine animation on button */
        .start-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }
        .start-btn:hover::after {
            left: 100%;
            transition: 0.5s;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 800px) {
            .ui-layer { padding: 10px; grid-template-rows: 80px 1fr 100px; }
            .game-title h1 { font-size: 3rem; }
            .preview-window { transform: none; width: 100%; }
            .preview-window canvas { border-width: 4px; }
            .keys-guide { display: none; } /* Hide keys on mobile */
            .start-btn { font-size: 1.5rem; padding: 15px 40px; }
        }
    </style>
</head>
<body>

    <!-- UI Overlay -->
    <div class="ui-layer">
        
        <!-- Top Header: Stats & Controls -->
        <header>
            <!-- Left: Stats -->
            <div class="stats-bar chunky-panel">
                <div class="stat-item">
                    <div class="coin-icon"></div>
                    <span>008</span>
                </div>
                <div class="stat-item">
                    <div class="heart-container">
                        <div class="heart-icon"></div>
                        <div class="heart-icon"></div>
                        <div class="heart-icon"></div>
                    </div>
                    <span>x 3</span>
                </div>
                <div class="stat-item">
                    <span style="font-size: 0.9rem; color: #666;">SCORE:</span>
                    <span>12,400</span>
                </div>
            </div>

            <!-- Right: World & Controls -->
            <div class="controls-bar">
                <div class="world-selector chunky-panel">
                    <span class="world-label">World</span>
                    <span class="world-name">1-1: Cloudy Hills</span>
                </div>
                <div class="keys-guide chunky-panel">
                    <span>Jump</span> <div class="key">Z</div>
                    <span>Run</span> <div class="key">X</div>
                </div>
            </div>
        </header>

        <!-- Center Stage: The Level Preview -->
        <div class="stage-center">
            <div class="game-title">
                <h1>JUMP JUMP</h1>
                <span>The Lost Kingdom</span>
            </div>

            <div class="preview-window">
                <canvas id="game-preview"></canvas>
            </div>
        </div>

        <!-- Bottom: Start Button -->
        <div class="action-footer">
            <button class="start-btn" onclick="startGame()">START ADVENTURE</button>
        </div>

    </div>

    <script>
        // --- CANVAS DRAWING LOGIC ---
        const canvas = document.getElementById('game-preview');
        const ctx = canvas.getContext('2d');

        let width, height;
        let time = 0;

        function resize() {
            // Get the container dimensions
            const container = canvas.parentElement;
            width = canvas.width = container.clientWidth;
            height = canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resize);
        // Initial call
        setTimeout(resize, 50); // Slight delay to ensure layout is settled

        // --- PALETTE ---
        const c = {
            sky: '#87CEEB', // Just in case canvas bg needed
            grassL: '#96c93d',
            grassD: '#56ab2f',
            dirtL: '#e6a15c',
            dirtD: '#c06c35',
            brick: '#b75e28',
            brickD: '#8f451d',
            cloud: '#ffffff',
            hero: '#ff4757',
            heroDark: '#c0392b',
            coin: '#f1c40f',
            flag: '#e74c3c',
            enemy: '#2c3e50'
        };

        // --- HELPER FUNCTIONS ---
        
        function drawRect(x, y, w, h, color, shadow = false) {
            ctx.fillStyle = color;
            if (shadow) ctx.shadowColor = 'rgba(0,0,0,0.2)';
            if (shadow) ctx.shadowBlur = 5;
            if (shadow) ctx.shadowOffsetY = 3;
            ctx.fillRect(x, y, w, h);
            ctx.shadowColor = 'transparent'; // Reset
        }

        function drawCircle(x, y, r, color) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.closePath();
        }

        // --- SCENE LAYERS ---

        // 1. Background Layer (Clouds & Hills)
        function drawBackground() {
            // Sky Gradient inside canvas
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#4facfe');
            grad.addColorStop(1, '#00f2fe');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Distant Hills
            ctx.fillStyle = '#81ecec'; // Lighter blue/green for depth
            ctx.beginPath();
            ctx.moveTo(0, height);
            for(let i=0; i<=width; i+=50) {
                ctx.lineTo(i, height - 100 + Math.sin(i * 0.01 + time * 0.0005) * 30);
            }
            ctx.lineTo(width, height);
            ctx.fill();

            // Clouds
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            const drawCloud = (cx, cy, scale) => {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.scale(scale, scale);
                ctx.beginPath();
                ctx.arc(0, 0, 30, 0, Math.PI * 2);
                ctx.arc(25, -10, 35, 0, Math.PI * 2);
                ctx.arc(50, 0, 30, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            };

            drawCloud((width * 0.2) - (time * 0.05) % (width + 100), height * 0.2, 1);
            drawCloud((width * 0.7) - (time * 0.02) % (width + 100), height * 0.1, 0.8);
            drawCloud((width * 0.9) - (time * 0.08) % (width + 100), height * 0.3, 1.2);
        }

        // 2. Midground Layer (Platforms & Bricks)
        function drawMidground() {
            const groundY = height * 0.85;

            // Main Ground (Infinite scrolling illusion)
            const drawGroundStrip = (x, y, w, h) => {
                // Dirt
                drawRect(x, y, w, h, c.dirtL);
                // Grass Top
                drawRect(x, y, w, 10, c.grassL);
                // Texture details
                ctx.fillStyle = c.dirtD;
                for(let i=0; i<w; i+=40) {
                    ctx.fillRect(x + i + 10, y + 20, 10, 10);
                    ctx.fillRect(x + i + 30, y + 40, 8, 8);
                }
            };

            drawGroundStrip(0, groundY, width, height - groundY);

            // Floating Platform 1 (Left)
            const p1X = width * 0.2;
            const p1Y = groundY - 100;
            drawBlockPlatform(p1X, p1Y, 120, 40);

            // Floating Platform 2 (High Center)
            const p2X = width * 0.45;
            const p2Y = groundY - 220;
            drawBlockPlatform(p2X, p2Y, 80, 80); // Big block

            // Floating Platform 3 (Right approach)
            const p3X = width * 0.65;
            const p3Y = groundY - 120;
            drawBlockPlatform(p3X, p3Y, 100, 40);
        }

        function drawBlockPlatform(x, y, w, h) {
            // Dirt Base
            drawRect(x, y, w, h, c.brick);
            
            // Brick Pattern
            ctx.strokeStyle = c.brickD;
            ctx.lineWidth = 2;
            ctx.beginPath();
            for(let i=0; i<=w; i+=20) {
                ctx.moveTo(x+i, y);
                ctx.lineTo(x+i, y+h);
                // Offset horizontal lines
                let offset = (i % 40 === 0) ? 0 : 10;
                ctx.moveTo(x, y+offset);
                ctx.lineTo(x+w, y+offset);
                ctx.moveTo(x, y+offset+20);
                ctx.lineTo(x+w, y+offset+20);
            }
            ctx.stroke();
            
            // Top Grass
            drawRect(x, y, w, 6, c.grassL);
        }

        // 3. Foreground Layer (Hero, Enemies, Coins, Goal)
        function drawForeground() {
            const groundY = height * 0.85;
            
            // HERO (The Mascot)
            // Position: Standing on the left ground
            const hX = width * 0.15;
            const hY = groundY;
            const bounce = Math.abs(Math.sin(time * 0.01)) * 10; // Idle bounce
            const heroY = hY - 50 - bounce;

            drawHero(hX, heroY);

            // ENEMY (Goomba-like)
            // Walking on ground
            const eX = (width * 0.35) + (Math.sin(time * 0.005) * 50);
            const eY = groundY - 30;
            drawEnemy(eX, eY, time);

            // COINS
            const drawCoin = (x, y) => {
                const spin = Math.abs(Math.sin(time * 0.008 + x));
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(spin, 1);
                drawCircle(0, 0, 12, c.coin);
                // Shine
                drawCircle(-4, -4, 4, '#fff');
                ctx.restore();
            };

            drawCoin(width * 0.25, groundY - 140); // Above platform 1
            drawCoin(width * 0.5, groundY - 260); // Above platform 2
            drawCoin(width * 0.54, groundY - 260);
            drawCoin(width * 0.58, groundY - 260); // Arc of coins

            // GOAL POST (Right side)
            drawGoalPost(width * 0.85, groundY);
        }

        // --- SPRITE DRAWING ---

        function drawHero(x, y) {
            ctx.save();
            ctx.translate(x, y);

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(0, 50, 20, 6, 0, 0, Math.PI*2);
            ctx.fill();

            // Body (Red Circle)
            drawCircle(0, 0, 25, c.hero);
            
            // Face (White)
            drawCircle(0, -2, 18, '#fff');

            // Eyes
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(6, -4, 3, 0, Math.PI*2); // Right eye
            ctx.arc(-6, -4, 3, 0, Math.PI*2); // Left eye
            ctx.fill();

            // Smile
            ctx.beginPath();
            ctx.arc(0, 2, 8, 0.2, Math.PI - 0.2);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Shoes (Blue)
            ctx.fillStyle = '#3498db';
            ctx.beginPath();
            ctx.ellipse(-10, 22, 10, 6, 0, 0, Math.PI*2);
            ctx.ellipse(10, 22, 10, 6, 0, 0, Math.PI*2);
            ctx.fill();

            // Arms (Red)
            ctx.strokeStyle = c.hero;
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            // Left arm waving
            ctx.beginPath();
            ctx.moveTo(-15, 5);
            ctx.quadraticCurveTo(-30, -10 + Math.sin(time*0.01)*10, -25, 10);
            ctx.stroke();
            // Right arm
            ctx.beginPath();
            ctx.moveTo(15, 5);
            ctx.quadraticCurveTo(30, 15, 25, 25);
            ctx.stroke();

            ctx.restore();
        }

        function drawEnemy(x, y, t) {
            ctx.save();
            ctx.translate(x, y);
            // Bobbing
            const bob = Math.abs(Math.sin(t * 0.01)) * 3;
            ctx.translate(0, -bob);

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(0, 28 + bob, 15, 4, 0, 0, Math.PI*2);
            ctx.fill();

            // Head (Brown Mushroom)
            ctx.fillStyle = c.enemy;
            ctx.beginPath();
            ctx.arc(0, 0, 20, Math.PI, 0); // Top dome
            ctx.lineTo(20, 10);
            ctx.lineTo(-20, 10);
            ctx.fill();

            // Stalk
            ctx.fillStyle = '#ecf0f1';
            ctx.fillRect(-12, 5, 24, 15);

            // Feet
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.ellipse(-8, 20, 6, 4, 0, 0, Math.PI*2);
            ctx.ellipse(8, 20, 6, 4, 0, 0, Math.PI*2);
            ctx.fill();

            // Angry Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(-10, -5); ctx.lineTo(-4, -2); ctx.lineTo(-10, 2); ctx.fill();
            ctx.moveTo(10, -5); ctx.lineTo(4, -2); ctx.lineTo(10, 2); ctx.fill();

            ctx.restore();
        }

        function drawGoalPost(x, y) {
            ctx.save();
            ctx.translate(x, y);

            // Pole
            ctx.fillStyle = '#bdc3c7';
            ctx.fillRect(-4, -160, 8, 160);

            // Base
            ctx.fillStyle = '#2ecc71';
            ctx.beginPath();
            ctx.arc(0, 0, 15, 0, Math.PI*2);
            ctx.fill();

            // Flag (Waving)
            ctx.fillStyle = c.flag;
            ctx.beginPath();
            ctx.moveTo(4, -160);
            ctx.quadraticCurveTo(40 + Math.sin(time*0.01)*5, -150, 4, -130);
            ctx.fill();

            ctx.restore();
        }

        // --- MAIN LOOP ---
        function animate(timestamp) {
            time = timestamp || 0;
            
            // Clear
            ctx.clearRect(0, 0, width, height);

            // Draw Layers
            drawBackground();
            drawMidground();
            drawForeground();

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        // --- INTERACTIVITY ---
        function startGame() {
            const btn = document.querySelector('.start-btn');
            btn.innerHTML = "LOADING...";
            btn.style.transform = "translateY(8px)"; // Press down effect
            
            // Simulate loading
            setTimeout(() => {
                // In a real app, this would switch scenes
                alert("Let's Go! (Game Start)");
                btn.innerHTML = "START ADVENTURE";
                btn.style.transform = "translateY(0)";
            }, 600);
        }

    </script>
</body>
</html>
