<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jump Jump: Cloudy Hills</title>
    <style>
        :root {
            /* Palette */
            --bg-sky-top: #4facfe;
            --bg-sky-bot: #00f2fe;
            --ui-card-bg: #fffcf5;
            --ui-accent: #ffb74d;
            --ui-accent-dark: #f57c00;
            --ui-white: #ffffff;
            --ui-text: #3e2723;
            
            /* Dimensions */
            --border-radius-lg: 24px;
            --border-radius-md: 16px;
            --border-radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: linear-gradient(135deg, var(--bg-sky-top), var(--bg-sky-bot));
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Noise Texture Overlay */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        /* --- MAIN CONTAINER --- */
        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px; /* Space for the floating button */
        }

        /* --- 3. TYPOGRAPHY & TITLE --- */
        .title-section {
            text-align: center;
            position: relative;
            z-index: 2;
        }

        h1.game-title {
            font-family: 'Arial Black', 'Impact', 'Segoe UI Black', sans-serif;
            font-size: 4rem;
            color: #fff;
            letter-spacing: 2px;
            line-height: 1;
            margin-bottom: 10px;
            /* 3D Extrusion Effect */
            text-shadow: 
                0 1px 0 #ccc,
                0 2px 0 #c9c9c9,
                0 3px 0 #bbb,
                0 4px 0 #b9b9b9,
                0 5px 0 #aaa,
                0 6px 1px rgba(0,0,0,.1),
                0 0 5px rgba(0,0,0,.1),
                0 1px 3px rgba(0,0,0,.3),
                0 3px 5px rgba(0,0,0,.2),
                0 5px 10px rgba(0,0,0,.25),
                0 10px 10px rgba(0,0,0,.2),
                0 20px 20px rgba(0,0,0,.15);
            transform: skewX(-5deg) skewY(-2deg);
        }

        .world-badge {
            display: inline-block;
            background: var(--ui-white);
            color: var(--ui-accent-dark);
            padding: 6px 20px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transform: skewX(-5deg);
        }

        /* --- 1 & 3. THE DIORAMA FRAME --- */
        .stage-center {
            width: 100%;
            position: relative;
            perspective: 1000px;
        }

        .game-frame {
            width: 100%;
            aspect-ratio: 16/9;
            max-height: 500px;
            background: var(--ui-card-bg);
            /* Critique: Thick rounded white stroke with soft shadow */
            border: 8px solid var(--ui-white);
            border-radius: var(--border-radius-lg);
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.2),
                0 10px 10px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            transform: rotateX(2deg); /* Subtle depth */
            transform-style: preserve-3d;
            transition: transform 0.3s ease;
        }
        
        .game-frame:hover {
            transform: rotateX(0deg) scale(1.005);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- 4. HUD OVERLAY (Inside Frame) --- */
        .hud-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none; /* Let clicks pass through to canvas if needed */
        }

        .hud-group {
            display: flex;
            gap: 12px;
        }

        .hud-pill {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            border-radius: var(--border-radius-md);
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.05);
            border: 2px solid rgba(255,255,255,0.5);
        }

        /* 5. Icon Polish */
        .hud-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .hud-icon svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 1px 0 rgba(0,0,0,0.2));
        }

        .hud-text {
            font-weight: 800;
            color: var(--ui-text);
            font-size: 0.9rem;
        }

        .hud-controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.85);
            padding: 4px 10px;
            border-radius: var(--border-radius-sm);
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--ui-text);
            box-shadow: 0 2px 0 rgba(0,0,0,0.05);
        }

        .key-cap {
            background: var(--ui-text);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
            box-shadow: 0 2px 0 #000;
        }

        /* --- 2. ELEVATED CTA --- */
        .action-area {
            position: absolute;
            bottom: -30px; /* Overlap frame */
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .start-btn {
            background: var(--ui-accent);
            color: #fff;
            border: none;
            padding: 18px 50px;
            font-size: 1.5rem;
            font-weight: 900;
            /* Critique: Consistent border radius */
            border-radius: 20px; 
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 0 rgba(0,0,0,0.2);
            
            /* Critique: Juicy 3D effect */
            box-shadow: 
                0 10px 0 var(--ui-accent-dark),
                0 15px 20px rgba(0,0,0,0.3);
            
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Arial Black', 'Impact', sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Shine effect on button */
        .start-btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.3), transparent);
            border-radius: 20px 20px 0 0;
        }

        .start-btn:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 14px 0 var(--ui-accent-dark),
                0 20px 30px rgba(0,0,0,0.3);
            filter: brightness(1.1);
        }

        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 
                0 4px 0 var(--ui-accent-dark),
                0 5px 10px rgba(0,0,0,0.3);
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 800px) {
            h1.game-title { font-size: 2.5rem; }
            .hud-controls { display: none; } /* Hide controls on mobile */
            .start-btn { padding: 15px 40px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- 3. Refined Typography -->
        <div class="title-section">
            <h1 class="game-title">JUMP JUMP</h1>
            <div class="world-badge">1-1: Cloudy Hills</div>
        </div>

        <!-- 1. Populated Central Viewport -->
        <div class="stage-center">
            <div class="game-frame">
                <canvas id="scene-canvas"></canvas>
                
                <!-- 4. Grouped Secondary UI (HUD Overlay) -->
                <div class="hud-overlay">
                    <div class="hud-group">
                        <div class="hud-pill">
                            <div class="hud-icon">
                                <!-- Coin Icon -->
                                <svg viewBox="0 0 24 24" fill="none" stroke="#f9c74f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="9" fill="#f9c74f"></circle>
                                    <path d="M12 16V8M9 12h6" stroke="#f57f17" stroke-width="2"></path>
                                </svg>
                            </div>
                            <span class="hud-text">x 08</span>
                        </div>
                        <div class="hud-pill">
                            <div class="hud-icon">
                                <!-- Heart Icon -->
                                <svg viewBox="0 0 24 24" fill="#ef476f" stroke="#ef476f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                                </svg>
                            </div>
                            <span class="hud-text">x 3</span>
                        </div>
                    </div>

                    <div class="hud-controls">
                        <div class="control-row">
                            <span class="key-cap">Z</span> Jump
                        </div>
                        <div class="control-row">
                            <span class="key-cap">X</span> Run
                        </div>
                    </div>
                </div>

                <!-- 2. Elevated CTA -->
                <div class="action-area">
                    <button class="start-btn" onclick="startGame()">Start Adventure</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        /**
         * DESIGN CRITIQUE IMPLEMENTATION:
         * 1. Populate Central Scene: Implemented parallax layers, detailed sprites (Hero, Enemy, Goal), and gameplay storytelling elements (coins, blocks).
         * 2. Fix Composition: Removed skewed trapezoid. Used flat 2D card with chunky depth (box-shadow).
         * 3. Header Hierarchy: Grouped Title/World center, moved stats/controls to edges with lower opacity.
         * 4. Refined CTA: Reduced button contrast and shadow intensity.
         * 5. Thematic Polish: Added noise overlay to CSS, used chunky system fonts.
         */

        const canvas = document.getElementById('scene-canvas');
        const ctx = canvas.getContext('2d');

        // State
        let width, height;
        let time = 0;

        // Colors
        const palette = {
            skyTop: '#4facfe',
            skyBot: '#00f2fe',
            cloud: '#ffffff',
            grass: '#76c842',
            grassDark: '#56ab2f',
            dirt: '#e6a15c',
            dirtDark: '#c06c35',
            brick: '#e76f51',
            brickDark: '#c05236',
            heroRed: '#ef476f',
            heroSkin: '#ffd166',
            coinGold: '#f9c74f',
            enemyBrown: '#6d597a',
            flagRed: '#ef476f'
        };

        function resize() {
            const container = canvas.parentElement;
            width = canvas.width = container.clientWidth;
            height = canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resize);
        setTimeout(resize, 10); // Initial setup

        // --- DRAWING HELPERS ---

        function drawCircle(x, y, r, color) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawRect(x, y, w, h, color, radius = 0) {
            ctx.fillStyle = color;
            if (radius > 0) {
                ctx.beginPath();
                ctx.roundRect(x, y, w, h, radius);
                ctx.fill();
            } else {
                ctx.fillRect(x, y, w, h);
            }
        }

        // --- LAYER 1: BACKGROUND (Sky, Clouds, Distant Hills) ---
        function drawBackground() {
            // Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, palette.skyTop);
            grad.addColorStop(1, palette.skyBot);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Clouds (Parallax: moves very slow)
            ctx.fillStyle = palette.cloud;
            const drawCloud = (x, y, scale) => {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(scale, scale);
                // Cloud shape
                ctx.beginPath();
                ctx.arc(0, 0, 30, 0, Math.PI * 2);
                ctx.arc(25, -10, 35, 0, Math.PI * 2);
                ctx.arc(50, 0, 30, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            };

            // Wrap logic for infinite cloud loop
            const cloudSpeed = 0.2;
            const cloudOffset = (time * cloudSpeed) % (width + 200);
            
            drawCloud(100 - cloudOffset, height * 0.2, 1.2);
            drawCloud(400 - cloudOffset, height * 0.15, 0.8);
            drawCloud(700 - cloudOffset, height * 0.3, 1.5);
            // Duplicate for loop
            drawCloud(100 - cloudOffset + width + 200, height * 0.2, 1.2);
            drawCloud(400 - cloudOffset + width + 200, height * 0.15, 0.8);

            // Distant Hills (Parallax: slow)
            ctx.fillStyle = '#a8e6cf'; // Light green/blue
            ctx.beginPath();
            ctx.moveTo(0, height);
            for(let i=0; i<=width; i+=50) {
                // Gentle sine wave for hills
                const hillH = Math.sin((i + time * 0.5) * 0.005) * 40;
                ctx.lineTo(i, height - 120 + hillH);
            }
            ctx.lineTo(width, height);
            ctx.fill();
        }

        // --- LAYER 2: MIDGROUND (Platforms, Blocks, Goal) ---
        function drawMidground() {
            const groundY = height * 0.75;
            
            // Draw Ground
            // Infinite scroll effect for ground texture
            const groundScroll = (time * 2) % 40; 
            
            // Dirt Base
            drawRect(0, groundY, width, height - groundY, palette.dirt);
            // Grass Top
            drawRect(0, groundY, width, 20, palette.grass);
            
            // Ground Texture (Dots/Grass tufts)
            ctx.fillStyle = palette.dirtDark;
            for(let x = -groundScroll; x < width; x += 40) {
                ctx.beginPath();
                ctx.arc(x, groundY + 30, 4, 0, Math.PI*2);
                ctx.arc(x + 20, groundY + 50, 3, 0, Math.PI*2);
                ctx.fill();
            }

            // --- STORYTELLING ELEMENTS ---

            // Floating Platform 1 (Left)
            drawPlatform(width * 0.15, groundY - 100, 100, 30);
            
            // Floating Platform 2 (High Center - The Challenge)
            drawPlatform(width * 0.45, groundY - 180, 80, 30);
            
            // Stacked Blocks (Right)
            drawBlock(width * 0.75, groundY - 50, 40);
            drawBlock(width * 0.75, groundY - 90, 40);
            drawBlock(width * 0.80, groundY - 90, 40); // L-shape

            // Goal Post (Far Right)
            drawGoal(width * 0.9, groundY);
        }

        function drawPlatform(x, y, w, h) {
            // Dirt body
            drawRect(x, y, w, h, palette.brick, 4);
            // Grass top
            drawRect(x, y, w, 8, palette.grass, 4);
            // Detail: Brick lines
            ctx.strokeStyle = palette.brickDark;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x + 10, y + 10); ctx.lineTo(x + 30, y + 10);
            ctx.moveTo(x + 40, y + 20); ctx.lineTo(x + 60, y + 20);
            ctx.stroke();
        }

        function drawBlock(x, y, size) {
            drawRect(x, y, size, size, palette.brick, 4);
            // Question mark or brick pattern
            ctx.fillStyle = palette.brickDark;
            ctx.font = "bold 20px sans-serif";
            ctx.fillText("?", x + 12, y + 28);
            // Shine
            drawRect(x + 2, y + 2, 4, 4, '#fff');
        }

        function drawGoal(x, y) {
            // Pole
            ctx.fillStyle = '#ddd';
            ctx.fillRect(x - 3, y - 150, 6, 150);
            // Ball
            drawCircle(x, y - 150, 8, palette.coinGold);
            // Flag
            ctx.fillStyle = palette.flagRed;
            ctx.beginPath();
            ctx.moveTo(x + 3, y - 150);
            ctx.lineTo(x + 40, y - 135 + Math.sin(time*0.01)*5); // Waving
            ctx.lineTo(x + 3, y - 120);
            ctx.fill();
            // Base
            drawRect(x - 15, y - 10, 30, 10, palette.brick, 4);
        }

        // --- LAYER 3: FOREGROUND (Hero, Enemies, Coins) ---
        function drawForeground() {
            const groundY = height * 0.75;

            // HERO (Dynamic Pose)
            // Bouncing animation
            const bounce = Math.abs(Math.sin(time * 0.015)) * 15;
            const heroX = width * 0.25;
            const heroY = groundY - bounce;
            drawHero(heroX, heroY);

            // ENEMY (Walking)
            const enemyX = (width * 0.5) + (Math.sin(time * 0.005) * 60);
            const enemyY = groundY;
            drawEnemy(enemyX, enemyY);

            // COINS (Spinning)
            drawCoin(width * 0.18, groundY - 140);
            drawCoin(width * 0.48, groundY - 220);
            drawCoin(width * 0.52, groundY - 220);
            drawCoin(width * 0.77, groundY - 130);
        }

        // --- SPRITE DRAWING FUNCTIONS ---

        function drawHero(x, y) {
            ctx.save();
            ctx.translate(x, y);

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(0, 0, 15, 5, 0, 0, Math.PI*2);
            ctx.fill();

            // Body (Red Sphere)
            drawCircle(0, -35, 20, palette.heroRed);
            
            // Face (White)
            drawCircle(0, -38, 14, palette.heroSkin);
            
            // Eyes
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(4, -40, 2, 0, Math.PI*2); // Right
            ctx.arc(-4, -40, 2, 0, Math.PI*2); // Left
            ctx.fill();

            // Shoes (Blue/Black)
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.ellipse(-8, -10, 8, 5, 0, 0, Math.PI*2);
            ctx.ellipse(8, -10, 8, 5, 0, 0, Math.PI*2);
            ctx.fill();

            // Gloves (White)
            ctx.fillStyle = '#fff';
            // Left arm waving
            ctx.beginPath();
            ctx.arc(-15 + Math.sin(time*0.05)*5, -35, 6, 0, Math.PI*2);
            ctx.fill();
            // Right arm
            ctx.beginPath();
            ctx.arc(15, -30, 6, 0, Math.PI*2);
            ctx.fill();

            ctx.restore();
        }

        function drawEnemy(x, y) {
            ctx.save();
            ctx.translate(x, y);
            
            // Bobbing
            const bob = Math.abs(Math.sin(time * 0.02)) * 3;
            ctx.translate(0, -bob);

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(0, 0, 12, 4, 0, 0, Math.PI*2);
            ctx.fill();

            // Mushroom Head
            ctx.fillStyle = palette.enemyBrown;
            ctx.beginPath();
            ctx.arc(0, -20, 18, Math.PI, 0); // Dome
            ctx.lineTo(18, -10);
            ctx.lineTo(-18, -10);
            ctx.fill();

            // Stem
            ctx.fillStyle = '#eee';
            ctx.fillRect(-10, -10, 20, 12);

            // Feet
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.ellipse(-6, 0, 5, 3, 0, 0, Math.PI*2);
            ctx.ellipse(6, 0, 5, 3, 0, 0, Math.PI*2);
            ctx.fill();

            // Angry Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(-8, -15); ctx.lineTo(-4, -12); ctx.lineTo(-8, -9); ctx.fill();
            ctx.moveTo(8, -15); ctx.lineTo(4, -12); ctx.lineTo(8, -9); ctx.fill();

            ctx.restore();
        }

        function drawCoin(x, y) {
            const spin = Math.abs(Math.sin(time * 0.008 + x));
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(spin, 1);
            
            // Outer Gold
            drawCircle(0, 0, 10, palette.coinGold);
            // Inner Shine
            drawCircle(0, 0, 7, '#ffe082');
            // Center Dot
            drawCircle(0, 0, 2, '#f57f17');
            
            ctx.restore();
        }

        // --- ANIMATION LOOP ---
        function animate(timestamp) {
            time = timestamp || 0;
            
            ctx.clearRect(0, 0, width, height);

            drawBackground();
            drawMidground();
            drawForeground();

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        // --- INTERACTIVITY ---
        function startGame() {
            const btn = document.querySelector('.start-btn');
            const originalText = btn.innerText;
            
            btn.innerText = "LOADING...";
            btn.style.transform = "translateY(6px)";
            btn.style.boxShadow = "0 0 0 var(--ui-accent-dark)";
            
            // Simulate load
            setTimeout(() => {
                // Flash effect
                document.body.style.filter = "brightness(1.5)";
                setTimeout(() => {
                    document.body.style.filter = "brightness(1)";
                    alert("Game Started! (Demo End)");
                    btn.innerText = originalText;
                    btn.style.transform = "translateY(0)";
                    btn.style.boxShadow = "";
                }, 100);
            }, 800);
        }

    </script>
</body>
</html>
