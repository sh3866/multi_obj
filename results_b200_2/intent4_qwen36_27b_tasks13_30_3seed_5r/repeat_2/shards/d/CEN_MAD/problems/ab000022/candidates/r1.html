<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Bounce: The Lost Glitch</title>
    <style>
        :root {
            --bg-deep: #090515;
            --bg-surface: #140b2e;
            --glass-bg: rgba(15, 10, 30, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            
            --accent-primary: #ff00cc; /* Neon Pink */
            --accent-secondary: #00f2ff; /* Cyan */
            --accent-success: #00ff99; /* Lime */
            --accent-warning: #ffcc00; /* Gold */
            
            --radius-card: 12px;
            --radius-btn: 24px;
            --radius-key: 6px;
            
            --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-deep);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            color: white;
        }

        /* --- CANVAS LAYER --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            grid-template-rows: 80px 1fr 100px;
            padding: 20px 40px;
            pointer-events: none;
        }

        /* --- COMMON UI CLASSES --- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-card);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            pointer-events: auto;
            transition: transform 0.2s ease;
        }

        .section-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 8px;
            font-weight: 700;
        }

        /* --- HEADER --- */
        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        .game-logo {
            font-size: 2rem;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: -1px;
            background: linear-gradient(90deg, var(--accent-secondary), #fff, var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.4));
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: rgba(255, 255, 255, 0.7);
            padding: 10px 24px;
            border-radius: var(--radius-btn);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .settings-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        /* --- LEFT PANEL (Stats) --- */
        .panel-left {
            grid-column: 1;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 20px;
        }

        .stat-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
        }

        .stat-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }
        
        .stat-icon svg { width: 20px; height: 20px; }

        .stat-content h4 {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 2px;
        }
        .stat-content span {
            font-size: 1.1rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        /* --- CENTER STAGE (Hero & Action) --- */
        .stage-center {
            grid-column: 2;
            grid-row: 2 / 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end; /* Pushes button to bottom */
            padding-bottom: 40px;
            pointer-events: none;
        }

        /* The Mission Briefing Box - Connected to Hero */
        .mission-box {
            margin-bottom: 80px; /* Space for the hero standing below */
            text-align: center;
            padding: 20px 40px;
            max-width: 400px;
            pointer-events: auto;
            position: relative;
            animation: floatUI 4s ease-in-out infinite;
        }

        /* Connector line to hero */
        .mission-box::after {
            content: '';
            position: absolute;
            bottom: -160px; /* Reaches down to hero */
            left: 50%;
            width: 2px;
            height: 140px;
            background: linear-gradient(to bottom, var(--accent-secondary), transparent);
            opacity: 0.5;
            z-index: -1;
        }

        .level-tag {
            background: var(--accent-primary);
            color: white;
            font-weight: 800;
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 10px;
            box-shadow: 0 0 15px var(--accent-primary);
        }

        .mission-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
            line-height: 1.1;
        }

        .mission-desc {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.4;
        }

        /* Start Button - Prominent */
        .start-btn-container {
            pointer-events: auto;
            position: relative;
            z-index: 20;
        }

        .start-btn {
            background: linear-gradient(135deg, var(--accent-primary), #a200ff);
            color: white;
            border: none;
            padding: 20px 80px;
            font-size: 1.6rem;
            font-weight: 900;
            border-radius: var(--radius-btn);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 30px rgba(255, 0, 204, 0.5), inset 0 2px 0 rgba(255,255,255,0.3);
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(255, 0, 204, 0.7);
        }
        
        .start-btn:active {
            transform: scale(0.95);
        }

        /* --- RIGHT PANEL (Controls & World) --- */
        .panel-right {
            grid-column: 3;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
            align-items: flex-end;
        }

        .world-selector {
            width: 100%;
            padding: 16px;
            text-align: right;
        }

        .world-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-success);
            margin-bottom: 8px;
        }

        .world-nav {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .nav-arrow {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-key);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-arrow:hover { background: var(--accent-success); color: black; }

        /* Controls Guide */
        .controls-guide {
            width: 100%;
            padding: 16px;
            align-items: flex-end;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-bottom: 10px;
        }
        .control-row:last-child { margin-bottom: 0; }

        .action-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
        }

        .keycap {
            background: linear-gradient(to bottom, #2a2a2a, #1a1a1a);
            border: 1px solid #444;
            border-bottom: 3px solid #000;
            border-radius: var(--radius-key);
            padding: 6px 10px;
            font-family: monospace;
            font-size: 0.9rem;
            font-weight: bold;
            color: white;
            min-width: 28px;
            text-align: center;
            box-shadow: 0 2px 0 rgba(255,255,255,0.1);
        }

        /* --- ANIMATIONS --- */
        @keyframes floatUI {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 1000px) {
            .ui-layer {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr auto;
                padding: 20px;
            }
            .panel-left, .panel-right { display: none; } /* Simplified mobile view */
            header { grid-row: 1; margin-bottom: 20px; }
            .stage-center { grid-column: 1; grid-row: 2 / 4; justify-content: center; }
            .mission-box { margin-bottom: 40px; }
            .mission-box::after { display: none; }
            .start-btn-container { margin-top: auto; }
        }
    </style>
</head>
<body>

    <!-- Background & Game World -->
    <canvas id="bg-canvas"></canvas>

    <!-- UI Overlay -->
    <div class="ui-layer">
        
        <!-- Top Navigation -->
        <header>
            <div class="game-logo">Neon Bounce</div>
            <button class="settings-btn">OPTIONS</button>
        </header>

        <!-- Left Panel: Stats -->
        <div class="panel-left glass-panel">
            <div class="section-label">Player Stats</div>
            
            <div class="stat-card">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#ffcc00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M8 10l4-4 4 4M8 14l4 4 4-4" stroke="none"/><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 4a3 3 0 1 1 0 6 3 3 0 0 1 0-6z" fill="#ffcc00" stroke="none"/></svg>
                </div>
                <div class="stat-content">
                    <h4>Total Coins</h4>
                    <span style="color: var(--accent-warning)">1,240</span>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#00ff99" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="#00ff99" stroke="none"/></svg>
                </div>
                <div class="stat-content">
                    <h4>High Score</h4>
                    <span style="color: var(--accent-success)">98,500</span>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#ff00cc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#ff00cc" stroke="none"/></svg>
                </div>
                <div class="stat-content">
                    <h4>Lives</h4>
                    <span style="color: var(--accent-primary)">3 / 3</span>
                </div>
            </div>
        </div>

        <!-- Center Stage: Mission & Action -->
        <div class="stage-center">
            
            <!-- Mission Briefing -->
            <div class="mission-box glass-panel">
                <div class="level-tag">LEVEL 1-1</div>
                <h2 class="mission-title">Cyber Plains</h2>
                <p class="mission-desc">
                    The grid is glitching. Dash past the Glitch-Bats and collect data-fragments to restore the system!
                </p>
            </div>

            <!-- Action Button -->
            <div class="start-btn-container">
                <button class="start-btn" onclick="startGame()">Start Adventure</button>
            </div>

        </div>

        <!-- Right Panel: Context & Controls -->
        <div class="panel-right">
            <div class="world-selector glass-panel">
                <div class="section-label">Current Sector</div>
                <div class="world-name">Neon Valley</div>
                <div class="world-nav">
                    <div class="nav-arrow">◄</div>
                    <div class="nav-arrow">►</div>
                </div>
            </div>

            <div class="controls-guide glass-panel">
                <div class="section-label">Controls</div>
                
                <div class="control-row">
                    <span class="action-label">Jump</span>
                    <div class="keycap">Z</div>
                </div>
                
                <div class="control-row">
                    <span class="action-label">Dash</span>
                    <div class="keycap">X</div>
                </div>
                
                <div class="control-row">
                    <span class="action-label">Move</span>
                    <div class="keycap">←</div>
                    <div class="keycap">→</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- CANVAS DRAWING LOGIC ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const colors = {
            skyTop: '#05020a',
            skyMid: '#1a0b2e',
            skyBot: '#2d1b4e',
            neonPink: '#ff00cc',
            neonCyan: '#00f2ff',
            neonYellow: '#ffcc00',
            neonGreen: '#00ff99',
            darkPurple: '#120626'
        };

        // --- ENTITIES ---

        // 1. Background Layer (Distant City/Grid)
        function drawBackground(time) {
            ctx.save();
            // Gradient Sky
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, colors.skyTop);
            grad.addColorStop(0.6, colors.skyMid);
            grad.addColorStop(1, colors.skyBot);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Distant Sun
            const sunY = height * 0.4;
            const sunRadius = Math.min(width, height) * 0.18;
            const sunGrad = ctx.createLinearGradient(0, sunY - sunRadius, 0, sunY + sunRadius);
            sunGrad.addColorStop(0, colors.neonPink);
            sunGrad.addColorStop(1, colors.neonYellow);
            
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(width * 0.7, sunY, sunRadius, 0, Math.PI * 2);
            ctx.fill();

            // Sun Stripes
            ctx.fillStyle = colors.skyMid; // Mask color
            for(let i = 0; i < 8; i++) {
                let h = 4 + i * 3;
                let y = sunY + (10 + i * 14);
                if (y < sunY + sunRadius) {
                    ctx.fillRect(width * 0.7 - sunRadius, y, sunRadius * 2, h);
                }
            }
            ctx.restore();
        }

        // 2. Midground (Parallax Grid Floor)
        function drawGrid(time) {
            ctx.save();
            const horizon = height * 0.55;
            ctx.globalAlpha = 0.3;
            ctx.strokeStyle = colors.neonPink;
            ctx.lineWidth = 1;
            
            const centerX = width * 0.7; // Vanishing point offset

            // Moving vertical perspective lines
            for (let i = -30; i <= 30; i++) {
                let x = centerX + (i * 40);
                ctx.beginPath();
                ctx.moveTo(centerX + (i * 10), horizon);
                ctx.lineTo(x * 2.5, height);
                ctx.stroke();
            }

            // Horizontal lines moving down
            let offset = (time * 0.05) % 50;
            for (let i = 0; i < 15; i++) {
                // Exponential spacing for depth
                let y = horizon + Math.pow(i, 2.2) * 1.5 + offset;
                if(y > height) continue;
                
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            ctx.restore();
        }

        // 3. Foreground Level Slice (The Gameplay Story)
        function drawLevelSlice(time) {
            ctx.save();
            
            // Base Ground (Solid)
            const groundY = height * 0.75;
            ctx.fillStyle = '#0a0514';
            ctx.fillRect(0, groundY, width, height - groundY);
            
            // Top border of ground
            ctx.strokeStyle = colors.neonGreen;
            ctx.lineWidth = 4;
            ctx.shadowBlur = 10;
            ctx.shadowColor = colors.neonGreen;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(width, groundY);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // --- HERO (Center Left) ---
            const hX = width * 0.25;
            const hY = groundY - 20; // Standing on ground
            const bounce = Math.abs(Math.sin(time * 0.005)) * 5; // Idle bob
            const heroY = hY - bounce;

            drawHero(hX, heroY, time);

            // --- LEVEL ELEMENTS (Right side, implying forward progress) ---
            
            // Platform 1 (Low)
            const p1X = width * 0.45;
            const p1Y = groundY - 80;
            drawPlatform(p1X, p1Y, 140, 20);
            
            // Coin on Platform 1
            drawCoin(p1X + 70, p1Y - 30, time);

            // Platform 2 (High)
            const p2X = width * 0.65;
            const p2Y = groundY - 180;
            drawPlatform(p2X, p2Y, 100, 20);

            // Enemy (Glitch Bat)
            const enemyX = width * 0.55;
            const enemyY = groundY - 140 + Math.sin(time * 0.008) * 15;
            drawEnemy(enemyX, enemyY, time);

            // Goal (Distant Right)
            const goalX = width * 0.85;
            drawGoal(goalX, groundY, time);

            ctx.restore();
        }

        // --- DRAWING HELPERS ---

        function drawHero(x, y, time) {
            ctx.save();
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.ellipse(x, y + 20, 18, 6, 0, 0, Math.PI*2);
            ctx.fill();

            // Rim Light (Glow)
            ctx.shadowBlur = 15;
            ctx.shadowColor = colors.neonCyan;

            // Body
            ctx.fillStyle = '#00e5ff'; // Slightly darker cyan for body
            ctx.beginPath();
            ctx.arc(x, y, 22, 0, Math.PI * 2);
            ctx.fill();

            // Face
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(x, y, 16, 0, Math.PI * 2);
            ctx.fill();

            // Eyes (Looking Right)
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(x + 6, y - 2, 3, 0, Math.PI * 2); // Right eye
            ctx.arc(x - 6, y - 2, 3, 0, Math.PI * 2); // Left eye
            ctx.fill();

            // Ears
            ctx.fillStyle = '#00e5ff';
            ctx.beginPath();
            ctx.arc(x - 18, y - 12, 8, 0, Math.PI * 2);
            ctx.arc(x + 18, y - 12, 8, 0, Math.PI * 2);
            ctx.fill();

            // Shoes
            ctx.fillStyle = '#ff3300';
            ctx.beginPath();
            ctx.ellipse(x - 12, y + 18, 9, 5, -0.2, 0, Math.PI * 2);
            ctx.ellipse(x + 12, y + 18, 9, 5, 0.2, 0, Math.PI * 2);
            ctx.fill();

            // Scarf (Flowing left)
            ctx.strokeStyle = colors.neonPink;
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x - 15, y - 5);
            ctx.quadraticCurveTo(x - 40, y - 10 + Math.sin(time*0.01)*5, x - 60, y + 5 + Math.sin(time*0.01)*10);
            ctx.stroke();

            ctx.restore();
        }

        function drawPlatform(x, y, w, h) {
            ctx.save();
            ctx.fillStyle = '#1a1a2e';
            ctx.strokeStyle = colors.neonGreen;
            ctx.lineWidth = 2;
            ctx.shadowBlur = 5;
            ctx.shadowColor = colors.neonGreen;
            
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 6);
            ctx.fill();
            ctx.stroke();
            
            // Tech details
            ctx.fillStyle = colors.neonGreen;
            ctx.globalAlpha = 0.8;
            ctx.fillRect(x + 8, y + h/2 - 2, 10, 4);
            ctx.fillRect(x + w - 18, y + h/2 - 2, 10, 4);
            ctx.restore();
        }

        function drawCoin(x, y, time) {
            ctx.save();
            ctx.translate(x, y);
            const scale = Math.abs(Math.sin(time * 0.01));
            ctx.scale(scale, 1);
            
            ctx.fillStyle = colors.neonYellow;
            ctx.shadowBlur = 8;
            ctx.shadowColor = colors.neonYellow;
            
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 0, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawEnemy(x, y, time) {
            ctx.save();
            ctx.translate(x, y);
            
            // Glitch effect (random slight offset)
            if(Math.random() > 0.9) {
                ctx.translate(Math.random() * 4 - 2, Math.random() * 4 - 2);
            }

            ctx.fillStyle = '#ff0055';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff0055';
            
            // Bat/Ghost shape
            ctx.beginPath();
            ctx.moveTo(0, -15);
            ctx.bezierCurveTo(15, -25, 25, -5, 15, 10); // Right wing
            ctx.lineTo(0, 20); // Bottom point
            ctx.lineTo(-15, 10); // Left wing
            ctx.bezierCurveTo(-25, -5, -15, -25, 0, -15); // Left wing top
            ctx.fill();
            
            // Eye
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, -5, 5, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(0, -5, 2, 0, Math.PI*2);
            ctx.fill();

            ctx.restore();
        }

        function drawGoal(x, y, time) {
            ctx.save();
            // Portal glow
            const glow = Math.sin(time * 0.005) * 10 + 20;
            ctx.shadowBlur = glow;
            ctx.shadowColor = colors.neonPink;

            // Pole
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y - 120);
            ctx.stroke();

            // Portal/Flag
            ctx.fillStyle = colors.neonPink;
            ctx.beginPath();
            ctx.moveTo(x, y - 120);
            ctx.lineTo(x + 30, y - 100);
            ctx.lineTo(x, y - 80);
            ctx.fill();
            
            // Base
            ctx.fillStyle = colors.neonCyan;
            ctx.shadowBlur = 0;
            ctx.fillRect(x - 10, y - 10, 20, 10);
            ctx.restore();
        }

        // --- MAIN LOOP ---
        function animate(time) {
            ctx.clearRect(0, 0, width, height);

            drawBackground(time);
            drawGrid(time);
            drawLevelSlice(time);

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        // --- INTERACTIVITY ---
        function startGame() {
            const btn = document.querySelector('.start-btn');
            btn.innerHTML = "LOADING...";
            btn.style.transform = "scale(0.95)";
            
            setTimeout(() => {
                alert("Game Start! (Demo Mode)");
                btn.innerHTML = "START ADVENTURE";
                btn.style.transform = "scale(1)";
            }, 500);
        }

        // Arrow Interactions
        document.querySelectorAll('.nav-arrow').forEach(arrow => {
            arrow.addEventListener('click', () => {
                arrow.style.transform = "scale(0.9)";
                setTimeout(() => arrow.style.transform = "scale(1)", 100);
            });
        });

    </script>
</body>
</html>
