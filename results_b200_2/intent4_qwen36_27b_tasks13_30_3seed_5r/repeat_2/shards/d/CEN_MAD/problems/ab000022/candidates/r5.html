<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUMP JUMP: Cloudy Hills</title>
    <style>
        :root {
            /* Palette: Complementary Blue/Orange */
            --bg-sky-top: #4facfe;
            --bg-sky-bot: #00f2fe;
            --ui-accent: #ffb74d;
            --ui-accent-dark: #f57c00;
            --ui-white: #ffffff;
            --ui-text: #2d3436;
            --ui-text-light: #636e72;
            --shadow-color: rgba(0, 0, 0, 0.15);
            
            /* Dimensions */
            --border-radius-lg: 32px;
            --border-radius-md: 16px;
            --border-radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: linear-gradient(135deg, var(--bg-sky-top), var(--bg-sky-bot));
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Noise Texture Overlay */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        /* --- MAIN CONTAINER --- */
        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Gap handled by absolute positioning of button */
        }

        /* --- 3. TYPOGRAPHY & TITLE --- */
        .title-section {
            text-align: center;
            position: absolute;
            top: -80px; /* Floating above the card */
            left: 0;
            right: 0;
            z-index: 20;
            pointer-events: none;
        }

        h1.game-title {
            font-family: 'Arial Black', 'Impact', 'Segoe UI Black', sans-serif;
            font-size: 5rem;
            color: #fff;
            letter-spacing: 4px;
            line-height: 1;
            margin: 0;
            /* 3D Extrusion Effect */
            text-shadow: 
                0 1px 0 #ccc,
                0 2px 0 #c9c9c9,
                0 3px 0 #bbb,
                0 4px 0 #b9b9b9,
                0 5px 0 #aaa,
                0 6px 1px rgba(0,0,0,.1),
                0 0 5px rgba(0,0,0,.1),
                0 1px 3px rgba(0,0,0,.3),
                0 3px 5px rgba(0,0,0,.2),
                0 5px 10px rgba(0,0,0,.25),
                0 10px 10px rgba(0,0,0,.2),
                0 20px 20px rgba(0,0,0,.15);
            transform: skewX(-6deg) skewY(-2deg);
        }

        .world-badge {
            display: inline-block;
            background: var(--ui-white);
            color: var(--ui-accent-dark);
            padding: 8px 24px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transform: skewX(-6deg);
            margin-top: 10px;
            border: 2px solid #eee;
        }

        /* --- 1 & 5. THE DIORAMA FRAME --- */
        .stage-center {
            width: 100%;
            position: relative;
            perspective: 1200px;
        }

        .game-frame {
            width: 100%;
            aspect-ratio: 16/9;
            max-height: 550px;
            /* Critique: Gradient background for depth instead of flat white */
            background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(245,245,250,0.9) 100%);
            border: 8px solid var(--ui-white);
            border-radius: var(--border-radius-lg);
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.25),
                0 10px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            /* Subtle 3D tilt */
            transform: rotateX(4deg); 
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        .game-frame:hover {
            transform: rotateX(0deg) scale(1.01);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- 4. HUD OVERLAY (Inside Frame) --- */
        .hud-overlay {
            position: absolute;
            top: 24px;
            left: 24px;
            right: 24px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 5;
        }

        .hud-group {
            display: flex;
            gap: 16px;
        }

        .hud-pill {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-radius: var(--border-radius-md);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.8);
        }

        .hud-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .hud-icon svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 2px 0 rgba(0,0,0,0.1));
        }

        .hud-text {
            font-weight: 800;
            color: var(--ui-text);
            font-size: 1rem;
            font-variant-numeric: tabular-nums;
        }

        .hud-controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px 12px;
            border-radius: var(--border-radius-sm);
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--ui-text);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            backdrop-filter: blur(4px);
        }

        .key-cap {
            background: var(--ui-text);
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
            box-shadow: 0 2px 0 #000;
            min-width: 20px;
            text-align: center;
        }

        /* --- 2. ELEVATED CTA --- */
        /* Moved outside the overflow container to prevent clipping */
        .action-area {
            position: absolute;
            bottom: -45px; /* Overlap frame bottom */
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            z-index: 30;
        }

        .start-btn {
            background: var(--ui-accent);
            color: #fff;
            border: none;
            padding: 20px 60px;
            font-size: 1.6rem;
            font-weight: 900;
            border-radius: 24px; 
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 0 rgba(0,0,0,0.2);
            font-family: 'Arial Black', 'Impact', sans-serif;
            
            /* Juicy 3D effect */
            box-shadow: 
                0 12px 0 var(--ui-accent-dark),
                0 20px 30px rgba(0,0,0,0.3);
            
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .start-btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.3), transparent);
            border-radius: 24px 24px 0 0;
        }

        .start-btn:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 17px 0 var(--ui-accent-dark),
                0 25px 40px rgba(0,0,0,0.35);
            filter: brightness(1.05);
        }

        .start-btn:active {
            transform: translateY(7px);
            box-shadow: 
                0 5px 0 var(--ui-accent-dark),
                0 10px 15px rgba(0,0,0,0.3);
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 800px) {
            h1.game-title { font-size: 3rem; }
            .hud-controls { display: none; }
            .start-btn { padding: 16px 40px; font-size: 1.3rem; }
            .title-section { top: -60px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- 3. Refined Typography (Floating above) -->
        <div class="title-section">
            <h1 class="game-title">JUMP JUMP</h1>
            <div class="world-badge">1-1: Cloudy Hills</div>
        </div>

        <!-- 1. Populated Central Viewport -->
        <div class="stage-center">
            <div class="game-frame">
                <canvas id="scene-canvas"></canvas>
                
                <!-- 4. Grouped Secondary UI (HUD Overlay) -->
                <div class="hud-overlay">
                    <div class="hud-group">
                        <div class="hud-pill">
                            <div class="hud-icon">
                                <!-- Coin Icon -->
                                <svg viewBox="0 0 24 24" fill="none" stroke="#f9c74f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="9" fill="#f9c74f"></circle>
                                    <path d="M12 16V8M9 12h6" stroke="#f57f17" stroke-width="2"></path>
                                </svg>
                            </div>
                            <span class="hud-text">x 08</span>
                        </div>
                        <div class="hud-pill">
                            <div class="hud-icon">
                                <!-- Heart Icon -->
                                <svg viewBox="0 0 24 24" fill="#ef476f" stroke="#ef476f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                                </svg>
                            </div>
                            <span class="hud-text">x 3</span>
                        </div>
                    </div>

                    <div class="hud-controls">
                        <div class="control-row">
                            <span class="key-cap">Z</span> Jump
                        </div>
                        <div class="control-row">
                            <span class="key-cap">X</span> Run
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. Elevated CTA (Outside overflow) -->
            <div class="action-area">
                <button class="start-btn" onclick="startGame()">Start Adventure</button>
            </div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('scene-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let time = 0;

        // Colors - Updated for higher contrast and "Mascot" feel
        const palette = {
            skyTop: '#4facfe',
            skyBot: '#00f2fe',
            cloud: 'rgba(255, 255, 255, 0.9)',
            grass: '#76c842',
            grassDark: '#56ab2f',
            dirt: '#e6a15c',
            dirtDark: '#c06c35',
            brick: '#e76f51',
            brickDark: '#c05236',
            heroRed: '#ef476f',
            heroSkin: '#ffd166',
            coinGold: '#f9c74f',
            enemyBrown: '#6d597a',
            flagRed: '#ef476f'
        };

        function resize() {
            const container = canvas.parentElement;
            width = canvas.width = container.clientWidth;
            height = canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resize);
        // Initial setup
        setTimeout(resize, 50);

        // --- DRAWING HELPERS ---

        function drawCircle(x, y, r, color) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawRect(x, y, w, h, color, radius = 0) {
            ctx.fillStyle = color;
            if (radius > 0) {
                ctx.beginPath();
                ctx.roundRect(x, y, w, h, radius);
                ctx.fill();
            } else {
                ctx.fillRect(x, y, w, h);
            }
        }

        // --- LAYER 1: BACKGROUND ---
        function drawBackground() {
            // Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, palette.skyTop);
            grad.addColorStop(1, palette.skyBot);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Clouds (Parallax: moves very slow)
            ctx.fillStyle = palette.cloud;
            const drawCloud = (x, y, scale) => {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(scale, scale);
                ctx.beginPath();
                ctx.arc(0, 0, 30, 0, Math.PI * 2);
                ctx.arc(25, -10, 35, 0, Math.PI * 2);
                ctx.arc(50, 0, 30, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            };

            const cloudSpeed = 0.3;
            const cloudOffset = (time * cloudSpeed) % (width + 300);
            
            drawCloud(100 - cloudOffset, height * 0.25, 1.2);
            drawCloud(450 - cloudOffset, height * 0.15, 0.8);
            drawCloud(800 - cloudOffset, height * 0.35, 1.5);
            // Loop logic
            drawCloud(100 - cloudOffset + width + 300, height * 0.25, 1.2);
            drawCloud(450 - cloudOffset + width + 300, height * 0.15, 0.8);

            // Distant Hills (Parallax: slow)
            ctx.fillStyle = '#a8e6cf'; 
            ctx.beginPath();
            ctx.moveTo(0, height);
            for(let i=0; i<=width; i+=50) {
                const hillH = Math.sin((i + time * 0.5) * 0.005) * 50;
                ctx.lineTo(i, height - 150 + hillH);
            }
            ctx.lineTo(width, height);
            ctx.fill();
            
            // Second Hill Layer (Closer)
            ctx.fillStyle = '#88d8b0';
            ctx.beginPath();
            ctx.moveTo(0, height);
            for(let i=0; i<=width; i+=50) {
                const hillH = Math.sin((i + time * 0.8) * 0.008) * 30;
                ctx.lineTo(i, height - 100 + hillH);
            }
            ctx.lineTo(width, height);
            ctx.fill();
        }

        // --- LAYER 2: MIDGROUND ---
        function drawMidground() {
            const groundY = height * 0.75;
            
            // Infinite scroll effect for ground texture
            const groundScroll = (time * 3) % 40; 
            
            // Dirt Base
            drawRect(0, groundY, width, height - groundY, palette.dirt);
            // Grass Top
            drawRect(0, groundY, width, 24, palette.grass);
            // Grass Dark Strip (Depth)
            drawRect(0, groundY + 24, width, 4, palette.grassDark);
            
            // Ground Texture
            ctx.fillStyle = palette.dirtDark;
            for(let x = -groundScroll; x < width; x += 40) {
                ctx.beginPath();
                ctx.arc(x, groundY + 40, 5, 0, Math.PI*2);
                ctx.arc(x + 20, groundY + 60, 4, 0, Math.PI*2);
                ctx.fill();
            }

            // --- STORYTELLING ELEMENTS ---

            // Floating Platform 1
            drawPlatform(width * 0.15, groundY - 120, 110, 30);
            
            // Floating Platform 2
            drawPlatform(width * 0.45, groundY - 200, 90, 30);
            
            // Stacked Blocks
            drawBlock(width * 0.75, groundY - 50, 40);
            drawBlock(width * 0.75, groundY - 90, 40);
            drawBlock(width * 0.80, groundY - 90, 40);

            // Goal Post
            drawGoal(width * 0.9, groundY);
        }

        function drawPlatform(x, y, w, h) {
            // Dirt body
            drawRect(x, y, w, h, palette.brick, 6);
            // Grass top
            drawRect(x, y, w, 10, palette.grass, 6);
            // Detail: Brick lines
            ctx.strokeStyle = palette.brickDark;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x + 15, y + 15); ctx.lineTo(x + 40, y + 15);
            ctx.moveTo(x + 50, y + 25); ctx.lineTo(x + 70, y + 25);
            ctx.stroke();
        }

        function drawBlock(x, y, size) {
            drawRect(x, y, size, size, palette.brick, 6);
            // Question mark
            ctx.fillStyle = palette.brickDark;
            ctx.font = "bold 22px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("?", x + size/2, y + size - 10);
            // Shine
            drawRect(x + 4, y + 4, 6, 6, 'rgba(255,255,255,0.4)');
        }

        function drawGoal(x, y) {
            // Pole
            ctx.fillStyle = '#eee';
            ctx.fillRect(x - 4, y - 160, 8, 160);
            // Ball
            drawCircle(x, y - 160, 10, palette.coinGold);
            // Flag
            ctx.fillStyle = palette.flagRed;
            ctx.beginPath();
            ctx.moveTo(x + 4, y - 160);
            ctx.lineTo(x + 45, y - 140 + Math.sin(time*0.02)*8); 
            ctx.lineTo(x + 4, y - 115);
            ctx.fill();
            // Base
            drawRect(x - 15, y - 15, 30, 15, palette.brick, 4);
        }

        // --- LAYER 3: FOREGROUND ---
        function drawForeground() {
            const groundY = height * 0.75;

            // HERO
            const bounce = Math.abs(Math.sin(time * 0.015)) * 15;
            const heroX = width * 0.25;
            const heroY = groundY - bounce;
            drawHero(heroX, heroY);

            // ENEMY
            const enemyX = (width * 0.5) + (Math.sin(time * 0.005) * 60);
            const enemyY = groundY;
            drawEnemy(enemyX, enemyY);

            // COINS
            drawCoin(width * 0.18, groundY - 160);
            drawCoin(width * 0.48, groundY - 240);
            drawCoin(width * 0.52, groundY - 240);
            drawCoin(width * 0.77, groundY - 130);
        }

        // --- SPRITE DRAWING FUNCTIONS ---

        function drawHero(x, y) {
            ctx.save();
            ctx.translate(x, y);

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(0, 0, 18, 6, 0, 0, Math.PI*2);
            ctx.fill();

            // Body (Red Sphere)
            drawCircle(0, -35, 22, palette.heroRed);
            
            // Face (White)
            drawCircle(0, -38, 16, palette.heroSkin);
            
            // Eyes
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(6, -40, 3, 0, Math.PI*2); 
            ctx.arc(-6, -40, 3, 0, Math.PI*2); 
            ctx.fill();

            // Shoes
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.ellipse(-10, -12, 9, 6, 0, 0, Math.PI*2);
            ctx.ellipse(10, -12, 9, 6, 0, 0, Math.PI*2);
            ctx.fill();

            // Gloves
            ctx.fillStyle = '#fff';
            // Left arm waving
            ctx.beginPath();
            ctx.arc(-18 + Math.sin(time*0.05)*6, -38, 8, 0, Math.PI*2);
            ctx.fill();
            // Right arm
            ctx.beginPath();
            ctx.arc(18, -32, 8, 0, Math.PI*2);
            ctx.fill();

            ctx.restore();
        }

        function drawEnemy(x, y) {
            ctx.save();
            ctx.translate(x, y);
            
            const bob = Math.abs(Math.sin(time * 0.02)) * 4;
            ctx.translate(0, -bob);

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(0, 0, 14, 5, 0, 0, Math.PI*2);
            ctx.fill();

            // Mushroom Head
            ctx.fillStyle = palette.enemyBrown;
            ctx.beginPath();
            ctx.arc(0, -22, 20, Math.PI, 0); 
            ctx.lineTo(20, -12);
            ctx.lineTo(-20, -12);
            ctx.fill();

            // Stem
            ctx.fillStyle = '#eee';
            ctx.fillRect(-12, -12, 24, 14);

            // Feet
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.ellipse(-7, 2, 6, 4, 0, 0, Math.PI*2);
            ctx.ellipse(7, 2, 6, 4, 0, 0, Math.PI*2);
            ctx.fill();

            // Angry Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(-9, -18); ctx.lineTo(-3, -14); ctx.lineTo(-9, -10); ctx.fill();
            ctx.moveTo(9, -18); ctx.lineTo(3, -14); ctx.lineTo(9, -10); ctx.fill();

            ctx.restore();
        }

        function drawCoin(x, y) {
            const spin = Math.abs(Math.sin(time * 0.008 + x));
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(spin, 1);
            
            // Outer Gold
            drawCircle(0, 0, 12, palette.coinGold);
            // Inner Shine
            drawCircle(0, 0, 8, '#ffe082');
            // Center Dot
            drawCircle(0, 0, 3, '#f57f17');
            
            ctx.restore();
        }

        // --- ANIMATION LOOP ---
        function animate(timestamp) {
            time = timestamp || 0;
            
            ctx.clearRect(0, 0, width, height);

            drawBackground();
            drawMidground();
            drawForeground();

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        // --- INTERACTIVITY ---
        function startGame() {
            const btn = document.querySelector('.start-btn');
            const originalText = btn.innerText;
            
            btn.innerText = "LOADING...";
            btn.style.transform = "translateY(6px)";
            btn.style.boxShadow = "0 0 0 var(--ui-accent-dark)";
            
            // Simulate load
            setTimeout(() => {
                // Flash effect
                document.body.style.filter = "brightness(1.5)";
                setTimeout(() => {
                    document.body.style.filter = "brightness(1)";
                    alert("Game Started! (Demo End)");
                    btn.innerText = originalText;
                    btn.style.transform = "translateY(0)";
                    btn.style.boxShadow = "";
                }, 100);
            }, 800);
        }

    </script>
</body>
</html>
