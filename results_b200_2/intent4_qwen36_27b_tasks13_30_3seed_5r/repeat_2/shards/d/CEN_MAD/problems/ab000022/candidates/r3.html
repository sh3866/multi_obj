<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jump Jump: Cloudy Hills</title>
    <style>
        :root {
            /* Palette */
            --bg-sky-top: #6dd5ed;
            --bg-sky-bot: #2193b0;
            --ui-card-bg: #fffcf5;
            --ui-card-border: #5d4037;
            --ui-accent: #ffb74d;
            --ui-accent-dark: #f57c00;
            --text-dark: #3e2723;
            --text-muted: #8d6e63;
            
            /* Dimensions */
            --header-height: 90px;
            --footer-height: 120px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            /* Thematic Polish: Gradient + Noise */
            background: linear-gradient(135deg, var(--bg-sky-top), var(--bg-sky-bot));
            position: relative;
        }

        /* Noise Texture Overlay */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        /* --- LAYOUT GRID --- */
        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-rows: var(--header-height) 1fr var(--footer-height);
            padding: 20px 40px;
        }

        /* --- 3. HEADER RESTRUCTURE --- */
        header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 20px;
        }

        /* Left: Stats (Lowered visual weight) */
        .stats-area {
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: flex-start;
            opacity: 0.85;
        }

        .stat-pill {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.4);
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .icon-coin { color: #ffd700; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .icon-heart { color: #ff4757; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }

        /* Center: Title & World (Cohesive block) */
        .title-block {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Thematic Polish: Chunky Font Style */
        h1.game-title {
            /* Fallback stack for chunky look without external fonts */
            font-family: 'Arial Black', 'Impact', 'Segoe UI Black', sans-serif;
            font-size: 2.5rem;
            color: #fff;
            letter-spacing: -1px;
            line-height: 0.9;
            /* 3D Text Effect */
            text-shadow: 
                0 1px 0 #ccc,
                0 2px 0 #c9c9c9,
                0 3px 0 #bbb,
                0 4px 0 #b9b9b9,
                0 5px 0 #aaa,
                0 6px 1px rgba(0,0,0,.1),
                0 0 5px rgba(0,0,0,.1),
                0 1px 3px rgba(0,0,0,.3),
                0 3px 5px rgba(0,0,0,.2),
                0 5px 10px rgba(0,0,0,.25),
                0 10px 10px rgba(0,0,0,.2),
                0 20px 20px rgba(0,0,0,.15);
            transform: skewY(-2deg); /* Slight dynamic tilt */
        }

        .world-badge {
            margin-top: 5px;
            background: var(--ui-accent);
            color: var(--ui-card-border);
            padding: 4px 16px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid #fff;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        /* Right: Controls (Lowered visual weight) */
        .controls-area {
            display: flex;
            justify-content: flex-end;
            opacity: 0.85;
        }

        .key-hint {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            padding: 6px 12px;
            border-radius: 8px;
            color: #fff;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .kbd {
            background: #fff;
            color: #333;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
            box-shadow: 0 2px 0 #ccc;
        }

        /* --- 2. CENTER STAGE (FIXED PERSPECTIVE) --- */
        .stage-center {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 1200px; /* Keep perspective for subtle hover, but base is flat */
        }

        /* The Frame */
        .game-frame {
            width: 80%;
            max-width: 900px;
            height: 100%;
            max-height: 500px;
            background: var(--ui-card-bg);
            border: 6px solid var(--ui-card-border);
            border-radius: 24px;
            /* Removed the trapezoid rotation */
            transform: rotateX(2deg); /* Very subtle tilt for depth, not trapezoid */
            transform-style: preserve-3d;
            box-shadow: 
                0 20px 0 var(--ui-card-border), /* Chunky 3D side */
                0 40px 50px rgba(0,0,0,0.3);    /* Drop shadow */
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease;
        }

        .game-frame:hover {
            transform: rotateX(0deg) scale(1.01);
        }

        /* Canvas fills the frame */
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #87CEEB; /* Fallback */
        }

        /* --- 4. REFINED CTA --- */
        .action-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .start-btn {
            background: var(--ui-accent);
            color: var(--ui-card-border);
            border: none;
            padding: 14px 40px;
            font-size: 1.2rem;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            
            /* Reduced visual dominance: Softer shadow, lower contrast */
            box-shadow: 
                0 6px 0 var(--ui-accent-dark),
                0 10px 10px rgba(0,0,0,0.15);
            
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Arial Black', sans-serif;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 8px 0 var(--ui-accent-dark),
                0 15px 20px rgba(0,0,0,0.2);
            filter: brightness(1.1);
        }

        .start-btn:active {
            transform: translateY(6px);
            box-shadow: 
                0 0 0 var(--ui-accent-dark),
                0 0 0 rgba(0,0,0,0);
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 800px) {
            .app-container { padding: 10px; }
            .game-frame { width: 100%; transform: none; border-width: 4px; box-shadow: 0 10px 0 var(--ui-card-border); }
            .game-title { font-size: 1.8rem; }
            .stats-area, .controls-area { opacity: 0.6; }
            .stat-pill span:not(.icon-coin):not(.icon-heart) { display: none; } /* Hide text, keep icons on mobile */
            .key-hint { display: none; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- 3. Restructured Header -->
        <header>
            <!-- Left: Stats -->
            <div class="stats-area">
                <div class="stat-pill">
                    <span class="icon-coin">●</span>
                    <span>x 08</span>
                </div>
                <div class="stat-pill">
                    <span class="icon-heart">♥</span>
                    <span>x 3</span>
                </div>
            </div>

            <!-- Center: Title & World -->
            <div class="title-block">
                <h1 class="game-title">JUMP JUMP</h1>
                <div class="world-badge">1-1: Cloudy Hills</div>
            </div>

            <!-- Right: Controls -->
            <div class="controls-area">
                <div class="key-hint">
                    <span>Jump <span class="kbd">Z</span></span>
                    <span>Run <span class="kbd">X</span></span>
                </div>
            </div>
        </header>

        <!-- 1 & 2. Central Scene (Populated & Fixed Perspective) -->
        <div class="stage-center">
            <div class="game-frame">
                <canvas id="scene-canvas"></canvas>
            </div>
        </div>

        <!-- 4. Refined CTA -->
        <div class="action-footer">
            <button class="start-btn" onclick="startGame()">Start Adventure</button>
        </div>

    </div>

    <script>
        /**
         * DESIGN CRITIQUE IMPLEMENTATION:
         * 1. Populate Central Scene: Implemented parallax layers, detailed sprites (Hero, Enemy, Goal), and gameplay storytelling elements (coins, blocks).
         * 2. Fix Composition: Removed skewed trapezoid. Used flat 2D card with chunky depth (box-shadow).
         * 3. Header Hierarchy: Grouped Title/World center, moved stats/controls to edges with lower opacity.
         * 4. Refined CTA: Reduced button contrast and shadow intensity.
         * 5. Thematic Polish: Added noise overlay to CSS, used chunky system fonts.
         */

        const canvas = document.getElementById('scene-canvas');
        const ctx = canvas.getContext('2d');

        // State
        let width, height;
        let time = 0;
        let scrollOffset = 0; // For parallax effect

        // Colors
        const palette = {
            skyTop: '#4facfe',
            skyBot: '#00f2fe',
            cloud: '#ffffff',
            grass: '#76c842',
            grassDark: '#56ab2f',
            dirt: '#e6a15c',
            dirtDark: '#c06c35',
            brick: '#e76f51',
            brickDark: '#c05236',
            heroRed: '#ef476f',
            heroSkin: '#ffd166',
            coinGold: '#f9c74f',
            enemyBrown: '#6d597a',
            flagRed: '#ef476f'
        };

        function resize() {
            const container = canvas.parentElement;
            width = canvas.width = container.clientWidth;
            height = canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resize);
        setTimeout(resize, 10); // Initial setup

        // --- DRAWING HELPERS ---

        function drawCircle(x, y, r, color) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawRect(x, y, w, h, color, radius = 0) {
            ctx.fillStyle = color;
            if (radius > 0) {
                ctx.beginPath();
                ctx.roundRect(x, y, w, h, radius);
                ctx.fill();
            } else {
                ctx.fillRect(x, y, w, h);
            }
        }

        // --- LAYER 1: BACKGROUND (Sky, Clouds, Distant Hills) ---
        function drawBackground() {
            // Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, palette.skyTop);
            grad.addColorStop(1, palette.skyBot);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Clouds (Parallax: moves very slow)
            ctx.fillStyle = palette.cloud;
            const drawCloud = (x, y, scale) => {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(scale, scale);
                // Cloud shape
                ctx.beginPath();
                ctx.arc(0, 0, 30, 0, Math.PI * 2);
                ctx.arc(25, -10, 35, 0, Math.PI * 2);
                ctx.arc(50, 0, 30, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            };

            // Wrap logic for infinite cloud loop
            const cloudSpeed = 0.2;
            const cloudOffset = (time * cloudSpeed) % (width + 200);
            
            drawCloud(100 - cloudOffset, height * 0.2, 1.2);
            drawCloud(400 - cloudOffset, height * 0.15, 0.8);
            drawCloud(700 - cloudOffset, height * 0.3, 1.5);
            // Duplicate for loop
            drawCloud(100 - cloudOffset + width + 200, height * 0.2, 1.2);
            drawCloud(400 - cloudOffset + width + 200, height * 0.15, 0.8);

            // Distant Hills (Parallax: slow)
            ctx.fillStyle = '#a8e6cf'; // Light green/blue
            ctx.beginPath();
            ctx.moveTo(0, height);
            for(let i=0; i<=width; i+=50) {
                // Gentle sine wave for hills
                const hillH = Math.sin((i + time * 0.5) * 0.005) * 40;
                ctx.lineTo(i, height - 120 + hillH);
            }
            ctx.lineTo(width, height);
            ctx.fill();
        }

        // --- LAYER 2: MIDGROUND (Platforms, Blocks, Goal) ---
        function drawMidground() {
            const groundY = height * 0.75;
            
            // Draw Ground
            // Infinite scroll effect for ground texture
            const groundScroll = (time * 2) % 40; 
            
            // Dirt Base
            drawRect(0, groundY, width, height - groundY, palette.dirt);
            // Grass Top
            drawRect(0, groundY, width, 20, palette.grass);
            
            // Ground Texture (Dots/Grass tufts)
            ctx.fillStyle = palette.dirtDark;
            for(let x = -groundScroll; x < width; x += 40) {
                ctx.beginPath();
                ctx.arc(x, groundY + 30, 4, 0, Math.PI*2);
                ctx.arc(x + 20, groundY + 50, 3, 0, Math.PI*2);
                ctx.fill();
            }

            // --- STORYTELLING ELEMENTS ---

            // Floating Platform 1 (Left)
            drawPlatform(width * 0.15, groundY - 100, 100, 30);
            
            // Floating Platform 2 (High Center - The Challenge)
            drawPlatform(width * 0.45, groundY - 180, 80, 30);
            
            // Stacked Blocks (Right)
            drawBlock(width * 0.75, groundY - 50, 40);
            drawBlock(width * 0.75, groundY - 90, 40);
            drawBlock(width * 0.80, groundY - 90, 40); // L-shape

            // Goal Post (Far Right)
            drawGoal(width * 0.9, groundY);
        }

        function drawPlatform(x, y, w, h) {
            // Dirt body
            drawRect(x, y, w, h, palette.brick, 4);
            // Grass top
            drawRect(x, y, w, 8, palette.grass, 4);
            // Detail: Brick lines
            ctx.strokeStyle = palette.brickDark;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x + 10, y + 10); ctx.lineTo(x + 30, y + 10);
            ctx.moveTo(x + 40, y + 20); ctx.lineTo(x + 60, y + 20);
            ctx.stroke();
        }

        function drawBlock(x, y, size) {
            drawRect(x, y, size, size, palette.brick, 4);
            // Question mark or brick pattern
            ctx.fillStyle = palette.brickDark;
            ctx.font = "bold 20px sans-serif";
            ctx.fillText("?", x + 12, y + 28);
            // Shine
            drawRect(x + 2, y + 2, 4, 4, '#fff');
        }

        function drawGoal(x, y) {
            // Pole
            ctx.fillStyle = '#ddd';
            ctx.fillRect(x - 3, y - 150, 6, 150);
            // Ball
            drawCircle(x, y - 150, 8, palette.coinGold);
            // Flag
            ctx.fillStyle = palette.flagRed;
            ctx.beginPath();
            ctx.moveTo(x + 3, y - 150);
            ctx.lineTo(x + 40, y - 135 + Math.sin(time*0.01)*5); // Waving
            ctx.lineTo(x + 3, y - 120);
            ctx.fill();
            // Base
            drawRect(x - 15, y - 10, 30, 10, palette.brick, 4);
        }

        // --- LAYER 3: FOREGROUND (Hero, Enemies, Coins) ---
        function drawForeground() {
            const groundY = height * 0.75;

            // HERO (Dynamic Pose)
            // Bouncing animation
            const bounce = Math.abs(Math.sin(time * 0.015)) * 15;
            const heroX = width * 0.25;
            const heroY = groundY - bounce;
            drawHero(heroX, heroY);

            // ENEMY (Walking)
            const enemyX = (width * 0.5) + (Math.sin(time * 0.005) * 60);
            const enemyY = groundY;
            drawEnemy(enemyX, enemyY);

            // COINS (Spinning)
            drawCoin(width * 0.18, groundY - 140);
            drawCoin(width * 0.48, groundY - 220);
            drawCoin(width * 0.52, groundY - 220);
            drawCoin(width * 0.77, groundY - 130);
        }

        // --- SPRITE DRAWING FUNCTIONS ---

        function drawHero(x, y) {
            ctx.save();
            ctx.translate(x, y);

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(0, 0, 15, 5, 0, 0, Math.PI*2);
            ctx.fill();

            // Body (Red Sphere)
            drawCircle(0, -35, 20, palette.heroRed);
            
            // Face (White)
            drawCircle(0, -38, 14, palette.heroSkin);
            
            // Eyes
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(4, -40, 2, 0, Math.PI*2); // Right
            ctx.arc(-4, -40, 2, 0, Math.PI*2); // Left
            ctx.fill();

            // Shoes (Blue/Black)
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.ellipse(-8, -10, 8, 5, 0, 0, Math.PI*2);
            ctx.ellipse(8, -10, 8, 5, 0, 0, Math.PI*2);
            ctx.fill();

            // Gloves (White)
            ctx.fillStyle = '#fff';
            // Left arm waving
            ctx.beginPath();
            ctx.arc(-15 + Math.sin(time*0.05)*5, -35, 6, 0, Math.PI*2);
            ctx.fill();
            // Right arm
            ctx.beginPath();
            ctx.arc(15, -30, 6, 0, Math.PI*2);
            ctx.fill();

            ctx.restore();
        }

        function drawEnemy(x, y) {
            ctx.save();
            ctx.translate(x, y);
            
            // Bobbing
            const bob = Math.abs(Math.sin(time * 0.02)) * 3;
            ctx.translate(0, -bob);

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(0, 0, 12, 4, 0, 0, Math.PI*2);
            ctx.fill();

            // Mushroom Head
            ctx.fillStyle = palette.enemyBrown;
            ctx.beginPath();
            ctx.arc(0, -20, 18, Math.PI, 0); // Dome
            ctx.lineTo(18, -10);
            ctx.lineTo(-18, -10);
            ctx.fill();

            // Stem
            ctx.fillStyle = '#eee';
            ctx.fillRect(-10, -10, 20, 12);

            // Feet
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.ellipse(-6, 0, 5, 3, 0, 0, Math.PI*2);
            ctx.ellipse(6, 0, 5, 3, 0, 0, Math.PI*2);
            ctx.fill();

            // Angry Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(-8, -15); ctx.lineTo(-4, -12); ctx.lineTo(-8, -9); ctx.fill();
            ctx.moveTo(8, -15); ctx.lineTo(4, -12); ctx.lineTo(8, -9); ctx.fill();

            ctx.restore();
        }

        function drawCoin(x, y) {
            const spin = Math.abs(Math.sin(time * 0.008 + x));
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(spin, 1);
            
            // Outer Gold
            drawCircle(0, 0, 10, palette.coinGold);
            // Inner Shine
            drawCircle(0, 0, 7, '#ffe082');
            // Center Dot
            drawCircle(0, 0, 2, '#f57f17');
            
            ctx.restore();
        }

        // --- ANIMATION LOOP ---
        function animate(timestamp) {
            time = timestamp || 0;
            
            ctx.clearRect(0, 0, width, height);

            drawBackground();
            drawMidground();
            drawForeground();

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        // --- INTERACTIVITY ---
        function startGame() {
            const btn = document.querySelector('.start-btn');
            const originalText = btn.innerText;
            
            btn.innerText = "LOADING...";
            btn.style.transform = "translateY(6px)";
            btn.style.boxShadow = "0 0 0 var(--ui-accent-dark)";
            
            // Simulate load
            setTimeout(() => {
                // Flash effect
                document.body.style.filter = "brightness(1.5)";
                setTimeout(() => {
                    document.body.style.filter = "brightness(1)";
                    alert("Game Started! (Demo End)");
                    btn.innerText = originalText;
                    btn.style.transform = "translateY(0)";
                    btn.style.boxShadow = "";
                }, 100);
            }, 800);
        }

    </script>
</body>
</html>
