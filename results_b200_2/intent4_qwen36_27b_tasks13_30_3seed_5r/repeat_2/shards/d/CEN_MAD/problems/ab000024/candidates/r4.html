<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Ceramic Toilet Illustration</title>
<style>
    :root {
        --bg-wall-top: #f8fafc;
        --bg-wall-bot: #e2e8f0;
        --bg-floor: #cbd5e1;
        --bg-floor-shadow: #94a3b8;
        --ceramic-white: #ffffff;
        --ceramic-shadow: #cbd5e1;
        --chrome-light: #ffffff;
        --chrome-mid: #94a3b8;
        --chrome-dark: #64748b;
        --water-cyan: #e0f2fe;
        --water-deep: #38bdf8;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background: linear-gradient(to bottom, var(--bg-wall-top) 0%, var(--bg-wall-bot) 70%, var(--bg-floor) 70%, var(--bg-floor-shadow) 100%);
        height: 100vh;
        width: 100vw;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
    }

    .stage {
        position: relative;
        width: 100%;
        max-width: 800px;
        height: 600px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    svg.product-illustration {
        width: 100%;
        height: 100%;
        overflow: visible;
        filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.1));
    }

    /* Interactive Handle */
    .flush-trigger {
        cursor: pointer;
        transition: transform 0.1s ease;
        transform-origin: 380px 410px;
    }
    
    .flush-trigger:hover .handle-arm {
        stroke: #e2e8f0; /* Slight highlight on hover */
    }
    
    .flush-trigger:active {
        transform: rotate(-15deg);
    }
    
    /* Animations */
    @keyframes vortex-spin {
        0% { transform: scale(0.8) rotate(0deg); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: scale(1.5) rotate(360deg); opacity: 0; }
    }

    @keyframes water-drop {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        40% { transform: translateY(15px) scale(0.9); opacity: 0.8; }
        100% { transform: translateY(40px) scale(0.5); opacity: 0; }
    }

    @keyframes water-refill {
        0% { transform: translateY(40px) scale(0.5); opacity: 0; }
        100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes splash-particle {
        0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) scale(1.2); opacity: 0; }
    }

    .vortex-group {
        transform-origin: 300px 520px;
    }

    .water-surface {
        transform-origin: 300px 520px;
        transition: all 0.2s ease;
    }

    .flushing .vortex-group {
        animation: vortex-spin 0.8s linear infinite;
    }

    .flushing .water-surface {
        animation: water-drop 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .refilling .water-surface {
        animation: water-refill 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    .particle {
        opacity: 0;
    }

    .flushing .particle {
        animation: splash-particle 0.6s ease-out forwards;
    }
</style>
</head>
<body>

    <div class="stage">
        <svg class="product-illustration" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 1. Materials & Gradients -->
                
                <!-- Porcelain Body: Complex radial for 3D curvature -->
                <radialGradient id="porcelain-body" cx="30%" cy="50%" r="80%">
                    <stop offset="0%" stop-color="#ffffff" /> <!-- Highlight area -->
                    <stop offset="30%" stop-color="#ffffff" /> <!-- Flat white -->
                    <stop offset="80%" stop-color="#f1f5f9" /> <!-- Soft shadow -->
                    <stop offset="100%" stop-color="#94a3b8" /> <!-- Deep edge shadow -->
                </radialGradient>

                <!-- Porcelain Rim/Lid: Lighter, flatter -->
                <linearGradient id="porcelain-rim" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="100%" stop-color="#e2e8f0" />
                </linearGradient>

                <!-- Chrome: Metallic reflection -->
                <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="25%" stop-color="#cbd5e1" />
                    <stop offset="50%" stop-color="#94a3b8" />
                    <stop offset="80%" stop-color="#f8fafc" />
                    <stop offset="100%" stop-color="#475569" />
                </linearGradient>

                <!-- Water: Translucent Cyan -->
                <radialGradient id="water-grad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.9" />
                    <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.8" />
                    <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
                </radialGradient>

                <!-- Floor Shadow Blur -->
                <filter id="blur-shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="15" />
                </filter>

                <!-- Inner Bowl Depth Shadow -->
                <filter id="inner-shadow">
                    <feOffset dx="0" dy="10"/>
                    <feGaussianBlur stdDeviation="10" result="offset-blur"/>
                    <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                    <feFlood flood-color="#0f172a" flood-opacity="0.8" result="color"/>
                    <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                    <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
                </filter>

                <!-- Specular Highlight Gradient -->
                <linearGradient id="specular" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                </linearGradient>
            </defs>

            <!-- 2. Grounding & Shadows -->
            
            <!-- Floor Drop Shadow -->
            <ellipse cx="300" cy="530" rx="160" ry="25" fill="#64748b" opacity="0.4" filter="url(#blur-shadow)" />

            <!-- Plumbing Base (Floor Flange) -->
            <g id="plumbing-base">
                <!-- Flange Base -->
                <ellipse cx="300" cy="525" rx="40" ry="10" fill="#475569" />
                <ellipse cx="300" cy="525" rx="35" ry="8" fill="#334155" />
                <!-- Bolts -->
                <circle cx="275" cy="525" r="2.5" fill="#94a3b8" />
                <circle cx="325" cy="525" r="2.5" fill="#94a3b8" />
            </g>
            
            <!-- 3. The Toilet Geometry -->
            
            <!-- TANK -->
            <g id="tank-group">
                <!-- Tank Body (Rectangular with rounded corners) -->
                <path d="M220,300 L380,300 C391,300 400,309 400,320 L400,430 C400,441 391,450 380,450 L220,450 C209,450 200,441 200,430 L200,320 C200,309 209,300 220,300 Z" fill="url(#porcelain-body)" />
                
                <!-- Tank Lid -->
                <path d="M205,300 L395,300 C398,300 400,302 400,305 L400,315 C400,318 398,320 395,320 L205,320 C202,320 200,318 200,315 L200,305 C200,302 202,300 205,300 Z" fill="url(#porcelain-rim)" />
                
                <!-- Tank Specular Highlight (Left Edge) -->
                <path d="M215,315 L215,430 C215,435 220,440 225,440" stroke="url(#specular)" stroke-width="4" fill="none" stroke-linecap="round" />
            </g>

            <!-- SEAT (Down) -->
            <g id="seat-down">
                <!-- Seat Thickness (Side profile) -->
                <path d="M180,445 C180,465 240,485 300,485 C360,485 420,465 420,445 L420,455 C420,475 360,495 300,495 C240,495 180,475 180,455 Z" fill="#cbd5e1" />
                <!-- Seat Top Surface -->
                <path d="M180,445 C180,465 240,485 300,485 C360,485 420,465 420,445 C420,420 360,400 300,400 C240,400 180,420 180,445 Z" fill="#ffffff" />
                
                <!-- Seat Highlight -->
                <path d="M210,450 C210,465 250,480 300,480" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8" />
            </g>

            <!-- BOWL -->
            <g id="bowl-group">
                <!-- Bowl Body (Front Apron - Curved, Wide Base) -->
                <path d="M200,450 L400,450 C400,520 360,540 300,540 C240,540 200,520 200,450 Z" fill="url(#porcelain-body)" />
                
                <!-- Bowl Specular Highlight (Left Curve) -->
                <path d="M210,470 C210,510 240,530 290,535" stroke="url(#specular)" stroke-width="8" fill="none" stroke-linecap="round" filter="blur(1px)" />
            </g>

            <!-- INNER BOWL & WATER -->
            <g id="bowl-interior">
                <!-- Dark interior depth -->
                <ellipse cx="300" cy="445" rx="110" ry="30" fill="#0f172a" filter="url(#inner-shadow)" />
                
                <!-- Water Surface -->
                <g class="water-surface" id="waterLayer">
                    <ellipse cx="300" cy="445" rx="100" ry="25" fill="url(#water-grad)" />
                    <!-- Water Reflection (Inner shadow effect) -->
                    <ellipse cx="300" cy="445" rx="90" ry="20" fill="none" stroke="#e0f2fe" stroke-width="2" opacity="0.6" />
                </g>

                <!-- The Vortex (Hidden by default) -->
                <g class="vortex-group">
                    <path d="M300,445 Q320,425 300,415 Q280,425 300,445 Z" fill="#0284c7" />
                    <circle cx="300" cy="445" r="10" fill="none" stroke="#bae6fd" stroke-width="2" stroke-dasharray="10 5" />
                </g>

                <!-- Splash Particles (Hidden by default) -->
                <g id="particles">
                    <circle cx="300" cy="445" r="4" fill="#bae6fd" class="particle" style="--tx: -40px; --ty: -60px;" />
                    <circle cx="300" cy="445" r="3" fill="#bae6fd" class="particle" style="--tx: 30px; --ty: -50px;" />
                    <circle cx="300" cy="445" r="5" fill="#bae6fd" class="particle" style="--tx: -20px; --ty: -70px;" />
                    <circle cx="300" cy="445" r="3" fill="#bae6fd" class="particle" style="--tx: 40px; --ty: -40px;" />
                </g>
            </g>

            <!-- LID (Folded Up against Tank) -->
            <!-- Drawn last to overlap tank and bowl connection -->
            <g id="lid-up">
                <!-- Lid Shape (Side view - thin profile) -->
                <path d="M290,440 L310,440 L310,320 L290,320 Z" fill="#e2e8f0" /> 
                <!-- Top edge of lid -->
                <path d="M290,320 L310,320" stroke="#ffffff" stroke-width="2" />
            </g>

            <!-- FLUSH HANDLE (Chrome, 3D) -->
            <!-- Positioned on the front right of the tank -->
            <g class="flush-trigger" id="flushBtn">
                <!-- Base Mount -->
                <circle cx="380" cy="410" r="8" fill="url(#chrome)" />
                <!-- Arm -->
                <path class="handle-arm" d="M380,410 L415,400" stroke="url(#chrome)" stroke-width="8" stroke-linecap="round" />
                <!-- Cap -->
                <circle cx="418" cy="399" r="6" fill="url(#chrome)" />
                <!-- Highlight on Cap -->
                <path d="M414,395 A 4 4 0 0 1 422,395" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.9" />
            </g>

        </svg>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const flushBtn = document.getElementById('flushBtn');
            const stage = document.querySelector('.stage');
            
            let isAnimating = false;

            const performFlush = () => {
                if (isAnimating) return;
                isAnimating = true;

                // 1. Start Flush (Vortex & Drop)
                stage.classList.add('flushing');
                
                // 2. Reset after water drops (approx 800ms)
                setTimeout(() => {
                    stage.classList.remove('flushing');
                    stage.classList.add('refilling');
                    
                    // 3. Reset state after refill (approx 1500ms)
                    setTimeout(() => {
                        stage.classList.remove('refilling');
                        isAnimating = false;
                    }, 1500);
                }, 800);
            };

            // Interaction
            flushBtn.addEventListener('click', performFlush);

            // Auto-demo for visual impact
            setTimeout(performFlush, 1000);
        });
    </script>
</body>
</html>
