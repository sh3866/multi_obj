<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Sanitary Ware Illustration</title>
<style>
    :root {
        --bg-wall: #f1f5f9;
        --tile-line: #e2e8f0;
        --floor-color: #e2e8f0;
        --floor-shadow: #cbd5e1;
        --chrome-light: #ffffff;
        --chrome-mid: #94a3b8;
        --chrome-dark: #64748b;
        --water-top: #38bdf8;
        --water-deep: #0284c7;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--bg-wall);
        height: 100vh;
        width: 100vw;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
        /* Tiled Wall Pattern */
        background-image: 
            linear-gradient(var(--tile-line) 1px, transparent 1px),
            linear-gradient(90deg, var(--tile-line) 1px, transparent 1px);
        background-size: 100px 100px;
        background-position: -1px -1px;
    }

    /* Floor Plane */
    .floor-surface {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 20%;
        background: linear-gradient(to bottom, var(--floor-color) 0%, #cbd5e1 100%);
        border-top: 1px solid #94a3b8;
        z-index: 0;
    }

    /* Stage Container */
    .stage {
        position: relative;
        width: 600px;
        height: 800px;
        z-index: 1;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        padding-bottom: 0;
    }

    svg.product-illustration {
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    /* Interactive Handle */
    .flush-trigger {
        cursor: pointer;
        transition: transform 0.1s ease;
        transform-origin: 360px 490px;
    }
    
    .flush-trigger:active {
        transform: rotate(-15deg);
    }
    
    /* Animations */
    @keyframes vortex-spin {
        0% { transform: scale(0.5) rotate(0deg); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: scale(1.8) rotate(360deg); opacity: 0; }
    }

    @keyframes water-drop {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        40% { transform: translateY(20px) scale(0.9); opacity: 0.8; }
        100% { transform: translateY(60px) scale(0.3); opacity: 0; }
    }

    @keyframes water-refill {
        0% { transform: translateY(60px) scale(0.3); opacity: 0; }
        100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes splash-particle {
        0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) scale(1.2); opacity: 0; }
    }

    .vortex-group {
        transform-origin: 300px 535px;
    }

    .water-surface {
        transform-origin: 300px 535px;
        transition: all 0.2s ease;
    }

    .flushing .vortex-group {
        animation: vortex-spin 0.8s linear infinite;
    }

    .flushing .water-surface {
        animation: water-drop 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .refilling .water-surface {
        animation: water-refill 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    .particle {
        opacity: 0;
    }

    .flushing .particle {
        animation: splash-particle 0.6s ease-out forwards;
    }
</style>
</head>
<body>

    <div class="floor-surface"></div>

    <div class="stage">
        <svg class="product-illustration" viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 1. Materials & Gradients -->
                
                <!-- Porcelain: Multi-stop for volume -->
                <linearGradient id="porcelain-body" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#cbd5e1" /> <!-- Deep shadow left -->
                    <stop offset="10%" stop-color="#ffffff" /> <!-- Sharp highlight edge -->
                    <stop offset="40%" stop-color="#f8fafc" /> <!-- Main body -->
                    <stop offset="85%" stop-color="#e2e8f0" /> <!-- Soft shadow right -->
                    <stop offset="100%" stop-color="#94a3b8" /> <!-- Deep shadow right -->
                </linearGradient>

                <!-- Porcelain Rim/Top: Lighter -->
                <linearGradient id="porcelain-rim" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="100%" stop-color="#e2e8f0" />
                </linearGradient>

                <!-- Chrome: Metallic reflection -->
                <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="30%" stop-color="#cbd5e1" />
                    <stop offset="50%" stop-color="#94a3b8" />
                    <stop offset="80%" stop-color="#f1f5f9" />
                    <stop offset="100%" stop-color="#64748b" />
                </linearGradient>

                <!-- Water: Cyan to Deep Blue -->
                <linearGradient id="water-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#7dd3fc" />
                    <stop offset="100%" stop-color="#0369a1" />
                </linearGradient>

                <!-- Floor Shadow Blur -->
                <filter id="blur-shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="12" />
                </filter>

                <!-- Inner Bowl Depth Shadow -->
                <filter id="inner-shadow">
                    <feOffset dx="0" dy="8"/>
                    <feGaussianBlur stdDeviation="8" result="offset-blur"/>
                    <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                    <feFlood flood-color="#0f172a" flood-opacity="0.6" result="color"/>
                    <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                    <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
                </filter>
            </defs>

            <!-- 2. Grounding & Shadows -->
            
            <!-- Floor Drop Shadow -->
            <ellipse cx="300" cy="755" rx="190" ry="30" fill="#94a3b8" opacity="0.5" filter="url(#blur-shadow)" />

            <!-- Plumbing Base (Floor Flange & Bolts) -->
            <g id="plumbing-base">
                <!-- Flange Body -->
                <ellipse cx="300" cy="745" rx="45" ry="12" fill="#475569" />
                <path d="M255,745 L345,745 L340,755 L260,755 Z" fill="#334155" />
                <!-- Bolts -->
                <circle cx="270" cy="748" r="3" fill="#94a3b8" />
                <circle cx="330" cy="748" r="3" fill="#94a3b8" />
            </g>
            
            <!-- 3. The Toilet Geometry -->
            
            <!-- TANK -->
            <g id="tank-group">
                <!-- Tank Body -->
                <path d="M210,350 L390,350 C400,350 410,360 410,370 L410,520 C410,530 400,540 390,540 L210,540 C200,540 190,530 190,520 L190,370 C190,360 200,350 210,350 Z" fill="url(#porcelain-body)" />
                
                <!-- Tank Lid (New Requirement) -->
                <path d="M195,350 L405,350 C410,350 415,355 415,360 L415,365 C415,370 405,375 395,375 L205,375 C195,375 185,370 185,365 L185,360 C185,355 190,350 195,350 Z" fill="url(#porcelain-rim)" />
                
                <!-- Tank Specular Highlight -->
                <path d="M215,375 L215,520 C215,525 220,530 225,530" stroke="#ffffff" stroke-width="5" fill="none" opacity="0.9" stroke-linecap="round" />
                <path d="M230,375 L230,510" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.5" />
            </g>

            <!-- BOWL -->
            <g id="bowl-group">
                <!-- Bowl Body (Back part visible behind seat) -->
                <path d="M190,540 L410,540 L410,600 C410,700 380,740 300,740 C220,740 190,700 190,600 Z" fill="url(#porcelain-body)" />
                
                <!-- Bowl Front Curve (The "Apron") -->
                <path d="M190,600 C190,700 220,740 300,740 C380,740 410,700 410,600 L410,540 L190,540 Z" fill="url(#porcelain-body)" />
                
                <!-- Bowl Rim/Edge -->
                <ellipse cx="300" cy="540" rx="110" ry="35" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" />
                
                <!-- Bowl Specular Highlight -->
                <path d="M210,620 C210,680 240,720 300,730" stroke="#ffffff" stroke-width="10" fill="none" opacity="0.4" stroke-linecap="round" filter="blur(2px)" />
            </g>

            <!-- SEAT & LID -->
            
            <!-- Lid (Folded Up against Tank) -->
            <g id="lid-up">
                <!-- Hinge connection -->
                <circle cx="300" cy="535" r="12" fill="#94a3b8" />
                <!-- Lid Shape (Side view) -->
                <path d="M295,530 L305,530 L305,360 L295,360 Z" fill="#e2e8f0" /> 
                <!-- Top edge of lid -->
                <path d="M190,350 L410,350 C410,360 390,370 300,370 C210,370 190,360 190,350 Z" fill="url(#porcelain-rim)" />
            </g>

            <!-- Seat (Down) -->
            <g id="seat-down">
                <!-- Seat Thickness (Front profile) -->
                <path d="M190,535 C190,560 250,580 300,580 C350,580 410,560 410,535 L410,545 C410,570 350,590 300,590 C250,590 190,570 190,545 Z" fill="#cbd5e1" />
                <!-- Seat Top Surface -->
                <path d="M190,535 C190,560 250,580 300,580 C350,580 410,560 410,535 C410,510 350,490 300,490 C250,490 190,510 190,535 Z" fill="#ffffff" />
                
                <!-- Seat Highlight -->
                <path d="M220,540 C220,555 260,570 300,570" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8" />
            </g>

            <!-- INNER BOWL & WATER -->
            <g id="bowl-interior">
                <!-- Dark interior depth -->
                <ellipse cx="300" cy="535" rx="95" ry="28" fill="#0f172a" filter="url(#inner-shadow)" />
                
                <!-- Water Surface -->
                <g class="water-surface" id="waterLayer">
                    <ellipse cx="300" cy="535" rx="90" ry="25" fill="url(#water-grad)" />
                    <!-- Water Reflection (Inner shadow effect) -->
                    <ellipse cx="300" cy="535" rx="80" ry="20" fill="none" stroke="#bae6fd" stroke-width="2" opacity="0.6" />
                </g>

                <!-- The Vortex (Hidden by default) -->
                <g class="vortex-group">
                    <path d="M300,535 Q320,515 300,525 Q280,515 300,535 Z" fill="#0284c7" />
                    <circle cx="300" cy="535" r="10" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10 5" />
                </g>

                <!-- Splash Particles (Hidden by default) -->
                <g id="particles">
                    <circle cx="300" cy="535" r="4" fill="#bae6fd" class="particle" style="--tx: -40px; --ty: -60px;" />
                    <circle cx="300" cy="535" r="3" fill="#bae6fd" class="particle" style="--tx: 30px; --ty: -50px;" />
                    <circle cx="300" cy="535" r="5" fill="#bae6fd" class="particle" style="--tx: -20px; --ty: -70px;" />
                    <circle cx="300" cy="535" r="3" fill="#bae6fd" class="particle" style="--tx: 40px; --ty: -40px;" />
                </g>
            </g>

            <!-- FLUSH HANDLE (Chrome, 3D) -->
            <!-- Positioned on the front right of the tank -->
            <g class="flush-trigger" id="flushBtn">
                <!-- Base -->
                <rect x="360" y="480" width="16" height="40" rx="4" fill="url(#chrome)" class="handle-base" />
                <!-- Arm -->
                <path d="M370,490 L410,480" stroke="url(#chrome)" stroke-width="12" stroke-linecap="round" />
                <!-- Cap -->
                <circle cx="415" cy="478" r="10" fill="url(#chrome)" class="handle-cap" />
                <!-- Highlight on Cap -->
                <path d="M410,473 A 6 6 0 0 1 420,473" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8" />
            </g>

        </svg>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const flushBtn = document.getElementById('flushBtn');
            const stage = document.querySelector('.stage');
            
            let isAnimating = false;

            const performFlush = () => {
                if (isAnimating) return;
                isAnimating = true;

                // 1. Start Flush (Vortex & Drop)
                stage.classList.add('flushing');
                
                // 2. Reset after water drops (approx 800ms)
                setTimeout(() => {
                    stage.classList.remove('flushing');
                    stage.classList.add('refilling');
                    
                    // 3. Reset state after refill (approx 1500ms)
                    setTimeout(() => {
                        stage.classList.remove('refilling');
                        isAnimating = false;
                    }, 1500);
                }, 800);
            };

            // Interaction
            flushBtn.addEventListener('click', performFlush);

            // Auto-demo for visual impact
            setTimeout(performFlush, 1000);
        });
    </script>
</body>
</html>
