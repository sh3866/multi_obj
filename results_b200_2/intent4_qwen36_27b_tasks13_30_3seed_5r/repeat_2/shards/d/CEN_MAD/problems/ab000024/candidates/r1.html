<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Series 5 | The Modern Flush</title>
<style>
    :root {
        --bg-color: #EAE8E3;
        --text-main: #1A1A1A;
        --text-muted: #555555;
        --accent: #111111;
        --water-blue: #38BDF8;
        --water-deep: #0284C7;
        --chrome-light: #F8FAFC;
        --chrome-dark: #94A3B8;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
    }

    /* Layout Grid */
    .container {
        display: grid;
        grid-template-columns: 1fr 1.4fr;
        height: 100%;
        width: 100%;
        position: relative;
    }

    /* Left Side: Content */
    .content-side {
        padding: 6rem 4rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        z-index: 10;
        background: var(--bg-color);
    }

    /* Typography */
    .brand {
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 2rem;
    }

    h1 {
        font-size: 4rem;
        font-weight: 500; /* Medium weight for elegance */
        letter-spacing: -0.03em;
        line-height: 1.1;
        margin-bottom: 1.5rem;
        color: var(--text-main);
    }

    h1 span {
        display: block;
        font-weight: 300;
        color: var(--text-muted);
    }

    .description {
        font-size: 1.05rem;
        line-height: 1.7;
        color: var(--text-muted);
        max-width: 420px;
        margin-bottom: 4rem;
    }

    /* Ghost Button CTA */
    .cta-btn {
        align-self: flex-start;
        background: transparent;
        color: var(--text-main);
        border: 1px solid rgba(0,0,0,0.2);
        padding: 0.8rem 2rem;
        font-size: 0.9rem;
        font-weight: 500;
        letter-spacing: 0.05em;
        cursor: pointer;
        transition: all 0.3s ease;
        width: fit-content;
        border-radius: 4px;
    }

    .cta-btn:hover {
        border-color: var(--text-main);
        background: rgba(0,0,0,0.03);
    }

    /* Right Side: Visuals */
    .visual-side {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Refined Background: Subtle architectural wall niche feel */
        background: radial-gradient(circle at 60% 40%, #F5F5F0 0%, #EAE8E3 70%);
        overflow: hidden;
    }

    /* Architectural Framing (Subtle Niche) */
    .wall-niche {
        position: absolute;
        top: 10%;
        bottom: 10%;
        right: 15%;
        width: 70%;
        border-radius: 200px;
        background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%);
        box-shadow: inset 10px 0 30px rgba(0,0,0,0.02);
        z-index: 1;
    }

    /* SVG Container */
    .product-stage {
        width: 100%;
        height: 90%;
        position: relative;
        z-index: 2;
        /* Subtle drop shadow for the whole object */
        filter: drop-shadow(0px 20px 30px rgba(0,0,0,0.08));
    }

    /* SVG Internal Styles */
    .floor-shadow {
        fill: #000;
        opacity: 0.15;
        filter: blur(12px);
    }

    /* Animations */
    @keyframes vortex-spin {
        0% { transform: scale(0.8) rotate(0deg); opacity: 0.6; }
        50% { transform: scale(1.1) rotate(180deg); opacity: 0.9; }
        100% { transform: scale(0.8) rotate(360deg); opacity: 0.6; }
    }

    @keyframes water-level-drop {
        0% { transform: scale(1) translateY(0); }
        20% { transform: scale(0.95) translateY(5px); }
        100% { transform: scale(0.6) translateY(25px); opacity: 0.5; }
    }

    @keyframes water-refill {
        0% { transform: scale(0.6) translateY(25px); opacity: 0.5; }
        100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .vortex-active {
        animation: vortex-spin 0.6s linear infinite;
        transform-origin: center;
    }

    .water-dropping {
        animation: water-level-drop 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        transform-origin: center;
    }

    .water-refilling {
        animation: water-refill 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        transform-origin: center;
    }

    .particle {
        opacity: 0;
        transition: all 0.5s ease;
    }

    .particle.active {
        opacity: 1;
        transform: translateY(-30px) scale(1.5);
    }

    /* Responsive */
    @media (max-width: 900px) {
        .container { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
        .content-side { padding: 2rem; height: 40vh; }
        .visual-side { height: 60vh; }
        h1 { font-size: 2.5rem; }
        .wall-niche { right: 25%; width: 50%; }
    }
</style>
</head>
<body>

<div class="container">
    <div class="content-side">
        <div class="brand">Aura Collection</div>
        <h1>Series 5<span>Sanitary Ware.</span></h1>
        <div class="description">
            Engineered for silence. Sculpted for serenity. 
            The Series 5 combines hydro-dynamic efficiency 
            with a timeless, high-gloss ceramic aesthetic.
        </div>
        <button class="cta-btn">View Specifications</button>
    </div>

    <div class="visual-side">
        <div class="wall-niche"></div>

        <svg class="product-stage" viewBox="0 0 600 700" preserveAspectRatio="xMidYMax meet">
            <defs>
                <!-- 1. Material Realism: Multi-stop Radial Gradients for Porcelain -->
                <radialGradient id="grad-ceramic-tank" cx="30%" cy="30%" r="80%" fx="20%" fy="20%">
                    <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                    <stop offset="30%" style="stop-color:#F8FAFC;stop-opacity:1" />
                    <stop offset="75%" style="stop-color:#E2E8F0;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#CBD5E1;stop-opacity:1" />
                </radialGradient>

                <radialGradient id="grad-ceramic-bowl" cx="40%" cy="40%" r="90%" fx="30%" fy="30%">
                    <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                    <stop offset="40%" style="stop-color:#F1F5F9;stop-opacity:1" />
                    <stop offset="80%" style="stop-color:#94A3B8;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#64748B;stop-opacity:1" />
                </radialGradient>

                <!-- Chrome / Metal -->
                <linearGradient id="grad-chrome" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#94A3B8;stop-opacity:1" />
                    <stop offset="25%" style="stop-color:#F8FAFC;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#CBD5E1;stop-opacity:1" />
                    <stop offset="75%" style="stop-color:#F8FAFC;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#64748B;stop-opacity:1" />
                </linearGradient>

                <!-- Water Gradient -->
                <radialGradient id="grad-water" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#BAE6FD;stop-opacity:0.9" />
                    <stop offset="70%" style="stop-color:#0EA5E9;stop-opacity:0.9" />
                    <stop offset="100%" style="stop-color:#0284C7;stop-opacity:1" />
                </radialGradient>

                <!-- Vortex Gradient -->
                <radialGradient id="vortex-grad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#0284C7;stop-opacity:0.8" />
                    <stop offset="60%" style="stop-color:#38BDF8;stop-opacity:0.4" />
                    <stop offset="100%" style="stop-color:#E0F2FE;stop-opacity:0" />
                </radialGradient>

                <!-- Occlusion Shadow Gradient -->
                <radialGradient id="grad-shadow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#000000;stop-opacity:0.4" />
                    <stop offset="60%" style="stop-color:#000000;stop-opacity:0.1" />
                    <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
                </radialGradient>
            </defs>

            <!-- 2. Grounding: Directional Drop Shadow (Occlusion) -->
            <ellipse cx="300" cy="620" rx="220" ry="35" fill="url(#grad-shadow)" />
            <!-- Solid Base Connection -->
            <path d="M260,615 L340,615 C340,625 300,630 300,630 C300,630 260,625 260,615 Z" fill="#1A1A1A" opacity="0.8" />

            <!-- TANK -->
            <g id="tank">
                <!-- Tank Body -->
                <path d="M200,250 L400,250 C415,250 420,260 420,275 L420,420 C420,435 410,440 395,440 L205,440 C190,440 180,435 180,420 L180,275 C180,260 185,250 200,250 Z" fill="url(#grad-ceramic-tank)" />
                
                <!-- Tank Lid -->
                <path d="M185,250 L415,250 C420,250 425,255 425,260 L425,265 C425,270 415,275 405,275 L195,275 C185,275 175,270 175,265 L175,260 C175,255 180,250 185,250 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
                
                <!-- Tank Highlights (Glossy Reflection) -->
                <path d="M190,270 L190,420 C190,430 195,435 205,435" stroke="white" stroke-width="8" fill="none" opacity="0.6" stroke-linecap="round" filter="blur(2px)" />
                <path d="M200,270 L200,420 C200,430 205,435 210,435" stroke="white" stroke-width="3" fill="none" opacity="0.9" stroke-linecap="round" />

                <!-- Flush Button Plate (Chrome) -->
                <rect x="270" y="245" width="60" height="8" rx="4" fill="url(#grad-chrome)" />
                <!-- Flush Button -->
                <circle cx="300" cy="240" r="14" fill="url(#grad-chrome)" />
                <circle cx="300" cy="239" r="12" fill="#F8FAFC" /> <!-- Top face -->
            </g>

            <!-- BOWL (Inner & Water) -->
            <g id="bowl-inner">
                <!-- Water Surface -->
                <ellipse cx="300" cy="410" rx="125" ry="45" fill="url(#grad-water)" id="waterSurface" />
                
                <!-- The Vortex (Visual Cue for Flush) -->
                <ellipse cx="300" cy="410" rx="110" ry="40" fill="url(#vortex-grad)" id="vortex" opacity="0" />
                
                <!-- Splash Particles -->
                <g id="splashGroup">
                    <circle cx="290" cy="400" r="4" fill="#E0F2FE" class="particle" />
                    <circle cx="310" cy="390" r="3" fill="#E0F2FE" class="particle" />
                    <circle cx="280" cy="420" r="2" fill="#E0F2FE" class="particle" />
                    <circle cx="320" cy="415" r="5" fill="#E0F2FE" class="particle" />
                </g>
            </g>

            <!-- BOWL (Outer Shell) -->
            <g id="bowl-outer">
                <!-- Main Bowl Shape -->
                <path d="M180,410 C180,530 220,560 300,560 C380,560 420,530 420,410 L420,350 C420,340 410,330 400,330 L200,330 C190,330 180,340 180,350 Z" fill="url(#grad-ceramic-bowl)" />
                
                <!-- 1. Material Realism: Rim Light (Separation) -->
                <path d="M420,410 C420,530 380,560 300,560" stroke="white" stroke-width="2" fill="none" opacity="0.5" />
                <path d="M180,410 C180,530 220,560 300,560" stroke="white" stroke-width="1" fill="none" opacity="0.3" />

                <!-- Front Highlight -->
                <path d="M220,480 C220,530 250,550 300,550" stroke="white" stroke-width="6" fill="none" opacity="0.4" stroke-linecap="round" filter="blur(1px)" />

                <!-- Rim (The Lip) -->
                <path d="M180,350 C180,370 250,390 300,390 C350,390 420,370 420,350 L410,340 C410,360 350,380 300,380 C250,380 190,360 190,340 Z" fill="url(#grad-ceramic-tank)" />
                
                <!-- Water Line Shadow (Depth cue) -->
                <path d="M190,380 C190,390 250,405 300,405 C350,405 410,390 410,380" stroke="#64748B" stroke-width="3" fill="none" opacity="0.3" filter="blur(2px)" />
            </g>

            <!-- SEAT & LID -->
            <g id="seat">
                <!-- Seat Thickness (Underside) -->
                <path d="M190,345 C190,365 250,385 300,385 C350,385 410,365 410,345 L405,335 C405,355 350,375 300,375 C250,375 195,355 195,335 Z" fill="#E2E8F0" />
                <!-- Seat Top Surface -->
                <path d="M195,335 C195,355 250,375 300,375 C350,375 405,355 405,335 C405,325 350,315 300,315 C250,315 195,325 195,335 Z" fill="#FFFFFF" />
                
                <!-- Seat Highlight -->
                <ellipse cx="300" cy="340" rx="60" ry="12" fill="white" opacity="0.5" filter="blur(2px)" />
            </g>

            <!-- Plumbing Base (Grounded connection) -->
            <g id="base">
                <rect x="270" y="555" width="60" height="15" rx="4" fill="#334155" />
                <rect x="298" y="555" width="4" height="15" fill="#1E293B" />
            </g>

        </svg>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Elements
        const flushBtn = document.querySelector('.cta-btn'); // Using the CTA to trigger for demo
        const waterSurface = document.getElementById('waterSurface');
        const vortex = document.getElementById('vortex');
        const splashGroup = document.getElementById('splashGroup');
        const particles = document.querySelectorAll('.particle');
        const flushButtonVisual = document.querySelector('#tank circle:last-child'); // The button top

        let isFlushing = false;

        // Trigger function
        const triggerFlush = () => {
            if (isFlushing) return;
            isFlushing = true;

            // 1. Button Press Visual
            if(flushButtonVisual) {
                flushButtonVisual.style.transform = "translateY(2px)";
                setTimeout(() => flushButtonVisual.style.transform = "translateY(0)", 150);
            }

            // 2. Vortex & Water Drop
            vortex.style.opacity = "1";
            vortex.classList.add('vortex-active');
            
            waterSurface.classList.remove('water-refilling');
            waterSurface.classList.add('water-dropping');

            // 3. Splash Particles
            particles.forEach((p, i) => {
                setTimeout(() => {
                    p.classList.add('active');
                }, i * 50);
            });

            // 4. Reset Sequence
            setTimeout(() => {
                // Stop splash
                particles.forEach(p => p.classList.remove('active'));

                // Stop Vortex
                vortex.classList.remove('vortex-active');
                vortex.style.opacity = "0";

                // Refill Water
                waterSurface.classList.remove('water-dropping');
                waterSurface.classList.add('water-refilling');

                setTimeout(() => {
                    isFlushing = false;
                }, 1500);

            }, 800);
        };

        // Bind event
        flushBtn.addEventListener('click', triggerFlush);

        // Auto-demo on load for visual impact
        setTimeout(triggerFlush, 1500);
    });
</script>
</body>
</html>
