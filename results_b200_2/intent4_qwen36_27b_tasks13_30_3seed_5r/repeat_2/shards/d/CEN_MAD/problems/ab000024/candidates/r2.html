<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Sanitary Ware Illustration</title>
<style>
    :root {
        --bg-dark: #0f172a;
        --bg-light: #1e293b;
        --tile-gap: #334155;
        --chrome: #e2e8f0;
        --water: #0ea5e9;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--bg-dark);
        height: 100vh;
        width: 100vw;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
    }

    /* 
      Context: Tiled Bathroom Wall 
      Using CSS patterns to create a slate tile effect without external images.
    */
    .bathroom-context {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: var(--bg-dark);
        background-image: 
            linear-gradient(var(--tile-gap) 2px, transparent 2px),
            linear-gradient(90deg, var(--tile-gap) 2px, transparent 2px),
            linear-gradient(var(--tile-gap) 2px, transparent 2px),
            linear-gradient(90deg, var(--tile-gap) 2px, transparent 2px);
        background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
        background-position: -2px -2px, -2px -2px, -1px -1px, -1px -1px;
        opacity: 0.15;
        z-index: 0;
    }

    .floor-surface {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 15%;
        background: linear-gradient(to bottom, #0f172a 0%, #020617 100%);
        z-index: 1;
    }

    /* Main Stage */
    .stage {
        position: relative;
        width: 600px;
        height: 800px;
        z-index: 2;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        padding-bottom: 50px;
    }

    /* The SVG Illustration */
    svg.product-illustration {
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    /* 
      Interactive Elements 
      The flush button is interactive.
    */
    .flush-trigger {
        cursor: pointer;
        transition: transform 0.1s ease;
    }
    
    .flush-trigger:active .handle-cap {
        transform: translateY(3px);
    }
    
    .flush-trigger:active .handle-base {
        fill: #94a3b8;
    }

    /* Animations */
    @keyframes vortex-spin {
        0% { transform: scale(0.5) rotate(0deg); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: scale(1.5) rotate(360deg); opacity: 0; }
    }

    @keyframes water-drop {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        40% { transform: translateY(20px) scale(0.9); opacity: 0.8; }
        100% { transform: translateY(60px) scale(0.3); opacity: 0; }
    }

    @keyframes water-refill {
        0% { transform: translateY(60px) scale(0.3); opacity: 0; }
        100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes splash-particle {
        0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) scale(1.2); opacity: 0; }
    }

    .vortex-group {
        transform-origin: 300px 530px;
    }

    .water-surface {
        transform-origin: 300px 530px;
        transition: all 0.2s ease;
    }

    .flushing .vortex-group {
        animation: vortex-spin 0.6s linear infinite;
    }

    .flushing .water-surface {
        animation: water-drop 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .refilling .water-surface {
        animation: water-refill 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    .particle {
        opacity: 0;
    }

    .flushing .particle {
        animation: splash-particle 0.6s ease-out forwards;
    }

</style>
</head>
<body>

    <!-- Context Background -->
    <div class="bathroom-context"></div>
    <div class="floor-surface"></div>

    <div class="stage">
        <svg class="product-illustration" viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 1. Materials & Gradients -->
                
                <!-- Porcelain: High gloss, sharp falloff -->
                <linearGradient id="porcelain-body" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#e2e8f0" /> <!-- Shadow side -->
                    <stop offset="15%" stop-color="#ffffff" /> <!-- Highlight edge -->
                    <stop offset="50%" stop-color="#f8fafc" /> <!-- Main body -->
                    <stop offset="90%" stop-color="#cbd5e1" /> <!-- Shadow side -->
                    <stop offset="100%" stop-color="#94a3b8" /> <!-- Deep shadow -->
                </linearGradient>

                <linearGradient id="porcelain-rim" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="50%" stop-color="#f1f5f9" />
                    <stop offset="100%" stop-color="#cbd5e1" />
                </linearGradient>

                <!-- Chrome: Metallic, reflective -->
                <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="40%" stop-color="#94a3b8" />
                    <stop offset="50%" stop-color="#f8fafc" />
                    <stop offset="80%" stop-color="#64748b" />
                    <stop offset="100%" stop-color="#ffffff" />
                </linearGradient>

                <!-- Water: Deep blue to cyan -->
                <linearGradient id="water-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#7dd3fc" />
                    <stop offset="100%" stop-color="#0284c7" />
                </linearGradient>

                <!-- Floor Shadow -->
                <filter id="blur-shadow">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="15" />
                </filter>

                <!-- Inner Bowl Shadow -->
                <filter id="inner-shadow">
                    <feOffset dx="0" dy="10"/>
                    <feGaussianBlur stdDeviation="10" result="offset-blur"/>
                    <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                    <feFlood flood-color="black" flood-opacity="0.4" result="color"/>
                    <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                    <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
                </filter>
            </defs>

            <!-- 2. Grounding & Shadows -->
            <!-- Floor Flange / Plumbing Base -->
            <g id="plumbing-base">
                <ellipse cx="300" cy="740" rx="40" ry="12" fill="#334155" />
                <path d="M260,740 L340,740 L330,755 L270,755 Z" fill="#1e293b" />
                <rect x="295" y="730" width="10" height="20" fill="#475569" />
            </g>
            
            <!-- Main Drop Shadow -->
            <ellipse cx="300" cy="745" rx="180" ry="25" fill="#000000" opacity="0.6" filter="url(#blur-shadow)" />

            <!-- 3. The Toilet Geometry -->
            
            <!-- TANK -->
            <g id="tank-group">
                <!-- Tank Body -->
                <path d="M210,350 L390,350 C400,350 410,360 410,370 L410,520 C410,530 400,540 390,540 L210,540 C200,540 190,530 190,520 L190,370 C190,360 200,350 210,350 Z" fill="url(#porcelain-body)" />
                
                <!-- Tank Lid -->
                <path d="M195,350 L405,350 C410,350 415,355 415,360 L415,365 C415,370 405,375 395,375 L205,375 C195,375 185,370 185,365 L185,360 C185,355 190,350 195,350 Z" fill="url(#porcelain-rim)" />
                
                <!-- Tank Specular Highlight (Sharp edge) -->
                <path d="M215,375 L215,520 C215,525 220,530 225,530" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.8" stroke-linecap="round" />
                <path d="M230,375 L230,510" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.4" />
            </g>

            <!-- BOWL -->
            <g id="bowl-group">
                <!-- Bowl Body (Back part visible behind seat) -->
                <path d="M190,540 L410,540 L410,600 C410,700 380,740 300,740 C220,740 190,700 190,600 Z" fill="url(#porcelain-body)" />
                
                <!-- Bowl Front Curve (The "Apron" or solid front) -->
                <path d="M190,600 C190,700 220,740 300,740 C380,740 410,700 410,600 L410,540 L190,540 Z" fill="url(#porcelain-body)" />
                
                <!-- Bowl Rim/Edge -->
                <ellipse cx="300" cy="540" rx="110" ry="35" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5" />
                
                <!-- Bowl Specular Highlight -->
                <path d="M210,620 C210,680 240,720 300,730" stroke="#ffffff" stroke-width="8" fill="none" opacity="0.3" stroke-linecap="round" filter="blur(2px)" />
            </g>

            <!-- SEAT & LID (Closed/Up logic: Let's show it slightly open or down? Brief says "clearly visible flush handle... bowl...". Usually lid is down in product shots, but to show water, lid must be up. Let's show Lid UP (folded back against tank) and Seat DOWN. -->
            
            <!-- Lid (Folded Up against Tank) -->
            <g id="lid-up">
                <!-- Hinge connection -->
                <circle cx="300" cy="535" r="12" fill="#94a3b8" />
                <!-- Lid Shape -->
                <path d="M295,530 L305,530 L305,360 L295,360 Z" fill="#e2e8f0" /> <!-- Side view of lid -->
                <path d="M190,350 L410,350 C410,360 390,370 300,370 C210,370 190,360 190,350 Z" fill="url(#porcelain-rim)" /> <!-- Top edge -->
            </g>

            <!-- Seat (Down) -->
            <g id="seat-down">
                <!-- Seat Thickness -->
                <path d="M190,535 C190,560 250,580 300,580 C350,580 410,560 410,535 L410,545 C410,570 350,590 300,590 C250,590 190,570 190,545 Z" fill="#cbd5e1" />
                <!-- Seat Top -->
                <path d="M190,535 C190,560 250,580 300,580 C350,580 410,560 410,535 C410,510 350,490 300,490 C250,490 190,510 190,535 Z" fill="#ffffff" />
                
                <!-- Seat Highlight -->
                <path d="M220,540 C220,555 260,570 300,570" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8" />
            </g>

            <!-- INNER BOWL & WATER -->
            <g id="bowl-interior">
                <!-- Dark interior depth -->
                <ellipse cx="300" cy="535" rx="95" ry="28" fill="#0f172a" filter="url(#inner-shadow)" />
                
                <!-- Water Surface -->
                <g class="water-surface" id="waterLayer">
                    <ellipse cx="300" cy="535" rx="90" ry="25" fill="url(#water-grad)" />
                    <!-- Water Reflection -->
                    <ellipse cx="300" cy="535" rx="80" ry="20" fill="none" stroke="#bae6fd" stroke-width="1" opacity="0.5" />
                </g>

                <!-- The Vortex (Hidden by default) -->
                <g class="vortex-group">
                    <path d="M300,535 Q320,515 300,525 Q280,515 300,535 Z" fill="#0284c7" />
                    <circle cx="300" cy="535" r="10" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10 5" />
                </g>

                <!-- Splash Particles (Hidden by default) -->
                <g id="particles">
                    <circle cx="300" cy="535" r="4" fill="#bae6fd" class="particle" style="--tx: -40px; --ty: -60px;" />
                    <circle cx="300" cy="535" r="3" fill="#bae6fd" class="particle" style="--tx: 30px; --ty: -50px;" />
                    <circle cx="300" cy="535" r="5" fill="#bae6fd" class="particle" style="--tx: -20px; --ty: -70px;" />
                    <circle cx="300" cy="535" r="3" fill="#bae6fd" class="particle" style="--tx: 40px; --ty: -40px;" />
                </g>
            </g>

            <!-- FLUSH HANDLE (Chrome, 3D) -->
            <!-- Positioned on the front right of the tank -->
            <g class="flush-trigger" id="flushBtn">
                <!-- Base -->
                <rect x="360" y="480" width="16" height="40" rx="4" fill="url(#chrome)" class="handle-base" />
                <!-- Arm -->
                <path d="M370,490 L410,480" stroke="url(#chrome)" stroke-width="12" stroke-linecap="round" />
                <!-- Cap -->
                <circle cx="415" cy="478" r="10" fill="url(#chrome)" class="handle-cap" />
                <!-- Highlight on Cap -->
                <path d="M410,473 A 6 6 0 0 1 420,473" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8" />
            </g>

        </svg>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const flushBtn = document.getElementById('flushBtn');
            const stage = document.querySelector('.stage');
            const waterLayer = document.getElementById('waterLayer');
            
            let isAnimating = false;

            const performFlush = () => {
                if (isAnimating) return;
                isAnimating = true;

                // 1. Start Flush (Vortex & Drop)
                stage.classList.add('flushing');
                
                // 2. Reset after water drops (approx 800ms)
                setTimeout(() => {
                    stage.classList.remove('flushing');
                    stage.classList.add('refilling');
                    
                    // 3. Reset state after refill (approx 1500ms)
                    setTimeout(() => {
                        stage.classList.remove('refilling');
                        isAnimating = false;
                    }, 1500);
                }, 800);
            };

            // Interaction
            flushBtn.addEventListener('click', performFlush);

            // Auto-demo for visual impact
            setTimeout(performFlush, 1000);
        });
    </script>
</body>
</html>
