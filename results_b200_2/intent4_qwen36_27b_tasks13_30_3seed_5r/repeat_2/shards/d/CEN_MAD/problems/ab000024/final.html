<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Ceramic Toilet Illustration</title>
<style>
    :root {
        --bg-wall-top: #f1f5f9;
        --bg-wall-bot: #e2e8f0;
        --bg-floor: #cbd5e1;
        --bg-floor-dark: #94a3b8;
        --water-deep: #0ea5e9;
        --water-light: #e0f2fe;
        --chrome-light: #ffffff;
        --chrome-mid: #94a3b8;
        --chrome-dark: #475569;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background: linear-gradient(to bottom, var(--bg-wall-top) 0%, var(--bg-wall-bot) 65%, var(--bg-floor) 65%, var(--bg-floor-dark) 100%);
        height: 100vh;
        width: 100vw;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
    }

    .stage {
        position: relative;
        width: 100%;
        max-width: 900px;
        height: 700px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Floor Grid Pattern */
    .floor-grid {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 35%;
        background-image: 
            linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
        background-size: 40px 40px;
        transform: perspective(600px) rotateX(45deg);
        transform-origin: bottom;
        pointer-events: none;
        z-index: 0;
        mask-image: linear-gradient(to bottom, transparent, black);
        -webkit-mask-image: linear-gradient(to bottom, transparent, black);
    }

    svg.product-illustration {
        width: 100%;
        height: 100%;
        overflow: visible;
        z-index: 1;
        filter: drop-shadow(0px 15px 25px rgba(0,0,0,0.15));
    }

    /* Interactive Handle */
    .flush-trigger {
        cursor: pointer;
        transition: transform 0.1s ease;
        transform-origin: 440px 260px; /* Pivot point */
    }
    
    .flush-trigger:hover .handle-arm {
        stroke: #cbd5e1; 
    }
    
    .flush-trigger:active {
        transform: rotate(-20deg);
    }
    
    /* Animations */
    @keyframes vortex-spin {
        0% { transform: scale(0.5) rotate(0deg); opacity: 0; }
        20% { opacity: 1; transform: scale(1) rotate(45deg); }
        100% { transform: scale(1.8) rotate(720deg); opacity: 0; }
    }

    @keyframes water-drop {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(30px) scale(0.2); opacity: 0; }
    }

    @keyframes water-refill {
        0% { transform: translateY(30px) scale(0.2); opacity: 0; }
        100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes splash-particle {
        0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) scale(1.5); opacity: 0; }
    }

    .vortex-group {
        transform-origin: 400px 440px;
    }

    .water-surface {
        transform-origin: 400px 440px;
        transition: all 0.2s ease;
    }

    .flushing .vortex-group {
        animation: vortex-spin 0.8s linear infinite;
    }

    .flushing .water-surface {
        animation: water-drop 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .refilling .water-surface {
        animation: water-refill 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    .particle {
        opacity: 0;
    }

    .flushing .particle {
        animation: splash-particle 0.7s ease-out forwards;
    }
</style>
</head>
<body>

    <div class="stage">
        <div class="floor-grid"></div>
        
        <svg class="product-illustration" viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 1. Materials & Gradients -->
                
                <!-- Porcelain Body: Complex multi-stop linear gradient for cylindrical volume -->
                <linearGradient id="porcelain-body" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#cbd5e1" /> <!-- Deep shadow edge -->
                    <stop offset="15%" stop-color="#ffffff" /> <!-- Mid highlight -->
                    <stop offset="40%" stop-color="#ffffff" /> <!-- Flat white -->
                    <stop offset="85%" stop-color="#e2e8f0" /> <!-- Soft shadow -->
                    <stop offset="100%" stop-color="#94a3b8" /> <!-- Deep shadow edge -->
                </linearGradient>

                <!-- Porcelain Rim/Lid: Lighter -->
                <linearGradient id="porcelain-rim" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="100%" stop-color="#e2e8f0" />
                </linearGradient>

                <!-- Chrome: Metallic reflection -->
                <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="30%" stop-color="#cbd5e1" />
                    <stop offset="50%" stop-color="#94a3b8" />
                    <stop offset="90%" stop-color="#f8fafc" />
                    <stop offset="100%" stop-color="#475569" />
                </linearGradient>

                <!-- Water: Translucent Cyan -->
                <radialGradient id="water-grad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.9" />
                    <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.8" />
                    <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
                </radialGradient>

                <!-- Floor Shadow Blur -->
                <filter id="blur-shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="20" />
                </filter>

                <!-- Inner Bowl Depth Shadow -->
                <filter id="inner-shadow">
                    <feOffset dx="0" dy="10"/>
                    <feGaussianBlur stdDeviation="10" result="offset-blur"/>
                    <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                    <feFlood flood-color="#0f172a" flood-opacity="0.9" result="color"/>
                    <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                    <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
                </filter>

                <!-- Specular Highlight Gradient -->
                <linearGradient id="specular" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                </linearGradient>
            </defs>

            <!-- 2. Grounding & Shadows -->
            
            <!-- Diffuse Cast Shadow (Right side) -->
            <ellipse cx="440" cy="660" rx="180" ry="30" fill="#64748b" opacity="0.3" filter="url(#blur-shadow)" />
            
            <!-- Contact Shadow (Tight, under base) -->
            <ellipse cx="400" cy="660" rx="100" ry="15" fill="#334155" opacity="0.6" filter="url(#blur-shadow)" />

            <!-- Plumbing Base (Floor Flange) -->
            <g id="plumbing-base">
                <!-- Flange Base -->
                <ellipse cx="400" cy="660" rx="50" ry="12" fill="#475569" />
                <ellipse cx="400" cy="660" rx="45" ry="10" fill="#334155" />
                <!-- Bolts -->
                <circle cx="370" cy="660" r="3" fill="#94a3b8" />
                <circle cx="430" cy="660" r="3" fill="#94a3b8" />
            </g>
            
            <!-- 3. The Toilet Geometry -->
            
            <!-- TANK (Connected, Rounded) -->
            <g id="tank-group">
                <!-- Tank Body: Cohesive rounded rectangle -->
                <path d="M280,200 L520,200 C540,200 550,210 550,230 L550,380 C550,400 540,410 520,410 L280,410 C260,410 250,400 250,380 L250,230 C250,210 260,200 280,200 Z" fill="url(#porcelain-body)" />
                
                <!-- Tank Lid (Thick, floating slightly) -->
                <path d="M255,195 L545,195 C550,195 555,200 555,205 L555,215 C555,220 550,225 545,225 L255,225 C250,225 245,220 245,215 L245,205 C245,200 250,195 255,195 Z" fill="url(#porcelain-rim)" />
                
                <!-- Tank Specular Highlight (Left Edge) -->
                <path d="M265,225 L265,380 C265,390 275,395 285,395" stroke="url(#specular)" stroke-width="6" fill="none" stroke-linecap="round" />
                
                <!-- Tank Front Face Shadow (Subtle depth) -->
                <rect x="250" y="380" width="300" height="30" fill="url(#porcelain-body)" opacity="0.1" />
            </g>

            <!-- BOWL & PEDESTAL (Unified Sculptural Base) -->
            <g id="bowl-group">
                <!-- Main Body: Connects tank to floor seamlessly -->
                <path d="M250,380 
                         L550,380 
                         C550,450 530,500 500,540 
                         C470,580 450,640 400,650 
                         C350,640 330,580 300,540 
                         C270,500 250,450 250,380 Z" 
                      fill="url(#porcelain-body)" />
                
                <!-- Bowl Specular Highlight (Left Curve) -->
                <path d="M260,400 C260,450 280,520 320,580" stroke="url(#specular)" stroke-width="12" fill="none" stroke-linecap="round" filter="blur(2px)" />
                
                <!-- Bowl Specular Highlight (Right Curve - fainter) -->
                <path d="M540,400 C540,450 520,500 490,540" stroke="url(#specular)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6" />
            </g>

            <!-- SEAT (Down) -->
            <g id="seat-down">
                <!-- Seat Thickness (Side profile) -->
                <path d="M230,380 C230,400 290,420 400,420 C510,420 570,400 570,380 L570,390 C570,410 510,430 400,430 C290,430 230,410 230,390 Z" fill="#cbd5e1" />
                <!-- Seat Top Surface -->
                <path d="M230,380 C230,400 290,420 400,420 C510,420 570,400 570,380 C570,350 510,330 400,330 C290,330 230,350 230,380 Z" fill="#ffffff" />
                
                <!-- Seat Highlight -->
                <path d="M260,385 C260,400 300,415 400,415" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.8" />
            </g>

            <!-- INNER BOWL & WATER -->
            <g id="bowl-interior">
                <!-- Dark interior depth -->
                <ellipse cx="400" cy="380" rx="160" ry="40" fill="#0f172a" filter="url(#inner-shadow)" />
                
                <!-- Water Surface -->
                <g class="water-surface" id="waterLayer">
                    <ellipse cx="400" cy="380" rx="145" ry="32" fill="url(#water-grad)" />
                    <!-- Water Reflection (Inner shadow effect) -->
                    <ellipse cx="400" cy="380" rx="135" ry="28" fill="none" stroke="#e0f2fe" stroke-width="2" opacity="0.6" />
                </g>

                <!-- The Vortex (Hidden by default) -->
                <g class="vortex-group">
                    <path d="M400,380 Q430,350 400,330 Q370,350 400,380 Z" fill="#0284c7" />
                    <circle cx="400" cy="380" r="15" fill="none" stroke="#bae6fd" stroke-width="3" stroke-dasharray="15 5" />
                </g>

                <!-- Splash Particles (Hidden by default) -->
                <g id="particles">
                    <circle cx="400" cy="380" r="5" fill="#bae6fd" class="particle" style="--tx: -60px; --ty: -80px;" />
                    <circle cx="400" cy="380" r="4" fill="#bae6fd" class="particle" style="--tx: 50px; --ty: -70px;" />
                    <circle cx="400" cy="380" r="6" fill="#bae6fd" class="particle" style="--tx: -30px; --ty: -90px;" />
                    <circle cx="400" cy="380" r="4" fill="#bae6fd" class="particle" style="--tx: 70px; --ty: -60px;" />
                </g>
            </g>

            <!-- LID (Folded Up against Tank) -->
            <g id="lid-up">
                <!-- Lid Shape (Side view - thin profile) -->
                <path d="M390,380 L410,380 L410,220 L390,220 Z" fill="#e2e8f0" /> 
                <!-- Top edge of lid -->
                <path d="M390,220 L410,220" stroke="#ffffff" stroke-width="2" />
            </g>

            <!-- FLUSH HANDLE (Chrome, 3D, Sleek) -->
            <!-- Positioned on the front right of the tank -->
            <g class="flush-trigger" id="flushBtn">
                <!-- Base Mount -->
                <circle cx="440" cy="260" r="10" fill="url(#chrome)" stroke="#64748b" stroke-width="1"/>
                <!-- Arm -->
                <path class="handle-arm" d="M440,260 L490,250" stroke="url(#chrome)" stroke-width="10" stroke-linecap="round" />
                <!-- Cap -->
                <circle cx="494" cy="249" r="8" fill="url(#chrome)" />
                <!-- Highlight on Cap -->
                <path d="M490,245 A 4 4 0 0 1 498,245" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.9" />
            </g>

        </svg>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const flushBtn = document.getElementById('flushBtn');
            const stage = document.querySelector('.stage');
            
            let isAnimating = false;

            const performFlush = () => {
                if (isAnimating) return;
                isAnimating = true;

                // 1. Start Flush (Vortex & Drop)
                stage.classList.add('flushing');
                
                // 2. Reset after water drops (approx 800ms)
                setTimeout(() => {
                    stage.classList.remove('flushing');
                    stage.classList.add('refilling');
                    
                    // 3. Reset state after refill (approx 1500ms)
                    setTimeout(() => {
                        stage.classList.remove('refilling');
                        isAnimating = false;
                    }, 1500);
                }, 800);
            };

            // Interaction
            flushBtn.addEventListener('click', performFlush);

            // Auto-demo for visual impact
            setTimeout(performFlush, 1000);
        });
    </script>
</body>
</html>
