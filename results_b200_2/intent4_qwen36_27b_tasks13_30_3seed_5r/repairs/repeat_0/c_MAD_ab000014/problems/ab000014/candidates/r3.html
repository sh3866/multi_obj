<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMONO — Indigo & Vermilion</title>
    <style>
        :root {
            /* Palette: Washi Paper & Sumi Ink */
            --bg-paper: #F2F0E9;
            --ink-black: #1A1A1A;
            --ink-light: #666666;
            
            /* Kimono Colors (Deep Indigo) */
            --kimono-base: #0A192F;
            --kimono-shadow: #050D1A;
            --kimono-highlight: #112240;
            --kimono-accent: #233554;
            
            /* Obi Colors (Vermilion) */
            --obi-base: #C0392B;
            --obi-light: #E74C3C;
            --obi-dark: #8E281D;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-paper);
            color: var(--ink-black);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        /* Paper Texture Overlay */
        .texture {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.4;
            z-index: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Layout Container */
        .canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Main SVG */
        #kimono-svg {
            height: 90vh;
            width: auto;
            max-width: 90vw;
            /* Soft shadow for depth */
            filter: drop-shadow(0px 20px 30px rgba(0,0,0,0.15));
            transition: transform 0.1s ease-out; 
        }

        /* UI / Info Block (Left Aligned) */
        .info-block {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: 8vw;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: 240px;
            pointer-events: none; /* Let clicks pass through */
        }

        .label {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--ink-light);
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 2.5rem; /* Reduced scale per critique */
            font-weight: 300; 
            line-height: 1;
            letter-spacing: -0.02em;
            color: var(--kimono-base);
            margin-bottom: 1rem;
        }

        p.desc {
            font-size: 0.8rem;
            line-height: 1.5;
            color: var(--ink-light);
            font-weight: 400;
            border-left: 2px solid var(--obi-base);
            padding-left: 1rem;
        }

        /* Animation */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .floating {
            animation: float 6s ease-in-out infinite;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .info-block {
                position: relative;
                top: auto;
                left: auto;
                transform: none;
                width: 80%;
                text-align: center;
                align-items: center;
                margin-top: 1rem;
                margin-bottom: 2rem;
            }
            
            p.desc {
                border-left: none;
                border-bottom: 2px solid var(--obi-base);
                padding-left: 0;
                padding-bottom: 0.5rem;
            }
            
            .canvas-container {
                flex-direction: column;
            }

            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="texture"></div>

    <div class="canvas-container">
        
        <!-- UI Overlay: Left Aligned (Refined Typography) -->
        <div class="info-block">
            <div class="label">Masterpiece Series — No. 04</div>
            <h1>INDIGO<br>&<br>VERMILION</h1>
            <p class="desc">
                A digital reconstruction of the <strong>Kosode</strong>. 
                Featuring the <em>Tsuzure</em> collar overlap, 
                continuous <em>Sode</em> sleeves, and a <em>Seigaiha</em> wave motif.
            </p>
        </div>

        <!-- SVG KIMONO -->
        <svg id="kimono-svg" class="floating" viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Gradients for Depth -->
                <linearGradient id="body-grad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="var(--kimono-highlight)" />
                    <stop offset="20%" stop-color="var(--kimono-base)" />
                    <stop offset="100%" stop-color="var(--kimono-shadow)" />
                </linearGradient>

                <!-- Obi Gradients for 3D Volumetric Effect -->
                <linearGradient id="obi-wrap-grad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="var(--obi-light)" />
                    <stop offset="30%" stop-color="var(--obi-base)" />
                    <stop offset="100%" stop-color="var(--obi-dark)" />
                </linearGradient>

                <radialGradient id="obi-knot-grad" cx="50%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="var(--obi-light)" />
                    <stop offset="50%" stop-color="var(--obi-base)" />
                    <stop offset="100%" stop-color="var(--obi-dark)" />
                </radialGradient>

                <!-- Pattern: Seigaiha (Concentric Waves) -->
                <!-- Adjusted to flow continuously -->
                <pattern id="pattern-seigaiha" x="0" y="0" width="40" height="80" patternUnits="userSpaceOnUse">
                    <path d="M0,40 A20,20 0 0,1 40,40" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7" />
                    <path d="M0,55 A20,20 0 0,1 40,55" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7" />
                    <path d="M0,70 A20,20 0 0,1 40,70" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7" />
                    <!-- Fill between waves for contrast -->
                    <path d="M0,40 A20,20 0 0,1 40,40 L40,55 A20,20 0 0,0 0,55 Z" fill="var(--kimono-accent)" opacity="0.6" />
                    <path d="M0,70 A20,20 0 0,1 40,70 L40,85 A20,20 0 0,0 0,85 Z" fill="var(--kimono-accent)" opacity="0.6" />
                </pattern>

                <!-- 
                     UNIFIED CLIP PATH 
                     Merging sleeves, torso, and skirt into one contiguous shape 
                     to ensure pattern continuity and eliminate gaps.
                -->
                <clipPath id="kimono-silhouette">
                    <path d="
                        M 220,150 
                        L 180,150 
                        L 80,160 
                        L 80,500 
                        L 180,500 
                        L 180,880 
                        L 420,880 
                        L 420,500 
                        L 520,500 
                        L 520,160 
                        L 420,150 
                        Z" 
                    />
                </clipPath>
            </defs>

            <g id="garment-group">
                
                <!-- 1. MAIN BODY (Unified Silhouette with Pattern) -->
                <!-- This single path draws the sleeves, torso, and skirt. 
                     The pattern is applied via the clipPath. -->
                <g id="main-body">
                    <!-- Base Color Shape -->
                    <path d="
                        M 220,150 
                        L 180,150 
                        L 80,160 
                        L 80,500 
                        L 180,500 
                        L 180,880 
                        L 420,880 
                        L 420,500 
                        L 520,500 
                        L 520,160 
                        L 420,150 
                        Z" 
                        fill="url(#body-grad)" 
                    />
                    
                    <!-- Continuous Pattern Overlay masked to the silhouette -->
                    <rect x="0" y="0" width="600" height="900" 
                          fill="url(#pattern-seigaiha)" 
                          clip-path="url(#kimono-silhouette)" 
                    />

                    <!-- Structural Folds (Shadows) -->
                    <!-- Sleeve to Body transitions -->
                    <path d="M180,150 L180,880" stroke="var(--kimono-shadow)" stroke-width="3" opacity="0.4" />
                    <path d="M420,150 L420,880" stroke="var(--kimono-shadow)" stroke-width="3" opacity="0.4" />
                    <!-- Skirt Folds -->
                    <path d="M230,500 L230,880" stroke="var(--kimono-shadow)" stroke-width="2" opacity="0.2" />
                    <path d="M370,500 L370,880" stroke="var(--kimono-shadow)" stroke-width="2" opacity="0.2" />
                    <!-- Hem shadow -->
                    <path d="M180,870 L420,870" stroke="var(--kimono-shadow)" stroke-width="5" opacity="0.3" />
                </g>

                <!-- 2. COLLAR (Eri & Tsuzure) - Reconstructed for continuity -->
                <g id="collar-group">
                    <!-- Left Collar (Under) - White -->
                    <path d="M220,150 L280,210 L275,215 L215,155 Z" fill="#FFFFFF" />
                    
                    <!-- Right Collar (Over) - The V shape -->
                    <path d="M280,210 L380,150 L385,155 L285,215 Z" fill="#FFFFFF" />
                    
                    <!-- Tsuke-komi (The colored edge strip) -->
                    <!-- Left edge -->
                    <path d="M220,150 L280,210 L278,213 L218,153 Z" fill="var(--obi-base)" />
                    <!-- Right edge -->
                    <path d="M280,210 L380,150 L378,153 L278,213 Z" fill="var(--obi-base)" />

                    <!-- The Tsuzure (Hanging Edge) - Authentic Detail -->
                    <!-- Right side crosses OVER left side, hanging down the chest -->
                    <path d="M280,210 L290,220 L270,320 L260,310 Z" fill="var(--kimono-base)" />
                    <!-- Shadow on the Tsuzure to show it's a separate layer -->
                    <path d="M280,210 L290,220 L270,320 L260,310 Z" fill="var(--kimono-shadow)" opacity="0.6" />
                </g>

                <!-- 3. OBI (Sash) - Redrawn with Bezier Curves for Volume -->
                <g id="obi-group">
                    <!-- Main Wrap (Wide Band) -->
                    <!-- Using curves to simulate wrapping around the body -->
                    <path d="M135,550 C180,530 220,520 300,520 C380,520 420,530 465,550 L465,650 C420,630 380,620 300,620 C220,620 180,630 135,650 Z" 
                          fill="url(#obi-wrap-grad)" />
                    
                    <!-- Wrap Folds (Texture) -->
                    <path d="M140,560 Q300,540 460,560" stroke="rgba(0,0,0,0.15)" stroke-width="1" fill="none" />
                    <path d="M138,580 Q300,560 462,580" stroke="rgba(0,0,0,0.15)" stroke-width="1" fill="none" />
                    <path d="M136,600 Q300,580 464,600" stroke="rgba(0,0,0,0.15)" stroke-width="1" fill="none" />

                    <!-- OBI KNOT (Taiko Musubi - Drum Knot) -->
                    <!-- Centered at x=300, y=590 -->
                    <g transform="translate(300, 590)">
                        
                        <!-- OBI DOME (Tails hanging down - drawn first so they go behind the knot) -->
                        <path d="M-30,40 C-40,80 -30,120 -15,140 L15,140 C30,120 40,80 30,40 Z" fill="var(--obi-dark)" />
                        <!-- Dome Folds -->
                        <path d="M-15,40 L-15,135" stroke="rgba(0,0,0,0.3)" stroke-width="1" />
                        <path d="M0,40 L0,140" stroke="rgba(0,0,0,0.3)" stroke-width="1" />
                        <path d="M15,40 L15,135" stroke="rgba(0,0,0,0.3)" stroke-width="1" />

                        <!-- Main Knot Body (The Drum) -->
                        <!-- Using a rounded rect with radial gradient for volume -->
                        <rect x="-60" y="-40" width="120" height="80" rx="12" fill="url(#obi-knot-grad)" />
                        
                        <!-- Knot Folds/Texture lines -->
                        <path d="M-60,-20 L60,-20" stroke="rgba(0,0,0,0.1)" stroke-width="1" />
                        <path d="M-60,0 L60,0" stroke="rgba(0,0,0,0.1)" stroke-width="1" />
                        <path d="M-60,20 L60,20" stroke="rgba(0,0,0,0.1)" stroke-width="1" />
                        
                        <!-- Gold Accent on Knot (Obi-age peeking out) -->
                        <path d="M-50,-40 L50,-40" stroke="var(--kimono-accent)" stroke-width="4" stroke-linecap="round" />
                    </g>
                </g>
            </g>
        </svg>

    </div>

    <script>
        // Subtle Parallax on Mouse Move
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 150;
            const y = (window.innerHeight - e.pageY * 2) / 150;
            
            const svg = document.getElementById('kimono-svg');
            // Apply transform. Note: This overrides the CSS 'floating' animation 
            // momentarily, but provides a more interactive "showcase" feel.
            // We combine the parallax with the base position.
            svg.style.transform = `translate(${x}px, ${y}px)`;
        });

        // Reset transform when mouse leaves to resume float
        document.addEventListener('mouseleave', () => {
            const svg = document.getElementById('kimono-svg');
            svg.style.transform = `translate(0px, 0px)`;
        });
    </script>
</body>
</html>
