<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMONO — Furisode Nocturne</title>
    <style>
        :root {
            --bg-nocturne: #0B0F19; /* Deep midnight blue */
            --bg-vignette: #05070A;
            --text-primary: #EAEAEA;
            --text-secondary: #8F9BBA;
            --kimono-indigo: #1C3B5E;
            --kimono-dark: #0F2236;
            --obi-red: #8A1C1C;
            --obi-gold: #D4AF37;
            --font-serif: "Didot", "Bodoni Moda", "Times New Roman", serif;
            --font-sans: "Helvetica Neue", "Helvetica", "Arial", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-nocturne);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Vignette Effect for Atmosphere */
        .atmosphere {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            background: radial-gradient(circle at center, transparent 40%, var(--bg-vignette) 100%);
        }

        /* Layout */
        main {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 15% 70% 15%;
            position: relative;
            z-index: 5;
        }

        /* Typography Areas */
        .sidebar-left {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 4rem;
            padding-left: 2rem;
            border-left: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar-right {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        /* Typography Hierarchy */
        h1 {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            font-weight: 400;
            line-height: 1.1;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        .subtitle {
            font-family: var(--font-sans);
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.5rem;
            width: 80px;
        }

        .description {
            font-family: var(--font-sans);
            font-size: 0.8rem;
            line-height: 1.6;
            max-width: 220px;
            color: var(--text-secondary);
            font-weight: 300;
        }

        /* Vertical Text */
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-family: var(--font-serif);
            font-size: 1.4rem;
            letter-spacing: 0.6em;
            color: var(--text-secondary);
            opacity: 0.8;
            user-select: none;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.2); /* Subtle gold glow */
        }

        /* Center Stage */
        .center-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 2000px;
        }

        #kimono-container {
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 95vh;
            transition: transform 0.1s ease-out;
            will-change: transform;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            filter: drop-shadow(0px 40px 60px rgba(0,0,0,0.6));
        }

        /* Animation */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .floating {
            animation: float 10s ease-in-out infinite;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
                padding: 2rem;
            }
            .sidebar-left {
                align-items: center;
                text-align: center;
                border-left: none;
                padding-left: 0;
                padding-bottom: 1rem;
                order: 1;
            }
            .subtitle { margin: 0 auto 1rem auto; }
            .center-stage { order: 2; }
            .sidebar-right { order: 3; display: none; }
            h1 { font-size: 2rem; }
            #kimono-container { max-height: 60vh; }
        }
    </style>
</head>
<body>

    <div class="atmosphere"></div>

    <main>
        <!-- Left Sidebar -->
        <div class="sidebar-left">
            <div class="subtitle">Silk & Geometry</div>
            <h1>Furisode<br>Nocturne</h1>
            <p class="description">
                A study in draping and negative space. 
                <em>Sakura</em> (cherry blossom) motifs 
                scattered across midnight indigo silk.
            </p>
        </div>

        <!-- Center Visual -->
        <div class="center-stage">
            <div id="kimono-container" class="floating">
                <!-- viewBox adjusted for tall aspect ratio -->
                <svg viewBox="0 0 800 1100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Sakura Pattern -->
                        <pattern id="sakura-pattern" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
                            <!-- Petal Shape -->
                            <path id="petal" d="M0,0 C10,-10 20,-5 20,0 C20,5 10,10 0,0 C-10,10 -20,5 -20,0 C-20,-5 -10,-10 0,0 Z" />
                            
                            <!-- Small Blossom (Gold/Pink) -->
                            <g transform="translate(30, 30) scale(0.8)">
                                <use href="#petal" fill="#D4AF37" opacity="0.6" transform="rotate(0)" />
                                <use href="#petal" fill="#D4AF37" opacity="0.6" transform="rotate(72)" />
                                <use href="#petal" fill="#D4AF37" opacity="0.6" transform="rotate(144)" />
                                <use href="#petal" fill="#D4AF37" opacity="0.6" transform="rotate(216)" />
                                <use href="#petal" fill="#D4AF37" opacity="0.6" transform="rotate(288)" />
                                <circle cx="0" cy="0" r="3" fill="#FFF" opacity="0.8"/>
                            </g>
                            
                            <!-- Large Blossom (Pale Pink) -->
                            <g transform="translate(100, 90) scale(1.2)">
                                <use href="#petal" fill="#E8C3C3" opacity="0.4" transform="rotate(10)" />
                                <use href="#petal" fill="#E8C3C3" opacity="0.4" transform="rotate(82)" />
                                <use href="#petal" fill="#E8C3C3" opacity="0.4" transform="rotate(154)" />
                                <use href="#petal" fill="#E8C3C3" opacity="0.4" transform="rotate(226)" />
                                <use href="#petal" fill="#E8C3C3" opacity="0.4" transform="rotate(298)" />
                                <circle cx="0" cy="0" r="4" fill="#FFF" opacity="0.6"/>
                            </g>

                            <!-- Single Falling Petal -->
                            <path d="M60,60 Q70,55 75,65 Q65,70 60,60 Z" fill="#FFF" opacity="0.3"/>
                        </pattern>

                        <!-- Silk Sheen Gradients -->
                        <linearGradient id="fabric-body" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#0A1929" />
                            <stop offset="20%" stop-color="var(--kimono-indigo)" />
                            <stop offset="50%" stop-color="#264B7A" /> <!-- Highlight -->
                            <stop offset="80%" stop-color="var(--kimono-indigo)" />
                            <stop offset="100%" stop-color="#0A1929" />
                        </linearGradient>

                        <linearGradient id="fabric-sleeve" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#0A1929" />
                            <stop offset="50%" stop-color="var(--kimono-indigo)" />
                            <stop offset="100%" stop-color="#0A1929" />
                        </linearGradient>

                        <!-- Obi Gradients (Complex Volume) -->
                        <linearGradient id="obi-base-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#4A0E0E" />
                            <stop offset="50%" stop-color="var(--obi-red)" />
                            <stop offset="100%" stop-color="#4A0E0E" />
                        </linearGradient>

                        <linearGradient id="obi-knot-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#C23B3B" />
                            <stop offset="40%" stop-color="var(--obi-red)" />
                            <stop offset="100%" stop-color="#3A0A0A" />
                        </linearGradient>

                        <!-- Mask to fade pattern at edges -->
                        <radialGradient id="pattern-mask-grad" cx="50%" cy="50%" r="60%">
                            <stop offset="0%" stop-color="white" stop-opacity="0.9"/>
                            <stop offset="70%" stop-color="white" stop-opacity="0.4"/>
                            <stop offset="100%" stop-color="black" stop-opacity="0"/>
                        </radialGradient>
                        <mask id="pattern-mask">
                            <rect width="100%" height="100%" fill="url(#pattern-mask-grad)"/>
                        </mask>
                    </defs>

                    <g id="kimono-assembly" transform="translate(0, 50)">
                        
                        <!-- Main Body (Torso + Skirt) - Rectangular Cut -->
                        <path d="M280,150 
                                 L520,150 
                                 L560,1050 
                                 Q400,1080 240,1050 Z" 
                              fill="url(#fabric-body)" />

                        <!-- Pattern Overlay on Body -->
                        <rect x="0" y="0" width="800" height="1100" fill="url(#sakura-pattern)" mask="url(#pattern-mask)" />

                        <!-- Left Sleeve (Detached T-Shape) -->
                        <path d="M280,150 
                                 C230,150 180,150 130,200 
                                 L80,600 
                                 L200,600 
                                 C240,450 260,250 280,150 Z" 
                              fill="url(#fabric-sleeve)" />
                        
                        <!-- Right Sleeve (Detached T-Shape) -->
                        <path d="M520,150 
                                 C570,150 620,150 670,200 
                                 L720,600 
                                 L600,600 
                                 C560,450 540,250 520,150 Z" 
                              fill="url(#fabric-sleeve)" />

                        <!-- Pattern on Sleeves (Clipped) -->
                        <clipPath id="sleeves-clip">
                            <path d="M280,150 C230,150 180,150 130,200 L80,600 L200,600 C240,450 260,250 280,150 Z" />
                            <path d="M520,150 C570,150 620,150 670,200 L720,600 L600,600 C560,450 540,250 520,150 Z" />
                        </clipPath>
                        <rect x="0" y="0" width="800" height="1100" fill="url(#sakura-pattern)" clip-path="url(#sleeves-clip)" opacity="0.8"/>

                        <!-- Collar Structure (Eri) -->
                        <!-- White Under-collar (Nagajuban) - Right side -->
                        <path d="M390,160 
                                 Q500,180 540,1050 
                                 L525,1050 
                                 Q490,190 390,160 Z" 
                              fill="#F2EFE9" />
                        
                        <!-- White Under-collar (Nagajuban) - Left side -->
                        <path d="M410,160 
                                 Q300,180 260,1050 
                                 L275,1050 
                                 Q310,190 410,160 Z" 
                              fill="#F2EFE9" />

                        <!-- Main Outer Collar (Eri) - Left Over Right -->
                        <!-- Left Collar (Top Layer) -->
                        <path d="M400,150 
                                 Q280,180 250,1050 
                                 L265,1050 
                                 Q295,185 400,150 Z" 
                              fill="var(--kimono-dark)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
                        
                        <!-- Right Collar (Bottom Layer) -->
                        <path d="M400,150 
                                 Q520,180 550,1050 
                                 L535,1050 
                                 Q505,185 400,150 Z" 
                              fill="var(--kimono-dark)" />

                        <!-- Fabric Folds (Subtle) -->
                        <path d="M400,160 L400,500" stroke="#000" stroke-width="2" opacity="0.15" fill="none" />
                        <path d="M320,500 Q330,800 310,1050" stroke="#000" stroke-width="3" stroke-linecap="round" opacity="0.1" fill="none" />
                        <path d="M480,500 Q470,800 490,1050" stroke="#000" stroke-width="3" stroke-linecap="round" opacity="0.1" fill="none" />

                        <!-- Obi (Sash) Group -->
                        <g transform="translate(0, 550)">
                            
                            <!-- The Obi Wrap (Front) -->
                            <path d="M260,0 
                                     Q400,20 540,0 
                                     L545,70 
                                     Q400,90 255,70 Z" 
                                  fill="url(#obi-base-grad)" />
                            
                            <!-- Obi-ji (Central Motif) -->
                            <circle cx="400" cy="35" r="25" fill="none" stroke="var(--obi-gold)" stroke-width="1.5" opacity="0.8"/>
                            <path d="M380,35 L420,35 M400,15 L400,55" stroke="var(--obi-gold)" stroke-width="1" opacity="0.6"/>

                            <!-- The Taiko Knot (Back Volume) -->
                            <g transform="translate(400, 15)">
                                <!-- Back bulk (The drum) -->
                                <path d="M-70,-50 L70,-50 L80,40 L-80,40 Z" fill="url(#obi-knot-grad)" />
                                
                                <!-- Side loops (The 'wings') -->
                                <path d="M-70,-30 C-100,-30 -100,20 -70,20" fill="none" stroke="var(--obi-red)" stroke-width="18" stroke-linecap="round"/>
                                <path d="M70,-30 C100,-30 100,20 70,20" fill="none" stroke="var(--obi-red)" stroke-width="18" stroke-linecap="round"/>
                                
                                <!-- Obi-jime (Sash/Cord) - Top Line -->
                                <path d="M-75,-15 L75,-15" stroke="var(--obi-gold)" stroke-width="8" stroke-linecap="round"/>
                                <!-- Obi-jime (Sash/Cord) - Bottom Line -->
                                <path d="M-75,15 L75,15" stroke="var(--obi-gold)" stroke-width="8" stroke-linecap="round"/>
                                
                                <!-- Obi-age (Stiffener sticking out top) -->
                                <path d="M-60,-50 L60,-50 L50,-85 L-50,-85 Z" fill="#4A1515" />
                                <!-- Gold trim on Obi-age -->
                                <path d="M-50,-85 L50,-85 L45,-90 L-45,-90 Z" fill="var(--obi-gold)" />
                            </g>

                            <!-- Obi-dori (Trailing Ribbons) -->
                            <path d="M360,50 L350,280 L375,280 L380,50 Z" fill="var(--obi-gold)" />
                            <path d="M440,50 L450,280 L425,280 L420,50 Z" fill="var(--obi-gold)" />
                        </g>

                    </g>
                </svg>
            </div>
        </div>

        <!-- Right Sidebar: Vertical Typography -->
        <div class="sidebar-right">
            <div class="vertical-text">
                美意識
                <br>
                <span style="font-size: 0.6em; opacity: 0.6; font-family: var(--font-sans); letter-spacing: 0.1em;">AESTHETICS</span>
            </div>
        </div>
    </main>

    <script>
        // Subtle Parallax Effect
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 120; 
            const y = (window.innerHeight - e.pageY * 2) / 120;
            
            const container = document.getElementById('kimono-container');
            // Reduced rotation for elegance
            container.style.transform = `
                translate(${x}px, ${y}px) 
                rotateY(${x * 0.5}deg) 
                rotateX(${-y * 0.5}deg)
            `;
        });
    </script>
</body>
</html>
