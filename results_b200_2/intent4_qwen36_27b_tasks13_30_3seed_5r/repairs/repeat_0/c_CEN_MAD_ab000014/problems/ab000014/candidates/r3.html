<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMONO — Furisode Study</title>
    <style>
        :root {
            --bg-washi: #F2EFE9;
            --ink-black: #111111;
            --kimono-base: #1A3C40; /* Deep Cyan/Indigo mix */
            --kimono-dark: #0D2123;
            --kimono-light: #2E5C60;
            --obi-crimson: #8B2E2E;
            --obi-gold: #D4AF37;
            --font-serif: "Bodoni Moda", "Didot", "Times New Roman", serif;
            --font-sans: "Helvetica Neue", "Helvetica", "Arial", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-washi);
            color: var(--ink-black);
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Critique Point 6: Wabi-sabi Texture Overlay */
        .texture-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.4;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Layout */
        main {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 20% 60% 20%;
            position: relative;
            z-index: 1;
        }

        /* Typography Areas */
        .sidebar-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            text-align: right;
            padding-right: 4rem;
        }

        .sidebar-right {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-left: 2rem;
        }

        /* Critique Point 5: Typography Hierarchy */
        h1 {
            font-family: var(--font-serif);
            font-size: 2.5rem; /* Subordinate to visual */
            font-weight: 400;
            line-height: 1.1;
            letter-spacing: 0.05em;
            color: var(--kimono-dark);
            margin-bottom: 1rem;
        }

        .subtitle {
            font-family: var(--font-sans);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: #555;
            margin-bottom: 1rem;
            border-top: 1px solid rgba(0,0,0,0.2);
            padding-top: 0.5rem;
            width: 100px;
            margin-left: auto;
        }

        .description {
            font-family: var(--font-sans);
            font-size: 0.85rem;
            line-height: 1.5;
            max-width: 240px;
            color: #444;
            font-weight: 300;
        }

        /* Critique Point 5: Reduced vertical text opacity */
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-family: var(--font-serif);
            font-size: 1.2rem;
            letter-spacing: 0.5em;
            color: var(--kimono-base);
            opacity: 0.15; /* Significantly reduced */
            user-select: none;
        }

        /* Center Stage */
        .center-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1500px;
        }

        #kimono-container {
            width: 100%;
            height: 100%;
            max-width: 700px; /* Critique Point 5: Increased scale */
            max-height: 95vh;
            transition: transform 0.2s ease-out;
            will-change: transform;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            /* Critique Point 6: Unified Drop Shadow */
            filter: drop-shadow(0px 30px 40px rgba(13, 33, 35, 0.25));
        }

        /* Animation */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        .floating {
            animation: float 8s ease-in-out infinite;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
                padding: 2rem;
            }
            .sidebar-left {
                align-items: center;
                text-align: center;
                padding-right: 0;
                margin-bottom: 1rem;
            }
            .subtitle { margin: 0 auto 1rem auto; }
            .sidebar-right { display: none; }
            h1 { font-size: 2rem; }
            #kimono-container { max-height: 70vh; }
        }
    </style>
</head>
<body>

    <div class="texture-overlay"></div>

    <main>
        <!-- Left Sidebar -->
        <div class="sidebar-left">
            <div class="subtitle">Silk & Geometry</div>
            <h1>Furisode<br>Nocturne</h1>
            <p class="description">
                A study in draping and negative space. 
                <em>Sakura</em> (cherry blossom) motifs 
                scattered across indigo silk.
            </p>
        </div>

        <!-- Center Visual -->
        <div class="center-stage">
            <div id="kimono-container" class="floating">
                <!-- Critique Point 1: viewBox expanded to fit full garment -->
                <svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Critique Point 3: Organic Nature Pattern (Sakura) -->
                        <pattern id="sakura-pattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
                            <!-- Small Blossom -->
                            <g transform="translate(20, 20) scale(0.6)" fill="#4B7073" opacity="0.6">
                                <path d="M0,0 C10,-10 20,-5 20,0 C20,5 10,10 0,0 C-10,10 -20,5 -20,0 C-20,-5 -10,-10 0,0 Z" />
                                <circle cx="0" cy="0" r="3" fill="#F2EFE9" opacity="0.8"/>
                            </g>
                            <!-- Large Blossom -->
                            <g transform="translate(80, 80) scale(0.9)" fill="#4B7073" opacity="0.5">
                                <path d="M0,0 C15,-15 30,-8 30,0 C30,8 15,15 0,0 C-15,15 -30,8 -30,0 C-30,-8 -15,-15 0,0 Z" />
                                <circle cx="0" cy="0" r="4" fill="#F2EFE9" opacity="0.8"/>
                            </g>
                            <!-- Falling Petal -->
                            <path d="M60,30 Q70,25 75,35 Q65,40 60,30 Z" fill="#F2EFE9" opacity="0.3"/>
                        </pattern>

                        <!-- Gradients for Depth (Silk Drape) -->
                        <linearGradient id="fabric-body" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#0D2123" />
                            <stop offset="30%" stop-color="var(--kimono-base)" />
                            <stop offset="60%" stop-color="var(--kimono-light)" />
                            <stop offset="100%" stop-color="#0D2123" />
                        </linearGradient>

                        <linearGradient id="fabric-sleeve" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#0D2123" />
                            <stop offset="100%" stop-color="#2E5C60" />
                        </linearGradient>

                        <!-- Obi Gradients -->
                        <linearGradient id="obi-base-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#5E1C1C" />
                            <stop offset="20%" stop-color="var(--obi-crimson)" />
                            <stop offset="80%" stop-color="var(--obi-crimson)" />
                            <stop offset="100%" stop-color="#5E1C1C" />
                        </linearGradient>

                        <linearGradient id="obi-knot-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#A63B3B" />
                            <stop offset="50%" stop-color="var(--obi-crimson)" />
                            <stop offset="100%" stop-color="#4A1515" />
                        </linearGradient>

                        <!-- Mask for Pattern Depth -->
                        <radialGradient id="pattern-mask-grad" cx="50%" cy="50%" r="70%">
                            <stop offset="0%" stop-color="white" stop-opacity="0.8"/>
                            <stop offset="80%" stop-color="white" stop-opacity="0.2"/>
                            <stop offset="100%" stop-color="black" stop-opacity="0"/>
                        </radialGradient>
                        <mask id="pattern-mask">
                            <rect width="100%" height="100%" fill="url(#pattern-mask-grad)"/>
                        </mask>
                    </defs>

                    <g id="kimono-assembly">
                        
                        <!-- Critique Point 1: Unified Silhouette -->
                        <!-- Main Body (Torso + Skirt) -->
                        <path d="M250,180 
                                 Q400,200 550,180 
                                 L580,950 
                                 Q400,980 220,950 Z" 
                              fill="url(#fabric-body)" />

                        <!-- Critique Point 3: Pattern Overlay with Mask -->
                        <rect x="0" y="0" width="800" height="1000" fill="url(#sakura-pattern)" mask="url(#pattern-mask)" />

                        <!-- Left Sleeve (T-Shape / Furisode) -->
                        <path d="M250,180 
                                 C200,180 150,180 100,250 
                                 L60,550 
                                 L180,550 
                                 C220,350 240,250 250,180 Z" 
                              fill="url(#fabric-sleeve)" />
                        
                        <!-- Right Sleeve (T-Shape / Furisode) -->
                        <path d="M550,180 
                                 C600,180 650,180 700,250 
                                 L740,550 
                                 L620,550 
                                 C580,350 560,250 550,180 Z" 
                              fill="url(#fabric-sleeve)" />

                        <!-- Pattern on Sleeves (Clipped) -->
                        <clipPath id="sleeves-clip">
                            <path d="M250,180 C200,180 150,180 100,250 L60,550 L180,550 C220,350 240,250 250,180 Z" />
                            <path d="M550,180 C600,180 650,180 700,250 L740,550 L620,550 C580,350 560,250 550,180 Z" />
                        </clipPath>
                        <rect x="0" y="0" width="800" height="1000" fill="url(#sakura-pattern)" clip-path="url(#sleeves-clip)" opacity="0.6"/>

                        <!-- Critique Point 2: Collar & Layering -->
                        <!-- White Under-collar (Nagajuban) - Right side visible first -->
                        <path d="M395,185 
                                 Q500,200 540,950 
                                 L520,950 
                                 Q480,200 395,185 Z" 
                              fill="#F2EFE9" opacity="0.9"/>
                        
                        <!-- White Under-collar (Nagajuban) - Left side (Underneath) -->
                        <path d="M405,185 
                                 Q300,200 260,950 
                                 L280,950 
                                 Q320,200 405,185 Z" 
                              fill="#F2EFE9" opacity="0.9"/>

                        <!-- Main Outer Collar (Eri) - Left Over Right -->
                        <!-- Left Collar (Top Layer) -->
                        <path d="M400,180 
                                 Q280,210 250,950 
                                 L265,950 
                                 Q300,210 400,180 Z" 
                              fill="var(--kimono-base)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
                        
                        <!-- Right Collar (Bottom Layer) -->
                        <path d="M400,180 
                                 Q520,210 550,950 
                                 L535,950 
                                 Q500,210 400,180 Z" 
                              fill="var(--kimono-base)" />

                        <!-- Fabric Folds (Subtle lines) -->
                        <path d="M400,200 L400,600" stroke="#000" stroke-width="1" opacity="0.15" fill="none" />
                        <path d="M320,600 Q330,800 310,950" stroke="#000" stroke-width="2" stroke-linecap="round" opacity="0.1" fill="none" />
                        <path d="M480,600 Q470,800 490,950" stroke="#000" stroke-width="2" stroke-linecap="round" opacity="0.1" fill="none" />

                        <!-- Critique Point 4: Sculptural Obi (Taiko Musubi) -->
                        <g transform="translate(0, 480)">
                            
                            <!-- The Obi Wrap (Front) -->
                            <path d="M260,0 
                                     Q400,20 540,0 
                                     L545,60 
                                     Q400,80 255,60 Z" 
                                  fill="url(#obi-base-grad)" />
                            
                            <!-- Obi-ji (Central Motif on Obi) -->
                            <circle cx="400" cy="30" r="25" fill="none" stroke="var(--obi-gold)" stroke-width="2" opacity="0.8"/>
                            <circle cx="400" cy="30" r="20" fill="var(--obi-gold)" opacity="0.2"/>

                            <!-- The Taiko Knot (Back Volume) -->
                            <g transform="translate(400, 10)">
                                <!-- Back bulk -->
                                <path d="M-60,-40 L60,-40 L70,30 L-70,30 Z" fill="url(#obi-knot-grad)" />
                                <!-- Side loops (The 'wings') -->
                                <path d="M-60,-20 C-90,-20 -90,20 -60,20" fill="none" stroke="var(--obi-crimson)" stroke-width="15" stroke-linecap="round"/>
                                <path d="M60,-20 C90,-20 90,20 60,20" fill="none" stroke="var(--obi-crimson)" stroke-width="15" stroke-linecap="round"/>
                                
                                <!-- Obi-jime (Sash/Cord) -->
                                <path d="M-65,-10 L65,-10" stroke="var(--obi-gold)" stroke-width="6" stroke-linecap="round"/>
                                <path d="M-65,10 L65,10" stroke="var(--obi-gold)" stroke-width="6" stroke-linecap="round"/>
                                
                                <!-- Obi-age (Stiffener sticking out top) -->
                                <path d="M-50,-40 L50,-40 L40,-70 L-40,-70 Z" fill="#4A1515" />
                                <path d="M-40,-70 L40,-70 L35,-75 L-35,-75 Z" fill="var(--obi-gold)" />
                            </g>

                            <!-- Obi-dori (Trailing Ribbons) -->
                            <path d="M360,40 L350,250 L370,250 L375,40 Z" fill="var(--obi-gold)" />
                            <path d="M440,40 L450,250 L430,250 L425,40 Z" fill="var(--obi-gold)" />
                        </g>

                    </g>
                </svg>
            </div>
        </div>

        <!-- Right Sidebar: Vertical Typography -->
        <div class="sidebar-right">
            <div class="vertical-text">
                美意識 <br>
                <span style="font-size: 0.7em; opacity: 0.6;">Aesthetics</span>
            </div>
        </div>
    </main>

    <script>
        // Subtle Parallax Effect
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 100; 
            const y = (window.innerHeight - e.pageY * 2) / 100;
            
            const container = document.getElementById('kimono-container');
            // Reduced rotation for elegance
            container.style.transform = `
                translate(${x}px, ${y}px) 
                rotateY(${x * 0.2}deg) 
                rotateX(${-y * 0.2}deg)
            `;
        });
    </script>
</body>
</html>
