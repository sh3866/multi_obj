<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMONO — Asanoha Collection</title>
    <style>
        :root {
            /* Palette: 'Kuro' (Black) & 'Kin' (Gold) */
            --bg-color: #F2F0E9; /* Warm Rice Paper */
            --kimono-base: #181B20; /* Deep Charcoal/Ink */
            --kimono-shadow: #0A0C0F;
            --kimono-highlight: #2D343F;
            --obi-base: #D4AF37; /* Muted Gold */
            --obi-shadow: #8A6E18;
            --obi-highlight: #F2D06B;
            --pattern-color: #2C333D; /* Low contrast pattern */
            --pattern-stroke: #3A424D;
            --text-color: #181B20;
            --accent-color: #C0392B; /* Vermilion Seal */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            font-family: "Times New Roman", "Georgia", "Noto Serif JP", serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: var(--text-color);
            transition: background-color 0.8s ease;
        }

        /* Subtle Grain Texture */
        .texture {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.5;
            z-index: 5;
            mix-blend-mode: multiply;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Layout */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* Typography */
        .typography {
            position: absolute;
            top: 5vh;
            left: 5vw;
            z-index: 10;
            pointer-events: none;
            mix-blend-mode: difference;
            color: #fff; /* Difference blend makes it visible on both light/dark */
        }

        h1 {
            font-size: 6rem;
            font-weight: 100; /* High contrast thin serif */
            line-height: 0.8;
            letter-spacing: -0.02em;
            margin-bottom: 0.2rem;
            text-transform: uppercase;
        }

        .subtitle {
            font-family: "Helvetica Neue", "Arial", sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.9;
        }
        
        .subtitle::before {
            content: '';
            display: block;
            width: 30px;
            height: 1px;
            background: currentColor;
        }

        .controls {
            position: absolute;
            bottom: 4vh;
            right: 4vw;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            z-index: 10;
            text-align: right;
        }

        .label {
            font-family: "Helvetica Neue", sans-serif;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.6;
            margin-bottom: -0.5rem;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--text-color);
            padding: 0.6rem 1.5rem;
            font-family: "Helvetica Neue", sans-serif;
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-color);
            align-self: flex-end;
        }

        .btn:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        /* SVG Container */
        #kimono-svg {
            height: 90vh;
            width: auto;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.15));
            transition: transform 0.1s linear; /* Smooth JS movement */
            will-change: transform;
        }

        /* SVG Classes */
        .fabric-fill { fill: var(--kimono-base); transition: fill 0.6s ease; }
        .fabric-dark { fill: var(--kimono-shadow); transition: fill 0.6s ease; }
        .fabric-light { fill: var(--kimono-highlight); transition: fill 0.6s ease; }
        
        .pattern-fill { fill: var(--pattern-color); transition: fill 0.6s ease; }
        .pattern-stroke { stroke: var(--pattern-stroke); transition: stroke 0.6s ease; }

        .obi-fill { fill: var(--obi-base); transition: fill 0.6s ease; }
        .obi-dark { fill: var(--obi-shadow); transition: fill 0.6s ease; }
        .obi-light { fill: var(--obi-highlight); transition: fill 0.6s ease; }

    </style>
</head>
<body>

    <div class="texture"></div>

    <div class="typography">
        <h1>Kimono</h1>
        <span class="subtitle">Asanoha • Traditional Hemp Motif</span>
    </div>

    <main>
        <div class="stage">
            <!-- ViewBox adjusted to frame the T-shape perfectly -->
            <svg id="kimono-svg" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- 1. Main Fabric Gradient (Simulating drape & folds) -->
                    <linearGradient id="fabric-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="var(--kimono-shadow)" /> <!-- Left shadow -->
                        <stop offset="15%" stop-color="var(--kimono-base)" />
                        <stop offset="85%" stop-color="var(--kimono-base)" />
                        <stop offset="100%" stop-color="var(--kimono-shadow)" /> <!-- Right shadow -->
                    </linearGradient>
                    
                    <!-- 2. Collar Gradient (Depth at neck) -->
                    <linearGradient id="collar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="var(--kimono-shadow)" />
                        <stop offset="100%" stop-color="var(--kimono-base)" />
                    </linearGradient>

                    <!-- 3. Obi Gradient (Silk sheen) -->
                    <linearGradient id="obi-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="var(--obi-highlight)" />
                        <stop offset="50%" stop-color="var(--obi-base)" />
                        <stop offset="100%" stop-color="var(--obi-shadow)" />
                    </linearGradient>

                    <!-- 4. Knot Gradient (3D volume) -->
                    <radialGradient id="knot-grad" cx="50%" cy="30%" r="70%">
                        <stop offset="0%" stop-color="var(--obi-highlight)" />
                        <stop offset="60%" stop-color="var(--obi-base)" />
                        <stop offset="100%" stop-color="var(--obi-shadow)" />
                    </radialGradient>

                    <!-- 5. Asanoha (Hemp Leaf) Pattern -->
                    <!-- Authentic geometric construction: Hexagonal grid with inner diamonds -->
                    <pattern id="asanoha-pattern" x="0" y="0" width="60" height="103.923" patternUnits="userSpaceOnUse" patternTransform="scale(0.9)">
                        <!-- Background Hex Outline -->
                        <path d="M30,0 L60,17.32 L60,51.96 L30,69.28 L0,51.96 L0,17.32 Z" fill="none" stroke="var(--pattern-stroke)" stroke-width="1" opacity="0.4"/>
                        <!-- Inner Diamond (The "Leaf") -->
                        <path d="M30,12 L46,21 L46,42 L30,51 L14,42 L14,21 Z" fill="var(--pattern-color)" opacity="0.3" />
                        <!-- Connecting lines to center -->
                        <path d="M30,12 L30,51 M14,21 L46,42 M46,21 L14,42" stroke="var(--pattern-stroke)" stroke-width="0.5" opacity="0.3"/>
                        
                        <!-- Secondary Row Offset Logic handled by Pattern Tiling -->
                        <path d="M0,51.96 L30,69.28 L60,51.96" fill="none" stroke="var(--pattern-stroke)" stroke-width="1" opacity="0.4"/>
                    </pattern>
                </defs>

                <g id="kimono-structure">
                    
                    <!-- === BODY (T-SHAPED BASE) === -->
                    <!-- Flat rectangular body, slightly tapered at hem -->
                    <path class="fabric-fill" fill="url(#fabric-grad)" d="
                        M 320,160 
                        L 580,160 
                        L 600,880 
                        C 600,900 300,900 300,880 
                        Z" />
                    
                    <!-- Body Pattern Overlay -->
                    <path fill="url(#asanoha-pattern)" d="M 320,160 L 580,160 L 600,880 C 600,900 300,900 300,880 Z" opacity="0.8" />

                    <!-- === SLEEVES (T-SUZURE) === -->
                    <!-- Left Sleeve: Connected to body, rectangular, hanging -->
                    <path class="fabric-fill" fill="url(#fabric-grad)" d="
                        M 320,180 
                        L 180,180 
                        L 160,400 
                        C 155,420 170,430 190,420 
                        L 280,340 
                        Z" />
                    <path fill="url(#asanoha-pattern)" d="M 320,180 L 180,180 L 160,400 C 155,420 170,430 190,420 L 280,340 Z" opacity="0.8" />

                    <!-- Right Sleeve -->
                    <path class="fabric-fill" fill="url(#fabric-grad)" d="
                        M 580,180 
                        L 720,180 
                        L 740,400 
                        C 745,420 730,430 710,420 
                        L 620,340 
                        Z" />
                    <path fill="url(#asanoha-pattern)" d="M 580,180 L 720,180 L 740,400 C 745,420 730,430 710,420 L 620,340 Z" opacity="0.8" />

                    <!-- === COLLAR (ERI) === -->
                    <!-- The V-Neck construction: Left side overlaps Right side -->
                    
                    <!-- Right Collar (Underneath) -->
                    <path class="fabric-fill" fill="var(--kimono-shadow)" d="
                        M 450,160 
                        L 580,160 
                        L 580,240 
                        L 450,240 
                        Z" />

                    <!-- Left Collar (Overlapping - The defining V) -->
                    <!-- Starts at right shoulder, crosses center, goes to left shoulder -->
                    <path class="fabric-fill" fill="url(#collar-grad)" d="
                        M 580,160 
                        L 450,240 
                        L 320,160 
                        L 320,175 
                        L 450,255 
                        L 580,175 
                        Z" />

                    <!-- Collar Edge (Suri Komon style border) -->
                    <path stroke="#ffffff" stroke-width="1" opacity="0.15" fill="none" d="M 580,160 L 450,240 L 320,160" />

                    <!-- === FOLDS & DRAPING === -->
                    <!-- Vertical shadows to simulate gravity and fabric weight -->
                    <path fill="var(--kimono-shadow)" opacity="0.4" d="M 450,240 L 450,880 L 430,880 L 430,240 Z" /> <!-- Center Shadow -->
                    <path fill="var(--kimono-shadow)" opacity="0.2" d="M 320,160 L 320,880 L 340,880 L 340,160 Z" /> <!-- Left Side Shadow -->
                    <path fill="var(--kimono-shadow)" opacity="0.2" d="M 580,160 L 580,880 L 560,880 L 560,160 Z" /> <!-- Right Side Shadow -->

                    <!-- Sleeve Folds -->
                    <path stroke="var(--kimono-shadow)" stroke-width="2" opacity="0.3" fill="none" d="M 280,340 Q 240,360 200,380" />
                    <path stroke="var(--kimono-shadow)" stroke-width="2" opacity="0.3" fill="none" d="M 620,340 Q 660,360 700,380" />

                    <!-- === OBI (SASH) === -->
                    <!-- Positioned at waist, high contrast -->
                    <g id="obi-group" transform="translate(0, 550)">
                        
                        <!-- The Wrap (Front) -->
                        <path class="obi-fill" fill="url(#obi-grad)" d="
                            M 280,0 
                            C 350,30 550,30 620,0 
                            L 625,120 
                            C 550,150 350,150 275,120 
                            Z" />
                        
                        <!-- Obi Pattern (Subtle geometric on gold) -->
                        <path fill="url(#asanoha-pattern)" d="M 280,0 C 350,30 550,30 620,0 L 625,120 C 550,150 350,150 275,120 Z" opacity="0.3" style="mix-blend-mode: multiply;" />

                        <!-- === TAIKO MUSUBI (DRUM KNOT) === -->
                        <!-- Centered on the back, visible from front as a block -->
                        <g id="obi-knot">
                            <!-- Shadow behind knot -->
                            <ellipse cx="450" cy="60" rx="80" ry="85" fill="rgba(0,0,0,0.3)" filter="blur(8px)"/>

                            <!-- The Drum Body -->
                            <path class="obi-fill" fill="url(#knot-grad)" d="
                                M 360,0 
                                C 350,60 350,90 360,120 
                                L 540,120 
                                C 550,90 550,60 540,0 
                                C 500,-20 400,-20 360,0 Z" 
                                stroke="var(--obi-shadow)" stroke-width="1"/>

                            <!-- Folds on the Knot -->
                            <path stroke="var(--obi-shadow)" stroke-width="1.5" fill="none" opacity="0.6" d="M 360,20 Q 450,30 540,20" />
                            <path stroke="var(--obi-shadow)" stroke-width="1.5" fill="none" opacity="0.6" d="M 355,50 Q 450,60 545,50" />
                            <path stroke="var(--obi-shadow)" stroke-width="1.5" fill="none" opacity="0.6" d="M 360,80 Q 450,90 540,80" />
                            
                            <!-- Obi Age (Scarf peeking out) -->
                            <path fill="var(--kimono-base)" d="M 370,0 L 380,-15 L 420,-15 L 430,0 Z" />
                            <path fill="var(--kimono-base)" d="M 530,0 L 520,-15 L 480,-15 L 470,0 Z" />
                        </g>

                        <!-- Hanging Cords (Nodosashi) -->
                        <path fill="var(--obi-shadow)" d="M 420,120 L 420,190 L 425,190 L 425,120 Z" />
                        <path fill="var(--obi-shadow)" d="M 480,120 L 480,190 L 485,190 L 485,120 Z" />
                    </g>

                </g>
            </svg>
        </div>
    </main>

    <div class="controls">
        <span class="label">Presentation</span>
        <button class="btn" onclick="togglePalette()">Invert Mode</button>
        <button class="btn" onclick="togglePattern()">Hide Pattern</button>
    </div>

    <script>
        const svg = document.getElementById('kimono-svg');
        const patternPaths = document.querySelectorAll('path[fill*="asanoha"]');
        let isDark = false;
        let showPattern = true;

        // Refined Parallax Effect
        // Calculates distance from center to rotate the kimono slightly
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 80;
            const y = (window.innerHeight / 2 - e.pageY) / 80;
            // Subtle rotation and translation
            svg.style.transform = `translate(${x}px, ${y}px) rotate(${x * 0.05}deg)`;
        });

        function togglePalette() {
            const root = document.documentElement;
            isDark = !isDark;
            
            if (isDark) {
                // Dark Mode: Cream Kimono, Deep Indigo Obi
                root.style.setProperty('--bg-color', '#121212');
                root.style.setProperty('--kimono-base', '#E8E4D9'); // Cream/Ivory
                root.style.setProperty('--kimono-shadow', '#C4BEB0');
                root.style.setProperty('--kimono-highlight', '#F5F2EA');
                root.style.setProperty('--obi-base', '#1C2E35'); // Deep Indigo
                root.style.setProperty('--obi-shadow', '#0F1A1E');
                root.style.setProperty('--obi-highlight', '#2C4049');
                root.style.setProperty('--pattern-color', '#D0CCC0'); // Subtle cream pattern
                root.style.setProperty('--pattern-stroke', '#B8B3A5');
                root.style.setProperty('--text-color', '#F2F0E9');
            } else {
                // Light Mode: Ink Kimono, Gold Obi
                root.style.setProperty('--bg-color', '#F2F0E9');
                root.style.setProperty('--kimono-base', '#181B20');
                root.style.setProperty('--kimono-shadow', '#0A0C0F');
                root.style.setProperty('--kimono-highlight', '#2D343F');
                root.style.setProperty('--obi-base', '#D4AF37');
                root.style.setProperty('--obi-shadow', '#8A6E18');
                root.style.setProperty('--obi-highlight', '#F2D06B');
                root.style.setProperty('--pattern-color', '#2C333D');
                root.style.setProperty('--pattern-stroke', '#3A424D');
                root.style.setProperty('--text-color', '#181B20');
            }
        }

        function togglePattern() {
            showPattern = !showPattern;
            const opacity = showPattern ? '0.8' : '0';
            patternPaths.forEach(path => {
                path.style.opacity = opacity;
            });
        }
    </script>
</body>
</html>
