<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMONO — Refined Aesthetics</title>
    <style>
        :root {
            /* Palette: Deep Indigo & Vermilion */
            --bg-paper: #f4f2eb;
            --kimono-base: #1a3c57;
            --kimono-dark: #0d1f2e;
            --obi-base: #c23b3b;
            --obi-dark: #7a1f1f;
            --obi-accent: #d4af37; /* Gold */
            --text-main: #2a2a2a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-paper);
            font-family: "Georgia", serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: var(--text-main);
            transition: background-color 0.5s ease;
        }

        /* Grain Texture */
        .grain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.08;
            z-index: 5;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Layout */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        /* The Stage */
        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* Typography */
        .title-block {
            position: absolute;
            top: 5vh;
            left: 5vw;
            z-index: 10;
            pointer-events: none;
        }

        h1 {
            font-size: 4rem;
            font-weight: 400;
            line-height: 0.9;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            opacity: 0.9;
        }

        .subtitle {
            font-family: "Helvetica Neue", sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #666;
            border-top: 1px solid #666;
            padding-top: 0.5rem;
            display: inline-block;
        }

        .controls {
            position: absolute;
            bottom: 4vh;
            right: 5vw;
            display: flex;
            gap: 1rem;
            z-index: 10;
        }

        .btn {
            background: transparent;
            border: 1px solid rgba(0,0,0,0.2);
            padding: 0.8rem 1.5rem;
            font-family: "Helvetica Neue", sans-serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-main);
        }

        .btn:hover {
            background: var(--text-main);
            color: var(--bg-paper);
            border-color: var(--text-main);
        }

        /* SVG Container */
        #kimono-svg {
            height: 90vh;
            width: auto;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.15));
            transition: transform 0.1s ease-out;
            will-change: transform;
        }

        /* SVG Animation */
        @keyframes sway {
            0% { transform: rotate(0deg) translateY(0); }
            50% { transform: rotate(0.5deg) translateY(-10px); }
            100% { transform: rotate(0deg) translateY(0); }
        }

        .sway-anim {
            animation: sway 12s infinite ease-in-out;
            transform-origin: top center;
        }

        /* SVG Classes */
        .fabric-base { fill: var(--kimono-base); transition: fill 0.5s ease; }
        .fabric-shadow { fill: var(--kimono-dark); opacity: 0.4; transition: fill 0.5s ease; }
        .obi-base { fill: var(--obi-base); transition: fill 0.5s ease; }
        .obi-shadow { fill: var(--obi-dark); transition: fill 0.5s ease; }
        .pattern-layer { fill: url(#maple-pattern); mix-blend-mode: overlay; opacity: 0.5; transition: opacity 0.5s ease; }
        .highlight { stroke: rgba(255,255,255,0.15); stroke-width: 1; fill: none; }

    </style>
</head>
<body>

    <div class="grain"></div>

    <div class="title-block">
        <h1>KIMONO</h1>
        <span class="subtitle">Traditional Silhouette</span>
    </div>

    <main>
        <div class="stage">
            <svg id="kimono-svg" viewBox="0 0 500 900" xmlns="http://www.w3.org/2000/svg" class="sway-anim">
                <defs>
                    <!-- 1. Organic Fabric Gradient -->
                    <linearGradient id="body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="var(--kimono-base)" />
                        <stop offset="80%" stop-color="var(--kimono-base)" />
                        <stop offset="100%" stop-color="var(--kimono-dark)" />
                    </linearGradient>

                    <!-- 2. Obi Gradient -->
                    <linearGradient id="obi-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#e06060" />
                        <stop offset="40%" stop-color="var(--obi-base)" />
                        <stop offset="100%" stop-color="var(--obi-dark)" />
                    </linearGradient>

                    <!-- 3. Authentic Maple Pattern (Momiji) -->
                    <pattern id="maple-pattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
                        <path d="M30,10 L35,22 L48,22 L38,30 L42,42 L30,35 L18,42 L22,30 L12,22 L25,22 Z" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
                        <circle cx="30" cy="30" r="1" fill="#ffffff" opacity="0.6"/>
                    </pattern>

                    <!-- 4. Depth Filter -->
                    <filter id="inner-shadow">
                        <feOffset dx="0" dy="4"/>
                        <feGaussianBlur stdDeviation="3" result="offset-blur"/>
                        <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                        <feFlood flood-color="black" flood-opacity="0.3" result="color"/>
                        <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                        <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
                    </filter>
                </defs>

                <!-- GROUP: Kimono Body -->
                <g id="kimono-body">
                    <!-- Main Silhouette (Asymmetrical Drape) -->
                    <path class="fabric-base" d="M 180,150 
                             C 180,120 220,120 250,120 
                             C 280,120 320,120 320,150 
                             L 330,780 
                             C 330,810 170,810 170,780 
                             Z" 
                             fill="url(#body-grad)" />

                    <!-- Pattern Overlay -->
                    <path class="pattern-layer" d="M 180,150 C 180,120 220,120 250,120 C 280,120 320,120 320,150 L 330,780 C 330,810 170,810 170,780 Z" />

                    <!-- Sleeves (T-Suzure Style) -->
                    <!-- Left Sleeve -->
                    <path class="fabric-base" d="M 180,150 
                             C 150,140 120,100 110,90 
                             L 60,90 
                             C 60,140 60,200 60,240 
                             C 60,255 140,255 140,240 
                             L 140,160 Z" />
                    <!-- Left Sleeve Pattern -->
                    <path class="pattern-layer" d="M 180,150 C 150,140 120,100 110,90 L 60,90 C 60,140 60,200 60,240 C 60,255 140,255 140,240 L 140,160 Z" />

                    <!-- Right Sleeve -->
                    <path class="fabric-base" d="M 320,150 
                             C 350,140 380,100 390,90 
                             L 440,90 
                             C 440,140 440,200 440,240 
                             C 440,255 360,255 360,240 
                             L 360,160 Z" />
                    <!-- Right Sleeve Pattern -->
                    <path class="pattern-layer" d="M 320,150 C 350,140 380,100 390,90 L 440,90 C 440,140 440,200 440,240 C 440,255 360,255 360,240 L 360,160 Z" />

                    <!-- Collar (Eri) - The V-Overlap -->
                    <!-- Left Collar (Under) -->
                    <path d="M 250,120 L 180,150 L 170,780 C 170,800 200,805 250,805 L 250,140 Z" fill="var(--kimono-dark)" opacity="0.8"/>
                    <!-- Right Collar (Over) -->
                    <path d="M 250,120 L 320,150 L 330,780 C 330,800 300,805 250,805 L 250,140 Z" fill="var(--kimono-base)" />
                    <!-- Collar Highlights -->
                    <path d="M 249,125 L 318,152" class="highlight" />
                    <path d="M 251,125 L 182,152" class="highlight" stroke="rgba(255,255,255,0.05)" />

                    <!-- Fabric Folds (Volume) -->
                    <!-- Center Crease -->
                    <path d="M 250,140 L 250,400" stroke="rgba(0,0,0,0.15)" stroke-width="2" fill="none" filter="url(#inner-shadow)" />
                    <!-- Left Side Drape -->
                    <path d="M 190,300 Q 195,500 180,780 L 170,780 Q 185,500 180,300 Z" fill="rgba(0,0,0,0.15)" />
                    <!-- Right Side Drape -->
                    <path d="M 310,300 Q 305,500 320,780 L 330,780 Q 315,500 320,300 Z" fill="rgba(0,0,0,0.15)" />
                </g>

                <!-- GROUP: Obi (Sash) -->
                <g id="kimono-obi">
                    <!-- Main Wrap -->
                    <path class="obi-base" d="M 172,430 
                             C 250,450 328,430 328,430 
                             L 330,510 
                             C 250,530 170,510 170,510 
                             Z" 
                             fill="url(#obi-grad)" filter="url(#inner-shadow)" />
                    
                    <!-- Obi Texture/Pattern -->
                    <path d="M 172,430 C 250,450 328,430 328,430 L 330,510 C 250,530 170,510 170,510 Z" fill="url(#maple-pattern)" opacity="0.3" style="mix-blend-mode: screen;" />

                    <!-- Obi Knot (Taiko Musubi - Drum Knot) -->
                    <g transform="translate(250, 480)">
                        <!-- Back of Knot (visible due to perspective) -->
                        <path class="obi-shadow" d="M -40,0 C -50,30 -40,60 -30,70 L 30,70 C 40,60 50,30 40,0 Z" />
                        
                        <!-- Front Knot Body -->
                        <path class="obi-base" d="M -45,0 
                                 C -55,20 -50,50 -40,65 
                                 L 40,65 
                                 C 50,50 55,20 45,0 
                                 C 20,-10 0,-10 0,-10 
                                 C 0,-10 -20,-10 -45,0 Z" 
                                 filter="url(#inner-shadow)" />
                        
                        <!-- Knot Detailing (Folds) -->
                        <path d="M -40,10 Q 0,15 40,10" stroke="rgba(0,0,0,0.2)" stroke-width="1" fill="none"/>
                        <path d="M -38,30 Q 0,35 38,30" stroke="rgba(0,0,0,0.2)" stroke-width="1" fill="none"/>
                        <path d="M -35,50 Q 0,55 35,50" stroke="rgba(0,0,0,0.2)" stroke-width="1" fill="none"/>
                        
                        <!-- Gold Cord (Nodosashi) -->
                        <path d="M -20,65 L -20,110" stroke="var(--obi-accent)" stroke-width="2" fill="none" opacity="0.8" />
                        <path d="M 20,65 L 20,110" stroke="var(--obi-accent)" stroke-width="2" fill="none" opacity="0.8" />
                    </g>
                </g>

            </svg>
        </div>
    </main>

    <div class="controls">
        <button class="btn" onclick="toggleColor()">Dark Mode</button>
        <button class="btn" onclick="togglePattern()">Hide Pattern</button>
    </div>

    <script>
        const svg = document.getElementById('kimono-svg');
        const patternLayer = document.querySelector('.pattern-layer');
        let isDark = false;
        let showPattern = true;

        // Mouse Parallax
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 40;
            const y = (window.innerHeight / 2 - e.pageY) / 40;
            svg.style.transform = `translate(${x}px, ${y}px)`;
        });

        function toggleColor() {
            const root = document.documentElement;
            isDark = !isDark;
            if (isDark) {
                root.style.setProperty('--bg-paper', '#1a1a1a');
                root.style.setProperty('--kimono-base', '#2c3e50');
                root.style.setProperty('--kimono-dark', '#15202b');
                root.style.setProperty('--obi-base', '#8e44ad'); // Purple Obi for dark mode
                root.style.setProperty('--obi-dark', '#4a235a');
                root.style.setProperty('--text-main', '#e0e0e0');
            } else {
                root.style.setProperty('--bg-paper', '#f4f2eb');
                root.style.setProperty('--kimono-base', '#1a3c57');
                root.style.setProperty('--kimono-dark', '#0d1f2e');
                root.style.setProperty('--obi-base', '#c23b3b');
                root.style.setProperty('--obi-dark', '#7a1f1f');
                root.style.setProperty('--text-main', '#2a2a2a');
            }
        }

        function togglePattern() {
            showPattern = !showPattern;
            patternLayer.style.opacity = showPattern ? '0.5' : '0';
        }
    </script>
</body>
</html>
