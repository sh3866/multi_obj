<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimono | Autumn Fern Collection</title>
    <style>
        :root {
            /* Background & UI */
            --bg-color: #EBE6E1;
            --ink-color: #1A1A1A;
            --text-muted: #555555;
            
            /* Kimono Palette (Default: Indigo) */
            --kimono-base: #1c2e38;
            --kimono-dark: #0f181e;
            --kimono-light: #3a5565;
            --kimono-highlight: #5e8296;
            --kimono-accent: #8c2f39; /* Obi Red */
            
            /* Typography */
            --font-serif: "Garamond", "Georgia", "Times New Roman", serif;
            --font-sans: "Helvetica Neue", "Arial", sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--ink-color);
            font-family: var(--font-serif);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr; /* Split layout */
            grid-template-rows: 1fr;
            position: relative;
        }

        /* Subtle Grain Texture */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        /* --- Left Stage: The Kimono --- */
        .stage-left {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
            padding: 2rem;
        }

        .kimono-svg {
            height: 85vh; /* Occupy ~85% of viewport height */
            width: auto;
            filter: drop-shadow(0 30px 60px rgba(0,0,0,0.12));
            transition: transform 0.2s ease-out;
            transform-origin: center center;
        }

        /* --- Right Stage: Typography & Controls --- */
        .stage-right {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6rem 4rem;
            position: relative;
            z-index: 10;
        }

        /* Vertical Typography (Tategaki) */
        .vertical-title {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 3.5rem;
            line-height: 1.2;
            font-weight: 300;
            letter-spacing: 0.1em;
            margin-left: 2rem;
            border-left: 1px solid var(--ink-color);
            padding-left: 2rem;
            max-height: 60vh;
            opacity: 0.9;
        }

        .vertical-subtitle {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-family: var(--font-sans);
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-left: 1rem;
        }

        /* Metadata Block */
        .meta-block {
            margin-top: auto;
            margin-bottom: 4rem;
            max-width: 300px;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding: 1rem 0;
        }

        .meta-label {
            font-family: var(--font-sans);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        .meta-value {
            font-size: 0.9rem;
            font-style: italic;
        }

        /* Controls */
        .controls-area {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            border-top: 1px solid var(--ink-color);
            padding-top: 2rem;
        }

        .swatch-group {
            display: flex;
            gap: 1rem;
        }

        .swatch {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }

        .swatch:hover { transform: scale(1.1); }
        .swatch.active {
            box-shadow: 0 0 0 2px var(--bg-color), 0 0 0 4px var(--ink-color);
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--ink-color);
            color: var(--ink-color);
            padding: 0.8rem 2rem;
            font-family: var(--font-sans);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            width: fit-content;
        }

        .action-btn:hover {
            background: var(--ink-color);
            color: var(--bg-color);
        }

        /* Responsive */
        @media (max-width: 900px) {
            body { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
            .stage-left { padding: 1rem; }
            .kimono-svg { height: 50vh; }
            .stage-right { padding: 2rem; flex-direction: column; justify-content: flex-start; }
            .vertical-title, .vertical-subtitle { display: none; } /* Hide vertical text on mobile */
            .meta-block { margin-top: 2rem; }
            .controls-area { margin-top: 2rem; }
            
            /* Fallback horizontal title for mobile */
            .mobile-title { display: block; font-size: 2rem; margin-bottom: 1rem; }
        }
        .mobile-title { display: none; }

    </style>
</head>
<body>

    <!-- Left Side: Visual Stage -->
    <section class="stage-left">
        <!-- 
            SVG RECONSTRUCTION:
            - Centered, full vertical length.
            - Smooth bezier curves for fabric drape.
            - T-Shaped sleeves (Sode).
            - Detailed Obi with Musubi (Knot).
        -->
        <svg class="kimono-svg" viewBox="0 0 600 1000" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Fabric Gradient for Depth -->
                <linearGradient id="kimono-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:var(--kimono-highlight); stop-opacity:0.3" />
                    <stop offset="40%" style="stop-color:transparent" />
                    <stop offset="100%" style="stop-color:var(--kimono-dark); stop-opacity:0.6" />
                </linearGradient>

                <!-- Obi Gradient -->
                <linearGradient id="obi-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:rgba(0,0,0,0.3)" />
                    <stop offset="50%" style="stop-color:rgba(255,255,255,0.1)" />
                    <stop offset="100%" style="stop-color:rgba(0,0,0,0.3)" />
                </linearGradient>

                <!-- Dense Autumn Fern Pattern -->
                <pattern id="fern-pattern" x="0" y="0" width="40" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(10)">
                    <rect width="40" height="60" fill="var(--kimono-base)" />
                    <!-- Stylized Fern Motif -->
                    <g fill="var(--kimono-light)" opacity="0.6">
                        <path d="M20,5 Q30,15 20,25 Q10,15 20,5 Z" />
                        <path d="M20,35 Q30,45 20,55 Q10,45 20,35 Z" opacity="0.8"/>
                        <path d="M20,5 L20,55" stroke="var(--kimono-dark)" stroke-width="0.5" opacity="0.5"/>
                    </g>
                    <!-- Gold dust accents -->
                    <circle cx="10" cy="10" r="0.8" fill="#d4af37" opacity="0.4"/>
                    <circle cx="30" cy="40" r="0.8" fill="#d4af37" opacity="0.4"/>
                </pattern>

                <!-- Obi Geometric Pattern -->
                <pattern id="obi-pattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                    <rect width="20" height="20" fill="var(--kimono-accent)" />
                    <path d="M10,0 L20,10 L10,20 L0,10 Z" fill="rgba(0,0,0,0.15)"/>
                </pattern>

                <!-- Master Silhouette Clip Path -->
                <clipPath id="kimono-silhouette">
                    <!-- Main Body -->
                    <path d="M250,150 
                             C230,150 220,160 220,180 
                             C210,250 180,400 180,400 
                             L150,950 
                             C150,970 170,980 200,980 
                             L400,980 
                             C430,980 450,970 450,950 
                             L420,400 
                             C420,400 390,250 380,180 
                             C380,160 370,150 350,150 Z" />
                    
                    <!-- Left T-Sleeve (Sode) -->
                    <path d="M220,200 
                             L100,200 
                             C80,200 80,220 80,240 
                             L80,450 
                             C80,470 100,470 120,470 
                             L220,470 Z" />
                    
                    <!-- Right T-Sleeve (Sode) -->
                    <path d="M380,200 
                             L500,200 
                             C520,200 520,220 520,240 
                             L520,450 
                             C520,470 500,470 480,470 
                             L380,470 Z" />
                </clipPath>
            </defs>

            <g id="kimono-layer">
                <!-- 1. Fabric Body (Clipped) -->
                <g clip-path="url(#kimono-silhouette)">
                    <!-- Pattern Fill -->
                    <rect x="0" y="0" width="600" height="1000" fill="url(#fern-pattern)" class="pattern-target" />
                    <!-- Gradient Overlay for Volume -->
                    <rect x="0" y="0" width="600" height="1000" fill="url(#kimono-gradient)" />
                </g>

                <!-- 2. The Obi (Sash) -->
                <g transform="translate(0, 550)">
                    <!-- Obi Band (Wrap around) -->
                    <path d="M190,0 L410,0 L400,100 L200,100 Z" fill="url(#obi-pattern)" />
                    <path d="M190,0 L410,0 L400,100 L200,100 Z" fill="url(#obi-gradient)" />
                    
                    <!-- Obi Knot (Musubi) - Taiko Style -->
                    <g transform="translate(300, 50)">
                        <!-- Back Depth -->
                        <path d="M-110,-30 Q-140,50 -110,130 L110,130 Q140,50 110,-30 Z" fill="rgba(0,0,0,0.4)" />
                        <!-- Front Body -->
                        <path d="M-100,-20 Q0,10 100,-20 L105,110 Q0,140 -105,110 Z" fill="var(--kimono-accent)" />
                        <!-- Texture Lines on Knot -->
                        <path d="M-100,-20 Q0,10 100,-20" stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none"/>
                        <path d="M-105,110 Q0,140 105,110" stroke="rgba(0,0,0,0.2)" stroke-width="2" fill="none"/>
                    </g>
                </g>

                <!-- 3. Collar Construction (Eri) -->
                <g id="collar-layer">
                    <!-- Right Collar (Under Layer) -->
                    <path d="M350,150 L400,150 L400,180 L360,210 L350,150 Z" fill="#FDFBF7" />
                    
                    <!-- Left Collar (Top Layer) -->
                    <path d="M250,150 L300,150 L300,180 L260,210 L250,150 Z" fill="#FDFBF7" />
                    
                    <!-- Inner Collar Shadow (Depth) -->
                    <path d="M250,150 L300,150 L300,160 L260,210 L250,150 Z" fill="rgba(0,0,0,0.05)" />
                </g>

                <!-- 4. Hemline Details (Nagajuban peek) -->
                <path d="M155,940 L445,940" stroke="#FDFBF7" stroke-width="4" opacity="0.8" />
                <path d="M150,970 L450,970" stroke="#FDFBF7" stroke-width="2" opacity="0.5" />
            </g>
        </svg>
    </section>

    <!-- Right Side: Typography & Info -->
    <section class="stage-right">
        <header>
            <div class="mobile-title">Autumn Fern</div>
            <div class="vertical-title">
                秋のシダ
                <span style="font-size: 0.6em; opacity: 0.7; margin-left: 1rem;">Autumn Fern</span>
            </div>
            <div class="vertical-subtitle">
                Traditional Craft / Kyoto
            </div>
        </header>

        <div class="meta-block">
            <div class="meta-row">
                <span class="meta-label">Collection</span>
                <span class="meta-value">2024 Autumn</span>
            </div>
            <div class="meta-row">
                <span class="meta-label">Material</span>
                <span class="meta-value">Silk Haboté</span>
            </div>
            <div class="meta-row">
                <span class="meta-label">Technique</span>
                <span class="meta-value">Yūzen Dye</span>
            </div>
        </div>

        <div class="controls-area">
            <div>
                <span class="meta-label" style="display:block; margin-bottom:0.8rem;">Colorway</span>
                <div class="swatch-group">
                    <!-- Indigo -->
                    <div class="swatch active" style="background-color: #1c2e38;" 
                         data-base="#1c2e38" data-dark="#0f181e" data-light="#3a5565" data-highlight="#5e8296"></div>
                    <!-- Deep Brown -->
                    <div class="swatch" style="background-color: #3e2723;" 
                         data-base="#3e2723" data-dark="#281815" data-light="#5d4037" data-highlight="#8d6e63"></div>
                    <!-- Forest -->
                    <div class="swatch" style="background-color: #2e4033;" 
                         data-base="#2e4033" data-dark="#1a261e" data-light="#4a6352" data-highlight="#6b8c78"></div>
                </div>
            </div>
            
            <button id="toggle-pattern" class="action-btn">Hide Pattern</button>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const svg = document.querySelector('.kimono-svg');
            const root = document.documentElement;
            const swatches = document.querySelectorAll('.swatch');
            const toggleBtn = document.getElementById('toggle-pattern');
            const patternTarget = document.querySelector('.pattern-target');
            
            let patternVisible = true;

            // 1. Subtle Parallax Interaction
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth / 2 - e.clientX) / 100;
                const y = (window.innerHeight / 2 - e.clientY) / 100;
                
                // Subtle rotation and translation
                svg.style.transform = `perspective(1200px) rotateY(${x}deg) rotateX(${-y}deg) translateY(${y*0.5}px)`;
            });

            // 2. Color Switching Logic
            swatches.forEach(swatch => {
                swatch.addEventListener('click', () => {
                    // Update UI
                    swatches.forEach(s => s.classList.remove('active'));
                    swatch.classList.add('active');

                    // Update CSS Variables
                    root.style.setProperty('--kimono-base', swatch.dataset.base);
                    root.style.setProperty('--kimono-dark', swatch.dataset.dark);
                    root.style.setProperty('--kimono-light', swatch.dataset.light);
                    root.style.setProperty('--kimono-highlight', swatch.dataset.highlight);
                });
            });

            // 3. Pattern Toggle Logic
            toggleBtn.addEventListener('click', () => {
                patternVisible = !patternVisible;
                
                if (patternVisible) {
                    patternTarget.setAttribute('fill', 'url(#fern-pattern)');
                    toggleBtn.textContent = "Hide Pattern";
                } else {
                    patternTarget.setAttribute('fill', 'var(--kimono-base)');
                    toggleBtn.textContent = "Show Pattern";
                }
            });
        });
    </script>
</body>
</html>
