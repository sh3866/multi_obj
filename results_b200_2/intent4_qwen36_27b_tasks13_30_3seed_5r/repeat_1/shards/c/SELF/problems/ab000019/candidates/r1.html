<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactical AI Behavior Inspector</title>
<style>
  :root {
    --bg-deep: #050505;
    --bg-panel: #0a0a0a;
    --border: #1f1f23;
    --text-primary: #ececec;
    --text-secondary: #6b6b76;
    --accent-blue: #00e5ff;
    --accent-cyan: #22d3ee;
    --accent-red: #ff2a4d;
    --accent-orange: #ff5e00;
    --accent-yellow: #ffcc00;
    --accent-green: #00ff88;
    --grid-color: #141418;
    --scanline: rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-deep);
    color: var(--text-primary);
    font-family: "JetBrains Mono", "Fira Code", "Consolas", monospace;
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 340px;
    grid-template-rows: 50px 1fr;
    font-size: 12px;
  }

  /* HEADER */
  header {
    grid-column: 1 / -1;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 10;
    letter-spacing: 0.05em;
  }

  .brand {
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
  }

  .brand span {
    color: var(--accent-cyan);
  }

  .header-controls {
    display: flex;
    gap: 24px;
    align-items: center;
    font-size: 11px;
    color: var(--text-secondary);
  }

  .status-badge {
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 2px;
    background: rgba(0, 255, 136, 0.1);
    color: var(--accent-green);
    border: 1px solid rgba(0, 255, 136, 0.2);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    background: var(--accent-green);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { opacity: 0.4; }
    50% { opacity: 1; }
    100% { opacity: 0.4; }
  }

  /* MAIN CANVAS AREA */
  main {
    position: relative;
    background-color: var(--bg-deep);
    overflow: hidden;
    cursor: crosshair;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* INSPECTOR PANEL */
  aside {
    background: var(--bg-panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 32px 24px;
    gap: 32px;
    overflow-y: auto;
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }

  .legend-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .legend-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .legend-swatch {
    width: 100%;
    height: 36px;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: #000;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    position: relative;
    overflow: hidden;
  }
  
  .legend-swatch::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 100%);
  }

  .legend-label {
    font-size: 10px;
    color: var(--text-secondary);
    padding-left: 4px;
    border-left: 2px solid var(--border);
  }

  /* Player Stats */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  
  .stat-row:last-child { border-bottom: none; }

  .stat-label { color: var(--text-secondary); font-size: 11px; }
  .stat-value { font-weight: 700; font-family: "JetBrains Mono", monospace; color: var(--text-primary); }

  /* Interactive Elements */
  button {
    background: #1a1a1e;
    color: var(--text-primary);
    border: 1px solid var(--border);
    padding: 10px 12px;
    border-radius: 2px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 700;
    transition: all 0.2s;
    width: 100%;
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  button:hover { background: #25252a; border-color: #3f3f46; }
  button:active { background: #3f3f46; }

  .toggle-group {
    display: flex;
    gap: 8px;
  }
  
  .toggle-btn {
    flex: 1;
    text-align: center;
    opacity: 0.4;
    background: transparent;
    border: 1px solid transparent;
  }
  
  .toggle-btn.active {
    opacity: 1;
    background: #1a1a1e;
    border-color: var(--border);
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
  }

  /* Overlay Info */
  .overlay-info {
    position: absolute;
    bottom: 24px;
    left: 24px;
    pointer-events: none;
    font-family: "JetBrains Mono", monospace;
    color: var(--text-secondary);
    font-size: 10px;
    line-height: 1.6;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: rgba(5, 5, 5, 0.8);
    padding: 8px 12px;
    border: 1px solid var(--border);
    backdrop-filter: blur(4px);
  }

  /* CRT Effect Overlay */
  .scanlines {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
    background-size: 100% 4px;
    z-index: 100;
    opacity: 0.3;
  }

</style>
</head>
<body>

<div class="scanlines"></div>

<header>
  <div class="brand">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="var(--accent-cyan)"/>
    </svg>
    TACTICAL <span>AI</span> // OBSERVER
  </div>
  <div class="header-controls">
    <div class="status-badge">
      <div class="status-dot"></div>
      SIMULATION ACTIVE
    </div>
    <div id="fps-counter">FPS: 60</div>
  </div>
</header>

<main id="canvas-container">
  <canvas id="simCanvas"></canvas>
  <div class="overlay-info">
    <div>MOUSE: Move Player</div>
    <div>CLICK: Interact</div>
  </div>
</main>

<aside>
  <div class="panel-section">
    <div class="panel-title">Player Status</div>
    <div class="stat-row">
      <span class="stat-label">Health</span>
      <span class="stat-value" style="color: var(--accent-green)">100%</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Ammo</span>
      <span class="stat-value">32 / ∞</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Position</span>
      <span class="stat-value" id="pos-display">0, 0</span>
    </div>
  </div>

  <div class="panel-section">
    <div class="panel-title">
      AI State Legend
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    </div>
    <div class="legend-grid">
      <div class="legend-item">
        <div class="legend-swatch" style="background: var(--accent-green);">
          Patrol
        </div>
        <div class="legend-label">Idle / Waypoint</div>
      </div>
      <div class="legend-item">
        <div class="legend-swatch" style="background: var(--accent-yellow);">
          Alert
        </div>
        <div class="legend-label">Investigating</div>
      </div>
      <div class="legend-item">
        <div class="legend-swatch" style="background: var(--accent-orange);">
          Chase
        </div>
        <div class="legend-label">Engaging</div>
      </div>
      <div class="legend-item">
        <div class="legend-swatch" style="background: var(--accent-red);">
          Attack
        </div>
        <div class="legend-label">Combat</div>
      </div>
    </div>
  </div>

  <div class="panel-section">
    <div class="panel-title">Visualization Layers</div>
    <div class="toggle-group">
      <button class="toggle-btn active" onclick="toggleLayer('paths')">Paths</button>
      <button class="toggle-btn active" onclick="toggleLayer('fov')">FOV</button>
      <button class="toggle-btn active" onclick="toggleLayer('labels')">Labels</button>
    </div>
  </div>

  <div class="panel-section" style="margin-top: auto;">
    <button onclick="resetSimulation()">Reset Simulation</button>
  </div>
</aside>

<script>
/**
 * TACTICAL AI SIMULATION ENGINE
 * Pure Vanilla JS + Canvas API
 */

const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const posDisplay = document.getElementById('pos-display');
const fpsDisplay = document.getElementById('fps-counter');

// Configuration
const CONFIG = {
  colors: {
    bg: '#050505',
    wall: '#1a1a1e',
    wallBorder: '#3f3f46',
    grid: '#141418',
    player: '#00e5ff',
    playerGlow: 'rgba(0, 229, 255, 0.4)',
    states: {
      PATROL: '#00ff88',
      ALERT: '#ffcc00',
      CHASE: '#ff5e00',
      ATTACK: '#ff2a4d'
    }
  },
  enemyCount: 5,
  wallCount: 6
};

// State
let width, height;
let lastTime = 0;
let frameCount = 0;
let lastFpsTime = 0;
let mouse = { x: 0, y: 0 };
let walls = [];
let enemies = [];
let particles = [];

// Layers
const layers = {
  paths: true,
  fov: true,
  labels: true
};

// --- UTILS ---

const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const lerp = (a, b, t) => a + (b - a) * t;
const angleTo = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);

// Line segment intersection (for wall collision/FOV)
function getIntersection(A, B, C, D) {
  const tTop = (D.x - C.x) * (A.y - C.y) - (D.y - C.y) * (A.x - C.x);
  const uTop = (C.y - A.y) * (A.x - B.x) - (C.x - A.x) * (A.y - B.y);
  const bottom = (D.y - C.y) * (B.x - A.x) - (D.x - C.x) * (B.y - A.y);

  if (bottom !== 0) {
    const t = tTop / bottom;
    const u = uTop / bottom;
    if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
      return {
        x: lerp(A.x, B.x, t),
        y: lerp(A.y, B.y, t),
        offset: t
      }
    }
  }
  return null;
}

// --- CLASSES ---

class Wall {
  constructor(x, y, w, h) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.segments = [
      {x1: x, y1: y, x2: x + w, y2: y},
      {x1: x + w, y1: y, x2: x + w, y2: y + h},
      {x1: x + w, y1: y + h, x2: x, y2: y + h},
      {x1: x, y1: y + h, x2: x, y2: y}
    ];
  }

  draw(ctx) {
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(this.x + 4, this.y + 4, this.w, this.h);

    // Main Block
    ctx.fillStyle = CONFIG.colors.wall;
    ctx.strokeStyle = CONFIG.colors.wallBorder;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.rect(this.x, this.y, this.w, this.h);
    ctx.fill();
    ctx.stroke();
    
    // Top Highlight
    ctx.fillStyle = '#2a2a30';
    ctx.fillRect(this.x, this.y, this.w, 2);
    
    // Side Shadow
    ctx.fillStyle = '#111114';
    ctx.fillRect(this.x + this.w - 2, this.y, 2, this.h);
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.color = color;
    this.vx = (Math.random() - 0.5) * 4;
    this.vy = (Math.random() - 0.5) * 4;
    this.life = 1.0;
    this.decay = 0.03 + Math.random() * 0.04;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.9;
    this.vy *= 0.9;
    this.life -= this.decay;
  }
  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Enemy {
  constructor(id) {
    this.id = id;
    this.x = Math.random() * (width - 100) + 50;
    this.y = Math.random() * (height - 100) + 50;
    this.radius = 10;
    this.angle = Math.random() * Math.PI * 2;
    this.speed = 1.2 + Math.random() * 0.8;
    
    // AI State Machine
    this.state = 'PATROL'; 
    this.targetX = this.x;
    this.targetY = this.y;
    
    // Waypoints
    this.waypoints = [];
    this.currentWaypointIndex = 0;
    this.generateWaypoints();

    // Properties
    this.viewDistance = 200;
    this.viewAngle = Math.PI / 3; // 60 degrees
    this.attackRange = 50;
    
    this.alertTimer = 0;
    this.lastSeenPos = {x: 0, y: 0};
  }

  generateWaypoints() {
    this.waypoints = [];
    for(let i=0; i<4; i++) {
      this.waypoints.push({
        x: Math.random() * (width - 100) + 50,
        y: Math.random() * (height - 100) + 50
      });
    }
  }

  update(player, walls) {
    const dToPlayer = dist(this.x, this.y, player.x, player.y);
    const angleToPlayer = angleTo(this.x, this.y, player.x, player.y);
    
    // Normalize angle diff
    let angleDiff = angleToPlayer - this.angle;
    while (angleDiff <= -Math.PI) angleDiff += Math.PI*2;
    while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
    
    const inFOV = Math.abs(angleDiff) < this.viewAngle / 2;
    const canSee = dToPlayer < this.viewDistance && inFOV && this.hasLineOfSight(player.x, player.y, walls);

    // State Logic
    if (this.state === 'PATROL') {
      if (canSee) {
        this.state = 'CHASE';
        this.lastSeenPos = {x: player.x, y: player.y};
        return;
      }
      this.patrol();
    } 
    else if (this.state === 'ALERT') {
      this.alertTimer--;
      if (this.alertTimer <= 0) this.state = 'PATROL';
      // Investigate logic
      if (dist(this.x, this.y, this.lastSeenPos.x, this.lastSeenPos.y) > 5) {
         this.moveTowards(this.lastSeenPos.x, this.lastSeenPos.y);
      }
    }
    else if (this.state === 'CHASE') {
      if (canSee) {
        this.lastSeenPos = {x: player.x, y: player.y};
        if (dToPlayer < this.attackRange) {
          this.state = 'ATTACK';
        } else {
          this.moveTowards(player.x, player.y);
        }
      } else {
        this.state = 'ALERT';
        this.alertTimer = 180; // 3 seconds
      }
    }
    else if (this.state === 'ATTACK') {
      if (canSee) {
        this.lastSeenPos = {x: player.x, y: player.y};
        // Face player and shoot
        this.angle = lerp(this.angle, angleToPlayer, 0.15);
        if (Math.random() < 0.08) this.shoot(player.x, player.y);
      } else {
        this.state = 'ALERT';
        this.alertTimer = 180;
      }
    }
  }

  hasLineOfSight(tx, ty, walls) {
    const p1 = {x: this.x, y: this.y};
    const p2 = {x: tx, y: ty};
    
    for (let w of walls) {
      for (let seg of w.segments) {
        if (getIntersection(p1, p2, {x: seg.x1, y: seg.y1}, {x: seg.x2, y: seg.y2})) {
          return false;
        }
      }
    }
    return true;
  }

  patrol() {
    const wp = this.waypoints[this.currentWaypointIndex];
    if (dist(this.x, this.y, wp.x, wp.y) < 5) {
      this.currentWaypointIndex = (this.currentWaypointIndex + 1) % this.waypoints.length;
    }
    this.moveTowards(wp.x, wp.y);
  }

  moveTowards(tx, ty) {
    const targetAngle = angleTo(this.x, this.y, tx, ty);
    // Smooth rotation
    let diff = targetAngle - this.angle;
    while (diff <= -Math.PI) diff += Math.PI*2;
    while (diff > Math.PI) diff -= Math.PI*2;
    this.angle += diff * 0.08;

    // Move
    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
    
    // Simple boundary check
    this.x = Math.max(20, Math.min(width - 20, this.x));
    this.y = Math.max(20, Math.min(height - 20, this.y));
  }

  shoot(tx, ty) {
    // Muzzle flash
    particles.push(new Particle(this.x + Math.cos(this.angle)*12, this.y + Math.sin(this.angle)*12, '#ffcc00'));
    particles.push(new Particle(this.x + Math.cos(this.angle)*12, this.y + Math.sin(this.angle)*12, '#ffffff'));
  }

  draw(ctx) {
    // Draw FOV Cone
    if (layers.fov) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, this.viewDistance, -this.viewAngle/2, this.viewAngle/2);
      ctx.closePath();
      
      const color = CONFIG.colors.states[this.state];
      ctx.fillStyle = color.replace(')', ', 0.05)').replace('rgb', 'rgba');
      ctx.fill();
      
      // Cone Border
      ctx.strokeStyle = color.replace(')', ', 0.2)').replace('rgb', 'rgba');
      ctx.lineWidth = 1;
      ctx.stroke();
      
      ctx.restore();
    }

    // Draw Body
    const color = CONFIG.colors.states[this.state];
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    
    // Glow
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    
    // Body Shape (Triangle)
    ctx.beginPath();
    ctx.moveTo(12, 0);
    ctx.lineTo(-8, 7);
    ctx.lineTo(-5, 0);
    ctx.lineTo(-8, -7);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    
    ctx.shadowBlur = 0;
    ctx.restore();

    // Draw State Label
    if (layers.labels) {
      ctx.fillStyle = color;
      ctx.font = '700 9px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(this.state, this.x, this.y - 18);
      
      // Range circle (Attack range)
      if (this.state === 'ATTACK' || this.state === 'CHASE') {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.attackRange, 0, Math.PI*2);
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 4]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }
}

// --- MAIN LOOP ---

function init() {
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });

  // Generate Map
  generateMap();
  
  requestAnimationFrame(loop);
}

function resize() {
  const container = document.getElementById('canvas-container');
  width = container.clientWidth;
  height = container.clientHeight;
  canvas.width = width;
  canvas.height = height;
}

function generateMap() {
  walls = [];
  enemies = [];
  
  // Random Walls
  for(let i=0; i<CONFIG.wallCount; i++) {
    const w = 60 + Math.random() * 120;
    const h = 30 + Math.random() * 40;
    const x = Math.random() * (width - w - 100) + 50;
    const y = Math.random() * (height - h - 100) + 50;
    // Keep center clear for player spawn
    if (dist(x, y, width/2, height/2) > 150) {
      walls.push(new Wall(x, y, w, h));
    }
  }

  // Spawn Enemies
  for(let i=0; i<CONFIG.enemyCount; i++) {
    enemies.push(new Enemy(i));
  }
}

function drawGrid() {
  ctx.strokeStyle = CONFIG.colors.grid;
  ctx.lineWidth = 1;
  const gridSize = 50;
  
  ctx.beginPath();
  for(let x=0; x<=width; x+=gridSize) {
    ctx.moveTo(x, 0);
    ctx.lineTo(x, height);
  }
  for(let y=0; y<=height; y+=gridSize) {
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
  }
  ctx.stroke();
}

function drawPlayer() {
  // Player trails/movement logic could go here, for now just follow mouse
  const pX = mouse.x;
  const pY = mouse.y;
  
  // Connection lines to enemies (Tracking visualization)
  if (layers.paths) {
    ctx.lineWidth = 1;
    enemies.forEach(e => {
      ctx.beginPath();
      ctx.moveTo(pX, pY);
      ctx.lineTo(e.x, e.y);
      
      // Check if visible
      const d = dist(pX, pY, e.x, e.y);
      const angle = angleTo(pX, pY, e.x, e.y);
      let angleDiff = angle - e.angle;
      while (angleDiff <= -Math.PI) angleDiff += Math.PI*2;
      while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
      const inFOV = Math.abs(angleDiff) < e.viewAngle / 2;
      const visible = d < e.viewDistance && inFOV && e.hasLineOfSight(pX, pY, walls);
      
      if (visible) {
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.2)';
        ctx.setLineDash([5, 5]);
      } else {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.setLineDash([]);
      }
      ctx.stroke();
    });
  }

  // Player Entity
  ctx.save();
  ctx.translate(pX, pY);
  
  // Pulse effect
  const time = Date.now() / 500;
  const scale = 1 + Math.sin(time) * 0.05;
  ctx.scale(scale, scale);

  ctx.shadowColor = CONFIG.colors.player;
  ctx.shadowBlur = 15;
  
  ctx.beginPath();
  ctx.arc(0, 0, 6, 0, Math.PI*2);
  ctx.fillStyle = CONFIG.colors.player;
  ctx.fill();
  
  // Crosshair
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(0, 229, 255, 0.5)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(0, 0, 12, 0, Math.PI*2);
  ctx.stroke();
  
  // Rotating ring
  ctx.rotate(time);
  ctx.beginPath();
  ctx.arc(0, 0, 16, 0, Math.PI/2);
  ctx.stroke();

  ctx.restore();

  // Update UI
  posDisplay.innerText = `${Math.floor(pX)}, ${Math.floor(pY)}`;
}

function loop(timestamp) {
  // FPS Counter
  frameCount++;
  if (timestamp - lastFpsTime >= 1000) {
    fpsDisplay.innerText = `FPS: ${frameCount}`;
    frameCount = 0;
    lastFpsTime = timestamp;
  }

  // Clear
  ctx.fillStyle = CONFIG.colors.bg;
  ctx.fillRect(0, 0, width, height);
  
  drawGrid();

  // Update & Draw Enemies
  enemies.forEach(e => {
    e.update(mouse, walls);
    e.draw(ctx);
  });

  // Update & Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  // Draw Walls
  walls.forEach(w => w.draw(ctx));

  drawPlayer();

  requestAnimationFrame(loop);
}

// --- UI INTERACTION ---

window.toggleLayer = (layer) => {
  layers[layer] = !layers[layer];
  const btns = document.querySelectorAll('.toggle-btn');
  // Very simple mapping based on order in HTML
  if (layer === 'paths') btns[0].classList.toggle('active');
  if (layer === 'fov') btns[1].classList.toggle('active');
  if (layer === 'labels') btns[2].classList.toggle('active');
};

window.resetSimulation = () => {
  generateMap();
  particles = [];
};

// Start
init();

</script>
