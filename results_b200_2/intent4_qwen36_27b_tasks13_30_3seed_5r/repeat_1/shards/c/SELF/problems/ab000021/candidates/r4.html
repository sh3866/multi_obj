<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Architecture & Data Flow</title>
    <style>
        :root {
            /* Palette - Deep Slate & Neon */
            --bg-body: #0b0c10;
            --bg-card: #15171e;
            --bg-card-hover: #1c1f29;
            --border-card: #2d3142;
            
            --text-main: #f0f4f8;
            --text-muted: #8892b0;
            
            /* Signal Colors */
            --col-data: #00e5ff;    /* Cyan */
            --col-instr: #ffaa00;   /* Amber */
            --col-ctrl: #00ff9d;    /* Neon Green */
            
            /* Component Highlights */
            --col-cpu: #ffffff;
            --col-gpu: #d946ef;
            --col-mem: #00e5ff;
            --col-stor: #ff5f5f;
            --col-io: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            
            /* Refined Grid Background */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* --- Header --- */
        header {
            background: rgba(11, 12, 16, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px 48px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .header-title h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #fff;
        }

        .header-title span {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: 'Courier New', monospace;
            margin-top: 4px;
            letter-spacing: 0.05em;
            opacity: 0.7;
        }

        /* --- Legend --- */
        .legend {
            display: flex;
            gap: 36px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 700;
            color: var(--text-muted);
        }

        .legend-icon {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .legend-icon::after {
            content: '';
            width: 12px;
            height: 2px;
        }

        /* --- Main Canvas --- */
        main {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 1px rgba(255,255,255,0.02));
        }

        /* --- SVG Styling --- */
        
        .node-group {
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .node-bg {
            fill: var(--bg-card);
            stroke-width: 1px;
            rx: 10px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
            transition: stroke-width 0.3s ease, fill 0.3s ease, filter 0.3s ease;
        }

        .node-group:hover .node-bg {
            fill: var(--bg-card-hover);
            stroke-width: 1.5px;
            filter: drop-shadow(0 0 25px rgba(255,255,255,0.03));
        }

        .node-icon {
            transition: transform 0.3s ease;
        }
        
        .node-group:hover .node-icon {
            transform: scale(1.05);
        }

        .node-label {
            fill: #fff;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 13px;
            text-anchor: middle;
            letter-spacing: 0.5px;
        }

        .node-sub {
            fill: var(--text-muted);
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            text-anchor: middle;
            font-weight: 500;
            opacity: 0.8;
        }

        /* Paths */
        .path-track {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 4px;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        .path-active {
            fill: none;
            stroke-width: 2px;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        /* Flow Animation */
        @keyframes dash {
            to { stroke-dashoffset: -100; }
        }

        .path-flow {
            fill: none;
            stroke-width: 2px;
            stroke-dasharray: 2 50; /* Sparse particles */
            stroke-linecap: round;
            animation: dash 1.5s linear infinite;
            mix-blend-mode: screen;
            filter: drop-shadow(0 0 4px currentColor);
        }

        /* Connection Labels */
        .line-label {
            font-family: 'Courier New', monospace;
            font-size: 9px;
            fill: var(--text-muted);
            text-anchor: middle;
            font-weight: 600;
            letter-spacing: 0.5px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        /* Show labels on hover of path */
        .link-group:hover .line-label {
            opacity: 1;
            fill: #fff;
        }
        
        .link-group:hover .path-track {
            stroke: rgba(255, 255, 255, 0.1);
        }

        /* Specific Node Colors */
        #cpu .node-bg { stroke: var(--col-cpu); }
        #gpu .node-bg { stroke: var(--col-gpu); }
        #mem .node-bg { stroke: var(--col-mem); }
        #stor .node-bg { stroke: var(--col-stor); }
        #inp .node-bg, #out .node-bg, #net .node-bg { stroke: var(--col-io); }

    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>System Architecture</h1>
            <span>FIG 1.0 // DATA, CONTROL & INSTRUCTION FLOW TOPOLOGY</span>
        </div>
        <div class="legend">
            <div class="legend-item" style="color: var(--col-data)">
                <div class="legend-icon" style="border-color: var(--col-data)">
                    <div style="background: var(--col-data)"></div>
                </div>
                <span>Data</span>
            </div>
            <div class="legend-item" style="color: var(--col-instr)">
                <div class="legend-icon" style="border-color: var(--col-instr)">
                    <div style="background: var(--col-instr)"></div>
                </div>
                <span>Instructions</span>
            </div>
            <div class="legend-item" style="color: var(--col-ctrl)">
                <div class="legend-icon" style="border-color: var(--col-ctrl)">
                    <div style="background: var(--col-ctrl)"></div>
                </div>
                <span>Control</span>
            </div>
        </div>
    </header>

    <main id="canvas-container">
        <!-- SVG injected here -->
    </main>

    <script>
        const colors = {
            data: '#00e5ff',
            instr: '#ffaa00',
            ctrl: '#00ff9d',
            cpu: '#ffffff',
            gpu: '#d946ef',
            mem: '#00e5ff',
            stor: '#ff5f5f',
            io: '#94a3b8'
        };

        // Layout Configuration - Centered on 1200x800
        const components = {
            cpu:  { x: 500, y: 350, w: 200, h: 140, label: "CPU", sub: "Central Processing Unit" },
            mem:  { x: 500, y: 80,  w: 200, h: 120, label: "RAM", sub: "System Memory" },
            gpu:  { x: 850, y: 150, w: 160, h: 100, label: "GPU", sub: "Graphics / Compute" },
            stor: { x: 150, y: 580, w: 160, h: 100, label: "SSD", sub: "Non-Volatile Storage" },
            net:  { x: 850, y: 580, w: 160, h: 100, label: "NIC", sub: "Network Interface" },
            inp:  { x: 150, y: 200, w: 140, h: 90, label: "INPUT", sub: "Keyboard / Mouse" },
            out:  { x: 850, y: 380, w: 140, h: 90, label: "DISPLAY", sub: "Video Output" }
        };

        const connections = [
            // CPU <-> RAM
            { from: 'cpu', to: 'mem', type: 'data', label: 'Load/Store' },
            { from: 'mem', to: 'cpu', type: 'instr', label: 'Instruction Fetch' },
            { from: 'cpu', to: 'mem', type: 'ctrl', label: 'Bus Control' },

            // CPU <-> GPU
            { from: 'cpu', to: 'gpu', type: 'data', label: 'Command Buffer' },
            { from: 'gpu', to: 'mem', type: 'data', label: 'VRAM / DMA' },

            // CPU <-> Storage
            { from: 'cpu', to: 'stor', type: 'ctrl', label: 'IO Request' },
            { from: 'stor', to: 'cpu', type: 'data', label: 'Block Data' },

            // CPU <-> Network
            { from: 'cpu', to: 'net', type: 'data', label: 'Packet TX' },
            { from: 'net', to: 'cpu', type: 'data', label: 'Packet RX' },

            // Input/Output
            { from: 'inp', to: 'cpu', type: 'ctrl', label: 'Interrupt' },
            { from: 'gpu', to: 'out', type: 'data', label: 'Video Signal' },
        ];

        // Helper: Get center
        const getCenter = (id) => {
            const c = components[id];
            return { x: c.x + c.w/2, y: c.y + c.h/2 };
        };

        // Helper: Calculate orthogonal path points
        const getOrthoPath = (sId, tId) => {
            const s = components[sId];
            const t = components[tId];
            
            const sc = getCenter(sId);
            const tc = getCenter(tId);
            
            let startX, startY, endX, endY;

            // Determine relative position
            const dx = tc.x - sc.x;
            const dy = tc.y - sc.y;

            // Source Point (Edge)
            if (Math.abs(dx) > Math.abs(dy)) {
                startX = dx > 0 ? s.x + s.w : s.x;
                startY = sc.y;
            } else {
                startX = sc.x;
                startY = dy > 0 ? s.y + s.h : s.y;
            }

            // Target Point (Edge)
            if (Math.abs(dx) > Math.abs(dy)) {
                endX = dx > 0 ? t.x : t.x + t.w;
                endY = tc.y;
            } else {
                endX = tc.x;
                endY = dy > 0 ? t.y : t.y + t.h;
            }

            // Manhattan Routing: 
            // Move out from source -> Midpoint X -> Move to Target Y -> Target
            const midX = (startX + endX) / 2;
            
            return `M ${startX} ${startY} L ${midX} ${startY} L ${midX} ${endY} L ${endX} ${endY}`;
        };

        const createSVG = () => {
            const ns = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(ns, "svg");
            svg.setAttribute("viewBox", "0 0 1200 800");
            svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

            // --- Defs ---
            const defs = document.createElementNS(ns, "defs");
            
            // Arrow Markers
            ['data', 'instr', 'ctrl'].forEach(type => {
                const marker = document.createElementNS(ns, "marker");
                marker.setAttribute("id", `arrow-${type}`);
                marker.setAttribute("viewBox", "0 0 10 10");
                marker.setAttribute("refX", "8");
                marker.setAttribute("refY", "5");
                marker.setAttribute("markerWidth", "6");
                marker.setAttribute("markerHeight", "6");
                marker.setAttribute("orient", "auto");
                
                const path = document.createElementNS(ns, "path");
                path.setAttribute("d", "M 0 0 L 10 5 L 0 10 z");
                path.setAttribute("fill", colors[type]);
                marker.appendChild(path);
                defs.appendChild(marker);
            });

            svg.appendChild(defs);

            // --- Layer 1: Connections ---
            const linksGroup = document.createElementNS(ns, "g");
            linksGroup.setAttribute("id", "links-layer");

            connections.forEach((conn, i) => {
                const pathD = getOrthoPath(conn.from, conn.to);
                const color = colors[conn.type];

                // Group for hover effects
                const linkGroup = document.createElementNS(ns, "g");
                linkGroup.setAttribute("class", "link-group");
                // Make hit area thicker
                const hitArea = document.createElementNS(ns, "path");
                hitArea.setAttribute("d", pathD);
                hitArea.setAttribute("stroke", "transparent");
                hitArea.setAttribute("stroke-width", "15");
                hitArea.setAttribute("fill", "none");
                linkGroup.appendChild(hitArea);

                // 1. Background Track (Dim)
                const track = document.createElementNS(ns, "path");
                track.setAttribute("d", pathD);
                track.setAttribute("class", "path-track");
                linkGroup.appendChild(track);

                // 2. Active Line (Color + Arrow)
                const activeLine = document.createElementNS(ns, "path");
                activeLine.setAttribute("d", pathD);
                activeLine.setAttribute("stroke", color);
                activeLine.setAttribute("class", "path-active");
                activeLine.setAttribute("marker-end", `url(#arrow-${conn.type})`);
                linkGroup.appendChild(activeLine);

                // 3. Animated Particle (Flow)
                const flow = document.createElementNS(ns, "path");
                flow.setAttribute("d", pathD);
                flow.setAttribute("stroke", color);
                flow.setAttribute("class", "path-flow");
                flow.style.animationDelay = `${Math.random() * -2}s`;
                linkGroup.appendChild(flow);

                // 4. Label
                const midX = (components[conn.from].x + components[conn.from].w/2 + components[conn.to].x + components[conn.to].w/2) / 2;
                const midY = (components[conn.from].y + components[conn.from].h/2 + components[conn.to].y + components[conn.to].h/2) / 2;

                const label = document.createElementNS(ns, "text");
                label.setAttribute("x", midX);
                label.setAttribute("y", midY - 8);
                label.setAttribute("class", "line-label");
                label.textContent = conn.label;
                linkGroup.appendChild(label);

                linksGroup.appendChild(linkGroup);
            });
            svg.appendChild(linksGroup);

            // --- Layer 2: Components ---
            const nodesGroup = document.createElementNS(ns, "g");

            Object.keys(components).forEach(key => {
                const comp = components[key];
                const g = document.createElementNS(ns, "g");
                g.setAttribute("id", key);
                g.setAttribute("class", "node-group");
                g.setAttribute("transform", `translate(${comp.x}, ${comp.y})`);

                // Box
                const rect = document.createElementNS(ns, "rect");
                rect.setAttribute("width", comp.w);
                rect.setAttribute("height", comp.h);
                rect.setAttribute("class", "node-bg");
                g.appendChild(rect);

                // Iconography
                const iconGroup = document.createElementNS(ns, "g");
                iconGroup.setAttribute("class", "node-icon");
                iconGroup.setAttribute("transform", `translate(${comp.w/2}, 40)`);
                iconGroup.setAttribute("fill", "none");
                iconGroup.setAttribute("stroke-width", "2.5");
                iconGroup.setAttribute("stroke-linecap", "round");
                iconGroup.setAttribute("stroke-linejoin", "round");

                // Draw specific icons
                if (key === 'cpu') {
                    iconGroup.setAttribute("stroke", colors.cpu);
                    // Grid
                    const grid = document.createElementNS(ns, "g");
                    for(let i=0; i<3; i++) {
                        for(let j=0; j<3; j++) {
                            const s = document.createElementNS(ns, "rect");
                            s.setAttribute("x", -14 + i*11); s.setAttribute("y", -14 + j*11);
                            s.setAttribute("width", 6); s.setAttribute("height", 6);
                            grid.appendChild(s);
                        }
                    }
                    iconGroup.appendChild(grid);
                } else if (key === 'mem') {
                    iconGroup.setAttribute("stroke", colors.mem);
                    // RAM Sticks
                    for(let i=0; i<4; i++) {
                        const r = document.createElementNS(ns, "rect");
                        r.setAttribute("x", -18 + i*11); r.setAttribute("y", -12);
                        r.setAttribute("width", 5); r.setAttribute("height", 24);
                        r.setAttribute("fill", colors.mem); r.setAttribute("opacity", "0.8");
                        iconGroup.appendChild(r);
                    }
                } else if (key === 'gpu') {
                    iconGroup.setAttribute("stroke", colors.gpu);
                    // Triangle
                    const t = document.createElementNS(ns, "polygon");
                    t.setAttribute("points", "0,-12 12,8 -12,8");
                    iconGroup.appendChild(t);
                } else if (key === 'stor') {
                    iconGroup.setAttribute("stroke", colors.stor);
                    // Platters
                    for(let i=0; i<3; i++) {
                        const l = document.createElementNS(ns, "path");
                        l.setAttribute("d", "M -12 -8+i*8 L 12 -8+i*8");
                        iconGroup.appendChild(l);
                    }
                } else {
                    // Generic IO Circle
                    iconGroup.setAttribute("stroke", colors.io);
                    const c = document.createElementNS(ns, "circle");
                    c.setAttribute("r", 10);
                    iconGroup.appendChild(c);
                }
                g.appendChild(iconGroup);

                // Labels
                const textMain = document.createElementNS(ns, "text");
                textMain.setAttribute("x", comp.w/2);
                textMain.setAttribute("y", comp.h/2 + 25);
                textMain.setAttribute("class", "node-label");
                textMain.textContent = comp.label;
                g.appendChild(textMain);

                const textSub = document.createElementNS(ns, "text");
                textSub.setAttribute("x", comp.w/2);
                textSub.setAttribute("y", comp.h/2 + 45);
                textSub.setAttribute("class", "node-sub");
                textSub.textContent = comp.sub;
                g.appendChild(textSub);

                nodesGroup.appendChild(g);
            });
            svg.appendChild(nodesGroup);

            return svg;
        };

        const container = document.getElementById('canvas-container');
        const svgElement = createSVG();
        container.appendChild(svgElement);

        // Hover Interactions for Nodes
        const nodeGroups = svgElement.querySelectorAll('g.node-group');
        nodeGroups.forEach(node => {
            node.addEventListener('mouseenter', () => {
                // Highlight this node
                const rect = node.querySelector('rect');
                rect.style.fill = '#1e222b';
                
                // Dim all other nodes
                nodeGroups.forEach(other => {
                    if (other !== node) other.style.opacity = '0.3';
                });

                // Dim all paths
                const paths = svgElement.querySelectorAll('.path-track');
                paths.forEach(p => p.style.opacity = '0.1');
            });

            node.addEventListener('mouseleave', () => {
                const rect = node.querySelector('rect');
                rect.style.fill = '';
                
                nodeGroups.forEach(other => {
                    other.style.opacity = '1';
                });
                
                const paths = svgElement.querySelectorAll('.path-track');
                paths.forEach(p => p.style.opacity = '1');
            });
        });

    </script>
</body>
</html>
