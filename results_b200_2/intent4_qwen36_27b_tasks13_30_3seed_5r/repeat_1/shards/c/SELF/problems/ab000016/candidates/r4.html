<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEO-RUNNER // V4.0</title>
    <style>
        :root {
            --bg-deep: #050505;
            --bg-panel: #0a0a0f;
            --accent-cyan: #00f0ff;
            --accent-magenta: #ff0055;
            --accent-yellow: #ffcc00;
            --text-main: #ffffff;
            --text-dim: #6e7681;
            --font-mono: 'SF Mono', 'Fira Code', 'Consolas', 'Courier New', monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-sans);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Atmosphere */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 30%, #000000 100%);
            pointer-events: none;
            z-index: 50;
        }

        /* Main Viewport */
        .game-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--bg-panel);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay Layer */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 50px;
            z-index: 10;
        }

        /* Top HUD */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            opacity: 0.9;
        }

        .brand {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dim);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-line {
            width: 40px;
            height: 2px;
            background: var(--accent-cyan);
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        .score-group {
            text-align: right;
            font-family: var(--font-mono);
        }

        .score-val {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -2px;
            color: var(--text-main);
            line-height: 1;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
            font-variant-numeric: tabular-nums;
        }

        .hi-score {
            font-size: 14px;
            color: var(--accent-yellow);
            font-weight: 600;
            opacity: 0.8;
            margin-top: 5px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }

        /* Bottom HUD */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .speed-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .speed-label {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--accent-magenta);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .speed-meter {
            width: 120px;
            height: 2px;
            background: rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }

        .speed-fill {
            height: 100%;
            background: var(--accent-magenta);
            width: 10%;
            box-shadow: 0 0 15px var(--accent-magenta);
            transition: width 0.1s linear;
        }

        /* Screens */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            background: rgba(5, 5, 5, 0.4);
            backdrop-filter: blur(4px);
            opacity: 1;
            transition: opacity 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .title-block {
            text-align: center;
            margin-bottom: 60px;
        }

        .title {
            font-size: 80px;
            font-weight: 900;
            letter-spacing: -5px;
            line-height: 1;
            margin: 0;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 10px 40px rgba(0,0,0,0.5);
            filter: drop-shadow(0 0 0px rgba(255,255,255,0));
            animation: glitch 5s infinite;
        }

        .subtitle {
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--accent-cyan);
            letter-spacing: 6px;
            margin-top: 20px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .instruction {
            display: flex;
            align-items: center;
            gap: 20px;
            color: var(--text-dim);
            font-size: 12px;
            letter-spacing: 4px;
            font-weight: 600;
            animation: breathe 3s infinite ease-in-out;
        }

        .key {
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 24px;
            border-radius: 2px;
            color: var(--text-main);
            background: rgba(255,255,255,0.05);
            font-weight: 700;
            font-family: var(--font-mono);
            box-shadow: 0 4px 0 rgba(0,0,0,0.3), 0 0 20px rgba(0,0,0,0.2);
            font-size: 14px;
            backdrop-filter: blur(4px);
        }

        .game-over-card {
            background: rgba(10, 10, 15, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 60px 100px;
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .game-over-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-magenta), transparent);
        }

        .error-code {
            color: var(--accent-magenta);
            font-family: var(--font-mono);
            font-size: 14px;
            letter-spacing: 3px;
            font-weight: 700;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
        }

        .final-score {
            font-size: 64px;
            font-weight: 800;
            color: var(--text-main);
            margin: 10px 0 40px 0;
            font-family: var(--font-mono);
            letter-spacing: -2px;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.5; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(4px); }
        }

        @keyframes slideUp {
            from { transform: translateY(40px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="vignette"></div>

    <div class="game-viewport">
        <!-- HUD -->
        <div class="ui-layer">
            <div class="top-bar">
                <div class="brand">
                    <div class="brand-line"></div>
                    <span>NEO-RUNNER</span>
                </div>
                <div class="score-group">
                    <div class="score-val" id="score">00000</div>
                    <div class="hi-score">HI <span id="highScore">00000</span></div>
                </div>
            </div>

            <div class="bottom-bar">
                <div class="speed-container">
                    <span class="speed-label">Velocity</span>
                    <div class="speed-meter">
                        <div class="speed-fill" id="speedBar"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Start Screen -->
        <div class="overlay" id="startScreen">
            <div class="title-block">
                <h1 class="title">Neo-Runner</h1>
                <div class="subtitle">System Reboot Required</div>
            </div>
            <div class="instruction">
                <span>PRESS</span>
                <span class="key">SPACE</span>
                <span>TO JUMP</span>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div class="overlay hidden" id="gameOverScreen">
            <div class="game-over-card">
                <div class="error-code">CRITICAL FAILURE</div>
                <div style="color: var(--text-dim); font-size: 12px; letter-spacing: 2px;">FINAL DISTANCE</div>
                <div class="final-score" id="finalScore">00000</div>
                <div class="instruction" style="margin-top: 0;">
                    <span class="key">SPACE</span>
                    <span>TO REBOOT</span>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

<script>
    /**
     * NEO-RUNNER ENGINE v4.0
     * Design Focus: High contrast silhouettes, deep depth, refined physics.
     */

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    // DOM Elements
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const finalScoreEl = document.getElementById('finalScore');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const speedBar = document.getElementById('speedBar');

    // Configuration
    let GAME_WIDTH = 1024;
    let GAME_HEIGHT = 600;
    const GROUND_Y = 500;
    const GRAVITY = 0.6;
    const JUMP_FORCE = -14;
    
    // State
    let gameRunning = false;
    let gameOver = false;
    let frame = 0;
    let score = 0;
    let highScore = localStorage.getItem('neo_runner_hs_v4') || 0;
    let speed = 10;
    let baseSpeed = 10;
    let maxSpeed = 26;

    // Resize & Scale
    function resize() {
        const container = canvas.parentElement;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = container.clientWidth * dpr;
        canvas.height = container.clientHeight * dpr;
        ctx.scale(dpr, dpr);
        GAME_WIDTH = container.clientWidth;
        GAME_HEIGHT = container.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();
    highScoreEl.innerText = Math.floor(highScore).toString().padStart(5, '0');

    // --- CLASSES ---

    class Dino {
        constructor() {
            this.w = 50;
            this.h = 50;
            this.x = 100;
            this.y = GROUND_Y - this.h;
            this.dy = 0;
            this.grounded = true;
            this.runFrame = 0;
            this.rotation = 0;
        }

        jump() {
            if (this.grounded) {
                this.dy = JUMP_FORCE;
                this.grounded = false;
                this.rotation = -0.15;
                createDust(this.x + this.w/2, this.y + this.h);
            }
        }

        update() {
            this.dy += GRAVITY;
            this.y += this.dy;

            if (this.y + this.h > GROUND_Y) {
                if (!this.grounded) {
                    createDust(this.x + this.w/2, this.y + this.h);
                    this.rotation = 0.1;
                }
                this.y = GROUND_Y - this.h;
                this.dy = 0;
                this.grounded = true;
                this.rotation = 0;
            } else {
                this.grounded = false;
                this.rotation = this.dy < 0 ? -0.2 : 0.2;
            }

            if (this.grounded) {
                this.runFrame += 0.25 * (speed / baseSpeed);
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x + this.w/2, this.y + this.h/2);
            ctx.rotate(this.rotation);
            ctx.translate(-(this.x + this.w/2), -(this.y + this.h/2));

            // Silhouette - Solid White for max contrast
            ctx.fillStyle = '#ffffff';
            
            // Head & Body
            ctx.beginPath();
            ctx.moveTo(this.x + 10, this.y + 40); // Hip
            ctx.lineTo(this.x + 15, this.y + 25); // Chest
            ctx.lineTo(this.x + 25, this.y + 15); // Neck
            ctx.lineTo(this.x + 45, this.y + 10); // Snout
            ctx.lineTo(this.x + 45, this.y + 5);  // Top Head
            ctx.lineTo(this.x + 25, this.y + 5);  // Back Head
            ctx.lineTo(this.x + 5, this.y + 20);  // Back
            ctx.lineTo(this.x - 5, this.y + 35);  // Tail
            ctx.closePath();
            ctx.fill();

            // Eye
            ctx.fillStyle = '#000';
            ctx.fillRect(this.x + 35, this.y + 12, 5, 5);
            ctx.fillStyle = '#00f0ff';
            ctx.fillRect(this.x + 37, this.y + 14, 2, 2);

            // Legs
            ctx.fillStyle = '#ffffff';
            if (this.grounded) {
                const legOffset = Math.sin(this.runFrame) * 10;
                // Leg 1
                ctx.beginPath();
                ctx.moveTo(this.x + 10, this.y + 45);
                ctx.lineTo(this.x + 5 + legOffset, this.y + 60);
                ctx.lineTo(this.x + 15 + legOffset, this.y + 60);
                ctx.fill();
                // Leg 2
                ctx.beginPath();
                ctx.moveTo(this.x + 25, this.y + 45);
                ctx.lineTo(this.x + 20 - legOffset, this.y + 60);
                ctx.lineTo(this.x + 30 - legOffset, this.y + 60);
                ctx.fill();
            } else {
                // Tucked
                ctx.fillRect(this.x + 10, this.y + 45, 10, 10);
                ctx.fillRect(this.x + 25, this.y + 40, 10, 10);
            }
            
            // Tech Core Glow
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00f0ff';
            ctx.fillStyle = '#00f0ff';
            ctx.beginPath();
            ctx.arc(this.x + 18, this.y + 30, 2, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type;
            this.x = GAME_WIDTH + 50;
            this.markedForDeletion = false;
            
            if (type === 'cactus') {
                this.w = 25;
                this.h = 45;
                this.y = GROUND_Y - this.h;
                this.variant = Math.random();
            } else {
                // Drone
                this.w = 40;
                this.h = 25;
                const heights = [GROUND_Y - 50, GROUND_Y - 100];
                this.y = heights[Math.floor(Math.random() * heights.length)];
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= speed;
            if (this.x + this.w < -100) this.markedForDeletion = true;
            if (this.type === 'drone') this.wingFrame += 0.3;
        }

        draw() {
            ctx.save();
            
            if (this.type === 'cactus') {
                // Minimalist Geometric Cactus
                ctx.fillStyle = '#ff0055';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff0055';
                
                // Stem
                ctx.fillRect(this.x + 8, this.y, 9, this.h);
                
                // Arm
                if (this.variant > 0.5) {
                    ctx.fillRect(this.x, this.y + 15, 8, 4);
                    ctx.fillRect(this.x, this.y + 5, 4, 14);
                } else {
                    ctx.fillRect(this.x + 17, this.y + 20, 8, 4);
                    ctx.fillRect(this.x + 21, this.y + 10, 4, 14);
                }
                
                ctx.shadowBlur = 0;
                // Detail
                ctx.fillStyle = '#000';
                ctx.globalAlpha = 0.4;
                ctx.fillRect(this.x + 10, this.y + 5, 5, this.h - 10);
                ctx.globalAlpha = 1.0;

            } else {
                // Drone
                ctx.translate(this.x, this.y);
                ctx.fillStyle = '#ffcc00';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ffcc00';

                // Body
                ctx.beginPath();
                ctx.moveTo(0, 12);
                ctx.lineTo(20, 2);
                ctx.lineTo(40, 12);
                ctx.lineTo(20, 22);
                ctx.fill();

                // Wings
                const wingY = Math.sin(this.wingFrame) * 10;
                ctx.fillStyle = 'rgba(255, 204, 0, 0.4)';
                ctx.beginPath();
                ctx.moveTo(15, 12);
                ctx.lineTo(25, 12 - wingY - 15);
                ctx.lineTo(35, 12);
                ctx.fill();

                ctx.shadowBlur = 0;
            }
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, type) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 3 + 1;
            this.speedX = (Math.random() - 0.5) * 5;
            this.speedY = (Math.random() - 0.5) * 5;
            this.life = 1.0;
            this.type = type;
            this.color = type === 'dust' ? '#ffffff' : '#ff0055';
        }
        update() {
            this.x -= speed * 0.4;
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.04;
            this.size *= 0.92;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    // --- GAME LOGIC ---

    const dino = new Dino();
    let obstacles = [];
    let particles = [];
    let obstacleTimer = 0;

    function createDust(x, y) {
        for(let i=0; i<5; i++) particles.push(new Particle(x, y, 'dust'));
    }

    function createExplosion(x, y) {
        for(let i=0; i<40; i++) particles.push(new Particle(x, y, 'spark'));
    }

    function resetGame() {
        dino.y = GROUND_Y - dino.h;
        dino.dy = 0;
        obstacles = [];
        particles = [];
        score = 0;
        speed = baseSpeed;
        gameOver = false;
        gameRunning = true;
        obstacleTimer = 0;
        
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        
        animate();
    }

    function spawnObstacle() {
        const type = Math.random() > 0.6 ? 'drone' : 'cactus';
        obstacles.push(new Obstacle(type));
    }

    function checkCollision(r1, r2) {
        return (
            r1.x < r2.x + r2.w - 5 &&
            r1.x + r1.w > r2.x + 5 &&
            r1.y < r2.y + r2.h - 5 &&
            r1.y + r1.h > r2.y + 5
        );
    }

    function drawBackground() {
        // Deep Sky
        const gradient = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
        gradient.addColorStop(0, '#020204');
        gradient.addColorStop(1, '#1a1c29');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // Distant Mountains (Slow Parallax)
        ctx.fillStyle = '#0d0e15';
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        let x = 0;
        while(x < GAME_WIDTH + 100) {
            const h = 80 + Math.sin(x * 0.005 + frame * 0.001) * 50 + Math.cos(x * 0.01) * 25;
            ctx.lineTo(x, GROUND_Y - h);
            x += 40;
        }
        ctx.lineTo(GAME_WIDTH, GROUND_Y);
        ctx.fill();

        // Mid Terrain (Medium Parallax)
        ctx.fillStyle = '#08090d';
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        x = 0;
        while(x < GAME_WIDTH + 100) {
            const h = 30 + Math.sin(x * 0.02 + frame * 0.02) * 15;
            ctx.lineTo(x, GROUND_Y - h);
            x += 30;
        }
        ctx.lineTo(GAME_WIDTH, GROUND_Y);
        ctx.fill();
    }

    function drawGround() {
        // Ground Plane
        ctx.fillStyle = '#050508';
        ctx.fillRect(0, GROUND_Y, GAME_WIDTH, GAME_HEIGHT - GROUND_Y);

        // Horizon Line (Cyan)
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(GAME_WIDTH, GROUND_Y);
        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 2;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00f0ff';
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Moving Grid
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.15)';
        ctx.lineWidth = 1;
        
        // Vertical Perspective Lines
        const dashOffset = (frame * speed) % 100;
        for(let i = -1; i < GAME_WIDTH / 100 + 2; i++) {
            const x = (i * 100) - dashOffset;
            ctx.beginPath();
            ctx.moveTo(x, GROUND_Y);
            ctx.lineTo(x - 60, GAME_HEIGHT); 
            ctx.stroke();
        }

        // Horizontal Lines
        for(let i = 0; i < 8; i++) {
            const y = GROUND_Y + (i * 40) + (frame * speed * (0.1 + i*0.05)) % 40;
            if (y > GAME_HEIGHT) continue;
            
            const alpha = 0.2 - (i * 0.02);
            if (alpha <= 0) continue;
            
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(GAME_WIDTH, y);
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }
    }

    function animate() {
        if (!gameRunning) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        drawBackground();
        drawGround();

        // Logic
        frame++;
        speed += 0.005;
        if(speed > maxSpeed) speed = maxSpeed;
        
        score += speed * 0.05;
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
        
        // Speed UI
        const speedPct = Math.min(((speed - baseSpeed) / (maxSpeed - baseSpeed)) * 100, 100);
        speedBar.style.width = `${Math.max(5, speedPct)}%`;

        // Obstacles
        obstacleTimer++;
        const currentInterval = Math.max(45, 100 - (speed * 2.5));
        if (obstacleTimer > currentInterval + Math.random() * 40) {
            spawnObstacle();
            obstacleTimer = 0;
        }

        obstacles.forEach((obs, i) => {
            obs.update();
            obs.draw();
            
            const dinoHitbox = {x: dino.x + 5, y: dino.y + 5, w: dino.w - 10, h: dino.h - 10};
            const obsHitbox = {x: obs.x + 2, y: obs.y + 2, w: obs.w - 4, h: obs.h - 4};

            if (checkCollision(dinoHitbox, obsHitbox)) {
                gameOver = true;
                gameRunning = false;
                createExplosion(dino.x + dino.w/2, dino.y + dino.h/2);
                
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('neo_runner_hs_v4', highScore);
                    highScoreEl.innerText = Math.floor(highScore).toString().padStart(5, '0');
                }
                
                finalScoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
                gameOverScreen.classList.remove('hidden');
            }

            if (obs.markedForDeletion) obstacles.splice(i, 1);
        });

        // Particles
        particles.forEach((p, i) => {
            p.update();
            p.draw();
            if (p.life <= 0) particles.splice(i, 1);
        });

        // Dino
        dino.update();
        dino.draw();

        if (gameRunning) requestAnimationFrame(animate);
    }

    // --- INPUTS ---

    function handleInput(e) {
        if ((e.code === 'Space' || e.code === 'ArrowUp') && !e.repeat) {
            e.preventDefault();
            if (!gameRunning && !gameOver) resetGame();
            else if (gameOver) resetGame();
            else dino.jump();
        }
    }

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!gameRunning && !gameOver) resetGame();
        else if (gameOver) resetGame();
        else dino.jump();
    }, {passive: false});

    window.addEventListener('keydown', handleInput);

    // Initial Draw
    drawBackground();
    drawGround();
    dino.draw();

</script>
</body>
</html>
