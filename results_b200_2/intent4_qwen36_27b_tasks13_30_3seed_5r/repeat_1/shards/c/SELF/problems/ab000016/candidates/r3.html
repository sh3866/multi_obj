<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEO-RUNNER // V3.0</title>
    <style>
        :root {
            --bg-deep: #020204;
            --bg-panel: #0a0a0f;
            --accent-cyan: #00f0ff;
            --accent-magenta: #ff0055;
            --accent-yellow: #ffcc00;
            --text-main: #ffffff;
            --text-dim: #586275;
            --font-mono: 'SF Mono', 'Fira Code', 'Consolas', 'Courier New', monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-sans);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CRT & Atmosphere */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 40%, #000000 100%);
            pointer-events: none;
            z-index: 50;
        }

        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 1px, rgba(0,0,0,0.1) 1px, rgba(0,0,0,0.1) 2px);
            background-size: 100% 2px;
            pointer-events: none;
            z-index: 40;
            opacity: 0.4;
        }

        /* Main Viewport */
        .game-viewport {
            position: relative;
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 16/9;
            background: var(--bg-panel);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05), 0 50px 100px -20px rgba(0,0,0,0.9);
            overflow: hidden;
            border-radius: 4px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay Layer */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            z-index: 10;
        }

        /* Top HUD */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            mix-blend-mode: screen;
        }

        .brand {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 700;
            color: var(--text-dim);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-cyan);
            animation: pulse 2s infinite;
        }

        .score-group {
            text-align: right;
            font-family: var(--font-mono);
        }

        .score-val {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -2px;
            color: var(--text-main);
            line-height: 1;
            text-shadow: 0 0 20px rgba(255,255,255,0.15);
            font-variant-numeric: tabular-nums;
        }

        .hi-score {
            font-size: 13px;
            color: var(--accent-yellow);
            font-weight: 600;
            opacity: 0.7;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* Bottom HUD */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .speed-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .speed-label {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--accent-magenta);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .speed-meter {
            width: 100px;
            height: 4px;
            background: rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }

        .speed-fill {
            height: 100%;
            background: var(--accent-magenta);
            width: 10%;
            box-shadow: 0 0 15px var(--accent-magenta);
            transition: width 0.1s linear;
        }

        /* Screens */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            background: rgba(2, 2, 4, 0.6);
            backdrop-filter: blur(8px);
            opacity: 1;
            transition: opacity 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .title-block {
            text-align: center;
            margin-bottom: 40px;
        }

        .title {
            font-size: 72px;
            font-weight: 900;
            letter-spacing: -4px;
            line-height: 1;
            margin: 0;
            background: linear-gradient(180deg, #fff 0%, #888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            filter: drop-shadow(0 0 30px rgba(255,255,255,0.2));
        }

        .subtitle {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--accent-cyan);
            letter-spacing: 4px;
            margin-top: 16px;
            text-transform: uppercase;
        }

        .instruction {
            display: flex;
            align-items: center;
            gap: 16px;
            color: var(--text-dim);
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: 500;
            animation: breathe 3s infinite ease-in-out;
        }

        .key {
            border: 1px solid rgba(255,255,255,0.15);
            padding: 10px 20px;
            border-radius: 4px;
            color: var(--text-main);
            background: rgba(255,255,255,0.02);
            font-weight: 700;
            font-family: var(--font-mono);
            box-shadow: 0 4px 0 rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
            font-size: 14px;
        }

        .game-over-card {
            background: rgba(10, 10, 15, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px 80px;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .error-code {
            color: var(--accent-magenta);
            font-family: var(--font-mono);
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
        }

        .final-score {
            font-size: 56px;
            font-weight: 800;
            color: var(--text-main);
            margin: 15px 0 35px 0;
            font-family: var(--font-mono);
            letter-spacing: -2px;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.6; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(3px); }
        }

        @keyframes slideUp {
            from { transform: translateY(30px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

    </style>
</head>
<body>

    <div class="vignette"></div>

    <div class="game-viewport">
        <div class="scanlines"></div>
        
        <!-- HUD -->
        <div class="ui-layer">
            <div class="top-bar">
                <div class="brand">
                    <div class="brand-dot"></div>
                    <span>NEO-RUNNER</span>
                </div>
                <div class="score-group">
                    <div class="score-val" id="score">00000</div>
                    <div class="hi-score">HI <span id="highScore">00000</span></div>
                </div>
            </div>

            <div class="bottom-bar">
                <div class="speed-container">
                    <span class="speed-label">Velocity</span>
                    <div class="speed-meter">
                        <div class="speed-fill" id="speedBar"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Start Screen -->
        <div class="overlay" id="startScreen">
            <div class="title-block">
                <h1 class="title">Neo-Runner</h1>
                <div class="subtitle">System Reboot Required</div>
            </div>
            <div class="instruction">
                <span>PRESS</span>
                <span class="key">SPACE</span>
                <span>TO JUMP</span>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div class="overlay hidden" id="gameOverScreen">
            <div class="game-over-card">
                <div class="error-code">CRITICAL FAILURE</div>
                <div style="color: var(--text-dim); font-size: 12px; letter-spacing: 1px;">FINAL DISTANCE</div>
                <div class="final-score" id="finalScore">00000</div>
                <div class="instruction" style="margin-top: 0;">
                    <span class="key">SPACE</span>
                    <span>TO REBOOT</span>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

<script>
    /**
     * NEO-RUNNER ENGINE v3.0
     * Visual Upgrade: Higher fidelity silhouettes, better parallax, improved particle physics.
     */

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    // DOM Elements
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const finalScoreEl = document.getElementById('finalScore');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const speedBar = document.getElementById('speedBar');

    // Configuration
    let GAME_WIDTH = 1024;
    let GAME_HEIGHT = 576;
    const GROUND_Y = 450;
    const GRAVITY = 0.7;
    const JUMP_FORCE = -15;
    
    // State
    let gameRunning = false;
    let gameOver = false;
    let frame = 0;
    let score = 0;
    let highScore = localStorage.getItem('neo_runner_hs_v3') || 0;
    let speed = 9;
    let baseSpeed = 9;
    let maxSpeed = 24;
    let bgOffset = 0;

    // Resize & Scale
    function resize() {
        const container = canvas.parentElement;
        const dpr = Math.min(window.devicePixelRatio || 1, 2); // Cap DPR for performance
        canvas.width = container.clientWidth * dpr;
        canvas.height = container.clientHeight * dpr;
        ctx.scale(dpr, dpr);
        GAME_WIDTH = container.clientWidth;
        GAME_HEIGHT = container.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();
    highScoreEl.innerText = Math.floor(highScore).toString().padStart(5, '0');

    // --- CLASSES ---

    class Dino {
        constructor() {
            this.w = 60;
            this.h = 60;
            this.x = 100;
            this.y = GROUND_Y - this.h;
            this.dy = 0;
            this.grounded = true;
            this.runFrame = 0;
            this.rotation = 0;
        }

        jump() {
            if (this.grounded) {
                this.dy = JUMP_FORCE;
                this.grounded = false;
                this.rotation = -0.15;
                createDust(this.x + this.w/2, this.y + this.h);
            }
        }

        update() {
            this.dy += GRAVITY;
            this.y += this.dy;

            if (this.y + this.h > GROUND_Y) {
                if (!this.grounded) {
                    createDust(this.x + this.w/2, this.y + this.h);
                    this.rotation = 0.1;
                }
                this.y = GROUND_Y - this.h;
                this.dy = 0;
                this.grounded = true;
                this.rotation = 0;
            } else {
                this.grounded = false;
                this.rotation = this.dy < 0 ? -0.2 : 0.2;
            }

            if (this.grounded) {
                this.runFrame += 0.3 * (speed / baseSpeed);
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x + this.w/2, this.y + this.h/2);
            ctx.rotate(this.rotation);
            ctx.translate(-(this.x + this.w/2), -(this.y + this.h/2));

            // Silhouette
            ctx.fillStyle = '#ffffff';
            
            // Organic shape using bezier curves
            ctx.beginPath();
            // Tail
            ctx.moveTo(this.x - 5, this.y + 30);
            ctx.quadraticCurveTo(this.x + 10, this.y + 20, this.x + 15, this.y + 25);
            // Head
            ctx.lineTo(this.x + 20, this.y + 5);
            ctx.lineTo(this.x + 50, this.y); // Snout
            ctx.lineTo(this.x + 55, this.y + 15); // Jaw
            ctx.lineTo(this.x + 35, this.y + 25); // Neck
            // Body
            ctx.lineTo(this.x + 15, this.y + 40);
            ctx.lineTo(this.x + 5, this.y + 55); // Back
            ctx.closePath();
            ctx.fill();

            // Eye (Cyber aesthetic)
            ctx.fillStyle = '#000';
            ctx.fillRect(this.x + 40, this.y + 8, 6, 6);
            ctx.fillStyle = '#00f0ff'; // Glowing eye
            ctx.fillRect(this.x + 42, this.y + 10, 2, 2);

            // Legs
            ctx.fillStyle = '#ffffff';
            if (this.grounded) {
                const legOffset = Math.sin(this.runFrame) * 12;
                // Leg 1
                ctx.beginPath();
                ctx.moveTo(this.x + 10, this.y + 50);
                ctx.lineTo(this.x + 5 + legOffset, this.y + 60);
                ctx.lineTo(this.x + 15 + legOffset, this.y + 60);
                ctx.fill();
                // Leg 2
                ctx.beginPath();
                ctx.moveTo(this.x + 25, this.y + 50);
                ctx.lineTo(this.x + 20 - legOffset, this.y + 60);
                ctx.lineTo(this.x + 30 - legOffset, this.y + 60);
                ctx.fill();
            } else {
                // Tucked legs
                ctx.fillRect(this.x + 10, this.y + 45, 10, 10);
                ctx.fillRect(this.x + 25, this.y + 40, 10, 10);
            }

            // Tech Core (Chest)
            ctx.fillStyle = 'var(--accent-cyan)';
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'var(--accent-cyan)';
            ctx.beginPath();
            ctx.arc(this.x + 20, this.y + 35, 3, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type;
            this.x = GAME_WIDTH + 50;
            this.markedForDeletion = false;
            
            if (type === 'cactus') {
                // Cluster generation
                this.w = 30;
                this.h = 50;
                this.y = GROUND_Y - this.h;
                this.color = '#ff0055';
                this.variant = Math.random(); // For shape variation
            } else {
                // Drone
                this.w = 45;
                this.h = 30;
                const heights = [GROUND_Y - 60, GROUND_Y - 110];
                this.y = heights[Math.floor(Math.random() * heights.length)];
                this.color = '#ffcc00';
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= speed;
            if (this.x + this.w < -100) this.markedForDeletion = true;
            if (this.type === 'drone') this.wingFrame += 0.3;
        }

        draw() {
            ctx.save();
            
            if (this.type === 'cactus') {
                // Cyber-Cactus
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                
                // Main Stem
                ctx.fillRect(this.x + 10, this.y, 10, this.h);
                
                // Arms based on variant
                if (this.variant > 0.5) {
                    // Left arm
                    ctx.fillRect(this.x, this.y + 15, 10, 5);
                    ctx.fillRect(this.x, this.y + 5, 5, 15);
                } else {
                    // Right arm
                    ctx.fillRect(this.x + 20, this.y + 25, 10, 5);
                    ctx.fillRect(this.x + 25, this.y + 15, 5, 15);
                }
                
                ctx.shadowBlur = 0;
                // Inner tech lines
                ctx.fillStyle = '#000';
                ctx.globalAlpha = 0.3;
                ctx.fillRect(this.x + 12, this.y + 5, 6, this.h - 10);
                ctx.globalAlpha = 1.0;

            } else {
                // Drone
                ctx.translate(this.x, this.y);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;

                // Body
                ctx.beginPath();
                ctx.moveTo(0, 15);
                ctx.lineTo(20, 5);
                ctx.lineTo(45, 15);
                ctx.lineTo(20, 25);
                ctx.fill();

                // Wings
                const wingY = Math.sin(this.wingFrame) * 12;
                ctx.fillStyle = 'rgba(255, 204, 0, 0.6)';
                ctx.beginPath();
                ctx.moveTo(15, 15);
                ctx.lineTo(25, 15 - wingY - 15);
                ctx.lineTo(35, 15);
                ctx.fill();

                // Eye
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(10, 15, 4, 0, Math.PI*2);
                ctx.fill();

                ctx.shadowBlur = 0;
            }
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, type) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 4 + 1;
            this.speedX = (Math.random() - 0.5) * 6;
            this.speedY = (Math.random() - 0.5) * 6;
            this.life = 1.0;
            this.type = type;
            this.color = type === 'dust' ? '#fff' : '#ff0055';
        }
        update() {
            this.x -= speed * 0.4; // Move with world
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.04;
            this.size *= 0.95;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    // --- GAME LOGIC ---

    const dino = new Dino();
    let obstacles = [];
    let particles = [];
    let obstacleTimer = 0;

    function createDust(x, y) {
        for(let i=0; i<6; i++) particles.push(new Particle(x, y, 'dust'));
    }

    function createExplosion(x, y) {
        for(let i=0; i<30; i++) particles.push(new Particle(x, y, 'spark'));
    }

    function resetGame() {
        dino.y = GROUND_Y - dino.h;
        dino.dy = 0;
        obstacles = [];
        particles = [];
        score = 0;
        speed = baseSpeed;
        gameOver = false;
        gameRunning = true;
        obstacleTimer = 0;
        
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        
        animate();
    }

    function spawnObstacle() {
        const type = Math.random() > 0.7 ? 'drone' : 'cactus';
        obstacles.push(new Obstacle(type));
    }

    function checkCollision(r1, r2) {
        // Tighter hitbox
        return (
            r1.x < r2.x + r2.w - 6 &&
            r1.x + r1.w > r2.x + 6 &&
            r1.y < r2.y + r2.h - 6 &&
            r1.y + r1.h > r2.y + 6
        );
    }

    function drawBackground() {
        // Gradient Sky
        const gradient = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
        gradient.addColorStop(0, '#020204');
        gradient.addColorStop(1, '#12141c');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // Distant Mountains (Parallax Layer 1)
        ctx.fillStyle = '#0d0e15';
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        let x = 0;
        while(x < GAME_WIDTH + 100) {
            const h = 60 + Math.sin(x * 0.005 + frame * 0.002) * 40 + Math.cos(x * 0.01) * 20;
            ctx.lineTo(x, GROUND_Y - h);
            x += 30;
        }
        ctx.lineTo(GAME_WIDTH, GROUND_Y);
        ctx.fill();

        // Closer Terrain (Parallax Layer 2)
        ctx.fillStyle = '#08090d';
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        x = 0;
        while(x < GAME_WIDTH + 100) {
            const h = 20 + Math.sin(x * 0.02 + frame * 0.05) * 10;
            ctx.lineTo(x, GROUND_Y - h);
            x += 20;
        }
        ctx.lineTo(GAME_WIDTH, GROUND_Y);
        ctx.fill();
    }

    function drawGround() {
        // Ground Plane
        ctx.fillStyle = '#050508';
        ctx.fillRect(0, GROUND_Y, GAME_WIDTH, GAME_HEIGHT - GROUND_Y);

        // Top Line (Neon Cyan)
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(GAME_WIDTH, GROUND_Y);
        ctx.strokeStyle = 'var(--accent-cyan)';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 15;
        ctx.shadowColor = 'var(--accent-cyan)';
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Moving Grid Lines
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.1)';
        ctx.lineWidth = 1;
        
        // Vertical moving lines
        const dashOffset = (frame * speed) % 80;
        for(let i = -1; i < GAME_WIDTH / 80 + 2; i++) {
            const x = (i * 80) - dashOffset;
            // Perspective slant
            ctx.beginPath();
            ctx.moveTo(x, GROUND_Y);
            ctx.lineTo(x - 40, GAME_HEIGHT); 
            ctx.stroke();
        }

        // Horizontal moving lines
        for(let i = 0; i < 6; i++) {
            const y = GROUND_Y + (i * 35) + (frame * speed * (0.1 + i*0.05)) % 35;
            if (y > GAME_HEIGHT) continue;
            
            const alpha = 0.15 - (i * 0.02);
            if (alpha <= 0) continue;
            
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(GAME_WIDTH, y);
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }
    }

    function animate() {
        if (!gameRunning) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        drawBackground();
        drawGround();

        // Logic
        frame++;
        speed += 0.008;
        if(speed > maxSpeed) speed = maxSpeed;
        
        score += speed * 0.05;
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
        
        // Speed UI
        const speedPct = Math.min(((speed - baseSpeed) / (maxSpeed - baseSpeed)) * 100, 100);
        speedBar.style.width = `${Math.max(5, speedPct)}%`;

        // Obstacles
        obstacleTimer++;
        const currentInterval = Math.max(40, 90 - (speed * 2));
        if (obstacleTimer > currentInterval + Math.random() * 30) {
            spawnObstacle();
            obstacleTimer = 0;
        }

        obstacles.forEach((obs, i) => {
            obs.update();
            obs.draw();
            
            // Collision
            const dinoHitbox = {x: dino.x + 5, y: dino.y + 5, w: dino.w - 10, h: dino.h - 10};
            const obsHitbox = {x: obs.x + 2, y: obs.y + 2, w: obs.w - 4, h: obs.h - 4};

            if (checkCollision(dinoHitbox, obsHitbox)) {
                gameOver = true;
                gameRunning = false;
                createExplosion(dino.x + dino.w/2, dino.y + dino.h/2);
                
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('neo_runner_hs_v3', highScore);
                    highScoreEl.innerText = Math.floor(highScore).toString().padStart(5, '0');
                }
                
                finalScoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
                gameOverScreen.classList.remove('hidden');
            }

            if (obs.markedForDeletion) obstacles.splice(i, 1);
        });

        // Particles
        particles.forEach((p, i) => {
            p.update();
            p.draw();
            if (p.life <= 0) particles.splice(i, 1);
        });

        // Dino
        dino.update();
        dino.draw();

        if (gameRunning) requestAnimationFrame(animate);
    }

    // --- INPUTS ---

    function handleInput(e) {
        if ((e.code === 'Space' || e.code === 'ArrowUp') && !e.repeat) {
            e.preventDefault();
            if (!gameRunning && !gameOver) resetGame();
            else if (gameOver) resetGame();
            else dino.jump();
        }
    }

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!gameRunning && !gameOver) resetGame();
        else if (gameOver) resetGame();
        else dino.jump();
    }, {passive: false});

    window.addEventListener('keydown', handleInput);

    // Initial Draw
    drawBackground();
    drawGround();
    dino.draw();

</script>
</body>
</html>
