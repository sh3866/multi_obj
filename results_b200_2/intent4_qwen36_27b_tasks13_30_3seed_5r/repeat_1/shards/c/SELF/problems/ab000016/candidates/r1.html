<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-RUNNER // SYSTEM ONLINE</title>
    <style>
        :root {
            --bg-dark: #0a0b10;
            --bg-panel: rgba(20, 22, 30, 0.95);
            --accent-cyan: #00f3ff;
            --accent-pink: #ff0055;
            --accent-yellow: #ffcc00;
            --text-main: #f0f0f5;
            --text-dim: #5e6673;
            --font-ui: 'Courier New', Courier, monospace;
            --font-display: system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* Ambient Background */
        .ambient-bg {
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 50% 50%, #1a1d2b 0%, #050508 70%);
            z-index: -2;
        }

        /* Retro Grid Floor */
        .grid-floor {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 50%;
            background-image: 
                linear-gradient(transparent 0%, rgba(0, 243, 255, 0.1) 100%),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            transform: perspective(400px) rotateX(60deg) translateY(100px);
            transform-origin: bottom;
            animation: gridScroll 2s linear infinite;
            z-index: -1;
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 80%);
        }

        @keyframes gridScroll {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 0 40px, 0 40px; }
        }

        /* Main Game Container */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 960px;
            aspect-ratio: 16/9;
            background: var(--bg-panel);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 0 0 1px rgba(0,0,0,0.5),
                0 20px 60px rgba(0,0,0,0.6),
                0 0 100px rgba(0, 243, 255, 0.05);
            overflow: hidden;
            z-index: 10;
            backdrop-filter: blur(10px);
            border-radius: 4px;
        }

        /* HUD Layer */
        .hud {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 20;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .status-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .label {
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 2px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .value {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--text-main);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        .score-block {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .score-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        .score-val {
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
        }

        .high-score {
            font-size: 14px;
            color: var(--accent-yellow);
            opacity: 0.8;
            font-weight: 600;
        }

        /* Speed Meter */
        .speed-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 140px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .speed-bar-bg {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .speed-bar-fill {
            height: 100%;
            width: 10%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
            box-shadow: 0 0 10px var(--accent-cyan);
            transition: width 0.1s linear;
        }

        /* Canvas */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Overlays */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            background: rgba(10, 11, 16, 0.6);
            backdrop-filter: blur(2px);
            transition: opacity 0.3s;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .title-logo {
            font-family: var(--font-display);
            font-size: 48px;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 20px;
            background: linear-gradient(to bottom, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(0, 243, 255, 0.3));
        }

        .prompt {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: var(--text-dim);
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: pulse 2s infinite ease-in-out;
        }

        .key {
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.05);
            padding: 6px 12px;
            border-radius: 4px;
            color: var(--text-main);
            font-weight: bold;
            box-shadow: 0 2px 0 rgba(0,0,0,0.5);
        }

        .game-over-content {
            text-align: center;
            background: rgba(10, 11, 16, 0.9);
            padding: 40px 60px;
            border: 1px solid rgba(255, 0, 85, 0.3);
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.1);
            transform: scale(1);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .error-code {
            color: var(--accent-pink);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .final-score {
            font-size: 42px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 30px;
        }

        /* Scanlines */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 40;
            opacity: 0.4;
        }

        /* CRT Flicker */
        .crt-flicker {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.02);
            pointer-events: none;
            z-index: 41;
            animation: flicker 0.15s infinite;
            opacity: 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes flicker {
            0% { opacity: 0.02; }
            5% { opacity: 0.05; }
            10% { opacity: 0.02; }
            100% { opacity: 0.02; }
        }

    </style>
</head>
<body>

    <div class="ambient-bg"></div>
    <div class="grid-floor"></div>

    <div class="game-container">
        <div class="scanlines"></div>
        <div class="crt-flicker"></div>
        
        <div class="hud">
            <div class="hud-top">
                <div class="status-block">
                    <span class="label">System Status</span>
                    <span class="value" style="color: var(--accent-cyan); text-shadow: 0 0 10px var(--accent-cyan);">RUNNING</span>
                </div>
                <div class="status-block score-block">
                    <span class="label">Distance</span>
                    <div class="score-row">
                        <span class="value score-val" id="score">00000</span>
                        <span class="high-score">HI: <span id="highScore">00000</span></span>
                    </div>
                </div>
            </div>

            <div class="speed-container">
                <span class="label" style="color: var(--accent-pink);">Velocity</span>
                <div class="speed-bar-bg">
                    <div class="speed-bar-fill" id="speedBar"></div>
                </div>
            </div>
        </div>

        <div class="overlay" id="startScreen">
            <div class="title-logo">NEO-RUNNER</div>
            <div class="prompt">
                <span>Press</span>
                <span class="key">SPACE</span>
                <span>or</span>
                <span class="key">TAP</span>
                <span>to Jump</span>
            </div>
        </div>

        <div class="overlay hidden" id="gameOverScreen">
            <div class="game-over-content">
                <div class="error-code">CRITICAL FAILURE</div>
                <div class="label" style="margin-bottom: 10px;">Final Distance</div>
                <div class="final-score" id="finalScore">00000</div>
                <div class="prompt" style="justify-content: center;">
                    <span>Press</span>
                    <span class="key">SPACE</span>
                    <span>to Reboot</span>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

<script>
    /**
     * NEO-RUNNER ENGINE
     * High-performance Canvas rendering with procedural geometry
     */

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for no transparency on base
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const finalScoreEl = document.getElementById('finalScore');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const speedBar = document.getElementById('speedBar');

    // Configuration
    let GAME_WIDTH = 960;
    let GAME_HEIGHT = 540;
    const GRAVITY = 0.6;
    const JUMP_FORCE = -13;
    const GROUND_Y = 420;
    
    // State
    let gameRunning = false;
    let gameOver = false;
    let frame = 0;
    let score = 0;
    let highScore = localStorage.getItem('neo_runner_hs') || 0;
    let speed = 8;
    let baseSpeed = 8;
    let maxSpeed = 20;
    
    // Resize Logic
    function resize() {
        const container = canvas.parentElement;
        // Use devicePixelRatio for crispness on retina
        const dpr = window.devicePixelRatio || 1;
        canvas.width = container.clientWidth * dpr;
        canvas.height = container.clientHeight * dpr;
        
        // Normalize coordinate system
        ctx.scale(dpr, dpr);
        
        GAME_WIDTH = container.clientWidth;
        GAME_HEIGHT = container.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();
    highScoreEl.innerText = Math.floor(highScore).toString().padStart(5, '0');

    // --- ASSETS & ENTITIES ---

    // Background Layer Class for Parallax
    class Layer {
        constructor(speedRatio, yOffset, color, complexity) {
            this.speedRatio = speedRatio;
            this.yOffset = yOffset;
            this.color = color;
            this.x = 0;
            this.complexity = complexity;
            this.points = [];
            this.generatePoints();
        }

        generatePoints() {
            // Generate a jagged skyline
            let x = 0;
            while(x < GAME_WIDTH * 2) {
                const width = 50 + Math.random() * 150;
                const height = Math.random() * this.complexity;
                this.points.push({x: x, w: width, h: height});
                x += width - 20; // Overlap
            }
        }

        update() {
            this.x -= speed * this.speedRatio;
            if (this.x <= -GAME_WIDTH) this.x = 0;
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.moveTo(0, GAME_HEIGHT);
            
            // Draw two sets for seamless loop
            for(let set=0; set<2; set++) {
                const offsetX = this.x + (set * GAME_WIDTH);
                this.points.forEach(p => {
                    ctx.rect(p.x + offsetX, GROUND_Y - this.yOffset - p.h, p.w, p.h + this.yOffset);
                });
            }
            ctx.fill();
        }
    }

    class Dino {
        constructor() {
            this.w = 50;
            this.h = 50;
            this.x = 80;
            this.y = GROUND_Y - this.h;
            this.dy = 0;
            this.grounded = true;
            this.runFrame = 0;
            this.color = '#f0f0f5';
            this.rotation = 0;
        }

        jump() {
            if (this.grounded) {
                this.dy = JUMP_FORCE;
                this.grounded = false;
                this.rotation = -0.2; // Tilt back slightly on jump
                createDust(this.x + this.w/2, this.y + this.h);
            }
        }

        update() {
            this.dy += GRAVITY;
            this.y += this.dy;

            if (this.y + this.h > GROUND_Y) {
                // Landing impact
                if (!this.grounded) {
                    createDust(this.x + this.w/2, this.y + this.h);
                    this.rotation = 0.1; // Tilt forward on land
                }
                this.y = GROUND_Y - this.h;
                this.dy = 0;
                this.grounded = true;
                this.rotation = 0;
            } else {
                this.grounded = false;
                // Rotate up while jumping
                if(this.dy < 0) this.rotation = -0.3;
                else this.rotation = 0.3;
            }

            if (this.grounded) {
                this.runFrame += 0.2 * (speed / baseSpeed);
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x + this.w/2, this.y + this.h/2);
            ctx.rotate(this.rotation);
            ctx.translate(-(this.x + this.w/2), -(this.y + this.h/2));

            // Draw Silhouette Dino
            ctx.fillStyle = this.color;
            
            // Head
            ctx.fillRect(this.x + 20, this.y, 30, 20);
            // Neck
            ctx.fillRect(this.x + 20, this.y + 10, 10, 10);
            // Body
            ctx.fillRect(this.x, this.y + 15, 30, 25);
            // Tail
            ctx.beginPath();
            ctx.moveTo(this.x, this.y + 20);
            ctx.lineTo(this.x - 10, this.y + 15);
            ctx.lineTo(this.x, this.y + 30);
            ctx.fill();

            // Eye (Negative space)
            ctx.fillStyle = '#0a0b10';
            ctx.fillRect(this.x + 35, this.y + 5, 4, 4);

            // Legs (Animated)
            ctx.fillStyle = this.color;
            if (this.grounded) {
                const legOffset = Math.sin(this.runFrame) * 10;
                // Leg 1
                ctx.fillRect(this.x + 5 + legOffset, this.y + 40, 8, 10);
                // Leg 2
                ctx.fillRect(this.x + 20 - legOffset, this.y + 40, 8, 10);
            } else {
                // Tucked legs
                ctx.fillRect(this.x + 5, this.y + 40, 8, 6);
                ctx.fillRect(this.x + 20, this.y + 40, 8, 6);
            }

            // Arm
            ctx.fillRect(this.x + 25, this.y + 20, 12, 4);

            // Tech detail (Glowing core)
            ctx.fillStyle = 'var(--accent-cyan)';
            ctx.fillRect(this.x + 10, this.y + 25, 4, 4);

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type;
            this.x = GAME_WIDTH + Math.random() * 100;
            this.markedForDeletion = false;
            this.passed = false;

            if (type === 'cactus') {
                // Geometric Cactus
                const scale = 0.8 + Math.random() * 0.6;
                this.w = 25 * scale;
                this.h = (40 + Math.random() * 30) * scale;
                this.y = GROUND_Y - this.h;
                this.color = '#ff0055'; // Pink
            } else {
                // Drone/Bird
                this.w = 45;
                this.h = 30;
                const heights = [GROUND_Y - 45, GROUND_Y - 80, GROUND_Y - 110];
                this.y = heights[Math.floor(Math.random() * heights.length)];
                this.color = '#ffcc00'; // Yellow
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= speed;
            if (this.x + this.w < 0) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.25;
        }

        draw() {
            ctx.save();
            
            if (this.type === 'cactus') {
                // Neon Blocky Cactus
                ctx.fillStyle = this.color;
                // Main
                ctx.fillRect(this.x, this.y, this.w, this.h);
                // Arms
                ctx.fillRect(this.x - 8, this.y + 10, 8, 6);
                ctx.fillRect(this.x + this.w, this.y + 20, 8, 6);
                
                // Glow effect
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.strokeRect(this.x, this.y, this.w, this.h);
                ctx.shadowBlur = 0;

            } else {
                // Drone
                ctx.translate(this.x, this.y);
                ctx.fillStyle = this.color;
                
                // Body
                ctx.beginPath();
                ctx.moveTo(0, 15);
                ctx.lineTo(15, 5);
                ctx.lineTo(35, 15);
                ctx.lineTo(15, 25);
                ctx.fill();

                // Wing (Flap)
                const wingY = Math.sin(this.wingFrame) * 15;
                ctx.beginPath();
                ctx.moveTo(15, 15);
                ctx.lineTo(25, 15 - wingY - 10);
                ctx.lineTo(35, 15);
                ctx.fill();

                // Engine glow
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 14, 4, 2);
            }
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, type) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 3 + 2;
            this.speedX = (Math.random() - 0.5) * 4;
            this.speedY = (Math.random() - 0.5) * 4;
            this.life = 1.0;
            this.type = type; // 'dust' or 'spark'
            this.color = type === 'dust' ? 'rgba(255,255,255,0.5)' : '#ff0055';
        }
        update() {
            this.x -= speed * 0.5; // Move with world
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.02;
            this.size *= 0.95;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    // --- GAME LOGIC ---

    const dino = new Dino();
    let obstacles = [];
    let particles = [];
    let bgLayer1 = new Layer(0.1, 0, 'rgba(30, 30, 40, 0.5)', 100);
    let bgLayer2 = new Layer(0.3, 0, 'rgba(20, 20, 30, 0.8)', 60);
    let obstacleTimer = 0;
    let minInterval = 60;

    function createDust(x, y) {
        for(let i=0; i<5; i++) particles.push(new Particle(x, y, 'dust'));
    }

    function createExplosion(x, y) {
        for(let i=0; i<20; i++) particles.push(new Particle(x, y, 'spark'));
    }

    function resetGame() {
        dino.y = GROUND_Y - dino.h;
        dino.dy = 0;
        obstacles = [];
        particles = [];
        score = 0;
        speed = baseSpeed;
        gameOver = false;
        gameRunning = true;
        obstacleTimer = 0;
        
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        
        animate();
    }

    function spawnObstacle() {
        const type = Math.random() > 0.6 ? 'bird' : 'cactus';
        obstacles.push(new Obstacle(type));
    }

    function checkCollision(r1, r2) {
        return (
            r1.x < r2.x + r2.w &&
            r1.x + r1.w > r2.x &&
            r1.y < r2.y + r2.h &&
            r1.y + r1.h > r2.y
        );
    }

    function drawGround() {
        // Ground Line
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(GAME_WIDTH, GROUND_Y);
        ctx.strokeStyle = '#00f3ff';
        ctx.lineWidth = 2;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00f3ff';
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Moving Grid on Ground
        ctx.fillStyle = 'rgba(0, 243, 255, 0.1)';
        const dashOffset = (frame * speed) % 100;
        for(let i = -1; i < GAME_WIDTH / 100 + 1; i++) {
            // Perspective lines
            ctx.beginPath();
            const x = (i * 100) - dashOffset;
            ctx.moveTo(x, GROUND_Y);
            ctx.lineTo(x - 50, GAME_HEIGHT);
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.1)';
            ctx.stroke();
        }
    }

    function animate() {
        if (!gameRunning) return;

        // Clear with slight fade for trails? No, clean clear for crispness.
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Background
        bgLayer1.update(); bgLayer1.draw();
        bgLayer2.update(); bgLayer2.draw();

        // Ground
        drawGround();

        // Logic
        frame++;
        speed += 0.002; // Acceleration
        if(speed > maxSpeed) speed = maxSpeed;
        
        score += speed * 0.05;
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
        
        // Speed UI
        const speedPct = Math.min(((speed - baseSpeed) / (maxSpeed - baseSpeed)) * 100, 100);
        speedBar.style.width = `${Math.max(10, speedPct)}%`;

        // Obstacles
        obstacleTimer++;
        if (obstacleTimer > minInterval + Math.random() * 60) {
            spawnObstacle();
            obstacleTimer = 0;
            minInterval = Math.max(40, 80 - (speed * 2)); // Get faster
        }

        obstacles.forEach((obs, i) => {
            obs.update();
            obs.draw();
            
            // Collision (Hitbox padding)
            const dinoHitbox = {x: dino.x + 10, y: dino.y + 5, w: dino.w - 20, h: dino.h - 10};
            const obsHitbox = {x: obs.x + 5, y: obs.y + 5, w: obs.w - 10, h: obs.h - 10};

            if (checkCollision(dinoHitbox, obsHitbox)) {
                gameOver = true;
                gameRunning = false;
                createExplosion(dino.x + dino.w/2, dino.y + dino.h/2);
                
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('neo_runner_hs', highScore);
                    highScoreEl.innerText = Math.floor(highScore).toString().padStart(5, '0');
                }
                
                finalScoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
                gameOverScreen.classList.remove('hidden');
            }

            if (obs.markedForDeletion) obstacles.splice(i, 1);
        });

        // Particles
        particles.forEach((p, i) => {
            p.update();
            p.draw();
            if (p.life <= 0) particles.splice(i, 1);
        });

        // Dino
        dino.update();
        dino.draw();

        if (gameRunning) requestAnimationFrame(animate);
    }

    // --- INPUTS ---

    function handleInput(e) {
        if ((e.code === 'Space' || e.code === 'ArrowUp') && !e.repeat) {
            e.preventDefault();
            if (!gameRunning && !gameOver) resetGame();
            else if (gameOver) resetGame();
            else dino.jump();
        }
    }

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!gameRunning && !gameOver) resetGame();
        else if (gameOver) resetGame();
        else dino.jump();
    }, {passive: false});

    window.addEventListener('keydown', handleInput);

    // Initial Draw
    bgLayer1.draw();
    bgLayer2.draw();
    drawGround();
    dino.draw();

</script>
</body>
</html>
