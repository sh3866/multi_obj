<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEO-RUNNER // V5.0</title>
    <style>
        :root {
            --bg-deep: #030304;
            --bg-panel: #0b0c10;
            --accent-cyan: #45f3ff;
            --accent-magenta: #ff2a6d;
            --accent-yellow: #f9c80e;
            --text-main: #ffffff;
            --text-dim: #8892b0;
            --font-mono: 'SF Mono', 'Fira Code', 'Consolas', 'Courier New', monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-sans);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Atmosphere - CRT & Vignette */
        .atmosphere {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 50;
            background: 
                radial-gradient(circle at center, transparent 40%, #000000 120%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 100%, 100% 4px, 6px 100%;
            mix-blend-mode: overlay;
        }

        /* Main Viewport */
        .game-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--bg-panel);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay Layer */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 60px;
            z-index: 10;
        }

        /* Top HUD */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            opacity: 0.9;
        }

        .brand {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 700;
            color: var(--text-dim);
            letter-spacing: 4px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-transform: uppercase;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-cyan);
            animation: blink 2s infinite;
        }

        .score-group {
            text-align: right;
            font-family: var(--font-mono);
        }

        .score-val {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: -2px;
            color: var(--text-main);
            line-height: 0.8;
            text-shadow: 0 0 0px rgba(255,255,255,0);
            font-variant-numeric: tabular-nums;
        }

        .hi-score {
            font-size: 12px;
            color: var(--accent-yellow);
            font-weight: 600;
            opacity: 0.9;
            margin-top: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }

        .hi-score::before {
            content: '';
            display: block;
            width: 6px;
            height: 6px;
            background: var(--accent-yellow);
        }

        /* Bottom HUD */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .speed-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 160px;
        }

        .speed-label {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--accent-magenta);
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }

        .speed-meter {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            border-radius: 2px;
        }

        .speed-fill {
            height: 100%;
            background: var(--accent-magenta);
            width: 10%;
            box-shadow: 0 0 15px var(--accent-magenta);
            transition: width 0.1s linear;
            border-radius: 2px;
        }

        /* Screens */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            background: rgba(3, 3, 4, 0.85);
            backdrop-filter: blur(8px);
            opacity: 1;
            transition: opacity 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .title-block {
            text-align: center;
            margin-bottom: 80px;
            position: relative;
        }

        .title {
            font-size: 96px;
            font-weight: 900;
            letter-spacing: -4px;
            line-height: 0.9;
            margin: 0;
            color: #fff;
            text-transform: uppercase;
            font-style: italic;
            /* Modern Gradient Text */
            background: linear-gradient(to bottom right, #fff 40%, #8892b0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(69, 243, 255, 0.2));
        }

        .subtitle {
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--accent-cyan);
            letter-spacing: 8px;
            margin-top: 20px;
            text-transform: uppercase;
            opacity: 0.9;
            font-weight: 600;
        }

        .instruction {
            display: flex;
            align-items: center;
            gap: 25px;
            color: var(--text-dim);
            font-size: 12px;
            letter-spacing: 6px;
            font-weight: 600;
            animation: breathe 4s infinite ease-in-out;
        }

        .key {
            border: 1px solid rgba(255,255,255,0.15);
            padding: 15px 30px;
            border-radius: 4px;
            color: var(--text-main);
            background: rgba(255,255,255,0.03);
            font-weight: 700;
            font-family: var(--font-mono);
            font-size: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
        }
        
        .key:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(69, 243, 255, 0.2);
            transform: translateY(-2px);
        }

        .game-over-card {
            background: rgba(11, 12, 16, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 70px 120px;
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 50px 100px rgba(0,0,0,0.9);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .game-over-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-magenta), transparent);
        }

        .error-code {
            color: var(--accent-magenta);
            font-family: var(--font-mono);
            font-size: 14px;
            letter-spacing: 4px;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 42, 109, 0.4);
        }

        .final-score {
            font-size: 72px;
            font-weight: 800;
            color: var(--text-main);
            margin: 10px 0 50px 0;
            font-family: var(--font-mono);
            letter-spacing: -2px;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.4; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(5px); }
        }

        @keyframes slideUp {
            from { transform: translateY(50px) scale(0.98); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="atmosphere"></div>

    <div class="game-viewport">
        <!-- HUD -->
        <div class="ui-layer">
            <div class="top-bar">
                <div class="brand">
                    <div class="status-indicator"></div>
                    <span>Neo-Runner</span>
                </div>
                <div class="score-group">
                    <div class="score-val" id="score">00000</div>
                    <div class="hi-score">Best</div>
                    <div id="highScore" style="font-size: 18px; color: var(--text-main); margin-top: 2px; font-weight: 600;">00000</div>
                </div>
            </div>

            <div class="bottom-bar">
                <div class="speed-container">
                    <div class="speed-label">
                        <span>Velocity</span>
                        <span id="speedVal">100%</span>
                    </div>
                    <div class="speed-meter">
                        <div class="speed-fill" id="speedBar"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Start Screen -->
        <div class="overlay" id="startScreen">
            <div class="title-block">
                <h1 class="title">Neo-Runner</h1>
                <div class="subtitle">System Reboot Required</div>
            </div>
            <div class="instruction">
                <span>PRESS</span>
                <span class="key">SPACE</span>
                <span>TO JUMP</span>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div class="overlay hidden" id="gameOverScreen">
            <div class="game-over-card">
                <div class="error-code">CRITICAL FAILURE</div>
                <div style="color: var(--text-dim); font-size: 12px; letter-spacing: 3px; font-family: var(--font-mono);">DISTANCE LOGGED</div>
                <div class="final-score" id="finalScore">00000</div>
                <div class="instruction" style="margin-top: 0;">
                    <span class="key">SPACE</span>
                    <span>TO REBOOT</span>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

<script>
    /**
     * NEO-RUNNER ENGINE v5.0
     * Design Focus: 
     * 1. Cinematic Parallax (3 distinct layers)
     * 2. Refined Silhouettes (Clean geometry, no "blobby" shapes)
     * 3. Juicy Feedback (Screen shake, particles, speed lines)
     * 4. Typography Hierarchy (Cleaner HUD, better spacing)
     */

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    // DOM Elements
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const finalScoreEl = document.getElementById('finalScore');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const speedBar = document.getElementById('speedBar');
    const speedVal = document.getElementById('speedVal');

    // Configuration
    let GAME_WIDTH = 1024;
    let GAME_HEIGHT = 600;
    const GROUND_Y = 520; // Slightly higher ground
    const GRAVITY = 0.6;
    const JUMP_FORCE = -15; // Snappier jump
    
    // State
    let gameRunning = false;
    let gameOver = false;
    let frame = 0;
    let score = 0;
    let highScore = localStorage.getItem('neo_runner_hs_v5') || 0;
    let speed = 10;
    let baseSpeed = 10;
    let maxSpeed = 28;
    let shake = 0;

    // Resize & Scale
    function resize() {
        const container = canvas.parentElement;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = container.clientWidth * dpr;
        canvas.height = container.clientHeight * dpr;
        ctx.scale(dpr, dpr);
        GAME_WIDTH = container.clientWidth;
        GAME_HEIGHT = container.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();
    highScoreEl.innerText = Math.floor(highScore).toString().padStart(5, '0');

    // --- CLASSES ---

    class Dino {
        constructor() {
            this.w = 60; // Slightly larger, more imposing
            this.h = 60;
            this.x = 120; // More breathing room on left
            this.y = GROUND_Y - this.h;
            this.dy = 0;
            this.grounded = true;
            this.runFrame = 0;
            this.rotation = 0;
            this.color = '#ffffff';
        }

        jump() {
            if (this.grounded) {
                this.dy = JUMP_FORCE;
                this.grounded = false;
                this.rotation = -0.25; // More dramatic tilt
                createDust(this.x + this.w/2, this.y + this.h, 10); // More dust
            }
        }

        update() {
            this.dy += GRAVITY;
            this.y += this.dy;

            if (this.y + this.h > GROUND_Y) {
                if (!this.grounded) {
                    createDust(this.x + this.w/2, this.y + this.h, 5);
                    this.rotation = 0.1;
                }
                this.y = GROUND_Y - this.h;
                this.dy = 0;
                this.grounded = true;
                this.rotation = 0;
            } else {
                this.grounded = false;
                // Dynamic rotation based on velocity
                this.rotation = this.dy < -2 ? -0.3 : (this.dy > 2 ? 0.2 : 0);
            }

            if (this.grounded) {
                this.runFrame += 0.3 * (speed / baseSpeed);
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x + this.w/2, this.y + this.h/2);
            ctx.rotate(this.rotation);
            ctx.translate(-(this.x + this.w/2), -(this.y + this.h/2));

            // Main Body Silhouette
            ctx.fillStyle = this.color;
            
            // Draw a sharper, more robotic dino shape
            ctx.beginPath();
            ctx.moveTo(this.x, this.y + 40); // Hip
            ctx.lineTo(this.x + 10, this.y + 20); // Chest
            ctx.lineTo(this.x + 30, this.y + 10); // Neck
            ctx.lineTo(this.x + 55, this.y + 15); // Snout
            ctx.lineTo(this.x + 55, this.y + 20); // Jaw
            ctx.lineTo(this.x + 45, this.y + 25); // Chin
            ctx.lineTo(this.x + 40, this.y + 15); // Top Head
            ctx.lineTo(this.x + 20, this.y + 15); // Back Head
            ctx.lineTo(this.x + 5, this.y + 30); // Back
            ctx.lineTo(this.x - 10, this.y + 45); // Tail
            ctx.lineTo(this.x, this.y + 55); // Bottom Tail
            ctx.closePath();
            ctx.fill();

            // Glowing Eye
            ctx.fillStyle = '#000';
            ctx.fillRect(this.x + 40, this.y + 18, 8, 4);
            ctx.fillStyle = '#45f3ff'; // Cyan Eye
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#45f3ff';
            ctx.fillRect(this.x + 44, this.y + 19, 4, 2);
            ctx.shadowBlur = 0;

            // Legs Animation
            ctx.fillStyle = this.color;
            if (this.grounded) {
                const legOffset = Math.sin(this.runFrame) * 12;
                
                // Leg 1 (Back)
                ctx.beginPath();
                ctx.moveTo(this.x + 10, this.y + 50);
                ctx.lineTo(this.x + 5 + legOffset, this.y + 70);
                ctx.lineTo(this.x + 15 + legOffset, this.y + 70);
                ctx.fill();
                
                // Leg 2 (Front)
                ctx.beginPath();
                ctx.moveTo(this.x + 30, this.y + 50);
                ctx.lineTo(this.x + 25 - legOffset, this.y + 70);
                ctx.lineTo(this.x + 35 - legOffset, this.y + 70);
                ctx.fill();
            } else {
                // Jumping pose - tucked legs
                ctx.fillRect(this.x + 10, this.y + 50, 12, 15);
                ctx.fillRect(this.x + 30, this.y + 45, 12, 15);
            }
            
            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type;
            this.x = GAME_WIDTH + 100;
            this.markedForDeletion = false;
            
            if (type === 'cactus') {
                this.w = 30;
                this.h = 55;
                this.y = GROUND_Y - this.h;
                this.variant = Math.random();
            } else {
                // Drone
                this.w = 50;
                this.h = 30;
                const heights = [GROUND_Y - 60, GROUND_Y - 110];
                this.y = heights[Math.floor(Math.random() * heights.length)];
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= speed;
            if (this.x + this.w < -100) this.markedForDeletion = true;
            if (this.type === 'drone') this.wingFrame += 0.2;
        }

        draw() {
            ctx.save();
            
            if (this.type === 'cactus') {
                // Cyberpunk Cactus
                ctx.fillStyle = '#ff2a6d';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff2a6d';
                
                // Main Stem
                ctx.fillRect(this.x + 10, this.y, 10, this.h);
                
                // Arms (Geometric)
                if (this.variant > 0.5) {
                    ctx.fillRect(this.x, this.y + 20, 10, 5);
                    ctx.fillRect(this.x, this.y + 5, 5, 20);
                } else {
                    ctx.fillRect(this.x + 20, this.y + 25, 10, 5);
                    ctx.fillRect(this.x + 25, this.y + 10, 5, 20);
                }
                
                ctx.shadowBlur = 0;
                // Tech details
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(this.x + 12, this.y + 5, 6, this.h - 10);

            } else {
                // Drone
                ctx.translate(this.x, this.y);
                
                // Glow
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#f9c80e';
                ctx.fillStyle = '#f9c80e';

                // Body (Sharp Triangle)
                ctx.beginPath();
                ctx.moveTo(0, 15);
                ctx.lineTo(25, 0);
                ctx.lineTo(50, 15);
                ctx.lineTo(25, 30);
                ctx.fill();

                // Propeller
                ctx.fillStyle = 'rgba(249, 200, 14, 0.5)';
                const wingY = Math.sin(this.wingFrame) * 12;
                ctx.beginPath();
                ctx.ellipse(25, 15 - wingY, 30, 2, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
            }
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, type) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 4 + 1;
            this.speedX = (Math.random() - 0.5) * 8;
            this.speedY = (Math.random() - 0.5) * 8;
            this.life = 1.0;
            this.type = type;
            this.color = type === 'dust' ? '#ffffff' : '#ff2a6d';
        }
        update() {
            this.x -= speed * 0.5; // Parallax effect on particles
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.03;
            this.size *= 0.95;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    // Background Stars
    class Star {
        constructor() {
            this.x = Math.random() * GAME_WIDTH;
            this.y = Math.random() * (GROUND_Y - 50);
            this.size = Math.random() * 2;
            this.speed = Math.random() * 0.5 + 0.1;
        }
        update() {
            this.x -= this.speed * (speed * 0.1);
            if (this.x < 0) this.x = GAME_WIDTH;
        }
        draw() {
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(this.x, this.y, this.size, this.size);
        }
    }

    // --- GAME LOGIC ---

    const dino = new Dino();
    let obstacles = [];
    let particles = [];
    let stars = [];
    let obstacleTimer = 0;

    // Initialize Stars
    for(let i=0; i<50; i++) stars.push(new Star());

    function createDust(x, y, count) {
        for(let i=0; i<count; i++) particles.push(new Particle(x, y, 'dust'));
    }

    function createExplosion(x, y) {
        for(let i=0; i<60; i++) particles.push(new Particle(x, y, 'spark'));
        shake = 20; // Screen shake intensity
    }

    function resetGame() {
        dino.y = GROUND_Y - dino.h;
        dino.dy = 0;
        obstacles = [];
        particles = [];
        score = 0;
        speed = baseSpeed;
        gameOver = false;
        gameRunning = true;
        obstacleTimer = 0;
        shake = 0;
        
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        
        animate();
    }

    function spawnObstacle() {
        const type = Math.random() > 0.6 ? 'drone' : 'cactus';
        obstacles.push(new Obstacle(type));
    }

    function checkCollision(r1, r2) {
        // Tighter hitboxes for better feel
        return (
            r1.x < r2.x + r2.w - 8 &&
            r1.x + r1.w > r2.x + 8 &&
            r1.y < r2.y + r2.h - 8 &&
            r1.y + r1.h > r2.y + 8
        );
    }

    function drawBackground() {
        // Deep Sky Gradient
        const gradient = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
        gradient.addColorStop(0, '#020204');
        gradient.addColorStop(0.6, '#0b0c10');
        gradient.addColorStop(1, '#1a1c29');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // Stars
        stars.forEach(star => {
            star.update();
            star.draw();
        });

        // Distant Mountains (Slow Parallax)
        ctx.fillStyle = '#08090d';
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        let x = 0;
        while(x < GAME_WIDTH + 100) {
            const h = 100 + Math.sin(x * 0.005 + frame * 0.0005) * 60 + Math.cos(x * 0.01) * 30;
            ctx.lineTo(x, GROUND_Y - h);
            x += 50;
        }
        ctx.lineTo(GAME_WIDTH, GROUND_Y);
        ctx.fill();

        // Mid Terrain (Medium Parallax)
        ctx.fillStyle = '#050508';
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        x = 0;
        while(x < GAME_WIDTH + 100) {
            const h = 40 + Math.sin(x * 0.02 + frame * 0.01) * 20;
            ctx.lineTo(x, GROUND_Y - h);
            x += 40;
        }
        ctx.lineTo(GAME_WIDTH, GROUND_Y);
        ctx.fill();
    }

    function drawGround() {
        // Ground Plane
        ctx.fillStyle = '#030304';
        ctx.fillRect(0, GROUND_Y, GAME_WIDTH, GAME_HEIGHT - GROUND_Y);

        // Horizon Line (Cyan Glow)
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(GAME_WIDTH, GROUND_Y);
        ctx.strokeStyle = '#45f3ff';
        ctx.lineWidth = 2;
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#45f3ff';
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Moving Grid (Perspective)
        ctx.strokeStyle = 'rgba(69, 243, 255, 0.1)';
        ctx.lineWidth = 1;
        
        // Vertical Perspective Lines
        const dashOffset = (frame * speed) % 100;
        for(let i = -1; i < GAME_WIDTH / 100 + 2; i++) {
            const x = (i * 100) - dashOffset;
            ctx.beginPath();
            ctx.moveTo(x, GROUND_Y);
            ctx.lineTo(x - 80, GAME_HEIGHT); 
            ctx.stroke();
        }

        // Horizontal Lines
        for(let i = 0; i < 10; i++) {
            const y = GROUND_Y + (i * 40) + (frame * speed * (0.1 + i*0.05)) % 40;
            if (y > GAME_HEIGHT) continue;
            
            const alpha = 0.3 - (i * 0.025);
            if (alpha <= 0) continue;
            
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(GAME_WIDTH, y);
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }
    }

    function animate() {
        if (!gameRunning) return;

        // Screen Shake
        ctx.save();
        if (shake > 0) {
            const dx = (Math.random() - 0.5) * shake;
            const dy = (Math.random() - 0.5) * shake;
            ctx.translate(dx, dy);
            shake *= 0.9; // Decay
            if (shake < 0.5) shake = 0;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        drawBackground();
        drawGround();

        // Logic
        frame++;
        speed += 0.008; // Slightly faster acceleration
        if(speed > maxSpeed) speed = maxSpeed;
        
        score += speed * 0.05;
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
        
        // Speed UI
        const speedPct = Math.min(((speed - baseSpeed) / (maxSpeed - baseSpeed)) * 100, 100);
        speedBar.style.width = `${Math.max(5, speedPct)}%`;
        speedVal.innerText = `${Math.floor(speedPct)}%`;

        // Obstacles
        obstacleTimer++;
        // Rhythmic spacing: faster speed = tighter gaps
        const currentInterval = Math.max(40, 90 - (speed * 2.5));
        if (obstacleTimer > currentInterval + Math.random() * 50) {
            spawnObstacle();
            obstacleTimer = 0;
        }

        obstacles.forEach((obs, i) => {
            obs.update();
            obs.draw();
            
            const dinoHitbox = {x: dino.x + 5, y: dino.y + 5, w: dino.w - 10, h: dino.h - 10};
            const obsHitbox = {x: obs.x + 2, y: obs.y + 2, w: obs.w - 4, h: obs.h - 4};

            if (checkCollision(dinoHitbox, obsHitbox)) {
                gameOver = true;
                gameRunning = false;
                createExplosion(dino.x + dino.w/2, dino.y + dino.h/2);
                
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('neo_runner_hs_v5', highScore);
                    highScoreEl.innerText = Math.floor(highScore).toString().padStart(5, '0');
                }
                
                finalScoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
                gameOverScreen.classList.remove('hidden');
            }

            if (obs.markedForDeletion) obstacles.splice(i, 1);
        });

        // Particles
        particles.forEach((p, i) => {
            p.update();
            p.draw();
            if (p.life <= 0) particles.splice(i, 1);
        });

        // Dino
        dino.update();
        dino.draw();

        ctx.restore(); // End Shake

        if (gameRunning) requestAnimationFrame(animate);
    }

    // --- INPUTS ---

    function handleInput(e) {
        if ((e.code === 'Space' || e.code === 'ArrowUp') && !e.repeat) {
            e.preventDefault();
            if (!gameRunning && !gameOver) resetGame();
            else if (gameOver) resetGame();
            else dino.jump();
        }
    }

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!gameRunning && !gameOver) resetGame();
        else if (gameOver) resetGame();
        else dino.jump();
    }, {passive: false});

    window.addEventListener('keydown', handleInput);

    // Initial Draw
    drawBackground();
    drawGround();
    dino.draw();

</script>
</body>
