<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-RUNNER // REBOOTED</title>
    <style>
        :root {
            --bg-deep: #050507;
            --bg-panel: #0e0f14;
            --accent-cyan: #00f0ff;
            --accent-pink: #ff0055;
            --accent-yellow: #ffcc00;
            --text-main: #ffffff;
            --text-dim: #6b7280;
            --grid-color: rgba(255, 255, 255, 0.03);
            --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-mono);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ambient Vignette */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 0%, #000000 120%);
            pointer-events: none;
            z-index: 50;
        }

        /* Main Viewport */
        .game-viewport {
            position: relative;
            width: 100%;
            max-width: 1024px;
            aspect-ratio: 16/9;
            background: var(--bg-panel);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05), 0 40px 80px -20px rgba(0,0,0,0.8);
            overflow: hidden;
            border-radius: 2px;
        }

        /* Canvas */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Layer */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 32px;
            z-index: 10;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .data-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .label {
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--text-dim);
            font-weight: 600;
            text-transform: uppercase;
        }

        .score-group {
            text-align: right;
        }

        .score-val {
            font-size: 32px;
            font-weight: 700;
            font-family: var(--font-mono);
            letter-spacing: -1px;
            color: var(--text-main);
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
            font-variant-numeric: tabular-nums;
        }

        .hi-score {
            font-size: 12px;
            color: var(--accent-yellow);
            font-weight: 600;
            opacity: 0.8;
        }

        /* Bottom Bar */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .speed-meter {
            width: 120px;
        }

        .meter-bar {
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.1);
            margin-top: 8px;
            position: relative;
        }

        .meter-fill {
            height: 100%;
            background: var(--accent-cyan);
            width: 10%;
            box-shadow: 0 0 10px var(--accent-cyan);
            transition: width 0.1s linear;
        }

        /* Overlays */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            background: rgba(5, 5, 7, 0.4);
            backdrop-filter: blur(4px);
            opacity: 1;
            transition: opacity 0.4s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .title {
            font-family: var(--font-sans);
            font-size: 56px;
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #fff 0%, #aaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            text-transform: uppercase;
            position: relative;
        }

        .title::after {
            content: 'NEO-RUNNER';
            position: absolute;
            left: 0; top: 0; width: 100%;
            background: inherit;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: blur(12px);
            opacity: 0.5;
            z-index: -1;
        }

        .instruction {
            margin-top: 32px;
            display: flex;
            align-items: center;
            gap: 16px;
            color: var(--text-dim);
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: breathe 2s infinite ease-in-out;
        }

        .key {
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 4px;
            color: var(--text-main);
            background: rgba(255,255,255,0.03);
            font-weight: 600;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .game-over-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 60px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .error-title {
            color: var(--accent-pink);
            font-size: 14px;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .final-score {
            font-size: 48px;
            font-weight: 800;
            color: var(--text-main);
            margin: 10px 0 30px 0;
            font-family: var(--font-mono);
        }

        /* Scanlines */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 1px, rgba(0,0,0,0.1) 1px, rgba(0,0,0,0.1));
            background-size: 100% 2px;
            pointer-events: none;
            z-index: 40;
            opacity: 0.3;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.6; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(2px); }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

    </style>
</head>
<body>

    <div class="vignette"></div>

    <div class="game-viewport">
        <div class="scanlines"></div>
        
        <!-- HUD -->
        <div class="ui-layer">
            <div class="top-bar">
                <div class="data-group">
                    <span class="label">Status</span>
                    <span style="font-size: 12px; color: var(--accent-cyan); font-weight: 700; letter-spacing: 1px;">ONLINE</span>
                </div>
                <div class="data-group score-group">
                    <span class="label">Distance</span>
                    <div style="display: flex; align-items: baseline; justify-content: flex-end; gap: 12px;">
                        <span class="score-val" id="score">00000</span>
                        <span class="hi-score">HI: <span id="highScore">00000</span></span>
                    </div>
                </div>
            </div>

            <div class="bottom-bar">
                <div class="data-group">
                    <span class="label" style="color: var(--accent-pink);">Velocity</span>
                    <div class="speed-meter">
                        <div class="meter-bar">
                            <div class="meter-fill" id="speedBar"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Start Screen -->
        <div class="overlay" id="startScreen">
            <h1 class="title">Neo-Runner</h1>
            <div class="instruction">
                <span>Press</span>
                <span class="key">SPACE</span>
                <span>to Jump</span>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div class="overlay hidden" id="gameOverScreen">
            <div class="game-over-box">
                <div class="error-title">CRITICAL FAILURE</div>
                <div class="label">Final Distance</div>
                <div class="final-score" id="finalScore">00000</div>
                <div class="instruction" style="margin-top: 0;">
                    <span class="key">SPACE</span>
                    <span>to Reboot</span>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

<script>
    /**
     * NEO-RUNNER ENGINE v2.0
     * Focus: Visual Polish, Silhouette Readability, Smooth Performance
     */

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const finalScoreEl = document.getElementById('finalScore');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const speedBar = document.getElementById('speedBar');

    // Configuration
    let GAME_WIDTH = 960;
    let GAME_HEIGHT = 540;
    const GROUND_Y = 400;
    const GRAVITY = 0.65;
    const JUMP_FORCE = -14;
    
    // State
    let gameRunning = false;
    let gameOver = false;
    let frame = 0;
    let score = 0;
    let highScore = localStorage.getItem('neo_runner_hs') || 0;
    let speed = 8;
    let baseSpeed = 8;
    let maxSpeed = 22;
    
    // Resize & Scale
    function resize() {
        const container = canvas.parentElement;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = container.clientWidth * dpr;
        canvas.height = container.clientHeight * dpr;
        ctx.scale(dpr, dpr);
        GAME_WIDTH = container.clientWidth;
        GAME_HEIGHT = container.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();
    highScoreEl.innerText = Math.floor(highScore).toString().padStart(5, '0');

    // --- CLASSES ---

    class Dino {
        constructor() {
            this.w = 50;
            this.h = 50;
            this.x = 80;
            this.y = GROUND_Y - this.h;
            this.dy = 0;
            this.grounded = true;
            this.runFrame = 0;
            this.rotation = 0;
        }

        jump() {
            if (this.grounded) {
                this.dy = JUMP_FORCE;
                this.grounded = false;
                this.rotation = -0.2;
                createDust(this.x + this.w/2, this.y + this.h);
            }
        }

        update() {
            this.dy += GRAVITY;
            this.y += this.dy;

            if (this.y + this.h > GROUND_Y) {
                if (!this.grounded) {
                    createDust(this.x + this.w/2, this.y + this.h);
                    this.rotation = 0.1;
                }
                this.y = GROUND_Y - this.h;
                this.dy = 0;
                this.grounded = true;
                this.rotation = 0;
            } else {
                this.grounded = false;
                this.rotation = this.dy < 0 ? -0.3 : 0.3;
            }

            if (this.grounded) {
                this.runFrame += 0.25 * (speed / baseSpeed);
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x + this.w/2, this.y + this.h/2);
            ctx.rotate(this.rotation);
            ctx.translate(-(this.x + this.w/2), -(this.y + this.h/2));

            // Main Body Color
            ctx.fillStyle = '#ffffff';
            
            // Draw Silhouette (More organic than blocks)
            ctx.beginPath();
            // Head
            ctx.moveTo(this.x + 15, this.y);
            ctx.lineTo(this.x + 45, this.y); 
            ctx.lineTo(this.x + 45, this.y + 20);
            // Neck
            ctx.lineTo(this.x + 25, this.y + 20);
            ctx.lineTo(this.x + 25, this.y + 30);
            // Body
            ctx.lineTo(this.x, this.y + 30);
            ctx.lineTo(this.x, this.y + 45);
            // Tail
            ctx.lineTo(this.x - 10, this.y + 25);
            ctx.lineTo(this.x, this.y + 20);
            ctx.closePath();
            ctx.fill();

            // Eye
            ctx.fillStyle = '#000';
            ctx.fillRect(this.x + 35, this.y + 5, 4, 4);

            // Legs (Animated)
            ctx.fillStyle = '#ffffff';
            if (this.grounded) {
                const legOffset = Math.sin(this.runFrame) * 8;
                // Leg 1
                ctx.fillRect(this.x + 5 + legOffset, this.y + 45, 8, 5);
                // Leg 2
                ctx.fillRect(this.x + 20 - legOffset, this.y + 45, 8, 5);
            } else {
                // Tucked
                ctx.fillRect(this.x + 5, this.y + 40, 8, 8);
                ctx.fillRect(this.x + 20, this.y + 40, 8, 8);
            }

            // Arm
            ctx.fillRect(this.x + 28, this.y + 25, 10, 4);

            // Tech Core (Glowing)
            ctx.fillStyle = 'var(--accent-cyan)';
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'var(--accent-cyan)';
            ctx.fillRect(this.x + 8, this.y + 25, 4, 4);
            ctx.shadowBlur = 0;

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type;
            this.x = GAME_WIDTH + 100;
            this.markedForDeletion = false;
            
            if (type === 'cactus') {
                const scale = 0.8 + Math.random() * 0.6;
                this.w = 20 * scale;
                this.h = (40 + Math.random() * 30) * scale;
                this.y = GROUND_Y - this.h;
                this.color = '#ff0055'; // Pink
            } else {
                // Drone
                this.w = 40;
                this.h = 25;
                const heights = [GROUND_Y - 40, GROUND_Y - 80, GROUND_Y - 120];
                this.y = heights[Math.floor(Math.random() * heights.length)];
                this.color = '#ffcc00'; // Yellow
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= speed;
            if (this.x + this.w < -100) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.2;
        }

        draw() {
            ctx.save();
            
            if (this.type === 'cactus') {
                // Stylized Neon Cactus
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                
                // Main Stem
                ctx.fillRect(this.x, this.y, this.w, this.h);
                // Left Arm
                ctx.fillRect(this.x - 10, this.y + 15, 10, 5);
                ctx.fillRect(this.x - 10, this.y + 5, 5, 15);
                // Right Arm
                ctx.fillRect(this.x + this.w, this.y + 25, 10, 5);
                ctx.fillRect(this.x + this.w + 5, this.y + 15, 5, 15);
                
                ctx.shadowBlur = 0;
                // Inner detail
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(this.x + 4, this.y + 4, this.w - 8, this.h - 8);

            } else {
                // Drone
                ctx.translate(this.x, this.y);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;

                // Body (Arrow shape)
                ctx.beginPath();
                ctx.moveTo(0, 12);
                ctx.lineTo(20, 5);
                ctx.lineTo(40, 12);
                ctx.lineTo(20, 20);
                ctx.fill();

                // Wing
                const wingY = Math.sin(this.wingFrame) * 10;
                ctx.fillStyle = 'rgba(255, 204, 0, 0.8)';
                ctx.beginPath();
                ctx.moveTo(15, 12);
                ctx.lineTo(25, 12 - wingY - 10);
                ctx.lineTo(35, 12);
                ctx.fill();

                ctx.shadowBlur = 0;
            }
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, type) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 3 + 1;
            this.speedX = (Math.random() - 0.5) * 4;
            this.speedY = (Math.random() - 0.5) * 4;
            this.life = 1.0;
            this.type = type;
            this.color = type === 'dust' ? 'rgba(255,255,255,0.6)' : '#ff0055';
        }
        update() {
            this.x -= speed * 0.3;
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.03;
            this.size *= 0.9;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    // --- GAME LOGIC ---

    const dino = new Dino();
    let obstacles = [];
    let particles = [];
    let obstacleTimer = 0;
    let minInterval = 60;

    function createDust(x, y) {
        for(let i=0; i<4; i++) particles.push(new Particle(x, y, 'dust'));
    }

    function createExplosion(x, y) {
        for(let i=0; i<20; i++) particles.push(new Particle(x, y, 'spark'));
    }

    function resetGame() {
        dino.y = GROUND_Y - dino.h;
        dino.dy = 0;
        obstacles = [];
        particles = [];
        score = 0;
        speed = baseSpeed;
        gameOver = false;
        gameRunning = true;
        obstacleTimer = 0;
        
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        
        animate();
    }

    function spawnObstacle() {
        // Simple random logic, weighted towards cacti
        const type = Math.random() > 0.6 ? 'bird' : 'cactus';
        obstacles.push(new Obstacle(type));
    }

    function checkCollision(r1, r2) {
        return (
            r1.x < r2.x + r2.w - 4 &&
            r1.x + r1.w > r2.x + 4 &&
            r1.y < r2.y + r2.h - 4 &&
            r1.y + r1.h > r2.y + 4
        );
    }

    function drawBackground() {
        // Gradient Sky
        const gradient = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
        gradient.addColorStop(0, '#050507');
        gradient.addColorStop(1, '#1a1c29');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // Distant Stars (Static for performance, or simple dots)
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        for(let i=0; i<20; i++) {
            // Pseudo-random based on index to avoid math every frame
            const sx = (i * 137) % GAME_WIDTH;
            const sy = (i * 53) % (GROUND_Y - 100);
            ctx.fillRect(sx, sy, 2, 2);
        }

        // Distant Mountains (Parallax)
        ctx.fillStyle = '#12141c';
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        let x = 0;
        while(x < GAME_WIDTH) {
            const h = 50 + Math.sin(x * 0.01 + frame * 0.001) * 30;
            ctx.lineTo(x, GROUND_Y - h);
            x += 40;
        }
        ctx.lineTo(GAME_WIDTH, GROUND_Y);
        ctx.fill();
    }

    function drawGround() {
        // Ground Plane
        ctx.fillStyle = '#0a0b10';
        ctx.fillRect(0, GROUND_Y, GAME_WIDTH, GAME_HEIGHT - GROUND_Y);

        // Top Line (Neon)
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(GAME_WIDTH, GROUND_Y);
        ctx.strokeStyle = 'var(--accent-cyan)';
        ctx.lineWidth = 2;
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'var(--accent-cyan)';
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Moving Grid Lines (Perspective)
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.15)';
        ctx.lineWidth = 1;
        
        // Vertical moving lines
        const dashOffset = (frame * speed) % 100;
        for(let i = -1; i < GAME_WIDTH / 100 + 1; i++) {
            const x = (i * 100) - dashOffset;
            // Draw line with perspective slant
            ctx.beginPath();
            ctx.moveTo(x, GROUND_Y);
            ctx.lineTo(x - (GAME_HEIGHT - GROUND_Y) * 0.2, GAME_HEIGHT); // Slant left
            ctx.stroke();
        }

        // Horizontal moving lines (fading into distance)
        for(let i = 0; i < 5; i++) {
            const y = GROUND_Y + (i * 40) + (frame * speed * (0.1 + i*0.05)) % 40;
            const alpha = 0.1 - (i * 0.02);
            if (alpha <= 0) continue;
            
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(GAME_WIDTH, y);
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }
    }

    function animate() {
        if (!gameRunning) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        drawBackground();
        drawGround();

        // Logic
        frame++;
        speed += 0.005;
        if(speed > maxSpeed) speed = maxSpeed;
        
        score += speed * 0.05;
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
        
        // Speed UI
        const speedPct = Math.min(((speed - baseSpeed) / (maxSpeed - baseSpeed)) * 100, 100);
        speedBar.style.width = `${Math.max(5, speedPct)}%`;

        // Obstacles
        obstacleTimer++;
        // Randomize interval slightly
        const currentInterval = Math.max(45, 90 - (speed * 2));
        if (obstacleTimer > currentInterval + Math.random() * 40) {
            spawnObstacle();
            obstacleTimer = 0;
        }

        obstacles.forEach((obs, i) => {
            obs.update();
            obs.draw();
            
            // Collision
            const dinoHitbox = {x: dino.x + 5, y: dino.y + 5, w: dino.w - 10, h: dino.h - 10};
            const obsHitbox = {x: obs.x + 2, y: obs.y + 2, w: obs.w - 4, h: obs.h - 4};

            if (checkCollision(dinoHitbox, obsHitbox)) {
                gameOver = true;
                gameRunning = false;
                createExplosion(dino.x + dino.w/2, dino.y + dino.h/2);
                
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('neo_runner_hs', highScore);
                    highScoreEl.innerText = Math.floor(highScore).toString().padStart(5, '0');
                }
                
                finalScoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
                gameOverScreen.classList.remove('hidden');
            }

            if (obs.markedForDeletion) obstacles.splice(i, 1);
        });

        // Particles
        particles.forEach((p, i) => {
            p.update();
            p.draw();
            if (p.life <= 0) particles.splice(i, 1);
        });

        // Dino
        dino.update();
        dino.draw();

        if (gameRunning) requestAnimationFrame(animate);
    }

    // --- INPUTS ---

    function handleInput(e) {
        if ((e.code === 'Space' || e.code === 'ArrowUp') && !e.repeat) {
            e.preventDefault();
            if (!gameRunning && !gameOver) resetGame();
            else if (gameOver) resetGame();
            else dino.jump();
        }
    }

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!gameRunning && !gameOver) resetGame();
        else if (gameOver) resetGame();
        else dino.jump();
    }, {passive: false});

    window.addEventListener('keydown', handleInput);

    // Initial Draw
    drawBackground();
    drawGround();
    dino.draw();

</script>
</body>
</html>
