<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pixel Hopper - Gameplay Screen</title>
<style>
    :root {
        --sky-top: #5C9DFF;
        --sky-bottom: #A4D9FF;
        --grass: #8BC34A;
        --grass-dark: #689F38;
        --road: #607D8B;
        --road-line: #CFD8DC;
        --water: #29B6F6;
        --water-dark: #0288D1;
        --wood: #A1887F;
        --wood-dark: #5D4037;
        --ui-bg: rgba(255, 255, 255, 0.95);
        --text-color: #333;
        --shadow: 0 8px 16px rgba(0,0,0,0.15);
    }

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }

    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 50%, var(--grass) 50%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* 3D SCENE CONTAINER */
    #scene {
        width: 100%;
        height: 100%;
        max-width: 500px; /* Mobile-first focus */
        max-height: 900px;
        perspective: 800px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 50px rgba(0,0,0,0.2);
    }

    /* HUD - Floating Pill Style */
    .hud {
        position: absolute;
        top: 30px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: space-around;
        z-index: 100;
        pointer-events: none;
    }

    .score-box {
        background: var(--ui-bg);
        padding: 10px 20px;
        border-radius: 20px;
        box-shadow: var(--shadow);
        text-align: center;
        min-width: 100px;
        transform: translateZ(50px);
        backdrop-filter: blur(5px);
    }

    .score-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: #888;
        font-weight: 800;
        margin-bottom: 2px;
    }

    .score-val {
        font-size: 28px;
        font-weight: 900;
        color: var(--text-color);
        line-height: 1;
    }

    /* GAME BOARD */
    #board {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        transform-style: preserve-3d;
        transform: rotateX(30deg) translateY(-100px);
        /* The tilt is steeper for better depth */
    }

    /* LANES */
    .lane {
        width: 100%;
        height: 80px;
        position: absolute;
        left: 0;
        transform-style: preserve-3d;
        border-bottom: 6px solid rgba(0,0,0,0.1); /* Depth shadow */
    }

    .lane.grass { 
        background: var(--grass); 
        border-bottom-color: var(--grass-dark);
    }
    .lane.road { 
        background: var(--road); 
        border-bottom-color: #455A64;
    }
    .lane.water { 
        background: var(--water); 
        border-bottom-color: var(--water-dark);
    }

    /* Lane Details */
    .lane.road::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        height: 4px;
        background: repeating-linear-gradient(90deg, var(--road-line) 0, var(--road-line) 40px, transparent 40px, transparent 80px);
        transform: translateY(-50%);
        opacity: 0.6;
    }

    .lane.water::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: repeating-linear-gradient(90deg, transparent 0, transparent 40px, rgba(255,255,255,0.3) 40px, rgba(255,255,255,0.3) 44px);
        animation: waterFlow 1.5s linear infinite;
    }

    @keyframes waterFlow {
        from { transform: translateX(0); }
        to { transform: translateX(44px); }
    }

    /* OBJECTS (Cars, Logs) */
    .moving-object {
        position: absolute;
        height: 60px;
        top: 10px;
        transform-style: preserve-3d;
        transition: transform 0.1s linear;
    }

    /* Car CSS Art - Low Poly Style */
    .car {
        width: 90px;
        background: #FF5252;
        border-radius: 12px;
        box-shadow: 0 6px 0 #B71C1C, 0 10px 10px rgba(0,0,0,0.3);
        position: relative;
    }
    .car::before { /* Roof */
        content: '';
        position: absolute;
        top: -25px;
        left: 15px;
        width: 60px;
        height: 25px;
        background: #FF8A80;
        border-radius: 8px 8px 0 0;
        box-shadow: inset 0 2px 0 rgba(255,255,255,0.3);
    }
    .car::after { /* Wheels */
        content: '';
        position: absolute;
        bottom: -5px;
        left: 10px;
        width: 18px;
        height: 12px;
        background: #212121;
        border-radius: 2px;
        box-shadow: 62px 0 0 #212121;
    }
    
    .car.truck {
        width: 140px;
        height: 70px;
        background: #FFC107;
        box-shadow: 0 6px 0 #F57F17, 0 10px 10px rgba(0,0,0,0.3);
        border-radius: 4px;
    }
    .car.truck::before {
        width: 80px;
        height: 30px;
        top: -30px;
        left: 50px;
        background: #FFD54F;
        border-radius: 4px 4px 0 0;
    }
    .car.truck::after {
        width: 22px;
        height: 14px;
        box-shadow: 100px 0 0 #212121;
    }

    /* Log CSS Art */
    .log {
        width: 120px;
        background: var(--wood);
        border-radius: 6px;
        box-shadow: 0 6px 0 var(--wood-dark), 0 10px 10px rgba(0,0,0,0.3);
        position: relative;
        display: flex;
        justify-content: space-around;
        align-items: center;
    }
    .log::before, .log::after {
        content: '';
        width: 100%;
        height: 100%;
        border-radius: 6px;
        border-top: 4px solid rgba(255,255,255,0.2);
    }
    /* Wood grain details */
    .log::after {
        content: '';
        border: none;
        width: 80%;
        height: 2px;
        background: rgba(0,0,0,0.1);
        border-radius: 50%;
    }

    /* PLAYER (The Chicken) */
    #player {
        position: absolute;
        width: 50px;
        height: 50px;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 50;
        transition: top 0.15s ease-out, left 0.15s ease-out, transform 0.2s;
    }

    /* Player CSS Art - Cute Low Poly */
    .chicken {
        width: 100%;
        height: 100%;
        position: relative;
        animation: bounce 0.4s infinite alternate ease-in-out;
    }

    .body {
        width: 44px;
        height: 44px;
        background: #FFF;
        border-radius: 50%;
        position: absolute;
        bottom: 0;
        left: 3px;
        box-shadow: 0 6px 0 #E0E0E0;
        border: 2px solid #E0E0E0;
        z-index: 2;
    }
    
    /* Wing */
    .body::after {
        content: '';
        position: absolute;
        top: 20px;
        left: -4px;
        width: 15px;
        height: 10px;
        background: #F5F5F5;
        border-radius: 50%;
        border: 1px solid #E0E0E0;
    }

    .comb {
        width: 14px;
        height: 10px;
        background: #FF5252;
        position: absolute;
        top: -8px;
        left: 14px;
        border-radius: 6px 6px 0 0;
        z-index: 3;
    }

    .eye {
        width: 7px;
        height: 7px;
        background: #333;
        border-radius: 50%;
        position: absolute;
        top: 12px;
        right: 10px;
        z-index: 4;
    }
    /* Eye glint */
    .eye::after {
        content: '';
        position: absolute;
        top: 1px;
        right: 1px;
        width: 2px;
        height: 2px;
        background: #FFF;
        border-radius: 50%;
    }
    
    .beak {
        width: 12px;
        height: 8px;
        background: #FFC107;
        position: absolute;
        top: 18px;
        right: -2px;
        clip-path: polygon(0 0, 100% 50%, 0 100%);
        z-index: 4;
    }

    .shadow {
        width: 36px;
        height: 12px;
        background: rgba(0,0,0,0.25);
        border-radius: 50%;
        position: absolute;
        bottom: -6px;
        left: 7px;
        z-index: 1;
        animation: shadowScale 0.4s infinite alternate ease-in-out;
    }

    @keyframes bounce {
        0% { transform: translateY(0); }
        100% { transform: translateY(-6px); }
    }
    @keyframes shadowScale {
        0% { transform: scale(1); opacity: 0.3; }
        100% { transform: scale(0.8); opacity: 0.15; }
    }

    /* CONTROLS - Glassmorphism */
    .controls {
        position: absolute;
        bottom: 40px;
        right: 30px;
        width: 160px;
        height: 160px;
        z-index: 200;
    }

    .d-btn {
        position: absolute;
        width: 50px;
        height: 50px;
        background: rgba(255,255,255,0.3);
        border: 2px solid rgba(255,255,255,0.6);
        border-radius: 14px;
        backdrop-filter: blur(8px);
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: background 0.1s, transform 0.1s;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .d-btn:active {
        background: rgba(255,255,255,0.6);
        transform: scale(0.92);
    }

    .d-btn svg {
        width: 24px;
        height: 24px;
        fill: #333;
        filter: drop-shadow(0 1px 0 rgba(255,255,255,0.8));
    }

    .d-up { top: 0; left: 55px; }
    .d-down { bottom: 0; left: 55px; }
    .d-left { top: 55px; left: 0; }
    .d-right { top: 55px; right: 0; }

    /* DECORATIONS */
    .tree {
        position: absolute;
        width: 0; 
        height: 0; 
        border-left: 25px solid transparent;
        border-right: 25px solid transparent;
        border-bottom: 70px solid #388E3C;
        filter: drop-shadow(0 8px 4px rgba(0,0,0,0.2));
        transform-style: preserve-3d;
        transform: translateZ(20px);
    }
    /* Tree highlight */
    .tree::after {
        content: '';
        position: absolute;
        top: 70px;
        left: -12px;
        width: 24px;
        height: 24px;
        background: #4CAF50;
        clip-path: polygon(50% 0, 0 100%, 100% 100%);
    }
    .trunk {
        position: absolute;
        bottom: -70px;
        left: -6px;
        width: 12px;
        height: 18px;
        background: #5D4037;
    }

    /* Clouds */
    .cloud {
        position: absolute;
        background: rgba(255,255,255,0.7);
        border-radius: 30px;
        animation: float 30s linear infinite;
        z-index: 0;
    }

    @keyframes float {
        from { transform: translateX(-100%); }
        to { transform: translateX(100vw); }
    }

</style>
</head>
<body>

<div id="scene">
    <!-- HUD -->
    <div class="hud">
        <div class="score-box">
            <div class="score-label">Score</div>
            <div class="score-val" id="score">0</div>
        </div>
        <div class="score-box">
            <div class="score-label">Best</div>
            <div class="score-val" id="best">12</div>
        </div>
    </div>

    <!-- BACKGROUND ELEMENTS -->
    <div class="cloud" style="top: 10%; left: -10%; width: 120px; height: 40px; animation-duration: 45s;"></div>
    <div class="cloud" style="top: 25%; left: -30%; width: 180px; height: 60px; animation-duration: 35s; animation-delay: -10s;"></div>
    <div class="cloud" style="top: 5%; left: -50%; width: 100px; height: 35px; animation-duration: 55s; animation-delay: -5s;"></div>

    <!-- GAME BOARD -->
    <div id="board">
        <!-- Generated via JS -->
    </div>

    <!-- PLAYER -->
    <div id="player">
        <div class="chicken">
            <div class="comb"></div>
            <div class="body">
                <div class="eye"></div>
                <div class="beak"></div>
            </div>
            <div class="shadow"></div>
        </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <div class="d-btn d-up" onclick="movePlayer(0, 1)">
            <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h6v8h4v-8h6z"/></svg>
        </div>
        <div class="d-btn d-down" onclick="movePlayer(0, -1)">
            <svg viewBox="0 0 24 24"><path d="M12 20l8-8h-6V4h-4v8H4z"/></svg>
        </div>
        <div class="d-btn d-left" onclick="movePlayer(-1, 0)">
            <svg viewBox="0 0 24 24"><path d="M4 12l8-8v6h8v4h-8v6z"/></svg>
        </div>
        <div class="d-btn d-right" onclick="movePlayer(1, 0)">
            <svg viewBox="0 0 24 24"><path d="M20 12l-8-8v6H4v4h8v6z"/></svg>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    const LANE_HEIGHT = 80;
    const BOARD_OFFSET_Y = -100; // Matches CSS translateY
    const START_LANES = 15;
    
    // --- STATE ---
    let score = 0;
    let playerGridPos = { x: 0, y: 2 }; // 0,0 is center bottom
    let lanes = [];
    let gameLoopId;
    let isGameOver = false;

    // --- ELEMENTS ---
    const board = document.getElementById('board');
    const playerEl = document.getElementById('player');
    const scoreEl = document.getElementById('score');

    // --- INITIALIZATION ---
    function init() {
        // Generate initial lanes
        for (let i = 0; i < START_LANES; i++) {
            addLane(-i);
        }
        updatePlayerVisuals();
        gameLoop();
    }

    // --- LANE GENERATION ---
    function addLane(index) {
        // Determine type: Grass (safe), Road (car), Water (log)
        let type = 'grass';
        const absIndex = Math.abs(index);
        
        // Simple procedural generation logic
        if (absIndex > 2) {
            const r = Math.random();
            if (r < 0.4) type = 'road';
            else if (r < 0.6) type = 'water';
            else type = 'grass';
        }

        const lane = document.createElement('div');
        lane.className = `lane ${type}`;
        lane.dataset.index = index;
        
        lane.style.bottom = (index * LANE_HEIGHT) + 'px';
        lane.style.width = '100%';
        
        // Add Content
        let content = null;
        let speed = 0;
        let speedDir = 1;
        let xPos = 0;

        if (type === 'road') {
            const car = document.createElement('div');
            car.className = `moving-object car ${Math.random() > 0.8 ? 'truck' : ''}`;
            // Randomize direction and speed
            speed = (1.5 + Math.random() * 2) * (Math.random() > 0.5 ? 1 : -1);
            xPos = speed > 0 ? -150 : 100; // Start off screen
            lane.appendChild(car);
            content = car;
        } else if (type === 'water') {
            const log = document.createElement('div');
            log.className = 'moving-object log';
            speed = (0.5 + Math.random()) * (Math.random() > 0.5 ? 1 : -1);
            xPos = speed > 0 ? -150 : 100;
            lane.appendChild(log);
            content = log;
        } else if (type === 'grass') {
            // Random trees
            if (Math.random() > 0.4) {
                const tree = document.createElement('div');
                tree.className = 'tree';
                tree.innerHTML = '<div class="trunk"></div>';
                tree.style.left = Math.random() * 80 + 10 + '%';
                lane.appendChild(tree);
            }
        }

        board.appendChild(lane);

        lanes.push({
            element: lane,
            type: type,
            index: index,
            content: content,
            speed: speed,
            x: xPos
        });
    }

    // --- GAME LOOP ---
    function gameLoop() {
        if (isGameOver) return;

        // Move objects
        lanes.forEach(l => {
            if (l.content) {
                l.x += l.speed;
                // Wrap around
                if (l.speed > 0 && l.x > 100) l.x = -150;
                if (l.speed < 0 && l.x < -150) l.x = 100;
                l.content.style.transform = `translateX(${l.x}%)`;
            }
        });

        // Check collisions
        checkCollisions();

        // Camera follow
        updateCamera();

        requestAnimationFrame(gameLoop);
    }

    function checkCollisions() {
        const currentLaneObj = lanes.find(l => l.index === playerGridPos.y);
        if (!currentLaneObj) return;

        // 1. Check if on Water without Log
        if (currentLaneObj.type === 'water') {
            const onLog = isPlayerOnObject(currentLaneObj.content, currentLaneObj.speed);
            
            if (onLog) {
                // Move player with log
                playerGridPos.x += currentLaneObj.speed * 0.06; 
                updatePlayerVisuals();
            } else {
                // Drown
                gameOver();
            }
        } else if (currentLaneObj.type === 'road') {
            // Check car collision
            if (isPlayerOnObject(currentLaneObj.content, 0)) {
                gameOver();
            }
        }
    }

    function isPlayerOnObject(obj, speed) {
        if (!obj) return false;
        
        // Convert player grid X to percentage of lane width
        // Assume lane width fits 10 grid steps (-5 to 5).
        // Player visual X % = 50 + (playerGridPos.x * 8).
        const playerPct = (playerGridPos.x / 10) * 100 + 50; 
        
        // Object rect
        const objWidth = obj.classList.contains('log') ? 25 : 15; // Approx width %
        
        const pLeft = playerPct - 3; // Player is small (3% width)
        const pRight = playerPct + 3;
        
        const oLeft = currentLaneObj.x;
        const oRight = currentLaneObj.x + objWidth;

        return (pLeft < oRight && pRight > oLeft);
    }

    // --- MOVEMENT ---
    window.movePlayer = function(dx, dy) {
        if (isGameOver) {
            resetGame();
            return;
        }

        playerGridPos.x += dx;
        playerGridPos.y += dy;

        // Clamp X
        if (playerGridPos.x > 5) playerGridPos.x = 5;
        if (playerGridPos.x < -5) playerGridPos.x = -5;

        updatePlayerVisuals();

        // Score increment on forward move
        if (dy > 0) {
            score++;
            scoreEl.innerText = score;
            // Add new lane
            addLane(-lanes.length); 
        }
    };

    function updatePlayerVisuals() {
        // Map Grid to CSS
        const bottomPx = (playerGridPos.y * LANE_HEIGHT) + 15; 
        
        // X: Percentage. Center is 50%. 
        // 1 grid unit = 8% width.
        const leftPct = 50 + (playerGridPos.x * 8);

        playerEl.style.bottom = bottomPx + 'px';
        playerEl.style.left = leftPct + '%';
    }

    function updateCamera() {
        const targetBottom = (playerGridPos.y * LANE_HEIGHT) + 15;
        
        if (!window.cameraY) window.cameraY = 0;
        
        // Calculate desired offset
        const desiredBoardY = - (targetBottom - 200); 
        
        window.cameraY += (desiredBoardY - window.cameraY) * 0.1;
        
        board.style.transform = `rotateX(30deg) translateY(${BOARD_OFFSET_Y + window.cameraY}px)`;
    }

    function gameOver() {
        isGameOver = true;
        playerEl.style.filter = 'grayscale(100%)';
        playerEl.style.transform = 'translateX(-50%) rotate(90deg)';
        playerEl.style.transition = 'all 0.5s';
        
        setTimeout(() => {
            // Simple visual reset without alert to keep it smooth
            resetGame();
        }, 1000);
    }

    function resetGame() {
        isGameOver = false;
        score = 0;
        scoreEl.innerText = '0';
        playerGridPos = { x: 0, y: 2 };
        window.cameraY = 0;
        
        // Clear lanes
        board.innerHTML = '';
        lanes = [];
        
        // Reset player style
        playerEl.style.filter = 'none';
        playerEl.style.transform = 'translateX(-50%)';
        playerEl.style.transition = 'top 0.15s ease-out, left 0.15s ease-out, transform 0.2s';
        
        init();
    }

    // --- KEYBOARD SUPPORT ---
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp') movePlayer(0, 1);
        if (e.key === 'ArrowDown') movePlayer(0, -1);
        if (e.key === 'ArrowLeft') movePlayer(-1, 0);
        if (e.key === 'ArrowRight') movePlayer(1, 0);
    });

    // --- START ---
    init();

</script>
</body>
</html>
