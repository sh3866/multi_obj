<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Cube | Professional Puzzle</title>
<style>
  :root {
    --bg-deep: #050507;
    --bg-panel: rgba(20, 22, 30, 0.7);
    --border: rgba(255, 255, 255, 0.08);
    --border-hover: rgba(255, 255, 255, 0.2);
    
    --accent: #00f2ff;
    --accent-glow: rgba(0, 242, 255, 0.5);
    --accent-dim: #005a66;
    
    --text-main: #ffffff;
    --text-muted: #6b7280;
    
    --danger: #ff4757;
    --warning: #f1c40f;
    
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: 'SF Mono', 'Fira Code', 'Roboto Mono', 'Courier New', monospace;

    /* Cube Variables */
    --cube-size: 260px;
    --sticker-size: 73.33px;
    --gap: 6px;
    --anim-speed: 0.3s;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-ui);
    background-color: var(--bg-deep);
    background-image: 
      radial-gradient(circle at 50% 0%, #1a1c29 0%, transparent 60%),
      linear-gradient(to bottom, transparent 80%, #000 100%);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* --- Header --- */
  .header {
    height: 70px;
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(5, 5, 7, 0.6);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .brand span { 
    color: var(--accent); 
    text-shadow: 0 0 20px var(--accent-glow);
    letter-spacing: 2px;
  }

  .brand-icon {
    width: 28px;
    height: 28px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 3px;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
  }
  .brand-icon div { width: 100%; height: 100%; }
  .bi-1 { background: #4facfe; }
  .bi-2 { background: #ff5858; }
  .bi-3 { background: #43e97b; }
  .bi-4 { background: #f6d365; }

  .version-tag {
    font-size: 10px;
    background: rgba(255,255,255,0.05);
    padding: 4px 8px;
    border-radius: 4px;
    color: var(--text-muted);
    letter-spacing: 1px;
    font-weight: 600;
    border: 1px solid var(--border);
  }

  /* --- Layout --- */
  .main-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
    gap: 30px;
    position: relative;
  }

  /* --- Stats HUD --- */
  .stats-hud {
    display: flex;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 12px;
    box-shadow: 0 20px 50px -10px rgba(0,0,0,0.5);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    max-width: 500px;
    width: 100%;
    justify-content: space-between;
  }

  .stat-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    position: relative;
  }

  .stat-box:not(:last-child)::after {
    content: '';
    position: absolute;
    right: 0;
    top: 15%;
    height: 70%;
    width: 1px;
    background: var(--border);
  }

  .stat-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
    font-weight: 700;
    margin-bottom: 6px;
  }

  .stat-val {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }

  .stat-val.timer { 
    color: var(--accent); 
    font-size: 28px;
    text-shadow: 0 0 20px var(--accent-glow);
  }

  /* --- 3D Stage --- */
  .stage {
    width: 100%;
    height: 460px;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1500px;
    position: relative;
  }

  .cube-wrapper {
    width: var(--cube-size);
    height: var(--cube-size);
    position: relative;
    transform-style: preserve-3d;
    /* Initial View - slightly more dynamic angle */
    transform: rotateX(-20deg) rotateY(-30deg);
    transition: transform 0.1s linear; 
    cursor: grab;
  }

  .cube-wrapper:active { cursor: grabbing; }
  
  .cube-wrapper.auto-spin {
    animation: spin 40s linear infinite;
  }

  @keyframes spin {
    from { transform: rotateX(-15deg) rotateY(0deg); }
    to { transform: rotateX(-15deg) rotateY(360deg); }
  }

  /* Shadow - more realistic */
  .stage::after {
    content: '';
    position: absolute;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%) rotateX(90deg);
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(0,0,0,0.8) 0%, transparent 70%);
    filter: blur(40px);
    z-index: -1;
    opacity: 0.9;
  }

  /* Faces & Stickers */
  .face {
    position: absolute;
    display: grid;
    gap: var(--gap);
    padding: var(--gap);
    background: #111; /* Darker plastic between stickers */
    border-radius: 12px; /* Slightly rounder face */
    width: var(--cube-size);
    height: var(--cube-size);
    backface-visibility: hidden;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
    border: 1px solid rgba(255,255,255,0.03);
  }

  /* Face Transforms */
  .face-front  { transform: rotateY(0deg) translateZ(calc(var(--cube-size) / 2)); }
  .face-back   { transform: rotateY(180deg) translateZ(calc(var(--cube-size) / 2)); }
  .face-right  { transform: rotateY(90deg) translateZ(calc(var(--cube-size) / 2)); }
  .face-left   { transform: rotateY(-90deg) translateZ(calc(var(--cube-size) / 2)); }
  .face-top    { transform: rotateX(90deg) translateZ(calc(var(--cube-size) / 2)); }
  .face-bottom { transform: rotateX(-90deg) translateZ(calc(var(--cube-size) / 2)); }

  .sticker {
    width: var(--sticker-size);
    height: var(--sticker-size);
    border-radius: 6px; /* Rounded stickers */
    position: relative;
    background-color: #ccc;
    /* Advanced Glossy Plastic Look */
    box-shadow: 
      inset 0 0 0 1px rgba(0,0,0,0.1),
      inset 2px 2px 6px rgba(255,255,255,0.5),
      inset -2px -2px 6px rgba(0,0,0,0.3),
      0 2px 4px rgba(0,0,0,0.4); /* Drop shadow for depth */
    transition: background-color 0.3s ease, transform 0.2s;
    overflow: hidden;
  }

  /* Glossy Reflection Overlay */
  .sticker::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 6px;
    background: linear-gradient(135deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.1) 30%, rgba(0,0,0,0) 100%);
    pointer-events: none;
  }

  /* Sticker Colors (Vibrant & Professional) */
  .sticker.white { background: #fdfdfd; }
  .sticker.yellow { background: #f1c40f; }
  .sticker.green { background: #2ecc71; }
  .sticker.blue { background: #3498db; }
  .sticker.red { background: #e74c3c; }
  .sticker.orange { background: #e67e22; }

  /* Hint Animation */
  .sticker.hint-active {
    animation: pulse 1.5s infinite ease-in-out;
    z-index: 10;
    box-shadow: 
      inset 0 0 0 1px rgba(0,0,0,0.1),
      0 0 20px var(--accent),
      0 0 40px var(--accent);
    border: 2px solid #fff;
  }
  @keyframes pulse {
    0% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.1); filter: brightness(1.5); }
    100% { transform: scale(1); filter: brightness(1); }
  }

  /* --- Controls --- */
  .controls-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 100%;
    max-width: 700px;
  }

  /* Size Selector */
  .size-group {
    background: var(--bg-panel);
    padding: 6px;
    border-radius: 16px;
    display: flex;
    gap: 8px;
    border: 1px solid var(--border);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .size-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-weight: 700;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    font-family: var(--font-mono);
    letter-spacing: 0.5px;
  }

  .size-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
  
  .size-btn.active {
    background: var(--accent);
    color: #000;
    box-shadow: 0 0 15px var(--accent-glow);
    font-weight: 800;
  }

  /* Action Buttons */
  .actions-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 32px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--bg-panel);
    color: var(--text-main);
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    font-family: var(--font-ui);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }

  .btn svg { width: 18px; height: 18px; stroke-width: 2; }

  .btn:hover { 
    transform: translateY(-2px); 
    border-color: var(--border-hover);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    background: rgba(255,255,255,0.08);
  }
  .btn:active { transform: translateY(1px); }

  .btn-primary {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    box-shadow: 0 0 20px var(--accent-glow);
  }
  .btn-primary:hover { 
    background: #fff; 
    border-color: #fff; 
    color: #000; 
    box-shadow: 0 0 30px var(--accent);
  }

  .btn-danger { color: var(--danger); border-color: rgba(255, 71, 87, 0.3); }
  .btn-danger:hover { background: rgba(255, 71, 87, 0.15); border-color: var(--danger); }

  /* --- Formula Panel --- */
  .panel {
    width: 100%;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: all 0.3s ease;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }

  .panel-header {
    padding: 16px 24px;
    background: rgba(255,255,255,0.02);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: background 0.2s;
  }
  .panel-header:hover { background: rgba(255,255,255,0.04); }

  .panel-title {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
  }

  .panel-content {
    padding: 24px;
    max-height: 220px;
    overflow-y: auto;
    display: block;
  }

  .formula-list {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .formula-tag {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    background: rgba(0, 242, 255, 0.08);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
    border: 1px solid transparent;
  }
  .formula-tag:hover { background: rgba(0, 242, 255, 0.2); border-color: var(--accent); color: #fff; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

  .panel-footer {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
  }
  .panel-footer b { color: var(--warning); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

  /* Responsive */
  @media (max-width: 600px) {
    :root { --cube-size: 200px; --sticker-size: 56px; }
    .main-container { padding: 20px 12px; gap: 20px; }
    .actions-row { width: 100%; }
    .btn { flex: 1; justify-content: center; padding: 12px; font-size: 14px; }
    .stat-box { padding: 0 10px; }
    .stat-val { font-size: 18px; }
    .stat-val.timer { font-size: 22px; }
    .header { padding: 0 16px; }
    .brand { font-size: 14px; }
  }

</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="brand">
    <div class="brand-icon">
      <div class="bi-1"></div><div class="bi-2"></div>
      <div class="bi-3"></div><div class="bi-4"></div>
    </div>
    THE <span>CUBE</span>
  </div>
  <div class="version-tag">PRO</div>
</header>

<!-- Main -->
<main class="main-container">

  <!-- Stats -->
  <div class="stats-hud">
    <div class="stat-box">
      <div class="stat-label">Moves</div>
      <div class="stat-val" id="moveCount">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Time</div>
      <div class="stat-val timer" id="timer">00:00</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Best</div>
      <div class="stat-val" id="bestTime">--:--</div>
    </div>
  </div>

  <!-- 3D Stage -->
  <div class="stage">
    <div class="cube-wrapper auto-spin" id="cubeScene">
      <!-- Faces injected by JS -->
    </div>
  </div>

  <!-- Controls -->
  <div class="controls-area">
    
    <!-- Size Selector -->
    <div class="size-group">
      <button class="size-btn" data-size="2">2×2</button>
      <button class="size-btn active" data-size="3">3×3</button>
      <button class="size-btn" data-size="4">4×4</button>
      <button class="size-btn" data-size="5">5×5</button>
    </div>

    <!-- Actions -->
    <div class="actions-row">
      <button class="btn btn-primary" id="btnScramble">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l-5 5M4 4l5 5"/></svg>
        Scramble
      </button>
      <button class="btn" id="btnUndo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
        Undo
      </button>
      <button class="btn" id="btnHint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Hint
      </button>
      <button class="btn btn-danger" id="btnReset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        Reset
      </button>
    </div>
  </div>

  <!-- Formula Panel -->
  <div class="panel">
    <div class="panel-header" id="panelToggle">
      <span class="panel-title">Scramble Formula</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </div>
    <div class="panel-content" id="panelContent">
      <div class="formula-list" id="formulaList">
        <span style="color:var(--text-muted); font-size:13px;">Press <b style="color:var(--accent)">Scramble</b> to start</span>
      </div>
      <div class="panel-footer">
        <b>Tip:</b> Click moves to replay them. Notation: R=Right, L=Left, U=Up, D=Down, F=Front, B=Back. Use <b>'</b> for counter-clockwise.
      </div>
    </div>
  </div>

</main>

<script>
(function() {
  // --- CONFIG & STATE ---
  let cubeSize = 3;
  let moveCount = 0;
  let timerInterval = null;
  let startTime = null;
  let bestTime = null;
  let scrambleMoves = [];
  let moveHistory = [];
  let cubeState = null;
  
  // Interaction State
  let isDragging = false;
  let rotX = -20;
  let rotY = -30;
  let lastMouse = { x: 0, y: 0 };
  let isPlaying = false;

  const FACE_NAMES = ['U', 'D', 'F', 'B', 'R', 'L'];
  const FACE_COLORS = {
    U: 'white', D: 'yellow', F: 'green', B: 'blue', R: 'red', L: 'orange'
  };

  // --- INIT ---
  function init() {
    cubeState = createSolvedState(cubeSize);
    buildCube();
    renderCubeState();
    setupEvents();
  }

  // --- CUBE LOGIC ---
  function createSolvedState(n) {
    const state = {};
    FACE_NAMES.forEach((face, fi) => {
      state[face] = [];
      for (let i = 0; i < n * n; i++) state[face].push(fi);
    });
    return state;
  }

  function cloneState(state) {
    const clone = {};
    FACE_NAMES.forEach(f => clone[f] = [...state[f]]);
    return clone;
  }

  // --- RENDERER ---
  function buildCube() {
    const scene = document.getElementById('cubeScene');
    scene.innerHTML = '';
    
    // Adjust CSS vars for size
    // Max cube size 260px. Min sticker size 20px.
    const totalGap = (cubeSize - 1) * 6; // 6px gap
    const size = 260;
    const sSize = (size - totalGap) / cubeSize;
    
    document.documentElement.style.setProperty('--cube-size', size + 'px');
    document.documentElement.style.setProperty('--sticker-size', sSize + 'px');

    FACE_NAMES.forEach((faceName) => {
      const faceEl = document.createElement('div');
      faceEl.className = `face face-${faceName.toLowerCase()}`;
      faceEl.style.gridTemplateColumns = `repeat(${cubeSize}, var(--sticker-size))`;
      faceEl.style.gridTemplateRows = `repeat(${cubeSize}, var(--sticker-size))`;

      for (let i = 0; i < cubeSize * cubeSize; i++) {
        const sticker = document.createElement('div');
        sticker.className = 'sticker';
        sticker.dataset.face = faceName;
        sticker.dataset.index = i;
        updateStickerColor(sticker, cubeState[faceName][i]);
        faceEl.appendChild(sticker);
      }
      scene.appendChild(faceEl);
    });
  }

  function updateStickerColor(sticker, faceIdx) {
    sticker.className = 'sticker ' + FACE_COLORS[FACE_NAMES[faceIdx]];
  }

  function renderCubeState() {
    const stickers = document.querySelectorAll('.sticker');
    stickers.forEach(s => {
      const face = s.dataset.face;
      const idx = parseInt(s.dataset.index);
      updateStickerColor(s, cubeState[face][idx]);
    });
  }

  // --- ROTATION LOGIC ---
  function rotateFace(state, face, clockwise) {
    const n = cubeSize;
    const result = cloneState(state);

    // 1. Rotate the face stickers themselves
    const faceArr = result[face].slice();
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        const idx = r * n + c;
        let nr, nc;
        if (clockwise) { nr = c; nc = n - 1 - r; }
        else { nr = n - 1 - c; nc = r; }
        result[face][nr * n + nc] = faceArr[idx];
      }
    }

    // 2. Rotate Adjacent Edges
    if (n === 3) {
      rotateEdges3x3(result, face, clockwise);
    } else {
      // Simplified simulation for 4x4/5x5
      rotateEdgesNxN(result, face, clockwise, 0); 
    }

    return result;
  }

  function rotateEdges3x3(state, face, clockwise) {
    const n = 3;
    const temp = new Array(n * 4);

    const getStrip = (f, type) => {
      const arr = [];
      for(let i=0; i<n; i++) {
        if(type==='top') arr.push(state[f][i]);
        else if(type==='bottom') arr.push(state[f][(n-1)*n + i]);
        else if(type==='left') arr.push(state[f][i*n]);
        else if(type==='right') arr.push(state[f][i*n + (n-1)]);
      }
      return arr;
    };

    const setStrip = (f, type, arr) => {
      for(let i=0; i<n; i++) {
        if(type==='top') state[f][i] = arr[i];
        else if(type==='bottom') state[f][(n-1)*n + i] = arr[i];
        else if(type==='left') state[f][i*n] = arr[i];
        else if(type==='right') state[f][i*n + (n-1)] = arr[i];
      }
    };

    if (face === 'R') {
      temp[0]=getStrip('U','right'); temp[1]=getStrip('F','right');
      temp[2]=getStrip('D','right'); temp[3]=getStrip('B','left').reverse();
      
      if(clockwise) {
        setStrip('U','right', temp[3]); setStrip('F','right', temp[0]);
        setStrip('D','right', temp[1]); setStrip('B','left', temp[2].reverse());
      } else {
        setStrip('U','right', temp[1]); setStrip('F','right', temp[2]);
        setStrip('D','right', temp[3]); setStrip('B','left', temp[0].reverse());
      }
    } 
    else if (face === 'L') {
      temp[0]=getStrip('U','left'); temp[1]=getStrip('F','left');
      temp[2]=getStrip('D','left'); temp[3]=getStrip('B','right').reverse();
      
      if(clockwise) {
        setStrip('U','left', temp[3]); setStrip('F','left', temp[0]);
        setStrip('D','left', temp[1]); setStrip('B','right', temp[2].reverse());
      } else {
        setStrip('U','left', temp[1]); setStrip('F','left', temp[2]);
        setStrip('D','left', temp[3]); setStrip('B','right', temp[0].reverse());
      }
    }
    else if (face === 'U') {
      temp[0]=getStrip('F','top'); temp[1]=getStrip('R','top');
      temp[2]=getStrip('B','top'); temp[3]=getStrip('L','top');
      
      if(clockwise) {
        setStrip('F','top', temp[3]); setStrip('R','top', temp[0]);
        setStrip('B','top', temp[1]); setStrip('L','top', temp[2]);
      } else {
        setStrip('F','top', temp[1]); setStrip('R','top', temp[2]);
        setStrip('B','top', temp[3]); setStrip('L','top', temp[0]);
      }
    }
    else if (face === 'D') {
      temp[0]=getStrip('F','bottom'); temp[1]=getStrip('R','bottom');
      temp[2]=getStrip('B','bottom'); temp[3]=getStrip('L','bottom');
      
      if(clockwise) {
        setStrip('F','bottom', temp[1]); setStrip('R','bottom', temp[2]);
        setStrip('B','bottom', temp[3]); setStrip('L','bottom', temp[0]);
      } else {
        setStrip('F','bottom', temp[3]); setStrip('R','bottom', temp[0]);
        setStrip('B','bottom', temp[1]); setStrip('L','bottom', temp[2]);
      }
    }
    else if (face === 'F') {
      temp[0]=getStrip('U','bottom').reverse(); temp[1]=getStrip('R','left').reverse();
      temp[2]=getStrip('D','top'); temp[3]=getStrip('L','right');
      
      if(clockwise) {
        setStrip('U','bottom', temp[3].reverse()); setStrip('R','left', temp[0].reverse());
        setStrip('D','top', temp[1]); setStrip('L','right', temp[2]);
      } else {
        setStrip('U','bottom', temp[1].reverse()); setStrip('R','left', temp[2].reverse());
        setStrip('D','top', temp[3]); setStrip('L','right', temp[0]);
      }
    }
    else if (face === 'B') {
      temp[0]=getStrip('U','top'); temp[1]=getStrip('R','right');
      temp[2]=getStrip('D','bottom').reverse(); temp[3]=getStrip('L','left');
      
      if(clockwise) {
        setStrip('U','top', temp[1]); setStrip('R','right', temp[2]);
        setStrip('D','bottom', temp[3].reverse()); setStrip('L','left', temp[0]);
      } else {
        setStrip('U','top', temp[3]); setStrip('R','right', temp[0]);
        setStrip('D','bottom', temp[1].reverse()); setStrip('L','left', temp[2]);
      }
    }
  }

  function rotateEdgesNxN(state, face, clockwise, layerIdx) {
    rotateEdges3x3(state, face, clockwise);
  }

  // --- GAMEPLAY ---
  function generateScramble(n) {
    const moves = [];
    const faces = ['U', 'D', 'F', 'B', 'R', 'L'];
    const mods = ['', "'", '2'];
    const count = n === 2 ? 8 : n === 3 ? 20 : n === 4 ? 30 : 35;
    let lastFace = '';
    
    for (let i = 0; i < count; i++) {
      let face;
      do { face = faces[Math.floor(Math.random() * faces.length)]; } while (face === lastFace);
      lastFace = face;
      moves.push(face + mods[Math.floor(Math.random() * mods.length)]);
    }
    return moves;
  }

  function applyMove(state, moveStr) {
    const face = moveStr[0];
    const mod = moveStr.slice(1);
    let clockwise = mod !== "'";
    let times = mod === '2' ? 2 : 1;
    
    let res = state;
    for(let i=0; i<times; i++) res = rotateFace(res, face, clockwise);
    return res;
  }

  function scramble() {
    stopTimer();
    cubeState = createSolvedState(cubeSize);
    scrambleMoves = generateScramble(cubeSize);
    moveHistory = [];
    moveCount = 0;
    updateUI();

    scrambleMoves.forEach(m => cubeState = applyMove(cubeState, m));
    renderCubeState();
    updateFormula();
    startTimer();
  }

  function undoMove() {
    if (moveHistory.length === 0) return;
    const last = moveHistory.pop();
    const face = last[0];
    const mod = last.slice(1);
    let clockwise = (mod === "'"); 
    let times = mod === '2' ? 2 : 1;
    
    let state = cubeState;
    for(let i=0; i<times; i++) state = rotateFace(state, face, clockwise);
    
    cubeState = state;
    moveCount = moveHistory.length;
    updateUI();
    renderCubeState();
  }

  function resetCube() {
    stopTimer();
    cubeState = createSolvedState(cubeSize);
    scrambleMoves = [];
    moveHistory = [];
    moveCount = 0;
    updateUI();
    buildCube();
    renderCubeState();
    updateFormula();
    resetTimer();
  }

  function showHint() {
    document.querySelectorAll('.sticker').forEach(s => s.classList.remove('hint-active'));
    const stickers = document.querySelectorAll('.sticker');
    const random = stickers[Math.floor(Math.random() * stickers.length)];
    if(random) random.classList.add('hint-active');
  }

  // --- TIMER & UI ---
  function startTimer() {
    stopTimer();
    startTime = Date.now();
    timerInterval = setInterval(() => {
      const diff = Math.floor((Date.now() - startTime) / 1000);
      const m = Math.floor(diff/60).toString().padStart(2,'0');
      const s = (diff%60).toString().padStart(2,'0');
      document.getElementById('timer').textContent = `${m}:${s}`;
    }, 100);
  }

  function stopTimer() {
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = null;
  }

  function resetTimer() {
    stopTimer();
    document.getElementById('timer').textContent = "00:00";
  }

  function updateUI() {
    document.getElementById('moveCount').textContent = moveCount;
  }

  function updateFormula() {
    const list = document.getElementById('formulaList');
    list.innerHTML = '';
    if(scrambleMoves.length === 0) {
      list.innerHTML = '<span style="color:var(--text-muted); font-size:13px;">Press <b style="color:var(--accent)">Scramble</b> to start</span>';
      return;
    }
    scrambleMoves.forEach((m, i) => {
      const tag = document.createElement('div');
      tag.className = 'formula-tag';
      tag.textContent = m;
      tag.onclick = () => playScramble(i);
      list.appendChild(tag);
    });
  }

  async function playScramble(index) {
    if(isPlaying) return;
    isPlaying = true;
    cubeState = createSolvedState(cubeSize);
    moveHistory = [];
    moveCount = 0;
    
    for(let i=0; i<=index; i++) {
      cubeState = applyMove(cubeState, scrambleMoves[i]);
      moveHistory.push(scrambleMoves[i]);
      moveCount++;
      renderCubeState();
      updateUI();
      await new Promise(r => setTimeout(r, 250));
    }
    isPlaying = false;
  }

  // --- INTERACTION ---
  function setupEvents() {
    const scene = document.getElementById('cubeScene');
    
    const onDown = (e) => {
      isDragging = true;
      lastMouse = { x: e.clientX || e.touches[0].clientX, y: e.clientY || e.touches[0].clientY };
      scene.classList.remove('auto-spin');
    };
    
    const onMove = (e) => {
      if(!isDragging) return;
      const x = e.clientX || e.touches[0].clientX;
      const y = e.clientY || e.touches[0].clientY;
      const dx = x - lastMouse.x;
      const dy = y - lastMouse.y;
      rotY += dx * 0.5;
      rotX -= dy * 0.5;
      rotX = Math.max(-89, Math.min(89, rotX));
      scene.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
      lastMouse = { x, y };
    };
    
    const onUp = () => { isDragging = false; };

    scene.addEventListener('mousedown', onDown);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    scene.addEventListener('touchstart', onDown);
    document.addEventListener('touchmove', onMove);
    document.addEventListener('touchend', onUp);

    document.getElementById('btnScramble').onclick = scramble;
    document.getElementById('btnUndo').onclick = undoMove;
    document.getElementById('btnReset').onclick = resetCube;
    document.getElementById('btnHint').onclick = showHint;

    document.querySelectorAll('.size-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        cubeSize = parseInt(btn.dataset.size);
        resetCube();
      };
    });

    const panel = document.getElementById('panelContent');
    document.getElementById('panelToggle').onclick = () => {
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    };
  }

  // Start
  init();

})();
</script>
