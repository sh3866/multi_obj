<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Iconic Auto — Street Showcase</title>
<style>
    :root {
        /* Palette: Extracted from the vehicle livery */
        --bg-color: #fdfbf7;
        --bg-grain-opacity: 0.4;
        
        --livery-yellow: #FFD600;
        --livery-yellow-dark: #FBC02D;
        --livery-green: #00C853;
        --livery-green-dark: #009624;
        
        --chrome-light: #F5F5F5;
        --chrome-mid: #BDBDBD;
        --chrome-dark: #757575;
        
        --tire-black: #212121;
        --text-dark: #1E1E24;
        --text-muted: #555555;

        --shadow-soft: 0 20px 60px rgba(0,0,0,0.15);
        --shadow-sharp: 0 10px 20px rgba(0,0,0,0.2);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        overflow: hidden;
        background-color: var(--bg-color);
        color: var(--text-dark);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Grain Texture Overlay */
    body::before {
        content: "";
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 0;
        opacity: var(--bg-grain-opacity);
    }

    /* Layout Container */
    .showcase-container {
        width: 94vw;
        height: 92vh;
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        position: relative;
        z-index: 1;
    }

    /* Left Panel: The Stage */
    .visual-stage {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        /* Perspective setup for the 3D illusion */
        perspective: 1000px;
    }

    .svg-wrapper {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        /* Scale up to fill 60%+ height */
        transform: scale(1.1); 
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* The SVG Itself */
    #rickshaw-svg {
        width: 100%;
        height: 100%;
        max-width: 900px;
        overflow: visible;
    }

    /* Right Panel: Typography & Info */
    .info-panel {
        padding: 4rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        border-left: 1px solid rgba(0,0,0,0.05);
        box-shadow: var(--shadow-soft);
        transform: translateX(-40px); /* Overlap */
        border-radius: 24px 0 0 24px;
    }

    /* Typography */
    .header { margin-bottom: 3rem; }

    .tag {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 2.5px;
        color: var(--livery-green-dark);
        font-weight: 800;
        margin-bottom: 1rem;
        display: inline-block;
        background: rgba(0, 200, 83, 0.1);
        padding: 8px 16px;
        border-radius: 100px;
        border: 1px solid rgba(0, 200, 83, 0.2);
    }

    h1 {
        font-size: 3.5rem;
        line-height: 0.95;
        font-weight: 900;
        letter-spacing: -2px;
        color: var(--text-dark);
    }

    .content { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }

    .description {
        font-size: 1.1rem;
        line-height: 1.6;
        color: var(--text-muted);
        margin-bottom: 3rem;
        max-width: 90%;
    }

    /* Specs Grid */
    .specs-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
        padding-top: 2rem;
        border-top: 1px solid rgba(0,0,0,0.08);
    }

    .spec-item h3 {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #999;
        margin-bottom: 0.25rem;
    }

    .spec-item p {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--text-dark);
        letter-spacing: -0.5px;
    }

    /* Footer & UI Elements */
    .footer {
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 3rem;
        border-top: 1px solid rgba(0,0,0,0.08);
    }

    .price-tag {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--livery-green-dark);
        background: var(--livery-yellow);
        padding: 0.8rem 1.5rem;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(255, 214, 0, 0.4);
        transform: rotate(-2deg);
        display: inline-block;
    }

    /* Buttons */
    .controls { display: flex; gap: 1rem; }

    .btn {
        background: var(--text-dark);
        color: #fff;
        border: none;
        padding: 1rem 2rem;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-radius: 50px;
        box-shadow: var(--shadow-sharp);
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .btn:active { transform: translateY(1px); box-shadow: none; }

    .btn-accent {
        background: var(--livery-green);
        color: white;
    }
    
    .btn-accent:hover { background: var(--livery-green-dark); }

    /* Animations */
    @keyframes shake {
        0% { transform: translate(0, 0) rotate(0deg); }
        20% { transform: translate(3px, 3px) rotate(2deg); }
        40% { transform: translate(-3px, -3px) rotate(-2deg); }
        60% { transform: translate(3px, -3px) rotate(2deg); }
        80% { transform: translate(-3px, 3px) rotate(-2deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
    }

    .horn-active {
        animation: shake 0.15s infinite;
    }

    /* Responsive */
    @media (max-width: 1000px) {
        .showcase-container {
            grid-template-columns: 1fr;
            grid-template-rows: 1fr 1fr;
            height: 100vh;
            width: 100vw;
        }
        .info-panel { 
            border-left: none; 
            border-top: 1px solid rgba(0,0,0,0.1);
            transform: none;
            border-radius: 24px 24px 0 0;
            padding: 2rem;
            margin-top: -40px; /* Overlap visual */
        }
        .visual-stage { height: 60vh; }
        .svg-wrapper { transform: scale(0.85); }
        h1 { font-size: 2.5rem; }
        .specs-grid { grid-template-columns: 1fr; gap: 1rem; }
    }
</style>
</head>
<body>

<div class="showcase-container">
    <!-- Left Panel: Visual -->
    <div class="visual-stage">
        <div class="svg-wrapper">
            <!-- RECONSTRUCTED SVG: 3/4 Perspective, Unified Strokes -->
            <svg id="rickshaw-svg" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Gradients -->
                    <linearGradient id="grad-yellow-side" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#FFEB3B" />
                        <stop offset="100%" stop-color="#FBC02D" />
                    </linearGradient>
                    <linearGradient id="grad-yellow-front" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#FBC02D" />
                        <stop offset="100%" stop-color="#F57F17" />
                    </linearGradient>
                    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#00E676" />
                        <stop offset="100%" stop-color="#00C853" />
                    </linearGradient>
                    <linearGradient id="grad-green-front" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#00C853" />
                        <stop offset="100%" stop-color="#00600F" />
                    </linearGradient>
                    <linearGradient id="grad-chrome" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#FFFFFF" />
                        <stop offset="40%" stop-color="#BDBDBD" />
                        <stop offset="100%" stop-color="#616161" />
                    </linearGradient>
                    <linearGradient id="grad-glass" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#E0F7FA" stop-opacity="0.9" />
                        <stop offset="100%" stop-color="#00BCD4" stop-opacity="0.6" />
                    </linearGradient>
                    <radialGradient id="grad-tire" cx="50%" cy="50%" r="50%">
                        <stop offset="80%" stop-color="#212121" />
                        <stop offset="100%" stop-color="#000000" />
                    </radialGradient>

                    <!-- Reusable Wheel Component -->
                    <g id="wheel">
                        <!-- Tire -->
                        <circle cx="0" cy="0" r="60" fill="url(#grad-tire)" stroke="#111" stroke-width="4"/>
                        <!-- Rim -->
                        <circle cx="0" cy="0" r="40" fill="url(#grad-chrome)" stroke="#444" stroke-width="2"/>
                        <!-- Hub -->
                        <circle cx="0" cy="0" r="10" fill="#333" />
                        <!-- Spokes (Simplified Vector) -->
                        <path d="M0,-40 L0,40 M-35,-20 L35,20 M-35,20 L35,-20" stroke="#999" stroke-width="5" stroke-linecap="round"/>
                    </g>
                </defs>

                <!-- Ground Shadow (Organic) -->
                <ellipse cx="430" cy="540" rx="260" ry="35" fill="rgba(0,0,0,0.35)" filter="blur(10px)" />

                <!-- === VEHICLE GROUP === -->
                <g id="vehicle" stroke-linejoin="round" stroke-linecap="round">
                    
                    <!-- 1. REAR AXLE & WHEELS -->
                    <!-- Left Rear Wheel (Background) -->
                    <use href="#wheel" x="260" y="480" />
                    
                    <!-- Right Rear Wheel (Foreground - Larger due to perspective) -->
                    <use href="#wheel" x="380" y="480" transform="scale(1.1)" />

                    <!-- Axle Bar -->
                    <rect x="250" y="470" width="160" height="10" rx="5" fill="url(#grad-chrome)" />

                    <!-- 2. MAIN CABIN (3/4 Perspective) -->
                    <!-- Side Panel (Yellow) -->
                    <path d="M250,260 L520,280 L530,460 L250,460 Z" fill="url(#grad-yellow-side)" stroke="#F57F17" stroke-width="2" />
                    
                    <!-- Green Stripe (Side) -->
                    <path d="M250,330 L520,350 L530,460 L250,460 Z" fill="url(#grad-green)" stroke="#00600F" stroke-width="2" />

                    <!-- Front Face (Yellow) -->
                    <path d="M520,280 L600,300 L610,480 L530,460 Z" fill="url(#grad-yellow-front)" stroke="#F57F17" stroke-width="2" />
                    
                    <!-- Green Stripe (Front) -->
                    <path d="M520,350 L600,370 L610,480 L530,460 Z" fill="url(#grad-green-front)" stroke="#00600F" stroke-width="2" />

                    <!-- 3. ROOF CANOPY -->
                    <!-- Top Surface -->
                    <path d="M240,260 L510,280 L530,190 L260,170 Z" fill="#FFEB3B" stroke="#FBC02D" stroke-width="2" />
                    <!-- Front Face (Yellow) -->
                    <path d="M510,280 L590,300 L590,210 L530,190 Z" fill="#FBC02D" stroke="#F57F17" stroke-width="2" />
                    
                    <!-- Chrome Roof Trim -->
                    <path d="M240,260 L510,280" stroke="url(#grad-chrome)" stroke-width="6" />
                    <path d="M510,280 L590,300" stroke="url(#grad-chrome)" stroke-width="6" />

                    <!-- Support Poles -->
                    <line x1="250" y1="260" x2="260" y2="170" stroke="url(#grad-chrome)" stroke-width="8" />
                    <line x1="520" y1="280" x2="530" y2="190" stroke="url(#grad-chrome)" stroke-width="8" />

                    <!-- 4. FRONT WHEEL & STEERING -->
                    <!-- Steering Column -->
                    <path d="M530,460 L600,460 L630,520" fill="none" stroke="#444" stroke-width="12" />
                    
                    <!-- Front Wheel -->
                    <use href="#wheel" x="630" y="520" />

                    <!-- 5. MUDGUARDS -->
                    <!-- Left Rear -->
                    <path d="M200,480 Q260,390 320,480" fill="none" stroke="#111" stroke-width="20" />
                    <!-- Right Rear -->
                    <path d="M320,480 Q380,390 440,480" fill="none" stroke="#111" stroke-width="20" />
                    <!-- Front -->
                    <path d="M550,520 Q630,430 710,520" fill="none" stroke="#111" stroke-width="20" />
                    
                    <!-- Mudguard Accents (Yellow Paint) -->
                    <path d="M550,520 Q630,430 710,520" fill="none" stroke="#FFD600" stroke-width="6" />

                    <!-- 6. DRIVER AREA & DETAILS -->
                    <!-- Windshield Side -->
                    <path d="M260,170 L510,280 L530,190 L280,80 Z" fill="url(#grad-glass)" stroke="#333" stroke-width="2" />
                    <!-- Windshield Front -->
                    <path d="M510,280 L590,300 L590,210 L530,190 Z" fill="url(#grad-glass)" stroke="#333" stroke-width="2" />
                    
                    <!-- Wiper -->
                    <path d="M530,280 L560,240" stroke="#222" stroke-width="3" />

                    <!-- Handlebars (Visible inside) -->
                    <g id="handlebars" stroke="#222" stroke-width="10" fill="none">
                        <path d="M600,200 L600,280" stroke-width="12" /> <!-- Stem -->
                        <path d="M570,200 Q600,180 630,200" /> <!-- Bar -->
                    </g>

                    <!-- Mirrors -->
                    <path d="M570,200 L540,150" stroke="#333" stroke-width="4" />
                    <ellipse cx="535" cy="145" rx="10" ry="4" fill="#333" transform="rotate(-20 535 145)" />
                    <path d="M630,200 L660,150" stroke="#333" stroke-width="4" />
                    <ellipse cx="665" cy="145" rx="10" ry="4" fill="#333" transform="rotate(20 665 145)" />

                    <!-- Headlamp (Front Face) -->
                    <g id="headlamp" transform="translate(605, 380)">
                        <path d="M-10,0 L0,10 L10,0 Z" fill="#333" />
                        <ellipse cx="15" cy="10" rx="16" ry="22" fill="#111" stroke="#555" stroke-width="2" />
                        <ellipse cx="20" cy="10" rx="10" ry="16" fill="#FFEB3B" id="lamp-glass" opacity="0.8" />
                        <!-- Beam -->
                        <polygon id="beam" points="20,10 1200,500 1200,-300" fill="url(#grad-glass)" opacity="0" style="mix-blend-mode: screen;" />
                    </g>

                    <!-- Ornamental Horns -->
                    <path d="M605,230 L600,190 L610,190 Z" fill="url(#grad-chrome)" stroke="#555" stroke-width="1" />
                    <circle cx="605" cy="185" r="6" fill="#333" />

                    <!-- Sticker Detail -->
                    <rect x="300" y="360" width="40" height="30" fill="#fff" stroke="#333" stroke-width="1" />
                    <text x="320" y="380" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">CNG</text>

                    <!-- License Plate -->
                    <rect x="560" y="460" width="55" height="28" fill="#fff" rx="3" stroke="#333" stroke-width="2" />
                    <text x="587" y="479" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">DL 1C 1234</text>
                </g>
            </svg>
        </div>
    </div>

    <!-- Right Panel: Info -->
    <div class="info-panel">
        <div class="header">
            <span class="tag">Urban Heritage</span>
            <h1>The Auto<br>Rickshaw</h1>
        </div>

        <div class="content">
            <p class="description">
                The undisputed king of South Asian transit. A three-wheeled marvel known for its yellow-and-green livery, high-pitched horn, and open-air canopy.
            </p>

            <div class="specs-grid">
                <div class="spec-item">
                    <h3>Configuration</h3>
                    <p>Delta 3-Wheel</p>
                </div>
                <div class="spec-item">
                    <h3>Engine</h3>
                    <p>3-Stroke / CNG</p>
                </div>
                <div class="spec-item">
                    <h3>Capacity</h3>
                    <p>3 Passengers</p>
                </div>
                <div class="spec-item">
                    <h3>Origin</h3>
                    <p>1970s India</p>
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="price-tag">₹30.00 / km</div>
            <div class="controls">
                <button class="btn btn-accent" onclick="toggleLights()">Lights</button>
                <button class="btn" onclick="honk()">Honk</button>
            </div>
        </div>
    </div>
</div>

<script>
    const rickshaw = document.getElementById('rickshaw-svg');
    const beam = document.getElementById('beam');
    const glass = document.getElementById('lamp-glass');

    let lightsOn = false;

    function toggleLights() {
        lightsOn = !lightsOn;
        if (lightsOn) {
            beam.style.opacity = '0.6';
            glass.style.fill = '#FFFF00';
            glass.style.opacity = '1';
        } else {
            beam.style.opacity = '0';
            glass.style.fill = '#FFEB3B';
            glass.style.opacity = '0.8';
        }
    }

    function honk() {
        rickshaw.classList.add('horn-active');
        setTimeout(() => {
            rickshaw.classList.remove('horn-active');
        }, 500);
    }
</script>

</body>
</html>
