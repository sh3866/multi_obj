<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Iconic Auto — Street Showcase</title>
<style>
    :root {
        /* Palette: Sunset & Street Grit */
        --bg-sunset-top: #ff7e5f;
        --bg-sunset-bottom: #feb47b;
        --text-dark: #1e1e24;
        --text-light: #f4f4f4;
        --accent-yellow: #f6d365;
        --accent-green: #3a7bd5; /* Blue-ish green for contrast or keep green? Let's go vibrant Green */
        --rickshaw-green: #009b4d;
        --rickshaw-yellow: #ffcc00;
        --ui-card-bg: rgba(255, 255, 255, 0.92);
        --shadow-card: 0 20px 50px rgba(0,0,0,0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        height: 100vh;
        overflow: hidden;
        background: linear-gradient(135deg, var(--bg-sunset-top), var(--bg-sunset-bottom));
        display: flex;
        justify-content: center;
        align-items: center;
        color: var(--text-dark);
    }

    /* Texture Overlay for "Street" feel */
    body::after {
        content: "";
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: -1;
    }

    /* Main Layout Container */
    .showcase-container {
        width: 92vw;
        height: 90vh;
        display: grid;
        grid-template-columns: 1.4fr 0.6fr; /* Shift balance: Vehicle Left, Text Right */
        position: relative;
        perspective: 1200px;
    }

    /* Left Panel: The Stage */
    .visual-stage {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        /* No background color here, let the body gradient shine */
    }

    /* The SVG Container */
    .svg-wrapper {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
        transform: scale(0.95);
    }

    #rickshaw-svg {
        width: 100%;
        height: 100%;
        max-width: 850px;
        filter: drop-shadow(0px 20px 30px rgba(0,0,0,0.4));
        transition: transform 0.3s ease;
    }

    /* Right Panel: Typography & Info */
    .info-panel {
        padding: 3rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        z-index: 20;
        background: var(--ui-card-bg);
        backdrop-filter: blur(10px);
        border-left: 1px solid rgba(255,255,255,0.5);
        box-shadow: var(--shadow-card);
        transform: translateX(-20px); /* Slight overlap effect */
    }

    .header {
        margin-bottom: 2rem;
    }

    .tag {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--rickshaw-green);
        font-weight: 800;
        margin-bottom: 0.5rem;
        display: inline-block;
        background: rgba(0, 155, 77, 0.1);
        padding: 6px 12px;
        border-radius: 20px;
        border: 1px solid rgba(0, 155, 77, 0.2);
    }

    h1 {
        font-size: 2.8rem; /* Reduced size per critique */
        line-height: 1;
        font-weight: 900;
        letter-spacing: -1.5px;
        color: var(--text-dark);
        margin-top: 0.5rem;
    }

    .content {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .description {
        font-size: 1rem;
        line-height: 1.6;
        color: #555;
        margin-bottom: 2rem;
        font-weight: 400;
    }

    /* Specs Grid: More whitespace */
    .specs-grid {
        display: grid;
        grid-template-columns: 1fr; /* Stack for cleaner look */
        gap: 1.5rem;
        padding-top: 2rem;
        border-top: 1px solid rgba(0,0,0,0.08);
    }

    .spec-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .spec-item h3 {
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #888;
    }

    .spec-item p {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--text-dark);
        font-family: 'Courier New', Courier, monospace;
    }

    .footer {
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 2rem;
        border-top: 1px solid rgba(0,0,0,0.08);
    }

    .price-tag {
        font-family: 'Courier New', Courier, monospace;
        font-weight: bold;
        font-size: 1.4rem;
        color: var(--rickshaw-green);
        background: #f0fdf4;
        padding: 0.6rem 1rem;
        border-radius: 6px;
        border: 1px dashed var(--rickshaw-green);
    }

    /* Buttons */
    .controls {
        display: flex;
        gap: 0.8rem;
    }

    .btn {
        background: var(--text-dark);
        color: #fff;
        border: none;
        padding: 0.8rem 1.5rem;
        cursor: pointer;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-radius: 50px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        transition: all 0.2s;
    }

    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    }

    .btn:active {
        transform: translateY(1px);
    }

    .btn-accent {
        background: var(--rickshaw-yellow);
        color: var(--text-dark);
    }

    /* Animation */
    @keyframes shake {
        0% { transform: translate(0, 0) rotate(0deg); }
        25% { transform: translate(2px, 2px) rotate(1deg); }
        50% { transform: translate(-2px, -2px) rotate(-1deg); }
        75% { transform: translate(2px, -2px) rotate(1deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
    }

    .horn-active {
        animation: shake 0.1s infinite;
    }

    /* Responsive */
    @media (max-width: 900px) {
        .showcase-container {
            grid-template-columns: 1fr;
            grid-template-rows: 1fr 1fr;
            height: 100vh;
            width: 100vw;
        }
        .info-panel { 
            border-left: none; 
            border-top: 1px solid rgba(0,0,0,0.1);
            transform: none;
            padding: 2rem;
        }
        .svg-wrapper { transform: scale(0.8); }
        h1 { font-size: 2rem; }
    }
</style>
</head>
<body>

<div class="showcase-container">
    <!-- Left Panel: Visual -->
    <div class="visual-stage">
        <div class="svg-wrapper">
            <!-- THE RICKSHAW SVG: Reconstructed Geometry -->
            <svg id="rickshaw-svg" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Body Gradients: 3/4 Perspective -->
                    <linearGradient id="bodyYellowSide" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#ffeb3b;stop-opacity:1" />
                        <stop offset="40%" style="stop-color:#fdd835;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#fbc02d;stop-opacity:1" />
                    </linearGradient>
                    
                    <linearGradient id="bodyYellowFront" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#fbc02d;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#f57f17;stop-opacity:1" />
                    </linearGradient>

                    <linearGradient id="stripeGreen" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#00c853;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#00600f;stop-opacity:1" />
                    </linearGradient>

                    <linearGradient id="chromeShine" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#b0bec5;stop-opacity:1" />
                        <stop offset="30%" style="stop-color:#ffffff;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#cfd8dc;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#78909c;stop-opacity:1" />
                    </linearGradient>

                    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#e0f7fa;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#00bcd4;stop-opacity:0.9" />
                    </linearGradient>
                    
                    <radialGradient id="tireRubber" cx="50%" cy="50%" r="50%">
                        <stop offset="75%" style="stop-color:#212121;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
                    </radialGradient>

                    <linearGradient id="wheelRim" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#e0e0e0" />
                        <stop offset="50%" style="stop-color:#9e9e9e" />
                        <stop offset="100%" style="stop-color:#616161" />
                    </linearGradient>

                    <filter id="innerShadow">
                        <feOffset dx="0" dy="4"/>
                        <feGaussianBlur stdDeviation="4" result="offset-blur"/>
                        <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                        <feFlood flood-color="black" flood-opacity="0.3" result="color"/>
                        <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                        <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
                    </filter>
                </defs>

                <!-- Ground Shadow -->
                <ellipse cx="420" cy="530" rx="220" ry="25" fill="rgba(0,0,0,0.3)" filter="blur(6px)" />

                <!-- === VEHICLE GROUP === -->
                <g id="vehicle-group">
                    
                    <!-- 1. REAR AXLE & WHEELS (Delta) -->
                    <!-- Connecting Axle Bar (Chrome) -->
                    <rect x="230" y="480" width="160" height="12" rx="6" fill="url(#chromeShine)" />
                    
                    <!-- Left Rear Wheel (Background) -->
                    <g transform="translate(260, 490)">
                        <circle r="65" fill="url(#tireRubber)" />
                        <circle r="45" fill="url(#wheelRim)" stroke="#555" stroke-width="2" />
                        <circle r="4" fill="#333" />
                        <!-- Spokes -->
                        <g stroke="#e0e0e0" stroke-width="4">
                            <line x1="0" y1="-45" x2="0" y2="45" />
                            <line x1="-39" y1="-22" x2="39" y2="22" />
                            <line x1="-39" y1="22" x2="39" y2="-22" />
                        </g>
                    </g>

                    <!-- Right Rear Wheel (Foreground - Perspective) -->
                    <g transform="translate(370, 490)">
                        <circle r="65" fill="url(#tireRubber)" />
                        <circle r="45" fill="url(#wheelRim)" stroke="#555" stroke-width="2" />
                        <circle r="4" fill="#333" />
                        <g stroke="#e0e0e0" stroke-width="4">
                            <line x1="0" y1="-45" x2="0" y2="45" />
                            <line x1="-39" y1="-22" x2="39" y2="22" />
                            <line x1="-39" y1="22" x2="39" y2="-22" />
                        </g>
                    </g>

                    <!-- 2. MAIN CABIN BODY -->
                    <!-- Side Panel (Yellow) - Connects to chassis -->
                    <path d="M260,260 L530,280 L540,460 L260,460 Z" fill="url(#bodyYellowSide)" />
                    
                    <!-- Green Stripe (Side) -->
                    <path d="M260,330 L530,350 L540,460 L260,460 Z" fill="url(#stripeGreen)" />
                    
                    <!-- Front Face (Yellow) - Depth -->
                    <path d="M530,280 L610,300 L620,480 L540,460 Z" fill="url(#bodyYellowFront)" />
                    
                    <!-- Green Stripe (Front) -->
                    <path d="M530,350 L610,370 L620,480 L540,460 Z" fill="url(#stripeGreen)" filter="url(#innerShadow)" />

                    <!-- Door Line Detail -->
                    <path d="M350,265 L350,460" stroke="#d4af37" stroke-width="2" opacity="0.5" />
                    <path d="M360,265 L360,460" stroke="#d4af37" stroke-width="2" opacity="0.5" />

                    <!-- 3. ROOF CANOPY -->
                    <!-- Top Roof Surface -->
                    <path d="M250,260 L520,280 L540,200 L270,180 Z" fill="#ffeb3b" />
                    <!-- Roof Front Face (Yellow) -->
                    <path d="M520,280 L600,300 L600,220 L540,200 Z" fill="#fbc02d" />
                    <!-- Roof Side Trim (Chrome) -->
                    <path d="M250,260 L520,280 L525,285 L255,265 Z" fill="url(#chromeShine)" />
                    
                    <!-- Roof Support Poles (Chrome) -->
                    <line x1="260" y1="260" x2="270" y2="180" stroke="url(#chromeShine)" stroke-width="8" />
                    <line x1="520" y1="280" x2="540" y2="200" stroke="url(#chromeShine)" stroke-width="8" />

                    <!-- 4. FRONT WHEEL (Single, Steering) -->
                    <!-- Strut/Frame connecting cabin to wheel -->
                    <path d="M540,460 L560,460 L600,500 L600,530" fill="none" stroke="#333" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M540,460 L560,460 L600,500 L600,530" fill="none" stroke="#555" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

                    <g transform="translate(600, 530)">
                        <circle r="65" fill="url(#tireRubber)" />
                        <circle r="45" fill="url(#wheelRim)" stroke="#555" stroke-width="2" />
                        <circle r="4" fill="#333" />
                        <g stroke="#e0e0e0" stroke-width="4">
                            <line x1="0" y1="-45" x2="0" y2="45" />
                            <line x1="-39" y1="-22" x2="39" y2="22" />
                            <line x1="-39" y1="22" x2="39" y2="-22" />
                        </g>
                    </g>

                    <!-- 5. MUDGUARDS -->
                    <!-- Rear Left -->
                    <path d="M200,490 Q260,400 320,490" fill="none" stroke="#222" stroke-width="18" stroke-linecap="round" />
                    <!-- Rear Right -->
                    <path d="M310,490 Q370,400 430,490" fill="none" stroke="#111" stroke-width="18" stroke-linecap="round" />
                    <!-- Front -->
                    <path d="M530,530 Q600,440 670,530" fill="none" stroke="#222" stroke-width="18" stroke-linecap="round" />
                    
                    <!-- Mudguard Highlights (Yellow paint) -->
                    <path d="M530,530 Q600,440 670,530" fill="none" stroke="#ffcc00" stroke-width="4" stroke-linecap="round" opacity="0.8" />

                    <!-- 6. DRIVER AREA & DETAILS -->
                    <!-- Windshield (Side) -->
                    <path d="M270,180 L520,280 L540,200 L290,100 Z" fill="url(#glassReflect)" stroke="#333" stroke-width="2" opacity="0.85" />
                    <!-- Windshield (Front Face) -->
                    <path d="M520,280 L600,300 L600,220 L540,200 Z" fill="url(#glassReflect)" stroke="#333" stroke-width="2" opacity="0.85" />
                    
                    <!-- Windshield Wiper -->
                    <path d="M540,280 L560,250" stroke="#111" stroke-width="3" />

                    <!-- Handlebars -->
                    <g id="handlebars">
                        <!-- Stem -->
                        <path d="M580,280 L600,200" stroke="#444" stroke-width="12" stroke-linecap="round" />
                        <!-- Bar -->
                        <path d="M570,200 Q600,180 630,200" fill="none" stroke="#222" stroke-width="10" stroke-linecap="round" />
                        <!-- Grips -->
                        <circle cx="570" cy="200" r="8" fill="#111" />
                        <circle cx="630" cy="200" r="8" fill="#111" />
                    </g>

                    <!-- Mirrors -->
                    <g id="mirrors">
                        <!-- Left Mirror -->
                        <path d="M570,200 L550,160" stroke="#333" stroke-width="4" />
                        <ellipse cx="545" cy="155" rx="12" ry="6" fill="#333" transform="rotate(-30 545 155)" />
                        <!-- Right Mirror -->
                        <path d="M630,200 L650,160" stroke="#333" stroke-width="4" />
                        <ellipse cx="655" cy="155" rx="12" ry="6" fill="#333" transform="rotate(30 655 155)" />
                    </g>

                    <!-- Headlamp (Front Face) -->
                    <g id="headlamp" transform="translate(610, 360)">
                        <!-- Bracket -->
                        <path d="M-10,0 L0,10 L10,0 Z" fill="#333" />
                        <!-- Housing -->
                        <ellipse cx="20" cy="10" rx="18" ry="25" fill="#222" stroke="#555" stroke-width="2" />
                        <!-- Glass -->
                        <ellipse cx="25" cy="10" rx="12" ry="20" fill="#ffeb3b" id="lamp-glass" opacity="0.8" />
                        <!-- Light Beam -->
                        <polygon id="beam" points="25,10 1000,400 1000,-200" fill="url(#glassReflect)" opacity="0" style="mix-blend-mode: screen;" />
                    </g>

                    <!-- Ornamental Horns (The "Tuk") -->
                    <g id="horns" transform="translate(610, 240)">
                        <path d="M0,0 L-5,-25 L5,-25 Z" fill="#ccc" stroke="#999" stroke-width="1" />
                        <circle cx="0" cy="-25" r="8" fill="#333" />
                    </g>

                    <!-- Registration Plate -->
                    <rect x="570" y="460" width="50" height="25" fill="#fff" rx="2" stroke="#333" stroke-width="1" />
                    <text x="595" y="477" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">DL 1C</text>

                </g>
            </svg>
        </div>
    </div>

    <!-- Right Panel: Info -->
    <div class="info-panel">
        <div class="header">
            <span class="tag">Urban Heritage</span>
            <h1>The Auto<br>Rickshaw</h1>
        </div>

        <div class="content">
            <p class="description">
                The undisputed king of South Asian transit. A three-wheeled marvel known for its yellow-and-green livery, high-pitched horn, and open-air canopy.
            </p>

            <div class="specs-grid">
                <div class="spec-item">
                    <h3>Configuration</h3>
                    <p>Delta 3-Wheel</p>
                </div>
                <div class="spec-item">
                    <h3>Engine</h3>
                    <p>3-Stroke / CNG</p>
                </div>
                <div class="spec-item">
                    <h3>Capacity</h3>
                    <p>3 Passengers</p>
                </div>
                <div class="spec-item">
                    <h3>Origin</h3>
                    <p>1970s India</p>
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="price-tag">₹30.00 / km</div>
            <div class="controls">
                <button class="btn btn-accent" onclick="toggleLights()">Lights</button>
                <button class="btn" onclick="honk()">Honk</button>
            </div>
        </div>
    </div>
</div>

<script>
    const rickshaw = document.getElementById('rickshaw-svg');
    const beam = document.getElementById('beam');
    const glass = document.getElementById('lamp-glass');

    let lightsOn = false;

    function toggleLights() {
        lightsOn = !lightsOn;
        if (lightsOn) {
            beam.style.opacity = '0.6';
            glass.style.fill = '#ffff00';
            glass.style.opacity = '1';
        } else {
            beam.style.opacity = '0';
            glass.style.fill = '#ffeb3b';
            glass.style.opacity = '0.8';
        }
    }

    function honk() {
        rickshaw.classList.add('horn-active');
        setTimeout(() => {
            rickshaw.classList.remove('horn-active');
        }, 500);
    }
</script>

</body>
</html>
