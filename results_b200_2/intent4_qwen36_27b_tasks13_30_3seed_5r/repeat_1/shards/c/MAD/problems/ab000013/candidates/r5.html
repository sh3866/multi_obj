<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Rickshaw | Design Showcase</title>
<style>
    :root {
        /* Palette: Extracted from vehicle livery */
        --livery-yellow: #FFD600;
        --livery-yellow-dark: #FBC02D;
        --livery-green: #00C853;
        --livery-green-dark: #00897B;
        
        --bg-color: #F2F0E9; /* Warm paper tone */
        --card-bg: #FFFFFF;
        
        --text-primary: #1A1A1A;
        --text-secondary: #666666;
        
        --shadow-card: 0 20px 60px rgba(0,0,0,0.08);
        --shadow-button: 0 4px 12px rgba(0,0,0,0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        overflow: hidden;
        background-color: var(--bg-color);
        color: var(--text-primary);
        display: flex;
        justify-content: center;
        align-items: center;
        /* Subtle texture */
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23000000' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    /* Main Layout Grid */
    .showcase-container {
        width: 95vw;
        height: 90vh;
        display: grid;
        /* 60% Visual Stage, 40% UI Card */
        grid-template-columns: 1.5fr 1fr; 
        gap: 3rem;
        align-items: center;
    }

    /* LEFT: Visual Stage */
    .visual-stage {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center; /* Center in its column, but SVG is shifted left */
        align-items: center;
    }

    .svg-wrapper {
        width: 110%; /* Slight overflow allowed */
        height: 110%;
        display: flex;
        justify-content: center;
        align-items: center;
        transform: scale(1);
        transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #rickshaw-svg {
        width: 100%;
        height: 100%;
        max-width: 1200px; /* Allow large scale */
        overflow: visible;
        filter: drop-shadow(0px 20px 30px rgba(0,0,0,0.2));
    }

    /* RIGHT: UI Card */
    .info-card {
        background: var(--card-bg);
        border-radius: 32px;
        padding: 3.5rem;
        height: 85%;
        box-shadow: var(--shadow-card);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        z-index: 10;
        border: 1px solid rgba(255,255,255,0.5);
    }

    /* Typography */
    .card-header { margin-bottom: 1rem; }

    .tag {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--livery-green-dark);
        background: rgba(0, 200, 83, 0.1);
        padding: 8px 16px;
        border-radius: 100px;
        display: inline-block;
        margin-bottom: 1rem;
    }

    h1 {
        font-size: 4rem;
        line-height: 0.9;
        font-weight: 900;
        letter-spacing: -2px;
        color: var(--text-primary);
        margin-bottom: 1.5rem;
    }

    .description {
        font-size: 1.1rem;
        line-height: 1.6;
        color: var(--text-secondary);
        max-width: 90%;
        margin-bottom: 2rem;
    }

    /* Specs */
    .specs-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
        border-top: 2px solid #F0F0F0;
        padding-top: 2rem;
        margin-bottom: 2rem;
    }

    .spec-item h3 {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #999;
        font-weight: 700;
        margin-bottom: 0.5rem;
    }

    .spec-item p {
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--text-primary);
    }

    /* Footer Controls */
    .card-footer {
        margin-top: auto;
    }

    .price-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
    }

    .price-tag {
        font-size: 2rem;
        font-weight: 800;
        color: var(--text-primary);
    }
    
    .price-sub {
        font-size: 1rem;
        color: var(--text-secondary);
        font-weight: 500;
    }

    .controls-row {
        display: flex;
        gap: 1rem;
        background: #F5F5F5;
        padding: 6px;
        border-radius: 18px;
    }

    .btn {
        flex: 1;
        border: none;
        padding: 1rem;
        border-radius: 14px;
        font-weight: 700;
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 0.2s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        background: transparent;
        color: var(--text-secondary);
    }

    .btn:hover {
        background: #fff;
        color: var(--text-primary);
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        transform: translateY(-2px);
    }

    .btn:active { transform: translateY(0); }

    /* Specific Button Colors derived from palette */
    .btn-primary {
        background-color: var(--livery-yellow);
        color: #000;
        box-shadow: 0 4px 12px rgba(255, 214, 0, 0.3);
    }
    .btn-primary:hover { background-color: #FFE64D; }

    .btn-secondary {
        background-color: var(--livery-green);
        color: #fff;
        box-shadow: 0 4px 12px rgba(0, 200, 83, 0.3);
    }
    .btn-secondary:hover { background-color: #00E676; }

    /* Animations */
    @keyframes shake {
        0% { transform: translate(0, 0); }
        20% { transform: translate(4px, 4px); }
        40% { transform: translate(-4px, -4px); }
        60% { transform: translate(4px, -4px); }
        80% { transform: translate(-4px, 4px); }
        100% { transform: translate(0, 0); }
    }

    .horn-active {
        animation: shake 0.2s infinite;
    }

    /* Responsive */
    @media (max-width: 1024px) {
        .showcase-container {
            grid-template-columns: 1fr;
            grid-template-rows: auto 1fr;
            height: 100vh;
            gap: 0;
            overflow-y: auto;
        }
        .visual-stage { height: 50vh; order: 2; }
        .info-card { 
            order: 1; 
            height: auto; 
            margin: 2rem; 
            box-shadow: none; 
            background: transparent; 
            border: none; 
            padding: 0;
        }
        h1 { font-size: 3rem; }
        .svg-wrapper { transform: scale(0.7); }
    }
</style>
</head>
<body>

<div class="showcase-container">
    
    <!-- LEFT: The Vehicle (Dominant) -->
    <div class="visual-stage">
        <div class="svg-wrapper">
            <svg id="rickshaw-svg" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- 3D Volume Gradients -->
                    <linearGradient id="grad-yellow-side" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#FFF59D" /> <!-- Highlight -->
                        <stop offset="40%" stop-color="#FFD600" /> <!-- Base -->
                        <stop offset="100%" stop-color="#F9A825" /> <!-- Shadow -->
                    </linearGradient>
                    
                    <linearGradient id="grad-yellow-front" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#FBC02D" />
                        <stop offset="100%" stop-color="#F57F17" />
                    </linearGradient>

                    <linearGradient id="grad-green-side" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#69F0AE" />
                        <stop offset="40%" stop-color="#00C853" />
                        <stop offset="100%" stop-color="#00897B" />
                    </linearGradient>

                    <linearGradient id="grad-green-front" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#00C853" />
                        <stop offset="100%" stop-color="#00600F" />
                    </linearGradient>

                    <linearGradient id="grad-chrome" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#9E9E9E" />
                        <stop offset="20%" stop-color="#FFFFFF" />
                        <stop offset="50%" stop-color="#BDBDBD" />
                        <stop offset="80%" stop-color="#FFFFFF" />
                        <stop offset="100%" stop-color="#616161" />
                    </linearGradient>

                    <radialGradient id="grad-tire" cx="50%" cy="50%" r="50%">
                        <stop offset="70%" stop-color="#263238" />
                        <stop offset="100%" stop-color="#102027" />
                    </radialGradient>

                    <linearGradient id="grad-glass" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#E0F7FA" stop-opacity="0.6" />
                        <stop offset="100%" stop-color="#00BCD4" stop-opacity="0.9" />
                    </linearGradient>

                    <!-- Filter for soft shadows -->
                    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
                        <feOffset dx="2" dy="5" result="offsetblur" />
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.3" />
                        </feComponentTransfer>
                        <feMerge> 
                            <feMergeNode />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                </defs>

                <!-- Ground Shadow -->
                <ellipse cx="400" cy="520" rx="300" ry="35" fill="rgba(0,0,0,0.15)" filter="blur(8px)" />

                <!-- === VEHICLE ASSEMBLY === -->
                <g id="vehicle-group" transform="translate(50, 0)"> <!-- Shifted slightly left -->

                    <!-- 1. REAR WHEELS (Perspective: Ellipses) -->
                    
                    <!-- Left Rear Wheel (Background) -->
                    <g transform="translate(250, 450) scale(0.8)">
                        <!-- Tire -->
                        <ellipse cx="0" cy="0" rx="60" ry="60" fill="url(#grad-tire)" stroke="#111" stroke-width="6"/>
                        <!-- Rim -->
                        <ellipse cx="0" cy="0" rx="35" ry="35" fill="url(#grad-chrome)" stroke="#444" stroke-width="2"/>
                        <!-- Hub -->
                        <circle cx="0" cy="0" r="8" fill="#333" />
                        <!-- Spokes (Simplified for side view) -->
                        <g stroke="#999" stroke-width="4">
                            <line x1="0" y1="-35" x2="0" y2="35" />
                            <line x1="-35" y1="0" x2="35" y2="0" />
                        </g>
                        <!-- Mudguard (Yellow) -->
                        <path d="M-60,0 A60,60 0 0,1 60,0" fill="none" stroke="url(#grad-yellow-side)" stroke-width="12" stroke-linecap="round" />
                    </g>

                    <!-- Right Rear Wheel (Foreground) -->
                    <g transform="translate(450, 480) scale(1.1)">
                         <!-- Tire -->
                        <ellipse cx="0" cy="0" rx="60" ry="60" fill="url(#grad-tire)" stroke="#111" stroke-width="6"/>
                        <!-- Rim -->
                        <ellipse cx="0" cy="0" rx="35" ry="35" fill="url(#grad-chrome)" stroke="#444" stroke-width="2"/>
                        <!-- Hub -->
                        <circle cx="0" cy="0" r="8" fill="#333" />
                        <!-- Spokes -->
                        <g stroke="#999" stroke-width="4">
                            <line x1="0" y1="-35" x2="0" y2="35" />
                            <line x1="-35" y1="0" x2="35" y2="0" />
                        </g>
                        <!-- Mudguard (Yellow) -->
                        <path d="M-60,0 A60,60 0 0,1 60,0" fill="none" stroke="url(#grad-yellow-side)" stroke-width="12" stroke-linecap="round" />
                    </g>

                    <!-- 2. MAIN CABIN (3/4 Perspective Geometry) -->
                    
                    <!-- Side Panel (Yellow) - The main body -->
                    <path d="M220,240 L480,260 L490,460 L220,460 Z" fill="url(#grad-yellow-side)" />
                    
                    <!-- Green Stripe (Side) -->
                    <path d="M220,320 L480,340 L490,460 L220,460 Z" fill="url(#grad-green-side)" />
                    
                    <!-- Side Decal/Text -->
                    <text x="260" y="420" font-family="Arial, sans-serif" font-weight="900" font-size="24" fill="#F57F17" transform="skewY(-5)">METRO</text>

                    <!-- Front Face (Yellow) - Angled -->
                    <path d="M480,260 L580,280 L590,480 L490,460 Z" fill="url(#grad-yellow-front)" />
                    
                    <!-- Green Stripe (Front) -->
                    <path d="M480,340 L580,360 L590,480 L490,460 Z" fill="url(#grad-green-front)" />

                    <!-- Chrome Trim (Ornamentation) -->
                    <path d="M220,320 L480,340" stroke="url(#grad-chrome)" stroke-width="3" />
                    <path d="M480,340 L580,360" stroke="url(#grad-chrome)" stroke-width="3" />

                    <!-- 3. ROOF CANOPY -->
                    <!-- Top Surface -->
                    <path d="M210,240 L470,260 L500,170 L230,150 Z" fill="#FFF59D" stroke="#FBC02D" stroke-width="1" />
                    <!-- Front Face (Yellow) -->
                    <path d="M470,260 L570,280 L570,190 L500,170 Z" fill="#FBC02D" />
                    
                    <!-- Roof Trim -->
                    <path d="M210,240 L470,260" stroke="url(#grad-chrome)" stroke-width="5" />
                    <path d="M470,260 L570,280" stroke="url(#grad-chrome)" stroke-width="5" />

                    <!-- Support Poles -->
                    <line x1="220" y1="240" x2="230" y2="150" stroke="url(#grad-chrome)" stroke-width="8" />
                    <line x1="480" y1="260" x2="500" y2="170" stroke="url(#grad-chrome)" stroke-width="8" />

                    <!-- 4. FRONT WHEEL & STEERING -->
                    <!-- Steering Column -->
                    <path d="M490,460 L580,460 L610,510" fill="none" stroke="#444" stroke-width="12" stroke-linecap="round"/>
                    
                    <!-- Front Wheel -->
                    <g transform="translate(610, 510)">
                        <ellipse cx="0" cy="0" rx="60" ry="60" fill="url(#grad-tire)" stroke="#111" stroke-width="6"/>
                        <ellipse cx="0" cy="0" rx="35" ry="35" fill="url(#grad-chrome)" stroke="#444" stroke-width="2"/>
                        <circle cx="0" cy="0" r="8" fill="#333" />
                        <g stroke="#999" stroke-width="4">
                            <line x1="0" y1="-35" x2="0" y2="35" />
                            <line x1="-35" y1="0" x2="35" y2="0" />
                        </g>
                        <!-- Front Mudguard -->
                        <path d="M-60,0 A60,60 0 0,1 60,0" fill="none" stroke="url(#grad-yellow-side)" stroke-width="12" stroke-linecap="round" />
                    </g>

                    <!-- 5. DRIVER AREA & DETAILS -->
                    <!-- Windshield Side -->
                    <path d="M230,150 L470,260 L500,170 L250,60 Z" fill="url(#grad-glass)" stroke="#333" stroke-width="2" />
                    <!-- Windshield Front -->
                    <path d="M470,260 L570,280 L570,190 L500,170 Z" fill="url(#grad-glass)" stroke="#333" stroke-width="2" />
                    
                    <!-- Reflections -->
                    <line x1="260" y1="180" x2="300" y2="220" stroke="#FFF" stroke-width="3" opacity="0.6" />
                    <line x1="280" y1="190" x2="320" y2="230" stroke="#FFF" stroke-width="3" opacity="0.6" />

                    <!-- Handlebars -->
                    <path d="M570,190 L570,270" stroke="#222" stroke-width="12" /> <!-- Stem -->
                    <path d="M530,190 Q570,170 610,190" fill="none" stroke="#222" stroke-width="10" stroke-linecap="round" />

                    <!-- Mirrors -->
                    <!-- Left Mirror -->
                    <path d="M550,190 L520,130" stroke="#333" stroke-width="3" />
                    <ellipse cx="515" cy="125" rx="12" ry="6" fill="#333" transform="rotate(-20 515 125)" />
                    <!-- Right Mirror -->
                    <path d="M590,190 L630,130" stroke="#333" stroke-width="3" />
                    <ellipse cx="635" cy="125" rx="12" ry="6" fill="#333" transform="rotate(20 635 125)" />

                    <!-- Headlamp -->
                    <g id="headlamp" transform="translate(585, 380)">
                        <!-- Mount -->
                        <path d="M-5,0 L5,10" stroke="#333" stroke-width="4" />
                        <!-- Housing -->
                        <ellipse cx="15" cy="10" rx="14" ry="20" fill="#111" stroke="#555" stroke-width="2" />
                        <!-- Glass -->
                        <ellipse cx="18" cy="10" rx="9" ry="15" fill="#FFEB3B" id="lamp-glass" opacity="0.8" />
                        <!-- Beam -->
                        <polygon id="beam" points="18,10 1200,600 1200,-400" fill="url(#grad-glass)" opacity="0" style="mix-blend-mode: screen;" />
                    </g>

                    <!-- Horns -->
                    <path d="M585,220 L580,180 L590,180 Z" fill="url(#grad-chrome)" stroke="#555" stroke-width="1" />
                    <circle cx="585" cy="175" r="5" fill="#333" />

                    <!-- License Plate -->
                    <g transform="translate(550, 460)">
                        <rect x="0" y="0" width="60" height="32" fill="#fff" rx="3" stroke="#333" stroke-width="2" />
                        <text x="30" y="21" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">DL 1C 1234</text>
                    </g>
                </g>
            </svg>
        </div>
    </div>

    <!-- RIGHT: The UI Card -->
    <div class="info-card">
        <div class="card-header">
            <span class="tag">Urban Heritage</span>
            <h1>The Auto<br>Rickshaw</h1>
            <p class="description">
                The undisputed king of South Asian transit. A three-wheeled marvel known for its iconic yellow-and-green livery, high-pitched horn, and open-air canopy.
            </p>
        </div>

        <div class="specs-grid">
            <div class="spec-item">
                <h3>Configuration</h3>
                <p>Delta 3-Wheel</p>
            </div>
            <div class="spec-item">
                <h3>Engine</h3>
                <p>3-Stroke / CNG</p>
            </div>
            <div class="spec-item">
                <h3>Capacity</h3>
                <p>3 Passengers</p>
            </div>
            <div class="spec-item">
                <h3>Origin</h3>
                <p>1970s India</p>
            </div>
        </div>

        <div class="card-footer">
            <div class="price-row">
                <div class="price-tag">₹30.00 <span class="price-sub">/ km</span></div>
            </div>
            <div class="controls-row">
                <button class="btn btn-primary" onclick="toggleLights()">Lights</button>
                <button class="btn btn-secondary" onclick="honk()">Honk</button>
                <button class="btn" onclick="alert('Booking simulation')">Book</button>
            </div>
        </div>
    </div>
</div>

<script>
    const rickshaw = document.getElementById('rickshaw-svg');
    const beam = document.getElementById('beam');
    const glass = document.getElementById('lamp-glass');

    let lightsOn = false;

    function toggleLights() {
        lightsOn = !lightsOn;
        if (lightsOn) {
            beam.style.opacity = '0.5';
            glass.style.fill = '#FFFF00';
            glass.style.opacity = '1';
        } else {
            beam.style.opacity = '0';
            glass.style.fill = '#FFEB3B';
            glass.style.opacity = '0.8';
        }
    }

    function honk() {
        rickshaw.classList.add('horn-active');
        setTimeout(() => {
            rickshaw.classList.remove('horn-active');
        }, 500);
    }
</script>
</body>
</html>
