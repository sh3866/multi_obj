<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Iconic Auto — Street Showcase</title>
<style>
    :root {
        /* Palette: Extracted from the vehicle livery */
        --bg-color: #F4F1EA; /* Warmer, paper-like background */
        
        --livery-yellow: #FFD600;
        --livery-yellow-dark: #F9A825;
        --livery-green: #00C853;
        --livery-green-dark: #00897B; /* Teal tint for depth */
        
        --chrome-light: #FFFFFF;
        --chrome-mid: #CFD8DC;
        --chrome-dark: #546E7A;
        
        --tire-black: #263238;
        --text-dark: #212121;
        --text-muted: #546E7A;

        --shadow-soft: 0 20px 60px rgba(0,0,0,0.1);
        --shadow-sharp: 0 4px 12px rgba(0,0,0,0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        overflow: hidden;
        background-color: var(--bg-color);
        color: var(--text-dark);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Grain Texture Overlay - Warmer tone */
    body::before {
        content: "";
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 0;
        opacity: 0.6;
        mix-blend-mode: multiply;
    }

    /* Layout Container */
    .showcase-container {
        width: 94vw;
        height: 92vh;
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        position: relative;
        z-index: 1;
        gap: 2rem;
    }

    /* Left Panel: The Stage */
    .visual-stage {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at center, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
        border-radius: 24px;
    }

    .svg-wrapper {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        transform: scale(1); 
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* The SVG Itself */
    #rickshaw-svg {
        width: 100%;
        height: 100%;
        max-width: 850px;
        overflow: visible;
    }

    /* Right Panel: Typography & Info */
    .info-panel {
        padding: 3rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255,255,255,0.8);
        box-shadow: var(--shadow-soft);
        border-radius: 24px;
    }

    /* Typography */
    .header { margin-bottom: 2rem; }

    .tag {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--livery-green-dark);
        font-weight: 800;
        margin-bottom: 0.75rem;
        display: inline-block;
        background: rgba(0, 200, 83, 0.1);
        padding: 6px 12px;
        border-radius: 4px;
    }

    h1 {
        font-size: 3.2rem;
        line-height: 0.95;
        font-weight: 900;
        letter-spacing: -1.5px;
        color: var(--text-dark);
    }

    .content { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }

    .description {
        font-size: 1.05rem;
        line-height: 1.6;
        color: var(--text-muted);
        margin-bottom: 2.5rem;
        max-width: 90%;
    }

    /* Specs Grid */
    .specs-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid rgba(0,0,0,0.08);
    }

    .spec-item h3 {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #999;
        margin-bottom: 0.25rem;
    }

    .spec-item p {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--text-dark);
        letter-spacing: -0.5px;
    }

    /* Footer & UI Elements */
    .footer {
        margin-top: auto;
        padding-top: 2rem;
        border-top: 1px solid rgba(0,0,0,0.08);
    }

    .price-tag {
        font-size: 1.25rem;
        font-weight: 800;
        color: var(--text-dark);
        background: var(--livery-yellow);
        padding: 0.6rem 1.2rem;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(249, 168, 37, 0.3);
        display: inline-block;
        margin-bottom: 1.5rem;
    }

    /* Controls Container */
    .controls-wrapper {
        background: rgba(0,0,0,0.03);
        padding: 0.5rem;
        border-radius: 16px;
        display: inline-flex;
        gap: 0.5rem;
        border: 1px solid rgba(0,0,0,0.05);
    }

    .btn {
        background: transparent;
        color: var(--text-dark);
        border: 1px solid rgba(0,0,0,0.1);
        padding: 0.8rem 1.5rem;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-radius: 12px;
        transition: all 0.2s ease;
    }

    .btn:hover {
        background: rgba(255,255,255,0.8);
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .btn:active { transform: translateY(0); }

    .btn-accent {
        background: var(--livery-green);
        color: white;
        border: 1px solid var(--livery-green);
    }
    
    .btn-accent:hover { 
        background: var(--livery-green-dark); 
        border-color: var(--livery-green-dark);
        box-shadow: 0 4px 12px rgba(0, 200, 83, 0.4);
    }

    /* Animations */
    @keyframes shake {
        0% { transform: translate(0, 0) rotate(0deg); }
        25% { transform: translate(2px, 2px) rotate(1deg); }
        50% { transform: translate(-2px, -2px) rotate(-1deg); }
        75% { transform: translate(2px, -2px) rotate(1deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
    }

    .horn-active {
        animation: shake 0.1s infinite;
    }

    /* Responsive */
    @media (max-width: 1000px) {
        .showcase-container {
            grid-template-columns: 1fr;
            grid-template-rows: 1fr 1fr;
            height: 100vh;
            width: 100vw;
            gap: 0;
        }
        .info-panel { 
            border-radius: 24px 24px 0 0;
            padding: 2rem;
            margin-top: -60px; /* Overlap visual */
            border-left: none;
            border-top: none;
            background: rgba(244, 241, 234, 0.95);
        }
        .visual-stage { height: 65vh; background: none; }
        .svg-wrapper { transform: scale(0.85); }
        h1 { font-size: 2.5rem; }
        .specs-grid { grid-template-columns: 1fr; gap: 1rem; }
    }
</style>
</head>
<body>

<div class="showcase-container">
    <!-- Left Panel: Visual -->
    <div class="visual-stage">
        <div class="svg-wrapper">
            <!-- RECONSTRUCTED SVG: True 3/4 Perspective, Layered Geometry -->
            <svg id="rickshaw-svg" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Gradients -->
                    <linearGradient id="grad-yellow-side" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#FFEB3B" />
                        <stop offset="100%" stop-color="#FBC02D" />
                    </linearGradient>
                    <linearGradient id="grad-yellow-front" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#FBC02D" />
                        <stop offset="100%" stop-color="#F57F17" />
                    </linearGradient>
                    <linearGradient id="grad-green-side" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#00E676" />
                        <stop offset="100%" stop-color="#00C853" />
                    </linearGradient>
                    <linearGradient id="grad-green-front" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#00C853" />
                        <stop offset="100%" stop-color="#00600F" />
                    </linearGradient>
                    <linearGradient id="grad-chrome" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#FFFFFF" />
                        <stop offset="30%" stop-color="#E0E0E0" />
                        <stop offset="70%" stop-color="#9E9E9E" />
                        <stop offset="100%" stop-color="#616161" />
                    </linearGradient>
                    <linearGradient id="grad-glass" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#E0F7FA" stop-opacity="0.7" />
                        <stop offset="50%" stop-color="#80DEEA" stop-opacity="0.4" />
                        <stop offset="100%" stop-color="#00BCD4" stop-opacity="0.8" />
                    </linearGradient>
                    <radialGradient id="grad-tire" cx="50%" cy="50%" r="50%">
                        <stop offset="85%" stop-color="#37474F" />
                        <stop offset="100%" stop-color="#102027" />
                    </radialGradient>

                    <!-- Reusable Wheel Component -->
                    <g id="wheel">
                        <!-- Tire -->
                        <circle cx="0" cy="0" r="55" fill="url(#grad-tire)" stroke="#111" stroke-width="6"/>
                        <!-- Rim -->
                        <circle cx="0" cy="0" r="35" fill="url(#grad-chrome)" stroke="#444" stroke-width="2"/>
                        <!-- Hub -->
                        <circle cx="0" cy="0" r="8" fill="#333" />
                        <!-- Spokes -->
                        <g stroke="#999" stroke-width="4" stroke-linecap="round">
                            <path d="M0,-35 L0,35 M-30,-17 L30,17 M-30,17 L30,-17" />
                        </g>
                    </g>
                </defs>

                <!-- Ground Shadow (Soft, realistic) -->
                <ellipse cx="450" cy="530" rx="280" ry="40" fill="rgba(0,0,0,0.15)" filter="blur(12px)" />

                <!-- === VEHICLE GROUP === -->
                <g id="vehicle" stroke-linejoin="round" stroke-linecap="round">
                    
                    <!-- 1. REAR WHEELS (Background to Foreground) -->
                    <!-- Left Rear Wheel (Background - Smaller) -->
                    <use href="#wheel" x="300" y="460" transform="scale(0.85)" />
                    
                    <!-- Right Rear Wheel (Foreground - Larger) -->
                    <use href="#wheel" x="480" y="480" transform="scale(1.1)" />

                    <!-- Axle Bar (Connecting them) -->
                    <rect x="280" y="460" width="220" height="12" rx="6" fill="url(#grad-chrome)" stroke="#555" stroke-width="1" />

                    <!-- 2. MAIN CABIN (3/4 Perspective) -->
                    <!-- Side Panel (Yellow) - The main body -->
                    <path d="M280,250 L500,270 L510,460 L280,460 Z" fill="url(#grad-yellow-side)" stroke="#F57F17" stroke-width="2" />
                    
                    <!-- Green Stripe (Side) -->
                    <path d="M280,330 L500,350 L510,460 L280,460 Z" fill="url(#grad-green-side)" stroke="#00600F" stroke-width="2" />

                    <!-- Front Face (Yellow) - Angled -->
                    <path d="M500,270 L590,290 L600,480 L510,460 Z" fill="url(#grad-yellow-front)" stroke="#F57F17" stroke-width="2" />
                    
                    <!-- Green Stripe (Front) -->
                    <path d="M500,350 L590,370 L600,480 L510,460 Z" fill="url(#grad-green-front)" stroke="#00600F" stroke-width="2" />

                    <!-- 3. ROOF CANOPY -->
                    <!-- Top Surface -->
                    <path d="M270,250 L490,270 L520,180 L290,160 Z" fill="#FFEB3B" stroke="#FBC02D" stroke-width="2" />
                    <!-- Front Face (Yellow) -->
                    <path d="M490,270 L580,290 L580,200 L520,180 Z" fill="#FBC02D" stroke="#F57F17" stroke-width="2" />
                    
                    <!-- Chrome Roof Trim -->
                    <path d="M270,250 L490,270" stroke="url(#grad-chrome)" stroke-width="6" />
                    <path d="M490,270 L580,290" stroke="url(#grad-chrome)" stroke-width="6" />

                    <!-- Support Poles -->
                    <line x1="280" y1="250" x2="290" y2="160" stroke="url(#grad-chrome)" stroke-width="8" />
                    <line x1="500" y1="270" x2="520" y2="180" stroke="url(#grad-chrome)" stroke-width="8" />

                    <!-- 4. FRONT WHEEL & STEERING -->
                    <!-- Steering Column -->
                    <path d="M510,460 L590,460 L620,510" fill="none" stroke="#444" stroke-width="10" stroke-linecap="round"/>
                    
                    <!-- Front Wheel -->
                    <use href="#wheel" x="620" y="510" />

                    <!-- 5. MUDGUARDS -->
                    <!-- Left Rear (Behind wheel) -->
                    <path d="M240,460 Q300,370 360,460" fill="none" stroke="#212121" stroke-width="18" stroke-linecap="round" />
                    <!-- Right Rear (Behind wheel) -->
                    <path d="M420,480 Q480,390 540,480" fill="none" stroke="#212121" stroke-width="18" stroke-linecap="round" />
                    <!-- Front (Behind wheel) -->
                    <path d="M540,510 Q620,420 700,510" fill="none" stroke="#212121" stroke-width="18" stroke-linecap="round" />
                    
                    <!-- Mudguard Accents (Yellow Paint) -->
                    <path d="M540,510 Q620,420 700,510" fill="none" stroke="#FFD600" stroke-width="6" stroke-linecap="round" />

                    <!-- 6. DRIVER AREA & DETAILS -->
                    <!-- Windshield Side -->
                    <path d="M290,160 L490,270 L520,180 L300,70 Z" fill="url(#grad-glass)" stroke="#333" stroke-width="2" />
                    <!-- Windshield Front -->
                    <path d="M490,270 L580,290 L580,200 L520,180 Z" fill="url(#grad-glass)" stroke="#333" stroke-width="2" />
                    
                    <!-- Reflection Lines (Glass Detail) -->
                    <line x1="310" y1="180" x2="350" y2="220" stroke="#FFF" stroke-width="2" opacity="0.5" />
                    <line x1="330" y1="190" x2="370" y2="230" stroke="#FFF" stroke-width="2" opacity="0.5" />

                    <!-- Wiper -->
                    <path d="M520,270 L550,230" stroke="#222" stroke-width="3" />

                    <!-- Handlebars (Visible inside) -->
                    <g id="handlebars" stroke="#222" stroke-width="10" fill="none">
                        <path d="M580,200 L580,280" stroke-width="12" /> <!-- Stem -->
                        <path d="M540,200 Q580,180 620,200" /> <!-- Bar -->
                    </g>

                    <!-- Mirrors (Functional Hardware) -->
                    <path d="M560,200 L530,140" stroke="#333" stroke-width="3" />
                    <ellipse cx="525" cy="135" rx="12" ry="6" fill="#333" transform="rotate(-20 525 135)" />
                    <path d="M600,200 L640,140" stroke="#333" stroke-width="3" />
                    <ellipse cx="645" cy="135" rx="12" ry="6" fill="#333" transform="rotate(20 645 135)" />

                    <!-- Headlamp (Front Face) -->
                    <g id="headlamp" transform="translate(595, 380)">
                        <path d="M-10,0 L0,10 L10,0 Z" fill="#333" />
                        <ellipse cx="15" cy="10" rx="16" ry="22" fill="#111" stroke="#555" stroke-width="2" />
                        <ellipse cx="20" cy="10" rx="10" ry="16" fill="#FFEB3B" id="lamp-glass" opacity="0.8" />
                        <!-- Beam -->
                        <polygon id="beam" points="20,10 1200,500 1200,-300" fill="url(#grad-glass)" opacity="0" style="mix-blend-mode: screen;" />
                    </g>

                    <!-- Ornamental Horns -->
                    <path d="M595,230 L590,190 L600,190 Z" fill="url(#grad-chrome)" stroke="#555" stroke-width="1" />
                    <circle cx="595" cy="185" r="6" fill="#333" />

                    <!-- License Plate (On distinct white background) -->
                    <g transform="translate(560, 460)">
                        <rect x="0" y="0" width="60" height="32" fill="#fff" rx="3" stroke="#333" stroke-width="2" />
                        <text x="30" y="21" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">DL 1C 1234</text>
                    </g>
                </g>
            </svg>
        </div>
    </div>

    <!-- Right Panel: Info -->
    <div class="info-panel">
        <div class="header">
            <span class="tag">Urban Heritage</span>
            <h1>The Auto<br>Rickshaw</h1>
        </div>

        <div class="content">
            <p class="description">
                The undisputed king of South Asian transit. A three-wheeled marvel known for its yellow-and-green livery, high-pitched horn, and open-air canopy.
            </p>

            <div class="specs-grid">
                <div class="spec-item">
                    <h3>Configuration</h3>
                    <p>Delta 3-Wheel</p>
                </div>
                <div class="spec-item">
                    <h3>Engine</h3>
                    <p>3-Stroke / CNG</p>
                </div>
                <div class="spec-item">
                    <h3>Capacity</h3>
                    <p>3 Passengers</p>
                </div>
                <div class="spec-item">
                    <h3>Origin</h3>
                    <p>1970s India</p>
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="price-tag">₹30.00 / km</div>
            <div class="controls-wrapper">
                <button class="btn btn-accent" onclick="toggleLights()">Lights</button>
                <button class="btn" onclick="honk()">Honk</button>
            </div>
        </div>
    </div>
</div>

<script>
    const rickshaw = document.getElementById('rickshaw-svg');
    const beam = document.getElementById('beam');
    const glass = document.getElementById('lamp-glass');

    let lightsOn = false;

    function toggleLights() {
        lightsOn = !lightsOn;
        if (lightsOn) {
            beam.style.opacity = '0.6';
            glass.style.fill = '#FFFF00';
            glass.style.opacity = '1';
        } else {
            beam.style.opacity = '0';
            glass.style.fill = '#FFEB3B';
            glass.style.opacity = '0.8';
        }
    }

    function honk() {
        rickshaw.classList.add('horn-active');
        setTimeout(() => {
            rickshaw.classList.remove('horn-active');
        }, 500);
    }
</script>
</body>
</html>
