<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONO RUNNER // REDESIGNED</title>
    <style>
        :root {
            /* Palette: Modern-Retro / High Contrast */
            --bg-color: #F7F5F0; /* Warm Off-White */
            --ink-color: #222222; /* Deep Charcoal/Near Black */
            --accent-color: #FF4500; /* Subtle Retro Orange for UI accents */
            --font-stack: 'Courier New', Courier, monospace; /* System Monospace for Retro feel */
            --ui-scale: 1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--ink-color);
            color: var(--ink-color);
            font-family: var(--font-stack);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Game Container */
        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 700px;
            background: var(--bg-color);
            overflow: hidden;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.1);
        }

        /* Canvas Layer */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            /* Crisp pixel art rendering */
            image-rendering: pixelated; 
        }

        /* UI Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        /* Speed Indicator */
        .speed-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .label {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--ink-color);
            text-transform: uppercase;
            opacity: 0.6;
        }

        .speed-bar {
            width: 100px;
            height: 8px;
            background: rgba(34, 34, 34, 0.1);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .speed-fill {
            height: 100%;
            background: var(--ink-color);
            width: 20%;
            transition: width 0.1s linear;
        }

        /* Score HUD */
        .score-container {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .score-val {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1;
            color: var(--ink-color);
        }

        .hi-score {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--ink-color);
            opacity: 0.5;
        }

        /* Bottom Instruction */
        .instruction-container {
            align-self: center;
            margin-bottom: 20px; /* Resting on the ground line area */
            text-align: center;
            transition: opacity 0.2s;
        }

        .instruction-text {
            font-size: 20px;
            font-weight: 900;
            color: var(--ink-color);
            letter-spacing: 2px;
            text-transform: uppercase;
            background: var(--bg-color);
            padding: 4px 12px;
            border: 2px solid var(--ink-color);
            border-radius: 4px;
            box-shadow: 4px 4px 0px rgba(34, 34, 34, 0.2);
        }

        .blink {
            animation: blinker 1s steps(2, start) infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* Game Over Overlay */
        .game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-color);
            padding: 40px 60px;
            border: 4px solid var(--ink-color);
            text-align: center;
            display: none;
            z-index: 100;
            box-shadow: 12px 12px 0px var(--ink-color);
        }

        .go-title {
            font-size: 56px;
            font-weight: 900;
            margin-bottom: 10px;
            letter-spacing: -2px;
        }

        .go-sub {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 30px;
            opacity: 0.7;
        }

        .restart-btn {
            font-family: var(--font-stack);
            font-size: 18px;
            font-weight: 900;
            background: var(--ink-color);
            color: var(--bg-color);
            border: none;
            padding: 12px 24px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            pointer-events: auto;
            transition: transform 0.1s;
        }

        .restart-btn:active {
            transform: scale(0.95);
        }

    </style>
</head>
<body>

    <div class="game-container">
        
        <div class="ui-layer">
            <!-- Top Left: Speed -->
            <div class="speed-container">
                <span class="label">Velocity</span>
                <div class="speed-bar">
                    <div class="speed-fill" id="speedFill"></div>
                </div>
            </div>

            <!-- Top Right: Score -->
            <div class="score-container">
                <div class="score-val" id="scoreDisplay">00000</div>
                <div class="hi-score">HI <span id="hiScoreDisplay">00000</span></div>
            </div>

            <!-- Bottom Center: Instruction -->
            <div class="instruction-container" id="instructionBox">
                <div class="instruction-text blink">PRESS SPACE TO JUMP</div>
            </div>
        </div>

        <!-- Game Over Modal -->
        <div class="game-over-screen" id="gameOverScreen">
            <div class="go-title">CRASHED</div>
            <div class="go-sub">SYSTEM FAILURE</div>
            <button class="restart-btn" onclick="resetGame()">REBOOT SYSTEM</button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

<script>
    /**
     * REVISED ENGINE:
     * - High contrast "Modern Retro" aesthetic.
     * - Canvas-based rendering for all game entities.
     * - Procedural generation of obstacles and ground.
     */

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const scoreEl = document.getElementById('scoreDisplay');
    const hiScoreEl = document.getElementById('hiScoreDisplay');
    const instructionEl = document.getElementById('instructionBox');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const speedFillEl = document.getElementById('speedFill');

    // Colors
    const C_BG = '#F7F5F0';
    const C_INK = '#222222';
    const C_ACCENT = '#E0E0E0'; // Subtle texture color

    // Dimensions
    let GAME_WIDTH, GAME_HEIGHT;
    let GROUND_Y;
    const GROUND_RATIO = 0.15; // Bottom 15%

    // Game State
    let gameRunning = false;
    let gameOver = false;
    let frame = 0;
    let score = 0;
    let highScore = localStorage.getItem('chrono_hs_v5') || 0;
    let speed = 8;
    const BASE_SPEED = 8;

    // Entities
    let dino;
    let obstacles = [];
    let particles = [];
    let bgParticles = []; // Dust/Atmosphere
    let obstacleTimer = 0;

    // --- RESIZE HANDLING ---
    function resize() {
        const container = canvas.parentElement;
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        GAME_WIDTH = canvas.width;
        GAME_HEIGHT = canvas.height;
        GROUND_Y = GAME_HEIGHT - (GAME_HEIGHT * GROUND_RATIO);
        
        // Re-init Dino position if exists
        if (dino) {
            dino.y = GROUND_Y - dino.h;
            dino.grounded = true;
            dino.dy = 0;
        }
    }
    window.addEventListener('resize', resize);
    hiScoreEl.innerText = Math.floor(highScore).toString().padStart(5, '0');
    
    // --- CLASSES ---

    class Dino {
        constructor() {
            this.w = 50;
            this.h = 50;
            this.x = GAME_WIDTH * 0.20; // 20% from left
            this.y = GROUND_Y - this.h;
            this.dy = 0;
            this.grounded = true;
            this.runFrame = 0;
            this.jumpForce = -14;
        }

        jump() {
            if (this.grounded) {
                this.dy = this.jumpForce;
                this.grounded = false;
                // Spawn landing dust logic here if needed
            }
        }

        update() {
            // Physics
            this.dy += 0.7; // Gravity
            this.y += this.dy;

            // Ground Collision
            if (this.y + this.h >= GROUND_Y) {
                this.y = GROUND_Y - this.h;
                this.dy = 0;
                this.grounded = true;
            } else {
                this.grounded = false;
            }

            // Animation
            if (this.grounded) {
                this.runFrame += 0.2 * (speed / BASE_SPEED);
            }
        }

        draw() {
            ctx.fillStyle = C_INK;
            ctx.save();
            ctx.translate(this.x, this.y);

            // Draw Silhouette (Modern Retro Style)
            
            // 1. Tail
            ctx.beginPath();
            ctx.moveTo(0, 30);
            ctx.lineTo(-10, 25);
            ctx.lineTo(-6, 18);
            ctx.lineTo(10, 22);
            ctx.fill();

            // 2. Body
            ctx.beginPath();
            ctx.moveTo(10, 20);
            ctx.lineTo(35, 20);
            ctx.lineTo(40, 35);
            ctx.lineTo(10, 35);
            ctx.fill();

            // 3. Neck & Head
            ctx.beginPath();
            ctx.moveTo(30, 20);
            ctx.lineTo(30, 10);
            ctx.lineTo(42, 10);
            ctx.lineTo(48, 15); // Snout
            ctx.lineTo(48, 22); // Jaw
            ctx.lineTo(35, 22);
            ctx.fill();

            // 4. Eye (Negative space)
            ctx.fillStyle = C_BG;
            ctx.fillRect(38, 12, 4, 4);
            ctx.fillStyle = C_INK;

            // 5. Arm (Retro T-Rex arm)
            ctx.fillRect(32, 28, 8, 4);

            // 6. Legs (Animated)
            if (!this.grounded) {
                // Jumping pose: legs slightly tucked
                ctx.fillRect(15, 35, 8, 12);
                ctx.fillRect(30, 35, 8, 12);
            } else {
                // Running cycle
                const legAnim = Math.sin(this.runFrame);
                
                // Leg 1
                ctx.fillRect(15 + (legAnim * 5), 35, 8, 15);
                // Leg 2
                ctx.fillRect(30 - (legAnim * 5), 35, 8, 15);
            }

            ctx.restore();
        }
    }

    class Obstacle {
        constructor() {
            this.type = Math.random() > 0.6 ? 'bird' : 'cactus';
            this.x = GAME_WIDTH + 50;
            this.markedForDeletion = false;
            
            if (this.type === 'cactus') {
                // Randomize cactus size
                const s = 0.8 + Math.random() * 0.6;
                this.w = 20 * s;
                this.h = 40 * s;
                this.y = GROUND_Y - this.h;
                
                // Visual variation
                this.variant = Math.floor(Math.random() * 3);
            } else {
                // Bird
                this.w = 40;
                this.h = 30;
                // Heights: Low, Mid, High
                const heights = [GROUND_Y - 50, GROUND_Y - 80, GROUND_Y - 110];
                this.y = heights[Math.floor(Math.random() * heights.length)];
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= speed;
            if (this.x + this.w < -100) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.2;
        }

        draw() {
            ctx.fillStyle = C_INK;
            
            if (this.type === 'cactus') {
                // Draw Cactus Silhouette
                // Main trunk
                ctx.fillRect(this.x, this.y, this.w, this.h);
                
                if (this.variant === 0) {
                    // Side arm right
                    ctx.fillRect(this.x + this.w, this.y + 10, 8, 8);
                    ctx.fillRect(this.x + this.w + 2, this.y, 8, 18);
                } else {
                    // Side arm left
                    ctx.fillRect(this.x - 8, this.y + 15, 8, 8);
                    ctx.fillRect(this.x - 6, this.y + 5, 8, 18);
                }
            } else {
                // Draw Bird Silhouette
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Body
                ctx.beginPath();
                ctx.ellipse(20, 15, 15, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Head/Beak
                ctx.beginPath();
                ctx.moveTo(32, 12);
                ctx.lineTo(45, 15); // Beak tip
                ctx.lineTo(32, 18);
                ctx.fill();

                // Wings
                const wingY = Math.sin(this.wingFrame) * 15;
                ctx.beginPath();
                ctx.moveTo(15, 15);
                ctx.lineTo(25, 15 - wingY - 10);
                ctx.lineTo(35, 15);
                ctx.fill();
                
                ctx.restore();
            }
        }
    }

    class Particle {
        constructor(x, y, color, speedX, speedY) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.size = Math.random() * 3 + 2;
            this.speedX = speedX;
            this.speedY = speedY;
            this.life = 1.0;
            this.decay = 0.03 + Math.random() * 0.03;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= this.decay;
        }
        draw() {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    // --- GAME LOGIC ---

    function init() {
        resize();
        dino = new Dino();
        obstacles = [];
        particles = [];
        score = 0;
        speed = BASE_SPEED;
        frame = 0;
        gameRunning = false;
        gameOver = false;
        
        // Initial static draw
        drawBackground();
        dino.draw();
        spawnInitialObstacles();
    }

    function spawnInitialObstacles() {
        // Place static obstacles for the "Menu" look
        obstacles.push(new Obstacle('cactus'));
        obstacles[0].x = GAME_WIDTH * 0.6;
        obstacles.push(new Obstacle('bird'));
        obstacles[1].x = GAME_WIDTH * 0.8;
    }

    function spawnObstacle() {
        // Ensure minimum gap
        if (obstacles.length > 0) {
            const lastObs = obstacles[obstacles.length - 1];
            if (GAME_WIDTH - lastObs.x < 250) return; 
        }

        obstacles.push(new Obstacle());
    }

    function drawBackground() {
        // Clear
        ctx.fillStyle = C_BG;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // 1. Distant Mountains (Parallax)
        // Color slightly darker than BG for depth
        ctx.fillStyle = '#EBE8E1'; 
        
        const mOffset = (frame * speed * 0.1) % GAME_WIDTH;
        
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        
        // Draw jagged line
        for (let i = 0; i <= GAME_WIDTH / 100 + 2; i++) {
            const x = (i * 100) - mOffset;
            // Procedural height based on sine waves
            const h = 40 + Math.sin(i * 132.1) * 20 + Math.cos(i * 45.2) * 10;
            ctx.lineTo(x, GROUND_Y - h);
        }
        
        ctx.lineTo(GAME_WIDTH, GROUND_Y);
        ctx.lineTo(0, GROUND_Y);
        ctx.fill();

        // 2. Ground Plane
        // Solid Ink Color for high contrast
        ctx.fillStyle = C_INK;
        ctx.fillRect(0, GROUND_Y, GAME_WIDTH, GAME_HEIGHT - GROUND_Y);

        // 3. Ground Details (Texture)
        // Moving dashes to simulate speed
        ctx.fillStyle = C_BG; // Use BG color for cutouts/texture
        const gOffset = (frame * speed) % 100;
        
        for(let i = -1; i < GAME_WIDTH/100 + 1; i++) {
            const x = (i * 100) - gOffset;
            // Random looking lines
            if ((i * 7) % 3 === 0) {
                ctx.fillRect(x, GROUND_Y + 10, 40, 4);
            }
            if ((i * 11) % 5 === 0) {
                ctx.fillRect(x + 20, GROUND_Y + 30, 15, 4);
            }
        }
    }

    function checkCollision(r1, r2) {
        // Hitbox padding for forgiveness
        const pad = 8;
        return (
            r1.x + pad < r2.x + r2.w - pad &&
            r1.x + r1.w - pad > r2.x + pad &&
            r1.y + pad < r2.y + r2.h - pad &&
            r1.y + r1.h - pad > r2.y + pad
        );
    }

    function animate() {
        if (!gameRunning) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        frame++;

        // Logic
        score += speed * 0.05;
        speed = BASE_SPEED + (score * 0.0005);
        
        // UI Updates
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
        const speedPct = Math.min(100, ((speed - BASE_SPEED) / 10) * 100);
        speedFillEl.style.width = `${Math.max(10, speedPct)}%`;

        // Draw World
        drawBackground();

        // Obstacle Spawning
        obstacleTimer++;
        if (obstacleTimer > (60 + Math.random() * 40)) {
            spawnObstacle();
            obstacleTimer = 0;
        }

        // Update & Draw Obstacles
        obstacles.forEach((obs, i) => {
            obs.update();
            obs.draw();

            if (checkCollision(dino, obs)) {
                triggerGameOver();
            }

            if (obs.markedForDeletion) obstacles.splice(i, 1);
        });

        // Update & Draw Dino
        dino.update();
        dino.draw();

        // Particles (Dust from feet)
        if (dino.grounded && frame % 5 === 0) {
            particles.push(new Particle(
                dino.x + 10, 
                dino.y + dino.h, 
                C_INK, 
                -speed * 0.5, 
                (Math.random() - 0.5) * 2
            ));
        }

        particles.forEach((p, i) => {
            p.update();
            p.draw();
            if (p.life <= 0) particles.splice(i, 1);
        });

        if (gameRunning) requestAnimationFrame(animate);
    }

    function triggerGameOver() {
        gameRunning = false;
        gameOver = true;
        
        // Explosion effect
        for(let i=0; i<15; i++) {
            particles.push(new Particle(
                dino.x + dino.w/2, 
                dino.y + dino.h/2, 
                C_INK, 
                (Math.random() - 0.5) * 10, 
                (Math.random() - 0.5) * 10
            ));
        }
        // Draw one last frame to show collision
        particles.forEach(p => { p.update(); p.draw(); });

        if (score > highScore) {
            highScore = score;
            localStorage.setItem('chrono_hs_v5', highScore);
            hiScoreEl.innerText = Math.floor(highScore).toString().padStart(5, '0');
        }

        gameOverScreen.style.display = 'block';
        instructionEl.style.opacity = '0';
    }

    function resetGame() {
        resize();
        dino = new Dino();
        obstacles = [];
        particles = [];
        score = 0;
        speed = BASE_SPEED;
        frame = 0;
        gameRunning = true;
        gameOver = false;
        
        instructionEl.style.opacity = '0';
        gameOverScreen.style.display = 'none';
        
        animate();
    }

    // --- INPUTS ---

    function handleInput(e) {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            if (!gameRunning && !gameOver) {
                resetGame();
            } else if (gameOver) {
                resetGame();
            } else {
                dino.jump();
            }
        }
    }

    // Touch support
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!gameRunning && !gameOver) resetGame();
        else if (gameOver) resetGame();
        else dino.jump();
    }, {passive: false});

    window.addEventListener('keydown', handleInput);

    // Start
    init();

</script>
</body>
</html>
