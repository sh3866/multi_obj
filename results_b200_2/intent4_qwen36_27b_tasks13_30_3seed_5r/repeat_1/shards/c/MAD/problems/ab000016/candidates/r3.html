<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONO RUNNER // REVISED</title>
    <style>
        :root {
            --bg-color: #110e27; /* Deep Indigo Void */
            --surface: #1e293b;
            --ground-color: #151020; /* Darker Ground */
            --text-main: #f8fafc;
            --accent: #22d3ee;
            --danger: #ef4444;
            --font-stack: 'Courier New', Courier, monospace;
            --padding-ui: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000;
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Game Container */
        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 750px;
            background: radial-gradient(circle at 50% 120%, #2e2550 0%, var(--bg-color) 60%);
            overflow: hidden;
            box-shadow: 0 0 100px rgba(0,0,0,0.8);
            border: 1px solid #334155;
        }

        /* Canvas Layer */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        /* Post-Processing: CRT Scanlines */
        .overlay-fx {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.15) 2px,
                rgba(0,0,0,0.15) 4px
            );
            background-size: 100% 4px;
            animation: scanlineMove 10s linear infinite;
        }

        .vignette {
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
        }

        @keyframes scanlineMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }

        /* UI: HUD (Top Right) - Restructured Hierarchy */
        .hud {
            position: absolute;
            top: var(--padding-ui);
            right: var(--padding-ui);
            text-align: right;
            z-index: 20;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .score-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            font-weight: bold;
        }

        .label {
            font-size: 12px;
            color: #64748b;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.7;
        }

        /* Current Score: Larger, Bolder, White */
        .value.current {
            font-size: 36px;
            letter-spacing: -2px;
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        /* High Score: Smaller, Cyan, Less weight */
        .value.hi {
            font-size: 16px;
            letter-spacing: 1px;
            color: var(--accent);
            text-shadow: 0 0 5px rgba(34, 211, 238, 0.3);
        }

        /* UI: Prompt (Centered) - Reduced Visual Weight */
        .prompt-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.3s ease;
            opacity: 0.6;
        }

        .prompt-text {
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 400;
            white-space: nowrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 4px;
        }

        .blink {
            animation: blinker 2s steps(2, start) infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* Game Over Screen */
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 30;
            display: none;
            background: rgba(17, 14, 39, 0.85);
            backdrop-filter: blur(4px);
            padding: 40px 60px;
            border: 1px solid #334155;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .go-title {
            font-size: 42px;
            color: var(--danger);
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.1);
        }

        .go-sub {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* UI: Speed Indicator (Bottom Left) - Anchored & Legible */
        .speed-indicator {
            position: absolute;
            bottom: var(--padding-ui);
            left: var(--padding-ui);
            color: var(--text-main);
            font-size: 14px;
            z-index: 20;
            font-weight: bold;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0.9;
        }
        
        .speed-label {
            color: var(--accent);
            font-size: 18px;
        }

        .speed-bar {
            width: 100px;
            height: 6px;
            background: rgba(255,255,255,0.1);
            position: relative;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .speed-fill {
            height: 100%;
            background: var(--accent);
            width: 20%;
            transition: width 0.1s linear;
            box-shadow: 0 0 8px var(--accent);
        }

    </style>
</head>
<body>

    <div class="game-container">
        <!-- FX Layers -->
        <div class="overlay-fx scanlines"></div>
        <div class="overlay-fx vignette"></div>

        <!-- HUD -->
        <div class="hud">
            <div class="score-row">
                <span class="value current" id="scoreDisplay">00000</span>
            </div>
            <div class="score-row">
                <span class="label">HI</span>
                <span class="value hi" id="hiScoreDisplay">00000</span>
            </div>
        </div>

        <!-- Speed Indicator -->
        <div class="speed-indicator">
            <span class="speed-label">SPD</span>
            <div class="speed-bar"><div class="speed-fill" id="speedFill"></div></div>
        </div>

        <!-- Prompt -->
        <div class="prompt-container" id="promptContainer">
            <div class="prompt-text blink">PRESS SPACE TO JUMP</div>
        </div>

        <!-- Game Over -->
        <div class="game-over" id="gameOverScreen">
            <div class="go-title">CRASHED</div>
            <div class="go-sub">SYSTEM FAILURE</div>
            <div class="prompt-text blink" style="border:none; cursor:pointer; pointer-events:auto;">PRESS SPACE TO REBOOT</div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

<script>
    /**
     * REVISED IMPLEMENTATION NOTES:
     * 1. Visual Identity: Deep Indigo/Cyberpunk palette.
     * 2. Composition: Layered ground (distant mountains, midground texture, foreground).
     * 3. Entities: Populated world with Dino, Cacti, Pterodactyl.
     * 4. Typography: Unified monospace, distinct hierarchy (Score > Hi > Labels).
     */

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreDisplay');
    const hiScoreEl = document.getElementById('hiScoreDisplay');
    const promptEl = document.getElementById('promptContainer');
    const gameOverEl = document.getElementById('gameOverScreen');
    const speedFillEl = document.getElementById('speedFill');

    // Game Constants
    let GAME_WIDTH = 1024;
    let GAME_HEIGHT = 600;
    const GROUND_HEIGHT_RATIO = 0.20; // Bottom 20% as requested
    let GROUND_Y = 0;
    
    // Physics
    const GRAVITY = 0.65;
    const JUMP_FORCE = -13;
    const BASE_SPEED = 8;
    
    // State
    let gameRunning = false;
    let gameOver = false;
    let frame = 0;
    let score = 0;
    let highScore = localStorage.getItem('chrono_hs_v3') || 0;
    let speed = BASE_SPEED;

    // Visual Assets (Procedural)
    const stars = [];
    for(let i=0; i<80; i++) {
        stars.push({
            x: Math.random() * 1024,
            y: Math.random() * 600,
            size: Math.random() * 1.5 + 0.5,
            alpha: Math.random()
        });
    }

    // Resize Handling
    function resize() {
        const container = canvas.parentElement;
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        GAME_WIDTH = canvas.width;
        GAME_HEIGHT = canvas.height;
        GROUND_Y = GAME_HEIGHT - (GAME_HEIGHT * GROUND_HEIGHT_RATIO);
    }
    window.addEventListener('resize', resize);
    resize();
    hiScoreEl.innerText = Math.floor(highScore).toString().padStart(5, '0');

    // --- ENTITIES ---

    class Dino {
        constructor() {
            this.w = 44;
            this.h = 44;
            this.x = GAME_WIDTH * 0.15; // 15% from left for better balance
            this.y = GROUND_Y - this.h;
            this.dy = 0;
            this.grounded = true;
            this.runFrame = 0;
            this.color = '#f8fafc'; 
        }

        jump() {
            if (this.grounded) {
                this.dy = JUMP_FORCE;
                this.grounded = false;
                // Spawn dust
                for(let i=0; i<6; i++) particles.push(new Particle(this.x + this.w/2, this.y + this.h, '#1e293b'));
            }
        }

        update() {
            this.dy += GRAVITY;
            this.y += this.dy;

            if (this.y + this.h > GROUND_Y) {
                this.y = GROUND_Y - this.h;
                this.dy = 0;
                this.grounded = true;
            } else {
                this.grounded = false;
            }

            if (this.grounded) {
                this.runFrame += 0.25 * (speed / BASE_SPEED);
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.save();
            ctx.translate(this.x, this.y);

            // Silhouette: Modern Retro Style
            // Tail
            ctx.fillRect(0, 20, 8, 6);
            ctx.fillRect(-4, 16, 6, 6);
            
            // Body
            ctx.fillRect(8, 16, 24, 20);
            
            // Neck/Head
            ctx.fillRect(22, 6, 20, 16);
            // Snout
            ctx.fillRect(36, 10, 10, 8);
            
            // Eye (Negative space - uses background color)
            ctx.fillStyle = '#110e27'; 
            ctx.fillRect(36, 8, 3, 3);
            ctx.fillStyle = this.color;

            // Arm
            ctx.fillRect(24, 24, 8, 4);

            // Legs
            if (!this.grounded) {
                // Jump pose (tucked)
                ctx.fillRect(12, 36, 8, 8);
                ctx.fillRect(26, 36, 8, 8);
            } else {
                // Run cycle
                const legOffset = Math.sin(this.runFrame) * 12;
                // Leg 1
                ctx.fillRect(14 + legOffset, 36, 8, 8);
                // Leg 2
                ctx.fillRect(26 - legOffset, 36, 8, 8);
            }

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type;
            this.x = GAME_WIDTH + 50;
            this.markedForDeletion = false;

            if (type === 'cactus') {
                // Scale variation
                const s = 0.8 + Math.random() * 0.5;
                this.w = 24 * s;
                this.h = (50 + Math.random() * 20) * s;
                this.y = GROUND_Y - this.h;
            } else {
                // Bird
                this.w = 44;
                this.h = 28;
                // Heights: Low (jump), Mid (duck/jump)
                const heights = [GROUND_Y - 50, GROUND_Y - 85, GROUND_Y - 115]; 
                this.y = heights[Math.floor(Math.random() * heights.length)];
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= speed;
            if (this.x + this.w < -100) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.25;
        }

        draw() {
            // Use a slightly distinct color for obstacles to pop against the background
            ctx.fillStyle = '#cbd5e1'; 
            
            if (this.type === 'cactus') {
                // Draw Cactus
                // Main stem
                ctx.fillRect(this.x, this.y, this.w, this.h);
                // Arms
                ctx.fillRect(this.x - 10, this.y + 15, 10, 8);
                ctx.fillRect(this.x - 10, this.y + 15, 8, 20);
                
                ctx.fillRect(this.x + this.w, this.y + 25, 10, 8);
                ctx.fillRect(this.x + this.w + 2, this.y + 25, 8, 16);

                // Highlight detail
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(this.x + 4, this.y + 4, 4, this.h - 4);

            } else {
                // Draw Bird (Pterodactyl silhouette)
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Body
                ctx.beginPath();
                ctx.moveTo(0, 12);
                ctx.lineTo(30, 12);
                ctx.lineTo(30, 18);
                ctx.lineTo(0, 18);
                ctx.fill();
                
                // Head
                ctx.fillRect(28, 8, 10, 12);
                // Beak
                ctx.fillRect(36, 14, 10, 4);

                // Wings
                const wingY = Math.sin(this.wingFrame) * 15;
                ctx.beginPath();
                ctx.moveTo(10, 12);
                ctx.lineTo(22, 12 - wingY - 10); // Up wing
                ctx.lineTo(32, 12);
                ctx.fill();
                
                ctx.restore();
            }
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 3 + 1;
            this.speedX = (Math.random() - 0.5) * 5;
            this.speedY = (Math.random() - 0.5) * 5;
            this.color = color;
            this.life = 1.0;
            this.decay = 0.04 + Math.random() * 0.04;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= this.decay;
        }
        draw() {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    // --- GAME LOGIC ---

    const dino = new Dino();
    let obstacles = [];
    let particles = [];
    let obstacleTimer = 0;
    let minObstacleGap = 80; 

    function spawnObstacle() {
        if (obstacles.length > 0) {
            const lastObs = obstacles[obstacles.length - 1];
            if (GAME_WIDTH - lastObs.x < 280) return; 
        }

        const type = Math.random() > 0.75 ? 'bird' : 'cactus';
        obstacles.push(new Obstacle(type));
    }

    function drawBackground() {
        // 1. Stars (Parallax very slow)
        ctx.fillStyle = '#ffffff';
        const sOffset = (frame * 0.2) % GAME_WIDTH;
        
        stars.forEach(star => {
            ctx.globalAlpha = star.alpha;
            let sx = star.x - sOffset;
            if (sx < 0) sx += GAME_WIDTH;
            ctx.fillRect(sx, star.y, star.size, star.size);
        });
        ctx.globalAlpha = 1.0;

        // 2. Distant Mountains (Parallax slow)
        ctx.fillStyle = '#1a1533'; 
        const mOffset = (frame * speed * 0.15) % 200;
        
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        for (let i = -1; i < GAME_WIDTH / 120 + 2; i++) {
            const x = (i * 120) - mOffset;
            const h = 80 + Math.sin(i * 132) * 40;
            ctx.lineTo(x, GROUND_Y - h);
            ctx.lineTo(x + 60, GROUND_Y - (h - 30));
            ctx.lineTo(x + 120, GROUND_Y);
        }
        ctx.fill();

        // 3. Ground Plane (Dark Layered)
        // Base Ground
        ctx.fillStyle = '#151020'; 
        ctx.fillRect(0, GROUND_Y, GAME_WIDTH, GAME_HEIGHT - GROUND_Y);
        
        // Top Edge Line (Neon/Cyan)
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(GAME_WIDTH, GROUND_Y);
        ctx.strokeStyle = '#22d3ee';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 4. Ground Details (Moving texture)
        ctx.fillStyle = '#1e293b';
        const gOffset = (frame * speed) % 100;
        for(let i = -1; i < GAME_WIDTH/100 + 1; i++) {
            if ((i * 7) % 3 !== 0) continue;
            const x = (i * 100) - gOffset;
            ctx.fillRect(x, GROUND_Y + 15, 40, 4);
            ctx.fillRect(x + 20, GROUND_Y + 30, 10, 4);
        }
    }

    function checkCollision(r1, r2) {
        const padding = 8;
        return (
            r1.x + padding < r2.x + r2.w - padding &&
            r1.x + r1.w - padding > r2.x + padding &&
            r1.y + padding < r2.y + r2.h - padding &&
            r1.y + r1.h - padding > r2.y + padding
        );
    }

    function resetGame() {
        dino.y = GROUND_Y - dino.h;
        dino.dy = 0;
        obstacles = [];
        particles = [];
        score = 0;
        speed = BASE_SPEED;
        gameOver = false;
        gameRunning = true;
        frame = 0;
        
        promptEl.style.opacity = '0';
        gameOverEl.style.display = 'none';
        
        animate();
    }

    function animate() {
        if (!gameRunning) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        frame++;

        // Update Score & Speed
        score += speed * 0.05;
        speed = BASE_SPEED + (score * 0.0005); 
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
        
        // Update Speed UI
        const speedPercent = Math.min(100, Math.max(10, ((speed - BASE_SPEED) / 10) * 100));
        speedFillEl.style.width = `${speedPercent}%`;

        // Draw World
        drawBackground();

        // Spawn Logic
        obstacleTimer++;
        if (obstacleTimer > minObstacleGap + Math.random() * 40) {
            spawnObstacle();
            obstacleTimer = 0;
            minObstacleGap = Math.max(40, 90 - (speed * 2));
        }

        // Update & Draw Obstacles
        obstacles.forEach((obs, i) => {
            obs.update();
            obs.draw();
            
            if (checkCollision(dino, obs)) {
                gameRunning = false;
                gameOver = true;
                
                for(let k=0; k<20; k++) {
                    particles.push(new Particle(dino.x + dino.w/2, dino.y + dino.h/2, '#ef4444'));
                }
                
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('chrono_hs_v3', highScore);
                    hiScoreEl.innerText = Math.floor(highScore).toString().padStart(5, '0');
                }
                
                gameOverEl.style.display = 'block';
            }

            if (obs.markedForDeletion) obstacles.splice(i, 1);
        });

        // Update & Draw Dino
        dino.update();
        dino.draw();

        // Particles
        particles.forEach((p, i) => {
            p.update();
            p.draw();
            if (p.life <= 0) particles.splice(i, 1);
        });

        if (gameRunning) requestAnimationFrame(animate);
        else {
            particles.forEach(p => { p.update(); p.draw(); });
        }
    }

    // --- INPUTS ---

    function handleInput(e) {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            if (!gameRunning && !gameOver) {
                resetGame();
            } else if (gameOver) {
                resetGame();
            } else {
                dino.jump();
            }
        }
    }

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!gameRunning && !gameOver) resetGame();
        else if (gameOver) resetGame();
        else dino.jump();
    }, {passive: false});

    window.addEventListener('keydown', handleInput);

    // Initial Draw (Static Scene)
    drawBackground();
    dino.draw();

</script>
</body>
</html>
