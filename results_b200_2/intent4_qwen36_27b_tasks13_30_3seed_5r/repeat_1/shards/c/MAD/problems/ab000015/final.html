<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Alpine Velocity: Sliding Challenge</title>
<style>
    :root {
        /* Palette - Alpine & Industrial */
        --bg-sky-top: #0f172a;
        --bg-sky-horizon: #475569;
        
        --ice-base: #e0f2fe;
        --ice-dark: #7dd3fc;
        --ice-shadow: #0284c7;
        
        /* Industrial UI Colors */
        --ui-orange: #f97316;
        --ui-cyan: #06b6d4;
        --ui-dark: #0f172a;
        --ui-text: #ffffff;
        
        --font-ui: 'Courier New', Courier, monospace; /* Digital Instrument feel */
    }

    * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
    }

    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--bg-sky-top);
        font-family: var(--font-ui);
        color: var(--ui-text);
    }

    /* --- 1. Environment & Atmosphere --- */
    #world-container {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        perspective: 600px;
        overflow: hidden;
        /* Sky Gradient */
        background: linear-gradient(to bottom, var(--bg-sky-top) 0%, var(--bg-sky-horizon) 40%, #cbd5e1 45%);
    }

    /* Background Mountains (Silhouettes) */
    .mountains {
        position: absolute;
        top: 30%; left: 0; width: 100%; height: 20%;
        background-image: 
            linear-gradient(135deg, transparent 50%, #1e293b 50%),
            linear-gradient(45deg, transparent 50%, #1e293b 50%);
        background-size: 200px 100%;
        background-repeat: repeat-x;
        background-position: 0 bottom;
        opacity: 0.6;
        z-index: 0;
        filter: blur(1px);
    }

    /* The Slope (3D Plane) */
    #slope-wrapper {
        position: absolute;
        top: 38%; /* Horizon */
        left: -50%;
        width: 200%;
        height: 200%;
        transform-origin: top center;
        transform: rotateX(65deg);
        /* Deep Ice Gradient */
        background: linear-gradient(to bottom, var(--ice-dark) 0%, var(--ice-base) 40%, #ffffff 100%);
        z-index: 1;
        overflow: hidden;
        box-shadow: 0 0 50px rgba(255,255,255,0.5);
    }

    /* Track Markers (The 'Route') */
    .track-lines {
        position: absolute;
        top: 0; left: 50%; width: 30%; height: 100%;
        transform: translateX(-50%);
        background: repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 150px,
            rgba(255,255,255,0.4) 150px,
            rgba(255,255,255,0.4) 152px
        );
        /* Fades out near horizon */
        mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 100%);
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 100%);
        z-index: 1;
    }

    /* Noise Texture (Frost/Ice) */
    .ice-noise {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        opacity: 0.15;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        background-size: 200px 200px;
        z-index: 2;
        pointer-events: none;
        mix-blend-mode: overlay;
    }

    /* Speed Lines (Vertical streaks) */
    .speed-lines {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: repeating-linear-gradient(
            180deg,
            transparent 0%,
            rgba(255, 255, 255, 0.3) 2%,
            transparent 4%
        );
        background-size: 100% 100px;
        opacity: 0;
        mix-blend-mode: overlay;
        pointer-events: none;
        z-index: 5;
    }

    /* --- 2. Gameplay Elements --- */
    #entities-layer {
        position: absolute;
        top: 38%; left: -50%; width: 200%; height: 200%;
        transform-origin: top center;
        transform: rotateX(65deg);
        z-index: 10;
        pointer-events: none;
    }

    /* Gates (Industrial/Neon) */
    .gate {
        position: absolute;
        width: 160px;
        height: 100px;
        border-top: 6px solid var(--ui-cyan);
        border-left: 6px solid var(--ui-cyan);
        border-right: 6px solid var(--ui-cyan);
        border-radius: 10px 10px 0 0;
        background: rgba(6, 182, 212, 0.1);
        box-shadow: 0 0 15px var(--ui-cyan), inset 0 0 10px var(--ui-cyan);
        display: flex;
        justify-content: center;
    }
    
    .gate.red { 
        border-color: var(--ui-orange); 
        background: rgba(249, 115, 22, 0.1);
        box-shadow: 0 0 15px var(--ui-orange), inset 0 0 10px var(--ui-orange);
    }

    .gate-flag {
        position: absolute;
        top: -15px;
        width: 40px;
        height: 20px;
        background: #000;
        color: #fff;
        font-weight: 900;
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid white;
        transform: skewX(-10deg);
    }

    /* Rocks (Geometric) */
    .rock {
        position: absolute;
        width: 100px;
        height: 60px;
        background: #334155;
        clip-path: polygon(10% 100%, 0% 40%, 30% 0%, 70% 0%, 100% 40%, 90% 100%);
        border-bottom: 4px solid #1e293b;
        filter: drop-shadow(0px 10px 5px rgba(0,0,0,0.5));
    }

    /* The Rider (Stylized SVG) */
    #player-layer {
        position: absolute;
        bottom: 12%;
        left: 50%;
        width: 180px;
        height: 180px;
        z-index: 20;
        transform: translate(-50%, 0);
        filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
        pointer-events: none;
        /* Rider bobbing animation */
        animation: bob 0.3s infinite alternate ease-in-out;
    }

    @keyframes bob {
        from { transform: translate(-50%, 0) translateY(-2px); }
        to { transform: translate(-50%, 0) translateY(2px); }
    }

    /* --- 3. UI System (Sporty/Industrial) --- */
    #hud-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 100;
        pointer-events: none;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    /* Industrial Panel Style */
    .ind-panel {
        background: rgba(15, 23, 42, 0.85);
        border: 2px solid var(--ui-cyan);
        /* Angled corners using clip-path */
        clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        box-shadow: 0 0 10px rgba(6, 182, 212, 0.2);
    }

    /* Top Progress Bar */
    .progress-wrapper {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 300px;
        display: flex;
        flex-direction: column;
        gap: 5px;
    }
    
    .progress-label {
        font-size: 10px;
        color: var(--ui-cyan);
        letter-spacing: 2px;
        text-transform: uppercase;
        text-align: center;
        font-weight: bold;
    }

    .progress-track {
        height: 12px;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.3);
        position: relative;
        overflow: hidden;
    }

    .progress-fill {
        height: 100%;
        width: 0%;
        background: var(--ui-cyan);
        box-shadow: 0 0 15px var(--ui-cyan);
        position: relative;
    }

    /* Glowing Head Indicator */
    .progress-head {
        position: absolute;
        right: 0; top: -2px; bottom: -2px;
        width: 6px;
        background: #fff;
        box-shadow: 0 0 10px #fff, 0 0 20px var(--ui-cyan);
    }

    /* HUD Cards */
    .hud-container {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        width: 100%;
        margin-top: 60px; /* Space for progress bar */
    }

    .hud-card {
        padding: 10px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 120px;
        /* Angled corners */
        clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
        background: rgba(15, 23, 42, 0.9);
        border-left: 4px solid var(--ui-orange);
    }

    .hud-card.right {
        border-left: none;
        border-right: 4px solid var(--ui-cyan);
        text-align: right;
        align-items: flex-end;
    }

    .hud-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: rgba(255,255,255,0.6);
        margin-bottom: 2px;
        font-weight: 900;
    }

    .hud-value {
        font-size: 2.2rem;
        font-weight: 700;
        /* Digital font feel */
        font-family: 'Courier New', Courier, monospace;
        color: #fff;
        line-height: 1;
        text-shadow: 0 0 5px rgba(255,255,255,0.5);
    }

    .hud-unit {
        font-size: 0.8rem;
        color: var(--ui-orange);
        font-weight: bold;
        margin-left: 4px;
    }
    .hud-card.right .hud-unit { color: var(--ui-cyan); }

    /* --- 4. Controls (High Contrast) --- */
    .controls-area {
        position: absolute;
        bottom: 30px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: space-between;
        padding: 0 30px;
        pointer-events: auto;
    }

    .control-btn {
        width: 90px;
        height: 90px;
        /* Industrial Shape */
        clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
        background: rgba(15, 23, 42, 0.8);
        border: 2px solid rgba(255,255,255,0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.1s;
        backdrop-filter: blur(5px);
    }

    .control-btn:active, .control-btn.active {
        background: var(--ui-cyan);
        border-color: #fff;
        transform: scale(0.95);
        box-shadow: 0 0 20px var(--ui-cyan);
    }

    .control-btn svg {
        width: 40px;
        height: 40px;
        fill: #fff;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    /* FX: Flash & Vignette */
    #flash-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: white;
        opacity: 0;
        z-index: 200;
        pointer-events: none;
        transition: opacity 0.1s;
    }

    .vignette {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.6) 100%);
        z-index: 90;
        pointer-events: none;
    }

</style>
</head>
<body>

<div id="world-container">
    
    <!-- Background -->
    <div class="mountains"></div>

    <!-- 1. Slope -->
    <div id="slope-wrapper">
        <div class="track-lines"></div>
        <div class="ice-noise"></div>
    </div>
    
    <!-- Speed Lines Overlay -->
    <div class="speed-lines" id="speed-lines"></div>

    <!-- 2. Entities (Gates/Rocks) -->
    <div id="entities-layer"></div>

    <!-- 3. Player -->
    <div id="player-layer">
        <svg viewBox="0 0 100 120" style="width:100%; height:100%; overflow:visible;">
            <defs>
                <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:1" />
                </linearGradient>
            </defs>
            
            <!-- Shadow -->
            <ellipse cx="50" cy="112" rx="35" ry="5" fill="rgba(0,0,0,0.4)" filter="blur(2px)" />
            
            <!-- Board -->
            <g transform="rotate(-5 50 100)">
                <!-- Main Board -->
                <path d="M10 95 Q50 115 90 95 L85 100 Q50 120 15 100 Z" fill="#1e293b" />
                <!-- Graphic -->
                <path d="M25 98 L35 98 L30 90 Z" fill="#f97316" />
                <path d="M75 98 L65 98 L70 90 Z" fill="#06b6d4" />
                <line x1="50" y1="90" x2="50" y2="110" stroke="#fff" stroke-width="2" />
            </g>
            
            <!-- Legs -->
            <path d="M42 75 L32 98" stroke="#020617" stroke-width="7" stroke-linecap="round" />
            <path d="M58 75 L68 98" stroke="#020617" stroke-width="7" stroke-linecap="round" />
            
            <!-- Body (Tucked) -->
            <g transform="rotate(15 50 55)">
                <path d="M35 80 L55 35 L75 80 Z" fill="url(#suitGrad)" /> 
                <!-- Suit Zipper -->
                <path d="M55 35 L55 80" stroke="#fff" stroke-width="1" stroke-dasharray="2,2" />
            </g>
            
            <!-- Head/Helmet -->
            <g transform="rotate(20 50 25)">
                <circle cx="50" cy="25" r="14" fill="#0f172a" />
                <!-- Visor -->
                <path d="M36 25 Q50 15 64 25 L60 32 Q50 28 40 32 Z" fill="#fbbf24" />
                <path d="M42 28 L58 28" stroke="rgba(0,0,0,0.3)" stroke-width="1" />
            </g>
            
            <!-- Scarf (Motion) -->
            <path d="M45 40 Q10 50 5 30" stroke="#06b6d4" stroke-width="4" fill="none" stroke-linecap="round" />
        </svg>
    </div>

    <!-- 4. HUD -->
    <div id="hud-layer">
        
        <!-- Progress -->
        <div class="progress-wrapper">
            <div class="progress-label">Course Progress</div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-bar">
                    <div class="progress-head"></div>
                </div>
            </div>
        </div>

        <!-- Stats -->
        <div class="hud-container">
            <!-- Speed Card -->
            <div class="hud-card left">
                <span class="hud-label">Speed</span>
                <span class="hud-value" id="speed-val">0 <span class="hud-unit">km/h</span></span>
            </div>
            
            <!-- Distance Card -->
            <div class="hud-card right">
                <span class="hud-label">Distance</span>
                <span class="hud-value" id="dist-val">0 <span class="hud-unit">m</span></span>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls-area">
            <div class="control-btn" id="btn-left">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </div>
            <div class="control-btn" id="btn-right">
                <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </div>
        </div>
    </div>

    <!-- FX -->
    <div class="vignette"></div>
    <div id="flash-overlay"></div>

</div>

<script>
    // --- Config ---
    const config = {
        horizonY: 0.38,
        baseSpeed: 100,
        maxSpeed: 240
    };

    // --- State ---
    let state = {
        speed: 0,
        distance: 0,
        playerX: 0, // -1 to 1
        targetX: 0,
        frame: 0
    };

    // --- DOM Elements ---
    const els = {
        trackLines: document.querySelector('.track-lines'),
        speedLines: document.getElementById('speed-lines'),
        entities: document.getElementById('entities-layer'),
        player: document.getElementById('player-layer'),
        speedVal: document.getElementById('speed-val'),
        distVal: document.getElementById('dist-val'),
        progress: document.getElementById('progress-bar'),
        flash: document.getElementById('flash-overlay'),
        btnLeft: document.getElementById('btn-left'),
        btnRight: document.getElementById('btn-right')
    };

    let obstacles = [];
    let particles = [];

    // --- Input Handling ---
    let input = { left: false, right: false };

    function setDir(dir, active) {
        input[dir] = active;
        if (dir === 'left') els.btnLeft.classList.toggle('active', active);
        if (dir === 'right') els.btnRight.classList.toggle('active', active);
    }

    // Touch/Mouse
    ['mousedown', 'touchstart'].forEach(evt => {
        els.btnLeft.addEventListener(evt, (e) => { e.preventDefault(); setDir('left', true); });
        els.btnRight.addEventListener(evt, (e) => { e.preventDefault(); setDir('right', true); });
    });
    ['mouseup', 'touchend', 'mouseleave'].forEach(evt => {
        els.btnLeft.addEventListener(evt, (e) => { e.preventDefault(); setDir('left', false); });
        els.btnRight.addEventListener(evt, (e) => { e.preventDefault(); setDir('right', false); });
    });

    // Keyboard
    window.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft' || e.key === 'a') setDir('left', true);
        if (e.key === 'ArrowRight' || e.key === 'd') setDir('right', true);
    });
    window.addEventListener('keyup', e => {
        if (e.key === 'ArrowLeft' || e.key === 'a') setDir('left', false);
        if (e.key === 'ArrowRight' || e.key === 'd') setDir('right', false);
    });

    // --- Logic ---
    function updatePhysics() {
        // Acceleration
        if (state.speed < config.maxSpeed) state.speed += 0.5;
        
        // Lateral Movement
        if (input.left) state.targetX -= 0.04;
        if (input.right) state.targetX += 0.04;
        state.targetX = Math.max(-0.9, Math.min(0.9, state.targetX));
        
        // Smooth follow
        state.playerX += (state.targetX - state.playerX) * 0.15;

        // Distance
        state.distance += state.speed * 0.05;
        let progress = (state.distance % 1000) / 10;
        els.progress.style.width = `${progress}%`;

        // Player Visuals
        const screenX = 50 + (state.playerX * 20); 
        els.player.style.left = `${screenX}%`;
        
        // Lean effect
        const lean = (state.targetX - state.playerX) * 500;
        els.player.style.transform = `translate(-50%, 0) rotate(${lean}deg)`;

        // HUD Updates
        els.speedVal.innerHTML = Math.floor(state.speed) + ' <span class="hud-unit">km/h</span>';
        els.distVal.innerHTML = Math.floor(state.distance) + ' <span class="hud-unit">m</span>';

        // Track Animation (Vertical offset)
        const trackOffset = (state.distance * 50) % 150;
        els.trackLines.style.backgroundPosition = `0 ${trackOffset}px`;

        // Speed Lines Animation (Opacity & Position)
        const speedPct = (state.speed - 50) / (config.maxSpeed - 50);
        els.speedLines.style.opacity = Math.max(0, speedPct * 0.8);
        const lineOffset = (state.distance * 150) % 100;
        els.speedLines.style.backgroundPosition = `0 ${lineOffset}px`;

        // Spawning
        if (Math.random() < 0.05) spawnObstacle();
        updateObstacles();

        // Particles
        if (state.speed > 60 && Math.random() > 0.5) spawnParticle();
        updateParticles();
    }

    function spawnObstacle() {
        const type = Math.random() > 0.4 ? 'gate' : 'rock';
        const el = document.createElement('div');
        const obsX = (Math.random() * 1.6) - 0.8;
        
        el.className = `obstacle ${type}`;
        
        if (type === 'gate') {
            const isBlue = Math.random() > 0.5;
            el.classList.add(isBlue ? '' : 'red');
            el.innerHTML = `<div class="gate-flag">${Math.floor(Math.random()*99)}</div>`;
        }

        els.entities.appendChild(el);
        
        obstacles.push({
            el: el,
            x: obsX,
            z: 0,
            type: type
        });
    }

    function updateObstacles() {
        const moveSpeed = state.speed * 0.001;

        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.z += moveSpeed;

            // Collision (Z-depth overlap)
            // Player Z is approx 0.85
            if (obs.z > 0.82 && obs.z < 0.92) {
                // X overlap check
                if (Math.abs(obs.x - state.playerX) < 0.15) {
                    crash();
                    obs.z = 1.5; // Reset to avoid sticky crash
                }
            }

            // Cleanup
            if (obs.z > 1.5) {
                obs.el.remove();
                obstacles.splice(i, 1);
            } else {
                renderObstacle(obs);
            }
        }
    }

    function renderObstacle(obs) {
        // Projection Math
        const scale = Math.pow(obs.z, 2.5) * 4.0; 
        const yPos = config.horizonY + (obs.z * (1 - config.horizonY));
        const xPos = 50 + (obs.x * 35 * obs.z); 

        obs.el.style.top = `${yPos * 100}%`;
        obs.el.style.left = `${xPos}%`;
        obs.el.style.transform = `translate(-50%, -100%) scale(${scale})`;
        obs.el.style.opacity = obs.z < 0.1 ? obs.z * 10 : 1;
        obs.el.style.zIndex = Math.floor(obs.z * 100);
    }

    function crash() {
        state.speed *= 0.4;
        els.flash.style.opacity = "0.6";
        setTimeout(() => els.flash.style.opacity = "0", 100);
        
        // Screen Shake
        document.body.style.transform = `translate(${Math.random()*10-5}px, ${Math.random()*10-5}px)`;
        setTimeout(() => document.body.style.transform = "none", 100);
    }

    // --- Particle System ---
    function spawnParticle() {
        const p = document.createElement('div');
        p.style.position = 'absolute';
        p.style.background = 'white';
        p.style.borderRadius = '50%';
        p.style.pointerEvents = 'none';
        document.body.appendChild(p);
        
        const playerRect = els.player.getBoundingClientRect();
        const startX = playerRect.left + playerRect.width/2 + (Math.random()*40 - 20);
        const startY = playerRect.bottom - 20;

        particles.push({
            el: p,
            x: startX,
            y: startY,
            vx: (Math.random() - 0.5) * 20,
            vy: (Math.random() * -10) - 5,
            life: 1.0,
            size: Math.random() * 5 + 2
        });
    }

    function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.life -= 0.04;
            p.x += p.vx + (state.playerX * 40);
            p.y += p.vy;
            p.vy += 0.5; // Gravity

            p.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
            p.el.style.width = `${p.size}px`;
            p.el.style.height = `${p.size}px`;
            p.el.style.opacity = p.life;

            if (p.life <= 0) {
                p.el.remove();
                particles.splice(i, 1);
            }
        }
    }

    // --- Loop ---
    function loop() {
        requestAnimationFrame(loop);
        updatePhysics();
    }

    loop();

</script>
</body>
</html>
