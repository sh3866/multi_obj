<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Alpine Velocity: Sliding Challenge</title>
<style>
    :root {
        /* Palette - Deep Alpine Tech */
        --bg-sky-top: #020617;   /* Very Dark Blue */
        --bg-sky-bot: #1e293b;   /* Slate */
        --ice-base: #f8fafc;     /* Bright Snow */
        --ice-shadow: #cbd5e1;   /* Deeper Snow */
        
        --ui-bg: #0f172a;        /* Deep Navy */
        --ui-text: #ffffff;      /* Pure White */
        --accent-blue: #38bdf8;  /* Cyan/Sky */
        --accent-red: #f43f5e;   /* Rose Red */
        --accent-gold: #fbbf24;  /* Amber */

        --font-main: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
    }

    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--bg-sky-top);
        font-family: var(--font-main);
        color: var(--ui-text);
    }

    /* GAME CONTAINER */
    #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    /* LAYERS */
    .layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }

    /* 1. Environment: Sky & Mountains */
    #sky-layer {
        z-index: 0;
        /* Deep vertical drop gradient */
        background: linear-gradient(to bottom, var(--bg-sky-top) 0%, var(--bg-sky-bot) 40%, #475569 100%);
    }

    #mountains {
        z-index: 1;
        filter: blur(2px); /* Depth of field */
        opacity: 0.8;
    }

    /* 2. The Slope */
    canvas#slope-canvas {
        z-index: 2;
        display: block;
    }

    /* 3. Entities */
    #entities-layer {
        z-index: 3;
    }

    /* 4. Atmosphere (Vignette & Particles) */
    #vignette-layer {
        z-index: 4;
        background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.6) 90%, #000 100%);
        pointer-events: none;
    }
    
    #atmosphere-layer {
        z-index: 5;
        mix-blend-mode: screen; /* Make snow pop */
    }

    /* 5. Player */
    #player {
        position: absolute;
        bottom: 22%;
        left: 50%;
        width: 150px;
        height: 150px;
        transform: translate(-50%, 0);
        z-index: 6;
        transition: left 0.05s linear; /* Fast response */
        /* Strong drop shadow for separation */
        filter: drop-shadow(0 15px 10px rgba(0,0,0,0.7));
    }

    /* --- UI: HUD --- */
    #hud-layer {
        z-index: 20;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }

    /* Chamfered Clip Path Utility */
    .chamfered {
        clip-path: polygon(
            10px 0, 100% 0, 
            100% calc(100% - 10px), calc(100% - 10px) 100%, 
            0 100%, 0 10px
        );
    }

    /* Progress Bar (Top Center) */
    .progress-container {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 240px;
        height: 12px;
        background: rgba(15, 23, 42, 0.6); /* Semi-transparent Navy */
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255,255,255,0.2);
        /* Chamfered look */
        clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%, 0 8px);
        display: flex;
        align-items: center;
        padding: 2px;
    }

    .progress-track {
        width: 100%;
        height: 100%;
        background: #1e293b;
        position: relative;
        overflow: hidden;
    }

    .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--accent-blue), #fff);
        box-shadow: 0 0 15px var(--accent-blue);
        position: relative;
    }
    
    /* Gate Marker on Progress Bar */
    .progress-marker {
        position: absolute;
        right: 0;
        top: -5px;
        bottom: -5px;
        width: 2px;
        background: white;
        box-shadow: 0 0 5px white;
    }

    /* HUD Cards */
    .top-bar {
        position: absolute;
        top: 45px; /* Below progress bar */
        width: 100%;
        display: flex;
        justify-content: space-between;
        padding: 0 25px;
        pointer-events: none;
    }

    .hud-card {
        background: var(--ui-bg);
        color: var(--ui-text);
        padding: 10px 20px;
        /* Chamfered Geometry */
        clip-path: polygon(
            15px 0, 100% 0, 
            100% calc(100% - 15px), calc(100% - 15px) 100%, 
            0 100%, 0 15px
        );
        border-left: 4px solid var(--accent-blue);
        box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
        min-width: 120px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    
    .hud-card.right {
        border-left: none;
        border-right: 4px solid var(--accent-gold);
        text-align: right;
    }

    .hud-label {
        font-size: 0.7rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #94a3b8;
        margin-bottom: 2px;
    }

    .hud-value {
        font-size: 1.8rem; /* Speed is huge */
        font-weight: 900;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        font-style: italic; /* Speed feel */
    }
    
    .hud-value.small {
        font-size: 1.4rem; /* Distance is smaller */
    }

    .hud-unit {
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--accent-blue);
        margin-left: 4px;
    }
    .hud-card.right .hud-unit {
        color: var(--accent-gold);
    }

    /* --- Controls --- */
    .controls-area {
        position: absolute;
        bottom: 40px;
        width: 100%;
        display: flex;
        justify-content: space-between;
        padding: 0 40px;
        pointer-events: auto;
    }

    .control-btn {
        width: 80px;
        height: 80px;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.8);
        /* Chamfered Button */
        clip-path: polygon(
            15px 0, 100% 0, 
            100% calc(100% - 15px), calc(100% - 15px) 100%, 
            0 100%, 0 15px
        );
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.1s;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .control-btn:active, .control-btn.active {
        background: rgba(255, 255, 255, 0.4);
        transform: scale(0.95);
        border-color: var(--accent-blue);
    }

    .control-btn svg {
        width: 32px;
        height: 32px;
        fill: white;
        filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
    }

    /* --- Obstacles --- */
    .gate {
        position: absolute;
        width: 140px;
        height: 100px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        z-index: 3;
    }

    /* Ice Shards / Rock */
    .ice-shard {
        position: absolute;
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #e2e8f0, #64748b);
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        box-shadow: 5px 5px 15px rgba(0,0,0,0.4);
        border-bottom: 2px solid #fff;
    }

    /* Gate Styles */
    .gate-pole {
        width: 6px;
        height: 100%;
        background: #0f172a;
        position: absolute;
        top: 0;
        border-radius: 2px;
    }
    .gate-pole.left { left: 0; }
    .gate-pole.right { right: 0; }

    .gate-flag {
        position: absolute;
        top: 0;
        width: 100%;
        height: 45px;
        background: var(--accent-blue);
        clip-path: polygon(0 0, 100% 0, 95% 100%, 5% 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        color: #fff;
        font-size: 1.8rem;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .gate-red .gate-flag { background: var(--accent-red); }
    
    /* Gate Number Badge */
    .gate-number {
        position: absolute;
        bottom: -25px;
        background: var(--ui-bg);
        color: white;
        padding: 2px 8px;
        font-size: 0.8rem;
        font-weight: bold;
        border-radius: 4px;
        border: 1px solid rgba(255,255,255,0.2);
    }

    /* Flash Effect */
    #flash-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: white;
        opacity: 0;
        z-index: 30;
        pointer-events: none;
        transition: opacity 0.1s;
    }

</style>
</head>
<body>

<div id="game-container">
    <!-- 1. Sky Background -->
    <div id="sky-layer" class="layer"></div>

    <!-- 2. Mountains (Parallax) -->
    <svg id="mountains" class="layer" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
        <defs>
            <linearGradient id="mtnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
            </linearGradient>
        </defs>
        <!-- Darker, sharper mountains -->
        <path d="M0 600 L150 400 L300 600 L450 300 L600 600 L750 350 L1000 600 L1000 1000 L0 1000 Z" fill="url(#mtnGrad)" />
    </svg>

    <!-- 3. Slope Surface (Canvas) -->
    <canvas id="slope-canvas" class="layer"></canvas>

    <!-- 4. Game Entities -->
    <div id="entities-layer" class="layer"></div>

    <!-- 5. Vignette Overlay -->
    <div id="vignette-layer" class="layer"></div>

    <!-- 6. Atmosphere (Particles) -->
    <canvas id="atmosphere-layer" class="layer"></canvas>

    <!-- Flash Effect -->
    <div id="flash-overlay"></div>

    <!-- 7. Player Character -->
    <div id="player">
        <svg class="rider-svg" viewBox="0 0 100 100" style="width:100%; height:100%;">
            <!-- Dynamic Shadow -->
            <ellipse cx="50" cy="92" rx="30" ry="8" fill="rgba(0,0,0,0.6)" />
            
            <!-- Board (High Contrast Dark) -->
            <rect x="10" y="84" width="80" height="10" rx="5" fill="#0f172a" />
            <rect x="10" y="84" width="80" height="3" rx="1.5" fill="#38bdf8" /> <!-- Neon accent -->
            
            <!-- Legs (Dark) -->
            <path d="M35 65 L25 84" stroke="#020617" stroke-width="8" stroke-linecap="round" />
            <path d="M65 65 L75 84" stroke="#020617" stroke-width="8" stroke-linecap="round" />
            
            <!-- Body (Vibrant Jacket) -->
            <path d="M30 65 L50 30 L70 65 Z" fill="#f43f5e" /> 
            <!-- Jacket Details -->
            <path d="M50 30 L50 65" stroke="#be123c" stroke-width="2"/>
            <path d="M35 50 L65 50" stroke="#be123c" stroke-width="2"/>
            
            <!-- Head (Helmet) -->
            <circle cx="50" cy="22" r="13" fill="#0f172a" />
            <path d="M38 22 Q50 14 62 22 L62 28 L38 28 Z" fill="#fbbf24" /> <!-- Goggles -->
            
            <!-- Scarf (Motion) -->
            <path d="M42 35 Q10 45 5 35" stroke="#38bdf8" stroke-width="5" fill="none" stroke-linecap="round" />
        </svg>
    </div>

    <!-- HUD -->
    <div id="hud-layer" class="layer">
        
        <!-- Top Center: Progress -->
        <div class="progress-container">
            <div class="progress-track">
                <div class="progress-fill" id="progress-bar"></div>
            </div>
        </div>

        <!-- Top Corners: Stats -->
        <div class="top-bar">
            <!-- Speed (Left) -->
            <div class="hud-card chamfered">
                <span class="hud-label">Speed</span>
                <span class="hud-value" id="speed-val">0 <span class="hud-unit">km/h</span></span>
            </div>
            
            <!-- Distance (Right) -->
            <div class="hud-card right chamfered">
                <span class="hud-label">Distance</span>
                <span class="hud-value small" id="dist-val">0 <span class="hud-unit">m</span></span>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls-area">
            <div class="control-btn" id="btn-left">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </div>
            <div class="control-btn" id="btn-right">
                <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </div>
        </div>
    </div>
</div>

<script>
    // --- Configuration & State ---
    const canvas = document.getElementById('slope-canvas');
    const ctx = canvas.getContext('2d');
    const atmoCanvas = document.getElementById('atmosphere-layer');
    const atmoCtx = atmoCanvas.getContext('2d');
    const entitiesLayer = document.getElementById('entities-layer');
    const playerEl = document.getElementById('player');
    const speedVal = document.getElementById('speed-val');
    const distVal = document.getElementById('dist-val');
    const progressBar = document.getElementById('progress-bar');
    const flashOverlay = document.getElementById('flash-overlay');

    let width, height;
    let gameFrame = 0;
    let speed = 0;
    let targetSpeed = 160; // Faster
    let distance = 0;
    let playerX = 0.5; // 0 to 1
    let targetPlayerX = 0.5;
    
    // Perspective Constants
    const horizonY = 0.35; 
    const vanishPointX = 0.5;
    
    // Game Objects
    const obstacles = [];
    const particles = [];
    
    // Input State
    let input = { left: false, right: false };

    // --- Initialization ---
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        atmoCanvas.width = width;
        atmoCanvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Game Logic ---

    function updatePhysics() {
        // Acceleration
        if (speed < targetSpeed) speed += 0.8;
        
        // Lateral Movement
        if (input.left) targetPlayerX -= 0.012;
        if (input.right) targetPlayerX += 0.012;
        
        // Boundaries
        if (targetPlayerX < 0.15) targetPlayerX = 0.15;
        if (targetPlayerX > 0.85) targetPlayerX = 0.85;

        // Smooth player movement
        playerX += (targetPlayerX - playerX) * 0.15;
        
        // Update DOM
        playerEl.style.left = `${playerX * 100}%`;
        
        // Tilt player based on movement (Lean into turns)
        const tilt = (targetPlayerX - playerX) * 400;
        playerEl.style.transform = `translate(-50%, 0) rotate(${15 + tilt}deg)`;

        // Update HUD
        speedVal.innerHTML = Math.floor(speed) + ' <span class="hud-unit">km/h</span>';
        distance += speed * 0.015;
        distVal.innerHTML = Math.floor(distance) + ' <span class="hud-unit">m</span>';
        
        // Progress loop
        let progress = (distance % 1000) / 10;
        progressBar.style.width = `${progress}%`;

        // Obstacle Spawning
        if (Math.random() < 0.03) {
            spawnObstacle();
        }
        
        // Update Obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.z -= speed * 0.0004; // Move towards camera
            
            // Collision Detection
            // Player is roughly at z = 0.85
            if (obs.z < 0.88 && obs.z > 0.80) {
                // Check lateral overlap
                if (Math.abs(obs.x - playerX) < 0.06) {
                    triggerCrash();
                    // Reset obstacle
                    obs.z = 1.2; 
                    // Push player
                    if(obs.x < playerX) targetPlayerX -= 0.15;
                    else targetPlayerX += 0.15;
                }
            }

            // Remove if passed
            if (obs.z > 1.5) {
                if(obs.el) obs.el.remove();
                obstacles.splice(i, 1);
            } else {
                renderObstacle(obs);
            }
        }
        
        // Particles
        if (speed > 40 && Math.random() < 0.5) {
            spawnParticle();
        }
        updateParticles();
    }

    function spawnObstacle() {
        const type = Math.random() > 0.3 ? 'gate' : 'shard';
        const x = 0.2 + Math.random() * 0.6; 
        const el = document.createElement('div');
        
        if (type === 'gate') {
            const isRed = Math.random() > 0.5;
            el.className = isRed ? 'gate gate-red' : 'gate';
            el.innerHTML = `
                <div class="gate-pole left"></div>
                <div class="gate-pole right"></div>
                <div class="gate-flag"></div>
                <div class="gate-number">${Math.floor(Math.random()*99)}</div>
            `;
        } else {
            el.className = 'ice-shard';
        }
        
        entitiesLayer.appendChild(el);
        
        obstacles.push({
            type: type,
            x: x,
            z: 1, 
            el: el
        });
    }

    function renderObstacle(obs) {
        const yPos = horizonY + (1 - obs.z) * (1 - horizonY);
        const spread = 2.5 * (1 - obs.z); 
        const xPos = 0.5 + (obs.x - 0.5) * spread;
        const scale = (1 - obs.z) * 2.5;

        const w = obs.type === 'gate' ? 160 : 80;
        const h = obs.type === 'gate' ? 100 : 80;

        obs.el.style.width = `${w * scale}px`;
        obs.el.style.height = `${h * scale}px`;
        obs.el.style.left = `${xPos * 100}%`;
        obs.el.style.top = `${yPos * 100}%`;
        obs.el.style.transform = `translate(-50%, -50%)`;
        
        // Fade in
        obs.el.style.opacity = obs.z > 0.8 ? 1 : (1 - obs.z) * 5;
    }

    function triggerCrash() {
        speed *= 0.4; 
        flashOverlay.style.opacity = "0.8";
        setTimeout(() => { flashOverlay.style.opacity = "0"; }, 150);
    }

    // --- Rendering (Canvas) ---

    function drawSlope() {
        ctx.clearRect(0, 0, width, height);
        
        const horizon = height * horizonY;
        
        // 1. Ice Surface Gradient
        const grad = ctx.createLinearGradient(0, horizon, 0, height);
        grad.addColorStop(0, '#e0f2fe'); // Horizon ice
        grad.addColorStop(1, '#ffffff'); // Bottom ice
        ctx.fillStyle = grad;
        ctx.fillRect(0, horizon, width, height - horizon);
        
        // 2. Speed Streaks (Vertical lines moving downwards)
        const timeOffset = (Date.now() * speed * 0.0001) % 100;
        const streakCount = 20;
        
        // We draw lines radiating from center, but only visible segments moving "down"
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        
        for (let i = 0; i < streakCount; i++) {
            const seed = i * 137.5; 
            const xSpread = (i / streakCount - 0.5) * 2.2; 
            
            // Calculate segment position based on speed
            // We want lines to appear at top and rush to bottom
            let yNorm = (timeOffset + (seed % 100)) / 100; // 0 to 1
            if(yNorm < 0) yNorm += 1;
            
            // Map to screen Y relative to horizon
            let y = horizon + yNorm * (height - horizon);
            
            // If line is off screen bottom, wrap it
            if (y > height) continue;
            
            // Perspective thickness
            let progress = (y - horizon) / (height - horizon);
            let thickness = 1 + (progress * progress * 8);
            
            // X Position at this Y
            let x = width * vanishPointX + xSpread * width * progress;
            
            // Draw streak segment
            let streakLen = (speed * 0.8) + 20; // Length depends on speed
            
            ctx.lineWidth = thickness;
            ctx.globalAlpha = progress * 0.6; // Fade near horizon
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y + streakLen);
            ctx.stroke();
        }
        ctx.globalAlpha = 1.0;
    }

    function spawnParticle() {
        // Spawn behind player
        particles.push({
            x: (playerX - 0.5) * width * 0.2 + width/2 + (Math.random() - 0.5) * 80,
            y: height * 0.8,
            vx: (Math.random() - 0.5) * 20, 
            vy: (Math.random() * 10) + 10,   
            size: Math.random() * 5 + 2,
            life: 1.0
        });
    }

    function updateParticles() {
        atmoCtx.clearRect(0, 0, width, height);
        atmoCtx.fillStyle = '#ffffff';
        
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.02;
            
            atmoCtx.globalAlpha = p.life;
            atmoCtx.beginPath();
            atmoCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            atmoCtx.fill();
            
            if (p.life <= 0) particles.splice(i, 1);
        }
        atmoCtx.globalAlpha = 1.0;
    }

    // --- Main Loop ---

    function loop() {
        drawSlope();
        updatePhysics();
        requestAnimationFrame(loop);
    }

    // --- Controls ---

    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');

    function handleStart(dir) { 
        input[dir] = true; 
        if(dir === 'left') btnLeft.classList.add('active');
        if(dir === 'right') btnRight.classList.add('active');
    }
    function handleEnd(dir) { 
        input[dir] = false;
        if(dir === 'left') btnLeft.classList.remove('active');
        if(dir === 'right') btnRight.classList.remove('active');
    }

    const addBtnEvents = (btn, dir) => {
        btn.addEventListener('mousedown', (e) => { e.preventDefault(); handleStart(dir); });
        btn.addEventListener('mouseup', (e) => { e.preventDefault(); handleEnd(dir); });
        btn.addEventListener('mouseleave', (e) => { handleEnd(dir); });
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(dir); });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); handleEnd(dir); });
    };

    addBtnEvents(btnLeft, 'left');
    addBtnEvents(btnRight, 'right');

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') handleStart('left');
        if (e.key === 'ArrowRight' || e.key === 'd') handleStart('right');
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') handleEnd('left');
        if (e.key === 'ArrowRight' || e.key === 'd') handleEnd('right');
    });

    // Start
    loop();

</script>
</body>
</html>
