<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crossy Road - Revised</title>
<style>
    :root {
        --sky-top: #4FC3F7;
        --sky-bottom: #E1F5FE;
        --ui-color: #FFF;
        --ui-border: #263238;
        --ui-shadow: #90A4AE;
        --accent: #FFCA28;
        
        /* Terrain Colors */
        --grass-top: #7CB342;
        --grass-side: #558B2F;
        --grass-dark: #33691E;
        --road-top: #546E7A;
        --road-side: #37474F;
        --water-top: #29B6F6;
        --water-side: #0277BD;
    }

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }

    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 100%);
        font-family: 'Arial Black', 'Impact', sans-serif;
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
        color: var(--ui-border);
    }

    /* --- 3D SCENE CONTAINER --- */
    #scene {
        width: 100%;
        height: 100%;
        max-width: 600px;
        max-height: 900px;
        position: relative;
        overflow: hidden;
        perspective: 600px; /* Tighter perspective for more depth */
        perspective-origin: 50% 15%;
    }

    /* --- HUD (Chunky Arcade Style) --- */
    .hud-container {
        position: absolute;
        top: 20px;
        left: 20px;
        right: 20px;
        display: flex;
        justify-content: space-between;
        z-index: 100;
        pointer-events: none;
    }

    .hud-card {
        background: var(--ui-color);
        padding: 6px 14px;
        border: 4px solid var(--ui-border);
        /* Chunky 3D Extrusion */
        box-shadow: 0 6px 0 var(--ui-shadow), 0 10px 15px rgba(0,0,0,0.2);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 80px;
        border-radius: 4px;
        transform: skewX(-2deg); /* Slight tilt for style */
    }

    .hud-label {
        font-size: 11px;
        color: #78909C;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 2px;
        font-weight: 800;
    }

    .hud-val {
        font-size: 32px;
        color: var(--ui-border);
        line-height: 1;
        text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
    }

    .hud-card.best .hud-val { color: #FF7043; }

    /* --- GAME BOARD (The World) --- */
    #board {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        /* Tilt the board back */
        transform: rotateX(50deg) translateY(-50px); 
        will-change: transform;
    }

    /* --- LANES (Grid Construction) --- */
    .lane {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: 120vw; /* Wider than screen for side depth */
        height: 100px;
        transform-style: preserve-3d;
        border-top: 4px solid rgba(255,255,255,0.1); /* Lane separation */
    }

    /* Grass */
    .lane.grass { 
        background: var(--grass-top);
        box-shadow: 0 20px 0 var(--grass-side);
    }
    /* Road */
    .lane.road { 
        background: var(--road-top);
        box-shadow: 0 20px 0 var(--road-side);
        border-top: none;
    }
    /* Water */
    .lane.water { 
        background: var(--water-top);
        box-shadow: 0 20px 0 var(--water-side);
        border-top: none;
    }

    /* Lane Details */
    .lane.road::before {
        content: '';
        position: absolute;
        top: 50%; left: 0; width: 100%; height: 8px;
        background: repeating-linear-gradient(90deg, #FFF 0, #FFF 60px, transparent 60px, transparent 120px);
        transform: translateY(-50%);
        opacity: 0.5;
        box-shadow: 0 1px 0 rgba(0,0,0,0.2);
    }
    
    .lane.water::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(45deg, rgba(255,255,255,0.3) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0.3) 75%, transparent 75%, transparent);
        background-size: 40px 40px;
        animation: waterFlow 2s linear infinite;
    }

    @keyframes waterFlow { from { background-position: 0 0; } to { background-position: 40px 40px; } }

    /* --- OBJECTS (Cars, Logs) --- */
    .moving-object {
        position: absolute;
        top: 15px;
        transform-style: preserve-3d;
        will-change: transform;
        filter: drop-shadow(0 15px 5px rgba(0,0,0,0.3));
    }

    /* Low Poly Car */
    .car {
        width: 110px;
        height: 55px;
        background: #EF5350;
        border-radius: 8px;
        position: relative;
        box-shadow: 0 18px 0 #B71C1C;
        border: 3px solid rgba(0,0,0,0.1);
    }
    
    /* Car Roof */
    .car::before {
        content: '';
        position: absolute;
        bottom: 100%; left: 15px;
        width: 75px; height: 35px;
        background: #EF5350;
        border-radius: 8px 8px 0 0;
        transform: skewX(-10deg);
        border-top: 4px solid #FFCDD2;
        border-left: 4px solid #FFCDD2;
    }

    /* Wheels */
    .car::after {
        content: '';
        position: absolute;
        bottom: -8px; left: 15px;
        width: 22px; height: 22px;
        background: #222;
        border-radius: 50%;
        box-shadow: 68px 0 0 #222;
        border: 3px solid #555;
    }

    .car.truck {
        width: 170px; height: 65px; background: #FFA726; box-shadow: 0 18px 0 #E65100;
    }
    .car.truck::before { width: 85px; height: 45px; bottom: 100%; left: 65px; background: #FFA726; border-top-color: #FFE0B2; border-left-color: #FFE0B2;}
    .car.truck::after { width: 24px; height: 24px; box-shadow: 130px 0 0 #222; }

    /* Low Poly Log */
    .log {
        width: 150px; height: 45px;
        background: #8D6E63;
        border-radius: 6px;
        box-shadow: 0 15px 0 #4E342E;
        position: relative;
        border: 3px solid rgba(0,0,0,0.1);
    }
    .log::before {
        content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        border-top: 5px solid #A1887F;
        border-radius: 6px;
    }

    /* Trees */
    .tree {
        position: absolute;
        bottom: 15px;
        width: 45px; height: 45px;
        transform-style: preserve-3d;
        filter: drop-shadow(0 20px 5px rgba(0,0,0,0.3));
    }
    .tree-top {
        width: 0; height: 0;
        border-left: 40px solid transparent;
        border-right: 40px solid transparent;
        border-bottom: 110px solid #43A047;
        position: relative;
        left: -15px; top: -110px;
    }
    /* Tree Facet Highlight */
    .tree-top::after {
        content: ''; position: absolute; top: 110px; left: -40px;
        border-left: 40px solid transparent;
        border-right: 40px solid transparent;
        border-bottom: 110px solid #66BB6A;
        clip-path: polygon(50% 0%, 100% 100%, 50% 100%);
    }
    .tree-trunk {
        width: 18px; height: 30px; background: #5D4037;
        margin-left: 13px; margin-top: -30px;
        box-shadow: 5px 5px 0 #3E2723;
    }

    /* --- PLAYER (The Hero) --- */
    #player {
        position: absolute;
        width: 70px; height: 70px;
        z-index: 10;
        transition: bottom 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                    left 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        transform: translateX(-50%);
        transform-style: preserve-3d;
    }

    .chicken {
        width: 100%; height: 100%;
        position: relative;
        animation: hop 0.3s infinite alternate ease-in-out;
    }

    .c-body {
        width: 55px; height: 55px;
        background: #FFF9C4;
        border-radius: 14px;
        position: absolute; bottom: 0; left: 5px;
        box-shadow: 0 15px 0 #FBC02D;
        border: 3px solid #F9A825;
    }

    .c-head {
        width: 35px; height: 35px;
        background: #FFF9C4;
        border-radius: 10px;
        position: absolute; top: -18px; right: 0;
        box-shadow: 0 10px 0 #FBC02D;
        border: 3px solid #F9A825;
    }

    .c-beak {
        width: 14px; height: 12px;
        background: #FF9800;
        position: absolute; top: 14px; right: -10px;
        clip-path: polygon(0 0, 100% 50%, 0 100%);
        border-right: 2px solid #E65100;
    }

    .c-eye {
        width: 7px; height: 7px;
        background: #333;
        border-radius: 50%;
        position: absolute; top: 10px; right: 10px;
        box-shadow: inset 2px 2px 0 rgba(255,255,255,0.4);
    }

    .c-wings {
        width: 25px; height: 15px;
        background: #FFF;
        border-radius: 12px;
        position: absolute; top: 18px; left: -8px;
        transform: rotate(20deg);
        border: 3px solid #F9A825;
    }

    @keyframes hop {
        0% { transform: translateY(0) scale(1, 1); }
        100% { transform: translateY(-10px) scale(0.95, 1.05); }
    }

    /* --- CONTROLS (Bottom Left D-Pad) --- */
    .controls {
        position: absolute;
        bottom: 30px;
        left: 30px;
        width: 160px;
        height: 160px;
        z-index: 200;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 1fr 1fr 1fr;
    }

    .d-btn {
        width: 55px;
        height: 55px;
        background: var(--ui-color);
        border-radius: 12px;
        border: 4px solid var(--ui-border);
        /* Deep 3D Pressable Look */
        box-shadow: 0 8px 0 var(--ui-shadow), 0 12px 10px rgba(0,0,0,0.2);
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 0.1s;
        position: absolute;
    }

    .d-btn:active {
        transform: translateY(8px);
        box-shadow: 0 0 0 var(--ui-shadow), inset 0 4px 10px rgba(0,0,0,0.1);
    }

    .d-btn svg {
        width: 24px; height: 24px;
        fill: var(--ui-border);
    }

    .d-up { top: 0; left: 53px; }
    .d-down { bottom: 0; left: 53px; }
    .d-left { top: 53px; left: 0; }
    .d-right { top: 53px; right: 0; }

    /* Clouds */
    .cloud {
        position: absolute;
        background: rgba(255,255,255,0.8);
        border-radius: 50px;
        box-shadow: 0 10px 0 rgba(0,0,0,0.05);
        animation: floatCloud 40s linear infinite;
        z-index: 0;
        border: 3px solid rgba(255,255,255,0.9);
    }
    
    .cloud::after {
        content: ''; position: absolute; top: -20px; left: 20px; width: 40px; height: 40px;
        background: inherit; border-radius: 50%; border: inherit;
    }

    @keyframes floatCloud { from { transform: translateX(-200px); } to { transform: translateX(100vw); } }

</style>
</head>
<body>

<div id="scene">
    <!-- HUD -->
    <div class="hud-container">
        <div class="hud-card">
            <div class="hud-label">Score</div>
            <div class="hud-val" id="score">0</div>
        </div>
        <div class="hud-card best">
            <div class="hud-label">Best</div>
            <div class="hud-val" id="best">0</div>
        </div>
    </div>

    <!-- BACKGROUND -->
    <div class="cloud" style="top: 5%; left: -10%; width: 100px; height: 35px; animation-duration: 50s;"></div>
    <div class="cloud" style="top: 15%; left: -30%; width: 140px; height: 50px; animation-duration: 35s; animation-delay: -15s;"></div>
    <div class="cloud" style="top: 2%; left: -60%; width: 80px; height: 25px; animation-duration: 60s;"></div>

    <!-- GAME BOARD -->
    <div id="board"></div>

    <!-- PLAYER -->
    <div id="player">
        <div class="chicken">
            <div class="c-head">
                <div class="c-eye"></div>
                <div class="c-beak"></div>
            </div>
            <div class="c-body">
                <div class="c-wings"></div>
            </div>
        </div>
    </div>

    <!-- CONTROLS (Relocated to Bottom Left) -->
    <div class="controls">
        <div class="d-btn d-up" onclick="movePlayer(0, 1)">
            <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h6v8h4v-8h6z"/></svg>
        </div>
        <div class="d-btn d-down" onclick="movePlayer(0, -1)">
            <svg viewBox="0 0 24 24"><path d="M12 20l8-8h-6V4h-4v8H4z"/></svg>
        </div>
        <div class="d-btn d-left" onclick="movePlayer(-1, 0)">
            <svg viewBox="0 0 24 24"><path d="M4 12l8-8v6h8v4h-8v6z"/></svg>
        </div>
        <div class="d-btn d-right" onclick="movePlayer(1, 0)">
            <svg viewBox="0 0 24 24"><path d="M20 12l-8-8v6H4v4h8v6z"/></svg>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    const LANE_HEIGHT = 100;
    const BOARD_OFFSET_Y = -50;
    const START_LANES = 12;
    const GRID_UNIT_X = 90; // Width of one grid step
    
    // --- STATE ---
    let score = 0;
    let bestScore = 0;
    let playerGridPos = { x: 0, y: 2 }; 
    let lanes = [];
    let gameLoopId;
    let isGameOver = false;

    // --- ELEMENTS ---
    const board = document.getElementById('board');
    const playerEl = document.getElementById('player');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');

    // --- INITIALIZATION ---
    function init() {
        // Clear board
        board.innerHTML = '';
        lanes = [];
        window.cameraY = 0;
        
        // Create initial lanes
        for (let i = 0; i < START_LANES; i++) {
            addLane(-i);
        }
        updatePlayerVisuals();
        gameLoop();
    }

    // --- LANE GENERATION ---
    function addLane(index) {
        let type = 'grass';
        const absIndex = Math.abs(index);
        
        // Procedural Logic
        if (absIndex > 2) {
            const r = Math.random();
            if (r < 0.45) type = 'road';
            else if (r < 0.70) type = 'water';
            else type = 'grass';
        }

        const lane = document.createElement('div');
        lane.className = `lane ${type}`;
        lane.dataset.index = index;
        
        // Position Lane
        lane.style.bottom = (index * LANE_HEIGHT) + 'px';
        
        // Content Generation
        let content = null;
        let speed = 0;
        let speedDir = 1;
        let xPos = 0;

        if (type === 'road') {
            const car = document.createElement('div');
            const isTruck = Math.random() > 0.7;
            car.className = `moving-object car ${isTruck ? 'truck' : ''}`;
            
            // Randomize direction and speed
            speed = (3 + Math.random() * 3) * (Math.random() > 0.5 ? 1 : -1);
            // Start off screen
            xPos = speed > 0 ? -250 : 100; 
            lane.appendChild(car);
            content = car;
        } else if (type === 'water') {
            const log = document.createElement('div');
            log.className = 'moving-object log';
            speed = (1.5 + Math.random() * 1.5) * (Math.random() > 0.5 ? 1 : -1);
            xPos = speed > 0 ? -250 : 100;
            lane.appendChild(log);
            content = log;
        } else if (type === 'grass') {
            // Random Trees
            if (Math.random() > 0.4) {
                const tree = document.createElement('div');
                tree.className = 'tree';
                tree.innerHTML = '<div class="tree-top"></div><div class="tree-trunk"></div>';
                // Place tree safely
                const pos = Math.random() > 0.5 ? (Math.random() * 30 + 10) + '%' : (Math.random() * 30 + 60) + '%';
                tree.style.left = pos;
                lane.appendChild(tree);
            }
        }

        board.appendChild(lane);

        lanes.push({
            element: lane,
            type: type,
            index: index,
            content: content,
            speed: speed,
            x: xPos
        });
    }

    // --- GAME LOOP ---
    function gameLoop() {
        if (isGameOver) return;

        // Move objects
        lanes.forEach(l => {
            if (l.content) {
                l.x += l.speed;
                // Wrap around logic
                if (l.speed > 0 && l.x > 250) l.x = -250;
                if (l.speed < 0 && l.x < -250) l.x = 250;
                l.content.style.transform = `translateX(${l.x}px)`;
            }
        });

        checkCollisions();
        updateCamera();

        requestAnimationFrame(gameLoop);
    }

    function checkCollisions() {
        const currentLaneObj = lanes.find(l => l.index === playerGridPos.y);
        if (!currentLaneObj) return;

        // 1. Check Water
        if (currentLaneObj.type === 'water') {
            const onLog = isPlayerOnObject(currentLaneObj);
            
            if (onLog) {
                // Move player with log
                // Convert pixel speed to grid X
                playerGridPos.x += (currentLaneObj.speed / GRID_UNIT_X); 
                updatePlayerVisuals();
            } else {
                gameOver();
            }
        } 
        // 2. Check Road
        else if (currentLaneObj.type === 'road') {
            if (isPlayerOnObject(currentLaneObj)) {
                gameOver();
            }
        }
    }

    function isPlayerOnObject(laneObj) {
        if (!laneObj.content) return false;
        
        // Player Position in Pixels relative to lane center
        const playerPxX = playerGridPos.x * GRID_UNIT_X;
        
        // Object Dimensions
        const isLog = laneObj.content.classList.contains('log');
        const objWidth = isLog ? 150 : (laneObj.content.classList.contains('truck') ? 170 : 110);
        
        // Hitbox (slightly smaller than visual)
        const pWidth = 40; 
        const pLeft = playerPxX - (pWidth/2);
        const pRight = playerPxX + (pWidth/2);

        const objLeft = laneObj.x;
        const objRight = laneObj.x + objWidth;

        return (pLeft < objRight && pRight > objLeft);
    }

    // --- MOVEMENT ---
    window.movePlayer = function(dx, dy) {
        if (isGameOver) {
            resetGame();
            return;
        }

        // Snap movement
        playerGridPos.x += dx;
        playerGridPos.y += dy;

        // Clamp X
        if (playerGridPos.x > 4.5) playerGridPos.x = 4.5;
        if (playerGridPos.x < -4.5) playerGridPos.x = -4.5;

        // Clamp Y (Don't go below start)
        if (playerGridPos.y < 0) playerGridPos.y = 0;

        updatePlayerVisuals();

        // Progress logic
        if (dy > 0) {
            score++;
            scoreEl.innerText = score;
            addLane(-lanes.length); // Add new lane further up
        }
    };

    function updatePlayerVisuals() {
        // Calculate Bottom Position based on Grid Y
        const bottomPx = (playerGridPos.y * LANE_HEIGHT) + 20; 
        
        // Calculate Left Position based on Grid X (Center is 50%)
        const leftPx = 50 + (playerGridPos.x * (GRID_UNIT_X / window.innerWidth * 100));

        playerEl.style.bottom = bottomPx + 'px';
        playerEl.style.left = leftPx + '%';
    }

    function updateCamera() {
        // Calculate where the player is visually
        const targetBottom = (playerGridPos.y * LANE_HEIGHT) + 20;
        
        if (!window.cameraY) window.cameraY = 0;
        
        // Keep player roughly 300px from bottom of viewport
        const desiredBoardY = - (targetBottom - 300); 
        
        // Smooth lerp
        window.cameraY += (desiredBoardY - window.cameraY) * 0.1;
        
        board.style.transform = `rotateX(50deg) translateY(${BOARD_OFFSET_Y + window.cameraY}px)`;
    }

    function gameOver() {
        isGameOver = true;
        playerEl.style.filter = 'grayscale(100%)';
        playerEl.style.transform = 'translateX(-50%) rotate(90deg) scale(0.8)';
        
        if(score > bestScore) {
            bestScore = score;
            bestEl.innerText = bestScore;
        }

        setTimeout(() => {
            const confirmRestart = confirm(`Game Over! Score: ${score}. Restart?`);
            if(confirmRestart) resetGame();
        }, 500);
    }

    function resetGame() {
        isGameOver = false;
        score = 0;
        scoreEl.innerText = '0';
        playerGridPos = { x: 0, y: 2 };
        
        board.innerHTML = '';
        lanes = [];
        
        playerEl.style.filter = 'none';
        playerEl.style.transform = 'translateX(-50%)';
        
        init();
    }

    // --- KEYBOARD SUPPORT ---
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp' || e.key === 'w') movePlayer(0, 1);
        if (e.key === 'ArrowDown' || e.key === 's') movePlayer(0, -1);
        if (e.key === 'ArrowLeft' || e.key === 'a') movePlayer(-1, 0);
        if (e.key === 'ArrowRight' || e.key === 'd') movePlayer(1, 0);
    });

    // --- START ---
    init();

</script>
</body>
</html>
