<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Architecture & Data Flow</title>
    <style>
        :root {
            /* Background & Layout */
            --bg-color: #0b0e14;
            --surface-color: #151a23;
            --border-color: #2d3748;
            
            /* Typography */
            --text-main: #f7fafc;
            --text-muted: #a0aec0;
            --text-dim: #718096;
            
            /* Signal Colors (Semantics) */
            --col-data: #00d4ff;      /* Cyan */
            --col-instr: #f6ad55;     /* Amber */
            --col-ctrl: #68d391;      /* Emerald */
            
            /* Component Colors (Identity - subtle usage) */
            --col-cpu: #ffffff;       
            --col-gpu: #9f7aea;       
            --col-mem: #4fd1c5;       
            --col-stor: #fc8181;      
            --col-net: #63b3ed;       
            --col-in: #ed8936;        
            --col-out: #48bb78;       
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--border-color);
            background: rgba(11, 14, 20, 0.95);
            z-index: 10;
        }

        .header-title h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .header-title .meta {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        /* Formal Legend Box */
        .legend-box {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .legend-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-dim);
            margin-bottom: 4px;
            font-weight: 700;
        }

        .legend-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .line-sample {
            width: 24px;
            height: 0;
            border-top: 2px solid transparent;
        }

        /* Specific Legend Styles */
        .legend-item[data-type="data"] .line-sample { border-color: var(--col-data); border-style: solid; }
        .legend-item[data-type="instr"] .line-sample { border-color: var(--col-instr); border-style: dashed; }
        .legend-item[data-type="ctrl"] .line-sample { border-color: var(--col-ctrl); border-style: dotted; }

        /* Main Canvas Area */
        main {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Grid Background */
            background-image: 
                radial-gradient(circle at 1px 1px, var(--border-color) 1px, transparent 0);
            background-size: 40px 40px;
            background-position: center center;
            opacity: 1;
        }
        
        /* Fade edges */
        main::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 40%, var(--bg-color) 90%);
            pointer-events: none;
            z-index: 2;
        }

        svg {
            width: 100%;
            height: 100%;
            max-width: 1400px;
            max-height: 900px;
            position: relative;
            z-index: 5;
        }

        /* SVG Styles */
        
        /* Nodes - Standardized Grammar */
        .node-box {
            fill: var(--surface-color);
            stroke: #4a5568; /* Neutral Stroke */
            stroke-width: 1.5px;
            rx: 8px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
            transition: filter 0.3s ease;
        }

        .node-label {
            fill: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 700;
            font-size: 14px;
            text-anchor: middle;
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        .node-sub {
            fill: var(--text-muted);
            font-size: 11px;
            font-weight: 500;
            text-anchor: middle;
            pointer-events: none;
            opacity: 0.8;
        }

        /* Paths */
        .link-path {
            fill: none;
            stroke-width: 1.5px; /* Uniform width */
            opacity: 0.8;
        }

        /* Line Styles (Strict Coding) */
        .style-data {
            stroke: var(--col-data);
            stroke-dasharray: none; /* Solid */
        }
        .style-instr {
            stroke: var(--col-instr);
            stroke-dasharray: 8 4; /* Dashed */
        }
        .style-ctrl {
            stroke: var(--col-ctrl);
            stroke-dasharray: 2 4; /* Dotted */
        }

        /* Animations */
        @keyframes flow {
            0% { stroke-dashoffset: 24; }
            100% { stroke-dashoffset: 0; }
        }

        .flow-particle {
            fill: none;
            stroke-width: 2px;
            stroke-dasharray: 2 22;
            animation: flow 1.5s linear infinite;
            opacity: 0.9;
        }

        /* Line Labels */
        .label-bg {
            fill: #0f172a; /* High contrast dark background */
            stroke: #4a5568;
            stroke-width: 1px;
            rx: 4px;
        }
        
        .line-label {
            fill: var(--text-main);
            font-size: 10px;
            text-anchor: middle;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        /* Icons - Unified Flat Line Art */
        .icon-shape {
            stroke-width: 1.5px;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>System Architecture</h1>
            <div class="meta">Fig 1.0 // Data, Instruction & Control Flow Topology</div>
        </div>
        <!-- Formal Legend -->
        <div class="legend-box">
            <div class="legend-title">Signal Legend</div>
            <div class="legend-row">
                <div class="legend-item" data-type="data">
                    <div class="line-sample"></div>
                    <span>Data</span>
                </div>
                <div class="legend-item" data-type="instr">
                    <div class="line-sample"></div>
                    <span>Instructions</span>
                </div>
                <div class="legend-item" data-type="ctrl">
                    <div class="line-sample"></div>
                    <span>Control</span>
                </div>
            </div>
        </div>
    </header>

    <main id="canvas-container">
        <!-- SVG injected here by JS -->
    </main>

    <script>
        // Configuration
        const colors = {
            data: '#00d4ff',
            instr: '#f6ad55',
            ctrl: '#68d391',
            // Component tints
            cpu: '#ffffff',
            gpu: '#9f7aea',
            mem: '#4fd1c5',
            stor: '#fc8181',
            net: '#63b3ed',
            inp: '#ed8936',
            out: '#48bb78'
        };

        // Layout Definitions (1200x800 Grid)
        // Critique Fix: Removed Core Cluster.
        // Critique Fix: Balanced Layout. Input/Storage (L), CPU/Mem (C), Output/GPU/Net (R).
        const components = {
            // Left Column (Inputs)
            inp:  { x: 60,  y: 200, w: 180, h: 120, label: "INPUT", sub: "Peripherals" },
            stor: { x: 60,  y: 450, w: 180, h: 120, label: "STORAGE", sub: "NVMe SSD" },
            
            // Center Column (Core)
            mem:  { x: 400, y: 100, w: 260, h: 180, label: "MEMORY", sub: "System RAM" },
            cpu:  { x: 400, y: 350, w: 260, h: 200, label: "CPU", sub: "Central Processor" },
            
            // Right Column (Outputs & Network)
            gpu:  { x: 820, y: 100, w: 260, h: 180, label: "GPU", sub: "Graphics Engine" },
            out:  { x: 820, y: 350, w: 260, h: 120, label: "OUTPUT", sub: "Display / Audio" },
            net:  { x: 820, y: 540, w: 260, h: 120, label: "NETWORK", sub: "Interface Card" }
        };

        // Connections
        const connections = [
            // INPUT -> CPU
            { from: 'inp', to: 'cpu', type: 'ctrl', label: 'User Events' },
            
            // STORAGE -> CPU
            { from: 'stor', to: 'cpu', type: 'data', label: 'File I/O' },
            { from: 'stor', to: 'cpu', type: 'instr', label: 'Executables' },
            
            // CPU <-> MEMORY (Core Loop)
            { from: 'cpu', to: 'mem', type: 'data', label: 'Read/Write' },
            { from: 'mem', to: 'cpu', type: 'instr', label: 'Fetch' },
            
            // CPU <-> GPU
            { from: 'cpu', to: 'gpu', type: 'data', label: 'Command Buffer' },
            { from: 'cpu', to: 'gpu', type: 'ctrl', label: 'Sync' },
            
            // GPU -> OUTPUT
            { from: 'gpu', to: 'out', type: 'data', label: 'Video Signal' },
            
            // CPU <-> NETWORK
            { from: 'cpu', to: 'net', type: 'data', label: 'TX Packets' },
            { from: 'net', to: 'cpu', type: 'data', label: 'RX Packets' },
        ];

        // Helper to calculate center
        const getCenter = (id) => {
            const c = components[id];
            return { x: c.x + c.w/2, y: c.y + c.h/2 };
        };

        // Orthogonal Path Generator
        const createOrthoPath = (c1, c2) => {
            const p1 = { x: c1.x + c1.w/2, y: c1.y + c1.h/2 };
            const p2 = { x: c2.x + c2.w/2, y: c2.y + c2.h/2 };
            
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            
            let start = { ...p1 };
            let end = { ...p2 };
            
            // Determine edge points
            if (Math.abs(dx) > Math.abs(dy)) {
                start.x = dx > 0 ? c1.x + c1.w : c1.x;
                end.x = dx > 0 ? c2.x : c2.x + c2.w;
            } else {
                start.y = dy > 0 ? c1.y + c1.h : c1.y;
                end.y = dy > 0 ? c2.y : c2.y + c2.h;
            }

            // Kink point logic
            const midX = (start.x + end.x) / 2;
            const midY = (start.y + end.y) / 2;

            // Path Data: Start -> MidX -> End
            const d = `M ${start.x} ${start.y} 
                       L ${midX} ${start.y} 
                       L ${midX} ${end.y} 
                       L ${end.x} ${end.y}`;
            
            return { d, start, end, midX, midY };
        };

        const createSVG = () => {
            const ns = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(ns, "svg");
            svg.setAttribute("viewBox", "0 0 1200 850");

            // Defs
            const defs = document.createElementNS(ns, "defs");
            const createMarker = (id, color) => {
                const marker = document.createElementNS(ns, "marker");
                marker.setAttribute("id", id);
                marker.setAttribute("markerWidth", "10");
                marker.setAttribute("markerHeight", "7");
                marker.setAttribute("refX", "9");
                marker.setAttribute("refY", "3.5");
                marker.setAttribute("orient", "auto");
                const polygon = document.createElementNS(ns, "polygon");
                polygon.setAttribute("points", "0 0, 10 3.5, 0 7");
                polygon.setAttribute("fill", color);
                marker.appendChild(polygon);
                return marker;
            };
            defs.appendChild(createMarker('arrow-data', colors.data));
            defs.appendChild(createMarker('arrow-instr', colors.instr));
            defs.appendChild(createMarker('arrow-ctrl', colors.ctrl));
            svg.appendChild(defs);

            // 1. Draw Connections (Drawn first to be behind nodes)
            const linksGroup = document.createElementNS(ns, "g");

            connections.forEach((conn) => {
                const c1 = components[conn.from];
                const c2 = components[conn.to];
                const { d, midX, midY } = createOrthoPath(c1, c2);
                const color = colors[conn.type];
                const markerId = `arrow-${conn.type}`;
                const styleClass = `style-${conn.type}`;

                // Base Path
                const path = document.createElementNS(ns, "path");
                path.setAttribute("d", d);
                path.setAttribute("class", `link-path ${styleClass}`);
                path.setAttribute("marker-end", `url(#${markerId})`);
                linksGroup.appendChild(path);

                // Animated Particle
                const particle = document.createElementNS(ns, "path");
                particle.setAttribute("d", d);
                particle.setAttribute("stroke", color);
                particle.setAttribute("class", "flow-particle");
                particle.style.animationDelay = `${Math.random() * -2}s`;
                linksGroup.appendChild(particle);

                // Label with High-Contrast Background
                const gLabel = document.createElementNS(ns, "g");
                const labelY = midY;
                const labelX = midX;
                
                const bgRect = document.createElementNS(ns, "rect");
                const textLen = conn.label.length * 6.5 + 16; 
                bgRect.setAttribute("x", labelX - textLen/2);
                bgRect.setAttribute("y", labelY - 9);
                bgRect.setAttribute("width", textLen);
                bgRect.setAttribute("height", 18);
                bgRect.setAttribute("class", "label-bg");
                
                const text = document.createElementNS(ns, "text");
                text.setAttribute("x", labelX);
                text.setAttribute("y", labelY + 4);
                text.setAttribute("class", "line-label");
                text.textContent = conn.label;
                
                gLabel.appendChild(bgRect);
                gLabel.appendChild(text);
                linksGroup.appendChild(gLabel);
            });
            svg.appendChild(linksGroup);

            // 2. Draw Components
            const nodesGroup = document.createElementNS(ns, "g");
            
            Object.keys(components).forEach(key => {
                const comp = components[key];
                const g = document.createElementNS(ns, "g");
                g.setAttribute("id", key);
                g.setAttribute("transform", `translate(${comp.x}, ${comp.y})`);

                // Box - Standardized Style
                const rect = document.createElementNS(ns, "rect");
                rect.setAttribute("width", comp.w);
                rect.setAttribute("height", comp.h);
                rect.setAttribute("class", "node-box");
                // No stroke color override here to keep uniform grey border
                g.appendChild(rect);

                // Iconography - Unified Flat Line Art
                const iconG = document.createElementNS(ns, "g");
                iconG.setAttribute("transform", `translate(${comp.w/2}, ${comp.h/2 - 20})`);
                
                // Helper for consistent stroke
                const setStroke = (el) => {
                    el.setAttribute("stroke", colors[key]);
                    el.setAttribute("class", "icon-shape");
                };

                if (key === 'cpu') {
                    const outer = document.createElementNS(ns, "rect");
                    outer.setAttribute("x", -20); outer.setAttribute("y", -20);
                    outer.setAttribute("width", 40); outer.setAttribute("height", 40);
                    setStroke(outer);
                    
                    const inner = document.createElementNS(ns, "rect");
                    inner.setAttribute("x", -10); inner.setAttribute("y", -10);
                    inner.setAttribute("width", 20); inner.setAttribute("height", 20);
                    setStroke(inner);

                    // Pins
                    for(let i=-1; i<=1; i++) {
                        const p = document.createElementNS(ns, "line");
                        p.setAttribute("x1", i*8); p.setAttribute("y1", -20); p.setAttribute("x2", i*8); p.setAttribute("y2", -28);
                        setStroke(p);
                        iconG.appendChild(p);
                        const p2 = p.cloneNode();
                        p2.setAttribute("y1", 20); p2.setAttribute("y2", 28);
                        iconG.appendChild(p2);
                    }
                    iconG.appendChild(outer);
                    iconG.appendChild(inner);
                } 
                else if (key === 'gpu') {
                    const tri = document.createElementNS(ns, "polygon");
                    tri.setAttribute("points", "0,-22 22,15 -22,15");
                    setStroke(tri);
                    const line = document.createElementNS(ns, "line");
                    line.setAttribute("x1", 0); line.setAttribute("y1", -22); line.setAttribute("x2", 0); line.setAttribute("y2", 15);
                    setStroke(line);
                    iconG.appendChild(tri);
                    iconG.appendChild(line);
                }
                else if (key === 'mem') {
                    for(let i=0; i<3; i++) {
                        const r = document.createElementNS(ns, "rect");
                        r.setAttribute("x", -22); r.setAttribute("y", -12 + (i*12));
                        r.setAttribute("width", 44); r.setAttribute("height", 8);
                        setStroke(r);
                        iconG.appendChild(r);
                    }
                }
                // Critique Fix: Flat line-art Storage icon (Platter style)
                else if (key === 'stor') {
                    // Platter 1
                    const p1 = document.createElementNS(ns, "ellipse");
                    p1.setAttribute("cx", 0); p1.setAttribute("cy", -10);
                    p1.setAttribute("rx", 20); p1.setAttribute("ry", 6);
                    setStroke(p1);
                    // Platter 2
                    const p2 = document.createElementNS(ns, "ellipse");
                    p2.setAttribute("cx", 0); p2.setAttribute("cy", 0);
                    p2.setAttribute("rx", 20); p2.setAttribute("ry", 6);
                    setStroke(p2);
                    // Platter 3
                    const p3 = document.createElementNS(ns, "ellipse");
                    p3.setAttribute("cx", 0); p3.setAttribute("cy", 10);
                    p3.setAttribute("rx", 20); p3.setAttribute("ry", 6);
                    setStroke(p3);
                    // Spindle
                    const sp = document.createElementNS(ns, "line");
                    sp.setAttribute("x1", 0); sp.setAttribute("y1", -10);
                    sp.setAttribute("x2", 0); sp.setAttribute("y2", 10);
                    setStroke(sp);
                    
                    iconG.appendChild(p1);
                    iconG.appendChild(p2);
                    iconG.appendChild(p3);
                    iconG.appendChild(sp);
                }
                else if (key === 'inp') {
                    const kb = document.createElementNS(ns, "rect");
                    kb.setAttribute("x", -25); kb.setAttribute("y", -15);
                    kb.setAttribute("width", 50); kb.setAttribute("height", 30);
                    kb.setAttribute("rx", 4);
                    setStroke(kb);
                    
                    // Keys
                    for(let r=0; r<2; r++) {
                        for(let c=0; c<4; c++) {
                            const k = document.createElementNS(ns, "rect");
                            k.setAttribute("x", -18 + c*10); k.setAttribute("y", -8 + r*12);
                            k.setAttribute("width", 6); k.setAttribute("height", 4);
                            k.setAttribute("fill", colors[key]); k.setAttribute("opacity", "0.6");
                            iconG.appendChild(k);
                        }
                    }
                    iconG.appendChild(kb);
                }
                else if (key === 'out') {
                    const scr = document.createElementNS(ns, "rect");
                    scr.setAttribute("x", -25); scr.setAttribute("y", -20);
                    scr.setAttribute("width", 50); scr.setAttribute("height", 30);
                    scr.setAttribute("rx", 2);
                    setStroke(scr);
                    
                    const stand = document.createElementNS(ns, "path");
                    stand.setAttribute("d", "M -8 10 L -8 22 L 8 22 L 8 10");
                    setStroke(stand);
                    
                    iconG.appendChild(scr);
                    iconG.appendChild(stand);
                }
                // Critique Fix: New Network Component
                else if (key === 'net') {
                    const circ = document.createElementNS(ns, "circle");
                    circ.setAttribute("cx", 0); circ.setAttribute("cy", 0);
                    circ.setAttribute("r", 22);
                    setStroke(circ);
                    
                    const hLine = document.createElementNS(ns, "ellipse");
                    hLine.setAttribute("cx", 0); hLine.setAttribute("cy", 0);
                    hLine.setAttribute("rx", 22); hLine.setAttribute("ry", 8);
                    setStroke(hLine);
                    
                    const vLine = document.createElementNS(ns, "ellipse");
                    vLine.setAttribute("cx", 0); vLine.setAttribute("cy", 0);
                    vLine.setAttribute("rx", 8); vLine.setAttribute("ry", 22);
                    setStroke(vLine);
                    
                    iconG.appendChild(circ);
                    iconG.appendChild(hLine);
                    iconG.appendChild(vLine);
                }
                
                g.appendChild(iconG);

                // Text Labels
                const textMain = document.createElementNS(ns, "text");
                textMain.setAttribute("x", comp.w/2);
                textMain.setAttribute("y", comp.h - 35);
                textMain.setAttribute("class", "node-label");
                textMain.textContent = comp.label;
                g.appendChild(textMain);

                const textSub = document.createElementNS(ns, "text");
                textSub.setAttribute("x", comp.w/2);
                textSub.setAttribute("y", comp.h - 15);
                textSub.setAttribute("class", "node-sub");
                textSub.textContent = comp.sub;
                g.appendChild(textSub);

                nodesGroup.appendChild(g);
            });
            svg.appendChild(nodesGroup);

            return svg;
        };

        // Initialize
        const container = document.getElementById('canvas-container');
        const svgElement = createSVG();
        container.appendChild(svgElement);

    </script>
</body>
</html>
