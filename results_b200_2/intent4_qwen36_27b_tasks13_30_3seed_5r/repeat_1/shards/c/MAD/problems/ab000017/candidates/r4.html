<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Cube | Digital Workbench</title>
<style>
  :root {
    /* Palette: Dark Matte & Digital Teal */
    --bg-dark: #121214;
    --bg-texture: radial-gradient(circle at 50% 30%, #1e2026 0%, #0d0d0f 100%);
    
    --panel-bg: #1c1c20;
    --panel-border: #2a2a30;
    --panel-highlight: #32323a;
    
    --text-main: #f0f0f2;
    --text-muted: #858590;
    
    --accent-primary: #00e0c6; /* Teal */
    --accent-glow: rgba(0, 224, 198, 0.2);
    --accent-danger: #ff5a5f; /* Softer Red */
    
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Consolas", "Monaco", monospace;
    
    /* Unified 12px Radius */
    --radius-std: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--font-ui);
    background-color: var(--bg-dark);
    background-image: var(--bg-texture);
    color: var(--text-main);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
  }

  /* === LAYOUT === */
  .app-container {
    width: 100%;
    height: 100%;
    max-width: 1200px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 20px;
    position: relative;
  }

  /* === HEADER === */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
    padding: 0 10px;
  }

  .brand {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text-main);
    text-transform: uppercase;
  }
  .brand span { color: var(--accent-primary); }

  .stats {
    display: flex;
    gap: 32px;
  }

  .stat-box {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .stat-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 4px;
    font-weight: 600;
  }

  /* Tabular Sans-serif Typography */
  .stat-value {
    font-family: var(--font-ui);
    font-size: 32px;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -1px;
  }

  /* === CENTER STAGE === */
  .stage {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1200px;
    height: 100%;
    min-height: 400px;
  }

  .cube-wrapper {
    width: var(--cube-size);
    height: var(--cube-size);
    position: relative;
    transform-style: preserve-3d;
    transform: rotateX(-25deg) rotateY(35deg);
    transition: transform 0.1s linear;
    cursor: grab;
  }
  .cube-wrapper:active { cursor: grabbing; }

  .face {
    position: absolute;
    width: 100%;
    height: 100%;
    display: grid;
    gap: var(--gap);
    padding: var(--gap);
    background: #111;
    border-radius: 4px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.9); 
    backface-visibility: hidden;
  }

  /* Face Transforms */
  .face-u { transform: rotateX(90deg) translateZ(calc(var(--cube-size)/2)); }
  .face-d { transform: rotateX(-90deg) translateZ(calc(var(--cube-size)/2)); }
  .face-f { transform: rotateY(0deg) translateZ(calc(var(--cube-size)/2)); }
  .face-b { transform: rotateY(180deg) translateZ(calc(var(--cube-size)/2)); }
  .face-r { transform: rotateY(90deg) translateZ(calc(var(--cube-size)/2)); }
  .face-l { transform: rotateY(-90deg) translateZ(calc(var(--cube-size)/2)); }

  .sticker {
    width: 100%;
    height: 100%;
    border-radius: 20%; 
    position: relative;
    transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
    box-shadow: inset 0 0 4px rgba(0,0,0,0.6), 0 1px 2px rgba(255,255,255,0.15);
  }

  .sticker::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(135deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.1) 35%, rgba(0,0,0,0.05) 100%);
    pointer-events: none;
  }

  /* Colors */
  .c-u { background: #ffffff; }
  .c-d { background: #ffd500; }
  .c-f { background: #00cc44; }
  .c-b { background: #0051ff; }
  .c-r { background: #ff3333; }
  .c-l { background: #ff8800; }

  .sticker.hint-active {
    animation: pulse-hint 1.2s infinite alternate;
    box-shadow: 0 0 25px var(--accent-primary);
    z-index: 2;
    border: 2px solid #fff;
  }
  @keyframes pulse-hint { from { opacity: 1; transform: scale(1); } to { opacity: 0.8; transform: scale(0.92); } }

  /* === BOTTOM LEFT PANEL (Split) === */
  .info-panel {
    position: absolute;
    bottom: 20px;
    left: 20px;
    width: 260px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-std);
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    overflow: hidden;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 20;
    display: flex;
    flex-direction: column;
  }
  
  .info-panel.hidden {
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
  }

  /* Top 60%: Scramble Formula */
  .panel-formula {
    flex: 6;
    padding: 12px;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    flex-direction: column;
  }
  
  .panel-label {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .formula-content {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--accent-primary);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    overflow-y: auto;
    /* Hide scrollbar visually but keep functionality */
    scrollbar-width: none; 
  }
  .formula-content::-webkit-scrollbar { display: none; }

  .notation-chip {
    background: rgba(0, 224, 198, 0.08);
    color: var(--accent-primary);
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 600;
  }

  /* Bottom 40%: Tip Area */
  .panel-tip {
    flex: 4;
    padding: 12px;
    background: rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .tip-text {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.4;
    font-style: italic;
  }
  .tip-text.active {
    color: var(--text-main);
    font-style: normal;
    font-weight: 500;
  }

  /* === UNIFIED CONTROL BAR === */
  .controls-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    z-index: 30;
    padding-bottom: 10px;
  }

  /* Hierarchy: Size Selector (Setup) - Lower Contrast */
  .size-selector {
    display: flex;
    background: rgba(255, 255, 255, 0.03);
    padding: 4px;
    border-radius: var(--radius-std);
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .size-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 6px 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px; /* Inner radius */
    transition: all 0.2s;
  }
  
  .size-btn:hover { color: var(--text-main); }
  
  .size-btn.active {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text-main);
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  /* Hierarchy: Action Buttons (Gameplay) - Higher Contrast */
  .toolbar {
    display: flex;
    gap: 12px;
    padding: 8px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-std);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .action-btn {
    height: 44px;
    padding: 0 24px;
    border: none;
    border-radius: 8px; /* Inner radius */
    cursor: pointer;
    background: rgba(255,255,255,0.05);
    color: var(--text-main);
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .action-btn:hover {
    background: rgba(255,255,255,0.1);
    transform: translateY(-2px);
  }

  .action-btn:active {
    transform: translateY(1px);
    background: rgba(255,255,255,0.15);
  }

  /* Button Accents */
  .btn-scramble {
    background: var(--accent-primary);
    color: #000;
  }
  .btn-scramble:hover {
    background: #33ebd6;
    box-shadow: 0 0 15px var(--accent-glow);
  }

  /* Reset: Neutral/Dark Teal instead of Red Stroke */
  .btn-reset {
    background: #2a2a30;
    color: #ccc;
    border: 1px solid #3a3a42;
  }
  .btn-reset:hover {
    background: #3a3a42;
    color: #fff;
    border-color: #4a4a52;
  }

  /* Responsive */
  @media (max-width: 600px) {
    :root { --cube-size: 220px; }
    .app-container { padding: 10px; }
    .info-panel { width: 200px; bottom: 10px; left: 10px; }
    .toolbar { gap: 8px; padding: 6px; }
    .action-btn { padding: 0 16px; font-size: 11px; height: 40px; }
  }
</style>
</head>
<body>

<div class="app-container">
  
  <!-- Header -->
  <header class="header">
    <div class="brand">The <span>Cube</span></div>
    <div class="stats">
      <div class="stat-box">
        <div class="stat-label">Moves</div>
        <div class="stat-value" id="moveCount">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Time</div>
        <div class="stat-value" id="timer">00:00</div>
      </div>
    </div>
  </header>

  <!-- 3D Stage -->
  <div class="stage">
    <div class="cube-wrapper" id="cubeScene">
      <!-- Faces injected via JS -->
    </div>

    <!-- Split Info Panel -->
    <div class="info-panel hidden" id="infoPanel">
      <!-- Top 60%: Formula -->
      <div class="panel-formula">
        <div class="panel-label">Scramble Formula</div>
        <div class="formula-content" id="notationList"></div>
      </div>
      <!-- Bottom 40%: Tip -->
      <div class="panel-tip">
        <div class="panel-label">Assistant</div>
        <div class="tip-text" id="tipText">Click Hint for a tip</div>
      </div>
    </div>
  </div>

  <!-- Unified Control Bar -->
  <div class="controls-area">
    
    <!-- Size Selector (Setup) -->
    <div class="size-selector">
      <button class="size-btn" data-size="2">2×2</button>
      <button class="size-btn active" data-size="3">3×3</button>
      <button class="size-btn" data-size="4">4×4</button>
      <button class="size-btn" data-size="5">5×5</button>
    </div>

    <!-- Action Buttons (Gameplay) -->
    <div class="toolbar">
      <button class="action-btn btn-scramble" id="btnScramble">SCRAMBLE</button>
      <button class="action-btn" id="btnUndo">UNDO</button>
      <button class="action-btn" id="btnHint">HINT</button>
      <button class="action-btn btn-reset" id="btnReset">RESET</button>
    </div>

  </div>

</div>

<script>
(function() {
  // ============ STATE ============
  const COLORS = {
    U: 'c-u', D: 'c-d', F: 'c-f', B: 'c-b', R: 'c-r', L: 'c-l'
  };
  const FACE_NAMES = ['U', 'D', 'F', 'B', 'R', 'L'];
  
  let state = {
    size: 3,
    grid: {},
    moveHistory: [],
    scrambleSeq: [],
    timerStart: null,
    timerInterval: null,
    moves: 0,
    isDragging: false,
    rotX: -25,
    rotY: 35,
    lastX: 0,
    lastY: 0
  };

  const tips = [
    "Look for the white cross first.",
    "Orient the edge pieces correctly.",
    "Use the R U R' algorithm for corners.",
    "Keep your left hand still.",
    "Focus on one layer at a time.",
    "Scan for the best next move."
  ];

  // ============ INIT ============
  function init() {
    createGrid();
    buildDOM();
    scramble(); // Start in scrambled state
    setupEvents();
  }

  // ============ LOGIC ============
  function createGrid() {
    const n = state.size;
    const newGrid = {};
    FACE_NAMES.forEach((face, idx) => {
      newGrid[face] = new Array(n * n).fill(idx);
    });
    state.grid = newGrid;
  }

  // Rotate a specific face logic
  function rotateFace(face, dir, animate = true) {
    const n = state.size;
    const g = state.grid;
    
    // 1. Rotate the face stickers itself
    let faceArr = [...g[face]];
    const rotated = new Array(n * n);
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        let nr = c;
        let nc = n - 1 - r;
        if (dir === -1) { // CCW
          nr = n - 1 - c;
          nc = r;
        }
        rotated[nr * n + nc] = faceArr[r * n + c];
      }
    }
    g[face] = rotated;

    // 2. Rotate adjacent strips (Simplified logic for visual demo)
    if (face === 'U') {
      const strip = [];
      for(let i=0; i<n; i++) strip.push(g['F'][i]); 
      for(let i=0; i<n; i++) strip.push(g['R'][i]); 
      for(let i=0; i<n; i++) strip.push(g['B'][(n-1)*n + (n-1-i)]); 
      for(let i=0; i<n; i++) strip.push(g['L'][(n-1)*n + (n-1-i)]); 
      
      const shift = dir === 1 ? -n : n; 
      const newStrip = [...strip.slice(shift), ...strip.slice(0, shift)];
      let ptr = 0;
      for(let i=0; i<n; i++) g['F'][i] = newStrip[ptr++];
      for(let i=0; i<n; i++) g['R'][i] = newStrip[ptr++];
      for(let i=0; i<n; i++) g['B'][(n-1)*n + (n-1-i)] = newStrip[ptr++];
      for(let i=0; i<n; i++) g['L'][(n-1)*n + (n-1-i)] = newStrip[ptr++];
    }
    else if (face === 'D') {
      const strip = [];
      for(let i=0; i<n; i++) strip.push(g['F'][(n-1)*n + i]);
      for(let i=0; i<n; i++) strip.push(g['L'][i*n + (n-1-i)]); 
      for(let i=0; i<n; i++) strip.push(g['B'][(n-1)*n + i]);
      for(let i=0; i<n; i++) strip.push(g['R'][i*n + (n-1-i)]); 
      
      const shift = dir === 1 ? -n : n;
      const newStrip = [...strip.slice(shift), ...strip.slice(0, shift)];
      let ptr = 0;
      for(let i=0; i<n; i++) g['F'][(n-1)*n + i] = newStrip[ptr++];
      for(let i=0; i<n; i++) g['L'][i*n + (n-1-i)] = newStrip[ptr++];
      for(let i=0; i<n; i++) g['B'][(n-1)*n + i] = newStrip[ptr++];
      for(let i=0; i<n; i++) g['R'][i*n + (n-1-i)] = newStrip[ptr++];
    }
    else if (face === 'F') {
      const strip = [];
      for(let i=0; i<n; i++) strip.push(g['U'][(n-1)*n + i]);
      for(let i=0; i<n; i++) strip.push(g['L'][i*n + n-1]); 
      for(let i=0; i<n; i++) strip.push(g['D'][i*n + (n-1-i)]); 
      for(let i=0; i<n; i++) strip.push(g['R'][i*n]); 

      const shift = dir === 1 ? -n : n;
      const newStrip = [...strip.slice(shift), ...strip.slice(0, shift)];
      let ptr = 0;
      for(let i=0; i<n; i++) g['U'][(n-1)*n + i] = newStrip[ptr++];
      for(let i=0; i<n; i++) g['L'][i*n + n-1] = newStrip[ptr++];
      for(let i=0; i<n; i++) g['D'][i*n + (n-1-i)] = newStrip[ptr++];
      for(let i=0; i<n; i++) g['R'][i*n] = newStrip[ptr++];
    }
  }

  // ============ DOM ============
  function buildDOM() {
    const container = document.getElementById('cubeScene');
    container.innerHTML = '';
    
    const n = state.size;
    const baseSize = window.innerWidth < 600 ? 220 : 280;
    const faceSize = (baseSize / n); 
    const totalSize = faceSize * n;
    
    document.documentElement.style.setProperty('--cube-size', totalSize + 'px');

    FACE_NAMES.forEach(face => {
      const el = document.createElement('div');
      el.className = `face face-${face.toLowerCase()}`;
      el.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
      el.style.gridTemplateRows = `repeat(${n}, 1fr)`;
      
      for(let i=0; i<n*n; i++) {
        const s = document.createElement('div');
        s.className = 'sticker';
        s.dataset.face = face;
        s.dataset.idx = i;
        el.appendChild(s);
      }
      container.appendChild(el);
    });
    render();
  }

  function render() {
    document.querySelectorAll('.sticker').forEach(el => {
      const face = el.dataset.face;
      const idx = parseInt(el.dataset.idx);
      const colorIdx = state.grid[face][idx];
      const colorClass = COLORS[FACE_NAMES[colorIdx]];
      
      el.className = `sticker ${colorClass}`;
    });
  }

  // ============ CONTROLS ============
  function scramble() {
    stopTimer();
    state.moves = 0;
    state.moveHistory = [];
    updateStats();
    
    const n = state.size;
    const count = n * 12;
    const faces = ['U', 'D', 'F', 'B', 'R', 'L'];
    state.scrambleSeq = [];
    
    createGrid(); 
    
    for(let i=0; i<count; i++) {
      const f = faces[Math.floor(Math.random() * faces.length)];
      const d = Math.random() > 0.5 ? 1 : -1;
      state.scrambleSeq.push(`${f}${d===1?'':'\''}`);
      rotateFace(f, d);
    }
    
    render();
    updateNotation();
    startTimer();
    
    // Reset tip
    const tipEl = document.getElementById('tipText');
    tipEl.innerText = "Click Hint for a tip";
    tipEl.classList.remove('active');
  }

  function undo() {
    reset();
  }

  function reset() {
    stopTimer();
    state.timerStart = null;
    state.moves = 0;
    state.moveHistory = [];
    createGrid();
    render();
    updateStats();
    document.getElementById('timer').innerText = "00:00";
    document.getElementById('infoPanel').classList.add('hidden');
  }

  function showHint() {
    // Visual Hint
    const stickers = document.querySelectorAll('.sticker');
    stickers.forEach(s => s.classList.remove('hint-active'));
    if(stickers.length) {
      const r = stickers[Math.floor(Math.random() * stickers.length)];
      r.classList.add('hint-active');
      setTimeout(() => r.classList.remove('hint-active'), 1000);
    }
    
    // Text Hint
    const tipEl = document.getElementById('tipText');
    const randomTip = tips[Math.floor(Math.random() * tips.length)];
    tipEl.innerText = randomTip;
    tipEl.classList.add('active');
  }

  function updateStats() {
    document.getElementById('moveCount').innerText = state.moves;
  }

  function updateNotation() {
    const panel = document.getElementById('infoPanel');
    const list = document.getElementById('notationList');
    panel.classList.remove('hidden');
    list.innerHTML = state.scrambleSeq.map(m => 
      `<span class="notation-chip">${m}</span>`
    ).join('');
  }

  // ============ TIMER ============
  function startTimer() {
    state.timerStart = Date.now();
    clearInterval(state.timerInterval);
    state.timerInterval = setInterval(() => {
      const diff = Math.floor((Date.now() - state.timerStart) / 1000);
      const m = Math.floor(diff / 60).toString().padStart(2, '0');
      const s = (diff % 60).toString().padStart(2, '0');
      document.getElementById('timer').innerText = `${m}:${s}`;
    }, 1000);
  }

  function stopTimer() {
    clearInterval(state.timerInterval);
  }

  // ============ EVENTS ============
  function setupEvents() {
    document.getElementById('btnScramble').onclick = scramble;
    document.getElementById('btnReset').onclick = reset;
    document.getElementById('btnUndo').onclick = undo;
    document.getElementById('btnHint').onclick = showHint;

    document.querySelectorAll('.size-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.size = parseInt(btn.dataset.size);
        reset();
        buildDOM();
        scramble();
      };
    });

    // Drag Rotation Logic
    const scene = document.getElementById('cubeScene');
    
    const startDrag = (e) => {
      state.isDragging = true;
      state.lastX = e.clientX || e.touches[0].clientX;
      state.lastY = e.clientY || e.touches[0].clientY;
      scene.style.transition = 'none';
    };
    
    const moveDrag = (e) => {
      if(!state.isDragging) return;
      const x = e.clientX || e.touches[0].clientX;
      const y = e.clientY || e.touches[0].clientY;
      const dx = x - state.lastX;
      const dy = y - state.lastY;
      
      state.rotY += dx * 0.6;
      state.rotX -= dy * 0.6;
      
      state.rotX = Math.max(-90, Math.min(90, state.rotX));
      
      scene.style.transform = `rotateX(${state.rotX}deg) rotateY(${state.rotY}deg)`;
      
      state.lastX = x;
      state.lastY = y;
    };
    
    const endDrag = () => { 
      state.isDragging = false; 
      scene.style.transition = 'transform 0.1s linear';
    };

    scene.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', moveDrag);
    window.addEventListener('mouseup', endDrag);
    
    scene.addEventListener('touchstart', startDrag);
    window.addEventListener('touchmove', moveDrag);
    window.addEventListener('touchend', endDrag);
  }

  // Boot
  init();

})();
</script>
</body>
</html>
