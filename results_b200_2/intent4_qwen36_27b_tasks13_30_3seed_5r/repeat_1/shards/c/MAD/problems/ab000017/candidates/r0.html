<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Cube | Digital Puzzle</title>
<style>
  :root {
    --bg: #121418;
    --panel: #1c1f26;
    --panel-border: #2a2e38;
    --accent: #00e0c6;
    --accent-dim: #00b8a2;
    --text: #e4e6eb;
    --text-dim: #8b92a0;
    --danger: #ff6b6b;
    --warning: #ffd93d;
    --cube-size: 200px;
    --face-size: 60px;
    --gap: 2px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Header */
  .header {
    width: 100%;
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--panel-border);
    background: var(--panel);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
  }

  .logo-text {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text);
  }

  .logo-text span {
    color: var(--accent);
  }

  /* Main Layout */
  .main {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 1200px;
    padding: 24px;
    gap: 24px;
    flex: 1;
  }

  /* Stats Bar */
  .stats-bar {
    display: flex;
    align-items: center;
    gap: 32px;
    padding: 12px 28px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .stat-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    font-weight: 600;
  }

  .stat-value {
    font-size: 28px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    line-height: 1;
  }

  .stat-value.timer {
    color: var(--accent);
    font-size: 32px;
  }

  .stat-divider {
    width: 1px;
    height: 40px;
    background: var(--panel-border);
  }

  /* Cube Stage */
  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 340px;
    position: relative;
  }

  .cube-container {
    perspective: 800px;
    perspective-origin: 50% 50%;
  }

  .cube-scene {
    width: var(--cube-size);
    height: var(--cube-size);
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    cursor: grab;
  }

  .cube-scene:active {
    cursor: grabbing;
  }

  .cube-scene.auto-rotate {
    animation: autoRotate 20s linear infinite;
  }

  @keyframes autoRotate {
    from { transform: rotateX(-25deg) rotateY(0deg); }
    to { transform: rotateX(-25deg) rotateY(360deg); }
  }

  /* Cube Faces */
  .face {
    position: absolute;
    display: grid;
    gap: var(--gap);
    backface-visibility: visible;
    padding: var(--gap);
    background: #1a1a1a;
    border-radius: 6px;
    border: 1px solid #333;
  }

  .face-front  { transform: translateZ(calc(var(--face-size) * var(--n) / 2)); }
  .face-back   { transform: rotateY(180deg) translateZ(calc(var(--face-size) * var(--n) / 2)); }
  .face-right  { transform: rotateY(90deg) translateZ(calc(var(--face-size) * var(--n) / 2)); }
  .face-left   { transform: rotateY(-90deg) translateZ(calc(var(--face-size) * var(--n) / 2)); }
  .face-top    { transform: rotateX(90deg) translateZ(calc(var(--face-size) * var(--n) / 2)); }
  .face-bottom { transform: rotateX(-90deg) translateZ(calc(var(--face-size) * var(--n) / 2)); }

  .sticker {
    width: var(--face-size);
    height: var(--face-size);
    border-radius: 4px;
    position: relative;
    transition: background-color 0.3s ease;
  }

  .sticker::after {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 3px;
    background: inherit;
    filter: brightness(1.15);
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.15), inset 0 -1px 2px rgba(0,0,0,0.2);
  }

  .sticker.black { background: #2a2a2a; }
  .sticker.black::after { background: #2a2a2a; filter: brightness(1); box-shadow: none; }
  .sticker.white { background: #f0f0f0; }
  .sticker.red { background: #e74c3c; }
  .sticker.green { background: #2ecc71; }
  .sticker.blue { background: #3498db; }
  .sticker.orange { background: #e67e22; }
  .sticker.yellow { background: #f1c40f; }
  .sticker.purple { background: #9b59b6; }

  /* Highlighted sticker for hint */
  .sticker.hint-highlight {
    animation: hintPulse 0.8s ease-in-out infinite alternate;
  }

  @keyframes hintPulse {
    from { box-shadow: 0 0 0 0 rgba(0, 224, 198, 0.6); }
    to { box-shadow: 0 0 12px 4px rgba(0, 224, 198, 0.3); }
  }

  /* Controls */
  .controls-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    max-width: 600px;
  }

  /* Size Selector */
  .size-selector {
    display: flex;
    gap: 4px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 4px;
  }

  .size-btn {
    padding: 8px 18px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.5px;
  }

  .size-btn:hover {
    color: var(--text);
    background: rgba(255,255,255,0.05);
  }

  .size-btn.active {
    background: var(--accent);
    color: var(--bg);
    box-shadow: 0 2px 8px rgba(0, 224, 198, 0.3);
  }

  /* Action Buttons */
  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.3px;
  }

  .btn:hover {
    background: rgba(255,255,255,0.08);
    border-color: #3a3f4a;
    transform: translateY(-1px);
  }

  .btn:active {
    transform: translateY(0);
  }

  .btn svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .btn-primary {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }

  .btn-primary:hover {
    background: var(--accent-dim);
    border-color: var(--accent-dim);
    box-shadow: 0 4px 12px rgba(0, 224, 198, 0.3);
  }

  .btn-danger {
    border-color: rgba(255, 107, 107, 0.3);
  }

  .btn-danger:hover {
    background: rgba(255, 107, 107, 0.1);
    border-color: var(--danger);
    color: var(--danger);
  }

  /* Formula Panel */
  .formula-panel {
    width: 100%;
    max-width: 600px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    overflow: hidden;
  }

  .formula-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    border-bottom: 1px solid var(--panel-border);
  }

  .formula-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
  }

  .formula-toggle {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
  }

  .formula-body {
    padding: 14px 18px;
    max-height: 120px;
    overflow-y: auto;
    transition: max-height 0.3s ease, padding 0.3s ease;
  }

  .formula-body.collapsed {
    max-height: 0;
    padding: 0 18px;
  }

  .formula-moves {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .formula-move {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 36px;
    height: 32px;
    padding: 0 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    font-family: 'Courier New', monospace;
    color: var(--accent);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .formula-move:hover {
    background: rgba(0, 224, 198, 0.1);
    border-color: var(--accent);
  }

  .formula-move.sup {
    font-size: 9px;
    vertical-align: super;
    margin-left: -4px;
  }

  .formula-tip {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--panel-border);
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  .formula-tip strong {
    color: var(--warning);
  }

  /* Scrollbar */
  .formula-body::-webkit-scrollbar { width: 4px; }
  .formula-body::-webkit-scrollbar-track { background: transparent; }
  .formula-body::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 2px; }

  /* Drag hint */
  .drag-hint {
    position: absolute;
    bottom: -30px;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    opacity: 0.6;
  }

  /* Responsive */
  @media (max-width: 640px) {
    .header { padding: 12px 16px; }
    .main { padding: 16px; gap: 16px; }
    .stats-bar { gap: 20px; padding: 10px 20px; }
    .stat-value { font-size: 22px; }
    .stat-value.timer { font-size: 26px; }
    .actions { gap: 6px; }
    .btn { padding: 8px 14px; font-size: 12px; }
    .size-btn { padding: 6px 14px; font-size: 12px; }
  }

  /* Shadow under cube */
  .cube-shadow {
    position: absolute;
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    height: 20px;
    background: radial-gradient(ellipse, rgba(0,0,0,0.4) 0%, transparent 70%);
    border-radius: 50%;
  }
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="logo">
    <svg class="logo-icon" viewBox="0 0 32 32" fill="none">
      <rect x="2" y="2" width="12" height="12" rx="2" fill="#3498db"/>
      <rect x="18" y="2" width="12" height="12" rx="2" fill="#e74c3c"/>
      <rect x="2" y="18" width="12" height="12" rx="2" fill="#2ecc71"/>
      <rect x="18" y="18" width="12" height="12" rx="2" fill="#f1c40f"/>
      <rect x="2" y="2" width="28" height="28" rx="3" stroke="#00e0c6" stroke-width="1.5" fill="none"/>
    </svg>
    <div class="logo-text">The <span>Cube</span></div>
  </div>
</header>

<!-- Main Content -->
<main class="main">

  <!-- Stats Bar -->
  <div class="stats-bar">
    <div class="stat">
      <span class="stat-label">Moves</span>
      <span class="stat-value" id="moveCount">0</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <span class="stat-label">Time</span>
      <span class="stat-value timer" id="timer">00:00</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <span class="stat-label">Best</span>
      <span class="stat-value" id="bestTime">--:--</span>
    </div>
  </div>

  <!-- Cube Stage -->
  <div class="stage">
    <div class="cube-container">
      <div class="cube-scene auto-rotate" id="cubeScene"></div>
    </div>
    <div class="cube-shadow"></div>
    <div class="drag-hint">Drag to rotate view</div>
  </div>

  <!-- Controls -->
  <div class="controls-section">

    <!-- Size Selector -->
    <div class="size-selector" id="sizeSelector">
      <button class="size-btn" data-size="2">2×2</button>
      <button class="size-btn active" data-size="3">3×3</button>
      <button class="size-btn" data-size="4">4×4</button>
      <button class="size-btn" data-size="5">5×5</button>
    </div>

    <!-- Action Buttons -->
    <div class="actions">
      <button class="btn btn-primary" id="btnScramble">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 4h2l2-2h2l2 2h2l2-2h2"/>
          <path d="M1 8h2l2 2h2l2-2h2l2 2h2"/>
          <path d="M1 12h2l2-2h2l2 2h2l2-2h2"/>
        </svg>
        Scramble
      </button>
      <button class="btn" id="btnUndo">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8h8a4 4 0 1 1-2 3.5"/>
          <path d="M7 5L3 8l4 3"/>
        </svg>
        Undo
      </button>
      <button class="btn" id="btnHint">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="6"/>
          <path d="M6 7h4M8 5v4"/>
        </svg>
        Hint
      </button>
      <button class="btn btn-danger" id="btnReset">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 8a6 6 0 1 1 1.8 4.2"/>
          <path d="M2 13v-4h4"/>
        </svg>
        Reset
      </button>
    </div>
  </div>

  <!-- Formula Panel -->
  <div class="formula-panel">
    <div class="formula-header">
      <span class="formula-title">Scramble Formula</span>
      <button class="formula-toggle" id="formulaToggle">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6l4 4 4-4"/>
        </svg>
      </button>
    </div>
    <div class="formula-body" id="formulaBody">
      <div class="formula-moves" id="formulaMoves">
        <span style="color: var(--text-dim); font-size: 13px;">Press <strong style="color: var(--accent);">Scramble</strong> to generate a puzzle</span>
      </div>
      <div class="formula-tip">
        <strong>Tip:</strong> Click any move in the formula to replay it. Standard notation: R=Right, L=Left, U=Up, D=Down, F=Front, B=Back. Add <strong>'</strong> for counter-clockwise, <strong>2</strong> for double turn.
      </div>
    </div>
  </div>

</main>

<script>
(function() {
  // ============ STATE ============
  let cubeSize = 3;
  let moveCount = 0;
  let timerInterval = null;
  let startTime = null;
  let bestTime = null;
  let scrambleMoves = [];
  let moveHistory = [];
  let cubeState = null;
  let isDragging = false;
  let rotX = -25;
  let rotY = 35;
  let lastMouse = { x: 0, y: 0 };
  let isPlaying = false;

  // Colors for faces: U=white, D=yellow, F=green, B=blue, R=red, L=orange
  const FACE_COLORS = {
    U: 'white', D: 'yellow', F: 'green', B: 'blue', R: 'red', L: 'orange'
  };

  const FACE_NAMES = ['U', 'D', 'F', 'B', 'R', 'L'];

  // ============ CUBE STATE ============
  function createSolvedState(n) {
    const state = {};
    FACE_NAMES.forEach((face, fi) => {
      state[face] = [];
      for (let i = 0; i < n * n; i++) {
        state[face].push(fi);
      }
    });
    return state;
  }

  function cloneState(state) {
    const clone = {};
    FACE_NAMES.forEach(f => {
      clone[f] = [...state[f]];
    });
    return clone;
  }

  // ============ 3D CUBE RENDERING ============
  function buildCube() {
    const scene = document.getElementById('cubeScene');
    scene.innerHTML = '';

    const faceSize = Math.max(30, Math.min(60, 240 / cubeSize));
    const totalSize = faceSize * cubeSize + 2 * (cubeSize - 1) * 2;
    document.documentElement.style.setProperty('--face-size', faceSize + 'px');
    document.documentElement.style.setProperty('--cube-size', totalSize + 'px');
    document.documentElement.style.setProperty('--gap', '2px');

    const half = (totalSize) / 2;

    FACE_NAMES.forEach((faceName, fi) => {
      const faceEl = document.createElement('div');
      faceEl.className = `face face-${faceName.toLowerCase()}`;
      faceEl.style.gridTemplateColumns = `repeat(${cubeSize}, var(--face-size))`;
      faceEl.style.gridTemplateRows = `repeat(${cubeSize}, var(--face-size))`;

      if (faceName === 'R') faceEl.style.transform = `rotateY(90deg) translateZ(${half}px)`;
      else if (faceName === 'L') faceEl.style.transform = `rotateY(-90deg) translateZ(${half}px)`;
      else if (faceName === 'U') faceEl.style.transform = `rotateX(90deg) translateZ(${half}px)`;
      else if (faceName === 'D') faceEl.style.transform = `rotateX(-90deg) translateZ(${half}px)`;
      else if (faceName === 'F') faceEl.style.transform = `translateZ(${half}px)`;
      else if (faceName === 'B') faceEl.style.transform = `rotateY(180deg) translateZ(${half}px)`;

      for (let i = 0; i < cubeSize * cubeSize; i++) {
        const sticker = document.createElement('div');
        sticker.className = 'sticker';
        sticker.dataset.face = faceName;
        sticker.dataset.index = i;
        updateStickerColor(sticker, cubeState[faceName][i]);
        faceEl.appendChild(sticker);
      }

      scene.appendChild(faceEl);
    });
  }

  function updateStickerColor(sticker, faceIdx) {
    sticker.className = 'sticker ' + FACE_COLORS[FACE_NAMES[faceIdx]];
  }

  function renderCubeState() {
    const stickers = document.querySelectorAll('.sticker');
    stickers.forEach(s => {
      const face = s.dataset.face;
      const idx = parseInt(s.dataset.index);
      updateStickerColor(s, cubeState[face][idx]);
    });
  }

  // ============ CUBE ROTATIONS ============
  // Face adjacency for rotation
  const FACE_ADJ = {
    U: { adj: { F: 'U', B: 'D', R: 'U', L: 'U' }, dir: { F: 1, B: -1, R: 1, L: -1 } },
    D: { adj: { F: 'D', B: 'U', R: 'D', L: 'D' }, dir: { F: -1, B: 1, R: -1, L: 1 } },
    F: { adj: { U: 'F', D: 'F', R: 'F', L: 'F' }, dir: { U: 1, D: -1, R: -1, L: 1 } },
    B: { adj: { U: 'B', D: 'B', R: 'B', L: 'B' }, dir: { U: -1, D: 1, R: 1, L: -1 } },
    R: { adj: { U: 'R', D: 'R', F: 'R', B: 'R' }, dir: { U: -1, D: 1, F: 1, B: -1 } },
    L: { adj: { U: 'L', D: 'L', F: 'L', B: 'L' }, dir: { U: 1, D: -1, F: -1, B: 1 } }
  };

  function rotateFace(state, face, clockwise, layers) {
    const n = cubeSize;
    const result = cloneState(state);

    if (!layers) layers = [n - 1];

    layers.forEach(layer => {
      // Rotate the face itself
      const faceArr = result[face].slice();
      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
          const idx = r * n + c;
          let nr, nc;
          if (clockwise) {
            nr = c;
            nc = n - 1 - r;
          } else {
            nr = n - 1 - c;
            nc = r;
          }
          // Only rotate cells in the specified layer
          const isLayer = (c === layer) || (c === n - 1 - layer) || (r === layer) || (r === n - 1 - layer);
          // For face rotation, we rotate the entire face
          const newIdx = nr * n + nc;
          result[face][newIdx] = faceArr[idx];
        }
      }

      // Rotate adjacent edge pieces
      // Simplified: for 3x3, rotate the edge strips
      if (n === 3) {
        rotateAdjacentEdges(result, face, clockwise);
      } else {
        rotateAdjacentEdgesN(result, face, clockwise, layer);
      }
    });

    return result;
  }

  function rotateAdjacentEdges(state, face, clockwise) {
    const n = 3;
    const temp = new Array(3 * n);

    if (face === 'R') {
      // U[2,5,8] -> F[2,5,8] -> D[2,5,8] -> B[6,3,0] -> U
      for (let i = 0; i < n; i++) {
        temp[i] = state.U[2 + i * 1]; // U right column
        temp[i + 3] = state.F[2 + i * 1];
        temp[i + 6] = state.D[2 + i * 1];
        temp[i + 9] = state.B[6 - i * 1];
      }
      if (clockwise) {
        for (let i = 0; i < n; i++) { state.U[2 + i] = temp[i + 9]; }
        for (let i = 0; i < n; i++) { state.F[2 + i] = temp[i]; }
        for (let i = 0; i < n; i++) { state.D[2 + i] = temp[i + 3]; }
        for (let i = 0; i < n; i++) { state.B[6 - i] = temp[i + 6]; }
      } else {
        for (let i = 0; i < n; i++) { state.U[2 + i] = temp[i + 3]; }
        for (let i = 0; i < n; i++) { state.F[2 + i] = temp[i + 6]; }
        for (let i = 0; i < n; i++) { state.D[2 + i] = temp[i + 9]; }
        for (let i = 0; i < n; i++) { state.B[6 - i] = temp[i]; }
      }
    } else if (face === 'L') {
      for (let i = 0; i < n; i++) {
        temp[i] = state.U[i];
        temp[i + 3] = state.F[i];
        temp[i + 6] = state.D[i];
        temp[i + 9] = state.B[6 - i];
      }
      if (clockwise) {
        for (let i = 0; i < n; i++) { state.U[i] = temp[i + 9]; }
        for (let i = 0; i < n; i++) { state.F[i] = temp[i]; }
        for (let i = 0; i < n; i++) { state.D[i] = temp[i + 3]; }
        for (let i = 0; i < n; i++) { state.B[6 - i] = temp[i + 6]; }
      } else {
        for (let i = 0; i < i < n; i++) { state.U[i] = temp[i + 3]; }
        for (let i = 0; i < n; i++) { state.F[i] = temp[i + 6]; }
        for (let i = 0; i < n; i++) { state.D[i] = temp[i + 9]; }
        for (let i = 0; i < n; i++) { state.B[6 - i] = temp[i]; }
      }
    } else if (face === 'U') {
      for (let i = 0; i < n; i++) {
        temp[i] = state.F[i];
        temp[i + 3] = state.R[i];
        temp[i + 6] = state.B[6 - i];
        temp[i + 9] = state.L[6 - i];
      }
      if (clockwise) {
        for (let i = 0; i < n; i++) { state.F[i] = temp[i + 9]; }
        for (let i = 0; i < n; i++) { state.R[i] = temp[i]; }
        for (let i = 0; i < n; i++) { state.B[6 - i] = temp[i + 3]; }
        for (let i = 0; i < n; i++) { state.L[6 - i] = temp[i + 6]; }
      } else {
        for (let i = 0; i < n; i++) { state.F[i] = temp[i + 3]; }
        for (let i = 0; i < n; i++) { state.R[i] = temp[i + 6]; }
        for (let i = 0; i < n; i++) { state.B[6 - i] = temp[i + 9]; }
        for (let i = 0; i < n; i++) { state.L[6 - i] = temp[i]; }
      }
    } else if (face === 'D') {
      for (let i = 0; i < n; i++) {
        temp[i] = state.F[6 + i];
        temp[i + 3] = state.R[6 + i];
        temp[i + 6] = state.B[6 + (2 - i)];
        temp[i + 9] = state.L[6 + (2 - i)];
      }
      if (clockwise) {
        for (let i = 0; i < n; i++) { state.F[6 + i] = temp[i + 9]; }
        for (let i = 0; i < n; i++) { state.R[6 + i] = temp[i]; }
        for (let i = 0; i < n; i++) { state.B[6 + (2 - i)] = temp[i + 3]; }
        for (let i = 0; i < n; i++) { state.L[6 + (2 - i)] = temp[i + 6]; }
      } else {
        for (let i = 0; i < n; i++) { state.F[6 + i] = temp[i + 3]; }
        for (let i = 0; i < n; i++) { state.R[6 + i] = temp[i + 6]; }
        for (let i = 0; i < n; i++) { state.B[6 + (2 - i)] = temp[i + 9]; }
        for (let i = 0; i < n; i++) { state.L[6 + (2 - i)] = temp[i]; }
      }
    } else if (face === 'F') {
      for (let i = 0; i < n; i++) {
        temp[i] = state.U[6 + i];
        temp[i + 3] = state.R[i * 1];
        temp[i + 6] = state.D[6 + (2 - i)];
        temp[i + 9] = state.L[6 - i * 1];
      }
      if (clockwise) {
        for (let i = 0; i < n; i++) { state.U[6 + i] = temp[i + 9]; }
        for (let i = 0; i < n; i++) { state.R[i] = temp[i]; }
        for (let i = 0; i < n; i++) { state.D[6 + (2 - i)] = temp[i + 3]; }
        for (let i = 0; i < n; i++) { state.L[6 - i] = temp[i + 6]; }
      } else {
        for (let i = 0; i < n; i++) { state.U[6 + i] = temp[i + 3]; }
        for (let i = 0; i < n; i++) { state.R[i] = temp[i + 6]; }
        for (let i = 0; i < n; i++) { state.D[6 + (2 - i)] = temp[i + 9]; }
        for (let i = 0; i < n; i++) { state.L[6 - i] = temp[i]; }
      }
    } else if (face === 'B') {
      for (let i = 0; i < n; i++) {
        temp[i] = state.U[i];
        temp[i + 3] = state.R[6 + i];
        temp[i + 6] = state.D[6 + (2 - i)];
        temp[i + 9] = state.L[i];
      }
      if (clockwise) {
        for (let i = 0; i < n; i++) { state.U[i] = temp[i + 9]; }
        for (let i = 0; i < n; i++) { state.R[6 + i] = temp[i]; }
        for (let i = 0; i < n; i++) { state.D[6 + (2 - i)] = temp[i + 3]; }
        for (let i = 0; i < n; i++) { state.L[i] = temp[i + 6]; }
      } else {
        for (let i = 0; i < n; i++) { state.U[i] = temp[i + 3]; }
        for (let i = 0; i < n; i++) { state.R[6 + i] = temp[i + 6]; }
        for (let i = 0; i < n; i++) { state.D[6 + (2 - i)] = temp[i + 9]; }
        for (let i = 0; i < n; i++) { state.L[i] = temp[i]; }
      }
    }
  }

  function rotateAdjacentEdgesN(state, face, clockwise, layer) {

  // ============ SCRAMBLE ============
  function generateScramble(n) {
    const moves = [];
    const faces = ['U', 'D', 'F', 'B', 'R', 'L'];
    const modifiers = ['', "'", '2'];
    const count = n === 2 ? 8 : n === 3 ? 20 : n === 4 ? 30 : 35;

    let lastFace = '';
    for (let i = 0; i < count; i++) {
      let face;
      do {
        face = faces[Math.floor(Math.random() * faces.length)];
      } while (face === lastFace);
      lastFace = face;
      const mod = modifiers[Math.floor(Math.random() * modifiers.length)];
      moves.push(face + mod);
    }
    return moves;
  }

  function applyMove(state, move) {
    const face = move[0];
    const mod = move.slice(1);
    let clockwise = true;
    let times = 1;

    if (mod === "'") clockwise = false;
    else if (mod === '2') times = 2;

    let result = state;
    for (let i = 0; i < times; i++) {
      result = rotateFace(result, face, clockwise);
    }
    return result;
  }

  function scramble() {
    stopTimer();
    cubeState = createSolvedState(cubeSize);
    scrambleMoves = generateScramble(cubeSize);
    moveHistory = [];
    moveCount = 0;
    updateMoveCount();

    scrambleMoves.forEach(move => {
      cubeState = applyMove(cubeState, move);
    });

    buildCube();
    renderCubeState();
    updateFormula();
    startTimer();
  }

  function undoMove() {
    if (moveHistory.length === 0) return;
    const lastMove = moveHistory.pop();
    const face = lastMove[0];
    const mod = lastMove.slice(1);
    let clockwise = mod === "'"; // undo reverses direction
    let times = 1;
    if (mod === '2') times = 2;

    let state = cubeState;
    for (let i = 0; i < times; i++) {
      state = rotateFace(state, face, clockwise);
    }
    cubeState = state;
    moveCount = moveHistory.length;
    updateMoveCount();
    renderCubeState();
  }

  function resetCube() {
    stopTimer();
    cubeState = createSolvedState(cubeSize);
    scrambleMoves = [];
    moveHistory = [];
    moveCount = 0;
    updateMoveCount();
    buildCube();
    renderCubeState();
    updateFormula();
    resetTimer();
  }

  function showHint() {
    // Highlight a random sticker
    const stickers = document.querySelectorAll('.sticker');
    stickers.forEach(s => s.classList.remove('hint-highlight'));

    if (moveHistory.length > 0) {
      // Highlight stickers on the last moved face
      const lastMove = moveHistory[moveHistory.length - 1];
      const face = lastMove[0];
      const faceStickers = document.querySelectorAll(`.sticker[data-face="${face}"]`);
      const randomSticker = faceStickers[Math.floor(Math.random() * faceStickers.length)];
      if (randomSticker) randomSticker.classList.add('hint-highlight');
    }
  }

  // ============ TIMER ============
  function startTimer() {
    stopTimer();
    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 100);
  }

  function stopTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  function resetTimer() {
    stopTimer();
    startTime = null;
    document.getElementById('timer').textContent = '00:00';
  }

  function updateTimer() {
    if (!startTime) return;
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
    const secs = (elapsed % 60).toString().padStart(2, '0');
    document.getElementById('timer').textContent = `${mins}:${secs}`;
  }

  function updateMoveCount() {
    document.getElementById('moveCount').textContent = moveCount;
  }

  // ============ FORMULA DISPLAY ============
  function updateFormula() {
    const container = document.getElementById('formulaMoves');
    if (scrambleMoves.length === 0) {
      container.innerHTML = '<span style="color: var(--text-dim); font-size: 13px;">Press <strong style="color: var(--accent);">Scramble</strong> to generate a puzzle</span>';
      return;
    }

    container.innerHTML = '';
    scrambleMoves.forEach((move, i) => {
      const el = document.createElement('span');
      el.className = 'formula-move';
      el.textContent = move;
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => {
        playMove(i);
      });
      container.appendChild(el);
    });
  }

  async function playMove(index) {
    if (isPlaying) return;
    isPlaying = true;

    // Reset to solved and replay up to this move
    cubeState = createSolvedState(cubeSize);
    moveHistory = [];
    moveCount = 0;

    for (let i = 0; i <= index; i++) {
      cubeState = applyMove(cubeState, scrambleMoves[i]);
      moveHistory.push(scrambleMoves[i]);
      moveCount++;
      renderCubeState();
      updateMoveCount();
      await sleep(200);
    }

    isPlaying = false;
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  // ============ CUBE ROTATION (DRAG) ============
  const cubeScene = document.getElementById('cubeScene');

  cubeScene.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastMouse = { x: e.clientX, y: e.clientY };
    cubeScene.classList.remove('auto-rotate');
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - lastMouse.x;
    const dy = e.clientY - lastMouse.y;
    rotY += dx * 0.5;
    rotX -= dy * 0.5;
    rotX = Math.max(-89, Math.min(89, rotX));
    cubeScene.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    lastMouse = { x: e.clientX, y: e.clientY };
  });

  document.addEventListener('mouseup', () => {
    isDragging = false;
  });

  // Touch support
  cubeScene.addEventListener('touchstart', (e) => {
    isDragging = true;
    lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    cubeScene.classList.remove('auto-rotate');
  });

  document.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const dx = e.touches[0].clientX - lastMouse.x;
    const dy = e.touches[0].clientY - lastMouse.y;
    rotY += dx * 0.5;
    rotX -= dy * 0.5;
    rotX = Math.max(-89, Math.min(89, rotX));
    cubeScene.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  });

  document.addEventListener('touchend', () => {
    isDragging = false;
  });

  // ============ SIZE SELECTOR ============
  document.querySelectorAll('.size-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      cubeSize = parseInt(btn.dataset.size);
      resetCube();
    });
  });

  // ============ BUTTON HANDLERS ============
  document.getElementById('btnScramble').addEventListener('click', scramble);
  document.getElementById('btnUndo').addEventListener('click', undoMove);
  document.getElementById('btnHint').addEventListener('click', showHint);
  document.getElementById('btnReset').addEventListener('click', resetCube);

  document.getElementById('formulaToggle').addEventListener('click', () => {
    const body = document.getElementById('formulaBody');
    body.classList.toggle('collapsed');
  });

  // ============ INIT ============
  cubeState = createSolvedState(cubeSize);
  buildCube();
  renderCubeState();

})();
