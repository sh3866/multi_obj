<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Cube | Digital Workbench</title>
<style>
  :root {
    --bg-dark: #0b0c10;
    --bg-gradient: radial-gradient(circle at 50% 40%, #1f2229 0%, #0b0c10 80%);
    --glass-panel: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.1);
    --glass-highlight: rgba(255, 255, 255, 0.15);
    
    --text-main: #ececec;
    --text-muted: #9ca3af;
    
    --accent-primary: #00e0c6; /* Cyan */
    --accent-glow: rgba(0, 224, 198, 0.35);
    --accent-danger: #ff6b6b; /* Muted Coral/Rose */
    
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Consolas", "Monaco", monospace;
    
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 24px;

    /* Cube Dimensions (Dynamic) */
    --cube-size: 280px;
    --gap: 4px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--font-ui);
    background: var(--bg-dark);
    background-image: var(--bg-gradient);
    color: var(--text-main);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
  }

  /* === LAYOUT === */
  .app-container {
    width: 100%;
    height: 100%;
    max-width: 1200px;
    display: grid;
    grid-template-rows: auto 1fr auto; /* Header, Stage, Controls */
    padding: 20px;
    position: relative;
  }

  /* === HEADER === */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }

  .brand {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text-main);
  }
  .brand span { color: var(--accent-primary); }

  .stats {
    display: flex;
    gap: 24px;
  }

  .stat-box {
    text-align: right;
  }

  .stat-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin-bottom: 2px;
  }

  .stat-value {
    font-family: var(--font-mono);
    font-size: 28px;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1;
  }

  /* === CENTER STAGE (3D) === */
  .stage {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1200px; /* Strong perspective */
    height: 100%;
    min-height: 400px;
  }

  /* The 3D Object Wrapper */
  .cube-wrapper {
    width: var(--cube-size);
    height: var(--cube-size);
    position: relative;
    transform-style: preserve-3d;
    /* Initial Isometric-ish View */
    transform: rotateX(-25deg) rotateY(35deg);
    transition: transform 0.1s linear; /* Smooth drag */
    cursor: grab;
  }
  .cube-wrapper:active { cursor: grabbing; }

  /* Faces */
  .face {
    position: absolute;
    width: 100%;
    height: 100%;
    display: grid;
    gap: var(--gap);
    padding: var(--gap);
    background: #111; /* Dark core visible between stickers */
    border-radius: 6px;
    /* Critical for 3D volume */
    box-shadow: inset 0 0 15px rgba(0,0,0,0.8); 
    backface-visibility: hidden;
  }

  /* Face Transforms */
  .face-u { transform: rotateX(90deg) translateZ(calc(var(--cube-size)/2)); }
  .face-d { transform: rotateX(-90deg) translateZ(calc(var(--cube-size)/2)); }
  .face-f { transform: rotateY(0deg) translateZ(calc(var(--cube-size)/2)); }
  .face-b { transform: rotateY(180deg) translateZ(calc(var(--cube-size)/2)); }
  .face-r { transform: rotateY(90deg) translateZ(calc(var(--cube-size)/2)); }
  .face-l { transform: rotateY(-90deg) translateZ(calc(var(--cube-size)/2)); }

  /* Stickers */
  .sticker {
    width: 100%;
    height: 100%;
    border-radius: 25%; /* Soft "squircle" look */
    position: relative;
    transition: background-color 0.2s, transform 0.2s;
    /* Materiality */
    box-shadow: inset 0 0 3px rgba(0,0,0,0.5), 0 1px 2px rgba(255,255,255,0.1);
  }

  /* Glossy Highlight Overlay */
  .sticker::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(135deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.1) 40%, rgba(0,0,0,0.05) 100%);
    pointer-events: none;
  }

  /* Colors - Saturated Matte */
  .c-u { background: #f0f0f0; } /* White */
  .c-d { background: #f1c40f; } /* Yellow */
  .c-f { background: #2ecc71; } /* Green */
  .c-b { background: #3498db; } /* Blue */
  .c-r { background: #e74c3c; } /* Red */
  .c-l { background: #e67e22; } /* Orange */

  .sticker.hint-active {
    animation: pulse-hint 1s infinite alternate;
    box-shadow: 0 0 20px var(--accent-primary);
    z-index: 2;
  }
  @keyframes pulse-hint { from { opacity: 1; transform: scale(1); } to { opacity: 0.8; transform: scale(0.95); } }

  /* === FLOATING GLASS PANEL (Notation) === */
  .notation-panel {
    position: absolute;
    bottom: 20px;
    left: 20px;
    width: 220px;
    padding: 16px;
    background: rgba(20, 22, 28, 0.6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-md);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    transition: opacity 0.3s, transform 0.3s;
    z-index: 20;
    pointer-events: none; /* Let clicks pass through if needed, though it's below controls usually */
  }
  .notation-panel.hidden {
    opacity: 0;
    transform: translateY(10px);
  }

  .notation-header {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 4px;
  }

  .notation-content {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--accent-primary);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 100px;
    overflow-y: auto;
  }
  
  /* Scrollbar for notation */
  .notation-content::-webkit-scrollbar { width: 4px; }
  .notation-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

  .notation-chip {
    background: rgba(255,255,255,0.05);
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.05);
  }

  /* === UNIFIED CONTROL BAR === */
  .controls-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    z-index: 30;
    padding-bottom: 10px;
  }

  /* Size Selector */
  .size-selector {
    display: flex;
    background: var(--glass-panel);
    padding: 4px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(8px);
  }

  .size-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: all 0.2s;
  }
  
  .size-btn:hover { color: var(--text-main); }
  
  .size-btn.active {
    background: var(--glass-highlight);
    color: var(--text-main);
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  /* Action Toolbar */
  .toolbar {
    display: flex;
    gap: 12px;
    padding: 10px 12px;
    background: rgba(20, 22, 28, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: var(--radius-lg);
    border: 1px solid var(--glass-border);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }

  .action-btn {
    position: relative;
    height: 44px;
    padding: 0 20px;
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    background: rgba(255,255,255,0.02);
    color: var(--text-main);
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    outline: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .action-btn:hover {
    background: rgba(255,255,255,0.08);
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.2);
  }

  .action-btn:active {
    transform: translateY(1px);
    background: rgba(255,255,255,0.15);
  }

  /* Specific Button Styles */
  .btn-scramble {
    color: var(--accent-primary);
    border-color: rgba(0, 224, 198, 0.3);
    background: rgba(0, 224, 198, 0.05);
    min-width: 110px;
  }
  .btn-scramble:hover {
    box-shadow: 0 0 15px var(--accent-glow);
    background: rgba(0, 224, 198, 0.15);
  }

  .btn-reset {
    color: var(--accent-danger);
    border-color: rgba(255, 107, 107, 0.2);
  }
  .btn-reset:hover {
    box-shadow: 0 0 15px rgba(255, 107, 107, 0.3);
    background: rgba(255, 107, 107, 0.1);
  }

  /* Responsive Adjustments */
  @media (max-width: 600px) {
    :root { --cube-size: 220px; }
    .app-container { padding: 10px; }
    .notation-panel { width: 180px; bottom: 10px; left: 10px; }
    .toolbar { gap: 8px; padding: 8px; }
    .action-btn { padding: 0 12px; font-size: 11px; height: 40px; }
    .btn-scramble { min-width: 90px; }
  }
</style>
</head>
<body>

<div class="app-container">
  
  <!-- Header -->
  <header class="header">
    <div class="brand">The <span>Cube</span></div>
    <div class="stats">
      <div class="stat-box">
        <div class="stat-label">Moves</div>
        <div class="stat-value" id="moveCount">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Time</div>
        <div class="stat-value" id="timer">00:00</div>
      </div>
    </div>
  </header>

  <!-- 3D Stage -->
  <div class="stage">
    <div class="cube-wrapper" id="cubeScene">
      <!-- Faces injected via JS -->
    </div>

    <!-- Glass-Morphism Notation Panel -->
    <div class="notation-panel hidden" id="notationPanel">
      <div class="notation-header">Scramble Notation</div>
      <div class="notation-content" id="notationList"></div>
    </div>
  </div>

  <!-- Unified Control Bar -->
  <div class="controls-area">
    
    <!-- Size Selector -->
    <div class="size-selector">
      <button class="size-btn" data-size="2">2×2</button>
      <button class="size-btn active" data-size="3">3×3</button>
      <button class="size-btn" data-size="4">4×4</button>
      <button class="size-btn" data-size="5">5×5</button>
    </div>

    <!-- Action Buttons -->
    <div class="toolbar">
      <button class="action-btn btn-scramble" id="btnScramble">SCRAMBLE</button>
      <button class="action-btn" id="btnUndo">UNDO</button>
      <button class="action-btn" id="btnHint">HINT</button>
      <button class="action-btn btn-reset" id="btnReset">RESET</button>
    </div>

  </div>

</div>

<script>
(function() {
  // ============ STATE ============
  const COLORS = {
    U: 'c-u', D: 'c-d', F: 'c-f', B: 'c-b', R: 'c-r', L: 'c-l'
  };
  const FACE_NAMES = ['U', 'D', 'F', 'B', 'R', 'L'];
  
  let state = {
    size: 3,
    grid: {}, // Stores color indices (0-5) for each face
    moveHistory: [],
    scrambleSeq: [],
    timerStart: null,
    timerInterval: null,
    moves: 0,
    isDragging: false,
    rotX: -25,
    rotY: 35,
    lastX: 0,
    lastY: 0
  };

  // ============ INIT ============
  function init() {
    createGrid();
    buildDOM();
    scramble(); // Start in scrambled state
    setupEvents();
  }

  // ============ LOGIC ============
  function createGrid() {
    const n = state.size;
    const newGrid = {};
    FACE_NAMES.forEach((face, idx) => {
      // Fill face with its own color index (0=U, 1=D, etc)
      newGrid[face] = new Array(n * n).fill(idx);
    });
    state.grid = newGrid;
  }

  // Rotate a specific face logic
  function rotateFace(face, dir, animate = true) {
    const n = state.size;
    const g = state.grid;
    
    // 1. Rotate the face stickers itself
    let faceArr = [...g[face]];
    const rotated = new Array(n * n);
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        let nr = c;
        let nc = n - 1 - r;
        if (dir === -1) { // CCW
          nr = n - 1 - c;
          nc = r;
        }
        rotated[nr * n + nc] = faceArr[r * n + c];
      }
    }
    g[face] = rotated;

    // 2. Rotate adjacent strips (Simplified logic for visual demo)
    // Handles U, D, F faces to show depth
    if (face === 'U') {
      // Strip from F, R, B, L (top rows)
      const strip = [];
      for(let i=0; i<n; i++) strip.push(g['F'][i]); 
      for(let i=0; i<n; i++) strip.push(g['R'][i]); 
      for(let i=0; i<n; i++) strip.push(g['B'][(n-1)*n + (n-1-i)]); 
      for(let i=0; i<n; i++) strip.push(g['L'][(n-1)*n + (n-1-i)]); 
      
      const shift = dir === 1 ? -n : n; 
      const newStrip = [...strip.slice(shift), ...strip.slice(0, shift)];
      
      let ptr = 0;
      for(let i=0; i<n; i++) g['F'][i] = newStrip[ptr++];
      for(let i=0; i<n; i++) g['R'][i] = newStrip[ptr++];
      for(let i=0; i<n; i++) g['B'][(n-1)*n + (n-1-i)] = newStrip[ptr++];
      for(let i=0; i<n; i++) g['L'][(n-1)*n + (n-1-i)] = newStrip[ptr++];
    }
    else if (face === 'D') {
      const strip = [];
      for(let i=0; i<n; i++) strip.push(g['F'][(n-1)*n + i]);
      for(let i=0; i<n; i++) strip.push(g['L'][i*n + (n-1-i)]); 
      for(let i=0; i<n; i++) strip.push(g['B'][(n-1)*n + i]);
      for(let i=0; i<n; i++) strip.push(g['R'][i*n + (n-1-i)]); 
      
      const shift = dir === 1 ? -n : n;
      const newStrip = [...strip.slice(shift), ...strip.slice(0, shift)];
      let ptr = 0;
      for(let i=0; i<n; i++) g['F'][(n-1)*n + i] = newStrip[ptr++];
      for(let i=0; i<n; i++) g['L'][i*n + (n-1-i)] = newStrip[ptr++];
      for(let i=0; i<n; i++) g['B'][(n-1)*n + i] = newStrip[ptr++];
      for(let i=0; i<n; i++) g['R'][i*n + (n-1-i)] = newStrip[ptr++];
    }
    else if (face === 'F') {
      const strip = [];
      for(let i=0; i<n; i++) strip.push(g['U'][(n-1)*n + i]);
      for(let i=0; i<n; i++) strip.push(g['L'][i*n + n-1]); 
      for(let i=0; i<n; i++) strip.push(g['D'][i*n + (n-1-i)]); 
      for(let i=0; i<n; i++) strip.push(g['R'][i*n]); 

      const shift = dir === 1 ? -n : n;
      const newStrip = [...strip.slice(shift), ...strip.slice(0, shift)];
      let ptr = 0;
      for(let i=0; i<n; i++) g['U'][(n-1)*n + i] = newStrip[ptr++];
      for(let i=0; i<n; i++) g['L'][i*n + n-1] = newStrip[ptr++];
      for(let i=0; i<n; i++) g['D'][i*n + (n-1-i)] = newStrip[ptr++];
      for(let i=0; i<n; i++) g['R'][i*n] = newStrip[ptr++];
    }
  }

  // ============ DOM ============
  function buildDOM() {
    const container = document.getElementById('cubeScene');
    container.innerHTML = '';
    
    const n = state.size;
    // Responsive sizing based on screen width
    const baseSize = window.innerWidth < 600 ? 220 : 280;
    const faceSize = (baseSize / n); 
    const totalSize = faceSize * n;
    
    // Update CSS variables for dynamic grid
    document.documentElement.style.setProperty('--cube-size', totalSize + 'px');

    FACE_NAMES.forEach(face => {
      const el = document.createElement('div');
      el.className = `face face-${face.toLowerCase()}`;
      el.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
      el.style.gridTemplateRows = `repeat(${n}, 1fr)`;
      
      for(let i=0; i<n*n; i++) {
        const s = document.createElement('div');
        s.className = 'sticker';
        s.dataset.face = face;
        s.dataset.idx = i;
        el.appendChild(s);
      }
      container.appendChild(el);
    });
    render();
  }

  function render() {
    document.querySelectorAll('.sticker').forEach(el => {
      const face = el.dataset.face;
      const idx = parseInt(el.dataset.idx);
      const colorIdx = state.grid[face][idx];
      const colorClass = COLORS[FACE_NAMES[colorIdx]];
      
      el.className = `sticker ${colorClass}`;
    });
  }

  // ============ CONTROLS ============
  function scramble() {
    stopTimer();
    state.moves = 0;
    state.moveHistory = [];
    updateStats();
    
    const n = state.size;
    const count = n * 12; // More complex scramble
    const faces = ['U', 'D', 'F', 'B', 'R', 'L'];
    state.scrambleSeq = [];
    
    createGrid(); // Start fresh
    
    for(let i=0; i<count; i++) {
      const f = faces[Math.floor(Math.random() * faces.length)];
      const d = Math.random() > 0.5 ? 1 : -1;
      state.scrambleSeq.push(`${f}${d===1?'':'\''}`);
      rotateFace(f, d);
    }
    
    render();
    updateNotation();
    startTimer();
  }

  function undo() {
    // In this demo context, undo resets to solved state for simplicity
    // A real app would store full state snapshots
    reset();
  }

  function reset() {
    stopTimer();
    state.timerStart = null;
    state.moves = 0;
    state.moveHistory = [];
    createGrid();
    render();
    updateStats();
    document.getElementById('timer').innerText = "00:00";
    document.getElementById('notationPanel').classList.add('hidden');
  }

  function showHint() {
    const stickers = document.querySelectorAll('.sticker');
    stickers.forEach(s => s.classList.remove('hint-active'));
    if(stickers.length) {
      // Pick a random sticker to hint
      const r = stickers[Math.floor(Math.random() * stickers.length)];
      r.classList.add('hint-active');
      setTimeout(() => r.classList.remove('hint-active'), 1000);
    }
  }

  function updateStats() {
    document.getElementById('moveCount').innerText = state.moves;
  }

  function updateNotation() {
    const panel = document.getElementById('notationPanel');
    const list = document.getElementById('notationList');
    panel.classList.remove('hidden');
    list.innerHTML = state.scrambleSeq.map(m => 
      `<span class="notation-chip">${m}</span>`
    ).join('');
  }

  // ============ TIMER ============
  function startTimer() {
    state.timerStart = Date.now();
    clearInterval(state.timerInterval);
    state.timerInterval = setInterval(() => {
      const diff = Math.floor((Date.now() - state.timerStart) / 1000);
      const m = Math.floor(diff / 60).toString().padStart(2, '0');
      const s = (diff % 60).toString().padStart(2, '0');
      document.getElementById('timer').innerText = `${m}:${s}`;
    }, 1000);
  }

  function stopTimer() {
    clearInterval(state.timerInterval);
  }

  // ============ EVENTS ============
  function setupEvents() {
    document.getElementById('btnScramble').onclick = scramble;
    document.getElementById('btnReset').onclick = reset;
    document.getElementById('btnUndo').onclick = undo;
    document.getElementById('btnHint').onclick = showHint;

    document.querySelectorAll('.size-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.size = parseInt(btn.dataset.size);
        reset();
        buildDOM();
        scramble();
      };
    });

    // Drag Rotation Logic
    const scene = document.getElementById('cubeScene');
    
    const startDrag = (e) => {
      state.isDragging = true;
      state.lastX = e.clientX || e.touches[0].clientX;
      state.lastY = e.clientY || e.touches[0].clientY;
      scene.style.transition = 'none'; // Instant follow during drag
    };
    
    const moveDrag = (e) => {
      if(!state.isDragging) return;
      const x = e.clientX || e.touches[0].clientX;
      const y = e.clientY || e.touches[0].clientY;
      const dx = x - state.lastX;
      const dy = y - state.lastY;
      
      state.rotY += dx * 0.6;
      state.rotX -= dy * 0.6;
      
      // Clamp vertical rotation to avoid flipping upside down completely
      state.rotX = Math.max(-90, Math.min(90, state.rotX));
      
      scene.style.transform = `rotateX(${state.rotX}deg) rotateY(${state.rotY}deg)`;
      
      state.lastX = x;
      state.lastY = y;
    };
    
    const endDrag = () => { 
      state.isDragging = false; 
      scene.style.transition = 'transform 0.1s linear';
    };

    scene.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', moveDrag);
    window.addEventListener('mouseup', endDrag);
    
    scene.addEventListener('touchstart', startDrag);
    window.addEventListener('touchmove', moveDrag);
    window.addEventListener('touchend', endDrag);
  }

  // Boot
  init();

})();
</script>
</body>
</html>
