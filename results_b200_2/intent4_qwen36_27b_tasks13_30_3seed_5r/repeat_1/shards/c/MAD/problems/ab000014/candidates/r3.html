<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Indigo Silk Robe | Houmongi</title>
    <style>
        :root {
            --bg-color: #EBE6DA;
            --kimono-primary: #162A38;
            --kimono-dark: #0F1D26;
            --obi-red: #8E2828;
            --obi-shadow: #5A1515;
            --gold: #D4AF37;
            --text-main: #2B2B2B;
            --text-sub: #5E5E5E;
            --cream: #F2EFE3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            /* Subtle paper texture via CSS noise */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Left Panel: Text & Hierarchy */
        .text-panel {
            width: 35%;
            height: 100%;
            padding: 8vh 5vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        .category {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--text-sub);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .category::before {
            content: '';
            display: block;
            width: 30px;
            height: 1px;
            background-color: var(--text-sub);
        }

        h1 {
            font-family: "Georgia", "Times New Roman", serif;
            font-size: 4.5rem;
            font-weight: 400;
            line-height: 1.1;
            color: var(--kimono-primary);
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-family: "Georgia", serif;
            font-style: italic;
            font-size: 2rem;
            color: var(--obi-red);
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .description {
            font-size: 1.125rem;
            line-height: 1.7;
            color: var(--text-sub);
            max-width: 400px;
            margin-bottom: 2rem;
        }

        .meta-row {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(0,0,0,0.1);
            font-size: 0.85rem;
            color: var(--text-main);
            letter-spacing: 0.05em;
            font-weight: 500;
        }

        .meta-dot {
            width: 4px;
            height: 4px;
            background-color: var(--obi-red);
            border-radius: 50%;
        }

        /* Center/Right Panel: Visual Stage */
        .visual-stage {
            width: 65%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        svg.kimono-svg {
            height: 92vh;
            width: auto;
            filter: drop-shadow(0px 20px 30px rgba(0,0,0,0.15));
            transition: transform 0.1s ease-out;
        }

        @media (max-width: 900px) {
            body { overflow-y: auto; height: auto; display: block; }
            .container { flex-direction: column; }
            .text-panel { width: 100%; height: auto; padding: 3rem 2rem; }
            .visual-stage { width: 100%; height: 60vh; }
            h1 { font-size: 3rem; }
            svg.kimono-svg { height: 50vh; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Left Panel -->
        <div class="text-panel">
            <div class="category">Collection 01</div>
            <h1>The Indigo<br>Silk Robe</h1>
            <div class="subtitle">Houmongi</div>
            <p class="description">
                A masterclass in structural elegance. This formal evening garment features a hand-dyed indigo base 
                adorned with the <em>Seigaiha</em> (ocean wave) motif, 
                secured by a voluminous Nagoya-style obi in rich vermillion.
            </p>
            
            <div class="meta-row">
                <span>Hand Woven Silk</span>
                <div class="meta-dot"></div>
                <span>Kyoto, Japan</span>
                <div class="meta-dot"></div>
                <span>Est. 1924</span>
            </div>
        </div>

        <!-- Right Panel: The Artifact -->
        <div class="visual-stage">
            <svg class="kimono-svg" viewBox="0 0 600 1050" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- 1. Silk Gradient -->
                    <linearGradient id="silk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#234252" />
                        <stop offset="40%" stop-color="#162A38" />
                        <stop offset="100%" stop-color="#0B141A" />
                    </linearGradient>

                    <!-- 2. Pattern: Seigaiha (Concentric Waves) -->
                    <pattern id="seigaiha" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                        <circle cx="20" cy="20" r="18" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
                        <circle cx="20" cy="20" r="10" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
                        <path d="M20 2 A18 18 0 0 1 38 20" fill="none" stroke="var(--gold)" stroke-width="1" opacity="0.5"/>
                    </pattern>

                    <!-- 3. Obi Gradient -->
                    <linearGradient id="obi-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#9E2A2B" />
                        <stop offset="50%" stop-color="#7A1E1F" />
                        <stop offset="100%" stop-color="#5A1515" />
                    </linearGradient>
                    
                    <!-- 4. Obi Knot Shadow Gradient -->
                    <radialGradient id="knot-shadow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="rgba(0,0,0,0)" />
                        <stop offset="100%" stop-color="rgba(0,0,0,0.4)" />
                    </radialGradient>
                </defs>

                <!-- Clip Paths for Pattern Masking -->
                <clipPath id="body-clip">
                    <path d="M260,100 C280,100 320,100 340,100 C350,140 360,200 360,240 C360,500 340,800 350,1020 C300,1030 300,1030 250,1020 C260,800 240,500 240,240 C240,200 250,140 260,100 Z" />
                </clipPath>
                
                <clipPath id="sleeve-left-clip">
                    <path d="M250,140 C220,145 180,160 160,180 C140,220 130,380 140,480 C170,490 200,490 220,470 C225,380 235,280 250,140 Z" />
                </clipPath>

                <clipPath id="sleeve-right-clip">
                    <path d="M350,140 C380,145 420,160 440,180 C460,220 470,380 460,480 C430,490 400,490 380,470 C375,380 365,280 350,140 Z" />
                </clipPath>

                <!-- LAYER 1: Sleeves (Behind Body) -->
                <g id="sleeves-layer">
                    <!-- Left Sleeve -->
                    <path d="M250,140 C220,145 180,160 160,180 C140,220 130,380 140,480 C170,490 200,490 220,470 C225,380 235,280 250,140 Z" fill="url(#silk-grad)" />
                    <rect x="0" y="0" width="600" height="1050" fill="url(#seigaiha)" opacity="0.8" clip-path="url(#sleeve-left-clip)" />
                    <!-- Sleeve Inner Shadow -->
                    <path d="M250,140 C220,145 180,160 160,180" stroke="rgba(0,0,0,0.2)" stroke-width="3" fill="none" />

                    <!-- Right Sleeve -->
                    <path d="M350,140 C380,145 420,160 440,180 C460,220 470,380 460,480 C430,490 400,490 380,470 C375,380 365,280 350,140 Z" fill="url(#silk-grad)" />
                    <rect x="0" y="0" width="600" height="1050" fill="url(#seigaiha)" opacity="0.8" clip-path="url(#sleeve-right-clip)" />
                    <!-- Sleeve Inner Shadow -->
                    <path d="M350,140 C380,145 420,160 440,180" stroke="rgba(0,0,0,0.2)" stroke-width="3" fill="none" />
                </g>

                <!-- LAYER 2: Main Body -->
                <g id="body-layer">
                    <!-- Base Shape with Organic Curves -->
                    <path d="M260,100 C280,100 320,100 340,100 C350,140 360,200 360,240 C360,500 340,800 350,1020 C300,1030 300,1030 250,1020 C260,800 240,500 240,240 C240,200 250,140 260,100 Z" fill="url(#silk-grad)" />
                    
                    <!-- Pattern Overlay -->
                    <rect x="0" y="0" width="600" height="1050" fill="url(#seigaiha)" clip-path="url(#body-clip)" opacity="0.8" />
                    
                    <!-- Fabric Folds -->
                    <path d="M300,560 C300,700 290,850 300,1020" stroke="rgba(0,0,0,0.15)" stroke-width="4" filter="blur(2px)" fill="none" />
                    <path d="M245,560 Q235,780 250,1020" stroke="rgba(0,0,0,0.1)" stroke-width="3" fill="none" />
                    <path d="M355,560 Q365,780 350,1020" stroke="rgba(0,0,0,0.1)" stroke-width="3" fill="none" />
                </g>

                <!-- LAYER 3: The Obi (Sash) -->
                <g id="obi-layer">
                    <!-- Obi Band (Front Wrap) - Curved to fit waist -->
                    <path d="M235,480 Q300,490 365,480 L370,580 Q300,590 230,580 Z" fill="url(#obi-grad)" />
                    
                    <!-- Obi Texture -->
                    <g opacity="0.4" stroke="#3A0A0A" stroke-width="1">
                        <path d="M233,490 Q300,500 367,490" />
                        <path d="M232,510 Q300,520 368,510" />
                        <path d="M231,530 Q300,540 369,530" />
                        <path d="M230,550 Q300,560 370,550" />
                        <path d="M229,570 Q300,580 371,570" />
                    </g>

                    <!-- Nagoya Knot (Back structure visible) -->
                    <g transform="translate(300, 530)">
                        <!-- Shadow under knot -->
                        <ellipse cx="0" cy="10" rx="60" ry="15" fill="url(#knot-shadow)" />
                        
                        <!-- Center bulk -->
                        <ellipse cx="0" cy="0" rx="30" ry="25" fill="var(--obi-shadow)" />
                        
                        <!-- Left Loop -->
                        <path d="M-25,0 C-60,-40 -80,10 -35,35 C-10,45 -10,10 -25,0 Z" fill="url(#obi-grad)" stroke="var(--gold)" stroke-width="0.5"/>
                        
                        <!-- Right Loop -->
                        <path d="M25,0 C60,-40 80,10 35,35 C10,45 10,10 25,0 Z" fill="url(#obi-grad)" stroke="var(--gold)" stroke-width="0.5"/>
                        
                        <!-- Gold Cord Detail -->
                        <path d="M-25,0 Q0,15 25,0" fill="none" stroke="var(--gold)" stroke-width="1.5" opacity="0.8" />
                    </g>
                </g>

                <!-- LAYER 4: Collar (The Eri) -->
                <g id="collar-layer">
                    <!-- Left Collar (Under) -->
                    <path d="M260,100 L230,180 L190,340 L210,340 L250,180 L290,100 Z" fill="var(--kimono-dark)" />
                    
                    <!-- Right Collar (Over - The White Eri) -->
                    <path d="M340,100 L370,180 L410,340 L390,340 L350,180 L310,100 Z" fill="var(--cream)" />
                    
                    <!-- The Indigo Edge of the Right Collar (Visible on the very edge) -->
                    <path d="M340,100 L370,180 L410,340 L405,340 L365,180 L335,100 Z" fill="var(--kimono-primary)" opacity="0.9" />

                    <!-- Shadow between collars -->
                    <path d="M340,100 L370,180 L410,340" stroke="rgba(0,0,0,0.2)" stroke-width="2" fill="none" />
                </g>

                <!-- LAYER 5: Highlights & Polish -->
                <g id="highlights">
                    <!-- Neckline Highlight -->
                    <path d="M260,100 L340,100" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
                    <!-- Sleeve Hem Highlight (Inner curve) -->
                    <path d="M140,480 L220,470" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
                    <path d="M460,480 L380,470" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
                </g>
            </svg>
        </div>
    </div>

    <script>
        // Refined Parallax
        document.addEventListener('mousemove', (e) => {
            const svg = document.querySelector('.kimono-svg');
            const x = (window.innerWidth - e.pageX * 2) / 120;
            const y = (window.innerHeight - e.pageY * 2) / 120;
            svg.style.transform = `translate(${x}px, ${y}px) rotate(${x * 0.05}deg)`;
        });
    </script>
</body>
</html>
