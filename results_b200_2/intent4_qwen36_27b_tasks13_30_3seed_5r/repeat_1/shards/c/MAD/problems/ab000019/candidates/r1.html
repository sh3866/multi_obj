<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactical AI Behavior Inspector</title>
<style>
  :root {
    --bg-deep: #050505;
    --bg-panel: #0f0f11;
    --border: #2a2a2e;
    --border-highlight: #3f3f46;
    --text-primary: #e4e4e7;
    --text-secondary: #71717a;
    --text-muted: #52525b;
    
    --accent-blue: #38bdf8;
    --accent-cyan: #22d3ee;
    --accent-red: #ef4444;
    --accent-orange: #f97316;
    --accent-yellow: #eab308;
    --accent-green: #22c55e;
    
    --grid-color: #18181b;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Monaco", "Inconsolata", "Fira Mono", "Droid Sans Mono", "Source Code Pro", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-deep);
    color: var(--text-primary);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 300px;
    grid-template-rows: 56px 1fr;
    font-size: 13px;
    user-select: none;
  }

  /* HEADER */
  header {
    grid-column: 1 / -1;
    background: rgba(15, 15, 17, 0.8);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 20;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  .brand {
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand span {
    color: var(--accent-blue);
  }

  .header-controls {
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .status-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 2px;
    background: rgba(34, 197, 94, 0.1);
    color: var(--accent-green);
    border: 1px solid rgba(34, 197, 94, 0.2);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
  .status-dot {
    width: 6px;
    height: 6px;
    background-color: currentColor;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.4; }
    100% { opacity: 1; }
  }

  /* MAIN CANVAS AREA */
  main {
    position: relative;
    background-color: var(--bg-deep);
    overflow: hidden;
    cursor: crosshair;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* INSPECTOR PANEL */
  aside {
    background: var(--bg-panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 24px;
    gap: 32px;
    overflow-y: auto;
    z-index: 10;
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel-title {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }

  /* REVISED LEGEND: Refined Indicators */
  .legend-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .legend-indicator {
    width: 12px;
    height: 12px;
    border-radius: 2px;
    position: relative;
  }
  
  .legend-indicator::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 2px;
  }

  .legend-label {
    font-weight: 500;
    color: var(--text-primary);
    flex: 1;
  }

  .legend-desc {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
  }

  /* Player Stats */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  
  .stat-row:last-child { border-bottom: none; }

  .stat-label { color: var(--text-secondary); font-size: 12px; }
  .stat-value { font-family: var(--font-mono); font-weight: 600; font-size: 12px; }

  /* Interactive Elements - Ghost Style */
  button {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    transition: all 0.2s;
    width: 100%;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  button:hover { 
    background: rgba(255,255,255,0.03); 
    color: var(--text-primary);
    border-color: var(--border-highlight);
  }
  
  button:active { background: rgba(255,255,255,0.08); }

  .toggle-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  
  .toggle-btn {
    width: 100%;
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  
  .toggle-btn.active {
    color: var(--text-primary);
    border-color: var(--text-secondary);
    background: rgba(255,255,255,0.02);
  }
  
  .toggle-indicator {
    width: 8px; height: 8px;
    border: 1px solid currentColor;
    border-radius: 50%;
  }
  
  .toggle-btn.active .toggle-indicator {
    background: currentColor;
  }

  /* Overlay Info */
  .overlay-info {
    position: absolute;
    bottom: 24px;
    left: 24px;
    pointer-events: none;
    font-family: var(--font-mono);
    color: var(--text-muted);
    font-size: 11px;
    line-height: 1.5;
    background: rgba(0,0,0,0.6);
    padding: 8px 12px;
    border-radius: 4px;
    backdrop-filter: blur(4px);
  }

</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="var(--accent-blue)"/>
    </svg>
    TACTICAL<span>AI</span> // OBSERVER
  </div>
  <div class="header-controls">
    <div class="status-badge">
      <div class="status-dot"></div>
      SIMULATION ACTIVE
    </div>
    <div style="font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary)">60 FPS</div>
  </div>
</header>

<main id="canvas-container">
  <canvas id="simCanvas"></canvas>
  <div class="overlay-info">
    <div>MOUSE: Move Player</div>
    <div>CLICK: Interact</div>
  </div>
</main>

<aside>
  <div class="panel-section">
    <div class="panel-title">Player Status</div>
    <div class="stat-row">
      <span class="stat-label">Health</span>
      <span class="stat-value" style="color: var(--accent-green)">100%</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Ammo</span>
      <span class="stat-value">32 / ∞</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Position</span>
      <span class="stat-value" id="pos-display">0, 0</span>
    </div>
  </div>

  <div class="panel-section">
    <div class="panel-title">
      AI State Legend
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    </div>
    <div class="legend-list">
      <div class="legend-row">
        <div class="legend-indicator" style="background: var(--accent-green);"></div>
        <span class="legend-label">PATROL</span>
        <span class="legend-desc">Idle</span>
      </div>
      <div class="legend-row">
        <div class="legend-indicator" style="background: var(--accent-yellow);"></div>
        <span class="legend-label">ALERT</span>
        <span class="legend-desc">Investigating</span>
      </div>
      <div class="legend-row">
        <div class="legend-indicator" style="background: var(--accent-orange);"></div>
        <span class="legend-label">CHASE</span>
        <span class="legend-desc">Moving</span>
      </div>
      <div class="legend-row">
        <div class="legend-indicator" style="background: var(--accent-red);"></div>
        <span class="legend-label">ATTACK</span>
        <span class="legend-desc">Combat</span>
      </div>
    </div>
  </div>

  <div class="panel-section">
    <div class="panel-title">Visualization Layers</div>
    <div class="toggle-group">
      <button class="toggle-btn active" onclick="toggleLayer('paths')">
        Pathfinding
        <div class="toggle-indicator"></div>
      </button>
      <button class="toggle-btn active" onclick="toggleLayer('fov')">
        Detection Cones
        <div class="toggle-indicator"></div>
      </button>
      <button class="toggle-btn active" onclick="toggleLayer('labels')">
        State Labels
        <div class="toggle-indicator"></div>
      </button>
    </div>
  </div>

  <div class="panel-section" style="margin-top: auto;">
    <button onclick="resetSimulation()">Reset Simulation</button>
  </div>
</aside>

<script>
/**
 * TACTICAL AI SIMULATION ENGINE
 * Pure Vanilla JS + Canvas API
 */

const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const posDisplay = document.getElementById('pos-display');

// Configuration
const CONFIG = {
  colors: {
    bg: '#050505',
    wall: '#18181b',
    wallBorder: '#27272a',
    grid: '#121214',
    player: '#38bdf8',
    playerGlow: 'rgba(56, 189, 248, 0.4)',
    states: {
      PATROL: '#22c55e',
      ALERT: '#eab308',
      CHASE: '#f97316',
      ATTACK: '#ef4444'
    }
  },
  enemyCount: 4,
  wallCount: 6
};

// State
let width, height;
let lastTime = 0;
let mouse = { x: 0, y: 0 };
let walls = [];
let enemies = [];
let particles = [];

// Layers
const layers = {
  paths: true,
  fov: true,
  labels: true
};

// --- UTILS ---

const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const lerp = (a, b, t) => a + (b - a) * t;
const angleTo = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);

// Line segment intersection (for wall collision/FOV)
function getIntersection(A, B, C, D) {
  const tTop = (D.x - C.x) * (A.y - C.y) - (D.y - C.y) * (A.x - C.x);
  const uTop = (C.y - A.y) * (A.x - B.x) - (C.x - A.x) * (A.y - B.y);
  const bottom = (D.y - C.y) * (B.x - A.x) - (D.x - C.x) * (B.y - A.y);

  if (bottom !== 0) {
    const t = tTop / bottom;
    const u = uTop / bottom;
    if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
      return {
        x: lerp(A.x, B.x, t),
        y: lerp(A.y, B.y, t),
        offset: t
      }
    }
  }
  return null;
}

// --- CLASSES ---

class Wall {
  constructor(x, y, w, h) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.segments = [
      {x1: x, y1: y, x2: x + w, y2: y},
      {x1: x + w, y1: y, x2: x + w, y2: y + h},
      {x1: x + w, y1: y + h, x2: x, y2: y + h},
      {x1: x, y1: y + h, x2: x, y2: y}
    ];
  }

  draw(ctx) {
    ctx.fillStyle = CONFIG.colors.wall;
    ctx.strokeStyle = CONFIG.colors.wallBorder;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.rect(this.x, this.y, this.w, this.h);
    ctx.fill();
    ctx.stroke();
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.color = color;
    this.vx = (Math.random() - 0.5) * 2;
    this.vy = (Math.random() - 0.5) * 2;
    this.life = 1.0;
    this.decay = 0.03 + Math.random() * 0.03;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }
  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Enemy {
  constructor(id, x, y, initialState = 'PATROL') {
    this.id = id;
    this.x = x;
    this.y = y;
    this.radius = 10;
    this.angle = Math.random() * Math.PI * 2;
    this.speed = 1.5 + Math.random();
    
    // AI State Machine
    this.state = initialState;
    this.targetX = this.x;
    this.targetY = this.y;
    
    // Waypoints
    this.waypoints = [];
    this.currentWaypointIndex = 0;
    this.generateWaypoints();

    // Properties
    this.viewDistance = 180;
    this.viewAngle = Math.PI / 3; // 60 degrees
    this.attackRange = 50;
    
    this.alertTimer = 0;
  }

  generateWaypoints() {
    this.waypoints = [];
    for(let i=0; i<4; i++) {
      this.waypoints.push({
        x: Math.random() * (width - 100) + 50,
        y: Math.random() * (height - 100) + 50
      });
    }
  }

  update(player, walls) {
    const dToPlayer = dist(this.x, this.y, player.x, player.y);
    const angleToPlayer = angleTo(this.x, this.y, player.x, player.y);
    
    // Normalize angle diff
    let angleDiff = angleToPlayer - this.angle;
    while (angleDiff <= -Math.PI) angleDiff += Math.PI*2;
    while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
    
    const inFOV = Math.abs(angleDiff) < this.viewAngle / 2;
    const canSee = dToPlayer < this.viewDistance && inFOV && this.hasLineOfSight(player.x, player.y, walls);

    // State Logic
    if (this.state === 'PATROL') {
      if (canSee) {
        this.state = 'CHASE';
        return;
      }
      this.patrol();
    } 
    else if (this.state === 'ALERT') {
      this.alertTimer--;
      if (this.alertTimer <= 0) this.state = 'PATROL';
      this.patrol(); // Simplified
    }
    else if (this.state === 'CHASE') {
      if (!canSee) {
        this.state = 'ALERT';
        this.alertTimer = 180; 
        return;
      }
      if (dToPlayer < this.attackRange) {
        this.state = 'ATTACK';
      } else {
        this.moveTowards(player.x, player.y);
      }
    }
    else if (this.state === 'ATTACK') {
      if (dToPlayer > this.viewDistance * 1.2) {
        this.state = 'CHASE';
      } else {
        // Face player and shoot
        this.angle = lerp(this.angle, angleToPlayer, 0.15);
        if (Math.random() < 0.08) this.shoot(player.x, player.y);
      }
    }
  }

  hasLineOfSight(tx, ty, walls) {
    const p1 = {x: this.x, y: this.y};
    const p2 = {x: tx, y: ty};
    
    for (let w of walls) {
      for (let seg of w.segments) {
        if (getIntersection(p1, p2, {x: seg.x1, y: seg.y1}, {x: seg.x2, y: seg.y2})) {
          return false;
        }
      }
    }
    return true;
  }

  patrol() {
    const wp = this.waypoints[this.currentWaypointIndex];
    if (dist(this.x, this.y, wp.x, wp.y) < 5) {
      this.currentWaypointIndex = (this.currentWaypointIndex + 1) % this.waypoints.length;
    }
    this.moveTowards(wp.x, wp.y);
  }

  moveTowards(tx, ty) {
    const targetAngle = angleTo(this.x, this.y, tx, ty);
    let diff = targetAngle - this.angle;
    while (diff <= -Math.PI) diff += Math.PI*2;
    while (diff > Math.PI) diff -= Math.PI*2;
    this.angle += diff * 0.1;

    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
    
    this.x = Math.max(20, Math.min(width - 20, this.x));
    this.y = Math.max(20, Math.min(height - 20, this.y));
  }

  shoot(tx, ty) {
    particles.push(new Particle(this.x + Math.cos(this.angle)*15, this.y + Math.sin(this.angle)*15, '#fbbf24'));
  }

  draw(ctx) {
    // Draw FOV Cone (Gradient)
    if (layers.fov) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      
      const grad = ctx.createLinearGradient(0, 0, this.viewDistance, 0);
      grad.addColorStop(0, 'rgba(255, 255, 255, 0.15)');
      grad.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
      
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, this.viewDistance, -this.viewAngle/2, this.viewAngle/2);
      ctx.closePath();
      
      ctx.fillStyle = grad;
      ctx.fill();
      
      // Thin line at the edge of cone
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(this.viewDistance, 0);
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.stroke();
      
      ctx.restore();
    }

    // Draw Pathfinding Line (CHASE or PATROL)
    if (layers.paths) {
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      
      let targetX, targetY;
      if (this.state === 'CHASE' || this.state === 'ATTACK') {
        targetX = mouse.x;
        targetY = mouse.y;
        ctx.strokeStyle = CONFIG.colors.states[this.state];
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]); // Dashed
      } else {
        // Patrol waypoint
        const wp = this.waypoints[this.currentWaypointIndex];
        targetX = wp.x;
        targetY = wp.y;
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 6]); // Faint Dashed
      }
      
      ctx.lineTo(targetX, targetY);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Draw Body
    const color = CONFIG.colors.states[this.state];
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    
    // Glow
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    
    // Body Shape (Triangle)
    ctx.beginPath();
    ctx.moveTo(10, 0);
    ctx.lineTo(-8, 7);
    ctx.lineTo(-8, -7);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    
    // Inner detail
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.moveTo(10, 0);
    ctx.lineTo(-4, 3);
    ctx.lineTo(-4, -3);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.restore();

    // Draw State Label
    if (layers.labels) {
      ctx.fillStyle = color;
      ctx.font = '600 9px var(--font-mono)';
      ctx.fillText(this.state, this.x - 12, this.y - 22);
      
      // Range circle (Attack range)
      if (this.state === 'ATTACK') {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.attackRange, 0, Math.PI*2);
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 2]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }
}

// --- MAIN LOOP ---

function init() {
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });

  generateMap();
  requestAnimationFrame(loop);
}

function resize() {
  const container = document.getElementById('canvas-container');
  width = container.clientWidth;
  height = container.clientHeight;
  canvas.width = width;
  canvas.height = height;
  // Re-generate map on resize to fit bounds
  if(walls.length === 0) generateMap();
}

function generateMap() {
  walls = [];
  enemies = [];
  
  // Generate Walls
  for(let i=0; i<CONFIG.wallCount; i++) {
    const w = 60 + Math.random() * 140;
    const h = 20 + Math.random() * 40;
    const x = Math.random() * (width - w - 100) + 50;
    const y = Math.random() * (height - h - 100) + 50;
    if (dist(x, y, width/2, height/2) > 150) {
      walls.push(new Wall(x, y, w, h));
    }
  }

  // Spawn Enemies
  // 1. Top-Left (ATTACK)
  enemies.push(new Enemy(0, width * 0.2, height * 0.2, 'ATTACK'));
  
  // 2. Bottom-Right (CHASE - Player will be near here)
  enemies.push(new Enemy(1, width * 0.8, height * 0.8, 'CHASE'));
  
  // 3 & 4. Random (PATROL)
  enemies.push(new Enemy(2, width * 0.8, height * 0.2, 'PATROL'));
  enemies.push(new Enemy(3, width * 0.2, height * 0.8, 'PATROL'));
}

function drawGrid() {
  ctx.strokeStyle = CONFIG.colors.grid;
  ctx.lineWidth = 1;
  const gridSize = 40;
  
  ctx.beginPath();
  for(let x=0; x<=width; x+=gridSize) {
    ctx.moveTo(x, 0);
    ctx.lineTo(x, height);
  }
  for(let y=0; y<=height; y+=gridSize) {
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
  }
  ctx.stroke();
}

function drawPlayer() {
  const pX = mouse.x;
  const pY = mouse.y;
  
  // Player Entity
  ctx.save();
  ctx.translate(pX, pY);
  
  // Pulse effect
  const time = Date.now() / 500;
  const scale = 1 + Math.sin(time) * 0.05;
  ctx.scale(scale, scale);

  ctx.shadowColor = CONFIG.colors.player;
  ctx.shadowBlur = 20;
  
  // Draw Diamond
  ctx.beginPath();
  ctx.moveTo(0, -8);
  ctx.lineTo(8, 0);
  ctx.lineTo(0, 8);
  ctx.lineTo(-8, 0);
  ctx.closePath();
  ctx.fillStyle = CONFIG.colors.player;
  ctx.fill();
  
  // Crosshair
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(0, 0, 16, 0, Math.PI*2);
  ctx.stroke();

  ctx.restore();

  posDisplay.innerText = `${Math.floor(pX)}, ${Math.floor(pY)}`;
}

function loop() {
  // Clear
  ctx.fillStyle = CONFIG.colors.bg;
  ctx.fillRect(0, 0, width, height);
  
  drawGrid();

  // Update & Draw Enemies
  enemies.forEach(e => {
    e.update(mouse, walls);
    e.draw(ctx);
  });

  // Update & Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  // Draw Walls
  walls.forEach(w => w.draw(ctx));

  drawPlayer();

  requestAnimationFrame(loop);
}

// --- UI INTERACTION ---

window.toggleLayer = (layer) => {
  layers[layer] = !layers[layer];
  const btns = document.querySelectorAll('.toggle-btn');
  if (layer === 'paths') btns[0].classList.toggle('active');
  if (layer === 'fov') btns[1].classList.toggle('active');
  if (layer === 'labels') btns[2].classList.toggle('active');
};

window.resetSimulation = () => {
  generateMap();
  particles = [];
};

// Start
init();

</script>
