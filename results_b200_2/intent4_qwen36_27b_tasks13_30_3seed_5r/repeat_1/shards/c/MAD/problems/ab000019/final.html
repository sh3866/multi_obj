<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactical AI War Room // REVISED</title>
<style>
  :root {
    --bg-deep: #050505;
    --bg-panel: #0b0c10;
    --border: #1f2937;
    --text-primary: #e4e4e7;
    --text-secondary: #9ca3af;
    --text-muted: #4b5563;
    
    --accent-blue: #38bdf8;
    --accent-red: #ef4444;
    --accent-orange: #f97316;
    --accent-yellow: #eab308;
    --accent-green: #22c55e;
    --accent-cyan: #06b6d4;
    
    --font-ui: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "Menlo", "Consolas", "Monaco", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-deep);
    color: var(--text-primary);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    display: grid;
    /* Simplified layout to allow overlays */
    grid-template-columns: 280px 1fr;
    grid-template-rows: 60px 1fr;
    font-size: 12px;
    user-select: none;
  }

  /* HEADER */
  header {
    grid-column: 1 / -1;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    z-index: 20;
    position: relative;
  }
  
  header::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
    opacity: 0.5;
  }

  .brand {
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .brand span { color: var(--accent-cyan); }

  .header-controls {
    display: flex;
    gap: 24px;
    align-items: center;
  }

  .status-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-red);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 12px;
    border: 1px solid rgba(239, 68, 68, 0.3);
    background: rgba(239, 68, 68, 0.05);
    border-radius: 2px;
  }
  
  .status-dot {
    width: 8px;
    height: 8px;
    background-color: currentColor;
    border-radius: 50%;
    box-shadow: 0 0 10px currentColor;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.4; }
    100% { opacity: 1; }
  }

  /* MAIN CANVAS AREA */
  main {
    position: relative;
    background-color: var(--bg-deep);
    overflow: hidden;
    cursor: none;
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* INSPECTOR PANEL - Sidebar */
  aside {
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 0;
    overflow-y: auto;
    z-index: 10;
    background-image: radial-gradient(var(--border) 1px, transparent 1px);
    background-size: 20px 20px;
    grid-row: 2 / 3;
    grid-column: 1 / 2;
  }

  .panel-content {
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 16px;
    border-left: 2px solid var(--border);
    padding-left: 20px;
    position: relative;
  }
  
  .panel-section::before {
    content: '';
    position: absolute;
    left: -2px;
    top: 0;
    width: 2px;
    height: 20px;
    background: var(--accent-cyan);
  }

  .panel-title {
    font-family: var(--font-mono);
    font-size: 13px; /* Increased size */
    font-weight: 800; /* Increased weight */
    color: var(--text-primary); /* Brighter */
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 12px;
  }

  /* TOGGLES - Refined */
  .toggle-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  
  .toggle-btn {
    background: rgba(255,255,255,0.02);
    color: var(--text-muted);
    border: 1px solid var(--border); /* Subtle border */
    padding: 10px;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    transition: all 0.2s;
    text-transform: uppercase;
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  
  .toggle-btn:hover { 
    color: var(--text-primary);
    border-color: var(--text-secondary);
  }
  
  .toggle-btn.active {
    color: var(--text-primary);
    background: rgba(255, 255, 255, 0.08); /* Solid fill instead of bright cyan border */
    border-color: rgba(255, 255, 255, 0.2);
  }
  
  .toggle-indicator {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: currentColor;
    opacity: 0;
  }
  
  .toggle-btn.active .toggle-indicator {
    opacity: 1;
  }

  /* FLOATING OVERLAYS (Moved from Sidebar) */
  
  /* 1. Threat Legend (Bottom Left) */
  .overlay-legend {
    position: absolute;
    bottom: 24px;
    left: 24px;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 15;
    background: rgba(5, 5, 5, 0.85);
    padding: 16px;
    border: 1px solid var(--border);
    backdrop-filter: blur(4px);
    border-radius: 4px;
  }
  
  .legend-title {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  .legend-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .legend-shape {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .legend-text {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  /* Active Threat Counter */
  .threat-counter {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--accent-red);
    background: rgba(239, 68, 68, 0.1);
    padding: 2px 6px;
    border-radius: 2px;
    border: 1px solid rgba(239, 68, 68, 0.3);
    animation: pulse 1s infinite;
  }

  /* 2. Player HUD (Bottom Right) */
  .overlay-player-hud {
    position: absolute;
    bottom: 24px;
    right: 24px;
    pointer-events: none;
    width: 240px;
    z-index: 15;
    background: rgba(5, 5, 5, 0.85);
    padding: 16px;
    border: 1px solid var(--border);
    backdrop-filter: blur(4px);
    border-radius: 4px;
    border-bottom: 2px solid var(--accent-blue);
  }

  .hud-strip {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .hud-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .hud-label { 
    color: var(--text-muted); 
    font-size: 10px; 
    font-weight: 600;
    font-family: var(--font-mono);
    text-transform: uppercase;
  }
  
  .hud-value { 
    font-family: var(--font-mono); 
    font-weight: 700; 
    font-size: 14px; 
    color: var(--text-primary);
  }

  .health-bar-container {
    width: 100%;
    height: 4px;
    background: #1a1a1c;
    margin-top: 4px;
    position: relative;
    overflow: hidden;
  }
  
  .health-bar-fill {
    height: 100%;
    background: var(--accent-green);
    width: 100%;
    box-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
  }

  /* Instructions Overlay */
  .overlay-info {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
    font-family: var(--font-mono);
    color: var(--text-muted);
    font-size: 11px;
    letter-spacing: 0.05em;
    background: rgba(5, 5, 5, 0.6);
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 20px;
  }

</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="2">
      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
    </svg>
    TACTICAL<span>AI</span>
  </div>
  <div class="header-controls">
    <div class="status-badge">
      <div class="status-dot"></div>
      LIVE FEED
    </div>
  </div>
</header>

<aside>
  <div class="panel-content">
    <!-- VISUALIZATION LAYERS -->
    <div class="panel-section">
      <div class="panel-title">Visualization Layers</div>
      <div class="toggle-row">
        <button class="toggle-btn active" onclick="toggleLayer('paths')">
          <span>Pathfinding</span>
          <div class="toggle-indicator"></div>
        </button>
        <button class="toggle-btn active" onclick="toggleLayer('fov')">
          <span>Detection</span>
          <div class="toggle-indicator"></div>
        </button>
        <button class="toggle-btn active" onclick="toggleLayer('ranges')">
          <span>Attack Zones</span>
          <div class="toggle-indicator"></div>
        </button>
        <button class="toggle-btn active" onclick="toggleLayer('labels')">
          <span>State Labels</span>
          <div class="toggle-indicator"></div>
        </button>
      </div>
    </div>

    <!-- SIMULATION CONTROLS -->
    <div class="panel-section">
      <div class="panel-title">Simulation</div>
      <div class="toggle-row">
        <button class="toggle-btn" onclick="resetSim()">
          <span>Recalibrate</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</aside>

<main id="canvas-container">
  <canvas id="simCanvas"></canvas>
  
  <div class="overlay-info">
    <span style="color:var(--accent-blue)">MOUSE</span> : MOVE PLAYER
  </div>

  <!-- THREAT LEGEND (Floating Bottom Left) -->
  <div class="overlay-legend">
    <div class="legend-title">Threat Classification</div>
    <div class="legend-list">
      <div class="legend-item">
        <div class="legend-shape">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="8" stroke="var(--accent-green)" stroke-width="2" stroke-dasharray="4 2"/>
          </svg>
        </div>
        <div class="legend-text" style="color: var(--accent-green)">PATROL</div>
      </div>
      
      <div class="legend-item">
        <div class="legend-shape">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
             <path d="M12 2L2 22h20L12 2z" stroke="var(--accent-yellow)" stroke-width="2"/>
          </svg>
        </div>
        <div class="legend-text" style="color: var(--accent-yellow)">ALERT</div>
      </div>

      <div class="legend-item">
        <div class="legend-shape">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
             <path d="M12 2L2 22h20L12 2z" stroke="var(--accent-orange)" stroke-width="2"/>
          </svg>
        </div>
        <div class="legend-text" style="color: var(--accent-orange)">CHASE</div>
      </div>

      <div class="legend-item">
        <div class="legend-shape">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
             <circle cx="12" cy="12" r="9" stroke="var(--accent-red)" stroke-width="2" stroke-dasharray="2 2"/>
             <circle cx="12" cy="12" r="3" fill="var(--accent-red)"/>
          </svg>
        </div>
        <div class="legend-text" style="color: var(--accent-red)">ATTACK</div>
        <div class="threat-counter">2 ACTIVE</div>
      </div>
    </div>
  </div>

  <!-- PLAYER HUD (Floating Bottom Right) -->
  <div class="overlay-player-hud">
    <div class="hud-strip">
      <div class="hud-row">
        <span class="hud-label">Player Unit</span>
        <span class="hud-value" style="font-size: 10px; color: var(--accent-blue)">ID: P-01</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">Integrity</span>
        <span class="hud-value" style="color: var(--accent-green)">100%</span>
      </div>
      <div class="health-bar-container">
        <div class="health-bar-fill"></div>
      </div>
      <div class="hud-row" style="margin-top: 8px;">
        <span class="hud-label">Coordinates</span>
        <span class="hud-value" style="font-size: 11px; color: var(--text-secondary)" id="coord-display">00.00.N</span>
      </div>
    </div>
  </div>
</main>

<script>
/**
 * TACTICAL AI SIMULATION ENGINE
 * Focus: Visual Identity, State Machine, Hostile Intelligence
 */

const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

// Configuration
const CONFIG = {
  colors: {
    bg: '#050505',
    states: {
      PATROL: '#22c55e',
      ALERT: '#eab308',
      CHASE: '#f97316',
      ATTACK: '#ef4444'
    }
  },
  wallCount: 6
};

// State
let width, height;
let mouse = { x: 0, y: 0 };
let walls = [];
let enemies = [];
let particles = [];

// Layers
const layers = {
  paths: true,
  fov: true,
  ranges: true,
  labels: true
};

// --- UTILS ---

const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const lerp = (a, b, t) => a + (b - a) * t;
const angleTo = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);

// Line segment intersection for occlusion
function getIntersection(A, B, C, D) {
  const tTop = (D.x - C.x) * (A.y - C.y) - (D.y - C.y) * (A.x - C.x);
  const uTop = (C.y - A.y) * (A.x - B.x) - (C.x - A.x) * (A.y - B.y);
  const bottom = (D.y - C.y) * (B.x - A.x) - (D.x - C.x) * (B.y - A.y);

  if (bottom !== 0) {
    const t = tTop / bottom;
    const u = uTop / bottom;
    if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
      return { x: lerp(A.x, B.x, t), y: lerp(A.y, B.y, t), offset: t }
    }
  }
  return null;
}

// --- CLASSES ---

class Wall {
  constructor(x, y, w, h) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.segments = [
      {x1: x, y1: y, x2: x + w, y2: y},
      {x1: x + w, y1: y, x2: x + w, y2: y + h},
      {x1: x + w, y1: y + h, x2: x, y2: y + h},
      {x1: x, y1: y + h, x2: x, y2: y}
    ];
  }

  draw(ctx) {
    ctx.save();
    
    // 1. Deep Shadow
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = 20;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 10;
    
    // 2. Wall Body
    ctx.fillStyle = '#0f0f10';
    ctx.strokeStyle = '#333338';
    ctx.lineWidth = 2;
    
    ctx.beginPath();
    ctx.rect(this.x, this.y, this.w, this.h);
    ctx.fill();
    ctx.stroke();

    // 3. Top Highlight (Fake 3D)
    ctx.shadowColor = 'transparent';
    ctx.strokeStyle = '#555555';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x + this.w, this.y);
    ctx.stroke();

    // 4. "Danger" texture
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.beginPath();
    ctx.moveTo(this.x + 5, this.y + 5);
    ctx.lineTo(this.x + this.w - 5, this.y + this.h - 5);
    ctx.stroke();

    ctx.restore();
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.color = color;
    this.vx = (Math.random() - 0.5) * 4;
    this.vy = (Math.random() - 0.5) * 4;
    this.life = 1.0;
    this.decay = 0.03 + Math.random() * 0.03;
    this.size = Math.random() * 3 + 1;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }
  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Enemy {
  constructor(id, x, y, initialState) {
    this.id = id;
    this.x = x;
    this.y = y;
    this.radius = 12;
    this.angle = Math.random() * Math.PI * 2;
    this.speed = 1.2 + Math.random() * 0.5;
    
    this.state = initialState;
    
    this.waypoints = [];
    this.currentWaypointIndex = 0;
    this.generateWaypoints();

    this.viewDistance = 220;
    this.viewAngle = Math.PI / 3; // 60 degrees
    this.attackRange = 70;
    
    this.alertTimer = 0;
    this.pulsePhase = Math.random() * 100;
    
    // Movement history for trails
    this.history = [];
  }

  generateWaypoints() {
    this.waypoints = [];
    for(let i=0; i<4; i++) {
      this.waypoints.push({
        x: Math.random() * (width - 100) + 50,
        y: Math.random() * (height - 100) + 50
      });
    }
  }

  update(player, walls) {
    // Record position for trail
    this.history.push({x: this.x, y: this.y});
    if(this.history.length > 20) this.history.shift();

    const dToPlayer = dist(this.x, this.y, player.x, player.y);
    const angleToPlayer = angleTo(this.x, this.y, player.x, player.y);
    
    let angleDiff = angleToPlayer - this.angle;
    while (angleDiff <= -Math.PI) angleDiff += Math.PI*2;
    while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
    
    const inFOV = Math.abs(angleDiff) < this.viewAngle / 2;
    const canSee = dToPlayer < this.viewDistance && inFOV && this.hasLineOfSight(player.x, player.y, walls);

    // State Machine Logic
    if (this.state === 'PATROL') {
      if (canSee) {
        this.state = 'CHASE';
        this.angle = angleToPlayer;
      } else {
        this.patrol();
      }
    } 
    else if (this.state === 'ALERT') {
      this.alertTimer--;
      if (this.alertTimer <= 0) this.state = 'PATROL';
      this.patrol(); 
    }
    else if (this.state === 'CHASE') {
      if (!canSee) {
        this.state = 'ALERT';
        this.alertTimer = 240; 
      } else {
        if (dToPlayer < this.attackRange) {
          this.state = 'ATTACK';
        } else {
          this.moveTowards(player.x, player.y);
        }
      }
    }
    else if (this.state === 'ATTACK') {
      if (dToPlayer > this.viewDistance * 1.2) {
        this.state = 'CHASE';
      } else {
        this.angle = lerp(this.angle, angleToPlayer, 0.15);
        // Visual flair: emit particles
        if (Math.random() < 0.15) this.shoot(player.x, player.y);
      }
    }
  }

  hasLineOfSight(tx, ty, walls) {
    const p1 = {x: this.x, y: this.y};
    const p2 = {x: tx, y: ty};
    
    for (let w of walls) {
      for (let seg of w.segments) {
        if (getIntersection(p1, p2, {x: seg.x1, y: seg.y1}, {x: seg.x2, y: seg.y2})) {
          return false;
        }
      }
    }
    return true;
  }

  patrol() {
    const wp = this.waypoints[this.currentWaypointIndex];
    if (dist(this.x, this.y, wp.x, wp.y) < 10) {
      this.currentWaypointIndex = (this.currentWaypointIndex + 1) % this.waypoints.length;
    }
    this.moveTowards(wp.x, wp.y);
  }

  moveTowards(tx, ty) {
    const targetAngle = angleTo(this.x, this.y, tx, ty);
    let diff = targetAngle - this.angle;
    while (diff <= -Math.PI) diff += Math.PI*2;
    while (diff > Math.PI) diff -= Math.PI*2;
    this.angle += diff * 0.1;

    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
    
    this.x = Math.max(20, Math.min(width - 20, this.x));
    this.y = Math.max(20, Math.min(height - 20, this.y));
  }

  shoot(tx, ty) {
    particles.push(new Particle(this.x + Math.cos(this.angle)*15, this.y + Math.sin(this.angle)*15, CONFIG.colors.states.ATTACK));
  }

  draw(ctx) {
    const color = CONFIG.colors.states[this.state];
    const isHostile = (this.state === 'CHASE' || this.state === 'ATTACK' || this.state === 'ALERT');

    // 1. Attack Range
    if (layers.ranges) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.attackRange, 0, Math.PI*2);
      ctx.strokeStyle = '#ef4444'; 
      ctx.globalAlpha = 0.4;
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }

    // 2. Detection Cones (Hostile Gradient)
    if (layers.fov) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      
      // Gradient based on state
      const grad = ctx.createLinearGradient(0, 0, this.viewDistance, 0);
      if (isHostile) {
        grad.addColorStop(0, 'rgba(239, 68, 68, 0.25)'); // Red
        grad.addColorStop(1, 'rgba(239, 68, 68, 0.0)');
      } else {
        grad.addColorStop(0, 'rgba(255, 255, 255, 0.1)'); // Neutral
        grad.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
      }
      
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, this.viewDistance, -this.viewAngle/2, this.viewAngle/2);
      ctx.closePath();
      
      ctx.fillStyle = grad;
      ctx.fill();
      
      // Wireframe
      ctx.strokeStyle = isHostile ? 'rgba(239, 68, 68, 0.4)' : 'rgba(255,255,255,0.1)';
      ctx.lineWidth = 1;
      ctx.stroke();
      
      ctx.restore();
    }

    // 3. Pathfinding Visualization (History Trails)
    if (layers.paths && this.history.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.history[0].x, this.history[0].y);
      for(let i=1; i<this.history.length; i++) {
        ctx.lineTo(this.history[i].x, this.history[i].y);
      }
      
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.4;
      ctx.lineWidth = 2;
      ctx.setLineDash([2, 4]); // Dotted trail
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }

    // 4. Body (Shape based on State)
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    
    // Glow
    ctx.shadowColor = color;
    ctx.shadowBlur = 15;
    
    ctx.fillStyle = color;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;

    if (this.state === 'PATROL') {
        // Circle
        ctx.beginPath();
        ctx.arc(0, 0, 10, 0, Math.PI*2);
        ctx.fill();
    } else {
        // Jagged Triangle for Hostile States
        const jag = (this.state === 'ATTACK') ? 4 : 0;
        ctx.beginPath();
        ctx.moveTo(14, 0);
        ctx.lineTo(-8, -8 - jag);
        ctx.lineTo(-4, 0); // Indent
        ctx.lineTo(-8, 8 + jag);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    }

    ctx.shadowBlur = 0;
    ctx.restore();

    // 5. State Label
    if (layers.labels) {
      ctx.fillStyle = color;
      ctx.font = '700 10px var(--font-mono)';
      ctx.textAlign = 'center';
      ctx.fillText(this.state, this.x, this.y - 26);
      
      // Connector
      ctx.beginPath();
      ctx.moveTo(this.x, this.y - 22);
      ctx.lineTo(this.x, this.y - 14);
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.6;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}

// --- MAIN LOOP ---

function init() {
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });
  
  generateMap();
  requestAnimationFrame(loop);
}

function resize() {
  const container = document.getElementById('canvas-container');
  width = container.clientWidth;
  height = container.clientHeight;
  canvas.width = width;
  canvas.height = height;
  if(walls.length === 0) generateMap();
}

function resetSim() {
  generateMap();
  particles = [];
}

function generateMap() {
  walls = [];
  enemies = [];
  
  // Create Arena Walls
  for(let i=0; i<CONFIG.wallCount; i++) {
    const w = 80 + Math.random() * 120;
    const h = 30 + Math.random() * 60;
    // Avoid center area for player
    const x = Math.random() * (width - w - 100) + 50;
    const y = Math.random() * (height - h - 100) + 50;
    if (dist(x, y, width/2, height/2) > 150) {
      walls.push(new Wall(x, y, w, h));
    }
  }

  // Position enemies specifically to demonstrate states
  // Enemy 0: ATTACK (Close to center)
  enemies.push(new Enemy(0, width * 0.55, height * 0.55, 'ATTACK'));
  
  // Enemy 1: CHASE (Mid range)
  enemies.push(new Enemy(1, width * 0.3, height * 0.3, 'CHASE'));
  
  // Enemy 2: PATROL (Far away)
  enemies.push(new Enemy(2, width * 0.8, height * 0.2, 'PATROL'));
  
  // Enemy 3: ALERT (Corner)
  enemies.push(new Enemy(3, width * 0.15, height * 0.8, 'ALERT'));
  enemies[3].alertTimer = 300;
}

function drawPlayer() {
  const pX = mouse.x;
  const pY = mouse.y;
  
  ctx.save();
  ctx.translate(pX, pY);
  
  // Blue Hexagon Core
  ctx.shadowColor = '#38bdf8';
  ctx.shadowBlur = 20;
  
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    ctx.lineTo(18 * Math.cos(i * Math.PI / 3), 18 * Math.sin(i * Math.PI / 3));
  }
  ctx.closePath();
  ctx.fillStyle = '#0ea5e9';
  ctx.fill();
  
  // Inner Core
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, 0, 6, 0, Math.PI*2);
  ctx.fill();
  
  // Tactical Ring
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.arc(0, 0, 30, 0, Math.PI*2);
  ctx.stroke();
  
  ctx.restore();
  
  // Update HUD Coordinates
  const coordDisplay = document.getElementById('coord-display');
  if(coordDisplay) {
    coordDisplay.innerText = `${(pX/10).toFixed(2)}.N ${(pY/10).toFixed(2)}.E`;
  }
}

function loop() {
  // Clear canvas (Background handled by CSS)
  ctx.clearRect(0, 0, width, height);
  
  // Draw Enemies
  enemies.forEach(e => {
    e.update(mouse, walls);
    e.draw(ctx);
  });

  // Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  // Draw Walls (On top of paths, behind player)
  walls.forEach(w => w.draw(ctx));

  // Draw Player (Top layer)
  drawPlayer();

  requestAnimationFrame(loop);
}

window.toggleLayer = (layer) => {
  layers[layer] = !layers[layer];
  const btns = document.querySelectorAll('.toggle-btn');
  btns.forEach(btn => {
    if(btn.getAttribute('onclick').includes(layer)) {
      btn.classList.toggle('active');
    }
  });
};

window.resetSim = resetSim;

init();

</script>
