<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactical AI Behavior Inspector</title>
<style>
  :root {
    --bg-deep: #050505;
    --bg-panel: #0a0a0b;
    --border: #1f1f22;
    --border-highlight: #2f2f35;
    --text-primary: #e4e4e7;
    --text-secondary: #a0a0a0; /* Increased contrast */
    --text-muted: #52525b;
    
    --accent-blue: #38bdf8;
    --accent-cyan: #22d3ee;
    --accent-red: #ef4444;
    --accent-orange: #f97316;
    --accent-yellow: #eab308;
    --accent-green: #22c55e;
    
    --grid-color: #141416;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Monaco", "Inconsolata", "Fira Mono", "Droid Sans Mono", "Source Code Pro", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-deep);
    color: var(--text-primary);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 280px;
    grid-template-rows: 48px 1fr;
    font-size: 12px;
    user-select: none;
  }

  /* HEADER */
  header {
    grid-column: 1 / -1;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 20;
  }

  .brand {
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand span {
    color: var(--accent-blue);
  }

  .header-controls {
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .status-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 4px; /* Unify radius */
    background: rgba(34, 197, 94, 0.1);
    color: var(--accent-green);
    border: 1px solid rgba(34, 197, 94, 0.2);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
  .status-dot {
    width: 6px;
    height: 6px;
    background-color: currentColor;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.4; }
    100% { opacity: 1; }
  }

  /* MAIN CANVAS AREA */
  main {
    position: relative;
    background-color: var(--bg-deep);
    overflow: hidden;
    cursor: crosshair;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* INSPECTOR PANEL */
  aside {
    background: var(--bg-panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px;
    gap: 24px;
    overflow-y: auto;
    z-index: 10;
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .panel-title {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }

  /* COMPACT HUD STRIP */
  .hud-strip {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: rgba(255,255,255,0.02);
    padding: 12px;
    border-radius: 4px;
    border: 1px solid var(--border);
  }

  .hud-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .hud-label { 
    color: var(--text-secondary); 
    font-size: 11px; 
  }
  
  .hud-value { 
    font-family: var(--font-mono); 
    font-weight: 600; 
    font-size: 12px; 
    color: var(--text-primary);
  }

  /* Health Bar */
  .health-bar-container {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.1); /* Subtle background track */
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
  }
  
  .health-bar-fill {
    height: 100%;
    background: var(--accent-green);
    width: 100%;
    transition: width 0.3s ease;
  }

  /* COMPACT TOGGLES */
  .toggle-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  
  .toggle-btn {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    transition: all 0.2s;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 32px;
  }
  
  .toggle-btn:hover { 
    background: rgba(255,255,255,0.03); 
    color: var(--text-primary);
  }
  
  .toggle-btn.active {
    color: var(--accent-blue);
    border-color: rgba(56, 189, 248, 0.3);
    background: rgba(56, 189, 248, 0.05);
  }

  .indicator-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background-color: currentColor;
  }

  /* Overlay Info */
  .overlay-info {
    position: absolute;
    bottom: 20px;
    left: 20px;
    pointer-events: none;
    font-family: var(--font-mono);
    color: var(--text-muted);
    font-size: 10px;
    line-height: 1.4;
    background: rgba(5, 5, 5, 0.8);
    padding: 8px 12px;
    border-radius: 4px;
    border: 1px solid var(--border);
  }

</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="var(--accent-blue)"/>
    </svg>
    TACTICAL<span>AI</span>
  </div>
  <div class="header-controls">
    <div class="status-badge">
      <div class="status-dot"></div>
      LIVE
    </div>
  </div>
</header>

<main id="canvas-container">
  <canvas id="simCanvas"></canvas>
  <div class="overlay-info">
    <div>MOUSE: MOVE PLAYER</div>
  </div>
</main>

<aside>
  <!-- COMPACT HUD STRIP -->
  <div class="panel-section">
    <div class="panel-title">Player Status</div>
    <div class="hud-strip">
      <div class="hud-row">
        <span class="hud-label">HEALTH</span>
        <span class="hud-value" style="color: var(--accent-green)">100%</span>
      </div>
      <div class="health-bar-container">
        <div class="health-bar-fill"></div>
      </div>
    </div>
  </div>

  <!-- COMPACT LAYERS (No Legend) -->
  <div class="panel-section">
    <div class="panel-title">Visualization Layers</div>
    <div class="toggle-row">
      <button class="toggle-btn active" onclick="toggleLayer('paths')">
        <div class="indicator-dot"></div> Paths
      </button>
      <button class="toggle-btn active" onclick="toggleLayer('fov')">
        <div class="indicator-dot"></div> FOV
      </button>
      <button class="toggle-btn active" onclick="toggleLayer('ranges')">
        <div class="indicator-dot"></div> Ranges
      </button>
      <button class="toggle-btn active" onclick="toggleLayer('labels')">
        <div class="indicator-dot"></div> Labels
      </button>
    </div>
  </div>

</aside>

<script>
/**
 * TACTICAL AI SIMULATION ENGINE
 */

const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

// Configuration
const CONFIG = {
  colors: {
    bg: '#050505',
    wall: '#141416',
    wallBorder: '#2a2a2e',
    grid: '#121214',
    player: '#38bdf8',
    playerGlow: 'rgba(56, 189, 248, 0.3)',
    states: {
      PATROL: '#22c55e',
      ALERT: '#eab308',
      CHASE: '#f97316',
      ATTACK: '#ef4444'
    }
  },
  enemyCount: 4,
  wallCount: 6
};

// State
let width, height;
let lastTime = 0;
let mouse = { x: 0, y: 0 };
let walls = [];
let enemies = [];
let particles = [];

// Layers
const layers = {
  paths: true,
  fov: true,
  ranges: true,
  labels: true
};

// --- UTILS ---

const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const lerp = (a, b, t) => a + (b - a) * t;
const angleTo = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);

// Line segment intersection
function getIntersection(A, B, C, D) {
  const tTop = (D.x - C.x) * (A.y - C.y) - (D.y - C.y) * (A.x - C.x);
  const uTop = (C.y - A.y) * (A.x - B.x) - (C.x - A.x) * (A.y - B.y);
  const bottom = (D.y - C.y) * (B.x - A.x) - (D.x - C.x) * (B.y - A.y);

  if (bottom !== 0) {
    const t = tTop / bottom;
    const u = uTop / bottom;
    if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
      return { x: lerp(A.x, B.x, t), y: lerp(A.y, B.y, t), offset: t }
    }
  }
  return null;
}

// --- CLASSES ---

class Wall {
  constructor(x, y, w, h) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.segments = [
      {x1: x, y1: y, x2: x + w, y2: y},
      {x1: x + w, y1: y, x2: x + w, y2: y + h},
      {x1: x + w, y1: y + h, x2: x, y2: y + h},
      {x1: x, y1: y + h, x2: x, y2: y}
    ];
  }

  draw(ctx) {
    ctx.fillStyle = CONFIG.colors.wall;
    ctx.strokeStyle = CONFIG.colors.wallBorder;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.rect(this.x, this.y, this.w, this.h);
    ctx.fill();
    ctx.stroke();
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.color = color;
    this.vx = (Math.random() - 0.5) * 3;
    this.vy = (Math.random() - 0.5) * 3;
    this.life = 1.0;
    this.decay = 0.05;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }
  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Enemy {
  constructor(id, x, y, initialState = 'PATROL') {
    this.id = id;
    this.x = x;
    this.y = y;
    this.radius = 10;
    this.angle = Math.random() * Math.PI * 2;
    this.speed = 1.5 + Math.random();
    
    this.state = initialState;
    this.targetX = this.x;
    this.targetY = this.y;
    
    this.waypoints = [];
    this.currentWaypointIndex = 0;
    this.generateWaypoints();

    this.viewDistance = 200;
    this.viewAngle = Math.PI / 2.5; // 72 degrees
    this.attackRange = 60;
    
    this.alertTimer = 0;
  }

  generateWaypoints() {
    this.waypoints = [];
    for(let i=0; i<4; i++) {
      this.waypoints.push({
        x: Math.random() * (width - 100) + 50,
        y: Math.random() * (height - 100) + 50
      });
    }
  }

  update(player, walls) {
    const dToPlayer = dist(this.x, this.y, player.x, player.y);
    const angleToPlayer = angleTo(this.x, this.y, player.x, player.y);
    
    let angleDiff = angleToPlayer - this.angle;
    while (angleDiff <= -Math.PI) angleDiff += Math.PI*2;
    while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
    
    const inFOV = Math.abs(angleDiff) < this.viewAngle / 2;
    const canSee = dToPlayer < this.viewDistance && inFOV && this.hasLineOfSight(player.x, player.y, walls);

    // State Machine
    if (this.state === 'PATROL') {
      if (canSee) {
        this.state = 'CHASE';
      } else {
        this.patrol();
      }
    } 
    else if (this.state === 'ALERT') {
      this.alertTimer--;
      if (this.alertTimer <= 0) this.state = 'PATROL';
      this.patrol(); 
    }
    else if (this.state === 'CHASE') {
      if (!canSee) {
        this.state = 'ALERT';
        this.alertTimer = 180; 
      } else {
        if (dToPlayer < this.attackRange) {
          this.state = 'ATTACK';
        } else {
          this.moveTowards(player.x, player.y);
        }
      }
    }
    else if (this.state === 'ATTACK') {
      if (dToPlayer > this.viewDistance * 1.2) {
        this.state = 'CHASE';
      } else {
        this.angle = lerp(this.angle, angleToPlayer, 0.15);
        if (Math.random() < 0.1) this.shoot(player.x, player.y);
      }
    }
  }

  hasLineOfSight(tx, ty, walls) {
    const p1 = {x: this.x, y: this.y};
    const p2 = {x: tx, y: ty};
    
    for (let w of walls) {
      for (let seg of w.segments) {
        if (getIntersection(p1, p2, {x: seg.x1, y: seg.y1}, {x: seg.x2, y: seg.y2})) {
          return false;
        }
      }
    }
    return true;
  }

  patrol() {
    const wp = this.waypoints[this.currentWaypointIndex];
    if (dist(this.x, this.y, wp.x, wp.y) < 5) {
      this.currentWaypointIndex = (this.currentWaypointIndex + 1) % this.waypoints.length;
    }
    this.moveTowards(wp.x, wp.y);
  }

  moveTowards(tx, ty) {
    const targetAngle = angleTo(this.x, this.y, tx, ty);
    let diff = targetAngle - this.angle;
    while (diff <= -Math.PI) diff += Math.PI*2;
    while (diff > Math.PI) diff -= Math.PI*2;
    this.angle += diff * 0.1;

    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
    
    this.x = Math.max(20, Math.min(width - 20, this.x));
    this.y = Math.max(20, Math.min(height - 20, this.y));
  }

  shoot(tx, ty) {
    particles.push(new Particle(this.x + Math.cos(this.angle)*15, this.y + Math.sin(this.angle)*15, '#fbbf24'));
  }

  draw(ctx) {
    // 1. Ranges (Distinct Circle)
    if (layers.ranges) {
      const color = CONFIG.colors.states[this.state];
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.attackRange, 0, Math.PI*2);
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.2;
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }

    // 2. Detection Cones (Glass Effect: Gradient + Wireframe)
    if (layers.fov) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      
      const grad = ctx.createLinearGradient(0, 0, this.viewDistance, 0);
      // Semi-transparent gradient
      grad.addColorStop(0, 'rgba(255, 255, 255, 0.15)');
      grad.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
      
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, this.viewDistance, -this.viewAngle/2, this.viewAngle/2);
      ctx.closePath();
      
      ctx.fillStyle = grad;
      ctx.fill();
      
      // Wireframe overlay
      ctx.beginPath();
      ctx.arc(0, 0, this.viewDistance, -this.viewAngle/2, this.viewAngle/2);
      ctx.lineTo(0,0);
      ctx.strokeStyle = 'rgba(255,255,255,0.15)'; // 10-15% opacity stroke
      ctx.lineWidth = 1;
      ctx.stroke();
      
      ctx.restore();
    }

    // 3. Pathfinding Visualization
    if (layers.paths) {
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      
      let targetX, targetY;
      const color = CONFIG.colors.states[this.state];

      if (this.state === 'CHASE' || this.state === 'ATTACK') {
        targetX = mouse.x;
        targetY = mouse.y;
        ctx.strokeStyle = color;
        ctx.globalAlpha = 0.6;
        ctx.lineWidth = 1;
        ctx.setLineDash([6, 6]); // Calculated path style
      } else {
        // Patrol waypoint
        const wp = this.waypoints[this.currentWaypointIndex];
        targetX = wp.x;
        targetY = wp.y;
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 8]); // Patrol route style
      }
      
      ctx.lineTo(targetX, targetY);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }

    // 4. Body
    const color = CONFIG.colors.states[this.state];
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    
    ctx.shadowColor = color;
    ctx.shadowBlur = 12;
    
    // Triangle Body
    ctx.beginPath();
    ctx.moveTo(12, 0);
    ctx.lineTo(-8, 8);
    ctx.lineTo(-8, -8);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    
    // Inner detail
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.moveTo(12, 0);
    ctx.lineTo(-4, 4);
    ctx.lineTo(-4, -4);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.restore();

    // 5. State Label (Direct Label)
    if (layers.labels) {
      ctx.fillStyle = color;
      ctx.font = '700 10px var(--font-mono)';
      ctx.textAlign = 'center';
      ctx.fillText(this.state, this.x, this.y - 24);
      
      // Draw a small connecting line to unit
      ctx.beginPath();
      ctx.moveTo(this.x, this.y - 20);
      ctx.lineTo(this.x, this.y - 12);
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.5;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}

// --- MAIN LOOP ---

function init() {
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });

  generateMap();
  requestAnimationFrame(loop);
}

function resize() {
  const container = document.getElementById('canvas-container');
  width = container.clientWidth;
  height = container.clientHeight;
  canvas.width = width;
  canvas.height = height;
  if(walls.length === 0) generateMap();
}

function generateMap() {
  walls = [];
  enemies = [];
  
  for(let i=0; i<CONFIG.wallCount; i++) {
    const w = 60 + Math.random() * 140;
    const h = 20 + Math.random() * 40;
    const x = Math.random() * (width - w - 100) + 50;
    const y = Math.random() * (height - h - 100) + 50;
    if (dist(x, y, width/2, height/2) > 150) {
      walls.push(new Wall(x, y, w, h));
    }
  }

  enemies.push(new Enemy(0, width * 0.2, height * 0.2, 'ATTACK'));
  enemies.push(new Enemy(1, width * 0.8, height * 0.8, 'CHASE'));
  enemies.push(new Enemy(2, width * 0.8, height * 0.2, 'PATROL'));
  enemies.push(new Enemy(3, width * 0.2, height * 0.8, 'PATROL'));
}

function drawGrid() {
  ctx.strokeStyle = CONFIG.colors.grid;
  ctx.lineWidth = 1;
  const gridSize = 40;
  
  ctx.beginPath();
  for(let x=0; x<=width; x+=gridSize) {
    ctx.moveTo(x, 0);
    ctx.lineTo(x, height);
  }
  for(let y=0; y<=height; y+=gridSize) {
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
  }
  ctx.stroke();
}

function drawPlayer() {
  const pX = mouse.x;
  const pY = mouse.y;
  
  ctx.save();
  ctx.translate(pX, pY);
  
  // Pulse effect
  const time = Date.now() / 500;
  const scale = 1 + Math.sin(time) * 0.05;
  ctx.scale(scale, scale);

  ctx.shadowColor = CONFIG.colors.player;
  ctx.shadowBlur = 25;
  
  // High Contrast Player: Diamond
  ctx.beginPath();
  ctx.moveTo(0, -12);
  ctx.lineTo(12, 0);
  ctx.lineTo(0, 12);
  ctx.lineTo(-12, 0);
  ctx.closePath();
  ctx.fillStyle = CONFIG.colors.player;
  ctx.fill();
  
  // Outline
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  ctx.shadowBlur = 0;
  
  // Crosshair
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(0, 0, 20, 0, Math.PI*2);
  ctx.stroke();

  ctx.restore();
}

function loop() {
  ctx.fillStyle = CONFIG.colors.bg;
  ctx.fillRect(0, 0, width, height);
  
  drawGrid();

  enemies.forEach(e => {
    e.update(mouse, walls);
    e.draw(ctx);
  });

  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  walls.forEach(w => w.draw(ctx));

  drawPlayer();

  requestAnimationFrame(loop);
}

window.toggleLayer = (layer) => {
  layers[layer] = !layers[layer];
  const btns = document.querySelectorAll('.toggle-btn');
  // Find button by onclick content (simplistic matching for this demo)
  btns.forEach(btn => {
    if(btn.getAttribute('onclick').includes(layer)) {
      btn.classList.toggle('active');
    }
  });
};

window.resetSimulation = () => {
  generateMap();
  particles = [];
};

init();

</script>
</body>
</html>
