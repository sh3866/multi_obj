<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Architecture & Data Flow</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --border-color: #2d3748;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --text-label: #f8fafc; /* Brighter for labels */
            
            /* Semantic Colors */
            --col-data: #00d4ff;      /* Cyan - Data */
            --col-instr: #f6ad55;     /* Amber - Instructions */
            --col-ctrl: #68d391;      /* Emerald - Control */
            --col-cpu: #ffffff;       /* White - CPU Border */
            --col-gpu: #9f7aea;       /* Purple - GPU Border */
            --col-mem: #4fd1c5;       /* Teal - RAM Border */
            --col-stor: #fc8181;      /* Red - Storage Border */
            --col-io: #a0aec0;        /* Slate - IO Border */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(11, 14, 20, 0.95);
            z-index: 10;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'Courier New', monospace;
            margin-top: 4px;
        }

        /* Legend - Moved to bottom center conceptually, but here in header for layout balance or moved via layout */
        .legend {
            display: flex;
            gap: 24px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
            color: var(--text-muted);
        }

        .line-sample {
            width: 24px;
            height: 2px;
            border-radius: 1px;
        }

        /* Main Canvas Area */
        main {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Center the legend at the bottom */
            flex-direction: column;
        }

        svg {
            width: 100%;
            height: 100%;
            max-width: 1400px; /* Wider layout */
            max-height: 900px;
        }

        /* SVG Styles */
        .node-box {
            fill: var(--card-bg);
            stroke-width: 1.5px; /* Constraint 5: Unified Stroke */
            rx: 8px; /* Constraint 5: Unified Radius */
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
            transition: all 0.3s ease;
        }

        .node-label {
            fill: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; /* System font for better rendering */
            font-weight: 700; /* Constraint 4: Bold Labels */
            font-size: 14px;
            text-anchor: middle;
            letter-spacing: 0.5px;
        }

        .node-sub {
            fill: var(--text-muted);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-weight: 500;
            font-size: 11px;
            text-anchor: middle;
        }

        .link-path {
            fill: none;
            stroke-width: 2px;
            opacity: 0.4;
        }

        /* Animations */
        @keyframes dash {
            to { stroke-dashoffset: -20; }
        }
        
        @keyframes flow {
            0% { stroke-dasharray: 0.1 100; stroke-dashoffset: 100; }
            50% { stroke-dasharray: 10 100; }
            100% { stroke-dasharray: 10 100; stroke-dashoffset: 0; }
        }

        .flow-particle {
            fill: none;
            stroke-width: 2px;
            stroke-dasharray: 10 150; 
            animation: flow 2s linear infinite;
        }

        /* Label Cutout Styles */
        .label-bg {
            fill: var(--bg-color); /* Matches body background */
            rx: 4px;
        }
        
        .link-text {
            fill: var(--text-label);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-weight: 600; /* Constraint 4: Medium/Semi-Bold */
            font-size: 11px;
            text-anchor: middle;
            letter-spacing: 0.5px;
        }

        /* Bottom Legend Container */
        .bottom-legend {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(21, 26, 35, 0.9);
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            border-radius: 8px;
            display: flex;
            gap: 32px;
            backdrop-filter: blur(4px);
            z-index: 20;
        }

    </style>
</head>
<body>

    <header>
        <div>
            <h1>System Architecture</h1>
            <div class="meta">Von Neumann Topology // Data Flow Schematic</div>
        </div>
    </header>

    <main id="canvas-container">
        <!-- SVG injected here by JS -->
    </main>

    <div class="bottom-legend">
        <div class="legend-item">
            <div class="line-sample" style="background: var(--col-data)"></div>
            <span>Data</span>
        </div>
        <div class="legend-item">
            <div class="line-sample" style="background: var(--col-instr)"></div>
            <span>Instructions</span>
        </div>
        <div class="legend-item">
            <div class="line-sample" style="background: var(--col-ctrl)"></div>
            <span>Control</span>
        </div>
    </div>

    <script>
        // Configuration
        const colors = {
            data: '#00d4ff',
            instr: '#f6ad55',
            ctrl: '#68d391',
            cpu: '#ffffff',
            gpu: '#9f7aea',
            mem: '#4fd1c5',
            stor: '#fc8181',
            io: '#a0aec0'
        };

        // Layout Definitions 
        // Constraint 3: CPU/RAM significantly larger.
        // Constraint 6: Input Left, Output Right.
        const components = {
            // Input (Left)
            inp:  { x: 50, y: 280, w: 140, h: 100, label: "Input", sub: "Keyboard / Mouse" },
            
            // CPU (Center - Larger)
            cpu:  { x: 350, y: 250, w: 260, h: 200, label: "CPU", sub: "Central Processing Unit" },
            
            // RAM (Top Center - Larger)
            mem:  { x: 350, y: 50, w: 260, h: 140, label: "RAM", sub: "System Memory" },
            
            // GPU (Right Center)
            gpu:  { x: 750, y: 250, w: 180, h: 140, label: "GPU", sub: "Graphics / Compute" },
            
            // Output (Far Right)
            out:  { x: 1050, y: 280, w: 140, h: 100, label: "Output", sub: "Display / Monitor" },
            
            // Storage (Bottom Left)
            stor: { x: 200, y: 550, w: 160, h: 100, label: "SSD", sub: "Non-Volatile Storage" },
            
            // Network (Bottom Right)
            net:  { x: 800, y: 550, w: 160, h: 100, label: "NIC", sub: "Network Interface" }
        };

        // Connections: From, To, Type, Label
        const connections = [
            // CPU <-> RAM (Heavy Traffic)
            { from: 'cpu', to: 'mem', type: 'data', label: 'Load / Store Data' },
            
            // Constraint 1: Add distinct orange line for Instructions
            { from: 'mem', to: 'cpu', type: 'instr', label: 'Instruction Fetch' }, 
            
            { from: 'cpu', to: 'mem', type: 'ctrl', label: 'Memory Control' },

            // CPU <-> GPU
            { from: 'cpu', to: 'gpu', type: 'data', label: 'Command Buffer' },
            
            // GPU <-> Output (Direct path)
            { from: 'gpu', to: 'out', type: 'data', label: 'Video Signal' },

            // CPU <-> Storage
            { from: 'cpu', to: 'stor', type: 'ctrl', label: 'I/O Request' },
            { from: 'stor', to: 'cpu', type: 'data', label: 'Block Data' },

            // CPU <-> Network
            { from: 'cpu', to: 'net', type: 'data', label: 'Packet TX' },
            { from: 'net', to: 'cpu', type: 'data', label: 'Packet RX' },

            // Input -> CPU
            { from: 'inp', to: 'cpu', type: 'ctrl', label: 'Interrupts' },
        ];

        // Helper to calculate center of a box
        const getCenter = (id, offset = {x:0, y:0}) => {
            const c = components[id];
            return { x: c.x + c.w/2 + offset.x, y: c.y + c.h/2 + offset.y };
        };

        // Helper to calculate edge intersection
        const getEdge = (sourceId, targetId) => {
            const s = components[sourceId];
            const t = components[targetId];
            const sCenter = { x: s.x + s.w/2, y: s.y + s.h/2 };
            const tCenter = { x: t.x + t.w/2, y: t.y + t.h/2 };

            // Determine dominant axis
            const dx = tCenter.x - sCenter.x;
            const dy = tCenter.y - sCenter.y;

            let start = { ...sCenter };
            let end = { ...tCenter };

            // Adjust start point to edge
            if (Math.abs(dx) > Math.abs(dy)) {
                // Horizontal dominant
                start.x = dx > 0 ? s.x + s.w : s.x;
                end.x = dx > 0 ? t.x : t.x + t.w;
            } else {
                // Vertical dominant
                start.y = dy > 0 ? s.y + s.h : s.y;
                end.y = dy > 0 ? t.y : t.y + t.h;
            }

            return { start, end };
        };

        // Create SVG Element
        const createSVG = () => {
            const ns = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(ns, "svg");
            svg.setAttribute("viewBox", "0 0 1200 700");

            // Defs for markers (Arrows)
            const defs = document.createElementNS(ns, "defs");
            
            const createMarker = (id, color) => {
                const marker = document.createElementNS(ns, "marker");
                marker.setAttribute("id", id);
                marker.setAttribute("markerWidth", "10");
                marker.setAttribute("markerHeight", "7");
                marker.setAttribute("refX", "9");
                marker.setAttribute("refY", "3.5");
                marker.setAttribute("orient", "auto");
                
                const polygon = document.createElementNS(ns, "polygon");
                polygon.setAttribute("points", "0 0, 10 3.5, 0 7");
                polygon.setAttribute("fill", color);
                marker.appendChild(polygon);
                return marker;
            };

            defs.appendChild(createMarker('arrow-data', colors.data));
            defs.appendChild(createMarker('arrow-instr', colors.instr));
            defs.appendChild(createMarker('arrow-ctrl', colors.ctrl));
            svg.appendChild(defs);

            // Layer 1: Connections
            const linksGroup = document.createElementNS(ns, "g");
            linksGroup.setAttribute("id", "links-layer");

            connections.forEach((conn, index) => {
                const { start, end } = getEdge(conn.from, conn.to);
                const color = colors[conn.type];
                const markerId = `arrow-${conn.type}`;

                // Path logic: Orthogonal (Manhattan) routing
                let d = `M ${start.x} ${start.y}`;
                
                // Create a "kink" in the middle for professional schematic look
                if (Math.abs(start.x - end.x) > 20 && Math.abs(start.y - end.y) > 20) {
                    const midX = (start.x + end.x) / 2;
                    d += ` L ${midX} ${start.y} L ${midX} ${end.y} L ${end.x} ${end.y}`;
                } else {
                    d += ` L ${end.x} ${end.y}`;
                }

                // Background Path (Track)
                const path = document.createElementNS(ns, "path");
                path.setAttribute("d", d);
                path.setAttribute("stroke", color);
                path.setAttribute("class", "link-path");
                path.setAttribute("marker-end", `url(#${markerId})`);
                linksGroup.appendChild(path);

                // Animated Particle Path
                const particle = document.createElementNS(ns, "path");
                particle.setAttribute("d", d);
                particle.setAttribute("stroke", color);
                particle.setAttribute("class", "flow-particle");
                particle.style.animationDelay = `${Math.random() * -2}s`;
                particle.style.animationDuration = `${1.5 + Math.random()}s`;
                linksGroup.appendChild(particle);

                // Constraint 2: Label Cutout Technique
                // Calculate midpoint of the path for the label
                // For the kinked path, the middle segment is horizontal or vertical.
                // We approximate the center of the bounding box for simplicity in this layout.
                const midPoint = {
                    x: (start.x + end.x) / 2,
                    y: (start.y + end.y) / 2
                };

                const labelGroup = document.createElementNS(ns, "g");
                
                // Text element
                const text = document.createElementNS(ns, "text");
                text.setAttribute("x", midPoint.x);
                text.setAttribute("y", midPoint.y);
                text.setAttribute("class", "link-text");
                text.setAttribute("dominant-baseline", "middle");
                text.textContent = conn.label;
                
                // Measure text to create background box
                // We append to SVG temporarily or estimate. Since we know the font, we estimate width.
                // Or we can use a simpler approach: append text, get bounding box, then draw rect behind it.
                // Since we are building DOM, let's append text first to a temp group, measure, then restructure.
                
                // Add text to group
                labelGroup.appendChild(text);
                linksGroup.appendChild(labelGroup);

                // Measure and add background
                const bbox = text.getBBox();
                const padding = 6;
                const rect = document.createElementNS(ns, "rect");
                rect.setAttribute("x", bbox.x - padding);
                rect.setAttribute("y", bbox.y - padding);
                rect.setAttribute("width", bbox.width + (padding * 2));
                rect.setAttribute("height", bbox.height + (padding * 2));
                rect.setAttribute("class", "label-bg");
                
                // Insert rect before text
                labelGroup.insertBefore(rect, text);
            });
            svg.appendChild(linksGroup);

            // Layer 2: Components
            const nodesGroup = document.createElementNS(ns, "g");
            
            Object.keys(components).forEach(key => {
                const comp = components[key];
                
                // Group for the node
                const g = document.createElementNS(ns, "g");
                g.setAttribute("id", key);
                g.setAttribute("transform", `translate(${comp.x}, ${comp.y})`);

                // Box
                const rect = document.createElementNS(ns, "rect");
                rect.setAttribute("width", comp.w);
                rect.setAttribute("height", comp.h);
                rect.setAttribute("class", "node-box");
                
                // Assign specific stroke colors
                if (key === 'cpu') rect.style.stroke = colors.cpu;
                else if (key === 'gpu') rect.style.stroke = colors.gpu;
                else if (key === 'mem') rect.style.stroke = colors.mem;
                else if (key === 'stor') rect.style.stroke = colors.stor;
                else rect.style.stroke = colors.io;
                
                g.appendChild(rect);

                // Icon (Simple geometric abstraction)
                const iconG = document.createElementNS(ns, "g");
                iconG.setAttribute("transform", `translate(${comp.w/2}, 35)`);
                iconG.setAttribute("class", "icon");
                iconG.style.opacity = "0.8";
                
                // Draw different icons based on type
                if (key === 'cpu') {
                    // Grid pattern
                    for(let i=0; i<3; i++) {
                        for(let j=0; j<3; j++) {
                            const s = document.createElementNS(ns, "rect");
                            s.setAttribute("x", -15 + i*12); s.setAttribute("y", -15 + j*12);
                            s.setAttribute("width", 8); s.setAttribute("height", 8);
                            s.setAttribute("fill", "none"); s.setAttribute("stroke", "#fff"); s.setAttribute("stroke-width", "1.5");
                            iconG.appendChild(s);
                        }
                    }
                } else if (key === 'stor') {
                    // Layers
                    for(let i=0; i<3; i++) {
                        const l = document.createElementNS(ns, "path");
                        l.setAttribute("d", `M-15 -5+${i*5} L15 -5+${i*5}`);
                        l.setAttribute("fill", "none"); l.setAttribute("stroke", colors.stor); l.setAttribute("stroke-width", "2");
                        iconG.appendChild(l);
                    }
                } else if (key === 'gpu') {
                    // Triangle/Fan
                    const t = document.createElementNS(ns, "polygon");
                    t.setAttribute("points", "0,-12 12,8 -12,8");
                    t.setAttribute("fill", "none"); t.setAttribute("stroke", colors.gpu); t.setAttribute("stroke-width", "2");
                    iconG.appendChild(t);
                } else if (key === 'mem') {
                    // Chips
                    for(let i=0; i<4; i++) {
                        const r = document.createElementNS(ns, "rect");
                        r.setAttribute("x", -20 + i*12); r.setAttribute("y", -10);
                        r.setAttribute("width", 8); r.setAttribute("height", 20);
                        r.setAttribute("fill", colors.mem); r.setAttribute("opacity", "0.5");
                        iconG.appendChild(r);
                    }
                } else if (key === 'inp') {
                    // Keyboard/Mouse abstract
                    const k = document.createElementNS(ns, "rect");
                    k.setAttribute("x", -15); k.setAttribute("y", -10);
                    k.setAttribute("width", 30); k.setAttribute("height", 20);
                    k.setAttribute("fill", "none"); k.setAttribute("stroke", colors.io); k.setAttribute("stroke-width", "1.5");
                    iconG.appendChild(k);
                } else if (key === 'out') {
                    // Monitor abstract
                    const m = document.createElementNS(ns, "rect");
                    m.setAttribute("x", -18); m.setAttribute("y", -12);
                    m.setAttribute("width", 36); m.setAttribute("height", 24);
                    m.setAttribute("fill", "none"); m.setAttribute("stroke", colors.io); m.setAttribute("stroke-width", "1.5");
                    iconG.appendChild(m);
                } else if (key === 'net') {
                    // Globe/Network abstract
                    const c = document.createElementNS(ns, "circle");
                    c.setAttribute("r", 12); c.setAttribute("fill", "none"); c.setAttribute("stroke", colors.io); c.setAttribute("stroke-width", "1.5");
                    iconG.appendChild(c);
                    const l = document.createElementNS(ns, "path");
                    l.setAttribute("d", "M-12 0 L12 0 M0 -12 L0 12");
                    l.setAttribute("fill", "none"); l.setAttribute("stroke", colors.io); l.setAttribute("stroke-width", "1");
                    iconG.appendChild(l);
                }
                g.appendChild(iconG);

                // Text
                const textMain = document.createElementNS(ns, "text");
                textMain.setAttribute("x", comp.w/2);
                textMain.setAttribute("y", comp.h/2 + 15);
                textMain.setAttribute("class", "node-label");
                textMain.textContent = comp.label;
                g.appendChild(textMain);

                const textSub = document.createElementNS(ns, "text");
                textSub.setAttribute("x", comp.w/2);
                textSub.setAttribute("y", comp.h/2 + 35);
                textSub.setAttribute("class", "node-sub");
                textSub.textContent = comp.sub;
                g.appendChild(textSub);

                nodesGroup.appendChild(g);
            });
            svg.appendChild(nodesGroup);

            return svg;
        };

        // Initialize
        const container = document.getElementById('canvas-container');
        const svgElement = createSVG();
        container.appendChild(svgElement);

        // Simple Interaction: Highlight connections on hover
        const nodeGroups = svgElement.querySelectorAll('g[id]');
        nodeGroups.forEach(node => {
            node.addEventListener('mouseenter', () => {
                // Highlight box
                const rect = node.querySelector('rect');
                if(rect) rect.setAttribute('fill', '#1e2633');
                
                // Dim all lines first
                const lines = svgElement.querySelectorAll('.link-path');
                lines.forEach(line => line.setAttribute('opacity', '0.1'));

                // We don't have direct ref from path to connection in this simple loop, 
                // but visually dimming creates focus on the hovered node.
            });
            node.addEventListener('mouseleave', () => {
                const rect = node.querySelector('rect');
                if(rect) rect.setAttribute('fill', 'var(--card-bg)');
                
                const lines = svgElement.querySelectorAll('.link-path');
                lines.forEach(line => line.setAttribute('opacity', '0.4'));
            });
        });

    </script>
</body>
</html>
