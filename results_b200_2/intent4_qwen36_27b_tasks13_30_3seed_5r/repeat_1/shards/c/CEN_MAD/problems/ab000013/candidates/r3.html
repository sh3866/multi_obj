<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Rickshaw — Street Showcase</title>
<style>
    :root {
        --bg-dark: #0f172a;
        --panel-bg: #1e293b;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent-yellow: #fde047;
        --accent-yellow-dark: #eab308;
        --accent-teal: #0f766e;
        --accent-red: #ef4444;
        --ui-border: rgba(255, 255, 255, 0.1);
        --font-ui: "Montserrat", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: var(--font-ui);
        background-color: var(--bg-dark);
        color: var(--text-primary);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
    }

    /* Layout */
    .showcase-container {
        display: flex;
        width: 100%;
        height: 100%;
    }

    /* Visual Panel */
    .visual-panel {
        flex: 0 0 65%;
        position: relative;
        /* Sunset Gradient Atmosphere */
        background: radial-gradient(circle at 50% 40%, #4c1d95 0%, #1e1b4b 50%, #020617 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    /* Stylized Street Lights Background */
    .visual-panel::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 40%;
        background: linear-gradient(to top, rgba(255, 159, 67, 0.15), transparent);
        pointer-events: none;
    }

    .svg-wrapper {
        width: 100%;
        height: 100%;
        z-index: 10;
        display: flex;
        justify-content: center;
        align-items: center;
        transform: scale(0.9);
    }

    #rickshaw-svg {
        height: 90%;
        width: auto;
        /* Grounding Shadow */
        filter: drop-shadow(0 20px 40px rgba(0,0,0,0.7));
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Info Panel */
    .info-panel {
        flex: 1;
        background-color: var(--panel-bg);
        padding: 4rem 3rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
        border-left: 1px solid var(--ui-border);
        z-index: 20;
    }

    /* Typography */
    .header-block {
        margin-bottom: 3rem;
    }

    .tag {
        font-family: var(--font-ui);
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 4px;
        color: var(--accent-yellow);
        margin-bottom: 1rem;
        display: block;
        opacity: 0.9;
    }

    h1 {
        font-size: 4rem;
        line-height: 0.9;
        font-weight: 900;
        letter-spacing: -2px;
        color: var(--text-primary);
        margin-bottom: 0.5rem;
        text-align: right;
        background: linear-gradient(to right, #fff, #cbd5e1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .subtitle {
        font-size: 1.1rem;
        color: var(--text-secondary);
        font-weight: 500;
        text-align: right;
        letter-spacing: 1px;
    }

    /* Content Grid */
    .content {
        margin-top: auto;
    }

    .specs-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
        border-top: 1px solid var(--ui-border);
        padding-top: 2rem;
        margin-bottom: 3rem;
    }

    .spec-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 1rem;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .spec-label {
        font-size: 0.85rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600;
    }

    .spec-value {
        font-size: 1rem;
        font-weight: 700;
        color: var(--text-primary);
        text-align: right;
    }

    /* Controls */
    .controls-area {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: auto;
    }

    .price-tag {
        font-family: var(--font-ui);
        font-size: 1.2rem;
        font-weight: 800;
        color: var(--accent-yellow);
        background: rgba(253, 224, 71, 0.1);
        padding: 0.6rem 1.2rem;
        border-radius: 8px;
        border: 1px solid rgba(253, 224, 71, 0.2);
        letter-spacing: -0.5px;
    }

    .btn-group {
        display: flex;
        gap: 1rem;
    }

    .btn {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--ui-border);
        color: var(--text-primary);
        padding: 0.9rem 1.8rem;
        cursor: pointer;
        font-family: var(--font-ui);
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.2s ease;
        border-radius: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .btn:hover {
        background: rgba(255,255,255,0.08);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .btn:active {
        transform: translateY(0);
    }

    .btn.active {
        background: var(--accent-yellow);
        color: #000;
        border-color: var(--accent-yellow);
        box-shadow: 0 0 20px rgba(253, 224, 71, 0.4);
    }

    /* Animations */
    @keyframes horn-shake {
        0% { transform: translate(0, 0) rotate(0); }
        15% { transform: translate(-4px, 2px) rotate(-1deg); }
        30% { transform: translate(4px, -2px) rotate(1deg); }
        45% { transform: translate(-3px, 1px) rotate(-0.5deg); }
        60% { transform: translate(3px, -1px) rotate(0.5deg); }
        75% { transform: translate(-1px, 0px) rotate(-0.2deg); }
        100% { transform: translate(0, 0) rotate(0); }
    }

    .horn-active {
        animation: horn-shake 0.4s ease-in-out;
    }

    /* Responsive */
    @media (max-width: 1000px) {
        .showcase-container { flex-direction: column; overflow-y: auto; }
        .visual-panel { flex: 0 0 45%; min-height: 50vh; }
        .info-panel { flex: 1; padding: 2rem; border-left: none; border-top: 1px solid var(--ui-border); }
        h1 { font-size: 2.5rem; text-align: left; }
        .subtitle { text-align: left; }
        .controls-area { justify-content: flex-start; flex-wrap: wrap; gap: 1rem; }
        .svg-wrapper { transform: scale(0.75); }
    }
</style>
</head>
<body>

<div class="showcase-container">
    
    <!-- Left Panel: Visual -->
    <div class="visual-panel">
        <div class="svg-wrapper">
            <!-- 
                REVISED SVG:
                - Strict 2-Point Perspective
                - Chassis as Solid Volume
                - Electric Yellow / Metallic Charcoal Palette
                - Sticker Bomb Details
                - 3D Wheels & Mudguards
            -->
            <svg id="rickshaw-svg" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Gradients -->
                    <linearGradient id="bodyYellow" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#fef08a;stop-opacity:1" /> <!-- Highlight -->
                        <stop offset="40%" style="stop-color:#facc15;stop-opacity:1" /> <!-- Mid -->
                        <stop offset="100%" style="stop-color:#a16207;stop-opacity:1" /> <!-- Shadow -->
                    </linearGradient>
                    
                    <linearGradient id="bodyGreen" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#0f766e;stop-opacity:1" />
                    </linearGradient>
                    
                    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#fef08a;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#facc15;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#854d0e;stop-opacity:1" />
                    </linearGradient>

                    <linearGradient id="metalChassis" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#0f172a;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
                    </linearGradient>

                    <linearGradient id="glassRef" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:rgba(255,255,255,0.4);stop-opacity:1" />
                        <stop offset="40%" style="stop-color:rgba(255,255,255,0.0);stop-opacity:1" />
                        <stop offset="100%" style="stop-color:rgba(14,165,233,0.3);stop-opacity:1" />
                    </linearGradient>

                    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
                        <stop offset="40%" style="stop-color:#cbd5e1;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
                    </linearGradient>

                    <linearGradient id="tire" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
                    </linearGradient>

                    <radialGradient id="headlightGlow">
                        <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
                        <stop offset="40%" style="stop-color:#fef08a;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#fef08a;stop-opacity:0" />
                    </radialGradient>
                </defs>

                <!-- Ground Shadow -->
                <ellipse cx="450" cy="610" rx="260" ry="30" fill="rgba(0,0,0,0.8)" filter="blur(15px)" />

                <!-- ================= REAR WHEELS ================= -->
                <!-- Left Rear Wheel -->
                <g transform="translate(280, 530)">
                    <!-- Tire -->
                    <circle r="90" fill="url(#tire)" />
                    <circle r="90" fill="none" stroke="#1e293b" stroke-width="2" />
                    <!-- Rim -->
                    <circle r="65" fill="url(#chrome)" />
                    <!-- Spokes -->
                    <g stroke="#334155" stroke-width="6">
                        <line x1="0" y1="-65" x2="0" y2="65" />
                        <line x1="-56" y1="-32" x2="56" y2="32" />
                        <line x1="-56" y1="32" x2="56" y2="-32" />
                    </g>
                    <circle r="15" fill="#1e293b" />
                    <!-- Mudguard (Curved over wheel) -->
                    <path d="M-95,10 Q0,-100 95,10" fill="none" stroke="url(#metalChassis)" stroke-width="12" stroke-linecap="round" />
                </g>

                <!-- Right Rear Wheel (Depth) -->
                <g transform="translate(420, 550)">
                    <!-- Visible part of tire -->
                    <path d="M-85,0 A85,85 0 0,0 85,0 Z" fill="url(#tire)" />
                    <path d="M-60,0 A60,60 0 0,0 60,0 Z" fill="url(#chrome)" />
                    <path d="M-90,5 Q0,-95 90,5" fill="none" stroke="url(#metalChassis)" stroke-width="10" stroke-linecap="round" />
                </g>

                <!-- ================= CHASSIS VOLUME ================= -->
                <!-- Solid frame connecting wheels to cabin -->
                <!-- Side Face (Left) -->
                <path d="M280,530 L650,510 L600,420 L320,420 Z" fill="url(#metalChassis)" />
                <!-- Top Face (Connecting to cabin floor) -->
                <path d="M320,420 L600,420 L580,400 L300,400 Z" fill="#020617" />
                
                <!-- Exhaust Pipe -->
                <path d="M320,500 L200,500 L200,520" fill="none" stroke="url(#chrome)" stroke-width="10" stroke-linecap="round" />
                <path d="M200,520 L200,540" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round" />

                <!-- ================= CABIN BODY ================= -->
                
                <!-- Side Panel (Yellow) -->
                <path d="M310,410 L590,390 L590,220 L310,240 Z" fill="url(#bodyYellow)" />
                
                <!-- Green Stripe (Perspective adjusted) -->
                <path d="M310,310 L590,290 L590,330 L310,350 Z" fill="url(#bodyGreen)" />
                <!-- Stripe Detail -->
                <path d="M320,320 L580,300" stroke="white" stroke-width="2" stroke-dasharray="10,5" opacity="0.9" />

                <!-- Roof Canopy (Volumetric) -->
                <!-- Left Roof Side -->
                <path d="M270,250 L280,140 L570,120 L570,220 Z" fill="url(#roofGrad)" />
                <!-- Roof Top -->
                <path d="M280,140 L570,120 L590,140 L300,160 Z" fill="#fef08a" />
                <!-- Roof Shadow -->
                <path d="M280,140 L570,120 L570,220 L270,250 Z" fill="rgba(0,0,0,0.15)" />

                <!-- Front Fascia (Facing viewer) -->
                <path d="M590,390 L640,370 L640,190 L590,220 Z" fill="#ca8a04" />
                <!-- Fascia Shadow -->
                <path d="M590,390 L640,370 L640,190 L590,220 Z" fill="rgba(0,0,0,0.3)" />

                <!-- ================= INTERIOR & GLASS ================= -->
                
                <!-- Interior Back Wall -->
                <path d="M330,245 L330,395 L500,380 L500,235 Z" fill="#111" />
                
                <!-- Seat -->
                <path d="M330,340 L500,325 L500,380 L330,395 Z" fill="#334155" />
                <!-- Seat Texture Lines -->
                <path d="M340,350 L490,335 M340,360 L490,345" stroke="#1e293b" stroke-width="3" />

                <!-- Glass Windows (Semi-transparent) -->
                <path d="M330,245 L500,235 L500,380 L330,395 Z" fill="url(#glassRef)" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
                <!-- Glass Reflection Stripe -->
                <path d="M360,240 L390,385" stroke="white" stroke-width="8" opacity="0.2" />

                <!-- Windshield (Front - Transparent) -->
                <path d="M590,220 L640,190 L640,290 L590,310 Z" fill="url(#glassRef)" stroke="#333" stroke-width="2" />

                <!-- ================= STREET AESTHETIC (STICKER BOMB) ================= -->
                
                <!-- "Jai Hind" Sticker (High Contrast) -->
                <g transform="translate(350, 280) rotate(-2)">
                    <rect width="60" height="24" fill="#fff" rx="2" opacity="0.95" filter="drop-shadow(2px 2px 2px rgba(0,0,0,0.3))" />
                    <text x="30" y="16" font-family="Arial, sans-serif" font-size="11" font-weight="900" text-anchor="middle" fill="#ca8a04" letter-spacing="0.5">JAI HIND</text>
                </g>

                <!-- Religious Icon / Om (Simplified Vector) -->
                <g transform="translate(370, 310) rotate(3)">
                    <circle cx="15" cy="15" r="14" fill="#ef4444" />
                    <text x="15" y="20" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">ॐ</text>
                </g>

                <!-- Phone Sticker -->
                <g transform="translate(420, 300) rotate(1)">
                    <rect width="80" height="16" fill="#e2e8f0" rx="2" />
                    <text x="40" y="12" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#0f172a">98765 43210</text>
                </g>

                <!-- Small decorative sticker -->
                <g transform="translate(500, 290) rotate(-4)">
                    <rect width="30" height="10" fill="#2dd4bf" rx="1" />
                    <text x="15" y="8" font-family="sans-serif" font-size="6" font-weight="bold" text-anchor="middle" fill="white">CNG</text>
                </g>

                <!-- ================= DRIVER AREA ================= -->
                
                <!-- Handlebars (Distinct Mechanism) -->
                <path d="M600,180 L590,90 L640,70" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
                <!-- Grips -->
                <circle cx="640" cy="70" r="10" fill="#000" />
                <circle cx="590" cy="90" r="10" fill="#000" />
                
                <!-- Steering Column -->
                <path d="M590,90 L600,180" stroke="#334155" stroke-width="12" stroke-linecap="round" />

                <!-- Mirrors -->
                <g transform="translate(590, 90)">
                    <path d="M0,0 L-20,-50" stroke="#64748b" stroke-width="4" />
                    <ellipse cx="-20" cy="-55" rx="18" ry="10" fill="#1e293b" transform="rotate(-15)" />
                    <!-- Hanging Charm/Tassel -->
                    <path d="M-20,-55 L-20,-75" stroke="#ef4444" stroke-width="2" />
                    <circle cx="-20" cy="-76" r="3" fill="#ef4444" />
                </g>

                <!-- Headlamp (Prominent, Custom Shape) -->
                <g transform="translate(640, 260)">
                    <!-- Bracket -->
                    <path d="M0,0 L20,10 L20,-10 Z" fill="#333" />
                    <!-- Housing (Hexagon-ish) -->
                    <path d="M20,-25 L45,-15 L45,15 L20,25 Z" fill="#1e293b" stroke="#475569" stroke-width="2" />
                    <!-- Bulb -->
                    <ellipse cx="35" cy="0" rx="12" ry="18" fill="#fef3c7" id="headlight-bulb" />
                    <!-- Beam -->
                    <polygon id="light-beam" points="45,0 900,300 900,-200" fill="url(#headlightGlow)" opacity="0" style="mix-blend-mode: screen;" />
                </g>

                <!-- Front Bumper / Plate -->
                <rect x="610" y="360" width="30" height="14" fill="white" rx="2" />
                <text x="625" y="370" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle" fill="#000">KA 01</text>

                <!-- Tuk-Tuk Horn (Ornamental) -->
                <g transform="translate(610, 140)">
                    <path d="M0,0 L-10,-25 L10,-25 Z" fill="url(#chrome)" />
                    <circle cx="0" cy="-25" r="8" fill="#000" />
                </g>

            </svg>
        </div>
    </div>

    <!-- Right Panel: Info -->
    <div class="info-panel">
        <div class="header-block">
            <span class="tag">Indian Heritage Vehicle</span>
            <h1>THE AUTO<br>RICKSHAW</h1>
            <div class="subtitle">The Delta-3 Workhorse</div>
        </div>

        <div class="content">
            <div class="specs-grid">
                <div class="spec-row">
                    <span class="spec-label">Configuration</span>
                    <span class="spec-value">Delta 3-Wheel</span>
                </div>
                <div class="spec-row">
                    <span class="spec-label">Engine</span>
                    <span class="spec-value">3-Stroke / CNG</span>
                </div>
                <div class="spec-row">
                    <span class="spec-label">Capacity</span>
                    <span class="spec-value">3 Passengers</span>
                </div>
                <div class="spec-row">
                    <span class="spec-label">Origin</span>
                    <span class="spec-value">1970s India</span>
                </div>
                <div class="spec-row">
                    <span class="spec-label">Avg Speed</span>
                    <span class="spec-value">45 km/h (City)</span>
                </div>
            </div>
        </div>

        <div class="controls-area">
            <div class="price-tag">₹30.00 / km</div>
            <div class="btn-group">
                <button class="btn" id="btn-lights" onclick="toggleLights()">
                    <span>⚡</span> Lights
                </button>
                <button class="btn" id="btn-honk" onclick="honk()">
                    <span>📢</span> Honk
                </button>
            </div>
        </div>
    </div>

</div>

<script>
    const rickshaw = document.getElementById('rickshaw-svg');
    const beam = document.getElementById('light-beam');
    const bulb = document.getElementById('headlight-bulb');
    const btnLights = document.getElementById('btn-lights');

    let lightsOn = false;

    function toggleLights() {
        lightsOn = !lightsOn;
        if (lightsOn) {
            beam.style.opacity = '1';
            bulb.style.fill = '#ffffff';
            bulb.style.filter = 'drop-shadow(0 0 8px #fff)';
            btnLights.classList.add('active');
        } else {
            beam.style.opacity = '0';
            bulb.style.fill = '#fef3c7';
            bulb.style.filter = 'none';
            btnLights.classList.remove('active');
        }
    }

    function honk() {
        rickshaw.classList.add('horn-active');
        setTimeout(() => {
            rickshaw.classList.remove('horn-active');
        }, 400);
    }
</script>
</body>
</html>
