<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimono | Seiryu Collection</title>
    <style>
        :root {
            /* Palette: Deep Charcoal, Indigo, Silk Gold, Teal */
            --bg-dark: #0a0a0a;
            --bg-light: #1a1c20;
            --kimono-deep: #001f2b; /* Dark Teal/Indigo */
            --kimono-mid: #003647;
            --kimono-light: #004d66;
            --obi-deep: #4a0e0e;
            --obi-mid: #7a1c1c;
            --obi-light: #9e2a2a;
            --gold: #D4AF37;
            --gold-bright: #F9E596;
            --text-main: #E0E0E0;
            --text-sub: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at 70% 40%, var(--bg-light), var(--bg-dark));
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* Typography */
        .text-block {
            position: absolute;
            top: 50%;
            left: 5%;
            transform: translateY(-50%);
            text-align: left;
            z-index: 10;
            max-width: 300px;
        }

        h1 {
            font-family: "Georgia", serif;
            font-weight: 400;
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 1.5rem;
            opacity: 0.8;
        }

        h2 {
            font-family: "Georgia", serif;
            font-size: 2.8rem;
            font-weight: 400;
            line-height: 1.1;
            margin-bottom: 1rem;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        p {
            font-size: 0.85rem;
            line-height: 1.7;
            color: var(--text-sub);
            margin-bottom: 2rem;
            font-weight: 300;
            border-left: 1px solid var(--obi-mid);
            padding-left: 1rem;
        }

        .meta {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-sub);
            font-weight: 500;
            opacity: 0.6;
        }

        /* Layout */
        .stage {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: flex-end; /* Push to right for asymmetry */
            align-items: center;
            padding-right: 5%;
            position: relative;
        }

        /* SVG Styling */
        svg.kimono-svg {
            height: 95vh;
            width: auto;
            filter: drop-shadow(0px 20px 40px rgba(0, 0, 0, 0.8));
            transition: transform 0.1s ease-out; /* Smooth parallax */
            will-change: transform;
        }

        /* Responsive */
        @media (max-width: 1000px) {
            .stage {
                justify-content: center;
                padding-right: 0;
            }
            .text-block {
                position: relative;
                top: auto;
                left: auto;
                transform: none;
                margin-top: 2rem;
                margin-bottom: 2rem;
                text-align: center;
            }
            p {
                border-left: none;
                border-bottom: 1px solid var(--obi-mid);
                padding-left: 0;
                padding-bottom: 1rem;
            }
            body {
                flex-direction: column;
                overflow-y: auto;
                height: auto;
            }
            svg.kimono-svg {
                height: 60vh;
            }
        }
    </style>
</head>
<body>

    <div class="text-block">
        <h1>Collection 01</h1>
        <h2>Seiryu<br>Dragon Robe</h2>
        <p>
            A formal Houmongi featuring the mythological Azure Dragon. 
            Constructed from heavy silk crepe with a <em>Nagoya</em> 
            obiage and a sculptural <em>Taiko</em> knot.
        </p>
        <div class="meta">
            Kyoto &nbsp;•&nbsp; 2024
        </div>
    </div>

    <div class="stage">
        <svg class="kimono-svg" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 1. Gradients for Fabric Volume -->
                <!-- Main Body: Teal/Indigo Silk -->
                <linearGradient id="kimono-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--kimono-deep)" />
                    <stop offset="25%" style="stop-color:var(--kimono-mid)" />
                    <stop offset="50%" style="stop-color:var(--kimono-light)" /> <!-- Center Highlight -->
                    <stop offset="75%" style="stop-color:var(--kimono-mid)" />
                    <stop offset="100%" style="stop-color:var(--kimono-deep)" />
                </linearGradient>

                <!-- Obi Gradient: Deep Red -->
                <linearGradient id="obi-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:var(--obi-light)" />
                    <stop offset="50%" style="stop-color:var(--obi-mid)" />
                    <stop offset="100%" style="stop-color:var(--obi-deep)" />
                </linearGradient>

                <!-- Knot Gradient -->
                <linearGradient id="knot-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:var(--obi-light)" />
                    <stop offset="60%" style="stop-color:var(--obi-deep)" />
                    <stop offset="100%" style="stop-color:#2a0505" />
                </linearGradient>

                <!-- 2. The Pattern: Azure Dragon & Clouds (Seiryu / Kumo) -->
                <pattern id="dragon-pattern" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
                    <!-- Stylized Dragon Scale -->
                    <path d="M40 10 C55 10 65 20 65 35 C65 50 55 60 40 60 C25 60 15 50 15 35 C15 20 25 10 40 10 Z" fill="none" stroke="var(--gold)" stroke-width="1" opacity="0.4"/>
                    <path d="M40 20 C48 20 55 25 55 35 C55 45 48 50 40 50 C32 50 25 45 25 35 C25 25 32 20 40 20 Z" fill="var(--gold)" opacity="0.3"/>
                    <!-- Stylized Clouds (Kumo) -->
                    <path d="M10 70 Q20 60 30 70 T50 70" fill="none" stroke="var(--gold)" stroke-width="1.5" opacity="0.6"/>
                    <path d="M60 80 Q70 70 80 80" fill="none" stroke="var(--gold)" stroke-width="1.5" opacity="0.6"/>
                    <circle cx="40" cy="35" r="2" fill="var(--gold-bright)" opacity="0.8"/>
                </pattern>

                <!-- 3. Filters for Texture -->
                <filter id="noise">
                    <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" stitchTiles="stitch" />
                    <feColorMatrix type="saturate" values="0" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.1" />
                    </feComponentTransfer>
                    <feBlend in="SourceGraphic" mode="multiply" />
                </filter>

                <!-- Clip Paths -->
                <clipPath id="garment-clip">
                    <!-- Continuous Body Path -->
                    <path d="M300,120 L500,120 L530,180 L550,450 L580,470 L560,530 L520,530 L500,950 L300,950 L280,530 L240,530 L220,470 L250,450 L270,180 Z" />
                </clipPath>

                <clipPath id="obi-clip">
                    <path d="M250,500 L550,500 L555,590 L245,590 Z" />
                </clipPath>
            </defs>

            <!-- === LAYER 1: The Sleeves (Tate-sode) === -->
            <!-- T-Shaped, wide, extending seamlessly -->
            <g id="sleeves">
                <!-- Left Sleeve -->
                <path d="M270,180 L100,180 L80,480 L130,500 L240,340 Z" fill="url(#kimono-grad)" />
                <!-- Right Sleeve -->
                <path d="M530,180 L700,180 L720,480 L670,500 L560,340 Z" fill="url(#kimono-grad)" />
            </g>

            <!-- === LAYER 2: The Main Body === -->
            <g id="kimono-body">
                <!-- Base Shape -->
                <path d="M300,120 L500,120 L530,180 L550,450 L580,470 L560,530 L520,530 L500,950 L300,950 L280,530 L240,530 L220,470 L250,450 L270,180 Z" fill="url(#kimono-grad)" />
                
                <!-- Pattern Overlay -->
                <rect x="0" y="0" width="800" height="1000" fill="url(#dragon-pattern)" clip-path="url(#garment-clip)" style="mix-blend-mode: overlay;" />
                
                <!-- Fabric Texture -->
                <rect x="0" y="0" width="800" height="1000" filter="url(#noise)" clip-path="url(#garment-clip)" opacity="0.4" style="mix-blend-mode: overlay;" />
            </g>

            <!-- === LAYER 3: The Sleeves Pattern === -->
            <g opacity="0.8">
                <path d="M270,180 L100,180 L80,480 L130,500 L240,340 Z" fill="url(#dragon-pattern)" style="mix-blend-mode: overlay;" />
                <path d="M530,180 L700,180 L720,480 L670,500 L560,340 Z" fill="url(#dragon-pattern)" style="mix-blend-mode: overlay;" />
            </g>

            <!-- === LAYER 4: The Obi (Sash) === -->
            <!-- Volumetric Nagoya Obi -->
            <g id="obi-front">
                <!-- Main Band -->
                <path d="M250,500 L550,500 L555,590 L245,590 Z" fill="url(#obi-grad)" />
                
                <!-- Obi Pattern -->
                <rect x="240" y="500" width="320" height="90" fill="url(#dragon-pattern)" clip-path="url(#obi-clip)" opacity="0.8" />
                
                <!-- Folds on the band -->
                <path d="M250,505 L550,505" stroke="rgba(0,0,0,0.3)" stroke-width="2" />
                <path d="M245,585 L555,585" stroke="rgba(0,0,0,0.3)" stroke-width="2" />
            </g>

            <!-- === LAYER 5: The Knot (Taiko Drum) === -->
            <!-- Large, sculptural knot -->
            <g id="obi-knot" transform="translate(400, 545)">
                <!-- Back of the knot (tails) -->
                <path d="M-10,20 L-20,60 L0,70 L10,30 Z" fill="var(--obi-deep)" />
                <path d="M10,20 L20,60 L0,70 L-10,30 Z" fill="var(--obi-deep)" />

                <!-- The Drum Body (Center) -->
                <rect x="-70" y="-20" width="140" height="60" rx="8" fill="url(#knot-grad)" />
                
                <!-- Gold Embroidery on Knot -->
                <path d="M-60,10 L60,10" stroke="var(--gold)" stroke-width="3" />
                <path d="M-60,15 L60,15" stroke="var(--gold)" stroke-width="1" opacity="0.6" />
                <path d="M-60,5 L60,5" stroke="var(--gold)" stroke-width="1" opacity="0.6" />
                
                <!-- The Folded Ends (Omosode) - Left -->
                <path d="M-70,0 C-100,-20 -120,20 -100,40 C-80,50 -70,20 -70,0 Z" fill="url(#knot-grad)" stroke="var(--gold)" stroke-width="1" />
                <!-- The Folded Ends (Omosode) - Right -->
                <path d="M70,0 C100,-20 120,20 100,40 C80,50 70,20 70,0 Z" fill="url(#knot-grad)" stroke="var(--gold)" stroke-width="1" />
            </g>

            <!-- === LAYER 6: The Collar (Eri) === -->
            <!-- Crossed structure with visible white inner collar (Nagajuban) -->
            <g id="collar">
                <!-- Left Collar (Underneath) -->
                <!-- Inner White Layer -->
                <path d="M300,120 L270,180 L230,420 L250,420 L290,180 L320,120 Z" fill="#F2EFE3" />
                <!-- Outer Dark Edge -->
                <path d="M300,120 L270,180 L230,420 L235,420 L275,180 L305,120 Z" fill="var(--kimono-deep)" />

                <!-- Right Collar (Overlapping) -->
                <!-- Inner White Layer -->
                <path d="M500,120 L530,180 L570,420 L550,420 L510,180 L480,120 Z" fill="#FFFFFF" />
                <!-- Outer Dark Edge -->
                <path d="M500,120 L530,180 L570,420 L565,420 L525,180 L495,120 Z" fill="var(--kimono-deep)" />

                <!-- Shadows for depth where collars meet -->
                <path d="M300,120 L270,180 L230,420" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="5" filter="blur(4px)" />
            </g>

            <!-- === LAYER 7: Folds & Shadows === -->
            <g id="folds" opacity="0.6">
                <!-- Center Front Fold -->
                <path d="M400,590 L400,950" stroke="rgba(0,0,0,0.6)" stroke-width="5" filter="blur(3px)" />
                
                <!-- Side Folds radiating from Obi -->
                <path d="M280,590 Q260,770 290,950" stroke="rgba(0,0,0,0.5)" stroke-width="4" fill="none" filter="blur(2px)" />
                <path d="M520,590 Q540,770 510,950" stroke="rgba(0,0,0,0.5)" stroke-width="4" fill="none" filter="blur(2px)" />
                
                <!-- Underarm/Axilla Folds -->
                <path d="M240,340 Q250,450 240,530" stroke="rgba(0,0,0,0.4)" stroke-width="4" fill="none" />
                <path d="M560,340 Q550,450 560,530" stroke="rgba(0,0,0,0.4)" stroke-width="4" fill="none" />
            </g>

        </svg>
    </div>

    <script>
        // Subtle Parallax Effect
        document.addEventListener('mousemove', (e) => {
            const svg = document.querySelector('.kimono-svg');
            if(window.innerWidth > 1000) {
                const x = (window.innerWidth - e.pageX * 2) / 150;
                const y = (window.innerHeight - e.pageY * 2) / 150;
                svg.style.transform = `translateX(${x}px) translateY(${y}px)`;
            }
        });
    </script>
</body>
</html>
