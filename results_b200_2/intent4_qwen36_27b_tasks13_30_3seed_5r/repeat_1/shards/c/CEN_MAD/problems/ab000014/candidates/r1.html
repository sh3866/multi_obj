<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimono | Seiryu Collection</title>
    <style>
        :root {
            /* Palette: Deep Indigo, Silk Gold, Paper White */
            --bg-color: #F2F0E9; /* Washi paper tone */
            --kimono-deep: #0F2834;
            --kimono-mid: #1A4050;
            --kimono-light: #245A6E;
            --obi-deep: #681818;
            --obi-mid: #9E2A2A;
            --obi-light: #C24040;
            --gold: #D4AF37;
            --gold-dim: #AA8C2C;
            --text-main: #1A1A1A;
            --text-sub: #555555;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            /* Subtle paper grain texture */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Typography */
        h1 {
            font-family: "Georgia", serif;
            font-weight: 400;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-sub);
            margin-bottom: 1rem;
        }

        h2 {
            font-family: "Georgia", serif;
            font-size: 3.5rem;
            font-weight: 400;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            color: var(--kimono-deep);
            letter-spacing: -0.02em;
        }

        p {
            font-size: 1rem;
            line-height: 1.7;
            color: var(--text-sub);
            max-width: 320px;
            margin-bottom: 2rem;
        }

        .meta {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--gold-dim);
            font-weight: 600;
            border-top: 1px solid rgba(0,0,0,0.1);
            padding-top: 1rem;
            display: inline-block;
        }

        /* Layout */
        .showcase {
            display: grid;
            grid-template-columns: 1fr 1.4fr 1fr;
            width: 100%;
            height: 100%;
            max-width: 1800px;
            position: relative;
        }

        .left-panel {
            padding: 5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 2;
        }

        .center-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            /* Soft grounding shadow */
            box-shadow: inset 0 -100px 150px -50px rgba(0,0,0,0.1);
        }

        /* SVG Styling */
        svg.kimono-svg {
            height: 92vh;
            width: auto;
            /* Soft drop shadow for the garment itself */
            filter: drop-shadow(0px 30px 40px rgba(15, 40, 52, 0.25));
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: transform;
        }

        /* Responsive */
        @media (max-width: 1100px) {
            .showcase {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
                overflow-y: auto;
            }
            .left-panel { padding: 3rem; text-align: center; align-items: center; margin-top: 2rem;}
            .center-stage { height: 70vh; }
            h2 { font-size: 2.5rem; }
            svg.kimono-svg { height: 60vh; }
        }
    </style>
</head>
<body>

    <div class="showcase">
        <!-- Left Panel: Typography & Context -->
        <div class="left-panel">
            <h1>Collection 01</h1>
            <h2>Seiryu<br>Dragon Robe</h2>
            <p>
                A formal Houmongi featuring the mythological Azure Dragon.
                Constructed from heavy silk crepe with a <em>Nagoya</em> 
                obiage and a sculptural <em>Taiko</em> knot.
            </p>
            <div class="meta">
                Kyoto &nbsp;•&nbsp; 2024
            </div>
        </div>

        <!-- Center: The SVG Art -->
        <div class="center-stage">
            <svg class="kimono-svg" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- 1. Gradients for Fabric Volume -->
                    <linearGradient id="kimono-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:var(--kimono-deep)" />
                        <stop offset="50%" style="stop-color:var(--kimono-mid)" />
                        <stop offset="100%" style="stop-color:var(--kimono-deep)" />
                    </linearGradient>

                    <linearGradient id="silk-shine" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:rgba(255,255,255,0.0)" />
                        <stop offset="40%" style="stop-color:rgba(255,255,255,0.0)" />
                        <stop offset="50%" style="stop-color:rgba(255,255,255,0.15)" />
                        <stop offset="60%" style="stop-color:rgba(255,255,255,0.0)" />
                        <stop offset="100%" style="stop-color:rgba(255,255,255,0.0)" />
                    </linearGradient>

                    <linearGradient id="obi-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:var(--obi-light)" />
                        <stop offset="30%" style="stop-color:var(--obi-mid)" />
                        <stop offset="100%" style="stop-color:var(--obi-deep)" />
                    </linearGradient>

                    <linearGradient id="knot-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:var(--obi-light)" />
                        <stop offset="50%" style="stop-color:var(--obi-mid)" />
                        <stop offset="100%" style="stop-color:var(--obi-deep)" />
                    </linearGradient>

                    <!-- 2. The Pattern: Stylized Clouds & Waves (Seigaiha / Kumo) -->
                    <!-- Using Gold for high contrast against dark blue -->
                    <pattern id="dragon-pattern" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
                        <!-- Base Wave -->
                        <path d="M40 60 A20 20 0 0 1 80 60" fill="none" stroke="var(--gold)" stroke-width="1.5" opacity="0.6"/>
                        <path d="M0 60 A20 20 0 0 1 40 60" fill="none" stroke="var(--gold)" stroke-width="1.5" opacity="0.6"/>
                        <!-- Inner Detail -->
                        <path d="M40 50 A10 10 0 0 1 60 50" fill="none" stroke="var(--gold)" stroke-width="1" opacity="0.8"/>
                        <path d="M20 50 A10 10 0 0 1 40 50" fill="none" stroke="var(--gold)" stroke-width="1" opacity="0.8"/>
                        <!-- Cloud Motif Elements -->
                        <circle cx="40" cy="30" r="3" fill="var(--gold)" opacity="0.4"/>
                        <path d="M10 20 Q20 10 30 20" fill="none" stroke="var(--gold)" stroke-width="1" opacity="0.3"/>
                    </pattern>

                    <!-- 3. Filters for Texture -->
                    <filter id="texture">
                        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" />
                        <feColorMatrix type="saturate" values="0" />
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.1" />
                        </feComponentTransfer>
                        <feBlend in="SourceGraphic" mode="multiply" />
                    </filter>

                    <!-- Clip Paths for Anatomy -->
                    <clipPath id="body-clip">
                        <path d="M300,120 L500,120 L520,180 L540,400 L560,420 L550,480 L520,480 L500,950 L300,950 L280,480 L250,480 L240,420 L260,400 L280,180 Z" />
                    </clipPath>

                    <clipPath id="obi-clip">
                        <path d="M275,480 L525,480 L530,560 L270,560 Z" />
                    </clipPath>
                </defs>

                <!-- === LAYER 1: The Sleeves (Tate-sode) === -->
                <!-- T-Shaped, wide, distinct from body -->
                <g id="sleeves">
                    <!-- Left Sleeve -->
                    <path d="M280,180 L140,180 L120,420 L160,440 L260,300 Z" fill="url(#kimono-grad)" />
                    <!-- Right Sleeve -->
                    <path d="M520,180 L660,180 L680,420 L640,440 L540,300 Z" fill="url(#kimono-grad)" />
                </g>

                <!-- === LAYER 2: The Main Body === -->
                <g id="kimono-body">
                    <!-- Base Shape -->
                    <path d="M300,120 L500,120 L520,180 L540,400 L560,420 L550,480 L520,480 L500,950 L300,950 L280,480 L250,480 L240,420 L260,400 L280,180 Z" fill="url(#kimono-grad)" />
                    
                    <!-- Pattern Overlay -->
                    <rect x="0" y="0" width="800" height="1000" fill="url(#dragon-pattern)" clip-path="url(#body-clip)" style="mix-blend-mode: overlay;" />
                    
                    <!-- Silk Sheen Overlay -->
                    <rect x="0" y="0" width="800" height="1000" fill="url(#silk-shine)" clip-path="url(#body-clip)" />
                    
                    <!-- Fabric Texture -->
                    <rect x="0" y="0" width="800" height="1000" filter="url(#texture)" clip-path="url(#body-clip)" opacity="0.4" style="mix-blend-mode: overlay;" />
                </g>

                <!-- === LAYER 3: The Sleeves Pattern Overlay === -->
                <g opacity="0.8">
                    <path d="M280,180 L140,180 L120,420 L160,440 L260,300 Z" fill="url(#dragon-pattern)" style="mix-blend-mode: overlay;" />
                    <path d="M520,180 L660,180 L680,420 L640,440 L540,300 Z" fill="url(#dragon-pattern)" style="mix-blend-mode: overlay;" />
                </g>

                <!-- === LAYER 4: The Obi (Sash) === -->
                <!-- Volumetric Nagoya Obi -->
                <g id="obi-front">
                    <!-- Main Band -->
                    <path d="M275,480 L525,480 L530,560 L270,560 Z" fill="url(#obi-grad)" />
                    
                    <!-- Obi Pattern (Denser, Gold) -->
                    <rect x="270" y="480" width="260" height="80" fill="url(#dragon-pattern)" clip-path="url(#obi-clip)" opacity="0.9" />
                    
                    <!-- Folds on the band -->
                    <path d="M275,485 L525,485" stroke="rgba(0,0,0,0.3)" stroke-width="1" />
                    <path d="M272,555 L528,555" stroke="rgba(0,0,0,0.3)" stroke-width="1" />
                </g>

                <!-- === LAYER 5: The Knot (Taiko Drum) === -->
                <!-- Centered, volumetric, sitting on top of the obi -->
                <g id="obi-knot" transform="translate(400, 520)">
                    <!-- Back of the knot (tail) -->
                    <path d="M-20,10 L-30,40 L-10,50 L0,20 Z" fill="var(--obi-deep)" />
                    <path d="M20,10 L30,40 L10,50 L0,20 Z" fill="var(--obi-deep)" />

                    <!-- The Drum Body (Center) -->
                    <rect x="-50" y="-10" width="100" height="40" rx="5" fill="url(#knot-grad)" filter="drop-shadow(0px 5px 5px rgba(0,0,0,0.4))" />
                    
                    <!-- Gold Embroidery on Knot -->
                    <path d="M-40,10 L40,10" stroke="var(--gold)" stroke-width="2" />
                    <path d="M-40,15 L40,15" stroke="var(--gold)" stroke-width="1" opacity="0.6" />
                    
                    <!-- The Folded Ends (Omosode) - Left -->
                    <path d="M-50,0 C-80,-20 -100,10 -80,30 C-60,40 -50,10 -50,0 Z" fill="url(#knot-grad)" stroke="var(--gold)" stroke-width="0.5" />
                    <!-- The Folded Ends (Omosode) - Right -->
                    <path d="M50,0 C80,-20 100,10 80,30 C60,40 50,10 50,0 Z" fill="url(#knot-grad)" stroke="var(--gold)" stroke-width="0.5" />
                </g>

                <!-- === LAYER 6: The Collar (Eri) === -->
                <!-- Crossed structure with visible white inner collar -->
                <g id="collar">
                    <!-- Left Collar (Underneath) -->
                    <path d="M300,120 L280,180 L240,400 L260,400 L300,180 L320,120 Z" fill="#EAE6D8" />
                    <!-- Left Fabric Edge (Dark) -->
                    <path d="M300,120 L280,180 L240,400 L245,400 L285,180 L305,120 Z" fill="var(--kimono-deep)" />

                    <!-- Right Collar (Overlapping) -->
                    <path d="M500,120 L520,180 L560,400 L540,400 L500,180 L480,120 Z" fill="#F2EFE3" />
                    <!-- Right Fabric Edge (Dark) -->
                    <path d="M500,120 L520,180 L560,400 L555,400 L515,180 L495,120 Z" fill="var(--kimono-deep)" />

                    <!-- Shadows for depth where collars meet -->
                    <path d="M300,120 L280,180 L240,400" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="4" filter="blur(2px)" />
                </g>

                <!-- === LAYER 7: Folds & Shadows (Vector Craft) === -->
                <!-- These simulate gravity and fabric weight -->
                <g id="folds" opacity="0.6">
                    <!-- Center Front Fold -->
                    <path d="M400,560 L400,950" stroke="rgba(0,0,0,0.5)" stroke-width="3" filter="blur(1px)" />
                    
                    <!-- Side Folds radiating from Obi -->
                    <path d="M300,560 Q290,700 310,950" stroke="rgba(0,0,0,0.4)" stroke-width="2" fill="none" />
                    <path d="M500,560 Q510,700 490,950" stroke="rgba(0,0,0,0.4)" stroke-width="2" fill="none" />
                    
                    <!-- Underarm/Axilla Folds -->
                    <path d="M260,300 Q270,400 260,500" stroke="rgba(0,0,0,0.3)" stroke-width="2" fill="none" />
                    <path d="M540,300 Q530,400 540,500" stroke="rgba(0,0,0,0.3)" stroke-width="2" fill="none" />
                </g>

            </svg>
        </div>

        <!-- Right Panel: Cleaned up, empty space -->
        <div class="right-panel">
            <!-- Deliberately left empty to restore negative space as per critique -->
        </div>
    </div>

    <script>
        // Subtle Parallax Effect on Mouse Move
        // Adds a feeling of weight and presence to the garment
        document.addEventListener('mousemove', (e) => {
            const svg = document.querySelector('.kimono-svg');
            const x = (window.innerWidth - e.pageX * 2) / 150; // Reduced sensitivity
            const y = (window.innerHeight - e.pageY * 2) / 150;

            // Apply subtle movement
            svg.style.transform = `translateX(${x}px) translateY(${y}px)`;
        });
    </script>
</body>
</html>
