<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimono | The Art of the Robe</title>
    <style>
        :root {
            --bg-color: #EAE6D8;
            --bg-texture: #E3DEC9;
            --kimono-primary: #1C3A47;
            --kimono-dark: #0F232A;
            --kimono-light: #2A5362;
            --obi-color: #8C3B3B;
            --obi-dark: #5E2525;
            --gold: #D4AF37;
            --text-main: #2B2B2B;
            --text-sub: #5A5A5A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            /* Subtle noise texture via CSS */
            background-image: radial-gradient(var(--bg-texture) 1px, transparent 0);
            background-size: 20px 20px;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Typography */
        h1 {
            font-family: "Georgia", "Times New Roman", serif;
            font-weight: normal;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        h2 {
            font-family: "Georgia", serif;
            font-size: 3rem;
            font-weight: 400;
            line-height: 1;
            margin-bottom: 2rem;
            color: var(--kimono-primary);
        }

        p {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text-sub);
            max-width: 300px;
        }

        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 0.3em;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-left: 2rem;
            height: 300px;
            border-left: 1px solid rgba(0,0,0,0.1);
            padding-left: 1rem;
        }

        /* Layout */
        .showcase {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            width: 100%;
            height: 100%;
            max-width: 1600px;
            position: relative;
        }

        .left-panel {
            padding: 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 2;
        }

        .center-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 4rem;
            align-items: flex-end;
        }

        /* SVG Styling */
        svg.kimono-svg {
            height: 90vh;
            width: auto;
            filter: drop-shadow(0px 20px 30px rgba(0,0,0,0.15));
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Subtle Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        /* Details */
        .stamp {
            width: 60px;
            height: 60px;
            border: 2px solid var(--obi-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--obi-color);
            font-family: serif;
            font-size: 1.5rem;
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .meta {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-top: auto;
            color: var(--text-sub);
        }

        /* Responsive */
        @media (max-width: 1000px) {
            .showcase {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
                overflow-y: auto;
            }
            .left-panel { padding: 2rem; text-align: center; align-items: center; }
            .right-panel { display: none; }
            h2 { font-size: 2.5rem; }
            svg.kimono-svg { height: 60vh; }
        }
    </style>
</head>
<body>

    <div class="showcase">
        <!-- Left Panel: Typography & Context -->
        <div class="left-panel">
            <div class="stamp">
                着
            </div>
            <h1>Collection 01</h1>
            <h2>The Indigo<br>Silk Robe</h2>
            <p>
                A study in negative space and structural elegance. 
                Featuring the traditional <em>Seiryu</em> pattern and 
                hand-tied <em>Nagoya</em> obi.
            </p>
            <div class="meta">
                Est. 2024 &nbsp;|&nbsp; Kyoto
            </div>
        </div>

        <!-- Center: The SVG Art -->
        <div class="center-stage">
            <!-- The SVG is defined here inline -->
            <svg class="kimono-svg animate-float" viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Fabric Texture Noise -->
                    <filter id="fabric-noise">
                        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
                        <feColorMatrix type="saturate" values="0" />
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.15" />
                        </feComponentTransfer>
                        <feBlend in="SourceGraphic" mode="multiply" />
                    </filter>

                    <!-- Gradients for Depth -->
                    <linearGradient id="silk-shine" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:rgba(255,255,255,0.05)" />
                        <stop offset="50%" style="stop-color:rgba(255,255,255,0.2)" />
                        <stop offset="100%" style="stop-color:rgba(255,255,255,0.05)" />
                    </linearGradient>

                    <linearGradient id="obi-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#9E4444" />
                        <stop offset="20%" style="stop-color:#8C3B3B" />
                        <stop offset="80%" style="stop-color:#7A3131" />
                        <stop offset="100%" style="stop-color:#5E2525" />
                    </linearGradient>

                    <!-- The Pattern: Stylized Wave/Water (Seigaiha variation) -->
                    <pattern id="seigaiha" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                        <circle cx="30" cy="30" r="28" fill="none" stroke="#2A5362" stroke-width="2" opacity="0.6"/>
                        <circle cx="30" cy="30" r="20" fill="none" stroke="#2A5362" stroke-width="1" opacity="0.4"/>
                        <path d="M30 2 A28 28 0 0 1 58 30" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.8"/>
                    </pattern>

                    <!-- Pattern 2: Small geometric for Obi -->
                    <pattern id="obi-pattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                        <path d="M10 0 L20 10 L10 20 L0 10 Z" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.5"/>
                        <circle cx="10" cy="10" r="2" fill="#D4AF37" opacity="0.3"/>
                    </pattern>

                    <!-- Clip Path for the Kimono Body to apply pattern cleanly -->
                    <clipPath id="kimono-body-clip">
                        <path d="M250,50 
                                 L350,50 
                                 L380,100 
                                 L420,250 
                                 L450,280 
                                 L440,320 
                                 L380,280 
                                 L360,850 
                                 L240,850 
                                 L220,280 
                                 L160,320 
                                 L150,280 
                                 L180,250 
                                 L220,100 Z" />
                    </clipPath>
                </defs>

                <!-- 1. The Sleeves (Tate-sode) - Drawn first to sit behind -->
                <g id="sleeves" fill="var(--kimono-primary)">
                    <!-- Left Sleeve -->
                    <path d="M220,100 L120,100 L100,350 L220,250 Z" fill="var(--kimono-primary)" />
                    <!-- Right Sleeve -->
                    <path d="M380,100 L480,100 L500,350 L380,250 Z" fill="var(--kimono-primary)" />
                </g>

                <!-- Apply Pattern to Sleeves -->
                <g clip-path="url(#kimono-body-clip)">
                     <!-- This trick applies pattern to the main body, we manually apply to sleeves -->
                </g>
                
                <!-- Sleeve Patterns (Rotated slightly for drape effect) -->
                <g opacity="0.8">
                    <path d="M220,100 L120,100 L100,350 L220,250 Z" fill="url(#seigaiha)" style="mix-blend-mode: overlay;" />
                    <path d="M380,100 L480,100 L500,350 L380,250 Z" fill="url(#seigaiha)" style="mix-blend-mode: overlay;" />
                </g>

                <!-- 2. Main Body -->
                <path d="M250,50 
                         L350,50 
                         L380,100 
                         L420,250 
                         L450,280 
                         L440,320 
                         L380,280 
                         L360,850 
                         L240,850 
                         L220,280 
                         L160,320 
                         L150,280 
                         L180,250 
                         L220,100 Z" 
                      fill="var(--kimono-primary)" />

                <!-- Apply Pattern to Body -->
                <rect x="100" y="0" width="400" height="900" fill="url(#seigaiha)" clip-path="url(#kimono-body-clip)" opacity="0.7" style="mix-blend-mode: soft-light;" />
                
                <!-- Fabric Texture Overlay -->
                <rect x="100" y="0" width="400" height="900" filter="url(#fabric-noise)" clip-path="url(#kimono-body-clip)" opacity="0.3" style="mix-blend-mode: overlay;" />

                <!-- 3. The Collar (Eri) -->
                <g id="collar">
                    <!-- Left Collar -->
                    <path d="M250,50 L220,100 L180,250 L200,250 L240,100 L270,50 Z" fill="#EAE6D8" stroke="#D4D0B8" stroke-width="1"/>
                    <!-- Right Collar (Sits on top) -->
                    <path d="M350,50 L380,100 L420,250 L400,250 L360,100 L330,50 Z" fill="#F2EFE3" stroke="#D4D0B8" stroke-width="1"/>
                    
                    <!-- Collar Shadow/Depth -->
                    <path d="M260,55 L240,100 L200,240 L210,240 L250,100 L275,55 Z" fill="rgba(0,0,0,0.1)" />
                    <path d="M340,55 L360,100 L400,240 L390,240 L350,100 L325,55 Z" fill="rgba(0,0,0,0.05)" />
                </g>

                <!-- 4. The Obi (Sash) -->
                <g id="obi">
                    <!-- Main Obi Band -->
                    <path d="M215,400 L385,400 L390,520 L210,520 Z" fill="url(#obi-gradient)" />
                    
                    <!-- Obi Pattern -->
                    <rect x="210" y="400" width="180" height="120" fill="url(#obi-pattern)" />
                    
                    <!-- Obi Folds/Texture Lines -->
                    <path d="M215,405 L385,405" stroke="#5E2525" stroke-width="1" opacity="0.5"/>
                    <path d="M212,415 L388,415" stroke="#5E2525" stroke-width="1" opacity="0.3"/>
                    <path d="M210,425 L390,425" stroke="#5E2525" stroke-width="1" opacity="0.3"/>
                    <path d="M210,515 L390,515" stroke="#5E2525" stroke-width="1" opacity="0.5"/>

                    <!-- Obi Knot (Tsu-Can / Butterfly style simplified) -->
                    <g transform="translate(300, 460)">
                        <!-- Center Knot -->
                        <path d="M-15,-10 L15,-10 L20,10 L-20,10 Z" fill="var(--obi-dark)" />
                        <!-- Left Wing -->
                        <path d="M-15,0 C-40,-20 -60,10 -30,30 C-20,35 -15,10 -15,0 Z" fill="var(--obi-color)" stroke="#D4AF37" stroke-width="0.5"/>
                        <!-- Right Wing -->
                        <path d="M15,0 C40,-20 60,10 30,30 C20,35 15,10 15,0 Z" fill="var(--obi-color)" stroke="#D4AF37" stroke-width="0.5"/>
                        
                        <!-- Gold detail on knot -->
                        <path d="M-10,0 L10,0" stroke="#D4AF37" stroke-width="2" />
                    </g>
                </g>

                <!-- 5. Folds & Shadows (The "Senior" Touch) -->
                <g id="folds" opacity="0.4">
                    <!-- Center fold -->
                    <path d="M300,520 L300,850" stroke="black" stroke-width="2" filter="blur(1px)" />
                    <!-- Side folds radiating from Obi -->
                    <path d="M240,520 Q230,650 250,850" stroke="black" stroke-width="1" fill="none" />
                    <path d="M360,520 Q370,650 350,850" stroke="black" stroke-width="1" fill="none" />
                    <!-- Underarm folds -->
                    <path d="M220,300 Q230,400 220,500" stroke="black" stroke-width="1.5" fill="none" />
                    <path d="M380,300 Q370,400 380,500" stroke="black" stroke-width="1.5" fill="none" />
                </g>

                <!-- 6. Highlights -->
                <path d="M220,100 L250,50 L350,50 L380,100" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
                
            </svg>
        </div>

        <!-- Right Panel: Details & Specs -->
        <div class="right-panel">
            <div class="vertical-text">
                Woven Silk &bull; Hand Dyed &bull; 12 Meters
            </div>
            <div style="margin-top: 2rem; text-align: right;">
                <h3 style="font-family: serif; font-size: 1.5rem; color: var(--kimono-primary);">Houmongi</h3>
                <p style="text-align: right; margin-top: 0.5rem;">
                    Formal evening wear.<br>
                    Pattern extends over the hem.
                </p>
            </div>
        </div>
    </div>

    <script>
        // Subtle Parallax Effect on Mouse Move
        document.addEventListener('mousemove', (e) => {
            const svg = document.querySelector('.kimono-svg');
            const x = (window.innerWidth - e.pageX * 2) / 100;
            const y = (window.innerHeight - e.pageY * 2) / 100;

            // Apply subtle movement
            svg.style.transform = `translateX(${x}px) translateY(${y}px)`;
        });
    </script>
</body>
</html>
