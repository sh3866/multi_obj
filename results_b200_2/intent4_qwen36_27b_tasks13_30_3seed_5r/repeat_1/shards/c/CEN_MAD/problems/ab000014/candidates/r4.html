<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seiryu | Azure Dragon Kimono</title>
    <style>
        :root {
            /* Palette: Deep Indigo, Silk Gold, Vermilion, Cream */
            --bg-dark: #050507;
            --bg-light: #111318;
            
            /* Kimono Colors (Indigo/Teal) */
            --silk-base: #002b38;
            --silk-light: #004e61;
            --silk-shadow: #001820;
            
            /* Obi Colors (Vermilion/Gold) */
            --obi-base: #681818;
            --obi-light: #9e2a2a;
            --obi-shadow: #3a0a0a;
            
            /* Accents */
            --gold: #d4af37;
            --gold-dim: #8a7020;
            --cream: #f0f0f0;
            
            /* Typography */
            --font-serif: "Georgia", "Times New Roman", serif;
            --font-sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at 50% 30%, var(--bg-light), var(--bg-dark));
            color: var(--cream);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: var(--font-sans);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Layout Container */
        .showcase-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* SVG Container */
        .garment-stage {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        svg.kimono-svg {
            height: 96vh;
            width: auto;
            max-width: 90vw;
            /* Soft ambient shadow behind the garment */
            filter: drop-shadow(0px 15px 35px rgba(0, 0, 0, 0.6));
            will-change: transform;
            transition: transform 0.15s ease-out;
        }

        /* Typography & Hierarchy */
        .text-overlay {
            position: absolute;
            bottom: 5vh;
            left: 5vw;
            z-index: 10;
            max-width: 320px;
            pointer-events: none; /* Let clicks pass through */
        }

        .label-top {
            font-family: var(--font-sans);
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 0.8rem;
            display: block;
            opacity: 0.9;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 3.5rem;
            font-weight: 400;
            line-height: 1;
            color: var(--cream);
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        h1 span {
            display: block;
            font-size: 1.2rem;
            color: var(--obi-light);
            margin-top: 0.5rem;
            font-weight: 300;
            font-style: italic;
        }

        .description {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #a0a0a0;
            font-weight: 300;
            border-left: 1px solid var(--obi-base);
            padding-left: 1rem;
            margin-top: 1.5rem;
        }

        .meta-data {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #555;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            display: flex;
            gap: 1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .text-overlay {
                bottom: 2vh;
                left: 5vw;
                right: 5vw;
            }
            .description { display: none; } /* Hide description on small screens */
        }
    </style>
</head>
<body>

    <div class="showcase-container">
        
        <div class="garment-stage">
            <svg class="kimono-svg" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- 1. Fabric Gradients (Silk Sheen) -->
                    <linearGradient id="silk-body" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="var(--silk-shadow)" />
                        <stop offset="20%" stop-color="var(--silk-base)" />
                        <stop offset="50%" stop-color="var(--silk-light)" /> <!-- Highlight -->
                        <stop offset="80%" stop-color="var(--silk-base)" />
                        <stop offset="100%" stop-color="var(--silk-shadow)" />
                    </linearGradient>

                    <linearGradient id="sleeve-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="var(--silk-base)" />
                        <stop offset="50%" stop-color="var(--silk-light)" />
                        <stop offset="100%" stop-color="var(--silk-shadow)" />
                    </linearGradient>

                    <!-- 2. Obi Gradients (Rich Velvet/Silk) -->
                    <linearGradient id="obi-band" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="var(--obi-light)" />
                        <stop offset="40%" stop-color="var(--obi-base)" />
                        <stop offset="100%" stop-color="var(--obi-shadow)" />
                    </linearGradient>

                    <radialGradient id="knot-center" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                        <stop offset="0%" stop-color="var(--obi-light)" />
                        <stop offset="60%" stop-color="var(--obi-base)" />
                        <stop offset="100%" stop-color="#2a0505" />
                    </radialGradient>

                    <!-- 3. Filters -->
                    <!-- Soft Shadow for 3D Depth -->
                    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
                    </filter>

                    <!-- 4. Patterns (Seiryu / Dragon) -->
                    <!-- Pattern is clipped later to follow garment volume -->
                    <pattern id="dragon-motif" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse" patternTransform="rotate(10)">
                        <!-- Stylized Dragon Scale -->
                        <path d="M50 20 Q65 35 50 50 Q35 35 50 20" fill="none" stroke="var(--gold)" stroke-width="1.5" opacity="0.6"/>
                        <path d="M50 40 Q65 55 50 70 Q35 55 50 40" fill="none" stroke="var(--gold)" stroke-width="1.5" opacity="0.6"/>
                        <!-- Clouds (Kumo) -->
                        <path d="M10 80 Q25 70 40 80 T70 80" fill="none" stroke="var(--gold)" stroke-width="2" opacity="0.5"/>
                        <circle cx="50" cy="50" r="1.5" fill="var(--gold)" opacity="0.8"/>
                    </pattern>

                    <!-- 5. Clip Paths for Organic Shapes -->
                    <!-- Main Body Silhouette -->
                    <clipPath id="body-clip">
                        <path d="M 280,100 
                                 C 380,100 420,100 520,100 
                                 L 540,160 
                                 C 545,250 550,400 560,450 
                                 L 600,480 
                                 L 580,540 
                                 L 540,540 
                                 C 530,700 510,900 500,980 
                                 L 300,980 
                                 C 290,900 270,700 260,540 
                                 L 220,540 
                                 L 200,480 
                                 L 240,450 
                                 C 250,400 255,250 260,160 Z" />
                    </clipPath>

                    <!-- Sleeve Clip -->
                    <clipPath id="sleeve-clip">
                        <path d="M 260,160 
                                 C 200,160 100,180 50,250 
                                 L 60,550 
                                 C 120,560 200,540 240,460 
                                 L 260,300 Z" />
                    </clipPath>
                    
                    <!-- Mirror Sleeve Clip -->
                    <clipPath id="sleeve-clip-right">
                        <path d="M 540,160 
                                 C 600,160 700,180 750,250 
                                 L 740,550 
                                 C 680,560 600,540 560,460 
                                 L 540,300 Z" />
                    </clipPath>
                </defs>

                <!-- === LAYER 1: Sleeves (Tate-sode) === -->
                <g id="sleeves" filter="url(#soft-shadow)">
                    <!-- Left Sleeve -->
                    <g clip-path="url(#sleeve-clip)">
                        <rect x="0" y="100" width="300" height="600" fill="url(#sleeve-grad)" />
                        <rect x="0" y="100" width="300" height="600" fill="url(#dragon-motif)" opacity="0.7" style="mix-blend-mode: overlay;" />
                    </g>
                    <!-- Right Sleeve -->
                    <g clip-path="url(#sleeve-clip-right)">
                        <rect x="500" y="100" width="300" height="600" fill="url(#sleeve-grad)" />
                        <rect x="500" y="100" width="300" height="600" fill="url(#dragon-motif)" opacity="0.7" style="mix-blend-mode: overlay;" />
                    </g>
                </g>

                <!-- === LAYER 2: Main Body === -->
                <g id="kimono-body" filter="url(#soft-shadow)">
                    <!-- Base Shape -->
                    <path d="M 280,100 
                             C 380,100 420,100 520,100 
                             L 540,160 
                             C 545,250 550,400 560,450 
                             L 600,480 
                             L 580,540 
                             L 540,540 
                             C 530,700 510,900 500,980 
                             L 300,980 
                             C 290,900 270,700 260,540 
                             L 220,540 
                             L 200,480 
                             L 240,450 
                             C 250,400 255,250 260,160 Z" 
                          fill="url(#silk-body)" />
                    
                    <!-- Pattern Overlay (Clipped to body shape) -->
                    <rect x="0" y="0" width="800" height="1000" fill="url(#dragon-motif)" clip-path="url(#body-clip)" opacity="0.8" style="mix-blend-mode: soft-light;" />
                </g>

                <!-- === LAYER 3: Collar (Eri) === -->
                <!-- Using thin strokes and delicate curves for the 'Eri' (collar) -->
                <g id="collar">
                    <!-- Left Collar (Under) -->
                    <path d="M 280,100 C 260,140 250,200 240,280" fill="none" stroke="#E0E0E0" stroke-width="14" stroke-linecap="round" />
                    <path d="M 280,100 C 260,140 250,200 240,280" fill="none" stroke="var(--silk-base)" stroke-width="12" stroke-linecap="round" opacity="0.9" />
                    
                    <!-- Right Collar (Over) - Creates the V-shape -->
                    <path d="M 520,100 C 540,140 550,200 560,280" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
                    <path d="M 520,100 C 540,140 550,200 560,280" fill="none" stroke="var(--silk-base)" stroke-width="12" stroke-linecap="round" opacity="0.9" />
                    
                    <!-- Inner shadow on the V-neck -->
                    <path d="M 400,100 L 400,140" fill="none" stroke="#000" stroke-width="20" opacity="0.3" filter="blur(4px)" />
                </g>

                <!-- === LAYER 4: Obi Band (Front) === -->
                <g id="obi-band" filter="url(#soft-shadow)">
                    <!-- The band wraps around -->
                    <path d="M 245,500 L 555,500 L 565,600 L 235,600 Z" fill="url(#obi-band)" />
                    <!-- Gold trim top and bottom -->
                    <path d="M 245,500 L 555,500" fill="none" stroke="var(--gold)" stroke-width="2" />
                    <path d="M 235,600 L 565,600" fill="none" stroke="var(--gold)" stroke-width="2" />
                    
                    <!-- Obi Pattern -->
                    <path d="M 245,500 L 555,500 L 565,600 L 235,600 Z" fill="url(#dragon-motif)" opacity="0.5" style="mix-blend-mode: overlay;" />
                </g>

                <!-- === LAYER 5: Obi Knot (Taiko Drum) === -->
                <!-- Sculptural 3D effect -->
                <g id="obi-knot" transform="translate(400, 550)" filter="url(#soft-shadow)">
                    <!-- Back tails -->
                    <path d="M -10,30 L -15,80 L 0,90 L 15,30 Z" fill="var(--obi-shadow)" />
                    
                    <!-- Main Drum Body -->
                    <rect x="-90" y="-20" width="180" height="80" rx="12" fill="url(#knot-center)" stroke="var(--gold)" stroke-width="1" />
                    
                    <!-- Gold Cord Wrapping (The "Maki-obi" look) -->
                    <path d="M -80,-10 L -80,30" stroke="var(--gold)" stroke-width="3" opacity="0.8" />
                    <path d="M -60,-10 L -60,30" stroke="var(--gold)" stroke-width="3" opacity="0.8" />
                    <path d="M -40,-10 L -40,30" stroke="var(--gold)" stroke-width="3" opacity="0.8" />
                    <path d="M -20,-10 L -20,30" stroke="var(--gold)" stroke-width="3" opacity="0.8" />
                    <path d="M 0,-10 L 0,30" stroke="var(--gold)" stroke-width="3" opacity="0.8" />
                    <path d="M 20,-10 L 20,30" stroke="var(--gold)" stroke-width="3" opacity="0.8" />
                    <path d="M 40,-10 L 40,30" stroke="var(--gold)" stroke-width="3" opacity="0.8" />
                    <path d="M 60,-10 L 60,30" stroke="var(--gold)" stroke-width="3" opacity="0.8" />
                    <path d="M 80,-10 L 80,30" stroke="var(--gold)" stroke-width="3" opacity="0.8" />
                    
                    <!-- Omosode (Folded ends) - Left -->
                    <path d="M -90,0 C -140,-30 -160,20 -130,50 C -100,60 -80,20 -80,0 Z" fill="url(#knot-center)" stroke="var(--gold)" stroke-width="1" />
                    <!-- Omosode - Right -->
                    <path d="M 90,0 C 140,-30 160,20 130,50 C 100,60 80,20 80,0 Z" fill="url(#knot-center)" stroke="var(--gold)" stroke-width="1" />
                </g>

                <!-- === LAYER 6: Shadows & Folds === -->
                <!-- Adding depth to the fabric -->
                <g id="fabric-shadows" opacity="0.5">
                    <!-- Center vertical fold -->
                    <path d="M 400,600 L 400,980" stroke="#000" stroke-width="12" filter="blur(8px)" />
                    
                    <!-- Side folds radiating from obi -->
                    <path d="M 280,600 Q 270,800 300,980" stroke="#000" stroke-width="10" fill="none" filter="blur(6px)" />
                    <path d="M 520,600 Q 530,800 500,980" stroke="#000" stroke-width="10" fill="none" filter="blur(6px)" />
                </g>

            </svg>
        </div>

        <div class="text-overlay">
            <span class="label-top">Houmongi Collection • 2024</span>
            <h1>
                Seiryu
                <span>The Azure Dragon Robe</span>
            </h1>
            <p class="description">
                A masterpiece of formal wear featuring the mythological Azure Dragon. 
                Woven from heavy silk crepe with a sculptural <em>Taiko</em> knot 
                and <em>Nagoya</em> style obi.
            </p>
            <div class="meta-data">
                <span>Kyoto</span>
                <span>•</span>
                <span>Indigo</span>
                <span>•</span>
                <span>Silk</span>
            </div>
        </div>

    </div>

    <script>
        // Subtle Parallax Effect for "Life"
        document.addEventListener('mousemove', (e) => {
            const svg = document.querySelector('.kimono-svg');
            if(window.innerWidth > 768) { // Only on desktop
                const x = (window.innerWidth - e.pageX * 2) / 120;
                const y = (window.innerHeight - e.pageY * 2) / 120;
                svg.style.transform = `translateX(${x}px) translateY(${y}px)`;
            }
        });
    </script>
</body>
</html>
