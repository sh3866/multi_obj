<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimono | Seiryu Collection</title>
    <style>
        :root {
            /* Palette: Deep Indigo, Silk Gold, Paper White */
            --bg-color: #F4F2E9; /* Washi paper tone */
            --kimono-deep: #05101A; /* Richer, darker indigo */
            --kimono-mid: #0A2438;
            --kimono-light: #123A55;
            --obi-deep: #4A0E0E; /* Deeper red for contrast */
            --obi-mid: #7A1C1C;
            --obi-light: #A82D2D;
            --gold: #D4AF37;
            --gold-dim: #8A7020;
            --text-main: #1A1A1A;
            --text-sub: #4A4A4A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            /* Subtle paper grain texture */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Typography */
        h1 {
            font-family: "Georgia", serif;
            font-weight: 400;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-sub);
            margin-bottom: 0.5rem;
        }

        h2 {
            font-family: "Georgia", serif;
            font-size: 3.2rem;
            font-weight: 400;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            color: var(--kimono-deep);
            letter-spacing: -0.02em;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-sub);
            max-width: 280px;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .meta {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--gold-dim);
            font-weight: 600;
            border-top: 1px solid rgba(0,0,0,0.1);
            padding-top: 0.8rem;
            display: inline-block;
        }

        /* Layout */
        .showcase {
            display: grid;
            grid-template-columns: 1fr 1.4fr 1fr;
            width: 100%;
            height: 100%;
            max-width: 1800px;
            position: relative;
        }

        .left-panel {
            padding: 4rem 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 2;
        }

        .center-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        /* SVG Styling */
        svg.kimono-svg {
            height: 96vh;
            width: auto;
            /* Softer, larger drop shadow for grounding */
            filter: drop-shadow(0px 40px 60px rgba(5, 16, 26, 0.3));
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: transform;
        }

        /* Responsive */
        @media (max-width: 1100px) {
            .showcase {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
                overflow-y: auto;
            }
            .left-panel { padding: 2rem; text-align: center; align-items: center; margin-top: 2rem;}
            .center-stage { height: 60vh; }
            h2 { font-size: 2.5rem; }
            svg.kimono-svg { height: 55vh; }
        }
    </style>
</head>
<body>

    <div class="showcase">
        <!-- Left Panel: Typography & Context -->
        <div class="left-panel">
            <h1>Collection 01</h1>
            <h2>Seiryu<br>Dragon Robe</h2>
            <p>
                A formal Houmongi featuring the mythological Azure Dragon.
                Constructed from heavy silk crepe with a <em>Nagoya</em> 
                obiage and a sculptural <em>Taiko</em> knot.
            </p>
            <div class="meta">
                Kyoto &nbsp;•&nbsp; 2024
            </div>
        </div>

        <!-- Center: The SVG Art -->
        <div class="center-stage">
            <!-- viewBox adjusted to accommodate full length and sleeves -->
            <svg class="kimono-svg" viewBox="0 0 900 1100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- 1. Gradients for Fabric Volume -->
                    <!-- Deeper, more luminous indigo -->
                    <linearGradient id="kimono-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:var(--kimono-deep)" />
                        <stop offset="20%" style="stop-color:var(--kimono-mid)" />
                        <stop offset="50%" style="stop-color:var(--kimono-light)" /> <!-- Highlight center -->
                        <stop offset="80%" style="stop-color:var(--kimono-mid)" />
                        <stop offset="100%" style="stop-color:var(--kimono-deep)" />
                    </linearGradient>

                    <linearGradient id="silk-shine" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:rgba(255,255,255,0.0)" />
                        <stop offset="45%" style="stop-color:rgba(255,255,255,0.0)" />
                        <stop offset="50%" style="stop-color:rgba(255,255,255,0.12)" /> <!-- Sheen -->
                        <stop offset="55%" style="stop-color:rgba(255,255,255,0.0)" />
                        <stop offset="100%" style="stop-color:rgba(255,255,255,0.0)" />
                    </linearGradient>

                    <!-- Obi Gradient -->
                    <linearGradient id="obi-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:var(--obi-light)" />
                        <stop offset="40%" style="stop-color:var(--obi-mid)" />
                        <stop offset="100%" style="stop-color:var(--obi-deep)" />
                    </linearGradient>

                    <!-- Knot Gradient for 3D effect -->
                    <linearGradient id="knot-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:var(--obi-light)" />
                        <stop offset="50%" style="stop-color:var(--obi-mid)" />
                        <stop offset="100%" style="stop-color:var(--obi-deep)" />
                    </linearGradient>

                    <!-- 2. The Pattern: Azure Dragon & Clouds (Seiryu / Kumo) -->
                    <!-- High contrast Gold on Dark -->
                    <pattern id="dragon-pattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse" patternTransform="rotate(10)">
                        <!-- Stylized Dragon Scale/Cloud Motif -->
                        <path d="M50 20 C60 20 70 30 70 40 C70 50 60 60 50 60 C40 60 30 50 30 40 C30 30 40 20 50 20 Z" fill="none" stroke="var(--gold)" stroke-width="1.5" opacity="0.8"/>
                        <path d="M50 30 C55 30 60 35 60 40 C60 45 55 50 50 50 C45 50 40 45 40 40 C40 35 45 30 50 30 Z" fill="var(--gold)" opacity="0.6"/>
                        <!-- Stylized Clouds -->
                        <path d="M10 80 Q20 70 30 80 T50 80" fill="none" stroke="var(--gold)" stroke-width="1" opacity="0.5"/>
                        <path d="M80 90 Q90 80 100 90" fill="none" stroke="var(--gold)" stroke-width="1" opacity="0.5"/>
                        <!-- Small details -->
                        <circle cx="50" cy="40" r="1.5" fill="var(--gold)" opacity="0.9"/>
                    </pattern>

                    <!-- 3. Filters for Texture -->
                    <filter id="texture">
                        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
                        <feColorMatrix type="saturate" values="0" />
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.12" />
                        </feComponentTransfer>
                        <feBlend in="SourceGraphic" mode="multiply" />
                    </filter>
                    
                    <!-- Atmospheric Backdrop Gradient -->
                    <radialGradient id="atmosphere" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#FFFFFF; stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#F4F2E9; stop-opacity:0" />
                    </radialGradient>

                    <!-- Clip Paths for Anatomy -->
                    <clipPath id="body-clip">
                        <!-- Continuous floor-length path -->
                        <path d="M320,100 L480,100 L510,160 L530,400 L560,420 L550,490 L520,490 L500,1050 L300,1050 L280,490 L250,490 L240,420 L270,400 L290,160 Z" />
                    </clipPath>

                    <clipPath id="obi-clip">
                        <path d="M270,490 L530,490 L535,570 L265,570 Z" />
                    </clipPath>
                </defs>

                <!-- === BACKGROUND ELEMENT === -->
                <!-- High contrast circular backdrop -->
                <circle cx="450" cy="550" r="400" fill="url(#atmosphere)" />

                <!-- === LAYER 1: The Sleeves (Tate-sode) === -->
                <!-- T-Shaped, wide, extending seamlessly from shoulder -->
                <g id="sleeves">
                    <!-- Left Sleeve -->
                    <path d="M290,160 L140,160 L120,440 L160,460 L260,320 Z" fill="url(#kimono-grad)" />
                    <!-- Right Sleeve -->
                    <path d="M510,160 L660,160 L680,440 L640,460 L540,320 Z" fill="url(#kimono-grad)" />
                </g>

                <!-- === LAYER 2: The Main Body === -->
                <g id="kimono-body">
                    <!-- Base Shape (Floor Length) -->
                    <path d="M320,100 L480,100 L510,160 L530,400 L560,420 L550,490 L520,490 L500,1050 L300,1050 L280,490 L250,490 L240,420 L270,400 L290,160 Z" fill="url(#kimono-grad)" />
                    
                    <!-- Pattern Overlay (Dragon/Clouds) -->
                    <rect x="0" y="0" width="900" height="1100" fill="url(#dragon-pattern)" clip-path="url(#body-clip)" style="mix-blend-mode: overlay;" />
                    
                    <!-- Silk Sheen Overlay -->
                    <rect x="0" y="0" width="900" height="1100" fill="url(#silk-shine)" clip-path="url(#body-clip)" />
                    
                    <!-- Fabric Texture -->
                    <rect x="0" y="0" width="900" height="1100" filter="url(#texture)" clip-path="url(#body-clip)" opacity="0.5" style="mix-blend-mode: overlay;" />
                </g>

                <!-- === LAYER 3: The Sleeves Pattern Overlay === -->
                <g opacity="0.8">
                    <path d="M290,160 L140,160 L120,440 L160,460 L260,320 Z" fill="url(#dragon-pattern)" style="mix-blend-mode: overlay;" />
                    <path d="M510,160 L660,160 L680,440 L640,460 L540,320 Z" fill="url(#dragon-pattern)" style="mix-blend-mode: overlay;" />
                </g>

                <!-- === LAYER 4: The Obi (Sash) === -->
                <!-- Volumetric Nagoya Obi -->
                <g id="obi-front">
                    <!-- Main Band -->
                    <path d="M270,490 L530,490 L535,570 L265,570 Z" fill="url(#obi-grad)" />
                    
                    <!-- Obi Pattern (Denser, Gold) -->
                    <rect x="260" y="490" width="280" height="80" fill="url(#dragon-pattern)" clip-path="url(#obi-clip)" opacity="0.9" />
                    
                    <!-- Folds on the band -->
                    <path d="M270,495 L530,495" stroke="rgba(0,0,0,0.2)" stroke-width="1" />
                    <path d="M265,565 L535,565" stroke="rgba(0,0,0,0.2)" stroke-width="1" />
                </g>

                <!-- === LAYER 5: The Knot (Taiko Drum) === -->
                <!-- Complex vector shapes for volume and cultural specificity -->
                <g id="obi-knot" transform="translate(450, 530)">
                    <!-- Back of the knot (tail) -->
                    <path d="M-15,15 L-25,50 L-5,60 L5,25 Z" fill="var(--obi-deep)" />
                    <path d="M15,15 L25,50 L5,60 L-5,25 Z" fill="var(--obi-deep)" />

                    <!-- The Drum Body (Center) -->
                    <rect x="-60" y="-15" width="120" height="50" rx="6" fill="url(#knot-grad)" filter="drop-shadow(0px 8px 6px rgba(0,0,0,0.5))" />
                    
                    <!-- Gold Embroidery on Knot -->
                    <path d="M-50,10 L50,10" stroke="var(--gold)" stroke-width="2.5" />
                    <path d="M-50,15 L50,15" stroke="var(--gold)" stroke-width="1" opacity="0.6" />
                    <path d="M-50,5 L50,5" stroke="var(--gold)" stroke-width="1" opacity="0.6" />
                    
                    <!-- The Folded Ends (Omosode) - Left -->
                    <path d="M-60,-5 C-90,-30 -110,10 -90,35 C-70,45 -60,15 -60,-5 Z" fill="url(#knot-grad)" stroke="var(--gold)" stroke-width="0.5" filter="drop-shadow(2px 4px 4px rgba(0,0,0,0.3))" />
                    <!-- The Folded Ends (Omosode) - Right -->
                    <path d="M60,-5 C90,-30 110,10 90,35 C70,45 60,15 60,-5 Z" fill="url(#knot-grad)" stroke="var(--gold)" stroke-width="0.5" filter="drop-shadow(-2px 4px 4px rgba(0,0,0,0.3))" />
                </g>

                <!-- === LAYER 6: The Collar (Eri) === -->
                <!-- Crossed structure with visible white inner collar (Nagajuban) -->
                <g id="collar">
                    <!-- Left Collar (Underneath) -->
                    <!-- Inner White Layer -->
                    <path d="M320,100 L290,160 L250,400 L270,400 L310,160 L340,100 Z" fill="#F2EFE3" />
                    <!-- Outer Dark Edge -->
                    <path d="M320,100 L290,160 L250,400 L255,400 L295,160 L325,100 Z" fill="var(--kimono-deep)" />

                    <!-- Right Collar (Overlapping) -->
                    <!-- Inner White Layer -->
                    <path d="M480,100 L510,160 L550,400 L530,400 L490,160 L460,100 Z" fill="#FFFFFF" />
                    <!-- Outer Dark Edge -->
                    <path d="M480,100 L510,160 L550,400 L545,400 L505,160 L475,100 Z" fill="var(--kimono-deep)" />

                    <!-- Shadows for depth where collars meet -->
                    <path d="M320,100 L290,160 L250,400" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="4" filter="blur(3px)" />
                </g>

                <!-- === LAYER 7: Folds & Shadows (Vector Craft) === -->
                <!-- These simulate gravity and fabric weight -->
                <g id="folds" opacity="0.7">
                    <!-- Center Front Fold -->
                    <path d="M450,570 L450,1050" stroke="rgba(0,0,0,0.5)" stroke-width="4" filter="blur(2px)" />
                    
                    <!-- Side Folds radiating from Obi -->
                    <path d="M300,570 Q290,750 310,1050" stroke="rgba(0,0,0,0.4)" stroke-width="3" fill="none" filter="blur(1px)" />
                    <path d="M500,570 Q510,750 490,1050" stroke="rgba(0,0,0,0.4)" stroke-width="3" fill="none" filter="blur(1px)" />
                    
                    <!-- Underarm/Axilla Folds -->
                    <path d="M260,320 Q270,450 260,550" stroke="rgba(0,0,0,0.3)" stroke-width="3" fill="none" />
                    <path d="M540,320 Q530,450 540,550" stroke="rgba(0,0,0,0.3)" stroke-width="3" fill="none" />
                </g>

            </svg>
        </div>

        <!-- Right Panel: Cleaned up, empty space -->
        <div class="right-panel">
            <!-- Deliberately left empty to restore negative space as per critique -->
        </div>
    </div>

    <script>
        // Subtle Parallax Effect on Mouse Move
        // Adds a feeling of weight and presence to the garment
        document.addEventListener('mousemove', (e) => {
            const svg = document.querySelector('.kimono-svg');
            const x = (window.innerWidth - e.pageX * 2) / 180; // Reduced sensitivity
            const y = (window.innerHeight - e.pageY * 2) / 180;

            // Apply subtle movement
            svg.style.transform = `translateX(${x}px) translateY(${y}px)`;
        });
    </script>
</body>
</html>
