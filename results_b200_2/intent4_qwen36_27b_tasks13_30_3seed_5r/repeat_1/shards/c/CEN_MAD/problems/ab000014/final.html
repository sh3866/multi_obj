<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seiryu | Azure Dragon Kimono</title>
    <style>
        :root {
            /* Palette: Refined Indigo, Silk Gold, Vermilion, Warm Cream */
            --bg-dark: #0a0a0c;
            --bg-light: #1a1c24;
            
            /* Kimono Colors (Deep Indigo/Teal) */
            --silk-base: #102a35;
            --silk-light: #1e4555;
            --silk-shadow: #051116;
            --silk-highlight: #3a6b80;
            
            /* Obi Colors (Rich Crimson) */
            --obi-base: #7a1b1b;
            --obi-light: #b33939;
            --obi-shadow: #3d0808;
            
            /* Accents */
            --gold: #d4af37;
            --gold-bright: #f2d06b;
            --cream: #f4f1ea;
            
            /* Typography */
            --font-serif: "Times New Roman", "Georgia", serif;
            --font-sans: "Helvetica Neue", "Helvetica", Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at 50% 40%, var(--bg-light), var(--bg-dark));
            color: var(--cream);
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Prevent scroll bars */
            font-family: var(--font-sans);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* === Header / Typography Area === */
        header {
            position: absolute;
            top: 3vh;
            left: 5vw;
            z-index: 20;
            width: 90vw;
            pointer-events: none;
        }

        .label-top {
            font-family: var(--font-sans);
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 0.5rem;
            display: block;
            opacity: 0.8;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 0.5rem;
            width: fit-content;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 4rem;
            font-weight: 400;
            line-height: 1.1;
            color: var(--cream);
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        h1 span {
            display: block;
            font-size: 1.5rem;
            color: var(--obi-light);
            margin-top: 0.2rem;
            font-weight: 300;
            font-style: italic;
            letter-spacing: 0.05em;
        }

        /* === SVG Container === */
        .garment-stage {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        svg.kimono-svg {
            height: 92vh; /* Leave room for header */
            width: auto;
            max-width: 85vw;
            /* Soft ambient shadow behind the garment */
            filter: drop-shadow(0px 20px 40px rgba(0, 0, 0, 0.7));
            will-change: transform;
            transition: transform 0.1s ease-out;
        }

        /* === Footer Metadata === */
        .meta-data {
            position: absolute;
            bottom: 3vh;
            left: 5vw;
            z-index: 20;
            font-size: 0.8rem;
            color: #888;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            display: flex;
            gap: 1.5rem;
            pointer-events: none;
            opacity: 0.9;
        }

        .meta-item strong {
            color: var(--cream);
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 2.8rem; }
            header { top: 2vh; left: 5vw; }
            .meta-data { flex-direction: column; gap: 0.5rem; bottom: 2vh; }
        }
    </style>
</head>
<body>

    <header>
        <span class="label-top">Houmongi Collection • 2024</span>
        <h1>
            Seiryu
            <span>The Azure Dragon Robe</span>
        </h1>
    </header>

    <div class="garment-stage">
        <!-- viewBox expanded to accommodate longer sleeves and body -->
        <svg class="kimono-svg" viewBox="0 0 800 1100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 1. Fabric Gradients (Soft UI / Sheen) -->
                <!-- Body Gradient: Simulates drape and folds -->
                <linearGradient id="silk-body" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="var(--silk-shadow)" />
                    <stop offset="15%" stop-color="var(--silk-base)" />
                    <stop offset="40%" stop-color="var(--silk-light)" /> <!-- Highlight -->
                    <stop offset="60%" stop-color="var(--silk-base)" />
                    <stop offset="85%" stop-color="var(--silk-shadow)" />
                    <stop offset="100%" stop-color="var(--silk-shadow)" />
                </linearGradient>

                <!-- Sleeve Gradient: Vertical flow -->
                <linearGradient id="sleeve-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="var(--silk-light)" />
                    <stop offset="30%" stop-color="var(--silk-base)" />
                    <stop offset="80%" stop-color="var(--silk-shadow)" />
                    <stop offset="100%" stop-color="#020608" />
                </linearGradient>

                <!-- Obi Gradient: Rich Velvet/Silk -->
                <linearGradient id="obi-band" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="var(--obi-light)" />
                    <stop offset="30%" stop-color="var(--obi-base)" />
                    <stop offset="70%" stop-color="var(--obi-shadow)" />
                    <stop offset="100%" stop-color="#1a0202" />
                </linearGradient>

                <!-- Knot Gradient: 3D Volume -->
                <radialGradient id="knot-center" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
                    <stop offset="0%" stop-color="var(--obi-light)" />
                    <stop offset="40%" stop-color="var(--obi-base)" />
                    <stop offset="80%" stop-color="var(--obi-shadow)" />
                    <stop offset="100%" stop-color="#1a0202" />
                </radialGradient>
                
                <!-- Knot Side Gradient -->
                <linearGradient id="knot-side" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="var(--obi-shadow)" />
                    <stop offset="50%" stop-color="var(--obi-base)" />
                    <stop offset="100%" stop-color="var(--obi-light)" />
                </linearGradient>

                <!-- 2. Filters -->
                <!-- Soft Shadow for 3D Depth -->
                <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
                </filter>
                
                <!-- Inner Shadow for Collar -->
                <filter id="inner-shadow">
                    <feOffset dx="0" dy="2"/>
                    <feGaussianBlur stdDeviation="2" result="offset-blur"/>
                    <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                    <feFlood flood-color="black" flood-opacity="0.5" result="color"/>
                    <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                    <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
                </filter>

                <!-- 3. Patterns (Azure Dragon / Scales) -->
                <!-- Enhanced contrast with Gold/Teal -->
                <pattern id="dragon-motif" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
                    <!-- Stylized Dragon Scale -->
                    <path d="M60 30 C75 30 90 45 90 60 C90 75 75 90 60 90 C45 90 30 75 30 60 C30 45 45 30 60 30" fill="none" stroke="var(--gold)" stroke-width="1.5" opacity="0.4"/>
                    <path d="M60 45 C70 45 80 55 80 60 C80 65 70 75 60 75 C50 75 40 65 40 60 C40 55 50 45 60 45" fill="none" stroke="var(--silk-highlight)" stroke-width="1" opacity="0.6"/>
                    
                    <!-- Clouds (Kumo) -->
                    <path d="M10 100 Q30 90 50 100 T90 100" fill="none" stroke="var(--gold)" stroke-width="1" opacity="0.3"/>
                    
                    <!-- Decorative dots -->
                    <circle cx="60" cy="60" r="2" fill="var(--gold-bright)" opacity="0.7"/>
                </pattern>

                <!-- 4. Clip Paths for Organic Shapes -->
                
                <!-- Main Body Silhouette -->
                <clipPath id="body-clip">
                    <!-- Redrawn for full length and better proportions -->
                    <path d="M 320,150 
                             C 380,150 420,150 480,150 
                             L 500,200 
                             C 510,350 520,500 530,600 
                             C 540,800 530,950 510,1080 
                             L 290,1080 
                             C 270,950 260,800 270,600 
                             C 280,500 290,350 300,200 Z" />
                </clipPath>

                <!-- Left Sleeve (Detached T-Shape / Furisode) -->
                <clipPath id="sleeve-clip-left">
                    <path d="M 290,180 
                             C 220,190 120,210 60,280 
                             L 60,700 
                             C 140,710 220,690 260,620 
                             L 290,350 Z" />
                </clipPath>
                
                <!-- Right Sleeve (Detached T-Shape / Furisode) -->
                <clipPath id="sleeve-clip-right">
                    <path d="M 510,180 
                             C 580,190 680,210 740,280 
                             L 740,700 
                             C 660,710 580,690 540,620 
                             L 510,350 Z" />
                </clipPath>
            </defs>

            <!-- === LAYER 1: Sleeves (Tate-sode) === -->
            <!-- Detached from body, hanging long -->
            <g id="sleeves" filter="url(#soft-shadow)">
                <!-- Left Sleeve -->
                <g clip-path="url(#sleeve-clip-left)">
                    <rect x="0" y="150" width="300" height="600" fill="url(#sleeve-grad)" />
                    <!-- Pattern Overlay -->
                    <rect x="0" y="150" width="300" height="600" fill="url(#dragon-motif)" opacity="0.8" style="mix-blend-mode: overlay;" />
                    <!-- Sleeve Hem Detail -->
                    <rect x="0" y="680" width="300" height="40" fill="var(--silk-shadow)" opacity="0.5" />
                </g>
                
                <!-- Right Sleeve -->
                <g clip-path="url(#sleeve-clip-right)">
                    <rect x="500" y="150" width="300" height="600" fill="url(#sleeve-grad)" />
                    <!-- Pattern Overlay -->
                    <rect x="500" y="150" width="300" height="600" fill="url(#dragon-motif)" opacity="0.8" style="mix-blend-mode: overlay;" />
                    <!-- Sleeve Hem Detail -->
                    <rect x="500" y="680" width="300" height="40" fill="var(--silk-shadow)" opacity="0.5" />
                </g>
            </g>

            <!-- === LAYER 2: Main Body === -->
            <g id="kimono-body" filter="url(#soft-shadow)">
                <!-- Base Shape -->
                <path d="M 320,150 
                         C 380,150 420,150 480,150 
                         L 500,200 
                         C 510,350 520,500 530,600 
                         C 540,800 530,950 510,1080 
                         L 290,1080 
                         C 270,950 260,800 270,600 
                         C 280,500 290,350 300,200 Z" 
                      fill="url(#silk-body)" />
                
                <!-- Pattern Overlay (Clipped to body shape) -->
                <rect x="0" y="0" width="800" height="1100" fill="url(#dragon-motif)" clip-path="url(#body-clip)" opacity="0.9" style="mix-blend-mode: soft-light;" />
            </g>

            <!-- === LAYER 3: Collar (Eri) === -->
            <!-- Right side crosses OVER Left side -->
            <g id="collar" filter="url(#inner-shadow)">
                <!-- Left Collar (Underneath) -->
                <path d="M 320,150 C 300,220 280,300 270,400" fill="none" stroke="var(--cream)" stroke-width="16" stroke-linecap="round" />
                <path d="M 320,150 C 300,220 280,300 270,400" fill="none" stroke="var(--silk-base)" stroke-width="14" stroke-linecap="round" opacity="0.9" />
                
                <!-- Right Collar (Over) - Creates the V-shape -->
                <path d="M 480,150 C 500,220 520,300 530,400" fill="none" stroke="var(--cream)" stroke-width="16" stroke-linecap="round" />
                <path d="M 480,150 C 500,220 520,300 530,400" fill="none" stroke="var(--silk-base)" stroke-width="14" stroke-linecap="round" opacity="0.9" />
                
                <!-- Neckline Shadow -->
                <path d="M 400,150 C 400,200 400,250 400,300" fill="none" stroke="#000" stroke-width="10" opacity="0.4" filter="blur(4px)" />
            </g>

            <!-- === LAYER 4: Obi Band (Front) === -->
            <g id="obi-band" filter="url(#soft-shadow)">
                <!-- The band wraps around -->
                <path d="M 275,580 L 525,580 L 535,680 L 265,680 Z" fill="url(#obi-band)" />
                
                <!-- Gold Trim -->
                <path d="M 275,580 L 525,580" fill="none" stroke="var(--gold)" stroke-width="2" />
                <path d="M 265,680 L 535,680" fill="none" stroke="var(--gold)" stroke-width="2" />
                
                <!-- Obi Pattern (Subtle overlay) -->
                <path d="M 275,580 L 525,580 L 535,680 L 265,680 Z" fill="url(#dragon-motif)" opacity="0.4" style="mix-blend-mode: overlay;" />
            </g>

            <!-- === LAYER 5: Obi Knot (Taiko Drum) === -->
            <!-- Sculptural 3D effect, moved to center -->
            <g id="obi-knot" transform="translate(400, 630)" filter="url(#soft-shadow)">
                <!-- Back Tails (hanging down) -->
                <path d="M -10,50 L -15,110 L 0,120 L 15,110 L 10,50 Z" fill="var(--obi-shadow)" />
                
                <!-- Main Drum Body -->
                <rect x="-100" y="-30" width="200" height="90" rx="15" fill="url(#knot-center)" stroke="var(--gold)" stroke-width="1.5" />
                
                <!-- Gold Cord Wrapping (The "Maki-obi" look) -->
                <!-- Using a group for cleaner code -->
                <g stroke="var(--gold)" stroke-width="4" opacity="0.9">
                    <line x1="-90" y1="-20" x2="-90" y2="40" />
                    <line x1="-70" y1="-20" x2="-70" y2="40" />
                    <line x1="-50" y1="-20" x2="-50" y2="40" />
                    <line x1="-30" y1="-20" x2="-30" y2="40" />
                    <line x1="-10" y1="-20" x2="-10" y2="40" />
                    <line x1="10" y1="-20" x2="10" y2="40" />
                    <line x1="30" y1="-20" x2="30" y2="40" />
                    <line x1="50" y1="-20" x2="50" y2="40" />
                    <line x1="70" y1="-20" x2="70" y2="40" />
                    <line x1="90" y1="-20" x2="90" y2="40" />
                </g>
                
                <!-- Omosode (Folded ends) - Left -->
                <path d="M -100,0 C -160,-40 -180,20 -140,60 C -110,70 -90,20 -90,0 Z" fill="url(#knot-side)" stroke="var(--gold)" stroke-width="1.5" />
                <!-- Omosode (Folded ends) - Right -->
                <path d="M 100,0 C 160,-40 180,20 140,60 C 110,70 90,20 90,0 Z" fill="url(#knot-side)" stroke="var(--gold)" stroke-width="1.5" />
                
                <!-- Center Highlight on Knot -->
                <ellipse cx="0" cy="-10" rx="40" ry="10" fill="#fff" opacity="0.1" filter="blur(2px)" />
            </g>

            <!-- === LAYER 6: Shadows & Folds === -->
            <!-- Adding depth to the fabric -->
            <g id="fabric-shadows" opacity="0.6">
                <!-- Center vertical fold -->
                <path d="M 400,680 L 400,1080" stroke="#000" stroke-width="15" filter="blur(10px)" opacity="0.5" />
                
                <!-- Side folds radiating from obi -->
                <path d="M 300,680 Q 290,900 320,1080" stroke="#000" stroke-width="12" fill="none" filter="blur(8px)" />
                <path d="M 500,680 Q 510,900 480,1080" stroke="#000" stroke-width="12" fill="none" filter="blur(8px)" />
            </g>

        </svg>
    </div>

    <div class="meta-data">
        <div class="meta-item"><strong>Origin:</strong> Kyoto</div>
        <div class="meta-item"><strong>Material:</strong> Silk Crepe</div>
        <div class="meta-item"><strong>Style:</strong> Furisode</div>
    </div>

    <script>
        // Subtle Parallax Effect for "Life"
        document.addEventListener('mousemove', (e) => {
            const svg = document.querySelector('.kimono-svg');
            // Only activate on larger screens for performance
            if(window.innerWidth > 768) { 
                const x = (window.innerWidth - e.pageX * 2) / 150;
                const y = (window.innerHeight - e.pageY * 2) / 150;
                // Limit movement range
                svg.style.transform = `translateX(${x}px) translateY(${y}px)`;
            }
        });
    </script>
</body>
</html>
