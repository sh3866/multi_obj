<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactical AI Behavior Inspector</title>
<style>
  :root {
    /* Palette - High Contrast Tactical */
    --bg-deep: #050505;
    --bg-panel: #0a0a0a;
    --bg-card: #111111;
    --border: #2a2a2a;
    --border-highlight: #404040;
    
    --text-primary: #e0e0e0;
    --text-secondary: #888888;
    --text-muted: #444444;
    
    /* Status Colors */
    --c-player: #00f0ff;   /* Bright Cyan */
    --c-patrol: #00ff66;   /* Neon Green */
    --c-alert: #ffcc00;    /* Amber */
    --c-chase: #ff6600;    /* Orange */
    --c-attack: #ff0033;   /* Red */
    
    /* Typography */
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Fira Code", "Roboto Mono", Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-deep);
    color: var(--text-primary);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 280px;
    grid-template-rows: 48px 1fr;
    font-size: 12px;
  }

  /* --- HEADER --- */
  header {
    grid-column: 1 / -1;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 50;
  }

  .brand {
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.15em;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-primary);
  }

  .brand svg { stroke: var(--c-player); filter: drop-shadow(0 0 5px var(--c-player)); }
  .brand span { color: var(--text-muted); font-weight: 400; }

  .header-controls { display: flex; gap: 12px; align-items: center; }

  .status-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 2px;
    background: rgba(0, 255, 102, 0.05);
    color: var(--c-patrol);
    border: 1px solid rgba(0, 255, 102, 0.2);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
  .status-dot {
    width: 6px; height: 6px;
    background: currentColor;
    border-radius: 50%;
    box-shadow: 0 0 5px currentColor;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

  .btn-primary {
    background: var(--bg-card);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    padding: 5px 14px;
    border-radius: 2px;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .btn-primary:hover { background: var(--border-highlight); color: var(--text-primary); border-color: var(--text-muted); }

  /* --- MAIN CANVAS AREA --- */
  main {
    position: relative;
    background-color: var(--bg-deep);
    overflow: hidden;
    cursor: crosshair;
  }

  canvas { display: block; width: 100%; height: 100%; }

  /* --- FLOATING CONTROLS --- */
  .floating-controls {
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    gap: 6px;
    background: rgba(10, 10, 10, 0.8);
    padding: 4px;
    border: 1px solid var(--border);
    border-radius: 4px;
    backdrop-filter: blur(8px);
    z-index: 10;
  }

  .toggle-btn {
    padding: 6px 12px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 2px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  
  .toggle-btn:hover { color: var(--text-secondary); background: rgba(255,255,255,0.03); }
  
  .toggle-btn.active {
    background: rgba(0, 240, 255, 0.1);
    color: var(--c-player);
    border-color: rgba(0, 240, 255, 0.3);
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.05);
  }

  /* --- INSPECTOR PANEL --- */
  aside {
    background: var(--bg-panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px;
    gap: 16px;
    overflow-y: auto;
    z-index: 20;
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 14px;
  }

  .panel-title {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }

  /* Legend Grid */
  .legend-grid { display: flex; flex-direction: column; gap: 6px; }

  .legend-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-secondary);
    padding: 4px 0;
  }
  
  .legend-left { display: flex; align-items: center; gap: 8px; }

  .chip-dot {
    width: 8px; height: 8px;
    border-radius: 2px;
    box-shadow: 0 0 8px currentColor;
  }

  /* Stats */
  .stat-row {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
  }
  .stat-label { color: var(--text-muted); font-size: 11px; }
  .stat-value { font-family: var(--font-mono); font-weight: 600; color: var(--text-primary); }
  
  .stat-bar-bg {
    width: 100%; height: 4px;
    background: #222;
    border-radius: 2px;
    overflow: hidden;
  }
  .stat-bar-fill {
    height: 100%;
    background: var(--c-player);
    box-shadow: 0 0 8px var(--c-player);
    transition: width 0.2s;
  }

</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    TACTICAL<span>AI</span>
  </div>
  <div class="header-controls">
    <div class="status-badge">
      <div class="status-dot"></div>
      SIMULATION ACTIVE
    </div>
    <button class="btn-primary" onclick="resetSimulation()">Reset</button>
  </div>
</header>

<main id="canvas-container">
  <canvas id="simCanvas"></canvas>
  
  <div class="floating-controls">
    <button class="toggle-btn active" onclick="toggleLayer('paths')">Paths</button>
    <button class="toggle-btn active" onclick="toggleLayer('fov')">FOV</button>
    <button class="toggle-btn active" onclick="toggleLayer('labels')">Labels</button>
  </div>
</main>

<aside>
  <!-- CRITIQUE #3: LEGEND MOVED TO TOP -->
  <div class="panel-section">
    <div class="panel-title">AI State Legend</div>
    <div class="legend-grid">
      <div class="legend-item">
        <div class="legend-left">
          <div class="chip-dot" style="background: var(--c-patrol); color: var(--c-patrol)"></div>
          PATROL
        </div>
        <span style="font-size: 9px; color: var(--text-muted)">IDLE</span>
      </div>
      <div class="legend-item">
        <div class="legend-left">
          <div class="chip-dot" style="background: var(--c-alert); color: var(--c-alert)"></div>
          ALERT
        </div>
        <span style="font-size: 9px; color: var(--text-muted)">SEARCH</span>
      </div>
      <div class="legend-item">
        <div class="legend-left">
          <div class="chip-dot" style="background: var(--c-chase); color: var(--c-chase)"></div>
          CHASE
        </div>
        <span style="font-size: 9px; color: var(--text-muted)">MOVE</span>
      </div>
      <div class="legend-item">
        <div class="legend-left">
          <div class="chip-dot" style="background: var(--c-attack); color: var(--c-attack)"></div>
          ATTACK
        </div>
        <span style="font-size: 9px; color: var(--text-muted)">FIRE</span>
      </div>
    </div>
  </div>

  <!-- CRITIQUE #3: PLAYER UNIT DIMMED -->
  <div class="panel-section" style="opacity: 0.7;">
    <div class="panel-title">Player Unit</div>
    <div class="stat-row">
      <span class="stat-label">Health</span>
      <span class="stat-value" style="color: var(--c-patrol)">100%</span>
    </div>
    <div class="stat-bar-bg">
      <div class="stat-bar-fill" style="width: 100%;"></div>
    </div>
    
    <div class="stat-row" style="margin-top: 10px;">
      <span class="stat-label">Position</span>
      <span class="stat-value" id="pos-display">0, 0</span>
    </div>
  </div>
</aside>

<script>
/**
 * TACTICAL AI SIMULATION ENGINE
 * Revised for Visual Design & Critique
 */

const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const posDisplay = document.getElementById('pos-display');

// Configuration
const CONFIG = {
  colors: {
    bg: '#050505',
    grid: '#111111',
    // CRITIQUE #4: Wireframe wall colors
    wallFill: 'rgba(20, 20, 20, 0.8)', 
    wallStroke: '#444444',
    player: '#00f0ff',
    states: {
      PATROL: '#00ff66',
      ALERT: '#ffcc00',
      CHASE: '#ff6600',
      ATTACK: '#ff0033'
    }
  },
  enemyCount: 6,
  wallCount: 12
};

// State
let width, height;
let mouse = { x: 0, y: 0 };
let walls = [];
let enemies = [];
let particles = [];

// Layers
const layers = {
  paths: true,
  fov: true,
  labels: true
};

// --- UTILS ---

const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const lerp = (a, b, t) => a + (b - a) * t;
const angleTo = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);

function getIntersection(A, B, C, D) {
  const tTop = (D.x - C.x) * (A.y - C.y) - (D.y - C.y) * (A.x - C.x);
  const uTop = (C.y - A.y) * (A.x - B.x) - (C.x - A.x) * (A.y - B.y);
  const bottom = (D.y - C.y) * (B.x - A.x) - (D.x - C.x) * (B.y - A.y);

  if (bottom !== 0) {
    const t = tTop / bottom;
    const u = uTop / bottom;
    if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
      return { x: lerp(A.x, B.x, t), y: lerp(A.y, B.y, t) }
    }
  }
  return null;
}

// --- CLASSES ---

class Wall {
  constructor(x, y, w, h) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.segments = [
      {x1: x, y1: y, x2: x + w, y2: y},
      {x1: x + w, y1: y, x2: x + w, y2: y + h},
      {x1: x + w, y1: y + h, x2: x, y2: y + h},
      {x1: x, y1: y + h, x2: x, y2: y}
    ];
  }

  draw(ctx) {
    ctx.save();
    
    // CRITIQUE #4: 4px corner radius, wireframe/glass style
    ctx.fillStyle = CONFIG.colors.wallFill;
    ctx.strokeStyle = CONFIG.colors.wallStroke;
    ctx.lineWidth = 1;
    
    // Rounded Rect
    const r = 4;
    ctx.beginPath();
    ctx.moveTo(this.x + r, this.y);
    ctx.lineTo(this.x + this.w - r, this.y);
    ctx.arcTo(this.x + this.w, this.y, this.x + this.w, this.y + r, r);
    ctx.lineTo(this.x + this.w, this.y + this.h - r);
    ctx.arcTo(this.x + this.w, this.y + this.h, this.x + this.w - r, this.y + this.h, r);
    ctx.lineTo(this.x + r, this.y + this.h);
    ctx.arcTo(this.x, this.y + this.h, this.x, this.y + this.h - r, r);
    ctx.lineTo(this.x, this.y + r);
    ctx.arcTo(this.x, this.y, this.x + r, this.y, r);
    ctx.closePath();
    
    ctx.fill();
    ctx.stroke();
    
    // Inner "Glass" Highlight
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(this.x + 4, this.y + 4);
    ctx.lineTo(this.x + this.w - 4, this.y + 4);
    ctx.stroke();
    
    ctx.restore();
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.color = color;
    this.vx = (Math.random() - 0.5) * 3;
    this.vy = (Math.random() - 0.5) * 3;
    this.life = 1.0;
    this.decay = 0.05;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }
  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Enemy {
  constructor(id) {
    this.id = id;
    this.x = Math.random() * (width - 100) + 50;
    this.y = Math.random() * (height - 100) + 50;
    this.radius = 10;
    this.angle = Math.random() * Math.PI * 2;
    this.speed = 1.5 + Math.random();
    
    this.state = 'PATROL'; 
    this.targetX = this.x;
    this.targetY = this.y;
    
    this.waypoints = [];
    this.currentWaypointIndex = 0;
    this.generateWaypoints();

    this.viewDistance = 160;
    this.viewAngle = Math.PI / 2.2; 
    this.attackRange = 60;
    
    this.alertTimer = 0;
  }

  generateWaypoints() {
    this.waypoints = [];
    for(let i=0; i<4; i++) {
      this.waypoints.push({
        x: Math.random() * (width - 100) + 50,
        y: Math.random() * (height - 100) + 50
      });
    }
  }

  update(player, walls) {
    const dToPlayer = dist(this.x, this.y, player.x, player.y);
    const angleToPlayer = angleTo(this.x, this.y, player.x, player.y);
    
    let angleDiff = angleToPlayer - this.angle;
    while (angleDiff <= -Math.PI) angleDiff += Math.PI*2;
    while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
    
    const inFOV = Math.abs(angleDiff) < this.viewAngle / 2;
    const canSee = dToPlayer < this.viewDistance && inFOV && this.hasLineOfSight(player.x, player.y, walls);

    // State Machine Logic
    if (this.state === 'PATROL') {
      if (canSee) {
        this.state = 'CHASE';
        return;
      }
      this.patrol();
    } 
    else if (this.state === 'ALERT') {
      this.alertTimer--;
      if (this.alertTimer <= 0) this.state = 'PATROL';
      this.patrol(); 
    }
    else if (this.state === 'CHASE') {
      if (!canSee) {
        this.state = 'ALERT';
        this.alertTimer = 180;
        return;
      }
      if (dToPlayer < this.attackRange) {
        this.state = 'ATTACK';
      } else {
        this.moveTowards(player.x, player.y);
      }
    }
    else if (this.state === 'ATTACK') {
      if (dToPlayer > this.viewDistance * 1.2) {
        this.state = 'CHASE';
      } else {
        this.angle = lerp(this.angle, angleToPlayer, 0.15);
        if (Math.random() < 0.15) this.shoot(player.x, player.y);
      }
    }
  }

  hasLineOfSight(tx, ty, walls) {
    const p1 = {x: this.x, y: this.y};
    const p2 = {x: tx, y: ty};
    
    for (let w of walls) {
      for (let seg of w.segments) {
        if (getIntersection(p1, p2, {x: seg.x1, y: seg.y1}, {x: seg.x2, y: seg.y2})) {
          return false;
        }
      }
    }
    return true;
  }

  patrol() {
    const wp = this.waypoints[this.currentWaypointIndex];
    if (dist(this.x, this.y, wp.x, wp.y) < 5) {
      this.currentWaypointIndex = (this.currentWaypointIndex + 1) % this.waypoints.length;
    }
    this.moveTowards(wp.x, wp.y);
  }

  moveTowards(tx, ty) {
    const targetAngle = angleTo(this.x, this.y, tx, ty);
    let diff = targetAngle - this.angle;
    while (diff <= -Math.PI) diff += Math.PI*2;
    while (diff > Math.PI) diff -= Math.PI*2;
    this.angle += diff * 0.1;

    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
    
    this.x = Math.max(20, Math.min(width - 20, this.x));
    this.y = Math.max(20, Math.min(height - 20, this.y));
  }

  shoot(tx, ty) {
    particles.push(new Particle(this.x + Math.cos(this.angle)*12, this.y + Math.sin(this.angle)*12, '#fbbf24'));
  }

  draw(ctx) {
    const color = CONFIG.colors.states[this.state];

    // --- CRITIQUE #2: VISUALIZING PATHFINDING ---
    if (layers.paths) {
      ctx.save();
      let targetX, targetY, pathColor;
      
      if (this.state === 'CHASE' || this.state === 'ATTACK') {
        targetX = mouse.x;
        targetY = mouse.y;
        pathColor = color;
      } else {
        const wp = this.waypoints[this.currentWaypointIndex];
        targetX = wp.x;
        targetY = wp.y;
        pathColor = '#333'; 
      }

      // CRITIQUE #2: Solid line for Chase, Dashed for Patrol
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(targetX, targetY);
      ctx.strokeStyle = pathColor;
      ctx.lineWidth = (this.state === 'CHASE' || this.state === 'ATTACK') ? 2 : 1;
      
      if (this.state === 'CHASE' || this.state === 'ATTACK') {
        ctx.setLineDash([]); // Solid for Chase
        ctx.globalAlpha = 0.5;
      } else {
        ctx.setLineDash([4, 6]); // Dashed for Patrol
        ctx.globalAlpha = 0.3;
      }
      ctx.stroke();
      
      // Target Node
      if (this.state === 'PATROL') {
        ctx.beginPath();
        ctx.arc(targetX, targetY, 3, 0, Math.PI*2);
        ctx.fillStyle = '#333';
        ctx.globalAlpha = 0.5;
        ctx.fill();
      }
      
      ctx.restore();
    }

    // --- CRITIQUE #5: STATE VISUALIZATION (FOV) ---
    if (layers.fov) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, this.viewDistance, -this.viewAngle/2, this.viewAngle/2);
      ctx.closePath();
      
      // Gradient fill
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.viewDistance);
      grad.addColorStop(0, color + '30'); // Hex alpha
      grad.addColorStop(1, color + '00');
      
      ctx.fillStyle = grad;
      
      // CRITIQUE #5: Dashed texture for Patrol
      if (this.state === 'PATROL') {
        ctx.setLineDash([5, 5]);
        ctx.lineWidth = 1;
        ctx.strokeStyle = color + '40';
        ctx.stroke();
      }
      
      ctx.fill();
      
      // Outer arc
      ctx.beginPath();
      ctx.arc(0, 0, this.viewDistance, -this.viewAngle/2, this.viewAngle/2);
      ctx.strokeStyle = color + '60';
      ctx.lineWidth = 1;
      ctx.setLineDash([]);
      ctx.stroke();
      
      ctx.restore();
    }

    // Attack Range (Critique #5)
    if (layers.labels) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.attackRange, 0, Math.PI*2);
      
      // CRITIQUE #5: Solid aggressive ring for Attack, Dashed for others
      if (this.state === 'ATTACK') {
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.setLineDash([]);
        ctx.globalAlpha = 0.8;
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
      } else if (this.state === 'CHASE') {
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.globalAlpha = 0.5;
      } else {
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 2]);
        ctx.globalAlpha = 0.3;
      }
      ctx.stroke();
      ctx.restore();
    }

    // Enemy Body
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    
    // Triangle shape
    ctx.beginPath();
    ctx.moveTo(10, 0);
    ctx.lineTo(-8, 6);
    ctx.lineTo(-8, -6);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    
    ctx.shadowBlur = 0;
    ctx.restore();

    // --- CRITIQUE #5: LABEL VISUALIZATION ---
    if (layers.labels) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      
      // High contrast background for label
      const text = this.state;
      const fontSize = 10;
      ctx.font = `bold ${fontSize}px var(--font-mono)`;
      const textWidth = ctx.measureText(text).width;
      
      const pad = 4;
      const lx = this.x - textWidth/2 - pad;
      const ly = this.y - 24;
      
      // Label Box
      ctx.fillStyle = '#000';
      ctx.globalAlpha = 0.8;
      ctx.fillRect(lx, ly, textWidth + pad*2, 14);
      
      // Label Border
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.strokeRect(lx, ly, textWidth + pad*2, 14);
      
      // Label Text
      ctx.fillStyle = color;
      ctx.globalAlpha = 1;
      ctx.fillText(text, this.x, ly + 11);
      ctx.restore();
    }
  }
}

// --- MAIN LOOP ---

function init() {
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });

  generateMap();
  requestAnimationFrame(loop);
}

function resize() {
  const container = document.getElementById('canvas-container');
  width = container.clientWidth;
  height = container.clientHeight;
  canvas.width = width;
  canvas.height = height;
}

function generateMap() {
  walls = [];
  enemies = [];
  
  for(let i=0; i<CONFIG.wallCount; i++) {
    const w = 60 + Math.random() * 150;
    const h = 20 + Math.random() * 40;
    const x = Math.random() * (width - w - 100) + 50;
    const y = Math.random() * (height - h - 100) + 50;
    if (dist(x, y, width/2, height/2) > 150) {
      walls.push(new Wall(x, y, w, h));
    }
  }

  for(let i=0; i<CONFIG.enemyCount; i++) {
    enemies.push(new Enemy(i));
  }
  
  // CRITIQUE #1: Force states for demo purposes
  if(enemies.length >= 3) {
    enemies[0].state = 'CHASE';
    // Move enemy 0 closer to player to show chase vector
    enemies[0].x = mouse.x - 100;
    enemies[0].y = mouse.y - 100;
    
    enemies[1].state = 'ALERT';
    enemies[1].alertTimer = 300;
    
    enemies[2].state = 'ATTACK';
    // Position enemy 2 close to player to show attack range
    enemies[2].x = mouse.x + 40;
    enemies[2].y = mouse.y + 40;
  }
}

function drawGrid() {
  ctx.strokeStyle = CONFIG.colors.grid;
  ctx.lineWidth = 1;
  const gridSize = 40;
  
  ctx.beginPath();
  for(let x=0; x<=width; x+=gridSize) {
    ctx.moveTo(x, 0);
    ctx.lineTo(x, height);
  }
  for(let y=0; y<=height; y+=gridSize) {
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
  }
  ctx.stroke();
}

// CRITIQUE #1: Distinct Player Unit (Diamond)
function drawPlayer() {
  const pX = mouse.x;
  const pY = mouse.y;
  
  ctx.save();
  ctx.translate(pX, pY);
  
  const time = Date.now() / 500;
  const scale = 1 + Math.sin(time) * 0.05;
  ctx.scale(scale, scale);

  // Outer Glow
  ctx.shadowColor = CONFIG.colors.player;
  ctx.shadowBlur = 20;
  
  // CRITIQUE #1: Diamond Shape
  ctx.beginPath();
  ctx.moveTo(0, -12);
  ctx.lineTo(12, 0);
  ctx.lineTo(0, 12);
  ctx.lineTo(-12, 0);
  ctx.closePath();
  ctx.fillStyle = '#fff';
  ctx.fill();
  
  // Cyan Border
  ctx.shadowBlur = 0;
  ctx.strokeStyle = CONFIG.colors.player;
  ctx.lineWidth = 2;
  ctx.stroke();

  // Tactical Crosshair (Subtle)
  ctx.strokeStyle = CONFIG.colors.player;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.4;
  ctx.beginPath();
  ctx.arc(0, 0, 20, 0, Math.PI*2);
  ctx.stroke();
  
  ctx.beginPath();
  ctx.moveTo(-24, 0); ctx.lineTo(-16, 0);
  ctx.moveTo(16, 0); ctx.lineTo(24, 0);
  ctx.moveTo(0, -24); ctx.lineTo(0, -16);
  ctx.moveTo(0, 16); ctx.lineTo(0, 24);
  ctx.stroke();

  ctx.restore();

  posDisplay.innerText = `${Math.floor(pX)}, ${Math.floor(pY)}`;
}

function loop() {
  ctx.fillStyle = CONFIG.colors.bg;
  ctx.fillRect(0, 0, width, height);
  
  drawGrid();

  // Update & Draw Enemies
  enemies.forEach(e => {
    e.update(mouse, walls);
    e.draw(ctx);
  });

  // Update & Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  // Draw Walls
  walls.forEach(w => w.draw(ctx));

  drawPlayer();

  requestAnimationFrame(loop);
}

// --- UI INTERACTION ---

window.toggleLayer = (layer) => {
  layers[layer] = !layers[layer];
  const btns = document.querySelectorAll('.toggle-btn');
  if (layer === 'paths') btns[0].classList.toggle('active');
  if (layer === 'fov') btns[1].classList.toggle('active');
  if (layer === 'labels') btns[2].classList.toggle('active');
};

window.resetSimulation = () => {
  generateMap();
  particles = [];
};

// Start
init();

</script>
</body>
