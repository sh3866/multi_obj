<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pixel Hopper - 2.5D Gameplay</title>
<style>
    :root {
        --sky-top: #63A4FF;
        --sky-bot: #A0E8F7;
        --grass: #66BB6A;
        --grass-dark: #388E3C;
        --road: #546E7A;
        --road-line: #CFD8DC;
        --water: #4FC3F7;
        --water-dark: #039BE5;
        --wood: #8D6E63;
        --wood-dark: #5D4037;
        --ui-bg: #FFF8E1;
        --ui-border: #5D4037;
        --ui-text: #3E2723;
    }

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }

    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bot) 45%, var(--grass) 45%);
        font-family: 'Courier New', Courier, monospace;
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* --- SCENE & PERSPECTIVE --- */
    #scene {
        width: 100%;
        height: 100%;
        max-width: 600px;
        position: relative;
        overflow: hidden;
        /* 2.5D Projection */
        perspective: 800px;
        perspective-origin: 50% 20%;
    }

    /* --- HUD: Playful Aesthetic --- */
    .hud-container {
        position: absolute;
        top: 20px;
        left: 20px;
        right: 20px;
        display: flex;
        justify-content: space-between;
        z-index: 100;
        pointer-events: none;
    }

    .wood-sign {
        background: var(--ui-bg);
        border: 4px solid var(--ui-border);
        border-radius: 4px;
        padding: 8px 16px;
        box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
        text-align: center;
        min-width: 100px;
        position: relative;
        transform: rotate(-2deg);
    }
    
    .wood-sign.right { transform: rotate(2deg); }

    .wood-sign::before {
        /* Nail heads */
        content: '';
        position: absolute;
        top: 4px; left: 4px;
        width: 6px; height: 6px;
        background: #3E2723;
        border-radius: 50%;
        box-shadow: calc(100% - 14px) 0 0 #3E2723;
    }

    .label {
        font-size: 12px;
        font-weight: 900;
        color: #8D6E63;
        text-transform: uppercase;
        margin-bottom: 2px;
    }

    .val {
        font-size: 28px;
        font-weight: 900;
        color: var(--ui-text);
        line-height: 1;
    }

    /* --- GAME BOARD --- */
    #board {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        /* The Tilt */
        transform: rotateX(25deg) translateY(-100px);
        transition: transform 0.1s linear;
    }

    /* --- LANES --- */
    .lane {
        width: 100%;
        height: 80px;
        position: absolute;
        left: 0;
        transform-style: preserve-3d;
        border-bottom: 4px solid rgba(0,0,0,0.1);
    }

    /* Grass Texture */
    .lane.grass { 
        background: var(--grass);
        background-image: 
            radial-gradient(#81C784 15%, transparent 16%),
            radial-gradient(#81C784 15%, transparent 16%);
        background-size: 40px 40px;
        background-position: 0 0, 20px 20px;
    }

    /* Road Texture */
    .lane.road { 
        background: var(--road); 
        border-bottom: 6px solid #37474F;
    }
    .lane.road::after {
        content: '';
        position: absolute;
        top: 50%; left: 0; width: 100%; height: 4px;
        background: repeating-linear-gradient(90deg, var(--road-line) 0, var(--road-line) 30px, transparent 30px, transparent 60px);
        transform: translateY(-50%);
        opacity: 0.6;
    }

    /* Water Texture */
    .lane.water { 
        background: var(--water); 
        border-bottom: 6px solid var(--water-dark);
    }
    .lane.water::before {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(90deg, transparent 0, rgba(255,255,255,0.2) 40px, transparent 80px);
        animation: waterFlow 3s linear infinite;
    }

    @keyframes waterFlow {
        from { transform: translateX(0); }
        to { transform: translateX(80px); }
    }

    /* --- OBJECTS (Vehicles & Logs) --- */
    .moving-object {
        position: absolute;
        top: 10px;
        transform-style: preserve-3d;
        will-change: transform;
    }

    /* Low Poly Car */
    .car {
        width: 80px;
        height: 50px;
        background: #EF5350;
        border-radius: 8px;
        position: relative;
        box-shadow: 0 8px 0 #C62828; /* 3D Extrusion */
    }
    .car::after { /* Roof */
        content: '';
        position: absolute;
        top: -25px;
        left: 15px;
        width: 50px;
        height: 25px;
        background: #FF8A80;
        border-radius: 6px 6px 0 0;
        box-shadow: 0 4px 0 #EF5350; /* Roof extrusion */
    }
    /* Wheels */
    .car::before {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 10px;
        width: 14px; height: 14px;
        background: #212121;
        border-radius: 50%;
        box-shadow: 56px 0 0 #212121;
    }

    .car.truck {
        width: 120px;
        height: 60px;
        background: #FFCA28;
        box-shadow: 0 8px 0 #F57F17;
    }
    .car.truck::after {
        top: -30px;
        left: 20px;
        width: 50px;
        height: 30px;
        background: #FFE082;
        box-shadow: 0 4px 0 #FFCA28;
    }

    /* Low Poly Log */
    .log {
        width: 100px;
        height: 40px;
        background: var(--wood);
        border-radius: 6px;
        position: relative;
        box-shadow: 0 6px 0 var(--wood-dark);
        display: flex;
        align-items: center;
        justify-content: space-around;
        padding: 0 5px;
    }
    /* Bark details */
    .log::before {
        content: '';
        width: 100%; height: 100%;
        border-top: 3px solid rgba(255,255,255,0.2);
        border-radius: 6px;
        position: absolute;
        top: 0; left: 0;
    }

    /* --- PLAYER (Low Poly Chicken) --- */
    #player {
        position: absolute;
        width: 60px;
        height: 60px;
        z-index: 50;
        transition: left 0.1s ease-out, bottom 0.1s ease-out;
        /* Center horizontally by default */
        left: 50%;
        transform: translateX(-50%);
    }

    .chicken-container {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        animation: bob 0.4s infinite alternate ease-in-out;
    }

    /* Shadow */
    .player-shadow {
        position: absolute;
        bottom: -5px;
        left: 10px;
        width: 40px;
        height: 12px;
        background: rgba(0,0,0,0.3);
        border-radius: 50%;
        transform: translateZ(-10px);
    }

    /* Body */
    .body {
        position: absolute;
        width: 40px;
        height: 40px;
        background: #FFF9C4;
        bottom: 0;
        left: 10px;
        border-radius: 10px;
        box-shadow: 0 6px 0 #FBC02D; /* 3D bottom */
        border: 2px solid #FFF59D;
    }

    /* Comb */
    .comb {
        position: absolute;
        top: -12px;
        left: 18px;
        width: 16px;
        height: 14px;
        background: #E53935;
        border-radius: 8px 8px 0 0;
        z-index: 2;
        box-shadow: 0 2px 0 #B71C1C;
    }

    /* Face */
    .face {
        position: absolute;
        top: 10px;
        right: 4px;
        z-index: 3;
    }
    .eye {
        width: 6px; height: 6px;
        background: #3E2723;
        border-radius: 50%;
        position: absolute;
        top: 0; right: 0;
    }
    .beak {
        width: 8px; height: 6px;
        background: #FFB300;
        position: absolute;
        top: 8px; right: 2px;
        clip-path: polygon(0 0, 100% 50%, 0 100%);
    }

    @keyframes bob {
        0% { transform: translateY(0); }
        100% { transform: translateY(-4px); }
    }

    /* --- CONTROLS (Tactile) --- */
    .controls {
        position: absolute;
        bottom: 40px;
        right: 30px;
        width: 160px;
        height: 160px;
        z-index: 200;
        pointer-events: auto;
    }

    .d-pad {
        position: relative;
        width: 100%;
        height: 100%;
        background: rgba(255,255,255,0.1);
        border-radius: 50%;
        backdrop-filter: blur(2px);
    }

    .btn {
        position: absolute;
        width: 50px;
        height: 50px;
        background: rgba(255, 255, 255, 0.85);
        border: 2px solid rgba(0,0,0,0.1);
        border-bottom-width: 6px; /* Tactile depth */
        border-radius: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: transform 0.1s, border-bottom-width 0.1s;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .btn:active {
        transform: translateY(4px);
        border-bottom-width: 2px;
        background: #eee;
    }

    .btn svg { width: 24px; height: 24px; fill: #5D4037; }

    .btn-up { top: 5px; left: 55px; }
    .btn-down { bottom: 5px; left: 55px; }
    .btn-left { top: 55px; left: 5px; }
    .btn-right { top: 55px; right: 5px; }

    /* --- DECORATIONS --- */
    .cloud {
        position: absolute;
        background: rgba(255,255,255,0.7);
        border-radius: 40px;
        z-index: -1;
        animation: floatCloud linear infinite;
    }
    /* Cloud puffs */
    .cloud::after, .cloud::before {
        content: '';
        position: absolute;
        background: inherit;
        border-radius: 50%;
    }
    .cloud::after { width: 40px; height: 40px; top: -20px; left: 15px; }
    .cloud::before { width: 50px; height: 50px; top: -25px; left: 40px; }

    @keyframes floatCloud {
        from { transform: translateX(-200px); }
        to { transform: translateX(100vw); }
    }

    /* Trees */
    .tree {
        position: absolute;
        transform-style: preserve-3d;
        transform: translateZ(20px);
    }
    .trunk {
        width: 12px; height: 20px;
        background: #795548;
        margin: 0 auto;
        border-radius: 2px;
    }
    .leaves {
        width: 0; height: 0;
        border-left: 25px solid transparent;
        border-right: 25px solid transparent;
        border-bottom: 60px solid #2E7D32;
        filter: drop-shadow(0 4px 0 #1B5E20);
        margin-bottom: -10px;
    }
    .leaves::after {
        content: '';
        position: absolute;
        top: 30px; left: -25px;
        border-left: 25px solid transparent;
        border-right: 25px solid transparent;
        border-bottom: 50px solid #43A047;
    }

</style>
</head>
<body>

<div id="scene">
    <!-- HUD -->
    <div class="hud-container">
        <div class="wood-sign">
            <div class="label">Score</div>
            <div class="val" id="score">0</div>
        </div>
        <div class="wood-sign right">
            <div class="label">Best</div>
            <div class="val" id="best">0</div>
        </div>
    </div>

    <!-- Clouds -->
    <div class="cloud" style="top: 5%; width: 120px; height: 40px; animation-duration: 40s;"></div>
    <div class="cloud" style="top: 15%; width: 160px; height: 50px; animation-duration: 30s; animation-delay: -10s;"></div>
    <div class="cloud" style="top: 8%; width: 100px; height: 35px; animation-duration: 50s; animation-delay: -25s;"></div>

    <!-- GAME BOARD -->
    <div id="board">
        <!-- JS Injects Lanes Here -->
    </div>

    <!-- PLAYER -->
    <div id="player">
        <div class="chicken-container">
            <div class="comb"></div>
            <div class="body">
                <div class="face">
                    <div class="eye"></div>
                    <div class="beak"></div>
                </div>
            </div>
            <div class="player-shadow"></div>
        </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <div class="d-pad">
            <div class="btn btn-up" onclick="movePlayer(0, 1)">
                <svg viewBox="0 0 24 24"><path d="M12 4L4 12h6v8h4v-8h6z"/></svg>
            </div>
            <div class="btn btn-down" onclick="movePlayer(0, -1)">
                <svg viewBox="0 0 24 24"><path d="M12 20l8-8h-6V4h-4v8H4z"/></svg>
            </div>
            <div class="btn btn-left" onclick="movePlayer(-1, 0)">
                <svg viewBox="0 0 24 24"><path d="M20 12l-8-8v6H4v4h8v6z"/></svg>
            </div>
            <div class="btn btn-right" onclick="movePlayer(1, 0)">
                <svg viewBox="0 0 24 24"><path d="M4 12l8 8v-6h8v-4H12V4z"/></svg>
            </div>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    const LANE_HEIGHT = 80;
    const BOARD_INIT_OFFSET = -100;
    const START_LANES = 12;
    const GRID_WIDTH = 10; // How many grid units wide the screen is

    // --- STATE ---
    let score = 0;
    let bestScore = 0;
    let playerGridPos = { x: 0, y: 2 };
    let lanes = [];
    let gameLoopId;
    let isGameOver = false;
    let cameraY = 0;

    // --- ELEMENTS ---
    const board = document.getElementById('board');
    const playerEl = document.getElementById('player');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');

    // --- INITIALIZATION ---
    function init() {
        // Initial lanes
        for (let i = 0; i < START_LANES; i++) {
            addLane(i);
        }
        updatePlayerVisuals();
        gameLoop();
    }

    // --- LANE GENERATION ---
    function addLane(count) {
        const index = count; // 0 is bottom
        let type = 'grass';
        
        // Procedural Logic
        if (index > 1) {
            const r = Math.random();
            if (r < 0.45) type = 'road';
            else if (r < 0.75) type = 'water';
            else type = 'grass';
        }

        const lane = document.createElement('div');
        lane.className = `lane ${type}`;
        lane.style.bottom = (index * LANE_HEIGHT) + 'px';
        
        // Content Generation
        let contentEl = null;
        let speed = 0;
        let xPos = 0;

        if (type === 'road') {
            const isTruck = Math.random() > 0.7;
            const dir = Math.random() > 0.5 ? 1 : -1;
            speed = (1.5 + Math.random() * 2) * dir;
            xPos = dir > 0 ? -150 : 120; // Start off-screen
            
            contentEl = document.createElement('div');
            contentEl.className = `moving-object car ${isTruck ? 'truck' : ''}`;
            lane.appendChild(contentEl);
        } 
        else if (type === 'water') {
            const dir = Math.random() > 0.5 ? 1 : -1;
            speed = (0.8 + Math.random() * 1.2) * dir;
            xPos = dir > 0 ? -150 : 120;

            contentEl = document.createElement('div');
            contentEl.className = 'moving-object log';
            lane.appendChild(contentEl);
        } 
        else if (type === 'grass') {
            // Decorations
            if (Math.random() > 0.6) {
                const tree = document.createElement('div');
                tree.className = 'tree';
                tree.innerHTML = '<div class="leaves"></div><div class="trunk"></div>';
                tree.style.left = (Math.random() * 80 + 10) + '%';
                tree.style.bottom = (Math.random() * 20) + 'px';
                lane.appendChild(tree);
            }
        }

        board.appendChild(lane);

        lanes.push({
            element: lane,
            type: type,
            index: index,
            content: contentEl,
            speed: speed,
            x: xPos
        });
    }

    // --- GAME LOOP ---
    function gameLoop() {
        if (!isGameOver) {
            // Move Objects
            lanes.forEach(l => {
                if (l.content) {
                    l.x += l.speed;
                    // Wrap logic
                    if (l.speed > 0 && l.x > 120) l.x = -150;
                    if (l.speed < 0 && l.x < -150) l.x = 120;
                    
                    // Update CSS
                    l.content.style.transform = `translateX(${l.x}%)`;
                }
            });

            checkCollisions();
            updateCamera();
        }
        requestAnimationFrame(gameLoop);
    }

    // --- COLLISION LOGIC ---
    function checkCollisions() {
        const currentLane = lanes.find(l => l.index === playerGridPos.y);
        if (!currentLane) return;

        // Helper to check overlap between player grid X and object % X
        // Player X is Grid Units (-5 to 5). 0 is center.
        // Map Grid X to Percentage: -5 -> 0%, 0 -> 50%, 5 -> 100%
        // Player width approx 6% of screen
        
        const pLeft = (playerGridPos.x / (GRID_WIDTH/2)) * 50 + 50 - 4;
        const pRight = pLeft + 8;

        if (currentLane.type === 'road') {
            // Check Car
            const carObj = currentLane.content;
            const carWidth = carObj.classList.contains('truck') ? 25 : 15; // Approx % width
            const cLeft = currentLane.x;
            const cRight = currentLane.x + carWidth;

            if (pLeft < cRight && pRight > cLeft) {
                gameOver();
            }
        } 
        else if (currentLane.type === 'water') {
            const logObj = currentLane.content;
            const logWidth = 20; // Approx % width
            const lLeft = currentLane.x;
            const lRight = currentLane.x + logWidth;

            if (pLeft < lRight && pRight > lLeft) {
                // Riding Log
                // Move player X based on log speed
                // Convert log speed (pixels/frame) to grid units
                // Screen width is approx 600px. Grid width 10. 1 unit = 60px.
                // Log speed is relative to lane width %.
                // Let's approximate:
                playerGridPos.x += (currentLane.speed * 0.02); 
                updatePlayerVisuals();
            } else {
                // Drown
                gameOver();
            }
        }
    }

    // --- MOVEMENT ---
    window.movePlayer = function(dx, dy) {
        if (isGameOver) {
            resetGame();
            return;
        }

        // Prevent moving backwards immediately into a car if possible? 
        // Standard crossy road allows any move.
        
        const newY = playerGridPos.y + dy;
        
        // Check bounds
        if (newY < 0) return; // Can't go below start

        playerGridPos.x += dx;
        playerGridPos.y = newY;

        // Clamp X
        if (playerGridPos.x > 5) playerGridPos.x = 5;
        if (playerGridPos.x < -5) playerGridPos.x = -5;

        updatePlayerVisuals();

        // Generate new lanes if moving up
        if (dy > 0) {
            score++;
            scoreEl.innerText = score;
            addLane(lanes.length);
        }
    };

    function updatePlayerVisuals() {
        // Bottom position based on grid Y
        const bottomPx = (playerGridPos.y * LANE_HEIGHT) + 15;
        
        // Left position based on grid X
        // Map -5..5 to 0%..100%
        // Center (0) is 50%.
        // 1 unit = 10%.
        const leftPct = 50 + (playerGridPos.x * 8);

        playerEl.style.bottom = bottomPx + 'px';
        playerEl.style.left = leftPct + '%';
    }

    function updateCamera() {
        // Target: Keep player at ~40% from bottom of screen
        const targetBottom = (playerGridPos.y * LANE_HEIGHT) + 15;
        const screenCenter = window.innerHeight * 0.4; 
        
        // Calculate needed board translation
        // If player is at 800px (Y=10), and we want them at 300px screen height...
        // We need to move board down (positive Y) so 800px becomes 300px?
        // No, board moves UP (negative Y) as we go forward (positive Y).
        
        // Current Board Y offset
        const desiredBoardY = - (targetBottom - screenCenter);
        
        // Smooth lerp
        cameraY += (desiredBoardY - cameraY) * 0.1;
        
        board.style.transform = `rotateX(25deg) translateY(${BOARD_INIT_OFFSET + cameraY}px)`;
    }

    function gameOver() {
        isGameOver = true;
        if (score > bestScore) {
            bestScore = score;
            bestEl.innerText = bestScore;
        }
        
        // Visual Death
        playerEl.style.transform = 'translateX(-50%) rotate(90deg) scale(0.8)';
        playerEl.style.transition = 'all 0.3s';
        playerEl.style.opacity = '0.5';
        
        setTimeout(() => {
            alert(`Game Over!\nScore: ${score}\nBest: ${bestScore}\n\nClick OK to restart.`);
            resetGame();
        }, 800);
    }

    function resetGame() {
        isGameOver = false;
        score = 0;
        scoreEl.innerText = '0';
        playerGridPos = { x: 0, y: 2 };
        cameraY = 0;
        
        // Reset Player Style
        playerEl.style.transform = 'translateX(-50%)';
        playerEl.style.opacity = '1';
        playerEl.style.transition = 'left 0.1s ease-out, bottom 0.1s ease-out';

        // Clear Board
        board.innerHTML = '';
        lanes = [];
        
        init();
    }

    // --- INPUT ---
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp') movePlayer(0, 1);
        if (e.key === 'ArrowDown') movePlayer(0, -1);
        if (e.key === 'ArrowLeft') movePlayer(-1, 0);
        if (e.key === 'ArrowRight') movePlayer(1, 0);
    });

    // --- START ---
    init();

</script>
</body>
</html>
