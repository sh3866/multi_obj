<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Low Poly Crossy</title>
<style>
    :root {
        /* Palette */
        --sky-top: #2980b9;
        --sky-bot: #6dd5fa;
        --grass-top: #8bc34a;
        --grass-side: #558b2f;
        --road-top: #37474f;
        --road-side: #263238;
        --water-top: #29b6f6;
        --water-side: #0288d1;
        --wood-top: #8d6e63;
        --wood-side: #5d4037;
        --chicken-white: #fff9c4;
        --chicken-side: #fbc02d;
        --ui-bg: rgba(38, 50, 56, 0.85);
        --ui-text: #ffffff;
        --accent: #ffeb3b;
    }

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }

    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bot) 100%);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* --- 2.5D SCENE --- */
    #scene {
        width: 100%;
        height: 100%;
        max-width: 500px; /* Mobile portrait aspect */
        position: relative;
        overflow: hidden;
        /* Perspective creates the depth */
        perspective: 600px;
        perspective-origin: 50% 20%;
    }

    /* --- HUD: Top Corners, No Occlusion --- */
    .hud {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 80px;
        z-index: 100;
        pointer-events: none;
        padding: 20px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }

    .score-panel {
        background: var(--ui-bg);
        color: var(--ui-text);
        padding: 10px 20px;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 90px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        border: 2px solid rgba(255,255,255,0.1);
        backdrop-filter: blur(5px);
        transform: skewX(-10deg); /* Stylized tilt */
    }

    .score-panel span:first-child {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        opacity: 0.7;
        font-weight: 700;
        margin-bottom: 4px;
        transform: skewX(10deg); /* Counter skew text */
    }

    .score-panel span:last-child {
        font-size: 32px;
        font-weight: 900;
        line-height: 1;
        color: var(--accent);
        text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        transform: skewX(10deg);
    }

    /* --- GAME WORLD --- */
    #world {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        /* Base Tilt for Isometric look */
        transform: rotateX(28deg) translateY(-150px);
        transition: transform 0.1s linear; /* Smooth camera following */
    }

    /* --- LANES --- */
    .lane {
        width: 100%;
        height: 100px;
        position: absolute;
        left: 0;
        transform-style: preserve-3d;
    }

    /* Grass */
    .lane.grass {
        background-color: var(--grass-top);
        /* Texture */
        background-image: radial-gradient(circle, rgba(255,255,255,0.15) 1px, transparent 2px);
        background-size: 20px 20px;
    }
    /* Grass Extrusion (The "Side" of the block) */
    .lane.grass::after {
        content: '';
        position: absolute;
        bottom: -20px; /* Thickness */
        left: 0;
        width: 100%;
        height: 20px;
        background: var(--grass-side);
        transform-origin: top;
        transform: rotateX(-90deg);
    }

    /* Road */
    .lane.road {
        background-color: var(--road-top);
        /* Asphalt texture */
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
    }
    .lane.road::after {
        content: '';
        position: absolute;
        bottom: -20px;
        left: 0;
        width: 100%;
        height: 20px;
        background: var(--road-side);
        transform-origin: top;
        transform: rotateX(-90deg);
    }
    /* Road Lines */
    .lane.road::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        height: 4px;
        background: repeating-linear-gradient(90deg, #fff 0, #fff 40px, transparent 40px, transparent 80px);
        transform: translateY(-50%);
        opacity: 0.5;
    }

    /* Water */
    .lane.water {
        background-color: var(--water-top);
        background-image: linear-gradient(90deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0.1) 100%);
        background-size: 200px 100%;
        animation: waterShimmer 3s infinite linear;
    }
    .lane.water::after {
        content: '';
        position: absolute;
        bottom: -20px;
        left: 0;
        width: 100%;
        height: 20px;
        background: var(--water-side);
        transform-origin: top;
        transform: rotateX(-90deg);
    }

    @keyframes waterShimmer { from { background-position: 0 0; } to { background-position: 200px 0; } }

    /* --- OBJECTS --- */
    .obj {
        position: absolute;
        top: 20px; /* Centered on lane */
        transform-style: preserve-3d;
        will-change: transform;
    }

    /* Cars */
    .car {
        width: 80px;
        height: 40px;
        position: relative;
    }
    /* Car Body (Top) */
    .car-body {
        position: absolute;
        width: 100%;
        height: 100%;
        background: #ef5350;
        border-radius: 6px;
        box-shadow: inset 0 -5px 0 rgba(0,0,0,0.2);
    }
    /* Car Extrusion (Sides) */
    .car-body::after {
        content: '';
        position: absolute;
        bottom: -12px;
        left: 0;
        width: 100%;
        height: 12px;
        background: #c62828;
        transform-origin: top;
        transform: rotateX(-90deg);
        border-radius: 0 0 4px 4px;
    }
    /* Car Roof */
    .car-roof {
        position: absolute;
        top: -20px;
        left: 15px;
        width: 50px;
        height: 20px;
        background: #ff8a80;
        border-radius: 4px 4px 0 0;
        box-shadow: inset 0 -2px 0 rgba(0,0,0,0.1);
    }
    .car-roof::after {
        content: '';
        position: absolute;
        bottom: -12px; /* Match body extrusion */
        left: 0;
        width: 100%;
        height: 12px;
        background: #e57373;
        transform-origin: top;
        transform: rotateX(-90deg);
    }
    /* Wheels */
    .car-wheel {
        position: absolute;
        bottom: -4px;
        width: 14px;
        height: 14px;
        background: #212121;
        border-radius: 50%;
        border: 2px solid #424242;
        z-index: 2;
    }
    .car-wheel.fl { left: 10px; }
    .car-wheel.fr { right: 10px; }

    /* Truck Variant */
    .truck .car-body { background: #ffca28; }
    .truck .car-body::after { background: #f57f17; }
    .truck .car-roof { background: #ffe082; top: -30px; height: 30px; left: 10px; width: 35px; }
    .truck .car-roof::after { background: #ffd54f; height: 12px; bottom: -12px; }
    .truck { width: 120px; }

    /* Log */
    .log {
        width: 100px;
        height: 35px;
        position: relative;
    }
    .log-top {
        position: absolute;
        inset: 0;
        background: var(--wood-top);
        border-radius: 4px;
        border: 2px solid rgba(0,0,0,0.1);
    }
    .log-top::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 0;
        width: 100%;
        height: 10px;
        background: var(--wood-side);
        transform-origin: top;
        transform: rotateX(-90deg);
    }
    /* Log Ring Detail */
    .log-top::before {
        content: '';
        position: absolute;
        right: 5px; top: 5px; bottom: 5px; width: 8px;
        border-radius: 50%;
        border: 2px solid rgba(0,0,0,0.1);
        background: repeating-linear-gradient(0deg, transparent 0, transparent 4px, rgba(0,0,0,0.1) 5px);
    }

    /* --- PLAYER --- */
    #player-anchor {
        position: absolute;
        width: 60px;
        height: 60px;
        z-index: 50;
        left: 50%;
        transform: translateX(-50%);
        /* Center point is bottom of the chicken */
        transform-origin: bottom center;
        transition: left 0.1s ease-out, bottom 0.2s ease-out;
    }

    .chicken {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        animation: bob 0.6s infinite alternate ease-in-out;
    }

    /* Chicken Shadow */
    .shadow {
        position: absolute;
        bottom: -5px;
        left: 10px;
        width: 40px;
        height: 10px;
        background: rgba(0,0,0,0.4);
        border-radius: 50%;
        transform: translateZ(-5px);
        filter: blur(4px);
    }

    /* Chicken Body */
    .body {
        position: absolute;
        width: 40px;
        height: 40px;
        background: var(--chicken-white);
        bottom: 0;
        left: 10px;
        border-radius: 8px 8px 4px 4px;
        box-shadow: inset 0 -5px 0 rgba(0,0,0,0.1);
    }
    /* Body Extrusion */
    .body::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 0;
        width: 100%;
        height: 10px;
        background: var(--chicken-side);
        transform-origin: top;
        transform: rotateX(-90deg);
        border-radius: 0 0 4px 4px;
    }

    /* Chicken Head */
    .head {
        position: absolute;
        top: -15px;
        right: 2px;
        width: 30px;
        height: 30px;
        background: var(--chicken-white);
        border-radius: 6px;
        box-shadow: inset 0 -3px 0 rgba(0,0,0,0.1);
        z-index: 2;
    }
    /* Head Extrusion */
    .head::after {
        content: '';
        position: absolute;
        bottom: -8px;
        left: 0;
        width: 100%;
        height: 8px;
        background: var(--chicken-side);
        transform-origin: top;
        transform: rotateX(-90deg);
    }

    /* Comb */
    .comb {
        position: absolute;
        top: -8px;
        left: 5px;
        width: 12px;
        height: 10px;
        background: #e53935;
        border-radius: 4px 4px 0 0;
        z-index: 3;
    }

    /* Face */
    .face {
        position: absolute;
        top: 8px;
        right: 2px;
    }
    .eye {
        width: 6px; height: 6px;
        background: #3e2723;
        border-radius: 50%;
        position: absolute;
        top: 0; right: 0;
    }
    .beak {
        width: 8px; height: 6px;
        background: #ffb300;
        position: absolute;
        top: 8px; right: 2px;
        clip-path: polygon(0 0, 100% 50%, 0 100%);
    }

    @keyframes bob {
        0% { transform: translateY(0); }
        100% { transform: translateY(-4px); }
    }

    /* --- CONTROLS: Bottom Right --- */
    .controls {
        position: absolute;
        bottom: 30px;
        right: 30px;
        width: 160px;
        height: 160px;
        z-index: 200;
        pointer-events: auto;
    }

    .d-pad {
        position: relative;
        width: 100%;
        height: 100%;
    }

    .btn {
        position: absolute;
        width: 60px;
        height: 60px;
        background: rgba(255,255,255,0.9);
        border-radius: 16px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        box-shadow: 0 8px 0 #b0bec5, 0 15px 20px rgba(0,0,0,0.2);
        transition: transform 0.1s, box-shadow 0.1s;
        -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
        transform: translateY(6px);
        box-shadow: 0 2px 0 #b0bec5, 0 5px 10px rgba(0,0,0,0.2);
    }

    .btn svg { 
        width: 30px; height: 30px; 
        fill: #546e7a; 
        filter: drop-shadow(0 1px 0 rgba(255,255,255,0.8));
    }

    .btn-up { top: 0; left: 50px; }
    .btn-down { bottom: 0; left: 50px; }
    .btn-left { top: 50px; left: 0; }
    .btn-right { top: 50px; right: 0; }

    /* --- DECORATIONS --- */
    .cloud {
        position: absolute;
        background: rgba(255,255,255,0.7);
        border-radius: 50px;
        z-index: -1;
        animation: floatCloud linear infinite;
    }
    .cloud::after, .cloud::before {
        content: ''; position: absolute; background: inherit; border-radius: 50%;
    }
    .cloud::after { width: 40px; height: 40px; top: -20px; left: 15px; }
    .cloud::before { width: 50px; height: 50px; top: -25px; left: 40px; }

    @keyframes floatCloud {
        from { transform: translateX(-200px); }
        to { transform: translateX(100vw); }
    }

    /* Trees */
    .tree {
        position: absolute;
        transform-style: preserve-3d;
        transform: translateZ(10px);
    }
    .trunk {
        width: 12px; height: 20px;
        background: #795548;
        margin: 0 auto;
        border-radius: 2px;
        box-shadow: inset 0 -5px 0 rgba(0,0,0,0.2);
    }
    .leaves {
        width: 0; height: 0;
        border-left: 25px solid transparent;
        border-right: 25px solid transparent;
        border-bottom: 60px solid #2e7d32;
        filter: drop-shadow(0 5px 0 #1b5e20);
        margin-bottom: -5px;
    }
    .leaves::after {
        content: ''; position: absolute; top: 30px; left: -25px;
        border-left: 25px solid transparent;
        border-right: 25px solid transparent;
        border-bottom: 55px solid #43a047;
    }

</style>
</head>
<body>

<div id="scene">
    <!-- HUD: Repositioned to extreme corners -->
    <div class="hud">
        <div class="score-panel">
            <span>Score</span>
            <span id="score">0</span>
        </div>
        <div class="score-panel">
            <span>Best</span>
            <span id="best">0</span>
        </div>
    </div>

    <!-- Clouds -->
    <div class="cloud" style="top: 5%; width: 120px; height: 40px; animation-duration: 45s;"></div>
    <div class="cloud" style="top: 18%; width: 160px; height: 50px; animation-duration: 35s; animation-delay: -15s;"></div>
    <div class="cloud" style="top: 10%; width: 100px; height: 35px; animation-duration: 55s; animation-delay: -30s;"></div>

    <!-- GAME WORLD -->
    <div id="world">
        <!-- JS Injects Lanes Here -->
    </div>

    <!-- PLAYER -->
    <div id="player-anchor">
        <div class="chicken">
            <div class="comb"></div>
            <div class="head">
                <div class="face">
                    <div class="eye"></div>
                    <div class="beak"></div>
                </div>
            </div>
            <div class="body"></div>
            <div class="shadow"></div>
        </div>
    </div>

    <!-- CONTROLS: Repositioned to Bottom Right -->
    <div class="controls">
        <div class="d-pad">
            <div class="btn btn-up" onclick="movePlayer(0, 1)">
                <svg viewBox="0 0 24 24"><path d="M12 4L4 12h6v8h4v-8h6z"/></svg>
            </div>
            <div class="btn btn-down" onclick="movePlayer(0, -1)">
                <svg viewBox="0 0 24 24"><path d="M12 20l8-8h-6V4h-4v8H4z"/></svg>
            </div>
            <div class="btn btn-left" onclick="movePlayer(-1, 0)">
                <svg viewBox="0 0 24 24"><path d="M20 12l-8-8v6H4v4h8v6z"/></svg>
            </div>
            <div class="btn btn-right" onclick="movePlayer(1, 0)">
                <svg viewBox="0 0 24 24"><path d="M4 12l8 8v-6h8v-4H12V4z"/></svg>
            </div>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    const LANE_HEIGHT = 100;
    const BOARD_INIT_OFFSET = -150;
    const START_LANES = 15;
    
    // --- STATE ---
    let score = 0;
    let bestScore = 0;
    let playerGridPos = { x: 0, y: 3 };
    let lanes = [];
    let gameLoopId;
    let isGameOver = false;
    let cameraY = 0;

    // --- ELEMENTS ---
    const world = document.getElementById('world');
    const playerEl = document.getElementById('player-anchor');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');

    // --- INITIALIZATION ---
    function init() {
        for (let i = 0; i < START_LANES; i++) {
            addLane(i);
        }
        updatePlayerVisuals();
        gameLoop();
    }

    // --- LANE GENERATION ---
    function addLane(count) {
        const index = count; 
        let type = 'grass';
        
        // Procedural Logic
        if (index > 1) {
            const r = Math.random();
            if (r < 0.45) type = 'road';
            else if (r < 0.75) type = 'water';
            else type = 'grass';
        }

        const lane = document.createElement('div');
        lane.className = `lane ${type}`;
        lane.style.bottom = (index * LANE_HEIGHT) + 'px';
        
        let contentEl = null;
        let speed = 0;
        let xPos = 0;

        if (type === 'road') {
            const isTruck = Math.random() > 0.7;
            const dir = Math.random() > 0.5 ? 1 : -1;
            speed = (1.5 + Math.random() * 2.5) * dir;
            xPos = dir > 0 ? -150 : 120; 
            
            contentEl = document.createElement('div');
            contentEl.className = `obj car ${isTruck ? 'truck' : ''}`;
            contentEl.innerHTML = `
                <div class="car-body"></div>
                <div class="car-roof"></div>
                <div class="car-wheel fl"></div>
                <div class="car-wheel fr"></div>
            `;
            lane.appendChild(contentEl);
        } 
        else if (type === 'water') {
            const dir = Math.random() > 0.5 ? 1 : -1;
            speed = (0.8 + Math.random() * 1.2) * dir;
            xPos = dir > 0 ? -150 : 120;

            contentEl = document.createElement('div');
            contentEl.className = 'obj log';
            contentEl.innerHTML = '<div class="log-top"></div>';
            lane.appendChild(contentEl);
        } 
        else if (type === 'grass') {
            if (Math.random() > 0.6) {
                const tree = document.createElement('div');
                tree.className = 'tree';
                tree.innerHTML = '<div class="leaves"></div><div class="trunk"></div>';
                tree.style.left = (Math.random() * 80 + 10) + '%';
                tree.style.bottom = (Math.random() * 30 + 10) + 'px';
                lane.appendChild(tree);
            }
        }

        world.appendChild(lane);

        lanes.push({
            element: lane,
            type: type,
            index: index,
            content: contentEl,
            speed: speed,
            x: xPos
        });
    }

    // --- GAME LOOP ---
    function gameLoop() {
        if (!isGameOver) {
            lanes.forEach(l => {
                if (l.content) {
                    l.x += l.speed;
                    if (l.speed > 0 && l.x > 120) l.x = -150;
                    if (l.speed < 0 && l.x < -150) l.x = 120;
                    
                    l.content.style.transform = `translateX(${l.x}%)`;
                }
            });

            checkCollisions();
            updateCamera();
        }
        requestAnimationFrame(gameLoop);
    }

    // --- COLLISION LOGIC ---
    function checkCollisions() {
        const currentLane = lanes.find(l => l.index === playerGridPos.y);
        if (!currentLane) return;

        // Player X in Percentage (-5 to 5 maps to 0% to 100%)
        // Screen width is roughly 100%. Grid is 10 units.
        // 1 unit = 10%. Center is 50%.
        const pCenterPct = 50 + (playerGridPos.x * 8);
        const pRadiusPct = 3.5; // Slightly smaller hitbox for forgiveness

        const pLeft = pCenterPct - pRadiusPct;
        const pRight = pCenterPct + pRadiusPct;

        if (currentLane.type === 'road') {
            const carObj = currentLane.content;
            const carWidth = carObj.classList.contains('truck') ? 24 : 16; 
            const cLeft = currentLane.x;
            const cRight = currentLane.x + carWidth;

            if (pLeft < cRight && pRight > cLeft) {
                gameOver();
            }
        } 
        else if (currentLane.type === 'water') {
            const logObj = currentLane.content;
            const logWidth = 18; 
            const lLeft = currentLane.x;
            const lRight = currentLane.x + logWidth;

            if (pLeft < lRight && pRight > lLeft) {
                // Riding Log
                playerGridPos.x += (currentLane.speed * 0.03); 
                
                // Clamp player on log
                if (playerGridPos.x > 5) playerGridPos.x = 5;
                if (playerGridPos.x < -5) playerGridPos.x = -5;
                
                updatePlayerVisuals();
            } else {
                // Drown
                gameOver();
            }
        }
    }

    // --- MOVEMENT ---
    window.movePlayer = function(dx, dy) {
        if (isGameOver) {
            resetGame();
            return;
        }

        const newY = playerGridPos.y + dy;
        
        if (newY < 0) return; // Can't go below start

        playerGridPos.x += dx;
        playerGridPos.y = newY;

        // Clamp X
        if (playerGridPos.x > 5) playerGridPos.x = 5;
        if (playerGridPos.x < -5) playerGridPos.x = -5;

        updatePlayerVisuals();

        if (dy > 0) {
            score++;
            scoreEl.innerText = score;
            addLane(lanes.length);
        }
    };

    function updatePlayerVisuals() {
        const bottomPx = (playerGridPos.y * LANE_HEIGHT) + 20;
        const leftPct = 50 + (playerGridPos.x * 8); // 8% per unit

        playerEl.style.bottom = bottomPx + 'px';
        playerEl.style.left = leftPct + '%';
    }

    function updateCamera() {
        // Target: Keep player at ~40% from bottom of screen
        const targetBottom = (playerGridPos.y * LANE_HEIGHT) + 20;
        const screenCenter = window.innerHeight * 0.4; 
        
        const desiredBoardY = - (targetBottom - screenCenter);
        
        cameraY += (desiredBoardY - cameraY) * 0.1;
        
        world.style.transform = `rotateX(28deg) translateY(${BOARD_INIT_OFFSET + cameraY}px)`;
    }

    function gameOver() {
        isGameOver = true;
        if (score > bestScore) {
            bestScore = score;
            bestEl.innerText = bestScore;
        }
        
        playerEl.style.transform = 'translateX(-50%) rotate(90deg) scale(0.8)';
        playerEl.style.transition = 'all 0.3s';
        playerEl.style.opacity = '0.5';
        
        setTimeout(() => {
            alert(`Game Over!\nScore: ${score}\nBest: ${bestScore}\n\nClick OK to restart.`);
            resetGame();
        }, 800);
    }

    function resetGame() {
        isGameOver = false;
        score = 0;
        scoreEl.innerText = '0';
        playerGridPos = { x: 0, y: 3 };
        cameraY = 0;
        
        playerEl.style.transform = 'translateX(-50%)';
        playerEl.style.opacity = '1';
        playerEl.style.transition = 'left 0.1s ease-out, bottom 0.2s ease-out';

        world.innerHTML = '';
        lanes = [];
        
        init();
    }

    // --- INPUT ---
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp') movePlayer(0, 1);
        if (e.key === 'ArrowDown') movePlayer(0, -1);
        if (e.key === 'ArrowLeft') movePlayer(-1, 0);
        if (e.key === 'ArrowRight') movePlayer(1, 0);
    });

    // --- START ---
    init();

</script>
</body>
</html>
