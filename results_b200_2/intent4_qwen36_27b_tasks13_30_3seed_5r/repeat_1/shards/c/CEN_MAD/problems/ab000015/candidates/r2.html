<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Alpine Velocity: Sliding Challenge</title>
<style>
    :root {
        --sky-top: #020617;
        --sky-mid: #0f172a;
        --ice-deep: #1e3a8a;
        --ice-light: #e0f2fe;
        --ice-highlight: #ffffff;
        --hud-bg: rgba(2, 6, 23, 0.6);
        --hud-border: rgba(255, 255, 255, 0.15);
        --accent-cyan: #22d3ee;
        --accent-orange: #f97316;
        --font-main: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        margin: 0;
        padding: 0;
    }

    body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--sky-top);
        font-family: var(--font-main);
        color: white;
    }

    #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-mid) 30%, transparent 60%);
    }

    /* --- 1. Environment & Atmosphere --- */
    
    /* Noise Overlay for Snow Grain */
    .noise-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 20;
        opacity: 0.4;
        mix-blend-mode: overlay;
    }

    /* --- 2. Sensation of Speed (CSS Motion Streaks) --- */
    .speed-streaks {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 4;
        overflow: hidden;
    }
    
    .streak {
        position: absolute;
        background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.8), transparent);
        width: 2px;
        height: 100px;
        opacity: 0;
        animation: rush 0.4s linear infinite;
    }

    @keyframes rush {
        0% { transform: translateY(-200px) scaleY(0.5); opacity: 0; }
        20% { opacity: 0.6; }
        100% { transform: translateY(100vh) scaleY(1.5); opacity: 0; }
    }

    /* --- Layers --- */
    .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    
    #mountains { z-index: 1; }
    #slope-canvas { z-index: 2; display: block; }
    #entities-layer { z-index: 3; }
    #player-layer { z-index: 5; }

    /* --- 3. Character Redesign --- */
    #player {
        position: absolute;
        bottom: 18%;
        left: 50%;
        width: 120px;
        height: 120px;
        transform: translate(-50%, 0);
        filter: drop-shadow(0 20px 15px rgba(0,0,0,0.6));
        transition: left 0.05s linear;
    }

    .rider-svg { width: 100%; height: 100%; }

    /* --- 4. Obstacles & Readability --- */
    .obstacle {
        position: absolute;
        transform: translate(-50%, -50%);
        filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
    }

    /* Flat 2.5D Rock */
    .rock-obs svg { width: 100%; height: 100%; }
    .rock-face-dark { fill: #1e293b; }
    .rock-face-light { fill: #334155; }
    .rock-outline { fill: none; stroke: var(--accent-cyan); stroke-width: 2; stroke-linejoin: round; filter: drop-shadow(0 0 5px var(--accent-cyan)); }

    /* Gates */
    .gate-obs svg { width: 100%; height: 100%; }
    .gate-pole { stroke: #e2e8f0; stroke-width: 3; }
    .gate-bar { stroke: var(--accent-orange); stroke-width: 4; filter: drop-shadow(0 0 8px var(--accent-orange)); }

    /* --- 5. UI Polish & Hierarchy --- */
    #hud-layer {
        z-index: 10;
        padding: 24px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 100%;
    }

    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }

    .stat-box {
        background: var(--hud-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--hud-border);
        padding: 10px 18px;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .stat-label {
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #94a3b8;
        margin-bottom: 4px;
        font-weight: 700;
    }

    .stat-value {
        font-size: 1.8rem;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        color: white;
        text-shadow: 0 0 10px rgba(255,255,255,0.3);
        line-height: 1;
    }

    .stat-unit {
        font-size: 0.7rem;
        color: var(--accent-cyan);
        margin-left: 4px;
        font-weight: 600;
    }

    /* Progress Bar */
    .progress-container {
        position: absolute;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: 240px;
        height: 8px;
        background: rgba(0,0,0,0.5);
        border-radius: 4px;
        overflow: hidden;
        border: 1px solid var(--hud-border);
        backdrop-filter: blur(4px);
    }

    .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--accent-cyan), #fff);
        box-shadow: 0 0 15px var(--accent-cyan);
        transition: width 0.1s linear;
    }

    /* Controls */
    .controls-area {
        display: flex;
        justify-content: space-between;
        padding: 0 20px 30px 20px;
    }

    .control-btn {
        width: 90px;
        height: 90px;
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 24px; /* Squircle */
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
        cursor: pointer;
        transition: all 0.1s;
        -webkit-tap-highlight-color: transparent;
        /* Tactile Inner Shadow */
        box-shadow: inset 0 2px 4px rgba(255,255,255,0.1), 0 8px 16px rgba(0,0,0,0.3);
    }

    .control-btn:active, .control-btn.active {
        background: rgba(255, 255, 255, 0.2);
        border-color: var(--accent-cyan);
        transform: scale(0.96);
        box-shadow: inset 0 2px 8px rgba(0,0,0,0.4), 0 4px 8px rgba(0,0,0,0.3);
    }

    .control-btn svg {
        width: 40px;
        height: 40px;
        fill: white;
        filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
    }

</style>
</head>
<body>

<div id="game-container">
    <!-- Noise Overlay -->
    <div class="noise-overlay"></div>

    <!-- Mountain Background (Static) -->
    <svg id="mountains" class="layer" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
        <defs>
            <linearGradient id="mtnGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
            </linearGradient>
        </defs>
        <!-- Sharp jagged peaks -->
        <path d="M0 500 L100 350 L250 500 L350 300 L500 500 L650 280 L800 500 L900 380 L1000 500 L1000 1000 L0 1000 Z" fill="url(#mtnGrad1)" />
    </svg>

    <!-- Slope Surface (Canvas) -->
    <canvas id="slope-canvas" class="layer"></canvas>

    <!-- Speed Lines (CSS) -->
    <div class="speed-streaks" id="streaks-container"></div>

    <!-- Game Entities -->
    <div id="entities-layer" class="layer"></div>

    <!-- Player -->
    <div id="player-layer" class="layer">
        <div id="player">
            <svg class="rider-svg" viewBox="0 0 100 120">
                <!-- Wind Trail / Scarf -->
                <path d="M45 45 Q20 50 10 35 Q25 60 40 55" fill="rgba(34, 211, 238, 0.6)" />
                <path d="M45 45 Q25 65 15 80 Q30 65 40 55" fill="rgba(34, 211, 238, 0.4)" />
                
                <!-- Snowboard -->
                <path d="M15 105 Q50 115 85 105 L80 100 Q50 110 20 100 Z" fill="#0f172a" />
                <path d="M20 100 Q50 110 80 100 L75 102 Q50 112 25 102 Z" fill="#22d3ee" /> <!-- Board bottom -->
                
                <!-- Legs -->
                <path d="M40 70 L30 100" stroke="#020617" stroke-width="10" stroke-linecap="round" />
                <path d="M60 70 L70 100" stroke="#020617" stroke-width="10" stroke-linecap="round" />
                
                <!-- Body -->
                <path d="M30 70 L50 35 L70 70 Z" fill="#ef4444" /> <!-- Jacket -->
                
                <!-- Geometric Helmet -->
                <rect x="38" y="20" width="24" height="22" rx="8" fill="#f8fafc" /> <!-- Helmet Base -->
                <path d="M38 28 L62 28 L62 36 Q50 42 38 36 Z" fill="#0f172a" /> <!-- Visor -->
                <path d="M38 28 L62 28 L62 30 Q50 36 38 30 Z" fill="#22d3ee" opacity="0.8"/> <!-- Visor Glint -->
            </svg>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud-layer" class="layer">
        <div class="top-bar">
            <div class="stat-box">
                <span class="stat-label">Speed</span>
                <span class="stat-value" id="speed-val">0 <span class="stat-unit">km/h</span></span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Distance</span>
                <span class="stat-value" id="dist-val">0 <span class="stat-unit">m</span></span>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-fill" id="progress-bar"></div>
        </div>

        <div class="controls-area">
            <div class="control-btn" id="btn-left">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </div>
            <div class="control-btn" id="btn-right">
                <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </div>
        </div>
    </div>
</div>

<script>
    // --- Configuration & State ---
    const canvas = document.getElementById('slope-canvas');
    const ctx = canvas.getContext('2d');
    const entitiesLayer = document.getElementById('entities-layer');
    const streaksContainer = document.getElementById('streaks-container');
    const playerEl = document.getElementById('player');
    const speedVal = document.getElementById('speed-val');
    const distVal = document.getElementById('dist-val');
    const progressBar = document.getElementById('progress-bar');

    let width, height;
    let gameFrame = 0;
    let speed = 0;
    let targetSpeed = 140; // Higher target for sensation
    let distance = 0;
    let playerX = 0.5; // 0 to 1
    let targetPlayerX = 0.5;
    
    // Perspective Constants
    const horizonY = 0.3; // Horizon lower for steeper slope
    const vanishPointX = 0.5;
    
    // Game Objects
    const obstacles = [];
    
    // Input State
    let input = { left: false, right: false };

    // --- Initialization ---
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        initSpeedStreaks();
    }
    window.addEventListener('resize', resize);
    resize();

    // --- 2. Speed Streaks Logic ---
    function initSpeedStreaks() {
        streaksContainer.innerHTML = '';
        const count = 15;
        for(let i=0; i<count; i++) {
            const streak = document.createElement('div');
            streak.className = 'streak';
            streak.style.left = Math.random() * 100 + '%';
            streak.style.animationDuration = (Math.random() * 0.3 + 0.2) + 's';
            streak.style.animationDelay = (Math.random() * 2) + 's';
            streaksContainer.appendChild(streak);
        }
    }

    // --- Game Logic ---

    function updatePhysics() {
        // Acceleration
        if (speed < targetSpeed) speed += 0.2;
        if (speed > 10) speed += (Math.random() - 0.5); // Jitter
        
        // Lateral Movement
        const moveSpeed = 0.012;
        if (input.left) targetPlayerX -= moveSpeed;
        if (input.right) targetPlayerX += moveSpeed;
        
        // Boundaries
        if (targetPlayerX < 0.15) targetPlayerX = 0.15;
        if (targetPlayerX > 0.85) targetPlayerX = 0.85;

        // Smooth player movement
        playerX += (targetPlayerX - playerX) * 0.15;
        
        // Update DOM
        playerEl.style.left = `${playerX * 100}%`;
        
        // Tilt player based on movement
        const tilt = (targetPlayerX - playerX) * 300;
        playerEl.style.transform = `translate(-50%, 0) rotate(${15 + tilt}deg)`;

        // Update HUD
        if(gameFrame < 10) speed = 90; // Start fast
        
        speedVal.innerHTML = Math.floor(speed) + ' <span class="stat-unit">km/h</span>';
        distance += speed * 0.015;
        distVal.innerHTML = Math.floor(distance) + ' <span class="stat-unit">m</span>';
        
        // Progress loop
        let progress = (distance % 1000) / 10;
        progressBar.style.width = `${progress}%`;

        // Obstacle Spawning
        // Spawn rate increases with speed
        if (Math.random() < 0.02 + (speed/10000)) {
            spawnObstacle();
        }
        
        // Update Obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            // Move towards camera (0 is horizon, 1 is near)
            obs.z -= speed * 0.0002; 
            
            // Collision Detection
            // Check if obstacle is at player depth (approx 0.85)
            if (obs.z > 0.82 && obs.z < 0.92) {
                if (Math.abs(obs.x - playerX) < 0.06) {
                    // Hit!
                    speed *= 0.4; // Crash slowdown
                    // Visual feedback could go here (shake screen)
                }
            }

            // Remove if passed camera
            if (obs.z > 1.2) {
                if(obs.el) obs.el.remove();
                obstacles.splice(i, 1);
            } else {
                renderObstacle(obs);
            }
        }
    }

    function spawnObstacle() {
        const rand = Math.random();
        let type = 'rock';
        if (rand > 0.5) type = 'gate';
        
        // Spawn X (0 to 1)
        const x = 0.2 + Math.random() * 0.6;
        const el = document.createElement('div');
        el.className = 'obstacle ' + (type === 'gate' ? 'gate-obs' : 'rock-obs');
        
        if (type === 'gate') {
            el.innerHTML = `
                <svg viewBox="0 0 100 100">
                    <line x1="10" y1="100" x2="10" y2="10" class="gate-pole" />
                    <line x1="90" y1="100" x2="90" y2="10" class="gate-pole" />
                    <line x1="10" y1="25" x2="90" y2="25" class="gate-bar" />
                    <rect x="15" y="10" width="20" height="25" fill="#ef4444" rx="2" />
                    <rect x="65" y="10" width="20" height="25" fill="#ef4444" rx="2" />
                </svg>
            `;
        } else {
            // Flat 2.5D Rock with Neon Outline
            el.innerHTML = `
                <svg viewBox="0 0 100 60">
                    <!-- Dark Side -->
                    <path d="M10 60 L30 20 L50 35 L90 60 Z" class="rock-face-dark" />
                    <!-- Light Side -->
                    <path d="M30 20 L50 35 L70 10 L90 60 Z" class="rock-face-light" />
                    <!-- Neon Outline -->
                    <path d="M10 60 L30 20 L50 35 L70 10 L90 60 Z" class="rock-outline" />
                </svg>
            `;
        }
        
        entitiesLayer.appendChild(el);
        
        obstacles.push({
            type: type,
            x: x,
            z: 0, // Start at horizon
            el: el
        });
    }

    function renderObstacle(obs) {
        // Perspective Math
        // z=0 is horizon, z=1 is bottom of screen
        const perspective = 1 / (1 - obs.z + 0.1); 
        
        // Map Z to Screen Y
        const yPos = horizonY + (obs.z * (1 - horizonY));
        
        // X Spread (wider as it gets closer)
        const spread = 1.0 + (obs.z * 1.5); 
        const xPos = 0.5 + (obs.x - 0.5) * spread;

        // Scale (small at horizon, big at bottom)
        const scale = 0.2 + (obs.z * 2.5);

        // Base dimensions
        let w = obs.type === 'gate' ? 160 : 100;
        let h = obs.type === 'gate' ? 120 : 80;

        // Apply styles
        const finalW = w * scale;
        const finalH = h * scale;

        obs.el.style.width = `${finalW}px`;
        obs.el.style.height = `${finalH}px`;
        obs.el.style.left = `${xPos * 100}%`;
        obs.el.style.top = `${yPos * 100}%`;
        
        // Simple Z-index sort based on depth
        obs.el.style.zIndex = Math.floor(obs.z * 100);
    }

    // --- Rendering (Canvas) ---

    function drawSlope() {
        ctx.clearRect(0, 0, width, height);
        
        const horizon = height * horizonY;
        
        // 1. Environment & Atmosphere: Tunnel Effect Gradient
        // Center is light cyan/white, edges are deep blue
        const grad = ctx.createRadialGradient(
            width / 2, horizon, 0, 
            width / 2, height, height
        );
        grad.addColorStop(0, '#e0f2fe'); // Light Ice
        grad.addColorStop(0.5, '#7dd3fc'); // Mid Ice
        grad.addColorStop(1, '#1e3a8a'); // Deep Blue Edges

        ctx.fillStyle = grad;
        ctx.fillRect(0, horizon, width, height - horizon);
        
        // 2. Sensation of Speed: Dynamic Grid Lines
        ctx.lineWidth = 2;
        
        // Longitudinal Lines (Vanishing Point)
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        for (let i = -10; i <= 10; i++) {
            let x = (i * width / 10);
            ctx.moveTo(vanishPointX * width, horizon);
            ctx.lineTo(x, height);
        }
        ctx.stroke();
        
        // Transverse Lines (Rushing towards player)
        // Calculate offset based on speed and time
        const lineSpacing = 150;
        const timeOffset = (Date.now() * speed * 0.0005) % lineSpacing;
        
        for (let i = 0; i < 15; i++) {
            // Calculate base Y position for this grid line
            // We want lines to bunch up near horizon (perspective)
            let t = i / 15;
            let perspectiveY = horizon + Math.pow(t, 2.5) * (height - horizon);
            
            // Apply movement
            let currentY = perspectiveY + timeOffset;
            
            // Wrap logic: If it passes bottom, move it to top
            if (currentY > height) currentY -= (height - horizon);
            
            if (currentY > horizon) {
                // Opacity: Fade to 0 at horizon, bright at bottom
                let alpha = Math.pow((currentY - horizon) / (height - horizon), 1.5);
                
                ctx.beginPath();
                ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                
                // Draw horizontal line with slight curve
                ctx.moveTo(0, currentY);
                ctx.quadraticCurveTo(width/2, currentY + 15, width, currentY);
                ctx.stroke();
            }
        }
    }

    // --- Main Loop ---

    function loop() {
        gameFrame++;
        drawSlope();
        updatePhysics();
        requestAnimationFrame(loop);
    }

    // --- Controls ---

    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');

    function handleStart(dir, el) { 
        input[dir] = true; 
        if(el) el.classList.add('active');
    }
    function handleEnd(dir, el) { 
        input[dir] = false; 
        if(el) el.classList.remove('active');
    }

    // Touch/Mouse for buttons
    ['mousedown', 'touchstart'].forEach(evt => {
        btnLeft.addEventListener(evt, (e) => { e.preventDefault(); handleStart('left', btnLeft); });
        btnRight.addEventListener(evt, (e) => { e.preventDefault(); handleStart('right', btnRight); });
    });

    ['mouseup', 'mouseleave', 'touchend'].forEach(evt => {
        btnLeft.addEventListener(evt, (e) => { e.preventDefault(); handleEnd('left', btnLeft); });
        btnRight.addEventListener(evt, (e) => { e.preventDefault(); handleEnd('right', btnRight); });
    });

    // Keyboard support
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') handleStart('left', btnLeft);
        if (e.key === 'ArrowRight') handleStart('right', btnRight);
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') handleEnd('left', btnLeft);
        if (e.key === 'ArrowRight') handleEnd('right', btnRight);
    });

    // Start
    loop();

</script>
</body>
</html>
