<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOCTURNE RUNNER // PROTOCOL 02</title>
    <style>
        :root {
            --sky-top: #240046;
            --sky-bottom: #10002b;
            --ground-color: #050505;
            --accent-color: #7b2cbf;
            --text-light: #e0e0e0;
            --text-dim: #8d99ae;
            --font-ui: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-ui);
        }

        /* Game Container */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 16/9;
            background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
            box-shadow: 0 0 100px rgba(123, 44, 191, 0.1);
            overflow: hidden;
            border-radius: 4px;
        }

        /* Noise Texture Overlay */
        .noise-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Canvas Layer */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            z-index: 20;
        }

        /* HUD Top Right */
        .hud-top {
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
        }

        .score-board {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .score-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        .label {
            font-family: var(--font-ui);
            font-size: 12px;
            font-weight: 800;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .score-val {
            font-family: var(--font-mono);
            font-size: 24px;
            font-weight: 700;
            color: var(--text-light);
            letter-spacing: -1px;
        }

        .hi-score {
            color: var(--accent-color);
            opacity: 0.8;
        }

        /* Speed Indicator (Moved to Top Right per critique) */
        .speed-panel {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            width: 100px;
        }

        .speed-text {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .speed-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .speed-fill {
            height: 100%;
            width: 10%;
            background: var(--accent-color);
            border-radius: 2px;
            transition: width 0.1s linear;
            box-shadow: 0 0 8px var(--accent-color);
        }

        /* Call to Action Center */
        .cta-container {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
            pointer-events: none;
        }

        .cta-text {
            font-family: var(--font-ui);
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
            animation: pulse 2s infinite;
        }

        .cta-sub {
            display: block;
            font-family: var(--font-mono);
            font-size: 12px;
            margin-top: 12px;
            font-weight: 400;
            color: var(--text-dim);
            letter-spacing: 2px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: translateY(0); }
            50% { opacity: 0.7; transform: translateY(5px); }
        }

        /* Game Over Overlay */
        .game-over-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.6);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }

        .game-over-title {
            font-family: var(--font-ui);
            font-size: 42px;
            font-weight: 900;
            color: #fff;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px var(--accent-color);
        }

        /* Vignette */
        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 5;
        }

    </style>
</head>
<body>

    <div class="game-container">
        <div class="noise-overlay"></div>
        <div class="vignette"></div>
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-layer">
            <div class="hud-top">
                <div class="score-board">
                    <div class="score-row">
                        <span class="label">HI</span>
                        <span class="score-val hi-score" id="hiScore">00000</span>
                    </div>
                    <div class="score-row">
                        <span class="label">SCORE</span>
                        <span class="score-val" id="scoreVal">00000</span>
                    </div>
                    
                    <!-- Speed Indicator moved here -->
                    <div class="speed-panel">
                        <div class="speed-text">SPD <span id="speedVal">010</span></div>
                        <div class="speed-bar-container">
                            <div class="speed-fill" id="speedBar"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="cta-container" id="startCta">
                <div class="cta-text">
                    Jump to Start
                    <span class="cta-sub">Space / Tap</span>
                </div>
            </div>
        </div>

        <div class="game-over-overlay" id="gameOverScreen">
            <div class="game-over-title">CRASHED</div>
            <div class="cta-sub" style="margin-top: 20px; color: white; opacity: 0.8;">Tap to Restart</div>
        </div>
    </div>

<script>
    /**
     * NOCTURNE RUNNER
     * Revised Design: Dusk atmosphere, solid ground, high-contrast silhouettes.
     */

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const scoreEl = document.getElementById('scoreVal');
    const hiScoreEl = document.getElementById('hiScore');
    const startCta = document.getElementById('startCta');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const speedBar = document.getElementById('speedBar');
    const speedVal = document.getElementById('speedVal');

    // Game Config
    let GAME_WIDTH = 1000;
    let GAME_HEIGHT = 560;
    const GROUND_HEIGHT_RATIO = 0.15; // 15% height for ground
    let GROUND_Y = 0; // Calculated on resize
    const SILHOUETTE_COLOR = '#050505'; // Near black
    
    const GRAVITY = 0.6;
    const JUMP_FORCE = -13;
    
    // State
    let gameRunning = false;
    let gameOver = false;
    let frame = 0;
    let score = 0;
    let highScore = localStorage.getItem('nocturne_hs') || 0;
    let gameSpeed = 6;
    let baseSpeed = 6;
    
    // Assets
    hiScoreEl.innerText = Math.floor(highScore).toString().padStart(5, '0');

    // Resize Handler
    function resize() {
        const container = canvas.parentElement;
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        GAME_WIDTH = canvas.width;
        GAME_HEIGHT = canvas.height;
        GROUND_Y = GAME_HEIGHT * (1 - GROUND_HEIGHT_RATIO);
        
        // Redraw if static
        if (!gameRunning && !gameOver) drawStaticScene();
    }
    window.addEventListener('resize', resize);
    resize();

    // --- CLASSES ---

    class Dino {
        constructor() {
            this.w = 50;
            this.h = 50;
            this.x = 100;
            this.y = GROUND_Y - this.h;
            this.dy = 0;
            this.grounded = true;
            this.runFrame = 0;
        }

        jump() {
            if (this.grounded) {
                this.dy = JUMP_FORCE;
                this.grounded = false;
                // Create dust particles
                for(let i=0; i<5; i++) {
                    particles.push(new Particle(this.x + this.w/2, this.y + this.h, 'rgba(255,255,255,0.3)'));
                }
            }
        }

        update() {
            this.dy += GRAVITY;
            this.y += this.dy;

            if (this.y + this.h > GROUND_Y) {
                this.y = GROUND_Y - this.h;
                this.dy = 0;
                this.grounded = true;
            }

            if (this.grounded) {
                this.runFrame += 0.2 + (gameSpeed * 0.02);
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.fillStyle = SILHOUETTE_COLOR;

            // Silhouette Logic
            // 1. Body
            ctx.beginPath();
            ctx.moveTo(0, 20);
            ctx.lineTo(20, 20);
            ctx.lineTo(30, 0); // Head top
            ctx.lineTo(45, 0); // Snout
            ctx.lineTo(45, 15); // Snout bottom
            ctx.lineTo(30, 25); // Neck
            ctx.lineTo(30, 40); // Hip
            ctx.lineTo(10, 40); // Tail base
            ctx.lineTo(0, 30); // Tail tip
            ctx.fill();

            // Eye (White dot)
            ctx.fillStyle = '#fff';
            ctx.fillRect(35, 5, 4, 4);

            // Legs
            ctx.fillStyle = SILHOUETTE_COLOR;
            if (!this.grounded) {
                // Tucked legs
                ctx.fillRect(10, 40, 8, 10);
                ctx.fillRect(25, 40, 8, 10);
            } else {
                // Running legs
                const legOffset = Math.sin(this.runFrame) * 10;
                ctx.fillRect(10 + legOffset, 40, 8, 10);
                ctx.fillRect(25 - legOffset, 40, 8, 10);
            }
            
            // Arm
            ctx.fillRect(30, 25, 10, 4);

            ctx.restore();
        }
    }

    class Cactus {
        constructor() {
            this.w = 25 + Math.random() * 15;
            this.h = 40 + Math.random() * 20;
            this.x = GAME_WIDTH + 50;
            this.y = GROUND_Y - this.h;
            this.type = 'cactus';
        }

        update() {
            this.x -= gameSpeed;
        }

        draw() {
            ctx.fillStyle = SILHOUETTE_COLOR;
            ctx.save();
            ctx.translate(this.x, this.y);
            
            // Main Stem
            ctx.fillRect(this.w/3, 0, this.w/1.5, this.h);
            
            // Left Arm
            ctx.fillRect(0, 10, this.w/3, 8);
            ctx.fillRect(0, 0, 8, 18);
            
            // Right Arm
            ctx.fillRect(this.w - this.w/3, 15, this.w/3, 8);
            ctx.fillRect(this.w - 8, 5, 8, 18);
            
            ctx.restore();
        }
    }

    class Bird {
        constructor() {
            this.w = 40;
            this.h = 30;
            this.x = GAME_WIDTH + 50;
            // Heights: Low (jumpable), High (visual)
            const heights = [GROUND_Y - 45, GROUND_Y - 85];
            this.y = heights[Math.floor(Math.random() * heights.length)];
            this.type = 'bird';
            this.wingFrame = 0;
        }

        update() {
            this.x -= gameSpeed;
            this.wingFrame += 0.15;
        }

        draw() {
            ctx.fillStyle = SILHOUETTE_COLOR;
            ctx.save();
            ctx.translate(this.x, this.y);
            
            // Body
            ctx.beginPath();
            ctx.moveTo(0, 15);
            ctx.lineTo(15, 10);
            ctx.lineTo(30, 15);
            ctx.lineTo(15, 20);
            ctx.fill();

            // Wings
            const wingY = Math.sin(this.wingFrame) * 15;
            ctx.beginPath();
            ctx.moveTo(10, 15);
            ctx.lineTo(20, 15 - wingY); // Wing tip
            ctx.lineTo(30, 15);
            ctx.fill();

            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 3 + 1;
            this.speedX = (Math.random() * 2 - 1) - (gameSpeed * 0.5);
            this.speedY = Math.random() * 2 - 1;
            this.color = color;
            this.life = 1.0;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.05;
        }
        draw() {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    // --- WORLD GENERATION ---

    // Background Mountains (Parallax)
    let mountains = [];
    function initMountains() {
        mountains = [];
        let currentX = 0;
        while(currentX < GAME_WIDTH * 2) {
            const w = 100 + Math.random() * 200;
            const h = 50 + Math.random() * 150;
            mountains.push({x: currentX, y: GROUND_Y, w: w, h: h});
            currentX += w - 20; // Overlap
        }
    }

    // Ground Texture (pebbles)
    let groundDetails = [];
    function initGround() {
        groundDetails = [];
        for(let i=0; i<50; i++) {
            groundDetails.push({
                x: Math.random() * GAME_WIDTH,
                y: GROUND_Y + 10 + Math.random() * (GAME_HEIGHT - GROUND_Y - 20),
                w: 2 + Math.random() * 4,
                h: 2 + Math.random() * 2
            });
        }
    }

    // --- GAME LOOP ---

    const dino = new Dino();
    let obstacles = [];
    let particles = [];
    let obstacleTimer = 0;
    let obstacleInterval = 100;

    function spawnObstacle() {
        const type = Math.random() > 0.6 ? 'bird' : 'cactus';
        if (type === 'bird') obstacles.push(new Bird());
        else obstacles.push(new Cactus());
    }

    function resetGame() {
        dino.y = GROUND_Y - dino.h;
        dino.dy = 0;
        obstacles = [];
        particles = [];
        score = 0;
        gameSpeed = baseSpeed;
        gameOver = false;
        gameRunning = true;
        obstacleTimer = 0;
        
        startCta.style.display = 'none';
        gameOverScreen.style.display = 'none';
        
        initMountains();
        initGround();
        animate();
    }

    function checkCollision(rect1, rect2) {
        return (
            rect1.x < rect2.x + rect2.w - 5 && // -5 padding for forgiveness
            rect1.x + rect1.w - 5 > rect2.x &&
            rect1.y < rect2.y + rect2.h - 5 &&
            rect1.y + rect1.h - 5 > rect2.y
        );
    }

    function drawWorld() {
        // 1. Sky is handled by CSS

        // 2. Sun (Dusk style)
        ctx.fillStyle = '#ff5f6d'; // Reddish orange glow
        ctx.shadowBlur = 40;
        ctx.shadowColor = '#ff5f6d';
        ctx.beginPath();
        ctx.arc(GAME_WIDTH - 150, 150, 60, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0; // Reset shadow

        // 3. Mountains (Parallax)
        ctx.fillStyle = 'rgba(10, 0, 30, 0.4)'; // Darker, moodier silhouette
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        mountains.forEach(m => {
            let drawX = m.x - (score * 0.2) % (GAME_WIDTH * 2); 
            if (drawX < -200) drawX += GAME_WIDTH * 2;
            
            ctx.lineTo(drawX, m.y);
            ctx.lineTo(drawX + m.w/2, m.y - m.h);
            ctx.lineTo(drawX + m.w, m.y);
        });
        ctx.lineTo(GAME_WIDTH, GROUND_Y);
        ctx.fill();

        // 4. Ground Plane (Solid Dark)
        ctx.fillStyle = SILHOUETTE_COLOR; // Match silhouette color
        ctx.fillRect(0, GROUND_Y, GAME_WIDTH, GAME_HEIGHT - GROUND_Y);
        
        // Ground Top Line (Subtle highlight)
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)'; 
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(GAME_WIDTH, GROUND_Y);
        ctx.stroke();

        // 5. Ground Details (Moving fast)
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        groundDetails.forEach(d => {
            let drawX = d.x - (score * 2) % GAME_WIDTH;
            if (drawX < -10) drawX += GAME_WIDTH;
            ctx.fillRect(drawX, d.y, d.w, d.h);
        });
    }

    function drawStaticScene() {
        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        drawWorld();
        dino.draw();
    }

    function animate() {
        if (!gameRunning) return;

        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        frame++;

        // Logic
        gameSpeed += 0.002; // Slowly accelerate
        score += gameSpeed * 0.05;
        
        // UI Updates
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
        const speedNum = Math.floor(gameSpeed * 10);
        speedVal.innerText = speedNum.toString().padStart(3, '0');
        const speedPct = Math.min(((gameSpeed - 6) / 15) * 100, 100);
        speedBar.style.width = `${Math.max(10, speedPct)}%`;

        // Draw World
        drawWorld();

        // Obstacle Spawning
        obstacleTimer++;
        if (obstacleTimer > obstacleInterval) {
            spawnObstacle();
            obstacleTimer = 0;
            obstacleInterval = 60 + Math.random() * 60 - (gameSpeed * 2); 
            if (obstacleInterval < 40) obstacleInterval = 40;
        }

        // Handle Obstacles
        obstacles.forEach((obs, index) => {
            obs.update();
            obs.draw();
            
            // Collision
            const hitboxDino = {x: dino.x, y: dino.y, w: dino.w, h: dino.h};
            const hitboxObs = {x: obs.x, y: obs.y, w: obs.w, h: obs.h};

            if (checkCollision(hitboxDino, hitboxObs)) {
                gameOver = true;
                gameRunning = false;
                
                // High Score
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('nocturne_hs', highScore);
                    hiScoreEl.innerText = Math.floor(highScore).toString().padStart(5, '0');
                }
                
                gameOverScreen.style.display = 'flex';
            }

            if (obs.x + obs.w < 0) obstacles.splice(index, 1);
        });

        // Particles
        particles.forEach((p, index) => {
            p.update();
            p.draw();
            if (p.life <= 0) particles.splice(index, 1);
        });

        // Dino
        dino.update();
        dino.draw();

        if (gameRunning) requestAnimationFrame(animate);
    }

    // --- INPUTS ---
    function handleInput(e) {
        if (e.type === 'keydown' && e.code !== 'Space' && e.code !== 'ArrowUp') return;
        if (e.type === 'keydown') e.preventDefault(); // Stop scroll

        if (!gameRunning && !gameOver) {
            resetGame();
        } else if (gameOver) {
            resetGame();
        } else {
            dino.jump();
        }
    }

    window.addEventListener('keydown', handleInput);
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleInput(e);
    }, {passive: false});
    canvas.addEventListener('mousedown', (e) => {
        handleInput(e);
    });

    // Initial Render
    initMountains();
    initGround();
    drawStaticScene();

</script>
</body>
</html>
