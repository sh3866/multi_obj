<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONO RUNNER // SYSTEM ONLINE</title>
    <style>
        :root {
            --bg-color: #1a1826;
            --grid-color: rgba(255, 255, 255, 0.03);
            --primary: #ff3e3e;
            --secondary: #ffbf00;
            --text-main: #e0e0e0;
            --text-muted: #6e6e80;
            --font-stack: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Background Grid Effect */
        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(40px) translateZ(-200px); }
        }

        /* Main Container */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 450px;
            background: rgba(20, 18, 26, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        /* HUD Layer */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 20;
            pointer-events: none;
        }

        .hud-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .label {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .value {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: -1px;
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .score-container {
            text-align: right;
        }

        .high-score {
            color: var(--secondary);
            font-size: 14px;
        }

        /* Speed Indicator */
        .speed-indicator {
            position: absolute;
            bottom: 80px;
            right: 20px;
            width: 120px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            z-index: 20;
        }
        .speed-bar {
            height: 100%;
            width: 40%;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            transition: width 0.2s;
        }
        .speed-label {
            position: absolute;
            top: -15px;
            right: 0;
            font-size: 10px;
            color: var(--primary);
        }

        /* Canvas */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Overlay UI */
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 30;
            pointer-events: none;
        }

        .prompt {
            margin-top: 40px;
            font-size: 14px;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }

        .key-hint {
            display: inline-block;
            border: 1px solid var(--text-muted);
            padding: 2px 8px;
            border-radius: 4px;
            color: var(--text-main);
            margin: 0 4px;
            font-size: 12px;
        }

        .game-over-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            background: rgba(26, 24, 38, 0.9);
            padding: 40px;
            border: 1px solid var(--primary);
            box-shadow: 0 0 30px rgba(255, 62, 62, 0.2);
        }

        .game-over-title {
            color: var(--primary);
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 10px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Scanline effect */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 40;
            opacity: 0.3;
        }

    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <div class="game-container">
        <div class="scanlines"></div>
        
        <div class="hud">
            <div class="hud-group">
                <span class="label">System</span>
                <span class="value" style="color: var(--primary);">ONLINE</span>
            </div>
            <div class="hud-group score-container">
                <span class="label">Score</span>
                <div style="display: flex; align-items: baseline; gap: 10px; justify-content: flex-end;">
                    <span class="value" id="score">00000</span>
                    <span class="high-score">HI: <span id="highScore">00000</span></span>
                </div>
            </div>
        </div>

        <div class="speed-indicator">
            <div class="speed-label">VELOCITY</div>
            <div class="speed-bar" id="speedBar"></div>
        </div>

        <div class="overlay" id="startScreen">
            <div class="prompt">
                Press <span class="key-hint">SPACE</span> or <span class="key-hint">TAP</span> to Jump
            </div>
        </div>

        <div class="overlay game-over-screen" id="gameOverScreen">
            <div class="game-over-title">CRITICAL FAILURE</div>
            <div class="label">REBOOT REQUIRED</div>
            <div class="prompt" style="margin-top: 20px; color: var(--text-main);">
                Press <span class="key-hint">SPACE</span> to Retry
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

<script>
    /**
     * DESIGNER'S IMPLEMENTATION NOTES:
     * The goal here is not just game logic, but "Juice".
     * We use procedural drawing for crisp scaling.
     * We use a distinct color palette (Dark Synthwave/Industrial).
     */

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const speedBar = document.getElementById('speedBar');

    // Game Constants
    let GAME_WIDTH = 900;
    let GAME_HEIGHT = 450;
    const GRAVITY = 0.6;
    const JUMP_FORCE = -11;
    const GROUND_Y = 380;
    
    // Game State
    let gameRunning = false;
    let gameOver = false;
    let frame = 0;
    let score = 0;
    let highScore = localStorage.getItem('chrono_runner_hs') || 0;
    let speed = 6;
    let speedMultiplier = 0.001;

    // Resize handling
    function resize() {
        const container = canvas.parentElement;
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        GAME_WIDTH = canvas.width;
        GAME_HEIGHT = canvas.height;
    }
    window.addEventListener('resize', resize);
    resize();
    highScoreEl.innerText = Math.floor(highScore).toString().padStart(5, '0');

    // --- ENTITIES ---

    class Dino {
        constructor() {
            this.w = 44;
            this.h = 44;
            this.x = 60;
            this.y = GROUND_Y - this.h;
            this.dy = 0;
            this.grounded = true;
            this.runFrame = 0;
            this.color = '#e0e0e0';
        }

        jump() {
            if (this.grounded) {
                this.dy = JUMP_FORCE;
                this.grounded = false;
                // Squash effect logic could go here
            }
        }

        update() {
            // Physics
            this.dy += GRAVITY;
            this.y += this.dy;

            // Ground Collision
            if (this.y + this.h > GROUND_Y) {
                this.y = GROUND_Y - this.h;
                this.dy = 0;
                this.grounded = true;
            } else {
                this.grounded = false;
            }

            // Animation ticker
            if (this.grounded) {
                this.runFrame += 0.15 * (speed / 6);
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            // Draw "Silhouette" Dino
            ctx.fillStyle = this.color;
            
            // Body (Simple geometric shapes for crisp look)
            // Torso
            ctx.fillRect(10, 15, 20, 20); 
            // Head
            ctx.fillRect(20, 0, 24, 15);
            // Neck connection
            ctx.fillRect(20, 10, 10, 5);
            // Tail
            ctx.beginPath();
            ctx.moveTo(10, 20);
            ctx.lineTo(0, 15);
            ctx.lineTo(10, 25);
            ctx.fill();

            // Eye (Negative space)
            ctx.fillStyle = '#1a1826';
            ctx.fillRect(32, 4, 4, 4);

            // Legs (Procedural animation)
            ctx.fillStyle = this.color;
            if (this.grounded) {
                // Running animation using sine wave
                const legOffset = Math.sin(this.runFrame) * 10;
                
                // Leg 1
                ctx.fillRect(12 + legOffset, 35, 6, 9);
                // Leg 2
                ctx.fillRect(22 - legOffset, 35, 6, 9);
            } else {
                // Jump pose (legs tucked)
                ctx.fillRect(12, 35, 6, 6);
                ctx.fillRect(22, 35, 6, 6);
            }

            // Arm
            ctx.fillRect(22, 18, 10, 4);

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type; // 'cactus' or 'bird'
            this.x = GAME_WIDTH + Math.random() * 200;
            this.markedForDeletion = false;

            if (type === 'cactus') {
                // Varying sizes
                const scale = 0.8 + Math.random() * 0.5;
                this.w = 20 * scale;
                this.h = (40 + Math.random() * 20) * scale;
                this.y = GROUND_Y - this.h;
                this.color = '#ff3e3e'; // Red primary
            } else {
                // Bird
                this.w = 40;
                this.h = 30;
                // Heights: Low (jump), Mid (duck - optional), High (visual)
                const heights = [GROUND_Y - 40, GROUND_Y - 70, GROUND_Y - 100];
                this.y = heights[Math.floor(Math.random() * heights.length)];
                this.color = '#ffbf00'; // Yellow secondary
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= speed;
            if (this.x + this.w < 0) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.2;
        }

        draw() {
            ctx.fillStyle = this.color;
            
            if (this.type === 'cactus') {
                // Draw stylized cactus (blocks)
                // Main stem
                ctx.fillRect(this.x, this.y, this.w, this.h);
                // Spikes/Arms
                ctx.fillRect(this.x - 5, this.y + 10, 5, 5);
                ctx.fillRect(this.x + this.w, this.y + 20, 5, 5);
                
                // Detail (shadows)
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(this.x + this.w - 5, this.y, 5, this.h);
            } else {
                // Draw Bird
                ctx.translate(this.x, this.y);
                
                // Body
                ctx.fillRect(0, 10, 30, 10);
                
                // Wings (Animated)
                const wingY = Math.sin(this.wingFrame) * 10;
                ctx.beginPath();
                ctx.moveTo(10, 10);
                ctx.lineTo(20, 10 - wingY - 10);
                ctx.lineTo(30, 10);
                ctx.fill();

                // Beak
                ctx.fillRect(30, 12, 10, 5);
                
                ctx.translate(-this.x, -this.y);
            }
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 3 + 1;
            this.speedX = Math.random() * 2 - 1;
            this.speedY = Math.random() * 2 - 1;
            this.color = color;
            this.life = 1.0;
        }
        update() {
            this.x -= speed * 0.5; // Move with world slightly
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.03;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    class BackgroundLayer {
        constructor(speedMod, color, heightMod) {
            this.speedMod = speedMod;
            this.color = color;
            this.x = 0;
            this.mountains = [];
            // Generate procedural mountain range
            let currentX = 0;
            while(currentX < GAME_WIDTH * 2) {
                const w = 50 + Math.random() * 100;
                const h = 20 + Math.random() * heightMod;
                this.mountains.push({x: currentX, y: GROUND_Y, w: w, h: h});
                currentX += w - 10; // Overlap
            }
        }

        update() {
            this.x -= speed * this.speedMod;
            if (this.x <= -GAME_WIDTH) this.x = 0;
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.moveTo(0, GAME_HEIGHT);
            
            // Draw two sets of mountains for looping
            for(let i=0; i<2; i++) {
                const offsetX = this.x + (i * GAME_WIDTH);
                // Since we stored absolute coordinates, we need to adjust drawing logic
                // Simplification: Just drawing static shapes moving
                // Actually, let's just draw simple rect blocks for "Industrial" look
            }
            
            // Let's do a simpler blocky horizon
            ctx.fillRect(this.x, GROUND_Y - 50, GAME_WIDTH, 50);
            ctx.fillRect(this.x + GAME_WIDTH, GROUND_Y - 50, GAME_WIDTH, 50);
            
            // Add some "tech" details to background
            ctx.fillStyle = 'rgba(255,255,255,0.05)';
            for(let i=0; i<5; i++) {
                let mx = (this.x * 2 + i * 200) % (GAME_WIDTH * 2);
                if(mx < -200) mx += GAME_WIDTH * 2;
                ctx.fillRect(mx, GROUND_Y - 80, 100, 80);
            }
        }
    }

    // --- GAME LOGIC ---

    const dino = new Dino();
    let obstacles = [];
    let particles = [];
    let bgLayer = new BackgroundLayer(0.2, 'rgba(255,255,255,0.03)', 100);
    let obstacleTimer = 0;
    let obstacleInterval = 100; // Frames

    function spawnObstacle() {
        // Randomly choose type
        const type = Math.random() > 0.7 ? 'bird' : 'cactus';
        obstacles.push(new Obstacle(type));
    }

    function createExplosion(x, y, color) {
        for(let i=0; i<15; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    function resetGame() {
        dino.y = GROUND_Y - dino.h;
        dino.dy = 0;
        obstacles = [];
        particles = [];
        score = 0;
        speed = 6;
        gameOver = false;
        gameRunning = true;
        startScreen.style.display = 'none';
        gameOverScreen.style.display = 'none';
        obstacleTimer = 0;
        animate();
    }

    function checkCollision(rect1, rect2) {
        return (
            rect1.x < rect2.x + rect2.w &&
            rect1.x + rect1.w > rect2.x &&
            rect1.y < rect2.y + rect2.h &&
            rect1.y + rect1.h > rect2.y
        );
    }

    function drawGround() {
        // Main ground line
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(GAME_WIDTH, GROUND_Y);
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Moving ground details (dashes)
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        const dashOffset = (frame * speed) % 50;
        for(let i = -1; i < GAME_WIDTH / 50 + 1; i++) {
            // Random looking dashes based on index
            if ((i * 137) % 3 === 0) {
                ctx.fillRect((i * 50) - dashOffset, GROUND_Y + 10, 20, 2);
            }
        }
    }

    function animate() {
        if (!gameRunning) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        frame++;

        // Update Speed
        speed += speedMultiplier;
        score += speed * 0.1;
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
        
        // Update UI Bar
        const speedPercent = Math.min(((speed - 6) / 10) * 100, 100);
        speedBar.style.width = `${Math.max(10, speedPercent)}%`;

        // Background
        bgLayer.update();
        bgLayer.draw();

        // Ground
        drawGround();

        // Obstacle Logic
        obstacleTimer++;
        // Randomize interval slightly
        if (obstacleTimer > obstacleInterval) {
            spawnObstacle();
            obstacleTimer = 0;
            obstacleInterval = 60 + Math.random() * 60; // Random gap
            // Make harder over time
            if (obstacleInterval < 40) obstacleInterval = 40;
        }

        // Handle Obstacles
        obstacles.forEach((obs, index) => {
            obs.update();
            obs.draw();
            
            // Collision
            // Hitbox adjustment (make hitbox slightly smaller than visual for fairness)
            const hitboxDino = {x: dino.x + 5, y: dino.y + 5, w: dino.w - 10, h: dino.h - 10};
            const hitboxObs = {x: obs.x + 2, y: obs.y + 2, w: obs.w - 4, h: obs.h - 4};

            if (checkCollision(hitboxDino, hitboxObs)) {
                gameOver = true;
                gameRunning = false;
                createExplosion(dino.x + dino.w/2, dino.y + dino.h/2, '#ff3e3e');
                
                // Update High Score
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('chrono_runner_hs', highScore);
                    highScoreEl.innerText = Math.floor(highScore).toString().padStart(5, '0');
                }
                
                gameOverScreen.style.display = 'flex';
            }

            if (obs.markedForDeletion) obstacles.splice(index, 1);
        });

        // Handle Particles
        particles.forEach((p, index) => {
            p.update();
            p.draw();
            if (p.life <= 0) particles.splice(index, 1);
        });

        // Dino
        dino.update();
        dino.draw();

        if (gameRunning) requestAnimationFrame(animate);
        else {
            // Draw one last frame to show the crash
            particles.forEach(p => { p.update(); p.draw(); });
        }
    }

    // --- INPUTS ---

    function handleInput(e) {
        if ((e.code === 'Space' || e.code === 'ArrowUp') && !e.repeat) {
            e.preventDefault(); // Prevent scrolling
            if (!gameRunning && !gameOver) {
                resetGame();
            } else if (gameOver) {
                resetGame();
            } else {
                dino.jump();
            }
        }
    }

    // Touch support
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!gameRunning && !gameOver) resetGame();
        else if (gameOver) resetGame();
        else dino.jump();
    }, {passive: false});

    window.addEventListener('keydown', handleInput);

    // Initial Draw (Static)
    bgLayer.draw();
    drawGround();
    dino.draw();

</script>
</body>
</html>
