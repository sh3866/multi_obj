<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONOS RUNNER // PROTOCOL 02</title>
    <style>
        :root {
            /* Palette: Modern-Retro (Deep Void & Neon Dust) */
            --bg-void: #0F0E17;       /* Deepest Purple/Black */
            --bg-gradient: #232136;   /* Mid-tone Purple */
            --accent-primary: #FF8906;/* Vibrant Orange */
            --accent-secondary: #F25F4C; /* Red-Orange for HUD */
            --text-main: #FFFFFE;     /* Stark White */
            --text-muted: #A7A9BE;    /* Muted Grey-Blue */
            
            /* Typography: System Mono stack for crisp retro feel */
            --font-stack: 'Courier New', 'Lucida Console', Monaco, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-stack);
            color: var(--text-main);
        }

        /* Game Container */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 16/9;
            background: linear-gradient(to bottom, var(--bg-void) 0%, var(--bg-gradient) 100%);
            overflow: hidden;
            box-shadow: 0 0 120px rgba(15, 14, 23, 0.8);
            border: 1px solid #333;
        }

        /* CRT Scanline & Noise */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 50;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 2px,
                rgba(0,0,0,0.2) 3px,
                rgba(0,0,0,0.2) 4px
            );
        }

        .noise-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 40;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            z-index: 30;
        }

        /* HUD Top Right - Unified Grid */
        .hud-top {
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
        }

        .score-board {
            display: grid;
            grid-template-columns: 60px 1fr;
            gap: 0;
            text-align: right;
            align-items: center;
            background: rgba(15, 14, 23, 0.85);
            padding: 15px 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-right: 4px solid var(--accent-primary);
            border-radius: 4px;
            backdrop-filter: blur(2px);
        }

        /* Unified Typography: Chunky Mono */
        .label {
            font-family: var(--font-stack);
            font-size: 14px;
            font-weight: 900;
            color: var(--text-muted);
            text-transform: uppercase;
            text-align: left;
            letter-spacing: 1px;
        }

        .score-val {
            font-family: var(--font-stack);
            font-size: 32px; /* Increased Size */
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -1px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .hi-score {
            color: var(--accent-primary);
            font-size: 18px; /* Demoted slightly */
            margin-bottom: 4px;
        }

        /* Speed Indicator - Thickened & Saturated */
        .speed-panel {
            grid-column: 1 / -1;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .speed-track {
            flex-grow: 1;
            height: 8px; /* Thicker */
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .speed-fill {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 10%;
            background: var(--accent-secondary); /* Saturated Red-Orange */
            box-shadow: 0 0 10px var(--accent-secondary);
            transition: width 0.1s linear;
        }

        .speed-text {
            font-family: var(--font-stack);
            font-size: 16px;
            font-weight: 900;
            color: var(--accent-secondary);
            width: 30px;
            text-align: right;
        }

        /* Call to Action */
        .cta-container {
            position: absolute;
            left: 12%; 
            top: 55%; /* Adjusted for visual center */
            transform: translateX(-50%);
            text-align: center;
            width: 220px;
            pointer-events: none;
            z-index: 35;
            opacity: 1;
            transition: opacity 0.2s;
        }

        .cta-text {
            font-family: var(--font-stack);
            font-size: 18px;
            font-weight: 900;
            color: var(--bg-void);
            background: var(--text-main); /* High contrast inversion */
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 10px 16px;
            display: inline-block;
            animation: blink 1s infinite steps(2, start);
            box-shadow: 4px 4px 0px var(--accent-primary);
        }

        .cta-sub {
            display: block;
            font-family: var(--font-stack);
            font-size: 12px;
            margin-top: 10px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* Game Over Overlay */
        .game-over-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 14, 23, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }

        .game-over-title {
            font-family: var(--font-stack);
            font-size: 56px;
            font-weight: 900;
            color: var(--accent-primary);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255, 137, 6, 0.4);
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.7) 100%);
            pointer-events: none;
            z-index: 20;
        }

    </style>
</head>
<body>

    <div class="game-container">
        <div class="noise-overlay"></div>
        <div class="scanlines"></div>
        <div class="vignette"></div>
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-layer">
            <div class="hud-top">
                <div class="score-board">
                    <!-- Row 1: HI Score -->
                    <span class="label">HI</span>
                    <span class="score-val hi-score" id="hiScore">00000</span>
                    
                    <!-- Row 2: Current Score -->
                    <span class="label">SCORE</span>
                    <span class="score-val" id="scoreVal">00000</span>
                    
                    <!-- Row 3: Speed Indicator -->
                    <div class="speed-panel">
                        <span class="label">SPD</span>
                        <div class="speed-track">
                            <div class="speed-fill" id="speedBar"></div>
                        </div>
                        <span class="speed-text" id="speedVal">10</span>
                    </div>
                </div>
            </div>

            <!-- CTA anchored to Dino position -->
            <div class="cta-container" id="startCta">
                <div class="cta-text">
                    Press Space
                    <span class="cta-sub">To Jump</span>
                </div>
            </div>
        </div>

        <div class="game-over-overlay" id="gameOverScreen">
            <div class="game-over-title">CRASHED</div>
            <div class="cta-sub" style="margin-top: 20px; color: #fff; opacity: 0.8;">Tap / Space to Restart</div>
        </div>
    </div>

<script>
    /**
     * CHRONOS RUNNER - REVISED
     * Focus: Visual Identity, Parallax Depth, Crisp Silhouettes
     */

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const scoreEl = document.getElementById('scoreVal');
    const hiScoreEl = document.getElementById('hiScore');
    const startCta = document.getElementById('startCta');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const speedBar = document.getElementById('speedBar');
    const speedVal = document.getElementById('speedVal');

    // Game Config
    let GAME_WIDTH = 1200;
    let GAME_HEIGHT = 675;
    const GROUND_HEIGHT_RATIO = 0.15; 
    let GROUND_Y = 0; 
    
    const GRAVITY = 0.6;
    const JUMP_FORCE = -14;
    
    // State
    let gameRunning = false;
    let gameOver = false;
    let frame = 0;
    let score = 0;
    let highScore = localStorage.getItem('chronos_hs') || 0;
    let gameSpeed = 8;
    let baseSpeed = 8;
    
    // Assets
    hiScoreEl.innerText = Math.floor(highScore).toString().padStart(5, '0');

    // Resize Handler
    function resize() {
        const container = canvas.parentElement;
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        GAME_WIDTH = canvas.width;
        GAME_HEIGHT = canvas.height;
        GROUND_Y = GAME_HEIGHT * (1 - GROUND_HEIGHT_RATIO);
        
        if (dino) dino.y = GROUND_Y - dino.h;
        if (!gameRunning && !gameOver) drawStaticScene();
    }
    window.addEventListener('resize', resize);

    // --- CLASSES ---

    class Dino {
        constructor() {
            this.w = 55;
            this.h = 55;
            this.x = GAME_WIDTH * 0.12; 
            this.y = GROUND_Y - this.h;
            this.dy = 0;
            this.grounded = true;
            this.runFrame = 0;
            // Critique: High Contrast Silhouette
            this.color = '#FFFFFE'; 
        }

        jump() {
            if (this.grounded) {
                this.dy = JUMP_FORCE;
                this.grounded = false;
                for(let i=0; i<6; i++) {
                    particles.push(new Particle(this.x + 10, this.y + this.h, '#FFFFFE'));
                }
            }
        }

        update() {
            this.dy += GRAVITY;
            this.y += this.dy;

            if (this.y + this.h > GROUND_Y) {
                this.y = GROUND_Y - this.h;
                this.dy = 0;
                this.grounded = true;
            }

            if (this.grounded) {
                this.runFrame += 0.2 + (gameSpeed * 0.025);
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.fillStyle = this.color;
            
            // Crisp Silhouette Construction (Modernized)
            ctx.beginPath();
            // Tail
            ctx.moveTo(0, 35);
            ctx.lineTo(0, 25);
            ctx.lineTo(12, 25);
            // Body
            ctx.lineTo(12, 15);
            ctx.lineTo(28, 15);
            // Neck/Head
            ctx.lineTo(38, 5);
            ctx.lineTo(55, 5); // Snout
            ctx.lineTo(55, 18); // Jaw
            ctx.lineTo(38, 22); // Neck bottom
            ctx.lineTo(38, 35); // Leg top
            
            // Legs
            if (!this.grounded) {
                // Jump pose (tucked)
                ctx.lineTo(32, 55);
                ctx.lineTo(22, 55);
                ctx.lineTo(22, 35);
            } else {
                const legOffset = Math.sin(this.runFrame) * 14;
                ctx.lineTo(38 + legOffset, 55);
                ctx.lineTo(26 + legOffset, 55);
                ctx.lineTo(26 + legOffset, 35);
            }
            
            ctx.fill();
            
            // Eye (Negative space cutout)
            ctx.fillStyle = '#0F0E17'; // Matches background
            ctx.fillRect(42, 8, 6, 6);

            ctx.restore();
        }
    }

    class Cactus {
        constructor() {
            this.w = 30 + Math.random() * 15;
            this.h = 50 + Math.random() * 20;
            this.x = GAME_WIDTH + 50;
            this.y = GROUND_Y - this.h;
            this.type = 'cactus';
            // Critique: Dark silhouette
            this.color = '#0F0E17'; 
        }

        update() {
            this.x -= gameSpeed;
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.save();
            ctx.translate(this.x, this.y);
            
            // Main Stem
            ctx.fillRect(this.w/3, 0, this.w/1.5, this.h);
            
            // Left Arm
            ctx.fillRect(0, 15, this.w/3, 8);
            ctx.fillRect(0, 5, 8, 18);
            
            // Right Arm
            ctx.fillRect(this.w - this.w/3, 25, this.w/3, 8);
            ctx.fillRect(this.w - 8, 15, 8, 18);
            
            ctx.restore();
        }
    }

    class Bird {
        constructor() {
            this.w = 50;
            this.h = 35;
            this.x = GAME_WIDTH + 50;
            // Heights
            const heights = [GROUND_Y - 50, GROUND_Y - 95, GROUND_Y - 140];
            this.y = heights[Math.floor(Math.random() * heights.length)];
            this.type = 'bird';
            this.wingFrame = 0;
            this.color = '#0F0E17';
        }

        update() {
            this.x -= gameSpeed;
            this.wingFrame += 0.3;
        }

        draw() {
            ctx.fillStyle = this.color;
            
            ctx.save();
            ctx.translate(this.x, this.y);
            
            // Body
            ctx.beginPath();
            ctx.moveTo(0, 18);
            ctx.lineTo(25, 12);
            ctx.lineTo(50, 18);
            ctx.lineTo(25, 25);
            ctx.closePath();
            ctx.fill();

            // Wings
            const wingY = Math.sin(this.wingFrame) * 20;
            ctx.beginPath();
            ctx.moveTo(15, 18);
            ctx.lineTo(25, 18 - wingY); 
            ctx.lineTo(35, 18);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 4 + 2;
            this.speedX = (Math.random() * 2 - 1) - (gameSpeed * 0.6);
            this.speedY = Math.random() * 2 - 1;
            this.color = color;
            this.life = 1.0;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.04;
        }
        draw() {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    // --- WORLD GENERATION ---

    let mountains = [];
    function initMountains() {
        mountains = [];
        let currentX = 0;
        while(currentX < GAME_WIDTH * 2) {
            const w = 250 + Math.random() * 350;
            const h = 100 + Math.random() * 180;
            mountains.push({x: currentX, y: GROUND_Y, w: w, h: h});
            currentX += w - 80; 
        }
    }

    let groundDetails = [];
    function initGround() {
        groundDetails = [];
        for(let i=0; i<80; i++) {
            groundDetails.push({
                x: Math.random() * GAME_WIDTH,
                y: GROUND_Y + 15 + Math.random() * (GAME_HEIGHT - GROUND_Y - 30),
                w: 2 + Math.random() * 6,
                h: 2 + Math.random() * 3
            });
        }
    }

    // --- GAME LOOP ---

    const dino = new Dino();
    let obstacles = [];
    let particles = [];
    let obstacleTimer = 0;
    let obstacleInterval = 100;

    function spawnObstacle() {
        const type = Math.random() > 0.65 ? 'bird' : 'cactus';
        if (type === 'bird') obstacles.push(new Bird());
        else obstacles.push(new Cactus());
    }

    function resetGame() {
        dino.y = GROUND_Y - dino.h;
        dino.dy = 0;
        obstacles = [];
        particles = [];
        score = 0;
        gameSpeed = baseSpeed;
        gameOver = false;
        gameRunning = true;
        obstacleTimer = 0;
        
        startCta.style.opacity = '0';
        gameOverScreen.style.display = 'none';
        
        initMountains();
        initGround();
        animate();
    }

    function checkCollision(rect1, rect2) {
        const padding = 10;
        return (
            rect1.x + padding < rect2.x + rect2.w - padding &&
            rect1.x + rect1.w - padding > rect2.x + padding &&
            rect1.y + padding < rect2.y + rect2.h - padding &&
            rect1.y + rect1.h - padding > rect2.y + padding
        );
    }

    function drawWorld() {
        // 1. Sun (Vibrant Orange glow)
        const sunX = GAME_WIDTH * 0.75;
        const sunY = GAME_HEIGHT * 0.4;
        const sunR = 80;

        const gradient = ctx.createRadialGradient(sunX, sunY, sunR * 0.2, sunX, sunY, sunR * 4);
        gradient.addColorStop(0, 'rgba(255, 137, 6, 0.9)'); // Orange
        gradient.addColorStop(0.4, 'rgba(255, 137, 6, 0.3)');
        gradient.addColorStop(1, 'rgba(255, 137, 6, 0)');

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunR * 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#FF8906'; // Solid Core
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
        ctx.fill();

        // 2. Mountains (Parallax - Layered)
        // Far Layer
        ctx.fillStyle = 'rgba(35, 33, 54, 0.9)'; 
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        mountains.forEach(m => {
            let drawX = m.x - (score * 0.08) % (GAME_WIDTH * 2); 
            if (drawX < -500) drawX += GAME_WIDTH * 2;
            
            ctx.lineTo(drawX, m.y);
            ctx.lineTo(drawX + m.w/2, m.y - m.h);
            ctx.lineTo(drawX + m.w, m.y);
        });
        ctx.lineTo(GAME_WIDTH, GROUND_Y);
        ctx.fill();

        // 3. Ground Plane (Bottom 15%)
        ctx.fillStyle = '#0F0E17'; // Deep Void color
        ctx.fillRect(0, GROUND_Y, GAME_WIDTH, GAME_HEIGHT - GROUND_Y);
        
        // Ground Top Line (Thick Accent)
        ctx.strokeStyle = '#FF8906'; 
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(GAME_WIDTH, GROUND_Y);
        ctx.stroke();

        // 4. Ground Details (Moving fast)
        ctx.fillStyle = 'rgba(255, 255, 254, 0.2)'; // White low opacity
        groundDetails.forEach(d => {
            let drawX = d.x - (score * 3) % GAME_WIDTH;
            if (drawX < -10) drawX += GAME_WIDTH;
            ctx.fillRect(drawX, d.y, d.w, d.h);
        });
    }

    function drawStaticScene() {
        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        drawWorld();
        dino.draw();
        
        // Draw static obstacles to show depth
        const staticCactus = new Cactus();
        staticCactus.x = GAME_WIDTH * 0.7;
        staticCactus.draw();
        
        const staticBird = new Bird();
        staticBird.x = GAME_WIDTH * 0.85;
        staticBird.y = GROUND_Y - 80;
        staticBird.draw();
    }

    function animate() {
        if (!gameRunning) return;

        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        frame++;

        // Logic
        gameSpeed += 0.003;
        score += gameSpeed * 0.05;
        
        // UI Updates
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
        const speedNum = Math.floor(gameSpeed * 10);
        speedVal.innerText = speedNum;
        
        // Speed Bar Logic
        const speedPct = Math.min(((gameSpeed - 8) / 12) * 100, 100);
        speedBar.style.width = `${Math.max(5, speedPct)}%`;

        // Draw World
        drawWorld();

        // Obstacle Spawning
        obstacleTimer++;
        if (obstacleTimer > obstacleInterval) {
            spawnObstacle();
            obstacleTimer = 0;
            obstacleInterval = 60 + Math.random() * 70 - (gameSpeed * 1.5); 
            if (obstacleInterval < 45) obstacleInterval = 45;
        }

        // Handle Obstacles
        obstacles.forEach((obs, index) => {
            obs.update();
            obs.draw();
            
            const hitboxDino = {x: dino.x, y: dino.y, w: dino.w, h: dino.h};
            const hitboxObs = {x: obs.x, y: obs.y, w: obs.w, h: obs.h};

            if (checkCollision(hitboxDino, hitboxObs)) {
                gameOver = true;
                gameRunning = false;
                
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('chronos_hs', highScore);
                    hiScoreEl.innerText = Math.floor(highScore).toString().padStart(5, '0');
                }
                
                gameOverScreen.style.display = 'flex';
            }

            if (obs.x + obs.w < -100) obstacles.splice(index, 1);
        });

        // Particles
        particles.forEach((p, index) => {
            p.update();
            p.draw();
            if (p.life <= 0) particles.splice(index, 1);
        });

        // Dino
        dino.update();
        dino.draw();

        if (gameRunning) requestAnimationFrame(animate);
    }

    // --- INPUTS ---
    function handleInput(e) {
        if (e.type === 'keydown' && e.code !== 'Space' && e.code !== 'ArrowUp') return;
        if (e.type === 'keydown') e.preventDefault(); 

        if (!gameRunning && !gameOver) {
            resetGame();
        } else if (gameOver) {
            resetGame();
        } else {
            dino.jump();
        }
    }

    window.addEventListener('keydown', handleInput);
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleInput(e);
    }, {passive: false});
    canvas.addEventListener('mousedown', (e) => {
        handleInput(e);
    });

    // Initial Render
    resize();
</script>
</body>
</html>
