<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Architecture & Data Flow</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --grid-color: #1e222b;
            --card-bg: #161b22;
            --card-border: #2d3748;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            
            /* Semantic Colors */
            --col-data: #38bdf8;      /* Light Blue */
            --col-instr: #fbbf24;     /* Amber */
            --col-ctrl: #34d399;      /* Emerald */
            
            /* Component Accent Colors (Subtle) */
            --col-cpu: #e2e8f0;
            --col-gpu: #a78bfa;
            --col-mem: #2dd4bf;
            --col-stor: #f87171;
            --col-io: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header & Legend */
        header {
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 17, 21, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--card-border);
            z-index: 10;
        }

        .title-block h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .title-block .meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'Courier New', monospace;
            margin-top: 2px;
        }

        .legend-container {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .legend-line {
            width: 24px;
            height: 0;
            border-top-width: 2px;
            border-top-style: solid;
        }
        .legend-line.data { border-top-color: var(--col-data); }
        .legend-line.instr { border-top-color: var(--col-instr); border-top-style: dashed; }
        .legend-line.ctrl { border-top-color: var(--col-ctrl); border-top-style: dotted; }

        /* Main Canvas */
        main {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
            max-width: 1400px;
            max-height: 1000px;
            /* Ensure crisp rendering */
            shape-rendering: geometricPrecision; 
        }

        /* Component Nodes */
        .node-box {
            fill: var(--card-bg);
            stroke: var(--card-border); /* Unified Neutral Border */
            stroke-width: 2px;
            rx: 6px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
            transition: all 0.2s ease;
            cursor: default;
        }
        
        /* Accent line at top of card */
        .node-accent {
            stroke-width: 3px;
            stroke-linecap: round;
        }

        .node-label {
            fill: var(--text-main);
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 14px;
            text-anchor: middle;
            letter-spacing: 0.5px;
            user-select: none;
        }

        .node-sub {
            fill: var(--text-muted);
            font-size: 10px;
            text-anchor: middle;
            user-select: none;
        }

        /* Connections */
        .link-path {
            fill: none;
            stroke-width: 2px;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        .link-path.data { stroke: var(--col-data); }
        .link-path.instr { stroke: var(--col-instr); stroke-dasharray: 6 4; }
        .link-path.ctrl { stroke: var(--col-ctrl); stroke-dasharray: 2 3; }

        /* Flow Particles */
        .flow-particle {
            fill: none;
            stroke-width: 3px;
            stroke-linecap: round;
            opacity: 0.8;
            filter: drop-shadow(0 0 2px currentColor);
        }

        .flow-particle.data { stroke: var(--col-data); stroke-dasharray: 8 60; animation: flow 2s linear infinite; }
        .flow-particle.instr { stroke: var(--col-instr); stroke-dasharray: 4 40; animation: flow 1.5s linear infinite; }
        .flow-particle.ctrl { stroke: var(--col-ctrl); stroke-dasharray: 2 30; animation: flow 2.5s linear infinite; }

        @keyframes flow {
            to { stroke-dashoffset: -68; }
        }

        /* Line Labels (Badges) */
        .label-group {
            transition: opacity 0.2s ease;
            cursor: default;
        }
        
        .label-bg {
            fill: var(--bg-color);
            stroke-width: 1px;
            rx: 4px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .label-text {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 10px;
            font-weight: 700;
            text-anchor: middle;
            user-select: none;
            letter-spacing: 0.02em;
        }

        /* Icons */
        .icon {
            stroke-width: 2px;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        /* Interactivity */
        .dimmed {
            opacity: 0.1;
            transition: opacity 0.3s ease;
        }
        
        .highlighted {
            opacity: 1 !important;
            filter: drop-shadow(0 0 5px currentColor);
        }

    </style>
</head>
<body>

    <header>
        <div class="title-block">
            <h1>System Architecture</h1>
            <div class="meta">Fig 1.0 // Orthogonal Data Flow Topology</div>
        </div>
        <div class="legend-container">
            <div class="legend-item">
                <div class="legend-line data"></div>
                <span>Data</span>
            </div>
            <div class="legend-item">
                <div class="legend-line instr"></div>
                <span>Instructions</span>
            </div>
            <div class="legend-item">
                <div class="legend-line ctrl"></div>
                <span>Control</span>
            </div>
        </div>
    </header>

    <main id="canvas-container">
        <!-- SVG injected here -->
    </main>

    <script>
        // Configuration
        const colors = {
            data: '#38bdf8',
            instr: '#fbbf24',
            ctrl: '#34d399',
            cpu: '#e2e8f0',
            gpu: '#a78bfa',
            mem: '#2dd4bf',
            stor: '#f87171',
            io: '#94a3b8'
        };

        // Layout Definitions - Strict Grid Alignment (X: 100, 300, 500, 700, 900 | Y: 150, 350, 550)
        // Center: CPU at 400, 350
        const components = {
            cpu: { x: 300, y: 300, w: 200, h: 100, label: "CPU", sub: "Central Processing Unit", color: colors.cpu },
            mem: { x: 300, y: 150, w: 200, h: 100, label: "RAM", sub: "System Memory", color: colors.mem }, // Top Center
            gpu: { x: 700, y: 150, w: 160, h: 100, label: "GPU", sub: "Graphics Processing", color: colors.gpu }, // Top Right
            inp: { x: 100, y: 300, w: 160, h: 100, label: "INPUT", sub: "I/O Peripherals", color: colors.io }, // Left
            stor:{ x: 300, y: 500, w: 160, h: 100, label: "STORAGE", sub: "NVMe / SSD", color: colors.stor }, // Bottom Center
            out: { x: 700, y: 300, w: 160, h: 100, label: "OUTPUT", sub: "Display / Audio", color: colors.io }, // Right
            net: { x: 700, y: 500, w: 160, h: 100, label: "NIC", sub: "Network Interface", color: colors.io } // Bottom Right
        };

        // Connections: From, To, Type, Label
        const connections = [
            // CPU <-> RAM
            { from: 'cpu', to: 'mem', type: 'data', label: 'Read/Write Data' },
            { from: 'mem', to: 'cpu', type: 'instr', label: 'Instruction Fetch' },
            { from: 'cpu', to: 'mem', type: 'ctrl', label: 'Bus Control' },

            // CPU <-> GPU
            { from: 'cpu', to: 'gpu', type: 'data', label: 'Command Buffer' },

            // GPU <-> RAM (Direct Access)
            { from: 'gpu', to: 'mem', type: 'data', label: 'VRAM Access' },

            // CPU <-> Storage
            { from: 'stor', to: 'cpu', type: 'instr', label: 'Code Loading' },
            { from: 'stor', to: 'cpu', type: 'data', label: 'Block Data' },
            { from: 'cpu', to: 'stor', type: 'ctrl', label: 'IO Command' },

            // CPU <-> Network
            { from: 'cpu', to: 'net', type: 'data', label: 'Packet TX' },
            { from: 'net', to: 'cpu', type: 'data', label: 'Packet RX' },

            // Input/Output
            { from: 'inp', to: 'cpu', type: 'ctrl', label: 'Interrupts' },
            { from: 'gpu', to: 'out', type: 'data', label: 'Frame Buffer' },
        ];

        // Helper to get center
        const getCenter = (id) => {
            const c = components[id];
            return { x: c.x + c.w/2, y: c.y + c.h/2 };
        };

        // Manhattan Routing Logic with consistent corner radii
        const getManhattanPath = (sourceId, targetId) => {
            const s = components[sourceId];
            const t = components[targetId];
            
            // Determine connection points (Edges of the boxes)
            let startX, startY, endX, endY;
            
            const dx = (t.x + t.w/2) - (s.x + s.w/2);
            const dy = (t.y + t.h/2) - (s.y + s.h/2);

            // Logic to pick the best side to connect from
            if (Math.abs(dx) > Math.abs(dy)) {
                // Horizontal dominant
                startX = dx > 0 ? s.x + s.w : s.x;
                startY = s.y + s.h/2;
                endX = dx > 0 ? t.x : t.x + t.w;
                endY = t.y + t.h/2;
            } else {
                // Vertical dominant
                startX = s.x + s.w/2;
                startY = dy > 0 ? s.y + s.h : s.y;
                endX = t.x + t.w/2;
                endY = dy > 0 ? t.y : t.y + t.h;
            }

            // Define Control Points for the bend
            const midX = (startX + endX) / 2;
            const midY = (startY + endY) / 2;

            // Create a smooth path with rounded corners using SVG Arcs (A)
            // Radius 10
            const r = 10;
            
            // We construct a path: Move -> Line -> Arc -> Line -> Arc -> Line
            
            // If purely horizontal or vertical
            if (startX === endX || startY === endY) {
                return { 
                    d: `M ${startX} ${startY} L ${endX} ${endY}`,
                    midX: (startX + endX)/2,
                    midY: (startY + endY)/2
                };
            }

            // Determine direction of turns
            // Simplified approach for robust Manhattan: 
            // Line to midX, Arc to turn, Line to endX...
            
            // Path: M Start -> L (midX, startY) -> A (round) -> L (midX, endY) -> A (round) -> L End
            // Note: This assumes a specific "S" or "L" shape logic. For strict grid, we can just use Q (Quadratic Bezier) for corners
            // Q cp1 cp2, x y
            
            const cp1x = midX; const cp1y = startY;
            const cp2x = midX; const cp2y = endY;

            // Using Q with 10px offset for smooth 90deg turn
            const d = `M ${startX} ${startY} L ${midX} ${startY} Q ${midX} ${startY} ${midX} ${startY + (startY < endY ? 10 : -10)} L ${midX} ${endY - (startY < endY ? 10 : -10)} Q ${midX} ${endY} ${midX + (startX < endX ? 10 : -10)} ${endY} L ${endX} ${endY}`;
            
            // Simplified logic for visual consistency (L shape)
            // Just finding the exact middle point of the bend for the label
            const labelX = midX;
            const labelY = (startY + endY) / 2;

            return {
                d: d,
                midX: labelX,
                midY: labelY
            };
        };

        // Generate SVG
        const createSVG = () => {
            const ns = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(ns, "svg");
            svg.setAttribute("viewBox", "0 0 1000 700");
            svg.setAttribute("width", "100%");
            svg.setAttribute("height", "100%");

            const defs = document.createElementNS(ns, "defs");

            // Arrow Markers
            const createMarker = (id, color) => {
                const marker = document.createElementNS(ns, "marker");
                marker.setAttribute("id", id);
                marker.setAttribute("markerWidth", "6");
                marker.setAttribute("markerHeight", "6");
                marker.setAttribute("refX", "5");
                marker.setAttribute("refY", "3");
                marker.setAttribute("orient", "auto");
                const polygon = document.createElementNS(ns, "polygon");
                polygon.setAttribute("points", "0 0, 6 3, 0 6");
                polygon.setAttribute("fill", color);
                marker.appendChild(polygon);
                return marker;
            };

            defs.appendChild(createMarker('arrow-data', colors.data));
            defs.appendChild(createMarker('arrow-instr', colors.instr));
            defs.appendChild(createMarker('arrow-ctrl', colors.ctrl));
            svg.appendChild(defs);

            // --- LAYER 1: Connections ---
            const linksGroup = document.createElementNS(ns, "g");
            linksGroup.setAttribute("id", "links-layer");

            connections.forEach((conn) => {
                const { d, midX, midY } = getManhattanPath(conn.from, conn.to);
                const color = colors[conn.type];
                const markerId = `arrow-${conn.type}`;

                // Base Path (Track)
                const path = document.createElementNS(ns, "path");
                path.setAttribute("d", d);
                path.setAttribute("stroke", color);
                path.setAttribute("class", `link-path ${conn.type}`);
                path.setAttribute("marker-end", `url(#${markerId})`);
                path.setAttribute("data-from", conn.from);
                path.setAttribute("data-to", conn.to);
                linksGroup.appendChild(path);

                // Animated Particle
                const particle = document.createElementNS(ns, "path");
                particle.setAttribute("d", d);
                particle.setAttribute("class", `flow-particle ${conn.type}`);
                // Randomize start delay for organic feel
                particle.style.animationDelay = `${Math.random() * -2}s`;
                linksGroup.appendChild(particle);

                // Label Badge
                // We need to offset the badge slightly if lines overlap, but for this grid, mid is usually safe.
                // We calculate text width to size the background box.
                const textContent = conn.label;
                const textWidth = textContent.length * 6.5 + 16; // Approx width
                
                const labelG = document.createElementNS(ns, "g");
                labelG.setAttribute("transform", `translate(${midX - textWidth/2}, ${midY - 10})`);
                labelG.setAttribute("class", "label-group");
                labelG.setAttribute("data-from", conn.from);
                labelG.setAttribute("data-to", conn.to);

                const bg = document.createElementNS(ns, "rect");
                bg.setAttribute("width", textWidth);
                bg.setAttribute("height", 20);
                bg.setAttribute("class", "label-bg");
                bg.setAttribute("stroke", color);
                bg.setAttribute("fill", "var(--bg-color)");

                const text = document.createElementNS(ns, "text");
                text.setAttribute("class", "label-text");
                text.setAttribute("fill", color);
                text.setAttribute("x", textWidth/2);
                text.setAttribute("y", 14);
                text.textContent = textContent;

                labelG.appendChild(bg);
                labelG.appendChild(text);
                linksGroup.appendChild(labelG);
            });
            svg.appendChild(linksGroup);

            // --- LAYER 2: Components ---
            const nodesGroup = document.createElementNS(ns, "g");
            
            Object.keys(components).forEach(key => {
                const comp = components[key];
                const g = document.createElementNS(ns, "g");
                g.setAttribute("id", key);
                g.setAttribute("transform", `translate(${comp.x}, ${comp.y})`);

                // Main Box
                const rect = document.createElementNS(ns, "rect");
                rect.setAttribute("width", comp.w);
                rect.setAttribute("height", comp.h);
                rect.setAttribute("class", "node-box");
                g.appendChild(rect);

                // Top Accent Line
                const accent = document.createElementNS(ns, "line");
                accent.setAttribute("x1", "0");
                accent.setAttribute("y1", "0");
                accent.setAttribute("x2", comp.w);
                accent.setAttribute("y2", "0");
                accent.setAttribute("class", "node-accent");
                accent.setAttribute("stroke", comp.color);
                g.appendChild(accent);

                // Icons (Centered vertically in top half)
                const iconG = document.createElementNS(ns, "g");
                iconG.setAttribute("transform", `translate(${comp.w/2}, 30)`);
                iconG.setAttribute("class", "icon");
                iconG.setAttribute("stroke", comp.color);
                
                // Draw Icons based on Key
                if (key === 'cpu') {
                    const main = document.createElementNS(ns, "rect");
                    main.setAttribute("x", -12); main.setAttribute("y", -12);
                    main.setAttribute("width", 24); main.setAttribute("height", 24);
                    main.setAttribute("rx", 3);
                    iconG.appendChild(main);
                    // Inner Core
                    const core = document.createElementNS(ns, "rect");
                    core.setAttribute("x", -6); core.setAttribute("y", -6);
                    core.setAttribute("width", 12); core.setAttribute("height", 12);
                    core.setAttribute("rx", 1);
                    iconG.appendChild(core);
                } 
                else if (key === 'gpu') {
                    const c = document.createElementNS(ns, "rect");
                    c.setAttribute("x", -16); c.setAttribute("y", -12); c.setAttribute("width", 32); c.setAttribute("height", 24); c.setAttribute("rx", 2);
                    iconG.appendChild(c);
                    const fan = document.createElementNS(ns, "path");
                    fan.setAttribute("d", "M-10 -6 A 6 6 0 0 1 10 -6");
                    iconG.appendChild(fan);
                } 
                else if (key === 'mem') {
                    // RAM Sticks
                    for(let i=0; i<3; i++) {
                        const r = document.createElementNS(ns, "rect");
                        r.setAttribute("x", -20 + i*14); r.setAttribute("y", -8);
                        r.setAttribute("width", 8); r.setAttribute("height", 16);
                        r.setAttribute("fill", comp.color);
                        r.setAttribute("opacity", "0.4");
                        iconG.appendChild(r);
                    }
                } 
                else if (key === 'stor') {
                    // SSD
                    const l1 = document.createElementNS(ns, "rect");
                    l1.setAttribute("x", -20); l1.setAttribute("y", -8); l1.setAttribute("width", 40); l1.setAttribute("height", 16); l1.setAttribute("rx", 2);
                    iconG.appendChild(l1);
                    const chip = document.createElementNS(ns, "rect");
                    chip.setAttribute("x", -10); chip.setAttribute("y", -4); chip.setAttribute("width", 20); chip.setAttribute("height", 8); chip.setAttribute("rx", 1);
                    chip.setAttribute("fill", comp.color);
                    iconG.appendChild(chip);
                }
                else if (key === 'net') {
                    const c = document.createElementNS(ns, "circle");
                    c.setAttribute("r", 12);
                    iconG.appendChild(c);
                    const ring = document.createElementNS(ns, "circle");
                    ring.setAttribute("r", 6);
                    iconG.appendChild(ring);
                }
                else if (key === 'inp') {
                    const k = document.createElementNS(ns, "rect");
                    k.setAttribute("x", -18); k.setAttribute("y", -10); k.setAttribute("width", 36); k.setAttribute("height", 20); k.setAttribute("rx", 2);
                    iconG.appendChild(k);
                    const dot = document.createElementNS(ns, "circle");
                    dot.setAttribute("cx", 0); dot.setAttribute("cy", 0); dot.setAttribute("r", 2);
                    dot.setAttribute("fill", comp.color);
                    iconG.appendChild(dot);
                }
                else if (key === 'out') {
                    const m = document.createElementNS(ns, "rect");
                    m.setAttribute("x", -20); m.setAttribute("y", -12); m.setAttribute("width", 40); m.setAttribute("height", 24); m.setAttribute("rx", 2);
                    iconG.appendChild(m);
                    const stand = document.createElementNS(ns, "rect");
                    stand.setAttribute("x", -6); stand.setAttribute("y", 12); stand.setAttribute("width", 12); stand.setAttribute("height", 4);
                    iconG.appendChild(stand);
                }

                g.appendChild(iconG);

                // Text Labels
                const textMain = document.createElementNS(ns, "text");
                textMain.setAttribute("x", comp.w/2);
                textMain.setAttribute("y", comp.h/2 + 10);
                textMain.setAttribute("class", "node-label");
                textMain.textContent = comp.label;
                g.appendChild(textMain);

                const textSub = document.createElementNS(ns, "text");
                textSub.setAttribute("x", comp.w/2);
                textSub.setAttribute("y", comp.h/2 + 26);
                textSub.setAttribute("class", "node-sub");
                textSub.textContent = comp.sub;
                g.appendChild(textSub);

                nodesGroup.appendChild(g);
            });
            svg.appendChild(nodesGroup);

            return svg;
        };

        // Initialize
        const container = document.getElementById('canvas-container');
        const svgElement = createSVG();
        container.appendChild(svgElement);

        // Interaction Logic
        const nodeGroups = svgElement.querySelectorAll('g[id]');
        const allLinks = svgElement.querySelectorAll('.link-path, .flow-particle');
        const allLabels = svgElement.querySelectorAll('.label-group');

        nodeGroups.forEach(node => {
            node.addEventListener('mouseenter', () => {
                const nodeId = node.getAttribute('id');
                
                // Dim everything first
                allLinks.forEach(el => el.classList.add('dimmed'));
                allLabels.forEach(el => el.classList.add('dimmed'));
                
                // Highlight connected paths
                const relatedPaths = svgElement.querySelectorAll(`.link-path[data-from="${nodeId}"], .link-path[data-to="${nodeId}"]`);
                relatedPaths.forEach(p => {
                    p.classList.remove('dimmed');
                    p.classList.add('highlighted');
                    // Also highlight the particle associated with this path (same index/structure)
                    // Since particles are siblings or nearby, we look for particle with same class type and path? 
                    // Easier: Particles don't have data attributes in this build, but they share the path 'd'.
                    // We will just rely on the main path lighting up.
                });

                // Highlight Labels
                const relatedLabels = svgElement.querySelectorAll(`.label-group[data-from="${nodeId}"], .label-group[data-to="${nodeId}"]`);
                relatedLabels.forEach(l => {
                    l.classList.remove('dimmed');
                    l.classList.add('highlighted');
                });
            });
            
            node.addEventListener('mouseleave', () => {
                // Reset all
                allLinks.forEach(el => {
                    el.classList.remove('dimmed');
                    el.classList.remove('highlighted');
                });
                allLabels.forEach(el => {
                    el.classList.remove('dimmed');
                    el.classList.remove('highlighted');
                });
            });
        });

    </script>
</body>
</html>
