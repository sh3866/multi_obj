<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactical AI Inspector // REVISED</title>
<style>
  :root {
    --bg-deep: #050507;
    --bg-panel: #111113;
    --bg-panel-highlight: #1c1c1f;
    --border: #333338;
    --text-primary: #ececec;
    --text-secondary: #888890;
    
    /* State Colors */
    --c-patrol: #22c55e;
    --c-alert: #eab308;
    --c-chase: #f97316;
    --c-attack: #f43f5e;
    
    --c-player: #38bdf8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-deep);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 300px;
    grid-template-rows: 56px 1fr;
    font-size: 12px;
    user-select: none;
  }

  /* HEADER */
  header {
    grid-column: 1 / -1;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 20;
  }

  .brand {
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
  }

  .brand i {
    color: var(--c-player);
    font-style: normal;
    font-size: 16px;
  }

  .header-controls {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .btn {
    background: var(--bg-panel-highlight);
    color: var(--text-primary);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: all 0.2s ease;
  }

  .btn:hover {
    background: var(--border);
    border-color: #555;
  }

  .btn:active {
    transform: translateY(1px);
  }

  .status-pill {
    font-family: monospace;
    font-size: 10px;
    color: var(--text-secondary);
    background: rgba(0,0,0,0.3);
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
  }

  /* MAIN CANVAS AREA */
  main {
    position: relative;
    background-color: var(--bg-deep);
    overflow: hidden;
    cursor: crosshair;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .hud-overlay {
    position: absolute;
    bottom: 20px;
    left: 20px;
    pointer-events: none;
    display: flex;
    gap: 20px;
  }

  .hud-item {
    background: rgba(17, 17, 19, 0.8);
    backdrop-filter: blur(4px);
    padding: 8px 12px;
    border-left: 2px solid var(--c-player);
    border-radius: 0 4px 4px 0;
    font-family: monospace;
    color: var(--text-secondary);
    font-size: 11px;
  }

  .hud-item strong {
    color: var(--text-primary);
    margin-left: 6px;
  }

  /* INSPECTOR PANEL */
  aside {
    background: var(--bg-panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    z-index: 10;
  }

  .panel-header {
    padding: 20px 24px 10px;
    border-bottom: 1px solid var(--border);
  }

  .panel-title {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 16px;
  }

  .panel-content {
    padding: 20px 24px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* Player Stats */
  .stat-block {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 12px;
  }
  
  .stat-row:last-child { margin-bottom: 0; }

  .stat-label { color: var(--text-secondary); }
  .stat-value { font-weight: 600; font-family: monospace; color: var(--text-primary); }
  
  .hp-bar-bg {
    width: 100%;
    height: 4px;
    background: #333;
    border-radius: 2px;
    margin-top: 4px;
    overflow: hidden;
  }
  
  .hp-bar-fill {
    height: 100%;
    background: var(--c-player);
    width: 100%;
    box-shadow: 0 0 8px var(--c-player);
  }

  /* Legend */
  .legend-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
    background: rgba(255,255,255,0.01);
  }

  .legend-item:hover {
    background: rgba(255,255,255,0.05);
  }

  .legend-item.active {
    border-color: var(--border);
    background: var(--bg-panel-highlight);
  }

  .legend-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    box-shadow: 0 0 6px currentColor;
  }

  .legend-text {
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .legend-count {
    font-family: monospace;
    font-size: 11px;
    color: var(--text-secondary);
  }

  /* Layers */
  .layer-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  
  .layer-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 8px 0;
    text-align: center;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  
  .layer-btn.active {
    background: var(--text-primary);
    color: var(--bg-deep);
    border-color: var(--text-primary);
  }
  
  .layer-btn:hover:not(.active) {
    border-color: var(--text-secondary);
    color: var(--text-primary);
  }

</style>
</head>
<body>

<header>
  <div class="brand">
    <i>◆</i> TACTICAL <span style="color:var(--text-secondary); font-weight:400;">//</span> AI INSPECTOR
  </div>
  <div class="header-controls">
    <div class="status-pill">SIMULATION ACTIVE</div>
    <button class="btn" onclick="resetSimulation()">Reset Map</button>
  </div>
</header>

<main id="canvas-container">
  <canvas id="simCanvas"></canvas>
  <div class="hud-overlay">
    <div class="hud-item">PLAYER <strong id="hud-pos">0, 0</strong></div>
    <div class="hud-item">TARGETS <strong id="hud-enemies">0</strong></div>
  </div>
</main>

<aside>
  <div class="panel-header">
    <div class="panel-title">Selected Unit</div>
    <div class="stat-block">
      <div class="stat-row">
        <span class="stat-label">Unit</span>
        <span class="stat-value" style="color: var(--c-player)">PLAYER_ONE</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Health</span>
        <span class="stat-value">100%</span>
      </div>
      <div class="hp-bar-bg"><div class="hp-bar-fill"></div></div>
    </div>
  </div>

  <div class="panel-content">
    <!-- Legend -->
    <div>
      <div class="panel-title">AI States (Global Legend)</div>
      <div class="legend-grid" id="legend-container">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- Layers -->
    <div>
      <div class="panel-title">Visualization Layers</div>
      <div class="layer-grid">
        <button class="layer-btn active" data-layer="paths" onclick="toggleLayer(this, 'paths')">Paths</button>
        <button class="layer-btn active" data-layer="fov" onclick="toggleLayer(this, 'fov')">Sensors</button>
        <button class="layer-btn active" data-layer="labels" onclick="toggleLayer(this, 'labels')">Data</button>
      </div>
    </div>
  </div>
</aside>

<script>
/**
 * TACTICAL AI SIMULATION ENGINE
 * Revised for Visual Design & Clarity
 */

const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const hudPos = document.getElementById('hud-pos');
const hudEnemies = document.getElementById('hud-enemies');
const legendContainer = document.getElementById('legend-container');

// --- CONFIGURATION & CONSTANTS ---

const STATES = {
  PATROL: { id: 'PATROL', color: '#22c55e', label: 'Patrol', desc: 'Idle / Waypoint' },
  ALERT:  { id: 'ALERT',  color: '#eab308', label: 'Alert',  desc: 'Investigating' },
  CHASE:  { id: 'CHASE',  color: '#f97316', label: 'Chase',  desc: 'Engaging' },
  ATTACK: { id: 'ATTACK', color: '#f43f5e', label: 'Attack', desc: 'Combat' }
};

const CONFIG = {
  colors: {
    bg: '#050507',
    grid: '#161618',
    wallFill: '#1a1a1c',
    wallStroke: '#444444',
    wallHighlight: '#666666',
    player: '#38bdf8'
  },
  enemyCount: 6,
  wallCount: 7
};

// --- STATE ---

let width, height;
let lastTime = 0;
let mouse = { x: 0, y: 0 };
let playerPos = { x: 0, y: 0 }; // Smoothed player position
let walls = [];
let enemies = [];
let particles = [];

// UI State
let layers = { paths: true, fov: true, labels: true };
let filterState = null; // null means show all

// --- UTILS ---

const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const lerp = (a, b, t) => a + (b - a) * t;
const angleTo = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);

// Line segment intersection
function getIntersection(A, B, C, D) {
  const tTop = (D.x - C.x) * (A.y - C.y) - (D.y - C.y) * (A.x - C.x);
  const uTop = (C.y - A.y) * (A.x - B.x) - (C.x - A.x) * (A.y - B.y);
  const bottom = (D.y - C.y) * (B.x - A.x) - (D.x - C.x) * (B.y - A.y);

  if (bottom !== 0) {
    const t = tTop / bottom;
    const u = uTop / bottom;
    if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
      return { x: lerp(A.x, B.x, t), y: lerp(A.y, B.y, t), offset: t }
    }
  }
  return null;
}

// --- CLASSES ---

class Wall {
  constructor(x, y, w, h) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.segments = [
      {x1: x, y1: y, x2: x + w, y2: y},
      {x1: x + w, y1: y, x2: x + w, y2: y + h},
      {x1: x + w, y1: y + h, x2: x, y2: y + h},
      {x1: x, y1: y + h, x2: x, y2: y}
    ];
  }

  draw(ctx) {
    // Main block
    ctx.fillStyle = CONFIG.colors.wallFill;
    ctx.strokeStyle = CONFIG.colors.wallStroke;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.rect(this.x, this.y, this.w, this.h);
    ctx.fill();
    ctx.stroke();

    // 3D Top Highlight
    ctx.fillStyle = CONFIG.colors.wallHighlight;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x + this.w, this.y);
    ctx.lineTo(this.x + this.w - 5, this.y + 5);
    ctx.lineTo(this.x + 5, this.y + 5);
    ctx.closePath();
    ctx.fill();
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.color = color;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 1.0;
    this.decay = 0.03 + Math.random() * 0.03;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }
  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Enemy {
  constructor(id, startX, startY) {
    this.id = id;
    this.x = startX;
    this.y = startY;
    this.radius = 10;
    this.angle = Math.random() * Math.PI * 2;
    this.speed = 1.0 + Math.random() * 0.5;
    
    // Force a mix of states for visual design
    const states = Object.keys(STATES);
    if (id < 2) this.state = 'PATROL';
    else if (id < 3) this.state = 'ALERT';
    else if (id < 4) this.state = 'CHASE';
    else this.state = 'ATTACK';

    this.targetX = this.x;
    this.targetY = this.y;
    
    this.waypoints = [];
    this.currentWaypointIndex = 0;
    this.generateWaypoints();

    this.viewDistance = 200;
    this.viewAngle = Math.PI / 3; // 60 degrees
    this.attackRange = 70;
    
    this.alertTimer = 0;
  }

  generateWaypoints() {
    this.waypoints = [];
    for(let i=0; i<4; i++) {
      this.waypoints.push({
        x: Math.random() * (width - 100) + 50,
        y: Math.random() * (height - 100) + 50
      });
    }
  }

  update(player, walls) {
    const dToPlayer = dist(this.x, this.y, player.x, player.y);
    const angleToPlayer = angleTo(this.x, this.y, player.x, player.y);
    
    let angleDiff = angleToPlayer - this.angle;
    while (angleDiff <= -Math.PI) angleDiff += Math.PI*2;
    while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
    
    const inFOV = Math.abs(angleDiff) < this.viewAngle / 2;
    const canSee = dToPlayer < this.viewDistance && inFOV && this.hasLineOfSight(player.x, player.y, walls);

    // State Logic
    if (this.state === 'PATROL') {
      if (canSee) {
        this.state = 'CHASE';
      } else {
        this.patrol();
      }
    } 
    else if (this.state === 'ALERT') {
      this.alertTimer--;
      if (this.alertTimer <= 0) this.state = 'PATROL';
      // Simplified investigation
      this.moveTowards(this.targetX, this.targetY);
      if (dist(this.x, this.y, this.targetX, this.targetY) < 5) {
         this.alertTimer -= 1; // Faster timeout if arrived
      }
    }
    else if (this.state === 'CHASE') {
      if (!canSee) {
        this.state = 'ALERT';
        this.alertTimer = 180; // 3 seconds
        this.targetX = player.x;
        this.targetY = player.y;
      } else {
        if (dToPlayer < this.attackRange) {
          this.state = 'ATTACK';
        } else {
          this.moveTowards(player.x, player.y);
        }
      }
    }
    else if (this.state === 'ATTACK') {
      if (dToPlayer > this.viewDistance * 1.1) {
        this.state = 'CHASE';
      } else {
        // Face player
        this.angle = lerp(this.angle, angleToPlayer, 0.2);
        // Shoot occasionally
        if (Math.random() < 0.05) this.shoot(player.x, player.y);
      }
    }
  }

  hasLineOfSight(tx, ty, walls) {
    const p1 = {x: this.x, y: this.y};
    const p2 = {x: tx, y: ty};
    for (let w of walls) {
      for (let seg of w.segments) {
        if (getIntersection(p1, p2, {x: seg.x1, y: seg.y1}, {x: seg.x2, y: seg.y2})) {
          return false;
        }
      }
    }
    return true;
  }

  patrol() {
    const wp = this.waypoints[this.currentWaypointIndex];
    if (dist(this.x, this.y, wp.x, wp.y) < 5) {
      this.currentWaypointIndex = (this.currentWaypointIndex + 1) % this.waypoints.length;
    }
    this.moveTowards(wp.x, wp.y);
  }

  moveTowards(tx, ty) {
    const targetAngle = angleTo(this.x, this.y, tx, ty);
    let diff = targetAngle - this.angle;
    while (diff <= -Math.PI) diff += Math.PI*2;
    while (diff > Math.PI) diff -= Math.PI*2;
    this.angle += diff * 0.1;

    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
    
    this.x = Math.max(20, Math.min(width - 20, this.x));
    this.y = Math.max(20, Math.min(height - 20, this.y));
  }

  shoot(tx, ty) {
    // Muzzle flash
    particles.push(new Particle(this.x + Math.cos(this.angle)*12, this.y + Math.sin(this.angle)*12, '#fff'));
    // Tracer
    particles.push(new Particle(this.x + Math.cos(this.angle)*12, this.y + Math.sin(this.angle)*12, STATES.ATTACK.color));
  }

  draw(ctx) {
    const color = STATES[this.state].color;
    const isFiltered = filterState && this.state !== filterState;
    
    // Apply dimming if filtered out
    ctx.save();
    if (isFiltered) ctx.globalAlpha = 0.15;

    // 1. Draw Attack Range (Dashed Circle) - Only visible in Attack state
    if (this.state === 'ATTACK') {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.attackRange, 0, Math.PI*2);
        ctx.strokeStyle = color;
        ctx.globalAlpha = isFiltered ? 0.1 : 0.3;
        ctx.lineWidth = 1;
        ctx.setLineDash([6, 6]);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    // 2. Draw FOV Cone (Refined Hierarchy)
    if (layers.fov) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      
      // Cone Body
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, this.viewDistance, -this.viewAngle/2, this.viewAngle/2);
      ctx.closePath();
      
      // Gradient fill
      const grad = ctx.createRadialGradient(0, 0, 10, 0, 0, this.viewDistance);
      grad.addColorStop(0, color + '33'); // Low opacity hex
      grad.addColorStop(1, color + '00');
      ctx.fillStyle = grad;
      
      // Apply filter dimming manually to fill
      if (isFiltered) ctx.globalAlpha = 0.1;
      ctx.fill();
      
      // Cone Border
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.globalAlpha = isFiltered ? 0.1 : 0.25; // Reduced opacity per critique
      ctx.stroke();
      
      ctx.restore();
    }

    // 3. Draw Body (Triangle)
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    
    if (isFiltered) ctx.globalAlpha = 0.15;
    
    // Glow
    ctx.shadowColor = color;
    ctx.shadowBlur = 15;
    
    // Shape
    ctx.beginPath();
    ctx.moveTo(12, 0);
    ctx.lineTo(-8, 7);
    ctx.lineTo(-8, -7);
    ctx.closePath();
    
    ctx.fillStyle = color;
    ctx.fill();
    
    // Inner Detail
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-2, 0, 3, 0, Math.PI*2);
    ctx.fill();
    
    ctx.shadowBlur = 0;
    ctx.restore();

    // 4. Draw Labels (Refined Hierarchy)
    if (layers.labels) {
      ctx.save();
      if (isFiltered) ctx.globalAlpha = 0.15;
      
      ctx.fillStyle = color;
      ctx.font = 'bold 12px sans-serif'; // Larger, bolder font
      ctx.textAlign = 'center';
      ctx.fillText(this.state, this.x, this.y - 20);
      
      // Health bar or similar indicator could go here
      ctx.restore();
    }
    ctx.restore();
  }
}

// --- INITIALIZATION & LOOP ---

function init() {
  resize();
  window.addEventListener('resize', resize);
  
  // Mouse handling
  window.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });

  buildLegend();
  generateMap();
  
  requestAnimationFrame(loop);
}

function resize() {
  const container = document.getElementById('canvas-container');
  width = container.clientWidth;
  height = container.clientHeight;
  canvas.width = width;
  canvas.height = height;
}

function buildLegend() {
  legendContainer.innerHTML = '';
  Object.values(STATES).forEach(state => {
    const div = document.createElement('div');
    div.className = 'legend-item';
    div.dataset.state = state.id;
    div.innerHTML = `
      <div class="legend-info">
        <div class="legend-dot" style="background: ${state.color}; color: ${state.color}"></div>
        <div class="legend-text">${state.label}</div>
      </div>
      <div class="legend-count" id="count-${state.id}">0</div>
    `;
    div.onclick = () => {
      // Toggle Filter
      if (filterState === state.id) {
        filterState = null; // Clear filter
      } else {
        filterState = state.id;
      }
      updateLegendUI();
    };
    legendContainer.appendChild(div);
  });
}

function updateLegendUI() {
  // Update counts and active states
  Object.values(STATES).forEach(state => {
    const count = enemies.filter(e => e.state === state.id).length;
    document.getElementById(`count-${state.id}`).innerText = count;
    
    const el = document.querySelector(`.legend-item[data-state="${state.id}"]`);
    if (filterState === state.id) {
      el.classList.add('active');
    } else {
      el.classList.remove('active');
    }
  });
}

function generateMap() {
  walls = [];
  enemies = [];
  particles = [];
  
  // Random Walls
  for(let i=0; i<CONFIG.wallCount; i++) {
    const w = 60 + Math.random() * 150;
    const h = 30 + Math.random() * 60;
    const x = Math.random() * (width - w - 100) + 50;
    const y = Math.random() * (height - h - 100) + 50;
    if (dist(x, y, width/2, height/2) > 150) {
      walls.push(new Wall(x, y, w, h));
    }
  }

  // Spawn Enemies
  for(let i=0; i<CONFIG.enemyCount; i++) {
    enemies.push(new Enemy(i, Math.random() * (width - 100) + 50, Math.random() * (height - 100) + 50));
  }
}

function drawGrid() {
  ctx.strokeStyle = CONFIG.colors.grid;
  ctx.lineWidth = 1;
  const gridSize = 50;
  
  ctx.beginPath();
  for(let x=0; x<=width; x+=gridSize) {
    ctx.moveTo(x, 0);
    ctx.lineTo(x, height);
  }
  for(let y=0; y<=height; y+=gridSize) {
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
  }
  ctx.stroke();
}

function drawPlayer() {
  // Smooth player movement
  playerPos.x = lerp(playerPos.x, mouse.x, 0.15);
  playerPos.y = lerp(playerPos.y, mouse.y, 0.15);

  // Draw Path Connections (Refined Hierarchy)
  if (layers.paths) {
    enemies.forEach(e => {
      ctx.beginPath();
      ctx.moveTo(playerPos.x, playerPos.y);
      ctx.lineTo(e.x, e.y);
      
      // Check visibility for line style
      const d = dist(playerPos.x, playerPos.y, e.x, e.y);
      const angle = angleTo(playerPos.x, playerPos.y, e.x, e.y);
      let angleDiff = angle - e.angle;
      while (angleDiff <= -Math.PI) angleDiff += Math.PI*2;
      while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
      const inFOV = Math.abs(angleDiff) < e.viewAngle / 2;
      const visible = d < e.viewDistance && inFOV && e.hasLineOfSight(playerPos.x, playerPos.y, walls);
      
      if (visible) {
        // Higher opacity pathfinding lines
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
        ctx.lineWidth = 2;
        ctx.setLineDash([]); // Solid line if detected
      } else {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]); // Dotted if not detected
      }
      ctx.stroke();
    });
    
    // Draw Patrol Paths (Dotted lines connecting waypoints)
    if (layers.paths) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.setLineDash([2, 4]);
        ctx.lineWidth = 1;
        enemies.forEach(e => {
            ctx.beginPath();
            e.waypoints.forEach((wp, i) => {
                if (i===0) ctx.moveTo(wp.x, wp.y);
                else ctx.lineTo(wp.x, wp.y);
            });
            ctx.closePath();
            ctx.stroke();
        });
        ctx.restore();
    }
  }

  // Draw Player Entity (Clarified Identity)
  ctx.save();
  ctx.translate(playerPos.x, playerPos.y);
  
  // Pulse
  const time = Date.now() / 400;
  const scale = 1 + Math.sin(time) * 0.1;
  ctx.scale(scale, scale);

  // Outer Glow
  ctx.shadowColor = CONFIG.colors.player;
  ctx.shadowBlur = 20;
  
  // Core
  ctx.beginPath();
  ctx.arc(0, 0, 8, 0, Math.PI*2);
  ctx.fillStyle = CONFIG.colors.player;
  ctx.fill();
  
  // Crosshair / Ring
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, 14, 0, Math.PI*2);
  ctx.stroke();
  
  // Directional Indicators (Rotating)
  ctx.strokeStyle = CONFIG.colors.player;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-18, 0); ctx.lineTo(-22, 0);
  ctx.moveTo(18, 0); ctx.lineTo(22, 0);
  ctx.moveTo(0, -18); ctx.lineTo(0, -22);
  ctx.moveTo(0, 18); ctx.lineTo(0, 22);
  ctx.stroke();

  ctx.restore();

  // Update HUD
  hudPos.innerText = `${Math.floor(playerPos.x)}, ${Math.floor(playerPos.y)}`;
  hudEnemies.innerText = enemies.length;
}

function loop() {
  // Clear
  ctx.fillStyle = CONFIG.colors.bg;
  ctx.fillRect(0, 0, width, height);
  
  drawGrid();

  // Update & Draw Enemies
  enemies.forEach(e => {
    e.update(playerPos, walls);
    e.draw(ctx);
  });

  // Update & Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  // Draw Walls (Over grid, under player)
  walls.forEach(w => w.draw(ctx));

  drawPlayer();

  // Update Legend Counts
  updateLegendUI();

  requestAnimationFrame(loop);
}

// --- INTERACTION ---

window.toggleLayer = (btn, layer) => {
  layers[layer] = !layers[layer];
  btn.classList.toggle('active');
};

window.resetSimulation = () => {
  generateMap();
  playerPos = { x: width/2, y: height/2 };
  mouse = { x: width/2, y: height/2 };
};

// Start
init();

</script>
