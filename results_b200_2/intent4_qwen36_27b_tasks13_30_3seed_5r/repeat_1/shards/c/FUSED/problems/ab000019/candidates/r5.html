<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactical AI Inspector // REVISED</title>
<style>
  :root {
    --bg-deep: #030304;
    --bg-panel: #0a0a0c;
    --bg-panel-highlight: #141418;
    --border: #2a2a30;
    --border-highlight: #444450;
    --text-primary: #e0e0e5;
    --text-secondary: #6e6e75;
    
    /* State Colors */
    --c-patrol: #10b981; /* Emerald */
    --c-alert: #f59e0b;  /* Amber */
    --c-chase: #f97316;  /* Orange */
    --c-attack: #ef4444; /* Red */
    
    --c-player: #38bdf8; /* Cyan */
    --c-grid: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-deep);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 320px;
    grid-template-rows: 48px 1fr;
    font-size: 12px;
    user-select: none;
  }

  /* HEADER */
  header {
    grid-column: 1 / -1;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 20;
  }

  .brand {
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
  }

  .brand span { color: var(--c-player); }

  .header-controls {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .btn {
    background: var(--bg-panel-highlight);
    color: var(--text-primary);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: all 0.15s ease;
  }

  .btn:hover {
    background: var(--border);
    border-color: var(--border-highlight);
  }

  .btn:active {
    transform: translateY(1px);
  }

  /* MAIN CANVAS AREA */
  main {
    position: relative;
    background-color: var(--bg-deep);
    overflow: hidden;
    cursor: crosshair;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* INSPECTOR PANEL */
  aside {
    background: var(--bg-panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    z-index: 10;
    box-shadow: -4px 0 20px rgba(0,0,0,0.3);
  }

  .panel-header {
    padding: 20px 24px 10px;
    border-bottom: 1px solid var(--border);
  }

  .panel-title {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 16px;
  }

  .panel-content {
    padding: 24px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  /* Player Stats */
  .stat-block {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px;
    position: relative;
    overflow: hidden;
  }

  .stat-block::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--c-player);
    box-shadow: 0 0 10px var(--c-player);
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 12px;
  }
  
  .stat-row:last-child { margin-bottom: 0; }

  .stat-label { color: var(--text-secondary); font-size: 11px; }
  .stat-value { font-weight: 600; font-family: 'SF Mono', 'Roboto Mono', monospace; color: var(--text-primary); }
  
  .hp-bar-bg {
    width: 100%;
    height: 6px;
    background: #1a1a1e;
    border-radius: 3px;
    margin-top: 8px;
    overflow: hidden;
  }
  
  .hp-bar-fill {
    height: 100%;
    background: var(--c-player);
    width: 100%;
    box-shadow: 0 0 10px var(--c-player);
    transition: width 0.3s ease;
  }

  /* Legend */
  .legend-grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-radius: 4px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.2s;
    background: rgba(255,255,255,0.01);
  }

  .legend-item:hover {
    background: rgba(255,255,255,0.04);
    border-color: var(--border-highlight);
  }

  .legend-item.active {
    background: var(--bg-panel-highlight);
    border-color: var(--text-secondary);
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  .legend-info {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    box-shadow: 0 0 8px currentColor;
    position: relative;
  }
  
  .legend-dot::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .legend-text {
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .legend-count {
    font-family: 'SF Mono', 'Roboto Mono', monospace;
    font-size: 11px;
    color: var(--text-secondary);
    background: rgba(0,0,0,0.2);
    padding: 2px 6px;
    border-radius: 4px;
  }

  /* Layers */
  .layer-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  
  .layer-btn {
    background: var(--bg-panel-highlight);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 10px 0;
    text-align: center;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  
  .layer-btn.active {
    background: var(--bg-panel);
    color: var(--text-primary);
    border-color: var(--text-secondary);
    box-shadow: 0 0 12px rgba(0,0,0,0.3);
  }
  
  .layer-btn:hover:not(.active) {
    border-color: var(--text-secondary);
    color: var(--text-primary);
    background: rgba(255,255,255,0.05);
  }

</style>
</head>
<body>

<header>
  <div class="brand">
    <span>◆</span> TACTICAL <span style="color:var(--text-secondary); font-weight:400;">//</span> AI INSPECTOR
  </div>
  <div class="header-controls">
    <button class="btn" onclick="resetSimulation()">Reset Map</button>
  </div>
</header>

<main id="canvas-container">
  <canvas id="simCanvas"></canvas>
</main>

<aside>
  <div class="panel-header">
    <div class="panel-title">Selected Unit</div>
    <div class="stat-block">
      <div class="stat-row">
        <span class="stat-label">Unit</span>
        <span class="stat-value" style="color: var(--c-player)">PLAYER_ONE</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Health</span>
        <span class="stat-value">100%</span>
      </div>
      <div class="hp-bar-bg"><div class="hp-bar-fill"></div></div>
    </div>
  </div>

  <div class="panel-content">
    <!-- Legend -->
    <div>
      <div class="panel-title">AI States (Global Legend)</div>
      <div class="legend-grid" id="legend-container">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- Layers -->
    <div>
      <div class="panel-title">Visualization Layers</div>
      <div class="layer-grid">
        <button class="layer-btn active" data-layer="paths" onclick="toggleLayer(this, 'paths')">Paths</button>
        <button class="layer-btn active" data-layer="fov" onclick="toggleLayer(this, 'fov')">Sensors</button>
        <button class="layer-btn active" data-layer="labels" onclick="toggleLayer(this, 'labels')">Data</button>
      </div>
    </div>
  </div>
</aside>

<script>
/**
 * TACTICAL AI SIMULATION ENGINE
 * REVISED: Visual Hierarchy, Contrast & State Clarity
 */

const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const legendContainer = document.getElementById('legend-container');

// --- CONFIGURATION & CONSTANTS ---

const STATES = {
  PATROL: { id: 'PATROL', color: '#10b981', label: 'Patrol', desc: 'Idle / Waypoint' },
  ALERT:  { id: 'ALERT',  color: '#f59e0b', label: 'Alert',  desc: 'Investigating' },
  CHASE:  { id: 'CHASE',  color: '#f97316', label: 'Chase',  desc: 'Engaging' },
  ATTACK: { id: 'ATTACK', color: '#ef4444', label: 'Attack', desc: 'Combat' }
};

const CONFIG = {
  colors: {
    bg: '#030304',
    grid: '#ffffff', // 10% opacity applied in draw
    wallFill: '#151518',
    wallStroke: '#4a4a55',
    wallHighlight: '#6a6a75',
    player: '#38bdf8'
  },
  enemyCount: 6,
  wallCount: 8
};

// --- STATE ---

let width, height;
let lastTime = 0;
let mouse = { x: 0, y: 0 };
let playerPos = { x: 0, y: 0 }; 
let walls = [];
let enemies = [];
let particles = [];

// UI State
let layers = { paths: true, fov: true, labels: true };
let filterState = null; 

// --- UTILS ---

const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const lerp = (a, b, t) => a + (b - a) * t;
const angleTo = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);

// Line segment intersection
function getIntersection(A, B, C, D) {
  const tTop = (D.x - C.x) * (A.y - C.y) - (D.y - C.y) * (A.x - C.x);
  const uTop = (C.y - A.y) * (A.x - B.x) - (C.x - A.x) * (A.y - B.y);
  const bottom = (D.y - C.y) * (B.x - A.x) - (D.x - C.x) * (B.y - A.y);

  if (bottom !== 0) {
    const t = tTop / bottom;
    const u = uTop / bottom;
    if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
      return { x: lerp(A.x, B.x, t), y: lerp(A.y, B.y, t), offset: t }
    }
  }
  return null;
}

// --- CLASSES ---

class Wall {
  constructor(x, y, w, h) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.segments = [
      {x1: x, y1: y, x2: x + w, y2: y},
      {x1: x + w, y1: y, x2: x + w, y2: y + h},
      {x1: x + w, y1: y + h, x2: x, y2: y + h},
      {x1: x, y1: y + h, x2: x, y2: y}
    ];
  }

  draw(ctx) {
    // CRITIQUE 1: Solid fill with distinct stroke
    ctx.fillStyle = CONFIG.colors.wallFill;
    ctx.strokeStyle = CONFIG.colors.wallStroke;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.rect(this.x, this.y, this.w, this.h);
    ctx.fill();
    ctx.stroke();

    // 3D Top Highlight (Subtle)
    ctx.fillStyle = CONFIG.colors.wallHighlight;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x + this.w, this.y);
    ctx.lineTo(this.x + this.w - 6, this.y + 6);
    ctx.lineTo(this.x + 6, this.y + 6);
    ctx.closePath();
    ctx.fill();
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.color = color;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 1.0;
    this.decay = 0.04 + Math.random() * 0.04;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }
  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Enemy {
  constructor(id, startX, startY) {
    this.id = id;
    this.x = startX;
    this.y = startY;
    this.radius = 10;
    this.angle = Math.random() * Math.PI * 2;
    this.speed = 1.0 + Math.random() * 0.5;
    
    // Force a mix of states for visual design
    const states = Object.keys(STATES);
    if (id < 2) this.state = 'PATROL';
    else if (id < 3) this.state = 'ALERT';
    else if (id < 4) this.state = 'CHASE';
    else this.state = 'ATTACK';

    this.targetX = this.x;
    this.targetY = this.y;
    
    this.waypoints = [];
    this.currentWaypointIndex = 0;
    this.generateWaypoints();

    this.viewDistance = 220;
    this.viewAngle = Math.PI / 2.5; // Wider cone
    this.attackRange = 70;
    
    this.alertTimer = 0;
  }

  generateWaypoints() {
    this.waypoints = [];
    for(let i=0; i<4; i++) {
      this.waypoints.push({
        x: Math.random() * (width - 100) + 50,
        y: Math.random() * (height - 100) + 50
      });
    }
  }

  update(player, walls) {
    const dToPlayer = dist(this.x, this.y, player.x, player.y);
    const angleToPlayer = angleTo(this.x, this.y, player.x, player.y);
    
    let angleDiff = angleToPlayer - this.angle;
    while (angleDiff <= -Math.PI) angleDiff += Math.PI*2;
    while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
    
    const inFOV = Math.abs(angleDiff) < this.viewAngle / 2;
    const canSee = dToPlayer < this.viewDistance && inFOV && this.hasLineOfSight(player.x, player.y, walls);

    // State Logic
    if (this.state === 'PATROL') {
      if (canSee) {
        this.state = 'CHASE';
      } else {
        this.patrol();
      }
    } 
    else if (this.state === 'ALERT') {
      this.alertTimer--;
      if (this.alertTimer <= 0) this.state = 'PATROL';
      this.moveTowards(this.targetX, this.targetY);
      if (dist(this.x, this.y, this.targetX, this.targetY) < 5) {
         this.alertTimer -= 1; 
      }
    }
    else if (this.state === 'CHASE') {
      if (!canSee) {
        this.state = 'ALERT';
        this.alertTimer = 180; 
        this.targetX = player.x;
        this.targetY = player.y;
      } else {
        if (dToPlayer < this.attackRange) {
          this.state = 'ATTACK';
        } else {
          this.moveTowards(player.x, player.y);
        }
      }
    }
    else if (this.state === 'ATTACK') {
      if (dToPlayer > this.viewDistance * 1.1) {
        this.state = 'CHASE';
      } else {
        this.angle = lerp(this.angle, angleToPlayer, 0.2);
        if (Math.random() < 0.05) this.shoot(player.x, player.y);
      }
    }
  }

  hasLineOfSight(tx, ty, walls) {
    const p1 = {x: this.x, y: this.y};
    const p2 = {x: tx, y: ty};
    for (let w of walls) {
      for (let seg of w.segments) {
        if (getIntersection(p1, p2, {x: seg.x1, y: seg.y1}, {x: seg.x2, y: seg.y2})) {
          return false;
        }
      }
    }
    return true;
  }

  patrol() {
    const wp = this.waypoints[this.currentWaypointIndex];
    if (dist(this.x, this.y, wp.x, wp.y) < 5) {
      this.currentWaypointIndex = (this.currentWaypointIndex + 1) % this.waypoints.length;
    }
    this.moveTowards(wp.x, wp.y);
  }

  moveTowards(tx, ty) {
    const targetAngle = angleTo(this.x, this.y, tx, ty);
    let diff = targetAngle - this.angle;
    while (diff <= -Math.PI) diff += Math.PI*2;
    while (diff > Math.PI) diff -= Math.PI*2;
    this.angle += diff * 0.1;

    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
    
    this.x = Math.max(20, Math.min(width - 20, this.x));
    this.y = Math.max(20, Math.min(height - 20, this.y));
  }

  shoot(tx, ty) {
    particles.push(new Particle(this.x + Math.cos(this.angle)*12, this.y + Math.sin(this.angle)*12, '#fff'));
    particles.push(new Particle(this.x + Math.cos(this.angle)*12, this.y + Math.sin(this.angle)*12, STATES.ATTACK.color));
  }

  draw(ctx) {
    const color = STATES[this.state].color;
    const isFiltered = filterState && this.state !== filterState;
    
    ctx.save();
    if (isFiltered) ctx.globalAlpha = 0.15;

    // 1. Draw Attack Range (CRITIQUE 3: Red Dashed Ring)
    // Only visible in attack state or for debugging, but let's make it subtle for others
    if (this.state === 'ATTACK') {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.attackRange, 0, Math.PI*2);
      ctx.strokeStyle = color;
      ctx.globalAlpha = isFiltered ? 0.05 : 0.4; // Higher opacity for attack
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 8]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // 2. Draw FOV Cone (CRITIQUE 1: Increased Opacity/Saturation)
    if (layers.fov) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      
      // Cone Body
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, this.viewDistance, -this.viewAngle/2, this.viewAngle/2);
      ctx.closePath();
      
      // Gradient fill
      const grad = ctx.createRadialGradient(0, 0, 10, 0, 0, this.viewDistance);
      // CRITIQUE 1: Higher opacity stops (44 -> 66)
      grad.addColorStop(0, color + '44'); 
      grad.addColorStop(1, color + '00');
      ctx.fillStyle = grad;
      
      if (isFiltered) ctx.globalAlpha = 0.1;
      ctx.fill();
      
      // Cone Border
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = isFiltered ? 0.1 : 0.6; // Higher border opacity
      ctx.stroke();
      
      ctx.restore();
    }

    // 3. Draw Body (CRITIQUE 2: High Contrast)
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    
    if (isFiltered) ctx.globalAlpha = 0.15;
    
    // Glow
    ctx.shadowColor = color;
    ctx.shadowBlur = 15;
    
    // Shape
    ctx.beginPath();
    ctx.moveTo(12, 0);
    ctx.lineTo(-8, 7);
    ctx.lineTo(-8, -7);
    ctx.closePath();
    
    ctx.fillStyle = color;
    ctx.fill();
    
    // Inner Detail
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-2, 0, 3, 0, Math.PI*2);
    ctx.fill();
    
    ctx.shadowBlur = 0;
    ctx.restore();

    // 4. Draw Labels (CRITIQUE 3: State Differentiation)
    if (layers.labels) {
      ctx.save();
      if (isFiltered) ctx.globalAlpha = 0.15;
      
      // Text styling
      ctx.font = 'bold 11px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      const text = this.state;
      const textMetrics = ctx.measureText(text);
      const textWidth = textMetrics.width;
      const padding = 6;
      
      // Draw dark pill background
      ctx.fillStyle = '#050507'; // Darker pill
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      
      ctx.beginPath();
      // CRITIQUE 3: Label matches state color
      ctx.roundRect(
        this.x - textWidth/2 - padding, 
        this.y - 26 - 8, 
        textWidth + padding*2, 
        18, 
        4
      );
      ctx.fill();
      ctx.stroke();
      
      // Draw text on top
      ctx.fillStyle = color;
      ctx.fillText(text, this.x, this.y - 26);
      
      ctx.restore();
    }
    ctx.restore();
  }
}

// --- INITIALIZATION & LOOP ---

function init() {
  resize();
  window.addEventListener('resize', resize);
  
  window.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });

  buildLegend();
  generateMap();
  
  requestAnimationFrame(loop);
}

function resize() {
  const container = document.getElementById('canvas-container');
  width = container.clientWidth;
  height = container.clientHeight;
  canvas.width = width;
  canvas.height = height;
}

function buildLegend() {
  legendContainer.innerHTML = '';
  Object.values(STATES).forEach(state => {
    const div = document.createElement('div');
    div.className = 'legend-item';
    div.dataset.state = state.id;
    div.innerHTML = `
      <div class="legend-info">
        <div class="legend-dot" style="background: ${state.color}; color: ${state.color}"></div>
        <div class="legend-text">${state.label}</div>
      </div>
      <div class="legend-count" id="count-${state.id}">0</div>
    `;
    div.onclick = () => {
      if (filterState === state.id) {
        filterState = null; 
      } else {
        filterState = state.id;
      }
      updateLegendUI();
    };
    legendContainer.appendChild(div);
  });
}

function updateLegendUI() {
  Object.values(STATES).forEach(state => {
    const count = enemies.filter(e => e.state === state.id).length;
    document.getElementById(`count-${state.id}`).innerText = count;
    
    const el = document.querySelector(`.legend-item[data-state="${state.id}"]`);
    if (filterState === state.id) {
      el.classList.add('active');
    } else {
      el.classList.remove('active');
    }
  });
}

function generateMap() {
  walls = [];
  enemies = [];
  particles = [];
  
  for(let i=0; i<CONFIG.wallCount; i++) {
    const w = 80 + Math.random() * 150;
    const h = 40 + Math.random() * 60;
    const x = Math.random() * (width - w - 100) + 50;
    const y = Math.random() * (height - h - 100) + 50;
    if (dist(x, y, width/2, height/2) > 150) {
      walls.push(new Wall(x, y, w, h));
    }
  }

  for(let i=0; i<CONFIG.enemyCount; i++) {
    enemies.push(new Enemy(i, Math.random() * (width - 100) + 50, Math.random() * (height - 100) + 50));
  }
}

function drawGrid() {
  // CRITIQUE 4: Dim background grid to 10% opacity
  ctx.globalAlpha = 0.1;
  ctx.strokeStyle = CONFIG.colors.grid;
  ctx.lineWidth = 1;
  const gridSize = 60;
  
  ctx.beginPath();
  for(let x=0; x<=width; x+=gridSize) {
    ctx.moveTo(x, 0);
    ctx.lineTo(x, height);
  }
  for(let y=0; y<=height; y+=gridSize) {
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
  }
  ctx.stroke();
  ctx.globalAlpha = 1.0;
}

function drawPlayer() {
  playerPos.x = lerp(playerPos.x, mouse.x, 0.15);
  playerPos.y = lerp(playerPos.y, mouse.y, 0.15);

  // Draw paths from player to enemies
  if (layers.paths) {
    enemies.forEach(e => {
      ctx.beginPath();
      ctx.moveTo(playerPos.x, playerPos.y);
      ctx.lineTo(e.x, e.y);
      
      const d = dist(playerPos.x, playerPos.y, e.x, e.y);
      const angle = angleTo(playerPos.x, playerPos.y, e.x, e.y);
      let angleDiff = angle - e.angle;
      while (angleDiff <= -Math.PI) angleDiff += Math.PI*2;
      while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
      const inFOV = Math.abs(angleDiff) < e.viewAngle / 2;
      const visible = d < e.viewDistance && inFOV && e.hasLineOfSight(playerPos.x, playerPos.y, walls);
      
      if (visible) {
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
        ctx.lineWidth = 2;
        ctx.setLineDash([]); 
        ctx.shadowColor = 'rgba(56, 189, 248, 0.4)';
        ctx.shadowBlur = 5;
      } else {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)'; // Very faint
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]); 
        ctx.shadowBlur = 0;
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    });
    
    // Draw Patrol Paths
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.setLineDash([2, 4]);
    ctx.lineWidth = 1;
    enemies.forEach(e => {
        ctx.beginPath();
        e.waypoints.forEach((wp, i) => {
            if (i===0) ctx.moveTo(wp.x, wp.y);
            else ctx.lineTo(wp.x, wp.y);
        });
        ctx.closePath();
        ctx.stroke();
    });
    ctx.restore();
  }

  // CRITIQUE 2: Player Identity (High Contrast Blue)
  ctx.save();
  ctx.translate(playerPos.x, playerPos.y);
  
  const time = Date.now() / 400;
  const scale = 1 + Math.sin(time) * 0.05;
  ctx.scale(scale, scale);

  // Outer Glow
  ctx.shadowColor = CONFIG.colors.player;
  ctx.shadowBlur = 25;
  
  // Core
  ctx.beginPath();
  ctx.arc(0, 0, 10, 0, Math.PI*2);
  ctx.fillStyle = CONFIG.colors.player;
  ctx.fill();
  
  // Ring
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, 16, 0, Math.PI*2);
  ctx.stroke();
  
  // Crosshair
  ctx.strokeStyle = CONFIG.colors.player;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-22, 0); ctx.lineTo(-14, 0);
  ctx.moveTo(22, 0); ctx.lineTo(14, 0);
  ctx.moveTo(0, -22); ctx.lineTo(0, -14);
  ctx.moveTo(0, 22); ctx.lineTo(0, 14);
  ctx.stroke();

  ctx.restore();
}

function loop() {
  ctx.fillStyle = CONFIG.colors.bg;
  ctx.fillRect(0, 0, width, height);
  
  drawGrid();

  enemies.forEach(e => {
    e.update(playerPos, walls);
    e.draw(ctx);
  });

  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  walls.forEach(w => w.draw(ctx));

  drawPlayer();

  updateLegendUI();

  requestAnimationFrame(loop);
}

window.toggleLayer = (btn, layer) => {
  layers[layer] = !layers[layer];
  btn.classList.toggle('active');
};

window.resetSimulation = () => {
  generateMap();
  playerPos = { x: width/2, y: height/2 };
  mouse = { x: width/2, y: height/2 };
};

init();

</script>
