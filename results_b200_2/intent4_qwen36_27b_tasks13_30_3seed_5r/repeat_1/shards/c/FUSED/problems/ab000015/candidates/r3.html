<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Alpine Velocity: Sliding Challenge</title>
<style>
    :root {
        /* Palette: Deep Alpine, Vibrant Ice, High Contrast */
        --sky-top: #0f172a;
        --sky-horizon: #3b82f6;
        --ice-shadow: #64748b;
        --ice-highlight: #e0f2fe;
        --player-orange: #f97316;
        --player-dark: #c2410c;
        --gate-red: #ef4444;
        --gate-blue: #0ea5e9;
        --rock-dark: #1e293b;
        --rock-light: #475569;
        --hud-bg: rgba(15, 23, 42, 0.35);
        --text-white: #ffffff;
        --font-main: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        margin: 0;
        padding: 0;
    }

    body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--sky-top);
        font-family: var(--font-main);
    }

    #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    /* --- LAYERS --- */
    .layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }

    /* 1. BACKGROUND */
    #bg-layer {
        z-index: 1;
        background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-horizon) 35%, #f1f5f9 35.5%);
    }

    /* 2. SLOPE: Canvas for terrain texture */
    #slope-canvas {
        z-index: 2;
        display: block;
    }

    /* 3. ENTITIES: Obstacles & Gates */
    #entities-layer {
        z-index: 3;
    }

    /* 4. PLAYER */
    #player-layer {
        z-index: 4;
        bottom: 12%; /* Slightly higher for better visibility */
        left: 50%;
        width: 120px; /* Slightly larger */
        height: 120px;
        transform: translate(-50%, 0) rotate(0deg);
        transition: transform 0.1s ease-out;
        filter: drop-shadow(0 15px 15px rgba(0,0,0,0.5));
    }

    /* 5. FX: Particles & Speed lines */
    #fx-canvas {
        z-index: 5;
        mix-blend-mode: screen; /* Makes white particles pop */
    }

    /* 6. ATMOSPHERE: Fog & Vignette */
    #atmosphere-layer {
        z-index: 6;
        background: 
            radial-gradient(circle at 50% 35%, transparent 0%, rgba(255,255,255,0.4) 20%, transparent 40%), /* Horizon Haze */
            radial-gradient(circle at center, transparent 40%, rgba(15, 23, 42, 0.7) 100%); /* Vignette */
    }

    /* 7. HUD */
    #hud-layer {
        z-index: 10;
        padding: 24px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 100%;
    }

    /* --- HUD ELEMENTS --- */
    
    /* Top Bar */
    .hud-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        width: 100%;
    }

    .stat-box {
        background: var(--hud-bg);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 8px 16px;
        border-radius: 12px;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        transform: skewX(-10deg);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        min-width: 130px;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
    }
    
    /* Accent lines on HUD */
    .stat-box::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        background: var(--gate-blue);
        box-shadow: 0 0 10px var(--gate-blue);
    }
    
    .stat-box.distance::after {
        background: var(--gate-red);
        box-shadow: 0 0 10px var(--gate-red);
    }

    .stat-label {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #94a3b8;
        margin-bottom: 2px;
        transform: skewX(10deg);
        font-weight: 600;
    }

    .stat-value {
        font-size: 1.8rem;
        font-weight: 800;
        font-style: italic;
        color: var(--text-white);
        text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        transform: skewX(10deg);
        line-height: 1;
        font-variant-numeric: tabular-nums;
    }

    .stat-unit {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--ice-highlight);
        margin-left: 6px;
        opacity: 0.8;
    }

    /* Progress Bar - Sleek */
    .progress-wrapper {
        position: absolute;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: 220px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .progress-label {
        font-size: 0.7rem;
        color: white;
        font-weight: 700;
        letter-spacing: 1px;
        margin-bottom: 8px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        text-transform: uppercase;
    }

    .progress-track {
        width: 100%;
        height: 6px;
        background: rgba(0,0,0,0.4);
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
    }

    .progress-fill {
        height: 100%;
        width: 30%;
        background: linear-gradient(90deg, var(--gate-blue), #38bdf8);
        box-shadow: 0 0 15px var(--gate-blue);
        transition: width 0.1s linear;
        border-radius: 10px;
    }

    /* Impact Meter */
    .impact-meter {
        position: absolute;
        top: 80px;
        left: 50%;
        transform: translateX(-50%);
        width: 180px;
        height: 8px;
        background: rgba(0,0,0,0.6);
        border-radius: 4px;
        display: flex;
        align-items: center;
        opacity: 0;
        transition: opacity 0.2s;
        border: 1px solid rgba(255,255,255,0.1);
    }
    .impact-meter.active { opacity: 1; }
    
    .impact-fill {
        width: 0%;
        height: 100%;
        background: var(--gate-red);
        box-shadow: 0 0 10px var(--gate-red);
        transition: width 0.05s;
        border-radius: 2px;
    }

    /* --- CONTROLS --- */
    .controls-area {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding: 0 20px 40px 20px;
        width: 100%;
    }

    .control-btn {
        width: 90px;
        height: 90px;
        /* Icy Grip Look */
        background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-top: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 20px; /* Squircle */
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
        cursor: pointer;
        transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 15px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.2);
        position: relative;
        overflow: hidden;
    }

    /* Gloss effect on buttons */
    .control-btn::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 50%;
        background: linear-gradient(to bottom, rgba(255,255,255,0.2), transparent);
        border-radius: 20px 20px 0 0;
    }

    .control-btn:active {
        background: rgba(6, 182, 212, 0.3);
        transform: scale(0.92);
        border-color: var(--gate-blue);
        box-shadow: 0 0 20px var(--gate-blue);
    }

    .control-btn svg {
        width: 40px;
        height: 40px;
        fill: white;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    /* --- ENTITIES STYLES --- */
    
    /* Gates */
    .gate {
        position: absolute;
        width: 140px;
        height: 120px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        z-index: 3;
    }

    .gate-pole {
        width: 12px;
        height: 100%;
        background: linear-gradient(90deg, #e2e8f0, #94a3b8);
        position: absolute;
        top: 0;
        box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        border-radius: 4px;
        border: 1px solid rgba(255,255,255,0.5);
    }
    .gate-pole.left { left: 0; }
    .gate-pole.right { right: 0; }

    .gate-flag {
        position: absolute;
        top: 0;
        width: 100%;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        color: #fff;
        font-size: 1.8rem;
        text-shadow: 0 2px 0 rgba(0,0,0,0.3);
        z-index: 2;
        /* Shape: Pennant */
        clip-path: polygon(0 0, 100% 0, 90% 100%, 10% 100%);
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    
    .gate-blue .gate-flag { background: linear-gradient(180deg, #38bdf8, #0284c7); border-top: 2px solid #bae6fd; }
    .gate-red .gate-flag { background: linear-gradient(180deg, #f43f5e, #be123c); border-top: 2px solid #fda4af; }

    /* Rocks */
    .rock-obs {
        position: absolute;
        width: 120px;
        height: 80px;
        filter: drop-shadow(0 10px 10px rgba(0,0,0,0.6));
    }

    /* Trees */
    .tree-obs {
        position: absolute;
        width: 100px;
        height: 220px;
        display: flex;
        flex-direction: column;
        align-items: center;
        filter: drop-shadow(0 15px 15px rgba(0,0,0,0.5));
    }
    .trunk {
        width: 18px;
        height: 50px;
        background: #3e2723;
        margin-top: auto;
        border-radius: 2px;
    }
    .leaves {
        width: 0;
        height: 0;
        border-left: 45px solid transparent;
        border-right: 45px solid transparent;
        border-bottom: 60px solid #14532d;
        margin-bottom: -25px;
        position: relative;
        filter: drop-shadow(0 4px 2px rgba(0,0,0,0.2));
    }
    /* Snow cap on tree */
    .leaves::before {
        content: '';
        position: absolute;
        top: 15px; left: -30px;
        width: 0; height: 0;
        border-left: 30px solid transparent;
        border-right: 30px solid transparent;
        border-bottom: 20px solid #f8fafc;
        opacity: 0.9;
    }
    .leaves::after {
        content: '';
        position: absolute;
        top: 15px;
        left: -40px;
        width: 0;
        height: 0;
        border-left: 40px solid transparent;
        border-right: 40px solid transparent;
        border-bottom: 60px solid #166534;
    }

</style>
</head>
<body>

<div id="game-container">
    <!-- 1. BACKGROUND -->
    <div id="bg-layer" class="layer">
        <svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" style="width:100%; height:100%;">
            <defs>
                <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:var(--sky-top);stop-opacity:1" />
                    <stop offset="100%" style="stop-color:var(--sky-horizon);stop-opacity:1" />
                </linearGradient>
                <linearGradient id="mtnFar" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="mtnNear" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
                </linearGradient>
                <filter id="blurSmall">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
                </filter>
            </defs>
            <rect width="1000" height="350" fill="url(#skyGrad)" />
            <!-- Far Mountains -->
            <path d="M0 350 L150 200 L300 350 L450 150 L600 350 L750 220 L900 350 L1000 280 L1000 1000 L0 1000 Z" fill="url(#mtnFar)" opacity="0.8"/>
            <!-- Near Mountains -->
            <path d="M0 350 L200 250 L400 350 L600 200 L800 350 L1000 250 L1000 1000 L0 1000 Z" fill="url(#mtnNear)" opacity="0.9"/>
            <!-- Snow Caps -->
            <path d="M450 150 L400 220 L500 220 Z" fill="#f1f5f9" opacity="0.8"/>
            <path d="M600 200 L550 260 L650 260 Z" fill="#f1f5f9" opacity="0.8"/>
        </svg>
    </div>

    <!-- 2. SLOPE CANVAS -->
    <canvas id="slope-canvas" class="layer"></canvas>

    <!-- 3. ENTITIES -->
    <div id="entities-layer" class="layer"></div>

    <!-- 4. PLAYER -->
    <div id="player-layer" class="layer">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
            <!-- Shadow -->
            <ellipse cx="50" cy="98" rx="35" ry="6" fill="rgba(0,0,0,0.5)" filter="blur(2px)" />
            <!-- Snowboard -->
            <g transform="translate(0, 2)">
                <!-- Board Body -->
                <rect x="2" y="82" width="96" height="12" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
                <!-- Board Graphics -->
                <path d="M5 82 L95 82 L90 94 L10 94 Z" fill="var(--player-orange)" />
                <path d="M20 82 L30 94" stroke="#fff" stroke-width="2" opacity="0.5"/>
                <path d="M80 82 L70 94" stroke="#fff" stroke-width="2" opacity="0.5"/>
                <!-- Boots -->
                <rect x="22" y="78" width="16" height="8" rx="3" fill="#334155" />
                <rect x="62" y="78" width="16" height="8" rx="3" fill="#334155" />
            </g>
            <!-- Legs (Simple Vector) -->
            <path d="M42 65 L35 82" stroke="#0f172a" stroke-width="9" stroke-linecap="round" />
            <path d="M58 65 L65 82" stroke="#0f172a" stroke-width="9" stroke-linecap="round" />
            <!-- Body/Jacket -->
            <path d="M35 65 L55 30 L65 65 Z" fill="var(--player-orange)" stroke="var(--player-dark)" stroke-width="1"/>
            <!-- Backpack -->
            <rect x="38" y="38" width="24" height="18" rx="4" fill="#0f172a" />
            <!-- Head/Helmet -->
            <circle cx="50" cy="22" r="13" fill="#1e293b" />
            <!-- Goggles -->
            <rect x="38" y="18" width="24" height="8" rx="2" fill="#3b82f6" opacity="0.8"/>
            <rect x="40" y="19" width="6" height="4" rx="1" fill="#fff" opacity="0.6"/>
            <!-- Scarf (Dynamic) -->
            <path d="M45 32 Q25 40 15 35" stroke="#ef4444" stroke-width="5" fill="none" stroke-linecap="round" id="scarf-path"/>
        </svg>
    </div>

    <!-- 5. FX CANVAS -->
    <canvas id="fx-canvas" class="layer"></canvas>

    <!-- 6. ATMOSPHERE -->
    <div id="atmosphere-layer" class="layer"></div>

    <!-- 7. HUD -->
    <div id="hud-layer" class="layer">
        <div class="hud-top">
            <div class="stat-box">
                <span class="stat-label">Speed</span>
                <span class="stat-value" id="speed-val">0 <span class="stat-unit">km/h</span></span>
            </div>
            <div class="stat-box distance">
                <span class="stat-label">Distance</span>
                <span class="stat-value" id="dist-val">0 <span class="stat-unit">m</span></span>
            </div>
        </div>

        <div class="progress-wrapper">
            <span class="progress-label">Goal: 1000m</span>
            <div class="progress-track">
                <div class="progress-fill" id="progress-bar"></div>
            </div>
        </div>

        <div class="impact-meter" id="impact-meter">
            <div class="impact-fill" id="impact-bar-fill"></div>
        </div>

        <div class="controls-area">
            <div class="control-btn" id="btn-left">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </div>
            <div class="control-btn" id="btn-right">
                <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </div>
        </div>
    </div>
</div>

<script>
    /* --- CONFIGURATION --- */
    const canvasSlope = document.getElementById('slope-canvas');
    const ctxSlope = canvasSlope.getContext('2d');
    const canvasFx = document.getElementById('fx-canvas');
    const ctxFx = canvasFx.getContext('2d');
    const entitiesLayer = document.getElementById('entities-layer');
    const playerEl = document.getElementById('player-layer');
    const speedVal = document.getElementById('speed-val');
    const distVal = document.getElementById('dist-val');
    const progressBar = document.getElementById('progress-bar');
    const impactMeter = document.getElementById('impact-meter');
    const impactBar = document.getElementById('impact-bar-fill');
    const scarfPath = document.getElementById('scarf-path');

    let width, height;
    let gameFrame = 0;
    let speed = 0;
    let targetSpeed = 140; 
    let distance = 0;
    let playerX = 0.5; // 0 to 1
    let targetPlayerX = 0.5;
    
    // Perspective Constants
    const horizonY = 0.36; 
    const vanishPointX = 0.5; 
    
    const obstacles = [];
    const particles = [];
    
    // Input State
    let input = { left: false, right: false };

    /* --- INITIALIZATION --- */
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvasSlope.width = width;
        canvasSlope.height = height;
        canvasFx.width = width;
        canvasFx.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    /* --- LOGIC --- */

    function updatePhysics() {
        // Speed ramping
        if (speed < targetSpeed) speed += 0.3;
        if (speed > targetSpeed) speed -= 0.5;
        
        // Steering
        if (input.left) targetPlayerX -= 0.006;
        if (input.right) targetPlayerX += 0.006;
        
        // Boundaries
        if (targetPlayerX < 0.1) targetPlayerX = 0.1;
        if (targetPlayerX > 0.9) targetPlayerX = 0.9;

        // Smooth movement (Lerp)
        playerX += (targetPlayerX - playerX) * 0.12;
        
        // Visual Updates
        playerEl.style.left = `${playerX * 100}%`;
        
        // Lean into turn
        const tilt = (targetPlayerX - playerX) * 350;
        playerEl.style.transform = `translate(-50%, 0) rotate(${tilt}deg)`;

        // Scarf Animation
        const scarfOffset = Math.sin(Date.now() * 0.01) * 5;
        scarfPath.setAttribute('d', `M45 32 Q25 ${40 + scarfOffset} 15 ${35 + scarfOffset}`);

        // HUD Updates
        speedVal.innerHTML = Math.floor(speed) + ' <span class="stat-unit">km/h</span>';
        distance += speed * 0.016;
        distVal.innerHTML = Math.floor(distance) + ' <span class="stat-unit">m</span>';
        
        // Progress Loop
        let progress = (distance % 1000) / 10;
        progressBar.style.width = `${progress}%`;

        // Obstacle Management
        if (Math.random() < 0.025 + (speed/2500)) {
            spawnObstacle();
        }
        
        let closestZ = 1.5;
        
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.z += (speed * 0.00045); 
            
            // Track closest for impact meter
            if (obs.z > 0.6 && obs.z < 1.0) {
                if (Math.abs(obs.x - playerX) < 0.15) {
                    let distToCollision = 1.0 - obs.z;
                    if (distToCollision < closestZ) closestZ = distToCollision;
                }
            }

            // Collision
            if (obs.z > 0.85 && obs.z < 0.96) {
                if (Math.abs(obs.x - playerX) < 0.08) {
                    triggerWarning();
                    speed *= 0.5;
                    obs.z = 1.5; // Recycle
                    // Camera shake effect could go here
                }
            }

            // Cleanup
            if (obs.z > 1.3) {
                if(obs.el) obs.el.remove();
                obstacles.splice(i, 1);
            } else {
                renderObstacle(obs);
            }
        }

        // Impact Meter UI
        if (closestZ < 0.4 && closestZ > 0) {
            impactMeter.classList.add('active');
            let danger = Math.max(0, Math.min(100, (1 - (closestZ / 0.4)) * 100));
            impactBar.style.width = `${danger}%`;
        } else {
            impactMeter.classList.remove('active');
        }

        // Particles
        if (speed > 20 && Math.random() < 0.4) {
            spawnParticle();
        }
        updateParticles();
    }

    function spawnObstacle() {
        const rand = Math.random();
        const type = rand < 0.5 ? 'gate' : (rand < 0.8 ? 'rock' : 'tree');
        const x = 0.15 + Math.random() * 0.7; 
        const el = document.createElement('div');
        
        if (type === 'gate') {
            el.className = Math.random() > 0.5 ? 'gate gate-red' : 'gate gate-blue';
            el.innerHTML = `
                <div class="gate-pole left"></div>
                <div class="gate-pole right"></div>
                <div class="gate-flag">${Math.floor(Math.random()*99)}</div>
            `;
        } else if (type === 'rock') {
            el.className = 'rock-obs';
            el.innerHTML = `<svg viewBox="0 0 100 60" width="100%" height="100%">
                <path d="M10 55 L25 20 L45 30 L65 5 L90 15 L95 55 Z" fill="var(--rock-dark)" stroke="var(--rock-light)" stroke-width="2" stroke-linejoin="round"/>
                <path d="M25 20 L65 5 L90 15" fill="none" stroke="var(--rock-light)" stroke-width="2"/>
                <path d="M15 55 L90 55" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="5,5"/>
            </svg>`;
        } else {
            el.className = 'tree-obs';
            el.innerHTML = `<div class="leaves"></div><div class="trunk"></div>`;
        }
        
        entitiesLayer.appendChild(el);
        
        obstacles.push({
            type: type,
            x: x,
            z: 0, 
            el: el
        });
    }

    function renderObstacle(obs) {
        const scale = Math.pow(obs.z, 2.2) * 3.5; // Slightly steeper curve for depth
        
        const yPos = horizonY + (obs.z * (1 - horizonY));
        
        const spread = obs.z; 
        const xPos = 0.5 + (obs.x - 0.5) * spread;

        const baseW = obs.type === 'gate' ? 140 : (obs.type === 'rock' ? 120 : 100);
        const baseH = obs.type === 'gate' ? 120 : (obs.type === 'rock' ? 80 : 220);

        obs.el.style.width = `${baseW * scale}px`;
        obs.el.style.height = `${baseH * scale}px`;
        
        obs.el.style.left = `${xPos * 100}%`;
        obs.el.style.top = `${yPos * 100}%`;
        obs.el.style.transform = `translate(-50%, -100%)`;
        obs.el.style.opacity = obs.z < 0.1 ? obs.z * 10 : 1;
    }

    function triggerWarning() {
        const flash = document.createElement('div');
        flash.style.position = 'absolute';
        flash.style.top = '0'; flash.style.left = '0';
        flash.style.width = '100%'; flash.style.height = '100%';
        flash.style.background = 'radial-gradient(circle, transparent 40%, rgba(239, 68, 68, 0.5) 100%)';
        flash.style.zIndex = '100';
        flash.style.pointerEvents = 'none';
        document.getElementById('game-container').appendChild(flash);
        setTimeout(() => flash.remove(), 200);
    }

    /* --- CANVAS RENDERING --- */

    function drawSlope() {
        ctxSlope.clearRect(0, 0, width, height);
        
        const horizon = height * horizonY;
        
        // 1. Ice Gradient
        const grad = ctxSlope.createLinearGradient(0, horizon, 0, height);
        grad.addColorStop(0, '#e2e8f0'); 
        grad.addColorStop(0.3, '#f1f5f9'); 
        grad.addColorStop(1, '#ffffff'); 
        ctxSlope.fillStyle = grad;
        ctxSlope.fillRect(0, horizon, width, height - horizon);
        
        // 2. Longitudinal Lines (Perspective)
        ctxSlope.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctxSlope.lineWidth = 2;
        ctxSlope.beginPath();
        const numLines = 50;
        for (let i = 0; i <= numLines; i++) {
            let x = (i / numLines) * width;
            ctxSlope.moveTo(vanishPointX * width, horizon);
            ctxSlope.lineTo(x, height);
        }
        ctxSlope.stroke();
        
        // 3. Transverse Lines (Speed Grid)
        ctxSlope.strokeStyle = 'rgba(200, 220, 255, 0.8)';
        ctxSlope.lineWidth = 2;
        
        const lineSpacing = 80;
        const offset = (Date.now() * speed * 0.0002) % lineSpacing;
        
        ctxSlope.beginPath();
        for (let i = 0; i < 15; i++) {
            let z = i * 0.06 + (offset/height); 
            if (z > 1) z -= 1;
            
            // Exponential Y for perspective
            let yPos = horizon + Math.pow(z, 2) * (height - horizon);
            
            ctxSlope.moveTo(0, yPos);
            // Curve slightly for "tube" or "slope" feel
            ctxSlope.quadraticCurveTo(width/2, yPos - (1-z)*10, width, yPos);
        }
        ctxSlope.stroke();
    }

    function spawnParticle() {
        // Spawn behind player
        particles.push({
            x: (playerX - 0.5) * width * 0.1 + width/2 + (Math.random() - 0.5) * 50,
            y: height * 0.85,
            vx: (Math.random() - 0.5) * 15,
            vy: (Math.random() * 8) + 8,
            life: 1.0,
            size: Math.random() * 5 + 3
        });
    }

    function updateParticles() {
        ctxFx.clearRect(0, 0, width, height);
        ctxFx.fillStyle = '#ffffff';
        
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.025;
            
            ctxFx.globalAlpha = p.life * 0.6;
            ctxFx.beginPath();
            ctxFx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctxFx.fill();
            
            if (p.life <= 0) particles.splice(i, 1);
        }
        ctxFx.globalAlpha = 1.0;

        // Speed Lines (Radial) - "Warp Speed" effect
        if (speed > 60) {
            ctxFx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctxFx.lineWidth = 1;
            const numLines = Math.floor(speed / 5);
            const radius = Math.max(width, height);
            const centerX = width / 2;
            const centerY = height * horizonY; 
            
            ctxFx.beginPath();
            for(let i=0; i<numLines; i++) {
                let angle = Math.random() * Math.PI * 2;
                let dist = radius * Math.random();
                let len = speed * 3;
                ctxFx.moveTo(centerX + Math.cos(angle)*dist, centerY + Math.sin(angle)*dist);
                ctxFx.lineTo(centerX + Math.cos(angle)*(dist-len), centerY + Math.sin(angle)*(dist-len));
            }
            ctxFx.stroke();
        }
    }

    /* --- MAIN LOOP --- */
    function loop() {
        drawSlope();
        updatePhysics();
        requestAnimationFrame(loop);
    }

    /* --- CONTROLS --- */
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');

    function handleStart(dir) { input[dir] = true; }
    function handleEnd(dir) { input[dir] = false; }

    ['mousedown', 'touchstart'].forEach(evt => {
        btnLeft.addEventListener(evt, (e) => { e.preventDefault(); handleStart('left'); });
        btnRight.addEventListener(evt, (e) => { e.preventDefault(); handleStart('right'); });
    });
    ['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach(evt => {
        btnLeft.addEventListener(evt, (e) => { e.preventDefault(); handleEnd('left'); });
        btnRight.addEventListener(evt, (e) => { e.preventDefault(); handleEnd('right'); });
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') handleStart('left');
        if (e.key === 'ArrowRight') handleStart('right');
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') handleEnd('left');
        if (e.key === 'ArrowRight') handleEnd('right');
    });

    // Start
    loop();

</script>
</body>
