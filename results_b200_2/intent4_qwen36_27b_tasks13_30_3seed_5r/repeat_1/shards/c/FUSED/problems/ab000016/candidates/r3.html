<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON RUNNER // REVISED</title>
    <style>
        :root {
            --bg-color: #050508;
            --grid-line: rgba(0, 243, 255, 0.15);
            --grid-accent: rgba(0, 243, 255, 0.8);
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --neon-yellow: #ffee00;
            --text-main: #ffffff;
            --font-stack: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- VISUAL SYSTEM: CRT & VIGNETTE --- */
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.8);
        }

        /* Main Game Container */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            height: 500px;
            background: #0a0a12;
            border: 1px solid #222;
            box-shadow: 0 0 0 1px #000, 0 0 60px rgba(0, 243, 255, 0.05);
            overflow: hidden;
            z-index: 10;
        }

        /* --- HUD: HIERARCHY --- */
        .hud {
            position: absolute;
            top: 25px;
            right: 35px;
            z-index: 20;
            text-align: right;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .score-display {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -2px;
            color: var(--text-main);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            display: flex;
            gap: 24px;
            align-items: baseline;
            line-height: 1;
            font-family: 'Impact', 'Arial Black', sans-serif; /* Stronger font for score */
        }

        .hi-score {
            color: var(--neon-cyan);
            font-size: 24px;
            opacity: 0.9;
            font-family: var(--font-stack); /* Monospace for tech feel */
            text-shadow: 0 0 8px var(--neon-cyan);
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 2px 8px;
            background: rgba(0, 243, 255, 0.05);
        }

        /* --- HUD: SPEEDOMETER --- */
        .speedometer {
            position: absolute;
            bottom: 30px;
            left: 35px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 200px;
        }

        .speed-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .speed-label {
            font-size: 12px;
            color: var(--neon-cyan);
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        .speed-val {
            font-size: 16px;
            color: #fff;
            font-family: 'Impact', sans-serif;
            letter-spacing: 1px;
        }

        .speed-bar-container {
            width: 100%;
            height: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1px;
            overflow: hidden;
            position: relative;
        }

        .speed-fill {
            height: 100%;
            width: 10%;
            background: var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan);
            transition: width 0.1s linear, background-color 0.2s;
        }

        /* --- OVERLAY: INSTRUCTIONS --- */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            /* Removed heavy blur to reveal game world */
            background: rgba(5, 5, 8, 0.2); 
            transition: opacity 0.3s;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .title-text {
            font-size: 14px;
            letter-spacing: 6px;
            color: var(--neon-cyan);
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 10px var(--neon-cyan);
            opacity: 0.8;
        }

        .blink-text {
            font-size: 20px;
            color: var(--text-main);
            animation: blink 1.5s infinite;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            letter-spacing: 2px;
            font-weight: 900;
        }

        .key-badge {
            display: inline-block;
            border: 2px solid var(--text-main);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 14px;
            margin: 0 8px;
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="crt-overlay"></div>

    <div class="game-container">
        
        <!-- HUD -->
        <div class="hud">
            <div class="score-display">
                <span id="score">00000</span>
                <span class="hi-score" id="highScore">HI 00000</span>
            </div>
        </div>

        <!-- Speedometer -->
        <div class="speedometer">
            <div class="speed-header">
                <span class="speed-label">VELOCITY</span>
                <span class="speed-val" id="speedVal">0 km/h</span>
            </div>
            <div class="speed-bar-container">
                <div class="speed-fill" id="speedBar"></div>
            </div>
        </div>

        <!-- Start / Game Over Screen -->
        <div class="overlay" id="startScreen">
            <div class="title-text">System Standby</div>
            <div class="blink-text">PRESS <span class="key-badge">SPACE</span> TO JUMP</div>
        </div>

        <div class="overlay hidden" id="gameOverScreen">
            <div class="title-text" style="color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); font-size: 24px;">CRITICAL FAILURE</div>
            <div class="blink-text" style="font-size: 16px; margin-top: 15px;">PRESS <span class="key-badge">SPACE</span> TO REBOOT</div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

<script>
    /**
     * REVISED DESIGN:
     * 1. Active game world visible immediately (no heavy blur).
     * 2. High-contrast neon palette on dark background.
     * 3. Layered parallax ground.
     * 4. Crisp, legible HUD.
     */

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const speedBar = document.getElementById('speedBar');
    const speedVal = document.getElementById('speedVal');

    // Game Constants
    let GAME_WIDTH = 1000;
    let GAME_HEIGHT = 500;
    const GRAVITY = 0.6;
    const JUMP_FORCE = -13;
    const GROUND_Y = 400; 
    
    // Game State
    let gameRunning = false;
    let gameOver = false;
    let frame = 0;
    let score = 0;
    let highScore = localStorage.getItem('neon_runner_hs') || 0;
    let speed = 6;
    let speedMultiplier = 0.003;
    let standbySpeed = 2; // Speed when paused/standby

    // Resize Handling
    function resize() {
        const container = canvas.parentElement;
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        GAME_WIDTH = canvas.width;
        GAME_HEIGHT = canvas.height;
    }
    window.addEventListener('resize', resize);
    resize();
    highScoreEl.innerText = "HI " + Math.floor(highScore).toString().padStart(5, '0');

    // --- CLASSES ---

    class Dino {
        constructor() {
            this.w = 48;
            this.h = 48;
            this.x = 80;
            this.y = GROUND_Y - this.h;
            this.dy = 0;
            this.grounded = true;
            this.runFrame = 0;
            this.color = '#ffffff';
            this.glow = 'rgba(255, 255, 255, 0.6)';
        }

        jump() {
            if (this.grounded) {
                this.dy = JUMP_FORCE;
                this.grounded = false;
                // Spawn dust
                for(let i=0; i<10; i++) particles.push(new Particle(this.x + this.w/2, this.y + this.h, '#00f3ff'));
            }
        }

        update() {
            this.dy += GRAVITY;
            this.y += this.dy;

            if (this.y + this.h > GROUND_Y) {
                this.y = GROUND_Y - this.h;
                this.dy = 0;
                this.grounded = true;
            } else {
                this.grounded = false;
            }

            // Animate legs based on speed
            const currentSpeed = gameRunning ? speed : standbySpeed;
            if (this.grounded) {
                this.runFrame += 0.2 * (currentSpeed / 6);
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            // Glow Effect
            ctx.shadowBlur = 15;
            ctx.shadowColor = this.glow;
            ctx.fillStyle = this.color;

            // Procedural Pixel Art Dino (More detailed)
            // Head
            ctx.fillRect(20, 0, 28, 18);
            // Snout
            ctx.fillRect(48, 8, 8, 10);
            // Eye (Negative space)
            ctx.fillStyle = '#050508'; // Matches bg
            ctx.fillRect(38, 4, 4, 4);
            ctx.fillStyle = this.color;
            
            // Neck/Body
            ctx.fillRect(12, 18, 24, 22);
            // Tail
            ctx.fillRect(0, 20, 12, 14);
            ctx.fillRect(-4, 18, 4, 8); // Tail tip
            // Arm
            ctx.fillRect(28, 26, 12, 4);

            // Legs (Animated)
            if (this.grounded) {
                const legOffset = Math.sin(this.runFrame) * 12;
                // Leg 1
                ctx.fillRect(14 + legOffset, 40, 8, 8);
                // Leg 2
                ctx.fillRect(26 - legOffset, 40, 8, 8);
            } else {
                // Jump Pose
                ctx.fillRect(14, 40, 8, 6);
                ctx.fillRect(28, 42, 8, 6);
            }

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type; // 'cactus' or 'bird'
            this.x = GAME_WIDTH + Math.random() * 100;
            this.markedForDeletion = false;

            if (type === 'cactus') {
                // Randomize cactus shape
                this.w = 24 + Math.random() * 20;
                this.h = 40 + Math.random() * 30;
                this.y = GROUND_Y - this.h;
                this.color = '#ff0055'; // Neon Pink
                this.glowColor = 'rgba(255, 0, 85, 0.7)';
            } else {
                // Bird
                this.w = 44;
                this.h = 34;
                // Heights
                const heights = [GROUND_Y - 45, GROUND_Y - 85];
                this.y = heights[Math.floor(Math.random() * heights.length)];
                this.color = '#ffee00'; // Neon Yellow
                this.glowColor = 'rgba(255, 238, 0, 0.7)';
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= speed;
            if (this.x + this.w < 0) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.15;
        }

        draw() {
            ctx.save();
            ctx.shadowBlur = 12;
            ctx.shadowColor = this.glowColor;
            ctx.fillStyle = this.color;
            
            if (this.type === 'cactus') {
                // Main Stem
                ctx.fillRect(this.x, this.y, this.w, this.h);
                // Detail: Inner highlight
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fillRect(this.x + 4, this.y + 4, 6, this.h - 4);
                ctx.fillStyle = this.color;
                
                // Arms (Top and Side)
                ctx.fillRect(this.x - 6, this.y + 15, 6, 6);
                ctx.fillRect(this.x - 6, this.y + 8, 6, 13);
                
                ctx.fillRect(this.x + this.w, this.y + 25, 6, 6);
                ctx.fillRect(this.x + this.w, this.y + 15, 6, 16);
            } else {
                // Bird
                ctx.translate(this.x, this.y);
                
                // Body
                ctx.fillRect(0, 12, 34, 10);
                // Head
                ctx.fillRect(30, 6, 14, 12);
                // Beak
                ctx.fillRect(44, 12, 8, 6);

                // Wings
                const wingY = Math.sin(this.wingFrame) * 14;
                ctx.beginPath();
                ctx.moveTo(12, 12);
                ctx.lineTo(22, 12 - wingY);
                ctx.lineTo(32, 12);
                ctx.fill();
            }

            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 4 + 2;
            this.speedX = (Math.random() - 0.5) * 5;
            this.speedY = (Math.random() - 0.5) * 5;
            this.color = color;
            this.life = 1.0;
        }
        update() {
            // Drift with world speed if game running, else slow drift
            const drift = gameRunning ? speed * 0.5 : 0.5;
            this.x -= drift;
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.03;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 0; 
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    class Layer {
        constructor(speedMod, yOffset, height, color, jaggedness = 1) {
            this.speedMod = speedMod;
            this.yOffset = yOffset;
            this.height = height;
            this.color = color;
            this.points = [];
            this.jaggedness = jaggedness;
            
            // Generate procedural terrain points
            let currentX = 0;
            while(currentX < GAME_WIDTH * 2) {
                const width = 60 + Math.random() * 120;
                // Height variation
                const h = Math.random() * this.height * this.jaggedness; 
                this.points.push({x: currentX, y: this.yOffset - h, w: width, h: h + 100});
                currentX += width - 15; // Overlap slightly
            }
        }

        update(currentSpeed) {
            // Move points
            this.points.forEach(p => {
                p.x -= currentSpeed * this.speedMod;
            });
            
            // Recycle points
            if (this.points[0].x + this.points[0].w < 0) {
                const first = this.points.shift();
                const last = this.points[this.points.length - 1];
                first.x = last.x + last.w - 15;
                first.h = Math.random() * this.height * this.jaggedness + 100;
                this.points.push(first);
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            this.points.forEach(p => {
                // Draw mountains/structures
                ctx.beginPath();
                ctx.moveTo(p.x, GROUND_Y);
                ctx.lineTo(p.x + p.w/2, p.y); // Peak
                ctx.lineTo(p.x + p.w, GROUND_Y);
                ctx.fill();
            });
        }
    }

    // --- INSTANCES ---

    const dino = new Dino();
    let obstacles = [];
    let particles = [];
    
    // Parallax Layers (Distinct layers for depth)
    // Far layer: slower, fainter, smoother
    const bgLayer1 = new Layer(0.1, GROUND_Y, 80, 'rgba(255,255,255,0.03)', 0.5);
    // Mid layer: medium speed, slightly more jagged
    const bgLayer2 = new Layer(0.3, GROUND_Y, 50, 'rgba(255,255,255,0.06)', 0.8);

    let obstacleTimer = 0;
    let obstacleInterval = 100;

    // --- LOGIC ---

    function spawnObstacle() {
        const type = Math.random() > 0.7 ? 'bird' : 'cactus';
        obstacles.push(new Obstacle(type));
    }

    function createExplosion(x, y, color) {
        for(let i=0; i<25; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    function resetGame() {
        dino.y = GROUND_Y - dino.h;
        dino.dy = 0;
        obstacles = [];
        particles = [];
        score = 0;
        speed = 6;
        gameOver = false;
        gameRunning = true;
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        obstacleTimer = 0;
        animate();
    }

    function checkCollision(r1, r2) {
        // Hitbox padding for fairness
        const padding = 10;
        return (
            r1.x + padding < r2.x + r2.w - padding &&
            r1.x + r1.w - padding > r2.x + padding &&
            r1.y + padding < r2.y + r2.h - padding &&
            r1.y + r1.h - padding > r2.y + padding
        );
    }

    function drawGround() {
        // Main Horizon Line
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(GAME_WIDTH, GROUND_Y);
        ctx.strokeStyle = '#00f3ff';
        ctx.lineWidth = 2;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00f3ff';
        ctx.stroke();
        ctx.shadowBlur = 0; // Reset

        // Grid floor effect (moving dashes)
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.15)';
        ctx.lineWidth = 1;
        
        // Calculate offset based on state
        const currentSpeed = gameRunning ? speed : standbySpeed;
        const offset = (frame * currentSpeed) % 50;
        
        for(let i = -1; i < GAME_WIDTH / 50 + 1; i++) {
            // Vertical perspective lines
            const x = (i * 50) - offset;
            ctx.beginPath();
            ctx.moveTo(x, GROUND_Y);
            ctx.lineTo(x - 50, GAME_HEIGHT); // Slant for perspective
            ctx.stroke();
        }
        
        // Horizontal moving lines for speed illusion
        const hOffset = (frame * currentSpeed * 2) % 100;
        for(let j = 0; j < 5; j++) {
            const y = GROUND_Y + (j * 40) + (hOffset % 40);
            if(y < GAME_HEIGHT) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(GAME_WIDTH, y);
                ctx.globalAlpha = 1 - (j * 0.2);
                ctx.stroke();
                ctx.globalAlpha = 1.0;
            }
        }
    }

    function animate() {
        if (!gameRunning) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        frame++;

        // Speed & Score
        speed += speedMultiplier;
        score += speed * 0.05;
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
        
        // Update HUD Speedometer
        const speedPercent = Math.min(((speed - 6) / 14) * 100, 100);
        speedBar.style.width = `${Math.max(5, speedPercent)}%`;
        const displaySpeed = Math.floor(speed * 12);
        speedVal.innerText = displaySpeed + " km/h";
        
        if(speedPercent > 80) {
            speedBar.style.backgroundColor = 'var(--neon-pink)';
            speedBar.style.boxShadow = '0 0 15px var(--neon-pink)';
        } else {
            speedBar.style.backgroundColor = 'var(--neon-cyan)';
            speedBar.style.boxShadow = '0 0 15px var(--neon-cyan)';
        }

        // Backgrounds
        bgLayer1.update(speed); bgLayer1.draw();
        bgLayer2.update(speed); bgLayer2.draw();
        
        // Ground
        drawGround();

        // Obstacles
        obstacleTimer++;
        if (obstacleTimer > obstacleInterval) {
            spawnObstacle();
            obstacleTimer = 0;
            // Decrease interval as speed increases
            obstacleInterval = Math.max(50, 90 - (speed * 2) + Math.random() * 60);
        }

        obstacles.forEach((obs, i) => {
            obs.update();
            obs.draw();
            
            // Collision
            if (checkCollision(dino, obs)) {
                gameOver = true;
                gameRunning = false;
                createExplosion(dino.x + dino.w/2, dino.y + dino.h/2, '#ff0055');
                
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('neon_runner_hs', highScore);
                    highScoreEl.innerText = "HI " + Math.floor(highScore).toString().padStart(5, '0');
                }
                gameOverScreen.classList.remove('hidden');
            }

            if (obs.markedForDeletion) obstacles.splice(i, 1);
        });

        // Particles
        particles.forEach((p, i) => {
            p.update();
            p.draw();
            if (p.life <= 0) particles.splice(i, 1);
        });

        // Dino
        dino.update();
        dino.draw();

        if (gameRunning) requestAnimationFrame(animate);
        else {
            // Draw particles one last time for explosion effect
            particles.forEach(p => { p.update(); p.draw(); });
        }
    }

    function standbyLoop() {
        if (gameRunning || gameOver) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        frame++;

        // Slowly move backgrounds and ground for "alive" feel
        bgLayer1.update(standbySpeed); bgLayer1.draw();
        bgLayer2.update(standbySpeed); bgLayer2.draw();
        drawGround();
        
        dino.update();
        dino.draw();
        
        requestAnimationFrame(standbyLoop);
    }

    // --- INPUT ---

    function handleInput(e) {
        if ((e.code === 'Space' || e.code === 'ArrowUp') && !e.repeat) {
            e.preventDefault();
            if (!gameRunning && !gameOver) {
                resetGame();
            } else if (gameOver) {
                resetGame();
            } else {
                dino.jump();
            }
        }
    }

    // Touch
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!gameRunning && !gameOver) resetGame();
        else if (gameOver) resetGame();
        else dino.jump();
    }, {passive: false});

    window.addEventListener('keydown', handleInput);

    // Start the standby loop immediately to show the world
    standbyLoop();

</script>
</body>
</html>
