<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON RUNNER // SYSTEM READY</title>
    <style>
        :root {
            --bg-color: #111116;
            --grid-color: rgba(255, 255, 255, 0.05);
            --primary: #ff4d4d; /* Alert Red */
            --accent: #ffbd2e;  /* Warning Amber */
            --text-main: #f0f0f0;
            --text-dim: #6c6c7a;
            --font-stack: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Retro CRT Scanlines & Vignette */
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }

        /* Main Game Container */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 450px;
            background: #1a1a24;
            border: 2px solid #333;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            overflow: hidden;
            z-index: 10;
        }

        /* HUD Layer */
        .hud {
            position: absolute;
            top: 20px;
            right: 30px;
            z-index: 20;
            text-align: right;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .score-display {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: -2px;
            color: var(--text-main);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            display: flex;
            gap: 20px;
            align-items: baseline;
        }

        .hi-score {
            color: var(--text-dim);
            font-size: 20px;
        }

        .labels {
            margin-top: 4px;
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Speedometer */
        .speedometer {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .speed-label {
            font-size: 10px;
            color: var(--accent);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .speed-bar-container {
            width: 150px;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .speed-fill {
            height: 100%;
            width: 20%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            transition: width 0.1s linear;
        }

        /* Overlay UI (Start/Game Over) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            background: rgba(17, 17, 22, 0.4);
            backdrop-filter: blur(2px);
            transition: opacity 0.3s;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .title-text {
            font-size: 14px;
            letter-spacing: 4px;
            color: var(--primary);
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .blink-text {
            font-size: 18px;
            color: var(--text-main);
            animation: blink 1s infinite;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .key-badge {
            display: inline-block;
            border: 1px solid var(--text-main);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            margin: 0 4px;
            background: rgba(255,255,255,0.1);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="crt-overlay"></div>

    <div class="game-container">
        
        <!-- HUD -->
        <div class="hud">
            <div class="score-display">
                <span id="score">00000</span>
                <span class="hi-score" id="highScore">HI: 00000</span>
            </div>
            <div class="labels">DISTANCE</div>
        </div>

        <!-- Speedometer -->
        <div class="speedometer">
            <div class="speed-label">VELOCITY</div>
            <div class="speed-bar-container">
                <div class="speed-fill" id="speedBar"></div>
            </div>
        </div>

        <!-- Start / Game Over Screen -->
        <div class="overlay" id="startScreen">
            <div class="title-text">System Standby</div>
            <div class="blink-text">PRESS <span class="key-badge">SPACE</span> TO JUMP</div>
        </div>

        <div class="overlay hidden" id="gameOverScreen">
            <div class="title-text" style="color: var(--primary); font-size: 24px;">CRITICAL FAILURE</div>
            <div class="blink-text" style="font-size: 14px; margin-top: 10px;">PRESS <span class="key-badge">SPACE</span> TO REBOOT</div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

<script>
    /**
     * DESIGN FOCUS:
     * 1. Parallax Background: 3 layers (Distant, Mid, Ground)
     * 2. Crisp Silhouettes: Pixel-art style drawing using rects
     * 3. Atmosphere: Dust particles, scanlines (CSS)
     */

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const speedBar = document.getElementById('speedBar');

    // Game Constants
    let GAME_WIDTH = 900;
    let GAME_HEIGHT = 450;
    const GRAVITY = 0.6;
    const JUMP_FORCE = -12;
    const GROUND_Y = 360; // Higher up to leave room for ground detail
    
    // Game State
    let gameRunning = false;
    let gameOver = false;
    let frame = 0;
    let score = 0;
    let highScore = localStorage.getItem('neon_runner_hs') || 0;
    let speed = 6;
    let speedMultiplier = 0.002;

    // Resize Handling
    function resize() {
        const container = canvas.parentElement;
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        GAME_WIDTH = canvas.width;
        GAME_HEIGHT = canvas.height;
    }
    window.addEventListener('resize', resize);
    resize();
    highScoreEl.innerText = "HI: " + Math.floor(highScore).toString().padStart(5, '0');

    // --- CLASSES ---

    class Dino {
        constructor() {
            this.w = 44;
            this.h = 44;
            this.x = 60;
            this.y = GROUND_Y - this.h;
            this.dy = 0;
            this.grounded = true;
            this.runFrame = 0;
            this.color = '#f0f0f0'; // High contrast white
        }

        jump() {
            if (this.grounded) {
                this.dy = JUMP_FORCE;
                this.grounded = false;
                // Spawn dust
                for(let i=0; i<5; i++) particles.push(new Particle(this.x + this.w/2, this.y + this.h, '#aaa'));
            }
        }

        update() {
            this.dy += GRAVITY;
            this.y += this.dy;

            if (this.y + this.h > GROUND_Y) {
                this.y = GROUND_Y - this.h;
                this.dy = 0;
                this.grounded = true;
            } else {
                this.grounded = false;
            }

            if (this.grounded) {
                this.runFrame += 0.2 * (speed / 6);
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.fillStyle = this.color;

            // Procedural Pixel Art Dino
            // Head
            ctx.fillRect(20, 0, 24, 16);
            // Eye (Negative space)
            ctx.fillStyle = '#1a1a24'; // Matches bg
            ctx.fillRect(34, 4, 4, 4);
            ctx.fillStyle = this.color;
            
            // Body
            ctx.fillRect(10, 16, 24, 20);
            // Tail
            ctx.fillRect(0, 18, 10, 12);
            // Arm
            ctx.fillRect(26, 22, 10, 4);

            // Legs (Animated)
            if (this.grounded) {
                const legOffset = Math.sin(this.runFrame) * 10;
                // Leg 1
                ctx.fillRect(12 + legOffset, 36, 6, 8);
                // Leg 2
                ctx.fillRect(24 - legOffset, 36, 6, 8);
            } else {
                // Jump Pose
                ctx.fillRect(14, 36, 6, 6);
                ctx.fillRect(26, 38, 6, 6);
            }

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type; // 'cactus' or 'bird'
            this.x = GAME_WIDTH + Math.random() * 100;
            this.markedForDeletion = false;

            if (type === 'cactus') {
                // Randomize cactus shape
                this.w = 20 + Math.random() * 15;
                this.h = 35 + Math.random() * 25;
                this.y = GROUND_Y - this.h;
                this.color = '#ff4d4d'; // Alert Red
            } else {
                // Bird
                this.w = 40;
                this.h = 30;
                // Heights
                const heights = [GROUND_Y - 40, GROUND_Y - 75];
                this.y = heights[Math.floor(Math.random() * heights.length)];
                this.color = '#ffbd2e'; // Amber
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= speed;
            if (this.x + this.w < 0) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.15;
        }

        draw() {
            ctx.fillStyle = this.color;
            
            if (this.type === 'cactus') {
                // Main Stem
                ctx.fillRect(this.x, this.y, this.w, this.h);
                // Detail: Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(this.x + this.w - 4, this.y, 4, this.h);
                ctx.fillStyle = this.color;
                // Arms
                ctx.fillRect(this.x - 4, this.y + 10, 4, 4);
                ctx.fillRect(this.x + this.w, this.y + 15, 4, 4);
            } else {
                // Bird
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Body
                ctx.fillRect(0, 10, 30, 8);
                // Head
                ctx.fillRect(28, 4, 10, 10);
                // Beak
                ctx.fillRect(38, 8, 6, 4);

                // Wings
                const wingY = Math.sin(this.wingFrame) * 12;
                ctx.beginPath();
                ctx.moveTo(10, 10);
                ctx.lineTo(20, 10 - wingY);
                ctx.lineTo(30, 10);
                ctx.fill();

                ctx.restore();
            }
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 3 + 1;
            this.speedX = (Math.random() - 0.5) * 2;
            this.speedY = (Math.random() - 0.5) * 2;
            this.color = color;
            this.life = 1.0;
        }
        update() {
            this.x -= speed * 0.5; // Drift with world
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.03;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    class Layer {
        constructor(speedMod, yOffset, height, color) {
            this.speedMod = speedMod;
            this.yOffset = yOffset;
            this.height = height;
            this.color = color;
            this.points = [];
            
            // Generate procedural terrain points
            let currentX = 0;
            while(currentX < GAME_WIDTH * 2) {
                const width = 50 + Math.random() * 100;
                // Height variation
                const h = Math.random() * this.height; 
                this.points.push({x: currentX, y: this.yOffset - h, w: width, h: h + 100});
                currentX += width - 10;
            }
        }

        update() {
            // Move points
            this.points.forEach(p => {
                p.x -= speed * this.speedMod;
            });
            
            // Recycle points
            if (this.points[0].x + this.points[0].w < 0) {
                const first = this.points.shift();
                const last = this.points[this.points.length - 1];
                first.x = last.x + last.w - 10;
                first.h = Math.random() * this.height + 100;
                this.points.push(first);
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            this.points.forEach(p => {
                // Draw mountains/structures
                ctx.beginPath();
                ctx.moveTo(p.x, GROUND_Y);
                ctx.lineTo(p.x + p.w/2, p.y); // Peak
                ctx.lineTo(p.x + p.w, GROUND_Y);
                ctx.fill();
            });
        }
    }

    // --- INSTANCES ---

    const dino = new Dino();
    let obstacles = [];
    let particles = [];
    
    // Parallax Layers
    const bgLayer1 = new Layer(0.1, GROUND_Y, 80, 'rgba(255,255,255,0.03)');
    const bgLayer2 = new Layer(0.3, GROUND_Y, 50, 'rgba(255,255,255,0.06)');

    let obstacleTimer = 0;
    let obstacleInterval = 100;

    // --- LOGIC ---

    function spawnObstacle() {
        const type = Math.random() > 0.75 ? 'bird' : 'cactus';
        obstacles.push(new Obstacle(type));
    }

    function createExplosion(x, y, color) {
        for(let i=0; i<20; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    function resetGame() {
        dino.y = GROUND_Y - dino.h;
        dino.dy = 0;
        obstacles = [];
        particles = [];
        score = 0;
        speed = 6;
        gameOver = false;
        gameRunning = true;
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        obstacleTimer = 0;
        animate();
    }

    function checkCollision(r1, r2) {
        // Hitbox padding for fairness
        const padding = 8;
        return (
            r1.x + padding < r2.x + r2.w - padding &&
            r1.x + r1.w - padding > r2.x + padding &&
            r1.y + padding < r2.y + r2.h - padding &&
            r1.y + r1.h - padding > r2.y + padding
        );
    }

    function drawGround() {
        // Main Line
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(GAME_WIDTH, GROUND_Y);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Grid floor effect (moving dashes)
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 1;
        const offset = (frame * speed) % 50;
        
        for(let i = -1; i < GAME_WIDTH / 50 + 1; i++) {
            // Vertical perspective lines
            const x = (i * 50) - offset;
            ctx.beginPath();
            ctx.moveTo(x, GROUND_Y);
            ctx.lineTo(x - 40, GAME_HEIGHT); // Slant for perspective
            ctx.stroke();
        }
    }

    function animate() {
        if (!gameRunning) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        frame++;

        // Speed & Score
        speed += speedMultiplier;
        score += speed * 0.05;
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
        
        const speedPercent = Math.min(((speed - 6) / 12) * 100, 100);
        speedBar.style.width = `${Math.max(5, speedPercent)}%`;
        if(speedPercent > 80) speedBar.style.backgroundColor = 'var(--primary)';
        else speedBar.style.backgroundColor = 'var(--accent)';

        // Backgrounds
        bgLayer1.update(); bgLayer1.draw();
        bgLayer2.update(); bgLayer2.draw();
        
        // Ground
        drawGround();

        // Obstacles
        obstacleTimer++;
        if (obstacleTimer > obstacleInterval) {
            spawnObstacle();
            obstacleTimer = 0;
            obstacleInterval = Math.max(40, 80 - (speed * 2) + Math.random() * 60);
        }

        obstacles.forEach((obs, i) => {
            obs.update();
            obs.draw();
            
            // Collision
            if (checkCollision(dino, obs)) {
                gameOver = true;
                gameRunning = false;
                createExplosion(dino.x + dino.w/2, dino.y + dino.h/2, '#fff');
                
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('neon_runner_hs', highScore);
                    highScoreEl.innerText = "HI: " + Math.floor(highScore).toString().padStart(5, '0');
                }
                gameOverScreen.classList.remove('hidden');
            }

            if (obs.markedForDeletion) obstacles.splice(i, 1);
        });

        // Particles
        particles.forEach((p, i) => {
            p.update();
            p.draw();
            if (p.life <= 0) particles.splice(i, 1);
        });

        // Dino
        dino.update();
        dino.draw();

        if (gameRunning) requestAnimationFrame(animate);
        else {
            // Draw particles one last time for explosion effect
            particles.forEach(p => { p.update(); p.draw(); });
        }
    }

    // --- INPUT ---

    function handleInput(e) {
        if ((e.code === 'Space' || e.code === 'ArrowUp') && !e.repeat) {
            e.preventDefault();
            if (!gameRunning && !gameOver) {
                resetGame();
            } else if (gameOver) {
                resetGame();
            } else {
                dino.jump();
            }
        }
    }

    // Touch
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!gameRunning && !gameOver) resetGame();
        else if (gameOver) resetGame();
        else dino.jump();
    }, {passive: false});

    window.addEventListener('keydown', handleInput);

    // Initial Render (Static)
    bgLayer1.draw();
    bgLayer2.draw();
    drawGround();
    dino.draw();

</script>
</body>
</html>
