<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESERT RUNNER // REVISED</title>
    <style>
        :root {
            /* Identity: Modern-Retro Palette */
            --bg-color: #F4F1EA; /* Cream/Off-White */
            --ink-color: #2D2D2D; /* Charcoal/Dark Grey */
            --accent-color: #FF5500; /* Vibrant Orange */
            --hud-bg: #FFFFFF;
            
            --font-stack: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none; /* Crisp pixels */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-stack);
            color: var(--ink-color);
        }

        /* --- LAYOUT & CONTAINER --- */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            height: 500px;
            background-color: var(--bg-color);
            /* Subtle border for definition */
            border-bottom: 4px solid var(--ink-color);
            overflow: hidden;
            z-index: 10;
        }

        /* --- HUD: INTEGRATION & TYPOGRAPHY --- */
        .hud {
            position: absolute;
            top: 24px;
            right: 32px;
            z-index: 20;
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            pointer-events: none;
        }

        .score-display {
            font-size: 32px;
            font-weight: 900;
            color: var(--ink-color);
            letter-spacing: -1px;
            font-family: var(--font-stack); /* Monospace consistency */
            display: flex;
            gap: 20px;
            align-items: baseline;
        }

        .hi-score {
            color: #888;
            font-size: 20px;
            opacity: 0.8;
        }

        .system-tag {
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--ink-color);
            background: var(--bg-color);
            border: 2px solid var(--ink-color);
            padding: 4px 8px;
            margin-left: 10px;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .system-tag.active {
            background: var(--ink-color);
            color: var(--bg-color);
        }

        .system-tag.danger {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: var(--bg-color);
        }

        /* --- HUD: VELOCITY BAR --- */
        .velocity-container {
            position: absolute;
            bottom: 32px;
            left: 32px;
            z-index: 20;
            width: 180px;
            pointer-events: none;
        }

        .velocity-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 6px;
            color: var(--ink-color);
        }

        .velocity-bar-bg {
            width: 100%;
            height: 8px;
            background: #E0DDD5;
            border: 2px solid var(--ink-color);
            border-radius: 4px;
            position: relative;
        }

        .velocity-fill {
            height: 100%;
            width: 10%; /* Initial state */
            background-color: var(--ink-color);
            border-radius: 2px;
            transition: width 0.1s linear, background-color 0.3s;
        }

        .velocity-fill.high {
            background-color: var(--accent-color);
        }

        /* --- OVERLAY: INSTRUCTIONS --- */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            /* Semi-transparent mask */
            background: rgba(244, 241, 234, 0.4); 
            backdrop-filter: blur(1px);
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .instruction-box {
            text-align: center;
            animation: float 3s ease-in-out infinite;
        }

        .blink-text {
            font-size: 24px;
            color: var(--ink-color);
            animation: blink 1.2s infinite;
            letter-spacing: 1px;
            font-weight: 900;
            text-transform: uppercase;
            background: var(--bg-color);
            padding: 8px 16px;
            border: 2px solid var(--ink-color);
            box-shadow: 4px 4px 0px var(--ink-color);
        }

        .key-badge {
            display: inline-block;
            background: var(--ink-color);
            color: var(--bg-color);
            padding: 2px 8px;
            border-radius: 2px;
            font-size: 14px;
            margin: 0 6px;
            vertical-align: middle;
        }

        .game-over-title {
            font-size: 48px;
            color: var(--accent-color);
            text-shadow: 2px 2px 0 var(--ink-color);
            margin-bottom: 16px;
            font-weight: 900;
            letter-spacing: -2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <!-- HUD -->
        <div class="hud">
            <div class="system-tag" id="statusTag">READY</div>
            <div class="score-display">
                <span id="score">00000</span>
                <span class="hi-score" id="highScore">HI 00000</span>
            </div>
        </div>

        <!-- Velocity Indicator -->
        <div class="velocity-container">
            <div class="velocity-header">
                <span>VELOCITY</span>
                <span id="speedVal">0 km/h</span>
            </div>
            <div class="velocity-bar-bg">
                <div class="velocity-fill" id="speedBar"></div>
            </div>
        </div>

        <!-- Start / Game Over Screen -->
        <div class="overlay" id="startScreen">
            <div class="instruction-box">
                <div class="blink-text">PRESS <span class="key-badge">SPACE</span> TO JUMP</div>
            </div>
        </div>

        <div class="overlay hidden" id="gameOverScreen">
            <div class="instruction-box">
                <div class="game-over-title">CRASHED</div>
                <div class="blink-text" style="font-size: 16px;">PRESS <span class="key-badge">SPACE</span> TO RETRY</div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

<script>
    /**
     * REVISION NOTES:
     * 1. Visual Identity: Switched to Cream/Charcoal/Orange palette.
     * 2. Content: Added layered ground, cactus, bird, and distinct Dino silhouette.
     * 3. UI: Monospace fonts, clear velocity bar, pulsing instruction overlay.
     */

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const speedBar = document.getElementById('speedBar');
    const speedVal = document.getElementById('speedVal');
    const statusTag = document.getElementById('statusTag');

    // Game Constants
    let GAME_WIDTH = 1000;
    let GAME_HEIGHT = 500;
    const GRAVITY = 0.6;
    const JUMP_FORCE = -13;
    const GROUND_Y = 400; 
    
    // Game State
    let gameRunning = false;
    let gameOver = false;
    let frame = 0;
    let score = 0;
    let highScore = localStorage.getItem('desert_runner_hs') || 0;
    let speed = 6;
    let speedMultiplier = 0.005;
    let standbySpeed = 3; // Idle scrolling speed

    // Colors
    const COLORS = {
        bg: '#F4F1EA',
        ink: '#2D2D2D',
        accent: '#FF5500',
        shadow: 'rgba(0,0,0,0.15)',
        groundLight: '#EBE6DE',
        groundDark: '#D6D0C6'
    };

    // Resize Handling
    function resize() {
        const container = canvas.parentElement;
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        GAME_WIDTH = canvas.width;
        GAME_HEIGHT = canvas.height;
    }
    window.addEventListener('resize', resize);
    resize();
    highScoreEl.innerText = "HI " + Math.floor(highScore).toString().padStart(5, '0');

    // --- DRAWING HELPERS ---

    function drawSun(x, y, r) {
        ctx.save();
        ctx.fillStyle = COLORS.accent;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        
        // Subtle retro rings
        ctx.strokeStyle = COLORS.accent;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, r + 10, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }

    function drawCloud(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.fillStyle = 'rgba(45, 45, 45, 0.08)'; // Very faint dark cloud
        ctx.beginPath();
        ctx.arc(0, 0, 30, 0, Math.PI * 2);
        ctx.arc(40, -10, 40, 0, Math.PI * 2);
        ctx.arc(80, 5, 25, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // --- CLASSES ---

    class Dino {
        constructor() {
            this.w = 44;
            this.h = 44;
            this.x = 80;
            this.y = GROUND_Y - this.h;
            this.dy = 0;
            this.grounded = true;
            this.runFrame = 0;
            this.color = COLORS.ink;
        }

        jump() {
            if (this.grounded) {
                this.dy = JUMP_FORCE;
                this.grounded = false;
                // Spawn dust
                for(let i=0; i<5; i++) particles.push(new Particle(this.x + 10, this.y + this.h));
            }
        }

        update() {
            this.dy += GRAVITY;
            this.y += this.dy;

            if (this.y + this.h > GROUND_Y) {
                this.y = GROUND_Y - this.h;
                this.dy = 0;
                this.grounded = true;
            } else {
                this.grounded = false;
            }

            const currentSpeed = gameRunning ? speed : standbySpeed;
            if (this.grounded) {
                this.runFrame += 0.25 * (currentSpeed / 6);
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.fillStyle = this.color;
            
            // Shadow under Dino
            ctx.fillStyle = COLORS.shadow;
            ctx.beginPath();
            ctx.ellipse(22, 44, 20 - (44-this.y)/4, 4, 0, 0, Math.PI*2);
            ctx.fill();

            ctx.fillStyle = this.color;

            // Procedural Dino Silhouette (Crisp Geometry)
            // Head & Neck
            ctx.beginPath();
            ctx.moveTo(20, 0);
            ctx.lineTo(44, 0); // Top Head
            ctx.lineTo(44, 12); // Snout Top
            ctx.lineTo(48, 12); // Snout Tip
            ctx.lineTo(48, 18); // Snout Bottom
            ctx.lineTo(40, 18); // Jaw
            ctx.lineTo(40, 24); // Neck Front
            ctx.lineTo(30, 24); // Neck Back
            ctx.lineTo(30, 0);
            ctx.fill();

            // Body
            ctx.beginPath();
            ctx.moveTo(30, 24);
            ctx.lineTo(14, 24); // Chest
            ctx.lineTo(10, 36); // Belly
            ctx.lineTo(30, 36); // Tail Start
            ctx.lineTo(30, 24);
            ctx.fill();

            // Tail
            ctx.beginPath();
            ctx.moveTo(10, 28);
            ctx.lineTo(0, 26); // Tip
            ctx.lineTo(0, 32);
            ctx.lineTo(10, 36);
            ctx.fill();

            // Arm
            ctx.fillRect(24, 28, 8, 4);

            // Legs
            if (this.grounded) {
                const legOffset = Math.sin(this.runFrame) * 10;
                // Leg 1
                ctx.fillRect(16 + legOffset, 36, 6, 8);
                // Leg 2
                ctx.fillRect(24 - legOffset, 36, 6, 8);
            } else {
                // Jump Pose
                ctx.fillRect(16, 36, 6, 6);
                ctx.fillRect(24, 36, 6, 6);
            }

            // Eye (White dot)
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(36, 4, 4, 4);

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type; // 'cactus' or 'bird'
            this.x = GAME_WIDTH + Math.random() * 100;
            this.markedForDeletion = false;

            if (type === 'cactus') {
                this.w = 20 + Math.random() * 15;
                this.h = 35 + Math.random() * 25;
                this.y = GROUND_Y - this.h;
                this.color = COLORS.ink;
            } else {
                this.w = 40;
                this.h = 30;
                const heights = [GROUND_Y - 45, GROUND_Y - 85];
                this.y = heights[Math.floor(Math.random() * heights.length)];
                this.color = COLORS.ink;
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= speed;
            if (this.x + this.w < 0) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.15;
        }

        draw() {
            ctx.save();
            ctx.fillStyle = this.color;
            
            if (this.type === 'cactus') {
                // Main Stem
                ctx.fillRect(this.x, this.y, this.w, this.h);
                
                // Arms (Simpler, cleaner geometry)
                if (this.h > 40) {
                    ctx.fillRect(this.x - 6, this.y + 10, 6, 4);
                    ctx.fillRect(this.x - 6, this.y + 4, 6, 10);
                }
                if (this.w > 25) {
                    ctx.fillRect(this.x + this.w, this.y + 20, 6, 4);
                    ctx.fillRect(this.x + this.w, this.y + 12, 6, 12);
                }
            } else {
                // Bird
                ctx.translate(this.x, this.y);
                
                // Body
                ctx.beginPath();
                ctx.ellipse(20, 15, 18, 6, 0, 0, Math.PI*2);
                ctx.fill();
                
                // Head
                ctx.beginPath();
                ctx.arc(36, 12, 6, 0, Math.PI*2);
                ctx.fill();

                // Beak
                ctx.beginPath();
                ctx.moveTo(40, 12);
                ctx.lineTo(48, 14);
                ctx.lineTo(40, 16);
                ctx.fill();

                // Wings
                const wingY = Math.sin(this.wingFrame) * 12;
                ctx.beginPath();
                ctx.moveTo(15, 15);
                ctx.quadraticCurveTo(25, 15 - wingY - 5, 35, 15); 
                ctx.fill();
            }

            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 3 + 1;
            this.speedX = (Math.random() - 0.5) * 4;
            this.speedY = (Math.random() - 0.5) * 2 - 1; 
            this.life = 1.0;
        }
        update() {
            const drift = gameRunning ? speed * 0.5 : 0.5;
            this.x -= drift;
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.05;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = COLORS.ink; // Dust matches ink
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    class Layer {
        constructor(speedMod, color, jaggedness = 1, yOffset = 0) {
            this.speedMod = speedMod;
            this.color = color;
            this.points = [];
            this.jaggedness = jaggedness;
            this.yOffset = yOffset;
            
            // Generate terrain
            let currentX = 0;
            while(currentX < GAME_WIDTH * 2) {
                const width = 80 + Math.random() * 150;
                const h = (Math.random() * 60 * this.jaggedness) + yOffset; 
                this.points.push({x: currentX, h: h});
                currentX += width - 20; 
            }
        }

        update(currentSpeed) {
            this.points.forEach(p => {
                p.x -= currentSpeed * this.speedMod;
            });
            
            if (this.points[0].x + 150 < 0) { 
                const first = this.points.shift();
                const last = this.points[this.points.length - 1];
                first.x = last.x + 150; 
                first.h = (Math.random() * 60 * this.jaggedness) + this.yOffset;
                this.points.push(first);
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            
            this.points.forEach(p => {
                ctx.lineTo(p.x, GROUND_Y - p.h);
                ctx.lineTo(p.x + 100, GROUND_Y - p.h); 
            });
            
            ctx.lineTo(GAME_WIDTH + 200, GROUND_Y);
            ctx.fill();
        }
    }

    // --- INSTANCES ---

    const dino = new Dino();
    let obstacles = [];
    let particles = [];
    
    // Parallax Layers (Lighter colors for modern look)
    const bgLayer1 = new Layer(0.1, COLORS.groundLight, 1.5, 20);
    const bgLayer2 = new Layer(0.3, COLORS.groundDark, 0.8, 10);
    
    // Clouds
    let clouds = [];
    for(let i=0; i<5; i++) {
        clouds.push({
            x: Math.random() * GAME_WIDTH,
            y: 50 + Math.random() * 100,
            scale: 0.5 + Math.random() * 0.5,
            speed: 0.2 + Math.random() * 0.3
        });
    }

    let obstacleTimer = 0;
    let obstacleInterval = 90;

    // --- LOGIC ---

    function spawnObstacle() {
        const canSpawnBird = speed > 8;
        const type = (canSpawnBird && Math.random() > 0.7) ? 'bird' : 'cactus';
        obstacles.push(new Obstacle(type));
    }

    function createExplosion(x, y) {
        for(let i=0; i<20; i++) {
            particles.push(new Particle(x, y));
        }
    }

    function resetGame() {
        dino.y = GROUND_Y - dino.h;
        dino.dy = 0;
        obstacles = [];
        particles = [];
        score = 0;
        speed = 6;
        gameOver = false;
        gameRunning = true;
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        
        statusTag.innerText = "RUNNING";
        statusTag.classList.add('active');
        statusTag.classList.remove('danger');
        
        obstacleTimer = 0;
        animate();
    }

    function checkCollision(r1, r2) {
        const pad = 8;
        return (
            r1.x + pad < r2.x + r2.w - pad &&
            r1.x + r1.w - pad > r2.x + pad &&
            r1.y + pad < r2.y + r2.h - pad &&
            r1.y + r1.h - pad > r2.y + pad
        );
    }

    function drawGround() {
        // Foreground Ground (Cream/Solid)
        ctx.fillStyle = COLORS.bg; // Match BG
        ctx.fillRect(0, GROUND_Y, GAME_WIDTH, GAME_HEIGHT - GROUND_Y);

        // Ground Line
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(GAME_WIDTH, GROUND_Y);
        ctx.strokeStyle = COLORS.ink;
        ctx.lineWidth = 2;
        ctx.stroke();

        // Moving ground details (stripes)
        const currentSpeed = gameRunning ? speed : standbySpeed;
        const offset = (frame * currentSpeed) % 40;
        
        ctx.fillStyle = COLORS.groundDark;
        for(let i = -1; i < GAME_WIDTH / 20 + 1; i++) {
            const x = (i * 40) - offset;
            if ((i + Math.floor(frame/10)) % 3 !== 0) {
                ctx.fillRect(x, GROUND_Y + 10, 20, 4);
            }
        }
    }

    function animate() {
        if (!gameRunning) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        frame++;

        // Speed & Score
        speed += speedMultiplier;
        score += speed * 0.05;
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');
        
        // HUD Speedometer
        const speedPercent = Math.min(((speed - 6) / 12) * 100, 100);
        speedBar.style.width = `${Math.max(5, speedPercent)}%`;
        if(speedPercent > 80) speedBar.classList.add('high');
        else speedBar.classList.remove('high');
        
        const displaySpeed = Math.floor(speed * 10);
        speedVal.innerText = displaySpeed + " km/h";

        // --- DRAW WORLD ---

        // 1. Sun
        drawSun(GAME_WIDTH - 100, 120, 50);

        // 2. Clouds
        clouds.forEach(c => {
            c.x -= c.speed * (gameRunning ? 0.5 : 0.1);
            if (c.x < -100) c.x = GAME_WIDTH + 100;
            drawCloud(c.x, c.y, c.scale);
        });

        // 3. Parallax Backgrounds
        bgLayer1.update(speed); bgLayer1.draw();
        bgLayer2.update(speed); bgLayer2.draw();
        
        // 4. Ground
        drawGround();

        // 5. Obstacles
        obstacleTimer++;
        if (obstacleTimer > obstacleInterval) {
            spawnObstacle();
            obstacleTimer = 0;
            obstacleInterval = Math.max(40, 80 - (speed * 1.5) + Math.random() * 50);
        }

        obstacles.forEach((obs, i) => {
            obs.update();
            obs.draw();
            
            if (checkCollision(dino, obs)) {
                gameOver = true;
                gameRunning = false;
                createExplosion(dino.x + dino.w/2, dino.y + dino.h/2);
                
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('desert_runner_hs', highScore);
                    highScoreEl.innerText = "HI " + Math.floor(highScore).toString().padStart(5, '0');
                }
                gameOverScreen.classList.remove('hidden');
                statusTag.innerText = "CRITICAL";
                statusTag.classList.add('danger');
                statusTag.classList.remove('active');
            }

            if (obs.markedForDeletion) obstacles.splice(i, 1);
        });

        // 6. Particles
        particles.forEach((p, i) => {
            p.update();
            p.draw();
            if (p.life <= 0) particles.splice(i, 1);
        });

        // 7. Dino
        dino.update();
        dino.draw();

        if (gameRunning) requestAnimationFrame(animate);
        else {
            particles.forEach(p => { p.update(); p.draw(); });
        }
    }

    function standbyLoop() {
        if (gameRunning || gameOver) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        frame++;

        drawSun(GAME_WIDTH - 100, 120, 50);
        clouds.forEach(c => { c.x -= 0.1; if(c.x < -100) c.x = GAME_WIDTH; drawCloud(c.x, c.y, c.scale); });
        bgLayer1.update(standbySpeed); bgLayer1.draw();
        bgLayer2.update(standbySpeed); bgLayer2.draw();
        drawGround();
        
        dino.update();
        dino.draw();
        
        requestAnimationFrame(standbyLoop);
    }

    // --- INPUT ---

    function handleInput(e) {
        if ((e.code === 'Space' || e.code === 'ArrowUp') && !e.repeat) {
            e.preventDefault();
            if (!gameRunning && !gameOver) {
                resetGame();
            } else if (gameOver) {
                resetGame();
            } else {
                dino.jump();
            }
        }
    }

    // Touch
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!gameRunning && !gameOver) resetGame();
        else if (gameOver) resetGame();
        else dino.jump();
    }, {passive: false});

    window.addEventListener('keydown', handleInput);

    // Start the standby loop immediately
    standbyLoop();

</script>
</body>
</html>
