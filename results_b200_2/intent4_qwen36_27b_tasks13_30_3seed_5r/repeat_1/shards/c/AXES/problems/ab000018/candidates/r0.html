<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pixel Hopper - Gameplay Screen</title>
<style>
    :root {
        --sky-top: #4EC5F1;
        --sky-bottom: #A0E8F7;
        --grass: #78C640;
        --grass-dark: #5DA82D;
        --road: #505866;
        --road-line: #FFFFFF;
        --water: #42A5F5;
        --water-dark: #2980B9;
        --wood: #C17E4D;
        --wood-dark: #8D5E34;
        --ui-bg: rgba(0,0,0,0.3);
        --text-color: #FFFFFF;
        --shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 40%, var(--grass) 40%);
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* 3D SCENE CONTAINER */
    #scene {
        width: 100%;
        height: 100%;
        max-width: 600px;
        max-height: 900px;
        perspective: 600px;
        position: relative;
        overflow: hidden;
    }

    /* HUD */
    .hud {
        position: absolute;
        top: 20px;
        left: 20px;
        right: 20px;
        display: flex;
        justify-content: space-between;
        z-index: 100;
        pointer-events: none;
    }

    .score-box {
        background: rgba(255, 255, 255, 0.9);
        padding: 8px 16px;
        border-radius: 12px;
        box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        text-align: center;
        min-width: 80px;
        transform: translateZ(20px);
    }

    .score-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #888;
        font-weight: 700;
    }

    .score-val {
        font-size: 24px;
        font-weight: 800;
        color: #333;
        font-family: 'Courier New', Courier, monospace; /* Monospace for numbers */
    }

    /* GAME BOARD */
    #board {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        transform-style: preserve-3d;
        transform: rotateX(25deg) translateY(-50px); /* The tilt */
        transition: transform 0.1s ease-out;
    }

    /* LANES */
    .lane {
        width: 100%;
        height: 80px; /* Base height, perspective scales it */
        position: absolute;
        left: 0;
        transform-style: preserve-3d;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .lane.grass { background: var(--grass); border-bottom: 4px solid var(--grass-dark); }
    .lane.road { background: var(--road); border-bottom: 4px solid #333; }
    .lane.water { background: var(--water); border-bottom: 4px solid var(--water-dark); }

    /* Lane Details */
    .lane.road::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        height: 4px;
        background: repeating-linear-gradient(90deg, var(--road-line) 0, var(--road-line) 40px, transparent 40px, transparent 80px);
        transform: translateY(-50%);
        opacity: 0.5;
    }

    .lane.water::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: repeating-linear-gradient(90deg, transparent 0, transparent 50px, rgba(255,255,255,0.2) 50px, rgba(255,255,255,0.2) 52px);
        animation: waterFlow 2s linear infinite;
    }

    @keyframes waterFlow {
        from { transform: translateX(0); }
        to { transform: translateX(52px); }
    }

    /* OBJECTS (Cars, Logs) */
    .moving-object {
        position: absolute;
        height: 60px;
        top: 10px;
        transform-style: preserve-3d;
        transition: transform 0.1s linear;
    }

    /* Car CSS Art */
    .car {
        width: 90px;
        background: #FF5252;
        border-radius: 10px;
        box-shadow: 0 5px 0 #B71C1C;
        position: relative;
    }
    .car::before { /* Roof */
        content: '';
        position: absolute;
        top: -20px;
        left: 15px;
        width: 60px;
        height: 20px;
        background: #FF8A80;
        border-radius: 6px 6px 0 0;
    }
    .car::after { /* Wheels */
        content: '';
        position: absolute;
        bottom: -4px;
        left: 10px;
        width: 15px;
        height: 10px;
        background: #222;
        box-shadow: 65px 0 0 #222;
    }
    
    .car.truck {
        width: 140px;
        height: 70px;
        background: #FFC107;
        box-shadow: 0 5px 0 #F57F17;
    }
    .car.truck::before {
        width: 80px;
        height: 25px;
        top: -25px;
        left: 50px;
        background: #FFD54F;
    }
    .car.truck::after {
        width: 20px;
        box-shadow: 105px 0 0 #222;
    }

    /* Log CSS Art */
    .log {
        width: 120px;
        background: var(--wood);
        border-radius: 4px;
        box-shadow: 0 4px 0 var(--wood-dark);
        position: relative;
        display: flex;
        justify-content: space-around;
        align-items: center;
    }
    .log::before, .log::after {
        content: '';
        width: 100%;
        height: 100%;
        border-radius: 4px;
        border-top: 4px solid rgba(0,0,0,0.1);
    }

    /* PLAYER (The Chicken) */
    #player {
        position: absolute;
        width: 50px;
        height: 50px;
        bottom: 40px; /* Starting relative to screen bottom */
        left: 50%;
        transform: translateX(-50%);
        z-index: 50;
        transition: top 0.15s ease-out, left 0.15s ease-out, transform 0.2s;
    }

    /* Player CSS Art */
    .chicken {
        width: 100%;
        height: 100%;
        position: relative;
        animation: bounce 0.4s infinite alternate;
    }

    .body {
        width: 40px;
        height: 40px;
        background: #FFF;
        border-radius: 50%;
        position: absolute;
        bottom: 0;
        left: 5px;
        box-shadow: 0 4px 0 #E0E0E0;
        border: 2px solid #E0E0E0;
    }

    .comb {
        width: 12px;
        height: 8px;
        background: #FF5252;
        position: absolute;
        top: -6px;
        left: 14px;
        border-radius: 4px 4px 0 0;
    }

    .eye {
        width: 6px;
        height: 6px;
        background: #333;
        border-radius: 50%;
        position: absolute;
        top: 12px;
        right: 10px;
    }
    
    .beak {
        width: 10px;
        height: 6px;
        background: #FFC107;
        position: absolute;
        top: 16px;
        right: 2px;
        clip-path: polygon(0 0, 100% 50%, 0 100%);
    }

    .shadow {
        width: 30px;
        height: 10px;
        background: rgba(0,0,0,0.2);
        border-radius: 50%;
        position: absolute;
        bottom: -4px;
        left: 10px;
        z-index: -1;
    }

    @keyframes bounce {
        0% { transform: translateY(0); }
        100% { transform: translateY(-5px); }
    }

    /* CONTROLS */
    .controls {
        position: absolute;
        bottom: 30px;
        right: 30px;
        width: 140px;
        height: 140px;
        z-index: 200;
    }

    .d-btn {
        position: absolute;
        width: 45px;
        height: 45px;
        background: rgba(255,255,255,0.4);
        border: 2px solid rgba(255,255,255,0.8);
        border-radius: 12px;
        backdrop-filter: blur(4px);
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: background 0.1s, transform 0.1s;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .d-btn:active {
        background: rgba(255,255,255,0.7);
        transform: scale(0.95);
    }

    .d-btn svg {
        width: 20px;
        height: 20px;
        fill: #333;
        filter: drop-shadow(0 1px 0 rgba(255,255,255,0.5));
    }

    .d-up { top: 0; left: 47.5px; }
    .d-down { bottom: 0; left: 47.5px; }
    .d-left { top: 47.5px; left: 0; }
    .d-right { top: 47.5px; right: 0; }

    /* DECORATIONS */
    .tree {
        position: absolute;
        width: 0; 
        height: 0; 
        border-left: 20px solid transparent;
        border-right: 20px solid transparent;
        border-bottom: 60px solid #2E7D32;
        filter: drop-shadow(0 5px 2px rgba(0,0,0,0.2));
        transform-style: preserve-3d;
        transform: translateZ(20px); /* Pop out */
    }
    .trunk {
        position: absolute;
        bottom: -60px;
        left: -5px;
        width: 10px;
        height: 15px;
        background: #5D4037;
    }

    /* Clouds */
    .cloud {
        position: absolute;
        background: rgba(255,255,255,0.6);
        border-radius: 20px;
        animation: float 20s linear infinite;
    }

    @keyframes float {
        from { transform: translateX(-100%); }
        to { transform: translateX(100vw); }
    }

</style>
</head>
<body>

<div id="scene">
    <!-- HUD -->
    <div class="hud">
        <div class="score-box">
            <div class="score-label">Score</div>
            <div class="score-val" id="score">0</div>
        </div>
        <div class="score-box">
            <div class="score-label">Best</div>
            <div class="score-val" id="best">12</div>
        </div>
    </div>

    <!-- BACKGROUND ELEMENTS -->
    <div class="cloud" style="top: 10%; left: -10%; width: 120px; height: 40px; animation-duration: 45s;"></div>
    <div class="cloud" style="top: 25%; left: -30%; width: 180px; height: 60px; animation-duration: 35s; animation-delay: -10s;"></div>
    <div class="cloud" style="top: 5%; left: -50%; width: 100px; height: 35px; animation-duration: 55s; animation-delay: -5s;"></div>

    <!-- GAME BOARD -->
    <div id="board">
        <!-- Generated via JS -->
    </div>

    <!-- PLAYER -->
    <div id="player">
        <div class="chicken">
            <div class="comb"></div>
            <div class="body">
                <div class="eye"></div>
                <div class="beak"></div>
            </div>
            <div class="shadow"></div>
        </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <div class="d-btn d-up" onclick="movePlayer(0, 1)">
            <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h6v8h4v-8h6z"/></svg>
        </div>
        <div class="d-btn d-down" onclick="movePlayer(0, -1)">
            <svg viewBox="0 0 24 24"><path d="M12 20l8-8h-6V4h-4v8H4z"/></svg>
        </div>
        <div class="d-btn d-left" onclick="movePlayer(-1, 0)">
            <svg viewBox="0 0 24 24"><path d="M4 12l8-8v6h8v4h-8v6z"/></svg>
        </div>
        <div class="d-btn d-right" onclick="movePlayer(1, 0)">
            <svg viewBox="0 0 24 24"><path d="M20 12l-8-8v6H4v4h8v6z"/></svg>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    const LANE_HEIGHT = 80;
    const BOARD_OFFSET_Y = -50; // Matches CSS translateY
    const START_LANES = 15;
    
    // --- STATE ---
    let score = 0;
    let playerGridPos = { x: 0, y: 2 }; // 0,0 is center bottom
    let lanes = [];
    let gameLoopId;
    let isGameOver = false;

    // --- ELEMENTS ---
    const board = document.getElementById('board');
    const playerEl = document.getElementById('player');
    const scoreEl = document.getElementById('score');

    // --- INITIALIZATION ---
    function init() {
        // Generate initial lanes
        for (let i = 0; i < START_LANES; i++) {
            addLane(-i);
        }
        updatePlayerVisuals();
        gameLoop();
    }

    // --- LANE GENERATION ---
    function addLane(index) {
        // Determine type: Grass (safe), Road (car), Water (log)
        // Pattern: 2 Grass, 2 Road, 1 Water, 2 Grass...
        let type = 'grass';
        const absIndex = Math.abs(index);
        
        // Simple procedural generation logic
        if (absIndex > 2) {
            const r = Math.random();
            if (r < 0.4) type = 'road';
            else if (r < 0.6) type = 'water';
            else type = 'grass';
        }

        const lane = document.createElement('div');
        lane.className = `lane ${type}`;
        lane.dataset.index = index;
        
        // Calculate position based on grid Y
        // Y=0 is bottom. Negative Y goes up.
        // We need to map grid Y to CSS top.
        // Since the board is rotated, we stack them.
        // Let's position them relative to the bottom of the container but using 'top' with negative margins or absolute bottom.
        // Actually, easier: The board is rotated. We stack lanes from bottom up.
        // Let's use absolute positioning from bottom.
        
        lane.style.bottom = (index * LANE_HEIGHT) + 'px';
        lane.style.width = '100%';
        
        // Add Content
        let content = null;
        let speed = 0;
        let speedDir = 1;
        let xPos = 0;

        if (type === 'road') {
            const car = document.createElement('div');
            car.className = `moving-object car ${Math.random() > 0.8 ? 'truck' : ''}`;
            // Randomize direction and speed
            speed = (1 + Math.random() * 2) * (Math.random() > 0.5 ? 1 : -1);
            xPos = speed > 0 ? -150 : 100; // Start off screen
            lane.appendChild(car);
            content = car;
        } else if (type === 'water') {
            const log = document.createElement('div');
            log.className = 'moving-object log';
            speed = (0.5 + Math.random()) * (Math.random() > 0.5 ? 1 : -1);
            xPos = speed > 0 ? -150 : 100;
            lane.appendChild(log);
            content = log;
        } else if (type === 'grass') {
            // Random trees
            if (Math.random() > 0.5) {
                const tree = document.createElement('div');
                tree.className = 'tree';
                tree.innerHTML = '<div class="trunk"></div>';
                tree.style.left = Math.random() * 80 + 10 + '%';
                lane.appendChild(tree);
            }
        }

        board.appendChild(lane);

        lanes.push({
            element: lane,
            type: type,
            index: index,
            content: content,
            speed: speed,
            x: xPos
        });
    }

    // --- GAME LOOP ---
    function gameLoop() {
        if (isGameOver) return;

        // Move objects
        lanes.forEach(l => {
            if (l.content) {
                l.x += l.speed;
                // Wrap around
                if (l.speed > 0 && l.x > 100) l.x = -150;
                if (l.speed < 0 && l.x < -150) l.x = 100;
                l.content.style.transform = `translateX(${l.x}%)`;
            }
        });

        // Check collisions
        checkCollisions();

        // Camera follow
        updateCamera();

        requestAnimationFrame(gameLoop);
    }

    function checkCollisions() {
        const currentLaneObj = lanes.find(l => l.index === playerGridPos.y);
        if (!currentLaneObj) return;

        // 1. Check if on Water without Log
        if (currentLaneObj.type === 'water') {
            // Simple bounding box check
            // Player is at center (50%). Log width is approx 20%.
            // This is a simplified collision check for the visual demo
            const onLog = isPlayerOnObject(currentLaneObj.content, currentLaneObj.speed);
            
            if (onLog) {
                // Move player with log
                playerGridPos.x += currentLaneObj.speed * 0.05; // Move pixels relative to lane
                updatePlayerVisuals();
            } else {
                // Drown
                gameOver();
            }
        } else if (currentLaneObj.type === 'road') {
            // Check car collision
            if (isPlayerOnObject(currentLaneObj.content, 0)) {
                gameOver();
            }
        }
    }

    function isPlayerOnObject(obj, speed) {
        if (!obj) return false;
        // Get object rect relative to lane
        // This is tricky in 3D. Let's approximate based on our state.
        // Player X is in Grid Units (0 is center). Lane width is 100%.
        // Let's say grid width is 10 units.
        // Player visual X % = 50 + (playerGridPos.x * 5).
        
        // Object X is in % relative to lane.
        // Object width approx 15% (car) or 25% (log).
        
        // Convert player grid X to percentage of lane width
        // Assume lane width fits 8 grid steps.
        const playerPct = (playerGridPos.x / 8) * 100 + 50; // Center is 50%
        
        // Object rect
        // We stored l.x as percentage.
        // Car width ~15%
        const objWidth = obj.classList.contains('log') ? 25 : 15;
        const objLeft = l.x; // This is l.x from closure? No, need current state.
        
        // Actually, let's read computed style or rely on our state variable 'x'
        // But 'x' is local to the loop.
        // Let's just check intersection.
        
        const laneWidth = 100;
        const pLeft = playerPct - 2.5; // Player is small
        const pRight = playerPct + 2.5;
        
        const oLeft = currentLaneObj.x;
        const oRight = currentLaneObj.x + objWidth;

        return (pLeft < oRight && pRight > oLeft);
    }

    // --- MOVEMENT ---
    window.movePlayer = function(dx, dy) {
        if (isGameOver) {
            // Reset
            resetGame();
            return;
        }

        playerGridPos.x += dx;
        playerGridPos.y += dy;

        // Clamp X
        if (playerGridPos.x > 4) playerGridPos.x = 4;
        if (playerGridPos.x < -4) playerGridPos.x = -4;

        updatePlayerVisuals();

        // Score increment on forward move
        if (dy > 0) {
            score++;
            scoreEl.innerText = score;
            // Add new lane
            addLane(-lanes.length); // lanes.length is actually negative index count
        }
    };

    function updatePlayerVisuals() {
        // Map Grid to CSS
        // Y: Bottom position
        const bottomPx = (playerGridPos.y * LANE_HEIGHT) + 15; // +15 to center in lane
        
        // X: Percentage. Center is 50%. 
        // Let's say 1 grid unit = 10% width.
        const leftPct = 50 + (playerGridPos.x * 8);

        playerEl.style.bottom = bottomPx + 'px';
        playerEl.style.left = leftPct + '%';
        
        // Face direction? (Optional polish)
        // playerEl.style.transform = `translateX(-50%) scaleX(${dx === 0 ? 1 : dx})`;
    }

    function updateCamera() {
        // Move the board down if player goes up
        // Target Y translation for board
        // We want player to stay at roughly 30% from bottom of screen
        
        const targetBottom = (playerGridPos.y * LANE_HEIGHT) + 15;
        const screenCenter = window.innerHeight * 0.6; // Keep player here
        
        // Current board transform
        // We need to translate the board UP (negative Y) as player goes UP (positive Y)
        
        // Simple lerp for smooth camera
        const currentTransform = getComputedStyle(board).transform;
        // Parse matrix3d... or just track a variable
        // Let's track cameraY
        
        if (!window.cameraY) window.cameraY = 0;
        
        // Calculate desired offset
        // If player is at Y=10 (800px up), and we want them at 60% height...
        // It's easier to just move the board element's 'top' or 'transform'
        
        const desiredBoardY = - (targetBottom - 200); // Keep player 200px from bottom of viewport (approx)
        
        window.cameraY += (desiredBoardY - window.cameraY) * 0.1;
        
        board.style.transform = `rotateX(25deg) translateY(${BOARD_OFFSET_Y + window.cameraY}px)`;
    }

    function gameOver() {
        isGameOver = true;
        // Visual feedback
        playerEl.style.filter = 'grayscale(100%)';
        playerEl.style.transform = 'translateX(-50%) rotate(90deg)';
        playerEl.style.transition = 'all 0.5s';
        
        setTimeout(() => {
            alert(`Game Over! Score: ${score}. Click OK to restart.`);
            resetGame();
        }, 500);
    }

    function resetGame() {
        isGameOver = false;
        score = 0;
        scoreEl.innerText = '0';
        playerGridPos = { x: 0, y: 2 };
        window.cameraY = 0;
        
        // Clear lanes
        board.innerHTML = '';
        lanes = [];
        
        // Reset player style
        playerEl.style.filter = 'none';
        playerEl.style.transform = 'translateX(-50%)';
        playerEl.style.transition = 'top 0.15s ease-out, left 0.15s ease-out, transform 0.2s';
        
        init();
    }

    // --- KEYBOARD SUPPORT ---
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp') movePlayer(0, 1);
        if (e.key === 'ArrowDown') movePlayer(0, -1);
        if (e.key === 'ArrowLeft') movePlayer(-1, 0);
        if (e.key === 'ArrowRight') movePlayer(1, 0);
    });

    // --- START ---
    init();

</script>
</body>
</html>
