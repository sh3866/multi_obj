<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crossy Road Style: Low Poly Adventure</title>
<style>
    :root {
        --sky-top: #4facfe;
        --sky-bottom: #00f2fe;
        --grass-top: #76c956;
        --grass-side: #5ea344;
        --road-top: #546e7a;
        --road-side: #37474f;
        --water-top: #4fc3f7;
        --water-side: #039be5;
        --ui-wood: #8d6e63;
        --ui-wood-dark: #5d4037;
        --ui-wood-light: #a1887f;
        --ui-shadow: #3e2723;
    }

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }

    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 40%, var(--grass-top) 100%);
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* --- 3D SCENE SETUP --- */
    #scene {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        perspective: 800px;
    }

    /* --- HUD: UNIFIED WOODEN SIGN SYSTEM --- */
    .hud {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 12px;
        pointer-events: none;
    }

    .sign-container {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .wood-sign {
        background: var(--ui-wood);
        border: 3px solid var(--ui-wood-dark);
        border-radius: 6px;
        padding: 8px 16px;
        box-shadow: 0 6px 0 var(--ui-shadow), 0 10px 10px rgba(0,0,0,0.3);
        color: #fff;
        font-family: 'Arial Black', sans-serif; /* Chunky font */
        font-size: 24px;
        letter-spacing: 1px;
        position: relative;
        transform: rotate(-2deg);
        text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
    }

    .wood-sign::after {
        content: '';
        position: absolute;
        top: 4px; left: 4px; right: 4px; bottom: 4px;
        border: 2px solid rgba(255,255,255,0.15);
        border-radius: 4px;
    }

    .wood-label {
        font-size: 14px;
        text-transform: uppercase;
        opacity: 0.8;
        font-weight: bold;
        letter-spacing: 2px;
        margin-right: 5px;
    }

    /* --- GAME WORLD CONTAINER --- */
    #world {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        transform-style: preserve-3d;
        /* Isometric Tilt */
        transform: rotateX(25deg) translateY(-150px) translateZ(-150px);
        transition: transform 0.1s linear;
    }

    /* --- LANES: 3D BLOCKS --- */
    .lane {
        width: 100%;
        height: 100px;
        position: absolute;
        left: 0;
        transform-style: preserve-3d;
    }

    /* 3D Extrusion effect for lanes */
    .lane-surface {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0; left: 0;
    }
    .lane-side {
        position: absolute;
        width: 100%;
        height: 15px; /* Depth of the block */
        bottom: 0; left: 0;
        transform-origin: bottom;
        transform: rotateX(-90deg);
        z-index: -1;
    }

    /* Grass */
    .lane.grass .lane-surface {
        background-color: var(--grass-top);
        background-image: radial-gradient(var(--grass-side) 10%, transparent 11%);
        background-size: 30px 30px;
    }
    .lane.grass .lane-side { background-color: var(--grass-side); }

    /* Road */
    .lane.road .lane-surface {
        background-color: var(--road-top);
        background-image: linear-gradient(90deg, transparent 48%, #FFF9C4 49%, #FFF9C4 51%, transparent 52%);
        background-size: 100px 100%; /* Dashed line */
        background-repeat: repeat-x;
    }
    .lane.road .lane-side { background-color: var(--road-side); }

    /* Water */
    .lane.water .lane-surface {
        background-color: var(--water-top);
        opacity: 0.9;
    }
    .lane.water .lane-side { background-color: var(--water-side); }

    /* --- OBJECTS (CSS ART) --- */

    /* 3D Car */
    .car-container {
        position: absolute;
        top: 15px;
        width: 120px;
        height: 70px;
        transform-style: preserve-3d;
        transition: transform 0.1s linear;
    }
    
    /* Car Shadow */
    .car-container::before {
        content: '';
        position: absolute;
        bottom: -5px; left: 5px;
        width: 110px; height: 30px;
        background: rgba(0,0,0,0.3);
        border-radius: 50%;
        filter: blur(4px);
    }

    .car-body {
        position: absolute;
        bottom: 10px;
        width: 100%;
        height: 35px;
        background: #FF5252;
        border-radius: 8px;
        box-shadow: 0 6px 0 #B71C1C; /* 3D depth */
        z-index: 2;
    }
    
    .car-top {
        position: absolute;
        bottom: 40px;
        left: 15px;
        width: 70px;
        height: 30px;
        background: #FF8A80;
        border-radius: 10px 10px 0 0;
        box-shadow: inset 2px 2px 5px rgba(255,255,255,0.3);
        z-index: 1;
    }
    
    .car-wheel {
        position: absolute;
        bottom: 5px;
        width: 22px;
        height: 22px;
        background: #212121;
        border-radius: 50%;
        border: 3px solid #424242;
        z-index: 3;
    }
    .car-wheel.left { left: 15px; }
    .car-wheel.right { right: 15px; }

    /* Truck Variant */
    .car-container.truck .car-body { background: #FFC107; box-shadow: 0 6px 0 #F57F17; height: 40px; bottom: 10px; }
    .car-container.truck .car-top { background: #FFD54F; width: 60px; left: 50px; border-radius: 4px; bottom: 45px; height: 35px;}

    /* Log */
    .log-container {
        position: absolute;
        top: 20px;
        width: 160px;
        height: 50px;
        transform-style: preserve-3d;
        transition: transform 0.1s linear;
    }
    
    .log-body {
        width: 100%;
        height: 40px;
        background: var(--ui-wood);
        border-radius: 4px;
        box-shadow: 0 8px 0 var(--ui-wood-dark);
        position: relative;
        overflow: hidden;
        border: 2px solid #3e2723;
    }
    /* Wood rings */
    .log-body::after {
        content: '';
        position: absolute;
        right: -10px; top: -10px; bottom: -10px;
        width: 40px;
        background: repeating-linear-gradient(45deg, rgba(0,0,0,0.1), rgba(0,0,0,0.1) 2px, transparent 2px, transparent 6px);
        border-radius: 50%;
    }

    /* Tree (Obstacle) */
    .tree-container {
        position: absolute;
        width: 0; height: 0;
        transform-style: preserve-3d;
        top: 10px;
    }
    .tree-trunk {
        position: absolute;
        bottom: 0; left: -10px;
        width: 20px; height: 30px;
        background: #5D4037;
        box-shadow: 4px 0 0 #3E2723;
    }
    .tree-top {
        position: absolute;
        bottom: 25px; left: -45px;
        width: 90px; height: 90px;
        background: #2E7D32;
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2));
    }
    /* Tree highlight for volume */
    .tree-top::after {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    }

    /* --- PLAYER (Low Poly Chicken) --- */
    #player {
        position: absolute;
        width: 80px;
        height: 80px;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 50;
        transition: bottom 0.15s ease-out, left 0.15s ease-out, transform 0.1s;
        filter: drop-shadow(0 10px 5px rgba(0,0,0,0.4));
    }

    .chicken-model {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        animation: hopIdle 0.6s infinite alternate ease-in-out;
    }

    .ch-body {
        position: absolute;
        bottom: 0;
        left: 15px;
        width: 50px;
        height: 50px;
        background: #FFF;
        border-radius: 50% 50% 40% 40%;
        border: 3px solid #EEE;
        box-shadow: inset -5px -5px 0 rgba(0,0,0,0.05);
        z-index: 2;
    }

    .ch-head {
        position: absolute;
        bottom: 35px;
        left: 35px;
        width: 35px;
        height: 35px;
        background: #FFF;
        border-radius: 50%;
        border: 3px solid #EEE;
        z-index: 3;
    }

    .ch-comb {
        position: absolute;
        top: -10px; left: 5px;
        width: 25px; height: 15px;
        background: #F44336;
        border-radius: 5px 5px 0 0;
        clip-path: polygon(0% 100%, 20% 0%, 40% 100%, 60% 0%, 80% 100%, 100% 0%);
    }

    .ch-eye {
        position: absolute;
        top: 10px; right: 8px;
        width: 6px; height: 8px;
        background: #333;
        border-radius: 50%;
    }

    .ch-beak {
        position: absolute;
        top: 15px; right: -5px;
        width: 0; height: 0;
        border-top: 4px solid transparent;
        border-bottom: 4px solid transparent;
        border-left: 10px solid #FFC107;
    }

    .ch-wing {
        position: absolute;
        bottom: 15px; left: 15px;
        width: 30px; height: 20px;
        background: #EEE;
        border-radius: 50%;
        border: 2px solid #DDD;
        z-index: 4;
        transform: rotate(-10deg);
    }

    .ch-leg {
        position: absolute;
        bottom: -8px;
        width: 6px; height: 12px;
        background: #FFC107;
        z-index: 1;
    }
    .ch-leg.left { left: 25px; }
    .ch-leg.right { left: 40px; }

    @keyframes hopIdle {
        0% { transform: translateY(0) scaleY(1); }
        100% { transform: translateY(-5px) scaleY(1.05); }
    }

    /* --- CONTROLS: CHUNKY 3D BUTTONS --- */
    .controls {
        position: absolute;
        bottom: 40px;
        right: 40px;
        width: 180px;
        height: 180px;
        z-index: 200;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 1fr 1fr 1fr;
        gap: 8px;
    }

    .d-btn {
        background: #FFF;
        border: 3px solid #E0E0E0;
        border-radius: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 0.1s;
        box-shadow: 0 8px 0 #BDBDBD, 0 15px 10px rgba(0,0,0,0.2);
        position: relative;
    }

    .d-btn:active {
        transform: translateY(8px);
        box-shadow: 0 0 0 #BDBDBD, 0 0 0 rgba(0,0,0,0);
    }

    .d-btn svg {
        width: 32px;
        height: 32px;
        fill: #555;
    }

    .d-up { grid-column: 2; grid-row: 1; }
    .d-left { grid-column: 1; grid-row: 2; }
    .d-right { grid-column: 3; grid-row: 2; }
    .d-down { grid-column: 2; grid-row: 3; }

    /* Clouds */
    .cloud {
        position: absolute;
        background: #FFF;
        border-radius: 50px;
        opacity: 0.8;
        box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        animation: float linear infinite;
    }
    .cloud::after, .cloud::before {
        content: ''; position: absolute; background: #FFF; border-radius: 50%;
    }
    .cloud::after { width: 40%; height: 100%; top: -50%; left: 15%; }
    .cloud::before { width: 30%; height: 80%; top: -30%; right: 15%; }

    @keyframes float {
        from { transform: translateX(-150px); }
        to { transform: translateX(100vw); }
    }

</style>
</head>
<body>

<div id="scene">
    <!-- HUD: UNIFIED HIERARCHY -->
    <div class="hud">
        <div class="sign-container">
            <div class="wood-sign">
                <span class="wood-label">Score</span>
                <span id="score">0</span>
            </div>
        </div>
        <div class="sign-container">
            <div class="wood-sign" style="transform: rotate(2deg); background: #D7CCC8; border-color: #A1887F; box-shadow: 0 6px 0 #8D6E63, 0 10px 10px rgba(0,0,0,0.2);">
                <span class="wood-label" style="color:#5D4037">Best</span>
                <span id="best" style="color:#3E2723">12</span>
            </div>
        </div>
    </div>

    <!-- BACKGROUND -->
    <div class="cloud" style="top: 10%; left: -10%; width: 120px; height: 50px; animation-duration: 45s;"></div>
    <div class="cloud" style="top: 25%; left: -20%; width: 160px; height: 60px; animation-duration: 35s; animation-delay: -15s;"></div>
    <div class="cloud" style="top: 5%; left: -40%; width: 140px; height: 55px; animation-duration: 55s; animation-delay: -5s;"></div>

    <!-- GAME WORLD -->
    <div id="world">
        <!-- Generated via JS -->
    </div>

    <!-- PLAYER -->
    <div id="player">
        <div class="chicken-model">
            <div class="ch-head">
                <div class="ch-comb"></div>
                <div class="ch-eye"></div>
                <div class="ch-beak"></div>
            </div>
            <div class="ch-body"></div>
            <div class="ch-wing"></div>
            <div class="ch-leg left"></div>
            <div class="ch-leg right"></div>
        </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <div class="d-btn d-up" onclick="movePlayer(0, 1)">
            <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h6v8h4v-8h6z"/></svg>
        </div>
        <div class="d-btn d-down" onclick="movePlayer(0, -1)">
            <svg viewBox="0 0 24 24"><path d="M12 20l8-8h-6V4h-4v8H4z"/></svg>
        </div>
        <div class="d-btn d-left" onclick="movePlayer(-1, 0)">
            <svg viewBox="0 0 24 24"><path d="M4 12l8-8v6h8v4h-8v6z"/></svg>
        </div>
        <div class="d-btn d-right" onclick="movePlayer(1, 0)">
            <svg viewBox="0 0 24 24"><path d="M20 12l-8-8v6H4v4h8v6z"/></svg>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    const LANE_HEIGHT = 100; // Increased height for better scale
    const START_LANES = 15;
    
    // --- STATE ---
    let score = 0;
    let bestScore = 12;
    let playerGridPos = { x: 0, y: 2 };
    let lanes = [];
    let gameLoopId;
    let isGameOver = false;
    let cameraY = 0;

    // --- ELEMENTS ---
    const world = document.getElementById('world');
    const playerEl = document.getElementById('player');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');

    // --- INITIALIZATION ---
    function init() {
        for (let i = 0; i < START_LANES; i++) {
            addLane(-i);
        }
        updatePlayerVisuals();
        gameLoop();
    }

    // --- LANE GENERATION ---
    function addLane(index) {
        let type = 'grass';
        const absIndex = Math.abs(index);
        
        // Procedural Generation
        if (absIndex > 2) {
            const r = Math.random();
            if (r < 0.4) type = 'road';
            else if (r < 0.6) type = 'water';
            else type = 'grass';
        }

        const lane = document.createElement('div');
        lane.className = `lane ${type}`;
        lane.dataset.index = index;
        lane.style.bottom = (index * LANE_HEIGHT) + 'px';
        
        // 3D Structure
        const surface = document.createElement('div');
        surface.className = 'lane-surface';
        const side = document.createElement('div');
        side.className = 'lane-side';
        lane.appendChild(surface);
        lane.appendChild(side);

        // Add Content
        let content = null;
        let speed = 0;
        let xPos = 0;

        if (type === 'road') {
            const isTruck = Math.random() > 0.7;
            const car = document.createElement('div');
            car.className = `car-container ${isTruck ? 'truck' : ''}`;
            car.innerHTML = `
                <div class="car-body"></div>
                <div class="car-top"></div>
                <div class="car-wheel left"></div>
                <div class="car-wheel right"></div>
            `;
            speed = (2 + Math.random() * 3) * (Math.random() > 0.5 ? 1 : -1);
            xPos = speed > 0 ? -150 : 120; 
            lane.appendChild(car);
            content = car;
        } else if (type === 'water') {
            const log = document.createElement('div');
            log.className = 'log-container';
            log.innerHTML = `<div class="log-body"></div>`;
            speed = (1 + Math.random() * 2) * (Math.random() > 0.5 ? 1 : -1);
            xPos = speed > 0 ? -180 : 120;
            lane.appendChild(log);
            content = log;
        } else if (type === 'grass') {
            if (Math.random() > 0.6) {
                const tree = document.createElement('div');
                tree.className = 'tree-container';
                tree.innerHTML = `<div class="tree-trunk"></div><div class="tree-top"></div>`;
                tree.style.left = (Math.random() * 80 + 10) + '%';
                lane.appendChild(tree);
            }
        }

        world.appendChild(lane);

        lanes.push({
            element: lane,
            type: type,
            index: index,
            content: content,
            speed: speed,
            x: xPos,
            width: type === 'water' ? 160 : (content && content.classList.contains('truck') ? 120 : 100)
        });
    }

    // --- GAME LOOP ---
    function gameLoop() {
        if (isGameOver) return;

        // Move objects
        lanes.forEach(l => {
            if (l.content) {
                l.x += l.speed;
                // Wrap logic
                if (l.speed > 0 && l.x > 120) l.x = -150;
                if (l.speed < 0 && l.x < -150) l.x = 120;
                
                // Apply transform
                l.content.style.transform = `translate3d(${l.x}%, 0, 0)`;
            }
        });

        checkCollisions();
        updateCamera();

        requestAnimationFrame(gameLoop);
    }

    function checkCollisions() {
        const currentLaneObj = lanes.find(l => l.index === playerGridPos.y);
        if (!currentLaneObj) return;

        // Player X in percentage of lane width
        // Grid X: -5 to 5. Center is 0.
        // Map to 0-100%.
        const playerPct = 50 + (playerGridPos.x * 10); 
        const playerWidth = 6; // Approx visual width in %

        if (currentLaneObj.type === 'water') {
            if (currentLaneObj.content) {
                const logPct = currentLaneObj.x;
                const logWidth = 160; // Visual width
                const laneWidthPx = window.innerWidth;
                const logWidthPct = (logWidth / laneWidthPx) * 100;

                // Check overlap
                if (playerPct > logPct - 2 && playerPct < logPct + logWidthPct + 2) {
                    // Riding log
                    const gridSpeed = (currentLaneObj.speed / window.innerWidth) * 100 * 0.05;
                    playerGridPos.x += gridSpeed * 2; 
                    updatePlayerVisuals();
                } else {
                    gameOver();
                }
            } else {
                gameOver(); // Water with no log
            }
        } else if (currentLaneObj.type === 'road') {
            if (currentLaneObj.content) {
                const carPct = currentLaneObj.x;
                const carWidth = currentLaneObj.width;
                const laneWidthPx = window.innerWidth;
                const carWidthPct = (carWidth / laneWidthPx) * 100;

                if (playerPct > carPct - 2 && playerPct < carPct + carWidthPct + 2) {
                    gameOver();
                }
            }
        }
    }

    // --- MOVEMENT ---
    window.movePlayer = function(dx, dy) {
        if (isGameOver) {
            resetGame();
            return;
        }

        // Prevent moving into bounds
        const newX = playerGridPos.x + dx;
        if (newX > 5 || newX < -5) return;

        playerGridPos.x = newX;
        playerGridPos.y += dy;

        updatePlayerVisuals();

        if (dy > 0) {
            score++;
            scoreEl.innerText = score;
            // Spawn new lane
            addLane(-lanes.length);
            
            // Cleanup old lanes
            lanes = lanes.filter(l => {
                if (l.index < playerGridPos.y - 5) {
                    l.element.remove();
                    return false;
                }
                return true;
            });
        }
    };

    function updatePlayerVisuals() {
        // Map Grid to CSS
        const bottomPx = (playerGridPos.y * LANE_HEIGHT) + 15;
        const leftPct = 50 + (playerGridPos.x * 8); // 8% per grid step

        playerEl.style.bottom = bottomPx + 'px';
        playerEl.style.left = leftPct + '%';
        
        // Face direction
        const scaleX = playerGridPos.x < 0 ? -1 : 1;
        playerEl.querySelector('.chicken-model').style.transform = `scaleX(${scaleX})`;
    }

    function updateCamera() {
        // Smoothly interpolate camera Y
        const targetBottom = (playerGridPos.y * LANE_HEIGHT) + 15;
        const desiredBoardY = - (targetBottom - 250); // Keep player roughly 250px from bottom

        // Lerp
        cameraY += (desiredBoardY - cameraY) * 0.1;
        
        // Apply transform
        world.style.transform = `rotateX(25deg) translateY(${-150 + cameraY}px) translateZ(-150px)`;
    }

    function gameOver() {
        isGameOver = true;
        playerEl.style.filter = 'grayscale(100%) brightness(0.5)';
        playerEl.querySelector('.chicken-model').style.transform = 'rotate(90deg) translateY(20px)';
        
        if (score > bestScore) {
            bestScore = score;
            bestEl.innerText = bestScore;
        }

        setTimeout(() => {
            const overlay = document.createElement('div');
            overlay.style.position = 'fixed';
            overlay.style.top = '0'; left='0'; width='100%'; height='100%';
            overlay.style.background = 'rgba(0,0,0,0.6)';
            overlay.style.zIndex = '999';
            overlay.style.display = 'flex';
            overlay.style.justifyContent = 'center';
            overlay.style.alignItems = 'center';
            overlay.style.flexDirection = 'column';
            overlay.style.color = '#FFF';
            overlay.innerHTML = `
                <div class="wood-sign" style="transform: rotate(-3deg); font-size: 40px; margin-bottom: 20px;">SPLAT!</div>
                <p style="font-size: 24px; font-weight: bold;">Score: ${score}</p>
                <p style="margin-top: 30px; opacity: 0.9; animation: blink 1s infinite;">Tap anywhere to Restart</p>
            `;
            document.body.appendChild(overlay);
            
            overlay.addEventListener('click', () => {
                overlay.remove();
                resetGame();
            });
        }, 800);
    }

    function resetGame() {
        isGameOver = false;
        score = 0;
        scoreEl.innerText = '0';
        playerGridPos = { x: 0, y: 2 };
        cameraY = 0;
        
        // Clear DOM
        world.innerHTML = '';
        lanes = [];
        
        // Reset Player
        playerEl.style.filter = 'none';
        playerEl.querySelector('.chicken-model').style.transform = 'scaleX(1)';
        
        init();
    }

    // --- INPUT ---
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp') movePlayer(0, 1);
        if (e.key === 'ArrowDown') movePlayer(0, -1);
        if (e.key === 'ArrowLeft') movePlayer(-1, 0);
        if (e.key === 'ArrowRight') movePlayer(1, 0);
    });

    // Start
    init();

</script>
