<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crossy Road: Redesign</title>
<style>
    :root {
        /* Palette: Playful, Vibrant, High Contrast */
        --sky-top: #56CCF2;
        --sky-bottom: #2F80ED;
        
        --grass-top: #76c952;
        --grass-side: #4a9c2e;
        
        --road-top: #546e7a;
        --road-side: #37474f;
        --road-line: #fff;
        
        --water-top: #4fc3f7;
        --water-side: #039be5;
        
        --wood-top: #8d6e63;
        --wood-side: #5d4037;
        
        /* UI Colors */
        --ui-primary: #ffeb3b;
        --ui-secondary: #ff9800;
        --ui-text: #3e2723;
        --ui-white: #ffffff;
    }

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }

    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 100%);
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* --- 3D SCENE --- */
    #scene {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        /* Strong perspective for depth */
        perspective: 600px; 
        perspective-origin: 50% 30%;
    }

    /* --- HUD: BILLBOARD STYLE --- */
    .hud {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 12px;
        pointer-events: none;
    }

    .hud-item {
        background: var(--ui-white);
        padding: 10px 20px 14px 20px;
        border-radius: 12px;
        /* Chunky 3D shadow */
        box-shadow: 0 8px 0 rgba(0,0,0,0.15), 0 15px 20px rgba(0,0,0,0.2);
        color: var(--ui-text);
        text-align: center;
        min-width: 110px;
        border: 4px solid var(--ui-secondary);
        transform: skewX(-4deg);
        position: relative;
    }
    
    /* Decoration for HUD */
    .hud-item::after {
        content: '';
        position: absolute;
        top: 4px; left: 4px; right: 4px; bottom: 4px;
        border: 2px dashed rgba(0,0,0,0.1);
        border-radius: 8px;
        pointer-events: none;
    }

    .hud-label {
        display: block;
        font-size: 11px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #795548;
        margin-bottom: 2px;
    }

    .hud-value {
        font-family: 'Impact', 'Arial Black', sans-serif;
        font-size: 32px;
        line-height: 1;
        color: var(--ui-secondary);
        text-shadow: 2px 2px 0 #000;
        -webkit-text-stroke: 1px var(--ui-secondary);
    }

    /* --- GAME WORLD CONTAINER --- */
    #world {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        transform-style: preserve-3d;
        /* 
           Isometric Setup:
           RotateX 30deg: Steep angle for clear depth
           TranslateZ -200px: Push back to reveal horizon
        */
        transform: rotateX(30deg) translateY(50px) translateZ(-200px);
        transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* --- LANES --- */
    .lane {
        width: 100%;
        height: 100px;
        position: absolute;
        left: 0;
        transform-style: preserve-3d;
    }

    .lane-surface {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0; left: 0;
        transform: translateZ(0);
        box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
    }

    .lane-side {
        position: absolute;
        width: 100%;
        height: 24px; /* Chunky depth */
        bottom: 0; left: 0;
        transform-origin: bottom;
        transform: rotateX(-90deg);
        z-index: -1;
    }

    /* Grass */
    .lane.grass .lane-surface {
        background-color: var(--grass-top);
        /* Dot pattern for texture */
        background-image: radial-gradient(var(--grass-side) 2px, transparent 3px);
        background-size: 30px 30px;
    }
    .lane.grass .lane-side { background-color: var(--grass-side); }

    /* Road */
    .lane.road .lane-surface {
        background-color: var(--road-top);
        /* Dashed Lines */
        background-image: linear-gradient(90deg, transparent 48%, rgba(255,255,255,0.6) 49%, rgba(255,255,255,0.6) 51%, transparent 52%);
        background-size: 150px 100%;
    }
    .lane.road .lane-side { background-color: var(--road-side); }

    /* Water */
    .lane.water .lane-surface {
        background-color: var(--water-top);
        opacity: 0.9;
        /* Moving water effect via animation on container usually, but here static for perf */
        background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.2) 0px, rgba(255,255,255,0.2) 2px, transparent 2px, transparent 10px);
    }
    .lane.water .lane-side { background-color: var(--water-side); }

    /* --- OBJECTS (CSS ART) --- */

    /* Car */
    .car-container {
        position: absolute;
        top: 15px;
        width: 100px;
        height: 50px;
        transform-style: preserve-3d;
        transition: transform 0.1s linear;
        z-index: 10;
    }
    
    /* Shadow */
    .car-container::before {
        content: '';
        position: absolute;
        bottom: -5px; left: 5px;
        width: 90px; height: 15px;
        background: rgba(0,0,0,0.4);
        border-radius: 50%;
        filter: blur(4px);
        transform: translateZ(2px);
    }

    .car-body {
        position: absolute;
        bottom: 10px;
        width: 100%;
        height: 30px;
        background: #e53935; /* Bright Red */
        border-radius: 6px;
        box-shadow: inset 0 -5px 0 rgba(0,0,0,0.2), 0 5px 0 #b71c1c; 
        z-index: 2;
    }
    
    .car-top {
        position: absolute;
        bottom: 35px;
        left: 20px;
        width: 60px;
        height: 30px;
        background: #e53935;
        border-radius: 8px 8px 0 0;
        box-shadow: inset 0 -5px 0 rgba(0,0,0,0.1), 0 5px 0 #b71c1c;
        z-index: 1;
    }
    
    .car-window {
        position: absolute;
        top: 5px; left: 5px; right: 5px; bottom: 5px;
        background: #e1f5fe;
        border-radius: 4px 4px 0 0;
        opacity: 0.9;
        border-bottom: 2px solid #b3e5fc;
    }

    .car-wheel {
        position: absolute;
        bottom: 5px;
        width: 22px;
        height: 22px;
        background: #263238;
        border-radius: 50%;
        border: 3px solid #cfd8dc;
        z-index: 3;
        box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
    .car-wheel.left { left: 10px; }
    .car-wheel.right { right: 10px; }

    /* Truck Variant */
    .car-container.truck .car-body { background: #ffb300; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.2), 0 5px 0 #ff8f00; height: 30px; bottom: 10px; width: 70%; left: 0; }
    .car-container.truck .car-top { background: #ffb300; width: 35px; left: 0; border-radius: 4px; bottom: 35px; height: 35px;}
    .car-container.truck .car-window { border-radius: 4px; }
    .car-container.truck .car-body::after {
        content: ''; position: absolute; right: -25px; top: 0; width: 25px; height: 100%;
        background: #ff8f00; border-radius: 0 6px 6px 0;
    }

    /* Log */
    .log-container {
        position: absolute;
        top: 20px;
        width: 140px;
        height: 35px;
        transform-style: preserve-3d;
        transition: transform 0.1s linear;
        z-index: 10;
    }
    
    .log-body {
        width: 100%;
        height: 35px;
        background: var(--wood-top);
        border-radius: 5px;
        box-shadow: 0 6px 0 var(--wood-side);
        position: relative;
        border: 2px solid #4e342e;
    }
    /* Wood rings */
    .log-body::after {
        content: '';
        position: absolute;
        right: -5px; top: -5px; bottom: -5px;
        width: 25px;
        background: #d7ccc8;
        border-radius: 50%;
        border: 2px solid #4e342e;
        box-shadow: inset 0 0 10px #8d6e63;
    }

    /* Tree */
    .tree-container {
        position: absolute;
        width: 0; height: 0;
        transform-style: preserve-3d;
        top: 5px;
        z-index: 5;
    }
    .tree-trunk {
        position: absolute;
        bottom: 0; left: -12px;
        width: 24px; height: 45px;
        background: #795548;
        box-shadow: inset -5px 0 0 rgba(0,0,0,0.2);
    }
    .tree-top {
        position: absolute;
        bottom: 35px; left: -50px;
        width: 100px; height: 100px;
        background: #66bb6a;
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2));
    }
    /* Tree highlight */
    .tree-top::after {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 50%);
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    }

    /* --- PLAYER (Low Poly Chicken) --- */
    #player {
        position: absolute;
        width: 80px;
        height: 80px;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 50;
        transition: bottom 0.1s ease-out, left 0.1s ease-out;
        /* Soft colored shadow */
        filter: drop-shadow(0 15px 5px rgba(0,0,0,0.3));
    }

    .chicken-model {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        animation: hopIdle 0.6s infinite alternate ease-in-out;
    }

    .ch-body {
        position: absolute;
        bottom: 0;
        left: 15px;
        width: 50px;
        height: 50px;
        background: #FFF;
        border-radius: 50% 50% 40% 40%;
        border: 3px solid #eee;
        box-shadow: inset -5px -5px 0 rgba(0,0,0,0.05);
        z-index: 2;
    }

    .ch-head {
        position: absolute;
        bottom: 35px;
        left: 35px;
        width: 35px;
        height: 35px;
        background: #FFF;
        border-radius: 50%;
        border: 3px solid #eee;
        z-index: 3;
    }

    .ch-comb {
        position: absolute;
        top: -12px; left: 5px;
        width: 25px; height: 15px;
        background: #f44336;
        border-radius: 5px 5px 0 0;
        clip-path: polygon(0% 100%, 20% 0%, 40% 100%, 60% 0%, 80% 100%, 100% 0%);
        box-shadow: 0 2px 0 #d32f2f;
    }

    .ch-eye {
        position: absolute;
        top: 10px; right: 8px;
        width: 6px; height: 8px;
        background: #333;
        border-radius: 50%;
    }

    .ch-beak {
        position: absolute;
        top: 16px; right: -6px;
        width: 0; height: 0;
        border-top: 5px solid transparent;
        border-bottom: 5px solid transparent;
        border-left: 12px solid #ffca28;
    }

    .ch-wing {
        position: absolute;
        bottom: 15px; left: 15px;
        width: 30px; height: 20px;
        background: #f5f5f5;
        border-radius: 50%;
        border: 2px solid #eee;
        z-index: 4;
        transform: rotate(-10deg);
    }

    .ch-leg {
        position: absolute;
        bottom: -8px;
        width: 6px; height: 12px;
        background: #ffca28;
        z-index: 1;
    }
    .ch-leg.left { left: 25px; }
    .ch-leg.right { left: 40px; }

    @keyframes hopIdle {
        0% { transform: translateY(0) scaleY(1); }
        100% { transform: translateY(-8px) scaleY(1.05); }
    }

    /* --- CONTROLS: VOXEL STYLE --- */
    .controls {
        position: absolute;
        bottom: 30px;
        right: 30px; /* Balanced on right */
        width: 180px;
        height: 180px;
        z-index: 200;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 1fr 1fr 1fr;
        gap: 12px;
    }

    .d-btn {
        background: #fff;
        border-bottom: 8px solid #cfd8dc;
        border-radius: 16px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 0.1s;
        position: relative;
        box-shadow: 0 10px 15px rgba(0,0,0,0.2);
    }

    .d-btn:active {
        transform: translateY(8px);
        border-bottom-width: 0px;
    }

    .d-btn svg {
        width: 32px;
        height: 32px;
        fill: #546e7a;
    }

    .d-up { grid-column: 2; grid-row: 1; }
    .d-left { grid-column: 1; grid-row: 2; }
    .d-right { grid-column: 3; grid-row: 2; }
    .d-down { grid-column: 2; grid-row: 3; }

    /* Clouds */
    .cloud {
        position: absolute;
        background: #fff;
        border-radius: 50px;
        opacity: 0.8;
        filter: blur(2px);
        animation: float linear infinite;
        z-index: -1;
    }
    .cloud::after, .cloud::before {
        content: ''; position: absolute; background: #fff; border-radius: 50%;
    }
    .cloud::after { width: 40%; height: 100%; top: -50%; left: 15%; }
    .cloud::before { width: 30%; height: 80%; top: -30%; right: 15%; }

    @keyframes float {
        from { transform: translateX(-200px); }
        to { transform: translateX(110vw); }
    }
    
    /* Game Over Overlay */
    .overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(8px);
        z-index: 999;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        color: #2c3e50;
    }
    
    .overlay h1 {
        font-size: 70px;
        margin: 0;
        color: #e53935;
        text-shadow: 4px 4px 0 #fff, 8px 8px 0 rgba(0,0,0,0.1);
        font-weight: 900;
        transform: rotate(-5deg);
        letter-spacing: -2px;
    }

    .overlay button {
        margin-top: 30px;
        padding: 15px 50px;
        font-size: 24px;
        font-weight: 900;
        background: var(--ui-primary);
        border: none;
        border-bottom: 8px solid #fbc02d;
        border-radius: 15px;
        cursor: pointer;
        color: #3e2723;
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        transition: transform 0.1s;
    }
    .overlay button:active {
        transform: translateY(8px);
        border-bottom: 0;
    }

</style>
</head>
<body>

<div id="scene">
    <!-- HUD -->
    <div class="hud">
        <div class="hud-item">
            <span class="hud-label">Score</span>
            <span class="hud-value" id="score">0</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">Best</span>
            <span class="hud-value" id="best">12</span>
        </div>
    </div>

    <!-- BACKGROUND -->
    <div class="cloud" style="top: 15%; left: -10%; width: 140px; height: 60px; animation-duration: 40s;"></div>
    <div class="cloud" style="top: 30%; left: -25%; width: 180px; height: 70px; animation-duration: 55s; animation-delay: -20s;"></div>
    <div class="cloud" style="top: 8%; left: -45%; width: 130px; height: 50px; animation-duration: 48s; animation-delay: -5s;"></div>

    <!-- GAME WORLD -->
    <div id="world">
        <!-- Generated via JS -->
    </div>

    <!-- PLAYER -->
    <div id="player">
        <div class="chicken-model">
            <div class="ch-head">
                <div class="ch-comb"></div>
                <div class="ch-eye"></div>
                <div class="ch-beak"></div>
            </div>
            <div class="ch-body"></div>
            <div class="ch-wing"></div>
            <div class="ch-leg left"></div>
            <div class="ch-leg right"></div>
        </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <div class="d-btn d-up" onclick="movePlayer(0, 1)">
            <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h6v8h4v-8h6z"/></svg>
        </div>
        <div class="d-btn d-down" onclick="movePlayer(0, -1)">
            <svg viewBox="0 0 24 24"><path d="M12 20l8-8h-6V4h-4v8H4z"/></svg>
        </div>
        <div class="d-btn d-left" onclick="movePlayer(-1, 0)">
            <svg viewBox="0 0 24 24"><path d="M4 12l8-8v6h8v4h-8v6z"/></svg>
        </div>
        <div class="d-btn d-right" onclick="movePlayer(1, 0)">
            <svg viewBox="0 0 24 24"><path d="M20 12l-8-8v6H4v4h8v6z"/></svg>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    const LANE_HEIGHT = 100; 
    const START_LANES = 18;
    const GRID_WIDTH_PX = 80; 
    
    // --- STATE ---
    let score = 0;
    let bestScore = 12;
    let playerGridPos = { x: 0, y: 2 };
    let lanes = [];
    let gameLoopId;
    let isGameOver = false;
    let cameraY = 0;

    // --- ELEMENTS ---
    const world = document.getElementById('world');
    const playerEl = document.getElementById('player');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');

    // --- INITIALIZATION ---
    function init() {
        world.innerHTML = '';
        lanes = [];
        
        // Initial generation
        for (let i = 0; i < START_LANES; i++) {
            addLane(-i);
        }
        updatePlayerVisuals();
        gameLoop();
    }

    // --- LANE GENERATION ---
    function addLane(index) {
        let type = 'grass';
        const absIndex = Math.abs(index);
        
        // Logic for variety
        if (absIndex > 2) {
            const r = Math.random();
            // 40% Road, 20% Water, 40% Grass
            if (r < 0.4) type = 'road';
            else if (r < 0.6) type = 'water';
            else type = 'grass';
        }

        const lane = document.createElement('div');
        lane.className = `lane ${type}`;
        lane.dataset.index = index;
        // Position based on index (negative index goes up in Y)
        lane.style.bottom = (index * LANE_HEIGHT) + 'px';
        
        // 3D Structure
        const surface = document.createElement('div');
        surface.className = 'lane-surface';
        const side = document.createElement('div');
        side.className = 'lane-side';
        lane.appendChild(surface);
        lane.appendChild(side);

        // Add Content
        let content = null;
        let speed = 0;
        let xPos = 0;

        if (type === 'road') {
            const isTruck = Math.random() > 0.7;
            const car = document.createElement('div');
            car.className = `car-container ${isTruck ? 'truck' : ''}`;
            car.innerHTML = `
                <div class="car-body"></div>
                <div class="car-top"><div class="car-window"></div></div>
                <div class="car-wheel left"></div>
                <div class="car-wheel right"></div>
            `;
            // Random speed and direction
            speed = (2 + Math.random() * 5) * (Math.random() > 0.5 ? 1 : -1);
            xPos = speed > 0 ? -200 : 150; 
            lane.appendChild(car);
            content = car;
        } else if (type === 'water') {
            const log = document.createElement('div');
            log.className = 'log-container';
            log.innerHTML = `<div class="log-body"></div>`;
            speed = (1 + Math.random() * 2) * (Math.random() > 0.5 ? 1 : -1);
            xPos = speed > 0 ? -200 : 150;
            lane.appendChild(log);
            content = log;
        } else if (type === 'grass') {
            if (Math.random() > 0.5) {
                const tree = document.createElement('div');
                tree.className = 'tree-container';
                tree.innerHTML = `<div class="tree-trunk"></div><div class="tree-top"></div>`;
                // Random tree position
                const pos = Math.floor(Math.random() * 11) - 5; // -5 to 5
                tree.style.left = `calc(50% + ${pos * 8}%)`;
                lane.appendChild(tree);
            }
        }

        world.appendChild(lane);

        lanes.push({
            element: lane,
            type: type,
            index: index,
            content: content,
            speed: speed,
            x: xPos,
            width: type === 'water' ? 140 : (content && content.classList.contains('truck') ? 120 : 100)
        });
    }

    // --- GAME LOOP ---
    function gameLoop() {
        if (isGameOver) return;

        // Move objects
        lanes.forEach(l => {
            if (l.content) {
                l.x += l.speed;
                // Wrap logic
                if (l.speed > 0 && l.x > 150) l.x = -200;
                if (l.speed < 0 && l.x < -200) l.x = 150;
                
                // Apply transform
                l.content.style.transform = `translate3d(${l.x}%, 0, 0)`;
            }
        });

        checkCollisions();
        updateCamera();

        requestAnimationFrame(gameLoop);
    }

    function checkCollisions() {
        const currentLaneObj = lanes.find(l => l.index === playerGridPos.y);
        if (!currentLaneObj) return;

        // Player X mapping: Grid (-5 to 5) -> Screen %
        // Center is 50%. Each step is 8%.
        const playerPct = 50 + (playerGridPos.x * 8); 
        const playerWidth = 6; // Visual width in %

        if (currentLaneObj.type === 'water') {
            if (currentLaneObj.content) {
                const logPct = currentLaneObj.x;
                const logWidth = 140; 
                const laneWidthPx = window.innerWidth;
                const logWidthPct = (logWidth / laneWidthPx) * 100;

                // Check overlap
                if (playerPct > logPct - 2 && playerPct < logPct + logWidthPct + 2) {
                    // Riding log - move player X based on log speed
                    // Convert pixel speed to grid speed roughly
                    const gridSpeed = (currentLaneObj.speed / laneWidthPx) * 100 * 0.125;
                    playerGridPos.x += gridSpeed * 2; 
                    updatePlayerVisuals();
                } else {
                    gameOver();
                }
            } else {
                gameOver(); // Water with no log
            }
        } else if (currentLaneObj.type === 'road') {
            if (currentLaneObj.content) {
                const carPct = currentLaneObj.x;
                const carWidth = currentLaneObj.width;
                const laneWidthPx = window.innerWidth;
                const carWidthPct = (carWidth / laneWidthPx) * 100;

                if (playerPct > carPct - 2 && playerPct < carPct + carWidthPct + 2) {
                    gameOver();
                }
            }
        }
    }

    // --- MOVEMENT ---
    window.movePlayer = function(dx, dy) {
        if (isGameOver) return;

        const newX = playerGridPos.x + dx;
        // Bounds check (approx -5 to 5)
        if (newX > 5.5 || newX < -5.5) return;

        playerGridPos.x = newX;
        playerGridPos.y += dy;

        updatePlayerVisuals();

        if (dy > 0) {
            score++;
            scoreEl.innerText = score;
            // Spawn new lane
            addLane(-lanes.length);
            
            // Cleanup old lanes to save DOM nodes
            lanes = lanes.filter(l => {
                if (l.index < playerGridPos.y - 5) {
                    l.element.remove();
                    return false;
                }
                return true;
            });
        }
    };

    function updatePlayerVisuals() {
        const bottomPx = (playerGridPos.y * LANE_HEIGHT) + 15;
        const leftPct = 50 + (playerGridPos.x * 8); 

        playerEl.style.bottom = bottomPx + 'px';
        playerEl.style.left = leftPct + '%';
        
        // Face direction
        const scaleX = playerGridPos.x < 0 ? -1 : 1;
        playerEl.querySelector('.chicken-model').style.transform = `scaleX(${scaleX})`;
    }

    function updateCamera() {
        // Target Y based on player position
        const targetBottom = (playerGridPos.y * LANE_HEIGHT) + 15;
        // Keep player roughly 40% from bottom of screen
        const desiredBoardY = - (targetBottom - 400); 

        // Smooth Lerp
        cameraY += (desiredBoardY - cameraY) * 0.1;
        
        // Apply transform
        // Base translateZ is -200
        world.style.transform = `rotateX(30deg) translateY(${50 + cameraY}px) translateZ(-200px)`;
    }

    function gameOver() {
        isGameOver = true;
        playerEl.style.filter = 'grayscale(100%) brightness(0.5)';
        playerEl.querySelector('.chicken-model').style.transform = 'rotate(90deg) translateY(20px)';
        
        if (score > bestScore) {
            bestScore = score;
            bestEl.innerText = bestScore;
        }

        const overlay = document.createElement('div');
        overlay.className = 'overlay';
        overlay.innerHTML = `
            <h1>SPLAT!</h1>
            <p style="font-size: 24px; font-weight: bold; margin-top:10px;">Score: ${score}</p>
            <button onclick="resetGame()">Try Again</button>
        `;
        document.body.appendChild(overlay);
    }

    window.resetGame = function() {
        isGameOver = false;
        score = 0;
        scoreEl.innerText = '0';
        playerGridPos = { x: 0, y: 2 };
        cameraY = 0;
        
        world.innerHTML = '';
        lanes = [];
        
        playerEl.style.filter = 'none';
        playerEl.querySelector('.chicken-model').style.transform = 'scaleX(1)';
        
        const overlay = document.querySelector('.overlay');
        if(overlay) overlay.remove();
        
        init();
    };

    // --- INPUT ---
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp') movePlayer(0, 1);
        if (e.key === 'ArrowDown') movePlayer(0, -1);
        if (e.key === 'ArrowLeft') movePlayer(-1, 0);
        if (e.key === 'ArrowRight') movePlayer(1, 0);
    });

    // Start
    init();

</script>
</body>
</html>
