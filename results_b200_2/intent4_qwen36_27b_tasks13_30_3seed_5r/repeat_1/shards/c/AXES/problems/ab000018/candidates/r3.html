<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crossy Road: Visual Revision</title>
<style>
    :root {
        /* Palette: Vibrant, Low Poly */
        --sky-top: #2980b9;
        --sky-bottom: #6dd5fa;
        --grass-top: #a8e063;
        --grass-side: #56ab2f;
        --road-top: #7f8c8d;
        --road-side: #34495e;
        --water-top: #3498db;
        --water-side: #2980b9;
        --ui-bg: #fff;
        --ui-text: #2c3e50;
        --ui-shadow: #bdc3c7;
    }

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }

    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 60%, #fff 100%);
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* --- 3D SCENE SETUP --- */
    #scene {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        /* Stronger Perspective */
        perspective: 1000px; 
    }

    /* --- HUD: FLAT 2.5D UNIFIED --- */
    .hud {
        position: absolute;
        top: 30px;
        left: 30px;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 15px;
        pointer-events: none;
    }

    .hud-item {
        background: var(--ui-bg);
        padding: 10px 20px 14px 20px;
        border-radius: 12px;
        /* Single direction drop shadow */
        box-shadow: 6px 6px 0px var(--ui-shadow);
        color: var(--ui-text);
        text-align: center;
        min-width: 120px;
        border: 2px solid #ecf0f1;
    }

    .hud-label {
        display: block;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #7f8c8d;
        margin-bottom: 2px;
    }

    .hud-value {
        font-size: 28px;
        font-weight: 900;
        line-height: 1;
        color: var(--ui-text);
    }

    /* --- GAME WORLD CONTAINER --- */
    #world {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        transform-style: preserve-3d;
        /* 
           Isometric Tilt: 
           RotateX 25deg: Standard 3/4 view
           TranslateZ -300px: Pushes grid back to create horizon depth
           RotateY 0: Straight on
        */
        transform: rotateX(25deg) translateY(-50px) translateZ(-300px);
        transition: transform 0.1s linear;
    }

    /* --- LANES: 3D BLOCKS --- */
    .lane {
        width: 100%;
        height: 100px;
        position: absolute;
        left: 0;
        transform-style: preserve-3d;
    }

    .lane-surface {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0; left: 0;
        transform: translateZ(0);
    }

    .lane-side {
        position: absolute;
        width: 100%;
        height: 20px; /* Increased thickness for Low Poly look */
        bottom: 0; left: 0;
        transform-origin: bottom;
        transform: rotateX(-90deg);
        z-index: -1;
    }

    /* Grass Texture */
    .lane.grass .lane-surface {
        background-color: var(--grass-top);
        /* CSS Pattern for texture */
        background-image: radial-gradient(var(--grass-side) 15%, transparent 16%);
        background-size: 40px 40px;
    }
    .lane.grass .lane-side { background-color: var(--grass-side); }

    /* Road Texture */
    .lane.road .lane-surface {
        background-color: var(--road-top);
        background-image: linear-gradient(90deg, transparent 48%, #ecf0f1 49%, #ecf0f1 51%, transparent 52%);
        background-size: 120px 100%; /* Dashed lines */
        background-repeat: repeat-x;
    }
    .lane.road .lane-side { background-color: var(--road-side); }

    /* Water Texture */
    .lane.water .lane-surface {
        background-color: var(--water-top);
        opacity: 0.95;
        background-image: linear-gradient(0deg, transparent 50%, rgba(255,255,255,0.2) 50%);
        background-size: 100% 20px;
    }
    .lane.water .lane-side { background-color: var(--water-side); }

    /* --- OBJECTS (CSS ART) --- */

    /* Car Base */
    .car-container {
        position: absolute;
        top: 10px;
        width: 110px;
        height: 60px;
        transform-style: preserve-3d;
        transition: transform 0.1s linear;
        z-index: 10;
    }
    
    /* Shadow */
    .car-container::before {
        content: '';
        position: absolute;
        bottom: -10px; left: 5px;
        width: 100px; height: 20px;
        background: rgba(0,0,0,0.3);
        border-radius: 50%;
        filter: blur(3px);
        transform: translateZ(1px);
    }

    .car-body {
        position: absolute;
        bottom: 10px;
        width: 100%;
        height: 35px;
        background: #e74c3c; /* Vibrant Red */
        border-radius: 6px;
        /* Low poly bevel */
        box-shadow: inset 0 5px 0 rgba(255,255,255,0.2), 0 5px 0 #c0392b; 
        z-index: 2;
    }
    
    .car-top {
        position: absolute;
        bottom: 40px;
        left: 15px;
        width: 60px;
        height: 35px;
        background: #e74c3c;
        border-radius: 8px 8px 0 0;
        box-shadow: inset 0 5px 0 rgba(255,255,255,0.2), 0 5px 0 #c0392b;
        z-index: 1;
    }
    
    .car-window {
        position: absolute;
        top: 5px; left: 5px; right: 5px; bottom: 5px;
        background: #3498db;
        border-radius: 4px 4px 0 0;
        opacity: 0.8;
    }

    .car-wheel {
        position: absolute;
        bottom: 5px;
        width: 20px;
        height: 20px;
        background: #2c3e50;
        border-radius: 50%;
        border: 2px solid #95a5a6;
        z-index: 3;
    }
    .car-wheel.left { left: 12px; }
    .car-wheel.right { right: 12px; }

    /* Truck Variant */
    .car-container.truck .car-body { background: #f1c40f; box-shadow: inset 0 5px 0 rgba(255,255,255,0.2), 0 5px 0 #f39c12; height: 35px; bottom: 10px; }
    .car-container.truck .car-top { background: #f1c40f; width: 50px; left: 50px; border-radius: 4px; bottom: 40px; height: 40px;}
    .car-container.truck .car-window { top: 5px; left: 5px; right: 5px; bottom: 5px; border-radius: 4px; }

    /* Log */
    .log-container {
        position: absolute;
        top: 15px;
        width: 140px;
        height: 40px;
        transform-style: preserve-3d;
        transition: transform 0.1s linear;
        z-index: 10;
    }
    
    .log-body {
        width: 100%;
        height: 40px;
        background: #d35400;
        border-radius: 4px;
        box-shadow: 0 6px 0 #a04000;
        position: relative;
        border: 2px solid #873600;
    }
    /* Wood rings */
    .log-body::after {
        content: '';
        position: absolute;
        right: -5px; top: -5px; bottom: -5px;
        width: 30px;
        background: repeating-linear-gradient(45deg, rgba(0,0,0,0.1), rgba(0,0,0,0.1) 2px, transparent 2px, transparent 6px);
        border-radius: 50%;
        border: 2px solid #873600;
    }

    /* Tree (Obstacle) */
    .tree-container {
        position: absolute;
        width: 0; height: 0;
        transform-style: preserve-3d;
        top: 10px;
        z-index: 5;
    }
    .tree-trunk {
        position: absolute;
        bottom: 0; left: -10px;
        width: 20px; height: 40px;
        background: #795548;
        box-shadow: 5px 0 0 #5d4037;
    }
    .tree-top {
        position: absolute;
        bottom: 30px; left: -45px;
        width: 90px; height: 90px;
        background: #27ae60;
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2));
    }
    /* Tree highlight */
    .tree-top::after {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, transparent 50%);
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    }

    /* --- PLAYER (Low Poly Chicken) --- */
    #player {
        position: absolute;
        width: 80px;
        height: 80px;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 50;
        transition: bottom 0.15s ease-out, left 0.15s ease-out;
        filter: drop-shadow(0 15px 5px rgba(0,0,0,0.3));
    }

    .chicken-model {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        animation: hopIdle 0.6s infinite alternate ease-in-out;
    }

    .ch-body {
        position: absolute;
        bottom: 0;
        left: 15px;
        width: 50px;
        height: 50px;
        background: #FFF;
        border-radius: 50% 50% 40% 40%;
        border: 3px solid #ecf0f1;
        box-shadow: inset -5px -5px 0 rgba(0,0,0,0.05);
        z-index: 2;
    }

    .ch-head {
        position: absolute;
        bottom: 35px;
        left: 35px;
        width: 35px;
        height: 35px;
        background: #FFF;
        border-radius: 50%;
        border: 3px solid #ecf0f1;
        z-index: 3;
    }

    .ch-comb {
        position: absolute;
        top: -10px; left: 5px;
        width: 25px; height: 15px;
        background: #e74c3c;
        border-radius: 5px 5px 0 0;
        clip-path: polygon(0% 100%, 20% 0%, 40% 100%, 60% 0%, 80% 100%, 100% 0%);
    }

    .ch-eye {
        position: absolute;
        top: 10px; right: 8px;
        width: 6px; height: 8px;
        background: #2c3e50;
        border-radius: 50%;
    }

    .ch-beak {
        position: absolute;
        top: 15px; right: -5px;
        width: 0; height: 0;
        border-top: 4px solid transparent;
        border-bottom: 4px solid transparent;
        border-left: 10px solid #f1c40f;
    }

    .ch-wing {
        position: absolute;
        bottom: 15px; left: 15px;
        width: 30px; height: 20px;
        background: #ecf0f1;
        border-radius: 50%;
        border: 2px solid #bdc3c7;
        z-index: 4;
        transform: rotate(-10deg);
    }

    .ch-leg {
        position: absolute;
        bottom: -8px;
        width: 6px; height: 12px;
        background: #f1c40f;
        z-index: 1;
    }
    .ch-leg.left { left: 25px; }
    .ch-leg.right { left: 40px; }

    @keyframes hopIdle {
        0% { transform: translateY(0) scaleY(1); }
        100% { transform: translateY(-5px) scaleY(1.05); }
    }

    /* --- CONTROLS: INTEGRATED WOOD STONE --- */
    .controls {
        position: absolute;
        bottom: 30px;
        left: 30px; /* Bottom Left for Balance */
        width: 160px;
        height: 160px;
        z-index: 200;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 1fr 1fr 1fr;
        gap: 10px;
    }

    .d-btn {
        background: #ecf0f1;
        border-bottom: 6px solid #bdc3c7;
        border-radius: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 0.1s;
        position: relative;
    }

    .d-btn:active {
        transform: translateY(6px);
        border-bottom-width: 0px;
    }

    .d-btn svg {
        width: 28px;
        height: 28px;
        fill: #7f8c8d;
        filter: drop-shadow(1px 1px 0 rgba(255,255,255,0.5));
    }

    .d-up { grid-column: 2; grid-row: 1; }
    .d-left { grid-column: 1; grid-row: 2; }
    .d-right { grid-column: 3; grid-row: 2; }
    .d-down { grid-column: 2; grid-row: 3; }

    /* Clouds */
    .cloud {
        position: absolute;
        background: #fff;
        border-radius: 50px;
        opacity: 0.9;
        filter: blur(1px);
        animation: float linear infinite;
    }
    .cloud::after, .cloud::before {
        content: ''; position: absolute; background: #fff; border-radius: 50%;
    }
    .cloud::after { width: 40%; height: 100%; top: -50%; left: 15%; }
    .cloud::before { width: 30%; height: 80%; top: -30%; right: 15%; }

    @keyframes float {
        from { transform: translateX(-200px); }
        to { transform: translateX(100vw); }
    }
    
    /* Game Over Overlay */
    .overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(44, 62, 80, 0.8);
        z-index: 999;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        color: #FFF;
        backdrop-filter: blur(5px);
    }
    
    .overlay h1 {
        font-size: 60px;
        margin: 0;
        color: #e74c3c;
        text-shadow: 4px 4px 0 #c0392b;
        font-weight: 900;
        transform: rotate(-5deg);
    }

    .overlay button {
        margin-top: 30px;
        padding: 15px 40px;
        font-size: 24px;
        font-weight: bold;
        background: #f1c40f;
        border: none;
        border-bottom: 6px solid #f39c12;
        border-radius: 10px;
        cursor: pointer;
        color: #2c3e50;
    }
    .overlay button:active {
        transform: translateY(6px);
        border-bottom: 0;
    }

</style>
</head>
<body>

<div id="scene">
    <!-- HUD -->
    <div class="hud">
        <div class="hud-item">
            <span class="hud-label">Score</span>
            <span class="hud-value" id="score">0</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">Best</span>
            <span class="hud-value" id="best">12</span>
        </div>
    </div>

    <!-- BACKGROUND -->
    <div class="cloud" style="top: 10%; left: -10%; width: 120px; height: 50px; animation-duration: 45s;"></div>
    <div class="cloud" style="top: 25%; left: -20%; width: 160px; height: 60px; animation-duration: 35s; animation-delay: -15s;"></div>
    <div class="cloud" style="top: 5%; left: -40%; width: 140px; height: 55px; animation-duration: 55s; animation-delay: -5s;"></div>

    <!-- GAME WORLD -->
    <div id="world">
        <!-- Generated via JS -->
    </div>

    <!-- PLAYER -->
    <div id="player">
        <div class="chicken-model">
            <div class="ch-head">
                <div class="ch-comb"></div>
                <div class="ch-eye"></div>
                <div class="ch-beak"></div>
            </div>
            <div class="ch-body"></div>
            <div class="ch-wing"></div>
            <div class="ch-leg left"></div>
            <div class="ch-leg right"></div>
        </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <div class="d-btn d-up" onclick="movePlayer(0, 1)">
            <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h6v8h4v-8h6z"/></svg>
        </div>
        <div class="d-btn d-down" onclick="movePlayer(0, -1)">
            <svg viewBox="0 0 24 24"><path d="M12 20l8-8h-6V4h-4v8H4z"/></svg>
        </div>
        <div class="d-btn d-left" onclick="movePlayer(-1, 0)">
            <svg viewBox="0 0 24 24"><path d="M4 12l8-8v6h8v4h-8v6z"/></svg>
        </div>
        <div class="d-btn d-right" onclick="movePlayer(1, 0)">
            <svg viewBox="0 0 24 24"><path d="M20 12l-8-8v6H4v4h8v6z"/></svg>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    const LANE_HEIGHT = 100; 
    const START_LANES = 15;
    const GRID_WIDTH_PX = 80; // Width of one grid unit on screen
    
    // --- STATE ---
    let score = 0;
    let bestScore = 12;
    let playerGridPos = { x: 0, y: 2 };
    let lanes = [];
    let gameLoopId;
    let isGameOver = false;
    let cameraY = 0;

    // --- ELEMENTS ---
    const world = document.getElementById('world');
    const playerEl = document.getElementById('player');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');

    // --- INITIALIZATION ---
    function init() {
        // Initial clear
        world.innerHTML = '';
        lanes = [];
        
        for (let i = 0; i < START_LANES; i++) {
            addLane(-i);
        }
        updatePlayerVisuals();
        gameLoop();
    }

    // --- LANE GENERATION ---
    function addLane(index) {
        let type = 'grass';
        const absIndex = Math.abs(index);
        
        // Procedural Generation
        if (absIndex > 2) {
            const r = Math.random();
            if (r < 0.4) type = 'road';
            else if (r < 0.6) type = 'water';
            else type = 'grass';
        }

        const lane = document.createElement('div');
        lane.className = `lane ${type}`;
        lane.dataset.index = index;
        lane.style.bottom = (index * LANE_HEIGHT) + 'px';
        
        // 3D Structure
        const surface = document.createElement('div');
        surface.className = 'lane-surface';
        const side = document.createElement('div');
        side.className = 'lane-side';
        lane.appendChild(surface);
        lane.appendChild(side);

        // Add Content
        let content = null;
        let speed = 0;
        let xPos = 0;

        if (type === 'road') {
            const isTruck = Math.random() > 0.7;
            const car = document.createElement('div');
            car.className = `car-container ${isTruck ? 'truck' : ''}`;
            car.innerHTML = `
                <div class="car-body"></div>
                <div class="car-top"><div class="car-window"></div></div>
                <div class="car-wheel left"></div>
                <div class="car-wheel right"></div>
            `;
            speed = (3 + Math.random() * 4) * (Math.random() > 0.5 ? 1 : -1);
            xPos = speed > 0 ? -150 : 120; 
            lane.appendChild(car);
            content = car;
        } else if (type === 'water') {
            const log = document.createElement('div');
            log.className = 'log-container';
            log.innerHTML = `<div class="log-body"></div>`;
            speed = (1.5 + Math.random() * 2) * (Math.random() > 0.5 ? 1 : -1);
            xPos = speed > 0 ? -180 : 120;
            lane.appendChild(log);
            content = log;
        } else if (type === 'grass') {
            if (Math.random() > 0.6) {
                const tree = document.createElement('div');
                tree.className = 'tree-container';
                tree.innerHTML = `<div class="tree-trunk"></div><div class="tree-top"></div>`;
                tree.style.left = (Math.random() * 80 + 10) + '%';
                lane.appendChild(tree);
            }
        }

        world.appendChild(lane);

        lanes.push({
            element: lane,
            type: type,
            index: index,
            content: content,
            speed: speed,
            x: xPos,
            width: type === 'water' ? 140 : (content && content.classList.contains('truck') ? 120 : 110)
        });
    }

    // --- GAME LOOP ---
    function gameLoop() {
        if (isGameOver) return;

        // Move objects
        lanes.forEach(l => {
            if (l.content) {
                l.x += l.speed;
                // Wrap logic
                if (l.speed > 0 && l.x > 120) l.x = -150;
                if (l.speed < 0 && l.x < -150) l.x = 120;
                
                // Apply transform
                l.content.style.transform = `translate3d(${l.x}%, 0, 0)`;
            }
        });

        checkCollisions();
        updateCamera();

        requestAnimationFrame(gameLoop);
    }

    function checkCollisions() {
        const currentLaneObj = lanes.find(l => l.index === playerGridPos.y);
        if (!currentLaneObj) return;

        // Player X in percentage of lane width
        // Grid X: -5 to 5. Center is 0.
        // Map to 0-100%.
        // Screen width center is 50%. Each step is roughly 8% (adjusted for visual width)
        const playerPct = 50 + (playerGridPos.x * 8); 
        const playerWidth = 8; // Approx visual width in %

        if (currentLaneObj.type === 'water') {
            if (currentLaneObj.content) {
                const logPct = currentLaneObj.x;
                const logWidth = 140; // Visual width
                const laneWidthPx = window.innerWidth;
                const logWidthPct = (logWidth / laneWidthPx) * 100;

                // Check overlap
                if (playerPct > logPct - 2 && playerPct < logPct + logWidthPct + 2) {
                    // Riding log
                    // Calculate grid movement based on log speed relative to screen width
                    const gridSpeed = (currentLaneObj.speed / window.innerWidth) * 100 * 0.125;
                    playerGridPos.x += gridSpeed * 3; 
                    updatePlayerVisuals();
                } else {
                    gameOver();
                }
            } else {
                gameOver(); // Water with no log
            }
        } else if (currentLaneObj.type === 'road') {
            if (currentLaneObj.content) {
                const carPct = currentLaneObj.x;
                const carWidth = currentLaneObj.width;
                const laneWidthPx = window.innerWidth;
                const carWidthPct = (carWidth / laneWidthPx) * 100;

                if (playerPct > carPct - 2 && playerPct < carPct + carWidthPct + 2) {
                    gameOver();
                }
            }
        }
    }

    // --- MOVEMENT ---
    window.movePlayer = function(dx, dy) {
        if (isGameOver) return;

        // Prevent moving into bounds
        const newX = playerGridPos.x + dx;
        if (newX > 5 || newX < -5) return;

        playerGridPos.x = newX;
        playerGridPos.y += dy;

        updatePlayerVisuals();

        if (dy > 0) {
            score++;
            scoreEl.innerText = score;
            // Spawn new lane
            addLane(-lanes.length);
            
            // Cleanup old lanes
            lanes = lanes.filter(l => {
                if (l.index < playerGridPos.y - 5) {
                    l.element.remove();
                    return false;
                }
                return true;
            });
        }
    };

    function updatePlayerVisuals() {
        // Map Grid to CSS
        const bottomPx = (playerGridPos.y * LANE_HEIGHT) + 15;
        const leftPct = 50 + (playerGridPos.x * 8); 

        playerEl.style.bottom = bottomPx + 'px';
        playerEl.style.left = leftPct + '%';
        
        // Face direction
        const scaleX = playerGridPos.x < 0 ? -1 : 1;
        playerEl.querySelector('.chicken-model').style.transform = `scaleX(${scaleX})`;
    }

    function updateCamera() {
        // Smoothly interpolate camera Y
        const targetBottom = (playerGridPos.y * LANE_HEIGHT) + 15;
        // Keep player roughly 30% from bottom of screen
        const desiredBoardY = - (targetBottom - 300); 

        // Lerp
        cameraY += (desiredBoardY - cameraY) * 0.1;
        
        // Apply transform
        // -300 is the base Z-offset for perspective
        world.style.transform = `rotateX(25deg) translateY(${-50 + cameraY}px) translateZ(-300px)`;
    }

    function gameOver() {
        isGameOver = true;
        playerEl.style.filter = 'grayscale(100%) brightness(0.5)';
        playerEl.querySelector('.chicken-model').style.transform = 'rotate(90deg) translateY(20px)';
        
        if (score > bestScore) {
            bestScore = score;
            bestEl.innerText = bestScore;
        }

        const overlay = document.createElement('div');
        overlay.className = 'overlay';
        overlay.innerHTML = `
            <h1>SPLAT!</h1>
            <p style="font-size: 24px; font-weight: bold;">Score: ${score}</p>
            <button onclick="resetGame()">Try Again</button>
        `;
        document.body.appendChild(overlay);
    }

    window.resetGame = function() {
        isGameOver = false;
        score = 0;
        scoreEl.innerText = '0';
        playerGridPos = { x: 0, y: 2 };
        cameraY = 0;
        
        // Clear DOM
        world.innerHTML = '';
        lanes = [];
        
        // Reset Player
        playerEl.style.filter = 'none';
        playerEl.querySelector('.chicken-model').style.transform = 'scaleX(1)';
        
        // Remove overlay
        const overlay = document.querySelector('.overlay');
        if(overlay) overlay.remove();
        
        init();
    };

    // --- INPUT ---
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp') movePlayer(0, 1);
        if (e.key === 'ArrowDown') movePlayer(0, -1);
        if (e.key === 'ArrowLeft') movePlayer(-1, 0);
        if (e.key === 'ArrowRight') movePlayer(1, 0);
    });

    // Start
    init();

</script>
</body>
</html>
