<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TACTICAL // AI SIMULATION</title>
<style>
  :root {
    --bg-deep: #050505;
    --bg-panel: rgba(10, 12, 16, 0.85);
    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-highlight: rgba(255, 255, 255, 0.15);
    
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
    --text-dim: #475569;
    
    --sys-blue: #0ea5e9;
    --sys-cyan: #06b6d4;
    --sys-red: #ef4444;
    --sys-orange: #f97316;
    --sys-yellow: #eab308;
    --sys-green: #22c55e;
    
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-deep);
    color: var(--text-primary);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 320px;
    grid-template-rows: 1fr;
    user-select: none;
  }

  /* CANVAS AREA - Full immersion */
  main {
    position: relative;
    background-color: var(--bg-deep);
    overflow: hidden;
    cursor: crosshair;
    z-index: 1;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* HUD OVERLAYS - Floating directly on canvas */
  
  /* Top Left: Interaction & Title */
  .hud-header {
    position: absolute;
    top: 24px;
    left: 24px;
    pointer-events: none;
    z-index: 5;
  }
  
  .hud-title {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: 0.1em;
    margin-bottom: 4px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .hud-subtitle {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-secondary);
    background: rgba(0,0,0,0.4);
    padding: 4px 8px;
    border: 1px solid var(--border-subtle);
    display: inline-block;
  }

  /* Top Right: Player Status (Floating HUD) */
  .hud-player {
    position: absolute;
    top: 24px;
    right: 344px; /* Offset from sidebar */
    width: 200px;
    pointer-events: none;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .hud-card {
    background: rgba(5, 5, 5, 0.6);
    backdrop-filter: blur(4px);
    border: 1px solid var(--border-subtle);
    border-left: 2px solid var(--sys-blue);
    padding: 12px;
    position: relative;
  }

  /* Corner accents */
  .hud-card::after {
    content: '';
    position: absolute;
    bottom: -1px; right: -1px;
    width: 6px; height: 6px;
    border-bottom: 1px solid var(--sys-blue);
    border-right: 1px solid var(--sys-blue);
  }

  .hud-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 10px;
    margin-bottom: 2px;
  }

  .hud-label {
    color: var(--text-secondary);
    font-family: var(--font-mono);
    text-transform: uppercase;
  }

  .hud-val {
    font-family: var(--font-mono);
    color: var(--text-primary);
    font-weight: 700;
  }

  .hud-val.highlight { color: var(--sys-blue); }
  .hud-val.danger { color: var(--sys-red); text-shadow: 0 0 5px var(--sys-red); }

  /* Bottom Center: Instructions */
  .hud-footer {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
    z-index: 5;
    text-align: center;
  }

  .instruction-pill {
    background: rgba(0,0,0,0.6);
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 6px 16px;
    border-radius: 100px;
    backdrop-filter: blur(4px);
    letter-spacing: 0.05em;
  }

  /* SIDEBAR - Inspector Panel */
  aside {
    background: #0b0f14;
    border-left: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    padding: 24px;
    gap: 32px;
    overflow-y: auto;
    z-index: 10;
    box-shadow: -5px 0 20px rgba(0,0,0,0.5);
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel-header {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
  .panel-header::before {
    content: '';
    display: block;
    width: 4px; height: 4px;
    background: var(--text-dim);
    border-radius: 1px;
  }

  /* CONTROLS - Ghost Buttons */
  .layer-controls {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .ghost-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-secondary);
    padding: 10px 12px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .ghost-btn:hover {
    background: rgba(255,255,255,0.03);
    color: var(--text-primary);
  }

  .ghost-btn.active {
    background: rgba(255,255,255,0.05);
    color: var(--text-primary);
    border-color: var(--border-subtle);
  }

  .ghost-btn .indicator {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: 0.2s;
  }

  .ghost-btn.active .indicator {
    background: var(--sys-cyan);
    box-shadow: 0 0 5px var(--sys-cyan);
  }

  /* LEGEND - Data Readout Style */
  .legend-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .legend-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-primary);
    position: relative;
    padding-left: 12px;
  }

  /* Vertical line connector */
  .legend-item::before {
    content: '';
    position: absolute;
    left: 0; top: 2px;
    width: 2px; height: 100%;
    background: var(--border-subtle);
  }

  .legend-dot {
    width: 6px; height: 6px;
    margin-bottom: 4px;
    border-radius: 1px;
    box-shadow: 0 0 8px currentColor;
  }

  .legend-desc {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-secondary);
    font-weight: 400;
  }

  /* RESET BUTTON */
  .btn-reset {
    background: rgba(239, 68, 68, 0.05);
    color: var(--sys-red);
    border: 1px solid rgba(239, 68, 68, 0.2);
    padding: 12px;
    border-radius: 4px;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: all 0.2s;
    width: 100%;
    margin-top: auto;
    text-align: center;
  }

  .btn-reset:hover { 
    background: var(--sys-red);
    color: #fff;
    box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
  }

</style>
</head>
<body>

<main id="canvas-container">
  <canvas id="simCanvas"></canvas>
  
  <!-- HUD: Header & Instructions -->
  <div class="hud-header">
    <div class="hud-title">
      <div style="width:8px; height:8px; background:var(--sys-cyan); box-shadow:0 0 5px var(--sys-cyan)"></div>
      TACTICAL AI // SIMULATION
    </div>
    <div class="hud-subtitle">
      MOUSE: PILOT &bull; CLICK: PING
    </div>
  </div>

  <!-- HUD: Player Status (Floating) -->
  <div class="hud-player">
    <div class="hud-card">
      <div class="hud-row">
        <span class="hud-label">Unit Status</span>
        <span class="hud-val highlight">OPERATIONAL</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">Integrity</span>
        <span class="hud-val">100%</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">Threat Level</span>
        <span class="hud-val" id="hud-threat">LOW</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">Coordinates</span>
        <span class="hud-val" id="hud-pos">000, 000</span>
      </div>
    </div>
  </div>

  <!-- HUD: Footer -->
  <div class="hud-footer">
    <div class="instruction-pill">
      SIMULATION ACTIVE &bull; TRACKING ENABLED
    </div>
  </div>
</main>

<aside>
  <!-- LAYER CONTROLS -->
  <div class="panel-section">
    <div class="panel-header">Visualization Layers</div>
    <div class="layer-controls">
      <button class="ghost-btn active" onclick="toggleLayer('paths')">
        <span>Pathfinding Vectors</span>
        <div class="indicator"></div>
      </button>
      <button class="ghost-btn active" onclick="toggleLayer('fov')">
        <span>Detection Cones</span>
        <div class="indicator"></div>
      </button>
      <button class="ghost-btn active" onclick="toggleLayer('range')">
        <span>Engagement Range</span>
        <div class="indicator"></div>
      </button>
    </div>
  </div>

  <!-- LEGEND -->
  <div class="panel-section">
    <div class="panel-header">AI State Protocol</div>
    <div class="legend-grid">
      <div class="legend-item" style="color: var(--sys-green)">
        <div class="legend-dot" style="background: var(--sys-green); color: var(--sys-green)"></div>
        <span>PATROL</span>
        <span class="legend-desc">Routine Sweep</span>
      </div>
      <div class="legend-item" style="color: var(--sys-yellow)">
        <div class="legend-dot" style="background: var(--sys-yellow); color: var(--sys-yellow)"></div>
        <span>ALERT</span>
        <span class="legend-desc">Investigating</span>
      </div>
      <div class="legend-item" style="color: var(--sys-orange)">
        <div class="legend-dot" style="background: var(--sys-orange); color: var(--sys-orange)"></div>
        <span>CHASE</span>
        <span class="legend-desc">Intercepting</span>
      </div>
      <div class="legend-item" style="color: var(--sys-red)">
        <div class="legend-dot" style="background: var(--sys-red); color: var(--sys-red)"></div>
        <span>ATTACK</span>
        <span class="legend-desc">Engaging</span>
      </div>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="panel-section" style="margin-top: auto;">
    <button class="btn-reset" onclick="resetSimulation()">
      Reset Simulation
    </button>
  </div>
</aside>

<script>
/**
 * TACTICAL AI SIMULATION ENGINE v2.0
 * Focus: Visual clarity, "Sensor" aesthetic, State demonstration.
 */

const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const hudPos = document.getElementById('hud-pos');
const hudThreat = document.getElementById('hud-threat');

// Configuration
const CONFIG = {
  colors: {
    bg: '#050505',
    grid: 'rgba(255, 255, 255, 0.03)', // Very low opacity per critique
    wall: '#0f131a',
    wallStroke: '#1e2533',
    player: '#0ea5e9', 
    playerGlow: '#0284c7',
    states: {
      PATROL: '#22c55e',
      ALERT: '#eab308',
      CHASE: '#f97316',
      ATTACK: '#ef4444'
    }
  },
  enemyCount: 6,
  wallCount: 10
};

// State
let width, height;
let lastTime = 0;
let mouse = { x: 0, y: 0 };
let walls = [];
let enemies = [];
let particles = [];
let time = 0;

// Layers
const layers = {
  paths: true,
  fov: true,
  range: true
};

// --- UTILS ---
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const lerp = (a, b, t) => a + (b - a) * t;
const angleTo = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);
const normalizeAngle = (angle) => {
  let a = angle;
  while (a <= -Math.PI) a += Math.PI*2;
  while (a > Math.PI) a -= Math.PI*2;
  return a;
};

// Line segment intersection for LOS
function getIntersection(A, B, C, D) {
  const tTop = (D.x - C.x) * (A.y - C.y) - (D.y - C.y) * (A.x - C.x);
  const uTop = (C.y - A.y) * (A.x - B.x) - (C.x - A.x) * (A.y - B.y);
  const bottom = (D.y - C.y) * (B.x - A.x) - (D.x - C.x) * (B.y - A.y);

  if (bottom !== 0) {
    const t = tTop / bottom;
    const u = uTop / bottom;
    if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
      return { x: lerp(A.x, B.x, t), y: lerp(A.y, B.y, t), offset: t }
    }
  }
  return null;
}

// --- CLASSES ---

class Wall {
  constructor(x, y, w, h) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.segments = [
      {x1: x, y1: y, x2: x + w, y2: y},
      {x1: x + w, y1: y, x2: x + w, y2: y + h},
      {x1: x + w, y1: y + h, x2: x, y2: y + h},
      {x1: x, y1: y + h, x2: x, y2: y}
    ];
  }

  draw(ctx) {
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(this.x + 4, this.y + 4, this.w, this.h);
    
    // Main body (Darker)
    ctx.fillStyle = CONFIG.colors.wall;
    ctx.fillRect(this.x, this.y, this.w, this.h);
    
    // Border
    ctx.strokeStyle = CONFIG.colors.wallStroke;
    ctx.lineWidth = 1;
    ctx.strokeRect(this.x, this.y, this.w, this.h);
    
    // Tech detail (Subtle grid inside wall)
    ctx.save();
    ctx.beginPath();
    ctx.rect(this.x, this.y, this.w, this.h);
    ctx.clip();
    ctx.strokeStyle = 'rgba(255,255,255,0.02)';
    ctx.lineWidth = 1;
    for(let i=this.x; i<this.x+this.w; i+=10) {
      ctx.moveTo(i, this.y); ctx.lineTo(i, this.y+this.h);
    }
    for(let i=this.y; i<this.y+this.h; i+=10) {
      ctx.moveTo(this.x, i); ctx.lineTo(this.x+this.w, i);
    }
    ctx.stroke();
    ctx.restore();
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.color = color;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 2 + 0.5;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 1.0;
    this.decay = 0.03 + Math.random() * 0.04;
    this.size = Math.random() * 2 + 0.5;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.92;
    this.vy *= 0.92;
    this.life -= this.decay;
  }
  draw(ctx) {
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Enemy {
  constructor(id) {
    this.id = id;
    // Random spawn avoiding center
    let safe = false;
    while(!safe) {
      this.x = Math.random() * (width - 100) + 50;
      this.y = Math.random() * (height - 100) + 50;
      if(dist(this.x, this.y, width/2, height/2) > 200) safe = true;
    }
    
    this.radius = 8;
    this.angle = Math.random() * Math.PI * 2;
    this.speed = 0.8 + Math.random() * 0.6; // Slightly slower for better tracking visualization
    
    // AI State
    this.state = 'PATROL'; 
    this.targetX = this.x;
    this.targetY = this.y;
    
    // Waypoints
    this.waypoints = [];
    this.currentWaypointIndex = 0;
    this.generateWaypoints();

    // Properties
    this.viewDistance = 280;
    this.viewAngle = Math.PI / 3.5; 
    this.attackRange = 100;
    
    this.alertTimer = 0;
    this.alertTarget = {x: 0, y: 0};
    
    // Visuals
    this.pathPoints = []; 
    this.pulse = Math.random() * 100;
    
    // Text label animation
    this.labelOpacity = 0;
  }

  generateWaypoints() {
    this.waypoints = [];
    for(let i=0; i<4; i++) {
      this.waypoints.push({
        x: Math.random() * (width - 100) + 50,
        y: Math.random() * (height - 100) + 50
      });
    }
  }

  update(player, walls) {
    const dToPlayer = dist(this.x, this.y, player.x, player.y);
    const angleToPlayer = angleTo(this.x, this.y, player.x, player.y);
    
    let angleDiff = normalizeAngle(angleToPlayer - this.angle);
    
    // Check Vision
    const inFOV = Math.abs(angleDiff) < this.viewAngle / 2;
    const canSee = dToPlayer < this.viewDistance && inFOV && this.hasLineOfSight(player.x, player.y, walls);

    // State Machine
    if (this.state === 'PATROL') {
      if (canSee) {
        this.state = 'CHASE';
      } else {
        this.patrol();
      }
    } 
    else if (this.state === 'ALERT') {
      this.alertTimer--;
      // Move to alert location
      if (dist(this.x, this.y, this.alertTarget.x, this.alertTarget.y) < 5) {
        // Arrived, wait a bit then patrol
        this.alertTimer -= 10; 
        if (this.alertTimer < 0) this.state = 'PATROL';
      } else {
        this.moveTowards(this.alertTarget.x, this.alertTarget.y);
      }
      
      // If spotted during alert
      if (canSee) this.state = 'CHASE';

    }
    else if (this.state === 'CHASE') {
      if (!canSee) {
        this.state = 'ALERT';
        this.alertTimer = 300; // 5 seconds
        this.alertTarget = {x: player.x, y: player.y};
      } else {
        if (dToPlayer < this.attackRange) {
          this.state = 'ATTACK';
        } else {
          this.moveTowards(player.x, player.y);
          this.pathPoints = [{x: this.x, y: this.y}, {x: player.x, y: player.y}];
        }
      }
    }
    else if (this.state === 'ATTACK') {
      if (dToPlayer > this.viewDistance * 1.2) {
        this.state = 'CHASE';
      } else {
        // Focus player
        this.angle = lerp(this.angle, angleToPlayer, 0.15);
        // Fire
        if (Math.random() < 0.1) this.shoot(player.x, player.y);
        this.pathPoints = [{x: this.x, y: this.y}, {x: player.x, y: player.y}];
      }
    }
    
    // Boundary clamp
    this.x = Math.max(20, Math.min(width - 20, this.x));
    this.y = Math.max(20, Math.min(height - 20, this.y));
    
    this.pulse += 0.1;
    
    // Fade in label on state change (simplified here to just pulse)
    this.labelOpacity = 0.7 + Math.sin(this.pulse * 2) * 0.3;
  }

  hasLineOfSight(tx, ty, walls) {
    const p1 = {x: this.x, y: this.y};
    const p2 = {x: tx, y: ty};
    
    for (let w of walls) {
      for (let seg of w.segments) {
        if (getIntersection(p1, p2, {x: seg.x1, y: seg.y1}, {x: seg.x2, y: seg.y2})) {
          return false;
        }
      }
    }
    return true;
  }

  patrol() {
    const wp = this.waypoints[this.currentWaypointIndex];
    if (dist(this.x, this.y, wp.x, wp.y) < 10) {
      this.currentWaypointIndex = (this.currentWaypointIndex + 1) % this.waypoints.length;
    }
    this.moveTowards(wp.x, wp.y);
  }

  moveTowards(tx, ty) {
    const targetAngle = angleTo(this.x, this.y, tx, ty);
    let diff = normalizeAngle(targetAngle - this.angle);
    // Rotate
    this.angle += diff * 0.1;

    // Move
    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
  }

  shoot(tx, ty) {
    for(let i=0; i<3; i++) {
      particles.push(new Particle(
        this.x + Math.cos(this.angle)*12, 
        this.y + Math.sin(this.angle)*12, 
        CONFIG.colors.states.ATTACK
      ));
    }
  }

  draw(ctx) {
    const color = CONFIG.colors.states[this.state];
    
    // 1. Draw Pathfinding Lines (Dashed)
    if (layers.paths && (this.state === 'CHASE' || this.state === 'ATTACK')) {
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(this.pathPoints[1].x, this.pathPoints[1].y);
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.4;
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 6]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }
    
    // Patrol Path (subtle)
    if (layers.paths && this.state === 'PATROL') {
      const wp = this.waypoints[this.currentWaypointIndex];
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(wp.x, wp.y);
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // 2. Draw Attack Range (Circle)
    if (layers.range && (this.state === 'ATTACK' || this.state === 'CHASE')) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.attackRange, 0, Math.PI*2);
      ctx.strokeStyle = color;
      ctx.globalAlpha = this.state === 'ATTACK' ? 0.5 : 0.2;
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }

    // 3. Draw FOV Cone (Heatmap style)
    if (layers.fov) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, this.viewDistance, -this.viewAngle/2, this.viewAngle/2);
      ctx.closePath();
      
      // Volumetric Gradient
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.viewDistance);
      grad.addColorStop(0, color + '40'); // 25% opacity
      grad.addColorStop(0.6, color + '10'); // 10% opacity
      grad.addColorStop(1, color + '00'); // 0% opacity
      
      ctx.fillStyle = grad;
      ctx.fill();
      
      // Edge Highlight
      ctx.strokeStyle = color + '60';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }

    // 4. Draw Body (Drone Shape)
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    
    // Dynamic Glow based on state
    ctx.shadowColor = color;
    ctx.shadowBlur = (this.state === 'ATTACK' ? 25 : 12) + Math.sin(this.pulse)*4;
    
    // Shape (Triangle)
    ctx.beginPath();
    ctx.moveTo(12, 0);
    ctx.lineTo(-8, 7);
    ctx.lineTo(-5, 0);
    ctx.lineTo(-8, -7);
    ctx.closePath();
    
    ctx.fillStyle = color;
    ctx.fill();
    
    // Inner detail (Sensor eye)
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-2, 0, 2.5, 0, Math.PI*2);
    ctx.fill();
    
    ctx.shadowBlur = 0;
    ctx.restore();

    // 5. Draw Label (Above unit)
    ctx.fillStyle = color;
    ctx.font = '600 9px "SF Mono", "Menlo", monospace';
    ctx.textAlign = 'center';
    ctx.globalAlpha = this.labelOpacity;
    ctx.fillText(this.state, this.x, this.y - 20);
    ctx.globalAlpha = 1;
  }
}

// --- MAIN LOOP ---

function init() {
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });
  window.addEventListener('click', () => {
    // Ping effect
    for(let i=0; i<8; i++) {
      particles.push(new Particle(mouse.x, mouse.y, CONFIG.colors.player));
    }
  });

  generateMap();
  requestAnimationFrame(loop);
}

function resize() {
  const container = document.getElementById('canvas-container');
  width = container.clientWidth;
  height = container.clientHeight;
  canvas.width = width;
  canvas.height = height;
}

function generateMap() {
  walls = [];
  enemies = [];
  
  // Generate Walls (Avoid center)
  for(let i=0; i<CONFIG.wallCount; i++) {
    let valid = false;
    let w, h, x, y;
    while(!valid) {
      w = 60 + Math.random() * 160;
      h = 20 + Math.random() * 60;
      x = Math.random() * (width - w - 100) + 50;
      y = Math.random() * (height - h - 100) + 50;
      if (dist(x + w/2, y + h/2, width/2, height/2) > 180) valid = true;
    }
    walls.push(new Wall(x, y, w, h));
  }

  // Spawn Enemies (Diverse States)
  for(let i=0; i<CONFIG.enemyCount; i++) {
    const e = new Enemy(i);
    // Force variety for demo
    if (i === 0) e.state = 'CHASE';
    else if (i === 1) e.state = 'ATTACK';
    else if (i === 2) e.state = 'ALERT';
    enemies.push(e);
  }
}

function drawGrid() {
  // Subtle grid
  ctx.strokeStyle = CONFIG.colors.grid;
  ctx.lineWidth = 1;
  const gridSize = 64;
  
  ctx.beginPath();
  for(let x=0; x<=width; x+=gridSize) {
    ctx.moveTo(x, 0);
    ctx.lineTo(x, height);
  }
  for(let y=0; y<=height; y+=gridSize) {
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
  }
  ctx.stroke();
  
  // Noise/Grain Overlay (Simulated)
  // (Expensive to draw real noise every frame, using vignette instead for depth)
  const grad = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, height*0.8);
  grad.addColorStop(0, 'transparent');
  grad.addColorStop(1, 'rgba(0,0,0,0.8)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,width,height);
}

function drawPlayer() {
  const pX = mouse.x;
  const pY = mouse.y;
  
  // Player Entity
  ctx.save();
  ctx.translate(pX, pY);
  
  // Pulse
  const scale = 1 + Math.sin(time * 4) * 0.05;
  ctx.scale(scale, scale);

  // Outer Glow
  ctx.shadowColor = CONFIG.colors.playerGlow;
  ctx.shadowBlur = 20;
  
  // Core
  ctx.beginPath();
  ctx.arc(0, 0, 5, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  
  // Ring
  ctx.beginPath();
  ctx.arc(0, 0, 12, 0, Math.PI*2);
  ctx.strokeStyle = CONFIG.colors.player;
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // Crosshairs
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(14, 165, 233, 0.6)';
  ctx.lineWidth = 1.5;
  
  // H-Line
  ctx.beginPath();
  ctx.moveTo(-18, 0); ctx.lineTo(-8, 0);
  ctx.moveTo(8, 0); ctx.lineTo(18, 0);
  ctx.stroke();
  
  // V-Line
  ctx.beginPath();
  ctx.moveTo(0, -18); ctx.lineTo(0, -8);
  ctx.moveTo(0, 8); ctx.lineTo(0, 18);
  ctx.stroke();

  ctx.restore();

  // Update UI
  hudPos.innerText = `${Math.floor(pX).toString().padStart(3, '0')}, ${Math.floor(pY).toString().padStart(3, '0')}`;
  
  // Update Threat UI
  let threatCount = enemies.filter(e => e.state === 'CHASE' || e.state === 'ATTACK').length;
  if (threatCount === 0) {
    hudThreat.innerText = "LOW";
    hudThreat.style.color = "var(--sys-green)";
  } else if (threatCount < 3) {
    hudThreat.innerText = "MODERATE";
    hudThreat.style.color = "var(--sys-yellow)";
  } else {
    hudThreat.innerText = "CRITICAL";
    hudThreat.className = "hud-val danger";
    hudThreat.style.color = "var(--sys-red)";
  }
}

function loop(timestamp) {
  time = timestamp * 0.001;
  
  // Clear
  ctx.fillStyle = CONFIG.colors.bg;
  ctx.fillRect(0, 0, width, height);
  
  drawGrid();

  // Update & Draw Enemies
  enemies.forEach(e => {
    e.update(mouse, walls);
    e.draw(ctx);
  });

  // Update & Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  // Draw Walls (On top of paths, under player)
  walls.forEach(w => w.draw(ctx));

  drawPlayer();

  requestAnimationFrame(loop);
}

// --- UI INTERACTION ---

window.toggleLayer = (layer) => {
  layers[layer] = !layers[layer];
  const btns = document.querySelectorAll('.ghost-btn');
  if (layer === 'paths') btns[0].classList.toggle('active');
  if (layer === 'fov') btns[1].classList.toggle('active');
  if (layer === 'range') btns[2].classList.toggle('active');
};

window.resetSimulation = () => {
  generateMap();
  particles = [];
};

// Start
init();

</script>
