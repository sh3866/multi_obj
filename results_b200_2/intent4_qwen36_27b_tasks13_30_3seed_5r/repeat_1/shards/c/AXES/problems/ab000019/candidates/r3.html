<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactical AI Behavior Inspector</title>
<style>
  :root {
    /* Palette - Cyber-Tactical Dark Mode */
    --bg-deep: #05070a;
    --bg-panel: #0d1117;
    --bg-panel-glass: rgba(13, 17, 23, 0.85);
    --border-subtle: #1f2937;
    --border-highlight: #374151;
    
    --text-primary: #f3f4f6;
    --text-secondary: #9ca3af;
    --text-dim: #4b5563;
    
    /* System Colors */
    --sys-blue: #0ea5e9;
    --sys-cyan: #06b6d4;
    --sys-red: #ef4444;
    --sys-orange: #f97316;
    --sys-yellow: #eab308;
    --sys-green: #22c55e;
    
    /* Fonts */
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-deep);
    color: var(--text-primary);
    font-family: var(--font-ui);
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 320px;
    grid-template-rows: 48px 1fr;
    user-select: none;
  }

  /* HEADER - Minimal, Hardware-like */
  header {
    grid-column: 1 / -1;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 20;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.05em;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    color: var(--text-secondary);
  }

  .brand-icon {
    width: 16px;
    height: 16px;
    border: 2px solid var(--sys-cyan);
    border-radius: 2px;
    position: relative;
  }
  .brand-icon::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 4px; height: 4px;
    background: var(--sys-cyan);
    box-shadow: 0 0 6px var(--sys-cyan);
  }

  .live-feed {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--sys-green);
    text-transform: uppercase;
    font-weight: 700;
    opacity: 0.9;
  }

  .live-dot {
    width: 6px; height: 6px;
    background: var(--sys-green);
    box-shadow: 0 0 8px var(--sys-green);
    animation: blink 1.5s infinite;
  }

  @keyframes blink { 50% { opacity: 0.4; } }

  /* MAIN CANVAS AREA */
  main {
    position: relative;
    background-color: var(--bg-deep);
    overflow: hidden;
    cursor: crosshair;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* INSPECTOR PANEL - Unified Geometry (6px radius) */
  aside {
    background: var(--bg-panel);
    border-left: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    padding: 24px;
    gap: 32px;
    overflow-y: auto;
    z-index: 10;
    box-shadow: -10px 0 30px rgba(0,0,0,0.3);
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .panel-title {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    border-bottom: 1px solid var(--border-subtle);
    padding-bottom: 8px;
    margin-bottom: 4px;
  }

  /* VISUALIZATION TOGGLES - Wireframe Style */
  .layer-controls {
    display: flex;
    gap: 8px;
  }

  .wire-btn {
    background: transparent;
    border: 1px solid var(--border-highlight);
    color: var(--text-secondary);
    padding: 8px 12px;
    border-radius: 6px; /* Unified Radius */
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s ease;
    flex: 1;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .wire-btn:hover {
    border-color: var(--text-secondary);
    color: var(--text-primary);
  }

  .wire-btn.active {
    border-color: var(--sys-cyan);
    color: var(--sys-cyan);
    background: rgba(6, 182, 212, 0.1);
    box-shadow: 0 0 10px rgba(6, 182, 212, 0.1);
  }

  /* PLAYER STATS - HUD Overlay Style */
  .hud-card {
    background: var(--bg-panel-glass);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08); /* Subtle border */
    border-radius: 6px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: relative;
  }

  /* Decorative corner markers */
  .hud-card::before {
    content: '';
    position: absolute;
    top: -1px; left: -1px;
    width: 8px; height: 8px;
    border-top: 2px solid var(--sys-blue);
    border-left: 2px solid var(--sys-blue);
    border-radius: 6px 0 0 0;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px dashed rgba(255,255,255,0.05);
    padding-bottom: 4px;
  }
  
  .stat-label { 
    font-size: 11px; 
    color: var(--text-secondary); 
    font-weight: 500;
    margin-bottom: 2px;
  }
  
  .stat-value { 
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600; 
    color: var(--text-primary);
    letter-spacing: -0.03em;
  }

  .stat-highlight {
    color: var(--sys-blue);
    text-shadow: 0 0 10px rgba(14, 165, 233, 0.4);
  }

  /* LEGEND - Grid Layout */
  .legend-grid {
    display: grid;
    grid-template-columns: 1fr 1fr; /* Two column layout */
    gap: 12px;
  }

  .legend-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-dim);
  }

  .legend-header {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend-indicator {
    width: 6px;
    height: 6px;
    border-radius: 1px;
  }

  .legend-sub {
    font-family: var(--font-mono);
    font-size: 9px;
    opacity: 0.7;
    padding-left: 12px;
  }

  /* ACTION BUTTON */
  .btn-action {
    background: rgba(255,255,255,0.03);
    color: var(--text-secondary);
    border: 1px solid var(--border-highlight);
    padding: 12px;
    border-radius: 6px; /* Unified Radius */
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: all 0.2s;
    width: 100%;
    margin-top: auto;
  }

  .btn-action:hover { 
    border-color: var(--sys-red);
    color: var(--sys-red);
    background: rgba(239, 68, 68, 0.05);
  }

  /* Overlays */
  .overlay-coords {
    position: absolute;
    bottom: 20px;
    right: 20px;
    pointer-events: none;
    font-family: var(--font-mono);
    color: var(--sys-cyan);
    font-size: 10px;
    opacity: 0.5;
    text-align: right;
    line-height: 1.4;
    border: 1px solid rgba(6, 182, 212, 0.2);
    padding: 8px;
    background: rgba(5, 7, 10, 0.6);
  }

  .overlay-label {
    position: absolute;
    top: 20px;
    left: 20px;
    pointer-events: none;
    font-family: var(--font-ui);
    color: var(--text-dim);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 700;
    background: rgba(5, 7, 10, 0.6);
    padding: 6px 10px;
    border: 1px solid rgba(255,255,255,0.05);
  }

</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon"></div>
    TACTICAL<span style="opacity:0.5; font-weight:400;">AI</span> // SIMULATION
  </div>
  <div class="live-feed">
    <div class="live-dot"></div>
    LIVE FEED
  </div>
</header>

<main id="canvas-container">
  <canvas id="simCanvas"></canvas>
  
  <div class="overlay-label">
    Mouse to Pilot<br>
    Click to Ping
  </div>

  <div class="overlay-coords" id="overlay-coords">
    X: 000<br>
    Y: 000
  </div>
</main>

<aside>
  <!-- LAYER CONTROLS (Moved Top, Wireframe Style) -->
  <div class="panel-section">
    <div class="panel-title">Visualization Layers</div>
    <div class="layer-controls">
      <button class="wire-btn active" onclick="toggleLayer('paths')">Paths</button>
      <button class="wire-btn active" onclick="toggleLayer('fov')">FOV</button>
      <button class="wire-btn active" onclick="toggleLayer('range')">Range</button>
    </div>
  </div>

  <!-- PLAYER STATS (HUD Style) -->
  <div class="panel-section">
    <div class="panel-title">Player Status</div>
    <div class="hud-card">
      <div class="stat-row">
        <span class="stat-label">Health</span>
        <span class="stat-value stat-highlight">100%</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Position</span>
        <span class="stat-value" id="pos-display">000, 000</span>
      </div>
      <div class="stat-row" style="border:none">
        <span class="stat-label">Threat Level</span>
        <span class="stat-value" id="threat-display" style="color: var(--sys-green)">LOW</span>
      </div>
    </div>
  </div>

  <!-- LEGEND (Grid Layout) -->
  <div class="panel-section">
    <div class="panel-title">AI State Legend</div>
    <div class="legend-grid">
      <div class="legend-item">
        <div class="legend-header">
          <div class="legend-indicator" style="background: var(--sys-green); box-shadow: 0 0 5px var(--sys-green)"></div>
          <span style="color: var(--sys-green)">PATROL</span>
        </div>
        <span class="legend-sub">Routine</span>
      </div>
      <div class="legend-item">
        <div class="legend-header">
          <div class="legend-indicator" style="background: var(--sys-yellow); box-shadow: 0 0 5px var(--sys-yellow)"></div>
          <span style="color: var(--sys-yellow)">ALERT</span>
        </div>
        <span class="legend-sub">Investigating</span>
      </div>
      <div class="legend-item">
        <div class="legend-header">
          <div class="legend-indicator" style="background: var(--sys-orange); box-shadow: 0 0 5px var(--sys-orange)"></div>
          <span style="color: var(--sys-orange)">CHASE</span>
        </div>
        <span class="legend-sub">Intercept</span>
      </div>
      <div class="legend-item">
        <div class="legend-header">
          <div class="legend-indicator" style="background: var(--sys-red); box-shadow: 0 0 5px var(--sys-red)"></div>
          <span style="color: var(--sys-red)">ATTACK</span>
        </div>
        <span class="legend-sub">Engaging</span>
      </div>
    </div>
  </div>

  <div class="panel-section" style="margin-top: auto;">
    <button class="btn-action" onclick="resetSimulation()">Reset Simulation</button>
  </div>
</aside>

<script>
/**
 * TACTICAL AI SIMULATION ENGINE
 * Revised for visual clarity, state variety, and interaction.
 */

const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const posDisplay = document.getElementById('pos-display');
const coordDisplay = document.getElementById('overlay-coords');
const threatDisplay = document.getElementById('threat-display');

// Configuration
const CONFIG = {
  colors: {
    bg: '#05070a',
    grid: '#11151e', // Very subtle
    wall: '#161b22',
    wallStroke: '#30363d',
    player: '#0ea5e9', 
    playerGlow: '#0284c7',
    states: {
      PATROL: '#22c55e',
      ALERT: '#eab308',
      CHASE: '#f97316',
      ATTACK: '#ef4444'
    }
  },
  enemyCount: 6,
  wallCount: 12
};

// State
let width, height;
let lastTime = 0;
let mouse = { x: 0, y: 0 };
let walls = [];
let enemies = [];
let particles = [];
let time = 0;

// Layers
const layers = {
  paths: true,
  fov: true,
  range: true
};

// --- UTILS ---

const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const lerp = (a, b, t) => a + (b - a) * t;
const angleTo = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);
const normalizeAngle = (angle) => {
  let a = angle;
  while (a <= -Math.PI) a += Math.PI*2;
  while (a > Math.PI) a -= Math.PI*2;
  return a;
};

// Line segment intersection for LOS
function getIntersection(A, B, C, D) {
  const tTop = (D.x - C.x) * (A.y - C.y) - (D.y - C.y) * (A.x - C.x);
  const uTop = (C.y - A.y) * (A.x - B.x) - (C.x - A.x) * (A.y - B.y);
  const bottom = (D.y - C.y) * (B.x - A.x) - (D.x - C.x) * (B.y - A.y);

  if (bottom !== 0) {
    const t = tTop / bottom;
    const u = uTop / bottom;
    if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
      return { x: lerp(A.x, B.x, t), y: lerp(A.y, B.y, t), offset: t }
    }
  }
  return null;
}

// --- CLASSES ---

class Wall {
  constructor(x, y, w, h) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    // Create segments for collision
    this.segments = [
      {x1: x, y1: y, x2: x + w, y2: y},
      {x1: x + w, y1: y, x2: x + w, y2: y + h},
      {x1: x + w, y1: y + h, x2: x, y2: y + h},
      {x1: x, y1: y + h, x2: x, y2: y}
    ];
  }

  draw(ctx) {
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(this.x + 8, this.y + 8, this.w, this.h);
    
    // Main
    ctx.fillStyle = CONFIG.colors.wall;
    ctx.fillRect(this.x, this.y, this.w, this.h);
    
    // Tech Border
    ctx.strokeStyle = CONFIG.colors.wallStroke;
    ctx.lineWidth = 1;
    ctx.strokeRect(this.x, this.y, this.w, this.h);
    
    // Inner detail (tech look)
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.strokeRect(this.x + 4, this.y + 4, this.w - 8, this.h - 8);
    
    // Corner accents
    ctx.fillStyle = '#4b5563';
    ctx.fillRect(this.x, this.y, 4, 4);
    ctx.fillRect(this.x + this.w - 4, this.y, 4, 4);
    ctx.fillRect(this.x, this.y + this.h - 4, 4, 4);
    ctx.fillRect(this.x + this.w - 4, this.y + this.h - 4, 4, 4);
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.color = color;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 2 + 0.5;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 1.0;
    this.decay = 0.03 + Math.random() * 0.04;
    this.size = Math.random() * 2 + 0.5;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.92;
    this.vy *= 0.92;
    this.life -= this.decay;
  }
  draw(ctx) {
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Enemy {
  constructor(id) {
    this.id = id;
    // Random spawn
    let safe = false;
    while(!safe) {
      this.x = Math.random() * (width - 100) + 50;
      this.y = Math.random() * (height - 100) + 50;
      if(dist(this.x, this.y, width/2, height/2) > 200) safe = true;
    }
    
    this.radius = 8;
    this.angle = Math.random() * Math.PI * 2;
    this.speed = 1.0 + Math.random() * 0.8;
    
    // AI State
    this.state = 'PATROL'; 
    this.targetX = this.x;
    this.targetY = this.y;
    
    // Waypoints
    this.waypoints = [];
    this.currentWaypointIndex = 0;
    this.generateWaypoints();

    // Properties
    this.viewDistance = 250;
    this.viewAngle = Math.PI / 3; 
    this.attackRange = 90;
    
    this.alertTimer = 0;
    this.alertTarget = {x: 0, y: 0};
    
    // Visuals
    this.pathPoints = []; // For drawing trails
    this.pulse = Math.random() * 100;
  }

  generateWaypoints() {
    this.waypoints = [];
    for(let i=0; i<4; i++) {
      this.waypoints.push({
        x: Math.random() * (width - 100) + 50,
        y: Math.random() * (height - 100) + 50
      });
    }
  }

  update(player, walls) {
    const dToPlayer = dist(this.x, this.y, player.x, player.y);
    const angleToPlayer = angleTo(this.x, this.y, player.x, player.y);
    
    let angleDiff = normalizeAngle(angleToPlayer - this.angle);
    
    // Check Vision
    const inFOV = Math.abs(angleDiff) < this.viewAngle / 2;
    const canSee = dToPlayer < this.viewDistance && inFOV && this.hasLineOfSight(player.x, player.y, walls);

    // State Machine
    if (this.state === 'PATROL') {
      if (canSee) {
        this.state = 'CHASE';
      } else {
        this.patrol();
      }
    } 
    else if (this.state === 'ALERT') {
      this.alertTimer--;
      // Move to alert location
      if (dist(this.x, this.y, this.alertTarget.x, this.alertTarget.y) < 5) {
        // Arrived, wait a bit then patrol
        this.alertTimer -= 10; 
        if (this.alertTimer < 0) this.state = 'PATROL';
      } else {
        this.moveTowards(this.alertTarget.x, this.alertTarget.y);
      }
      
      // If spotted during alert
      if (canSee) this.state = 'CHASE';

    }
    else if (this.state === 'CHASE') {
      if (!canSee) {
        this.state = 'ALERT';
        this.alertTimer = 300; // 5 seconds
        this.alertTarget = {x: player.x, y: player.y};
      } else {
        if (dToPlayer < this.attackRange) {
          this.state = 'ATTACK';
        } else {
          this.moveTowards(player.x, player.y);
          this.pathPoints = [{x: this.x, y: this.y}, {x: player.x, y: player.y}];
        }
      }
    }
    else if (this.state === 'ATTACK') {
      if (dToPlayer > this.viewDistance * 1.2) {
        this.state = 'CHASE';
      } else {
        // Focus player
        this.angle = lerp(this.angle, angleToPlayer, 0.15);
        // Fire
        if (Math.random() < 0.08) this.shoot(player.x, player.y);
        this.pathPoints = [{x: this.x, y: this.y}, {x: player.x, y: player.y}];
      }
    }
    
    // Boundary clamp
    this.x = Math.max(20, Math.min(width - 20, this.x));
    this.y = Math.max(20, Math.min(height - 20, this.y));
    
    this.pulse += 0.1;
  }

  hasLineOfSight(tx, ty, walls) {
    const p1 = {x: this.x, y: this.y};
    const p2 = {x: tx, y: ty};
    
    for (let w of walls) {
      for (let seg of w.segments) {
        if (getIntersection(p1, p2, {x: seg.x1, y: seg.y1}, {x: seg.x2, y: seg.y2})) {
          return false;
        }
      }
    }
    return true;
  }

  patrol() {
    const wp = this.waypoints[this.currentWaypointIndex];
    if (dist(this.x, this.y, wp.x, wp.y) < 10) {
      this.currentWaypointIndex = (this.currentWaypointIndex + 1) % this.waypoints.length;
    }
    this.moveTowards(wp.x, wp.y);
  }

  moveTowards(tx, ty) {
    const targetAngle = angleTo(this.x, this.y, tx, ty);
    let diff = normalizeAngle(targetAngle - this.angle);
    // Rotate
    this.angle += diff * 0.1;

    // Move
    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
  }

  shoot(tx, ty) {
    for(let i=0; i<4; i++) {
      particles.push(new Particle(
        this.x + Math.cos(this.angle)*12, 
        this.y + Math.sin(this.angle)*12, 
        CONFIG.colors.states.ATTACK
      ));
    }
  }

  draw(ctx) {
    const color = CONFIG.colors.states[this.state];
    
    // 1. Draw Pathfinding Lines (Dashed)
    if (layers.paths && (this.state === 'CHASE' || this.state === 'ATTACK')) {
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(this.pathPoints[1].x, this.pathPoints[1].y);
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 8]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }
    
    // Patrol Path (subtle)
    if (layers.paths && this.state === 'PATROL') {
      const wp = this.waypoints[this.currentWaypointIndex];
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(wp.x, wp.y);
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // 2. Draw Attack Range (Circle)
    if (layers.range && (this.state === 'ATTACK' || this.state === 'CHASE')) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.attackRange, 0, Math.PI*2);
      ctx.strokeStyle = color;
      ctx.globalAlpha = this.state === 'ATTACK' ? 0.6 : 0.2;
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }

    // 3. Draw FOV Cone (Sonar/Laser effect)
    if (layers.fov) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, this.viewDistance, -this.viewAngle/2, this.viewAngle/2);
      ctx.closePath();
      
      // Gradient fill
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.viewDistance);
      grad.addColorStop(0, color + '40'); // Hex alpha
      grad.addColorStop(1, color + '00');
      
      ctx.fillStyle = grad;
      ctx.fill();
      
      // Stronger edges
      ctx.strokeStyle = color + '60';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }

    // 4. Draw Body (Drone Shape)
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    
    // Dynamic Glow based on state
    ctx.shadowColor = color;
    ctx.shadowBlur = (this.state === 'ATTACK' ? 20 : 10) + Math.sin(this.pulse)*3;
    
    // Shape
    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.lineTo(-8, 8);
    ctx.lineTo(-4, 0);
    ctx.lineTo(-8, -8);
    ctx.closePath();
    
    ctx.fillStyle = color;
    ctx.fill();
    
    // Inner detail
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-2, 0, 3, 0, Math.PI*2);
    ctx.fill();
    
    ctx.shadowBlur = 0;
    ctx.restore();
  }
}

// --- MAIN LOOP ---

function init() {
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });
  window.addEventListener('click', () => {
    // Ping effect
    for(let i=0; i<8; i++) {
      particles.push(new Particle(mouse.x, mouse.y, CONFIG.colors.player));
    }
  });

  generateMap();
  requestAnimationFrame(loop);
}

function resize() {
  const container = document.getElementById('canvas-container');
  width = container.clientWidth;
  height = container.clientHeight;
  canvas.width = width;
  canvas.height = height;
}

function generateMap() {
  walls = [];
  enemies = [];
  
  // Generate Walls
  for(let i=0; i<CONFIG.wallCount; i++) {
    const w = 60 + Math.random() * 140;
    const h = 20 + Math.random() * 60;
    const x = Math.random() * (width - w - 100) + 50;
    const y = Math.random() * (height - h - 100) + 50;
    // Avoid center
    if (dist(x, y, width/2, height/2) > 180) {
      walls.push(new Wall(x, y, w, h));
    }
  }

  // Spawn Enemies
  for(let i=0; i<CONFIG.enemyCount; i++) {
    const e = new Enemy(i);
    
    // CRITIQUE FIX: Force diverse states initially
    if (i === 0) e.state = 'CHASE';
    else if (i === 1) e.state = 'ATTACK';
    else if (i === 2) e.state = 'ALERT';
    
    enemies.push(e);
  }
}

function drawGrid() {
  // Subtle background texture
  ctx.strokeStyle = CONFIG.colors.grid;
  ctx.lineWidth = 1;
  const gridSize = 64;
  
  ctx.beginPath();
  for(let x=0; x<=width; x+=gridSize) {
    ctx.moveTo(x, 0);
    ctx.lineTo(x, height);
  }
  for(let y=0; y<=height; y+=gridSize) {
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
  }
  ctx.stroke();
  
  // Vignette
  const grad = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, height);
  grad.addColorStop(0, 'transparent');
  grad.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,width,height);
}

function drawPlayer() {
  const pX = mouse.x;
  const pY = mouse.y;
  
  // Tether to sidebar (visual connection)
  if (pX < width - 340) {
    ctx.beginPath();
    ctx.moveTo(pX + 20, pY);
    ctx.lineTo(width - 340, pY);
    ctx.strokeStyle = 'rgba(14, 165, 233, 0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Player Entity
  ctx.save();
  ctx.translate(pX, pY);
  
  // Pulse
  const scale = 1 + Math.sin(time * 3) * 0.05;
  ctx.scale(scale, scale);

  // Outer Glow
  ctx.shadowColor = CONFIG.colors.playerGlow;
  ctx.shadowBlur = 15;
  
  // Core
  ctx.beginPath();
  ctx.arc(0, 0, 6, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  
  // Ring
  ctx.beginPath();
  ctx.arc(0, 0, 14, 0, Math.PI*2);
  ctx.strokeStyle = CONFIG.colors.player;
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // Crosshairs
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(14, 165, 233, 0.5)';
  ctx.lineWidth = 1.5;
  
  // H-Line
  ctx.beginPath();
  ctx.moveTo(-20, 0); ctx.lineTo(-10, 0);
  ctx.moveTo(10, 0); ctx.lineTo(20, 0);
  ctx.stroke();
  
  // V-Line
  ctx.beginPath();
  ctx.moveTo(0, -20); ctx.lineTo(0, -10);
  ctx.moveTo(0, 10); ctx.lineTo(0, 20);
  ctx.stroke();

  ctx.restore();

  // Update UI
  posDisplay.innerText = `${Math.floor(pX).toString().padStart(3, '0')}, ${Math.floor(pY).toString().padStart(3, '0')}`;
  coordDisplay.innerHTML = `X: ${Math.floor(pX).toString().padStart(3, '0')}<br>Y: ${Math.floor(pY).toString().padStart(3, '0')}`;
  
  // Update Threat UI
  let threatCount = enemies.filter(e => e.state === 'CHASE' || e.state === 'ATTACK').length;
  if (threatCount === 0) {
    threatDisplay.innerText = "LOW";
    threatDisplay.style.color = "var(--sys-green)";
  } else if (threatCount < 3) {
    threatDisplay.innerText = "MODERATE";
    threatDisplay.style.color = "var(--sys-yellow)";
  } else {
    threatDisplay.innerText = "CRITICAL";
    threatDisplay.style.color = "var(--sys-red)";
  }
}

function loop(timestamp) {
  time = timestamp * 0.001;
  
  // Clear
  ctx.fillStyle = CONFIG.colors.bg;
  ctx.fillRect(0, 0, width, height);
  
  drawGrid();

  // Update & Draw Enemies
  enemies.forEach(e => {
    e.update(mouse, walls);
    e.draw(ctx);
  });

  // Update & Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  // Draw Walls
  walls.forEach(w => w.draw(ctx));

  drawPlayer();

  requestAnimationFrame(loop);
}

// --- UI INTERACTION ---

window.toggleLayer = (layer) => {
  layers[layer] = !layers[layer];
  const btns = document.querySelectorAll('.wire-btn');
  // Simple mapping based on order
  if (layer === 'paths') btns[0].classList.toggle('active');
  if (layer === 'fov') btns[1].classList.toggle('active');
  if (layer === 'range') btns[2].classList.toggle('active');
};

window.resetSimulation = () => {
  generateMap();
  particles = [];
};

// Start
init();

</script>
