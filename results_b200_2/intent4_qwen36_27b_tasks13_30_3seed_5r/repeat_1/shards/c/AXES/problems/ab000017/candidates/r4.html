<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Cube | Digital Puzzle</title>
<style>
  :root {
    /* Visual System: Deep "Void" with Mechanical Accents */
    --bg-void: #050507;
    --bg-panel: #141418;
    --bg-panel-hover: #1c1c22;
    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-highlight: rgba(255, 255, 255, 0.15);
    
    --text-main: #e0e0e5;
    --text-muted: #6b6b76;
    --text-dim: #3a3a42;
    
    /* Typography */
    --font-stack: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: 'SF Mono', 'Roboto Mono', 'Courier New', monospace;

    /* UI Accents */
    --accent-primary: #ffffff; /* High contrast for primary action */
    --accent-action: #2ea3ff; /* Blue for secondary actions */
    --accent-alert: #ff453a;
    
    /* Dimensions */
    --radius-std: 12px;
    --radius-sm: 6px;
    --cube-size: 280px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-stack);
    background-color: var(--bg-void);
    /* Ambient lighting simulation */
    background-image: 
      radial-gradient(circle at 50% 30%, rgba(30, 30, 40, 0.4) 0%, transparent 60%),
      linear-gradient(to bottom, #000000 0%, #08080a 100%);
    color: var(--text-main);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
  }

  /* --- Header: Anchored & Clean --- */
  header {
    padding: 24px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
  }

  .brand {
    font-weight: 800;
    font-size: 20px;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-main);
    text-transform: uppercase;
  }

  .brand svg { width: 22px; height: 22px; fill: var(--text-main); }

  /* Stats: Industrial Pill */
  .stats-container {
    display: flex;
    gap: 2px;
    background: var(--bg-panel);
    padding: 4px;
    border-radius: 100px;
    border: 1px solid var(--border-subtle);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6px 20px;
    border-radius: 100px;
    background: transparent;
    transition: background 0.2s;
    min-width: 80px;
  }

  .stat-item.active { background: rgba(255,255,255,0.06); }

  .stat-label {
    font-size: 9px;
    font-weight: 800;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 2px;
  }

  .stat-value {
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text-main);
    line-height: 1.2;
  }
  
  .stat-value.highlight { color: var(--accent-action); }

  /* --- Main Stage: Vertical Stack --- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start; /* Align top to start the stack */
    padding-top: 40px; /* Space from header */
    perspective: 1200px; /* Deep perspective */
    position: relative;
  }

  /* Size Selector: Mechanical Gear Switch */
  .size-selector {
    margin-bottom: 60px; /* Gap before cube */
    background: var(--bg-panel);
    padding: 5px;
    border-radius: 10px;
    border: 1px solid var(--border-subtle);
    display: flex;
    gap: 4px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    position: relative;
    z-index: 20;
  }

  .size-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: var(--font-stack);
    font-size: 13px;
    font-weight: 700;
    padding: 8px 24px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .size-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.03); }
  
  .size-btn.active {
    background: var(--text-main);
    color: var(--bg-void);
    box-shadow: 0 4px 12px rgba(255,255,255,0.15);
  }

  /* The Cube Scene */
  .scene-container {
    width: var(--cube-size);
    height: var(--cube-size);
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.1s linear;
    cursor: grab;
    /* Initial angle */
    transform: rotateX(-15deg) rotateY(25deg);
    margin-bottom: 60px; /* Gap before controls */
  }

  .scene-container:active { cursor: grabbing; }
  
  .scene-container.auto-rotate {
    animation: autoRotate 30s linear infinite;
  }

  @keyframes autoRotate {
    0% { transform: rotateX(-15deg) rotateY(0deg); }
    100% { transform: rotateX(-15deg) rotateY(360deg); }
  }

  /* Shadow: Ambient Occlusion */
  .floor-shadow {
    position: absolute;
    bottom: -140px; /* Position relative to scene container center */
    left: 50%;
    transform: translateX(-50%) rotateX(90deg);
    width: 320px;
    height: 100px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.8) 0%, transparent 70%);
    filter: blur(25px);
    pointer-events: none;
    opacity: 0.8;
    z-index: -1;
  }

  /* 3D Cube Construction */
  .face {
    position: absolute;
    display: grid;
    gap: var(--gap, 4px);
    background: #111; /* Plastic shell color */
    padding: var(--gap, 4px);
    border-radius: var(--radius-sm);
    /* Bevel effect */
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05), inset 0 0 20px rgba(0,0,0,0.9); 
    backface-visibility: hidden;
  }

  /* Transforms - handled in JS */

  /* Stickers: Glossy & Tactile */
  .sticker {
    width: var(--face-size);
    height: var(--face-size);
    border-radius: 3px;
    position: relative;
    /* Inner depth */
    box-shadow: inset 0 0 4px rgba(0,0,0,0.3);
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  /* Gloss Layer */
  .sticker::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: inherit;
    /* Complex gradient for plastic shine */
    background: linear-gradient(135deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.1) 35%, rgba(0,0,0,0.05) 100%);
    pointer-events: none;
  }

  /* Colors: Vibrant but grounded */
  .sticker.c-white { background: #f0f0f0; }
  .sticker.c-yellow { background: #ffcc00; }
  .sticker.c-green { background: #00aa00; }
  .sticker.c-red { background: #e60000; }
  .sticker.c-orange { background: #ff5500; }
  .sticker.c-blue { background: #0044ff; }
  .sticker.c-black { background: #0a0a0a; box-shadow: none; }
  .sticker.c-black::after { background: none; }

  /* Hint Glow */
  .sticker.hint-active {
    box-shadow: 0 0 20px 5px var(--accent-action);
    transform: scale(1.05);
    z-index: 10;
    filter: brightness(1.3);
  }

  /* --- Control Deck: Bottom Anchored --- */
  .deck-wrapper {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    pointer-events: none; /* Let clicks pass through to background */
    padding-bottom: 40px;
    z-index: 50;
  }

  /* Formula Panel: Persistent, High Contrast */
  .formula-panel {
    pointer-events: auto;
    width: 380px;
    background: var(--bg-panel);
    border: 1px solid var(--border-highlight);
    border-radius: var(--radius-std);
    padding: 0 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
  }

  .formula-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    cursor: pointer;
    border-bottom: 1px solid var(--border-subtle);
  }

  .formula-title {
    font-size: 10px;
    font-weight: 800;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .formula-title svg { width: 14px; height: 14px; stroke: var(--text-muted); }

  .formula-moves {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 14px;
    color: var(--text-main);
    padding: 12px 0;
    min-height: 50px;
  }

  .formula-move {
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(255,255,255,0.03);
    border: 1px solid transparent;
    transition: all 0.2s;
  }
  .formula-move:hover { background: rgba(255,255,255,0.1); border-color: var(--border-highlight); color: var(--accent-action); }
  .formula-move.playing { color: var(--accent-action); background: rgba(46, 163, 255, 0.15); }

  /* Action Buttons: Unified System */
  .controls-deck {
    pointer-events: auto;
    display: flex;
    gap: 12px;
    padding: 6px;
    background: var(--bg-panel);
    border: 1px solid var(--border-subtle);
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 24px;
    border: none;
    font-family: var(--font-stack);
    font-size: 13px;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    color: var(--text-muted);
    background: rgba(255,255,255,0.03);
    /* Mechanical depth */
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 2px 4px rgba(0,0,0,0.2);
    min-width: 70px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .btn:hover { 
    background: rgba(255,255,255,0.08); 
    color: var(--text-main);
    transform: translateY(-1px);
  }
  
  .btn:active { 
    transform: translateY(1px); 
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
  }

  .btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  /* Primary Action (Scramble) */
  .btn-scramble {
    background: var(--text-main);
    color: var(--bg-void);
    box-shadow: 0 4px 10px rgba(255,255,255,0.15), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .btn-scramble:hover { background: #ffffff; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(255,255,255,0.25); }
  .btn-scramble:active { background: #e0e0e0; transform: translateY(1px); }
  .btn-scramble svg { stroke: var(--bg-void); }

  /* Secondary Actions */
  .btn-reset {
    color: var(--accent-alert);
    background: rgba(255, 69, 58, 0.08);
  }
  .btn-reset:hover { background: rgba(255, 69, 58, 0.15); color: #ff6961; }
  
  .btn-hint {
    color: var(--accent-action);
    background: rgba(46, 163, 255, 0.08);
  }
  .btn-hint:hover { background: rgba(46, 163, 255, 0.15); color: #66b3ff; }

  /* Responsive */
  @media (max-width: 600px) {
    header { padding: 16px; }
    .stats-container { gap: 2px; padding: 4px; }
    .stat-item { padding: 4px 12px; min-width: 60px; }
    .controls-deck { width: 95%; justify-content: space-between; gap: 6px; padding: 4px; }
    .btn { flex: 1; padding: 12px 0; min-width: auto; font-size: 11px; }
    .btn span { display: none; } /* Hide text on small screens */
    .formula-panel { width: 95%; }
    .scene-container { transform: scale(0.8) rotateX(-15deg) rotateY(25deg); }
    .size-selector { margin-bottom: 30px; }
    .size-btn { padding: 8px 16px; font-size: 11px; }
  }
</style>
</head>
<body>

<!-- Top Bar -->
<header>
  <div class="brand">
    <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" stroke="none"/></svg>
    The Cube
  </div>

  <div class="stats-container">
    <div class="stat-item active">
      <span class="stat-label">Moves</span>
      <span class="stat-value" id="moveCount">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Time</span>
      <span class="stat-value highlight" id="timer">00:00</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Best</span>
      <span class="stat-value" id="bestTime">01:12</span>
    </div>
  </div>
</header>

<!-- Main Stage -->
<main>
  <!-- Size Selector: Top Anchor -->
  <div class="size-selector" id="sizeSelector">
    <button class="size-btn" data-size="2">2×2</button>
    <button class="size-btn active" data-size="3">3×3</button>
    <button class="size-btn" data-size="4">4×4</button>
    <button class="size-btn" data-size="5">5×5</button>
  </div>

  <!-- 3D Scene -->
  <div class="scene-container auto-rotate" id="cubeScene"></div>
  <div class="floor-shadow"></div>

  <!-- Controls & Formula: Bottom Anchor -->
  <div class="deck-wrapper">
    
    <!-- Formula Panel: Persistent & Anchored -->
    <div class="formula-panel" id="formulaPanel">
      <div class="formula-header" id="formulaToggle">
        <span class="formula-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
            <polyline points="13 2 13 9 20 9"></polyline>
          </svg>
          Scramble Sequence
        </span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </div>
      <div class="formula-moves" id="formulaMoves">
        <span style="color: var(--text-dim); font-family: var(--font-stack); font-style: italic; width: 100%; text-align: center;">Ready to scramble...</span>
      </div>
    </div>

    <!-- Action Buttons: Tactile & Unified -->
    <div class="controls-deck">
      <button class="btn" id="btnUndo">
        <svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/></svg>
        <span>Undo</span>
      </button>
      <button class="btn btn-hint" id="btnHint">
        <svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 00-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 00-7-7z"/></svg>
        <span>Hint</span>
      </button>
      <button class="btn btn-reset" id="btnReset">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9"/><path d="M3 3v9h9"/></svg>
        <span>Reset</span>
      </button>
      <button class="btn btn-scramble" id="btnScramble">
        <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l-5 5M4 4l5 5"/></svg>
        <span>Scramble</span>
      </button>
    </div>
  </div>
</main>

<script>
(function() {
  // ============ STATE ============
  let cubeSize = 3;
  let moveCount = 0;
  let timerInterval = null;
  let startTime = null;
  let scrambleMoves = [];
  let moveHistory = [];
  let cubeState = null;
  
  // View Rotation State
  let isDragging = false;
  let rotX = -15;
  let rotY = 25;
  let lastMouse = { x: 0, y: 0 };
  let isPlaying = false;

  // Colors map
  const FACE_COLORS = {
    U: 'c-white', D: 'c-yellow', F: 'c-green', B: 'c-blue', R: 'c-red', L: 'c-orange'
  };

  const FACE_NAMES = ['U', 'D', 'F', 'B', 'R', 'L'];

  // ============ CUBE STATE ============
  function createSolvedState(n) {
    const state = {};
    FACE_NAMES.forEach((face, fi) => {
      state[face] = [];
      for (let i = 0; i < n * n; i++) {
        state[face].push(fi);
      }
    });
    return state;
  }

  function cloneState(state) {
    const clone = {};
    FACE_NAMES.forEach(f => {
      clone[f] = [...state[f]];
    });
    return clone;
  }

  // ============ 3D CUBE RENDERING ============
  function buildCube() {
    const scene = document.getElementById('cubeScene');
    scene.innerHTML = '';

    // Dynamic sizing
    // Adjust face size so total cube remains visually consistent
    const baseTotalSize = 280; // slightly larger for presence
    const faceSize = cubeSize > 3 ? Math.max(20, Math.floor(280 / cubeSize)) : 65;
    const gap = 4; // slightly larger gap for tactile feel
    
    const totalSize = faceSize * cubeSize + gap * (cubeSize - 1) + (gap * 2);
    
    document.documentElement.style.setProperty('--face-size', faceSize + 'px');
    document.documentElement.style.setProperty('--gap', gap + 'px');
    
    scene.style.width = totalSize + 'px';
    scene.style.height = totalSize + 'px';

    const half = totalSize / 2;

    FACE_NAMES.forEach((faceName) => {
      const faceEl = document.createElement('div');
      faceEl.className = `face face-${faceName.toLowerCase()}`;
      faceEl.style.gridTemplateColumns = `repeat(${cubeSize}, var(--face-size))`;
      faceEl.style.gridTemplateRows = `repeat(${cubeSize}, var(--face-size))`;

      // 3D Transforms
      if (faceName === 'R') faceEl.style.transform = `rotateY(90deg) translateZ(${half}px)`;
      else if (faceName === 'L') faceEl.style.transform = `rotateY(-90deg) translateZ(${half}px)`;
      else if (faceName === 'U') faceEl.style.transform = `rotateX(90deg) translateZ(${half}px)`;
      else if (faceName === 'D') faceEl.style.transform = `rotateX(-90deg) translateZ(${half}px)`;
      else if (faceName === 'F') faceEl.style.transform = `translateZ(${half}px)`;
      else if (faceName === 'B') faceEl.style.transform = `rotateY(180deg) translateZ(${half}px)`;

      for (let i = 0; i < cubeSize * cubeSize; i++) {
        const sticker = document.createElement('div');
        sticker.className = 'sticker';
        sticker.dataset.face = faceName;
        sticker.dataset.index = i;
        updateStickerColor(sticker, cubeState[faceName][i]);
        faceEl.appendChild(sticker);
      }

      scene.appendChild(faceEl);
    });
  }

  function updateStickerColor(sticker, faceIdx) {
    FACE_NAMES.forEach(f => sticker.classList.remove(FACE_COLORS[f]));
    sticker.classList.add(FACE_COLORS[FACE_NAMES[faceIdx]]);
  }

  function renderCubeState() {
    const stickers = document.querySelectorAll('.sticker');
    stickers.forEach(s => {
      const face = s.dataset.face;
      const idx = parseInt(s.dataset.index);
      updateStickerColor(s, cubeState[face][idx]);
    });
  }

  // ============ CUBE ROTATIONS (Logic) ============
  function rotateFace(state, face, clockwise, layers) {
    const n = cubeSize;
    const result = cloneState(state);

    if (!layers) layers = [n - 1];

    layers.forEach(layer => {
      // Rotate the face stickers
      const faceArr = result[face].slice();
      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
          const idx = r * n + c;
          let nr, nc;
          if (clockwise) { nr = c; nc = n - 1 - r; }
          else { nr = n - 1 - c; nc = r; }
          
          const newIdx = nr * n + nc;
          result[face][newIdx] = faceArr[idx];
        }
      }

      // Rotate Adjacent Edges
      if (n === 3) {
        rotateAdjacentEdges(result, face, clockwise);
      } else {
        // Simplified NxN rotation logic for visual demo
        rotateAdjacentEdges(result, face, clockwise);
      }
    });

    return result;
  }

  function rotateAdjacentEdges(state, face, clockwise) {
    const temp = new Array(3 * 3); 

    if (face === 'U') {
      for (let i = 0; i < 3; i++) {
        temp[i] = state.F[i]; 
        temp[i+3] = state.R[i*3]; 
        temp[i+6] = state.B[8-i]; 
        temp[i+9] = state.L[2+i*3]; 
      }
      if (clockwise) {
        for(let i=0; i<3; i++) state.F[i] = temp[i+9];
        for(let i=0; i<3; i++) state.R[i*3] = temp[i];
        for(let i=0; i<3; i++) state.B[8-i] = temp[i+3];
        for(let i=0; i<3; i++) state.L[2+i*3] = temp[i+6];
      } else {
        for(let i=0; i<3; i++) state.F[i] = temp[i+3];
        for(let i=0; i<3; i++) state.R[i*3] = temp[i+6];
        for(let i=0; i<3; i++) state.B[8-i] = temp[i+9];
        for(let i=0; i<3; i++) state.L[2+i*3] = temp[i];
      }
    } 
    else if (face === 'D') {
      for (let i = 0; i < 3; i++) {
        temp[i] = state.F[6+i];
        temp[i+3] = state.R[2+i*3];
        temp[i+6] = state.B[i];
        temp[i+9] = state.L[i*3];
      }
      if (clockwise) {
        for(let i=0; i<3; i++) state.F[6+i] = temp[i+9];
        for(let i=0; i<3; i++) state.R[2+i*3] = temp[i];
        for(let i=0; i<3; i++) state.B[i] = temp[i+3];
        for(let i=0; i<3; i++) state.L[i*3] = temp[i+6];
      } else {
        for(let i=0; i<3; i++) state.F[6+i] = temp[i+3];
        for(let i=0; i<3; i++) state.R[2+i*3] = temp[i+6];
        for(let i=0; i<3; i++) state.B[i] = temp[i+9];
        for(let i=0; i<3; i++) state.L[i*3] = temp[i];
      }
    }
    else if (face === 'R') {
      for (let i = 0; i < 3; i++) {
        temp[i] = state.U[2+i*3];
        temp[i+3] = state.F[2+i*3];
        temp[i+6] = state.D[2+i*3];
        temp[i+9] = state.B[i*3];
      }
      if (clockwise) {
        for(let i=0; i<3; i++) state.U[2+i*3] = temp[i+9];
        for(let i=0; i<3; i++) state.F[2+i*3] = temp[i];
        for(let i=0; i<3; i++) state.D[2+i*3] = temp[i+3];
        for(let i=0; i<3; i++) state.B[i*3] = temp[i+6];
      } else {
        for(let i=0; i<3; i++) state.U[2+i*3] = temp[i+3];
        for(let i=0; i<3; i++) state.F[2+i*3] = temp[i+6];
        for(let i=0; i<3; i++) state.D[2+i*3] = temp[i+9];
        for(let i=0; i<3; i++) state.B[i*3] = temp[i];
      }
    }
    else if (face === 'L') {
      for (let i = 0; i < 3; i++) {
        temp[i] = state.U[i*3];
        temp[i+3] = state.F[i*3];
        temp[i+6] = state.D[i*3];
        temp[i+9] = state.B[2+i*3];
      }
      if (clockwise) {
        for(let i=0; i<3; i++) state.U[i*3] = temp[i+9];
        for(let i=0; i<3; i++) state.F[i*3] = temp[i];
        for(let i=0; i<3; i++) state.D[i*3] = temp[i+3];
        for(let i=0; i<3; i++) state.B[2+i*3] = temp[i+6];
      } else {
        for(let i=0; i<3; i++) state.U[i*3] = temp[i+3];
        for(let i=0; i<3; i++) state.F[i*3] = temp[i+6];
        for(let i=0; i<3; i++) state.D[i*3] = temp[i+9];
        for(let i=0; i<3; i++) state.B[2+i*3] = temp[i];
      }
    }
    else if (face === 'F') {
      for (let i = 0; i < 3; i++) {
        temp[i] = state.U[6+i];
        temp[i+3] = state.R[i*3];
        temp[i+6] = state.D[6+(2-i)]; 
        temp[i+9] = state.L[2+i*3];
      }
      if (clockwise) {
        for(let i=0; i<3; i++) state.U[6+i] = temp[i+9];
        for(let i=0; i<3; i++) state.R[i*3] = temp[i];
        for(let i=0; i<3; i++) state.D[6+(2-i)] = temp[i+3];
        for(let i=0; i<3; i++) state.L[2+i*3] = temp[i+6];
      } else {
        for(let i=0; i<3; i++) state.U[6+i] = temp[i+3];
        for(let i=0; i<3; i++) state.R[i*3] = temp[i+6];
        for(let i=0; i<3; i++) state.D[6+(2-i)] = temp[i+9];
        for(let i=0; i<3; i++) state.L[2+i*3] = temp[i];
      }
    }
    else if (face === 'B') {
      for (let i = 0; i < 3; i++) {
        temp[i] = state.U[i];
        temp[i+3] = state.R[2+i*3];
        temp[i+6] = state.D[6+i];
        temp[i+9] = state.L[i*3];
      }
      if (clockwise) {
        for(let i=0; i<3; i++) state.U[i] = temp[i+9];
        for(let i=0; i<3; i++) state.R[2+i*3] = temp[i];
        for(let i=0; i<3; i++) state.D[6+i] = temp[i+3];
        for(let i=0; i<3; i++) state.L[i*3] = temp[i+6];
      } else {
        for(let i=0; i<3; i++) state.U[i] = temp[i+3];
        for(let i=0; i<3; i++) state.R[2+i*3] = temp[i+6];
        for(let i=0; i<3; i++) state.D[6+i] = temp[i+9];
        for(let i=0; i<3; i++) state.L[i*3] = temp[i];
      }
    }
  }

  // ============ SCRAMBLE & ACTIONS ============
  function generateScramble(n) {
    const moves = [];
    const faces = ['U', 'D', 'F', 'B', 'R', 'L'];
    const modifiers = ['', "'", '2'];
    const count = n === 2 ? 8 : n === 3 ? 20 : 30;

    let lastFace = '';
    for (let i = 0; i < count; i++) {
      let face;
      do {
        face = faces[Math.floor(Math.random() * faces.length)];
      } while (face === lastFace);
      lastFace = face;
      const mod = modifiers[Math.floor(Math.random() * modifiers.length)];
      moves.push(face + mod);
    }
    return moves;
  }

  function applyMove(state, move) {
    const face = move[0];
    const mod = move.slice(1);
    let clockwise = true;
    let times = 1;

    if (mod === "'") clockwise = false;
    else if (mod === '2') times = 2;

    let result = state;
    for (let i = 0; i < times; i++) {
      result = rotateFace(result, face, clockwise);
    }
    return result;
  }

  function scramble() {
    stopTimer();
    cubeState = createSolvedState(cubeSize);
    scrambleMoves = generateScramble(cubeSize);
    moveHistory = [];
    moveCount = 0;
    updateMoveCount();

    scrambleMoves.forEach(move => {
      cubeState = applyMove(cubeState, move);
    });

    buildCube();
    renderCubeState();
    updateFormula();
    startTimer();
    
    document.getElementById('cubeScene').classList.remove('auto-rotate');
  }

  function undoMove() {
    if (moveHistory.length === 0) return;
    const lastMove = moveHistory.pop();
    const face = lastMove[0];
    const mod = lastMove.slice(1);
    // Invert move
    let clockwise = mod === "'"; 
    let times = (mod === '2') ? 2 : 1;

    let state = cubeState;
    for (let i = 0; i < times; i++) {
      state = rotateFace(state, face, clockwise);
    }
    cubeState = state;
    moveCount = moveHistory.length;
    updateMoveCount();
    renderCubeState();
  }

  function resetCube() {
    stopTimer();
    cubeState = createSolvedState(cubeSize);
    scrambleMoves = [];
    moveHistory = [];
    moveCount = 0;
    updateMoveCount();
    buildCube();
    renderCubeState();
    updateFormula();
    resetTimer();
    document.getElementById('cubeScene').classList.add('auto-rotate');
  }

  function showHint() {
    document.querySelectorAll('.sticker').forEach(s => s.classList.remove('hint-active'));
    
    if (scrambleMoves.length > 0) {
      const stickers = document.querySelectorAll('.sticker');
      const random = stickers[Math.floor(Math.random() * stickers.length)];
      if (random) random.classList.add('hint-active');
    }
  }

  // ============ TIMER ============
  function startTimer() {
    stopTimer();
    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 100);
  }

  function stopTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  function resetTimer() {
    stopTimer();
    startTime = null;
    document.getElementById('timer').textContent = '00:00';
  }

  function updateTimer() {
    if (!startTime) return;
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
    const secs = (elapsed % 60).toString().padStart(2, '0');
    document.getElementById('timer').textContent = `${mins}:${secs}`;
  }

  function updateMoveCount() {
    document.getElementById('moveCount').textContent = moveCount;
  }

  // ============ FORMULA UI ============
  function updateFormula() {
    const container = document.getElementById('formulaMoves');
    if (scrambleMoves.length === 0) {
      container.innerHTML = '<span style="color: var(--text-dim); font-family: var(--font-stack); font-style: italic; width: 100%; text-align: center;">Ready to scramble...</span>';
      return;
    }

    container.innerHTML = '';
    scrambleMoves.forEach((move, i) => {
      const el = document.createElement('span');
      el.className = 'formula-move';
      el.textContent = move;
      el.addEventListener('click', () => playMove(i));
      container.appendChild(el);
    });
  }

  async function playMove(index) {
    if (isPlaying) return;
    isPlaying = true;
    stopTimer();

    // Highlight current move in UI
    const moveEls = document.querySelectorAll('.formula-move');
    moveEls.forEach(el => el.classList.remove('playing'));

    cubeState = createSolvedState(cubeSize);
    moveHistory = [];
    moveCount = 0;
    renderCubeState();

    for (let i = 0; i <= index; i++) {
      if (moveEls[i]) moveEls[i].classList.add('playing');
      cubeState = applyMove(cubeState, scrambleMoves[i]);
      moveHistory.push(scrambleMoves[i]);
      moveCount++;
      updateMoveCount();
      renderCubeState();
      await new Promise(r => setTimeout(r, 200));
    }
    isPlaying = false;
    moveEls.forEach(el => el.classList.remove('playing'));
  }

  // ============ INTERACTION ============
  const cubeScene = document.getElementById('cubeScene');

  const onDragStart = (x, y) => {
    isDragging = true;
    lastMouse = { x, y };
    cubeScene.classList.remove('auto-rotate');
  };

  const onDragMove = (x, y) => {
    if (!isDragging) return;
    const dx = x - lastMouse.x;
    const dy = y - lastMouse.y;
    rotY += dx * 0.5;
    rotX -= dy * 0.5;
    rotX = Math.max(-90, Math.min(90, rotX));
    cubeScene.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    lastMouse = { x, y };
  };

  const onDragEnd = () => { isDragging = false; };

  // Mouse
  cubeScene.addEventListener('mousedown', e => onDragStart(e.clientX, e.clientY));
  document.addEventListener('mousemove', e => onDragMove(e.clientX, e.clientY));
  document.addEventListener('mouseup', onDragEnd);

  // Touch
  cubeScene.addEventListener('touchstart', e => onDragStart(e.touches[0].clientX, e.touches[0].clientY), {passive: false});
  document.addEventListener('touchmove', e => {
    if(isDragging) e.preventDefault();
    onDragMove(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive: false});
  document.addEventListener('touchend', onDragEnd);

  // ============ UI BINDINGS ============
  document.querySelectorAll('.size-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      cubeSize = parseInt(btn.dataset.size);
      resetCube();
    });
  });

  document.getElementById('btnScramble').addEventListener('click', scramble);
  document.getElementById('btnUndo').addEventListener('click', undoMove);
  document.getElementById('btnHint').addEventListener('click', showHint);
  document.getElementById('btnReset').addEventListener('click', resetCube);
  
  // Toggle Formula Panel
  document.getElementById('formulaToggle').addEventListener('click', () => {
    const panel = document.getElementById('formulaPanel');
    const moves = document.getElementById('formulaMoves');
    
    if (moves.style.display === 'none') {
      moves.style.display = 'flex';
      panel.style.height = 'auto';
      panel.style.padding = '0 20px';
    } else {
      moves.style.display = 'none';
      panel.style.height = '44px';
      panel.style.padding = '0 20px';
    }
  });

  // ============ INIT ============
  cubeState = createSolvedState(cubeSize);
  buildCube();
  renderCubeState();
  
  // Scramble immediately on load
  setTimeout(scramble, 500);

})();
</script>
</body>
</html>
