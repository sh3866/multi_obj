<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Cube | Premium Digital Puzzle</title>
<style>
  :root {
    /* Palette: Premium Dark with Matte Texture */
    --bg-deep: #0f1014;
    --bg-surface: #1a1c24;
    --bg-glass: rgba(20, 22, 28, 0.7);
    --border-glass: rgba(255, 255, 255, 0.08);
    
    --text-primary: #ffffff;
    --text-secondary: #8b92a5;
    --text-dim: #4a5064;

    /* Accents */
    --accent-primary: #ffffff;
    --accent-primary-hover: #f0f0f0;
    --accent-highlight: #4facfe;
    --accent-alert: #ff4757;
    
    /* Typography */
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: 'SF Mono', 'Roboto Mono', 'Courier New', monospace;

    /* Dimensions */
    --cube-size: 320px; /* Larger centerpiece */
    --radius-lg: 20px;
    --radius-md: 12px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--font-ui);
    background-color: var(--bg-deep);
    /* "Felt/Table" Texture Background */
    background-image: 
      radial-gradient(circle at 50% 40%, #232631 0%, var(--bg-deep) 70%),
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    user-select: none;
  }

  /* --- UI: Unified Glassmorphism --- */
  .glass-panel {
    background: var(--bg-glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border-glass);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
  }

  /* --- Header --- */
  header {
    padding: 24px 32px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 10;
  }

  .brand {
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.5px;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  .brand-icon {
    width: 24px; height: 24px;
    background: linear-gradient(135deg, #fff 0%, #ccc 100%);
    border-radius: 6px;
    position: relative;
    box-shadow: 0 2px 10px rgba(255,255,255,0.2);
  }
  .brand-icon::after {
    content: ''; position: absolute; inset: 4px;
    border: 1px solid rgba(0,0,0,0.2); border-radius: 3px;
  }

  /* Stats: Top Left Anchor */
  .stats-pill {
    display: flex;
    gap: 1px;
    border-radius: 100px;
    overflow: hidden;
    margin-top: 16px; /* Below logo */
    width: 140px;
  }

  .stat-cell {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px 0;
    background: var(--bg-glass);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border-glass);
  }
  
  .stat-cell:first-child { border-radius: 100px 0 0 100px; border-right: none; }
  .stat-cell:last-child { border-radius: 0 100px 100px 0; border-left: none; }

  .stat-label {
    font-size: 9px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 2px;
  }

  .stat-value {
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text-primary);
    line-height: 1;
  }

  /* --- Main Stage --- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center; /* Center Cube Vertically */
    position: relative;
    perspective: 1000px;
    width: 100%;
  }

  /* Size Selector: Floating Top */
  .size-selector {
    position: absolute;
    top: 24px;
    display: flex;
    gap: 8px;
    padding: 6px;
    border-radius: 14px;
    z-index: 20;
  }

  .size-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .size-btn:hover { color: var(--text-primary); background: rgba(255,255,255,0.05); }
  
  .size-btn.active {
    background: var(--text-primary);
    color: var(--bg-deep);
    box-shadow: 0 4px 12px rgba(255,255,255,0.15);
  }

  /* 3D Cube Scene */
  .scene-wrapper {
    width: var(--cube-size);
    height: var(--cube-size);
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.1s linear;
    cursor: grab;
    /* Initial elegant angle */
    transform: rotateX(-20deg) rotateY(30deg);
    margin-bottom: 40px;
  }

  .scene-wrapper:active { cursor: grabbing; }
  
  /* Grounding Shadow */
  .floor-shadow {
    position: absolute;
    bottom: -60px;
    left: 50%;
    transform: translateX(-50%) rotateX(90deg);
    width: 280px;
    height: 80px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.6) 0%, transparent 70%);
    filter: blur(20px);
    pointer-events: none;
    z-index: -1;
  }

  /* Cube Construction */
  .face {
    position: absolute;
    display: grid;
    gap: 3px; /* Tighter gaps for premium look */
    background: #000; /* Deep black plastic */
    padding: 3px;
    border-radius: 6px; /* Slight curve on cube edges */
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05); 
    backface-visibility: hidden;
    transform-style: preserve-3d;
  }

  /* Stickers */
  .sticker {
    width: var(--face-size);
    height: var(--face-size);
    border-radius: 2px; /* Minimal radius on stickers */
    position: relative;
    /* Depth */
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
    transition: transform 0.15s ease;
  }

  /* Gloss/Sheen */
  .sticker::after {
    content: '';
    position: absolute;
    top: 1px; left: 1px; right: 1px; bottom: 1px;
    border-radius: 2px;
    background: linear-gradient(160deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.05) 40%, transparent 100%);
    pointer-events: none;
  }

  /* Colors: High Saturation */
  .sticker.c-white { background: #ffffff; }
  .sticker.c-yellow { background: #ffd500; }
  .sticker.c-green { background: #00b140; }
  .sticker.c-red { background: #d50000; }
  .sticker.c-orange { background: #ff7b00; }
  .sticker.c-blue { background: #0051d5; }
  .sticker.c-black { background: #111; box-shadow: none; }
  .sticker.c-black::after { background: none; }

  /* Hint Effect */
  .sticker.hint-active {
    box-shadow: 0 0 15px 2px var(--accent-highlight);
    transform: scale(1.08);
    z-index: 10;
    filter: brightness(1.4);
  }

  /* --- Bottom Controls & Info --- */
  .bottom-deck {
    position: absolute;
    bottom: 32px;
    width: 100%;
    max-width: 600px;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    pointer-events: none; /* Allow clicks to pass to cube if needed */
  }

  /* Tip / Scramble Strip */
  .info-strip {
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-radius: 100px; /* Pill shape */
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    height: 48px;
    overflow: hidden;
  }

  .info-strip.expanded {
    height: auto;
    border-radius: var(--radius-md);
    flex-direction: column;
    align-items: flex-start;
    padding: 16px;
    gap: 12px;
  }

  .tip-content {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    cursor: pointer;
  }

  .tip-icon {
    width: 20px; height: 20px;
    color: var(--accent-highlight);
    flex-shrink: 0;
  }

  .tip-text {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .scramble-tape {
    display: none;
    width: 100%;
    flex-wrap: wrap;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 12px;
  }
  
  .info-strip.expanded .scramble-tape { display: flex; }
  .info-strip.expanded .tip-text { display: none; } /* Hide tip text when expanded */

  .tape-chip {
    background: rgba(255,255,255,0.1);
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
  }
  .tape-chip:hover { background: rgba(255,255,255,0.2); color: #fff; }
  .tape-chip.active { background: var(--accent-highlight); color: #fff; }

  /* Action Bar */
  .action-bar {
    pointer-events: auto;
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 24px;
    border: none;
    font-family: var(--font-ui);
    font-size: 14px;
    font-weight: 700;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
    background: var(--bg-glass);
    border: 1px solid var(--border-glass);
    color: var(--text-secondary);
    backdrop-filter: blur(10px);
  }

  .btn:hover { 
    background: rgba(255,255,255,0.1); 
    color: var(--text-primary);
    transform: translateY(-2px);
  }
  
  .btn:active { transform: translateY(0); }

  .btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  /* Primary Action: Scramble */
  .btn-scramble {
    background: var(--text-primary);
    color: var(--bg-deep);
    border: none;
    padding: 14px 32px;
    box-shadow: 0 4px 15px rgba(255,255,255,0.2);
  }
  .btn-scramble:hover { 
    background: #fff; 
    transform: translateY(-3px) scale(1.02); 
    box-shadow: 0 8px 25px rgba(255,255,255,0.3); 
  }
  .btn-scramble svg { stroke: var(--bg-deep); }

  /* Secondary Actions */
  .btn-reset { color: var(--accent-alert); border-color: rgba(255, 71, 87, 0.2); background: rgba(255, 71, 87, 0.05); }
  .btn-reset:hover { background: rgba(255, 71, 87, 0.15); border-color: rgba(255, 71, 87, 0.4); }

  .btn-hint { color: var(--accent-highlight); border-color: rgba(79, 172, 254, 0.2); background: rgba(79, 172, 254, 0.05); }
  .btn-hint:hover { background: rgba(79, 172, 254, 0.15); border-color: rgba(79, 172, 254, 0.4); }

  /* Responsive */
  @media (max-width: 600px) {
    header { padding: 16px; flex-direction: column; gap: 12px; }
    .stats-pill { width: 100%; margin-top: 0; }
    .bottom-deck { bottom: 24px; padding: 0 16px; }
    .action-bar { gap: 8px; }
    .btn { padding: 12px 16px; font-size: 13px; }
    .btn span { display: none; } /* Text hide on small */
    .btn-scramble { padding: 12px 24px; }
    .size-selector { top: 16px; }
    .scene-wrapper { width: 280px; height: 280px; }
  }
</style>
</head>
<body>

<!-- Header: Logo & Stats -->
<header>
  <div>
    <div class="brand">
      <div class="brand-icon"></div>
      The Cube
    </div>
    <!-- Stats anchored below logo -->
    <div class="stats-pill">
      <div class="stat-cell">
        <span class="stat-label">Moves</span>
        <span class="stat-value" id="moveCount">0</span>
      </div>
      <div class="stat-cell">
        <span class="stat-label">Time</span>
        <span class="stat-value" id="timer">00:00</span>
      </div>
    </div>
  </div>
</header>

<!-- Main Stage -->
<main>
  <!-- Size Selector -->
  <div class="size-selector glass-panel">
    <button class="size-btn" data-size="2">2×2</button>
    <button class="size-btn active" data-size="3">3×3</button>
    <button class="size-btn" data-size="4">4×4</button>
    <button class="size-btn" data-size="5">5×5</button>
  </div>

  <!-- 3D Scene -->
  <div class="scene-wrapper" id="cubeScene"></div>
  <div class="floor-shadow"></div>

  <!-- Bottom Deck: Info & Controls -->
  <div class="bottom-deck">
    
    <!-- Info Strip: Tip & Compact Scramble -->
    <div class="info-strip glass-panel" id="infoStrip">
      <div class="tip-content" id="tipToggle">
        <svg class="tip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
        </svg>
        <span class="tip-text" id="tipText">Tip: Try solving the white cross first.</span>
        <svg class="tip-icon" style="width:16px; height:16px; margin-left:auto; color:var(--text-secondary)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <!-- Scramble Tape (Hidden by default) -->
      <div class="scramble-tape" id="scrambleTape">
        <!-- JS populates this -->
      </div>
    </div>

    <!-- Action Bar -->
    <div class="action-bar">
      <button class="btn btn-reset" id="btnReset" title="Reset Cube">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9"/><path d="M3 3v9h9"/></svg>
        <span>Reset</span>
      </button>
      <button class="btn btn-hint" id="btnHint" title="Show Hint">
        <svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 00-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 00-7-7z"/></svg>
        <span>Hint</span>
      </button>
      <button class="btn" id="btnUndo" title="Undo Move">
        <svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/></svg>
        <span>Undo</span>
      </button>
      <button class="btn btn-scramble" id="btnScramble">
        <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l-5 5M4 4l5 5"/></svg>
        <span>Scramble</span>
      </button>
    </div>
  </div>
</main>

<script>
(function() {
  // ============ STATE ============
  let cubeSize = 3;
  let moveCount = 0;
  let timerInterval = null;
  let startTime = null;
  let scrambleMoves = [];
  let moveHistory = [];
  let cubeState = null;
  
  // View Rotation State
  let isDragging = false;
  let rotX = -20;
  let rotY = 30;
  let lastMouse = { x: 0, y: 0 };
  let isPlaying = false;

  // Colors map
  const FACE_COLORS = {
    U: 'c-white', D: 'c-yellow', F: 'c-green', B: 'c-blue', R: 'c-red', L: 'c-orange'
  };

  const FACE_NAMES = ['U', 'D', 'F', 'B', 'R', 'L'];

  const TIPS = [
    "Tip: Solve the white cross first.",
    "Tip: Align the white corners with center colors.",
    "Tip: Look for the yellow cross pattern next.",
    "Tip: Use the algorithm R U R' U' to orient corners.",
    "Tip: Keep the solved layer at the bottom."
  ];

  // ============ CUBE STATE ============
  function createSolvedState(n) {
    const state = {};
    FACE_NAMES.forEach((face, fi) => {
      state[face] = [];
      for (let i = 0; i < n * n; i++) {
        state[face].push(fi);
      }
    });
    return state;
  }

  function cloneState(state) {
    const clone = {};
    FACE_NAMES.forEach(f => {
      clone[f] = [...state[f]];
    });
    return clone;
  }

  // ============ 3D CUBE RENDERING ============
  function buildCube() {
    const scene = document.getElementById('cubeScene');
    scene.innerHTML = '';

    // Dynamic sizing
    // Adjust face size so total cube remains visually consistent
    const baseTotalSize = 320; 
    const faceSize = cubeSize > 3 ? Math.max(18, Math.floor(300 / cubeSize)) : 85;
    const gap = 3; // Premium tight gap
    
    const totalSize = faceSize * cubeSize + gap * (cubeSize - 1) + (gap * 2);
    
    document.documentElement.style.setProperty('--face-size', faceSize + 'px');
    document.documentElement.style.setProperty('--gap', gap + 'px');
    
    scene.style.width = totalSize + 'px';
    scene.style.height = totalSize + 'px';

    const half = totalSize / 2;

    FACE_NAMES.forEach((faceName) => {
      const faceEl = document.createElement('div');
      faceEl.className = `face face-${faceName.toLowerCase()}`;
      faceEl.style.gridTemplateColumns = `repeat(${cubeSize}, var(--face-size))`;
      faceEl.style.gridTemplateRows = `repeat(${cubeSize}, var(--face-size))`;

      // 3D Transforms
      if (faceName === 'R') faceEl.style.transform = `rotateY(90deg) translateZ(${half}px)`;
      else if (faceName === 'L') faceEl.style.transform = `rotateY(-90deg) translateZ(${half}px)`;
      else if (faceName === 'U') faceEl.style.transform = `rotateX(90deg) translateZ(${half}px)`;
      else if (faceName === 'D') faceEl.style.transform = `rotateX(-90deg) translateZ(${half}px)`;
      else if (faceName === 'F') faceEl.style.transform = `translateZ(${half}px)`;
      else if (faceName === 'B') faceEl.style.transform = `rotateY(180deg) translateZ(${half}px)`;

      for (let i = 0; i < cubeSize * cubeSize; i++) {
        const sticker = document.createElement('div');
        sticker.className = 'sticker';
        sticker.dataset.face = faceName;
        sticker.dataset.index = i;
        updateStickerColor(sticker, cubeState[faceName][i]);
        faceEl.appendChild(sticker);
      }

      scene.appendChild(faceEl);
    });
  }

  function updateStickerColor(sticker, faceIdx) {
    FACE_NAMES.forEach(f => sticker.classList.remove(FACE_COLORS[f]));
    sticker.classList.add(FACE_COLORS[FACE_NAMES[faceIdx]]);
  }

  function renderCubeState() {
    const stickers = document.querySelectorAll('.sticker');
    stickers.forEach(s => {
      const face = s.dataset.face;
      const idx = parseInt(s.dataset.index);
      updateStickerColor(s, cubeState[face][idx]);
    });
  }

  // ============ CUBE ROTATIONS (Logic) ============
  function rotateFace(state, face, clockwise, layers) {
    const n = cubeSize;
    const result = cloneState(state);

    if (!layers) layers = [n - 1];

    layers.forEach(layer => {
      // Rotate the face stickers
      const faceArr = result[face].slice();
      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
          const idx = r * n + c;
          let nr, nc;
          if (clockwise) { nr = c; nc = n - 1 - r; }
          else { nr = n - 1 - c; nc = r; }
          
          const newIdx = nr * n + nc;
          result[face][newIdx] = faceArr[idx];
        }
      }

      // Rotate Adjacent Edges (Simplified Logic for Demo)
      rotateAdjacentEdges(result, face, clockwise);
    });

    return result;
  }

  function rotateAdjacentEdges(state, face, clockwise) {
    const temp = new Array(3 * 3); 

    // Logic handles the outer layer of adjacent faces
    // This is a simplified visual logic for the 3x3 standard faces
    if (face === 'U') {
      for (let i = 0; i < 3; i++) {
        temp[i] = state.F[i]; 
        temp[i+3] = state.R[i*3]; 
        temp[i+6] = state.B[8-i]; 
        temp[i+9] = state.L[2+i*3]; 
      }
      if (clockwise) {
        for(let i=0; i<3; i++) state.F[i] = temp[i+9];
        for(let i=0; i<3; i++) state.R[i*3] = temp[i];
        for(let i=0; i<3; i++) state.B[8-i] = temp[i+3];
        for(let i=0; i<3; i++) state.L[2+i*3] = temp[i+6];
      } else {
        for(let i=0; i<3; i++) state.F[i] = temp[i+3];
        for(let i=0; i<3; i++) state.R[i*3] = temp[i+6];
        for(let i=0; i<3; i++) state.B[8-i] = temp[i+9];
        for(let i=0; i<3; i++) state.L[2+i*3] = temp[i];
      }
    } 
    else if (face === 'D') {
      for (let i = 0; i < 3; i++) {
        temp[i] = state.F[6+i];
        temp[i+3] = state.R[2+i*3];
        temp[i+6] = state.B[i];
        temp[i+9] = state.L[i*3];
      }
      if (clockwise) {
        for(let i=0; i<3; i++) state.F[6+i] = temp[i+9];
        for(let i=0; i<3; i++) state.R[2+i*3] = temp[i];
        for(let i=0; i<3; i++) state.B[i] = temp[i+3];
        for(let i=0; i<3; i++) state.L[i*3] = temp[i+6];
      } else {
        for(let i=0; i<3; i++) state.F[6+i] = temp[i+3];
        for(let i=0; i<3; i++) state.R[2+i*3] = temp[i+6];
        for(let i=0; i<3; i++) state.B[i] = temp[i+9];
        for(let i=0; i<3; i++) state.L[i*3] = temp[i];
      }
    }
    else if (face === 'R') {
      for (let i = 0; i < 3; i++) {
        temp[i] = state.U[2+i*3];
        temp[i+3] = state.F[2+i*3];
        temp[i+6] = state.D[2+i*3];
        temp[i+9] = state.B[i*3];
      }
      if (clockwise) {
        for(let i=0; i<3; i++) state.U[2+i*3] = temp[i+9];
        for(let i=0; i<3; i++) state.F[2+i*3] = temp[i];
        for(let i=0; i<3; i++) state.D[2+i*3] = temp[i+3];
        for(let i=0; i<3; i++) state.B[i*3] = temp[i+6];
      } else {
        for(let i=0; i<3; i++) state.U[2+i*3] = temp[i+3];
        for(let i=0; i<3; i++) state.F[2+i*3] = temp[i+6];
        for(let i=0; i<3; i++) state.D[2+i*3] = temp[i+9];
        for(let i=0; i<3; i++) state.B[i*3] = temp[i];
      }
    }
    else if (face === 'L') {
      for (let i = 0; i < 3; i++) {
        temp[i] = state.U[i*3];
        temp[i+3] = state.F[i*3];
        temp[i+6] = state.D[i*3];
        temp[i+9] = state.B[2+i*3];
      }
      if (clockwise) {
        for(let i=0; i<3; i++) state.U[i*3] = temp[i+9];
        for(let i=0; i<3; i++) state.F[i*3] = temp[i];
        for(let i=0; i<3; i++) state.D[i*3] = temp[i+3];
        for(let i=0; i<3; i++) state.B[2+i*3] = temp[i+6];
      } else {
        for(let i=0; i<3; i++) state.U[i*3] = temp[i+3];
        for(let i=0; i<3; i++) state.F[i*3] = temp[i+6];
        for(let i=0; i<3; i++) state.D[i*3] = temp[i+9];
        for(let i=0; i<3; i++) state.B[2+i*3] = temp[i];
      }
    }
    else if (face === 'F') {
      for (let i = 0; i < 3; i++) {
        temp[i] = state.U[6+i];
        temp[i+3] = state.R[i*3];
        temp[i+6] = state.D[6+(2-i)]; 
        temp[i+9] = state.L[2+i*3];
      }
      if (clockwise) {
        for(let i=0; i<3; i++) state.U[6+i] = temp[i+9];
        for(let i=0; i<3; i++) state.R[i*3] = temp[i];
        for(let i=0; i<3; i++) state.D[6+(2-i)] = temp[i+3];
        for(let i=0; i<3; i++) state.L[2+i*3] = temp[i+6];
      } else {
        for(let i=0; i<3; i++) state.U[6+i] = temp[i+3];
        for(let i=0; i<3; i++) state.R[i*3] = temp[i+6];
        for(let i=0; i<3; i++) state.D[6+(2-i)] = temp[i+9];
        for(let i=0; i<3; i++) state.L[2+i*3] = temp[i];
      }
    }
    else if (face === 'B') {
      for (let i = 0; i < 3; i++) {
        temp[i] = state.U[i];
        temp[i+3] = state.R[2+i*3];
        temp[i+6] = state.D[6+i];
        temp[i+9] = state.L[i*3];
      }
      if (clockwise) {
        for(let i=0; i<3; i++) state.U[i] = temp[i+9];
        for(let i=0; i<3; i++) state.R[2+i*3] = temp[i];
        for(let i=0; i<3; i++) state.D[6+i] = temp[i+3];
        for(let i=0; i<3; i++) state.L[i*3] = temp[i+6];
      } else {
        for(let i=0; i<3; i++) state.U[i] = temp[i+3];
        for(let i=0; i<3; i++) state.R[2+i*3] = temp[i+6];
        for(let i=0; i<3; i++) state.D[6+i] = temp[i+9];
        for(let i=0; i<3; i++) state.L[i*3] = temp[i];
      }
    }
  }

  // ============ SCRAMBLE & ACTIONS ============
  function generateScramble(n) {
    const moves = [];
    const faces = ['U', 'D', 'F', 'B', 'R', 'L'];
    const modifiers = ['', "'", '2'];
    const count = n === 2 ? 8 : n === 3 ? 20 : 30;

    let lastFace = '';
    for (let i = 0; i < count; i++) {
      let face;
      do {
        face = faces[Math.floor(Math.random() * faces.length)];
      } while (face === lastFace);
      lastFace = face;
      const mod = modifiers[Math.floor(Math.random() * modifiers.length)];
      moves.push(face + mod);
    }
    return moves;
  }

  function applyMove(state, move) {
    const face = move[0];
    const mod = move.slice(1);
    let clockwise = true;
    let times = 1;

    if (mod === "'") clockwise = false;
    else if (mod === '2') times = 2;

    let result = state;
    for (let i = 0; i < times; i++) {
      result = rotateFace(result, face, clockwise);
    }
    return result;
  }

  function scramble() {
    stopTimer();
    cubeState = createSolvedState(cubeSize);
    scrambleMoves = generateScramble(cubeSize);
    moveHistory = [];
    moveCount = 0;
    updateMoveCount();

    scrambleMoves.forEach(move => {
      cubeState = applyMove(cubeState, move);
    });

    buildCube();
    renderCubeState();
    updateTape();
    updateTip();
    startTimer();
  }

  function undoMove() {
    if (moveHistory.length === 0) return;
    const lastMove = moveHistory.pop();
    const face = lastMove[0];
    const mod = lastMove.slice(1);
    // Invert move
    let clockwise = mod === "'"; 
    let times = (mod === '2') ? 2 : 1;

    let state = cubeState;
    for (let i = 0; i < times; i++) {
      state = rotateFace(state, face, clockwise);
    }
    cubeState = state;
    moveCount = moveHistory.length;
    updateMoveCount();
    renderCubeState();
  }

  function resetCube() {
    stopTimer();
    cubeState = createSolvedState(cubeSize);
    scrambleMoves = [];
    moveHistory = [];
    moveCount = 0;
    updateMoveCount();
    buildCube();
    renderCubeState();
    updateTape();
    updateTip();
    resetTimer();
    // Reset view
    rotX = -20; rotY = 30;
    document.getElementById('cubeScene').style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
  }

  function showHint() {
    document.querySelectorAll('.sticker').forEach(s => s.classList.remove('hint-active'));
    
    if (scrambleMoves.length > 0) {
      const stickers = document.querySelectorAll('.sticker');
      const random = stickers[Math.floor(Math.random() * stickers.length)];
      if (random) random.classList.add('hint-active');
    }
  }

  // ============ TIMER ============
  function startTimer() {
    stopTimer();
    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 100);
  }

  function stopTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  function resetTimer() {
    stopTimer();
    startTime = null;
    document.getElementById('timer').textContent = '00:00';
  }

  function updateTimer() {
    if (!startTime) return;
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
    const secs = (elapsed % 60).toString().padStart(2, '0');
    document.getElementById('timer').textContent = `${mins}:${secs}`;
  }

  function updateMoveCount() {
    document.getElementById('moveCount').textContent = moveCount;
  }

  // ============ UI UPDATES ============
  function updateTape() {
    const container = document.getElementById('scrambleTape');
    container.innerHTML = '';
    if (scrambleMoves.length === 0) return;

    scrambleMoves.forEach((move, i) => {
      const el = document.createElement('span');
      el.className = 'tape-chip';
      el.textContent = move;
      el.addEventListener('click', () => playMove(i));
      container.appendChild(el);
    });
  }

  function updateTip() {
    const tipEl = document.getElementById('tipText');
    const randomTip = TIPS[Math.floor(Math.random() * TIPS.length)];
    tipEl.textContent = randomTip;
  }

  async function playMove(index) {
    if (isPlaying) return;
    isPlaying = true;
    stopTimer();

    const moveEls = document.querySelectorAll('.tape-chip');
    moveEls.forEach(el => el.classList.remove('active'));

    cubeState = createSolvedState(cubeSize);
    moveHistory = [];
    moveCount = 0;
    renderCubeState();

    for (let i = 0; i <= index; i++) {
      if (moveEls[i]) moveEls[i].classList.add('active');
      cubeState = applyMove(cubeState, scrambleMoves[i]);
      moveHistory.push(scrambleMoves[i]);
      moveCount++;
      updateMoveCount();
      renderCubeState();
      await new Promise(r => setTimeout(r, 200));
    }
    isPlaying = false;
    moveEls.forEach(el => el.classList.remove('active'));
  }

  // ============ INTERACTION ============
  const cubeScene = document.getElementById('cubeScene');

  const onDragStart = (x, y) => {
    isDragging = true;
    lastMouse = { x, y };
  };

  const onDragMove = (x, y) => {
    if (!isDragging) return;
    const dx = x - lastMouse.x;
    const dy = y - lastMouse.y;
    rotY += dx * 0.5;
    rotX -= dy * 0.5;
    rotX = Math.max(-90, Math.min(90, rotX));
    cubeScene.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    lastMouse = { x, y };
  };

  const onDragEnd = () => { isDragging = false; };

  // Mouse
  cubeScene.addEventListener('mousedown', e => onDragStart(e.clientX, e.clientY));
  document.addEventListener('mousemove', e => onDragMove(e.clientX, e.clientY));
  document.addEventListener('mouseup', onDragEnd);

  // Touch
  cubeScene.addEventListener('touchstart', e => onDragStart(e.touches[0].clientX, e.touches[0].clientY), {passive: false});
  document.addEventListener('touchmove', e => {
    if(isDragging) e.preventDefault();
    onDragMove(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive: false});
  document.addEventListener('touchend', onDragEnd);

  // ============ UI BINDINGS ============
  document.querySelectorAll('.size-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      cubeSize = parseInt(btn.dataset.size);
      resetCube();
    });
  });

  document.getElementById('btnScramble').addEventListener('click', scramble);
  document.getElementById('btnUndo').addEventListener('click', undoMove);
  document.getElementById('btnHint').addEventListener('click', showHint);
  document.getElementById('btnReset').addEventListener('click', resetCube);
  
  // Toggle Info Strip
  document.getElementById('tipToggle').addEventListener('click', () => {
    const strip = document.getElementById('infoStrip');
    strip.classList.toggle('expanded');
  });

  // ============ INIT ============
  cubeState = createSolvedState(cubeSize);
  buildCube();
  renderCubeState();
  
  // Auto Scramble
  setTimeout(scramble, 600);

})();
</script>
</body>
