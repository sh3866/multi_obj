<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONO RUNNER // OFFLINE</title>
    <style>
        :root {
            /* Modern-Retro Palette */
            --bg-color: #121212;
            --ground-color: #262626;
            --primary: #f0f0f0; /* Stark White */
            --accent: #ff3b30;  /* Alert Red */
            --secondary: #0a84ff; /* Tech Blue */
            --hud-text: #8e8e93;
            --font-mono: 'Courier New', Courier, monospace; /* System Mono */
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--primary);
            font-family: var(--font-mono);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container acts as the Game Window */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 960px;
            height: 540px;
            background: #000;
            box-shadow: 0 0 0 1px #333, 0 20px 60px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* CRT Scanline & Vignette Overlay */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        .vignette {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 101;
        }

        /* HUD Layer */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 50;
            pointer-events: none;
        }

        /* Typography Utilities */
        .text-label {
            font-size: 11px;
            color: var(--hud-text);
            letter-spacing: 2px;
            text-transform: uppercase;
            display: block;
            margin-bottom: 4px;
        }

        .text-value {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: -1px;
            color: var(--primary);
            text-shadow: 0 0 8px rgba(255,255,255,0.15);
        }

        /* Left HUD: System Status */
        .system-status {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--secondary);
            box-shadow: 0 0 8px var(--secondary);
            animation: blink 2s infinite;
        }

        /* Right HUD: Score */
        .score-group {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .score-row {
            display: flex;
            align-items: baseline;
            gap: 16px;
        }
        .hi-score {
            color: var(--hud-text);
            font-size: 16px;
            font-weight: bold;
        }

        /* Speedometer (Bottom Left) */
        .velocity-container {
            position: absolute;
            bottom: 32px;
            left: 32px;
            width: 140px;
            z-index: 50;
            pointer-events: none;
        }
        .velocity-bar-bg {
            width: 100%;
            height: 4px;
            background: #333;
            margin-top: 6px;
        }
        .velocity-bar-fill {
            height: 100%;
            width: 20%;
            background: var(--primary);
            box-shadow: 0 0 10px rgba(255,255,255,0.4);
            transition: width 0.1s linear;
        }

        /* Center Overlay: Start / Game Over */
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 60;
            pointer-events: none;
            width: 100%;
        }

        .prompt-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .prompt-text {
            font-size: 14px;
            color: var(--primary);
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: pulse 1.5s infinite ease-in-out;
        }

        .key-badge {
            border: 1px solid var(--primary);
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        .game-over-msg {
            display: none;
            color: var(--accent);
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -2px;
            text-shadow: 0 0 15px rgba(255, 59, 48, 0.4);
            margin-bottom: 10px;
        }

        /* Animations */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(2px); }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated; /* Crisp edges */
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Visual Overlays -->
        <div class="scanlines"></div>
        <div class="vignette"></div>
        
        <!-- HUD -->
        <div class="hud">
            <!-- Left: Status -->
            <div class="system-status">
                <span class="text-label">System</span>
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span>OFFLINE</span>
                </div>
            </div>

            <!-- Right: Score -->
            <div class="score-group">
                <span class="text-label">Score</span>
                <div class="score-row">
                    <span class="text-value" id="score">00000</span>
                    <span class="hi-score">HI <span id="highScore">00000</span></span>
                </div>
            </div>
        </div>

        <!-- Velocity (Bottom Left) -->
        <div class="velocity-container">
            <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                <span class="text-label">Velocity</span>
                <span class="text-label" id="velVal" style="margin:0; color:var(--primary)">0 km/h</span>
            </div>
            <div class="velocity-bar-bg">
                <div class="velocity-bar-fill" id="speedBar"></div>
            </div>
        </div>

        <!-- Game Over / Start Overlay -->
        <div class="overlay" id="startScreen">
            <div class="prompt-container">
                <div class="game-over-msg" id="gameOverTitle">CRITICAL ERROR</div>
                <div class="prompt-text">
                    Press <span class="key-badge">SPACE</span> to Run
                </div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

<script>
    /**
     * CHRONO RUNNER - REDESIGNED
     * Focus: Silhouette readability, Rhythmic spacing, Modern-Retro identity.
     */

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const startScreen = document.getElementById('startScreen');
    const gameOverTitle = document.getElementById('gameOverTitle');
    const speedBar = document.getElementById('speedBar');
    const velVal = document.getElementById('velVal');

    // Game Configuration
    const GAME_WIDTH = 960;
    const GAME_HEIGHT = 540;
    const GROUND_Y = 440; // Ground position
    
    // Physics & Mechanics
    const GRAVITY = 0.65;
    const JUMP_FORCE = -12.5;
    const BASE_SPEED = 7;
    
    // State
    let gameRunning = false;
    let gameOver = false;
    let frame = 0;
    let score = 0;
    let speed = BASE_SPEED;
    let highScore = localStorage.getItem('chrono_hs') || 0;
    let obstacles = [];
    let particles = [];
    let clouds = [];
    let groundOffset = 0;

    // Initialize High Score UI
    highScoreEl.innerText = Math.floor(highScore).toString().padStart(5, '0');

    // Resize Handler
    function resize() {
        const container = canvas.parentElement;
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- CLASSES ---

    class Dino {
        constructor() {
            this.w = 44;
            this.h = 44;
            this.x = 80;
            this.y = GROUND_Y - this.h;
            this.dy = 0;
            this.grounded = true;
            this.runFrame = 0;
            this.color = '#f0f0f0';
        }

        jump() {
            if (this.grounded) {
                this.dy = JUMP_FORCE;
                this.grounded = false;
                this.createDust(5);
            }
        }

        createDust(count) {
            for(let i=0; i<count; i++) {
                particles.push(new Particle(this.x + 10, this.y + this.h, '#888', 'dust'));
            }
        }

        update() {
            this.dy += GRAVITY;
            this.y += this.dy;

            if (this.y + this.h >= GROUND_Y) {
                this.y = GROUND_Y - this.h;
                this.dy = 0;
                this.grounded = true;
            } else {
                this.grounded = false;
            }

            if (this.grounded) {
                this.runFrame += 0.2 + (speed * 0.01);
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.fillStyle = this.color;

            // Silhouette Style Drawing
            // 1. Main Body Block
            ctx.fillRect(10, 15, 20, 20);
            
            // 2. Head Block
            ctx.fillRect(20, 0, 24, 15);
            
            // 3. Neck
            ctx.fillRect(20, 10, 10, 5);
            
            // 4. Tail
            ctx.beginPath();
            ctx.moveTo(10, 20);
            ctx.lineTo(0, 15); // Tip
            ctx.lineTo(10, 25);
            ctx.fill();

            // 5. Eye (Negative space cutout effect)
            ctx.fillStyle = '#000'; // Background color
            ctx.fillRect(32, 4, 4, 4);

            // 6. Legs (Procedural)
            ctx.fillStyle = this.color;
            
            if (!this.grounded) {
                // Jumping: Legs tucked slightly back
                ctx.fillRect(12, 35, 6, 8);
                ctx.fillRect(22, 35, 6, 8);
            } else {
                // Running: Sine wave oscillation
                const legOffset = Math.sin(this.runFrame) * 8;
                
                // Leg 1
                ctx.fillRect(12 + legOffset, 35, 6, 9);
                // Leg 2
                ctx.fillRect(22 - legOffset, 35, 6, 9);
            }

            // 7. Arm
            ctx.fillRect(22, 18, 10, 4);

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type; // 'cactus' or 'bird'
            this.x = canvas.width + 100;
            this.markedForDeletion = false;

            if (type === 'cactus') {
                // Varying sizes for rhythm
                const sizeVar = Math.random();
                if (sizeVar > 0.7) {
                    // Large Cluster
                    this.w = 40;
                    this.h = 50;
                    this.variant = 'large';
                } else {
                    // Small Single
                    this.w = 20;
                    this.h = 35;
                    this.variant = 'small';
                }
                this.y = GROUND_Y - this.h;
                this.color = '#f0f0f0';
            } else {
                // Bird
                this.w = 40;
                this.h = 30;
                // Heights: Low (jump over), Mid (duck - visual only for now)
                const heights = [GROUND_Y - 40, GROUND_Y - 80];
                this.y = heights[Math.floor(Math.random() * heights.length)];
                this.color = '#f0f0f0';
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= speed;
            if (this.x + this.w < -50) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.15;
        }

        draw() {
            ctx.fillStyle = this.color;
            
            if (this.type === 'cactus') {
                if (this.variant === 'small') {
                    // Simple block
                    ctx.fillRect(this.x, this.y, this.w, this.h);
                    // Arm
                    ctx.fillRect(this.x + 5, this.y + 10, 5, 5);
                } else {
                    // Cluster
                    ctx.fillRect(this.x, this.y + 10, this.w, this.h - 10); // Base
                    ctx.fillRect(this.x + 5, this.y, 10, this.h); // Center tall
                    ctx.fillRect(this.x - 5, this.y + 15, 5, 5); // Left arm
                    ctx.fillRect(this.x + this.w, this.y + 20, 5, 5); // Right arm
                }
            } else {
                // Bird
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Body
                ctx.fillRect(0, 10, 30, 8);
                
                // Wings
                const wingY = Math.sin(this.wingFrame) * 12;
                ctx.beginPath();
                ctx.moveTo(10, 10);
                ctx.lineTo(20, 10 - wingY - 10);
                ctx.lineTo(30, 10);
                ctx.fill();

                // Beak
                ctx.fillRect(30, 12, 10, 4);
                
                ctx.restore();
            }
        }
    }

    class Particle {
        constructor(x, y, color, type) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 3 + 1;
            this.speedX = (Math.random() * 2 - 1) - (speed * 0.2); // Drift left
            this.speedY = (Math.random() * 2 - 1);
            this.color = color;
            this.life = 1.0;
            this.type = type;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.03;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    // --- GAME LOOP ---

    const dino = new Dino();
    let obstacleTimer = 0;

    // Cloud Generator
    function initClouds() {
        for(let i=0; i<5; i++) {
            clouds.push({
                x: Math.random() * canvas.width,
                y: Math.random() * 200 + 50,
                w: 60 + Math.random() * 40,
                speed: 0.5 + Math.random() * 0.5
            });
        }
    }
    initClouds();

    function spawnObstacle() {
        // Logic to prevent impossible jumps
        const type = Math.random() > 0.8 ? 'bird' : 'cactus';
        obstacles.push(new Obstacle(type));
    }

    function resetGame() {
        dino.y = GROUND_Y - dino.h;
        dino.dy = 0;
        obstacles = [];
        particles = [];
        score = 0;
        speed = BASE_SPEED;
        gameOver = false;
        gameRunning = true;
        
        // UI Reset
        startScreen.style.display = 'none';
        gameOverTitle.style.display = 'none';
        
        obstacleTimer = 0;
        animate();
    }

    function checkCollision(rect1, rect2) {
        // Tighter hitboxes for fairness
        const padding = 6;
        return (
            rect1.x + padding < rect2.x + rect2.w - padding &&
            rect1.x + rect1.w - padding > rect2.x + padding &&
            rect1.y + padding < rect2.y + rect2.h - padding &&
            rect1.y + rect1.h - padding > rect2.y + padding
        );
    }

    function drawEnvironment() {
        // 1. Background (Clear)
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 2. Clouds (Parallax Layer 1)
        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        clouds.forEach(cloud => {
            cloud.x -= cloud.speed;
            if(cloud.x + cloud.w < 0) cloud.x = canvas.width + 50;
            
            // Draw blocky cloud
            ctx.fillRect(cloud.x, cloud.y, cloud.w, 10);
            ctx.fillRect(cloud.x + 10, cloud.y - 10, cloud.w - 20, 10);
        });

        // 3. Ground Line
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(canvas.width, GROUND_Y);
        ctx.strokeStyle = '#f0f0f0';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 4. Ground Texture (Moving Dashes)
        ctx.fillStyle = '#333';
        const dashSize = 20;
        const gap = 40;
        groundOffset = (groundOffset + speed) % (dashSize + gap);
        
        for(let i = -1; i < canvas.width / (dashSize + gap) + 1; i++) {
            ctx.fillRect((i * (dashSize + gap)) - groundOffset, GROUND_Y + 10, dashSize, 2);
            ctx.fillRect((i * (dashSize + gap)) - groundOffset + 10, GROUND_Y + 20, dashSize/2, 2);
        }
    }

    function animate() {
        if (!gameRunning) return;

        frame++;

        // Update Difficulty
        speed += 0.002; // Slow acceleration
        score += (speed * 0.05);
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');

        // Update Velocity UI
        const velPercent = Math.min(((speed - BASE_SPEED) / 10) * 100, 100);
        speedBar.style.width = `${Math.max(5, velPercent)}%`;
        velVal.innerText = Math.floor(speed * 10) + " km/h";

        // Draw World
        drawEnvironment();

        // Obstacle Spawning Logic
        obstacleTimer++;
        // Calculate minimum distance based on speed to ensure jumpable gaps
        const minGap = 60 + (speed * 4); 
        
        // Simple timer based spawn with randomness
        if (obstacleTimer > (minGap / speed) * 10) { 
            if (Math.random() < 0.05) { // 5% chance per frame after gap time
                spawnObstacle();
                obstacleTimer = 0;
            }
        }

        // Handle Obstacles
        obstacles.forEach((obs, index) => {
            obs.update();
            obs.draw();
            
            // Collision Check
            const dinoHitbox = {x: dino.x, y: dino.y, w: dino.w, h: dino.h};
            const obsHitbox = {x: obs.x, y: obs.y, w: obs.w, h: obs.h};

            if (checkCollision(dinoHitbox, obsHitbox)) {
                endGame();
            }

            if (obs.markedForDeletion) obstacles.splice(index, 1);
        });

        // Handle Particles
        particles.forEach((p, index) => {
            p.update();
            p.draw();
            if (p.life <= 0) particles.splice(index, 1);
        });

        // Dino
        dino.update();
        dino.draw();

        if (gameRunning) requestAnimationFrame(animate);
    }

    function endGame() {
        gameRunning = false;
        gameOver = true;
        
        // High Score Logic
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('chrono_hs', highScore);
            highScoreEl.innerText = Math.floor(highScore).toString().padStart(5, '0');
        }

        // Visual Feedback
        createExplosion(dino.x + dino.w/2, dino.y + dino.h/2);
        
        // UI Update
        startScreen.style.display = 'flex';
        gameOverTitle.style.display = 'block';
    }

    function createExplosion(x, y) {
        for(let i=0; i<30; i++) {
            particles.push(new Particle(x, y, '#ff3b30', 'spark'));
        }
    }

    // --- INPUTS ---

    function handleInput(e) {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            if (!gameRunning && !gameOver) {
                resetGame();
            } else if (gameOver) {
                resetGame();
            } else {
                dino.jump();
            }
        }
    }

    window.addEventListener('keydown', handleInput);
    
    // Touch support
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!gameRunning && !gameOver) resetGame();
        else if (gameOver) resetGame();
        else dino.jump();
    }, {passive: false});

    // Initial Draw (Static Scene)
    function initDraw() {
        drawEnvironment();
        dino.draw();
        // Draw a static obstacle to show gameplay intent
        const previewObs = new Obstacle('cactus');
        previewObs.x = 400;
        previewObs.draw();
        
        const previewBird = new Obstacle('bird');
        previewBird.x = 600;
        previewBird.y = GROUND_Y - 80;
        previewBird.draw();
    }

    initDraw();

</script>
</body>
</html>
