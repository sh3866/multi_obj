<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONO RUNNER // GAMEPLAY</title>
    <style>
        :root {
            /* Palette: Modern-Retro (High Contrast) */
            --bg-sky-top: #2b2d42;
            --bg-sky-bot: #8d99ae;
            --ground-color: #3c2f2f;
            --accent-primary: #ef233c; /* Urgent Red */
            --accent-highlight: #ffd60a; /* Cyber Yellow */
            --text-main: #edf2f4;
            --text-muted: #8d99ae;
            
            /* Typography */
            --font-stack: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main Game Window */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 1024px;
            aspect-ratio: 16/9;
            background: var(--bg-sky-top);
            box-shadow: 0 0 0 2px #333, 0 40px 100px rgba(0,0,0,0.7);
            overflow: hidden;
            border-radius: 8px;
        }

        /* CRT & Atmosphere Effects */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.5;
        }
        
        .vignette {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 101;
        }

        /* HUD Layer - Anchored, High Contrast */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            padding: 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Bar */
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        /* Top Left: Game Title (Replaces System Status) */
        .title-block {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .game-title {
            font-size: 24px;
            color: var(--text-main);
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 900;
            font-style: italic;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }
        .game-subtitle {
            font-size: 10px;
            color: var(--accent-highlight);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Top Right: Score Cluster */
        .score-group {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        .score-label {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .score-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }
        .score-value {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -1px;
            color: var(--text-main);
            line-height: 1;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }
        .hi-score {
            font-size: 16px;
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 2px 6px;
            background: rgba(0,0,0,0.6);
            border-radius: 2px;
        }

        /* Bottom Right: Velocity (Dynamic Speedometer) */
        .velocity-container {
            position: absolute;
            bottom: 32px;
            right: 32px;
            width: 200px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }
        .velocity-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: flex-end;
        }
        .vel-label {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 1px;
            font-weight: bold;
        }
        .vel-value {
            font-size: 16px;
            color: var(--accent-highlight);
            font-weight: 900;
            font-family: monospace;
        }
        .velocity-track {
            width: 100%;
            height: 8px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            position: relative;
        }
        .velocity-fill {
            height: 100%;
            width: 20%;
            background: var(--accent-primary);
            box-shadow: 0 0 10px var(--accent-primary);
            transition: width 0.1s linear;
        }
        /* Ticks for speedometer */
        .velocity-ticks {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(90deg, transparent 0, transparent 9px, rgba(0,0,0,0.5) 9px, rgba(0,0,0,0.5) 10px);
        }

        /* Center Overlay: Persistent Jump Instruction */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 60;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .prompt-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            text-align: center;
            background: rgba(0,0,0,0.4);
            padding: 24px 48px;
            border-radius: 4px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .game-over-msg {
            color: var(--accent-primary);
            font-size: 48px;
            font-weight: 900;
            letter-spacing: -2px;
            text-transform: uppercase;
            text-shadow: 4px 4px 0 #000;
            margin-bottom: 10px;
            display: none;
            line-height: 1;
        }

        .action-prompt {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .prompt-text {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Distinct Keycap - Modern Retro */
        .key-badge {
            border: 1px solid rgba(255,255,255,0.3);
            color: var(--text-main);
            padding: 12px 32px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(to bottom, rgba(255,255,255,0.1), rgba(0,0,0,0.2));
            border-radius: 4px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.5);
            animation: pulse 2s infinite ease-in-out;
            position: relative;
        }
        .key-badge::before {
            content: '';
            position: absolute;
            top: 2px; left: 2px; right: 2px; height: 40%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.2), transparent);
            border-radius: 2px;
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(4px); box-shadow: 0 0px 0 rgba(0,0,0,0.5); }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated; 
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Visual Overlays -->
        <div class="scanlines"></div>
        <div class="vignette"></div>
        
        <!-- HUD Layer -->
        <div class="hud">
            <div class="hud-top">
                <!-- Left: Title (Identity) -->
                <div class="title-block">
                    <span class="game-title">Chrono Runner</span>
                    <span class="game-subtitle">Offline Mode</span>
                </div>

                <!-- Right: Score -->
                <div class="score-group">
                    <span class="score-label">Distance</span>
                    <div class="score-row">
                        <span class="score-value" id="score">00000</span>
                        <span class="hi-score">HI <span id="highScore">00000</span></span>
                    </div>
                </div>
            </div>

            <!-- Bottom Right: Velocity -->
            <div class="velocity-container">
                <div class="velocity-header">
                    <span class="vel-label">VELOCITY</span>
                    <span class="vel-value" id="velVal">0 KM/H</span>
                </div>
                <div class="velocity-track">
                    <div class="velocity-ticks"></div>
                    <div class="velocity-fill" id="speedBar"></div>
                </div>
            </div>
        </div>

        <!-- Overlay (Start / Game Over) -->
        <div class="overlay" id="startScreen">
            <div class="prompt-container">
                <div class="game-over-msg" id="gameOverTitle">CRITICAL ERROR</div>
                <div class="action-prompt">
                    <span class="prompt-text">Press to Jump</span>
                    <div class="key-badge">SPACE</div>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

<script>
    /**
     * CHRONO RUNNER - GAMEPLAY FOCUS
     * Changes applied:
     * - Removed "System Online" text.
     * - Replaced Title Overlay with Gameplay View.
     * - Added Dino, Ground, Cacti, Bird.
     * - Improved Visual System (Typography, Contrast).
     */

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const startScreen = document.getElementById('startScreen');
    const gameOverTitle = document.getElementById('gameOverTitle');
    const speedBar = document.getElementById('speedBar');
    const velVal = document.getElementById('velVal');

    // Game Configuration
    const GAME_WIDTH = 960;
    const GAME_HEIGHT = 540;
    
    // Physics
    const GROUND_Y = 400; 
    const GRAVITY = 0.65;
    const JUMP_FORCE = -14.5;
    const BASE_SPEED = 8;
    
    // State
    let gameRunning = false;
    let gameOver = false;
    let frame = 0;
    let score = 0;
    let speed = BASE_SPEED;
    let highScore = localStorage.getItem('chrono_hs') || 0;
    let obstacles = [];
    let particles = [];
    let clouds = [];
    let mountains = [];
    let groundOffset = 0;
    let stars = [];

    // Initialize High Score UI
    highScoreEl.innerText = Math.floor(highScore).toString().padStart(5, '0');

    // Resize Handler
    function resize() {
        const container = canvas.parentElement;
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        
        initEnvironment();
    }
    window.addEventListener('resize', resize);
    resize();

    // --- CLASSES ---

    class Dino {
        constructor() {
            this.w = 50;
            this.h = 50;
            this.x = 100; // Positioned clearly on left
            this.y = GROUND_Y - this.h;
            this.dy = 0;
            this.grounded = true;
            this.runFrame = 0;
            this.color = '#FFFFFF'; 
            this.jumpSquash = 1;
            this.headBob = 0;
        }

        jump() {
            if (this.grounded) {
                this.dy = JUMP_FORCE;
                this.grounded = false;
                // Spawn dust
                for(let i=0; i<10; i++) {
                    particles.push(new Particle(this.x + 15, this.y + this.h, '#e0e0e0', 'dust'));
                }
            }
        }

        update() {
            this.dy += GRAVITY;
            this.y += this.dy;

            if (this.y + this.h >= GROUND_Y) {
                this.y = GROUND_Y - this.h;
                this.dy = 0;
                this.grounded = true;
                this.jumpSquash = 0.85; 
            } else {
                this.grounded = false;
                this.jumpSquash = 1.1; 
            }

            // Restore squash/stretch
            this.jumpSquash += (1 - this.jumpSquash) * 0.2;

            if (this.grounded) {
                this.runFrame += 0.3 + (speed * 0.02);
                this.headBob = Math.sin(this.runFrame * 2) * 2;
            } else {
                this.headBob = 0;
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.scale(1, this.jumpSquash);
            ctx.fillStyle = this.color;

            // Draw distinct silhouette using blocks (Crisp Silhouette Readability)
            
            // Head (with bob)
            ctx.fillRect(22, 0 + this.headBob, 28, 18);
            
            // Eye (Black cutout)
            ctx.fillStyle = '#000';
            ctx.fillRect(38, 6 + this.headBob, 4, 4);
            ctx.fillStyle = this.color;

            // Neck
            ctx.fillRect(22, 12 + this.headBob, 12, 8);
            
            // Body
            ctx.fillRect(8, 18, 26, 22);
            
            // Tail
            ctx.beginPath();
            ctx.moveTo(8, 22);
            ctx.lineTo(-4, 16); 
            ctx.lineTo(8, 30);
            ctx.fill();

            // Arm
            ctx.fillRect(26, 22, 12, 5);

            // Legs
            if (!this.grounded) {
                // Tucked legs for jump
                ctx.fillRect(12, 40, 8, 8);
                ctx.fillRect(26, 40, 8, 8);
            } else {
                // Running animation
                const legOffset = Math.sin(this.runFrame) * 10;
                // Leg 1
                ctx.fillRect(12 + (legOffset > 0 ? legOffset : 0), 40, 8, 10);
                // Leg 2
                ctx.fillRect(26 + (legOffset < 0 ? legOffset : 0), 40, 8, 10);
            }

            ctx.restore();
        }
    }

    class Obstacle {
        constructor(type) {
            this.type = type; 
            this.x = canvas.width + 100;
            this.markedForDeletion = false;
            this.color = '#1a1a1a'; // Dark silhouette against light sky

            if (type === 'cactus') {
                const sizeVar = Math.random();
                if (sizeVar > 0.7) {
                    // Large Cluster
                    this.w = 45;
                    this.h = 55;
                    this.variant = 'large';
                } else {
                    // Small Single
                    this.w = 22;
                    this.h = 38;
                    this.variant = 'small';
                }
                this.y = GROUND_Y - this.h;
            } else {
                // Bird
                this.w = 45;
                this.h = 35;
                const heights = [GROUND_Y - 50, GROUND_Y - 90];
                this.y = heights[Math.floor(Math.random() * heights.length)];
                this.wingFrame = 0;
            }
        }

        update() {
            this.x -= speed;
            if (this.x + this.w < -50) this.markedForDeletion = true;
            if (this.type === 'bird') this.wingFrame += 0.15;
        }

        draw() {
            ctx.fillStyle = this.color;
            
            if (this.type === 'cactus') {
                if (this.variant === 'small') {
                    // Minimalist Cactus
                    ctx.fillRect(this.x + 7, this.y, 8, this.h);
                    ctx.fillRect(this.x, this.y + 12, 7, 5); 
                    ctx.fillRect(this.x, this.y + 5, 5, 12); 
                    ctx.fillRect(this.x + 15, this.y + 18, 7, 5); 
                    ctx.fillRect(this.x + 17, this.y + 11, 5, 12); 
                } else {
                    // Cluster
                    ctx.fillRect(this.x + 5, this.y, 12, this.h); 
                    ctx.fillRect(this.x + 22, this.y + 15, 12, this.h - 15); 
                    ctx.fillRect(this.x - 6, this.y + 25, 12, this.h - 25); 
                }
            } else {
                // Bird
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Body
                ctx.fillRect(0, 10, 35, 10);
                
                // Wings
                const wingY = Math.sin(this.wingFrame) * 18;
                ctx.beginPath();
                ctx.moveTo(12, 10);
                ctx.lineTo(22, 10 - wingY - 12);
                ctx.lineTo(32, 10);
                ctx.fill();

                // Beak
                ctx.fillRect(35, 12, 10, 5);
                
                ctx.restore();
            }
        }
    }

    class Particle {
        constructor(x, y, color, type) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 4 + 2;
            this.speedX = (Math.random() * 3 - 1.5) - (speed * 0.3); 
            this.speedY = (Math.random() * 2 - 1);
            this.color = color;
            this.life = 1.0;
            this.type = type;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.03;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    // --- GAME LOOP & LOGIC ---

    const dino = new Dino();
    let obstacleTimer = 0;

    // Environment Generators
    function initEnvironment() {
        // Stars (distant)
        stars = [];
        for(let i=0; i<40; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * (GROUND_Y - 100),
                size: Math.random() * 2 + 1,
                alpha: Math.random() * 0.5 + 0.1
            });
        }

        // Clouds (Mid)
        clouds = [];
        for(let i=0; i<5; i++) {
            clouds.push({
                x: Math.random() * canvas.width,
                y: Math.random() * 200 + 50,
                w: 80 + Math.random() * 60,
                speed: 0.2 + Math.random() * 0.3,
                alpha: 0.2
            });
        }

        // Mountains (Parallax Background)
        mountains = [];
        let currentX = 0;
        while(currentX < canvas.width + 200) {
            const w = 100 + Math.random() * 150;
            const h = 80 + Math.random() * 120;
            mountains.push({x: currentX, w: w, h: h});
            currentX += w - 40; // Overlap
        }
    }

    function spawnObstacle() {
        if (obstacles.length > 0) {
            const lastObs = obstacles[obstacles.length - 1];
            if (canvas.width - lastObs.x < 250) return; 
        }
        const type = Math.random() > 0.7 ? 'bird' : 'cactus';
        obstacles.push(new Obstacle(type));
    }

    function resetGame() {
        dino.y = GROUND_Y - dino.h;
        dino.dy = 0;
        obstacles = [];
        particles = [];
        score = 0;
        speed = BASE_SPEED;
        gameOver = false;
        gameRunning = true;
        
        startScreen.classList.add('hidden');
        gameOverTitle.style.display = 'none';
        
        obstacleTimer = 0;
        animate();
    }

    function checkCollision(rect1, rect2) {
        const padding = 8;
        return (
            rect1.x + padding < rect2.x + rect2.w - padding &&
            rect1.x + rect1.w - padding > rect2.x + padding &&
            rect1.y + padding < rect2.y + rect2.h - padding &&
            rect1.y + rect1.h - padding > rect2.y + padding
        );
    }

    function drawEnvironment() {
        // 1. Sky Gradient
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, '#2b2d42');
        gradient.addColorStop(1, '#8d99ae');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. Geometric Sun
        ctx.fillStyle = 'rgba(239, 35, 60, 0.1)';
        ctx.beginPath();
        ctx.arc(canvas.width * 0.7, GROUND_Y - 50, 80, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(239, 35, 60, 0.3)';
        ctx.beginPath();
        ctx.arc(canvas.width * 0.7, GROUND_Y - 50, 60, 0, Math.PI * 2);
        ctx.fill();

        // 3. Stars (Distant)
        ctx.fillStyle = '#FFFFFF';
        stars.forEach(star => {
            ctx.globalAlpha = star.alpha;
            ctx.fillRect(star.x, star.y, star.size, star.size);
        });
        ctx.globalAlpha = 1.0;

        // 4. Mountains (Parallax Layer 1)
        ctx.fillStyle = '#5c5656'; // Darker dust color
        mountains.forEach(mt => {
            mt.x -= speed * 0.1; // Move slowly
            if (mt.x + mt.w < -50) mt.x = canvas.width + 50;
            
            ctx.beginPath();
            ctx.moveTo(mt.x, GROUND_Y);
            ctx.lineTo(mt.x + mt.w/2, GROUND_Y - mt.h);
            ctx.lineTo(mt.x + mt.w, GROUND_Y);
            ctx.fill();
        });

        // 5. Clouds (Parallax Layer 2)
        clouds.forEach(cloud => {
            cloud.x -= cloud.speed;
            if(cloud.x + cloud.w < 0) cloud.x = canvas.width + 50;
            
            ctx.fillStyle = `rgba(255, 255, 255, ${cloud.alpha})`;
            ctx.fillRect(cloud.x, cloud.y, cloud.w, 12);
            ctx.fillRect(cloud.x + 15, cloud.y - 12, cloud.w - 30, 12);
        });

        // 6. Ground Line
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(canvas.width, GROUND_Y);
        ctx.strokeStyle = '#3c2f2f';
        ctx.lineWidth = 3;
        ctx.stroke();

        // 7. Ground Texture (Moving Dashes)
        ctx.fillStyle = '#3c2f2f';
        const dashSize = 30;
        const gap = 50;
        groundOffset = (groundOffset + speed) % (dashSize + gap);
        
        for(let i = -1; i < canvas.width / (dashSize + gap) + 1; i++) {
            ctx.fillRect((i * (dashSize + gap)) - groundOffset, GROUND_Y + 15, dashSize, 3);
            ctx.fillRect((i * (dashSize + gap)) - groundOffset + 20, GROUND_Y + 25, dashSize/2, 3);
        }
    }

    function animate() {
        if (!gameRunning) return;

        frame++;

        // Update Difficulty
        speed += 0.005; 
        score += (speed * 0.05);
        scoreEl.innerText = Math.floor(score).toString().padStart(5, '0');

        // Update Velocity UI
        const velPercent = Math.min(((speed - BASE_SPEED) / 10) * 100, 100);
        speedBar.style.width = `${Math.max(5, velPercent)}%`;
        velVal.innerText = Math.floor(speed * 12) + " KM/H";

        // Draw World
        drawEnvironment();

        // Obstacle Spawning
        obstacleTimer++;
        const minGapFrames = 45 + (speed * 3); 
        
        if (obstacleTimer > minGapFrames) { 
            if (Math.random() < 0.025) { 
                spawnObstacle();
                obstacleTimer = 0;
            }
        }

        // Handle Obstacles
        obstacles.forEach((obs, index) => {
            obs.update();
            obs.draw();
            
            const dinoHitbox = {x: dino.x, y: dino.y, w: dino.w, h: dino.h};
            const obsHitbox = {x: obs.x, y: obs.y, w: obs.w, h: obs.h};

            if (checkCollision(dinoHitbox, obsHitbox)) {
                endGame();
            }

            if (obs.markedForDeletion) obstacles.splice(index, 1);
        });

        // Handle Particles
        particles.forEach((p, index) => {
            p.update();
            p.draw();
            if (p.life <= 0) particles.splice(index, 1);
        });

        // Dino
        dino.update();
        dino.draw();

        if (gameRunning) requestAnimationFrame(animate);
    }

    function endGame() {
        gameRunning = false;
        gameOver = true;
        
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('chrono_hs', highScore);
            highScoreEl.innerText = Math.floor(highScore).toString().padStart(5, '0');
        }

        createExplosion(dino.x + dino.w/2, dino.y + dino.h/2);
        
        startScreen.classList.remove('hidden');
        gameOverTitle.style.display = 'block';
    }

    function createExplosion(x, y) {
        for(let i=0; i<40; i++) {
            particles.push(new Particle(x, y, '#ef233c', 'spark'));
        }
    }

    // --- INPUTS ---

    function handleInput(e) {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            if (!gameRunning && !gameOver) {
                resetGame();
            } else if (gameOver) {
                resetGame();
            } else {
                dino.jump();
            }
        }
    }

    window.addEventListener('keydown', handleInput);
    
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!gameRunning && !gameOver) resetGame();
        else if (gameOver) resetGame();
        else dino.jump();
    }, {passive: false});

    // Initial Draw (Static Scene)
    function initDraw() {
        drawEnvironment();
        dino.draw();
        
        // Preview Obstacles for context (As requested by critique)
        const previewObs = new Obstacle('cactus');
        previewObs.x = 400;
        previewObs.draw();
        
        const previewBird = new Obstacle('bird');
        previewBird.x = 650;
        previewBird.y = GROUND_Y - 85;
        previewBird.draw();
    }

    initDraw();

</script>
</body>
</html>
