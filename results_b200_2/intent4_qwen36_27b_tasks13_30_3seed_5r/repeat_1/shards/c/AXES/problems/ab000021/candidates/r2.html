<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Architecture & Data Flow</title>
    <style>
        :root {
            /* Palette - Technical Blueprint */
            --bg-dark: #0b0f19;
            --bg-panel: #131b2b;
            --bg-card: #161f30;
            --border-color: #2d3a4f;
            --border-highlight: #4a5d7a;
            
            /* Semantic Colors */
            --c-data: #38bdf8;    /* Cyan - Data */
            --c-instr: #fbbf24;   /* Amber - Instructions */
            --c-ctrl: #4ade80;    /* Green - Control */
            
            /* Typography Colors */
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Technical Background Grid */
        .bg-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--border-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.25;
            z-index: -1;
            pointer-events: none;
        }

        /* Header */
        header {
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 15, 25, 0.9);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(4px);
            z-index: 100;
        }

        .title-block {
            display: flex;
            flex-direction: column;
        }

        .title-block h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: #fff;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .title-block .meta {
            font-size: 0.75rem;
            color: var(--text-dim);
            font-family: 'Courier New', monospace;
            letter-spacing: 0.05em;
        }

        /* Legend - Top Left as requested */
        .legend {
            display: flex;
            gap: 20px;
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background: rgba(19, 27, 43, 0.5);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
        }

        .swatch {
            width: 24px;
            height: 2px;
            background: currentColor;
            position: relative;
        }
        
        /* Legend specific styles for line types */
        .swatch.data { background: var(--c-data); }
        .swatch.instr { background: var(--c-instr); box-shadow: 0 0 0 1px var(--c-instr); height: 4px; }
        .swatch.ctrl { 
            background: transparent; 
            border-bottom: 2px dashed var(--c-ctrl); 
            height: 0;
            width: 20px;
        }

        /* Main SVG Container */
        main {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
            max-width: 1600px;
            overflow: visible;
        }

        /* SVG Component Styles */
        .node-box {
            fill: var(--bg-card);
            stroke: var(--border-color);
            stroke-width: 1.5px;
            rx: 6px;
            transition: all 0.3s ease;
        }

        .node-box:hover {
            stroke: var(--border-highlight);
            fill: #1c263b;
        }

        /* Specific Component Accents */
        .accent-top {
            stroke: var(--border-highlight);
            stroke-width: 2px;
            stroke-linecap: round;
        }

        /* Typography */
        .node-title {
            fill: #fff;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 700;
            font-size: 14px;
            text-anchor: middle;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .node-sub {
            fill: var(--text-dim);
            font-size: 11px;
            font-family: 'Courier New', monospace;
            text-anchor: middle;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Connection Lines */
        .link-path {
            fill: none;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        /* Data Line (Thick Solid) */
        .link-data {
            stroke: var(--c-data);
            stroke-width: 3px;
        }

        /* Instruction Line (Thick Solid - distinct weight) */
        .link-instr {
            stroke: var(--c-instr);
            stroke-width: 3.5px;
        }

        /* Control Line (Dashed) */
        .link-ctrl {
            stroke: var(--c-ctrl);
            stroke-width: 2px;
            stroke-dasharray: 6, 4;
        }

        /* Animated Packets */
        .packet {
            fill: none;
            stroke-linecap: round;
            opacity: 0; /* Hidden by default, handled by animation */
        }
        
        .packet-data {
            stroke: var(--c-data);
            stroke-width: 4px;
            stroke-dasharray: 15 300;
            animation: dash 3s linear infinite;
        }

        .packet-instr {
            stroke: var(--c-instr);
            stroke-width: 5px;
            stroke-dasharray: 15 300;
            animation: dash 2.5s linear infinite;
        }

        .packet-ctrl {
            stroke: var(--c-ctrl);
            stroke-width: 2px;
            stroke-dasharray: 5 300;
            stroke-dashoffset: 0;
            animation: dash-ctrl 2s linear infinite;
        }

        @keyframes dash {
            0% { opacity: 1; stroke-dashoffset: 315; }
            100% { opacity: 1; stroke-dashoffset: -15; }
        }
        
        @keyframes dash-ctrl {
            0% { opacity: 1; stroke-dashoffset: 305; }
            100% { opacity: 1; stroke-dashoffset: -5; }
        }

        /* Labels on Lines */
        .label-bg {
            fill: var(--bg-dark);
            stroke: var(--border-color);
            stroke-width: 1;
            rx: 3;
        }

        .link-label {
            fill: var(--text-dim);
            font-size: 10px;
            font-weight: 600;
            font-family: 'Segoe UI', sans-serif;
            text-anchor: middle;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Icons */
        .icon-path {
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        /* Schematic Patterns */
        .pattern-grid {
            fill: url(#grid-pattern);
        }

    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <header>
        <div class="title-block">
            <h1>System Architecture</h1>
            <div class="meta">Fig 2.1 // Von Neumann Topology & Signal Flow</div>
        </div>
        <div class="legend">
            <div class="legend-item">
                <div class="swatch data"></div>
                <span>Data</span>
            </div>
            <div class="legend-item">
                <div class="swatch instr"></div>
                <span>Instructions</span>
            </div>
            <div class="legend-item">
                <div class="swatch ctrl"></div>
                <span>Control</span>
            </div>
        </div>
    </header>

    <main id="canvas">
        <!-- SVG Generated Here -->
    </main>

    <script>
        // --- Configuration ---
        const colors = {
            data: '#38bdf8',
            instr: '#fbbf24',
            ctrl: '#4ade80',
            cpu: '#ffffff',
            gpu: '#d8b4fe', // Muted purple
            mem: '#60a5fa', // Muted blue
            stor: '#fb923c', // Muted orange
            io: '#94a3b8'
        };

        // Layout: 1280x800 Grid
        // Hierarchy: CPU Center, RAM Top, Storage Bottom, Net Bottom-Left, IO Right
        const components = {
            cpu: { x: 490, y: 300, w: 300, h: 200, label: "CPU", sub: "Central Processing Unit" },
            mem: { x: 490, y: 60,  w: 300, h: 120, label: "RAM", sub: "System Memory" },
            gpu: { x: 900, y: 300, w: 240, h: 200, label: "GPU", sub: "Graphics Processor" },
            stor:{ x: 490, y: 620, w: 300, h: 100, label: "Storage", sub: "NVMe SSD" },
            net: { x: 120, y: 620, w: 240, h: 100, label: "Network", sub: "NIC / Interface" },
            inp: { x: 120, y: 300, w: 240, h: 200, label: "Input", sub: "Keyboard / Mouse" },
            out: { x: 900, y: 550, w: 240, h: 170, label: "Output", sub: "Display / Audio" }
        };

        // Connections
        // Note: Network connected to CPU. GPU connected to Output.
        const connections = [
            // CPU <-> RAM (The Critical Path)
            { from: 'cpu', to: 'mem', type: 'data', label: 'Data Load/Store' },
            { from: 'mem', to: 'cpu', type: 'instr', label: 'Instruction Fetch' },
            { from: 'cpu', to: 'mem', type: 'ctrl', label: 'Bus Control' },

            // CPU <-> GPU
            { from: 'cpu', to: 'gpu', type: 'data', label: 'Command Buffer' },
            { from: 'gpu', to: 'mem', type: 'data', label: 'Texture Data' },

            // CPU <-> Storage
            { from: 'cpu', to: 'stor', type: 'ctrl', label: 'Read Request' },
            { from: 'stor', to: 'cpu', type: 'data', label: 'Page File / Assets' },

            // CPU <-> Network
            { from: 'cpu', to: 'net', type: 'data', label: 'TX Packets' },
            { from: 'net', to: 'cpu', type: 'ctrl', label: 'Interrupt (RX)' },

            // I/O
            { from: 'inp', to: 'cpu', type: 'ctrl', label: 'Interrupt' },
            { from: 'gpu', to: 'out', type: 'data', label: 'Video Signal' },
        ];

        // --- SVG Generators ---

        const getCenter = (id) => {
            const c = components[id];
            return { x: c.x + c.w/2, y: c.y + c.h/2 };
        };

        // Orthogonal routing logic (Manhattan style)
        // Returns { d: pathString, elbow: {x,y} }
        const getOrthoPath = (id1, id2) => {
            const s = components[id1];
            const t = components[id2];
            
            const sCenter = getCenter(id1);
            const tCenter = getCenter(id2);
            
            let sx, sy, ex, ey;
            let elbowX, elbowY;

            const dx = tCenter.x - sCenter.x;
            const dy = tCenter.y - sCenter.y;

            // Determine primary axis
            if (Math.abs(dx) > Math.abs(dy)) {
                // Horizontal primary
                sx = dx > 0 ? s.x + s.w : s.x;
                sy = sCenter.y;
                ex = dx > 0 ? t.x : t.x + t.w;
                ey = tCenter.y;
                
                elbowX = (sx + ex) / 2;
                elbowY = sy;
            } else {
                // Vertical primary
                sx = sCenter.x;
                sy = dy > 0 ? s.y + s.h : s.y;
                ex = tCenter.x;
                ey = dy > 0 ? t.y : t.y + t.h;
                
                elbowX = sx;
                elbowY = (sy + ey) / 2;
            }

            // Path string
            const d = `M ${sx} ${sy} L ${elbowX} ${elbowY} L ${ex} ${ey}`;
            
            // For label placement:
            // If vertical primary, label goes on the vertical segment (elbowX, elbowY + offset)
            // If horizontal primary, label goes on the horizontal segment (elbowX + offset, elbowY)
            // Simplified: Place at the elbow point
            
            return { d, elbow: { x: elbowX, y: elbowY } };
        };

        const createSVG = () => {
            const ns = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(ns, "svg");
            svg.setAttribute("viewBox", "0 0 1280 800");
            svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

            // Defs
            const defs = document.createElementNS(ns, "defs");
            
            // Grid Pattern for CPU Die
            const pattern = document.createElementNS(ns, "pattern");
            pattern.setAttribute("id", "grid-pattern");
            pattern.setAttribute("width", "10");
            pattern.setAttribute("height", "10");
            pattern.setAttribute("patternUnits", "userSpaceOnUse");
            const pRect = document.createElementNS(ns, "rect");
            pRect.setAttribute("width", "10"); pRect.setAttribute("height", "10");
            pRect.setAttribute("fill", "none");
            pRect.setAttribute("stroke", "#334155");
            pRect.setAttribute("stroke-width", "0.5");
            pattern.appendChild(pRect);
            defs.appendChild(pattern);

            // Arrowhead Markers
            const createMarker = (id, color) => {
                const m = document.createElementNS(ns, "marker");
                m.setAttribute("id", id);
                m.setAttribute("viewBox", "0 0 10 10");
                m.setAttribute("refX", "8"); // Adjust for line width
                m.setAttribute("refY", "5");
                m.setAttribute("markerWidth", "6");
                m.setAttribute("markerHeight", "6");
                m.setAttribute("orient", "auto");
                
                const path = document.createElementNS(ns, "path");
                path.setAttribute("d", "M 0 0 L 10 5 L 0 10 z");
                path.setAttribute("fill", color);
                m.appendChild(path);
                return m;
            };

            defs.appendChild(createMarker('arrow-data', colors.data));
            defs.appendChild(createMarker('arrow-instr', colors.instr));
            defs.appendChild(createMarker('arrow-ctrl', colors.ctrl));
            svg.appendChild(defs);

            // --- Layer 1: Connections ---
            const linksLayer = document.createElementNS(ns, "g");
            linksLayer.setAttribute("id", "links");

            connections.forEach((conn, i) => {
                const { d, elbow } = getOrthoPath(conn.from, conn.to);
                const color = colors[conn.type];
                const marker = `url(#arrow-${conn.type})`;
                const classBase = `link-${conn.type}`;
                const packetClass = `packet-${conn.type}`;

                // 1. Track (Subtle background line)
                const track = document.createElementNS(ns, "path");
                track.setAttribute("d", d);
                track.setAttribute("stroke", color);
                track.setAttribute("stroke-opacity", "0.1");
                track.setAttribute("stroke-width", "8");
                linksLayer.appendChild(track);

                // 2. Active Line (Defined by CSS class)
                const line = document.createElementNS(ns, "path");
                line.setAttribute("d", d);
                line.setAttribute("class", classBase);
                line.setAttribute("marker-end", marker);
                linksLayer.appendChild(line);

                // 3. Animation (Pulse)
                const pulse = document.createElementNS(ns, "path");
                pulse.setAttribute("d", d);
                pulse.setAttribute("class", packetClass);
                // Stagger animations slightly
                pulse.style.animationDelay = `${Math.random() * 1}s`;
                linksLayer.appendChild(pulse);

                // 4. Label (Pill)
                const textLen = conn.label.length * 6.5 + 16; 
                const labelGroup = document.createElementNS(ns, "g");
                
                // Position logic based on elbow
                // Shift slightly away from the exact corner to look clean
                let lx = elbow.x;
                let ly = elbow.y;
                
                // Simple offset logic to prevent overlapping the corner exactly
                if (Math.abs(components[conn.from].x - components[conn.to].x) > Math.abs(components[conn.from].y - components[conn.to].y)) {
                    // Horizontal dominant: label on horizontal segment
                    ly -= 15; 
                } else {
                    // Vertical dominant: label on vertical segment
                    lx += 15;
                }

                labelGroup.setAttribute("transform", `translate(${lx - textLen/2}, ${ly - 10})`);
                
                const bg = document.createElementNS(ns, "rect");
                bg.setAttribute("width", textLen);
                bg.setAttribute("height", 20);
                bg.setAttribute("class", "label-bg");
                
                const txt = document.createElementNS(ns, "text");
                txt.setAttribute("x", textLen/2);
                txt.setAttribute("y", 14);
                txt.setAttribute("class", "link-label");
                txt.textContent = conn.label;

                labelGroup.appendChild(bg);
                labelGroup.appendChild(txt);
                linksLayer.appendChild(labelGroup);
            });
            svg.appendChild(linksLayer);

            // --- Layer 2: Components ---
            const nodesLayer = document.createElementNS(ns, "g");

            // Icon Generators (Schematic Style)
            const drawIcon = (key, g) => {
                const stroke = colors[key === 'cpu' ? 'cpu' : key === 'gpu' ? 'gpu' : 'mem']; // Default accent
                const opacity = 0.8;
                
                g.setAttribute("transform", `translate(${components[key].w/2}, ${components[key].h/2 - 30})`);
                
                // Common setup
                g.setAttribute("stroke", stroke);
                g.setAttribute("opacity", opacity);
                g.setAttribute("class", "icon-path");
                
                if (key === 'cpu') {
                    // Die + Pins
                    const die = document.createElementNS(ns, "rect");
                    die.setAttribute("x", -20); die.setAttribute("y", -20);
                    die.setAttribute("width", 40); die.setAttribute("height", 40);
                    die.setAttribute("rx", 2); 
                    die.setAttribute("fill", "url(#grid-pattern)"); // Use pattern
                    die.setAttribute("stroke-width", "2");
                    g.appendChild(die);
                    
                    // Inner Core
                    const core = document.createElementNS(ns, "rect");
                    core.setAttribute("x", -10); core.setAttribute("y", -10);
                    core.setAttribute("width", 20); core.setAttribute("height", 20);
                    core.setAttribute("fill", "none");
                    core.setAttribute("stroke-dasharray", "2,2");
                    g.appendChild(core);
                } else if (key === 'mem') {
                    // Sticks (RAM)
                    const stickGroup = document.createElementNS(ns, "g");
                    for(let i=0; i<3; i++) {
                        const stick = document.createElementNS(ns, "rect");
                        stick.setAttribute("x", -25 + i*18); stick.setAttribute("y", -15);
                        stick.setAttribute("width", 10); stick.setAttribute("height", 30);
                        stick.setAttribute("rx", 1); 
                        g.appendChild(stick);
                    }
                } else if (key === 'gpu') {
                    // Geometric Cooling/Fan
                    const outer = document.createElementNS(ns, "circle");
                    outer.setAttribute("r", 22);
                    outer.setAttribute("stroke-dasharray", "4,4");
                    g.appendChild(outer);
                    
                    const inner = document.createElementNS(ns, "path");
                    inner.setAttribute("d", "M0 0 L-15 -15 M0 0 L15 -15 M0 0 L0 20"); // Fan blades
                    g.appendChild(inner);
                } else if (key === 'stor') {
                    // Stacked Disks
                    const d1 = document.createElementNS(ns, "ellipse");
                    d1.setAttribute("cx", 0); d1.setAttribute("cy", -10);
                    d1.setAttribute("rx", 25); d1.setAttribute("ry", 8);
                    g.appendChild(d1);
                    const d2 = document.createElementNS(ns, "ellipse");
                    d2.setAttribute("cx", 0); d2.setAttribute("cy", 0);
                    d2.setAttribute("rx", 25); d2.setAttribute("ry", 8);
                    g.appendChild(d2);
                    const d3 = document.createElementNS(ns, "ellipse");
                    d3.setAttribute("cx", 0); d3.setAttribute("cy", 10);
                    d3.setAttribute("rx", 25); d3.setAttribute("ry", 8);
                    g.appendChild(d3);
                } else if (key === 'net') {
                    // Globe / Network Node
                    const circ = document.createElementNS(ns, "circle");
                    circ.setAttribute("r", 20);
                    g.appendChild(circ);
                    const cross = document.createElementNS(ns, "path");
                    cross.setAttribute("d", "M-20 0 L20 0 M0 -20 L0 20 M-14 -14 L14 14 M-14 14 L14 -14");
                    cross.setAttribute("opacity", "0.5");
                    g.appendChild(cross);
                } else if (key === 'inp') {
                    // Keyboard Abstract
                    const kb = document.createElementNS(ns, "rect");
                    kb.setAttribute("x", -25); kb.setAttribute("y", -15);
                    kb.setAttribute("width", 50); kb.setAttribute("height", 30);
                    kb.setAttribute("rx", 4);
                    g.appendChild(kb);
                    // Grid of keys
                    for(let r=0; r<3; r++) {
                        for(let c=0; c<5; c++) {
                            const k = document.createElementNS(ns, "rect");
                            k.setAttribute("x", -20 + c*8); k.setAttribute("y", -10 + r*8);
                            k.setAttribute("width", 4); k.setAttribute("height", 4);
                            k.setAttribute("fill", stroke);
                            k.setAttribute("stroke", "none");
                            g.appendChild(k);
                        }
                    }
                } else if (key === 'out') {
                    // Monitor
                    const scr = document.createElementNS(ns, "rect");
                    scr.setAttribute("x", -25); scr.setAttribute("y", -20);
                    scr.setAttribute("width", 50); scr.setAttribute("height", 35);
                    scr.setAttribute("rx", 2);
                    g.appendChild(scr);
                    const stand = document.createElementNS(ns, "path");
                    stand.setAttribute("d", "M-10 15 L10 15 M0 15 L0 25");
                    g.appendChild(stand);
                }
            };

            Object.keys(components).forEach(key => {
                const comp = components[key];
                const g = document.createElementNS(ns, "g");
                g.setAttribute("id", key);
                g.setAttribute("transform", `translate(${comp.x}, ${comp.y})`);

                // Box
                const rect = document.createElementNS(ns, "rect");
                rect.setAttribute("width", comp.w);
                rect.setAttribute("height", comp.h);
                rect.setAttribute("class", "node-box");
                
                // Top Accent Line (Visual differentiation)
                const accent = document.createElementNS(ns, "path");
                // Calculate accent path (top-left to top-right, rounded)
                accent.setAttribute("d", `M 6 0 L ${comp.w - 6} 0`);
                accent.setAttribute("class", "accent-top");
                accent.setAttribute("stroke", colors[key] || colors.io);

                // Icon Container
                const iconG = document.createElementNS(ns, "g");
                drawIcon(key, iconG);

                // Text
                const txtMain = document.createElementNS(ns, "text");
                txtMain.setAttribute("x", comp.w/2);
                txtMain.setAttribute("y", comp.h/2 + 20);
                txtMain.setAttribute("class", "node-title");
                txtMain.textContent = comp.label;

                const txtSub = document.createElementNS(ns, "text");
                txtSub.setAttribute("x", comp.w/2);
                txtSub.setAttribute("y", comp.h/2 + 40);
                txtSub.setAttribute("class", "node-sub");
                txtSub.textContent = comp.sub;

                g.appendChild(rect);
                g.appendChild(accent);
                g.appendChild(iconG);
                g.appendChild(txtMain);
                g.appendChild(txtSub);
                nodesLayer.appendChild(g);
            });

            svg.appendChild(nodesLayer);
            return svg;
        };

        // Render
        const container = document.getElementById('canvas');
        container.appendChild(createSVG());

    </script>
</body>
</html>
