<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Architecture & Data Flow</title>
    <style>
        :root {
            /* Palette - Cyber-Industrial */
            --bg-dark: #0f111a;
            --bg-panel: #161b22;
            --border: #30363d;
            
            /* Semantic Colors */
            --c-data: #00e5ff;    /* Cyan - Data */
            --c-instr: #ffb700;   /* Amber - Instructions */
            --c-ctrl: #00e676;    /* Green - Control */
            
            /* Component Highlights */
            --c-cpu: #ffffff;
            --c-gpu: #d500f9;
            --c-mem: #2979ff;
            --c-io: #b0bec5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: #e6edf3;
            font-family: 'Segoe UI', Inter, -apple-system, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Background Grid Pattern */
        .bg-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.15;
            z-index: -1;
            pointer-events: none;
        }

        /* Header */
        header {
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 17, 26, 0.95);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(8px);
            z-index: 100;
        }

        .title-block h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 4px;
        }

        .title-block .meta {
            font-size: 0.75rem;
            color: #8b949e;
            font-family: 'Courier New', monospace;
        }

        .legend {
            display: flex;
            gap: 24px;
            background: rgba(255,255,255,0.03);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #c9d1d9;
        }

        .swatch {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            box-shadow: 0 0 8px currentColor;
        }

        /* Main SVG Container */
        main {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: 100%;
            max-width: 1400px;
        }

        /* SVG Elements */
        .node-box {
            fill: var(--bg-panel);
            stroke-width: 2px;
            rx: 12px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
        }

        .node-box:hover {
            transform: translateY(-2px);
        }

        /* CPU Special Styling */
        #cpu .node-box {
            stroke: var(--c-cpu);
            fill: #1c2128;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.15));
        }

        /* Typography */
        .node-title {
            fill: #fff;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 700;
            font-size: 16px;
            text-anchor: middle;
            letter-spacing: 0.5px;
        }

        .node-sub {
            fill: #8b949e;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            text-anchor: middle;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Connection Lines */
        .link-path {
            fill: none;
            stroke-width: 2;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        /* Animated Packets */
        .packet {
            fill: none;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-dasharray: 10 200; /* 10px dash, 200px gap */
            animation: dash 2.5s linear infinite;
            opacity: 0.8;
        }

        @keyframes dash {
            to { stroke-dashoffset: -210; }
        }

        /* Labels on Lines */
        .label-bg {
            fill: var(--bg-dark);
            stroke: var(--border);
            stroke-width: 1;
            rx: 4;
        }

        .link-label {
            fill: #c9d1d9;
            font-size: 10px;
            font-weight: 600;
            font-family: 'Segoe UI', sans-serif;
            text-anchor: middle;
            letter-spacing: 0.5px;
        }

        /* Icons */
        .icon-path {
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <header>
        <div class="title-block">
            <h1>System Architecture</h1>
            <div class="meta">Fig 2.0 // Revised Topology & Signal Flow</div>
        </div>
        <div class="legend">
            <div class="legend-item">
                <div class="swatch" style="background: var(--c-data); color: var(--c-data);"></div>
                <span>Data</span>
            </div>
            <div class="legend-item">
                <div class="swatch" style="background: var(--c-instr); color: var(--c-instr);"></div>
                <span>Instructions</span>
            </div>
            <div class="legend-item">
                <div class="swatch" style="background: var(--c-ctrl); color: var(--c-ctrl);"></div>
                <span>Control</span>
            </div>
        </div>
    </header>

    <main id="canvas">
        <!-- SVG Generated Here -->
    </main>

    <script>
        // --- Configuration ---
        const colors = {
            data: '#00e5ff',
            instr: '#ffb700',
            ctrl: '#00e676',
            cpu: '#ffffff',
            gpu: '#d500f9',
            mem: '#2979ff',
            stor: '#ff3d00',
            io: '#b0bec5'
        };

        // Layout: 1200x800 Grid
        // Hierarchy: CPU Center, RAM Top, Storage/Net Bottom, IO Left/Right
        const components = {
            cpu: { x: 450, y: 350, w: 300, h: 200, label: "CPU", sub: "Central Processing Unit" },
            mem: { x: 450, y: 80,  w: 300, h: 120, label: "RAM", sub: "System Memory" },
            gpu: { x: 850, y: 350, w: 200, h: 200, label: "GPU", sub: "Graphics Processor" },
            stor:{ x: 450, y: 620, w: 200, h: 100, label: "Storage", sub: "NVMe SSD" },
            net: { x: 150, y: 620, w: 180, h: 100, label: "Network", sub: "NIC / Interface" },
            inp: { x: 50,  y: 350, w: 180, h: 160, label: "Input", sub: "Keyboard / Mouse" },
            out: { x: 1100, y: 350, w: 180, h: 160, label: "Output", sub: "Display / Audio" }
        };

        // Connections
        const connections = [
            // CPU <-> RAM (The Critical Path)
            { from: 'cpu', to: 'mem', type: 'data', label: 'Data Load/Store' },
            { from: 'mem', to: 'cpu', type: 'instr', label: 'Instruction Fetch' },
            { from: 'cpu', to: 'mem', type: 'ctrl', label: 'Bus Control' },

            // CPU <-> GPU
            { from: 'cpu', to: 'gpu', type: 'data', label: 'Command Buffer' },
            { from: 'gpu', to: 'mem', type: 'data', label: 'Texture Data' },

            // CPU <-> Storage
            { from: 'cpu', to: 'stor', type: 'ctrl', label: 'Read Request' },
            { from: 'stor', to: 'cpu', type: 'data', label: 'Page File / Assets' },

            // CPU <-> Network
            { from: 'cpu', to: 'net', type: 'data', label: 'TX Packets' },
            { from: 'net', to: 'cpu', type: 'ctrl', label: 'Interrupt (RX)' },

            // I/O
            { from: 'inp', to: 'cpu', type: 'ctrl', label: 'Interrupt' },
            { from: 'gpu', to: 'out', type: 'data', label: 'Video Signal' },
        ];

        // --- SVG Generators ---

        const getCenter = (id) => {
            const c = components[id];
            return { x: c.x + c.w/2, y: c.y + c.h/2 };
        };

        // Orthogonal routing logic (Manhattan style)
        const getOrthoPath = (id1, id2) => {
            const s = components[id1];
            const t = components[id2];
            
            // Define anchor points (Center of edges)
            // We determine best exit/entry based on relative position
            let sx, sy, ex, ey;

            // Simple heuristic: if mostly horizontal, use left/right faces. If vertical, top/bottom.
            const dx = (t.x + t.w/2) - (s.x + s.w/2);
            const dy = (t.y + t.h/2) - (s.y + s.h/2);

            if (Math.abs(dx) > Math.abs(dy)) {
                // Horizontal
                sx = dx > 0 ? s.x + s.w : s.x;
                sy = s.y + s.h/2;
                ex = dx > 0 ? t.x : t.x + t.w;
                ey = t.y + t.h/2;
            } else {
                // Vertical
                sx = s.x + s.w/2;
                sy = dy > 0 ? s.y + s.h : s.y;
                ex = t.x + t.w/2;
                ey = dy > 0 ? t.y : t.y + t.h;
            }

            // Create path with a midpoint to allow label placement
            const mx = (sx + ex) / 2;
            const my = (sy + ey) / 2;

            // Path: Start -> Mid -> End
            // We add a small "kink" to separate parallel lines if needed, but straight L-shapes are cleaner here.
            // To prevent overlap, we could offset, but for this schematic, direct L-shapes work well.
            // We use a 3-segment path to ensure a sharp corner.
            return {
                d: `M ${sx} ${sy} L ${mx} ${sy} L ${mx} ${ey} L ${ex} ${ey}`,
                mid: { x: mx, y: my } // Label position
            };
        };

        const createSVG = () => {
            const ns = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(ns, "svg");
            svg.setAttribute("viewBox", "0 0 1280 800");
            svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

            // Defs
            const defs = document.createElementNS(ns, "defs");
            
            // Arrowhead Markers
            const createMarker = (id, color) => {
                const m = document.createElementNS(ns, "marker");
                m.setAttribute("id", id);
                m.setAttribute("viewBox", "0 0 10 10");
                m.setAttribute("refX", "9");
                m.setAttribute("refY", "5");
                m.setAttribute("markerWidth", "6");
                m.setAttribute("markerHeight", "6");
                m.setAttribute("orient", "auto");
                
                const path = document.createElementNS(ns, "path");
                path.setAttribute("d", "M 0 0 L 10 5 L 0 10 z");
                path.setAttribute("fill", color);
                m.appendChild(path);
                return m;
            };

            defs.appendChild(createMarker('arrow-data', colors.data));
            defs.appendChild(createMarker('arrow-instr', colors.instr));
            defs.appendChild(createMarker('arrow-ctrl', colors.ctrl));
            svg.appendChild(defs);

            // --- Layer 1: Connections ---
            const linksLayer = document.createElementNS(ns, "g");
            linksLayer.setAttribute("id", "links");

            connections.forEach((conn, i) => {
                const { d, mid } = getOrthoPath(conn.from, conn.to);
                const color = colors[conn.type];
                const marker = `url(#arrow-${conn.type})`;

                // 1. Track (Dull line)
                const track = document.createElementNS(ns, "path");
                track.setAttribute("d", d);
                track.setAttribute("stroke", color);
                track.setAttribute("stroke-opacity", "0.15");
                track.setAttribute("stroke-width", "6");
                linksLayer.appendChild(track);

                // 2. Active Line (Thin core)
                const line = document.createElementNS(ns, "path");
                line.setAttribute("d", d);
                line.setAttribute("stroke", color);
                line.setAttribute("stroke-width", "2");
                line.setAttribute("marker-end", marker);
                linksLayer.appendChild(line);

                // 3. Animation (Pulse)
                const pulse = document.createElementNS(ns, "path");
                pulse.setAttribute("d", d);
                pulse.setAttribute("stroke", color);
                pulse.setAttribute("class", "packet");
                // Stagger animations
                pulse.style.animationDelay = `${Math.random() * 2}s`;
                linksLayer.appendChild(pulse);

                // 4. Label (Pill)
                // Calculate text width roughly to size background
                const textLen = conn.label.length * 6 + 16; 
                const labelGroup = document.createElementNS(ns, "g");
                labelGroup.setAttribute("transform", `translate(${mid.x - textLen/2}, ${mid.y - 10})`);
                
                // Adjust label y slightly based on vertical vs horizontal segment logic
                // If it's a vertical segment, shift label right.
                // Simplified: Just put it in the corner of the L-bend
                // Let's place it at the 'elbow' of the path
                // The elbow is at (mx, sy) or (mx, ey) depending on routing.
                // For simplicity in this grid, we place it at the midpoint of the path segments.
                
                const bg = document.createElementNS(ns, "rect");
                bg.setAttribute("width", textLen);
                bg.setAttribute("height", 20);
                bg.setAttribute("class", "label-bg");
                bg.setAttribute("x", 0); bg.setAttribute("y", 0);
                
                const txt = document.createElementNS(ns, "text");
                txt.setAttribute("x", textLen/2);
                txt.setAttribute("y", 14);
                txt.setAttribute("class", "link-label");
                txt.textContent = conn.label;

                labelGroup.appendChild(bg);
                labelGroup.appendChild(txt);
                linksLayer.appendChild(labelGroup);
            });
            svg.appendChild(linksLayer);

            // --- Layer 2: Components ---
            const nodesLayer = document.createElementNS(ns, "g");

            // Icon Generators
            const drawIcon = (key, g) => {
                const c = colors[key === 'cpu' ? 'cpu' : key];
                const stroke = key === 'cpu' ? '#fff' : c;
                const opacity = 0.7;
                
                g.setAttribute("transform", `translate(${components[key].w/2}, ${components[key].h/2 - 20})`);
                
                if (key === 'cpu') {
                    // Die + Pins
                    const die = document.createElementNS(ns, "rect");
                    die.setAttribute("x", -20); die.setAttribute("y", -20);
                    die.setAttribute("width", 40); die.setAttribute("height", 40);
                    die.setAttribute("rx", 4); die.setAttribute("stroke", stroke);
                    die.setAttribute("class", "icon-path");
                    g.appendChild(die);
                    
                    // Inner grid
                    const inner = document.createElementNS(ns, "path");
                    inner.setAttribute("d", "M-10 -10 h20 v20 h-20 z M-10 -10 v20 M-10 0 h20 M0 -10 v20 M10 -10 v20");
                    inner.setAttribute("stroke", stroke); inner.setAttribute("class", "icon-path");
                    g.appendChild(inner);
                } else if (key === 'mem') {
                    // Sticks
                    for(let i=0; i<3; i++) {
                        const stick = document.createElementNS(ns, "rect");
                        stick.setAttribute("x", -30 + i*20); stick.setAttribute("y", -15);
                        stick.setAttribute("width", 12); stick.setAttribute("height", 30);
                        stick.setAttribute("rx", 2); stick.setAttribute("stroke", stroke);
                        stick.setAttribute("class", "icon-path");
                        g.appendChild(stick);
                    }
                } else if (key === 'gpu') {
                    // Fan shape
                    const fan = document.createElementNS(ns, "path");
                    fan.setAttribute("d", "M0 0 L-20 -15 A 20 20 0 0 1 20 -15 Z");
                    fan.setAttribute("stroke", stroke); fan.setAttribute("class", "icon-path");
                    g.appendChild(fan);
                    const hub = document.createElementNS(ns, "circle");
                    hub.setAttribute("r", 5); hub.setAttribute("stroke", stroke);
                    hub.setAttribute("class", "icon-path");
                    g.appendChild(hub);
                } else if (key === 'stor') {
                    // Disk
                    const d1 = document.createElementNS(ns, "ellipse");
                    d1.setAttribute("cx", 0); d1.setAttribute("cy", -10);
                    d1.setAttribute("rx", 25); d1.setAttribute("ry", 10);
                    d1.setAttribute("stroke", stroke); d1.setAttribute("class", "icon-path");
                    g.appendChild(d1);
                    const d2 = document.createElementNS(ns, "ellipse");
                    d2.setAttribute("cx", 0); d2.setAttribute("cy", 10);
                    d2.setAttribute("rx", 25); d2.setAttribute("ry", 10);
                    d2.setAttribute("stroke", stroke); d2.setAttribute("class", "icon-path");
                    g.appendChild(d2);
                } else if (key === 'net') {
                    // Globe / Node
                    const circ = document.createElementNS(ns, "circle");
                    circ.setAttribute("r", 20); circ.setAttribute("stroke", stroke);
                    circ.setAttribute("class", "icon-path");
                    g.appendChild(circ);
                    const line = document.createElementNS(ns, "path");
                    line.setAttribute("d", "M-20 0 Q0 -15 20 0 M-20 0 Q0 15 20 0");
                    line.setAttribute("stroke", stroke); line.setAttribute("class", "icon-path");
                    g.appendChild(line);
                } else if (key === 'inp') {
                    // Keyboard
                    const kb = document.createElementNS(ns, "rect");
                    kb.setAttribute("x", -25); kb.setAttribute("y", -15);
                    kb.setAttribute("width", 50); kb.setAttribute("height", 30);
                    kb.setAttribute("rx", 4); kb.setAttribute("stroke", stroke);
                    kb.setAttribute("class", "icon-path");
                    g.appendChild(kb);
                    // Keys
                    for(let r=0; r<2; r++) {
                        for(let c=0; c<4; c++) {
                            const k = document.createElementNS(ns, "rect");
                            k.setAttribute("x", -18 + c*10); k.setAttribute("y", -10 + r*12);
                            k.setAttribute("width", 6); k.setAttribute("height", 6);
                            k.setAttribute("stroke", stroke); k.setAttribute("class", "icon-path");
                            g.appendChild(k);
                        }
                    }
                } else if (key === 'out') {
                    // Monitor
                    const scr = document.createElementNS(ns, "rect");
                    scr.setAttribute("x", -25); scr.setAttribute("y", -20);
                    scr.setAttribute("width", 50); scr.setAttribute("height", 35);
                    scr.setAttribute("rx", 2); scr.setAttribute("stroke", stroke);
                    scr.setAttribute("class", "icon-path");
                    g.appendChild(scr);
                    const stand = document.createElementNS(ns, "path");
                    stand.setAttribute("d", "M0 15 L0 25 M-10 25 L10 25");
                    stand.setAttribute("stroke", stroke); stand.setAttribute("class", "icon-path");
                    g.appendChild(stand);
                }
            };

            Object.keys(components).forEach(key => {
                const comp = components[key];
                const g = document.createElementNS(ns, "g");
                g.setAttribute("id", key);
                g.setAttribute("transform", `translate(${comp.x}, ${comp.y})`);

                // Box
                const rect = document.createElementNS(ns, "rect");
                rect.setAttribute("width", comp.w);
                rect.setAttribute("height", comp.h);
                rect.setAttribute("class", "node-box");
                rect.setAttribute("stroke", colors[key] || colors.io);
                
                // Icon Container
                const iconG = document.createElementNS(ns, "g");
                drawIcon(key, iconG);

                // Text
                const txtMain = document.createElementNS(ns, "text");
                txtMain.setAttribute("x", comp.w/2);
                txtMain.setAttribute("y", comp.h/2 + 20);
                txtMain.setAttribute("class", "node-title");
                txtMain.textContent = comp.label;

                const txtSub = document.createElementNS(ns, "text");
                txtSub.setAttribute("x", comp.w/2);
                txtSub.setAttribute("y", comp.h/2 + 40);
                txtSub.setAttribute("class", "node-sub");
                txtSub.textContent = comp.sub;

                g.appendChild(rect);
                g.appendChild(iconG);
                g.appendChild(txtMain);
                g.appendChild(txtSub);
                nodesLayer.appendChild(g);
            });

            svg.appendChild(nodesLayer);
            return svg;
        };

        // Render
        const container = document.getElementById('canvas');
        container.appendChild(createSVG());

    </script>
</body>
</html>
