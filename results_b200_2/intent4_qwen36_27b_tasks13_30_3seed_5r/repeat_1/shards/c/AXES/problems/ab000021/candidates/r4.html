<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Architecture & Data Flow</title>
    <style>
        :root {
            /* Palette - Deep Technical */
            --bg-dark: #020617;
            --bg-card: #0f172a;
            --bg-card-stroke: #1e293b;
            --bg-header: rgba(2, 6, 23, 0.85);
            
            /* Semantic Colors */
            --c-data: #38bdf8;    /* Sky Blue - Data */
            --c-instr: #f59e0b;   /* Amber - Instructions */
            --c-ctrl: #10b981;    /* Emerald - Control */
            
            /* Typography */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #475569;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Subtle Grid Background */
        .bg-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(30, 41, 59, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 41, 59, 0.4) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        /* Header & Legend */
        header {
            height: 80px;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-header);
            border-bottom: 1px solid var(--bg-card-stroke);
            backdrop-filter: blur(12px);
            z-index: 100;
        }

        .title-block h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: #fff;
            text-transform: uppercase;
        }

        .title-block .meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'Courier New', monospace;
            margin-top: 4px;
            font-weight: 600;
        }

        /* Legend Container - Unified Card Style */
        .legend-container {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-stroke);
            border-radius: 8px;
            padding: 8px 24px;
            display: flex;
            gap: 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        .swatch {
            width: 24px;
            height: 4px;
            border-radius: 2px;
            background: currentColor;
            box-shadow: 0 0 8px currentColor;
        }
        
        .swatch.instr { background: var(--c-instr); box-shadow: 0 0 8px var(--c-instr); }
        .swatch.ctrl { 
            background: transparent; 
            border-bottom: 3px dashed var(--c-ctrl); 
            height: 0;
            width: 24px;
            box-shadow: none;
        }

        /* Main Canvas */
        main {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
            max-width: 1600px;
            overflow: visible;
        }

        /* Node Styles */
        .node-box {
            fill: var(--bg-card);
            stroke: var(--bg-card-stroke);
            stroke-width: 1.5px;
            rx: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2));
        }

        .node-box:hover {
            stroke: var(--text-muted);
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.4));
            transform: translateY(-2px);
        }

        /* Accent Lines (Top Border) */
        .accent-top {
            stroke-width: 3px;
            stroke-linecap: round;
            filter: drop-shadow(0 0 4px currentColor);
        }

        /* Typography */
        .node-title {
            fill: #fff;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 18px;
            text-anchor: middle;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .node-sub {
            fill: var(--text-muted);
            font-size: 11px;
            font-family: 'Courier New', monospace;
            text-anchor: middle;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

        /* Connections */
        .link-path {
            fill: none;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        .link-data { stroke: var(--c-data); stroke-width: 2px; }
        .link-instr { stroke: var(--c-instr); stroke-width: 2px; stroke-dasharray: 6 4; } /* Distinct dashed for instr */
        .link-ctrl { stroke: var(--c-ctrl); stroke-width: 2px; stroke-dasharray: 2 6; }

        /* Animated Packets */
        .packet {
            fill: none;
            stroke: #fff;
            stroke-width: 3px;
            stroke-linecap: round;
            opacity: 0;
        }
        
        .packet-data { animation: dash 2.5s linear infinite; }
        .packet-instr { animation: dash 2s linear infinite; stroke-dasharray: 8 400; }
        .packet-ctrl { animation: dash-ctrl 1.5s linear infinite; stroke-dasharray: 4 400; }

        @keyframes dash {
            0% { opacity: 1; stroke-dashoffset: 410; }
            100% { opacity: 1; stroke-dashoffset: -10; }
        }
        @keyframes dash-ctrl {
            0% { opacity: 1; stroke-dashoffset: 404; }
            100% { opacity: 1; stroke-dashoffset: -4; }
        }

        /* Labels */
        .label-bg {
            fill: var(--bg-dark);
            stroke: var(--bg-card-stroke);
            stroke-width: 1;
            rx: 4;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .link-label {
            fill: var(--text-muted);
            font-size: 10px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            text-anchor: middle;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Icons */
        .icon-path {
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        /* Special CPU Glow */
        .cpu-glow {
            filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.15));
        }

    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <header>
        <div class="title-block">
            <h1>System Architecture</h1>
            <div class="meta">Fig 2.1 // Von Neumann Topology & Signal Flow</div>
        </div>
        <div class="legend-container">
            <div class="legend-item">
                <div class="swatch" style="background: var(--c-data); box-shadow: 0 0 8px var(--c-data);"></div>
                <span>Data</span>
            </div>
            <div class="legend-item">
                <div class="swatch instr"></div>
                <span>Instructions</span>
            </div>
            <div class="legend-item">
                <div class="swatch ctrl"></div>
                <span>Control</span>
            </div>
        </div>
    </header>

    <main id="canvas"></main>

    <script>
        // --- Configuration ---
        const colors = {
            data: '#38bdf8',
            instr: '#f59e0b',
            ctrl: '#10b981',
            cpu: '#ffffff',
            gpu: '#d8b4fe', 
            mem: '#38bdf8', 
            stor: '#f59e0b', 
            io: '#94a3b8',
            net: '#38bdf8'
        };

        // Layout: Hub and Spoke
        // CPU is larger and central.
        const components = {
            // Central Hub
            cpu: { x: 490, y: 300, w: 300, h: 200, label: "CPU", sub: "Central Processing Unit" },
            
            // Top (Memory)
            mem: { x: 490, y: 50,  w: 300, h: 150, label: "RAM", sub: "System Memory" },
            
            // Bottom (Storage)
            stor:{ x: 490, y: 600, w: 300, h: 150, label: "Storage", sub: "NVMe SSD" },
            
            // Left Column (Aligned X)
            inp: { x: 80, y: 175, w: 260, h: 150, label: "Input", sub: "Keyboard / Mouse" },
            net: { x: 80, y: 475, w: 260, h: 150, label: "Network", sub: "NIC / Interface" },
            
            // Right Column (Aligned X)
            gpu: { x: 920, y: 175, w: 260, h: 150, label: "GPU", sub: "Graphics Processor" },
            out: { x: 920, y: 475, w: 260, h: 150, label: "Output", sub: "Display / Audio" }
        };

        // Connections - Updated to show Instruction Fetch
        const connections = [
            // CPU <-> RAM (The Critical Path)
            { from: 'cpu', to: 'mem', type: 'data', label: 'Data Load/Store' },
            { from: 'mem', to: 'cpu', type: 'instr', label: 'Instruction Fetch' },
            { from: 'cpu', to: 'mem', type: 'ctrl', label: 'Bus Control' },

            // CPU <-> GPU
            { from: 'cpu', to: 'gpu', type: 'data', label: 'Command Buffer' },
            { from: 'gpu', to: 'mem', type: 'data', label: 'Texture Data' },

            // CPU <-> Storage
            { from: 'cpu', to: 'stor', type: 'ctrl', label: 'Read Request' },
            { from: 'stor', to: 'cpu', type: 'data', label: 'Page File / Assets' },
            { from: 'stor', to: 'cpu', type: 'instr', label: 'Code Load' }, // Added Instruction flow

            // CPU <-> Network
            { from: 'cpu', to: 'net', type: 'data', label: 'TX Packets' },
            { from: 'net', to: 'cpu', type: 'ctrl', label: 'Interrupt (RX)' },

            // I/O
            { from: 'inp', to: 'cpu', type: 'ctrl', label: 'Interrupt' },
            { from: 'gpu', to: 'out', type: 'data', label: 'Video Signal' },
        ];

        // --- SVG Generators ---

        const getCenter = (id) => {
            const c = components[id];
            return { x: c.x + c.w/2, y: c.y + c.h/2 };
        };

        // Orthogonal routing logic (Manhattan style)
        const getOrthoPath = (id1, id2) => {
            const s = components[id1];
            const t = components[id2];
            
            const sCenter = getCenter(id1);
            const tCenter = getCenter(id2);
            
            let sx, sy, ex, ey;
            let elbowX, elbowY;

            const dx = tCenter.x - sCenter.x;
            const dy = tCenter.y - sCenter.y;

            // Determine primary axis
            if (Math.abs(dx) > Math.abs(dy)) {
                // Horizontal primary
                sx = dx > 0 ? s.x + s.w : s.x;
                sy = sCenter.y;
                ex = dx > 0 ? t.x : t.x + t.w;
                ey = tCenter.y;
                
                elbowX = (sx + ex) / 2;
                elbowY = sy;
            } else {
                // Vertical primary
                sx = sCenter.x;
                sy = dy > 0 ? s.y + s.h : s.y;
                ex = tCenter.x;
                ey = dy > 0 ? t.y : t.y + t.h;
                
                elbowX = sx;
                elbowY = (sy + ey) / 2;
            }

            // Path string
            const d = `M ${sx} ${sy} L ${elbowX} ${elbowY} L ${ex} ${ey}`;
            
            return { d, elbow: { x: elbowX, y: elbowY } };
        };

        const createSVG = () => {
            const ns = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(ns, "svg");
            svg.setAttribute("viewBox", "0 0 1280 800");
            svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

            // Defs
            const defs = document.createElementNS(ns, "defs");
            
            // Grid Pattern for CPU Die
            const pattern = document.createElementNS(ns, "pattern");
            pattern.setAttribute("id", "grid-pattern");
            pattern.setAttribute("width", "12");
            pattern.setAttribute("height", "12");
            pattern.setAttribute("patternUnits", "userSpaceOnUse");
            const pRect = document.createElementNS(ns, "rect");
            pRect.setAttribute("width", "12"); pRect.setAttribute("height", "12");
            pRect.setAttribute("fill", "none");
            pRect.setAttribute("stroke", "#334155");
            pRect.setAttribute("stroke-width", "1");
            pattern.appendChild(pRect);
            defs.appendChild(pattern);

            // Arrowhead Markers
            const createMarker = (id, color) => {
                const m = document.createElementNS(ns, "marker");
                m.setAttribute("id", id);
                m.setAttribute("viewBox", "0 0 10 10");
                m.setAttribute("refX", "9");
                m.setAttribute("refY", "5");
                m.setAttribute("markerWidth", "6");
                m.setAttribute("markerHeight", "6");
                m.setAttribute("orient", "auto");
                
                const path = document.createElementNS(ns, "path");
                path.setAttribute("d", "M 0 0 L 10 5 L 0 10 z");
                path.setAttribute("fill", color);
                m.appendChild(path);
                return m;
            };

            defs.appendChild(createMarker('arrow-data', colors.data));
            defs.appendChild(createMarker('arrow-instr', colors.instr));
            defs.appendChild(createMarker('arrow-ctrl', colors.ctrl));
            svg.appendChild(defs);

            // --- Layer 1: Connections ---
            const linksLayer = document.createElementNS(ns, "g");
            linksLayer.setAttribute("id", "links");

            connections.forEach((conn, i) => {
                const { d, elbow } = getOrthoPath(conn.from, conn.to);
                const color = colors[conn.type];
                const marker = `url(#arrow-${conn.type})`;
                const classBase = `link-${conn.type}`;
                const packetClass = `packet-${conn.type}`;

                // 1. Track (Subtle background line)
                const track = document.createElementNS(ns, "path");
                track.setAttribute("d", d);
                track.setAttribute("stroke", color);
                track.setAttribute("stroke-opacity", "0.15");
                track.setAttribute("stroke-width", "10");
                linksLayer.appendChild(track);

                // 2. Active Line
                const line = document.createElementNS(ns, "path");
                line.setAttribute("d", d);
                line.setAttribute("class", classBase);
                line.setAttribute("marker-end", marker);
                linksLayer.appendChild(line);

                // 3. Animation (Pulse)
                const pulse = document.createElementNS(ns, "path");
                pulse.setAttribute("d", d);
                pulse.setAttribute("class", packetClass);
                pulse.style.animationDelay = `${Math.random() * 1.5}s`;
                linksLayer.appendChild(pulse);

                // 4. Label (Pill)
                const textLen = conn.label.length * 6 + 20; 
                const labelGroup = document.createElementNS(ns, "g");
                
                let lx = elbow.x;
                let ly = elbow.y;
                
                // Offset logic
                if (Math.abs(components[conn.from].x - components[conn.to].x) > Math.abs(components[conn.from].y - components[conn.to].y)) {
                    ly -= 18; 
                } else {
                    lx += 18;
                }

                labelGroup.setAttribute("transform", `translate(${lx - textLen/2}, ${ly - 10})`);
                
                const bg = document.createElementNS(ns, "rect");
                bg.setAttribute("width", textLen);
                bg.setAttribute("height", 20);
                bg.setAttribute("class", "label-bg");
                
                const txt = document.createElementNS(ns, "text");
                txt.setAttribute("x", textLen/2);
                txt.setAttribute("y", 14);
                txt.setAttribute("class", "link-label");
                txt.textContent = conn.label;

                labelGroup.appendChild(bg);
                labelGroup.appendChild(txt);
                linksLayer.appendChild(labelGroup);
            });
            svg.appendChild(linksLayer);

            // --- Layer 2: Components ---
            const nodesLayer = document.createElementNS(ns, "g");

            // Icon Generators (Standardized Geometric Style)
            const drawIcon = (key, g) => {
                const stroke = colors[key === 'cpu' ? 'cpu' : key === 'gpu' ? 'gpu' : key === 'stor' ? 'stor' : key === 'net' ? 'net' : 'mem'];
                
                // Center icon in top half of box
                g.setAttribute("transform", `translate(${components[key].w/2}, ${components[key].h/2 - 40})`);
                
                g.setAttribute("stroke", stroke);
                g.setAttribute("opacity", "0.9");
                g.setAttribute("class", "icon-path");
                
                if (key === 'cpu') {
                    // Die
                    const die = document.createElementNS(ns, "rect");
                    die.setAttribute("x", -24); die.setAttribute("y", -24);
                    die.setAttribute("width", 48); die.setAttribute("height", 48);
                    die.setAttribute("rx", 4); 
                    die.setAttribute("fill", "url(#grid-pattern)");
                    die.setAttribute("stroke-width", "2");
                    g.appendChild(die);
                    
                    // Core
                    const core = document.createElementNS(ns, "rect");
                    core.setAttribute("x", -12); core.setAttribute("y", -12);
                    core.setAttribute("width", 24); core.setAttribute("height", 24);
                    core.setAttribute("fill", "none");
                    core.setAttribute("stroke-dasharray", "4,4");
                    core.setAttribute("stroke", "#fff");
                    g.appendChild(core);
                } else if (key === 'mem') {
                    // Sticks
                    for(let i=0; i<3; i++) {
                        const stick = document.createElementNS(ns, "rect");
                        stick.setAttribute("x", -30 + i*22); stick.setAttribute("y", -20);
                        stick.setAttribute("width", 14); stick.setAttribute("height", 40);
                        stick.setAttribute("rx", 2); 
                        g.appendChild(stick);
                    }
                } else if (key === 'gpu') {
                    // Fan/Heatsink
                    const outer = document.createElementNS(ns, "circle");
                    outer.setAttribute("r", 26);
                    outer.setAttribute("stroke-dasharray", "6,6");
                    g.appendChild(outer);
                    
                    const inner = document.createElementNS(ns, "path");
                    inner.setAttribute("d", "M0 0 L-18 -18 M0 0 L18 -18 M0 0 L0 24"); 
                    g.appendChild(inner);
                } else if (key === 'stor') {
                    // Stacked Disks (Standardized)
                    const d1 = document.createElementNS(ns, "ellipse");
                    d1.setAttribute("cx", 0); d1.setAttribute("cy", -12);
                    d1.setAttribute("rx", 28); d1.setAttribute("ry", 9);
                    g.appendChild(d1);
                    const d2 = document.createElementNS(ns, "ellipse");
                    d2.setAttribute("cx", 0); d2.setAttribute("cy", 0);
                    d2.setAttribute("rx", 28); d2.setAttribute("ry", 9);
                    g.appendChild(d2);
                    const d3 = document.createElementNS(ns, "ellipse");
                    d3.setAttribute("cx", 0); d3.setAttribute("cy", 12);
                    d3.setAttribute("rx", 28); d3.setAttribute("ry", 9);
                    g.appendChild(d3);
                } else if (key === 'net') {
                    // Globe
                    const circ = document.createElementNS(ns, "circle");
                    circ.setAttribute("r", 24);
                    g.appendChild(circ);
                    const cross = document.createElementNS(ns, "path");
                    cross.setAttribute("d", "M-24 0 L24 0 M0 -24 L0 24 M-17 -17 L17 17 M-17 17 L17 -17");
                    cross.setAttribute("opacity", "0.6");
                    g.appendChild(cross);
                } else if (key === 'inp') {
                    // Keyboard (Detailed)
                    const kb = document.createElementNS(ns, "rect");
                    kb.setAttribute("x", -30); kb.setAttribute("y", -18);
                    kb.setAttribute("width", 60); kb.setAttribute("height", 36);
                    kb.setAttribute("rx", 4);
                    g.appendChild(kb);
                    // Keys
                    for(let r=0; r<3; r++) {
                        for(let c=0; c<5; c++) {
                            const k = document.createElementNS(ns, "rect");
                            k.setAttribute("x", -24 + c*10); k.setAttribute("y", -12 + r*10);
                            k.setAttribute("width", 5); k.setAttribute("height", 5);
                            k.setAttribute("fill", stroke);
                            k.setAttribute("stroke", "none");
                            g.appendChild(k);
                        }
                    }
                } else if (key === 'out') {
                    // Monitor
                    const scr = document.createElementNS(ns, "rect");
                    scr.setAttribute("x", -28); scr.setAttribute("y", -22);
                    scr.setAttribute("width", 56); scr.setAttribute("height", 40);
                    scr.setAttribute("rx", 3);
                    g.appendChild(scr);
                    const stand = document.createElementNS(ns, "path");
                    stand.setAttribute("d", "M-12 18 L12 18 M0 18 L0 28");
                    g.appendChild(stand);
                }
            };

            Object.keys(components).forEach(key => {
                const comp = components[key];
                const g = document.createElementNS(ns, "g");
                g.setAttribute("id", key);
                g.setAttribute("transform", `translate(${comp.x}, ${comp.y})`);

                // Box
                const rect = document.createElementNS(ns, "rect");
                rect.setAttribute("width", comp.w);
                rect.setAttribute("height", comp.h);
                rect.setAttribute("class", "node-box");
                
                // Add glow to CPU
                if (key === 'cpu') {
                    rect.setAttribute("class", "node-box cpu-glow");
                }
                
                // Top Accent Line
                const accent = document.createElementNS(ns, "path");
                accent.setAttribute("d", `M 8 0 L ${comp.w - 8} 0`);
                accent.setAttribute("class", "accent-top");
                accent.setAttribute("stroke", colors[key] || colors.io);

                // Icon Container
                const iconG = document.createElementNS(ns, "g");
                drawIcon(key, iconG);

                // Text
                const txtMain = document.createElementNS(ns, "text");
                txtMain.setAttribute("x", comp.w/2);
                txtMain.setAttribute("y", comp.h/2 + 20);
                txtMain.setAttribute("class", "node-title");
                txtMain.textContent = comp.label;

                const txtSub = document.createElementNS(ns, "text");
                txtSub.setAttribute("x", comp.w/2);
                txtSub.setAttribute("y", comp.h/2 + 42);
                txtSub.setAttribute("class", "node-sub");
                txtSub.textContent = comp.sub;

                g.appendChild(rect);
                g.appendChild(accent);
                g.appendChild(iconG);
                g.appendChild(txtMain);
                g.appendChild(txtSub);
                nodesLayer.appendChild(g);
            });

            svg.appendChild(nodesLayer);
            return svg;
        };

        // Render
        const container = document.getElementById('canvas');
        container.appendChild(createSVG());

    </script>
</body>
</html>
