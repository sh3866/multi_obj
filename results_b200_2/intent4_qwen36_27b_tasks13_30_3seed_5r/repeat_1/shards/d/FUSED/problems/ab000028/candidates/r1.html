<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine Descent | Editorial Visual</title>
<style>
    :root {
        --c-text-main: #f8fafc;
        --c-text-muted: #cbd5e1;
        --c-accent: #f59e0b;
        --c-accent-dim: #b45309;
        --font-display: "Georgia", "Times New Roman", serif;
        --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: "Courier New", Courier, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: #0f172a;
        color: var(--c-text-main);
        font-family: var(--font-body);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: block;
    }

    /* --- IMMERSIVE SCENE CONTAINER --- */
    .scene-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Deep atmospheric gradient */
        background: linear-gradient(to bottom, #0f172a 0%, #1e293b 40%, #475569 100%);
    }

    .scene-svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* --- EDITORIAL OVERLAY UI --- */
    .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none; /* Let clicks pass through to scene */
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 3rem;
        z-index: 10;
    }

    /* Header Section */
    .header-section {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        max-width: 500px;
        background: linear-gradient(90deg, rgba(15,23,42,0.8) 0%, rgba(15,23,42,0) 100%);
        padding-right: 2rem;
        backdrop-filter: blur(2px);
    }

    .tag {
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--c-accent);
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    
    .tag::before {
        content: '';
        display: block;
        width: 8px;
        height: 8px;
        background: var(--c-accent);
        border-radius: 50%;
        box-shadow: 0 0 10px var(--c-accent);
    }

    h1 {
        font-family: var(--font-display);
        font-size: 5rem;
        line-height: 0.9;
        font-weight: 400;
        margin-bottom: 1.5rem;
        color: #fff;
        letter-spacing: -0.03em;
        text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    h1 span {
        font-style: italic;
        color: transparent;
        -webkit-text-stroke: 1px rgba(255,255,255,0.8);
    }

    p.lead {
        font-size: 1rem;
        line-height: 1.5;
        color: var(--c-text-muted);
        max-width: 400px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* Dashboard / Data Section */
    .dashboard-container {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        width: 100%;
        pointer-events: auto; /* Enable interaction */
    }

    .data-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2rem;
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 1.5rem 2rem;
        border-radius: 4px;
    }

    .data-point {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
    }

    .data-label {
        font-family: var(--font-mono);
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--c-text-muted);
        opacity: 0.8;
    }

    .data-value {
        font-family: var(--font-display);
        font-size: 2rem;
        font-weight: 400;
        color: #fff;
        line-height: 1;
    }

    .data-unit {
        font-size: 0.75rem;
        font-weight: 400;
        color: var(--c-accent);
        font-family: var(--font-mono);
    }

    /* Controls */
    .controls {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
    }

    .slider-wrapper {
        display: flex;
        align-items: center;
        gap: 1rem;
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(8px);
        padding: 1rem 1.5rem;
        border-radius: 50px;
        border: 1px solid rgba(255,255,255,0.1);
    }

    input[type="range"] {
        width: 150px;
        height: 2px;
        background: rgba(255,255,255,0.3);
        border-radius: 2px;
        appearance: none;
        outline: none;
        cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 10px rgba(255,255,255,0.5);
        transition: transform 0.1s;
    }
    
    input[type="range"]::-webkit-slider-thumb:hover {
        transform: scale(1.2);
        background: var(--c-accent);
    }

    /* Responsive */
    @media (max-width: 900px) {
        .overlay { padding: 1.5rem; }
        h1 { font-size: 3rem; }
        .data-grid { gap: 1rem; padding: 1rem; }
        .data-value { font-size: 1.5rem; }
        .dashboard-container { flex-direction: column; align-items: flex-start; gap: 1.5rem; }
        .controls { align-items: flex-start; width: 100%; }
        .slider-wrapper { width: 100%; justify-content: space-between; }
        input[type="range"] { flex-grow: 1; }
    }
</style>
</head>
<body>

    <!-- VISUAL SCENE -->
    <div class="scene-container" id="scene">
        <svg class="scene-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1200 800">
            <defs>
                <!-- Sky Gradient -->
                <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#0f172a" />
                    <stop offset="60%" stop-color="#334155" />
                    <stop offset="100%" stop-color="#94a3b8" />
                </linearGradient>

                <!-- Sun Glow -->
                <radialGradient id="sunGlow" cx="0.8" cy="0.3" r="0.6">
                    <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.2" />
                    <stop offset="100%" stop-color="transparent" />
                </radialGradient>

                <!-- Canopy Gradient (Volume) -->
                <linearGradient id="canopyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#fbbf24" />
                    <stop offset="40%" stop-color="#d97706" />
                    <stop offset="100%" stop-color="#78350f" />
                </linearGradient>
                
                <!-- Cliff Gradient -->
                <linearGradient id="cliffFace" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#020617" />
                    <stop offset="0.2%" stop-color="#1e293b" />
                    <stop offset="100%" stop-color="#0f172a" />
                </linearGradient>

                <!-- Filters -->
                <filter id="glow">
                    <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <filter id="blurMedium">
                    <feGaussianBlur stdDeviation="3" />
                </filter>
            </defs>

            <!-- 1. BACKGROUND: Sky & Atmosphere -->
            <rect width="100%" height="100%" fill="url(#skyGrad)" />
            <rect width="100%" height="100%" fill="url(#sunGlow)" />

            <!-- 2. DEPTH: Distant Mountains -->
            <g id="bg-mountains" opacity="0.6">
                <path d="M-100,650 L100,550 L300,620 L500,500 L700,600 L1000,480 L1300,650 L1300,800 L-100,800 Z" fill="#475569" />
                <path d="M-100,700 L150,600 L400,680 L600,580 L900,650 L1300,550 L1300,800 L-100,800 Z" fill="#334155" opacity="0.8" />
            </g>

            <!-- 3. FOREGROUND: The Cliff (Geological Strata) -->
            <g id="cliff">
                <!-- Main Mass -->
                <path d="M0,0 L350,0 L350,100 L380,100 L360,180 L420,210 L390,290 L480,340 L420,420 L520,500 L450,600 L550,800 L0,800 Z" fill="url(#cliffFace)" />
                
                <!-- Strata Layer 1 (Top) -->
                <path d="M350,100 L380,100 L360,180 L420,210" fill="none" stroke="#0f172a" stroke-width="4" />
                <path d="M350,100 L380,100 L360,180 L420,210" fill="none" stroke="#334155" stroke-width="1" transform="translate(2,2)" opacity="0.5" />
                
                <!-- Strata Layer 2 (Mid) -->
                <path d="M390,290 L480,340 L420,420" fill="none" stroke="#0f172a" stroke-width="6" />
                
                <!-- Strata Layer 3 (Bottom) -->
                <path d="M520,500 L450,600 L550,800" fill="none" stroke="#0f172a" stroke-width="8" />

                <!-- Texture/Noise overlay for rock -->
                <path d="M0,0 L350,0 L350,100 L380,100 L360,180 L420,210 L390,290 L480,340 L420,420 L520,500 L450,600 L550,800 L0,800 Z" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.05" />
            </g>

            <!-- 4. SUBJECT: Parachutist Group -->
            <g id="parachutist" transform="translate(650, 300)">
                
                <!-- Canopy Shadow on Cliff (Dynamic Anchor) -->
                <ellipse id="shadow" cx="-150" cy="400" rx="50" ry="10" fill="#020617" opacity="0.6" filter="url(#blurMedium)" />

                <!-- Taut Harness Lines -->
                <g id="lines" stroke="#f8fafc" stroke-width="1.5" fill="none" opacity="0.7">
                    <!-- Lines drawn from canopy bottom to harness -->
                    <path d="M-100,-130 L-5,120 L100,-130" />
                    <path d="M-70,-130 L-5,120 L70,-130" />
                    <path d="M-30,-130 L-5,120 L30,-130" />
                    <path d="M0,-130 L-5,120 L0,-130" />
                </g>

                <!-- The Human Figure (Silhouette) -->
                <g id="human">
                    <!-- Backpack/Rig -->
                    <path d="M-15,105 L15,105 L18,145 L-18,145 Z" fill="#1e293b" />
                    
                    <!-- Legs (Dynamic pose, wind resistance) -->
                    <path d="M-10,140 L-15,180 L-25,200" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M10,140 L20,180 L30,205" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
                    
                    <!-- Torso -->
                    <path d="M-12,110 L12,110 L10,145 L-10,145 Z" fill="#0f172a" />
                    
                    <!-- Arms (Steering inputs) -->
                    <path d="M-10,115 L-35,135 L-25,150" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M10,115 L35,130 L45,140" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                    
                    <!-- Helmet -->
                    <circle cx="0" cy="95" r="11" fill="#1e293b" />
                </g>

                <!-- The Canopy (3D Volume) -->
                <g id="canopy">
                    <!-- Main Dome -->
                    <path id="canopyShape" d="M-110,-130 Q-5,-280 110,-130 Q0,-210 -110,-130 Z" fill="url(#canopyGrad)" />
                    
                    <!-- Folds for realism -->
                    <path d="M-110,-130 Q-40,-200 0,-160" fill="none" stroke="#78350f" stroke-width="2" opacity="0.5" />
                    <path d="M110,-130 Q40,-200 0,-160" fill="none" stroke="#78350f" stroke-width="2" opacity="0.5" />
                    
                    <!-- Highlight rim -->
                    <path d="M-110,-130 Q-5,-280 110,-130" fill="none" stroke="#fef3c7" stroke-width="1" opacity="0.3" />
                </g>
            </g>

            <!-- 5. MOTION CUES: Wind Streaks -->
            <g id="wind-lines" stroke="#ffffff" stroke-width="1" opacity="0.2" stroke-linecap="round">
                <!-- Vertical speed lines -->
                <line x1="200" y1="-100" x2="200" y2="100" />
                <line x1="800" y1="-50" x2="800" y2="150" />
                <line x1="1000" y1="0" x2="1000" y2="200" />
                <!-- Horizontal wind drift -->
                <path d="M600,200 Q800,180 1000,220" fill="none" />
                <path d="M650,400 Q850,380 1100,420" fill="none" />
            </g>

        </svg>

        <!-- EDITORIAL OVERLAY -->
        <div class="overlay">
            
            <div class="header-section">
                <div class="tag">Operation: High Altitude</div>
                <h1>Controlled<br><span>Descent.</span></h1>
                <p class="lead">
                    Navigating the vertical gap between geological permanence and human fragility. 
                    A study in tension, aerodynamics, and the quiet moments of freefall.
                </p>
            </div>

            <div class="dashboard-container">
                <div class="data-grid">
                    <div class="data-point">
                        <span class="data-label">Altitude</span>
                        <span class="data-value" id="alt-val">4,200</span>
                        <span class="data-unit">ft</span>
                    </div>
                    <div class="data-point">
                        <span class="data-label">Wind Speed</span>
                        <span class="data-value" id="wind-val">24</span>
                        <span class="data-unit">mph</span>
                    </div>
                    <div class="data-point">
                        <span class="data-label">Descent Rate</span>
                        <span class="data-value" id="rate-val">180</span>
                        <span class="data-unit">fpm</span>
                    </div>
                </div>

                <div class="controls">
                    <div class="slider-wrapper">
                        <span class="data-label" style="color: #fff;">Simulation Speed</span>
                        <input type="range" id="speedControl" min="0" max="100" value="30">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const parachute = document.getElementById('parachutist');
            const canopyShape = document.getElementById('canopyShape');
            const shadow = document.getElementById('shadow');
            const human = document.getElementById('human');
            const windLines = document.getElementById('wind-lines');
            const bgMountains = document.getElementById('bg-mountains');
            
            const altVal = document.getElementById('alt-val');
            const windVal = document.getElementById('wind-val');
            const rateVal = document.getElementById('rate-val');
            const speedControl = document.getElementById('speedControl');
            
            let time = 0;
            let speed = 30;
            let altitude = 4200;
            let windSpeed = 24;

            // Mouse interaction for parallax
            const scene = document.getElementById('scene');
            let mouseX = 0;
            let mouseY = 0;

            scene.addEventListener('mousemove', (e) => {
                const rect = scene.getBoundingClientRect();
                // Normalize -1 to 1
                mouseX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                mouseY = ((e.clientY - rect.top) / rect.height) * 2 - 1;
            });

            speedControl.addEventListener('input', (e) => {
                speed = parseInt(e.target.value);
            });

            function animate() {
                time += 0.01 * (speed / 30);
                
                // 1. Floating Motion (Sine waves)
                // Sway X: Gentle side to side
                const swayX = Math.sin(time * 0.8) * 30;
                // Sway Y: Bobbing up and down
                const swayY = Math.cos(time * 0.5) * 15;
                
                // 2. Pendulum Physics (Human swings opposite to canopy)
                const swing = Math.sin(time * 0.8) * 10;
                
                // 3. Canopy Flex (Breathing)
                const flex = Math.sin(time * 4) * 8;

                // Apply Parallax to Scene Elements
                // Move mountains slightly opposite to mouse for depth
                const bgX = mouseX * -20;
                const bgY = mouseY * -10;
                bgMountains.setAttribute('transform', `translate(${bgX}, ${bgY})`);

                // Apply Transforms to Parachutist
                // Base position + Mouse influence + Sway
                const baseX = 650 + (mouseX * 40) + swayX;
                const baseY = 300 + (mouseY * 40) + swayY;
                
                parachute.setAttribute('transform', `translate(${baseX}, ${baseY})`);

                // Swing the human figure relative to the connection point
                human.setAttribute('transform', `rotate(${swing}, -5, 120)`);

                // Flex the canopy shape
                const topY = -280 + flex;
                const botY = -210 + (flex * 0.5);
                canopyShape.setAttribute('d', `M-110,-130 Q-5,${topY} 110,-130 Q0,${botY} -110,-130 Z`);

                // Move Shadow on cliff (Parallax relative to cliff)
                // Shadow moves differently than the object to show height
                const shadowX = -150 + (swayX * 0.5); 
                shadow.setAttribute('cx', shadowX);

                // Wind Lines Animation (Scrolling effect)
                const windOffset = (time * 50 * (speed/30)) % 200;
                windLines.setAttribute('transform', `translate(0, ${windOffset})`);

                // Simulate Data Drop
                if (speed > 5) {
                    altitude -= (speed * 0.05);
                    // Fluctuate wind speed slightly
                    windSpeed = 24 + Math.sin(time * 2) * 2;
                    
                    if (altitude < 500) {
                        altitude = 4500; // Reset loop
                    }
                }

                // Update DOM
                altVal.innerText = Math.floor(altitude).toLocaleString();
                windVal.innerText = Math.floor(windSpeed);
                rateVal.innerText = Math.floor(180 + (speed/2));

                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>
</body>
</html>
