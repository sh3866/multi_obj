<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine Descent | Editorial Visual</title>
<style>
    :root {
        --c-text-main: #f8fafc;
        --c-text-muted: #94a3b8;
        --c-accent: #f59e0b;
        --c-accent-dim: #b45309;
        --c-dark-overlay: rgba(15, 23, 42, 0.6);
        --font-display: "Georgia", "Times New Roman", serif;
        --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: "Courier New", Courier, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background-color: #0f172a;
        color: var(--c-text-main);
        font-family: var(--font-body);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: block;
    }

    /* --- IMMERSIVE SCENE CONTAINER --- */
    .scene-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f172a;
    }

    .scene-svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* --- EDITORIAL OVERLAY UI --- */
    .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 3rem;
        z-index: 10;
    }

    /* Header Section */
    .header-section {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        max-width: 600px;
        background: linear-gradient(90deg, rgba(15,23,42,0.85) 0%, rgba(15,23,42,0) 100%);
        padding-right: 3rem;
        backdrop-filter: blur(4px);
    }

    .tag {
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--c-accent);
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }
    
    .tag::before {
        content: '';
        display: block;
        width: 6px;
        height: 6px;
        background: var(--c-accent);
        box-shadow: 0 0 8px var(--c-accent);
    }

    h1 {
        font-family: var(--font-display);
        font-size: 5.5rem;
        line-height: 0.85;
        font-weight: 400;
        margin-bottom: 1.5rem;
        color: #fff;
        letter-spacing: -0.04em;
        text-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 span {
        font-style: italic;
        color: transparent;
        -webkit-text-stroke: 1px rgba(255,255,255,0.9);
    }

    p.lead {
        font-size: 1.1rem;
        line-height: 1.6;
        color: var(--c-text-muted);
        max-width: 450px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        border-left: 2px solid var(--c-accent);
        padding-left: 1rem;
    }

    /* Dashboard / Data Section (Refined) */
    .dashboard-container {
        display: flex;
        align-items: flex-end;
        justify-content: flex-start; /* Left aligned for better balance */
        width: 100%;
        pointer-events: auto;
        gap: 2rem;
    }

    .data-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 3rem;
        background: var(--c-dark-overlay);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255,255,255,0.08);
        padding: 1.5rem 3rem;
        border-radius: 2px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .data-point {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        border-right: 1px solid rgba(255,255,255,0.1);
        padding-right: 2rem;
    }

    .data-point:last-child {
        border-right: none;
        padding-right: 0;
    }

    .data-label {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--c-text-muted);
        opacity: 0.9;
    }

    .data-value {
        font-family: var(--font-display);
        font-size: 2.5rem;
        font-weight: 400;
        color: #fff;
        line-height: 1;
        letter-spacing: -0.02em;
    }

    .data-unit {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--c-accent);
        font-family: var(--font-mono);
        align-self: flex-end;
        margin-bottom: 0.2rem;
    }

    /* Responsive */
    @media (max-width: 900px) {
        .overlay { padding: 1.5rem; }
        h1 { font-size: 3.5rem; }
        .data-grid { gap: 1.5rem; padding: 1.5rem; }
        .data-value { font-size: 1.8rem; }
        .data-point { padding-right: 1rem; border-right: 1px solid rgba(255,255,255,0.1); }
        .data-point:last-child { border-right: none; }
        .header-section { background: linear-gradient(180deg, rgba(15,23,42,0.9) 0%, rgba(15,23,42,0) 100%); }
    }
</style>
</head>
<body>

    <!-- VISUAL SCENE -->
    <div class="scene-container" id="scene">
        <svg class="scene-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1200 800">
            <defs>
                <!-- Sky Gradient: Deep atmospheric dusk -->
                <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#020617" />
                    <stop offset="50%" stop-color="#1e293b" />
                    <stop offset="100%" stop-color="#475569" />
                </linearGradient>

                <!-- Sun Glow -->
                <radialGradient id="sunGlow" cx="0.8" cy="0.4" r="0.6">
                    <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.15" />
                    <stop offset="100%" stop-color="transparent" />
                </radialGradient>

                <!-- Canopy Gradient: Richer, more volume -->
                <linearGradient id="canopyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#fbbf24" />
                    <stop offset="50%" stop-color="#d97706" />
                    <stop offset="100%" stop-color="#92400e" />
                </linearGradient>

                <!-- Cliff Gradient: High contrast depth -->
                <linearGradient id="cliffFace" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#020617" />
                    <stop offset="0.1%" stop-color="#1e293b" />
                    <stop offset="0.4%" stop-color="#0f172a" />
                    <stop offset="100%" stop-color="#020617" />
                </linearGradient>

                <!-- Filters -->
                <filter id="glow">
                    <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <filter id="blurMedium">
                    <feGaussianBlur stdDeviation="4" />
                </filter>
                <filter id="shadowBlur">
                    <feGaussianBlur stdDeviation="8" />
                </filter>
                
                <!-- Pattern for Parachute Cells -->
                <pattern id="cells" x="0" y="0" width="40" height="120" patternUnits="userSpaceOnUse">
                    <path d="M0,0 L20,60 L0,120" fill="none" stroke="#000" stroke-width="2" opacity="0.2" />
                    <path d="M40,0 L20,60 L40,120" fill="none" stroke="#000" stroke-width="2" opacity="0.2" />
                </pattern>
            </defs>

            <!-- 1. BACKGROUND: Sky & Atmosphere -->
            <rect width="100%" height="100%" fill="url(#skyGrad)" />
            <rect width="100%" height="100%" fill="url(#sunGlow)" />

            <!-- 2. DEPTH: Distant Mountains (Layered) -->
            <g id="bg-mountains" opacity="0.8">
                <!-- Far Layer -->
                <path d="M-100,700 L150,580 L350,650 L600,520 L900,620 L1300,480 L1300,800 L-100,800 Z" fill="#334155" />
                <!-- Mid Layer -->
                <path d="M-100,750 L200,650 L450,720 L700,600 L1100,700 L1300,600 L1300,800 L-100,800 Z" fill="#1e293b" opacity="0.9" />
            </g>

            <!-- 3. FOREGROUND: The Cliff (Complex Vector Composition) -->
            <g id="cliff">
                <!-- Main Mass - Jagged -->
                <path d="M0,0 L300,0 L300,120 L340,150 L310,220 L390,280 L350,380 L450,450 L380,550 L480,650 L400,750 L500,800 L0,800 Z" fill="url(#cliffFace)" />
                
                <!-- Strata Layer 1 (Top - Limestone) -->
                <path d="M300,120 L340,150 L310,220 L390,280" fill="none" stroke="#0f172a" stroke-width="4" />
                <path d="M300,120 L340,150 L310,220 L390,280" fill="none" stroke="#334155" stroke-width="1" transform="translate(3,3)" opacity="0.6" />
                
                <!-- Strata Layer 2 (Mid - Granite) -->
                <path d="M350,380 L450,450 L380,550" fill="none" stroke="#020617" stroke-width="6" />
                <!-- Texture details -->
                <path d="M350,380 L400,420 L380,550" fill="none" stroke="#475569" stroke-width="2" opacity="0.3" />

                <!-- Strata Layer 3 (Bottom - Slate) -->
                <path d="M480,650 L400,750 L500,800" fill="none" stroke="#020617" stroke-width="10" />
                
                <!-- Noise/Texture overlay -->
                <path d="M0,0 L300,0 L300,120 L340,150 L310,220 L390,280 L350,380 L450,450 L380,550 L480,650 L400,750 L500,800 L0,800 Z" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.03" />
            </g>

            <!-- 4. SUBJECT: Parachutist Group -->
            <g id="parachutist" transform="translate(700, 350)">
                
                <!-- Canopy Shadow on Cliff -->
                <ellipse id="shadow" cx="-180" cy="450" rx="60" ry="15" fill="#000" opacity="0.5" filter="url(#shadowBlur)" />

                <!-- Taut Harness Lines (Complex, converging) -->
                <g id="lines" stroke="#f8fafc" stroke-width="1.2" fill="none" opacity="0.8">
                    <!-- Left Side Lines -->
                    <path d="M-120,-140 L-10,160" />
                    <path d="M-80,-140 L-10,160" />
                    <path d="M-40,-140 L-10,160" />
                    <!-- Right Side Lines -->
                    <path d="M120,-140 L10,160" />
                    <path d="M80,-140 L10,160" />
                    <path d="M40,-140 L10,160" />
                    <!-- Center Lines -->
                    <path d="M0,-140 L0,160" stroke-width="1.5" opacity="1" />
                </g>

                <!-- The Human Figure (Geometric Silhouette) -->
                <g id="human">
                    <!-- Backpack/Rig -->
                    <path d="M-18,145 L18,145 L22,190 L-22,190 Z" fill="#0f172a" />
                    
                    <!-- Legs (Dynamic pose) -->
                    <path d="M-12,185 L-18,230 L-28,250" fill="none" stroke="#020617" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M12,185 L22,230 L32,255" fill="none" stroke="#020617" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
                    
                    <!-- Torso (Angled) -->
                    <path d="M-14,145 L14,145 L12,190 L-12,190 Z" fill="#020617" />
                    
                    <!-- Arms (Steering inputs - pulling toggles) -->
                    <path d="M-12,150 L-40,180 L-30,200" fill="none" stroke="#020617" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M12,150 L40,175 L50,185" fill="none" stroke="#020617" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
                    
                    <!-- Helmet -->
                    <circle cx="0" cy="130" r="13" fill="#1e293b" />
                    <!-- Visor Reflection -->
                    <path d="M-5,125 Q0,122 5,125" fill="none" stroke="#fff" stroke-width="1" opacity="0.3" />
                </g>

                <!-- The Canopy (Segmented with cells) -->
                <g id="canopy">
                    <!-- Main Dome Base -->
                    <path id="canopyShape" d="M-130,-140 Q0,-300 130,-140 Q0,-220 -130,-140 Z" fill="url(#canopyGrad)" />
                    
                    <!-- Cell Pattern Overlay -->
                    <path id="canopyCells" d="M-130,-140 Q0,-300 130,-140 Q0,-220 -130,-140 Z" fill="url(#cells)" opacity="0.6" />
                    
                    <!-- Folds/Shadows -->
                    <path d="M-130,-140 Q-50,-220 0,-180" fill="none" stroke="#451a03" stroke-width="3" opacity="0.4" />
                    <path d="M130,-140 Q50,-220 0,-180" fill="none" stroke="#451a03" stroke-width="3" opacity="0.4" />
                    
                    <!-- Highlight rim (Sunlight) -->
                    <path d="M-130,-140 Q0,-300 130,-140" fill="none" stroke="#fef3c7" stroke-width="2" opacity="0.4" filter="url(#glow)" />
                </g>
            </g>

            <!-- 5. MOTION CUES: Wind Streaks & Haze -->
            <g id="wind-lines">
                <!-- Vertical Speed Lines (Foreground) -->
                <g stroke="#ffffff" stroke-width="1" opacity="0.15" stroke-linecap="round">
                    <line x1="150" y1="-100" x2="150" y2="150" />
                    <line x1="850" y1="-50" x2="850" y2="200" />
                    <line x1="1050" y1="0" x2="1050" y2="250" />
                    <line x1="400" y1="50" x2="400" y2="300" stroke-width="2" opacity="0.05" />
                </g>
                
                <!-- Atmospheric Haze / Dust (Horizontal) -->
                <g stroke="#fff" stroke-width="2" opacity="0.1" filter="url(#blurMedium)">
                    <path d="M600,300 Q900,280 1200,320" fill="none" />
                    <path d="M550,500 Q850,480 1150,520" fill="none" />
                    <path d="M650,150 Q950,130 1250,170" fill="none" />
                </g>
            </g>

        </svg>

        <!-- EDITORIAL OVERLAY -->
        <div class="overlay">
            
            <div class="header-section">
                <div class="tag">Operation: High Altitude</div>
                <h1>Controlled<br><span>Descent.</span></h1>
                <p class="lead">
                    Navigating the vertical gap between geological permanence and human fragility. 
                    A study in tension, aerodynamics, and the quiet moments of freefall.
                </p>
            </div>

            <div class="dashboard-container">
                <div class="data-grid">
                    <div class="data-point">
                        <span class="data-label">Altitude</span>
                        <span class="data-value" id="alt-val">4,200</span>
                        <span class="data-unit">ft</span>
                    </div>
                    <div class="data-point">
                        <span class="data-label">Wind Speed</span>
                        <span class="data-value" id="wind-val">24</span>
                        <span class="data-unit">mph</span>
                    </div>
                    <div class="data-point">
                        <span class="data-label">Descent Rate</span>
                        <span class="data-value" id="rate-val">180</span>
                        <span class="data-unit">fpm</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const parachute = document.getElementById('parachutist');
            const canopyShape = document.getElementById('canopyShape');
            const canopyCells = document.getElementById('canopyCells');
            const shadow = document.getElementById('shadow');
            const human = document.getElementById('human');
            const windLines = document.getElementById('wind-lines');
            const bgMountains = document.getElementById('bg-mountains');
            
            const altVal = document.getElementById('alt-val');
            const windVal = document.getElementById('wind-val');
            const rateVal = document.getElementById('rate-val');
            
            let time = 0;
            // Simulation speed (automated)
            let speed = 40; 
            let altitude = 4200;
            let windSpeed = 24;

            // Mouse interaction for parallax
            const scene = document.getElementById('scene');
            let mouseX = 0;
            let mouseY = 0;

            scene.addEventListener('mousemove', (e) => {
                const rect = scene.getBoundingClientRect();
                // Normalize -1 to 1
                mouseX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                mouseY = ((e.clientY - rect.top) / rect.height) * 2 - 1;
            });

            function animate() {
                time += 0.015 * (speed / 30);
                
                // 1. Floating Motion (Sine waves)
                // Sway X: Gentle side to side
                const swayX = Math.sin(time * 0.8) * 40;
                // Sway Y: Bobbing up and down
                const swayY = Math.cos(time * 0.5) * 20;
                
                // 2. Pendulum Physics (Human swings opposite to canopy)
                const swing = Math.sin(time * 0.8) * 12;
                
                // 3. Canopy Flex (Breathing)
                const flex = Math.sin(time * 4) * 10;

                // Apply Parallax to Scene Elements
                // Move mountains slightly opposite to mouse for depth
                const bgX = mouseX * -30;
                const bgY = mouseY * -15;
                bgMountains.setAttribute('transform', `translate(${bgX}, ${bgY})`);

                // Apply Transforms to Parachutist
                // Base position + Mouse influence + Sway
                const baseX = 700 + (mouseX * 50) + swayX;
                const baseY = 350 + (mouseY * 50) + swayY;
                
                parachute.setAttribute('transform', `translate(${baseX}, ${baseY})`);

                // Swing the human figure relative to the connection point
                human.setAttribute('transform', `rotate(${swing}, -5, 160)`);

                // Flex the canopy shape
                const topY = -300 + flex;
                const botY = -220 + (flex * 0.5);
                const pathD = `M-130,-140 Q0,${topY} 130,-140 Q0,${botY} -130,-140 Z`;
                
                canopyShape.setAttribute('d', pathD);
                canopyCells.setAttribute('d', pathD);

                // Move Shadow on cliff (Parallax relative to cliff)
                // Shadow moves differently than the object to show height
                const shadowX = -180 + (swayX * 0.4); 
                shadow.setAttribute('cx', shadowX);
                shadow.setAttribute('opacity', 0.3 + (Math.sin(time * 0.5) * 0.1));

                // Wind Lines Animation (Scrolling effect)
                const windOffset = (time * 60 * (speed/30)) % 300;
                windLines.setAttribute('transform', `translate(0, ${windOffset})`);

                // Simulate Data Drop
                altitude -= (speed * 0.05);
                // Fluctuate wind speed slightly
                windSpeed = 24 + Math.sin(time * 2) * 3;
                
                if (altitude < 500) {
                    altitude = 4500; // Reset loop
                }

                // Update DOM
                altVal.innerText = Math.floor(altitude).toLocaleString();
                windVal.innerText = Math.floor(windSpeed);
                rateVal.innerText = Math.floor(180 + (speed/2));

                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>
</body>
</html>
