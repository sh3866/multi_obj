<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Visualization: The Sign</title>
    <style>
        :root {
            /* Environment */
            --wall-color: #E4E8EE;
            --floor-color: #CDD3DC;
            --horizon-line: #D0D5DC;
            
            /* Sign Material: High-Gloss White Acrylic */
            --sign-face: #FFFFFF;
            --sign-face-edge: #F2F2F2;
            --sign-side: #D1D5DB; /* Light gray thickness */
            --sign-top: #E5E7EB; /* Very light gray top */
            --sign-shadow: #9CA3AF;
            
            /* Emblem: Premium Red */
            --red-base: #D91B1B;
            --red-dark: #7F1D1D;
            --red-light: #F87171;
            
            /* Hardware: Matte Black Metal */
            --metal-dark: #1F2937;
            --metal-light: #4B5563;
            --metal-shine: #9CA3AF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: var(--wall-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            perspective: 1400px; /* Deep perspective for realistic 3D */
        }

        /* --- Studio Environment --- */
        .studio-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: linear-gradient(to bottom, var(--wall-color) 50%, var(--floor-color) 50%);
        }
        
        /* Horizon Line Detail */
        .studio-container::after {
            content: '';
            position: absolute;
            top: 50%; left: 0; width: 100%; height: 1px;
            background: rgba(0,0,0,0.05);
        }

        /* --- The Scene (3D Space) --- */
        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
        }

        /* --- Floor Shadows & Reflections --- */
        .ground-shadow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            /* Push onto floor plane */
            transform: translate(-50%, -30%) rotateX(90deg) translateZ(-250px); 
            background: radial-gradient(circle, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.05) 30%, transparent 60%);
            filter: blur(15px);
            pointer-events: none;
        }

        /* --- The Sign Assembly --- */
        .sign-assembly {
            position: relative;
            width: 420px;
            height: 540px;
            transform-style: preserve-3d;
            /* Initial Pose */
            transform: rotateX(10deg) rotateY(-20deg);
            transition: transform 0.1s linear;
            cursor: pointer;
        }

        /* 1. THE SIGN VOLUME (Faces) */
        .sign-body {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        /* Front Face: Pristine White */
        .sign-face {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FFFFFF 0%, #F9FAFB 100%);
            border-radius: 16px;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05); /* Subtle rim */
            transform: translateZ(25px); /* Half of 50px thickness */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            overflow: hidden;
        }
        
        /* Face Reflection (Glass/Acrylic effect) */
        .sign-face::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(105deg, rgba(255,255,255,0.8) 0%, transparent 40%, transparent 60%, rgba(255,255,255,0.3) 100%);
            pointer-events: none;
        }

        /* Right Edge: Thickness Shadow */
        .sign-edge-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 50px;
            height: 100%;
            background: linear-gradient(to right, var(--sign-side), var(--sign-shadow));
            transform-origin: left center;
            transform: rotateY(90deg);
            border-radius: 0 8px 8px 0;
        }

        /* Bottom Edge: Darker due to shadow */
        .sign-edge-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: linear-gradient(to bottom, var(--sign-side), var(--sign-shadow));
            transform-origin: top center;
            transform: rotateX(-90deg);
            border-radius: 0 0 8px 8px;
        }

        /* Top Edge: Highlight (Light Source) */
        .sign-edge-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: var(--sign-top);
            transform-origin: bottom center;
            transform: rotateX(90deg);
            border-radius: 8px 8px 0 0;
        }

        /* 2. THE EMBLEM (SVG) */
        .emblem-wrapper {
            width: 240px;
            height: 240px;
            position: relative;
            z-index: 20;
            /* Subtle lift off the surface */
            transform: translateZ(4px);
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
        }

        /* 3. HARDWARE (The Stand) */
        .stand-assembly {
            position: absolute;
            bottom: 60px; /* Position relative to sign bottom */
            left: 50%;
            width: 160px;
            height: 100px;
            transform: translateX(-50%) translateZ(-20px) rotateX(90deg); /* Start flat on floor */
            transform-style: preserve-3d;
            /* Counter-rotate to stand up */
            transform: translateX(-50%) translateZ(0px) rotateX(0deg) translateY(20px); 
        }

        /* Vertical Stem */
        .stand-stem {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 12px;
            height: 120px;
            background: linear-gradient(to right, var(--metal-dark), var(--metal-light), var(--metal-dark));
            transform: translateX(-50%) rotateX(-90deg) translateZ(-25px); /* Stick out from back */
            border-radius: 2px;
        }

        /* Base Plate (on floor) */
        .stand-base {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 120px;
            height: 12px;
            background: linear-gradient(to bottom, var(--metal-light), var(--metal-dark));
            transform: translateX(-50%) rotateX(90deg) translateZ(60px); /* Push forward to meet sign */
            border-radius: 4px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.4);
        }

        /* Connector (Hidden mostly, but adds realism) */
        .stand-connector {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 24px;
            height: 120px;
            background: var(--metal-dark);
            transform: translateX(-50%) rotateX(-90deg) translateZ(25px);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .sign-assembly {
                width: 320px;
                height: 420px;
            }
            .emblem-wrapper { width: 180px; height: 180px; }
            .sign-edge-right, .sign-edge-bottom, .sign-edge-top { height: 40px; width: 40px; }
        }
    </style>
</head>
<body>

    <!-- Background Environment -->
    <div class="studio-container"></div>

    <div class="scene">
        <!-- Ground Shadow -->
        <div class="ground-shadow"></div>

        <div class="sign-assembly" id="sign">
            
            <!-- 1. The Sign Volume -->
            <div class="sign-body">
                <!-- Top Edge (Light) -->
                <div class="sign-edge-top"></div>
                
                <!-- Right Edge (Shadow) -->
                <div class="sign-edge-right"></div>
                
                <!-- Bottom Edge (Shadow) -->
                <div class="sign-edge-bottom"></div>

                <!-- Front Face -->
                <div class="sign-face">
                    <!-- The Red Play Button Emblem -->
                    <div class="emblem-wrapper">
                        <svg class="emblem-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <!-- Red Gradient: 3D Sphere Look -->
                                <radialGradient id="redSphere" cx="35%" cy="35%" r="65%">
                                    <stop offset="0%" stop-color="#FF8A8A" /> <!-- Top Left Highlight -->
                                    <stop offset="40%" stop-color="#E62424" /> <!-- Main Color -->
                                    <stop offset="90%" stop-color="#991B1B" /> <!-- Bottom Right Shadow -->
                                    <stop offset="100%" stop-color="#7F1D1D" /> <!-- Rim Shadow -->
                                </radialGradient>

                                <!-- Inner Shadow for Depth -->
                                <radialGradient id="innerShadow" cx="50%" cy="50%" r="50%">
                                    <stop offset="85%" stop-color="transparent" />
                                    <stop offset="100%" stop-color="rgba(0,0,0,0.4)" />
                                </radialGradient>
                                
                                <!-- Glossy Specular Highlight -->
                                <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stop-color="rgba(255,255,255,0.9)" />
                                    <stop offset="100%" stop-color="rgba(255,255,255,0)" />
                                </linearGradient>
                                
                                <!-- Triangle Gradient -->
                                <linearGradient id="triGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stop-color="#FFFFFF" />
                                    <stop offset="100%" stop-color="#E5E7EB" />
                                </linearGradient>
                            </defs>

                            <!-- Main Red Circle -->
                            <circle cx="100" cy="100" r="90" fill="url(#redSphere)" />
                            
                            <!-- Inner Shadow Overlay -->
                            <circle cx="100" cy="100" r="90" fill="url(#innerShadow)" />
                            
                            <!-- Glossy Specular Highlight (Crescent) -->
                            <path d="M 45 60 A 60 60 0 0 1 155 60 A 65 65 0 0 0 45 60 Z" fill="url(#gloss)" opacity="0.8" filter="blur(1px)"/>

                            <!-- The Play Triangle (Crisp, Centered) -->
                            <path d="M85 75 L135 100 L85 125 Z" fill="url(#triGradient)" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- 2. The Hardware (Stand) -->
            <div class="stand-assembly">
                <div class="stand-base"></div>
                <div class="stand-connector"></div>
                <div class="stand-stem"></div>
            </div>

        </div>
    </div>

    <script>
        // Interaction: Subtle Parallax to reinforce 3D depth
        const sign = document.getElementById('sign');
        const scene = document.querySelector('.scene');

        // State
        let current = { x: 10, y: -20 }; // Matches CSS initial transform
        let target = { x: 10, y: -20 };
        
        // Configuration
        const sensitivity = 10; // Reduced sensitivity for smoother feel
        const lerpFactor = 0.08; // Smoothness

        // Event Listeners
        scene.addEventListener('mousemove', (e) => {
            const rect = scene.getBoundingClientRect();
            // Normalize mouse position (-1 to 1)
            const mouseX = (e.clientX - rect.left) / rect.width - 0.5;
            const mouseY = (e.clientY - rect.top) / rect.height - 0.5;

            // Calculate target rotation
            // Invert Y logic: Mouse up -> Rotate X negative (tilt back)
            target.y = mouseX * sensitivity - 20; 
            target.x = -mouseY * sensitivity + 10; 
        });

        scene.addEventListener('mouseleave', () => {
            // Return to rest position
            target.x = 10;
            target.y = -20;
        });

        // Animation Loop
        function animate() {
            // Linear Interpolation (Lerp)
            current.x += (target.x - current.x) * lerpFactor;
            current.y += (target.y - current.y) * lerpFactor;

            // Apply transform
            sign.style.transform = `rotateX(${current.x}deg) rotateY(${current.y}deg)`;

            requestAnimationFrame(animate);
        }

        // Start loop
        animate();
    </script>
</body>
</html>
