<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Product Visual: The Sign</title>
    <style>
        :root {
            /* Lighting & Environment */
            --bg-wall-top: #F2F4F8;
            --bg-wall-bottom: #D9DEE6;
            --bg-floor: #C4CBD5;
            
            /* Sign Material: Pristine White */
            --sign-face-light: #FFFFFF;
            --sign-face-shadow: #F1F3F6;
            
            /* Sign Thickness: Dark Grey Extrusion */
            --sign-edge-light: #E0E0E0;
            --sign-edge-dark: #9EA4B0;
            
            /* Emblem: Vibrant Red */
            --brand-red: #E62424;
            --brand-red-highlight: #FF5B5B;
            --brand-red-shadow: #A60D0D;
            
            /* Hardware: Metallic */
            --metal-base: #2A2A2A;
            --metal-highlight: #5A5A5A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Studio Environment Gradient */
            background: linear-gradient(180deg, var(--bg-wall-top) 0%, var(--bg-wall-bottom) 60%, var(--bg-floor) 60%, #AAB2C0 100%);
            perspective: 1200px;
        }

        /* --- Scene Container --- */
        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
        }

        /* --- The Sign Object --- */
        .sign-wrapper {
            position: relative;
            width: 420px;
            height: 560px;
            transform-style: preserve-3d;
            /* Initial Presentation Angle */
            transform: rotateX(5deg) rotateY(-10deg);
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            cursor: pointer;
        }

        .sign-wrapper:hover {
            transform: rotateX(0deg) rotateY(-2deg) scale(1.02);
        }

        /* 1. The Thickness (Extrusion) 
           This sits behind the face. We use a pseudo-element to create the "side" of the slab. 
           By translating it back, we create depth. 
        */
        .sign-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 18px;
            /* Gradient simulating light hitting the side edge from top-left */
            background: linear-gradient(135deg, var(--sign-edge-light) 0%, var(--sign-edge-dark) 100%);
            /* Push back to create thickness */
            transform: translateZ(-24px); 
            z-index: 0;
        }

        /* 2. The Face (Front) */
        .sign-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 18px;
            /* Material: High-key white with subtle shading for curvature/plasticity */
            background: linear-gradient(145deg, var(--sign-face-light) 0%, var(--sign-face-shadow) 100%);
            
            /* Rim Light: Inset white shadow to create a glossy edge highlight */
            box-shadow: 
                inset 2px 2px 0px rgba(255,255,255,1),
                inset -1px -1px 0px rgba(0,0,0,0.02);
            
            z-index: 10;
            transform: translateZ(0px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Clips the emblem if it gets too big */
        }

        /* 3. The Emblem */
        .emblem-container {
            width: 180px;
            height: 180px;
            position: relative;
            z-index: 20;
        }

        .emblem-svg {
            width: 100%;
            height: 100%;
            /* Soft drop shadow to lift the emblem off the white face */
            filter: drop-shadow(0 12px 12px rgba(0, 0, 0, 0.15));
            transition: filter 0.4s ease;
        }

        .sign-wrapper:hover .emblem-svg {
            filter: drop-shadow(0 16px 18px rgba(0, 0, 0, 0.2));
        }

        /* 4. Mounting Hardware */
        /* 
           Realistic top mounting plate. 
           Positioned above the sign face, slightly protruding (translateZ). 
        */
        .mount-plate {
            position: absolute;
            top: -40px; /* Float above the sign */
            left: 50%;
            transform: translateX(-50%) translateZ(10px); /* Protrudes slightly */
            width: 160px;
            height: 28px;
            background: linear-gradient(to bottom, #444, #222);
            border-radius: 4px;
            z-index: 30;
            box-shadow: 
                0 4px 6px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255,255,255,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        /* Screws */
        .screw {
            width: 10px;
            height: 10px;
            background: radial-gradient(circle at 30% 30%, #888, #333);
            border-radius: 50%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.5);
            position: relative;
        }
        
        /* Screw slot */
        .screw::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 1px;
            background: #111;
            transform: translate(-50%, -50%) rotate(45deg);
        }

        /* 5. Context: Floor Shadow */
        /* 
           A soft, diffuse ellipse on the "floor" behind the sign.
           Anchors the object in space.
        */
        .floor-shadow {
            position: absolute;
            bottom: -180px; /* Distance from bottom of sign */
            left: 50%;
            transform: translateX(-50%) rotateX(80deg);
            width: 500px;
            height: 150px;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0) 70%);
            z-index: -1; /* Behind everything */
            pointer-events: none;
            filter: blur(10px);
        }

        /* Responsive Adjustments */
        @media (max-width: 600px) {
            .sign-wrapper { 
                width: 300px; 
                height: 400px; 
                transform: rotateX(5deg) rotateY(-5deg);
            }
            .emblem-container { width: 140px; height: 140px; }
            .mount-plate { width: 120px; top: -35px; }
        }
    </style>
</head>
<body>

    <div class="scene">
        <!-- Floor Shadow to ground the object -->
        <div class="floor-shadow"></div>

        <div class="sign-wrapper" id="sign">
            
            <!-- Mounting Hardware (Top Plate) -->
            <div class="mount-plate">
                <div class="screw"></div>
                <div class="screw"></div>
            </div>

            <!-- Main Sign Face -->
            <div class="sign-face">
                
                <!-- The Emblem -->
                <div class="emblem-container">
                    <svg class="emblem-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- Vibrant Red Gradient for the emblem -->
                            <linearGradient id="redGrad" x1="10%" y1="10%" x2="90%" y2="90%">
                                <stop offset="0%" style="stop-color:#FF5B5B;stop-opacity:1" />
                                <stop offset="50%" style="stop-color:#E62424;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#B31B1B;stop-opacity:1" />
                            </linearGradient>
                            
                            <!-- Subtle Gloss Overlay for the emblem -->
                            <linearGradient id="emblemGloss" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
                                <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0" />
                            </linearGradient>
                        </defs>
                        
                        <!-- Red Circle Base -->
                        <circle cx="100" cy="100" r="85" fill="url(#redGrad)" />
                        
                        <!-- Glossy Highlight Overlay -->
                        <ellipse cx="100" cy="60" rx="65" ry="35" fill="url(#emblemGloss)" />

                        <!-- Play Triangle (Geometrically Crisp) -->
                        <!-- Centered precisely: x=88 to 148, y=72 to 128 -->
                        <path class="play-btn" d="M88 72 L148 100 L88 128 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round"/>
                    </svg>
                </div>

            </div>

        </div>
    </div>

    <script>
        // Minimal Interaction: Subtle parallax to emphasize the 3D depth
        const sign = document.getElementById('sign');
        const scene = document.querySelector('.scene');

        // Use requestAnimationFrame for smoother updates
        let targetRotateX = 5;
        let targetRotateY = -10;
        let currentRotateX = 5;
        let currentRotateY = -10;

        scene.addEventListener('mousemove', (e) => {
            const rect = scene.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            // Calculate rotation intensity
            const intensity = 15; 
            targetRotateY = ((x - centerX) / centerX) * intensity;
            targetRotateX = -((y - centerY) / centerY) * intensity + 5; // +5 keeps it slightly tilted down
        });

        scene.addEventListener('mouseleave', () => {
            targetRotateX = 5;
            targetRotateY = -10;
        });

        function animate() {
            // Linear interpolation for smooth movement
            currentRotateX += (targetRotateX - currentRotateX) * 0.1;
            currentRotateY += (targetRotateY - currentRotateY) * 0.1;

            sign.style.transform = `rotateX(${currentRotateX}deg) rotateY(${currentRotateY}deg)`;
            
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
