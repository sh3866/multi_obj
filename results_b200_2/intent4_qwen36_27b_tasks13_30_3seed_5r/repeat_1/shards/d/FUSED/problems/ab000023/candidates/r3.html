<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Product Visual: The Sign</title>
    <style>
        :root {
            /* Environment */
            --bg-top: #EBEEF1;
            --bg-bottom: #D0D5DC;
            --floor-color: #C0C7D0;
            
            /* Sign Material */
            --sign-white: #FFFFFF;
            --sign-shadow: #E8EBF0;
            --sign-thickness-top: #F4F5F7;
            --sign-thickness-side: #BCC0C9;
            --sign-thickness-dark: #9CA2AD;
            
            /* Emblem */
            --red-primary: #E62424;
            --red-dark: #B31B1B;
            --red-highlight: #FF5B5B;
            
            /* Hardware */
            --chrome-base: #333;
            --chrome-light: #888;
            --chrome-shine: #FFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 65%, var(--floor-color) 65%, #AAB2C0 100%);
            perspective: 1500px;
        }

        /* --- Scene Container --- */
        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
        }

        /* --- The Sign Object --- */
        .sign-wrapper {
            position: relative;
            width: 440px;
            height: 580px;
            transform-style: preserve-3d;
            /* Initial Presentation Angle */
            transform: rotateX(10deg) rotateY(-15deg);
            transition: transform 0.1s linear; /* Smooth JS updates */
            cursor: pointer;
        }

        /* 
           1. PHYSICAL THICKNESS 
           We construct the 3D volume using distinct faces rather than a simple pseudo-element.
           This allows for proper lighting on different edges (top vs side).
        */
        
        /* The Extrusion Base (Bottom & Back) */
        .sign-extrusion {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 24px;
            /* Push back to create depth */
            transform: translateZ(-24px); 
            background: #000; /* Fallback */
            z-index: 0;
        }

        /* The Side Face (Right/Bottom visible edge) */
        .sign-edge {
            position: absolute;
            border-radius: 24px;
            z-index: 1;
        }
        
        /* Right Edge */
        .sign-edge.right {
            top: 0; right: 0;
            width: 24px; height: 100%;
            transform-origin: left center;
            transform: rotateY(90deg);
            background: linear-gradient(to bottom, var(--sign-thickness-top), var(--sign-thickness-dark));
            /* Subtle edge bevel */
            box-shadow: inset 2px 0 5px rgba(255,255,255,0.2);
        }
        
        /* Bottom Edge */
        .sign-edge.bottom {
            bottom: 0; left: 0;
            width: 100%; height: 24px;
            transform-origin: top center;
            transform: rotateX(-90deg);
            background: linear-gradient(to right, var(--sign-thickness-side), var(--sign-thickness-dark));
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.2);
        }

        /* 2. The Face (Front) */
        .sign-face {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 24px;
            /* Material: Pristine White with subtle noise/grain simulation */
            background: 
                radial-gradient(circle at 50% 120%, rgba(0,0,0,0.02) 0%, transparent 60%),
                linear-gradient(145deg, #FFFFFF 0%, #F9FAFB 100%);
            
            /* 3. ENHANCED MATERIALITY: Inner shadows for "sunk" look */
            box-shadow: 
                inset 1px 1px 0px rgba(255,255,255,1), /* Top-left rim light */
                inset -2px -2px 4px rgba(0,0,0,0.05), /* Bottom-right ambient occlusion */
                inset 0 0 20px rgba(200,200,200,0.2); /* Soft inner glow */
            
            z-index: 10;
            transform: translateZ(0px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 
           4. MOUNTING HARDWARE 
           Redesigned to physically connect. A cleat mount attached to the back/top.
        */
        .mount-hardware {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%) translateZ(-12px); /* Halfway through the thickness */
            width: 180px;
            height: 60px;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* The visible cleat/bracket */
        .bracket-plate {
            position: absolute;
            top: -30px; /* Extends up behind the sign */
            width: 120px;
            height: 40px;
            background: linear-gradient(to bottom, #444, #222);
            border-radius: 6px 6px 0 0;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.3);
        }

        /* Screws attaching bracket to sign back */
        .screw-mount {
            position: absolute;
            top: 10px;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle at 30% 30%, #999, #333);
            border-radius: 50%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }
        .screw-mount::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 8px; height: 1px;
            background: #111;
            transform: translate(-50%, -50%) rotate(45deg);
        }
        .screw-left { left: 20px; }
        .screw-right { right: 20px; }

        /* 3. AMBIENT OCCLUSION: Darkening where bracket meets sign */
        .hardware-shadow {
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%) translateZ(1px); /* Just in front of face */
            width: 140px;
            height: 20px;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, transparent 80%);
            z-index: 11;
            pointer-events: none;
        }

        /* 3. The Emblem (Polished) */
        .emblem-container {
            width: 200px;
            height: 200px;
            position: relative;
            z-index: 20;
        }

        .emblem-svg {
            width: 100%;
            height: 100%;
            /* Soft, realistic drop shadow to sit ON the sign */
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.25));
            transition: filter 0.4s ease;
        }

        /* 4. Context: Floor Shadow */
        .floor-shadow {
            position: absolute;
            bottom: -200px; /* Distance from bottom of sign */
            left: 50%;
            transform: translateX(-50%) rotateX(90deg);
            width: 600px;
            height: 200px;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.05) 50%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
            filter: blur(15px);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .sign-wrapper { 
                width: 300px; 
                height: 400px; 
            }
            .emblem-container { width: 140px; height: 140px; }
            .mount-hardware { width: 120px; }
            .bracket-plate { width: 80px; }
        }
    </style>
</head>
<body>

    <div class="scene">
        <!-- Floor Shadow -->
        <div class="floor-shadow"></div>

        <div class="sign-wrapper" id="sign">
            
            <!-- 3D Extrusion Layer -->
            <div class="sign-extrusion">
                <div class="sign-edge right"></div>
                <div class="sign-edge bottom"></div>
            </div>

            <!-- Mounting Hardware (Attached to back/top) -->
            <div class="mount-hardware">
                <div class="bracket-plate"></div>
                <div class="screw-mount screw-left"></div>
                <div class="screw-mount screw-right"></div>
            </div>
            
            <!-- Shadow cast by hardware onto the sign face -->
            <div class="hardware-shadow"></div>

            <!-- Main Sign Face -->
            <div class="sign-face">
                
                <!-- The Emblem -->
                <div class="emblem-container">
                    <svg class="emblem-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- Complex Red Gradient for "Glossy" feel -->
                            <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
                                <stop offset="40%" style="stop-color:#E62424;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#A60D0D;stop-opacity:1" />
                            </linearGradient>
                            
                            <!-- Top Gloss Highlight -->
                            <linearGradient id="emblemGloss" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.6" />
                                <stop offset="40%" style="stop-color:#FFFFFF;stop-opacity:0" />
                            </linearGradient>

                            <!-- Bevel Shadow -->
                            <filter id="bevel" x="-20%" y="-20%" width="140%" height="140%">
                                <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
                                <feOffset dx="1" dy="1" result="offsetBlur"/>
                                <feFlood flood-color="#660000" flood-opacity="0.4" result="shadowColor"/>
                                <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
                                <feMerge>
                                    <feMergeNode in="shadow"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>
                        
                        <!-- Red Circle Base -->
                        <circle cx="100" cy="100" r="85" fill="url(#redGrad)" filter="url(#bevel)" />
                        
                        <!-- Glossy Highlight Overlay (Simulates curvature) -->
                        <ellipse cx="100" cy="65" rx="70" ry="35" fill="url(#emblemGloss)" />

                        <!-- Play Triangle (Geometrically Crisp, Centered) -->
                        <!-- x=85 to 145, y=75 to 125 -->
                        <path class="play-btn" d="M85 75 L145 100 L85 125 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
                    </svg>
                </div>

            </div>

        </div>
    </div>

    <script>
        // Interaction: Parallax to emphasize 3D volume
        const sign = document.getElementById('sign');
        const scene = document.querySelector('.scene');

        let targetRotateX = 10;
        let targetRotateY = -15;
        let currentRotateX = 10;
        let currentRotateY = -15;

        // Throttle mousemove for performance
        let isMoving = false;

        scene.addEventListener('mousemove', (e) => {
            if (!isMoving) {
                requestAnimationFrame(() => {
                    const rect = scene.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    
                    // Calculate rotation intensity (gentle movement)
                    const intensity = 10; 
                    targetRotateY = ((x - centerX) / centerX) * intensity;
                    targetRotateX = -((y - centerY) / centerY) * intensity + 10; 
                    
                    isMoving = false;
                });
                isMoving = true;
            }
        });

        scene.addEventListener('mouseleave', () => {
            targetRotateX = 10;
            targetRotateY = -15;
        });

        function animate() {
            // Smooth Lerp (Linear Interpolation)
            currentRotateX += (targetRotateX - currentRotateX) * 0.08;
            currentRotateY += (targetRotateY - currentRotateY) * 0.08;

            sign.style.transform = `rotateX(${currentRotateX}deg) rotateY(${currentRotateY}deg)`;
            
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
