<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncy & Bolt - The Great Spring Adventure</title>
    <style>
        /* 
         * DESIGN SYSTEM & RESET 
         * Focus: Joyful, expressive, and clean hierarchy.
         */
        :root {
            --c-sky-top: #4FC3F7;
            --c-sky-bot: #E1F5FE;
            --c-primary: #FF6F00; /* Bouncy Orange */
            --c-primary-light: #FFA000;
            --c-primary-dark: #E65100;
            --c-accent: #0288D1; /* Bolt Blue */
            --c-gold: #FFD700;
            --c-gold-dark: #FFA000;
            --c-text: #263238;
            --c-white: #FFFFFF;
            --c-dark: #1C1C1C;
            --font-head: 'Arial Black', 'Impact', sans-serif;
            --font-body: 'Verdana', 'Segoe UI', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-body);
            background: #000;
            color: var(--c-text);
            user-select: none;
        }

        /* LAYOUT GRID */
        #app {
            display: grid;
            grid-template-rows: 1fr;
            width: 100%;
            height: 100%;
            position: relative;
            background: linear-gradient(180deg, var(--c-sky-top) 0%, var(--c-sky-bot) 100%);
        }

        /* CANVAS LAYER */
        #world-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: block;
        }

        /* UI OVERLAY LAYER */
        .ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        .ui-interactive {
            pointer-events: auto;
        }

        /* --- HEADER: TOP CENTER --- */
        header {
            position: absolute;
            top: 30px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .brand {
            text-align: center;
            transform: skewY(-3deg); /* Dynamic tilt */
            pointer-events: none;
        }
        
        h1 {
            font-family: var(--font-head);
            font-size: 5rem;
            color: var(--c-white);
            text-transform: uppercase;
            line-height: 0.9;
            text-shadow: 
                0 6px 0 var(--c-primary-dark), 
                0 8px 0 var(--c-primary),
                0 15px 25px rgba(0,0,0,0.15);
            letter-spacing: 2px;
            margin-bottom: 5px;
            filter: drop-shadow(0px 4px 0px rgba(0,0,0,0.1));
            position: relative;
        }
        
        .subtitle {
            font-family: var(--font-head);
            color: var(--c-white);
            font-size: 1.5rem;
            background: var(--c-accent);
            padding: 10px 30px;
            border-radius: 30px;
            display: inline-block;
            box-shadow: 0 6px 0 rgba(0,0,0,0.15);
            border: 4px solid var(--c-white);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 15px;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.1);
        }

        /* --- LEFT: WORLD SELECTOR (Portals) --- */
        .world-selector {
            position: absolute;
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 35px;
            z-index: 20;
        }

        .world-portal {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid var(--c-white);
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(8px);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Critique: Add drop shadow to lift off background */
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: visible;
        }

        .world-portal:hover {
            transform: scale(1.1);
            border-color: var(--c-gold);
            box-shadow: 0 0 25px var(--c-gold);
        }

        .world-portal.active {
            border: 5px solid var(--c-gold);
            /* Critique: Selection ring */
            box-shadow: 0 0 0 6px var(--c-white), 0 15px 35px rgba(0,0,0,0.3);
            transform: scale(1.15);
            background: rgba(255,255,255,0.6);
        }

        /* Portal Icons */
        .portal-icon {
            font-size: 2.2rem;
            filter: drop-shadow(0 2px 0 rgba(0,0,0,0.2));
            z-index: 2;
        }
        
        /* Critique: Add text labels to circles */
        .portal-label {
            position: absolute;
            left: 95px; /* To the right of the circle */
            top: 50%;
            transform: translateY(-50%);
            background: var(--c-white);
            padding: 8px 20px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1rem;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            pointer-events: none;
            opacity: 0;
            transform: translateY(-50%) translateX(-10px);
            transition: all 0.2s;
            color: var(--c-text);
            border: 2px solid var(--c-accent);
        }
        
        .world-portal:hover .portal-label,
        .world-portal.active .portal-label {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
        }

        /* --- CENTER: HERO (Canvas) & START BUTTON --- */
        .action-stage {
            position: absolute;
            bottom: 50px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            z-index: 15;
        }

        /* Critique: Giant clickable spring / Coin button */
        .btn-start {
            background: radial-gradient(circle at 30% 30%, var(--c-gold), var(--c-gold-dark));
            color: #FFF;
            font-family: var(--font-head);
            font-size: 2.2rem;
            text-transform: uppercase;
            padding: 25px 60px;
            border: 6px solid #FFF;
            border-radius: 50px; /* Coin shape */
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 
                0 10px 0 var(--c-gold-dark), 
                0 20px 40px rgba(0,0,0,0.3),
                inset 0 -5px 0 rgba(0,0,0,0.1);
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
            pointer-events: auto;
            animation: float-btn 3s ease-in-out infinite;
            letter-spacing: 2px;
            position: relative;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        /* Inner coin detail */
        .btn-start::before {
            content: '';
            position: absolute;
            top: 15px; left: 15px; right: 15px; bottom: 15px;
            border: 2px dashed rgba(255,255,255,0.4);
            border-radius: 50px;
        }

        /* Critique: Hover state glow */
        .btn-start:hover {
            transform: translateY(-5px) scale(1.05);
            background: radial-gradient(circle at 30% 30%, #FFE082, var(--c-gold));
            box-shadow: 
                0 15px 0 var(--c-gold-dark), 
                0 0 30px var(--c-gold),
                0 30px 60px rgba(0,0,0,0.3);
        }

        .btn-start:active {
            transform: translateY(5px) scale(0.98);
            box-shadow: 0 0 0 var(--c-gold-dark), 0 0 0 rgba(0,0,0,0.2);
        }

        /* --- RIGHT: CONTROLS (Integrated) --- */
        /* Critique: Bottom-left, small, unobtrusive */
        .controls-guide {
            position: absolute;
            bottom: 40px;
            left: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,255,255,0.9);
            padding: 10px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            border: 2px solid var(--c-accent);
            pointer-events: auto;
            transform: rotate(-2deg);
        }

        .key {
            width: 40px;
            height: 40px;
            background: var(--c-dark);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-family: var(--font-head);
            font-size: 1rem;
            box-shadow: 0 4px 0 #546E7A;
            border: 2px solid rgba(255,255,255,0.2);
        }
        
        .key.space {
            width: 80px;
            background: var(--c-primary);
            box-shadow: 0 4px 0 var(--c-primary-dark);
            font-size: 0.9rem;
        }
        
        .control-label {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--c-text);
            text-transform: uppercase;
            margin-left: 10px;
            opacity: 0.7;
        }

        /* --- STATS (Top Right) --- */
        /* Critique: Clean semi-transparent HUD overlay */
        .stats-bar {
            position: absolute;
            top: 30px;
            right: 30px;
            display: flex;
            gap: 20px;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.4);
        }

        .stat-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            color: var(--c-white);
            text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
        }
        
        .stat-content { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }

        /* ANIMATIONS */
        @keyframes float-btn {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* Responsive */
        @media (max-width: 800px) {
            .world-selector {
                top: auto;
                bottom: 160px;
                left: 50%;
                transform: translateX(-50%);
                flex-direction: row;
                width: 90%;
                justify-content: center;
            }
            .world-portal { width: 60px; height: 60px; }
            .portal-label { display: none; } /* Hide labels on mobile */
            header { top: 20px; }
            h1 { font-size: 3rem; }
            .subtitle { font-size: 1rem; padding: 8px 20px; }
            .controls-guide { display: none; }
            .btn-start { font-size: 1.8rem; padding: 20px 50px; }
            .stats-bar { top: 15px; right: 15px; padding: 8px 15px; transform: scale(0.9); }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- CANVAS: PARALLAX WORLD -->
    <canvas id="world-canvas"></canvas>

    <!-- HEADER -->
    <header>
        <div class="brand">
            <h1>Bouncy<br>& Bolt</h1>
            <div class="subtitle">The Great Spring Adventure</div>
        </div>
    </header>

    <!-- STATS (Top Right) -->
    <div class="stats-bar">
        <div class="stat-pill">
            <div class="stat-content">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="#FFD700" stroke="#F57F17" stroke-width="2">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M12 6 L12 18" stroke="none" fill="#FFF" />
                </svg>
                <span>1,240</span>
            </div>
        </div>
        <div class="stat-pill">
            <div class="stat-content">
                <!-- Bolt Icon -->
                <svg width="24" height="24" viewBox="0 0 24 24" fill="#29B6F6" stroke="#0288D1" stroke-width="2">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                </svg>
                <span>x5</span>
            </div>
        </div>
    </div>

    <!-- LEFT: WORLD SELECTOR -->
    <aside class="world-selector ui-interactive">
        <!-- Portal 1: Spring Valley -->
        <div class="world-portal active" onclick="selectWorld(this, 'grass')">
            <div class="portal-icon">🌿</div>
            <div class="portal-label">Forest</div>
        </div>
        <!-- Portal 2: Sand Springs -->
        <div class="world-portal" onclick="selectWorld(this, 'sand')">
            <div class="portal-icon">☀️</div>
            <div class="portal-label">Desert</div>
        </div>
        <!-- Portal 3: Cloud Peak -->
        <div class="world-portal" onclick="selectWorld(this, 'sky')">
            <div class="portal-icon">☁️</div>
            <div class="portal-label">Sky</div>
        </div>
    </aside>

    <!-- CENTER: START BUTTON -->
    <main class="action-stage">
        <button class="btn-start">Start Adventure</button>
    </main>

    <!-- BOTTOM LEFT: CONTROLS -->
    <aside class="controls-guide">
        <div class="key">A</div>
        <div class="key">D</div>
        <div class="key space">SPACE</div>
        <div class="control-label">Controls</div>
    </aside>
</div>

<script>
    /**
     * VISUAL ENGINE
     * Renders a parallax world, a "springy" hero, enemies, and particles.
     * Updated to include mid-ground depth and world switching logic.
     */
    const canvas = document.getElementById('world-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let frame = 0;
    let mouseX = 0; // For subtle parallax tilt
    let currentWorld = 'grass'; // grass, sand, sky

    // Resize
    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', e => mouseX = (e.clientX / width - 0.5) * 20);
    resize();

    // CONFIG
    const THEMES = {
        grass: {
            skyTop: '#4FC3F7', skyBot: '#E1F5FE',
            hill: '#AED581', hillDark: '#9CCC65',
            ground: '#8D6E63', grass: '#66BB6A', grassLight: '#81C784',
            block: '#795548', blockDark: '#4E342E',
            // Critique: Lighter earth tone
            groundTop: '#A1887F'
        },
        sand: {
            skyTop: '#FFB74D', skyBot: '#FFF3E0',
            hill: '#FFE0B2', hillDark: '#FFCC80',
            ground: '#D7CCC8', grass: '#8D6E63', grassLight: '#A1887F',
            block: '#BCAAA4', blockDark: '#5D4037',
            groundTop: '#EFEBE9'
        },
        sky: {
            skyTop: '#80DEEA', skyBot: '#E0F7FA',
            hill: '#B2EBF2', hillDark: '#80DEEA',
            ground: '#B0BEC5', grass: '#CFD8DC', grassLight: '#ECEFF1',
            block: '#90A4AE', blockDark: '#546E7A',
            groundTop: '#ECEFF1'
        }
    };

    // --- DRAWING HELPERS ---

    function drawRoundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    function drawCloud(x, y, scale, opacity) {
        ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
        ctx.beginPath();
        ctx.arc(x, y, 30 * scale, 0, Math.PI * 2);
        ctx.arc(x + 25 * scale, y - 10 * scale, 35 * scale, 0, Math.PI * 2);
        ctx.arc(x + 50 * scale, y, 30 * scale, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawHill(x, y, radius, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, radius, Math.PI, 0);
        ctx.fill();
    }

    function drawGroundPlatform(x, y, w, h) {
        const t = THEMES[currentWorld];
        
        // Ground Body
        ctx.fillStyle = t.ground;
        drawRoundRect(x, y, w, h, 10);
        ctx.fill();
        
        // Texture (dirt spots)
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        for(let i=0; i<w; i+=40) {
            ctx.beginPath(); ctx.arc(x + i + 10, y + 30, 5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + i + 25, y + 60, 8, 0, Math.PI*2); ctx.fill();
        }

        // Critique: Lighter grass/sand top
        ctx.fillStyle = t.grass;
        drawRoundRect(x, y, w, 30, 10);
        ctx.fill();

        // Highlight
        ctx.fillStyle = t.grassLight;
        ctx.fillRect(x + 10, y + 5, w - 20, 6);
    }

    function drawBlock(x, y, size, type) {
        const t = THEMES[currentWorld];
        let color = t.block;
        if(type === 'gold') color = '#FFCA28';

        ctx.fillStyle = color;
        ctx.fillRect(x, y, size, size);
        
        // 3D effect
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(x, y, size, 4);
        ctx.fillRect(x, y, 4, size);
        
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(x, y + size - 4, size, 4);
        ctx.fillRect(x + size - 4, y, 4, size);

        if(type === 'gold') {
            // Question mark
            ctx.fillStyle = '#FFF';
            ctx.font = `bold ${size/1.5}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('?', x + size/2, y + size/2 + 2);
        } else {
            // Bolt pattern
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.beginPath(); ctx.arc(x+size/2, y+size/2, size/3, 0, Math.PI*2); ctx.fill();
        }
    }

    function drawHero(x, y, bounceOffset) {
        const hY = y + bounceOffset;
        
        // Shadow
        const shadowScale = 1 - (Math.abs(bounceOffset) / 100);
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(x, y + 60, 30 * shadowScale, 10 * shadowScale, 0, 0, Math.PI*2);
        ctx.fill();

        // Spring
        ctx.fillStyle = '#90A4AE';
        // Draw spring lines
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#546E7A';
        ctx.beginPath();
        ctx.moveTo(x - 20, hY + 45);
        for(let i=0; i<5; i++) {
            ctx.lineTo(x + (i%2==0 ? 20 : -20), hY + 55 + (i*10));
        }
        ctx.lineTo(x, hY + 105); // Base
        ctx.stroke();
        
        // Spring Base
        ctx.fillStyle = '#455A64';
        ctx.fillRect(x - 20, hY + 100, 40, 15);

        // Critique: Scale Hero up
        // Body (Mascot)
        ctx.fillStyle = '#FF6F00';
        ctx.beginPath();
        ctx.arc(x, hY, 45, 0, Math.PI*2);
        ctx.fill();
        // Outline
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#263238';
        ctx.stroke();

        // Face
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.ellipse(x, hY - 5, 28, 20, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();

        // Eyes
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(x - 10, hY - 5, 4, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 10, hY - 5, 4, 0, Math.PI*2); ctx.fill();

        // Smile
        ctx.beginPath();
        ctx.arc(x, hY + 5, 14, 0.2, Math.PI - 0.2);
        ctx.stroke();
    }

    function drawEnemy(x, y) {
        // Goomba-like sprite
        ctx.fillStyle = '#E53935';
        ctx.beginPath();
        ctx.moveTo(x, y + 25);
        ctx.quadraticCurveTo(x, y - 25, x + 35, y - 15); // Head
        ctx.quadraticCurveTo(x + 70, y - 25, x + 70, y + 25);
        ctx.lineTo(x, y + 25);
        ctx.fill();
        
        // Feet
        const walk = Math.sin(frame * 0.2) * 6;
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(x + 12 + walk, y + 25, 9, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 58 - walk, y + 25, 9, 0, Math.PI*2); ctx.fill();

        // Angry Eyes
        ctx.fillStyle = '#FFF';
        ctx.beginPath(); ctx.arc(x + 22, y, 10, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 48, y, 10, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(x + 22, y, 4, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 48, y, 4, 0, Math.PI*2); ctx.fill();
    }

    function drawFlag(x, y) {
        // Pole
        ctx.fillStyle = '#90A4AE';
        ctx.fillRect(x, y, 8, 220);
        // Ball
        ctx.fillStyle = '#FFD700';
        ctx.beginPath(); ctx.arc(x+4, y, 12, 0, Math.PI*2); ctx.fill();
        
        // Cloth
        ctx.fillStyle = '#FF5722';
        ctx.beginPath();
        ctx.moveTo(x+8, y+15);
        ctx.lineTo(x+80, y+40 + Math.sin(frame*0.1)*5); // Waving
        ctx.lineTo(x+8, y+75);
        ctx.fill();
    }

    function drawCoin(x, y) {
        const wobble = Math.sin(frame * 0.1) * 4;
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.ellipse(x, y, 14, 18, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#F57F17';
        ctx.lineWidth = 3;
        ctx.stroke();
        // Shine
        ctx.fillStyle = '#FFF';
        ctx.beginPath(); ctx.arc(x - 5, y - 5, 4, 0, Math.PI*2); ctx.fill();
    }

    function drawBoltSprite(x, y, scale, bounce) {
        const by = y + bounce;
        ctx.save();
        ctx.translate(x, by);
        ctx.scale(scale, scale);
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath(); ctx.ellipse(0, 40, 15, 5, 0, 0, Math.PI*2); ctx.fill();

        // Body (Lightning Bolt Shape)
        ctx.fillStyle = '#FFD700';
        ctx.strokeStyle = '#F57F17';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(10, -20);
        ctx.lineTo(-10, 10);
        ctx.lineTo(5, 10);
        ctx.lineTo(-10, 40);
        ctx.lineTo(10, 10);
        ctx.lineTo(-5, 10);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Eyes
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI*2); ctx.fill();
        
        ctx.restore();
    }

    // --- SCENE OBJECTS ---
    const clouds = [
        {x: 100, y: 120, s: 1},
        {x: 400, y: 180, s: 0.8},
        {x: 800, y: 90, s: 1.2},
        {x: 1200, y: 140, s: 0.9}
    ];

    // --- MAIN LOOP ---
    function loop() {
        frame++;
        ctx.clearRect(0, 0, width, height);

        const t = THEMES[currentWorld];

        // 1. Background Sky
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, t.skyTop);
        grad.addColorStop(1, t.skyBot);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // Parallax offset
        const px = mouseX * 0.5;

        // 2. Distant Hills (Far Background)
        drawHill(-100 + px * 0.2, height - 120, 350, 'rgba(255,255,255,0.4)');
        drawHill(width * 0.4 + px * 0.3, height - 120, 450, 'rgba(255,255,255,0.5)');
        drawHill(width + 100 + px * 0.2, height - 120, 400, 'rgba(255,255,255,0.4)');

        // 3. Clouds
        clouds.forEach(c => {
            drawCloud(c.x + px * 0.2 + Math.sin(frame*0.01)*20, c.y, c.s, 0.8);
        });

        // 4. Mid-ground Hills (New Depth Layer)
        // These are darker than the sky but lighter than the foreground
        drawHill(-50 + px * 0.6, height - 60, 300, t.hill);
        drawHill(width * 0.6 + px * 0.6, height - 60, 400, t.hillDark);

        // 5. Goal Flag (Far Right)
        drawFlag(width * 0.75 + px * 0.8, height - 380);

        // 6. Platforms & Ground
        const groundY = height - 160;
        
        // Main Ground
        drawGroundPlatform(0, groundY, width, height - groundY);
        
        // Floating Platforms
        const floatY = Math.sin(frame * 0.03) * 10;
        
        // Platform A
        drawGroundPlatform(width * 0.2 + px * 0.4, groundY - 140 + floatY, 220, 45);
        // Coins on A
        drawCoin(width * 0.2 + 70 + px * 0.4, groundY - 190 + floatY);
        drawCoin(width * 0.2 + 120 + px * 0.4, groundY - 190 + floatY);
        drawCoin(width * 0.2 + 170 + px * 0.4, groundY - 190 + floatY);

        // Platform B (High)
        drawGroundPlatform(width * 0.5 + px * 0.6, groundY - 280 - floatY, 280, 45);
        // Blocks on B
        drawBlock(width * 0.5 + 60 + px * 0.6, groundY - 350 - floatY, 60, 'normal');
        drawBlock(width * 0.5 + 130 + px * 0.6, groundY - 350 - floatY, 60, 'gold');
        drawBlock(width * 0.5 + 200 + px * 0.6, groundY - 350 - floatY, 60, 'normal');

        // Platform C (Enemy territory)
        drawGroundPlatform(width * 0.8 + px * 0.4, groundY - 90, 320, 45);
        
        // 7. Enemy
        const enemyX = width * 0.85 + Math.sin(frame * 0.05) * 50 + px * 0.4;
        drawEnemy(enemyX, groundY - 90);

        // 8. HERO (Center)
        // Spring bounce math
        const bounce = Math.abs(Math.sin(frame * 0.1)) * 40; // Fast bounce
        const heroX = width * 0.4 + px * 0.8; // Hero moves slightly with mouse
        const heroY = groundY - 80; // Standing on ground

        drawHero(heroX, heroY, -bounce);

        // 9. BOLT SPRITE (Companion)
        // Floating near the hero
        const boltBounce = Math.sin(frame * 0.15) * 15;
        drawBoltSprite(heroX + 70, heroY - 20, 1, -boltBounce);
        
        // Critique: Distinct foreground layer (Tall grass blades)
        // Draw a few blades of grass in the very front to create depth
        ctx.fillStyle = t.grassDark || t.hillDark; // Use a darker green/earth tone
        const fgOffset = px * 1.5; // Moves faster than background
        const bladeY = height - 20;
        
        // Draw some foreground grass tufts
        for(let i=0; i<width; i+=150) {
            let bx = i + fgOffset;
            // Wrap around logic for seamless scrolling effect
            if (bx > width + 100) bx -= (width + 200);
            if (bx < -100) bx += (width + 200);
            
            ctx.beginPath();
            ctx.moveTo(bx, bladeY);
            ctx.quadraticCurveTo(bx + 10, bladeY - 60, bx + 20, bladeY);
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(bx + 30, bladeY);
            ctx.quadraticCurveTo(bx + 40, bladeY - 80, bx + 50, bladeY);
            ctx.fill();
        }

        requestAnimationFrame(loop);
    }

    // World Selection Logic
    window.selectWorld = function(el, theme) {
        document.querySelectorAll('.world-portal').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
        currentWorld = theme;
    }

    loop();

</script>
</body>
</html>
