<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncy & Bolt - The Great Spring Adventure</title>
    <style>
        /* 
         * DESIGN SYSTEM & RESET 
         * Focus: Joyful, expressive, and clean hierarchy.
         */
        :root {
            --c-sky-top: #29B6F6;
            --c-sky-bot: #E1F5FE;
            --c-primary: #FF6F00; /* Bouncy Orange */
            --c-primary-dark: #E65100;
            --c-accent: #0288D1; /* Bolt Blue */
            --c-gold: #FFD700;
            --c-gold-dark: #FFA000;
            --c-text: #263238;
            --c-white: #FFFFFF;
            --c-dark: #1C1C1C;
            --font-head: 'Arial Black', 'Impact', sans-serif;
            --font-body: 'Verdana', 'Segoe UI', sans-serif;
            --ui-shadow: 0 6px 0 rgba(0,0,0,0.2);
            --ui-shadow-active: 0 0 0 rgba(0,0,0,0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-body);
            background: #000;
            color: var(--c-text);
            user-select: none;
        }

        /* LAYOUT GRID */
        #app {
            display: grid;
            grid-template-rows: 100px 1fr 100px;
            grid-template-columns: 1fr;
            width: 100%;
            height: 100%;
            position: relative;
            /* Sky gradient handled by Canvas for depth, but CSS fallback here */
            background: linear-gradient(180deg, var(--c-sky-top) 0%, var(--c-sky-bot) 100%);
        }

        /* CANVAS LAYER */
        #world-canvas {
            grid-row: 1 / -1;
            grid-column: 1 / -1;
            z-index: 1;
            display: block;
        }

        /* UI OVERLAY LAYER */
        .ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
        }
        .ui-interactive {
            pointer-events: auto;
        }

        /* --- HEADER: TOP LEFT --- */
        header {
            grid-row: 1;
            grid-column: 1;
            padding: 0 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            flex-direction: column;
            transform: skewY(-2deg); /* Dynamic tilt */
        }
        
        h1 {
            font-family: var(--font-head);
            font-size: 3.5rem;
            color: var(--c-white);
            text-transform: uppercase;
            line-height: 0.9;
            text-shadow: 
                4px 4px 0px var(--c-primary), 
                7px 7px 0px rgba(0,0,0,0.15);
            margin-bottom: 5px;
        }
        
        .subtitle {
            font-family: var(--font-head);
            color: var(--c-white);
            font-size: 1.2rem;
            background: var(--c-accent);
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            border: 2px solid var(--c-white);
            letter-spacing: 1px;
        }

        /* --- LEFT: WORLD SELECTOR (Portals) --- */
        .world-selector {
            position: absolute;
            left: 50px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 25px;
            z-index: 20;
        }

        .world-portal {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid var(--c-white);
            background: rgba(0,0,0,0.1);
            backdrop-filter: blur(4px);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .world-portal:hover {
            transform: scale(1.1);
            border-color: var(--c-gold);
        }

        .world-portal.active {
            border: 4px solid var(--c-gold);
            box-shadow: 0 0 0 4px var(--c-white), 0 10px 30px rgba(0,0,0,0.2);
            transform: scale(1.1);
        }

        /* Inner landscape preview in portal */
        .portal-scene {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            opacity: 0.8;
        }
        
        .portal-label {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--c-white);
            padding: 4px 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.9rem;
            white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .world-portal:hover .portal-label,
        .world-portal.active .portal-label {
            opacity: 1;
            bottom: -35px;
        }

        /* --- CENTER: HERO (Canvas) & START BUTTON --- */
        .action-stage {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            pointer-events: none;
        }

        .btn-start {
            margin-bottom: 60px;
            background: var(--c-primary);
            color: var(--c-white);
            font-family: var(--font-head);
            font-size: 2.5rem;
            text-transform: uppercase;
            padding: 15px 80px;
            border: 4px solid var(--c-white);
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 10px 0 var(--c-primary-dark), 0 20px 40px rgba(0,0,0,0.2);
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
            pointer-events: auto;
            animation: pulse-btn 2s infinite;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            background: #FF8F00;
            box-shadow: 0 12px 0 var(--c-primary-dark), 0 25px 50px rgba(0,0,0,0.25);
        }

        .btn-start:active {
            transform: translateY(10px);
            box-shadow: 0 0 0 var(--c-primary-dark), 0 0 0 rgba(0,0,0,0.2);
        }

        /* --- RIGHT: CONTROLS (Integrated) --- */
        .controls-guide {
            position: absolute;
            bottom: 40px;
            right: 50px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,255,255,0.9);
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 2px solid var(--c-white);
        }

        .key {
            width: 40px;
            height: 40px;
            background: var(--c-dark);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-family: var(--font-head);
            font-size: 0.9rem;
            box-shadow: 0 4px 0 #999;
        }
        
        .key.space {
            width: 80px;
            background: var(--c-primary);
            box-shadow: 0 4px 0 var(--c-primary-dark);
        }

        /* --- STATS (Top Right) --- */
        .stats-bar {
            display: flex;
            gap: 15px;
        }

        .stat-pill {
            background: var(--c-white);
            padding: 6px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: var(--c-text);
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            border: 2px solid var(--c-dark);
            transform: skewX(-10deg);
        }
        
        .stat-content { transform: skewX(10deg); display: flex; align-items: center; gap: 5px; }

        /* ANIMATIONS */
        @keyframes pulse-btn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* Responsive */
        @media (max-width: 800px) {
            .world-selector {
                top: auto;
                bottom: 120px;
                left: 50%;
                transform: translateX(-50%);
                flex-direction: row;
                width: 90%;
                justify-content: center;
            }
            .world-portal { width: 80px; height: 80px; }
            .portal-label { bottom: -25px; font-size: 0.7rem; }
            header { padding: 0 20px; }
            h1 { font-size: 2rem; }
            .controls-guide { display: none; } /* Hide controls on mobile for cleaner look */
            .btn-start { font-size: 1.8rem; padding: 12px 50px; margin-bottom: 160px; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- CANVAS: PARALLAX WORLD -->
    <canvas id="world-canvas"></canvas>

    <!-- HEADER -->
    <header class="ui-layer">
        <div class="brand">
            <h1>Bouncy<br>& Bolt</h1>
            <div class="subtitle">The Great Spring Adventure</div>
        </div>
        <div class="stats-bar ui-interactive">
            <div class="stat-pill">
                <div class="stat-content">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#FFD700" stroke="#F57F17" stroke-width="2">
                        <circle cx="12" cy="12" r="9" />
                        <path d="M12 6 L12 18" stroke="none" fill="#FFF" />
                    </svg>
                    <span>1,240</span>
                </div>
            </div>
            <div class="stat-pill">
                <div class="stat-content">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#D32F2F" stroke="#B71C1C" stroke-width="2">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                    </svg>
                    <span>x5</span>
                </div>
            </div>
        </div>
    </header>

    <!-- LEFT: WORLD SELECTOR -->
    <aside class="world-selector ui-layer ui-interactive">
        <!-- Portal 1: Spring Valley -->
        <div class="world-portal active">
            <div class="portal-scene" style="background: linear-gradient(to bottom, #81C784 50%, #4CAF50 100%);"></div>
            <div class="portal-label">Spring Valley</div>
        </div>
        <!-- Portal 2: Sand Springs -->
        <div class="world-portal">
            <div class="portal-scene" style="background: linear-gradient(to bottom, #FFCC80 50%, #FFA726 100%);"></div>
            <div class="portal-label">Sand Springs</div>
        </div>
        <!-- Portal 3: Cloud Peak -->
        <div class="world-portal">
            <div class="portal-scene" style="background: linear-gradient(to bottom, #80DEEA 50%, #26C6DA 100%);"></div>
            <div class="portal-label">Cloud Peak</div>
        </div>
    </aside>

    <!-- CENTER: START BUTTON -->
    <main class="action-stage">
        <button class="btn-start ui-interactive">Start Adventure</button>
    </main>

    <!-- RIGHT: CONTROLS -->
    <aside class="controls-guide ui-layer">
        <div class="key">A</div>
        <div class="key">D</div>
        <div class="key space">SPACE</div>
    </aside>
</div>

<script>
    /**
     * VISUAL ENGINE
     * Renders a parallax world, a "springy" hero, enemies, and particles.
     */
    const canvas = document.getElementById('world-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let frame = 0;
    let mouseX = 0; // For subtle parallax tilt

    // Resize
    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', e => mouseX = (e.clientX / width - 0.5) * 20);
    resize();

    // CONFIG
    const COLORS = {
        sky: '#4FC3F7',
        hill: '#81C784',
        hillDark: '#66BB6A',
        ground: '#5D4037',
        grass: '#7CB342',
        grassLight: '#AED581',
        block: '#8D6E63',
        blockDark: '#4E342E',
        hero: '#FF6F00',
        spring: '#90A4AE',
        enemy: '#E53935'
    };

    // --- DRAWING HELPERS ---

    function drawRoundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    function drawCloud(x, y, scale, opacity) {
        ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
        ctx.beginPath();
        ctx.arc(x, y, 30 * scale, 0, Math.PI * 2);
        ctx.arc(x + 25 * scale, y - 10 * scale, 35 * scale, 0, Math.PI * 2);
        ctx.arc(x + 50 * scale, y, 30 * scale, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawHill(x, y, radius, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, radius, Math.PI, 0);
        ctx.fill();
    }

    function drawGroundPlatform(x, y, w, h) {
        // Earth
        ctx.fillStyle = COLORS.ground;
        drawRoundRect(x, y, w, h, 10);
        ctx.fill();
        
        // Texture (dirt spots)
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        for(let i=0; i<w; i+=40) {
            ctx.beginPath(); ctx.arc(x + i + 10, y + 30, 5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + i + 25, y + 60, 8, 0, Math.PI*2); ctx.fill();
        }

        // Grass Top
        ctx.fillStyle = COLORS.grass;
        drawRoundRect(x, y, w, 25, 10);
        ctx.fill();

        // Grass Highlight
        ctx.fillStyle = COLORS.grassLight;
        ctx.fillRect(x + 10, y + 5, w - 20, 4);
    }

    function drawBlock(x, y, size, type) {
        let color = COLORS.block;
        if(type === 'gold') color = '#FFCA28';

        ctx.fillStyle = color;
        ctx.fillRect(x, y, size, size);
        
        // 3D effect
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(x, y, size, 4);
        ctx.fillRect(x, y, 4, size);
        
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(x, y + size - 4, size, 4);
        ctx.fillRect(x + size - 4, y, 4, size);

        if(type === 'gold') {
            // Question mark
            ctx.fillStyle = '#FFF';
            ctx.font = `bold ${size/1.5}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('?', x + size/2, y + size/2 + 2);
        } else {
            // Bolt pattern
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.beginPath(); ctx.arc(x+size/2, y+size/2, size/3, 0, Math.PI*2); ctx.fill();
        }
    }

    function drawHero(x, y, bounceOffset) {
        const hY = y + bounceOffset;
        
        // Shadow
        const shadowScale = 1 - (Math.abs(bounceOffset) / 100);
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(x, y + 60, 30 * shadowScale, 10 * shadowScale, 0, 0, Math.PI*2);
        ctx.fill();

        // Spring
        ctx.fillStyle = COLORS.spring;
        // Draw spring lines
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#546E7A';
        ctx.beginPath();
        ctx.moveTo(x - 15, hY + 40);
        for(let i=0; i<4; i++) {
            ctx.lineTo(x + (i%2==0 ? 15 : -15), hY + 50 + (i*8));
        }
        ctx.lineTo(x, hY + 80); // Base
        ctx.stroke();
        
        // Spring Base
        ctx.fillStyle = '#455A64';
        ctx.fillRect(x - 15, hY + 75, 30, 10);

        // Body (Mascot)
        ctx.fillStyle = COLORS.hero;
        ctx.beginPath();
        ctx.arc(x, hY, 35, 0, Math.PI*2);
        ctx.fill();
        // Outline
        ctx.lineWidth = 3;
        ctx.strokeStyle = COLORS.dark = '#263238';
        ctx.stroke();

        // Face
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.ellipse(x, hY - 5, 20, 15, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();

        // Eyes
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(x - 7, hY - 5, 3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 7, hY - 5, 3, 0, Math.PI*2); ctx.fill();

        // Smile
        ctx.beginPath();
        ctx.arc(x, hY + 2, 10, 0.2, Math.PI - 0.2);
        ctx.stroke();
    }

    function drawEnemy(x, y) {
        // Goomba-like sprite
        ctx.fillStyle = COLORS.enemy;
        ctx.beginPath();
        ctx.moveTo(x, y + 20);
        ctx.quadraticCurveTo(x, y - 20, x + 30, y - 10); // Head
        ctx.quadraticCurveTo(x + 60, y - 20, x + 60, y + 20);
        ctx.lineTo(x, y + 20);
        ctx.fill();
        
        // Feet
        const walk = Math.sin(frame * 0.2) * 5;
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(x + 10 + walk, y + 20, 8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 50 - walk, y + 20, 8, 0, Math.PI*2); ctx.fill();

        // Angry Eyes
        ctx.fillStyle = '#FFF';
        ctx.beginPath(); ctx.arc(x + 20, y, 8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 40, y, 8, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(x + 20, y, 3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 40, y, 3, 0, Math.PI*2); ctx.fill();
    }

    function drawFlag(x, y) {
        // Pole
        ctx.fillStyle = '#90A4AE';
        ctx.fillRect(x, y, 6, 200);
        // Ball
        ctx.fillStyle = '#FFD700';
        ctx.beginPath(); ctx.arc(x+3, y, 10, 0, Math.PI*2); ctx.fill();
        
        // Cloth
        ctx.fillStyle = '#FF5722';
        ctx.beginPath();
        ctx.moveTo(x+6, y+10);
        ctx.lineTo(x+70, y+30 + Math.sin(frame*0.1)*5); // Waving
        ctx.lineTo(x+6, y+60);
        ctx.fill();
    }

    function drawCoin(x, y) {
        const wobble = Math.sin(frame * 0.1) * 3;
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.ellipse(x, y, 12, 15, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#F57F17';
        ctx.lineWidth = 2;
        ctx.stroke();
        // Shine
        ctx.fillStyle = '#FFF';
        ctx.beginPath(); ctx.arc(x - 4, y - 4, 3, 0, Math.PI*2); ctx.fill();
    }

    // --- SCENE OBJECTS ---
    const clouds = [
        {x: 100, y: 100, s: 1},
        {x: 400, y: 150, s: 0.8},
        {x: 800, y: 80, s: 1.2},
        {x: 1200, y: 120, s: 0.9}
    ];

    // --- MAIN LOOP ---
    function loop() {
        frame++;
        ctx.clearRect(0, 0, width, height);

        // 1. Background Sky
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, '#29B6F6');
        grad.addColorStop(1, '#E1F5FE');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // Parallax offset
        const px = mouseX * 0.5;

        // 2. Distant Hills
        drawHill(-100 + px, height - 100, 300, 'rgba(255,255,255,0.3)');
        drawHill(width * 0.4 + px * 0.5, height - 100, 400, 'rgba(255,255,255,0.4)');
        drawHill(width + 100 + px, height - 100, 350, 'rgba(255,255,255,0.3)');

        // 3. Clouds
        clouds.forEach(c => {
            drawCloud(c.x + px * 0.2 + Math.sin(frame*0.01)*20, c.y, c.s, 0.8);
        });

        // 4. Goal Flag (Far Right)
        drawFlag(width * 0.75 + px * 0.8, height - 350);

        // 5. Platforms & Ground
        const groundY = height - 150;
        
        // Main Ground
        drawGroundPlatform(0, groundY, width, height - groundY);
        
        // Floating Platforms
        const floatY = Math.sin(frame * 0.03) * 10;
        
        // Platform A
        drawGroundPlatform(width * 0.2 + px * 0.4, groundY - 120 + floatY, 200, 40);
        // Coins on A
        drawCoin(width * 0.2 + 60 + px * 0.4, groundY - 160 + floatY);
        drawCoin(width * 0.2 + 100 + px * 0.4, groundY - 160 + floatY);
        drawCoin(width * 0.2 + 140 + px * 0.4, groundY - 160 + floatY);

        // Platform B (High)
        drawGroundPlatform(width * 0.5 + px * 0.6, groundY - 250 - floatY, 250, 40);
        // Blocks on B
        drawBlock(width * 0.5 + 50 + px * 0.6, groundY - 310 - floatY, 50, 'normal');
        drawBlock(width * 0.5 + 100 + px * 0.6, groundY - 310 - floatY, 50, 'gold');
        drawBlock(width * 0.5 + 150 + px * 0.6, groundY - 310 - floatY, 50, 'normal');

        // Platform C (Enemy territory)
        drawGroundPlatform(width * 0.8 + px * 0.4, groundY - 80, 300, 40);
        
        // 6. Enemy
        const enemyX = width * 0.85 + Math.sin(frame * 0.05) * 40 + px * 0.4;
        drawEnemy(enemyX, groundY - 80);

        // 7. HERO (Center)
        // Spring bounce math
        const bounce = Math.abs(Math.sin(frame * 0.1)) * 30; // Fast bounce
        const heroX = width * 0.4 + px * 0.8; // Hero moves slightly with mouse
        const heroY = groundY - 60; // Standing on ground

        drawHero(heroX, heroY, -bounce);

        requestAnimationFrame(loop);
    }

    loop();

</script>
</body>
</html>
