<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Study: The Grip (Revised)</title>
    <style>
        :root {
            --bg-color: #080808;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Advanced Film Grain */
        .grain {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            pointer-events: none;
            z-index: 20;
            opacity: 0.06;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            animation: grainAnim 0.5s steps(1) infinite;
        }

        @keyframes grainAnim {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-5%, -10%); }
            20% { transform: translate(-15%, 5%); }
            30% { transform: translate(7%, -25%); }
            40% { transform: translate(-5%, 25%); }
            50% { transform: translate(-15%, 10%); }
            60% { transform: translate(15%, 0%); }
            70% { transform: translate(0%, 15%); }
            80% { transform: translate(3%, 35%); }
            90% { transform: translate(-10%, 10%); }
        }

        /* Deep Vignette */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 30%, #000000 100%);
            z-index: 15;
            pointer-events: none;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
            /* Slight contrast boost for editorial punch */
            filter: contrast(1.1) saturate(0.85);
        }
    </style>
</head>
<body>

    <div class="grain"></div>
    <div class="vignette"></div>

    <div class="stage">
        <!-- Tighter crop for editorial feel -->
        <svg viewBox="0 0 800 1100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Filters -->
                <filter id="soft-shadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
                    <feOffset dx="2" dy="6" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.6" />
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <filter id="blur-skin" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="2.5" />
                </filter>

                <filter id="strong-blur" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="6" />
                </filter>

                <!-- Skin Gradients: Realistic Volume -->
                <!-- Main Skin Tone: Warm, organic -->
                <linearGradient id="skin-base" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#eecbc0" /> <!-- Highlight -->
                    <stop offset="40%" stop-color="#d69e7a" /> <!-- Midtone -->
                    <stop offset="85%" stop-color="#a86848" /> <!-- Shadow -->
                    <stop offset="100%" stop-color="#6e3b25" /> <!-- Deep Shadow -->
                </linearGradient>

                <!-- Darker Skin for creases and deep folds -->
                <linearGradient id="skin-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#b07050" />
                    <stop offset="100%" stop-color="#4a2515" />
                </linearGradient>

                <!-- Device Materials -->
                <!-- Titanium/Metallic Bezel -->
                <linearGradient id="bezel-metal" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#222" />
                    <stop offset="25%" stop-color="#666" /> <!-- Rim Light -->
                    <stop offset="50%" stop-color="#333" />
                    <stop offset="100%" stop-color="#111" />
                </linearGradient>

                <!-- Screen Base -->
                <linearGradient id="screen-dark" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#0a0a0a" />
                    <stop offset="100%" stop-color="#020202" />
                </linearGradient>

                <!-- Screen Glow (Cyan/Blue from top-left source) -->
                <linearGradient id="glow-blue" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#88ccff" stop-opacity="0.6" />
                    <stop offset="40%" stop-color="#4488ff" stop-opacity="0.1" />
                    <stop offset="100%" stop-color="#000000" stop-opacity="0" />
                </linearGradient>

                <!-- Specular Highlight for nails/phone edge -->
                <linearGradient id="specular-white" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                </linearGradient>
            </defs>

            <!-- 1. Background Hand (Supporting Palm/Wrist) -->
            <!-- This sits behind the phone, providing structural support -->
            <g id="hand-back" filter="url(#soft-shadow)">
                <!-- Wrist -->
                <path d="M 100 1100 L 250 900 L 450 950 L 400 1100 Z" fill="url(#skin-shadow)" />
                
                <!-- Back of Hand (Dorsum) - Darker, out of focus feel -->
                <path d="M 250 900 Q 300 700 450 650 L 450 950 Z" fill="url(#skin-shadow)" opacity="0.8" />
                
                <!-- Fingers wrapping the far side (Left side of phone) -->
                <!-- These are stylized to show the curve over the edge -->
                <g id="back-fingers" fill="url(#skin-shadow)">
                    <!-- Pinky -->
                    <path d="M 380 850 Q 300 850 280 870 Q 280 890 320 900 Z" />
                    <!-- Ring -->
                    <path d="M 390 810 Q 310 800 290 830 Q 290 850 330 860 Z" />
                    <!-- Middle -->
                    <path d="M 400 770 Q 320 750 300 790 Q 300 810 340 830 Z" />
                    <!-- Index -->
                    <path d="M 400 730 Q 330 710 310 750 Q 310 770 350 790 Z" />
                </g>
            </g>

            <!-- 2. The Device -->
            <!-- Positioned centrally, slight rotation -->
            <g id="device" transform="translate(280, 250) rotate(-10)">
                
                <!-- Drop Shadow of Phone -->
                <rect x="0" y="0" width="260" height="560" rx="30" fill="#000" filter="url(#strong-blur)" opacity="0.5" />

                <!-- Phone Bezel (Titanium) -->
                <rect x="0" y="0" width="260" height="560" rx="30" fill="#080808" stroke="url(#bezel-metal)" stroke-width="3" />
                
                <!-- Inner Screen -->
                <rect x="5" y="5" width="250" height="550" rx="25" fill="url(#screen-dark)" />
                
                <!-- Screen Content: Abstract UI/Reflection -->
                <!-- Reflection from top left light source -->
                <path d="M 0 0 L 260 0 L 260 200 L 0 400 Z" fill="url(#glow-blue)" opacity="0.15" style="mix-blend-mode: screen;" />
                
                <!-- Hardware: Camera Module (Top Left Corner - Realistic placement) -->
                <g transform="translate(15, 15)">
                    <!-- Camera Island -->
                    <rect x="0" y="0" width="40" height="40" rx="10" fill="#050505" stroke="#222" stroke-width="1" />
                    <!-- Main Lens -->
                    <circle cx="20" cy="20" r="12" fill="#000" stroke="#111" stroke-width="2" />
                    <!-- Lens Glass -->
                    <circle cx="20" cy="20" r="9" fill="#080810" />
                    <!-- Lens Glare -->
                    <circle cx="18" cy="18" r="3" fill="#fff" opacity="0.4" />
                    <path d="M 15 25 Q 20 28 25 15" stroke="#fff" stroke-width="0.5" opacity="0.3" fill="none" />
                </g>

                <!-- Hardware: Speaker Grille (Top) -->
                <rect x="95" y="12" width="70" height="4" rx="2" fill="#050505" />
                <rect x="100" y="13" width="60" height="2" rx="1" fill="#111" />

                <!-- Hardware: Side Buttons (Volume/Power) -->
                <rect x="-2" y="120" width="4" height="30" rx="1" fill="#222" />
                <rect x="-2" y="160" width="4" height="30" rx="1" fill="#222" />
                <rect x="260" y="140" width="3" height="50" rx="1" fill="#222" />

                <!-- Screen Glare (Top Right Reflection) -->
                <path d="M 260 0 L 260 150 L 0 350 L 0 0 Z" fill="url(#glow-blue)" opacity="0.05" style="mix-blend-mode: overlay;" />
            </g>

            <!-- 3. The Hand (Front Layer: Thumb & Wrapping Fingers) -->
            <g id="hand-front">
                
                <!-- Palm Base (Connecting thumb) -->
                <!-- Using a smoother, organic shape -->
                <path d="M 150 900 Q 250 700 450 650 L 450 800 Q 300 850 200 1000 Z" fill="url(#skin-base)" />

                <!-- Fingers Wrapping Right Edge -->
                <g id="fingers-front">
                    
                    <!-- Index Finger -->
                    <g transform="translate(540, 350) rotate(15)">
                        <!-- Main Phalanx -->
                        <path d="M 0 0 Q 40 10 60 -10 Q 80 -30 40 -40 Z" fill="url(#skin-base)" />
                        <!-- Tip -->
                        <path d="M 60 -10 Q 80 -30 70 -50 Q 50 -50 40 -40 Z" fill="url(#skin-base)" />
                        <!-- Nail (Side view - distinct) -->
                        <ellipse cx="68" cy="-35" rx="4" ry="12" transform="rotate(-20 68 -35)" fill="#f0e0d0" opacity="0.8" />
                        <!-- Joint Crease -->
                        <path d="M 20 0 Q 25 10 20 20" stroke="#8c5e3f" stroke-width="2" fill="none" filter="url(#blur-skin)" opacity="0.5" />
                        <!-- Screen Glow on Finger Underside -->
                        <path d="M 0 0 Q 40 10 60 -10 Q 50 -20 0 10 Z" fill="url(#glow-blue)" opacity="0.5" filter="url(#blur-skin)" />
                    </g>

                    <!-- Middle Finger -->
                    <g transform="translate(550, 420) rotate(10)">
                        <path d="M 0 0 Q 50 10 70 -10 Q 90 -30 50 -40 Z" fill="url(#skin-base)" />
                        <path d="M 70 -10 Q 90 -30 80 -50 Q 60 -50 50 -40 Z" fill="url(#skin-base)" />
                        <ellipse cx="75" cy="-35" rx="4" ry="14" transform="rotate(-15 75 -35)" fill="#f0e0d0" opacity="0.8" />
                        <path d="M 20 0 Q 25 10 20 20" stroke="#8c5e3f" stroke-width="2" fill="none" filter="url(#blur-skin)" opacity="0.5" />
                        <path d="M 0 0 Q 50 10 70 -10 Q 60 -20 0 10 Z" fill="url(#glow-blue)" opacity="0.5" filter="url(#blur-skin)" />
                    </g>

                    <!-- Ring Finger -->
                    <g transform="translate(545, 490) rotate(5)">
                        <path d="M 0 0 Q 50 10 70 -10 Q 90 -30 50 -40 Z" fill="url(#skin-base)" />
                        <path d="M 70 -10 Q 90 -30 80 -50 Q 60 -50 50 -40 Z" fill="url(#skin-base)" />
                        <ellipse cx="75" cy="-35" rx="4" ry="12" transform="rotate(-10 75 -35)" fill="#f0e0d0" opacity="0.8" />
                        <path d="M 20 0 Q 25 10 20 20" stroke="#8c5e3f" stroke-width="2" fill="none" filter="url(#blur-skin)" opacity="0.5" />
                        <path d="M 0 0 Q 50 10 70 -10 Q 60 -20 0 10 Z" fill="url(#glow-blue)" opacity="0.5" filter="url(#blur-skin)" />
                    </g>

                    <!-- Pinky Finger -->
                    <g transform="translate(530, 550) rotate(0)">
                        <path d="M 0 0 Q 40 10 60 -10 Q 80 -30 40 -40 Z" fill="url(#skin-base)" />
                        <path d="M 60 -10 Q 80 -30 70 -50 Q 50 -50 40 -40 Z" fill="url(#skin-base)" />
                        <ellipse cx="65" cy="-35" rx="3" ry="10" transform="rotate(-5 65 -35)" fill="#f0e0d0" opacity="0.8" />
                        <path d="M 0 0 Q 40 10 60 -10 Q 50 -20 0 10 Z" fill="url(#glow-blue)" opacity="0.5" filter="url(#blur-skin)" />
                    </g>
                </g>

                <!-- Thumb (Opposing Grip) -->
                <g id="thumb" filter="url(#soft-shadow)">
                    <!-- Thenar Eminence (Muscle Base) - Detailed -->
                    <path d="M 200 800 Q 300 750 350 850 Q 250 900 200 800 Z" fill="url(#skin-base)" />
                    
                    <!-- Thumb Shaft - Curved naturally -->
                    <path d="M 280 820 Q 350 750 420 650 L 450 680 Q 380 780 320 860 Z" fill="url(#skin-base)" />
                    
                    <!-- Thumb Tip (Resting on screen) -->
                    <path d="M 420 650 Q 480 620 500 660 Q 510 690 450 680 Z" fill="url(#skin-base)" />
                    
                    <!-- Thumb Joint (Knuckle) - Deep Crease -->
                    <path d="M 360 750 Q 380 770 370 800" stroke="#5e301b" stroke-width="3" fill="none" filter="url(#blur-skin)" opacity="0.8" />
                    
                    <!-- Nail - Clear Definition -->
                    <ellipse cx="480" cy="650" rx="6" ry="15" transform="rotate(45 480 650)" fill="#f2e6d9" opacity="0.9" />
                    <!-- Nail Highlight -->
                    <path d="M 475 640 Q 480 650 475 660" stroke="#fff" stroke-width="1.5" opacity="0.7" fill="none" />

                    <!-- Specular Highlight on Thumb Knuckle (Top Light) -->
                    <ellipse cx="380" cy="730" rx="8" ry="20" fill="#fff" opacity="0.25" transform="rotate(60 380 730)" filter="url(#blur-skin)" />

                    <!-- Screen Glow on Thumb (Underside) -->
                    <path d="M 420 650 Q 350 750 280 820 Q 320 800 380 740 Z" fill="url(#glow-blue)" opacity="0.4" filter="url(#blur-skin)" />
                </g>

            </g>

            <!-- 4. Interaction Shadows (Grounding the hand on the phone) -->
            <g id="contact-shadows" style="mix-blend-mode: multiply;">
                <!-- Shadow of Thumb onto Screen -->
                <!-- Matches the shape of the thumb but offset and blurred -->
                <path d="M 420 650 Q 480 620 500 660 Q 510 690 450 680 Q 380 780 320 860 Q 350 750 420 650 Z" fill="#000" opacity="0.4" transform="translate(4, 6)" filter="url(#blur-skin)" />
                
                <!-- Shadow of Fingers onto Phone Edge (Right side) -->
                <path d="M 540 350 L 620 340 L 620 560 L 540 550 Z" fill="#000" opacity="0.5" transform="translate(-2, 2)" filter="url(#blur-skin)" />
            </g>

            <!-- 5. Final Polish: Rim Light / Ambient Occlusion -->
            <!-- A subtle stroke around the phone edge to catch the light -->
            <g transform="translate(280, 250) rotate(-10)">
                <rect x="0" y="0" width="260" height="560" rx="30" fill="none" stroke="url(#glow-blue)" stroke-width="1" opacity="0.3" />
            </g>

        </svg>
    </div>

</body>
</html>
