<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Study: The Grip</title>
    <style>
        :root {
            --bg-color: #050505;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Advanced Film Grain */
        .grain {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            pointer-events: none;
            z-index: 20;
            opacity: 0.08;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            animation: grainAnim 0.5s steps(1) infinite;
        }

        @keyframes grainAnim {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-5%, -10%); }
            20% { transform: translate(-15%, 5%); }
            30% { transform: translate(7%, -25%); }
            40% { transform: translate(-5%, 25%); }
            50% { transform: translate(-15%, 10%); }
            60% { transform: translate(15%, 0%); }
            70% { transform: translate(0%, 15%); }
            80% { transform: translate(3%, 35%); }
            90% { transform: translate(-10%, 10%); }
        }

        /* Deep Vignette */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 40%, #000000 100%);
            z-index: 15;
            pointer-events: none;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
            /* The SVG handles its own lighting, we just add a subtle bloom to the whole composition */
            filter: contrast(1.05) saturate(0.9);
        }
    </style>
</head>
<body>

    <div class="grain"></div>
    <div class="vignette"></div>

    <div class="stage">
        <!-- ViewBox changed to tight crop (1000x1000) -->
        <svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Lighting Filters -->
                <filter id="screen-glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="15" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>

                <filter id="soft-shadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
                    <feOffset dx="4" dy="8" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.5" />
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <filter id="blur-skin" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="2" />
                </filter>

                <!-- Skin Gradients: Cylindrical Volume -->
                <!-- Light source assumed top-left -->
                <linearGradient id="skin-base" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#eacbc0" /> 
                    <stop offset="50%" stop-color="#d49b78" /> 
                    <stop offset="100%" stop-color="#a86848" /> 
                </linearGradient>

                <linearGradient id="skin-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#b07050" />
                    <stop offset="100%" stop-color="#5e301b" />
                </linearGradient>

                <!-- Screen Glow Gradient (Blue/Cyan) -->
                <linearGradient id="glow-blue" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#aaddff" stop-opacity="0.8" />
                    <stop offset="100%" stop-color="#4488ff" stop-opacity="0.0" />
                </linearGradient>

                <!-- Device Materials -->
                <linearGradient id="bezel-metal" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#111" />
                    <stop offset="20%" stop-color="#555" /> <!-- Edge Highlight -->
                    <stop offset="50%" stop-color="#222" />
                    <stop offset="100%" stop-color="#050505" />
                </linearGradient>

                <linearGradient id="screen-dark" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#050505" />
                    <stop offset="100%" stop-color="#000000" />
                </linearGradient>
            </defs>

            <!-- 1. Background Fingers (Left side of phone, supporting from back) -->
            <g id="hand-back" filter="url(#soft-shadow)">
                <!-- Wrist connecting to palm -->
                <path d="M 100 1000 L 250 800 L 450 850 L 500 1000 Z" fill="url(#skin-shadow)" />
                
                <!-- Back of Hand (Dorsum) -->
                <path d="M 250 800 Q 300 600 450 550 L 450 850 Z" fill="url(#skin-base)" opacity="0.9" />

                <!-- Index Finger (Back) -->
                <path d="M 380 600 Q 300 580 280 620 Q 260 660 320 680 Z" fill="url(#skin-shadow)" />
                
                <!-- Middle Finger (Back) -->
                <path d="M 410 580 Q 330 560 310 600 Q 290 640 350 660 Z" fill="url(#skin-shadow)" />
                
                <!-- Ring Finger (Back) -->
                <path d="M 430 600 Q 360 580 340 620 Q 320 660 380 680 Z" fill="url(#skin-shadow)" />

                <!-- Pinky (Back) -->
                <path d="M 440 630 Q 380 610 360 650 Q 340 680 390 700 Z" fill="url(#skin-shadow)" />
            </g>

            <!-- 2. The Device -->
            <g id="device" transform="translate(320, 200) rotate(-8)">
                <!-- Phone Body Shadow -->
                <rect x="-5" y="-5" width="280" height="620" rx="35" fill="#000" filter="url(#soft-shadow)" opacity="0.6" />

                <!-- Phone Bezel -->
                <rect x="0" y="0" width="270" height="610" rx="32" fill="#080808" stroke="url(#bezel-metal)" stroke-width="2" />
                
                <!-- Inner Screen -->
                <rect x="6" y="6" width="258" height="598" rx="26" fill="url(#screen-dark)" />
                
                <!-- Screen Content: Subtle Reflections -->
                <path d="M 0 0 L 270 0 L 270 200 L 0 400 Z" fill="url(#glow-blue)" opacity="0.1" style="mix-blend-mode: screen;" />

                <!-- Hardware: Camera Module (Bottom Left) -->
                <g transform="translate(20, 540)">
                    <circle cx="0" cy="0" r="28" fill="#111" stroke="#333" stroke-width="1" />
                    <circle cx="0" cy="0" r="20" fill="#050505" />
                    <!-- Lens Reflection -->
                    <circle cx="-5" cy="-5" r="8" fill="#223" />
                    <circle cx="-5" cy="-5" r="3" fill="#fff" opacity="0.5" />
                </g>

                <!-- Hardware: Speaker Grille (Top) -->
                <rect x="110" y="15" width="50" height="4" rx="2" fill="#111" />
                <!-- Earpiece Mesh Detail -->
                <line x1="115" y1="17" x2="155" y2="17" stroke="#222" stroke-width="1" />

                <!-- Screen Glare (Top Right) -->
                <path d="M 270 0 L 270 150 L 0 350 L 0 0 Z" fill="url(#glow-blue)" opacity="0.05" style="mix-blend-mode: overlay;" />
            </g>

            <!-- 3. The Hand (Front Layer: Thumb & Wrapping Fingers) -->
            <g id="hand-front">
                
                <!-- Palm Base (Connecting thumb) -->
                <path d="M 150 800 Q 250 600 450 550 L 450 700 Q 300 750 200 900 Z" fill="url(#skin-base)" />

                <!-- Fingers Wrapping Right Edge -->
                <g id="fingers-front">
                    <!-- Index Finger -->
                    <g transform="translate(580, 300) rotate(15)">
                        <!-- Main Phalanx -->
                        <path d="M 0 0 Q 40 10 60 -10 Q 80 -30 40 -40 Z" fill="url(#skin-base)" />
                        <!-- Tip -->
                        <path d="M 60 -10 Q 80 -30 70 -50 Q 50 -50 40 -40 Z" fill="url(#skin-base)" />
                        <!-- Nail (Side view) -->
                        <ellipse cx="65" cy="-35" rx="4" ry="12" transform="rotate(-20 65 -35)" fill="#e6d0c0" opacity="0.8" />
                        <!-- Screen Glow on Finger Underside -->
                        <path d="M 0 0 Q 40 10 60 -10 Q 50 -20 0 10 Z" fill="url(#glow-blue)" opacity="0.6" filter="url(#blur-skin)" />
                    </g>

                    <!-- Middle Finger -->
                    <g transform="translate(590, 360) rotate(10)">
                        <path d="M 0 0 Q 50 10 70 -10 Q 90 -30 50 -40 Z" fill="url(#skin-base)" />
                        <path d="M 70 -10 Q 90 -30 80 -50 Q 60 -50 50 -40 Z" fill="url(#skin-base)" />
                        <ellipse cx="75" cy="-35" rx="4" ry="14" transform="rotate(-15 75 -35)" fill="#e6d0c0" opacity="0.8" />
                        <!-- Screen Glow -->
                        <path d="M 0 0 Q 50 10 70 -10 Q 60 -20 0 10 Z" fill="url(#glow-blue)" opacity="0.6" filter="url(#blur-skin)" />
                    </g>

                    <!-- Ring Finger -->
                    <g transform="translate(585, 420) rotate(5)">
                        <path d="M 0 0 Q 50 10 70 -10 Q 90 -30 50 -40 Z" fill="url(#skin-base)" />
                        <path d="M 70 -10 Q 90 -30 80 -50 Q 60 -50 50 -40 Z" fill="url(#skin-base)" />
                        <ellipse cx="75" cy="-35" rx="4" ry="12" transform="rotate(-10 75 -35)" fill="#e6d0c0" opacity="0.8" />
                        <!-- Screen Glow -->
                        <path d="M 0 0 Q 50 10 70 -10 Q 60 -20 0 10 Z" fill="url(#glow-blue)" opacity="0.6" filter="url(#blur-skin)" />
                    </g>

                    <!-- Pinky Finger -->
                    <g transform="translate(570, 470) rotate(0)">
                        <path d="M 0 0 Q 40 10 60 -10 Q 80 -30 40 -40 Z" fill="url(#skin-base)" />
                        <path d="M 60 -10 Q 80 -30 70 -50 Q 50 -50 40 -40 Z" fill="url(#skin-base)" />
                        <ellipse cx="65" cy="-35" rx="3" ry="10" transform="rotate(-5 65 -35)" fill="#e6d0c0" opacity="0.8" />
                        <!-- Screen Glow -->
                        <path d="M 0 0 Q 40 10 60 -10 Q 50 -20 0 10 Z" fill="url(#glow-blue)" opacity="0.6" filter="url(#blur-skin)" />
                    </g>
                </g>

                <!-- Thumb (Opposing Grip) -->
                <g id="thumb" filter="url(#soft-shadow)">
                    <!-- Thenar Eminence (Muscle Base) -->
                    <path d="M 200 700 Q 300 650 350 750 Q 250 800 200 700 Z" fill="url(#skin-base)" />
                    
                    <!-- Thumb Shaft -->
                    <path d="M 280 720 Q 350 650 420 550 L 450 580 Q 380 680 320 760 Z" fill="url(#skin-base)" />
                    
                    <!-- Thumb Tip (Resting on screen) -->
                    <path d="M 420 550 Q 480 520 500 560 Q 510 590 450 580 Z" fill="url(#skin-base)" />
                    
                    <!-- Thumb Joint (Knuckle) -->
                    <path d="M 360 650 Q 380 670 370 700" stroke="#8c5e3f" stroke-width="3" fill="none" filter="url(#blur-skin)" opacity="0.6" />
                    
                    <!-- Nail -->
                    <ellipse cx="480" cy="550" rx="6" ry="15" transform="rotate(45 480 550)" fill="#f2e6d9" opacity="0.9" />
                    <!-- Nail Highlight -->
                    <path d="M 475 540 Q 480 550 475 560" stroke="#fff" stroke-width="1" opacity="0.5" fill="none" />

                    <!-- Specular Highlight on Thumb Knuckle -->
                    <ellipse cx="380" cy="630" rx="8" ry="20" fill="#fff" opacity="0.2" transform="rotate(60 380 630)" filter="url(#blur-skin)" />

                    <!-- Screen Glow on Thumb (Underside) -->
                    <path d="M 420 550 Q 350 650 280 720 Q 320 700 380 640 Z" fill="url(#glow-blue)" opacity="0.4" filter="url(#blur-skin)" />
                </g>

            </g>

            <!-- 4. Interaction Shadows (Grounding the hand on the phone) -->
            <g id="contact-shadows" style="mix-blend-mode: multiply;">
                <!-- Shadow of Thumb onto Screen -->
                <path d="M 420 550 Q 480 520 500 560 Q 510 590 450 580 Q 380 680 320 760 Q 350 650 420 550 Z" fill="#000" opacity="0.3" transform="translate(2, 4)" filter="url(#blur-skin)" />
                
                <!-- Shadow of Fingers onto Phone Edge -->
                <path d="M 580 300 L 650 290 L 650 480 L 580 470 Z" fill="#000" opacity="0.4" transform="translate(-2, 0)" filter="url(#blur-skin)" />
            </g>

        </svg>
    </div>

</body>
</html>
