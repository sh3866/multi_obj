<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Study: The Grip (Final)</title>
    <style>
        :root {
            --bg-color: #080808;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Subtle Grain for Texture */
        .grain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.06;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* Vignette to focus the eye */
        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 40%, #000000 120%);
            z-index: 5;
            pointer-events: none;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            height: 100vh;
            width: auto;
            max-width: 100vw;
            filter: contrast(1.1) saturate(1.1);
        }
    </style>
</head>
<body>

    <div class="grain"></div>
    <div class="vignette"></div>

    <div class="stage">
        <!-- 
            RECONSTRUCTED ANATOMY & COMPOSITION
            Coordinate Space: 1000x1000 for high precision.
            Focus: The "Power Grip". 
        -->
        <svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- FILTERS -->
                <filter id="blur-skin" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="2.5" />
                </filter>
                <filter id="blur-heavy" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="15" />
                </filter>
                <filter id="drop-shadow" x="-20%" y="-20%" width="150%" height="150%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
                    <feOffset dx="10" dy="20" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.4" />
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <!-- SKIN GRADIENTS: Subsurface Scattering (SSS) Simulation -->
                <!-- Base Warmth -->
                <linearGradient id="skin-light" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f4d0b8" /> <!-- Highlight -->
                    <stop offset="40%" stop-color="#dcb39a" /> <!-- Mid -->
                    <stop offset="100%" stop-color="#b8866c" /> <!-- Shadow -->
                </linearGradient>
                
                <!-- Deep Shadow / Creases -->
                <linearGradient id="skin-dark" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#8c5e44" />
                    <stop offset="100%" stop-color="#4a2c1e" />
                </linearGradient>

                <!-- Radial for Knuckle volume -->
                <radialGradient id="knuckle-glow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#f7e1d3" stop-opacity="0.8" />
                    <stop offset="100%" stop-color="#dcb39a" stop-opacity="0" />
                </radialGradient>

                <!-- DEVICE MATERIALS -->
                <linearGradient id="bezel-metal" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#333" />
                    <stop offset="30%" stop-color="#111" />
                    <stop offset="50%" stop-color="#444" />
                    <stop offset="100%" stop-color="#0a0a0a" />
                </linearGradient>

                <linearGradient id="screen-glass" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#020202" />
                    <stop offset="100%" stop-color="#0a0a0a" />
                </linearGradient>

                <!-- LIGHTING: Cool Screen Glow -->
                <linearGradient id="screen-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#4da6ff" stop-opacity="0.6" />
                    <stop offset="50%" stop-color="#0033cc" stop-opacity="0.1" />
                    <stop offset="100%" stop-color="#000" stop-opacity="0" />
                </linearGradient>

                <!-- Specular Highlight for Wet/Skin texture -->
                <linearGradient id="specular" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#fff" stop-opacity="0.7" />
                    <stop offset="100%" stop-color="#fff" stop-opacity="0" />
                </linearGradient>
            </defs>

            <!-- BACKGROUND: Subtle Gradient -->
            <rect width="100%" height="100%" fill="#080808" />

            <!-- 
                1. DEVICE (The Anchor)
                Rotated slightly to match hand ergonomics.
            -->
            <g id="device" transform="translate(350, 150) rotate(-15)" filter="url(#drop-shadow)">
                <!-- Body -->
                <rect x="0" y="0" width="280" height="600" rx="35" fill="url(#bezel-metal)" />
                <!-- Inner Bezel -->
                <rect x="4" y="4" width="272" height="592" rx="31" fill="#000" />
                <!-- Screen -->
                <rect x="8" y="8" width="264" height="584" rx="27" fill="url(#screen-glass)" />

                <!-- Screen Content: Abstract UI/Reflection -->
                <!-- Top Left Glow -->
                <circle cx="100" cy="150" r="200" fill="url(#screen-glow-grad)" opacity="0.4" style="mix-blend-mode: screen;" />
                
                <!-- Camera Module (Triple Lens) -->
                <g transform="translate(15, 15)">
                    <rect x="0" y="0" width="70" height="70" rx="18" fill="#050505" stroke="#222" stroke-width="1" />
                    <!-- Lenses -->
                    <circle cx="35" cy="20" r="12" fill="#000" stroke="#333" stroke-width="1" />
                    <circle cx="35" cy="20" r="8" fill="#111" /> <!-- Glass -->
                    <circle cx="35" cy="20" r="3" fill="#fff" opacity="0.3" /> <!-- Glare -->

                    <circle cx="35" cy="50" r="12" fill="#000" stroke="#333" stroke-width="1" />
                    <circle cx="35" cy="50" r="8" fill="#111" />
                    
                    <circle cx="10" cy="35" r="8" fill="#000" stroke="#333" stroke-width="1" />
                    <circle cx="10" cy="35" r="5" fill="#111" />
                </g>

                <!-- Top Speaker -->
                <rect x="110" y="12" width="60" height="4" rx="2" fill="#111" />
            </g>

            <!-- 
                2. HAND - BACK LAYER (Fingers wrapping around the right edge)
                These must appear BEHIND the phone bezel but connect to the palm.
            -->
            <g id="hand-back-fingers">
                <!-- Index (Far side) -->
                <path d="M 480 350 C 550 320, 600 380, 580 450 C 560 480, 500 460, 480 450 Z" fill="url(#skin-dark)" />
                <!-- Middle (Far side) -->
                <path d="M 490 420 C 580 400, 620 480, 590 550 C 570 580, 510 540, 490 520 Z" fill="url(#skin-dark)" />
                <!-- Ring (Far side) -->
                <path d="M 495 500 C 580 490, 610 580, 580 650 C 560 680, 500 630, 495 600 Z" fill="url(#skin-dark)" />
                <!-- Pinky (Far side - shortest) -->
                <path d="M 490 580 C 560 580, 580 660, 540 720 C 520 740, 480 700, 480 650 Z" fill="url(#skin-dark)" />
            </g>

            <!-- 
                3. HAND - FRONT LAYER (Palm, Thumb, Fingertips)
                This creates the illusion of holding.
            -->
            <g id="hand-front">
                
                <!-- Wrist & Palm Base -->
                <path d="M 100 1000 L 300 700 C 350 600, 450 550, 550 600 L 650 1000 Z" fill="url(#skin-dark)" />
                <!-- Palm Highlight (Top edge near thumb) -->
                <path d="M 300 700 C 350 600, 450 550, 550 600 C 450 650, 350 750, 300 700 Z" fill="url(#skin-light)" opacity="0.6" filter="url(#blur-skin)"/>

                <!-- FINGERTIPS (Front View) -->
                <!-- We draw these overlapping the phone edge to show grip pressure -->
                <g id="fingertips" filter="url(#drop-shadow)">
                    
                    <!-- Index Tip -->
                    <g transform="translate(560, 380) rotate(-20)">
                        <ellipse cx="0" cy="0" rx="22" ry="28" fill="url(#skin-light)" />
                        <!-- Nail -->
                        <ellipse cx="0" cy="-12" rx="12" ry="16" fill="#f0e0d0" opacity="0.9" />
                        <!-- Glare on skin -->
                        <path d="M -10 -10 Q 0 -20 10 -10" stroke="#fff" stroke-width="1" fill="none" opacity="0.5"/>
                        <!-- Screen Glow Cast -->
                        <ellipse cx="-5" cy="5" rx="10" ry="15" fill="#4da6ff" opacity="0.4" filter="url(#blur-skin)" />
                    </g>

                    <!-- Middle Tip -->
                    <g transform="translate(590, 480) rotate(-10)">
                        <ellipse cx="0" cy="0" rx="24" ry="30" fill="url(#skin-light)" />
                        <ellipse cx="0" cy="-14" rx="14" ry="18" fill="#f0e0d0" opacity="0.9" />
                        <path d="M -10 -10 Q 0 -20 10 -10" stroke="#fff" stroke-width="1" fill="none" opacity="0.5"/>
                        <ellipse cx="-5" cy="5" rx="10" ry="15" fill="#4da6ff" opacity="0.4" filter="url(#blur-skin)" />
                    </g>

                    <!-- Ring Tip -->
                    <g transform="translate(580, 580) rotate(-5)">
                        <ellipse cx="0" cy="0" rx="22" ry="28" fill="url(#skin-light)" />
                        <ellipse cx="0" cy="-12" rx="12" ry="16" fill="#f0e0d0" opacity="0.9" />
                        <ellipse cx="-5" cy="5" rx="10" ry="15" fill="#4da6ff" opacity="0.4" filter="url(#blur-skin)" />
                    </g>
                    
                    <!-- Pinky Tip -->
                    <g transform="translate(540, 680) rotate(5)">
                        <ellipse cx="0" cy="0" rx="18" ry="24" fill="url(#skin-light)" />
                        <ellipse cx="0" cy="-10" rx="10" ry="14" fill="#f0e0d0" opacity="0.9" />
                        <ellipse cx="-5" cy="5" rx="8" ry="12" fill="#4da6ff" opacity="0.4" filter="url(#blur-skin)" />
                    </g>
                </g>

                <!-- THUMB (The Anchor of the Grip) -->
                <g id="thumb">
                    <!-- Thenar Eminence (Thumb muscle base) -->
                    <path d="M 250 750 C 350 700, 450 750, 450 850 C 350 900, 200 850, 250 750 Z" fill="url(#skin-dark)" />
                    
                    <!-- Thumb Shaft -->
                    <path d="M 380 780 C 450 750, 500 650, 520 550 L 560 560 C 530 680, 450 800, 350 820 Z" fill="url(#skin-light)" />
                    
                    <!-- Thumb Tip (Resting on screen) -->
                    <g transform="translate(530, 540) rotate(40)">
                        <ellipse cx="0" cy="0" rx="26" ry="32" fill="url(#skin-light)" />
                        <!-- Knuckle Highlight -->
                        <circle cx="0" cy="-10" r="15" fill="url(#knuckle-glow)" />
                        <!-- Nail -->
                        <ellipse cx="12" cy="10" rx="12" ry="18" fill="#f0e0d0" opacity="0.9" />
                        <!-- Joint Crease -->
                        <path d="M -15 -15 Q 0 0 15 -15" stroke="#8c5e44" stroke-width="2" fill="none" filter="url(#blur-skin)" opacity="0.6"/>
                    </g>
                </g>

                <!-- CONTACT SHADOWS (Grounding the hand) -->
                <!-- Shadow from Thumb onto Screen -->
                <path d="M 530 540 C 500 650, 450 750, 380 780 L 350 820 C 450 800, 530 680, 560 560 Z" 
                      fill="#000" opacity="0.5" transform="translate(5, 10) scale(1.02)" filter="url(#blur-skin)" style="mix-blend-mode: multiply;" />

                <!-- Shadow from Fingertips onto Phone Edge -->
                <path d="M 560 380 L 600 380 L 600 700 L 540 700 Z" fill="#000" opacity="0.6" filter="url(#blur-skin)" style="mix-blend-mode: multiply;" />
            </g>

            <!-- 
                4. FINAL POLISH: Light & Atmosphere
            -->
            <!-- Rim Light on the Phone Edge (Right side) -->
            <path d="M 630 150 L 630 750" stroke="#4da6ff" stroke-width="2" opacity="0.3" filter="url(#blur-skin)" />
            
            <!-- Subtle Reflection on Thumb from Screen -->
            <path d="M 480 600 Q 520 550 550 500" stroke="#4da6ff" stroke-width="4" opacity="0.4" filter="url(#blur-skin)" fill="none" />

        </svg>
    </div>

</body>
</html>
