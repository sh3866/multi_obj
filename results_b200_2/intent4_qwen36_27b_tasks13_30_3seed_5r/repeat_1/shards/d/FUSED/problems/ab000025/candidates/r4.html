<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Study: The Grip (Revised)</title>
    <style>
        :root {
            --bg-color: #050505;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Advanced Film Grain */
        .grain {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            pointer-events: none;
            z-index: 20;
            opacity: 0.08;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            animation: grainAnim 0.4s steps(1) infinite;
        }

        @keyframes grainAnim {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-5%, -10%); }
            20% { transform: translate(-15%, 5%); }
            30% { transform: translate(7%, -25%); }
            40% { transform: translate(-5%, 25%); }
            50% { transform: translate(-15%, 10%); }
            60% { transform: translate(15%, 0%); }
            70% { transform: translate(0%, 15%); }
            80% { transform: translate(3%, 35%); }
            90% { transform: translate(-10%, 10%); }
        }

        /* Deep Vignette */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 15%, #000000 110%);
            z-index: 15;
            pointer-events: none;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
            /* High contrast, slightly desaturated for editorial look */
            filter: contrast(1.05) saturate(0.9);
        }
    </style>
</head>
<body>

    <div class="grain"></div>
    <div class="vignette"></div>

    <div class="stage">
        <!-- 
            TIGHT CROP: viewBox zoomed in significantly to focus on the hand/phone interaction.
            Center of action is approx (350, 500) in the coordinate space.
        -->
        <svg viewBox="100 200 500 600" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Filters -->
                <filter id="soft-shadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
                    <feOffset dx="5" dy="10" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.5" />
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <filter id="blur-skin" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" />
                </filter>

                <filter id="blur-screen" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="8" />
                </filter>

                <!-- SKIN GRADIENTS: Warm, organic, subsurface scattering feel -->
                <linearGradient id="skin-base" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f2d5c5" /> <!-- Highlight -->
                    <stop offset="35%" stop-color="#dbb096" /> <!-- Midtone -->
                    <stop offset="75%" stop-color="#a66b4d" /> <!-- Shadow -->
                    <stop offset="100%" stop-color="#5e3520" /> <!-- Deep Shadow -->
                </linearGradient>

                <linearGradient id="skin-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#8a5538" />
                    <stop offset="100%" stop-color="#3b1e10" />
                </linearGradient>
                
                <!-- Device Materials -->
                <linearGradient id="bezel-metal" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#1a1a1a" />
                    <stop offset="20%" stop-color="#555" /> 
                    <stop offset="45%" stop-color="#2a2a2a" />
                    <stop offset="100%" stop-color="#0a0a0a" />
                </linearGradient>

                <linearGradient id="screen-dark" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#050505" />
                    <stop offset="100%" stop-color="#000000" />
                </linearGradient>

                <!-- Screen Glow: Cool Cyan/Blue source from top left -->
                <linearGradient id="glow-blue" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#66ccff" stop-opacity="0.7" />
                    <stop offset="40%" stop-color="#2266ff" stop-opacity="0.2" />
                    <stop offset="100%" stop-color="#000000" stop-opacity="0" />
                </linearGradient>
                
                <!-- Specular Highlight -->
                <linearGradient id="specular-white" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                </linearGradient>
            </defs>

            <!-- 
                1. BACKGROUND HAND (Supporting Palm/Wrist) 
                Darker, out of focus, structural support.
            -->
            <g id="hand-back" filter="url(#soft-shadow)">
                <!-- Wrist Base -->
                <path d="M 50 750 L 200 500 L 400 550 L 350 750 Z" fill="url(#skin-shadow)" />
                
                <!-- Back of Hand (Dorsum) - Darker, out of focus feel -->
                <path d="M 200 500 Q 250 350 400 300 L 400 550 Z" fill="url(#skin-shadow)" opacity="0.9" />
                
                <!-- Fingers wrapping the far side (Left side of phone) -->
                <!-- Stylized to show the curve over the edge -->
                <g id="back-fingers" fill="url(#skin-shadow)">
                    <!-- Pinky -->
                    <path d="M 320 600 Q 240 600 220 620 Q 220 640 260 650 Z" />
                    <!-- Ring -->
                    <path d="M 330 560 Q 250 550 230 580 Q 230 600 270 630 Z" />
                    <!-- Middle -->
                    <path d="M 340 520 Q 260 500 240 540 Q 240 560 280 580 Z" />
                    <!-- Index -->
                    <path d="M 340 480 Q 270 460 250 500 Q 250 520 290 540 Z" />
                </g>
            </g>

            <!-- 
                2. THE DEVICE 
                Positioned centrally, slight rotation.
            -->
            <g id="device" transform="translate(260, 200) rotate(-12)">
                
                <!-- Drop Shadow of Phone -->
                <rect x="0" y="0" width="240" height="500" rx="28" fill="#000" filter="url(#blur-screen)" opacity="0.6" />

                <!-- Phone Bezel (Titanium) -->
                <rect x="0" y="0" width="240" height="500" rx="28" fill="#080808" stroke="url(#bezel-metal)" stroke-width="4" />
                
                <!-- Inner Screen -->
                <rect x="4" y="4" width="232" height="492" rx="24" fill="url(#screen-dark)" />
                
                <!-- Screen Content: Abstract UI/Reflection -->
                <!-- Reflection from top left light source -->
                <path d="M 0 0 L 240 0 L 240 180 L 0 350 Z" fill="url(#glow-blue)" opacity="0.2" style="mix-blend-mode: screen;" />
                
                <!-- Hardware: Camera Module (Top Left Corner) -->
                <g transform="translate(12, 12)">
                    <!-- Camera Island -->
                    <rect x="0" y="0" width="45" height="45" rx="12" fill="#050505" stroke="#222" stroke-width="1" />
                    <!-- Main Lens -->
                    <circle cx="22" cy="22" r="14" fill="#000" stroke="#111" stroke-width="2" />
                    <!-- Lens Glass -->
                    <circle cx="22" cy="22" r="10" fill="#080810" />
                    <!-- Lens Glare -->
                    <circle cx="19" cy="19" r="4" fill="#fff" opacity="0.5" />
                    <path d="M 16 26 Q 22 29 27 16" stroke="#fff" stroke-width="0.5" opacity="0.3" fill="none" />
                </g>

                <!-- Hardware: Speaker Grille (Top) -->
                <rect x="90" y="10" width="60" height="4" rx="2" fill="#050505" />
                <rect x="95" y="11" width="50" height="2" rx="1" fill="#111" />

                <!-- Hardware: Side Buttons (Volume/Power) -->
                <rect x="-2" y="110" width="4" height="30" rx="1" fill="#222" />
                <rect x="-2" y="150" width="4" height="30" rx="1" fill="#222" />
                <rect x="240" y="130" width="3" height="50" rx="1" fill="#222" />

                <!-- Screen Glare (Top Right Reflection) -->
                <path d="M 240 0 L 240 150 L 0 350 L 0 0 Z" fill="url(#glow-blue)" opacity="0.05" style="mix-blend-mode: overlay;" />
            </g>

            <!-- 
                3. THE HAND (Front Layer: Thumb & Wrapping Fingers) 
                Reconstructed for organic curves and believable anatomy.
            -->
            <g id="hand-front">
                
                <!-- Palm Base (Connecting thumb) -->
                <path d="M 150 700 Q 250 500 450 450 L 450 600 Q 300 650 200 800 Z" fill="url(#skin-base)" />

                <!-- Fingers Wrapping Right Edge -->
                <g id="fingers-front">
                    
                    <!-- Index Finger -->
                    <g transform="translate(520, 300) rotate(18)">
                        <!-- Main Phalanx -->
                        <path d="M 0 0 Q 45 15 65 -15 Q 85 -35 45 -45 Z" fill="url(#skin-base)" />
                        <!-- Tip -->
                        <path d="M 65 -15 Q 85 -35 75 -55 Q 55 -55 45 -45 Z" fill="url(#skin-base)" />
                        <!-- Nail (Side view) -->
                        <ellipse cx="70" cy="-35" rx="4" ry="14" transform="rotate(-20 70 -35)" fill="#f0e0d0" opacity="0.8" />
                        <!-- Joint Crease -->
                        <path d="M 20 0 Q 25 10 20 20" stroke="#8c5e3f" stroke-width="2" fill="none" filter="url(#blur-skin)" opacity="0.6" />
                        <!-- Screen Glow on Finger Underside -->
                        <path d="M 0 0 Q 45 15 65 -15 Q 55 -25 0 10 Z" fill="url(#glow-blue)" opacity="0.5" filter="url(#blur-skin)" />
                    </g>

                    <!-- Middle Finger -->
                    <g transform="translate(530, 370) rotate(12)">
                        <path d="M 0 0 Q 55 15 75 -15 Q 95 -35 55 -45 Z" fill="url(#skin-base)" />
                        <path d="M 75 -15 Q 95 -35 85 -55 Q 65 -55 55 -45 Z" fill="url(#skin-base)" />
                        <ellipse cx="80" cy="-35" rx="4" ry="16" transform="rotate(-15 80 -35)" fill="#f0e0d0" opacity="0.8" />
                        <path d="M 20 0 Q 25 10 20 20" stroke="#8c5e3f" stroke-width="2" fill="none" filter="url(#blur-skin)" opacity="0.6" />
                        <path d="M 0 0 Q 55 15 75 -15 Q 65 -25 0 10 Z" fill="url(#glow-blue)" opacity="0.5" filter="url(#blur-skin)" />
                    </g>

                    <!-- Ring Finger -->
                    <g transform="translate(525, 440) rotate(7)">
                        <path d="M 0 0 Q 55 15 75 -15 Q 95 -35 55 -45 Z" fill="url(#skin-base)" />
                        <path d="M 75 -15 Q 95 -35 85 -55 Q 65 -55 55 -45 Z" fill="url(#skin-base)" />
                        <ellipse cx="80" cy="-35" rx="4" ry="14" transform="rotate(-10 80 -35)" fill="#f0e0d0" opacity="0.8" />
                        <path d="M 20 0 Q 25 10 20 20" stroke="#8c5e3f" stroke-width="2" fill="none" filter="url(#blur-skin)" opacity="0.6" />
                        <path d="M 0 0 Q 55 15 75 -15 Q 65 -25 0 10 Z" fill="url(#glow-blue)" opacity="0.5" filter="url(#blur-skin)" />
                    </g>

                    <!-- Pinky Finger -->
                    <g transform="translate(510, 500) rotate(2)">
                        <path d="M 0 0 Q 45 15 65 -15 Q 85 -35 45 -45 Z" fill="url(#skin-base)" />
                        <path d="M 65 -15 Q 85 -35 75 -55 Q 55 -55 45 -45 Z" fill="url(#skin-base)" />
                        <ellipse cx="70" cy="-35" rx="3" ry="12" transform="rotate(-5 70 -35)" fill="#f0e0d0" opacity="0.8" />
                        <path d="M 0 0 Q 45 15 65 -15 Q 55 -25 0 10 Z" fill="url(#glow-blue)" opacity="0.5" filter="url(#blur-skin)" />
                    </g>
                </g>

                <!-- Thumb (Opposing Grip) -->
                <g id="thumb" filter="url(#soft-shadow)">
                    <!-- Thenar Eminence (Muscle Base) -->
                    <path d="M 200 600 Q 300 550 350 650 Q 250 700 200 600 Z" fill="url(#skin-base)" />
                    
                    <!-- Thumb Shaft - Curved naturally -->
                    <path d="M 280 620 Q 350 550 420 450 L 450 480 Q 380 580 320 660 Z" fill="url(#skin-base)" />
                    
                    <!-- Thumb Tip (Resting on screen) -->
                    <path d="M 420 450 Q 480 420 500 460 Q 510 490 450 480 Z" fill="url(#skin-base)" />
                    
                    <!-- Thumb Joint (Knuckle) - Deep Crease -->
                    <path d="M 360 550 Q 380 570 370 600" stroke="#5e301b" stroke-width="3" fill="none" filter="url(#blur-skin)" opacity="0.8" />
                    
                    <!-- Nail - Clear Definition -->
                    <ellipse cx="480" cy="450" rx="6" ry="15" transform="rotate(45 480 450)" fill="#f2e6d9" opacity="0.9" />
                    <!-- Nail Highlight -->
                    <path d="M 475 440 Q 480 450 475 460" stroke="#fff" stroke-width="1.5" opacity="0.7" fill="none" />

                    <!-- Specular Highlight on Thumb Knuckle (Top Light) -->
                    <ellipse cx="380" cy="530" rx="8" ry="20" fill="#fff" opacity="0.25" transform="rotate(60 380 530)" filter="url(#blur-skin)" />

                    <!-- Screen Glow on Thumb (Underside) -->
                    <path d="M 420 450 Q 350 550 280 620 Q 320 600 380 540 Z" fill="url(#glow-blue)" opacity="0.4" filter="url(#blur-skin)" />
                </g>

            </g>

            <!-- 
                4. INTERACTION SHADOWS 
                Grounding the hand on the phone.
            -->
            <g id="contact-shadows" style="mix-blend-mode: multiply;">
                <!-- Shadow of Thumb onto Screen -->
                <path d="M 420 450 Q 480 420 500 460 Q 510 490 450 480 Q 380 580 320 660 Q 350 550 420 450 Z" fill="#000" opacity="0.4" transform="translate(4, 6)" filter="url(#blur-skin)" />
                
                <!-- Shadow of Fingers onto Phone Edge (Right side) -->
                <path d="M 520 300 L 600 290 L 600 510 L 520 500 Z" fill="#000" opacity="0.5" transform="translate(-2, 2)" filter="url(#blur-skin)" />
            </g>

            <!-- 
                5. FINAL POLISH: Rim Light / Ambient Occlusion 
            -->
            <g transform="translate(260, 200) rotate(-12)">
                <!-- Subtle stroke around the phone edge to catch the light -->
                <rect x="0" y="0" width="240" height="500" rx="28" fill="none" stroke="url(#glow-blue)" stroke-width="1" opacity="0.3" />
            </g>

        </svg>
    </div>

</body>
</html>
