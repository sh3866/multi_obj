<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Study: The Grip</title>
    <style>
        :root {
            --bg-dark: #080808;
            --bg-highlight: #1a1a1a;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Film Grain Texture */
        .grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Vignette for Editorial Focus */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 30%, #000000 120%);
            z-index: 5;
            pointer-events: none;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 800px;
            max-height: 900px;
        }

        svg {
            width: 100%;
            height: 100%;
            /* Soft ambient glow behind the phone */
            filter: drop-shadow(0 0 60px rgba(255, 255, 255, 0.03));
        }

    </style>
</head>
<body>

    <div class="grain"></div>
    <div class="vignette"></div>

    <div class="stage">
        <svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Skin Gradients: Warm/Cool mix for volume -->
                <linearGradient id="skin-light" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f3d0b3" /> <!-- Highlight -->
                    <stop offset="40%" stop-color="#d4a373" /> <!-- Midtone -->
                    <stop offset="100%" stop-color="#9e6b45" /> <!-- Shadow -->
                </linearGradient>

                <linearGradient id="skin-dark" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#8c5e3f" />
                    <stop offset="100%" stop-color="#5a3a25" />
                </linearGradient>

                <linearGradient id="skin-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#4a2e1b" />
                    <stop offset="100%" stop-color="#2a180d" />
                </linearGradient>

                <!-- Device Gradients: Metallic Bezel -->
                <linearGradient id="bezel-metal" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#111" />
                    <stop offset="15%" stop-color="#444" /> <!-- Edge Highlight -->
                    <stop offset="50%" stop-color="#222" />
                    <stop offset="85%" stop-color="#111" />
                    <stop offset="100%" stop-color="#050505" />
                </linearGradient>

                <!-- Screen Reflection -->
                <linearGradient id="screen-glare" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
                    <stop offset="25%" stop-color="rgba(255,255,255,0)" />
                    <stop offset="50%" stop-color="rgba(255,255,255,0.02)" />
                    <stop offset="100%" stop-color="rgba(255,255,255,0.08)" />
                </linearGradient>

                <!-- Filters -->
                <filter id="soft-shadow">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
                    <feOffset dx="2" dy="4" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.4" />
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <filter id="blur-skin">
                    <feGaussianBlur stdDeviation="1.5" />
                </filter>
            </defs>

            <!-- 1. Background Layer: Fingers behind phone -->
            <g id="hand-back-layer">
                <!-- Wrist/Palm Base connecting to back -->
                <path d="M 150 750 Q 160 550 180 450 L 320 450 Q 340 550 350 750 Z" fill="url(#skin-shadow)" />
            </g>

            <!-- 2. The Device -->
            <g id="device" transform="translate(160, 120) rotate(-4)">
                <!-- Phone Body -->
                <rect x="0" y="0" width="160" height="440" rx="24" fill="#000" stroke="url(#bezel-metal)" stroke-width="2" />
                
                <!-- Inner Screen -->
                <rect x="4" y="4" width="152" height="432" rx="20" fill="#030303" />
                
                <!-- Subtle Screen Content (Abstract Depth) -->
                <circle cx="80" cy="220" r="60" fill="#0a0a0a" />
                <rect x="20" y="300" width="120" height="6" rx="3" fill="#111" />
                <rect x="20" y="315" width="80" height="6" rx="3" fill="#111" />

                <!-- Camera Hole & Speaker -->
                <circle cx="80" cy="25" r="6" fill="#000" stroke="#111" stroke-width="1" /> <!-- Hole Punch -->
                <rect x="60" y="15" width="40" height="3" rx="1.5" fill="#111" /> <!-- Speaker -->

                <!-- Screen Glare (Reflection) -->
                <path d="M 0 0 L 160 0 L 160 150 L 0 300 Z" fill="url(#screen-glare)" style="mix-blend-mode: overlay;" />
                
                <!-- Bezel Edge Highlight -->
                <path d="M 2 24 Q 2 2 24 2 L 136 2 Q 158 2 158 24 L 158 416 Q 158 438 136 438 L 24 438 Q 2 438 2 416 Z" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
            </g>

            <!-- 3. The Hand (Front Layer: Anatomy & Grip) -->
            <g id="hand-front-layer" filter="url(#soft-shadow)">
                
                <!-- Palm (Connecting thumb to wrist) -->
                <path d="M 150 750 L 180 450 L 320 450 L 350 750 Z" fill="url(#skin-shadow)" />

                <!-- Fingers Wrapping Around Right Edge -->
                <g id="fingers">
                    <!-- Index Finger -->
                    <g>
                        <!-- Main Knuckle/Shaft -->
                        <path d="M 310 220 Q 360 210 370 235 Q 375 255 325 260 Z" fill="url(#skin-light)" />
                        <!-- Side of Finger (wrapping to back) -->
                        <path d="M 325 260 Q 360 250 370 235 Q 375 255 325 260 Z" fill="url(#skin-dark)" opacity="0.8" />
                        <!-- Knuckle Crease -->
                        <path d="M 335 235 Q 345 245 335 255" stroke="#7a4f2d" stroke-width="1.5" fill="none" filter="url(#blur-skin)" />
                        <!-- Nail -->
                        <ellipse cx="365" cy="235" rx="3" ry="7" transform="rotate(-15 365 235)" fill="#e6d0c0" opacity="0.7" />
                    </g>

                    <!-- Middle Finger -->
                    <g>
                        <path d="M 315 270 Q 370 260 380 285 Q 385 305 330 310 Z" fill="url(#skin-light)" />
                        <path d="M 330 310 Q 365 300 380 285 Q 385 305 330 310 Z" fill="url(#skin-dark)" opacity="0.8" />
                        <path d="M 345 280 Q 355 290 345 300" stroke="#7a4f2d" stroke-width="1.5" fill="none" filter="url(#blur-skin)" />
                        <ellipse cx="375" cy="285" rx="3" ry="7" transform="rotate(-10 375 285)" fill="#e6d0c0" opacity="0.7" />
                    </g>

                    <!-- Ring Finger -->
                    <g>
                        <path d="M 310 320 Q 365 310 375 335 Q 380 355 325 360 Z" fill="url(#skin-light)" />
                        <path d="M 325 360 Q 360 350 375 335 Q 380 355 325 360 Z" fill="url(#skin-dark)" opacity="0.8" />
                        <path d="M 340 330 Q 350 340 340 350" stroke="#7a4f2d" stroke-width="1.5" fill="none" filter="url(#blur-skin)" />
                        <ellipse cx="370" cy="335" rx="3" ry="7" transform="rotate(-5 370 335)" fill="#e6d0c0" opacity="0.7" />
                    </g>

                    <!-- Pinky Finger -->
                    <g>
                        <path d="M 300 370 Q 350 360 360 385 Q 365 405 315 410 Z" fill="url(#skin-light)" />
                        <path d="M 315 410 Q 350 400 360 385 Q 365 405 315 410 Z" fill="url(#skin-dark)" opacity="0.8" />
                        <path d="M 330 380 Q 340 390 330 400" stroke="#7a4f2d" stroke-width="1.5" fill="none" filter="url(#blur-skin)" />
                        <ellipse cx="355" cy="385" rx="3" ry="6" transform="rotate(0 355 385)" fill="#e6d0c0" opacity="0.7" />
                    </g>
                </g>

                <!-- Thumb (Crossing Front) -->
                <g id="thumb">
                    <!-- Thumb Base/Thenar Eminence (Palm muscle) -->
                    <path d="M 150 450 Q 100 480 120 550 L 180 550 Q 170 480 180 450 Z" fill="url(#skin-shadow)" />
                    
                    <!-- Thumb Shaft -->
                    <path d="M 140 460 Q 160 380 190 320 L 220 330 Q 190 400 170 470 Z" fill="url(#skin-light)" />
                    
                    <!-- Thumb Tip (Resting on screen) -->
                    <path d="M 190 320 Q 220 310 230 330 Q 235 350 220 330 Z" fill="url(#skin-light)" />
                    
                    <!-- Thumb Nail -->
                    <ellipse cx="225" cy="325" rx="4" ry="8" transform="rotate(60 225 325)" fill="#f2e6d9" opacity="0.9" />
                    
                    <!-- Thumb Joint Crease -->
                    <path d="M 195 350 Q 210 360 205 375" stroke="#8c5e3f" stroke-width="2" fill="none" filter="url(#blur-skin)" opacity="0.8" />
                    
                    <!-- Specular Highlight on Thumb Knuckle -->
                    <ellipse cx="200" cy="340" rx="4" ry="10" fill="#fff" opacity="0.3" transform="rotate(45 200 340)" filter="url(#blur-skin)" />
                </g>

            </g>

            <!-- 4. Interaction Shadows (Contact Points) -->
            <g id="contact-shadows" fill="#000" style="mix-blend-mode: multiply;">
                <!-- Shadow of thumb onto phone screen -->
                <path d="M 190 320 Q 220 310 230 330 Q 235 350 220 330 Q 190 400 170 470 Q 160 380 140 460 Z" opacity="0.4" transform="translate(2, 2)" filter="url(#blur-skin)" />
                
                <!-- Shadow of fingers onto phone edge -->
                <path d="M 310 220 L 325 260 L 315 270 L 330 310 L 310 320 L 325 360 L 300 370 L 315 410 L 300 420 L 310 220 Z" opacity="0.5" transform="translate(-2, 0)" filter="url(#blur-skin)" />
            </g>

        </svg>
    </div>

</body>
</html>
