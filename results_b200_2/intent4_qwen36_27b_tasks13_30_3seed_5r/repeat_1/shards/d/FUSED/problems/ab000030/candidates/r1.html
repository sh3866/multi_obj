<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Hub // Nexus</title>
    <style>
        :root {
            /* Palette: Deep Space & Neon Amber */
            --bg-deep: #0b0c10;
            --bg-panel: #151823;
            --bg-card: #1e2230;
            --bg-card-hover: #262b3d;
            
            --primary: #ffc857; /* Amber Gold */
            --primary-dim: #ffc85730;
            --secondary: #45a29e; /* Teal/Cyan */
            --secondary-dim: #45a29e30;
            
            --status-online: #2ecc71;
            --status-party: #f1c40f;
            --status-offline: #57606f;
            --status-ingame: #3498db;
            
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            
            --danger: #e74c3c;
            
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            
            --shadow-card: 0 8px 32px rgba(0,0,0,0.3);
            --shadow-glow: 0 0 20px rgba(69, 162, 158, 0.15);
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Background Texture & Atmosphere */
        .bg-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--bg-panel) 1px, transparent 1px),
                linear-gradient(90deg, var(--bg-panel) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.15;
            z-index: -2;
            mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
        }
        .bg-ambient {
            position: absolute;
            top: -20%; left: -10%; width: 120%; height: 120%;
            background: radial-gradient(circle at 70% 30%, rgba(69, 162, 158, 0.15), transparent 50%),
                        radial-gradient(circle at 30% 70%, rgba(255, 200, 87, 0.08), transparent 50%);
            z-index: -1;
        }

        /* Main Layout */
        .app-container {
            width: 96vw;
            height: 92vh;
            max-width: 1500px;
            display: grid;
            grid-template-columns: 320px 1fr 380px;
            gap: 24px;
            position: relative;
        }

        /* Common Components */
        .panel {
            background: var(--bg-panel);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-card);
            position: relative;
        }

        /* Top accent line for panels */
        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, var(--secondary), transparent);
            opacity: 0.5;
        }

        .panel-header {
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .panel-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .panel-title::before {
            content: '';
            display: block;
            width: 3px;
            height: 14px;
            background: var(--secondary);
            border-radius: 2px;
        }

        .btn {
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--primary);
            color: #000;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(255, 200, 87, 0.2);
        }
        .btn-primary:hover {
            background: #ffdb85;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(255, 200, 87, 0.3);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.15);
        }

        .btn-icon {
            background: transparent;
            color: var(--text-muted);
            padding: 8px;
            border-radius: 50%;
        }
        .btn-icon:hover {
            background: rgba(255,255,255,0.1);
            color: var(--primary);
        }

        /* Left Column: Profile & Party */
        .profile-section {
            padding: 30px 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(69, 162, 158, 0.05) 0%, transparent 100%);
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
            filter: drop-shadow(0 0 10px rgba(69, 162, 158, 0.3));
        }

        .avatar-ring {
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border-radius: 50%;
            border: 2px dashed var(--secondary);
            animation: spin 20s linear infinite;
            opacity: 0.6;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #2a2e3d;
            overflow: hidden;
            position: relative;
            border: 2px solid var(--bg-panel);
        }
        
        .avatar-img svg {
            width: 100%;
            height: 100%;
        }

        .level-badge {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 1px solid var(--secondary);
            color: var(--secondary);
            font-size: 10px;
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .player-name {
            font-size: 20px;
            font-weight: 700;
            margin: 0;
            color: #fff;
        }
        
        .player-title {
            color: var(--secondary);
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: block;
            opacity: 0.9;
        }

        .party-tracker {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .party-member {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            border-left: 3px solid var(--status-party);
            transition: transform 0.2s, background 0.2s;
        }
        .party-member:hover {
            transform: translateX(4px);
            background: var(--bg-card-hover);
        }

        .mini-avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: #444;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        
        .status-dot {
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--bg-card);
            z-index: 2;
        }

        .member-info {
            flex: 1;
            overflow: hidden;
        }
        .member-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }
        .member-role {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Empty Slot Styling */
        .empty-slot {
            border: 1px dashed rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.1);
            border-left: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .empty-slot:hover {
            background: rgba(255,255,255,0.03);
            border-color: var(--primary);
        }
        .empty-slot .mini-avatar {
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }
        .empty-slot .member-name {
            color: var(--primary);
            font-weight: 700;
        }
        .empty-slot .member-role {
            color: var(--text-muted);
            font-size: 10px;
        }

        /* Center Column: Friends List */
        .search-bar {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .search-input-wrapper {
            position: relative;
            flex: 1;
        }
        .search-input {
            width: 100%;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 10px 15px 10px 38px;
            border-radius: var(--radius-sm);
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
        }
        .search-input:focus {
            border-color: var(--primary);
            background: rgba(0,0,0,0.3);
        }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 14px;
            height: 14px;
        }

        .add-friend-btn {
            background: var(--secondary);
            color: #fff;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .add-friend-btn:hover {
            background: #5cc2be;
            box-shadow: 0 0 10px var(--secondary-dim);
        }

        .tabs {
            display: flex;
            padding: 0 20px;
            background: rgba(0,0,0,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .tab {
            padding: 14px 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tab:hover {
            color: var(--text-main);
        }
        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: linear-gradient(0deg, rgba(255, 200, 87, 0.05), transparent);
        }
        .badge {
            background: var(--danger);
            color: white;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 700;
            box-shadow: 0 0 8px rgba(231, 76, 60, 0.4);
        }

        .friends-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        /* Custom Scrollbar */
        .friends-list::-webkit-scrollbar {
            width: 4px;
        }
        .friends-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .friends-list::-webkit-scrollbar-thumb {
            background: #2a2e3d;
            border-radius: 4px;
        }
        .friends-list::-webkit-scrollbar-thumb:hover {
            background: #3a4055;
        }

        .friend-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 6px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            position: relative;
        }
        .friend-item:hover {
            background: var(--bg-card);
            border-color: rgba(255,255,255,0.03);
        }
        
        /* Selected State (Critique 3) */
        .friend-item.selected {
            background: linear-gradient(90deg, rgba(255, 200, 87, 0.08), rgba(255, 200, 87, 0.02));
            border-color: var(--primary-dim);
            box-shadow: inset 3px 0 0 var(--primary);
        }

        .friend-avatar {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: #333;
            margin-right: 15px;
            position: relative;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .friend-details {
            flex: 1;
        }
        .friend-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 3px;
            color: var(--text-main);
        }
        .friend-status {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            box-shadow: 0 0 5px currentColor;
        }
        
        /* Right Column: Detail Panel */
        .detail-panel {
            position: relative;
            background: var(--bg-panel);
        }
        
        .detail-header {
            height: 160px;
            background: linear-gradient(135deg, #2b3045, #1b1e2b);
            position: relative;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
        }
        
        /* Decorative background elements in header */
        .detail-header::after {
            content: '';
            position: absolute;
            bottom: -50px; right: -20px;
            width: 200px; height: 200px;
            background: radial-gradient(circle, var(--primary-dim) 0%, transparent 70%);
            opacity: 0.3;
            filter: blur(20px);
        }

        .detail-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(0deg, var(--bg-panel) 10%, transparent 100%);
            z-index: 2;
        }

        .detail-avatar-large {
            width: 90px;
            height: 90px;
            border-radius: 16px;
            background: #333;
            border: 3px solid var(--bg-panel);
            position: absolute;
            bottom: -45px;
            left: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            z-index: 3;
            overflow: hidden;
        }

        .detail-content {
            padding: 60px 24px 24px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 24px;
            gap: 10px;
        }
        .stat-box {
            text-align: center;
            background: rgba(0,0,0,0.2);
            padding: 12px 5px;
            border-radius: var(--radius-sm);
            flex: 1;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .stat-val {
            display: block;
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            text-shadow: 0 0 10px rgba(255, 200, 87, 0.2);
        }
        .stat-label {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
            display: block;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }
        .action-btn {
            padding: 14px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255,255,255,0.05);
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .action-btn:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }
        .action-btn.danger {
            color: var(--danger);
            border-color: rgba(231, 76, 60, 0.1);
            background: rgba(231, 76, 60, 0.05);
        }
        .action-btn.danger:hover {
            background: rgba(231, 76, 60, 0.15);
            border-color: rgba(231, 76, 60, 0.3);
        }
        .action-btn.highlight {
            grid-column: span 2;
            background: var(--primary);
            color: #000;
            border: none;
            font-size: 13px;
            box-shadow: 0 4px 15px rgba(255, 200, 87, 0.2);
        }
        .action-btn.highlight:hover {
            background: #ffdb85;
            box-shadow: 0 6px 20px rgba(255, 200, 87, 0.3);
        }

        .activity-feed {
            margin-top: 25px;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 20px;
        }
        .feed-title {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }
        .feed-item {
            display: flex;
            gap: 12px;
            font-size: 12px;
            margin-bottom: 14px;
            color: var(--text-muted);
            align-items: flex-start;
        }
        .feed-icon {
            color: var(--secondary);
            margin-top: 2px;
            flex-shrink: 0;
        }
        .feed-text {
            line-height: 1.4;
        }
        .feed-time {
            margin-left: auto;
            font-size: 10px;
            opacity: 0.6;
            white-space: nowrap;
        }

        /* Animations */
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.9); opacity: 0.5; }
            100% { transform: scale(1.1); opacity: 0; }
        }

        .pulse-ring {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            border: 1px solid var(--status-online);
            animation: pulse-ring 2s infinite;
        }

        /* Utility for SVGs */
        svg {
            fill: currentColor;
        }

    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="bg-ambient"></div>

    <div class="app-container">
        
        <!-- LEFT COLUMN: User & Party -->
        <div class="panel">
            <div class="profile-section">
                <div class="avatar-container">
                    <div class="avatar-ring"></div>
                    <div class="avatar-img" id="myAvatar">
                        <!-- JS will inject SVG here -->
                    </div>
                    <div class="level-badge">LVL 42</div>
                </div>
                <h1 class="player-name">NeonViper</h1>
                <span class="player-title">Cybernetic Ranger</span>
                
                <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
                    <button class="btn btn-secondary" style="flex:1; font-size: 10px;">PROFILE</button>
                    <button class="btn btn-secondary" style="flex:1; font-size: 10px;">SETTINGS</button>
                </div>
            </div>

            <div class="panel-header">
                <span class="panel-title">Active Party (3/4)</span>
                <button class="btn btn-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                </button>
            </div>

            <div class="party-tracker">
                <!-- Party Member 1 -->
                <div class="party-member">
                    <div class="mini-avatar" style="background: url('data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 40 40\'><rect width=\'40\' height=\'40\' fill=\'%232ecc71\'/><circle cx=\'20\' cy=\'15\' r=\'8\' fill=\'%23fff\'/><path d=\'M10 35 Q20 25 30 35\' stroke=\'%23fff\' stroke-width=\'2\' fill=\'none\'/></svg>') no-repeat center/cover;">
                        <div class="status-dot" style="background: var(--status-online);"></div>
                    </div>
                    <div class="member-info">
                        <div class="member-name">Sara_V</div>
                        <div class="member-role">Tank • Online</div>
                    </div>
                </div>
                <!-- Party Member 2 -->
                <div class="party-member">
                    <div class="mini-avatar" style="background: url('data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 40 40\'><rect width=\'40\' height=\'40\' fill=\'%233498db\'/><rect x=\'10\' y=\'10\' width=\'20\' height=\'20\' fill=\'%23fff\'/></svg>') no-repeat center/cover;">
                        <div class="status-dot" style="background: var(--status-ingame);"></div>
                    </div>
                    <div class="member-info">
                        <div class="member-name">K0dox</div>
                        <div class="member-role">DPS • In Game</div>
                    </div>
                </div>
                <!-- Empty Slot -> Converted to Invite Button (Critique 3) -->
                <div class="party-member empty-slot">
                    <div class="mini-avatar">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                    </div>
                    <div class="member-info">
                        <div class="member-name">INVITE FRIEND</div>
                        <div class="member-role">Open Slot</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- CENTER COLUMN: Friends List -->
        <div class="panel">
            <div class="search-bar">
                <div class="search-input-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" class="search-input" placeholder="Search callsign...">
                </div>
                <!-- Add Friend Button (Critique 4) -->
                <button class="add-friend-btn" title="Add Friend">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                </button>
            </div>

            <div class="tabs">
                <div class="tab active">Friends</div>
                <div class="tab">Online <span style="color:var(--secondary)">12</span></div>
                <!-- Requests Badge Enlarged (Critique 4) -->
                <div class="tab">Requests <span class="badge">2</span></div>
            </div>

            <div class="friends-list" id="friendsList">
                <!-- JS will populate this -->
            </div>
        </div>

        <!-- RIGHT COLUMN: Detail Panel -->
        <div class="panel detail-panel" id="detailPanel">
            <div class="detail-header">
                <!-- Background Art -->
                <svg style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0.1;" viewBox="0 0 300 160" preserveAspectRatio="none">
                    <path d="M0 160 L150 20 L300 160 Z" fill="var(--primary)"/>
                </svg>
                <div class="detail-overlay">
                    <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                        <div>
                            <h2 style="margin:0; font-size:24px;" id="detailName">BladeRunner</h2>
                            <span style="color:var(--primary); font-size:12px; font-weight:600; letter-spacing:1px;" id="detailRole">ASSASSIN</span>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-size:9px; color:var(--text-muted); text-transform:uppercase;">Since</div>
                            <div style="font-weight:bold; font-size:12px; color:var(--text-main);" id="detailSince">2023</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="detail-avatar-large" id="detailAvatar">
                <!-- JS will inject SVG here -->
            </div>

            <div class="detail-content">
                <div class="stat-row">
                    <div class="stat-box">
                        <span class="stat-val" id="statLvl">88</span>
                        <span class="stat-label">Level</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-val" id="statWins">1204</span>
                        <span class="stat-label">Wins</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-val" id="statKd">4.2</span>
                        <span class="stat-label">K/D</span>
                    </div>
                </div>

                <div class="action-grid">
                    <button class="action-btn highlight">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        INVITE TO PARTY
                    </button>
                    <button class="action-btn danger">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                        BATTLE
                    </button>
                    <button class="action-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                        MSG
                    </button>
                </div>

                <div class="activity-feed">
                    <div class="feed-title">Recent Activity</div>
                    <div class="feed-item">
                        <svg class="feed-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                        <span class="feed-text">Won Ranked Match (Squad)</span>
                        <span class="feed-time">2m ago</span>
                    </div>
                    <div class="feed-item">
                        <svg class="feed-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                        <span class="feed-text">Unlocked "Cyber Ninja"</span>
                        <span class="feed-time">1h ago</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- Mock Data ---
        const friends = [
            { id: 1, name: "BladeRunner", role: "Assassin", status: "online", lvl: 88, wins: 1204, kd: "4.2", date: "2023", color: "#e74c3c" },
            { id: 2, name: "Glitch_Witch", role: "Support", status: "online", lvl: 45, wins: 340, kd: "1.1", date: "2024", color: "#9b59b6" },
            { id: 3, name: "HeavyMetal", role: "Tank", status: "ingame", lvl: 92, wins: 5600, kd: "2.8", date: "2021", color: "#f39c12" },
            { id: 4, name: "ZeroCool", role: "Hacker", status: "offline", lvl: 12, wins: 45, kd: "0.8", date: "2024", color: "#3498db" },
            { id: 5, name: "NeonSpectre", role: "Sniper", status: "online", lvl: 67, wins: 890, kd: "3.5", date: "2022", color: "#2ecc71" },
            { id: 6, name: "CyberPunk99", role: "Ranger", status: "online", lvl: 55, wins: 600, kd: "1.9", date: "2023", color: "#e67e22" },
            { id: 7, name: "VoidWalker", role: "Mage", status: "offline", lvl: 30, wins: 120, kd: "1.2", date: "2023", color: "#34495e" },
            { id: 8, name: "PixelPioneer", role: "Engineer", status: "ingame", lvl: 74, wins: 1500, kd: "2.1", date: "2022", color: "#1abc9c" },
            { id: 9, name: "StarDust", role: "Scout", status: "online", lvl: 41, wins: 210, kd: "1.5", date: "2024", color: "#ff7979" },
            { id: 10, name: "Titan_X", role: "Heavy", status: "offline", lvl: 99, wins: 9999, kd: "5.5", date: "2020", color: "#95a5a6" },
        ];

        // --- Helper: Generate Character-like SVG Avatars (Critique 2) ---
        function getAvatarSVG(color, type) {
            // More organic shapes to look like characters/masks
            const shapes = [
                // Mask
                `<path d="M10 15 Q24 5 38 15 L38 30 Q24 40 10 30 Z" fill="${color}" opacity="0.9"/><circle cx="18" cy="20" r="2" fill="#fff"/><circle cx="30" cy="20" r="2" fill="#fff"/>`,
                // Robot Head
                `<rect x="12" y="10" width="24" height="24" rx="6" fill="${color}"/><rect x="18" y="18" width="12" height="6" fill="#000" opacity="0.3"/><circle cx="18" cy="22" r="1" fill="#0f0"/><circle cx="30" cy="22" r="1" fill="#0f0"/>`,
                // Helmet
                `<path d="M8 30 Q24 4 40 30 Z" fill="${color}"/><path d="M12 30 Q24 15 36 30" stroke="#fff" stroke-width="1" fill="none" opacity="0.5"/>`,
                // Abstract
                `<circle cx="24" cy="24" r="14" fill="${color}"/><path d="M14 24 Q24 10 34 24" stroke="#000" stroke-width="2" fill="none"/>`
            ];
            const shape = shapes[type % shapes.length];
            return `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" style="background: #1e2230;">${shape}</svg>`;
        }

        function getStatusColor(status) {
            if(status === 'online') return 'var(--status-online)';
            if(status === 'ingame') return 'var(--status-ingame)';
            return 'var(--status-offline)';
        }

        // --- Render Functions ---
        const listContainer = document.getElementById('friendsList');
        const detailPanel = document.getElementById('detailPanel');
        
        // Initial Render of List
        function renderList() {
            listContainer.innerHTML = '';
            friends.forEach((friend, index) => {
                const el = document.createElement('div');
                el.className = 'friend-item';
                // Auto-select first friend (Critique 1)
                if(index === 0) el.classList.add('selected');
                
                el.onclick = () => selectFriend(friend, el);
                
                // Avatar Glow (Critique 2)
                const glowFilter = friend.status === 'online' ? `filter: drop-shadow(0 0 5px ${getStatusColor(friend.status)});` : '';

                el.innerHTML = `
                    <div class="friend-avatar" style="${glowFilter}">
                        ${getAvatarSVG(friend.color, index)}
                        ${friend.status === 'online' ? '<div class="pulse-ring"></div>' : ''}
                        <div class="status-dot" style="background: ${getStatusColor(friend.status)}; bottom:-2px; right:-2px; border-color:var(--bg-panel);"></div>
                    </div>
                    <div class="friend-details">
                        <div class="friend-name">${friend.name}</div>
                        <div class="friend-status">
                            <span class="status-indicator" style="background: ${getStatusColor(friend.status)}; color: ${getStatusColor(friend.status)}"></span>
                            ${friend.status === 'ingame' ? 'In Match' : friend.status.charAt(0).toUpperCase() + friend.status.slice(1)}
                        </div>
                    </div>
                    ${friend.status === 'online' ? `<button class="btn-icon" style="opacity:0.3; margin-left:10px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>` : ''}
                `;
                listContainer.appendChild(el);
            });
        }

        // Selection Logic
        let currentSelection = null;

        function selectFriend(friend, el) {
            // UI Toggle
            document.querySelectorAll('.friend-item').forEach(i => i.classList.remove('selected'));
            el.classList.add('selected');

            // Update Detail Panel (Critique 1 - Populate immediately)
            document.getElementById('detailName').textContent = friend.name;
            document.getElementById('detailRole').textContent = friend.role;
            document.getElementById('detailSince').textContent = friend.date;
            document.getElementById('statLvl').textContent = friend.lvl;
            document.getElementById('statWins').textContent = friend.wins;
            document.getElementById('statKd').textContent = friend.kd;
            
            // Update Avatar in Detail
            const avatarContainer = document.getElementById('detailAvatar');
            avatarContainer.innerHTML = `<div style="width:100%; height:100%; overflow:hidden; border-radius:12px; background: #1e2230;">${getAvatarSVG(friend.color, friend.id)}</div>`;
            
            // Update Header BG Gradient based on color
            const header = document.querySelector('.detail-header');
            header.style.background = `linear-gradient(135deg, ${friend.color}30, #1b1e2b)`;
            
            // Subtle interaction feedback
            detailPanel.style.transform = "scale(1.01)";
            setTimeout(() => detailPanel.style.transform = "scale(1)", 150);
        }

        // Initialize My Avatar
        document.getElementById('myAvatar').innerHTML = getAvatarSVG('#ffc857', 0);

        // Run
        renderList();
        
        // Auto-select the first friend to populate the panel immediately (Critique 1)
        const firstFriend = friends[0];
        const firstItem = document.querySelector('.friend-item');
        if(firstFriend && firstItem) {
            selectFriend(firstFriend, firstItem);
        }

    </script>
</body>
</html>
