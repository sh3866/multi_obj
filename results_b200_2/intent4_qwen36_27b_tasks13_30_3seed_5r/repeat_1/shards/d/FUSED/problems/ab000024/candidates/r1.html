<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Modern Sanitary Design</title>
    <style>
        :root {
            --bg-dark: #1a1a1a;
            --bg-light: #f4f4f4;
            --text-main: #2A2A2A;
            --text-muted: #666666;
            --accent: #2C3E50;
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-body: 'Georgia', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-display);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Layout */
        header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #fff;
        }

        nav a {
            text-decoration: none;
            color: rgba(255,255,255,0.6);
            margin-left: 2rem;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #fff;
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            position: relative;
            background-color: #f0f0f0;
            overflow: hidden;
        }

        /* Background Context: Warm Vignette & Texture */
        .wall-context {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 70% 50%, rgba(255,255,255,0) 0%, rgba(0,0,0,0.15) 100%),
                linear-gradient(to right, #e8e6e1 0%, #f4f4f4 100%);
            z-index: 0;
            pointer-events: none;
        }
        
        /* Subtle noise texture overlay */
        .wall-context::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Left Column: Typography */
        .content-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 4rem;
            z-index: 2;
            position: relative;
        }

        h1 {
            font-size: 5.5rem;
            line-height: 0.85;
            letter-spacing: -0.04em;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        h1 span {
            display: block;
            font-family: var(--font-body);
            font-style: italic;
            font-weight: 400;
            color: var(--text-muted);
            font-size: 3.5rem;
            margin-top: 0.5rem;
        }

        .specs {
            margin-top: 3rem;
            border-top: 1px solid rgba(0,0,0,0.1);
            padding-top: 1.5rem;
            display: flex;
            gap: 4rem;
        }

        .spec-item h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #888;
            margin-bottom: 0.5rem;
        }

        .spec-item p {
            font-size: 1.25rem;
            font-weight: 400;
            color: var(--text-main);
        }

        /* Right Column: Illustration */
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        /* SVG Styles */
        svg {
            width: 100%;
            height: 100%;
            max-width: 750px;
            /* Soft shadow for the whole composition */
            filter: drop-shadow(0px 30px 40px rgba(0,0,0,0.15));
        }

        /* Interactive UI */
        .cta-btn {
            margin-top: 3rem;
            padding: 1.2rem 2.5rem;
            background: var(--text-main);
            color: #fff;
            border: none;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            cursor: pointer;
            width: fit-content;
            transition: all 0.3s ease;
            border-radius: 2px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .cta-btn:hover {
            background: #000;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .cta-btn:active {
            transform: translateY(0);
        }

        /* SVG Animations */
        .water-group {
            transform-origin: 300px 305px;
        }
        
        .flush-ring {
            transform-origin: 300px 305px;
            opacity: 0;
        }

        .flushing .flush-ring {
            animation: ringExpand 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .flushing .water-surface {
            animation: waterSpin 0.8s ease-in forwards;
        }

        @keyframes ringExpand {
            0% { transform: scale(0.2); opacity: 0.8; stroke-width: 2px; }
            100% { transform: scale(1.2); opacity: 0; stroke-width: 0.5px; }
        }

        @keyframes waterSpin {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(0.1) rotate(360deg); opacity: 0.5; }
        }

        /* Handle Animation */
        .handle-arm {
            transform-origin: 215px 190px;
            transition: transform 0.1s ease;
        }
        .handle-pressed {
            transform: rotate(25deg);
        }

        /* Responsive */
        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; }
            .content-side { padding: 2rem; order: 2; }
            .visual-side { height: 50vh; order: 1; }
            h1 { font-size: 3rem; }
            h1 span { font-size: 2rem; }
            .specs { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aura</div>
        <nav>
            <a href="#">Collection</a>
            <a href="#">Technology</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div class="wall-context"></div>

        <div class="content-side">
            <h1>
                Silence.<br>
                <span>Refined.</span>
            </h1>
            
            <div class="specs">
                <div class="spec-item">
                    <h3>Flow Rate</h3>
                    <p>3.8 L</p>
                </div>
                <div class="spec-item">
                    <h3>Material</h3>
                    <p>Vitreous<br>Ceramic</p>
                </div>
                <div class="spec-item">
                    <h3>Finish</h3>
                    <p>Gloss White</p>
                </div>
            </div>

            <button class="cta-btn" onclick="triggerFlush()">Simulate Flush</button>
        </div>

        <div class="visual-side">
            <!-- SVG Illustration -->
            <svg viewBox="0 0 600 650" xmlns="http://www.w3.org/2000/svg" id="toilet-svg">
                <defs>
                    <!-- Complex Ceramic Gradient: Simulates cylindrical lighting -->
                    <linearGradient id="ceramicBody" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#e0e0e0" /> <!-- Shadow Edge -->
                        <stop offset="15%" stop-color="#ffffff" /> <!-- Highlight -->
                        <stop offset="85%" stop-color="#f5f5f5" /> <!-- Base -->
                        <stop offset="100%" stop-color="#dcdcdc" /> <!-- Shadow Edge -->
                    </linearGradient>

                    <!-- Tank Gradient: Flatter surface -->
                    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#f0f0f0" />
                        <stop offset="10%" stop-color="#ffffff" />
                        <stop offset="90%" stop-color="#f9f9f9" />
                        <stop offset="100%" stop-color="#e0e0e0" />
                    </linearGradient>

                    <!-- Floor Flange Gradient: Metallic/Dark Plastic -->
                    <linearGradient id="flangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#333" />
                        <stop offset="50%" stop-color="#555" />
                        <stop offset="100%" stop-color="#222" />
                    </linearGradient>

                    <!-- Water Gradient: Deep center -->
                    <radialGradient id="waterGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                        <stop offset="60%" stop-color="#e1f5fe" stop-opacity="0.8"/>
                        <stop offset="100%" stop-color="#81d4fa" stop-opacity="0.9"/>
                    </radialGradient>

                    <!-- Drop Shadow for 3D feel -->
                    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
                        <feOffset dx="0" dy="12" result="offsetBlur"/>
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.15"/>
                        </feComponentTransfer>
                        <feMerge> 
                            <feMergeNode/>
                            <feMergeNode in="SourceGraphic"/> 
                        </feMerge>
                    </filter>
                </defs>

                <!-- Floor Shadow -->
                <ellipse cx="300" cy="560" rx="160" ry="20" fill="#000" opacity="0.15" filter="blur(10px)" />

                <!-- Base/Floor Connection (Floor Flange) -->
                <g id="floor-connection">
                    <!-- Floor Flange Ring -->
                    <ellipse cx="300" cy="545" rx="50" ry="12" fill="url(#flangeGrad)" />
                    <!-- Wall Pipe Connection (Behind) -->
                    <rect x="270" y="520" width="60" height="40" fill="#dcdcdc" rx="4" />
                    <!-- Pipe Shadow -->
                    <rect x="270" y="540" width="60" height="20" fill="#000" opacity="0.1" rx="4" />
                </g>

                <!-- Main Bowl Group -->
                <g id="bowl" filter="url(#dropShadow)">
                    <!-- Back of the bowl (hidden behind tank mostly, but adds depth) -->
                    <path d="M210,300 C210,280 390,280 390,300 L390,330 C390,330 370,310 300,310 C230,310 210,330 210,330 Z" fill="#e0e0e0" />

                    <!-- Bowl Body -->
                    <path d="M210,300 C210,300 190,500 300,500 C410,500 390,300 390,300 Z" fill="url(#ceramicBody)" />
                    
                    <!-- Specular Highlight (Gloss) -->
                    <path d="M230,350 C220,400 240,480 290,490 C340,480 360,400 350,350 C330,380 250,380 230,350 Z" fill="#fff" opacity="0.6" />
                </g>

                <!-- Water in Bowl -->
                <g id="water-system">
                    <!-- Water Surface -->
                    <ellipse cx="300" cy="305" rx="78" ry="14" fill="url(#waterGrad)" class="water-surface" />
                    
                    <!-- Flush Action Visual (Concentric Rings) -->
                    <g id="flush-effect">
                        <circle cx="300" cy="305" r="10" fill="none" stroke="#fff" stroke-width="2" class="flush-ring" />
                        <circle cx="300" cy="305" r="10" fill="none" stroke="#fff" stroke-width="1" class="flush-ring" style="animation-delay: 0.1s" />
                        <circle cx="300" cy="305" r="10" fill="none" stroke="#e1f5fe" stroke-width="1" class="flush-ring" style="animation-delay: 0.2s" />
                    </g>
                </g>

                <!-- Seat & Lid -->
                <g id="seat" filter="url(#dropShadow)">
                    <!-- Lid (Open/Leaning) -->
                    <g transform="rotate(-12, 300, 280)">
                        <!-- Lid Top -->
                        <path d="M215,280 A85 22 0 0 0 385,280" fill="url(#ceramicBody)" stroke="#fff" stroke-width="1"/>
                        <!-- Lid Thickness (Side) -->
                        <path d="M215,280 A85 22 0 0 0 385,280 L385,286 A85 22 0 0 1 215,286 Z" fill="#dcdcdc" />
                    </g>
                    
                    <!-- Seat (Down) -->
                    <path d="M215,300 A85 22 0 0 0 385,300" fill="url(#ceramicBody)" stroke="#fff" stroke-width="1"/>
                    <!-- Seat Thickness -->
                    <path d="M215,300 A85 22 0 0 0 385,300 L385,306 A85 22 0 0 1 215,306 Z" fill="#dcdcdc" />
                    <!-- Inner Shadow on Seat -->
                    <ellipse cx="300" cy="300" rx="78" ry="18" fill="none" stroke="#000" stroke-width="1" opacity="0.05"/>
                </g>

                <!-- Tank -->
                <g id="tank" filter="url(#dropShadow)">
                    <!-- Tank Body -->
                    <rect x="230" y="110" width="140" height="170" rx="12" fill="url(#tankGrad)" />
                    
                    <!-- Tank Highlight (Left Edge) -->
                    <path d="M240,115 L240,275" stroke="white" stroke-width="12" opacity="0.4" stroke-linecap="round"/>
                    
                    <!-- Tank Top Rim -->
                    <rect x="228" y="108" width="144" height="10" rx="5" fill="#fff" />
                    
                    <!-- Tank Bottom Connection (Shadow) -->
                    <path d="M230,270 L370,270 L370,280 C370,285 365,290 360,290 L240,290 C235,290 230,285 230,280 Z" fill="#000" opacity="0.1" />
                </g>

                <!-- Flush Handle (Chrome/Metallic) -->
                <g id="handle" transform="translate(215, 190)">
                    <!-- Shadow -->
                    <circle cx="-15" cy="25" r="6" fill="#000" opacity="0.1" />
                    <!-- Arm -->
                    <g class="handle-arm">
                        <path d="M0,0 L-18,22" stroke="#b0b0b0" stroke-width="5" stroke-linecap="round" />
                        <path d="M0,0 L-18,22" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.5" /> <!-- Highlight -->
                    </g>
                    <!-- Knob -->
                    <circle cx="-18" cy="22" r="8" fill="#e0e0e0" stroke="#999" stroke-width="1" />
                    <circle cx="-18" cy="22" r="6" fill="#fff" opacity="0.8" />
                </g>
                
                <!-- Context: Minimalist Plant -->
                <g transform="translate(490, 480)">
                    <!-- Pot -->
                    <path d="M-15,0 L15,0 L10,70 L-10,70 Z" fill="#3e3e3e" />
                    <!-- Leaves -->
                    <path d="M0,0 Q-30,-50 -10,-100 Q10,-50 0,0" fill="#5d4037" opacity="0.8" />
                    <path d="M0,0 Q30,-70 50,-110 Q20,-60 0,0" fill="#4e342e" opacity="0.9" />
                    <path d="M0,0 Q-10,-90 20,-130 Q40,-70 0,0" fill="#6d4c41" opacity="0.8" />
                </g>

            </svg>
        </div>
    </main>

    <script>
        function triggerFlush() {
            const svg = document.getElementById('toilet-svg');
            const effect = document.getElementById('flush-effect');
            const handleArm = document.querySelector('.handle-arm');
            
            // 1. Reset Animation classes to allow re-triggering
            effect.classList.remove('flushing');
            handleArm.classList.remove('handle-pressed');
            
            // Trigger Reflow (Magic line to restart CSS animation)
            void effect.offsetWidth; 

            // 2. Add Animation classes
            effect.classList.add('flushing');
            handleArm.classList.add('handle-pressed');

            // 3. Reset handle position after animation
            setTimeout(() => {
                handleArm.classList.remove('handle-pressed');
            }, 200);
        }
    </script>
</body>
</html>
