<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Modern Ceramic Design</title>
    <style>
        :root {
            /* Palette: Refined Studio Environment */
            --bg-wall: #F0F2F5;
            --bg-floor: #D1D5DB;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --accent: #2563EB;
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-serif: 'Georgia', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-display);
            background-color: var(--bg-wall);
            color: var(--text-primary);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Environment --- */
        .environment {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }

        .wall {
            flex: 1;
            background: linear-gradient(to bottom, #FFFFFF 0%, #F3F4F6 100%);
            position: relative;
        }

        /* Floor with Perspective Grid */
        .floor-container {
            position: absolute;
            bottom: 0;
            left: -50%;
            width: 200%;
            height: 45vh;
            background: var(--bg-floor);
            transform: perspective(800px) rotateX(60deg);
            transform-origin: center top;
            /* Tile Grid */
            background-image: 
                linear-gradient(rgba(255,255,255,0.3) 2px, transparent 2px),
                linear-gradient(90deg, rgba(255,255,255,0.3) 2px, transparent 2px),
                linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 120px 120px, 120px 120px, 120px 120px, 120px 120px;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.1);
            z-index: -1;
        }

        /* --- Layout --- */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 35% 65%;
            position: relative;
            z-index: 1;
            height: 100%;
        }

        /* --- Content Column --- */
        .content-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 4rem;
            position: relative;
        }

        .tagline {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-secondary);
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .tagline::before {
            content: '';
            display: block;
            width: 20px;
            height: 2px;
            background: var(--text-secondary);
        }

        h1 {
            font-size: 4rem;
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }

        h1 span {
            font-family: var(--font-serif);
            font-style: italic;
            font-weight: 400;
            color: var(--text-secondary);
            display: block;
            margin-top: 0.5rem;
            font-size: 0.6em;
        }

        .description {
            max-width: 320px;
            line-height: 1.7;
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 3rem;
            font-weight: 300;
        }

        .flush-trigger {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1.1rem 2.2rem;
            background: #111;
            border: 1px solid #111;
            color: #fff;
            font-family: var(--font-display);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            width: fit-content;
            border-radius: 4px;
        }

        .flush-trigger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            background: #000;
        }

        .flush-trigger:active {
            transform: translateY(0);
        }

        /* --- Visual Column --- */
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 8vh;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
            max-height: 95vh;
            overflow: visible;
        }

        /* --- SVG Animations --- */
        
        /* Handle Mechanics */
        .handle-group {
            transform-origin: 210px 250px; /* Pivot point */
            transition: transform 0.1s ease-out;
        }
        .handle-group.pressed {
            transform: rotate(20deg);
        }

        /* Water System Animations */
        .water-surface {
            transform-origin: 300px 390px;
            transition: transform 0.2s ease;
        }

        /* The Swirl Graphic */
        .flush-spiral {
            transform-origin: 300px 390px;
            opacity: 0;
            stroke: #E0F7FA;
            stroke-width: 3px;
            fill: none;
            stroke-linecap: round;
        }

        /* The Vortex Hole */
        .vortex-hole {
            transform-origin: 300px 390px;
            opacity: 0;
            fill: #1F2937;
        }

        /* Splash Droplets */
        .splash-particle {
            opacity: 0;
            fill: #fff;
        }

        /* Active State: Flushing */
        .flushing .flush-spiral {
            animation: swirl-spin 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        .flushing .water-surface {
            animation: water-drain 1.5s ease-in-out forwards;
        }

        .flushing .vortex-hole {
            animation: hole-open 1.5s ease-in-out forwards;
        }

        .flushing .splash-particle {
            animation: splash-up 0.6s ease-out forwards;
        }

        @keyframes swirl-spin {
            0% { transform: scale(0.2) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: scale(1.2) rotate(540deg); opacity: 0; }
        }
        
        @keyframes water-drain {
            0% { transform: scale(1); opacity: 1; }
            20% { transform: scale(1.02); } 
            100% { transform: scale(0.01); opacity: 0; }
        }

        @keyframes hole-open {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes splash-up {
            0% { transform: translate(0,0) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; }
            .content-side { 
                padding: 2rem; 
                order: 2; 
                background: linear-gradient(to bottom, rgba(240,242,245,0.9), rgba(240,242,245,0));
            }
            .visual-side { 
                height: 50vh; 
                order: 1; 
                padding-bottom: 0; 
                transform: scale(0.8); 
            }
            h1 { font-size: 2.5rem; }
            .floor-container { height: 30vh; }
        }
    </style>
</head>
<body>

    <!-- Background Environment -->
    <div class="environment">
        <div class="wall"></div>
        <div class="floor-container"></div>
    </div>

    <main>
        <!-- Text Content -->
        <div class="content-side">
            <div class="tagline">Ceramic Engineering</div>
            <h1>
                AURA.<br>
                <span>Precision Flow.</span>
            </h1>
            
            <p class="description">
                A masterclass in hydro-acoustic design. The AURA series 
                combines a low-profile silhouette with a silent, vortex-driven 
                flush mechanism for the ultimate sanctuary.
            </p>

            <button class="flush-trigger" onclick="triggerFlush()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2.69l5.74 5.88a6 6 0 0 1-8.48 8.48A6 6 0 0 1 5.5 13.5L12 2.69z"></path>
                </svg>
                Simulate Flush
            </button>
        </div>

        <!-- Illustration -->
        <div class="visual-side">
            <!-- SVG Illustration: Reconstructed for Realism -->
            <svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- 1. Ceramic Body Gradient (High Gloss) -->
                    <linearGradient id="ceramicBody" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#E5E7EB" /> <!-- Edge Shadow -->
                        <stop offset="5%" stop-color="#FFFFFF" /> <!-- Rim Light -->
                        <stop offset="15%" stop-color="#FFFFFF" /> <!-- Highlight -->
                        <stop offset="40%" stop-color="#F9FAFB" /> <!-- Main Body -->
                        <stop offset="85%" stop-color="#E5E7EB" /> <!-- Shadow Transition -->
                        <stop offset="100%" stop-color="#9CA3AF" /> <!-- Deep Shadow -->
                    </linearGradient>

                    <!-- 2. Tank Gradient (Slightly Darker) -->
                    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#D1D5DB" />
                        <stop offset="8%" stop-color="#FFFFFF" />
                        <stop offset="20%" stop-color="#F3F4F6" />
                        <stop offset="90%" stop-color="#9CA3AF" />
                        <stop offset="100%" stop-color="#6B7280" />
                    </linearGradient>

                    <!-- 3. Chrome/Metal Gradient -->
                    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#9CA3AF" />
                        <stop offset="30%" stop-color="#F9FAFB" />
                        <stop offset="50%" stop-color="#9CA3AF" />
                        <stop offset="80%" stop-color="#F9FAFB" />
                        <stop offset="100%" stop-color="#4B5563" />
                    </linearGradient>

                    <!-- 4. Water Gradient (Depth) -->
                    <radialGradient id="waterGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
                        <stop offset="60%" stop-color="#E0F2FE" stop-opacity="0.6"/>
                        <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.9"/>
                    </radialGradient>

                    <!-- Shadow Filter -->
                    <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
                        <feOffset dx="0" dy="15" result="offsetblur" />
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.15" />
                        </feComponentTransfer>
                        <feMerge> 
                            <feMergeNode />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                </defs>

                <!-- 1. Ground Shadow -->
                <ellipse cx="300" cy="625" rx="170" ry="35" fill="#000" opacity="0.15" filter="blur(10px)" />

                <!-- 2. Plumbing Base (Flange & Connection) -->
                <g id="plumbing-base">
                    <!-- Wall Connection Pipe (Behind) -->
                    <rect x="260" y="560" width="80" height="60" fill="#9CA3AF" rx="4" />
                    
                    <!-- Floor Flange (Chrome) -->
                    <ellipse cx="300" cy="625" rx="90" ry="24" fill="url(#chromeGrad)" stroke="#4B5563" stroke-width="1"/>
                    
                    <!-- Rubber Gasket -->
                    <ellipse cx="300" cy="625" rx="85" ry="20" fill="#374151" />
                    
                    <!-- Drain Hole (Floor) -->
                    <ellipse cx="300" cy="625" rx="45" ry="12" fill="#111827" />
                    
                    <!-- Skirt (Connecting Bowl to Floor) -->
                    <!-- Note: This draws OVER the flange to create the seamless look -->
                    <path d="M215,450 C215,580 245,620 300,620 C355,620 385,580 385,450 Z" fill="url(#ceramicBody)" />
                </g>

                <!-- 3. Main Bowl -->
                <g id="bowl">
                    <!-- Front Body Path -->
                    <path d="M215,380 C185,490 235,610 300,610 C365,610 415,490 385,380 C385,380 335,350 300,350 C265,350 215,380 215,380 Z" fill="url(#ceramicBody)" />
                    
                    <!-- Specular Highlight (Left Curve) -->
                    <path d="M235,430 C215,510 255,590 300,600" stroke="#FFFFFF" stroke-width="12" opacity="0.6" stroke-linecap="round" fill="none" filter="blur(4px)"/>
                    
                    <!-- Sharp Edge Highlight -->
                    <path d="M215,380 C215,380 195,480 245,590" stroke="#FFFFFF" stroke-width="2" opacity="0.9" fill="none" />
                </g>

                <!-- 4. Water System (The Action Center) -->
                <g id="water-system" class="water-group">
                    <!-- Inner Bowl Shadow -->
                    <ellipse cx="300" cy="385" rx="85" ry="22" fill="#000" opacity="0.15" />
                    
                    <!-- The Water Surface (Will drain) -->
                    <ellipse cx="300" cy="385" rx="80" ry="18" fill="url(#waterGrad)" class="water-surface" />
                    
                    <!-- Reflection on Water -->
                    <ellipse cx="300" cy="385" rx="70" ry="14" fill="none" stroke="#FFF" stroke-width="1" opacity="0.5" />

                    <!-- Visual Cue: Swirl Graphic -->
                    <!-- A stylized spiral path -->
                    <path d="M300,385 C280,385 270,365 300,365 C330,365 340,395 300,395 C260,395 240,350 300,340 C360,340 380,400 300,410" class="flush-spiral" />

                    <!-- Visual Cue: Vortex Hole (Appears when drained) -->
                    <ellipse cx="300" cy="385" rx="20" ry="6" class="vortex-hole" />

                    <!-- Splash Particles -->
                    <circle cx="295" cy="380" r="2" class="splash-particle" style="--tx: -40px; --ty: -50px;" />
                    <circle cx="305" cy="385" r="2.5" class="splash-particle" style="--tx: 45px; --ty: -40px;" />
                    <circle cx="300" cy="380" r="3" class="splash-particle" style="--tx: 0px; --ty: -70px;" />
                </g>

                <!-- 5. Seat & Lid -->
                <g id="seat-lid">
                    <!-- Seat (Down) -->
                    <!-- Top Surface -->
                    <path d="M205,365 A95 24 0 0 0 395,365" fill="url(#ceramicBody)" />
                    <!-- Thickness -->
                    <path d="M205,365 A95 24 0 0 0 395,365 L395,371 A95 24 0 0 1 205,371 Z" fill="#E5E7EB" />
                    <!-- Shadow on Bowl -->
                    <path d="M215,365 A85 20 0 0 0 385,365" stroke="#000" stroke-width="2" opacity="0.1" fill="none" />

                    <!-- Lid (Leaning Back) -->
                    <g transform="rotate(-15, 300, 350)">
                        <!-- Lid Surface -->
                        <path d="M205,350 A95 24 0 0 0 395,350" fill="url(#ceramicBody)" stroke="#FFF" stroke-width="1"/>
                        <!-- Thickness -->
                        <path d="M205,350 A95 24 0 0 0 395,350 L395,356 A95 24 0 0 1 205,356 Z" fill="#D1D5DB" />
                    </g>
                </g>

                <!-- 6. Tank -->
                <g id="tank" filter="url(#dropShadow)">
                    <!-- Tank Body (Rectangular with rounded corners) -->
                    <rect x="235" y="160" width="130" height="180" rx="6" fill="url(#tankGrad)" />
                    
                    <!-- Top Rim Highlight -->
                    <rect x="235" y="160" width="130" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />
                    
                    <!-- Side Highlight (Soft) -->
                    <path d="M250,170 L250,330" stroke="#FFFFFF" stroke-width="8" opacity="0.4" stroke-linecap="round" filter="blur(2px)"/>

                    <!-- Connection Shadow (Tank to Bowl) -->
                    <path d="M235,330 L365,330 L365,340 C365,345 360,350 355,350 L245,350 C240,350 235,345 235,340 Z" fill="#000" opacity="0.2" />
                </g>

                <!-- 7. Flush Handle (Distinct Chrome) -->
                <g id="handle">
                    <!-- Base Mount -->
                    <circle cx="210" cy="250" r="14" fill="url(#chromeGrad)" stroke="#4B5563" stroke-width="1" />
                    <circle cx="210" cy="250" r="10" fill="#F3F4F6" />
                    
                    <!-- The Lever (Rotatable) -->
                    <g class="handle-group">
                        <!-- Shadow -->
                        <path d="M210,250 L185,280" stroke="#000" stroke-width="8" stroke-linecap="round" opacity="0.15" transform="translate(2,2)"/>
                        <!-- Arm Body -->
                        <path d="M210,250 L185,280" stroke="url(#chromeGrad)" stroke-width="8" stroke-linecap="round" />
                        <!-- Arm Highlight -->
                        <path d="M210,250 L185,280" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.9" />
                        
                        <!-- The Knob/Button -->
                        <circle cx="185" cy="280" r="12" fill="url(#chromeGrad)" stroke="#4B5563" stroke-width="1" />
                        <!-- Specular Dot -->
                        <circle cx="181" cy="276" r="3" fill="#FFF" opacity="0.9" />
                    </g>
                </g>

            </svg>
        </div>
    </main>

    <script>
        function triggerFlush() {
            const waterSystem = document.getElementById('water-system');
            const handleGroup = document.querySelector('.handle-group');
            
            // 1. Reset Animation Classes (Remove to restart)
            waterSystem.classList.remove('flushing');
            handleGroup.classList.remove('pressed');
            
            // 2. Force Reflow (Browser repaint hack)
            void waterSystem.offsetWidth; 

            // 3. Trigger Animations
            waterSystem.classList.add('flushing');
            handleGroup.classList.add('pressed');

            // 4. Reset Handle Position after press
            setTimeout(() => {
                handleGroup.classList.remove('pressed');
            }, 250);
        }
    </script>
</body>
</html>
