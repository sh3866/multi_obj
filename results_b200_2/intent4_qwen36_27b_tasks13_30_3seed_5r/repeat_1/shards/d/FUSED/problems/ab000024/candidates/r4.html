<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | The Silent Flush</title>
    <style>
        :root {
            /* Palette: Sophisticated Stone & Porcelain */
            --bg-wall-top: #F7F7F6;
            --bg-wall-bot: #E8E8E6;
            --bg-floor: #D8D8D5;
            --bg-floor-dark: #C0C0BC;
            --text-primary: #1A1A1A;
            --text-secondary: #585858;
            --accent: #2C3E50;
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-serif: 'Georgia', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-display);
            background-color: var(--bg-wall-top);
            color: var(--text-primary);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Environment / Context --- */
        .environment {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .wall {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 65%;
            background: linear-gradient(to bottom, var(--bg-wall-top), var(--bg-wall-bot));
        }

        /* Floor with Tile Lines */
        .floor {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 40%;
            background-color: var(--bg-floor);
            /* Tile Grid Pattern */
            background-image: 
                linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 100px 100px;
            transform: perspective(600px) rotateX(55deg);
            transform-origin: center top;
            margin-top: -50px; /* Blend with wall */
            box-shadow: inset 0 0 150px rgba(0,0,0,0.15);
        }

        /* Stylized Plant Background */
        .plant-context {
            position: absolute;
            bottom: 15%;
            right: 10%;
            width: 200px;
            height: 300px;
            opacity: 0.4;
            filter: blur(2px);
            z-index: -1;
            pointer-events: none;
        }

        /* --- Layout --- */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 40% 60%; 
            position: relative;
            z-index: 1;
            height: 100%;
        }

        /* --- Content Column --- */
        .content-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 5rem;
            position: relative;
        }

        .tagline {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--text-secondary);
            font-weight: 700;
            margin-bottom: 1.5rem;
            border-left: 2px solid var(--accent);
            padding-left: 1rem;
        }

        h1 {
            font-size: 4.5rem;
            line-height: 1;
            letter-spacing: -0.04em;
            margin-bottom: 2rem;
            color: var(--text-primary);
        }

        h1 span {
            font-family: var(--font-serif);
            font-style: italic;
            font-weight: 400;
            color: var(--text-secondary);
            font-size: 0.6em;
            display: block;
            margin-top: 0.5rem;
            margin-left: 0.2rem;
        }

        .description {
            max-width: 360px;
            line-height: 1.6;
            color: var(--text-secondary);
            font-size: 1.05rem;
            margin-bottom: 4rem;
            font-weight: 300;
        }

        /* Interactive UI */
        .flush-trigger {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1rem 2rem;
            background: var(--text-primary);
            border: 1px solid var(--text-primary);
            color: #fff;
            font-family: var(--font-display);
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            width: fit-content;
            border-radius: 4px;
        }

        .flush-trigger:hover {
            transform: translateY(-2px);
            background: #000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        /* --- Visual Column (Hero) --- */
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 5vh;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
            max-height: 90vh;
            overflow: visible;
        }

        /* --- SVG Styles & Animations --- */
        
        .handle-rod {
            transform-origin: 0px 0px;
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .handle-pressed {
            transform: rotate(25deg);
        }

        /* Water System Animations */
        .water-surface {
            transform-origin: 300px 380px;
            transition: transform 0.3s ease;
        }

        .flush-ring {
            transform-origin: 300px 380px;
            opacity: 0;
            stroke: #fff;
            stroke-width: 2px;
            fill: none;
        }

        .flush-spiral {
            transform-origin: 300px 380px;
            opacity: 0;
            stroke: #fff;
            stroke-width: 1.5px;
            fill: none;
            stroke-linecap: round;
        }

        .splash-particle {
            opacity: 0;
            fill: #fff;
        }

        /* Active Classes */
        .flushing .flush-ring {
            animation: ripple 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .flushing .flush-spiral {
            animation: swirl 1.2s ease-in-out forwards;
        }
        
        .flushing .water-surface {
            animation: drain 1.5s ease-in forwards;
        }

        .flushing .splash-particle {
            animation: splash 0.8s ease-out forwards;
        }

        @keyframes ripple {
            0% { transform: scale(0.1); opacity: 0.9; stroke-width: 3px; }
            100% { transform: scale(3.5); opacity: 0; stroke-width: 0.5px; }
        }

        @keyframes swirl {
            0% { transform: scale(0.2) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: scale(1.5) rotate(360deg); opacity: 0; }
        }
        
        @keyframes drain {
            0% { transform: scale(1); }
            10% { transform: scale(1.02); } 
            100% { transform: scale(0.05); opacity: 0.6; }
        }

        @keyframes splash {
            0% { transform: translate(0,0) scale(0.5); opacity: 0.8; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; }
            .content-side { 
                padding: 2rem; 
                order: 2; 
                align-items: flex-start; 
                background: linear-gradient(to bottom, rgba(247,247,246,0.95), rgba(247,247,246,0));
            }
            .visual-side { 
                height: 50vh; 
                order: 1; 
                padding-bottom: 0; 
                align-items: center; 
                transform: scale(0.85);
            }
            h1 { font-size: 3rem; }
            .floor { display: none; } 
            .wall { height: 100%; }
            .plant-context { display: none; }
        }
    </style>
</head>
<body>

    <!-- Background Environment -->
    <div class="environment">
        <div class="wall"></div>
        <div class="floor"></div>
        
        <!-- Stylized Plant SVG (Context) -->
        <svg class="plant-context" viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
            <path d="M50,200 Q30,100 10,50" stroke="#8FBC8F" stroke-width="4" fill="none" opacity="0.6"/>
            <path d="M50,200 Q70,120 90,60" stroke="#8FBC8F" stroke-width="4" fill="none" opacity="0.6"/>
            <path d="M50,200 Q50,100 50,20" stroke="#8FBC8F" stroke-width="4" fill="none" opacity="0.6"/>
            <circle cx="10" cy="50" r="15" fill="#8FBC8F" opacity="0.5"/>
            <circle cx="90" cy="60" r="20" fill="#8FBC8F" opacity="0.5"/>
            <circle cx="50" cy="20" r="12" fill="#8FBC8F" opacity="0.5"/>
        </svg>
    </div>

    <main>
        <!-- Text Content -->
        <div class="content-side">
            <div class="tagline">Ceramic Engineering</div>
            <h1>
                AURA.<br>
                <span>Form & Flow.</span>
            </h1>
            
            <p class="description">
                A masterclass in hydro-acoustic design. The AURA series 
                combines a low-profile silhouette with a silent, vortex-driven 
                flush mechanism for the ultimate sanctuary.
            </p>

            <button class="flush-trigger" onclick="triggerFlush()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2.69l5.74 5.88a6 6 0 0 1-8.48 8.48A6 6 0 0 1 5.5 13.5L12 2.69z"></path>
                </svg>
                Simulate Flush
            </button>
        </div>

        <!-- Illustration -->
        <div class="visual-side">
            <!-- SVG Illustration: Redrawn for Realism & Proportion -->
            <svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg" id="toilet-svg">
                <defs>
                    <!-- 1. Complex Ceramic Gradient (Volume & Rim Light) -->
                    <linearGradient id="ceramicBody" x1="0%" y1="0%" x2="100%" y2="0%">
                        <!-- Rim Light (Left) -->
                        <stop offset="0%" stop-color="#F0F0F0" /> 
                        <stop offset="3%" stop-color="#FFFFFF" /> 
                        <!-- Main Body -->
                        <stop offset="15%" stop-color="#FFFFFF" /> 
                        <stop offset="45%" stop-color="#F8F8F8" /> 
                        <!-- Shadow Transition (Right) -->
                        <stop offset="80%" stop-color="#E0E0E0" /> 
                        <stop offset="95%" stop-color="#BDBDBD" />
                    </linearGradient>

                    <!-- 2. Tank Gradient (Slightly darker to sit back) -->
                    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#E8E8E8" />
                        <stop offset="10%" stop-color="#FFFFFF" />
                        <stop offset="70%" stop-color="#F0F0F0" />
                        <stop offset="100%" stop-color="#C8C8C8" />
                    </linearGradient>

                    <!-- 3. Chrome/Flange Gradient (Metallic) -->
                    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#999" />
                        <stop offset="25%" stop-color="#FFF" />
                        <stop offset="50%" stop-color="#AAA" />
                        <stop offset="80%" stop-color="#FFF" />
                        <stop offset="100%" stop-color="#777" />
                    </linearGradient>

                    <!-- 4. Water Depth Gradient -->
                    <radialGradient id="waterGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
                        <stop offset="40%" stop-color="#E0F7FA" stop-opacity="0.5"/>
                        <stop offset="100%" stop-color="#81D4FA" stop-opacity="0.8"/>
                    </radialGradient>

                    <!-- Drop Shadow Filter -->
                    <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
                        <feOffset dx="0" dy="10" result="offsetblur" />
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.25" />
                        </feComponentTransfer>
                        <feMerge> 
                            <feMergeNode />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                </defs>

                <!-- 1. Floor Shadow (Grounding) -->
                <ellipse cx="300" cy="630" rx="160" ry="40" fill="#000" opacity="0.15" filter="blur(12px)" />

                <!-- 2. Plumbing Base (Detailed Skirt & Flange) -->
                <g id="plumbing-base">
                    <!-- P-Trap Connection (Behind) -->
                    <rect x="260" y="560" width="80" height="40" fill="#A0A0A0" rx="5" />
                    <ellipse cx="300" cy="560" rx="40" ry="10" fill="#888" />
                    
                    <!-- The Skirt (Ceramic) -->
                    <path d="M210,450 C210,580 240,620 300,620 C360,620 390,580 390,450 Z" fill="url(#ceramicBody)" filter="url(#dropShadow)"/>
                    
                    <!-- Skirt Shadow Line (Separation) -->
                    <path d="M210,580 Q300,610 390,580" stroke="#000" stroke-width="1" opacity="0.1" fill="none"/>

                    <!-- Floor Flange (Chrome) -->
                    <ellipse cx="300" cy="620" rx="80" ry="22" fill="url(#chromeGrad)" />
                    <!-- Flange Bolts -->
                    <circle cx="230" cy="620" r="4" fill="#FFF" stroke="#999" stroke-width="1"/>
                    <circle cx="370" cy="620" r="4" fill="#FFF" stroke="#999" stroke-width="1"/>
                    <!-- Rubber Gasket -->
                    <ellipse cx="300" cy="620" rx="75" ry="18" fill="#222" />
                    <!-- Drain Hole -->
                    <ellipse cx="300" cy="620" rx="40" ry="10" fill="#000" />
                </g>

                <!-- 3. Main Bowl (Wider, Shorter Tank, Realistic Shape) -->
                <g id="bowl">
                    <!-- Bowl Front Body -->
                    <!-- Path creates a wide, rounded belly -->
                    <path d="M210,380 C180,480 230,600 300,600 C370,600 420,480 390,380 C390,380 340,350 300,350 C260,350 210,380 210,380 Z" fill="url(#ceramicBody)" />
                    
                    <!-- Gloss Highlight (Left Curve) -->
                    <path d="M230,420 C210,500 250,580 300,590" stroke="#FFF" stroke-width="14" opacity="0.5" stroke-linecap="round" fill="none" filter="blur(4px)"/>
                    
                    <!-- Sharp Specular Highlight (Top Rim) -->
                    <path d="M210,380 C210,380 190,480 240,580" stroke="#FFF" stroke-width="2" opacity="0.8" fill="none" />
                </g>

                <!-- 4. Water System (The Action Center) -->
                <g id="water-system" class="water-group">
                    <!-- Inner Bowl Shadow -->
                    <ellipse cx="300" cy="380" rx="90" ry="22" fill="#000" opacity="0.1" />
                    
                    <!-- The Water Surface -->
                    <ellipse cx="300" cy="380" rx="85" ry="20" fill="url(#waterGrad)" class="water-surface" />
                    
                    <!-- Inner Reflection -->
                    <ellipse cx="300" cy="380" rx="75" ry="16" fill="none" stroke="#FFF" stroke-width="1" opacity="0.4" />

                    <!-- Visual Cue: Swirl Path (Hidden initially) -->
                    <path d="M300,380 C280,380 270,360 300,360 C330,360 340,390 300,390 C260,390 240,350 300,340 C360,340 380,400 300,410" class="flush-spiral" />

                    <!-- Splash Particles -->
                    <circle cx="295" cy="375" r="2.5" class="splash-particle" style="--tx: -35px; --ty: -45px;" />
                    <circle cx="310" cy="385" r="2" class="splash-particle" style="--tx: 45px; --ty: -35px;" />
                    <circle cx="300" cy="375" r="3.5" class="splash-particle" style="--tx: 0px; --ty: -60px;" />

                    <!-- Flush Ripple Rings -->
                    <circle cx="300" cy="380" r="5" class="flush-ring" />
                    <circle cx="300" cy="380" r="5" class="flush-ring" style="animation-delay: 0.2s" />
                </g>

                <!-- 5. Seat & Lid (Thick, Rounded) -->
                <g id="seat">
                    <!-- Lid (Leaning Back) -->
                    <g transform="rotate(-12, 300, 350)">
                        <!-- Lid Surface -->
                        <path d="M205,350 A95 24 0 0 0 395,350" fill="url(#ceramicBody)" stroke="#FFF" stroke-width="1"/>
                        <!-- Lid Thickness (Side View) -->
                        <path d="M205,350 A95 24 0 0 0 395,350 L395,356 A95 24 0 0 1 205,356 Z" fill="#E0E0E0" />
                        <!-- Shadow under lid -->
                        <path d="M210,350 A90 20 0 0 0 390,350" stroke="#000" stroke-width="2" opacity="0.1" fill="none" />
                    </g>
                    
                    <!-- Seat (Down) -->
                    <path d="M205,365 A95 24 0 0 0 395,365" fill="url(#ceramicBody)" stroke="#FFF" stroke-width="1"/>
                    <!-- Seat Thickness -->
                    <path d="M205,365 A95 24 0 0 0 395,365 L395,371 A95 24 0 0 1 205,371 Z" fill="#E0E0E0" />
                </g>

                <!-- 6. Tank (Shorter, Wider Proportion) -->
                <g id="tank" filter="url(#dropShadow)">
                    <!-- Tank Body -->
                    <rect x="240" y="160" width="120" height="180" rx="8" fill="url(#tankGrad)" />
                    
                    <!-- Tank Top Highlight -->
                    <rect x="240" y="160" width="120" height="8" rx="4" fill="#FFF" opacity="0.9" />
                    
                    <!-- Tank Side Highlight (Soft) -->
                    <path d="M255,170 L255,330" stroke="#FFF" stroke-width="10" opacity="0.3" stroke-linecap="round" filter="blur(3px)"/>

                    <!-- Connection Shadow (Where tank meets bowl) -->
                    <path d="M240,330 L360,330 L360,340 C360,345 355,350 350,350 L250,350 C245,350 240,345 240,340 Z" fill="#000" opacity="0.2" />
                </g>

                <!-- 7. Flush Handle (Modern Chrome Lever) -->
                <g id="handle" transform="translate(220, 240)">
                    <!-- Base Mount -->
                    <circle cx="0" cy="0" r="16" fill="url(#chromeGrad)" stroke="#888" stroke-width="1" />
                    <circle cx="0" cy="0" r="12" fill="#EEE" />
                    
                    <!-- The Lever Arm -->
                    <g class="handle-rod">
                        <!-- Shadow -->
                        <path d="M0,0 L-25,30" stroke="#000" stroke-width="8" stroke-linecap="round" opacity="0.15" transform="translate(2,2)"/>
                        <!-- Arm Body -->
                        <path d="M0,0 L-25,30" stroke="url(#chromeGrad)" stroke-width="8" stroke-linecap="round" />
                        <!-- Arm Highlight -->
                        <path d="M0,0 L-25,30" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.9" />
                    </g>
                    
                    <!-- The Knob/Button -->
                    <circle cx="-25" cy="30" r="14" fill="url(#chromeGrad)" stroke="#888" stroke-width="1" />
                    <!-- Specular Dot on Knob -->
                    <circle cx="-29" cy="26" r="4" fill="#FFF" opacity="0.9" />
                </g>

            </svg>
        </div>
    </main>

    <script>
        function triggerFlush() {
            const waterSystem = document.getElementById('water-system');
            const handleRod = document.querySelector('.handle-rod');
            
            // 1. Reset Animation Classes
            waterSystem.classList.remove('flushing');
            handleRod.classList.remove('handle-pressed');
            
            // 2. Force Reflow (Restart CSS Animation)
            void waterSystem.offsetWidth; 

            // 3. Trigger Animations
            waterSystem.classList.add('flushing');
            handleRod.classList.add('handle-pressed');

            // 4. Reset Handle Position after delay
            setTimeout(() => {
                handleRod.classList.remove('handle-pressed');
            }, 300);
        }
    </script>
</body>
</html>
