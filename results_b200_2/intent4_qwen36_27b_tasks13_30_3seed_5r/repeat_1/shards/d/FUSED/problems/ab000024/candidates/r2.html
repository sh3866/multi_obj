<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | The Silent Flush</title>
    <style>
        :root {
            --bg-wall: #F2F0EB;
            --bg-floor: #E0DED9;
            --text-primary: #1A1A1A;
            --text-secondary: #555555;
            --accent: #3E5E5E; /* Deep muted teal */
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-serif: 'Georgia', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-display);
            background-color: var(--bg-wall);
            color: var(--text-primary);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Layout --- */
        header {
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
        }

        .logo {
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            z-index: 11;
        }

        nav a {
            text-decoration: none;
            color: var(--text-secondary);
            margin-left: 2rem;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: color 0.3s;
            position: relative;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0%;
            height: 1px;
            background: var(--text-primary);
            transition: width 0.3s;
        }

        nav a:hover { color: var(--text-primary); }
        nav a:hover::after { width: 100%; }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 40% 60%;
            position: relative;
            overflow: hidden;
        }

        /* --- Background Context (Wall & Floor) --- */
        .environment {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .wall {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 70%;
            background: var(--bg-wall);
            /* Subtle wall texture */
            background-image: radial-gradient(#D6D4CF 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .floor {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 35%;
            background: var(--bg-floor);
            transform: perspective(600px) rotateX(20deg);
            transform-origin: bottom;
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        
        /* Vignette for focus */
        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 60% 50%, rgba(255,255,255,0) 40%, rgba(0,0,0,0.08) 100%);
            pointer-events: none;
            z-index: 5;
        }

        /* --- Content Column --- */
        .content-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 4rem;
            z-index: 10;
            position: relative;
        }

        .tagline {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 4.5rem;
            line-height: 0.9;
            letter-spacing: -0.03em;
            margin-bottom: 2rem;
            color: var(--text-primary);
        }

        h1 span {
            font-family: var(--font-serif);
            font-style: italic;
            font-weight: 400;
            color: var(--text-secondary);
            font-size: 0.8em;
            display: block;
            margin-top: 0.5rem;
        }

        .description {
            max-width: 300px;
            line-height: 1.6;
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 3rem;
        }

        /* Interactive UI */
        .flush-trigger {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 2rem;
            background: transparent;
            border: 1px solid var(--text-primary);
            color: var(--text-primary);
            font-family: var(--font-display);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            width: fit-content;
            position: relative;
            overflow: hidden;
        }

        .flush-trigger::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 0%; height: 100%;
            background: var(--text-primary);
            transition: width 0.3s ease;
            z-index: -1;
        }

        .flush-trigger:hover {
            color: #fff;
            border-color: var(--text-primary);
        }
        
        .flush-trigger:hover::before {
            width: 100%;
        }

        /* --- Visual Column --- */
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Align to floor */
            padding-bottom: 5%;
            position: relative;
            z-index: 2;
        }

        svg {
            width: 100%;
            height: 90%;
            /* Soft shadow for the whole SVG group */
            filter: drop-shadow(0px 20px 30px rgba(0,0,0,0.25));
        }

        /* --- SVG Animations --- */
        
        /* Handle Mechanics */
        .handle-rod {
            transform-origin: 190px 175px; /* Pivot point */
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .handle-pressed {
            transform: rotate(25deg);
        }

        /* Water Swirl */
        .water-group {
            transform-origin: 300px 305px;
        }
        
        .water-surface {
            transition: transform 0.5s ease;
        }

        .flush-ring {
            transform-origin: 300px 305px;
            opacity: 0;
            stroke: #fff;
            stroke-width: 2px;
        }

        /* Animation Classes triggered by JS */
        .flushing .flush-ring {
            animation: ripple 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        
        .flushing .water-surface {
            animation: drain 1s ease-in forwards;
        }
        
        .flushing .swirl-spiral {
            animation: spin 1s linear forwards;
        }

        @keyframes ripple {
            0% { transform: scale(0.2); opacity: 0.8; stroke-width: 3px; }
            100% { transform: scale(1.5); opacity: 0; stroke-width: 1px; }
        }

        @keyframes drain {
            0% { transform: scale(1); }
            100% { transform: scale(0.05); opacity: 0.3; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; }
            .content-side { padding: 2rem; order: 2; align-items: flex-start; }
            .visual-side { height: 50vh; order: 1; padding-bottom: 0; align-items: center; }
            h1 { font-size: 3rem; }
            .floor { display: none; } /* Simplify mobile */
            .environment { background: var(--bg-wall); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aura</div>
        <nav>
            <a href="#">Collection</a>
            <a href="#">Technology</a>
            <a href="#">Specs</a>
        </nav>
    </header>

    <main>
        <!-- Background Environment -->
        <div class="environment">
            <div class="wall"></div>
            <div class="floor"></div>
        </div>
        <div class="vignette"></div>

        <!-- Text Content -->
        <div class="content-side">
            <div class="tagline">Hydro-Acoustic Design</div>
            <h1>
                Silence.<br>
                <span>Perfected.</span>
            </h1>
            
            <p class="description">
                Experience the next evolution in sanitary design. 
                Engineered for zero-noise performance with a 
                ceramic finish that captures the light.
            </p>

            <button class="flush-trigger" onclick="triggerFlush()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2.69l5.74 5.88a6 6 0 0 1-8.48 8.48A6 6 0 0 1 5.5 13.5L12 2.69z"></path>
                    <path d="M12 2.69L5.5 9.19a6 6 0 0 0 8.48 8.48"></path>
                </svg>
                Simulate Flush
            </button>
        </div>

        <!-- Illustration -->
        <div class="visual-side">
            <svg viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg" id="toilet-svg">
                <defs>
                    <!-- Ceramic Gradient: High gloss simulation -->
                    <linearGradient id="ceramicBody" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#d0d0d0" /> 
                        <stop offset="15%" stop-color="#ffffff" /> 
                        <stop offset="85%" stop-color="#f7f7f7" /> 
                        <stop offset="100%" stop-color="#cfcfcf" /> 
                    </linearGradient>

                    <!-- Tank Gradient: Slightly flatter, top lit -->
                    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#e8e8e8" />
                        <stop offset="20%" stop-color="#ffffff" />
                        <stop offset="90%" stop-color="#f0f0f0" />
                        <stop offset="100%" stop-color="#d0d0d0" />
                    </linearGradient>

                    <!-- Chrome/Flange Gradient -->
                    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#999" />
                        <stop offset="50%" stop-color="#fff" />
                        <stop offset="100%" stop-color="#888" />
                    </linearGradient>

                    <!-- Water Depth Gradient -->
                    <radialGradient id="waterGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
                        <stop offset="40%" stop-color="#e1f5fe" stop-opacity="0.6"/>
                        <stop offset="100%" stop-color="#81d4fa" stop-opacity="0.9"/>
                    </radialGradient>

                    <!-- Floor Shadow Blur -->
                    <filter id="shadowBlur" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="15" />
                    </filter>
                </defs>

                <!-- 1. Floor Shadow (Grounding) -->
                <ellipse cx="300" cy="580" rx="140" ry="25" fill="#000" opacity="0.2" filter="url(#shadowBlur)" />
                <ellipse cx="300" cy="580" rx="100" ry="15" fill="#000" opacity="0.3" filter="url(#shadowBlur)" />

                <!-- 2. Plumbing Base (Stylized Flange) -->
                <g id="plumbing-base">
                    <!-- Pipe stub behind bowl -->
                    <rect x="275" y="520" width="50" height="60" fill="#ccc" />
                    <rect x="275" y="520" width="50" height="10" fill="#999" opacity="0.3" /> <!-- Pipe shadow -->
                    <!-- Flange Ring -->
                    <ellipse cx="300" cy="575" rx="60" ry="15" fill="url(#chromeGrad)" />
                    <ellipse cx="300" cy="575" rx="58" ry="13" fill="#333" /> <!-- Inner dark gap -->
                </g>

                <!-- 3. Main Bowl -->
                <g id="bowl">
                    <!-- Back curve -->
                    <path d="M210,320 C210,290 390,290 390,320 L380,350 C380,350 360,310 300,310 C240,310 220,350 220,350 Z" fill="#dcdcdc" />
                    
                    <!-- Main Body -->
                    <path d="M210,320 C210,320 190,570 300,570 C410,570 390,320 390,320 Z" fill="url(#ceramicBody)" />
                    
                    <!-- Gloss Highlight (Left) -->
                    <path d="M230,380 C220,450 240,550 290,560" stroke="#fff" stroke-width="15" opacity="0.7" stroke-linecap="round" fill="none" filter="blur(4px)"/>
                    <!-- Rim Highlight -->
                    <path d="M210,320 C210,320 190,570 300,570" stroke="#fff" stroke-width="2" opacity="0.5" fill="none" />
                </g>

                <!-- 4. Water System (The Action Center) -->
                <g id="water-system" class="water-group">
                    <!-- The Water Surface -->
                    <ellipse cx="300" cy="310" rx="82" ry="18" fill="url(#waterGrad)" class="water-surface" />
                    
                    <!-- The Swirl Graphic (Hidden until flush) -->
                    <path d="M300,310 Q270,290 260,310 Q250,330 280,340 Q310,350 320,320 Q330,290 300,310" 
                          fill="none" stroke="#fff" stroke-width="1" opacity="0" class="swirl-spiral" />

                    <!-- Flush Ripple Rings -->
                    <circle cx="300" cy="310" r="5" class="flush-ring" />
                    <circle cx="300" cy="310" r="5" class="flush-ring" style="animation-delay: 0.1s" />
                </g>

                <!-- 5. Seat & Lid -->
                <g id="seat">
                    <!-- Lid (Leaning Back) -->
                    <g transform="rotate(-15, 300, 300)">
                        <!-- Lid Surface -->
                        <path d="M215,300 A85 22 0 0 0 385,300" fill="url(#ceramicBody)" stroke="#fff" stroke-width="1"/>
                        <!-- Lid Thickness -->
                        <path d="M215,300 A85 22 0 0 0 385,300 L385,306 A85 22 0 0 1 215,306 Z" fill="#e0e0e0" />
                        <!-- Inner Rim -->
                        <path d="M220,300 A80 18 0 0 0 380,300" stroke="#000" stroke-width="1" opacity="0.1" fill="none" />
                    </g>
                    
                    <!-- Seat (Down) -->
                    <path d="M215,320 A85 22 0 0 0 385,320" fill="url(#ceramicBody)" stroke="#fff" stroke-width="1"/>
                    <!-- Seat Thickness -->
                    <path d="M215,320 A85 22 0 0 0 385,320 L385,326 A85 22 0 0 1 215,326 Z" fill="#e0e0e0" />
                </g>

                <!-- 6. Tank -->
                <g id="tank">
                    <!-- Tank Body -->
                    <rect x="230" y="110" width="140" height="180" rx="8" fill="url(#tankGrad)" />
                    
                    <!-- Tank Highlight (Top Edge) -->
                    <rect x="230" y="110" width="140" height="6" rx="3" fill="#fff" opacity="0.8" />
                    
                    <!-- Tank Highlight (Side) -->
                    <path d="M245,120 L245,280" stroke="#fff" stroke-width="8" opacity="0.3" stroke-linecap="round" filter="blur(2px)"/>

                    <!-- Connection Shadow -->
                    <path d="M230,280 L370,280 L370,290 C370,295 365,300 360,300 L240,300 C235,300 230,295 230,290 Z" fill="#000" opacity="0.1" />
                </g>

                <!-- 7. Flush Handle (The Hero Element) -->
                <g id="handle" transform="translate(210, 180)">
                    <!-- Base Mount -->
                    <circle cx="0" cy="0" r="12" fill="#ccc" />
                    <circle cx="0" cy="0" r="10" fill="#fff" />
                    
                    <!-- The Lever Arm -->
                    <g class="handle-rod">
                        <!-- Shadow -->
                        <path d="M0,0 L-20,25" stroke="#000" stroke-width="6" stroke-linecap="round" opacity="0.1" transform="translate(2,2)"/>
                        <!-- Arm Body -->
                        <path d="M0,0 L-20,25" stroke="url(#chromeGrad)" stroke-width="6" stroke-linecap="round" />
                        <!-- Arm Highlight -->
                        <path d="M0,0 L-20,25" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7" />
                    </g>
                    
                    <!-- The Knob/Button -->
                    <circle cx="-20" cy="25" r="10" fill="url(#chromeGrad)" stroke="#999" stroke-width="1" />
                    <!-- Specular Dot on Knob -->
                    <circle cx="-22" cy="23" r="2" fill="#fff" opacity="0.9" />
                </g>

            </svg>
        </div>
    </main>

    <script>
        function triggerFlush() {
            const waterSystem = document.getElementById('water-system');
            const handleRod = document.querySelector('.handle-rod');
            
            // 1. Reset Animation Classes
            waterSystem.classList.remove('flushing');
            handleRod.classList.remove('handle-pressed');
            
            // 2. Force Reflow (Restart CSS Animation)
            void waterSystem.offsetWidth; 

            // 3. Trigger Animations
            waterSystem.classList.add('flushing');
            handleRod.classList.add('handle-pressed');

            // 4. Reset Handle Position
            setTimeout(() => {
                handleRod.classList.remove('handle-pressed');
            }, 250);
        }
    </script>
</body>
</html>
