<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | The Silent Flush</title>
    <style>
        :root {
            /* Palette: Refined Stone & Porcelain */
            --bg-wall-top: #F4F4F2;
            --bg-wall-bot: #EBEBE7;
            --bg-floor: #DCDCD8;
            --text-primary: #111111;
            --text-secondary: #666666;
            --accent: #2C3E50;
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-serif: 'Georgia', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-display);
            background-color: var(--bg-wall-top);
            color: var(--text-primary);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Environment / Context --- */
        .environment {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .wall {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 65%;
            background: linear-gradient(to bottom, var(--bg-wall-top), var(--bg-wall-bot));
            /* Subtle Noise Texture for Wall */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }

        .floor {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 40%;
            background: var(--bg-floor);
            /* Marble-like subtle veining via gradient */
            background-image: 
                linear-gradient(120deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 20%, rgba(0,0,0,0.02) 50%, rgba(255,255,255,0) 80%, rgba(255,255,255,0.3) 100%);
            transform: perspective(800px) rotateX(40deg);
            transform-origin: bottom center;
            border-top: 1px solid rgba(0,0,0,0.05);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.1);
        }

        /* --- Layout --- */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 35% 65%; /* Text gets less space, Product gets more */
            position: relative;
            z-index: 1;
            height: 100%;
        }

        /* --- Content Column (Minimal UI) --- */
        .content-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 4rem;
            position: relative;
        }

        .tagline {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 1.5rem;
            border-left: 2px solid var(--text-primary);
            padding-left: 1rem;
        }

        h1 {
            font-size: 5rem;
            line-height: 0.95;
            letter-spacing: -0.03em;
            margin-bottom: 2.5rem;
            color: var(--text-primary);
        }

        h1 span {
            font-family: var(--font-serif);
            font-style: italic;
            font-weight: 400;
            color: var(--text-secondary);
            font-size: 0.7em;
            display: block;
            margin-top: 0.5rem;
        }

        .description {
            max-width: 320px;
            line-height: 1.7;
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 4rem;
            font-weight: 300;
        }

        /* Interactive UI */
        .flush-trigger {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            padding: 1.2rem 2.5rem;
            background: var(--text-primary);
            border: 1px solid var(--text-primary);
            color: #fff;
            font-family: var(--font-display);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            width: fit-content;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .flush-trigger:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            background: #000;
        }

        /* --- Visual Column (Hero) --- */
        .visual-side {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 8vh; /* Lift slightly off bottom */
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
            max-height: 85vh;
            overflow: visible;
        }

        /* --- SVG Styles & Animations --- */
        
        /* Handle Mechanics */
        .handle-rod {
            transform-origin: 0px 0px; /* Set in SVG group translate */
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .handle-pressed {
            transform: rotate(30deg);
        }

        /* Water System */
        .water-surface {
            transform-origin: 300px 315px;
            transition: transform 0.3s ease;
        }

        .flush-ring {
            transform-origin: 300px 315px;
            opacity: 0;
            stroke: #fff;
            stroke-width: 3px;
            fill: none;
        }

        /* Splash Particles */
        .splash-particle {
            opacity: 0;
            fill: #fff;
        }

        /* Animation Classes triggered by JS */
        .flushing .flush-ring {
            animation: ripple 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        
        .flushing .water-surface {
            animation: drain 1.2s ease-in forwards;
        }

        .flushing .splash-particle {
            animation: splash 0.6s ease-out forwards;
        }

        @keyframes ripple {
            0% { transform: scale(0.1); opacity: 0.9; stroke-width: 4px; }
            100% { transform: scale(2.5); opacity: 0; stroke-width: 1px; }
        }
        
        @keyframes drain {
            0% { transform: scale(1); }
            10% { transform: scale(1.05); } /* Slight swell before drain */
            100% { transform: scale(0.05); opacity: 0.5; }
        }

        @keyframes splash {
            0% { transform: translate(0,0) scale(0.5); opacity: 0.8; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; }
            .content-side { 
                padding: 2rem; 
                order: 2; 
                align-items: flex-start; 
                background: linear-gradient(to bottom, rgba(244,244,242,0.9), rgba(244,244,242,0));
            }
            .visual-side { 
                height: 50vh; 
                order: 1; 
                padding-bottom: 0; 
                align-items: center; 
                transform: scale(0.8);
            }
            h1 { font-size: 3rem; }
            .floor { display: none; } 
            .wall { height: 100%; }
        }
    </style>
</head>
<body>

    <!-- Background Environment -->
    <div class="environment">
        <div class="wall"></div>
        <div class="floor"></div>
    </div>

    <main>
        <!-- Text Content -->
        <div class="content-side">
            <div class="tagline">Hydro-Acoustic Design</div>
            <h1>
                Silence.<br>
                <span>Perfected.</span>
            </h1>
            
            <p class="description">
                Experience the next evolution in sanitary design. 
                Engineered for zero-noise performance with a 
                ceramic finish that captures the light.
            </p>

            <button class="flush-trigger" onclick="triggerFlush()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2.69l5.74 5.88a6 6 0 0 1-8.48 8.48A6 6 0 0 1 5.5 13.5L12 2.69z"></path>
                    <path d="M12 2.69L5.5 9.19a6 6 0 0 0 8.48 8.48"></path>
                </svg>
                Simulate Flush
            </button>
        </div>

        <!-- Illustration -->
        <div class="visual-side">
            <!-- SVG Illustration: High Detail, Realistic Materials -->
            <svg viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg" id="toilet-svg">
                <defs>
                    <!-- Ceramic Body Gradient: Multi-stop for volume -->
                    <linearGradient id="ceramicBody" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#d0d0d0" /> 
                        <stop offset="15%" stop-color="#ffffff" /> 
                        <stop offset="50%" stop-color="#fdfdfd" /> 
                        <stop offset="85%" stop-color="#f7f7f7" /> 
                        <stop offset="100%" stop-color="#cfcfcf" /> 
                    </linearGradient>

                    <!-- Tank Gradient: Top-lit, slightly cooler -->
                    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#e0e0e0" />
                        <stop offset="20%" stop-color="#ffffff" />
                        <stop offset="80%" stop-color="#f0f0f0" />
                        <stop offset="100%" stop-color="#dcdcdc" />
                    </linearGradient>

                    <!-- Chrome/Flange Gradient: Metallic reflection -->
                    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#888" />
                        <stop offset="20%" stop-color="#fff" />
                        <stop offset="50%" stop-color="#aaa" />
                        <stop offset="80%" stop-color="#fff" />
                        <stop offset="100%" stop-color="#666" />
                    </linearGradient>

                    <!-- Water Depth Gradient: Semi-transparent layers -->
                    <radialGradient id="waterGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
                        <stop offset="60%" stop-color="#e1f5fe" stop-opacity="0.6"/>
                        <stop offset="100%" stop-color="#81d4fa" stop-opacity="0.85"/>
                    </radialGradient>

                    <!-- Drop Shadow Filter -->
                    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
                        <feOffset dx="0" dy="15" result="offsetblur" />
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.2" />
                        </feComponentTransfer>
                        <feMerge> 
                            <feMergeNode />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                </defs>

                <!-- 1. Floor Shadow -->
                <ellipse cx="300" cy="580" rx="150" ry="35" fill="#000" opacity="0.15" filter="blur(10px)" />

                <!-- 2. Plumbing Base (Trapway/Flange) -->
                <g id="plumbing-base">
                    <!-- Pipe connection behind bowl -->
                    <rect x="270" y="530" width="60" height="50" fill="#b0b0b0" rx="4" />
                    <!-- Flange Ring (Chrome) -->
                    <ellipse cx="300" cy="575" rx="70" ry="18" fill="url(#chromeGrad)" />
                    <!-- Rubber Gasket (Dark) -->
                    <ellipse cx="300" cy="575" rx="65" ry="16" fill="#333" />
                    <!-- Floor Connection -->
                    <ellipse cx="300" cy="575" rx="60" ry="14" fill="#222" />
                </g>

                <!-- 3. Main Bowl -->
                <g id="bowl" filter="url(#dropShadow)">
                    <!-- Back curve (Shadowed area) -->
                    <path d="M220,330 C220,300 380,300 380,330 L375,360 C375,360 350,320 300,320 C250,320 225,360 225,360 Z" fill="#dcdcdc" />
                    
                    <!-- Main Body (Front) -->
                    <path d="M220,330 C220,330 200,570 300,570 C400,570 380,330 380,330 Z" fill="url(#ceramicBody)" />
                    
                    <!-- Gloss Highlight (Left Edge) -->
                    <path d="M235,380 C225,450 245,550 290,560" stroke="#fff" stroke-width="12" opacity="0.8" stroke-linecap="round" fill="none" filter="blur(3px)"/>
                    
                    <!-- Rim Highlight (Top) -->
                    <path d="M220,330 C220,330 200,570 300,570" stroke="#fff" stroke-width="2" opacity="0.6" fill="none" />
                </g>

                <!-- 4. Water System (The Action Center) -->
                <g id="water-system" class="water-group">
                    <!-- The Water Surface -->
                    <ellipse cx="300" cy="315" rx="82" ry="18" fill="url(#waterGrad)" class="water-surface" />
                    
                    <!-- Inner Reflection -->
                    <ellipse cx="300" cy="315" rx="70" ry="14" fill="none" stroke="#fff" stroke-width="1" opacity="0.5" />

                    <!-- Splash Particles (Hidden initially) -->
                    <circle cx="290" cy="310" r="3" class="splash-particle" style="--tx: -30px; --ty: -40px;" />
                    <circle cx="310" cy="310" r="2" class="splash-particle" style="--tx: 40px; --ty: -30px;" />
                    <circle cx="300" cy="310" r="4" class="splash-particle" style="--tx: 0px; --ty: -50px;" />

                    <!-- Flush Ripple Rings -->
                    <circle cx="300" cy="315" r="5" class="flush-ring" />
                    <circle cx="300" cy="315" r="5" class="flush-ring" style="animation-delay: 0.15s" />
                </g>

                <!-- 5. Seat & Lid -->
                <g id="seat">
                    <!-- Lid (Leaning Back) -->
                    <g transform="rotate(-15, 300, 300)">
                        <!-- Lid Surface -->
                        <path d="M215,300 A85 22 0 0 0 385,300" fill="url(#ceramicBody)" stroke="#fff" stroke-width="1"/>
                        <!-- Lid Thickness -->
                        <path d="M215,300 A85 22 0 0 0 385,300 L385,306 A85 22 0 0 1 215,306 Z" fill="#e0e0e0" />
                        <!-- Inner Rim Shadow -->
                        <path d="M220,300 A80 18 0 0 0 380,300" stroke="#000" stroke-width="1" opacity="0.1" fill="none" />
                    </g>
                    
                    <!-- Seat (Down) -->
                    <path d="M215,320 A85 22 0 0 0 385,320" fill="url(#ceramicBody)" stroke="#fff" stroke-width="1"/>
                    <!-- Seat Thickness -->
                    <path d="M215,320 A85 22 0 0 0 385,320 L385,326 A85 22 0 0 1 215,326 Z" fill="#e0e0e0" />
                </g>

                <!-- 6. Tank -->
                <g id="tank" filter="url(#dropShadow)">
                    <!-- Tank Body -->
                    <rect x="230" y="110" width="140" height="180" rx="10" fill="url(#tankGrad)" />
                    
                    <!-- Tank Highlight (Top Edge) -->
                    <rect x="230" y="110" width="140" height="6" rx="3" fill="#fff" opacity="0.9" />
                    
                    <!-- Tank Highlight (Side) -->
                    <path d="M245,120 L245,280" stroke="#fff" stroke-width="8" opacity="0.4" stroke-linecap="round" filter="blur(2px)"/>

                    <!-- Connection Shadow -->
                    <path d="M230,280 L370,280 L370,290 C370,295 365,300 360,300 L240,300 C235,300 230,295 230,290 Z" fill="#000" opacity="0.15" />
                </g>

                <!-- 7. Flush Handle (Redesigned: Metallic & Distinct) -->
                <g id="handle" transform="translate(210, 180)">
                    <!-- Base Mount -->
                    <circle cx="0" cy="0" r="14" fill="url(#chromeGrad)" stroke="#999" stroke-width="1" />
                    <circle cx="0" cy="0" r="11" fill="#eee" />
                    
                    <!-- The Lever Arm -->
                    <g class="handle-rod">
                        <!-- Shadow -->
                        <path d="M0,0 L-22,28" stroke="#000" stroke-width="6" stroke-linecap="round" opacity="0.15" transform="translate(2,2)"/>
                        <!-- Arm Body -->
                        <path d="M0,0 L-22,28" stroke="url(#chromeGrad)" stroke-width="6" stroke-linecap="round" />
                        <!-- Arm Highlight -->
                        <path d="M0,0 L-22,28" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
                    </g>
                    
                    <!-- The Knob/Button -->
                    <circle cx="-22" cy="28" r="12" fill="url(#chromeGrad)" stroke="#888" stroke-width="1" />
                    <!-- Specular Dot on Knob -->
                    <circle cx="-25" cy="25" r="3" fill="#fff" opacity="0.9" />
                </g>

            </svg>
        </div>
    </main>

    <script>
        function triggerFlush() {
            const waterSystem = document.getElementById('water-system');
            const handleRod = document.querySelector('.handle-rod');
            
            // 1. Reset Animation Classes
            waterSystem.classList.remove('flushing');
            handleRod.classList.remove('handle-pressed');
            
            // 2. Force Reflow (Restart CSS Animation)
            void waterSystem.offsetWidth; 

            // 3. Trigger Animations
            waterSystem.classList.add('flushing');
            handleRod.classList.add('handle-pressed');

            // 4. Reset Handle Position
            setTimeout(() => {
                handleRod.classList.remove('handle-pressed');
            }, 250);
        }
    </script>
</body>
</html>
