<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trifolium repens | Botanical Study</title>
    <style>
        :root {
            --bg-color: #EBEAE5; /* Warm, paper-like off-white */
            --ink-color: #2C332F; /* Deep organic charcoal/green */
            --accent-color: #A83F3F; /* Muted botanical red */
            --line-color: rgba(44, 51, 47, 0.25);
            
            --font-serif: "Georgia", "Times New Roman", serif;
            --font-mono: "Courier New", Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--ink-color);
            font-family: var(--font-serif);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Subtle Paper Grain */
        .grain-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
            opacity: 0.4;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.5'/%3E%3C/svg%3E");
            mix-blend-mode: multiply;
        }

        /* Layout Container */
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Typography */
        .header-block {
            position: absolute;
            top: 4rem;
            left: 5rem;
            z-index: 20;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 400;
            font-style: italic;
            letter-spacing: -0.02em;
            line-height: 1;
            margin-bottom: 0.5rem;
            color: var(--ink-color);
        }

        .subtitle {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent-color);
            border-top: 1px solid var(--accent-color);
            padding-top: 0.5rem;
            display: inline-block;
        }

        /* Data Panel */
        .data-panel {
            position: absolute;
            bottom: 4rem;
            right: 5rem;
            width: 260px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            line-height: 1.6;
            color: #4a554d;
            z-index: 20;
            text-align: right;
        }

        .data-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 0.25rem;
        }
        
        .data-val {
            font-weight: bold;
            color: var(--ink-color);
            margin-right: 1rem;
        }

        /* SVG Container */
        .specimen-view {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0; left: 0;
        }

        svg#clover-svg {
            height: 90vh;
            width: auto;
            overflow: visible;
            /* Soft, realistic shadow for the whole plant */
            filter: drop-shadow(0px 25px 35px rgba(44, 51, 47, 0.15));
        }

        /* Annotations */
        .annotation-line {
            stroke: var(--ink-color);
            stroke-width: 0.5px;
            stroke-dasharray: 2, 3; /* Dashed style per critique */
            opacity: 0.4;
            fill: none;
        }
        
        .annotation-dot {
            fill: var(--ink-color);
            opacity: 0.6;
        }

        .annotation-text {
            font-family: var(--font-mono);
            font-size: 9px;
            fill: var(--ink-color);
            opacity: 0.8;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* Scale Bar */
        .scale-bar-container {
            position: absolute;
            bottom: 4rem;
            left: 5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            z-index: 20;
        }
        .scale-line {
            width: 80px;
            height: 1px;
            background: var(--ink-color);
            position: relative;
            opacity: 0.6;
        }
        .scale-line::before, .scale-line::after {
            content: '';
            position: absolute;
            top: -4px;
            width: 1px;
            height: 9px;
            background: var(--ink-color);
        }
        .scale-line::before { left: 0; }
        .scale-line::after { right: 0; }

        .scale-text {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            opacity: 0.7;
        }

        @media (max-width: 900px) {
            .header-block { top: 2rem; left: 2rem; }
            h1 { font-size: 2.5rem; }
            .data-panel { bottom: 2rem; right: 2rem; }
            .scale-bar-container { bottom: 2rem; left: 2rem; }
        }
    </style>
</head>
<body>

    <div class="grain-overlay"></div>

    <div class="container">
        
        <div class="header-block">
            <h1>Trifolium repens</h1>
            <div class="subtitle">Specimen Study</div>
        </div>

        <div class="specimen-view">
            <!-- 
                SVG Canvas 
                viewBox adjusted to center the plant naturally.
            -->
            <svg id="clover-svg" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- 
                      1. Gradients for Leaflets 
                      Radial gradients centered near the base to simulate light hitting the convex surface
                    -->
                    <radialGradient id="leafGradCenter" cx="50%" cy="80%" r="100%" fx="50%" fy="80%">
                        <stop offset="0%" style="stop-color:#8FB88D;stop-opacity:1" /> <!-- Light hit near stem -->
                        <stop offset="40%" style="stop-color:#608D5E;stop-opacity:1" /> <!-- Mid-tone green -->
                        <stop offset="80%" style="stop-color:#40663E;stop-opacity:1" /> <!-- Shadow towards tip -->
                        <stop offset="100%" style="stop-color:#2E4A2C;stop-opacity:1" /> <!-- Deep shadow edge -->
                    </radialGradient>

                    <radialGradient id="leafGradLeft" cx="60%" cy="80%" r="100%" fx="60%" fy="80%">
                        <stop offset="0%" style="stop-color:#7EA87C;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#527A4D;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#2F4A2D;stop-opacity:1" />
                    </radialGradient>

                    <radialGradient id="leafGradRight" cx="40%" cy="80%" r="100%" fx="40%" fy="80%">
                        <stop offset="0%" style="stop-color:#7EA87C;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#527A4D;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#2F4A2D;stop-opacity:1" />
                    </radialGradient>

                    <!-- 
                      2. Cylindrical Stem Gradient 
                    -->
                    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#3A5737;stop-opacity:1" />
                        <stop offset="30%" style="stop-color:#65915F;stop-opacity:1" /> <!-- Highlight -->
                        <stop offset="70%" style="stop-color:#486B45;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#2A3D29;stop-opacity:1" />
                    </linearGradient>

                    <!-- Filter for organic edge roughness (Serration) -->
                    <filter id="organicRoughness" x="-10%" y="-10%" width="120%" height="120%">
                        <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise" />
                        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" />
                    </filter>

                    <!-- Filter for Vein Texture -->
                    <filter id="veinTexture">
                        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" />
                        <feDisplacementMap in="SourceGraphic" in2="noise" scale="1" />
                    </filter>
                </defs>

                <!-- Main Plant Group -->
                <g id="plant-group">
                    
                    <!-- 
                      Stem 
                      Smooth S-Curve using Cubic Beziers
                    -->
                    <path d="M 400,750 C 400,600 320,500 400,400" 
                          fill="none" 
                          stroke="url(#stemGrad)" 
                          stroke-width="12" 
                          stroke-linecap="round" />

                    <!-- 
                      Leaflets 
                      Constructed using smooth Bezier curves to form a true Cordate (Heart) shape.
                      The path includes small jagged lines along the curves to simulate serration.
                    -->

                    <!-- Center Leaflet -->
                    <g transform="translate(400, 400) rotate(5)">
                        <!-- Main Shape -->
                        <path d="M 0,0 
                                 C -10,-40 -50,-60 -60,-90 
                                 L -65,-92 L -62,-98 
                                 L -68,-102 L -60,-110 
                                 L -65,-115 L -55,-120 
                                 C -30,-135 0,-145 0,-145 
                                 C 0,-145 30,-135 55,-120 
                                 L 65,-115 L 60,-110 
                                 L 68,-102 L 62,-98 
                                 L 65,-92 L 60,-90 
                                 C 50,-60 10,-40 0,0 Z" 
                              fill="url(#leafGradCenter)" 
                              filter="url(#organicRoughness)"
                              stroke="#2E4A2C" stroke-width="0.5"/>
                        
                        <!-- Veins: Delicate, curved, low opacity -->
                        <g fill="none" stroke="#A8C4A6" stroke-width="1.2" opacity="0.5" stroke-linecap="round" filter="url(#veinTexture)">
                            <!-- Midrib -->
                            <path d="M 0,-5 Q 5,-70 0,-135" />
                            <!-- Secondary Veins (Left) -->
                            <path d="M 0,-30 Q -20,-40 -40,-50" />
                            <path d="M -10,-50 Q -25,-60 -45,-70" />
                            <path d="M -20,-80 Q -30,-90 -50,-100" />
                            <!-- Secondary Veins (Right) -->
                            <path d="M 0,-30 Q 20,-40 40,-50" />
                            <path d="M 10,-50 Q 25,-60 45,-70" />
                            <path d="M 20,-80 Q 30,-90 50,-100" />
                        </g>

                        <!-- Chlorotic V-Mark (White marking) -->
                        <path d="M 0,-30 L -12,-55 L 0,-45 L 12,-55 Z" fill="#E8F0E8" opacity="0.4" transform="translate(0, -10) scale(1.1)"/>
                    </g>

                    <!-- Left Leaflet -->
                    <g transform="translate(385, 420) rotate(-65)">
                        <path d="M 0,0 
                                 C -10,-40 -50,-60 -60,-90 
                                 L -65,-92 L -62,-98 
                                 L -68,-102 L -60,-110 
                                 L -65,-115 L -55,-120 
                                 C -30,-135 0,-145 0,-145 
                                 C 0,-145 30,-135 55,-120 
                                 L 65,-115 L 60,-110 
                                 L 68,-102 L 62,-98 
                                 L 65,-92 L 60,-90 
                                 C 50,-60 10,-40 0,0 Z" 
                              fill="url(#leafGradLeft)" 
                              filter="url(#organicRoughness)"
                              stroke="#2E4A2C" stroke-width="0.5"/>
                        
                        <g fill="none" stroke="#A8C4A6" stroke-width="1.2" opacity="0.5" stroke-linecap="round" filter="url(#veinTexture)">
                            <path d="M 0,-5 Q 5,-70 0,-135" />
                            <path d="M 0,-30 Q -20,-40 -40,-50" />
                            <path d="M 0,-30 Q 20,-40 40,-50" />
                        </g>
                        
                        <path d="M 0,-30 L -12,-55 L 0,-45 L 12,-55 Z" fill="#E8F0E8" opacity="0.4" transform="translate(0, -10) scale(1.1)"/>
                    </g>

                    <!-- Right Leaflet -->
                    <g transform="translate(415, 420) rotate(65)">
                        <path d="M 0,0 
                                 C -10,-40 -50,-60 -60,-90 
                                 L -65,-92 L -62,-98 
                                 L -68,-102 L -60,-110 
                                 L -65,-115 L -55,-120 
                                 C -30,-135 0,-145 0,-145 
                                 C 0,-145 30,-135 55,-120 
                                 L 65,-115 L 60,-110 
                                 L 68,-102 L 62,-98 
                                 L 65,-92 L 60,-90 
                                 C 50,-60 10,-40 0,0 Z" 
                              fill="url(#leafGradRight)" 
                              filter="url(#organicRoughness)"
                              stroke="#2E4A2C" stroke-width="0.5"/>
                        
                        <g fill="none" stroke="#A8C4A6" stroke-width="1.2" opacity="0.5" stroke-linecap="round" filter="url(#veinTexture)">
                            <path d="M 0,-5 Q 5,-70 0,-135" />
                            <path d="M 0,-30 Q -20,-40 -40,-50" />
                            <path d="M 0,-30 Q 20,-40 40,-50" />
                        </g>

                        <path d="M 0,-30 L -12,-55 L 0,-45 L 12,-55 Z" fill="#E8F0E8" opacity="0.4" transform="translate(0, -10) scale(1.1)"/>
                    </g>

                    <!-- Small stem node detail -->
                    <path d="M 385,420 Q 400,430 415,420" fill="none" stroke="#2E4A2C" stroke-width="1" opacity="0.5"/>
                </g>

                <!-- Scientific Annotations -->
                <g class="annotation-group">
                    <!-- 1. Serration Leader -->
                    <path class="annotation-line" d="M 360,280 L 280,240 L 180,240" />
                    <circle cx="360" cy="280" class="annotation-dot" r="2" />
                    <text x="175" y="243" class="annotation-text" text-anchor="end">SERRATION</text>

                    <!-- 2. Vein Leader -->
                    <path class="annotation-line" d="M 405,310 L 480,280 L 580,280" />
                    <circle cx="405" cy="310" class="annotation-dot" r="2" />
                    <text x="585" y="283" class="annotation-text" text-anchor="start">PENNATE VEINS</text>

                    <!-- 3. V-Mark Leader -->
                    <path class="annotation-line" d="M 400,250 L 400,180 L 460,160" />
                    <circle cx="400" cy="250" class="annotation-dot" r="2" />
                    <text x="465" y="163" class="annotation-text" text-anchor="start">CHLOROTIC MARK</text>
                </g>
            </svg>
        </div>

        <div class="scale-bar-container">
            <div class="scale-line"></div>
            <span class="scale-text">5.0 cm</span>
        </div>

        <div class="data-panel">
            <div class="data-row">
                <span class="data-val">FABACEAE</span>
                <span class="data-label">FAMILY</span>
            </div>
            <div class="data-row">
                <span class="data-val">TRIFOLIUM</span>
                <span class="data-label">GENUS</span>
            </div>
            <div class="data-row">
                <span class="data-val">EUROPA</span>
                <span class="data-label">ORIGIN</span>
            </div>
            <div class="data-row" style="margin-top: 1rem;">
                <span class="data-val">C3</span>
                <span class="data-label">PHOTOSYNTHESIS</span>
            </div>
            <div class="data-row">
                <span class="data-val">AEROBIC</span>
                <span class="data-label">N2 FIXATION</span>
            </div>
            <div style="margin-top: 1.5rem; font-size: 0.65rem; opacity: 0.6; line-height: 1.4; text-align: right;">
                Field Note: Specimen collected in partial shade. Leaflet coloration indicates high Chlorophyll A/B ratio.
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const plantGroup = document.getElementById('plant-group');
            const svg = document.getElementById('clover-svg');
            const container = document.querySelector('.container');

            // Parallax Interaction
            // Moves the plant slightly opposite to mouse movement to create depth
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth - e.pageX * 2) / 100;
                const y = (window.innerHeight - e.pageY * 2) / 100;
                
                // Apply transform with a subtle sway
                // We use translate3d for performance
                plantGroup.style.transform = `translate3d(${x}px, ${y}px, 0) rotate(${x * 0.05}deg)`;
            });
        });
    </script>
</body>
</html>
