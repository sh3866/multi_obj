<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trifolium repens | Detailed Study</title>
    <style>
        :root {
            --bg-color: #F2F0E9;
            --bg-gradient: radial-gradient(circle at center, #fcfaf2 0%, #e8e6de 100%);
            --ink-color: #2A332D;
            --accent-color: #B84B4B;
            --grid-color: rgba(42, 51, 45, 0.06);
            
            --font-serif: "Georgia", "Times New Roman", serif;
            --font-mono: "Courier New", Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            color: var(--ink-color);
            font-family: var(--font-serif);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Paper Texture */
        .texture {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.4;
            pointer-events: none;
            z-index: 10;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.5'/%3E%3C/svg%3E");
        }

        /* Subtle Grid */
        .grid-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: 60px 60px;
            background-image: 
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            z-index: 0;
        }

        /* Layout Container */
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Typography & Layout Elements */
        .header-block {
            position: absolute;
            top: 4rem;
            left: 4rem;
            z-index: 5;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: normal;
            letter-spacing: -0.02em;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent-color);
        }

        /* Refined Data Panel (Bottom Right) */
        .data-panel {
            position: absolute;
            bottom: 4rem;
            right: 4rem;
            width: 220px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            line-height: 1.5;
            color: #556;
            z-index: 5;
            border-top: 1px solid rgba(42, 51, 45, 0.2);
            padding-top: 1rem;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.25rem;
        }
        .data-label { opacity: 0.6; }

        /* Main SVG Container */
        .specimen-view {
            width: 80vw;
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        svg#clover-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.15));
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Scientific Annotations */
        .annotation-group {
            pointer-events: none;
        }
        
        .annotation-line {
            stroke: var(--ink-color);
            stroke-width: 0.5px;
            opacity: 0.3;
            fill: none;
        }
        
        .annotation-dot {
            fill: var(--accent-color);
            opacity: 0.8;
        }

        .annotation-text {
            font-family: var(--font-mono);
            font-size: 10px;
            fill: var(--ink-color);
            opacity: 0.7;
            letter-spacing: 0.05em;
        }

        /* Scale Bar */
        .scale-bar-container {
            position: absolute;
            bottom: 4rem;
            left: 4rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .scale-line {
            width: 60px;
            height: 1px;
            background: var(--ink-color);
            position: relative;
        }
        .scale-line::before, .scale-line::after {
            content: '';
            position: absolute;
            top: -3px;
            width: 1px;
            height: 7px;
            background: var(--ink-color);
        }
        .scale-line::before { left: 0; }
        .scale-line::after { right: 0; }

        .scale-text {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            opacity: 0.6;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .header-block { top: 2rem; left: 2rem; }
            .data-panel { bottom: 2rem; right: 2rem; width: auto; }
            .scale-bar-container { bottom: 2rem; left: 2rem; }
            h1 { font-size: 1.8rem; }
            .specimen-view { width: 95vw; height: 60vh; }
        }
    </style>
</head>
<body>

    <div class="texture"></div>
    <div class="grid-bg"></div>

    <div class="container">
        
        <div class="header-block">
            <h1>Trifolium repens</h1>
            <div class="subtitle">Specimen #402-B</div>
        </div>

        <div class="specimen-view">
            <!-- High Detail SVG Canvas -->
            <svg id="clover-svg" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Complex Leaf Gradient: Light source from top-left -->
                    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="80%" y2="100%">
                        <stop offset="0%" style="stop-color:#A4C49B;stop-opacity:1" /> <!-- Highlight -->
                        <stop offset="30%" style="stop-color:#6B9668;stop-opacity:1" /> <!-- Midtone -->
                        <stop offset="70%" style="stop-color:#4A7047;stop-opacity:1" /> <!-- Shadow -->
                        <stop offset="100%" style="stop-color:#2E4A2C;stop-opacity:1" /> <!-- Deep Shadow -->
                    </linearGradient>
                    
                    <!-- Stem Gradient -->
                    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#3E563C;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#5A7D57;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#3E563C;stop-opacity:1" />
                    </linearGradient>

                    <!-- Vein Filter for organic texture -->
                    <filter id="roughen">
                        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
                        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
                    </filter>

                    <!-- Drop shadow for leaf depth -->
                    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#1a2e1a" flood-opacity="0.3"/>
                    </filter>

                    <!-- Reusable Detailed Leaflet -->
                    <g id="leaflet">
                        <!-- 
                          Path Logic: 
                          Start at stem (0,0). 
                          Curve up left to tip, curve down right to stem. 
                          Includes serrations (jagged edges) along the perimeter.
                        -->
                        <path d="M 0,0 
                                 C -15,-20 -35,-30 -45,-50 
                                 L -52,-50 L -48,-58 
                                 L -56,-62 L -50,-70 
                                 L -55,-75 L -45,-80 
                                 L -48,-88 L -35,-90 
                                 C -20,-95 0,-100 0,-100 
                                 C 20,-95 35,-90 48,-88 
                                 L 45,-80 L 55,-75 
                                 L 50,-70 L 56,-62 
                                 L 48,-58 L 52,-50 
                                 L 45,-50 
                                 C 35,-30 15,-20 0,0 Z" 
                              fill="url(#leafGrad)" stroke="#2E4A2C" stroke-width="0.5" stroke-linejoin="round"/>
                        
                        <!-- White 'V' Marking (Chlorotic pattern) -->
                        <path d="M 0,-20 L -10,-40 L 0,-35 L 10,-40 Z" fill="#E8F4E6" opacity="0.4" transform="scale(1.2) translate(-10, -20)"/>

                        <!-- Central Vein (Rachis) -->
                        <path d="M 0,-5 L 0,-95" stroke="#C5DCC4" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                        
                        <!-- Secondary Veins (Procedural branching) -->
                        <g fill="none" stroke="#C5DCC4" stroke-width="1" stroke-linecap="round" opacity="0.5">
                            <!-- Left Side -->
                            <path d="M 0,-25 Q -15,-25 -25,-35" />
                            <path d="M -12,-30 Q -20,-20 -28,-20" />
                            
                            <path d="M 0,-50 Q -20,-50 -35,-55" />
                            <path d="M -15,-55 Q -25,-40 -30,-38" />
                            
                            <path d="M 0,-75 Q -15,-75 -20,-80" />
                            
                            <!-- Right Side -->
                            <path d="M 0,-25 Q 15,-25 25,-35" />
                            <path d="M 12,-30 Q 20,-20 28,-20" />
                            
                            <path d="M 0,-50 Q 20,-50 35,-55" />
                            <path d="M 15,-55 Q 25,-40 30,-38" />
                            
                            <path d="M 0,-75 Q 15,-75 20,-80" />
                        </g>
                    </g>
                </defs>

                <!-- Main Plant Group -->
                <g id="plant-group" transform="translate(400, 700)">
                    
                    <!-- Stem -->
                    <!-- S-curve for natural organic feel -->
                    <path d="M 0,0 C -20,-100 -80,-200 0,-350" fill="none" stroke="url(#stemGrad)" stroke-width="8" stroke-linecap="round" filter="url(#roughen)"/>
                    
                    <!-- Leaflets arranged in a tri-foliate pattern -->
                    <!-- Center Leaf (Dominant) -->
                    <g transform="translate(0, -350) rotate(0) scale(1.3)">
                        <use href="#leaflet" filter="url(#leafShadow)"/>
                    </g>
                    
                    <!-- Left Leaf -->
                    <g transform="translate(0, -350) rotate(-70) translate(-20, -10) scale(1.1) rotate(10)">
                        <use href="#leaflet" filter="url(#leafShadow)"/>
                    </g>
                    
                    <!-- Right Leaf -->
                    <g transform="translate(0, -350) rotate(70) translate(20, -10) scale(1.1) rotate(-10)">
                        <use href="#leaflet" filter="url(#leafShadow)"/>
                    </g>

                    <!-- Stem attachment node -->
                    <circle cx="0" cy="-350" r="4" fill="#2E4A2C" />
                </g>

                <!-- Scientific Annotations (Static) -->
                <g class="annotation-group">
                    <!-- Annotation 1: Serration -->
                    <path class="annotation-line" d="M 280,380 L 200,320 L 150,320" />
                    <circle cx="280" cy="380" class="annotation-dot" r="2" />
                    <text x="145" y="323" class="annotation-text" text-anchor="end">MARGINAL SERRATION</text>

                    <!-- Annotation 2: Veins -->
                    <path class="annotation-line" d="M 400,300 L 480,250 L 550,250" />
                    <circle cx="400" cy="300" class="annotation-dot" r="2" />
                    <text x="555" y="253" class="annotation-text" text-anchor="start">PENNATE VEINATION</text>

                    <!-- Annotation 3: V-Mark -->
                    <path class="annotation-line" d="M 400,250 L 400,180 L 450,150" />
                    <circle cx="400" cy="250" class="annotation-dot" r="2" />
                    <text x="455" y="153" class="annotation-text" text-anchor="start">CHLOROTIC V-MARK</text>
                </g>
            </svg>
        </div>

        <div class="scale-bar-container">
            <div class="scale-line"></div>
            <span class="scale-text">5 cm</span>
        </div>

        <div class="data-panel">
            <div class="data-row">
                <span class="data-label">FAMILY</span>
                <span>FABACEAE</span>
            </div>
            <div class="data-row">
                <span class="data-label">GENUS</span>
                <span>TRIFOLIUM</span>
            </div>
            <div class="data-row">
                <span class="data-label">ORIGIN</span>
                <span>EUROPA</span>
            </div>
            <div class="data-row" style="margin-top: 1rem;">
                <span class="data-label">PHOTOSYNTHESIS</span>
                <span>C3 TYPE</span>
            </div>
            <div class="data-row">
                <span class="data-label">NITROGEN FIXATION</span>
                <span>AEROBIC</span>
            </div>
            <div style="margin-top: 1rem; font-size: 0.6rem; opacity: 0.5; line-height: 1.4;">
                FIELD NOTES: SPECIMEN COLLECTED IN PARTIAL SHADE. LEAFLET COLORATION INDICATES HIGH CHLOROPHYLL A/B RATIO.
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.querySelector('.container');
            const plantGroup = document.getElementById('plant-group');
            const svg = document.getElementById('clover-svg');

            // Parallax Effect
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth - e.pageX * 2) / 80;
                const y = (window.innerHeight - e.pageY * 2) / 80;
                
                // Apply subtle movement to the plant group
                // We must preserve the base translation (400, 700)
                const baseX = 400;
                const baseY = 700;
                
                plantGroup.style.transform = `translate(${baseX + x}px, ${baseY + y}px)`;
            });

            // Subtle "breathing" animation using requestAnimationFrame
            let time = 0;
            function animatePlant() {
                time += 0.005;
                const sway = Math.sin(time) * 1.5; // Gentle sway
                const breathe = 1 + Math.sin(time * 0.5) * 0.002; // Very subtle scale

                // Note: This combines with the mousemove transform, 
                // so we only apply rotation/scale here to avoid overwriting translation logic
                // However, for simplicity in this specific constrained environment, 
                // we'll rely on the CSS transition for the bulk of the visual feedback
                // and just add a tiny rotation here.
                
                // plantGroup.style.transform += ` rotate(${sway}deg)`; 
                // (Disabled to prevent conflict with mouse parallax translation logic above)
                
                requestAnimationFrame(animatePlant);
            }
            animatePlant();
        });
    </script>
</body>
</html>
