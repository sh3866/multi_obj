<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncy & Bolt - The Great Spring Adventure</title>
    <style>
        /* 
         * DESIGN SYSTEM & RESET 
         * Focus: Clean, bold, vibrant. No generic gradients.
         */
        :root {
            --c-sky-top: #4FC3F7;
            --c-sky-bot: #E1F5FE;
            --c-ground: #4E342E;
            --c-grass: #7CB342;
            --c-grass-light: #AED581;
            --c-primary: #FF6F00; /* Bouncy Orange */
            --c-accent: #0288D1; /* Bolt Blue */
            --c-gold: #FFD700;
            --c-text: #37474F;
            --c-white: #FFFFFF;
            --c-dark: #263238;
            --font-head: 'Arial Black', 'Impact', sans-serif;
            --font-body: 'Verdana', 'Segoe UI', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-body);
            background: #000; /* Fallback */
            color: var(--c-text);
            user-select: none;
        }

        /* LAYOUT GRID */
        #app {
            display: grid;
            grid-template-rows: 80px 1fr 120px;
            grid-template-columns: 300px 1fr 300px;
            width: 100%;
            height: 100%;
            position: relative;
            background: linear-gradient(180deg, var(--c-sky-top) 0%, var(--c-sky-bot) 100%);
        }

        /* CANVAS LAYER - The Visual World */
        #world-canvas {
            grid-row: 1 / -1;
            grid-column: 1 / -1;
            z-index: 1;
            display: block;
        }

        /* UI OVERLAY LAYER */
        .ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to canvas if needed, but re-enable on children */
        }
        .ui-interactive {
            pointer-events: auto;
        }

        /* HEADER: TITLE & STATS */
        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0) 100%);
        }

        .brand {
            display: flex;
            flex-direction: column;
        }
        
        h1 {
            font-family: var(--font-head);
            font-size: 3rem;
            color: var(--c-white);
            text-transform: uppercase;
            text-shadow: 4px 4px 0px var(--c-primary), 6px 6px 0px rgba(0,0,0,0.2);
            letter-spacing: -1px;
            line-height: 0.9;
            transform: skewX(-5deg);
        }
        
        .subtitle {
            font-family: var(--font-head);
            color: var(--c-accent);
            font-size: 1.2rem;
            background: var(--c-white);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 5px;
            transform: skewX(-5deg);
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .stats-bar {
            display: flex;
            gap: 20px;
        }

        .stat-pill {
            background: var(--c-white);
            padding: 8px 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            border: 2px solid var(--c-dark);
        }

        .icon {
            width: 24px;
            height: 24px;
        }

        /* CENTER: HERO & START */
        .center-stage {
            grid-column: 2;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 20px;
        }

        /* HERO CHARACTER (CSS DRAWING) */
        .hero-container {
            width: 160px;
            height: 180px;
            position: relative;
            margin-bottom: 40px;
            animation: hero-bounce 2s infinite ease-in-out;
        }

        .hero-body {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 30% 30%, #FF8A65, var(--c-primary));
            border-radius: 50%;
            position: absolute;
            bottom: 20px;
            left: 20px;
            border: 4px solid var(--c-dark);
            box-shadow: inset -10px -10px 0 rgba(0,0,0,0.1);
            z-index: 2;
        }

        .hero-face {
            position: absolute;
            top: 30px;
            left: 25px;
            width: 70px;
            height: 40px;
            background: #FFF;
            border-radius: 40px 40px 10px 10px;
            border: 3px solid var(--c-dark);
            overflow: hidden;
        }
        
        .hero-eye {
            width: 12px;
            height: 16px;
            background: var(--c-dark);
            border-radius: 50%;
            position: absolute;
            top: 12px;
            animation: blink 4s infinite;
        }
        .hero-eye.left { left: 15px; }
        .hero-eye.right { right: 15px; }

        .hero-mouth {
            width: 30px;
            height: 15px;
            background: var(--c-dark);
            border-radius: 0 0 20px 20px;
            position: absolute;
            bottom: 5px;
            left: 20px;
        }

        .hero-spring {
            width: 60px;
            height: 40px;
            background: #90A4AE;
            position: absolute;
            bottom: 0;
            left: 50px;
            border-radius: 10px;
            border: 4px solid var(--c-dark);
            z-index: 1;
            /* Spring lines */
            background-image: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 8px,
                var(--c-dark) 8px,
                var(--c-dark) 12px
            );
        }

        .hero-shadow {
            width: 100px;
            height: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 50%;
            position: absolute;
            bottom: -10px;
            left: 30px;
            transform: scale(1);
            animation: shadow-scale 2s infinite ease-in-out;
        }

        /* START BUTTON */
        .btn-start {
            background: var(--c-primary);
            color: var(--c-white);
            font-family: var(--font-head);
            font-size: 2rem;
            text-transform: uppercase;
            padding: 15px 60px;
            border: 4px solid var(--c-dark);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 8px 0 var(--c-dark);
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .btn-start:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 var(--c-dark);
        }

        .btn-start::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 50%;
            background: rgba(255,255,255,0.2);
        }

        /* LEFT PANEL: WORLD SELECT */
        .world-selector {
            grid-column: 1;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding-left: 20px;
        }

        .world-card {
            width: 200px;
            height: 120px;
            background: var(--c-white);
            border: 3px solid var(--c-dark);
            border-radius: 15px;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
            align-items: center;
            padding: 10px;
        }

        .world-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 11px 0 rgba(0,0,0,0.2);
        }

        .world-card.active {
            border-color: var(--c-primary);
            box-shadow: 0 6px 0 var(--c-primary);
            transform: translateY(-6px);
        }

        .world-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-right: 10px;
            border: 2px solid var(--c-dark);
        }
        .w1 .world-icon { background: #81C784; }
        .w2 .world-icon { background: #FFB74D; }
        .w3 .world-icon { background: #4DD0E1; }

        .world-info h3 { font-size: 1rem; margin-bottom: 4px; }
        .world-info p { font-size: 0.8rem; color: #777; }

        /* RIGHT PANEL: CONTROLS */
        .controls-guide {
            grid-column: 3;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-right: 40px;
            padding-bottom: 40px;
        }

        .key {
            width: 50px;
            height: 50px;
            background: var(--c-white);
            border: 2px solid var(--c-dark);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: 50px 50px 50px;
            gap: 5px;
            margin-bottom: 20px;
        }
        .d-pad .key:nth-child(1) { grid-column: 2; }
        .d-pad .key:nth-child(2) { grid-column: 1; grid-row: 2; }
        .d-pad .key:nth-child(3) { grid-column: 2; grid-row: 2; }
        .d-pad .key:nth-child(4) { grid-column: 3; grid-row: 2; }

        .action-keys {
            display: flex;
            gap: 20px;
        }
        .key.action {
            background: var(--c-primary);
            color: white;
            width: 60px;
        }
        .key.action.jump { background: var(--c-accent); }

        /* FOOTER */
        footer {
            grid-column: 1 / -1;
            grid-row: 3;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            color: var(--c-white);
            font-weight: bold;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
        }

        /* ANIMATIONS */
        @keyframes hero-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes shadow-scale {
            0%, 100% { transform: scale(1); opacity: 0.2; }
            50% { transform: scale(0.8); opacity: 0.1; }
        }
        @keyframes blink {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }

        /* RESPONSIVE */
        @media (max-width: 1000px) {
            #app {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto auto;
            }
            .world-selector, .controls-guide {
                grid-column: 1;
                grid-row: 3;
                flex-direction: row;
                padding: 20px;
                overflow-x: auto;
            }
            .controls-guide { grid-row: 4; }
            .d-pad, .action-keys { margin: 0; }
            header { padding: 10px 20px; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- CANVAS BACKGROUND -->
    <canvas id="world-canvas"></canvas>

    <!-- UI OVERLAY -->
    <header class="ui-layer">
        <div class="brand">
            <h1>Bouncy<br>& Bolt</h1>
            <div class="subtitle">The Great Spring Adventure</div>
        </div>
        <div class="stats-bar ui-interactive">
            <div class="stat-pill">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#FFD700" stroke-width="3">
                    <circle cx="12" cy="12" r="8" fill="#FFD700" stroke="none"/>
                    <path d="M12 4 L12 20" stroke="#F57F17"/>
                    <circle cx="12" cy="12" r="2" fill="#FFF"/>
                </svg>
                <span>1,240</span>
            </div>
            <div class="stat-pill">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#D32F2F" stroke-width="3">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#D32F2F" stroke="none"/>
                </svg>
                <span>5</span>
            </div>
        </div>
    </header>

    <!-- LEFT: WORLD SELECTOR -->
    <aside class="world-selector ui-layer ui-interactive">
        <div class="world-card w1 active">
            <div class="world-icon"></div>
            <div class="world-info">
                <h3>Spring Valley</h3>
                <p>Level 1-1</p>
            </div>
        </div>
        <div class="world-card w2">
            <div class="world-icon"></div>
            <div class="world-info">
                <h3>Sand Springs</h3>
                <p>Locked</p>
            </div>
        </div>
        <div class="world-card w3">
            <div class="world-icon"></div>
            <div class="world-info">
                <h3>Cloud Peak</h3>
                <p>Locked</p>
            </div>
        </div>
    </aside>

    <!-- CENTER: HERO & ACTION -->
    <main class="center-stage ui-layer">
        <div class="hero-container">
            <div class="hero-body">
                <div class="hero-face">
                    <div class="hero-eye left"></div>
                    <div class="hero-eye right"></div>
                    <div class="hero-mouth"></div>
                </div>
            </div>
            <div class="hero-spring"></div>
            <div class="hero-shadow"></div>
        </div>
        
        <button class="btn-start ui-interactive">Start Adventure</button>
    </main>

    <!-- RIGHT: CONTROLS -->
    <aside class="controls-guide ui-layer">
        <div class="d-pad">
            <div class="key">W</div>
            <div class="key">A</div>
            <div class="key">S</div>
            <div class="key">D</div>
        </div>
        <div class="action-keys">
            <div class="key action jump">SPACE</div>
        </div>
        <p style="margin-top:10px; font-size: 0.8rem; font-weight:bold; color: var(--c-white); text-shadow: 1px 1px 0 #000;">JUMP TO BOUNCE!</p>
    </aside>

    <!-- FOOTER -->
    <footer class="ui-layer">
        <div>© 2023 Bouncy Games</div>
        <div>Press ENTER to Start</div>
    </footer>
</div>

<script>
    /**
     * CANVAS RENDERING ENGINE
     * Draws the parallax background, platforms, and particles.
     */
    const canvas = document.getElementById('world-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let frame = 0;

    // Resize handler
    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Colors
    const C_SKY = '#4FC3F7'; // Top color
    const C_GROUND = '#4E342E';
    const C_GRASS = '#7CB342';
    const C_BLOCK = '#8D6E63';
    const C_BLOCK_DARK = '#5D4037';

    // Helper: Draw a rounded rect
    function drawRoundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    // Helper: Draw a classic block
    function drawBlock(x, y, size) {
        // Main body
        ctx.fillStyle = C_BLOCK;
        ctx.fillRect(x, y, size, size);
        // Bevel highlight
        ctx.fillStyle = '#A1887F';
        ctx.fillRect(x, y, size, 4);
        ctx.fillRect(x, y, 4, size);
        // Bevel shadow
        ctx.fillStyle = C_BLOCK_DARK;
        ctx.fillRect(x, y + size - 4, size, 4);
        ctx.fillRect(x + size - 4, y, 4, size);
        // Question mark or Bolt
        ctx.fillStyle = '#3E2723';
        ctx.font = 'bold ' + (size/2) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', x + size/2, y + size/2 + 2);
        // Dots
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath(); ctx.arc(x+8, y+size-8, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x+size-8, y+size-8, 2, 0, Math.PI*2); ctx.fill();
    }

    // Helper: Draw a Question Block (Gold)
    function drawGoldBlock(x, y, size, offset) {
        ctx.fillStyle = '#FFCA28';
        ctx.fillRect(x, y, size, size);
        ctx.fillStyle = '#FFF59D'; // Highlight
        ctx.fillRect(x, y, size, 4);
        ctx.fillRect(x, y, 4, size);
        ctx.fillStyle = '#FF8F00'; // Shadow
        ctx.fillRect(x, y + size - 4, size, 4);
        ctx.fillRect(x + size - 4, y, 4, size);
        
        // Pulsing effect
        const pulse = Math.sin((frame + offset) * 0.1) * 0.2 + 0.8;
        ctx.fillStyle = '#FFF';
        ctx.font = 'bold ' + (size/1.8) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', x + size/2, y + size/2 + 2);
    }

    // Helper: Draw Ground
    function drawGround(y, h) {
        ctx.fillStyle = C_GROUND;
        ctx.fillRect(0, y, width, h);
        
        // Grass Top
        ctx.fillStyle = C_GRASS;
        ctx.fillRect(0, y, width, 20);
        
        // Grass Detail
        ctx.fillStyle = '#AED581';
        for(let i=0; i<width; i+=40) {
            ctx.fillRect(i, y, 20, 6);
        }
    }

    // Helper: Draw Cloud
    function drawCloud(x, y, scale) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.beginPath();
        ctx.arc(x, y, 30 * scale, 0, Math.PI * 2);
        ctx.arc(x + 25 * scale, y - 10 * scale, 35 * scale, 0, Math.PI * 2);
        ctx.arc(x + 50 * scale, y, 30 * scale, 0, Math.PI * 2);
        ctx.fill();
    }

    // Helper: Draw Coin
    function drawCoin(x, y, r) {
        const wobble = Math.sin(frame * 0.1) * 3;
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.ellipse(x, y, r, r, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#F57F17';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        ctx.fillStyle = '#FFF';
        ctx.fillRect(x - 2, y - 5, 4, 10); // Shine
    }

    // Helper: Draw Flag
    function drawFlag(x, y, h) {
        // Pole
        ctx.fillStyle = '#90A4AE';
        ctx.fillRect(x, y, 6, h);
        ctx.fillStyle = '#D32F2F'; // Ball on top
        ctx.beginPath(); ctx.arc(x+3, y, 8, 0, Math.PI*2); ctx.fill();
        
        // Flag cloth
        ctx.fillStyle = '#FF5722';
        ctx.beginPath();
        ctx.moveTo(x+6, y+10);
        ctx.lineTo(x+60, y+30);
        ctx.lineTo(x+6, y+50);
        ctx.fill();
    }

    // PARTICLES
    const particles = [];
    function spawnParticle() {
        if(Math.random() > 0.05) return;
        particles.push({
            x: Math.random() * width,
            y: height - 100,
            vx: (Math.random() - 0.5) * 2,
            vy: -Math.random() * 2 - 1,
            life: 100,
            color: Math.random() > 0.5 ? '#FFF' : '#FFD700'
        });
    }

    function updateParticles() {
        for(let i=particles.length-1; i>=0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life / 100;
            ctx.fillRect(p.x, p.y, 4, 4);
            ctx.globalAlpha = 1;
            if(p.life <= 0) particles.splice(i, 1);
        }
    }

    // SCENE OBJECTS
    // We define a "world" that is wider than the screen, but we draw it static for the menu.
    // Actually, for a menu, it's better if elements float gently.
    
    const clouds = [
        {x: 100, y: 150, s: 1},
        {x: 400, y: 100, s: 0.8},
        {x: 800, y: 180, s: 1.2},
        {x: 1100, y: 120, s: 0.9}
    ];

    const platforms = [
        {x: -50, y: 0, w: 400, h: 100}, // Main ground
        {x: 450, y: 50, w: 200, h: 50}, // Small platform
        {x: 700, y: -20, w: 300, h: 120}, // High platform
        {x: 1100, y: 20, w: 200, h: 80}
    ];

    // Main Loop
    function loop() {
        frame++;
        ctx.clearRect(0, 0, width, height);

        const groundY = height - 150; // Base ground level relative to bottom

        // 1. Draw Clouds (Parallax)
        clouds.forEach(c => {
            // Gentle float
            let moveX = c.x + Math.sin(frame * 0.005 + c.x) * 20;
            drawCloud(moveX, c.y, c.s);
        });

        // 2. Draw Distant Mountains (Simple shapes)
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(width * 0.2, groundY - 200);
        ctx.lineTo(width * 0.5, groundY);
        ctx.lineTo(width * 0.8, groundY - 150);
        ctx.lineTo(width, groundY);
        ctx.fill();

        // 3. Draw Platforms
        platforms.forEach(p => {
            const py = groundY - p.h;
            
            // Ground block
            ctx.fillStyle = '#5D4037';
            ctx.fillRect(p.x, py, p.w, p.h);
            
            // Grass Top
            ctx.fillStyle = '#7CB342';
            ctx.fillRect(p.x, py, p.w, 20);
            
            // Grass Detail
            ctx.fillStyle = '#AED581';
            for(let i=0; i<p.w; i+=40) {
                ctx.fillRect(p.x + i, py, 20, 6);
            }

            // Dirt pattern
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for(let i=0; i<p.w; i+=60) {
                for(let j=20; j<p.h; j+=40) {
                    ctx.beginPath();
                    ctx.arc(p.x + i + 20, py + j, 5, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        });

        // 4. Draw Blocks (Floating)
        const blockSize = 50;
        drawBlock(500, groundY - 180, blockSize);
        drawGoldBlock(560, groundY - 180, blockSize, 10);
        drawBlock(620, groundY - 180, blockSize);

        drawBlock(750, groundY - 250, blockSize);
        drawBlock(810, groundY - 250, blockSize);
        drawGoldBlock(870, groundY - 250, blockSize, 5);

        // 5. Draw Coins
        drawCoin(535, groundY - 230, 10);
        drawCoin(840, groundY - 300, 10);
        drawCoin(700, groundY - 100, 10);

        // 6. Draw Flag (Goal)
        drawFlag(1150, groundY - 250, 250);

        // 7. Particles
        spawnParticle();
        updateParticles();

        requestAnimationFrame(loop);
    }

    loop();

</script>
