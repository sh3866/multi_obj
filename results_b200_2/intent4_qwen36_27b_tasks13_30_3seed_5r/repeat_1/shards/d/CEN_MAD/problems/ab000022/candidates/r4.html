<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncy & Bolt - The Great Spring Adventure</title>
    <style>
        :root {
            /* Palette: Vibrant, Warm, Cartoonish */
            --c-sky-top: #4FC3F7;
            --c-sky-bot: #E1F5FE;
            
            --c-primary: #FF5722; /* Deep Orange */
            --c-primary-light: #FF8A65;
            --c-primary-dark: #D84315;
            
            --c-dark: #263238; /* Ink color - THE STROKE */
            --c-white: #FFFFFF;
            
            /* Earth Tones - Warm & Saturated */
            --c-grass: #7CB342;
            --c-dirt: #A1887F; /* Lighter, warmer dirt */
            --c-dirt-dark: #8D6E63;
            
            --c-gold: #FFEB3B;
            --c-gold-dark: #FBC02D;
            
            --font-display: 'Arial Black', 'Impact', sans-serif;
            --font-ui: 'Verdana', sans-serif;
            
            --stroke-w: 4px; /* Unified Stroke Width */
            --shadow-offset: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-ui);
            background: var(--c-sky-top);
            color: var(--c-dark);
        }

        /* --- CANVAS LAYER --- */
        #world-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* --- UI LAYER (Z-Pattern Layout) --- */
        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        .interactive { pointer-events: auto; cursor: pointer; }

        /* --- 1. TOP BAR: Title (Left) & HUD (Right) --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            position: relative;
        }

        /* Title: Bouncy Distortion */
        .game-title {
            z-index: 20;
            animation: float-title 4s ease-in-out infinite;
            filter: drop-shadow(0px 8px 0px rgba(0,0,0,0.15));
        }

        .game-title h1 {
            font-family: var(--font-display);
            font-size: 5.5rem;
            line-height: 0.85;
            color: var(--c-white);
            -webkit-text-stroke: 3px var(--c-dark);
            text-shadow: 
                0px 0px 0px var(--c-dark), 
                0px 12px 0px var(--c-dark); /* 3D Extrusion */
            letter-spacing: -2px;
            text-transform: uppercase;
            transform: skewX(-5deg) rotate(-2deg);
        }

        .game-title h1 span:nth-child(1) { display: block; color: var(--c-primary); }
        .game-title h1 span:nth-child(2) { display: block; margin-left: 40px; }

        .game-title h2 {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: var(--c-primary);
            background: var(--c-white);
            display: inline-block;
            padding: 8px 24px;
            border-radius: 50px;
            margin-top: 15px;
            box-shadow: 0 6px 0 var(--c-dark);
            transform: rotate(2deg);
            border: 3px solid var(--c-dark);
            margin-left: 5px;
        }

        /* Top Right: Consolidated HUD Strip */
        .hud-strip {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 15px;
            border-radius: 50px;
            border: 3px solid var(--c-dark);
            box-shadow: 0 6px 0 var(--c-dark);
            transform: rotate(1deg);
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 1.1rem;
            padding: 0 10px;
        }
        
        .hud-divider {
            width: 2px; height: 20px; background: #CFD8DC; border-radius: 2px;
        }

        /* World Selector (Mini Map Style) */
        .world-selector {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 10px;
        }
        
        .world-node {
            width: 24px; height: 24px;
            border-radius: 50%;
            background: #ECEFF1;
            border: 2px solid var(--c-dark);
            position: relative;
            transition: transform 0.2s;
        }
        .world-node.active { background: var(--c-primary); transform: scale(1.15); }
        .world-node.locked { background: #B0BEC5; opacity: 0.6; }
        .world-connector { width: 12px; height: 2px; background: var(--c-dark); }

        /* --- 2. BOTTOM AREA: Controls (Left) & Start (Center) --- */
        .bottom-bar {
            display: flex;
            justify-content: space-between; /* Controls Left, Spacer Center, Start Centered visually via Spacer */
            align-items: flex-end;
            width: 100%;
            padding-bottom: 20px;
            position: relative;
        }

        /* Left: Controls Guide */
        .controls-group {
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 20px;
            border-radius: 16px;
            border: 3px solid var(--c-dark);
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 6px 0 var(--c-dark);
            transform: rotate(-2deg);
        }

        .controls-title {
            font-family: var(--font-display);
            font-size: 0.75rem;
            color: var(--c-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .key-row { display: flex; gap: 6px; align-items: center; }
        
        .key {
            width: 36px; height: 36px;
            background: var(--c-white);
            border: 3px solid var(--c-dark);
            border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            font-weight: 900;
            font-size: 1rem;
            color: var(--c-dark);
            box-shadow: 0 4px 0 #B0BEC5;
            transform: translateY(0);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        
        /* Simulated pressed state for visual interest */
        .key.jump { width: 100px; background: var(--c-primary-light); }
        .key.jump:active, .key.jump:hover { transform: translateY(4px); box-shadow: 0 0 0 #B0BEC5; }

        /* Right Spacer to push Start Button to Center */
        .center-spacer { flex-grow: 1; }

        /* Center: Start Button */
        .launch-zone {
            position: absolute;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .btn-start {
            background: var(--c-primary);
            color: var(--c-white);
            font-family: var(--font-display);
            font-size: 2.2rem;
            text-transform: uppercase;
            padding: 18px 60px;
            border: 4px solid var(--c-dark);
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 10px 0 var(--c-primary-dark), 0 20px 30px rgba(0,0,0,0.2);
            position: relative;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
            transition: all 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 2px;
            animation: pulse-btn 2s infinite;
        }

        .btn-start:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 14px 0 var(--c-primary-dark), 0 25px 40px rgba(0,0,0,0.2);
        }

        .btn-start:active {
            transform: translateY(6px) scale(0.98);
            box-shadow: 0 0 0 var(--c-primary-dark);
        }
        
        .btn-icon { margin-right: 10px; font-style: normal; }

        /* --- HERO (Floating in the middle of the screen, above bottom bar) --- */
        .hero-anchor {
            position: absolute;
            bottom: 140px; /* Sit above the bottom UI */
            left: 50%;
            transform: translateX(-40%); /* Slightly left of center */
            width: 160px; height: 220px;
            z-index: 15;
            pointer-events: none;
        }

        /* Dynamic Bounce Animation */
        .hero-wrapper {
            width: 100%; height: 100%;
            animation: hero-bounce 1.2s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
            transform-origin: bottom center;
        }

        /* CSS Drawn Hero */
        .hero-spring {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 40px; height: 60px;
            background: repeating-linear-gradient(0deg, var(--c-dark), var(--c-dark) 6px, transparent 6px, transparent 12px);
            border-radius: 4px;
            z-index: 1;
        }
        
        .hero-body {
            width: 130px; height: 110px;
            background: var(--c-primary);
            border-radius: 65% 65% 55% 55%; 
            position: absolute; bottom: 40px; left: 15px;
            border: 4px solid var(--c-dark);
            z-index: 2;
            box-shadow: inset -10px -10px 0 rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }

        .hero-face {
            width: 90px; height: 50px;
            background: var(--c-white);
            border-radius: 45px;
            position: absolute; top: 25px; left: 20px;
            border: 3px solid var(--c-dark);
            display: flex; justify-content: center; gap: 15px;
            align-items: center;
        }

        .eye {
            width: 14px; height: 20px;
            background: var(--c-dark);
            border-radius: 50%;
            animation: blink 4s infinite;
        }
        .mouth {
            width: 20px; height: 10px;
            border-bottom: 3px solid var(--c-dark);
            border-radius: 0 0 20px 20px;
            position: absolute; bottom: 12px;
        }

        .limb {
            position: absolute;
            background: var(--c-primary);
            border: 3px solid var(--c-dark);
            border-radius: 20px;
        }
        .arm { width: 30px; height: 50px; top: 50px; }
        .arm.l { left: -15px; transform: rotate(20deg); animation: swing-arm 1.2s infinite; }
        .arm.r { right: -15px; transform: rotate(-20deg); animation: swing-arm 1.2s infinite reverse; }
        
        .foot { width: 45px; height: 30px; bottom: -15px; border-radius: 10px 30px 10px 10px; }
        .foot.l { left: 15px; transform: rotate(10deg); }
        .foot.r { right: 15px; transform: rotate(-10deg); }

        /* --- ANIMATIONS --- */
        @keyframes hero-bounce {
            0% { transform: translateY(0) scaleY(1) scaleX(1); }
            10% { transform: translateY(0) scaleY(0.85) scaleX(1.15); } /* Squash */
            25% { transform: translateY(-50px) scaleY(1.1) scaleX(0.9); } /* Stretch Up */
            50% { transform: translateY(0) scaleY(1) scaleX(1); } /* Land */
            60% { transform: translateY(0) scaleY(0.9) scaleX(1.1); } /* Squash 2 */
            75% { transform: translateY(-30px) scaleY(1.05) scaleX(0.95); } /* Stretch 2 */
            100% { transform: translateY(0) scaleY(1) scaleX(1); }
        }
        @keyframes swing-arm { 0%, 100% { transform: rotate(20deg); } 50% { transform: rotate(40deg); } }
        @keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
        @keyframes float-title { 0%, 100% { transform: translateY(0) skewX(-5deg) rotate(-2deg); } 50% { transform: translateY(-8px) skewX(-5deg) rotate(-2deg); } }
        @keyframes pulse-btn { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.02); } }

        /* Responsive */
        @media (max-width: 800px) {
            .game-title h1 { font-size: 3.5rem; }
            .game-title h2 { font-size: 1rem; }
            .hero-anchor { left: 10%; bottom: 120px; transform: translateX(0) scale(0.8); }
            .launch-zone { position: relative; left: auto; bottom: auto; transform: none; margin-top: 20px; }
            .controls-group { display: none; } /* Hide controls on mobile */
            .bottom-bar { flex-direction: column; align-items: center; justify-content: center; height: auto; padding-bottom: 40px; }
            .center-spacer { display: none; }
        }
    </style>
</head>
<body>

    <!-- VISUAL WORLD (CANVAS) -->
    <canvas id="world-canvas"></canvas>

    <!-- UI OVERLAY -->
    <div id="ui-layer">
        
        <!-- HEADER -->
        <div class="top-bar">
            <!-- Left: Title -->
            <div class="game-title">
                <h1><span>Bouncy</span><span>& Bolt</span></h1>
                <h2>The Great Spring Adventure</h2>
            </div>
            
            <!-- Right: Consolidated HUD -->
            <div class="hud-strip interactive">
                <!-- Coins -->
                <div class="hud-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="10" stroke="#FBC02D" stroke-width="3" fill="#FFEB3B"/>
                        <path d="M12 8v8M9 12h6" stroke="#FBC02D" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span>1,240</span>
                </div>
                
                <div class="hud-divider"></div>

                <!-- Lives -->
                <div class="hud-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#D32F2F" stroke="#B71C1C" stroke-width="2"/>
                    </svg>
                    <span>x 5</span>
                </div>

                <div class="hud-divider"></div>

                <!-- World Map -->
                <div class="world-selector">
                    <div class="world-node active" title="Spring Valley"></div>
                    <div class="world-connector"></div>
                    <div class="world-node locked" title="Sand Springs"></div>
                    <div class="world-connector"></div>
                    <div class="world-node locked" title="Cloud Peak"></div>
                </div>
            </div>
        </div>

        <!-- HERO ANCHOR (Visual only, sits in background layer) -->
        <div class="hero-anchor">
            <div class="hero-wrapper">
                <div class="hero-body">
                    <div class="limb arm l"></div>
                    <div class="limb arm r"></div>
                    <div class="hero-face">
                        <div class="eye l"></div>
                        <div class="eye r"></div>
                        <div class="mouth"></div>
                    </div>
                    <div class="limb foot l"></div>
                    <div class="limb foot r"></div>
                </div>
                <div class="hero-spring"></div>
            </div>
        </div>

        <!-- BOTTOM BAR -->
        <div class="bottom-bar">
            
            <!-- Left: Controls Guide -->
            <div class="controls-group interactive">
                <div class="controls-title">Controls</div>
                <div class="key-row">
                    <div class="key">W</div>
                </div>
                <div class="key-row">
                    <div class="key">A</div>
                    <div class="key">S</div>
                    <div class="key">D</div>
                </div>
                <div class="key-row">
                    <div class="key jump">SPACE</div>
                </div>
            </div>

            <!-- Spacer -->
            <div class="center-spacer"></div>

            <!-- Center: Start Button -->
            <div class="launch-zone">
                <button class="btn-start interactive" onclick="alert('Level Starting!')">
                    <i class="btn-icon">⚡</i> START
                </button>
            </div>

        </div>

    </div>

<script>
    /**
     * CANVAS ENGINE - REVISED FOR DEPTH
     * 1. Distant Mountains (Slow)
     * 2. Midground Level (Standard)
     * 3. Foreground (Fast/Obscuring)
     * Style: Consistent 3-5px Dark Outlines
     */
    const canvas = document.getElementById('world-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let frame = 0;

    // Colors
    const C_SKY_TOP = "#4FC3F7";
    const C_SKY_BOT = "#E1F5FE";
    const C_MTN_BACK = "#81D4FA"; // Light Blue
    const C_MTN_MID = "#4FC3F7"; // Sky Blue
    const C_GRASS = "#7CB342";
    const C_DIRT = "#A1887F"; // Warm Earth
    const C_DIRT_DARK = "#8D6E63";
    const C_DARK = "#263238"; // The Outline

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- DRAWING HELPERS ---
    function setStyle(fill, stroke, lw = 4) {
        ctx.fillStyle = fill;
        if(stroke) {
            ctx.strokeStyle = stroke;
            ctx.lineWidth = lw;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
        } else {
            ctx.strokeStyle = null;
        }
    }

    // --- LAYER 1: BACKGROUND (Mountains & Clouds) ---
    function drawBackground() {
        // Sky Gradient
        let skyGrad = ctx.createLinearGradient(0, 0, 0, height);
        skyGrad.addColorStop(0, C_SKY_TOP);
        skyGrad.addColorStop(1, C_SKY_BOT);
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, width, height);

        // Clouds (Parallax 1)
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.strokeStyle = C_DARK;
        ctx.lineWidth = 3;
        
        let cx1 = (frame * 0.3) % (width + 300) - 150;
        drawCloudShape(cx1, 150, 1.2);
        drawCloudShape(cx1 - width * 0.4, 80, 0.8);
        
        let cx2 = (frame * 0.15) % (width + 400) - 200;
        drawCloudShape(cx2 + width * 0.6, 220, 1.5);

        // Distant Hills (Parallax 2)
        ctx.beginPath();
        ctx.moveTo(0, height * 0.6);
        for (let i = 0; i <= width; i+=10) {
            // Slow sine wave
            let y = height * 0.6 - Math.sin(i * 0.003 + frame * 0.005) * 50;
            ctx.lineTo(i, y);
        }
        ctx.lineTo(width, height); ctx.lineTo(0, height);
        setStyle(C_MTN_BACK, C_DARK, 3);
        ctx.fill();
        ctx.stroke();
    }

    function drawCloudShape(x, y, s) {
        ctx.beginPath();
        ctx.arc(x, y, 40*s, 0, Math.PI*2);
        ctx.arc(x+40*s, y-20*s, 50*s, 0, Math.PI*2);
        ctx.arc(x+80*s, y, 40*s, 0, Math.PI*2);
        ctx.arc(x+40*s, y+10*s, 40*s, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();
    }

    // --- LAYER 2: MIDGROUND (The Level) ---
    function drawMidGround() {
        const midY = height * 0.75; // Ground Level

        // 1. Continuous Ground Plane
        ctx.beginPath();
        ctx.moveTo(0, midY);
        // Wavy ground top
        for(let i=0; i<=width; i+=40) {
            ctx.lineTo(i + 20, midY + 8);
            ctx.lineTo(i + 40, midY);
        }
        ctx.lineTo(width, height); ctx.lineTo(0, height);
        setStyle(C_DIRT, C_DARK, 5);
        ctx.fill();
        ctx.stroke();

        // Grass Top Cap
        ctx.beginPath();
        ctx.moveTo(0, midY);
        for(let i=0; i<=width; i+=40) {
            ctx.lineTo(i + 20, midY + 8);
            ctx.lineTo(i + 40, midY);
        }
        ctx.lineTo(width, midY + 12); ctx.lineTo(0, midY + 12);
        setStyle(C_GRASS, null);
        ctx.fill();

        // 2. Foreground Platform (Left side)
        const platX = width * 0.15;
        const platY = midY - 100;
        
        // Platform Body
        ctx.beginPath();
        ctx.roundRect(platX, platY, 160, 30, 8);
        setStyle("#5D4037", C_DARK, 4);
        ctx.fill(); ctx.stroke();
        
        // Platform Grass
        ctx.beginPath();
        ctx.roundRect(platX, platY, 160, 10, [8,8,0,0]);
        setStyle(C_GRASS, C_DARK, 4);
        ctx.fill(); ctx.stroke();

        // 3. Question Block
        const blockX = platX + 60;
        const blockY = platY - 50;
        const blockPulse = Math.sin(frame * 0.1) * 2;
        
        ctx.beginPath();
        ctx.rect(blockX, blockY + blockPulse, 40, 40);
        setStyle("#FFC107", C_DARK, 4);
        ctx.fill(); ctx.stroke();
        
        // Question Mark
        ctx.fillStyle = C_DARK;
        ctx.font = "bold 28px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("?", blockX + 20, blockY + 22 + blockPulse);

        // 4. Coin Trail
        drawCoin(platX + 20, platY - 80);
        drawCoin(platX + 60, platY - 120);
        drawCoin(platX + 100, platY - 80);

        // 5. Enemy (Slime)
        const enemyX = width * 0.45;
        const enemyY = midY - 25 - (Math.abs(Math.sin(frame * 0.08)) * 20); // Hop
        drawSlime(enemyX, enemyY);

        // 6. Distant Goal (Right Horizon)
        drawGoal(width * 0.85, midY);
    }

    function drawCoin(x, y) {
        const pulse = Math.sin(frame * 0.15) * 3;
        ctx.beginPath();
        ctx.arc(x, y, 12 + pulse, 0, Math.PI*2);
        setStyle("#FFEB3B", C_DARK, 3);
        ctx.fill(); ctx.stroke();
        
        // Shine
        ctx.beginPath();
        ctx.arc(x - 4, y - 4, 4, 0, Math.PI*2);
        setStyle("rgba(255,255,255,0.7)", null);
        ctx.fill();
    }

    function drawSlime(x, y) {
        ctx.beginPath();
        // Dome shape
        ctx.arc(x, y, 20, Math.PI, 0); 
        ctx.lineTo(x + 20, y + 15);
        ctx.lineTo(x - 20, y + 15);
        ctx.fill(); ctx.stroke();
        
        // Eyes
        setStyle("#FFF", C_DARK, 2);
        ctx.beginPath(); ctx.arc(x-7, y-5, 6, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(x+7, y-5, 6, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        
        // Pupils (Look at hero)
        setStyle(C_DARK, null);
        ctx.beginPath(); ctx.arc(x-7, y-5, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x+7, y-5, 2, 0, Math.PI*2); ctx.fill();
    }

    function drawGoal(x, y) {
        // Pole
        setStyle("#ECEFF1", C_DARK, 3);
        ctx.fillRect(x, y - 140, 8, 140);
        ctx.strokeRect(x, y - 140, 8, 140);
        
        // Ball
        ctx.beginPath(); ctx.arc(x+4, y-140, 8, 0, Math.PI*2);
        setStyle("#FF5722", C_DARK, 3);
        ctx.fill(); ctx.stroke();

        // Flag (Waving)
        const flagWave = Math.sin(frame * 0.1) * 5;
        ctx.beginPath();
        ctx.moveTo(x+8, y-135);
        ctx.quadraticCurveTo(x+40, y-120 + flagWave, x+55, y-110);
        ctx.lineTo(x+8, y-95);
        setStyle("#FF5722", C_DARK, 3);
        ctx.fill(); ctx.stroke();
    }

    // --- LAYER 3: FOREGROUND (Depth Obscuring) ---
    function drawForeground() {
        const foreY = height * 0.90;
        
        // Ground Strip
        ctx.beginPath();
        ctx.roundRect(0, foreY, width, height - foreY, 0);
        setStyle("#FFB74D", C_DARK, 6); // Warm Earth Tone
        ctx.fill(); ctx.stroke();
        
        // Grass Top
        ctx.beginPath();
        ctx.roundRect(0, foreY, width, 25, [0,0,0,0]);
        setStyle("#689F38", C_DARK, 6);
        ctx.fill(); ctx.stroke();

        // Bushes (Left & Right)
        drawBush(80, foreY + 20, 70);
        drawBush(width - 120, foreY + 10, 90);
    }

    function drawBush(x, y, size) {
        ctx.beginPath();
        ctx.arc(x, y, size, Math.PI, 0);
        ctx.arc(x + size*0.8, y, size*0.8, Math.PI, 0);
        ctx.arc(x - size*0.8, y, size*0.8, Math.PI, 0);
        setStyle("#558B2F", C_DARK, 4);
        ctx.fill(); ctx.stroke();
    }

    // --- LOOP ---
    function loop() {
        frame++;
        ctx.clearRect(0, 0, width, height);

        drawBackground();
        drawMidGround();
        drawForeground();

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
