<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncy & Bolt - The Great Spring Adventure</title>
    <style>
        :root {
            /* Palette: Vibrant, Warm, Cartoonish */
            --c-sky-top: #29B6F6;
            --c-sky-bot: #E1F5FE;
            
            --c-primary: #FF3D00; /* Vibrant Red-Orange */
            --c-primary-light: #FF6E40;
            --c-primary-dark: #C62828;
            
            --c-dark: #1A237E; /* Deep Indigo for Ink/Stroke - High Contrast */
            --c-white: #FFFFFF;
            
            /* Earth Tones - Checkerboard Style */
            --c-grass: #76FF03;
            --c-dirt-a: #8D6E63;
            --c-dirt-b: #795548;
            
            --c-gold: #FFEA00;
            --c-gold-dark: #FBC02D;
            
            --font-display: 'Arial Black', Impact, sans-serif;
            --font-ui: 'Verdana', Geneva, sans-serif;
            
            --stroke-w: 4px; 
            --shadow-offset: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-ui);
            background: var(--c-sky-top);
            color: var(--c-dark);
        }

        /* --- CANVAS LAYER --- */
        #world-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* --- UI LAYER (Z-Pattern Layout) --- */
        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        .interactive { pointer-events: auto; cursor: pointer; transition: transform 0.1s; }
        .interactive:active { transform: scale(0.96); }

        /* --- 1. TOP BAR: Title (Left) & HUD (Right) --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            position: relative;
        }

        /* Title: Bouncy Distortion */
        .game-title {
            z-index: 20;
            animation: float-title 4s ease-in-out infinite;
            filter: drop-shadow(0px 6px 0px rgba(0,0,0,0.2));
        }

        .game-title h1 {
            font-family: var(--font-display);
            font-size: 5rem;
            line-height: 0.9;
            color: var(--c-white);
            -webkit-text-stroke: 2px var(--c-dark);
            text-shadow: 
                0px 0px 0px var(--c-dark), 
                0px 10px 0px var(--c-dark); 
            letter-spacing: -2px;
            text-transform: uppercase;
            transform: skewX(-6deg) rotate(-2deg);
        }

        .game-title h1 span:nth-child(1) { display: block; color: var(--c-primary); }
        .game-title h1 span:nth-child(2) { display: block; margin-left: 30px; }

        .game-title h2 {
            font-family: var(--font-display);
            font-size: 1.1rem;
            color: var(--c-primary);
            background: var(--c-white);
            display: inline-block;
            padding: 6px 20px;
            border-radius: 50px;
            margin-top: 10px;
            box-shadow: 0 4px 0 var(--c-dark);
            transform: rotate(2deg);
            border: 3px solid var(--c-dark);
            margin-left: 5px;
        }

        /* Top Right: Consolidated HUD Strip */
        .hud-strip {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--c-white);
            padding: 10px 20px;
            border-radius: 20px;
            border: 3px solid var(--c-dark);
            box-shadow: 0 6px 0 var(--c-dark);
            transform: rotate(1deg);
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 1.1rem;
            padding: 0 10px;
        }
        
        .hud-divider {
            width: 2px; height: 20px; background: #CFD8DC; border-radius: 2px;
        }

        /* World Selector (Mini Map Style) */
        .world-selector {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 10px;
            padding-left: 15px;
            border-left: 2px solid #eee;
        }
        
        .world-node {
            width: 24px; height: 24px;
            border-radius: 50%;
            background: #ECEFF1;
            border: 2px solid var(--c-dark);
            position: relative;
            transition: transform 0.2s;
        }
        .world-node.active { background: var(--c-primary); transform: scale(1.2); box-shadow: 0 2px 0 var(--c-dark); }
        .world-node.locked { background: #B0BEC5; opacity: 0.6; }
        .world-connector { width: 12px; height: 2px; background: var(--c-dark); }

        /* --- 2. BOTTOM AREA: Start (Center) & Controls (Right) --- */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            padding-bottom: 20px;
            position: relative;
        }

        /* Spacer Left */
        .left-spacer { flex-grow: 1; }

        /* Center: Start Button */
        .launch-zone {
            position: absolute;
            left: 50%;
            bottom: 10px;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .btn-start {
            background: var(--c-primary);
            color: var(--c-white);
            font-family: var(--font-display);
            font-size: 2.5rem;
            text-transform: uppercase;
            padding: 20px 70px;
            border: 4px solid var(--c-dark);
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 12px 0 var(--c-primary-dark), 0 20px 30px rgba(0,0,0,0.25);
            position: relative;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
            transition: all 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 2px;
            animation: pulse-btn 2s infinite;
        }

        .btn-start:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 17px 0 var(--c-primary-dark), 0 25px 40px rgba(0,0,0,0.25);
        }

        .btn-start:active {
            transform: translateY(5px) scale(0.98);
            box-shadow: 0 2px 0 var(--c-primary-dark);
        }
        
        .btn-icon { margin-right: 10px; font-style: normal; }

        /* Right: Controls Guide (Diegetic Scroll) */
        .controls-group {
            background: #FFF8E1; /* Parchment color */
            padding: 15px 20px;
            border-radius: 8px;
            border: 3px solid var(--c-dark);
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.15);
            transform: rotate(3deg);
            position: relative;
        }
        
        /* Folded paper effect */
        .controls-group::before {
            content: ''; position: absolute; top: -3px; right: -3px;
            width: 0; height: 0; 
            border-style: solid;
            border-width: 0 30px 30px 0;
            border-color: transparent var(--c-dark) transparent transparent;
        }
        .controls-group::after {
            content: ''; position: absolute; top: -1px; right: -1px;
            width: 0; height: 0;
            border-style: solid;
            border-width: 0 26px 26px 0;
            border-color: transparent #E65100 transparent transparent;
        }

        .controls-title {
            font-family: var(--font-display);
            font-size: 0.8rem;
            color: var(--c-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            border-bottom: 2px dashed var(--c-dark);
            padding-bottom: 5px;
        }

        .key-row { display: flex; gap: 8px; align-items: center; justify-content: center; }
        
        .key-icon {
            width: 36px; height: 36px;
            background: var(--c-white);
            border: 3px solid var(--c-dark);
            border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem;
            color: var(--c-dark);
            box-shadow: 0 4px 0 #CFD8DC;
            position: relative;
        }
        
        /* Action Button (Red) */
        .key-icon.action {
            background: var(--c-primary);
            color: white;
            border-radius: 50%;
            width: 44px; height: 44px;
            box-shadow: 0 4px 0 var(--c-primary-dark);
        }

        .key-icon svg { width: 18px; height: 18px; fill: currentColor; }

        /* --- HERO (Floating in the middle of the screen) --- */
        .hero-anchor {
            position: absolute;
            bottom: 160px; 
            left: 45%;
            width: 160px; height: 220px;
            z-index: 15;
            pointer-events: none;
        }

        .hero-wrapper {
            width: 100%; height: 100%;
            animation: hero-bounce 1.2s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
            transform-origin: bottom center;
        }

        /* CSS Drawn Hero */
        .hero-spring {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 40px; height: 60px;
            background: repeating-linear-gradient(0deg, var(--c-dark), var(--c-dark) 6px, transparent 6px, transparent 12px);
            border-radius: 4px;
            z-index: 1;
        }
        
        .hero-body {
            width: 130px; height: 110px;
            background: var(--c-primary);
            border-radius: 65% 65% 55% 55%; 
            position: absolute; bottom: 40px; left: 15px;
            border: 4px solid var(--c-dark);
            z-index: 2;
            box-shadow: inset -10px -10px 0 rgba(0,0,0,0.1);
        }

        .hero-face {
            width: 90px; height: 50px;
            background: var(--c-white);
            border-radius: 45px;
            position: absolute; top: 25px; left: 20px;
            border: 3px solid var(--c-dark);
            display: flex; justify-content: center; gap: 15px;
            align-items: center;
        }

        .eye {
            width: 14px; height: 20px;
            background: var(--c-dark);
            border-radius: 50%;
            animation: blink 4s infinite;
        }
        .mouth {
            width: 20px; height: 10px;
            border-bottom: 3px solid var(--c-dark);
            border-radius: 0 0 20px 20px;
            position: absolute; bottom: 12px;
        }

        .limb {
            position: absolute;
            background: var(--c-primary);
            border: 3px solid var(--c-dark);
            border-radius: 20px;
        }
        .arm { width: 30px; height: 50px; top: 50px; }
        .arm.l { left: -15px; transform: rotate(20deg); animation: swing-arm 1.2s infinite; }
        .arm.r { right: -15px; transform: rotate(-20deg); animation: swing-arm 1.2s infinite reverse; }
        
        .foot { width: 45px; height: 30px; bottom: -15px; border-radius: 10px 30px 10px 10px; }
        .foot.l { left: 15px; transform: rotate(10deg); }
        .foot.r { right: 15px; transform: rotate(-10deg); }

        /* --- ANIMATIONS --- */
        @keyframes hero-bounce {
            0% { transform: translateY(0) scaleY(1) scaleX(1); }
            10% { transform: translateY(0) scaleY(0.85) scaleX(1.15); }
            25% { transform: translateY(-60px) scaleY(1.1) scaleX(0.9); }
            50% { transform: translateY(0) scaleY(1) scaleX(1); }
            60% { transform: translateY(0) scaleY(0.9) scaleX(1.1); }
            75% { transform: translateY(-30px) scaleY(1.05) scaleX(0.95); }
            100% { transform: translateY(0) scaleY(1) scaleX(1); }
        }
        @keyframes swing-arm { 0%, 100% { transform: rotate(20deg); } 50% { transform: rotate(40deg); } }
        @keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
        @keyframes float-title { 0%, 100% { transform: translateY(0) skewX(-6deg) rotate(-2deg); } 50% { transform: translateY(-10px) skewX(-6deg) rotate(-2deg); } }
        @keyframes pulse-btn { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.02); } }

        /* Responsive */
        @media (max-width: 800px) {
            .game-title h1 { font-size: 3.5rem; }
            .game-title h2 { font-size: 1rem; }
            .hero-anchor { left: 10%; bottom: 120px; transform: translateX(0) scale(0.8); }
            .launch-zone { position: relative; left: auto; bottom: auto; transform: none; margin-top: 20px; }
            .controls-group { display: none; } 
            .bottom-bar { flex-direction: column; align-items: center; justify-content: center; height: auto; padding-bottom: 40px; }
            .left-spacer { display: none; }
        }
    </style>
</head>
<body>

    <!-- VISUAL WORLD (CANVAS) -->
    <canvas id="world-canvas"></canvas>

    <!-- UI OVERLAY -->
    <div id="ui-layer">
        
        <!-- HEADER -->
        <div class="top-bar">
            <!-- Left: Title -->
            <div class="game-title">
                <h1><span>Bouncy</span><span>& Bolt</span></h1>
                <h2>The Great Spring Adventure</h2>
            </div>
            
            <!-- Right: Consolidated HUD -->
            <div class="hud-strip interactive">
                <!-- Coins: 0/100 -->
                <div class="hud-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="10" stroke="#FBC02D" stroke-width="3" fill="#FFEA00"/>
                        <path d="M12 8v8M9 12h6" stroke="#FBC02D" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span>0/100</span>
                </div>
                
                <div class="hud-divider"></div>

                <!-- Lives -->
                <div class="hud-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#D32F2F" stroke="#B71C1C" stroke-width="2"/>
                    </svg>
                    <span>x 3</span>
                </div>

                <div class="hud-divider"></div>

                <!-- World Map -->
                <div class="world-selector">
                    <div class="world-node active" title="Spring Valley"></div>
                    <div class="world-connector"></div>
                    <div class="world-node locked" title="Sand Springs"></div>
                    <div class="world-connector"></div>
                    <div class="world-node locked" title="Cloud Peak"></div>
                </div>
            </div>
        </div>

        <!-- HERO ANCHOR -->
        <div class="hero-anchor">
            <div class="hero-wrapper">
                <div class="hero-body">
                    <div class="limb arm l"></div>
                    <div class="limb arm r"></div>
                    <div class="hero-face">
                        <div class="eye l"></div>
                        <div class="eye r"></div>
                        <div class="mouth"></div>
                    </div>
                    <div class="limb foot l"></div>
                    <div class="limb foot r"></div>
                </div>
                <div class="hero-spring"></div>
            </div>
        </div>

        <!-- BOTTOM BAR -->
        <div class="bottom-bar">
            
            <!-- Spacer -->
            <div class="left-spacer"></div>

            <!-- Center: Start Button -->
            <div class="launch-zone">
                <button class="btn-start interactive" onclick="alert('Level Starting!')">
                    <i class="btn-icon">⚡</i> START
                </button>
            </div>

            <!-- Right: Controls Guide -->
            <div class="controls-group interactive">
                <div class="controls-title">How to Play</div>
                <div class="key-row">
                    <div class="key-icon"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5v10z"/></svg></div>
                    <div class="key-icon"><svg viewBox="0 0 24 24"><path d="M14 7l-5 5 5 5V7z"/></svg></div>
                </div>
                <div class="key-row">
                    <div class="key-icon action">A</div>
                    <div class="key-icon action">B</div>
                </div>
            </div>

        </div>

    </div>

<script>
    /**
     * CANVAS ENGINE - VISUAL DESIGN OVERHAUL
     * Focus: Depth, Hierarchy, Color, and "Mascot" Aesthetic
     */
    const canvas = document.getElementById('world-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let frame = 0;

    // Colors
    const C_SKY_TOP = "#29B6F6";
    const C_SKY_BOT = "#E1F5FE";
    const C_MTN_FAR = "#81D4FA"; // Very Light Blue
    const C_MTN_MID = "#4FC3F7"; // Light Blue
    const C_GRASS = "#76FF03";
    const C_DIRT_A = "#8D6E63";
    const C_DIRT_B = "#795548";
    const C_DARK = "#1A237E"; // Deep Indigo Outline

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- DRAWING HELPERS ---
    function setStyle(fill, stroke, lw = 4) {
        ctx.fillStyle = fill;
        if(stroke) {
            ctx.strokeStyle = stroke;
            ctx.lineWidth = lw;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
        } else {
            ctx.strokeStyle = null;
        }
    }

    // --- LAYER 1: BACKGROUND (Atmosphere) ---
    function drawBackground() {
        // Sky Gradient
        let skyGrad = ctx.createLinearGradient(0, 0, 0, height);
        skyGrad.addColorStop(0, C_SKY_TOP);
        skyGrad.addColorStop(1, C_SKY_BOT);
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, width, height);

        // Clouds (Fluffy Vector Shapes)
        ctx.fillStyle = "rgba(255,255,255,0.95)";
        ctx.strokeStyle = C_DARK;
        ctx.lineWidth = 3;
        
        let cx1 = (frame * 0.2) % (width + 400) - 200;
        drawCloud(cx1, 120, 1.2);
        drawCloud(cx1 - width * 0.4, 80, 0.8);
        
        let cx2 = (frame * 0.1) % (width + 600) - 300;
        drawCloud(cx2 + width * 0.7, 250, 1.8);

        // Distant Mountain Range (Silhouette)
        ctx.beginPath();
        ctx.moveTo(0, height * 0.6);
        // Create a jagged mountain line
        for (let i = 0; i <= width; i+=5) {
            let y = height * 0.6 - Math.sin(i * 0.005 + frame * 0.002) * 80 
                              - Math.cos(i * 0.013) * 40;
            ctx.lineTo(i, y);
        }
        ctx.lineTo(width, height); ctx.lineTo(0, height);
        setStyle(C_MTN_FAR, C_DARK, 2);
        ctx.fill();
        ctx.stroke();
    }

    function drawCloud(x, y, s) {
        ctx.beginPath();
        ctx.arc(x, y, 30*s, 0, Math.PI*2);
        ctx.arc(x+30*s, y-20*s, 40*s, 0, Math.PI*2);
        ctx.arc(x+70*s, y-10*s, 40*s, 0, Math.PI*2);
        ctx.arc(x+100*s, y, 30*s, 0, Math.PI*2);
        ctx.arc(x+50*s, y+10*s, 30*s, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();
    }

    // --- LAYER 2: MIDGROUND (The Level) ---
    function drawMidGround() {
        // Tilted Horizon Logic
        const tilt = Math.sin(frame * 0.01) * 5; 
        const midY = height * 0.75 + tilt;

        // 1. Ground with Checkerboard Pattern
        ctx.beginPath();
        // Ground shape
        ctx.moveTo(0, midY);
        for(let i=0; i<=width; i+=40) {
            ctx.lineTo(i + 20, midY + 8);
            ctx.lineTo(i + 40, midY);
        }
        ctx.lineTo(width, height); ctx.lineTo(0, height);
        
        // Checkerboard Fill
        ctx.save();
        ctx.clip();
        
        // Draw Checkerboard
        const tileSize = 40;
        for(let r=0; r<10; r++) {
            for(let c=0; c<width/tileSize + 2; c++) {
                ctx.fillStyle = (r+c)%2 === 0 ? C_DIRT_A : C_DIRT_B;
                ctx.fillRect(c*tileSize, midY + r*tileSize, tileSize, tileSize);
            }
        }
        ctx.restore();

        // Ground Outline & Grass Top
        ctx.beginPath();
        ctx.moveTo(0, midY);
        for(let i=0; i<=width; i+=40) {
            ctx.lineTo(i + 20, midY + 8);
            ctx.lineTo(i + 40, midY);
        }
        ctx.lineTo(width, midY + 12); ctx.lineTo(0, midY + 12);
        setStyle(C_GRASS, C_DARK, 4);
        ctx.fill(); ctx.stroke();

        // 2. Floating Platform (Left)
        const platX = width * 0.15;
        const platY = midY - 120;
        
        // Platform Body
        ctx.beginPath();
        ctx.roundRect(platX, platY, 160, 40, 10);
        setStyle("#5D4037", C_DARK, 4);
        ctx.fill(); ctx.stroke();
        
        // Platform Grass
        ctx.beginPath();
        ctx.roundRect(platX, platY, 160, 12, [10,10,0,0]);
        setStyle(C_GRASS, C_DARK, 4);
        ctx.fill(); ctx.stroke();

        // 3. Question Block (Pulsing)
        const blockX = platX + 60;
        const blockY = platY - 50;
        const blockPulse = Math.sin(frame * 0.1) * 4;
        
        ctx.beginPath();
        ctx.rect(blockX, blockY + blockPulse, 40, 40);
        setStyle("#FFC107", C_DARK, 4);
        ctx.fill(); ctx.stroke();
        
        // Question Mark
        ctx.fillStyle = C_DARK;
        ctx.font = "bold 28px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("?", blockX + 20, blockY + 22 + blockPulse);

        // 4. Coins (Spinning effect via scale)
        drawCoin(platX + 20, platY - 60);
        drawCoin(platX + 60, platY - 100);
        drawCoin(platX + 100, platY - 60);

        // 5. Enemies (2 Types)
        // Slime
        const enemyX = width * 0.45;
        const enemyY = midY - 25 - (Math.abs(Math.sin(frame * 0.08)) * 20);
        drawSlime(enemyX, enemyY);
        
        // Bat (Flying)
        const batX = width * 0.65;
        const batY = midY - 150 + Math.sin(frame * 0.05) * 20;
        drawBat(batX, batY);

        // 6. Distant Goal (Right Horizon)
        drawGoal(width * 0.85, midY);
    }

    function drawCoin(x, y) {
        const pulse = Math.sin(frame * 0.15) * 3;
        ctx.beginPath();
        ctx.ellipse(x, y, 12, 12 + pulse, 0, 0, Math.PI*2);
        setStyle("#FFEA00", C_DARK, 3);
        ctx.fill(); ctx.stroke();
        
        // Shine
        ctx.beginPath();
        ctx.arc(x - 4, y - 4, 4, 0, Math.PI*2);
        setStyle("rgba(255,255,255,0.8)", null);
        ctx.fill();
    }

    function drawSlime(x, y) {
        ctx.beginPath();
        ctx.arc(x, y, 20, Math.PI, 0); 
        ctx.lineTo(x + 20, y + 15);
        ctx.lineTo(x - 20, y + 15);
        setStyle("#AB47BC", C_DARK, 4); // Purple Slime
        ctx.fill(); ctx.stroke();
        
        // Eyes
        setStyle("#FFF", C_DARK, 2);
        ctx.beginPath(); ctx.arc(x-7, y-5, 6, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(x+7, y-5, 6, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        
        // Pupils
        setStyle(C_DARK, null);
        ctx.beginPath(); ctx.arc(x-7, y-5, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x+7, y-5, 2, 0, Math.PI*2); ctx.fill();
    }

    function drawBat(x, y) {
        ctx.save();
        ctx.translate(x, y);
        // Wings
        const wingY = Math.sin(frame * 0.2) * 10;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-20, -10 + wingY, -35, -5);
        ctx.quadraticCurveTo(-20, 10 + wingY, 0, 0);
        
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(20, -10 + wingY, 35, -5);
        ctx.quadraticCurveTo(20, 10 + wingY, 0, 0);
        
        setStyle("#546E7A", C_DARK, 3);
        ctx.fill(); ctx.stroke();
        
        // Body
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI*2);
        setStyle("#37474F", C_DARK, 3);
        ctx.fill(); ctx.stroke();
        
        // Eyes
        setStyle("#FF3D00", null);
        ctx.beginPath(); ctx.arc(-3, -2, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(3, -2, 2, 0, Math.PI*2); ctx.fill();
        
        ctx.restore();
    }

    function drawGoal(x, y) {
        // Pole
        setStyle("#ECEFF1", C_DARK, 3);
        ctx.fillRect(x, y - 140, 8, 140);
        ctx.strokeRect(x, y - 140, 8, 140);
        
        // Ball
        ctx.beginPath(); ctx.arc(x+4, y-140, 8, 0, Math.PI*2);
        setStyle("#FF3D00", C_DARK, 3);
        ctx.fill(); ctx.stroke();

        // Flag (Waving)
        const flagWave = Math.sin(frame * 0.1) * 5;
        ctx.beginPath();
        ctx.moveTo(x+8, y-135);
        ctx.quadraticCurveTo(x+40, y-120 + flagWave, x+55, y-110);
        ctx.lineTo(x+8, y-95);
        setStyle("#FF3D00", C_DARK, 3);
        ctx.fill(); ctx.stroke();
    }

    // --- LAYER 3: FOREGROUND (Depth Obscuring) ---
    function drawForeground() {
        const foreY = height * 0.90;
        
        // Ground Strip (Vibrant Earth)
        ctx.beginPath();
        ctx.roundRect(0, foreY, width, height - foreY, 0);
        setStyle("#FFB74D", C_DARK, 6); 
        ctx.fill(); ctx.stroke();
        
        // Grass Top
        ctx.beginPath();
        ctx.roundRect(0, foreY, width, 25, [0,0,0,0]);
        setStyle("#689F38", C_DARK, 6);
        ctx.fill(); ctx.stroke();

        // Bushes
        drawBush(80, foreY + 20, 70);
        drawBush(width - 120, foreY + 10, 90);
    }

    function drawBush(x, y, size) {
        ctx.beginPath();
        ctx.arc(x, y, size, Math.PI, 0);
        ctx.arc(x + size*0.8, y, size*0.8, Math.PI, 0);
        ctx.arc(x - size*0.8, y, size*0.8, Math.PI, 0);
        setStyle("#558B2F", C_DARK, 4);
        ctx.fill(); ctx.stroke();
    }

    // --- LOOP ---
    function loop() {
        frame++;
        ctx.clearRect(0, 0, width, height);

        drawBackground();
        drawMidGround();
        drawForeground();

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
