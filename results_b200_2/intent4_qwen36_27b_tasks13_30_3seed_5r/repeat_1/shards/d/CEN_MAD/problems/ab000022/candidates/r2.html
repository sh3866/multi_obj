<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncy & Bolt - The Great Spring Adventure</title>
    <style>
        :root {
            /* Flat 2.0 Palette: Saturated, Vibrant, Clean */
            --c-sky-top: #4FC3F7;
            --c-sky-bot: #B3E5FC;
            --c-mountain-back: #81D4FA;
            --c-mountain-mid: #29B6F6;
            --c-grass-light: #8BC34A;
            --c-grass-dark: #689F38;
            --c-ground-light: #FFCC80;
            --c-ground-dark: #FFA726;
            
            --c-primary: #FF5722; /* Deep Orange */
            --c-primary-dark: #D84315;
            --c-accent: #2196F3;
            --c-gold: #FFEB3B;
            --c-gold-stroke: #FBC02D;
            
            --c-text: #37474F;
            --c-white: #FFFFFF;
            --c-shadow: rgba(0,0,0,0.15);
            
            --font-display: 'Arial Black', 'Impact', sans-serif;
            --font-ui: 'Verdana', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-ui);
            background: var(--c-sky-top);
            color: var(--c-text);
        }

        /* --- CANVAS LAYER --- */
        #world-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* --- UI LAYER --- */
        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        .interactive { pointer-events: auto; cursor: pointer; }

        /* --- 1. VISUAL HIERARCHY: TITLE & STATS --- */
        .top-bar {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            position: relative;
        }

        .game-title {
            text-align: center;
            transform: rotate(-3deg);
            animation: float-title 4s ease-in-out infinite;
            /* Critique: Spring physics typography */
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .game-title:hover {
            transform: rotate(-3deg) scale(1.05, 0.95); /* Elastic stretch */
        }

        .game-title h1 {
            font-family: var(--font-display);
            font-size: 5.5rem;
            line-height: 0.9;
            color: var(--c-white);
            -webkit-text-stroke: 4px var(--c-primary);
            text-shadow: 0px 8px 0px rgba(0,0,0,0.2);
            letter-spacing: -2px;
            text-transform: uppercase;
        }

        .game-title h2 {
            font-family: var(--font-display);
            font-size: 1.8rem;
            color: var(--c-primary);
            background: var(--c-white);
            display: inline-block;
            padding: 8px 24px;
            border-radius: 50px;
            margin-top: 15px;
            box-shadow: 0 6px 0 var(--c-shadow);
            transform: rotate(2deg);
            border: 3px solid var(--c-text);
        }

        /* Stats */
        .stats-container {
            position: absolute;
            right: 0;
            top: 10px;
            display: flex;
            gap: 15px;
        }

        .stat-badge {
            background: var(--c-white);
            border-radius: 30px;
            padding: 5px 20px 5px 5px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 6px 0 var(--c-shadow);
            border: 3px solid var(--c-text);
            font-weight: 800;
            font-size: 1.2rem;
            transform: rotate(3deg);
            transition: transform 0.2s;
        }
        .stat-badge:hover { transform: rotate(3deg) translateY(-2px); }

        /* --- 2. LAYERED LEVEL PREVIEW: WORLD MAP --- */
        .world-map {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            /* Critique: Unified Container */
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 20px;
            border: 3px solid var(--c-text);
            box-shadow: 0 10px 0 var(--c-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .map-path {
            width: 4px;
            height: 25px;
            background: #CFD8DC;
        }

        .map-node {
            width: 70px;
            height: 70px;
            background: #ECEFF1;
            border: 3px solid var(--c-text);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 5px 0 #90A4AE;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .map-node.active {
            border-color: var(--c-primary);
            background: var(--c-white);
            transform: scale(1.15);
            box-shadow: 0 5px 0 var(--c-primary-dark);
            z-index: 2;
        }

        .map-node.locked { filter: grayscale(1); opacity: 0.7; }
        .map-node:hover:not(.locked) { transform: scale(1.1); }

        .map-label {
            position: absolute;
            left: 85px;
            background: var(--c-white);
            padding: 5px 10px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.85rem;
            box-shadow: 0 3px 0 var(--c-shadow);
            white-space: nowrap;
            border: 2px solid var(--c-text);
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.2s;
            pointer-events: none;
        }
        
        .map-node:hover .map-label { opacity: 1; transform: translateX(0); }

        /* --- 3. FLAT 2.0: START BUTTON --- */
        .ground-interaction-area {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 30%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 40px;
            gap: 80px;
            z-index: 20;
        }

        /* Hero */
        .hero-wrapper {
            position: relative;
            width: 140px; height: 180px;
            /* Critique: Spring physics animation */
            animation: hero-bounce 1s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
        }

        .hero-spring-base {
            width: 50px; height: 40px;
            background: #90A4AE;
            border-radius: 5px;
            position: absolute; bottom: 0; left: 45px;
            border: 3px solid var(--c-text);
            z-index: 1;
            overflow: hidden;
            box-shadow: 0 4px 0 #546E7A;
        }
        .spring-coil {
            width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, transparent, transparent 4px, #37474F 4px, #37474F 8px);
        }

        .hero-body {
            width: 100px; height: 100px;
            background: var(--c-primary);
            border-radius: 50%;
            position: absolute; bottom: 30px; left: 20px;
            border: 3px solid var(--c-text);
            z-index: 2;
            box-shadow: 0 6px 0 var(--c-primary-dark);
            /* Critique: Expressiveness */
            transform-origin: bottom center;
        }

        .hero-face {
            width: 50px; height: 30px;
            background: var(--c-white);
            border-radius: 25px 25px 10px 10px;
            position: absolute; top: 30px; left: 25px;
            border: 2px solid var(--c-text);
            overflow: hidden;
        }
        .eye { 
            width: 8px; height: 14px; background: var(--c-text); border-radius: 50%; 
            position: absolute; top: 8px; 
            animation: blink 4s infinite; 
        }
        .eye.l { left: 10px; } .eye.r { right: 10px; }
        
        .hero-mouth {
            width: 15px; height: 8px; 
            border-bottom: 3px solid var(--c-text); border-radius: 0 0 10px 10px;
            position: absolute; bottom: 8px; left: 17px;
        }

        /* Start Button */
        .btn-start-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .btn-start {
            background: var(--c-accent);
            color: var(--c-white);
            font-family: var(--font-display);
            font-size: 2rem;
            text-transform: uppercase;
            padding: 18px 60px;
            border: 4px solid var(--c-text);
            border-radius: 100px;
            cursor: pointer;
            /* Critique: Flat 2.0 Shadow & No Gradient */
            box-shadow: 0 10px 0 #1565C0, 0 15px 20px rgba(0,0,0,0.2);
            transition: all 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
            z-index: 10;
        }

        .btn-start:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 13px 0 #1565C0, 0 20px 25px rgba(0,0,0,0.2);
        }

        .btn-start:active {
            transform: translateY(8px) scale(0.98, 1.02); /* Elastic squash */
            box-shadow: 0 2px 0 #1565C0, 0 5px 10px rgba(0,0,0,0.2);
        }

        /* --- 4. CONTROLS (Bottom Left) --- */
        .controls-group {
            position: absolute;
            bottom: 40px;
            left: 40px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 15px;
            border: 3px solid var(--c-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 0 var(--c-shadow);
            backdrop-filter: blur(5px);
        }

        .controls-title {
            font-family: var(--font-display);
            font-size: 0.9rem;
            color: var(--c-text);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .key-row { display: flex; gap: 6px; }
        
        .key {
            width: 40px; height: 40px;
            background: var(--c-white);
            border: 2px solid var(--c-text);
            border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            font-weight: 800;
            font-size: 1rem;
            color: var(--c-text);
            /* Critique: Consistent 3D Effect */
            box-shadow: 0 4px 0 #CFD8DC; 
            transition: all 0.1s;
        }
        
        .key.large { width: 90px; background: var(--c-primary); color: white; border-color: #E65100; box-shadow: 0 4px 0 #BF360C; }
        
        .key:active { transform: translateY(4px); box-shadow: none; }

        /* --- ANIMATIONS --- */
        @keyframes hero-bounce {
            0%, 100% { transform: translateY(0) scale(1, 1); }
            40% { transform: translateY(-40px) scale(0.95, 1.05); } /* Stretch up */
            50% { transform: translateY(0) scale(1.1, 0.9); } /* Squash down */
        }
        @keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(0.1); } }
        @keyframes float-title { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(-3deg); } }

        /* Responsive */
        @media (max-width: 800px) {
            .game-title h1 { font-size: 3rem; }
            .world-map { left: 10px; padding: 10px; }
            .map-node { width: 50px; height: 50px; }
            .controls-group { left: 10px; bottom: 10px; }
            .ground-interaction-area { gap: 20px; padding-bottom: 10px; }
            .btn-start { font-size: 1.4rem; padding: 12px 40px; }
        }
    </style>
</head>
<body>

    <!-- VISUAL WORLD (CANVAS) -->
    <canvas id="world-canvas"></canvas>

    <!-- UI OVERLAY -->
    <div id="ui-layer">
        
        <!-- HEADER -->
        <div class="top-bar">
            <div class="game-title">
                <h1>Bouncy<br>& Bolt</h1>
                <h2>The Great Spring Adventure</h2>
            </div>
            
            <div class="stats-container interactive">
                <div class="stat-badge">
                    <!-- Flat 2.0 Coin Icon -->
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="10" stroke="#FBC02D" stroke-width="3" fill="#FFEB3B"/>
                        <circle cx="12" cy="12" r="6" fill="#FFF" opacity="0.4"/>
                        <path d="M12 8v8M9 12h6" stroke="#FBC02D" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span>1,240</span>
                </div>
                <div class="stat-badge">
                    <!-- Flat 2.0 Heart Icon -->
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#D32F2F" stroke="#B71C1C" stroke-width="2"/>
                    </svg>
                    <span>x 5</span>
                </div>
            </div>
        </div>

        <!-- LEFT: World Map (Unified Card) -->
        <div class="world-map interactive">
            <div class="map-node active">
                <!-- Cloud Icon -->
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#37474F" stroke-width="2.5" stroke-linecap="round">
                    <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
                </svg>
                <div class="map-label">Spring Valley</div>
            </div>
            <div class="map-path"></div>
            <div class="map-node locked">
                <!-- Sun Icon -->
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2.5" stroke-linecap="round">
                    <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
                <div class="map-label">Sand Springs</div>
            </div>
            <div class="map-path"></div>
            <div class="map-node locked">
                <!-- Mountain Icon -->
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2.5" stroke-linejoin="round">
                    <path d="M21 19H3L12 3 21 19Z"/>
                </svg>
                <div class="map-label">Cloud Peak</div>
            </div>
        </div>

        <!-- BOTTOM LEFT: Controls -->
        <div class="controls-group interactive">
            <div class="controls-title">CONTROLS</div>
            <div class="key-row">
                <div class="key">W</div>
            </div>
            <div class="key-row">
                <div class="key">A</div>
                <div class="key">S</div>
                <div class="key">D</div>
            </div>
            <div class="key large">SPACE</div>
        </div>

        <!-- BOTTOM CENTER: Hero & Start Button -->
        <div class="ground-interaction-area">
            <!-- Hero -->
            <div class="hero-wrapper">
                <div class="hero-body">
                    <div class="hero-face">
                        <div class="eye l"></div>
                        <div class="eye r"></div>
                        <div class="hero-mouth"></div>
                    </div>
                </div>
                <div class="hero-spring-base"><div class="spring-coil"></div></div>
            </div>

            <!-- Start Button -->
            <div class="btn-start-container interactive">
                <button class="btn-start" onclick="alert('Level Starting!')">Start Adventure</button>
            </div>
        </div>

    </div>

<script>
    /**
     * CANVAS ENGINE - REVISED
     * Focus: Parallax, Flat 2.0 Aesthetics, Layered Depth
     */
    const canvas = document.getElementById('world-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let frame = 0;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- DRAWING HELPERS (Flat 2.0 Style) ---

    function drawMountain(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + w/2, y - h);
        ctx.lineTo(x + w, y);
        ctx.fill();
    }

    function drawCloud(x, y, s) {
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.beginPath();
        ctx.arc(x, y, 30*s, 0, Math.PI*2);
        ctx.arc(x+25*s, y-10*s, 35*s, 0, Math.PI*2);
        ctx.arc(x+50*s, y, 30*s, 0, Math.PI*2);
        ctx.fill();
    }

    function drawGroundLayer(yStart, colorTop, colorBot, grassColor, bumpiness) {
        // 1. Main Ground Body
        ctx.fillStyle = colorTop;
        ctx.beginPath();
        ctx.moveTo(0, yStart);
        
        // Create a slightly bumpy horizon line for organic feel
        let currentX = 0;
        while(currentX <= width) {
            let step = 40 + Math.random() * 20;
            let bump = (Math.random() - 0.5) * bumpiness;
            ctx.lineTo(currentX + step/2, yStart + bump);
            ctx.lineTo(currentX + step, yStart);
            currentX += step;
        }
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.fill();

        // 2. Grass Top (Flat 2.0 Highlight)
        ctx.fillStyle = grassColor;
        ctx.beginPath();
        ctx.moveTo(0, yStart);
        currentX = 0;
        while(currentX <= width) {
            let step = 40 + Math.random() * 20;
            let bump = (Math.random() - 0.5) * bumpiness;
            ctx.lineTo(currentX + step/2, yStart + bump);
            ctx.lineTo(currentX + step, yStart);
            currentX += step;
        }
        ctx.lineTo(width, yStart + 15);
        ctx.lineTo(0, yStart + 15);
        ctx.fill();

        // 3. Dirt Texture (Polka dots / subtle noise)
        ctx.fillStyle = "rgba(0,0,0,0.05)";
        for(let i=0; i<width; i+=60) {
            let dy = Math.random() * (height - yStart);
            ctx.beginPath(); ctx.arc(i + Math.random()*20, yStart + 40 + dy, 5 + Math.random()*10, 0, Math.PI*2); ctx.fill();
        }
    }

    function drawBlock(x, y, s) {
        // Flat 2.0 Block
        ctx.fillStyle = "#8D6E63";
        ctx.fillRect(x, y, s, s);
        // Inner Shadow/Highlight
        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.fillRect(x, y, s, s/2);
        // Border
        ctx.strokeStyle = "#3E2723"; ctx.lineWidth = 3;
        ctx.strokeRect(x, y, s, s);
        // Question mark or detail
        ctx.fillStyle = "#3E2723";
        ctx.font = "bold 20px Arial";
        ctx.fillText("?", x + s/2 - 6, y + s/2 + 8);
    }

    function drawCoin(x, y) {
        const pulse = Math.sin(frame * 0.1) * 3;
        ctx.fillStyle = "#FFEB3B";
        ctx.beginPath();
        ctx.arc(x, y, 12 + pulse, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = "#FBC02D";
        ctx.lineWidth = 3;
        ctx.stroke();
        // Shine
        ctx.fillStyle = "rgba(255,255,255,0.8)";
        ctx.beginPath();
        ctx.arc(x - 4, y - 4, 3, 0, Math.PI*2);
        ctx.fill();
    }

    function drawEnemy(x, y, s) {
        // Flat Slime
        ctx.fillStyle = "#E53935";
        ctx.beginPath();
        ctx.arc(x, y, 18*s, Math.PI, 0); 
        ctx.lineTo(x + 18*s, y + 12*s);
        ctx.lineTo(x - 18*s, y + 12*s);
        ctx.fill();
        // Border
        ctx.strokeStyle = "#B71C1C";
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // Eyes
        ctx.fillStyle = "#FFF";
        ctx.beginPath(); ctx.arc(x-6*s, y-3*s, 5*s, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x+6*s, y-3*s, 5*s, 0, Math.PI*2); ctx.fill();
        // Pupils
        ctx.fillStyle = "#000";
        ctx.beginPath(); ctx.arc(x-6*s, y-3*s, 2*s, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x+6*s, y-3*s, 2*s, 0, Math.PI*2); ctx.fill();
    }

    function drawGoal(x, y) {
        // Pole
        ctx.fillStyle = "#ECEFF1";
        ctx.fillRect(x, y, 8, 200);
        // Ball on top
        ctx.fillStyle = "#FF5722";
        ctx.beginPath(); ctx.arc(x+4, y, 10, 0, Math.PI*2); ctx.fill();
        // Flag
        ctx.fillStyle = "#FF5722";
        ctx.beginPath();
        ctx.moveTo(x+8, y+10);
        ctx.lineTo(x+60, y+30);
        ctx.lineTo(x+8, y+50);
        ctx.fill();
    }

    // --- SCENE RENDERING ---

    function loop() {
        frame++;
        ctx.clearRect(0, 0, width, height);

        // 1. SKY
        let skyGrad = ctx.createLinearGradient(0, 0, 0, height);
        skyGrad.addColorStop(0, "#4FC3F7");
        skyGrad.addColorStop(1, "#B3E5FC");
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, width, height);

        // 2. PARALLAX LAYER 1: Distant Mountains (Slowest)
        // Using sine waves to create rolling hills
        ctx.fillStyle = "#81D4FA";
        ctx.beginPath();
        ctx.moveTo(0, height * 0.65);
        for (let i = 0; i <= width; i+=10) {
            ctx.lineTo(i, height * 0.65 - Math.sin(i * 0.005 + frame * 0.002) * 50);
        }
        ctx.lineTo(width, height); ctx.lineTo(0, height);
        ctx.fill();

        // 3. PARALLAX LAYER 2: Mid Mountains (Medium)
        ctx.fillStyle = "#29B6F6";
        ctx.beginPath();
        ctx.moveTo(0, height * 0.7);
        for (let i = 0; i <= width; i+=10) {
            ctx.lineTo(i, height * 0.7 - Math.sin(i * 0.01 + frame * 0.005) * 40);
        }
        ctx.lineTo(width, height); ctx.lineTo(0, height);
        ctx.fill();

        // 4. MID-GROUND (The Main Stage)
        // Clouds
        drawCloud(150 + Math.sin(frame*0.01)*20, 150, 1);
        drawCloud(600 + Math.sin(frame*0.008+1)*20, 100, 0.8);
        drawCloud(900 + Math.sin(frame*0.012+2)*20, 180, 1.2);

        // Main Ground (Starts 65% down)
        const midY = height * 0.65;
        drawGroundLayer(midY, "#FFCC80", "#FFA726", "#8BC34A", 10);
        
        // Platforms on Mid Ground (Integrated into scene)
        const p1x = width * 0.3; 
        drawBlock(p1x, midY - 120, 60);
        drawBlock(p1x + 70, midY - 120, 60);
        drawCoin(p1x + 35, midY - 160);

        // Enemies
        drawEnemy(width * 0.7, midY - 15, 1.2);

        // 5. FOREGROUND (Creates depth, obscures bottom of hero sometimes)
        const foreY = height * 0.85;
        drawGroundLayer(foreY, "#FFB74D", "#F57C00", "#689F38", 20);
        
        // Foreground Bushes
        ctx.fillStyle = "#558B2F"; 
        ctx.beginPath(); ctx.arc(width*0.05, foreY, 40, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(width*0.95, foreY, 60, 0, Math.PI*2); ctx.fill();

        // 6. Distant Goal (Right side)
        drawGoal(width * 0.85, midY - 200);

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
