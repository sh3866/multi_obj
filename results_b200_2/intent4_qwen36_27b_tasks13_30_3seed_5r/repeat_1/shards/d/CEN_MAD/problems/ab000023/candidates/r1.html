<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Visual: Play Signage</title>
    <style>
        :root {
            /* Palette */
            --bg-studio: #EAEAEA;
            --bg-floor: #D5D5D5;
            --sign-face: #FFFFFF;
            --sign-depth: #E0E0E0; /* Darker white for the side profile */
            --sign-highlight: #F5F5F5;
            --brand-red: #D91C1C;
            --brand-red-dark: #A81010;
            --metal-light: #FFFFFF;
            --metal-mid: #B0B0B0;
            --metal-dark: #707070;
            
            /* Typography */
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-studio);
            /* Minimal Studio Gradient */
            background-image: radial-gradient(circle at 50% 30%, #ffffff 0%, #e0e0e0 60%, #d0d0d0 100%);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-sans);
            perspective: 1200px; /* Essential for the 3D sign */
        }

        /* --- Scene Container --- */
        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
        }

        /* --- Floor Line / Grounding --- */
        .floor-line {
            position: absolute;
            bottom: 25%;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.1) 20%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.1) 80%, transparent 100%);
            z-index: 0;
        }

        /* --- The Sign Object (3D Construct) --- */
        .sign-wrapper {
            position: relative;
            width: 400px;
            height: 500px;
            /* Initial subtle angle */
            transform: rotateX(4deg) rotateY(-12deg);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out; /* Smooth follow for JS */
        }

        /* 1. The Side Profile (Thickness - 20mm representation) */
        .sign-depth {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--sign-depth);
            border-radius: 8px;
            /* Push it back to create thickness */
            transform: translateZ(-20px);
            /* Side lighting simulation */
            box-shadow: 
                inset 2px 0 5px rgba(255,255,255,0.8), /* Top edge highlight */
                inset -2px 0 5px rgba(0,0,0,0.1),     /* Right edge shadow */
                inset 0 2px 5px rgba(255,255,255,0.5), /* Top edge highlight */
                inset 0 -2px 5px rgba(0,0,0,0.1);      /* Bottom edge shadow */
        }

        /* 2. The Front Face */
        .sign-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--sign-face);
            border-radius: 8px;
            transform: translateZ(0px);
            /* Crisp edge highlight */
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        /* 3. Sharp Drop Shadow (Studio Light) */
        /* We create a pseudo-element that acts as a hard shadow cast on the "wall" */
        .sign-shadow {
            position: absolute;
            top: 20px; /* Offset Y */
            left: 30px; /* Offset X */
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.15);
            border-radius: 8px;
            /* Push it back against the wall */
            transform: translateZ(-40px);
            filter: blur(1px); /* Just barely soft to avoid aliasing, but mostly hard */
            z-index: 0;
        }

        /* --- Mounting Hardware (Metallic Brackets) --- */
        .bracket {
            position: absolute;
            width: 140px;
            height: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1; /* Behind face, but visually connecting to depth */
            border-radius: 2px;
            /* Metallic Gradient */
            background: linear-gradient(180deg, var(--metal-light) 0%, var(--metal-mid) 40%, var(--metal-dark) 100%);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .bracket-top {
            top: 40px;
            /* Connects visually to the depth layer */
            transform: translateX(-50%) translateZ(-10px); 
        }

        .bracket-bottom {
            bottom: 40px;
            transform: translateX(-50%) translateZ(-10px);
        }

        /* Screws in the brackets */
        .screw {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle at 30% 30%, var(--metal-light), var(--metal-dark));
            border-radius: 50%;
            top: 3px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.6), 0 1px 1px rgba(255,255,255,0.5);
        }
        .screw::after {
            content: '';
            position: absolute;
            top: 3.5px;
            left: 1px;
            width: 6px;
            height: 1px;
            background: rgba(0,0,0,0.4);
            box-shadow: 0 1px 0 rgba(255,255,255,0.3);
            transform: rotate(-45deg);
        }
        .screw-l { left: 15px; }
        .screw-r { right: 15px; }

        /* --- The Emblem (SVG) --- */
        .emblem {
            width: 180px;
            height: 180px;
            /* No CSS filter glow, purely SVG gradients */
        }

        /* --- Interaction --- */
        /* Subtle hover lift */
        .sign-wrapper:hover {
            /* JS handles the rotation, CSS just adds a slight scale */
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

    </style>
</head>
<body>

    <div class="scene">
        <!-- Grounding Line -->
        <div class="floor-line"></div>

        <div class="sign-wrapper" id="sign">
            
            <!-- Hard Shadow cast on wall -->
            <div class="sign-shadow"></div>

            <!-- 20mm Thickness Layer -->
            <div class="sign-depth"></div>

            <!-- Hardware: Top Bracket -->
            <div class="bracket bracket-top">
                <div class="screw screw-l"></div>
                <div class="screw screw-r"></div>
            </div>

            <!-- Hardware: Bottom Bracket -->
            <div class="bracket bracket-bottom">
                <div class="screw screw-l"></div>
                <div class="screw screw-r"></div>
            </div>

            <!-- Front Face -->
            <div class="sign-face">
                <!-- SVG Emblem -->
                <svg class="emblem" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Crisp Radial Gradient for Red Circle -->
                        <radialGradient id="redGrad" cx="30%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#FF3333" /> <!-- Highlight -->
                            <stop offset="40%" stop-color="#D91C1C" /> <!-- Base -->
                            <stop offset="100%" stop-color="#800000" /> <!-- Deep Shadow -->
                        </radialGradient>
                    </defs>
                    
                    <!-- The Red Circle -->
                    <circle cx="100" cy="100" r="80" fill="url(#redGrad)" />
                    
                    <!-- The Play Triangle -->
                    <!-- Geometrically centered and sharp -->
                    <path d="M90 70 L140 100 L90 130 Z" 
                          fill="#FFFFFF" 
                          stroke="#FFFFFF" 
                          stroke-width="2" 
                          stroke-linejoin="round" />
                </svg>
            </div>

        </div>
    </div>

    <script>
        // Interaction: Subtle parallax tilt based on mouse position
        // This enhances the 3D nature of the sign without breaking the "studio" stillness
        const sign = document.getElementById('sign');
        const scene = document.querySelector('.scene');

        scene.addEventListener('mousemove', (e) => {
            const rect = scene.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            // Calculate rotation: Max 15 degrees
            // Invert X rotation for natural feel (mouse up -> look up)
            const rotateY = ((x - centerX) / centerX) * 15; 
            const rotateX = -((y - centerY) / centerY) * 15;

            // Apply transform
            // Note: We keep the initial offset (-12deg Y, 4deg X) and add the delta
            // Or just purely drive it. Let's drive it purely for responsiveness.
            sign.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        // Reset on leave (optional, but keeps it centered)
        scene.addEventListener('mouseleave', () => {
            sign.style.transform = `rotateX(4deg) rotateY(-12deg)`;
        });
    </script>
</body>
</html>
