<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Product Scene: Premium Play Signage</title>
    <style>
        :root {
            /* Environment - Deeper Studio Contrast */
            --bg-wall: #E8EBF0;
            --bg-floor: #D1D5DB;
            --floor-line: #C4C9D1;
            
            /* Sign Materials */
            --sign-face-center: #FFFFFF;
            --sign-face-edge: #F0F2F5;
            --brand-red: #E62020;
            
            /* Hardware */
            --chrome-light: #FFFFFF;
            --chrome-mid: #9E9E9E;
            --chrome-dark: #555555;

            /* Dimensions */
            --sign-width: 560px;
            --sign-height: 340px;
            --extrusion-depth: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1800px;
            /* Darker, richer background gradient */
            background: linear-gradient(to bottom, var(--bg-wall) 55%, var(--bg-floor) 55%);
        }

        /* --- Studio Context --- */
        
        /* Vignette for depth */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.15) 100%);
            z-index: 100;
        }

        /* Floor Horizon Line - Refined */
        .horizon {
            position: absolute;
            top: 55%;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--floor-line);
            z-index: 0;
            box-shadow: 0 0 30px rgba(255,255,255,0.5);
        }

        /* --- Scene Container --- */
        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
        }

        /* --- The 3D Object Group --- */
        .object-group {
            position: relative;
            width: var(--sign-width);
            height: var(--sign-height);
            transform-style: preserve-3d;
            /* Resting pose: Slight tilt to show bevel */
            transform: rotateX(8deg) rotateY(-15deg);
            transition: transform 0.1s ease-out;
        }

        /* --- 1. The Extrusion (The Bevel) --- */
        /* Constructing a visible side profile */
        .sign-extrusion {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Gradient simulates light hitting the side edge (White -> Grey -> Dark) */
            background: linear-gradient(to bottom, #FFFFFF 0%, #E0E0E0 50%, #A0A0A0 100%);
            border-radius: 12px;
            /* Push back to create depth */
            transform: translateZ(calc(var(--extrusion-depth) * -1));
        }

        /* --- 2. The Front Face --- */
        .sign-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Radial gradient for studio lighting on the surface */
            background: radial-gradient(circle at 50% 50%, var(--sign-face-center) 0%, var(--sign-face-edge) 100%);
            border-radius: 12px;
            transform: translateZ(0);
            
            /* Subtle border for edge definition */
            border: 1px solid rgba(0,0,0,0.03);
            
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.8); /* Inner glow */
        }

        /* --- 3. Shadows (Multi-layered) --- */
        
        /* Layer 1: Tight shadow immediately below bevel (Thickness definition) */
        .shadow-thickness {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            transform: translateZ(calc(var(--extrusion-depth) * -1.5)) translateY(4px) scale(0.99);
            filter: blur(4px);
            z-index: -1;
        }

        /* Layer 2: Soft, wide shadow further down (Grounding) */
        .shadow-ground {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.15);
            border-radius: 12px;
            transform: translateZ(-120px) translateY(140px) scale(0.95) skewX(-15deg);
            filter: blur(25px);
            opacity: 0.7;
            z-index: -2;
        }

        /* --- 4. Mounting Hardware (Detailed Screws) --- */
        .hardware-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20; /* Above face */
        }

        .screw {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            /* Metallic Gradient */
            background: radial-gradient(circle at 35% 35%, var(--chrome-light), var(--chrome-mid) 60%, var(--chrome-dark));
            /* Drop shadow to make it pop off the face */
            box-shadow: 1px 1px 2px rgba(0,0,0,0.4), inset -1px -1px 1px rgba(0,0,0,0.2);
        }

        /* Phillips Head Detail */
        .screw::before, .screw::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 1.5px;
            background-color: #333;
            transform: translate(-50%, -50%);
        }
        .screw::before { transform: translate(-50%, -50%) rotate(45deg); }
        .screw::after { transform: translate(-50%, -50%) rotate(-45deg); }

        /* Positioning Screws */
        .screw.tl { top: 25px; left: 25px; }
        .screw.tr { top: 25px; right: 25px; }
        .screw.bl { bottom: 25px; left: 25px; }
        .screw.br { bottom: 25px; right: 25px; }

        /* --- 5. The Emblem (SVG) --- */
        .emblem-container {
            width: 180px;
            height: 180px;
            position: relative;
            /* Lift from surface */
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15));
        }

        /* Interaction */
        .scene:hover .object-group {
            cursor: grab;
        }
        .scene:active .object-group {
            cursor: grabbing;
        }

    </style>
</head>
<body>

    <div class="vignette"></div>

    <div class="scene">
        <!-- Horizon Line -->
        <div class="horizon"></div>

        <!-- 3D Object Group -->
        <div class="object-group" id="signObject">
            
            <!-- Layered Shadows -->
            <div class="shadow-ground"></div>
            <div class="shadow-thickness"></div>

            <!-- Extrusion (Thickness) -->
            <div class="sign-extrusion"></div>

            <!-- Front Face -->
            <div class="sign-face">
                
                <div class="emblem-container">
                    <svg width="100%" height="100%" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- 1. Volume Gradient for Red Circle -->
                            <radialGradient id="redVolume" cx="40%" cy="40%" r="60%">
                                <stop offset="0%" stop-color="#FF5252" />
                                <stop offset="40%" stop-color="#E62020" />
                                <stop offset="90%" stop-color="#C62828" />
                                <stop offset="100%" stop-color="#8E0000" />
                            </radialGradient>

                            <!-- 2. Glossy Overlay Gradient -->
                            <linearGradient id="glassReflection" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
                                <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.0" />
                                <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
                            </linearGradient>

                            <clipPath id="circleClip">
                                <circle cx="100" cy="100" r="85" />
                            </clipPath>
                        </defs>

                        <!-- The Main Red Button -->
                        <circle cx="100" cy="100" r="85" fill="url(#redVolume)" />
                        
                        <!-- The Glossy Overlay -->
                        <rect x="0" y="0" width="200" height="200" fill="url(#glassReflection)" clip-path="url(#circleClip)" />

                        <!-- The Play Triangle -->
                        <path d="M88 70 L148 100 L88 130 Z" 
                              fill="#FFFFFF" 
                              stroke="#FFFFFF" 
                              stroke-width="2" 
                              stroke-linejoin="round"
                              filter="drop-shadow(2px 2px 3px rgba(0,0,0,0.15))" />
                    </svg>
                </div>

                <!-- Hardware (Screws) -->
                <div class="hardware-container">
                    <div class="screw tl"></div>
                    <div class="screw tr"></div>
                    <div class="screw bl"></div>
                    <div class="screw br"></div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Interaction: Parallax Tilt
        const scene = document.querySelector('.scene');
        const object = document.getElementById('signObject');
        
        const maxRotation = 15;
        const initialX = 8;     // Initial rotateX
        const initialY = -15;   // Initial rotateY

        scene.addEventListener('mousemove', (e) => {
            const rect = scene.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const percentX = (x - centerX) / centerX;
            const percentY = (y - centerY) / centerY;
            
            const rotateY = initialY + (percentX * maxRotation);
            const rotateX = initialX + (percentY * -maxRotation);

            object.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        scene.addEventListener('mouseleave', () => {
            object.style.transition = 'transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)';
            object.style.transform = `rotateX(${initialX}deg) rotateY(${initialY}deg)`;
            
            setTimeout(() => {
                object.style.transition = 'transform 0.1s ease-out';
            }, 600);
        });
    </script>
</body>
</html>
