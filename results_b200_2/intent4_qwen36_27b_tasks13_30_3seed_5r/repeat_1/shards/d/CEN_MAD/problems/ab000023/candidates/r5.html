<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Product Scene: Premium Play Signage</title>
    <style>
        :root {
            /* Environment - Seamless Studio */
            --bg-wall-top: #F5F5F5;
            --bg-wall-bottom: #E0E0E0;
            --bg-floor-top: #D0D0D0;
            --bg-floor-bottom: #A8A8A8;
            
            /* Sign Materials */
            --sign-white: #FFFFFF;
            --brand-red: #D91B1B;
            
            /* Lighting */
            --light-angle-x: 20px;
            --light-angle-y: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #E0E0E0; /* Fallback */
        }

        /* --- Seamless Background Context --- */
        .studio-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -10;
            /* Smooth gradient transition from wall to floor */
            background: linear-gradient(to bottom, 
                var(--bg-wall-top) 0%, 
                var(--bg-wall-bottom) 45%, 
                var(--bg-floor-top) 45%, 
                var(--bg-floor-bottom) 100%);
        }

        /* Subtle floor shadow gradient at intersection */
        .floor-intersection {
            position: absolute;
            top: 45%;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.05), transparent);
            z-index: -5;
        }

        /* Vignette for depth */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.2) 100%);
            z-index: 100;
        }

        /* --- Scene Container --- */
        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
        }

        /* --- The 3D Object Group --- */
        .object-group {
            position: relative;
            width: 600px; /* Scaled up */
            height: 400px; /* Scaled up */
            transform-style: preserve-3d;
            /* Shifted vertically to sit higher on the 'wall' */
            margin-top: -100px; 
            /* Resting pose */
            transform: rotateX(5deg) rotateY(-10deg);
            transition: transform 0.1s ease-out;
        }

        /* --- 1. The Extrusion (3D Volume) --- */
        .sign-extrusion {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #F8F9FA; /* Very light grey/white */
            border-radius: 16px;
            /* Push back to create depth */
            transform: translateZ(-20px);
            /* Soft edge shadow */
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
        }

        /* --- 2. The Front Face --- */
        .sign-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--sign-white);
            border-radius: 16px;
            transform: translateZ(0);
            
            /* Rim Light & Shadow strokes for definition */
            /* Top/Left Light */
            border-top: 1px solid rgba(255,255,255,0.9);
            border-left: 1px solid rgba(255,255,255,0.9);
            /* Bottom/Right Shadow */
            border-bottom: 1px solid rgba(0,0,0,0.1);
            border-right: 1px solid rgba(0,0,0,0.1);
            
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            
            /* Inner shadow for surface realism */
            box-shadow: inset 0 0 40px rgba(255,255,255,0.5);
        }

        /* --- 3. Shadows (Multi-layered) --- */
        
        /* Layer 1: Immediate thickness shadow */
        .shadow-thickness {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.15);
            border-radius: 16px;
            transform: translateZ(-22px); /* Just behind extrusion */
            z-index: -1;
        }

        /* Layer 2: Cast Shadow on the Wall/Floor */
        .shadow-cast {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            /* Directional shadow matching light angle */
            transform: translateZ(-150px) translate(var(--light-angle-x), var(--light-angle-y)) rotate(2deg);
            filter: blur(20px);
            opacity: 0.6;
            z-index: -2;
            /* Mask to simulate fading shadow on floor */
            mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
        }

        /* --- 4. Hardware (Detailed Screws) --- */
        .hardware-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        .screw {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            /* Metallic Gradient */
            background: radial-gradient(circle at 30% 30%, #FFFFFF 0%, #D1D1D1 40%, #757575 100%);
            /* Drop shadow to make it pop off the face */
            box-shadow: 0px 2px 4px rgba(0,0,0,0.4), inset 0px -1px 2px rgba(0,0,0,0.2);
        }

        /* Phillips Head Detail */
        .screw::before, .screw::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 1.5px;
            background-color: #333;
            transform-origin: center;
            /* Indent effect */
            box-shadow: 0 1px 0 rgba(255,255,255,0.5); 
        }
        .screw::before { transform: translate(-50%, -50%) rotate(45deg); }
        .screw::after { transform: translate(-50%, -50%) rotate(-45deg); }

        /* Positioning Screws */
        .screw.tl { top: 30px; left: 30px; }
        .screw.tr { top: 30px; right: 30px; }
        .screw.bl { bottom: 30px; left: 30px; }
        .screw.br { bottom: 30px; right: 30px; }

        /* --- 5. The Emblem (SVG) --- */
        .emblem-container {
            width: 240px; /* Scaled up */
            height: 240px;
            position: relative;
            /* Directional drop shadow matching scene lighting */
            filter: drop-shadow(var(--light-angle-x) var(--light-angle-y) 15px rgba(0,0,0,0.25));
        }

        /* Interaction */
        .scene:hover .object-group {
            cursor: grab;
        }
        .scene:active .object-group {
            cursor: grabbing;
        }

    </style>
</head>
<body>

    <div class="studio-bg"></div>
    <div class="floor-intersection"></div>
    <div class="vignette"></div>

    <div class="scene">
        <!-- 3D Object Group -->
        <div class="object-group" id="signObject">
            
            <!-- Layered Shadows -->
            <div class="shadow-cast"></div>
            <div class="shadow-thickness"></div>

            <!-- Extrusion (Thickness) -->
            <div class="sign-extrusion"></div>

            <!-- Front Face -->
            <div class="sign-face">
                
                <div class="emblem-container">
                    <svg width="100%" height="100%" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- 1. Volume Gradient for Red Circle -->
                            <radialGradient id="redVolume" cx="35%" cy="35%" r="65%">
                                <stop offset="0%" stop-color="#FF6659" /> <!-- Highlight -->
                                <stop offset="30%" stop-color="#E62020" /> <!-- Base -->
                                <stop offset="80%" stop-color="#B71C1C" /> <!-- Shadow -->
                                <stop offset="100%" stop-color="#7F0000" /> <!-- Rim Shadow -->
                            </radialGradient>

                            <!-- 2. Specular Highlight (Glossy Button Feel) -->
                            <linearGradient id="glassReflection" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7" />
                                <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.0" />
                                <stop offset="100%" stop-color="#000000" stop-opacity="0.1" />
                            </linearGradient>

                            <clipPath id="circleClip">
                                <circle cx="100" cy="100" r="80" />
                            </clipPath>
                        </defs>

                        <!-- The Main Red Button -->
                        <circle cx="100" cy="100" r="80" fill="url(#redVolume)" />
                        
                        <!-- The Glossy Overlay -->
                        <rect x="0" y="0" width="200" height="200" fill="url(#glassReflection)" clip-path="url(#circleClip)" />

                        <!-- The Play Triangle -->
                        <!-- Shifted slightly to optical center and rounded -->
                        <path d="M85 75 L145 100 L85 125 Z" 
                              fill="#FFFFFF" 
                              stroke="#FFFFFF" 
                              stroke-width="1" 
                              stroke-linejoin="round" />
                    </svg>
                </div>

                <!-- Hardware (Screws) -->
                <div class="hardware-container">
                    <div class="screw tl"></div>
                    <div class="screw tr"></div>
                    <div class="screw bl"></div>
                    <div class="screw br"></div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Interaction: Parallax Tilt
        const scene = document.querySelector('.scene');
        const object = document.getElementById('signObject');
        
        const maxRotation = 12;
        const initialX = 5;     // Initial rotateX
        const initialY = -10;   // Initial rotateY

        scene.addEventListener('mousemove', (e) => {
            const rect = scene.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const percentX = (x - centerX) / centerX;
            const percentY = (y - centerY) / centerY;
            
            const rotateY = initialY + (percentX * maxRotation);
            const rotateX = initialX + (percentY * -maxRotation);

            object.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        scene.addEventListener('mouseleave', () => {
            object.style.transition = 'transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)';
            object.style.transform = `rotateX(${initialX}deg) rotateY(${initialY}deg)`;
            
            setTimeout(() => {
                object.style.transition = 'transform 0.1s ease-out';
            }, 600);
        });
    </script>
</body>
</html>
