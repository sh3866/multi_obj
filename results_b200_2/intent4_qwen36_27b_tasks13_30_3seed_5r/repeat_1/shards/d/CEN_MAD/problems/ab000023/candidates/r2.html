<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Product Scene: Play Signage</title>
    <style>
        :root {
            /* Environment */
            --bg-wall-top: #F2F2F2;
            --bg-wall-bottom: #DCDCDC;
            --bg-floor-top: #E0E0E0;
            --bg-floor-bottom: #B0B0B0;
            
            /* Sign Materials */
            --sign-face: #FFFFFF;
            --sign-edge: #D1D1D1; /* The extruded side */
            --sign-highlight: #FFFFFF;
            --brand-red: #E62020;
            --brand-red-shadow: #8A0000;
            
            /* Hardware */
            --chrome-light: #FFFFFF;
            --chrome-mid: #A0A0A0;
            --chrome-dark: #555555;

            /* Dimensions */
            --sign-width: 420px;
            --sign-height: 560px;
            --extrusion-depth: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1500px; /* Deep perspective for realistic 3D */
            
            /* Studio Environment Setup */
            background: linear-gradient(to bottom, var(--bg-wall-top) 0%, var(--bg-wall-bottom) 65%, var(--bg-floor-top) 65%, var(--bg-floor-bottom) 100%);
        }

        /* --- Scene Container --- */
        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
        }

        /* The Horizon Line (Visual Anchor) */
        .horizon {
            position: absolute;
            top: 65%; /* Matches background gradient shift */
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(0,0,0,0.05);
            z-index: 0;
            pointer-events: none;
        }

        /* --- The 3D Object Group --- */
        .object-group {
            position: relative;
            width: var(--sign-width);
            height: var(--sign-height);
            transform-style: preserve-3d;
            /* Initial pose: Slight angle to show depth */
            transform: rotateX(2deg) rotateY(-15deg);
            transition: transform 0.1s ease-out;
        }

        /* --- 1. The Extrusion (Thickness) --- */
        .sign-extrusion {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--sign-edge);
            border-radius: 12px;
            /* Push back to create thickness */
            transform: translateZ(calc(var(--extrusion-depth) * -1));
            
            /* Lighting on the side profile */
            box-shadow: 
                inset 0 0 0 1px rgba(255,255,255,0.4), /* Top edge rim */
                inset 2px 0 8px rgba(255,255,255,0.6), /* Left edge light */
                inset -2px 0 8px rgba(0,0,0,0.1);      /* Right edge shadow */
        }

        /* --- 2. The Front Face --- */
        .sign-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--sign-face);
            border-radius: 12px;
            transform: translateZ(0);
            
            /* Matte finish with subtle edge highlight */
            box-shadow: 
                inset 0 1px 2px rgba(255,255,255,1), 
                inset 0 -1px 2px rgba(0,0,0,0.05);
            
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* --- 3. Mounting Hardware (Chrome Standoffs) --- */
        .hardware {
            position: absolute;
            left: -12px; /* Position on the left edge */
            width: 24px;
            height: 100%;
            transform-style: preserve-3d;
            z-index: 5; /* Behind the face, but in front of the extrusion logic */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 50px 0; /* Spacing from top/bottom */
        }

        .standoff {
            position: relative;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--chrome-light), var(--chrome-mid) 60%, var(--chrome-dark));
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
            
            /* The "stem" of the standoff connecting to the wall */
            &::before {
                content: '';
                position: absolute;
                top: 50%;
                left: 50%;
                width: 16px;
                height: 40px; /* Length of the standoff */
                background: linear-gradient(90deg, var(--chrome-mid), var(--chrome-light), var(--chrome-dark));
                transform: translate(-50%, -50%) translateZ(-20px); /* Connects back to wall */
                border-radius: 2px;
                box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            }
            
            /* Screw head detail */
            &::after {
                content: '';
                position: absolute;
                top: 50%;
                left: 50%;
                width: 10px;
                height: 10px;
                background: #333;
                border-radius: 50%;
                transform: translate(-50%, -50%);
                box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
            }
        }

        /* --- 4. Shadows --- */
        
        /* Contact Shadow (Under the sign, on the floor) */
        .contact-shadow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            transform: translateZ(-200px) translateY(30px) scale(0.95); /* Pushed down to floor plane */
            filter: blur(12px);
            z-index: -1;
        }

        /* Cast Shadow (On the "wall" to the right) */
        .wall-shadow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.15);
            border-radius: 12px;
            /* Pushed back against the wall plane */
            transform: translateZ(-40px) translateX(40px) translateY(10px); 
            filter: blur(15px);
            z-index: -2;
        }

        /* --- 5. The Emblem (SVG) --- */
        .emblem-container {
            width: 220px;
            height: 220px;
            position: relative;
            /* Subtle inner shadow on the sign face behind the emblem for depth */
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        /* Interaction */
        .scene:hover .object-group {
            cursor: pointer;
        }

    </style>
</head>
<body>

    <div class="scene">
        <!-- Horizon Line -->
        <div class="horizon"></div>

        <!-- 3D Object Group -->
        <div class="object-group" id="signObject">
            
            <!-- Shadows -->
            <div class="wall-shadow"></div>
            <div class="contact-shadow"></div>

            <!-- Hardware (Behind Face) -->
            <div class="hardware">
                <div class="standoff"></div>
                <div class="standoff"></div>
            </div>

            <!-- Thickness Extrusion -->
            <div class="sign-extrusion"></div>

            <!-- Front Face -->
            <div class="sign-face">
                
                <div class="emblem-container">
                    <svg width="100%" height="100%" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- 1. Volume Gradient for Red Circle -->
                            <radialGradient id="redVolume" cx="35%" cy="35%" r="65%">
                                <stop offset="0%" stop-color="#FF4D4D" /> <!-- Highlight -->
                                <stop offset="45%" stop-color="#E62020" /> <!-- Base -->
                                <stop offset="95%" stop-color="#990000" /> <!-- Shadow -->
                            </radialGradient>

                            <!-- 2. Glossy Overlay Gradient -->
                            <linearGradient id="glassReflection" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
                                <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.0" />
                                <stop offset="100%" stop-color="#000000" stop-opacity="0.1" />
                            </linearGradient>

                            <!-- 3. Inner Shadow for the Button itself -->
                            <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
                                <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
                                <feOffset dx="2" dy="4" result="offsetBlur"/>
                                <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
                            </filter>
                        </defs>

                        <!-- The Main Red Button -->
                        <circle cx="100" cy="100" r="85" fill="url(#redVolume)" filter="url(#innerShadow)" />
                        
                        <!-- The Glossy Overlay (Glass effect) -->
                        <path d="M 15 100 A 85 85 0 0 1 185 100 A 85 85 0 0 1 15 100" fill="url(#glassReflection)" />

                        <!-- The Play Triangle -->
                        <!-- Geometrically centered: Center of circle is 100,100 -->
                        <!-- Triangle centroid math for equilateral triangle height ~86.6 -->
                        <path d="M82 68 L142 100 L82 132 Z" 
                              fill="#FFFFFF" 
                              stroke="#FFFFFF" 
                              stroke-width="4" 
                              stroke-linejoin="round"
                              filter="drop-shadow(2px 4px 4px rgba(0,0,0,0.2))" />
                    </svg>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Enhanced Interaction: Parallax Tilt
        // Calculates mouse position relative to center to rotate the object
        // This highlights the 3D extrusion and metallic hardware.
        
        const scene = document.querySelector('.scene');
        const object = document.getElementById('signObject');
        
        // Configuration
        const maxRotation = 12; // Max degrees to tilt
        const initialX = 2;     // Initial rotateX
        const initialY = -15;   // Initial rotateY

        scene.addEventListener('mousemove', (e) => {
            const rect = scene.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            // Calculate percentage from center (-1 to 1)
            const percentX = (x - centerX) / centerX;
            const percentY = (y - centerY) / centerY;
            
            // Apply rotation (Invert X axis rotation for natural feel)
            // We add the delta to the initial resting pose
            const rotateY = initialY + (percentX * maxRotation);
            const rotateX = initialX + (percentY * -maxRotation);

            object.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        // Reset to resting pose when mouse leaves
        scene.addEventListener('mouseleave', () => {
            object.style.transition = 'transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1)';
            object.style.transform = `rotateX(${initialX}deg) rotateY(${initialY}deg)`;
            
            // Remove transition delay after reset so mousemove is snappy again
            setTimeout(() => {
                object.style.transition = 'transform 0.1s ease-out';
            }, 500);
        });
    </script>
</body>
</html>
