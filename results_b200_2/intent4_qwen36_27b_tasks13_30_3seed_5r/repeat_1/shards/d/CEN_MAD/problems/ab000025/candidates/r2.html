<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Study: The Grip</title>
    <style>
        :root {
            --bg-color: #050505;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Full-screen container to handle the crop */
        .canvas-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* The SVG scales to fit, but we want a "zoomed in" look */
        svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Vignette for editorial depth */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 40%, #000000 100%);
            z-index: 10;
        }

        /* Grain Texture */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            opacity: 0.07;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body>

    <div class="canvas-wrapper">
        <div class="vignette"></div>
        <div class="noise-overlay"></div>

        <!-- 
          VIEWBOX: 200 250 500 650 
          This tight crop focuses strictly on the hand-phone interaction, 
          cutting off the bottom of the wrist and top of the phone to emphasize the grip.
        -->
        <svg viewBox="200 250 500 650" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- SKIN GRADIENTS -->
                <!-- Main skin tone: Warm highlights, cool deep shadows -->
                <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#E8Cbb5" /> <!-- Top Left Highlight -->
                    <stop offset="40%" stop-color="#C49A82" /> <!-- Mid Tone -->
                    <stop offset="85%" stop-color="#754D38" /> <!-- Shadow -->
                    <stop offset="100%" stop-color="#3D261B" /> <!-- Deep Crevice -->
                </linearGradient>

                <linearGradient id="palmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#B0806A" />
                    <stop offset="100%" stop-color="#3D261B" />
                </linearGradient>

                <!-- DEVICE GRADIENTS -->
                <linearGradient id="titaniumFrame" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#666" />
                    <stop offset="20%" stop-color="#222" />
                    <stop offset="50%" stop-color="#111" />
                    <stop offset="80%" stop-color="#444" />
                    <stop offset="100%" stop-color="#000" />
                </linearGradient>

                <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#2a2a2a" />
                    <stop offset="50%" stop-color="#111" />
                    <stop offset="100%" stop-color="#050505" />
                </linearGradient>

                <!-- LENS GRADIENT -->
                <radialGradient id="lensGlass" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#444" />
                    <stop offset="60%" stop-color="#111" />
                    <stop offset="100%" stop-color="#000" />
                </radialGradient>

                <!-- FILTERS -->
                <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
                    <feOffset dx="10" dy="20" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.6" />
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <filter id="blurSmall">
                    <feGaussianBlur stdDeviation="2" />
                </filter>
            </defs>

            <!-- 1. DEVICE (Background Layer relative to Hand) -->
            <g id="device" transform="translate(260, 100) rotate(-15)" filter="url(#softShadow)">
                <!-- Chassis -->
                <rect x="0" y="0" width="180" height="480" rx="28" fill="url(#titaniumFrame)" stroke="#000" stroke-width="1" />
                
                <!-- Screen -->
                <rect x="8" y="8" width="164" height="464" rx="22" fill="url(#screenGlass)" />
                
                <!-- Screen Glare (Diagonal reflection) -->
                <path d="M 8 8 L 172 8 L 172 200 L 8 350 Z" fill="rgba(255,255,255,0.03)" pointer-events="none" />
                
                <!-- Camera Array (Top Left) -->
                <g transform="translate(15, 20)">
                    <circle cx="15" cy="15" r="14" fill="#050505" stroke="#333" stroke-width="1" />
                    <circle cx="15" cy="15" r="10" fill="url(#lensGlass)" />
                    <circle cx="18" cy="12" r="2" fill="rgba(255,255,255,0.4)" filter="url(#blurSmall)" /> <!-- Reflection -->
                </g>
                <g transform="translate(15, 60)">
                    <circle cx="15" cy="15" r="14" fill="#050505" stroke="#333" stroke-width="1" />
                    <circle cx="15" cy="15" r="10" fill="url(#lensGlass)" />
                </g>
                <g transform="translate(15, 105)">
                    <circle cx="15" cy="15" r="14" fill="#050505" stroke="#333" stroke-width="1" />
                    <circle cx="15" cy="15" r="10" fill="url(#lensGlass)" />
                </g>

                <!-- Speaker Grille -->
                <rect x="65" y="14" width="50" height="4" rx="2" fill="#050505" />
            </g>

            <!-- 2. HAND (Foreground Layer) -->
            <!-- 
              Constructed with organic bezier curves.
              Lighting assumption: Key light Top-Left.
            -->
            <g id="hand">
                
                <!-- Palm & Wrist Base (Behind Phone) -->
                <path d="M 320 750 
                         C 350 650, 360 550, 340 450 
                         C 330 400, 300 380, 280 350 
                         L 450 300 
                         C 480 400, 500 550, 480 750 Z" 
                      fill="url(#palmGrad)" />

                <!-- Fingers Wrapping Around Right Edge (Behind Phone) -->
                <g id="fingers-back" fill="url(#skinGrad)">
                    <!-- Index (Back) -->
                    <path d="M 360 320 C 400 310, 420 330, 420 350 C 410 370, 370 360, 360 350 Z" />
                    <!-- Middle (Back) -->
                    <path d="M 360 370 C 410 360, 430 380, 430 400 C 420 420, 380 410, 360 400 Z" />
                    <!-- Ring (Back) -->
                    <path d="M 350 420 C 400 410, 420 430, 410 450 C 400 470, 360 460, 350 450 Z" />
                    <!-- Pinky (Back) -->
                    <path d="M 340 470 C 380 460, 390 480, 380 500 C 370 520, 340 510, 340 500 Z" />
                </g>

                <!-- Fingertips Wrapping Over Front Edge -->
                <g id="fingers-front">
                    <!-- Index Finger -->
                    <g>
                        <!-- Tip -->
                        <path d="M 420 330 C 440 325, 445 340, 435 355 C 425 360, 410 350, 420 330 Z" fill="url(#skinGrad)" />
                        <!-- Nail -->
                        <ellipse cx="438" cy="340" rx="3" ry="6" transform="rotate(-20 438 340)" fill="#f0d6c0" opacity="0.8" />
                        <!-- Joint Crease -->
                        <path d="M 415 335 Q 425 345 410 350" stroke="#5c3a2a" stroke-width="2" fill="none" opacity="0.7" />
                    </g>

                    <!-- Middle Finger -->
                    <g>
                        <path d="M 430 380 C 450 375, 455 390, 445 405 C 435 410, 420 400, 430 380 Z" fill="url(#skinGrad)" />
                        <ellipse cx="448" cy="390" rx="3" ry="6" transform="rotate(-15 448 390)" fill="#f0d6c0" opacity="0.8" />
                        <path d="M 425 385 Q 435 395 420 400" stroke="#5c3a2a" stroke-width="2" fill="none" opacity="0.7" />
                    </g>

                    <!-- Ring Finger -->
                    <g>
                        <path d="M 410 430 C 430 425, 435 440, 425 455 C 415 460, 400 450, 410 430 Z" fill="url(#skinGrad)" />
                        <ellipse cx="428" cy="440" rx="3" ry="5" transform="rotate(-10 428 440)" fill="#f0d6c0" opacity="0.8" />
                    </g>
                </g>

                <!-- THUMB (The Focal Point) -->
                <g id="thumb" filter="url(#softShadow)">
                    <!-- Thenar Eminence (Base of Thumb Muscle) -->
                    <path d="M 260 450 
                             C 280 400, 300 380, 320 380 
                             C 310 420, 290 460, 260 450 Z" 
                          fill="url(#palmGrad)" />

                    <!-- Thumb Shaft -->
                    <path d="M 310 390 
                             C 300 340, 260 310, 220 300 
                             C 240 330, 260 360, 270 390 Z" 
                          fill="url(#skinGrad)" />
                          
                    <!-- Thumb Tip (Touching Screen) -->
                    <path d="M 220 300 
                             C 200 290, 190 310, 210 320 
                             C 220 330, 240 320, 220 300 Z" 
                          fill="url(#skinGrad)" />

                    <!-- Thumb Nail -->
                    <ellipse cx="215" cy="305" rx="4" ry="7" transform="rotate(-40 215 305)" fill="#f0d6c0" opacity="0.9" />
                    <!-- Nail Specular (Wet look) -->
                    <ellipse cx="213" cy="303" rx="1.5" ry="4" transform="rotate(-40 213 303)" fill="#fff" opacity="0.6" />

                    <!-- IP Joint (Knuckle) -->
                    <path d="M 225 305 Q 235 315 225 325" stroke="#5c3a2a" stroke-width="2" fill="none" opacity="0.8" />
                    
                    <!-- Creases on Thumb Pad -->
                    <path d="M 210 300 Q 215 305 210 315" stroke="#5c3a2a" stroke-width="1" fill="none" opacity="0.5" />
                </g>
            </g>

            <!-- 3. CONTACT SHADOWS & HIGHLIGHTS (Polishing the 3D effect) -->
            <g style="mix-blend-mode: multiply;" fill="#000" opacity="0.5">
                <!-- Shadow cast by Thumb onto Screen -->
                <ellipse cx="210" cy="310" rx="15" ry="10" transform="rotate(-30 210 310)" filter="url(#blurSmall)" />
                
                <!-- Shadow cast by Fingers onto Phone Edge -->
                <path d="M 420 330 L 440 335 L 435 355 L 415 350 Z" filter="url(#blurSmall)" />
                <path d="M 430 380 L 450 385 L 445 405 L 425 400 Z" filter="url(#blurSmall)" />
            </g>

            <!-- Rim Light / Specular Highlights (Top Left Source) -->
            <g style="mix-blend-mode: screen;" fill="#fff" opacity="0.4">
                <!-- Phone Frame Highlight -->
                <path d="M 260 100 L 260 580" stroke="#fff" stroke-width="1.5" opacity="0.5" />
                
                <!-- Thumb Knuckle Highlight -->
                <circle cx="295" cy="355" r="2" opacity="0.6" />
                
                <!-- Index Knuckle Highlight -->
                <circle cx="410" cy="330" r="1.5" opacity="0.6" />
                
                <!-- Nail Speculars -->
                <ellipse cx="213" cy="303" rx="1" ry="3" transform="rotate(-40 213 303)" opacity="0.9" />
                <ellipse cx="436" cy="338" rx="1" ry="3" transform="rotate(-20 436 338)" opacity="0.9" />
            </g>

        </svg>
    </div>

</body>
</html>
