<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Study: The Grip</title>
    <style>
        :root {
            --bg-color: #080808;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .canvas-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            /* Centering the 1280x800 canvas */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            /* Force specific aspect ratio and scale */
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 800px;
        }

        /* Vignette for editorial depth */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, transparent 30%, #000000 100%);
            z-index: 10;
        }

        /* Grain Texture for realism */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            opacity: 0.06;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body>

    <div class="canvas-wrapper">
        <div class="vignette"></div>
        <div class="noise-overlay"></div>

        <!-- 
          REVISED COMPOSITION:
          - ViewBox expanded to 1280x800.
          - Subject scaled up significantly to fill frame.
          - Lighting unified: Top-Left Key Light.
        -->
        <svg viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- SKIN TONES: Complex gradients for volume -->
                <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#F2D1BA" /> <!-- Highlight -->
                    <stop offset="30%" stop-color="#D6A693" /> <!-- Mid -->
                    <stop offset="70%" stop-color="#8A5A44" /> <!-- Shadow -->
                    <stop offset="100%" stop-color="#4A2C20" /> <!-- Deep Shadow -->
                </linearGradient>

                <linearGradient id="palmGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#5C3A2B" />
                    <stop offset="100%" stop-color="#2B160D" />
                </linearGradient>

                <!-- DEVICE MATERIALS -->
                <linearGradient id="titaniumFrame" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#999" />
                    <stop offset="15%" stop-color="#333" />
                    <stop offset="50%" stop-color="#111" />
                    <stop offset="85%" stop-color="#444" />
                    <stop offset="100%" stop-color="#000" />
                </linearGradient>

                <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#1a1a1a" />
                    <stop offset="50%" stop-color="#0a0a0a" />
                    <stop offset="100%" stop-color="#000000" />
                </linearGradient>

                <radialGradient id="lensGlass" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#555" />
                    <stop offset="60%" stop-color="#111" />
                    <stop offset="100%" stop-color="#000" />
                </radialGradient>

                <!-- SCREEN GLOW EFFECT -->
                <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#4facfe" stop-opacity="0.3" />
                    <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
                </linearGradient>

                <!-- FILTERS -->
                <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="25" />
                    <feOffset dx="20" dy="40" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.8" />
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <filter id="blurSmall">
                    <feGaussianBlur stdDeviation="4" />
                </filter>
                
                <filter id="blurMedium">
                    <feGaussianBlur stdDeviation="10" />
                </filter>

                <filter id="blurLarge">
                    <feGaussianBlur stdDeviation="25" />
                </filter>
            </defs>

            <!-- 1. DEVICE (The Object) -->
            <!-- Centered and Scaled -->
            <g id="device" transform="translate(500, 50) rotate(-15)" filter="url(#softShadow)">
                
                <!-- Phone Body (Titanium) -->
                <rect x="0" y="0" width="320" height="720" rx="45" fill="url(#titaniumFrame)" />
                
                <!-- Screen Area -->
                <rect x="10" y="10" width="300" height="700" rx="36" fill="url(#screenGlass)" />
                
                <!-- Screen Glare (Reflection of environment) -->
                <path d="M 10 10 L 310 10 L 310 300 L 10 500 Z" fill="rgba(255,255,255,0.02)" pointer-events="none" />

                <!-- Camera Bump (Rear, visible due to angle) -->
                <g transform="translate(20, 20)">
                    <rect x="0" y="0" width="120" height="120" rx="25" fill="#111" stroke="#222" stroke-width="1" />
                    <!-- Lenses -->
                    <g transform="translate(25, 25)">
                        <circle cx="0" cy="0" r="18" fill="#050505" stroke="#333" stroke-width="2" />
                        <circle cx="0" cy="0" r="12" fill="url(#lensGlass)" />
                        <circle cx="4" cy="-4" r="3" fill="rgba(255,255,255,0.5)" filter="url(#blurSmall)" />
                    </g>
                    <g transform="translate(25, 85)">
                        <circle cx="0" cy="0" r="18" fill="#050505" stroke="#333" stroke-width="2" />
                        <circle cx="0" cy="0" r="12" fill="url(#lensGlass)" />
                    </g>
                    <g transform="translate(85, 25)">
                        <circle cx="0" cy="0" r="18" fill="#050505" stroke="#333" stroke-width="2" />
                        <circle cx="0" cy="0" r="12" fill="url(#lensGlass)" />
                    </g>
                </g>

                <!-- Side Buttons -->
                <rect x="-4" y="150" width="6" height="40" rx="2" fill="#333" /> <!-- Volume -->
                <rect x="-4" y="210" width="6" height="40" rx="2" fill="#333" /> <!-- Volume -->
                <rect x="318" y="180" width="6" height="60" rx="2" fill="#333" /> <!-- Power -->
            </g>

            <!-- 2. HAND (The Subject) -->
            <!-- Scaled up 2x, translated to center -->
            <g id="hand" transform="translate(200, 150) scale(1.6)">
                
                <!-- Palm & Wrist Base (Behind Phone) -->
                <!-- Organic shape connecting to fingers -->
                <path d="M 150 350 
                         C 250 350, 300 250, 350 200 
                         C 380 150, 450 100, 500 50 
                         L 550 400 
                         C 550 550, 450 650, 350 650 
                         C 250 650, 150 550, 150 350 Z" 
                      fill="url(#palmGrad)" />

                <!-- Fingers Wrapping Around Right Edge (Behind Phone) -->
                <!-- These anchor the grip -->
                <g id="fingers-back" fill="url(#skinGrad)">
                    <!-- Index (Back) -->
                    <path d="M 340 160 C 380 140, 420 150, 430 180 C 430 200, 390 200, 350 190 Z" />
                    <!-- Middle (Back) -->
                    <path d="M 350 200 C 400 180, 440 190, 450 220 C 450 240, 400 240, 360 230 Z" />
                    <!-- Ring (Back) -->
                    <path d="M 360 240 C 400 230, 430 240, 440 270 C 440 290, 390 290, 360 280 Z" />
                    <!-- Pinky (Back) -->
                    <path d="M 360 290 C 390 280, 410 290, 410 320 C 410 340, 370 340, 360 320 Z" />
                </g>

                <!-- Fingertips Wrapping Over Front Edge -->
                <!-- These occlude the phone to create depth -->
                <g id="fingers-front">
                    <!-- Index Finger -->
                    <g>
                        <!-- Tip -->
                        <path d="M 430 160 C 460 150, 470 170, 455 190 C 440 200, 420 190, 430 160 Z" fill="url(#skinGrad)" />
                        <!-- Nail -->
                        <ellipse cx="460" cy="170" rx="4" ry="8" transform="rotate(-20 460 170)" fill="#f0d6c0" opacity="0.8" />
                        <!-- Joint Crease -->
                        <path d="M 425 170 Q 435 180 420 190" stroke="#4a2c20" stroke-width="3" fill="none" opacity="0.6" />
                        <!-- Screen Glow on finger -->
                        <path d="M 430 160 C 460 150, 470 170, 455 190 C 440 200, 420 190, 430 160 Z" fill="url(#screenGlow)" style="mix-blend-mode: screen;" />
                    </g>

                    <!-- Middle Finger -->
                    <g>
                        <path d="M 450 200 C 480 190, 490 210, 475 230 C 460 240, 440 230, 450 200 Z" fill="url(#skinGrad)" />
                        <ellipse cx="480" cy="210" rx="4" ry="8" transform="rotate(-15 480 210)" fill="#f0d6c0" opacity="0.8" />
                        <path d="M 445 210 Q 455 220 440 230" stroke="#4a2c20" stroke-width="3" fill="none" opacity="0.6" />
                        <path d="M 450 200 C 480 190, 490 210, 475 230 C 460 240, 440 230, 450 200 Z" fill="url(#screenGlow)" style="mix-blend-mode: screen;" />
                    </g>

                    <!-- Ring Finger -->
                    <g>
                        <path d="M 440 250 C 470 240, 480 260, 465 280 C 450 290, 430 280, 440 250 Z" fill="url(#skinGrad)" />
                        <ellipse cx="470" cy="260" rx="3" ry="7" transform="rotate(-10 470 260)" fill="#f0d6c0" opacity="0.8" />
                        <path d="M 440 250 C 470 240, 480 260, 465 280 C 450 290, 430 280, 440 250 Z" fill="url(#screenGlow)" style="mix-blend-mode: screen;" />
                    </g>
                </g>

                <!-- THUMB (The Focal Point) -->
                <!-- Re-drawn with better anatomy and positioning -->
                <g id="thumb" filter="url(#softShadow)">
                    <!-- Thenar Eminence (Base of Thumb Muscle) -->
                    <path d="M 200 300 
                             C 250 250, 300 250, 320 280 
                             C 300 350, 250 380, 200 300 Z" 
                          fill="url(#palmGrad)" />

                    <!-- Thumb Shaft -->
                    <path d="M 280 270 
                             C 250 220, 200 200, 150 220 
                             C 180 250, 220 280, 250 300 Z" 
                          fill="url(#skinGrad)" />
                          
                    <!-- Thumb Tip (Touching Screen) -->
                    <path d="M 150 220 
                             C 120 210, 100 240, 130 260 
                             C 150 270, 170 250, 150 220 Z" 
                          fill="url(#skinGrad)" />

                    <!-- Thumb Nail -->
                    <ellipse cx="135" cy="235" rx="5" ry="10" transform="rotate(-40 135 235)" fill="#f0d6c0" opacity="0.9" />
                    <!-- Nail Specular (Wet look) -->
                    <ellipse cx="133" cy="233" rx="2" ry="6" transform="rotate(-40 133 233)" fill="#fff" opacity="0.6" />

                    <!-- IP Joint (Knuckle) -->
                    <path d="M 155 225 Q 165 235 155 245" stroke="#4a2c20" stroke-width="3" fill="none" opacity="0.8" />
                    
                    <!-- Creases on Thumb Pad -->
                    <path d="M 135 225 Q 140 235 135 245" stroke="#4a2c20" stroke-width="1.5" fill="none" opacity="0.5" />
                    
                    <!-- Screen Glow on Thumb -->
                    <path d="M 150 220 C 120 210, 100 240, 130 260 C 150 270, 170 250, 150 220 Z" fill="url(#screenGlow)" style="mix-blend-mode: screen;" />
                </g>
            </g>

            <!-- 3. LIGHTING & POLISH -->
            
            <!-- Contact Shadows (Grounding the hand on the phone) -->
            <g style="mix-blend-mode: multiply;" fill="#000" opacity="0.4">
                <!-- Thumb cast shadow on screen -->
                <ellipse cx="115" cy="240" rx="25" ry="15" transform="rotate(-30 115 240)" filter="url(#blurMedium)" />
                
                <!-- Finger cast shadows on edge -->
                <path d="M 430 160 L 460 165 L 455 190 L 425 185 Z" filter="url(#blurSmall)" />
                <path d="M 450 200 L 480 205 L 475 230 L 445 225 Z" filter="url(#blurSmall)" />
            </g>

            <!-- Rim Light / Specular Highlights (Top Left Source) -->
            <g style="mix-blend-mode: screen;" fill="#fff">
                <!-- Phone Frame Highlight (The "Edge") -->
                <path d="M 500 50 L 500 770" stroke="#fff" stroke-width="2" opacity="0.3" />
                <path d="M 500 50 L 820 50" stroke="#fff" stroke-width="2" opacity="0.1" />
                
                <!-- Thumb Knuckle Highlight -->
                <circle cx="295" cy="265" r="3" opacity="0.5" filter="url(#blurSmall)" />
                
                <!-- Index Knuckle Highlight -->
                <circle cx="420" cy="150" r="2.5" opacity="0.5" filter="url(#blurSmall)" />
                
                <!-- Nail Speculars (Glossy) -->
                <ellipse cx="133" cy="233" rx="1.5" ry="5" transform="rotate(-40 133 233)" opacity="0.8" />
                <ellipse cx="458" cy="168" rx="1.5" ry="4" transform="rotate(-20 458 168)" opacity="0.8" />
                <ellipse cx="478" cy="208" rx="1.5" ry="4" transform="rotate(-15 478 208)" opacity="0.8" />
            </g>

            <!-- Screen Reflection (Global) -->
            <rect x="500" y="50" width="320" height="720" rx="45" fill="url(#screenGlow)" style="mix-blend-mode: screen;" opacity="0.3" transform="rotate(-15 500 50)" />

        </svg>
    </div>

</body>
</html>
