<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Study: The Grip</title>
    <style>
        :root {
            --bg-color: #08090a;
            --text-primary: #e0e0e0;
            --text-secondary: #555555;
            --accent: #ff3b30;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
        }

        /* Layout Structure */
        .layout-grid {
            display: grid;
            grid-template-columns: 15% 70% 15%;
            width: 100%;
            height: 100%;
            max-width: 1800px;
            position: relative;
            z-index: 2;
        }

        /* Metadata Sidebars */
        .sidebar {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 20px;
            opacity: 0.4; /* Reduced opacity per critique */
            transition: opacity 0.3s ease;
        }
        
        .sidebar:hover {
            opacity: 0.8;
        }

        .meta-block {
            border-left: 1px solid rgba(255,255,255,0.1);
            padding-left: 15px;
        }

        .meta-right {
            border-left: none;
            border-right: 1px solid rgba(255,255,255,0.1);
            padding-right: 15px;
            text-align: right;
        }

        .meta-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            display: block;
        }

        .meta-content {
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            line-height: 1.5;
            color: var(--text-primary);
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 2px;
        }

        /* Center Stage */
        .center-stage {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
        }

        #illustration-container {
            width: 100%;
            height: 100%;
            max-height: 90vh;
            /* Subtle breathing animation */
            animation: breathe 8s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* Grain Overlay */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.06;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Vignette */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 30%, #000000 100%);
            z-index: 5;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div class="noise-overlay"></div>
    <div class="vignette"></div>

    <div class="layout-grid">
        <!-- Left Sidebar -->
        <div class="sidebar">
            <div class="meta-block">
                <span class="meta-title">Subject 01</span>
                <div class="meta-content">
                    <div class="meta-row"><span>Hand</span> <span>Right</span></div>
                    <div class="meta-row"><span>Grip</span> <span>Pinch</span></div>
                    <div class="meta-row"><span>Tone</span> <span>Warm/Med</span></div>
                </div>
            </div>
            <div class="meta-block">
                <span class="meta-title">Composition</span>
                <div class="meta-content">
                    <div class="meta-row"><span>Angle</span> <span>Oblique</span></div>
                    <div class="meta-row"><span>Depth</span> <span>High</span></div>
                </div>
            </div>
        </div>

        <!-- Center Illustration -->
        <div class="center-stage">
            <svg id="illustration-container" viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Skin Gradients (Warmer highlights, cooler shadows) -->
                    <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#e6bca3" /> <!-- Warm highlight -->
                        <stop offset="60%" stop-color="#c49373" />
                        <stop offset="100%" stop-color="#8a5a44" /> <!-- Deep shadow -->
                    </linearGradient>
                    
                    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#6e4432" />
                        <stop offset="100%" stop-color="#3d261b" />
                    </linearGradient>

                    <radialGradient id="thumbHighlight" cx="30%" cy="30%" r="70%">
                        <stop offset="0%" stop-color="#fdd9b5" />
                        <stop offset="100%" stop-color="#c49373" stop-opacity="0" />
                    </radialGradient>

                    <!-- Device Gradients -->
                    <linearGradient id="deviceFrame" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#2a2a2a" />
                        <stop offset="15%" stop-color="#666" /> <!-- Rim light -->
                        <stop offset="50%" stop-color="#1a1a1a" />
                        <stop offset="85%" stop-color="#333" />
                        <stop offset="100%" stop-color="#050505" />
                    </linearGradient>

                    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
                        <stop offset="40%" stop-color="rgba(255,255,255,0)" />
                        <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
                    </linearGradient>

                    <linearGradient id="screenLight" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#1a1a1a" />
                        <stop offset="100%" stop-color="#000000" />
                    </linearGradient>

                    <!-- Filters -->
                    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
                        <feOffset dx="5" dy="10" result="offsetblur" />
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.4" />
                        </feComponentTransfer>
                        <feMerge> 
                            <feMergeNode />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                    
                    <filter id="blurLight">
                        <feGaussianBlur stdDeviation="4" />
                    </filter>
                </defs>

                <!-- Background Depth -->
                <g id="background-layer">
                    <circle cx="300" cy="400" r="200" fill="#111" filter="url(#blurLight)" opacity="0.5" />
                </g>

                <!-- THE DEVICE (Middle Layer) -->
                <!-- Rotated slightly for dynamic composition -->
                <g id="device" transform="translate(180, 120) rotate(-12)" filter="url(#softShadow)">
                    
                    <!-- Phone Body/Chassis -->
                    <rect x="0" y="0" width="160" height="420" rx="24" fill="#000" stroke="url(#deviceFrame)" stroke-width="3" />
                    
                    <!-- Screen -->
                    <rect x="4" y="4" width="152" height="412" rx="20" fill="url(#screenLight)" />
                    
                    <!-- Screen Content (Abstract UI) -->
                    <g opacity="0.7">
                        <rect x="20" y="60" width="120" height="140" rx="12" fill="#151515" />
                        <!-- Abstract Map/Image -->
                        <path d="M 20 140 Q 80 100 140 160 L 140 200 L 20 200 Z" fill="#222" />
                        
                        <!-- UI Elements -->
                        <rect x="20" y="230" width="100" height="6" rx="3" fill="#333" />
                        <rect x="20" y="250" width="70" height="6" rx="3" fill="#333" />
                        <rect x="20" y="270" width="110" height="6" rx="3" fill="#333" />
                        
                        <!-- Bottom Nav -->
                        <rect x="20" y="360" width="120" height="30" rx="15" fill="#222" />
                        <circle cx="80" cy="375" r="6" fill="#444" />
                    </g>

                    <!-- Camera/Speaker Details -->
                    <rect x="50" y="12" width="60" height="14" rx="7" fill="#050505" />
                    <circle cx="85" cy="19" r="2.5" fill="#111" /> <!-- Lens -->
                    <circle cx="85" cy="19" r="1" fill="#333" /> <!-- Lens Reflection -->
                    <rect x="60" y="18" width="20" height="1.5" rx="0.5" fill="#222" /> <!-- Speaker -->

                    <!-- Glass Reflection Overlay -->
                    <path d="M 4 4 L 156 4 L 156 250 L 4 350 Z" fill="url(#screenGlass)" style="mix-blend-mode: overlay;" pointer-events="none" />
                    
                    <!-- High Specular Edge Highlight -->
                    <path d="M 4 24 Q 4 4 24 4 L 136 4 Q 156 4 156 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" />
                </g>

                <!-- THE HAND (Complex Layering) -->
                <!-- 
                  Order: 
                  1. Palm/Wrist (Back)
                  2. Fingers (Right side, behind phone) - Simplified as they are mostly occluded
                  3. Thumb (Front, wrapping over)
                  4. Finger Tips (Right side, wrapping over)
                -->

                <!-- 1. Palm & Wrist (Back) -->
                <g id="hand-palm">
                    <path d="M 280 550 
                             C 260 650, 280 750, 300 850 
                             L 450 850 
                             C 460 750, 440 650, 400 550 
                             C 380 500, 320 500, 280 550 Z" 
                          fill="url(#skinShadow)" />
                </g>

                <!-- 2. Fingers (Right Side - Behind Phone) -->
                <!-- These create the bulk of the grip behind the device -->
                <g id="fingers-back" fill="url(#skinShadow)">
                    <!-- Index (Back) -->
                    <path d="M 330 200 Q 380 190 400 210 L 380 240 Z" />
                    <!-- Middle (Back) -->
                    <path d="M 330 250 Q 390 240 410 260 L 390 290 Z" />
                    <!-- Ring (Back) -->
                    <path d="M 330 300 Q 380 290 395 310 L 375 340 Z" />
                    <!-- Pinky (Back) -->
                    <path d="M 330 350 Q 360 340 370 360 L 350 380 Z" />
                </g>

                <!-- 3. Thumb (Front - Detailed Anatomy) -->
                <g id="hand-thumb" filter="url(#softShadow)">
                    <!-- Thenar Eminence (Base Muscle) -->
                    <path d="M 150 500 Q 180 450 220 420 L 240 460 Q 200 500 150 500 Z" fill="url(#skinBase)" />
                    
                    <!-- Thumb Shaft (Organic curve) -->
                    <path d="M 220 420 
                             C 230 380, 200 320, 180 300 
                             L 200 280 
                             C 230 310, 260 370, 250 410 
                             Z" 
                          fill="url(#skinBase)" />

                    <!-- Thumb Tip (Touching Screen) -->
                    <path d="M 180 300 
                             C 170 280, 190 260, 210 270 
                             C 220 275, 210 290, 200 280 
                             Z" 
                          fill="url(#thumbHighlight)" />

                    <!-- Thumb Joint (IP Joint) -->
                    <path d="M 190 295 Q 200 305 195 315" stroke="#8a5a44" stroke-width="2" fill="none" opacity="0.6" />
                    
                    <!-- Thumb Nail -->
                    <ellipse cx="205" cy="278" rx="5" ry="9" transform="rotate(-30 205 278)" fill="#f0d6c0" opacity="0.9" />
                    <ellipse cx="205" cy="278" rx="3" ry="6" transform="rotate(-30 205 278)" fill="#fff" opacity="0.3" /> <!-- Specular -->
                </g>

                <!-- 4. Finger Tips (Right Side - Wrapping Over) -->
                <g id="fingers-front">
                    
                    <!-- Index Finger Tip -->
                    <g>
                        <!-- Shaft -->
                        <path d="M 330 210 Q 350 205 360 220 L 350 230 Z" fill="url(#skinBase)" />
                        <!-- Tip -->
                        <path d="M 360 220 Q 375 215 375 230 Q 370 235 350 230 Z" fill="url(#skinBase)" />
                        <!-- Nail -->
                        <ellipse cx="368" cy="225" rx="3" ry="5" transform="rotate(15 368 225)" fill="#f0d6c0" opacity="0.9" />
                        <!-- Joint Crease -->
                        <path d="M 340 215 Q 345 220 340 225" stroke="#8a5a44" stroke-width="1.5" fill="none" opacity="0.5" />
                    </g>

                    <!-- Middle Finger Tip -->
                    <g>
                        <path d="M 330 260 Q 360 255 370 270 L 360 280 Z" fill="url(#skinBase)" />
                        <path d="M 370 270 Q 385 265 385 280 Q 380 285 360 280 Z" fill="url(#skinBase)" />
                        <ellipse cx="378" cy="275" rx="3" ry="5" transform="rotate(10 378 275)" fill="#f0d6c0" opacity="0.9" />
                        <path d="M 350 265 Q 355 270 350 275" stroke="#8a5a44" stroke-width="1.5" fill="none" opacity="0.5" />
                    </g>

                    <!-- Ring Finger Tip -->
                    <g>
                        <path d="M 330 310 Q 355 305 365 320 L 355 330 Z" fill="url(#skinBase)" />
                        <path d="M 365 320 Q 375 315 375 330 Q 370 335 355 330 Z" fill="url(#skinBase)" />
                        <ellipse cx="370" cy="325" rx="3" ry="4" transform="rotate(5 370 325)" fill="#f0d6c0" opacity="0.9" />
                    </g>
                </g>

                <!-- CONTACT SHADOWS (Grounding the elements) -->
                <g style="mix-blend-mode: multiply;" fill="#000" opacity="0.4">
                    <!-- Shadow under thumb pad -->
                    <ellipse cx="195" cy="285" rx="12" ry="8" transform="rotate(-30 195 285)" />
                    <!-- Shadow where fingers touch phone edge -->
                    <path d="M 330 210 L 340 210 Q 345 220 340 230 L 330 230 Z" />
                    <path d="M 330 260 L 345 260 Q 350 270 345 280 L 330 280 Z" />
                    <path d="M 330 310 L 340 310 Q 345 320 340 330 L 330 330 Z" />
                </g>

                <!-- FINAL SPECULAR HIGHLIGHTS (Light source Top-Left) -->
                <g style="mix-blend-mode: screen;" fill="#fff" opacity="0.5">
                    <!-- Phone Edge Highlight -->
                    <path d="M 180 120 L 180 540" stroke="#fff" stroke-width="1" opacity="0.3" />
                    <!-- Thumb Knuckle Highlight -->
                    <circle cx="210" cy="285" r="2" />
                    <!-- Index Knuckle Highlight -->
                    <circle cx="355" cy="220" r="1.5" />
                    <!-- Nail Speculars -->
                    <ellipse cx="207" cy="276" rx="1" ry="3" transform="rotate(-30 207 276)" opacity="0.8" />
                    <ellipse cx="369" cy="223" rx="1" ry="2" transform="rotate(15 369 223)" opacity="0.8" />
                </g>

            </svg>
        </div>

        <!-- Right Sidebar -->
        <div class="sidebar">
            <div class="meta-block meta-right">
                <span class="meta-title">Device Specs</span>
                <div class="meta-content">
                    <div class="meta-row"><span>Model</span> <span>Pro Max</span></div>
                    <div class="meta-row"><span>Finish</span> <span>Titanium</span></div>
                    <div class="meta-row"><span>Screen</span> <span>Off</span></div>
                </div>
            </div>
            <div class="meta-block meta-right">
                <span class="meta-title">Lighting</span>
                <div class="meta-content">
                    <div class="meta-row"><span>Source</span> <span>Top-Left</span></div>
                    <div class="meta-row"><span>Temp</span> <span>5600K</span></div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
