<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial Study: The Interface</title>
    <style>
        :root {
            --bg-color: #050505;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .canvas-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            height: 100%;
            max-height: 120vh;
            width: auto;
            /* Ensures crisp rendering */
            shape-rendering: geometricPrecision;
        }

        /* Vignette for editorial depth */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, transparent 40%, #000000 120%);
            z-index: 10;
        }

        /* Subtle Grain for realism */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            opacity: 0.04;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body>

    <div class="canvas-wrapper">
        <div class="vignette"></div>
        <div class="noise-overlay"></div>

        <!-- 
          REVISED COMPOSITION:
          - ViewBox 800x1200 (Vertical Portrait)
          - Device is Upright (0 rotation)
          - Hand fully wraps device
          - Lighting: Cool Rim Light (Left), Warm Key (Right)
        -->
        <svg viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- LIGHTING: Skin Tones -->
                <!-- Main Skin: Warm key light from right, cool shadow on left -->
                <linearGradient id="skinMain" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#3d2317" /> <!-- Deep Shadow (Left) -->
                    <stop offset="40%" stop-color="#8c553d" /> <!-- Midtone -->
                    <stop offset="80%" stop-color="#d4a387" /> <!-- Highlight -->
                    <stop offset="100%" stop-color="#fde0d0" /> <!-- Specular -->
                </linearGradient>

                <!-- Palm/Inner Hand: Darker, warmer -->
                <linearGradient id="skinPalm" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#2a150e" />
                    <stop offset="50%" stop-color="#6b3e2b" />
                    <stop offset="100%" stop-color="#a86f55" />
                </linearGradient>

                <!-- DEVICE: Titanium & Glass -->
                <linearGradient id="titaniumBody" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#111" />
                    <stop offset="20%" stop-color="#333" /> <!-- Edge Highlight -->
                    <stop offset="50%" stop-color="#0a0a0a" />
                    <stop offset="80%" stop-color="#222" />
                    <stop offset="100%" stop-color="#000" />
                </linearGradient>

                <linearGradient id="screenBlack" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#050505" />
                    <stop offset="50%" stop-color="#000000" />
                    <stop offset="100%" stop-color="#080808" />
                </linearGradient>

                <!-- Screen Reflection (Glass sheen) -->
                <linearGradient id="screenSheen" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
                    <stop offset="40%" stop-color="rgba(255,255,255,0)" />
                    <stop offset="100%" stop-color="rgba(255,255,255,0.03)" />
                </linearGradient>

                <!-- Screen Glow (Emissive light onto fingers) -->
                <radialGradient id="screenLight" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#4facfe" stop-opacity="0.4" />
                    <stop offset="100%" stop-color="#4facfe" stop-opacity="0" />
                </radialGradient>

                <!-- Filters -->
                <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
                    <feOffset dx="-10" dy="20" result="offsetblur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.6" />
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <filter id="contactBlur">
                    <feGaussianBlur stdDeviation="3" />
                </filter>
                
                <filter id="ambientBlur">
                    <feGaussianBlur stdDeviation="20" />
                </filter>
            </defs>

            <!-- 1. DEVICE (Front Facing, Vertical) -->
            <!-- Positioned centrally -->
            <g id="device" transform="translate(280, 50)" filter="url(#softShadow)">
                
                <!-- Phone Body -->
                <rect x="0" y="0" width="240" height="500" rx="32" fill="url(#titaniumBody)" />
                
                <!-- Screen Area -->
                <rect x="6" y="6" width="228" height="488" rx="26" fill="url(#screenBlack)" />
                
                <!-- Screen Content (Abstract UI to give context) -->
                <g opacity="0.15" fill="#fff">
                    <rect x="20" y="80" width="200" height="20" rx="4" />
                    <rect x="20" y="120" width="140" height="10" rx="2" />
                    <rect x="20" y="140" width="160" height="10" rx="2" />
                    <circle cx="120" cy="280" r="60" fill="none" stroke="#fff" stroke-width="2" />
                    <rect x="20" y="400" width="200" height="60" rx="8" />
                </g>

                <!-- Screen Glass Reflection (The "Sheen") -->
                <path d="M 6 6 L 234 6 L 234 200 L 6 400 Z" fill="url(#screenSheen)" pointer-events="none" />
                
                <!-- Front Camera Dot -->
                <circle cx="120" cy="25" r="4" fill="#000" stroke="#222" stroke-width="1" />

                <!-- Side Buttons (Left side) -->
                <rect x="-3" y="100" width="3" height="35" rx="1" fill="#1a1a1a" />
                <rect x="-3" y="150" width="3" height="35" rx="1" fill="#1a1a1a" />
            </g>

            <!-- 2. HAND (The Grip) -->
            <!-- Transformed to overlap the device correctly -->
            <g id="hand" transform="translate(0, 0)">
                
                <!-- WRIST & PALM (Background Layer) -->
                <!-- Originates from bottom right, extends to back of phone -->
                <path d="M 850 1200 
                         C 700 1200, 600 1000, 520 800 
                         C 480 700, 460 600, 460 550 
                         L 460 200 
                         L 850 200 
                         L 850 1200 Z" 
                      fill="url(#skinPalm)" />

                <!-- FINGERS WRAPPING (Back to Front) -->
                <!-- These fingers are behind the phone, curving around the right edge -->
                <g id="fingers-back" fill="url(#skinMain)">
                    <!-- Index -->
                    <path d="M 520 180 C 560 180, 600 200, 590 230 C 580 250, 540 240, 520 220 Z" />
                    <!-- Middle -->
                    <path d="M 520 240 C 570 230, 620 250, 610 280 C 600 300, 550 290, 520 280 Z" />
                    <!-- Ring -->
                    <path d="M 520 300 C 560 290, 600 310, 590 340 C 580 360, 540 350, 520 340 Z" />
                    <!-- Pinky -->
                    <path d="M 520 360 C 550 350, 580 370, 570 400 C 560 420, 530 410, 520 400 Z" />
                </g>

                <!-- THUMB (The Focal Point) -->
                <!-- Anchored at bottom left of palm, crossing over the phone -->
                <g id="thumb" filter="url(#softShadow)">
                    <!-- Thenar Eminence (Muscle base) -->
                    <path d="M 520 600 C 450 580, 400 500, 400 450 C 400 380, 480 350, 520 400 Z" fill="url(#skinPalm)" />
                    
                    <!-- Thumb Shaft -->
                    <path d="M 460 420 
                             C 420 380, 380 350, 340 360 
                             C 320 365, 300 390, 320 410 
                             C 350 430, 400 450, 460 480 Z" 
                          fill="url(#skinMain)" />
                          
                    <!-- Thumb Tip (Touching Screen) -->
                    <path d="M 310 375 
                             C 290 360, 270 380, 280 400 
                             C 290 420, 310 410, 320 395 Z" 
                          fill="url(#skinMain)" />

                    <!-- Thumb Nail -->
                    <ellipse cx="285" cy="385" rx="6" ry="12" transform="rotate(-30 285 385)" fill="#fceae2" opacity="0.9" />
                    <!-- Nail Specular -->
                    <ellipse cx="283" cy="382" rx="2" ry="6" transform="rotate(-30 283 382)" fill="#fff" opacity="0.7" />

                    <!-- IP Joint (Knuckle) -->
                    <path d="M 330 380 Q 340 390 330 400" stroke="#3d2317" stroke-width="2" fill="none" opacity="0.6" />
                </g>

                <!-- FINGERTIPS (Overlapping the right edge of the phone) -->
                <!-- These create the "Grip" illusion by occluding the device frame -->
                <g id="fingers-front" fill="url(#skinMain)">
                    <!-- Index Tip -->
                    <g>
                        <path d="M 515 200 C 535 190, 545 205, 530 220 C 520 230, 510 220, 515 200 Z" />
                        <ellipse cx="535" cy="205" rx="3" ry="6" transform="rotate(-20 535 205)" fill="#fceae2" opacity="0.8" />
                    </g>
                    <!-- Middle Tip -->
                    <g>
                        <path d="M 515 260 C 540 250, 550 265, 535 280 C 525 290, 510 280, 515 260 Z" />
                        <ellipse cx="540" cy="265" rx="3" ry="6" transform="rotate(-15 540 265)" fill="#fceae2" opacity="0.8" />
                    </g>
                    <!-- Ring Tip -->
                    <g>
                        <path d="M 515 320 C 535 310, 545 325, 530 340 C 520 350, 510 340, 515 320 Z" />
                        <ellipse cx="535" cy="325" rx="3" ry="6" transform="rotate(-10 535 325)" fill="#fceae2" opacity="0.8" />
                    </g>
                </g>

            </g>

            <!-- 3. LIGHTING & POLISH -->
            
            <!-- CONTACT SHADOWS (Crucial for grounding) -->
            <g style="mix-blend-mode: multiply;" fill="#000" opacity="0.7">
                <!-- Thumb cast shadow on screen -->
                <ellipse cx="320" cy="400" rx="30" ry="15" transform="rotate(-30 320 400)" filter="url(#contactBlur)" />
                
                <!-- Fingers cast shadow on right edge -->
                <path d="M 520 200 L 540 205 L 530 230 L 510 225 Z" filter="url(#contactBlur)" />
                <path d="M 520 260 L 545 265 L 535 290 L 510 285 Z" filter="url(#contactBlur)" />
                <path d="M 520 320 L 540 325 L 530 350 L 510 345 Z" filter="url(#contactBlur)" />
            </g>

            <!-- SCREEN GLOW (Emissive Light) -->
            <!-- Light from screen hitting the thumb and fingers -->
            <g style="mix-blend-mode: screen;" fill="url(#screenLight)">
                <!-- Glow on Thumb Tip -->
                <path d="M 310 375 C 290 360, 270 380, 280 400 C 290 420, 310 410, 320 395 Z" opacity="0.8" />
                
                <!-- Glow on Fingertips -->
                <path d="M 515 200 C 535 190, 545 205, 530 220 C 520 230, 510 220, 515 200 Z" opacity="0.6" />
                <path d="M 515 260 C 540 250, 550 265, 535 280 C 525 290, 510 280, 515 260 Z" opacity="0.6" />
            </g>

            <!-- RIM LIGHTS (Environment Reflection) -->
            <!-- Cool blueish rim light from top-left to define edges -->
            <g style="mix-blend-mode: screen;" stroke="#aaccff" stroke-width="1.5" fill="none" opacity="0.4">
                <!-- Phone Top Edge -->
                <path d="M 286 56 L 514 56" filter="url(#contactBlur)" />
                <!-- Phone Left Edge (Subtle) -->
                <path d="M 286 56 L 286 544" opacity="0.2" filter="url(#contactBlur)" />
                
                <!-- Knuckle Highlights -->
                <path d="M 330 380 Q 340 390 330 400" stroke="#fff" stroke-width="1" opacity="0.6" />
            </g>

        </svg>
    </div>

</body>
</html>
